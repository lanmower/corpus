    tags: [psychiatry, depression, diagnosis, mnemonic, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What symptoms suggest pneumonia as the cause of fever?"
    back: "Cough and pleuritic chest pain\n\nPneumonia is a common cause of fever with respiratory symptoms. Pleuritic chest pain suggests pleural involvement."
    difficulty: easy
    tags: [fever, pneumonia, respiratory, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the 9 M-SIGECAPS symptoms of major depressive disorder?"
    back: "Depressed Mood, Sleep (increased/decreased), Interest (decreased), Guilt, Energy (decreased), Concentration (decreased), Appetite (increased/decreased), Psychomotor agitation/retardation, Suicidal ideation\n\nM-SIGECAPS is the mnemonic for MDD diagnostic criteria. At least 5 symptoms must be present for ≥2 weeks for diagnosis."
    difficulty: medium
    tags: [psychiatry, depression, diagnosis, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What symptoms suggest pneumonia when evaluating fever?"
    back: "Cough, pleuritic chest pain\n\nPneumonia presents with respiratory symptoms including cough and pleuritic chest pain."
    difficulty: easy
    tags: [Fever, Pneumonia, Respiratory, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the mnemonic for SSRI side effects (M-SIGECAPS)?"
    back: "M: Depressed Mood, S: Increased/decreased Sleep, I: Increased/decreased Appetite, G: Guilt, E: Energy loss, C: Concentration problems, A: Psychomotor agitation/retardation, P: Suicidal ideation, S: Somatic symptoms\n\nM-SIGECAPS is the mnemonic for symptoms of major depressive disorder and also reflects SSRI side effects."
