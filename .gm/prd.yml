- id: checkin-graceful-unavailable
  title: session-overview fires before model ready (app.js:362); on WebGPU-less device it emits unavailable with console-only failure and no UI. Surface a graceful 'coach unavailable' note; keep markCheckedIn un-consumed (already correct).
  phase: EXECUTE
