# Psychiatry Sleep (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What are the sleep changes associated with depression?"
    back: "Depression is associated with: decreased delta (slow-wave, deep) sleep; decreased REM latency (enters REM sleep faster than normal); increased REM density.\n\nThese sleep architecture changes are measurable on polysomnography and are important in understanding the neurobiology of depression. Neurotransmitters implicated in psychiatric illness also regulate sleep: increased ACh and decreased monoamine activity are associated with greater REM sleep, while decreased adrenergic and cholinergic activity is associated with NREM sleep."
    difficulty: medium
    tags: [depression, sleep, REM latency, slow wave sleep, sleep architecture]
  - front: "What are evidence-based sleep hygiene recommendations?"
    back: "Wake up and go to bed at the same time daily (including weekends); avoid long wakefulness in bed; use bed only for sleep and sex (not reading, TV, work); avoid screens (smartphones, iPads) in the hour before bed; avoid napping; reduce/stop alcohol, caffeine, drugs; exercise ≥3–4x/week (but not in the evening if it disrupts sleep.\n\nSleep hygiene is a simple, effective, but often underutilized intervention. It forms the basis of CBT for insomnia (CBT-I), which is considered first-line treatment for chronic insomnia. These behavioural principles target conditioned arousal and circadian misalignment."
    difficulty: easy
    tags: [sleep hygiene, insomnia, CBT-I, sleep disorders]
  - front: "What is the first-line treatment for chronic insomnia, and what pharmacological options are preferred?"
    back: "First-line: Cognitive behavioural therapy for insomnia (CBT-I). Pharmacological (preferred over benzodiazepines): non-benzodiazepines ('z-drugs': zopiclone/eszopiclone/zolpidem, lemborexant, low-dose doxepin) — effective for short-term use but must be regularly re-evaluated as long-term use causes dependency. Avoid benzodiazepines: risk of abuse/dependence, rebound insomnia, cognitive impairment, daytime somnolence, suppresses deep and REM sleep. Off-label options for comorbid psychiatric symptoms: trazodone, mirtazapine, quetiapine; for comorbid pain: low-dose amitriptyline.\n\nLemborexant is an orexin receptor antagonist that reduces wake drive rather than increasing sleep drive — a novel mechanism. Avoid lemborexant in narcolepsy or cataplexy. Common z-drug side effect: bitter metallic taste (improved by acidic foods like orange juice). Screen for complex sleep behaviours before and after prescribing sleep medications."
    difficulty: medium
    tags: [insomnia, CBT-I, z-drugs, zopiclone, lemborexant, sleep disorders]
