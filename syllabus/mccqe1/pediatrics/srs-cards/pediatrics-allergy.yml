# Pediatrics Allergy (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What did the LEAP trial demonstrate about peanut allergy prevention?"
    back: "LEAP trial (NEJM 2015): RCT of 640 infants aged 4-11 months with severe eczema, egg allergy, or both. Randomized to peanut consumption vs. avoidance until age 60 months. Result: peanut allergy developed in only 1.9% of the consumption group vs. 13.7% of the avoidance group. Conclusion: Early peanut consumption significantly reduces the prevalence of peanut allergy — peanut avoidance increases allergy risk.\n\nThe LEAP trial fundamentally changed allergy prevention guidelines. Current Canadian and international guidelines now recommend early introduction of peanuts in high-risk infants (those with severe eczema or egg allergy) starting at 4-6 months to prevent peanut allergy. This is the opposite of previous 'avoidance' strategies. The IMPACT trial further showed that peanut oral immunotherapy in 1-3 year olds can induce desensitization (71%) and remission (21%)."
    difficulty: medium
    tags: [pediatrics, allergy, peanut, LEAP-trial, prevention, evidence-based-medicine]
