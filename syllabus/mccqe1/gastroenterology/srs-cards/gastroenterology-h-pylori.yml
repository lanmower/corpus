# Gastroenterology H Pylori (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is the diagnostic approach to H. pylori infection? List the tests, their sensitivity/specificity, and key limitations."
    back: "Non-invasive tests:\n- Urea breath test: sensitivity 90–100%, specificity 89–100%. Affected by PPI therapy (false negatives); hold PPI ≥2 weeks before test.\n- Serology: sensitivity 88–99%, specificity 89–95%. Does NOT distinguish active vs. past infection; should NOT be used for post-eradication status. Can remain positive after treatment.\n- Fecal antigen: only rarely used in clinical practice.\n\nInvasive tests (require endoscopy):\n- Histology: sensitivity 93–99%, specificity 95–99%; gold standard; affected by PPI (false negatives)\n- Rapid urease test (on biopsy): sensitivity 89–98%, specificity 93–100%; rapid\n- Microbiology culture: sensitivity 98%, specificity 95–100%; not widely available; used for antibiotic susceptibility testing (research only)\n\nThe urea breath test is the preferred non-invasive test for both diagnosis and test of cure (not serology). PPIs must be held ≥2 weeks and antibiotics/bismuth ≥4 weeks before test of cure with urea breath test or stool antigen test."
    difficulty: medium
    tags: [H. pylori, urea breath test, serology, rapid urease test, diagnosis, gastroenterology]
  - front: "What is the first-line H. pylori eradication regimen in Canada?"
    back: "Bismuth quadruple therapy for 14 days (recommended first-line):\n- PPI (e.g. lansoprazole 30 mg BID)\n- Bismuth 525 mg QID\n- Metronidazole 500 mg QID\n- Tetracycline 500 mg QID\n\nAlternative — Concomitant non-bismuth quadruple therapy for 14 days:\n- PPI + amoxicillin + metronidazole + clarithromycin\n\nTest of cure: urea breath test or stool antigen test (not serology) for all patients treated for H. pylori. Hold PPI >2 weeks and antibiotics/bismuth >4 weeks before test of cure.\n\nBismuth quadruple therapy is preferred due to rising clarithromycin resistance in Canada. The 14-day duration is more effective than 7-day courses. Test of cure is mandatory for all treated patients to confirm eradication and prevent complications."
    difficulty: medium
    tags: [H. pylori, eradication, bismuth quadruple therapy, PPI, test of cure, gastroenterology]
  - front: "What are the epidemiological features of H. pylori infection in Canada?"
    back: "- H. pylori affects approximately 20% of Canadians\n- Increased prevalence in Indigenous populations and immigrants from developing countries\n- Highest prevalence in those raised during the 1930s\n- Infection most commonly acquired in childhood, presumably by fecal-oral route\n- High prevalence associated with developing countries, low socioeconomic status, poor sanitation, and overcrowding\n\nThe Canadian-specific data is important for the MCCQE1. The cohort effect (higher prevalence in those raised in the 1930s) reflects historical sanitation conditions. Understanding transmission guides public health interventions, particularly in high-risk communities."
    difficulty: easy
    tags: [H. pylori, epidemiology, Canada, Indigenous populations, fecal-oral, gastroenterology]
  - front: "What outcomes are associated with H. pylori infection if left untreated?"
    back: "- Asymptomatic (non-erosive) gastritis initially occurs in all patients\n- Peptic ulcer in 15% of patients\n- Gastric carcinoma or MALT lymphoma in 0.5% of patients\n- Most are asymptomatic\n\nAntral gastritis (15% of patients): high gastric acid, associated with duodenal ulcer, may progress to duodenal metaplasia.\nPangastritis (85% of patients): low gastric acid, associated with stomach ulcer and cancer.\n\nH. pylori eradication prevents recurrence of PUD and reduces the risk of gastric cancer. A 2018 NEJM RCT showed that H. pylori eradication after subtotal gastrectomy for gastric cancer reduced metachronous cancer incidence (7.2% vs 13% control), but did not completely eliminate the risk, suggesting eradication cannot fully reverse established carcinogenic processes."
    difficulty: medium
    tags: [H. pylori, MALT lymphoma, gastric cancer, duodenal ulcer, outcomes, gastroenterology]
