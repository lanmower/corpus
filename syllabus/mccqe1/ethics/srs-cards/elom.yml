# Elom (Ethics) - generated from srs-mccqe1
cards:
  - front: "What are the five principles of the Canada Health Act?"
    back: "Public administration, Comprehensiveness, Universality, Portability, Accessibility.\n\nThe Canada Health Act (1984) establishes the conditions provinces must meet to receive federal health transfer payments. All five principles must be satisfied: publicly administered, covering all medically necessary services, available to all eligible residents, portable across provinces, and accessible without financial barriers."
    difficulty: easy
    tags: [ELOM, Canadian healthcare system, health policy]
  - front: "What are the four basic requirements of valid consent in Canadian medical law?"
    back: "Voluntary, Capacity, Specific, Informed.\n\nValid consent requires the patient gives it freely without coercion (voluntary), has the ability to understand and appreciate the decision (capacity), consents to the specific procedure and provider (specific), and has been given sufficient information about risks, benefits, and alternatives (informed)."
    difficulty: easy
    tags: [ELOM, consent, medical law]
  - front: "What are the four principles of medical ethics (principlism)?"
    back: "Autonomy, Beneficence, Non-maleficence, Justice.\n\nAutonomy respects patients' right to make their own decisions. Beneficence obligates acting in the patient's best interest. Non-maleficence is the duty to avoid causing harm (primum non nocere). Justice requires fair distribution of benefits and harms regardless of social factors."
    difficulty: easy
    tags: [ELOM, medical ethics]
  - front: "In Ontario, what is the hierarchy of substitute decision-makers (SDMs) when a patient lacks capacity?"
    back: "1) Court-appointed guardian, 2) Attorney for personal care (POA), 3) Representative appointed by CCB, 4) Spouse/partner, 5) Child/parent, 6) Sibling, 7) Other relative, 8) Public guardian and trustee.\n\nThe Health Care Consent Act (HCCA) in Ontario specifies a hierarchy of SDMs. Legally appointed guardians take priority over automatic SDMs. The SDM must act according to previously expressed wishes or, if unknown, in the patient's best interest."
    difficulty: medium
    tags: [ELOM, consent, capacity, SDM]
  - front: "What are the mandatory statutory reporting obligations that override patient confidentiality in Canada?"
    back: "1) Suspected child abuse/neglect, 2) Fitness to drive, 3) Communicable diseases, 4) Improper conduct of other health professionals, 5) Vital statistics (births/deaths), 6) Reporting to coroners.\n\nLegislation defines specific instances where public interest overrides patient confidentiality. Failure to report can result in prosecution, penalty, and liability if a third party is harmed. The specific requirements vary by province."
    difficulty: easy
    tags: [ELOM, confidentiality, reporting obligations]
  - front: "What are the criteria for Medical Assistance in Dying (MAID) eligibility under Bill C-14?"
    back: "Eligible for publicly-funded health services in Canada, at least 18 years old with capacity, grievous and irremediable medical condition in advanced state of irreversible decline, suffering intolerable to the patient and not relieved under conditions they consider acceptable.\n\nBill C-14 (2016) legalized MAID. The 2021 update eliminated the requirement that natural death be reasonably foreseeable. For patients whose death is not reasonably foreseeable, a minimum 90-day assessment period applies. MAID eligibility for solely mental illness is postponed to March 2027 (Bill C-62)."
    difficulty: medium
    tags: [ELOM, MAID, end-of-life care]
  - front: "What conditions must be met to invoke the duty to warn/protect regarding a dangerous patient?"
    back: "1) Imminent risk, 2) To an identifiable person or group, 3) Of serious bodily harm or death.\n\nWhen a patient reveals intent to harm a specific, identifiable person or group with a concrete plan and available means, the physician should notify police and potentially the victim. Canadian courts have not imposed a mandatory duty to warn, but CMA Code of Ethics and some regulatory authorities may require it."
    difficulty: medium
    tags: [ELOM, duty to warn, confidentiality]
  - front: "What four elements comprise negligence/malpractice in medical law?"
    back: "1) Duty of care existed (physician-patient relationship), 2) Breach of the standard of care, 3) Causation (breach caused harm), 4) Damages (harm occurred to the patient).\n\nThe standard of care is defined as what a reasonable, prudent physician of the same training and experience would provide under similar circumstances. The onus of proof rests with the plaintiff. An error of care is not automatically negligence — errors can occur even with reasonable care."
    difficulty: medium
    tags: [ELOM, negligence, malpractice, medical law]
  - front: "What is Jordan's Principle in Canadian healthcare?"
    back: "A legal obligation that First Nations children receive prompt and equitable access to healthcare services, with payment disputes between federal and provincial governments settled later.\n\nJordan Anderson was a First Nations child who spent two unnecessary years in hospital because governments disputed who should pay for his home care. He died at age 5 without going home. In 2016, the Canadian Human Rights Tribunal found Canada was discriminating against First Nations children by failing to implement Jordan's Principle."
    difficulty: easy
    tags: [ELOM, Indigenous health, Jordans Principle]
  - front: "What is the difference between capacity and competence in Canadian medical law?"
    back: "Capacity: clinical determination by the treating physician — the ability to understand information relevant to a treatment decision AND appreciate the reasonably foreseeable consequences. Competence: legal determination made by the courts. Capacity is decision-specific and time-specific; a patient may be capable for one decision but not another.\n\nA patient is presumed capable unless evidence suggests otherwise. Disagreement with medical advice does NOT determine incapacity. Capacity assessment requires the patient to: understand the medical problem and proposed treatment, understand alternatives, appreciate consequences of accepting/refusing treatment, and make a decision not substantially based on delusions."
    difficulty: medium
    tags: [ELOM, capacity, competence, consent]
