# Toxicology (EmergencyMedicine) - generated from srs-mccqe1
cards:
  - front: "A 35-year-old with acetaminophen overdose presents 6 hours after ingestion with nausea and vomiting. What is the mechanism of hepatotoxicity and the treatment?"
    back: "Mechanism: high-dose acetaminophen saturates glucuronidation/sulfation pathways, leading to formation of toxic metabolite NAPQI which covalently binds hepatocyte membranes. Treatment: N-acetylcysteine (NAC) - most effective within 8-10 hours but should be given regardless of timing.\n\nAcetaminophen toxicity requires 10-15 g in healthy individuals or 4-6 g in those with depleted glutathione (alcoholism, malnutrition). NAC promotes hepatic glutathione regeneration. No fatal outcomes recorded when NAC given before transaminase elevation."
    difficulty: medium
    tags: [toxicology, hepatology, pharmacology, emergency-medicine]
  - front: "What is the acetaminophen overdose treatment protocol?"
    back: "N-acetylcysteine (NAC) PO or IV, most effective within 8-10 hours of ingestion but should be given regardless of timing. Also: gastric lavage if <2 hours, activated charcoal. Use Rumack-Matthew nomogram for decision.\n\nToxic dose: 10-15g in healthy adults, 4-6g with depleted glutathione (alcohol use, malnutrition). NAC promotes hepatic glutathione regeneration. No fatal outcomes recorded if NAC given before transaminase rise. Presentation: N/V (0-24h) → asymptomatic (24-48h) → hepatic necrosis (>48h)."
    difficulty: medium
    tags: [toxicology, emergency medicine, acetaminophen]
