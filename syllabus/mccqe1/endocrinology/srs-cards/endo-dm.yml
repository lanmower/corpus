  - front: "Why is metformin considered first-line therapy for overweight patients with T2DM?"
    back: "Metformin reduces HbA1c (7.4% vs 8.0%) and decreases risk of diabetes-related endpoints (32%, P=0.002), diabetes-related death (42%, P=0.017), and all-cause mortality (36%, P=0.011) with less weight gain and hypoglycemia than sulfonylureas or insulin.\n\nUKPDS 34 (n=753 overweight patients) showed metformin was superior to sulfonylureas/insulin for any diabetes-related endpoint (P=0.0034), all-cause mortality (P=0.021), and stroke (P=0.032)."
    difficulty: hard
    tags: [diabetes, T2DM, metformin, clinical-trials, UKPDS, first-line-therapy, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In the DCCT, what was the major downside of intensive insulin therapy in T1DM?"
    back: "Intensive therapy was associated with a significant increase in severe hypoglycemia episodes.\n\nWhile intensive treatment reduced microvascular complications, the trade-off was more frequent severe hypoglycemic events requiring assistance."
    difficulty: medium
