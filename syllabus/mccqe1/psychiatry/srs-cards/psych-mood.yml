    tags: [psychiatry, pharmacology, SSRI, depression, pediatrics, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is a notable advantage of paroxetine among SSRIs?"
    back: "It has a short half-life allowing for quick discontinuation\n\nParoxetine has the shortest half-life among SSRIs, which can be advantageous when quick discontinuation is needed."
    difficulty: medium
    tags: [psychiatry, pharmacology, SSRI, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
