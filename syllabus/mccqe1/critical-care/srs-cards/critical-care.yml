# Critical Care (Critical Care) - generated from srs-mccqe1
cards:
  - front: "What is Beck's triad in cardiac tamponade?"
    back: "Hypotension, distended neck veins (elevated JVP), and muffled heart sounds.\n\nBeck's triad is the classic presentation of cardiac tamponade where pericardial fluid accumulation impairs ventricular filling. It results in decreased cardiac output (hypotension), impaired venous return (JVP elevation), and dampened heart sounds through the fluid-filled pericardium."
    difficulty: easy
    tags: [critical-care, cardiac-tamponade]
  - front: "What is the immediate management of tension pneumothorax?"
    back: "Needle thoracostomy with large bore needle at the 2nd intercostal space (ICS), mid-clavicular line, or finger thoracostomy. Definitive management is a chest tube.\n\nTension pneumothorax is a clinical diagnosis that should not be delayed for imaging. The one-way valve mechanism causes progressive accumulation of air in the pleural space, leading to mediastinal shift and cardiovascular collapse. Immediate decompression is life-saving."
    difficulty: easy
    tags: [critical-care, tension-pneumothorax]
  - front: "What are the clinical findings of tension pneumothorax?"
    back: "Respiratory distress, tachycardia, hypoxia, distended neck veins, cyanosis, asymmetry of chest wall motion, tracheal deviation away from pneumothorax, hyperresonance on percussion, and unilateral absence of breath sounds.\n\nTension pneumothorax occurs when a one-way valve causes progressive air accumulation in the pleural space. The increasing pressure shifts the mediastinum away from the affected side and compresses the contralateral lung and great vessels, causing hemodynamic compromise."
    difficulty: easy
    tags: [critical-care, tension-pneumothorax]
  - front: "What defines a massive hemothorax and what is its management?"
    back: "Greater than 1500 cc blood loss in the chest cavity. Management includes restoring blood volume and chest tube insertion. Thoracotomy is indicated if >1500 cc total blood loss or >200 cc/hr continued drainage.\n\nMassive hemothorax presents with pallor, flat neck veins, shock, absent breath sounds, and unilateral dullness. On supine CXR, the entire lung appears radiopaque as blood spreads over the posterior thoracic cavity. Urgent surgical intervention may be needed for ongoing hemorrhage."
    difficulty: medium
    tags: [critical-care, hemothorax]
  - front: "What is Cushing's response (Cushing's triad) and what does it indicate?"
    back: "Bradycardia, hypertension, and irregular respirations. It indicates increasing intracranial pressure (ICP).\n\nCushing's response is a late and ominous sign of critically elevated ICP. The brainstem compression triggers sympathetic activation causing hypertension, with reflex bradycardia via baroreceptors. Irregular respirations reflect progressive brainstem dysfunction."
    difficulty: easy
    tags: [critical-care, increased-ICP]
  - front: "What is the target pCO2 when hyperventilating a patient with raised ICP, and why?"
    back: "Target pCO2 of 30-35 mmHg. Hyperventilation causes cerebral vasoconstriction, reducing cerebral blood volume and thereby lowering ICP.\n\nThis is a temporizing measure for acute ICP crisis. CO2 is a potent cerebral vasodilator, so lowering pCO2 through hyperventilation constricts cerebral arteries. However, excessive hyperventilation below 30 mmHg can cause ischemia and should be avoided."
    difficulty: medium
    tags: [critical-care, increased-ICP]
  - front: "What osmotic agents can be used to treat raised ICP?"
    back: "Mannitol 1 g/kg infused rapidly (contraindicated in shock/renal failure) or 3 mL/kg of hypertonic (3%) saline.\n\nBoth agents create an osmotic gradient that draws water from brain tissue into the intravascular space, reducing cerebral edema and ICP. Mannitol is avoided in shock because it acts as an osmotic diuretic and can worsen hypotension. Hypertonic saline is preferred in hypotensive patients."
    difficulty: medium
    tags: [critical-care, increased-ICP]
  - front: "Differentiate neurogenic shock from spinal shock."
    back: "Neurogenic shock is loss of vasomotor and sympathetic tone causing hypotension, bradycardia, and poikilothermia (occurs at T6 or above, lasts up to 6 weeks). Spinal shock is the absence of all voluntary and reflex activity below the level of injury (flaccid paralysis, absent reflexes, no sensation), lasting days to months.\n\nThese are two distinct entities that occur after spinal cord injury. Neurogenic shock is a cardiovascular phenomenon due to loss of sympathetic outflow, while spinal shock is a neurological phenomenon reflecting temporary loss of spinal cord function below the injury level."
    difficulty: medium
    tags: [critical-care, spinal-cord-injury, shock]
  - front: "How is neurogenic shock managed?"
    back: "Maintain sBP >100 mmHg with volume infusion, consider vasopressors, atropine for bradycardia, maintain normothermia and euglycemia, and provide airway support.\n\nNeurogenic shock results from loss of sympathetic tone after spinal cord injury at T6 or above. The unopposed parasympathetic activity causes bradycardia and vasodilation. Fluids alone are often insufficient, so vasopressors (alpha-agonists) may be needed to restore vascular tone."
    difficulty: medium
    tags: [critical-care, neurogenic-shock]
  - front: "What is autonomic dysreflexia, what triggers it, and how is it managed?"
    back: "A condition in patients with SCI at T6 or above, characterized by pounding headache, nasal congestion, apprehension, visual changes, and dangerously elevated BP. Common triggers: bladder distention, UTI, kidney stones, fecal impaction, bowel distension. Management: monitor and control BP, then address the causative issue.\n\nIn autonomic dysreflexia, a noxious stimulus below the level of injury triggers massive sympathetic discharge that cannot be modulated due to the cord lesion. This is a medical emergency because the severe hypertension can cause stroke, seizures, or death if not promptly treated."
    difficulty: hard
    tags: [critical-care, spinal-cord-injury, autonomic-dysreflexia]
  - front: "What is the definition and management of status epilepticus?"
    back: "Continuous or intermittent seizure activity for >5 minutes without regaining consciousness. Management: protect airway, benzodiazepine (lorazepam 2 mg IV up to 10 mg or midazolam 5 mg IM up to 10 mg), IV glucose if <3 mmol/L, vasopressor support if sBP <90 or MAP <70 after fluids. If refractory: phenytoin 20 mg/kg IV, then phenobarbital, midazolam infusion, or propofol with intubation.\n\nStatus epilepticus is a neurological emergency with significant morbidity and mortality. Early aggressive treatment with benzodiazepines is critical. Refractory status epilepticus requires ICU admission with continuous EEG monitoring and often requires intubation for airway protection."
    difficulty: hard
    tags: [critical-care, status-epilepticus]
  - front: "What is pulsus paradoxus and in what condition is it classically seen?"
    back: "A drop in systolic BP of >10 mmHg with inspiration. It is classically seen in cardiac tamponade.\n\nWhile BP normally drops slightly with inspiration, in tamponade the rigid pericardial effusion exaggerates interventricular dependence. Right ventricular filling during inspiration causes the septum to bow into the left ventricle, reducing LV output. Pulsus paradoxus can also be seen in severe asthma and constrictive pericarditis."
    difficulty: medium
    tags: [critical-care, cardiac-tamponade]
  - front: "What percentage of chest injuries can be managed non-surgically, and what are the key interventions?"
    back: "80% of all chest injuries can be managed non-surgically with simple measures such as intubation, chest tubes, and pain control.\n\nThis is an important principle in trauma management. While chest injuries are responsible for 50% of trauma deaths, the majority can be managed with relatively straightforward interventions rather than thoracotomy. Adequate pain control is especially important to prevent splinting and respiratory complications."
    difficulty: easy
    tags: [critical-care, chest-trauma]
  - front: "What is a flail chest and why is it dangerous?"
    back: "A free-floating segment of chest wall due to >2 rib fractures, each at 2 sites. The danger is not the paradoxical movement itself but the underlying lung contusion, which is the main cause of morbidity and mortality.\n\nFlail chest causes paradoxical chest wall movement during respiration. The underlying pulmonary contusion leads to impaired gas exchange, and the pain from multiple fractures causes splinting and hypoventilation. Management focuses on adequate oxygenation/ventilation, possible intubation, and analgesia."
    difficulty: medium
    tags: [critical-care, chest-trauma, flail-chest]
  - front: "When should a patient with head injury be intubated based on GCS?"
    back: "GCS < 8 requires intubation.\n\nA GCS below 8 indicates severe traumatic brain injury with inability to protect the airway. The mnemonic 'GCS less than 8, intubate' is a fundamental trauma principle. Any change in GCS score of 3 or more also signifies serious injury requiring reassessment."
    difficulty: easy
    tags: [critical-care, head-injury, airway-management]
  - front: "What is the first-line vasopressor for cardiogenic shock in acute decompensated heart failure with sBP <90 mmHg?"
    back: "Norepinephrine is the first-line agent. Dobutamine or epinephrine may be added. Milrinone is helpful in refractory cases.\n\nNorepinephrine provides both alpha-1 mediated vasoconstriction and beta-1 cardiac stimulation. Current evidence supports norepinephrine over dopamine as it is associated with fewer arrhythmias. Dobutamine provides additional inotropic support without significant vasoconstriction."
    difficulty: medium
    tags: [critical-care, cardiogenic-shock, vasopressors]
  - front: "What are the indications for non-invasive positive pressure ventilation (NIPPV) in COPD exacerbation?"
    back: "Severe distress or signs of fatigue, arterial pH <7.35, or hypercapnia. CPAP or Bi-PAP is applied.\n\nNIPPV reduces the work of breathing and improves gas exchange in acute COPD exacerbations. It has been shown to reduce the need for intubation and decrease mortality. If NIPPV fails or is not tolerated (e.g., decreased LOC, vomiting), intubation and mechanical ventilation are required."
    difficulty: medium
    tags: [critical-care, COPD, ventilation]
  - front: "What is the management of anaphylaxis with severe wheezing, laryngeal edema, and shock?"
    back: "ABCs with definitive airway management, epinephrine 1:1000 IV infusion 1-10 mcg/min titrated to effect, diphenhydramine 50 mg IV, methylprednisolone 125-250 mg IV, large volume crystalloid resuscitation, and removal of trigger.\n\nSevere anaphylaxis is a medical emergency requiring immediate epinephrine. There are no absolute contraindications to epinephrine in anaphylaxis. Patients on beta-blockers may not respond and may benefit from glucagon. Biphasic reactions can occur up to 72 hours later."
    difficulty: hard
    tags: [critical-care, anaphylaxis]
  - front: "In the Bi-PAP/CPAP management of acute CHF, what is the preferred modality?"
    back: "Bi-PAP is preferred over CPAP for acute decompensated heart failure.\n\nBi-PAP provides both inspiratory and expiratory positive pressure, which reduces preload through increased intrathoracic pressure, decreases work of breathing, and improves oxygenation. In severe CHF, if Bi-PAP fails, intubation and mechanical ventilation may be required, though this is rare."
    difficulty: medium
    tags: [critical-care, CHF, ventilation]
  - front: "What is the FAST exam and what are its four areas of assessment?"
    back: "Focused Assessment with Sonography for Trauma. Four areas: 1) Subxiphoid pericardial window, 2) Perisplenic (LUQ), 3) Hepatorenal/Morrison's pouch (RUQ), 4) Pelvic/retrovesical (Pouch of Douglas).\n\nFAST identifies free fluid in the peritoneal cavity and pericardium. It is rapid (<5 min) and can be repeated serially. Limitations include false positives with ascites, and false negatives with small amounts of blood, retroperitoneal bleeding, or obesity. A positive FAST in an unstable trauma patient may indicate need for laparotomy."
    difficulty: easy
    tags: [critical-care, trauma, FAST-exam]
