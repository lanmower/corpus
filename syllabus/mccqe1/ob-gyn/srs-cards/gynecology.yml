# Gynecology (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What are the most common causes of primary amenorrhea?"
    back: "1. Gonadal dysgenesis (e.g., Turner syndrome 45,X0) — most common overall\n2. Functional hypothalamic amenorrhea\n3. Müllerian agenesis (MRKH syndrome)\n\nPrimary amenorrhea is defined as no menses by age 13 without secondary sexual characteristics, or by age 15 with secondary sexual characteristics. Turner syndrome (45,X0) is the most common cause, presenting with streak gonads and elevated FSH."
    difficulty: medium
    tags: [gynecology, amenorrhea, endocrinology]
  - front: "What is the most common cause of secondary amenorrhea?"
    back: "Pregnancy (must be ruled out first). Among non-pregnant patients, functional hypothalamic amenorrhea is the most common cause.\n\nSecondary amenorrhea is the absence of menses for >6 months or 3 cycles after documented menarche. A beta-hCG must always be the first investigation. Functional hypothalamic amenorrhea is often related to stress, excessive exercise, and/or anorexia."
    difficulty: easy
    tags: [gynecology, amenorrhea]
  - front: "How is the progesterone withdrawal challenge interpreted in the workup of amenorrhea?"
    back: "Medroxyprogesterone 10 mg PO daily x 10-14 days. A positive withdrawal bleed (within 2-7 days) indicates adequate estrogen and a patent outflow tract. No bleeding suggests hypoestrogenism, excessive androgens/progesterone, pregnancy, or structural causes (e.g., Asherman syndrome).\n\nThe progesterone challenge assesses whether the endometrium has been primed by estrogen. Withdrawal of progesterone from an estrogen-primed endometrium causes shedding and bleeding. Absence of bleeding narrows the differential considerably."
    difficulty: medium
    tags: [gynecology, amenorrhea, investigations]
  - front: "What is the most common cause of postmenopausal bleeding, and what must always be ruled out?"
    back: "Most common cause: genitourinary syndrome of menopause (vaginal atrophy). Must rule out: endometrial cancer and hyperplasia with an endometrial biopsy before treatment.\n\nWhile atrophy is the most frequent cause, postmenopausal bleeding is endometrial cancer until proven otherwise. Endometrial thickness >5 mm on transvaginal ultrasound in a postmenopausal woman is considered abnormal and warrants biopsy."
    difficulty: medium
    tags: [gynecology, postmenopausal bleeding, endometrial cancer]
  - front: "What are the '4 Dys' of endometriosis?"
    back: "1. Dysmenorrhea\n2. Dyspareunia (cul-de-sac/uterosacral ligament involvement)\n3. Dyschezia (uterosacral ligament/rectosigmoid involvement)\n4. Dysuria (bladder involvement)\n\nEndometriosis is the presence of endometrial glands and stroma outside the uterine cavity. It is a chronic condition affecting 15-30% of premenopausal patients. The 4 Dys represent the cardinal symptoms reflecting ectopic endometrial tissue causing cyclic inflammation."
    difficulty: easy
    tags: [gynecology, endometriosis]
  - front: "What is the gold standard for diagnosing endometriosis, and what are the characteristic laparoscopic findings?"
    back: "Gold standard: direct visualization at laparoscopy with biopsy. Findings: mulberry spots (dark blue/brownish-black implants), 'chocolate' cysts (endometriomas), powder-burn lesions, white lesions, clear blebs, and peritoneal pockets.\n\nHistologic confirmation requires 2 or more of: endometrial epithelium, glands, stroma, or hemosiderin-laden macrophages. However, SOGC guidelines state that surgical confirmation is NOT required before starting medical management; a suggestive history is adequate for presumptive diagnosis."
    difficulty: medium
    tags: [gynecology, endometriosis, diagnosis]
  - front: "What is the first-line medical treatment for endometriosis?"
    back: "1st line: Cyclic/continuous estrogen-progestin (OCP), progestin (Depo-Provera or dienogest/Visanne), or Mirena IUS. NSAIDs for pain. 2nd line: GnRH agonist (Lupron) or antagonist (elagolix/Orlissa, relugolix/Myfembree), or danazol.\n\nMedical management is the mainstay for endometriosis-associated pain. Surgical confirmation is not required before initiating treatment. GnRH agonists used >6 months require add-back progestin or estrogen to prevent bone mineral density loss and vasomotor symptoms."
    difficulty: medium
    tags: [gynecology, endometriosis, treatment]
  - front: "What is adenomyosis, and how does it differ from endometriosis in presentation?"
    back: "Adenomyosis is endometrial glands and stroma extending into the myometrium ('endometriosis interna'). It presents at an older age (40-50 years) vs. endometriosis (25-30 years), with a symmetrically bulky uterus usually <14 cm and Halban's sign (tender, softened uterus on premenstrual bimanual exam).\n\nAdenomyosis is found in 20-40% of hysterectomy specimens and 15% of females >35 years. Definitive diagnosis requires pathology, but clinical diagnosis supported by U/S or MRI is adequate. Treatment of choice for completed childbearing is hysterectomy."
    difficulty: medium
    tags: [gynecology, adenomyosis, endometriosis]
  - front: "What is the most common type of uterine fibroid and how are fibroids classified by the FIGO system?"
    back: "Most common: intramural (within myometrial wall). FIGO classification: Submucosal (types 0-2), Intramural (types 3-4), Subserosal (types 5-7), Cervical (type 8). Type 0 = pedunculated intracavitary, Type 7 = pedunculated subserosal.\n\nFibroids are benign smooth muscle tumours diagnosed in 40-50% of premenopausal patients >35. They are estrogen- and progesterone-responsive and typically regress after menopause. Submucosal fibroids are most likely to cause AUB and affect fertility."
    difficulty: medium
    tags: [gynecology, fibroids, leiomyoma]
  - front: "What are the absolute contraindications to combined estrogen-progestin contraceptives?"
    back: "Postpartum <4 wk (breastfeeding) or <21 d (not breastfeeding), major surgery with prolonged immobilization, pregnancy, undiagnosed vaginal bleeding, prior/active thromboembolic events, thrombophilic disorders (Factor V Leiden, protein C/S deficiency), cerebrovascular/coronary disease, estrogen-dependent tumours, acute liver disease, congenital hypertriglyceridemia, smoker >35 years, migraines with focal neurological symptoms, uncontrolled HTN.\n\nCombined hormonal contraceptives increase the risk of VTE, stroke, and hypertension. The estrogen component is responsible for most thromboembolic risk. For patients with contraindications, progestin-only methods (IUS, implant, Depo-Provera, POP) are alternatives."
    difficulty: hard
    tags: [gynecology, contraception, pharmacology]
  - front: "What is the mechanism and timing of emergency postcoital contraception with Plan B (levonorgestrel)?"
    back: "Levonorgestrel 750 μg q12h x 2 doses (can take both together). Mechanism: suppresses ovulation, causes deficient luteal phase, alters endometrium/sperm transport. Use within 72h (ideally 24h), can use up to 5 days. 75-95% effective within 24h. Less effective if >75 kg, not recommended if >80 kg.\n\nPlan B has greater efficacy and fewer side effects than the Yuzpe method because it lacks estrogen. Ulipristal (Ella) is a selective progesterone receptor modulator effective up to 5 days and may delay ovulation by up to 5 days. Copper IUD is the most effective EPC (99.9%, up to 7 days)."
    difficulty: medium
    tags: [gynecology, contraception, emergency contraception]
  - front: "What is the medical abortion regimen and up to what gestational age is it the gold standard?"
    back: "Gold standard up to 9 weeks GA. Mifepristone 200 mg PO on day 1 (progesterone receptor blocker) + misoprostol 800 μg PV/buccal on day 2-3 (synthetic prostaglandin causing uterine contractions). 95-98% effective up to 49 days after LMP.\n\nMifepristone blocks progesterone receptors needed for early pregnancy maintenance, alters the endometrium, induces bleeding, and softens the cervix. Misoprostol causes uterine contractions and expulsion. Absolute contraindications include ectopic pregnancy and chronic adrenal failure."
    difficulty: medium
    tags: [gynecology, abortion, pharmacology]
  - front: "How do you classify spontaneous abortions, and what defines an inevitable vs. incomplete abortion?"
    back: "Inevitable: bleeding + cramping + ruptured membranes, fetus low in uterus on U/S, cervix OPEN. Incomplete: bleeding + cramps + passage of tissue, residual tissue in uterus on U/S, cervix OPEN. Key difference: passage of tissue has occurred in incomplete but not in inevitable abortion.\n\nThreatened abortion has bleeding with closed cervix and live fetus (<5% abort). Complete abortion shows empty uterus with closed cervix. Missed abortion has no fetal heart rate but no bleeding, with closed cervix. Management of all includes checking Rh status and giving Rhogam if negative."
    difficulty: medium
    tags: [gynecology, obstetrics, spontaneous abortion]
  - front: "What is the most common location for ectopic pregnancy, and what is the classic triad of presentation?"
    back: "Most common: ampullary region of fallopian tube (70%). Classic triad: abdominal pain + vaginal bleeding + amenorrhea. It is an ectopic pregnancy until proven otherwise in any patient with a uterus presenting with this triad.\n\nEctopic pregnancy occurs in 1/100 pregnancies and is the leading cause of maternal death in the first trimester. 50% are due to tubal damage from PID. Serial β-hCG levels with <35% rise every 2 days and an empty uterus on TVUS with β-hCG >2000-3000 suggest ectopic pregnancy."
    difficulty: medium
    tags: [gynecology, ectopic pregnancy, emergency]
  - front: "What are the indications and contraindications for methotrexate treatment of ectopic pregnancy?"
    back: "Dose: 50 mg/m² IM single dose. Contraindications: hemodynamic instability, tubal rupture signs, poor compliance, renal/liver dysfunction, bone marrow suppression, active pulmonary disease, peptic ulcer, immunosuppression, heterotopic pregnancy with viable IUP, breastfeeding. Cannot conceive for 3 months after due to teratogenicity.\n\nMethotrexate is a folic acid reductase inhibitor affecting rapidly dividing trophoblastic cells. Follow β-hCG on days 4 and 7, then weekly until non-detectable. Up to 25% require a second dose. Stop prenatal vitamins as folic acid decreases efficacy. Success rate is 82-95%."
    difficulty: hard
    tags: [gynecology, ectopic pregnancy, pharmacology]
  - front: "What are the Rotterdam diagnostic criteria for PCOS?"
    back: "2 of 3 required: 1) Oligomenorrhea/irregular menses for 6 months, 2) Hyperandrogenism (clinical: hirsutism/acne; or biochemical: raised free testosterone), 3) Polycystic ovaries on U/S (≥12 follicles 2-9 mm or ovarian volume >10 cc; not appropriate in adolescents).\n\nPCOS is a chronic endocrine disorder involving insulin resistance, elevated LH:FSH ratio (>2:1), and increased androgens. Long-term consequences include dyslipidemia, endometrial hyperplasia, subfertility, obesity, and sleep apnea. In adolescents, wait 1-2 years to diagnose as adolescence resembles PCOS."
    difficulty: medium
    tags: [gynecology, PCOS, endocrinology]
  - front: "What are the key distinguishing features of candidal vaginitis, bacterial vaginosis, and trichomoniasis?"
    back: "Candida: white cottage-cheese discharge, pH <4.5, KOH shows hyphae/spores, intense pruritus. BV: grey thin fishy discharge, pH >4.5, clue cells on wet mount, positive whiff test, no inflammation. Trichomoniasis: yellow-green frothy discharge, pH >4.5, motile flagellates on wet mount, cervical petechiae ('strawberry cervix').\n\nBV is not an STI but a replacement of Lactobacilli by anaerobes. Trichomoniasis IS an STI requiring partner treatment. Candida risk factors include immunosuppression, antibiotics, and increased estrogen. Metronidazole (for BV and trichomoniasis) has a disulfiram-like reaction with alcohol."
    difficulty: medium
    tags: [gynecology, vulvovaginitis, infectious disease]
  - front: "What is the treatment for chlamydia, and what are the complications of untreated infection?"
    back: "Treatment: doxycycline 100 mg PO BID x 7 days OR azithromycin 1 g PO single dose (doxycycline contraindicated in 2nd/3rd trimester). Complications: PID with low-grade salpingitis and adhesions, infertility, ectopic pregnancy, chronic pelvic pain, Fitz-Hugh-Curtis syndrome, reactive arthritis (HLA-B27), perinatal conjunctivitis and pneumonia.\n\nChlamydia trachomatis is the most common bacterial STI in Canada. 80% of patients are asymptomatic. It is often co-infected with N. gonorrhoeae. It is a reportable disease, and all sexual partners within 60 days must be tested and empirically treated."
    difficulty: medium
    tags: [gynecology, chlamydia, STI]
  - front: "What are the minimum diagnostic criteria for PID?"
    back: "Minimum criteria (all 3 required): cervical motion tenderness + uterine tenderness + adnexal tenderness. Additional criteria: oral temperature >38.3°C, leukocytosis on saline microscopy, elevated ESR/CRP, cervical infection with N. gonorrhoeae or C. trachomatis.\n\nPID is infection of the upper genital tract primarily affecting young sexually active women ages 15-25. The most common causative organisms are C. trachomatis and N. gonorrhoeae. Treatment requires polymicrobial coverage. One episode of PID causes 13% infertility, two episodes cause 36%."
    difficulty: medium
    tags: [gynecology, PID, infectious disease]
  - front: "What is the outpatient antibiotic regimen for PID?"
    back: "1st line: ceftriaxone 500 mg IM x 1 dose + doxycycline 100 mg PO BID x 14 days, OR cefoxitin 2 g IM x 1 dose + probenecid 1 g PO + doxycycline 100 mg PO BID + metronidazole 500 mg PO BID x 14 days.\n\nInpatient treatment is indicated for moderate-severe illness, adnexal/tubo-ovarian mass, failed oral therapy, immunocompromised, pregnant, or adolescent patients. Inpatient regimen includes cefoxitin 2g IV q6h + doxycycline 100 mg PO/IV q12h, continuing IV until 24h after symptom improvement."
    difficulty: hard
    tags: [gynecology, PID, treatment, antibiotics]
  - front: "What are the stages of syphilis and the treatment for primary/secondary syphilis?"
    back: "Primary: painless chancre 3-4 wk post-exposure. Secondary: maculopapular rash (palms/soles), condylomata lata, diffuse lymphadenopathy. Latent: positive serology only. Tertiary: tabes dorsalis, aortic aneurysm, gummas. Treatment (primary/secondary/<1yr latent): benzathine penicillin G 2.4 million units IM single dose.\n\nDark field microscopy is the most sensitive/specific test for primary syphilis. Non-treponemal tests (VDRL, RPR) are screening tests that become non-reactive after treatment. Treponemal tests (FTA-ABS) are confirmatory and remain reactive for life. Syphilis is a reportable disease."
    difficulty: medium
    tags: [gynecology, syphilis, STI]
  - front: "What is the average age of menopause, and what are the hallmark clinical features?"
    back: "Average age: 51 years. Features: vasomotor instability (hot flashes, night sweats, palpitations), urogenital atrophy/GUSM (dyspareunia, vaginal dryness, urinary symptoms), skeletal effects (osteoporosis), psychological symptoms (anxiety, depression, decreased libido). Pathophysiology: degenerating theca cells fail to respond to gonadotropins → decreased estrogen → increased FSH/LH.\n\nPremature ovarian insufficiency is menopause before age 40. For women >45 with menopausal symptoms, no testing is necessary. Increased FSH >35 IU/L on day 3 confirms menopause. Osteoporosis is the single most important health hazard, while cardiovascular disease is the leading cause of death post-menopause."
    difficulty: easy
    tags: [gynecology, menopause, endocrinology]
  - front: "What are the absolute contraindications to menopausal hormone therapy (MHT)?"
    back: "Acute liver disease, undiagnosed vaginal bleeding, history of or known/suspected breast cancer, known/suspected uterine cancer, acute vascular thrombosis, history of severe thrombophlebitis/thromboembolic disease, cardiovascular disease. Mnemonic: ABCD — Acute liver disease, undiagnosed Bleeding, Cancer (breast/uterine)/CVD, DVT.\n\nMHT is safest when initiated <10 years after menopause and/or <60 years old. Combined estrogen-progesterone increases breast cancer risk after 4-5 years. Estrogen alone does not increase breast cancer risk for at least 8 years. Progestin must be added for patients with intact uterus to prevent endometrial hyperplasia."
    difficulty: medium
    tags: [gynecology, menopause, hormone therapy]
  - front: "What are the stages of pelvic organ prolapse (POP-Q system)?"
    back: "Stage 0: no prolapse. Stage 1: most distal portion >1 cm above hymen. Stage 2: within 1 cm above or below hymen. Stage 3: >1 cm below hymen but <2 cm less than total vaginal length. Stage 4: complete procidentia/vault eversion.\n\nRisk factors include pregnancy, aging, decreased estrogen, increased intra-abdominal pressure, and connective tissue disorders. Conservative management includes weight loss, pelvic floor muscle training (Kegels), vaginal estrogen, and pessary. The only true pelvic hernia is vault prolapse."
    difficulty: medium
    tags: [gynecology, urogynecology, pelvic organ prolapse]
  - front: "What are the risk factors and key features of Type I vs. Type II endometrial cancer?"
    back: "Type I (80%): estrogen-related endometrioid, well-differentiated, associated with PCOS, obesity, unopposed estrogen, tamoxifen, late menopause, nulliparity. Type II (20%): non-estrogen related, includes serous/clear cell/carcinosarcoma, associated with p53 mutation, HER2 overexpression, poorer prognosis, more common in Black patients.\n\nEndometrial cancer is the most common gynecological malignancy in North America. 85-90% 5-year survival for stage I. Screening with annual endometrial sampling (age 30-35) is only for patients with HNPCC/Lynch II syndrome. Any postmenopausal bleeding requires endometrial biopsy."
    difficulty: hard
    tags: [gynecology, endometrial cancer, oncology]
  - front: "What tumour markers are used for different ovarian tumour types?"
    back: "Epithelial: CA-125 (serous/endometrioid). Sex-cord stromal: inhibin (granulosa cell). Germ cell: LDH (dysgerminoma), AFP (yolk sac tumour), β-hCG (choriocarcinoma), AFP + β-hCG (embryonal). No marker for immature teratoma.\n\nOvarian cancer causes more deaths than all other gynecologic malignancies combined. 85% are epithelial. CA-125 has only 50% sensitivity in early-stage disease, making it a poor screening test. Any adnexal mass in a postmenopausal woman should be considered malignant until proven otherwise."
    difficulty: hard
    tags: [gynecology, ovarian cancer, tumour markers]
  - front: "What is the Risk of Malignancy Index (RMI) formula for evaluating an ovarian mass?"
    back: "RMI = U × M × CA-125. U = ultrasound score (1 point each for: multilocular cyst, solid areas, metastases, ascites, bilateral); U=1 if score 0-1, U=4 if score 2-5. M = menopausal status (premenopausal M=1, postmenopausal M=4). RMI >200: gynecologic oncology referral recommended.\n\nThe RMI is the best available tool to assess likelihood of ovarian malignancy and the need for preoperative gynecologic oncology referral. Population-based screening with CA-125 and/or transvaginal ultrasound has NOT been shown to reduce ovarian cancer mortality."
    difficulty: hard
    tags: [gynecology, ovarian cancer, investigations]
  - front: "What HPV types are covered by Gardasil 9, and which types are most oncogenic?"
    back: "Gardasil 9 covers types 6, 11, 16, 18, 31, 33, 45, 52, 58. Types 6 and 11: associated with anogenital warts. Types 16 and 18: most oncogenic (classically associated with cervical HSIL). >99% of cervical cancers contain a high-risk HPV type.\n\nHPV is the most common viral STI in Canada. The vaccine should be administered before onset of sexual activity for optimal benefit but is still indicated for sexually active individuals. Condoms may not fully protect as HPV can be transmitted through areas not covered."
    difficulty: easy
    tags: [gynecology, HPV, cervical cancer, vaccination]
  - front: "What is the most important risk factor for cervical cancer in Canada?"
    back: "Poor screening uptake. At-risk groups include: immigrant Canadians, Indigenous peoples, geographically isolated Canadians, sex-trade workers, low socioeconomic status, and immunocompromised individuals.\n\nThe majority of cervical cancers are SCC (90%), with adenocarcinoma increasing (10%). The transformation zone between original and current squamocolumnar junction is where most dysplasias/cancers arise. The slow progression from dysplasia to cancer takes ~10 years on average."
    difficulty: easy
    tags: [gynecology, cervical cancer, screening]
  - front: "What differentiates a complete from a partial hydatidiform mole?"
    back: "Complete mole: diploid (46XX/46XY, all paternal), diffuse trophoblastic hyperplasia, NO fetus, 'snowstorm' on U/S, theca-lutein cysts, 15-20% risk of GTN. Partial mole: triploid (69XXX/69XXY, 1 maternal + 2 paternal sets), focal hyperplasia, fetal tissue present, <4% risk of GTN.\n\nComplete moles present with vaginal bleeding, uterine size large for dates, hyperemesis, and preeclampsia. Treatment is suction D&C. Follow-up requires serial β-hCG weekly until negative x3, then monthly for 6 months (complete) or 1 month (partial). Reliable contraception is required throughout follow-up."
    difficulty: hard
    tags: [gynecology, gestational trophoblastic disease, oncology]
  - front: "How is gestational trophoblastic neoplasia (GTN) diagnosed?"
    back: "Any of: β-hCG rise >10% over 2 weeks (3 values), β-hCG plateau (<10% change) over 3 weeks (4 values), histologic diagnosis of choriocarcinoma, metastatic disease, or β-hCG ≥20,000 mIU/mL >4 weeks post-evacuation.\n\nGTN is the malignant form of gestational trophoblastic disease. Stage I (confined to uterus) is treated with single-agent chemotherapy (actinomycin D or methotrexate) for low-risk (WHO score ≤6). High-risk (score ≥7) requires combination chemotherapy with EMA-CO. Lungs are the primary site for metastases."
    difficulty: hard
    tags: [gynecology, GTN, oncology]
  - front: "What is the Meigs syndrome triad?"
    back: "Benign ovarian tumour (typically fibroma/thecoma) + ascites + pleural effusion. The effusion and ascites resolve after tumour removal.\n\nMeigs syndrome is a paraneoplastic phenomenon associated with sex-cord stromal tumours, most commonly ovarian fibroma. It is important to distinguish from malignant ovarian tumours with ascites and pleural effusions, which carry a much worse prognosis."
    difficulty: medium
    tags: [gynecology, ovarian tumours, Meigs syndrome]
  - front: "What are the granulosa cell tumour characteristics, tumour marker, and histologic hallmark?"
    back: "Estrogen-producing tumour causing feminizing effects (precocious puberty, menorrhagia, PMB). Tumour marker: inhibin. Histologic hallmark: Call-Exner bodies (small groups of cells arranged around central cavity). Risk of concurrent endometrial cancer due to estrogen stimulation.\n\nGranulosa-theca cell tumours are sex cord-stromal tumours that may be benign or malignant. Their estrogen production can stimulate the endometrium, leading to hyperplasia and cancer. Treatment is surgical resection, with chemotherapy for unresectable metastatic disease."
    difficulty: hard
    tags: [gynecology, ovarian tumours, oncology]
  - front: "What are Krukenberg tumours?"
    back: "Metastatic ovarian tumours (usually bilateral, 80%) from GI tract (commonly stomach or colon), breast, or endometrium. Histologic hallmark: 'signet-ring' cells (mucin-filled cells that push the nucleus to the periphery).\n\nKrukenberg tumours represent 4-8% of ovarian malignancies. They are secondary tumours rather than primary ovarian cancers. The presence of bilateral ovarian masses with signet-ring cells should prompt investigation for a GI primary tumour."
    difficulty: medium
    tags: [gynecology, ovarian tumours, oncology]
  - front: "What is lichen sclerosus of the vulva, and why is monitoring important?"
    back: "Subepithelial fat loss causing thin, atrophic labia with membrane-like epithelium in a 'figure of 8' distribution. Symptoms: pruritus, dyspareunia, burning, ulceration. Most common in postmenopausal women. Treatment: high-potency topical steroid (clobetasol). Must monitor for SCC due to increased malignancy risk.\n\nLichen sclerosus is a non-neoplastic vulvar disorder that can occur at any age but is most common postmenopausally. Biopsy is often necessary to confirm diagnosis and rule out malignancy. Long-term topical steroid treatment is usually necessary."
    difficulty: medium
    tags: [gynecology, vulvar disease, dermatology]
  - front: "How do you differentiate stress urinary incontinence from overactive bladder?"
    back: "Stress incontinence: involuntary urine loss with increased intra-abdominal pressure (cough, laugh, sneeze). Overactive bladder: urgency ± urge incontinence, usually with frequency and nocturia, caused by involuntary detrusor contraction. Treatment: stress = surgery (midurethral sling); OAB = behavioral modification + anticholinergics (oxybutynin) or β-agonist (mirabegron).\n\nStress incontinence affects up to 37.5% of women, with risk factors including age, obesity, vaginal delivery, and hypoestrogenic states. OAB affects up to 22% of patients. Initial workup for both includes U/A, post-void residual, and pelvic exam assessing for prolapse."
    difficulty: medium
    tags: [gynecology, urogynecology, urinary incontinence]
  - front: "A 55-year-old postmenopausal woman asks about hormone therapy for vasomotor symptoms. What are the key benefits and risks of combined estrogen-progestin HT?"
    back: "Benefits: decreases risk of osteoporotic fractures and colorectal cancer, relieves vasomotor symptoms. Risks: increases DVT/PE risk; can increase breast cancer and stroke risk if initiated >60 years old or >10 years post-menopause.\n\nHT should not be initiated if >10 years post-menopause. The WHI trial showed overall health risks exceed benefits for combined HT. Alternatives for vasomotor symptoms include venlafaxine, SSRIs, or gabapentin."
    difficulty: medium
    tags: [gynecology, menopause, hormone-therapy, family-medicine]
  - front: "What are the four paired ligaments supporting the uterus and their primary functions?"
    back: "(1) Round ligaments: anteversion/suspension; travel through broad ligament and inguinal canal to labia majora. (2) Uterosacral ligaments: mechanical support, prevent prolapse, contain autonomic nerve fibres; arise from sacral fascia, insert into posterior inferior uterus. (3) Cardinal ligaments: mechanical support, prevent prolapse; extend from lateral pelvic walls to lateral cervix and vagina. (4) Broad ligaments: contain fallopian tube, round ligament, ovarian ligament, nerves, vessels, and lymphatics.\n\nThe round ligaments maintain uterine anteversion but are NOT the primary support against prolapse. The cardinal and uterosacral ligaments are the main supports preventing uterine prolapse and are often damaged during childbirth or surgery, leading to pelvic organ prolapse."
    difficulty: medium
    tags: [gynecology, uterine ligaments, anatomy, pelvic support, prolapse]
  - front: "What is the blood supply to the uterus, ovaries, and fallopian tubes, and what is the anatomical relationship between the ureter and uterine artery?"
    back: "Uterus: uterine artery (branch of internal iliac artery, anterior division). Ovaries: ovarian arteries (branches off aorta); left ovarian vein drains to left renal vein, right drains to IVC. Fallopian tubes: uterine and ovarian arteries. The ureter passes UNDER the uterine artery ('water under the bridge') — critical to avoid ureteral injury during hysterectomy.\n\nThe mnemonic 'water under the bridge' reminds surgeons that the ureter (water) runs inferior to the uterine artery (bridge). Ureteral injury is a known complication of hysterectomy. The round ligament contains Sampson's artery (branch of uterine artery)."
    difficulty: medium
    tags: [gynecology, anatomy, uterine artery, ureter, ovarian vessels, surgical anatomy]
  - front: "What is the lymphatic drainage of the external genitalia, and which structures drain to deep versus superficial inguinal nodes?"
    back: "Most external genitalia drain to superficial inguinal lymph nodes. The clitoris drains to deep inguinal lymph nodes. The ovaries drain via the infundibulopelvic ligament to para-aortic lymph nodes.\n\nLymphatic drainage determines spread patterns of vulvar and clitoral cancers. Clitoral melanoma or cancer may involve deep inguinal and pelvic nodes, requiring more extensive lymph node dissection compared to other vulvar cancers that primarily spread to superficial inguinal nodes."
    difficulty: hard
    tags: [gynecology, lymphatics, external genitalia, clitoris, inguinal nodes, anatomy]
  - front: "Describe the segments of the fallopian tube from medial to lateral."
    back: "From medial to lateral: (1) Interstitial (intramural) — within uterine wall; (2) Isthmic — narrow segment adjacent to uterus; (3) Ampullary — widest segment, most common site of fertilization and ectopic pregnancy; (4) Infundibular — funnel-shaped, terminates at the fimbriae.\n\nThe ampullary segment is where fertilization normally occurs. It is also the most common site of ectopic implantation (~70%). The mesosalpinx is the peritoneal fold attaching the fallopian tube to the broad ligament. Total fallopian tube length is 8-14 cm."
    difficulty: medium
    tags: [fallopian tube, anatomy, gynecology, ectopic pregnancy, fertilization]
  - front: "What is the role of the infundibulopelvic ligament (suspensory ligament of the ovary)?"
    back: "The infundibulopelvic ligament connects the ovary to the pelvic wall and contains the ovarian artery, ovarian vein, ovarian plexus, and lymphatic vessels. It is the main vascular pedicle of the ovary and must be ligated during oophorectomy.\n\nThe infundibulopelvic ligament is surgically critical — it is divided when performing salpingo-oophorectomy. The ureter runs close to this ligament and can be injured if not clearly identified. The mesovarium is a separate peritoneal fold attaching the ovary to the broad ligament."
    difficulty: medium
    tags: [ovary, anatomy, infundibulopelvic ligament, gynecology, oophorectomy]
  - front: "Summarize the hormonal events of the follicular (proliferative) phase of the menstrual cycle."
    back: "Low estrogen and progesterone from the previous cycle stimulate FSH and LH release (via GnRH pulsatility). FSH acts on ovarian granulosa cells to stimulate follicular growth in 3-30 follicles. Rising estrogen from the dominant follicle provides negative feedback on FSH (reducing it) but positive feedback just before ovulation triggers the LH surge. The endometrium proliferates under estrogen stimulation. Cervical mucus becomes clear, increased, and stringy (Spinnbarkeit 8-10 cm).\n\nThe follicular phase is variable in duration (unlike the fixed 14-day luteal phase). The switch from negative to positive feedback by estrogen at the mid-cycle peak triggers the LH surge, leading to ovulation approximately 36-48 hours later. This understanding is essential for fertility assessment and contraception counseling."
    difficulty: medium
    tags: [menstrual cycle, follicular phase, FSH, LH, estrogen, gynecology, HPO axis]
  - front: "What are the hormonal events and endometrial changes during the luteal (secretory) phase of the menstrual cycle?"
    back: "After ovulation (triggered by LH surge ~36h prior), the dominant follicle becomes the corpus luteum, which secretes progesterone and estrogen. Progesterone provides negative feedback on LH and FSH. The endometrium undergoes secretory changes (glandular secretions, cessation of mitoses). Cervical mucus becomes opaque, scant, and less stretchy (Spinnbarkeit 1-2 cm). Without fertilization, corpus luteum degenerates → progesterone withdrawal → menses.\n\nThe luteal phase has a fixed duration of 14 days (± 2 days), unlike the variable follicular phase. Progesterone is the dominant hormone, preparing the endometrium for implantation. Progesterone also raises basal body temperature by ~0.5°C (useful for fertility tracking). Corpus luteum inadequacy can cause recurrent pregnancy loss."
    difficulty: medium
    tags: [menstrual cycle, luteal phase, progesterone, corpus luteum, endometrium, gynecology]
  - front: "What are the effects of estrogen on the endometrium, follicles, and target tissues during the menstrual cycle?"
    back: "Endometrium: proliferation of glandular and stromal tissue. Ovarian follicles: reduces atresia (promotes follicle survival). Target tissues: decreases estrogen receptors (downregulation). Main hormone of the follicular/proliferative phase; stimulated by FSH; majority secreted by the dominant follicle.\n\nEstrogen's proliferative effect on the endometrium is opposed by progesterone in the luteal phase ('organize and stabilize'). Unopposed estrogen leads to endometrial hyperplasia and increases cancer risk. This is why progestin is added in postmenopausal hormone therapy for women with an intact uterus."
    difficulty: medium
    tags: [estrogen, menstrual cycle, endometrium, gynecology, HPO axis]
  - front: "What are the effects of progesterone on the endometrium and target tissues?"
    back: "Endometrium: cessation of mitoses (stops proliferation), organizes glands (initiates secretions), inhibits macrophages, interleukin-8, and degradative enzymes. Target tissues: decreases both estrogen receptors AND progesterone receptors (anti-estrogen effect). Secreted by corpus luteum; stimulated by LH.\n\nProgesterone's 'anti-estrogen' effect explains why combined oral contraceptives with progestin component reduce endometrial and ovarian cancer risk. In the absence of progesterone (anovulatory cycles, PCOS), unopposed estrogen drives endometrial hyperplasia. Progesterone also stabilizes the endometrium to prevent breakthrough bleeding."
    difficulty: medium
    tags: [progesterone, endometrium, menstrual cycle, gynecology, corpus luteum]
  - front: "What is the sequence of pubertal development in females, and what is the mnemonic to remember it?"
    back: "Mnemonic 'Boobs, Pubes, Grow, Flow': (1) Thelarche (breast development), (2) Pubarche (pubic and axillary hair), (3) Growth spurt, (4) Menarche (onset of menses). Adrenarche (adrenal androgen secretion) precedes gonadarche by ~2 years. Gonadarche begins at ~age 8.\n\nMenarche typically follows the peak height velocity and/or 2 years after breast budding. Average age of menarche in Canada is 12.2 years (normal range 10-15 years). Thelarche before age 8 or menarche before age 9 suggests precocious puberty requiring investigation."
    difficulty: easy
    tags: [puberty, thelarche, menarche, pubarche, gynecology, pediatric gynecology]
  - front: "What are the Tanner stages of breast development?"
    back: "Stage 1: Prepubertal. Stage 2: Breast bud (thelarche). Stage 3: Further enlargement of areolae and breast with no separation of contours. Stage 4: Secondary mound of areolae and papilla above breast level. Stage 5: Areolae recessed to general contour of breast (mature).\n\nTanner staging provides a standardized method to assess pubertal progression. Thelarche at Stage 2 is typically the first sign of puberty in females. Premature thelarche (isolated breast development <8 years without other puberty signs) is usually benign but requires monitoring."
    difficulty: medium
    tags: [Tanner stages, puberty, breast development, gynecology, thelarche]
  - front: "What are the Tanner stages of pubic hair (pubarche) development in females?"
    back: "Stage 1: Prepubertal (no hair). Stage 2: Downy hair along labia only. Stage 3: Darker, coarser hair extending over pubis. Stage 4: Adult-type hair with no thigh involvement. Stage 5: Adult hair in distribution and type, with spread to medial thighs.\n\nPubarche is driven by adrenal androgens (adrenarche) and ovarian androgens. It typically follows thelarche by 6-12 months. Premature pubarche (isolated pubic hair <8 years) requires evaluation to rule out congenital adrenal hyperplasia, androgen-secreting tumour, or precocious puberty."
    difficulty: medium
    tags: [Tanner stages, pubarche, pubic hair, puberty, gynecology]
  - front: "What are the diagnostic criteria for Premenstrual Syndrome (PMS)?"
    back: "At least one AFFECTIVE symptom (depression, angry outbursts, irritability, anxiety, confusion, social withdrawal) AND one SOMATIC symptom (breast tenderness/swelling, bloating, headache, extremity swelling, joint/muscle pain, weight gain, fatigue) during the 5 days before menses in each of 3 prior cycles; symptoms relieved within 4 days of onset of menses; do not recur until at least day 13; present without pharmacologic therapy; occur reproducibly during 2 cycles of prospective recording; cause identifiable dysfunction.\n\nPMS is multifactorial with serotonergic dysregulation as the most plausible theory. Prospective symptom tracking (e.g., PRISM calendar) is required to confirm the diagnosis and distinguish PMS from other mood disorders with premenstrual exacerbation. Symptoms must be ABSENT from day 13 to late follicular phase."
    difficulty: medium
    tags: [PMS, premenstrual syndrome, gynecology, diagnostic criteria, menstruation]
  - front: "What distinguishes Premenstrual Dysphoric Disorder (PMDD) from PMS, and what are the diagnostic criteria?"
    back: "PMDD is more severe than PMS and causes significant functional impairment. Requires at least 5 of 11 symptoms during most cycles in the past year (with at least 1 of the first 4 core symptoms): (1) depressed mood/hopelessness, (2) anxiety/tension, (3) affective instability, (4) anger/irritability, plus any of: decreased interest, difficulty concentrating, lethargy, appetite change, hypersomnia/insomnia, overwhelmed feeling, or physical symptoms. Symptoms present the week before menses and resolve within days of onset.\n\nPMDD is classified as a depressive disorder in DSM-5. The serotonergic mechanism means SSRIs (either continuous or luteal-phase dosing) are first-line treatment. PMDD can be superimposed on other psychiatric disorders, but must be distinguished from simple premenstrual exacerbation of an existing disorder."
    difficulty: medium
    tags: [PMDD, premenstrual dysphoric disorder, gynecology, DSM-5, diagnostic criteria]
  - front: "What is the first-line imaging modality for pelvic structures, and when is transvaginal versus transabdominal ultrasound preferred?"
    back: "Ultrasound (US) is first-line. Transvaginal US provides better resolution of uterus and adnexal structures. For detecting early pregnancy: transvaginal US can detect if β-hCG ≥1500 IU/L, while transabdominal US requires β-hCG ≥6500 IU/L. Transvaginal US is preferred for most gynecologic indications.\n\nThe discriminatory zone (β-hCG level at which a pregnancy should be visible) is clinically important in evaluating possible ectopic pregnancy. If β-hCG exceeds the discriminatory zone and no intrauterine pregnancy is seen on transvaginal US, ectopic pregnancy must be strongly considered."
    difficulty: easy
    tags: [ultrasound, gynecology, imaging, ectopic pregnancy, beta-hCG, pelvic imaging]
  - front: "What are the indications for endometrial biopsy in gynecological practice?"
    back: "Abnormal uterine bleeding (AUB) or postmenopausal bleeding (PMB); age >40 with AUB; risk factors for or history of endometrial cancer; failure of medical treatment; significant intermenstrual bleeding; infrequent menses suggesting anovulatory cycles; obesity. Detection rate >97% for endometrial pathology.\n\nEndometrial biopsy using a pipelle suction curette is an office-based procedure. Pre-treatment with misoprostol (cervical ripening) is optional and less effective in postmenopausal women. If office biopsy is not possible or inconclusive, D&C ± hysteroscopy in the OR is indicated. Postmenopausal bleeding always requires endometrial evaluation."
    difficulty: easy
    tags: [endometrial biopsy, AUB, gynecology, postmenopausal bleeding, endometrial cancer, pipelle]
  - front: "What are the indications, routes, and SOGC recommendations for hysterectomy?"
    back: "Indications: uterine fibroids, endometriosis/adenomyosis, uterine prolapse, pelvic pain, AUB, cancer (endometrium, ovaries, fallopian tubes, cervix). SOGC recommends: (1) most minimally invasive approach (vaginal > laparoscopic > open); (2) correct preoperative anemia (Hb <120 g/L), antibiotic prophylaxis, VTE prevention; (3) full endometriosis excision concurrently; (4) consider opportunistic salpingectomy to reduce ovarian cancer risk; (5) low threshold for cystoscopy if ureteral injury suspected.\n\nOpportunistic salpingectomy at hysterectomy is endorsed by SOGC as a strategy to reduce serous ovarian cancer risk (many 'ovarian' cancers originate from fallopian tube fimbriae). The approach should NOT be changed solely for salpingectomy. Ureteral injury is the most feared complication; the ureter passes under the uterine artery."
    difficulty: medium
    tags: [hysterectomy, gynecology, SOGC, indications, salpingectomy, surgical complications]
  - front: "What are the complications of hysterectomy that must be discussed in informed consent?"
    back: "General anesthetic risks; bleeding; infection; injury to other organs (ureter, bladder, rectum); loss of ovarian function if ovaries removed (iatrogenic menopause) or early menopause; venous thromboembolism (VTE).\n\nUreteral injury is particularly important and SOGC recommends routine cystoscopy if injury is suspected. Patients must be counseled about risks of removing ovaries (immediate surgical menopause with cardiovascular and bone health implications) versus leaving them (residual ovarian cancer risk). VTE prophylaxis is recommended perioperatively."
    difficulty: easy
    tags: [hysterectomy, complications, gynecology, informed consent, ureteral injury, VTE]
  - front: "What is the menstrual cycle length, typical blood loss, and when does menarche normally occur?"
    back: "Cycle length: 28 ± 7 days (21-35 days). Bleeding duration: 1-6 days. Normal blood loss: 25-80 mL per cycle. Menarche: occurs between 10-15 years, average 12.2 years in Canada, typically 2 years after breast budding and/or following peak height velocity.\n\nBlood loss >80 mL/cycle is defined as heavy menstrual bleeding (formerly menorrhagia). Cycle length <21 days (polymenorrhea) or >35 days (oligomenorrhea) is abnormal. Menarche before age 10 or after age 15 warrants investigation for precocious or delayed puberty respectively."
    difficulty: easy
    tags: [menstrual cycle, menarche, normal menstruation, gynecology, AUB]
  - front: "What is the etiology of Premenstrual Syndrome and which neurotransmitter theory is most plausible?"
    back: "PMS is multifactorial: genetics likely play a role; CNS-mediated neurotransmitter (serotonin, dopamine, GABA) interactions with sex steroids (progesterone, estrogen, testosterone) are involved. Serotonergic dysregulation is currently the most plausible theory.\n\nThe serotonergic hypothesis explains why SSRIs (selective serotonin reuptake inhibitors) are effective first-line pharmacotherapy for moderate-to-severe PMS and PMDD. They can be used continuously or in the luteal phase only. Symptoms occur only in the luteal phase (ovulatory cycles required) — anovulation eliminates PMS."
    difficulty: medium
    tags: [PMS, etiology, serotonin, gynecology, neurotransmitters, SSRI]
  - front: "What is the significance of cervical mucus changes throughout the menstrual cycle?"
    back: "Follicular/periovulatory phase: cervical mucus becomes clear, increased in amount, and stringy (Spinnbarkeit 8-10 cm) — fertile mucus that facilitates sperm penetration. Luteal/secretory phase: mucus becomes opaque, scant, and less stretchy (Spinnbarkeit 1-2 cm) — under progesterone influence, forms barrier to sperm.\n\nCervical mucus assessment is used in fertility awareness methods and assists in timing of insemination. Spinnbarkeit (the ability to stretch) peaks at ovulation. Clomiphene and other anti-estrogens may impair cervical mucus quality despite inducing ovulation, potentially reducing fertility treatment success."
    difficulty: medium
    tags: [cervical mucus, menstrual cycle, fertility, gynecology, ovulation, Spinnbarkeit]
  - front: "What is the LH surge and what triggers it?"
    back: "The LH surge is a sudden large increase in LH that occurs approximately 36 hours before ovulation. It is triggered by a switch from negative to positive feedback at mid-cycle: when rising estrogen (from the dominant follicle) reaches a peak, it switches from inhibiting to stimulating GnRH/LH release. The dominant follicle releases its oocyte ~36 hours after the LH surge begins.\n\nThis positive feedback is unique to estrogen — progesterone always exerts negative feedback. The LH surge causes final oocyte maturation, stigma formation on the follicle, and ovulation. Luteal phase cells (granulosa cells) then luteinize and produce progesterone. OPKs (ovulation predictor kits) detect this LH surge."
    difficulty: medium
    tags: [LH surge, ovulation, menstrual cycle, gynecology, HPO axis, estrogen]
  - front: "What is the blood supply to the vagina?"
    back: "Primary supply from the vaginal branch of the internal pudendal artery with anastomoses from the uterine artery, inferior vesical artery, and middle rectal artery.\n\nThe vagina's rich anastomotic blood supply from multiple sources explains why vaginal surgery can involve significant bleeding. The vagina is a muscular canal extending from the cervix to the vulva, lined by rugated stratified squamous epithelium. The upper vagina is divided by the cervix into anterior, posterior, and lateral fornices."
    difficulty: medium
    tags: [vagina, anatomy, blood supply, gynecology, internal pudendal artery]
  - front: "What is the clinical implication of the 'water under the bridge' anatomical relationship in pelvic surgery?"
    back: "The ureter passes UNDER (inferior to) the uterine artery. During hysterectomy or ligating the uterine artery, the ureter can be inadvertently ligated or transected if not clearly identified. The ureter is most commonly found at the pelvic brim (passing over the iliac vessels) and in the medial leaf of the broad ligament (passing under the uterine artery).\n\nUreteral injury occurs in approximately 0.1-0.5% of hysterectomies and is more common with laparoscopic than open surgery. SOGC recommends a low threshold for intraoperative cystoscopy if injury is suspected. Unrecognized ureteral ligation causes hydronephrosis; ureteral transection causes urinoma."
    difficulty: medium
    tags: [ureter, uterine artery, surgical anatomy, hysterectomy, gynecology, complications]
  - front: "Which ovarian vein drains to the left renal vein vs. the inferior vena cava, and what is the clinical significance?"
    back: "Left ovarian vein drains to the left renal vein. Right ovarian vein drains directly to the inferior vena cava. Clinical significance: left-sided nutcracker syndrome (compression of left renal vein) can cause left ovarian vein hypertension and pelvic congestion syndrome. This asymmetry mirrors the left testicular vein drainage in males.\n\nThis anatomical difference also explains why primary varicosities are more common on the left side in both males and females. In oncology, lymphatic drainage of the ovaries follows the ovarian vessels to para-aortic/para-caval nodes, not the pelvic nodes (unlike the uterus and cervix)."
    difficulty: hard
    tags: [ovarian vein, anatomy, gynecology, pelvic congestion, renal vein, IVC]
  - front: "What is adrenarche and how does it relate to gonadarche in female puberty?"
    back: "Adrenarche is increased secretion of adrenal androgens (DHEA, DHEAS), responsible for pubic and axillary hair (pubarche). Gonadarche is increased secretion of gonadal sex steroids from the ovaries. Adrenarche typically precedes gonadarche by approximately 2 years. Gonadarche begins at approximately age 8.\n\nAdrenarche and gonadarche are independently regulated — one can occur without the other. Premature adrenarche (adrenarche before age 8) may be associated with PCOS or insulin resistance later in life. Gonadarche is regulated by the HPO axis, while adrenarche is regulated by ACTH/adrenal mechanisms."
    difficulty: medium
    tags: [adrenarche, gonadarche, puberty, gynecology, adrenal androgens, DHEA]
  - front: "What are the four main surgical approaches to hysterectomy?"
    back: "1. Open (abdominal): transverse (Pfannenstiel/Maylard) or midline laparotomy\n2. Vaginal hysterectomy: entire procedure through vagina, no abdominal incision\n3. Laparoscopic-assisted vaginal hysterectomy (LAVH)\n4. Total laparoscopic hysterectomy (TLH) / Robotic\n\nMinimally invasive approaches (vaginal, laparoscopic, robotic) reduce recovery time and complications compared to open surgery. Robotic may be advantageous in high-BMI patients but is more costly."
    difficulty: easy
    tags: [gynecology, hysterectomy, surgery, minimally invasive]
  - front: "What tissues are removed in a Radical Hysterectomy (Type 3) and for what indication?"
    back: "Tissues removed: uterus, cervix, entire parametria, uterine artery ligated at its origin from internal iliac artery, uterosacral ligament at most distal attachment (rectum), and upper 1/3 to 1/2 vagina.\nIndication: cervical cancer\n\nRadical hysterectomy removes a wider margin of tissue than total hysterectomy, including the full parametria and uterosacral ligaments, which is necessary for adequate surgical management of cervical cancer."
    difficulty: medium
    tags: [gynecology, hysterectomy, cervical cancer, surgery]
  - front: "What is the difference between a Modified Radical Hysterectomy (Type 2) and a Radical Hysterectomy (Type 3)?"
    back: "Modified Radical (Type 2): removes proximal 1/3 parametria, uterine artery ligated medial to ureter, midpoint of uterosacral ligaments, upper 1-2 cm vagina — used for cervical cancer up to stage IB1.\nRadical (Type 3): removes entire parametria, uterine artery ligated at its origin from internal iliac artery, uterosacral ligament at most distal attachment, upper 1/3–1/2 vagina — used for cervical cancer.\n\nThe extent of parametrial resection and the level at which the uterine artery is ligated distinguish these two procedures. Greater radicality is required for more advanced cervical cancer."
    difficulty: hard
    tags: [gynecology, hysterectomy, cervical cancer, surgery]
  - front: "What are the two most common causes of primary amenorrhea?"
    back: "1. Gonadal dysgenesis (e.g., Turner syndrome, 45,X0)\n2. Functional hypothalamic amenorrhea\n\nTurner syndrome (45,X0) is the most common cause of primary amenorrhea with hypergonadotropic hypogonadism. Functional hypothalamic amenorrhea is due to inadequate GnRH pulsatility, often secondary to stress, low body weight, or excessive exercise."
    difficulty: easy
    tags: [gynecology, amenorrhea, primary amenorrhea, menstruation disorders]
  - front: "Define primary amenorrhea. What are the three diagnostic criteria?"
    back: "1. No menses by age 13 in the absence of secondary sexual characteristics\n2. No menses by age 15 with secondary sexual characteristics\n3. No menses following the normal developmental sequence (regardless of age)\n\nPrimary amenorrhea is distinguished from secondary amenorrhea by the absence of a prior menstrual period. The criteria account for whether secondary sexual development has occurred, as this guides the differential diagnosis."
    difficulty: easy
    tags: [gynecology, amenorrhea, primary amenorrhea, menstruation disorders]
  - front: "Define secondary amenorrhea."
    back: "No menses for >6 months OR 3 cycles after documented menarche.\n\nSecondary amenorrhea implies a previous history of menstruation. The most common cause is pregnancy, which must always be excluded first (B-hCG). Functional hypothalamic amenorrhea is the most common non-pregnancy cause."
    difficulty: easy
    tags: [gynecology, amenorrhea, secondary amenorrhea, menstruation disorders]
  - front: "In a patient with primary amenorrhea and normal breast development but absent uterus on exam, what are the two main diagnoses to consider?"
    back: "1. Androgen insensitivity syndrome (AIS) — 46,XY karyotype, testes produce testosterone but end-organs are unresponsive; breast development due to peripheral aromatization\n2. Müllerian agenesis (MRKH syndrome) — 46,XX, normal ovaries, absent uterus/upper vagina\n\nBoth conditions present with normal secondary sexual characteristics (breasts) but absent uterus. Karyotype differentiates: 46,XY = AIS; 46,XX = MRKH. In AIS, management includes gonadal resection after puberty (to prevent malignancy) and creation of neo-vagina."
    difficulty: medium
    tags: [gynecology, amenorrhea, AIS, MRKH, primary amenorrhea]
  - front: "Describe the progesterone (progestin) challenge test and how to interpret it in the workup of amenorrhea."
    back: "Give medroxyprogesterone acetate (Provera®) 10 mg PO daily for 10–14 days.\n• Positive result (withdrawal bleed within 2–7 days): indicates adequate estrogen levels (anovulatory cause, e.g., PCOS)\n• Negative result (no withdrawal bleed): suggests hypoestrogenism, excessive androgens/progesterone, pregnancy, obstructive cause (cervical stenosis), or structural cause (uterine adhesions/Asherman's)\n\nA withdrawal bleed confirms the endometrium has been primed by estrogen and the outflow tract is patent. Absence of a bleed after progesterone challenge suggests either inadequate estrogen priming (e.g., hypothalamic, pituitary, or ovarian failure) or an outflow tract obstruction."
    difficulty: medium
    tags: [gynecology, amenorrhea, progestin challenge, investigations]
  - front: "What initial investigations should be ordered for secondary amenorrhea?"
    back: "1. B-hCG (rule out pregnancy — first step)\n2. FSH, LH\n3. Prolactin\n4. TSH (thyroid dysfunction)\n5. Androgens (testosterone, DHEA)\n6. Estradiol\n7. Pelvic U/S\n\nA systematic hormonal workup categorizes amenorrhea as hypergonadotropic (high FSH = primary ovarian insufficiency), hypogonadotropic (low FSH = hypothalamic/pituitary cause), or normogonadotropic (PCOS, outflow obstruction). Pregnancy must be excluded first."
    difficulty: easy
    tags: [gynecology, amenorrhea, investigations, workup]
  - front: "When is a CT/MRI head indicated in the workup of hyperprolactinemia causing amenorrhea?"
    back: "CT head if prolactin >100 ng/dL (or ng/mL). MRI of hypothalamus and pituitary if lesion suspected or prolactin markedly elevated.\n\nMildly elevated prolactin may be idiopathic or medication-related, but levels >100 ng/mL strongly suggest a prolactinoma. Neuroimaging is required to identify a pituitary macroadenoma or other CNS lesion causing pituitary stalk compression."
    difficulty: medium
    tags: [gynecology, hyperprolactinemia, prolactinoma, amenorrhea, investigations]
  - front: "What are the symptoms of a prolactinoma?"
    back: "Galactorrhea, visual changes (bitemporal hemianopsia from optic chiasm compression), and headache.\n\nProlactinomas are the most common secretory pituitary tumours. Elevated prolactin inhibits GnRH pulsatility, causing hypogonadotropic hypogonadism and amenorrhea. Large macroadenomas can compress surrounding structures causing visual field defects and headache."
    difficulty: easy
    tags: [gynecology, prolactinoma, hyperprolactinemia, pituitary]
  - front: "What is the management of hyperprolactinemia-related amenorrhea when the patient desires fertility vs. does not desire fertility?"
    back: "• Fertility desired: Bromocriptine or cabergoline (dopamine agonists) to reduce prolactin and restore ovulation\n• No fertility desired: Combined OCPs\n• Demonstrable lesion on MRI: surgical management (transsphenoidal resection)\n\nDopamine agonists (cabergoline preferred over bromocriptine due to better tolerability) suppress prolactin secretion and can shrink prolactinomas. OCPs regulate cycles but do not normalize prolactin or restore ovulation. Surgery is reserved for medication-refractory cases or large macroadenomas."
    difficulty: medium
    tags: [gynecology, hyperprolactinemia, prolactinoma, management, cabergoline]
  - front: "What is the management of Asherman's syndrome?"
    back: "Hysteroscopy with excision of intrauterine synechiae (adhesions). Evaluation with hysterosalpingography or sonohysterography.\n\nAsherman's syndrome results from intrauterine adhesions (most commonly post-dilation and curettage), causing amenorrhea or hypomenorrhea. Hysteroscopic lysis of adhesions restores the endometrial cavity and can restore menstruation and fertility."
    difficulty: medium
    tags: [gynecology, Asherman syndrome, amenorrhea, hysteroscopy]
  - front: "What is the PALM-COEIN classification of abnormal uterine bleeding (AUB)?"
    back: "Structural (PALM):\n• P — Polyp\n• A — Adenomyosis\n• L — Leiomyoma (Lsm = submucosal; Lo = other)\n• M — Malignancy and Hyperplasia\n\nNon-structural (COEIN):\n• C — Coagulopathy\n• O — Ovulatory dysfunction\n• E — Endometrial\n• I — Iatrogenic\n• N — Not yet classified\n\nThe FIGO PALM-COEIN classification provides a systematic framework for evaluating AUB. PALM causes are structural and typically identified on imaging or pathology; COEIN causes are functional and require lab/hormonal evaluation."
    difficulty: easy
    tags: [gynecology, AUB, PALM-COEIN, abnormal uterine bleeding]
  - front: "What defines heavy menstrual bleeding (AUB)?"
    back: "Any of:\n• ≥80 cc of blood loss per cycle\n• ≥8 days of bleeding per cycle\n• Menstrual flow that significantly affects quality of life\n\nIn clinical practice, quantifying blood loss is difficult, so patient-reported impact (e.g., soaking pads/tampons, passage of clots, disruption to daily activities) is used. Quality of life impact is now a key criterion."
    difficulty: easy
    tags: [gynecology, AUB, heavy menstrual bleeding, menstruation]
  - front: "What is the most common cause of postmenopausal bleeding and what must be ruled out?"
    back: "Most common cause: genitourinary syndrome of menopause (atrophy).\nMust rule out: endometrial cancer and hyperplasia — requires endometrial biopsy before treating for atrophy.\n\nAny postmenopausal bleeding is endometrial cancer until proven otherwise. Even though atrophy is more common, endometrial sampling (biopsy or D&C) must be performed first to exclude malignancy before attributing bleeding to atrophy."
    difficulty: easy
    tags: [gynecology, postmenopausal bleeding, endometrial cancer, AUB]
  - front: "When should an endometrial biopsy be performed for AUB?"
    back: "• All patients ≥40 years with AUB\n• Patients <40 years with persistent AUB\n• Patients <40 years with endometrial cancer risk factors (type 2 DM, obesity, chronic anovulation, PCOS, Lynch syndrome)\n\nEndometrial biopsy is the key investigation for AUB-M (malignancy). Risk factors for endometrial cancer include prolonged unopposed estrogen exposure (obesity, anovulation, PCOS, tamoxifen use)."
    difficulty: easy
    tags: [gynecology, AUB, endometrial biopsy, endometrial cancer, investigations]
  - front: "What is the medical management for acute, severe AUB (stepwise approach)?"
    back: "a) Antifibrinolytic (tranexamic acid/Cyklokapron®) 500–1000 mg PO BID-TID PRN (up to 4 g/d)\nb) IV antifibrinolytic 10 mg/kg IV q8h AND/OR IV conjugated estrogen (Premarin® 25 mg IV q4h × 24h) with antiemetic\nc) Tapering OCP regimen: 35 mcg pill TID × 7d, then taper to once daily for 3 weeks\nd) More commonly: taper OCP to TID × 2d → BID × 2d → once daily (after a or b)\nAlso consider: high-dose progestins, GnRH agonists, progesterone IUD\n\nAcute severe AUB requires rapid hemostasis. IV estrogen promotes endometrial proliferation to stop bleeding. Antifibrinolytics inhibit plasminogen activation. Tapering OCP stabilizes the endometrium. Resuscitation and fluid replacement are priorities if hemodynamically unstable."
    difficulty: hard
    tags: [gynecology, AUB, acute bleeding, management, tranexamic acid]
  - front: "What surgical options are available for AUB in patients who have completed childbearing?"
    back: "• Endometrial ablation (definitive for AUB; repeat may be needed if <40 yr and symptoms recur)\n• Hysterectomy: definitive treatment\n• Uterine artery embolization (UAB-L)\n• Myomectomy (if fibroid-related)\n• Polypectomy (if polyp-related)\n\nEndometrial ablation destroys the endometrial lining and is effective for AUB, but is contraindicated in patients desiring future fertility. Hysterectomy is the only truly definitive treatment. UAE is effective for fibroid-related bleeding but has a higher re-intervention rate."
    difficulty: easy
    tags: [gynecology, AUB, surgical management, endometrial ablation, hysterectomy]
  - front: "What is the definition of primary dysmenorrhea and how does it differ from secondary dysmenorrhea?"
    back: "Primary dysmenorrhea: recurrent, crampy lower abdominal pain during menses in the ABSENCE of demonstrable disease. Begins hours before onset of bleeding, persists 48–72 hours. Associated NV, altered bowel habits, headache (prostaglandin-mediated).\n\nSecondary dysmenorrhea: pain during menses attributed to an underlying disorder (endometriosis, adenomyosis, fibroids, PID, IUD-copper, etc.).\n\nPrimary dysmenorrhea is caused by excess prostaglandin F2-alpha production, causing myometrial contractions and uterine ischemia. NSAIDs (started before onset of pain) are first-line treatment. Secondary dysmenorrhea requires treating the underlying cause."
    difficulty: easy
    tags: [gynecology, dysmenorrhea, primary dysmenorrhea, secondary dysmenorrhea]
  - front: "What are the treatment options for primary dysmenorrhea?"
    back: "• Regular exercise, local heat\n• NSAIDs: should be started BEFORE onset of pain (e.g., naproxen, ibuprofen)\n• Combined hormonal contraceptives (CHCs) with continuous or extended use: suppress ovulation, reduce menstrual flow\n\nNSAIDs work by inhibiting prostaglandin synthesis. Starting them 1–2 days before expected menses is more effective than waiting for pain onset. CHCs reduce endometrial prostaglandin production by suppressing ovulation and thinning the endometrium."
    difficulty: easy
    tags: [gynecology, dysmenorrhea, NSAIDs, management]
  - front: "What causes of secondary dysmenorrhea should be considered in a patient with dyspareunia and abnormal bleeding?"
    back: "Endometriosis, adenomyosis, uterine fibroids (leiomyoma), PID/chronic pelvic inflammatory disease, uterine polyps, ovarian cysts, intrauterine synechiae, copper IUD.\n\nThe triad of dysmenorrhea + dyspareunia + infertility/abnormal bleeding strongly suggests endometriosis. Physical exam findings (uterosacral nodularity, fixed retroversion, adnexal tenderness) help distinguish secondary from primary causes."
    difficulty: easy
    tags: [gynecology, dysmenorrhea, secondary dysmenorrhea, endometriosis, differential diagnosis]
  - front: "Define endometriosis and its proposed etiology."
    back: "Definition: Presence of endometrial tissue (glands and stroma) OUTSIDE the uterine cavity; a chronic condition resolving only with menopause.\n\nProposed mechanisms (combination likely):\n1. Retrograde menstruation (Sampson's theory) — most widely accepted\n2. Coelomic metaplasia\n3. Immunologic: decreased NK cell activity limiting clearance of ectopic endometrial cells\n4. Vascular/lymphatic dissemination (explains extra-pelvic disease)\n\nNo single mechanism explains all cases. Retrograde menstruation occurs in most women, but only those with immunologic defects (decreased NK cell activity) develop endometriosis. Lymphatic spread explains rare extra-pelvic sites (lung, diaphragm)."
    difficulty: easy
    tags: [gynecology, endometriosis, etiology, pathophysiology]
  - front: "What are the risk factors for endometriosis?"
    back: "• Family history (7–10× increased risk if 1st-degree relative affected)\n• Obstructive genital tract anomalies (earlier onset — relates to retrograde menstrual mechanism)\n• Nulliparity\n• Age >25 years\n• Early menarche (<11–13 y/o)\n• Shorter menstrual cycles (<27 days)\n• Low BMI\n• Low birth weight\n• Increased menstrual flow\n\nRisk factors that increase retrograde menstrual flow or extend endometrial exposure increase risk of endometriosis. Protective factors include multiparity, lactation, and late menarche (fewer lifetime ovulations/menstrual cycles)."
    difficulty: medium
    tags: [gynecology, endometriosis, risk factors, epidemiology]
  - front: "What is the incidence of endometriosis and its relationship to infertility?"
    back: "• Incidence: 15–30% of premenopausal patients\n• Mean age at presentation: 25–30 years\n• 30–40% of patients with endometriosis will be infertile\n• 15–30% of infertile patients will have endometriosis\n\nEndometriosis causes infertility through multiple mechanisms: distorted pelvic anatomy, adhesions affecting tubal function, altered peritoneal fluid environment, and impaired implantation. Diagnosis is often delayed by 5 years from symptom onset."
    difficulty: easy
    tags: [gynecology, endometriosis, infertility, epidemiology]
  - front: "What are the three main clinical presentations of endometriosis?"
    back: "1. Pain (80%): secondary dysmenorrhea, deep dyspareunia, dyschezia, dysuria, sacral backache, chronic pelvic pain worsening perimenstrually\n2. Infertility (25%): 30–40% of endometriosis patients; 15–30% of infertile patients have endometriosis\n3. Mass (endometrioma) (20%): ovarian 'chocolate' cyst containing old blood; may be asymptomatic\n\nEndometriosis is a multifaceted condition often presenting with a combination of these features. Diagnosis is frequently delayed because symptoms overlap with other conditions and endometriosis can be asymptomatic."
    difficulty: easy
    tags: [gynecology, endometriosis, clinical features, endometrioma]
  - front: "What are the laparoscopic findings of endometriosis and what is the gold standard for diagnosis?"
    back: "Gold standard: Direct visualization at laparoscopy + biopsy showing ≥2 of: endometrial epithelium, glands, stroma, hemosiderin-laden macrophages.\n\nLaparoscopic findings:\n• Mulberry spots: dark blue/brownish-black implants on uterosacral ligaments, cul-de-sac\n• Endometriomas: 'chocolate cysts' on ovaries\n• 'Powder-burn' lesions on peritoneal surface\n• Early white lesions and clear blebs\n• Peritoneal 'pockets'\n\nEndometriotic lesions vary in appearance from classic dark 'powder-burn' lesions to subtle white/clear lesions. Biopsy confirmation provides histologic diagnosis. CA-125 may be elevated but is not sufficiently sensitive or specific for diagnosis."
    difficulty: medium
    tags: [gynecology, endometriosis, laparoscopy, diagnosis, investigations]
  - front: "According to SOGC guidelines, when is surgical confirmation required before starting medical treatment for endometriosis?"
    back: "Surgical confirmation of disease is NOT required prior to starting medical management. A suggestive history, even with a negative exam, is adequate for a presumptive diagnosis and initiation of treatment.\n\nSOGC guidelines support empirical medical therapy for presumed endometriosis without mandatory laparoscopic confirmation. This avoids surgical risks in patients with classic presentations. Failure of medical therapy, desire for fertility optimization, or large adnexal masses may then prompt surgery."
    difficulty: medium
    tags: [gynecology, endometriosis, SOGC, management, Canadian guidelines]
  - front: "What is the first-line and second-line medical treatment for endometriosis?"
    back: "First-line:\n• Cyclic/continuous estrogen-progestin (OCP)\n• Progestin alone: IM medroxyprogesterone (Depo-Provera®) or oral dienogest (Visanne®)\n• Mirena® IUS\n• NSAIDs (e.g., naproxen sodium — avoid selective COX-2 inhibitors if trying to conceive)\n\nSecond-line:\n• GnRH agonist: leuprolide (Lupron®) or elagolix (Orlissa®) — induces pseudomenopause\n• GnRH antagonist: relugolix combo (Myfembree®)\n• Danazol (Danocrine®) — weak androgen, rarely used due to side effects\n\nMedical therapy suppresses endometrial implants and prevents disease progression. GnRH agonists require add-back estrogen/progestin if used >6 months to prevent bone mineral density loss and vasomotor symptoms. Danazol is rarely used due to androgenic side effects (acne, hirsutism, voice change)."
    difficulty: medium
    tags: [gynecology, endometriosis, medical management, GnRH agonist, OCP]
  - front: "What are the side effects of GnRH agonists (e.g., leuprolide/Lupron®) used for endometriosis, and what add-back therapy is required?"
    back: "Side effects: hot flashes, vaginal dryness, reduced libido, decreased bone mineral density (with prolonged use >6 months).\n\nAdd-back therapy: required when GnRH agonist used >6 months — add progestin or estrogen to prevent decreased BMD and reduce vasomotor side effects.\n\nException: Elagolix (Orlissa®) low dose (150 mg once daily) does NOT require add-back. High dose (200 mg BID) DOES require add-back.\n\nGnRH agonists cause hypogonadotropic hypogonadism (pseudomenopause), reducing estrogen which drives endometriosis but also causes menopausal symptoms and bone loss. Add-back therapy provides enough hormones to prevent side effects without stimulating endometriosis."
    difficulty: medium
    tags: [gynecology, endometriosis, GnRH agonist, leuprolide, add-back therapy]
  - front: "When is surgery indicated for endometriosis?"
    back: "Indications:\n• Failure of medical management\n• Desire for fertility optimization (best time to conceive is immediately after conservative surgery)\n• Large adnexal masses (endometriomas)\n• Adhesive disease causing obstruction (bowel/urinary)\n• Definitive treatment desired\n\nSurgical options:\n• Conservative: laparoscopic ablation/resection of implants, lysis of adhesions, ovarian cystectomy\n• Definitive: hysterectomy + bilateral salpingo-oophorectomy\n\nConservative surgery preserves fertility and is preferred for reproductive-age patients. If not planning pregnancy post-operatively, medical suppression is recommended to prevent recurrence. Medical treatment is often continued postoperatively to reduce recurrence."
    difficulty: medium
    tags: [gynecology, endometriosis, surgery, laparoscopy, management]
  - front: "What is Myfembree® and what is its indication?"
    back: "Myfembree® = relugolix 40 mg + estradiol 1 mg + norethindrone acetate 0.5 mg.\nIt is a GnRH antagonist combination tablet.\nIndications:\n1. Moderate to severe pain associated with endometriosis\n2. Heavy menstrual bleeding associated with uterine fibroids in premenopausal women\nThe add-back (estradiol + norethindrone) counters vasomotor side effects of GnRH antagonism.\n\nGnRH antagonists (unlike agonists) suppress the HPO axis immediately without an initial flare. Myfembree® includes add-back therapy in a single tablet for convenience. It is not a contraceptive."
    difficulty: hard
    tags: [gynecology, endometriosis, fibroids, GnRH antagonist, relugolix, Myfembree]
  - front: "What is adenomyosis, and how does it differ from endometriosis?"
    back: "Adenomyosis: extension of endometrial glands and stroma INTO the myometrium (uterine wall); synonym 'endometriosis interna'.\n\nKey differences from endometriosis:\n• Older age group (40–50 yr vs. 25–30 yr)\n• Uterus symmetrically bulky (vs. normal or adnexal mass in endometriosis)\n• Found in 20–40% of hysterectomy specimens\n• Halban's sign: tender, softened uterus on premenstrual bimanual exam\n• Final diagnosis: pathologic (post-hysterectomy)\n\nAdenomyosis and endometriosis can coexist. Adenomyosis is a common incidental histologic finding in hysterectomy specimens. It causes heavy menstrual bleeding and secondary dysmenorrhea through disruption of normal myometrial contractility."
    difficulty: easy
    tags: [gynecology, adenomyosis, endometriosis, definition]
  - front: "What is Halban's sign and what condition does it suggest?"
    back: "Halban's sign: tender, softened uterus on premenstrual bimanual examination.\nSuggests: adenomyosis.\n\nIn adenomyosis, the uterus becomes edematous and tender due to cyclical stimulation of ectopic endometrial tissue within the myometrium. The uterus is symmetrically enlarged (<14 cm) and characteristically tender on premenstrual exam."
    difficulty: medium
    tags: [gynecology, adenomyosis, Halban sign, clinical signs]
  - front: "What is the definitive treatment for adenomyosis and what medical options are available?"
    back: "Definitive: hysterectomy — treatment of choice in patients who have completed childbearing.\n\nMedical options:\n• Iron supplements (for anemia)\n• Analgesics, NSAIDs\n• Mirena® IUS\n• CHC, dienogest (Visanne®), medroxyprogesterone (Depo-Provera®) — limited evidence\n• GnRH agonists: leuprolide (Lupron®), elagolix (Orlissa®)\n• Danazol 100–200 mg daily (trial × 4 months)\n\nMedical therapy for adenomyosis suppresses symptoms but does not cure the disease. Mirena® IUS reduces heavy bleeding and dysmenorrhea. Hysterectomy is curative and the definitive treatment for patients who have completed childbearing."
    difficulty: easy
    tags: [gynecology, adenomyosis, hysterectomy, management]
  - front: "What is the epidemiology and pathogenesis of uterine fibroids (leiomyomata)?"
    back: "Epidemiology:\n• Diagnosed in ~40–50% of premenopausal patients >35 yr\n• More common and larger in Black patients (earlier age of onset)\n• Occur in 70–80% of women by age 50\n• Typically regress after menopause\n\nPathogenesis:\n• Estrogen stimulates monoclonal smooth muscle proliferation\n• Progesterone stimulates proteins that inhibit apoptosis\n• Degenerative changes occur when tumour outgrows blood supply\n\nFibroids are the most common benign gynaecologic tumours. They are estrogen-sensitive and thus shrink after menopause. They have minimal malignant potential (sarcomatous degeneration is rare)."
    difficulty: easy
    tags: [gynecology, fibroids, leiomyoma, epidemiology, pathogenesis]
  - front: "What is the FIGO classification of uterine fibroids by location?"
    back: "Submucosal (grow toward endometrial cavity):\n• Type 0: pedunculated (entirely intracavitary)\n• Type 1: <50% intramural\n• Type 2: ≥50% intramural\n\nIntramural (most common — grow within muscular wall):\n• Type 3: contacts endometrium, 100% intramural\n• Type 4: intramural\n\nSubserosal (grow from serosa):\n• Type 5: >50% intramural\n• Type 6: <50% intramural\n• Type 7: pedunculated subserosal\n\nCervical:\n• Type 8: other (cervical location)\n\nLocation determines symptoms and management. Submucosal fibroids most commonly cause AUB and infertility (distort endometrial cavity). Subserosal fibroids cause bulk symptoms. Intramural are most common. FIGO classification guides treatment (e.g., hysteroscopic resection for submucosal)."
    difficulty: medium
    tags: [gynecology, fibroids, leiomyoma, FIGO classification]
  - front: "What are the clinical features and symptoms of uterine fibroids?"
    back: "Majority asymptomatic (incidental finding on exam or U/S).\n\nWhen symptomatic:\n1. Heavy/prolonged menstrual bleeding and dysmenorrhea (most common: 26–29%)\n2. Pressure/bulk symptoms: pelvic pressure/heaviness, increased abdominal girth, urinary frequency, difficulty voiding, constipation/bloating\n3. Reproductive dysfunction: infertility, recurrent pregnancy loss, pregnancy complications (degeneration, malpresentation, obstructed labour)\n• Rare emergency: acute urinary retention (surgical emergency!)\n\nSubmucosal fibroids most often cause AUB by disrupting endometrial vascularity and impairing normal haemostasis. Intramural and subserosal fibroids more commonly cause bulk symptoms. Pedunculated fibroids may torse, causing acute pelvic pain."
    difficulty: easy
    tags: [gynecology, fibroids, leiomyoma, clinical features]
  - front: "What investigations are used to evaluate uterine fibroids?"
    back: "• Bimanual exam: uterus asymmetrically enlarged\n• Pelvic/transvaginal U/S: confirms diagnosis, assesses location\n• Sonohysterogram (saline infusion): differentiates polyps from submucosal fibroids; assesses size/degree of submucosal component; useful before hysteroscopic resection\n• Diagnostic office hysteroscopy: visualizes endometrial cavity; rules out small polyps; plans hysteroscopic resection\n• MRI: preoperative planning (e.g., before laparoscopic myomectomy)\n• Endometrial biopsy: rules out hyperplasia/cancer if AUB, especially age ≥40 or risk factors\n• CBC: assess for anemia\n\nTransvaginal U/S is the first-line imaging. Sonohysterogram improves detection of submucosal fibroids that may impact fertility. Pregnancy must be excluded in all patients of reproductive age."
    difficulty: easy
    tags: [gynecology, fibroids, leiomyoma, investigations, ultrasound]
  - front: "What are the medical treatment options for symptomatic uterine fibroids?"
    back: "• Antiprostaglandins: NSAIDs (ibuprofen, naproxen)\n• Antifibrinolytic: tranexamic acid (Cyklokapron®)\n• CHC (combined hormonal contraceptives), Mirena® IUS, Depo-Provera®\n• GnRH agonist: leuprolide (Lupron®) — used 3 months preoperatively to shrink fibroids, increase Hb, correct anemia; can bridge to menopause with add-back\n• GnRH antagonist: Myfembree® (relugolix + estradiol + norethindrone acetate) — manages heavy menstrual bleeding from fibroids\n\nMedical therapy controls symptoms but does not eliminate fibroids. GnRH agonists are often used preoperatively to reduce fibroid size and blood loss. Myfembree® is an oral once-daily option with add-back therapy included."
    difficulty: medium
    tags: [gynecology, fibroids, leiomyoma, medical management, GnRH agonist]
  - front: "What are the surgical options for uterine fibroids and when is each preferred?"
    back: "• Hysteroscopic resection: submucosal fibroids (types 0–2), combined with endometrial ablation for AUB-Lsm (NOT if desiring future pregnancy)\n• Myomectomy (hysteroscopic, open, or laparoscopic): fibroid removal preserving uterus — preferred when fertility is desired\n• Uterine artery embolization (UAE): occludes both uterine arteries, shrinks fibroids by 50% at 6 months, improves bleeding in 90%; NOT for future pregnancy planning; higher surgical re-intervention rate\n• Hysterectomy: definitive treatment, no future fertility\n\nUAE is effective for bleeding but has higher re-intervention rates vs. surgical approaches and risks pregnancy complications. Patients may become septic during fibroid degeneration post-UAE requiring emergency hysterectomy. Surgery during pregnancy is traditionally avoided."
    difficulty: medium
    tags: [gynecology, fibroids, leiomyoma, UAE, myomectomy, hysterectomy]
  - front: "What are the long-term outcomes of uterine artery embolization (UAE) for fibroids compared to surgery?"
    back: "• UAE occludes both uterine arteries, shrinks fibroids ~50% at 6 months\n• Improves heavy bleeding in 90% within 1–2 months\n• No significant difference in patient satisfaction or live birth rates vs. surgery\n• UAE associated with HIGHER risk of minor complications and need for additional surgical re-intervention within 2 years\n• NOT recommended for patients planning future pregnancies (risk of pregnancy complications)\n\nMeta-analyses of RCTs show UAE is non-inferior to surgery for patient satisfaction and live birth rates but requires more re-interventions. UAE avoids surgical risks (anesthesia, adhesions) but has unique complications including post-embolization syndrome and rare emergency hysterectomy."
    difficulty: hard
    tags: [gynecology, fibroids, UAE, evidence-based medicine]
  - front: "What are the effectiveness rates for common contraceptive methods (perfect use)?"
    back: "• Abstinence: 100%\n• Vasectomy: 99.9%\n• Mirena® IUS: 99.9%\n• Postcoital copper IUD (EPC): 99.9%\n• Ella® (ulipristal acetate): 99.9% within 7d\n• Etonogestrel implant (NEXPLANON®): 99%\n• OCP/NuvaRing®/Ortho Evra® patch: 99.7%\n• Depo-Provera®: 99.7%\n• Drospirenone (Slynd®): 99.3%\n• Copper IUD: 99.3%\n• Tubal ligation: 99.65%\n• Condom alone: 98%\n• Plan B® (levonorgestrel): 98% (within 24h)\n• Diaphragm with spermicide: 94%\n\nPerfect use vs. typical use effectiveness differ significantly for user-dependent methods (condoms: 98% vs. 82%; OCP: 99.7% vs. 92%). Long-acting reversible contraceptives (LARCs) have the highest effectiveness because they are user-independent. Canadian Paediatric Society endorses LARCs as first-line for adolescents."
    difficulty: medium
    tags: [gynecology, contraception, effectiveness, LARC]
  - front: "How does the combined oral contraceptive pill (OCP) work? What are the mechanisms of action?"
    back: "• Estrogen: suppresses FSH → inhibits follicular development\n• Progestin: prevents LH surge → suppresses ovulation; thickens cervical mucus; decreases tubal motility; decidualizes endometrium\n• Combined effect: prevents fertilization and implantation\n\nMost OCPs contain ethinyl estradiol (10–35 mcg) plus a progestin. The progestin type varies (norethindrone, levonorgestrel, desogestrel, drospirenone) and determines specific effects (androgenic vs. anti-androgenic). Monophasic pills have consistent progestin throughout; triphasic vary throughout cycle."
    difficulty: easy
    tags: [gynecology, contraception, OCP, mechanism of action]
  - front: "What are the non-contraceptive benefits of combined OCPs?"
    back: "• Decreased menstrual bleeding\n• Decreased acne\n• Decreased progression of endometriosis (inhibits ovulation)\n• Decreased risk of ovarian cancer\n• Decreased risk of endometrial cancer\n• Relief of dysmenorrhea\n\nOCPs are widely used for non-contraceptive indications. The risk reduction for ovarian and endometrial cancer persists for years after cessation. These benefits must be balanced against risks (VTE, hypertension, stroke in susceptible individuals)."
    difficulty: easy
    tags: [gynecology, OCP, contraception, non-contraceptive benefits]
  - front: "What are the risks of combined OCPs?"
    back: "• Increased risk of venous thromboembolism (VTE)\n• Increased risk of hypertension\n• Increased risk of stroke (in susceptible individuals, e.g., migraines with aura)\n• Unclear associations with elevated cancer risks\n• Side effects: breast tenderness, nausea, bloating, unscheduled bleeding, amenorrhea (no clear evidence of weight gain)\n\nVTE risk is the major concern, particularly with higher-dose estrogen and certain progestins (desogestrel, gestodene). OCPs are contraindicated in women with history of VTE, clotting disorders, smoking >35 years, migraines with aura, uncontrolled hypertension, and certain cardiovascular diseases."
    difficulty: easy
    tags: [gynecology, OCP, contraception, risks, VTE]
  - front: "What are the characteristics of the transdermal contraceptive patch (Ortho Evra®)?"
    back: "• Changed weekly for 3 consecutive weeks, then off 1 week for withdrawal bleed\n• Releases norelgestromin 6 mg and ethinyl estradiol 0.60 mg\n• Has enough hormone for 9 days (forgiveness window)\n• Applied to lower abdomen, back, upper arm, or buttocks (NOT breasts)\n• Effectiveness >99% with perfect use\n• May be less effective in patients >90 kg\n• Can be used continuously or in extended fashion\n\nThe patch provides consistent hormone levels through transdermal absorption, avoiding first-pass hepatic metabolism. It should not be used with hepatitis C medications (obmitasvir, paritaprevir, ritonavir) or in patients with skin hypersensitivity/exfoliative dermatologic disorders."
    difficulty: medium
    tags: [gynecology, contraception, transdermal patch, Ortho Evra]
  - front: "What are the characteristics of the NuvaRing® contraceptive ring?"
    back: "• Thin flexible plastic ring inserted into vagina by patient\n• Left in place for 3 weeks, then removed and discarded\n• New ring inserted 7 days later (to allow withdrawal bleed)\n• Releases etonogestrel 120 mcg/day and estradiol 15 mcg/day\n• Has enough hormone for 35 days\n• Effectiveness: 98%\n• Side effects: vaginitis, vaginal discharge, mild breast tenderness, mild nausea\n• Associated with LESS breakthrough bleeding than other methods\n• Risk of toxic shock syndrome is rare\n\nNuvaRing® delivers hormones locally via vaginal mucosa with low systemic dose. It can also be used continuously or in extended fashion. Compared to the patch, it has less systemic estrogen exposure, potentially reducing VTE and other estrogen-related side effects."
    difficulty: medium
    tags: [gynecology, contraception, NuvaRing, vaginal ring]
  - front: "What are the SOGC guidelines for starting hormonal contraceptives?"
    back: "• Thorough history and BP measurement (post-pandemic SOGC guidelines: BP no longer required for virtual appointments)\n• Pelvic exam NOT required (STI screening by urine; Pap smear screening starts at >25 years)\n• Can start at any time during cycle, ideally within 5 days of LMP\n• Follow-up visit 3 months after prescription\n• Back-up contraception for 7 days recommended, particularly if initiated >5 days from LMP\n\nSOGC and Canadian guidelines have moved toward reducing barriers to contraceptive access. Eliminating mandatory pelvic exams and BP requirements for virtual prescriptions improves access to hormonal contraception."
    difficulty: easy
    tags: [gynecology, contraception, SOGC, Canadian guidelines, starting contraception]
  - front: "What is the lactational amenorrhea method (LAM) and how effective is it?"
    back: "LAM effectiveness: 98% — but only in first 6 months postpartum.\nRequirements for effectiveness: fully/nearly fully breastfeeding AND amenorrhea AND within 6 months of delivery.\nTypical use: 98% (first 6 months postpartum).\n\nBreastfeeding suppresses GnRH pulsatility through elevated prolactin, inhibiting ovulation. All three criteria (exclusive breastfeeding, amenorrhea, <6 months postpartum) must be met simultaneously for 98% effectiveness. If any criterion fails, additional contraception is needed."
    difficulty: medium
    tags: [gynecology, contraception, lactational amenorrhea, breastfeeding]
  - front: "What are the emergency postcoital contraception (EPC) options and their effectiveness?"
    back: "1. Plan B® (levonorgestrel only): 98% within 24 hours; effectiveness decreases by 70% at 72h\n2. Yuzpe® method (estrogen + levonorgestrel): 98% within 24h; decreases by 30% at 72h\n3. Ella® (ulipristal acetate): 99.9% within 7 days\n4. Postcoital copper IUD: 99.9% within 7 days\n\nEPC works primarily by delaying or inhibiting ovulation (not abortifacient). Copper IUD is the most effective EPC and also provides ongoing contraception. Ella® (UPA) is more effective than levonorgestrel, especially for patients >75 kg. Plan B® may be less effective in women >75 kg."
    difficulty: medium
    tags: [gynecology, contraception, emergency contraception, Plan B, Ella]
  - front: "What is the 'withdrawal bleed' on combined OCPs and is it medically necessary?"
    back: "The withdrawal bleed is an apparent (false) period caused by withdrawal of hormones during the placebo/pill-free interval. It was originally devised so women could hide contraceptive use.\n\nIt is NOT medically necessary. Continuous OCP use (no pill-free intervals) results in fewer unintended pregnancies and is safe. Extended cycle preparations with less frequent withdrawal bleeds are also acceptable.\n\nModern evidence shows no health benefit to monthly withdrawal bleeds. Continuous OCP use can treat endometriosis, dysmenorrhea, and menstruation-related symptoms. Patient autonomy and medical indications guide the decision between cyclic and continuous regimens."
    difficulty: easy
    tags: [gynecology, contraception, OCP, withdrawal bleed, continuous use]
  - front: "What is the most common gynaecologic tumour and what is its malignant potential?"
    back: "Uterine leiomyomata (fibroids) are the most common gynaecologic tumours.\nMalignant potential: minimal (sarcomatous degeneration is rare).\n\nFibroids are benign smooth muscle tumours found in 40–50% of premenopausal women >35 years and in up to 70–80% of women by age 50. They are estrogen-sensitive and typically regress after menopause. Despite their prevalence, malignant transformation is extremely rare."
    difficulty: easy
    tags: [gynecology, fibroids, leiomyoma, benign tumour]
  - front: "A 26-year-old woman presents with progressive dysmenorrhea, deep dyspareunia, and infertility. Pelvic exam reveals uterosacral nodularity. CA-125 is mildly elevated. What is the diagnosis and what does CA-125 tell you?"
    back: "Diagnosis: Endometriosis.\n\nCA-125: May be elevated in endometriosis but should NOT be used as a diagnostic test — it is neither sensitive nor specific enough. It is not routinely ordered for diagnosis of endometriosis.\n\nThe clinical triad of dysmenorrhea + dyspareunia + infertility with uterosacral nodularity is highly suggestive of endometriosis. CA-125 is a tumour marker primarily used to monitor ovarian cancer (not diagnose it or endometriosis). A suggestive history even with negative exam warrants empiric medical treatment per SOGC guidelines."
    difficulty: medium
    tags: [gynecology, endometriosis, CA-125, diagnosis, clinical reasoning]
  - front: "A 17-year-old presents with primary amenorrhea, normal breast development, and no uterus on pelvic exam. Karyotype is 46,XY. What is the diagnosis and management?"
    back: "Diagnosis: Androgen Insensitivity Syndrome (AIS) — complete form.\n\nManagement:\n1. Gonadal resection AFTER puberty (wait until breast development complete — reduces malignancy risk while allowing feminization from aromatization of testosterone)\n2. Psychological counselling\n3. Creation of neo-vagina with progressive dilation\n4. Hormone replacement therapy post-gonadectomy\n\nIn AIS, 46,XY individuals have non-functional androgen receptors. Testes produce testosterone (aromatized to estrogen peripherally → breast development) and anti-Müllerian hormone (AMH) → absent uterus/fallopian tubes. Gonads must be removed post-puberty due to gonadoblastoma risk (~2–3%)."
    difficulty: hard
    tags: [gynecology, AIS, androgen insensitivity, primary amenorrhea, management]
  - front: "What is the 'sliding sign' on transvaginal ultrasound and what does its absence indicate?"
    back: "The sliding sign assesses mobility between the rectum/sigmoid colon and the posterior uterus/vagina during real-time transvaginal U/S.\n\nAbsence of sliding sign = evidence of severe endometriosis involving the rectum and sigmoid colon (deeply infiltrating disease with adhesions).\n\nThe sliding sign is an ultrasound dynamic technique where the examiner gently moves the probe and assesses if the bowel slides freely over the posterior uterus. Loss of this mobility indicates posterior compartment adhesions/deeply infiltrating endometriosis, which has major implications for surgical planning."
    difficulty: hard
    tags: [gynecology, endometriosis, ultrasound, sliding sign, investigations]
  - front: "What is an endometrioma ('chocolate cyst') and how is it managed?"
    back: "An endometrioma is an endometriotic cyst within the ovary containing old blood ('chocolate'-coloured fluid).\n\nManagement:\n• Asymptomatic and small (<5 cm): conservative (no surgery needed)\n• Symptomatic or expanding: surgical (ovarian cystectomy) — but this can decrease ovarian reserve\n• If bilateral endometriomas or concern for fertility: refer to REI before surgery to consider ovarian tissue freezing\n• Medical treatment is for pain, NOT for the endometrioma itself\n\nEndometriomas occur in ~20% of endometriosis patients. Surgical cystectomy reduces ovarian reserve (removes healthy ovarian tissue along with cyst). In women desiring future fertility, fertility preservation consultation should occur before bilateral ovarian surgery."
    difficulty: medium
    tags: [gynecology, endometriosis, endometrioma, ovarian cyst, management]
  - front: "What is the most effective emergency contraception option and within what time frame should it be used?"
    back: "Most effective EPC options (tied at 99.9%):\n1. Postcoital copper IUD: within 7 days — also provides ongoing highly effective contraception\n2. Ella® (ulipristal acetate): within 7 days — prescription required\n\nNote: Plan B® and Yuzpe® are less effective (98%) and ideally used within 24 hours (decreasing efficacy at 72h).\n\nThe copper IUD is the most effective EPC overall, preventing >99.9% of pregnancies within 7 days of unprotected sex. It also serves as an ongoing LARC. Ulipristal acetate (Ella®) maintains efficacy better across the 5-day window compared to levonorgestrel (Plan B®), which is particularly important for use between 72–120 hours."
    difficulty: easy
    tags: [gynecology, contraception, emergency contraception, copper IUD, Ella]
  - front: "What are the three most common organisms causing infectious vulvovaginitis, and which discharge characteristic distinguishes each?"
    back: "1. Candida albicans — whitish 'cottage cheese' discharge, intense pruritus, pH <4.5\n2. Bacterial vaginosis (BV) — grey, thin, fishy-smelling discharge, pH >4.5\n3. Trichomonas vaginalis — yellow-green, frothy, malodorous discharge, pH >4.5\n\nDistinguishing the three common causes of vaginitis is essential for MCCQE1. Candida causes the classic thick white discharge with pruritus; BV causes thin grey discharge with amine odour due to anaerobic overgrowth; Trichomonas is a sexually transmitted flagellated protozoan causing frothy yellow-green discharge with strawberry cervix (petechiae). pH is a key differentiator: Candida keeps normal vaginal pH, while BV and Trichomonas are both alkaline."
    difficulty: easy
    tags: [vulvovaginitis, candidiasis, bacterial-vaginosis, trichomoniasis, vaginal-discharge, STI, gynecology]
  - front: "What is the significance of the 'whiff test' in vaginal discharge evaluation, and in which condition is it positive?"
    back: "The whiff test (amine/KOH test) involves adding 10% KOH to vaginal discharge on a slide. A positive result (fishy odour) indicates bacterial vaginosis, caused by the liberation of amines (putrescine, cadaverine) produced by anaerobic bacteria.\n\nThe whiff test is a simple bedside test used to diagnose BV. The fishy odour results from volatile amines released when KOH raises the pH and volatilizes amine compounds produced by anaerobic bacteria such as Gardnerella vaginalis, Prevotella, and Mobiluncus. It is one of the Amsel criteria for BV diagnosis. It is not positive in Candida or Trichomonas."
    difficulty: easy
    tags: [bacterial-vaginosis, whiff-test, amsel-criteria, vulvovaginitis, gynecology]
  - front: "What are clue cells and in which condition are they found on saline wet mount?"
    back: "Clue cells are squamous epithelial cells covered ('dotted') with coccobacilli (Gardnerella vaginalis), causing a stippled or granular appearance that obscures the cell border. They are the hallmark finding of bacterial vaginosis on saline wet mount, defined as >20% of epithelial cells being clue cells.\n\nClue cells are one of the Amsel criteria for bacterial vaginosis. On microscopy, the clue cells' border appears obscured by adherent coccobacilli. BV is characterized by replacement of normal Lactobacillus-dominant flora with anaerobic overgrowth. The saline wet mount also shows paucity of WBCs and reduced Lactobacilli in BV."
    difficulty: easy
    tags: [bacterial-vaginosis, clue-cells, wet-mount, microscopy, vulvovaginitis, gynecology]
  - front: "What is the first-line treatment for Trichomonas vaginalis infection, and why must partners be treated?"
    back: "Metronidazole 2 g PO single dose (or metronidazole 500 mg BID x 7 days as alternative). Partners must be treated because Trichomonas is a sexually transmitted infection (STI); without partner treatment, re-infection is likely. Patients should be warned to avoid alcohol while on metronidazole (disulfiram-like reaction).\n\nTrichomonas vaginalis is the only one of the three common vaginitides that is sexually transmitted and requires mandatory partner treatment. Treatment is indicated even in asymptomatic cases (25% are asymptomatic). In pregnancy, metronidazole 2 g orally once is also recommended. The disulfiram-like effect of metronidazole with alcohol causes flushing, nausea, and tachycardia."
    difficulty: easy
    tags: [trichomoniasis, metronidazole, STI, partner-treatment, gynecology]
  - front: "What is the treatment for bacterial vaginosis in a symptomatic pregnant woman?"
    back: "Metronidazole 2 g orally once (oral treatment is preferred in pregnancy). BV in pregnancy is associated with recurrent preterm labour, preterm birth, and postpartum endometritis.\n\nSymptomatic pregnant women with BV should be treated due to obstetrical complications. The preferred regimen in pregnancy is oral metronidazole. Vaginal metronidazole gel or clindamycin cream are alternatives. Routine treatment of partners is not recommended for BV (not sexually transmitted). Treatment of asymptomatic non-pregnant women is not indicated unless they are scheduled for pelvic surgery or procedures."
    difficulty: medium
    tags: [bacterial-vaginosis, pregnancy, preterm-labour, metronidazole, gynecology]
  - front: "What are the treatment options for vulvovaginal candidiasis in pregnancy vs. non-pregnancy?"
    back: "In pregnancy: vaginal antifungals only (clotrimazole, butoconazole, miconazole, terconazole suppositories/creams) — oral fluconazole is contraindicated.\nNon-pregnancy: topical azoles (1, 3, or 7-day courses) OR fluconazole 150 mg PO single dose.\nProphylaxis for recurrent infection: boric acid vaginal suppositories or luteal-phase fluconazole.\n\nOral fluconazole is contraindicated in pregnancy due to risk of fetal harm (associated with cardiac defects and spontaneous abortion at higher doses). Topical azoles are safe and effective in pregnancy. Recurrent vulvovaginal candidiasis (≥4 episodes/year) warrants longer maintenance therapy. Partner treatment is not routinely recommended as candidiasis is not sexually transmitted."
    difficulty: medium
    tags: [candidiasis, pregnancy, fluconazole, azoles, vulvovaginitis, gynecology]
  - front: "What is the most common bacterial STI in Canada, what percentage is asymptomatic, and what is the first-line treatment?"
    back: "Chlamydia trachomatis is the most common bacterial STI in Canada. Approximately 80% of patients are asymptomatic. First-line treatment: doxycycline 100 mg PO BID x 7 days, or azithromycin 1 g PO single dose. Note: doxycycline is contraindicated in the 2nd and 3rd trimesters of pregnancy.\n\nChlamydia is an obligate intracellular parasite. Because most patients are asymptomatic, screening is recommended for sexually active individuals under 25 years, during pregnancy, and in neonates born to infected mothers. Chlamydia often co-exists with gonorrhea, so patients with chlamydia should be tested for gonorrhea. It is a reportable disease in Canada. Sexual partners within 60 days should be tested and given empiric treatment."
    difficulty: easy
    tags: [chlamydia, STI, Canada, doxycycline, azithromycin, reportable-disease, gynecology]
  - front: "What are the complications of untreated Chlamydia trachomatis infection in women?"
    back: "1. Pelvic inflammatory disease (PID): low-grade salpingitis causing tubal obstruction\n2. Infertility\n3. Ectopic pregnancy\n4. Chronic pelvic pain\n5. Fitz-Hugh-Curtis syndrome (perihepatitis/liver capsule inflammation)\n6. Reactive arthritis (HLA-B27 associated, male predominance), conjunctivitis, urethritis\n7. Perinatal infection: neonatal conjunctivitis and pneumonia\n\nChlamydia is a major cause of preventable infertility in Canada. Even subclinical or minimally symptomatic infections can cause significant tubal damage. Fitz-Hugh-Curtis syndrome presents with right upper quadrant pain from peri-hepatic adhesions. Reactive arthritis (formerly Reiter's syndrome) is the classic triad of arthritis, urethritis, and conjunctivitis seen predominantly in HLA-B27 positive males."
    difficulty: easy
    tags: [chlamydia, PID, infertility, fitz-hugh-curtis, reactive-arthritis, ectopic-pregnancy, gynecology]
  - front: "When is test of cure recommended after Chlamydia treatment?"
    back: "Test of cure (3 weeks after completing treatment) is recommended when:\n1. Compliance with treatment is uncertain/suboptimal\n2. An alternative treatment regimen was used\n3. Persistent symptoms remain\n4. The patient is prepubertal or pregnant\nTest of cure is NOT routinely indicated for C. trachomatis or N. gonorrhoeae otherwise.\n\nRoutine test of cure is not recommended for most chlamydia infections because standard regimens have high cure rates. However, in vulnerable populations (pregnant, prepubertal) or when treatment compliance is uncertain, retesting 3 weeks after completion ensures eradication. Retesting at 3 months post-treatment is recommended to detect re-infection."
    difficulty: medium
    tags: [chlamydia, test-of-cure, pregnancy, STI-management, gynecology]
  - front: "What is the best diagnostic test for Chlamydia trachomatis, and what specimens can be used?"
    back: "Nucleic acid amplification test (NAAT) is the preferred diagnostic test — equally or more effective than cervical culture. Specimens: cervical swab, vaginal swab (self-administered), rectal swab, pharyngeal swab, or urine. Tissue culture remains the definitive gold standard (obligate intracellular parasite), but NAAT is preferred clinically.\n\nNAAT has largely replaced culture for routine chlamydia testing due to its superior sensitivity, non-invasive specimen collection (urine, self-swab), and ability to detect organisms from multiple sites. Self-administered vaginal swabs are now equally or more effective than clinician-collected cervical swabs, improving screening uptake. Chlamydia can also infect the pharynx and rectum in cases of oral/anal sex."
    difficulty: medium
    tags: [chlamydia, NAAT, diagnosis, STI-testing, gynecology]
  - front: "What is the treatment of gonorrhea in a non-pregnant adult, and what is important to co-prescribe?"
    back: "Ceftriaxone 250 mg IM single dose PLUS azithromycin 1 g PO single dose. Azithromycin is co-prescribed to treat possible co-existing chlamydia (high rate of co-infection) and to help prevent cephalosporin resistance. Partners must be treated. Gonorrhea is a reportable disease.\n\nNeisseria gonorrhoeae Gram-negative intracellular diplococci are identified on Gram stain. In pregnant patients: ceftriaxone + azithromycin or spectinomycin 2 g IM + azithromycin 1 g PO (avoid quinolones due to resistance and fetal concerns). The dual therapy approach for gonorrhea (ceftriaxone + azithromycin) is recommended to prevent emergence of resistance and cover co-infection with chlamydia."
    difficulty: easy
    tags: [gonorrhea, ceftriaxone, azithromycin, STI-treatment, co-infection, gynecology]
  - front: "What HPV types cause anogenital warts vs. cervical cancer?"
    back: "Anogenital warts (condylomata acuminata): HPV types 6 and 11 (low-risk, non-oncogenic)\nCervical high-grade intraepithelial lesions/cancer: HPV types 16 and 18 (most oncogenic); also types 31, 33, 35, 36, 45 and others associated with cervical and vulvar intraepithelial neoplasia.\n\nHPV is the most common viral STI in Canada with over 200 subtypes, >30 of which are genital. Types 6 and 11 cause condylomata acuminata (anogenital warts) but rarely cause cancer. Types 16 and 18 cause approximately 70% of cervical cancers. The 9-valent HPV vaccine (Gardasil-9) covers types 6, 11, 16, 18, 31, 33, 45, 52, and 58, providing broader oncogenic protection."
    difficulty: easy
    tags: [HPV, anogenital-warts, cervical-cancer, oncogenic, HPV-types, gynecology]
  - front: "What HPV treatment options are patient-administered vs. provider-administered for anogenital warts?"
    back: "Patient-administered: podofilox 0.5% solution/gel BID x 3 days, then 4 days off (repeat x 4 weeks); imiquimod 5% cream 3x/week nightly x 16 weeks; sinecatechins 10% ointment TID x up to 16 weeks.\nProvider-administered: cryotherapy (liquid nitrogen, q1-2 wk); podophyllin resin in benzoin (weekly); trichloroacetic acid (TCA) 80-90% or bichloroacetic acid weekly x 4-6 wk (safe in pregnancy); surgical/laser removal.\n\nAnogenital warts require treatment if symptomatic or cosmetically bothersome. TCA is the only topical treatment safe in pregnancy. Imiquimod, podofilox (podofil0x), and podophyllin are contraindicated in pregnancy. Sinecatechins (green tea extract) is also contraindicated in pregnancy. For intraepithelial lesions and cancers, management follows colposcopy-guided protocols in gynecological oncology."
    difficulty: medium
    tags: [HPV, anogenital-warts, imiquimod, TCA, cryotherapy, pregnancy, gynecology]
  - front: "What is koilocytosis and what does it represent on Pap smear?"
    back: "Koilocytosis is the cytological hallmark of HPV infection on Pap smear: nuclear enlargement and atypia with a perinuclear halo (clearing) of the cytoplasm, giving an 'owl eye' appearance. It represents HPV-induced cytopathic effect and indicates viral infection of squamous epithelial cells.\n\nKoilocytes (from Greek koilos = hollow) are HPV-infected squamous cells with characteristic perinuclear cytoplasmic vacuolization and nuclear atypia. They are found on cervical cytology and biopsy specimens. Detection of koilocytosis on Pap smear indicates subclinical or clinical HPV infection and warrants colposcopy. HPV DNA subtyping can guide management but is not routinely performed."
    difficulty: medium
    tags: [HPV, koilocytosis, Pap-smear, cervical-cytology, colposcopy, gynecology]
  - front: "What are the clinical features of HSV vulvar infection, and how does primary differ from recurrent infection?"
    back: "Primary infection: average incubation 4 days (range 2-12 d); prodrome (tingling, burning, pruritus); multiple painful shallow ulcerations with small vesicles appearing 7-10 days post-infection; inguinal lymphadenopathy, malaise, fever; dysuria and urinary retention if urethra involved.\nRecurrent infections: less severe, less frequent, shorter duration (usually only HSV-2); prodrome precedes lesions; no systemic symptoms typically.\n\nHSV-2 causes 90% of genital herpes; HSV-1 causes 10%. Primary genital herpes is often more severe with constitutional symptoms because it is a new infection without prior immunity. Recurrences are common with HSV-2 (not HSV-1). The lesions are infectious from prodrome onset until complete healing. Education on transmission risk during prodrome and subclinical shedding is essential."
    difficulty: easy
    tags: [HSV, herpes-simplex, genital-herpes, vulva, STI, primary-vs-recurrent, gynecology]
  - front: "What are the treatment regimens for first episode genital herpes, recurrent episodes, and daily suppressive therapy?"
    back: "First episode (7-10 days): acyclovir 200 mg PO 5x/day, famciclovir 250 mg PO TID, or valacyclovir 1 g PO BID.\nRecurrent episode (5 days): acyclovir 400 mg PO TID, famciclovir 125 mg PO BID, or valacyclovir 1 g PO once daily.\nSuppressive therapy (consider if >6 recurrences/yr or recurrence every 2 months): acyclovir 400 mg BID, famciclovir 250 mg BID, valacyclovir 500 mg once daily, or valacyclovir 1 g once daily.\nSevere disease: IV acyclovir 5-10 mg/kg q8h x 2-7 days.\n\nAntiviral therapy for genital herpes reduces severity and duration of outbreaks but does not eradicate latent infection. Daily suppressive therapy reduces recurrence frequency, viral shedding, and transmission risk to partners. Suppressive therapy is indicated for patients with frequent recurrences (>6/year) or those who wish to minimize transmission risk. Valacyclovir is preferred for suppression due to better bioavailability and once-daily dosing."
    difficulty: medium
    tags: [HSV, acyclovir, valacyclovir, famciclovir, suppressive-therapy, genital-herpes, gynecology]
  - front: "What is the most sensitive and specific diagnostic test for primary syphilis, and what are the serological testing options?"
    back: "Most sensitive/specific: dark-field microscopy of aspirated ulcer serum or node fluid — detects Treponema pallidum spirochetes directly.\nNon-treponemal screening tests: VDRL, RPR — become non-reactive after treatment; may be positive with other conditions (false positives).\nSpecific anti-treponemal tests: FTA-ABS, MHA-TP, TP-PA — confirmatory; remain reactive for life even after adequate treatment.\n\nDark-field microscopy is the gold standard for diagnosing primary syphilis when a chancre is present, because serological tests are often negative early in primary syphilis. Non-treponemal tests (VDRL, RPR) are used for screening and monitoring treatment response (titres fall with successful treatment). Specific treponemal tests confirm the diagnosis and remain positive lifelong. This distinction is critical for interpreting syphilis serology."
    difficulty: medium
    tags: [syphilis, dark-field-microscopy, VDRL, RPR, FTA-ABS, serology, STI, gynecology]
  - front: "What are the four stages of syphilis and their key clinical features?"
    back: "Primary (3-4 wk after exposure): painless chancre on vulva/vagina/cervix; painless inguinal lymphadenopathy; serology usually negative.\nSecondary (2-6 mo after initial infection): maculopapular rash on palms/soles/trunk; condylomata lata (broad-based anogenital grey lesions); malaise, lymphadenopathy; serology positive.\nLatent: no clinical manifestations; detected by serology only.\nTertiary: tabes dorsalis, general paresis (neurological); aortic aneurysm/dilated aortic root (cardiovascular); vulvar gumma (rare).\n\nSyphilis caused by Treponema pallidum progresses through stages if untreated (25-40% develop late complications). The painless chancre of primary syphilis is a classic MCCQE1 finding — it differs from the painful ulcers of herpes or chancroid. Secondary syphilis produces the classic rash on palms and soles. Condylomata lata (secondary syphilis) must be distinguished from condylomata acuminata (HPV warts). Neurosyphilis (tabes dorsalis) and cardiovascular syphilis are tertiary complications."
    difficulty: easy
    tags: [syphilis, stages, chancre, condylomata-lata, tabes-dorsalis, STI, gynecology]
  - front: "What is the treatment of syphilis by stage in non-pregnant adults?"
    back: "Primary, secondary, or latent syphilis <1 year duration: benzathine penicillin G 2.4 million units IM single dose.\nLatent syphilis >1 year duration: benzathine penicillin G 2.4 million units IM weekly x 3 weeks.\nNeurosyphilis: IV aqueous penicillin G 3-4 million units q4h x 10-14 days.\n\nPenicillin remains the drug of choice for all stages of syphilis. Benzathine penicillin G provides sustained treponemicidal levels for the prolonged treatment needed in late syphilis. Neurosyphilis requires IV penicillin to achieve adequate CSF penetration. Syphilis is a reportable disease in Canada, and partners must be referred for treatment. Screening during pregnancy is mandated to prevent congenital syphilis."
    difficulty: easy
    tags: [syphilis, penicillin, benzathine-penicillin, neurosyphilis, treatment, STI, gynecology]
  - front: "What is a Bartholin gland abscess, and how is it managed based on size?"
    back: "A Bartholin gland abscess results from infection of an obstructed Bartholin duct (most commonly E. coli, polymicrobial, S. aureus, Group B Strep), presenting as unilateral swelling and pain at the inferior lateral vaginal opening.\nManagement:\n- Large mass >3 cm (1st or 2nd episode): I&D under local anesthesia with Word catheter placement for 2-3 weeks. If recurrent after two failed Word catheter attempts: marsupialization.\n- Small mass <3 cm: I&D with Word catheter, sitz baths, warm compresses.\n- Antibiotics: reserved for recurrence, high-risk complicated infection, culture-positive MRSA, or systemic infection.\n\nThe Bartholin glands are bilateral mucus-secreting glands at the posterior vaginal introitus. Obstruction leads to cyst formation, which can become infected (abscess). The Word catheter is a small balloon catheter inserted to maintain drainage and allow epithelialization of a new duct opening, preventing recurrence. Marsupialization surgically creates a permanent new duct opening. Routine antibiotics are not indicated for uncomplicated abscesses managed with drainage."
    difficulty: medium
    tags: [Bartholin-abscess, Word-catheter, marsupialization, I&D, gynecology]
  - front: "What is pelvic inflammatory disease (PID), what are the minimum diagnostic criteria, and what are the causative organisms in order of frequency?"
    back: "PID is infection of the upper genital tract (above cervix) including endometrium, fallopian tubes, ovaries, and pelvic peritoneum, primarily in young sexually active women.\nMinimum diagnostic criteria (one of): cervical motion tenderness, uterine tenderness, adnexal tenderness.\nAdditional criteria: fever >38.3°C, leukocytosis, abnormal mucopurulent cervical discharge, elevated CRP/ESR, NAAT-documented infection.\nCausative organisms (in order): C. trachomatis, N. gonorrhoeae, M. genitalium; E. coli/colonic anaerobes (postmenopausal women only).\n\nPID is diagnosed clinically because the minimum diagnostic criteria are intentionally sensitive to avoid missing and under-treating subclinical cases that still cause significant tubal damage and infertility. The gold standard is laparoscopy but is only indicated in select cases. PID accounts for up to 20% of all infertility. Risk factors include age 15-25, multiple partners, previous PID, and IUD insertion (risk is highest in the first 3 weeks after insertion)."
    difficulty: easy
    tags: [PID, pelvic-inflammatory-disease, diagnostic-criteria, chlamydia, gonorrhea, gynecology]
  - front: "What are the indications for inpatient vs. outpatient management of PID?"
    back: "Inpatient indications: moderate-severe illness, atypical infection, adnexal/tubo-ovarian mass or pelvic abscess, failed/intolerable oral therapy, immunocompromised, pregnant, adolescent (first episode), surgical emergency cannot be excluded (e.g., ovarian torsion), PID secondary to instrumentation.\nOutpatient: mild-moderate illness with typical findings, oral antibiotics tolerated, compliance ensured, follow-up within 48-72 h.\n\nThe decision for hospitalization is guided by clinical severity and risk factors. Tubo-ovarian abscess (TOA) is a classic indication for inpatient treatment given the risk of rupture and sepsis. If symptoms are not improving after 72 hours of inpatient treatment, laparoscopy may be required. IUD removal should be considered after a minimum of 24 hours of antibiotics. All partners should be treated."
    difficulty: medium
    tags: [PID, inpatient, outpatient, tubo-ovarian-abscess, gynecology]
  - front: "What antibiotic regimens are used for inpatient and outpatient treatment of PID?"
    back: "Inpatient (IV until 24h after improvement, then complete 14d with oral doxycycline):\n- Cefoxitin 2g IV q6h + doxycycline 100 mg PO/IV q12h, OR\n- Clindamycin 900 mg IV q8h + gentamicin (loading dose 2 mg/kg, then 1.5 mg/kg q8h maintenance)\n- Add metronidazole 500 mg PO BID x 14d for tubo-ovarian abscess.\n\nOutpatient (1st line): ceftriaxone 500 mg IM x1 + doxycycline 100 mg PO BID x 14d ± metronidazole 500 mg PO BID x 14d.\nOutpatient (2nd line): ofloxacin 400 mg PO BID x 14d or levofloxacin 500 mg PO once daily x 14d + metronidazole 500 mg PO BID x 14d.\n\nPID must be treated with polymicrobial coverage due to its polymicrobial etiology. IV therapy is continued until clinical improvement, then oral doxycycline completes a 14-day total course. Outpatient regimens must cover chlamydia, gonorrhea, and anaerobes. Consider retesting for C. trachomatis and N. gonorrhoeae 4-6 weeks after completing treatment if documented infection was found."
    difficulty: hard
    tags: [PID, antibiotics, ceftriaxone, doxycycline, clindamycin, gentamicin, treatment, gynecology]
  - front: "What are the complications of untreated PID, and how does infertility risk relate to number of PID episodes?"
    back: "Complications: chronic pelvic pain, persistent hydrosalpinx, abscess/peritonitis, adhesion formation, ectopic pregnancy, infertility, bacteremia, septic arthritis, endocarditis.\nInfertility risk: 1 episode PID → 13% infertility; 2 episodes → 36% infertility (cumulative risk increases significantly with each episode).\n\nTubal damage from PID is the major preventable cause of infertility and ectopic pregnancy in Canada. The scarring and adhesions from repeated infections progressively impair tubal function and patency. Even subclinical PID can cause significant damage. This highlights the importance of early diagnosis and treatment, as well as STI prevention and screening in at-risk populations."
    difficulty: easy
    tags: [PID, infertility, ectopic-pregnancy, hydrosalpinx, complications, gynecology]
  - front: "What is toxic shock syndrome (TSS) and what are its clinical features?"
    back: "TSS is a clinical illness caused by staphylococcal toxin (TSST-1) characterized by: sudden high fever/chills, sore throat, headache, diarrhea, macular erythroderma followed by desquamation 1-2 weeks later, signs of multiorgan failure, and refractory hypotension.\nMenstrual TSS: associated with high-absorbency tampon use. Non-menstrual gynecologic TSS: diaphragm/cervical cap/sponge use (>24h), postoperative/postpartum wound infections.\n\nTSS is caused by Staphylococcus aureus exotoxin TSST-1 acting as a superantigen. Withdrawal of highly absorbent tampons from the market significantly reduced menstrual TSS incidence, but tampon use (especially prolonged use or high absorbency) remains a risk factor. The classic skin finding is diffuse macular erythroderma resembling sunburn, followed by desquamation of palms and soles 1-2 weeks later."
    difficulty: medium
    tags: [toxic-shock-syndrome, TSS, staphylococcal, tampon, erythroderma, gynecology]
  - front: "What is the empiric antibiotic treatment for toxic shock syndrome?"
    back: "Vancomycin (load 20-35 mg/kg, maintenance 15-20 mg/kg q8-12h) + clindamycin 900 mg IV q8h + piperacillin-tazobactam 4.5g IV q6h. Continue combination therapy until hemodynamically stable for at least 48-72 hours. Also: remove source of infection, surgical debridement if warranted, treat shock, and ensure adequate hydration.\n\nClindamycin is included because it inhibits protein synthesis and thus suppresses toxin production by S. aureus, even against resistant strains. Vancomycin covers MRSA. Piperacillin-tazobactam provides broad-spectrum coverage including gram-negative organisms. Removal of the infectious source (e.g., tampon, IUD, packing) is the critical first step. IV fluid resuscitation for shock is essential."
    difficulty: hard
    tags: [toxic-shock-syndrome, vancomycin, clindamycin, piperacillin-tazobactam, treatment, gynecology]
  - front: "What are the four phases of the female sexual response cycle?"
    back: "1. Desire (libido): energy allowing initiation or response to sexual stimulation\n2. Arousal (excitement): physical and emotional stimulation leading to breast and genital vasodilation and clitoral engorgement\n3. Orgasm: maximized stimulation allowing relinquishment of control\n4. Resolution: congestion and tension resolves within seconds; complete resolution may take up to 60 minutes\nNote: these phases may vary in sequence, overlap, repeat, or be absent — cannot be applied consistently to all patients.\n\nThe Masters and Johnson model of sexual response (desire, arousal, orgasm, resolution) is the classic framework. However, contemporary understanding acknowledges that female sexual response is nonlinear and highly variable. Many women experience phases in different orders, and arousal may precede or follow desire. This is clinically important when assessing sexual dysfunction."
    difficulty: easy
    tags: [sexual-response, desire, arousal, orgasm, resolution, sexual-dysfunction, gynecology]
  - front: "What is the most common type of female sexual dysfunction, and what are the categories of etiology?"
    back: "Most common: lack of desire (reduced libido).\nCategories of etiology:\n1. Biological: gynecological (pregnancy, menopause, endometriosis), urological, vascular, neurological, musculoskeletal, systemic (DM, thyroid), medications (SSRIs, beta-blockers, antipsychotics, benzodiazepines, OCPs), behavioural (smoking, alcohol, opioids, obesity)\n2. Psychological: history of sexual violence, depression, anxiety, stress, fatigue\n3. Relationship: abuse, relationship distress, ineffective sexual stimulation\n\nA biopsychosocial approach to sexual dysfunction is essential. SSRIs are a particularly important pharmacological cause of sexual dysfunction (reduced desire, anorgasmia, delayed orgasm) — sildenafil may help SSRI-induced sexual dysfunction. The dyspareunia cycle illustrates how pain leads to anxiety, which leads to vaginismus, perpetuating the cycle. Thorough history-taking (including medications) is key to identifying reversible causes."
    difficulty: easy
    tags: [sexual-dysfunction, libido, dyspareunia, SSRI, biopsychosocial, gynecology]
  - front: "What are the types of anorgasmia and how is dyspareunia classified?"
    back: "Anorgasmia: Primary anorgasmia — never achieved orgasm under any circumstances. Secondary anorgasmia — was previously able to achieve orgasms but currently unable.\nDyspareunia: painful intercourse; classified as: Superficial (at vaginal introitus) or Deep (with deep penetration, often from pelvic pathology like endometriosis, PID).\n\nPrimary anorgasmia often responds to sex therapy, education, and anxiety reduction. Secondary anorgasmia suggests an acquired cause (medications, hormonal changes, relationship issues). Superficial dyspareunia suggests vulvar/vaginal pathology (atrophy, vaginismus, infection); deep dyspareunia suggests pelvic pathology (endometriosis, PID, adhesions). Pelvic floor physiotherapy is a key treatment for dyspareunia."
    difficulty: medium
    tags: [anorgasmia, dyspareunia, sexual-dysfunction, gynecology]
  - front: "What pharmacological treatments are available for sexual dysfunction related to lack of desire in postmenopausal women?"
    back: "For lack of desire (biological causes) in postmenopausal women: androgens (testosterone, DHEA), estrogens, tibolone, serotonergic/dopaminergic agents (flibanserin, bupropion, buspirone), bremelanotide. For SSRI-induced low libido: consider sildenafil.\nFor arousal/lubrication issues: non-hormonal water-based lubricants, topical estrogen (cream, tablet, or ring), coconut oil.\nFor sexual pain: topical estrogen for atrophy, nerve modulators (amitriptyline, gabapentin, pregabalin), pelvic floor physiotherapy.\n\nHypoactive sexual desire disorder (HSDD) is the most common sexual complaint in women. Treatment is multimodal. Flibanserin (FDA-approved for premenopausal HSDD) acts as a serotonin-1A agonist and 5HT-2A antagonist. Bremelanotide is a melanocortin receptor agonist for premenopausal HSDD. Testosterone supplementation can benefit postmenopausal women with low libido, though not yet Health Canada-approved specifically for this indication."
    difficulty: hard
    tags: [sexual-dysfunction, flibanserin, testosterone, DHEA, postmenopause, gynecology]
  - front: "What is the definition of menopause, and at what age does it typically occur?"
    back: "Menopause is defined as the absence of menses for 12 consecutive months (1 year). Average age of physiological menopause is 51 years (due to follicular atresia). Premature ovarian insufficiency (POI): before age 40 (causes: autoimmune, infection, Turner syndrome). Perimenopause: the period surrounding menopause characterized by fluctuating hormones, irregular cycles, and symptom onset.\n\nFSH >35 IU/L on cycle day 3 (if still cycling) supports menopausal transition, but FSH is not always predictive due to monthly variation. The diagnosis is clinical: absence of menses for 12 months. For women >45 with irregular cycles and symptoms, no testing is necessary. Ages 40-45: check beta-hCG, prolactin, TSH. Under 40: also check FSH. Iatrogenic menopause results from surgical oophorectomy, radiation, or chemotherapy."
    difficulty: easy
    tags: [menopause, premature-ovarian-insufficiency, perimenopause, FSH, gynecology]
  - front: "What is the pathophysiology of menopause and how does it explain the hormonal changes observed?"
    back: "Degenerating theca cells fail to respond to endogenous gonadotropins (FSH, LH) → less estrogen produced → decreased negative feedback on the hypothalamic-pituitary axis → increased FSH and LH. Stromal cells continue to produce androgens due to increased LH stimulation. Result: high FSH (FSH > LH), low estradiol (later), relative androgen excess.\n\nThe primary defect in menopause is ovarian follicular depletion. As follicle number and quality decline, inhibin B (which normally suppresses FSH) falls, allowing FSH to rise — the first hormonal change of menopause. Estradiol falls later. The continued androgen production by ovarian stroma explains why some women maintain some libido and why testosterone replacement may be beneficial in some postmenopausal women."
    difficulty: medium
    tags: [menopause, pathophysiology, FSH, estrogen, androgens, hypothalamic-pituitary, gynecology]
  - front: "What are the clinical features of menopause organized by system?"
    back: "Vasomotor: hot flushes/flashes, night sweats, sleep disturbances, formication, nausea, palpitations (85% of women; tends to dissipate over time).\nUrogenital (genitourinary syndrome of menopause/GUSM): vaginal dryness, dyspareunia, pruritus, post-coital bleeding, urinary frequency/urgency/incontinence. Exam: thinning tissues, erythema, petechiae, dryness.\nSkeletal: osteoporosis, joint/muscle pain, back pain.\nSkin/soft tissue: decreased breast size, skin thinning, loss of elasticity.\nPsychological: anxiety, depression, irritability, fatigue, decreased libido, memory loss.\n\nVasomotor symptoms are the most common reason women seek treatment (20-30% seek medical attention, 10% are unable to work). GUSM (formerly vulvovaginal atrophy/urogenital atrophy) is a chronic progressive condition affecting sexual function, urinary health, and quality of life. Unlike vasomotor symptoms, GUSM does not improve spontaneously and worsens over time without treatment."
    difficulty: easy
    tags: [menopause, hot-flushes, GUSM, vaginal-atrophy, osteoporosis, vasomotor, gynecology]
  - front: "What is the first-line treatment for menopausal vasomotor symptoms, and what are the alternatives?"
    back: "First-line: Menopause hormonal therapy (MHT/HRT) — most effective for vasomotor symptoms.\nAlternatives (for women who cannot take MHT): SSRI (e.g., paroxetine, escitalopram), venlafaxine (SNRI), gabapentin, propranolol, clonidine, acupuncture, behavioural modifications.\n\nMHT is the most effective treatment for vasomotor symptoms and also addresses GUSM, osteoporosis, and mood symptoms. Contraindications to MHT include hormone-sensitive cancers (breast, endometrial), active thromboembolic disease, unexplained vaginal bleeding, and active liver disease. Non-hormonal options are available for women with contraindications. SSRIs are particularly useful for women with co-existing depression."
    difficulty: easy
    tags: [menopause, MHT, HRT, vasomotor, hot-flushes, SSRI, treatment, gynecology]
  - front: "What are the treatment options for genitourinary syndrome of menopause (GUSM/vaginal atrophy)?"
    back: "Local (vaginal) estrogen (preferred for isolated GUSM): estrogen cream (Premarin®/Estragyn Vaginal Cream®), vaginal suppository/tablet (VagiFem®), vaginal ring (Estring®).\nNon-hormonal: lubricants (Replens®), water-based lubricants, coconut oil.\nVaginal DHEA (prasterone/Intrarosa®): FDA-approved for GUSM.\nSERMs: ospemifene (oral, for dyspareunia from GUSM).\nLifestyle: smoking cessation, weight loss.\n\nLocal vaginal estrogen is the preferred treatment for isolated GUSM as it provides local benefit with minimal systemic absorption and avoids systemic MHT risks. Unlike vasomotor symptoms that improve over time, GUSM is chronic and progressive. Vaginal DHEA (prasterone) is converted locally to estrogens and androgens and is effective for dyspareunia. Non-hormonal lubricants provide symptom relief but do not reverse the underlying atrophic changes."
    difficulty: medium
    tags: [menopause, GUSM, vaginal-atrophy, local-estrogen, DHEA, prasterone, dyspareunia, gynecology]
  - front: "What are the investigations for menopausal transition and what do the hormonal findings show?"
    back: "For women with irregular cycles and menopausal symptoms:\n- >45 yr: no testing necessary (clinical diagnosis)\n- 40-45 yr: beta-hCG, prolactin, TSH\n- <40 yr: beta-hCG, FSH, prolactin, TSH\nFindings: increased FSH (>35 IU/L on day 3 of cycle), FSH > LH, decreased estradiol (later). Note: FSH not always predictive due to monthly variation; use clinical criteria (12 months amenorrhea) to diagnose.\n\nFSH >35 IU/L is supportive but not diagnostic of menopause due to fluctuation. In women <40, FSH is measured to diagnose premature ovarian insufficiency (POI), which has different management and long-term health implications. Beta-hCG is essential to rule out pregnancy in perimenopausal women with irregular cycles. TSH rules out thyroid dysfunction as a cause of irregular periods and vasomotor-like symptoms."
    difficulty: medium
    tags: [menopause, FSH, investigations, premature-ovarian-insufficiency, gynecology]
  - front: "A 24-year-old sexually active woman presents with lower abdominal pain and mucopurulent cervical discharge. Exam shows cervical motion tenderness. What is the diagnosis, and what workup is needed before starting treatment?"
    back: "Diagnosis: Pelvic Inflammatory Disease (PID) — minimum criterion (cervical motion tenderness) met.\nWorkup: beta-hCG (must rule out ectopic pregnancy), CBC, blood cultures if sepsis suspected, urine R&M, NAAT for N. gonorrhoeae/C. trachomatis/M. genitalium, HIV testing, syphilis serology, pelvic ultrasound (assess for TOA), vaginal swab for Gram stain and C&S.\n\nThis is a classic MCCQE1 clinical scenario. The most critical step before diagnosing PID is ruling out ectopic pregnancy (beta-hCG), as both can present with pelvic pain and cervical motion tenderness. Ectopic pregnancy is a surgical emergency. Once ectopic is excluded, empiric treatment for PID should be started promptly — delay increases risk of tubal damage. Ultrasound detects tubo-ovarian abscess, which changes management to inpatient care."
    difficulty: medium
    tags: [PID, ectopic-pregnancy, workup, NAAT, beta-hCG, clinical-scenario, gynecology]
  - front: "A 28-year-old woman has thick white vaginal discharge with intense itching. Microscopy shows hyphae and spores. What is the diagnosis, treatment, and what is contraindicated in pregnancy?"
    back: "Diagnosis: Vulvovaginal candidiasis (Candida albicans most common).\nTreatment (non-pregnant): topical azoles (clotrimazole, miconazole, terconazole) for 1, 3, or 7 days, OR fluconazole 150 mg PO single dose.\nIn pregnancy: topical azoles only — oral fluconazole is contraindicated (associated with fetal cardiac defects and spontaneous abortion).\nMicroscopy: KOH wet mount reveals pseudohyphae and spores.\n\nCandida causes the classic white 'cottage cheese' discharge with intense pruritus, pH <4.5, and KOH wet mount showing hyphae/spores with paucity of WBCs. The absence of WBCs helps distinguish from BV and Trichomoniasis. Fluconazole's teratogenicity is a key safety point for prescribing during pregnancy. Recurrent infection (>4 episodes/year) warrants longer suppressive therapy and investigation for predisposing factors (DM, immunosuppression)."
    difficulty: easy
    tags: [candidiasis, fluconazole, pregnancy, KOH, hyphae, vulvovaginitis, gynecology]
  - front: "What are the notifiable (reportable) STIs to public health in Canada, and which gynecological STIs are reportable?"
    back: "CDC Notifiable/Reportable Diseases include: Chancroid, Chlamydia, Gonorrhea, Hepatitis A/B/C, HIV, Syphilis.\nOf the gynecological STIs covered: Chlamydia, Gonorrhea, and Syphilis are all reportable. PID is reportable when linked to these organisms. All sexual partners must be notified and offered testing/treatment.\n\nReporting STIs to public health is a legal requirement in Canada, enabling contact tracing and epidemiological surveillance. For chlamydia, partners within 60 days prior to symptom onset or specimen collection (if asymptomatic) must be tested and empirically treated. Partner notification is essential to break transmission chains. Physicians have a duty to report these infections and may assist with partner notification."
    difficulty: easy
    tags: [reportable-disease, public-health, chlamydia, gonorrhea, syphilis, Canada, gynecology]
  - front: "What is postoperative pelvic cellulitis after hysterectomy, and how is it managed?"
    back: "Pelvic cellulitis is a common post-hysterectomy complication affecting the vaginal vault/cuff. Features: erythema, induration, tenderness, and discharge at the vaginal cuff.\nManagement: if fever and leukocytosis → broad-spectrum antibiotics (clindamycin + gentamicin); drain if excessive purulence or large mass. Can progress to intra-abdominal and pelvic abscess.\n\nVaginal cuff cellulitis is one of the most common postoperative complications of hysterectomy, typically occurring within the first week. The vaginal cuff represents a potential entry site for ascending infection. Broad-spectrum coverage targeting polymicrobial flora (including anaerobes) is essential. Progression to pelvic abscess requires drainage. This is distinct from vaginal cuff hematoma or dehiscence."
    difficulty: medium
    tags: [postoperative, pelvic-cellulitis, hysterectomy, vaginal-cuff, clindamycin, gynecology]
  - front: "What HPV subtypes are covered by the Gardasil-9 vaccine, and how does this prevent HPV disease?"
    back: "Gardasil-9 covers HPV types: 6, 11 (anogenital warts), 16, 18 (most oncogenic, 70% of cervical cancers), 31, 33, 45, 52, 58 (additional oncogenic types). It is a prophylactic vaccine — prevents infection by HPV types covered, thereby preventing warts and HPV-related dysplasia/cancers. It does not treat existing HPV infection.\n\nGardasil-9 provides the broadest protection, covering 9 HPV types responsible for ~90% of cervical cancers and ~90% of anogenital warts. It is most effective when given before HPV exposure (before sexual debut). In Canada, it is offered as part of publicly funded school immunization programs. Condoms reduce but do not fully eliminate HPV transmission (virus can be shed from uncovered skin)."
    difficulty: easy
    tags: [HPV, Gardasil-9, vaccination, cervical-cancer-prevention, gynecology]
  - front: "What is Fitz-Hugh-Curtis syndrome and what causes it?"
    back: "Fitz-Hugh-Curtis syndrome is perihepatitis (inflammation of the liver capsule) occurring as a complication of pelvic inflammatory disease, most commonly from Chlamydia trachomatis (also Neisseria gonorrhoeae). It presents with right upper quadrant pain that may be confused with hepatobiliary disease. It results from transperitoneal or hematogenous spread of infection from the fallopian tubes to the liver capsule.\n\nFitz-Hugh-Curtis syndrome is an important complication to recognize because RUQ pain in a young sexually active woman should prompt consideration of PID as an etiology, not just hepatobiliary pathology. Perihepatic 'violin string' adhesions are the characteristic laparoscopic finding. Treatment is the same as for PID (antibiotics targeting chlamydia and gonorrhea). Liver function tests are usually normal."
    difficulty: medium
    tags: [Fitz-Hugh-Curtis, perihepatitis, PID, chlamydia, RUQ-pain, gynecology]
  - front: "What is the dyspareunia cycle, and why is it clinically important?"
    back: "The dyspareunia cycle: Painful intercourse (initially from organic cause) → anxiety with or without sexual response → vaginismus with intercourse → worsening pain → perpetuates cycle.\nClinical importance: even after the organic cause is treated, the psychological and musculoskeletal components (anxiety, vaginismus) may persist, requiring multidisciplinary treatment including pelvic floor physiotherapy and sex therapy.\n\nUnderstanding the dyspareunia cycle helps clinicians appreciate why addressing only the biological cause of dyspareunia is insufficient. Vaginismus (involuntary contraction of pelvic floor muscles) can develop as a conditioned response to pain, persisting even after the original cause is resolved. Treatment requires addressing all components: biological (treat underlying pathology, topical estrogen for atrophy, nerve modulators), psychological (sex therapy, CBT), and physical (pelvic floor physiotherapy)."
    difficulty: medium
    tags: [dyspareunia, vaginismus, dyspareunia-cycle, pelvic-floor, sexual-dysfunction, gynecology]
  - front: "What is the primary indication for menopausal hormone therapy (MHT)?"
    back: "Treatment of menopausal symptoms, specifically vasomotor instability (hot flashes). MHT should NOT be prescribed if the only objective is prevention of chronic disease.\n\nCanadian guidelines emphasize that MHT is appropriate for symptom relief. It should be individualized, using the lowest effective dose, and its use beyond age 60 or more than 5 years requires a careful risk-benefit discussion between clinician and patient."
    difficulty: easy
    tags: [menopause, hormone therapy, MHT, vasomotor symptoms, gynecology]
  - front: "When is menopausal hormone therapy considered safest to initiate?"
    back: "MHT is safest when initiated less than 10 years after menopause AND/OR in women younger than 60 years old.\n\nThe 'timing hypothesis' underlies this guideline. Initiating HT early in the menopausal transition, before established atherosclerosis, is associated with more favourable cardiovascular risk profiles. For symptomatic women meeting these criteria, benefits of symptom relief generally outweigh risks."
    difficulty: easy
    tags: [menopause, hormone therapy, MHT, timing hypothesis, cardiovascular risk]
  - front: "Which route of estrogen administration is preferred in MHT and why?"
    back: "Transdermal estrogen (patch or gel) is preferred overall, especially for patients with hypertriglyceridemia, impaired hepatic function, and those who smoke.\n\nOral estrogen undergoes first-pass hepatic metabolism, increasing hepatic production of clotting factors and triglycerides. Transdermal estrogen bypasses this effect, resulting in lower thromboembolic risk and less adverse impact on lipid profiles."
    difficulty: medium
    tags: [menopause, hormone therapy, transdermal estrogen, pharmacology, thromboembolic risk]
  - front: "Why is progestin added to estrogen therapy in women with an intact uterus?"
    back: "Progestin is given in combination with estrogen to prevent development of endometrial hyperplasia and endometrial cancer in women with an intact uterus.\n\nUnopposed estrogen stimulates endometrial proliferation, which over time leads to hyperplasia and malignancy. Adding progestin (or progesterone) counters this effect. Women without a uterus (post-hysterectomy) can safely use estrogen alone."
    difficulty: easy
    tags: [menopause, hormone therapy, progestin, endometrial protection, unopposed estrogen]
  - front: "Which breast cancer risk is associated with combined estrogen-progesterone HRT vs. estrogen-only HRT?"
    back: "Combined estrogen-progesterone HRT increases breast cancer risk (RR ~1.3) after 4-5 years of use. Estrogen-only HRT has no increased risk for at least 8 years in women without a uterus; it may actually REDUCE the risk of breast cancer.\n\nWHI data demonstrated that the addition of progestin to estrogen was responsible for increased breast cancer risk. Estrogen-alone users (post-hysterectomy) did not show this risk increase and had a reduction in breast cancer incidence in the trial. This distinction is clinically important."
    difficulty: medium
    tags: [menopause, hormone therapy, breast cancer, WHI, estrogen-progesterone, risk]
  - front: "What are the benefits listed for MHT in Table 19 of Toronto Notes?"
    back: "Benefits of MHT: reduction of vasomotor symptoms, reduction of sleep problems, reduction of mood/anxiety problems, reduction of aches and pains, osteoporosis prevention and treatment, reversal of vulvar and vaginal atrophy.\n\nLocal vaginal estrogen therapy is recommended if vulvovaginal atrophy is the only indication. For systemic benefits including vasomotor and mood symptoms, systemic MHT is appropriate. Osteoporosis prevention is a significant benefit of MHT, as osteoporosis is the single most important health hazard associated with menopause."
    difficulty: easy
    tags: [menopause, hormone therapy, benefits, MHT, osteoporosis, vasomotor]
  - front: "What is the most important health hazard associated with menopause, and what is the leading cause of death post-menopause?"
    back: "Osteoporosis is the single most important health hazard associated with menopause. Cardiovascular disease is the leading cause of death post-menopause.\n\nWhile osteoporosis causes significant morbidity (fractures, disability), cardiovascular disease accounts for more mortality. Both are estrogen-deficiency related and can potentially be mitigated with MHT when initiated at the appropriate time."
    difficulty: easy
    tags: [menopause, osteoporosis, cardiovascular disease, mortality, gynecology]
  - front: "What are the relative contraindications to MHT?"
    back: "Relative contraindications: pre-existing uncontrolled HTN, uterine fibroids and endometriosis, familial hyperlipidemias, migraine headaches, family history of estrogen-dependent cancer, chronic thrombophlebitis, DM with vascular disease, gallbladder disease, hypertriglyceridemia, impaired liver function, fibrocystic disease of the breasts.\n\nFor patients with relative contraindications, transdermal estrogen may be safer than oral (avoids hepatic first-pass, reduces triglycerides and clotting factor synthesis). Clinical judgment is required to weigh benefits against individual risks."
    difficulty: medium
    tags: [menopause, hormone therapy, relative contraindications, MHT]
  - front: "What does the Mirena IUD provide in MHT regimens?"
    back: "The Mirena IUD (levonorgestrel 52 mg, releasing ~20 mcg/day) is commonly used as the progestin component in combined MHT regimens, providing endometrial protection without systemic progestin side effects.\n\nUsing a levonorgestrel IUD delivers progestin locally to the endometrium. This reduces systemic progestin side effects (mood changes, bloating, breast tenderness) while still preventing endometrial hyperplasia in women receiving systemic estrogen."
    difficulty: medium
    tags: [menopause, hormone therapy, Mirena IUD, levonorgestrel, progestin, MHT regimen]
  - front: "What is pelvic organ prolapse (POP)?"
    back: "Pelvic organ prolapse is the descent of pelvic structures (bladder, rectum, small intestine, or uterus) into or through the vagina, resulting from weakening or failure of pelvic floor support structures.\n\nPOP results from damage to ligaments, fascia, and muscles of the pelvic floor. The primary clinical features are vaginal bulge and pressure. It is staged using the POP-Q system, which is based on the most distal portion of prolapse relative to the hymen."
    difficulty: easy
    tags: [pelvic organ prolapse, urogynecology, pelvic floor, gynecology]
  - front: "What are the risk factors for pelvic organ prolapse?"
    back: "Risk factors: pregnancy, aging, decreased estrogen (post-menopause), increased intra-abdominal pressure (obesity, chronic cough, constipation, ascites, heavy lifting), ethnicity (greater incidence in White women vs. Asian or African), and connective tissue disorders.\n\nPregnancy and vaginal delivery are the most modifiable risk factors. Estrogen deficiency leads to decreased collagen in pelvic support structures. White ethnicity has a higher incidence for reasons that may relate to inherent differences in pelvic anatomy and connective tissue."
    difficulty: easy
    tags: [pelvic organ prolapse, risk factors, urogynecology, gynecology]
  - front: "How is pelvic organ prolapse staged using the POP-Q system?"
    back: "Stage 1: most distal portion >1 cm above hymen. Stage 2: most distal portion between 1 cm above and 1 cm below hymen. Stage 3: most distal portion >1 cm below hymen but no further than 2 cm less than total vaginal length. Stage 4: complete procidentia (complete eversion).\n\nThe POP-Q (Pelvic Organ Prolapse Quantification) system is the standardized method to objectively quantify prolapse. Measurements are taken at rest and with straining in the dorsal lithotomy position."
    difficulty: medium
    tags: [pelvic organ prolapse, POP-Q staging, urogynecology, gynecology]
  - front: "What are the general conservative treatments for pelvic organ prolapse?"
    back: "Conservative treatments: weight loss, pelvic floor muscle training (Kegel exercises, pelvic physiotherapy), local vaginal estrogen therapy, and vaginal pessary (supportive or space-occupying intravaginal devices).\n\nConservative management is first-line for most patients with POP. Pessaries provide mechanical support and are an alternative to surgery, especially for patients who are poor surgical candidates or wish to preserve fertility. Local estrogen helps restore tissue integrity in hypoestrogenic patients."
    difficulty: easy
    tags: [pelvic organ prolapse, conservative treatment, pessary, Kegel exercises, pelvic floor]
  - front: "What are the clinical features and surgical treatment of anterior vaginal wall prolapse (cystocele)?"
    back: "Clinical features: urinary frequency, urgency, nocturia, stress incontinence, incomplete bladder emptying with increased UTI risk. Surgical treatment: anterior colporrhaphy ('anterior repair'); consider additional procedures if documented stress urinary incontinence.\n\nAnterior wall prolapse involves herniation of the bladder into the anterior vaginal wall. It can cause voiding dysfunction because of urethral kinking and bladder compression. Anterior colporrhaphy tightens the anterior vaginal wall and its fascial support."
    difficulty: medium
    tags: [cystocele, anterior vaginal wall prolapse, pelvic organ prolapse, anterior colporrhaphy, urogynecology]
  - front: "What are the clinical features and surgical treatment of posterior vaginal wall prolapse (rectocele)?"
    back: "Clinical features: straining/digitation to evacuate stool, constipation. Treatment: general conservative measures, laxatives and stool softeners; surgical: posterior colporrhaphy ('posterior repair') with plication of endopelvic fascia and approximation of perineal muscles (can cause dyspareunia).\n\nRectocele is herniation of the rectum into the posterior vaginal wall. Patients may need to apply digital pressure to the posterior vaginal wall to complete defecation. Posterior repair restores the rectovaginal septum but carries a risk of dyspareunia due to tissue tightening."
    difficulty: medium
    tags: [rectocele, posterior vaginal wall prolapse, pelvic organ prolapse, posterior colporrhaphy, urogynecology]
  - front: "What type of prolapse is a vault prolapse, and why is it considered a true hernia of the pelvis?"
    back: "Vault prolapse (previously 'enterocele') is an apical prolapse post-hysterectomy where the apex of the vaginal vault protrudes into the vagina, often containing small bowel. It is the only true hernia of the pelvis because peritoneum herniates with the small bowel.\n\nAfter hysterectomy, the apex of the vaginal vault requires ligamentous support. If this support fails, the peritoneal sac (containing small intestine) can herniate through the vaginal apex — a true hernia by anatomic definition. Treatment includes sacrocolpopexy, sacrospinous fixation, or uterosacral ligament suspension."
    difficulty: medium
    tags: [vault prolapse, enterocele, apical prolapse, hernia, pelvic organ prolapse, urogynecology]
  - front: "What is uterine prolapse and what are its clinical features?"
    back: "Uterine prolapse is protrusion of the cervix and uterus into the vagina (apical prolapse). Features: groin/back pain (stretching of uterosacral ligaments), pelvic heaviness/pressure, worse with standing and lifting, worse at end of day, relieved by lying down, possible ulceration/bleeding (especially if hypoestrogenic), urinary incontinence.\n\nSymptoms worsen with increased intra-abdominal pressure and improve when recumbent because gravity is no longer a factor. Treatment is vaginal hysterectomy plus surgical prevention of vault prolapse. Pessary is an alternative for non-surgical candidates."
    difficulty: medium
    tags: [uterine prolapse, apical prolapse, pelvic organ prolapse, urogynecology, gynecology]
  - front: "Define stress urinary incontinence and list its risk factors."
    back: "Stress urinary incontinence (SUI) is involuntary loss of urine with increased intra-abdominal pressure (cough, laugh, sneeze, walk, run), affecting up to 37.5% of women. Risk factors: increased age, obesity, pregnancy/vaginal delivery, hypoestrogenic state (post-menopause, post-partum), smoking/chronic cough, neurological conditions, genetics, high-impact exercise.\n\nSUI results from urethral sphincter deficiency or urethral hypermobility. Vaginal delivery is a key modifiable risk factor. Hypoestrogenism leads to urethral mucosal atrophy and reduced urethral closure pressure. Obesity increases resting intra-abdominal pressure."
    difficulty: easy
    tags: [stress urinary incontinence, SUI, incontinence, risk factors, urogynecology]
  - front: "What investigations are used in the diagnosis of stress urinary incontinence?"
    back: "Investigations: urinalysis (hematuria, pyuria, glucosuria, proteinuria), urine cytology if hematuria/irritative voiding symptoms, urine culture if pyuria/bacteria, post-void residual (normal <1/3 total volume; abnormal >1/3), and urodynamic testing.\n\nPost-void residual assessment helps distinguish SUI from overflow incontinence or bladder outlet obstruction. Urodynamics can objectively demonstrate urethral sphincter insufficiency and exclude detrusor overactivity. Urinalysis rules out UTI as a cause of symptoms."
    difficulty: medium
    tags: [stress urinary incontinence, investigations, urodynamics, post-void residual, urogynecology]
  - front: "What are the surgical treatment options for stress urinary incontinence?"
    back: "Surgical options: midurethral sling (TVT — tension-free vaginal tape, TOT — transobturator tape), urethropexy (Burch procedure), pubovaginal sling, and urethral bulking agents.\n\nMidurethral slings (TVT/TOT) are the gold standard surgical treatment for SUI with excellent cure rates. The Burch procedure (laparoscopic or open) elevates the bladder neck. Urethral bulking agents (injected periurethrally) are less invasive but less durable. Conservative treatment should precede surgery."
    difficulty: medium
    tags: [stress urinary incontinence, surgical treatment, midurethral sling, TVT, Burch procedure, urogynecology]
  - front: "Define overactive bladder (OAB) and its symptom complex."
    back: "OAB is a symptom syndrome defined as urgency, with or without urge urinary incontinence (UUI), usually with frequency and nocturia. It affects up to 22% of patients. UUI is involuntary leakage with or immediately preceded by a strong desire to void.\n\nOAB results from involuntary detrusor contractions that overcome the urethral sphincter mechanism or from poor bladder compliance. Unlike SUI (triggered by physical activity), OAB is driven by urgency/detrusor overactivity. Treatment is stepwise: behavioral, pharmacologic, then procedural."
    difficulty: easy
    tags: [overactive bladder, OAB, urgency incontinence, UUI, urogynecology]
  - front: "What are the causes/etiology of overactive bladder?"
    back: "Causes: idiopathic (congenital, aging); medical (CHF, DM, diuretics); neurogenic (MS, Parkinson's, CVD, dementia, spinal cord injury); bladder outlet obstruction (previous bladder neck surgery, POP); gynecologic (UTI, pregnancy, pelvic mass, urethral diverticulum); psychosomatic (habits, anxiety, high fluid consumption).\n\nNeurogenic OAB results from loss of central inhibition of the micturition reflex. Any condition causing increased post-void residual (outlet obstruction, POP) can secondarily cause detrusor instability. Identifying and treating the underlying cause is key to management."
    difficulty: medium
    tags: [overactive bladder, etiology, neurogenic bladder, urogynecology]
  - front: "What medications are used to treat overactive bladder?"
    back: "Anticholinergics: oxybutynin (Ditropan), tolterodine (Detrol), fesoterodine (Toviaz), solifenacin (Vesicare), trospium (Trosec), darifenacin (Enablex). Beta-3 adrenergic agonist: mirabegron (Myrbetriq).\n\nAnticholinergics block muscarinic receptors on the detrusor, reducing involuntary contractions. Mirabegron relaxes the detrusor through beta-3 agonism and is an alternative for patients intolerant to anticholinergics (e.g., due to dry mouth, constipation, urinary retention, cognitive effects in elderly). Procedures include sacral neuromodulation and botox injection."
    difficulty: medium
    tags: [overactive bladder, anticholinergics, mirabegron, OAB pharmacotherapy, urogynecology]
  - front: "What are the behavioural/non-pharmacologic treatments for overactive bladder?"
    back: "Behaviour modification: reduce bladder irritants (caffeine, smoking, alcohol, acidic/spicy foods), adequate water intake, regular voiding schedule. Bladder training with a pelvic physiotherapist. Procedures: sacral neuromodulation, detrusor botulinum toxin injection.\n\nBehavioral interventions are first-line for OAB. Bladder retraining gradually extends voiding intervals to increase bladder capacity and reduce urgency. Sacral neuromodulation (InterStim) modulates the sacral reflex arc. Botulinum toxin injection directly inhibits detrusor contraction."
    difficulty: easy
    tags: [overactive bladder, behavioural treatment, bladder training, sacral neuromodulation, urogynecology]
  - front: "What is the most common gynecological malignancy in North America and its typical presentation?"
    back: "Endometrial carcinoma is the most common gynecological malignancy in North America (40%), and the 4th most common cancer in women. Postmenopausal bleeding (PMB) is the classic presentation — PMB = endometrial cancer until proven otherwise (95% present with vaginal bleeding). Mean age is 60 years.\n\nBecause endometrial carcinoma typically presents with early bleeding symptoms, most cases are diagnosed at Stage I with an 85-90% 5-year survival. The diagnosis should be assumed until ruled out by endometrial biopsy in any postmenopausal woman with vaginal bleeding."
    difficulty: easy
    tags: [endometrial carcinoma, gynecologic oncology, postmenopausal bleeding, PMB, gynecology]
  - front: "What are the risk factors for endometrial cancer (mnemonic COLD NUT)?"
    back: "COLD NUT: Cancer (ovarian, breast, colon family history), Obesity, Late menopause, Diabetes mellitus, Nulliparity, Unopposed estrogen (PCOS, anovulation, HRT), Tamoxifen (chronic use). Also: genetic syndromes (HNPCC/Lynch II, Cowden syndrome), prior pelvic radiation, early menarche.\n\nThese risk factors all relate to excessive estrogen stimulation (unopposed by progesterone) or genetic predisposition. Obesity increases peripheral conversion of androgens to estrogen. Tamoxifen acts as an estrogen agonist on the endometrium despite being an antagonist in breast tissue."
    difficulty: easy
    tags: [endometrial carcinoma, risk factors, COLD NUT, unopposed estrogen, gynecologic oncology]
  - front: "Compare Type I vs. Type II endometrial carcinoma."
    back: "Type I (80%): estrogen-related, endometrioid histology, well-differentiated (grade 1-2), associated with PCOS/obesity/unopposed estrogen, better prognosis. Type II (20%): non-estrogen related, non-endometrioid (serous, clear cell, carcinosarcoma), associated with p53 mutation and HER2 overexpression, more common in Black patients, poorer prognosis.\n\nType I carcinoma arises through an estrogen-driven hyperplasia-to-carcinoma sequence. Type II carcinomas develop de novo from atrophic endometrium and have more aggressive behavior. This distinction impacts treatment planning and screening strategies."
    difficulty: medium
    tags: [endometrial carcinoma, Type I endometrial cancer, Type II endometrial cancer, endometrioid, gynecologic oncology]
  - front: "What is the abnormal endometrial thickness threshold on ultrasound for postmenopausal vs. premenopausal women?"
    back: "Abnormal endometrial thickness: >5 mm in postmenopausal women (symptomatic), and >11 mm in asymptomatic premenopausal women.\n\nTransvaginal ultrasound is a useful initial investigation for PMB. An endometrial thickness >5 mm in a postmenopausal woman with bleeding warrants endometrial sampling. In asymptomatic premenopausal women, a higher threshold of 11 mm is used before biopsy is indicated."
    difficulty: medium
    tags: [endometrial carcinoma, endometrial thickness, ultrasound, postmenopausal bleeding, gynecology]
  - front: "How is endometrial carcinoma investigated?"
    back: "Endometrial sampling (office endometrial biopsy) is the primary investigation. Hysteroscopy for persistent uterine bleeding with benign/inadequate sampling. CT and MRI only for high-grade tumours or suspected extrauterine spread. Tumour markers not used for screening.\n\nOffice endometrial biopsy is the gold standard for initial investigation — simple, inexpensive, and high sensitivity. Hysteroscopy allows direct visualization and targeted biopsy. MRI is superior to CT for assessing depth of myometrial invasion, which is key for staging and surgical planning."
    difficulty: medium
    tags: [endometrial carcinoma, investigations, endometrial biopsy, hysteroscopy, gynecologic oncology]
  - front: "What are the prognostic factors for endometrial carcinoma?"
    back: "Key prognostic factors: FIGO stage (most important), histologic grade, histologic subtype, and depth of myometrial invasion.\n\nFIGO stage remains the strongest independent predictor of survival: Stage I has 85-90% 5-year survival, while Stage IV has very poor outcomes. Myometrial invasion >50% (Stage IB) significantly worsens prognosis. High-grade (Type II) tumours have worse outcomes regardless of stage."
    difficulty: medium
    tags: [endometrial carcinoma, prognosis, FIGO staging, myometrial invasion, gynecologic oncology]
  - front: "What is the surgical treatment of endometrial carcinoma?"
    back: "Total hysterectomy + BSO (bilateral salpingo-oophorectomy). For more advanced cases: pelvic washings + pelvic and para-aortic node dissection + omentectomy. Adjuvant therapy (radiation and/or chemotherapy) depends on clinical and histological features. Hormone therapy (progesterone IUD or oral progestins) can be used for fertility-sparing treatment.\n\nSurgery provides both treatment and staging information (determining need for adjuvant therapy). Fertility-sparing approaches using progestins are options for young women with well-differentiated, Stage IA disease who wish to preserve fertility. CA-125 is used to monitor treatment response."
    difficulty: medium
    tags: [endometrial carcinoma, surgical treatment, hysterectomy, BSO, gynecologic oncology]
  - front: "What is uterine sarcoma, and what is its most common presenting symptom?"
    back: "Uterine sarcoma is a rare uterine malignancy (3-9% of all uterine malignancies) arising from stromal components (endometrial stroma, mesenchymal, or myometrial tissues). It behaves more aggressively than endometrial carcinoma with a 5-year survival of 35%. Vaginal bleeding is the most common presenting symptom.\n\nUterine sarcomas are often diagnosed postoperatively when a uterus removed for presumed fibroids is found to contain sarcoma on pathology. Their aggressive behavior and poor prognosis distinguish them from carcinomas."
    difficulty: medium
    tags: [uterine sarcoma, gynecologic oncology, leiomyosarcoma, gynecology]
  - front: "What histological features distinguish leiomyosarcoma from benign leiomyoma?"
    back: "Leiomyosarcoma is distinguished from leiomyoma by: (1) increased mitotic count (>10 mitoses/10 high-power fields), (2) tumour necrosis, and (3) cellular atypia. Clinical clues include rapidly enlarging fibroids in premenopausal patients or enlarging fibroids in a postmenopausal patient.\n\nThese three histologic criteria are key to diagnosing leiomyosarcoma. An enlarging fibroid in a postmenopausal woman raises concern for sarcomatous change as fibroids should regress with menopause. Leiomyosarcoma has poor outcomes even at early stage and radiation does not improve control or survival."
    difficulty: hard
    tags: [leiomyosarcoma, leiomyoma, uterine sarcoma, histology, gynecologic oncology]
  - front: "What are the four major types of uterine sarcoma and their key distinguishing features?"
    back: "1. Leiomyosarcoma — most common, average age 55, >10 mitoses/HPF, necrosis, atypia, poor prognosis. 2. Endometrial Stromal Sarcoma (ESS) — perimenopausal, AUB, good prognosis, hormone-sensitive. 3. Undifferentiated Sarcoma — rare, severe nuclear pleomorphism, poor prognosis. 4. Adenosarcoma (mixed) — rarest, low malignant potential, polypoid uterine mass, mixture of benign epithelium + malignant sarcoma.\n\nDistinguishing these subtypes is important because prognosis and treatment vary significantly. ESS responds to hormonal therapy (progestins), while leiomyosarcoma does not. Adenosarcoma is of mixed malignant potential and is often found incidentally at time of hysterectomy for PMB."
    difficulty: hard
    tags: [uterine sarcoma, leiomyosarcoma, ESS, adenosarcoma, gynecologic oncology]
  - front: "What is the incidence order of malignant gynecological cancers in Canada?"
    back: "Order of incidence: endometrium > ovary > cervix > vulva > vagina > fallopian tube.\n\nEndometrial carcinoma is the most common gynecological malignancy. Ovarian cancer, while less common, causes more deaths due to its typically advanced-stage presentation. Cervical cancer rates have declined significantly with screening and HPV vaccination."
    difficulty: easy
    tags: [gynecologic oncology, cancer incidence, endometrial cancer, ovarian cancer, gynecology]
  - front: "What is the epidemiology of ovarian cancer in Canada?"
    back: "Ovarian cancer: lifetime risk 1.4%, majority of cases in patients >50 years, 4th leading cause of cancer death in women. Causes more deaths than all other gynecological malignancies combined. 85% epithelial, 15% non-epithelial. 70% of epithelial ovarian cancers present at Stage III disease.\n\nOvarian cancer's poor prognosis reflects its typical advanced-stage presentation, as early-stage disease is usually asymptomatic. Most women present with Stage III (advanced disease) with a 24% 5-year survival. Stage I has a 90% 5-year survival."
    difficulty: easy
    tags: [ovarian cancer, epidemiology, gynecologic oncology, gynecology]
  - front: "What are the risk factors and protective factors for epithelial ovarian cancer?"
    back: "Risk factors: early menarche/late menopause, personal or family history of breast/colon/endometrial/ovarian cancer, advanced age, BRCA mutation (serous), Lynch syndrome (non-serous, non-mucinous), fertility drugs (limited evidence). Protective factors: OCP (50% risk reduction after 5 years), pregnancy/breastfeeding.\n\nThe incessant ovulation hypothesis posits that repeated ovulatory rupture/repair of the ovarian epithelium increases cancer risk. OCP suppresses ovulation and is protective. BRCA1/2 mutations confer a 39-44% (BRCA1) and 11-18% (BRCA2) lifetime risk of ovarian cancer."
    difficulty: medium
    tags: [ovarian cancer, risk factors, protective factors, BRCA, OCP, gynecologic oncology]
  - front: "What are the clinical features of epithelial ovarian cancer?"
    back: "Most patients present with advanced-stage (Stage III/IV) disease. Symptoms: abdominal symptoms (nausea, bloating, pain, dyspepsia, anorexia, early satiety), symptoms of mass effect, increased abdominal girth (from ascites or tumour), urinary urgency/frequency, constipation.\n\nThe vague, non-specific nature of symptoms leads to late diagnosis. 'Omental cake' refers to ascites plus a fixed upper abdominal and pelvic mass — almost always signifying ovarian cancer. Any adnexal mass in a postmenopausal woman should be considered malignant until proven otherwise."
    difficulty: medium
    tags: [ovarian cancer, clinical features, symptoms, omental cake, gynecologic oncology]
  - front: "What is the screening recommendation for ovarian cancer?"
    back: "There is no effective screening method for ovarian cancer in average-risk women. Routine CA-125 or pelvic ultrasound are NOT recommended for screening. For high-risk patients (BRCA mutation carriers), prophylactic BSO or salpingectomy may be recommended.\n\nRCTs have shown no significant reduction in ovarian cancer mortality with CA-125 or transvaginal ultrasound screening. These tests have high false-positive rates leading to unnecessary surgeries with significant complication rates (3-15% major complications). Benefits do not outweigh harms in average-risk populations."
    difficulty: medium
    tags: [ovarian cancer, screening, CA-125, transvaginal ultrasound, BRCA, gynecologic oncology]
  - front: "What is the treatment for epithelial ovarian cancer?"
    back: "Debulking surgery: total hysterectomy, BSO, omentectomy, and removal of all visible disease. Chemotherapy: platinum-based (carboplatin) + taxol (paclitaxel). Neo-adjuvant chemotherapy can shrink tumours prior to debulking. Adjuvant chemotherapy treats microscopic disease.\n\nOptimal cytoreduction (residual disease <1 cm) is associated with improved survival. Most epithelial ovarian cancers are chemosensitive. Intraperitoneal chemotherapy for Stage III disease may provide survival advantage. BRCA-mutated tumours are particularly sensitive to platinum agents and PARP inhibitors."
    difficulty: medium
    tags: [ovarian cancer, treatment, debulking surgery, chemotherapy, carboplatin, paclitaxel]
  - front: "What are the tumour markers for ovarian cancer subtypes?"
    back: "Epithelial (serous/endometrioid): CA-125. Granulosa cell tumour: Inhibin. Dysgerminoma: LDH. Yolk sac tumour: AFP. Choriocarcinoma: beta-hCG. Embryonal cell: AFP + beta-hCG. Immature teratoma: none.\n\nCA-125 has only 50% sensitivity for early-stage ovarian cancer, limiting its utility as a screening tool. It is more useful for monitoring treatment response and detecting recurrence. Germ cell tumours occur mostly in young women and have specific tumour markers that guide diagnosis and follow-up."
    difficulty: medium
    tags: [ovarian cancer, tumour markers, CA-125, AFP, beta-hCG, LDH, inhibin, gynecologic oncology]
  - front: "What are borderline (low malignant potential) ovarian tumours and their key features?"
    back: "Borderline tumours (15% of epithelial ovarian tumours): tumour cells with histologically malignant characteristics arising from ovarian surface but NOT invading ovarian stroma. One-third in women <40 years. Generally slow-growing, excellent prognosis (5-year survival >99%). Treated with surgery (BSO/omental biopsy +/- hysterectomy); chemotherapy has limited benefit. Young patients may have fertility-sparing treatment (cystectomy or unilateral salpingo-oophorectomy).\n\nBorderline tumours occupy a histological middle ground between benign and malignant. They can metastasize but uncommonly. Late recurrences may be associated with low-grade serous carcinoma. The excellent prognosis supports conservative management, especially in young patients desiring fertility."
    difficulty: hard
    tags: [borderline ovarian tumour, low malignant potential, ovarian cancer, gynecologic oncology]
  - front: "What is a follicular cyst and how is it managed?"
    back: "A follicular cyst develops when a follicle fails to rupture during ovulation. Usually asymptomatic, 4-8 cm, unilocular, lined with granulosa cells. May rupture/bleed/tort causing pain. Management: if <6 cm, wait 6 weeks and re-examine (usually regresses with next cycle). OCP prevents development of new cysts. Symptomatic/suspicious masses warrant surgical exploration (laparoscopic cystectomy or oophorectomy).\n\nFollicular cysts are the most common functional ovarian cyst. They are benign and most resolve spontaneously within 1-2 menstrual cycles. Surgical intervention is reserved for large (>6 cm), persistent, symptomatic, or suspicious cysts."
    difficulty: easy
    tags: [follicular cyst, functional ovarian cyst, ovarian tumours, gynecology]
  - front: "What is a corpus luteum cyst and how does it differ from a follicular cyst?"
    back: "A corpus luteum cyst develops when the corpus luteum fails to regress after ovulation, becoming cystic or hemorrhagic. Larger (10-15 cm) and firmer than follicular cysts. More likely to cause pain and may delay onset of next period. Management is the same as for follicular cysts.\n\nCorpus luteum cysts can be hemorrhagic and present with acute pelvic pain mimicking ectopic pregnancy. They are associated with elevated progesterone levels. A pregnancy test should always be performed to exclude ectopic pregnancy in a woman with acute pelvic pain and an adnexal mass."
    difficulty: easy
    tags: [corpus luteum cyst, functional ovarian cyst, ovarian tumours, gynecology]
  - front: "What is a theca-lutein cyst and what is its association?"
    back: "Theca-lutein cysts arise from atretic follicles stimulated by abnormal beta-hCG levels. Associated with molar pregnancy and ovulation induction with clomiphene. Management is conservative — cysts regress as beta-hCG levels fall.\n\nTheca-lutein cysts are caused by excessive gonadotropin stimulation of the ovary. They are classically bilateral and can become very large. In molar pregnancy, they regress following uterine evacuation as hCG levels decline. In ovulation induction, they are a marker of ovarian hyperstimulation."
    difficulty: medium
    tags: [theca-lutein cyst, molar pregnancy, beta-hCG, ovarian cysts, gynecology]
  - front: "What is a benign cystic teratoma (dermoid cyst) and what are its ultrasound findings?"
    back: "Benign cystic teratoma (dermoid) is the single most common ovarian germ cell neoplasm. Contains elements of all 3 germ cell lines including dermal appendages (sweat/sebaceous glands, hair follicles, teeth). 20% bilateral. Ultrasound: smooth-walled, mobile, unilocular cyst — may show calcification (pathognomonic, from teeth). Treatment: laparoscopic cystectomy (may recur).\n\nDermoid cysts occur across the reproductive years (20% outside reproductive years). The presence of calcification on ultrasound (teeth) is pathognomonic. Complications include rupture, torsion, and infarction. Chemical peritonitis can occur from sebaceous material spillage."
    difficulty: medium
    tags: [dermoid cyst, benign cystic teratoma, germ cell tumour, ovarian tumours, gynecology]
  - front: "What are the malignant germ cell tumours of the ovary and their tumour markers?"
    back: "Malignant germ cell tumours (2-3% of ovarian cancers, predominantly in children/young women <30 years): Dysgerminoma (LDH marker, 10-15% bilateral), Immature Teratoma (no tumour marker), Yolk Sac Tumour (AFP marker), Ovarian Choriocarcinoma (beta-hCG marker, precocious puberty), Embryonal Cell (AFP + beta-hCG).\n\nMalignant germ cell tumours are rapidly growing but usually chemosensitive, making fertility-sparing surgery (unilateral salpingo-oophorectomy + nodes) followed by chemotherapy feasible even in advanced disease. Dysgerminoma Stage IA requires no adjuvant treatment and is highly responsive to chemotherapy if advanced."
    difficulty: hard
    tags: [malignant germ cell tumour, dysgerminoma, yolk sac tumour, immature teratoma, AFP, LDH, gynecologic oncology]
  - front: "What are sex cord stromal tumours of the ovary and their key distinguishing features?"
    back: "Fibroma/Thecoma (benign): non-functioning; associated with Meigs syndrome (triad of benign ovarian tumour + ascites + pleural effusion). Granulosa-Theca Cell Tumour: inhibin marker; estrogen-producing (precocious puberty, menorrhagia, PMB, risk of endometrial cancer); Call-Exner bodies on histology. Sertoli-Leydig Cell Tumour: elevated androgens; virilizing effects (hirsutism, deep voice, hairline recession).\n\nThese functional tumours produce hormones and present accordingly. Granulosa cell tumours cause hyperestrogenism and endometrial hyperplasia/cancer risk. Call-Exner bodies (small groups of cells with central eosinophilic material) are the histologic hallmark. Meigs syndrome resolves after tumour removal."
    difficulty: hard
    tags: [sex cord stromal tumour, granulosa cell tumour, Meigs syndrome, Sertoli-Leydig, fibroma, ovarian tumours, gynecologic oncology]
  - front: "What is Meigs syndrome?"
    back: "Meigs syndrome is the triad of: (1) benign ovarian tumour (classically fibroma/thecoma), (2) ascites, and (3) pleural effusion. It resolves after tumour removal.\n\nMeigs syndrome is important to recognize because the combination of ovarian mass, ascites, and pleural effusion may mimic malignancy (e.g., ovarian cancer with peritoneal spread). CA-125 can be elevated in Meigs syndrome, further mimicking ovarian cancer. The key distinguishing feature is the benign histology of the ovarian tumour."
    difficulty: medium
    tags: [Meigs syndrome, ovarian fibroma, ascites, pleural effusion, sex cord stromal tumour, gynecology]
  - front: "What is a Krukenberg tumour?"
    back: "A Krukenberg tumour is a metastatic ovarian tumour from a primary GI (commonly stomach or colon) or breast malignancy. Usually bilateral (80%). Histology shows characteristic 'signet-ring' cells. Accounts for 4-8% of ovarian malignancies.\n\nKrukenberg tumours are important to recognize as the ovarian lesion may be the initial presentation, and identifying the primary site is essential for treatment planning. Signet-ring cells contain mucin displacing the nucleus to the periphery. They carry a poor prognosis because they represent metastatic disease."
    difficulty: medium
    tags: [Krukenberg tumour, metastatic ovarian tumour, signet-ring cells, gastric cancer, gynecologic oncology]
  - front: "What are the epithelial ovarian cancer subtypes and their key features?"
    back: "Serous (most common, 50% of ovarian cancers, 75% of epithelial; psammoma bodies on histology, 20-30% bilateral). Mucinous (20% of epithelial; may cause pseudomyxoma peritonei; remove appendix to rule out primary). Clear Cell (10%; associated with endometriosis; poor response to chemotherapy; more common in Asians). Endometrioid (10%; associated with endometriosis and endometrial neoplasm; responds well to chemotherapy).\n\nSerous tumours are the most clinically significant, often presenting at advanced stage with BRCA mutations. Pseudomyxoma peritonei (implants producing large quantities of mucin seeding the abdominal cavity) is a dreaded complication of mucinous tumours. Clear cell carcinoma has a particularly poor chemotherapy response."
    difficulty: hard
    tags: [epithelial ovarian cancer, serous carcinoma, mucinous carcinoma, clear cell carcinoma, endometrioid, psammoma bodies, gynecologic oncology]
  - front: "What are the causes of an elevated CA-125, and what are its limitations as a screening test?"
    back: "Gynecologic causes of elevated CA-125: endometriosis, pregnancy, fibroids, PID, benign ovarian neoplasms. Non-gynecologic: pancreas, stomach, colon, rectum cancer; cirrhosis, pancreatitis, general inflammation. Limitations: only 50% sensitivity for early-stage ovarian cancer — poor screening test; not specific.\n\nCA-125 is useful for monitoring treatment response and surveillance for recurrence in known ovarian cancer patients, but its low sensitivity for early-stage disease and poor specificity (elevated in many benign conditions) make it unsuitable as a population screening tool. Diagnosis of ovarian tumours requires surgical pathology."
    difficulty: medium
    tags: [CA-125, ovarian cancer screening, tumour markers, sensitivity specificity, gynecologic oncology]
  - front: "What is pseudomyxoma peritonei and which ovarian tumour subtype is it associated with?"
    back: "Pseudomyxoma peritonei is a condition where implants seed the abdominal cavity and produce large quantities of mucin, filling the peritoneal cavity. It is associated with mucinous ovarian tumours. When mucinous ovarian cancer is found, the appendix should also be removed to rule out a possible appendiceal primary source.\n\nThe appendix is the most common primary site of pseudomyxoma peritonei. In women, it can first present as an ovarian mucinous tumour (often an implant from an appendiceal mucinous neoplasm). Removing the appendix is both diagnostic and potentially curative if the appendix is the primary site."
    difficulty: hard
    tags: [pseudomyxoma peritonei, mucinous ovarian cancer, appendix, gynecologic oncology]
  - front: "What is the investigation approach for a suspicious ovarian mass?"
    back: "Referral to gynecologic oncologist. Bimanual exam (solid, irregular, fixed pelvic mass = suspicious). RMI (Risk of Malignancy Index) is best tool to assess likelihood of malignancy. Blood work: CBC, LFTs, electrolytes, Cr, tumour markers (CA-125, inhibin, beta-hCG, LDH, AFP, androgens, CEA, Ca19-9). Transvaginal U/S (best to visualize ovaries). CT abdomen/pelvis for metastases. Biopsy NOT recommended (tumour spillage risk) — cytological diagnosis from paracentesis or omental cake biopsy if extensive disease.\n\nAvoiding biopsy of a potentially malignant ovarian mass prevents tumour spillage into the peritoneum, which would upstage an otherwise localized cancer. PET scan and bone scan are not routinely indicated. When ovarian cancer is suspected, preoperative assessment aims to plan for optimal cytoreductive surgery."
    difficulty: medium
    tags: [ovarian cancer, pelvic mass, investigations, RMI, transvaginal ultrasound, gynecologic oncology]
  - front: "What is the 5-year survival by stage for ovarian cancer?"
    back: "Stage I: >90%. Stage II: 60-75%. Stage III: 24%. Stage IV: 1%.\n\nThe dramatic difference in survival between Stage I and Stage III/IV underscores the importance of early detection. Unfortunately, approximately 70% of epithelial ovarian cancers present at Stage III, contributing to the overall poor prognosis of this disease."
    difficulty: easy
    tags: [ovarian cancer, prognosis, 5-year survival, FIGO staging, gynecologic oncology]
  - front: "A 62-year-old woman presents with vaginal bleeding. Transvaginal ultrasound shows an endometrial thickness of 8 mm. What is the next step?"
    back: "Endometrial biopsy (office endometrial sampling). Endometrial thickness >5 mm in a postmenopausal woman with bleeding is abnormal and warrants tissue sampling to rule out endometrial carcinoma.\n\nPMB = endometrial carcinoma until proven otherwise. 95% of endometrial carcinomas present with vaginal bleeding. An endometrial thickness >5 mm in a symptomatic postmenopausal woman meets the threshold for biopsy. Office endometrial biopsy is minimally invasive and highly sensitive for endometrial carcinoma."
    difficulty: medium
    tags: [endometrial carcinoma, postmenopausal bleeding, endometrial biopsy, endometrial thickness, clinical scenario]
  - front: "A 35-year-old woman on combined OCP for 5 years asks about her ovarian cancer risk. How does OCP use affect risk?"
    back: "OCP significantly reduces ovarian cancer risk — likely due to ovulation suppression. Risk reduction occurs even after 1 year of use, and is approximately 50% after 5 years of use.\n\nThe incessant ovulation hypothesis postulates that repetitive ovulatory events damage ovarian surface epithelium, increasing cancer risk. OCP suppresses ovulation, allowing less cumulative epithelial damage. This protective effect persists for years after stopping OCP and is one of its most significant non-contraceptive benefits."
    difficulty: medium
    tags: [ovarian cancer, OCP, protective factors, ovarian cancer prevention, gynecology]
  - front: "A 28-year-old woman with acute pelvic pain has a right adnexal mass on ultrasound with calcification visible on imaging. What is the most likely diagnosis?"
    back: "Benign cystic teratoma (dermoid cyst). Calcification (from teeth) is pathognomonic on ultrasound. Dermoid cysts are the single most common ovarian germ cell neoplasm. Pain can result from torsion, rupture, or infarction.\n\nDermoid cysts contain elements of all three germ cell lines including teeth, hair, and sebaceous material. The calcification from teeth on ultrasound or plain radiograph is pathognomonic. Treatment is laparoscopic cystectomy, though recurrence is possible."
    difficulty: easy
    tags: [dermoid cyst, teratoma, calcification, pelvic pain, adnexal mass, clinical scenario]
  - front: "A postmenopausal woman presents with a unilateral solid ovarian mass, ascites, and a pleural effusion. What is in the differential diagnosis and how do you differentiate?"
    back: "Differential: Meigs syndrome (benign ovarian fibroma/thecoma + ascites + pleural effusion) vs. malignant ovarian cancer with metastases. Key: CA-125 can be elevated in both. Definitive differentiation requires surgical pathology showing benign fibroma histology (in Meigs syndrome) vs. malignant tumour. Meigs syndrome resolves after tumour removal.\n\nMeigs syndrome mimics advanced ovarian cancer clinically and biochemically. Any adnexal mass in a postmenopausal woman should be considered malignant until proven otherwise. However, recognizing Meigs syndrome avoids unnecessary radical surgery. The pleural effusion (usually right-sided) and ascites in Meigs syndrome resolve after oophorectomy."
    difficulty: hard
    tags: [Meigs syndrome, ovarian fibroma, ascites, pleural effusion, ovarian cancer, clinical scenario]
