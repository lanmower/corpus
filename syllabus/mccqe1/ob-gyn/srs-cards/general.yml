    tags: [gynecology, bacterial vaginosis, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the first-line oral treatment options for bacterial vaginosis?"
    back: "Metronidazole 500 mg PO twice daily x 7 days; alternatives include metronidazole 0.75% gel intravaginally x 5 days or clindamycin 2% cream intravaginally x 7 days\n\nMetronidazole targets anaerobic overgrowth. Oral therapy has higher compliance than 7-day topical regimens."
