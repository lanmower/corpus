# Otolaryngology (ENT) - generated from srs-mccqe1
cards:
  - front: "What is the Weber test and how is it interpreted?"
    back: "512 Hz tuning fork on vertex of head. Lateralizes to affected ear in CHL (conductive). Lateralizes to unaffected ear in SNHL (sensorineural).\n\nThe Weber test is more sensitive than the Rinne test for detecting CHL. In CHL, bone conduction is enhanced on the affected side because ambient noise is reduced. In SNHL, the unaffected cochlea perceives sound louder."
    difficulty: easy
    tags: [otolaryngology, Weber-test, hearing-loss]
  - front: "What is a positive vs. negative Rinne test?"
    back: "Positive Rinne (normal): AC > BC. Negative Rinne (abnormal): BC > AC, indicates conductive hearing loss in that ear.\n\nUse a 512 Hz tuning fork placed on the mastoid (BC) then beside the pinna (AC). A false negative Rinne can occur in severe unilateral SNHL where vibrations on the mastoid stimulate the contralateral cochlea."
    difficulty: easy
    tags: [otolaryngology, Rinne-test, hearing-loss]
  - front: "What is the audiogram pattern in noise-induced hearing loss?"
    back: "Bilateral SNHL with characteristic dip at 4000 Hz ('boilermaker's notch') that extends to higher and lower frequencies with time\n\n85-90 dB over months/years or single impulses >135 dB cause cochlear damage. Speech reception is not altered until HL >30 dB at speech frequency, so considerable damage can occur before patient complains."
    difficulty: easy
    tags: [otolaryngology, noise-induced-HL, audiogram]
  - front: "What are the key features of BPPV and how is it diagnosed?"
    back: "Brief (<1 min) episodes of rotational vertigo triggered by head position changes. Diagnosed by positive Dix-Hallpike maneuver (latency ~20s, crescendo/decrescendo vertigo, geotropic rotatory nystagmus, fatigability).\n\nBPPV is the most common cause of episodic vertigo. Caused by free-floating otoliths in the posterior semicircular canal (>90%). Treated with particle repositioning maneuvers (Epley). Vestibular suppressants delay recovery and should not be used."
    difficulty: easy
    tags: [otolaryngology, BPPV, vertigo]
  - front: "What are the diagnostic criteria for definite Ménière's disease?"
    back: "Two or more spontaneous episodes of vertigo lasting 20 min to 12 hours, audiometric confirmation of low-to-mid frequency SNHL, fluctuating tinnitus and/or aural fullness\n\nMénière's disease is caused by endolymphatic hydrops. Bilateral in 35% of cases. Acute treatment: antiemetics, betahistine, meclizine. Long-term: low salt diet, diuretics. Definitive: intratympanic gentamicin or surgical vestibular neurectomy."
    difficulty: medium
    tags: [otolaryngology, Meniere-disease, vertigo]
  - front: "What differentiates peripheral from central vertigo on the HINTS exam?"
    back: "Central (stroke): normal head impulse test (no saccades), vertical/direction-changing nystagmus, abnormal test of skew. Peripheral (vestibular neuritis): positive head impulse (corrective saccade), unidirectional horizontal nystagmus, normal skew.\n\nThe HINTS exam is highly sensitive for detecting central causes of vertigo (stroke). Any ONE central feature on HINTS should raise concern for posterior circulation stroke and warrants urgent imaging."
    difficulty: hard
    tags: [otolaryngology, HINTS, vertigo, stroke]
  - front: "What is an acoustic neuroma and how does it typically present?"
    back: "Schwannoma of vestibular portion of CN VIII. Most common CPA tumour. Presents with unilateral SNHL or tinnitus. Dizziness may occur but true vertigo is rare (slow growth allows compensation).\n\nGold standard diagnosis is MRI with gadolinium. In the elderly, unilateral SNHL or tinnitus is an acoustic neuroma until proven otherwise. Associated with NF2 (bilateral acoustic neuromas). Late complications include CN VII palsy and trigeminal sensory deficit."
    difficulty: medium
    tags: [otolaryngology, acoustic-neuroma, vestibular-schwannoma]
  - front: "What is the most common cause of conductive hearing loss in patients aged 15-50?"
    back: "Cerumen impaction\n\nRisk factors include hairy/narrow ear canals, hearing aids, and cotton swab use. Treatment includes cerumenolytic agents (water is most effective), irrigation, or manual removal. Irrigation is contraindicated with active infection, previous ear surgery, or TM perforation."
    difficulty: easy
    tags: [otolaryngology, cerumen-impaction, CHL]
  - front: "What is the most common organism causing otitis externa, and what distinguishes it from otitis media on exam?"
    back: "Pseudomonas aeruginosa (90% bacterial). OE: pain with tragal pressure or pinna traction. OM: pain NOT worsened by pinna manipulation.\n\nTreatment of OE includes topical antipseudomonal agents (ciprofloxacin/Ciprodex). Ototoxic agents (gentamicin, neomycin) should NOT be used with perforated TM. Keep the EAC dry."
    difficulty: easy
    tags: [otolaryngology, otitis-externa]
  - front: "What is malignant (necrotizing) otitis externa?"
    back: "Osteomyelitis of the mastoid/temporal bone, occurring in elderly diabetic or immunocompromised patients. Caused by Pseudomonas aeruginosa. Presents as refractory OE with granulation tissue on floor of auditory canal.\n\nThis is a medical emergency requiring hospitalization, debridement, and IV antibiotics. Most common complication is CN VII palsy (then CN X, XI). Technetium scan shows extent of osteomyelitis; gallium scan monitors treatment response."
    difficulty: hard
    tags: [otolaryngology, malignant-OE, skull-base-osteomyelitis]
  - front: "What is otosclerosis and how does it present?"
    back: "Fusion of stapes footplate to oval window. Autosomal dominant with variable penetrance. Progressive CHL first noticed in teens/twenties, worsened by pregnancy. Carhart's notch at 2000 Hz on audiogram.\n\nSecond most common cause of CHL in 15-50 year olds (after cerumen). Schwartz's sign is a pink blush on TM from neovascularization. Treatment is hearing aid (BAHA) or definitive stapedectomy/stapedotomy with prosthesis."
    difficulty: medium
    tags: [otolaryngology, otosclerosis, CHL]
  - front: "What is cholesteatoma and what are its complications?"
    back: "Cyst of keratinized epithelial cells in the middle ear/mastoid. Causes progressive CHL, malodorous unilateral otorrhea, and can cause ossicular erosion, SNHL, facial paralysis, meningitis, intracranial abscess.\n\nAcquired cholesteatoma is more common than congenital. It appears as a pearly mass behind the TM with marginal perforation. Treatment is surgical: mastoidectomy + tympanoplasty + ossicular reconstruction."
    difficulty: medium
    tags: [otolaryngology, cholesteatoma]
  - front: "What is the classic triad of acute mastoiditis?"
    back: "Tenderness to pressure over the mastoid, retroauricular swelling with protruding ear, and otorrhea (± fever)\n\nMastoiditis occurs approximately 2 weeks after untreated or inadequately treated AOM. Caused by the same organisms as AOM (S. pneumoniae, H. influenzae, M. catarrhalis). Treatment is IV antibiotics with myringotomy and ventilation tubes."
    difficulty: easy
    tags: [otolaryngology, mastoiditis]
  - front: "What is the most common hereditary cause of non-syndromic sensorineural hearing loss?"
    back: "Connexin 26 mutation (GJB2 gene) — autosomal recessive\n\nNon-syndromic SNHL accounts for 70% of hereditary hearing loss. Syndromic causes (30%) include Waardenburg (white forelock, heterochromia), Pendred (euthyroid goiter), Treacher-Collins (branchial cleft anomalies), and Alport (hereditary nephritis)."
    difficulty: medium
    tags: [otolaryngology, congenital-SNHL, genetics]
  - front: "How do you differentiate Bell's palsy from Ramsay Hunt syndrome?"
    back: "Bell's palsy: idiopathic (possible HSV), 80-90% of peripheral facial paralysis, >90% recovery. Ramsay Hunt: VZV infection of CN VII/VIII, vesicles on pinna/ear canal, SNHL, only 22% full recovery.\n\nBoth are treated with steroids. Ramsay Hunt additionally requires acyclovir. Bell's palsy is a diagnosis of exclusion — always rule out stroke (forehead sparing suggests central cause), tumour (parotid mass), and otitis media."
    difficulty: medium
    tags: [otolaryngology, Bell-palsy, Ramsay-Hunt]
  - front: "What is the mainstay treatment for allergic rhinitis?"
    back: "Intranasal corticosteroid (INCS) is the mainstay of treatment. Other options include oral antihistamines, combination INCS/antihistamine spray, leukotriene receptor antagonists, and allergen immunotherapy.\n\nAllergic rhinitis is IgE-mediated and presents with nasal congestion, itch, watery rhinorrhea, sneezing, and allergic conjunctivitis. Seasonal form is caused by pollen; perennial by dust mites, animal dander, and molds."
    difficulty: easy
    tags: [otolaryngology, allergic-rhinitis]
  - front: "What is rhinitis medicamentosa?"
    back: "Rebound nasal congestion caused by overuse of intranasal vasoconstrictors (topical decongestants). Limit use to no more than 3-5 days.\n\nTreatment includes discontinuation of the offending agent, saline irrigations, and intranasal corticosteroids. This is an important cause of chronic nasal congestion to identify in history-taking."
    difficulty: easy
    tags: [otolaryngology, rhinitis-medicamentosa]
  - front: "What are the diagnostic criteria for acute bacterial rhinosinusitis?"
    back: "≥2 major symptoms (PODS: Pain/pressure, Obstruction, Discharge, Smell loss) with at least one being nasal obstruction (O) or purulent discharge (D), lasting >7 days or worsening >5 days or purulence with high fever (>39°C).\n\nMost common organisms: S. pneumoniae (35%), H. influenzae (35%), M. catarrhalis. Maxillary sinus is most commonly affected. First-line treatment: INCS for mild-moderate; INCS + amoxicillin for severe."
    difficulty: medium
    tags: [otolaryngology, rhinosinusitis, sinusitis]
  - front: "What is the most common site of epistaxis and what is its blood supply?"
    back: "Kiesselbach's plexus in Little's area (anterior-inferior cartilaginous septum) — anastomosis of branches from both internal and external carotid arteries\n\nManagement: lean forward, firm pressure on cartilaginous nose for 15-20 min. If visible source, cauterize with silver nitrate (do NOT cauterize both sides). Anterior packing (Merocel) if cautery fails. Posterior packing if source not visible."
    difficulty: easy
    tags: [otolaryngology, epistaxis, nasal-anatomy]
  - front: "What is the difference between vocal cord polyps and nodules?"
    back: "Polyps: unilateral, acute onset, soft/smooth, may resolve spontaneously, most common benign tumour of vocal cords. Nodules: bilateral and symmetric at junction of anterior 1/3 and posterior 2/3, gradual onset, chronic course ('screamer's nodules').\n\nNodules are treated primarily with voice rest and voice therapy; surgery is rarely needed. Polyps may require endoscopic microsurgical removal if persistent. Both are associated with voice strain and laryngeal irritants."
    difficulty: medium
    tags: [otolaryngology, vocal-cord-polyps, vocal-cord-nodules]
  - front: "What are the most common causes of hoarseness lasting >2 weeks that must be investigated to rule out malignancy?"
    back: "Laryngeal carcinoma must be ruled out. Flexible nasolaryngoscopy is indicated for any hoarseness persisting >2 weeks, especially with risk factors (smoking, alcohol).\n\nOther causes include GERD, vocal cord polyps/nodules, vocal cord paralysis (lung malignancy is the most common cause of extralaryngeal vocal cord paralysis), and chronic laryngitis."
    difficulty: medium
    tags: [otolaryngology, hoarseness, laryngeal-carcinoma]
  - front: "What is the most common congenital cervical anomaly?"
    back: "Thyroglossal duct cyst — presents as a midline neck mass that elevates with swallowing and tongue protrusion\n\nIt is a vestigial remnant of the thyroid's descent from the foramen cecum. Treatment is the Sistrunk procedure: complete excision of cyst, tract, and central portion of hyoid bone. Can undergo neoplastic transformation."
    difficulty: easy
    tags: [otolaryngology, thyroglossal-duct-cyst, congenital]
  - front: "What is the rule for differential diagnosis of a neck mass by age?"
    back: "Under 20: congenital > inflammatory > neoplastic. Ages 20-40: inflammatory > congenital > neoplastic. Over 40: neoplastic > inflammatory > congenital.\n\nAny neck mass persisting >2 weeks should be investigated for neoplastic causes. In adults >40, a neck mass is malignant until proven otherwise. Investigation includes FNA biopsy, CT with contrast, and potentially panendoscopy."
    difficulty: easy
    tags: [otolaryngology, neck-mass, differential-diagnosis]
  - front: "What is the most common benign and malignant parotid gland tumour?"
    back: "Benign: pleomorphic adenoma (80% of parotid tumours are benign). Malignant: mucoepidermoid carcinoma (of the 20% that are malignant).\n\nFacial nerve involvement suggests malignancy. Bilateral parotid enlargement suggests benign process (Warthin's tumour, Sjögren's, mumps, bulimia). Pleomorphic adenomas are excised due to 5% risk of malignant transformation over time."
    difficulty: medium
    tags: [otolaryngology, parotid-tumour, salivary-gland]
  - front: "What is Frey's syndrome?"
    back: "Gustatory sweating — a postoperative complication of parotid surgery caused by aberrant regeneration of parasympathetic nerve fibers of the auriculotemporal nerve to sweat glands\n\nPatients experience sweating and flushing in the preauricular region when eating. Other complications of parotid surgery include hematoma, facial nerve paresis, sialocele, and numbness of overlying skin."
    difficulty: medium
    tags: [otolaryngology, Frey-syndrome, parotid-surgery]
  - front: "What are the risk factors for head and neck squamous cell carcinoma?"
    back: "Smoking, alcohol (synergistic with smoking), HPV infection (especially oropharyngeal cancer), radiation exposure, occupational exposures (wood dust, nickel), poor oral hygiene\n\nHPV-positive oropharyngeal cancers have significantly better prognosis (82% vs 51% 3-year survival). Oral cavity cancers are treated primarily with surgery; oropharynx, hypopharynx, and larynx cancers primarily with radiotherapy."
    difficulty: medium
    tags: [otolaryngology, head-neck-cancer, SCC]
  - front: "What is the significance of leukoplakia vs erythroplakia of the oral mucosa?"
    back: "Leukoplakia: white plaque that cannot be rubbed off, 5-20% risk of malignant transformation. Erythroplakia: red mucosal plaque, associated with carcinoma in situ or invasive tumour in 40% of cases — more concerning.\n\nErythroplakia has a much higher malignant potential than leukoplakia. Both require biopsy and follow-up. Treatment includes surgical excision, cryosurgery, or laser ablation."
    difficulty: medium
    tags: [otolaryngology, leukoplakia, erythroplakia, oral-premalignant]
  - front: "What is the most common cause of extralaryngeal vocal cord paralysis?"
    back: "Lung malignancy (compression or invasion of recurrent laryngeal nerve)\n\nThe left recurrent laryngeal nerve loops under the aortic arch making it more vulnerable. Other causes include thyroid/parathyroid surgery, carotid endarterectomy, and central lesions (CVA, MS). Unilateral paralysis causes breathy voice; bilateral causes stridor."
    difficulty: medium
    tags: [otolaryngology, vocal-cord-paralysis]
  - front: "What tympanogram pattern is seen with middle ear effusion vs. Eustachian tube dysfunction?"
    back: "Type B (flat, no peak): middle ear effusion or perforated TM. Type C (negative pressure peak): Eustachian tube dysfunction or early otitis media without effusion.\n\nType A is normal (peak at 0 mmH2O). Otosclerosis shows Type A with reduced amplitude. Ossicular chain discontinuity shows Type A with increased amplitude. Ear canal volumes >2 cc in children suggest TM perforation."
    difficulty: medium
    tags: [otolaryngology, tympanogram, impedance-audiometry]
  - front: "What are the signs of basilar skull fracture?"
    back: "Battle's sign (mastoid ecchymosis), raccoon eyes (periorbital ecchymosis), CSF rhinorrhea/otorrhea, hemotympanum, and cranial nerve involvement (CN VII most common)\n\nTemporal bone fractures are classified as otic capsule involving (10-20%, SNHL, 50% CN VII palsy) or otic capsule sparing (70-90%, CHL from ossicular injury, 10-20% CN VII palsy). CSF leak tested with beta-2 transferrin."
    difficulty: medium
    tags: [otolaryngology, basilar-skull-fracture, temporal-bone]
  - front: "What is the approach to sudden sensorineural hearing loss?"
    back: "Confirm SNHL with audiometry (≥30 dB loss in 3 consecutive frequencies). MRI to rule out tumour. Start steroids within 14 days (ideally 3 days): intratympanic or oral prednisone 1 mg/kg/d × 7-14 days.\n\n80-90% are idiopathic. 70% resolve within 10-14 days. Must rule out acoustic neuroma, autoimmune disease, and vascular events. Routine labs and CT/MRI are not required unless indicated by history and physical."
    difficulty: medium
    tags: [otolaryngology, sudden-SNHL, hearing-loss]
  - front: "What is sialolithiasis and which gland is most commonly affected?"
    back: "Ductal salivary stone (mainly hydroxyapatite). Submandibular gland affected in 80% of cases. Presents with pain and intermittent swelling related to meals.\n\nThe submandibular gland is predisposed due to its longer duct, more alkaline and viscous saliva, and antigravity drainage. Diagnosed with U/S and CT. Treatment includes hydration, sialogogues, massage, and endoscopic or surgical removal."
    difficulty: easy
    tags: [otolaryngology, sialolithiasis, salivary-gland]
  - front: "What type of tympanogram is associated with otosclerosis?"
    back: "Type A with reduced amplitude (Type As) — peak is still at 0 mmH2O but has a lower amplitude due to stiffness of the ossicular chain\n\nOtosclerosis causes fixation of the stapes footplate. The tympanogram shows normal middle ear pressure but reduced compliance. In contrast, ossicular chain discontinuity causes Type A with increased amplitude (Type Ad)."
    difficulty: hard
    tags: [otolaryngology, otosclerosis, tympanogram]
  - front: "What aminoglycosides are vestibulotoxic vs cochleotoxic?"
    back: "Vestibulotoxic: streptomycin, gentamicin. Cochleotoxic: kanamycin, tobramycin.\n\nAminoglycosides destroy sensory hair cells (outer first, then inner). Duration of treatment is the most important predictor of ototoxicity. Once daily dosing is less toxic than divided doses due to saturable kinetics."
    difficulty: medium
    tags: [otolaryngology, ototoxicity, aminoglycosides]
  - front: "A 45-year-old woman presents with recurrent episodes of vertigo lasting seconds, triggered by rolling over in bed. What is the most likely diagnosis and what bedside test would you perform?"
    back: "Benign paroxysmal positional vertigo (BPPV). Perform the Dix-Hallpike test to confirm the diagnosis.\n\nBPPV is the most common cause of vertigo and is characterized by brief episodes triggered by head position changes. The Dix-Hallpike test provokes rotatory nystagmus and vertigo. Treatment is with the Epley maneuver (canalith repositioning)."
    difficulty: easy
    tags: [otolaryngology, neurology, vertigo, family-medicine]
  - front: "What is the first-line antibiotic treatment for acute bacterial sinusitis in adults, and what are the criteria for diagnosing ABRS?"
    back: "First-line: amoxicillin 500 mg PO TID for 5-10 days. ABRS criteria: nasal obstruction or purulent discharge PLUS at least one other PODS symptom, with symptoms worsening after 5-7 days, persisting >7 days without improvement, or purulence with high fever for 3-4 days.\n\nPODS = facial Pain/pressure, nasal Obstruction, purulent Discharge, Smell disorder. Mild to moderate ABRS is treated with intranasal corticosteroids; severe ABRS requires antibiotics plus INCS. Antihistamines are ineffective for sinusitis."
    difficulty: medium
    tags: [otolaryngology, sinusitis, infectious-disease, family-medicine, pharmacology]
  - front: "What is the Dix-Hallpike test and what does a positive result indicate?"
    back: "Patient is rapidly shifted from seated to supine with head extended and rotated 45°. A positive test shows rotatory nystagmus and vertigo, indicating BPPV.\n\nBPPV is the most common cause of vertigo. Treatment involves the Epley maneuver to reposition displaced otoliths in the semicircular canals."
    difficulty: easy
    tags: [otolaryngology, neurology, BPPV]
  - front: "What is the Rinne test, and how do you interpret a positive vs. negative result?"
    back: "A 512 Hz tuning fork is placed on the mastoid (BC) then beside the pinna (AC). Positive Rinne (normal): AC > BC. Negative Rinne (abnormal): BC > AC, indicating conductive hearing loss.\n\nIn sensorineural hearing loss, both AC and BC are diminished but AC remains greater than BC (positive Rinne). A false negative Rinne can occur with severe unilateral SNHL (dead ear), where bone conduction stimulates the contralateral cochlea. The Weber test is more sensitive for detecting CHL."
    difficulty: easy
    tags: [otolaryngology, hearing-loss, tuning-fork-tests]
  - front: "In the Weber test, the sound lateralizes to the right ear. What are the two possible explanations?"
    back: "Either right-sided conductive hearing loss (sound lateralizes to the affected ear) or left-sided sensorineural hearing loss (sound lateralizes away from the affected ear).\n\nThe Weber test uses a 512 Hz tuning fork placed on the vertex. In CHL, bone conduction transmits sound to the affected ear more effectively because ambient noise is blocked. In SNHL, the cochlea on the affected side cannot perceive the signal, so it lateralizes to the better ear."
    difficulty: medium
    tags: [otolaryngology, hearing-loss, tuning-fork-tests]
  - front: "What are the audiogram findings in conductive hearing loss vs. sensorineural hearing loss?"
    back: "CHL: BC normal, AC below normal, air-bone gap >10 dB. SNHL: Both AC and BC below normal, no air-bone gap (<10 dB).\n\nPure tone audiometry is the gold standard for characterizing hearing loss. In mixed hearing loss, both AC and BC are below normal AND there is an air-bone gap >10 dB. The pure tone average is calculated from thresholds at 500, 1000, and 2000 Hz."
    difficulty: easy
    tags: [otolaryngology, hearing-loss, audiometry]
  - front: "What is the characteristic audiogram finding in noise-induced hearing loss?"
    back: "A notch (dip) at 4000 Hz, known as the 'boilermaker's notch,' that extends to higher and lower frequencies over time.\n\nNoise-induced SNHL results from damage to cochlear hair cells at the resonant frequency of the temporal bone (4000 Hz). Damage occurs with exposure to 85-90 dB over months-years or single impulses >135 dB. Speech reception is not altered until HL exceeds 30 dB at speech frequencies, so considerable damage occurs before symptoms arise."
    difficulty: easy
    tags: [otolaryngology, hearing-loss, noise-induced]
  - front: "What is the characteristic audiogram finding in otosclerosis?"
    back: "Conductive hearing loss with a characteristic dip at 2000 Hz (Carhart's notch) and normal tympanic membrane.\n\nOtosclerosis involves fusion of the stapes footplate to the oval window. It is autosomal dominant with variable penetrance, more common in females, and progresses during pregnancy. Schwartz's sign (pink blush on TM) indicates active neovascularization. Definitive treatment is stapedectomy/stapedotomy."
    difficulty: medium
    tags: [otolaryngology, hearing-loss, otosclerosis]
  - front: "How do you differentiate peripheral from central vertigo?"
    back: "Peripheral: moderate-severe imbalance, severe N/V, common auditory symptoms, rare neuro symptoms, unidirectional horizontal/rotatory nystagmus, rapid compensation. Central: mild-moderate imbalance, variable N/V, rare auditory symptoms, common neuro symptoms, bidirectional/vertical nystagmus, slow compensation.\n\nThe HINTS exam (Head Impulse, Nystagmus, Test of Skew) helps distinguish central from peripheral causes. A central pattern (no saccades on head impulse, vertical/direction-changing nystagmus, abnormal skew) suggests stroke and requires urgent neuroimaging."
    difficulty: medium
    tags: [otolaryngology, vertigo, dizziness]
  - front: "What is the most common cause of episodic vertigo, and how is it diagnosed?"
    back: "Benign paroxysmal positional vertigo (BPPV). Diagnosed by a positive Dix-Hallpike maneuver showing geotropic rotatory nystagmus with latency and fatigability.\n\nBPPV is caused by canalithiasis (free-floating otoliths) in the semicircular canals, with the posterior canal affected in >90% of cases. Attacks last seconds, triggered by head position changes. Treatment is the Epley maneuver for particle repositioning. Vestibular suppressants delay recovery and should be avoided."
    difficulty: easy
    tags: [otolaryngology, vertigo, BPPV]
  - front: "What are the four classic symptoms of Meniere's disease?"
    back: "Episodic vertigo (minutes to hours), fluctuating low-frequency sensorineural hearing loss, tinnitus, and aural fullness.\n\nMeniere's disease is caused by endolymphatic hydrops. Peak incidence is 40-60 years, bilateral in 35% of cases. Triggers include high salt, caffeine, stress. Acute management: antiemetics and betahistine. Long-term: low-salt diet, diuretics. Intratympanic gentamicin destroys the vestibular end-organ but causes complete SNHL."
    difficulty: easy
    tags: [otolaryngology, vertigo, meniere-disease]
  - front: "What is an acoustic neuroma (vestibular schwannoma), and what is the gold standard for diagnosis?"
    back: "A schwannoma of the vestibular portion of CN VIII. Gold standard diagnosis: MRI of the internal auditory canal with gadolinium contrast.\n\nAcoustic neuroma is the most common CPA tumor and the most common intracranial tumor causing SNHL. It usually presents with unilateral progressive SNHL or tinnitus. True vertigo is rare because slow tumor growth allows compensation. Bilateral acoustic neuromas suggest NF2. In the elderly, unilateral tinnitus or SNHL is acoustic neuroma until proven otherwise."
    difficulty: easy
    tags: [otolaryngology, acoustic-neuroma, hearing-loss]
  - front: "What is the most common organism causing otitis externa, and what is the cardinal sign?"
    back: "Pseudomonas aeruginosa. Cardinal sign: pain aggravated by traction of the pinna or pressure over the tragus.\n\nOE is inflammation of the external auditory canal, most commonly bacterial (90%). Risk factors include water exposure (swimmer's ear), trauma from cotton swabs, and hearing aids. Treatment includes microdebridement, topical antipseudomonal antibiotics (e.g., ciprofloxacin), and keeping the ear dry."
    difficulty: easy
    tags: [otolaryngology, otitis-externa, ear]
  - front: "What is malignant (necrotizing) otitis externa, and in whom does it occur?"
    back: "Osteomyelitis of the temporal/mastoid bone, most commonly caused by Pseudomonas aeruginosa, occurring in elderly diabetic or immunocompromised patients.\n\nIt presents with otalgia and purulent otorrhea refractory to medical therapy, with granulation tissue on the floor of the auditory canal. CN VII palsy is the most common cranial nerve complication. It is a medical emergency requiring IV antibiotics, hospitalization, and possibly surgical debridement."
    difficulty: medium
    tags: [otolaryngology, otitis-externa, malignant-OE]
  - front: "What is a cholesteatoma, and what is the classic otoscopic finding?"
    back: "A cyst of keratinized desquamated epithelium in the middle ear/mastoid that causes progressive bony destruction. Classic finding: retraction pocket in the TM containing keratinous debris, often with malodorous unilateral otorrhea.\n\nCholesteatoma can be congenital (white pearl behind intact TM) or acquired (associated with chronic otitis media). Complications include ossicular erosion (CHL), labyrinthine erosion (SNHL, vertigo), facial nerve paralysis, and intracranial complications (meningitis, abscess). Treatment is surgical: mastoidectomy with tympanoplasty."
    difficulty: medium
    tags: [otolaryngology, cholesteatoma, middle-ear]
  - front: "What is the second most common cause of CHL in patients aged 15-50?"
    back: "Otosclerosis.\n\nOtosclerosis is autosomal dominant with variable penetrance (~40%). It is more common in females and progresses during pregnancy. It presents with progressive CHL first noticed in teens/twenties, sometimes with Schwartz's sign (pink blush on TM) and Carhart's notch at 2000 Hz on audiogram. Definitive treatment is stapedectomy."
    difficulty: easy
    tags: [otolaryngology, otosclerosis, hearing-loss]
  - front: "What tympanogram pattern indicates middle ear effusion?"
    back: "Type B tympanogram — flat curve with no pressure peak, indicating poor TM mobility.\n\nType A is normal (peak at 0 mmH2O). Type B shows no peak, indicating effusion or TM perforation (differentiated by ear canal volume: >2 cc in children or >2.5 cc in adults suggests perforation). Type C shows a negative pressure peak, indicating Eustachian tube dysfunction or early otitis media without effusion."
    difficulty: easy
    tags: [otolaryngology, tympanometry, middle-ear]
  - front: "What differentiates Bell's palsy from Ramsay Hunt syndrome?"
    back: "Bell's palsy: idiopathic (likely HSV), 80-90% of peripheral facial palsies, >90% prognosis. Ramsay Hunt syndrome: VZV reactivation in CN VII/VIII, vesicles on pinna/ear canal, associated SNHL, worse prognosis (only 22% full recovery).\n\nBoth cause peripheral facial nerve paralysis (all muscle groups on one side including frontalis). Bell's palsy is treated with steroids +/- antivirals. Ramsay Hunt syndrome requires acyclovir and steroids. Both need corneal protection. Spontaneous remission of Bell's palsy should begin within 3 weeks."
    difficulty: medium
    tags: [otolaryngology, facial-nerve, bell-palsy, ramsay-hunt]
  - front: "What are the orbital complications of sinusitis (Chandler's classification)?"
    back: "I: Preseptal (periorbital) cellulitis. II: Orbital cellulitis. III: Subperiosteal abscess. IV: Orbital abscess. V: Cavernous sinus thrombosis.\n\nThese are the most feared complications of sinusitis and require hospitalization. Preseptal cellulitis is anterior to the orbital septum and does not compromise vision. Postseptal involvement (stages II-V) can cause proptosis, ophthalmoplegia, and vision loss. Cavernous sinus thrombosis carries high mortality."
    difficulty: medium
    tags: [otolaryngology, sinusitis, orbital-complications]
  - front: "What is the most common site of epistaxis, and what is the relevant vascular anatomy?"
    back: "Anterior-inferior nasal septum at Little's area (Kiesselbach's plexus), where the anterior ethmoidal, sphenopalatine, superior labial, and greater palatine arteries anastomose.\n\nMost epistaxis is anterior and can be controlled with direct pressure for 15-20 minutes, topical decongestants, and silver nitrate cautery. Do not cauterize both sides of the septum simultaneously (risk of perforation). Posterior epistaxis requires packing, admission, and possibly sphenopalatine artery ligation."
    difficulty: easy
    tags: [otolaryngology, epistaxis, nasal-anatomy]
  - front: "What are vocal cord nodules, and how do they differ from vocal cord polyps?"
    back: "Nodules: bilateral, symmetric, at the junction of anterior 1/3 and posterior 2/3 of cords, gradual onset, treated primarily with voice therapy. Polyps: unilateral, asymmetric, acute onset from capillary breakage, may require surgical excision.\n\nNodules are also called 'singer's nodules' and result from chronic voice strain. They occur at the point of maximal cord vibration. Polyps are the most common benign tumor of vocal cords and are more common in males aged 30-50. Both require elimination of irritants and voice therapy as first-line treatment."
    difficulty: medium
    tags: [otolaryngology, laryngology, vocal-cord-nodules, vocal-cord-polyps]
  - front: "What is the connexin 26 (GJB2) gene mutation significant for?"
    back: "It is the most common cause of non-syndromic congenital sensorineural hearing loss (autosomal recessive).\n\nNon-syndromic causes account for 70% of hereditary SNHL, while syndromic causes account for 30%. Important syndromes include Waardenburg (white forelock, heterochromia), Pendred (euthyroid goiter), Treacher-Collins (branchial cleft anomalies), and Alport (hereditary nephritis)."
    difficulty: medium
    tags: [otolaryngology, hearing-loss, congenital-SNHL, genetics]
  - front: "What is the HINTS exam and how does it help differentiate central from peripheral vertigo?"
    back: "Head Impulse, Nystagmus, Test of Skew. Central (stroke): normal head impulse (no saccades), vertical/direction-changing nystagmus, abnormal skew. Peripheral (vestibular neuritis): corrective saccade present, unidirectional horizontal nystagmus, normal skew.\n\nThe HINTS exam is more sensitive than early MRI for detecting posterior fossa stroke in patients with acute vestibular syndrome. A central pattern on any ONE of the three tests should raise concern for stroke. This is critical in emergency settings to avoid misdiagnosing a cerebellar infarct as vestibular neuritis."
    difficulty: hard
    tags: [otolaryngology, vertigo, HINTS-exam, stroke]
  - front: "What is the most common cause of sudden SNHL?"
    back: "Idiopathic (80-90% of cases). Treatment: intratympanic or oral corticosteroids (prednisone 1 mg/kg/day for 7-14 days), ideally started within 3 days.\n\nSudden SNHL is defined as loss of at least 30 dB affecting three consecutive frequencies. It may be confused with ischemic brain events, especially in elderly patients. MRI is needed to rule out tumor; CT if neurological signs suggest stroke. 70% resolve within 10-14 days, but 10% experience permanent hearing loss."
    difficulty: easy
    tags: [otolaryngology, hearing-loss, sudden-SNHL]
  - front: "What aminoglycosides are vestibulotoxic vs. cochleotoxic?"
    back: "Vestibulotoxic: streptomycin and gentamicin. Cochleotoxic: kanamycin and tobramycin.\n\nAminoglycosides destroy sensory hair cells (outer first, then inner) by any route. Duration of treatment is the most important predictor of ototoxicity. Once-daily dosing presents less risk than divided doses due to saturable kinetics. Otoacoustic emissions are lost first since they originate from outer hair cells."
    difficulty: medium
    tags: [otolaryngology, ototoxicity, aminoglycosides]
  - front: "What is the most important predictor of hearing aid response?"
    back: "Speech discrimination score. A poor score indicates significant neural degeneration, and hearing aids may not be the best option.\n\nSpeech discrimination is tested at 40 dB above the patient's speech reception threshold. Normal hearing or CHL patients score >90%. The rollover effect (decreased discrimination with increased intensity) is typical of retrocochlear lesions like acoustic neuroma. Asymmetry >20% between ears also suggests retrocochlear pathology."
    difficulty: medium
    tags: [otolaryngology, hearing-loss, audiometry, hearing-aids]
  - front: "What is the recurrent respiratory papillomatosis, and what HPV types cause it?"
    back: "Benign wart-like growths in the respiratory tract, most commonly caused by HPV types 6 and 11. It is the most common laryngeal tumor in children.\n\nIt has a biphasic distribution: juvenile (birth to puberty) and adult onset. Juvenile forms may resolve at puberty. It is highly resistant to complete removal with high recurrence rates. Treatment is suspension microlaryngoscopy with laser removal. The quadrivalent HPV vaccine can prevent and treat as systemic adjuvant."
    difficulty: easy
    tags: [otolaryngology, laryngology, recurrent-respiratory-papillomatosis]
  - front: "What is sialolithiasis, and which gland is most commonly affected?"
    back: "Ductal stones (mainly hydroxyapatite) causing chronic sialadenitis. 80% occur in the submandibular gland.\n\nThe submandibular gland is most susceptible because its duct (Wharton's duct) is longer, curves upward, and produces more mucous secretions. Symptoms include intermittent swelling related to meals. Diagnosis is by ultrasound first, then CT for localization. Treatment includes sialogogues, massage, and if refractory, surgical excision."
    difficulty: easy
    tags: [otolaryngology, salivary-glands, sialolithiasis]
  - front: "What are the three ossicular bones of the middle ear, and what is their function?"
    back: "Malleus, incus, stapes; they transmit and amplify sound vibrations from the tympanic membrane to the oval window (inner ear).\n\nThe ossicular chain converts acoustic (air) energy into mechanical energy and amplifies it approximately 20-fold through lever action and the area ratio between the tympanic membrane and oval window. Disruption causes conductive hearing loss."
    difficulty: easy
    tags: [ossicles, malleus, incus, stapes, middle ear, conductive hearing loss, anatomy]
  - front: "What are the three divisions of the ear?"
    back: "External ear (pinna, external auditory canal, tympanic membrane), middle ear (ossicles, Eustachian tube), inner ear (cochlea, semicircular canals, vestibule).\n\nThe external ear collects and funnels sound. The middle ear transmits and amplifies sound via the ossicular chain. The inner ear contains the cochlea (hearing) and vestibular apparatus (balance). Understanding this division is essential for localizing hearing loss as conductive (external/middle) or sensorineural (inner)."
    difficulty: easy
    tags: [ear anatomy, external ear, middle ear, inner ear, cochlea]
  - front: "What are the two parts of the tympanic membrane visible on otoscopy?"
    back: "Pars flaccida (superior, loose) and pars tensa (inferior, larger, taut portion).\n\nThe pars flaccida (Shrapnell's membrane) lacks the fibrous middle layer and is the most common site of cholesteatoma formation. The pars tensa is the main vibrating portion and contains the cone of light (anteroinferior light reflex) and attachment of the malleus handle. The umbo is the deepest point at the tip of the malleus."
    difficulty: easy
    tags: [tympanic membrane, pars flaccida, pars tensa, otoscopy, cholesteatoma]
  - front: "What are the four paranasal sinuses?"
    back: "Maxillary, ethmoid, sphenoid, and frontal sinuses.\n\nThe maxillary sinuses are largest and most commonly affected by rhinosinusitis. The ethmoid sinuses (multiple small air cells) drain via the ostiomeatal complex. The sphenoid sinuses are posterior and close to the optic nerve and cavernous sinus — a dangerous site for spread of infection. The frontal sinuses are superior."
    difficulty: easy
    tags: [paranasal sinuses, sinusitis, anatomy, maxillary, ethmoid, frontal, sphenoid]
  - front: "What is the arterial supply of the nasal septum and what is Kiesselbach's plexus?"
    back: "Kiesselbach's plexus (Little's area) on the anterior nasal septum receives contributions from: anterior ethmoid a., sphenopalatine a. (branch of external carotid), superior labial a., and greater palatine a.\n\nKiesselbach's plexus is the most common site of anterior epistaxis (~90% of epistaxis). It receives supply from both internal carotid (anterior ethmoid via ophthalmic artery) and external carotid (sphenopalatine, superior labial, greater palatine) systems. This dual supply makes it highly vascular."
    difficulty: medium
    tags: [Kiesselbachs plexus, epistaxis, nasal septum, blood supply, anterior epistaxis]
  - front: "What are the true vocal cords vs. false vocal cords (vestibular folds)?"
    back: "True vocal cords (vocal folds) vibrate to produce voice; false vocal cords (vestibular folds/vestibular ligaments) are superior folds that do not vibrate and function in airway protection.\n\nThe true vocal cords contain the vocalis muscle and are lined by stratified squamous epithelium — important for squamous cell carcinoma development. The false cords are superior folds that assist in Valsalva maneuvers and airway protection. On indirect laryngoscopy, they appear as the upper pair of folds."
    difficulty: easy
    tags: [vocal cords, larynx, anatomy, false cords, vestibular folds]
  - front: "What are the branches of the facial nerve (CN VII) from superior to inferior?"
    back: "Temporal, zygomatic, buccal, mandibular (marginal mandibular), cervical. Mnemonic: 'To Zanzibar By Motor Car'.\n\nThe facial nerve exits the stylomastoid foramen and immediately enters the parotid gland where it divides into these five branches. Parotid surgery risks injury to these branches. The marginal mandibular branch is most commonly injured in parotid surgery, causing lower lip/chin asymmetry."
    difficulty: easy
    tags: [facial nerve, CN VII, branches, parotid, anatomy]
  - front: "What are the four functions of the facial nerve summarized in the mnemonic 'Ears, Tears, Face, Taste'?"
    back: "Ears: motor to stapedius (hyperacusis if damaged); Tears: lacrimal gland and salivation (submandibular, sublingual glands via chorda tympani); Face: muscles of facial expression; Taste: anterior 2/3 of tongue via chorda tympani.\n\nThe parasympathetic ganglia supplied by CN VII include: pterygopalatine (lacrimal gland, nasal mucosa) and submandibular ganglion (submandibular and sublingual glands). Loss of stapedius function causes hyperacusis. The chorda tympani carries taste from anterior 2/3 tongue and preganglionic parasympathetics to submandibular ganglion."
    difficulty: medium
    tags: [facial nerve, CN VII, functions, stapedius, chorda tympani, taste, facial expression]
  - front: "What are the boundaries and contents of the anterior triangle of the neck?"
    back: "Bounded by: anterior border of SCM, midline of neck (jugular notch to mentum), inferior border of mandible. Contains: carotid triangle (tail of parotid, submandibular gland, hypoglossal nerve, carotid bifurcation) and muscular triangle (internal jugular vein, vagus nerve).\n\nThe anterior triangle is subdivided into submental (unpaired, midline), digastric/submandibular, carotid, and muscular triangles. Knowledge of these borders and contents is essential for understanding neck dissections, lymph node levels, and the approach to neck masses."
    difficulty: medium
    tags: [neck anatomy, anterior triangle, SCM, carotid triangle, neck dissection]
  - front: "What are the boundaries and contents of the posterior triangle of the neck?"
    back: "Bounded by: posterior border of SCM, anterior border of trapezius, middle third of clavicle. Contains: accessory nerve (CN XI), brachial plexus roots/trunks, phrenic nerve, occipital and supraclavicular lymph nodes.\n\nThe posterior triangle is subdivided by the inferior belly of the omohyoid into the occipital (superior) and subclavian (inferior) triangles. The accessory nerve (CN XI) traverses the posterior triangle superficially and is vulnerable to surgical injury during lymph node biopsy, causing trapezius weakness."
    difficulty: medium
    tags: [posterior triangle, neck anatomy, accessory nerve, CN XI, brachial plexus]
  - front: "What does enlargement of the left supraclavicular node (Virchow's node) suggest clinically?"
    back: "Abdominal malignancy or malignancy below the clavicle (e.g., gastric, pancreatic cancer).\n\nVirchow's node is the left lower jugular (Level IV) supraclavicular lymph node. It receives lymph drainage from the thoracic duct, which drains the abdominal and pelvic viscera. Left-sided Virchow's node enlargement (Troisier's sign) classically suggests an abdominal malignancy such as gastric cancer."
    difficulty: medium
    tags: [Virchows node, supraclavicular lymph node, abdominal malignancy, gastric cancer, lymphadenopathy]
  - front: "What does right-sided supraclavicular lymphadenopathy suggest?"
    back: "Malignancy of the mediastinum, lungs, or esophagus.\n\nRight-sided supraclavicular lymphadenopathy receives drainage from the right thoracic duct, which drains the right chest, lung, and mediastinum. Therefore, right supraclavicular adenopathy suggests thoracic malignancies such as lung cancer or esophageal cancer, in contrast to left-sided Virchow's node which suggests abdominal primaries."
    difficulty: medium
    tags: [supraclavicular lymph node, right-sided, lung cancer, mediastinal malignancy, lymphadenopathy]
  - front: "What does occipital and/or posterior auricular lymphadenopathy suggest?"
    back: "Rubella.\n\nPosterior auricular and suboccipital lymphadenopathy is a classic finding of rubella (German measles) in addition to a maculopapular rash and low-grade fever. This pattern of lymphadenopathy should prompt consideration of rubella, especially in unvaccinated individuals or those in early pregnancy where rubella can cause congenital rubella syndrome."
    difficulty: easy
    tags: [lymphadenopathy, rubella, posterior auricular, occipital lymph nodes]
  - front: "What lymph node level drains the thyroid gland and is called the anterior compartment?"
    back: "Level VI (anterior compartment); located between the hyoid bone and suprasternal notch between the common carotid arteries.\n\nLevel VI nodes include pretracheal, precricoid, paratracheal, and perithyroidal nodes. They drain the thyroid gland, glottic and subglottic larynx, apex of piriform sinus, and cervical esophagus. This level is dissected in total thyroidectomy for differentiated thyroid carcinoma."
    difficulty: medium
    tags: [lymph node levels, Level VI, thyroid cancer, anterior compartment, neck dissection]
  - front: "What are the findings suggestive of central vs. peripheral vertigo?"
    back: "Central: acute onset and continuous, normal head impulse test, multidirectional nystagmus, skew deviation present. Peripheral: nystagmus/vertigo compensates within weeks (unless cerebellar ischemia history), abnormal head impulse test, unidirectional nystagmus.\n\nCentral vertigo (e.g., stroke, MS, tumour) is more dangerous and requires urgent neuroimaging. The HINTS exam (Head Impulse, Nystagmus direction, Test of Skew) distinguishes central from peripheral causes. A normal head impulse test with multidirectional nystagmus and skew deviation strongly suggests central pathology."
    difficulty: medium
    tags: [vertigo, central vs peripheral, HINTS exam, nystagmus, skew deviation, head impulse test]
  - front: "What are the 5 Ds of vertebrobasilar insufficiency causing central vertigo?"
    back: "Drop attacks, Diplopia, Dysarthria, Dizziness, Dysphagia.\n\nVertebrobasilar insufficiency results from posterior circulation ischemia affecting the brainstem and cerebellum. These five features (5 Ds) indicate involvement of multiple posterior circulation structures and should prompt urgent investigation for stroke or TIA. Treatment is antiplatelet therapy and risk factor modification."
    difficulty: easy
    tags: [vertebrobasilar insufficiency, 5 Ds, central vertigo, posterior circulation, stroke]
  - front: "What is referred otalgia and which cranial nerves mediate it?"
    back: "Pain perceived in the ear arising from a distant source. Mediated by CN V (trigeminal), CN VII (facial), CN IX (glossopharyngeal), and CN X (vagus).\n\nThe ear receives sensory innervation from multiple cranial nerves, making it a common site for referred pain. The '10 Ts of referred otalgia' include: Teeth, TMD, Tubal area, Tonsils, Throat, Tongue, Trachea/larynx, Thyroid, Temporal arteritis, and Trauma. A normal ear exam with otalgia must prompt evaluation for oropharyngeal/laryngeal malignancy."
    difficulty: medium
    tags: [referred otalgia, otalgia, cranial nerves, referred pain, oropharyngeal cancer]
  - front: "A 60-year-old smoker presents with right ear pain but a normal ear exam. What must be ruled out?"
    back: "Oropharyngeal/laryngeal malignancy causing referred otalgia via CN IX or CN X.\n\nOtalgia with a normal ear examination should always raise suspicion for referred pain. In a middle-aged or elderly smoker/drinker, oropharyngeal cancer (tonsillar, base of tongue) or laryngeal cancer are high on the differential. Thorough inspection of the oral cavity, oropharynx, and larynx is mandatory, followed by flexible laryngoscopy."
    difficulty: hard
    tags: [referred otalgia, oropharyngeal cancer, laryngeal cancer, otalgia differential, head and neck malignancy]
  - front: "What are the parasympathetic ganglia of the head supplied by CN VII, and what structures do they innervate?"
    back: "Pterygopalatine ganglion (lacrimal gland, nasal mucosa) and submandibular ganglion (submandibular and sublingual glands) via chorda tympani.\n\nCN VII carries preganglionic parasympathetic fibers to two ganglia. The greater petrosal nerve reaches the pterygopalatine ganglion for lacrimal and nasal secretion. The chorda tympani joins the lingual nerve to reach the submandibular ganglion for salivation. Loss of these functions occurs with Bell's palsy proximal to the geniculate ganglion."
    difficulty: hard
    tags: [parasympathetic ganglia, facial nerve, chorda tympani, pterygopalatine, submandibular ganglion]
  - front: "What is the otic ganglion supplied by, and what does it innervate?"
    back: "Supplied by CN IX (glossopharyngeal); innervates the parotid gland.\n\nThe preganglionic parasympathetic fibers from CN IX travel via the lesser petrosal nerve to the otic ganglion, which then provides secretomotor innervation to the parotid gland. This pathway is relevant in Frey's syndrome (auriculotemporal syndrome) where aberrant regeneration after parotidectomy causes gustatory sweating."
    difficulty: medium
    tags: [otic ganglion, CN IX, glossopharyngeal, parotid gland, parasympathetic]
  - front: "What is the ciliary ganglion supplied by, and what does it control?"
    back: "Supplied by CN III (oculomotor); controls pupillary constriction (miosis) and accommodation.\n\nPreganglionic parasympathetic fibers in CN III synapse in the ciliary ganglion, which sends postganglionic fibers to the sphincter pupillae (constriction) and ciliary muscle (accommodation). Third nerve palsy causes mydriasis (dilated pupil) and loss of accommodation, along with ptosis and external ophthalmoplegia."
    difficulty: easy
    tags: [ciliary ganglion, CN III, pupillary constriction, parasympathetic, oculomotor]
  - front: "What is the strap muscle anatomy of the neck relevant to thyroid surgery?"
    back: "Sternohyoid and sternothyroid (infrahyoid strap muscles) overlie the thyroid gland; must be divided or retracted for thyroid access.\n\nThe strap muscles (sternohyoid, sternothyroid, thyrohyoid, and omohyoid) are thin infrahyoid muscles innervated by the ansa cervicalis. They overlie the thyroid and must be managed during thyroid surgery. The recurrent laryngeal nerve (RLN) and superior/inferior parathyroid glands are key structures at risk."
    difficulty: easy
    tags: [strap muscles, thyroid surgery, sternohyoid, sternothyroid, neck anatomy]
  - front: "What is the Thyroidea ima artery, and why is it clinically relevant?"
    back: "An anomalous artery present in ~3% of the population arising from the aortic arch or innominate artery, supplying the thyroid gland inferiorly; relevant to emergency cricothyrotomy and thyroid surgery.\n\nThe Thyroidea ima artery is an anatomical variant that travels in the midline and can be encountered during emergency airway access (cricothyrotomy, tracheotomy) or thyroid surgery. Injury can cause significant bleeding. Its presence should be anticipated and managed during inferior thyroid dissection."
    difficulty: medium
    tags: [thyroidea ima artery, anatomical variant, thyroid surgery, cricothyrotomy, anatomy]
  - front: "What lymph node level drains the nasopharynx and oropharynx and is located in the posterior triangle?"
    back: "Level V (posterior triangle nodes, VA and VB); located between the posterior border of SCM, anterior border of trapezius, from skull base to clavicle.\n\nLevel V nodes drain the nasopharynx, oropharynx, and cutaneous structures of the posterior scalp and neck. They are important in the staging and surgical management of nasopharyngeal carcinoma and oropharyngeal cancers. A neck dissection for these primaries often includes Level V."
    difficulty: medium
    tags: [Level V nodes, posterior triangle, nasopharyngeal carcinoma, lymph node levels, neck dissection]
  - front: "What does the submental triangle contain and what are its boundaries?"
    back: "Bounded by both anterior bellies of the digastric muscles and the hyoid bone; drains the floor of mouth, anterior tongue, anterior mandibular alveolar ridge, and lower lip. It is the only unpaired triangle.\n\nThe submental triangle (Level IA) is unpaired and midline. It contains submental lymph nodes that drain anterior oral cavity structures. These nodes are relevant in surgical management of squamous cell carcinoma of the anterior oral cavity and lower lip."
    difficulty: medium
    tags: [submental triangle, Level IA, oral cavity, neck anatomy, lymph node levels]
  - front: "What imaging modality is used to evaluate a patient with suspected nerve involvement in Eustachian tube dysfunction?"
    back: "MRI with gadolinium is the imaging of choice for Eustachian tube, nasopharyngeal, and middle ear pathology with suspected neural involvement.\n\nThe Eustachian tube and nasopharynx are closely related anatomically and functionally. MRI provides superior soft-tissue resolution for evaluating these structures. Nasopharyngeal carcinoma classically presents with Eustachian tube dysfunction causing unilateral otitis media with effusion in adults, necessitating nasopharyngeal evaluation."
    difficulty: medium
    tags: [Eustachian tube, nasopharyngeal carcinoma, MRI, otitis media with effusion, imaging]
  - front: "What are the contents of the eustachian tube region in the neck lymph node drainage?"
    back: "The tubal area (nasopharynx including Eustachian tube opening) drains to upper jugular nodes (Level IIA/IIB) and posterior triangle nodes (Level V).\n\nThe Eustachian tube opens into the nasopharynx at the fossa of Rosenmüller. Nasopharyngeal malignancy commonly presents with cervical lymphadenopathy at Levels II and V, as well as Eustachian tube obstruction causing unilateral serous otitis media. This is a 'red flag' presentation requiring urgent nasopharyngoscopy."
    difficulty: medium
    tags: [Eustachian tube, nasopharynx, lymph node drainage, Level II, nasopharyngeal carcinoma]
  - front: "What are the structures of the larynx visible on indirect laryngoscopy from superior view?"
    back: "Epiglottis, vallecula, arytenoid cartilages, vestibular folds (false cords), vocal folds (true cords), pyriform fossae, posterior commissure.\n\nIndirect laryngoscopy (mirror or flexible scope) provides a superior view. The vallecula is between the base of tongue and epiglottis — a site where foreign bodies lodge and where epiglottitis causes the 'thumb sign' on lateral X-ray. The pyriform fossae are lateral to the aryepiglottic folds and are sites of hypopharyngeal carcinoma."
    difficulty: easy
    tags: [laryngoscopy, larynx anatomy, epiglottis, vocal cords, pyriform fossa]
  - front: "What is the trigeminal nerve (CN V) contribution to ear sensory innervation and its clinical relevance?"
    back: "CN V (auriculotemporal branch of V3) supplies the anterior external auditory canal and anterior pinna; relevant as a source of referred otalgia from dental/TMJ pathology.\n\nThe auriculotemporal nerve (branch of the mandibular division V3) supplies the anterior EAC and anterior pinna. Dental disease, TMJ dysfunction, and masseter muscle disorders commonly cause referred otalgia via CN V. This is one of the most common causes of referred ear pain in clinical practice."
    difficulty: medium
    tags: [CN V, auriculotemporal nerve, referred otalgia, TMJ, dental pain]
  - front: "What is the Eustachian tube and why is its dysfunction important in otolaryngology?"
    back: "The Eustachian tube connects the nasopharynx to the middle ear, equalizing pressure and draining middle ear secretions. Dysfunction leads to otitis media with effusion (OME), acute otitis media (AOM), and hearing loss.\n\nNormal Eustachian tube function maintains negative pressure equalization and mucociliary drainage of the middle ear. Dysfunction (e.g., due to adenoid hypertrophy, nasopharyngeal mass, rhinitis) impairs drainage, causing middle ear effusion (glue ear) — the most common cause of conductive hearing loss in children. Persistent unilateral OME in adults must prompt nasopharyngeal evaluation to exclude malignancy."
    difficulty: easy
    tags: [Eustachian tube, otitis media, OME, conductive hearing loss, adenoid hypertrophy]
  - front: "What are the signs and symptoms of a Glomus Tympanicum/Jugulare tumour?"
    back: "Pulsatile tinnitus, hearing loss (HL), blue mass behind the tympanic membrane (TM), and Brown's sign (blanching of the TM with pneumatic otoscopy).\n\nGlomus tumours are paragangliomas arising in the middle ear or jugular foramen. The blue-red mass visible through the TM and pulsatile tinnitus are classic. Brown's sign (blanching of the vascular mass with pneumatic pressure) is pathognomonic."
    difficulty: medium
    tags: [otolaryngology, tinnitus, glomus tumour, middle ear, pulsatile tinnitus]
  - front: "What is the most common differential for a neck mass in a patient under age 20?"
    back: "Congenital causes (e.g., thyroglossal duct cyst, branchial cleft cyst, cystic hygroma).\n\nThe rule of thumb for neck masses: under 20 = congenital, ages 20–40 = inflammatory/infectious, over 40 = neoplastic (malignant until proven otherwise). This guides the initial diagnostic workup."
    difficulty: easy
    tags: [otolaryngology, neck mass, congenital, thyroglossal duct cyst, branchial cleft cyst]
  - front: "What is the most common differential for a neck mass in a patient over age 40?"
    back: "Malignancy (neoplastic) — a neck mass in a patient over 40 is considered malignant until proven otherwise.\n\nSquamous cell carcinoma metastatic from a head and neck primary is the most common cause of a neck mass in those over 40. Lymphoma, thyroid malignancy, and other primaries must also be considered. Early biopsy and workup are essential."
    difficulty: easy
    tags: [otolaryngology, neck mass, malignancy, squamous cell carcinoma, lymphoma]
  - front: "Describe the conductive auditory pathway from the external ear to the cochlea."
    back: "Sound travels down the EAC → vibrates the tympanic membrane → sequential vibration of ossicles (malleus → incus → stapes) → stapes footplate transmits amplified vibrations to the oval window → vibrations through cochlear fluid create movement along the basilar membrane.\n\nUnderstanding the conductive pathway is essential for localizing conductive hearing loss (CHL). Pathology at any of these structures (EAC, TM, ossicles, oval window) can cause CHL without affecting sensorineural structures."
    difficulty: easy
    tags: [otolaryngology, hearing physiology, conductive pathway, ossicles, cochlea]
  - front: "Describe the neural auditory pathway from the cochlea to the cortex."
    back: "Basilar membrane vibration → hair cells in organ of Corti → bipolar neurons in spiral ganglion → cochlear division of CN VIII → cochlear nucleus → superior olivary nucleus → lateral lemniscus → inferior colliculus → medial geniculate → Sylvian fissure of temporal lobe.\n\nThe neural pathway has multiple relay stations. Lesions at the level of CN VIII (e.g., acoustic neuroma), brainstem, or cortex produce sensorineural hearing loss (SNHL). Identifying the level of the lesion is critical for management."
    difficulty: medium
    tags: [otolaryngology, hearing physiology, neural pathway, CN VIII, sensorineural hearing loss]
  - front: "What are the three types of hearing loss?"
    back: "1. Conductive hearing loss (CHL): impaired conduction to the cochlea (external/middle ear disease). 2. Sensorineural hearing loss (SNHL): defect in conversion or transmission of neural signals (inner ear, CN VIII, brainstem, cortex). 3. Mixed hearing loss: combination of CHL and SNHL.\n\nDistinguishing CHL from SNHL guides investigation and treatment. CHL is often surgically correctable; SNHL may require hearing aids or cochlear implants. Mixed loss requires addressing both components."
    difficulty: easy
    tags: [otolaryngology, hearing loss, conductive, sensorineural, mixed]
  - front: "Interpret the Rinne and Weber tests: a patient has right-sided CHL and a normal left ear."
    back: "Weber lateralizes to the RIGHT (ipsilateral to CHL). Rinne is NEGATIVE on the right (BC > AC, abnormal).\n\nWeber lateralizes toward the side of CHL because the affected side is relatively quieter externally, making bone-conducted sound seem louder. A negative Rinne (BC > AC) indicates CHL on that side. This pattern is classic for unilateral conductive pathology."
    difficulty: medium
    tags: [otolaryngology, tuning fork tests, Rinne, Weber, conductive hearing loss]
  - front: "Interpret the Rinne and Weber tests: a patient has right-sided SNHL and a normal left ear."
    back: "Weber lateralizes to the LEFT (contralateral to SNHL). Rinne is POSITIVE on both sides (AC > BC bilaterally).\n\nWeber lateralizes away from SNHL because the affected cochlea cannot process bone-conducted sound as well. Rinne remains positive (AC > BC) in SNHL because while both are reduced, the ratio is preserved. A negative Rinne would indicate CHL."
    difficulty: medium
    tags: [otolaryngology, tuning fork tests, Rinne, Weber, sensorineural hearing loss]
  - front: "What tuning fork frequency is used for Rinne and Weber tests, and why?"
    back: "512 Hz. It is the most sensitive for detecting clinically significant hearing loss and falls within the speech frequency range (500–2000 Hz).\n\nLower frequency forks (e.g., 256 Hz) require a larger air-bone gap (15 dB) to reverse the Rinne, making them less sensitive. The 512 Hz fork requires only a ~30 dB gap and is optimal for detecting conductive losses relevant to speech."
    difficulty: easy
    tags: [otolaryngology, tuning fork, Rinne test, Weber test, 512 Hz]
  - front: "What is the pure tone average (PTA) and which frequencies does it use?"
    back: "The PTA is the average threshold at 500, 1000, and 2000 Hz — the range of human speech frequencies. It determines the degree of hearing loss.\n\nThese three frequencies correspond to the range of human speech (500–2000 Hz), making the PTA the most clinically relevant measure of functional hearing. The range of human hearing is 20–20,000 Hz, but the most sensitive is 1000–4000 Hz."
    difficulty: easy
    tags: [otolaryngology, audiometry, pure tone average, speech frequencies, hearing loss]
  - front: "What audiogram pattern is seen in noise-induced (occupational) hearing loss, and at what frequency?"
    back: "A notch at 4000 Hz (the 'Boilermaker's notch'), with better hearing at adjacent frequencies.\n\nNoise-induced hearing loss characteristically affects the 4000 Hz frequency first due to its sensitivity to mechanical trauma. This 4000 Hz notch is a hallmark finding on audiogram and is important for occupational health assessments and medicolegal evaluation."
    difficulty: easy
    tags: [otolaryngology, noise-induced hearing loss, 4000 Hz notch, audiogram, occupational health]
  - front: "What audiogram pattern is associated with otosclerosis, and what is it called?"
    back: "Carhart's notch — a notch at 2000 Hz on the bone conduction audiogram, seen in otosclerosis.\n\nCarhart's notch is a mechanical artefact of otosclerosis, not true cochlear involvement. It reflects reduced mechanical resonance at 2000 Hz due to stapes fixation. It improves after successful stapedectomy, distinguishing it from true SNHL."
    difficulty: medium
    tags: [otolaryngology, otosclerosis, Carharts notch, audiogram, 2000 Hz]
  - front: "How do you distinguish conductive from sensorineural hearing loss on audiogram?"
    back: "CHL: BC in normal range, AC outside normal range, air-bone gap >10 dB. SNHL: both AC and BC below normal, air-bone gap <10 dB. Mixed: both below normal with air-bone gap >10 dB.\n\nThe air-bone gap is the key distinguishing feature. In CHL, the inner ear (bone conduction) is intact but sound cannot reach it (air conduction reduced). In SNHL, the cochlea or nerve is damaged so both AC and BC are reduced proportionally."
    difficulty: easy
    tags: [otolaryngology, audiogram, air-bone gap, conductive, sensorineural]
  - front: "What is the Speech Reception Threshold (SRT) and when is the result considered suspicious for a retrocochlear lesion?"
    back: "SRT is the lowest HL level at which a patient can repeat 50% of spondee words. If SRT and the best pure tone threshold at 500–2000 Hz disagree by >5 dB, suspect a retrocochlear lesion or functional hearing loss.\n\nIn normal or cochlear hearing loss, the SRT closely matches the PTA (within 5 dB). A large discrepancy suggests pathology beyond the cochlea, such as an acoustic neuroma (CN VIII schwannoma), which disrupts neural transmission more than expected from the pure tone threshold."
    difficulty: medium
    tags: [otolaryngology, speech audiometry, SRT, retrocochlear, acoustic neuroma]
  - front: "What is the rollover effect in speech discrimination testing, and what does it indicate?"
    back: "A decrease in speech discrimination score as sound intensity increases. It is typical of a retrocochlear lesion (e.g., acoustic neuroma).\n\nNormally, speech discrimination improves or plateaus with increasing intensity. Rollover — where scores paradoxically worsen at higher intensities — indicates abnormal neural firing patterns, characteristic of acoustic neuroma or CN VIII pathology."
    difficulty: medium
    tags: [otolaryngology, speech audiometry, rollover effect, acoustic neuroma, retrocochlear]
  - front: "Interpret a Type B tympanogram."
    back: "Flat curve with no pressure peak, indicating poor TM mobility. Causes: middle ear effusion (MEE) or perforated TM. Canal volume >2 cc in children or >2.5 cc in adults with Type B suggests TM perforation or patent ventilation tube.\n\nThe tympanogram measures middle ear compliance against pressure. A flat Type B indicates no compliance change, suggesting fluid in the middle ear (MEE, otitis media with effusion) or a perforated TM. Distinguishing these requires measuring ear canal volume."
    difficulty: medium
    tags: [otolaryngology, tympanogram, Type B, middle ear effusion, TM perforation]
  - front: "Interpret a Type C tympanogram."
    back: "Negative pressure peak (peak shifted to the negative pressure side), indicating Eustachian tube dysfunction or early otitis media without effusion.\n\nA Type C tympanogram shows the compliance peak at negative pressure, reflecting impaired Eustachian tube function that cannot equalize middle ear pressure with ambient. This is an early sign of otitis media and can progress to MEE (Type B) if untreated."
    difficulty: easy
    tags: [otolaryngology, tympanogram, Type C, Eustachian tube, otitis media]
  - front: "What are the conditions required for an acoustic stapedial reflex to be present?"
    back: "CN VII must be intact, and there must be no CHL in the monitored ear. The acoustic reflex threshold is normally 70–100 dB above hearing threshold.\n\nThe stapedius muscle (innervated by CN VII) contracts bilaterally in response to loud sound. Absent reflex without CHL or severe SNHL suggests CN VII lesion. In CHL, the reflex is absent on the affected side. This test is valuable in distinguishing sites of facial nerve and hearing pathology."
    difficulty: medium
    tags: [otolaryngology, acoustic reflex, stapedius, CN VII, tympanometry]
  - front: "What acoustic stapedial reflex findings are seen in acoustic neuroma (retrocochlear HL)?"
    back: "Absent acoustic reflexes OR marked reflex decay (>50%) within 5 seconds. The acoustic reflex decay test reveals inability of the stapedius to sustain contraction at 500 and 1000 Hz.\n\nAcoustic neuroma damages CN VIII, impairing the afferent limb of the stapedial reflex arc. Reflex decay — unlike in cochlear lesions — is pathological and suggests retrocochlear pathology. This finding warrants MRI of the internal auditory canal."
    difficulty: medium
    tags: [otolaryngology, acoustic neuroma, stapedial reflex, reflex decay, retrocochlear]
  - front: "What is the Auditory Brainstem Response (ABR) test and what are its key clinical advantages?"
    back: "ABR measures neuroelectric potentials (5 waves) at different anatomic sites along the auditory pathway. Key advantages: (1) does not require patient cooperation (useful in children and malingerers); (2) can localize the site of lesion; (3) delay in brainstem response suggests cochlear or retrocochlear abnormalities.\n\nABR is an objective test (no voluntary response required), making it invaluable for pediatric hearing assessment, medico-legal evaluations, and surgical monitoring. In acoustic neuroma, the 5th wave latency is characteristically delayed."
    difficulty: medium
    tags: [otolaryngology, ABR, auditory brainstem response, acoustic neuroma, pediatric hearing]
  - front: "What are Otoacoustic Emissions (OAEs) and what is their clinical use?"
    back: "OAEs are echoes generated by outer hair cells in response to click stimuli. Uses: newborn hearing screening, detecting malingering (absent OAE = true HL vs. normal OAE = functional HL). Absent emissions indicate HL, middle ear fluid, or narrow EAC.\n\nOAEs are an objective test that bypasses voluntary response. Outer hair cell function is a proxy for overall cochlear (inner hair cell) function. They are the standard test for universal newborn hearing screening in Canada and can unmask malingering."
    difficulty: easy
    tags: [otolaryngology, OAE, newborn hearing screening, malingering, outer hair cells]
  - front: "What is a cochlear implant and what are the established indications?"
    back: "A cochlear implant is an electrode inserted into the cochlea for direct stimulation of the auditory nerve. Established indications: profound bilateral SNHL refractory to conventional hearing aids, including postlingually deafened adults and pre/postlingually deaf children.\n\nCochlear implants bypass damaged hair cells by directly stimulating the auditory nerve. Prelingually deaf infants are the best candidates for aural rehabilitation because early intervention maximizes benefit from ongoing brain plasticity during language development."
    difficulty: easy
    tags: [otolaryngology, cochlear implant, SNHL, aural rehabilitation, prelingual deafness]
  - front: "What is a Bone-Anchored Hearing Aid (BAHA) and who are suitable candidates?"
    back: "A BAHA is a hearing aid attached to the skull that transmits sound vibrations through the external abutment to a titanium implant via bone conduction. Candidates: patients with CHL, unilateral HL, and mixed HL who cannot wear conventional hearing aids.\n\nBAHA bypasses the outer and middle ear entirely, making it ideal for congenital aural atresia, chronic otitis media, or single-sided deafness. It is surgically implanted and requires intact cochlear function on the implanted side."
    difficulty: easy
    tags: [otolaryngology, BAHA, bone conduction, hearing aids, conductive hearing loss]
  - front: "Differentiate peripheral from central vertigo across key clinical features."
    back: "Peripheral: moderate-severe imbalance, severe N/V, common auditory symptoms, rare neuro symptoms, rapid compensation, unidirectional horizontal or rotatory nystagmus. Central: mild-moderate imbalance, variable N/V, rare auditory symptoms, common neuro symptoms, slow compensation, bidirectional or vertical nystagmus.\n\nDistinguishing peripheral from central vertigo is critical because central causes (brainstem/cerebellar infarct) are life-threatening. Vertical nystagmus, neurologic deficits, and slow compensation all suggest a central process requiring urgent MRI."
    difficulty: medium
    tags: [otolaryngology, vertigo, peripheral, central, nystagmus]
  - front: "What is the HINTS exam and how does it differentiate central from peripheral vertigo?"
    back: "HINTS = Head Impulse, Nystagmus, Test of Skew. Central (stroke): no saccade on head impulse, vertical/torsional/gaze-evoked nystagmus, abnormal skew. Peripheral (vestibular neuritis): saccade present on head impulse, unidirectional horizontal nystagmus, normal skew.\n\nThe HINTS exam is more sensitive than early MRI for posterior fossa stroke in acute vestibular syndrome. A 'HINTS positive for stroke' (no saccade + vertical/directional nystagmus + abnormal skew) mandates urgent neuroimaging despite possibly normal early DWI MRI."
    difficulty: hard
    tags: [otolaryngology, HINTS exam, vertigo, stroke, vestibular neuritis]
  - front: "What is Benign Paroxysmal Positional Vertigo (BPPV)? What causes it and what canal is most commonly affected?"
    back: "BPPV: acute attacks of transient rotatory vertigo (<1 min) triggered by head position change, with torsional nystagmus. Caused by canalithiasis (free otoliths in endolymph) or cupulolithiasis. Posterior semicircular canal is affected in >90% of cases.\n\nBPPV is the most common cause of episodic vertigo (50% of peripheral vestibular dysfunction). Free-floating otoliths create abnormal signals when the head moves. The posterior canal's anatomical position makes it most susceptible to otolith accumulation."
    difficulty: easy
    tags: [otolaryngology, BPPV, canalithiasis, posterior canal, positional vertigo]
  - front: "How is BPPV diagnosed and what are the signs seen on the Dix-Hallpike maneuver?"
    back: "Positive Dix-Hallpike (sensitivity 82%, specificity 71%): patient rapidly moved from sitting to supine with head turned 45° and neck extended 20°. Positive signs: latency of ~20s, crescendo/decrescendo vertigo lasting ~20s, geotropic rotatory nystagmus (fast phase toward floor), reversal on sitting up, fatigability with repeated stimulation.\n\nThe characteristic features (latency, fatigability, geotropic nystagmus) distinguish BPPV from other causes of positional vertigo. No additional diagnostic testing is needed for typical posterior canal BPPV once Dix-Hallpike is positive."
    difficulty: medium
    tags: [otolaryngology, BPPV, Dix-Hallpike, nystagmus, diagnosis]
  - front: "What is the treatment for BPPV?"
    back: "First-line: particle repositioning maneuvers — Epley maneuver (physician-performed or self-performed with DizzyFIX™) or Brandt-Daroff exercises. Anti-emetics for N/V. Refractory cases: posterior semicircular canal occlusion or singular neurectomy. Note: vestibular suppressants delay recovery and are NOT used.\n\nCanalith repositioning (Epley) moves otoliths out of the semicircular canal back into the utricle using gravity and sequential head positioning. It has >80% success rate. Vestibular suppressants (meclizine, etc.) impair central compensation and are contraindicated as primary therapy in BPPV."
    difficulty: medium
    tags: [otolaryngology, BPPV, Epley maneuver, Brandt-Daroff, treatment]
  - front: "Describe the clinical course and features of Ménière's disease."
    back: "Peak incidence 40–60 yr. Bilateral in 35%. Classic tetrad: episodic vertigo (min to h), fluctuating low-frequency SNHL, tinnitus, aural fullness. Drop attacks (Tumarkin's crisis). Triggers: high salt, caffeine, stress, nicotine, alcohol. Early: fluctuating SNHL. Late: persistent tinnitus, progressive SNHL.\n\nMénière's results from inadequate endolymph absorption causing endolymphatic hydrops. Over time, the SNHL becomes permanent even as vertigo may diminish. Tumarkin's crisis (sudden fall without loss of consciousness) occurs due to sudden otolith organ stimulation."
    difficulty: medium
    tags: [otolaryngology, Menieres disease, Tumarkin crisis, drop attacks, SNHL]
  - front: "What are the medical and surgical treatment options for Ménière's disease?"
    back: "Acute: bed rest, antiemetics, antivertiginous drugs (betahistine/Serc®, meclizine, diphenhydramine), anticholinergics. Long-term medical: low-salt diet, diuretics (HCTZ, triamterene, amiloride), Serc® prophylaxis, intratympanic gentamicin (destroys vestibular end-organ → complete SNHL), intratympanic dexamethasone. Surgical: selective vestibular neurectomy, labyrinthectomy, endolymphatic sac decompression.\n\nManagement is stepwise: lifestyle modification and diuretics first, then intratympanic therapy, then surgery. Intratympanic gentamicin ablates vestibular function but causes hearing loss. Since 35% of cases are bilateral, the contralateral ear must be monitored before ablative therapy."
    difficulty: hard
    tags: [otolaryngology, Menieres disease, betahistine, intratympanic gentamicin, labyrinthectomy]
  - front: "Differentiate vestibular neuronitis from labyrinthitis."
    back: "Vestibular neuronitis: inflammation of the vestibular portion of CN VIII → vertigo, N/V, imbalance WITHOUT hearing loss. Labyrinthitis: inflammation of both vestibular and cochlear portions of CN VIII → same symptoms PLUS tinnitus and hearing loss.\n\nThe key distinguishing feature is cochlear involvement. Labyrinthitis can complicate AOM, bacterial meningitis, cholesteatoma, and temporal bone fractures. Vestibular neuronitis is thought to be viral in origin."
    difficulty: easy
    tags: [otolaryngology, vestibular neuronitis, labyrinthitis, hearing loss, CN VIII]
  - front: "What are the clinical features of acute vestibular neuronitis/labyrinthitis?"
    back: "Acute phase (1–5 days): severe vertigo, N/V, imbalance, irritative nystagmus (fast phase TOWARD affected ear), ataxia (veering toward affected side), + tinnitus/HL in labyrinthitis. Convalescent phase: imbalance and motion sickness, spontaneous nystagmus AWAY from affected side, gradual vestibular adaptation over weeks to months.\n\nThe nystagmus direction changes from irritative (toward affected ear) to the convalescent phase (away from affected ear, reflecting the loss of vestibular input). This evolution is diagnostically helpful. Vestibular exercises accelerate central compensation."
    difficulty: medium
    tags: [otolaryngology, vestibular neuronitis, labyrinthitis, nystagmus, acute vertigo]
  - front: "What is the treatment of vestibular neuronitis/labyrinthitis?"
    back: "Acute phase: bed rest, antivertiginous drugs, corticosteroids (methylprednisolone) + antivirals. Bacterial labyrinthitis: IV antibiotics, drainage of middle ear ± mastoidectomy. Convalescent phase: progressive ambulation, vestibular exercises (eye/head movements, sitting/standing/walking) to promote central compensation.\n\nCorticosteroids help reduce vestibular nerve inflammation. Vestibular rehabilitation exercises are key in the convalescent phase to promote central compensation — particularly important in the elderly, who compensate more slowly and are at greater fall risk."
    difficulty: medium
    tags: [otolaryngology, vestibular neuronitis, corticosteroids, vestibular rehabilitation, treatment]
  - front: "What is an acoustic neuroma (vestibular schwannoma)?"
    back: "A schwannoma of the vestibular portion of CN VIII. It starts in the internal auditory canal, expands into the cerebellopontine angle (CPA), and compresses the cerebellum and brainstem. It is the most common intracranial tumour causing SNHL and the most common CPA tumour.\n\nDespite the name, acoustic neuromas arise from Schwann cells of the vestibular (not cochlear) nerve. They grow slowly, allowing compensation and explaining why true vertigo is rare. Bilateral acoustic neuromas are associated with neurofibromatosis type 2."
    difficulty: easy
    tags: [otolaryngology, acoustic neuroma, vestibular schwannoma, CPA, neurofibromatosis type 2]
  - front: "What are the clinical features of acoustic neuroma?"
    back: "Usually: unilateral SNHL (chronic, progressive) or tinnitus. Dizziness/unsteadiness may occur but true vertigo is RARE (slow growth allows compensation). Late complications: facial nerve palsy (CN VII) and trigeminal sensory deficit (V1; corneal reflex). In the elderly, unilateral SNHL is acoustic neuroma until proven otherwise.\n\nThe slow growth of acoustic neuromas explains the lack of dramatic vestibular symptoms. Any adult with unexplained progressive unilateral SNHL, poor speech discrimination, or absent stapedial reflexes should have gadolinium-enhanced MRI of the internal auditory canal."
    difficulty: medium
    tags: [otolaryngology, acoustic neuroma, unilateral SNHL, CN VII palsy, facial nerve]
  - front: "How is acoustic neuroma diagnosed?"
    back: "Gold standard: MRI of the internal auditory canal with gadolinium contrast. Supportive findings: audiogram (SNHL, poor speech discrimination), absent/decayed stapedial reflexes, ABR (increased 5th wave latency), vestibular tests (asymmetric caloric weakness — early sign).\n\nGadolinium-enhanced MRI can detect tumours as small as 1–2 mm. Asymmetric caloric weakness on electronystagmography is an early sign of unilateral vestibular dysfunction. Poor speech discrimination disproportionate to the degree of pure tone loss is a classic audiometric signature."
    difficulty: medium
    tags: [otolaryngology, acoustic neuroma, MRI, ABR, diagnosis]
  - front: "What are the treatment options for acoustic neuroma?"
    back: "Expectant management (watch-and-wait): small tumours or elderly patients. Definitive: surgical excision. Alternatives: gamma knife radiosurgery, radiation therapy.\n\nManagement is individualized based on tumour size, growth rate, patient age, and hearing status. Observation with serial MRI is appropriate for small tumours, especially in elderly patients. Gamma knife is increasingly used for small-to-medium tumours as an alternative to open surgery."
    difficulty: easy
    tags: [otolaryngology, acoustic neuroma, surgical excision, gamma knife, management]
  - front: "What is tinnitus and how is it classified?"
    back: "Tinnitus is auditory perception in the absence of acoustic stimuli, due to abnormal firing of central auditory neurons from loss of peripheral input. Classified as: subjective vs. objective, pulsatile vs. non-pulsatile, unilateral vs. bilateral.\n\nMost tinnitus is subjective (only heard by patient) and non-pulsatile. Pulsatile tinnitus suggests a vascular cause (e.g., glomus tumour, AV malformation, venous sinus stenosis) and requires CT/MRA/MRV. Non-pulsatile unilateral tinnitus requires MRI to rule out acoustic neuroma."
    difficulty: easy
    tags: [otolaryngology, tinnitus, pulsatile, subjective, auditory perception]
  - front: "What is the investigation algorithm for tinnitus?"
    back: "All: cranial nerve exam, otoscopy, auscultate for bruits, audiology. If pulsatile: CT or MRA/MRV of head and neck (rule out vascular abnormalities). If non-pulsatile and unilateral: non-contrast MRI (rule out acoustic neuroma).\n\nThe investigation is guided by tinnitus character. Pulsatile tinnitus may represent a surgically treatable vascular lesion. Unilateral non-pulsatile tinnitus can be the presenting symptom of acoustic neuroma, mandating imaging even in the absence of hearing loss."
    difficulty: medium
    tags: [otolaryngology, tinnitus, investigation, MRI, pulsatile]
  - front: "What is the natural history of tinnitus when no treatable cause is found?"
    back: "15% resolve, 20% improve, 50% remain unchanged, 15% worsen.\n\nThis natural history data is important for counselling patients. Management focuses on reassurance, sound amplification (hearing aids, white noise), tinnitus retraining therapy, and conservative measures (sleep hygiene, caffeine/alcohol reduction). SSRIs/TCAs are considered if anxiety/depression coexist."
    difficulty: easy
    tags: [otolaryngology, tinnitus, natural history, prognosis, tinnitus retraining therapy]
  - front: "What is cerumen impaction, and what are its indications and contraindications for removal?"
    back: "Cerumen impaction is the most common cause of CHL in those aged 15–50. Indication: totally occlusive cerumen with pain, decreased hearing, or tinnitus. Contraindications: active infection, previous ear surgery.\n\nCerumen is a mixture of ceruminous gland secretions, epithelial squames, dust, and debris. Risk factors include hairy/narrow canals, hearing aids, and cotton swab use. Treatment options: cerumenolytics (water is effective), irrigation (if TM intact), or manual removal."
    difficulty: easy
    tags: [otolaryngology, cerumen impaction, CHL, ear irrigation, external ear]
  - front: "What are exostoses of the external auditory canal (EAC) and how do they present?"
    back: "Exostoses are bony protuberances (lamellar bone) in the EAC, associated with swimming in cold water. Usually an incidental finding; if large, can cause cerumen impaction or otitis externa. Treatment only if symptomatic (frequent OE, CHL).\n\nCold water exposure causes periosteal irritation leading to bony proliferation in the EAC. Unlike osteomas (solitary, pedunculated), exostoses are typically multiple and broad-based. Surfer's ear (exostoses) is an important occupational/recreational hazard."
    difficulty: easy
    tags: [otolaryngology, exostoses, EAC, swimmers ear, CHL]
  - front: "What organisms cause acute otitis externa (OE), and what is the most common pathogen?"
    back: "Bacterial (90% of OE): most common is Pseudomonas aeruginosa. Others: Pseudomonas vulgaris, E. coli, Staphylococcus aureus. Fungal: Candida albicans, Aspergillus niger.\n\nPseudomonas aeruginosa thrives in the warm, moist environment of the ear canal and is the dominant pathogen in swimmer's ear. Treatment is with antipseudomonal topical agents (e.g., ciprofloxacin). Fungal OE often follows prolonged antibiotic use and presents with more pruritus."
    difficulty: easy
    tags: [otolaryngology, otitis externa, Pseudomonas aeruginosa, swimmers ear, topical antibiotics]
  - front: "What are the clinical features that distinguish acute from chronic otitis externa?"
    back: "Acute OE: otalgia, itching, fullness ± HL ± ear canal pain on chewing; ear canal edema, erythema ± otorrhea ± lymphadenitis ± cellulitis; SEVERE pinna traction tenderness and tragus pressure pain. Chronic OE: pruritus, excoriation, atrophic scaly lining ± otorrhea ± HL; wide meatus, NO pain with auricle movement; normal TM.\n\nThe hallmark of acute OE is exquisite pain on manipulation of the pinna or tragus — this distinguishes it from otitis media (where pinna traction does not worsen pain). Chronic OE results from repeated trauma, moisture, or dermatologic conditions."
    difficulty: medium
    tags: [otolaryngology, otitis externa, pinna traction, acute vs chronic, clinical features]
  - front: "What topical agents are used to treat acute otitis externa and what is an important contraindication?"
    back: "Antipseudomonal agents: ciprofloxacin or combination Ciprodex® (ciprofloxacin + dexamethasone). IMPORTANT contraindication: ototoxic topical agents (gentamicin, neomycin, neomycin/polymyxin B/hydrocortisone) must NOT be used with a perforated TM.\n\nTopical treatment is first-line for uncomplicated OE. Ciprofloxacin-based drops are preferred as they are antipseudomonal and non-ototoxic. Aminoglycosides (gentamicin, neomycin) are ototoxic to the cochlea if the TM is perforated and should be avoided when integrity cannot be confirmed."
    difficulty: medium
    tags: [otolaryngology, otitis externa, ciprofloxacin, ototoxicity, perforated TM]
  - front: "A 55-year-old man presents with progressive unilateral right-sided hearing loss and tinnitus. Audiogram shows SNHL with poor speech discrimination. Stapedial reflexes are absent on the right. What is the most likely diagnosis and what investigation is gold standard?"
    back: "Acoustic neuroma (vestibular schwannoma). Gold standard: gadolinium-enhanced MRI of the internal auditory canal.\n\nThe combination of progressive unilateral SNHL, poor speech discrimination (disproportionate to hearing loss), and absent stapedial reflexes is the classic acoustic neuroma triad. In the elderly, unilateral SNHL is acoustic neuroma until proven otherwise. MRI with gadolinium detects even small tumours."
    difficulty: hard
    tags: [otolaryngology, acoustic neuroma, unilateral SNHL, MRI, clinical case]
  - front: "A 35-year-old woman presents with episodic vertigo lasting 30 minutes to 2 hours, left-sided low-frequency hearing loss, tinnitus, and aural fullness. Audiogram confirms left SNHL. What is the diagnosis and first-line management?"
    back: "Ménière's disease (endolymphatic hydrops). First-line management: acute — antiemetics, antivertiginous drugs (betahistine, meclizine), anticholinergics; long-term — low-salt diet, diuretics (HCTZ, triamterene, amiloride), betahistine (Serc®) prophylaxis.\n\nThe classic tetrad of Ménière's is vertigo (20 min–12 h), fluctuating low-frequency SNHL, tinnitus, and aural fullness. Treatment is stepped: diet/lifestyle → diuretics → intratympanic therapy → surgery. Since 35% are bilateral, the contralateral ear must be monitored."
    difficulty: hard
    tags: [otolaryngology, Menieres disease, endolymphatic hydrops, betahistine, clinical case]
  - front: "A 25-year-old presents with sudden onset severe vertigo, vomiting, and imbalance after a flu-like illness. No hearing loss. Nystagmus is present with fast phase toward the left ear. What is the likely diagnosis and initial treatment?"
    back: "Vestibular neuronitis (inflammation of vestibular CN VIII, likely viral). Nystagmus fast phase toward the AFFECTED (irritated) ear in acute phase. Initial treatment: bed rest, antivertiginous drugs, corticosteroids (methylprednisolone), antivirals.\n\nVestibular neuronitis presents with acute severe vertigo without hearing loss (distinguishing it from labyrinthitis). The irritative nystagmus (fast phase toward the affected ear) in the acute phase later reverses to paretic nystagmus (away from affected ear) in the convalescent phase."
    difficulty: hard
    tags: [otolaryngology, vestibular neuronitis, acute vertigo, nystagmus, clinical case]
  - front: "What is the Weber test lateralization rule, and what makes it more reliable than the Rinne test for detecting CHL?"
    back: "Weber lateralizes IPSILATERAL to CHL (or contralateral to SNHL). Weber is more sensitive than Rinne for CHL because it only requires a >6 dB difference between ears, whereas Rinne requires a larger air-bone gap to reverse (false negative Rinne occurs when the good cochlea picks up BC vibrations in severe SNHL).\n\nA vibrating tuning fork on the mastoid stimulates both cochleae bilaterally. In severe unilateral SNHL, the Rinne on the affected side can falsely appear negative (BC appears better than AC) because the intact opposite cochlea detects the bone-conducted sound — a false negative Rinne. Weber catches this by lateralizing to the normal ear."
    difficulty: hard
    tags: [otolaryngology, Weber test, Rinne test, CHL, false negative Rinne]
  - front: "What is the differential diagnosis of nasal obstruction? List congenital and acquired causes."
    back: "Acquired: rhinitis (acute/chronic/vasomotor/allergic), rhinosinusitis, foreign bodies, enlarged turbinates, nasal polyps/inverting papilloma, malignant tumours (SCC, esthesioneuroblastoma, adenocarcinoma), septal deviation/dislocation/hematoma-abscess, adenoid hypertrophy, nasopharyngeal carcinoma, GPA, JNA. Congenital: pyriform aperture stenosis, choanal atresia, dermoid cyst, encephalocele, glioma, septal deviation/dislocation/hematoma.\n\nBilateral nasal obstruction in a neonate should raise immediate concern for choanal atresia, as neonates are obligate nasal breathers. Unilateral nasal obstruction with clear discharge in a child suggests a foreign body. Inverting papilloma is a benign lesion with malignant potential requiring complete excision."
    difficulty: medium
    tags: [otolaryngology, nasal obstruction, choanal atresia, nasal polyps, differential diagnosis]
  - front: "What are the neurological causes of hoarseness and how do they differ by laterality?"
    back: "Central: vocal cord paralysis from CVA, MS, skull base tumours, Arnold-Chiari malformation, head injury. Peripheral unilateral: lung malignancy (most common), iatrogenic (thyroid/parathyroid surgery, carotid endarterectomy, PDA ligation). Peripheral bilateral (iatrogenic): bilateral thyroid surgery, forceps delivery. Neuromuscular: myasthenia gravis.\n\nThe recurrent laryngeal nerve (branch of CN X) has a long course and is vulnerable to injury at multiple sites. Left-sided paralysis is more common due to the longer intrathoracic course. Bilateral vocal cord paralysis can cause airway compromise requiring urgent intervention."
    difficulty: medium
    tags: [otolaryngology, hoarseness, vocal cord paralysis, recurrent laryngeal nerve, iatrogenic]
  - front: "What is the diagnostic significance of a poor speech discrimination score as a predictor of hearing aid outcomes?"
    back: "Poor speech discrimination score indicates significant neural degeneration. A poor score means hearing aids may NOT be the best option for the patient, as amplification cannot overcome neural processing deficits.\n\nHearing aids amplify sound but cannot restore neural coding fidelity. If the cochlear nerve or auditory cortex is significantly damaged, even amplified sound cannot be processed intelligibly. These patients may be better candidates for cochlear implants or other assistive devices."
    difficulty: medium
    tags: [otolaryngology, speech discrimination, hearing aids, neural degeneration, cochlear implant]
  - front: "What is Kiesselbach's plexus and where is it located?"
    back: "Kiesselbach's plexus is an anastomotic network of vessels on the anterior-inferior portion of the cartilaginous nasal septum (Little's area). It receives contributions from the anterior/posterior ethmoidal arteries (internal carotid), sphenopalatine artery, superior labial artery, and greater palatine artery (all from external carotid).\n\nKiesselbach's plexus is the most common site of anterior epistaxis. Its rich anastomotic supply from both internal and external carotid systems explains why anterior nosebleeds are so frequent. Little's area is the clinical correlate — the anterior-inferior cartilaginous septum."
    difficulty: easy
    tags: [epistaxis, nasal anatomy, otolaryngology, vascular]
  - front: "An adolescent male presents with unilateral, recurrent epistaxis. What diagnosis must be considered?"
    back: "Juvenile Nasopharyngeal Angiofibroma (JNA) — the most common benign tumour of the nasopharynx. It occurs in adolescent males and presents with recurrent unilateral epistaxis.\n\nJNA is a highly vascular, locally aggressive benign tumour arising in the nasopharynx. Despite being benign, it causes significant morbidity through recurrent epistaxis and local invasion. Biopsy is risky due to vascularity; imaging (CT/MRI) is preferred for diagnosis before surgical planning."
    difficulty: easy
    tags: [epistaxis, nasopharyngeal angiofibroma, JNA, otolaryngology, paediatrics]
  - front: "What is the first-line treatment for epistaxis in the emergency setting?"
    back: "Apply constant firm pressure for 15–20 minutes on the cartilaginous part of the nose (not the bony pyramid) with the patient leaning forward and the head in a neutral position. First-line topical treatment is a topical decongestant (e.g., Otrivin®).\n\nLeaning forward prevents blood from flowing posteriorly into the airway or being swallowed (which can cause nausea/vomiting and obscure assessment). Pressure on the cartilaginous septum compresses Kiesselbach's plexus. Topical decongestants cause vasoconstriction to help achieve hemostasis."
    difficulty: easy
    tags: [epistaxis, emergency management, otolaryngology]
  - front: "Why should silver nitrate cauterization never be applied to both sides of the nasal septum simultaneously?"
    back: "Bilateral simultaneous cauterization risks septal perforation due to loss of septal blood supply from both sides.\n\nThe nasal septum is avascular cartilage that relies on the overlying mucoperichondrium for its blood supply. Cauterizing both sides simultaneously destroys this supply bilaterally, causing avascular necrosis and septal perforation — a serious complication."
    difficulty: easy
    tags: [epistaxis, cauterization, septal perforation, otolaryngology]
  - front: "What type of nasal packing is preferred for patients with coagulopathy or on anticoagulation who require nasal packing for epistaxis?"
    back: "Lubricated absorbable packing (e.g., Gelfoam wrapped in Surgicel®) is preferred to prevent recurrent epistaxis caused by packing removal, which can disrupt newly formed clot.\n\nConventional packing (Merocel®, Rapid Rhino®) is non-absorbable and must be removed, risking re-bleeding in coagulopathic patients. Absorbable materials dissolve in situ, eliminating the trauma of removal and the risk of dislodging a fragile clot."
    difficulty: medium
    tags: [epistaxis, coagulopathy, nasal packing, otolaryngology]
  - front: "What are the complications of posterior nasal packing for epistaxis?"
    back: "Hypoxemia (nasopulmonary reflex), toxic shock syndrome, pharyngeal fibrosis/stenosis, alar/septal necrosis, and aspiration.\n\nPosterior packs are associated with more serious complications than anterior packs. The nasopulmonary reflex (posterior pack stimulates a vagal response causing bronchospasm and hypoxemia) mandates hospital admission and monitoring. Packs left >48 hours or any posterior pack require prophylactic antibiotics against toxic shock syndrome."
    difficulty: medium
    tags: [epistaxis, posterior packing, complications, otolaryngology]
  - front: "When are antibiotics indicated for nasal packing in epistaxis management?"
    back: "Antibiotics are required for any posterior nasal pack OR any anterior pack left in place for >48 hours, due to risk of toxic shock syndrome.\n\nNasal packs create an anaerobic environment that can promote S. aureus colonization and toxin production, leading to toxic shock syndrome. This is particularly true with prolonged packing. Canadian guidelines recommend antibiotic prophylaxis in these scenarios."
    difficulty: easy
    tags: [epistaxis, antibiotics, toxic shock syndrome, nasal packing, otolaryngology]
  - front: "What surgical and interventional options are available when anterior/posterior nasal packs fail to control epistaxis?"
    back: "Transnasal endoscopic sphenopalatine artery ligation + anterior ethmoid artery ligation (by otolaryngology) OR embolization of the culprit arterial supply (by interventional radiology). Septoplasty may also be added.\n\nSphenopalatine artery ligation addresses the dominant posterior supply. Anterior ethmoid artery ligation addresses the superior anterior supply. Embolization is an alternative that preserves the artery but blocks flow. These are used when packing fails or is not tolerated."
    difficulty: medium
    tags: [epistaxis, surgical management, sphenopalatine artery, otolaryngology]
  - front: "Define dysphonia vs. aphonia."
    back: "Dysphonia: a general alteration in voice quality (including hoarseness and voice weakness). Aphonia: no sound emanates from the vocal folds.\n\nHoarseness is the subjective perception of voice harshness or weakness. Dysphonia is broader and encompasses all voice quality changes. Aphonia represents complete loss of voice. Both reflect abnormalities anywhere along the vocal tract from oral cavity to lungs. Hoarseness persisting >2 weeks requires evaluation to rule out malignancy."
    difficulty: easy
    tags: [hoarseness, dysphonia, aphonia, laryngology, otolaryngology]
  - front: "Hoarseness present for more than 2 weeks requires what evaluation?"
    back: "Laryngoscopy to rule out malignancy (e.g., laryngeal carcinoma).\n\nPersistent hoarseness (>2 weeks) is a red flag symptom in otolaryngology. While most causes are benign (chronic laryngitis, nodules, polyps), laryngeal squamous cell carcinoma must be excluded via direct or flexible laryngoscopy. This is a key Canadian clinical threshold."
    difficulty: easy
    tags: [hoarseness, laryngoscopy, malignancy, otolaryngology, red flags]
  - front: "What is the most common cause of acute laryngitis?"
    back: "Infectious causes, most commonly viral (influenza, adenovirus, HSV).\n\nAcute laryngitis is defined as <2 weeks of inflammatory changes in the laryngeal mucosa. Viral infection is the most common trigger. Mechanical causes (voice strain), environmental irritants (toxic fume inhalation), and bacterial infections (Group A Streptococcus) are other etiologies."
    difficulty: easy
    tags: [acute laryngitis, hoarseness, otolaryngology]
  - front: "What are the treatment principles for acute laryngitis?"
    back: "Usually self-limited (resolves in 1–2 weeks). Treatment: voice rest, humidification, hydration, avoid irritants (smoking, caffeine). Add antibiotics if concurrent bacterial pharyngitis; add PPI if reflux is contributing.\n\nThe mainstay of acute laryngitis management is supportive. Because viral etiology is most common, antibiotics are not routinely indicated. GERD is a recognized precipitant/aggravator and PPIs can help in that context. Steroids are not standard for acute laryngitis unless airway compromise exists."
    difficulty: easy
    tags: [acute laryngitis, treatment, otolaryngology]
  - front: "What is the position of a paralyzed vocal cord in unilateral recurrent laryngeal nerve (RLN) palsy, and what are the consequences?"
    back: "The affected cord lies in the paramedian position, causing inadequate glottic closure → breathy voice and aspiration risk. Usually medializes with time, improving phonation and aspiration. Treatment options: voice therapy, injection laryngoplasty (e.g., Radiesse), or thyroplasty/nerve reinnervation.\n\nThe RLN innervates all intrinsic laryngeal muscles except the cricothyroid. Paralysis causes the cord to assume the paramedian (adducted/abducted intermediate) position. The contralateral cord may compensate by crossing the midline. Injection laryngoplasty medializes the cord to improve voice and swallow."
    difficulty: medium
    tags: [vocal cord paralysis, recurrent laryngeal nerve, hoarseness, otolaryngology]
  - front: "What are the respiratory consequences of bilateral vocal cord paralysis, and how is it managed?"
    back: "Both cords rest near the midline → airway obstruction → stridor. If no respiratory compromise, monitor for improvement. If airway is compromised, surgical options include vocal cord lateralization, arytenoidectomy, posterior costal cartilage graft, or tracheotomy.\n\nBilateral RLN palsy is an airway emergency if the cords are adducted (midline). Paradoxically, phonation may be preserved if the cords are close to the midline. Management prioritizes airway over voice quality. Selective nerve reinnervation (Marie Technique) may restore movement in experienced hands."
    difficulty: medium
    tags: [vocal cord paralysis, bilateral RLN palsy, airway obstruction, otolaryngology]
  - front: "What are the systemic and local causes of chronic laryngitis?"
    back: "Local: repeated acute laryngitis, chronic rhinosinusitis with postnasal drip, chronic voice strain, chronic irritants (dust, smoke, chemicals), alcohol. Systemic: GERD, Zenker's diverticulum, hiatal hernia, allergy, hypothyroidism, Addison's disease.\n\nChronic laryngitis (>3 weeks) has multiple etiologies. GERD is a particularly important and treatable systemic cause — acid reflux causes posterior laryngeal erythema and granuloma formation. Hypothyroidism causes myxedematous changes to the vocal cord mucosa. All causes should be addressed to prevent malignant transformation."
    difficulty: easy
    tags: [chronic laryngitis, GERD, hoarseness, otolaryngology]
  - front: "Contrast vocal cord polyps vs. vocal cord nodules in terms of laterality, onset, and characteristics."
    back: "Polyps: unilateral, asymmetric, acute onset, may resolve spontaneously, soft/smooth/pedunculated, subepithelial capillary breakage. Nodules: bilateral, symmetric, gradual onset, chronic course, bilateral at anterior 1/3–posterior 2/3 junction, early = hemorrhagic, chronic = hard, white, fibrosed.\n\nThis distinction is clinically and therapeutically important. Polyps result from acute subepithelial vascular injury during extreme vocal exertion. Nodules result from chronic repetitive micro-trauma (vocal abuse) leading to callus formation at the point of maximum cord vibration. Treatment differs: polyps may require surgery; nodules are primarily treated with voice therapy."
    difficulty: easy
    tags: [vocal cord polyps, vocal cord nodules, dysphonia, otolaryngology]
  - front: "What is the primary treatment for vocal cord nodules?"
    back: "Voice rest and voice therapy (primary treatment). Add hydration and avoidance of irritants. Surgery is rarely indicated and only for refractory nodules.\n\nVocal cord nodules are a behavioral disorder — they result from chronic vocal misuse/abuse. Voice therapy addresses the underlying vocal behaviors and is curative in most cases. Surgery is generally avoided as a first-line treatment because nodules recur unless the vocal behavior is corrected."
    difficulty: easy
    tags: [vocal cord nodules, treatment, voice therapy, otolaryngology]
  - front: "Vocal cord nodules are found at what specific location on laryngoscopy?"
    back: "Bilateral symmetric nodules at the junction of the anterior 1/3 and posterior 2/3 of the vocal cords — the point of maximal cord vibration.\n\nThis is a high-yield anatomical fact. The anterior 1/3–posterior 2/3 junction is where vibratory stress is greatest during phonation, making it the site of nodule formation. Finding bilateral symmetric lesions at this precise location is pathognomonic of vocal cord nodules (vs. polyps, which are typically unilateral)."
    difficulty: easy
    tags: [vocal cord nodules, laryngoscopy, otolaryngology]
  - front: "What HPV types cause recurrent respiratory papillomatosis (RRP)?"
    back: "Most commonly HPV types 6 and 11. Types 16, 18, 31, and 33 can also be responsible.\n\nHPV 6 and 11 cause the benign condylomatous lesions of RRP. HPV 16 and 18 (high-risk oncogenic types) are associated with malignant transformation to squamous cell carcinoma. RRP is thought to be acquired during vaginal delivery (vertical transmission), with possible hormonal influence."
    difficulty: easy
    tags: [recurrent respiratory papillomatosis, HPV, laryngeal papilloma, otolaryngology]
  - front: "What is the most common laryngeal tumour in children?"
    back: "Recurrent respiratory papillomatosis (RRP) — caused by HPV (types 6, 11).\n\nRRP has a biphasic distribution: juvenile-onset (birth to puberty) and adult-onset (>12 yr). The juvenile form is the most common laryngeal tumour in children. It presents with progressive hoarseness, stridor, and respiratory distress. While benign, it has high recurrence and can seed the tracheobronchial tree."
    difficulty: easy
    tags: [recurrent respiratory papillomatosis, paediatric laryngology, HPV, otolaryngology]
  - front: "What is the gold standard treatment for recurrent respiratory papillomatosis (RRP)?"
    back: "Suspension microlaryngoscopy with laser removal (preferably CO2 or KTP laser) with preservation of normal mucosa. This is NOT curative; the goal is improvement in voice and/or breathing.\n\nRRP is highly resistant to complete removal and has a high tendency for recurrence. The goal of surgery is to improve function, not achieve cure. If >4 surgeries/year are required, adjuvant systemic therapy is considered: quadrivalent HPV vaccine, bevacizumab, cidofovir, interferon, or indole-3-carbinol."
    difficulty: medium
    tags: [recurrent respiratory papillomatosis, laser surgery, treatment, otolaryngology]
  - front: "What is sialadenitis and what are the most common causative organisms?"
    back: "Sialadenitis is inflammation of the salivary glands. Most commonly viral (mumps). Bacterial causes include S. aureus, S. pneumoniae, and H. influenzae.\n\nObstructive sialadenitis results from salivary stasis (e.g., sialolithiasis, duct stenosis) with retrograde bacterial flow. Non-obstructive forms include viral (mumps — bilateral parotitis + SNHL + orchitis) and immune-mediated (Sjögren's). Treatment mnemonic: MASH — Massage, Antibiotics, Sialogogues, Heat/Hydration."
    difficulty: easy
    tags: [sialadenitis, salivary glands, mumps, otolaryngology]
  - front: "What is the MASH mnemonic for sialadenitis treatment?"
    back: "M – Massage; A – Analgesics/Antibiotics; S – Sialogogues (agents that stimulate saliva, e.g., lemon candies); H – Heat/Hydration.\n\nThis mnemonic covers the conservative management of sialadenitis. If bacterial infection is confirmed, cloxacillin is added. Abscess drainage is required if a fluctuant abscess forms. Bilateral parotid enlargement should prompt evaluation for systemic causes (mumps, HIV, Sjögren's, eating disorders)."
    difficulty: easy
    tags: [sialadenitis, treatment, MASH mnemonic, otolaryngology]
  - front: "What are the predisposing factors for sialadenitis?"
    back: "HIV, anorexia/bulimia, Sjögren's syndrome, Cushing's syndrome, hypothyroidism, DM, hepatic/renal failure, sialolithiasis, and medications that increase stasis (diuretics, TCAs, beta-blockers, anticholinergics, antibiotics).\n\nAny condition reducing salivary flow creates stasis and increases risk of ascending bacterial infection. Medications with anticholinergic effects are a common and often overlooked cause. Anorexia/bulimia causes parotid hypertrophy from repeated purging (Stensen's duct reflux)."
    difficulty: medium
    tags: [sialadenitis, risk factors, salivary glands, otolaryngology]
  - front: "What percentage of sialolithiasis (salivary duct stones) occurs in the submandibular gland, and why?"
    back: "80% of salivary stones occur in the submandibular gland. This is because submandibular saliva is more alkaline, mucous, and calcium-rich, and Wharton's duct is longer, wider, and drains against gravity.\n\nThe submandibular gland's anatomy and secretion properties favor stone formation. The classic presentation is intermittent painful swelling of the submandibular gland related to meals (when salivary flow increases). Parotid gland accounts for <20% of cases; sublingual gland ~1%."
    difficulty: easy
    tags: [sialolithiasis, submandibular gland, salivary stones, otolaryngology]
  - front: "What is the investigation of choice for sialolithiasis?"
    back: "Ultrasound (U/S) is first-line. If a stone is identified, CT is used for precise localization. Sialogram may also be considered.\n\nU/S is non-invasive and effectively identifies most submandibular stones. CT provides precise 3D localization to guide surgical planning. Sialography (contrast injection into the duct) can outline the ductal system and demonstrate filling defects but is less commonly used."
    difficulty: easy
    tags: [sialolithiasis, investigations, ultrasound, otolaryngology]
  - front: "What is the distribution of salivary gland neoplasms, and what is the most common benign and malignant type in the parotid?"
    back: "Parotid 70–85%, submandibular 8–15%, sublingual 1%, minor salivary glands 5–8%. Parotid: 80% benign (most common: pleomorphic adenoma), 20% malignant (most common: mucoepidermoid carcinoma). Warthin's tumour is the 2nd most common benign parotid tumour.\n\nThe 'rule of 80s' for parotid: 80% of all salivary gland tumours are in the parotid; 80% of parotid tumours are benign; the most common benign tumour is pleomorphic adenoma. Inversely, the smaller the gland, the higher the likelihood of malignancy (minor salivary glands: >80% malignant)."
    difficulty: easy
    tags: [salivary gland neoplasms, parotid, pleomorphic adenoma, mucoepidermoid, otolaryngology]
  - front: "What clinical feature of a parotid mass increases suspicion for malignancy?"
    back: "Facial nerve involvement (facial paralysis/paresis) is a sign of malignancy in a parotid mass.\n\nThe facial nerve (CN VII) traverses the parotid gland and divides within it. Malignant parotid tumours may invade the nerve, causing facial weakness or paralysis. Bilateral parotid masses suggest a benign process (Warthin's tumour, Sjögren's, bulimia, mumps) or lymphoma. A mass above the line from tragus to mandibular angle is a parotid lesion until proven otherwise."
    difficulty: easy
    tags: [parotid tumour, facial nerve, malignancy, otolaryngology]
  - front: "Why are pleomorphic adenomas excised rather than observed?"
    back: "Pleomorphic adenomas have a 5% risk of malignant transformation over a prolonged period of time.\n\nPleomorphic adenoma (benign mixed tumour) is the most common salivary gland neoplasm. Despite its benign nature, it carries a risk of malignant transformation to carcinoma ex pleomorphic adenoma. Additionally, incomplete excision leads to seeding and recurrence. Incisional biopsy is contraindicated — it risks seeding and should not be performed."
    difficulty: easy
    tags: [pleomorphic adenoma, malignant transformation, parotid surgery, otolaryngology]
  - front: "What is Frey's syndrome and why does it occur?"
    back: "Frey's syndrome is gustatory sweating (sweating of the preauricular skin during eating) that occurs as a postoperative complication of parotid surgery. It is caused by damaged parasympathetic nerve fibres of the auriculotemporal nerve regenerating into the sweat glands of the skin.\n\nNormally, the auriculotemporal nerve (branch of CN V3) carries parasympathetic fibres to the parotid gland. After parotidectomy, these regenerating fibres aberrantly innervate the overlying skin's eccrine sweat glands, causing sweating in response to salivary stimuli (eating/smelling food)."
    difficulty: medium
    tags: [Freys syndrome, gustatory sweating, parotidectomy, complications, otolaryngology]
  - front: "What is the approach to evaluating a neck mass by age?"
    back: "In patients <40 years: most likely inflammatory > congenital/developmental > neoplastic. In patients >40 years: most likely neoplastic > inflammatory > congenital. Any neck mass persisting >2 weeks should be investigated for neoplastic causes.\n\nThis age-based prioritization is a key MCCQE1 clinical framework. In young patients, reactive lymphadenopathy from infection dominates. In older patients, malignancy (lymphoma, metastatic squamous cell carcinoma, salivary gland tumours, thyroid cancer) must be the leading concern until proven otherwise."
    difficulty: easy
    tags: [neck mass, differential diagnosis, otolaryngology, clinical approach]
  - front: "What distinguishes an inflammatory from a neoplastic neck mass on history and physical?"
    back: "Inflammatory: painful, rapid onset, tender on exam, rubbery. Neoplastic: painless, longer duration (weeks–months), non-tender, rock-hard, immobile/fixed.\n\nThese features guide the initial differential. However, lymphoma can present with a rubbery, painless mass, blurring this distinction. Tender nodes can occasionally be malignant (if rapidly growing with central necrosis). Clinical suspicion combined with appropriate investigations (FNA, CT, CBC) is essential."
    difficulty: easy
    tags: [neck mass, inflammatory vs neoplastic, physical examination, otolaryngology]
  - front: "What is the most common congenital neck mass in children?"
    back: "Thyroglossal duct cyst — the most common congenital cervical anomaly.\n\nThyroglossal duct cysts are midline remnants of the tract made by the thyroid as it descends from the foramen cecum at the base of the tongue to its final position in the neck. They classically elevate with swallowing and tongue protrusion. Treatment is the Sistrunk procedure."
    difficulty: easy
    tags: [thyroglossal duct cyst, congenital neck mass, paediatrics, otolaryngology]
  - front: "Describe the classic features of a thyroglossal duct cyst."
    back: "Midline neck cyst (suprahyoid or infrahyoid) that enlarges with URTIs, elevates with swallowing AND tongue protrusion, may cause dysphagia or globus sensation. Usually presents in childhood or ages 20–40.\n\nThe pathognomonic feature is elevation with tongue protrusion (due to the fibrous cord connecting the cyst to the foramen cecum at the tongue base). This distinguishes it from other midline neck masses. The cyst often becomes inflamed during URTIs due to its connection with the pharynx."
    difficulty: easy
    tags: [thyroglossal duct cyst, clinical features, otolaryngology]
  - front: "What surgical procedure is used to treat thyroglossal duct cysts, and what does it involve?"
    back: "The Sistrunk procedure: complete excision of the cyst, the fibrous cord/tract up to the foramen cecum at the base of the tongue, AND removal of the central portion of the hyoid bone.\n\nSimple cyst excision has a high recurrence rate (~50%). The Sistrunk procedure reduces recurrence to <3% by ensuring complete tract excision including the hyoid bone segment (which the tract passes through). Preoperative antibiotics should be given to reduce inflammation and minimize recurrence risk."
    difficulty: medium
    tags: [thyroglossal duct cyst, Sistrunk procedure, surgery, otolaryngology]
  - front: "What is the most common branchial cleft anomaly, and how does it present?"
    back: "2nd branchial cleft malformation is most common. Sinuses/fistulae present in infancy as a small opening anterior to the SCM. Cysts present as a smooth, painless, slowly enlarging lateral neck mass, often following a URTI.\n\nBranchial cleft anomalies result from failure of obliteration of embryonic branchial clefts/pouches. They fall into three types: fistula (opens to skin and GI tract), sinus (blind-ended), and cyst (closed). 2nd branchial cleft anomalies are by far most common. Treatment is surgical excision after infection resolves."
    difficulty: easy
    tags: [branchial cleft cyst, congenital neck mass, otolaryngology]
  - front: "What is the pathognomonic finding for a 3rd branchial cleft anomaly on CT?"
    back: "Air on CT scan in or near the thyroid gland, associated with recurrent thyroiditis or thyroid abscess. The tract typically leads to the left pyriform sinus.\n\n3rd branchial cleft anomalies are rare and present as recurrent left-sided thyroiditis or thyroid abscess. The connection to the pyriform sinus allows communication between the pharynx and thyroid, explaining recurrent infections. Air in the thyroid on CT is pathognomonic."
    difficulty: hard
    tags: [branchial cleft anomaly, 3rd branchial cleft, congenital neck mass, otolaryngology]
  - front: "What are the premalignant lesions of the oral cavity and their risk of malignant transformation?"
    back: "Lichen planus: 5–10% risk (follow-up every 6–12 months). Leukoplakia: 5–20% risk (follow-up every 3–12 months). Erythroplakia: associated with carcinoma in situ or invasive tumour in 40% of cases (highest risk).\n\nErythroplakia carries the highest malignant potential of the three. Leukoplakia is a white keratotic plaque that cannot be rubbed off (distinguishing it from candidiasis). Dysplasia involving the entire mucosal thickness = carcinoma in situ, which has 15–30% progression to invasive cancer."
    difficulty: medium
    tags: [oral premalignant lesions, leukoplakia, erythroplakia, lichen planus, head and neck oncology, otolaryngology]
  - front: "What is the treatment of choice for lichen planus of the oral mucosa?"
    back: "Topical corticosteroids (first-line); topical calcineurin inhibitors (second-line). Follow-up every 6–12 months due to 5–10% malignant transformation risk.\n\nOral lichen planus presents as lacy white lines (Wickham's striae) with surrounding erythema. The exact cause is unknown but is thought to be immune-mediated (T-cell lymphocyte attack on basal keratinocytes). Symptomatic lesions require treatment; asymptomatic cases need surveillance."
    difficulty: easy
    tags: [lichen planus, oral premalignant lesion, treatment, otolaryngology]
  - front: "What is the general treatment principle for head and neck malignancies by anatomic site?"
    back: "Oral cavity: primary surgery with radiotherapy reserved for salvage/poor prognostic indicators. Nasopharynx, oropharynx, hypopharynx, and larynx: primary radiotherapy with surgery reserved for salvage. Advanced (T4) pharyngeal/laryngeal cancer: surgery is standard of care. Metastatic: palliative chemotherapy.\n\nThe anatomic site dictates primary treatment modality. Oral cavity tumours are generally resected because they are accessible and well-defined. Laryngeal and pharyngeal tumours are often treated with radiotherapy to preserve function. Laser endoscopic surgery (transoral) is an option for early-stage laryngeal cancer."
    difficulty: medium
    tags: [head and neck oncology, treatment principles, squamous cell carcinoma, otolaryngology]
  - front: "What is the epidemiology and key risk factor for nasopharyngeal carcinoma?"
    back: "90% SCC. Mean age: 50–59 yr; M:F = 2.4:1. 100-fold increased incidence in Southern Chinese. Key risk factors: EBV infection, salted fish consumption, nickel exposure. Poor oral hygiene also contributes.\n\nNasopharyngeal carcinoma (NPC) has a striking geographic and ethnic distribution, highly prevalent in Southern China and Southeast Asia. EBV is strongly implicated in the pathogenesis, particularly for the undifferentiated (non-keratinizing) subtype. EBV serology is used in screening in endemic regions."
    difficulty: medium
    tags: [nasopharyngeal carcinoma, EBV, head and neck oncology, epidemiology, otolaryngology]
  - front: "What proportion of oropharyngeal cancers (OPC) are attributable to HPV, and how does HPV status affect prognosis?"
    back: "Up to 70% of OPC are attributable to HPV (primarily HPV-16). HPV+ OPC patients have significantly better prognosis: 82.4% vs. 51.1% 3-year overall survival and a 58% reduction in risk of death compared to HPV-negative tumours.\n\nThe rising incidence of HPV-associated OPC (225% increase from 1988–2004) has shifted the epidemiology of head and neck cancer. HPV+ OPC patients tend to be younger (~10 years), non-smokers, with better treatment response. HPV vaccination (quadrivalent) is a key prevention strategy, independent of smoking and alcohol exposure."
    difficulty: medium
    tags: [oropharyngeal cancer, HPV, prognosis, head and neck oncology, otolaryngology]
  - front: "What is the most common site of laryngeal carcinoma, and what is the gender predominance?"
    back: "Glottic larynx (60–65% of laryngeal cancers). Laryngeal cancer has a strong male predominance (M:F = 10:1). Primary risk factors: smoking and alcohol.\n\nLaryngeal cancers arise in three sites: supraglottic (30–35%), glottic (60–65%), and subglottic (1%). Glottic tumours present early (hoarseness) because the vocal cords are directly involved. Supraglottic tumours have poorer prognosis due to late presentation and rich lymphatic drainage. Laryngeal cancer accounts for 45% of all H&N cancers."
    difficulty: easy
    tags: [laryngeal carcinoma, squamous cell carcinoma, glottic cancer, head and neck oncology, otolaryngology]
  - front: "What is the rule regarding the likelihood of malignancy and salivary gland size?"
    back: "The smaller the salivary gland, the greater the likelihood that a mass in that gland is malignant. Parotid: 15–25% malignant; submandibular: 37–43% malignant; minor salivary glands: >80% malignant.\n\nThis inverse relationship between gland size and malignancy risk is a key MCCQE1 high-yield fact. While the parotid contains most salivary gland tumours, the vast majority are benign. A sublingual or minor salivary gland mass carries very high malignancy risk and demands urgent investigation."
    difficulty: easy
    tags: [salivary gland malignancy, parotid, minor salivary glands, otolaryngology]
  - front: "What is the most common malignant salivary gland tumour overall?"
    back: "Mucoepidermoid carcinoma (40% of malignant salivary gland tumours), followed by adenoid cystic carcinoma (30%), acinic cell carcinoma (5%), and malignant mixed tumour (5%).\n\nMucoepidermoid carcinoma is also the most common malignant tumour of the parotid. Adenoid cystic carcinoma is notorious for perineural invasion and late distant metastases (even decades later). Salivary gland malignancies are associated with radiation exposure as a key risk factor."
    difficulty: easy
    tags: [mucoepidermoid carcinoma, salivary gland malignancy, adenoid cystic carcinoma, otolaryngology]
  - front: "What is the role of panendoscopy in head and neck oncology?"
    back: "Panendoscopy (nasopharyngoscopy, laryngoscopy, esophagoscopy, bronchoscopy with washings and biopsy) is used to identify the primary tumour when cervical lymph node metastasis is identified (unknown primary). The primary is found ~95% of the time.\n\nWhen a patient presents with a cervical lymph node containing SCC with no obvious primary, panendoscopy is performed to identify the occult primary tumour in the upper aerodigestive tract. If the primary remains occult (~5%), excisional biopsy of the node for histologic diagnosis guides management (radiotherapy ± neck dissection)."
    difficulty: medium
    tags: [panendoscopy, unknown primary, head and neck oncology, otolaryngology]
  - front: "What targeted therapy is used for advanced squamous cell carcinoma of the head and neck?"
    back: "Anti-EGFR (epidermal growth factor receptor) treatment — cetuximab or panitumumab — as concurrent therapy with radiation for advanced local and regional SCC of the head and neck.\n\nEGFR is overexpressed in most H&N SCC. Cetuximab (a monoclonal antibody against EGFR) improves survival when added to radiation in advanced disease. It is an alternative for patients who cannot tolerate cisplatin-based chemoradiation. Concomitant chemotherapy also increases survival in advanced disease."
    difficulty: medium
    tags: [cetuximab, EGFR, head and neck SCC, targeted therapy, otolaryngology]
  - front: "What is the most common risk factor for hypopharyngeal carcinoma, and what is the most common subsitite?"
    back: "Smoking and alcohol (synergistic) are the primary risk factors. The most common subsite is the pyriform sinus (60%), followed by the postcricoid region (30%) and posterior pharyngeal wall (10%).\n\nHypopharyngeal cancers have poor prognosis due to late presentation. They account for 8–10% of all H&N cancers, predominantly affecting males aged 50–70 years. Plummer-Vinson syndrome (iron-deficiency dysphagia with esophageal webbing) is associated with postcricoid carcinoma in women."
    difficulty: medium
    tags: [hypopharyngeal carcinoma, pyriform sinus, head and neck oncology, otolaryngology]
  - front: "What imaging modality is superior for detecting pathologic cervical lymph nodes and bone cortex invasion in head and neck cancer?"
    back: "CT scan is superior to MRI for detecting pathologic nodal disease and bone cortex invasion.\n\nWhile CT excels at detecting cortical bone invasion and lymph node size/morphology, MRI is superior for discriminating tumour from mucus, detecting bone marrow invasion (medullary spread), and soft tissue characterization. PET scans have an emerging role in H&N neoplasm staging and surveillance."
    difficulty: easy
    tags: [head and neck imaging, CT vs MRI, cervical lymph nodes, otolaryngology]
  - front: "What size criteria define pathologically enlarged cervical lymph nodes?"
    back: "Jugulodigastric node >1.5 cm in diameter; retropharyngeal node >0.8 cm in diameter; any node of any size with central necrosis.\n\nLymph node size alone is imperfect for detecting metastasis. Central necrosis on imaging (seen as a low-density center on CT) is highly specific for metastatic SCC. Retropharyngeal nodes have smaller threshold criteria because they are not normally visible on imaging."
    difficulty: medium
    tags: [cervical lymph nodes, head and neck oncology, imaging criteria, otolaryngology]
  - front: "What is lymphatic (cystic hygroma) / venolymphatic malformation, and how does its size affect treatment?"
    back: "Lymphatic malformations arise from vestigial lymph channels. Macrocystic lesions: soft, painless, compressible, treated by surgical excision or sclerotherapy (doxycycline). Microcystic lesions: noncompressible with mucosal/skin vesicles, difficult to treat — debulking or bleomycin sclerotherapy.\n\nLymphatic malformations (cystic hygroma) usually present by age 2. They can regress spontaneously after bacterial infection, so surgical intervention should be delayed several months after infection. Sudden enlargement after infection or trauma is a characteristic feature that may cause airway compromise requiring urgent intervention."
    difficulty: medium
    tags: [lymphatic malformation, cystic hygroma, congenital neck mass, otolaryngology]
  - front: "What is the most common site of oral cavity cancer, and what are its key risk factors?"
    back: "Most common site: anterior 2/3 of the tongue (50% of oral cavity cancers). Risk factors: smoking, alcohol, poor oral hygiene, leukoplakia, erythroplakia, lichen planus, chronic inflammation, HPV, Plummer-Vinson syndrome, sun exposure (lip), genetic factors.\n\nOral cavity SCC (95% of oral cavity cancers) is treated primarily with surgery. The tongue is the most common site, and early lesions of the oral tongue have a good prognosis with surgery. Risk factors are additive; smoking and alcohol have a synergistic relationship in causing oral cavity cancers."
    difficulty: easy
    tags: [oral cavity cancer, tongue cancer, SCC, head and neck oncology, otolaryngology]
  - front: "What are the 5-year survival rates for oral cavity cancer by T-stage?"
    back: "T1/T2: 75%; T3/T4: 30-35%\n\nOral cavity cancer prognosis is stage-dependent. Poor prognostic indicators include depth of invasion, close surgical margins, and location (tongue has worse prognosis than floor of mouth). Primary treatment is surgery with local resection ± neck dissection ± reconstruction, with secondary radiation."
    difficulty: medium
    tags: [otolaryngology, head-and-neck-cancer, oral-cavity, prognosis]
  - front: "What is the primary treatment for nasopharyngeal carcinoma (NPC)?"
    back: "Primary radiation + chemoradiation; surgery reserved for limited or recurrent disease\n\nNPC commonly presents with cervical nodes (60-90%), nasal obstruction, unilateral otitis media with hearing loss, and cranial nerve involvement (III-VI, IX-XII). 5-year survival: T1=79%, T2=77%, T3=50-60%, T4=36-42%."
    difficulty: medium
    tags: [otolaryngology, head-and-neck-cancer, nasopharynx]
  - front: "How does HPV status affect oropharyngeal cancer (OPC) prognosis?"
    back: "HPV-positive OPC has significantly better outcomes: Stage I 92%, II 87%, III 74%, IV 40% vs. HPV-negative: Stage I 70%, II 58%, III 50%, IV 30%\n\nHPV+ OPC predominantly arises at the base of tongue or tonsillar region. HPV status is determined via RT-PCR (presence of HPV DNA) and p16 overexpression. HPV+ patients are candidates for therapy de-intensification. Transoral robotic surgery has an emerging role."
    difficulty: medium
    tags: [otolaryngology, oropharynx, HPV, head-and-neck-cancer, prognosis]
  - front: "What are the Bethesda categories for thyroid FNA cytology and their associated malignancy risk?"
    back: "I Non-diagnostic: 1-4%; II Benign: 0-3%; III Follicular lesion of undetermined significance/AUS: 5-15%; IV Follicular neoplasm: 15-30%; V Suspicious for malignancy: 60-75%; VI Malignant: 97-99%\n\nThe Bethesda System for Reporting Thyroid Cytopathology (TBSRTC) guides management decisions. Categories III-IV often require molecular testing (BRAF, microRNA classifiers) to distinguish high-risk from low-risk nodules and decide whether surgery is needed."
    difficulty: medium
    tags: [otolaryngology, thyroid, FNA, Bethesda-classification]
  - front: "Compare the key features of the 5 types of thyroid carcinoma (papillary, follicular, medullary, anaplastic, lymphoma)."
    back: "Papillary (90-92%): lymphatic spread, orphan Annie nuclei, psammoma bodies, positive I-131 uptake, 98% 10-yr survival. Follicular (4-6%): hematogenous spread, capsular/vascular invasion, NOT diagnosable by FNA, 92% 10-yr survival. Medullary (1-2%): associated MEN IIa/IIb, secretes calcitonin, amyloid stroma, 55-80% 5-yr survival Stage I. Anaplastic (<1%): elderly, giant cells/spindle cells, rapid enlarging mass, rapidly fatal. Lymphoma (<1%): associated with Hashimoto thyroiditis (60x risk), diffuse large B-cell most common, non-surgical treatment (CHOP).\n\nPapillary is the most common and has the best prognosis. Follicular cancer is notable for hematogenous spread to lung/bone and cannot be diagnosed by FNA alone (requires histologic evidence of capsular/vascular invasion). Medullary cancer can be hereditary (MEN IIa: RET mutation) and requires median/lateral neck dissection based on calcitonin levels. Anaplastic carries the worst prognosis."
    difficulty: hard
    tags: [otolaryngology, thyroid, thyroid-carcinoma, papillary, follicular, medullary, anaplastic]
  - front: "What is the TI-RADS classification and when is FNA indicated?"
    back: "TR1 (0 pts): benign, no FNA. TR2 (2 pts): not suspicious, no FNA. TR3 (3 pts): mildly suspicious, FNA if ≥2.5 cm, follow-up if ≥1.5 cm. TR4 (4-6 pts): moderately suspicious, FNA if ≥1.5 cm, follow-up if ≥1 cm. TR5 (≥7 pts): highly suspicious, FNA if ≥1 cm, follow-up if >0.5 cm.\n\nThe ACR Thyroid Imaging, Reporting and Data System (TI-RADS) uses features including composition, echogenicity, shape, margin, and echogenic foci to score thyroid nodules. Higher scores indicate greater suspicion for malignancy and lower size thresholds for FNA."
    difficulty: medium
    tags: [otolaryngology, thyroid, TI-RADS, radiology, FNA]
  - front: "What are the indications for radioiodine (I-131) therapy in thyroid disease?"
    back: "Treatment of hyperthyroidism; adjuvant treatment after surgery for intermediate-to-high-risk papillary or follicular carcinoma\n\nRadioiodine therapy targets thyroid tissue that takes up iodine. For well-differentiated thyroid cancers, postoperative I-131 scanning guides further treatment. Medullary and anaplastic carcinomas do not take up iodine and are not treated with I-131."
    difficulty: easy
    tags: [otolaryngology, thyroid, radioiodine, I-131, treatment]
  - front: "What is the definition of acute otitis media (AOM) and what is the primary etiology?"
    back: "AOM = infection of middle ear space with both presence of middle ear effusion/inflammation (MEE/MEI) AND acute onset of symptoms. Primary defect: Eustachian tube dysfunction/obstruction leading to stasis and pathogen colonization. Most common bacteria: S. pneumoniae, non-typeable H. influenzae, M. catarrhalis.\n\nAOM is the most frequent diagnosis in sick children and the most common reason for antibiotic prescription. Peak incidence is 6-15 months. Bacterial and viral co-infections are common. Viral pathogens include RSV, influenza, parainfluenza, and rhinovirus."
    difficulty: easy
    tags: [otolaryngology, pediatrics, AOM, otitis-media, ear-infection]
  - front: "What are the criteria for watchful waiting vs. immediate antibiotics in pediatric AOM?"
    back: "Watchful waiting (24-48h): healthy child >6 months with unilateral, non-severe AOM (mild illness, otalgia mild, fever <39°C, <48h symptoms). Immediate antibiotics: infant <6 months; moderately/severely ill; fever ≥39°C; symptoms >48h; immunocompromised; craniofacial abnormalities; perforated TM with purulent drainage.\n\nThis reflects Canadian evidence-based guidelines. If not improved or worsening at 24-48h follow-up, treat with antimicrobials. For severe or bilateral AOM with MEE and bulging TM, antimicrobials should be started immediately regardless of age."
    difficulty: medium
    tags: [otolaryngology, pediatrics, AOM, antibiotics, watchful-waiting]
  - front: "What is the first-line antibiotic treatment for AOM, and what are alternatives for penicillin allergy?"
    back: "First-line (no penicillin allergy): high-dose amoxicillin 80-90 mg/kg/d divided BID. Penicillin allergy (first-line alternatives): azithromycin 10 mg/kg or clarithromycin 15 mg/kg/d divided BID. If initial therapy fails (no improvement after 2-3 days): high-dose amoxicillin-clavulanate 45-60 mg/kg/d.\n\nDuration: 5-day course for most children >2 years with uncomplicated AOM; 10-day course for children 6-24 months, perforated TM, or recurrent AOM. Failure of first-line therapy suggests beta-lactamase-producing organisms (H. influenzae, M. catarrhalis) requiring amoxicillin-clavulanate."
    difficulty: medium
    tags: [otolaryngology, pediatrics, AOM, antibiotics, amoxicillin, treatment]
  - front: "What is the most common complication of AOM, and what are the major intracranial complications?"
    back: "Most common complication: mastoiditis. Intracranial complications: meningitis, epidural/brain abscess, subdural empyema, lateral and cavernous sinus thrombosis, sigmoid sinus thrombophlebitis, carotid artery thrombosis, facial nerve paralysis.\n\nExtracranial complications include hearing loss, TM perforation, cholesteatoma, facial nerve palsy, middle ear atelectasis, ossicular necrosis, and vestibular dysfunction. Other complications include postauricular abscess and Bezold's abscess (extension to neck)."
    difficulty: medium
    tags: [otolaryngology, AOM, complications, mastoiditis, pediatrics]
  - front: "What are the criteria for tympanostomy tube insertion in children?"
    back: "Recurrent AOM (≥3 episodes in 6 months OR ≥4 episodes in 12 months with ≥1 in recent 6 months) with unilateral or bilateral MEE at time of reassessment; Chronic bilateral OME and documented hearing loss ≥25 dB after ≥3 months with symptoms attributable to OME; At-risk children (permanent HL, speech/language delay, ASD, craniofacial disorders) with unilateral or bilateral OME with type B tympanogram or persistent effusion >3 months.\n\nPer Canadian/AAO clinical practice guidelines on tympanostomy tubes. Evidence shows tubes improve hearing threshold by ~9 dB at 1-3 months vs. watchful waiting, and reduce recurrent AOM episodes, but benefit diminishes by 12-24 months."
    difficulty: hard
    tags: [otolaryngology, pediatrics, tympanostomy-tubes, AOM, OME]
  - front: "What is otitis media with effusion (OME) and how does it differ from AOM?"
    back: "OME = presence of fluid in the middle ear WITHOUT signs or symptoms of acute infection. AOM requires both MEE/MEI AND acute onset symptoms (otalgia, fever). OME presents with conductive hearing loss, aural fullness, amber/dull grey TM with immobility on pneumatic otoscopy, and meniscus fluid level.\n\nOME is the most common cause of pediatric hearing loss. 90% of children clear fluid within 3 months following AOM. Watchful waiting for 3 months is recommended before considering surgery. Intranasal steroids, systemic antibiotics, antihistamines, and decongestants are NOT recommended."
    difficulty: easy
    tags: [otolaryngology, pediatrics, OME, otitis-media, hearing-loss]
  - front: "What is adenoid facies and what causes it?"
    back: "Adenoid facies = characteristic facial appearance from chronic nasal obstruction due to adenoid hypertrophy: open-mouthed appearance, high arched palate, dental crowding, hypoplastic maxilla, pinched nostrils, short upper lip, and elongated face.\n\nAdenoid hypertrophy peaks around age 5-7 and typically resolves by age 12 (self-resolving due to age-related atrophy). Graded 0 (absent) to 4+ (>75% obstruction). Complications include Eustachian tube obstruction causing serous otitis media, sleep apnea, and orofacial developmental abnormalities."
    difficulty: easy
    tags: [otolaryngology, pediatrics, adenoid-hypertrophy, adenoid-facies]
  - front: "What are the PSG (polysomnography) criteria for OSA severity in children vs. adults?"
    back: "Children: AHI >1/h abnormal; mild 2-4/h, moderate 6-10/h, severe >10/h. Adults: mild 5.1-15/h, moderate 15.1-30/h, severe >30.1/h.\n\nChildren have a lower threshold for abnormality (AHI >1/h vs. >5/h in adults) because children normally have near-absent apneas during sleep. Pediatric OSA peaks at age 2-8 years when tonsils and adenoids are largest relative to the pharyngeal airway."
    difficulty: medium
    tags: [otolaryngology, pediatrics, OSA, sleep-disordered-breathing, polysomnography]
  - front: "What is the surgical treatment of choice for pediatric obstructive sleep apnea (OSA)?"
    back: "Bilateral tonsillectomy and adenoidectomy\n\nIf OSA persists after tonsillectomy and adenoidectomy, consider adenoid regrowth. For refractory cases not tolerant of CPAP/BiPAP, options include lingual tonsillectomy, midline posterior glossectomy, tongue suspension, or other surgeries targeting resistance sites, guided by drug-induced sleep endoscopy or cine-MRI."
    difficulty: easy
    tags: [otolaryngology, pediatrics, OSA, sleep-disordered-breathing, tonsillectomy, adenoidectomy]
  - front: "What is the classic triad (Quinsy triad) of peritonsillar abscess and what is the most reliable diagnostic sign?"
    back: "Quinsy triad: trismus, uvular deviation, dysphonia ('hot potato voice'). Most reliable indicator: trismus (due to irritation and reflex spasm of the medial pterygoid muscle).\n\nPeritonsillar abscess (quinsy) is most common in 15-30 year olds. Most common causative organism is Group A Streptococcus (50%). Complications include aspiration pneumonia (spontaneous rupture), airway obstruction, lateral dissection into parapharyngeal/carotid space, bacteremia, and retropharyngeal abscess."
    difficulty: easy
    tags: [otolaryngology, peritonsillar-abscess, quinsy, pediatrics]
  - front: "How is peritonsillar abscess treated?"
    back: "Secure airway; surgical drainage (incision or needle aspiration with C&S); empiric PO antibiotics for 14-day course; IV penicillin G x10d if GAS on cultures; add PO/IV metronidazole or clindamycin x10d if Bacteroides positive; warm saline irrigation; consider elective tonsillectomy after resolution.\n\nTonsillectomy may be deferred until after a second episode. The recurrence rate of peritonsillar abscess after needle aspiration alone is higher than after tonsillectomy, but tonsillectomy carries surgical risks."
    difficulty: medium
    tags: [otolaryngology, peritonsillar-abscess, treatment, antibiotics]
  - front: "What are the absolute indications for tonsillectomy?"
    back: "Sleep-disordered breathing (most common); recurrent tonsillitis (second most common); tonsillar hypertrophy causing upper airway obstruction, OSA, severe dysphagia, or cardiopulmonary complications (cor pulmonale); suspicion of malignancy (lymphoma, SCC); orofacial/dental deformity; hemorrhagic tonsillitis.\n\nThe Paradise Criteria define relative indications: ≥7 tonsillitis episodes in past year, or ≥5 per year for 2 years, or ≥3 per year for 3 years, each with documented sore throat plus one of: fever >38.3°C, cervical adenopathy, tonsillar exudate, or positive GAS test."
    difficulty: medium
    tags: [otolaryngology, tonsillectomy, indications, pediatrics]
  - front: "What are the Paradise Criteria for tonsillectomy?"
    back: "Recurrent tonsillitis with: ≥7 episodes in the past year, OR ≥5 episodes per year for 2 years, OR ≥3 episodes per year for 3 years. Each episode must have documented sore throat with ≥1 of: temperature >38.3°C, cervical adenopathy, tonsillar exudate, or positive test for Group A β-hemolytic Streptococcus.\n\nThese are relative (not absolute) indications for tonsillectomy to reduce disease burden. The absolute most common indication is sleep-disordered breathing. Hemorrhage (primary within 24h, secondary within 7-10 days) is the major complication of tonsillectomy."
    difficulty: medium
    tags: [otolaryngology, tonsillectomy, Paradise-criteria, recurrent-tonsillitis]
  - front: "What is the most common cause of stridor in neonates/infants?"
    back: "Laryngomalacia — the most common cause of stridor in children\n\nLaryngomalacia results from supraglottic collapse during inspiration due to immature or floppy laryngeal cartilage. It typically worsens in the supine position and with feeding. Most cases resolve spontaneously by 12-18 months. Vocal cord palsy (birth trauma or Arnold-Chiari malformation) is the second most common cause."
    difficulty: easy
    tags: [otolaryngology, pediatrics, stridor, laryngomalacia, neonates]
  - front: "How does the quality and timing of stridor indicate the level of airway obstruction?"
    back: "Inspiratory stridor: vocal cords (glottis) or above (supraglottis). Biphasic stridor: glottis, subglottis, or extrathoracic trachea. Expiratory stridor: distal tracheobronchial tree.\n\nBody position is also informative: stridor worse prone suggests double aortic arch; worse supine suggests laryngomalacia or glossoptosis. Biphasic stridor indicates a fixed obstruction at or below the glottis and is more ominous than purely inspiratory stridor."
    difficulty: medium
    tags: [otolaryngology, pediatrics, stridor, airway-obstruction, differential-diagnosis]
  - front: "What is acute laryngotracheobronchitis (croup)? What is the most common cause?"
    back: "Croup = inflammation of subglottic space and tracheobronchial tree with mucosal swelling and thick mucopurulent exudate compromising upper airway. Most common cause: parainfluenza type I virus. Croup is the most common infectious cause of stridor in children.\n\nCroup affects children 6 months to 5 years, peaking in fall/winter. Classic presentation: preceded by URTI, worse at night, 'seal-bark' croupy cough, inspiratory or biphasic stridor, sternal/intercostal indrawing. 'Steeple sign' (narrow subglottis) on AP neck X-ray."
    difficulty: easy
    tags: [otolaryngology, pediatrics, croup, laryngotracheobronchitis, stridor]
  - front: "What is the treatment of croup (acute laryngotracheobronchitis)?"
    back: "Nebulized epinephrine q1-2h PRN (if severe, Westley Croup Score >2); systemic corticosteroids (dexamethasone 0.5 mg/kg or prednisone); humidified oxygen and hydration; close observation 3-4h; hospitalize if poor response after 4h with persistent stridor at rest; intubation if severe (use smaller ETT than expected for age).\n\nCorticosteroids reduce mucosal edema and are the mainstay of treatment for moderate-to-severe croup. Nebulized epinephrine provides rapid but transient relief (rebound effect possible). Recurrent croup should prompt evaluation for subglottic stenosis with bronchoscopy."
    difficulty: medium
    tags: [otolaryngology, pediatrics, croup, treatment, epinephrine, dexamethasone]
  - front: "How does acute epiglottitis differ from croup in clinical presentation?"
    back: "Epiglottitis: rapid onset, toxic-appearing, high fever, tripod posture, drooling, muffled voice, inspiratory stridor, slow breathing, dysphagia. No cough. 'Thumb sign' on lateral neck X-ray. Croup: gradual onset, less toxic, barking 'seal' cough, worse at night, 'steeple sign' on AP neck X-ray, supraglottis normal.\n\nThis is a classic MCCQE1 distinction. Epiglottitis is a medical emergency — do NOT examine the throat as it may precipitate complete obstruction. Ensure anesthesia/ENT present before any airway manipulation. Post-H. influenzae type B vaccine, causes now include S. pneumoniae, S. pyogenes, and S. aureus."
    difficulty: medium
    tags: [otolaryngology, pediatrics, epiglottitis, croup, differential-diagnosis, stridor]
  - front: "What is the treatment of acute epiglottitis?"
    back: "Secure airway (most critical — do NOT examine throat before preparation); IV access with hydration; IV antibiotics: cefuroxime, cefotaxime, or ceftriaxone for 10-14 days; moist air; extubate when epiglottic edema decreases (air leak around ETT) and patient is afebrile; watch for meningitis/sepsis.\n\nThe 'thumb sign' on lateral neck radiograph shows swollen epiglottis. Blood and pharyngeal cultures should be taken AFTER intubation. WBC is elevated. The condition was previously most common in children 1-4 years due to H. influenzae type B, but HiB vaccination has made this much less common."
    difficulty: medium
    tags: [otolaryngology, pediatrics, epiglottitis, treatment, airway, antibiotics]
  - front: "What are the contraindications to tonsillectomy?"
    back: "Relative contraindications: velopharyngeal insufficiency (overt or submucous cleft palate, impaired palatal function); hematologic (coagulopathy, anemia, hemophilia, leukemia, agranulocytosis); active local infection without urgent obstructive symptoms.\n\nTonsillectomy in patients with submucous cleft palate can unmask velopharyngeal insufficiency, leading to hypernasal speech and nasal regurgitation. In patients with coagulopathy, the risk of hemorrhage (primary within 24h or secondary within 7-10 days) is significantly increased."
    difficulty: medium
    tags: [otolaryngology, tonsillectomy, contraindications]
  - front: "What syndromes are associated with Eustachian tube dysfunction and recurrent AOM?"
    back: "Down syndrome (horizontal Eustachian tube position), Crouzon syndrome, cleft palate (even after repair), Apert syndrome, Kartagener syndrome (abnormal cilia). Also: CHARGE syndrome (associated with choanal atresia), Pierre-Robin sequence.\n\nEustachian tube dysfunction is the primary defect in AOM. At-risk populations include those with craniofacial abnormalities, immunodeficiencies, and ciliary dyskinesia syndromes. These children should be monitored closely for OME and may benefit from earlier consideration of tympanostomy tubes."
    difficulty: medium
    tags: [otolaryngology, AOM, Eustachian-tube, syndromes, pediatrics]
  - front: "What are the otoscopic findings that most reliably diagnose AOM?"
    back: "Bulging tympanic membrane (LR 51, 95% CI 36-73) is most reliable; cloudy TM (LR 34, 95% CI 28-42); immobile TM on pneumatic otoscopy (LR 31, 95% CI 26-37); erythematous TM (LR 8.4, 95% CI 7-11). Ear pain is the most reliable symptom.\n\nThe diagnosis of AOM in pediatrics requires both MEE/MEI AND acute onset symptoms. Ear tugging alone is not a reliable indicator of pathology. MEI on otoscopy includes a bulging TM with marked discolouration (hemorrhagic, red, grey, or yellow) with loss of bony landmarks."
    difficulty: medium
    tags: [otolaryngology, AOM, diagnosis, otoscopy, clinical-assessment]
  - front: "What is Grisel's syndrome and in what surgical context does it occur?"
    back: "Grisel's syndrome = atlantoaxial subluxation following head and neck surgery, particularly tonsillectomy. It is a rare complication.\n\nGrisel's syndrome occurs due to inflammatory ligamentous laxity from local infection or surgical trauma near the atlantoaxial joint. It presents with painful torticollis and limited neck motion post-operatively and requires prompt recognition and treatment."
    difficulty: hard
    tags: [otolaryngology, tonsillectomy, complications, Grisel-syndrome, atlantoaxial-subluxation]
  - front: "What are the indications for adenoidectomy?"
    back: "Chronic upper airway obstruction with sleep-disordered breathing/OSA + cor pulmonale; chronic nasopharyngitis resistant to medical treatment; chronic serous OM and chronic suppurative OM (with second set of tubes); recurrent AOM resistant to antibiotics; suspicion of nasopharyngeal malignancy; persistent rhinorrhea from nasal obstruction; persistent adenoiditis after two courses of antibiotics; hyponasal speech; dental malocclusion or orofacial growth disturbance.\n\nAdenoidectomy combined with tympanostomy tubes is recommended for recurrent AOM in children ≥4 years. Adenoidectomy alone is not recommended in children <4 years unless there is nasal obstruction or chronic adenoiditis. Contraindications include conditions increasing risk of velopharyngeal insufficiency."
    difficulty: medium
    tags: [otolaryngology, adenoidectomy, pediatrics, indications]
  - front: "What is the role of molecular testing in thyroid nodule evaluation?"
    back: "Molecular testing (mutational analysis including BRAF, RAS, microRNA classifiers) is used to distinguish 'high-risk' from 'low-risk' thyroid nodules in Bethesda category III (follicular lesion of undetermined significance) and category IV (follicular neoplasm) to determine whether surgical excision is needed.\n\nNuclear scanning has minimal value in thyroid nodule investigation. All patients with thyroid nodules require serum TSH and thyroid/neck ultrasound. TI-RADS guides FNA vs. ultrasound follow-up decisions. U/S-guided FNA should be used for repeat biopsy of initially non-diagnostic nodules."
    difficulty: medium
    tags: [otolaryngology, thyroid, molecular-testing, BRAF, FNA, nodule]
  - front: "What are the protective factors and modifiable risk factors for AOM in children?"
    back: "Protective factors: breastfeeding, xylitol. Modifiable risk factors: lack of breastfeeding, daycare attendance, household crowding, exposure to cigarette smoke/air pollution, pacifier use, vitamin A deficiency, cochlear implants.\n\nNon-modifiable risk factors include young age, family history of OM, prematurity, orofacial abnormalities, immunodeficiencies, Down syndrome, and lower SES. Breastfeeding provides passive immunity and optimal Eustachian tube positioning during feeding, reducing AOM risk."
    difficulty: easy
    tags: [otolaryngology, AOM, risk-factors, prevention, pediatrics]
  - front: "What are common causes of sudden-onset airway obstruction in infants?"
    back: "Foreign body aspiration, croup (viral laryngotracheobronchitis), bacterial tracheitis, caustic ingestion, epiglottitis.\n\nForeign body aspiration should always be considered in sudden-onset stridor in infants and toddlers, especially with a choking episode history. Bacterial tracheitis (Staphylococcal) can mimic croup but is more toxic-appearing and refractory to standard croup treatment."
    difficulty: easy
    tags: [otolaryngology, pediatrics, airway-obstruction, stridor, foreign-body]
  - front: "What is the treatment for medullary thyroid carcinoma and why is family screening important?"
    back: "Treatment: total thyroidectomy + median and/or lateral compartment neck dissection based on serum calcitonin levels; postoperative thyroxine; radiotherapy; screen relatives. Family screening important because medullary thyroid cancer is associated with MEN IIa and MEN IIb (RET proto-oncogene mutations) — hereditary in 25% of cases.\n\nMedullary thyroid carcinoma secretes calcitonin (diagnostic marker), prostaglandins, ACTH, serotonin, and kallikrein. MEN IIa includes MTC + pheochromocytoma + primary hyperparathyroidism. MEN IIb includes MTC + pheochromocytoma + mucosal neuromas + marfanoid habitus. Serum calcitonin is used for monitoring."
    difficulty: hard
    tags: [otolaryngology, thyroid, medullary-carcinoma, MEN, RET, treatment]
  - front: "What lymphoid tissues comprise Waldeyer's ring?"
    back: "Waldeyer's ring is an interrupted circle of protective lymphoid tissue at the upper ends of the respiratory and alimentary tracts, consisting of: pharyngeal tonsil (adenoid), tubal tonsils, palatine tonsils, and lingual tonsil (under mucosa of posterior 1/3 of tongue).\n\nWaldeyer's ring acts as the first line of immune defense at the pharyngeal inlet. Chronic inflammation or hypertrophy of any component can cause airway obstruction. Thyroid lymphoma arising in this ring has a strong association with Hashimoto thyroiditis."
    difficulty: easy
    tags: [otolaryngology, anatomy, tonsils, Waldeyer-ring, lymphoid-tissue]
  - front: "What is the Cotton-Myer grading system for subglottic stenosis?"
    back: "Grade I: ≤50% obstruction; Grade II: 51-70%; Grade III: 71-99%; Grade IV: no detectable lumen.\n\nThe Cotton-Myer grading system standardizes the degree of subglottic obstruction and guides management decisions, ranging from endoscopic dilation for mild stenosis to laryngotracheoplasty for severe cases."
    difficulty: easy
    tags: [otolaryngology, subglottic stenosis, airway, pediatrics]
  - front: "What is the most common cause of acquired subglottic stenosis?"
    back: "Prolonged or traumatic endotracheal intubation causing pressure necrosis and subsequent scar formation.\n\nEndotracheal intubation is the most common cause of acquired subglottic stenosis. Nasal intubation is less traumatic than oral intubation for long-term use because of differing tube orientation and less pressure on the subglottis. Stenosis risk is related to both duration of intubation and endotracheal tube size."
    difficulty: easy
    tags: [otolaryngology, subglottic stenosis, intubation, airway]
  - front: "Which syndromes are frequently associated with congenital subglottic stenosis?"
    back: "22q11 deletion (DiGeorge), Trisomy 21 (Down syndrome), and CHARGE syndrome.\n\nCongenital subglottic stenosis is defined as a subglottic diameter <4 mm in neonates or smaller than average for age. It is commonly associated with chromosomal or developmental syndromes, highlighting the importance of airway evaluation in these patients."
    difficulty: medium
    tags: [otolaryngology, subglottic stenosis, congenital, genetics]
  - front: "What are the clinical features of subglottic stenosis?"
    back: "Biphasic stridor, respiratory distress, and recurrent or prolonged croup.\n\nBiphasic stridor (both inspiratory and expiratory) reflects fixed airway obstruction at the subglottis. Recurrent croup should prompt evaluation for underlying subglottic stenosis, especially in young children with multiple croup episodes."
    difficulty: easy
    tags: [otolaryngology, subglottic stenosis, stridor, croup]
  - front: "How is subglottic stenosis treated based on stenosis characteristics?"
    back: "Soft stenosis: tissue division with knife or laser, balloon dilation + steroids. Firm stenosis: laryngotracheoplasty.\n\nThe consistency of the stenotic tissue determines treatment approach. Soft/mucosal stenosis responds to endoscopic techniques and steroids, while firm/cartilaginous stenosis requires open surgical reconstruction (laryngotracheoplasty) to provide a durable airway."
    difficulty: medium
    tags: [otolaryngology, subglottic stenosis, laryngotracheoplasty, treatment]
  - front: "What is the most common cause of inspiratory stridor in neonates?"
    back: "Laryngomalacia — congenital softening of tissues above the glottis causing collapse into the glottis on inspiration.\n\nLaryngomalacia accounts for approximately 60% of all cases of neonatal stridor. The immature laryngeal cartilage and poor supraglottic tone cause dynamic collapse of supraglottic structures during inspiration, producing characteristic high-pitched inspiratory stridor."
    difficulty: easy
    tags: [otolaryngology, laryngomalacia, stridor, neonates]
  - front: "Describe the pathophysiologic cycle in laryngomalacia that perpetuates airway obstruction."
    back: "Airway obstruction → supraglottic indrawing on inspiration → negative intrathoracic pressure → laryngopharyngeal reflux of acid → supraglottic edema → worsened obstruction.\n\nThis self-reinforcing cycle explains why PPI therapy is part of conservative management. By reducing acid reflux, PPIs decrease supraglottic edema, breaking the cycle and improving airway patency. This also explains why laryngomalacia often worsens postprandially."
    difficulty: medium
    tags: [otolaryngology, laryngomalacia, pathophysiology, acid reflux]
  - front: "What are the classic laryngoscopic findings in laryngomalacia?"
    back: "Omega-shaped epiglottis, short aryepiglottic folds, and redundant mucosa over the arytenoids.\n\nThese anatomical findings on flexible laryngoscopy confirm the diagnosis of laryngomalacia. The omega-shaped epiglottis and short aryepiglottic folds are the primary structural abnormalities; supraglottoplasty addresses these by dividing the short aryepiglottic folds and/or removing excess arytenoid mucosa."
    difficulty: easy
    tags: [otolaryngology, laryngomalacia, laryngoscopy, diagnosis]
  - front: "What is the natural history and initial management of laryngomalacia?"
    back: "Symptoms typically resolve spontaneously by 12-18 months in >90% of cases. Initial management: observation + PPI therapy.\n\nThe vast majority of laryngomalacia is self-limiting. PPIs break the acid-reflux cycle that promotes supraglottic edema. Surgical intervention (supraglottoplasty) is reserved for the ~10% with severe disease causing failure to thrive, significant feeding difficulties, or cyanotic episodes."
    difficulty: easy
    tags: [otolaryngology, laryngomalacia, management, PPI]
  - front: "Where does an ingested foreign body most commonly lodge in a child?"
    back: "At the cricopharyngeus muscle (upper esophageal sphincter).\n\nThe cricopharyngeus is the narrowest point of the esophagus and the most common site of food and foreign body impaction. Common objects include coins, toys, and batteries. Batteries require emergency removal due to their ability to erode through the esophagus via electrical and chemical injury."
    difficulty: easy
    tags: [otolaryngology, foreign body, pediatrics, esophagus]
  - front: "Why is a button battery ingestion a medical emergency compared to a coin?"
    back: "Button batteries can erode through the esophagus via electrical current and chemical injury; they appear as a 'halo sign' on X-ray (vs. single disc for coin) and must be urgently removed.\n\nEven a brief contact period allows button batteries to generate hydroxide at the negative pole via electrical current, causing liquefactive necrosis of esophageal tissue. Fatal complications (esophago-aortic fistula, tracheoesophageal fistula) can occur within hours. The double-ring or halo sign on X-ray distinguishes a battery from a coin."
    difficulty: medium
    tags: [otolaryngology, foreign body, button battery, emergency]
  - front: "Where does an aspirated foreign body most commonly lodge and why?"
    back: "Right main bronchus — because it is wider, shorter, and more vertical than the left main bronchus.\n\nThe anatomy of the right main bronchus (more vertical, wider, shorter) makes it the preferential path for aspirated foreign bodies. Right-sided aspiration causes unilateral 'asthma-like' symptoms — wheezing, decreased breath sounds — often leading to misdiagnosis. Complete occlusion can lead to atelectasis, lobar pneumonia, or pneumothorax."
    difficulty: easy
    tags: [otolaryngology, foreign body, aspiration, bronchus]
  - front: "What are the radiographic techniques used to evaluate suspected foreign body aspiration in children based on age?"
    back: "Older child (stable): inspiratory AND expiratory chest X-ray. Younger child: right and left lateral decubitus chest X-rays (lack of lung deflation on dependent side suggests foreign body).\n\nAir trapping distal to an obstructing foreign body causes the affected lung to remain hyperinflated. In older cooperative children, expiratory films reveal unilateral hyperinflation. In young children who cannot cooperate, gravity-dependent decubitus views serve the same purpose — a normal lung should deflate when dependent, whereas an obstructed lung remains inflated."
    difficulty: medium
    tags: [otolaryngology, foreign body, radiology, chest X-ray]
  - front: "What is the definitive treatment for a suspected airway or esophageal foreign body?"
    back: "Bronchoscopy (airway) or esophagoscopy (esophageal) with removal. Patient must be kept NPO immediately.\n\nAny patient with suspected foreign body ingestion or aspiration should be made NPO immediately to prepare for potential procedural intervention. Rigid bronchoscopy or esophagoscopy under general anesthesia allows direct visualization and extraction."
    difficulty: easy
    tags: [otolaryngology, foreign body, bronchoscopy, esophagoscopy]
  - front: "What is the most common source of deep neck space infection in adults vs. children?"
    back: "Adults: mandibular dental infection (most common). Children: tonsillar infection (most common).\n\nDeep neck space infections are polymicrobial, involving mixed aerobes and anaerobes from the oral flora. Ludwig's angina is the prototypical deep neck infection involving the submandibular and sublingual spaces, typically arising from dental infections in adults."
    difficulty: easy
    tags: [otolaryngology, deep neck infection, Ludwigs angina, abscess]
  - front: "What is Ludwig's angina and what is its anatomical significance?"
    back: "Ludwig's angina is a rapidly progressive cellulitis/infection of the submandibular and sublingual spaces — the prototypical deep neck space infection, most commonly from dental sources.\n\nLudwig's angina can rapidly compromise the airway through floor-of-mouth elevation and tongue displacement. Airway management is the first priority. The infection is typically polymicrobial. CT with contrast aids in assessment, but imaging should be accompanied by the surgeon given risk of sudden airway loss."
    difficulty: medium
    tags: [otolaryngology, Ludwigs angina, deep neck infection, airway]
  - front: "What is the treatment triad for deep neck space infections?"
    back: "1) Secure the airway; 2) Source control (surgical drainage, tooth extraction, debridement); 3) Maximum-dose IV antimicrobials.\n\nThe airway must be secured first in deep neck space infections as progressive swelling can cause sudden airway loss — the worst scenario is losing the airway during imaging. Surgical drainage of fluctuant collections is essential as antibiotics alone are insufficient for established abscesses."
    difficulty: easy
    tags: [otolaryngology, deep neck infection, treatment, airway]
  - front: "What is the clinical warning about imaging in deep neck space infections?"
    back: "Investigations (CT/MRI) should be obtained carefully with the surgeon accompanying the patient, as the worst place to lose an airway is during imaging.\n\nDeep neck space infections can cause rapid airway deterioration. The surgeon should accompany the patient to radiology to manage potential acute airway compromise. If airway compromise is imminent, securing the airway takes priority over imaging."
    difficulty: medium
    tags: [otolaryngology, deep neck infection, airway management, clinical pearls]
  - front: "What is rhinitis medicamentosa and which nasal decongestants cause it?"
    back: "Rhinitis medicamentosa is rebound nasal congestion/decongestant addiction from prolonged use (>5 days) of topical decongestants such as xylometazoline (Otrivin) and oxymetazoline (Dristan).\n\nTopical alpha-adrenergic decongestants cause vasoconstriction of nasal mucosa. With prolonged use, rebound vasodilation occurs upon drug withdrawal, causing worsening congestion. Treatment is gradual cessation, sometimes with topical nasal steroids. Short-term use (<5 days) is recommended to avoid this complication."
    difficulty: easy
    tags: [otolaryngology, rhinitis medicamentosa, decongestants, nasal]
  - front: "What is an important caution for ipratropium bromide (Atrovent) nasal spray?"
    back: "Avoid spraying into eyes — can cause burning or precipitate narrow-angle glaucoma. Also causes increased epistaxis risk when combined with topical nasal steroids.\n\nIpratropium bromide is an anticholinergic used for vasomotor rhinitis. Its systemic anticholinergic effects (mydriasis, cycloplegia) can precipitate acute narrow-angle glaucoma if it contacts the eyes. The combination with nasal steroids increases epistaxis risk, requiring patient education."
    difficulty: medium
    tags: [otolaryngology, ipratropium, vasomotor rhinitis, drug safety]
  - front: "What is the key finding from the NEJM 2016 trial on AOM treatment duration in children aged 6-23 months?"
    back: "10 days of amoxicillin-clavulanate had more favourable outcomes (16% vs 34% clinical failure) than 5 days; no increase in adverse events or antimicrobial resistance with 10-day course.\n\nThis trial demonstrated that shortened courses of antibiotic therapy for AOM in young children (6-23 months) resulted in significantly higher clinical failure rates. Canadian and international guidelines support 10-day courses in this age group to optimize outcomes while limiting resistance."
    difficulty: medium
    tags: [otolaryngology, acute otitis media, antibiotic duration, evidence-based medicine]
  - front: "What did the PET-NECK trial (NEJM 2016) demonstrate about surveillance versus planned neck dissection in N2/N3 head and neck SCC?"
    back: "PET-CT-guided surveillance is non-inferior to planned neck dissection for overall survival in N2 or N3 SCC (2-year survival 84.9% vs 81.5%), with fewer operations.\n\nThe PET-NECK trial changed practice by supporting PET-CT surveillance at 12 weeks post-chemoradiotherapy instead of routine planned neck dissection. This avoids significant surgical morbidity in patients who achieve a complete response on imaging while maintaining equivalent survival outcomes."
    difficulty: medium
    tags: [otolaryngology, head and neck cancer, neck dissection, PET-CT]
  - front: "What did the CheckMate 141 trial demonstrate regarding nivolumab in head and neck SCC?"
    back: "Nivolumab resulted in longer median overall survival (7.5 mo vs 5.1 mo) than standard therapy in platinum-refractory recurrent SCC of the head and neck (HR 0.70, p=0.01).\n\nCheckMate 141 established nivolumab (anti-PD-1 immunotherapy) as a treatment option for platinum-refractory recurrent head and neck SCC. This was a landmark trial for immunotherapy in this setting and led to regulatory approval in Canada and internationally."
    difficulty: medium
    tags: [otolaryngology, head and neck cancer, nivolumab, immunotherapy, CheckMate 141]
  - front: "What did the elective vs. therapeutic neck dissection trial (NEJM 2015) show for node-negative oral cavity SCC?"
    back: "Elective (upfront) neck dissection had significantly better 3-year overall survival (80% vs 67.5%) and disease-free survival (69.5% vs 45.9%) compared to therapeutic (delayed) neck dissection.\n\nThis RCT demonstrated that elective neck dissection at the time of primary tumour resection leads to superior outcomes over watchful waiting with therapeutic neck dissection only when nodal disease becomes clinically apparent. This supports elective neck dissection as standard of care for T1/T2 node-negative oral SCC."
    difficulty: medium
    tags: [otolaryngology, oral cancer, neck dissection, evidence-based medicine]
  - front: "What were the key conclusions of the CHAT trial (NEJM 2013) regarding adenotonsillectomy for childhood OSA?"
    back: "In children aged 5-9 with OSA, adenotonsillectomy did NOT significantly improve attention or executive function, but DID significantly improve behaviour, quality of life, and polysomnographic findings (normalization: 79% vs 46%).\n\nThe CHAT trial is a landmark RCT showing that the primary neurocognitive outcomes (attention, executive function) were not significantly different at 7 months post-surgery versus watchful waiting, but subjective measures and polysomnography improved. This informs shared decision-making about adenotonsillectomy in school-age children."
    difficulty: medium
    tags: [otolaryngology, obstructive sleep apnea, adenotonsillectomy, CHAT trial]
  - front: "What does the KATE trial conclude about adenotonsillectomy for mild vs. moderate OSA in young children (ages 2-4)?"
    back: "Children with MILD OSA (ages 2-4): watchful waiting may suffice. Children with MODERATE OSA: adenotonsillectomy should be considered (meaningful OAHI improvement: -3.1 vs -1.0).\n\nThe KATE trial provides evidence for stratifying surgical intervention by OSA severity in very young children. While mild OSA may resolve with watchful waiting, moderate OSA shows a clinically meaningful benefit from adenotonsillectomy, guiding Canadian paediatric otolaryngology practice."
    difficulty: medium
    tags: [otolaryngology, pediatric OSA, adenotonsillectomy, KATE trial]
  - front: "What is ciprofloxacin's important safety consideration in children regarding musculoskeletal effects?"
    back: "Animal studies suggest systemic quinolones may cause cartilage necrosis (arthropathy) in children; use with caution.\n\nFluoroquinolones cause arthropathy in juvenile animal studies, raising concerns about use in pediatric populations. In otolaryngology, ciprofloxacin otic drops (Ciprodex) are used topically for otitis externa and complications of otitis media and are considered safe due to minimal systemic absorption, but systemic quinolones are used cautiously in children."
    difficulty: medium
    tags: [pharmacology, ciprofloxacin, pediatrics, drug safety]
  - front: "What complication is associated with erythromycin (systemic) use in the ear?"
    back: "Ototoxicity.\n\nErythromycin and other macrolides are associated with reversible sensorineural hearing loss, particularly at high systemic doses. This is relevant in ENT practice when erythromycin is used as a penicillin alternative. Erythromycin also commonly causes GI side effects (nausea, cramping) via motilin receptor agonism."
    difficulty: medium
    tags: [pharmacology, erythromycin, ototoxicity, otolaryngology]
  - front: "What is the risk of neomycin/polymyxin B/hydrocortisone (Cortisporin Otic) otic drops if placed in the inner ear?"
    back: "Risk of hearing loss (cochlear toxicity) if placed in the inner ear (i.e., if the tympanic membrane is perforated).\n\nAminoglycoside-containing otic drops (e.g., neomycin in Cortisporin) are contraindicated when the tympanic membrane is perforated due to potential ototoxicity from direct contact with inner ear structures. Ciprofloxacin otic drops (non-ototoxic) are preferred when a perforation is present."
    difficulty: medium
    tags: [pharmacology, otic drops, ototoxicity, tympanic membrane perforation]
  - front: "What is the mechanism of hydrocortisone and acetic acid (VoSol HC) otic drops?"
    back: "Bactericidal by lowering pH of the ear canal; used for otitis media.\n\nAcidic ear drops work by creating an environment hostile to bacterial growth. Most ear pathogens (including Pseudomonas) cannot survive in a low-pH environment. This mechanism is particularly useful in otitis media and otitis externa management when antibiotic resistance is a concern."
    difficulty: medium
    tags: [pharmacology, otic drops, otitis media, mechanism]
  - front: "What is the advantage of mometasone furoate (Nasonex) and fluticasone (Flonase) nasal sprays regarding systemic absorption?"
    back: "Flonase and Nasonex are NOT absorbed systemically, making them safer for long-term use in allergic rhinitis.\n\nMinimal systemic bioavailability (<1%) of these intranasal steroids reduces the risk of HPA axis suppression, growth effects in children, and other systemic corticosteroid side effects with long-term use. This is a key advantage over older intranasal steroids. Nasal steroids typically require up to 4 weeks of consistent use to achieve full therapeutic effect."
    difficulty: easy
    tags: [pharmacology, nasal sprays, allergic rhinitis, intranasal steroids]
  - front: "A 3-week-old infant presents with high-pitched inspiratory stridor that worsens with feeding and crying but improves in the prone position. Flexible laryngoscopy reveals an omega-shaped epiglottis and short aryepiglottic folds. What is the diagnosis and first-line management?"
    back: "Laryngomalacia. First-line management: observation and PPI therapy. >90% resolve by 12-18 months. Supraglottoplasty if severe (failure to thrive, cyanosis).\n\nThis clinical vignette is classic for laryngomalacia — the most common cause of stridor in neonates. Key features include: onset at 1-2 weeks, worsening with feeding/crying/supine position, characteristic laryngoscopic findings. PPIs address the acid reflux cycle. The prone position relieves obstruction by allowing the tongue and supraglottic structures to fall forward."
    difficulty: medium
    tags: [otolaryngology, laryngomalacia, stridor, clinical vignette]
  - front: "A 2-year-old presents to the ER with sudden onset coughing, wheeze, and decreased breath sounds on the right side without fever. What is the most likely diagnosis and next step?"
    back: "Aspirated foreign body in the right main bronchus. Next step: make NPO immediately; right and left decubitus chest X-rays (lack of deflation on dependent side suggests obstruction); urgent rigid bronchoscopy.\n\nThe classic triad of sudden onset, unilateral wheeze, and decreased breath sounds without fever in a toddler strongly suggests foreign body aspiration. The right main bronchus is most commonly affected. Absence of fever and elevated WBC differentiates from infectious causes. Rigid bronchoscopy is both diagnostic and therapeutic."
    difficulty: medium
    tags: [otolaryngology, foreign body aspiration, pediatrics, clinical vignette]
