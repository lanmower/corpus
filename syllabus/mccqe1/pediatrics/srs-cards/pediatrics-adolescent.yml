# Pediatrics Adolescent (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the HEEADSSS adolescent psychosocial assessment tool and what does each letter stand for?"
    back: "H – Home, E – Education/Employment, E – Eating, A – Activities, D – Drugs, S – Sexuality, S – Suicide/Depression, S – Safety/Violence.\n\nHEEADSSS is the standard framework for taking an adolescent psychosocial history in Canada. Confidentiality and its limits must be reviewed with the adolescent before taking the history. Clinicians should start with less sensitive topics (Home, Education) and progress to more sensitive ones (Drugs, Sexuality, Suicide). The CRAFFT screen is a validated tool used within the Drugs section."
    difficulty: easy
    tags: [pediatrics, adolescent medicine, HEEADSSS, psychosocial assessment]
  - front: "What are the Canadian age of consent rules for sexual activity, including close-age exceptions?"
    back: "Legal age of consent is 16 years. A youth 16–17 years CANNOT consent if the partner is in a position of trust/authority. Close-age exceptions: youth 14–15 years can consent if partner is less than 5 years older and there is no relationship of trust, authority, dependency, or exploitation. Youth 12–13 years can consent if partner is less than 2 years older and there is no such relationship.\n\nUnderstanding Canadian consent laws is mandatory for MCCQE1. These rules reflect the Criminal Code of Canada. Physicians must be able to identify when sexual activity constitutes a reportable offence, particularly when there is exploitation, a power imbalance, or the partner exceeds the close-age exception."
    difficulty: medium
    tags: [pediatrics, adolescent medicine, consent, sexual activity, legal]
  - front: "Describe the cognitive, psychosocial, and sexual developmental milestones of early (10–13 yr), middle (14–16 yr), and late (17–19 yr) adolescence."
    back: "Early: concrete thinking, unable to perceive long-term consequences, preoccupied with changing body, seeks same-sex peers, increased interest in sexual anatomy but limited dating. Middle: emergence of abstract thought, 'stereotypical adolescent,' intense peer group involvement, initiation of relationships and sexual activity, questions of sexual orientation. Late: future-oriented idealism, stable body image and firm identity, peers recede, focus on intimacy and stable relationships, consolidation of sexual identity.\n\nKnowing the stages of adolescent development helps clinicians tailor counselling, anticipatory guidance, and history-taking strategies. Middle adolescence is characterized by the most peer-driven behaviour and conflict over autonomy, while late adolescence is marked by greater independence and forward-thinking."
    difficulty: medium
    tags: [pediatrics, adolescent medicine, development, puberty]
  - front: "What is the CRAFFT screening tool and how is it administered?"
    back: "CRAFFT is a validated substance use screening tool for adolescents aged 12–21 years. Part A (last 12 months): Did you drink alcohol? Smoke cannabis/vape/inhale? Use anything else to get high? If YES to any → ask all 6 Part B questions. If NO to all → ask only Part B question 1. Part B (C=Car, R=Relax, A=Alone, F=Forget, F=Friends/Family, T=Trouble): ridden in a car driven by someone high/drunk; use to relax/fit in; use alone; forget things while using; family/friends say cut down; gotten in trouble while using.\n\nThe CRAFFT screen is the most commonly used adolescent substance use screening tool in Canada and aligns with the HEEADSSS framework. Two or more positive responses on Part B indicates high risk for substance use disorder. It is recommended for routine adolescent health visits."
    difficulty: medium
    tags: [pediatrics, adolescent medicine, CRAFFT, substance use, screening]
