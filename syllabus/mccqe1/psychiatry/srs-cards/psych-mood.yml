# Mood Disorders & Depression (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "A 34-year-old has depressed mood, anhedonia, hypersomnia, weight gain, fatigue, and poor concentration for 6 weeks. She denies suicidal ideation. DSM-5 criteria met. First-line treatment?"
    back: "Major Depressive Disorder (MDD); first-line: SSRI (escitalopram, sertraline, fluoxetine) or SNRI (venlafaxine, duloxetine) + psychotherapy (CBT is most evidence-based)\n\nCANMAT (Canadian Network for Mood and Anxiety Treatments) MDD Guidelines: SSRIs/SNRIs are first-line pharmacotherapy. CBT is equally effective as medication for mild-moderate MDD and prevents relapse. Combined pharmacotherapy + psychotherapy is superior to either alone."
    difficulty: medium
    tags: [major depressive disorder, SSRI, CBT, CANMAT, psychiatry]
  - front: "What are the DSM-5 diagnostic criteria for a major depressive episode?"
    back: "≥5 of 9 symptoms for ≥2 weeks, including EITHER depressed mood OR anhedonia: SIGECAPS — Sleep (insomnia/hypersomnia), Interest (loss of), Guilt (worthlessness), Energy (fatigue), Concentration, Appetite (change), Psychomotor (retardation/agitation), Suicidality — causing significant impairment\n\nMDD diagnosis requires: ≥5 symptoms, present most of the day nearly every day for ≥2 weeks, including depressed mood or anhedonia. Must cause significant distress/impairment. Rule out: substance use, medical conditions (hypothyroidism, Cushing), bereavement (can meet criteria for MDD)."
    difficulty: easy
    tags: [MDD criteria, SIGECAPS, DSM-5, major depressive episode, psychiatry]
  - front: "What is the approach when a patient with MDD fails to respond to the first SSRI after 6-8 weeks?"
    back: "Switch to another SSRI or different class (SNRI, bupropion, mirtazapine), or augment (add lithium, atypical antipsychotic — quetiapine or aripiprazole, or T3)\n\nCANMAT MDD guidelines: adequate trial is 4-8 weeks at therapeutic dose. Treatment failure: switch to another first-line agent or augment. Two failed trials = treatment-resistant depression (TRD). TRD options: lithium augmentation, atypical antipsychotic augmentation, ECT (most effective for TRD), esketamine nasal spray."
    difficulty: hard
    tags: [treatment-resistant depression, SSRI failure, augmentation, CANMAT, psychiatry]
  - front: "What is the duration of antidepressant treatment for a first MDD episode?"
    back: "Continue antidepressants for 6-12 months after full remission for a first episode; 2-3 years after 2 episodes; indefinite for 3+ episodes or high-risk features\n\nCANMAT guidelines: premature discontinuation is the most common cause of relapse. Taper slowly over 4 weeks minimum when discontinuing (avoid discontinuation syndrome: FINISH — Flu-like symptoms, Insomnia, Nausea, Imbalance, Sensory disturbances, Hyperarousal). Patient education is critical."
    difficulty: easy
    tags: [antidepressant duration, MDD relapse prevention, discontinuation syndrome, CANMAT, psychiatry]
  - front: "A 28-year-old woman has a history of MDD and asks about starting an antidepressant while planning to become pregnant. What is the appropriate approach?"
    back: "Discuss risks of untreated depression vs. medication risks; SSRIs are preferred if pharmacotherapy needed (most safety data); paroxetine: avoid (cardiac defects); sertraline: lowest risk; neonatal adaptation syndrome may occur\n\nCANMAT/SOGC guidelines: untreated maternal depression is associated with preterm birth, low birth weight, poor prenatal care. SSRI risk: neonatal adaptation syndrome (transient jitteriness, poor feeding) — not life-threatening. Persistent pulmonary hypertension of newborn: rare association with late pregnancy SSRI exposure."
    difficulty: hard
    tags: [antidepressants in pregnancy, SSRI, MDD in pregnancy, neonatal adaptation, SOGC, psychiatry]
  - front: "What is postpartum depression (PPD) and how is it different from baby blues?"
    back: "Baby blues: mild mood fluctuations within 3-5 days of delivery, resolving within 2 weeks; PPD: meets MDD criteria within 12 months of delivery, requires treatment (psychotherapy, SSRIs)\n\nSOGC/CANMAT guidelines recommend universal PPD screening (Edinburgh Postnatal Depression Scale, EPDS) at 6 weeks and 3 months postpartum. Score ≥13 suggests depression. SSRIs are safe with breastfeeding (sertraline has lowest breast milk transfer). Postpartum psychosis (rare 1-2/1000) is a medical emergency."
    difficulty: medium
    tags: [postpartum depression, PPD, Edinburgh scale, EPDS, SOGC, psychiatry]
  - front: "What is bipolar disorder type I and how does it differ from type II?"
    back: "Bipolar I: at least 1 manic episode (DSM-5: ≥1 week elevated/expansive/irritable mood + ≥3 DIGFAST symptoms); Bipolar II: recurrent MDD + hypomanic episodes (4-7 days, less severe, no psychosis or hospitalization needed)\n\nCANMAT Bipolar Guidelines: bipolar I has episodes of mania that may require hospitalization. Bipolar II is often misdiagnosed as recurrent depression (hypomania missed). Antidepressant monotherapy is contraindicated in bipolar disorder — can trigger mania or mixed states."
    difficulty: medium
    tags: [bipolar disorder, bipolar I, bipolar II, mania, hypomania, psychiatry]
  - front: "What is the DIGFAST mnemonic for manic symptoms?"
    back: "Distractibility, Irresponsibility/Impulsivity, Grandiosity, Flight of ideas, Activity (increased goal-directed), Sleep (decreased need), Talkativeness (pressured speech)\n\nDSM-5 manic episode: ≥7 days (or any duration if hospitalized) of elevated/expansive/irritable mood + ≥3 DIGFAST symptoms (≥4 if mood is irritable only). Psychotic features can occur in mania. Decreased need for sleep (not insomnia) is a key feature that distinguishes mania from MDD."
    difficulty: easy
    tags: [DIGFAST, mania, manic episode, bipolar disorder, psychiatry]
  - front: "What are the first-line mood stabilizers for bipolar disorder?"
    back: "Acute mania: lithium, valproate, or atypical antipsychotics (olanzapine, risperidone, quetiapine); Bipolar maintenance: lithium (most evidence), valproate, lamotrigine (especially for bipolar depression)\n\nCANMAT Bipolar Guidelines: lithium is the gold standard for long-term bipolar management, reducing suicide risk by 6x. Lamotrigine is preferred for bipolar depression (less risk of switching to mania vs. antidepressants). Combination therapy is often required."
    difficulty: easy
    tags: [mood stabilizers, lithium, valproate, lamotrigine, bipolar disorder, psychiatry]
  - front: "What is lithium toxicity and what are the signs?"
    back: "Mild (1.5-2.0 mmol/L): tremor, polyuria, nausea; Moderate (2.0-2.5 mmol/L): confusion, ataxia, coarse tremor; Severe (>2.5 mmol/L): seizures, coma, permanent neurological damage — treat with IV hydration, hold lithium, dialysis for severe toxicity\n\nLithium has a narrow therapeutic index (0.6-1.2 mmol/L). Toxicity precipitants: dehydration, NSAIDs, ACEi/diuretics (reduce renal clearance), sodium depletion. Monitor: lithium level (12h post-dose), TSH, BMP, renal function every 6 months."
    difficulty: hard
    tags: [lithium toxicity, lithium level, bipolar treatment, nephrotoxicity, psychiatry]
  - front: "What is dysthymia (persistent depressive disorder) and how is it managed?"
    back: "Persistent depressive disorder: depressed mood most of the day, more days than not, for ≥2 years with ≥2 additional symptoms (insomnia/hypersomnia, low energy, poor concentration, hopelessness) — less severe than MDD but more chronic\n\nCANMAT guidelines: dysthymia responds to the same treatments as MDD (SSRIs, SNRIs, CBT) but may require longer treatment duration. Double depression: MDD superimposed on dysthymia. Chronic depression has higher response rates with combined pharmacotherapy + psychotherapy."
    difficulty: easy
    tags: [dysthymia, persistent depressive disorder, CANMAT, chronic depression, psychiatry]
  - front: "What is the role of electroconvulsive therapy (ECT) in mood disorders?"
    back: "ECT is highly effective (80-90% response rate) for: treatment-resistant depression, severe MDD with psychosis, suicidal ideation with inability to wait for medications, bipolar depression, catatonia — fastest-acting treatment for severe MDD\n\nCANMAT guidelines: ECT is the most effective treatment for TRD. Main side effect: short-term anterograde and retrograde memory impairment (usually reversible). Conducted under general anesthesia. Maintenance ECT for prevention of relapse. No absolute contraindications."
    difficulty: medium
    tags: [ECT, electroconvulsive therapy, treatment-resistant depression, severe MDD, psychiatry]
  - front: "What screening tool is used for depression in Canada and what score indicates depression?"
    back: "PHQ-9 (Patient Health Questionnaire-9): score 0-27; 5-9 = mild, 10-14 = moderate, 15-19 = moderately severe, ≥20 = severe depression; score ≥10 is the standard clinical cutoff for probable MDD\n\nPHQ-9 is widely used in primary care and is validated in Canadian populations. CANMAT recommends routine depression screening with PHQ-2 (2 questions) and follow-up PHQ-9 if positive. EPDS for perinatal screening. PHQ-9 also used to monitor treatment response."
    difficulty: easy
    tags: [PHQ-9, depression screening, CANMAT, severity scale, psychiatry]
  - front: "What are the indications for hospitalization in MDD?"
    back: "Active suicidal ideation with plan/intent/means, psychotic depression, severe self-neglect (unable to care for self), inability to contract for safety, severe comorbidities requiring inpatient management\n\nCANMAT guidelines: involuntary hospitalization under provincial mental health acts when patient poses serious harm to self or others and lacks capacity or refuses voluntary admission. Least restrictive alternative should be considered — intensive outpatient, crisis beds, ACT teams."
    difficulty: medium
    tags: [hospitalization MDD, suicidal ideation, mental health act, inpatient psychiatry, psychiatry]
  - front: "What is seasonal affective disorder (SAD) and how is it treated?"
    back: "SAD: recurrent depressive episodes with seasonal pattern (fall/winter onset, spring remission); treat with bright light therapy (10,000 lux for 30 min/morning), SSRIs, CBT\n\nCANMAT guidelines: bright light therapy is first-line for SAD — equal efficacy to SSRIs with faster onset. Light therapy should be started in early fall before symptom onset. SSRIs (bupropion extended-release is specifically approved for SAD prevention). CBT adapted for SAD has lasting benefits."
    difficulty: medium
    tags: [seasonal affective disorder, SAD, light therapy, SSRIs, psychiatry]
  - front: "What are DSM-5 criteria for major depressive episode?"
    back: ">=5 of 9 criteria for >=2 weeks (must include depressed mood or anhedonia): SIGECAPS — Sleep, Interest, Guilt, Energy, Concentration, Appetite, Psychomotor, Suicidality\n\nPHQ-9 screens severity. Mild: psychotherapy. Moderate-severe: SSRI + psychotherapy. Treatment response assessed at 4-6 weeks. Minimum 6-12 months after remission."
    difficulty: medium
    tags: [MDE, DSM-5]
  - front: "What are the DSM-5 criteria for major depressive disorder?"
    back: ">=5 symptoms during the same 2-week period (must include depressed mood OR anhedonia): SIG-E-CAPS: Sleep changes, Interest loss (anhedonia), Guilt/worthlessness, Energy loss, Concentration difficulty, Appetite/weight change, Psychomotor agitation/retardation, Suicidal ideation. Causes significant distress or functional impairment. Not attributable to substance or medical condition.\n\nMDD affects ~5% of Canadians at any time. CANMAT (Canadian Network for Mood and Anxiety Treatments) guidelines are the standard for treatment in Canada. The diagnosis requires functional impairment-meeting symptom criteria alone is insufficient. Screen for bipolar before starting antidepressants."
    difficulty: medium
    tags: [MDD, DSM-5, SIG-E-CAPS, depression criteria, psychiatry]
  - front: "What is the PHQ-9 and how is it used in clinical practice?"
    back: "Patient Health Questionnaire-9: 9 items corresponding to DSM-5 depression criteria, each scored 0-3 (not at all to nearly every day). Total score 0-27. Severity: 0-4 minimal, 5-9 mild, 10-14 moderate, 15-19 moderately severe, 20-27 severe. Item 9 specifically screens for suicidal ideation.\n\nPHQ-9 is widely used in Canadian primary care for depression screening and monitoring treatment response. A decrease of >=5 points indicates clinically meaningful improvement. CTFPHC recommends against universal depression screening in primary care, but targeted screening with PHQ-9 is appropriate for at-risk populations."
    difficulty: medium
    tags: [PHQ-9, depression screening, monitoring, psychiatry]
  - front: "What is the CANMAT first-line pharmacological treatment for MDD?"
    back: "First-line: SSRIs (escitalopram, sertraline, fluoxetine), SNRIs (venlafaxine, duloxetine), bupropion, mirtazapine. Second-line: TCAs, quetiapine XR, trazodone. Third-line: MAOIs, lithium augmentation. Choice based on: side effect profile, comorbidities, prior response, drug interactions. Adequate trial: therapeutic dose for 4-8 weeks.\n\nCANMAT 2023 guidelines recommend SSRIs/SNRIs as first-line due to efficacy, tolerability, and safety in overdose. Escitalopram and sertraline have best overall evidence. Bupropion is preferred when sexual dysfunction, weight gain, or smoking cessation are concerns. Start low, titrate to therapeutic dose."
    difficulty: hard
    tags: [antidepressant, SSRI, SNRI, CANMAT, treatment, psychiatry]
  - front: "What are the key side effects of common antidepressant classes?"
    back: "SSRIs: GI (nausea, diarrhea), sexual dysfunction (30-50%), weight gain, hyponatremia (SIADH, especially elderly), serotonin syndrome, increased suicidality in <25 (black box warning). SNRIs: same as SSRIs + elevated BP (venlafaxine), discontinuation syndrome. Bupropion: insomnia, seizure risk (dose-dependent, CI if eating disorder/seizures), NO sexual dysfunction. Mirtazapine: sedation, weight gain, NO sexual dysfunction. TCAs: anticholinergic, orthostatic hypotension, cardiac toxicity in overdose (QRS widening).\n\nCANMAT considers side effect profiles in treatment selection. Serotonin syndrome (hyperthermia, rigidity, clonus, agitation) is a medical emergency-stop offending agent, cyproheptadine. SSRI discontinuation syndrome (dizziness, nausea, paresthesias) is most common with paroxetine and venlafaxine due to short half-lives."
    difficulty: hard
    tags: [antidepressant side effects, SSRI, TCA, pharmacology, psychiatry]
  - front: "What are the DSM-5 criteria for bipolar I vs bipolar II disorder?"
    back: "Bipolar I: >=1 manic episode (>=7 days or any duration if hospitalized: elevated/expansive/irritable mood + increased energy + >=3 of: decreased sleep, talkativeness, racing thoughts, distractibility, increased goal-directed activity, risky behavior). Bipolar II: >=1 hypomanic episode (>=4 days, same symptoms but less severe, no psychosis, no hospitalization) + >=1 major depressive episode.\n\nBipolar I does NOT require a depressive episode for diagnosis-mania alone suffices. Bipolar II is not milder than bipolar I; patients spend more time depressed and have high suicide risk. CANMAT emphasizes screening for bipolarity before starting antidepressants (antidepressant monotherapy can trigger mania)."
    difficulty: hard
    tags: [bipolar disorder, mania, hypomania, DSM-5, psychiatry]
  - front: "What is the pharmacological management of bipolar disorder (acute mania and maintenance)?"
    back: "Acute mania: lithium or valproate (first-line mood stabilizers) + atypical antipsychotic (quetiapine, risperidone, olanzapine, aripiprazole) for acute stabilization. Bipolar depression: quetiapine monotherapy (first-line), lamotrigine, lithium, or lurasidone. Maintenance: lithium (gold standard, reduces suicide), valproate, quetiapine, lamotrigine. AVOID: antidepressant monotherapy (triggers mania/rapid cycling).\n\nCANMAT bipolar guidelines recommend mood stabilizers as backbone therapy. Lithium requires monitoring: levels (0.6-1.2 mmol/L), renal function, TSH, calcium q6-12 months. Lithium has narrow therapeutic index-toxicity: coarse tremor, ataxia, confusion, renal failure. Valproate: monitor LFTs, CBC, levels."
    difficulty: hard
    tags: [bipolar treatment, lithium, mood stabilizer, CANMAT, psychiatry]
  - front: "What lithium monitoring is required and what are the signs of toxicity?"
    back: "Monitoring: serum lithium levels (12h post-dose, target 0.6-1.2 mmol/L for acute, 0.6-0.8 for maintenance), creatinine/eGFR q6-12mo, TSH q6-12mo (causes hypothyroidism 20%), calcium/PTH (hyperparathyroidism), pregnancy test (Ebstein anomaly risk). Toxicity: mild (1.5-2.0): coarse tremor, GI, lethargy. Moderate (2.0-2.5): confusion, myoclonus, hyperreflexia. Severe (>2.5): seizures, coma, renal failure, cardiac arrhythmia.\n\nLithium has the strongest evidence for reducing suicide in bipolar disorder. Common precipitants of toxicity: dehydration, NSAIDs, ACE inhibitors, thiazides (all increase lithium levels). Management of toxicity: stop lithium, IV fluids, hemodialysis if severe (>2.5 mmol/L or severe symptoms)."
    difficulty: hard
    tags: [lithium monitoring, toxicity, bipolar, psychiatry]
  - front: "What are the features and management of serotonin syndrome?"
    back: "Triad: altered mental status, autonomic instability (hyperthermia, diaphoresis, tachycardia, HTN), neuromuscular excitability (clonus-especially lower extremity, hyperreflexia, rigidity). Caused by serotonergic drug combinations (SSRI + MAOI most dangerous, also tramadol, linezolid, triptans). Management: stop offending agents, IV fluids, benzodiazepines, cyproheptadine (serotonin antagonist) 12mg then 4mg q2h, active cooling.\n\nSerotonin syndrome is distinct from neuroleptic malignant syndrome (NMS): SS has clonus/hyperreflexia and rapid onset; NMS has lead-pipe rigidity and slow onset. Hunter Serotonin Toxicity Criteria: clonus (spontaneous or inducible) is the most important diagnostic feature. Canadian guidelines mandate 14-day washout between MAOI and SSRI."
    difficulty: hard
    tags: [serotonin syndrome, drug interaction, emergency, psychiatry]
  - front: "What is the approach to treatment-resistant depression (TRD)?"
    back: "Definition: failure to respond to >=2 adequate antidepressant trials. CANMAT approach: (1) Optimize current therapy (dose, duration, adherence). (2) Switch within or between classes. (3) Augment: lithium, atypical antipsychotic (aripiprazole, quetiapine), thyroid hormone (T3). (4) Combination: SSRI + bupropion or mirtazapine. (5) Esketamine nasal spray (approved in Canada). (6) ECT (most effective treatment for severe TRD, catatonia, psychotic depression).\n\nECT has 50-70% response rate in TRD and is the most effective acute treatment for severe depression. Canadian guidelines support ECT availability as an essential psychiatric service. Esketamine (Spravato) is available in Canada under restricted access programs. Repetitive TMS is another option for TRD."
    difficulty: hard
    tags: [treatment-resistant depression, augmentation, ECT, CANMAT, psychiatry]
  - front: "What are the risk factors and features of postpartum depression vs postpartum psychosis?"
    back: "PPD: onset within 4 weeks to 12 months postpartum, features of MDD, may include anxiety, guilt about parenting, thoughts of harming infant. Risk factors: prior depression, poor social support, unplanned pregnancy. Postpartum psychosis: RARE (1/1000), onset within first 2 weeks, features: confusion, disorganized behavior, mood lability, hallucinations/delusions. Psychiatric EMERGENCY-risk of infanticide.\n\nSOGC and CPS recommend Edinburgh Postnatal Depression Scale (EPDS) screening. Score >=13 warrants further assessment. PPD treated with SSRIs (sertraline safe in breastfeeding) + psychotherapy. Postpartum psychosis requires hospitalization, antipsychotics, mood stabilizers. History of bipolar is the strongest risk factor for postpartum psychosis."
    difficulty: hard
    tags: [postpartum depression, postpartum psychosis, EPDS, psychiatry]
  - front: "What is the role of psychotherapy in mood disorders?"
    back: "CBT (cognitive behavioral therapy): first-line for mild-moderate MDD, equivalent to antidepressants. IPT (interpersonal therapy): effective for MDD. DBT (dialectical behavior therapy): borderline personality disorder, chronic suicidality. CANMAT recommends combined pharmacotherapy + psychotherapy for moderate-severe MDD (superior to either alone). Mindfulness-based cognitive therapy: reduces relapse in recurrent depression.\n\nCANMAT guidelines recommend psychotherapy as first-line for mild depression and combined with pharmacotherapy for moderate-severe. Access to psychotherapy in Canada is limited-many provinces lack public funding. Online CBT programs (e.g., BounceBack) are increasingly available across Canada."
    difficulty: medium
    tags: [psychotherapy, CBT, mood disorders, CANMAT, psychiatry]
  - front: "What is the definition and management of persistent depressive disorder (dysthymia)?"
    back: "DSM-5: depressed mood most of the day, more days than not, for >=2 years (1 year in children/adolescents) + >=2 of: appetite change, sleep change, low energy, low self-esteem, poor concentration, hopelessness. Never symptom-free for >2 months. May coexist with MDD episodes (double depression).\n\nPersistent depressive disorder (formerly dysthymia) has lower symptom severity but longer duration, causing significant cumulative impairment. Treatment combines antidepressants + psychotherapy (CBT or CBASP). CANMAT recommends same antidepressant choices as MDD."
    difficulty: medium
    tags: [dysthymia, persistent depressive disorder, DSM-5, psychiatry]
  - front: "What medical conditions should be excluded in the differential diagnosis of depression?"
    back: "Hypothyroidism, Cushing syndrome, Addison disease, hyperparathyroidism, B12/folate deficiency, anemia, sleep apnea, chronic pain, cancer (particularly pancreatic), neurological disease (Parkinson, MS, dementia, stroke), medications (beta-blockers, corticosteroids, interferon, isotretinoin, oral contraceptives), substance use (alcohol, benzodiazepine withdrawal).\n\nCANMAT recommends baseline investigations for new MDD diagnosis: TSH, CBC, electrolytes, glucose, B12 if risk factors. Medical conditions causing depressive symptoms should be treated before attributing to primary MDD. Depression is also highly comorbid with chronic medical conditions."
    difficulty: medium
    tags: [depression differential, medical causes, organic, psychiatry]
  - front: "When should antidepressant discontinuation be considered and how?"
    back: "After first episode: continue for 6-12 months after remission. After 2+ episodes or chronic: consider indefinite treatment. Discontinuation: taper gradually over 4+ weeks (longer for paroxetine, venlafaxine). Discontinuation syndrome: dizziness, nausea, anxiety, insomnia, electric shock sensations (brain zaps), irritability. Onset 1-3 days, lasts 1-2 weeks. Fluoxetine has lowest risk due to long half-life.\n\nCANMAT recommends gradual taper to minimize discontinuation syndrome. Relapse risk is highest in the first 6 months after stopping. Shared decision-making about duration. Canadian primary care guidelines recommend monitoring for relapse during and after taper."
    difficulty: medium
    tags: [antidepressant discontinuation, taper, maintenance therapy, psychiatry]
  - front: "What is seasonal affective disorder (SAD) and its treatment?"
    back: "DSM-5: recurrent MDD with regular seasonal pattern (typically fall/winter onset, spring/summer remission) for >=2 years. More prevalent in northern latitudes (relevant to Canada). First-line treatment: light therapy (10,000 lux for 30 min/day in morning, within 1 hour of waking). Also effective: SSRIs (fluoxetine), bupropion (prophylactic starting in fall), CBT.\n\nSAD is particularly relevant in Canadian practice given latitude. Light therapy has rapid onset (1-2 weeks). Bupropion XR started in autumn prevents SAD episodes (Modell et al). CANMAT includes light therapy as first-line treatment for SAD, equivalent to pharmacotherapy."
    difficulty: medium
    tags: [SAD, seasonal affective disorder, light therapy, psychiatry]
  - front: "What is the approach to treatment-resistant depression?"
    back: "After 2 adequate SSRI/SNRI trials (>=6 weeks each): augment with lithium or atypical antipsychotic (aripiprazole/quetiapine), switch class, consider ECT, ketamine/esketamine, or combination therapy\n\nCANMAT guidelines. ECT most effective treatment for severe/psychotic depression (70-90% response). rTMS for moderate treatment resistance. Psychotherapy (CBT) should continue throughout. Psilocybin therapy emerging."
    difficulty: hard
    tags: [TRD, depression, treatment]
  - front: "What are the medical complications of anorexia nervosa requiring admission?"
    back: "HR <50, BP <90/60, temp <36C, BMI <15, electrolyte abnormalities (hypokalemia, hypophosphatemia), arrhythmia, suicidality, failed outpatient treatment\n\nRefeeding syndrome: rapid reintroduction of nutrition causes intracellular shift of phosphate, potassium, magnesium. Complications: cardiac failure, seizures, death. Prevention: start low (10-20kcal/kg), supplement phosphate, monitor daily."
    difficulty: hard
    tags: [anorexia, refeeding syndrome]
  - front: "What are the DSM-5 diagnostic criteria for anorexia nervosa?"
    back: "1) Restriction of energy intake leading to significantly low body weight (BMI <18.5 in adults); 2) Intense fear of gaining weight or persistent behavior interfering with weight gain; 3) Disturbance in body image or persistent lack of recognition of seriousness of low weight. Subtypes: restricting type vs binge-eating/purging type.\n\nDSM-5 removed the amenorrhea criterion. Anorexia nervosa has the highest mortality of any psychiatric disorder (~5-10%). Canadian Practice Guidelines (CPA) emphasize early intervention and multidisciplinary care including psychiatry, medicine, and dietetics."
    difficulty: medium
    tags: [anorexia nervosa, DSM-5, eating disorders, psychiatry]
  - front: "A 17-year-old female with anorexia nervosa (BMI 14) presents with bradycardia (HR 42), hypothermia, and lanugo hair. What medical complications should you assess for?"
    back: "Cardiac: bradycardia, QTc prolongation, mitral valve prolapse, cardiac arrest; Metabolic: hypoglycemia, electrolyte abnormalities (hypokalemia, hypophosphatemia, hypomagnesemia); Endocrine: amenorrhea, low estrogen, osteoporosis, euthyroid sick syndrome; Hematologic: pancytopenia; GI: gastroparesis, constipation, superior mesenteric artery syndrome; Dermatologic: lanugo, hair loss, dry skin.\n\nBradycardia <50 bpm is an indication for medical admission per Canadian guidelines. Osteoporosis risk increases significantly after 6 months of amenorrhea. QTc prolongation increases sudden cardiac death risk — obtain ECG on all patients with severe anorexia."
    difficulty: hard
    tags: [anorexia nervosa, medical complications, bradycardia, osteoporosis, lanugo, psychiatry]
  - front: "What is refeeding syndrome, its pathophysiology, and how do you prevent it?"
    back: "Refeeding syndrome: potentially fatal shifts in fluids and electrolytes when malnourished patients receive nutritional repletion. Pathophysiology: refeeding causes insulin surge → intracellular shift of phosphate, potassium, magnesium → severe hypophosphatemia (hallmark), hypokalemia, hypomagnesemia → cardiac arrhythmias, respiratory failure, rhabdomyolysis, delirium, death. Prevention: start low calorie refeeding (10-20 kcal/kg/day), supplement phosphate/K/Mg prophylactically, monitor electrolytes BID for first week.\n\nHypophosphatemia is the hallmark of refeeding syndrome — phosphate is required for ATP synthesis, and its depletion causes multiorgan failure. NICE guidelines recommend identifying high-risk patients (BMI <16, >15 days minimal intake). Canadian eating disorder programs typically start at 1200-1500 kcal/day and increase by 200-300 kcal every 2-3 days."
    difficulty: hard
    tags: [refeeding syndrome, hypophosphatemia, anorexia nervosa, nutrition, psychiatry]
  - front: "What are the DSM-5 criteria for bulimia nervosa and the key differences between purging and non-purging subtypes?"
    back: "DSM-5: 1) Recurrent binge eating (large amount in discrete period with sense of loss of control); 2) Recurrent compensatory behaviors to prevent weight gain; 3) Both occur at least once/week for 3 months; 4) Self-evaluation unduly influenced by body shape/weight; 5) Not exclusively during anorexia nervosa episodes. Purging type: self-induced vomiting, laxatives, diuretics. Non-purging type: fasting, excessive exercise.\n\nUnlike anorexia, patients with bulimia are typically normal weight or overweight, making it harder to detect. The purging subtype is more common and associated with more medical complications. CPA guidelines recommend CBT as first-line treatment, with fluoxetine (60 mg) as adjunct."
    difficulty: medium
    tags: [bulimia nervosa, DSM-5, purging, eating disorders, psychiatry]
  - front: "What is Russell's sign, and what metabolic and dental complications are characteristic of bulimia nervosa?"
    back: "Russell's sign: calluses/scarring on dorsum of hand from repeated self-induced vomiting (teeth scraping knuckles). Metabolic: hypochloremic hypokalemic metabolic alkalosis (from vomiting — loss of HCl and K+); hyponatremia if water loading. Dental: perimolysis (erosion of dental enamel, especially lingual surfaces of upper teeth), parotid gland enlargement (sialadenosis), dental caries.\n\nMetabolic alkalosis with hypokalemia in a young person should raise suspicion for purging behavior. Parotid enlargement is bilateral and painless, developing 3-4 days after binge-purge episodes. Canadian dentists are trained to screen for eating disorders based on enamel erosion patterns."
    difficulty: medium
    tags: [Russell sign, bulimia nervosa, metabolic alkalosis, dental erosion, psychiatry]
  - front: "What are the DSM-5 criteria for binge eating disorder (BED) and its evidence-based treatments?"
    back: "DSM-5: Recurrent binge eating episodes (at least once/week for 3 months) with 3+ of: eating rapidly, eating until uncomfortably full, eating large amounts when not hungry, eating alone due to embarrassment, feeling disgusted/depressed/guilty afterward. Marked distress about binging. NO compensatory behaviors. Treatment: CBT (first-line), lisdexamfetamine (Vyvanse — only medication with Health Canada approval for moderate-severe BED), topiramate, SSRIs.\n\nBED is the most common eating disorder. Lisdexamfetamine (30-70 mg/day) reduces binge days per week but is a controlled substance with abuse potential. CBT for BED has strong evidence and is recommended as first-line by CPA. Unlike bulimia, fluoxetine is not specifically indicated for BED."
    difficulty: medium
    tags: [binge eating disorder, CBT, lisdexamfetamine, eating disorders, psychiatry]
  - front: "A patient with anorexia nervosa (BMI 13.5) is being re-fed in hospital. On day 3, she develops confusion, tachycardia, and respiratory distress. Labs show phosphate 0.3 mmol/L (normal 0.8-1.5). What is the diagnosis and immediate management?"
    back: "Refeeding syndrome with severe hypophosphatemia. Immediate management: 1) IV phosphate replacement (20-40 mmol over 6-12h with cardiac monitoring); 2) Reduce caloric intake by 50%; 3) Check and correct K+ and Mg2+; 4) Continuous cardiac monitoring (risk of arrhythmias); 5) Check thiamine level and supplement (250-300 mg IV before refeeding); 6) Gradual caloric increase once electrolytes stabilize.\n\nThiamine deficiency can precipitate Wernicke encephalopathy during refeeding — always supplement thiamine before carbohydrate reintroduction. Severe hypophosphatemia (<0.3 mmol/L) can cause cardiac arrest, respiratory failure from diaphragm weakness, and seizures. Canadian hospital protocols mandate BID electrolyte monitoring during initial refeeding."
    difficulty: hard
    tags: [refeeding syndrome, hypophosphatemia, thiamine, anorexia nervosa, emergency management, psychiatry]
  - front: "What are the medical stabilization criteria for inpatient admission of a patient with an eating disorder?"
    back: "Admit if any of: HR <50 bpm (or <40 at night); systolic BP <90 mmHg; orthostatic changes (HR increase >20, SBP drop >20); temperature <35.5°C; BMI <15 (adults) or <75% median BMI (adolescents); severe electrolyte abnormalities (K+ <3.0, phosphate <0.8); QTc >450 ms; acute medical complications (syncope, seizures, cardiac failure); suicidal ideation; failed outpatient treatment.\n\nThese criteria are based on Canadian and APA guidelines for medical stabilization. Orthostatic vital signs are critical — perform lying-to-standing vitals on all eating disorder patients. Adolescents may have rapid medical deterioration even at higher BMI due to the rate and percentage of weight loss."
    difficulty: hard
    tags: [eating disorders, admission criteria, medical stabilization, bradycardia, psychiatry]
  - front: "What electrolyte abnormality pattern distinguishes vomiting from laxative abuse in eating disorders?"
    back: "Vomiting: hypochloremic hypokalemic metabolic ALKALOSIS (loss of HCl from stomach); urine chloride <25 mmol/L (chloride-responsive). Laxative abuse: hypokalemic metabolic ACIDOSIS (or normal pH) with non-anion gap (loss of bicarbonate from GI tract); may also see hyponatremia and dehydration. Diuretic abuse: hypokalemic metabolic alkalosis similar to vomiting, but urine chloride >40 mmol/L.\n\nUrine chloride helps distinguish vomiting (low urine Cl) from diuretic abuse (high urine Cl) when both present with metabolic alkalosis. Laxative abuse can be confirmed with urine laxative screen. Canadian eating disorder programs routinely check urine electrolytes and laxative screens in suspected purging."
    difficulty: hard
    tags: [eating disorders, metabolic alkalosis, metabolic acidosis, purging, electrolytes, psychiatry]
  - front: "What is the evidence-based pharmacotherapy for eating disorders and which eating disorder responds best to medication?"
    back: "Anorexia nervosa: NO medication has strong evidence for weight restoration; olanzapine may modestly help with weight gain and anxiety. Bulimia nervosa: fluoxetine 60 mg/day (only FDA/Health Canada-approved medication — higher dose than for depression). BED: lisdexamfetamine (Health Canada approved), also CBT first-line. SSRIs and topiramate have some evidence for BED. Bulimia responds best to combined pharmacotherapy + psychotherapy.\n\nFluoxetine at 60 mg (not 20 mg) is specifically effective for bulimia — this higher dose is a common exam question. For anorexia, nutritional rehabilitation is the cornerstone; medications address comorbid conditions. CPA guidelines emphasize that psychotherapy (especially CBT) remains the gold standard across all eating disorders."
    difficulty: medium
    tags: [eating disorders, fluoxetine, pharmacotherapy, CBT, psychiatry]
  - front: "What is the recommended approach to lithium management in bipolar disorder?"
    back: "Target serum level 0.6-0.8 mmol/L for maintenance, 0.8-1.2 for acute mania. Monitoring: serum lithium (5-7 days after dose change, then q3-6 months), TSH and creatinine q6 months, calcium annually, ECG at baseline. Ensure adequate hydration. Avoid NSAIDs, ACEi/ARBs, thiazides (increase lithium levels).\n\nCANMAT guidelines recommend lithium as first-line maintenance for bipolar I disorder — it is the only mood stabilizer with proven anti-suicide benefit. Narrow therapeutic index requires careful monitoring. Lithium toxicity presents with tremor, GI symptoms, ataxia, and can progress to seizures, coma, and death. Pregnancy: associated with Ebstein anomaly (low absolute risk ~0.1%)."
    difficulty: hard
    tags: [lithium, bipolar, monitoring, therapeutic-level, CANMAT]
  - front: "What are the key monitoring parameters for valproate in bipolar disorder?"
    back: "Target level 350-700 mcmol/L. Monitor: LFTs at baseline and periodically, CBC with platelets (thrombocytopenia risk), weight, lipid panel (metabolic effects), serum level. Valproate is CONTRAINDICATED in women of childbearing potential unless no alternative (NTD risk 1-2%, IQ reduction). Requires effective contraception.\n\nCANMAT and Health Canada emphasize avoiding valproate in women who may become pregnant. It is classified as teratogenic with dose-dependent NTD risk. If used, folic acid 5 mg daily is mandatory. Polycystic ovary syndrome is associated with valproate use. Pancreatitis and hepatotoxicity are rare but serious adverse effects."
    difficulty: medium
    tags: [valproate, bipolar, teratogenicity, monitoring, CANMAT]
  - front: "What defines treatment-resistant depression (TRD) and what are the management options?"
    back: "TRD: failure to respond to >=2 adequate antidepressant trials (adequate dose for >=6-8 weeks each) from different classes. Options: augmentation with lithium, atypical antipsychotic (aripiprazole, quetiapine), or thyroid hormone (T3). Switching strategies: different class SSRI->SNRI->TCA. ECT for severe TRD. Esketamine nasal spray (Spravato) is Health Canada-approved.\n\nCANMAT 2016 guidelines recommend systematic approach: optimize current medication, then switch or augment. ~30% of MDD is treatment-resistant. Psychotherapy (CBT) combined with pharmacotherapy improves outcomes. Esketamine was approved in Canada in 2020 — administered under supervision due to dissociative effects and abuse potential."
    difficulty: hard
    tags: [TRD, treatment-resistant, augmentation, ECT, esketamine]
  - front: "What are the indications for electroconvulsive therapy (ECT)?"
    back: "Severe depression with psychotic features, treatment-resistant depression, catatonia, severe suicidality requiring rapid response, bipolar depression/mania refractory to medication, pregnancy (when medications carry unacceptable risk), neuroleptic malignant syndrome. ECT is the most effective acute treatment for severe depression (remission rate 50-70%).\n\nCANMAT recommends ECT as first-line when rapid response is critical (severe suicidality, psychotic depression, catatonia). Common side effects: short-term memory impairment (usually resolves), headache, myalgias. Maintenance ECT prevents relapse. Informed consent requires discussion of cognitive side effects. No absolute contraindications — increased ICP is a relative contraindication."
    difficulty: medium
    tags: [ECT, indications, psychotic-depression, catatonia, CANMAT]
  - front: "How should perinatal depression be screened for and managed?"
    back: "Screen: Edinburgh Postnatal Depression Scale (EPDS) at first prenatal visit, 6 weeks, and 6 months postpartum. Score >=13 indicates probable depression. Management: mild = supportive psychotherapy, CBT/IPT. Moderate-severe: SSRIs (sertraline preferred in breastfeeding — low infant exposure). Severe: consider ECT. Always assess for psychosis and suicidality.\n\nSOGC and CPS recommend universal perinatal depression screening. Prevalence is 10-15% postpartum, 10% antenatal. Untreated maternal depression affects infant attachment and development. SSRIs in pregnancy carry small absolute risks (persistent pulmonary HTN, neonatal adaptation syndrome) but benefits usually outweigh risks. CANMAT provides specific perinatal guidelines."
    difficulty: medium
    tags: [perinatal-depression, EPDS, screening, SSRI-pregnancy, SOGC]
  - front: "What is the CANMAT-recommended first-line pharmacotherapy for bipolar depression?"
    back: "Quetiapine (monotherapy), lurasidone (+ lithium or valproate), or lithium. Lamotrigine is effective for prevention of depressive episodes. Standard antidepressants are generally AVOIDED in bipolar depression (risk of switch to mania/rapid cycling), except SSRIs cautiously with a mood stabilizer.\n\nBipolar depression is more disabling than mania, accounting for 3x more time ill. CANMAT guidelines distinguish bipolar depression treatment from unipolar depression. Antidepressant monotherapy without a mood stabilizer is contraindicated. Lurasidone was shown effective in PREVAIL studies with minimal metabolic side effects."
    difficulty: hard
    tags: [bipolar-depression, quetiapine, lurasidone, CANMAT, mood-stabilizer]
  - front: "What features distinguish bipolar I from bipolar II disorder?"
    back: "Bipolar I: at least one manic episode (>=7 days or hospitalization required) with possible depressive episodes. Bipolar II: at least one hypomanic episode (>=4 days, no hospitalization, less functional impairment) AND at least one major depressive episode. Bipolar II is NOT a milder form — depression burden is typically greater.\n\nBipolar II is often misdiagnosed as unipolar depression (average delay to correct diagnosis is 8-10 years). CANMAT recommends screening for hypomania in all patients presenting with depression using the Mood Disorder Questionnaire (MDQ). Treatment differs: lithium/quetiapine for both types; valproate primarily for bipolar I."
    difficulty: medium
    tags: [bipolar-I-vs-II, mania, hypomania, diagnosis, CANMAT]
  - front: "What rapid-cycling bipolar disorder and how is it managed?"
    back: ">=4 mood episodes (mania, hypomania, depression, or mixed) within 12 months. Affects 15-20% of bipolar patients, more common in women and bipolar II. Management: discontinue antidepressants (often trigger rapid cycling), optimize mood stabilizer (lithium or valproate), quetiapine. Thyroid optimization important.\n\nCANMAT guidelines recommend addressing modifiable triggers: antidepressant withdrawal, thyroid dysfunction, substance use, and circadian rhythm disruption. Lamotrigine may help prevent depressive episodes in rapid cycling. Combination therapy is often needed. Prognosis is generally poorer than non-rapid cycling bipolar disorder."
    difficulty: hard
    tags: [rapid-cycling, bipolar, antidepressant-withdrawal, mood-stabilizer, CANMAT]
  - front: "What are the signs and management of lithium toxicity?"
    back: "Mild (1.5-2.0 mmol/L): tremor, nausea, diarrhea, polyuria. Moderate (2.0-2.5): ataxia, confusion, dysarthria, fasciculations. Severe (>2.5): seizures, coma, renal failure, cardiac arrhythmia. Management: hold lithium, aggressive IV normal saline hydration, hemodialysis for severe toxicity (>2.5, or symptomatic >2.0 with renal impairment).\n\nCommon precipitants of lithium toxicity include dehydration, NSAIDs, ACEi/ARBs, thiazide diuretics, and acute kidney injury. CANMAT emphasizes patient education about maintaining hydration and recognizing early symptoms. Chronic toxicity can occur at lower levels than acute toxicity. Nephrogenic diabetes insipidus is a common long-term effect."
    difficulty: hard
    tags: [lithium-toxicity, hemodialysis, drug-interactions, renal, emergency]
  - front: "What are the CANMAT-recommended first-line antidepressants for major depressive disorder?"
    back: "SSRIs (escitalopram, sertraline, fluoxetine), SNRIs (venlafaxine, duloxetine), bupropion, mirtazapine, and agomelatine (unique in Canada). Selection based on patient profile: anxiety comorbidity (SSRI/SNRI), pain (duloxetine/venlafaxine), insomnia/weight loss (mirtazapine), sexual dysfunction concern (bupropion), fatigue (bupropion).\n\nCANMAT 2016 guidelines recommend all first-line agents as equivalent in efficacy (~60% response rate). Treatment should be continued for 6-12 months after remission for first episode, longer for recurrent depression. Agomelatine (melatonin receptor agonist) requires LFT monitoring but has favorable side effect profile."
    difficulty: medium
    tags: [antidepressant, first-line, SSRI, SNRI, CANMAT]
  - front: "What is the mechanism of action of Propofol?"
    back: "GABA-A receptor agonist causing CNS depression; 30% decreased BP due to vasodilation\n\nPropofol enhances GABAergic inhibition in the CNS, producing hypnosis with rapid onset and recovery due to its high lipid solubility."
    difficulty: easy
    tags: [anesthesia, propofol, mechanism, GABA, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What respiratory effects do volatile anesthetics cause?"
    back: "Respiratory depression with severely decreased tidal volume and increased respiratory rate, decreased response to CO2 reflexes, bronchodilation\n\nAll volatile agents depress respiratory drive and response to hypercapnia, requiring controlled ventilation."
    difficulty: easy
    tags: [anesthesia, inhalational-agents, respiratory-effects, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is atrophy in dermatological context?"
    back: "Histological decrease in size or number of cells or tissues, resulting in thinning or depression of the skin\n\nSkin atrophy can result from aging, corticosteroid use, or various dermatological conditions."
    difficulty: easy
    tags: [dermatology, secondary lesions, skin changes, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is skin atrophy?"
    back: "Histological decrease in size or number of cells or tissues, resulting in thinning or depression of the skin\n\nAtrophy can result from aging, corticosteroid use, or inflammatory conditions, leading to fragile, translucent-appearing skin."
    difficulty: easy
    tags: [dermatology, skin atrophy, pathology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are the precipitating causes of Telogen Effluvium? Use the 'SEND' mnemonic"
    back: "S - Stress (biological/psychological), E - Endocrine (postpartum, thyroid), N - Nutritional (iron/protein deficiency), D - Drugs (acitretin, heparin, lithium, IFN, beta-blockers, valproic acid, SSRIs)\n\nAny metabolic stress can shift hair follicles prematurely from anagen to telogen, with a characteristic 2-4 month delay in visible shedding."
    difficulty: medium
    tags: [telogen effluvium, causes, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What are precipitants of Telogen Effluvium (remember with SEND)?"
    back: "Stress (biological/psychological), Surgery, Severe illness, Nutritional deficiency (iron/protein), Drugs (acitretin, heparin, lithium, IFN, beta-blockers, valproic acid, SSRIs)\n\nThese factors push hair follicles prematurely from anagen into telogen, causing increased shedding 2-4 months later."
    difficulty: hard
    tags: [telogen effluvium, precipitants, trichology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What common side effects of isotretinoin should patients be counseled about?"
    back: "Decreased night vision, decreased tolerance to contact lenses, dry mucous membranes (dry skin, lips, eyes), transient acne exacerbation, depression, myalgia; teratogenic\n\nIsotretinoin affects all epithelial tissues causing mucocutaneous dryness. Depression is a controversial concern requiring monitoring. Dry eyes affect contact lens tolerance."
    difficulty: easy
    tags: [isotretinoin, side-effects, counseling, acne, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What drugs can precipitate HHS?"
    back: "Diuretics, glucocorticoids, lithium, and atypical antipsychotics.\n\nThese medications can impair glucose metabolism or cause dehydration."
    difficulty: medium
    tags: [HHS, precipitants, medications, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What can cause false positive results on dexamethasone suppression test?"
    back: "Obesity, depression, alcoholism, pregnancy, and medications or oral contraceptive pills that induce dexamethasone metabolism\n\nThese conditions can cause inappropriate cortisol levels despite normal HPA axis function."
    difficulty: medium
    tags: [dexamethasone, Cushings, endocrinology, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What can cause false positive results on the DXM Suppression Test?"
    back: "Obesity, depression, alcoholism, pregnancy, medications or oral contraceptive pills inducing metabolism of DXM\n\nThese conditions can increase DXM metabolism, leading to inadequate cortisol suppression despite normal HPA axis function."
    difficulty: medium
    tags: [endocrinology, cortisol, suppression-test, false-positive, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
