# Acute Abdomen & Appendicitis (Surgery) - generated from srs-mccqe1
cards:
  - front: "A 35-year-old has periumbilical pain that migrated to the right iliac fossa over 12 hours with fever and rebound tenderness at McBurney point. WBC 14,000. What is the diagnosis and management?"
    back: "Acute appendicitis; Alvarado score or CT abdomen to confirm; appendectomy (laparoscopic preferred) or antibiotic treatment for uncomplicated appendicitis\n\nAppendicitis is the most common surgical emergency. Alvarado score ≥7 highly suggests appendicitis. CT has sensitivity >95%; ultrasound preferred in children and pregnant women to avoid radiation. APPAC trial: antibiotics alone feasible for uncomplicated appendicitis but higher recurrence rate."
    difficulty: hard
    tags: [appendicitis, acute abdomen, appendectomy, Alvarado score, surgery]
  - front: "What is peritonitis and how is it classified?"
    back: "Peritonitis: inflammation of peritoneum; Primary: spontaneous bacterial peritonitis (cirrhosis); Secondary: perforated viscus, bowel perforation (most common); Tertiary: persistent peritonitis despite treatment\n\nSecondary peritonitis from perforation presents with sudden onset severe abdominal pain, rigid abdomen, absent bowel sounds. Free air under diaphragm on erect CXR. Emergency surgical exploration for hollow viscus perforation."
    difficulty: medium
    tags: [peritonitis, acute abdomen, SBP, bowel perforation, surgery]
  - front: "A 65-year-old has sudden onset severe central abdominal pain, pulsatile abdominal mass, and hypotension. Diagnosis and management?"
    back: "Ruptured abdominal aortic aneurysm (AAA); immediate transfer to OR — do NOT delay for CT if hemodynamically unstable; EVAR (endovascular) or open repair\n\nAAA rupture has >80% mortality. Classic triad: severe tearing abdominal/back pain, pulsatile mass, hypotension. CT angiography only if hemodynamically stable. Permissive hypotension (target SBP 70-90 mmHg) until aortic control. Type O negative blood if crossmatch unavailable."
    difficulty: hard
    tags: [ruptured AAA, aortic aneurysm, EVAR, acute abdomen, surgery]
  - front: "What are the signs and causes of bowel obstruction, and how is it managed?"
    back: "SBO: adhesions (most common, prior surgery), hernias, malignancy; LBO: colorectal cancer, volvulus, diverticulitis; signs: colicky pain, distension, vomiting, obstipation; manage with NG tube, IV fluids, serial exams — surgery for strangulation or failed conservative management\n\nCT abdomen is the investigation of choice for bowel obstruction. Water-soluble contrast gastrografin both diagnostic and therapeutic for adhesive SBO. Strangulation signs: fever, peritoneal signs, high WBC, CT findings — emergency surgery."
    difficulty: hard
    tags: [bowel obstruction, SBO, adhesions, acute abdomen, surgery]
  - front: "A 45-year-old woman has acute right upper quadrant pain radiating to the right shoulder, fever, and positive Murphy sign. WBC 16,000, alkaline phosphatase elevated. Diagnosis?"
    back: "Acute cholecystitis; biliary colic with localized peritonitis; ultrasound confirms (gallstones, gallbladder wall thickening, pericholecystic fluid); treat with antibiotics + laparoscopic cholecystectomy (ideally within 72 hours)\n\nTokyo guidelines classify cholecystitis severity. Early laparoscopic cholecystectomy (within 72h) reduces complications compared to interval cholecystectomy. Complications: gangrenous cholecystitis, gallbladder perforation, Mirizzi syndrome. Acalculous cholecystitis in critically ill patients."
    difficulty: hard
    tags: [acute cholecystitis, Murphy sign, cholecystectomy, gallstones, surgery]
  - front: "What is Mirizzi syndrome?"
    back: "Mirizzi syndrome: impacted stone in cystic duct or Hartmann pouch causing extrinsic compression of the common bile duct, resulting in obstructive jaundice — ERCP or surgery required\n\nMirizzi syndrome is a rare complication of cholelithiasis. Presents with jaundice, RUQ pain, and cholangitis. CT or MRCP for diagnosis. Cholecystectomy is the definitive treatment but may require hepaticojejunostomy in advanced cases."
    difficulty: medium
    tags: [Mirizzi syndrome, biliary obstruction, cholecystitis, ERCP, surgery]
  - front: "A 60-year-old with diverticulitis develops left lower quadrant pain, fever, and a tender palpable mass. CT shows pericolic abscess 5 cm. Management?"
    back: "Acute diverticulitis with pericolic abscess; CT-guided percutaneous drainage for abscess >3 cm, IV antibiotics; elective sigmoid colectomy after resolution\n\nHinchey classification guides diverticulitis management: Stage I (pericolic abscess), Stage II (pelvic abscess) — percutaneous drainage; Stage III (purulent peritonitis), Stage IV (fecal peritonitis) — emergency surgery (Hartmann procedure). Elective laparoscopic colectomy after 6-8 weeks."
    difficulty: hard
    tags: [diverticulitis, abscess drainage, Hinchey classification, colectomy, surgery]
  - front: "What is acute mesenteric ischemia and how is it classified?"
    back: "Acute mesenteric ischemia: inadequate blood flow to small intestine; Types: arterial embolism (most common, 50%), arterial thrombosis, non-occlusive (NOMI), venous thrombosis; presents with severe pain out of proportion to exam\n\nDiagnosis: CT mesenteric angiography (gold standard). Arterial embolism: transcatheter thrombolysis or surgical embolectomy. Bowel necrosis: emergency laparotomy with bowel resection. Mortality >60%. Peritonism = bowel infarction until proven otherwise."
    difficulty: hard
    tags: [mesenteric ischemia, bowel ischemia, CT angiography, acute abdomen, surgery]
  - front: "What is the presentation and management of sigmoid volvulus?"
    back: "Sigmoid volvulus: elderly/institutionalized patients, severe distension, coffee bean sign on AXR; manage with sigmoidoscopic decompression and rectal tube; sigmoid colectomy to prevent recurrence\n\nCoffee bean sign (omega loop) on plain AXR is diagnostic of sigmoid volvulus. Sigmoidoscopic decompression effective in 80-90% without strangulation. Elective sigmoid colectomy is definitive treatment to prevent 50% recurrence. Cecal volvulus requires emergency right hemicolectomy."
    difficulty: hard
    tags: [sigmoid volvulus, coffee bean sign, decompression, colectomy, surgery]
  - front: "What is the differential diagnosis of right iliac fossa pain in a 25-year-old woman?"
    back: "Appendicitis, ovarian pathology (ovarian cyst, torsion, ectopic pregnancy), PID, right ureteric colic, Meckel diverticulitis, terminal ileitis (Crohn disease), mesenteric adenitis\n\nPregnancy test is essential in women of childbearing age with RIF pain — ectopic pregnancy can be fatal. Pelvic ultrasound and CT abdomen/pelvis with contrast guide diagnosis. Diagnostic laparoscopy if imaging inconclusive."
    difficulty: medium
    tags: [RIF pain, appendicitis differential, ectopic pregnancy, ovarian torsion, surgery]
  - front: "What are the surgical indications in Crohn disease?"
    back: "Bowel obstruction from stricture (fibrostenotic disease), intraabdominal abscess, fistula (enterocutaneous, enteroenteric, enterovesical), perforation, medically refractory disease, dysplasia/cancer — bowel-conserving approach preferred\n\nCrohn surgery is not curative; recurrence in anastomosis common. Principles: resect minimal bowel, strictureplasty for multiple strictures, laparoscopic approach when possible. Preoperative optimization: nutritional support, steroid minimization, hold biologics perioperatively."
    difficulty: medium
    tags: [Crohn disease surgery, strictureplasty, bowel-conserving, fistula, surgery]
  - front: "A 70-year-old has sudden severe abdominal pain. AXR shows free air under the diaphragm. What is the immediate management?"
    back: "Perforated viscus (most likely perforated peptic ulcer); resuscitate with IV fluids, IV antibiotics, IV PPI, NG decompression, urgent surgical consultation — emergency laparotomy for omental patch repair or Hartmann procedure\n\nFree air under diaphragm confirms hollow viscus perforation. Erect CXR detects as little as 1-2 mL of free air. NSAID and H. pylori associated peptic ulcer perforation. Boerhaave syndrome (esophageal perforation from vomiting) — surgical emergency."
    difficulty: hard
    tags: [perforated viscus, free air, peptic ulcer perforation, acute abdomen, surgery]
  - front: "What are the Ranson criteria for acute pancreatitis and their prognostic value?"
    back: "On admission: age >55, WBC >16,000, glucose >11 mmol/L, LDH >350 IU/L, AST >250 IU/L; At 48h: Ca <2 mmol/L, hematocrit drop >10%, BUN rise >1.8 mmol/L, PaO2 <60, base deficit >4, fluid sequestration >6L — ≥3 criteria = severe disease\n\nRanson criteria predict acute pancreatitis severity at 48 hours. Higher scores correlate with increased morbidity and mortality. APACHE II and BISAP are more validated and can be calculated at any time. All scores should prompt ICU monitoring."
    difficulty: medium
    tags: [Ranson criteria, pancreatitis severity, acute pancreatitis, surgery]
  - front: "A 55-year-old has Hinchey Stage IV diverticulitis (fecal peritonitis). What is the surgical procedure?"
    back: "Hartmann procedure: emergency sigmoid resection with end colostomy and oversewn rectal stump — colostomy reversal at 3-6 months when patient recovers\n\nHartmann procedure is the traditional approach for perforated diverticulitis with fecal contamination. Laparoscopic lavage and drainage is an option for Hinchey III (purulent) in hemodynamically stable patients. Primary anastomosis with ileostomy is increasingly used in experienced centers."
    difficulty: hard
    tags: [Hartmann procedure, diverticulitis perforation, colostomy, surgery, acute abdomen]
  - front: "What is the workup for acute abdominal pain — what investigations should be ordered?"
    back: "Urine beta-hCG (women of childbearing age), CBC, BMP, lipase, LFTs, lactate, UA; erect CXR and AXR; CT abdomen/pelvis with contrast (IV ± oral depending on suspected diagnosis); pelvic ultrasound if gynaecologic cause suspected\n\nCT abdomen/pelvis is the gold standard for most acute abdominal presentations. Ultrasound preferred for biliary and gynaecologic causes and in pregnancy. Lactate identifies mesenteric ischemia and bowel infarction. Lactate >2 mmol/L warrants urgent surgical evaluation."
    difficulty: easy
    tags: [acute abdomen workup, CT abdomen, investigations, surgery]
  - front: "What is the Alvarado score for appendicitis?"
    back: "Migration pain(1), Anorexia(1), Nausea(1), RLQ tenderness(2), Rebound(1), Temp>37.3(1), WBC>10k(2), Left shift(1). >=7: surgery. 5-6: CT\n\nModified Alvarado omits left shift. CT abdomen 94% sensitive, 95% specific. US first-line in children/pregnant. Antibiotics-first approach for uncomplicated."
    difficulty: medium
    tags: [appendicitis, Alvarado]
  - front: "What is the Alvarado score (MANTRELS) for appendicitis and how is it interpreted?"
    back: "Migration of pain (1), Anorexia (1), Nausea/vomiting (1), Tenderness in RLQ (2), Rebound (1), Elevated temperature (1), Leukocytosis (2), Shift to left (1). Total 10. Score 1-4: unlikely; 5-6: possible (CT); 7-8: probable; 9-10: very probable appendicitis.\n\nThe Alvarado score is a clinical decision tool for appendicitis validated in Canadian EDs. Score >=7 has high specificity but low sensitivity. CT abdomen/pelvis is recommended for equivocal scores (5-6). Appendicitis is the most common surgical emergency."
    difficulty: medium
    tags: [Alvarado score, appendicitis, acute abdomen, surgery]
  - front: "What is the differential diagnosis for acute RLQ pain in a young woman?"
    back: "Appendicitis, ruptured ovarian cyst, ovarian torsion, ectopic pregnancy, PID/tubo-ovarian abscess, Meckel diverticulitis, mesenteric adenitis, Crohn disease (terminal ileitis), right ureteral colic, endometriosis.\n\nBeta-hCG is mandatory in all women of childbearing age with abdominal pain to exclude ectopic pregnancy. Pelvic ultrasound is first-line imaging for suspected gynecologic pathology. CT is the gold standard for appendicitis (sensitivity >95%)."
    difficulty: medium
    tags: [RLQ pain, differential diagnosis, acute abdomen, surgery]
  - front: "What are the indications for emergent laparotomy in acute abdomen?"
    back: "Generalized peritonitis with hemodynamic instability, free air on imaging (perforated viscus), suspected mesenteric ischemia with peritoneal signs, ruptured AAA, uncontrolled hemorrhage, bowel obstruction with signs of strangulation (fever, tachycardia, localized tenderness, leukocytosis).\n\nHemodynamically unstable patients with peritonitis should go directly to OR without further imaging. Upright CXR or CT for pneumoperitoneum. Canadian surgical guidelines emphasize clinical judgment over scoring systems in the unstable patient."
    difficulty: hard
    tags: [emergent laparotomy, peritonitis, acute abdomen, surgery]
  - front: "How is small bowel obstruction (SBO) differentiated from large bowel obstruction and managed?"
    back: "SBO: multiple air-fluid levels, dilated small bowel (>3cm), decompressed colon. LBO: dilated colon (>6cm, cecum >9cm), decompressed small bowel unless incompetent ileocecal valve. SBO management: NPO, NGT, IV fluids, serial exams. Surgery if signs of strangulation or no improvement in 48-72h.\n\nCT with oral and IV contrast is the imaging modality of choice. Adhesions are the most common cause of SBO (60-75%) in developed countries. Water-soluble contrast (Gastrografin) study can be diagnostic and therapeutic in adhesive SBO. Most partial SBO resolves non-operatively."
    difficulty: hard
    tags: [bowel obstruction, SBO, LBO, acute abdomen, surgery]
  - front: "What are the signs of mesenteric ischemia and how is it diagnosed?"
    back: "Acute mesenteric ischemia presents with severe abdominal pain out of proportion to physical exam, often in patients with AF or vascular disease. CT angiography is the diagnostic study of choice (sensitivity >95%). Labs: elevated lactate, metabolic acidosis, leukocytosis.\n\nMesenteric ischemia has high mortality (60-80%) if not treated promptly. SMA embolism (50% of cases) is most common, often from AF. Early surgical consultation and anticoagulation are essential. Canadian guidelines recommend CTA as first-line imaging."
    difficulty: hard
    tags: [mesenteric ischemia, SMA, acute abdomen, surgery]
  - front: "What is the management algorithm for acute pancreatitis?"
    back: "Aggressive IV fluid resuscitation (goal-directed, lactated Ringer preferred), pain control (hydromorphone, avoid morphine per tradition though evidence is weak), NPO initially then early oral feeding as tolerated, no routine antibiotics. ERCP within 24h only if cholangitis or persistent biliary obstruction.\n\nRevised Atlanta Classification grades severity: mild (no organ failure), moderately severe (transient organ failure <48h), severe (persistent organ failure >48h). Canadian guidelines follow AGA recommendations. Cholecystectomy during same admission for gallstone pancreatitis to prevent recurrence."
    difficulty: hard
    tags: [pancreatitis, management, fluid resuscitation, surgery]
  - front: "What is the Ranson criteria for pancreatitis severity?"
    back: "At admission: Age >55, WBC >16,000, Glucose >11 mmol/L, LDH >350, AST >250. At 48h: Hct drop >10%, BUN rise >1.8 mmol/L, Ca <2.0 mmol/L, PaO2 <60, Base deficit >4, Fluid sequestration >6L. Score >=3 predicts severe disease.\n\nRanson criteria are limited by requiring 48 hours for completion. APACHE II and BISAP scores can be calculated earlier. CT severity index (Balthazar) assesses local complications. In Canada, BISAP is increasingly used for bedside assessment."
    difficulty: medium
    tags: [Ranson criteria, pancreatitis, severity scoring, surgery]
  - front: "What are the indications for cholecystectomy and the management of acute cholecystitis?"
    back: "Acute cholecystitis: IV antibiotics + early laparoscopic cholecystectomy (within 72h preferred). Indications for cholecystectomy: symptomatic gallstones, acute cholecystitis, gallstone pancreatitis, porcelain gallbladder, gallbladder polyps >1cm. Tokyo Guidelines grade severity.\n\nEarly cholecystectomy (<72h) is safe and reduces hospital stay vs delayed surgery per Canadian and international guidelines. Percutaneous cholecystostomy is used for critically ill patients unfit for surgery. Intraoperative cholangiography or MRCP for suspected CBD stones."
    difficulty: hard
    tags: [cholecystitis, cholecystectomy, gallstones, surgery]
  - front: "How is perforated peptic ulcer diagnosed and managed?"
    back: "Sudden-onset severe epigastric pain, rigid abdomen, free air on upright CXR (present in ~75%) or CT. Management: IV PPI, NPO, IV antibiotics, urgent surgical repair (Graham patch omentoplasty). H. pylori testing and eradication post-operatively.\n\nCT has higher sensitivity than CXR for pneumoperitoneum. Non-operative management may be considered in stable patients with contained perforation. Most perforations are anterior duodenal ulcers. NSAID and H. pylori are the primary risk factors."
    difficulty: hard
    tags: [perforated ulcer, pneumoperitoneum, surgery]
  - front: "What is the management of acute diverticulitis by severity?"
    back: "Uncomplicated: oral antibiotics (ciprofloxacin + metronidazole or amoxicillin-clavulanate) for 7-10 days, liquid diet, outpatient if tolerated. Complicated (abscess, perforation, fistula): IV antibiotics, CT-guided drainage for abscess >3cm, surgery for free perforation (Hartmann procedure or primary anastomosis).\n\nRecent evidence (DIABOLO trial) suggests uncomplicated diverticulitis may be managed without antibiotics. Canadian guidelines still generally recommend antibiotics. Elective sigmoid colectomy after 2+ episodes is no longer routine-individualized based on severity and patient factors."
    difficulty: hard
    tags: [diverticulitis, management algorithm, surgery]
  - front: "What are the causes and management of upper GI bleeding?"
    back: "Causes: peptic ulcer (most common), variceal, Mallory-Weiss, malignancy, AVM, Dieulafoy lesion. Management: resuscitation, IV PPI (pantoprazole 80mg bolus then 8mg/h infusion), transfuse if Hb <70 (restrictive), urgent EGD within 24h. Variceal: octreotide + antibiotics + urgent EGD with banding.\n\nGlasgow-Blatchford score predicts need for intervention (score 0 = safe outpatient management). Canadian guidelines follow international consensus. Restrictive transfusion (Hb <70) improves outcomes vs liberal (Villanueva trial). H. pylori testing is mandatory if ulcer found."
    difficulty: hard
    tags: [upper GI bleed, peptic ulcer, variceal bleeding, surgery]
  - front: "What is the significance of Murphy sign and its role in acute abdomen assessment?"
    back: "Murphy sign: inspiratory arrest during palpation of the RUQ (gallbladder). Positive Murphy = acute cholecystitis (sensitivity ~65%). Sonographic Murphy sign is more specific. Other key signs: McBurney (appendicitis), Rovsing (appendicitis), psoas sign, obturator sign.\n\nPhysical examination signs have moderate sensitivity individually but together guide clinical suspicion. RUQ ultrasound is the first-line imaging for suspected cholecystitis (thickened wall >3mm, pericholecystic fluid, sonographic Murphy). HIDA scan if US equivocal."
    difficulty: easy
    tags: [Murphy sign, physical exam, acute abdomen, surgery]
  - front: "What is the management of incarcerated inguinal hernia?"
    back: "Attempt manual reduction (Trendelenburg, sedation, gentle sustained pressure). If successful: semi-elective surgical repair. If reduction fails or signs of strangulation (erythema, fever, peritonitis, tachycardia): emergent surgical exploration. Assess bowel viability intraoperatively.\n\nIncarcerated hernias are a surgical emergency when strangulated. Femoral hernias have the highest risk of strangulation. In Canada, inguinal hernia repair is one of the most common general surgery procedures. Mesh repair (Lichtenstein) is standard for elective cases."
    difficulty: hard
    tags: [inguinal hernia, incarcerated, strangulation, surgery]
  - front: "How does acute appendicitis presentation differ in special populations?"
    back: "Pregnancy: RUQ pain (displaced appendix), less peritoneal signs. Elderly: vague symptoms, less fever/leukocytosis, higher perforation rate (50-70%). Children: rapid progression to perforation, difficulty localizing pain. Retrocecal appendix: flank/back pain, psoas sign.\n\nAtypical presentations lead to delayed diagnosis. MRI is preferred imaging in pregnancy (avoids radiation). In elderly, CT is essential as clinical assessment is unreliable. Perforation rate increases with diagnostic delay. Canadian guidelines recommend early imaging for equivocal cases."
    difficulty: hard
    tags: [appendicitis, special populations, atypical presentation, surgery]
  - front: "What are the principles of damage control surgery?"
    back: "Stage 1: Abbreviated laparotomy-control hemorrhage and contamination, temporary abdominal closure. Stage 2: ICU resuscitation-correct hypothermia, coagulopathy, acidosis (lethal triad). Stage 3: Planned re-laparotomy at 24-48h for definitive repair.\n\nDamage control surgery is indicated when the lethal triad (hypothermia <35°C, coagulopathy, acidosis pH <7.2) develops intraoperatively. Temporary closure with negative pressure wound therapy. This approach reduces mortality in critically injured patients."
    difficulty: hard
    tags: [damage control surgery, trauma, lethal triad, surgery]
  - front: "What are the indications for CT vs MRI vs ultrasound in abdominal imaging?"
    back: "CT: trauma, acute abdomen, diverticulitis, renal colic. MRI: liver lesion characterization, bile duct evaluation (MRCP), pelvic pathology. US: RUQ pain (gallstones), pregnancy, pediatric appendicitis, testicular torsion\n\nCT with contrast contraindicated in severe renal impairment (eGFR<30) or contrast allergy. MRI contraindicated with certain metallic implants. US is first-line for gallbladder, obstetric, and pediatric imaging."
    difficulty: medium
    tags: [imaging, CT, MRI, ultrasound]
  - front: "A 45-year-old female presents with acute RUQ pain, fever, and Murphy's sign. Labs show elevated WBC and mildly elevated ALP/GGT. What is the most likely diagnosis and preferred imaging?"
    back: "Acute cholecystitis. Right upper quadrant ultrasound is the preferred initial imaging, which will show gallstones, gallbladder wall thickening (>3 mm), pericholecystic fluid, and a sonographic Murphy's sign. HIDA scan can confirm if ultrasound is equivocal.\n\nMurphy's sign (inspiratory arrest during RUQ palpation) is highly suggestive of cholecystitis. Charcot's triad (RUQ pain, fever, jaundice) suggests cholangitis, and Reynold's pentad adds altered mental status and hypotension, indicating suppurative cholangitis requiring emergent ERCP."
    difficulty: medium
    tags: [abdominal-pain, RUQ, cholecystitis, surgery, ultrasound]
  - front: "A 19-year-old male presents with periumbilical pain that migrated to the RLQ over 12 hours, anorexia, low-grade fever, and RLQ tenderness with rebound. What is the diagnosis, and what clinical scores aid decision-making?"
    back: "Acute appendicitis. The Alvarado score (MANTRELS: Migration, Anorexia, Nausea, Tenderness in RLQ, Rebound, Elevation of temperature, Leukocytosis, Shift to left) helps stratify risk. CT abdomen/pelvis with contrast is the confirmatory imaging in adults.\n\nClassic appendicitis follows visceral-to-somatic pain migration as inflammation extends from the appendiceal wall to the parietal peritoneum. In young women of reproductive age, always consider ectopic pregnancy (beta-hCG) and ovarian pathology (ultrasound) in the differential."
    difficulty: easy
    tags: [abdominal-pain, RLQ, appendicitis, surgery, clinical-scores]
  - front: "A 65-year-old presents with acute LLQ pain, fever, and leukocytosis. What is the most likely diagnosis, and what is the initial investigation and management?"
    back: "Acute diverticulitis. CT abdomen/pelvis with contrast is the preferred imaging, showing colonic wall thickening, pericolonic fat stranding, and possibly abscess formation. Uncomplicated cases are managed with antibiotics (ciprofloxacin + metronidazole) and bowel rest. Complicated cases (abscess >4 cm, perforation) may require percutaneous drainage or surgery.\n\nDiverticulitis is the most common cause of LLQ pain in older adults. Colonoscopy is contraindicated acutely due to perforation risk but should be performed 6-8 weeks after resolution to exclude malignancy. Sigmoid volvulus and colon cancer are important differential diagnoses in this age group."
    difficulty: medium
    tags: [abdominal-pain, LLQ, diverticulitis, surgery, GI]
  - front: "A 50-year-old alcoholic presents with severe epigastric pain radiating to the back, nausea, and vomiting. Lipase is 5x the upper limit of normal. What is the diagnosis, the two most common etiologies, and the severity scoring system?"
    back: "Acute pancreatitis. The two most common causes are gallstones (40%) and alcohol (30%). Severity is assessed using the Revised Atlanta Classification and Ranson's criteria (or BISAP score). Management is IV fluids, analgesia, NPO initially, and treatment of underlying cause (cholecystectomy for gallstone pancreatitis).\n\nLipase is more specific and sensitive than amylase for pancreatitis and remains elevated longer. CT should be reserved for patients not improving after 48-72 hours to assess for necrosis. Early aggressive IV fluid resuscitation with lactated Ringer's is the cornerstone of initial management."
    difficulty: medium
    tags: [abdominal-pain, epigastric, pancreatitis, GI, surgery]
  - front: "A 45-year-old construction worker presents with low back pain radiating to the left leg below the knee, with numbness on the lateral foot and weakness of ankle plantar flexion. Which nerve root is most likely affected?"
    back: "S1 nerve root. S1 radiculopathy produces pain radiating down the posterior leg to the lateral foot, numbness of the lateral foot, weakness of ankle plantar flexion and eversion, and diminished Achilles reflex. This is most commonly caused by an L5-S1 disc herniation.\n\nDermatomal patterns help localize the affected nerve root: L4 = medial leg/foot, knee extension, patellar reflex. L5 = lateral leg/dorsum of foot, great toe dorsiflexion, no classic reflex. S1 = posterior leg/lateral foot, ankle plantar flexion, Achilles reflex. MRI is indicated if red flags are present or symptoms persist >6 weeks."
    difficulty: medium
    tags: [back-pain, radiculopathy, S1, neurology, orthopedics]
  - front: "What are the red flag features in low back pain that require urgent investigation and possibly emergent intervention?"
    back: "Cauda equina syndrome: saddle anesthesia, urinary retention/incontinence, fecal incontinence, bilateral leg weakness (emergent MRI + surgical decompression within 48h). Cancer: age >50, history of cancer, unexplained weight loss, pain at rest/night. Infection (spinal epidural abscess/discitis): fever, IVDU, recent procedure, immunocompromised. Fracture: trauma, osteoporosis, steroid use.\n\nCauda equina syndrome is a surgical emergency — delay in decompression leads to permanent neurological deficits. Cancer and infection red flags warrant urgent MRI with gadolinium. Routine imaging is NOT recommended for acute low back pain without red flags, as it does not improve outcomes and most cases resolve within 4-6 weeks."
    difficulty: medium
    tags: [back-pain, red-flags, cauda-equina, cancer, infection, emergency]
  - front: "When is diagnostic imaging indicated for a patient presenting with acute low back pain?"
    back: "Imaging is indicated ONLY when red flags are present: suspected cauda equina syndrome (emergent MRI), suspected cancer or infection (urgent MRI with gadolinium), suspected fracture (plain X-rays first, CT/MRI if needed), progressive neurological deficit, or failure to improve after 6 weeks of conservative therapy. MRI is the modality of choice for most indications; plain X-rays have limited value except for fractures.\n\nOver 90% of acute low back pain is mechanical and self-limited. Early imaging in the absence of red flags leads to overdiagnosis (incidental disc findings are common in asymptomatic individuals), unnecessary interventions, and increased costs without improved outcomes. This is a common exam topic on appropriate resource utilization."
    difficulty: medium
    tags: [back-pain, imaging-criteria, MRI, clinical-approach, appropriate-use]
  - front: "What investigation confirms the diagnosis of erysipelas vs necrotizing fasciitis when clinically uncertain?"
    back: "If necrotizing fasciitis is suspected, immediate biopsy and frozen section (histopathology) is required — this is an emergency. Blood and skin/tissue cultures are obtained, but frozen section biopsy provides the fastest definitive diagnosis.\n\nNecrotizing fasciitis involves subcutaneous fat, fascial planes, and deep muscle. Key clinical clues distinguishing it from erysipelas/cellulitis include severe pain out of proportion, skin necrosis, gas in tissues, and rapid progression. Surgical debridement is life-saving."
    difficulty: hard
    tags: [necrotizing fasciitis, erysipelas, frozen section, biopsy, skin infection, emergency]
  - front: "What is the differential diagnosis of abdominal pain — list emergent GI causes vs. less emergent GI causes?"
    back: "Emergent GI: perforated viscus, bowel obstruction, ischaemic bowel, appendicitis, strangulated hernia, IBD flare, esophageal rupture, peptic ulcer disease. Less emergent GI: diverticulitis, gastroenteritis, GERD, esophagitis, gastritis, IBS.\n\nDistinguishing emergent from non-emergent abdominal pain is a core EM skill. The differential must also include hepatobiliary, genitourinary, cardiovascular (MI, AAA, aortic dissection), and metabolic causes (DKA, Addisonian crisis). POCUS is standard of care for suspected AAA."
    difficulty: easy
    tags: [abdominal pain, differential diagnosis, emergency, GI]
  - front: "What are the classic clinical findings of a ruptured AAA that should prompt immediate POCUS?"
    back: "Flank/back pain, pulsatile abdominal mass, and hypotension. POCUS (screening bedside ultrasound) is standard of care for any patient with clinical suspicion for AAA.\n\nThe classic triad of ruptured AAA (hypotension, back/flank pain, pulsatile mass) is present in only ~50% of cases. POCUS has excellent sensitivity for detecting an aneurysm and free fluid; it can be performed at the bedside without delaying resuscitation. CT angiogram is the definitive study in stable patients."
    difficulty: easy
    tags: [AAA, ruptured aortic aneurysm, POCUS, emergency]
  - front: "What investigations are ordered for a patient presenting with undifferentiated abdominal pain to the ED?"
    back: "Labs: CBC, electrolytes, glucose, BUN/Cr, U/A, liver enzymes/LFTs, lipase, β-hCG (all women of childbearing age), ECG, troponins, ± VBG/lactate. Imaging: POCUS (free fluid, AAA, ectopic), AXR (if SBO suspected), upright CXR (pneumoperitoneum), U/S or CT as indicated by clinical picture.\n\nA β-hCG must be ordered for all women of childbearing age to exclude ectopic pregnancy. Lactate helps identify bowel ischemia and sepsis. CT is the investigation of choice for SBO, AAA, pancreatitis, appendicitis, and diverticulitis. U/S is preferred first for gynecologic causes, biliary, and in children."
    difficulty: easy
    tags: [abdominal pain, investigations, emergency workup]
  - front: "What is the management of cauda equina syndrome in the emergency department?"
    back: "Dexamethasone and early spine surgery consultation.\n\nCauda equina syndrome is a surgical emergency. Compression of the cauda equina can cause permanent bowel, bladder, and lower extremity dysfunction if not decompressed promptly. Dexamethasone reduces cord edema while awaiting surgery."
    difficulty: easy
    tags: [cauda equina, back pain, surgical emergency]
  - front: "What are the surgical causes of abdominal pain in children that must not be missed?"
    back: "Malrotation with volvulus, Hirschsprung's disease, necrotizing enterocolitis, incarcerated hernia, intussusception, duodenal atresia, appendicitis, cholecystitis, adnexal torsion (testicular or ovarian), ectopic pregnancy, trauma, pyloric stenosis.\n\nSurgical causes of pediatric abdominal pain require prompt recognition and operative intervention. Red flags include rebound tenderness, radiation of pain to back/shoulder/leg, pain waking from sleep, jaundice/pale stools/dark urine, and failure to thrive. Intussusception classically presents with intermittent colicky pain and currant-jelly stools."
    difficulty: medium
    tags: [pediatric abdominal pain, surgical abdomen, intussusception, appendicitis, volvulus]
  - front: "What are the red flags for abdominal pain in children that warrant urgent evaluation?"
    back: "Growth failure/failure to thrive (need growth chart), pain from a non-GI source, joint pain with objective physical findings, rash, rebound tenderness, radiation of pain to back/shoulders/legs, pain that wakes child from sleep, jaundice/pale stools/dark urine, blood in stool.\n\nRed flags distinguish organic from functional abdominal pain, which is the most common cause of recurrent abdominal pain in middle-aged children. Organic causes are suggested by weight loss, localized peritoneal signs, bilious vomiting, or constitutional symptoms. A complete growth chart review is essential in all pediatric abdominal pain assessments."
    difficulty: medium
    tags: [pediatric abdominal pain, red flags, differential diagnosis, emergency medicine]
  - front: "What is the differential diagnosis for abdominal distension using the '6 Fs' mnemonic?"
    back: "Fat, Fluid (ascites), Feces, Fetus, Flatus, Fatal growth (large tumours).\n\nThe 6 Fs mnemonic is a useful clinical tool for systematically approaching abdominal distension. Ascites has further differential by portal pressure: portal HTN (cirrhosis, cardiac failure, hepatic vein thrombosis) vs. normal portal pressure (cancer, pancreatitis)."
    difficulty: easy
    tags: [abdominal distension, 6 Fs, ascites, differential diagnosis]
  - front: "What surgical incision provides access to the appendix and other RLQ/LLQ contents?"
    back: "McBurney's incision.\n\nMcBurney's incision is a muscle-splitting (grid-iron) incision centered over McBurney's point (one-third of the distance from the anterior superior iliac spine to the umbilicus). It provides excellent access to the appendix with minimal muscle damage and low risk of subsequent hernia."
    difficulty: easy
    tags: [surgery, incisions, appendix, anatomy]
  - front: "What are the most important diagnoses to first rule out in a patient presenting with acute abdominal pain?"
    back: "Diagnoses requiring urgent surgical intervention must be considered first:\n1. Peritonitis\n2. Bowel obstruction\n3. Ruptured abdominal aortic aneurysm\n4. Ectopic pregnancy (in women of childbearing age)\n5. Mesenteric ischemia\n6. Perforated viscus\n\nIn acute abdominal pain, the approach prioritizes life-threatening and surgically correctable conditions. The key investigations include ALP/ALT/AST/bilirubin, lipase/amylase, urinalysis, β-hCG (women of childbearing age), troponins, CBC, electrolytes, creatinine, INR/PTT, and CXR/ECG as indicated."
    difficulty: easy
    tags: [acute abdomen, surgery, differential diagnosis, emergency]
  - front: "What is the differential diagnosis of right upper quadrant (RUQ) abdominal pain?"
    back: "Hepatobiliary: biliary colic, cholecystitis, cholangitis, CBD obstruction (stone/tumour), hepatitis (including Fitz-Hugh-Curtis syndrome)\nGI: pancreatitis, gastric/duodenal/pancreatic pathology, hepatic flexure pathology (CRC)\nHernia: subcostal incisional\nGenitourinary: nephrolithiasis, pyelonephritis, renal mass/ischemia/trauma\nCardiopulmonary: right lower lobe pneumonia, empyema, CHF (hepatic congestion), MI, pericarditis, pleuritis\nMiscellaneous: herpes zoster, Tietze's syndrome (costochondritis)\n\nRUQ pain is most commonly biliary in origin, but extra-abdominal causes (particularly right lower lobe pneumonia and cardiac pathology) must always be considered. The Fitz-Hugh-Curtis syndrome (perihepatitis from Chlamydia or gonorrhoea) classically presents as RUQ pain in sexually active women."
    difficulty: medium
    tags: [RUQ pain, differential diagnosis, biliary, surgery]
  - front: "What are the classic surgical causes of acute right lower quadrant (RLQ) pain?"
    back: "GI (most important):\n- Appendicitis (most common surgical emergency)\n- Crohn's disease\n- Cecal diverticulitis\n- Cecal volvulus\n- Mesenteric lymphadenitis (Yersinia)\n- Cecal tumour\n- Intussusception\n- Tuberculosis of ileocecal junction\nHernia: femoral, inguinal obstruction (Amyand's)\nGynecological: ovarian torsion, ectopic pregnancy, PID, endometriosis\nGU: nephrolithiasis\nExtraperitoneal: abdominal wall hematoma, psoas abscess\n\nIn RLQ pain, appendicitis must be excluded first and is the most common surgical emergency. Yersinia mesenteric adenitis can closely mimic appendicitis, especially in children. Always consider gynecological pathology in women of childbearing age — obtain β-hCG."
    difficulty: medium
    tags: [RLQ pain, appendicitis, differential diagnosis, surgery]
  - front: "What clinical presentation patterns are associated with specific surgical conditions causing acute abdominal pain?"
    back: "1. Sudden onset with rigid abdomen → perforated viscus\n2. Pain out of proportion to physical findings → ischemic bowel (mesenteric ischemia)\n3. Vague pain that subsequently localizes to RLQ → appendicitis (periumbilical → RLQ migration)\n4. Waves of colicky pain → bowel obstruction\n\nThe temporal pattern and character of abdominal pain guide diagnosis. Pain disproportionate to exam findings is a hallmark of mesenteric ischemia — a surgical emergency requiring immediate investigation with CT angiography and expedited surgical management. Periumbilical pain migrating to RLQ over 6-12 hours is the classic presentation of appendicitis due to initial visceral (T10 dermatome) then somatic parietal peritoneal irritation."
    difficulty: medium
    tags: [abdominal pain, clinical patterns, surgery, mesenteric ischemia, appendicitis]
  - front: "What is the difference between visceral and parietal peritoneal pain?"
    back: "Visceral peritoneum: innervated by autonomic sensory fibres → pain is colicky, crampy, and poorly localized; perceived in the midline due to bilateral symmetric innervation.\nParietal peritoneum: innervated by somatic sensory nerves of the body wall → pain is sharp and well-localized; structures innervated somatically (kidney, ureter, ovary) cause lateralized pain.\n\nThis distinction explains why early appendicitis causes periumbilical discomfort (visceral) that later migrates to RLQ (parietal). It also explains why referred pain patterns differ — somatic structures cause lateralized pain, while GI tract pain is typically midline. Guarding and rebound tenderness indicate parietal peritoneal irritation."
    difficulty: easy
    tags: [peritoneum, pain physiology, visceral pain, parietal pain]
  - front: "What are the three types of peritonitis?"
    back: "1. Primary peritonitis: spontaneous without clear etiology (e.g., spontaneous bacterial peritonitis in cirrhosis)\n2. Secondary peritonitis: due to a perforated viscus (most common surgical cause)\n3. Tertiary peritonitis: recurrent secondary peritonitis, more often with resistant organisms; typically seen in critically ill, immunocompromised patients\n\nPrimary peritonitis (SBP) is typically monomicrobial (E. coli, Klebsiella, Streptococcus pneumoniae) and is treated with antibiotics. In patients with liver disease and acute abdominal pain, SBP must be ruled out. Secondary peritonitis requires surgical source control. Tertiary peritonitis carries high mortality and typically involves resistant organisms (Candida, Enterococcus, Pseudomonas)."
    difficulty: easy
    tags: [peritonitis, surgery, infection, classification]
  - front: "What are the surgical indications for intervention in GI bleeding?"
    back: "1. Failure of medical management (after at least two endoscopic attempts)\n2. Exsanguinating hemorrhage: hemodynamic instability despite vigorous resuscitation\n3. Recurrent hemorrhage with up to two attempts of endoscopic hemostasis\n4. Prolonged bleeding with transfusion requirement >3 units\n5. Bleeding at rate >1 unit/8 hours\n\nThe decision to proceed to surgery in GI bleeding balances the risks of ongoing hemorrhage against operative risk. Endoscopic management is attempted first for both upper and lower GI bleeding. If endoscopy fails or the patient is hemodynamically unstable, surgery (or interventional radiology with angioembolization) is required. PUD accounts for ~55% of severe UGIB."
    difficulty: medium
    tags: [GI bleeding, surgery, indications, UGIB, LGIB]
  - front: "What is the most common cause of lower GI bleeding (LGIB)?"
    back: "Diverticular bleeding, accounting for approximately 40% of LGIB cases.\n\nDiverticular bleeding typically presents as painless hematochezia and is usually arterial (from vasa recta erosion). It stops spontaneously in 75% of patients. If bleeding continues, colonoscopy, angiography, or RBC scan can localize the source. Barium enema should NOT be performed during active bleeding. Surgery (segmental colectomy) is indicated for persistent or recurrent bleeding."
    difficulty: easy
    tags: [LGIB, diverticular bleeding, lower GI bleed, surgery]
  - front: "What are the referral pain patterns for common surgical conditions?"
    back: "- Appendicitis: periumbilical → RLQ\n- Biliary colic: RUQ/epigastric → right shoulder/scapula\n- Pancreatitis: epigastric → back\n- Perforated ulcer: to RLQ (right paracolic gutter) or flank/groin\n- Renal colic: flank → groin\n- Diaphragmatic irritation: → ipsilateral shoulder (phrenic nerve, C3-5)\n\nReferred pain occurs because visceral afferent fibres share central pathways with somatic fibres from distant dermatomes. Understanding referred pain patterns prevents misdiagnosis — e.g., right shoulder pain from gallbladder disease (Boas' sign), or back pain from a retroperitoneal process like pancreatitis or AAA."
    difficulty: easy
    tags: [referred pain, surgery, abdominal pain, biliary, appendicitis]
  - front: "What are the differential diagnoses of an epigastric abdominal mass or pain?"
    back: "Cardiac: aortic dissection/ruptured AAA, MI, pericarditis\nGI: gastritis, GERD/esophagitis, PUD, pancreatitis, Mallory-Weiss tear\nMass: pancreatic adenocarcinoma/other neoplasms, pseudocyst; gastric tumour (adenocarcinoma, GIST); abdominal aortic aneurysm (pulsatile)\nNote: Pancreatitis can look like a 'stroll on the street' — a surgical masquerade that can be managed medically\n\nEpigastric pain is the most common presentation of PUD, pancreatitis, and GERD. The key priority is excluding cardiac and aortic causes (MI, aortic dissection) which require immediate intervention. An AAA presenting as a pulsatile epigastric mass is a surgical emergency if the patient is hemodynamically unstable."
    difficulty: medium
    tags: [epigastric pain, differential diagnosis, surgery, abdominal mass]
  - front: "What is early dumping syndrome and when does it occur?"
    back: "Early dumping syndrome occurs 15-30 minutes postprandially. It is caused by rapid emptying of hyperosmolar chyme into the jejunum, leading to jejunal distension and release of vasoactive hormones. Symptoms include epigastric cramping, bloating, nausea, vomiting, and vasomotor symptoms (dizziness, palpitations, tachycardia, diaphoresis).\n\nEarly dumping is a complication of gastric surgery (e.g., gastrectomy, pyloroplasty). The loss of the pyloric mechanism allows rapid delivery of hypertonic chyme, causing fluid shift into the intestinal lumen and neurohumoral release. Distinguishing early from late dumping is a common MCCQE1 test point."
    difficulty: easy
    tags: [dumping syndrome, postgastrectomy, gastric surgery, vasomotor symptoms]
  - front: "What is the treatment for early dumping syndrome?"
    back: "Frequent small meals high in fibre and protein, low in carbohydrates; avoid liquids with meals. Last resort is surgical interposition of an antiperistaltic jejunal loop between stomach and small bowel to delay gastric emptying.\n\nDietary modification is the cornerstone of management. Low-carbohydrate meals reduce the osmotic load delivered to the jejunum. Surgical options are reserved for refractory cases. Octreotide can also be used to slow gastric emptying."
    difficulty: easy
    tags: [dumping syndrome, postgastrectomy, dietary modification]
  - front: "What is late dumping syndrome and how is it treated?"
    back: "Late dumping occurs approximately 3 hours postprandially. Etiology is hypoglycemia following a postprandial insulin peak (reactive hypoglycemia). Treatment: small snack 2 hours after meals.\n\nLate dumping results from rapid absorption of glucose causing an exaggerated insulin response, followed by hypoglycemia. This contrasts with early dumping (vasomotor/GI symptoms from osmotic shift). Differentiating the two by timing is a key exam point."
    difficulty: easy
    tags: [dumping syndrome, late dumping, reactive hypoglycemia, postgastrectomy]
  - front: "What is blind-loop syndrome and how is it treated?"
    back: "Blind-loop syndrome is bacterial overgrowth of colonic Gram-negative bacteria in the afferent limb following gastric surgery (e.g., Billroth II). Features: anemia/weakness, diarrhea, malnutrition, abdominal pain, hypocalcemia. Treatment: broad-spectrum antibiotics and surgery (conversion to Billroth I).\n\nThe afferent limb in a Billroth II reconstruction can become a stagnant loop, allowing bacterial overgrowth. Bacteria deconjugate bile salts and consume vitamin B12, causing malabsorption and anemia. This is a classic postgastrectomy complication tested on MCCQE1."
    difficulty: medium
    tags: [blind-loop syndrome, bacterial overgrowth, postgastrectomy, Billroth II]
  - front: "What is the imaging strategy for suspected small bowel obstruction?"
    back: "CT scan with IV contrast is first-line if bowel obstruction is suspected. Once confirmed, perform 6 and 12-hour AXR after water-soluble contrast administration (diagnostic and often therapeutic). CT findings: discrete transition zone, proximal bowel dilation, distal decompression, intraluminal contrast failing to pass the transition zone. To rule out ischemia: look for pneumatosis intestinalis, thickened bowel wall, portal venous air, free intraperitoneal fluid, and differential wall enhancement.\n\nWater-soluble contrast has both diagnostic value (confirms obstruction) and therapeutic value (draws fluid into the bowel lumen, stimulating motility). CT scan is the gold standard for identifying the transition point and ruling out strangulation. MRI or U/S may be used in pregnancy."
    difficulty: medium
    tags: [small bowel obstruction, CT scan, imaging, strangulation]
  - front: "What are the clinical features of strangulated small bowel obstruction?"
    back: "Abdominal pain disproportionate to physical exam findings (hallmark of early intestinal ischemia); tachycardia, localized abdominal tenderness, fever, marked leukocytosis, and lactic acidosis.\n\nStrangulated obstruction implies vascular compromise of the bowel and is a surgical emergency. Classic teaching is that pain out of proportion to examination findings should prompt immediate concern for ischemia. Elevated lactate is a late sign. Radiologic signs include free air, closed-loop pattern, and high-density free fluid."
    difficulty: easy
    tags: [SBO, strangulation, ischemia, surgical emergency]
  - front: "What is the management of SBO in a patient without prior abdominal surgery ('virgin abdomen')?"
    back: "A patient with SBO and no prior abdominal surgery (virgin abdomen) should have surgery ASAP, EXCEPT in the case of malignant obstruction.\n\nWithout prior surgery, adhesions are not the cause; therefore, an occult hernia or malignancy is likely. These require operative exploration for definitive diagnosis and treatment. This is a key management distinction from patients with adhesive SBO who may be trialed conservatively."
    difficulty: medium
    tags: [SBO, virgin abdomen, surgical management]
  - front: "What is the initial treatment for small bowel obstruction?"
    back: "IV isotonic fluid resuscitation with urine output monitoring (Foley catheter); NG tube for gastric decompression (reduces nausea, distension, aspiration risk); NPO. For partial SBO or Crohn's-related: 48 hours of watchful waiting with frequent reassessment.\n\nSBO causes significant volume depletion through vomiting and third-spacing. Initial conservative management ('drip and suck') is appropriate for partial, non-strangulated obstruction. Failure to improve within 48 hours, or development of signs of ischemia, mandates surgical intervention."
    difficulty: easy
    tags: [SBO, management, NG tube, fluid resuscitation]
  - front: "What are the mortality rates for SBO by type?"
    back: "Non-strangulating SBO: <1% mortality. Strangulating SBO: ~8% mortality (rises to 25% if >36 hours delay). Ischemic SBO: up to 50% mortality.\n\nThese figures emphasize the urgency of identifying and treating strangulation or ischemia early. Time to surgery is the critical determinant of outcome in strangulated SBO. The dramatic increase in mortality with delayed treatment (>36 h) is a high-yield MCCQE1 teaching point."
    difficulty: easy
    tags: [SBO, prognosis, mortality, strangulation]
  - front: "What is paralytic ileus and how does it differ from small bowel obstruction on examination?"
    back: "Paralytic ileus is a temporary, reversible impairment of intestinal motility without mechanical obstruction. Causes include abdominal surgery, infection/inflammation, opiates, anesthetics, psychotropics, and electrolyte abnormalities. Unlike SBO (early hyperactive bowel sounds), ileus presents with diminished or absent bowel sounds. Pain is diffuse and non-colicky.\n\nDistinguishing ileus from mechanical obstruction is clinically important. In SBO, early bowel sounds are hyperactive as the gut tries to overcome the obstruction; in ileus, sounds are absent. The most useful clinical indicator of resolving ileus is passage of flatus. Postoperatively, small bowel recovers in 24-48 h, colon in 3-5 days."
    difficulty: easy
    tags: [paralytic ileus, bowel obstruction, postoperative, differential diagnosis]
  - front: "What are the AXR findings that help differentiate SBO from LBO from paralytic ileus?"
    back: "SBO: air-fluid levels, 'ladder' pattern (plicae circulares), proximal dilation >3 cm, no colonic gas. LBO: air-fluid levels, 'picture frame' appearance, proximal distension with distal decompression, no small bowel air if ileocecal valve is competent, coffee bean sign (sigmoid volvulus). Paralytic ileus: air throughout both small bowel and colon (generalized).\n\nThese AXR patterns reflect the anatomy of obstruction. The plicae circulares (valvulae conniventes) of the small bowel give the 'ladder' or 'stack of coins' appearance, while haustral folds of the colon give the 'picture frame' look. The coffee bean sign in sigmoid volvulus represents the distended, air-filled loop."
    difficulty: medium
    tags: [AXR, bowel obstruction, radiology, ileus, volvulus]
  - front: "What are the causes of intestinal ischemia?"
    back: "Acute: (1) Arterial occlusive mesenteric ischemia (AOMI) — thrombotic, embolic, or extrinsic compression (e.g., strangulating hernia); (2) Non-occlusive mesenteric ischemia (NOMI) — mesenteric vasoconstriction from systemic hypoperfusion; (3) Mesenteric venous thrombosis (MVT) — consider hypercoagulable state and DVT. Chronic: atherosclerotic disease (mesenteric angina).\n\nMesenteric ischemia has high mortality and requires prompt recognition. AOMI is most common; embolism often arises from atrial fibrillation or cardiac thrombus. NOMI occurs in critically ill patients (shock, sepsis). MVT requires hypercoagulability workup. The 'watershed' areas (splenic flexure, sigmoid) are most vulnerable in low-flow states."
    difficulty: medium
    tags: [mesenteric ischemia, AOMI, NOMI, MVT, intestinal ischemia]
  - front: "What is the hallmark clinical feature of acute intestinal ischemia and what is the gold standard investigation?"
    back: "Hallmark: severe abdominal pain out of proportion to physical findings (early sign). Also: vomiting, bloody diarrhea, minimal peritoneal signs early, progressing to hypotension, shock, and sepsis. Gold standard investigation: CT angiography for acute arterial ischemia.\n\nThe discrepancy between severe pain and benign abdominal exam is the classic teaching point. This 'pain out of keeping with physical findings' should immediately raise suspicion for ischemia. Lactate is a late, non-specific marker. CT angiography provides definitive vascular anatomy."
    difficulty: easy
    tags: [mesenteric ischemia, clinical features, CT angiography, acute abdomen]
  - front: "What is carcinoid syndrome and what are its features?"
    back: "Carcinoid syndrome occurs when carcinoid/GI NET tumours (usually midgut/ileal) metastasize to the liver and secrete serotonin, kinins, and vasoactive peptides directly into systemic circulation (bypassing hepatic inactivation). Features: flushing, diarrhea, right-sided heart failure (tricuspid/pulmonary valve disease), bronchoconstriction, and hypotension. Occurs in <10% of carcinoid tumours.\n\nLiver metastases are required for carcinoid syndrome because the liver normally inactivates serotonin from intestinal NETs. Primary tumours drain via the portal vein; once in the liver, they can release mediators into systemic circulation. Treatment includes octreotide (somatostatin analogue). Urinary 5-HIAA and serum chromogranin A are tumour markers."
    difficulty: medium
    tags: [carcinoid syndrome, GI NET, serotonin, flushing, right heart failure]
  - front: "What tumour markers are used for GI neuroendocrine tumours (NETs/carcinoids)?"
    back: "Serum chromogranin A (general NET marker); elevated 24-hour urinary 5-HIAA (5-hydroxyindoleacetic acid, a breakdown product of serotonin) or increased serum 5-HT. Nuclear medicine: Gallium DOTATATE PET scan and octreotide scan.\n\n5-HIAA is the most specific urine marker for carcinoid tumours. Chromogranin A is sensitive but less specific. DOTATATE PET scan exploits somatostatin receptor overexpression on NETs and has high sensitivity. False positives for 5-HIAA can occur with serotonin-rich foods (bananas, avocado) — patients must avoid these before testing."
    difficulty: medium
    tags: [carcinoid, GI NET, chromogranin A, 5-HIAA, tumour markers]
  - front: "What are the most common malignant tumours of the small intestine and their locations?"
    back: "1. Carcinoid/GI NET — most common; appendix 46%, distal ileum 28%, rectum 17%. 2. Adenocarcinoma — usually proximal small bowel (duodenum/proximal jejunum), risk with Crohn's/FAP/HNPCC. 3. Lymphoma — usually distal ileum; proximal jejunum in celiac disease; usually non-Hodgkin's. 4. Metastatic — most common site of GI metastases in melanoma patients; also breast, lung, kidney.\n\nSmall bowel malignancies are rare relative to colon cancer. Carcinoid tumours are the most common overall. Adenocarcinoma of the small bowel shares risk factors with colon cancer (FAP, HNPCC, IBD). Metastatic melanoma has a particular predilection for the small bowel via hematogenous spread."
    difficulty: medium
    tags: [small bowel tumours, carcinoid, adenocarcinoma, lymphoma, metastatic]
  - front: "What is short gut syndrome and what are the prognostic factors?"
    back: "Short gut syndrome is reduced small bowel surface area causing insufficient absorption, leading to diarrhea, malnutrition, and dehydration. Etiology: massive bowel resection (mesenteric ischemia, trauma, malignancy) or cumulative Crohn's resections; in children: NEC, abdominal wall defects, jejunoileal atresia, midgut volvulus. Prognostic factors: residual small bowel and colon length, remnant bowel health, presence of ileocecal valve. Key: ileum resection is less tolerated than jejunum (ileum reabsorbs bile salts and vitamin B12).\n\nThe ileocecal valve slows transit into the colon, allowing more reabsorption. Ileum is uniquely responsible for active bile salt and vitamin B12 absorption; loss leads to fat malabsorption and megaloblastic anemia. Residual colon length matters because the colon reabsorbs water and electrolytes."
    difficulty: medium
    tags: [short gut syndrome, small bowel resection, malabsorption, Crohns, ileocecal valve]
  - front: "What is the definition and classification of a hernia? Distinguish incarcerated from strangulated."
    back: "Hernia: defect in the abdominal wall causing abnormal protrusion of intra-abdominal contents. Incarcerated hernia: irreducible hernia, not necessarily strangulated. Strangulated hernia: vascular supply of protruded viscus is compromised (ischemia) — requires emergency repair. DO NOT attempt manual reduction if septic or if contents appear gangrenous (would reduce gangrenous bowel causing need for laparotomy).\n\nThe distinction between incarceration and strangulation is critical: strangulation implies ischemia and is a surgical emergency. Femoral hernias strangulate most readily due to their narrow neck, followed by indirect inguinal, then direct inguinal hernias. Richter's hernia involves only part of the bowel wall and may strangulate without causing complete obstruction."
    difficulty: easy
    tags: [hernia, incarcerated, strangulated, surgical emergency]
  - front: "What is Hesselbach's triangle and what passes through it?"
    back: "Hesselbach's triangle borders: lateral — inferior epigastric artery; inferior — inguinal ligament; medial — lateral margin of rectus sheath. Direct inguinal hernias pass through Hesselbach's triangle (medial to inferior epigastric artery). Indirect inguinal hernias originate lateral to the inferior epigastric artery at the deep inguinal ring.\n\nHesselbach's triangle defines the weak area of the posterior inguinal wall where direct hernias occur. The mnemonic MD vs. LI helps: Medial to inferior epigastric = Direct; Lateral to inferior epigastric = Indirect. This anatomical distinction is a classic MCCQE1 question."
    difficulty: easy
    tags: [Hesselbachs triangle, hernia, direct inguinal, indirect inguinal, anatomy]
  - front: "Compare direct, indirect, and femoral hernias (epidemiology, anatomy, etiology, prognosis)."
    back: "Direct inguinal: acquired weakness of transversalis fascia ('wear and tear'); through Hesselbach's triangle, medial to inferior epigastric artery; 1% of men; 3-4% recurrence. Indirect inguinal: congenital persistence of processus vaginalis; through deep inguinal ring, lateral to inferior epigastric artery, often descends into scrotum/labia majora; most common hernia in men and women; <1% recurrence. Femoral: passes into femoral canal below inguinal ligament, medial to femoral vein; mostly females; higher strangulation risk.\n\nIndirect inguinal hernias are the most common hernia overall in both sexes. Femoral hernias, while less common (5% of all hernias), carry the highest strangulation risk due to narrow femoral ring. Females with groin hernias are more likely to have femoral hernias than males. Strangulation order: femoral > indirect > direct."
    difficulty: medium
    tags: [inguinal hernia, femoral hernia, direct, indirect, hernia comparison]
  - front: "What is the epidemiology and lifetime risk of inguinal hernias?"
    back: "M:F = 9:1. Lifetime risk: males 20-25%, females 2%. Most common surgical disease in males. Frequency: 50% indirect inguinal, 25% direct inguinal, 8-10% incisional/ventral, 5% femoral, 3-8% umbilical. Indirect inguinal hernia is 5x more common than direct; 5-10x more common in males than females.\n\nThe male predominance is due to the patent processus vaginalis pathway (indirect) and the inguinal canal anatomy. The 'Rule of 5s' for indirect inguinal hernias: 5% lifetime incidence in males, 5x more common than direct inguinal, 5-10x more common in males than females."
    difficulty: easy
    tags: [inguinal hernia, epidemiology, incidence, hernia types]
  - front: "When is surgical repair indicated for inguinal hernias?"
    back: "Surgical repair is indicated to prevent strangulation and evisceration, for symptomatic relief, or for cosmesis. Asymptomatic hernias: observation is acceptable — prophylactic surgery does NOT reduce strangulation rate in asymptomatic patients. For symptomatic inguinal hernias: surgery recommended. Most repairs now use tension-free techniques with mesh.\n\nA landmark RCT showed watchful waiting is safe for minimally symptomatic inguinal hernias in men, with a 58% crossover rate to surgery at 7 years (mainly due to developing symptoms). The low acute strangulation risk (~0.002/year) supports conservative management in asymptomatic patients. Robotic repair offers no advantage over laparoscopic approach."
    difficulty: medium
    tags: [inguinal hernia, herniorrhaphy, mesh repair, watchful waiting, indications]
  - front: "What are the postoperative complications of inguinal hernia repair?"
    back: "Recurrence (15-20%): risk factors include recurrent hernia, age >50, smoking, BMI >25, ASA ≥3, T2DM, hyperlipidemia, immunosuppression, conditions increasing intra-abdominal pressure; less common with mesh. Scrotal hematoma (3%). Nerve entrapment: ilioinguinal nerve (numbness of inner thigh/lateral scrotum) or genital branch of genitofemoral nerve (in spermatic cord). Femoral vein stenosis/occlusion (acute leg swelling). Ischemic colitis.\n\nThe most clinically significant long-term complication is recurrence, which is reduced significantly with mesh/'tension-free' repair. Nerve injury is more common with open repair. The ilioinguinal nerve is most frequently injured. These complications must be discussed in preoperative consent (relevant to MCCQE1 ethics/consent topics)."
    difficulty: medium
    tags: [hernia repair, complications, nerve entrapment, recurrence, postoperative]
  - front: "What are the epidemiology, pathogenesis, and most common etiology of appendicitis?"
    back: "Epidemiology: 6% of population, M>F (1.4:1), 80% between ages 5-35. Pathogenesis: luminal obstruction → bacterial overgrowth → inflammation/swelling → increased pressure → localized ischemia → gangrene/perforation → abscess (walled off by omentum) or peritonitis. Etiology: children/young adults: lymphoid follicle hyperplasia (viral infection); adults: fecalith, fibrosis/stricture, or obstructing neoplasm.\n\nAppendicitis is the most common surgical emergency. The sequence of events (obstruction → infection → ischemia → perforation) explains why delay in treatment increases morbidity. Fecaliths are associated with worse outcomes (perforation, failure of antibiotic management). The appendix is retrocecal in 64% of people — relevant to atypical presentations."
    difficulty: easy
    tags: [appendicitis, epidemiology, pathogenesis, fecalith]
  - front: "What are the classic clinical features and signs of appendicitis?"
    back: "Classic progression: periumbilical dull poorly-localized pain → well-localized pain at McBurney's point (due to progression from visceral to parietal irritation). Anorexia, nausea, vomiting, low-grade fever (38°C). Signs: McBurney's sign (tenderness 1/3 distance from ASIS to umbilicus on right), Rovsing's sign (LLQ palpation causes RLQ pain), psoas sign (retrocecal appendix — pain on hip flexion against resistance or passive hyperextension), obturator sign (pelvic appendix — flexion then internal/external rotation of right hip causes pain).\n\nThe pain migration from periumbilical to RLQ reflects the transition from visceral (T10 dermatome, midgut origin) to parietal peritoneal irritation. The most reliable feature is progression of signs and symptoms over time. Different appendix positions produce different signs, which is why McBurney's sign is present regardless of appendix position (tests the cecal opening)."
    difficulty: easy
    tags: [appendicitis, clinical features, McBurneys sign, Rovsings sign, psoas sign, obturator sign]
  - front: "What is the investigation strategy for suspected appendicitis?"
    back: "Labs: CBC (mild leukocytosis with left shift; higher count with perforation), β-hCG (rule out ectopic pregnancy in females), urinalysis. Imaging: U/S first-line — overall accuracy 90-94%, can rule IN but CANNOT rule out appendicitis; if >6 mm: high sensitivity/specificity. CT scan: thick wall, enlarged (>6 mm), appendicolith, wall enhancement, inflammatory changes; accuracy 94-100%, optimal investigation. MRI: useful in pregnancy if U/S non-diagnostic.\n\nU/S is preferred initially (no radiation, rules out GYN causes), but limited by BMI and retrocecal position. CT is more reliable and is the standard for diagnostic uncertainty. A normal WBC does not exclude appendicitis. The β-hCG is mandatory in all females of reproductive age to exclude ectopic pregnancy, which can mimic appendicitis."
    difficulty: easy
    tags: [appendicitis, investigations, ultrasound, CT scan, leukocytosis]
  - front: "What is the current treatment approach for uncomplicated appendicitis vs. perforated appendicitis?"
    back: "Uncomplicated (non-perforated, no appendicolith): Appendectomy is gold standard (laparoscopic preferred). Perioperative antibiotics: cefazolin + metronidazole (perioperative dose adequate if uncomplicated). Antibiotic-only management is a safe alternative if no appendicolith (success rate 80-90%), but 15% risk of recurrent appendicitis within 1 year; not recommended if appendicolith present. Perforated: if abscess — radiologic drainage + 14 days antibiotics, possible interval appendectomy. If phlegmon only — antibiotics alone. Colonoscopy after age 50 to rule out neoplasm.\n\nAntibiotic-only treatment for uncomplicated appendicitis is supported by randomized evidence, with ~40-50% requiring appendectomy within 3-4 years. Appendicolithiasis is a contraindication to non-operative management. Laparoscopic appendectomy has lower wound infection rates than open. Interval appendectomy after drainage of periappendiceal abscess remains common practice."
    difficulty: medium
    tags: [appendicitis, appendectomy, antibiotics, perforated appendicitis, treatment]
  - front: "What is the danger threshold for cecal dilation in LBO and why?"
    back: "Cecal diameter ≥12 cm indicates increased risk of perforation. Closed-loop LBO (competent ileocecal valve, 80-90% of cases) leads to massive colonic distension, with maximal pressure in the cecum (Laplace's law: largest diameter = highest wall tension). Cecal tenderness + diameter ≥12 cm is an indication for urgent decompression.\n\nIn closed-loop LBO, the competent ileocecal valve creates a sealed segment. As the colon dilates, cecal pressure rises preferentially due to its large diameter. Perforation at the cecum carries 20% mortality. This contrasts with non-closed loop (incompetent valve), where colonic contents reflux into the ileum, reducing pressure."
    difficulty: medium
    tags: [LBO, cecal perforation, volvulus, surgical emergency, Laplaces law]
  - front: "What is Ogilvie's syndrome (colonic pseudo-obstruction) and how is it treated?"
    back: "Ogilvie's syndrome is acute colonic pseudo-obstruction: distension of the colon without mechanical obstruction, likely due to autonomic motor dysregulation. Common associations: trauma, infection, cardiac events (MI, CHF), narcotics, recent orthopedic/neurosurgery, electrolyte abnormalities (especially hypokalemia). Treatment: cecal diameter <12 cm — treat underlying cause, NPO, NG tube or colonoscopic decompression, supportive care for 72 h. Cecal diameter >12 cm with severe pain — colonoscopic decompression or neostigmine (cholinergic agent). Surgery (rare): stoma ± resection if perforation, ischemia, or failure of conservative management.\n\nNeostigmine is a key pharmacologic treatment for Ogilvie's syndrome — it stimulates colonic motility via cholinergic mechanisms. It should be used with cardiac monitoring due to risk of bradycardia. Most cases resolve with conservative management. This condition must be distinguished from mechanical LBO (CT scan is diagnostic)."
    difficulty: medium
    tags: [Ogilvies syndrome, colonic pseudo-obstruction, neostigmine, colonoscopic decompression, LBO]
  - front: "What are the specific types of named hernias (Richter's, Littre's, Amyand's, Spigelian)?"
    back: "Richter's hernia: only part of bowel circumference (antimesenteric border) is incarcerated/strangulated — may NOT cause complete obstruction, but can self-reduce with risk of leaving gangrenous bowel. Littre's hernia: involves Meckel's diverticulum. Amyand's hernia: contains the appendix. Spigelian hernia: ventral hernia through linea semilunaris. Pantaloon hernia: combined direct and indirect hernias with peritoneum draped over inferior epigastric vessels.\n\nThese named hernias are classic MCCQE1 recall questions. Richter's is the most clinically dangerous because partial bowel wall incarceration does not cause obstruction symptoms but carries full strangulation risk. The absence of obstructive symptoms in Richter's hernia can lead to delayed diagnosis of bowel gangrene."
    difficulty: medium
    tags: [Richters hernia, Littres hernia, Amyands hernia, Spigelian hernia, named hernias]
  - front: "What is Courvoisier's gallbladder sign and what does it suggest?"
    back: "Enlarged, palpable gallbladder with painless jaundice due to obstruction of the common bile duct (CBD). Suggestive of gallbladder or pancreatic malignancy (not gallstones, which cause a fibrotic, non-distensible gallbladder).\n\nCourvoisier's law states that painless jaundice with a palpable gallbladder is unlikely due to gallstones because chronic cholelithiasis causes gallbladder wall fibrosis. It points toward malignant biliary obstruction (gallbladder cancer or pancreatic head cancer)."
    difficulty: easy
    tags: [gallbladder, jaundice, malignancy, biliary obstruction]
  - front: "What is the treatment for gallbladder carcinoma confined to the mucosa vs. beyond the mucosa?"
    back: "Confined to mucosa: cholecystectomy alone. Beyond mucosa: cholecystectomy + en bloc wedge resection of 3-5 cm underlying liver + hepatoduodenal lymph node dissection.\n\nWhen gallbladder carcinoma is suspected preoperatively, open cholecystectomy should be used to avoid peritoneal seeding. Most are adenocarcinomas detected late, yielding a 5-year survival of only 20%."
    difficulty: medium
    tags: [gallbladder cancer, treatment, cholecystectomy]
