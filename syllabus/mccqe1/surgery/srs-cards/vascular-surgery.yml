# Vascular Surgery (Surgery) - generated from srs-mccqe1
cards:
  - front: "What is the ankle-brachial index (ABI) and how are its values interpreted?"
    back: "ABI = highest systolic foot pulse (dorsalis pedis or posterior tibialis) / systolic brachial pressure. Normal: 0.91-1.30. Mild PAD: 0.71-0.90. Moderate: 0.50-0.70. Severe: <0.50. >1.30: non-compressible vessel (calcification, common in DM).\n\nABI is the cornerstone investigation for confirming peripheral arterial disease. Values >1.30 suggest calcified arteries (common in diabetes) and toe-brachial index should be used instead. Critical limb-threatening ischemia is characterized by ankle pressure <50 mmHg, toe pressure <30 mmHg, and/or ABI <0.40 with 25% 1-year amputation and mortality risk."
    difficulty: easy
    tags: [vascular surgery, peripheral arterial disease, ABI, diagnosis]
  - front: "What is Leriche syndrome?"
    back: "Chronic aortoiliac occlusive disease presenting with a triad of: (1) claudication of buttocks and thighs, (2) absent femoral pulses, and (3) erectile dysfunction/impotence.\n\nLeriche syndrome results from atherosclerotic occlusion of the distal aorta and/or bilateral iliac arteries. The classic triad reflects compromised blood flow to the gluteal muscles, lower extremities, and internal pudendal arteries. Treatment options include aortobifemoral bypass grafting or endovascular revascularization."
    difficulty: medium
    tags: [vascular surgery, peripheral arterial disease, aortoiliac disease]
  - front: "What is the CEAP classification for venous disease and what clinical class indicates an active venous ulcer?"
    back: "CEAP classifies venous disease by Clinical (C0-C6), Etiological (congenital/primary/secondary), Anatomical (superficial/perforator/deep), and Pathophysiological (reflux/obstruction) categories. C6 = active venous ulcer.\n\nC0: no signs. C1: telangiectasia/reticular veins. C2: varicose veins. C3: edema. C4a: eczema/pigmentation. C4b: lipodermatosclerosis/atrophie blanche. C5: healed ulcer. C6: active ulcer. Venous ulcers are typically above the medial malleolus, shallow, wet/weeping, and relatively painless with irregular edges."
    difficulty: medium
    tags: [vascular surgery, chronic venous insufficiency, CEAP classification]
  - front: "What is the difference between primary and secondary lymphedema, and what is the leading cause of secondary lymphedema in North America?"
    back: "Primary: congenital or idiopathic lymphatic dysfunction (Milroy disease, lymphedema praecox, lymphedema tarda). Secondary: due to obstruction or damage of lymphatics. Leading cause in North America: iatrogenic from surgery/radiation (especially axillary lymph node dissection).\n\nLymphedema is progressive swelling due to impaired lymphatic drainage. Primary types present by age: congenital (<2), praecox (adolescence, 75% of primary cases), tarda (>35). Secondary causes include malignancy, surgery, radiation, infection, and chronic venous insufficiency. Patients with post-axillary dissection lymphedema are at increased risk for developing angiosarcoma."
    difficulty: easy
    tags: [vascular surgery, lymphedema, surgical complications]
  - front: "What are the indications for surgical management of symptomatic carotid stenosis based on the NASCET trial?"
    back: "70-99% stenosis: surgery recommended if perioperative morbidity/mortality risk <3% (ARR=16%, NNT=6). 50-69% stenosis: surgery may be considered (ARR=4.6%, NNT=22). <50%: best medical therapy. 100% occlusion: no surgical intervention.\n\nThe NASCET and ECST trials established guidelines for carotid endarterectomy in symptomatic stenosis. The benefit is greatest for 70-99% stenosis with NNT of 6. For asymptomatic stenosis (ACST/ACAS trials), surgical management may be considered for 60-99% stenosis in select patients (young, healthy, life expectancy >5 years) with perioperative risk <3%."
    difficulty: hard
    tags: [vascular surgery, carotid stenosis, NASCET, landmark trials]
  - front: "What is acute limb ischemia (ALI) and what is the time window for skeletal muscle survival?"
    back: "ALI is acute occlusion of a peripheral artery that often threatens limb viability, with symptom duration <2 weeks. Skeletal muscle can tolerate only 6 hours of total ischemia before irreversible damage occurs.\n\nALI tends to affect the lower extremity more than the upper, and femoropopliteal > aortoiliac segments. The most common cause of ALI is cardiogenic embolism (most often from atrial fibrillation). Paralysis with complete loss of sensation is a sign of late ischemia. Acute-on-chronic occlusion may have collateral flow that mitigates severity. Immediate unfractionated heparin (70-100 IU/kg bolus) is the first step in management."
    difficulty: easy
    tags: [acute limb ischemia, ALI, vascular surgery, arterial occlusion, ischemia]
  - front: "List the 6 Ps of acute limb ischemia."
    back: "Pain, Pallor, Polar/Poikilothermia (cold), Pulselessness, Paresthesia (late sign), Paralysis/Power loss (late sign, heralds impending non-salvageable limb).\n\nNot all 6 Ps need to be present. Pallor progresses to mottled cyanosis within hours. Pain may be absent in 20% of cases. Paresthesia (loss of light touch first) and paralysis are late signs indicating impending irreversible ischemia (Rutherford Category IIb-III). Absent arterial signals on Doppler ultrasound in the foot indicates a threatened limb."
    difficulty: easy
    tags: [acute limb ischemia, 6 Ps, vascular emergency, clinical features]
  - front: "How do you differentiate embolic from thrombotic causes of acute limb ischemia?"
    back: "Embolism: acute sudden onset (patient recalls exact moment), no prior claudication history, known embolic source (e.g., atrial fibrillation), normal contralateral limb pulses. Thrombosis: prior claudication history, prior vascular intervention/bypass, abnormal contralateral limb pulses, gradually progressive symptoms.\n\nEmbolism is more common than thrombosis overall and typically lodges at arterial bifurcations. Embolism causes more severe ischemia due to relative lack of collaterals. Cardiac causes of embolism include AF (most common), endocarditis, MI, LV aneurysm, cardiac myxoma, and paradoxical embolism via PFO. Treatment differs: embolectomy for embolus vs. thrombectomy + bypass + endovascular therapy for thrombosis."
    difficulty: medium
    tags: [acute limb ischemia, embolism, thrombosis, differentiation, atrial fibrillation]
  - front: "What is the Rutherford classification for acute limb ischemia and how does category IIb differ from III?"
    back: "Rutherford IIb (Immediately Threatened): Salvageable with immediate revascularization — sensory loss more than toes with rest pain, mild-to-moderate muscle weakness, cold with fixed mottling, arterial Doppler inaudible, venous Doppler audible. Rutherford III (Irreversible): Major tissue loss inevitable — profound anesthesia, paralysis with rigor, fixed mottling or gangrene, both arterial and venous Doppler inaudible.\n\nRutherford IIb requires emergency reperfusion. Category I (viable): not immediately threatened, all Doppler signals audible — can delay. Category IIa (marginally threatened): minimal sensory loss, prolonged capillary refill, arterial inaudible but venous audible — investigate before treating. Category III mandates primary amputation or palliation. Up to 10% chance of metachronous embolism; 40% 1-year mortality rate overall."
    difficulty: hard
    tags: [Rutherford classification, acute limb ischemia, vascular surgery, limb salvage]
  - front: "What are the key management principles for acute limb ischemia?"
    back: "Immediate unfractionated heparin (70-100 IU/kg bolus, infuse to PTT 70-90), IV fluids, analgesia, supplemental O2, urine output monitoring. Impaired neurovascular status → emergent revascularization (Rutherford IIb). Intact neurovascular status → time for workup including CTA. Post-operative: continue heparin, start oral anticoagulant when stable × 3 months.\n\nTreatment by etiology: embolus → embolectomy; thrombus → thrombectomy + bypass + endovascular; irreversible ischemia → primary amputation/palliation; arterial aneurysm → bypass/stent graft. Reperfusion complications include compartment syndrome (requires 4-compartment fasciotomy), rhabdomyolysis, renal failure, and cardiac arrhythmias. Prognosis: 40% 1-year mortality, 5-40% amputation rate."
    difficulty: hard
    tags: [acute limb ischemia, heparin, revascularization, embolectomy, management]
  - front: "Define peripheral arterial disease (PAD), chronic limb-threatening ischemia (CLTI), and claudication."
    back: "PAD: chronic ischemia due to inadequate arterial supply (predominantly atherosclerosis). Claudication: reproducible pain with exertion (usually calves), relieved within 5 minutes of rest. CLTI: severe PAD with rest pain/night pain for ≥2 weeks, and/or tissue loss (ulceration or gangrene), ankle pressure <50 mmHg, ABI <0.40.\n\nCLTI carries 25% risk of mortality and 25% risk of major amputation at 1 year. Vascular claudication is distinguished from neurogenic claudication (requires postural change to relieve) and MSK pain (variable relief). Leriche syndrome: chronic aortoiliac occlusion presenting with claudication of buttocks and thighs, and erectile dysfunction in males. Subclavian steal: retrograde vertebral artery flow from proximal subclavian stenosis causing arm and posterior circulation deficits."
    difficulty: medium
    tags: [PAD, peripheral arterial disease, claudication, CLTI, vascular surgery]
  - front: "What are the ankle-brachial index (ABI) cutoffs for diagnosing and grading peripheral arterial disease?"
    back: ">1.30: non-compressible vessel (calcification, common in DM). 0.91-1.30: normal. 0.71-0.90: mild PAD. 0.50-0.70: moderate PAD. <0.50: severe PAD.\n\nABI = highest systolic foot pulse (dorsalis pedis or posterior tibialis) ÷ systolic brachial pressure. In diabetics, calcified non-compressible vessels cause falsely elevated ABI (>1.3); toe-brachial index (TBI) is preferred in these patients. ABI is used to screen and confirm PAD diagnosis. Symptoms do not always correlate with ABI — a patient with ABI of 0.45 may be asymptomatic; intervention is guided by clinical presentation."
    difficulty: medium
    tags: [ABI, ankle-brachial index, PAD, peripheral arterial disease, diagnosis]
  - front: "What is the ABCDES mnemonic for PAD medical management?"
    back: "A: Antiplatelet (ASA, clopidogrel) + Anticoagulant (low-dose rivaroxaban) + ACEI/ARB. B: Beta-blocker (if indicated). C: Cholesterol management (statin, target LDL-C <2 mmol/L) + smoking Cessation. D: Diabetic control (target HbA1c <7%), diet/weight management. E: Exercise (3×/week, 30-45 min per session).\n\nStructured exercise programs (30-45 min, 3×/week) improve collateral circulation and muscle oxygenation. SGLT2 inhibitor is added if HbA1c >7%. Statin + icosapent ethyl is also recommended. Surgical intervention (revascularization) is indicated for severe lifestyle impairment, vocational impairment, or CLTI. Bypass graft options include saphenous vein graft (preferred) or synthetic (PTFE/Dacron). Not offered to asymptomatic patients."
    difficulty: medium
    tags: [PAD treatment, ABCDES, antiplatelet, statin, exercise]
  - front: "What is Leriche syndrome and what are its classic features?"
    back: "Leriche syndrome is chronic aortoiliac occlusive disease presenting with the triad of: (1) claudication of buttocks and thighs, (2) erectile dysfunction (in males), and (3) absent femoral pulses.\n\nIt results from thrombotic occlusion of the aorta or aortoiliac segment, most commonly from atherosclerosis. It can also result from rupture of an AAA, aortic dissection, or a large saddle embolism. Treatment includes aortofemoral bypass (anatomic) or axillofemoral/femorofemoral bypass (extra-anatomic, for higher-risk patients). Recognition is important as it is a potentially reversible cause of erectile dysfunction."
    difficulty: medium
    tags: [Leriche syndrome, aortoiliac occlusion, erectile dysfunction, claudication, vascular surgery]
  - front: "What is the Stanford classification of aortic dissection, and how does management differ between Type A and Type B?"
    back: "Type A: involves the ascending aorta — requires urgent cardiac surgical repair (perioperative mortality 17-22%; without surgery mortality is ~1%/hour for first 24h, 30% at 1 week, 80% at 2 weeks). Type B: involves aorta distal to left subclavian artery — managed medically (IV antihypertensives, target sBP 120 mmHg, HR <70 bpm) unless complicated by malperfusion or rupture.\n\nAcute dissection = <2 weeks; chronic >2 weeks. Most common cause is chronic uncontrolled HTN; others include Marfan syndrome, Ehlers-Danlos type IV, cystic medial necrosis, bicuspid aortic valve, coarctation, syphilis, Takayasu's arteritis. Type A can cause severe aortic insufficiency (unseating of aortic valve cusps), cardiac tamponade, and stroke. Type B with malperfusion or rupture is treated with TEVAR. With treatment, Type B: 60% 5-year survival."
    difficulty: hard
    tags: [aortic dissection, Stanford classification, Type A dissection, Type B dissection, TEVAR]
  - front: "What are the clinical features of Type A aortic dissection and how can it be differentiated from other emergencies?"
    back: "Sudden onset tearing chest or back pain radiating between scapulae; HTN; ischemic syndromes (MI if coronary involvement, stroke if carotid involvement, mesenteric ischemia, AKI, ischemic leg); new diastolic murmur of aortic insufficiency (20-30%); syncope; rupture causing cardiac tamponade or hemothorax.\n\nKey investigations: CTA (mainstay — determines type and extent), ECG (rule out MI, LV hypertrophy), CXR (widened mediastinum, hemothorax, apical pleural cap), TEE (rule out intracardiac thrombus). Consider lactate (ischemic gut), troponin (rule out MI), amylase (pancreatitis). Key distinguishing feature: pain described as 'tearing' and maximal at onset, vs. MI pain which often builds progressively."
    difficulty: hard
    tags: [aortic dissection, Type A, aortic insufficiency, cardiac tamponade, widened mediastinum]
  - front: "What are the Canadian Society of Vascular Surgery 2020 screening recommendations for abdominal aortic aneurysm (AAA)?"
    back: "Recommended: one-time ultrasound for all men ≥65 years; women aged 65-80 with smoking history or cardiovascular disease; individuals >55 who are first-degree relatives of a person with AAA. Not recommended: women >80 based on life expectancy and patient preference. Repeat ultrasound in 10 years if aortic diameter is 2.5-3 cm.\n\nAAA is defined as localized aortic dilatation >1.5× normal diameter (≥3 cm for abdominal aorta). 90-98% of AAAs are infrarenal. Classic ruptured AAA triad: abdominal/back pain + hypotension + pulsatile abdominal mass. 75% are asymptomatic. Surgical repair indicated for: ruptured, symptomatic, size >5.5 cm (men) or >5.0 cm (women), rapid growth ≥0.5 cm/6 months, saccular or mycotic aneurysm."
    difficulty: medium
    tags: [AAA, abdominal aortic aneurysm, screening, ultrasound, Canadian guidelines]
  - front: "What are the key risk factors for abdominal aortic aneurysm (AAA)?"
    back: "Modifiable: smoking (current or prior — strongest modifiable risk factor), HTN, hyperlipidemia. Non-modifiable: advanced age, male sex, White race, family history of AAA, presence of other large vessel aneurysms.\n\nEtiologies include degenerative (most common), traumatic, mycotic (Salmonella, Staphylococcus — usually suprarenal), connective tissue disorders (Marfan, Loeys-Dietz, Ehlers-Danlos type IV), vasculitis, infectious (syphilis causes luetic aneurysms of the ascending aorta), and congenital (Turner syndrome). Risk of rupture increases with size >5.5 cm, rapid growth, symptoms, HTN, COPD, smoking, and family history of rupture."
    difficulty: easy
    tags: [AAA, abdominal aortic aneurysm, risk factors, smoking, Marfan syndrome]
  - front: "What are the advantages and disadvantages of EVAR (endovascular aortic aneurysm repair) compared to open repair for AAA?"
    back: "EVAR advantages: lower perioperative morbidity and mortality, shorter procedure and recovery, less transfusion, fewer ICU admissions. EVAR disadvantages: endoleak rates 20-50%, device failure with longer follow-up, re-intervention rates 10-30%, life-long radiation surveillance needed, higher cost.\n\nEVAR1 trial (NEJM 2010) of 1252 patients with large AAA (≥5.5 cm): EVAR had lower 30-day operative mortality (1.8% vs. 4.3% for open repair), but no difference in overall long-term mortality. Graft-related complications and reinterventions were 3-4× higher with EVAR. For ruptured AAA, the IMPROVE trial showed endovascular strategy was associated with better outcomes and lower costs at 3 years."
    difficulty: hard
    tags: [EVAR, AAA repair, endovascular, open repair, EVAR1 trial]
  - front: "What is carotid stenosis and what are the clinical features of symptomatic carotid stenosis?"
    back: "Narrowing of the internal carotid artery lumen due to atherosclerotic plaque near the carotid bifurcation. Symptomatic features: TIA, ischemic stroke (hemispheric — contralateral to carotid lesion), or ocular presentation — amaurosis fugax or retinal artery ischemia (ipsilateral to lesion). Hollenhorst plaques (cholesterol emboli) may be seen on fundoscopy.\n\nRisk factors: HTN, smoking, DM, CVD, dyslipidemia, older age. Symptomatic carotid stenosis is defined as focal neurologic deficits referable to carotid artery distribution within the past 6 months with >50% stenosis. Ideally, surgical treatment should occur within 48 hours to 2 weeks of symptom onset. Investigations: carotid duplex U/S, CTA, or MRA to determine stenosis severity."
    difficulty: medium
    tags: [carotid stenosis, TIA, amaurosis fugax, carotid endarterectomy, stroke prevention]
  - front: "When is carotid endarterectomy (CEA) versus carotid artery stenting (CAS) indicated for carotid stenosis?"
    back: "CEA is the mainstay treatment for both symptomatic (>50%) and asymptomatic (>60-70%) carotid stenosis when surgical risk is acceptable (<3% perioperative morbidity/mortality). CAS is indicated when surgical access is poor, radiation-induced stenosis is present, or comorbidities increase surgical/anesthetic risk. CEA has higher MI risk; CAS has higher stroke risk in the periprocedural period.\n\nNASCET trial: CEA reduces stroke risk in symptomatic 50-69% stenosis (5-yr stroke rates 15.7% vs. 22.2%). CREST trial: no significant difference in 4-yr rates of stroke/MI/death between CAS and CEA (7.2% vs. 6.8%). ACST-1 trial: CEA reduced 10-year stroke risk in asymptomatic ≥60% stenosis. Asymptomatic stenosis <60-70%: BMT alone. 100% occlusion: BMT only (no surgical intervention). Dual antiplatelet therapy (ASA + clopidogrel) reduces stroke risk by ~25% relative risk reduction."
    difficulty: hard
    tags: [carotid endarterectomy, CEA, CAS, carotid stenting, NASCET, CREST]
  - front: "What did the MATCH trial demonstrate about dual antiplatelet therapy after ischemic stroke or TIA?"
    back: "The MATCH trial (Lancet 2004) showed that adding ASA to clopidogrel in patients with prior ischemic stroke or TIA did NOT reduce recurrence of ischemic events, but was associated with a significantly greater risk of major hemorrhage.\n\nMethods: 7,599 patients already on clopidogrel randomized to ASA or placebo. Primary endpoint event rate: 15.7% (ASA + clopidogrel) vs. 16.7% (clopidogrel alone) — not statistically significant. The bleeding risk increase outweighed any potential benefit. Therefore, dual antiplatelet therapy (ASA + clopidogrel) is not routinely recommended for long-term secondary stroke prevention; however, short-term dual therapy may be used in specific high-risk TIA/minor stroke situations."
    difficulty: hard
    tags: [MATCH trial, antiplatelet therapy, clopidogrel, ASA, stroke prevention]
  - front: "Define chronic venous insufficiency (CVI) and describe the CEAP classification system."
    back: "CVI is a wide spectrum of chronic venous disease causing edema, skin changes, varicosities, or leg ulcers. CEAP classification: C0 (no signs), C1 (telangiectasia/reticular veins), C2 (varicose veins), C3 (edema), C4a (eczema/pigmentation), C4b (lipodermatosclerosis/atrophie blanche), C5 (healed venous ulcer), C6 (active venous ulcer). S = symptomatic, A = asymptomatic.\n\nPrimary CVI (99% of cases) is caused by venous valve incompetence. Secondary CVI is caused by DVT, pelvic tumors, congenital anomalies, AV fistulae. Venous ulcers are characteristically located above the medial malleolus (gaiter area), shallow, wet/weeping, irregular edges, and relatively painless. First-line treatment is compression therapy; surgery is indicated if documented reflux at saphenofemoral/saphenopopliteal junction confirmed by Doppler and failed conservative treatment for >3 months."
    difficulty: medium
    tags: [chronic venous insufficiency, CEAP classification, venous ulcer, varicose veins, venous disease]
  - front: "What is lymphedema and what are the primary vs. secondary causes?"
    back: "Lymphedema is progressive swelling due to impaired lymphatic drainage resulting in accumulation of interstitial fluid and fibroadipose tissue. Primary causes: congenital (Milroy disease, Turner syndrome — age <2), lymphedema praecox (75% of primary cases, adolescence), lymphedema tarda (>35 years). Secondary causes (outside North America: filariasis leading cause worldwide; in North America: iatrogenic — axillary/groin lymphadenectomy, radiation).\n\nOther secondary causes: malignancy (axillary/groin/pelvic tumors), chronic venous insufficiency (high venous pressure), rheumatoid arthritis, dermatitis, psoriasis, sarcoidosis, cellulitis. Classic features: non-pitting edema, hyperkeratotic skin changes, positive Stemmer sign (inability to lift skin fold at base of 2nd toe/finger). Most definitive test: lymphoscintigraphy. Patients with lymphedema after axillary lymph node dissection are at increased risk for angiosarcoma."
    difficulty: medium
    tags: [lymphedema, primary lymphedema, secondary lymphedema, filariasis, Milroy disease]
  - front: "What is the Stemmer sign and what does a positive result indicate?"
    back: "The Stemmer sign is the examiner's inability to lift the skin fold at the base of the second toe (or finger). A positive Stemmer sign (failure to lift thickened skin) is a sensitive indicator of lymphedema.\n\nLymphedema classically presents with non-pitting edema (unlike CVI which has pitting edema early), hyperkeratotic cutaneous/subcutaneous changes, impaired limb mobility, and psychological distress. Treatment is mainly conservative: compression bandages (intensive phase) and garments (maintenance), manual lymph drainage therapy, elevation, skin hygiene. Lymphoscintigraphy is the gold standard diagnostic test. Surgery is reserved for advanced disease: lymphovenous bypass (physiological, early disease) or reductive surgery (advanced disease)."
    difficulty: medium
    tags: [Stemmer sign, lymphedema, non-pitting edema, diagnosis, vascular surgery]
  - front: "What did the BASIL-2 trial demonstrate about revascularization strategy for chronic limb-threatening ischemia (CLTI)?"
    back: "BASIL-2 (Lancet 2023) showed that a 'best endovascular treatment first' strategy was associated with better amputation-free survival compared to 'vein bypass first' in CLTI patients requiring infra-popliteal revascularization (HR 1.35 for vein bypass vs. endovascular; p=0.037).\n\nThis was in contrast to earlier assumptions that bypass surgery would be superior. Most common causes of death in both groups were cardiovascular and respiratory. The BEST-CLI trial (NEJM 2022) provided additional nuance: in CLTI patients WITH a suitable high-quality saphenous vein, surgical revascularization was superior (HR 0.68, p<0.0001); in patients WITHOUT a suitable vein (cohort 2), outcomes were similar between strategies (HR 0.79, p=0.12)."
    difficulty: hard
    tags: [BASIL-2, CLTI, endovascular, bypass surgery, limb ischemia]
  - front: "What did the VOYAGER trial demonstrate about rivaroxaban in peripheral arterial disease?"
    back: "VOYAGER (NEJM 2020) demonstrated that rivaroxaban plus ASA significantly reduced the risk of acute limb ischemia, major amputation, MI, ischemic stroke, or death compared to ASA alone in patients with PAD who had undergone lower-extremity revascularization (17.3% vs. 19.9%, HR 0.85, p=0.009), with a trend toward increased major bleeding.\n\nThis established low-dose rivaroxaban (2.5 mg twice daily) combined with ASA as standard care post-revascularization in PAD. The primary safety outcome (major bleeding) was higher with rivaroxaban (2.65% vs. 1.87%, HR 1.43, p=0.07) but was not statistically significant. This supported the use of antithrombotic combination therapy in high-risk PAD patients and is reflected in the ABCDES treatment framework for PAD."
    difficulty: hard
    tags: [VOYAGER trial, rivaroxaban, PAD, peripheral arterial disease, anticoagulation]
  - front: "What are the hypercoagulable states (inherited and acquired) that predispose to acute limb ischemia and DVT?"
    back: "Inherited: protein C deficiency, protein S deficiency, antithrombin deficiency, Factor V Leiden mutation, prothrombin gene mutation, Factor VIII elevation. Acquired: age, obesity, smoking, immobility, cancer, pregnancy/oral contraceptives, antiphospholipid antibody syndrome, nephrotic syndrome (acquired protein C and S deficit), sickle cell disease, hyperhomocysteinemia.\n\nVirchow's Triad — hypercoagulability, stasis of flow, and endothelial injury — underlies thrombus formation in acute limb ischemia and VTE. HITT (heparin-induced thrombocytopenia with thrombosis) is an important iatrogenic cause. Antiphospholipid antibody syndrome causes both arterial and venous thrombosis. Factor V Leiden is the most common inherited thrombophilia in the general population."
    difficulty: medium
    tags: [hypercoagulability, Virchows triad, Factor V Leiden, antiphospholipid syndrome, thrombophilia]
  - front: "What is the ESCHAR2 trial's finding about superficial venous surgery plus compression for venous leg ulcers?"
    back: "ESCHAR2 (BMJ 2007) showed that superficial venous surgery plus compression significantly reduced ulcer recurrence at 4 years (31% vs. 56% with compression alone, p<0.01), but did NOT reduce ulcer healing time (93% vs. 89% healed at 3 years, p=0.73).\n\nKey takeaway: superficial venous surgery prevents recurrence but does not accelerate healing. Compression therapy alone is effective for healing venous ulcers. Surgery should be added to reduce recurrence after healing. Surgery is indicated when: documented reflux at saphenofemoral/saphenopopliteal junction, failed conservative treatment >3 months, or complications of varicosities. Long-term 10-year postoperative recurrence rate is 20%."
    difficulty: hard
    tags: [ESCHAR2, venous ulcer, superficial venous surgery, compression therapy, ulcer recurrence]
  - front: "What is the treatment for Type B aortic dissection without complications, and what are the target hemodynamic parameters?"
    back: "Medical management: intravenous antihypertensives titrated to systolic BP target of 120 mmHg (measured by arterial line) and HR <70 bpm in a critical care setting. First-line: alpha and beta blocker (e.g., labetalol); non-dihydropyridine CCB (e.g., diltiazem) if beta-blockers contraindicated; IV nitroglycerin as second-line. ACEI/vasodilators if insufficient control.\n\nLess than 10-20% of Type B dissections require urgent operation for complications. After initial stabilization, patients may transition to oral medications. Selective intervention (TEVAR or surgical) is for complications, refractory symptoms, or progression. Type B dissection with malperfusion (spinal, mesenteric, renal, limb) or aortic rupture warrants TEVAR. Long-term complication: aneurysmal degeneration of the aorta. With treatment: 60% 5-year survival, 40% 10-year survival."
    difficulty: hard
    tags: [aortic dissection, Type B, labetalol, antihypertensive, hemodynamic management]
  - front: "What is the difference between a true aneurysm and a pseudoaneurysm (false aneurysm)?"
    back: "True aneurysm: localized dilatation involving all vessel wall layers (intima, media, adventitia). Pseudoaneurysm (false aneurysm): breach in intima/media that allows blood to collect between media and adventitia — does NOT involve all layers.\n\nAneurysm shape classifications: fusiform (concentric, involves full circumference) vs. saccular (eccentric, involves only a portion — theoretically higher rupture risk due to unequal pressure distribution). AAA is defined as aortic diameter ≥3 cm (>1.5× normal). Aneurysms can rupture, thrombose, embolize, erode, and fistulize. Pseudoaneurysms often result from trauma, anastomotic breakdown, or arterial access complications."
    difficulty: easy
    tags: [aneurysm, pseudoaneurysm, true aneurysm, fusiform, saccular]
  - front: "What are the indications for surgical management of asymptomatic carotid stenosis?"
    back: "Surgical management (CEA or CAS) for asymptomatic stenosis is indicated for 60-70% or greater stenosis when: the surgeon's perioperative morbidity/mortality risk is <3%, the patient is young and otherwise healthy, there is progression of disease, ocular ischemic syndrome is present, or life expectancy is >5 years. For 60-99% asymptomatic stenosis: ARR = 1-3%, NNT ≈ 33.\n\nThe ACST-1 trial (Lancet 2010) showed immediate CEA in asymptomatic patients with ≥60% stenosis reduced 10-year stroke risk (10.8% vs. 16.9% for deferred CEA, p=0.0004). The ACST-2 trial (Lancet 2021) comparing CAS vs. CEA in asymptomatic ≥60% stenosis showed similar 5-year outcomes for fatal/disabling stroke. Key principle: asymptomatic stenosis <60% → BMT only; 100% occlusion → BMT only (no surgical intervention)."
    difficulty: hard
    tags: [carotid stenosis, asymptomatic, CEA, surgical indications, ACST trial]
