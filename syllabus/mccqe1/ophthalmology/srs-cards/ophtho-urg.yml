# Ophthalmologic Emergencies (Ophthalmology) - generated from srs-mccqe1
cards:
  - front: "A 68-year-old man suddenly develops unilateral painless loss of vision described as \"a curtain coming down.\" Fundoscopy shows a white, edematous retina with a cherry red spot at the macula. What is the diagnosis?"
    back: "Central retinal artery occlusion (CRAO)\n\nCRAO is an ocular emergency — irreversible ischemic damage occurs within 90–100 minutes. Cherry red spot = preserved choroidal circulation at fovea against pale ischemic background. Management (controversial efficacy): ocular massage, IOP lowering, emergent ophthalmology. Evaluate for cardioembolic source (AF, carotid stenosis)."
    difficulty: hard
    tags: [CRAO, central-retinal-artery-occlusion, cherry-red-spot, painless-vision-loss, ocular-emergency]
  - front: "What is the treatment for acute angle-closure glaucoma?"
    back: "Immediate IOP lowering: IV acetazolamide + topical beta-blocker (timolol) + topical alpha-agonist (apraclonidine) + pilocarpine; definitive: laser peripheral iridotomy\n\nAcute angle-closure presents with severe eye pain, blurred vision, halos around lights, red eye, dilated fixed pupil, corneal edema, and nausea/vomiting. IOP may be >50 mmHg. Avoid mydriatics. Urgent ophthalmology consult."
    difficulty: hard
    tags: [acute-angle-closure-glaucoma, IOP, acetazolamide, pilocarpine, laser-iridotomy]
  - front: "A 25-year-old contact lens wearer presents with a painful red eye, photophobia, and a white corneal infiltrate. What is the diagnosis and emergency management?"
    back: "Bacterial (or Acanthamoeba) keratitis; stop contact lens use, urgent ophthalmology consult, topical fluoroquinolone (ciprofloxacin or ofloxacin drops hourly)\n\nCorneal ulcer in a contact lens wearer is an ocular emergency. Pseudomonas is common in contact lens-associated keratitis. Acanthamoeba should be suspected in pool water/tap water exposure. Corneal scraping for culture before antibiotics."
    difficulty: hard
    tags: [keratitis, corneal-ulcer, contact-lens, Pseudomonas, fluoroquinolone]
  - front: "A 70-year-old diabetic patient with proliferative retinopathy develops sudden painless dense vision loss with inability to see fundus on examination. What is the most likely cause?"
    back: "Vitreous hemorrhage from neovascularization rupture\n\nVitreous hemorrhage obscures the view of the fundus (\"black eye\" view). Urgent B-scan ultrasound confirms diagnosis and rules out retinal detachment. Treatment: observation (often clears spontaneously), or vitrectomy if persistent. Panretinal photocoagulation to treat underlying neovascularization."
    difficulty: medium
    tags: [vitreous-hemorrhage, diabetic-retinopathy, neovascularization, vitrectomy, panretinal-photocoagulation]
  - front: "What are the signs of a ruptured globe and what is the immediate management?"
    back: "Hypotony, peaked/teardrop pupil, chemosis, subconjunctival hemorrhage 360°, uveal prolapse; management: rigid eye shield, NPO, IV antibiotics, emergent ophthalmology for repair\n\nNever apply pressure to a suspected ruptured globe — can expulse intraocular contents. Give tetanus prophylaxis, IV cefazolin + gentamicin (or ciprofloxacin). CT orbits (not MRI if metallic FB suspected). OR within hours."
    difficulty: hard
    tags: [ruptured-globe, ocular-trauma, teardrop-pupil, eye-shield, emergency-surgery]
  - front: "What is the classic presentation of giant cell arteritis (temporal arteritis) and what is the immediate management to prevent vision loss?"
    back: "Age >50, temporal headache, jaw claudication, scalp tenderness; ESR >50; immediate high-dose prednisone 1 mg/kg/day (60 mg) before biopsy\n\nGCA can cause ischemic optic neuropathy leading to permanent blindness. If visual symptoms are present, use IV methylprednisolone 500–1000 mg/day × 3 days. Temporal artery biopsy within 2 weeks (steroids do not negate biopsy findings within 2 weeks)."
    difficulty: hard
    tags: [giant-cell-arteritis, temporal-arteritis, vision-loss, prednisone, temporal-artery-biopsy]
  - front: "What is a relative afferent pupillary defect (RAPD) and what does it indicate?"
    back: "Asymmetric pupillary light reflex: when light is swung to affected eye, both pupils dilate instead of constricting (Marcus Gunn pupil); indicates optic nerve or severe retinal disease in that eye\n\nRAPD is detected by the swinging flashlight test. It indicates unilateral or asymmetric bilateral optic nerve disease (optic neuritis, CRAO, severe glaucoma). A normal RAPD rules out significant afferent pathway damage on the examined side."
    difficulty: medium
    tags: [RAPD, afferent-pupillary-defect, Marcus-Gunn, optic-neuritis, swinging-flashlight]
  - front: "What are the classic features of acute angle-closure glaucoma?"
    back: "Acute eye pain, headache, nausea/vomiting, blurred vision with halos, fixed mid-dilated pupil, elevated IOP (>40mmHg), red eye, corneal edema\n\nEmergency: topical timolol + pilocarpine + brimonidine, IV acetazolamide, IV mannitol if refractory. Definitive: laser peripheral iridotomy. Treat prophylactically the other eye. Avoid mydriatics."
    difficulty: medium
    tags: [glaucoma, acute]
  - front: "What are the symptoms and management of retinal detachment?"
    back: "Flashes (photopsia), floaters, curtain/shadow across vision. Painless. Urgent ophthalmology referral within 24h\n\nRhegmatogenous (most common): retinal tear. Risk factors: myopia, prior cataract surgery, trauma. Treatment: pneumatic retinopexy, scleral buckle, or vitrectomy."
    difficulty: medium
    tags: [retinal detachment]
  - front: "How is acute angle-closure glaucoma diagnosed and managed?"
    back: "Presentation: severe eye pain, headache, nausea, halos around lights, mid-dilated fixed pupil, red eye, IOP >40mmHg, hazy cornea. Emergency treatment: timolol 0.5% + pilocarpine 2% + IV acetazolamide 500mg + mannitol if needed. Definitive: laser PI\n\nAACG is an ophthalmologic EMERGENCY - permanent vision loss if untreated. Shallow anterior chamber is risk factor. Avoid mydriatic drugs in at-risk patients. Fellow eye prophylactic laser PI. Occurs in dim light (pupil dilates, iris blocks angle)."
    difficulty: hard
    tags: [acute angle-closure, glaucoma, emergency]
  - front: "What are the symptoms and management of retinal detachment?"
    back: "Symptoms: floaters, flashes (photopsia), curtain/shadow in visual field. Types: rhegmatogenous (most common, retinal tear), tractional (diabetic), exudative (inflammatory). Treatment: URGENT ophthalmology - surgical repair (pneumatic retinopexy, scleral buckle, vitrectomy)\n\nRisk factors: myopia, prior cataract surgery, trauma, lattice degeneration. Macula-on detachment: surgical emergency same day (better prognosis). Macula-off: urgent within 1-7 days. New floaters/flashes always warrant dilated fundus exam to rule out retinal tear."
    difficulty: hard
    tags: [retinal detachment, floaters, surgery]
  - front: "How are chemical eye burns managed?"
    back: "IMMEDIATE copious irrigation with NS or water for at least 30 minutes before ANY other assessment. Check pH (target 7.0-7.4). Alkali worse than acid (penetrates deeper). Urgent ophthalmology. Morgan lens for continuous irrigation\n\nDo NOT delay irrigation for anything - this is the single most important intervention. Remove contact lenses and particulate matter. Alkali: liquefactive necrosis, penetrates. Acid: coagulative, self-limiting. Grade by limbal blanching and corneal clarity (Roper-Hall). Cycloplegic + topical antibiotic after irrigation."
    difficulty: hard
    tags: [chemical burn, eye, irrigation]
  - front: "What is the approach to a painful red eye?"
    back: "Emergencies: acute angle closure (fixed mid-dilated pupil), corneal ulcer (hypopyon), uveitis (consensual photophobia), endophthalmitis, orbital cellulitis, chemical burn. Urgent: acute glaucoma, retinal detachment symptoms, globe rupture\n\nDifferentiate: conjunctivitis (diffuse, discharge), episcleritis (sectoral, mild), scleritis (deep boring pain, violaceous), keratitis (photophobia, fluorescein uptake), iritis/uveitis (consensual photophobia, cells/flare). Always check visual acuity, pupil exam, IOP, slit lamp."
    difficulty: medium
    tags: [red eye, differential, ophthalmology]
  - front: "How is central retinal artery occlusion (CRAO) diagnosed and managed?"
    back: "Presentation: painless sudden monocular vision loss, APD, pale retina with cherry-red spot, boxcar segmentation of vessels. Emergency: <6h - consider intra-arterial tPA (limited evidence), ocular massage, lower IOP, workup for embolic source\n\nCRAO is an ophthalmic stroke equivalent. 90-minute tolerance before irreversible damage. Emergent workup: carotid doppler, ECG, echocardiogram, ESR/CRP (giant cell arteritis). If GCA suspected: immediate high-dose steroids to protect fellow eye. Prognosis poor."
    difficulty: hard
    tags: [CRAO, vision loss, cherry-red spot]
  - front: "How is temporal (giant cell) arteritis managed to prevent visual loss?"
    back: "ESR often >50, CRP elevated. Do NOT wait for temporal artery biopsy to start treatment. Prednisone 60-80mg daily (or IV methylpred if visual symptoms). Biopsy within 2 weeks (remains positive on steroids). Taper over 1-2 years\n\nGCA: age >50, new headache, jaw claudication, scalp tenderness, PMR symptoms. Risk of bilateral blindness if untreated. Temporal artery biopsy is gold standard but skip lesions cause false negatives (long specimen, bilateral if needed). ASA 81mg added."
    difficulty: hard
    tags: [giant cell arteritis, temporal arteritis, prednisone]
  - front: "How is anterior uveitis (iritis) diagnosed and managed?"
    back: "Presentation: eye pain, photophobia (including CONSENSUAL), perilimbal injection, small pupil (miosis), cells/flare in anterior chamber on slit lamp. Treatment: topical steroids (prednisolone acetate) + cycloplegic (cyclopentolate)\n\nConsensual photophobia (pain when light in OTHER eye) is pathognomonic for uveitis. HLA-B27 associated (ankylosing spondylitis, reactive arthritis, IBD, psoriatic arthritis). Workup for recurrent: HLA-B27, CXR (sarcoidosis), syphilis, TB. Ophthalmology referral."
    difficulty: hard
    tags: [uveitis, iritis, HLA-B27]
  - front: "How is orbital cellulitis differentiated from preseptal and how is it managed?"
    back: "Preseptal: eyelid swelling/erythema, normal vision/motility/no proptosis. Oral antibiotics. Orbital: proptosis, painful EOM, decreased vision, chemosis, fever. Emergency: CT orbits, IV antibiotics (ceftriaxone + metronidazole or cloxacillin), ophthalmology/ENT\n\nOrbital cellulitis most commonly from sinusitis extension. Complications: subperiosteal abscess (may need surgical drainage), cavernous sinus thrombosis (bilateral signs, CN III/IV/VI palsies), intracranial abscess. Preseptal in children <5 may be from bacteremia (Hib now rare with vaccination)."
    difficulty: hard
    tags: [orbital cellulitis, preseptal, CT]
  - front: "What is the management of corneal abrasion vs corneal ulcer?"
    back: "Abrasion: fluorescein uptake without infiltrate. Treat: topical antibiotic (erythromycin or fluoroquinolone), avoid patching (no benefit). Ulcer: white infiltrate visible, may have hypopyon. URGENT: corneal cultures then hourly fortified topical antibiotics\n\nContact lens wearers: fluoroquinolone coverage (Pseudomonas risk). Never use topical steroids without ophthalmology guidance (worsens infectious keratitis). Corneal ulcer is a vision-threatening emergency. Acanthamoeba keratitis in CL wearers: severe pain, ring infiltrate."
    difficulty: medium
    tags: [corneal abrasion, corneal ulcer, fluorescein]
  - front: "What is the approach to sudden painless vision loss?"
    back: "Vascular: CRAO (pale retina, cherry-red spot), CRVO (flame hemorrhages, cotton-wool spots), vitreous hemorrhage (diabetic). Non-vascular: retinal detachment (curtain), optic neuritis (pain with movement, APD), wet AMD (metamorphopsia)\n\nAll require urgent/emergent ophthalmology. CRAO: stroke workup + consider thrombolysis. CRVO: monitor for neovascularization, anti-VEGF if macular edema. Optic neuritis: MRI brain for MS. Wet AMD: anti-VEGF injections. Amaurosis fugax: same workup as TIA."
    difficulty: hard
    tags: [vision loss, CRAO, CRVO, differential]
  - front: "What are the red eye differentials and their distinguishing features?"
    back: "Conjunctivitis: diffuse injection, discharge, normal vision. Uveitis: ciliary flush, photophobia, miosis. Acute glaucoma: fixed mid-dilated pupil, severe pain, halos. Keratitis: fluorescein uptake, painful. Scleritis: deep boring pain, violaceous\n\nImmediate ophthalmology referral: acute angle closure, sudden vision loss, penetrating injury, chemical burn, orbital cellulitis. Do NOT patch corneal abrasions. Contact lens keratitis needs Pseudomonas coverage."
    difficulty: medium
    tags: [red eye, differential]
  - front: "What is the differential diagnosis of the acute red eye and how do you distinguish the key causes?"
    back: "Conjunctivitis: diffuse conjunctival injection, discharge (purulent=bacterial, watery=viral, itchy+watery=allergic), normal vision, normal pupil, no pain. Uveitis (anterior): ciliary flush (perilimbal injection), photophobia, consensual pain, small/irregular pupil, cells+flare on slit lamp. Keratitis: pain, photophobia, tearing, fluorescein uptake (dendritic=HSV, round=bacterial), ciliary flush. Acute angle-closure glaucoma: severe pain, halos around lights, mid-dilated fixed pupil, rock-hard eye (IOP >40), corneal edema/haze, nausea/vomiting. Scleritis: deep boring pain (worse at night), violaceous hue, tenderness to palpation, associated with RA/GPA. Subconjunctival hemorrhage: painless, bright red, benign (unless recurrent → check BP, coagulopathy).\n\nRed flags requiring urgent ophthalmology referral: decreased visual acuity, severe pain, photophobia, fixed/irregular pupil, corneal opacity, suspected penetrating injury. In Canadian EDs, slit lamp examination and IOP measurement are standard for evaluating the red eye. Never prescribe topical steroids without ophthalmology consultation (can worsen HSV keratitis and glaucoma)."
    difficulty: hard
    tags: [red eye, conjunctivitis, uveitis, glaucoma, keratitis, ophthalmology]
  - front: "How should chemical eye burns be managed and why are alkali burns more dangerous than acid burns?"
    back: "Immediate management: 1) Copious irrigation with normal saline or water for minimum 30 minutes (do NOT delay for assessment); 2) Check pH after irrigation — continue until pH 7.0-7.4 (check at 5-minute intervals); 3) Remove any particulate matter (evert lids); 4) Topical anesthetic for pain/cooperation; 5) After irrigation: visual acuity, slit lamp exam (corneal clarity, limbal ischemia, conjunctival blanching), IOP. Alkali burns are MORE dangerous: cause liquefactive necrosis — alkali penetrates deeply and progressively, continuing to damage cornea, anterior chamber, and lens. Acid burns cause coagulative necrosis — the coagulum limits further penetration (except hydrofluoric acid). Urgent ophthalmology referral for all chemical burns.\n\nCommon alkali agents: lye (NaOH), ammonia, cement/lime (CaOH). Common acids: battery acid (H2SO4), pool chemicals. Limbal ischemia (blanching of limbal vessels) is the most important prognostic sign — indicates stem cell damage and poor visual prognosis. The Roper-Hall classification grades severity based on corneal clarity and limbal involvement."
    difficulty: hard
    tags: [chemical eye burn, alkali, acid, irrigation, emergency, ophthalmology]
  - front: "A 72-year-old presents with sudden painless loss of vision in one eye. Fundoscopy shows a pale retina with a cherry-red spot at the macula. What is the diagnosis and management?"
    back: "Central retinal artery occlusion (CRAO). Presentation: sudden painless monocular vision loss, RAPD (relative afferent pupillary defect), pale/edematous retina with cherry-red spot (fovea appears red against pale ischemic retina due to underlying choroidal circulation). Management: this is an ophthalmic STROKE equivalent — 90-minute window for potential intervention; immediate measures: ocular massage, anterior chamber paracentesis (lower IOP to dislodge embolus), intra-arterial thrombolysis (at select centres); urgent stroke workup: carotid Doppler, ECG/Holter, echocardiogram, CBC, ESR (GCA in elderly — check urgently). If ESR elevated or GCA suspected: start high-dose IV methylprednisolone immediately to protect the other eye.\n\nCRAO causes retinal infarction analogous to ischemic stroke — retinal neurons are irreversibly damaged within 90-120 minutes. The cherry-red spot is a classic finding because the fovea is thin and the underlying choroidal blood supply shows through. Always check ESR/CRP to rule out GCA (giant cell arteritis) — bilateral blindness can result if untreated."
    difficulty: hard
    tags: [CRAO, cherry red spot, painless vision loss, stroke, GCA, ophthalmology]
  - front: "What are the key features of acute angle-closure glaucoma and its emergency management?"
    back: "Presentation: sudden severe eye pain, blurred vision with halos around lights, red eye (ciliary flush), mid-dilated fixed pupil (non-reactive), rock-hard globe on palpation, corneal edema/haze, IOP >40 mmHg (normal 10-21), nausea/vomiting (can mimic acute abdomen). Risk factors: hyperopia, shallow anterior chamber, older age, Asian descent, female sex. Emergency management: 1) Topical timolol 0.5% (reduces aqueous production); 2) Topical pilocarpine 2% (constricts pupil, opens drainage angle — may not work until IOP lowered); 3) Topical apraclonidine 1%; 4) Oral/IV acetazolamide 500 mg (reduces aqueous production); 5) IV mannitol if refractory; 6) Urgent ophthalmology for laser peripheral iridotomy (definitive treatment — both eyes). Avoid: mydriatics (atropine, tropicamide).\n\nAcute angle-closure glaucoma accounts for ~10% of glaucoma but causes more rapid vision loss than open-angle glaucoma. Medications that dilate the pupil (anticholinergics, sympathomimetics) can precipitate attacks in predisposed individuals. Laser iridotomy is performed on BOTH eyes (prophylactic on the fellow eye). Canadian ophthalmology guidelines recommend same-day ophthalmology consultation."
    difficulty: hard
    tags: [acute angle-closure glaucoma, IOP, pilocarpine, iridotomy, emergency, ophthalmology]
  - front: "What is the approach to HSV keratitis and why must topical steroids be avoided?"
    back: "HSV keratitis: presents with eye pain, photophobia, tearing, blurred vision, red eye. Classic finding: dendritic ulcer on fluorescein staining (branching pattern with terminal bulbs). Treatment: topical antiviral — trifluridine 1% drops q2h or oral valacyclovir 500 mg TID for 7-14 days. Topical steroids are CONTRAINDICATED in epithelial HSV keratitis — steroids suppress local immune response, allowing viral replication and progressive corneal destruction, leading to corneal perforation and permanent vision loss. Exception: stromal HSV keratitis (deeper) may require steroids WITH concurrent antiviral — but only under ophthalmology supervision.\n\nHSV keratitis is the leading infectious cause of corneal blindness in developed countries. The dendritic ulcer is pathognomonic. Recurrences are common (~50% within 2 years). This is why slit lamp examination and fluorescein staining are critical before prescribing topical steroids for any red eye — a common exam point in Canadian licensing exams."
    difficulty: hard
    tags: [HSV keratitis, dendritic ulcer, topical steroids, fluorescein, ophthalmology]
  - front: "What are the signs and symptoms of acute angle-closure glaucoma?"
    back: "Unilateral red, painful eye; decreased visual acuity; halos around lights; fixed, mid-dilated pupil; shallow anterior chamber; marked increase in intraocular pressure (~40 mmHg); cells in anterior chamber.\n\nAcute angle-closure glaucoma is an ophthalmic emergency where aqueous humor drainage is blocked by pupillary block, causing IOP to rise rapidly. It typically occurs in older patients with narrow angles, often triggered by dim lighting or mydriatic drops. Immediate treatment prevents permanent vision loss."
    difficulty: medium
    tags: [acute angle-closure glaucoma, ophthalmology, emergency, IOP, red eye]
  - front: "What is the mnemonic for medications used to treat acute angle-closure glaucoma?"
    back: "AABCDE/EAT PAL: Alpha-agonist (epinephrine), Alpha-2 agonist (apraclonidine), Beta-blocker (timolol), Cholinomimetic (pilocarpine), Diuretic (acetazolamide), Eicosanoid (latanoprost). Definitive treatment: laser iridotomy by ophthalmology.\n\nMultiple agents with different mechanisms simultaneously lower IOP in acute angle-closure glaucoma. Pilocarpine constricts the pupil to open the angle; timolol and acetazolamide reduce aqueous production; apraclonidine reduces aqueous production and increases outflow. Laser peripheral iridotomy is definitive."
    difficulty: hard
    tags: [acute angle-closure glaucoma, pilocarpine, timolol, acetazolamide, iridotomy]
  - front: "What are the features of retinal detachment and its management?"
    back: "Features: flashes of light, floaters, curtain/shadow of blackness (peripheral vision loss), painless, loss of red reflex, decreased IOP, grey detached areas on fundoscopy, RAPD. POCUS: 94% sensitive, 96% specific. Management: urgent ophthalmology consult for scleral buckle or pneumatic retinopexy.\n\nRetinal detachment is a vision-threatening emergency. The classic triad of flashes (photopsia from vitreous traction), floaters (vitreous hemorrhage or cells), and curtain (progressive visual field loss) should prompt immediate ophthalmology consultation. POCUS can rapidly identify detachment in the ED."
    difficulty: medium
    tags: [retinal detachment, ophthalmology, emergency, POCUS, flashes floaters]
  - front: "What is the management of central retinal artery occlusion?"
    back: "Restore blood flow within 2 hours. Interventions: globe massage (dislodge embolus), decrease IOP (topical β-blockers, inhaled O2/CO2 mix, IV acetazolamide/Diamox, IV mannitol, drain aqueous fluid). Urgent ophthalmology consult.\n\nCentral retinal artery occlusion presents as sudden, painless, monocular vision loss with RAPD, cherry red spot (fovea preserved by choroidal circulation) and retinal pallor on fundoscopy. It is effectively an 'eye stroke'—the 2-hour reperfusion window is analogous to cardiac and brain ischemia."
    difficulty: hard
    tags: [retinal artery occlusion, ophthalmology, emergency, cherry red spot, vision loss]
  - front: "What is the 'blood and thunder' appearance on fundoscopy and what does it indicate?"
    back: "Diffuse retinal hemorrhages, cotton wool spots, venous engorgement, swollen optic disc, and macular edema — pathognomonic for central retinal VEIN occlusion.\n\nIn retinal vein occlusion, venous drainage obstruction causes backup of blood into the retinal capillaries, producing flame-shaped hemorrhages in all quadrants ('blood and thunder'). Unlike retinal artery occlusion, there is no cherry red spot. Management includes ophthalmology consult for laser photocoagulation, anti-VEGF injections, or corticosteroid injection."
    difficulty: medium
    tags: [retinal vein occlusion, ophthalmology, fundoscopy, blood and thunder]
  - front: "What is orbital cellulitis and how is it managed?"
    back: "Infection behind the orbital septum causing: red painful eye, decreased visual acuity, proptosis, ophthalmoplegia, RAPD, lid erythema/edema, conjunctival chemosis, headache, fever. Management: admission, ophthalmology consult, orbital CT, blood cultures, IV antibiotics (ceftriaxone + vancomycin), surgical drainage of abscess if needed.\n\nOrbital cellulitis is a true emergency distinguished from pre-septal (periorbital) cellulitis by proptosis, pain with eye movement, restricted extraocular movements, and visual changes. It often results from sinusitis (ethmoid sinus most commonly). IV antibiotics and urgent imaging are required."
    difficulty: medium
    tags: [orbital cellulitis, ophthalmology, emergency, proptosis, antibiotics]
  - front: "What are the red eye symptoms and their possible serious etiologies?"
    back: "Light sensitivity: iritis, keratitis, abrasion, ulcer. Unilateral + light sensitivity: + herpes simplex, acute angle-closure glaucoma. Significant pain: + scleritis. White spot on cornea: corneal ulcer. Non-reactive pupil: glaucoma, iritis. Copious discharge: gonococcal conjunctivitis. Blurred vision: all of the above.\n\nA systematic approach to red eye identifies high-risk features requiring urgent evaluation. Copious purulent discharge in a sexually active patient must prompt Gram stain and culture for gonorrhea, which can cause corneal perforation within 24-48 hours if untreated."
    difficulty: medium
    tags: [red eye, differential diagnosis, ophthalmology, emergency]
  - front: "What is the management of chemical burns to the eye?"
    back: "Copious irrigation with normal saline with eyelid retracted using Morgan lens until neutral pH is achieved. Then: sweep the fornices (to remove particles), cycloplegic drops, topical antibiotics. Ophthalmology consult. Alkali burns are worse than acid burns.\n\nAlkali (base) causes liquefactive necrosis that penetrates deeply into the anterior segment. Acid causes coagulative necrosis (coagulated protein acts as a barrier, limiting penetration). Immediate and prolonged irrigation (minimum 20-30 minutes) is the most critical intervention. Check pH with litmus paper to confirm neutralization."
    difficulty: medium
    tags: [chemical burn, eye, alkali, irrigation, ophthalmology]
