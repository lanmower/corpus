# Diabetes Mellitus Management (Endocrinology) - generated from srs-mccqe1
cards:
  - front: "A 52-year-old obese patient with fasting glucose 7.8 mmol/L and HbA1c 7.4% (57 mmol/mol) on two separate occasions. Diagnosis and initial management?"
    back: "Type 2 diabetes mellitus; first-line: lifestyle modification (diet, exercise, weight loss) + metformin unless contraindicated\n\nCDA/Diabetes Canada 2018 guidelines diagnose T2DM with: fasting glucose ≥7.0 mmol/L, random glucose ≥11.1 mmol/L, 2h OGTT ≥11.1 mmol/L, or HbA1c ≥6.5% — confirmed with a second test unless symptomatic. Metformin reduces HbA1c by 1-1.5%."
    difficulty: medium
    tags: [type 2 diabetes, diagnosis, metformin, HbA1c, endocrinology]
  - front: "What are the HbA1c targets in diabetes management per Diabetes Canada guidelines?"
    back: "Most adults: HbA1c ≤7.0%; if high hypoglycemia risk or frail elderly: ≤8.0-8.5%; if low hypoglycemia risk with shorter duration and multiple risk factors: ≤6.5%\n\nDiabetes Canada guidelines individualize HbA1c targets. Tighter control (≤7%) reduces microvascular complications (retinopathy, nephropathy, neuropathy). Looser control in elderly or hypoglycemia-prone patients. UKPDS and DCCT support intensive control."
    difficulty: easy
    tags: [HbA1c target, glycemic control, Diabetes Canada, type 2 diabetes, endocrinology]
  - front: "Which class of antidiabetic agents reduces cardiovascular mortality in T2DM patients with established CVD?"
    back: "SGLT2 inhibitors (empagliflozin, canagliflozin, dapagliflozin) and GLP-1 receptor agonists (liraglutide, semaglutide) have cardiovascular outcome benefit — SGLT2i preferred with HF or CKD; GLP-1 RA preferred with atherosclerotic CVD\n\nDiabetes Canada guidelines recommend SGLT2 inhibitor or GLP-1 RA as second-line after metformin for patients with established CVD, HF, or CKD — regardless of glycemic control. EMPA-REG, CANVAS, LEADER, SUSTAIN-6 trials established these benefits."
    difficulty: medium
    tags: [SGLT2 inhibitors, GLP-1 receptor agonist, cardiovascular benefit, T2DM, empagliflozin, endocrinology]
  - front: "A 25-year-old with type 1 diabetes has nausea, abdominal pain, blood glucose 28 mmol/L, blood gases pH 7.18, bicarbonate 10 mmol/L, ketones 4+. Diagnosis and immediate management?"
    back: "Diabetic ketoacidosis (DKA); immediate IV regular insulin infusion (0.1 units/kg/h), IV isotonic saline, potassium replacement (before insulin if K+ <3.5), identify and treat precipitant\n\nDKA diagnostic criteria: glucose >14 mmol/L (may be normal in euglycemic DKA), ketonemia/ketonuria, pH <7.30, bicarbonate <15 mmol/L. Fluid deficit is 3-5L. Insulin drip continued until anion gap closed. Transition to subcutaneous insulin with overlap."
    difficulty: hard
    tags: [DKA, diabetic ketoacidosis, insulin, potassium, endocrinology]
  - front: "What is hyperosmolar hyperglycemic state (HHS) and how does it differ from DKA?"
    back: "HHS: glucose >33 mmol/L, osmolality >320 mOsm/kg, minimal ketones, no significant acidosis (pH >7.30) — occurs in T2DM; DKA: significant ketosis and acidosis, occurs in T1DM (and T2DM)\n\nHHS has higher mortality than DKA (5-20% vs <1%). Fluid deficit larger (8-10L). Correct volume deficit first, then reduce glucose slowly (5 mmol/L/h). Insulin infusion at lower rates. Heparin prophylaxis for DVT risk."
    difficulty: hard
    tags: [HHS, hyperosmolar hyperglycemic state, DKA, hyperglycemia, endocrinology]
  - front: "A T1DM patient has recurrent hypoglycemic episodes. What is hypoglycemia unawareness and how is it managed?"
    back: "Hypoglycemia unawareness: loss of autonomic warning symptoms due to recurrent hypoglycemia; manage by strict hypoglycemia avoidance (higher glucose targets for 2-3 weeks to restore awareness) and CGM\n\nDiabetes Canada guidelines recommend continuous glucose monitoring (CGM) and insulin pump therapy (CSII) for T1DM patients with hypoglycemia unawareness to reduce severe hypoglycemia. Relaxing glycemic targets temporarily restores counter-regulatory response."
    difficulty: hard
    tags: [hypoglycemia unawareness, T1DM, CGM, insulin pump, endocrinology]
  - front: "What screening does Diabetes Canada recommend for complications of diabetes?"
    back: "Annual: HbA1c q3months until stable then q6months, annual urine ACR and eGFR, annual dilated eye exam (ophthalmology), foot exam at every visit, lipid profile and BP annually\n\nDiabetes Canada guidelines recommend systematic monitoring for microvascular (retinopathy, nephropathy, neuropathy) and macrovascular complications. Eye exam within 5 years of T1DM onset; at diagnosis for T2DM. Monofilament testing for peripheral neuropathy."
    difficulty: easy
    tags: [diabetes complications screening, annual monitoring, ACR, retinopathy, Diabetes Canada, endocrinology]
  - front: "What medications should be avoided or used with caution in T2DM with CKD?"
    back: "Metformin: hold if eGFR <30, reduce dose if eGFR 30-45; SGLT2 inhibitors: less effective eGFR <45 but cardioprotective; avoid certain sulfonylureas (glibenclamide — renal clearance); adjust insulin doses\n\nCDA/Diabetes Canada guidelines provide drug-specific guidance by eGFR level. SGLT2 inhibitors (specifically canagliflozin and dapagliflozin) have nephroprotective effects at eGFR 25-60. Metformin lactic acidosis risk in renal failure."
    difficulty: medium
    tags: [diabetes and CKD, metformin, SGLT2i, renal dosing, endocrinology]
  - front: "What is the Somogyi effect vs. the dawn phenomenon in diabetes?"
    back: "Somogyi effect (disputed): rebound hyperglycemia after nocturnal hypoglycemia; Dawn phenomenon: physiologic early morning hyperglycemia from GH and cortisol surge — both cause high morning glucose\n\nDawn phenomenon is well-established; Somogyi effect is controversial. Differentiation: check 3 AM glucose — low (Somogyi/nocturnal hypoglycemia) vs. normal (dawn phenomenon). Treatment: dawn phenomenon → increase evening basal insulin or use CSII."
    difficulty: medium
    tags: [Somogyi effect, dawn phenomenon, morning hyperglycemia, T1DM, endocrinology]
  - front: "What is the mechanism of metformin and its main contraindications?"
    back: "Metformin decreases hepatic gluconeogenesis (reduces hepatic glucose production); contraindications: eGFR <30, active liver disease, heart failure requiring hospitalization, metabolic acidosis\n\nMetformin does not cause hypoglycemia when used alone. It reduces HbA1c 1-1.5%, is weight-neutral, and has CV benefits (UKPDS). Hold metformin perioperatively and 48h after IV contrast if AKI risk. Vitamin B12 deficiency with long-term use."
    difficulty: easy
    tags: [metformin, mechanism, contraindications, T2DM, endocrinology]
  - front: "What are the benefits and adverse effects of SGLT2 inhibitors in T2DM?"
    back: "Benefits: HbA1c reduction 0.5-1%, weight loss, BP reduction, SGLT2i CV and renal benefits; side effects: genital mycotic infections, UTI, DKA (euglycemic DKA — especially with fasting/surgery), volume depletion, lower limb amputations (canagliflozin)\n\nDiabetes Canada guidelines recommend SGLT2 inhibitors for patients with T2DM and CVD, HF, or CKD. Hold 3-4 days before surgery to prevent euglycemic DKA. Genital infections more common in women."
    difficulty: medium
    tags: [SGLT2 inhibitors, side effects, genital mycotic, euglycemic DKA, endocrinology]
  - front: "A T2DM patient on metformin + glyburide has a blood glucose of 2.1 mmol/L after skipping lunch. What is the immediate treatment and long-term adjustment?"
    back: "Hypoglycemia: immediate treatment with 15g fast-acting carbohydrate (glucose tablets, juice); recheck in 15 min; long-term: switch from glyburide to lower-risk agent (SGLT2i, DPP4i) or reduce glyburide dose\n\nSulfonylureas (especially glyburide) cause prolonged hypoglycemia due to long duration of action. Elderly patients and those with irregular meals or CKD are at highest risk. DPP4 inhibitors, SGLT2i, and GLP-1 RA have lower hypoglycemia risk."
    difficulty: hard
    tags: [hypoglycemia, sulfonylurea, glyburide, 15g rule, endocrinology]
  - front: "What are the diagnostic criteria for pre-diabetes?"
    back: "Impaired fasting glucose: fasting glucose 6.1-6.9 mmol/L; Impaired glucose tolerance: 2h OGTT 7.8-11.0 mmol/L; HbA1c 6.0-6.4% (42-46 mmol/mol)\n\nDiabetes Canada recommends lifestyle intervention (weight loss ≥5-7%, 150 min/week moderate exercise) for pre-diabetes — reduces progression to T2DM by 58% (DPP trial). Metformin is an option for high-risk pre-diabetes patients."
    difficulty: easy
    tags: [pre-diabetes, IFG, IGT, HbA1c, endocrinology]
  - front: "What is the recommended approach to diabetes management in pregnancy?"
    back: "Type 1/2 DM in pregnancy: insulin is the only recommended agent (oral agents except metformin are not approved); tight glycemic targets (fasting <5.3, 1h post-meal <7.8, 2h <6.7 mmol/L)\n\nGestational diabetes mellitus (GDM) is diagnosed by 75g OGTT at 24-28 weeks. Initial management: medical nutrition therapy; add insulin if targets not met within 2 weeks. Metformin acceptable as second-line in GDM per Diabetes Canada/SOGC."
    difficulty: hard
    tags: [diabetes in pregnancy, GDM, gestational diabetes, insulin, SOGC, endocrinology]
  - front: "What is the target blood pressure in patients with diabetes and hypertension?"
    back: "BP target <130/80 mmHg in diabetes per Diabetes Canada and Hypertension Canada — ACEi or ARB preferred agents for nephroprotection\n\nTight BP control in diabetes reduces stroke, MI, and nephropathy progression. ACCORD-BP trial: SBP target <120 vs. <140 — no CV mortality reduction but lower stroke rates with tighter control. CDA recommends individualized targets."
    difficulty: easy
    tags: [diabetes hypertension, BP target, ACE inhibitor, nephroprotection, endocrinology]
  - front: "A patient with T2DM on metformin has HbA1c 8.4% despite maximum metformin dose. What is the preferred second-line agent if they have established CVD?"
    back: "SGLT2 inhibitor (empagliflozin, canagliflozin) or GLP-1 receptor agonist (liraglutide, semaglutide) — both have proven cardiovascular mortality reduction in established CVD\n\nDiabetes Canada 2022 guidelines prioritize SGLT2i and GLP-1 RA as second-line agents for patients with established CVD, HF, or CKD. The choice between them is guided by comorbidities: SGLT2i preferred with HF/CKD, GLP-1 RA preferred with high ASCVD risk."
    difficulty: medium
    tags: [T2DM second-line, SGLT2i, GLP-1 RA, established CVD, empagliflozin, endocrinology]
  - front: "What are the microvascular complications of diabetes and how are they prevented?"
    back: "Retinopathy (leading cause of blindness in adults), nephropathy (leading cause of ESKD), neuropathy (peripheral: burning/numbness, autonomic: gastroparesis, orthostatic hypotension); prevented by tight glycemic control and BP management\n\nDCCT (T1DM) and UKPDS (T2DM) trials established that HbA1c reduction significantly reduces microvascular complications. Every 1% HbA1c reduction reduces retinopathy risk by 35-40%, nephropathy by 25-35%. ACEi/ARB nephroprotective in diabetic nephropathy."
    difficulty: easy
    tags: [diabetic microvascular, retinopathy, nephropathy, neuropathy, endocrinology]
  - front: "What is the treatment of diabetic peripheral neuropathy pain?"
    back: "First-line: duloxetine (SNRI) or pregabalin/gabapentin; second-line: tricyclic antidepressants (amitriptyline), venlafaxine; topical capsaicin or lidocaine for localized pain\n\nTight glycemic control is the primary prevention strategy. Pregabalin (FDA-approved for DPN), duloxetine (FDA-approved), and amitriptyline (off-label but effective) are first-line options per Diabetes Canada pain guidelines. Opioids are not recommended."
    difficulty: medium
    tags: [diabetic neuropathy, pain management, pregabalin, duloxetine, amitriptyline, endocrinology]
  - front: "What are the screening criteria for type 2 diabetes in Canada?"
    back: "Screen adults ≥40 years every 3 years with fasting glucose or HbA1c; screen at any age with risk factors: obesity (BMI ≥30), first-degree family history, high-risk ethnicity (South Asian, African, Indigenous, Hispanic), prior GDM, prediabetes, CVD, medications causing hyperglycemia\n\nDiabetes Canada 2022 guidelines recommend risk-stratified screening. CANRISK questionnaire can identify high-risk individuals. High-risk ethnic groups have higher T2DM prevalence and lower BMI thresholds."
    difficulty: easy
    tags: [T2DM screening, Diabetes Canada, CANRISK, high-risk ethnicity, endocrinology]
  - front: "What is the sick day management protocol for T1DM patients?"
    back: "Never stop insulin during illness; increase blood glucose monitoring (q2-4h), check ketones, maintain hydration, adjust insulin dose; insulin requirements typically INCREASE during illness\n\nIllness, stress, and infection cause insulin resistance requiring more insulin. DKA commonly triggered by missed insulin doses or insufficient sick-day management. Diabetes Canada sick day rules: check glucose and ketones q4h, maintain at least basal insulin, seek care if vomiting prevents oral intake or ketones are rising."
    difficulty: medium
    tags: [sick day management, T1DM, insulin, illness, DKA prevention, endocrinology]
  - front: "What are DKA diagnostic criteria?"
    back: "Glucose>14, pH<7.30, bicarb<18, AG>12, positive ketones\n\nManage: IV fluids, insulin 0.1U/kg/hr, K replacement when<5.3. Switch subQ when AG closes and eating."
    difficulty: medium
    tags: [DKA]
  - front: "How does HHS differ from DKA?"
    back: "HHS: glucose>33.3, osm>320, minimal ketosis, pH>7.30. More dehydration (8-12L), higher mortality\n\nMore aggressive fluids. Lower insulin dose. Correct Na for glucose: add 1.6 per 5.6mmol/L above normal."
    difficulty: hard
    tags: [HHS, DKA]
  - front: "What is CDA approach to T2DM glycemic management?"
    back: "A1C<=7%. Metformin+lifestyle. Add SGLT2i or GLP-1RA if CVD/HF/CKD. Then other agents.\n\nSGLT2i preferred for HF/CKD. GLP-1RA for ASCVD. Insulin if A1C>10% or symptomatic."
    difficulty: medium
    tags: [T2DM, CDA]
  - front: "What are the key differences between DKA and HHS?"
    back: "DKA: Type 1 (or 2), glucose 14-30, pH <7.3, bicarb <18, AG >12, ketones positive, mental status variable. HHS: Type 2, glucose >33.3, pH >7.3, bicarb >18, minimal ketones, Osm >320, profound dehydration, altered mental status. HHS mortality higher (5-20% vs 1-5%).\n\nDKA results from absolute insulin deficiency → lipolysis → ketogenesis. HHS results from relative insulin deficiency sufficient to prevent ketosis but not hyperglycemia → severe osmotic diuresis → dehydration. Both: precipitated by infection, non-adherence, new-onset DM. Some patients have overlap (ketosis-prone T2DM)."
    difficulty: hard
    tags: [DKA, HHS, diabetes, emergency, endocrinology]
  - front: "What is the DKA management protocol?"
    back: "1) IV NS 1-1.5 L/h first hour. 2) Insulin: regular insulin 0.1 U/kg bolus then 0.1 U/kg/h infusion (or 0.14 U/kg/h no bolus). 3) Potassium: if K <3.3 hold insulin, replace K first; if 3.3-5.3 add 20-40 mEq/L to fluids; if >5.3 monitor q2h. 4) When glucose <14: switch to D5+½NS, reduce insulin to 0.02-0.05 U/kg/h.\n\nResolution criteria: glucose <11.1, pH >7.3, bicarb >18, AG ≤12. Overlap SC basal insulin 2h before stopping IV insulin to prevent rebound DKA. Bicarbonate ONLY if pH <6.9 (100 mmol NaHCO3). Monitor glucose q1h, lytes q2-4h. Cerebral edema risk in children — avoid aggressive fluid resuscitation."
    difficulty: hard
    tags: [DKA, insulin, protocol, potassium, IV fluids, endocrinology]
  - front: "What are the Diabetes Canada A1C targets and when should they be individualized?"
    back: "Most adults with T2DM: A1C ≤7.0%. Functional elderly or those at risk of hypoglycemia: ≤8.0-8.5%. Type 1 or newly diagnosed young T2DM without CV disease: consider ≤6.5% if safely achievable. Pregnancy: ≤6.5% preconception, ≤6.1% in pregnancy.\n\nDiabetes Canada 2024 guidelines emphasize individualized targets. UKPDS showed microvascular benefit of intensive control in T2DM. ACCORD showed increased mortality with A1C <6.0% target in high-CV-risk patients — hence relaxed targets for complex/elderly patients. A1C unreliable in conditions affecting RBC lifespan (hemolysis, transfusion, CKD)."
    difficulty: medium
    tags: [diabetes, A1C, targets, Diabetes Canada, individualized, endocrinology]
  - front: "What is the Diabetes Canada pharmacotherapy algorithm for T2DM?"
    back: "Step 1: Metformin + lifestyle (unless A1C >1.5% above target → start dual). If CV disease: add SGLT2i or GLP-1 RA regardless of A1C. If CKD: add SGLT2i. If heart failure: add SGLT2i. Step 2: add second agent based on clinical profile. Insulin if A1C remains above target.\n\nDiabetes Canada 2024 prioritizes cardiorenal-protective agents (SGLT2i, GLP-1 RA) for patients with established CVD, CKD, or HF — independent of A1C. GLP-1 RA preferred if weight loss desired (semaglutide, liraglutide). DPP-4i: weight-neutral, no CV benefit. TZDs: weight gain, edema, fractures. SUs: hypoglycemia risk, weight gain."
    difficulty: hard
    tags: [diabetes, T2DM, metformin, SGLT2i, GLP-1, Diabetes Canada, endocrinology]
  - front: "What are the mechanisms and side effects of SGLT2 inhibitors?"
    back: "Mechanism: block sodium-glucose cotransporter 2 in proximal tubule → glycosuria → lowers glucose, weight (2-3 kg), BP (3-5 mmHg), reduces intraglomerular pressure. Side effects: genital mycotic infections, UTI, euglycemic DKA, volume depletion, Fournier gangrene (rare), amputations (canagliflozin).\n\nSGLT2i (empagliflozin, dapagliflozin, canagliflozin) have proven CV benefit (EMPA-REG, CANVAS) and renal protection (CREDENCE, DAPA-CKD). Euglycemic DKA: rare but dangerous, triggered by illness/surgery — hold perioperatively 3 days before. Approved for HFrEF and CKD regardless of diabetes status."
    difficulty: hard
    tags: [diabetes, SGLT2i, empagliflozin, dapagliflozin, mechanism, endocrinology]
  - front: "What insulin regimens are used in T2DM and T1DM?"
    back: "T2DM: start basal insulin (glargine/detemir/degludec) at 10 U or 0.1-0.2 U/kg, titrate by 2-4 U q3-4 days to fasting target. Add prandial (rapid-acting) if needed. T1DM: basal-bolus (MDI) or insulin pump (CSII). Total daily dose ~0.5-1.0 U/kg; 50% basal, 50% bolus divided across meals.\n\nDiabetes Canada recommends insulin initiation when A1C >1.5% above target or symptomatic hyperglycemia. Basal insulin analogues (glargine, degludec) preferred over NPH (less hypoglycemia, more predictable). Insulin degludec has longest duration (>42h) and lowest hypoglycemia. ICR (insulin-to-carb ratio) and ISF (correction factor) used for bolus dosing in T1DM."
    difficulty: hard
    tags: [diabetes, insulin, basal-bolus, glargine, T1DM, T2DM, endocrinology]
  - front: "What are the microvascular complications of diabetes and their screening protocols?"
    back: "Retinopathy: dilated eye exam at diagnosis T2DM (5 yrs T1DM), then annually. Nephropathy: ACR + eGFR annually from diagnosis T2DM (5 yrs T1DM). Neuropathy: 10g monofilament + 128Hz tuning fork annually. Foot exam annually.\n\nDiabetes Canada screening recommendations: retinopathy screening can be extended to q2 years if consistently normal. Albuminuria first detected → confirm with repeat in 3 months. ACEi/ARBs for confirmed albuminuria (ACR >2 men, >2.8 women) regardless of BP. SGLT2i added for cardiorenal protection. Tight glycemic + BP control prevents/slows all microvascular complications."
    difficulty: medium
    tags: [diabetes, complications, retinopathy, nephropathy, neuropathy, screening, endocrinology]
  - front: "What is the management of hypoglycemia and what defines severe hypoglycemia?"
    back: "Mild-moderate (conscious): glucose <4.0 mmol/L → 15g fast-acting carbs (3-4 glucose tabs, 150 mL juice), recheck in 15 min, repeat if still <4.0, then snack. Severe (altered consciousness, unable to self-treat): glucagon 1 mg IM/SC or nasal glucagon 3 mg, or IV dextrose 50% (D50W) 25-50 mL.\n\nDiabetes Canada defines hypoglycemia by blood glucose <4.0 mmol/L. Severe hypoglycemia = requires assistance. Recurrent severe hypoglycemia: reassess targets (relax A1C), review medications (reduce/stop SUs or insulin), consider hypoglycemia unawareness (raise targets to >5.0 for 2-3 weeks to restore awareness). Glucagon now available OTC as nasal spray."
    difficulty: medium
    tags: [diabetes, hypoglycemia, glucagon, severe, treatment, endocrinology]
  - front: "What is the cardiovascular risk management approach in diabetes per Diabetes Canada?"
    back: "All T2DM >40 or with microvascular disease: statin therapy (moderate-high intensity). BP target <130/80. ACEi/ARB if albuminuria, CVD, or age ≥55 with additional CV risk factor. ASA: secondary prevention only (not primary). SGLT2i or GLP-1 RA if established CVD.\n\nDiabetes is a CV risk equivalent. 10-year CV risk assessment using Framingham Risk Score modified for diabetes. LDL target <2.0 mmol/L or >50% reduction. PCSK9 inhibitors if statin-intolerant or not at target. Smoking cessation is the single most impactful intervention. Exercise: 150 min/week moderate-vigorous aerobic + resistance training 2-3x/week."
    difficulty: hard
    tags: [diabetes, cardiovascular, statin, SGLT2i, GLP-1, risk management, endocrinology]
  - front: "What is gestational diabetes (GDM) screening and management?"
    back: "Screen all at 24-28 weeks with 50g GCT (threshold ≥7.8 → 75g OGTT) or direct 75g OGTT. Diagnostic: FPG ≥5.3 or 1h ≥10.6 or 2h ≥9.0 (one abnormal value). Management: diet + exercise first → insulin if targets not met (FBG <5.3, 1h post-meal <7.8, 2h post-meal <6.7).\n\nDiabetes Canada uses IADPSG-based criteria. GDM increases risk of macrosomia, shoulder dystocia, preeclampsia, neonatal hypoglycemia, and future T2DM in mother (50% lifetime risk). Metformin is alternative to insulin (crosses placenta but increasingly accepted). Glyburide no longer recommended. Screen with 75g OGTT at 6 weeks postpartum."
    difficulty: hard
    tags: [diabetes, gestational, GDM, screening, OGTT, insulin, pregnancy, endocrinology]
  - front: "What are the diagnostic criteria for diabetes mellitus?"
    back: "FPG ≥7.0 mmol/L (fasting ≥8h), OR 2h PG ≥11.1 on 75g OGTT, OR A1C ≥6.5% (standardized lab), OR random PG ≥11.1 with symptoms. Two abnormal tests required if asymptomatic (can be same sample, two different tests). Single test sufficient if symptomatic + random ≥11.1.\n\nDiabetes Canada 2024 diagnostic criteria. A1C 6.0-6.4% = prediabetes (high risk). A1C unreliable in: hemoglobinopathies, iron deficiency, CKD, hemolytic anemia, pregnancy. Screen high-risk individuals annually (age ≥40, first-degree relative, high-risk ethnic group, GDM history, impaired glucose tolerance, metabolic syndrome)."
    difficulty: medium
    tags: [diabetes, diagnosis, FPG, OGTT, A1C, Diabetes Canada, endocrinology]
  - front: "What are the GLP-1 receptor agonists and their clinical benefits?"
    back: "Agents: liraglutide, semaglutide (SC or oral), dulaglutide, exenatide. Benefits: A1C reduction 1.0-1.8%, weight loss 3-6 kg (semaglutide up to 15%), CV benefit (LEADER, SUSTAIN-6, REWIND), renal protection (FLOW trial — semaglutide). Side effects: GI (nausea, vomiting), pancreatitis risk (theoretical).\n\nGLP-1 RAs are incretin mimetics that stimulate glucose-dependent insulin secretion, suppress glucagon, slow gastric emptying, and promote satiety. Semaglutide 2.4 mg (Wegovy) approved for obesity. Contraindicated in personal/family history of medullary thyroid carcinoma or MEN2 (thyroid C-cell tumors in rodent studies). Tirzepatide (dual GIP/GLP-1) offers even greater A1C and weight reduction."
    difficulty: hard
    tags: [diabetes, GLP-1, semaglutide, liraglutide, weight loss, CV benefit, endocrinology]
  - front: "What is the perioperative diabetes management approach?"
    back: "Hold metformin day of surgery (restart when eating, normal renal function). Hold SGLT2i 3 days before (euglycemic DKA risk). Continue basal insulin at 80% dose night before/morning of. Hold bolus insulin and oral agents day of surgery. Use IV insulin infusion if glucose >10-12 mmol/L. Target glucose 5-10 mmol/L perioperatively.\n\nDiabetes Canada recommends tight but safe glucose control perioperatively to reduce wound infections and complications. Reduce basal insulin to 60-80% to prevent hypoglycemia while fasting. Monitor glucose q1-2h. Resume home regimen when eating normally. DKA can occur perioperatively in T1DM — never completely hold insulin."
    difficulty: hard
    tags: [diabetes, perioperative, insulin, surgery, SGLT2i, endocrinology]
  - front: "What is the diabetic foot assessment and management approach?"
    back: "Annual screening: 10g monofilament (4 sites per foot), 128Hz tuning fork, visual inspection, pedal pulses. High risk: calluses, deformity (Charcot), peripheral neuropathy, PAD, prior ulcer/amputation. Ulcer management: offloading (total contact cast), debridement, infection control, revascularization if ischemic.\n\nWagner classification grades ulcers 0-5. Diabetic foot infections: mild (superficial, <2cm cellulitis) → oral antibiotics. Moderate (deeper, >2cm cellulitis) → IV antibiotics. Severe (systemic toxicity, osteomyelitis) → IV antibiotics + surgical debridement. MRI best for osteomyelitis diagnosis. Probe-to-bone test positive has high PPV for osteomyelitis."
    difficulty: hard
    tags: [diabetes, foot, neuropathy, ulcer, Wagner, offloading, endocrinology]
  - front: "What is the sick day management protocol for diabetes?"
    back: "Never stop insulin completely (T1DM: maintain basal at minimum). Monitor BG q2-4h + ketones. Increase fluids (sugar-free if BG >14, sugary if BG <14). Hold metformin, SGLT2i, ACEi/ARBs, diuretics, NSAIDs if dehydrated/vomiting ('sick day drugs'). Seek medical attention if persistent vomiting, BG >20 with ketones, or unable to maintain hydration.\n\nDiabetes Canada publishes sick day management guides for patients. SGLT2i carry euglycemic DKA risk during illness — hold early. T1DM patients should have ketone testing supplies at home. Supplemental rapid-acting insulin doses based on correction factor if BG elevated. Prevention of DKA is key — education is critical."
    difficulty: medium
    tags: [diabetes, sick day, DKA prevention, SGLT2i, management, endocrinology]
  - front: "What is the screening schedule for diabetic complications?"
    back: "Eyes: annual dilated exam from diagnosis (T2DM) or 5 years (T1DM). Feet: every visit. Kidneys: annual ACR + eGFR. Neuropathy: annual monofilament/vibration. CV: lipids, BP every visit\n\nCDA guidelines. Early referral: proliferative retinopathy, eGFR<30, foot ulcer/Charcot. A1C q3 months if not at target, q6 months if stable. Dental exam annually."
    difficulty: medium
    tags: [diabetes, complications, screening]
  - front: "What are the insulin initiation and titration strategies for T2DM?"
    back: "Basal insulin (glargine/detemir): start 10U or 0.2U/kg at bedtime. Titrate by 2U q3 days to fasting glucose 4-7mmol/L. Add prandial if A1C still above target: rapid-acting before largest meal\n\nCDA: basal-bolus or basal-plus regimens. Hypoglycemia prevention: glucose monitoring, patient education, avoid SU with basal insulin. Weight gain expected ~2-4kg. GLP-1RA can be combined with basal insulin."
    difficulty: medium
    tags: [insulin, T2DM, titration]
  - front: "What is the pathophysiology of type 1 vs type 2 diabetes?"
    back: "T1DM: autoimmune destruction of pancreatic beta cells (anti-GAD, anti-IA2) causing absolute insulin deficiency. T2DM: insulin resistance + relative insulin deficiency from progressive beta-cell dysfunction\n\nT1DM: immune-mediated, often HLA-DR3/DR4 associated. T2DM: obesity/visceral fat drives insulin resistance via adipokines, free fatty acids. Beta-cell failure is progressive — eventually need insulin."
    difficulty: medium
    tags: [diabetes, pathophysiology]
  - front: "How does pregestational diabetes management differ in pregnancy?"
    back: "Target A1C <6.5% preconception, strict glycemic targets (fasting <5.3, 1h PP <7.8, 2h PP <6.7). Insulin is preferred. Stop ACEi/ARB/statins. Start folic acid 5mg. Retinal screening each trimester\n\nPregestational DM has higher risk than GDM: congenital anomalies (NTD, cardiac) if poor periconception control. Insulin needs increase 2-3x by third trimester. Hypoglycemia risk increases in first trimester."
    difficulty: hard
    tags: [diabetes, pregnancy]
  - front: "What is the approach to hypoglycemia unawareness?"
    back: "Loss of adrenergic warning symptoms (tremor, sweating, palpitations) due to recurrent hypoglycemia. Management: raise glucose targets for 2-3 weeks to restore awareness, CGM, glucagon kit, patient education\n\nCaused by defective counter-regulatory response. Risk factors: long-standing T1DM, tight control, autonomic neuropathy. Impaired awareness hypoglycemia affects 25% of T1DM patients. CGM with alarms reduces severe episodes."
    difficulty: hard
    tags: [hypoglycemia, T1DM]
  - front: "Outline the diabetic foot ulcer assessment algorithm."
    back: "1) Probe-to-bone test (positive = high probability osteomyelitis). 2) Classify with Wagner or UT system. 3) Vascular assessment (ABI, toe pressures). 4) Offloading (total contact cast for plantar ulcers). 5) Debridement. 6) Antibiotics if infected (mild=oral, moderate/severe=IV per Diabetes Canada). 7) MRI if osteomyelitis suspected.\n\nDiabetes Canada recommends annual comprehensive foot exams with monofilament and pedal pulses. Probe-to-bone has ~90% specificity for osteomyelitis. Total contact casting is gold standard for offloading neuropathic ulcers. Multidisciplinary foot care teams reduce amputation by 50%."
    difficulty: hard
    tags: [diabetic-foot, ulcer, osteomyelitis, offloading, wound-care]
  - front: "What is hypoglycemia unawareness and how is it managed?"
    back: "Loss of autonomic warning symptoms at glucose <4.0 mmol/L due to repeated hypoglycemia shifting the glycemic threshold downward. Management: strict hypoglycemia avoidance for 2-3 weeks, relaxed A1C targets (7.5-8.0%), CGM with alarms, glucagon kit prescription.\n\nAffects ~25% of type 1 patients, increasing severe hypoglycemia risk 6-fold. Diabetes Canada recommends Clarke or Gold questionnaires to screen. CGM with low-glucose suspend technology significantly reduces events. Recurrent severe hypoglycemia is an indication for islet cell transplantation in Canada."
    difficulty: hard
    tags: [hypoglycemia-unawareness, CGM, type-1-diabetes, patient-safety, glucagon]
  - front: "How does management of pregestational diabetes differ from gestational diabetes (GDM)?"
    back: "Pregestational: optimize A1C <6.5% pre-conception, insulin is preferred (metformin acceptable in type 2), folic acid 5 mg, retinal/renal screening each trimester, tight targets (fasting 4.0-5.3, 1h post-meal <7.8). GDM: diagnosed 24-28 weeks by OGTT, lifestyle first, insulin if targets not met in 2 weeks.\n\nPregestational diabetes carries higher congenital anomaly risk (cardiac, NTDs) if poorly controlled in the first trimester. Both require postpartum glucose testing: 75g OGTT at 6 weeks for GDM. SOGC and Diabetes Canada guidelines align on these recommendations."
    difficulty: hard
    tags: [pregestational-diabetes, GDM, pregnancy, insulin, SOGC]
  - front: "What are the indications and key metrics of continuous glucose monitoring (CGM)?"
    back: "Indications: all type 1 diabetes, type 2 on intensive insulin, hypoglycemia unawareness, pregnancy with pregestational diabetes. Key metrics: time-in-range 3.9-10.0 (goal >70%), time below range (<4% below 3.9), glucose management indicator (GMI).\n\nDiabetes Canada 2024 guidelines recommend CGM for all type 1 patients. Flash glucose monitoring (FreeStyle Libre) is widely available with variable provincial coverage. CGM reduces A1C by 0.3-0.5% and significantly reduces hypoglycemia frequency."
    difficulty: medium
    tags: [CGM, time-in-range, type-1-diabetes, glucose-monitoring, technology]
  - front: "What are key complications specific to insulin pump therapy?"
    back: "DKA risk from pump failure/site occlusion (no basal depot, DKA can develop in 4-6 hours), infusion site infections, lipohypertrophy. Must rotate sites every 2-3 days, always carry backup insulin pens, and have sick-day management plans.\n\nInsulin pumps deliver only rapid-acting insulin, so any interruption causes rapid hyperglycemia. Diabetes Canada recommends ketone testing access for all pump users. Hybrid closed-loop systems automate basal adjustments and reduce hypoglycemia but require user engagement for bolusing."
    difficulty: medium
    tags: [insulin-pump, CSII, DKA-risk, infusion-site, closed-loop]
  - front: "What is the A1C target for most adults with type 2 diabetes per Diabetes Canada, and when should it differ?"
    back: "Target <=7.0% for most. Consider <=6.5% if achievable without significant hypoglycemia (reduces CKD/retinopathy risk). Consider 7.1-8.5% in elderly, limited life expectancy, frailty, or recurrent severe hypoglycemia.\n\nDiabetes Canada emphasizes individualized targets. The ACCORD trial showed increased mortality with aggressive targets (<6.0%) in high-risk patients. SGLT2 inhibitors and GLP-1 RAs are preferred second-line for cardiovascular and renal benefit regardless of A1C."
    difficulty: easy
    tags: [A1C-target, Diabetes-Canada, individualized, glycemic-control, type-2-diabetes]
  - front: "A type 2 diabetic with established CVD has A1C 8.2% on metformin. What agent to add next?"
    back: "SGLT2 inhibitor (empagliflozin, canagliflozin) or GLP-1 RA (liraglutide, semaglutide, dulaglutide) with proven CV benefit, irrespective of A1C. SGLT2i preferred if HF/CKD predominates; GLP-1 RA if ASCVD predominates.\n\nDiabetes Canada 2024 guidelines prioritize cardiorenal benefit over A1C when selecting second-line therapy. EMPA-REG, CANVAS, LEADER, SUSTAIN-6 trials demonstrated CV outcome benefits. These agents can be combined for additive benefit."
    difficulty: medium
    tags: [SGLT2i, GLP-1-RA, cardiovascular, metformin, type-2-diabetes]
  - front: "What are the diagnostic criteria for DKA vs HHS?"
    back: "DKA: glucose >14 mmol/L, pH <7.3, bicarbonate <18, anion gap >12, positive ketones. HHS: glucose >33.3 mmol/L, osmolality >320, pH >7.3, minimal ketones, profound dehydration. DKA more common in type 1; HHS in elderly type 2.\n\nDKA results from absolute insulin deficiency causing ketogenesis. HHS from relative deficiency preventing ketosis but not hyperglycemia. HHS mortality is higher (10-20% vs 1-5%). Both require IV fluids, insulin, and potassium monitoring. Diabetes Canada recommends standardized order sets."
    difficulty: medium
    tags: [DKA, HHS, ketoacidosis, hyperosmolar, diagnosis]
  - front: "What is euglycemic DKA and what are its causes?"
    back: "DKA with blood glucose <14 mmol/L. Most commonly from SGLT2 inhibitor use. Also seen with reduced carbohydrate intake, pregnancy, partial insulin treatment, or alcohol. Presents with metabolic acidosis and ketonemia despite near-normal glucose.\n\nSGLT2 inhibitors cause glucosuria, lowering glucose while ketogenesis continues. Health Canada has issued safety warnings. Hold SGLT2i 3 days before elective surgery per Diabetes Canada. Always check ketones and blood gas in an ill diabetic on SGLT2i."
    difficulty: hard
    tags: [euglycemic-DKA, SGLT2i, ketoacidosis, normal-glucose, diagnosis]
  - front: "What screening is recommended for microvascular complications at type 2 diabetes diagnosis?"
    back: "At diagnosis: dilated eye exam, uACR + eGFR, monofilament + tuning fork foot exam. Then: eyes every 1-2 years, uACR/eGFR annually, foot exam annually. Type 1: screening starts 5 years post-diagnosis (post-pubertal).\n\nDiabetes Canada recommends immediate screening at type 2 diagnosis since the disease may have been present years prior. ACEi/ARB is indicated when uACR >20 mg/mmol to slow nephropathy. Early detection of retinopathy enables timely laser/anti-VEGF treatment."
    difficulty: easy
    tags: [microvascular, screening, retinopathy, nephropathy, neuropathy]
  - front: "What metabolic effects are associated with beta-adrenergic receptor activation?"
    back: "Liver: gluconeogenesis and glycogenolysis. Fat cells: lipolysis. Pancreatic beta cells: increased insulin secretion\n\nBeta-adrenergic stimulation mobilizes energy substrates (glucose and free fatty acids) during stress, supporting the fight-or-flight response."
    difficulty: medium
    tags: [cardiology, adrenergic-receptors, beta-receptors, metabolism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is physiological (functional) antagonism?"
    back: "Drugs that produce opposite physiological effects through different receptors (e.g., insulin decreases glucose vs. glucagon raises glucose)\n\nBoth drugs act through different receptors but produce opposing physiological responses, providing a form of physiological antagonism."
    difficulty: easy
    tags: [pharmacodynamics, functional antagonism, physiological antagonism, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "Give a clinical example of physiological/functional antagonism"
    back: "Insulin decreases blood glucose via insulin receptors vs. glucagon raises blood glucose via glucagon receptors - opposite physiological effects\n\nThese drugs work through different mechanisms to produce opposing effects, useful when one system is pathologically overactive."
    difficulty: easy
    tags: [pharmacodynamics, physiological-antagonism, clinical-examples, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the insulin infusion rate for DKA management?"
    back: "0.05-0.1 U/kg/h continuous IV infusion\n\nLow-dose insulin infusion at 0.05-0.1 U/kg/h is the standard approach for DKA management, achieving adequate ketogenesis suppression while minimizing hypoglycemia risk."
    difficulty: easy
    tags: [DKA, Diabetes, Insulin, Emergency Medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the most common causes of hypoglycemia in the emergency setting?"
    back: "Excessive insulin use in the setting of poor PO intake.\n\nMost hypoglycemia presenting to ED is iatrogenic from insulin or sulfonylureas."
    difficulty: easy
    tags: [hypoglycemia, causes, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is unique about hypoglycemia due to long-acting insulin or sulfonylureas?"
    back: "Watch for prolonged hypoglycemia due to long half-life; may require admission for monitoring.\n\nThese agents can cause prolonged hypoglycemia requiring extended observation."
    difficulty: medium
    tags: [hypoglycemia, insulin, sulfonylureas, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the most common cause of hypoglycemia in outpatients?"
    back: "Excessive insulin use in setting of poor PO intake\n\nIatrogenic insulin overdose with inadequate carbohydrate intake is the most frequent cause."
    difficulty: easy
    tags: [hypoglycemia, causes, insulin, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What rare causes of hypoglycemia should be considered?"
    back: "Insulinomas, hypopituitarism, adrenal insufficiency, liver failure, medication side effects\n\nThese endocrine and hepatic disorders can cause hypoglycemia through impaired gluconeogenesis or excess insulin."
    difficulty: medium
    tags: [hypoglycemia, rare causes, endocrine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are common causes of hypoglycemia to investigate after treatment?"
    back: "Common causes include: exogenous insulin, alcohol, or sulfonylureas. Also consider insulinomas, hypopituitarism, adrenal insufficiency.\n\nIdentifying the underlying cause prevents recurrent episodes."
    difficulty: medium
    tags: [hypoglycemia, diagnosis, etiology, diabetes, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the starting dose of basal insulin for T2DM according to Diabetes Canada 2018 guidelines?"
    back: "10U at bedtime (lower for lean patients <50kg)\n\nStarting at a low dose reduces risk of hypoglycemia. Titrate by 1U nightly until fasting BG reaches 4-7 mmol/L target."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the target fasting blood glucose for basal insulin titration in T2DM?"
    back: "4-7 mmol/L\n\nThis is the fasting BG target used to titrate basal insulin doses in T2DM management per Diabetes Canada 2018 guidelines."
    difficulty: easy
    tags: [endocrinology, diabetes, target, glucose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Calculate the correction factor for a patient with total daily insulin dose of 50 units"
    back: "CF = 100/50 = 2 mmol/L per unit of insulin\n\nCorrection Factor = 100/TDD. This represents the expected decrease in blood glucose per unit of insulin administered."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, calculation, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical total daily insulin (TDI) requirement for basal-bolus regimen in T2DM?"
    back: "0.3-0.5 U/kg\n\nFor a 100kg patient, this equals 30-50U total daily dose, with 40% as basal and 60% as prandial bolus."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, dosing, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In a basal-bolus regimen, what percentage of TDI is allocated to basal insulin vs bolus insulin?"
    back: "40% basal, 60% bolus (or 40% basal, 20% each meal)\n\nBasal insulin is 40% of TDI, while bolus (prandial) insulin is 60% of TDI, typically divided equally before each meal."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, regimen, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What are the target postprandial blood glucose levels for bolus insulin adjustment?"
    back: "5-10 mmol/L\n\nPostprandial BG should be 5-10 mmol/L. Preprandial BG for subsequent meals should be 4-7 mmol/L."
    difficulty: easy
    tags: [endocrinology, diabetes, glucose targets, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical insulin requirement for most T2DM patients to achieve target BG?"
    back: "40-50 units/day\n\nMost T2DM patients will need 40-50 U/day to achieve glycemic targets, though there is no maximum dose."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin dosing, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What should be done if fasting hypoglycemia occurs with basal insulin?"
    back: "Reduce the dose of bedtime basal insulin\n\nFasting hypoglycemia indicates the basal dose is too high and should be reduced. Daytime hypoglycemia may require reducing oral agents, especially secretagogues."
    difficulty: medium
    tags: [endocrinology, diabetes, hypoglycemia, insulin adjustment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Which oral antihyperglycemic agents are typically continued when adding bolus insulin?"
    back: "Metformin is continued; secretagogues are typically stopped\n\nMetformin is continued as it does not cause hypoglycemia. Insulin secretagogues (e.g., sulfonylureas) are typically discontinued when prandial insulin is added."
    difficulty: easy
    tags: [endocrinology, diabetes, oral antihyperglycemics, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of insulin is used in insulin pump therapy (CSII)?"
    back: "Rapid-acting insulin analogues (aspart, glulisine, or lispro)\n\nCSII uses continuous subcutaneous infusion of rapid-acting insulin, with boluses programmed for meals based on carb:insulin ratios."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin pump, CSII, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the major risk of insulin pump therapy if disconnected or malfunctioning?"
    back: "Diabetic Ketoacidosis (DKA)\n\nIf the pump is disconnected or malfunctions, there is no basal insulin delivery, leading to rapid insulin deficiency and DKA risk."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin pump, DKA risk, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Distinguish DKA pathophysiology from HHS in terms of insulin deficiency"
    back: "DKA: absolute insulin deficiency; HHS: partial/relative insulin deficiency\n\nDKA occurs with complete or near-complete insulin deficiency. HHS has enough insulin to inhibit lipolysis and prevent ketosis but insufficient glucose utilization."
    difficulty: medium
    tags: [endocrinology, DKA, HHS, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why does DKA have metabolic acidosis while HHS typically does not?"
    back: "DKA has absolute insulin deficiency → unchecked lipolysis → increased FFA → ketone production → metabolic acidosis. HHS has enough insulin to inhibit lipolysis → no significant ketosis.\n\nThe presence of ketones distinguishes DKA from HHS. Even with high glucose, partial insulin in HHS prevents ketone formation."
    difficulty: hard
    tags: [endocrinology, DKA, HHS, ketones, metabolic acidosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "When should insulin be held in DKA treatment?"
    back: "When serum K+ <3.3 mmol/L\n\nIf K+ is <3.3 mmol/L, give 40 mEq/L K+ replacement and hold insulin until potassium is ≥3.3 mmol/L to prevent life-threatening hypokalemia."
    difficulty: medium
    tags: [endocrinology, DKA, insulin, potassium, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why is urine ketones usually positive in DKA but negative in HHS?"
    back: "DKA has absolute insulin deficiency → unchecked lipolysis → ketone production. HHS has relative insulin deficiency → enough insulin to inhibit lipolysis and ketone production.\n\nThe presence or absence of ketones is a key differentiator between DKA and HHS."
    difficulty: medium
    tags: [endocrinology, DKA, HHS, ketones, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Which type of diabetes is more commonly associated with DKA?"
    back: "Type 1 Diabetes Mellitus (T1DM)\n\nDKA typically occurs in T1DM due to absolute insulin deficiency. It can occur in T2DM but is less common."
    difficulty: easy
    tags: [endocrinology, DKA, T1DM, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Which type of diabetes is more commonly associated with HHS?"
    back: "Type 2 Diabetes Mellitus (T2DM)\n\nHHS typically occurs in T2DM, often in elderly patients with partial insulin deficiency."
    difficulty: easy
    tags: [endocrinology, HHS, T2DM, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the insulin titration for basal-bolus: for a 70kg patient starting at 0.5 U/kg TDI?"
    back: "TDI = 35U: Basal = 14U at bedtime, Bolus = 7U with each meal\n\n70kg × 0.5 = 35U TDI. Basal 40% = 14U, Bolus 60% = 21U (7U per meal)."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, calculation, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the formula for calculating the correction factor (CF) in insulin dosing?"
    back: "CF = 100/Total Daily Dose (TDD) = change in blood glucose per unit of insulin\n\nThe correction factor represents how much 1 unit of insulin will lower blood glucose. For example, if TDD is 50U, CF = 2 mmol/L reduction per unit."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, calculations, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the target fasting blood glucose for patients with T2DM on insulin therapy?"
    back: "4-7 mmol/L\n\nDiabetes Canada 2018 guidelines recommend fasting BG target of 4-7 mmol/L for most patients with T2DM on insulin therapy."
    difficulty: easy
    tags: [endocrinology, diabetes, target, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In a basal-bolus insulin regimen, what percentage of total daily insulin (TDI) should be basal vs bolus?"
    back: "40% basal, 60% bolus (distributed as 20% with each of 3 meals)\n\nFor basal-bolus: TDI = 0.3-0.5 U/kg, with 40% as basal insulin and 60% as prandial bolus insulin divided before each meal."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, regimen, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of diabetes is Diabetic Ketoacidosis (DKA) typically associated with?"
    back: "Type 1 Diabetes Mellitus (T1DM)\n\nDKA usually occurs in T1DM due to absolute insulin deficiency, though it can occur in T2DM under stress conditions."
    difficulty: easy
    tags: [endocrinology, DKA, T1DM, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of diabetes is Hyperosmolar Hyperglycemic State (HHS) typically associated with?"
    back: "Type 2 Diabetes Mellitus (T2DM)\n\nHHS occurs predominantly in T2DM due to partial insulin deficiency that prevents ketosis but allows extreme hyperglycemia."
    difficulty: easy
    tags: [endocrinology, HHS, T2DM, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why does total body potassium deplete in DKA despite normal or elevated serum K+?"
    back: "Insulin deficiency and plasma osmolality shift K+ from ICF to ECF\n\nLack of insulin and high plasma osmolality cause potassium to shift from intracellular to extracellular compartment, masking total body depletion."
    difficulty: hard
    tags: [endocrinology, DKA, electrolytes, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the insulin pump (CSII) delivery mechanism?"
    back: "Continuous subcutaneous infusion of rapid-acting insulin analogue (aspart, glulisine, or lispro) via external battery-operated device\n\nInsulin pumps deliver continuous basal insulin through a small subcutaneous catheter, with patient-programmed boluses at meals based on carbohydrate ratios."
    difficulty: easy
    tags: [endocrinology, insulin, pump, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the major risk of insulin pump therapy?"
    back: "DKA if pump is inadvertently disconnected or malfunctions\n\nSince pumps only use rapid-acting insulin, any interruption in delivery can quickly lead to insulin deficiency and DKA."
    difficulty: easy
    tags: [endocrinology, insulin, pump, complications, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the postprandial blood glucose target for patients on insulin therapy?"
    back: "5-10 mmol/L\n\nPostprandial BG target is 5-10 mmol/L, while preprandial BG for subsequent meals should be 4-7 mmol/L."
    difficulty: easy
    tags: [endocrinology, diabetes, targets, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In HHS, why is potassium depletion less severe than in DKA?"
    back: "HHS patients typically have less profound insulin deficiency and less acidosis\n\nThe partial insulin deficiency in HHS causes less potassium shift from ICF and less osmotic diuresis compared to the absolute insulin deficiency in DKA."
    difficulty: hard
    tags: [endocrinology, HHS, DKA, electrolytes, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What should be done regarding oral antihyperglycemic agents when basal insulin is started?"
    back: "Continue metformin, consider stopping secretagogues\n\nMetformin is typically continued with insulin therapy, but secretagogues (sulfonylureas) should be stopped to reduce hypoglycemia risk."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, OAD, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "When are insulin secretagogues typically stopped in T2DM management?"
    back: "When bolus (prandial) insulin is added\n\nInsulin secretagogues are stopped when bolus insulin is added to avoid redundant therapy and reduce hypoglycemia risk."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, secretagogues, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the blood glucose threshold for calling physician in insulin correction dosing?"
    back: "BG <4 mmol/L\n\nWhen BG is <4 mmol/L, the physician should be called and the patient should receive 15g of rapid-acting carbohydrates, rechecking in 15 minutes."
    difficulty: easy
    tags: [endocrinology, insulin, hypoglycemia, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In correction factor dosing, what is the insulin dose if BG is between 8 and (8+CF)?"
    back: "Give 1 additional unit\n\nCorrection factor dosing: BG 8 to (8+CF) = 1 unit; (8+CF) to (8+2CF) = 2 units; (8+2CF) to (8+3CF) = 3 units."
    difficulty: medium
    tags: [endocrinology, insulin, correction, calculations, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the normal response in an insulin tolerance test?"
    back: "Hypoglycemia induced by insulin should stimulate increased GH and cortisol secretion\n\nThe insulin tolerance test evaluates the entire hypothalamic-pituitary-adrenal axis and GH axis. Hypoglycemia is a physiologic stressor that should trigger ACTH and GH release."
    difficulty: hard
    tags: [pituitary, insulin tolerance test, diagnosis, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the starting dose and titration approach for basal insulin in T2DM according to Diabetes Canada 2018 guidelines?"
    back: "Start at 10U at bedtime; increase by 1U every night until fasting BG reaches target of 4-7 mmol/L\n\nMost patients need 40-50 units/day to achieve target. If fasting hypoglycemia occurs, reduce bedtime basal dose."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, t2dm, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "For a basal-bolus insulin regimen, how is the total daily insulin (TDI) divided?"
    back: "TDI = 0.3-0.5 U/kg; 40% basal (bedtime), 60% bolus (20% before each meal)\n\nBasal insulin controls fasting glucose while bolus insulin covers postprandial glucose levels."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, t2dm, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the correction factor formula for insulin dosing?"
    back: "CF = 100/Total Daily Dose (TDD) = change in blood glucose per unit of insulin\n\nExample: if TDD = 50U, CF = 100/50 = 2 mmol/L, meaning 1 unit of insulin lowers BG by 2 mmol/L."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, calculations, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What insulin correction dosing should be given when BG is between 8 and (8 + CF) mmol/L?"
    back: "Give one additional unit of insulin\n\nThis is part of the insulin correction scale: 8 to (8+CF) = 1 unit, (8+CF) to (8+2CF) = 2 units, etc."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, correction, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "How does the pathophysiology of DKA differ from HHS?"
    back: "DKA: complete insulin deficiency with ketogenesis (occurs in T1DM); HHS: partial/relative insulin deficiency prevents ketosis (occurs in T2DM)\n\nA small amount of insulin in HHS prevents lipolysis and ketone production while still allowing some glucose utilization."
    difficulty: hard
    tags: [endocrinology, diabetes, dka, hhs, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the treatment approach for DKA regarding potassium replacement?"
    back: "If serum K+ <3.3 mmol/L, give 40 mEq/L K+ replacement and hold insulin until [K+] ≥3.3 mmol/L\n\nInsulin drives K+ into cells, potentially causing life-threatening hypokalemia if K+ is not replaced first."
    difficulty: medium
    tags: [endocrinology, diabetes, dka, potassium, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical insulin requirement (TDI) for most T2DM patients to achieve target?"
    back: "40-50 U/day (no maximum dose)\n\nThis applies to basal, basal-bolus, and premixed insulin regimens."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, t2dm, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Which oral antihyperglycemic is typically continued when adding bolus insulin?"
    back: "Metformin\n\nInsulin secretagogues (sulfonylureas) are typically stopped when bolus insulin is added to avoid hypoglycemia."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, metformin, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What causes low HDL secondary to endocrine disorders?"
    back: "Obesity/metabolic syndrome and diabetes mellitus\n\nLow HDL is part of the metabolic syndrome phenotype and improves with weight loss and glycemic control."
    difficulty: easy
    tags: [low HDL, metabolic syndrome, diabetes, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the starting dose for basal insulin in T2DM according to Diabetes Canada 2018 guidelines?"
    back: "10 units at bedtime (lower for lean patients <50 kg)\n\nStarting dose is 10U at bedtime, titrated by 1U every night until fasting BG reaches 4-7 mmol/L target."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, T2DM, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the target fasting blood glucose level for insulin titration in T2DM?"
    back: "4-7 mmol/L\n\nTarget fasting BG is 4-7 mmol/L. Dose is increased by 1U nightly until target is achieved."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, target, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "How is the correction factor (CF) calculated for insulin dosing?"
    back: "CF = 100/Total Daily Dose (TDD)\n\nCorrection factor represents the change in blood glucose (mmol/L) per unit of insulin administered."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, calculation, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical total daily insulin (TDI) requirement for basal-bolus regimen?"
    back: "0.3-0.5 U/kg\n\nTDI of 0.3-0.5 U/kg is split: 40% basal insulin, 60% as prandial bolus divided before each meal."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, basal-bolus, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In a basal-bolus regimen, what percentage of TDI is allocated to basal vs prandial insulin?"
    back: "40% basal, 60% prandial (bolus)\n\nBasal insulin is 40% of TDI to maintain fasting BG, while bolus (prandial) is 60% distributed before meals."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, basal-bolus, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What insulin is used in insulin pump therapy (CSII)?"
    back: "Rapid-acting insulin analogues (aspart, glulisine, or lispro)\n\nCSII uses external battery-operated devices delivering continuous basal rapid-acting insulin through subcutaneous catheter."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin pump, CSII, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is a major risk of insulin pump therapy?"
    back: "Diabetic ketoacidosis (DKA) if pump is disconnected or malfunctions\n\nRisk of DKA exists if the pump is inadvertently disconnected or malfunctions, interrupting insulin delivery."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin pump, CSII, DKA, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Which type of diabetes is DKA typically associated with?"
    back: "Type 1 Diabetes Mellitus (T1DM)\n\nDKA usually occurs in T1DM due to absolute insulin deficiency, though it can occur in T2DM with stress."
    difficulty: easy
    tags: [endocrinology, diabetes, DKA, T1DM, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Which type of diabetes is HHS typically associated with?"
    back: "Type 2 Diabetes Mellitus (T2DM)\n\nHHS occurs in T2DM, though it can occasionally occur in T1DM. Characterized by hyperglycemia without ketosis."
    difficulty: easy
    tags: [endocrinology, diabetes, HHS, T2DM, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why does ketosis typically not develop in HHS?"
    back: "Presence of a small amount of insulin inhibits lipolysis\n\nPartial or relative insulin deficiency in HHS prevents ketogenesis by inhibiting lipolysis, unlike absolute insulin deficiency in DKA."
    difficulty: medium
    tags: [endocrinology, diabetes, HHS, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the K+ replacement threshold in DKA treatment?"
    back: "Hold insulin and give 40 mEq/L K+ if serum K+ <3.3 mmol/L\n\nIf serum potassium is <3.3 mmol/L, give potassium replacement and hold insulin until K+ is ≥3.3 mmol/L."
    difficulty: medium
    tags: [endocrinology, diabetes, DKA, treatment, electrolytes, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the target postprandial blood glucose level for bolus insulin adjustment?"
    back: "5-10 mmol/L\n\nBolus insulin is adjusted to achieve postprandial BG levels of 5-10 mmol/L, while preprandial BG for subsequent meals should be 4-7 mmol/L."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, target, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "When using correction factor dosing, what is the insulin dose for blood glucose between 8 and (8+CF)?"
    back: "Give 1 additional unit\n\nFor BG between 8 to (8+CF), give one additional unit of rapid-acting insulin on top of the meal bolus."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, correction factor, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What diabetes medication is typically continued when starting basal insulin?"
    back: "Metformin\n\nMetformin is typically continued as it improves insulin sensitivity and has low hypoglycemia risk, while secretagogues may be stopped."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, metformin, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical maximum dose of basal insulin needed to achieve target?"
    back: "40-50 units/day (no maximum dose)\n\nMost patients need 40-50 U/day to achieve target, but there is no maximum dose - doses can be much higher if needed."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, dosing, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the main difference in insulin therapy between DKA and HHS?"
    back: "DKA requires more aggressive insulin therapy to resolve ketoacidosis; HHS has less severe K+ depletion\n\nIn DKA, insulin is critical to resolve acidosis (not just hyperglycemia), while HHS patients have less severe potassium depletion."
    difficulty: hard
    tags: [endocrinology, diabetes, DKA, HHS, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the initial test for evaluating suspected hypopituitarism with low 8am cortisol?"
    back: "Cosyntropin stimulation test; if equivocal, proceed to insulin tolerance test\n\nThe insulin tolerance test checks both cortisol and GH reserve by inducing hypoglycemia to stimulate hormone release."
    difficulty: hard
    tags: [pituitary, diagnosis, laboratory, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What does the insulin tolerance test evaluate?"
    back: "The pituitary's ability to release GH and cortisol in response to hypoglycemia\n\nInsulin-induced hypoglycemia should stimulate increased GH and cortisol. A normal response indicates intact pituitary function."
    difficulty: medium
    tags: [pituitary, insulin tolerance test, GH, cortisol, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the target fasting blood glucose range for insulin titration?"
    back: "4-7 mmol/L\n\nThis is the target range for fasting BG when titrating basal insulin in T2DM patients."
    difficulty: easy
    tags: [insulin, target, blood glucose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "How is Total Daily Insulin (TDI) calculated in basal-bolus regimen?"
    back: "0.3-0.5 U/kg\n\nTDI is calculated as 0.3-0.5 units per kilogram of body weight, with 40% as basal and 60% as bolus."
    difficulty: medium
    tags: [insulin, TDI, basal-bolus, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In a basal-bolus regimen, what percentage of TDI is allocated to basal insulin?"
    back: "40% of TDI\n\nBasal insulin comprises 40% of total daily insulin in a standard basal-bolus regimen."
    difficulty: easy
    tags: [insulin, basal, TDI, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In a basal-bolus regimen, what percentage of TDI is allocated to bolus (prandial) insulin?"
    back: "60% of TDI (20% per meal)\n\nBolus insulin is 60% of TDI, typically divided as 10% of TDI (or 10U per meal from 50U example) before each meal."
    difficulty: easy
    tags: [insulin, bolus, prandial, TDI, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the correction factor (CF) formula for insulin?"
    back: "CF = 100/Total Daily Dose (TDD)\n\nThe correction factor represents the change in blood glucose (mmol/L) per unit of insulin administered."
    difficulty: medium
    tags: [insulin, correction factor, sliding scale, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "For blood glucose 8-10 mmol/L with CF=2, how many additional units of insulin are given?"
    back: "1 additional unit\n\nBG between 8 and (8+CF) = give 1 additional unit. With CF=2, range is 8-10 mmol/L."
    difficulty: medium
    tags: [insulin, sliding scale, correction, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "For blood glucose 10-12 mmol/L with CF=2, how many additional units of insulin are given?"
    back: "2 additional units\n\nBG between (8+CF) and (8+2CF) = give 2 additional units. With CF=2, range is 10-12 mmol/L."
    difficulty: medium
    tags: [insulin, sliding scale, correction, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "When should insulin secretagogues be stopped in basal-bolus regimen?"
    back: "When bolus (prandial) insulin is added\n\nInsulin secretagogues are typically stopped when bolus insulin is initiated, while metformin is continued."
    difficulty: easy
    tags: [insulin, secretagogues, metformin, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the major risk if insulin pump is disconnected or malfunctions?"
    back: "Diabetic Ketoacidosis (DKA)\n\nRisk of DKA exists if pump is inadvertently disconnected or malfunctions due to lack of basal insulin delivery."
    difficulty: easy
    tags: [insulin pump, CSII, DKA, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "DKA typically occurs in which type of diabetes?"
    back: "Type 1 Diabetes Mellitus (T1DM)\n\nDKA usually occurs in T1DM due to absolute insulin deficiency, but can also occur in T2DM under stress."
    difficulty: easy
    tags: [DKA, T1DM, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "HHS typically occurs in which type of diabetes?"
    back: "Type 2 Diabetes Mellitus (T2DM)\n\nHyperosmolar Hyperglycemic State occurs predominantly in T2DM, though can rarely occur in T1DM."
    difficulty: easy
    tags: [HHS, T2DM, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the primary pathophysiological mechanism of DKA?"
    back: "Insulin deficiency with increased counterregulatory hormones\n\nLack of insulin + elevated glucagon, cortisol, catecholamines, and GH leads to hyperglycemia, lipolysis, and ketone production."
    difficulty: medium
    tags: [DKA, pathophysiology, ketosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why is ketosis present in DKA but not HHS?"
    back: "HHS has partial/relative insulin deficiency that inhibits lipolysis\n\nThe small amount of insulin present in HHS prevents ketogenesis by inhibiting lipolysis, unlike the absolute insulin deficiency in DKA."
    difficulty: hard
    tags: [DKA, HHS, ketosis, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why is K+ typically normal or elevated in DKA despite total body depletion?"
    back: "Shift from ICF to ECF due to lack of insulin and increased plasma osmolality\n\nInsulin deficiency and hyperosmolality cause K+ to shift from intracellular to extracellular space, masking total body depletion."
    difficulty: hard
    tags: [DKA, potassium, electrolytes, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the test of choice for confirming central adrenal insufficiency?"
    back: "Insulin tolerance test - insulin-induced hypoglycemia should stimulate increased GH and cortisol\n\nIf 8am cortisol is low/borderline, the insulin tolerance test assesses the hypothalamic-pituitary-adrenal axis response to stress."
    difficulty: hard
    tags: [pituitary, adrenal, ACTH, diagnosis, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the gold standard test for evaluating ACTH and GH reserve in suspected hypopituitarism?"
    back: "Insulin tolerance test (ITT)\n\nInsulin-induced hypoglycemia stimulates ACTH and GH release. A normal response is an increase in both cortisol and GH. Contraindicated in patients with seizures or heart disease."
    difficulty: hard
    tags: [pituitary, diagnosis, endocrinology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the fasting blood glucose target for patients on basal insulin therapy?"
    back: "4-7 mmol/L\n\nThis target is used to guide titration of basal insulin doses in T2DM management."
    difficulty: easy
    tags: [insulin, diabetes, target, fasting glucose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "How is Total Daily Insulin (TDI) calculated for a basal-bolus regimen?"
    back: "0.3-0.5 U/kg of body weight\n\nFor a 100kg patient, TDI would be 30-50 units total, distributed as 40% basal and 60% bolus (prandial)."
    difficulty: medium
    tags: [insulin, basal-bolus, TDI, dosing calculation, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In a basal-bolus insulin regimen, what percentage of TDI is given as basal vs bolus insulin?"
    back: "40% basal, 60% bolus (prandial)\n\nBasal insulin provides background coverage while bolus insulin covers meals. For a 100kg patient with TDI of 50U: 20U basal, 30U bolus (10U per meal)."
    difficulty: easy
    tags: [insulin, basal-bolus, dosing, TDI, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the correction factor formula for insulin?"
    back: "CF = 100 / Total Daily Dose (TDD)\n\nThe correction factor represents the change in blood glucose (mmol/L) per unit of insulin. For example, if TDD is 50U, CF = 2 mmol/L per unit."
    difficulty: medium
    tags: [insulin, correction factor, bolus, sliding scale, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What are the postprandial and preprandial blood glucose targets for bolus insulin adjustment?"
    back: "Postprandial: 5-10 mmol/L; Preprandial for subsequent meals: 4-7 mmol/L\n\nBolus insulin is titrated to achieve these targets, separate from fasting glucose targets for basal insulin."
    difficulty: easy
    tags: [insulin, bolus, postprandial, targets, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of diabetes is Diabetic Ketoacidosis (DKA) most commonly associated with?"
    back: "Type 1 Diabetes Mellitus (T1DM)\n\nDKA occurs due to absolute insulin deficiency. It can also occur in T2DM under stress, but T1DM is the classic association."
    difficulty: easy
    tags: [DKA, diabetes, T1DM, acute complication, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of diabetes is Hyperosmolar Hyperglycemic State (HHS) most commonly associated with?"
    back: "Type 2 Diabetes Mellitus (T2DM)\n\nHHS occurs in T2DM due to partial insulin deficiency sufficient to prevent ketosis but inadequate to control hyperglycemia."
    difficulty: easy
    tags: [HHS, diabetes, T2DM, acute complication, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the key pathophysiological difference between DKA and HHS?"
    back: "DKA has absolute insulin deficiency leading to ketosis; HHS has partial/relative insulin deficiency that prevents ketosis\n\nThe small amount of insulin in HHS inhibits lipolysis and ketone production, preventing metabolic acidosis despite extreme hyperglycemia."
    difficulty: hard
    tags: [DKA, HHS, pathophysiology, ketosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why may serum potassium be normal or elevated in DKA despite total body potassium depletion?"
    back: "Insulin deficiency and hyperosmolality cause potassium shift from ICF to ECF\n\nTotal body K+ is depleted due to osmotic diuresis, but serum levels appear normal or high due to extracellular shift."
    difficulty: hard
    tags: [DKA, potassium, electrolytes, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the potassium replacement threshold in DKA treatment?"
    back: "If serum K+ <3.3 mmol/L, give 40 mEq/L K+ and hold insulin until K+ ≥3.3 mmol/L\n\nInsulin drives K+ intracellularly, so hypokalemia must be corrected before starting insulin to prevent life-threatening arrhythmias."
    difficulty: hard
    tags: [DKA, treatment, potassium, electrolytes, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What are the advantages of insulin pump therapy (CSII)?"
    back: "Improved quality of life and flexibility\n\nCSII uses a battery-operated device delivering continuous basal rapid-acting insulin with mealtime boluses programmed by the patient."
    difficulty: easy
    tags: [insulin pump, CSII, therapy, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In insulin titration, if fasting hypoglycemia occurs, what adjustment should be made?"
    back: "Reduce the dose of bedtime basal insulin\n\nFasting hypoglycemia suggests overnight basal insulin is too high. Daytime hypoglycemia may require reducing oral antihyperglycemic agents, especially secretagogues."
    difficulty: easy
    tags: [insulin, titration, hypoglycemia, adjustment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the recommended approach when adding bolus insulin to a basal-bolus regimen?"
    back: "Stop insulin secretagogues; continue metformin\n\nSecretagogues (sulfonylureas) increase hypoglycemia risk when combined with bolus insulin. Metformin can be continued as it does not cause hypoglycemia."
    difficulty: medium
    tags: [insulin, basal-bolus, metformin, secretagogues, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What are the physiological effects of cortisol?"
    back: "Cortisol stimulates hepatic glucose production (gluconeogenesis), increases insulin resistance, increases protein catabolism, stimulates leukocytosis and lymphopenia, increases cardiac output, vascular tone, and Na+ retention, increases PTH release and urine calcium excretion\n\nCortisol also supports blood pressure, vasomotor tone, behavioral regulation, and immunosuppression."
    difficulty: medium
    tags: [cortisol, glucocorticoid, endocrinology, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "List the stimulatory effects of glucocorticoids"
    back: "Stimulate hepatic glucose production (gluconeogenesis), increase insulin resistance in peripheral tissues, increase protein catabolism, stimulate leukocytosis and lymphopenia, increase cardiac output, vascular tone, Na+ retention, increase PTH release and urine calcium excretion\n\nGlucocorticoids have widespread metabolic effects that increase available energy substrates."
    difficulty: medium
    tags: [endocrinology, glucocorticoids, cortisol, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the effects of cortisol on glucose metabolism?"
    back: "Stimulates hepatic glucose production (gluconeogenesis) and increases insulin resistance in peripheral tissues"
    difficulty: easy
    tags: [cortisol, endocrinology, metabolism, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What effect does cortisol have on glucose metabolism?"
    back: "Stimulates hepatic glucose production (gluconeogenesis) and increases insulin resistance in peripheral tissues"
    difficulty: easy
    tags: [cortisol, glucose, endocrinology, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the stimulatory effects of glucocorticoids?"
    back: "Stimulate hepatic glucose production (gluconeogenesis), increase insulin resistance, increase protein catabolism, stimulate leukocytosis and lymphopenia, increase cardiac output, vascular tone, Na+ retention, increase PTH release and urine calcium excretion\n\nGlucocorticoids also stimulate bone resorption and inhibit bone formation."
    difficulty: medium
    tags: [glucocorticoids, cortisol, endocrinology, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What was the primary outcome of the 4T Trial comparing insulin regimens in T2DM?"
    back: "Three-year HbA1c levels\n\nThe 4T Trial compared thrice-daily prandial, twice-daily biphasic, and once-daily basal insulin regimens in 708 T2DM patients over 3 years."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, clinical-trials, T2DM, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was a major adverse effect of intensive insulin therapy in the DCCT?"
    back: "Increased severe hypoglycemia\n\nIntensive therapy was associated with an increase in the occurrence of severe hypoglycemia compared to conventional therapy."
    difficulty: easy
    tags: [endocrinology, diabetes, T1DM, clinical-trials, DCCT, hypoglycemia, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In UKPDS 34, how did metformin compare to sulfonylureas/insulin in overweight T2DM?"
    back: "Metformin was superior for diabetes-related endpoints, all-cause mortality, and stroke\n\nMetformin showed risk reductions of 32% for any diabetes-related endpoint (P=0.002), 42% for diabetes-related death (P=0.017), and 36% for all-cause mortality (P=0.011)."
