# Ph Preventive (PublicHealth) - generated from srs-mccqe1
cards:
  - front: "What are the tetanus prophylaxis guidelines for wound management?"
    back: "Unknown/fewer than 3 doses: give Tdap or Td for ALL wounds; give TIG only for 'all other wounds' (not clean minor). 3 or more doses: No Td for clean minor wounds; No Td for other wounds unless >5 years since last dose; No TIG needed. Tdap preferred over Td in adults who have never received Tdap.\n\nTetanus toxoid (Td/Tdap) boosts immunity; TIG provides immediate passive protection. The distinction matters clinically: a fully vaccinated patient presenting with a major contaminated wound still does not need TIG. Both agents are safe in pregnancy. Single-antigen tetanus toxoid (TT) is no longer available in the US."
    difficulty: medium
    tags: [tetanus, wound care, immunization, emergency]
