- id: fix-copy-clipboard-fallback
  title: Copy uses navigator.clipboard?.writeText fire-and-forget (tutor-panel.js:202); promise rejection not caught by sync try/catch and undefined on insecure context silently no-ops while showing 'Copied'. Await promise, handle reject, execCommand fallback.
  phase: EXECUTE
  status: completed
  witness: test.js asserts execCommand('copy') fallback present (pass); copyText awaits clipboard.writeText then falls back to textarea+execCommand
- id: fix-regenerate-sampling-variety
  title: do_sample:false greedy decoding (tutor.js:98) means regenerate with identical context yields identical reply — ↻ retry is a no-op. Enable sampling/temperature on regenerate path so retry produces variety.
  phase: EXECUTE
  status: completed
