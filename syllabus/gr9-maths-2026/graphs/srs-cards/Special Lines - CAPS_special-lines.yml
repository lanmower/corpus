# Gr 9 Maths CAPS — graphs / Special Lines
deck: "Corpus::Gr9 Maths::Special Lines"
notes:
  - guid: 3a7e1c5f9b0d2846
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Special Lines"
    fields:
      Front: "What does the equation y = c (e.g. y = 3) look like, and what is its gradient?"
      Back: "y = 3 is a HORIZONTAL line: every point on it has y = 3, whatever x is, e.g. (−2;3), (0;3), (5;3).\nIt is parallel to the x-axis and crosses the y-axis at (0;3).\nGradient = 0 (no rise), because Δy = 0 so m = 0/Δx = 0."
    tags: ["horizontal-line", "subject:graphs"]
  - guid: 8c2a6e0f4b9d1357
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Special Lines"
    fields:
      Front: "What does the equation x = c (e.g. x = −2) look like, and what is its gradient?"
      Back: "x = −2 is a VERTICAL line: every point on it has x = −2, whatever y is, e.g. (−2;0), (−2;3), (−2;−5).\nIt is parallel to the y-axis and crosses the x-axis at (−2;0).\nGradient is UNDEFINED, because Δx = 0 and m = Δy/0 cannot be calculated (no division by zero)."
    tags: ["vertical-line", "subject:graphs"]
  - guid: 1d5f9b3a7c0e2648
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Special Lines"
    fields:
      Front: "Easy way to remember which of x = c and y = c is vertical vs horizontal?"
      Back: "• x = c → VERTICAL line (a 'wall' standing up). Think: x fixed, so you can only move up/down.\n• y = c → HORIZONTAL line (lying flat). Think: y fixed, so you can only move left/right.\nMemory: 'x = number is a vertical line' — the x stands tall like the letter does.\nGradients: horizontal = 0, vertical = undefined."
    tags: ["special-lines", "subject:graphs"]
  - guid: 6a0c4e8f2b1d9753
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Special Lines"
    fields:
      Front: "Describe the line y = x: its gradient, intercept and the points it passes through."
      Back: "y = x means the y-value always equals the x-value.\n• gradient m = 1, y-intercept c = 0 → passes through the origin (0;0).\n• Points: (−2;−2), (0;0), (1;1), (3;3).\nIt is a diagonal line rising at 45° through Quadrants I and III.\nIt is the line of symmetry y = x used to reflect points (swap x and y)."
    tags: ["y-equals-x", "subject:graphs"]
  - guid: 9f3a7c1e5b8d0264
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Special Lines"
    fields:
      Front: "Describe the line y = −x: its gradient and the points it passes through."
      Back: "y = −x means the y-value is the negative of the x-value.\n• gradient m = −1, y-intercept c = 0 → passes through the origin.\n• Points: (−2;2), (0;0), (1;−1), (3;−3).\nIt is a diagonal line falling at 45° through Quadrants II and IV.\nIt is the line of symmetry y = −x (reflect by swapping and negating coordinates)."
    tags: ["y-equals-minus-x", "subject:graphs"]
  - guid: 4e8c2a6f0b9d1375
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Special Lines"
    fields:
      Front: "Give the equation of (a) the x-axis itself and (b) the y-axis itself."
      Back: "(a) The x-axis is the horizontal line where y = 0 for every point → equation y = 0.\n(b) The y-axis is the vertical line where x = 0 for every point → equation x = 0.\nSo the axes are special cases: x-axis has gradient 0; y-axis has undefined gradient."
    tags: ["axes-equations", "subject:graphs"]
