  - front: "What medications are recommended for diabetes patients with cardiovascular risk?"
    back: "Consider ACEI/ARB (for blood pressure), Statin (for cholesterol), ASA (for antiplatelet effect)\n\nCardiovascular protection is a key component of diabetes management with these medication classes."
