# Gr 9 Maths CAPS — patterns / Describing and Verifying Rules
deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
notes:
  - guid: b18293a4c5d6e1ca
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "What is the difference between the POSITION number and the TERM VALUE in a pattern?"
      Back: "The POSITION number n is WHERE a term sits: 1st, 2nd, 3rd, ... (the input).\nThe TERM VALUE Tₙ is WHAT that term equals (the output).\nExample in 6, 11, 16, ...: the term in position n = 2 has value T₂ = 11.\nPitfall: 'which term is 11?' asks for the POSITION (2); 'what is the 2nd term?' asks for the VALUE (11). Read the question carefully."
    tags: ["position-vs-value", "subject:patterns"]
  - guid: c293a4b5d6e7f2db
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "How do you describe the rule of 4, 9, 14, 19, ... in words?"
      Back: "Two acceptable forms:\n1. Recursive (term to term): 'Start at 4 and add 5 each time.'\n2. General (position to value): 'Multiply the position by 5 and subtract 1' (since Tₙ = 5n − 1).\nThe general form is more powerful because it directly gives any term without listing the ones before it."
    tags: ["rule-in-words", "subject:patterns"]
  - guid: d3a4b5c6e7f80acc
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "How do you VERIFY that a proposed rule is correct for a sequence?"
      Back: "Substitute at least TWO known positions into the rule and check the values match.\nExample: claim Tₙ = 3n + 2 for 5, 8, 11, 14.\nT₁ = 3(1) + 2 = 5 ✓\nT₄ = 3(4) + 2 = 14 ✓\nBoth match, so the rule is verified.\nPitfall: checking only T₁ is not enough — a wrong rule can still fit one term by chance."
    tags: ["verify-rule", "subject:patterns"]
  - guid: e4b5c6d7f8091bdd
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "A learner claims Tₙ = 2n + 3 for the sequence 5, 7, 10, 13. Verify or disprove the rule."
      Back: "T₁ = 2(1) + 3 = 5 ✓\nT₂ = 2(2) + 3 = 7 ✓\nT₃ = 2(3) + 3 = 9, but the sequence shows 10 ✗.\nThe rule FAILS at T₃, so it is wrong.\nActually the differences 2, 3, 3 are not constant, so no single dn + c rule fits — the sequence is not linear."
    tags: ["verify-rule", "subject:patterns"]
  - guid: f5c6d7e809102cee
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "In the sequence 7, 12, 17, 22, ..., what is T₅ and which position holds the value 47?"
      Back: "Rule: d = 5, c = 7 − 5 = 2, so Tₙ = 5n + 2.\nT₅ = 5(5) + 2 = 27 (this is a VALUE).\nFor value 47: 5n + 2 = 47 → 5n = 45 → n = 9 (this is a POSITION).\nSo the 5th term is 27, and 47 is the 9th term. Keep value vs position distinct."
    tags: ["position-vs-value", "subject:patterns"]
  - guid: 06d7e8f910213010
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "Why can two different-looking rules describe the same pattern? Show with Tₙ = 3n + 2."
      Back: "A rule can be written in equivalent forms.\n'Multiply position by 3, add 2' = Tₙ = 3n + 2.\n'Start at 5, add 3 each time' is the same sequence (5, 8, 11, ...).\nYou can also factor or expand without changing values, e.g. Tₙ = 3(n + 1) − 1 = 3n + 2.\nTo confirm two rules match, check they give identical values for several n."
    tags: ["verify-rule", "subject:patterns"]
  - guid: 17e8f90a12314131
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "Common pitfall: a learner writes Tₙ = 5n for the sequence 8, 13, 18, 23. What went wrong and what is correct?"
      Back: "They used only the difference d = 5 and forgot c.\nCorrect: c = first term − d = 8 − 5 = 3, so Tₙ = 5n + 3.\nCheck the wrong rule: 5(1) = 5 ≠ 8 ✗. Correct rule: 5(1) + 3 = 8 ✓.\nLesson: Tₙ = dn + c always needs the constant c; do not drop it."
    tags: ["verify-rule", "subject:patterns"]
  - guid: 28f90a1b23415242
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "Question reads 'Determine which term in 3, 7, 11, 15, ... has a value of 43.' What exactly is being asked and how do you answer?"
      Back: "It asks for the POSITION n, not a value.\nRule: Tₙ = 4n − 1. Set 4n − 1 = 43 → 4n = 44 → n = 11.\nAnswer in words: '43 is the 11th term.'\nPitfall: do not answer with another value; the question wants the position number."
    tags: ["position-vs-value", "subject:patterns"]
  - guid: 390a1b2c34516353
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Describing and Verifying Rules"
    fields:
      Front: "Describe in words and as a formula the rule for the pattern in this table.  n: 1,2,3,4  Tₙ: 10, 8, 6, 4"
      Back: "In words: 'Start at 10 and subtract 2 each time.'\nFormula: d = 8 − 10 = −2, c = 10 − (−2) = 12, so Tₙ = −2n + 12.\nCheck: T₄ = −2(4) + 12 = 4 ✓.\nThis decreasing pattern still fits Tₙ = dn + c with a negative d."
    tags: ["rule-in-words", "subject:patterns"]
