- id: theme-dual-system-collision
  item: 'PRECISE ROOT CAUSE: TWO stylesheets both react to data-theme=dark with conflicting token redefinitions. (a) SDK 247420.css .ds-247420[data-theme=dark] (specificity 0,2,0) re-themes --bg/--fg/--panel-* and leaves --ink/--paper at base LIGHT values. (b) corpus style.css [data-theme=dark] (0,1,1, line 705) INVERTS the raw palette: --paper:#1A1B1E (dark), --ink:#F2EAD8 (light). Since corpus rules read a mix of raw (--ink/--paper) and semantic (--fg/--bg/--panel-*) tokens, and the two stylesheets set them with different specificity, the resolved colors are inconsistent -> the ''especially bust'' light/dark. FIX (architecturally correct, reduces maintenance, honors style.css line 3 ''Do NOT redefine DS tokens here''): remove corpus''s raw-palette inversion; migrate all semantic uses to SDK tokens (--fg/--bg/--panel-text/--panel-bg/--panel-2 etc) so the SDK alone owns theming. Keep corpus [data-theme=dark] only for genuinely corpus-specific overrides (img opacity, accent hues NOT in SDK).'
  why: 'DESIGN: dual-theme-system collision is the deepest cause; unifying on SDK tokens is the pliable-architecture fix.'
  status: completed
  witness: style.css [data-theme=dark]/[contrast] rescoped to .ds-247420[data-theme=...] driving semantic tokens (--bg/--fg/--panel-*); raw --ink/--paper inversion removed. browser-14 confirms consistent per-theme resolution.
