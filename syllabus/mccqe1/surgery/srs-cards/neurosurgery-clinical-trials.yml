# Neurosurgery Clinical Trials (Surgery) - generated from srs-mccqe1
cards:
  - front: "What did the CLEAR III trial (Lancet 2017) find regarding alteplase irrigation for intraventricular hemorrhage (IVH) via EVD?"
    back: "Alteplase 1mg q8h (up to 12 doses) via EVD did NOT significantly improve functional outcomes (mRS ≤3 at 180 days) compared to saline irrigation (48% vs 45%; RR 1.06, 95% CI 0.88–1.28; P=0.554).\n\nThe CLEAR III trial studied 500 patients with non-traumatic ICH <30mL + IVH obstructing the 3rd/4th ventricles. Despite pharmacological clot lysis, functional outcomes were equivalent. Alteplase should NOT be used routinely for IVH via EVD."
    difficulty: medium
    tags: [neurosurgery, intraventricular hemorrhage, IVH, EVD, alteplase, clinical trials, ICH]
  - front: "What did the MRC CRASH trial (Lancet 2004) establish about corticosteroids in traumatic brain injury?"
    back: "Corticosteroids (methylprednisolone 48h infusion) significantly INCREASED the risk of death (P=0.0001) in patients with head injury (GCS <14). Corticosteroids should NOT be used to treat head injury of any severity.\n\n10,008 patients with head injury were randomized. Corticosteroid use was harmful across all injury severities and time-since-injury subgroups. This trial definitively ended routine steroid use in TBI management."
    difficulty: easy
    tags: [neurosurgery, TBI, traumatic brain injury, corticosteroids, methylprednisolone, clinical trials, neurotrauma]
  - front: "What were the key findings of the DECRA trial (NEJM 2011) regarding decompressive craniectomy in diffuse TBI?"
    back: "In 155 patients with severe diffuse TBI and refractory ICP, early bifrontotemporoparietal decompressive craniectomy reduced ICP and ICU stay but was associated with POORER Extended Glasgow Outcome Scale scores (P=0.03) and greater risk of unfavourable outcomes (P=0.02) vs. standard care.\n\nWhile craniectomy successfully lowered ICP, it did not translate into better functional outcomes—paradoxically outcomes were worse. This challenged the assumption that ICP control alone improves prognosis in diffuse TBI."
    difficulty: medium
    tags: [neurosurgery, TBI, decompressive craniectomy, ICP, clinical trials, neurotrauma]
  - front: "What did the BEST:TRIP trial (NEJM 2012) conclude about ICP monitoring vs. imaging/clinical examination in severe TBI?"
    back: "In 324 patients with severe TBI, care guided by ICP monitoring was NO better than care based on imaging and clinical examination alone for the composite primary outcome (survival, consciousness, functional status, neuropsychological status at 3–6 months).\n\nBEST:TRIP was conducted in South America and challenged the routine use of ICP monitors in severe TBI management. It showed that experienced clinical teams using imaging-based protocols achieved equivalent outcomes, though criticisms included differences in ICU practice context."
    difficulty: medium
    tags: [neurosurgery, TBI, ICP monitoring, intracranial pressure, clinical trials, neurotrauma]
  - front: "What did the POLAR trial (JAMA 2018) find about prophylactic hypothermia in severe TBI?"
    back: "Prophylactic hypothermia (33–35°C for ≥72h and <7 days) did NOT improve 6-month neurologic outcomes (GOS-E score 5–8) compared to normothermia (48.8% vs 49.7%; RR 0.99; P=0.94) in 511 patients with severe TBI.\n\nDespite physiologic rationale for neuroprotection, prophylactic cooling after severe TBI confers no functional benefit. This is consistent with prior negative hypothermia trials (NABIS:H II, Eurotherm). Current guidelines do not recommend prophylactic hypothermia for TBI."
    difficulty: medium
    tags: [neurosurgery, TBI, hypothermia, neuroprotection, clinical trials, neurotrauma]
  - front: "In the Shunt Design Trial (Neurosurgery 1998) for pediatric hydrocephalus, which valve type performed best?"
    back: "There was NO significant difference in shunt failure-free duration among the standard differential-pressure valve, Delta valve, or Orbis-Sigma valve (P=0.24). 61% were shunt failure-free at 1 year and 47% at 2 years.\n\n344 hydrocephalic children undergoing first shunt insertion were randomized to three valve types. Anti-siphon and flow-control valves designed to limit overdrainage provided no advantage over standard valves, guiding simplified shunt selection."
    difficulty: medium
    tags: [neurosurgery, pediatric neurosurgery, hydrocephalus, CSF shunt, valve, clinical trials]
  - front: "How does endoscopic third ventriculostomy (ETV) compare to CSF shunting in pediatric hydrocephalus over time?"
    back: "ETV has a HIGHER initial failure rate than shunts (first ~3 months), but after 3 months the relative risk of failure progressively favours ETV, suggesting a long-term survival benefit over shunting.\n\nThis propensity-score adjusted cohort analysis demonstrated that ETV's early failure risk is offset by superior long-term patency. ETV is now preferred for obstructive hydrocephalus in appropriate candidates, avoiding the lifelong shunt dependency and revision burden."
    difficulty: medium
    tags: [neurosurgery, pediatric neurosurgery, hydrocephalus, ETV, endoscopic third ventriculostomy, CSF shunt]
  - front: "What did the randomized trial of surgery for temporal-lobe epilepsy (NEJM 2001) demonstrate?"
    back: "Surgery was vastly superior to antiepileptic drug therapy: 58% of surgical patients were seizure-free (awareness-impairing seizures) vs. only 8% in the medical group (P<0.001), with significantly better quality of life.\n\n80 patients with temporal lobe epilepsy were randomized to surgery vs. 1 year of continued medical therapy. This landmark trial established early surgical referral as the standard of care for drug-resistant temporal lobe epilepsy rather than prolonged medication trials."
    difficulty: easy
    tags: [neurosurgery, epilepsy, temporal lobe epilepsy, surgery, functional neurosurgery, clinical trials]
  - front: "What did the PROCESS trial (Pain 2007) find about spinal cord stimulation (SCS) for failed back surgery syndrome (FBSS)?"
    back: "SCS plus conventional medical management (CMM) achieved ≥50% leg pain relief in 48% vs. 9% with CMM alone (P<0.001), with improved quality of life and function. 32% of SCS patients experienced device-related complications at 12 months.\n\n100 FBSS patients with neuropathic radicular leg pain were randomized. SCS is now an evidence-based treatment for FBSS when conservative measures fail. The high complication rate (32%) underscores the need for careful patient selection and technical expertise."
    difficulty: medium
    tags: [neurosurgery, spinal cord stimulation, failed back surgery syndrome, neuropathic pain, functional neurosurgery, clinical trials]
  - front: "What did the EARLYSTIM trial (NEJM 2013) establish about deep brain stimulation (DBS) timing in Parkinson's disease?"
    back: "DBS (neurostimulation) in early-stage Parkinson's disease improved quality of life by 7.8 points vs. a 0.2-point worsening with medical therapy alone (P=0.002), with benefits in motor function, ADLs, and dyskinesia. Serious surgical adverse events occurred in 17.7%.\n\nEARLYSTIM challenged the practice of reserving DBS for advanced disease. Earlier neurostimulation provides superior quality of life outcomes, supporting consideration of DBS when early motor complications emerge rather than waiting for disease progression."
    difficulty: medium
    tags: [neurosurgery, Parkinsons disease, deep brain stimulation, DBS, functional neurosurgery, clinical trials]
  - front: "What did the focused ultrasound thalamotomy RCT (NEJM 2016) demonstrate for essential tremor?"
    back: "Unilateral MRI-guided focused ultrasound thalamotomy improved hand tremor scores by 8.3 points more than sham (95% CI 5.9–10.7; P<0.001) at 3 months, with sustained improvement at 12 months (7.2-point change from baseline).\n\n76 patients with refractory moderate-to-severe essential tremor were randomized. This non-invasive treatment targets the ventral intermediate nucleus (VIM) of the thalamus, providing a therapeutic alternative to DBS or conventional surgical thalamotomy without craniotomy."
    difficulty: medium
    tags: [neurosurgery, essential tremor, focused ultrasound, thalamotomy, functional neurosurgery, clinical trials]
  - front: "What did the landmark trial on surgery vs. XRT for metastatic spinal cord compression (Lancet 2005) show?"
    back: "Direct decompressive surgery followed by radiotherapy (XRT) was superior to XRT alone: 84% vs. 57% of patients could walk after treatment (OR 6.2; P=0.001) in 101 patients with metastatic spinal cord compression.\n\nThis Patchell et al. trial established that for patients with radiographically confirmed metastatic spinal cord compression and expected survival >3 months, direct decompressive surgery + XRT is the standard of care, significantly improving ambulatory function."
    difficulty: easy
    tags: [neurosurgery, spine surgery, spinal cord compression, metastatic cancer, radiation therapy, clinical trials]
  - front: "What did the SPORT trial 8-year results (Spine 2014) show about surgery vs. non-operative treatment for lumbar disc herniation?"
    back: "In intention-to-treat analysis, open discectomy was superior for sciatica severity (P=0.005), patient satisfaction (P=0.013), and self-rated improvement (P=0.013) at 8 years. Pain/function/disability benefits were only demonstrated in as-treated analysis due to high cross-over rates.\n\n501 patients with confirmed lumbar disc herniation were randomized. The high cross-over rate (many non-surgical patients eventually had surgery) limited the ITT analysis. The as-treated analysis favoured surgery. Carefully selected surgical candidates derive meaningful long-term benefit."
    difficulty: medium
    tags: [neurosurgery, spine surgery, lumbar disc herniation, discectomy, sciatica, clinical trials]
  - front: "What did the SPORT 8-year results for lumbar spinal stenosis (Spine 2015) demonstrate about decompressive laminectomy?"
    back: "Decompressive laminectomy showed early benefits over non-operative care until ~4 years, but primary outcome differences converged between years 5–8. Symptomatic benefits of surgery for lumbar spinal stenosis may diminish beyond 4 years.\n\n289 patients were randomized (laminectomy vs. non-operative care). The 52% crossover rate in the non-operative group limited ITT analysis. Clinicians should set realistic expectations with patients—surgical benefits for stenosis are meaningful but may not be permanent."
    difficulty: medium
    tags: [neurosurgery, spine surgery, lumbar spinal stenosis, laminectomy, clinical trials]
  - front: "What did the STASCIS study (PLoS ONE 2012) find about timing of surgical decompression for traumatic cervical SCI?"
    back: "Early surgical decompression (<24h) was associated with greater neurological recovery: odds of ≥2 AIS grade improvement were 2.83 times higher with early vs. late surgery (95% CI 1.10–7.28), with no significant difference in complication rates (P=0.21).\n\n313 patients with cervical SCI at 6 North American institutions were studied. STASCIS was foundational evidence establishing <24h decompression as the target timeframe for cervical SCI, now reflected in Canadian and international clinical guidelines."
    difficulty: easy
    tags: [neurosurgery, spine surgery, spinal cord injury, SCI, decompression, timing, clinical trials]
  - front: "What did the pooled analysis on timing of decompression for acute SCI (Lancet Neurology 2021) confirm?"
    back: "Early surgery (<24h) in 528 patients resulted in greater 1-year motor recovery (+23.7 points) vs. late surgery in 1020 patients (+19.7 points), MD 4.0 points (P=0.0006), with similar improvements in light touch and pin prick scores. The critical window is the first 24–36h.\n\nThis large pooled analysis of 4 prospective multicenter datasets (1991–2017) confirms that the first 24–36h after acute SCI is the optimal window for decompressive surgery to maximize sensorimotor recovery—aligned with STASCIS and current guidelines."
    difficulty: medium
    tags: [neurosurgery, spine surgery, spinal cord injury, SCI, decompression, timing, clinical trials]
  - front: "What did the RCT on ventral vs. dorsal surgery for cervical spondylotic myelopathy (JAMA 2021) conclude?"
    back: "Ventral and dorsal surgery achieved equivalent improvement in patient-reported physical functioning at 1 year (5.9 vs. 6.2 points on SF-36 PCS; mean difference 0.3; 95% CI −2.6 to 3.1; P=0.86) in 163 patients with multilevel cervical spondylotic myelopathy.\n\nSurgical approach selection (anterior vs. posterior) for multilevel CSM should be individualized based on anatomy, pathology pattern, and surgeon expertise, as both approaches yield equivalent functional outcomes. This supports flexibility in surgical planning."
    difficulty: medium
    tags: [neurosurgery, spine surgery, cervical myelopathy, CSM, ventral surgery, dorsal surgery, clinical trials]
  - front: "What did the CSM-Protect trial (Lancet 2021) find about riluzole in degenerative cervical myelopathy?"
    back: "Riluzole (50mg twice daily, perioperative) did NOT enhance functional recovery beyond decompressive surgery alone. No difference in modified Japanese Orthopaedic Association (mJOA) score change was found (difference −0.38 points; P=0.14) in 290 patients.\n\nRiluzole, a glutamate antagonist approved for ALS, was hypothesized to provide neuroprotection during surgical decompression for degenerative cervical myelopathy. This phase 3 RCT found no benefit, ruling out riluzole as adjuvant therapy for CSM."
    difficulty: hard
    tags: [neurosurgery, spine surgery, cervical myelopathy, riluzole, clinical trials, neuroprotection]
