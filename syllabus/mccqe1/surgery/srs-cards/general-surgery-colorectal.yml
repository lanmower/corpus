# General Surgery Colorectal (Surgery) - generated from srs-mccqe1
cards:
  - front: "What is Goodsall's rule for fistula-in-ano?"
    back: "Fistulas with an external opening anterior to a transverse line through the anus track in a straight line to the dentate line (straight anterior course). Fistulas posterior to this transverse line curve and open in the posterior midline at the dentate line (curved course).\n\nGoodsall's rule helps predict the internal opening of an anorectal fistula, guiding surgical planning. Understanding the anatomy is critical to avoid sphincter injury during repair."
    difficulty: easy
    tags: [colorectal surgery, fistula-in-ano, anorectal, Goodsalls rule]
  - front: "What is the primary surgical treatment for a low-lying fistula-in-ano (not involving the external sphincter)?"
    back: "Primary fistulotomy: unroofing the tract from external to internal opening, allowing healing by secondary intention.\n\nFistulotomy is curative for low-lying fistulas that do not involve the external sphincter. High-lying fistulas involving the external sphincter require staged procedures with a Seton suture to avoid fecal incontinence."
    difficulty: easy
    tags: [colorectal surgery, fistula-in-ano, fistulotomy, anorectal]
  - front: "What is the LIFT procedure for fistula-in-ano?"
    back: "Ligation of Intersphincteric Fistula Tract (LIFT): accesses the fistula between the internal and external sphincter muscles, ligating the tract while sparing the sphincters.\n\nLIFT is used for complex fistulas to preserve sphincter function, thereby reducing the risk of fecal incontinence. It is part of the sphincter-sparing approach for high transsphincteric fistulas."
    difficulty: medium
    tags: [colorectal surgery, fistula-in-ano, LIFT, sphincter-sparing]
  - front: "What is the role of a Seton suture in treating high-lying fistula-in-ano?"
    back: "A Seton (rubber band or suture) is placed through the fistula tract involving the external sphincter. It promotes drainage and fibrosis, delineates anatomy, and reduces the incidence of incontinence by staged division of the sphincter.\n\nHigh fistulas involving the external sphincter cannot be fully unroofed without causing fecal incontinence. The Seton slowly cuts through the sphincter over time, allowing fibrosis that maintains continence."
    difficulty: medium
    tags: [colorectal surgery, fistula-in-ano, Seton, sphincter preservation]
  - front: "What is the definition of pilonidal disease?"
    back: "A cyst or abscess near/on the intergluteal cleft of the sacrococcygeal area, containing hair and skin debris. It results from obstruction of hair follicles in that area.\n\nPilonidal means 'nest of hair' (pilo = hair, nidal = nest). It is associated with prolonged sitting, obesity, and high body hair density. Most common in young men aged 15-35."
    difficulty: easy
    tags: [colorectal surgery, pilonidal disease, anorectal, abscess]
  - front: "What percentage of pilonidal abscesses treated with I&D develop chronic pilonidal sinuses?"
    back: "40%\n\nSimple I&D is effective for acute infection but has a high recurrence rate. Surgical excision (pilonidal cystotomy) is indicated for failure of healing, recurrent disease, or complex disease."
    difficulty: easy
    tags: [pilonidal disease, I&D, complications, surgery]
  - front: "Describe the two types of rectal prolapse."
    back: "1. False/partial/mucosal prolapse: only the mucosa protrudes; shows radial furrows; most common in childhood.\n2. True/complete prolapse: full-thickness extrusion of rectal wall; shows concentric folds. Graded 1st (includes mucocutaneous junction), 2nd (without mucocutaneous junction), or 3rd degree (internal/occult intussusception).\n\nDistinguishing true from false prolapse affects management. True prolapse is most common overall and more common in women >50 years. False prolapse can mimic hemorrhoids."
    difficulty: easy
    tags: [colorectal surgery, rectal prolapse, pelvic floor, mucosal prolapse]
  - front: "What are the risk factors for rectal prolapse?"
    back: "Gynecological surgery, chronic neurologic/psychiatric disorders affecting motility (e.g., chronic constipation), multiparity, and weak pelvic floor.\n\nRectal prolapse affects extremes of age (<5 yr and >50 yr) and predominantly women (85%). Pelvic floor weakness and chronic straining are key predisposing factors."
    difficulty: easy
    tags: [rectal prolapse, risk factors, pelvic floor, colorectal surgery]
  - front: "What is the most common tumour of the anal canal, and how is it treated?"
    back: "Squamous cell carcinoma (SCC) accounts for 75% of anal canal tumours. Treatment is chemoradiation (for most cases). Surgery (local excision) is reserved for very early lesions; salvage APR (abdominoperineal resection) for chemoradiation failures.\n\nSCC of the anal canal is strongly associated with HPV infection. High-grade squamous intraepithelial lesion (HSIL) is a precursor. 5-year survival is 80% with chemoradiation."
    difficulty: easy
    tags: [anal cancer, SCC, anal canal, chemoradiation, HPV]
  - front: "What is the prognosis of anal canal malignant melanoma?"
    back: "Less than 5% 5-year survival. It is the 3rd most common site for primary malignant melanoma (after skin and eyes), with aggressive behavior and frequent distant metastases at diagnosis.\n\nAnal melanoma is often diagnosed late due to non-specific symptoms (bleeding, mass, pain, change in bowel habits). Only one-third are pigmented. Treatment is wide local excision or APR, but prognosis remains very poor."
    difficulty: easy
    tags: [anal cancer, malignant melanoma, anorectal, prognosis]
