# Substance Use Disorders (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "A 45-year-old man is brought to the ED in acute alcohol withdrawal 24 hours after his last drink. He has tremors, diaphoresis, tachycardia, and is anxious. CIWA-Ar score is 18. What is the management?"
    back: "Alcohol withdrawal: symptom-triggered benzodiazepine dosing using CIWA-Ar scale (lorazepam or diazepam); IV thiamine 100mg BEFORE glucose; monitor for delirium tremens and seizures\n\nCCSMH (Canadian Coalition for Seniors Mental Health) and CAMH guidelines: IV/IM thiamine must be given BEFORE glucose to prevent Wernicke encephalopathy. Symptom-triggered benzodiazepine reduces medication use vs. fixed-dose schedule. Delirium tremens (Day 3-5): severe withdrawal with hyperthermia, hallucinations, autonomic instability."
    difficulty: hard
    tags: [alcohol withdrawal, CIWA-Ar, benzodiazepine, thiamine, Wernicke, psychiatry]
  - front: "What medications are approved for alcohol use disorder (AUD) treatment in Canada?"
    back: "Naltrexone (reduces craving, blocks opioid reward), acamprosate (reduces GABA/glutamate imbalance), disulfiram (aversive — acetaldehyde accumulation); extended-release naltrexone (Vivitrol) IM monthly\n\nCANMAT/CAMH AUD guidelines: all three medications approved in Canada. Naltrexone preferred for heavy drinkers who want to reduce or abstain. Acamprosate for maintaining abstinence. Disulfiram requires high motivation (patient must consent to aversive reaction). Combine with behavioral therapy."
    difficulty: medium
    tags: [alcohol use disorder, naltrexone, acamprosate, disulfiram, AUD treatment, psychiatry]
  - front: "What is opioid use disorder and what is the preferred treatment in Canada?"
    back: "OUD: pattern of opioid use causing distress/impairment + ≥2 DSM-5 criteria; first-line treatment: buprenorphine-naloxone (Suboxone) or methadone — OAT (Opioid Agonist Therapy) reduces mortality 60-70%\n\nCAMH and CCS (College of Family Physicians of Canada) guidelines: OAT is the gold standard for OUD. Buprenorphine-naloxone is preferred (lower overdose risk, office-based prescribing). Methadone requires monitored daily dosing at licensed pharmacy. Extended-release naltrexone (Vivitrol) as alternative."
    difficulty: medium
    tags: [opioid use disorder, OAT, buprenorphine, methadone, naloxone, psychiatry]
  - front: "A patient is found unresponsive with pinpoint pupils, bradypnea (4 breaths/min), and is cyanotic. Suspected opioid overdose. What is the immediate management?"
    back: "Naloxone (Narcan) 0.4-2 mg IV/IM/intranasal; support airway (BVM ventilation); repeat naloxone q2-3 min up to 10 mg if no response; titrate to adequate breathing (not full reversal to avoid withdrawal and re-narcotization)\n\nCAMH naloxone guidelines: naloxone half-life (30-90 min) is shorter than most opioids — monitor for re-narcotization. Fentanyl overdose may require multiple higher doses (4-6 mg total). Take-home naloxone kits should be offered to all opioid users. Naloxone is available OTC in all Canadian provinces."
    difficulty: hard
    tags: [opioid overdose, naloxone, Narcan, overdose reversal, psychiatry]
  - front: "What is the CAGE questionnaire and the AUDIT-C for alcohol screening?"
    back: "CAGE: Cut down, Annoyed, Guilty, Eye-opener — ≥2 positive = probable AUD (sensitivity 71%, specificity 90%); AUDIT-C: first 3 questions of AUDIT — score ≥4 (men) or ≥3 (women) suggests harmful drinking\n\nCAMH guidelines recommend AUDIT (Alcohol Use Disorders Identification Test) as standard screening tool in primary care. AUDIT-C is a brief validated screen. CAGE is simpler but less sensitive for detecting hazardous drinking (only detects dependence). Use in combination with clinical interview."
    difficulty: easy
    tags: [CAGE questionnaire, AUDIT, alcohol screening, AUD, psychiatry]
  - front: "What is the delirium tremens (DT) and what are the risk factors and management?"
    back: "DT: severe alcohol withdrawal (Day 3-5): altered consciousness, vivid hallucinations (tactile, visual), autonomic instability (hyperthermia, tachycardia, hypertension), seizures — 5-15% mortality if untreated\n\nRisk factors for DT: prior DT, high CIWA-Ar, long duration of heavy drinking, BAL >300 mg/dL, acute medical illness, older age. Management: ICU admission, high-dose IV benzodiazepines (lorazepam or diazepam), phenobarbital for refractory cases, supportive care, treat precipitants."
    difficulty: hard
    tags: [delirium tremens, alcohol withdrawal, DT, benzodiazepines, ICU, psychiatry]
  - front: "What is cannabis use disorder and what are the health risks of chronic cannabis use?"
    back: "Cannabis use disorder: ≥2 DSM-5 criteria from 11; health risks: CUD, cannabis hyperemesis syndrome, increased psychosis risk (2x in heavy users, especially with high-THC products), cognitive impairment (especially with adolescent onset), bronchitis\n\nCANMAT and CAMH: no approved pharmacotherapy for cannabis use disorder. CBT and motivational enhancement therapy are evidence-based. Cannabis hyperemesis syndrome: recurrent vomiting, paradoxically relieved by hot showers — treat with haloperidol, capsaicin cream, and cessation of cannabis."
    difficulty: medium
    tags: [cannabis use disorder, CUD, cannabis hyperemesis, psychosis risk, psychiatry]
  - front: "What is the management of stimulant (cocaine, methamphetamine) intoxication?"
    back: "Cocaine intoxication: benzodiazepines for agitation/seizures, supportive care; avoid beta-blockers (unopposed alpha stimulation); CCBs or nitrates for coronary vasospasm; methamphetamine: similar management + treat hyperthermia aggressively\n\nCAMH guidelines: cocaine overdose has no antidote. Cardiac complications (MI, VF) require standard ACS management — avoid beta-blockers. Hyperthermia from methamphetamine is life-threatening — active cooling with misting fans + benzodiazepines. Haloperidol for psychosis."
    difficulty: hard
    tags: [cocaine intoxication, methamphetamine, stimulant overdose, benzodiazepines, psychiatry]
  - front: "What screening tools are available for substance use in primary care?"
    back: "AUDIT (alcohol), ASSIST (Alcohol, Smoking and Substance Involvement Screening Test — multiple substances), DAST-10 (Drug Abuse Screening Test), CAGE-AID (adapted for drugs)\n\nCANMAT guidelines recommend brief intervention after positive substance screening. 5-minute brief motivational interview at primary care level can reduce alcohol consumption. SBIRT (Screening, Brief Intervention, and Referral to Treatment) model is evidence-based."
    difficulty: easy
    tags: [AUDIT, ASSIST, DAST, substance screening, psychiatry]
  - front: "What are the principles of harm reduction in substance use?"
    back: "Harm reduction: reducing health, social, and economic harms without requiring abstinence; includes needle exchange programs, naloxone distribution, supervised consumption sites, drug checking services, OAT without abstinence requirements\n\nCAMH/PHAC guidelines support harm reduction as an evidence-based approach to SUD. Supervised consumption sites (SCS) in Canada reduce overdose deaths, infections (HIV, hepatitis C), and emergency department visits without increasing community drug use. OAT is the highest-impact harm reduction intervention."
    difficulty: medium
    tags: [harm reduction, supervised consumption, needle exchange, naloxone distribution, psychiatry]
  - front: "What is Wernicke-Korsakoff syndrome and how is it prevented?"
    back: "Wernicke: acute thiamine (vitamin B1) deficiency — confusion, ataxia, ophthalmoplegia; Korsakoff: chronic amnestic syndrome from thiamine deficiency — anterograde amnesia, confabulation; prevent with IV thiamine before glucose in all alcohol-related presentations\n\nWernicke encephalopathy is reversible with IV thiamine — treatment must be given BEFORE glucose (glucose depletes thiamine). Korsakoff syndrome: 80% permanent amnesia. IV thiamine dose: 200-500 mg TID for 3-5 days (high doses needed for bioavailability). Give to all alcohol-related ED presentations."
    difficulty: hard
    tags: [Wernicke-Korsakoff, thiamine deficiency, alcohol, confabulation, psychiatry]
  - front: "What is tobacco use disorder and what are the most effective cessation treatments?"
    back: "Most effective: varenicline (Champix) — nicotinic receptor partial agonist (NRT 2.3x placebo, most effective individual treatment); combination NRT (patch + short-acting); bupropion; counseling enhances all pharmacotherapies\n\nCANMAT/CAMH tobacco guidelines: varenicline doubles quit rates compared to NRT alone. Start 1 week before quit date. Side effects: nausea, vivid dreams, rare psychiatric effects (screen carefully). Combination NRT (patch + gum/lozenge) is more effective than patch alone."
    difficulty: medium
    tags: [tobacco cessation, varenicline, NRT, nicotine replacement, psychiatry]
  - front: "What is the treatment for benzodiazepine dependence?"
    back: "Gradual taper (10% dose reduction per week or per month for long-term users) using equivalent long-acting benzodiazepine (diazepam); CBT and psychoeducation; do NOT abruptly stop (seizure risk); avoid switching to another benzodiazepine\n\nCANMAT guidelines: benzodiazepine withdrawal can be life-threatening (seizures). Convert to equivalent diazepam dose and taper over months. Carbamazepine or valproate may help. Gabapentin as adjunct for protracted withdrawal symptoms. Prevent new long-term benzodiazepine prescribing."
    difficulty: hard
    tags: [benzodiazepine dependence, withdrawal, taper, diazepam, psychiatry]
  - front: "A 35-year-old heroin user is starting buprenorphine-naloxone (Suboxone). When should the first dose be given?"
    back: "Give first dose when COWS score ≥8 (Clinical Opiate Withdrawal Scale — moderate withdrawal) or 12-24 hours after last short-acting opioid, 24-72 hours after last long-acting opioid\n\nCAMH/CPSO guidelines: buprenorphine must be given when patient is in moderate withdrawal to prevent precipitated withdrawal (buprenorphine displaces full agonists from receptors, precipitating acute withdrawal if given too early). Low-dose induction (microdosing/Bernese protocol) for patients on high-dose fentanyl."
    difficulty: hard
    tags: [buprenorphine induction, COWS, Suboxone, OAT, opioid withdrawal, psychiatry]
  - front: "What are the CANMAT low-risk alcohol use guidelines (LRDG)?"
    back: "Low-risk drinking: ≤2 standard drinks/day (≤10/week for women, ≤15/week for men), with ≤3 per occasion — updated 2023 Canada guidance: >2 drinks/week = moderate risk, >6/week = high risk\n\nCAMH/CCSA 2023 Canadian alcohol guidance: new evidence shows even low levels of alcohol increase cancer risk (breast, colorectal, liver). No safe level for cancer. Revised thresholds: 0-2 drinks/week = low risk; 3-6/week = moderate risk; 7+/week = high risk."
    difficulty: easy
    tags: [low-risk alcohol, LRDG, CCSA, Canadian alcohol guidelines, psychiatry]
  - front: "What is CAGE screening for alcohol use disorder?"
    back: "Cut down, Annoyed by criticism, Guilty, Eye-opener. >=2 positive = likely alcohol use disorder\n\nAUDIT more sensitive (10 questions). DSM-5 AUD: >=2 of 11 criteria in 12 months. Mild(2-3), moderate(4-5), severe(>=6). Withdrawal: benzodiazepines (CIWA protocol)."
    difficulty: easy
    tags: [CAGE, alcohol]
  - front: "What are the CAGE and AUDIT screening tools for alcohol use disorder?"
    back: "CAGE: Cut down (tried to?), Annoyed (by criticism?), Guilty (about drinking?), Eye-opener (morning drink?). >=2 positive = high suspicion for AUD. AUDIT (Alcohol Use Disorders Identification Test): 10 items scoring 0-40. 8-15: hazardous drinking. 16-19: harmful drinking. >=20: possible dependence. AUDIT-C (first 3 items): screening version, score >=4 men / >=3 women is positive.\n\nCAGE is quick but less sensitive for early/hazardous drinking. AUDIT is the gold standard screening tool recommended by CCSA (Canadian Centre on Substance Abuse). AUDIT is more sensitive and specific than CAGE. Canadian primary care guidelines recommend universal alcohol screening."
    difficulty: medium
    tags: [CAGE, AUDIT, alcohol screening, substance use, psychiatry]
  - front: "What are the DSM-5 criteria for substance use disorder?"
    back: ">=2 of 11 criteria in 12 months: (1) larger amounts/longer than intended, (2) persistent desire/unsuccessful efforts to cut down, (3) excessive time obtaining/using/recovering, (4) craving, (5) failure to fulfill role obligations, (6) continued use despite social problems, (7) given up activities, (8) use in hazardous situations, (9) continued despite physical/psychological problems, (10) tolerance, (11) withdrawal. Severity: mild (2-3), moderate (4-5), severe (>=6).\n\nDSM-5 eliminated the abuse/dependence distinction, creating a single spectrum. Craving was added as a new criterion. The dimensional severity approach guides treatment intensity. Canadian clinical practice guidelines use DSM-5 criteria for all substance use disorders."
    difficulty: medium
    tags: [substance use disorder, DSM-5, diagnostic criteria, psychiatry]
  - front: "What is the management of alcohol withdrawal syndrome?"
    back: "CIWA-Ar (Clinical Institute Withdrawal Assessment) guides treatment. Mild (CIWA <10): supportive, thiamine. Moderate (10-18): benzodiazepine (diazepam 10-20mg or lorazepam 2-4mg) on symptom-triggered protocol. Severe (>20) or seizures: aggressive benzodiazepine loading, ICU consideration. Prevention of Wernicke: thiamine 200-500mg IV BEFORE glucose. Phenobarbital for refractory cases. Nutritional support: thiamine, folate, magnesium.\n\nSymptom-triggered protocols (benzodiazepines given based on CIWA score) are superior to fixed-schedule dosing (less medication, shorter treatment). Lorazepam is preferred in liver disease (no active metabolites). Alcohol withdrawal seizures peak at 24-48h. DT peak at 48-72h with 5-15% mortality if untreated."
    difficulty: hard
    tags: [alcohol withdrawal, CIWA, benzodiazepine, delirium tremens, psychiatry]
  - front: "What are the pharmacological treatments for alcohol use disorder?"
    back: "First-line: naltrexone 50mg/day PO or 380mg IM monthly (opioid antagonist, reduces craving/heavy drinking-contraindicated if opioid use). Acamprosate 666mg TID (GABA modulator, supports abstinence-safe in liver disease). Second-line: topiramate, gabapentin. Disulfiram 250mg/day (aldehyde dehydrogenase inhibitor-aversive therapy, requires motivation). Adjunct: thiamine supplementation.\n\nCCSA and CRISM (Canadian Research Initiative on Substance Misuse) guidelines recommend naltrexone or acamprosate as first-line pharmacotherapy combined with psychosocial interventions. Naltrexone is particularly effective for reducing heavy drinking days. Canadian availability of injectable naltrexone (Vivitrol) is limited."
    difficulty: hard
    tags: [alcohol use disorder treatment, naltrexone, acamprosate, psychiatry]
  - front: "What is the approach to opioid use disorder treatment in Canada?"
    back: "First-line: opioid agonist therapy (OAT). Buprenorphine-naloxone (Suboxone): first-line per CRISM, can be initiated in office (micro-dosing or traditional induction), partial agonist, safer in overdose. Methadone: full agonist, requires daily witnessed ingestion initially, designated prescriber. Slow-release oral morphine (Kadian): second-line. Adjuncts: naltrexone (after detox only), psychosocial interventions, harm reduction.\n\nCanadian Opioid Use Disorder Guidelines (CRISM) recommend buprenorphine-naloxone as first-line. OAT reduces mortality by 50%, reduces illicit opioid use, HIV/HCV transmission, and criminal activity. Naloxone kits are widely distributed in Canada for overdose reversal. Safe consumption sites are operating in several Canadian cities."
    difficulty: hard
    tags: [opioid use disorder, buprenorphine, methadone, OAT, psychiatry]
  - front: "What is the management of acute opioid overdose?"
    back: "Signs: respiratory depression (RR <12), miosis, decreased LOC. ABCs first. Naloxone: 0.4-2mg IV/IM/SC/IN, repeat q2-3min (max 10mg). Onset: 2 min IV, 5 min IM. Duration: 30-90 min (shorter than most opioids-monitor for renarcotization). If IV access unavailable: intranasal naloxone 4mg. Observe >=2h (longer for long-acting opioids). Consider intubation if no response to naloxone.\n\nCanadian opioid crisis: >7000 deaths annually. Take-home naloxone programs are available across all provinces. Naloxone can precipitate withdrawal in opioid-dependent patients-titrate to adequate respirations, not full consciousness. Fentanyl overdoses may require higher naloxone doses."
    difficulty: hard
    tags: [opioid overdose, naloxone, emergency management, psychiatry]
  - front: "What is the approach to cannabis use disorder?"
    back: "Prevalence: ~7% of Canadian cannabis users meet criteria for CUD. Assessment: frequency, amount, method, age of onset, functional impairment. No approved pharmacotherapy for CUD. Treatment: CBT, motivational enhancement therapy (MET), contingency management. Cannabis hyperemesis syndrome: cyclic vomiting, hot bathing behavior, capsaicin cream. Psychosis risk: dose-dependent, especially with high-THC products and early-onset use.\n\nCanada legalized recreational cannabis in 2018. CCSA Lower-Risk Cannabis Use Guidelines recommend: delay use until after 25, avoid high-THC products, avoid smoking, avoid frequent use. Cannabis use in adolescence increases psychosis risk 2-4x (particularly with daily use of high-potency products)."
    difficulty: medium
    tags: [cannabis use disorder, CUD, psychosis risk, psychiatry]
  - front: "What is the approach to benzodiazepine use disorder and deprescribing?"
    back: "Gradual taper is essential (abrupt cessation causes seizures, delirium, death). Taper: switch to long-acting agent (diazepam) if on short-acting, reduce 10-25% every 1-2 weeks. Slower at lower doses. Total taper: 8-16 weeks minimum. Adjuncts: CBT for insomnia, pregabalin for anxiety during taper. Monitor for protracted withdrawal (anxiety, insomnia lasting months).\n\nCCSA and Choosing Wisely Canada recommend deprescribing benzodiazepines in chronic users, especially elderly. Canadian Deprescribing Network provides guidelines. Benzodiazepine withdrawal syndrome: anxiety, insomnia, irritability, tremor, sensory hypersensitivity, psychosis, seizures. Risk of seizure increases with high dose and long duration."
    difficulty: hard
    tags: [benzodiazepine deprescribing, taper, withdrawal, psychiatry]
  - front: "What are the clinical features and management of stimulant intoxication and withdrawal?"
    back: "Intoxication (cocaine/amphetamine): euphoria, hyperactivity, tachycardia, hypertension, hyperthermia, dilated pupils, agitation, psychosis, seizures, chest pain (cocaine-coronary vasospasm). Management: benzodiazepines (NOT beta-blockers for cocaine-unopposed alpha stimulation), cooling, cardiac monitoring. Withdrawal: crash (fatigue, hypersomnia, dysphoria, increased appetite). No specific pharmacotherapy for stimulant use disorder.\n\nCocaine chest pain: treat as ACS but avoid beta-blockers (may worsen coronary vasospasm). Use benzodiazepines and nitroglycerin. Canadian stimulant use is rising (especially methamphetamine in Western Canada). Contingency management has best evidence for stimulant use disorder but limited availability in Canada."
    difficulty: hard
    tags: [stimulant intoxication, cocaine, methamphetamine, psychiatry]
  - front: "What is Wernicke-Korsakoff syndrome and how is it prevented?"
    back: "Wernicke encephalopathy (acute): triad of confusion, ataxia, ophthalmoplegia (nystagmus, 6th nerve palsy). Only 10-16% have classic triad. Caused by thiamine (B1) deficiency. Treatment: thiamine 200-500mg IV TID for 3-5 days (ALWAYS give BEFORE glucose). Korsakoff syndrome (chronic): anterograde and retrograde amnesia, confabulation. Often irreversible. Prevention: thiamine supplementation for ALL alcohol-dependent patients.\n\nWernicke is a medical emergency with 20% mortality if untreated. Oral thiamine is poorly absorbed in alcoholics-IV is essential. Give thiamine before glucose in all malnourished/alcohol patients to prevent precipitating Wernicke. Korsakoff develops in 80% of untreated Wernicke. Canadian guidelines recommend routine thiamine supplementation for all admitted alcohol-dependent patients."
    difficulty: hard
    tags: [Wernicke-Korsakoff, thiamine, alcohol-related brain damage, psychiatry]
  - front: "What is the harm reduction approach to substance use in Canada?"
    back: "Key principles: pragmatic acceptance that substance use exists, focus on reducing harm without requiring abstinence. Canadian programs: needle exchange programs, supervised consumption sites (supervised injection sites), naloxone distribution, drug checking services, safer supply programs, housing-first approaches.\n\nHarm reduction is a pillar of Canadian drug policy per CCSA and Canadian federal health policy. InSite (Vancouver) was the first supervised consumption site in North America. Supreme Court of Canada upheld its legality in 2011. Safe supply prescribing (prescribed opioids to replace illicit supply) is expanding in Canada."
    difficulty: medium
    tags: [harm reduction, supervised consumption, naloxone, Canadian drug policy, psychiatry]
  - front: "What is the management of nicotine dependence?"
    back: "Fagerström Test for Nicotine Dependence assesses severity. First-line pharmacotherapy: varenicline (most effective, partial nicotinic agonist), NRT (patch + gum/lozenge combination), bupropion. Combination NRT = long-acting (patch) + short-acting (gum/inhaler/lozenge). Counseling + pharmacotherapy is most effective. Varenicline: start 1 week before quit date, 0.5mg x 3 days, 0.5mg BID x 4 days, then 1mg BID x 12 weeks. Extend to 24 weeks for relapse prevention.\n\nCAN-ADAPTT (Canadian Action Network for Advancement and Prevention of Treatment of Tobacco) provides evidence-based guidelines. Smoking is the leading cause of preventable death in Canada. All healthcare encounters should include smoking status assessment and brief intervention (5 As: Ask, Advise, Assess, Assist, Arrange)."
    difficulty: hard
    tags: [smoking cessation, varenicline, NRT, nicotine dependence, psychiatry]
  - front: "What is motivational interviewing and its application in substance use?"
    back: "MI: collaborative, person-centered communication style for strengthening motivation to change. Principles: express empathy (reflective listening), develop discrepancy (between current behavior and goals), roll with resistance (avoid arguing), support self-efficacy. Stages of Change: precontemplation, contemplation, preparation, action, maintenance, relapse.\n\nMI is the most widely taught brief intervention technique in Canadian medical education. Evidence supports MI across substance use disorders, medication adherence, and health behavior change. A single MI session can reduce harmful alcohol use. FRAMES approach: Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy."
    difficulty: medium
    tags: [motivational interviewing, stages of change, brief intervention, psychiatry]
  - front: "What is the approach to concurrent disorders (substance use + mental illness)?"
    back: "Integrated treatment: address both simultaneously (sequential treatment leads to poor outcomes). Common combinations: AUD + depression, cannabis + psychosis, opioids + PTSD. Principles: stabilize acute intoxication/withdrawal first, then address both concurrently. Prefer medications effective for both conditions (e.g., SSRI for depression + AUD). Avoid benzodiazepines in patients with SUD.\n\n50% of people with mental illness have a comorbid substance use disorder. Canadian guidelines (CCSA, CRISM) recommend integrated concurrent disorder programs. Many Canadian mental health acts allow involuntary admission for psychiatric emergency even when substance-related. Substance-induced mood/psychotic disorders typically resolve within 1 month of abstinence."
    difficulty: hard
    tags: [concurrent disorders, dual diagnosis, integrated treatment, psychiatry]
  - front: "What are the medical complications of chronic alcohol use?"
    back: "GI: fatty liver, alcoholic hepatitis, cirrhosis, pancreatitis, esophageal varices, Mallory-Weiss tears. Neuro: Wernicke-Korsakoff, peripheral neuropathy, cerebellar degeneration, alcohol-related dementia. Hematologic: macrocytic anemia (folate deficiency, direct toxicity), thrombocytopenia. Cardiac: alcoholic cardiomyopathy, holiday heart (AF). Other: increased cancer risk (oropharyngeal, esophageal, liver, breast, colorectal).\n\nCCSA Low-Risk Alcohol Drinking Guidelines (updated 2023): no amount of alcohol is completely safe. New guidance: 0 drinks/week = no risk, 1-2 = low risk, 3-6 = moderate risk, 7+ = increasingly high risk. This represents a significant shift from previous Canadian guidelines that suggested \"moderate\" drinking was safe."
    difficulty: medium
    tags: [alcohol complications, cirrhosis, medical consequences, psychiatry]
  - front: "What are the methadone vs buprenorphine/naloxone protocols for opioid use disorder?"
    back: "Methadone: full agonist, daily supervised dispensing initially, slow titration (fatal in overdose), long QT risk. Buprenorphine: partial agonist, can prescribe for take-home, safer in OD, must be in mild withdrawal to start (COWS >=12)\n\nCRISM guidelines. Buprenorphine preferred first-line (safety profile, less supervised dosing). Methadone for buprenorphine failures or high-tolerance patients. Injectable opioid agonist therapy (iOAT) for severe refractory OUD."
    difficulty: hard
    tags: [OUD, methadone, buprenorphine]
  - front: "What are the CCSA-recommended pharmacotherapy options for opioid use disorder?"
    back: "First-line: buprenorphine/naloxone (Suboxone) — can be prescribed in community settings, safer profile. Second-line: methadone — requires specialized prescriber authorization, daily supervised dosing initially. Third-line: slow-release oral morphine (Kadian). Injectable hydromorphone or diacetylmorphine for treatment-refractory patients. Naltrexone (oral or injectable) for highly motivated patients.\n\nCRISM Canadian guidelines recommend opioid agonist therapy (OAT) as first-line. Buprenorphine is preferred over methadone due to lower overdose risk, fewer drug interactions, and ability to prescribe in primary care (micro-dosing initiation gaining acceptance). Treatment retention reduces mortality by 50%. All patients on OAT should receive naloxone kits."
    difficulty: hard
    tags: [OUD, buprenorphine, methadone, CRISM, opioid-agonist-therapy]
  - front: "What is the CIWA-Ar scale and how does it guide alcohol withdrawal management?"
    back: "Clinical Institute Withdrawal Assessment for Alcohol (revised): 10-item scale scoring 0-67. Assesses nausea, tremor, anxiety, agitation, paroxysmal sweats, tactile/auditory/visual disturbances, headache, orientation. Score <10: mild (supportive care). 10-18: moderate (consider benzodiazepine). >18: severe (requires benzodiazepine, consider ICU). Score >15: risk of seizures/DTs.\n\nCIWA-Ar enables symptom-triggered benzodiazepine dosing, which reduces total benzodiazepine dose and treatment duration compared to fixed-schedule dosing. CCSA guidelines recommend diazepam or chlordiazepoxide for alcohol withdrawal. Seizures typically occur 12-48 hours after last drink; DTs at 48-96 hours. Mortality of untreated DTs is 15-20%."
    difficulty: medium
    tags: [CIWA, alcohol-withdrawal, benzodiazepine, symptom-triggered, delirium-tremens]
  - front: "What is the recommended approach to benzodiazepine tapering?"
    back: "Switch to long-acting agent (diazepam) if on short-acting. Reduce dose by 10-25% every 1-2 weeks initially, then slower (5-10% reductions) for the last 25%. Total taper duration: 6-12 weeks minimum (longer for long-term use). Manage withdrawal symptoms with non-pharmacologic strategies, consider adjuncts (gabapentin, hydroxyzine, melatonin for insomnia).\n\nCanadian Deprescribing Network provides a benzodiazepine deprescribing algorithm. Abrupt cessation risks withdrawal seizures, especially with short-acting agents. The equivalence table (diazepam 5 mg = lorazepam 1 mg = clonazepam 0.5 mg = alprazolam 0.5 mg) guides conversion. CBT for insomnia should replace benzodiazepine use long-term."
    difficulty: medium
    tags: [benzodiazepine-taper, deprescribing, withdrawal, diazepam-conversion, Canadian-Deprescribing]
  - front: "What are the diagnostic criteria and management of cannabis use disorder?"
    back: "DSM-5: >=2 of 11 criteria within 12 months (craving, tolerance, withdrawal, impaired control, social impairment, risky use, continued despite problems). Cannabis withdrawal: irritability, anxiety, insomnia, decreased appetite, depressed mood (onset 1-2 days, peaks at 1 week). Management: CBT + motivational enhancement therapy. No approved pharmacotherapy.\n\nCannabis use disorder affects ~9% of users (17% of those starting in adolescence). Since legalization in Canada (2018), ED visits for cannabis-related presentations have increased. Cannabis hyperemesis syndrome (cyclic vomiting, hot shower relief) is increasingly recognized. CCSA recommends Canada's Lower-Risk Cannabis Use Guidelines for harm reduction."
    difficulty: medium
    tags: [cannabis-use-disorder, withdrawal, CBT, legalization, CCSA]
  - front: "What should be included in naloxone kit education and who should receive one?"
    back: "Who: all patients on opioids (prescribed or non-prescribed), their family/friends, people who use drugs, first responders. Education: recognize overdose signs (unresponsive, slow/absent breathing, pinpoint pupils, cyanosis), call 911, administer naloxone (IM 0.4 mg or intranasal 4 mg), rescue breathing, repeat naloxone q2-3 min if no response, recovery position.\n\nGood Samaritan Drug Overdose Act (Canadian federal law) protects anyone calling 911 for an overdose from simple possession charges. Naloxone kits are available free at most Canadian pharmacies without prescription. CRISM recommends naloxone distribution as part of comprehensive OUD management. Naloxone duration is shorter than most opioids — monitor for re-sedation."
    difficulty: easy
    tags: [naloxone, overdose-prevention, Good-Samaritan-Act, harm-reduction, CRISM]
  - front: "What are the differences between methadone and buprenorphine/naloxone for OUD treatment?"
    back: "Methadone: full mu-agonist, higher overdose risk, daily witnessed dosing initially (carries progressing to bi-weekly/monthly), QTc prolongation, more drug interactions, requires specialized authorization. Buprenorphine/naloxone: partial agonist (ceiling effect = safer), can prescribe from office, home dosing sooner, precipitated withdrawal if started too early, less sedating.\n\nCRISM guidelines recommend buprenorphine as first-line over methadone. Buprenorphine micro-dosing (Bernese method) allows initiation without full withdrawal. Methadone is preferred when buprenorphine is insufficient (severe OUD, high tolerance). Both reduce mortality, criminal activity, and HIV transmission. Pregnancy: methadone or buprenorphine (without naloxone) monotherapy."
    difficulty: hard
    tags: [methadone-vs-buprenorphine, OAT, partial-agonist, CRISM, comparison]
  - front: "What pharmacotherapy options exist for alcohol use disorder?"
    back: "First-line: naltrexone 50 mg daily (or monthly injectable 380 mg) — reduces heavy drinking days. Acamprosate 666 mg TID — supports abstinence maintenance. Second-line: topiramate, gabapentin. Disulfiram (Antabuse) — aversion therapy, limited evidence, requires high motivation and supervision. Nalmefene (as-needed) available in some jurisdictions.\n\nCCSA and CANMAT recommend naltrexone or acamprosate as first-line. Naltrexone is contraindicated in patients on opioids. Acamprosate is safe in hepatic impairment (renal excretion) — useful for patients with liver disease. Pharmacotherapy should be combined with psychosocial interventions (motivational interviewing, CBT, AA/mutual aid)."
    difficulty: medium
    tags: [alcohol-use-disorder, naltrexone, acamprosate, pharmacotherapy, CCSA]
  - front: "What is stimulant use disorder management approach?"
    back: "No approved pharmacotherapy for cocaine or methamphetamine use disorder. Treatment is psychosocial: contingency management (most effective for stimulant use), CBT, community reinforcement approach, motivational interviewing. Manage psychiatric comorbidities (depression, psychosis). Harm reduction: safer supply programs in some Canadian cities.\n\nStimulant-related deaths are rising in Canada alongside the opioid crisis. No medication has shown consistent benefit in RCTs for stimulant use disorder, though trials of lisdexamfetamine, topiramate, and mirtazapine are ongoing. Contingency management provides tangible rewards for negative urine screens. Psychosis management may require short-term antipsychotics."
    difficulty: medium
    tags: [stimulant-use-disorder, contingency-management, no-pharmacotherapy, psychosocial, harm-reduction]
  - front: "What is the Canadian tobacco cessation pharmacotherapy approach?"
    back: "First-line: varenicline (Champix) — most effective single agent (OR 2.9 for abstinence), NRT (patch + short-acting form = combination NRT), bupropion. Combination NRT is as effective as varenicline. Start varenicline 1-2 weeks before quit date, 12-week course (can extend to 24 weeks). All should include counselling.\n\nCAN-ADAPTT Canadian smoking cessation guidelines recommend pharmacotherapy for all smokers ready to quit. Varenicline does NOT increase neuropsychiatric events per EAGLES trial. NRT is safe in cardiovascular disease. E-cigarettes/vaping are not recommended as cessation aids by Canadian guidelines due to uncertain long-term safety and youth uptake concerns."
    difficulty: medium
    tags: [smoking-cessation, varenicline, NRT, CAN-ADAPTT, bupropion]
  - front: "What are the key features of fetal alcohol spectrum disorder (FASD)?"
    back: "Requires confirmed or suspected prenatal alcohol exposure. Features: facial dysmorphology (smooth philtrum, thin upper lip, short palpebral fissures), growth deficiency, CNS dysfunction (microcephaly, executive function deficits, ADHD-like symptoms, learning disabilities, poor adaptive functioning). Canadian diagnostic guidelines use a multidisciplinary approach.\n\nCanada has the highest rate of FASD in the developed world. The 2015 Canadian diagnostic guidelines use a standardized multidisciplinary assessment. FASD is a leading preventable cause of intellectual disability. No safe amount of alcohol in pregnancy has been established. Canadian guidelines recommend universal screening for alcohol use in prenatal care."
    difficulty: medium
    tags: [FASD, fetal-alcohol, prenatal-exposure, facial-features, Canadian-guidelines]
  - front: "Buprenorphine is used for opioid use disorder but has a 'ceiling effect' for analgesia and respiratory depression. What pharmacodynamic property explains this?"
    back: "Buprenorphine is a partial agonist at the mu-opioid receptor. Partial agonists can only elicit a submaximal effect regardless of concentration — this ceiling effect limits both therapeutic and toxic effects compared to full agonists like morphine.\n\nPartial agonists have reduced intrinsic efficacy compared to full agonists; they cannot produce the maximal receptor response even at saturating concentrations. This property makes buprenorphine safer than full agonists in opioid use disorder treatment."
    difficulty: medium
    tags: [pharmacodynamics, partial agonist, buprenorphine, opioid, ceiling effect]
  - front: "What are the recommended maximum daily opioid doses for patients with chronic non-cancer pain according to Canadian opioid guidelines?"
    back: "Restrict to <90 MME/day (morphine milligram equivalents); ideally <50 MME/day, especially at starting dose. Patients already on ≥90 MME/day should be encouraged to taper collaboratively to the lowest effective dose.\n\nCanadian opioid guidelines (CMAJ 2017; Busse et al.) emphasize optimizing non-opioid therapy first, restricting doses to minimize harm, and using slow collaborative tapers. Evidence shows that opioid tapering in chronic pain patients improves pain in ~80% of cases."
    difficulty: medium
    tags: [opioids, chronic pain, MME, Canadian guidelines, opioid tapering, CMAJ]
  - front: "What approach is recommended for patients with chronic non-cancer pain who have serious challenges tapering opioids?"
    back: "A formal multidisciplinary pain management program is recommended for patients who cannot taper on their own.\n\nCanadian national opioid guidelines emphasize collaborative, slow tapering approaches. When standard tapering fails, multidisciplinary programs that address biopsychosocial factors improve outcomes more effectively than dose adjustments alone."
    difficulty: easy
    tags: [opioids, chronic pain, opioid tapering, multidisciplinary, Canadian guidelines]
