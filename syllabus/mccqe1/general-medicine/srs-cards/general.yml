    back: "1200 mg/day\n\nAdults over 70 without risk factors require 1200 mg calcium daily, while those over 70 with risk factors need 1500 mg."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
