# Pediatric Asthma & Respiratory (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "A 6-year-old has recurring episodes of wheezing, cough, and shortness of breath that improve with salbutamol. Spirometry is not possible. How is pediatric asthma diagnosed?"
    back: "Diagnosis based on: characteristic episodic symptoms + response to bronchodilator (≥12% FEV1 improvement) or positive bronchoprovocation test; trial of ICS can confirm diagnosis in children <5\n\nCTS pediatric asthma guidelines: young children cannot reliably perform spirometry. For preschoolers (<5): clinical diagnosis based on recurrent wheeze, response to bronchodilator, exclusion of alternative diagnoses. ICS trial for 3 months; if response confirms asthma."
    difficulty: hard
    tags: [pediatric asthma, diagnosis, bronchodilator response, ICS trial, pediatrics]
  - front: "What is the first-line controller therapy for persistent asthma in children?"
    back: "Low-dose inhaled corticosteroids (ICS) — e.g., fluticasone 88-176 μg/day or budesonide 200-400 μg/day; add LABA for step-up if needed (age ≥5 years)\n\nCTS and GINA pediatric guidelines: ICS is the cornerstone of asthma control in children. Montelukast (LTRA) is an alternative but less effective. LABAs should always be used with ICS in children — never as monotherapy. Long-term ICS at recommended doses does not significantly affect growth."
    difficulty: easy
    tags: [ICS, inhaled corticosteroids, pediatric asthma treatment, montelukast, pediatrics]
  - front: "What are the management steps for a moderate acute asthma exacerbation in a 10-year-old in the ED?"
    back: "SpO2 >94%, speaking in phrases: salbutamol 4-8 puffs via spacer q20min x3, ipratropium bromide 4-8 puffs q20min x3 (first hour), oral prednisone 1-2 mg/kg/day (max 40 mg) x3-5 days, supplemental O2\n\nCPS/CTS guidelines: salbutamol + ipratropium combination in first hour reduces hospitalization. Oral corticosteroids equivalent to IV. Magnesium sulfate IV 40 mg/kg (max 2g) for severe exacerbations. Reassess after initial bronchodilators with oxygen saturation and clinical score (PRAM)."
    difficulty: hard
    tags: [acute asthma exacerbation, salbutamol, ipratropium, prednisone, pediatrics]
  - front: "What is the PRAM (Pediatric Respiratory Assessment Measure) score?"
    back: "PRAM: 0-12 scale assessing ScaleneO2 saturation, suprasternal retraction, scalene muscle activity, air entry, and wheeze; 0-3: mild, 4-7: moderate, 8-12: severe asthma exacerbation\n\nCPS validated the PRAM score for Canadian pediatric ED management of asthma. Higher PRAM scores correlate with increased risk of hospitalization. Serial PRAM scores guide treatment decisions and discharge readiness. PRAM reliably reflects clinical response to bronchodilator therapy."
    difficulty: easy
    tags: [PRAM score, asthma severity, pediatric asthma, ED assessment, pediatrics]
  - front: "How is asthma control assessed in children using GINA criteria?"
    back: "Well-controlled: daytime symptoms ≤2x/week, no night symptoms, SABA use ≤2x/week, no activity limitation; Partially controlled: 1-2 of these not met; Uncontrolled: ≥3 not met\n\nCTS Canadian Pediatric Asthma Consensus Guidelines: assessment at every visit using patient/caregiver report of daytime symptoms, nighttime symptoms, activity limitation, and rescue inhaler use. Spirometry and FeNO add objective assessment. Step up if uncontrolled x4 weeks."
    difficulty: easy
    tags: [asthma control, GINA criteria, pediatric asthma, step-up therapy, pediatrics]
  - front: "What trigger avoidance measures are recommended for asthmatic children?"
    back: "Environmental tobacco smoke (most important — parental smoking), dust mites (mattress/pillow covers), pet dander (remove pet if sensitized), mold remediation, exercise warm-up, avoid cold air, treat allergic rhinitis\n\nCTS guidelines emphasize environmental control as part of asthma management. Second-hand smoke exposure doubles asthma exacerbation risk in children. Specific allergen immunotherapy (allergy shots) considered for allergic asthma sensitized to a single allergen."
    difficulty: easy
    tags: [asthma triggers, tobacco smoke, allergen avoidance, environmental control, pediatrics]
  - front: "What spacer/inhaler device should be used in children by age?"
    back: "<4 years: MDI + spacer with face mask; 4-6 years: MDI + spacer with mouthpiece; >6 years: MDI + spacer (preferred) or DPI; nebulizers only for severe exacerbations or if spacer unavailable\n\nCTS guidelines: spacers are as effective as nebulizers for asthma exacerbations in children when used correctly. All children should have an MDI + spacer for home use. Regular cleaning of spacer. Technique must be reviewed at every visit."
    difficulty: easy
    tags: [spacer, inhaler technique, pediatric asthma, MDI, pediatrics]
  - front: "What is the role of montelukast in pediatric asthma?"
    back: "Montelukast (LTRA): second-line controller for mild persistent asthma; also useful for exercise-induced bronchoconstriction and allergic rhinitis comorbidity; less effective than ICS; Health Canada warns about neuropsychiatric side effects\n\nCTS guidelines: LTRAs are alternatives to low-dose ICS for mild persistent asthma. Neuropsychiatric side effects (nightmares, behavioral changes, depression, suicidal ideation) require counseling and prompt reporting. Step-down to montelukast after ICS achieves control not recommended."
    difficulty: medium
    tags: [montelukast, LTRA, pediatric asthma, neuropsychiatric effects, pediatrics]
  - front: "What is bronchiolitis and how is it distinguished from asthma in infants?"
    back: "Bronchiolitis: RSV-mediated viral lower respiratory tract infection in infants <24 months; first episode of wheeze + respiratory distress — NOT treated as asthma; supportive care only (O2, fluids)\n\nCPS bronchiolitis guidelines: bronchodilators, corticosteroids, and antibiotics are NOT effective and should NOT be used for bronchiolitis. Diagnosis is clinical. Hospitalization for O2 requirement <90% or significant work of breathing. RSV monoclonal antibody (nirsevimab) now recommended for infants <6 months."
    difficulty: hard
    tags: [bronchiolitis, RSV, wheezing infant, asthma vs bronchiolitis, pediatrics]
  - front: "What are the indications for referral to pediatric respirologist for asthma?"
    back: "Uncontrolled asthma despite step 3 therapy (medium ICS + LABA), frequent exacerbations (≥2 steroid courses/year), ICU admission, uncertain diagnosis, suspicion of another etiology (GERD, laryngomalacia, foreign body, CF)\n\nCTS guidelines recommend specialist referral for difficult asthma management. Comprehensive evaluation at a specialist level includes fractional exhaled nitric oxide (FeNO) measurement, bronchoprovocation testing, allergy testing, and investigation of asthma mimics."
    difficulty: easy
    tags: [asthma referral, pediatric specialist, difficult asthma, pediatrics]
  - front: "What are the diagnostic criteria for asthma in children <6 years vs >=6 years?"
    back: "<6 years: clinical diagnosis based on pattern of symptoms (recurrent wheeze, cough, dyspnea triggered by viral infections, exercise, allergens), response to bronchodilators, and exclusion of alternatives. >=6 years: confirmed by spirometry showing reversible airflow obstruction (FEV1 increase >=12% post-bronchodilator or positive methacholine challenge).\n\nCPS and Canadian Thoracic Society guidelines note that formal diagnosis with spirometry is difficult in children <6 years. The Asthma Predictive Index (API) helps predict persistence: major criteria (parental asthma, eczema) or minor criteria (allergic rhinitis, wheezing apart from colds, eosinophilia >=4%)."
    difficulty: medium
    tags: [asthma diagnosis, pediatric, spirometry, pediatrics]
  - front: "What is the stepwise approach to asthma management in children?"
    back: "Step 1: SABA as needed. Step 2: low-dose ICS (e.g., fluticasone 100mcg/day). Step 3: medium-dose ICS or low-dose ICS + LABA (>=6yr) or LTRA. Step 4: medium-dose ICS + LABA. Step 5: high-dose ICS + LABA, consider biologic (omalizumab). Before stepping up: verify technique, adherence, trigger avoidance, and diagnosis.\n\nCTS Pediatric Asthma guidelines recommend ICS as cornerstone of controller therapy. LABA monotherapy is contraindicated in children. Montelukast (LTRA) is second-line to ICS. Step-down therapy attempted after 3 months of good control. Action plans should be provided to all families."
    difficulty: hard
    tags: [asthma stepwise, ICS, controller therapy, pediatrics]
  - front: "How is acute pediatric asthma exacerbation classified and managed?"
    back: "Mild: talks in sentences, SpO2 >94%. Moderate: talks in phrases, SpO2 90-94%. Severe: talks in words, SpO2 <90%, accessory muscles, HR >200 (<3yr) or >180 (4-5yr). Management: salbutamol MDI + spacer (or nebulized) q20min x 3, ipratropium for moderate-severe, systemic corticosteroids (prednisone/prednisolone 1-2mg/kg, max 50mg x 3-5 days). Add IV MgSO4 50mg/kg for severe refractory.\n\nCPS and CTS guidelines emphasize MDI + spacer over nebulization for most children (equivalent efficacy, better drug delivery). Oral steroids given early reduce hospitalization (NNT 8). Chest X-ray is NOT routine-only if suspecting complication. Discharge with action plan and ICS if not already prescribed."
    difficulty: hard
    tags: [asthma exacerbation, acute management, salbutamol, pediatrics]
  - front: "What are the ICS dose equivalences in children and the side effects to monitor?"
    back: "Low dose: fluticasone 100-200mcg/day, budesonide 200-400mcg/day, beclomethasone 200-400mcg/day. Medium: fluticasone 200-500mcg, budesonide 400-800mcg. High: fluticasone >500mcg, budesonide >800mcg. Side effects: oral thrush (use spacer, rinse mouth), growth suppression (~1cm in first year, catch-up later), adrenal suppression at high doses.\n\nCTS guidelines recommend the lowest effective ICS dose. Growth monitoring is essential. ICS at low-moderate doses cause minimal growth effect (~0.5-1cm reduction in final adult height per CAMP trial). Benefits of asthma control far outweigh this risk. Always prescribe spacer with MDI."
    difficulty: medium
    tags: [ICS dosing, inhaled corticosteroids, side effects, pediatrics]
  - front: "What is the approach to exercise-induced bronchospasm (EIB) in children?"
    back: "Diagnosis: FEV1 drop >=10% post-exercise challenge. Prevention: SABA 15-20 minutes before exercise (most effective). Alternatives: daily LTRA, warm-up exercises. If EIB occurs despite pre-treatment SABA, indicates uncontrolled underlying asthma requiring controller therapy assessment.\n\nEIB affects 40-90% of children with asthma. CTS guidelines recommend that children with asthma should be encouraged to exercise. Persistent EIB despite pre-treatment SABA should prompt reassessment of overall asthma control and controller therapy optimization."
    difficulty: medium
    tags: [exercise-induced bronchospasm, EIB, SABA, pediatrics]
  - front: "What are the differential diagnoses for wheezing in infants and young children?"
    back: "Viral-induced wheeze (most common), bronchiolitis (RSV), asthma, foreign body aspiration (sudden onset, unilateral), tracheomalacia/bronchomalacia, cystic fibrosis, GERD, vascular ring, congenital heart disease, primary ciliary dyskinesia.\n\nNot all that wheezes is asthma. CPS guidelines emphasize that wheezing in infants <12 months is most commonly bronchiolitis (RSV). Foreign body aspiration should be suspected with sudden onset and unilateral wheeze. CXR (inspiratory/expiratory) and bronchoscopy for suspected foreign body."
    difficulty: medium
    tags: [wheezing differential, bronchiolitis, foreign body, pediatrics]
  - front: "What is the management of bronchiolitis?"
    back: "Supportive care only: nasal suctioning, supplemental O2 if SpO2 <90%, hydration (oral or IV). Hypertonic saline nebulization may be used in admitted patients. NOT recommended: bronchodilators, corticosteroids, antibiotics, chest physiotherapy. Admit if: age <3 months, significant respiratory distress, SpO2 <90%, dehydration, apnea history, prematurity.\n\nCPS bronchiolitis guidelines emphasize minimal intervention. Trial of bronchodilator is no longer routinely recommended. Palivizumab (RSV monoclonal antibody) for prophylaxis in high-risk infants (preterm <33 weeks, hemodynamically significant CHD, chronic lung disease) during RSV season."
    difficulty: medium
    tags: [bronchiolitis, RSV, supportive care, pediatrics]
  - front: "What are the indications for referral to a pediatric respirologist for asthma?"
    back: "Uncontrolled asthma despite medium-dose ICS + LABA, frequent severe exacerbations, diagnostic uncertainty, age <2 years with recurrent wheeze, suspected comorbid conditions (VCD, allergic bronchopulmonary aspergillosis), consideration of biologic therapy, life-threatening exacerbation.\n\nCanadian Thoracic Society recommends specialist referral when asthma is not controlled at Step 3 therapy. Biologic therapies (omalizumab for IgE-mediated, mepolizumab for eosinophilic) require specialist initiation. Most pediatric asthma can be managed in primary care with proper education."
    difficulty: medium
    tags: [asthma referral, specialist, uncontrolled asthma, pediatrics]
  - front: "What is an asthma action plan and what should it include?"
    back: "Written plan with zones: GREEN (well controlled)-continue maintenance therapy. YELLOW (worsening)-increase SABA frequency, double ICS dose or start prednisone 1mg/kg x 3-5 days. RED (emergency)-SABA q4h, start oral steroids, seek immediate medical attention if no improvement. Include triggers, medications with doses, and when to go to ED.\n\nCPS and CTS mandate written action plans for all pediatric asthma patients. Studies show action plans reduce ED visits by 70% and hospitalizations by 40%. Plans should be reviewed at every visit. School copies should include permission for self-administration of SABA."
    difficulty: medium
    tags: [asthma action plan, self-management, pediatrics]
  - front: "What are the risk factors for fatal asthma in children?"
    back: "Previous near-fatal exacerbation (intubation/ICU), frequent ED visits/hospitalizations, poor adherence to controller therapy, overuse of SABA (>=1 canister/month), food allergy (especially peanut), psychosocial factors (depression, family dysfunction), lack of written action plan, recent oral corticosteroid use.\n\nThese risk factors identify children needing intensive follow-up and asthma education. CTS recommends flagging high-risk patients in medical records. SABA overuse (dispensing >=3 canisters/year) is a marker of uncontrolled asthma and should trigger reassessment."
    difficulty: hard
    tags: [fatal asthma risk, SABA overuse, risk factors, pediatrics]
  - front: "Compare croup, epiglottitis, and bronchiolitis in terms of age, etiology, presentation, and management."
    back: "Croup: age 6mo–3yr, parainfluenza virus, barking cough + inspiratory stridor + hoarseness, steeple sign on X-ray; management: single dose dexamethasone (0.6 mg/kg) ± nebulized epinephrine if severe. Epiglottitis: age 2–7yr (rare now with Hib vaccine), H. influenzae type b (or other bacteria); toxic-appearing, drooling, tripod position, muffled voice, thumb sign on lateral neck X-ray; management: do NOT examine throat, secure airway in OR, IV antibiotics (ceftriaxone). Bronchiolitis: age <2yr (peak 2–6mo), RSV most common; wheezing, crackles, tachypnea, nasal flaring; management: supportive (O₂, suctioning, hydration), NO routine bronchodilators or steroids.\n\nThe CPS recommends dexamethasone for all children with croup regardless of severity, as it reduces return visits and hospitalizations. Epiglottitis has become rare since universal Hib vaccination in Canada. For bronchiolitis, the CPS 2014 practice point emphasizes supportive care only — evidence does not support salbutamol, epinephrine, or corticosteroids for routine bronchiolitis."
    difficulty: medium
    tags: [croup, epiglottitis, bronchiolitis, RSV, dexamethasone, CPS]
  - front: "A 2-year-old presents with a barking cough and stridor at rest. He is not in respiratory distress and is well-appearing. What is the severity classification and management?"
    back: "Moderate croup (stridor at rest without significant distress). Management: single dose oral dexamethasone 0.6 mg/kg (max 10 mg). Observe for 2–4 hours. If stridor worsens or respiratory distress develops, administer nebulized epinephrine (0.5 mL/kg of 1:1000, max 5 mL) and observe for at least 2 hours post-epinephrine for rebound.\n\nThe CPS croup scoring uses stridor, retractions, air entry, and level of consciousness. Mild croup (stridor only with agitation) still warrants dexamethasone. Budesonide nebulization (2 mg) is an alternative if the child cannot take oral medication. Most children can be discharged after dexamethasone with return precautions."
    difficulty: easy
    tags: [croup, dexamethasone, nebulized-epinephrine, stridor, CPS]
  - front: "What is the current evidence-based management of bronchiolitis in infants, and which commonly used treatments are NOT recommended?"
    back: "Evidence-based management: supplemental oxygen if SpO₂ <90% (CPS threshold), nasal suctioning, adequate hydration (NG or IV if needed), and monitoring. NOT recommended: salbutamol/albuterol, inhaled epinephrine (routine use), systemic corticosteroids, antibiotics (unless secondary bacterial infection), chest physiotherapy, and hypertonic saline (insufficient evidence for emergency department use).\n\nThe CPS and Canadian Bronchiolitis Epinephrine Steroid Trial (CanBEST) demonstrated that combined epinephrine + dexamethasone reduced admissions, but this has not been adopted as standard practice. Palivizumab (Synagis) prophylaxis is recommended for high-risk infants (premature, hemodynamically significant CHD, chronic lung disease) during RSV season."
    difficulty: medium
    tags: [bronchiolitis, RSV, supportive-care, palivizumab, CPS, CanBEST]
  - front: "A child with croup develops severe respiratory distress with decreased air entry, cyanosis, and altered consciousness. What is the immediate management?"
    back: "Severe/impending respiratory failure from croup. Immediate management: 1) Nebulized epinephrine (0.5 mL/kg of 1:1000, max 5 mL), 2) Dexamethasone 0.6 mg/kg IM/IV if unable to take orally, 3) Minimize agitation (keep child with caregiver), 4) High-flow oxygen, 5) Prepare for possible intubation (use ETT 0.5–1 size smaller than predicted). Call anesthesia/ENT for difficult airway management.\n\nSevere croup with impending respiratory failure is a medical emergency affecting <1% of croup cases. The CPS emphasizes that nebulized epinephrine provides temporary relief (onset 10 minutes, lasts ~2 hours) and rebound can occur. Heliox (helium-oxygen mixture) may be used as a bridge in tertiary centres. These children require ICU admission."
    difficulty: hard
    tags: [severe-croup, respiratory-failure, nebulized-epinephrine, intubation, CPS]
  - front: "What are the components of a pediatric asthma action plan and how are zones defined?"
    back: "Green zone (well-controlled): maintenance therapy, no rescue inhaler needed. Yellow zone (worsening): increase SABA use, may double ICS or add oral prednisone. Red zone (emergency): SABA q20min x3, oral prednisone, seek emergency care immediately. Action plan must include triggers, medications, and when to call 911.\n\nCanadian Thoracic Society and Canadian Paediatric Society recommend written asthma action plans for all children with asthma. Studies show action plans reduce ED visits by 70%. Plans should be reviewed at every visit and updated with changes in therapy."
    difficulty: medium
    tags: [asthma-action-plan, pediatric, zones, self-management, CTS]
  - front: "What inhaler device is appropriate for each pediatric age group?"
    back: "Age <4: pMDI + spacer with mask. Age 4-6: pMDI + spacer with mouthpiece. Age >6: pMDI + spacer (preferred), or DPI if adequate inspiratory flow. Nebulizers reserved for acute exacerbations or children unable to use spacer devices.\n\nCanadian Paediatric Society emphasizes that pMDI + spacer is as effective as nebulizer for bronchodilator delivery in children. Incorrect technique is the most common cause of treatment failure. Technique should be demonstrated and reassessed at every visit."
    difficulty: easy
    tags: [inhaler-technique, pMDI, spacer, pediatric, drug-delivery]
  - front: "How is exercise-induced bronchoconstriction (EIB) diagnosed and managed in children?"
    back: "Diagnosis: exercise challenge test showing >=10% fall in FEV1 post-exercise. Management: SABA 15 minutes pre-exercise (first-line), daily low-dose ICS if frequent symptoms, LTRA as alternative. Warm-up exercises reduce severity. Do not restrict physical activity.\n\nEIB affects up to 90% of children with asthma and 10-15% without asthma. Canadian guidelines emphasize that physical activity should be encouraged, not restricted. Cold dry air worsens EIB. Swimming is generally better tolerated due to warm humid air."
    difficulty: medium
    tags: [exercise-induced, bronchoconstriction, pediatric, SABA, prevention]
  - front: "What are the preschool wheeze phenotypes and their clinical significance?"
    back: "Episodic viral wheeze: only wheezes with viral URTIs, symptom-free between episodes, good prognosis. Multi-trigger wheeze: wheezes with viruses AND other triggers (exercise, allergens, cold air), more likely to persist as asthma. Atopic status, eczema, and family history help predict persistence.\n\nThe modified Asthma Predictive Index (API) helps identify preschoolers likely to develop persistent asthma: recurrent wheezing + 1 major (parental asthma, eczema) or 2 minor criteria (allergic rhinitis, wheezing apart from colds, eosinophilia >=4%). Canadian guidelines recommend ICS trial for multi-trigger wheeze."
    difficulty: medium
    tags: [preschool-wheeze, phenotypes, API, viral-wheeze, prediction]
  - front: "A 3-year-old has recurrent wheeze episodes only with viral infections and is symptom-free between episodes. Parents ask about daily controller therapy. What do you recommend?"
    back: "For episodic viral wheeze with infrequent episodes, PRN SABA with spacer and mask is sufficient. If episodes are frequent (>= once monthly) or severe (requiring oral steroids or hospitalization), consider intermittent high-dose ICS at onset of viral symptoms or daily low-dose ICS.\n\nCanadian Paediatric Society recommends against routine daily ICS for infrequent episodic viral wheeze in preschoolers, as most will outgrow symptoms. The INFANT study supports step-up approaches. Intermittent ICS at symptom onset is an evidence-based alternative to daily therapy for this phenotype."
    difficulty: medium
    tags: [episodic-viral-wheeze, ICS, preschool, step-therapy, management]
  - front: "What is the stepwise approach to pediatric asthma management per Canadian guidelines?"
    back: "Step 1: PRN SABA. Step 2: low-dose ICS daily (or LTRA if ICS refused). Step 3: medium-dose ICS or low-dose ICS + LABA (age >=6) or LTRA. Step 4: medium-dose ICS + LABA. Step 5: high-dose ICS + LABA, refer to specialist, consider biologics (omalizumab age >=6).\n\nCTS guidelines mirror GINA stepwise approach adapted for Canadian practice. Control assessment uses the Childhood Asthma Control Test (C-ACT). Step down after 3 months of good control. ICS-formoterol as reliever therapy (SMART approach) is gaining acceptance in children >=12."
    difficulty: medium
    tags: [stepwise-therapy, ICS, LABA, pediatric-asthma, CTS]
  - front: "What features in a wheezing child should prompt investigation for an alternative diagnosis other than asthma?"
    back: "Neonatal onset, failure to thrive, digital clubbing, persistent wet/productive cough, focal lung findings, stridor, dysphagia, cardiac murmur, lack of response to bronchodilators, and fixed airflow obstruction on spirometry.\n\nDifferential diagnosis of recurrent wheeze includes foreign body aspiration, cystic fibrosis, tracheomalacia, vascular ring, primary ciliary dyskinesia, and congenital heart disease. Canadian Paediatric Society recommends chest X-ray and spirometry (when age-appropriate) before confirming asthma diagnosis."
    difficulty: medium
    tags: [wheeze-differential, red-flags, pediatric, cystic-fibrosis, foreign-body]
  - front: "How is acute severe asthma exacerbation managed in a pediatric emergency department?"
    back: "Salbutamol pMDI+spacer (or nebulizer) q20min x3, ipratropium bromide x3 doses in first hour, systemic corticosteroids (oral prednisone/prednisolone 1-2 mg/kg, max 50 mg) within first hour, oxygen to maintain SpO2 >=94%. If severe/life-threatening: continuous nebulized salbutamol, IV magnesium sulfate 50 mg/kg.\n\nCanadian Paediatric Society guidelines emphasize early systemic steroids (within 1 hour) and ipratropium in the first hour for moderate-severe exacerbations. IV magnesium sulfate is reserved for impending respiratory failure. Aminophylline is rarely used. Reassess frequently using PRAM score."
    difficulty: hard
    tags: [acute-asthma, pediatric-emergency, salbutamol, steroids, magnesium]
  - front: "What is the PRAM score and how is it used in pediatric asthma?"
    back: "Pediatric Respiratory Assessment Measure (PRAM): scores 0-12 based on suprasternal retractions, scalene muscle contraction, air entry, wheezing, and oxygen saturation. Mild (0-3), moderate (4-7), severe (8-12). Used to assess severity and guide treatment in the ED.\n\nPRAM is validated for ages 2-17 and widely used in Canadian pediatric EDs. It provides objective, reproducible severity assessment and tracks response to treatment. A validated Canadian tool, it has been incorporated into national asthma guidelines and clinical pathways."
    difficulty: medium
    tags: [PRAM, severity-assessment, pediatric, ED, scoring]
  - front: "When should spirometry be performed in a child suspected of having asthma?"
    back: "Spirometry should be attempted in all children age >=6 with suspected asthma. Findings: FEV1/FVC <0.90 suggests obstruction in children, bronchodilator reversibility (>=12% improvement in FEV1 post-SABA). If spirometry normal but suspicion high, methacholine challenge or exercise challenge testing.\n\nCTS guidelines emphasize objective lung function testing to confirm asthma diagnosis when possible. In children <6, diagnosis relies on clinical features and therapeutic trial. Serial peak flow monitoring at home can supplement spirometry. Normal spirometry does not exclude asthma."
    difficulty: medium
    tags: [spirometry, pediatric, diagnosis, FEV1, bronchodilator-reversibility]
  - front: "What is the management of moderate-to-severe croup?"
    back: "Dexamethasone x 1 dose (for all severity levels). For moderate-to-severe croup: add nebulized or MDI epinephrine. Consider bacterial tracheitis or epiglottitis if unresponsive to croup therapy. Humidified O2 has no evidence for efficacy.\n\nDexamethasone reduces subglottic edema via anti-inflammatory effects. Epinephrine provides rapid but transient mucosal vasoconstriction. The Westley croup score is used to grade severity (mild, moderate, severe). Failure to respond to therapy should prompt reassessment of the diagnosis."
    difficulty: medium
    tags: [croup, dexamethasone, epinephrine, pediatric emergency, stridor]
