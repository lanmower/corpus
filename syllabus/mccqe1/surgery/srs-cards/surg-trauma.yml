    back: "FRAX (WHO Fracture Risk Assessment Tool) and CAROC (Canadian Association of Radiologists and Osteoporosis Canada)\n\nBoth tools are available online at https://osteoporosis.ca and have been validated in the Canadian population."
    difficulty: easy
    tags: [osteoporosis, fracture-risk, assessment-tools, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the indications for pharmacotherapy in osteoporosis per 2023 Canadian guidelines?"
    back: "10-year fracture risk >20% OR T-score <-2.5 and age >70 years\n\nThese thresholds indicate high enough fracture risk to warrant pharmacologic intervention."
    difficulty: medium
    tags: [osteoporosis, treatment, pharmacotherapy, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the key components of clinical assessment for osteoporosis on history?"
    back: "Prior falls, fragility fractures, parental hip fractures, gait or balance issues, glucocorticoid use, smoking, alcohol intake (>3 units/d), rheumatoid arthritis\n\nThese history elements help identify patients at increased fracture risk."
    difficulty: medium
    tags: [osteoporosis, history, risk-assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the occiput-to-wall distance that suggests kyphosis/vertebral fracture?"
    back: "Greater than 5 cm\n\nIncreased occiput-to-wall distance indicates forward flexion of the spine, often from vertebral compression fractures."
    difficulty: medium
    tags: [osteoporosis, vertebral-fracture, physical-exam, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What height loss suggests possible vertebral fracture?"
    back: "Prospective height loss >2 cm or historical loss >6 cm\n\nSignificant height loss is a key indicator of asymptomatic vertebral compression fractures."
    difficulty: easy
    tags: [osteoporosis, vertebral-fracture, screening, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the FRAX and CAROC tools used for?"
    back: "10-year fracture risk assessment\n\nThese validated tools calculate the probability of major osteoporotic fracture over 10 years to guide treatment decisions."
    difficulty: easy
    tags: [osteoporosis, FRAX, CAROC, risk-assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the reassessment interval for osteoporosis if 10-year fracture risk is 10-15%?"
    back: "Reassess in 5 years\n\nIntermediate risk patients can be followed with less frequent BMD testing while implementing preventive measures."
    difficulty: medium
    tags: [osteoporosis, follow-up, management, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the clinical presentations of osteoporosis?"
    back: "Asymptomatic for many years; fragility or osteoporotic fractures\n\nOsteoporosis is often silent until a fracture occurs, making prevention and screening critical."
    difficulty: easy
    tags: [osteoporosis, clinical-presentation, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is FRAX and what does it assess?"
    back: "WHO Fracture Risk Assessment Tool - calculates 10-year probability of hip fracture and major osteoporotic fracture\n\nFRAX is a validated tool that incorporates clinical risk factors with or without BMD to estimate 10-year fracture risk."
    difficulty: easy
    tags: [osteoporosis, FRAX, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What physical exam findings suggest osteoporosis or vertebral fracture?"
    back: "Prospective height loss >2 cm or historical loss >6 cm, rib-to-pelvis distance <2 finger-breadths, occiput-to-wall distance >5 cm\n\nThese findings are clinical indicators of vertebral compression fractures and should prompt further investigation for osteoporosis."
    difficulty: medium
    tags: [osteoporosis, physical-exam, vertebral-fracture, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the definition of an osteoporotic fracture?"
    back: "Fractures occurring after age 40 in the setting of low trauma; hands, feet and craniofacial bones are not considered osteoporotic\n\nOsteoporotic fractures result from low-energy trauma that would not cause fracture in healthy bone."
    difficulty: easy
    tags: [osteoporosis, fracture, definition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is CAROC?"
    back: "Canadian Association of Radiologists and Osteoporosis Canada tool for 10-year fracture risk assessment\n\nCAROC is a Canadian-specific alternative to FRAX for assessing fracture risk."
    difficulty: easy
    tags: [osteoporosis, CAROC, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "When should BMD testing be performed according to Canadian guidelines?"
    back: "Calculate 10-year fracture risk with BMD using FRAX (preferred) or CAROC tool\n\nBMD testing is used in conjunction with clinical risk factors to determine fracture probability."
    difficulty: medium
    tags: [osteoporosis, BMD, diagnosis, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the WHO case definition of osteoporosis?"
    back: "A age-related disease characterized by decreased bone mass and increased susceptibility to fractures\n\nOsteoporosis is defined by the WHO as a bone disease characterized by reduced bone mineral density and microarchitectural deterioration, leading to increased bone fragility and fracture risk."
    difficulty: easy
    tags: [osteoporosis, definition, bone-health, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the signs of possible vertebral fracture on physical exam?"
    back: "Prospective height loss >2 cm or historical 6 cm, rib-to-pelvis distance <2 finger-breadths, occiput-to-wall distance >5 cm\n\nThese clinical findings suggest existing vertebral fractures even without known trauma and should prompt lateral spine imaging."
    difficulty: medium
    tags: [osteoporosis, vertebral-fracture, physical-exam, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the CAROC tool used for in osteoporosis management?"
    back: "Canadian Association of Radiologists and Osteoporosis Canada 10-year fracture risk assessment tool\n\nCAROC is a Canadian alternative to FRAX that integrates BMD with clinical risk factors to categorize patients as low, moderate, or high risk."
    difficulty: easy
    tags: [osteoporosis, CAROC, fracture-risk, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended reassessment interval for osteoporosis if 10-year fracture risk is 10-15%?"
    back: "Reassess in 5 years\n\nCanadian guidelines stratify reassessment timing by fracture risk: <10% = 5-10 years, 10-15% = 5 years, >15% = 3 years."
    difficulty: medium
    tags: [osteoporosis, follow-up, guidelines, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is considered a fragility/osteoporotic fracture?"
    back: "Fractures occurring after age 40 in the setting of low trauma (not hands, feet, or craniofacial bones)\n\nFragility fractures result from forces that would not fracture normal bone and are characteristic of osteoporosis. Hand, foot, and facial bones are excluded."
    difficulty: medium
    tags: [osteoporosis, fragility-fracture, diagnosis, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "List 6 categories of secondary headache causes"
    back: "Drug-related, infectious, vascular, endocrine, neoplastic, and trauma\n\nSecondary headaches have identifiable causes including medication effects, CNS infections, vascular events, hormonal disorders, tumors, and head injury."
    difficulty: medium
    tags: [headache, differential, neurology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the validated tools for calculating 10-year fracture risk in Canada?"
    back: "FRAX (WHO Fracture Risk Assessment Tool) and CAROC (Canadian Association of Radiologists and Osteoporosis Canada)\n\nBoth tools are validated in the Canadian population and available online at osteoporosis.ca."
    difficulty: easy
    tags: [osteoporosis, fracture-risk, assessment-tools, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "When is pharmacotherapy for osteoporosis recommended?"
    back: "10-year fracture risk >20% OR T-score <-2.5 and age >70 years\n\nThese thresholds from Canadian guidelines indicate high enough fracture risk to warrant pharmacologic intervention."
    difficulty: medium
    tags: [osteoporosis, treatment, pharmacotherapy, BMD, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the tools used for 10-year fracture risk assessment in Canada?"
    back: "FRAX (WHO Fracture Risk Assessment Tool) and CAROC (Canadian Association of Radiologists and Osteoporosis Canada)\n\nBoth tools integrate clinical risk factors with or without BMD to estimate 10-year probability of major osteoporotic fracture."
    difficulty: easy
    tags: [osteoporosis, FRAX, CAROC, risk-assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the reassessment timeline for osteoporosis patients NOT on pharmacotherapy?"
    back: "10-year fracture risk <10%: reassess in 5-10 years; 10-year fracture risk 10-15%: reassess in 5 years; 10-year fracture risk >15%: reassess in 3 years\n\nHigher risk patients require more frequent monitoring to initiate therapy when thresholds are met."
    difficulty: medium
    tags: [osteoporosis, follow-up, risk-assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "How often should BMD be reassessed if 10-year fracture risk is <10%?"
    back: "Every 5-10 years\n\nLow-risk patients require less frequent monitoring."
    difficulty: easy
    tags: [osteoporosis, BMD, follow-up, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "How often should BMD be reassessed if 10-year fracture risk is ≥15%?"
    back: "Every 3 years\n\nHigher-risk patients require closer monitoring."
    difficulty: easy
    tags: [osteoporosis, BMD, follow-up, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What fractures are NOT considered osteoporotic?"
    back: "Fractures of the hands, feet, and craniofacial bones\n\nThese fractures typically occur from higher-impact trauma and are not fragility fractures."
    difficulty: easy
    tags: [osteoporosis, fractures, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "When should lateral spine imaging be considered in osteoporosis assessment?"
    back: "To identify vertebral fracture(s) - finding can guide appropriate choice and duration of therapy\n\nMany vertebral fractures are asymptomatic and discovered incidentally on imaging."
    difficulty: medium
    tags: [osteoporosis, vertebral-fracture, imaging, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What 10-year fracture risk thresholds indicate pharmacotherapy for osteoporosis?"
    back: "FRAX 10-year fracture risk >20% OR T-score <-2.5 and age >70 years\n\nThese thresholds identify patients who benefit from pharmacological intervention to reduce fracture risk."
    difficulty: medium
    tags: [osteoporosis, fraxiscore, treatment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the FRAX risk factors that have been validated in the Canadian population?"
    back: "Previous fracture after age 40, weight loss >10% since age 25, parental hip fracture, body mass index <20 kg/m², secondary osteoporosis, current smoking, alcohol >3 drinks/d, glucocorticoid use\n\nThese validated risk factors are used in the FRAX tool to calculate 10-year fracture probability."
    difficulty: medium
    tags: [osteoporosis, frax, risk-assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the occiput-to-wall distance threshold suggesting possible vertebral fracture?"
    back: "Greater than 5 cm\n\nIncreased occiput-to-wall distance indicates thoracic kyphosis from osteoporotic vertebral compression."
    difficulty: easy
    tags: [osteoporosis, physical-exam, kyphosis, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What FRAX tools are available and where can they be accessed?"
    back: "FRAX (WHO Fracture Risk Assessment Tool) and CAROC (Canadian Association of Radiologists and Osteoporosis Canada), available online at https://osteoporosis.ca/tools/\n\nBoth validated tools are available online for Canadian healthcare providers to assess fracture risk."
    difficulty: easy
    tags: [osteoporosis, frax, caroc, assessment-tools, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the threshold for reassessing BMD if 10-year fracture risk is 10-15%?"
    back: "Reassess in 5 years\n\nIntermediate-risk patients should have BMD reassessed at 5-year intervals."
    difficulty: medium
    tags: [osteoporosis, bmd, monitoring, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the threshold for reassessing BMD if 10-year fracture risk is >15%?"
    back: "Reassess in 3 years\n\nHigher-risk patients require more frequent monitoring to assess treatment response."
    difficulty: medium
    tags: [osteoporosis, bmd, monitoring, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the threshold for reassessing BMD if 10-year fracture risk is <10%?"
    back: "Reassess in 5-10 years\n\nLow-risk patients can have extended intervals between BMD assessments."
    difficulty: medium
    tags: [osteoporosis, bmd, monitoring, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the clinical features of wound hemorrhage/hematoma?"
    back: "Pain, swelling, discoloration of wound edges, and leakage.\n\nThese signs result from blood accumulation in the subcutaneous tissues and should prompt evaluation for potential operative intervention."
    difficulty: easy
    tags: [surgery, hemorrhage, hematoma, clinical features, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What are the indirect lung injury causes of ARDS?"
    back: "Sepsis, shock, trauma, blood transfusion, pancreatitis, neurogenic (head trauma, intracranial hemorrhage, drug overdose with narcotics/sedatives/tricyclics)\n\nIndirect injuries cause systemic inflammation that then damages the pulmonary capillary beds."
    difficulty: medium
    tags: [ARDS, etiology, indirect lung injury, sepsis, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "What is the treatment strategy for ARDS based on ARDS Network?"
    back: "Treat underlying disorder, mechanical ventilation with low tidal volumes (<6 mL/kg) to prevent barotrauma, optimal PEEP to keep airways open with lower FiO2, consider prone ventilation, inhaled nitric oxide, short-term paralytics (<48h), or ECMO if conventional treatment fails\n\nLow tidal volume ventilation is the landmark intervention that improved survival in ARDS."
    difficulty: hard
    tags: [ARDS, treatment, ARDS Network, mechanical ventilation, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "What is Anti-GBM disease (Goodpasture's disease)?"
    back: "Autoantibodies targeting type IV collagen in glomerular basement membrane and alveoli, causing glomerulonephritis and/or pulmonary hemorrhage\n\nThis is a small vessel vasculitis affecting kidneys and lungs simultaneously."
    difficulty: medium
    tags: [Anti-GBM, Goodpasture, Vasculitis, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is Granulomatosis with Polyangiitis (GPA, formerly Wegener's)?"
    back: "Granulomatous inflammation of vessels of respiratory tract and kidneys with PR3-ANCA (c-ANCA) > MPO-ANCA; causes pulmonary hemorrhage and glomerulonephritis, may present with URTI symptoms (sinusitis)\n\nGPA is an ANCA-associated vasculitis with necrotizing granulomas in upper/lower airway and kidneys."
    difficulty: medium
    tags: [GPA, Wegeners, ANCA, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What triggers acute pseudogout flares?"
    back: "Dehydration, acute illness, surgery, or trauma\n\nThese stressors can precipitate acute crystal arthritis in patients with underlying CPPD."
    difficulty: medium
    tags: [pseudogout, CPPD, precipitants, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What is a hematocele and how is it managed?"
    back: "Blood collection in tunica vaginalis due to trauma. Managed with ice packs, analgesics, surgical drainage, and hydrocele repair.\n\nUS helps exclude testicular fracture which requires surgical repair. Does not transilluminate."
    difficulty: medium
    tags: [urology, scrotal mass, trauma, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What are the four classes of hemorrhagic shock and their clinical features?"
    back: "Class I: <750 cc (<15%), pulse <100, BP normal, capillary refill normal, UO >30 cc/h — crystalloid. Class II: 750–1500 cc (15–30%), pulse >100, BP normal — crystalloid. Class III: 1500–2000 cc (30–40%), pulse >120, BP decreased, UO 10 cc/h — crystalloid + blood. Class IV: >2000 cc (>40%), pulse >140, BP decreased, UO none — crystalloid + blood.\n\nPhysiological responses vary by patient age, comorbidities, and medications. Blood product transfusion is prioritized in Class III/IV shock. If crossmatched blood is unavailable, use O- for women of childbearing age and O+ for men."
    difficulty: medium
    tags: [hemorrhagic shock, class I-IV, blood loss, transfusion, trauma]
  - front: "What is the management of hemorrhagic shock in the emergency department, including key steps and blood product recommendations?"
    back: "1. Clear airway and assess breathing; 2. Direct pressure on wounds — do not remove impaled objects; 3. Two large-bore IVs (14–16 G) in brachial/cephalic veins or central/IO access; 4. Permissive hypotension with pRBC transfusion (crossmatched preferred; O- for females of childbearing age, O+ for males); 5. Activate massive transfusion protocol if available (includes tranexamic acid, FFP, temperature control, anticoagulation reversal).\n\nCommon sites of internal bleeding to consider: abdomen (peritoneum, retroperitoneum), chest, pelvis, long bones, and GI tract, where surgical intervention may be needed. FAST ultrasound helps identify intraabdominal hemorrhage rapidly."
    difficulty: medium
    tags: [hemorrhagic shock, massive transfusion, tranexamic acid, permissive hypotension, trauma resuscitation]
  - front: "What mnemonic summarises the history in the secondary trauma survey, and what does each letter represent?"
    back: "SAMPLE: Signs and symptoms, Allergies, Medications, Past medical history, Last meal, Events related to injury or illness.\n\nThe secondary survey begins after completing the primary ABCDE survey and initial stabilisation. A structured history identifies additional injuries and contextual factors that may affect management."
    difficulty: easy
    tags: [trauma, secondary survey, history]
  - front: "What are the four areas assessed by the FAST ultrasound examination?"
    back: "1. Subxiphoid pericardial window, 2. Perisplenic (left upper quadrant), 3. Hepatorenal (Morrison's pouch), 4. Pelvic/retrovesical (Pouch of Douglas).\n\nFAST detects free fluid (blood) in the peritoneal and pericardial cavities within minutes. A positive FAST in a haemodynamically unstable patient generally mandates immediate laparotomy."
    difficulty: easy
    tags: [FAST, ultrasound, trauma, POCUS]
  - front: "What are the four key signs of increased intracranial pressure (ICP)?"
    back: "1. Deteriorating LOC (hallmark), 2. Deteriorating respiratory pattern (Cushing's triad: high BP, low HR, irregular respirations), 3. Lateralising CNS signs (cranial nerve palsies, hemiparesis), 4. Papilledema (occurs late). Also: seizures, N/V, and headache.\n\nRising ICP compromises cerebral perfusion pressure (CPP = MAP − ICP). Cushing's triad is a late, ominous sign indicating herniation. Early recognition and treatment (mannitol, head-of-bed elevation, hyperventilation) are critical."
    difficulty: easy
    tags: [ICP, head trauma, TBI, herniation, Cushing triad]
  - front: "What are the clinical signs of a basal skull fracture?"
    back: "Battle's sign (bruising over mastoid process), raccoon eyes (periorbital bruising), haemotympanum, CSF rhinorrhea (CSF from nose), CSF otorrhea (CSF from ear).\n\nBasal skull fractures typically occur through the floor of the anterior cranial fossa. CSF leaks confirm dural disruption. Non-contrast head CT is the best imaging modality for diagnosing intracranial injury."
    difficulty: easy
    tags: [basal skull fracture, head trauma, TBI, Battles sign, raccoon eyes]
  - front: "State the Canadian CT Head Rule indications for imaging in minor head injury (GCS 13–15)."
    back: "CT Head required if ANY of: (1) GCS <15 at 2 h after injury, (2) Suspected open or depressed skull fracture, (3) Any sign of basal skull fracture (Battle's sign, raccoon eyes, hemotympanum, CSF otorrhea/rhinorrhea), (4) Vomiting ≥2 episodes, (5) Age ≥65 yr. Medium-risk: (6) Amnesia before impact ≥30 min, (7) Dangerous mechanism (pedestrian vs. vehicle, ejection from MVC, fall from >3 ft/5 stairs).\n\nThe Canadian CT Head Rule applies only to alert, stable adult patients with minor head injury (witnessed LOC, amnesia, or confusion with GCS 13–15). It does NOT apply to GCS <13, age <16, patients on anticoagulants, or coagulopathy."
    difficulty: medium
    tags: [Canadian CT Head Rule, TBI, head trauma, CT scan]
  - front: "Define mild traumatic brain injury (concussion) and its hallmark features."
    back: "Mild TBI (GCS 13–15): patient is awake and may be confused but able to communicate and follow commands. Hallmarks: confusion and amnesia (may be immediate or delayed minutes after trauma). LOC, if present, must be <30 min; post-traumatic amnesia must be <24 h.\n\nConcussion is the most common form of TBI. Somatic symptoms (headache, N/V), cognitive dysfunction (attention, processing speed), and emotional/behavioural changes may persist. Return-to-play and return-to-learn protocols must be followed."
    difficulty: easy
    tags: [concussion, mild TBI, head trauma]
  - front: "How is diffuse axonal injury (DAI) classified by severity?"
    back: "Mild DAI: coma 6–24 h, possible lasting deficit. Moderate DAI: coma >24 h, little or no brainstem signs. Severe DAI: coma >24 h, frequent brainstem dysfunction signs.\n\nDAI results from rotational shear forces disrupting axons diffusely. It requires MRI for diagnosis (rarely made in the ED on CT alone) and carries significant morbidity and mortality proportional to severity."
    difficulty: medium
    tags: [diffuse axonal injury, DAI, TBI, coma]
  - front: "What GCS score mandates intubation in head trauma, and how are TBI severity levels defined by GCS?"
    back: "GCS ≤8 → intubate. Severity: Mild TBI = GCS 13–15; Moderate TBI = GCS 9–12; Severe TBI = GCS 3–8. Any change in GCS score of ≥3 points indicates serious injury.\n\nIntubation protects the airway and enables controlled ventilation to manage ICP. The GCS threshold of ≤8 correlates with inability to protect the airway. Secondary brain injury from hypoxia, hypotension, or hypercarbia must be prevented."
    difficulty: easy
    tags: [GCS, TBI, intubation, head trauma]
  - front: "What are the steps in emergency management of raised ICP?"
    back: "1. Intubate (neuroprotective RSI — give fentanyl or lidocaine ≥2 min pre-RSI), 2. Hyperventilate to pCO2 30–35 mmHg, 3. Elevate head of bed to 20°, 4. Maintain adequate BP (sBP >90 or MAP >60), 5. Give mannitol 1 g/kg IV rapidly (contraindicated in shock/renal failure) OR 3% hypertonic saline 3 mL/kg, 6. Remove cervical collar if possible.\n\nThese measures reduce ICP by reducing cerebral blood volume (hyperventilation causes vasoconstriction), reducing cerebral oedema (mannitol/hypertonic saline osmotherapy), and promoting venous drainage (head elevation). Goal: maintain CPP = MAP − ICP."
    difficulty: hard
    tags: [ICP, TBI, mannitol, RSI, neuroprotection]
  - front: "What is the seizure prophylaxis used in traumatic brain injury?"
    back: "Phenytoin or levetiracetam.\n\nPost-traumatic seizures increase cerebral metabolic demand and ICP. Prophylaxis is indicated for severe TBI; levetiracetam is increasingly preferred due to its simpler dosing and fewer drug interactions."
    difficulty: easy
    tags: [TBI, seizure prophylaxis, phenytoin, levetiracetam]
  - front: "What populations are at highest risk for mild TBI (concussion)?"
    back: "Children 0–4 yr, adolescents 15–19 yr, and elderly >65 yr. Common causes: falls, MVC, struck by object, assault, sports.\n\nRepeat concussions in athletes carry risk of cumulative brain injury and potentially life-threatening cerebral oedema (second-impact syndrome). Return-to-play protocols are mandatory in Canada."
    difficulty: easy
    tags: [concussion, TBI, epidemiology, risk factors]
  - front: "What are the Canadian C-Spine Rule criteria for clearing the C-spine without imaging in a stable, alert (GCS 15) trauma patient?"
    back: "C-spine can be cleared clinically if ALL of: (1) oriented to person, place, time, event; (2) no paresthesias to extremities; (3) no intoxication; (4) no posterior midline cervical tenderness; (5) no focal neurological deficits; (6) no painful distracting injuries; (7) able to rotate neck 45° each direction without midline tenderness.\n\nThe Canadian C-Spine Rule has high sensitivity for clinically important C-spine injuries and reduces unnecessary imaging. CT C-spine is the screening modality of choice when imaging is indicated, detecting 97–100% of injuries."
    difficulty: medium
    tags: [C-spine, Canadian C-Spine Rule, trauma, clearance]
  - front: "What are the 'dangerous mechanisms' per the Canadian C-Spine Rule that mandate C-spine imaging?"
    back: "Fall from >1 metre or 5 stairs; high-speed MVC (>100 km/h); ejection from vehicle; motorised recreational vehicle collision; bicycle collision; axial load (diving); hit by high-speed vehicle.\n\nDangerous mechanisms impart high-energy forces to the spine, increasing the probability of unstable fractures. In these patients, CT is preferred over plain radiography for faster and more sensitive evaluation."
    difficulty: easy
    tags: [Canadian C-Spine Rule, C-spine imaging, trauma]
  - front: "What is spinal shock, and how does it differ from neurogenic shock?"
    back: "Spinal shock: absence of ALL voluntary and reflex activity below the injury level (decreased reflexes, no sensation, flaccid paralysis); lasts days to months. Neurogenic shock: loss of vasomotor and SNS tone causing hypotension (lacking SNS vasoconstriction) and bradycardia (unopposed PNS); occurs within 30 min of SCI at T6 or above, lasts up to 6 weeks.\n\nThese are distinct entities. Spinal shock is a physiological, not cardiovascular, phenomenon. Neurogenic shock is a distributive shock requiring vasopressors. Poikilothermia (inability to regulate temperature) also occurs in neurogenic shock due to loss of sympathetic control."
    difficulty: hard
    tags: [spinal cord injury, spinal shock, neurogenic shock, SCI]
  - front: "What is autonomic dysreflexia, and who is at risk?"
    back: "A syndrome in patients with SCI at T6 or above: episodic, dangerously high BP, pounding headache, nasal congestion, sweating, apprehension, visual changes. Common triggers: bladder distension/UTI/kidney stones, fecal impaction/bowel distension.\n\nAutonomic dysreflexia results from unmodulated sympathetic reflexes below the injury level in response to visceral stimuli. Treatment involves monitoring and controlling BP while identifying and removing the causative trigger (e.g., catheterisation for bladder distension)."
    difficulty: medium
    tags: [autonomic dysreflexia, spinal cord injury, SCI, hypertension]
  - front: "What respiratory concern arises from a low cervical spinal cord transection (C5–T1) versus a high cervical injury (above C4)?"
    back: "C5–T1 transection: abdominal breathing preserved (phrenic nerve/diaphragm intact) but intercostals and accessory muscles lost. Above C4: phrenic nerve affected → complete respiratory paralysis → requires intubation and mechanical ventilation.\n\nThe phrenic nerve originates at C3–C5. Injuries above C4 eliminate diaphragmatic function. Soft-tissue swelling after high cervical injury can cause progressive airway compromise; a low threshold for early intubation is essential."
    difficulty: medium
    tags: [cervical spine injury, respiratory failure, phrenic nerve, SCI]
  - front: "What is Cauda Equina Syndrome, and what are its key clinical features?"
    back: "Cauda Equina Syndrome occurs with spinal cord injury below T10. Features: incontinence (bowel/bladder), anterior thigh pain, quadriceps weakness, abnormal sacral sensation, decreased rectal tone, and variable reflexes.\n\nCauda equina is a surgical emergency. Delayed decompression risks permanent bladder, bowel, and sexual dysfunction. MRI is the preferred imaging. Urgent neurosurgical/orthopaedic consultation is mandatory."
    difficulty: medium
    tags: [cauda equina syndrome, spinal cord injury, incontinence]
  - front: "What are the six immediately life-threatening chest injuries identified in the primary trauma survey?"
    back: "1. Airway obstruction, 2. Tension pneumothorax, 3. Open pneumothorax (sucking chest wound), 4. Massive haemothorax (>1500 cc), 5. Flail chest, 6. Cardiac tamponade.\n\nThese 'killer Bs' must be identified and treated during the primary ABCDE survey before secondary survey. They account for the majority of preventable trauma deaths. 80% of chest injuries can be managed non-surgically with intubation, chest tubes, and pain control."
    difficulty: easy
    tags: [chest trauma, tension pneumothorax, haemothorax, cardiac tamponade, flail chest]
  - front: "What is tension pneumothorax, and what is the emergency management?"
    back: "One-way valve causing progressive air accumulation in the pleural space, impairing venous return and cardiac output. Clinical (not radiographic) diagnosis: respiratory distress, tachycardia, hypoxia, absent breath sounds, hyperresonance, tracheal deviation away from pneumothorax, distended neck veins, cyanosis. Emergency: needle thoracostomy (large-bore needle, 2nd ICS mid-clavicular line) or finger thoracostomy; definitive management = chest tube.\n\nTension pneumothorax is rapidly fatal. Treatment must not be delayed for imaging. Needle decompression converts tension to simple pneumothorax, buying time for definitive chest tube placement."
    difficulty: medium
    tags: [tension pneumothorax, chest trauma, needle decompression]
  - front: "What is the management of an open pneumothorax (sucking chest wound)?"
    back: "Air-tight dressing sealed on 3 sides (three-way seal) to allow air to escape during expiration without re-entry during inspiration (prevents tension pneumothorax), followed by chest tube insertion and possible surgery.\n\nA wound >2/3 the diameter of the trachea allows preferential air entry through the wound. The 3-sided seal acts as a flutter valve. A fully occlusive dressing risks converting to tension pneumothorax."
    difficulty: medium
    tags: [open pneumothorax, sucking chest wound, chest trauma]
  - front: "What are the indications for emergency thoracotomy after massive haemothorax?"
    back: ">1500 cc total blood loss on initial chest tube drainage OR >200 cc/h continued drainage.\n\nMassive haemothorax presents with shock, flat neck veins (blood loss), and a completely opaque hemithorax on supine CXR (blood spreads over posterior thoracic cavity). Initial management includes blood volume restoration and chest tube drainage."
    difficulty: medium
    tags: [massive haemothorax, thoracotomy, chest trauma]
  - front: "What is Beck's triad, and in what condition does it occur?"
    back: "Beck's triad: hypotension + distended neck veins + muffled heart sounds. Occurs in cardiac tamponade (pericardial fluid accumulation impairing ventricular filling).\n\nCardiac tamponade is usually caused by penetrating trauma within the cardiac box (sternal notch to nipples to xiphoid). Additional signs include tachycardia, Kussmaul's sign (increased JVP with inspiration), and pulsus paradoxus (BP drop >10 mmHg with inspiration). FAST or echocardiogram confirms diagnosis; pericardiocentesis or ED thoracotomy is needed."
    difficulty: easy
    tags: [cardiac tamponade, Becks triad, chest trauma, pericardial effusion]
  - front: "What is pulsus paradoxus, and what value is considered abnormal?"
    back: "A drop in systolic BP >10 mmHg during inspiration. Normally BP drops slightly with inspiration; a drop >10 mmHg is 'paradoxical' and suggests pericardial tamponade, severe asthma, or COPD exacerbation.\n\nDuring inspiration, right heart filling increases, shifting the interventricular septum leftward in a constrained pericardial sac, reducing LV output. This is exaggerated in tamponade, where pericardial pressure is elevated."
    difficulty: medium
    tags: [pulsus paradoxus, cardiac tamponade, asthma]
  - front: "What is flail chest, and why is it dangerous?"
    back: "Free-floating chest wall segment due to ≥2 rib fractures at ≥2 sites each, causing paradoxical movement (segment moves in on inspiration, out on expiration). Dangerous because of the underlying pulmonary contusion — the primary cause of morbidity and mortality.\n\nThe mechanical instability of the chest wall impairs ventilation, but the key pathology is the underlying contused lung causing hypoxia. Management includes adequate oxygenation/ventilation, analgesia, and possible intubation for severe cases."
    difficulty: medium
    tags: [flail chest, rib fractures, pulmonary contusion, chest trauma]
  - front: "What are the CXR features of traumatic aortic tear?"
    back: "Widened mediastinum (most sensitive, not specific); depressed left main bronchus; pleural cap; indistinct aortic knuckle; tracheal deviation to the right; nasogastric tube deviation. Present in ~85% of cases but absence does not exclude injury.\n\n90% of aortic tears occur at the aortic isthmus (near ligamentum arteriosum), just distal to the left subclavian artery, due to differential deceleration. Most patients die at the scene; salvage depends on rapid diagnosis. CT angiography or transesophageal echocardiography are used for confirmation."
    difficulty: hard
    tags: [aortic tear, chest trauma, widened mediastinum, CXR]
  - front: "What is the trimodal distribution of trauma deaths?"
    back: "Peak 1 (seconds to minutes): death at scene from lethal injuries (severe CNS/vascular trauma). Peak 2 (early, within 4–6 h): 'golden hour' — preventable deaths from haemorrhage and head injury. Peak 3 (days–weeks): multiple organ dysfunction, sepsis, VTE.\n\nUnderstanding the trimodal distribution underpins trauma systems: trauma centres focus on reducing peak 2 deaths through rapid haemorrhage control and damage control surgery. Peaks 1 and 3 are addressed through prevention and ICU care, respectively."
    difficulty: easy
    tags: [trauma, trimodal distribution, golden hour, epidemiology]
  - front: "What is Waddell's triad in paediatric pedestrian trauma?"
    back: "Tibia-fibula or femur fracture (leg struck by bumper) + truncal or abdominal injury (impact against car) + craniofacial injury (thrown to ground). This triad is specific to paediatric patients struck by vehicles.\n\nAdults tend to be struck at lower leg level; children's shorter stature means the bumper impacts the torso. All three injury types should be assumed until excluded, even if only one is clinically apparent on initial assessment."
    difficulty: medium
    tags: [Waddells triad, paediatric trauma, pedestrian injury]
  - front: "What is the most common and second most common solid organ injured in blunt abdominal trauma?"
    back: "Most common: spleen. Second most common: liver.\n\nHollow organ injuries are more typical of penetrating trauma. Blunt trauma (e.g., MVC, fall) generates compressive and shear forces that rupture solid organs. Haemodynamic stability determines whether operative vs. non-operative management is pursued."
    difficulty: easy
    tags: [abdominal trauma, spleen, liver, blunt trauma]
  - front: "What are the indications for mandatory laparotomy after penetrating abdominal trauma?"
    back: "Shock; evisceration; free air in abdomen; haematemesis; blood in NG tube, Foley catheter, or on DRE; signs of peritonitis; haemodynamic instability.\n\nThe 'Rule of Thirds' for stab wounds: 1/3 do not penetrate the peritoneal cavity, 1/3 penetrate but cause no significant injury, 1/3 require laparotomy. All gunshot wounds to the abdomen should be assumed to have penetrated the peritoneum."
    difficulty: medium
    tags: [penetrating abdominal trauma, laparotomy, peritonitis]
  - front: "What are the strengths and limitations of FAST ultrasound in abdominal trauma?"
    back: "Strengths: rapid (<5 min), identifies free fluid in peritoneal/pericardial cavities, can be repeated serially. Limitations: does NOT identify specific organ injuries; false positive in ascites; false negatives with small amounts of blood, retroperitoneal bleeding, delayed presentations, prior surgery, obesity, or poor positioning. Sensitivity ~68% for abdominal injuries (lower in children ~63%).\n\nA positive FAST in a haemodynamically unstable patient guides immediate OR. A negative FAST does NOT exclude injury and must be supplemented with CT in stable patients. FAST has higher sensitivity (~96%) for chest injuries."
    difficulty: medium
    tags: [FAST, ultrasound, abdominal trauma, POCUS]
  - front: "What imaging modality is most sensitive for diagnosing abdominal injuries in trauma, and what is its key limitation?"
    back: "CT scan is the most specific test. Key limitation: radiation exposure (~20× more than x-ray), and should be used with caution in haemodynamic instability (patient may need to go directly to OR).\n\nIn haemodynamically unstable patients with a positive FAST, the decision between CT and OR must be made in the trauma bay. CT provides organ-specific detail needed for non-operative management of solid organ injuries but requires a stable patient."
    difficulty: medium
    tags: [CT scan, abdominal trauma, haemodynamic instability]
  - front: "What is the preferred initial investigation for suspected urethral injury in trauma?"
    back: "Retrograde urethrography (before Foley catheter insertion). Foley catheter is contraindicated if urethral injury is suspected.\n\nSigns of urethral injury: perineal ecchymosis, blood at the urethral meatus, high-riding prostate on DRE, pelvic fractures. Blind catheterisation can convert a partial urethral tear into a complete disruption."
    difficulty: medium
    tags: [urethral injury, genitourinary trauma, retrograde urethrogram, Foley catheter]
  - front: "What is the best imaging modality for renal trauma in a haemodynamically stable patient?"
    back: "CT scan (with contrast) is the best modality for renal trauma in haemodynamically stable patients. Intravenous pyelogram is an alternative.\n\nCT allows grading of renal lacerations, assessment of vascular pedicle injury, and detection of urine extravasation. Minor renal injuries (contusions, small lacerations) are managed conservatively; major injuries and renal pedicle injuries require surgical intervention."
    difficulty: easy
    tags: [renal trauma, CT scan, genitourinary trauma]
  - front: "What clinical findings suggest intraperitoneal vs. extraperitoneal bladder rupture in trauma?"
    back: "Intraperitoneal bladder rupture: acute abdomen (urine freely in peritoneal cavity). Extraperitoneal bladder rupture: pelvic instability, suprapubic tenderness from mass effect of extravasated urine or blood (typically due to pelvic fracture fragments).\n\nIntraperitoneal rupture occurs when a full bladder receives direct trauma; it requires laparotomy. Extraperitoneal rupture is associated with pelvic fractures and can often be managed with Foley catheter drainage alone."
    difficulty: medium
    tags: [bladder rupture, genitourinary trauma, pelvic fracture]
  - front: "What is the 'cardiac box' in penetrating trauma, and why is it important?"
    back: "The cardiac box is the area bounded by the sternal notch superiorly, the nipples laterally, and the xiphoid process inferiorly. Penetrating injuries within this area should raise high suspicion for cardiac injury (tamponade, ventricular laceration).\n\nThe heart and great vessels lie within the cardiac box. Even apparently minor penetrating wounds in this region can cause life-threatening cardiac tamponade, which may present with haemodynamic stability initially due to compensatory tachycardia."
    difficulty: easy
    tags: [cardiac box, cardiac tamponade, penetrating trauma, chest trauma]
  - front: "What are the three zones of the neck in trauma, and what is the management principle for penetrating neck trauma?"
    back: "Zone I: base of neck (thoracic inlet to cricoid). Zone II: mid-neck (cricoid to angle of mandible). Zone III: superior neck (above angle of mandible). Management: injuries deep to platysma require further evaluation by angiography, contrast CT, or surgery. Never explore penetrating neck wounds at the bedside (only in OR).\n\nZone II injuries (most common and accessible) were historically explored surgically; modern selective management using CT angiography is now standard. Zone I and III injuries are technically challenging and require vascular imaging before intervention."
    difficulty: medium
    tags: [penetrating neck trauma, zones of neck, trauma]
  - front: "What is the classic triad of laryngeal injury in trauma?"
    back: "Hoarseness + subcutaneous emphysema + palpable laryngeal fracture.\n\nOther symptoms include haemoptysis, dysphagia, and dysphonia. Airway must be secured early because oedema can progress rapidly. Surgical tracheotomy or repair may be required. C-spine injury should also be considered given the mechanism."
    difficulty: medium
    tags: [laryngeal injury, airway trauma, penetrating neck trauma]
  - front: "What CXR finding suggests tracheobronchial injury, and when should surgical repair be considered?"
    back: "CXR: mediastinal air, persistent pneumothorax, or persistent air leak after chest tube. Hamman's sign (mediastinal crunch). Surgical repair is indicated if >1/3 of the circumference is disrupted.\n\nTracheobronchial injuries are frequently missed due to variable presentation. Subcutaneous emphysema is often prominent. Bronchoscopy confirms the diagnosis and localises the injury for planning surgical repair."
    difficulty: medium
    tags: [tracheobronchial injury, Hamman sign, chest trauma, mediastinal air]
  - front: "What are the seatbelt injuries that should prompt concern for intra-abdominal pathology?"
    back: "Seatbelt injuries can cause: intraperitoneal bowel transection, mesenteric injury, and L-spine injury (Chance fracture). A 'seat-belt sign' (abdominal wall ecchymosis) should prompt CT imaging.\n\nThe seat-belt sign has a sensitivity of ~80% for intra-abdominal injury. Lap-belt injuries concentrate deceleration force on the abdomen and lumbar spine. Hollow organ perforations may not present immediately and require serial examinations."
    difficulty: medium
    tags: [seatbelt injury, abdominal trauma, Chance fracture, bowel injury]
  - front: "What bilateral calcaneal fractures with falls from height should prompt evaluation of?"
    back: "Concurrent burst fractures of the lumbar/thoracic spine (T11–L2) in ~10% of cases. Thoracolumbar spine CT should be performed.\n\nThe mechanism of axial loading transmitted up the lower extremities to the spine is the same force causing calcaneal fractures. The association is easily missed if the spine is not evaluated. 20% of C-spine fractures are accompanied by other spinal fractures."
    difficulty: medium
    tags: [calcaneal fracture, lumbar fracture, burst fracture, spinal trauma]
  - front: "What are the management priorities in neurogenic shock from spinal cord injury?"
    back: "Maintain sBP >100 mmHg; IV fluids; vasopressors if needed; atropine for bradycardia; maintain normothermia and euglycaemia; provide airway support. Identify and treat the underlying SCI.\n\nNeurogenic shock is distributive: loss of sympathetic vasoconstriction causes hypotension, and loss of cardiac sympathetic acceleration causes bradycardia (unlike haemorrhagic shock where bradycardia is absent). Distinguishing the two shock types is critical."
    difficulty: medium
    tags: [neurogenic shock, spinal cord injury, SCI, vasopressors]
  - front: "What percentage of chest injuries can be managed non-surgically?"
    back: "Approximately 80% of chest injuries can be managed non-surgically with simple measures: intubation, chest tubes, and pain control.\n\nThis principle guides triage: most thoracic trauma does not require thoracotomy. Tube thoracostomy manages pneumothorax and haemothorax effectively. Only massive haemothorax (>1500 cc or persistent output >200 cc/h), cardiac tamponade not amenable to pericardiocentesis, and aortic tears require surgical intervention."
    difficulty: easy
    tags: [chest trauma, chest tube, thoracotomy]
  - front: "What is ruptured diaphragm, and on which side is it more commonly diagnosed, and why?"
    back: "Rupture of the diaphragm from blunt (high lap belt, MVC) or penetrating thoracoabdominal trauma. More commonly diagnosed on the LEFT side because the liver on the right conceals defects and attenuates the force.\n\nCXR may show an abnormality of the diaphragm or lower lung fields, or show the NG tube within the chest. CT scan, laparoscopy (gold standard), and endoscopy help confirm the diagnosis. Treatment is laparotomy for diaphragm repair."
    difficulty: medium
    tags: [ruptured diaphragm, chest trauma, abdominal trauma, diaphragm]
  - front: "What is the treatment for compartment syndrome in the ED?"
    back: "Remove all constrictive casts and dressings immediately; emergent fasciotomy if compartment syndrome is confirmed or strongly suspected. Stryker compartment pressure monitor can be used in unconscious patients.\n\nCompartment syndrome is a surgical emergency. Fasciotomy decompresses the compartment and restores perfusion. Delay leads to irreversible muscle and nerve necrosis. Clinical diagnosis with a high index of suspicion is emphasized — do not wait for the full 6 Ps."
    difficulty: easy
    tags: [compartment syndrome, fasciotomy, emergency treatment]
  - front: "What is the mnemonic STAND for in open fracture management?"
    back: "S — Splint; T — Tetanus prophylaxis; A — Antibiotics (1st-generation cephalosporin + aminoglycoside); N — Neurovascular status (before and after reduction); D — Dressings (to cover wound).\n\nOpen fractures carry high risk of osteomyelitis due to communication between the fracture site and external skin. Definitive surgical management (irrigation and debridement) should ideally occur within 6 hours. Control bleeding with pressure only — do not clamp."
    difficulty: easy
    tags: [open fracture, orthopedics, emergency, antibiotics]
  - front: "What are the Ottawa Knee Rules — when is knee x-ray required after acute injury?"
    back: "X-ray required if any one of: (1) Age ≥55 yr; (2) Tenderness at head of fibula; (3) Isolated tenderness of patella; (4) Inability to flex to 90°; (5) Inability to bear weight both immediately and in the ED (four steps).\n\nThe Ottawa Knee Rules reduce unnecessary radiography while maintaining near-100% sensitivity for fractures. They apply to patients with acute knee injury. These rules were validated in prospective studies and are standard of care in Canadian EDs."
    difficulty: easy
    tags: [Ottawa rules, knee, fracture, x-ray, emergency]
  - front: "What are the Ottawa Ankle Rules — when is ankle x-ray required?"
    back: "Ankle x-ray if pain in malleolar zone AND: (A) bony tenderness at posterior edge/tip of lateral malleolus, OR (B) bony tenderness at posterior edge/tip of medial malleolus, OR inability to bear weight immediately and in ED. Foot x-ray if pain in midfoot zone AND: (C) bony tenderness at base of 5th metatarsal, OR (D) bony tenderness at navicular, OR inability to bear weight.\n\nThe Ottawa Ankle and Foot Rules are clinical decision tools validated to reduce unnecessary radiography. They have high sensitivity (~99%) for clinically significant fractures. Inability to bear weight is defined as taking four steps both immediately after injury and in the ED."
    difficulty: medium
    tags: [Ottawa rules, ankle, foot, fracture, x-ray]
  - front: "What are the classic features of a Colles' fracture and its management?"
    back: "Colles' fracture: distal radius fracture from fall on outstretched hand (FOOSH). AP x-ray: radial shortening, radial deviation, radial displacement. Lateral x-ray: dorsal displacement, volar angulation. Management: reduce, immobilize with splint, outpatient orthopedics follow-up (immediate referral if complicated).\n\nColles' fracture is the most common wrist fracture in adults, especially elderly women with osteoporosis. The 'dinner fork' deformity results from dorsal displacement. If the articular surface is involved or reduction is unsatisfactory in the ED, orthopedic referral is warranted."
    difficulty: easy
    tags: [Colles fracture, wrist, FOOSH, orthopedics]
  - front: "What is the clinical presentation and management of a scaphoid fracture?"
    back: "Clinical: tenderness in anatomical snuff box, pain on scaphoid tubercle, pain on axial loading of thumb. X-ray negative: thumb spica splint, repeat x-ray in 1 week + CT/bone scan. X-ray positive: thumb spica splint x 6–8 weeks. Treat based on clinical suspicion even without radiological fracture. Risk of avascular necrosis (AVN) if not immobilized.\n\nThe scaphoid receives retrograde blood supply, making the proximal pole vulnerable to AVN if fracture is missed or inadequately immobilized. Initial x-rays may be negative in up to 20% of scaphoid fractures. Clinical suspicion warrants treatment even when imaging is normal."
    difficulty: medium
    tags: [scaphoid fracture, wrist, AVN, clinical decision]
  - front: "What are the anterior shoulder dislocation clinical features and which nerves are at risk?"
    back: "Most common type of shoulder dislocation. Nerves at risk: axillary nerve (lateral aspect of shoulder) and musculocutaneous nerve (extensor aspect of forearm). Seen on lateral view: humeral head anterior to glenoid. Manage with reduction (traction or scapular manipulation), immobilize in internal rotation, repeat x-ray, outpatient orthopedics follow-up.\n\nAxillary nerve injury causes loss of sensation over the deltoid patch (lateral shoulder) and deltoid weakness — this must be assessed before and after reduction. Musculocutaneous nerve injury affects elbow flexion and forearm sensation. Always obtain post-reduction x-ray to confirm position and rule out associated fracture."
    difficulty: medium
    tags: [shoulder dislocation, axillary nerve, reduction, orthopedics]
  - front: "What are the high-risk wound factors that increase infection risk when considering tetanus prophylaxis and wound management?"
    back: "High-risk wound factors: puncture wounds, crush injuries, wounds >12 h old, hand or foot wounds, age >50 yr, immunocompromised state. Also: contamination with dirt/feces/soil/saliva, avulsions, wounds from missiles, burns, frostbite.\n\nHigh-risk wounds require both tetanus toxoid AND tetanus immunoglobulin (TIG) if vaccination history is unknown or <3 doses. For patients with ≥3 doses: Td needed only if >5 years since last dose for high-risk wounds (vs. >10 years for clean minor wounds). Both Td and TIG are safe in pregnancy."
    difficulty: medium
    tags: [tetanus prophylaxis, wound management, infection risk]
  - front: "What is the most important intervention for reducing wound infection risk?"
    back: "Early wound irrigation and debridement are the most important factors in decreasing infection risk.\n\nCopious irrigation with normal saline or tap water mechanically removes bacteria and debris. Combined with debridement of non-viable tissue, this reduces bacterial load below the threshold for clinical infection. Prophylactic antibiotics are secondary and used selectively (animal/human bites, intra-oral lesions, foot puncture wounds through shoes)."
    difficulty: easy
    tags: [wound infection, irrigation, laceration management]
  - front: "What are the contraindications to primary closure (suturing) of a wound in the ED?"
    back: "Do NOT suture if: delayed presentation (>24 h), puncture wound, mammalian bite (with some exceptions), crush injury, or retained foreign body.\n\nThese conditions significantly increase the risk of wound infection if closed primarily. Delayed primary closure (3–5 days later, after signs of infection are ruled out) or allowing wounds to heal by secondary intention are alternatives. Some mammalian bites (e.g., facial dog bites) may be closed primarily due to cosmetic importance and good blood supply."
    difficulty: easy
    tags: [wound closure, laceration, sutures, contraindications]
  - front: "What are the life-threatening orthopedic injuries that cause limb threat vs. life threat?"
    back: "Life-threatening (blood loss): major pelvic fractures, traumatic amputations, massive long bone injuries ± fat emboli syndrome, vascular injury proximal to knee/elbow. Limb-threatening (blood supply interruption): fracture/dislocation of ankle (talar AVN), crush injuries, compartment syndrome, open fractures, dislocations of knee/hip, fractures above knee.\n\nPelvic fractures can cause 3–4 L of blood loss in the retroperitoneal space. Femur fractures can lose 1–2 L. Vascular injury proximal to the knee or elbow is limb-threatening because collateral circulation may be insufficient to maintain distal perfusion. Early vascular surgery involvement is critical."
    difficulty: medium
    tags: [orthopedic trauma, life-threatening, limb-threatening, emergency]
  - front: "What is the clinical presentation and management of posterior urethral injury?"
    back: "Posterior urethral injury: associated with pelvic fractures. Management: suprapubic cystostomy (avoid urethral catheterization) + surgical repair. Anterior urethral injury: conservative management; if unable to void, Foley catheter or suprapubic cystostomy + antibiotics.\n\nPosterior urethral injuries are associated with pelvic ring disruption and are more complex. Attempting urethral catheterization in posterior injuries can convert a partial tear into a complete transaction and worsen the injury. Classic signs include blood at urethral meatus, high-riding prostate on rectal exam, and perineal ecchymosis."
    difficulty: medium
    tags: [urethral injury, trauma, pelvic fracture, suprapubic cystostomy]
  - front: "What calcaneal fracture associations must be remembered?"
    back: "Associated with fall from height. Associated with axial loading injuries — always look for associated injuries at ankles, knees, hips, pelvis, and lumbar spine.\n\nThe calcaneus is the most commonly fractured tarsal bone, typically from axial loading (falling from height). The classic injury pattern includes bilateral calcaneal fractures with lumbar compression fractures — examine the entire axial skeleton. CT is required for surgical planning; most are managed non-operatively but some require ORIF."
    difficulty: easy
    tags: [calcaneal fracture, axial loading, trauma, orthopedics]
  - front: "What did the concussion screen time RCT (NCT03564210) find?"
    back: "Patients with unrestricted screen time after concussion had significantly longer recovery (8 days) compared to those who abstained from screen time for 48 hours (3.5 days). Abstaining from screen time during the first 48 hours after concussion may reduce the duration of symptoms.\n\nScreen time after concussion may delay recovery by increasing cognitive load and worsening symptoms (headache, light sensitivity). Current recommendations advise relative cognitive rest during the acute post-injury period, with gradual return to activity guided by symptom tolerance."
    difficulty: medium
    tags: [concussion, screen time, pediatric, TBI, landmark trial]
  - front: "What are the contraindications to Foley catheter insertion?"
    back: "1. Suspected urethral injury (e.g., in pelvic trauma — blood at urethral meatus, perineal bruising, high-riding prostate on DRE)\n2. Difficult insertion of catheter (relative contraindication; urological consultation warranted)\n\nIn pelvic trauma, urethral injury must be excluded before Foley catheter insertion (retrograde urethrogram if injury suspected). Forceful Foley insertion in the setting of urethral disruption can convert a partial tear to a complete disruption. Suprapubic catheterization is the alternative when urethral injury is confirmed."
    difficulty: easy
    tags: [Foley catheter, contraindications, urethral injury, surgery, trauma]
  - front: "What is Kehr's sign and what causes it?"
    back: "Left shoulder pain caused by diaphragmatic irritation from splenic rupture (referred pain via the left phrenic nerve); worsens with elevation of the foot of the bed.\n\nKehr's sign occurs because blood or fluid irritates the left hemidiaphragm, and pain is referred to the left shoulder via the C3-C5 dermatomes (phrenic nerve). It is seen in splenic trauma and splenic infarction."
    difficulty: easy
    tags: [spleen, trauma, referred pain, Kehrs sign]
  - front: "What is the initial diagnostic approach for splenic trauma in a hemodynamically unstable patient vs. a stable patient?"
    back: "Unstable: FAST (Focused Assessment with Sonography in Trauma). Stable or FAST-negative: CT with oral or IV contrast for definitive assessment.\n\nFAST is the rapid bedside tool in trauma resuscitation. CT provides detailed injury grading and informs operative vs. non-operative management. A positive FAST in an unstable patient leads to emergent operative exploration."
    difficulty: medium
    tags: [splenic trauma, FAST, CT, imaging]
  - front: "What are the indications for splenic artery embolization in splenic trauma?"
    back: "Hemodynamically stable patient with one of: active contrast extravasation, splenic pseudoaneurysm, or hemoperitoneum.\n\nNon-operative management (NOM) is appropriate for stable patients and includes bed rest and serial hematocrit monitoring for 3-5 days. Splenectomy is reserved for hemodynamically unstable patients or high-grade injury with ongoing bleeding."
    difficulty: hard
    tags: [splenic trauma, embolization, non-operative, management]
  - front: "In pediatric splenic laceration management, how long is bed rest recommended?"
    back: "Grade of injury + 1 day (e.g., grade 3 laceration = 4 days of bed rest).\n\nPediatric patients are preferentially managed non-operatively to preserve splenic immune function. Non-operative management is used whenever hemodynamic stability is maintained."
    difficulty: medium
    tags: [splenic trauma, pediatric, bed rest, non-operative]
  - front: "What are the indications for splenectomy?"
    back: "Splenic trauma (most common), hereditary spherocytosis, primary hypersplenism, chronic ITP, splenic vein thrombosis causing esophageal varices, splenic abscess, TTP, sickle cell disease.\n\nSplenectomy does not benefit all thrombocytopenic states (e.g., infection, bone marrow malignancies, drugs/toxins). The probability of cure of ITP by splenectomy is 60-70% and may be predicted by response to IVIG."
    difficulty: medium
    tags: [splenectomy, indications, ITP, hereditary spherocytosis]
  - front: "What long-term complications can occur following splenectomy?"
    back: "Post-splenectomy sepsis (encapsulated organisms, 4% risk, highest in age <16), splenosis (intraabdominal splenic seeding), increased risk of malignancy, DVT, and PE.\n\nSplenosis refers to auto-transplantation of splenic tissue fragments throughout the peritoneal cavity after splenic trauma or splenectomy and can provide partial immune function. Post-splenectomy thrombocytosis and leukocytosis are short-term complications."
    difficulty: medium
    tags: [splenectomy, complications, splenosis, DVT]
  - front: "What causes splenic infarction and what is the first-line investigation?"
    back: "Splenic artery occlusion or oxygen-delivery insufficiency (e.g., sickle cell disease, thromboembolism, myelofibrosis, CML, hypercoagulable states). First-line investigation: CT with contrast.\n\nPatients may be asymptomatic or present with LUQ pain (70%), N/V, fever, chills, and Kehr's sign. Most are managed non-operatively. Splenectomy is indicated for complications (rupture, abscess, persistent pseudocyst, bleeding, or sepsis)."
    difficulty: medium
    tags: [splenic infarction, sickle cell, CML, CT]
