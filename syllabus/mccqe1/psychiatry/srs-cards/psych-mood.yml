  - front: "What is the prognosis for depression?"
    back: "Up to 40% resolve spontaneously within 6-12 months; recurrence risk: 50% after 1 episode, 70% after 2 episodes, 90% after 3 episodes\n\nDepression has high recurrence rates, increasing significantly with each episode."
