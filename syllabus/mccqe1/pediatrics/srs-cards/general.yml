# General (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the definition of fever based on oral temperature measurements?"
    back: "Oral temperature >37.2°C (AM) or >37.7°C (PM)\n\nFever definitions vary by measurement site; rectal temperature is 37.5°C-38.3°C and axillary is >37.2°C."
    difficulty: easy
    tags: [fever, vital signs, pediatrics, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the temperature thresholds that define fever for oral (AM/PM), rectal, and axillary measurements?"
    back: "Oral: >37.2°C (AM) or >37.7°C (PM); Rectal: 37.5°C-38.3°C; Axillary: >37.2°C\n\nFever definition varies by measurement site and time of day. Rectal temperature is most accurate for children <2 years."
    difficulty: easy
    tags: [fever, vitals, pediatrics, measurement, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the definition of fever by temperature measurement site?"
    back: "Oral >37.2°C (AM) or >37.7°C (PM); Rectal 37.5°C-38.3°C; Axillary >37.2°C\n\nFever definition varies by measurement site and time of day. Rectal is gold standard for children <2 years."
    difficulty: easy
    tags: [fever, vital-signs, pediatrics, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the definition of fever by oral temperature?"
    back: "Oral temperature >37.2°C in the AM or >37.7°C in the PM\n\nFever is defined by specific temperature thresholds measured at different times of day, with higher thresholds for evening measurements."
