# General Surgery (Surgery) - generated from srs-mccqe1
cards:
  - front: "A 65-year-old man has a postoperative fever on day 5 after colon surgery. Using the timing of postoperative fever, what is the most likely cause?"
    back: "POD #3-7 fever is likely infectious: UTI, surgical site infection, IV line infection, septic thrombophlebitis, or leakage at bowel anastomosis (presents with tachycardia, hypotension, oliguria, abdominal pain).\n\nPostoperative fever timing helps identify cause: POD 1-2 is usually inflammatory/atelectasis; POD 3-7 is likely infectious; POD 8+ consider abscess, DVT/PE, drug fever, or C. difficile. Anastomotic leak is a critical diagnosis requiring urgent intervention."
    difficulty: medium
    tags: [general-surgery, postoperative-complications, fever, infectious-disease]
  - front: "What is the Charcot's triad and Reynolds' pentad, and what condition do they describe?"
    back: "Charcot's triad: fever, RUQ pain, jaundice - describes acute cholangitis. Reynolds' pentad: Charcot's triad + hypotension + altered mental status - indicates suppurative (toxic) cholangitis.\n\nAcute cholangitis results from CBD obstruction leading to biliary stasis and bacterial overgrowth. The most common cause is choledocholithiasis (60%). Common organisms: KEEPS (Klebsiella, Enterococcus, E. coli/Enterobacter, Proteus, Serratia). Emergency biliary decompression via ERCP is required."
    difficulty: easy
    tags: [general-surgery, gastroenterology, cholangitis, biliary]
  - front: "What is the Rigler's triad and what diagnosis does it suggest?"
    back: "Rigler's triad: pneumobilia (air in biliary tree), small bowel obstruction, and gallstone (usually in right iliac fossa). It suggests gallstone ileus.\n\nGallstone ileus occurs when repeated inflammation creates a cholecystoenteric fistula (usually duodenal), allowing a large gallstone to enter the GI tract and impact near the ileocecal valve, causing mechanical bowel obstruction. Treatment is surgical enterolithotomy."
    difficulty: medium
    tags: [general-surgery, gastroenterology, gallstone-ileus, bowel-obstruction]
  - front: "A 58-year-old woman presents with a new breast lump. Mammography shows a spiculated mass with microcalcifications. What is the most common type of invasive breast cancer and what are the key prognostic receptor markers?"
    back: "Invasive ductal carcinoma (80% of invasive breast cancers). Key prognostic markers: estrogen receptor (ER), progesterone receptor (PR), and HER2/neu status.\n\nInvasive ductal carcinoma presents as a hard, scirrhous mass with infiltrating tentacles. ER/PR positive tumors respond to hormonal therapy (tamoxifen). HER2 positive tumors respond to trastuzumab. Triple-negative (ER-/PR-/HER2-) has the worst prognosis."
    difficulty: medium
    tags: [general-surgery, oncology, breast-cancer]
  - front: "What BMI criteria are used for bariatric surgery candidacy, and what is the most common and effective procedure?"
    back: "BMI >=35 without illness OR BMI >30 with 1+ serious comorbidity (DM, CAD, OSA, GERD, severe joint disease). Most common and effective: laparoscopic Roux-en-Y gastric bypass (restrictive + malabsorptive).\n\nRoux-en-Y creates a small gastric pouch (restrictive) anastomosed with a Roux limb of small bowel (malabsorptive). Complications include dumping syndrome, marginal ulcers, cholelithiasis, and metabolic perturbations. Sleeve gastrectomy is an alternative restrictive option."
    difficulty: medium
    tags: [general-surgery, bariatric-surgery, obesity]
  - front: "How do you differentiate small bowel obstruction (SBO) from large bowel obstruction (LBO) on clinical presentation and abdominal X-ray?"
    back: "SBO: early bilious vomiting, colicky pain, less distention (proximal) or moderate (distal), ladder pattern on AXR with dilated loops >3 cm and no colonic gas. LBO: late feculent vomiting, more distention, picture frame appearance on AXR with proximal distention and distal decompression.\n\nSBO is most commonly caused by adhesions (prior surgery), hernias, and tumors. LBO is most commonly caused by colorectal cancer, volvulus, and diverticular disease. Paralytic ileus shows air throughout small bowel and colon with absent bowel sounds."
    difficulty: medium
    tags: [general-surgery, bowel-obstruction, radiology, emergency-medicine]
  - front: "A chronic anal fissure fails to respond to conservative management. What are the pharmacological and surgical treatment options?"
    back: "Pharmacological: topical nitroglycerin or calcium channel blocker (nifedipine/diltiazem) to increase local blood flow and relieve sphincter spasm. Surgical: lateral internal anal sphincterotomy (most effective, reserved for medically-refractory cases, 5% risk of fecal incontinence). Alternative: botulinum toxin A injection.\n\nChronic anal fissures present with the triad of fissure, sentinel skin tags, and hypertrophied papillae. 90% are posterior midline due to poor perfusion. The cycle of pain-sphincter spasm-ischemia-poor healing perpetuates chronicity."
    difficulty: medium
    tags: [general-surgery, anorectal-disease, pharmacology]
  - front: "What is the most common cause of postoperative pulmonary complications?"
    back: "Atelectasis, comprising 90% of postoperative pulmonary complications.\n\nAtelectasis is the most frequent pulmonary complication after surgery. Risk factors include COPD, smoking, obesity, elderly age, and upper abdominal/thoracic surgery. It typically presents as low-grade fever on POD #1."
    difficulty: easy
    tags: [general surgery, perioperative care, pulmonary complications]
  - front: "A patient develops fever on POD #5-8. What is the most likely diagnosis?"
    back: "Surgical site infection (SSI). Typical SSI presents with fever POD #5-8, localized pain, erythema, induration, purulent discharge, and warmth.\n\nSSIs typically manifest POD #5-8, although Streptococcus and Clostridium can present within 24 hours. The wound should be inspected, compressed, and swabbed for culture. Treatment involves reopening the wound and healing by secondary intention."
    difficulty: easy
    tags: [general surgery, surgical site infection, postoperative fever]
  - front: "What are the four classifications of surgical wound contamination and their approximate infection rates?"
    back: "Clean (2%), Clean-contaminated (3-4%), Contaminated (10%), Dirty/Infected (30-40%).\n\nClean wounds have no entry into hollow viscus. Clean-contaminated involves controlled entry into hollow viscus without spillage (e.g., routine cholecystectomy). Contaminated involves major wound contamination (e.g., bowel spillage). Dirty indicates established infection present before surgery."
    difficulty: easy
    tags: [general surgery, surgical site infection, wound classification]
  - front: "What is the most important initial sign of wound dehiscence?"
    back: "Serosanguinous (salmon-coloured) drainage from the wound, typically on POD #1-3 or #7-10.\n\nWound dehiscence is disruption of a primarily closed wound. The most common presentation is serosanguinous drainage. Evisceration (burst abdomen) is a surgical emergency requiring operative re-closure. A normal healing wound should have a palpable 'healing ridge.'"
    difficulty: medium
    tags: [general surgery, wound dehiscence, postoperative complications]
  - front: "What is the preferred preoperative antibiotic regimen for most surgeries?"
    back: "Cefazolin + metronidazole (or if beta-lactam allergy: clindamycin + gentamicin or vancomycin), given within 1 hour pre-incision.\n\nProphylactic antibiotics should be administered within 1 hour of incision and re-dosed every 1-2 half-lives in the OR. They are not required for low-risk clean surgery such as elective thyroidectomy or cholecystectomy. Postoperative antibiotics should be reserved for suspected or documented infection."
    difficulty: easy
    tags: [general surgery, perioperative care, antibiotic prophylaxis]
  - front: "A rapidly expanding neck hematoma after thyroid surgery compromises the airway. What is the most important immediate management?"
    back: "Protect the airway with intubation. Consider opening the wound emergently at bedside. A suture kit should be at bedside for all neck surgery patients.\n\nNeck hematomas are more clinically relevant in small working spaces like thyroid or breast surgery due to risk of airway edema and compression. A rapidly expanding neck hematoma is a surgical emergency where airway protection takes priority."
    difficulty: hard
    tags: [general surgery, thyroid surgery, surgical emergency]
  - front: "What are the systemic risk factors for wound dehiscence?"
    back: "Male sex, smoking, malnutrition (hypoalbuminemia, vitamin C deficiency), connective tissue diseases, immunosuppression, pulmonary disease, ascites, steroids, chemotherapy, obesity, age, sepsis, and uremia. DM alone is NOT a risk factor.\n\nBoth local and systemic factors contribute to wound dehiscence. Notably, diabetes mellitus alone is not a risk factor. The small bites suture technique is superior to large bites for preventing incisional hernia in midline incisions."
    difficulty: medium
    tags: [general surgery, wound healing, wound dehiscence]
  - front: "What is the timeline for return of GI motility after abdominal surgery?"
    back: "Gastric and small bowel motility returns by 24-48 hours; colonic motility returns by 3-5 days.\n\nParalytic ileus is a temporary, reversible impairment of intestinal motility most frequently caused by abdominal operations. If ileus persists beyond expected timeframes, investigate for electrolyte abnormalities, medications (especially opiates), and intra-abdominal pathology with CT."
    difficulty: easy
    tags: [general surgery, paralytic ileus, perioperative care]
  - front: "What is the hallmark clinical feature of early intestinal ischemia?"
    back: "Pain 'out of keeping' (out of proportion) to physical findings.\n\nIn acute mesenteric ischemia, patients present with severe abdominal pain but relatively benign physical exam findings early in the course. CT angiography is the gold standard for acute arterial ischemia. An acute abdomen with metabolic acidosis should raise suspicion for mesenteric ischemia."
    difficulty: medium
    tags: [general surgery, intestinal ischemia, acute abdomen]
  - front: "What are the top 3 causes of small bowel obstruction (SBO) in order?"
    back: "Adhesions (75%), Bulge (hernias), Cancer (neoplasms) — mnemonic ABC.\n\nPrior abdominal surgery causing adhesions is by far the most common cause. SBO presents with colicky periumbilical pain, N/V, obstipation, and abdominal distention. Inability to pass flatus is the most useful clinical indicator."
    difficulty: easy
    tags: [general surgery, small bowel obstruction, acute abdomen]
  - front: "When is immediate surgery indicated in small bowel obstruction?"
    back: "When there are signs of ischemia, necrosis, or perforation: fever, leukocytosis, tachycardia, worsening pain, metabolic/lactic acidosis, and tachypnea. Radiologic signs include free air, closed-loop obstruction, pneumatosis intestinalis, and portal venous gas.\n\nMost adhesive SBOs can be initially managed conservatively with NG tube decompression and IV fluid resuscitation. However, patients with a 'virgin abdomen' (no prior surgery) presenting with SBO should have surgery ASAP. Closed-loop obstruction also requires immediate exploration."
    difficulty: hard
    tags: [general surgery, small bowel obstruction, surgical emergency]
  - front: "What is the mortality associated with strangulating SBO versus non-strangulating SBO?"
    back: "Non-strangulating: <1% mortality. Strangulating: 8% (25% if >36 hours). Ischemic: up to 50%.\n\nThe prognosis of SBO is related to etiology. Open surgery has a four-fold increase in risk of SBO within 5 years compared to laparoscopic surgery. Surgical intervention is associated with lower risk of recurrence."
    difficulty: medium
    tags: [general surgery, small bowel obstruction, prognosis]
  - front: "What are the top 3 causes of large bowel obstruction (LBO)?"
    back: "Colon cancer (60%), Diverticulitis (10%), Volvulus.\n\nIn LBO, a competent ileocecal valve creates a closed-loop obstruction (80-90% of cases), which is dangerous because massive colonic distention leads to cecal wall ischemia, necrosis, and perforation. Impending perforation should be suspected when cecum diameter exceeds 12 cm."
    difficulty: easy
    tags: [general surgery, large bowel obstruction, acute abdomen]
  - front: "What differentiates paralytic ileus from mechanical bowel obstruction on physical examination?"
    back: "In paralytic ileus, bowel sounds are diminished or absent and pain is diffuse and non-colicky. In mechanical obstruction, bowel sounds are initially hyperactive with colicky pain.\n\nParalytic ileus involves temporary impairment of intestinal motility without mechanical obstruction. Most common causes are abdominal operations, infections, opiates, and electrolyte abnormalities. Passing gas is the most useful indicator of resolution."
    difficulty: easy
    tags: [general surgery, paralytic ileus, bowel obstruction]
  - front: "A 65-year-old presents with acute onset colicky abdominal pain, bloody diarrhea, and pain out of proportion to exam findings. What is the most likely diagnosis and gold standard investigation?"
    back: "Acute mesenteric ischemia. Gold standard investigation is CT angiography.\n\nAcute mesenteric ischemia can be caused by arterial occlusion (thrombotic or embolic), non-occlusive ischemia (from hypoperfusion), or mesenteric venous thrombosis. Common sites include SMA territory and 'watershed' areas of the colon (splenic flexure, left colon, sigmoid)."
    difficulty: hard
    tags: [general surgery, intestinal ischemia, acute abdomen]
  - front: "What is the classic presentation of appendicitis and why does the pain migrate?"
    back: "Pain initially periumbilical (visceral, poorly localized), then localizes to McBurney's point (RLQ). The migration occurs because disease progresses from visceral irritation (referred midgut pain) to parietal peritoneal irritation.\n\nThe most reliable feature of appendicitis is progression of signs and symptoms. Classic order is abdominal pain, then anorexia, then N/V. McBurney's point is located 1/3 the distance from ASIS to umbilicus on the right side."
    difficulty: easy
    tags: [general surgery, appendicitis, acute abdomen]
  - front: "What are the three signs of appendicitis and what anatomical positions do they correspond to?"
    back: "McBurney's sign (inferior appendix): RLQ tenderness. Psoas sign (retrocecal appendix): pain on hip flexion against resistance. Obturator sign (pelvic appendix): pain on flexion then internal rotation of hip.\n\nRovsing's sign (palpation of left abdomen causes McBurney's point tenderness) suggests peritoneal irritation. McBurney's sign is present whenever the appendiceal base is under McBurney's point, regardless of appendix tip position."
    difficulty: medium
    tags: [general surgery, appendicitis, physical examination]
  - front: "What is the optimal imaging for diagnosing appendicitis, and what is the role of antibiotics-only treatment?"
    back: "CT scan (94-100% accuracy) is optimal. US has 90-94% accuracy but cannot rule out appendicitis. Antibiotics alone have 80-90% success rate for non-perforated appendicitis without appendicolith, but 40-49% undergo appendectomy by 3-4 years.\n\nAppendectomy remains the gold standard treatment. For perforated appendicitis with abscess, consider radiologic drainage and antibiotics with interval appendectomy. MRI may be used in pregnancy if ultrasound is non-diagnostic."
    difficulty: medium
    tags: [general surgery, appendicitis, evidence-based medicine]
  - front: "What is the frequency and anatomical classification of abdominal hernias?"
    back: "50% indirect inguinal, 25% direct inguinal, 8-10% incisional, 5% femoral, 3-8% umbilical. Lifetime risk: males 20-25%, females 2%.\n\nIndirect inguinal hernias are the most common hernia in both men and women. They pass through the deep inguinal ring lateral to the inferior epigastric artery. Direct inguinal hernias pass through Hesselbach's triangle medial to the inferior epigastric artery."
    difficulty: easy
    tags: [general surgery, hernias, anatomy]
  - front: "What are the borders of Hesselbach's triangle and what hernia passes through it?"
    back: "Lateral: inferior epigastric artery. Inferior: inguinal ligament. Medial: lateral margin of rectus sheath. Direct inguinal hernias pass through Hesselbach's triangle.\n\nDirect inguinal hernias are medial to the inferior epigastric artery (mnemonic: MD = Medial = Direct). Indirect inguinal hernias are lateral to the inferior epigastric artery (LI = Lateral = Indirect). This distinction is important for surgical planning."
    difficulty: medium
    tags: [general surgery, hernias, anatomy]
  - front: "Which type of hernia has the highest risk of strangulation?"
    back: "Femoral > indirect inguinal > direct inguinal. Small, new hernias are more likely to strangulate.\n\nStrangulation is a surgical emergency where the vascular supply of protruded viscus is compromised. Do NOT attempt manual reduction if septic or if hernial sac contents are gangrenous, as this will introduce gangrenous contents intraperitoneally."
    difficulty: medium
    tags: [general surgery, hernias, surgical emergency]
  - front: "What is a Richter's hernia and why is it dangerous?"
    back: "Only part of the bowel circumference (usually antimesenteric border) is incarcerated, so the bowel may not be obstructed. A strangulated Richter's hernia may self-reduce and be overlooked, leaving a gangrenous segment at risk of perforation.\n\nRichter's hernia is dangerous because the absence of obstructive symptoms can lead to delayed diagnosis. Other special hernia types include Littre's (Meckel's diverticulum), Amyand's (appendix), and sliding hernia (retroperitoneal structure forms wall of sac)."
    difficulty: hard
    tags: [general surgery, hernias, Richter hernia]
  - front: "What distinguishes indirect from direct inguinal hernia based on anatomy and etiology?"
    back: "Indirect: congenital (patent processus vaginalis), lateral to inferior epigastric artery, originates at deep inguinal ring, often descends into scrotum. Direct: acquired (transversalis fascia weakness), medial to inferior epigastric artery, through Hesselbach's triangle, usually does not descend into scrotum.\n\nIndirect inguinal hernias are 5x more common than direct and have <1% recurrence rate versus 3-4% for direct. Indirect hernias are 5-10x more common in males than females and have 5% lifetime incidence in males."
    difficulty: medium
    tags: [general surgery, hernias, inguinal hernia]
  - front: "What is the Hinchey classification for diverticulitis and how does it guide treatment?"
    back: "Stage 1: Phlegmon/small pericolic abscess (medical). Stage 2: Large abscess/fistula (drainage + resection). Stage 3: Purulent peritonitis (resection or Hartmann). Stage 4: Feculent peritonitis (Hartmann procedure).\n\nMortality rates are 6% for purulent peritonitis and 35% for feculent peritonitis. For uncomplicated diverticulitis, antibiotics are no longer routinely recommended. Surgery is indicated for Hinchey 3-4 and for patients who are unstable with peritonitis."
    difficulty: medium
    tags: [general surgery, diverticulitis, Hinchey classification]
  - front: "What is the most common fistula complication of diverticulitis?"
    back: "Colovesical fistula (most common). Others include coloenteric, colovaginal, and colocutaneous fistulas.\n\nComplications of diverticulitis occur in 25% of cases and include abscess, fistula, colonic obstruction from strictures, and perforation. CT scan is the test of choice with 97% sensitivity and 99% specificity. Colonoscopy should be done after resolution of acute episode."
    difficulty: easy
    tags: [general surgery, diverticulitis, complications]
  - front: "What defines a Hartmann procedure and what are its indications?"
    back: "Colon resection + end colostomy with closure of rectal stump. Used for unstable patients with peritonitis, Hinchey stage 3-4 diverticulitis, and emergent situations where primary anastomosis is unsafe. Colostomy reversal in 3-6 months.\n\nFor more stable patients with Hinchey 3-4, colonic resection with primary anastomosis plus diverting loop ileostomy is becoming more common with benefits for mortality and morbidity compared to the traditional Hartmann procedure."
    difficulty: medium
    tags: [general surgery, diverticulitis, Hartmann procedure]
  - front: "What is the adenoma-carcinoma sequence in colorectal cancer?"
    back: "Adenomatous polyps are premalignant lesions that progress through dysplasia to invasive carcinoma. Malignant potential is: villous > tubulovillous > tubular. Risk increases with size >1 cm, villous histology, and multiple polyps.\n\nColorectal carcinomas rarely arise de novo. 30% of the population have polyps by age 50. Villous polyps are large (>2 cm), sessile, and have higher malignant potential. Tubular polyps are smaller (<2 cm), pedunculated, with lower malignant potential."
    difficulty: easy
    tags: [general surgery, colorectal cancer, polyps]
  - front: "What are the Amsterdam Criteria for diagnosing Lynch syndrome (HNPCC)?"
    back: "The '3-2-1 rule': 3+ relatives with Lynch-associated cancers (1 must be 1st-degree relative of other 2), 2+ generations involved, 1 case diagnosed before age 50, and FAP excluded.\n\nLynch syndrome is the most common inherited CRC susceptibility syndrome (3% of CRC). It is autosomal dominant with mutations in DNA mismatch repair genes (MSH2, MSH6, MLH1, PMS2). Lifetime CRC risk is 70-80%. Treatment is total colectomy with ileorectal anastomosis."
    difficulty: medium
    tags: [general surgery, colorectal cancer, Lynch syndrome]
  - front: "An elderly patient presents with iron-deficiency anemia. What malignancy must be investigated?"
    back: "Colon cancer (especially right-sided). Right colon cancers present with weight loss, weakness, dark blood mixed in stool, and iron-deficiency anemia.\n\nRight-sided colon cancers are often insidious, presenting with anemia and RLQ mass rather than obstruction. Left-sided cancers present with constipation, altered bowel habits, decreased stool calibre, and rectal bleeding. Rectal cancers cause obstruction, tenesmus, and rectal bleeding."
    difficulty: medium
    tags: [general surgery, colorectal cancer, anemia]
  - front: "What is Familial Adenomatous Polyposis (FAP) and when should surgery be performed?"
    back: "Autosomal dominant APC gene mutation causing hundreds to thousands of colorectal adenomas usually by age 20, with virtually 100% lifetime risk of colon cancer. Surgery indicated by ages 17-20.\n\nFAP accounts for <1% of colorectal cancers. Surgical options include total proctocolectomy with ileostomy or restorative proctocolectomy with ileal-pouch anal anastomosis. Variants include Gardner's syndrome (FAP + osteomas, desmoids) and Turcot syndrome (FAP + CNS tumours)."
    difficulty: medium
    tags: [general surgery, colorectal cancer, familial adenomatous polyposis]
  - front: "What are the internal hemorrhoid grades and their treatment?"
    back: "1st degree: bleeds, no prolapse → conservative + rubber band ligation. 2nd degree: prolapse with straining, spontaneous reduction → rubber band ligation. 3rd degree: prolapse requiring manual reduction → rubber band ligation or hemorrhoidectomy. 4th degree: permanently prolapsed → hemorrhoidectomy.\n\nInternal hemorrhoids arise from superior hemorrhoidal veins above the dentate line (portal circulation), usually at 3, 7, 11 o'clock positions in lithotomy. They cause painless bright red rectal bleeding. Always rule out colon cancer in patients >50 with rectal bleeding."
    difficulty: easy
    tags: [general surgery, hemorrhoids, anorectal disease]
  - front: "What is the most effective treatment for chronic anal fissure refractory to medical management?"
    back: "Lateral internal anal sphincterotomy (most effective treatment). It relieves sphincter spasm to increase blood flow and promote healing, but has a 5% chance of fecal incontinence.\n\nChronic anal fissures present with the triad of fissure, sentinel skin tags, and hypertrophied papillae. 90% are posterior midline due to poor perfusion. Medical treatment includes topical nitroglycerin or calcium channel blockers. Botulinum toxin is an alternative."
    difficulty: medium
    tags: [general surgery, anal fissure, anorectal disease]
  - front: "What is Goodsall's rule for anal fistulas?"
    back: "Fistulas with external openings anterior to a transverse line through the anus have a straight course and exit anteriorly. Those with posterior external openings have a curved tract and originate in the posterior midline.\n\nAnorectal fistulas develop in 50% of patients after I&D of perianal abscess. Treatment depends on the fistula's relationship to the sphincter: low fistulas are treated with fistulotomy, while high fistulas (involving external sphincter) require staged fistulotomy with seton placement."
    difficulty: medium
    tags: [general surgery, fistula-in-ano, anorectal disease]
  - front: "What is the most common cause of acute pancreatitis and what investigation strongly suggests gallstone etiology?"
    back: "Gallstones (45% of acute pancreatitis). ALT >150 U/L strongly suggests gallstone etiology.\n\nGallstone pancreatitis occurs from pancreatic duct obstruction causing autodigestion. The stone passes spontaneously in ~90% of cases. Cholecystectomy should be performed during the same admission as there is 25-60% recurrence if surgery is not done."
    difficulty: medium
    tags: [general surgery, pancreatitis, gallstone pancreatitis]
  - front: "What are Ranson's criteria for acute pancreatitis severity?"
    back: "At admission: Age >55, WBC >16, Glucose >11 mmol/L, LDH >350, AST >250. At 48h: Hct drop >10%, BUN rise >1.8 mmol/L, Ca <2 mmol/L, base deficit >4 mmol/L, fluid sequestration >6L, PaO2 <60 mmHg. Score ≥3 = severe pancreatitis.\n\nRanson's criteria help determine prognosis. A score <3 means severe pancreatitis is unlikely (2% mortality). A score of 3-5 indicates 15% mortality, and >5 indicates 40% mortality. APACHE II score is also used for severe acute pancreatitis prognosis."
    difficulty: medium
    tags: [general surgery, pancreatitis, Ranson criteria]
  - front: "When is ERCP urgently indicated in gallstone pancreatitis?"
    back: "When there is an impacted CBD stone or concomitant cholangitis.\n\nMost gallstones pass spontaneously (~90%). Cholecystectomy during the same admission is recommended to prevent recurrence. Antibiotics are not indicated for initial diagnosis of pancreatitis unless there are clear signs of infection on imaging."
    difficulty: medium
    tags: [general surgery, pancreatitis, ERCP]
  - front: "What is the Puestow procedure and when is it indicated?"
    back: "Lateral pancreaticojejunostomy (Puestow procedure) is a drainage procedure for chronic pancreatitis when the ductal system is dilated. It improves pain in 80% of patients.\n\nSurgical options for chronic pancreatitis depend on anatomy: drainage (Puestow) if dilated duct, Whipple for proximal disease, distal pancreatectomy for distal disease, and total pancreatectomy for refractory disease. The hallmark of chronic pancreatitis is recurrent abdominal pain."
    difficulty: hard
    tags: [general surgery, chronic pancreatitis, Puestow procedure]
  - front: "What is the presentation of pancreatic cancer and the most useful serum marker?"
    back: "Most common symptoms: abdominal pain, jaundice, and weight loss. CA 19-9 is the most useful serum marker. Vague abdominal pain with weight loss in a patient >50 is pancreatic cancer until proven otherwise.\n\nHead tumours (70%) present with jaundice, steatorrhea, and weight loss with Courvoisier's sign. Body/tail tumours (30%) present later and are usually unresectable (80%). Only 10-20% of pancreatic cancers are resectable. Overall 5-year survival is only 1%."
    difficulty: medium
    tags: [general surgery, pancreatic cancer, hepatobiliary]
  - front: "What is the Whipple procedure and what are its indications?"
    back: "Pancreaticoduodenectomy: resection of pancreatic head, duodenum, distal CBD, gallbladder, and distal stomach. Reconstruction involves pancreaticojejunostomy, hepaticojejunostomy, and gastrojejunostomy. Indicated for resectable pancreatic head cancer (<5% mortality).\n\nResectability requires no involvement of liver, peritoneum, or major vasculature (hepatic artery, SMA, SMV, portal vein, IVC, aorta) and no distant metastasis. Adjuvant chemotherapy (gemcitabine + capecitabine) is recommended. 5-year survival after resection is 20%."
    difficulty: hard
    tags: [general surgery, pancreatic cancer, Whipple procedure]
  - front: "What is the most common intra-abdominal organ injured in blunt trauma?"
    back: "The spleen. It can also occur in people with splenomegaly. Kehr's sign (left shoulder pain from diaphragmatic irritation) may be present.\n\nFAST ultrasound is used for hemodynamically unstable trauma patients. CT with contrast is used once stable. Treatment ranges from non-operative (bed rest, serial hematocrit, splenic artery embolization) to operative (splenorrhaphy or splenectomy for unstable patients)."
    difficulty: easy
    tags: [general surgery, trauma, splenic injury]
  - front: "What vaccinations are required after splenectomy and what is the most feared complication?"
    back: "Pneumococcal, H. influenzae, and meningococcal vaccines (ideally 2 weeks pre- or postoperative). The most feared complication is overwhelming post-splenectomy sepsis from encapsulated organisms (4% of splenectomized patients).\n\nPost-splenectomy sepsis risk is highest in patients <16 years. Liberal use of penicillin is recommended especially in children <6 years. Other complications include postoperative thrombocytosis, portal/mesenteric vein thrombosis, and increased risk of malignancy and DVT/PE."
    difficulty: medium
    tags: [general surgery, splenectomy, post-splenectomy sepsis]
  - front: "What is the triple test for diagnosis of a breast mass?"
    back: "1) Clinical breast exam, 2) Imaging (mammography + US if ≥30; US alone if <30 or pregnant/lactating), 3) Pathology (core needle biopsy is most common).\n\nUS-guided core needle biopsy is preferred over FNA or excisional biopsy for diagnosis. If all three components of the triple test are concordant and benign, the negative predictive value approaches 100%. Excisional biopsy should not be done for initial diagnosis if possible."
    difficulty: easy
    tags: [general surgery, breast cancer, diagnosis]
  - front: "What are the key differences between DCIS and LCIS?"
    back: "DCIS: proliferation within ducts, detected as mammographic microcalcifications, 35% risk of invasive cancer in same breast in 10 years, treated with excision + radiation. LCIS: contained within lobules, no mammographic findings, ~1%/year risk of invasive carcinoma in either breast, managed with surveillance.\n\nDCIS is treated surgically (lumpectomy + radiation or mastectomy for large/multifocal disease). LCIS is considered a risk factor rather than a precursor lesion. LCIS is often multicentric and bilateral, so wide excision is not needed. Both may benefit from tamoxifen."
    difficulty: medium
    tags: [general surgery, breast cancer, DCIS, LCIS]
  - front: "When is breast conservation surgery (BCS) contraindicated?"
    back: "Absolute contraindications: inflammatory breast cancer, extensive malignant calcifications/multifocal tumours, failure to obtain tumour-free margins after re-excision, and inability to receive radiation (pregnancy, prior radiation, collagen vascular disease).\n\nBCS plus radiation has equivalent survival to mastectomy for stage I-II disease. BCS can be offered to most women with stage I-II disease. There is no survival benefit of mastectomy over BCS plus radiation when local control is achieved."
    difficulty: medium
    tags: [general surgery, breast cancer, surgical treatment]
  - front: "What is a sentinel lymph node biopsy (SLNB) and when is axillary lymph node dissection (ALND) required?"
    back: "SLNB uses technetium-99 + blue dye to identify the first draining lymph node. Proceed to ALND if >3 positive sentinel nodes. With 1-3 positive nodes, whole breast radiation may be an alternative to ALND.\n\nSLNB is performed in clinically node-negative invasive breast cancer. It has a 5% false-negative rate. ALND carries risk of arm lymphedema (10-15%), especially with concurrent radiation. Studies show no survival benefit of ALND over SLNB alone in patients with 1-2 positive sentinel nodes."
    difficulty: medium
    tags: [general surgery, breast cancer, sentinel lymph node]
  - front: "What is the most common type of invasive breast cancer and what is the most aggressive form?"
    back: "Invasive ductal carcinoma is most common (80%). Inflammatory carcinoma (1-3%) is the most aggressive form — it invades dermal lymphatics causing erythema, peau d'orange, and swollen breast.\n\nInvasive lobular carcinoma (8-10%) is harder to detect on mammography due to lack of microcalcifications. Paget's disease of the breast involves nipple invasion with scaling and ulceration. Peau d'orange in inflammatory carcinoma automatically stages the cancer as IIIb-IV."
    difficulty: easy
    tags: [general surgery, breast cancer, pathology]
  - front: "What are the complications of thyroidectomy?"
    back: "Lobectomy: recurrent laryngeal nerve (RLN) palsy (hoarseness), neck hematoma. Total thyroidectomy: same plus hypoparathyroidism/hypocalcemia, bilateral RLN palsy (may require tracheostomy). 20-75% need thyroxine after lobectomy; 100% after total thyroidectomy.\n\nThe recurrent laryngeal nerve runs in the tracheoesophageal groove and is at risk during thyroid surgery. Bilateral RLN palsy can cause airway obstruction requiring tracheostomy. Hypocalcemia from inadvertent parathyroid removal is treated with calcium and vitamin D supplementation."
    difficulty: medium
    tags: [general surgery, thyroid surgery, complications]
  - front: "What is Whipple's triad and what does it diagnose?"
    back: "Whipple's triad: 1) Symptomatic fasting hypoglycemia, 2) Serum glucose <2.8 mmol/L, 3) Relief of symptoms when glucose is administered. It diagnoses insulinoma.\n\nInsulinoma is the most common pancreatic endocrine neoplasm (10% associated with MEN1). Lab findings include decreased serum glucose with increased insulin and C-peptide. Only 10% are malignant. Treatment is enucleation for solitary insulinomas."
    difficulty: medium
    tags: [general surgery, insulinoma, surgical endocrinology]
  - front: "What is Zollinger-Ellison syndrome and where are most gastrinomas located?"
    back: "Gastrin-secreting tumour causing severe PUD, multiple ulcers in atypical locations, and severe esophagitis. 70-90% found in Passaro's triangle (head of pancreas, 2nd portion of duodenum, cystic duct-CBD confluence). 50% are malignant.\n\nZollinger-Ellison syndrome is associated with MEN1. Serum gastrin levels are usually >1000 pg/mL. 90% develop peptic ulcers. Treatment includes surgical resection, high-dose PPI, and octreotide for non-surgical candidates."
    difficulty: medium
    tags: [general surgery, gastrinoma, Zollinger-Ellison syndrome]
  - front: "What are the indications for surgery in peptic ulcer disease?"
    back: "Hemorrhage (most common emergency indication), perforation, gastric outlet obstruction, refractory to medical management (8-12 weeks), and suspicion of malignancy.\n\nSurgery for PUD is increasingly rare due to H. pylori eradication and PPI therapy. For perforated duodenal ulcer, omental (Graham) patch is the most common treatment. Posterior duodenal ulcers tend to bleed (gastroduodenal artery), while anterior ulcers tend to perforate."
    difficulty: medium
    tags: [general surgery, peptic ulcer disease, surgical indications]
  - front: "What is the hallmark presentation of perforated duodenal ulcer on CXR?"
    back: "Free air under the diaphragm (seen in 70% of patients). Clinical features include sudden onset of pain (may track to RLQ via right paracolic gutter), acute abdomen with rigid diffuse guarding, and ileus.\n\nInitial chemical peritonitis is followed by bacterial peritonitis. Treatment is oversewing the ulcer (plication) with omental Graham patch. This is the most common treatment for perforated duodenal ulcer. H. pylori eradication should follow postoperatively."
    difficulty: medium
    tags: [general surgery, perforated ulcer, acute abdomen]
  - front: "What is dumping syndrome and how does early differ from late?"
    back: "Early (15-30 min): rapid emptying of hyperosmotic chyme → jejunal distention → cramping, bloating, emesis, vasomotor symptoms (dizziness, tachycardia, diaphoresis). Late (3 h): hypoglycemia from postprandial insulin peak.\n\nEarly dumping is treated with frequent small meals high in fibre/protein, low in carbohydrates, and avoiding liquids with meals. Late dumping is treated with a small snack 2 hours after meals. Dumping syndrome is a complication of gastric surgery and usually resolves within 1 year."
    difficulty: medium
    tags: [general surgery, dumping syndrome, gastric surgery complications]
  - front: "What is the most common benign liver tumour and how should it be managed?"
    back: "Cavernous hemangioma. Avoid biopsy (risk of hemorrhage). No treatment if asymptomatic. Surgical resection for symptomatic patients or those with large hemangiomas causing mass effect.\n\nOn CT, hemangiomas show peripheral enhancement on arterial phase with centripetal filling on delayed phases. On US, they appear as homogeneous hyperechoic masses. Those >10 cm are considered 'giant' and may cause consumptive coagulopathy in children."
    difficulty: easy
    tags: [general surgery, liver tumours, hemangioma]
  - front: "What are the criteria for tension pneumothorax and its immediate management?"
    back: "Contralateral tracheal deviation, hypotension/shock, diminished breath sounds, hyperresonance on the affected side. Immediate management: needle decompression followed by chest tube insertion.\n\nTension pneumothorax is a clinical diagnosis and a life-threatening emergency. Air enters the pleural space via a one-way valve mechanism, raising intrapleural pressure and causing cardiovascular collapse. Do not delay treatment for imaging."
    difficulty: medium
    tags: [general surgery, pneumothorax, trauma]
  - front: "What is the management of primary spontaneous pneumothorax?"
    back: "Stable, small (<3 cm), minimal symptoms: observation + O2. Symptomatic or large (>3 cm): aspiration or chest tube. Unstable/tension: needle decompression then chest tube, VATS bullectomy if unsuccessful (25-50% failure rate).\n\nPrimary spontaneous pneumothorax occurs without underlying lung disease, typically from rupture of apical subpleural blebs. Risk factors include smoking, male sex, family history, and Marfan's syndrome. Secondary pneumothorax occurs with underlying lung disease and generally requires more aggressive management."
    difficulty: medium
    tags: [general surgery, pneumothorax, thoracic surgery]
  - front: "What is the mnemonic for the differential of anterior mediastinal masses?"
    back: "The 4 Ts: Thymoma, Thyroid (goitre), Teratoma, Tumours (lymphoma, parathyroid, angiomatous).\n\nAnterior mediastinal masses are more likely malignant. 50% are asymptomatic (mainly benign); when symptomatic, 50% are malignant. If AFP, β-hCG, or LDH are elevated, no biopsy is needed as these are pathognomonic for germ cell tumour."
    difficulty: easy
    tags: [general surgery, mediastinal masses, thoracic surgery]
  - front: "What is the most common primary lung cancer subtype in nonsmokers and what is the screening recommendation?"
    back: "Adenocarcinoma (most common in nonsmokers, peripheral location). Screening: annual low-dose CT for high-risk patients aged 55-74 with ≥30 pack-year history who are current smokers or quit within 15 years.\n\nLung cancer is the most common cause of cancer mortality worldwide. NSCLC (85-90%) includes adenocarcinoma, SCC, and large cell. SCLC (10-15%) is central, strongly associated with smoking, and usually disseminated at presentation. FEV1 and DLCO must be ≥40% predicted to tolerate surgical resection."
    difficulty: medium
    tags: [general surgery, lung cancer, thoracic surgery]
  - front: "What paraneoplastic syndromes are associated with small cell lung cancer?"
    back: "Cushing's syndrome (ectopic ACTH), SIADH, and Lambert-Eaton myasthenic syndrome. SCLC is the most common lung cancer type associated with paraneoplastic syndromes.\n\nSCC is associated with hypercalcemia (PTHrP). Other paraneoplastic syndromes include HPOA/clubbing (NSCLC), Trousseau's syndrome (migratory thrombophlebitis in NSCLC), and carcinoid syndrome (bronchial carcinoid). These syndromes may precede the diagnosis of lung cancer."
    difficulty: medium
    tags: [general surgery, lung cancer, paraneoplastic syndromes]
  - front: "What is the management of esophageal perforation (Boerhaave's syndrome)?"
    back: "If contained and stable (Cameron's criteria): NPO, antibiotics, IV fluids, percutaneous drainage. If deteriorating or toxic: surgical repair. <24h: primary closure with muscle flap. >24h or non-viable esophagus: diversion and exclusion with delayed reconstruction.\n\nBoerhaave's syndrome is transmural esophageal perforation from forceful vomiting (versus Mallory-Weiss tear which is partial thickness). Diagnosis: CXR shows pneumomediastinum, Gastrografin swallow study first, then dilute barium. Mortality is 10-50% depending on timing."
    difficulty: hard
    tags: [general surgery, esophageal perforation, Boerhaave syndrome]
  - front: "What are the types of hiatus hernia and which is most common?"
    back: "Type I (sliding, 90%): GE junction herniates above diaphragm. Type II (paraesophageal, <10%): fundus herniates with GE junction in normal position. Type III (mixed): most common indication for surgical repair, combination of I and II. Type IV: other organs herniate (colon, spleen).\n\nSliding hernias are managed with lifestyle modifications and PPI. Paraesophageal and mixed hernias require surgical repair due to risk of incarceration, strangulation (gastric volvulus), and hemorrhage. Nissen fundoplication (360° wrap) is the most commonly performed anti-reflux procedure."
    difficulty: medium
    tags: [general surgery, hiatus hernia, foregut surgery]
  - front: "What is achalasia and what is the classic barium esophagram finding?"
    back: "Esophageal smooth muscle motility disorder where the lower esophageal sphincter fails to relax. Classic finding: smooth tapering of the lower esophagus to a 'bird's beak' appearance on barium esophagram.\n\nEsophageal manometry shows incomplete LES relaxation and absent peristalsis. Treatment options include pharmacologic (nitrates, CCBs), endoscopic botulinum toxin injection, pneumatic dilation, laparoscopic Heller myotomy, and peroral endoscopic myotomy (POEM)."
    difficulty: medium
    tags: [general surgery, achalasia, foregut surgery]
  - front: "What is the diagnostic criteria and management for Ogilvie's syndrome (acute colonic pseudo-obstruction)?"
    back: "Distention of colon without mechanical obstruction. CT shows cecal dilatation (≥12 cm = increased perforation risk). Treatment: if cecum <12 cm: treat underlying cause, NPO, NG tube. If cecum ≥12 cm: colonoscopic decompression or neostigmine.\n\nOgilvie's syndrome is most commonly associated with trauma, infection, and cardiac disease (MI, CHF). It is caused by autonomic motor dysregulation. Most cases resolve with conservative management. Surgery (extremely rare) is reserved for perforation, ischemia, or failure of conservative management."
    difficulty: medium
    tags: [general surgery, Ogilvie syndrome, colonic pseudo-obstruction]
  - front: "What are the diagnostic criteria for toxic megacolon?"
    back: "Radiologic evidence of dilated colon >6 cm PLUS 3 of: fever, HR >120, WBC >10.5, anemia PLUS 1 of: dehydration, electrolyte disturbances, hypotension, or altered LOC.\n\nToxic megacolon is caused by IBD (UC > Crohn's) or infectious colitis (C. difficile, Salmonella). Sudden improvement of diarrhea may signify onset of megacolon. Triggers include hypokalemia, opioids, and anticholinergics. Treatment includes NPO, antibiotics, and surgery if no improvement in 48-72 hours. Mortality is 25-30%."
    difficulty: hard
    tags: [general surgery, toxic megacolon, surgical emergency]
  - front: "What is the classic radiographic sign of sigmoid volvulus?"
    back: "The 'coffee bean' sign on AXR with the central cleft pointing to the LLQ. Barium enema shows 'ace of spades' or 'bird's beak' appearance.\n\nSigmoid volvulus accounts for 65% of all volvulus cases. It is most common in elderly patients >70 years. Initial treatment is endoscopic decompression with rigid/flexible sigmoidoscopy and rectal tube. Elective surgery is recommended due to 50-70% recurrence. For cecal volvulus, the central cleft points to RLQ."
    difficulty: medium
    tags: [general surgery, volvulus, large bowel obstruction]
  - front: "What is the surgical management of ulcerative colitis and what is the operation of choice?"
    back: "Restorative proctocolectomy with ileal pouch-anal anastomosis (IPAA) + rectal mucosectomy is the operation of choice. In emergency: total colectomy + ileostomy with Hartmann closure of rectum.\n\nIndications for surgery in UC include failure of medical management, hemorrhage, perforation, toxic megacolon, fulminant colitis, and cancer risk reduction (1-2%/year after 10 years of disease). Total proctocolectomy eliminates cancer risk. Perforation is the leading cause of death from UC."
    difficulty: medium
    tags: [general surgery, ulcerative colitis, IBD]
  - front: "How does Crohn's disease surgical management differ from ulcerative colitis?"
    back: "Crohn's surgery is NOT curative (only symptomatic relief). ~70% of patients require surgery. Resection margins only need to be free of gross disease (microscopic disease is irrelevant). Stricturoplasty is used to avoid excessive bowel resection.\n\nThe most common surgical indication in Crohn's is SBO due to stricture (50% of cases). Stricturoplasty widens the lumen in scarred bowel without resection. It is contraindicated in acute inflammation. 10-year recurrence rates are 25-50% for ileocolic disease."
    difficulty: medium
    tags: [general surgery, Crohn disease, IBD]
  - front: "What is the most common postoperative day for PE and what is the prophylaxis?"
    back: "Most commonly POD #8-10, but can occur anytime postoperatively. Prophylaxis: subcutaneous heparin or LMWH, compression stockings, and sequential compression devices.\n\nPE presents with sudden onset dyspnea, pleuritic chest pain, tachycardia, and unilateral leg swelling/pain (DVT source). Diagnosis is by CT chest. Treatment is IV heparin or LMWH bridging to therapeutic anticoagulation for minimum 3-6 months. Greenfield (IVC) filter if anticoagulation is contraindicated."
    difficulty: easy
    tags: [general surgery, pulmonary embolism, perioperative care]
  - front: "When does postoperative MI most commonly occur and how does it present?"
    back: "Most commonly on day of operation or POD #3-4 (when third-space fluid shifts back to intravascular compartment). Often SILENT without chest pain — may present only with new-onset CHF, arrhythmias, or hypotension.\n\nRisk is highest in patients with MI within 6 months (but risk never returns to baseline). Incidence is 0.5% in previously asymptomatic men >50, with a 40-fold increase in those with previous MI. Intraoperative hypotension and operations >3 hours increase risk."
    difficulty: medium
    tags: [general surgery, myocardial infarction, postoperative complications]
  - front: "What is the timing and presentation of intra-abdominal abscess after surgery?"
    back: "Manifests at least 5-7 days after surgery (takes time to form collection). Presents with persistent spiking fever, dull pain, weight loss, and leukocytosis. Common sites include pelvis, Morrison's pouch, subphrenic space, and paracolic gutters.\n\nDiagnosis is by CT with IV and water-soluble contrast. Treatment is drain placement by interventional radiology (preferred), laparoscopy, or open drainage, followed by antibiotics (ceftriaxone + metronidazole or piperacillin-tazobactam)."
    difficulty: medium
    tags: [general surgery, intra-abdominal abscess, postoperative complications]
  - front: "What are the indications for bariatric surgery?"
    back: "BMI ≥35 without comorbidities OR BMI ≥30 with 1+ serious comorbidity (DM, CAD, sleep apnea, GERD, severe joint disease). For Asian patients: lower BMI threshold by 2.5 due to higher prevalence of truncal obesity.\n\nRoux-en-Y gastric bypass is the most common and most effective procedure but has higher complication rates. Sleeve gastrectomy is a restrictive procedure. Complications include anastomotic leak (tachycardia may be the only sign in morbidly obese patients), dumping syndrome, and nutritional deficiencies."
    difficulty: easy
    tags: [general surgery, bariatric surgery, obesity]
  - front: "What are the classic signs of gallbladder carcinoma?"
    back: "Non-specific RUQ pain, palpable RUQ mass, Courvoisier's sign (enlarged gallbladder + painless jaundice), jaundice (50%), anorexia, weight loss. Most are adenocarcinomas. May be incidental finding on cholecystectomy (~1% open, 0.1% laparoscopic).\n\nRisk factors include chronic symptomatic gallstones (70%), gallbladder polyps, porcelain gallbladder, and primary sclerosing cholangitis. Prognosis is poor (20% 5-year survival) due to late detection. If suspected preoperatively, open cholecystectomy should be considered to avoid tumour seeding."
    difficulty: medium
    tags: [general surgery, gallbladder carcinoma, hepatobiliary]
  - front: "What is a Klatskin tumour?"
    back: "A cholangiocarcinoma located at the bifurcation of the common hepatic duct. Treatment for upper third bile duct lesions is duct resection + Roux-en-Y hepaticojejunostomy ± liver resection.\n\nCholangiocarcinoma is a malignancy of bile duct epithelial cells. Risk factors include PSC, choledochal cyst, Clonorchis sinensis infection, and chronic intrahepatic stones. LFTs show an obstructive picture. CA 19-9 and CEA may be elevated. Overall 5-year survival is 30% for localized disease."
    difficulty: hard
    tags: [general surgery, cholangiocarcinoma, Klatskin tumour]
  - front: "What are the mnemonic signs of metastatic gastric carcinoma?"
    back: "Virchow's node: left supraclavicular node. Blumer's shelf: mass in pouch of Douglas. Krukenberg tumour: metastases to ovary. Sister Mary Joseph node: umbilical nodule. Irish's node: left axillary nodes.\n\nGastric carcinoma is the 5th most common cancer worldwide with M:F = 3:2. Risk factors include H. pylori, pernicious anemia, previous partial gastrectomy, salt-preserved foods, smoking, and blood type A. An ulcer that fails to heal or a lesion on the greater curvature should raise suspicion."
    difficulty: medium
    tags: [general surgery, gastric cancer, metastatic signs]
  - front: "What is the presentation and management of hypertrophic pyloric stenosis in infants?"
    back: "Presents at 1-8 weeks (most commonly 6-8 weeks) with projectile non-bilious vomiting 30-60 min after feeds. Baby is hungry after vomiting. Palpable 'olive' mass in RUQ. Labs show hypochloremic, hypokalemic metabolic alkalosis. Treatment: correct electrolytes first, then pyloromyotomy.\n\nM:F = 4:1. US confirms diagnosis showing pyloric length >17 mm and muscle thickness >4 mm. Paradoxical aciduria occurs because kidneys exchange H+ for K+ to conserve potassium. The Ramstedt pyloromyotomy is curative and can be performed open or laparoscopically."
    difficulty: medium
    tags: [general surgery, pyloric stenosis, pediatric surgery]
  - front: "What is the mnemonic for why fistulae stay open (FRIENDO)?"
    back: "Foreign body, Radiation, Infection/IBD, Epithelialization, Neoplasm, Distal obstruction, Other (steroids inhibit closure).\n\nA fistula is an abnormal communication between two epithelialized surfaces. For high-output fistulas, the patient may need to be NPO with long-term TPN. Treatment includes decreasing secretion with octreotide and surgical intervention for non-closing fistulas."
    difficulty: easy
    tags: [general surgery, fistula, wound healing]
  - front: "What distinguishes carcinoid syndrome from a non-functional carcinoid tumour?"
    back: "Carcinoid syndrome (<10% of carcinoids) requires liver metastasis so that serotonin/vasoactive peptides bypass hepatic inactivation and enter systemic circulation. Symptoms: flushing, diarrhea, bronchoconstriction, and right-sided heart failure.\n\nCarcinoid tumours originate from enterochromaffin cells. Most are in the appendix (46%) and distal ileum (28%). Diagnosis includes elevated urinary 5-HIAA (serotonin metabolite) and serum chromogranin A. Treatment is surgical resection; octreotide for carcinoid syndrome."
    difficulty: hard
    tags: [general surgery, carcinoid syndrome, small bowel tumours]
  - front: "What is the hallmark presentation of malrotation with midgut volvulus in a neonate?"
    back: "Bilious emesis in a neonate is midgut volvulus until proven otherwise. The cardinal sign is bilious vomiting, especially with a non-distended abdomen. Requires EMERGENT laparotomy.\n\nMalrotation results from failure of gut rotation around the SMA. The Ladd procedure involves counterclockwise reduction of volvulus, division of Ladd's bands, broadening of the mesentery, and appendectomy. Upper GI series shows the duodenojejunal junction right of midline. Mortality with extensive necrosis is 65%."
    difficulty: hard
    tags: [general surgery, malrotation, pediatric surgery]
  - front: "What is the most common cause of intussusception and its classic presentation?"
    back: "Most common cause of bowel obstruction in ages 6-36 months. Usually idiopathic, starting at ileocecal junction. Classic triad: episodic colicky abdominal pain, vomiting, and 'currant-jelly' stool (mucosal necrosis/sloughing). A sausage-shaped abdominal mass may be palpable.\n\nNon-operative management with air contrast enema is first-line for reduction. Operative reduction is needed if there is failure to reduce, peritonitis, or compromised bowel. There is a 10% recurrence rate. Pathologic lead points (polyps, Meckel's, lymphoma) should be considered if recurrent."
    difficulty: medium
    tags: [general surgery, intussusception, pediatric surgery]
  - front: "What are the indications for surgical management of gastric ulcers?"
    back: "- Treat complications: bleeding (most common emergency indication), perforation, obstruction\n- Refractory to medical management (generally after 8–12 weeks of therapy)\n- Suspicion of malignancy (even if biopsy benign), especially if ulcer fails to heal after 12 weeks\nNote: Surgery increasingly rare due to H. pylori eradication, PPIs, and endoscopic therapies\n\nUnlike duodenal ulcers, gastric ulcers have a higher risk of malignancy (3× greater risk of obstruction compared to duodenal ulcers). Any gastric ulcer that fails to heal after 12 weeks of medical therapy warrants surgical resection even with a benign biopsy."
    difficulty: medium
    tags: [general surgery, peptic ulcer disease, gastric ulcer, indications for surgery]
  - front: "What surgical procedures are used for gastric and duodenal ulcers?"
    back: "Gastric ulcers:\n- Ligation of bleeding vessels\n- Distal gastrectomy with ulcer excision: Billroth II, Roux-en-Y gastrojejunostomy, or Billroth I\n- Vagotomy and pyloroplasty only if acid hypersecretion (very rare)\n- Wedge resection if possible\n\nDuodenal ulcers:\n- Omental (Graham) patch: plication of perforated ulcer + omental patch\n- Oversewing of bleeding ulcer + pyloroplasty\n- Post-op H. pylori eradication protocol\n\nThe Graham patch is the most common emergency procedure for perforated duodenal ulcer. Post-operative H. pylori eradication is essential to prevent recurrence. Billroth II and Roux-en-Y are preferred over Billroth I for gastric ulcers due to lower tension."
    difficulty: medium
    tags: [general surgery, peptic ulcer disease, duodenal ulcer, Graham patch, Billroth]
  - front: "What are the complications of duodenal ulceration, their presentations, and management?"
    back: "Perforation (anterior surface): Sudden-onset pain (may track to RLQ), acute abdomen, CXR showing free air under diaphragm → oversew ulcer (Graham patch)\n\nPenetration (into pancreas/liver): Elevated amylase/lipase, elevated LFTs, constant mid-epigastric pain radiating to back\n\nHemorrhage (posterior surface — gastroduodenal artery): Resuscitation, endoscopy (laser/cautery/injection), IR angiography with embolization, surgery if refractory\n\nGastric outlet obstruction: Non-bilious vomiting, succussion splash, dilated stomach → NG decompression, correct hypochloremic hypokalemic metabolic alkalosis, then surgical resection\n\nPosterior duodenal ulcers erode into the gastroduodenal artery causing hemorrhage; anterior ulcers perforate into the peritoneum. Gastric outlet obstruction causes hypochloremic hypokalemic metabolic alkalosis from loss of HCl with vomiting."
    difficulty: hard
    tags: [general surgery, duodenal ulcer, perforation, hemorrhage, gastric outlet obstruction]
  - front: "What is the 'succussion splash' and what does it indicate?"
    back: "A splashing noise heard with a stethoscope over the stomach when the patient is shaken, indicating fluid and gas movement in an obstructed organ (classically gastric outlet obstruction).\n\nThe succussion splash is elicited by rocking the patient side-to-side while auscultating the upper abdomen. It indicates retained gastric contents >3 hours after a meal, consistent with gastric outlet obstruction from pyloric stenosis, cancer, or duodenal ulcer."
    difficulty: easy
    tags: [general surgery, gastric outlet obstruction, physical examination, succussion splash]
  - front: "What are the risk factors for gastric carcinoma?"
    back: "Inflammation/atrophy (compensatory proliferation):\n- H. pylori → chronic atrophic gastritis\n- Pernicious anemia (achlorhydria + atrophic gastritis)\n- Previous partial gastrectomy (>10 yr)\n\nLifestyle/Environmental:\n- Salt and salt-preserved foods\n- Obesity, cigarette smoking\n- EBV infection, abdominal radiation\n\nHost/Genetic:\n- Blood type A (associated with pernicious anemia)\n- HNPCC, hereditary diffuse gastric carcinoma (HDGC)\n- Gastric adenomatous polyps, hypertrophic gastropathy\n- E-cadherin (CDH1) gene mutations\n\nH. pylori is the most modifiable risk factor; eradication significantly reduces gastric cancer risk. CDH1 mutations cause hereditary diffuse gastric cancer (signet ring cell type) and warrant prophylactic gastrectomy. Blood type A is a classic association."
    difficulty: medium
    tags: [general surgery, gastric carcinoma, H. pylori, CDH1, risk factors]
  - front: "What are the signs of metastatic gastric carcinoma and what do they indicate?"
    back: "- Virchow's node: left supraclavicular lymph node metastasis\n- Blumer's shelf: rectal shelf mass (metastasis in pouch of Douglas palpated on rectal exam)\n- Krukenberg tumour: ovarian metastases (bilateral)\n- Sister Mary Joseph nodule: umbilical metastasis\n- Irish's node: left axillary lymph node metastasis\n\nThese eponymous signs indicate peritoneal or distant metastatic spread of gastric (or other GI) cancer. Virchow's node is the most commonly tested. All are late signs indicating advanced/stage IV disease with poor prognosis."
    difficulty: easy
    tags: [general surgery, gastric carcinoma, metastasis, Virchow node, Krukenberg tumour]
  - front: "What is the treatment for gastric adenocarcinoma based on tumour location?"
    back: "Proximal lesions: Total gastrectomy + Roux-en-Y esophagojejunostomy\nDistal lesions: Subtotal gastrectomy with wide margins, en bloc removal of omentum and lymph nodes (D2 lymphadenectomy) + Roux-en-Y or Billroth II reconstruction\nAdjuvant: Perioperative chemotherapy OR postoperative chemoradiotherapy (standard of care for curative intent)\nPalliation: Limited gastric resection or endoscopic stenting, radiation, palliative chemotherapy\n\nD2 lymphadenectomy (dissection of regional and second-tier nodes) is associated with better disease-specific survival than D1 but higher post-operative mortality. Perioperative chemotherapy (e.g., FLOT regimen) improves survival in locally advanced disease."
    difficulty: hard
    tags: [general surgery, gastric carcinoma, gastrectomy, D2 lymphadenectomy, treatment]
  - front: "What is the TNM staging and 5-year survival for gastric carcinoma?"
    back: "T staging: Tis (in situ), T1a (lamina propria/muscularis mucosae), T1b (submucosa), T2 (muscularis propria), T3 (subserosal connective tissue), T4a (serosa), T4b (adjacent structures)\nN staging: N0 (none), N1 (1-2 nodes), N2 (3-6 nodes), N3a (7-15 nodes), N3b (≥16 nodes)\nM: M0 (none), M1 (distant)\n5-year survival: T1N0M0 ~94%, T2N0M0 ~82%, T3N0M0 ~58%, T4aN0M0 ~35%, T4bNxMx/T4aN3M0 ~0%\n\nGastric carcinoma typically presents at advanced stages in Western countries, explaining the overall poor prognosis. Early gastric cancer (confined to mucosa/submucosa) has excellent survival (>90% 5-year survival in Japan where screening is routine)."
    difficulty: hard
    tags: [general surgery, gastric carcinoma, TNM staging, prognosis]
  - front: "What is a gastrointestinal stromal tumour (GIST), and what is its cell of origin?"
    back: "GIST is the most common mesenchymal neoplasm of the GI tract. Derived from interstitial cells of Cajal (pacemaker cells of the GI tract associated with Auerbach's plexus that coordinate peristalsis). 75–80% have tyrosine kinase (c-KIT) mutations. Most common in stomach (50%) and proximal small intestine (25%).\n\nThe c-KIT mutation (CD117+) is the molecular hallmark of GIST and the target of imatinib (Gleevec). Interstitial cells of Cajal serve as the 'pacemakers' of GI motility — their neoplastic transformation leads to submucosal tumours."
    difficulty: medium
    tags: [general surgery, GIST, c-KIT, imatinib, mesenchymal tumour]
  - front: "What are the syndromes associated with GIST?"
    back: "- Carney triad: Gastric GIST + extra-adrenal paraganglioma + pulmonary chondroma\n- Type I neurofibromatosis (NF-1): multiple GISTs\n- Carney-Stratakis syndrome: GIST + paraganglioma (hereditary, germline SDH mutation)\n\nMost GISTs are sporadic. Carney triad is a non-hereditary association, while Carney-Stratakis syndrome is hereditary. Recognition of these syndromes prompts genetic counselling and screening of family members."
    difficulty: medium
    tags: [general surgery, GIST, Carney triad, neurofibromatosis, syndromes]
  - front: "What is the treatment approach for GIST based on size and stage?"
    back: "Gastric GIST <2 cm: Serial endoscopy (follow); resect if growing or symptomatic\nLocalized GIST >2 cm: Surgical resection with intact pseudocapsule (lymphadenectomy NOT required — GISTs rarely spread to lymph nodes); consider adjuvant imatinib (Gleevec) if high-risk (large >4 cm with significant mitotic activity)\nAdvanced disease (liver/peritoneal metastases): Palliative imatinib; metastasectomy considered for liver-limited disease\n\nGISTs are uniquely amenable to targeted therapy with imatinib (c-KIT inhibitor). Unlike adenocarcinoma, lymph node dissection is not required as nodal metastases are rare. High-risk features (size >10 cm, >5 mitoses/50 HPF) predict metastatic potential."
    difficulty: medium
    tags: [general surgery, GIST, imatinib, surgery, treatment]
  - front: "What prognostic factors predict metastatic potential in GIST?"
    back: "- Tumour size (worse if >10 cm)\n- Mitotic activity (worse if >5 mitotic figures/50 HPF)\n- Degree of nuclear pleomorphism\n- Location: extra-gastric location has higher risk of progression than gastric GISTs of identical size\nMost common metastatic sites: Liver and omentum; nodal and lung metastases are rare\n\nThese factors are used to stratify GIST into low, intermediate, and high-risk categories to guide adjuvant imatinib therapy. Gastric location is a favourable prognostic factor compared to small bowel GISTs."
    difficulty: medium
    tags: [general surgery, GIST, prognosis, mitotic index]
  - front: "What are the indications and BMI thresholds for bariatric surgery in Canada?"
    back: "- BMI ≥35 kg/m² without illness\n- BMI ≥30 kg/m² with ≥1 serious comorbidity (DM, CAD, sleep apnea, GERD, severe joint disease)\n- Asian patients: lower BMI threshold by 2.5 (BMI ≥32.5 without illness, or BMI ≥27.5 with comorbidity) due to higher truncal obesity prevalence\nRequires multidisciplinary bariatric team consultation: nutrition, psychological, lifestyle modification, lifelong surveillance\n\nLower BMI thresholds for Asian patients reflect greater metabolic risk at lower BMI due to higher visceral fat and truncal obesity. Multidisciplinary assessment is mandatory in Canadian bariatric programs to optimize post-operative success."
    difficulty: easy
    tags: [general surgery, bariatric surgery, obesity, BMI, indications]
  - front: "Compare the three main types of bariatric surgical procedures."
    back: "1. Roux-en-Y gastric bypass (combination, most common, most effective):\n- Small gastric pouch (restrictive) anastomosed to Roux limb of small bowel (malabsorptive)\n- Biliopancreatic limb maintains digestive enzymes and bile\n- Complications: gastric remnant distention, stomal stenosis, marginal ulcers, cholelithiasis, dumping syndrome, short bowel syndrome\n\n2. Sleeve gastrectomy (restrictive):\n- Tubular stomach via removal of majority of greater curvature\n- Complications: bleeding from gastric/short gastric vessels, stenosis at GE junction, gastric leaks\n\n3. Biliopancreatic diversion with duodenal switch (malabsorptive, rescue operation):\n- Stomach anastomosed to distal ileum; biliopancreatic limb to terminal ileum\n- Complications: protein-calorie malnutrition, anemia, metabolic bone disease, fat-soluble vitamin deficiency\n\nRoux-en-Y gastric bypass achieves significantly greater weight loss than adjustable gastric banding and has higher diabetes remission rates. Sleeve gastrectomy has a simpler technique with lower complication rates. Biliopancreatic diversion is most effective for weight loss but carries highest nutritional risk."
    difficulty: medium
    tags: [general surgery, bariatric surgery, Roux-en-Y, sleeve gastrectomy, complications]
  - front: "What are the complications of gastric surgery, including dumping syndrome and afferent loop syndrome?"
    back: "Early complications:\n- Alkaline reflux gastritis: duodenal contents reflux into stomach (treat with H2-blocker, metoclopramide, cholestyramine; surgery: convert to Roux-en-Y)\n- Afferent loop syndrome: bile/pancreatic secretion obstruction in afferent limb → early postprandial RUQ pain, nausea, bilious vomiting, anemia (treat: convert to Roux-en-Y)\n- Fistula (gastrocolic/gastrojejunal)\n- Retained antrum\n\nLate complications:\n- Dumping syndrome\n- Postvagotomy diarrhea\n- Metabolic perturbations (bariatric)\n\nAfferent loop syndrome occurs after Billroth II and is caused by intermittent mechanical obstruction of the afferent limb. Relief occurs with bilious vomiting as loop decompresses. Conversion to Roux-en-Y eliminates the afferent limb problem."
    difficulty: medium
    tags: [general surgery, gastric surgery complications, afferent loop syndrome, alkaline reflux gastritis, dumping syndrome]
