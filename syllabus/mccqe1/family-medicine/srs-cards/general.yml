  - front: "A patient has one first-degree relative with colorectal cancer diagnosed at age 55. At what age should colorectal cancer screening begin?"
    back: "Age 50, or 10 years earlier than the relative's diagnosis age (whichever occurs first)\n\nFor patients with one or more first-degree relatives with CRC, colonoscopy should begin at age 50 or 10 years before the relative's diagnosis age."
