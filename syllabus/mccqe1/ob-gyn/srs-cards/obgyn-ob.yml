  - front: "A 28-year-old pregnant woman at 20 weeks presents with BV. She has no symptoms. Should she be treated?"
    back: "Yes, treat with metronidazole 500 mg PO BID x 7 days - high-risk pregnancy warrants treatment despite being asymptomatic\n\nBV in pregnancy is associated with preterm delivery. High-risk pregnancy is an indication for treatment even in asymptomatic patients."
    difficulty: hard
    tags: [gynecology, infections, BV, pregnancy, clinical-decision, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
