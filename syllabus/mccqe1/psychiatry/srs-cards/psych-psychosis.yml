# Psychosis & Schizophrenia (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "A 22-year-old man has 6 months of auditory hallucinations (voices commenting on his actions), persecutory delusions, disorganized speech, and social withdrawal. He has no substance use or medical cause. Diagnosis?"
    back: "Schizophrenia (DSM-5: ≥2 characteristic symptoms for ≥1 month, with continuous disturbance for ≥6 months including prodrome); distinguish from schizophreniform (<6 months) and brief psychotic disorder (<1 month)\n\nCANMAT Schizophrenia Guidelines: schizophrenia is a chronic disorder affecting 1% of the population. Early psychosis intervention (EPI) programs improve outcomes. Antipsychotic medication is the cornerstone of treatment. Psychosocial interventions (CBT, supported employment, family therapy) are essential adjuncts."
    difficulty: hard
    tags: [schizophrenia, psychosis, DSM-5 criteria, hallucinations, psychiatry]
  - front: "What are positive vs. negative symptoms of schizophrenia?"
    back: "Positive (excess): hallucinations, delusions, disorganized speech/behavior, catatonia; Negative (deficit): avolition, alogia, anhedonia, affective flattening, asociality — negative symptoms respond less to antipsychotics and predict functional disability\n\nCANMAT guidelines: negative symptoms are associated with poor functional outcome and quality of life. Antipsychotics primarily improve positive symptoms. Paliperidone, amisulpride, and clozapine have modest benefits for negative symptoms. Depression must be differentiated from negative symptoms."
    difficulty: easy
    tags: [positive symptoms, negative symptoms, schizophrenia, antipsychotics, psychiatry]
  - front: "What is the first-line pharmacological treatment for a first episode of psychosis?"
    back: "Second-generation antipsychotic (SGA) at the lowest effective dose: olanzapine, risperidone, quetiapine, aripiprazole — start low, go slow; avoid FGA (first-generation) as first-line due to EPS risk\n\nCANMAT guidelines: SGAs are preferred for first episode psychosis (lower EPS/tardive dyskinesia risk). Clozapine is reserved for treatment-resistant schizophrenia (failed ≥2 adequate antipsychotic trials). Long-acting injectable (LAI) antipsychotics improve adherence — consider early."
    difficulty: medium
    tags: [antipsychotics, first episode psychosis, SGA, olanzapine, psychiatry]
  - front: "What is clozapine and when is it indicated?"
    back: "Clozapine: most effective antipsychotic; indicated for treatment-resistant schizophrenia (failed ≥2 antipsychotics including ≥1 SGA at adequate doses/duration); must monitor ANC (absolute neutrophil count) weekly x26 weeks due to agranulocytosis risk\n\nCANMAT guidelines: clozapine is the only antipsychotic proven effective for treatment-resistant schizophrenia (30% of cases). Risk of agranulocytosis: 0.8% (fatal in 0.1%). Other serious side effects: seizures (dose-related), myocarditis, metabolic syndrome. REMS (Risk Evaluation and Mitigation Strategy) program required."
    difficulty: hard
    tags: [clozapine, treatment-resistant schizophrenia, agranulocytosis, ANC monitoring, psychiatry]
  - front: "What are the extrapyramidal side effects (EPS) of antipsychotics and how are they treated?"
    back: "Acute dystonia (hours-days): diphenhydramine or benztropine IM; Akathisia (inner restlessness): beta-blockers (propranolol), benzodiazepines; Parkinsonism: reduce dose or switch to SGA; Tardive dyskinesia (months-years): switch to clozapine, valbenazine\n\nCANMAT guidelines: EPS are more common with FGAs (haloperidol) than SGAs. Tardive dyskinesia is the most serious irreversible EPS — characterized by repetitive involuntary movements (orofacial, limb). AIMS (Abnormal Involuntary Movement Scale) monitoring required."
    difficulty: medium
    tags: [extrapyramidal side effects, EPS, dystonia, tardive dyskinesia, akathisia, psychiatry]
  - front: "What is neuroleptic malignant syndrome (NMS) and how is it treated?"
    back: "NMS: rare, life-threatening reaction to antipsychotics — hyperthermia, severe muscle rigidity (lead pipe), autonomic instability (tachycardia, BP changes), altered consciousness; treat by stopping antipsychotic, cooling, IV dantrolene or bromocriptine, ICU supportive care\n\nNMS occurs with FGAs > SGAs. Risk factors: rapid dose escalation, dehydration, agitation, high potency antipsychotics. Labs: elevated CK (>1000 IU/L), leukocytosis, elevated LFTs. Distinguished from serotonin syndrome: slower onset, more rigidity, no clonus. Do NOT restart antipsychotic for 2 weeks."
    difficulty: hard
    tags: [NMS, neuroleptic malignant syndrome, antipsychotic, hyperthermia, psychiatry]
  - front: "What metabolic monitoring is required for patients on second-generation antipsychotics?"
    back: "Baseline and every 3 months: weight/BMI, waist circumference; fasting glucose, lipid panel at baseline and 3 months; BP, HbA1c annually — olanzapine, clozapine, quetiapine have highest metabolic risk\n\nCANMAT guidelines: metabolic syndrome occurs in 40-50% of schizophrenia patients. SGAs (especially clozapine, olanzapine) cause weight gain, hyperglycemia, and dyslipidemia. Aripiprazole and ziprasidone have the lowest metabolic risk. Metformin effective for SGA-induced weight gain."
    difficulty: easy
    tags: [metabolic monitoring, SGA, metabolic syndrome, antipsychotic side effects, psychiatry]
  - front: "What is schizoaffective disorder and how is it diagnosed?"
    back: "Schizoaffective disorder: uninterrupted period of illness with both psychotic symptoms (hallucinations/delusions) AND a major mood episode (depressive or manic), with ≥2 weeks of psychosis WITHOUT prominent mood symptoms\n\nSchizoaffective disorder sits between schizophrenia and bipolar disorder. Distinguished from bipolar with psychotic features: psychosis must occur independently of mood episodes. Treatment: antipsychotic + mood stabilizer (for bipolar type) or antipsychotic + antidepressant (depressive type)."
    difficulty: hard
    tags: [schizoaffective disorder, psychosis, mood disorder, diagnosis, psychiatry]
  - front: "What is brief psychotic disorder and what is the key distinguishing feature from schizophrenia?"
    back: "Brief psychotic disorder: sudden onset psychotic symptoms lasting ≥1 day but <1 month, with full return to premorbid functioning; often triggered by severe stressor\n\nBrief psychotic disorder has excellent prognosis with full recovery. Distinguished from schizophrenia by duration (<1 month) and full recovery. Schizophreniform disorder: 1-6 months. Treatment: short-term low-dose antipsychotic, supportive therapy, address stressor."
    difficulty: easy
    tags: [brief psychotic disorder, schizophrenia duration, prognosis, DSM-5, psychiatry]
  - front: "What psychosocial interventions are evidence-based for schizophrenia?"
    back: "CBT for psychosis (CBTp), family-based therapy, supported employment (IPS model), cognitive remediation, social skills training, assertive community treatment (ACT)\n\nCANMAT guidelines recommend multimodal treatment for schizophrenia — antipsychotics alone are insufficient. ACT (Assertive Community Treatment) reduces hospitalizations and homelessness. Supported employment (IPS) helps patients return to work. Family psychoeducation reduces relapse rates by 20-30%."
    difficulty: easy
    tags: [psychosocial treatment, CBT for psychosis, ACT, supported employment, schizophrenia, psychiatry]
  - front: "A 30-year-old on haloperidol 10mg/day develops neck stiffening and oculogyric crisis 2 hours after a dose increase. What is the diagnosis and immediate treatment?"
    back: "Acute dystonic reaction; IV or IM benztropine 2mg or diphenhydramine 50mg — relief within 15-20 minutes; switch to SGA or lower dose\n\nAcute dystonia is more common with high-potency FGAs (haloperidol, trifluoperazine) and in young males. Laryngeal dystonia can cause airway compromise — emergency. Oculogyric crisis: involuntary eye deviation. Prophylactic benztropine may be given with first doses of high-potency antipsychotics."
    difficulty: medium
    tags: [acute dystonia, oculogyric crisis, benztropine, haloperidol, psychiatry]
  - front: "What is the role of long-acting injectable (LAI) antipsychotics in schizophrenia?"
    back: "LAI antipsychotics (aripiprazole, paliperidone, haloperidol decanoate given every 2-4 weeks) improve adherence, reduce relapse, and decrease hospitalizations — consider for any patient with adherence issues\n\nCANMAT guidelines: LAI antipsychotics eliminate covert non-adherence. Non-adherence is the #1 predictor of relapse in schizophrenia. LAI should be offered as an option to all patients with schizophrenia, not just non-adherent ones. LAI may be preferable as first-line in high-relapse-risk patients."
    difficulty: medium
    tags: [LAI antipsychotics, long-acting injectable, adherence, schizophrenia relapse, psychiatry]
  - front: "What is the difference between delusions and overvalued ideas?"
    back: "Delusion: fixed false belief held with absolute certainty, not shared by cultural group, not amenable to reason; Overvalued idea: intense preoccupation that is understandable given history but abnormally dominant (borderline between delusion and OCD)\n\nDelusions are classified by content (persecutory, referential, grandiose, erotomanic, somatic) and quality (bizarre or non-bizarre). Bizarre delusions (impossible given cultural context) are more specific to schizophrenia. Overvalued ideas are seen in OCD, anorexia, and body dysmorphic disorder."
    difficulty: medium
    tags: [delusions, overvalued ideas, psychopathology, schizophrenia, psychiatry]
  - front: "What are the phases of schizophrenia and what is the prodrome?"
    back: "Prodrome: 1-5 years before psychosis — social withdrawal, odd behavior, attenuated psychotic symptoms, decline in functioning; Acute phase: florid positive symptoms; Residual phase: negative symptoms and reduced positive symptoms\n\nCANMAT Early Psychosis Guidelines: identifying the prodrome allows intervention before full psychosis. At-Risk Mental State (ARMS) clinics provide early intervention. Duration of Untreated Psychosis (DUP) correlates with worse outcomes — reduce DUP is a key public health goal."
    difficulty: medium
    tags: [prodrome, early psychosis, schizophrenia phases, DUP, psychiatry]
  - front: "What is the management of acute agitation with psychosis in the ED?"
    back: "De-escalation first; pharmacological: oral or IM haloperidol + lorazepam (combined most effective), or olanzapine IM (avoid with alcohol/benzodiazepines), or droperidol IM — monitor for EPS, respiratory depression\n\nCPS/CANMAT emergency psychiatry guidelines: verbal de-escalation is the first approach for agitation. Parenteral antipsychotics for severe agitation. Olanzapine IM + parenteral benzodiazepine increases respiratory depression risk — do not combine. ECG monitoring for QTc prolongation with IV haloperidol."
    difficulty: hard
    tags: [acute agitation, haloperidol, olanzapine IM, de-escalation, psychiatry]
  - front: "What are the key side effects of antipsychotics?"
    back: "Typical (haloperidol): EPS (dystonia, akathisia, parkinsonism, tardive dyskinesia), NMS. Atypical (olanzapine, quetiapine): metabolic syndrome (weight gain, diabetes, dyslipidemia)\n\nNMS: fever, rigidity, autonomic instability, elevated CK. Treat: dantrolene + bromocriptine. Clozapine for treatment-resistant schizophrenia — monitor for agranulocytosis (weekly CBC initially)."
    difficulty: hard
    tags: [antipsychotics, side effects]
  - front: "What are DSM-5 criteria for schizophrenia?"
    back: ">=2 of: delusions, hallucinations, disorganized speech, disorganized/catatonic behavior, negative symptoms. At least 1 must be delusions/hallucinations/disorganized speech. Duration >=6 months\n\nActive phase >=1 month. Rule out schizoaffective, mood disorders with psychotic features, substance use, medical conditions. First-line: second-generation antipsychotics."
    difficulty: medium
    tags: [schizophrenia, DSM-5]
  - front: "What are the DSM-5 diagnostic criteria for schizophrenia?"
    back: ">=2 of the following (>=1 must be 1, 2, or 3): (1) delusions, (2) hallucinations, (3) disorganized speech, (4) grossly disorganized or catatonic behavior, (5) negative symptoms (flat affect, alogia, avolition). Duration: continuous signs >=6 months with >=1 month of active symptoms. Functional decline from premorbid level. Rule out schizoaffective, mood disorders, substance, medical causes.\n\nSchizophrenia affects ~1% of the population. Canadian guidelines emphasize early detection and intervention. Duration criterion (6 months) distinguishes schizophrenia from schizophreniform disorder (<6 months) and brief psychotic disorder (<1 month). Negative symptoms are most disabling and hardest to treat."
    difficulty: hard
    tags: [schizophrenia, DSM-5, psychosis, diagnostic criteria, psychiatry]
  - front: "What are the first-line and second-line antipsychotics for schizophrenia?"
    back: "First-line: atypical (second-generation) antipsychotics-risperidone, olanzapine, quetiapine, aripiprazole, paliperidone, ziprasidone, lurasidone. All have similar efficacy for positive symptoms. Second-line: typical (first-generation)-haloperidol, chlorpromazine, fluphenazine. Treatment-resistant: clozapine (gold standard after failure of >=2 adequate antipsychotic trials at adequate dose/duration).\n\nCanadian Schizophrenia Guidelines recommend SGAs as first-line due to lower EPS risk. Choice is based on side effect profile. Long-acting injectable (LAI) antipsychotics (paliperidone palmitate, aripiprazole lauroxil) improve adherence. Clozapine is the only antipsychotic with proven superiority for treatment-resistant schizophrenia."
    difficulty: hard
    tags: [antipsychotics, schizophrenia treatment, clozapine, psychiatry]
  - front: "What are the major side effects of antipsychotic medications by class?"
    back: "Typical/FGA: extrapyramidal symptoms (acute dystonia, akathisia, parkinsonism), tardive dyskinesia, neuroleptic malignant syndrome. Atypical/SGA: metabolic syndrome (weight gain, dyslipidemia, hyperglycemia-worst with olanzapine and clozapine), QTc prolongation (ziprasidone), hyperprolactinemia (risperidone, paliperidone), sedation (quetiapine, olanzapine).\n\nMetabolic monitoring is mandatory per Canadian Psychiatric Association: weight, waist circumference, fasting glucose, lipids at baseline, 3 months, then annually. Olanzapine and clozapine carry highest metabolic risk. Aripiprazole and ziprasidone are most weight-neutral. EPS treated with benztropine or benzodiazepines."
    difficulty: hard
    tags: [antipsychotic side effects, EPS, metabolic syndrome, psychiatry]
  - front: "What is neuroleptic malignant syndrome (NMS) and how is it managed?"
    back: "Clinical features: lead-pipe rigidity, hyperthermia (>38°C), autonomic instability (tachycardia, labile BP, diaphoresis), altered mental status. Labs: elevated CK (often >1000), leukocytosis, elevated LFTs, metabolic acidosis, myoglobinuria. Onset: days to weeks after antipsychotic initiation or dose increase. Management: stop antipsychotic, supportive care (cooling, IV fluids), dantrolene (muscle relaxant), bromocriptine (dopamine agonist).\n\nNMS has 10-20% mortality if untreated. Differentiate from serotonin syndrome: NMS has lead-pipe rigidity (not clonus) and slow onset. Risk factors: high-potency FGA (haloperidol), dehydration, rapid dose escalation. Can recur-restart antipsychotic cautiously after >=2 weeks, different class, low dose."
    difficulty: hard
    tags: [NMS, neuroleptic malignant syndrome, antipsychotic emergency, psychiatry]
  - front: "What is the monitoring protocol for clozapine?"
    back: "Mandatory ANC monitoring (risk of agranulocytosis ~1%): weekly CBC for first 26 weeks, then q2 weeks for next 26 weeks, then monthly. Hold clozapine if ANC <1500 (non-benign ethnic neutropenia) or <1000 (BEN). Other monitoring: fasting glucose/lipids q3-6mo, weight monthly, ECG (myocarditis risk in first month), bowel function (constipation/ileus). Annual echocardiogram in some protocols.\n\nClozapine is the gold standard for treatment-resistant schizophrenia (30% respond who failed other antipsychotics). Unique side effects: agranulocytosis, myocarditis (first month), metabolic syndrome, seizures (dose-dependent), sialorrhea, severe constipation/ileus. Canadian Clozapine Registry tracks all patients."
    difficulty: hard
    tags: [clozapine monitoring, agranulocytosis, treatment-resistant, psychiatry]
  - front: "What is the approach to first-episode psychosis in Canada?"
    back: "Early intervention is critical: assess safety, medical workup (CBC, electrolytes, TSH, B12, HIV, syphilis, urine drug screen, CT/MRI brain if indicated). Start low-dose atypical antipsychotic. Refer to early psychosis intervention (EPI) program. Psychoeducation, family involvement, CBT for psychosis. Monitor closely for 2 years. Consider substance-induced psychosis as alternative diagnosis.\n\nCanadian EPI programs (available in most provinces) improve outcomes through early identification and comprehensive treatment. First episode patients are more responsive and sensitive to antipsychotics-use lower doses. Duration of untreated psychosis (DUP) is the strongest modifiable predictor of outcome."
    difficulty: hard
    tags: [first-episode psychosis, early intervention, EPI, psychiatry]
  - front: "What are the key differences between positive and negative symptoms of schizophrenia and their treatment implications?"
    back: "Positive symptoms: delusions, hallucinations, disorganized speech/behavior-respond well to antipsychotics. Negative symptoms: flat affect, alogia (poverty of speech), avolition (lack of motivation), anhedonia, social withdrawal-poorly responsive to antipsychotics (except clozapine has modest benefit). Cognitive symptoms: impaired attention, memory, executive function-poorly responsive to medications.\n\nNegative and cognitive symptoms are the primary determinants of functional disability in schizophrenia. Canadian Schizophrenia Guidelines recommend psychosocial interventions (supported employment, social skills training, cognitive remediation) for these domains. Cariprazine may have modest benefit for negative symptoms."
    difficulty: medium
    tags: [positive symptoms, negative symptoms, cognitive symptoms, schizophrenia, psychiatry]
  - front: "What is the differential diagnosis of psychosis?"
    back: "Primary psychiatric: schizophrenia, schizoaffective, brief psychotic disorder, delusional disorder, bipolar with psychotic features, MDD with psychotic features. Substance-induced: cannabis, methamphetamine, cocaine, hallucinogens, alcohol withdrawal (DT), corticosteroids. Medical: delirium (most common in hospital), autoimmune encephalitis (anti-NMDAR), CNS infections, brain tumor, temporal lobe epilepsy, metabolic (hepatic encephalopathy, porphyria), endocrine (thyroid, Cushing).\n\nCanadian guidelines emphasize thorough medical workup before diagnosing primary psychotic disorder. Anti-NMDA receptor encephalitis is an increasingly recognized cause of psychosis, especially in young women. Substance-induced psychosis: if symptoms persist >1 month after cessation, consider primary psychotic disorder."
    difficulty: hard
    tags: [psychosis differential, substance-induced, medical causes, psychiatry]
  - front: "What is schizoaffective disorder and how does it differ from schizophrenia and mood disorders?"
    back: "DSM-5: concurrent period with mood episode (major depressive or manic) AND delusions/hallucinations, PLUS >=2 weeks of delusions/hallucinations WITHOUT mood symptoms (key distinguishing criterion). If psychosis only during mood episodes = mood disorder with psychotic features. If mood symptoms brief relative to psychosis = schizophrenia.\n\nSchizoaffective disorder is often a diagnostic challenge. Treatment combines antipsychotic + mood stabilizer or antidepressant depending on subtype (bipolar vs depressive). Canadian clinical practice often revisits this diagnosis over time as longitudinal course clarifies the picture."
    difficulty: hard
    tags: [schizoaffective, differential diagnosis, mood psychosis, psychiatry]
  - front: "What are the types of extrapyramidal symptoms (EPS) and their management?"
    back: "Acute dystonia (hours-days): sustained muscle contractions (torticollis, oculogyric crisis). Treat: benztropine 1-2mg IM/IV or diphenhydramine 50mg IM. Akathisia (days-weeks): inner restlessness, inability to sit still. Treat: reduce dose, switch antipsychotic, propranolol, benzodiazepine, mirtazapine. Parkinsonism (weeks-months): bradykinesia, rigidity, tremor. Treat: reduce dose, benztropine. Tardive dyskinesia (months-years): involuntary choreoathetoid movements (lip smacking, tongue protrusion). Treat: switch to clozapine/quetiapine, valbenazine, deutetrabenazine.\n\nEPS are more common with high-potency FGA (haloperidol) but can occur with any antipsychotic. TD is potentially irreversible-screen regularly with AIMS (Abnormal Involuntary Movement Scale). Valbenazine is approved in Canada for TD treatment. Young males are highest risk for acute dystonia."
    difficulty: hard
    tags: [EPS, extrapyramidal symptoms, tardive dyskinesia, akathisia, psychiatry]
  - front: "What are the long-acting injectable (LAI) antipsychotic options and their role?"
    back: "Available in Canada: paliperidone palmitate (monthly or q3month), aripiprazole lauroxil/monohydrate (monthly or q2month), risperidone LAI (q2 weeks), fluphenazine decanoate (q2-4 weeks), haloperidol decanoate (q4 weeks). Role: non-adherence (most common cause of relapse), patient preference, forensic settings, first-episode psychosis (CANMAT recommends early consideration).\n\nLAI antipsychotics reduce relapse and rehospitalization by 30-50% compared to oral formulations. CANMAT now recommends discussing LAI early in treatment, not just after non-adherence. Overlap with oral medication is required during initiation (varies by formulation)."
    difficulty: hard
    tags: [LAI, long-acting injectable, adherence, antipsychotic, psychiatry]
  - front: "What psychosocial interventions are recommended for schizophrenia?"
    back: "Supported employment (IPS model): most effective for improving employment outcomes. Social skills training. Cognitive behavioral therapy for psychosis (CBTp): reduces positive symptoms and distress. Family psychoeducation: reduces relapse. Assertive community treatment (ACT): for severely ill patients. Cognitive remediation. Peer support programs.\n\nCanadian Schizophrenia Guidelines recommend comprehensive psychosocial programs alongside pharmacotherapy. ACT teams (intensive community-based multidisciplinary teams) are available in most Canadian provinces. Recovery-oriented care is the guiding philosophy of Canadian mental health policy."
    difficulty: medium
    tags: [psychosocial interventions, supported employment, ACT, schizophrenia, psychiatry]
  - front: "What is the approach to catatonia?"
    back: "Features: immobility/stupor, mutism, posturing, waxy flexibility, negativism, staring, stereotypies, echolalia, echopraxia. Can occur in schizophrenia, mood disorders, or medical conditions. Bush-Francis Catatonia Rating Scale for diagnosis. Treatment: (1) lorazepam challenge test (1-2mg IV-diagnostic and therapeutic, response within minutes confirms catatonia), (2) if no response: ECT (highly effective, potentially life-saving for malignant catatonia).\n\nCatatonia is a medical emergency when malignant (autonomic instability, hyperthermia, rhabdomyolysis). AVOID antipsychotics in acute catatonia (can worsen symptoms or precipitate NMS). Benzodiazepines are first-line. ECT has response rates >80% in catatonia and should not be delayed if benzodiazepines fail."
    difficulty: hard
    tags: [catatonia, lorazepam challenge, ECT, psychiatry]
  - front: "What are the metabolic monitoring requirements for patients on antipsychotics?"
    back: "Baseline: weight, BMI, waist circumference, fasting glucose, HbA1c, lipid profile, BP. 1 month: weight. 3 months: weight, fasting glucose, lipids. 6 months: weight, fasting glucose, lipids. Annually: all of the above + HbA1c. If significant metabolic changes: lifestyle interventions, consider switch to metabolically neutral antipsychotic (aripiprazole, ziprasidone), consider metformin.\n\nCanadian Psychiatric Association consensus guidelines mandate metabolic monitoring. Patients on antipsychotics have 20-year reduced life expectancy, largely due to cardiovascular disease. Metabolic syndrome rates: 30-40% in schizophrenia. Metformin (off-label) can reduce antipsychotic-associated weight gain by 3-4 kg."
    difficulty: hard
    tags: [metabolic monitoring, antipsychotic, cardiovascular risk, psychiatry]
  - front: "What is the clozapine monitoring protocol?"
    back: "Treatment-resistant schizophrenia (failed >=2 antipsychotics). Mandatory: weekly CBC for 26 weeks, then biweekly for 26 weeks, then monthly. Monitor for: agranulocytosis (ANC<500), metabolic syndrome, myocarditis, seizures\n\nAgranulocytosis risk ~1%. Stop if ANC<1000, do not rechallenge if <500. Also monitor: fasting glucose/lipids q3-6mo, weight monthly, ECG at baseline. Despite monitoring burden, clozapine reduces suicide in schizophrenia."
    difficulty: hard
    tags: [clozapine, monitoring, schizophrenia]
  - front: "What is the recommended workup for first-episode psychosis?"
    back: "Complete medical workup: CBC, electrolytes, glucose, renal/liver function, TSH, calcium, urinalysis, urine toxicology screen, syphilis serology, HIV (if risk factors), B12/folate. Neuroimaging: CT or MRI brain (rule out structural causes). ECG (baseline QTc before antipsychotics). Neuropsychological testing when stabilized.\n\nCanadian guidelines (Schizophrenia Society of Canada, CANMAT) recommend thorough medical investigation to exclude organic causes. Up to 5% of first-episode psychosis has a medical etiology. Anti-NMDA receptor encephalitis should be considered in young women (CSF antibodies). Early intervention programs improve outcomes — target DUP (duration of untreated psychosis) <3 months."
    difficulty: medium
    tags: [first-episode-psychosis, workup, organic-causes, DUP, early-intervention]
  - front: "What is required for clozapine monitoring and what are the key risks?"
    back: "Mandatory: absolute neutrophil count (ANC) weekly for first 26 weeks, biweekly for weeks 27-52, then monthly. Must be >=1.5 to continue (>=1.0 for benign ethnic neutropenia). Key risks: agranulocytosis (1-2%), metabolic syndrome, myocarditis (first 4-6 weeks — monitor troponin/CRP), seizures (dose-dependent), sedation, constipation (can be fatal — ileus).\n\nClozapine is the gold standard for treatment-resistant schizophrenia (failed >=2 adequate antipsychotic trials). CANMAT recommends not delaying clozapine trial unnecessarily. In Canada, clozapine dispensing requires enrollment in a monitoring program (Clozaril Support and Assistance Network). Clozapine reduces suicidality in schizophrenia (InterSePT trial)."
    difficulty: hard
    tags: [clozapine, monitoring, agranulocytosis, myocarditis, treatment-resistant-schizophrenia]
  - front: "What is brief psychotic disorder and how does it differ from schizophreniform disorder?"
    back: "Brief psychotic disorder: >=1 psychotic symptom (delusions, hallucinations, disorganized speech/behaviour) lasting 1 day to <1 month, with full return to premorbid function. Schizophreniform: same symptoms lasting 1-6 months. Schizophrenia: symptoms >=6 months. Stressor may or may not be present for brief psychotic disorder.\n\nDSM-5 distinguishes these by duration. Brief psychotic disorder has the best prognosis (50% never have another episode). Short-term antipsychotic treatment (1-3 months) is recommended. Must rule out substance-induced and medical causes. Follow-up is essential as some patients progress to schizophrenia or bipolar disorder."
    difficulty: medium
    tags: [brief-psychotic-disorder, schizophreniform, duration, DSM-5, prognosis]
  - front: "What are the diagnostic features of delusional disorder?"
    back: "Non-bizarre delusions (plausible situations: persecutory, jealous, erotomanic, grandiose, somatic) lasting >=1 month. Functioning relatively preserved apart from impact of the delusion. No prominent hallucinations, disorganized speech, or negative symptoms. Does not meet criteria for schizophrenia. Subtypes guide clinical approach.\n\nDelusional disorder is uncommon but clinically challenging due to preserved functioning and encapsulated delusions. Patients rarely present voluntarily. Treatment response to antipsychotics is modest (~50% partial response). CBT may be beneficial. Forensic implications exist especially with jealous and erotomanic subtypes."
    difficulty: medium
    tags: [delusional-disorder, non-bizarre, subtypes, preserved-function, DSM-5]
  - front: "How do you differentiate substance-induced psychosis from primary psychotic disorder?"
    back: "Substance-induced: temporal relationship (onset during intoxication/withdrawal), resolves with sustained abstinence (usually within 1 month), urine drug screen positive, visual hallucinations more common. Primary: symptoms persist beyond 1 month of abstinence, auditory hallucinations predominate, negative symptoms present, premorbid decline.\n\nCannabis, methamphetamine, cocaine, and alcohol (withdrawal) are common causes of substance-induced psychosis in Canada. Up to 25% of cannabis-induced psychosis converts to schizophrenia. CANMAT recommends monitoring patients with substance-induced psychosis for 6 months for conversion. Methamphetamine psychosis can persist for months."
    difficulty: medium
    tags: [substance-induced-psychosis, primary-psychosis, differential, cannabis, methamphetamine]
  - front: "What are the metabolic side effects of atypical antipsychotics and how should they be monitored?"
    back: "Weight gain (worst: clozapine, olanzapine), dyslipidemia, hyperglycemia/type 2 diabetes, metabolic syndrome. Monitoring: weight/BMI at baseline and monthly for 3 months then quarterly, fasting glucose and lipids at baseline, 3 months, then annually, waist circumference, blood pressure.\n\nCANMAT metabolic monitoring guidelines are often underimplemented. Metabolic syndrome affects 30-50% of patients on atypical antipsychotics. Switching from olanzapine to aripiprazole or ziprasidone can improve metabolic profile. Metformin can be added for antipsychotic-associated weight gain. Cardiovascular disease is the leading cause of death in schizophrenia."
    difficulty: medium
    tags: [metabolic-syndrome, antipsychotic, monitoring, weight-gain, CANMAT]
  - front: "What is the CANMAT-recommended approach to first-episode schizophrenia pharmacotherapy?"
    back: "Start a single second-generation antipsychotic (SGA) at low dose, titrate slowly. First-line: risperidone, paliperidone, aripiprazole, quetiapine, olanzapine (considering side effect profile). Lower doses effective in first-episode vs chronic. Continue for >=18 months after remission. Consider long-acting injectable (LAI) for adherence.\n\nFirst-episode patients are more medication-sensitive and respond to lower doses. Treatment response rate in first episode is 70-80% vs 30-40% in chronic schizophrenia. CANMAT emphasizes early intervention services including psychoeducation, family therapy, and vocational rehabilitation. Clozapine should be tried after 2 failed adequate trials."
    difficulty: medium
    tags: [first-episode, antipsychotic, SGA, CANMAT, early-intervention]
  - front: "What are the extrapyramidal side effects (EPS) of antipsychotics and their management?"
    back: "Acute dystonia (hours-days): treat with benztropine 1-2 mg IM or diphenhydramine 50 mg IM. Akathisia (days-weeks): reduce dose, switch agent, or add propranolol/benzodiazepine. Parkinsonism (weeks): reduce dose or add anticholinergic. Tardive dyskinesia (months-years): switch to lower-risk agent, consider valbenazine or deutetrabenazine.\n\nEPS are more common with first-generation antipsychotics (haloperidol) but occur with all antipsychotics. Akathisia is often misdiagnosed as agitation and is a risk factor for suicidality. Tardive dyskinesia affects 20-30% on long-term typical antipsychotics. VMAT2 inhibitors (valbenazine) are Health Canada-approved for TD treatment."
    difficulty: medium
    tags: [EPS, dystonia, akathisia, tardive-dyskinesia, antipsychotic]
  - front: "What is neuroleptic malignant syndrome (NMS) and how is it managed?"
    back: "NMS: hyperthermia (>38C), severe muscle rigidity (lead-pipe), altered mental status, autonomic instability (tachycardia, labile BP, diaphoresis). Labs: elevated CK (often >1000), leukocytosis, elevated LFTs. Management: stop all antipsychotics/dopamine-blocking agents immediately, IV fluids, cooling, dantrolene (muscle relaxant), bromocriptine (dopamine agonist), ICU monitoring.\n\nNMS is a rare but potentially fatal (10-20% mortality) reaction to dopamine-blocking agents. Risk factors include high-potency FGAs, rapid dose escalation, dehydration, and agitation. Distinguish from serotonin syndrome (clonus and hyperreflexia predominate vs rigidity in NMS). Can rechallenge with a different antipsychotic after 2 weeks at low dose."
    difficulty: hard
    tags: [NMS, hyperthermia, dantrolene, bromocriptine, emergency]
  - front: "What long-acting injectable antipsychotics are available in Canada and what are their advantages?"
    back: "Available: paliperidone palmitate (monthly or 3-monthly), aripiprazole lauroxil (monthly or bimonthly), risperidone microspheres (biweekly), flupentixol decanoate, haloperidol decanoate. Advantages: improved adherence, reduced relapse and hospitalization, steady drug levels, reduced mortality.\n\nCANMAT and Canadian Schizophrenia guidelines increasingly recommend LAI early in treatment (not just as last resort). PROACTIVE and PRELAPSE studies support LAI for first-episode patients. Non-adherence is the strongest predictor of relapse. LAI reduces relapse by 50% compared to oral antipsychotics in real-world studies."
    difficulty: medium
    tags: [LAI, long-acting-injectable, adherence, paliperidone, relapse-prevention]
  - front: "What are causes of secondary psychosis (medical causes)?"
    back: "Delirium, substance intoxication/withdrawal, medications (steroids, anticholinergics), CNS infections, metabolic disorders, structural lesions, autoimmune encephalitis\n\nPsychosis can be primary or secondary to medical conditions; medical causes must be ruled out"
    difficulty: medium
    tags: [psychosis, differential, medical, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the MOAPS components in psychiatric review of systems?"
    back: "Mood, Psychosis, Affect, Safety\n\nMOAPS is a framework for systematic psychiatric assessment"
    difficulty: easy
    tags: [psychiatry, assessment, review of systems, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the components of the MOAPS psychiatric review system?"
    back: "Mood, Other (organic causes), Affect, Psychosis, Safety\n\nMOAPS is a mnemonic for systematic psychiatric assessment in the emergency department."
    difficulty: medium
    tags: [psychiatry, assessment, mnemonic, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the causes of secondary psychosis?"
    back: "Medical conditions (delirium, metabolic disorders), drugs (substance intoxication/withdrawal, medications like steroids), infections (CNS), structural lesions, autoimmune (anti-NMDA receptor encephalitis)\n\nSecondary psychosis must be ruled out before diagnosing primary psychotic disorders. These causes produce psychotic symptoms due to organic brain dysfunction."
    difficulty: medium
    tags: [psychosis, differential, organic, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the first-line medications for acute agitation in the ED?"
    back: "Benzodiazepines (lorazepam 2mg PO/IM/SL) or antipsychotics (olanzapine 5-10mg PO/IM, haloperidol 5mg PO/IM)\n\nBoth classes are effective for acute agitation. Offer medication to patients when possible rather than administering with force to maintain therapeutic alliance."
    difficulty: easy
    tags: [psychiatry, agitation, treatment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the negative symptoms of psychosis?"
    back: "Affective flattening, alogia (reduced speech), avolition (lack of motivation)\n\nNegative symptoms represent loss of normal functions and are characteristic of schizophrenia and other psychotic disorders."
    difficulty: easy
    tags: [psychiatry, psychosis, negative symptoms, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the MOAPS components of psychiatric review?"
    back: "Mood, Organic causes, Assessment, Psychosis, Safety\n\nMOAPS is a mnemonic for psychiatric review: Mood, Organic causes (rule out medical), Assessment, Psychosis, Safety (SI/HI)."
    difficulty: easy
    tags: [psychiatric assessment, MOAPS, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the first-line medications for acute agitation in psychiatric emergency?"
    back: "Benzodiazepines (lorazepam 2mg) or Antipsychotics (olanzapine 5-10mg, haloperidol 5mg)\n\nFirst-line treatment for acute agitation includes lorazepam 2mg PO/IM/SL or olanzapine 5-10mg PO/IM or haloperidol 5mg PO/IM."
    difficulty: easy
    tags: [agitation, lorazepam, olanzapine, haloperidol, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What medications increase risk of T2DM?"
    back: "Glucocorticoids, atypical antipsychotics, HAART\n\nThese medications can induce insulin resistance or impair beta-cell function, increasing diabetes risk."
    difficulty: medium
    tags: [endocrinology, diabetes, risk factors, pharmacology, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What medications increase the risk of developing diabetes?"
    back: "Glucocorticoids and atypical antipsychotics\n\nCertain medications including glucocorticoids and atypical antipsychotics (e.g., HAART) can increase the risk of developing diabetes."
    difficulty: medium
    tags: [endocrinology, diabetes, pharmacology, risk factors, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
