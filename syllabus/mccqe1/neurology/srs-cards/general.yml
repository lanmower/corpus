# General (Neurology) - generated from srs-mccqe1
cards:
  - front: "What are the neurological criteria for death in Canada?"
    back: "Brain death criteria must be established before organ donation considerations\n\nNeurological death determination includes absence of brainstem reflexes and apnea testing, with organ donation discussed afterward."
    difficulty: medium
    tags: [brain death, organ donation, neurology, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What neurologic complications are associated with alcohol use disorder?"
    back: "Wernicke-Korsakoff syndrome, peripheral neuropathy\n\nThese result from thiamine (B1) deficiency commonly seen in chronic alcohol use."
    difficulty: medium
    tags: [alcohol, neurology, complications, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What neurological complications are associated with alcohol use disorder?"
    back: "Wernicke-Korsakoff syndrome and peripheral neuropathy\n\nThiamine deficiency causes these serious neurological manifestations of chronic alcohol use."
    difficulty: easy
    tags: [alcohol, neurology, Wernicke-Korsakoff, thiamine, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When is neuroimaging indicated for headache evaluation?"
    back: "When red flags are present to rule out intracranial pathology\n\nCT or MRI is not routinely indicated for primary headaches but should be performed when secondary causes are suspected."
    difficulty: easy
    tags: [headache, neuroimaging, neurology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are secondary headaches?"
    back: "Headaches caused by underlying organic disease; account for <10% of headaches but may be life-threatening\n\nSecondary headaches require urgent evaluation to identify the underlying cause."
    difficulty: easy
    tags: [headache, neurology, secondary-headache, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the 3 main categories of headaches?"
    back: "Primary headaches (most common), secondary headaches (caused by underlying organic disease), and other serious causes\n\nPrimary headaches include tension headaches, migraines, and cluster headaches. Secondary headaches account for <10% of headaches and may be life-threatening."
    difficulty: easy
    tags: [headache, neurology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What percentage of all headaches are secondary headaches?"
    back: "Less than 10%\n\nSecondary headaches caused by underlying organic disease account for less than 10% of all headaches but may be life-threatening."
    difficulty: easy
    tags: [Headache, Neurology, Classification, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the neurological causes of constipation?"
    back: "Intestinal pseudo-obstruction, Parkinson's disease, and multiple sclerosis.\n\nNeurological diseases can affect the autonomic innervation of the gut, leading to impaired motility and constipation."
    difficulty: medium
    tags: [Constipation, Neurology, Gastroenterology, Parkinson, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the preferred treatment for Wilson's disease with neurological involvement?"
    back: "Tetrathiomolybdate\n\nTetrathiomolybdate is preferred in neurological Wilson's disease as it preferentially treats neurological symptoms and has better tolerability."
    difficulty: medium
    tags: [Wilsons disease, treatment, neurology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "Which drug is preferred for Wilson's disease with neurological involvement?"
    back: "Tetrathiomolybdate\n\nTetrathiomolybdate is preferred in neurological presentations as it may prevent worsening of neurological symptoms that can occur with chelators."
    difficulty: medium
    tags: [wilsons-disease, treatment, tetrathiomolybdate, neurology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
