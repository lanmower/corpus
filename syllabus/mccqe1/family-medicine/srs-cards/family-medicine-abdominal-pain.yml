# Family Medicine Abdominal Pain (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the red flags in a patient presenting with abdominal pain that warrant urgent investigation?"
    back: "Severe pain, fever, peritoneal signs, abdominal distention, pain out of proportion to clinical findings, new onset pain/change in pain/altered bowel habits in elderly, weight loss, blood per rectum/melena, jaundice, supraclavicular lymph nodes, family history of serious bowel disease.\n\nPain that precedes nausea/vomiting makes a serious cause of abdominal pain more likely. The most common diagnosis in family medicine is 'nonspecific abdominal pain' (28%), which is self-limited, but red flags must be systematically excluded. Only 10% of abdominal pain cases are referred to specialists."
    difficulty: easy
    tags: [abdominal pain, red flags, family medicine]
  - front: "What is the anatomic basis for pain localization in abdominal pathology? Match each region to the relevant embryologic gut segment."
    back: "Epigastric (foregut): distal esophagus, stomach, proximal duodenum, biliary tree, pancreas, liver. Periumbilical (midgut): distal duodenum to proximal 2/3 of transverse colon. Hypogastric (hindgut): distal 1/3 of transverse colon to rectosigmoid. RUQ: biliary, hepatic, colonic, pulmonary, renal. LUQ: cardiac, gastric, pancreatic, renal, vascular. RLQ: colonic, appendix, gynecological, renal. LLQ: colonic, gynecological, renal.\n\nVisceral pain from abdominal organs is poorly localized and follows embryologic gut segments. Somatic pain from parietal peritoneum is sharp and well-localized. Understanding referred pain patterns (e.g., appendicitis initially periumbilical then migrating to RLQ) is fundamental to abdominal diagnosis."
    difficulty: medium
    tags: [abdominal pain, anatomy, embryology, visceral pain, family medicine]
  - front: "What investigations should be ordered for a patient presenting with acute abdominal pain, and what does each imaging modality best evaluate?"
    back: "Blood work: CBC, electrolytes, BUN, Cr, amylase, lipase, AST/ALT/ALP/bilirubin, glucose, INR/PTT, toxicology, β-hCG. Imaging: CXR (free air under diaphragm if perforation), AXR/KUB (gas pattern, free air, renal stones, constipation), U/S (renal stones, gallbladder, gynecological, liver, pancreatitis, appendicitis), CT scan (AAA, appendicitis), non-contrast helical CT (first choice for renal stones). Other: urinalysis, endoscopy, H. pylori testing.\n\nThe imaging choice should be guided by the clinical differential. Non-contrast helical CT is preferred for renal stones because stones are radio-dense and contrast is unnecessary. CXR is rapid and identifies free air (pneumoperitoneum) indicating perforation, which would warrant emergent surgical consultation."
    difficulty: medium
    tags: [abdominal pain, investigations, imaging, family medicine]
