# Gastroenterology Pud (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What are the relative contributions of H. pylori, NSAIDs, and other factors to duodenal versus gastric ulcers?"
    back: "Duodenal ulcer etiology: H. pylori 90%, NSAIDs ~35% (some overlap), physiologic stress-induced ~4%, Zollinger-Ellison syndrome ~4%, idiopathic ~15%.\n\nGastric ulcer etiology: H. pylori 60%, NSAIDs ~35%, physiologic stress-induced ~5%, Zollinger-Ellison syndrome <1%, idiopathic ~10%.\n\nNote: NSAIDs more commonly cause gastric ulcers than duodenal ulcers. H. pylori-negative, NSAID-negative ulcers are increasingly recognized as H. pylori prevalence decreases.\n\nH. pylori is the dominant cause of both types but is more strongly linked to duodenal ulcers. NSAIDs preferentially cause gastric ulcers via inhibition of prostaglandin synthesis. Recognizing the etiology guides treatment and secondary prevention."
    difficulty: medium
    tags: [PUD, peptic ulcer, H. pylori, NSAIDs, duodenal ulcer, gastric ulcer, gastroenterology]
  - front: "What are the classic 6 clinical features of duodenal ulcer?"
    back: "Classic features of duodenal ulcer (6):\n1. Epigastric pain (may localize to tip of xiphoid)\n2. Burning quality\n3. Develops 1–3 hours after meals\n4. Relieved by eating and antacids\n5. Interrupts sleep (nocturnal pain)\n6. Periodicity — occurs in clusters of weeks with subsequent periods of remission\n\nWhile these 6 features are classic, history alone cannot distinguish duodenal ulcer from functional dyspepsia. Notably, 70% of peptic ulcers are asymptomatic — underscoring the importance of testing for complications. Gastric ulcers have more atypical symptoms and require biopsy to exclude malignancy."
    difficulty: easy
    tags: [duodenal ulcer, PUD, epigastric pain, clinical features, gastroenterology]
  - front: "What are the complications of peptic ulcer disease and their approximate frequencies?"
    back: "- Bleeding: 10% (severe if from gastroduodenal artery)\n- Perforation: 2% (usually anterior ulcers)\n- Gastric outlet obstruction: 2%\n- Posterior inflammation/penetration: 2% (may also cause pancreatitis)\n\n70% of peptic ulcers are asymptomatic, meaning complications may be the first presentation. Anterior ulcers tend to perforate; posterior ulcers penetrate into the pancreas causing pancreatitis. Bleeding is the most common complication."
    difficulty: easy
    tags: [PUD, peptic ulcer complications, bleeding, perforation, pancreatitis, gastroenterology]
  - front: "What factors contribute to increased mortality risk in bleeding peptic ulcer?"
    back: "Risk factors for increased mortality in bleeding peptic ulcer:\n- Co-existent illness (comorbidities)\n- Hemodynamic instability\n- Age >60 years\n\nClinical risk factors for rebleeding: age >60, bleeding diathesis, history of PUD, comorbid disease, hemodynamic instability.\n\nEndoscopic signs of high rebleeding risk (more predictive than clinical): active bleeding, visible vessel, adherent clot, red spot.\n\nEndoscopic risk stratification guides therapy. High-risk stigmata warrant endoscopic hemostasis (clips, thermal coagulation + epinephrine) and ICU admission. Low-risk (flat pigmented spot or clean base) can be managed without hemostasis and with early discharge."
    difficulty: medium
    tags: [bleeding peptic ulcer, mortality risk, endoscopic stigmata, hemostasis, gastroenterology]
  - front: "Describe the management algorithm for a suspected bleeding peptic ulcer."
    back: "1. ABCs: assess vitals (BP, HR, orthostatic changes)\n2. Labs: CBC, electrolytes, BUN, Cr, INR, blood type and crossmatch\n3. Resuscitate with crystalloids and blood products as indicated\n4. Consider NG placement + aspiration to confirm upper GI source\n5. IV pantoprazole: 80 mg bolus + 8 mg/h continuous infusion\n6. Erythromycin 250 mg IV 30 min before endoscopy (prokinetic to clear stomach)\n7. Endoscopy:\n   - High-risk stigmata: hemostasis (clips, thermal coagulation + epinephrine), continue IV PPI, monitor in hospital\n   - Low-risk: no hemostasis, start/continue oral PPI, decreased in-hospital monitoring\n8. Post-endoscopy: resume clear fluids at 6 h, test for H. pylori, counsel re: NSAIDs/antiplatelet agents\n9. Re-bleeding: repeat endoscopy; escalate to interventional radiology or surgery if needed\n\nIV pantoprazole suppresses acid to stabilize the clot. Erythromycin accelerates gastric emptying to improve endoscopic visualization. Endoscopic therapy reduces rebleeding rates and need for surgery in high-risk lesions."
    difficulty: hard
    tags: [bleeding peptic ulcer, management, pantoprazole, endoscopy, hemostasis, gastroenterology]
  - front: "What is the pathophysiology of NSAID-induced ulceration?"
    back: "Direct mechanism: local (topical) effect of NSAID on gastric mucosa → erosions and petechiae.\n\nIndirect (systemic) mechanism: NSAIDs inhibit mucosal cyclooxygenase → decreased prostaglandin synthesis → reduced secretion of protective bicarbonate and mucus → decreased mucosal blood flow → ulcers.\n\nKey point: IV NSAIDs cause ulcers (via systemic effect) but NOT erosions (which require direct topical contact). NSAIDs more commonly cause gastric than duodenal ulcers.\n\nThe distinction between direct and indirect mechanisms explains why enteric-coated aspirin (ECASA) provides minor benefit — it decreases erosions (direct effect) but does NOT decrease ulcer incidence (systemic effect remains). Misoprostol and PPIs work by replacing or stimulating prostaglandin-mediated protective mechanisms."
    difficulty: hard
    tags: [NSAID, peptic ulcer, prostaglandins, cyclooxygenase, gastric protection, gastroenterology]
  - front: "What are the risk factors for NSAID-induced peptic ulcer?"
    back: "Risk factors for NSAID-induced peptic ulcer:\n1. Previous peptic ulcers or upper GI bleeding\n2. Age ≥65 years\n3. High dose of NSAID or multiple NSAIDs\n4. Concomitant corticosteroid use\n5. Concomitant cardiovascular disease or other significant comorbidities\n\nWhen any of these risk factors are present, prophylactic PPI co-therapy is recommended with NSAID/ASA use. Misoprostol is an alternative but less effective and poorly tolerated option. The combination of corticosteroids + NSAIDs dramatically increases ulcer risk."
    difficulty: easy
    tags: [NSAID, peptic ulcer risk factors, PPI prophylaxis, age, gastroenterology]
  - front: "What is stress-induced ulceration, what are its risk factors, and how is it treated?"
    back: "Stress-induced ulceration is ulceration/erosion in the upper GI tract of critically ill patients (physiological stress, not psychiatric). Most common in fundus; usually multiple, superficial erosions.\n\nRisk factors:\n- Mechanical ventilation (most important)\n- Anti-coagulation\n- Multi-organ failure\n- Septicemia\n- Severe surgery/trauma\n- CNS injury (Cushing's ulcers)\n- Burns >35% body surface area (Curling's ulcers)\n\nTreatment:\n- Prophylaxis: gastric acid suppressants (PPI most potent but may increase pneumonia risk; H2 blockers less potent but lower pneumonia risk)\n- Treat underlying cause; aggressive fluid resuscitation\n- Ulcer treatment same as for bleeding peptic ulcer (often less successful in ICU setting)\n\nMechanical ventilation is the single most important risk factor. PPIs are more effective at preventing UGIB but the associated increased pneumonia risk has led some guidelines to favour H2 blockers in low-to-moderate risk patients. Stress ulcers are clinically silent (painless) until they bleed."
    difficulty: medium
    tags: [stress ulcer, ICU, mechanical ventilation, Cushings ulcer, Curlings ulcer, gastroenterology]
  - front: "Distinguish Curling's ulcer from Cushing's ulcer."
    back: "Curling's ulcer: acute peptic ulcer of the duodenum resulting from severe burns (>35% BSA). Mnemonic: BURN from a CURLING iron.\n\nCushing's ulcer: peptic ulcer produced by elevated intracranial pressure (ICP). Mechanism: elevated ICP stimulates vagal nuclei → increased gastric acid secretion → ulceration. May occur anywhere in the upper GI tract.\n\nBoth are forms of stress ulceration but with specific inciting triggers. Cushing's ulcers tend to be single and deep (due to vagal hyperstimulation causing acid hypersecretion), while other stress ulcers are typically multiple and superficial."
    difficulty: easy
    tags: [Curlings ulcer, Cushings ulcer, stress ulcer, burns, ICP, gastroenterology]
