# General (Respirology) - generated from srs-mccqe1
cards:
  - front: "What is the mechanism of action of albuterol?"
    back: "Beta-2 adrenergic receptor agonist that causes bronchodilation\n\nAlbuterol is a short-acting beta-2 agonist (SABA) used for acute asthma and COPD exacerbations."
    difficulty: easy
    tags: [respiratory, adrenergic-agonists, beta-2-agonists, bronchodilators, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What respiratory pattern is seen in DKA?"
    back: "Kussmaul respirations\n\nKussmaul respirations (deep, rapid breathing) are present in DKA as a compensatory mechanism for metabolic acidosis."
    difficulty: easy
    tags: [DKA, Kussmaul, respiratory, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of respiratory pattern is seen in DKA and what causes it?"
    back: "Kussmaul respirations (deep, rapid breathing)\n\nKussmaul respirations represent the body's compensatory mechanism for metabolic acidosis - attempting to blow off CO2."
    difficulty: easy
    tags: [DKA, respiratory, Kussmaul, acidosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "A patient with fever, cough, and coryza presents. What should be considered?"
    back: "Influenza and COVID-19\n\nUpper respiratory symptoms with fever should prompt testing for influenza and COVID-19."
    difficulty: easy
    tags: [fever, influenza, COVID-19, respiratory, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What symptoms suggest URTI as source of fever?"
    back: "Cough, coryza, ear pain (consider influenza, COVID-19)\n\nUpper respiratory symptoms are common fever sources and may require specific viral testing."
    difficulty: easy
    tags: [fever, infection, respiratory, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
