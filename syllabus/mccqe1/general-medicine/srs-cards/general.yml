    back: "Chancroid, granuloma inguinale, lymphogranuloma venereum\n\nThese infections are rare in Canada but may be seen in specific populations or travel-related cases."
    difficulty: easy
    tags: [STI, epidemiology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What exercises are recommended for osteoporosis prevention?"
    back: "Balance and muscle-strengthening exercises > twice weekly\n\nRegular exercise improves bone strength and reduces fall risk, a key component of osteoporosis management."
    difficulty: easy
    tags: [osteoporosis, prevention, exercise, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended daily calcium intake for adults over 50?"
    back: "1200 mg daily\n\nAdults over 50 require higher calcium intake to maintain bone health and prevent age-related bone loss."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the screening recommendation for chlamydia and gonorrhea?"
    back: "Annual screening for all sexually active people under 30\n\nYoung sexually active individuals have the highest rates of these infections and benefit from routine annual screening."
    difficulty: easy
    tags: [STI, screening, chlamydia, gonorrhea, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the Pap test screening recommendation?"
    back: "Pap test every 3 years for anyone with a cervix aged 25 to 69 who has ever been sexually active\n\nThis screening protocol detects cervical dysplasia and HPV-related changes early for intervention."
    difficulty: easy
    tags: [STI, screening, Pap-test, HPV, cervical-cancer, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the most common STI worldwide?"
    back: "Chlamydia\n\nChlamydia trachomatis infection remains the most frequently reported bacterial STI globally due to often asymptomatic presentation."
    difficulty: easy
    tags: [STI, chlamydia, epidemiology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended balance and exercise regimen for osteoporosis prevention?"
    back: "Balance and muscle-strengthening exercises more than twice weekly\n\nRegular exercise improves bone density and reduces fall risk, which is crucial for fracture prevention."
    difficulty: easy
    tags: [osteoporosis, prevention, exercise, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the calcium requirement for adults aged 65-69 with 1 risk factor?"
    back: "1300 mg daily\n\nOlder adults with risk factors require higher calcium intake to maintain bone health."
    difficulty: medium
    tags: [osteoporosis, calcium, elderly, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What fall risk assessment is recommended in osteoporosis evaluation?"
    back: "Ability to get up from chair without support with arms, and walking several steps and return\n\nThis simple test assesses lower extremity strength and balance, key components of fall risk."
    difficulty: easy
    tags: [osteoporosis, fall-risk, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
