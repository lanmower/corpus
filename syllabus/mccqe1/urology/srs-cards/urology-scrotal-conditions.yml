# Urology Scrotal Conditions (Urology) - generated from srs-mccqe1
cards:
  - front: "How do you clinically differentiate testicular torsion from epididymitis?"
    back: "Torsion: absent cremasteric reflex, negative Prehn's sign, diffuse tenderness, horizontal lie. Epididymitis: present cremasteric reflex, positive Prehn's sign, epididymal tenderness.\n\nPrehn's sign: elevation of the testicle relieves pain in epididymitis but not torsion. The cremasteric reflex is absent in torsion due to ischemia of the cord. Torsion is a urological emergency—testicular necrosis occurs in 5-6 hours."
    difficulty: easy
    tags: [urology, testicular torsion, epididymitis, scrotal mass, differential diagnosis]
  - front: "What is the 'blue dot sign' and what does it indicate?"
    back: "The blue dot sign is a blue infarcted appendage visible through the scrotal skin in children, indicating torsion of the testicular or epididymal appendix.\n\nTorsion of the testicular appendix is clinically similar to testicular torsion but can be distinguished by: preserved cremasteric reflex, vertical lie of testicle, and blue dot sign. Treatment is analgesia; most resolve in 5-7 days. Surgical excision if refractory pain."
    difficulty: medium
    tags: [urology, testicular appendix, torsion, blue dot sign, pediatric]
  - front: "What are the varicocele grades?"
    back: "Grade 1: palpable only with Valsalva. Grade 2: palpable without Valsalva. Grade 3: visible through scrotal skin.\n\nVaricocele is dilated and tortuous pampiniform plexus veins due to incompetent venous valves, 90% left-sided. The 'bag of worms' appearance is characteristic. Treatment indications: impaired sperm quality/quantity, pain affecting QOL, failure of affected testis to grow in adolescents."
    difficulty: easy
    tags: [urology, varicocele, grading, infertility]
  - front: "What are the indications for treatment of varicocele?"
    back: "1. Impaired sperm quality or quantity. 2. Pain or dull ache affecting quality of life. 3. Affected testis fails to grow in adolescents. 4. Cosmetic indications.\n\nVaricocele repair (surgical ligation or percutaneous vein occlusion) may improve sperm count and motility. Varicocele is found in 35-40% of infertile males and is the most common correctable cause of male infertility."
    difficulty: medium
    tags: [urology, varicocele, treatment, infertility]
  - front: "How does a hydrocele differ from a spermatocele on clinical exam?"
    back: "Hydrocele: testis NOT separable from the mass, cord palpable, transilluminates. Spermatocele: testis IS separable from the mass, cord palpable, transilluminates, non-tender cystic mass.\n\nBoth transilluminate (fluid-filled), but separation of the testis from the mass distinguishes spermatocele (benign epididymal retention cyst). Hydrocele is a collection of serous fluid in the tunica vaginalis—communicating (patent processus vaginalis, pediatric) or non-communicating (adult)."
    difficulty: medium
    tags: [urology, hydrocele, spermatocele, scrotal mass]
  - front: "What is the emergency management of testicular torsion?"
    back: "Emergency surgical exploration and bilateral orchiopexy. Definitive diagnosis is NOT required before taking the patient to OR. Necrosis occurs within 5-6 hours.\n\nAny acute scrotum in a young male should be treated as torsion until proven otherwise. Manual detorsion can be attempted but surgery is required regardless. Orchiectomy is performed if flow cannot be restored."
    difficulty: easy
    tags: [urology, testicular torsion, emergency, orchiopexy]
