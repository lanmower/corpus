# Nephrology Cystic (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What are the genetic features and extrarenal manifestations of Autosomal Dominant Polycystic Kidney Disease (ADPKD)?"
    back: "Autosomal dominant; two genes: PKD1 (chr 16p, 1:400) and PKD2 (chr 4q, 1:1000). PKD2 accounts for ~10% of renal failure cases. Patients are heterozygous but accumulate 'somatic hits' precipitating cysts. Extrarenal manifestations: hepatic cysts (33%, most common), mitral valve prolapse (25%), intracranial arterial aneurysms (10%), diverticulosis, abdominal/inguinal hernias. Less common: cysts in pancreas, spleen, thyroid, ovary, seminal vesicles, aorta.\n\nThe 'two-hit' model explains why heterozygous carriers develop cysts. PKD1 mutations are more severe (earlier ESRD). Intracranial aneurysms are clinically important — screen if family history of aneurysmal hemorrhage. Polycystic liver disease rarely causes liver failure but can cause mass effect leading to malnutrition."
    difficulty: medium
    tags: [nephrology, ADPKD, polycystic kidney, PKD1, PKD2, intracranial aneurysm, hepatic cysts]
  - front: "What are the signs and symptoms of ADPKD?"
    back: "Often asymptomatic; discovered incidentally or by screening FHx. Symptoms: acute abdominal/flank pain or dull lumbar back pain (from cyst infection, hemorrhage, or stones); hematuria (frequently initial sign); nocturia (urinary concentrating defect); extrarenal: ruptured berry aneurysm, diverticulitis, MVP. HTN in 60-75% (from renin release due to focal intrarenal arterial compression by cysts). Bilateral palpable kidneys.\n\nHematuria is often the first presenting sign (microscopic or gross). Hypertension develops from activation of RAAS due to intrarenal cyst compression — management with ACEI targeting <110/75 mmHg. Clinical manifestations are rare before age 20-25; kidneys are normal at birth but may enlarge to 10x normal size."
    difficulty: easy
    tags: [nephrology, ADPKD, hematuria, HTN, palpable kidneys, berry aneurysm]
  - front: "What is the investigation of choice for confirming ADPKD and how is it confirmed?"
    back: "Ultrasound is confirmatory (enlarged kidneys, multiple cysts throughout renal parenchyma, increased cortical thickness, splaying of renal calyces). CT abdomen with contrast for equivocal cases. MRI for kidney volume measurement. Gene linkage analysis for PKD1 for asymptomatic carriers. Cr, BUN, urine R&M to assess hematuria.\n\nUltrasound is the first-line investigation due to its availability and lack of radiation. The number of cysts required for diagnosis varies by age. MRI is the gold standard for total kidney volume (TKV) measurement, which is used to risk-stratify patients for tolvaptan therapy."
    difficulty: easy
    tags: [nephrology, ADPKD, ultrasound, diagnosis, MRI, kidney volume]
  - front: "What is tolvaptan and when is it used in ADPKD?"
    back: "Tolvaptan is a vasopressin V2 receptor (V2R) antagonist that slows decline of renal function in ADPKD. Indicated in patients aged 18-50 yr with eGFR >45 mL/min and total kidney volume (TKV) >750 mL. Use is limited by side effects (aquaresis, hepatotoxicity).\n\nADH (vasopressin) promotes cyst growth via V2 receptors on cyst epithelial cells (cAMP-mediated). Tolvaptan blocks this, slowing cyst growth. The TEMPO 3:4 trial (NEJM 2017) showed tolvaptan slowed TKV growth and eGFR decline vs. placebo. Encouraging free water intake >2-3 L/d also reduces endogenous ADH, supporting a similar mechanism."
    difficulty: medium
    tags: [nephrology, ADPKD, tolvaptan, vasopressin, V2 receptor, TEMPO trial]
  - front: "Which antibiotics can penetrate ADPKD cyst walls and treat cyst infections?"
    back: "TMP/SMX (trimethoprim-sulfamethoxazole) and ciprofloxacin are able to penetrate cyst walls and achieve therapeutic levels for treating cyst infections.\n\nMost antibiotics cannot penetrate cyst walls effectively. Lipophilic antibiotics like fluoroquinolones and TMP/SMX achieve adequate cyst concentrations. Cyst infections present with fever, flank pain, and elevated inflammatory markers; they are differentiated from nephrolithiasis by leukocytosis and elevated CRP without stone on CT."
    difficulty: easy
    tags: [nephrology, ADPKD, cyst infection, ciprofloxacin, TMP/SMX, antibiotics]
  - front: "What is Autosomal Recessive Polycystic Kidney Disease (ARPKD) and how does it differ from ADPKD?"
    back: "ARPKD: incidence 1:20,000 (vs. ADPKD 1:400-1:1000). Prenatal diagnosis by enlarged kidneys (cystic dilatation of collecting ducts); significant in utero involvement causes Potter sequence. Perinatal death from respiratory failure. Associated with hepatic fibrosis. Survivors develop CHF, HTN, CKD, portal hypertension. Treatment: dialysis, kidney ± liver transplant.\n\nPotter sequence (pulmonary hypoplasia, limb deformities, characteristic facies) results from severe oligohydramnios due to absent fetal urine production. ARPKD involves collecting duct dilatation (vs. ADPKD which involves all nephron segments). Hepatic fibrosis is a consistent feature of ARPKD, distinguishing it from ADPKD (which has hepatic cysts, not fibrosis)."
    difficulty: medium
    tags: [nephrology, ARPKD, polycystic kidney, Potter sequence, hepatic fibrosis, pediatric]
  - front: "What are the features of Medullary Sponge Kidney?"
    back: "Common; autosomal dominant; usually diagnosed in 4th-5th decades. Multiple cystic dilatations in collecting ducts of medulla. Features: renal stones, hematuria, recurrent UTIs. 10% of patients presenting with renal stones have medullary sponge kidney. Nephrocalcinosis on abdominal X-ray in 50% (often asymptomatic). Diagnosis: contrast-filled medullary cysts on IVP → 'bouquet of flowers' radial pattern; 'Swiss cheese' appearance on histology. Does NOT result in renal failure.\n\nThe 'bouquet of flowers' appearance on IVP is pathognomonic. Medullary sponge kidney is distinguished from other cystic diseases by its medullary-only involvement, lack of progression to ESRD, and characteristic IVP appearance. Treatment is symptomatic — treat UTIs and stone formation."
    difficulty: medium
    tags: [nephrology, medullary sponge kidney, nephrocalcinosis, renal stones, IVP, bouquet of flowers]
  - front: "A patient with ADPKD develops a fever and flank pain. Which antibiotics should be chosen for a suspected cyst infection and why?"
    back: "TMP/SMX or ciprofloxacin — both are lipophilic and penetrate cyst walls to achieve therapeutic levels within cysts. Standard beta-lactams and aminoglycosides cannot penetrate cyst walls effectively.\n\nCyst infections in ADPKD are difficult to treat because most antibiotics cannot reach therapeutic concentrations within cyst fluid. Fluoroquinolones (ciprofloxacin) and TMP/SMX are lipophilic, allowing cyst penetration. Blood cultures, urine culture, and CT scan are part of the workup. Prolonged courses (4-6 weeks) are typically required."
    difficulty: medium
    tags: [nephrology, ADPKD, cyst infection, ciprofloxacin, TMP/SMX, antibiotic penetration]
