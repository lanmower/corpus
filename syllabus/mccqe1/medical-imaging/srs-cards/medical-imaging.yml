# Medical Imaging (Medical Imaging) - generated from srs-mccqe1
cards:
  - front: "What are the 3 standard views of an abdominal X-ray (AXR)?"
    back: "Erect/Upright, Supine, and Left lateral decubitus.\n\nThese three views allow detection of free air (best on upright or left lateral decubitus), air-fluid levels, and assessment of bowel gas patterns. The left lateral decubitus is particularly useful when the patient cannot stand upright."
    difficulty: easy
    tags: [medical imaging, abdominal x-ray]
  - front: "What is the '3, 6, 9' rule for bowel dilation on imaging?"
    back: "Maximum normal diameter: small bowel = 3 cm, large bowel = 6 cm, cecum = 9 cm.\n\nThis rule helps determine when bowel is abnormally dilated and can distinguish small from large bowel. A cecum >9 cm raises concern for impending perforation, such as in untreated Ogilvie's syndrome."
    difficulty: easy
    tags: [medical imaging, bowel obstruction, abdominal imaging]
  - front: "What mnemonic is used for the systematic approach to abdominal X-ray interpretation?"
    back: "'Free ABDO' — Free air/fluid, Air in bowel, Bowel wall thickening, Densities, Organs.\n\nThis systematic approach ensures thorough evaluation of the AXR. 'Free' refers to free intraperitoneal air and fluid, 'A' to intraluminal air patterns, 'B' to bowel wall changes, 'D' to calcifications and bony abnormalities, and 'O' to organ outlines."
    difficulty: easy
    tags: [medical imaging, abdominal x-ray, clinical approach]
  - front: "How do you differentiate small bowel from large bowel on abdominal X-ray?"
    back: "Small bowel: central location, valvulae conniventes (uninterrupted folds), max diameter 3 cm, rarely contains solid feces. Large bowel: peripheral (picture frame), haustra (interrupted folds), max diameter 6 cm (9 cm cecum), commonly contains solid feces.\n\nValvulae conniventes traverse the entire lumen of small bowel, while haustra only extend partway across the large bowel lumen. Location and fold pattern are the most reliable distinguishing features."
    difficulty: easy
    tags: [medical imaging, abdominal x-ray, anatomy]
  - front: "What is the 'coffee bean' sign on abdominal X-ray and what does it indicate?"
    back: "A massively dilated sigmoid colon projecting to the right or mid-upper abdomen, indicating sigmoid volvulus.\n\nSigmoid volvulus is the most common type of volvulus. The twisted sigmoid loop fills with gas and takes on the appearance of a coffee bean. Proximal bowel dilation is also typically present."
    difficulty: easy
    tags: [medical imaging, abdominal x-ray, volvulus]
  - front: "What does portal venous air on abdominal X-ray suggest?"
    back: "Bowel ischemia/infarction.\n\nPortal venous air appears as a peripheral branching pattern over the liver. It is an ominous sign most commonly associated with bowel ischemia or infarction, and should prompt urgent further evaluation."
    difficulty: medium
    tags: [medical imaging, abdominal x-ray, bowel ischemia]
  - front: "What are the key differences between adynamic (paralytic) ileus and mechanical bowel obstruction on imaging?"
    back: "Ileus: normal/dilated bowel, same-level air-fluid levels, gas throughout GI tract. Obstruction: dilated bowel proximal to transition point, multiple step-ladder air-fluid levels, no air distal to obstruction, hairpin turns.\n\nIn ileus, air is distributed throughout the GI tract because peristalsis is globally reduced. In mechanical obstruction, the bowel proximal to the block dilates while distal bowel is decompressed, creating a clear transition point."
    difficulty: medium
    tags: [medical imaging, abdominal x-ray, bowel obstruction, ileus]
  - front: "What is toxic megacolon and how does it appear on abdominal X-ray?"
    back: "Extreme dilatation of the colon (>6.5 cm) with mucosal changes (edema, ulceration, pseudopolyps) and loss of normal haustral pattern, as a manifestation of fulminant colitis.\n\nToxic megacolon is a life-threatening complication of conditions like ulcerative colitis or C. difficile infection. The loss of haustral markings and extreme dilation are the hallmark imaging findings on plain film."
    difficulty: medium
    tags: [medical imaging, abdominal x-ray, toxic megacolon]
  - front: "What is the 'string of pearls' sign on abdominal imaging?"
    back: "A row of small gas accumulations trapped in the dilated valvulae conniventes of obstructed small bowel, seen on erect or left lateral decubitus films.\n\nThis sign indicates mechanical small bowel obstruction. The small pockets of gas are trapped between the folds of the valvulae conniventes in fluid-filled dilated loops, appearing as a string of small bubbles."
    difficulty: medium
    tags: [medical imaging, abdominal x-ray, bowel obstruction]
  - front: "What is the 'football sign' on abdominal X-ray?"
    back: "A large oval lucency over the abdomen on supine film, representing massive pneumoperitoneum outlining the peritoneal cavity.\n\nThe football sign is seen on supine abdominal films when a large amount of free air outlines the entire peritoneal cavity, making it appear like an American football. It indicates pneumoperitoneum from hollow viscus perforation."
    difficulty: medium
    tags: [medical imaging, abdominal x-ray, pneumoperitoneum]
  - front: "What are the indications for abdominal CT with IV contrast phases (portal venous vs. biphasic)?"
    back: "Portal venous phase: majority of cases. Biphasic (arterial + portal venous): liver, pancreas, and bile duct tumours.\n\nThe portal venous phase provides the best contrast between normal and abnormal tissue for most abdominal pathology. Biphasic imaging is needed for hypervascular tumours that enhance in the arterial phase and may wash out in the venous phase."
    difficulty: easy
    tags: [medical imaging, CT, contrast agents]
  - front: "What are the contraindications and cautions for IV contrast in CT?"
    back: "Contraindication: impaired renal function (eGFR <30 mL/min/1.73 m²). Caution: contrast allergy (may pre-medicate with steroids and antihistamines).\n\nIV iodinated contrast can cause contrast-induced nephropathy in patients with significantly reduced renal function. For patients with known contrast allergy, premedication with corticosteroids and antihistamines can reduce the risk of anaphylactoid reactions."
    difficulty: easy
    tags: [medical imaging, CT, contrast agents, patient safety]
  - front: "When should water-soluble oral contrast be used instead of barium for abdominal CT?"
    back: "Water-soluble contrast should be used when there is suspected bowel perforation.\n\nBarium leaking into the peritoneal cavity through a perforation causes severe peritonitis and is difficult to remove surgically. Water-soluble contrast is reabsorbed and does not cause this complication."
    difficulty: easy
    tags: [medical imaging, CT, contrast agents]
  - front: "What is a closed-loop bowel obstruction and why is it dangerous?"
    back: "An obstruction in two locations creating a loop of bowel obstructed both proximally and distally. It is dangerous because complications (ischemia, perforation, necrosis) may occur quickly.\n\nClosed-loop obstruction is a surgical emergency because the trapped segment cannot decompress in either direction. The increasing intraluminal pressure rapidly compromises blood supply, leading to ischemia, necrosis, and perforation."
    difficulty: medium
    tags: [medical imaging, CT, bowel obstruction]
  - front: "What are the indications for CT colonography (virtual colonoscopy)?"
    back: "Surveillance in low-risk patients, incomplete colonoscopy, or staging of obstructing colonic lesions.\n\nCT colonography uses prone and supine CT scans after carbon dioxide insufflation to reconstruct 3D intraluminal views of the colon. It is highly sensitive for colorectal cancer detection and serves as an alternative when optical colonoscopy is incomplete or not feasible."
    difficulty: easy
    tags: [medical imaging, CT colonography, colorectal cancer]
  - front: "What imaging findings suggest acute cholecystitis on ultrasound?"
    back: "Most sensitive: gallstones + positive sonographic Murphy's sign. Secondary: thickened gallbladder wall (>3 mm), dilated gallbladder, pericholecystic fluid.\n\nUltrasound is the best imaging modality for acute cholecystitis with the highest sensitivity and specificity. The sonographic Murphy's sign is tenderness elicited when the ultrasound probe is pressed directly over the visualized gallbladder."
    difficulty: easy
    tags: [medical imaging, ultrasound, cholecystitis, hepatobiliary]
  - front: "What is the best imaging modality for acute cholecystitis, and what nuclear medicine test can help in equivocal cases?"
    back: "Best: ultrasound. For equivocal cases: HIDA scan (cholescintigraphy).\n\nU/S has the best sensitivity and specificity for cholecystitis. The HIDA scan uses 99mTc-labeled agents taken up by hepatocytes and excreted into bile. Non-visualization of the gallbladder at 4 hours or 1 hour after morphine indicates acute cholecystitis (cystic duct obstruction)."
    difficulty: easy
    tags: [medical imaging, ultrasound, nuclear medicine, cholecystitis]
  - front: "What are the cardinal CT signs of acute diverticulitis?"
    back: "Thickened bowel wall, mesenteric fat infiltration/stranding, gas-filled diverticula, and abscess formation.\n\nCT is the best imaging modality for diverticulitis. It can also be used for percutaneous abscess drainage. It may be difficult to distinguish diverticulitis from perforated cancer, so follow-up colonoscopy is recommended."
    difficulty: easy
    tags: [medical imaging, CT, diverticulitis]
  - front: "How does a hepatic hemangioma appear on CT with contrast?"
    back: "Peripheral globular enhancement in the arterial phase with central filling and persistent enhancement on delayed scans.\n\nThis characteristic pattern of progressive centripetal filling distinguishes hemangiomas from malignant lesions. On ultrasound, hemangiomas appear as homogeneous hyperechoic masses. Four-phase CT is used to distinguish hemangiomas from other liver tumours."
    difficulty: medium
    tags: [medical imaging, CT, liver masses, hemangioma]
  - front: "How does hepatocellular carcinoma (HCC) appear on contrast-enhanced CT?"
    back: "Hypervascular lesion that enhances in the arterial phase and washes out in the venous phase, with possible portal venous tumour thrombus.\n\nThe arterial enhancement with venous washout pattern is characteristic of HCC. Portal vein tumour thrombus, when present, is a hallmark finding that distinguishes HCC from other liver lesions and indicates vascular invasion."
    difficulty: medium
    tags: [medical imaging, CT, liver masses, HCC]
  - front: "What does it mean if the liver appears less dense than the spleen on non-contrast CT?"
    back: "Suspect fatty infiltration of the liver.\n\nNormally, the liver appears more dense (brighter) than the spleen on CT. Fatty infiltration deposits lipid within hepatocytes, decreasing liver density. This can be seen in conditions such as NAFLD, alcoholic liver disease, and metabolic syndrome."
    difficulty: easy
    tags: [medical imaging, CT, liver, fatty liver]
  - front: "What is the role of MRCP vs ERCP in biliary and pancreatic imaging?"
    back: "MRCP: non-invasive MRI imaging of ductal system, no therapeutic potential. ERCP: invasive endoscopic imaging with therapeutic potential (stent placement, stone retrieval), but 5% risk of pancreatitis for diagnostic and 10% for therapeutic procedures.\n\nMRCP has largely replaced diagnostic ERCP because it is non-invasive. ERCP is now reserved for situations where therapeutic intervention is needed. The significant risk of post-ERCP pancreatitis makes it inappropriate as a purely diagnostic test."
    difficulty: medium
    tags: [medical imaging, MRI, ERCP, hepatobiliary, pancreas]
  - front: "What is the Bosniak classification system used for?"
    back: "Classification of cystic renal masses to determine likelihood of malignancy and guide management: Class I-II (benign, disregard), Class IIF (follow), Class III-IV (suspicious for malignancy, require workup).\n\nThe Bosniak system categorizes renal cysts based on CT features including wall thickness, septation, calcification, and enhancement with contrast. Class IV includes soft tissue enhancement with >10 Hounsfield unit increase, characterizing vascularity."
    difficulty: medium
    tags: [medical imaging, CT, renal masses, Bosniak classification]
  - front: "What is the best initial imaging for suspected renal colic?"
    back: "Non-contrast CT KUB (plain CT) is the standard. Ultrasound can also be used as initial imaging.\n\nPlain CT is highly sensitive for renal calculi and can assess stone size, location, and complications like hydronephrosis. The STONE trial showed that initial U/S had similar outcomes to CT with less radiation exposure, making U/S a reasonable first choice."
    difficulty: easy
    tags: [medical imaging, CT, renal colic, nephrolithiasis]
  - front: "What types of renal stones are NOT visible on KUB X-ray?"
    back: "Uric acid stones and indinavir stones are radiolucent and not visible on plain X-ray.\n\nMost renal stones are radiopaque (calcium-containing) and visible on X-ray. Uric acid stones lack calcium and are radiolucent, requiring CT for detection. Indinavir is an HIV protease inhibitor that can form radiolucent stones."
    difficulty: easy
    tags: [medical imaging, abdominal x-ray, renal stones]
  - front: "What is the first-line imaging study when urethral injury is suspected?"
    back: "Retrograde urethrogram.\n\nSigns of urethral injury include blood at the urethral meatus, scrotal hematoma, or high-riding prostate. A retrograde urethrogram must be performed before inserting a Foley catheter, as blind catheterization could worsen the injury."
    difficulty: easy
    tags: [medical imaging, urethrogram, urethral injury, trauma]
  - front: "What is the best imaging modality for evaluating vesicoureteral reflux?"
    back: "Voiding cystourethrogram (VCUG).\n\nVCUG involves filling the bladder with contrast and using fluoroscopy during voiding to visualize reflux of contrast into the ureters. It is indicated in males or young females with recurrent UTIs, hydronephrosis, or suspected lower urinary tract obstruction."
    difficulty: easy
    tags: [medical imaging, fluoroscopy, vesicoureteral reflux]
  - front: "How do epidural and subdural hematomas appear on head CT?"
    back: "Epidural: lentiform (lens-shaped) hyperdensity in the epidural space. Subdural: crescent-shaped hyperdensity in the subdural space.\n\nEpidural hematomas are typically caused by rupture of the middle meningeal artery and are limited by dural attachments at suture lines, creating a biconvex shape. Subdural hematomas spread along the brain surface beneath the dura, conforming to its crescent shape."
    difficulty: easy
    tags: [medical imaging, CT, neuroradiology, intracranial hemorrhage]
  - front: "What is the 'insular ribbon sign' on CT?"
    back: "Hypodensity of the insular cortex representing an early sign of MCA territory infarction.\n\nThe insular cortex is one of the earliest areas to show ischemic changes because it is the farthest from collateral blood supply in the MCA territory. This subtle loss of grey-white differentiation can be seen within the first 6 hours of stroke onset."
    difficulty: hard
    tags: [medical imaging, CT, neuroradiology, stroke]
  - front: "What is the 'hyperdense MCA sign' on CT?"
    back: "A hyperattenuating (bright) middle cerebral artery on non-contrast CT, representing intravascular thrombus/embolus in ischemic stroke.\n\nThis sign can be seen in the hyperacute phase of ischemic stroke (0-24 hours). The thrombus appears hyperdense relative to surrounding brain tissue. It is an early clue to MCA occlusion before parenchymal changes become apparent."
    difficulty: medium
    tags: [medical imaging, CT, neuroradiology, stroke]
  - front: "When is MRI superior to CT for stroke imaging, and what sequence is most helpful?"
    back: "MRI with DWI (diffusion-weighted imaging) can detect infarction within minutes of arterial occlusion, whereas CT is usually normal within the first 6 hours.\n\nDWI detects restricted water diffusion caused by cytotoxic edema in ischemic tissue. This makes MRI far more sensitive for hyperacute stroke. However, CT is more frequently used initially due to its speed, availability, and lower cost."
    difficulty: medium
    tags: [medical imaging, MRI, neuroradiology, stroke]
  - front: "What are 'Dawson's fingers' on MRI and what condition are they associated with?"
    back: "Perivenular regions of demyelination radiating outward into the deep periventricular white matter, characteristic of multiple sclerosis.\n\nDawson's fingers are seen on T2-weighted or FLAIR MRI sequences. They represent perivenous inflammation and demyelination extending perpendicular to the lateral ventricles. MRI has >90% sensitivity for diagnosing MS."
    difficulty: medium
    tags: [medical imaging, MRI, neuroradiology, multiple sclerosis]
  - front: "What are the characteristic MRI locations of MS plaques?"
    back: "Juxtacortical (grey-white junction), periventricular, infratentorial, and spinal cord.\n\nThese four locations are part of the McDonald criteria for MS diagnosis. Plaques are hyperintense on T2 and hypointense on T1. Active lesions enhance with gadolinium contrast, indicating ongoing inflammation and blood-brain barrier breakdown."
    difficulty: easy
    tags: [medical imaging, MRI, neuroradiology, multiple sclerosis]
  - front: "What is the best imaging modality for herpes simplex encephalitis and what are the findings?"
    back: "MRI (T1 and T2-weighted). Findings: asymmetric high-intensity lesions on T2 in temporal and inferior frontal lobes.\n\nHSV encephalitis asymmetrically affects the limbic system, particularly the temporal lobes, orbitofrontal region, insula, and cingulate gyrus. CT may show temporal lobe hypodensity but is less sensitive than MRI, especially in the acute phase (within 4-5 days)."
    difficulty: medium
    tags: [medical imaging, MRI, neuroradiology, encephalitis]
  - front: "What are the four stages of cerebral abscess formation and their imaging appearance?"
    back: "1) Early cerebritis (1-3d): low T1, high T2. 2) Late cerebritis (4-9d): ring enhancement may appear. 3) Early capsule (10-13d): ring enhancement. 4) Late capsule (>14d): well-demarcated ring-enhancing lesion with low-intensity core, mass effect, and surrounding T2 edema.\n\nMRI with DWI is the best imaging modality as abscesses show restricted diffusion (DWI positive), helping distinguish them from necrotic tumors. The progressive capsule formation and characteristic ring enhancement are key diagnostic features."
    difficulty: hard
    tags: [medical imaging, MRI, neuroradiology, cerebral abscess]
  - front: "What is the systematic approach to head CT interpretation (mnemonic)?"
    back: "'ABCD PV' — Skin/soft tissue, Bone/Airspace, (C is not explicit), Dura/Subdural space, Parenchyma, Ventricles/sulci/cisterns. Work superficial to deep.\n\nThis anatomic approach from superficial to deep ensures systematic evaluation. Each layer is assessed for abnormalities: soft tissue for hematoma, bone for fractures, dura for extra-axial collections, parenchyma for infarcts or hemorrhage, and ventricles for hydrocephalus or blood."
    difficulty: easy
    tags: [medical imaging, CT, neuroradiology, clinical approach]
  - front: "What distinguishes communicating from non-communicating hydrocephalus on imaging?"
    back: "Communicating: all ventricles dilated (impaired CSF reabsorption). Non-communicating: only ventricles proximal to the obstruction are dilated.\n\nIn communicating hydrocephalus, CSF flow within the ventricular system is unobstructed but reabsorption is impaired. In non-communicating hydrocephalus, a mass or lesion blocks CSF flow at a specific point (e.g., aqueduct, foramen of Monro), causing upstream dilation."
    difficulty: easy
    tags: [medical imaging, CT, neuroradiology, hydrocephalus]
  - front: "What is the minimum number of X-ray views required for fracture evaluation, and what additional structures must be imaged?"
    back: "Minimum two orthogonal views (usually AP and lateral). Must image the joint proximal and distal to the injury site.\n\nTwo views are needed because a fracture may not be visible on a single projection. Imaging adjacent joints ensures associated dislocations or second fractures are not missed, particularly important with bony rings (e.g., radius/ulna, tibia/fibula)."
    difficulty: easy
    tags: [medical imaging, x-ray, musculoskeletal, fractures]
  - front: "What imaging features distinguish aggressive (malignant) from non-aggressive (benign) bone lesions on X-ray?"
    back: "Malignant: wide zone of transition, aggressive periosteal reaction (Codman triangle, sunburst, onion skin), cortical destruction, soft tissue mass, extraosseous/irregular calcification. Benign: narrow zone of transition, sharp borders, no soft tissue mass, no periosteal reaction.\n\nThe zone of transition between lesion and normal bone is the most important feature. A narrow zone suggests a slow-growing process while a wide zone suggests rapid, aggressive growth. Codman triangle represents elevated periosteum from rapid tumor growth."
    difficulty: medium
    tags: [medical imaging, x-ray, musculoskeletal, bone tumours]
  - front: "What is DEXA and what T-score values define osteopenia and osteoporosis?"
    back: "DEXA (Dual-Energy X-ray Absorptiometry) is the gold standard for measuring bone mineral density. Osteopenia: T-score between -1 and -2.5. Osteoporosis: T-score ≤ -2.5.\n\nThe T-score compares a patient's bone density to the young adult mean. DEXA is typically measured at the hip and lumbar spine. The Z-score (comparison to age-matched mean) is more useful for detecting secondary osteoporosis."
    difficulty: easy
    tags: [medical imaging, DEXA, osteoporosis, metabolic bone disease]
  - front: "What are Looser zones (pseudofractures) and what condition are they pathognomonic for?"
    back: "Thin transverse lucent lines perpendicular to the bone cortex, often symmetric and bilateral, pathognomonic for osteomalacia.\n\nLooser zones appear at sites of stress in inadequately mineralized bone, commonly at femoral necks, shafts, and pubic/ischial rami. Osteomalacia results from deficiency of vitamin D, calcium, or phosphate, leading to impaired bone mineralization."
    difficulty: medium
    tags: [medical imaging, x-ray, osteomalacia, metabolic bone disease]
  - front: "What is the V/Q scan and how does an unmatched defect relate to pulmonary embolism?"
    back: "V/Q scan compares ventilation and perfusion. An unmatched defect (well-ventilated but not perfused area) is suspicious for pulmonary embolism.\n\nIn PE, blood flow is blocked by the embolus (perfusion defect) but the alveoli remain ventilated. This ventilation-perfusion mismatch produces wedge-shaped defects extending to the periphery, usually bilateral and multiple."
    difficulty: easy
    tags: [medical imaging, nuclear medicine, V/Q scan, pulmonary embolism]
  - front: "On nuclear myocardial perfusion imaging, how do you differentiate ischemia from infarction?"
    back: "Reversible defect (present only during stress) = ischemia. Persistent/fixed defect (present at rest and stress) = infarction/scar.\n\nDuring stress, stenosed coronary arteries cannot increase blood flow to meet demand, creating a perfusion defect. At rest, flow is adequate so the defect resolves (reversible). Infarcted tissue has no viable myocardium and shows a fixed defect regardless of stress."
    difficulty: easy
    tags: [medical imaging, nuclear medicine, myocardial perfusion, cardiology]
  - front: "What differentiates hot, cold, and warm thyroid nodules on scintigraphy, and which require biopsy?"
    back: "Hot (hyperfunctioning): usually benign, <1% cancer, no FNA needed. Cold (hypofunctioning): 6-10% are cancerous, biopsy based on clinical/sonographic features. Warm (isointense): may represent cold nodules superimposed on normal tissue, cancer possible.\n\nThyroid scintigraphy uses 99mTc-pertechnetate or radioactive iodine. Hot nodules autonomously produce thyroid hormone and rarely harbor cancer. Cold nodules do not take up radiotracer and have a higher malignancy risk, warranting further evaluation."
    difficulty: medium
    tags: [medical imaging, nuclear medicine, thyroid, thyroid nodules]
  - front: "What does increased vs decreased radioactive iodine uptake (RAIU) indicate?"
    back: "Increased: Graves' disease, toxic multinodular goitre, toxic adenoma. Decreased: subacute thyroiditis, late Hashimoto's, exogenous thyroid hormone/iodine.\n\nRAIU helps differentiate causes of hyperthyroidism only, not hypothyroidism. Graves' disease shows diffusely increased uptake, while subacute thyroiditis shows decreased uptake because inflammation causes release of preformed hormone without new synthesis."
    difficulty: easy
    tags: [medical imaging, nuclear medicine, thyroid, RAIU]
  - front: "What is the BI-RADS classification system and what actions does each category require?"
    back: "BI-RADS 0: incomplete, need more imaging. 1: negative, routine screening. 2: benign, routine screening. 3: probably benign (<2% malignancy), 6-month follow-up. 4: suspicious (3-94%), biopsy. 5: highly suspicious (≥95%), biopsy. 6: known malignancy.\n\nBI-RADS standardizes mammographic reporting and guides management decisions. Category 4 is subdivided into 4A (low suspicion, 3-10%), 4B (moderate, 10-50%), and 4C (high, 51-94%). All category 4 and 5 lesions require tissue sampling."
    difficulty: medium
    tags: [medical imaging, mammography, breast imaging, BI-RADS]
  - front: "When is breast ultrasound preferred over mammography as first-line imaging?"
    back: "U/S is first-line in women <30 years (denser breast tissue makes mammograms less sensitive) and in lactating/pregnant women.\n\nYoung women have dense fibroglandular breast tissue that appears white on mammography, potentially obscuring lesions. Ultrasound is not limited by tissue density and avoids radiation exposure, making it ideal for young and pregnant patients."
    difficulty: easy
    tags: [medical imaging, ultrasound, breast imaging]
  - front: "What mammographic features suggest a malignant breast mass?"
    back: "Irregular shape, indistinct/spiculated margins, radiodense, and suspicious calcifications (pleomorphic, fine linear, clustered, segmental).\n\nBenign masses tend to be round/oval with circumscribed margins. Spiculated margins with radiating lines suggest infiltrating cancer. Pleomorphic microcalcifications varying in size and shape in a clustered or segmental distribution are highly suspicious for DCIS or invasive cancer."
    difficulty: medium
    tags: [medical imaging, mammography, breast cancer]
  - front: "What are the indications for IVC filter placement?"
    back: "Contraindication to anticoagulation, failure of adequate anticoagulation (recurrent PE despite therapeutic levels), or complication of anticoagulation requiring termination (e.g., life-threatening hemorrhage).\n\nIVC filters are inserted via femoral, jugular, or basilic vein and placed infrarenally. The PREPIC trial showed filters prevented PE within 12 days but increased recurrent DVT within 2 years with no mortality difference, so they are reserved for specific indications."
    difficulty: medium
    tags: [medical imaging, interventional radiology, IVC filter, pulmonary embolism]
  - front: "What is the best imaging modality for osteomyelitis and what is the key MRI finding?"
    back: "MRI is most sensitive. Key finding: loss of normal fatty T1 marrow signal, which is diagnostic of osteomyelitis.\n\nNormal bone marrow is fatty and appears bright on T1-weighted images. Osteomyelitis replaces this fatty marrow with inflammatory tissue, causing T1 signal loss. MRI can also assess extra-osseous soft tissue involvement. X-ray can detect changes only after >1 week."
    difficulty: medium
    tags: [medical imaging, MRI, musculoskeletal, osteomyelitis]
  - front: "What imaging modality is best for evaluating carotid artery disease?"
    back: "Duplex Doppler ultrasound is the best initial modality. MRA or CTA if endarterectomy or angioplasty is being considered.\n\nDuplex U/S combines B-mode imaging with Doppler flow assessment to evaluate plaque morphology and degree of stenosis non-invasively. If surgical intervention is planned, CTA or MRA provides more detailed anatomic information for surgical planning."
    difficulty: easy
    tags: [medical imaging, ultrasound, carotid disease, vascular imaging]
  - front: "What must be ruled out before performing CT of a female pelvis?"
    back: "Pregnancy — must check beta-hCG before CT.\n\nCT involves ionizing radiation that poses teratogenic risk to a developing fetus, particularly in the first trimester. A serum or urine beta-hCG should be obtained for all women of childbearing age before pelvic CT or any CT involving the abdomen."
    difficulty: easy
    tags: [medical imaging, CT, radiation safety, pregnancy]
  - front: "What is the role of elastography (FibroScan) in liver imaging?"
    back: "Non-invasively quantifies liver fibrosis by measuring shear wave velocity using ultrasound or MRI (MR elastography).\n\nElastography has largely replaced liver biopsy for staging fibrosis in chronic liver disease. It measures tissue stiffness, which correlates with fibrosis severity. It is particularly useful for monitoring disease progression in hepatitis and NAFLD."
    difficulty: easy
    tags: [medical imaging, ultrasound, liver, elastography]
  - front: "What is the minimum active bleeding rate required for angiography to detect a GI bleed?"
    back: "1.5 mL/min under optimal conditions.\n\nAngiography requires active bleeding to visualize the extravasation of contrast. For bleeding rates <0.5 mL/min, a tagged RBC scan is more appropriate. For rates >0.5 mL/min, angiography is preferred as it is both diagnostic and therapeutic."
    difficulty: medium
    tags: [medical imaging, angiography, GI bleeding, interventional radiology]
  - front: "What are the advantages of MRI over CT?"
    back: "Better contrast resolution and tissue discrimination, no ionizing radiation, safer contrast agents (gadolinium), and ability to image directly in multiple planes (coronal, sagittal, oblique).\n\nMRI's superior soft tissue contrast makes it ideal for neurological, musculoskeletal, and pelvic imaging. The lack of radiation makes it preferable for serial follow-up imaging. However, CT remains faster, more available, and cheaper for acute situations."
    difficulty: easy
    tags: [medical imaging, MRI, imaging modalities]
  - front: "What is the hierarchy of attenuation for different tissues on X-ray, from least to most attenuating?"
    back: "Air < Fat < Water < Bone < Metal. Structures with higher attenuation (e.g., bone) appear white on X-ray images.\n\nX-ray photons are absorbed (attenuated) differently depending on tissue density. The denser the material, the more photons it absorbs and the whiter it appears. This fundamental principle underlies all plain film interpretation."
    difficulty: easy
    tags: [radiology, x-ray, attenuation, imaging-physics]
  - front: "What are the main advantages and disadvantages of plain film X-ray?"
    back: "Advantages: inexpensive, non-invasive, readily available, portable, reproducible, fast, easily read. Disadvantages: radiation exposure (minimal), generally poor at distinguishing soft tissues.\n\nPlain films remain a cornerstone of diagnostic imaging due to their accessibility and speed. Their primary limitation is poor soft tissue contrast, which is why CT and MRI are used when more detail is needed."
    difficulty: easy
    tags: [radiology, plain-film, imaging-modalities]
  - front: "In fluoroscopy, how does the appearance of radiolucent and radiopaque structures differ from plain film?"
    back: "On fluoroscopy, structures that are radiolucent on plain film appear bright, and structures that are radiopaque on plain film appear dark — the inverse of plain film.\n\nFluoroscopy uses continuous x-rays and displays a live image where the contrast is inverted relative to conventional plain film. This is important to recognize when interpreting fluoroscopic studies such as GI contrast examinations."
    difficulty: medium
    tags: [radiology, fluoroscopy, imaging-modalities]
  - front: "What are Hounsfield units, and how are windowing and leveling used in CT?"
    back: "Hounsfield units quantify attenuation in CT. Windowing adjusts the range of Hounsfield units displayed (window width), and leveling sets the midpoint value (window level) to maximize visualization of specific anatomical structures (e.g., lung, soft tissue, or bone windows).\n\nBy adjusting window width and level, radiologists can optimize contrast for different tissue types on the same CT dataset. For example, a lung window uses a wide width and low level to show air-filled structures, while a bone window uses narrow width and high level."
    difficulty: medium
    tags: [radiology, CT, hounsfield-units, windowing]
  - front: "What are the relative contraindications to CT scanning?"
    back: "Pregnancy (relative) and adverse reactions to contrast agents (e.g., previous anaphylaxis/allergy, renal failure).\n\nCT uses ionizing radiation, which poses theoretical teratogenic risk in pregnancy. Iodinated contrast agents can cause anaphylactic reactions and contrast-induced nephropathy, particularly in patients with pre-existing renal insufficiency."
    difficulty: easy
    tags: [radiology, CT, contraindications, contrast-agents]
  - front: "In ultrasound, what is acoustic shadowing and what causes it?"
    back: "Acoustic shadowing is the echo-free (dark) area located behind an interface that strongly reflects (e.g., air) or absorbs (e.g., bone) sound waves. The structure behind the reflector receives little to no sound energy and therefore appears dark.\n\nAcoustic shadowing is a key artifact in ultrasound that can help identify structures like gallstones or calcifications. It also limits visualization of structures behind bone or gas-filled bowel."
    difficulty: medium
    tags: [radiology, ultrasound, artifacts, acoustic-shadowing]
  - front: "In colour Doppler ultrasound, what do red and blue colours signify?"
    back: "Red = blood flow toward the transducer; Blue = blood flow away from the transducer.\n\nColour Doppler uses the Doppler effect to assign colours based on the direction of blood flow relative to the transducer. This mnemonic (BART: Blue Away, Red Toward) is helpful for identifying arteries and veins and detecting flow abnormalities."
    difficulty: easy
    tags: [radiology, ultrasound, doppler, colour-doppler]
  - front: "What are the advantages of ultrasound compared to other imaging modalities?"
    back: "Relatively low cost, excellent spatial and soft tissue contrast resolution, non-invasive, no radiation, portable, real-time imaging, may be used for guided biopsies, multiple imaging planes, differentiates cystic vs. solid structures.\n\nUltrasound is particularly useful in pregnancy (no radiation), for evaluating abdominal organs, and for guiding procedures. Its main limitations include operator dependence and inability to image through air or bone."
    difficulty: easy
    tags: [radiology, ultrasound, advantages]
  - front: "On MRI, how do T1-weighted and T2-weighted images differ in signal intensity for fluid and fat?"
    back: "T1-weighted: fluid is hypointense (dark), fat is hyperintense (bright). T2-weighted: fluid is hyperintense (bright), fat is hypointense (dark). Mnemonic: T2 = 'World War II' = water is white.\n\nT1 is often considered an anatomic scan (fat bright), while T2 is considered a pathologic scan as edematous/fluid-containing areas appear bright, highlighting pathological changes. This distinction is fundamental to MRI interpretation."
    difficulty: medium
    tags: [radiology, MRI, T1, T2, signal-intensity]
  - front: "What is diffusion-weighted imaging (DWI) on MRI, and what does it detect?"
    back: "DWI measures the free molecular motion of water. Decreased diffusion appears hyperintense (bright), and increased diffusion appears hypointense (dark). It is sensitive for detecting acute ischemic stroke and differentiating it from other neurologic pathologies. Acute infarcts and abscesses appear hyperintense due to restricted diffusion.\n\nIn ischemic stroke and abscesses, water movement is restricted (cytotoxic edema, viscous pus), causing bright signal on DWI. This distinguishes acute from chronic infarcts and abscesses from other ring-enhancing lesions."
    difficulty: medium
    tags: [radiology, MRI, DWI, stroke, abscess]
  - front: "What are the contraindications to IV contrast in CT (iodinated agents)?"
    back: "Previous adverse reaction to contrast, renal failure, diabetes mellitus (DM), pregnancy, multiple myeloma, severe heart failure, and dehydration. eGFR <60 may require preventative measures and follow-up.\n\nIodinated contrast can cause anaphylactic reactions and contrast-induced nephropathy. Metformin should be withheld in patients with renal impairment due to risk of lactic acidosis. Pre-hydration with 0.9% NaCl or NaHCO3 reduces nephropathy risk."
    difficulty: medium
    tags: [radiology, contrast-agents, contraindications, iodinated-contrast]
  - front: "What are the contraindications to IV gadolinium (MRI contrast)?"
    back: "Previous adverse reaction to contrast, or end-stage renal disease (relative contraindication) due to the risk of nephrogenic systemic fibrosis (NSF).\n\nGadolinium chelates shorten T1 relaxation time, increasing signal in T1-weighted sequences and highlighting vascular structures. In end-stage renal disease, gadolinium can deposit in tissues and cause NSF, a rare but serious fibrosing condition."
    difficulty: medium
    tags: [radiology, MRI, gadolinium, nephrogenic-systemic-fibrosis, contraindications]
  - front: "What are contraindications to IV contrast in CT for myasthenia gravis patients?"
    back: "Myasthenia gravis is listed as a contraindication to IV contrast, along with previous adverse reactions, renal failure, DM, pregnancy, multiple myeloma, severe heart failure, and dehydration.\n\nIodinated contrast agents can exacerbate myasthenia gravis symptoms, potentially precipitating a myasthenic crisis. This is an important consideration when ordering contrast-enhanced CT in these patients."
    difficulty: medium
    tags: [radiology, contrast-agents, myasthenia-gravis, contraindications]
  - front: "What are the five standard chest X-ray views and their indications?"
    back: "1) PA (posteroanterior): standard view, minimizes cardiac magnification. 2) Lateral: better visualization of retrocardiac space and thoracic spine; localizes lesions. 3) AP (anteroposterior): for bedside/acutely ill patients unable to stand; magnifies cardiac silhouette. 4) Lateral decubitus: assesses pleural effusion and pneumothorax. 5) Lordotic: angled beam for better visualization of lung apices obscured by clavicles.\n\nEach CXR view has specific indications. The PA view is the gold standard. AP views are lower quality. Lateral decubitus is the most sensitive for small pleural effusions (detects as little as 25 mL)."
    difficulty: easy
    tags: [radiology, chest-x-ray, CXR-views, imaging-technique]
  - front: "What constitutes an adequate chest X-ray in terms of inspiration, penetration, and rotation?"
    back: "Inspiration: 10 posterior and 7 anterior ribs should be visible. Penetration: thoracic spine should be visible through the cardiac shadow. Rotation: spinous processes should be equidistant from the medial ends of the clavicles.\n\nAssessing CXR quality before interpretation is essential. Poor inspiration causes apparent cardiomegaly. Rotation shifts mediastinal structures. Overpenetration or underpenetration affects visibility of pulmonary vasculature and lung markings."
    difficulty: easy
    tags: [radiology, chest-x-ray, CXR-quality, technique]
  - front: "What is the cardiothoracic ratio and what value is considered abnormal on a PA chest X-ray?"
    back: "The cardiothoracic ratio is the greatest transverse dimension of the cardiac shadow divided by the greatest transverse dimension of the thoracic cavity. A ratio >0.5 on a good quality erect PA chest film in adults is abnormal.\n\nA cardiothoracic ratio >0.5 is a marker of cardiomegaly, but note that AP films magnify the cardiac silhouette and should not be used for this measurement. Pericardial effusion and poor inspiratory effort can also increase the ratio."
    difficulty: easy
    tags: [radiology, chest-x-ray, cardiothoracic-ratio, cardiomegaly]
  - front: "What is the silhouette sign on CXR, and how is it used to localize lung pathology?"
    back: "The silhouette sign occurs when two structures of the same radiodensity abut, making their border indistinguishable. Loss of a normal interface (e.g., right heart border) localizes pathology to the adjacent lung segment. Loss of right heart border = RML; loss of right hemidiaphragm = RLL; loss of left heart border = Lingula; loss of left hemidiaphragm = LLL.\n\nThe silhouette sign helps localize consolidation or atelectasis without CT. For example, in right middle lobe pneumonia, the right heart border disappears. In left lower lobe pneumonia, the left hemidiaphragm border is obliterated."
    difficulty: medium
    tags: [radiology, chest-x-ray, silhouette-sign, localization]
  - front: "What lung lobe is affected if the aortic knob/left superior mediastinal border is lost on CXR?"
    back: "Left upper lobe (LUL).\n\nUsing the silhouette sign: SVC/right superior mediastinum = RUL; right heart border = RML; right hemidiaphragm = RLL; aortic knob/left superior mediastinum = LUL; left heart border = Lingula; left hemidiaphragm = LLL."
    difficulty: medium
    tags: [radiology, chest-x-ray, silhouette-sign, LUL]
  - front: "What is an air bronchogram and what does its presence suggest?"
    back: "An air bronchogram is a branching pattern of air-filled bronchi made visible on a background of opacification (solid or fluid-filled alveoli). Its presence suggests consolidation (e.g., pneumonia, pulmonary edema) and implies patent, air-filled bronchi within a consolidated region.\n\nAir bronchograms are seen in consolidative processes where alveoli fill with fluid/cells but bronchi remain patent. They are typically absent in obstructive atelectasis (where bronchi are blocked) and pleural effusions, helping differentiate causes of opacity."
    difficulty: medium
    tags: [radiology, chest-x-ray, air-bronchogram, consolidation]
  - front: "What is the spine sign on lateral CXR?"
    back: "Vertebral bodies should appear progressively more radiolucent (darker) as one moves down the thoracic spine on lateral CXR. If lower vertebral bodies appear more radiopaque (whiter), it indicates pathology such as consolidation in the overlying lower lobe.\n\nNormally, as lung replaces overlying tissue moving inferiorly, the vertebral bodies appear increasingly dark. Increased opacity at lower vertebral levels suggests lower lobe pathology that increases radiodensity in this region."
    difficulty: medium
    tags: [radiology, chest-x-ray, spine-sign, lateral-CXR, consolidation]
  - front: "What are the three types of CT chest and their indications?"
    back: "1) Standard CT chest: full lung scan with high-resolution reconstructions; indicated for CXR abnormality, pleural/mediastinal abnormality, lung cancer staging, cancer follow-up, empyema vs. abscess. 2) Low-dose CT: 1/5th the radiation; indicated for lung cancer screening, follow-up of infections, lung transplant, metastases. 3) CT pulmonary angiography (CTA): iodinated contrast timed for maximum vascular opacification; indicated for PE, aortic aneurysms, aortic dissection.\n\nLow-dose CT is used for lung cancer screening in high-risk individuals (current/former heavy smokers aged 50-80). CTA requires contrast and must weigh benefits against risk of contrast reactions and nephropathy."
    difficulty: medium
    tags: [radiology, CT-chest, CT-types, lung-cancer-screening, CTA]
  - front: "What are the types of atelectasis and their causes?"
    back: "1) Obstructive (most common): mucus plug, endobronchial lesion, foreign body, granulomatous infections. 2) Compressive: tumour, bulla, effusion, enlarged heart, lymphadenopathy. 3) Traction (cicatrization): scarring distorts and contracts alveoli. 4) Adhesive: lack of surfactant (e.g., hyaline membrane disease, prematurity). 5) Passive (relaxation): air or fluid in pleural space (pneumothorax, effusion).\n\nPersisting atelectasis without a known cause must be investigated with CT chest or bronchoscopy to rule out central bronchogenic carcinoma. Each type has distinct mechanisms and imaging characteristics."
    difficulty: medium
    tags: [radiology, atelectasis, lung-pathology, CXR-findings]
  - front: "What are the radiographic findings of atelectasis on CXR?"
    back: "Increased opacity of the involved segment/lobe, vascular crowding, silhouette sign, air bronchograms. Volume loss signs: fissure displacement, hilar/mediastinal displacement toward the atelectatic side, diaphragm elevation. Compensatory hyperinflation of remaining normal lung.\n\nVolume loss is the hallmark of atelectasis (vs. consolidation which does not cause volume loss). Displacement of structures toward the atelectatic side (ipsilateral mediastinal shift, elevated hemidiaphragm) confirms volume loss."
    difficulty: medium
    tags: [radiology, atelectasis, CXR-findings, volume-loss]
  - front: "What are the DDx of airspace (alveolar) disease? Use the mnemonic."
    back: "Pus (infections such as pneumonia), Fluid (pulmonary edema), Blood (pulmonary hemorrhage), Cells (bronchioalveolar carcinoma, lymphoma), Protein (alveolar proteinosis).\n\nAirspace disease appears as opacification with air bronchograms on CXR. Narrowing the DDx requires clinical context: fever/leukocytosis suggests pus; cardiac history suggests fluid; trauma/vasculitis suggests blood; chronic exposure to antigens or dusts suggests specific diagnoses."
    difficulty: medium
    tags: [radiology, airspace-disease, consolidation, DDx]
  - front: "What are Kerley lines on CXR and what do they indicate?"
    back: "Kerley lines are fine lines caused by thickened interlobular connective tissue septae, most commonly due to pulmonary edema or lymphangitis carcinomatosis. Types: A = long thin lines in upper lobes; B = short horizontal lines extending from lateral lung margins (most common); C = diffuse linear pattern throughout lung.\n\nKerley B lines are the most clinically recognized and appear as short (<2 cm), horizontal, peripheral lines at the lung bases. They indicate interstitial edema or lymphatic obstruction. Their presence with bilateral effusions and cardiomegaly is classic for CHF."
    difficulty: medium
    tags: [radiology, Kerley-lines, interstitial-disease, pulmonary-edema]
  - front: "What are the causes of interstitial lung disease classified by distribution using the mnemonics FASSTEN and BAD RASH?"
    back: "FASSTEN (upper lung predominance): Farmer's lung/hypersensitivity pneumonitis, Ankylosing spondylitis, Sarcoidosis, Silicosis, Tuberous sclerosis, Eosinophilic granuloma (Langerhans cell histiocytosis), Neurofibromatosis. BAD RASH (lower lung predominance): Bronchiolitis obliterans organizing pneumonia (BOOP), Asbestos, Drugs (nitrofurantoin, hydralazine, isoniazid, amiodarone), Rheumatological disease, Aspiration, Scleroderma, Hamman-Rich and IPF.\n\nKnowing the distribution of interstitial lung disease narrows the differential. Upper lobe predominance suggests sarcoidosis, silicosis, TB. Lower lobe predominance suggests IPF, asbestosis, drug-induced ILD. This guides further workup."
    difficulty: hard
    tags: [radiology, interstitial-lung-disease, ILD, DDx, FASSTEN, BAD-RASH]
  - front: "What are the radiographic characteristics that suggest a pulmonary nodule is malignant versus benign?"
    back: "Malignant features: ill-defined/spiculated margin ('corona radiata'), lobulated contour, eccentric or stippled calcification, doubling time 20-460 days, size >3 cm, cavitation (especially with wall thickness >15 mm), no satellite lesions. Benign features: well-defined margin, smooth contour, diffuse/central/popcorn/concentric calcification, doubling time <20 or >460 days, size <3 cm, no cavitation, satellite lesions.\n\nA pulmonary nodule is a round opacity <3 cm; >3 cm is classified as a mass. Popcorn calcification is characteristic of hamartoma. Spiculated margins suggest tumour infiltration. Doubling time outside 20-460 days (too fast or too slow) suggests benignity. Fleischner Society guidelines 2017 guide follow-up."
    difficulty: hard
    tags: [radiology, pulmonary-nodule, malignancy, benign, Fleischner-guidelines]
  - front: "What are the CXR findings of pulmonary edema, progressing from early to late?"
    back: "Early: vascular redistribution/cephalization, peribronchial cuffing, loss of definition of pulmonary vasculature, Kerley B lines. Intermediate: reticulonodular pattern, thickening of interlobar fissures, pleural effusion. Late: diffuse airspace disease in a 'bat wing' or 'butterfly' pattern in perihilar regions (with relative sparing of outermost lung fields). Cardiomegaly may be present in cardiogenic edema.\n\nPulmonary edema progresses from interstitial (Kerley lines, peribronchial cuffing) to alveolar (airspace opacification). The classic 'bat wing' pattern of perihilar edema with peripheral sparing is characteristic of non-cardiogenic edema (ARDS) as well as cardiogenic causes."
    difficulty: hard
    tags: [radiology, pulmonary-edema, CHF, CXR-findings, bat-wing]
  - front: "What are the CXR findings of pulmonary embolism, and what is the definitive imaging study?"
    back: "CXR findings (generally non-specific): Westermark sign (localized pulmonary oligemia), Hampton's hump (triangular peripheral infarct), enlarged right ventricle and right atrium, atelectasis, pleural effusion, rarely pulmonary edema. Definitive: CT pulmonary angiography (filling defect in contrast-filled pulmonary arteries). Alternative: VQ scan (in renal impairment or pregnancy).\n\nMost CXR findings in PE are non-specific. PE cannot be definitively diagnosed on plain film. CT pulmonary angiography is the investigation of choice. VQ scan is preferred in pregnancy (lower radiation to fetus) and renal failure (avoids iodinated contrast)."
    difficulty: medium
    tags: [radiology, pulmonary-embolism, PE, Westermark-sign, Hamptons-hump, CTA]
  - front: "What is the minimum volume of pleural effusion detectable by different CXR views?"
    back: "Lateral decubitus: 25 mL (most sensitive). Upright lateral: 50 mL (meniscus seen in posterior costophrenic sulcus). PA: 200 mL. Supine: variable (may appear as diffuse haziness).\n\nLateral decubitus is the most sensitive plain film view for detecting small pleural effusions. Ultrasound is superior to plain film for small effusions and is now standard of care in acute situations (POCUS). A horizontal fluid level (hydropneumothorax) indicates both fluid and air in the pleural cavity."
    difficulty: medium
    tags: [radiology, pleural-effusion, CXR-sensitivity, lateral-decubitus]
  - front: "What are the radiographic findings of pneumothorax on upright versus supine CXR?"
    back: "Upright: visceral pleural line as a curvilinear line paralleling the chest wall, separating the collapsed lung from pleural air. More obvious on expiratory film. Supine: 'deep (costophrenic) sulcus' sign, 'double diaphragm' sign (dome and anterior portions of diaphragm outlined), hyperlucent hemithorax, sharpening of adjacent mediastinal structures. Tension PTX: contralateral tracheal and mediastinal shift.\n\nSupine films are less sensitive for pneumothorax as air collects anteriorly rather than at the apex. The deep sulcus sign (abnormally deep costophrenic angle) is the key supine finding. Tension pneumothorax is a clinical emergency diagnosed clinically, not radiographically."
    difficulty: hard
    tags: [radiology, pneumothorax, CXR-findings, tension-pneumothorax, deep-sulcus-sign]
  - front: "What is the management of tension pneumothorax and how does it differ from simple pneumothorax?"
    back: "Tension pneumothorax: emergent needle decompression at the 2nd ICS midclavicular line, followed by chest tube insertion. Simple pneumothorax: supplemental oxygen and observation, or chest tube insertion at the 5th ICS anterior axillary line. Repeat CXR to ensure resolution.\n\nTension pneumothorax is a life-threatening emergency causing cardiovascular collapse. It is diagnosed clinically (hypotension, absent breath sounds, tracheal deviation) and treated immediately — do not wait for imaging. Needle decompression converts it to an open pneumothorax."
    difficulty: medium
    tags: [radiology, pneumothorax, tension-pneumothorax, needle-decompression, chest-tube]
  - front: "What are the differential diagnoses for an anterior mediastinal mass? Use the 4 Ts."
    back: "4 Ts: Thyroid (substernal goiter), Thymic neoplasm (thymoma, teratoma, thymic cyst), Teratoma (germ cell tumour), Terrible lymphoma. Cardiophrenic angle mass DDx: thymic cyst, epicardial fat pad, foramen of Morgagni hernia.\n\nThe anterior mediastinum is bordered anteriorly by the sternum and posteriorly by the heart/great vessels. The 4 Ts is a widely used mnemonic. Thymoma is associated with myasthenia gravis. Lymphoma is the most common cause in younger patients."
    difficulty: medium
    tags: [radiology, mediastinal-mass, anterior-mediastinum, 4-Ts, DDx]
  - front: "What are the DDx for middle and posterior mediastinal masses?"
    back: "Middle mediastinum: esophageal carcinoma, esophageal duplication cyst, esophageal leiomyomas, metastatic disease, lymphadenopathy, hiatus hernia, bronchogenic cyst, aortic/pulmonary aneurysm, neurogenic tumour (vagal or phrenic nerve). Posterior mediastinum: neurogenic tumour (neurofibroma, schwannoma), neurenteric cyst, thoracic duct cyst, lateral meningocele, Bochdalek hernia, extramedullary hematopoiesis, paraspinal abscess.\n\nThe middle mediastinum extends from the posterior border of the anterior mediastinum to 1 cm posterior to the anterior edge of thoracic vertebral bodies. The posterior mediastinum lies behind this line. Neurogenic tumours are the most common posterior mediastinal mass."
    difficulty: medium
    tags: [radiology, mediastinal-mass, middle-mediastinum, posterior-mediastinum, DDx]
  - front: "What are the cardiac chamber contributions to the borders of the heart on PA and lateral CXR?"
    back: "PA view: right heart border = right atrium; left heart border = left atrium (superior) and left ventricle (inferior). Lateral view: anterior heart border = right ventricle; posterior border = left atrium (superior) and left ventricle (inferior).\n\nKnowing which chamber forms which border allows identification of specific chamber enlargement. For example, LA enlargement causes a 'double heart border' sign and splayed carina; RV enlargement fills the retrosternal space on lateral CXR."
    difficulty: medium
    tags: [radiology, chest-x-ray, cardiac-borders, cardiac-chambers]
  - front: "What are the CXR findings of left atrial enlargement?"
    back: "Straightening of the left heart border, increased opacity of the lower right side of the cardiovascular shadow ('double heart border'), elevation of the left main bronchus (specifically the upper lobe bronchus on lateral film), distance between left main bronchus and 'double' heart border >7 cm, and splayed carina (a late sign).\n\nLA enlargement is classic in mitral stenosis/regurgitation and left heart failure. The 'double heart border' is caused by the enlarged LA appearing through the right heart border. Splayed carina (>70°) indicates severe LA enlargement pushing the bronchi apart."
    difficulty: hard
    tags: [radiology, left-atrial-enlargement, CXR-findings, mitral-stenosis]
  - front: "What are the CXR findings of right ventricular enlargement?"
    back: "Elevation of the cardiac apex from the diaphragm, anterior enlargement leading to loss of retrosternal air space on lateral CXR, and increased contact of the right ventricle against the sternum.\n\nRV enlargement is seen in pulmonary hypertension, pulmonary stenosis, and right-sided heart failure. The best view for RV enlargement is the lateral CXR, which shows filling of the retrosternal space (normally clear). The cardiac apex is tilted upward."
    difficulty: medium
    tags: [radiology, right-ventricular-enlargement, CXR-findings, pulmonary-hypertension]
  - front: "What is the differential diagnosis for an elevated hemidiaphragm? Use the mnemonic PALDIP."
    back: "PALDIP: Pregnancy, Abdominal mass/organomegaly, Lung collapse (atelectasis), Diaphragmatic paralysis, Intra-abdominal process (abscess, distension), Pneumonectomy.\n\nThe right hemidiaphragm is normally higher than the left due to the liver. Elevation can be due to causes pushing the diaphragm up from below (abdominal) or pulling it up from above (atelectasis, paralysis). Unilateral elevated hemidiaphragm with absent movement on fluoroscopy suggests phrenic nerve palsy."
    difficulty: medium
    tags: [radiology, elevated-hemidiaphragm, DDx, PALDIP]
  - front: "Where should an endotracheal tube (ETT) tip be positioned on CXR?"
    back: "The ETT tip should be located 2-4 cm above the tracheal carina. Maximum inflation balloon diameter should be <3 cm to avoid necrosis of tracheal mucosa; ensure the balloon diameter is less than the tracheal diameter.\n\nIf the ETT is too high, it may cause vocal cord irritation or inadvertent extubation. Too low risks right mainstem bronchus intubation (right lower lobe preferentially ventilated, left lung collapses). Progressive gastric distension on repeat CXR suggests esophageal intubation."
    difficulty: medium
    tags: [radiology, endotracheal-tube, ETT-position, CXR-lines-tubes]
  - front: "Where should a central venous catheter (CVC) tip be positioned on CXR?"
    back: "Ideally at the SVC/right atrial junction. The tip should project over the silhouette of the SVC in a zone demarcated superiorly by the anterior first rib end and clavicle, and inferiorly by the top of the right atrium. Course should parallel the SVC.\n\nA catheter tip too far into the RA increases risk of arrhythmias or perforation. If the catheter appears to bend perpendicular to the SVC wall, it may damage/perforate the vessel. For CVP monitoring, the tip must be proximal to venous valves."
    difficulty: medium
    tags: [radiology, central-venous-catheter, CVC-position, CXR-lines-tubes]
  - front: "What are the complications of central venous catheter insertion visible on CXR?"
    back: "Pneumothorax, bleeding (mediastinal, pleural), malposition (arterial, pleural), air embolism.\n\nPost-CVC insertion CXR is mandatory to confirm position and rule out complications. Pneumothorax is most common with subclavian and internal jugular approaches. Malposition into the artery may be recognized by pulsatile bright red blood on aspiration or pressure waveform monitoring."
    difficulty: medium
    tags: [radiology, central-venous-catheter, complications, pneumothorax]
  - front: "Where should a nasogastric tube (NGT) tip be positioned on CXR, and why is radiographic confirmation mandatory?"
    back: "The NGT tip and side port should be positioned distal to the esophagogastric junction and proximal to the gastric pylorus. Radiographic confirmation is mandatory because clinical techniques for assessing tip position (e.g., auscultation over stomach, pH of aspirate) may be unreliable.\n\nMisplaced NGTs into the bronchial tree have caused fatal complications from tube feeding directly into the lungs. CXR is the gold standard for confirmation. The tube should be seen crossing the diaphragm and entering the stomach."
    difficulty: medium
    tags: [radiology, nasogastric-tube, NGT-position, CXR-lines-tubes]
  - front: "Where should a Swan-Ganz (pulmonary artery) catheter tip be positioned, and what is the risk of distal placement?"
    back: "The tip should be positioned within the right or left main pulmonary arteries or in one of their large lobar branches. If the tip is more distal, there is increased risk of prolonged pulmonary artery occlusion resulting in pulmonary infarction or, rarely, pulmonary artery rupture/pseudoaneurysm.\n\nSwan-Ganz catheters monitor pulmonary capillary wedge pressure to estimate left heart filling. Distal tip migration (into a small pulmonary artery branch) causes a 'wedged' position with prolonged occlusion, leading to downstream ischemia and infarction."
    difficulty: medium
    tags: [radiology, Swan-Ganz, pulmonary-artery-catheter, CXR-lines-tubes, pulmonary-infarction]
  - front: "Where is a chest tube positioned for fluid versus pneumothorax drainage, and what are its complications?"
    back: "For fluid: dorsal and caudal portion of the pleural space. For pneumothorax: ventral and cephalad portions of the pleural space. Complications: bleeding, infection, lung laceration. The tube may lie in a fissure as long as it is functioning.\n\nFluid (dense, gravitates inferiorly and posteriorly in the supine patient) requires a posterior/inferior tube. Air (rises superiorly and anteriorly) requires an anterior/superior tube. The 5th ICS anterior axillary line is the safe triangle approach for chest tube insertion."
    difficulty: medium
    tags: [radiology, chest-tube, pleural-drainage, positioning, complications]
  - front: "What are the pleural abnormalities caused by asbestos exposure?"
    back: "Asbestos exposure can cause: benign pleural plaques (most common; may calcify), diffuse pleural fibrosis, pleural effusion, and malignant mesothelioma.\n\nPleural plaques are the most common manifestation of asbestos exposure and are typically bilateral, often calcified, and do not progress to mesothelioma. Malignant mesothelioma is a rare but serious complication with a very poor prognosis. Latency can be decades."
    difficulty: medium
    tags: [radiology, asbestos, pleural-plaques, mesothelioma, pleural-disease]
  - front: "What is PET-CT and what are its advantages in oncology?"
    back: "PET-CT integrates positron emission tomography (functional/metabolic imaging using 18F-FDG) with CT (anatomic imaging) in a single device. Advantages in oncology: diagnosis, staging, and restaging of cancer; predictive and prognostic value; evaluates cardiac viability. Shows metabolism and physiology, not just anatomy.\n\n18F-FDG (fluorodeoxyglucose) is taken up preferentially by metabolically active tissues (tumours, inflammation). PET-CT allows simultaneous localization (CT) and characterization (PET) of lesions. It is particularly useful for detecting occult metastases and assessing treatment response."
    difficulty: medium
    tags: [radiology, PET-CT, oncology, FDG, nuclear-medicine]
  - front: "What are the DDx for causes of pulmonary cavitation? Use the mnemonic WEIRD HOLES."
    back: "WEIRD HOLES: Wegener's (GPA/granulomatosis with polyangiitis), Embolic (pulmonary, septic), Infection (anaerobes, Pneumocystis, TB), Rheumatoid (necrobiotic nodules), Developmental cysts (sequestration), Histiocytosis, Oncological, Lymphangioleiomyomatosis, Environmental/occupational, Sarcoidosis.\n\nPulmonary cavitation occurs when a lesion develops a central necrotic area that communicates with a bronchus and expels its contents. Malignant cavitation typically has thick, irregular walls (>15 mm). Benign cavitation (e.g., abscess) tends to have smoother walls and air-fluid levels."
    difficulty: hard
    tags: [radiology, pulmonary-cavitation, DDx, WEIRD-HOLES]
  - front: "What is the approach to evaluating a pulmonary nodule in terms of risk stratification and management?"
    back: "Clinical information and CT appearance determine level of suspicion for malignancy. High probability of malignancy: invasive testing (transbronchial or CT-guided transthoracic biopsy) + PET/CT. Low probability: follow-up imaging as per Fleischner Society guidelines 2017. Malignant features: size >3 cm, spiculated/ill-defined margins, lobulated contour, eccentric calcification, doubling time 20-460 days.\n\nThe Fleischner Society guidelines stratify follow-up based on nodule size, number (solitary vs. multiple), and patient risk factors (smoking history, age). Solid nodules <6 mm in low-risk patients may not require follow-up, while larger nodules or those with high-risk features warrant more aggressive workup."
    difficulty: hard
    tags: [radiology, pulmonary-nodule, Fleischner-guidelines, lung-cancer, risk-stratification]
  - front: "What are the advantages of ultrasound in the context of pleural effusion management?"
    back: "Ultrasound is superior to plain film for detection of small pleural effusions and may guide thoracentesis. POCUS (point-of-care ultrasound) is now standard of care in acute situations for both pleural effusions and pneumothorax.\n\nUltrasound can detect effusions smaller than the 25 mL threshold of lateral decubitus films. Real-time guidance of thoracentesis with ultrasound significantly reduces complication rates (pneumothorax, organ puncture) compared to landmark-based approaches."
    difficulty: medium
    tags: [radiology, ultrasound, pleural-effusion, POCUS, thoracentesis]
  - front: "In MRI, what is the effect of using higher versus lower frequencies in ultrasound on image resolution and tissue penetration?"
    back: "Higher frequencies: greater resolution but poorer penetrance, resulting in decreased visualization of deeper structures. Lower frequencies: poorer resolution but better penetration for imaging deeper structures.\n\nThis trade-off is fundamental in ultrasound. High-frequency probes (7-15 MHz, e.g., linear array) are used for superficial structures (thyroid, veins, tendons). Low-frequency probes (2-5 MHz, e.g., curvilinear) are used for deep abdominal and pelvic structures."
    difficulty: easy
    tags: [radiology, ultrasound, frequency, resolution, penetration]
  - front: "What methods reduce the risk of contrast-induced nephropathy (CIN) from iodinated CT contrast?"
    back: "For planned procedure: optimal oral hydration; IV hydration with 0.9% NaCl or NaHCO3 at 1 mL/kg/h for 12 hours pre-procedure and 12 hours post-contrast. For same-day procedure: 0.9% NaCl or NaHCO3 at 3 mL/kg/h for 1-3 hours pre-procedure and for 6 hours post-contrast.\n\nPre-hydration maintains renal perfusion and dilutes the contrast. Sodium bicarbonate may reduce free radical generation. N-acetylcysteine was historically used but evidence is limited. eGFR <60 requires preventative measures and follow-up monitoring."
    difficulty: medium
    tags: [radiology, contrast-nephropathy, CIN-prevention, hydration, iodinated-contrast]
  - front: "What is the DDx for a depressed hemidiaphragm on CXR?"
    back: "Hyperinflation (e.g., COPD, asthma), large pleural effusion, and COPD (air trapping).\n\nA depressed hemidiaphragm indicates increased lung volume on that side. COPD causes bilateral hyperinflation and bilateral flattened/depressed hemidiaphragms. Unilateral depression may indicate a large ipsilateral effusion or compensatory hyperinflation from contralateral pathology."
    difficulty: medium
    tags: [radiology, depressed-hemidiaphragm, COPD, hyperinflation, DDx]
  - front: "What are the specific uses of FDG-PET in patients with pathologically verified dementia, based on EBM evidence?"
    back: "Bilateral temporo-parietal hypometabolism is the classic metabolic pattern of Alzheimer's disease (AD) on FDG-PET. Sensitivity 93%, specificity 63%, diagnostic accuracy 82% for AD. FDG-PET can be used clinically to differentiate dementia syndromes when the diagnosis is uncertain.\n\nFDG-PET measures glucose metabolism. In AD, temporo-parietal regions show early metabolic decline. This is useful when differentiating AD from frontotemporal dementia (frontal hypometabolism) or Lewy body dementia (occipital hypometabolism). The relatively low specificity (63%) means positive findings must be interpreted in clinical context."
    difficulty: hard
    tags: [radiology, PET, FDG-PET, Alzheimers-disease, dementia, nuclear-medicine]
  - front: "What is the best imaging modality for cerebrovascular disease (stroke), and what is used for initial imaging?"
    back: "Best modality: MRI. Initial modality: CT.\n\nCT is rapidly available and excludes hemorrhage, guiding early tPA decisions. MRI (especially DWI) is superior for detecting early ischemia and characterizing stroke type and extent."
    difficulty: easy
    tags: [medical imaging, stroke, MRI, CT, neurology]
  - front: "On CT, what is the 'hyperdense MCA sign' and what does it represent?"
    back: "A hyperattenuating (bright) middle cerebral artery on non-contrast CT, representing intravascular thrombus or emboli in ischemic stroke.\n\nThe hyperdense MCA sign is an early CT finding of ischemic stroke, appearing within the hyperacute phase (0-24 h). It indicates acute intraluminal clot and may guide early reperfusion therapy decisions."
    difficulty: easy
    tags: [medical imaging, stroke, CT, MCA, ischemic stroke]
  - front: "In the hyperacute phase (0-24 h) of stroke, what does MRI DWI show and why?"
    back: "Hyperintensity on DWI within minutes of arterial occlusion, due to restriction of water movement indicative of cytotoxic edema. ADC map shows corresponding hypointensity.\n\nCytotoxic edema causes failure of Na/K ATPase pumps, leading to intracellular water accumulation and restricted diffusion. DWI detects this earlier than conventional CT or T2/FLAIR sequences."
    difficulty: medium
    tags: [medical imaging, stroke, DWI, MRI, cytotoxic edema]
  - front: "What is the 'fogging phenomenon' in subacute stroke on CT?"
    back: "In the subacute phase (1-3 weeks), resolution of edema causes the infarcted area to increase in attenuation, potentially regaining near-normal density and 'masking' or hiding the stroke on CT.\n\nThis is a diagnostic pitfall — the previously hypoattenuating infarct may appear isodense or near-normal on CT during the subacute phase, potentially causing a false-negative interpretation. MRI remains positive."
    difficulty: medium
    tags: [medical imaging, stroke, CT, fogging phenomenon, subacute]
  - front: "In chronic stroke (>3 weeks), what is the CT finding and what is the MRI ADC finding?"
    back: "CT: Encephalomalacia (parenchymal volume loss) appearing as hypoattenuation with negative mass effect. MRI ADC: Intensity remains elevated (pseudonormalization has passed, now persistently elevated).\n\nChronic infarction leads to neuronal death and gliosis with volume loss. ADC pseudo-normalizes at 10-15 days and then surpasses normal tissue, remaining elevated chronically — this helps date strokes."
    difficulty: medium
    tags: [medical imaging, stroke, chronic, encephalomalacia, ADC]
  - front: "What is the best imaging modality for carotid artery disease, and when is conventional angiography used?"
    back: "Best: Duplex (Doppler U/S). If carotid angioplasty or endarterectomy is being considered, MRA or CTA is used. Conventional angiography is reserved for inadequate MRA or CTA.\n\nDuplex ultrasound is non-invasive, readily available, and accurately assesses carotid stenosis. Conventional angiography carries procedural risk and is only used when non-invasive modalities are inconclusive."
    difficulty: easy
    tags: [medical imaging, carotid artery, Doppler, angiography, vascular]
  - front: "What are 'Dawson's fingers' in multiple sclerosis?"
    back: "Perivenular regions of demyelination that radiate outwards into the deep periventricular region, visible on MRI. They appear as finger-like projections oriented perpendicular to the lateral ventricles.\n\nDawson's fingers are a characteristic MRI finding of MS, corresponding to inflammation along perivascular spaces (Virchow-Robin spaces). They are best seen on sagittal FLAIR sequences."
    difficulty: easy
    tags: [medical imaging, multiple sclerosis, MRI, Dawsons fingers, demyelination]
  - front: "What are the characteristic locations of MS lesions on MRI?"
    back: "Juxtacortical (grey-white junction), periventricular, infratentorial, and spinal cord.\n\nThese four locations are the basis of McDonald criteria for MS diagnosis by MRI. Cerebral lesions are typically hyperintense on T2/FLAIR and hypointense on T1 ('black holes'). Active lesions enhance with gadolinium."
    difficulty: easy
    tags: [medical imaging, multiple sclerosis, MRI, lesion locations]
  - front: "What MRI features distinguish spinal cord MS lesions from cord tumors?"
    back: "MS spinal cord lesions: little or no cord swelling, less likely to enhance with gadolinium, incomplete involvement of cord cross-section (dorsolateral common).\n\nThese features help differentiate MS plaques from other causes of myelopathy. Tumors typically show cord expansion and prominent enhancement. MS lesions span less than 2 vertebral segments and are often eccentric."
    difficulty: medium
    tags: [medical imaging, multiple sclerosis, spinal cord, MRI]
  - front: "What is the best imaging modality for meningitis, and what are the key MRI findings?"
    back: "Best modality: MRI (T2-weighted/FLAIR). Findings: meningeal enhancement (following gyri/sulci and/or basal cisterns), communicating hydrocephalus, cerebral swelling, subdural effusion. A normal MRI does NOT rule out leptomeningitis.\n\nGadolinium-enhanced MRI is most sensitive for detecting leptomeningeal inflammation. Common pathogens include S. pneumoniae, H. influenzae, N. meningitidis, and L. monocytogenes."
    difficulty: medium
    tags: [medical imaging, meningitis, MRI, CNS infection]
  - front: "What are the MRI findings of herpes simplex encephalitis, and what is the differential diagnosis?"
    back: "Acute (within 4-5 days): asymmetric high-intensity lesions on T2 MRI in temporal and inferior frontal lobes. CT may show hypodensity in temporal lobe and insula. DDx: infarct, tumour, status epilepticus, limbic encephalitis.\n\nHSV encephalitis asymmetrically affects limbic regions (temporal lobes, orbitofrontal cortex, insula, cingulate gyrus). MRI (T1 and T2) is the best modality. Long-term sequelae include parenchymal loss."
    difficulty: medium
    tags: [medical imaging, herpes encephalitis, MRI, temporal lobe, CNS infection]
  - front: "What are the four stages of cerebral abscess formation on MRI?"
    back: "1) Early cerebritis (1-3d): low T1, high T2 signal, inflammatory infiltrate with necrotic centre. 2) Late cerebritis (4-9d): ring enhancement may appear. 3) Early capsule (10-13d): ring enhancement present. 4) Late capsule (>14d): well-demarcated ring-enhancing lesion, low-intensity core, mass effect, considerable surrounding edema (T2 hyperintense).\n\nCerebral abscess is best imaged with MRI including DWI (abscess is DWI positive, distinguishing it from tumor necrosis). Common pathogens include S. aureus, Streptococcus, gram-negative bacteria, and Bacteroides."
    difficulty: medium
    tags: [medical imaging, cerebral abscess, MRI, DWI, CNS infection]
  - front: "Why is DWI MRI preferred over CT for diagnosing cerebral abscess?"
    back: "Abscess is DWI-positive (restricted diffusion due to viscous pus), while tumor necrosis is typically DWI-negative. MRI including DWI is the best imaging modality, though CT is still a viable alternative.\n\nThe restricted diffusion in an abscess reflects the high viscosity of the purulent contents. This DWI positivity is the key distinguishing feature from cystic or necrotic tumors, which typically show facilitated diffusion."
    difficulty: medium
    tags: [medical imaging, cerebral abscess, DWI, MRI, differential diagnosis]
  - front: "What are the musculoskeletal indications for plain film X-ray?"
    back: "Arthritis, fractures and dislocations, assessment of malunion or nonunion, orthopedic hardware, and initial evaluation of bone lesions.\n\nPlain film is the initial study for bone and joint disorders. A minimum of two orthogonal views (AP and lateral) are obtained. For bony rings (radius/ulna, tibia/fibula), joints above and below must be imaged to detect associated injuries."
    difficulty: easy
    tags: [medical imaging, plain film, musculoskeletal, X-ray, fracture]
  - front: "What are the musculoskeletal indications for MRI?"
    back: "Internal derangement of joints (ligaments, capsule, menisci, labrum, cartilage), tendon and muscle injuries, soft tissue and bony mass characterization/staging, osteomyelitis, occult fractures, whole body MRI for CRMO/enthesitis-related arthritis (pediatrics), myeloma (adults), and myxoid liposarcoma metastases.\n\nMRI provides superior soft tissue contrast without radiation. It is the gold standard for soft tissue pathology and is essential for surgical planning of complex joint and tumor problems."
    difficulty: easy
    tags: [medical imaging, MRI, musculoskeletal, indications]
  - front: "What are the indications for musculoskeletal ultrasound?"
    back: "Tendon injury (rotator cuff, Achilles), soft tissue mass characterization (cystic vs solid), foreign body detection, U/S-guided biopsy/injections, bone/joint evaluation pre-ossification (e.g. DDH), dynamic imaging (snapping hip, ECU subluxation), small joint Doppler for arthritis, nerve assessment (cubital/carpal tunnel syndrome), and assessment where metallic objects obscure CT/MRI.\n\nU/S offers real-time dynamic imaging and is first-line for tendon pathology and superficial structures. It is radiation-free and allows for guided interventional procedures."
    difficulty: medium
    tags: [medical imaging, ultrasound, musculoskeletal, indications]
  - front: "What radiopharmaceutical is used in bone scintigraphy, and what conditions cause a positive scan?"
    back: "99mTc-methylene diphosphonate (99mTc-MDP). Increased binding occurs with increased blood supply and/or high bone turnover. DDx of positive bone scan: bone metastases (breast, prostate, lung, thyroid primary), primary bone tumour, arthritis, fracture, infection, anemia, Paget's disease.\n\nBone scan is highly sensitive but non-specific. It is used for occult fractures, osteomyelitis, metastatic disease staging, and monitoring Paget's disease. Myeloma, RCC, and thyroid carcinoma may be occult due to lack of osteoblastic response."
    difficulty: medium
    tags: [medical imaging, nuclear medicine, bone scan, scintigraphy, 99mTc]
  - front: "Which bone tumors are typically NOT visible on bone scan and why?"
    back: "Myeloma, highly vascular tumours (RCC, thyroid carcinoma) — they do not elicit an osteoblastic response, so there is no increased 99mTc-MDP uptake.\n\nBone scintigraphy detects osteoblastic activity. Purely lytic lesions without reactive bone formation (as in multiple myeloma) may be occult. Whole-body MRI or PET is preferred for myeloma staging."
    difficulty: medium
    tags: [medical imaging, bone scan, myeloma, RCC, false negative]
  - front: "What radiographic features indicate an aggressive (malignant) bone lesion versus a non-aggressive (benign) lesion?"
    back: "Aggressive: acute periosteal reaction (Codman's triangle, onion skin, sunburst), poorly defined borders with wide zone of transition, soft tissue mass present, aggressive cortical destruction. Non-aggressive: no/benign periosteal reaction, sharp well-demarcated borders with narrow zone of transition, no soft tissue mass, well-developed bone formation.\n\nThe zone of transition between lesion and normal bone is the most important indicator of growth rate. A narrow zone suggests slow growth (benign), while a wide zone suggests rapid growth (malignant). Remember: benign conditions like Langerhans cell histiocytosis and infection can also appear aggressive."
    difficulty: medium
    tags: [medical imaging, bone lesion, X-ray, malignant, periosteal reaction]
  - front: "What are the periosteal reaction patterns associated with malignant bone lesions?"
    back: "Codman's triangle, 'onion skin' (laminated periosteal reaction), and 'sunburst' pattern.\n\nThese aggressive periosteal reactions reflect rapid tumor growth that disrupts the periosteum. Codman's triangle is formed at the edge where periosteum is lifted. Onion skin is seen in Ewing sarcoma. Sunburst is classic for osteosarcoma."
    difficulty: easy
    tags: [medical imaging, bone tumour, periosteal reaction, Codmans triangle, osteosarcoma]
  - front: "What imaging is recommended for the workup of osteomyelitis?"
    back: "MRI or X-ray. X-ray detects osseous destruction after >1 week (subacute) or chronic changes. MRI is more sensitive — loss of normal fatty T1 marrow signal is diagnostic; also assesses extra-osseous spread. Nuclear medicine (99mTc followed by 111In-WBC or gallium scan) used when hardware is present or MRI unavailable.\n\nMRI is the gold standard for osteomyelitis, detecting changes within 3-5 days of infection onset. X-ray lags behind MRI by 10-21 days. Nuclear medicine with WBC or gallium scan improves specificity in the presence of hardware."
    difficulty: medium
    tags: [medical imaging, osteomyelitis, MRI, nuclear medicine, infection]
  - front: "What is the key imaging principle for septic arthritis of a large joint?"
    back: "Septic arthritis of large joints (e.g. hip) is a surgical emergency. X-ray is usually normal early. Aspiration is required if septic arthritis is suspected — imaging cannot rule out septic arthritis.\n\nClinical suspicion drives management. Hip septic arthritis in children especially requires urgent surgical drainage to prevent avascular necrosis. Joint aspiration with culture is the diagnostic standard, not imaging alone."
    difficulty: easy
    tags: [medical imaging, septic arthritis, surgical emergency, hip, aspiration]
  - front: "What is the role of X-ray in necrotizing fasciitis diagnosis?"
    back: "X-ray can detect gas in soft tissues, but absence of gas does NOT rule out necrotizing fasciitis. It remains a surgical emergency.\n\nNecrotizing fasciitis is a life-threatening infection. Gas-forming organisms produce subcutaneous emphysema detectable on X-ray, but many cases lack gas. CT with contrast is superior for demonstrating extent of fascial involvement."
    difficulty: easy
    tags: [medical imaging, necrotizing fasciitis, X-ray, Fourniers gangrene, surgical emergency]
  - front: "What is the gold standard for measuring bone mineral density, and how is osteoporosis defined?"
    back: "DEXA (Dual-energy X-ray absorptiometry) is the gold standard, typically measured at hip and lumbar spine. Osteoporosis is defined by T-score < -2.5 (osteopenia: -2.5 < T-score < -1). Guidelines from Canadian Association of Radiologists and Osteoporosis Canada (CAROC).\n\nT-score compares to young adult mean (most clinically relevant). Z-score compares to age-matched mean and is helpful for diagnosing secondary osteoporosis. High fracture risk is automatic with hip or spine fragility fracture, or >1 fragility fracture."
    difficulty: easy
    tags: [medical imaging, osteoporosis, DEXA, T-score, bone mineral density, CAROC]
  - front: "What is the difference between T-score and Z-score on DEXA, and when is each clinically used?"
    back: "T-score: number of SDs from young adult mean — most clinically valuable for diagnosing osteoporosis (T < -2.5). Z-score: number of SDs from age-matched mean — helpful in diagnosing secondary osteoporosis.\n\nA Z-score below -2.0 suggests bone loss beyond age-related changes and prompts workup for secondary causes (hyperparathyroidism, malabsorption, steroid use, hypogonadism, etc.). T-score is used for WHO diagnostic criteria."
    difficulty: easy
    tags: [medical imaging, DEXA, T-score, Z-score, osteoporosis]
  - front: "What are Looser zones (pseudofractures) and in what condition are they found?"
    back: "Looser zones are thin, transverse radiolucent lines running perpendicular to bone cortex, often bilateral and symmetric, seen in femoral necks, shafts, and pubic/ischial rami. They are a classic finding of osteomalacia.\n\nOsteomalacia results from inadequate mineralization due to vitamin D, calcium, or phosphate deficiency. The gold standard for diagnosis is iliac crest bone biopsy showing increased osteoid. Looser zones represent stress fractures through unmineralized bone."
    difficulty: medium
    tags: [medical imaging, osteomalacia, Looser zones, pseudofractures, metabolic bone disease]
  - front: "What are the classic radiographic findings of hyperparathyroidism?"
    back: "Subperiosteal bone resorption (hands and tufts), subchondral resorption (sacroiliac joints), 'salt and pepper' skull, subligamentous resorption (ischial tuberosity, trochanters, clavicle), osteoclastoma (brown tumours), chondrocalcinosis, 'rugger jersey spine' (band-like osteosclerosis at superior/inferior vertebral body margins).\n\nThe most common cause is renal failure (secondary hyperparathyroidism). Subperiosteal resorption on the radial aspect of the middle phalanges of the index/middle fingers is a pathognomonic finding on hand X-rays."
    difficulty: medium
    tags: [medical imaging, hyperparathyroidism, X-ray, rugger jersey spine, brown tumours]
  - front: "What are the three phases of Paget's disease and their radiographic features?"
    back: "Phase 1 (lytic): 'blade of grass' sign in long bones, osteoporosis circumscripta in skull. Phase 2 (mixed lytic/sclerotic): coarsening trabeculae, bone expansion, cortical thickening. Phase 3 (sclerotic): 'picture frame' vertebrae (cortical thickening and sclerosis), widening of diploe in skull, bone scintigraphy shows high activity.\n\nPaget's disease involves abnormal remodeling most commonly in skull, spine, and pelvis. Complications include pathological fractures, high-output heart failure (from vascular bone), and rarely malignant transformation to osteosarcoma."
    difficulty: medium
    tags: [medical imaging, Pagets disease, X-ray, bone scan, metabolic bone disease]
  - front: "What is SPECT brain imaging used for and what radiopharmaceuticals are used?"
    back: "99mTc-HMPAO and 99mTc-ECD are used in SPECT to assess cerebral blood flow and cellular metabolism (taken up predominantly in grey matter). Indications: dementia, traumatic brain injury, and occasionally vasculitis, neuropsychiatric disorders, stroke.\n\nSPECT provides functional brain imaging unlike structural CT or MRI. In dementia, characteristic patterns of hypoperfusion help differentiate Alzheimer's from frontotemporal dementia and other neurodegenerative conditions."
    difficulty: medium
    tags: [nuclear medicine, SPECT, brain, cerebral blood flow, dementia]
  - front: "What is the clinical use of 111In-DTPA intrathecal administration in nuclear medicine?"
    back: "To evaluate CSF leak or to differentiate normal pressure hydrocephalus (NPH) from brain atrophy. Also used for CSF shunt evaluation for obstruction (most commonly ventriculoperitoneal shunts).\n\nCSF flow studies using intrathecal radiotracers help distinguish communicating vs. obstructive hydrocephalus and confirm CSF leaks in patients with rhinorrhea or otorrhea."
    difficulty: medium
    tags: [nuclear medicine, CSF, normal pressure hydrocephalus, CSF leak, 111In-DTPA]
  - front: "What conditions cause increased vs. decreased radioactive iodine uptake (RAIU)?"
    back: "Increased RAIU: toxic multinodular goitre, toxic adenoma, Graves' disease. Decreased RAIU: subacute thyroiditis, late Hashimoto's disease, exogenous thyroid hormone or iodine, recent radiographic contrast studies, high dietary iodine. Important: RAIU differentiates causes of HYPERTHYROIDISM only, not hypothyroidism.\n\nRAIU is a key functional test for hyperthyroidism workup. Differentiating high-uptake (e.g. Graves') from low-uptake (e.g. thyroiditis) causes of hyperthyroidism determines appropriate management (RAI therapy is appropriate for Graves' but contraindicated in thyroiditis)."
    difficulty: medium
    tags: [nuclear medicine, thyroid, RAIU, hyperthyroidism, Graves disease]
  - front: "On thyroid scintigraphy, what is the clinical significance of a 'cold' versus 'hot' nodule?"
    back: "Hot (hyperfunctioning) nodules: usually benign (adenoma, toxic MNG), cancer risk <1% — FNA NOT indicated. Cold (hypofunctioning) nodules: 6-10% are cancerous — cancer must be considered until biopsy negative; biopsy decision based on clinical and sonographic features.\n\nIsointense ('warm') lesions may represent cold nodules superimposed on normal tissue; correlate with U/S if cyst suspected. The clinical significance is that cold nodules require further workup with U/S and potentially FNA, while hot nodules are almost always benign."
    difficulty: medium
    tags: [nuclear medicine, thyroid, cold nodule, hot nodule, FNA]
  - front: "What are the indications for radioiodine ablation and what precautions must be taken?"
    back: "Indications: Graves' disease, multinodular goitre, thyroid cancer (higher dose, after thyroidectomy). Precautions: advise radiation-avoidance from family/caregivers, no pregnancy for 6 months, risks include exophthalmos, thyroid storm, secondary malignancy. Serum thyroglobulin used to monitor for recurrent thyroid cancer post-ablation.\n\nRadioiodine ablation uses 131I to destroy thyroid tissue. Post-thyroidectomy ablation for differentiated thyroid cancer destroys remnant thyroid tissue and any micrometastases, with thyroglobulin serving as a sensitive tumor marker in follow-up."
    difficulty: medium
    tags: [nuclear medicine, radioiodine, thyroid cancer, Graves disease, ablation]
  - front: "What is a V/Q scan and what finding suggests pulmonary embolism?"
    back: "V/Q scan evaluates ventilation/perfusion matching. PE is suggested by an unmatched defect: areas of lung that are well-ventilated but NOT perfused. Defects are wedge-shaped, extend to periphery, usually bilateral and multiple.\n\nV/Q scan is used when CT pulmonary angiography is contraindicated (e.g. contrast allergy, renal failure, pregnancy). In pregnancy, a modified perfusion-only scan with lower dose contrast is used if CXR is normal."
    difficulty: easy
    tags: [nuclear medicine, V/Q scan, pulmonary embolism, ventilation, perfusion]
  - front: "What are the relative contraindications to perfusion scanning in a V/Q scan?"
    back: "Severe pulmonary hypertension, right-to-left shunt, previous history of pneumonectomy, and small children.\n\nIn these conditions, macroaggregated albumin (MAA) particles injected IV could cause further compromise to already limited pulmonary vasculature or pass systemically through a right-to-left shunt causing systemic embolization."
    difficulty: medium
    tags: [nuclear medicine, V/Q scan, contraindications, pulmonary hypertension]
  - front: "What is the difference between a reversible and persistent defect on myocardial perfusion scan?"
    back: "Reversible defect (present only during stress): suggests ischemia. Persistent defect (present at rest AND stress): suggests infarction or myocardial scar.\n\nMyocardial perfusion scanning uses 99mTc-sestamibi or tetrofosmin. It distinguishes viable but ischemic myocardium from infarcted scar, guiding decisions about revascularization. Per COURAGE trial, >10% ischemic myocardium benefits most from revascularization."
    difficulty: easy
    tags: [nuclear medicine, myocardial perfusion, ischemia, infarction, COURAGE trial]
  - front: "What is a MUGA scan, what does it measure, and what is its most common indication?"
    back: "Radionuclide ventriculography using 99mTc-tagged red blood cells. Measures ejection fraction, ventricular volume, regional wall motion, intracardiac hemodynamics. Most common indication: monitoring cardiac toxicity with chemotherapy (e.g. anthracyclines) or herceptin; gold standard EF measurement in defibrillator workup.\n\nMUGA sums at least 200 cardiac cycles for accurate assessment. It is preferred over echocardiography for serial EF monitoring in oncology due to high reproducibility, ensuring timely detection of chemotherapy-induced cardiotoxicity."
    difficulty: medium
    tags: [nuclear medicine, MUGA, ejection fraction, chemotherapy toxicity, cardiotoxicity]
  - front: "What is a HIDA scan and what are its indications?"
    back: "Cholescintigraphy using 99mTc-DISIDA or 99mTc-mebrofenin (hepatobiliary iminodiacetic acid). Indications: suspected biliary tract obstruction, post-operative bile leaks, biliary dyskinesia, and workup of cholecystitis when abdominal U/S is equivocal.\n\nAcute cholecystitis: no gallbladder visualization at 4h or 1h after morphine. Chronic cholecystitis: no visualization at 1h but seen at 4h or after morphine. DDx of obstructed cystic duct includes alcoholic liver disease, prolonged fasting, and parenteral nutrition."
    difficulty: medium
    tags: [nuclear medicine, HIDA scan, cholecystitis, biliary, hepatobiliary]
  - front: "How does a hepatic hemangioma appear on tagged RBC scan?"
    back: "Cold early (limited blood flow to lesion), fills in later (accumulation of tagged cells greater than surrounding liver parenchyma) — this characteristic pattern is diagnostic of hemangioma.\n\nThe 'fill-in' pattern on delayed RBC scan reliably distinguishes hemangioma from other liver lesions (e.g. malignancy), which do not accumulate RBCs. This is helpful when MRI is contraindicated or equivocal."
    difficulty: medium
    tags: [nuclear medicine, RBC scan, hemangioma, liver, hepatic]
  - front: "What is the urea breath test, what does it diagnose, and what is its sensitivity/specificity?"
    back: "Preferred method to diagnose active H. pylori infection and confirm post-treatment eradication. Sensitivity and specificity ~95%. Patient takes 14C-labelled urea orally; H. pylori metabolizes it to ammonia and 14CO2, which is measured.\n\nThe urea breath test is non-invasive and highly accurate for active H. pylori infection. It is preferred over serology (which cannot confirm eradication) and is used before and after treatment. It should be performed at least 4 weeks after antibiotic therapy."
    difficulty: easy
    tags: [nuclear medicine, urea breath test, H. pylori, eradication, sensitivity]
  - front: "What are the indications for functional renal imaging (nuclear medicine) in adults vs. children?"
    back: "Adults: UPJ obstruction, renal transplant evaluation, nuclear GFR study for kidney donation candidates. Children: pyelonephritis assessment and vesicoureteral reflux.\n\n99mTc-DTPA (static) and 99mTc-MAG3 (dynamic) provide relative function between two kidneys. MAG3 is preferred in impaired renal function (tubular secretion rather than glomerular filtration). DMSA is used specifically for cortical scarring in pyelonephritis."
    difficulty: medium
    tags: [nuclear medicine, renal imaging, UPJ obstruction, renal transplant, pediatric]
  - front: "What are the complications of angiography (<5% of patients)?"
    back: "Puncture site hematoma, pseudoaneurysm, dissection, thrombosis, infection, AV fistula, embolic occlusion of a distal vessel.\n\nConventional angiography remains the gold standard for vascular anatomy but carries procedural risks. Improved non-invasive modalities (Doppler U/S, CTA, MRA) are now preferred for diagnosis, with conventional angiography reserved for intervention or inadequate non-invasive imaging."
    difficulty: medium
    tags: [interventional radiology, angiography, complications, vascular]
  - front: "What are the indications for vascular embolization?"
    back: "Management of hemorrhage (epistaxis, trauma, GI bleed, GU bleed), AV malformation treatment, preoperative devascularization of vascular tumours (bone metastases, RCC), ovarian vein embolization for chronic pelvic pain, varicocele embolization for infertility, symptomatic uterine fibroids.\n\nEmbolization uses permanent agents (Amplatzer plugs, coils, glue, onyx) or temporary agents (gel foam, autologous clots). Complications include post-embolization syndrome (pain, fever, leukocytosis) and unintentional non-target organ embolization."
    difficulty: medium
    tags: [interventional radiology, embolization, hemorrhage, uterine fibroids, vascular]
  - front: "What are the complications of thrombolytic therapy (catheter-directed or systemic)?"
    back: "Bleeding, stroke, distal embolus, reperfusion injury in delayed intervention (myoglobinuria and renal failure if advanced ischemia is present).\n\nThrombolytic agents (tPA, urokinase, streptokinase, TNK) dissolve thrombus but increase bleeding risk significantly. The most common indication is ischemic limb. Thrombolytics reduce PE recurrence and may reduce PE-related death when combined with heparin, but increase major hemorrhagic events."
    difficulty: medium
    tags: [interventional radiology, thrombolytics, tPA, complications, PE]
  - front: "What are the BI-RADS mammography categories and their management recommendations?"
    back: "BI-RADS 0: Incomplete — additional imaging. BI-RADS 1: Negative (0% malignancy) — routine screening. BI-RADS 2: Benign (0%) — routine screening. BI-RADS 3: Probably benign (<2%) — unilateral mammogram at 6 months. BI-RADS 4: Suspicious (3-94%) — biopsy. BI-RADS 5: Highly suspicious (≥95%) — biopsy. BI-RADS 6: Biopsy-confirmed malignancy (100%) — definitive therapy.\n\nBI-RADS is a standardized reporting system from the ACR that ensures clear communication and guides management. BI-RADS 4 is subdivided into 4A (3-10%), 4B (11-50%), and 4C (51-94%) to reflect varying levels of suspicion for malignancy."
    difficulty: easy
    tags: [medical imaging, mammography, BI-RADS, breast, screening]
  - front: "When should breast ultrasound be used as first-line imaging over mammography?"
    back: "In women under 30 years old (denser breast tissue makes mammography less sensitive), and in lactating or pregnant women. Women over 30 require mammogram first.\n\nDense breast tissue in young women reduces mammographic sensitivity. U/S differentiates cystic from solid masses and characterizes palpable abnormalities. In pregnancy and lactation, U/S avoids radiation and addresses the increased glandular tissue limiting mammographic sensitivity."
    difficulty: easy
    tags: [medical imaging, breast ultrasound, mammography, young women, lactation]
  - front: "What are the indications for breast MRI (contrast-enhanced)?"
    back: "Problem-solving after complete mammographic and U/S workup; occult primary with axillary metastases; suspected silicone implant rupture; evaluation of diagnosed breast cancer (margins, recurrence, chemo response); high-risk screening (BRCA1/2, lifetime risk >25%, high-risk marker on biopsy, chest radiation before age 30).\n\nBreast MRI has sensitivity 95-100% for invasive breast cancer but variable specificity (37-97%). It is not used as a first-line modality but is the most sensitive tool for high-risk screening in conjunction with mammography."
    difficulty: medium
    tags: [medical imaging, breast MRI, BRCA, high-risk screening, breast cancer]
  - front: "What mammographic features suggest a benign versus malignant breast mass?"
    back: "Benign: oval/round/lobular shape, circumscribed well-defined margin, radiolucent (oil cyst, lipoma). Malignant: irregular shape, indistinct/microlobulated/spiculated margin, radiodense. Benign calcifications: popcorn, lucent-centred, layering, vascular, round. Malignant calcifications: pleomorphic, amorphous, fine linear, coarse heterogeneous — clustered/segmental/regional distribution.\n\nSpiculated margins are highly suspicious for malignancy, reflecting desmoplastic reaction around invasive cancer. Popcorn calcifications are pathognomonic of hyalinizing fibroadenoma. Clustered pleomorphic calcifications often indicate DCIS."
    difficulty: medium
    tags: [medical imaging, mammography, breast mass, calcifications, malignancy]
  - front: "What high-risk criteria qualify a woman for breast MRI screening?"
    back: "Known BRCA1 or BRCA2 mutation (or untested first-degree relative of carrier); family history consistent with hereditary breast cancer syndrome and/or estimated personal lifetime risk >25%; high-risk marker on prior biopsy (ADH, ALH, LCIS); radiation therapy to chest before age 30.\n\nIn high-risk women, annual MRI with mammography is recommended (Canadian guidelines). MRI detects additional cancers not seen on mammography in BRCA carriers due to the aggressive, rapidly-growing nature of BRCA-associated cancers."
    difficulty: medium
    tags: [medical imaging, breast MRI, BRCA, high-risk, ADH, LCIS]
  - front: "What is the PREPIC trial conclusion regarding IVC filters?"
    back: "IVC filters reduced PE in the short term (12 days: 2 vs 9 patients) but increased recurrent DVT at 2 years (37 vs 21 patients), with no significant difference in overall mortality. Benefits of IVC filters were counterbalanced by their risks.\n\nThe PREPIC trial (NEJM 1998) enrolled 400 patients with proximal DVT randomized to heparin ± IVC filter. This landmark trial established that IVC filters prevent early PE but promote DVT recurrence, informing the indications for their selective use."
    difficulty: hard
    tags: [interventional radiology, IVC filter, PREPIC trial, DVT, PE, landmark trial]
  - front: "What did the AMACING trial conclude about prophylactic hydration for contrast-induced nephropathy?"
    back: "No prophylactic hydration is non-inferior to IV hydration (0.9% NaCl) in preventing contrast-induced nephropathy in high-risk patients (eGFR 30-59) receiving iodinated contrast for elective procedures (2.6% vs 2.7% CIN rates).\n\nAMACING trial (Lancet 2017) challenged the standard practice of pre-hydration for CIN prevention. This has implications for streamlining outpatient contrast procedures, though guidelines may still recommend hydration in very high-risk scenarios."
    difficulty: hard
    tags: [interventional radiology, contrast nephropathy, AMACING trial, hydration, CIN]
  - front: "What did the ESTIMABL2 trial conclude about radioiodine after thyroidectomy in low-risk thyroid cancer?"
    back: "No significant difference in postoperative abnormalities between patients who received (4.1%) and did not receive (4.4%) postoperative radioiodine after thyroidectomy for low-risk differentiated thyroid cancer. Radioiodine use is negligible in preventing post-thyroidectomy abnormalities in low-risk disease.\n\nESTIMABL2 (NEJM 2022) enrolled 730 patients with low-risk differentiated thyroid cancer. These results support omitting radioiodine ablation in low-risk patients, reducing unnecessary radiation exposure and healthcare costs."
    difficulty: hard
    tags: [nuclear medicine, ESTIMABL2 trial, thyroid cancer, radioiodine, thyroidectomy]
  - front: "What did the NCT03702413 trial (NEJM 2022) conclude about endovascular therapy for large ischemic strokes?"
    back: "In patients with large cerebrovascular occlusions (ASPECTS 3-5), endovascular therapy plus medical care resulted in better functional outcomes (modified Rankin score 0-3 at 90 days: 31% vs 12.7%) compared to medical care alone.\n\nThis RCT expanded endovascular thrombectomy indications to include large infarct cores previously considered too extensive for intervention. The Alberta Stroke Program Early CT Score (ASPECTS) 3-5 indicates a large infarct but residual salvageable tissue that benefits from reperfusion."
    difficulty: hard
    tags: [interventional radiology, stroke, endovascular therapy, ASPECTS, thrombectomy]
  - front: "What did the RENOVATE-COMPLEX-PCI trial conclude about intravascular imaging-guided PCI?"
    back: "Intravascular imaging-guided PCI (vs. angiography-guided) is associated with lower rates of cardiac death (1.7% vs 3.8%), target-vessel MI (3.7% vs 5.6%), and target-vessel revascularization (3.4% vs 5.5%) in patients with complex coronary lesions.\n\nRENOVATE-COMPLEX-PCI (NEJM 2023) enrolled 1639 patients. Intravascular imaging (IVUS or OCT) provides cross-sectional vessel assessment enabling optimal stent sizing and deployment, reducing complications in complex lesions."
    difficulty: hard
    tags: [interventional radiology, PCI, RENOVATE trial, intravascular imaging, coronary]
  - front: "What is the DISCHARGE trial conclusion regarding CT vs. invasive coronary angiography for stable chest pain?"
    back: "CT and invasive coronary angiography (ICA) had comparable rates of major adverse CV events (2.1% vs 3.0%). CT had significantly lower risk of major procedure-related complications (0.5% vs 1.9%). CT is a safe first-line investigation for stable chest pain with indeterminate pretest probability of CAD.\n\nDISCHARGE (NEJM 2022) enrolled 3561 patients. CT coronary angiography has emerged as a guideline-recommended first-line investigation for stable chest pain due to its safety profile and comparable diagnostic accuracy to invasive angiography."
    difficulty: hard
    tags: [medical imaging, DISCHARGE trial, CT coronary angiography, stable chest pain, CAD]
  - front: "What are the indications for percutaneous transluminal angioplasty and stenting?"
    back: "Renal, iliac, femoral, mesenteric, subclavian, coronary, and carotid artery stenoses. Alternative to surgical bypass with 5-year patency rates similar to surgery (site-dependent). Vascular stents improve long-term patency after angioplasty and treat angioplasty failures/complications.\n\nPTA restores blood flow by inflating a balloon catheter within a stenosed vessel. Stent grafts (metal mesh with durable fabric) can treat aneurysms and AV fistulas. Complications are similar to angiography plus include vessel rupture."
    difficulty: medium
    tags: [interventional radiology, angioplasty, stent, vascular stenosis, bypass]
  - front: "In evaluating fractures on plain film, what information must be provided in the description?"
    back: "1) Site of fracture (bone, region, intra-articular vs. extra-articular). 2) Pattern of fracture line (simple vs. comminuted). 3) Displacement (distal fragment relative to proximal). 4) Soft tissue involvement (calcification, gas, foreign bodies). 5) Type of fracture (stress vs. pathologic).\n\nComplete fracture description communicates the injury clearly and guides management. Intra-articular fractures require anatomic reduction. Pathological fractures through underlying lesions require additional workup. Soft tissue gas suggests open fracture or infection."
    difficulty: easy
    tags: [medical imaging, fracture, plain film, X-ray, description]
  - front: "What are the components of a systematic approach to bone X-ray interpretation?"
    back: "1) Identification (name, MRN, age, study type, region). 2) Soft tissues (swelling, calcification/ossification, loss of tissue planes). 3) Joints (alignment, joint space, effusion, osteophytes, erosions, proliferative changes, density, pattern, symmetry). 4) Bone (periosteum, cortex, medulla, trabeculae, density, articular surfaces, bone destruction/production, lesion borders).\n\nAge is critically important for choosing the correct differential — bone tumors have age-related distributions (e.g., Ewing sarcoma in children/young adults, metastases in adults over 40). Primary bone tumors are rare after the 3rd decade."
    difficulty: easy
    tags: [medical imaging, bone X-ray, systematic approach, interpretation]
  - front: "What soft tissue masses are commonly benign vs. what diagnosis requires urgent workup?"
    back: "Commonly benign: lipomas, benign peripheral nerve sheath tumours, vascular malformations. Requires urgent workup: soft tissue sarcomas (uncommon but require urgent specialized treatment). If mass is not clearly benign, biopsy or wide excision is required for diagnosis.\n\nU/S distinguishes lipoma from cyst from solid mass. MRI characterizes indeterminate masses. Any mass growing rapidly, >5cm, deep to fascia, or with heterogeneous MRI signal should be referred urgently to sarcoma centre before biopsy."
    difficulty: easy
    tags: [medical imaging, soft tissue tumour, sarcoma, lipoma, MRI]
  - front: "What are the indications for ordering an abdominal X-ray (AXR)?"
    back: "Acute abdomen: bowel perforation, toxic megacolon, bowel ischemia, small/large bowel obstruction. Chronic symptoms: constipation, calcifications (gallstones, renal stones, bladder stones). NOT useful for: GI bleeds, chronic anemia, vague GI symptoms.\n\nAXR is a rapid, low-cost first-line tool for acute abdominal emergencies. It lacks sufficient sensitivity for soft-tissue pathology like GI bleeds, making CT or endoscopy superior in those settings."
    difficulty: easy
    tags: [medical imaging, abdominal X-ray, AXR, acute abdomen, radiology]
  - front: "What are the three views of an abdominal X-ray (AXR)?"
    back: "1. Erect/Upright, 2. Supine, 3. Left lateral decubitus.\n\nEach view provides complementary information: the erect view detects free air under the diaphragm, the supine view evaluates bowel gas pattern, and the left lateral decubitus (patient lying on left side) detects free air between the liver and right abdominal wall."
    difficulty: easy
    tags: [medical imaging, AXR, radiology, views]
  - front: "What differentiates small bowel from large bowel on abdominal X-ray?"
    back: "Small bowel: uninterrupted valvulae conniventes (plicae circulares), central location, max diameter 3 cm, max fold thickness 3 mm, rarely contains solid fecal material. Large bowel: interrupted haustra extending only partway across lumen, peripheral (picture frame) location, max diameter 6 cm (9 cm at cecum), max fold thickness 5 mm, commonly contains solid fecal material.\n\nDistinguishing small from large bowel is critical for identifying the level of obstruction. Valvulae conniventes cross the entire width of the small bowel lumen, while haustra only partially traverse the colon — a key differentiating feature."
    difficulty: medium
    tags: [medical imaging, AXR, small bowel, large bowel, obstruction, radiology]
  - front: "What is the mnemonic for interpreting an abdominal X-ray, and what does each letter stand for?"
    back: "'Free ABDO': Free (free air and fluid), A (air in the bowel), B (bowel wall thickening), D (densities/calcifications), O (organs).\n\nA systematic approach prevents missed findings. 'Free' refers to intraperitoneal and retroperitoneal abnormal air or fluid; 'A' covers ileus vs. obstruction; 'B' covers ischemia/IBD; 'D' covers calcifications by quadrant; 'O' covers organ outlines like psoas, liver, kidneys."
    difficulty: easy
    tags: [medical imaging, AXR, mnemonic, radiology, approach]
  - front: "What does free intraperitoneal air on AXR indicate, and how long can it persist postoperatively?"
    back: "Free intraperitoneal air suggests rupture of a hollow viscus (e.g., anterior duodenum, transverse colon), penetrating trauma, or recent surgery. Postoperative free air can persist for up to 7 days and be a normal finding.\n\nPneumoperitoneum from perforation is a surgical emergency. The key distinction is whether free air is expected (recent surgery <7 days) or unexpected (suggesting perforation). On upright film, air collects under the diaphragm; on left lateral decubitus, air collects between the liver and abdominal wall."
    difficulty: medium
    tags: [medical imaging, AXR, pneumoperitoneum, perforation, free air]
  - front: "Describe the AXR appearance of sigmoid, cecal, and small bowel volvulus."
    back: "Sigmoid volvulus (most common): massively dilated sigmoid projecting to right/mid-upper abdomen with proximal dilation — 'coffee bean' sign. Cecal volvulus: massively dilated bowel loop projecting to left/mid-upper abdomen with small bowel dilation — 'bird's beak' sign. Small bowel volvulus: 'corkscrew' sign on CT and 'whirlpool' sign describing twisting of mesenteric vessels.\n\nVolvulus occurs when bowel twists on its mesenteric axis. Sigmoid volvulus is most common (due to long sigmoid mesentery) and usually seen in elderly constipated patients. Cecal volvulus occurs when cecum is hypermobile. Recognition of these signs enables rapid diagnosis and surgical/endoscopic intervention."
    difficulty: medium
    tags: [medical imaging, AXR, volvulus, sigmoid, cecal, coffee bean sign, birds beak sign]
  - front: "What are the diagnostic criteria for toxic megacolon on AXR?"
    back: "Extreme dilatation of the colon (>6.5 cm) with mucosal changes (foci of edema, ulceration, pseudopolyps) and loss of normal haustral pattern. It is a manifestation of fulminant colitis.\n\nToxic megacolon is a life-threatening complication of severe colitis (UC, Crohn's, C. difficile, ischemic colitis). The dilated, inflamed colon risks perforation. AXR is used for rapid diagnosis. Management includes ICU admission, bowel rest, IV fluids, antibiotics, and often emergent surgery."
    difficulty: medium
    tags: [medical imaging, AXR, toxic megacolon, colitis, IBD]
  - front: "What is 'thumb-printing' on an abdominal X-ray, and what conditions cause it?"
    back: "Thumb-printing refers to thumb-like indentations of the bowel wall representing bowel wall thickening (increased soft tissue density). Causes include IBD, infection, ischemia, hypoproteinemic states, and submucosal hemorrhage.\n\nThumb-printing appears when the bowel wall becomes edematous or hemorrhagic, creating regular indentations that resemble fingerprints. The associated 'stacked coin' or 'picket fence' appearance of valvulae conniventes also suggests bowel wall pathology."
    difficulty: medium
    tags: [medical imaging, AXR, thumb-printing, bowel wall thickening, ischemia, IBD]
  - front: "What abdominal calcifications can be seen in the RUQ, RLQ, LUQ, LLQ, and central regions on AXR?"
    back: "RUQ: renal stone, adrenal calcification, gallstone, porcelain gallbladder. RLQ: ureteral stone, appendicolith, gallstone ileus. LUQ: renal stone, adrenal calcification, tail of pancreas. LLQ: ureteral stone. Central: aorta/aortic aneurysm, pancreas, lymph nodes. Pelvis: phleboliths, uterine fibroids, bladder stones.\n\nSystematic evaluation of calcifications by anatomical quadrant helps narrow the differential diagnosis. Phleboliths (calcified pelvic veins) are common incidental findings with a characteristic round appearance and lucent centre, distinguishing them from ureteral stones."
    difficulty: medium
    tags: [medical imaging, AXR, calcifications, gallstones, renal stones, appendicolith]
  - front: "How do you differentiate biliary air from portal venous air on AXR?"
    back: "Biliary air is most prominent centrally over the liver (air follows bile flow centrally). Portal venous air is most prominent peripherally over the liver in a branching pattern (air follows portal venous blood to the periphery). Mnemonic: 'Go with the flow.'\n\nThis distinction has major clinical significance: biliary air is often benign (post-sphincterotomy, gallstone ileus, emphysematous cholecystitis), whereas portal venous air is an ominous finding indicating bowel ischemia/infarction requiring emergent intervention."
    difficulty: hard
    tags: [medical imaging, AXR, biliary air, portal venous air, bowel ischemia]
  - front: "What are the causes of biliary air versus portal venous air on AXR?"
    back: "Biliary air: sphincterotomy, gallstone ileus, erosive peptic ulcer, cholangitis, emphysematous cholecystitis. Portal venous air: bowel ischemia/infarction.\n\nPortal venous air represents gas produced by infarcted bowel that crosses the gut wall into the portal circulation. It is a sign of mesenteric ischemia and carries high mortality. Biliary air, in contrast, usually results from iatrogenic communication between the bile ducts and bowel or duodenum."
    difficulty: hard
    tags: [medical imaging, AXR, portal venous air, biliary air, bowel ischemia, gallstone ileus]
  - front: "What is Rigler's sign, and what does it indicate?"
    back: "Rigler's sign (double-wall sign) is visualization of both the inner and outer bowel wall on a supine AXR, indicating large amounts of intraperitoneal free air outlining the serosal surface of the bowel.\n\nNormally, only the inner mucosal surface of the bowel is visible due to intraluminal gas. When free intraperitoneal air is also present, it outlines the outer (serosal) wall, making both walls visible. This indicates perforation of a hollow viscus and requires emergent surgical evaluation."
    difficulty: medium
    tags: [medical imaging, AXR, Riglers sign, pneumoperitoneum, perforation]
  - front: "Differentiate adynamic (paralytic) ileus from mechanical bowel obstruction on AXR."
    back: "Adynamic ileus: normal or dilated bowel loops, air-fluid levels at same level in the same loop, gas throughout GI tract (generalized or localized 'sentinel loop'). Mechanical obstruction: usually dilated loops, multiple air-fluid levels giving 'step ladder' appearance (indicating peristalsis), 'string of pearls' sign, dilated bowel to the obstruction point with NO air distal, 'hairpin' (180°) turns.\n\nDistinguishing ileus from obstruction guides management. Ileus is treated with supportive care (NPO, IV fluids, treat underlying cause), while mechanical obstruction may require surgical or endoscopic intervention. The sentinel loop in localized ileus remains stationary on serial films, adjacent to the area of inflammation."
    difficulty: hard
    tags: [medical imaging, AXR, ileus, bowel obstruction, step ladder, string of pearls]
  - front: "What are the indications for CT with IV contrast in abdominal imaging, and what are the contraindications?"
    back: "Indications: portal venous phase for most cases; biphasic (arterial + portal venous) for liver, pancreas, and bile duct tumours. Contraindications: impaired renal function (eGFR <30 mL/min/1.73 m²). Caution: contrast allergy (pre-medicate with steroids and antihistamines).\n\nContrast-induced nephropathy is a significant risk. Canadian guidelines recommend checking renal function before contrast administration and avoiding it when eGFR <30. Pre-medication protocols (steroids + antihistamines) reduce but do not eliminate the risk of allergic reactions."
    difficulty: medium
    tags: [medical imaging, CT, contrast, renal function, eGFR, nephropathy]
  - front: "What is the '3-6-9 rule' in bowel obstruction on CT?"
    back: "The maximum normal diameter: small bowel = 3 cm, large bowel = 6 cm, cecum = 9 cm. Dilation beyond these thresholds indicates obstruction. Cecal dilation >9 cm suggests impending perforation (e.g., in untreated Ogilvie's syndrome).\n\nThis rule provides a practical guide to identify bowel dilation and assess urgency. Cecal perforation risk increases significantly as diameter approaches 9-12 cm. Ogilvie's syndrome (acute colonic pseudo-obstruction) is a functional obstruction without a mechanical cause, often seen in post-surgical or critically ill patients."
    difficulty: medium
    tags: [medical imaging, CT, bowel obstruction, 3-6-9 rule, cecum, Ogilvies syndrome]
  - front: "What is a closed-loop obstruction, and why is it dangerous?"
    back: "A closed-loop obstruction occurs when bowel is obstructed at two points (usually small bowel), creating a loop obstructed both proximally and distally. Complications (ischemia, perforation, necrosis) can develop rapidly.\n\nUnlike a simple obstruction (one obstruction point), closed-loop obstruction traps a segment without any decompression route. Rising intraluminal pressure rapidly compromises vascular supply leading to strangulation and necrosis. CT is the best imaging modality to diagnose this surgical emergency."
    difficulty: hard
    tags: [medical imaging, CT, closed-loop obstruction, bowel obstruction, ischemia, strangulation]
  - front: "What contrast study is used to evaluate dysphagia and possible aspiration, and what does it assess?"
    back: "Cine esophagogram (videofluoroscopy): contrast agent swallowed and recorded for playback analysis. Evaluates the cervical esophagus for dysphagia, swallowing incoordination, aspiration, and post-operative cleft palate repair. Findings: aspiration, webs, Zenker's diverticulum, cricopharyngeal bar, laryngeal tumour.\n\nThe cine esophagogram is the gold standard for evaluating oropharyngeal dysphagia and aspiration risk. Real-time fluoroscopic assessment reveals subtle swallowing dysfunction not captured by static imaging. A speech-language pathologist often co-performs the study."
    difficulty: medium
    tags: [medical imaging, contrast studies, esophagogram, dysphagia, aspiration, Zenkers diverticulum]
  - front: "What imaging study is used to assess Zenker's diverticulum and cricopharyngeal bar?"
    back: "Cine esophagogram (videofluoroscopy) of the cervical esophagus.\n\nZenker's diverticulum is a pharyngeal pouch at Killian's triangle (posterior hypopharynx) caused by cricopharyngeal dysfunction. It presents with dysphagia, regurgitation of undigested food, and halitosis. The cine esophagogram demonstrates the characteristic posterior outpouching."
    difficulty: medium
    tags: [medical imaging, esophagogram, Zenkers diverticulum, cricopharyngeal bar, dysphagia]
  - front: "When is enteroclysis preferred over enterography for small bowel imaging?"
    back: "Enteroclysis uses a nasojejunal (NJ) tube to pump contrast (barium, psyllium, or sorbitol) directly into the small bowel, providing better distension for detailed mucosal assessment. Enterography has the patient drink 1-2 L of contrast solution. Both are indicated for IBD, malabsorption, weight loss/anemia, and Meckel's diverticulum.\n\nEnteroclysis provides superior luminal distension and mucosal detail compared to enterography but is more invasive. MR enterography is preferred over CT enterography in young IBD patients to minimize radiation exposure. CT or MRI are the modalities used."
    difficulty: medium
    tags: [medical imaging, enterography, enteroclysis, small bowel, IBD, MRI, CT]
  - front: "What is the best imaging modality for evaluating acute cholecystitis, and what are the key sonographic findings?"
    back: "Best modality: Ultrasound (U/S) has the best sensitivity and specificity. Key findings: gallstones + positive sonographic Murphy's sign (tenderness from U/S probe pressure over visualized gallbladder). Secondary findings: thickened gallbladder wall (>3 mm), dilated gallbladder, pericholecystic fluid. HIDA scan used for acalculous or chronic cholecystitis.\n\nU/S is preferred as the initial imaging for right upper quadrant pain as it avoids radiation, is widely available, and can assess bile ducts simultaneously. Acalculous cholecystitis (no stones) occurs in critically ill patients due to gallbladder ischemia/cholestasis and is diagnosed with HIDA scan when U/S is negative."
    difficulty: medium
    tags: [medical imaging, ultrasound, acute cholecystitis, Murphys sign, HIDA scan, gallstones]
  - front: "What is the management of acute cholecystitis?"
    back: "Admit, NPO, IV fluids, analgesia, cefazolin (antibiotic coverage), and early laparoscopic cholecystectomy.\n\nEarly laparoscopic cholecystectomy (within 24-72 hours of presentation) reduces hospital stay and complication rates compared to delayed surgery. Cefazolin covers gram-positive and some gram-negative organisms adequate for community-acquired cholecystitis. Piperacillin-tazobactam or carbapenems are reserved for severe/complicated cases."
    difficulty: easy
    tags: [medical imaging, acute cholecystitis, management, cholecystectomy, cefazolin]
  - front: "What is the management of acute appendicitis?"
    back: "Admit, NPO, IV fluids, analgesia, cefazolin + metronidazole (antibiotics), and appendectomy.\n\nAppendectomy remains the standard of care for uncomplicated appendicitis. Antibiotic therapy alone (cefazolin + metronidazole for gram-negatives and anaerobes) is an alternative for uncomplicated cases in selected patients, with approximately 70-75% success at 1 year but higher recurrence rates. Complicated appendicitis (perforation, abscess) may require interval appendectomy after initial drainage."
    difficulty: easy
    tags: [medical imaging, appendicitis, management, appendectomy, cefazolin, metronidazole]
  - front: "What is the best imaging modality for acute diverticulitis, and what are the key CT findings?"
    back: "Best modality: CT (U/S sometimes used). Oral and rectal contrast given before CT. Key CT findings (cardinal signs): thickened bowel wall, mesenteric infiltration, gas-filled diverticula, abscess. Chronic complications: fistula (most common to bladder — colovesical fistula) or sinus tract.\n\nCT is preferred over U/S because it better characterizes the extent of disease, identifies complications (abscess, perforation, fistula), guides percutaneous drainage, and helps exclude perforated colon cancer. A colovesical fistula presents with pneumaturia and recurrent UTIs."
    difficulty: medium
    tags: [medical imaging, CT, diverticulitis, abscess, colovesical fistula]
  - front: "What is the best imaging modality for acute pancreatitis, and what are the CT findings?"
    back: "Best modality: CT (1st line for assessing complications). Diagnosis cannot be excluded by imaging alone (clinical/biochemical diagnosis). U/S for screening and follow-up. CT findings: enlarged pancreas with edema, fat stranding with indistinct fat planes, mesenteric and Gerota's fascia thickening, pseudocyst in lesser sac, abscess (gas or thick-walled fluid collection), pancreatic necrosis (low attenuation non-enhancing pancreatic tissue), hemorrhage.\n\nAcute pancreatitis is diagnosed clinically (pain + lipase >3x upper limit of normal). CT is reserved for cases of diagnostic uncertainty or to assess complications. CT severity index (Balthazar score) grades complications. Pancreatic necrosis appears as non-enhancing areas on contrast-enhanced CT and predicts severe disease requiring debridement."
    difficulty: medium
    tags: [medical imaging, CT, pancreatitis, pancreatic necrosis, pseudocyst]
  - front: "What is the best imaging modality for chronic pancreatitis, and what are the key findings?"
    back: "Best modality: MRCP (can show calcification and duct obstruction). U/S, CT, and MRI may show: calcifications, ductal dilatation, enlargement of the pancreas, fluid collections (e.g., pseudocysts) adjacent to the gland.\n\nMRCP (MR cholangiopancreatography) provides non-invasive imaging of the pancreatic and biliary ductal system without radiation or contrast injection. It is superior to CT for detecting early ductal changes. Pancreatic duct calculi and 'chain of lakes' dilatation pattern are classic findings of chronic pancreatitis."
    difficulty: medium
    tags: [medical imaging, MRCP, chronic pancreatitis, calcifications, ductal dilatation]
  - front: "What imaging modality is preferred for evaluating liver masses, and what is the follow-up after an incidental liver lesion on U/S?"
    back: "MRI is excellent for evaluating primary liver tumours, metastases, and differentiating benign hepatic hemangiomas from malignant lesions. CT + IV contrast is the most popular procedure for liver parenchyma. After identifying a liver lesion on U/S, follow-up imaging should be CT or MRI — four-phase CT (non-contrast, arterial, venous, delayed) to distinguish hemangioma from other tumours.\n\nThe 'liver mass DDx 5Hs' includes: HCC, Hydatid cyst, Hemangioma, Hepatic adenoma, Hyperplasia (focal nodular). Hemangioma shows peripheral globular enhancement in arterial phase with central filling on delayed scans. HCC is hypervascular with arterial enhancement and venous washout — the hallmark on triphasic CT."
    difficulty: hard
    tags: [medical imaging, liver, liver mass, MRI, CT, hemangioma, HCC]
  - front: "What are the CT findings that distinguish hepatic hemangioma from HCC?"
    back: "Hemangioma: peripheral globular enhancement in arterial phase, central filling and persistent enhancement on delayed scans. HCC: hypervascular enhancement in arterial phase with washout in venous phase, portal venous tumour thrombus.\n\nThe 'arterial enhancement, venous washout' pattern is pathognomonic for HCC on dynamic contrast-enhanced CT or MRI, allowing LI-RADS classification without biopsy in cirrhotic patients. Hemangioma's classic 'fill-in' pattern on delayed imaging distinguishes it from malignancy."
    difficulty: hard
    tags: [medical imaging, CT, liver, hemangioma, HCC, contrast enhancement]
  - front: "What is elastography, and what is its clinical application in liver disease?"
    back: "Elastography measures shear wave velocity by U/S (FibroScan) or MRI (MR elastography) to non-invasively quantify liver fibrosis. It is used to stage liver fibrosis in chronic liver disease (e.g., chronic hepatitis B/C, NAFLD) without liver biopsy.\n\nFibroScan/elastography has replaced liver biopsy as the first-line assessment of liver fibrosis in Canada. It is rapid, painless, and reproducible. Results are expressed in kilopascals (kPa); higher values indicate greater fibrosis. MR elastography is more accurate but less available."
    difficulty: medium
    tags: [medical imaging, elastography, FibroScan, liver fibrosis, cirrhosis]
  - front: "What CT finding suggests fatty liver infiltration, and what are the CT findings of cirrhosis?"
    back: "Fatty infiltration: liver appears hypodense (less dense than spleen — normal liver is more dense than spleen). Cirrhosis findings: liver small and irregular (fibrous scarring, segmental atrophy, regenerating nodules), porto-systemic shunts (caput medusae, esophageal varices, spontaneous spleno-renal shunt). On U/S: nodular and hyperechoic liver with irregular atrophy of right lobe and hypertrophy of caudate/left lobes.\n\nOn CT, the liver normally appears slightly denser (higher Hounsfield units) than the spleen. Hepatic steatosis reverses this relationship. Caudate lobe hypertrophy in cirrhosis occurs because it has separate blood supply directly from the portal vein that is less affected by cirrhotic changes."
    difficulty: hard
    tags: [medical imaging, CT, fatty liver, cirrhosis, portal hypertension, liver]
  - front: "What imaging modalities are used for pancreatic tumours, and what is the preferred modality for diagnosis and staging?"
    back: "U/S: identification of echogenic mass, often first diagnostic imaging in emergency setting. CT: preferred modality for diagnosis and staging. MRCP: imaging of ductal system (no therapeutic potential). ERCP: endoscopic dye injection with x-ray imaging — has therapeutic potential (stent placement, stone retrieval). Complication of ERCP: acute pancreatitis in 5% (diagnostic) to 10% (therapeutic) of procedures.\n\nCT with biphasic contrast (arterial + portal venous) is the gold standard for staging pancreatic cancer and assessing resectability (vascular involvement of SMA, SMV, portal vein). ERCP-induced pancreatitis is prevented by prophylactic rectal indomethacin and pancreatic stent placement in high-risk cases."
    difficulty: medium
    tags: [medical imaging, pancreas, CT, MRCP, ERCP, pancreatic cancer, pancreatitis]
  - front: "What imaging is used for acute cholecystitis and what is the role of HIDA scan?"
    back: "U/S is the best initial modality (best sensitivity and specificity). HIDA scan (hepatobiliary iminodiacetic acid nuclear scan) helps diagnose acalculous or chronic cholecystitis when U/S is negative or inconclusive. Radionuclide scanning has the best sensitivity and specificity for acute cholecystitis.\n\nHIDA scan traces bile flow from hepatocytes through the biliary system. Non-visualization of the gallbladder at 4 hours (despite hepatic and bowel activity) indicates cystic duct obstruction = acute cholecystitis. It is particularly useful when U/S is equivocal or for acalculous cholecystitis in critically ill patients."
    difficulty: medium
    tags: [medical imaging, cholecystitis, HIDA scan, nuclear medicine, acalculous cholecystitis]
  - front: "What is the Bosniak classification for cystic renal masses, and which classes require follow-up or intervention?"
    back: "Class I: simple cyst — benign, disregard. Class II: fine calcification or hyperdense cyst <3 cm — benign, disregard. Class IIF: multiple hairline-thin septa, non-enhancing high-attenuating lesions >3 cm — follow up. Class III: thick irregular walls/calcifications/enhancing septa — suspicious for malignancy, workup required. Class IV: soft tissue enhancement (>10 HU increase) with de-enhancement + necrosis — renal cell carcinoma, surgical management.\n\nThe Bosniak classification guides management of incidentally found renal cysts. Class IIF lesions require periodic imaging surveillance. Classes III and IV have 50-95% malignancy rates respectively and usually require surgical resection. Vascularity on CT (measured in Hounsfield units) is the key factor distinguishing benign from malignant complex cysts."
    difficulty: hard
    tags: [medical imaging, renal cyst, Bosniak classification, renal cell carcinoma, CT]
  - front: "What are the indications for plain CT KUB versus CT urography versus renal triphasic CT?"
    back: "Plain CT KUB: general renal anatomy, renal colic symptoms, assessment of renal calculi (size/location), hydronephrosis. CT urography: investigation of hematuria, detailed assessment of urinary tracts, high sensitivity (95%) for uroepithelial malignancies — phases: unenhanced + excretory. Renal triphasic CT: standard for renal masses, vascular assessment, characterization of suspicious masses (RCC vs. benign) — phases: unenhanced + arterial/venous (nephrographic) + excretory.\n\nCT urography is essential for the workup of hematuria in patients over 35 or with risk factors for urothelial cancer. The excretory phase allows visualization of the collecting system, ureters, and bladder. Triphasic CT evaluates enhancement characteristics that distinguish RCC from angiomyolipoma (fat density) and other benign lesions."
    difficulty: hard
    tags: [medical imaging, CT KUB, CT urography, triphasic CT, renal mass, hematuria]
  - front: "What are the ultrasound findings that differentiate a solid renal mass from a simple cyst?"
    back: "Solid renal masses: echogenic (bright on U/S). Simple cystic renal masses: smooth well-defined walls with anechoic interior (dark on U/S). Complicated cysts: internal echoes within a thickened, irregular wall.\n\nU/S is the initial study of choice for evaluating renal masses (no radiation, no contrast). Simple cysts meeting all criteria (anechoic, posterior acoustic enhancement, thin walls, no septations) are Bosniak I and require no follow-up. Complicated or solid masses require CT or MRI for further characterization."
    difficulty: medium
    tags: [medical imaging, ultrasound, renal mass, cyst, solid mass]
  - front: "What are the indications for retrograde pyelography?"
    back: "Visualize the urinary collecting system when intravenous techniques cannot opacify the renal pelvis/ureters due to: impaired renal function, high-grade obstruction, or allergy to IV contrast. Only yields information about the collecting system (no parenchymal information).\n\nRetrograde pyelography involves cystoscopy with ureteral catheterization and retrograde injection of contrast. It provides excellent visualization of the collecting system and ureters. Limitations include being invasive (requires cystoscopy) and providing no information about renal parenchyma."
    difficulty: medium
    tags: [medical imaging, retrograde pyelography, renal failure, contrast allergy, urinary tract]
  - front: "What are the indications for a voiding cystourethrogram (VCUG)?"
    back: "Males or young females with recurrent UTIs, hydronephrosis, hydroureter, suspected lower urinary tract obstruction, suspected bladder trauma, or vesicoureteral reflux (VUR).\n\nVCUG is the gold standard for diagnosing VUR in children with recurrent febrile UTIs. The bladder is filled with contrast until voiding is triggered, and fluoroscopy visualizes reflux into the ureters/kidneys. VUR grading (I-V) guides management (prophylactic antibiotics vs. surgical correction)."
    difficulty: medium
    tags: [medical imaging, VCUG, vesicoureteral reflux, UTI, hydronephrosis]
  - front: "What is a retrograde urethrogram, and when is it indicated?"
    back: "A small Foley catheter placed into the penile urethral opening followed by instillation of contrast and radiographic imaging. Indications: urethral strictures or trauma to the male urethra; first-line study if signs of urethral injury are present (blood at urethral meatus, scrotal hematoma, or high-riding prostate after trauma).\n\nUrethral injury is suspected in pelvic fracture with these signs. Urethral catheterization should NOT be performed until urethral integrity is confirmed by retrograde urethrogram, as catheter insertion can convert a partial urethral tear into a complete disruption."
    difficulty: medium
    tags: [medical imaging, retrograde urethrogram, urethral injury, trauma, urethral stricture]
  - front: "What are the advantages of MRI over CT for urological/renal imaging, and what are the specific indications for MRI?"
    back: "MRI advantages: better contrast resolution and tissue discrimination, no ionizing radiation, safer contrast (gadolinium), multiplanar imaging. Indications: previous nephron-sparing surgery, serial follow-up (less radiation), reduced renal function, solitary kidney, clinical staging of prostate cancer (endorectal coil MRI).\n\nGadolinium-based contrast agents can cause nephrogenic systemic fibrosis (NSF) in patients with severely impaired renal function (eGFR <30), so they are avoided in this population. However, MRI without contrast is still superior to CT for soft tissue characterization, making it the modality of choice for patients requiring serial imaging."
    difficulty: medium
    tags: [medical imaging, MRI, renal mass, prostate cancer, nephrogenic systemic fibrosis]
  - front: "What are the two types of renal nuclear scans (renogram and morphological), and what radionuclides are used?"
    back: "Renogram: assesses renal function and collecting system (evaluation of renal failure, workup of urinary tract obstruction and renovascular HTN, renal transplant investigation) — uses 99mTc-pentetate (DTPA) or mertiatide (MAG3), imaged at 1-3 sec intervals over first 60 seconds. Morphological: assesses renal anatomy (pyelonephritis, cortical scars) — uses 99mTc-DMSA or 99mTc-glucoheptonate.\n\nDTPA/MAG3 renography measures differential renal function and drainage. MAG3 is preferred for impaired renal function. DMSA scan is the gold standard for detecting renal cortical scars from pyelonephritis and is used in children with UTI to assess for scarring."
    difficulty: hard
    tags: [medical imaging, nuclear medicine, renal scan, renogram, DMSA, MAG3, DTPA]
  - front: "What are the indications for transvaginal ultrasound (TVUS) vs. transabdominal ultrasound for gynecological imaging?"
    back: "Transabdominal: good initial investigation for suspected pelvic pathology. TVUS: improved assessment of ovaries, first trimester development, and ectopic pregnancy. TVUS uses higher frequency sound waves (due to reduced distances) providing panoramic pelvic view and enhanced detail of deeper/smaller structures.\n\nTVUS is the cornerstone of gynecological imaging due to superior resolution from the intravaginal probe. It eliminates the need for a full bladder and provides clearer visualization of the endometrium, ovaries, and adnexa. It is essential in early pregnancy for dating, viability assessment, and diagnosing ectopic pregnancy."
    difficulty: easy
    tags: [medical imaging, ultrasound, TVUS, gynecology, ectopic pregnancy, pelvic imaging]
  - front: "What is a hysterosalpingogram (HSG), and what are its indications?"
    back: "HSG: x-ray images of the pelvis after cervical cannulation and opacifying agent injection. Indications: assessing uterine cavity and fallopian tube pathology, evaluating uterine abnormalities (e.g., bicornuate uterus), evaluating fertility (absence of flow from tubes to peritoneal cavity indicates obstruction), pre-procedure planning for hysteroscopic procedures (e.g., myomectomy).\n\nHSG is the primary investigation for tubal factor infertility. Bilateral tubal patency is confirmed by free spillage of contrast into the peritoneal cavity. Tubal blockage (hydrosalpinx, fibrosis) prevents spillage. The procedure is performed in the early follicular phase to avoid irradiating a potential pregnancy."
    difficulty: medium
    tags: [medical imaging, hysterosalpingogram, HSG, fertility, uterine abnormality, fallopian tube]
  - front: "What is a sonohysterogram, and what are its indications and contraindications?"
    back: "Sonohysterogram: transcervical saline introduction into the uterine cavity to provide enhanced endometrial visualization during TVUS. Indications: abnormal uterine bleeding, uterine cavity abnormalities (leiomyomas, polyps, synechiae), congenital uterine abnormalities, infertility, recurrent pregnancy loss. Contraindications: pregnancy, pelvic infection.\n\nSaline infusion sonohysterography (SIS) distends the endometrial cavity, allowing better visualization of intracavitary lesions than TVUS alone. It helps distinguish submucosal fibroids (which may require hysteroscopic resection) from intramural fibroids and polyps."
    difficulty: medium
    tags: [medical imaging, sonohysterogram, uterus, endometrium, abnormal uterine bleeding, infertility]
  - front: "What are the typical vs. atypical sonohysterogram findings for uterine polyps and leiomyomas?"
    back: "Polyps — Typical: well-defined, homogeneous, polypoid, isoechoic to endometrium with preserved endometrial-myometrial interface. Atypical: cystic components, multiple polyps, broad base, hypoechogenicity, or heterogeneity. Leiomyoma — Typical: well-defined, broad-based, hypoechoic solid masses with shadowing, overlying echogenic endometrium distorting interface. Atypical: pedunculation or multilobulated surface.\n\nDifferentiating polyps from submucosal fibroids guides treatment. Polyps are typically resected hysteroscopically with polypectomy forceps or electrosurgery. Submucosal fibroids may require hysteroscopic myomectomy or uterine artery embolization. Atypical features raise suspicion for hyperplasia or malignancy requiring endometrial biopsy."
    difficulty: hard
    tags: [medical imaging, sonohysterogram, polyp, leiomyoma, fibroid, endometrium]
  - front: "What is the important safety rule about CT imaging and female patients?"
    back: "Pregnancy must always be ruled out by beta-hCG (β-hCG) before performing CT of the female pelvis (or any organ system) in females of reproductive age.\n\nIonizing radiation from CT poses a teratogenic risk during organogenesis (weeks 2-8) and can increase risk of childhood malignancy. A negative β-hCG test prior to CT ensures patient safety. If CT is required in pregnancy (e.g., suspected PE or appendicitis), benefits vs. risks should be discussed, and radiation dose minimized."
    difficulty: easy
    tags: [medical imaging, CT, pregnancy, beta-hCG, radiation safety]
  - front: "What CT and MRI findings distinguish adrenocortical adenoma from adrenocortical carcinoma and pheochromocytoma?"
    back: "Adenoma: <3 cm, smooth round/oval, homogeneous, not highly vascular, contrast washout ≥50% at 10 min, stable growth, low density (intracellular fat), isointense on T2 MRI. Carcinoma: ≥4 cm, irregular with unclear margins, heterogeneous (mixed densities), necrosis/calcifications/hemorrhage, <50% washout at 10 min, rapid growth (>2 cm/yr). Pheochromocytoma: >3 cm, round/oval with clear margins, heterogeneous with cystic areas, vascular, <50% washout, slow growth, markedly hyperintense on T2 MRI.\n\nAdrenal incidentalomas are common (found in ~5% of CT scans). The most important distinction is adenoma (benign, no treatment) vs. malignant lesion. Key CT criteria: <3 cm + homogeneous + <10 HU (lipid-rich adenoma) + ≥50% washout are consistent with adenoma. Pheochromocytoma must be excluded biochemically before adrenal surgery."
    difficulty: hard
    tags: [medical imaging, adrenal mass, CT, MRI, adenoma, adrenocortical carcinoma, pheochromocytoma, incidentaloma]
  - front: "What is the first-line imaging modality for most neuropathology, and why?"
    back: "CT is the first-line modality for most neuropathology because of its speed, wide availability, and lower cost. It is particularly useful for: acute craniofacial trauma ('bone and blood'), acute stroke (initial triage), acute headache with focal neurologic signs/papilledema, suspected hemorrhage (epidural, subdural, subarachnoid, intraparenchymal), suspected hydrocephalus, altered mental status with suspected CNS infection or mass.\n\nWhile MRI provides superior soft tissue resolution, the speed of CT (~5 minutes) is critical in acute neurological emergencies where time-sensitive interventions (thrombolysis for stroke, surgical decompression for hemorrhage) are required. CT without contrast is 98% sensitive for subarachnoid hemorrhage within 6 hours of headache onset."
    difficulty: easy
    tags: [medical imaging, CT, neuroradiology, head CT, acute stroke, hemorrhage]
  - front: "What are the danger signs on head CT requiring urgent action?"
    back: "Space-occupying process, hemorrhage, edema, mass effect, midline shift, uncal and tonsillar herniation, loss of grey-white matter differentiation, hydrocephalus.\n\nEach danger sign has specific management implications: midline shift >5 mm may require surgical decompression; uncal herniation (transtentorial) indicates brainstem compression requiring emergent neurosurgical intervention; loss of grey-white differentiation indicates early ischemic stroke; hydrocephalus may require emergent CSF drainage (EVD)."
    difficulty: medium
    tags: [medical imaging, head CT, danger signs, midline shift, herniation, hydrocephalus]
  - front: "On head CT, what is the appearance of epidural hematoma versus subdural hematoma?"
    back: "Epidural hematoma: lentiform (lens-shaped/biconvex) hyperdensity in the epidural space. Subdural hematoma: crescent-shaped hyperdensity in the subdural space (can cross suture lines but not the falx or tentorium).\n\nEpidural hematoma (EDH) typically results from middle meningeal artery rupture (temporal bone fracture), is arterial and expands rapidly, and has a 'lucid interval.' Subdural hematoma (SDH) results from bridging vein rupture, often from deceleration injury, and can be acute (hyperdense), subacute (isodense), or chronic (hypodense) depending on timing."
    difficulty: medium
    tags: [medical imaging, head CT, epidural hematoma, subdural hematoma, lentiform, crescent]
  - front: "What is subarachnoid hemorrhage (SAH) on head CT, and what is the next step if CT is negative?"
    back: "SAH on CT: hyperdensity (bright white) filling the subarachnoid space, most prominent in the basal cisterns, sylvian fissures, and cortical sulci. If CT is negative but SAH is strongly suspected (thunderclap headache), lumbar puncture (LP) is performed to look for xanthochromia or elevated RBCs.\n\nCT detects SAH in ~98% within 6 hours but sensitivity decreases over time (falls to 85% at 24 hours). Xanthochromia (yellow discoloration of CSF from blood breakdown) persists for up to 2 weeks after SAH. CTA or MRA is used to identify the aneurysm source. The most common cause is a ruptured berry aneurysm at the circle of Willis."
    difficulty: hard
    tags: [medical imaging, subarachnoid hemorrhage, SAH, head CT, xanthochromia, lumbar puncture]
  - front: "What are the indications for MRI over CT in neuroradiology?"
    back: "MRI is preferred for: finer neuroanatomic definition, better grey-white matter differentiation (T1-weighted), better evaluation of edema extent (better tumour detection), evaluation of structures obscured by bony artifact on CT (posterior fossa), multiplanar imaging for preoperative assessment.\n\nCT has poor resolution in the posterior fossa due to beam-hardening artifacts from the surrounding temporal bone. MRI clearly visualizes the brainstem, cerebellum, cranial nerves, and foramen magnum — structures critical for stroke, tumour, or demyelinating disease evaluation in these regions."
    difficulty: medium
    tags: [medical imaging, MRI, neuroradiology, posterior fossa, grey-white matter, tumour]
  - front: "What are the indications for cerebral angiography (DSA), and what is its role compared to CTA/MRA?"
    back: "Indications: evaluation of vascular lesions (atherosclerotic disease, aneurysms, vascular malformations, arterial dissections). Conventional DSA remains the gold standard for assessment of neck and intracranial vessels but is invasive (femoral arterial access, catheter manipulation) with risk of vessel injury (dissection, occlusion, vasospasm, emboli). MRA and CTA are much less invasive and used first for suspected TIA, SAH, vasospasm, or aneurysms.\n\nDSA provides the highest spatial and temporal resolution for cerebrovascular disease and is required for interventional procedures (coil embolization of aneurysms, thrombectomy). CTA and MRA are used for non-invasive screening. DSA is reserved for cases where CTA/MRA are inconclusive or intervention is planned."
    difficulty: hard
    tags: [medical imaging, DSA, angiography, CTA, MRA, cerebrovascular, aneurysm]
  - front: "What are the two types of hydrocephalus on head CT, and how do they differ?"
    back: "Communicating (extraventricular) hydrocephalus: impaired CSF reabsorption with unobstructed flow in the ventricular system — all ventricles are dilated. Non-communicating (obstructive) hydrocephalus: obstruction within the ventricular system (e.g., mass obstructing the aqueduct of Sylvius or foramen of Monro) — only ventricles proximal to the obstruction are dilated.\n\nCommunicating hydrocephalus results from impaired arachnoid granulation reabsorption (e.g., post-SAH, meningitis, normal pressure hydrocephalus). Non-communicating hydrocephalus is caused by obstruction (e.g., aqueductal stenosis, posterior fossa tumour). Treatment includes EVD, VP shunt, or endoscopic third ventriculostomy depending on the cause."
    difficulty: hard
    tags: [medical imaging, hydrocephalus, CT, communicating, non-communicating, ventricular system]
  - front: "What is the nuclear medicine approach for brain imaging, including radionuclides used and indications?"
    back: "SPECT: uses 99mTc-exametazime (HMPAO) and 99mTc-bicisate (ECD) — assesses cerebral blood flow (diffuse rapidly across BBB and become trapped in neurons proportional to cerebral blood flow). 18FDG PET: assesses cerebral metabolic activity. Indications: differentiation of residual tumour vs. radiation necrosis, localization of epileptic seizure foci, evaluation of atypical dementia.\n\nPET/CT with 18FDG is particularly useful in dementia workup: Alzheimer's shows hypometabolism in posterior parietal-temporal regions; FTD shows frontal hypometabolism; DLB shows occipital hypometabolism. SPECT is used when PET is unavailable. Amyloid PET (florbetapir) can detect amyloid plaques for Alzheimer's diagnosis."
    difficulty: hard
    tags: [medical imaging, nuclear medicine, SPECT, PET, cerebral blood flow, dementia, epilepsy]
  - front: "What is the systematic approach to reading a head CT (mnemonic and steps)?"
    back: "Mnemonic: 'Brains Are Demonstrated Perfectly Via CT' — Bone/airspace, Arterial/Dura-subdural space, Parenchyma, Ventricles/sulci/cisterns. Steps: confirm scan parameters → skin/soft tissue → bone/airspace (calvarium, sinuses, mastoids) → dura/subdural space (crescent = SDH, lentiform = EDH) → parenchyma (asymmetry, grey-white differentiation) → ventricles/sulci/cisterns (hydrocephalus, blood, effacement).\n\nA systematic approach prevents tunnel vision from the most obvious finding. TIAs are NOT associated with radiological findings on CT — a normal CT in the context of transient focal neurological symptoms supports the TIA diagnosis. The 'insular ribbon sign' (hypodensity of insular cortex) is an early sign of MCA infarction on CT."
    difficulty: medium
    tags: [medical imaging, head CT, systematic approach, neuroradiology, TIA]
  - front: "What is the 'insular ribbon sign' on head CT, and what does it indicate?"
    back: "The insular ribbon sign is hypodensity of the insular cortex representing an early sign of infarction in the territory of the middle cerebral artery (MCA).\n\nEarly ischemic changes on CT can be subtle. The insular cortex is particularly sensitive to ischemia and is the most common location to show early hypodensity in MCA strokes. Other early CT signs of MCA infarction include loss of grey-white differentiation, hyperdense MCA sign (clot in MCA), and effacement of sulci. These findings within 4.5 hours do not exclude eligibility for thrombolysis."
    difficulty: hard
    tags: [medical imaging, head CT, insular ribbon sign, MCA infarction, stroke, ischemia]
  - front: "What is the modality of choice for diagnosing cholelithiasis, and what are its key diagnostic performance characteristics?"
    back: "U/S has the best sensitivity (unadjusted 0.97, 95% CI 0.95-0.99) and specificity (0.95, 95% CI 0.88-1.00) for cholelithiasis. For acute cholecystitis, radionuclide scanning (HIDA) has the best sensitivity and specificity.\n\nThis distinction is clinically important: U/S is used first for suspected gallstones, but when acute cholecystitis is suspected and U/S is equivocal, HIDA scan provides better diagnostic accuracy. The systematic review from the 1998 Arch Intern Med meta-analysis established these benchmarks used in Canadian practice guidelines."
    difficulty: medium
    tags: [medical imaging, ultrasound, cholelithiasis, HIDA scan, cholecystitis, sensitivity, specificity]
  - front: "When should CT vs. U/S be used as the first-line imaging for nephrolithiasis?"
    back: "According to landmark trial evidence, U/S as the initial imaging for suspected nephrolithiasis (performed by radiologist or point-of-care by clinician) does not differ significantly from CT for high-risk diagnoses with complications, serious adverse events, pain, return ED visits, or hospitalizations, but significantly reduces radiation exposure. U/S is a reasonable initial approach; CT provides higher diagnostic accuracy.\n\nThe NEJM 2014 trial (referenced in the landmark trials table) compared point-of-care U/S vs. radiology U/S vs. CT for nephrolithiasis. All groups had similar clinical outcomes at 30 days and 6 months. The mean cumulative radiation exposure was significantly lower in the U/S groups. This supports U/S as the initial modality to minimize radiation, especially in young patients."
    difficulty: hard
    tags: [medical imaging, nephrolithiasis, kidney stones, ultrasound, CT, radiation, evidence-based]
  - front: "What imaging modality is recommended for each of the following neurological presentations: cognitive decline, cord compression, decreased level of consciousness, stroke, MS, orbital infection, and sinusitis?"
    back: "Cognitive decline: CT. Cord compression: MRI. Decreased level of consciousness: CT. Stroke: CT (initial), MRI (ideal). Multiple sclerosis: MRI. Orbital infection: CT. Sinusitis: CT. Rule out bleed: CT. Rule out aneurysm: CTA or MRA. Seizure: CT. Trauma: CT. Weakness/systemically unwell: CT.\n\nThese modality preferences balance urgency, availability, radiation, and diagnostic accuracy. MRI is superior for cord compression (visualizes soft tissue, disc herniation, epidural abscess), MS (periventricular white matter lesions on FLAIR), and posterior fossa structures. CT is used first in emergencies due to speed."
    difficulty: medium
    tags: [medical imaging, neuroradiology, modality selection, MRI, CT, clinical indication]
  - front: "What are the indications for myelography, and what has largely replaced it?"
    back: "Myelography: water-soluble, low-osmotic contrast injected into the subarachnoid space via lumbar puncture followed by x-ray. Indications: disc herniation, traumatic nerve root avulsion, patients with MRI contraindications, or extensive spinal hardware creating MRI artifacts. Largely replaced by MRI or CT myelogram.\n\nMRI is the preferred modality for most spinal pathology due to superior soft tissue visualization without radiation or invasive contrast injection. CT myelogram is used when MRI is contraindicated (pacemaker, cochlear implants, metal hardware) or when MRI quality is degraded by metallic artifact from spinal instrumentation."
    difficulty: medium
    tags: [medical imaging, myelography, spine, disc herniation, nerve root avulsion, MRI]
  - front: "What is pneumatosis intestinalis, and how do its two subtypes differ?"
    back: "Pneumatosis intestinalis: intramural air seen as lucent air streaks in the bowel wall. Two types: 1. Linear — indicates ischemia or necrotizing enterocolitis (NEC); 2. Rounded/cystoides — generally benign; primary (idiopathic) or secondary to COPD.\n\nLinear pneumatosis represents gas produced by bowel ischemia (ischemic bowel bacteria ferment carbohydrates) and is a sign of serious bowel pathology requiring urgent evaluation. Cystoid pneumatosis is characterized by multiple gas-filled submucosal cysts and is usually an incidental finding in benign conditions."
    difficulty: hard
    tags: [medical imaging, AXR, pneumatosis intestinalis, bowel ischemia, NEC]
  - front: "What is the 'football sign' on an abdominal X-ray?"
    back: "The 'football sign' is the appearance of the peritoneal cavity outlined by intraperitoneal free air on a supine AXR, creating an oval (football) shape over the abdomen — indicating large pneumoperitoneum.\n\nThe football sign is seen when there is a large amount of free intraperitoneal air. The air collects anteriorly in the supine patient, outlining the peritoneal cavity in a football-shaped lucency. It is most commonly seen in neonates with necrotizing enterocolitis and bowel perforation."
    difficulty: medium
    tags: [medical imaging, AXR, football sign, pneumoperitoneum, free air]
  - front: "What is the 'string of pearls' sign on AXR, and what does it indicate?"
    back: "The 'string of pearls' sign is a row of small gas accumulations in the dilated valvulae conniventes of obstructed small bowel on an upright or decubitus AXR. It indicates mechanical small bowel obstruction with dynamic (active peristalsis present) obstruction.\n\nThe string of pearls appearance occurs when small pockets of gas are trapped between the fluid-filled haustra/valvulae conniventes in an obstructed small bowel. The presence of this sign implies the bowel is still viable with active peristalsis, distinguishing it from adynamic ileus where gas is distributed evenly."
    difficulty: medium
    tags: [medical imaging, AXR, string of pearls, small bowel obstruction, mechanical obstruction]
