  - front: "Why is metformin considered first-line therapy for overweight T2DM per UKPDS 34?"
    back: "Reduces diabetes-related endpoints with less weight gain and hypoglycemia than sulfonylureas/insulin\n\nMetformin decreases risk of diabetes-related endpoints in overweight patients with less weight gain and fewer hypoglycemic episodes compared to sulfonylureas or insulin."
    difficulty: medium
    tags: [endocrinology, diabetes, T2DM, clinical-trials, UKPDS, metformin, treatment, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Which insulin regimen had the highest withdrawal rate in the 4T Trial?"
    back: "Prandial insulin (11.7%)\n\nThere was a significant difference in withdrawal rates: 5.1% biphasic, 11.7% prandial, and 8.5% basal regimens (P=0.04)."
