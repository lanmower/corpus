# Pediatrics Infectious Disease (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "How is fever defined in pediatric practice?"
    back: "A practical definition is >38°C (100.4°F) oral or rectal.\n\nFever without a source is an acute febrile illness <10 days with no identifiable cause. Fever of unknown origin (FUO) is daily or intermittent fevers for ≥2 consecutive weeks of uncertain cause after history, physical, and initial labs."
    difficulty: easy
    tags: [fever, pediatrics, definition]
  - front: "According to the Rochester Criteria, which age group of febrile neonates should always be considered high-risk for serious bacterial infection (SBI)?"
    back: "Neonates aged 1-28 days — febrile neonates in this group should be considered high-risk regardless of clinical features and laboratory findings.\n\nThe Rochester Criteria are less sensitive in the 1-28 day age group. Therefore, all febrile neonates in this age range require full septic workup and empiric antibiotics. The younger the child, the greater the difficulty in clinically assessing degree of illness."
    difficulty: easy
    tags: [Rochester criteria, febrile neonate, SBI, neonatal fever]
  - front: "What are the three criteria required to diagnose Acute Otitis Media (AOM)?"
    back: "1. Middle ear effusion; 2. Middle ear inflammation; 3. Acute onset of symptoms of middle ear effusion and inflammation.\n\nAccurate diagnosis of AOM is very important to prevent antibiotic overuse. The most important diagnostic sign is a bulging tympanic membrane. Peak incidence is at 6-24 months."
    difficulty: easy
    tags: [acute otitis media, AOM, diagnosis criteria]
  - front: "What is the most common bacterial cause of AOM and what has reduced its incidence?"
    back: "Streptococcus pneumoniae — its incidence has been decreasing since the introduction of PCV7 and PCV13 vaccines. Other common causes: H. influenzae, M. catarrhalis, and GAS.\n\nAOM commonly develops within a week after a viral URI. Less common bacterial causes include anaerobes (in newborns) and gram-negative enterics (in infants). Viral causes (RSV, coronaviruses, influenza) are more likely to spontaneously resolve."
    difficulty: easy
    tags: [AOM, S. pneumoniae, PCV13, bacterial etiology]
  - front: "What is the first-line antibiotic treatment for AOM in children, and what is the dose?"
    back: "High-dose amoxicillin 75-90 mg/kg/day dosed BID × 5 days (10 days if age <2 years, perforated TM, or recurrent AOM). If penicillin allergic: cefuroxime-axetil or ceftriaxone.\n\nAntibiotic therapy is indicated if age <6 months or moderate-severe illness. Second-line options (if unresponsive after 48h): amoxicillin-clavulanic acid, cefuroxime axetil, ceftriaxone, cefaclor, or cefixime."
    difficulty: easy
    tags: [AOM, amoxicillin, antibiotic treatment, otitis media]
  - front: "When is watchful waiting (observation without antibiotics) appropriate in AOM management?"
    back: "Watchful waiting for 24-48 hours is appropriate for children ≥6 months who are mildly ill (alert, responding to antipyretics, mild otalgia, fever <39°C without antipyretics, <48 hours of symptoms) with reliable follow-up.\n\nAfter discussing with caregivers, observation with analgesia is appropriate for mild illness. If not clinically improved or worsening, treat with antimicrobials (10 days if 6 months to 2 years; 5 days if ≥2 years)."
    difficulty: medium
    tags: [AOM, watchful waiting, antibiotic stewardship]
  - front: "What are the intracranial complications of AOM?"
    back: "Meningitis, epidural and brain abscess, subdural empyema, lateral and cavernous sinus thrombosis, carotid artery thrombosis.\n\nExtracranial complications include hearing loss/speech delay, mastoiditis, petrositis, labyrinthitis, cholesteatoma, facial nerve palsy, middle ear atelectasis, ossicular necrosis, and vestibular dysfunction."
    difficulty: medium
    tags: [AOM, complications, meningitis, mastoiditis]
  - front: "What are the otoscopic findings of Otitis Media with Effusion?"
    back: "Discolouration (amber or dull grey), meniscus fluid level behind TM, air bubbles, retraction pockets/TM atelectasis, flat tympanogram, immobility on pneumatic otoscopy (most reliable finding).\n\nOME presents with fluctuating conductive hearing loss, tinnitus, and ear fullness. Unlike AOM, there is no bulging TM and no acute inflammation. The most reliable diagnostic finding is TM immobility with pneumatic otoscopy."
    difficulty: easy
    tags: [OME, otoscopy, tympanogram, pneumatic otoscopy]
  - front: "What is Erythema Infectiosum (Fifth Disease) and what is its characteristic rash?"
    back: "Caused by Parvovirus B19. Rash appears 10-17 days after initial symptoms (immune response phase). Classic 'slapped cheek' appearance — bilateral erythematous maculopapular lacy rash on cheeks with circumoral sparing; may affect trunk and extremities.\n\nInitial 7-10 days of flu-like illness and fever precede the rash. The rash may reappear months later with sunlight or exercise. Serious complication: transient aplastic crisis (especially in chronic hemolytic anemia). Management is supportive."
    difficulty: easy
    tags: [erythema infectiosum, fifth disease, parvovirus B19, slapped cheek]
  - front: "What is the causative organism of Roseola and what is the classic presentation sequence?"
    back: "Human herpesvirus 6 (HHV-6). Classic sequence: high-grade fever 3-5 days → fever breaks → blanching pink maculopapular rash appears (starts at neck and trunk, spreads to face and extremities).\n\nCommon associated features: irritability, anorexia, lymphadenopathy, erythematous TM and pharynx, Nagayama spots (erythematous papules on soft palate and uvula). Major complication: febrile seizures in 10-25% of cases."
    difficulty: easy
    tags: [roseola, HHV-6, febrile seizures, exanthem subitum]
  - front: "What are the 'Three C's' prodrome of measles, and what is the enanthem?"
    back: "Prodrome: Cough, Coryza, Conjunctivitis (Three C's). Enanthem: Koplik's spots (appear 1-2 days before the rash).\n\nMeasles rash is erythematous maculopapular, begins at the hairline and spreads downwards, sparing palms and soles. Caused by Morbillivirus. Management: supportive (vitamin A evidence). Complications include secondary bacterial infections (AOM, sinusitis, pneumonia), encephalitis, and rarely subacute sclerosing panencephalitis."
    difficulty: easy
    tags: [measles, Koplik spots, Morbillivirus, Three Cs]
  - front: "What is the distinguishing feature of Hand, Foot, and Mouth Disease (HFMD) rash and enanthem location?"
    back: "Rash: vesicles and pustules on erythematous base on mouth, buttocks, acral areas. Enanthem: vesicles in the POSTERIOR oral cavity (pharynx, tongue). Caused by Coxsackie group A virus.\n\nContrast with Herpes simplex, which causes vesicles/erosions in the ANTERIOR oral cavity (buccal mucosa, tongue). HFMD is communicable for 17 days after symptoms and resolves within 1 week. Main complication is dehydration."
    difficulty: medium
    tags: [HFMD, hand foot mouth disease, Coxsackie, exanthem]
  - front: "How does the rash distribution of measles differ from rubella?"
    back: "Measles: starts at hairline and spreads downwards, spares palms and soles. Rubella: starts on face and spreads to neck and trunk (not full body). Both are maculopapular.\n\nRubella prodrome includes low-grade fever and occipital/retroauricular lymphadenopathy (STAR complex: sore throat, arthritis, rash). Rubella has major implications for pregnant contacts due to congenital rubella syndrome. Prevention: MMR vaccine."
    difficulty: medium
    tags: [measles, rubella, rash distribution, exanthem]
  - front: "What is the contagious period for varicella (chickenpox)?"
    back: "1-2 days pre-eruption and 5 days post-eruption. Transmitted by direct contact, inhalation of lesion aerosols, and aerosolized respiratory secretions.\n\nVaricella rash is polymorphic: starts as macules → papules → vesicles → crusts (all stages present simultaneously). Management: supportive, AVOID salicylates (Reye syndrome risk), consider antivirals. Complications include bacterial superinfection, encephalitis, cerebellar ataxia, and hepatitis."
    difficulty: easy
    tags: [varicella, chickenpox, communicability, Reye syndrome]
  - front: "What is the classic triad of Infectious Mononucleosis (EBV)?"
    back: "Fever, generalized non-tender lymphadenopathy, and pharyngitis/tonsillitis (exudative).\n\nEBV ('kissing disease') is transmitted mainly through infected saliva with incubation period of 1-2 months. Associated findings include hepatosplenomegaly, periorbital edema, and rash (especially after inappropriate β-lactam antibiotics). Peak incidence is 15-19 years."
    difficulty: easy
    tags: [infectious mononucleosis, EBV, classic triad]
  - front: "What is the sensitivity of the Monospot (heterophile antibody) test for EBV mononucleosis by age group?"
    back: "85% sensitive in adults and older children; only 50% sensitive if age <4 years.\n\nFalse positives occur with HIV, SLE, lymphoma, rubella, and parvovirus. If Monospot is negative but clinical suspicion remains high, obtain EBV-specific titres (VCA IgM, EA, EBNA). CBC shows reactive lymphocytes, lymphocytosis, and Downey cells."
    difficulty: easy
    tags: [infectious mononucleosis, Monospot, heterophile antibody, EBV diagnosis]
  - front: "What activity restriction is required in all patients with infectious mononucleosis, and for how long?"
    back: "All patients must avoid contact sports for 6-8 weeks due to risk of splenic rupture (splenic enlargement is often not clinically apparent).\n\nSplenic rupture is a serious short-term complication of EBV mononucleosis. Management is otherwise supportive: rest, hydration, saline gargles, and analgesics. If airway obstruction is present, admit and consider steroids."
    difficulty: easy
    tags: [infectious mononucleosis, splenic rupture, sports restriction, EBV]
  - front: "What is the main cause of pharyngitis in children, and what percentage is bacterial?"
    back: "Viral causes account for ~80% (adenoviruses, enteroviruses, EBV, CMV, COVID-19). Bacterial causes account for ~20%, mainly Group A Streptococcus (GAS).\n\nGAS pharyngitis peaks at 5-12 years and is uncommon under 3 years. It is more common in late winter/early spring. Viral pharyngitis affects all ages year-round."
    difficulty: easy
    tags: [pharyngitis, GAS, streptococcal pharyngitis, pediatric]
  - front: "What clinical features distinguish GAS pharyngitis from viral pharyngitis?"
    back: "GAS: severe sore throat, fever, malaise, headache, abdominal pain, N/V, absence of other URTI symptoms, pharyngeal/tonsillar exudates, enlarged tender anterior cervical nodes, palatal petechiae, strawberry tongue, scarlatiniform rash. Viral: mild sore throat, conjunctivitis, cough, rhinorrhea, hoarseness, diarrhea.\n\nThe modified Centor (m-CENTOR) score is used to predict likelihood of positive throat culture but is not sensitive or specific enough alone for diagnosis in children. A rapid antigen test followed by throat culture if negative is recommended."
    difficulty: easy
    tags: [GAS pharyngitis, streptococcal pharyngitis, clinical features, differential diagnosis]
  - front: "What antibiotic treatment is used for GAS pharyngitis and within what timeframe does it prevent rheumatic fever?"
    back: "Penicillin V or amoxicillin (or erythromycin if penicillin allergic) × 10 days. Antibiotics can prevent rheumatic fever if given within 9 days of symptom onset. They do NOT alter risk of post-streptococcal glomerulonephritis.\n\nNo follow-up throat cultures are needed after uncomplicated GAS pharyngitis. Tonsillectomy may be considered for severe, recurrent streptococcal tonsillitis."
    difficulty: easy
    tags: [GAS pharyngitis, amoxicillin, rheumatic fever prevention, antibiotic]
  - front: "What are the immune-mediated complications of GAS pharyngitis?"
    back: "Scarlet fever, acute rheumatic fever, post-streptococcal glomerulonephritis (GN), reactive arthritis, and PANDAS (Pediatric Autoimmune Neuropsychiatric Disorders Associated with GAS).\n\nNon-immune complications (preventable with antibiotics): AOM, sinusitis, cervical adenitis, mastoiditis, retropharyngeal/peritonsillar abscess, and sepsis. Post-streptococcal GN risk is not altered by antibiotic treatment."
    difficulty: medium
    tags: [GAS pharyngitis, rheumatic fever, PANDAS, post-streptococcal GN, complications]
  - front: "Describe the rash sequence and distribution of Scarlet Fever."
    back: "Rash begins in groin, axillae, neck, antecubital fossa (24-48h after pharyngitis) → within 24h, generalized sandpaper-like rash with perioral sparing and Pastia's lines in flexural areas → non-pruritic, non-painful, blanchable → fades after 3-4 days, followed by desquamation.\n\nScarlet fever is a delayed-type hypersensitivity reaction to pyrogenic exotoxin of GAS. It requires prior exposure to S. pyogenes. Features include acute fever, sore throat, and strawberry tongue. Treatment: penicillin, amoxicillin, or erythromycin × 10 days."
    difficulty: easy
    tags: [scarlet fever, GAS, rash, Pastias lines, strawberry tongue]
  - front: "What is Gianotti-Crosti Syndrome and which pathogens cause it?"
    back: "A symmetric papular rash on the face, cheeks, and extensor surfaces of extremities, sparing the trunk. Caused by EBV and Hepatitis B virus (majority). Management is supportive; resolves in 3-12 weeks.\n\nAlso called Papular Acrodermatitis. It may be asymptomatic or pruritic. Associated features include viral prodrome, lymphadenopathy, and/or hepatosplenomegaly. Pain control if needed."
    difficulty: medium
    tags: [Gianotti-Crosti syndrome, papular acrodermatitis, EBV, Hepatitis B, exanthem]
  - front: "Why must salicylates be avoided in children with varicella?"
    back: "Risk of Reye syndrome — a rare but serious condition of acute liver failure and encephalopathy associated with salicylate use during viral illnesses (particularly varicella and influenza).\n\nReye syndrome presents with sudden onset vomiting, confusion, and liver dysfunction. It carries significant morbidity and mortality. Acetaminophen and ibuprofen are safe alternatives for fever and pain management in varicella."
    difficulty: easy
    tags: [varicella, Reye syndrome, salicylates, aspirin]
  - front: "What distinguishes the rash timing in Roseola from other febrile exanthems?"
    back: "In Roseola, the rash appears AFTER the fever subsides (defervescence). This is opposite to most other exanthems where rash appears during the febrile phase.\n\nThe pattern: high-grade fever for 3-5 days → sudden defervescence → blanching pink maculopapular rash appears starting at the neck and trunk. Febrile seizures can occur in 10-25% during the febrile phase. Caused by HHV-6."
    difficulty: easy
    tags: [roseola, exanthem subitum, febrile exanthem, HHV-6]
  - front: "What are the risk factors for recurrent AOM and which populations in Canada are at particularly high genetic risk?"
    back: "Risk factors include Eustachian tube dysfunction, cleft palate, genetic syndromes (DS, Crouzon, Apert), Kartagener's syndrome, CF, pacifier use, no breastfeeding, second-hand smoke, daycare attendance, crowded living conditions. Canadians at genetic risk: First Nations peoples and Inuit.\n\nPersistent biofilm in the middle ear and low secretory IgA levels are additional risk factors. Prevention includes pneumococcal and influenza vaccines, addressing modifiable risk factors, and tympanostomy tubes for recurrent AOM."
    difficulty: medium
    tags: [AOM, risk factors, First Nations, Eustachian tube, recurrent otitis media]
  - front: "What is the pathogenesis of Acute Otitis Media?"
    back: "Obstruction of Eustachian tube → air absorbed in middle ear → negative pressure → edema of mucosa with exudate/effusion of nasopharyngeal secretions → bacterial infection.\n\nThe negative pressure in the middle ear is an irritant to the mucosa, leading to mucosal edema. This creates conditions for colonization by nasopharyngeal bacteria (S. pneumoniae, H. influenzae, M. catarrhalis)."
    difficulty: easy
    tags: [AOM, pathogenesis, Eustachian tube, otitis media]
  - front: "What is the treatment for a perforated tympanic membrane in AOM?"
    back: "Always treat with antimicrobial therapy — most commonly topical combined ciprofloxacin-dexamethasone (Ciprodex) — and examine for complications.\n\nA perforated TM with purulent drainage indicates bacterial AOM and should always be treated with antimicrobials for 10 days. Topical Ciprodex is the preferred therapy for perforated TM with otorrhea."
    difficulty: easy
    tags: [AOM, perforated tympanic membrane, Ciprodex, ciprofloxacin]
  - front: "What is the management of OME (Otitis Media with Effusion) and what treatments have NO role?"
    back: "Expectant management for low-risk children. ENT referral for unilateral OME >6 months or bilateral OME >3 months with hearing loss. Surgery: myringotomy + tympanostomy tubes ± adenoidectomy. NO role for: antibiotics, glucocorticoids, antihistamines, or decongestants.\n\n90% of OME resolves by 3 months. Early ENT referral for craniofacial abnormalities or immunodeficiency. Complications if untreated: hearing loss, speech delay, learning problems, chronic mastoiditis, ossicular erosion, cholesteatoma."
    difficulty: easy
    tags: [OME, tympanostomy tubes, myringotomy, antibiotic stewardship]
