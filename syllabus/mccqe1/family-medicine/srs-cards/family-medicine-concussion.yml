# Family Medicine Concussion (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What assessment tools are used for concussion, and which tool is used for whom and when?"
    back: "SCAT6 (Sport Concussion Assessment Tool, 6th edition): for individuals >13 years, used within first 3 days post-injury (acute assessment, e.g., sidelines). SCOAT6 (Sport Concussion Office Assessment Tool-6): for individuals >13 years and >3 days post-injury (clinical evaluation and management). Child SCAT6: for individuals <13 years (acute concussion assessment).\n\nParachute Canada provides national concussion guidelines including return-to-play/return-to-sports protocols. The distinction between sideline assessment tools (SCAT6) and office tools (SCOAT6) is important for practical application. Mild TBI/concussion management follows a graduated return-to-activity protocol."
    difficulty: easy
    tags: [concussion, SCAT6, SCOAT6, traumatic brain injury, family medicine]
