  - front: "How is Barrett's esophagus diagnosed?"
    back: "Endoscopy shows salmon pink mucosa in distal esophagus; diagnosis confirmed by biopsy showing specialized intestinal epithelium\n\nEndoscopic appearance alone is insufficient - biopsy demonstrating intestinal metaplasia is required for definitive diagnosis."
    difficulty: medium
