# Gr 9 Maths CAPS — numbers / Ratio Rate Proportion
deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
notes:
  - guid: 3f8a1c0d7b4e2916
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "What is a ratio, and what does the ratio 3:5 mean?"
      Back: "A ratio compares two or more quantities OF THE SAME KIND, showing how much of one there is compared to another.\n3:5 means: for every 3 parts of the first quantity there are 5 parts of the second.\nKey points:\n• Order matters: 3:5 ≠ 5:3.\n• A ratio has NO units (the units cancel) — it is a pure comparison.\n• Total parts here = 3 + 5 = 8.\nExample: 3 boys : 5 girls means out of every 8 learners, 3 are boys and 5 are girls."
    tags: ["ratio-meaning", "subject:numbers"]
  - guid: a1b9e4f602c7d35a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "How do you simplify the ratio 18:24 to simplest form?"
      Back: "Divide every part by the HCF (highest common factor) of the numbers.\nStep 1: Find HCF of 18 and 24.\n  18 = 2 × 3 × 3,  24 = 2 × 2 × 2 × 3 → HCF = 2 × 3 = 6.\nStep 2: Divide each part by 6.\n  18 ÷ 6 = 3,  24 ÷ 6 = 4.\n∴ 18:24 = 3:4 (simplest form).\nCheck: 3 and 4 share no common factor except 1. ✓"
    tags: ["simplify-ratio", "subject:numbers"]
  - guid: 7c2d5a8f1e3b9046
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Simplify a ratio that contains fractions or decimals: simplify ½ : ¾"
      Back: "First clear fractions by multiplying every part by the LCD, then simplify.\n½ : ¾  — LCD of 2 and 4 is 4.\nMultiply each part by 4:\n  ½ × 4 = 2,  ¾ × 4 = 3.\n∴ ½ : ¾ = 2:3.\nFor decimals, multiply by 10, 100, … to clear them: e.g. 0.4 : 0.6 → ×10 → 4:6 → 2:3.\nA ratio in simplest form should use whole numbers with HCF 1."
    tags: ["simplify-ratio", "subject:numbers"]
  - guid: e9041b6c8a2f7d53
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "What are equivalent ratios? Give equivalent ratios of 2:3."
      Back: "Equivalent ratios represent the SAME relationship — you get them by multiplying OR dividing every part by the same non-zero number.\n2:3 → multiply each part:\n  ×2 → 4:6\n  ×3 → 6:9\n  ×5 → 10:15\nAll of 2:3, 4:6, 6:9, 10:15 are equivalent.\nUse: to find a missing value, e.g. 2:3 = 10:?  →  2 × 5 = 10, so ? = 3 × 5 = 15."
    tags: ["equivalent-ratios", "subject:numbers"]
  - guid: 5b8f3e1a7d62c490
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Why must you convert to the same unit BEFORE writing a ratio? Write 50 cm to 2 m as a ratio."
      Back: "A ratio compares like quantities, so both must be in the SAME unit first — otherwise the comparison is wrong.\nCommon mistake: writing 50:2 — WRONG (cm vs m).\nStep 1: Convert. 2 m = 200 cm (since 1 m = 100 cm).\nStep 2: Write ratio in same unit: 50 cm : 200 cm = 50:200.\nStep 3: Simplify (÷50): 1:4.\n∴ 50 cm : 2 m = 1:4."
    tags: ["ratio-units", "subject:numbers"]
  - guid: c4a7026d9b1e8f35
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Convert and simplify: write 45 minutes to 1½ hours as a ratio."
      Back: "Convert to the same unit (minutes) first.\nStep 1: 1½ hours = 1.5 × 60 = 90 minutes.\nStep 2: Ratio = 45 min : 90 min = 45:90.\nStep 3: Simplify (HCF = 45): 45 ÷ 45 : 90 ÷ 45 = 1:2.\n∴ 45 min : 1½ h = 1:2.\nWarning: never mix minutes with hours in the ratio."
    tags: ["ratio-units", "subject:numbers"]
  - guid: 9d6320f8a4c5e1b7
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "What is a three-part ratio? Simplify 12:18:30."
      Back: "A three-part ratio compares three quantities at once, e.g. a:b:c.\nSimplify by dividing ALL parts by their common HCF.\n12:18:30 — HCF of 12, 18, 30 = 6.\n  12 ÷ 6 = 2,  18 ÷ 6 = 3,  30 ÷ 6 = 5.\n∴ 12:18:30 = 2:3:5.\nTotal parts = 2 + 3 + 5 = 10 (useful for sharing problems)."
    tags: ["three-part-ratio", "subject:numbers"]
  - guid: 2e5c8a0f6b3d7194
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Method: how do you share/divide an amount in a given ratio?"
      Back: "Steps to share an amount in a ratio:\n1. Add the ratio parts to get the TOTAL number of parts.\n2. Find the value of ONE part: amount ÷ total parts.\n3. Multiply the value of one part by each share's number of parts.\n4. Check: the shares must add back to the original amount.\nThis works for any number of parts (2-part, 3-part, …)."
    tags: ["sharing-in-ratio", "subject:numbers"]
  - guid: 8a1f4d7b209ce635
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Worked: Share R240 between two people in the ratio 3:5."
      Back: "Step 1: Total parts = 3 + 5 = 8.\nStep 2: Value of one part = R240 ÷ 8 = R30.\nStep 3: Multiply out each share:\n  First person: 3 × R30 = R90.\n  Second person: 5 × R30 = R150.\nStep 4: Check: R90 + R150 = R240 ✓.\n∴ The shares are R90 and R150."
    tags: ["sharing-in-ratio", "subject:numbers"]
  - guid: f3760b9c2a8e514d
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Worked: Share R600 among A, B and C in the ratio 1:2:3."
      Back: "Step 1: Total parts = 1 + 2 + 3 = 6.\nStep 2: One part = R600 ÷ 6 = R100.\nStep 3: \n  A: 1 × R100 = R100\n  B: 2 × R100 = R200\n  C: 3 × R100 = R300\nStep 4: Check: R100 + R200 + R300 = R600 ✓.\n∴ A gets R100, B gets R200, C gets R300."
    tags: ["sharing-in-ratio", "subject:numbers"]
  - guid: 4c9e1a6d8b07f253
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "What is a RATE, and how does it differ from a ratio?"
      Back: "A rate compares two quantities of DIFFERENT kinds (different units), e.g. km per hour, R per kg, words per minute.\n• A ratio compares the SAME kind of quantity and has no units.\n• A rate has units, written with 'per' or '/'.\nExamples: 80 km/h (distance per time), R25/kg (cost per mass), 60 beats/min.\nA UNIT rate is the amount per ONE unit of the other quantity."
    tags: ["rate-meaning", "subject:numbers"]
  - guid: b6d0294f7a3c8e51
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "How do you find a unit rate? A car travels 240 km in 3 hours — find its rate in km/h."
      Back: "A unit rate is the amount per ONE unit — divide so the second quantity becomes 1.\nUnit rate = quantity ÷ (number of units of the other quantity).\nHere: rate = 240 km ÷ 3 h = 80 km/h.\nThis means the car covers 80 km in each 1 hour.\nGeneral: divide the top quantity by the bottom quantity to get 'per one'."
    tags: ["unit-rate", "subject:numbers"]
  - guid: 1a8c3f5e0d7b9264
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Best buy: 500 g costs R30, or 800 g costs R44. Which is the better value?"
      Back: "Find the UNIT PRICE (cost per gram, or per same unit) for each, then compare — lowest unit price wins.\nOption A: R30 ÷ 500 g = R0,06 per g.\nOption B: R44 ÷ 800 g = R0,055 per g.\nCompare: R0,055 < R0,06.\n∴ The 800 g pack (R44) is the better buy because it costs less per gram.\nTip: always divide cost by quantity to compare fairly."
    tags: ["best-buy", "subject:numbers"]
  - guid: d2f5081b6a9c4e73
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "State the speed–distance–time formula and its rearrangements."
      Back: "Speed = distance ÷ time.\nThe triangle gives the three forms:\n• speed = distance / time\n• distance = speed × time\n• time = distance / speed\nUnits must match: km with h gives km/h; m with s gives m/s.\nKeep units consistent throughout the problem."
    tags: ["speed", "subject:numbers"]
  - guid: 60b3e9a1c4d78f52
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Worked: A cyclist rides 45 km in 1 hour 30 minutes. Find the average speed in km/h."
      Back: "Step 1: Convert time to hours. 1 h 30 min = 1,5 h.\nStep 2: speed = distance ÷ time = 45 km ÷ 1,5 h = 30 km/h.\n∴ Average speed = 30 km/h.\nCommon mistake: dividing by 1.30 instead of 1.5 — convert minutes to a fraction of an hour (30 min = 0,5 h)."
    tags: ["speed", "subject:numbers"]
  - guid: 9f4a7c2e5b1d8036
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Worked: A car travels at 90 km/h for 2½ hours. How far does it go?"
      Back: "Use distance = speed × time.\nStep 1: time = 2½ h = 2,5 h.\nStep 2: distance = 90 km/h × 2,5 h = 225 km.\n∴ The car travels 225 km.\nNote how the hours cancel: km/h × h = km."
    tags: ["speed", "subject:numbers"]
  - guid: 3c0d6f9a8e2b7145
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "What is DIRECT proportion? Give the rule and an everyday example."
      Back: "In direct proportion, as one quantity increases, the other increases in the SAME ratio (and if one halves, the other halves).\nThe RATIO between them stays constant: y/x = constant (k), so y = kx.\nExample: more litres of petrol → proportionally more cost.\n1 litre costs R22, so 5 litres cost 5 × R22 = R110.\nThe cost per litre (the constant) never changes."
    tags: ["direct-proportion", "subject:numbers"]
  - guid: a7e2950c4f1b8d63
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Worked direct proportion: 4 pens cost R20. How much do 7 pens cost?"
      Back: "Direct proportion — find the value of ONE, then scale up (the unitary method).\nStep 1: 1 pen costs R20 ÷ 4 = R5.\nStep 2: 7 pens cost 7 × R5 = R35.\n∴ 7 pens cost R35.\nCheck with ratios: 4:20 = 7:35 (both give R5 per pen). ✓"
    tags: ["direct-proportion", "subject:numbers"]
  - guid: 5e8b1d4a09c76f32
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "What is INVERSE (indirect) proportion? Give the rule and an example."
      Back: "In inverse proportion, as one quantity increases, the other DECREASES so that their PRODUCT stays constant.\nRule: x × y = constant (k), so y = k/x.\nExample: more workers → the job takes less time.\nIf 4 workers take 6 days, then 4 × 6 = 24 worker-days is the constant for the whole job.\nMore workers means proportionally fewer days."
    tags: ["inverse-proportion", "subject:numbers"]
  - guid: 2d7f0a3c9b6e5184
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Worked inverse proportion: 6 workers build a wall in 8 days. How long would 4 workers take?"
      Back: "Inverse proportion — the PRODUCT (workers × days) is constant.\nStep 1: Find the constant: 6 × 8 = 48 worker-days (the total work).\nStep 2: Divide by the new number of workers: 48 ÷ 4 = 12 days.\n∴ 4 workers take 12 days.\nSense check: fewer workers → MORE time. ✓\nMistake to avoid: do NOT just scale directly (4/6 × 8) — that is the wrong direction."
    tags: ["inverse-proportion", "subject:numbers"]
  - guid: 8c3a5e7f1b0d9426
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Worked inverse proportion: A tank fills in 20 min using 3 taps. How long with 5 taps?"
      Back: "Inverse: more taps → less time, with product constant.\nStep 1: Constant = 3 × 20 = 60 (tap-minutes).\nStep 2: New time = 60 ÷ 5 = 12 minutes.\n∴ 5 taps fill the tank in 12 min.\nCheck: 5 × 12 = 60 = 3 × 20 ✓ (same total)."
    tags: ["inverse-proportion", "subject:numbers"]
  - guid: 7b4d2f8a6c0e9153
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "How do you DECIDE whether a problem is direct or inverse proportion?"
      Back: "Ask: when one quantity goes UP, what happens to the other?\n• Both go UP together (or down together) → DIRECT proportion. Ratio y/x is constant; use the unitary method (find one, multiply).\n• One goes UP while the other goes DOWN → INVERSE proportion. Product x×y is constant; find the constant, then divide.\nClues for inverse: more workers/taps/machines → less time; faster speed → less time.\nClues for direct: more items → more cost; more hours → more pay."
    tags: ["direct-vs-inverse", "subject:numbers"]
  - guid: 1f6c9a0d3e8b7542
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Ratio Rate Proportion"
    fields:
      Front: "Worked direct proportion (scaling a recipe): A recipe for 6 people needs 450 g flour. How much for 10 people?"
      Back: "Direct proportion — use the unitary method.\nStep 1: Flour for 1 person = 450 g ÷ 6 = 75 g.\nStep 2: Flour for 10 people = 10 × 75 g = 750 g.\n∴ You need 750 g of flour.\nMore people → more flour, so it is direct. ✓"
    tags: ["direct-proportion", "subject:numbers"]
