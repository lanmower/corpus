# Nephrology Hypertension (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What is hypertensive nephrosclerosis and how does chronic differ from malignant hypertensive nephrosclerosis?"
    back: "Chronic nephrosclerosis: slow vascular sclerosis with ischemic changes of intralobular and afferent arterioles; associated with Black race (ApoL1-mediated), underlying CKD; mild to severe proteinuria, normal urine sediment; target BP <120/80; can progress to renal failure if HTN poorly controlled. Malignant nephrosclerosis: fibrinoid necrosis of arterioles, disruption of vascular endothelium; acute BP elevation (dBP >120 mmHg), HTN encephalopathy, acute end-organ damage; proteinuria and hematuria with RBC casts; lower dBP to 100-110 mmHg within 6-24h.\n\nMalignant HTN causes end-organ damage (papilledema, stroke, ACS, AKI) and requires urgent but controlled BP reduction. Lowering dBP too aggressively can cause ischemic events (autoregulation is reset at a higher BP). ApoL1 gene variants explain the higher prevalence of hypertensive nephrosclerosis in Black patients."
    difficulty: hard
    tags: [nephrology, hypertensive nephrosclerosis, malignant hypertension, ApoL1, fibrinoid necrosis]
  - front: "In the management of malignant hypertension, what is the target blood pressure reduction in the first 6-24 hours and why is more aggressive treatment dangerous?"
    back: "Lower diastolic BP to 100-110 mmHg within 6-24 hours. More aggressive treatment can cause ischemic events because cerebral autoregulation is reset at a higher BP in chronic hypertensive patients — sudden normalization causes cerebral hypoperfusion.\n\nMalignant hypertension (dBP >120 mmHg) requires urgent but controlled BP reduction using IV agents (labetalol, nicardipine, sodium nitroprusside). The 25% rule: reduce MAP by no more than 25% in the first hour, then target 100-110 mmHg dBP over next 6-24h. Chronic hypertensives have a rightward shift of the cerebral autoregulation curve, making them vulnerable to ischemia at 'normal' BPs."
    difficulty: hard
    tags: [nephrology, malignant hypertension, blood pressure, autoregulation, treatment, hypertensive emergency]
