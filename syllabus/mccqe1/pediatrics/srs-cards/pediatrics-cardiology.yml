# Pediatrics Cardiology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the key ECG features that distinguish supraventricular tachycardia (SVT) from sinus tachycardia in a child?"
    back: "SVT: rate >220 bpm (infants) or >180 bpm (children), NO beat-to-beat HR variability, P waves absent or abnormal, PR indeterminable, QRS usually narrow. Sinus tachycardia: beat-to-beat HR variability with activity changes, P waves present/normal, PR constant, QRS narrow.\n\nSVT is the most frequent sustained dysrhythmia in children. Differentiating it from sinus tachycardia is clinically important. Sinus tachycardia rate can be slowed by vagal maneuvers or beta-blockers to reveal sinus P waves; SVT does not show this variability."
    difficulty: medium
    tags: [pediatrics, cardiology, dysrhythmia, SVT, ECG]
  - front: "What is the most common cause of congenital complete heart block in a neonate?"
    back: "Maternal anti-Ro (SSA) or anti-La (SSB) antibodies — classically in a mother with SLE or other connective tissue disease. The block is often diagnosed in utero and may lead to fetal hydrops.\n\nMaternal autoantibodies cross the placenta and damage the fetal atrioventricular conduction system. This is the most clinically important cause of congenital complete heart block. Symptomatic patients require a pacemaker."
    difficulty: medium
    tags: [pediatrics, cardiology, heart block, congenital, SLE, neonatal]
  - front: "What ECG features are normal in a neonate but would be abnormal in an older child or adult?"
    back: "Normal neonatal ECG findings: right axis deviation (RAD), large precordial R waves (due to RV dominance), shorter PR/QT intervals and QRS duration, upright T waves in right precordial leads, inferior and lateral small Q waves.\n\nThe right ventricle is larger than the left in neonates due to in utero physiology, explaining RV dominance on ECG. These findings normalize as the LV becomes dominant with postnatal systemic circulation."
    difficulty: easy
    tags: [pediatrics, cardiology, ECG, neonatal, normal variants]
  - front: "Which features distinguish a pathological heart murmur from an innocent murmur in a child?"
    back: "Pathological features: symptoms/signs of cardiac disease (FTT, exercise intolerance), diastolic, pansystolic, or continuous timing (except venous hum), grade ≥3/6 or palpable thrill, harsh quality, fixed split or single S2, extra sounds/clicks, murmur unchanged with position. Innocent: asymptomatic, soft/blowing/vibratory, <3/6, physiologic S2 splitting, varies with position.\n\n50–80% of children have audible murmurs at some point. Most are functional/innocent. Key red flags pointing to pathology include diastolic timing, a thrill, fixed S2 splitting (as in ASD), or associated symptoms. Innocent murmurs accentuate in high-output states like fever or anemia."
    difficulty: medium
    tags: [pediatrics, cardiology, murmurs, innocent murmur, physical exam]
  - front: "Describe the five types of innocent heart murmurs in children, including their age groups and locations."
    back: "1. Peripheral Pulmonic Stenosis — neonates, left upper sternal border, systolic ejection, radiates to axilla/back (disappears by 3–6 mo). 2. Still's Murmur — 3–6 yr, LLSB/apex, systolic ejection, high-pitched vibratory. 3. Venous Hum — 3–6 yr, infraclavicular (R>L), continuous. 4. Pulmonary Flow Murmur — 8–14 yr, left upper sternal border, systolic ejection, soft blowing. 5. Supraclavicular Arterial Bruit — any age, supraclavicular, systolic ejection, low intensity.\n\nEach innocent murmur has characteristic features that must be distinguished from pathological counterparts. Peripheral pulmonic stenosis mimics true PS or PDA; venous hum is the only innocent continuous murmur and can mimic PDA; Still's murmur DDx includes small VSD and subaortic stenosis."
    difficulty: hard
    tags: [pediatrics, cardiology, innocent murmur, Stills murmur, venous hum]
  - front: "What premature ventricular contraction (PVC) features in a child suggest a benign etiology?"
    back: "Benign PVCs: single morphology (uniform), disappear with exercise, no associated structural cardiac lesions. PVCs are common in adolescents. Non-benign PVCs: multiform (polymorphic), persist or worsen with exercise, associated with structural heart disease — may degenerate into more serious dysrhythmias.\n\nPVCs in children are generally benign if they are isolated, uniform, and exercise-related disappearance is demonstrated. Exercise stress testing can help differentiate benign from pathological PVCs. Electrolyte disturbances and digitalis toxicity can also cause PVCs."
    difficulty: medium
    tags: [pediatrics, cardiology, PVC, dysrhythmia, benign]
  - front: "What are the diagnostic criteria for Kawasaki Disease, and what is the mnemonic?"
    back: "Mnemonic: Warm CREAM. Fever >5 days PLUS ≥4 of: Conjunctival injection (bilateral, non-exudative); Rash (polymorphous); Edema of hands/feet (acute) or periungual desquamation (subacute); Adenopathy (cervical lymphadenopathy >1.5 cm, usually unilateral); Mucosal changes (fissured lips, strawberry tongue, injected pharynx). Exclusion of other diseases (scarlet fever, measles). Incomplete Kawasaki: fever ≥5 days + only 2-3 features → further evaluation with CRP, ESR, supplemental lab criteria.\n\nKawasaki disease is the most common cause of acquired heart disease in children in developed countries (Canada included). Peak age 3 months–5 years; most common in East Asian/Pacific Islander descent (especially Japanese). The diagnosis is clinical. Incomplete Kawasaki disease is important to recognize because children with fewer classic features can still develop coronary aneurysms."
    difficulty: medium
    tags: [pediatrics, cardiology, Kawasaki-disease, vasculitis, fever, diagnostic-criteria]
  - front: "What is the treatment of Kawasaki Disease and what complication does it prevent?"
    back: "Initial therapy: IVIG 2 g/kg (single dose) + low-dose ASA 3-5 mg/kg/d (max 325 mg/d). IVIG must be given within 10 days of fever onset to reduce risk of coronary artery aneurysm formation. If fever persists 24-36 h after IVIG: repeat IVIG at same dose; if second dose fails, trial a third IVIG or IV pulse methylprednisolone, or consult rheumatology. Baseline 2D echocardiogram and follow-up at 2 and 6 weeks. Anticoagulation for multiple or large coronary aneurysms.\n\nWithout treatment, coronary artery aneurysms occur in 20-25% of children with Kawasaki disease. IVIG within 10 days reduces this to <5%. 50% of aneurysms regress within 2 years. ASA is used initially at anti-inflammatory doses and then continued at antiplatelet doses once fever resolves. The combination of IVIG + ASA is the cornerstone of therapy per Canadian and international guidelines."
    difficulty: medium
    tags: [pediatrics, cardiology, Kawasaki-disease, IVIG, ASA, coronary-aneurysm, treatment]
  - front: "How is hypertension defined in children, and how does it differ from 'elevated BP' (formerly pre-HTN)?"
    back: "HTN: sBP and/or dBP ≥95th percentile for sex, age, and height on ≥3 occasions. Elevated BP (pre-HTN): sBP and/or dBP ≥90th but <95th percentile, OR BP ≥120/80 irrespective of age, sex, and height.\n\nChildhood BP thresholds are age-, sex-, and height-specific (unlike adult cut-offs of 140/90). A 17-year-old male at the 75th height percentile has a 95th percentile BP of ~137/86 mmHg. White coat hypertension is common in all pediatric ages and should be ruled out with 24-hour ambulatory monitoring."
    difficulty: easy
    tags: [hypertension, pediatrics, blood pressure, definition]
  - front: "What is the most common cause of hypertension in adolescents vs. young children?"
    back: "Adolescents (≥10 yr): primary (essential) hypertension accounts for ~90% of cases — associated with obesity, positive family history, male sex, mild HTN. Young children (<10 yr, especially infants): secondary hypertension predominates — identifiable causes including renal parenchymal disease, renovascular abnormalities, coarctation of the aorta.\n\nIn neonates, renal artery thrombosis and coarctation of the aorta are key vascular causes. CAH and neuroblastoma are important endocrine/metabolic causes. In prepubertal children, the absence of family history and presence of renal disease suggest secondary HTN. Always consider white coat HTN and ensure appropriate cuff size."
    difficulty: easy
    tags: [hypertension, pediatrics, primary hypertension, secondary hypertension]
  - front: "What are the clinical features of hypertensive emergency in children?"
    back: "Neurological: headache, seizures, focal complaints, change in mental status, visual disturbances. Cardiovascular: symptoms of MI or heart failure (chest pain, palpitations, cough, SOB).\n\nMost children with HTN are asymptomatic; hypertensive emergency represents acute end-organ damage. Non-specific symptoms (FTT, fatigue, epistaxis) may occur. The differential exam should include: four-limb BPs (coarctation), abdominal/renal bruit (renal artery stenosis), ambiguous genitalia (CAH), and signs of renal parenchymal disease (edema)."
    difficulty: medium
    tags: [hypertension, hypertensive emergency, pediatrics, end-organ damage]
  - front: "What is the pharmacologic management of hypertension in children, including hypertensive emergency?"
    back: "Gradual BP lowering using thiazide diuretics (no antihypertensives formally studied in children). For hypertensive emergency: hydralazine, labetalol, or sodium nitroprusside. Non-pharmacologic: weight reduction, exercise, salt restriction, cessation of smoking/recreational drugs.\n\nManagement also targets the underlying cause (secondary HTN) and end-organ damage (retinopathy, LVH assessed by echo). ACE inhibitors or ARBs are used for persistent HTN in nephrotic syndrome. Referral to a specialist Pediatrician or Pediatric Nephrologist is recommended."
    difficulty: medium
    tags: [hypertension, pediatrics, management, hydralazine, labetalol]
