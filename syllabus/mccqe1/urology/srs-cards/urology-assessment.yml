# Urology Assessment (Urology) - generated from srs-mccqe1
cards:
  - front: "What urologic history features are assessed using the mnemonic OPQRSTU?"
    back: "Onset, Position, Quality, Radiation, Severity, Temporality, déjà vu (history). Applied to urologic symptoms including LUTS (FUN/SHED), hematuria, dysuria, incontinence, and sexual/erectile function.\n\nA thorough urologic history also includes risk factors (prior UTI, stones, STIs, cancers, anatomic abnormalities), medications (anticoagulants, alpha-blockers, anticholinergics), lifestyle factors (smoking, alcohol), and the psychological impact of symptoms on QoL."
    difficulty: easy
