  - front: "What is the oral treatment for vulvovaginal candidiasis?"
    back: "Fluconazole 150 mg PO as a single dose\n\nSingle-dose oral fluconazole is as effective as topical azoles and more convenient for patients."
    difficulty: easy
    tags: [gynecology, infections, fungal, candidiasis, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the intravaginal treatment for bacterial vaginosis using metronidazole gel?"
    back: "Metronidazole 0.75% gel: one applicator (5g) intravaginally at bedtime for 5 days\n\nAlternative to oral metronidazole for patients who cannot tolerate systemic side effects or prefer local therapy."
    difficulty: easy
    tags: [gynecology, infections, bacterial, BV, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for bacterial vaginosis using clindamycin cream?"
    back: "Clindamycin 2% cream: one applicator (5g) intravaginally at bedtime for 7 days\n\nUseful alternative for patients allergic to metronidazole. Avoid concurrent use with condoms as clindamycin weakens latex."
    difficulty: easy
    tags: [gynecology, infections, bacterial, BV, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are first-line treatment options for bacterial vaginosis?"
    back: "Metronidazole 500 mg PO BID x 7 days OR metronidazole 0.75% gel intravaginally nightly x 5 days OR clindamycin 2% cream intravaginally nightly x 7 days\n\nMetronidazole targets anaerobic overgrowth. Alternative regimens include single-dose metronidazole 2g PO or clindamycin 300 mg PO BID x 7 days."
    difficulty: easy
    tags: [gynecology, bacterial vaginosis, antibiotics, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "When is treatment for vulvovaginal candidiasis recommended?"
    back: "Treat only if patient is symptomatic\n\nAsymptomatic candidiasis does not require treatment as Candida is a normal vaginal commensal. Treatment is indicated for symptomatic infection."
    difficulty: easy
