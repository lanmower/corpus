# Gr 9 Maths CAPS — data-handling / Five Number Summary
deck: "Corpus::Gr9 Maths::Five Number Summary"
notes:
  - guid: b8d0f2a4c6e13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Five Number Summary"
    fields:
      Front: "What are the FIVE values in a five-number summary?"
      Back: "In order:\n1. Minimum (smallest value)\n2. Lower quartile Q1\n3. Median Q2 (the middle)\n4. Upper quartile Q3\n5. Maximum (largest value)\n\nThese five numbers describe the centre and spread of the data and are used to draw a box-and-whisker plot. Always ORDER the data first."
    tags: ["five-number-summary", "subject:data-handling"]
  - guid: d0f2a4c6e8b13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Five Number Summary"
    fields:
      Front: "What are QUARTILES Q1, Q2, Q3 and what fraction of data lies below each?"
      Back: "Quartiles split ordered data into four equal parts:\n• Q1 (lower quartile): 25% of data below it; it is the median of the LOWER half.\n• Q2 (median): 50% below it.\n• Q3 (upper quartile): 75% below it; the median of the UPPER half.\n\nSo the four quarters each hold about 25% of the values."
    tags: ["quartiles", "subject:data-handling"]
  - guid: f2a4c6e8b0d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Five Number Summary"
    fields:
      Front: "Find the five-number summary for: 4, 8, 15, 16, 23, 42, 47, 50 (n = 8)."
      Back: "Already ordered. n = 8.\nMin = 4, Max = 50.\nMedian Q2 = (16+23)/2 = 19.5.\nLower half: 4, 8, 15, 16 → Q1 = (8+15)/2 = 11.5.\nUpper half: 23, 42, 47, 50 → Q3 = (42+47)/2 = 44.5.\n\nSummary: 4, 11.5, 19.5, 44.5, 50."
    tags: ["five-number-summary", "subject:data-handling"]
  - guid: a4c6e8f0b2d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Five Number Summary"
    fields:
      Front: "How do you find quartiles when n is ODD (e.g. 7 values)?"
      Back: "1. Order the data; find the median (the middle value).\n2. EXCLUDE the median itself.\n3. Q1 = median of the values BELOW it; Q3 = median of the values ABOVE it.\n\nExample: 2, 4, 6, 8, 10, 12, 14. Median = 8 (exclude it).\nLower: 2,4,6 → Q1 = 4. Upper: 10,12,14 → Q3 = 12."
    tags: ["quartiles", "subject:data-handling"]
  - guid: c6e8a0f2b4d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Five Number Summary"
    fields:
      Front: "What is the INTERQUARTILE RANGE (IQR) and why is it useful?"
      Back: "IQR = Q3 − Q1.\nIt is the spread of the MIDDLE 50% of the data.\n\nUseful because it ignores the extreme top 25% and bottom 25%, so it is NOT distorted by outliers (unlike the full range). A small IQR means the middle data is tightly packed.\n\nExample: Q1 = 11.5, Q3 = 44.5 → IQR = 33."
    tags: ["interquartile-range", "subject:data-handling"]
  - guid: e8a0c2f4b6d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Five Number Summary"
    fields:
      Front: "How do you draw a BOX-AND-WHISKER plot from a five-number summary?"
      Back: "On a number line scaled to fit the data:\n1. Draw a BOX from Q1 to Q3.\n2. Draw a vertical line inside the box at the MEDIAN (Q2).\n3. Draw WHISKERS (lines) from the box out to the minimum and to the maximum.\n\nThe box = middle 50% (IQR); whiskers = the outer quarters. Position everything to scale on the number line."
    tags: ["box-and-whisker", "subject:data-handling"]
  - guid: a0c2e4f6b8d33957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Five Number Summary"
    fields:
      Front: "How do you READ spread and skew from a box-and-whisker plot?"
      Back: "• A LONG whisker or wide box = greater spread on that side.\n• Box width = IQR (middle 50% spread).\n• If the median sits left of centre in the box / right whisker is long → data skewed to the higher values. If right of centre / left whisker long → skewed to lower values.\n• Symmetric: median centred, whiskers equal."
    tags: ["box-and-whisker", "subject:data-handling"]
  - guid: c2e4a6f8b0d33957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Five Number Summary"
    fields:
      Front: "Pitfall: a learner found Q1 and Q3 WITHOUT ordering the data first. What's wrong?"
      Back: "Quartiles and the median depend on POSITION in the ORDERED list. If you don't sort the data smallest-to-largest first, every quartile (and the median) will be wrong.\n\nAlways: order the data → find min and max → find median (Q2) → split into halves → find Q1 and Q3."
    tags: ["quartiles", "subject:data-handling"]
