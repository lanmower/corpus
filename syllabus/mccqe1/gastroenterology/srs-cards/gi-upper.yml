    back: "Esophageal stricture (leading to dysphagia), esophagitis (ulceration, bleeding), Barrett's esophagus, and esophageal adenocarcinoma\n\nGERD can lead to scarring causing stricture with dysphagia to solids, esophagitis with ulceration and bleeding, Barrett's esophagus, and progression to adenocarcinoma."
