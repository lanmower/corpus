  - front: "A patient with Wilson's Disease presents with tremors and psychiatric symptoms. What is the most appropriate initial therapy?"
    back: "Zinc or tetrathiomolybdate (tetrathiomolybdate preferred if neurological involvement)\n\nZinc impairs copper excretion in stool and decreases absorption. Tetrathiomolybdate is preferred for neurological presentations as it doesn't worsen neurological symptoms. Trientine + zinc is used for hepatic presentations."
    difficulty: hard
    tags: [wilsons-disease, treatment, neurology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "Why should drains be brought out through a separate incision rather than the operative wound?"
    back: "To decrease the risk of wound infection by providing an independent pathway for potential pathogens to exit.\n\nDrains create a potential route for infection; bringing them through a separate incision prevents contamination of the main surgical wound."
    difficulty: easy
    tags: [surgery, drains, infection prevention, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What are potential complications of surgical drains?"
    back: "Rigged drains can erode through internal structures, and excessive suction can cause necrosis. Drains also do not guarantee prevention of fluid collections.\n\nWhile drains are useful, they have risks that must be balanced against benefits—overly aggressive suction can cause tissue damage."
    difficulty: medium
    tags: [surgery, drains, complications, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "Which autoantibody is associated with interstitial lung disease and anti-synthetase syndrome in polymyositis/dermatomyositis?"
    back: "Anti-Jo-1\n\nAnti-Jo-1 is an anti-synthetase antibody associated with ILD and the anti-synthetase syndrome."
    difficulty: medium
    tags: [dermatomyositis, polymyositis, anti-jo-1, autoantibodies, ild, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the initial pharmacological treatment for dermatomyositis?"
    back: "High-dose glucocorticoids (e.g., prednisone 1 mg/kg/day, max 80 mg daily) with slow taper after ~6 weeks\n\nGlucocorticoids are first-line immunosuppressive therapy for DMM, tapered gradually to avoid relapse."
    difficulty: easy
    tags: [Dermatomyositis, Glucocorticoids, Treatment, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "When is rituximab considered in dermatomyositis treatment?"
    back: "Severe or refractory muscle disease or interstitial lung disease (ILD)\n\nRituximab is a B-cell depleting agent used when standard therapy fails or for pulmonary complications."
    difficulty: medium
    tags: [Dermatomyositis, Rituximab, ILD, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "How does gouty nephropathy present?"
    back: "Uric acid crystal deposition in the kidney, potentially leading to renal dysfunction\n\nKidney involvement is a complication of chronic hyperuricemia in gout."
    difficulty: hard
    tags: [gout, nephropathy, kidney, complications, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What does a MAG3 diuretic renogram evaluate in hydronephrosis?"
    back: "Differential renal function and functional obstruction (delayed drainage of radiotracer)\n\nMAG3 scan provides functional information about each kidney's contribution to total renal function and whether obstruction is functionally significant."
    difficulty: medium
    tags: [hydronephrosis, MAG3, renogram, imaging, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What imaging study helps delineate anatomy and potential causes of hydronephrosis such as obstructing stones?"
    back: "CT scan\n\nCT provides excellent anatomic detail and can identify obstructing stones, tumors, and other structural causes, though it provides limited functional information."
    difficulty: easy
    tags: [hydronephrosis, CT, imaging, stones, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is Wilms' tumour (nephroblastoma)?"
    back: "An embryonal tumour developing from immature kidney cells (metanephric blastema) that interferes with normal tubular and glomerular differentiation\n\nIt is the most common primary malignant renal tumour of childhood, arising from abnormal proliferation of metanephric blastema."
    difficulty: easy
    tags: [Wilms tumour, nephroblastoma, pediatric oncology, renal tumour, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What are disorders of sexual differentiation (DSD)?"
    back: "Formerly known as intersex disorders; abnormal genitalia for chromosomal sex due to under-virilization of males or virilization of females; considered a social emergency\n\nDSD results from disruptions in normal sexual development pathways."
    difficulty: easy
    tags: [DSD, disorders of sexual differentiation, intersex, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is the Glasgow Coma Scale (GCS), how is it scored, and what do the ranges indicate?"
    back: "GCS = Eyes (1–4) + Verbal (1–5) + Motor (1–6) = Total (3–15). Eyes: 4=spontaneous, 3=to voice, 2=to pain, 1=none. Verbal: 5=oriented, 4=confused, 3=inappropriate words, 2=incomprehensible sounds, 1=none. Motor: 6=obeys commands, 5=localizes pain, 4=withdraws, 3=decorticate, 2=decerebrate, 1=none. Ranges: 13–15=mild, 9–12=moderate, <8=severe TBI. Intubated patients scored out of 10+T.\n\nThe GCS is used in trauma patients with decreased LOC and is a key predictor of neurosurgical prognosis. Change in GCS over time is more clinically meaningful than a single absolute value. A GCS <8 (unable to protect airway) is a standard intubation threshold."
    difficulty: easy
    tags: [GCS, Glasgow Coma Scale, TBI, neurological assessment, trauma]
  - front: "What causes a unilateral, dilated, non-reactive pupil in a trauma patient?"
    back: "Causes of unilateral dilated non-reactive pupil: focal mass lesion (epidural/subdural hematoma), herniation (uncal compression of CN III), subdural hematoma, or ocular causes (traumatic mydriasis from iris sphincter damage). This is a neurosurgical emergency requiring immediate attention.\n\nA blown pupil (fixed and dilated) in trauma suggests uncal herniation with CN III compression, which requires urgent CT head and neurosurgical consultation. In contrast, bilateral pinpoint pupils suggest pontine lesion or opioid toxicity."
    difficulty: medium
    tags: [dilated pupil, herniation, CN III, subdural hematoma, trauma]
  - front: "What are the definitions of lethargy, stupor, and coma?"
    back: "Lethargy: state of decreased awareness and alertness (patient may appear wakeful). Stupor: unresponsiveness but rousable. Coma: sleep-like state, not rousable to consciousness (GCS <8).\n\nAltered mental status is a spectrum ranging from subtle inattention (delirium) to complete unresponsiveness (coma). GCS <8 is the threshold used to define coma and is also an indication for airway protection. The AVPU scale (Alert, Voice, Pain, Unresponsive) is a rapid bedside tool."
    difficulty: easy
    tags: [coma, altered mental status, GCS, consciousness]
  - front: "How do structural coma and toxic-metabolic coma differ clinically?"
    back: "Structural coma: asymmetric pupils, extraocular movements, and motor findings; focal or lateralizing abnormalities. Toxic-metabolic coma: symmetric or absent extraocular movements and motor findings; respiratory depression with intact upper brainstem (equal, reactive pupils); caloric unresponsiveness at lower brainstem levels.\n\nA 'lucid interval' after head trauma followed by delayed deterioration is classic for epidural hematoma (arterial bleed causing progressive mass effect). Symmetric findings in coma suggest metabolic etiology. Status may change rapidly, requiring frequent reassessment."
    difficulty: medium
    tags: [coma, structural coma, toxic metabolic, neurological exam]
  - front: "What are the risk factors and management of cerebral venous sinus thrombosis (CVST)?"
    back: "Risk factors: neoplasm, pregnancy, puerperium, systemic diseases, dehydration, intracranial tumors, oral contraceptives, coagulopathies. Presentations: gradual or sudden onset headache, vomiting, papilledema, visual disturbances, focal neurologic deficits, seizures, altered mental status. Investigations: CT head, CT venography, CBC + coagulation studies + D-dimer, LP (to r/o meningitis). Treatment: anticoagulation (LMWH or heparin).\n\nCVST is an uncommon but important cause of headache that can mimic SAH. It disproportionately affects young women (related to oral contraceptives and pregnancy). Anticoagulation is indicated even in the presence of hemorrhagic infarction, unlike most other intracranial hemorrhage. Early diagnosis with CT venography or MR venography is key."
    difficulty: hard
    tags: [CVST, cerebral venous sinus thrombosis, anticoagulation, headache]
  - front: "What did the SELECT2 trial find regarding endovascular thrombectomy for large ischemic strokes?"
    back: "In patients with large ischemic strokes within 24 hours of onset, endovascular thrombectomy + medical care resulted in better functional outcomes (Modified Rankin Scale, OR 1.51 [95% CI 1.20–1.89]) compared to medical care alone, but was associated with higher rates of vascular complications.\n\nSELECT2 extended thrombectomy indications to large core infarcts (previously considered contraindicated due to reperfusion hemorrhage risk). The functional benefit despite increased vascular complications supports the procedure in appropriately selected patients, demonstrating that even large strokes can benefit from recanalization."
    difficulty: hard
    tags: [thrombectomy, ischemic stroke, SELECT2, endovascular, landmark trial]
  - front: "What is the BP management strategy in acute ischemic stroke?"
    back: "Do NOT rapidly reduce BP. Maintain BP >150/100 mmHg for 5 days to preserve perfusion of the ischemic penumbra. Only treat if sBP >200, dBP >120, or MAP >140, or if associated with hemorrhagic transformation, cardiac ischemia, aortic dissection, or renal damage.\n\nThe ischemic penumbra (tissue surrounding the infarct core) depends on collateral circulation and higher perfusion pressure. Lowering BP reduces perfusion to this at-risk tissue, extending infarct size. Exception: if rt-PA is given, BP must be kept <185/110 mmHg."
    difficulty: hard
    tags: [ischemic stroke, hypertension, BP management, ischemic penumbra, emergency]
  - front: "Define stroke vs. TIA."
    back: "Stroke: sudden loss of brain function due to ischemia (87%) or hemorrhage (13%), with symptoms persisting >24 hours OR neuroimaging evidence of infarction. TIA: transient neurologic dysfunction from focal ischemia with no acute infarction on neuroimaging (symptoms typically <1 hour).\n\nThe modern TIA definition is tissue-based (no infarction on MRI) rather than time-based (24-hour rule). TIA carries high early stroke risk—up to 10% in 2 days—and requires urgent evaluation and dual antiplatelet therapy for 21 days."
    difficulty: easy
    tags: [stroke, TIA, definition, ischemic stroke, neurology]
  - front: "What are the absolute contraindications to rt-PA (tPA) in ischemic stroke?"
    back: "Suspected subarachnoid hemorrhage, previous intracranial hemorrhage, prior/severe head injury within 3 months, sBP >185 or dBP >110 mmHg, PT >15.5 or INR >1.7, platelet count <100,000, heparin within 48 hours, current use of thrombin inhibitors or direct factor Xa inhibitors, blood glucose <2.8 mmol/L, intracranial hemorrhage or large infarct on CT.\n\nThese contraindications reflect bleeding risk. The narrow therapeutic window (must treat within 4.5 hours) and these exclusion criteria require rapid assessment using the NIHSS. A dedicated stroke team should be mobilized immediately."
    difficulty: hard
    tags: [tPA, thrombolysis, stroke, contraindications, emergency]
  - front: "What is the time window for IV thrombolysis (rt-PA) in acute ischemic stroke and what are the criteria?"
    back: "Within 4.5 hours of last seen normal (LSN). Requires: acute onset, compatible physical findings, no hemorrhage on CT. If patient presents within 4.5 hours of onset with disabling deficits >60 minutes and no signs of hemorrhage, may be eligible for rt-PA.\n\nThe 4.5-hour window for IV alteplase/tenecteplase is based on clinical trials (NINDS, ECASS III). Mechanical thrombectomy may be considered from 4.5-24 hours in selected patients with large vessel occlusion and salvageable penumbra (DAWN/DEFUSE-3 criteria)."
    difficulty: medium
    tags: [tPA, thrombolysis, stroke, time window, alteplase]
  - front: "What are the stroke syndromes for each major cerebral artery territory?"
    back: "Anterior cerebral artery: contralateral hemianesthesia/hemiparesis (legs > arms/face), gait apraxia, altered mental status. Middle cerebral artery: contralateral hemianesthesia/hemiparesis (arms/face > legs), contralateral homonymous hemianopsia, ipsilateral gaze preference, aphasia. Posterior cerebral artery: contralateral homonymous hemianopsia, cortical blindness, impaired memory. Vertebrobasilar: cranial nerve + cerebellar deficits, vertigo, nystagmus, diplopia, dysphagia, ataxia, locked-in syndrome.\n\nUnderstanding vascular anatomy allows localization of stroke before imaging. MCA stroke is most common due to MCA's large territory. Vertebrobasilar strokes are frequently missed because they can present with non-specific dizziness and may not have the classic hemiplegia of hemispheric strokes."
    difficulty: hard
    tags: [stroke syndromes, MCA, ACA, PCA, vertebrobasilar, neurology]
  - front: "What are the differences between UMN and LMN lesions on examination?"
    back: "UMN: increased tone/spasticity, increased reflexes (hyper-reflexia), clonus, upgoing plantar response (Babinski), no fasciculations, minimal atrophy, loss of groups of muscles. LMN: decreased tone, decreased/absent reflexes, downgoing plantar, fasciculations, significant atrophy, individual muscle involvement.\n\nUMN lesions occur above the anterior horn cell (brain, spinal cord), while LMN lesions involve the anterior horn cell, nerve root, peripheral nerve, or neuromuscular junction. The distinction guides anatomical localization of neurological injury."
    difficulty: medium
    tags: [UMN, LMN, neurology, reflexes, Babinski]
  - front: "What are the components of dual antiplatelet therapy (DAPT) recommended after TIA and for how long?"
    back: "Aspirin (81-325 mg) + clopidogrel (or ticagrelor) for 21 days in high-risk TIA. Then transition to single antiplatelet long-term (aspirin 81 mg first-line; clopidogrel or Aggrenox as second-line).\n\nDAPT after TIA/minor stroke significantly reduces early stroke recurrence (CHANCE and POINT trials). The 21-day duration balances stroke prevention benefit against bleeding risk. High-risk TIA is defined by ABCD2 score ≥4 or DWI lesion on MRI. Long-term single antiplatelet therapy continues indefinitely."
    difficulty: medium
    tags: [TIA, dual antiplatelet, aspirin, clopidogrel, stroke prevention]
  - front: "What is the NIHSS and when is it used?"
    back: "The National Institutes of Health Stroke Scale (NIHSS) is used to assess stroke severity in the acute setting. Scored 0-42; assesses consciousness, gaze, visual fields, facial palsy, motor arm/leg, limb ataxia, sensory, language, dysarthria, extinction/neglect.\n\nNIHSS guides triage decisions: scores 0-4 = minor, 5-15 = moderate, 16-20 = moderately severe, >20 = severe. High NIHSS scores predict poor prognosis and help identify candidates for thrombectomy. Serial assessment monitors for deterioration."
    difficulty: easy
    tags: [NIHSS, stroke, severity, assessment, neurology]
