# Interventional Radiology (Medical Imaging) - generated from srs-mccqe1
cards:
  - front: "What are the indications for an IVC filter?"
    back: "Contraindication to anticoagulation, failure of adequate anticoagulation (recurrent PE despite therapeutic levels), or complication of anticoagulation requiring its termination.\n\nIVC filters mechanically trap DVT emboli to prevent PE. They are usually placed infrarenally to avoid renal vein thrombosis. Per the PREPIC trial, filters prevent PE but increase recurrent DVT risk."
    difficulty: medium
    tags: [interventional radiology, VTE, IVC filter]
