# Gr 9 Maths CAPS — finance / Hire Purchase
deck: "Corpus::Gr9 Maths::Hire Purchase"
notes:
  - guid: 15dd1617aabb1801
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Hire Purchase"
    fields:
      Front: "What is hire purchase (HP) and how is the total cost worked out?"
      Back: "Hire purchase = buying on credit by paying a DEPOSIT now and then equal MONTHLY INSTALMENTS over a fixed period; interest (usually simple) is charged on the amount borrowed.\nTotal cost = deposit + (monthly instalment × number of months).\nHP almost always costs MORE than the cash price because of the interest."
    tags: ["hire-purchase-basics", "subject:finance"]
  - guid: 16aabb1801cc1902
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Hire Purchase"
    fields:
      Front: "A fridge is bought on HP: deposit R1 500 plus R650 per month for 24 months. Find the total amount paid."
      Back: "Instalments total = 650 × 24 = R15 600.\nTotal paid = deposit + instalments = 1 500 + 15 600 = R17 100.\nThat is the full HP price."
    tags: ["total-cost", "subject:finance"]
  - guid: 17cc1902dd1a03bb
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Hire Purchase"
    fields:
      Front: "The fridge above (total HP paid R17 100) has a cash price of R14 000. How much interest was charged?"
      Back: "Interest charged = total HP paid − cash price = 17 100 − 14 000 = R3 100.\nThis is the 'cost of credit' — the extra you pay for not paying cash up front."
    tags: ["interest-charged", "subject:finance"]
  - guid: 18dd1a03bbee2b04
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Hire Purchase"
    fields:
      Front: "Cash price R8 000. You pay a 10% deposit and simple interest of 18% per year is charged on the balance over 2 years. Find the monthly instalment."
      Back: "Deposit = 10% of 8 000 = R800. Balance financed = 8 000 − 800 = R7 200.\nInterest = P·r·t = 7 200 × 0,18 × 2 = R2 592.\nAmount to repay = 7 200 + 2 592 = R9 792.\nMonths = 2 × 12 = 24.\nMonthly instalment = 9 792 ÷ 24 = R408."
    tags: ["instalment-calculation", "subject:finance"]
  - guid: 19ee2b04ccff3c05
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Hire Purchase"
    fields:
      Front: "In the previous example, what is the TOTAL cost of the fridge on hire purchase and how much more than cash is that?"
      Back: "Total HP cost = deposit + repayments = 800 + 9 792 = R10 592.\nExtra over cash = 10 592 − 8 000 = R2 592 (which is exactly the interest charged).\nLesson: paying cash saves the R2 592 interest."
    tags: ["total-cost", "subject:finance"]
  - guid: 1aff3c05ddaa4d06
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Hire Purchase"
    fields:
      Front: "Why is interest in HP charged on the BALANCE and not the full cash price?"
      Back: "You pay the deposit immediately, so you only BORROW the balance = cash price − deposit. Interest is the cost of borrowing, so it applies to that borrowed balance.\nUsing the full cash price would over-charge interest. Always subtract the deposit FIRST, then apply I = P·r·t to the balance."
    tags: ["common-mistakes", "subject:finance"]
  - guid: 1baa4d06eebb5e07
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Hire Purchase"
    fields:
      Front: "Common mistake: forgetting to add the deposit when finding total HP cost. State the correct full formula."
      Back: "Total HP cost = deposit + (monthly instalment × number of months).\nThe deposit is part of what you pay — it must be ADDED.\nLikewise, when finding interest: interest = total HP cost − cash price (the deposit is included on both sides)."
    tags: ["common-mistakes", "subject:finance"]
