# Ent Facial Nerve (ENT) - generated from srs-mccqe1
cards:
  - front: "Differentiate central vs. peripheral facial nerve (CN VII) paralysis clinically."
    back: "Central: spares the forehead (frontalis) because of bilateral cortical representation of upper face muscles; associated with lateralizing signs (hemiparesthesias, hemiparalysis, aphasia). Peripheral: involves all ipsilateral facial muscles including frontalis; no lateralizing signs.\n\nThe key clinical distinction is frontalis involvement. In central facial palsy (UMN lesion, e.g., stroke), the contralateral hemisphere also provides input to the upper face, so forehead movement is partially preserved. Peripheral facial palsy (LMN lesion, e.g., Bell's palsy) affects all branches of CN VII equally, causing complete ipsilateral facial paralysis including forehead. This distinction prevents misattributing a stroke to Bell's palsy."
    difficulty: easy
    tags: [otolaryngology, facial nerve, CN VII, peripheral palsy, central palsy, Bells palsy]
  - front: "Using the KITTENS mnemonic, list the causes of peripheral facial nerve palsy."
    back: "K - Congenital; I - Infection/Idiopathic (Bell's palsy, HSV; otitis media, mastoiditis, varicella-zoster); T - Trauma/Toxins; T - Tumour; E - Endocrine (diabetes, preeclampsia, hyperthyroidism); N - Neurologic (Guillain-Barré, myasthenia gravis, MS); S - Systemic (sarcoidosis, amyloidosis, hyperostoses).\n\nBell's palsy (idiopathic, possibly HSV) accounts for 80-90% of peripheral facial palsy. The KITTENS mnemonic ensures a systematic differential. Red flags suggesting non-Bell's cause include: palpable mass over the parotid gland, unilateral middle ear effusion in adults, no spontaneous remission beginning within 3 weeks, or presence of vesicles (suggesting Ramsay Hunt syndrome)."
    difficulty: medium
    tags: [otolaryngology, facial nerve, KITTENS, Bells palsy, peripheral facial palsy]
  - front: "Compare Bell's palsy and Ramsay Hunt syndrome in terms of etiology, incidence, clinical features, and prognosis."
    back: "Bell's palsy: idiopathic (possibly HSV), 80-90% of PFP; acute onset, postauricular pain, hyperacusis (30%), decreased lacrimation; >90% recovery. Ramsay Hunt: varicella-zoster infection of CN VII/VIII, 4-5% of PFP; severe otalgia, SNHL, vesicles on pinna/EAC (3-7 days after pain onset), herpes zoster ophthalmicus; worse prognosis — only 22% recover completely, 10% complete paralysis.\n\nRamsay Hunt (herpes zoster oticus) is distinguished by the triad of peripheral facial palsy, ear pain, and ipsilateral auricular vesicles. SNHL and vestibular symptoms may occur due to CN VIII involvement. Treatment includes systemic steroids (reduce pain and postherpetic neuralgia) and acyclovir (may lessen pain and aid healing). Bell's palsy is a diagnosis of exclusion with MRI showing PIE enhancement of CN VII. Spontaneous remission should begin within 3 weeks in Bell's palsy; delayed recovery (3-6 months) portends functional loss."
    difficulty: hard
    tags: [otolaryngology, Bells palsy, Ramsay Hunt syndrome, herpes zoster oticus, facial nerve]
  - front: "A 45-year-old woman presents with acute onset complete right-sided facial droop including forehead, postauricular pain, and hyperacusis. What is the most likely diagnosis and treatment?"
    back: "Most likely diagnosis: Bell's palsy (idiopathic peripheral facial nerve palsy, possibly HSV). Treatment: corneal protection (artificial tears, nocturnal lid taping), systemic corticosteroids (prednisone), consider antiviral (acyclovir). Monitor for spontaneous remission within 3 weeks.\n\nInvolvement of the forehead (frontalis) distinguishes peripheral from central facial palsy. Bell's palsy is a diagnosis of exclusion accounting for 80-90% of peripheral facial palsy. Postauricular pain and hyperacusis are characteristic features. MRI with gadolinium shows PIE enhancement of CN VII. If no voluntary EMG motor unit potentials are present in >90% testing, consider surgical decompression. Prognosis is good — most patients recover completely but recovery of delayed onset (3-6 months) portends functional loss."
    difficulty: medium
    tags: [otolaryngology, Bells palsy, peripheral facial palsy, corticosteroids, clinical scenario]
