# Neonatal Conditions & Newborn Care (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "A newborn has Apgar scores of 5 at 1 minute and 7 at 5 minutes. What does this mean and what interventions are needed?"
    back: "Apgar 5 at 1 min = intermediate (interventions needed); 7 at 5 min = reassuring; interventions: dry, stimulate, position airway, suction if needed, supplemental O2\n\nApgar score: Appearance (color), Pulse, Grimace (reflex), Activity (tone), Respiration — scored 0-2 each (max 10). Score <7 at 5 minutes requires intervention and repeat scoring. Score <3 requires neonatal resuscitation. CPS NRP (Neonatal Resuscitation Program) guidelines."
    difficulty: medium
    tags: [Apgar score, neonatal assessment, newborn resuscitation, NRP, pediatrics]
  - front: "A term newborn requires resuscitation. After drying, stimulating, and positioning, HR is 60 bpm and infant is not breathing. What is the next step?"
    back: "Positive pressure ventilation (PPV) with room air (21% O2 initially for term infants) using bag-valve-mask — if HR does not improve within 30 seconds, assess for proper mask seal and chest rise\n\nCPS NRP 2021: initial resuscitation with air (21%) for term infants; titrate O2 up if HR not improving. Effective PPV: rate 40-60 breaths/min, look for chest rise, HR should increase within 30 seconds. Endotracheal intubation if PPV ineffective or prolonged."
    difficulty: hard
    tags: [neonatal resuscitation, PPV, NRP, newborn, pediatrics]
  - front: "What is neonatal hypoglycemia and how is it defined and managed?"
    back: "Neonatal hypoglycemia: blood glucose <2.6 mmol/L in term infants in first 48h; at-risk: IDM, SGA, LGA, preterm, post-asphyxia; treat with early feeding (BF or formula) or IV dextrose 10% (2 mL/kg bolus if symptomatic)\n\nCPS neonatal glucose guidelines: all at-risk newborns should have glucose screening in first 30-60 minutes. Asymptomatic hypoglycemia: trial of feeding first. Symptomatic or glucose <1.8 mmol/L: IV dextrose immediately. Persistent hypoglycemia (>48h): investigate for hyperinsulinism, pituitary, or metabolic causes."
    difficulty: hard
    tags: [neonatal hypoglycemia, glucose, IDM, dextrose, pediatrics]
  - front: "A term newborn has yellowing of skin at 24 hours of age. What is the concern?"
    back: "Jaundice in first 24 hours is ALWAYS pathological — most likely hemolytic (ABO incompatibility, Rh incompatibility, G6PD deficiency); urgent bilirubin measurement and investigation\n\nPhysiological jaundice appears at 48-72h, peaks day 3-5, resolves by day 2 weeks (term). Pathological jaundice: onset <24h, rate >85 μmol/L/day, total bilirubin >200 μmol/L (or zone-specific threshold), direct hyperbilirubinemia, prolonged (>2 weeks term, >3 weeks preterm). Phototherapy or exchange transfusion depending on levels."
    difficulty: hard
    tags: [neonatal jaundice, hyperbilirubinemia, early jaundice, ABO incompatibility, pediatrics]
  - front: "What are the current Canadian recommendations for vitamin K and vitamin D supplementation in newborns?"
    back: "Vitamin K 1 mg IM (or 2 mg PO x3) immediately after birth to prevent hemorrhagic disease; Vitamin D 800-1000 IU/day oral for exclusively breastfed infants (breast milk has insufficient vitamin D)\n\nCPS recommends universal vitamin K prophylaxis for all newborns — hemorrhagic disease of the newborn (VKDB) is preventable. Vitamin D supplementation for breastfed infants: 800 IU/day (standard) or up to 2000 IU/day for infants in northern communities."
    difficulty: easy
    tags: [vitamin K, vitamin D, newborn supplementation, VKDB, pediatrics]
  - front: "A 30-week premature infant develops increasing oxygen requirement, grunting, and intercostal retractions at 2 hours of life. CXR shows diffuse ground-glass opacity. Diagnosis and treatment?"
    back: "Respiratory distress syndrome (RDS) from surfactant deficiency; treat with exogenous surfactant (poractant alpha) + CPAP or mechanical ventilation; antenatal corticosteroids (betamethasone) given to mother to promote surfactant synthesis\n\nRDS is the most common cause of respiratory distress in preterm infants. Severity proportional to prematurity. INSURE strategy (INtubation, SURfactant, Extubation to CPAP) reduces ventilation complications. CPS guidelines: antenatal steroids at 24-34 weeks gestation for anticipated preterm delivery."
    difficulty: hard
    tags: [RDS, respiratory distress syndrome, surfactant, prematurity, pediatrics]
  - front: "A term newborn born to a GBS-positive mother develops fever, poor feeding, and grunting at 18 hours of age. What is the diagnosis and management?"
    back: "Early-onset neonatal sepsis (EOS) — most likely Group B Streptococcus; blood culture, CBC, CRP, CSF; empiric IV ampicillin + gentamicin; admit to NICU\n\nSOGC GBS guidelines: universal screening at 35-37 weeks. Intrapartum antibiotic prophylaxis (penicillin G) reduces EOS by 80%. Despite prophylaxis, EOS can still occur. EOS symptoms: poor feeding, temperature instability, respiratory distress, lethargy within 72h of birth."
    difficulty: hard
    tags: [neonatal sepsis, EOS, GBS, ampicillin, pediatrics]
  - front: "What is necrotizing enterocolitis (NEC) and in which patients does it occur?"
    back: "NEC: ischemic/inflammatory bowel necrosis in preterm infants; presents at 2-6 weeks of age with feeding intolerance, abdominal distension, bloody stool, and pneumatosis intestinalis on AXR\n\nNEC is the most common GI emergency in preterm infants. Risk increases with lower gestational age. Pneumatosis intestinalis (gas in bowel wall) and portal venous gas are radiographic signs. Treatment: bowel rest, NG decompression, IV antibiotics, surgery for perforation. Breast milk is protective."
    difficulty: hard
    tags: [NEC, necrotizing enterocolitis, premature infant, pneumatosis, pediatrics]
  - front: "What is the newborn screening program in Canada and what does it test for?"
    back: "Varies by province; typically: PKU, congenital hypothyroidism (most common treatable cause of intellectual disability), galactosemia, MSUD, fatty acid oxidation disorders, hemoglobinopathies, CF, SMA — heel prick at 24-48h of age\n\nCPS recommends universal newborn screening. Congenital hypothyroidism: TSH heel prick; treat with levothyroxine within 2 weeks to prevent intellectual disability. PKU: phenylalanine-restricted diet prevents ID. Early detection through newborn screening is cost-effective."
    difficulty: easy
    tags: [newborn screening, PKU, congenital hypothyroidism, heel prick, pediatrics]
  - front: "A preterm infant at 28 weeks develops apnea and bradycardia. What is the management?"
    back: "Apnea of prematurity: caffeine citrate (respiratory stimulant) IV/oral; monitor with pulse oximetry; CPAP for recurrent or severe apnea\n\nApnea of prematurity results from immaturity of respiratory control centers. CAFCA trial: caffeine reduces BPD, neurodevelopmental impairment, and reduces duration of mechanical ventilation. Apnea >20 seconds or associated with bradycardia/desaturation requires intervention."
    difficulty: medium
    tags: [apnea of prematurity, caffeine, preterm infant, CPAP, pediatrics]
  - front: "A term newborn has passed meconium in utero. At delivery, the baby is depressed with decreased tone. What are the key steps?"
    back: "Vigorous newborn: routine care; Non-vigorous (poor tone, poor resp effort, HR <100): immediate laryngoscopy and suction of trachea if meconium seen, then PPV if needed\n\nMeconium-stained amniotic fluid (MSAF) occurs in 12% of deliveries. NRP 2021: routine suctioning of non-vigorous infants with MSAF recommended. Meconium aspiration syndrome: respiratory distress + patchy consolidation on CXR — may require surfactant, nitric oxide, or ECMO for severe cases."
    difficulty: hard
    tags: [meconium aspiration, NRP, non-vigorous newborn, PPV, pediatrics]
  - front: "What is intraventricular hemorrhage (IVH) in premature infants and how is it graded?"
    back: "IVH: bleeding from germinal matrix into ventricles; Grade I: germinal matrix only; Grade II: IVH without ventricular dilation; Grade III: IVH with ventricular dilation; Grade IV: periventricular hemorrhagic infarction — Grades III-IV associated with poor prognosis\n\nIVH occurs in 25% of infants <28 weeks. Antenatal corticosteroids reduce IVH risk. Head ultrasound in all infants <30 weeks at 7 days and 4 weeks. Hydrocephalus may require VP shunt. Grade I-II: good prognosis; Grade III-IV: increased risk of CP and developmental delay."
    difficulty: medium
    tags: [IVH, intraventricular hemorrhage, prematurity, germinal matrix, pediatrics]
  - front: "What is congenital hypothyroidism and how is it screened and treated?"
    back: "Congenital hypothyroidism: TSH elevation on newborn screen (heel prick); treat immediately with levothyroxine 10-15 μg/kg/day — must start within 2 weeks to prevent irreversible intellectual disability\n\nCH is the most common preventable cause of intellectual disability. Most cases (75%) are sporadic (thyroid agenesis or dysgenesis). Symptoms in newborn are often subtle: prolonged jaundice, large fontanelle, poor feeding, constipation, hypotonia. Levothyroxine replacement is life-long."
    difficulty: medium
    tags: [congenital hypothyroidism, newborn screening, levothyroxine, intellectual disability prevention, pediatrics]
  - front: "What are the key differences in fluid requirements in term vs. preterm neonates?"
    back: "Term newborn: start 60-80 mL/kg/day D10W; Preterm (<32 weeks): 80-100+ mL/kg/day due to increased insensible losses through immature skin; adjust based on weight, electrolytes, and urine output\n\nPreterm infants have immature renal concentrating ability and high insensible water losses (especially <28 weeks). Monitor serum sodium daily (goal 135-145 mEq/L). Early weight loss of 5-15% is normal. Hypernatremia = insufficient fluids; hyponatremia = excess free water."
    difficulty: medium
    tags: [neonatal fluids, fluid management, preterm infant, electrolytes, pediatrics]
  - front: "What is the management of a newborn with suspected congenital heart disease presenting with cyanosis at birth?"
    back: "Hyperoxia test (100% O2 for 10 min): PaO2 remains <150 mmHg = cardiac cyanosis; management: prostaglandin E1 (PGE1/alprostadil) to maintain ductal patency until definitive diagnosis and repair\n\nProstaglandin E1 maintains ductus arteriosus patency in duct-dependent CHD (TGA, HLHS, critical pulmonary stenosis, coarctation). CXR, ECG, and echocardiography establish diagnosis. Tetralogy of Fallot: boot-shaped heart, decreased pulmonary vascular markings. TGA: egg-on-a-string."
    difficulty: hard
    tags: [congenital heart disease, cyanosis, prostaglandin E1, TGA, pediatrics]
  - front: "What is the APGAR scoring system?"
    back: "Appearance(color), Pulse, Grimace(reflex), Activity(tone), Respiration. Each 0-2. Assessed at 1 and 5 minutes. <7 at 5min requires intervention\n\nScores: 7-10 normal, 4-6 moderately depressed, 0-3 severely depressed. Does not predict long-term neurologic outcome. Resuscitation should not wait for APGAR."
    difficulty: easy
    tags: [APGAR, neonate]
  - front: "What is the approach to neonatal jaundice?"
    back: "Physiologic: onset day 2-3, peaks day 3-5, resolves by 2 weeks. Pathologic: <24h onset, rapid rise (>85umol/L/day), conjugated fraction >20%. Plot total bilirubin on Bhutani nomogram\n\nTreatment: phototherapy based on gestational age and risk factors. Exchange transfusion if bilirubin reaches critical threshold. Causes: ABO incompatibility, G6PD, breastfeeding, Crigler-Najjar."
    difficulty: medium
    tags: [jaundice, neonate]
  - front: "What are the components of the APGAR score and the scoring intervals?"
    back: "A: Appearance (0=blue, 1=acrocyanosis, 2=pink). P: Pulse (0=absent, 1=<100, 2=>=100). G: Grimace/reflex (0=none, 1=grimace, 2=cough/sneeze). A: Activity/tone (0=limp, 1=some flexion, 2=active). R: Respirations (0=absent, 1=weak cry, 2=strong cry). Scored at 1 and 5 minutes (continue q5min if <7). Max score 10.\n\nAPGAR score guides neonatal resuscitation decisions but does NOT predict long-term outcomes. Score 7-10 is normal. <3 at 5 minutes is concerning. Neonatal resuscitation should not be delayed for APGAR scoring. Canadian NRP (Neonatal Resuscitation Program) certification is mandatory for delivery attendants."
    difficulty: medium
    tags: [APGAR, neonatal assessment, resuscitation, pediatrics]
  - front: "What is the approach to neonatal jaundice and when is it pathological?"
    back: "Physiological: appears day 2-3, peaks day 4-5, resolves by day 14 (21 in preterm). Pathological: jaundice within first 24 hours, total serum bilirubin (TSB) >95th percentile on Bhutani nomogram, rising >85 umol/L/day, conjugated bilirubin >34 umol/L, jaundice >2 weeks. Management: phototherapy (blue-green light, 430-490nm) based on CPS hour-specific nomogram. Exchange transfusion for extreme hyperbilirubinemia.\n\nCPS guidelines provide hour-specific phototherapy and exchange transfusion thresholds. Risk factors for severe jaundice: ABO incompatibility, G6PD deficiency, prematurity, exclusive breastfeeding with poor intake, cephalohematoma. Universal bilirubin screening (transcutaneous) before discharge is recommended in Canada."
    difficulty: hard
    tags: [neonatal jaundice, hyperbilirubinemia, phototherapy, pediatrics]
  - front: "What are the causes of neonatal jaundice by timing of onset?"
    back: "<24h: hemolytic (ABO/Rh incompatibility, G6PD deficiency, spherocytosis). Day 2-5: physiological, breastfeeding jaundice (inadequate intake), infection/sepsis. >2 weeks: breast milk jaundice (unconjugated, benign), biliary atresia (conjugated-pale stools, dark urine), hypothyroidism.\n\nJaundice in the first 24 hours is always pathological and requires urgent evaluation. Conjugated hyperbilirubinemia (direct >34 umol/L or >20% of total) is always pathological and suggests biliary atresia, which requires Kasai portoenterostomy before 60 days of age. CPS recommends urgent referral."
    difficulty: hard
    tags: [neonatal jaundice, hemolytic disease, biliary atresia, pediatrics]
  - front: "What is the Neonatal Resuscitation Program (NRP) algorithm?"
    back: "Initial steps (30 sec): warm, dry, stimulate, position airway, clear secretions if needed. If HR <100 or gasping: PPV with 21% O2 (term) or 21-30% (preterm) at 40-60 breaths/min for 30 sec. If HR <60: intubate if not already, chest compressions 3:1 ratio with ventilation. If HR still <60: epinephrine 0.01-0.03 mg/kg IV/UVC.\n\nNRP certification is standard in Canadian delivery rooms. Initial FiO2 is 21% for term (no longer 100%). Most neonates respond to effective ventilation alone. Canadian Paediatric Society updated NRP guidelines emphasize delayed cord clamping (>=30 seconds for vigorous term infants)."
    difficulty: hard
    tags: [NRP, neonatal resuscitation, algorithm, pediatrics]
  - front: "What is the newborn metabolic screening panel in Canada?"
    back: "Varies by province but typically includes: PKU, congenital hypothyroidism, galactosemia, maple syrup urine disease, medium-chain acyl-CoA dehydrogenase deficiency (MCADD), sickle cell disease, congenital adrenal hyperplasia, cystic fibrosis, biotinidase deficiency. Blood spot (Guthrie card) collected at 24-72 hours of life.\n\nOntario screens for ~30 conditions via the Newborn Screening Ontario program. Congenital hypothyroidism is the most common treatable condition detected (~1/3000). Early treatment of PKU with dietary restriction prevents intellectual disability. Parents should be informed about the screening program."
    difficulty: medium
    tags: [newborn screening, metabolic, PKU, hypothyroidism, pediatrics]
  - front: "What are the common congenital heart defects presenting in the neonatal period and their presentations?"
    back: "Cyanotic (duct-dependent): TGA (cyanosis within hours, single loud S2), tetralogy of Fallot (cyanotic spells), TAPVR, truncus arteriosus, hypoplastic left heart. Acyanotic: VSD (murmur at 2-6 weeks), ASD, PDA (continuous murmur), coarctation (differential BP upper/lower extremities, weak femoral pulses).\n\nDuct-dependent lesions require prostaglandin E1 (PGE1) infusion to maintain PDA. Critical congenital heart disease screening with pulse oximetry is recommended for all newborns in Canada (pre- and post-ductal SpO2 at 24-48h). Echocardiography is the diagnostic standard."
    difficulty: hard
    tags: [congenital heart disease, cyanotic, duct-dependent, pediatrics]
  - front: "What is the management of neonatal hypoglycemia?"
    back: "Definition: plasma glucose <2.6 mmol/L in symptomatic neonate. Risk factors: SGA, LGA, IDM, prematurity, perinatal stress. Asymptomatic at-risk: feed within 1h, check glucose at 2h, target >2.6 mmol/L. Symptomatic (jitteriness, seizures, lethargy): IV dextrose bolus (D10W 2mL/kg = 200mg/kg) followed by D10W infusion at 5-8 mg/kg/min.\n\nCPS screening guidelines target at-risk newborns (IDM, SGA, LGA, preterm). Persistent hypoglycemia (>48h) warrants investigation for hyperinsulinism, cortisol deficiency, or metabolic disease. Bedside glucose meters may underestimate true glucose; confirm with lab value if borderline."
    difficulty: hard
    tags: [neonatal hypoglycemia, glucose, IDM, pediatrics]
  - front: "What are the components of the routine newborn examination?"
    back: "General: weight, length, head circumference, gestational age assessment. Head: fontanelles, sutures, cephalohematoma, caput. Eyes: red reflex (retinoblastoma). Heart: murmurs, femoral pulses. Abdomen: organomegaly, umbilicus (2 arteries, 1 vein). Hips: Barlow (dislocatable) and Ortolani (reducible) maneuvers for DDH. Genitalia: testes descended. Spine: sacral dimple, tuft of hair. Reflexes: Moro, grasp, suck.\n\nCPS guidelines recommend complete newborn exam within 24 hours. Red reflex testing detects retinoblastoma (most common childhood intraocular malignancy). DDH screening with Barlow/Ortolani maneuvers-risk factors: female, breech, family history. Ultrasound hip screening at 6 weeks if risk factors present."
    difficulty: medium
    tags: [newborn exam, Barlow, Ortolani, red reflex, pediatrics]
  - front: "What are the causes and management of neonatal seizures?"
    back: "Causes: hypoxic-ischemic encephalopathy (most common, 60%), intracranial hemorrhage, metabolic (hypoglycemia, hypocalcemia, hyponatremia), infections (meningitis, encephalitis, TORCH), developmental malformations, pyridoxine-dependent seizures. Management: treat underlying cause, phenobarbital (20mg/kg IV loading) is first-line AED.\n\nNeonatal seizures are often subtle (lip smacking, eye deviation, cycling, apnea) and may require EEG for detection. HIE is the most common cause in term neonates. Therapeutic hypothermia (33.5°C for 72h) for moderate-severe HIE reduces mortality and disability. Canadian neonatal cooling protocols are standardized."
    difficulty: hard
    tags: [neonatal seizures, HIE, therapeutic hypothermia, pediatrics]
  - front: "What are the TORCH infections and their key neonatal manifestations?"
    back: "T: Toxoplasmosis (intracranial calcifications, hydrocephalus, chorioretinitis). O: Other (syphilis, varicella, parvovirus). R: Rubella (cataracts, deafness, PDA, blueberry muffin rash). C: CMV (most common congenital infection; periventricular calcifications, microcephaly, hepatosplenomegaly, sensorineural hearing loss). H: Herpes (vesicular lesions, encephalitis, disseminated disease).\n\nCMV is the leading infectious cause of sensorineural hearing loss and neurodevelopmental disability. Congenital CMV testing (urine or saliva PCR within 21 days of birth) is recommended for infants who fail newborn hearing screening. Treatment: IV ganciclovir or oral valganciclovir for 6 months for symptomatic disease."
    difficulty: hard
    tags: [TORCH infections, CMV, congenital infections, pediatrics]
  - front: "What are the types of respiratory distress in the newborn and their management?"
    back: "Transient tachypnea (TTN): term/near-term, cesarean delivery, resolves 24-72h, supportive. Respiratory distress syndrome (RDS): preterm, surfactant deficiency, ground-glass CXR-surfactant replacement + CPAP. Meconium aspiration (MAS): post-term, meconium-stained fluid, patchy CXR-supportive ± surfactant. Pneumothorax: consider in sudden deterioration-needle decompression then chest tube.\n\nAntenatal betamethasone (2 doses, 12mg IM 24h apart) for mothers 24-34 weeks gestation reduces RDS by 50%. CPS/NRP no longer recommend routine endotracheal suctioning for vigorous meconium-stained neonates. CPAP is first-line for preterm RDS with selective surfactant administration."
    difficulty: hard
    tags: [neonatal respiratory distress, RDS, surfactant, TTN, pediatrics]
  - front: "What are the key aspects of prematurity management?"
    back: "<28 weeks: extreme prematurity-RDS, IVH, NEC, BPD, ROP. 28-32 weeks: moderate prematurity-surfactant may be needed, less IVH risk. 32-37 weeks: late preterm-feeding difficulties, jaundice, temperature instability. Key interventions: antenatal steroids (24-34w), magnesium sulfate for neuroprotection (<32w), delayed cord clamping, kangaroo care, breast milk promotion.\n\nCanada-wide perinatal networks (e.g., CNN-Canadian Neonatal Network) track outcomes. Antenatal magnesium sulfate before 32 weeks reduces cerebral palsy (NNT 63). ROP screening begins at 31 weeks postmenstrual age or 4 weeks chronological age. CPS provides follow-up guidelines for preterm infants."
    difficulty: hard
    tags: [prematurity, RDS, antenatal steroids, neonatal care, pediatrics]
  - front: "What are the causes and evaluation of neonatal cyanosis?"
    back: "Central cyanosis DDx: cardiac (cyanotic CHD), pulmonary (RDS, pneumonia, PPHN, pneumothorax), neurological (CNS depression, apnea), hematological (methemoglobinemia). Hyperoxia test: give 100% O2 for 10 min-PaO2 >150mmHg suggests pulmonary cause; PaO2 remains <100mmHg suggests cardiac cause. Echocardiography is definitive for CHD.\n\nThe hyperoxia test helps differentiate cardiac from pulmonary causes of cyanosis. Critical congenital heart disease pulse oximetry screening in Canadian nurseries detects duct-dependent lesions before clinical deterioration. PGE1 infusion is a life-saving bridge to definitive management."
    difficulty: hard
    tags: [neonatal cyanosis, hyperoxia test, CHD, pediatrics]
  - front: "What are the key features of necrotizing enterocolitis (NEC)?"
    back: "Presentation: preterm infant with feeding intolerance, abdominal distension, bloody stools, temperature instability, apnea/bradycardia. X-ray: pneumatosis intestinalis (pathognomonic), portal venous gas, pneumoperitoneum (perforation). Modified Bell staging. Treatment: NPO, gastric decompression, IV antibiotics (ampicillin + gentamicin + metronidazole), surgical consultation.\n\nNEC is the most common GI surgical emergency in neonates with 20-30% mortality. Breast milk feeding is the strongest protective factor. Pneumoperitoneum indicates perforation requiring surgical intervention. Canadian neonatal units use standardized feeding advancement protocols to reduce NEC risk."
    difficulty: hard
    tags: [NEC, necrotizing enterocolitis, prematurity, pediatrics]
  - front: "What is the evaluation of a newborn with ambiguous genitalia?"
    back: "EMERGENCY: risk of salt-wasting CAH crisis. Do NOT assign gender immediately. Urgent investigations: 17-hydroxyprogesterone (CAH is most common cause), karyotype, electrolytes (hyponatremia, hyperkalemia in salt-wasting CAH), pelvic ultrasound (mullerian structures), cortisol, testosterone, LH/FSH.\n\nCongenital adrenal hyperplasia (21-hydroxylase deficiency) accounts for >90% of ambiguous genitalia. Salt-wasting crisis presents at 1-2 weeks with hyponatremia, hyperkalemia, and shock. CPS recommends multidisciplinary team (endocrine, urology, genetics, psychology) for gender assignment and management."
    difficulty: hard
    tags: [ambiguous genitalia, CAH, intersex, endocrine, pediatrics]
  - front: "What are the features of Down syndrome and associated conditions?"
    back: "Trisomy 21: flat facies, epicanthal folds, single palmar crease, hypotonia, intellectual disability. Associated: AV canal defect (40%), duodenal atresia, Hirschsprung, ALL, hypothyroidism, atlantoaxial instability\n\nScreening: first trimester (NT + serum markers), NIPT (cell-free DNA) most sensitive. Maternal age risk: 1/350 at age 35, 1/100 at age 40. Confirm with amniocentesis or CVS (karyotype)."
    difficulty: medium
    tags: [Down syndrome, trisomy 21]
  - front: "What is cystic fibrosis and how is it diagnosed?"
    back: "Autosomal recessive, CFTR mutation (F508del most common). Diagnosis: newborn screening (IRT) + confirmatory sweat chloride >=60mmol/L. Features: recurrent lung infections, pancreatic insufficiency, meconium ileus, male infertility\n\nLung disease: Pseudomonas colonization, bronchiectasis. Management: airway clearance, inhaled DNase, hypertonic saline, CFTR modulators (ivacaftor/lumacaftor-elexacaftor-tezacaftor for eligible genotypes). Median survival now >50 years."
    difficulty: medium
    tags: [CF, cystic fibrosis]
  - front: "What conditions are included in the standard Canadian newborn screening panel, and why is early detection important?"
    back: "Core conditions include: PKU (phenylketonuria), congenital hypothyroidism, cystic fibrosis, galactosemia, sickle cell disease and other hemoglobinopathies, congenital adrenal hyperplasia, biotinidase deficiency, and MCAD deficiency (medium-chain acyl-CoA dehydrogenase). Expanded panels vary by province (Ontario screens for 29+ conditions). Early detection allows treatment before irreversible damage (e.g., dietary restriction for PKU, thyroid replacement for hypothyroidism).\n\nNewborn screening is performed via heel prick blood spot at 24–48 hours of life. In Ontario, Newborn Screening Ontario manages the program. Additionally, critical congenital heart disease screening via pulse oximetry is now recommended by the CPS in all Canadian provinces to detect duct-dependent cardiac lesions before discharge."
    difficulty: easy
    tags: [newborn-screening, PKU, hypothyroidism, cystic-fibrosis, hemoglobinopathies, CPS]
  - front: "Describe the initial steps of the Neonatal Resuscitation Program (NRP) algorithm for a term newborn who is not breathing at birth."
    back: "1) Warm, dry, stimulate, position airway (head in sniffing position), clear airway if needed. 2) If not breathing or HR <100 after 30 seconds: start positive pressure ventilation (PPV) with 21% O₂ (room air) at 40–60 breaths/min. 3) If HR <60 after 30 seconds of effective PPV: start chest compressions (3:1 ratio with ventilations). 4) If HR still <60: administer IV epinephrine (0.01–0.03 mg/kg via UVC). Reassess HR every 30 seconds.\n\nThe CPS and NRP guidelines emphasize that effective ventilation is the single most important step in neonatal resuscitation. Term infants should start with 21% O₂ (not 100%) per 2021 NRP guidelines. Intubation is indicated if PPV via mask is ineffective, for prolonged ventilation, or for specific situations (e.g., congenital diaphragmatic hernia)."
    difficulty: hard
    tags: [NRP, neonatal-resuscitation, PPV, chest-compressions, epinephrine, CPS]
  - front: "A newborn has thick meconium-stained amniotic fluid but is vigorous (crying, good tone). What is the current NRP recommendation for meconium management?"
    back: "For a vigorous newborn (good respiratory effort, tone, and HR >100): proceed with routine initial steps (warm, dry, stimulate, clear airway as needed). Do NOT perform routine endotracheal suctioning. If the infant is not vigorous (apneic, limp, HR <100), initiate PPV and consider intubation and tracheal suctioning only if the airway is obstructed.\n\nThe 2021 NRP guidelines changed the approach to meconium: routine tracheal suctioning of non-vigorous neonates is no longer recommended. The emphasis is on initiating ventilation promptly. Evidence showed that routine suctioning did not improve outcomes and delayed resuscitation. The CPS aligns with these updated international recommendations."
    difficulty: medium
    tags: [meconium, NRP, neonatal-resuscitation, airway-management, CPS]
  - front: "Describe how critical congenital heart disease (CCHD) screening is performed in newborns and what constitutes a positive screen."
    back: "Pulse oximetry screening is performed on the right hand (preductal) and either foot (postductal) at ≥24 hours of age. A positive (failed) screen: any SpO₂ <90%, or SpO₂ 90–94% in both extremities on 3 measurements each separated by 1 hour, or >3% difference between right hand and foot on 3 measurements. A positive screen requires urgent echocardiography.\n\nCCHD screening detects 7 primary targets including hypoplastic left heart, transposition of the great arteries, and tetralogy of Fallot. The CPS supports universal pulse oximetry screening. False positives can occur with pulmonary hypertension or sepsis. The screen has ~75% sensitivity for critical CHD, complementing but not replacing clinical examination."
    difficulty: medium
    tags: [CCHD-screening, pulse-oximetry, congenital-heart-disease, newborn, CPS]
  - front: "List the classic features of Down syndrome (trisomy 21) and its major associated medical conditions."
    back: "Features: hypotonia, flat facies, upslanting palpebral fissures, epicanthal folds, single palmar crease (simian crease), Brushfield spots (iris), short neck with excess skin, sandal gap toes. Associated conditions: congenital heart disease (AV canal defect most characteristic, 40–50%), Hirschsprung disease, duodenal atresia, ALL (10–20x increased risk), hypothyroidism, atlantoaxial instability, early-onset Alzheimer disease.\n\nDown syndrome occurs in approximately 1 in 700 live births and is the most common chromosomal cause of intellectual disability. The SOGC recommends offering prenatal screening to all pregnant women. The CPS has published specific health supervision guidelines for children with Down syndrome including echocardiogram, thyroid screening, and audiologic assessment."
    difficulty: easy
    tags: [Down-syndrome, trisomy-21, AV-canal, ALL, Hirschsprung, CPS]
  - front: "A 16-year-old girl presents with short stature, primary amenorrhea, shield chest, and widely spaced nipples. Cardiac exam reveals a systolic murmur in the left infraclavicular area. What is the most likely diagnosis, karyotype, and expected cardiac finding?"
    back: "Turner syndrome (45,X monosomy). Classic features: short stature (most consistent finding), primary amenorrhea with streak ovaries, shield chest, widely spaced nipples, webbed neck, lymphedema (especially in neonates), low posterior hairline. Cardiac: bicuspid aortic valve (most common, 15–30%) and coarctation of the aorta (7–12%). The murmur described suggests coarctation.\n\nTurner syndrome affects approximately 1 in 2500 female births. Management includes growth hormone therapy for short stature (Health Canada approved) and estrogen replacement at age 12–13 for puberty induction. Lifelong cardiac surveillance is essential due to risk of aortic dilation and dissection. Fertility may be possible via oocyte donation."
    difficulty: medium
    tags: [Turner-syndrome, 45X, coarctation, short-stature, primary-amenorrhea]
  - front: "A tall 20-year-old male presents with gynecomastia, small firm testes, and infertility. Labs show elevated FSH and LH with low testosterone. What is the diagnosis and karyotype?"
    back: "Klinefelter syndrome (47,XXY). Features: tall stature with long limbs (eunuchoid proportions), small firm testes (<4 mL), gynecomastia, sparse body hair, infertility (azoospermia), learning difficulties (especially language-based). Labs: hypergonadotropic hypogonadism (elevated FSH/LH, low testosterone).\n\nKlinefelter syndrome is the most common sex chromosome aneuploidy in males, affecting approximately 1 in 600 male births. Many are diagnosed late or not at all. Treatment includes testosterone replacement starting at puberty for virilization, bone density, and psychosocial well-being. Fertility may be possible with testicular sperm extraction and ICSI in some cases."
    difficulty: medium
    tags: [Klinefelter, 47XXY, gynecomastia, hypogonadism, infertility]
  - front: "A boy with intellectual disability, long face, prominent ears, and macroorchidism after puberty is being evaluated. What is the most likely diagnosis and the underlying genetic mechanism?"
    back: "Fragile X syndrome, caused by CGG trinucleotide repeat expansion (>200 repeats = full mutation) in the FMR1 gene on the X chromosome, leading to silencing of FMRP protein. It is the most common inherited cause of intellectual disability.\n\nFragile X follows X-linked inheritance with variable penetrance. Female carriers (premutation: 55–200 repeats) may have mild features or be unaffected but are at risk for premature ovarian insufficiency and fragile X-associated tremor/ataxia syndrome (FXTAS). Genetic counselling is essential as the repeat can expand across generations (anticipation)."
    difficulty: medium
    tags: [Fragile-X, CGG-repeat, FMR1, intellectual-disability, trinucleotide-repeat]
  - front: "Describe the pathophysiology, diagnosis, and multisystem management of cystic fibrosis."
    back: "Pathophysiology: autosomal recessive mutation in CFTR gene (most common: F508del) causing defective chloride channel → thick, dehydrated secretions in lungs, pancreas, GI tract, and reproductive system. Diagnosis: newborn screening (IRT), confirmed by sweat chloride test (≥60 mmol/L diagnostic, 30–59 intermediate) or genetic testing. Management: airway clearance (chest physiotherapy, hypertonic saline, dornase alfa), inhaled antibiotics (tobramycin for Pseudomonas), pancreatic enzyme replacement (PERT), fat-soluble vitamin supplementation (ADEK), CFTR modulators (ivacaftor, elexacaftor/tezacaftor/ivacaftor = Trikafta).\n\nCF is the most common life-limiting autosomal recessive disorder in Canadians of European descent (~1 in 3600 births). Trikafta has been a transformative therapy, approved by Health Canada, and is effective in ~90% of CF patients with at least one F508del allele. Cystic Fibrosis Canada supports comprehensive multidisciplinary care at accredited CF centres."
    difficulty: hard
    tags: [cystic-fibrosis, CFTR, sweat-chloride, Trikafta, pancreatic-insufficiency, CF-Canada]
  - front: "Describe the pathophysiology of sickle cell disease, types of crises, and key management strategies."
    back: "Pathophysiology: point mutation in β-globin gene (Glu→Val at position 6) → HbS polymerizes under low O₂ → sickled RBCs causing vaso-occlusion and hemolysis. Crises: 1) Vaso-occlusive (pain crisis): most common, 2) Splenic sequestration: acute splenic enlargement + anemia, 3) Aplastic crisis: parvovirus B19 → reticulocytopenia, 4) Hemolytic crisis. Management: hydroxyurea (increases HbF), penicillin prophylaxis from 2 months to 5 years (functional asplenia), pneumococcal vaccination, folic acid, transfusions for acute chest syndrome/stroke, pain management.\n\nNewborn screening for sickle cell disease is standard across Canadian provinces via hemoglobin electrophoresis. Acute chest syndrome (fever, chest pain, new infiltrate) is the leading cause of death. The CPS recommends comprehensive care including transcranial Doppler screening from age 2 to identify stroke risk, with chronic transfusion therapy for abnormal results."
    difficulty: hard
    tags: [sickle-cell, HbS, vaso-occlusive-crisis, hydroxyurea, penicillin-prophylaxis, CPS]
  - front: "What is phenylketonuria (PKU), and why is newborn screening essential?"
    back: "PKU is an autosomal recessive disorder caused by deficiency of phenylalanine hydroxylase, leading to accumulation of phenylalanine. Without treatment, it causes severe intellectual disability, seizures, musty body odor, eczema, and fair skin/hair (decreased melanin). Newborn screening detects elevated phenylalanine on day 1–2 heel prick. Treatment: lifelong phenylalanine-restricted diet, medical formula supplementation, and monitoring of blood phenylalanine levels. Newer therapy: sapropterin (BH4) for responsive patients.\n\nPKU was the first condition added to newborn screening programs and demonstrates the principle that early detection prevents irreversible disease. Treatment must begin within the first weeks of life. Maternal PKU (uncontrolled phenylalanine during pregnancy) causes congenital heart defects, microcephaly, and intellectual disability in the fetus even if the fetus does not have PKU."
    difficulty: easy
    tags: [PKU, phenylalanine, newborn-screening, dietary-restriction, autosomal-recessive]
  - front: "A 3-day-old neonate presents with poor feeding, lethargy, vomiting, and metabolic acidosis with an elevated anion gap. What is the differential diagnosis and initial workup for suspected inborn error of metabolism?"
    back: "Differential: organic acidemias (propionic, methylmalonic acidemia), urea cycle defects (hyperammonemia without acidosis), maple syrup urine disease, galactosemia, fatty acid oxidation defects. Initial workup: blood gas, electrolytes (anion gap), ammonia, lactate, blood glucose, urine ketones, urine organic acids, plasma amino acids, acylcarnitine profile, liver function tests.\n\nInborn errors of metabolism should be considered in any acutely ill neonate without an obvious infectious cause. The CPS emphasizes the importance of sending metabolic samples BEFORE starting treatment, as results guide specific therapy. Urgent management includes stopping protein feeds, providing high glucose infusion (10% dextrose), and correcting acidosis while awaiting results."
    difficulty: hard
    tags: [inborn-errors-metabolism, neonatal-encephalopathy, metabolic-acidosis, organic-acidemia, ammonia]
  - front: "A neonate with suspected urea cycle defect has an ammonia level of 800 μmol/L. What is the acute management?"
    back: "Emergency management: 1) Stop all protein intake, 2) High-calorie IV glucose (D10W at 1.5× maintenance) to prevent catabolism, 3) Nitrogen scavenger therapy: sodium benzoate and sodium phenylacetate (IV Ammonul), 4) Arginine supplementation (except in arginase deficiency), 5) If ammonia >500 or rising despite medical therapy: hemodialysis (more effective than peritoneal dialysis or CVVH for ammonia removal), 6) Consult metabolic genetics urgently.\n\nHyperammonemia is a medical emergency as ammonia is directly neurotoxic. The duration and peak of hyperammonemia correlate with neurological outcome. In Canada, metabolic genetics centres (e.g., SickKids, CHU Sainte-Justine, Alberta Children's Hospital) provide 24/7 consultation. Urea cycle defects are X-linked (OTC deficiency, most common) or autosomal recessive."
    difficulty: hard
    tags: [urea-cycle-defect, hyperammonemia, nitrogen-scavengers, hemodialysis, OTC-deficiency]
  - front: "Explain the inheritance patterns and recurrence risks for autosomal dominant, autosomal recessive, and X-linked recessive conditions."
    back: "Autosomal dominant: 50% risk each pregnancy if one parent affected, male and female equally affected, vertical transmission. Autosomal recessive: 25% affected, 50% carrier, 25% unaffected each pregnancy if both parents are carriers; often consanguinity or same ethnic background. X-linked recessive: carrier mother has 50% chance each son is affected, 50% chance each daughter is a carrier; no male-to-male transmission; affected father transmits carrier status to all daughters, no sons affected.\n\nUnderstanding inheritance patterns is fundamental to genetic counselling. In Canada, genetic counsellors are certified by the Canadian Association of Genetic Counsellors (CAGC). Key concepts to remember: de novo mutations can cause autosomal dominant conditions without family history, and germline mosaicism means recurrence risk is higher than expected even with apparently de novo mutations."
    difficulty: easy
    tags: [inheritance-patterns, autosomal-dominant, autosomal-recessive, X-linked, genetic-counselling]
  - front: "Two carrier parents for an autosomal recessive condition wish to know the probability that their next THREE children will all be unaffected."
    back: "Each child has a 3/4 (75%) chance of being unaffected. For three independent pregnancies: (3/4)³ = 27/64 ≈ 42.2% probability that all three will be unaffected.\n\nThis applies the multiplication rule for independent events. Each pregnancy is an independent event with the same 1/4 risk. Genetic counselling should present risks in multiple formats (fractions, percentages, natural frequencies) as families process numerical information differently. Preimplantation genetic testing (PGT) and prenatal diagnosis offer options for carrier couples in Canada."
    difficulty: medium
    tags: [genetic-risk-calculation, autosomal-recessive, probability, genetic-counselling]
  - front: "What is the significance of trinucleotide repeat expansion disorders? Give three examples with their associated repeats."
    back: "Trinucleotide repeat disorders involve unstable DNA repeat sequences that expand across generations (anticipation = earlier onset and increasing severity). Examples: 1) Fragile X (CGG repeat in FMR1), 2) Huntington disease (CAG repeat in HTT — autosomal dominant), 3) Myotonic dystrophy type 1 (CTG repeat in DMPK — autosomal dominant, congenital form with maternal transmission).\n\nAnticipation is a hallmark of trinucleotide repeat disorders. The number of repeats correlates with disease severity and age of onset. Premutation carriers may have intermediate repeat lengths with milder or different phenotypes (e.g., FXTAS in Fragile X premutation carriers). Genetic testing and counselling are essential for family planning in affected families."
    difficulty: medium
    tags: [trinucleotide-repeat, anticipation, Fragile-X, Huntington, myotonic-dystrophy]
  - front: "A couple has a child with Down syndrome (trisomy 21). The mother's karyotype reveals a Robertsonian translocation t(14;21). What is the recurrence risk?"
    back: "If the mother carries the Robertsonian translocation t(14;21): theoretical risk is 1/3 affected, but empiric recurrence risk is approximately 10–15% for a female carrier and ~2–3% for a male carrier. If the translocation is t(21;21) (same chromosome): 100% recurrence risk (all viable offspring will have trisomy 21). Prenatal diagnosis should be offered in subsequent pregnancies.\n\nRobertsonian translocations account for approximately 4% of Down syndrome cases. Unlike standard trisomy 21 (which increases with maternal age), translocation Down syndrome can occur at any maternal age and has a significant recurrence risk. Parental karyotyping is recommended for all children with Down syndrome to guide genetic counselling."
    difficulty: hard
    tags: [Robertsonian-translocation, Down-syndrome, recurrence-risk, karyotype, genetic-counselling]
  - front: "Describe the features of congenital adrenal hyperplasia (CAH) due to 21-hydroxylase deficiency and why it is included in newborn screening."
    back: "Classic CAH: 1) Salt-wasting form (most severe): presents in first 1–2 weeks of life with adrenal crisis (hyponatremia, hyperkalemia, dehydration, shock), ambiguous genitalia in females (virilization from excess androgens). 2) Simple virilizing form: virilization without salt-wasting. Diagnosis: elevated 17-hydroxyprogesterone on newborn screen. Treatment: hydrocortisone + fludrocortisone (salt-wasting form).\n\nCAH is the most common cause of ambiguous genitalia in 46,XX newborns. It is included in newborn screening because salt-wasting crisis can be fatal if unrecognized. In Canada, 17-OHP is measured on the newborn screening blood spot. The incidence is approximately 1 in 15,000 births, with higher rates in some populations (Yupik Eskimo, La Réunion)."
    difficulty: medium
    tags: [CAH, 21-hydroxylase, ambiguous-genitalia, salt-wasting, 17-OHP, newborn-screening]
  - front: "A mother with myotonic dystrophy gives birth to a floppy infant with respiratory distress. What condition should be suspected and why is maternal transmission important?"
    back: "Congenital myotonic dystrophy. The infant presents with severe hypotonia, respiratory failure, feeding difficulties, facial diplegia, and talipes. Congenital myotonic dystrophy almost exclusively occurs through maternal transmission because the CTG repeat expansion preferentially increases during female meiosis (anticipation). The mother may have only mild symptoms.\n\nMyotonic dystrophy type 1 is an autosomal dominant condition, but the severe congenital form only occurs with very large CTG expansions (>1000 repeats) transmitted maternally. Neonatal mortality is significant (up to 25%), primarily from respiratory failure. Survivors have intellectual disability and progressive myotonia. Genetic counselling should address the risk of anticipation in future pregnancies."
    difficulty: hard
    tags: [congenital-myotonic-dystrophy, anticipation, maternal-transmission, neonatal-hypotonia, CTG-repeat]
  - front: "How does neonatal skin differ from adult skin at birth, and when does it mature?"
    back: "Full-term neonates have all five epidermal layers (similar to adults) but have smaller corneocytes, a thinner stratum corneum, and coarser texture. The stratum corneum matures by ~2 years. Dermal thickness increases from infancy through puberty.\n\nNeonatal skin differences are clinically important: thinner stratum corneum increases percutaneous drug absorption (risk of topical drug toxicity), and increased surface area-to-body weight ratio amplifies this risk. Facial skin matures faster than trunk/limb skin."
    difficulty: medium
    tags: [dermatology, neonatal skin, stratum corneum, pediatrics, skin development]
  - front: "What is a milium and who does it typically affect?"
    back: "Milium: 1–2 mm superficial white-to-yellow subepidermal papules on eyelids, cheeks, forehead. Small epidermoid cyst. In newborns (40–50% of infants), resolves spontaneously in first 4 weeks.\n\nMilia can also be secondary to blistering disorders, trauma, topical corticosteroids, or cosmetic procedures. Treatment when needed: incision and expression, electrodessication, or topical retinoids."
    difficulty: easy
    tags: [dermatology, milium, milia, neonatal, cyst]
  - front: "What is dermal melanocytosis (historically 'Mongolian spot') and what is its clinical significance?"
    back: "Dermal melanocytosis: congenital grey-blue macules on the lumbosacral area from ectopic dermal melanocytes. Occurs in 99% of Asian and Indigenous infants. Usually fades in early childhood. Must be distinguished from ecchymosis (bruising) to avoid false child abuse allegations.\n\nRecognizing dermal melanocytosis is important to prevent misidentification as non-accidental injury. It is benign and usually resolves by age 4–5 years, but may persist into adulthood."
    difficulty: medium
    tags: [dermatology, dermal melanocytosis, Mongolian spot, neonatal, child abuse differential]
  - front: "How should a febrile infant <28 days old be managed in the ED?"
    back: "Admit all febrile infants <28 days with temperature >38°C. Perform full septic workup: CBC and differential, CRP or procalcitonin, blood C&S, urinalysis + urine C&S, LP (based on risk stratification), ± stool C&S, ± CXR. Treat empirically with broad-spectrum IV antibiotics: ampicillin + ceftazidime or cefepime or cefotaxime (if available) or gentamicin. Add acyclovir or vancomycin when indicated.\n\nNeonates have immature immune systems and cannot localize infection, making them at high risk for serious bacterial infections (SBI) and herpes simplex virus. The full septic workup is mandatory. Ampicillin provides coverage for Listeria and Group B Streptococcus, which are important neonatal pathogens not covered by cephalosporins alone."
    difficulty: hard
    tags: [febrile neonate, neonatal sepsis, ampicillin, empiric antibiotics, pediatric emergency]
