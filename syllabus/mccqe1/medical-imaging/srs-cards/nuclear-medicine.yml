# Nuclear Medicine (Medical Imaging) - generated from srs-mccqe1
cards:
  - front: "What is a reversible vs. persistent defect on nuclear stress test (myocardial perfusion scan)?"
    back: "Reversible defect (present only during stress) = ischemia. Persistent defect (present at rest and stress) = infarction/myocardial scar.\n\nThe test uses Tc-99m sestamibi or tetrofosmin injected at peak exercise. It discriminates between reversible (ischemic) and irreversible (infarcted) changes. Patients with >10% ischemic myocardium benefit most from revascularization."
    difficulty: easy
    tags: [nuclear medicine, cardiology, myocardial perfusion]
  - front: "What is the significance of a 'hot' vs. 'cold' thyroid nodule on scintiscan?"
    back: "Hot (hyperfunctioning) nodules are usually benign (<1% cancer risk, no FNA needed). Cold (hypofunctioning) nodules have 6-10% cancer risk and should be biopsied based on clinical and sonographic features.\n\nHot nodules autonomously produce thyroid hormone and suppress surrounding tissue uptake. Cold nodules don't take up the radiotracer, suggesting they may be non-functional tissue such as a malignancy."
    difficulty: easy
    tags: [nuclear medicine, thyroid, thyroid nodule]
  - front: "What are the V/Q scan findings diagnostic of pulmonary embolism?"
    back: "Unmatched perfusion defects (areas well-ventilated but not perfused). Defects are typically wedge-shaped, extend to the periphery, and are usually bilateral and multiple.\n\nV/Q scan evaluates ventilation-perfusion mismatch. The ventilation scan uses inhaled radionuclide and the perfusion scan uses IV Tc-99m MAA. A modified perfusion-only scan may be used in pregnant patients with a normal CXR."
    difficulty: medium
    tags: [nuclear medicine, pulmonary embolism, V/Q scan]
  - front: "What is the HIDA scan and what findings diagnose cholecystitis?"
    back: "Cholescintigraphy using Tc-99m-disofenin (taken up by hepatocytes, excreted into biliary system). Acute cholecystitis: no gallbladder visualization at 4 hours or 1 hour after morphine. Chronic: no visualization at 1 hour but seen at 4 hours or after morphine.\n\nHIDA scan is indicated when abdominal U/S is equivocal for cholecystitis. A normal scan shows tracer in the gallbladder, common bile duct, and small bowel within 1 hour. Non-visualization indicates cystic duct obstruction, which is the pathophysiology of cholecystitis."
    difficulty: medium
    tags: [nuclear medicine, HIDA scan, cholecystitis]
