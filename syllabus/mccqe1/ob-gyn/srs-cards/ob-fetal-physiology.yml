# Ob Fetal Physiology (ObGyn) - generated from srs-mccqe1
cards:
  - front: "Describe the fetal physiologic response to hypoxia/asphyxia."
    back: "1. Decreased fetal movement, tone, and breathing activities\n2. Anaerobic metabolism → decreased pH\n3. Transient fetal bradycardia → followed by fetal tachycardia\n4. Redistribution of fetal blood flow:\n   - Increased flow: brain, heart, adrenals\n   - Decreased flow: kidneys, lungs, gut, liver, peripheral tissues\n5. Increased fetal blood pressure\n\nThis 'brain-sparing' redistribution of fetal blood flow in hypoxia is a critical adaptive mechanism. The diving reflex analogy helps understand the initial bradycardia. Redistribution away from kidneys leads to oligohydramnios; away from gut leads to gut ischemia and meconium passage. These changes underpin the biophysical profile assessment of fetal well-being."
    difficulty: medium
    tags: [obstetrics, fetal physiology, hypoxia, fetal response, brain sparing]
  - front: "What maternal, uteroplacental, and fetal factors affect fetal oxygenation?"
    back: "**Maternal:**\n- Decreased O₂ carrying capacity (anemia, carboxyhemoglobin)\n- Decreased uterine blood flow (hypotension, regional anesthesia, supine positioning)\n- Chronic conditions (vasculopathies: SLE, T1DM, chronic HTN; APS, cyanotic heart disease, COPD)\n\n**Uteroplacental:**\n- Uterine hypertonus (abruption, tachysystole from oxytocin/prostaglandins)\n- Uteroplacental dysfunction (abruption, infarction, chorioamnionitis, DM, hydrops, post-dates)\n\n**Fetal:**\n- Cord compression (oligohydramnios, cord prolapse, entanglement)\n- Decreased O₂ carrying capacity (isoimmunization, fetomaternal bleed, carboxyhemoglobin)\n\nMultiple factors at maternal, placental, and fetal levels can compromise fetal oxygenation. Understanding these mechanisms guides appropriate monitoring and intervention. Left lateral positioning corrects supine hypotension (aortocaval compression). Tachysystole from oxytocin requires dose reduction or discontinuation."
    difficulty: medium
    tags: [obstetrics, fetal oxygenation, uteroplacental insufficiency, fetal compromise]
