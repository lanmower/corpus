# Fever in Children & Pediatric Infections (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "A 2-month-old presents with fever of 38.5°C rectally. What is the management?"
    back: "Fever ≥38°C in infant <2 months requires full sepsis workup (CBC, blood culture, UA + urine culture, LP) and empiric IV antibiotics (ampicillin + gentamicin ± acyclovir) regardless of clinical appearance\n\nCPS guidelines: fever in neonates (<28 days) and young infants (28-90 days) is a medical emergency. All infants <28 days with fever require hospitalization. 28-60 day infants: risk stratification with Rochester/PECARN criteria. Well-appearing low-risk 2-3 month infants may be managed with observation."
    difficulty: hard
    tags: [fever in infants, neonatal fever, sepsis workup, empiric antibiotics, pediatrics]
  - front: "A 2-year-old has fever 40°C, bulging tympanic membrane, and purulent ear discharge. Diagnosis and treatment?"
    back: "Acute otitis media (AOM); first-line treatment: amoxicillin 90 mg/kg/day (divided TID) x10 days for children <2 years or severe disease — 5-7 days for older children with mild disease\n\nCPS AOM guidelines recommend high-dose amoxicillin as first-line (covers penicillin non-susceptible S. pneumoniae). Watchful waiting for 48-72h acceptable for mild AOM in children ≥6 months with unilateral disease. Amoxicillin-clavulanate for treatment failure or recurrent AOM."
    difficulty: medium
    tags: [acute otitis media, AOM, amoxicillin, fever, pediatrics]
  - front: "What are the most common causes of fever without localizing source in children aged 3-36 months?"
    back: "Occult bacteremia (less common post-PCV13 vaccine era), UTI (most common serious bacterial infection), viral illness (most common overall), pneumonia; S. pneumoniae most common organism in bacteremia\n\nCPS guidelines for fever without source: age 3-36 months with fever ≥39°C — if well-appearing and vaccinated, watchful waiting is appropriate. Urinalysis and urine culture for all febrile girls <2 years and boys <6 months. Blood culture if appearing ill."
    difficulty: medium
    tags: [fever without source, occult bacteremia, UTI, pediatric fever, pediatrics]
  - front: "What clinical features suggest serious bacterial infection (SBI) in a febrile child?"
    back: "High temperature (≥39°C in <3 months or ≥40°C in 3-36 months), toxic appearance (lethargy, poor perfusion, inconsolable irritability), ill-appearing despite antipyretics, petechial/purpuric rash, neck stiffness\n\nNICE traffic-light system: green (low risk), amber (intermediate), red (high risk) features for SBI. CPS guidelines: petechiae + fever = meningococcemia until proven otherwise — give IV ceftriaxone immediately and admit."
    difficulty: medium
    tags: [serious bacterial infection, toxic appearance, meningococcemia, fever assessment, pediatrics]
  - front: "A 3-year-old has fever, sore throat, and a beefy red pharynx with exudates and swollen anterior cervical nodes. Rapid antigen test for Group A Strep is positive. Treatment?"
    back: "Group A Streptococcal pharyngitis; treat with amoxicillin 50 mg/kg/day x10 days (or penicillin V) to prevent rheumatic fever — penicillin/amoxicillin is first-line; azithromycin if penicillin allergy\n\nCPS guidelines: antibiotics for GAS pharyngitis confirmed by rapid antigen test or throat culture. Centor/McIsaac criteria for clinical probability. Treat to prevent acute rheumatic fever (ARF). ARF prevention requires 10 days of penicillin-class antibiotics."
    difficulty: medium
    tags: [GAS pharyngitis, strep throat, amoxicillin, rheumatic fever prevention, pediatrics]
  - front: "What is the management of a 6-year-old with suspected epiglottitis presenting with drooling, dysphagia, and respiratory distress?"
    back: "Do NOT examine throat or agitate child; call anesthesia and ENT immediately; maintain airway in OR with intubation; IV ceftriaxone (H. influenzae type b and S. pneumoniae coverage)\n\nEpiglottitis is rare post-Hib vaccine but still occurs. Classic: sudden onset, high fever, drooling, tripod position, stridor (may not be present). Do NOT attempt to examine oropharynx — may precipitate complete obstruction. Lateral neck X-ray: \"thumbprint sign\" (edematous epiglottis)."
    difficulty: hard
    tags: [epiglottitis, airway emergency, drooling, Hib vaccine, pediatrics]
  - front: "A 5-year-old has a fever, strawberry tongue, diffuse erythematous rash that feels like sandpaper, and desquamation of palms and soles. What is the diagnosis and treatment?"
    back: "Scarlet fever (Group A Streptococcal infection with erythrogenic toxin); treat with amoxicillin or penicillin x10 days\n\nScarlet fever is caused by erythrogenic toxin-producing GAS. Pastia lines (accentuation of rash in skin folds). Sandpaper rash is characteristic. Complications without treatment: ARF, glomerulonephritis. Throat culture or rapid antigen test confirms diagnosis."
    difficulty: medium
    tags: [scarlet fever, GAS, strawberry tongue, sandpaper rash, pediatrics]
  - front: "What are the diagnostic criteria for Kawasaki disease and how is it treated?"
    back: "Fever ≥5 days + ≥4 of 5: bilateral conjunctivitis, mucous membrane changes (strawberry tongue, cracked lips), polymorphous rash, extremity changes (erythema/desquamation), cervical lymphadenopathy; treat with IVIG 2g/kg + ASA\n\nCPS Kawasaki guidelines: treat within 10 days of fever onset. IVIG reduces coronary artery aneurysm from 25% to 3-5%. High-dose ASA for anti-inflammatory effect, then low-dose for antiplatelet effect. Coronary artery imaging (echocardiogram) at diagnosis, 2 weeks, and 6-8 weeks."
    difficulty: hard
    tags: [Kawasaki disease, IVIG, coronary aneurysm, fever, pediatrics]
  - front: "A 9-month-old develops fever then rapid defervescence followed by a rose-colored rash on the trunk. Diagnosis?"
    back: "Roseola infantum (HHV-6); self-limited viral illness — fever 3-5 days, then rash after fever resolves; no specific treatment required\n\nRoseola is caused by HHV-6 (human herpesvirus 6). Most common exanthem in infants 6-24 months. The rash appears as fever resolves — this pattern is diagnostic. Febrile seizures can occur during the high fever phase. HHV-7 also causes roseola. Reassurance and supportive care."
    difficulty: easy
    tags: [roseola, HHV-6, infantum, pediatric viral illness, pediatrics]
  - front: "What is the approach to fever management in pediatrics — when should antipyretics be given?"
    back: "Antipyretics for comfort (not to prevent febrile seizures); acetaminophen 15 mg/kg q4-6h OR ibuprofen 10 mg/kg q6-8h (≥6 months); do NOT use aspirin (Reye syndrome risk)\n\nCPS guidelines: fever is a beneficial host response to infection. Antipyretics improve child comfort but do not reduce febrile seizure risk. Ibuprofen is more effective than acetaminophen for fever reduction. Tepid sponging is not recommended. Never use ASA in children due to Reye syndrome."
    difficulty: easy
    tags: [fever management, acetaminophen, ibuprofen, Reye syndrome, pediatrics]
  - front: "A 4-year-old with high fever and a petechial rash has rapid clinical deterioration with hypotension. What is the diagnosis and immediate treatment?"
    back: "Meningococcemia (Neisseria meningitidis); IV ceftriaxone 100 mg/kg immediately (do not wait for LP), aggressive fluid resuscitation, ICU admission\n\nMeningococcal septicemia is the most dangerous pediatric infection — death within hours. Non-blanching petechiae + fever = meningococcemia until proven otherwise. Give ceftriaxone BEFORE any other investigation if patient is deteriorating. Rifampin or ciprofloxacin prophylaxis for close contacts."
    difficulty: hard
    tags: [meningococcemia, purpura fulminans, ceftriaxone, petechiae, pediatrics]
  - front: "What is the workup and management of UTI in a febrile child under 2 years?"
    back: "Urine sample (catheter or suprapubic for <2 years); UA + culture; treat empiric trimethoprim-sulfamethoxazole (TMP-SMX) or nitrofurantoin — 7-14 days for febrile UTI; renal ultrasound for all first febrile UTIs\n\nCPS UTI guidelines: clean-catch urine is unreliable in infants — use catheter or SPA. Febrile UTI (pyelonephritis) requires 10-14 day treatment. First febrile UTI: renal ultrasound. VCUG (voiding cystourethrogram) for abnormal ultrasound or recurrent UTI to detect VUR."
    difficulty: medium
    tags: [pediatric UTI, urinary tract infection, febrile UTI, renal ultrasound, VCUG, pediatrics]
  - front: "What is hand, foot, and mouth disease (HFMD) and how is it managed?"
    back: "HFMD: Coxsackievirus A16 or Enterovirus 71; painful vesicles on hands, feet, mouth; low-grade fever; self-limited 7-10 days — supportive care, analgesia for mouth pain\n\nHFMD is highly contagious (fecal-oral, droplet). School exclusion until child is well and vesicles have crusted. No vaccine available in Canada. EV71 associated with neurological complications (brainstem encephalitis, pulmonary edema) — more common in Asia."
    difficulty: easy
    tags: [hand foot mouth disease, Coxsackievirus, enterovirus, HFMD, pediatrics]
  - front: "A 10-year-old presents with fever, joint pain/swelling (knee, ankle) that migrated from the ankles to the knees, and a new heart murmur. What is the diagnosis?"
    back: "Acute rheumatic fever (ARF); Jones criteria: 2 major OR 1 major + 2 minor criteria with evidence of prior GAS infection (elevated ASO titer, throat culture)\n\nMajor Jones criteria: carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum, subcutaneous nodules. Minor: fever, elevated ESR/CRP, prolonged PR interval. ARF prevention: treat GAS pharyngitis. Secondary prophylaxis: monthly benzathine penicillin G for 10 years (or until age 25 if carditis)."
    difficulty: hard
    tags: [acute rheumatic fever, ARF, Jones criteria, GAS, carditis, pediatrics]
  - front: "What are the indications for hospitalization of a febrile child?"
    back: "Age <28 days (all), age 28-60 days if not meeting low-risk criteria, toxic appearance, petechiae, signs of sepsis, failed outpatient treatment, immunocompromised, parental inability to monitor\n\nCPS fever guidelines: all neonates (<28 days) with fever require hospitalization. For 28-60 day age group: Rochester/PECARN low-risk criteria must be fully met for outpatient management. Ensure reliable follow-up and parent education for all discharged febrile infants."
    difficulty: medium
    tags: [hospitalization criteria, febrile infant, neonatal fever, age thresholds, pediatrics]
  - front: "What is the management of febrile seizure?"
    back: "Simple febrile seizure (<15min, generalized, single in 24h): reassurance, antipyretics. No antiepileptic drugs needed. Complex: investigate with LP if <12mo or if meningitis suspected\n\nRecurrence risk: 30% overall, higher if age<18mo, lower temp threshold, family history. No increased epilepsy risk for simple FS. EEG and neuroimaging not routinely indicated."
    difficulty: medium
    tags: [febrile seizure, pediatric]
  - front: "What is the approach to fever in infants <3 months (step-by-step)?"
    back: "0-28 days: ALL febrile neonates (>=38°C rectal) need full septic workup (blood culture, urine, LP, CXR if respiratory symptoms) + empiric IV antibiotics (ampicillin + gentamicin or cefotaxime). 29-60 days: septic workup, consider low-risk criteria (Rochester/Philadelphia) for observation. 61-90 days: risk stratify-well-appearing with normal urinalysis may be managed with close follow-up.\n\nSerious bacterial infection (SBI) rate in febrile neonates <28 days is 10-15%, making full workup mandatory. UTI is the most common SBI in febrile infants. CPS guidelines recommend LP for all febrile neonates <30 days. HSV should be considered (acyclovir if risk factors)."
    difficulty: hard
    tags: [febrile infant, neonatal sepsis, workup, pediatrics]
  - front: "What are the Rochester criteria for identifying low-risk febrile infants?"
    back: "Low risk if ALL present: previously healthy term infant, no focal infection on exam, well-appearing, WBC 5,000-15,000, band count <1,500, urinalysis normal (<=10 WBC/HPF), stool <=5 WBC/HPF if diarrhea. Low-risk infants (29-60 days) may be managed as outpatient with close follow-up in 24h.\n\nRochester criteria have 98-99% NPV for SBI. These criteria do NOT apply to neonates <28 days. Canadian practice varies-some centres still admit all febrile infants <60 days. Newer biomarkers (procalcitonin) are being integrated into risk stratification algorithms."
    difficulty: hard
    tags: [Rochester criteria, low-risk febrile infant, risk stratification, pediatrics]
  - front: "What is the management of simple vs complex febrile seizures?"
    back: "Simple: generalized, <15 min, single episode in 24h, age 6mo-5yr. No workup needed (no EEG, no imaging, no LP unless meningitis suspected). Reassurance, fever management education. Complex: focal, >15 min, recurrent in 24h, or age <6 months. Requires investigation: LP (especially if <12mo), consider EEG and MRI.\n\nCPS guidelines state simple febrile seizures do not increase epilepsy risk above baseline (1%). Risk of recurrence: 30% overall, 50% if first seizure <12 months. Antipyretics do NOT prevent febrile seizures. Intermittent diazepam can be considered for recurrent febrile seizures with high parental anxiety."
    difficulty: medium
    tags: [febrile seizure, simple, complex, management, pediatrics]
  - front: "What are the common causes of fever and rash in pediatric patients and their key distinguishing features?"
    back: "Measles: cough/coryza/conjunctivitis, Koplik spots, cephalocaudal maculopapular rash. Roseola (HHV-6): high fever 3-5 days then rash appears as fever breaks. Scarlet fever: sandpaper rash, pastia lines, strawberry tongue, GAS pharyngitis. Varicella: crops of vesicles in different stages. Kawasaki: fever >5 days, conjunctivitis, rash, extremity changes, oral changes, lymphadenopathy.\n\nKawasaki disease is the most important not to miss due to coronary artery aneurysm risk (25% untreated). Treatment with IVIG within 10 days reduces aneurysm risk to <5%. Canadian Paediatric Society guidelines outline diagnostic criteria (fever >=5 days + 4/5 features, or incomplete KD with echo findings)."
    difficulty: hard
    tags: [fever and rash, exanthem, Kawasaki, pediatrics]
  - front: "What is the definition and management of Kawasaki disease?"
    back: "Diagnostic criteria: fever >=5 days + >=4 of 5: bilateral non-exudative conjunctivitis, oral changes (strawberry tongue, cracked lips), polymorphous rash, extremity changes (edema, erythema, desquamation), cervical lymphadenopathy (>=1.5cm unilateral). Treatment: IVIG 2g/kg single dose + high-dose ASA (80-100mg/kg/day until afebrile, then 3-5mg/kg/day for 6-8 weeks).\n\nIncomplete Kawasaki (fever >=5 days + 2-3 criteria) is diagnosed with supporting lab/echo findings. Echocardiogram at diagnosis, 2 weeks, and 6-8 weeks. Coronary aneurysm risk: 25% untreated, <5% with IVIG. CPS guidelines recommend retreatment with IVIG or IV methylprednisolone for IVIG-resistant cases."
    difficulty: hard
    tags: [Kawasaki disease, IVIG, coronary aneurysm, pediatrics]
  - front: "What is the approach to the child with recurrent fever?"
    back: "Differential: periodic fever syndromes (PFAPA: periodic fever, aphthous stomatitis, pharyngitis, adenitis-most common in children), cyclic neutropenia, familial Mediterranean fever, immunodeficiency, occult infections, malignancy. Workup: CBC with differential, ESR, CRP during episodes, genetic testing for autoinflammatory syndromes.\n\nPFAPA is the most common periodic fever syndrome in childhood, with clockwork febrile episodes every 3-6 weeks responding dramatically to single-dose corticosteroids. CPS recommends referral to pediatric rheumatology or immunology for recurrent unexplained fevers."
    difficulty: medium
    tags: [recurrent fever, PFAPA, periodic fever, pediatrics]
  - front: "What are the indications for blood cultures in febrile children?"
    back: "All febrile neonates <28 days. Febrile infants 1-3 months with risk factors. Children with toxic appearance, petechial rash, indwelling lines/devices, immunocompromised, sickle cell disease, unimmunized, prolonged fever >5 days without source, or suspected endocarditis/osteomyelitis.\n\nBlood culture yield in well-appearing febrile children >3 months is low (<2%) and not routinely indicated if immunized. Occult bacteremia has declined dramatically with pneumococcal and Hib conjugate vaccination. Canadian microbiology guidelines recommend appropriate volume collection."
    difficulty: medium
    tags: [blood cultures, febrile child, bacteremia, pediatrics]
  - front: "How does the approach to fever differ in immunocompromised children?"
    back: "Febrile neutropenia (ANC <500 + temp >=38.3°C once or >=38°C sustained 1h): EMERGENCY. Immediate blood cultures (peripheral + central line if present), empiric broad-spectrum antibiotics within 1 hour (piperacillin-tazobactam or cefepime). Do NOT wait for culture results. Add vancomycin if line infection suspected.\n\nFebrile neutropenia carries 5-10% mortality if antibiotics are delayed. Canadian Paediatric Cancer guidelines mandate antibiotic administration within 60 minutes of triage. Fungal coverage (caspofungin or amphotericin) added if fever persists >96h on broad-spectrum antibiotics."
    difficulty: hard
    tags: [febrile neutropenia, immunocompromised, oncology, pediatrics]
  - front: "What is the recommended approach to UTI in febrile infants and children?"
    back: "Febrile infants <2 years with no clear fever source: catheterized urine sample (bag specimens are unreliable). Diagnosis: positive urinalysis (LE, nitrites, pyuria) + positive culture (>50,000 CFU/mL single organism catheter specimen). Treatment: IV antibiotics for toxic/young infants, oral cephalosporin for well-appearing >2 months. Renal ultrasound after first febrile UTI. VCUG for recurrent UTI or abnormal US.\n\nUTI is the most common SBI in febrile infants. CPS guidelines recommend catheterized specimen for diagnosis. E. coli causes 80% of pediatric UTIs. RIVUR trial showed antibiotic prophylaxis reduces recurrence in VUR but with antibiotic resistance concerns. DMSA scan for renal scarring assessment."
    difficulty: hard
    tags: [UTI, febrile infant, urine culture, VCUG, pediatrics]
  - front: "What are the clinical features and management of meningitis in children?"
    back: "Bacterial meningitis: fever, headache, neck stiffness, altered consciousness, petechial rash (meningococcal). Infants: irritability, bulging fontanelle, poor feeding. LP: elevated WBC (PMN predominant), low glucose (<2.2 or <40% serum), elevated protein. Empiric treatment: ceftriaxone + vancomycin (add ampicillin if <3 months for Listeria). Dexamethasone before/with first antibiotics (reduces hearing loss for H. influenzae).\n\nCommon pathogens by age: neonate (GBS, E. coli, Listeria), 1-3mo (GBS, E. coli, S. pneumoniae), >3mo (S. pneumoniae, N. meningitidis). Dexamethasone 0.15mg/kg q6h x 4 days given before or with first dose of antibiotics. CPS guidelines recommend close contacts receive chemoprophylaxis for meningococcal disease."
    difficulty: hard
    tags: [meningitis, CSF analysis, empiric antibiotics, pediatrics]
  - front: "What is the differential diagnosis of prolonged fever (>7 days) in a child?"
    back: "Infection (30%): endocarditis, osteomyelitis, abscess, TB, EBV, CMV, cat-scratch disease. Autoimmune (20%): juvenile idiopathic arthritis (systemic), SLE, Kawasaki, inflammatory bowel disease. Malignancy (10%): leukemia, lymphoma, neuroblastoma. Other: drug fever, factitious.\n\nFever of unknown origin in children (>8 days, no diagnosis after initial workup) is more commonly infectious than in adults. Systemic JIA (Still disease) presents with quotidian fever and salmon-colored evanescent rash. CPS recommends systematic stepwise investigation rather than shotgun approach."
    difficulty: hard
    tags: [prolonged fever, FUO, differential diagnosis, pediatrics]
  - front: "What antipyretic dosing is recommended in children?"
    back: "Acetaminophen: 15 mg/kg/dose q4-6h (max 75 mg/kg/day or 4g/day). Ibuprofen: 10 mg/kg/dose q6-8h (max 40 mg/kg/day), approved for age >=6 months. Do NOT alternate routinely (risk of dosing errors). ASA is CONTRAINDICATED in children (Reye syndrome).\n\nCPS emphasizes that fever itself is not harmful and antipyretics are for comfort, not to normalize temperature. Alternating acetaminophen and ibuprofen is not recommended due to caregiver confusion and dosing errors. Tepid sponge baths are not recommended."
    difficulty: easy
    tags: [antipyretics, acetaminophen, ibuprofen, fever management, pediatrics]
  - front: "What are the key features differentiating viral from bacterial pharyngitis in children?"
    back: "Bacterial (GAS): sudden onset, fever >38.5°C, tonsillar exudates, tender anterior cervical lymphadenopathy, absence of cough. Centor/McIsaac score guides testing. Viral: cough, rhinorrhea, conjunctivitis, hoarseness, diarrhea, oral ulcers. Rapid strep test + throat culture for confirmation.\n\nModified Centor (McIsaac) score: age 3-14 (+1), fever >38°C (+1), no cough (+1), tender anterior cervical nodes (+1), tonsillar exudates (+1). Score >=3: test and treat. Score <3: no testing needed. Canadian guidelines recommend treating confirmed GAS with penicillin V or amoxicillin x 10 days."
    difficulty: medium
    tags: [pharyngitis, GAS, McIsaac score, pediatrics]
  - front: "What is the evaluation and management of a child with petechiae and fever?"
    back: "Petechiae + fever = meningococcemia until proven otherwise. Immediate: IV access, blood cultures, CBC with differential, coagulation studies, empiric IV ceftriaxone. If well-appearing with petechiae above nipple line only (mechanical) and normal labs-may observe. Below nipple line or diffuse petechiae with ill appearance mandates full sepsis workup.\n\nN. meningitidis is the most feared cause. Purpura fulminans indicates DIC and carries high mortality. Canadian public health guidelines require reporting of meningococcal disease and contact tracing with chemoprophylaxis (rifampin, ciprofloxacin, or ceftriaxone)."
    difficulty: hard
    tags: [petechiae, meningococcemia, sepsis, emergency, pediatrics]
  - front: "What are the common causes of cervical lymphadenopathy in children?"
    back: "Reactive (most common): viral URI, EBV, CMV. Bacterial: GAS pharyngitis, Staph/Strep lymphadenitis, cat-scratch (Bartonella). Mycobacterial: TB or non-tuberculous mycobacterial. Malignancy: lymphoma (firm, fixed, supraclavicular, >2cm persistent >4-6 weeks). Autoimmune: Kawasaki, SLE, JIA.\n\nMost pediatric cervical lymphadenopathy is reactive and self-limited. Red flags for malignancy: supraclavicular location, firm/fixed, >2cm, persistent >4-6 weeks, associated B symptoms (weight loss, night sweats). Canadian guidelines recommend observation for 4-6 weeks before biopsy unless red flags present."
    difficulty: medium
    tags: [lymphadenopathy, cervical, differential diagnosis, pediatrics]
  - front: "What are the Rochester criteria for fever without source in neonates?"
    back: "Low risk if ALL: previously healthy term infant, non-toxic appearing, no focal infection, WBC 5-15k, band count <1.5k, normal UA, if diarrhea <5 WBC/hpf in stool\n\nFever in neonate <28 days: full septic workup (blood cx, urine cx, LP) and empiric antibiotics (ampicillin + gentamicin) regardless of appearance. 29-60 days: risk stratify with Rochester/Philadelphia/Boston criteria."
    difficulty: hard
    tags: [neonatal fever, Rochester]
  - front: "What are the diagnostic criteria for Kawasaki disease?"
    back: "Fever >=5 days + >=4 of 5: bilateral conjunctival injection, oral mucosal changes (strawberry tongue), extremity changes (edema/desquamation), polymorphous rash, cervical lymphadenopathy (>=1.5cm)\n\nIncomplete Kawasaki: fever + 2-3 criteria with supportive labs (CRP>=30, ESR>=40). Treatment: IVIG 2g/kg + high-dose ASA within 10 days. Coronary artery aneurysm risk 25% if untreated, <5% with IVIG."
    difficulty: hard
    tags: [Kawasaki, pediatric]
  - front: "A 4-year-old presents with fever, coryza, conjunctivitis, cough, and Koplik spots on the buccal mucosa. Two days later a maculopapular rash starts on the face and spreads cephalocaudally. What is the diagnosis and key complications?"
    back: "Measles (rubeola). The prodrome of the 3 Cs (cough, coryza, conjunctivitis) plus Koplik spots is pathognomonic. Complications: pneumonia (most common cause of death), encephalitis (acute or SSPE years later), otitis media, croup, diarrhea. Vitamin A supplementation reduces morbidity and mortality.\n\nMeasles is a reportable disease in Canada. Two doses of MMR vaccine are recommended by the CPS at 12 months and 18 months (or school entry). Canada has experienced outbreaks in undervaccinated communities. Post-exposure prophylaxis with MMR (within 72 hours) or immunoglobulin (within 6 days) can prevent or modify disease."
    difficulty: easy
    tags: [measles, Koplik-spots, MMR, complications, vitamin-A, CPS]
  - front: "Differentiate varicella, roseola, and hand-foot-mouth disease by rash characteristics and clinical features."
    back: "Varicella (chickenpox): vesicular rash in different stages (macule→papule→vesicle→crust), pruritic, centripetal distribution (trunk > extremities), fever. Roseola (HHV-6): high fever for 3–5 days that breaks, THEN maculopapular rash appears on trunk as fever resolves. Hand-foot-mouth (Coxsackie A16/enterovirus 71): painful oral ulcers plus vesicular lesions on palms, soles, and buttocks; low-grade fever.\n\nVaricella can be prevented with 2 doses of varicella vaccine (CPS schedule: 12–15 months and 4–6 years). Roseola is the classic cause of febrile seizures in infants 6–24 months. Hand-foot-mouth is highly contagious and typically self-limited, but enterovirus 71 can cause severe neurologic complications."
    difficulty: easy
    tags: [varicella, roseola, hand-foot-mouth, viral-exanthems, pediatric-rashes]
  - front: "A 6-year-old develops pharyngitis followed 1–2 days later by a sandpaper-like erythematous rash starting in the groin/axillae, pastia lines, and a strawberry tongue. What is the diagnosis and treatment?"
    back: "Scarlet fever, caused by Group A Streptococcus (GAS) producing erythrogenic toxin. Treatment: penicillin V or amoxicillin for 10 days (or IM penicillin G benzathine single dose). Rash desquamates after 1 week. Treatment prevents acute rheumatic fever.\n\nScarlet fever is essentially strep pharyngitis with a toxin-mediated rash. The CPS recommends treating GAS pharyngitis with antibiotics primarily to prevent acute rheumatic fever. Pastia lines (accentuated rash in skin folds) and circumoral pallor are classic features. Post-streptococcal glomerulonephritis is not prevented by antibiotics."
    difficulty: easy
    tags: [scarlet-fever, GAS, strep-pharyngitis, penicillin, Pastia-lines]
  - front: "A 9-month-old presents with colicky abdominal pain, vomiting, and currant jelly stools. Ultrasound shows a target sign. What is the diagnosis and definitive management?"
    back: "Intussusception (typically ileocolic). Most common in infants 6–36 months. The classic triad is intermittent colicky pain, vomiting, and currant jelly stools (bloody mucus), though the full triad is present in only ~20%. Management: air or hydrostatic (saline) enema reduction under fluoroscopy or ultrasound guidance. Surgery if reduction fails, peritonitis, or perforation.\n\nIntussusception is the most common cause of intestinal obstruction in infants. A lead point (Meckel diverticulum, lymphoma, polyp) should be considered in children >2 years. The CPS notes that recurrence after enema reduction occurs in 5–10% of cases. Post-reduction observation for 24 hours is recommended."
    difficulty: medium
    tags: [intussusception, currant-jelly-stool, target-sign, air-enema, pediatric-emergency]
  - front: "A 4-week-old presents with projectile non-bilious vomiting after feeds, a palpable olive-shaped mass in the right upper quadrant, and a hypochloremic hypokalemic metabolic alkalosis. What is the diagnosis and treatment?"
    back: "Pyloric stenosis (hypertrophic pyloric stenosis). Diagnosed by ultrasound showing pyloric muscle thickness >3 mm and length >15 mm. Treatment: first correct dehydration and electrolyte abnormalities (the alkalosis), then pyloromyotomy (Ramstedt procedure).\n\nPyloric stenosis affects approximately 2–5 per 1000 live births, with a 4:1 male predominance. The metabolic alkalosis results from loss of HCl in vomitus, with renal compensation (paradoxical aciduria). Surgery must wait until electrolytes are corrected, as anesthesia with uncorrected alkalosis risks apnea."
    difficulty: medium
    tags: [pyloric-stenosis, olive-mass, pyloromyotomy, metabolic-alkalosis, non-bilious-vomiting]
  - front: "How does Hirschsprung disease present, and what is the diagnostic workup?"
    back: "Presentation: failure to pass meconium within 48 hours of birth, abdominal distention, bilious vomiting in neonates. In older children: chronic constipation refractory to treatment, failure to thrive, enterocolitis. Diagnosis: contrast enema (transition zone), followed by rectal suction biopsy (gold standard) showing absence of ganglion cells in the submucosal plexus and nerve hypertrophy. Treatment: surgical resection of aganglionic segment (pull-through procedure).\n\nHirschsprung disease affects approximately 1 in 5000 births, with 4:1 male predominance. It is associated with Down syndrome (2–15% of cases) and other neurocristopathies. Hirschsprung-associated enterocolitis (HAEC) is the most serious complication and can be life-threatening, requiring urgent decompression and antibiotics."
    difficulty: medium
    tags: [Hirschsprung, aganglionosis, meconium-delay, rectal-biopsy, pull-through]
  - front: "What is the most common childhood cancer, and what are its typical presenting features?"
    back: "Acute lymphoblastic leukemia (ALL) accounts for ~25% of all childhood cancers and ~75% of childhood leukemias. Presenting features: pallor, fatigue, fever, bruising/petechiae (bone marrow failure), bone/joint pain, hepatosplenomegaly, lymphadenopathy. CBC may show anemia, thrombocytopenia, and leukocytosis or leukopenia with blasts on peripheral smear.\n\nALL peak incidence is 2–5 years of age. Canadian survival rates now exceed 90% with modern multi-agent chemotherapy protocols. Prognostic factors include age (1–10 years favorable), WBC at diagnosis, cytogenetics (hyperdiploidy good, Philadelphia chromosome poor), and minimal residual disease response. The CPS recommends urgent referral for children with unexplained cytopenias."
    difficulty: medium
    tags: [ALL, childhood-cancer, leukemia, bone-marrow-failure, hepatosplenomegaly]
  - front: "Match the following pediatric solid tumors with their classic features: Wilms tumor, neuroblastoma, retinoblastoma."
    back: "Wilms tumor (nephroblastoma): asymptomatic abdominal mass in 3–5 year old, does NOT cross the midline, associated with hemihypertrophy and aniridia (WAGR syndrome). Neuroblastoma: abdominal mass that DOES cross the midline, arises from neural crest (adrenal medulla), elevated catecholamines (VMA/HVA), can present with periorbital ecchymoses (raccoon eyes), opsoclonus-myoclonus. Retinoblastoma: leukocoria (white pupillary reflex), strabismus, associated with RB1 gene mutation (chromosome 13q).\n\nWilms tumor is the most common renal malignancy in children; a key clinical pearl is to avoid palpating the mass aggressively to prevent tumor rupture. Neuroblastoma is unique among pediatric cancers in its ability to spontaneously regress (stage 4S). Retinoblastoma screening relies on the red reflex exam at every well-child visit per CPS recommendations."
    difficulty: medium
    tags: [Wilms-tumor, neuroblastoma, retinoblastoma, pediatric-oncology, leukocoria]
  - front: "How should a neonate (<28 days) with fever >=38.0C be managed?"
    back: "Full septic workup: CBC with differential, blood culture, urinalysis + urine culture (catheter specimen), LP with CSF analysis and culture, chest X-ray if respiratory symptoms. Start empiric IV antibiotics immediately (ampicillin + gentamicin or ampicillin + cefotaxime). Admit to hospital. HSV PCR and acyclovir if any concern for HSV.\n\nCPS guidelines recommend that ALL febrile neonates <28 days undergo full septic workup and empiric IV antibiotics regardless of clinical appearance, as serious bacterial infection (SBI) rate is 10-15%. HSV must be considered especially with vesicles, seizures, elevated LFTs, or maternal history. Never defer LP unless contraindicated."
    difficulty: hard
    tags: [neonatal-fever, septic-workup, empiric-antibiotics, HSV, CPS]
  - front: "What are the Rochester criteria for identifying low-risk febrile infants 0-60 days?"
    back: "Low-risk criteria (ALL must be met): previously healthy full-term infant, non-toxic appearance, no focal bacterial infection on exam, WBC 5,000-15,000, band count <1,500, urinalysis <10 WBC/hpf, stool <5 WBC/hpf (if diarrhea). Low-risk infants have <1% SBI risk but still require close follow-up.\n\nRochester criteria help stratify febrile young infants but do NOT replace clinical judgment. They do not include inflammatory markers (CRP, procalcitonin) which newer protocols incorporate. Canadian practice generally still admits all febrile neonates <28 days regardless of risk stratification. Protocols vary for 29-60 day infants."
    difficulty: hard
    tags: [Rochester-criteria, febrile-infant, low-risk, SBI, risk-stratification]
  - front: "What are the complete and incomplete Kawasaki disease diagnostic criteria?"
    back: "Complete: fever >=5 days PLUS >=4 of: bilateral non-exudative conjunctivitis, oral mucous membrane changes (strawberry tongue, cracked lips), cervical lymphadenopathy (>=1.5 cm, usually unilateral), polymorphous rash, extremity changes (edema, erythema, desquamation). Incomplete: fever >=5 days + 2-3 criteria with supportive lab findings (CRP >=30, ESR >=40).\n\nKawasaki disease is the leading cause of acquired heart disease in children in developed countries. CPS guidelines recommend echocardiography at diagnosis, 2 weeks, and 6-8 weeks. Treatment: IVIG 2 g/kg single dose + high-dose ASA, then low-dose ASA for 6-8 weeks. Coronary artery aneurysm risk is 25% if untreated vs 5% with treatment."
    difficulty: hard
    tags: [Kawasaki, diagnostic-criteria, IVIG, coronary-aneurysm, CPS]
  - front: "What are the serious bacterial infection markers that help guide management in febrile children?"
    back: "Procalcitonin >=0.5 ng/mL (most accurate single marker for SBI), CRP >=40 mg/L, WBC >15,000 or <5,000, absolute neutrophil count >10,000, urinalysis positive, positive blood/urine culture. Clinical signs: toxic appearance, poor perfusion, inconsolability, bulging fontanelle, petechiae.\n\nProcalcitonin is emerging as the most useful biomarker for SBI in Canadian pediatric EDs — it rises earlier than CRP (within 2-4 hours of infection) and is more specific for bacterial infection. Step-by-step protocols (like PECARN febrile infant rule) combining clinical appearance, age, and biomarkers optimize safe management."
    difficulty: medium
    tags: [SBI-markers, procalcitonin, CRP, febrile-child, biomarkers]
  - front: "How does the management approach differ for febrile infants aged 29-60 days vs 61-90 days?"
    back: "29-60 days: full septic workup including LP, empiric IV antibiotics, admission (most Canadian centres). 61-90 days: if well-appearing and low-risk (negative UA, normal inflammatory markers), may observe without LP or antibiotics with reliable follow-up in 24 hours. High-risk features at any age mandate full workup.\n\nRisk of SBI decreases with age: ~10% at 0-28 days, ~5% at 29-60 days, ~3% at 61-90 days. Newer protocols (PECARN, Step-by-Step) use procalcitonin and CRP to safely identify low-risk infants 29-60 days who may be managed without LP. Canadian implementation varies by centre."
    difficulty: hard
    tags: [febrile-infant, age-stratification, LP-decision, PECARN, management]
  - front: "A 4-year-old has fever for 7 days, bilateral conjunctivitis, strawberry tongue, swollen hands, and macular rash. Initial IVIG was given but fever persists at 48 hours. What is next?"
    back: "IVIG-resistant Kawasaki disease. Administer second dose of IVIG 2 g/kg. If still refractory, consider IV methylprednisolone pulse (30 mg/kg x 3 days) or infliximab (5 mg/kg). Continue high-dose ASA until afebrile for 48-72 hours. Urgent cardiology consultation.\n\n10-20% of Kawasaki patients are IVIG-resistant. CPS and AHA guidelines recommend repeat IVIG as first step. Corticosteroids and infliximab are second/third-line options. These patients have higher coronary artery aneurysm risk and require more intensive cardiac follow-up."
    difficulty: hard
    tags: [Kawasaki, IVIG-resistant, infliximab, steroids, refractory]
  - front: "What is the appropriate approach to occult bacteremia in a well-appearing febrile child 3-36 months with no focus of infection?"
    back: "In the post-PCV13 era, occult bacteremia risk is very low (<0.5%). If well-appearing, fully immunized, and temperature <39.0C: no bloodwork needed, symptomatic care, anticipatory guidance, follow-up in 24-48 hours. If >=39.0C or under-immunized: consider CBC, blood culture, urinalysis.\n\nPneumococcal conjugate vaccines have dramatically reduced occult bacteremia rates. Canadian Immunization Guide schedules PCV13 at 2, 4, 12 months. The most common pathogen now is E. coli (from UTI). CPS guidelines emphasize that well-appearing immunized children rarely have bacteremia."
    difficulty: medium
    tags: [occult-bacteremia, PCV13, immunization, febrile-child, UTI]
  - front: "What features of a febrile rash in a child should raise concern for meningococcemia?"
    back: "Petechiae or purpura (especially trunk/lower extremities), rapidly progressive, ill/toxic appearance, fever, tachycardia, hypotension, altered mental status, neck stiffness. Petechiae below the nipple line in a febrile child has high specificity for meningococcemia.\n\nMeningococcal disease can progress from well to critically ill within hours. Canadian guidelines recommend empiric ceftriaxone immediately if suspected, before any investigations. Chemoprophylaxis (ciprofloxacin or rifampin) for close contacts within 24 hours. Public health notification is mandatory in all provinces."
    difficulty: medium
    tags: [meningococcemia, petechiae, purpura, emergent, chemoprophylaxis]
  - front: "When should you suspect urinary tract infection as the source of fever in young children?"
    back: "Consider UTI in any febrile child <2 years without obvious source. Higher risk: female, uncircumcised male <6 months, previous UTI, vesicoureteral reflux, fever >=39C for >48 hours. Diagnosis requires catheter or suprapubic specimen for culture (bag specimens are unreliable for culture).\n\nUTI is the most common SBI in febrile children. CPS and AAP guidelines recommend catheter urine in all febrile infants <2 months and in older febrile children without a source. Renal ultrasound is recommended after first febrile UTI. VCUG is reserved for recurrent UTI, abnormal US, or atypical organisms."
    difficulty: medium
    tags: [UTI, febrile-child, catheter-specimen, renal-ultrasound, diagnosis]
  - front: "What is the differential diagnosis for prolonged fever (>5 days) in a child?"
    back: "Infectious: EBV, CMV, occult abscess, osteomyelitis, endocarditis, TB, cat scratch disease. Autoimmune/inflammatory: Kawasaki disease, juvenile idiopathic arthritis (systemic type), inflammatory bowel disease. Malignancy: leukemia, lymphoma, neuroblastoma. Other: drug fever, factitious fever.\n\nKawasaki disease must be considered in any child with fever >5 days, as delayed diagnosis increases coronary aneurysm risk. Systemic JIA presents with quotidian (daily spiking) fever pattern, salmon-coloured rash, and hepatosplenomegaly. CPS recommends systematic workup including blood smear to exclude malignancy."
    difficulty: medium
    tags: [prolonged-fever, differential-diagnosis, Kawasaki, JIA, malignancy]
  - front: "What is the Modified Glasgow Coma Score (GCS) for infants, and how does the verbal response differ from the adult GCS?"
    back: "Eye opening and motor responses are similar to adult GCS. Verbal response for infants: 5 = coos/babbles, 4 = irritable cry, 3 = cries to pain, 2 = moans to pain, 1 = no response. For children <2 years/non-verbal: 5 = oriented, social, speaks, interacts; 4 = confused/disoriented/consolable; 3 = inappropriate words/not consolable; 2 = incomprehensible/agitated/restless; 1 = no response.\n\nThe modified GCS adapts verbal scoring for preverbal children by using developmentally appropriate behaviors. AVPU (Alert, Verbal, Pain, Unresponsive) has better inter-rater reliability and is preferred for initial mental status assessment in pediatric trauma patients."
    difficulty: medium
    tags: [modified GCS, pediatric emergency, Glasgow Coma Score, infants, AVPU]
  - front: "Compare croup, bacterial tracheitis, and epiglottitis: age, etiology, radiographic findings, and key distinguishing features."
    back: "Croup: age 0.5–4 yr, parainfluenza, steeple sign on X-ray, barky cough, low-grade fever, NOT toxic, usually no intubation needed. Bacterial tracheitis: age 5–10 yr, S. aureus/GAS, exudates in trachea on X-ray, barky cough, high fever, APPEARS TOXIC, requires intubation/ICU + IV antibiotics. Epiglottitis: age 2–8 yr, H. influenzae type b, thumb sign on X-ray, drooling, NO barky cough, high fever, APPEARS TOXIC, no oral exam, immediate anesthesia/ENT call required.\n\nEpiglottitis is now rare due to Hib vaccination. Bacterial tracheitis is the most dangerous cause of croup-like illness and is unresponsive to epinephrine/steroids. The thumb sign (swollen epiglottis on lateral neck X-ray) is pathognomonic for epiglottitis. Never attempt to visualize the oropharynx in suspected epiglottitis outside the OR."
    difficulty: hard
    tags: [croup, epiglottitis, bacterial tracheitis, stridor, pediatric airway, emergency medicine]
  - front: "What are the 4 D's of epiglottitis, and what is the immediate management?"
    back: "4 D's: Drooling, Dyspnea, Dysphagia, Dysphonia + tripod sitting. Management: do NOT examine oropharynx or agitate patient. Immediate anesthesia/ENT call — intubate in OR. Then IV fluids, antibiotics (for H. influenzae), and blood cultures.\n\nAgitation in epiglottitis can cause complete airway obstruction. The safest airway management is controlled intubation in the OR by experienced providers. Heliox may temporize while preparing for definitive airway. Antibiotics target H. influenzae type b (now rare due to Hib vaccine) and cover S. aureus."
    difficulty: medium
    tags: [epiglottitis, 4 Ds, airway emergency, pediatric emergency, Hib]
  - front: "What is the management of bacterial tracheitis in the ED?"
    back: "Airway maintenance — usually requires intubation, ENT consult, and ICU admission. Start broad-spectrum IV antibiotics: ceftriaxone + vancomycin, pending cultures and sensitivities.\n\nBacterial tracheitis (most commonly S. aureus including MRSA) causes pseudomembrane formation in the trachea, leading to severe respiratory distress unresponsive to epinephrine. MRSA coverage with vancomycin is essential. Rigid bronchoscopy may be needed to remove tracheal membranes."
    difficulty: medium
    tags: [bacterial tracheitis, S. aureus, pediatric airway, ceftriaxone, vancomycin]
  - front: "How is a febrile infant aged 28–90 days risk-stratified in the ED?"
    back: "Use validated tools: PECARN, Step-by-Step, or Aronson rule (when procalcitonin is unavailable). High risk for invasive bacterial infection (IBI): full septic workup + antibiotics (ceftriaxone or cefotaxime ± acyclovir/vancomycin). Low risk, normal labs, well-appearing: can defer LP and antibiotics; admit for observation OR discharge with follow-up in 24–48 hours.\n\nRisk stratification tools incorporate clinical appearance, inflammatory markers (WBC, CRP, procalcitonin), and urinalysis to identify infants at low risk for IBI who can be safely observed without lumbar puncture. This reduces unnecessary procedures while maintaining safety."
    difficulty: hard
    tags: [febrile infant, PECARN, risk stratification, invasive bacterial infection, pediatric emergency]
  - front: "What are the Rochester Criteria for identifying serious bacterial infection in febrile infants 28–90 days old?"
    back: "Low risk (previously well): term gestation (≥37 weeks), no prior antibiotics or hospitalizations, no chronic/underlying illness. Normal physical exam: no skin, soft tissue, bone, joint, or ear infection. Normal labs: WBC 5000–15,000, bands <1500, urine <10 WBC/hpf.\n\nThe Rochester Criteria were developed to identify febrile infants who are at low risk for serious bacterial infections and may be safely managed with observation rather than full septic workup. They have been largely replaced by newer tools (PECARN, Step-by-Step) that incorporate biomarkers."
    difficulty: hard
    tags: [Rochester Criteria, febrile infant, serious bacterial infection, pediatric emergency]
  - front: "What distinguishes a typical from an atypical febrile seizure?"
    back: "Typical: duration <5 min, generalized type, occurs once in 24 hours. Atypical: duration >5 min, focal features, occurs >1 time in 24 hours. Febrile seizures occur in children 6 months to 6 years with fever or recent fever, normal neurological exam afterward, no evidence of intracranial infection.\n\nTypical febrile seizures carry an excellent prognosis and require only fever treatment and identification of the fever source. Atypical febrile seizures warrant further investigation (EEG, neuroimaging) and closer follow-up as they carry higher risk of epilepsy. LP should be considered if meningitis cannot be excluded."
    difficulty: medium
    tags: [febrile seizures, typical, atypical, pediatric emergency, neurology]
  - front: "What are the physical exam findings and injury patterns associated with child abuse (non-accidental trauma)?"
    back: "Head injuries (HI): torn frenulum, bilateral black eyes, traumatic hair loss, diffuse severe CNS injury, retinal hemorrhage. Shaken baby syndrome: diffuse brain injury, subdural/SAH, retinal hemorrhage, minimal external trauma, associated bony fractures. Skin: bruises/burns in shape of an object, glove/stocking distribution burns, bruises of various ages, bruises in protected areas. Bones: rib fractures without major trauma, femur fractures <1 yr, spiral fractures in non-ambulatory children, metaphyseal fractures in infants, multiple fractures of various ages, complex/multiple skull fractures.\n\nMetaphyseal 'corner fractures' and posterior rib fractures in infants are highly specific for non-accidental trauma. Injuries inconsistent with developmental stage or caregiver explanation, multiple injuries at different healing stages, and patterned bruising are key red flags."
    difficulty: hard
    tags: [child abuse, non-accidental trauma, shaken baby syndrome, pediatric emergency]
