  - front: "A 65-year-old man asks about PSA testing. Based on 2014 guidelines, what should you discuss?"
    back: "This is outside the recommended age range (55-69) for shared decision-making; age 70+ has strong recommendation against screening with no discussion needed\n\nFor ages 55-69, shared decision-making is recommended. For ages 70+, strong recommendation against PSA screening regardless of patient preference."
    difficulty: hard
    tags: [prostate cancer, screening, PSA, shared decision making, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What laboratory tests are indicated in the workup of gynecomastia?"
    back: "TSH, PRL, LH, FSH, total testosterone, estradiol, LFTs, creatinine, hCG (if elevated, locate primary tumor); ferritin if indicated\n\nThese tests evaluate thyroid, pituitary, testicular, liver, and renal function, plus screen for hormone-producing tumors."
    difficulty: medium
    tags: [endocrinology, gynecomastia, investigations, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the key elements in fever history taking?"
    back: "Peak temperature, thermometer type, measurement site, duration, time of day, response to antipyretics\n\nSystematic history helps identify fever pattern and potential etiology."
    difficulty: easy
    tags: [fever, history, assessment, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "Why is zone III of the liver particularly susceptible to alcohol-induced injury?"
    back: "Zone III (around central veins) is relatively hypoxic compared to zone I (portal tracts), making it more vulnerable to alcohol's metabolic effects\n\nThe relative hypoxia in zone III, combined with alcohol metabolism causing further oxygen stress, makes pericentral hepatocytes particularly susceptible to necrosis and injury."
    difficulty: hard
    tags: [alcoholic-liver-disease, pathophysiology, hepatology, histology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
