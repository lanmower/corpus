  - front: "What should home glucose monitors be calibrated against?"
    back: "Laboratory blood glucose\n\nHome glucose monitors should be calibrated against laboratory blood glucose measurements periodically."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, glucose, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the gestational diabetes screening recommendation?"
    back: "Screen all pregnant individuals between 24-28 weeks gestation\n\nGestational diabetes screening is recommended for all pregnant individuals between 24-28 weeks gestation."
    difficulty: easy
