# Resp Bronchiectasis (Respirology) - generated from srs-mccqe1
cards:
  - front: "What is the definition of bronchiectasis and what are its most common sputum pathogens?"
    back: "Irreversible dilatation of airways due to inflammatory destruction of airway walls resulting from persistently impaired mucous clearance and/or infected mucus; usually affects medium-sized airways. Most common pathogens in non-cystic fibrosis bronchiectasis: Haemophilus influenzae, Pseudomonas aeruginosa, Moraxella catarrhalis, and nontuberculous mycobacterium (NTM).\n\nDistinguishing bronchiectasis from chronic bronchitis can be difficult clinically. HRCT (high-resolution CT) is the gold standard: 'signet ring sign' (bronchus diameter >1.5× accompanying artery) and 'tram tracking' (parallel lines radiating from hilum) are classic findings. CXR shows tram-tracking and cystic spaces."
    difficulty: easy
    tags: [respirology, bronchiectasis, definition, microbiology]
  - front: "What are the causes of bronchiectasis?"
    back: "Obstruction: tumour, foreign body. Post-infectious (dilation of bronchial walls): pneumonia, nontuberculous mycobacterium, measles, pertussis. Impaired defenses/drainage: hypogammaglobulinemia, defective leukocyte function, allergic bronchopulmonary aspergillosis (ABPA), ciliary dysfunction (Kartagener's syndrome: bronchiectasis + sinusitis + situs inversus).\n\nKartagener's syndrome is a form of primary ciliary dyskinesia with autosomal recessive inheritance causing bronchiectasis, chronic sinusitis, and situs inversus. ABPA (hypersensitivity reaction to Aspergillus) causes proximal central bronchiectasis and is associated with asthma and CF. CF is the most common cause of bronchiectasis in young patients."
    difficulty: medium
    tags: [respirology, bronchiectasis, etiology, Kartagener, ABPA]
  - front: "What are the radiological findings in bronchiectasis?"
    back: "CXR: nonspecific (increased markings, linear atelectasis, volume loss) or specific ('tram tracking' — parallel narrow lines radiating from hilum, cystic spaces). HRCT (gold standard, 87–97% sensitivity, 93–100% specificity): 'signet ring sign' — dilated bronchi with thickened walls where diameter of bronchus is >1.5× diameter of accompanying pulmonary artery.\n\nHRCT has replaced bronchography as the gold standard for diagnosing and characterizing bronchiectasis. The signet ring appearance is pathognomonic. Distribution helps identify etiology: upper lobe predominance suggests CF or ABPA; lower lobe predominance suggests traction from ILD; middle lobe/lingula suggests NTM."
    difficulty: medium
    tags: [respirology, bronchiectasis, radiology, HRCT, CXR]
  - front: "What is the treatment approach for bronchiectasis?"
    back: "Vaccination (influenza, pneumococcal). Chest physiotherapy, breathing exercises, physical exercise. Antibiotics: inhaled (chronically to decrease bacterial load in frequent exacerbators, especially if Pseudomonas in sputum); oral/IV for exacerbations driven by sputum sensitivity; macrolides for anti-inflammatory effect and exacerbation reduction. Mucolytics (hypertonic saline). ICS only if concurrent asthma or other indication. Pulmonary resection for focal bronchiectasis. Transplant for end-stage diffuse causes (e.g., primary ciliary dyskinesia, CF).\n\nOral corticosteroids generally have no role unless ABPA is present. Airway clearance (physiotherapy, oscillating devices) is fundamental. Inhaled antibiotics (tobramycin, colistin) are used for chronic suppression in Pseudomonas colonization. Regular sputum cultures guide antibiotic selection."
    difficulty: medium
    tags: [respirology, bronchiectasis, treatment, antibiotics, physiotherapy]
  - front: "What is Kartagener's syndrome and how does it cause bronchiectasis?"
    back: "Kartagener's syndrome is a form of primary ciliary dyskinesia (autosomal recessive) consisting of the triad: bronchiectasis + sinusitis + situs inversus. Ciliary dysfunction leads to impaired mucociliary clearance, resulting in chronic infections and inflammatory destruction of airway walls → bronchiectasis. Ciliary dysfunction also causes abnormal left-right asymmetry determination during embryogenesis → situs inversus.\n\nPrimary ciliary dyskinesia (PCD) causes bronchiectasis, chronic sinusitis, and infertility (immotile sperm). Half of PCD patients have situs inversus (Kartagener's syndrome). Diagnosis: nasal nitric oxide (↓ in PCD) and nasal ciliary biopsy. These patients may require lung transplantation for end-stage disease."
    difficulty: medium
    tags: [respirology, bronchiectasis, Kartagener, primary-ciliary-dyskinesia, situs-inversus]
  - front: "A 28-year-old woman presents with recurrent pneumonia, chronic productive cough with copious purulent sputum, hemoptysis, and chronic sinusitis. HRCT chest shows dilated bronchi with thickened walls and a bronchus-to-artery ratio >1.5. What is the diagnosis, and what initial workup should be performed?"
    back: "Bronchiectasis. Workup: PFTs (typically obstructive), CBC, LFTs, immunoglobulin panel (serum Ig levels), alpha-1 antitrypsin level, immunology panel (ANA, ENAs, RF, HIV), sweat chloride (if CF suspected given upper zone predominance or concomitant features), nasal nitric oxide and ciliary biopsy (if primary ciliary dyskinesia suspected), sputum cultures including AFB (routine and acid-fast bacillus).\n\nThe 'signet ring sign' on HRCT (bronchus diameter >1.5× pulmonary artery) is diagnostic. Workup aims to identify treatable underlying causes: hypogammaglobulinemia, CF, PCD, ABPA. Young female + sinusitis raises primary ciliary dyskinesia. Sweat chloride and genetic testing exclude CF. The most common pathogens are H. influenzae, P. aeruginosa, M. catarrhalis, NTM."
    difficulty: hard
    tags: [respirology, bronchiectasis, diagnosis, case-based, investigations]
