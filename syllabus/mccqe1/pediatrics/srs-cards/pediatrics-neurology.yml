# Pediatrics Neurology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "Define cerebral palsy (CP) and state its incidence."
    back: "CP is a non-progressive central motor impairment syndrome due to CNS anomaly or neural injury occurring at the prenatal, perinatal, or postnatal stage. Incidence: 1.5-2.5 per 1000 live births in industrialized nations.\n\nLife expectancy depends on degree of mobility and intellectual impairment, not on severity of the CNS lesion. CP is classified functionally using the Gross Motor Functional Classification System (GMFCS) with 5 levels. One-third of cases have no identified cause."
    difficulty: easy
    tags: [neurology, cerebral palsy, pediatrics, definition]
  - front: "What are the four types of cerebral palsy, their characteristics, and associated brain areas?"
    back: "1. Spastic (70-80%): ↑tone, ↑reflexes, clonus; UMN pyramidal tract. Subtypes: hemiplegia (MCA stroke), diplegia (periventricular leukomalacia in prematurity), quadriplegia (HIE). 2. Athetoid/Dyskinetic (10-15%): athetosis ± chorea/hypotonia; basal ganglia (kernicterus). 3. Ataxic (<5%): poor coordination, wide-based gait, intention tremor; cerebellum. 4. Mixed (10-15%): >1 motor pattern.\n\nSpastic CP has truncal hypotonia in the first year then upper motor neuron signs emerge. Dyskinetic CP involving the face and tongue causes dysarthria. Ataxic CP is least common. Quadriplegia has the highest rate of intellectual disability due to diffuse HIE involvement."
    difficulty: medium
    tags: [neurology, cerebral palsy, spastic, athetoid, ataxic, pediatrics]
  - front: "What are the prenatal, perinatal, and postnatal causes of cerebral palsy?"
    back: "Prenatal: TORCH infections, maternal disorders (e.g. epilepsy), congenital CNS anomaly, genetic causes. Perinatal: prematurity, LBW, ischemic stroke, hypoxic ischemic encephalopathy (HIE). Postnatal: infections (e.g. meningitis), asphyxia, IVH, trauma, kernicterus. No cause identified in 1/3 of cases.\n\nKernicterus (bilirubin toxicity to basal ganglia) is an important preventable cause of dyskinetic CP. Periventricular leukomalacia (PVL) in premature infants affects the descending motor tracts adjacent to the lateral ventricles, preferentially involving leg fibers and causing spastic diplegia."
    difficulty: easy
    tags: [neurology, cerebral palsy, etiology, HIE, kernicterus, pediatrics]
  - front: "How is spasticity managed in cerebral palsy?"
    back: "Baclofen (oral or intrathecal) for generalized spasticity; botulinum toxin (Botox) injections for focal spasticity. Multidisciplinary services: OT, PT, SLP, school supports. Orthopedic/neurosurgical management for dislocations, contractures, and selective dorsal rhizotomy.\n\nBotulinum toxin reduces focal spasticity by blocking acetylcholine release at neuromuscular junctions; effects last 3-6 months. Intrathecal baclofen via pump is used for severe generalized spasticity unresponsive to oral therapy. Associated problems managed include: constipation (stool softeners), seizures (antiepileptics), and feeding difficulties (gastrostomy)."
    difficulty: medium
    tags: [neurology, cerebral palsy, spasticity, baclofen, botox, management]
  - front: "What are the diagnostic criteria for simple (typical) vs. complex (atypical) febrile seizures?"
    back: "Simple/Typical (70-80%): ALL of — duration <15 min, generalized tonic-clonic, no recurrence in 24h, no neurological impairment before or after. Very small epilepsy risk (~2% vs. 1% general population). Complex/Atypical (20-30%): ANY ONE of — duration >15 min, focal onset or focal features, recurrent seizures (>1 in 24h), previous neurological impairment or neurological deficit after seizure. Increased epilepsy risk.\n\nFebrile seizures affect 3-5% of children (most common cause of seizures in children), peak age 6 months-6 years, M>F. The child must be otherwise neurotypical with no evidence of CNS infection before/after the seizure. Recurrence rate is ~33% (mostly within 1 year, especially if first seizure at age <1 year)."
    difficulty: easy
    tags: [neurology, febrile seizures, simple, complex, pediatrics]
  - front: "What is the management of a simple febrile seizure in a child?"
    back: "Counsel and reassure parents: febrile seizures do not cause brain damage, very small epilepsy risk. Antipyretics and fluids for comfort (do NOT prevent seizures). No prophylaxis with antiepileptic drugs. Treat underlying cause of fever. If high-risk for recurrent/prolonged seizures: prescribe rectal or sublingual lorazepam for home use.\n\nLP is strongly considered if child <6 months, considered if 6-18 months, and only done if meningeal signs present if >18 months. EEG, CT/MRI are NOT warranted unless atypical febrile seizure or abnormal neurologic findings. Septic workup focuses on determining the fever source, not the seizure itself in typical cases."
    difficulty: easy
    tags: [neurology, febrile seizures, management, pediatrics, LP]
  - front: "Differentiate upper motor neuron (UMN) from lower motor neuron (LMN) hypotonia in infants."
    back: "UMN hypotonia (60-80% of hypotonia): increased deep tendon reflexes and clonus, floppy but STRONG, positive Babinski, neonatal reflexes present. LMN hypotonia (15-30%): absent deep tendon reflexes, floppy AND WEAK, negative Babinski, neonatal reflexes absent.\n\n'Floppy and strong' vs. 'floppy and weak' is the key clinical distinction. UMN causes include cerebral (genetic, metabolic, perinatal problems) and spinal cord lesions. LMN causes include motor neuron disease (spinal muscular atrophy), peripheral nerve, neuromuscular junction (myasthenia gravis, botulism), and muscle fiber disorders (muscular dystrophy, myotonic dystrophy)."
    difficulty: medium
    tags: [neurology, hypotonia, UMN, LMN, pediatrics, floppy infant]
  - front: "What are the central vs. peripheral causes of hypotonia (floppy infant syndrome)?"
    back: "Central (60-80%): genetic (Down syndrome, Prader-Willi, Fragile X), metabolic (hypoglycemia, kernicterus), perinatal problems (HIE, ICH), endocrine (hypothyroidism, hypopituitarism), systemic illness (TORCH, sepsis, dehydration), CNS malformations. Peripheral (15-30%): motor neuron (SMA, polio), peripheral nerve (Charcot-Marie-Tooth), NMJ (myasthenia gravis, botulism), muscle fiber (mitochondrial myopathy, muscular dystrophy, myotonic dystrophy).\n\nCauses of hypotonia that respond to rapid treatment (mnemonic PHHHISAD): Prader-Willi, Hypoglycemia, Hydrocephalus, Hypothyroidism, Infection, Seizure, Acidemia, Drugs/toxins. Investigations include electrolytes, ABG, glucose, CK, chromosomal analysis, metabolic testing, EMG, muscle biopsy, and MRI."
    difficulty: medium
    tags: [neurology, hypotonia, floppy infant, SMA, pediatrics, differential]
  - front: "What are the diagnostic criteria for Neurofibromatosis Type 1 (NF-1, von Recklinghausen disease)?"
    back: "Diagnosis requires ≥2 of: (1) >6 café-au-lait spots (>5 mm prepubertal, >1.5 cm postpubertal), (2) ≥2 neurofibromas of any type OR one plexiform neurofibroma, (3) >2 Lisch nodules (iris hamartomas), (4) optic glioma, (5) axillary or inguinal freckling, (6) distinctive bony lesion (sphenoid dysplasia, cortical thinning of long bones), (7) first-degree relative with NF-1.\n\nNF-1: autosomal dominant (50% new mutations), incidence 1:3000, NF1 gene on chromosome 17q11.2 (codes for neurofibromin). Common associations: learning disorders, abnormal speech, seizures. 'In neurocutaneous syndromes, the younger the age of diagnosis, the more severe the manifestation.' Management: regular monitoring (ophthalmology, BP), treat manifestations, genetic counselling."
    difficulty: medium
    tags: [neurology, neurofibromatosis, NF1, cafe-au-lait, Lisch nodules, pediatrics]
  - front: "How does Neurofibromatosis Type 2 (NF-2) differ from NF-1?"
    back: "NF-2: autosomal dominant (>50% new mutations), incidence 1:33,000, NF2 gene on chromosome 22 (codes for merlin protein). Characterized by bilateral vestibular schwannomas. Diagnosed if: bilateral vestibular schwannomas OR first-degree relative with NF-2 PLUS unilateral vestibular schwannoma OR any two of: meningioma, glioma, schwannoma, neurofibroma, posterior subcapsular lenticular opacities.\n\nNF-1 affects peripheral nerves and skin (neurofibromas, café-au-lait spots), while NF-2 predisposes to CNS/spinal tumours with less skin involvement. The hallmark of NF-2 is bilateral vestibular schwannomas causing sensorineural hearing loss. Treatment is monitoring and surgery; no medical treatment alters disease course."
    difficulty: medium
    tags: [neurology, neurofibromatosis, NF2, vestibular schwannoma, pediatrics]
  - front: "What are the characteristics and EEG findings of Infantile Spasms (West Syndrome)?"
    back: "Brief, repeated symmetric flexion/extension contractions of neck, trunk, and extremities lasting 10-30 seconds, occurring in clusters; onset age 4-8 months; associated with developmental delay. EEG shows hypsarrhythmia (high-voltage slow waves, spikes and polyspikes, background disorganization). West Syndrome triad: infantile spasms + developmental arrest/regression + hypsarrhythmia.\n\nInfantile spasms are a pediatric emergency — early identification and treatment prevent developmental regression. 20% have unknown etiology (good treatment response); 80% have metabolic/developmental abnormalities or encephalopathies (poor response). Can evolve into Lennox-Gastaut syndrome. Treatment: corticosteroids, vigabatrin, benzodiazepines."
    difficulty: medium
    tags: [neurology, infantile spasms, West syndrome, hypsarrhythmia, EEG, pediatrics]
  - front: "What is the triad of Lennox-Gastaut Syndrome, and how is it managed?"
    back: "Triad: (1) multiple types of drug-resistant seizures, (2) cognitive dysfunction and behavioural impairment, (3) slow generalized spike-and-wave EEG. Onset: commonly 3-5 years. Management: valproic acid, benzodiazepines, vagal nerve stimulator, ketogenic diet. Prognosis often poor.\n\nLennox-Gastaut is associated with underlying encephalopathy and brain malformations (including evolution from West syndrome). Seizure types include tonic, atonic (drop attacks), absence, and myoclonic. The ketogenic diet (high fat, low carbohydrate) can reduce seizure frequency by up to 50% in drug-resistant cases. Valproic acid is contraindicated with ketogenic diet due to hepatotoxicity risk."
    difficulty: medium
    tags: [neurology, Lennox-Gastaut, epilepsy, drug-resistant, ketogenic diet, pediatrics]
  - front: "What are the key features and management of Juvenile Myoclonic Epilepsy (JME/Janz Syndrome)?"
    back: "Features: myoclonus particularly in the morning; frequently presents as generalized tonic-clonic seizures; adolescent onset (12-16 years); autosomal dominant with variable penetrance. EEG: 3.5-6 Hz irregular spike-and-wave, increased with photic stimulation. Management: lifelong valproic acid treatment; excellent prognosis.\n\nJME is the most common idiopathic generalized epilepsy syndrome. Sleep deprivation and alcohol are common triggers. Despite excellent seizure control with valproic acid, ~90% relapse if medication is discontinued, necessitating lifelong therapy. Valproic acid is teratogenic (neural tube defects) — important consideration in adolescent females."
    difficulty: medium
    tags: [neurology, juvenile myoclonic epilepsy, JME, valproic acid, EEG, pediatrics]
  - front: "What are the features and management of Childhood Absence Epilepsy?"
    back: "Multiple daily absence seizures lasting <30 seconds, without postictal state; may resolve spontaneously or become generalized in adolescence. Peak onset age 6-7 years, F>M, strong genetic predisposition. EEG: 3 Hz spike-and-wave. Management: valproic acid or ethosuximide.\n\nAbsence seizures manifest as sudden brief lapses of consciousness with blank stare; the child resumes activity immediately (no postictal confusion — distinguishes from complex partial seizures). EEG with hyperventilation provocation triggers the characteristic 3 Hz spike-and-wave. Ethosuximide is preferred in pure absence; valproic acid used if generalized tonic-clonic seizures co-occur."
    difficulty: easy
    tags: [neurology, absence epilepsy, childhood epilepsy, EEG, ethosuximide, valproic acid]
  - front: "What is Benign Childhood Epilepsy with Centrotemporal Spikes (BECTS/Rolandic epilepsy), and how is it managed?"
    back: "Focal motor seizures involving tongue, mouth, face, and upper extremity; usually at sleep-wake transitions; remains conscious but aphasic postictally; may secondarily generalize. Onset peaks 5-10 years; 16% of all non-febrile childhood seizures; remits spontaneously in adolescence without sequelae. EEG: repetitive spikes in centrotemporal area, normal background. Management: levetiracetam or carbamazepine for frequent seizures; no medication if infrequent.\n\nBECTS is one of the most common epilepsy syndromes in children and is self-limiting. The hallmark is tonic or clonic activity of perioral muscles with drooling and dysarthria, often awakening the child from sleep. The benign course and spontaneous remission allow a conservative approach with treatment reserved for frequent or disruptive seizures."
    difficulty: medium
    tags: [neurology, BECTS, Rolandic epilepsy, centrotemporal, pediatrics, epilepsy]
  - front: "When should antiepileptic drug (AED) therapy be initiated in children, and when can it be discontinued?"
    back: "Initiation: typically after >2 unprovoked afebrile seizures within 6-12 months; start with one drug appropriate to seizure type, titrate to seizure control before adding a second AED. Discontinuation: after seizure-free period >2 years, then wean over 4-6 months.\n\nIf a first AED fails, switch to another before adding a second drug (polytherapy). Ketogenic diet (high fat) is used for polytherapy-resistant cases or medication refusal; valproic acid is contraindicated with ketogenic diet due to hepatotoxicity risk. Legal obligation exists to report to the Ministry of Transportation if patient wishes to drive."
    difficulty: easy
    tags: [neurology, epilepsy, antiepileptic drugs, treatment, pediatrics]
  - front: "What are the seizure mimics in children?"
    back: "Benign paroxysmal vertigo, breath holding, hypersynchrony, narcolepsy, night terrors, non-epileptic seizure (pseudoseizure), syncope, tics. Cardiac causes (long QT syndrome, hypertrophic cardiomyopathy) are often misdiagnosed as epilepsy — especially when episodes occur during physical activity.\n\nDistinguishing true seizures from mimics requires careful history (EEG and cardiac monitoring when appropriate). Syncope typically has prodromal features (lightheadedness, diaphoresis), rapid recovery, and is triggered by positional change. Breath-holding spells are provoked by upset or pain, involve cyanosis or pallor, and self-resolve. Cardiac causes should be considered when seizures occur during exercise."
    difficulty: medium
    tags: [neurology, seizure mimics, syncope, pediatrics, differential diagnosis]
  - front: "What are the red flag features of headache in children that require urgent investigation?"
    back: "Red flags: first and worst headache of their life, thunderclap onset, focal neurological deficits, papilledema, worse with bending over/coughing/straining (↑ICP), pain that wakes patient from sleep, fatigue, seizures, affecting school attendance, heart problems (long QT, HCM — may be misdiagnosed as epilepsy).\n\nAn unremarkable history and physical exam in a child with recurrent headaches most likely indicates migraine or tension headache. CT or MRI is indicated only if red flags are present. Secondary headache causes include increased ICP (tumor, hydrocephalus, pseudotumor cerebri), meningitis, subarachnoid hemorrhage, and hypertension. Anxiety and life stress (bullying, divorce, abuse) can also cause recurrent headache."
    difficulty: easy
    tags: [neurology, headache, red flags, pediatrics]
