  - front: "What laboratory tests are useful for monitoring alcohol use?"
    back: "GGT, MCV, AST, ALT, CBC, INR\n\nGGT and MCV are sensitive markers. Elevated AST with AST:ALT ratio ~2:1 suggests alcohol use. CBC may show anemia or thrombocytopenia; INR assesses liver synthetic function."
    difficulty: medium
    tags: [alcohol, investigations, laboratory, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When is treatment for bacterial vaginosis (BV) required?"
    back: "Treatment is not required for asymptomatic patients unless high-risk pregnancy, prior IUD insertion, gynecologic surgery, induced abortion, or upper tract instrumentation\n\nBV is caused by overgrowth of Gardnerella vaginalis, Mycoplasma hominis, and anaerobes. Asymptomatic BV does not require treatment but should be treated in certain high-risk obstetric/gynecologic scenarios."
    difficulty: medium
    tags: [gynecology, bacterial vaginosis, STI, indications for treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What did the CHAP trial conclude about treating mild chronic hypertension in pregnancy?"
    back: "Treating mild chronic hypertension (BP <140/90 mmHg) with antihypertensives improved pregnancy outcomes, reducing the primary outcome (preeclampsia, preterm birth, placental abruption, fetal death) from 37% to 30.2%\n\nCHAP showed that treating mild chronic hypertension (traditionally only severe HTN was treated) improves maternal and fetal outcomes."
    difficulty: hard
    tags: [pregnancy, hypertension, clinical trial, CHAP, obstetrics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the five 'P's of sexual history?"
    back: "Partners (numbers, gender), Practices (vaginal, oral, anal insertive/receptive), Protection (pregnancy prevention), Past history of STIs, Pregnancy prevention\n\nThe 5 P's provide a structured approach to obtaining a comprehensive sexual history."
    difficulty: easy
    tags: [STI, sexual-history, clinical-assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is Kussmaul breathing?"
    back: "Deep, labored breathing pattern seen in metabolic acidosis\n\nKussmaul breathing is a compensatory mechanism to expel CO2 and correct metabolic acidosis in DKA."
    difficulty: easy
    tags: [endocrinology, diabetes, DKA, clinical presentation, respirology, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "When should asymptomatic bacterial vaginosis be treated?"
    back: "Treatment is unnecessary unless high-risk pregnancy, prior IUD insertion, gynecologic surgery, induced abortion, or upper tract instrumentation\n\nBV can be a normal vaginal flora variant in asymptomatic patients. Treatment is indicated in specific high-risk scenarios to prevent complications."
    difficulty: hard
    tags: [gynecology, infectious disease, bacterial vaginosis, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What did the CHAP trial find about treating mild chronic hypertension in pregnancy?"
    back: "Treating mild chronic hypertension (BP <140/90mmHg) reduced the primary outcome (preeclampsia, preterm birth, placental abruption, fetal/neonatal death) from 37.0% to 30.2%\n\nThe CHAP trial established that treating mild chronic hypertension in pregnancy improves maternal and fetal outcomes."
    difficulty: hard
    tags: [obstetrics, hypertension, pregnancy, clinical trial, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for herpes during pregnancy with prior infection in the past year?"
    back: "Acyclovir 800mg PO BID x 5 days OR 800mg PO TID x 2 days OR Valacyclovir 500mg PO BID x 3 days OR 1g PO daily x 5 days\n\nSuppressive therapy at 36 weeks is recommended for patients with prior herpes infection to reduce recurrence and viral shedding at delivery."
    difficulty: medium
    tags: [obstetrics, herpes, pregnancy, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What does the 5P's sexual history represent?"
    back: "Partners (numbers, gender), Practices (vaginal, oral, anal), Protection, Past history of STIs, Pregnancy prevention\n\nThe 5P's provides a structured approach to sexual history taking for comprehensive STI assessment."
    difficulty: easy
    tags: [STI, sexual-history, clinical-skills, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "When should bacterial vaginosis be treated?"
    back: "Treat only if symptomatic, unless high-risk pregnancy, prior IUD insertion, gynecologic surgery, induced abortion, or upper tract instrumentation\n\nAsymptomatic BV does not require treatment in most cases. Treatment is indicated in specific high-risk situations to prevent complications."
    difficulty: easy
    tags: [gynecology, bacterial vaginosis, treatment indications, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for first-episode genital herpes during pregnancy?"
    back: "Acyclovir 400 mg PO TID for 7-10 days OR valacyclovir 1 g PO BID for 7-10 days\n\nFirst-episode herpes during pregnancy requires antiviral treatment to reduce viral load and risk of transmission."
    difficulty: easy
    tags: [infectious disease, herpes, pregnancy, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the suppressive therapy regimen for genital herpes in pregnancy at 36 weeks?"
    back: "Acyclovir 400 mg PO TID daily OR valacyclovir 500 mg PO BID daily starting at 36 weeks gestation\n\nSuppressive therapy at 36 weeks reduces viral shedding and risk of neonatal herpes at delivery."
    difficulty: easy
    tags: [infectious disease, herpes, pregnancy, preventive therapy, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What did the CHAP trial demonstrate about treating mild chronic hypertension in pregnancy?"
    back: "Treating mild chronic hypertension (BP 140/90 mmHg) during pregnancy reduced primary outcome (preeclampsia, preterm birth, placental abruption, fetal death) from 37% to 30.2%\n\nCHAP changed practice by supporting treatment of mild (not just severe) hypertension in pregnancy."
    difficulty: medium
    tags: [obstetrics, hypertension, pregnancy, clinical trial, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "When is screening for gestational diabetes recommended?"
    back: "Between 24-28 weeks gestation for all pregnant individuals\n\nUniversal screening for gestational diabetes occurs between 24-28 weeks gestation to identify and manage glucose intolerance in pregnancy."
    difficulty: easy
