# General (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What is the SAD PERSONS scale used for?"
    back: "Suicide risk assessment\n\nSAD PERSONS is a validated scale to assess suicide risk in emergency psychiatric evaluations"
    difficulty: easy
    tags: [psychiatry, suicide, assessment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What medications are used for agitation in psychiatric emergencies?"
    back: "Lorazepam 2mg PO/IM/SL or Olanzapine 5-10mg PO/IM or Haloperidol 5mg PO/IM\n\nOffer medication to patients voluntarily when possible; both benzodiazepines and antipsychotics are effective"
    difficulty: easy
    tags: [psychiatry, agitation, treatment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What assessment scale is used to evaluate suicide risk?"
    back: "SAD PERSONS scale or Columbia-Suicide Severity Rating Scale\n\nThese validated scales help quantify suicide risk by assessing factors like sex, age, depression, previous attempts, organized plan, no social support, and specific suicidal ideation."
    difficulty: easy
    tags: [psychiatry, suicide, assessment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "When is LP indicated in psychiatric presentation?"
    back: "When anti-NMDA receptor encephalitis is suspected\n\nAnti-NMDA receptor encephalitis presents with psychiatric symptoms and requires CSF analysis for diagnosis (anti-NMDA receptor antibodies)."
    difficulty: medium
    tags: [psychiatry, encephalitis, LP, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is a critical safety concern with TCAs?"
    back: "Narrow therapeutic window, lethal in overdose\n\nTCAs are dangerous in overdose due to cardiac toxicity and can be lethal even with relatively small ingestions."
    difficulty: easy
    tags: [psychiatry, pharmacology, TCA, safety, overdose, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the mechanism of action of SNRIs?"
    back: "Block serotonin and norepinephrine reuptake\n\nSNRIs (e.g., venlafaxine, desvenlafaxine) inhibit reuptake of both serotonin and norepinephrine."
    difficulty: easy
    tags: [psychiatry, pharmacology, SNRI, mechanism, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is a major concern with TCAs in overdose?"
    back: "Narrow therapeutic window, lethal in overdose\n\nTCAs have a narrow therapeutic index and can be fatal in relatively small overdoses due to cardiac toxicity."
    difficulty: medium
    tags: [psychiatry, depression, TCA, pharmacology, toxicology, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the major safety concern with TCAs?"
    back: "Narrow therapeutic window, lethal in overdose\n\nTCAs have a narrow therapeutic index, making overdose potentially fatal due to cardiac toxicity and CNS depression."
    difficulty: easy
    tags: [psychiatry, pharmacology, TCA, safety, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
