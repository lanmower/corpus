# General (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What symptoms suggest pyelonephritis as source of fever?"
    back: "Dysuria, foul-smelling urine, incontinence, frequency, hematuria, flank pain\n\nUrinary symptoms with fever may indicate renal involvement requiring urine culture."
    difficulty: medium
    tags: [fever, uti, renal, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What symptoms suggest UTI/pyelonephritis when evaluating fever?"
    back: "Dysuria, foul-smelling urine, incontinence, frequency, hematuria, flank pain\n\nUrinary tract infection symptoms include dysuria, foul odor, incontinence, frequency, hematuria, and flank pain."
    difficulty: easy
    tags: [Fever, UTI, Renal, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "In Wilson's disease, what renal manifestations may occur?"
    back: "Fanconi's syndrome (proximal tubule transport defects) and kidney stones\n\nRenal involvement is due to copper deposition in the kidneys."
    difficulty: medium
    tags: [wilsons disease, renal, fanconi syndrome, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What renal manifestations can occur in Wilson's disease?"
    back: "Fanconi's syndrome (proximal tubule transport defects) and kidney stones\n\nRenal involvement in Wilson's disease results from copper deposition affecting proximal tubular function."
    difficulty: medium
    tags: [Wilsons disease, nephrology, Fanconi syndrome, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the renal manifestations of Wilson's disease?"
    back: "Fanconi's syndrome (proximal tubule transport defects) and renal stones\n\nCopper accumulation damages the renal tubules, causing proximal tubule dysfunction leading to aminoaciduria, glucosuria, and nephrolithiasis."
    difficulty: medium
    tags: [Wilsons disease, nephrology, Fanconi syndrome, renal stones, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What renal complications are associated with Wilson's disease?"
    back: "Fanconi's syndrome (proximal tubule transport defects) and kidney stones\n\nCopper deposition in the kidneys can cause Fanconi's syndrome, a proximal tubule disorder leading to glycosuria, aminoaciduria, phosphaturia, and bicarbonate wasting."
    difficulty: medium
    tags: [wilsons-disease, nephrology, hepatology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is hydronephrosis?"
    back: "Dilation of the renal pelvis, calyces, and ureters caused by obstruction of antegrade urine flow (pelvicaliectasis)\n\nHydronephrosis refers to upper urinary tract dilation and can be caused by mechanical obstruction or functional issues impairing urine flow."
    difficulty: easy
    tags: [hydronephrosis, renal, obstruction, urology, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is post-obstructive diuresis (POD)?"
    back: "Polyuria greater than 3L/24h or greater than 200 cc/h for two consecutive hours following relief of obstructive uropathy\n\nPOD occurs after relieving urinary obstruction and can be physiologic (self-limiting, resolves in 48h) or pathologic (Na+-wasting nephropathy)."
    difficulty: easy
    tags: [post-obstructive diuresis, polyuria, renal, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
