# Public Health Health System (PublicHealth) - generated from srs-mccqe1
cards:
  - front: "What is the difference between quality improvement (QI), quality assurance, quality control, and quality management in healthcare?"
    back: "Quality Improvement (QI): evaluates and improves processes; focuses on systems and systematic causes of variation. Quality Assurance: guarantees quality through improvement and attainment of standards; focuses on performance of individuals/institutions. Quality Control: surveys quality of all factors to maintain standards. Continuous Quality Improvement: ongoing refinement via vigilant review and regular incorporation of improvements. Quality Management: combination of assurance, control, and improvement to maintain consistent quality.\n\nThe Swiss cheese model (James Reason) illustrates that even multiple safety barriers can have gaps, allowing patient harm to occur. QI initiatives (checklists, standardized protocols) reduce system-level errors rather than blaming individuals."
    difficulty: easy
    tags: [quality improvement, quality assurance, patient safety, healthcare systems, QI]
  - front: "What is the Swiss cheese model of error in patient safety?"
    back: "Proposed by James Reason, the Swiss cheese model represents the idea that multiple barriers against failure each have gaps (holes in the cheese). When gaps in multiple layers align, an error can pass through all barriers and result in patient harm. This underpins the systems-based approach to patient safety.\n\nThe Swiss cheese model shifts blame from individuals to systems, promoting a culture of safety. Solutions focus on layering redundant defences (e.g., checklists, double-checks, protocols) to reduce the chance that all holes will align simultaneously."
    difficulty: easy
    tags: [patient safety, Swiss cheese model, James Reason, quality improvement, medical errors]
