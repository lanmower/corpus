    back: "Cost, misleading in hemoglobinopathies/iron deficiency/hemolytic anemia/hepatic/renal disease, altered by ethnicity and aging, not for diagnostic use in children/adolescents/pregnant women/CF/suspected T1DM\n\nHbA1c can be unreliable in various medical conditions and certain populations, requiring a standardized validated assay."
    difficulty: medium
