# Gastroenterology Gerd (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is the role of esophageal manometry in GERD management?"
    back: "Esophageal manometry studies esophageal motility. It is indicated for: (1) non-cardiac chest pain or dysphagia with normal gastroscopy; (2) before surgical fundoplication to ensure intact esophageal function; (3) to exclude alternative diagnoses such as scleroderma and achalasia. It diagnoses abnormalities of peristalsis and/or decreased LES tone, but cannot detect the presence of reflux.\n\nManometry is essential before anti-reflux surgery to confirm adequate peristalsis. Surgical fundoplication is more likely to succeed if lower esophageal pressure is diminished but is less likely to be successful if there is abnormal peristalsis — making pre-operative manometry critical."
    difficulty: medium
    tags: [GERD, esophageal manometry, LES, fundoplication, gastroenterology]
  - front: "What are the only beneficial lifestyle changes for GERD (per evidence)?"
    back: "Only two lifestyle changes have demonstrated benefit: (1) weight loss (if obese or with significant weight gain), and (2) elevating the head of the bed (for nocturnal symptoms). Dietary changes help symptoms but do not treat the underlying disease.\n\nWhile patients are commonly counselled to avoid EtOH, coffee, spices, tomatoes, and citrus juices (which may help symptoms), evidence-based beneficial interventions are limited to weight reduction and positional modifications during sleep."
    difficulty: easy
    tags: [GERD, lifestyle, weight loss, treatment, gastroenterology]
