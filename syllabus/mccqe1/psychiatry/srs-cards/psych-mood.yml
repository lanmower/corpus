  - front: "What is the mechanism of action of SSRIs?"
    back: "Block serotonin reuptake\n\nSSRIs work by inhibiting the reuptake of serotonin at the synaptic cleft, increasing serotonin availability."
    difficulty: easy
    tags: [pharmacology, psychiatry, SSRI, mechanism, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Which SSRI requires a baseline ECG due to QT interval effects?"
    back: "Citalopram\n\nCitalopram can increase QT interval, so a baseline ECG is suggested before starting therapy."
    difficulty: medium
    tags: [pharmacology, SSRI, cardiology, monitoring, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Why is bupropion often chosen for depressed patients?"
    back: "It causes less sexual dysfunction than SSRIs\n\nBupropion's mechanism (dopamine and NE reuptake blockade) results in fewer sexual side effects compared to SSRIs."
    difficulty: easy
    tags: [pharmacology, antidepressant, bupropion, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the recurrence risk of depression after 1, 2, and 3 episodes?"
    back: "50% after 1 episode, 70% after 2 episodes, 90% after 3 episodes\n\nDepression recurrence risk increases substantially with each episode, reaching 90% after 3 episodes."
    difficulty: easy
