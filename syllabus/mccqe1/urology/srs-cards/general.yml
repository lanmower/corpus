# General (Urology) - generated from srs-mccqe1
cards:
  - front: "What is the management of major bladder rupture?"
    back: "Surgical repair\n\nMajor extraperitoneal or intraperitoneal ruptures require operative intervention."
    difficulty: medium
    tags: [bladder rupture, urology, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of posterior urethral injury?"
    back: "Suprapubic cystostomy (avoid catheterization) + surgical repair\n\nCatheterization is contraindicated in posterior urethral injuries."
    difficulty: medium
    tags: [urethra, urology, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is ureteroureterostomy?"
    back: "Surgical connection of one ureter to another (ureter to ureter anastomosis)\n\nA surgical option for ureteral injury repair."
    difficulty: medium
    tags: [ureter, urology, surgery, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of intraperitoneal bladder rupture?"
    back: "Surgical repair\n\nIntraperitoneal bladder ruptures require urgent surgical exploration and repair."
    difficulty: medium
    tags: [bladder rupture, urology, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the recommended PSA screening approach for men ages 55-69 according to 2014 Canadian Task Force guidelines?"
    back: "Recommend NOT screening for prostate cancer with PSA test (weak recommendation); clinicians should discuss risks/benefits with each patient\n\nFor ages 55-69, PSA screening is not routinely recommended; clinicians should discuss the potential small benefit against significant harms (bleeding, infection, incontinence, false positives, overdiagnosis)."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, urology, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What are the layers of the scrotum from superficial to deep?"
    back: "Skin, dartos muscle and fascia, external spermatic fascia, cremasteric fascia, internal spermatic fascia, tunica vaginalis\n\nThe scrotum has 7 layers that must be understood for orchiectomy and hernia repairs. The tunica vaginalis is the deepest layer covering the testicle."
    difficulty: easy
    tags: [urology, anatomy, testicular cancer, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What are risk factors for penile cancer?"
    back: "Chronic inflammatory disease, STI, phimosis, uncircumcised penis\n\nPhimosis and poor hygiene lead to chronic inflammation and increased cancer risk. HPV also plays a role in many cases."
    difficulty: easy
    tags: [urology, oncology, penile cancer, risk factors, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is the lymphatic spread pattern of penile cancer?"
    back: "Superficial/deep inguinal nodes -> iliac nodes. Hematogenous spread is rare.\n\nPenile cancer spreads lymphatically first. Inguinal lymphadenectomy is part of definitive treatment."
    difficulty: medium
    tags: [urology, oncology, penile cancer, metastasis, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is the grading system for varicoceles?"
    back: "Grade 1: palpable only with Valsalva. Grade 2: palpable without Valsalva. Grade 3: visible through scrotal skin.\n\nVaricoceles are graded by physical exam findings. Grade 3 is most severe and often associated with infertility."
    difficulty: easy
    tags: [urology, varicocele, infertility, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What are indications for varicocele treatment?"
    back: "Impaired sperm quality/quantity, pain affecting quality of life, adolescent with affected testis failing to grow, cosmetic reasons\n\nVaricocelectomy can improve fertility outcomes. Treatment is not always required if asymptomatic with normal semen analysis."
    difficulty: medium
    tags: [urology, varicocele, treatment, infertility, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is the time window for testicular torsion salvage?"
    back: "Testicular viability decreases significantly after 5-6 hours. Surgery within 6 hours has best outcomes.\n\nTorsion causes arterial ischemia. After 6 hours, necrosis of testicular tissue occurs. Delayed presentation often leads to orchiectomy."
    difficulty: medium
    tags: [urology, emergency, torsion, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is Peyronie disease?"
    back: "Acquired curvature of the penile shaft due to fibrous thickening of the tunica albuginea\n\nAssociated with DM, vascular disease, Dupuytren contracture, trauma, and erectile dysfunction. Can cause pain with erection."
    difficulty: easy
    tags: [urology, penile disorders, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is the difference between paraphimosis and phimosis?"
    back: "Paraphimosis: foreskin retracted behind glans and cannot be reduced. Phimosis: inability to retract foreskin over glans.\n\nParaphimosis is an emergency due to vascular compromise. Phimosis can be physiologic (90% resolve by age 3) or pathologic."
    difficulty: easy
    tags: [urology, penile disorders, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is the definition of premature ejaculation?"
    back: "Ejaculation occurring before one or both partners desire, with inability to control or delay. Primary: never had control. Secondary: loss of control after period of normal function.\n\nIELT <1 minute is suggestive. Psychological factors are common in primary; medical conditions in secondary."
    difficulty: easy
    tags: [urology, sexual dysfunction, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is the treatment for torsion of the testicular appendix?"
    back: "Analgesia; most resolve in 5-7 days. Surgical exploration and excision if refractory pain.\n\nUnlike testicular torsion, this is not a surgical emergency but exploration may be needed for diagnosis if uncertain."
    difficulty: medium
    tags: [urology, torsion, treatment, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is Bowen disease vs erythroplasia of Queyrat?"
    back: "Both are penile carcinoma in situ. Bowen: crusted red plaques on shaft. Erythroplasia: velvet red, ulcerated plaques on glans.\n\nBoth are pre-invasive SCC of the penis. Erythroplasia on the glans has higher risk of progression to invasive cancer."
    difficulty: medium
    tags: [urology, penile cancer, CIS, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What is the investigation of choice for varicocele?"
    back: "Ultrasound Doppler with Valsalva maneuver to assess reversal of blood flow\n\nUS confirms diagnosis and rules out secondary causes (e.g., renal tumor causing compression). Valsalva increases sensitivity."
    difficulty: easy
    tags: [urology, varicocele, imaging, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What percentage of varicoceles are left-sided and why?"
    back: "90% left-sided due to incompetent valves in the left testicular vein which drains into the left renal vein (higher pressure)\n\nThe left testicular vein drains into the left renal vein at a perpendicular angle, making valvular incompetence more common."
    difficulty: easy
    tags: [urology, varicocele, anatomy, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
