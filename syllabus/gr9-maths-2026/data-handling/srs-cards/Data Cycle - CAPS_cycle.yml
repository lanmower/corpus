# Gr 9 Maths CAPS — data-handling / Data Cycle
deck: "Corpus::Gr9 Maths::Data Cycle"
notes:
  - guid: a1f3c9d2b4e60781
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Data Cycle"
    fields:
      Front: "List the seven stages of the data-handling cycle in order."
      Back: "1. Pose a question\n2. Collect data\n3. Organise data\n4. Represent data\n5. Summarise data\n6. Interpret / analyse data\n7. Report / draw conclusions\n\nMemory: every stage feeds the next — a good question shapes good collection, which shapes everything after it."
    tags: ["data-cycle", "subject:data-handling"]
  - guid: 7b2e4a8c1d9f3056
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Data Cycle"
    fields:
      Front: "Why must the data-handling cycle START with posing a clear question?"
      Back: "The question decides:\n• WHAT data to collect (relevant variables)\n• WHO/WHAT to collect it from (population or sample)\n• HOW to organise and represent it\n\nA vague question (\"Are learners healthy?\") gives messy data. A sharp question (\"How many hours of sleep do Gr 9 learners get on a school night?\") gives data you can actually organise and analyse."
    tags: ["data-cycle", "subject:data-handling"]
  - guid: c4d6e8f0a2b41537
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Data Cycle"
    fields:
      Front: "In the data cycle, what is the difference between 'organise' and 'represent'?"
      Back: "ORGANISE = put raw data into order/groups: tally tables, frequency tables, stem-and-leaf plots, class intervals.\nREPRESENT = turn the organised data into a visual: bar graph, histogram, pie chart, line graph, scatter plot.\n\nOrganise first (numbers/tables), THEN represent (pictures). You cannot draw a good graph from unorganised raw data."
    tags: ["data-cycle", "subject:data-handling"]
  - guid: 9e1a3c5d7f024689
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Data Cycle"
    fields:
      Front: "What happens in the 'summarise' stage of the data cycle?"
      Back: "You calculate numbers that describe the whole data set in a few values:\n• Measures of central tendency: mean, median, mode\n• Measures of dispersion/spread: range, quartiles, interquartile range\n\nThese summary statistics let you compare data sets and spot patterns without listing every value."
    tags: ["data-cycle", "subject:data-handling"]
  - guid: 2f4b6d8a0c1e3957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Data Cycle"
    fields:
      Front: "What is the difference between 'interpret/analyse' and 'report' in the data cycle?"
      Back: "INTERPRET/ANALYSE = make sense of the summaries and graphs: What do they show? Trends? Outliers? Does this answer the original question?\nREPORT = communicate your findings clearly to others — a written conclusion, recommendation, or presentation that ties back to the question you posed at the start.\n\nA report without interpretation is just raw results; interpretation without a report is never shared."
    tags: ["data-cycle", "subject:data-handling"]
  - guid: 8a0c2e4f6b1d3759
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Data Cycle"
    fields:
      Front: "A learner wants to know the favourite sport of Grade 9s. Walk through the full data cycle briefly."
      Back: "1. Question: \"What is the favourite sport of Gr 9 learners at our school?\"\n2. Collect: survey/questionnaire to a sample of Gr 9s\n3. Organise: tally table by sport, then frequency table\n4. Represent: bar graph or pie chart of sports\n5. Summarise: mode = most popular sport; percentages per sport\n6. Analyse: which sport leads, by how much\n7. Report: \"Soccer is the favourite, chosen by 40% of learners.\""
    tags: ["data-cycle", "subject:data-handling"]
  - guid: 5d7f9b1a3c2e4860
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Data Cycle"
    fields:
      Front: "Pitfall: a survey only asked learners leaving the library. Which stage failed and why?"
      Back: "The COLLECT stage failed — the sample is biased. Learners at the library are more likely to enjoy reading/studying, so results won't represent ALL Gr 9 learners.\n\nFix: collect from a random, representative sample across the whole population (not just one location)."
    tags: ["data-cycle", "subject:data-handling"]
