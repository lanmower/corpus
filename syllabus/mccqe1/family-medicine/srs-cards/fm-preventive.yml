# Preventive Medicine & Health Maintenance (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What immunizations are routinely recommended for adults in Canada?"
    back: "Influenza (annual), Td/Tdap (every 10 years), Pneumococcal (PCV20 once, or PCV15+PPSV23 sequence for age ≥65 or high risk), Shingles (Shingrix x2, age ≥50), COVID-19 (updated as recommended), Hepatitis A/B (if not immune), RSV (≥60 years)\n\nNACI adult immunization schedule is updated annually. Shingrix (recombinant zoster vaccine) is >90% effective at preventing shingles — recommended for all adults ≥50 regardless of prior chickenpox. HPV vaccine recommended for adults up to age 45 who were not previously vaccinated."
    difficulty: easy
    tags: [adult immunization, influenza, Tdap, Shingrix, family medicine]
  - front: "What is the recommended approach to cardiovascular risk reduction in primary prevention?"
    back: "10-year Framingham Risk Score or SCORE2; low-risk: lifestyle modification; intermediate risk (10-20%): shared decision-making for statin; high risk (>20%) or established CVD: statin + lifestyle + BP control + aspirin (secondary prevention only)\n\nCCS Dyslipidemia Guidelines: statins reduce CVD events proportional to LDL reduction (~22% reduction per 1 mmol/L LDL drop). CTFPHC recommends aspirin only for secondary prevention — primary prevention aspirin increases bleeding risk without clear net benefit in low-risk patients."
    difficulty: medium
    tags: [CVD prevention, Framingham, statin, primary prevention, family medicine]
  - front: "What lifestyle counseling should be offered to all adult patients?"
    back: "Smoking cessation (most important), physical activity (150 min/week moderate intensity), healthy diet (DASH or Mediterranean), weight management (BMI 18.5-24.9), alcohol reduction (≤10 drinks/week), stress management, sleep hygiene\n\nCTFPHC and CMA: brief counseling for lifestyle modification at every primary care visit. 5 A's model (Ask, Advise, Assess, Assist, Arrange) for smoking cessation. Canadian 24-Hour Movement Guidelines: 150 min moderate-vigorous activity + 2 muscle-strengthening days per week."
    difficulty: easy
    tags: [lifestyle counseling, smoking cessation, physical activity, diet, family medicine]
  - front: "What is the recommended approach to prostate cancer screening in primary care?"
    back: "Individualized decision-making for men 50-70 with PSA: discuss benefits (mortality reduction ~20-30%) and harms (overdiagnosis, overtreatment, impotence, incontinence); CTFPHC recommends against routine PSA screening\n\nCTFPHC recommends against routine PSA screening due to net harm from overdiagnosis and overtreatment. However, patient autonomy allows informed men to choose PSA testing after a thorough discussion. High-risk men (Black men, family history of prostate cancer): earlier screening discussion."
    difficulty: medium
    tags: [prostate cancer screening, PSA, CTFPHC, shared decision-making, family medicine]
  - front: "When should low-dose aspirin be prescribed for primary prevention?"
    back: "Low-dose aspirin (81 mg/day) is NOT recommended for primary prevention of CVD in adults without established CVD due to increased bleeding risk (GI bleeding, hemorrhagic stroke) outweighing modest CV benefit\n\nCTFPHC 2022 guideline: recommends against initiating aspirin for primary prevention in adults ≥60 years. For 40-59 years with ≥10% 10-year CVD risk: individualized decision (marginal net benefit). Aspirin continues for secondary prevention (after MI, stroke, established CAD)."
    difficulty: medium
    tags: [aspirin primary prevention, CTFPHC, cardiovascular, bleeding risk, family medicine]
  - front: "What is the Canadian approach to depression screening in primary care?"
    back: "PHQ-2 (2-question screen) at every appropriate visit; if positive, full PHQ-9; CTFPHC: screening adults ≥18 for depression if there is adequate care available to treat and follow up detected cases\n\nCanadian population health: depression affects 11% of Canadians annually. Collaborative care models (primary care + mental health specialist) improve outcomes. CTFPHC recommends against screening if treatment is not available. Brief intervention (counseling or antidepressants) in primary care is effective."
    difficulty: easy
    tags: [depression screening, PHQ-2, PHQ-9, CTFPHC, family medicine]
  - front: "What is the evidence for health screening in older adults and when should screening be stopped?"
    back: "Screening should only be done when patient would benefit from early detection and treatment; general guideline: stop screening when life expectancy <10 years or when patient would not undergo further investigation or treatment\n\nCTFPHC: de-prescribing of screening in frail elderly is appropriate. Mammogram in a 90-year-old with dementia and life expectancy 2 years: no benefit. Shared decision-making about discontinuing preventive interventions as functional status declines."
    difficulty: medium
    tags: [screening older adults, de-prescribing, life expectancy, frailty, family medicine]
  - front: "What is the Canadian recommendation for universal HIV testing?"
    back: "CTFPHC: HIV testing recommended for all adults 15-65 as part of routine care; universal testing in high-prevalence settings (correctional facilities, addiction programs); annual testing for high-risk individuals\n\nPHAC: 1 in 4 Canadians with HIV is unaware of their status. Universal testing in primary care increases detection. CTFPHC 2019 recommendation: opt-out testing for all adults at least once. HIV testing in pregnancy: universal at first prenatal visit."
    difficulty: easy
    tags: [HIV testing, universal screening, CTFPHC, primary care, family medicine]
  - front: "What are the recommended blood pressure targets and monitoring intervals in primary prevention?"
    back: "All adults: measure at every visit; if normal (<130/80): every 2-3 years; if elevated (130-139/80-89): confirm with AOBP or home BP, lifestyle counseling; if ≥140/90: initiate treatment per Hypertension Canada guidelines\n\nHypertension Canada recommends AOBP as the standard office measurement. BP ≥130/80 with high CVD risk: consider treatment. Hypertension Canada: 90% of Canadians will develop hypertension if they live into their 80s — lifestyle modification throughout life is key."
    difficulty: easy
    tags: [blood pressure monitoring, hypertension prevention, lifestyle, Hypertension Canada, family medicine]
  - front: "What is the recommended approach to fall prevention in older adults?"
    back: "Multifactorial assessment + individualized intervention: exercise (balance and strength), medication review (polypharmacy, benzodiazepines, antihypertensives), vision correction, home hazard reduction, foot care, Vitamin D supplementation\n\nCTFPHC: exercise programs (tai chi, strength/balance training) have the strongest evidence for fall prevention. Vitamin D 800 IU/day reduces falls in deficient elderly. Annual medication review — fall-risk medications (opioids, benzodiazepines, antipsychotics, antihypertensives) should be minimized."
    difficulty: medium
    tags: [fall prevention, older adults, polypharmacy, exercise, family medicine]
  - front: "What is healthy aging and the key preventive measures in adults over 65?"
    back: "Healthy aging: maintaining functional ability; interventions: exercise (150 min/week), protein intake ≥1.2 g/kg, fall prevention, cognitive engagement, social connection, managing chronic diseases, advance care planning, vaccinations (influenza, pneumococcal, shingles, COVID-19)\n\nCPS and CTFPHC healthy aging guidelines: frailty screening (Clinical Frailty Scale) guides approach to treatment. Comprehensive geriatric assessment (CGA) optimizes care for frail elderly. Medication review (Beers Criteria or STOPP/START) essential to identify inappropriate medications."
    difficulty: easy
    tags: [healthy aging, older adults, frailty, CGA, family medicine]
  - front: "What is the CAGE questionnaire and when should it be used in primary care?"
    back: "CAGE: Cut down, Annoyed, Guilty, Eye-opener — 2+ positive = probable alcohol use disorder; use in primary care for alcohol screening in all adult patients at every visit or annual health exam\n\nCAMH recommends integrating alcohol and substance use screening into routine primary care. CAGE has lower sensitivity for hazardous drinking (does not detect it); AUDIT-C preferred for detecting problem drinking spectrum. SBIRT approach: brief intervention after positive screen."
    difficulty: easy
    tags: [CAGE questionnaire, alcohol screening, primary care, SBIRT, family medicine]
  - front: "What are the benefits of physical activity for primary prevention?"
    back: "Physical activity reduces: CVD risk (35%), T2DM risk (50%), colon cancer (25-30%), breast cancer (20-30%), depression and anxiety, cognitive decline, falls in elderly, all-cause mortality (30%)\n\nCSEP (Canadian Society for Exercise Physiology) Canadian 24-Hour Movement Guidelines: 150 min moderate-vigorous activity + 2 strength training sessions per week for adults. Even 15 min/day of brisk walking reduces mortality by 14%. \"Every step counts\" — sedentary time should be minimized."
    difficulty: easy
    tags: [physical activity, primary prevention, CVD, diabetes prevention, family medicine]
  - front: "What is comprehensive geriatric assessment (CGA) and when should it be used?"
    back: "CGA: multidimensional interdisciplinary assessment of functional status (ADLs/IADLs), cognition, mood, social support, medications, nutrition, gait/balance, sensory impairment — indicated for complex elderly patients, before major surgery, on hospital admission\n\nCGA by geriatrician reduces iatrogenic harm, inappropriate medication, functional decline. STOPP (Screening Tool of Older Persons' Prescriptions) and START criteria guide medication review. Frailty assessment using Clinical Frailty Scale (1-9) guides goals of care and treatment intensity."
    difficulty: medium
    tags: [CGA, comprehensive geriatric assessment, frailty, STOPP START, family medicine]
  - front: "What is the approach to smoking cessation counseling in primary care?"
    back: "5 A's: Ask (tobacco use status), Advise (clear advice to quit), Assess (readiness to quit), Assist (prescribe cessation aid — varenicline first-line), Arrange (follow-up within 1 week); 3B's alternative: Brief, Simple, and Directive\n\nCTFPHC: physicians should screen for tobacco use at every visit. Brief advice (30 seconds) increases quit rates. Combined pharmacotherapy + behavioral support doubles success rates. Varenicline 12 weeks of treatment doubles long-term abstinence vs. NRT. Nicotine replacement therapy is available OTC."
    difficulty: easy
    tags: [smoking cessation, 5 As, varenicline, NRT, family medicine]
  - front: "What is included in the periodic health exam for adults?"
    back: "BP screening all adults, BMI, depression screening (PHQ-9), alcohol (AUDIT-C), diabetes risk q3y if >=40, lipids based on FRS, STI screening if risk factors\n\nCTFPHC recommendations vary by age/sex. Annual exam not evidence-based as a package but individual components are. Shared decision-making for cancer screening."
    difficulty: medium
    tags: [periodic exam, preventive]
  - front: "What components make up the Canadian periodic health exam for adults 18-39?"
    back: "BP screening, cervical cancer screening (age 25+), chlamydia/gonorrhea screening if sexually active, mental health assessment, substance use screening, immunization update, contraception counseling\n\nThe periodic health exam is age/sex/risk-stratified. CTFPHC maneuvers guide evidence-based preventive care. Avoid unnecessary routine blood work in low-risk young adults. Focus on lifestyle counseling: diet, exercise, smoking cessation, alcohol."
    difficulty: medium
    tags: [periodic health exam, preventive care]
  - front: "What components make up the periodic health exam for adults 40-74?"
    back: "BP, lipid screening, diabetes (FPG/A1c q3-5y from 40), colorectal Ca (FIT q2y from 50), breast Ca (mammo q2-3y 50-74), cervical Ca (Pap q3y 25-69), lung Ca (LDCT if 30+pack-yr 55-74), AAA (once men 65-80 ever-smoked)\n\nCardiovascular risk assessment using Framingham Risk Score. Statin therapy if 10-year CV risk >20% or >10% with risk-enhancing factors. Osteoporosis screening (FRAX/BMD) for women 65+. Vision/hearing assessment."
    difficulty: medium
    tags: [periodic health exam, screening, preventive]
  - front: "What are the CTFPHC smoking cessation recommendations?"
    back: "Ask about tobacco at every visit. Advise all smokers to quit. Recommend NRT, varenicline, or bupropion. Brief interventions effective. Combine pharmacotherapy + behavioral counseling\n\nVarenicline most effective single agent (OR 2.3 vs placebo). NRT forms: patch, gum, lozenge, inhaler, spray. Bupropion also treats depression. All provinces provide some smoking cessation coverage. E-cigarettes not recommended by CTFPHC."
    difficulty: medium
    tags: [smoking cessation, NRT, varenicline]
  - front: "What are the Canadian cardiovascular disease prevention guidelines for lipid screening?"
    back: "Screen all adults >=40 (or earlier if risk factors). Use FRS for 10-year risk. High risk (>=20%): treat with statin. Moderate (10-19%): consider statin if LDL>3.5. Low (<10%): lifestyle\n\nCCS 2021 lipid guidelines. Alternative: use CLEM score. Primary targets: LDL <2.0 or >50% reduction for high risk. ApoB <0.8. Non-HDL <2.6. Consider ASCVD risk enhancers: family history, South Asian ethnicity, CKD, inflammatory disease."
    difficulty: medium
    tags: [lipid screening, cardiovascular prevention, statin]
  - front: "What are the Canadian guidelines for alcohol screening and brief intervention?"
    back: "Screen with AUDIT-C or CAGE. Canada Low-Risk Alcohol Drinking Guidelines (2023 update): no safe amount; <=2 drinks/wk low risk, 3-6 moderate, >=7 increasingly high risk\n\n2023 CCSA guidance significantly reduced recommended limits from previous 10F/15M per week. Brief intervention (FRAMES: Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy) reduces consumption. Screen for alcohol use disorder with DSM-5 criteria (>=2 of 11 criteria)."
    difficulty: medium
    tags: [alcohol, screening, AUDIT, brief intervention]
  - front: "What are the osteoporosis screening guidelines in Canada?"
    back: "FRAX or CAROC assessment for all >=50 with risk factors. BMD (DXA) for: all women >=65, men >=70, postmenopausal women or men >=50 with risk factors. T-score <=-2.5 = osteoporosis\n\nOsteoporosis Canada 2010 guidelines. 10-year fracture risk: low <10%, moderate 10-20%, high >20%. Treat high risk. Moderate: consider if additional risk factors. Vertebral fracture assessment adds to DXA. Calcium 1000-1200mg + Vit D 800-2000 IU daily for all >=50."
    difficulty: medium
    tags: [osteoporosis, screening, DXA, FRAX]
  - front: "What are the Canadian Hypertension Education Program (now Hypertension Canada) BP targets?"
    back: "General: <140/90. Diabetes: <130/80. High-risk (CKD, CV disease): <120 systolic considered. Office BP >=130/85 warrants out-of-office measurement (ABPM or HBPM)\n\nHypertension Canada 2020. Diagnosis requires elevated BP on 2+ visits or ABPM/HBPM confirmation. First-line: thiazide, ACEi/ARB, long-acting CCB, or combination. Lifestyle: DASH diet, sodium <2000mg/d, exercise 30-60min 4-7d/wk, limit alcohol, maintain healthy weight."
    difficulty: medium
    tags: [hypertension, BP targets, Hypertension Canada]
  - front: "What immunizations should be discussed at each periodic health exam?"
    back: "Influenza annually. Tdap/Td q10y. Pneumococcal >=65. Shingrix >=50. HPV catch-up <=26. HepB if not immunized. COVID per NACI. Travel vaccines as needed\n\nPregnancy: Tdap each pregnancy 27-32wk, influenza. Immunocompromised: avoid live vaccines. Catch-up schedules available at CANImmunize.ca. Provincial coverage varies. Document and maintain immunization records."
    difficulty: medium
    tags: [immunization, preventive care]
  - front: "What are the recommendations for physical activity counseling in primary care?"
    back: "Canadian 24-Hour Movement Guidelines: 150 min/wk moderate-vigorous aerobic + 2 days strength. Reduce sedentary time. Brief exercise prescription (FITT: Frequency, Intensity, Time, Type)\n\nExercise is medicine. Benefits: 30% reduction all-cause mortality, improves depression, CV risk, diabetes control, bone health. Even 15 min/day provides benefit. Assess readiness to change (transtheoretical model). Address barriers."
    difficulty: easy
    tags: [physical activity, exercise, preventive]
  - front: "What are the Canadian guidelines for skin cancer prevention?"
    back: "Sun protection counseling for all. No population-based skin cancer screening recommended by CTFPHC. Clinical skin examination for high-risk individuals (FHx melanoma, >50 nevi, fair skin, prior skin cancer)\n\nCanadian Dermatology Association recommends sun protection. SPF 30+ broad-spectrum, reapply q2h. Avoid tanning beds. Educate on ABCDE for self-monitoring. Dermoscopy improves diagnostic accuracy in primary care."
    difficulty: easy
    tags: [skin cancer, sun protection, prevention]
  - front: "What are the indications for ASA for primary cardiovascular prevention?"
    back: "CTFPHC 2019: do NOT recommend ASA for primary prevention in most adults. May consider in high CV risk (10-year >20%) ages 40-70 if low bleeding risk, after shared decision-making\n\nDiffers from previous recommendations. ASPREE, ARRIVE, ASCEND trials showed harms (bleeding) outweigh benefits for most. Secondary prevention: ASA 81mg remains indicated post-ACS/stroke. Consider clopidogrel if ASA-intolerant."
    difficulty: medium
    tags: [ASA, primary prevention, cardiovascular]
  - front: "What are the elements of anticipatory guidance for new parents?"
    back: "Safe sleep (back to sleep, firm surface, no bedsharing), breastfeeding support, immunization schedule, car seat safety, injury prevention, postpartum depression screening, contraception\n\nCPS Well-Baby Visit schedule: 1-2wk, 1mo, 2mo, 4mo, 6mo, 9mo, 12mo, 15mo, 18mo, then annually. Rourke Baby Record is Canadian standardized tool for well-child visits. Screen maternal mental health at each visit."
    difficulty: easy
    tags: [anticipatory guidance, well-child, parenting]
  - front: "What is the approach to STI screening in primary care?"
    back: "Screen sexually active <25 and high-risk for chlamydia/gonorrhea (urine NAAT). HIV screening offered to all. Syphilis in MSM, endemic exposure, pregnancy. HBV/HCV in high-risk\n\nCanadian STI Guidelines (PHAC). Chlamydia: azithromycin 1g PO or doxycycline 100mg BID x 7d. Gonorrhea: ceftriaxone 250mg IM + azithromycin 1g. Report gonorrhea/syphilis to public health. Partner notification mandatory."
    difficulty: medium
    tags: [STI, screening, chlamydia, gonorrhea]
  - front: "What are the key elements of the well-child visit in Canada?"
    back: "Growth/development monitoring (Rourke Baby Record/Nipissing), immunizations per schedule, nutrition counseling, injury prevention, vision/hearing screening, dental health, family assessment, maternal mental health\n\nDevelopmental screening at 18-24 months with validated tool (M-CHAT for autism). Milestone monitoring at every visit. Anemia screening (CBC) at 9-12 months in high-risk. Lead screening if risk factors."
    difficulty: medium
    tags: [well-child, Rourke, developmental screening]
  - front: "What cancer screening is recommended for patients with strong family history?"
    back: "Breast: start 10y before youngest affected relative, consider MRI if BRCA. Colon: colonoscopy from 40 or 10y before youngest case, q5y. Consider genetic referral for: >=2 first-degree relatives, young onset, Lynch/BRCA patterns\n\nHigh-risk screening protocols differ from average-risk CTFPHC guidelines. Genetic counseling and testing criteria: multiple affected relatives, young onset (<50), associated cancers (Lynch: colon+endometrial+ovarian). Provincial genetics programs provide assessment."
    difficulty: hard
    tags: [familial cancer, genetic screening, high-risk]
  - front: "What is the PDSA cycle in quality improvement?"
    back: "Plan (identify problem, develop intervention), Do (implement small-scale test), Study (analyze results), Act (adopt, adapt, or abandon). Iterative rapid-cycle improvement\n\nQI methodology. Root cause analysis for sentinel events. Swiss cheese model: multiple system failures align to cause harm. Incident reporting systems are non-punitive to encourage disclosure."
    difficulty: medium
    tags: [QI, PDSA]
  - front: "What is motivational interviewing and its core principles?"
    back: "Patient-centred counselling to elicit behaviour change. OARS: Open questions, Affirmations, Reflections, Summaries. Express empathy, develop discrepancy, roll with resistance, support self-efficacy\n\nEffective for: substance use, smoking cessation, diet/exercise, medication adherence. Avoids confrontation. Change talk (patient's own reasons for change) is more effective than provider advice."
    difficulty: medium
    tags: [communication, motivational interviewing]
  - front: "What are the key patient safety practices to prevent healthcare-associated infections?"
    back: "Hand hygiene (WHO 5 moments), surgical safety checklist, antimicrobial stewardship, C. diff prevention (avoid unnecessary PPIs/antibiotics), MRSA/VRE screening and contact precautions\n\nHAIs affect ~8% of hospitalized Canadians. Central line bundles reduce CLABSI. Ventilator bundles reduce VAP. Medication reconciliation at transitions prevents adverse drug events."
    difficulty: medium
    tags: [patient safety, infection prevention]
  - front: "What is the Swiss cheese model of accident causation, and how does it apply to healthcare?"
    back: "James Reason's Swiss cheese model posits that adverse events result from multiple system failures aligned simultaneously (holes in multiple slices of cheese). Each slice represents a defence layer (training, protocols, checklists, technology). An error reaches the patient only when holes in all layers align. It shifts focus from individual blame to system-level defences.\n\nThe Swiss cheese model is foundational to patient safety science and is endorsed by Healthcare Excellence Canada (formerly CPSI). It underpins root cause analysis methodology used in Canadian hospitals. The model explains why redundant safety systems (e.g., double-checks for high-alert medications, surgical checklists) are essential."
    difficulty: easy
    tags: [Swiss-cheese-model, patient-safety, systems-thinking, James-Reason, QI]
  - front: "What is root cause analysis (RCA), and what are the key steps?"
    back: "RCA is a structured method for investigating adverse events to identify underlying system causes. Steps include: (1) Identify the event, (2) Assemble a multidisciplinary team, (3) Map the sequence of events (timeline), (4) Identify contributing factors using tools like fishbone diagrams, (5) Determine root causes (system-level, not individual blame), (6) Develop and implement corrective actions, (7) Monitor effectiveness.\n\nRCA is required by Accreditation Canada after sentinel events. Healthcare Excellence Canada provides frameworks and training. Key principle: root causes are always system-level (e.g., inadequate staffing, poor design, missing protocols), not just individual errors. The 'Five Whys' technique helps drill down from proximate to root causes."
    difficulty: medium
    tags: [root-cause-analysis, patient-safety, adverse-events, QI, systems-thinking]
  - front: "Describe the Plan-Do-Study-Act (PDSA) cycle and how it is applied in healthcare quality improvement."
    back: "PDSA is an iterative QI method: Plan (identify the problem, develop a hypothesis and plan a small test of change), Do (implement the test on a small scale), Study (analyze results, compare to predictions), Act (adopt, adapt, or abandon the change based on results). Multiple rapid cycles allow progressive refinement before large-scale implementation.\n\nPDSA is the core method of the Institute for Healthcare Improvement's Model for Improvement, widely used in Canadian healthcare. Key principle: start small and iterate rapidly rather than attempting large-scale change. Canadian teaching hospitals use PDSA cycles for residency QI projects, and the Royal College requires QI competency in all residency programs."
    difficulty: medium
    tags: [PDSA, quality-improvement, IHI, patient-safety, change-management]
  - front: "What is medication reconciliation, and when should it be performed?"
    back: "Medication reconciliation is the process of creating an accurate, complete list of a patient's current medications and comparing it to medication orders at every transition of care (admission, transfer, discharge). Discrepancies are identified and resolved with the prescriber. It is a Required Organizational Practice (ROP) by Accreditation Canada.\n\nMedication discrepancies occur in up to 70% of hospital admissions. Accreditation Canada mandates medication reconciliation at admission and discharge as a Required Organizational Practice. ISMP Canada (Institute for Safe Medication Practices) provides tools and best practices. Pharmacist-led medication reconciliation has been shown to reduce adverse drug events."
    difficulty: easy
    tags: [medication-reconciliation, patient-safety, transitions-of-care, Accreditation-Canada, ISMP]
  - front: "Which medications are classified as 'high-alert' by ISMP Canada, and what safety strategies apply to them?"
    back: "High-alert medications include: insulin, opioids, anticoagulants (heparin, warfarin, DOACs), concentrated electrolytes (KCl, NaCl >0.9%), neuromuscular blocking agents, chemotherapy agents, and look-alike/sound-alike drugs. Strategies include: independent double-checks, tall man lettering, limited access, standardized concentrations, clinical decision support, and removal of concentrated electrolytes from patient care areas.\n\nISMP Canada maintains and updates the high-alert medication list for Canadian institutions. These medications carry a heightened risk of significant patient harm when used in error. Accreditation Canada requires organizations to implement safeguards specifically for high-alert medications as a Required Organizational Practice."
    difficulty: medium
    tags: [high-alert-medications, ISMP-Canada, patient-safety, medication-safety, QI]
  - front: "What are the three phases of the Surgical Safety Checklist, and what is verified during each?"
    back: "Based on the WHO Surgical Safety Checklist (adapted in Canada): (1) Sign In (before anesthesia): patient identity, procedure, site marking, consent, allergy/airway assessment, blood loss risk. (2) Time Out (before incision): team introductions, confirmation of patient/procedure/site, anticipated critical events, antibiotic prophylaxis, imaging displayed. (3) Sign Out (before patient leaves OR): procedure name confirmed, instrument/sponge count, specimen labelling, equipment concerns, key recovery plan.\n\nThe Surgical Safety Checklist was pioneered by the WHO and championed in Canada by Dr. Atul Gawande's Safe Surgery Saves Lives initiative. Implementation in Ontario hospitals was associated with a significant reduction in surgical mortality. It is a Required Organizational Practice by Accreditation Canada for all procedural settings."
    difficulty: medium
    tags: [surgical-safety-checklist, WHO, time-out, patient-safety, Accreditation-Canada]
  - front: "Define and distinguish: sentinel event, adverse event, near miss, and no-harm incident."
    back: "Sentinel event: an unexpected occurrence involving death or serious physical/psychological injury (e.g., wrong-site surgery). Adverse event: an event that results in unintended harm to the patient related to healthcare (not the disease process). Near miss: an event that could have caused harm but was intercepted before reaching the patient. No-harm incident: an event that reached the patient but did not cause detectable harm.\n\nThe Canadian Incident Analysis Framework (Healthcare Excellence Canada) uses these standardized definitions. Reporting all incident types, including near misses, is essential for proactive safety improvement. The Canadian Adverse Events Study (2004) found that 7.5% of hospital admissions were associated with an adverse event, with 37% judged preventable."
    difficulty: medium
    tags: [sentinel-event, adverse-event, near-miss, incident-reporting, patient-safety]
  - front: "A hospital ward experiences a cluster of Clostridioides difficile (C. diff) infections. What infection prevention and control measures should be implemented?"
    back: "Contact precautions (gown and gloves), hand hygiene with soap and water (alcohol-based hand rub is ineffective against C. diff spores), enhanced environmental cleaning with sporicidal agents (e.g., bleach-based), antimicrobial stewardship (reduce unnecessary fluoroquinolone and cephalosporin use), patient isolation or cohorting, and notification to infection control and public health.\n\nC. diff is the most common healthcare-associated infection in Canadian hospitals. Provincial mandatory reporting exists in several provinces (e.g., Ontario's mandatory C. diff surveillance). Antimicrobial stewardship targeting high-risk antibiotics (fluoroquinolones, clindamycin, cephalosporins) is a key prevention strategy endorsed by AMMI Canada."
    difficulty: medium
    tags: [C-diff, infection-control, hand-hygiene, antimicrobial-stewardship, HAI]
  - front: "What are the key differences in infection control precautions for MRSA versus VRE in a Canadian hospital?"
    back: "Both require contact precautions (gown, gloves, dedicated equipment). MRSA screening often includes nasal swabs; VRE screening uses rectal/perianal swabs. MRSA decolonization may be attempted (mupirocin nasal ointment + chlorhexidine bathing). VRE decolonization is generally not recommended. Both require enhanced environmental cleaning. Alcohol-based hand rub is effective for both (unlike C. diff).\n\nMRSA and VRE are major antimicrobial-resistant organisms (AROs) tracked by the Canadian Nosocomial Infection Surveillance Program (CNISP). Provincial Infectious Diseases Advisory Committee (PIDAC) guidelines in Ontario provide standardized ARO management protocols. Active surveillance screening on admission is recommended for high-risk patients in many Canadian facilities."
    difficulty: hard
    tags: [MRSA, VRE, infection-control, ARO, contact-precautions, HAI]
  - front: "What is an antimicrobial stewardship program, and what are its core strategies?"
    back: "Antimicrobial stewardship programs (ASPs) optimize antimicrobial use to improve patient outcomes, reduce adverse effects, and limit antimicrobial resistance. Core strategies include: prospective audit and feedback, formulary restriction and preauthorization, de-escalation protocols, IV-to-oral conversion, dose optimization, clinical practice guidelines, and education. ASPs are a Required Organizational Practice by Accreditation Canada.\n\nAMMI Canada (Association of Medical Microbiology and Infectious Disease) and the Public Health Agency of Canada support antimicrobial stewardship as essential to combating antimicrobial resistance. Canada's Pan-Canadian Action Plan on Antimicrobial Resistance identifies stewardship as a key pillar. The MCCQE1 may test appropriate antibiotic use scenarios."
    difficulty: medium
    tags: [antimicrobial-stewardship, antibiotic-resistance, AMMI-Canada, Accreditation-Canada, patient-safety]
  - front: "What is the 5A's approach to smoking cessation?"
    back: "Ask (smoking status), Advise (quit), Assess (readiness), Assist (pharmacotherapy + counselling), Arrange (follow-up). Pharmacotherapy: NRT, varenicline (most effective), bupropion\n\nVarenicline: partial nicotinic agonist, 3x quit rate vs placebo. NRT: patch + short-acting (gum/lozenge/inhaler). Combination NRT as effective as varenicline. E-cigarettes: not recommended by Health Canada for cessation."
    difficulty: medium
    tags: [smoking cessation, 5As]
  - front: "What are the criteria for bariatric surgery in Canada?"
    back: "BMI >=40 OR BMI >=35 with obesity-related comorbidity (T2DM, HTN, OSA, NAFLD). Failed adequate trial of non-surgical management. Multidisciplinary assessment required\n\nRoux-en-Y gastric bypass and sleeve gastrectomy most common. Benefits: sustained weight loss, T2DM remission (60-80%), reduced CV mortality. Risks: nutritional deficiencies (B12, iron, calcium), dumping syndrome."
    difficulty: medium
    tags: [bariatric surgery, obesity]
  - front: "What is the Canadian well-child visit schedule and what anticipatory guidance topics are discussed at key ages?"
    back: "Schedule: 1-2 weeks, 2 months, 4 months, 6 months, 9 months, 12 months, 15 months, 18 months, 2-3 years, then annually. Key anticipatory guidance: Newborn: breastfeeding support, safe sleep (ABCs — alone/back/crib), jaundice monitoring, vitamin D 400 IU/day. 2-6 months: tummy time, immunizations, car seat rear-facing. 6-12 months: introduction of solids (iron-rich foods first), dental care, choking hazards. 12-18 months: language development, limit screen time, switch to whole milk. 2-5 years: toilet training, social skills, dental visits, booster vaccines. School age: bullying, physical activity (60 min/day), nutrition.\n\nThe Rourke Baby Record (RBR) is the standard Canadian well-child visit guide used across most provinces, providing age-specific screening and guidance recommendations. CPS (Canadian Paediatric Society) recommends zero screen time for children <2 years and <1 hour/day for ages 2-5."
    difficulty: medium
    tags: [well-child visits, anticipatory guidance, Rourke Baby Record, family medicine, pediatrics]
  - front: "What are the current Canadian screening recommendations for cervical, breast, colorectal, and lung cancer?"
    back: "Cervical: ages 25-69, Pap q3yr (some provinces transitioning to HPV primary screening q5yr); discontinue at 70 if 3 consecutive negative results. Breast: ages 50-74, mammography q2-3yr (CTFPHC — no routine screening 40-49; however, some provinces offer it); shared decision-making 40-49. Colorectal: ages 50-74, FIT (fecal immunochemical test) q2yr or flexible sigmoidoscopy q10yr; high-risk: colonoscopy. Lung: ages 50-74 with ≥20 pack-year smoking history (current or quit <15yr), low-dose CT annually. Not recommended: routine PSA screening (shared decision-making).\n\nCTFPHC (Canadian Task Force on Preventive Health Care) provides evidence-based screening guidelines. The breast cancer screening age recommendation is controversial — CTFPHC says 50+, but many provinces and advocacy groups recommend starting at 40 (Ontario expanded to 40 in 2024). FIT has replaced guaiac FOBT as the preferred stool test for CRC screening."
    difficulty: medium
    tags: [cancer screening, CTFPHC, mammography, cervical screening, FIT, family medicine]
  - front: "What additional periodic health screening is recommended for Canadian adults beyond cancer screening?"
    back: "Osteoporosis: DXA scan for women ≥65 and men ≥70 (earlier if risk factors — FRAX assessment); Diabetes: FPG or A1C q3yr starting age 40 (earlier if risk factors); AAA: one-time abdominal ultrasound for men aged 65-80 who have ever smoked; Hypertension: BP measurement at every visit; Dyslipidemia: lipid panel q5yr starting age 40 (earlier with risk factors); use Framingham Risk Score; Depression: screen when risk factors present (CTFPHC does not recommend universal screening); Hepatitis C: one-time screening for those born 1945-1975 (baby boomer cohort); STI: screen based on risk factors.\n\nCTFPHC guidelines differ from USPSTF in some areas — notably, CTFPHC does not recommend universal depression screening, while USPSTF does. AAA screening is specific to male ever-smokers — the only population with evidence of mortality benefit. FRAX and CAROC tools guide osteoporosis screening and treatment decisions in Canada."
    difficulty: medium
    tags: [periodic health exam, screening, osteoporosis, AAA, diabetes, family medicine]
  - front: "Describe the 5A's approach to smoking cessation and the pharmacotherapy options available in Canada."
    back: "5A's: Ask (about tobacco use at every visit), Advise (clear, personalized advice to quit), Assess (readiness to quit — stages of change), Assist (develop quit plan + pharmacotherapy), Arrange (follow-up within 1-2 weeks). Pharmacotherapy: NRT (patch, gum, lozenge, inhaler, nasal spray — OTC, can combine patch + short-acting); Varenicline (Champix): partial nicotinic agonist — most effective single agent, 12-week course, titrate over 1 week; Bupropion (Zyban): start 1-2 weeks before quit date, 150 mg BID x 7-12 weeks. Combination: varenicline + NRT may be more effective than either alone.\n\nVarenicline has the highest quit rates (~30% at 1 year vs ~15% NRT vs ~7% placebo). CAN-ADAPTT (Canadian guideline) recommends offering pharmacotherapy to all patients who want to quit. The 'black box warning' for neuropsychiatric effects was removed by Health Canada — varenicline is safe in psychiatric patients. Even brief physician advice (3 minutes) increases quit rates by 30%."
    difficulty: medium
    tags: [smoking cessation, 5As, varenicline, NRT, bupropion, family medicine]
  - front: "How is obesity classified and what are the current management approaches including pharmacotherapy and surgical criteria?"
    back: "BMI classification: 18.5-24.9 normal, 25-29.9 overweight, 30-34.9 class I obesity, 35-39.9 class II, ≥40 class III (severe). Management: Lifestyle (all patients): caloric deficit 500-750 kcal/day, 150+ min/wk moderate activity, behavioral counseling. Pharmacotherapy (BMI ≥30, or ≥27 with comorbidity): liraglutide 3.0 mg/day (Saxenda), semaglutide 2.4 mg/wk (Wegovy) — both GLP-1 agonists with 10-15% weight loss; orlistat (lipase inhibitor, modest effect). Bariatric surgery (BMI ≥40, or ≥35 with comorbidity): Roux-en-Y gastric bypass, sleeve gastrectomy — 25-35% weight loss, sustained.\n\nObesity Canada clinical practice guidelines (2020) emphasize obesity as a chronic disease requiring long-term management, not simply 'eat less, move more.' GLP-1 agonists have transformed obesity pharmacotherapy with unprecedented weight loss. Bariatric surgery remains the most effective intervention for severe obesity and can resolve type 2 diabetes in 60-80% of patients."
    difficulty: medium
    tags: [obesity, BMI, GLP-1 agonists, bariatric surgery, semaglutide, family medicine]
  - front: "How is cardiovascular risk assessed in Canada and when should statin therapy be initiated?"
    back: "Risk assessment: Framingham Risk Score (FRS) or modified FRS — estimates 10-year CVD risk. Low <10%, moderate 10-19%, high ≥20%. Statin indications (CCS 2021): 1) Clinical atherosclerosis (secondary prevention — always treat); 2) FRS ≥20% (high risk); 3) LDL ≥5.0 mmol/L (familial hypercholesterolemia likely); 4) Diabetes age ≥40 or with microvascular disease; 5) CKD (eGFR <60, >3 months); 6) FRS 10-19.9% with LDL ≥3.5 or additional risk enhancers. ASA for primary prevention: NO LONGER recommended (bleeding risk outweighs benefit per CCS guidelines).\n\nCCS (Canadian Cardiovascular Society) 2021 dyslipidemia guidelines align with the shift away from treating to LDL targets toward risk-based statin intensity. High-risk patients should receive high-intensity statins (atorvastatin 40-80 mg or rosuvastatin 20-40 mg). ASA is no longer recommended for primary CVD prevention — a significant change from prior practice that is commonly tested."
    difficulty: hard
    tags: [cardiovascular risk, Framingham, statins, ASA, CCS guidelines, family medicine]
  - front: "What is the current NACI-recommended adult immunization schedule in Canada?"
    back: "Influenza: annually for all adults (especially ≥65, chronic disease, healthcare workers, Indigenous). Tdap: one dose in adulthood if not previously received, then Td q10yr; Tdap in each pregnancy (27-32 weeks). Pneumococcal: PNEU-P-23 for all ≥65 and high-risk adults; PNEU-C-20 (PCV20) emerging as single-dose option replacing sequential PCV15+PNEU-P-23. Shingles: Shingrix (recombinant, 2 doses) for all ≥50 years and immunocompromised ≥18. COVID-19: per current NACI guidance (evolving). HPV: catch-up up to age 26 (or 27-45 shared decision). Hepatitis B: if not vaccinated in childhood and at risk.\n\nNACI (National Advisory Committee on Immunization) provides Canadian-specific vaccine recommendations. Shingrix replaced Zostavax — it is non-live (safe in immunocompromised) with >90% efficacy. Tdap in pregnancy is recommended every pregnancy regardless of interval. PCV20 is simplifying pneumococcal vaccination by replacing the previous two-step approach."
    difficulty: medium
    tags: [immunization, NACI, Shingrix, Tdap, pneumococcal, adult vaccines, family medicine]
  - front: "What are the key considerations in a return-to-work assessment and fitness-to-work evaluation?"
    back: "Return-to-work (RTW): assess functional capacity (physical demands of job vs patient's abilities); graduated RTW (modified duties, reduced hours); barriers (pain, psychological, workplace conflict); prognosis and expected recovery timeline; workplace accommodations (ergonomic, schedule); coordinate with employer and occupational therapist. Fitness-to-work: evaluate if medical condition poses risk to self, coworkers, or public; assess specific job demands (safety-sensitive positions require higher threshold); document limitations clearly and objectively; duty to accommodate (employer's legal obligation under Canadian human rights legislation); physician should NOT act as gatekeeper — focus on functional abilities rather than diagnosis.\n\nCanadian physicians have a dual responsibility: advocate for the patient while providing objective medical information. The duty to accommodate to the point of 'undue hardship' is a key Canadian legal principle. Workers' compensation (WSIB in Ontario, WCB in other provinces) claims require specific functional capacity documentation."
    difficulty: medium
    tags: [return to work, fitness to work, occupational health, disability, family medicine]
  - front: "What workplace injury reporting obligations exist for Canadian physicians?"
    back: "Physicians must: 1) Provide a First Medical Report to the provincial Workers' Compensation Board (WCB/WSIB/WorkSafeBC etc.) for any work-related injury/illness; 2) Report occupational diseases to public health where required (e.g., asbestosis, silicosis); 3) Document mechanism of injury, diagnosis, functional limitations, treatment plan, and expected duration of disability; 4) Provide ongoing progress reports. Physicians should NOT: disclose unrelated medical history to the employer; determine fault or causation (that is the Board's role); provide return-to-work clearance without adequate assessment.\n\nWorkers' compensation is a no-fault provincial system in Canada — workers cannot sue employers for workplace injuries in exchange for guaranteed benefits. Physician reporting is legally required and fees for WCB reports are set by provincial fee schedules. Privacy legislation (PIPEDA/provincial) limits what medical information can be shared with employers — only functional limitations, not diagnoses."
    difficulty: medium
    tags: [workplace injury, workers compensation, WSIB, reporting, occupational health, family medicine]
