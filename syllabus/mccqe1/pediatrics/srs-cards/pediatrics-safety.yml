# Pediatrics Safety (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the epidemiology of drowning in Canadian children and what are the key risk factors?"
    back: "Drowning is one of the leading causes of death in children aged 1–4 years. Babies and toddlers drown most often at home in bathtubs and swimming pools. Risk factors: inability to swim, inadequate fencing around pools/water, absence of approved personal flotation devices, risk-taking behaviour, alcohol and substance use (adolescents), prescription medication causing drowsiness, inadequate supervision.\n\nDrowning is defined as the process of experiencing respiratory impairment from liquid submersion and includes both fatal and nonfatal events. Duration of submersion is the most critical factor in outcome — the rate of death or severe neurologic injury is low when submerged for less than 5 minutes. Survivors can sustain long-term pulmonary, neurologic, and cardiovascular injury."
    difficulty: easy
    tags: [pediatrics, drowning, injury prevention, submersion injury]
