# General (Critical Care) - generated from srs-mccqe1
cards:
  - front: "What is the recommended tidal volume setting for patients with ARDS according to the ARDS Network trial?"
    back: "6 mL/kg predicted body weight (lower tidal volume strategy)\n\nThe ARDS Network trial found that ventilation with 6 mL/kg (vs traditional 12 mL/kg) reduced mortality (31% vs 39.8%) and increased ventilator-free days."
    difficulty: easy
    tags: [ARDS, ventilation, critical care, tidal volume, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "Does early neuromuscular blockade improve outcomes in severe ARDS?"
    back: "Yes, early cisatracurium for 48 hours improves 90-day survival (HR 0.68) and reduces ventilator time\n\nThe ACURASYS trial showed 90-day mortality was 31.6% with neuromuscular blockers vs 40.7% placebo in severe ARDS."
    difficulty: medium
    tags: [ARDS, neuromuscular blockers, critical care, cisatracurium, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "Does high-frequency oscillatory ventilation (HFOV) improve mortality in ARDS?"
    back: "No, HFOV increased in-hospital mortality (47% vs 35%, RR 1.33)\n\nThe OSCILLATE trial found that early HFOV in moderate-severe ARDS increased mortality compared to control ventilation."
    difficulty: medium
    tags: [ARDS, HFOV, ventilation, critical care, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "Does prone positioning improve survival in severe ARDS?"
    back: "Yes, prone positioning >16 hours daily reduced 28-day mortality (16% vs 32.8%, HR 0.39)\n\nThe PROSEVA trial showed early prolonged prone positioning significantly reduced both 28-day and 90-day mortality in severe ARDS."
    difficulty: medium
    tags: [ARDS, prone positioning, critical care, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What tidal volume strategy improves survival in ARDS?"
    back: "Low tidal volume ventilation (6 mL/kg predicted body weight)\n\nARDS Network 2000: mortality 31% with 6 mL/kg vs 39.8% with 12 mL/kg, p=0.007"
    difficulty: easy
    tags: [ARDS, lung-protective ventilation, critical care, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What intervention in early severe ARDS improves 90-day survival?"
    back: "Early neuromuscular blockade with cisatracurium for 48 hours\n\nACURASYS 2010: HR for 90-day mortality 0.68 (95% CI 0.48-0.98), p=0.04"
    difficulty: medium
    tags: [ARDS, neuromuscular blockade, critical care, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
