# Rheumatology (Rheumatology) - generated from srs-mccqe1
cards:
  - front: "A 45-year-old woman presents with symmetric polyarthritis of the MCP and PIP joints, morning stiffness >1 hour, and subcutaneous nodules. RF and anti-CCP are positive. What is the diagnosis and what does anti-CCP positivity indicate?"
    back: "Rheumatoid arthritis. Anti-CCP is 94-98% specific for RA and predicts persistent, erosive disease.\n\nAnti-CCP (anti-cyclic citrullinated peptide) antibodies are highly specific for RA and may appear before clinical disease. They predict erosive disease and increased extra-articular manifestations. RF is sensitive but not specific (found in many conditions). Treatment should start with DMARDs as soon as possible, with MTX as first-line."
    difficulty: easy
    tags: [rheumatology, rheumatoid arthritis, autoantibodies]
  - front: "What are the radiographic hallmarks that differentiate osteoarthritis from inflammatory arthritis?"
    back: "OA: non-uniform joint space narrowing, subchondral sclerosis, subchondral cysts, osteophytes. Inflammatory: uniform joint space narrowing, soft tissue swelling, erosions, periarticular osteopenia.\n\nOA affects weight-bearing and overused joints (knee, hip, DIP) in older patients with new bone formation. Inflammatory arthritis (e.g., RA) affects the C-spine, carpus, MCP, and MTP joints, often in younger patients, with erosions and periarticular osteopenia. The mnemonic 'LOSS' helps remember OA findings: Loss of joint space, Osteophytes, Subchondral cysts, Subchondral sclerosis."
    difficulty: easy
    tags: [rheumatology, osteoarthritis, radiology, inflammatory arthritis]
  - front: "What are Gottron's papules and what disease are they pathognomonic for?"
    back: "Pink-violaceous, flat-topped papules overlying the dorsal MCP and IP joints, pathognomonic for dermatomyositis (occurring in 70% of patients).\n\nDermatomyositis presents with progressive symmetric proximal muscle weakness and characteristic skin findings including Gottron's papules, heliotrope rash (violaceous rash over eyelids), shawl sign, and mechanic's hands. DM is associated with malignancy (especially in patients >50) and requires cancer screening. Treatment includes high-dose glucocorticoids and immunosuppressive agents."
    difficulty: easy
    tags: [rheumatology, dermatomyositis, inflammatory myopathy, dermatology]
  - front: "A 30-year-old man presents with conjunctivitis, urethritis, and asymmetric oligoarthritis of the lower extremities 3 weeks after a Chlamydia infection. What is the diagnosis and what skin findings are diagnostic?"
    back: "Reactive arthritis (formerly Reiter's syndrome). Diagnostic skin findings: keratoderma blennorrhagicum (hyperkeratotic lesions on palms/soles) and balanitis circinata (painless ulcers on glans penis).\n\nReactive arthritis is a seronegative spondyloarthropathy triggered by GI (Shigella, Salmonella, Campylobacter, Yersinia) or GU (Chlamydia) infections. The classic triad is arthritis, conjunctivitis/uveitis, and urethritis ('Can't see, can't pee, can't climb a tree'). HLA-B27 positive patients tend to have more axial involvement."
    difficulty: medium
    tags: [rheumatology, reactive arthritis, seronegative spondyloarthropathy]
  - front: "How do you distinguish gout crystals from pseudogout crystals on joint aspirate polarized microscopy?"
    back: "Gout: monosodium urate crystals are needle-shaped with NEGATIVE birefringence (yellow when parallel to compensator). Pseudogout: CPP crystals are rhomboid-shaped with POSITIVE birefringence (blue when parallel).\n\nCrystal identification on synovial fluid analysis is the gold standard for diagnosis. Gout classically affects the first MTP joint (podagra) in middle-aged males. Pseudogout (CPPD) typically affects the knee and wrist in elderly patients. Gout x-rays show erosions with 'overhanging edges' while pseudogout shows chondrocalcinosis."
    difficulty: easy
    tags: [rheumatology, gout, pseudogout, crystal arthropathy]
  - front: "What is the classification criteria for Sjögren's Syndrome and what is the major malignancy risk?"
    back: "ACR/EULAR criteria require a score ≥4 from: labial salivary gland biopsy with focal lymphocytic sialadenitis (3 pts), Anti-SSA/Ro positive (3 pts), ocular staining score ≥5 (1 pt), Schirmer's test <5mm/5min (1 pt), unstimulated saliva flow <0.1 mL/min (1 pt). Major risk: non-Hodgkin's lymphoma (6-7% lifetime incidence).\n\nSjögren's syndrome is an autoimmune condition causing dry eyes and dry mouth from lymphocytic infiltration of salivary and lacrimal glands. It is primarily seen in women (F:M 10:1) aged 40-60. Treatment is largely symptomatic: artificial tears, dental hygiene, pilocarpine for salivary flow. Rituximab may be used for severe organ-threatening disease."
    difficulty: medium
    tags: [rheumatology, Sjogren syndrome, autoimmune, connective tissue disease]
  - front: "What are the CASPAR criteria for psoriatic arthritis?"
    back: "Patient must have inflammatory articular disease PLUS ≥3 points from: current psoriasis (2 pts), past psoriasis or family history (1 pt each), psoriatic nail dystrophy (1 pt), negative RF (1 pt), current/past dactylitis (1 pt), juxta-articular bone formation on hand/foot x-rays (1 pt).\n\nPsoriatic arthritis is a seronegative spondyloarthropathy that can affect joints, spine, or entheses. Treatment includes NSAIDs, IA steroids, DMARDs (MTX, SSZ, leflunomide), and biologics (anti-TNF, anti-IL-17, anti-IL-23, JAK inhibitors). Unlike RA, PsA shows new bone formation on x-rays rather than just erosions."
    difficulty: medium
    tags: [rheumatology, psoriatic arthritis, seronegative spondyloarthropathy]
  - front: "What is polyarteritis nodosa (PAN) and what percentage is associated with hepatitis B?"
    back: "PAN is a systemic necrotizing vasculitis of medium-sized vessels that is ANCA-negative and classically lung-sparing. 5-10% is associated with hepatitis B positivity.\n\nPAN presents with systemic symptoms (fatigue, weight loss, fever), livedo reticularis, renal insufficiency/HTN, mononeuropathy multiplex, and mesenteric arteritis. Imaging shows beading of blood vessels. Treatment is guided by the five-factor score (FFS): glucocorticoids alone for FFS=0, glucocorticoids + cyclophosphamide for FFS≥1."
    difficulty: medium
    tags: [rheumatology, vasculitis, polyarteritis nodosa]
  - front: "A 55-year-old woman with SLE presents with malar rash, oral ulcers, arthritis, proteinuria, and positive anti-dsDNA. Using the 2019 EULAR/ACR classification criteria, what is the entry criterion and how is SLE classified?"
    back: "Entry criterion: ANA titre ≥1:80. SLE is classified if total score ≥10 with at least 1 clinical criterion. Her score: acute cutaneous lupus (6) + oral ulcers (2) + joint involvement (6) + proteinuria >0.5g/24h (4) + anti-dsDNA (6) = 24 points.\n\nThe 2019 EULAR/ACR criteria use a weighted scoring system across clinical and immunology domains. Only the highest weighted criterion within each domain counts. Anti-dsDNA is 95% specific for SLE and levels can correlate with disease activity. First-line treatment is hydroxychloroquine, which is associated with reduced mortality."
    difficulty: hard
    tags: [rheumatology, SLE, classification criteria, autoimmune]
  - front: "What are the 2010 ACR/EULAR classification criteria for rheumatoid arthritis?"
    back: "Score ≥6/10: Joint involvement (0-5 pts), Serology RF/anti-CCP (0-3 pts), Acute phase reactants ESR/CRP (0-1 pt), Duration ≥6 weeks (0-1 pt). Must have ≥1 joint with definite clinical swelling not explained by another disease.\n\nRA is the most common inflammatory arthritis (1% prevalence). MTX is the gold standard first-line DMARD. Treatment should start as soon as diagnosis is made, with a 'window of opportunity' within the first 3 months for better control/remission."
    difficulty: medium
    tags: [rheumatology, RA, diagnosis]
  - front: "What are the extra-articular features of rheumatoid arthritis?"
    back: "Skin: rheumatoid nodules, periungual infarction. Ocular: keratoconjunctivitis sicca, scleritis. Cardiac: pericarditis, valvular disease. Pulmonary: fibrosis, pleural effusion, nodules. Neurologic: peripheral neuropathy. Hematologic: Felty's syndrome (splenomegaly + neutropenia).\n\nRA is an independent risk factor for atherosclerosis and cardiovascular disease. Poor prognostic factors include young age of onset, high RF titre, elevated ESR, >20 active joints, and extra-articular features. Caplan's syndrome is the rare combination of RA + pneumoconiosis."
    difficulty: medium
    tags: [rheumatology, RA]
  - front: "What is the mnemonic for SLE diagnostic criteria?"
    back: "MD SOAP BRAIN: Malar rash, Discoid rash, Oral ulcers, Photosensitivity, Blood (cytopenias), Renal, Arthritis, Immune (anti-dsDNA, anti-Sm, APLA), Neurologic, Serositis.\n\nSLE is a chronic autoimmune disease with M:F ratio of 1:10, onset in reproductive years. ANA is 98% sensitive but poorly specific. Anti-dsDNA and anti-Sm are highly specific (95-99%). Treatment starts with hydroxychloroquine, which reduces mortality and prevents flares."
    difficulty: medium
    tags: [rheumatology, SLE, diagnosis]
  - front: "What distinguishes the arthritis of SLE from RA?"
    back: "SLE arthritis can be deforming but is non-erosive and reducible (Jaccoud's arthritis), whereas RA causes erosive, irreversible joint damage.\n\nSLE joint involvement affects similar distributions to RA but imaging shows no erosions. The 2019 EULAR/ACR classification criteria use a score-based system requiring ANA ≥1:80 as entry criterion and total score ≥10 across clinical and immunological domains."
    difficulty: medium
    tags: [rheumatology, SLE, RA]
  - front: "What is the CREST syndrome?"
    back: "Calcinosis, Raynaud's phenomenon, Esophageal dysmotility, Sclerodactyly, Telangiectasia — the limited cutaneous form of systemic sclerosis.\n\nLimited SSc has better prognosis (>70% 10-year survival) compared to diffuse SSc (40-60%). Anti-centromere antibody is associated with CREST/limited SSc, while anti-topoisomerase I (Scl-70) is associated with diffuse SSc. Lung disease is the most common cause of morbidity and mortality."
    difficulty: easy
    tags: [rheumatology, scleroderma]
  - front: "What are the characteristic skin findings in dermatomyositis?"
    back: "Gottron's papules (violaceous papules over MCP/IP joints), heliotrope rash (violaceous periorbital rash with edema), shawl sign (photosensitive erythema over chest/shoulders), mechanic's hands (cracked palmar lesions).\n\nDMM is associated with malignancy, especially in patients >50 years. Malignancy surveillance should include CXR, abdominal/pelvic US, fecal occult blood, mammogram, and CT scan. CK is elevated in 80% and is the key diagnostic marker for muscle inflammation."
    difficulty: easy
    tags: [rheumatology, dermatomyositis]
  - front: "What is Sjogren's syndrome and what is the most serious complication?"
    back: "Autoimmune condition causing dry eyes (keratoconjunctivitis sicca) and dry mouth (xerostomia) from lymphocytic infiltration of salivary and lacrimal glands. Most serious complication: increased risk of non-Hodgkin lymphoma (lifetime incidence 6-7%).\n\nPrimary Sjogren's occurs alone; secondary is associated with RA, SLE, or DMM. Prevalence is 0.5%, F>>M at 10:1. Diagnosis requires anti-SSA/Ro antibody or labial salivary gland biopsy. Treatment is mainly supportive with artificial tears and parasympathomimetics."
    difficulty: medium
    tags: [rheumatology, sjogrens]
  - front: "What autoantibody is most specific for rheumatoid arthritis?"
    back: "Anti-CCP (anti-cyclic citrullinated peptide) — 94-98% specific, 80% sensitive.\n\nAnti-CCP may precede symptom onset and is useful in early disease and to predict persistent/erosive disease. RF is 80% sensitive but less specific and can be positive in many conditions (IE, TB, hepatitis C, sarcoidosis). High-positive RF or anti-CCP (>3x ULN) scores 3 points on the 2010 ACR/EULAR criteria."
    difficulty: easy
    tags: [rheumatology, RA, autoantibodies]
  - front: "What are the features that distinguish inflammatory from mechanical back pain?"
    back: "Inflammatory: insidious onset, age <45, morning stiffness >1 hour, improves with exercise, worse with rest, disturbs sleep (worse in second half of night). Mechanical: acute onset, any age, stiffness <30 min, worse with exercise, better with rest.\n\nInflammatory back pain suggests ankylosing spondylitis or other spondyloarthropathy. AS involves the SI joints and vertebrae with enthesitis as a major feature. 90-95% of AS patients are HLA-B27 positive. NSAIDs are first-line treatment for both axial and peripheral disease."
    difficulty: medium
    tags: [rheumatology, ankylosing-spondylitis, back-pain]
  - front: "How do you differentiate gout from pseudogout on joint aspiration?"
    back: "Gout: monosodium urate crystals, needle-shaped, negatively birefringent (yellow when parallel to compensator). Pseudogout: calcium pyrophosphate crystals, rhomboid-shaped, positively birefringent (blue when parallel).\n\nGout classically affects the 1st MTP joint (podagra) and occurs in middle-aged males. Pseudogout typically affects knees and wrists in elderly patients. X-ray findings differ: gout shows erosions with overhanging edges; pseudogout shows chondrocalcinosis."
    difficulty: easy
    tags: [rheumatology, gout, pseudogout]
  - front: "What are the indications for uric acid lowering therapy in gout?"
    back: "Gout attacks ≥2/year, tophi, bone erosions/arthritis. First-line agent is allopurinol (including CKD stage ≥3).\n\nWhen starting urate-lowering therapy, concurrent anti-inflammatory prophylaxis (e.g., colchicine, NSAIDs, prednisone) should be initiated for 3-6 months to prevent flares. Target serum urate is <6 mg/dL. Febuxostat is second-line but should be avoided in cardiovascular disease."
    difficulty: medium
    tags: [rheumatology, gout, management]
  - front: "What is the clinical triad of reactive arthritis?"
    back: "Arthritis, conjunctivitis/uveitis, urethritis/cervicitis ('Can't see, can't pee, can't climb a tree').\n\nReA is a seronegative spondyloarthropathy triggered by GI (Shigella, Salmonella, Campylobacter, Yersinia) or GU (Chlamydia) infections. It occurs 1-4 weeks post-infection and is self-limited (3-5 months) but chronic in 15-20%. Keratoderma blennorrhagicum and balanitis circinata are diagnostic skin findings."
    difficulty: easy
    tags: [rheumatology, reactive-arthritis]
  - front: "What is the treatment for giant cell arteritis and why is it urgent?"
    back: "Immediately start high-dose prednisone 1 mg/kg PO. If presenting with vision loss: methylprednisolone 1000 mg/d IV for 3 days first. This is a medical emergency because untreated GCA leads to permanent blindness in 20-25%.\n\nGCA is the most common vasculitis in North America, affecting patients >50 years. Diagnosis is by clinical suspicion + elevated ESR/CRP + temporal artery biopsy or imaging (halo sign on Doppler US). Tocilizumab may be added for glucocorticoid-sparing. Late complications include aortic aneurysm."
    difficulty: medium
    tags: [rheumatology, GCA, vasculitis]
  - front: "What features distinguish GPA (Wegener's) from EGPA (Churg-Strauss)?"
    back: "GPA: upper/lower respiratory granulomatous inflammation + glomerulonephritis, c-ANCA/PR3 positive, saddle nose deformity. EGPA: asthma + eosinophilia + systemic vasculitis (mononeuritis multiplex), p-ANCA/MPO positive in 40-50%.\n\nBoth are ANCA-associated small vessel vasculitides. GPA treatment involves induction with glucocorticoids + cyclophosphamide or rituximab, followed by maintenance with rituximab (first-line). EGPA is characterized by the triad of allergic rhinitis/asthma, eosinophilic infiltrative disease, and systemic vasculitis."
    difficulty: hard
    tags: [rheumatology, vasculitis, GPA, EGPA]
  - front: "What are the five common patterns of psoriatic arthritis?"
    back: "1. Asymmetric oligoarthritis (most common, 70%), 2. DIP arthritis, 3. Symmetric polyarthritis (similar to RA), 4. Asymmetric sacroiliitis/spondylitis, 5. Arthritis mutilans (destructive small joint polyarthritis).\n\nPsA is a seronegative spondyloarthropathy occurring in 10-30% of psoriasis patients. Key features include dactylitis, enthesopathy, and psoriatic nail changes (pitting, onycholysis, oil drop sign). Treatment includes NSAIDs, DMARDs (MTX), and biologics (anti-TNF, anti-IL-17, anti-IL-23, JAK inhibitors)."
    difficulty: medium
    tags: [rheumatology, psoriatic-arthritis]
  - front: "What is the Modified Schober test and what does it assess?"
    back: "Mark 10 cm above and 5 cm below the posterior superior iliac spines. Have the patient bend forward maximally. Normal: distance increases by ≥5 cm. Decreased lumbar flexion suggests ankylosing spondylitis.\n\nAS causes spinal restriction through inflammation → osteopenia → erosion → ossification → osteoproliferation (syndesmophytes). X-ray findings include 'squaring of vertebral bodies,' bridging syndesmophytes ('bamboo spine'), and symmetric sacroiliitis. MRI detects early bone marrow edema."
    difficulty: medium
    tags: [rheumatology, ankylosing-spondylitis, physical-exam]
  - front: "What is PMR (Polymyalgia Rheumatica) and how does it differ from GCA?"
    back: "PMR: pain and stiffness of proximal extremities (shoulder/hip girdles) in patients >50, elevated ESR/CRP, no muscle weakness, normal CK. PMR is the most common extracranial symptom of GCA. 50% of PMR patients have GCA.\n\nPMR treatment starts with prednisone 12.5-25 mg PO daily with dramatic response expected within days. Taper slowly over 1 year. Monitor for steroid side effects and GCA symptoms (headache, jaw claudication, scalp tenderness, vision changes). 50% relapse rate."
    difficulty: medium
    tags: [rheumatology, PMR, GCA]
  - front: "What is the most important etiologic factor in Buerger's disease (thromboangiitis obliterans)?"
    back: "Cigarette smoking.\n\nBuerger's disease causes inflammation and clotting of small and medium-sized arteries and veins of distal extremities, leading to distal claudication and potentially gangrene. It is most common in young Asian males. Smoking cessation is the cornerstone of treatment and is the only intervention that can halt disease progression."
    difficulty: easy
    tags: [rheumatology, vasculitis, smoking]
  - front: "What is the antiphospholipid antibody syndrome (APS)?"
    back: "A multi-system vasculopathy manifested by recurrent thromboembolic events, spontaneous abortions, and thrombocytopenia, with circulating antiphospholipid antibodies (lupus anticoagulant, anti-cardiolipin, anti-B2GP1).\n\nPrimary APS occurs without other disease; secondary APS occurs with CTD (especially SLE). Lab criteria must be positive on 2 occasions ≥12 weeks apart. Treatment: lifelong warfarin (INR 2-3 for first venous event), heparin + ASA during pregnancy for obstetric APS. Catastrophic APS has high mortality."
    difficulty: medium
    tags: [rheumatology, APS, thrombosis]
  - front: "A 50-year-old woman presents with joint pain. What features suggest inflammatory arthritis rather than osteoarthritis?"
    back: "Inflammatory: WARM(S) joints - Worse with rest/better with activity, Awakening in latter half of night, Morning stiffness >30 min, Soft tissue swelling/erythema. OA: pain with activity, improved with rest, stiffness <30 min.\n\nDistinguishing inflammatory from non-inflammatory joint disease guides workup and management. Inflammatory markers (ESR, CRP) and specific serologies (RF, anti-CCP, ANA) help narrow the differential diagnosis."
    difficulty: easy
    tags: [rheumatology, joint-pain, family-medicine, diagnosis]
  - front: "What is the first-line pharmacotherapy for osteoarthritis, and why is this choice appropriate?"
    back: "First-line: acetaminophen up to 4 g/day. This is appropriate because OA is primarily a degenerative (not inflammatory) disorder, so anti-inflammatory agents are second-line.\n\nOA management follows a stepwise approach: 1st line acetaminophen, 2nd line NSAIDs (COX2 selective) in low doses for short durations, 3rd line duloxetine or combination analgesics. Intra-articular corticosteroid injections are pharmacological adjuncts."
    difficulty: easy
    tags: [rheumatology, osteoarthritis, pharmacology, family-medicine]
  - front: "What are the hallmark radiographic features of osteoarthritis?"
    back: "Joint space narrowing, subchondral sclerosis, subchondral cysts, and osteophytes.\n\nOA is the most common form of arthritis. Almost everyone >65 shows OA signs on x-ray but only 33% are symptomatic. There are no laboratory tests for diagnosis. Treatment is stepwise: acetaminophen → NSAIDs → duloxetine/combination analgesics."
    difficulty: easy
    tags: [rheumatology, osteoarthritis, radiology]
  - front: "What extra-articular features of RA are classified by vasculitic vs. lymphocytic infiltrate pathophysiology?"
    back: "Vasculitic: periungual infarction, cutaneous ulcers, episcleritis/scleritis, peri/myocarditis, pulmonary fibrosis, peripheral neuropathy, mononeuritis multiplex. Lymphocytic: rheumatoid nodules, keratoconjunctivitis sicca, xerostomia, Hashimoto's thyroiditis.\n\nRA is an independent risk factor for atherosclerosis and cardiovascular disease. Important syndromes: Felty's (arthritis + splenomegaly + neutropenia), Caplan's (RA + pneumoconiosis), and secondary Sjogren's (dry eyes/mouth). Poor prognosis: young onset, high RF, elevated ESR, >20 active joints, extra-articular features."
    difficulty: medium
    tags: [rheumatology, rheumatoid-arthritis, extra-articular]
  - front: "What joint deformities are characteristic of rheumatoid arthritis?"
    back: "Swan neck deformity (PIP hyperextension + DIP flexion), boutonnière deformity (PIP flexion + DIP hyperextension), ulnar deviation of MCPs, radial deviation of wrist, hammer/mallet/claw toes.\n\nThese deformities result from chronic synovitis causing cartilage and bone destruction, tendon rupture, and joint instability. RA involves C-spine with atlanto-axial and subaxial subluxation, which creates risk for dangerous intubation. Carpal tunnel syndrome and ruptured Baker's cyst (mimics DVT) are also common."
    difficulty: easy
    tags: [rheumatology, rheumatoid-arthritis, joint-deformities]
  - front: "What is the treatment algorithm for rheumatoid arthritis?"
    back: "Start DMARDs immediately upon diagnosis. MTX is first-line (gold standard). If inadequate response in 3-6 months, combine or switch DMARDs. If persistent activity despite MTX, add biologics (anti-TNF agents are first-line biologics). NSAIDs/corticosteroids are supportive only.\n\nDMARDs and biologics (not NSAIDs) can alter the course of RA. Biologics include anti-TNF (infliximab, etanercept, adalimumab), abatacept, rituximab, tocilizumab. JAK inhibitors (tofacitinib, upadacitinib) are oral small-molecule synthetic DMARDs for DMARD failures. Low-dose prednisone (5-10 mg/d) bridges gap until DMARDs take effect."
    difficulty: medium
    tags: [rheumatology, rheumatoid-arthritis, treatment]
  - front: "What is the mnemonic for the diagnostic criteria of SLE?"
    back: "MD SOAP BRAIN: Malar rash, Discoid rash, Oral ulcers, Photosensitivity, Blood (cytopenias), Renal, Arthritis, Immune (anti-dsDNA, anti-Sm, APLA), Neurologic (seizures, psychosis), Serositis.\n\nSLE is a chronic autoimmune disease with multi-system inflammation (M:F = 1:10, onset 15-45 yr). ANA is 98% sensitive but poor specificity. Anti-dsDNA and anti-Sm are specific (95-99%). The 2019 EULAR/ACR criteria use a score-based algorithm with ANA ≥1:80 as entry criterion and ≥10 points for classification."
    difficulty: easy
    tags: [rheumatology, SLE]
  - front: "How does the arthritis of SLE differ from RA?"
    back: "SLE arthritis is deforming but non-erosive and reducible (Jaccoud's arthritis), while RA is erosive and irreducible. SLE is polyarticular with reducible deformities, and x-rays show no erosions.\n\nBoth conditions present with polyarthritis, but the pathophysiology differs. SLE involves immune complex deposition, while RA involves pannus-mediated destruction. Hydroxychloroquine is central to SLE treatment, reducing mortality and preventing flares."
    difficulty: medium
    tags: [rheumatology, SLE, arthritis]
  - front: "What drugs commonly cause drug-induced lupus and what antibody is characteristically associated?"
    back: "Hydralazine, procainamide, phenytoin, isoniazid, biologics, minocycline. Anti-histone antibodies are characteristically present (95% of drug-induced SLE cases).\n\nDrug-induced SLE typically presents with constitutional symptoms, arthralgias, and serositis, but renal and CNS involvement are rare. Symptoms resolve with discontinuation of the offending drug. This distinguishes it from idiopathic SLE."
    difficulty: easy
    tags: [rheumatology, drug-induced-lupus]
  - front: "What are the clinical criteria for antiphospholipid antibody syndrome (APS)?"
    back: "Vascular thrombosis (arterial, venous, or small vessel) OR pregnancy morbidity (fetal death ≥10 wk, premature birth <34 wk due to eclampsia/preeclampsia, or ≥3 consecutive spontaneous abortions <10 wk). Plus laboratory: positive lupus anticoagulant, anti-cardiolipin Ab, or anti-β2GP1 Ab on 2 occasions ≥12 weeks apart.\n\nAPS can be primary (no underlying disease) or secondary (commonly with SLE). Catastrophic APS involves small vessel thrombosis in ≥3 organ systems within 1 week and has high mortality. Treatment: lifelong anticoagulation with warfarin; obstetric APS uses heparin + ASA during pregnancy."
    difficulty: medium
    tags: [rheumatology, antiphospholipid-syndrome]
  - front: "What is CREST syndrome and which antibody is associated with it?"
    back: "CREST = Calcinosis, Raynaud's phenomenon, Esophageal dysmotility, Sclerodactyly, Telangiectasia. It represents limited cutaneous systemic sclerosis. Anti-centromere antibody is associated (>80% positive).\n\nCREST/limited SSc has skin sclerosis restricted to hands, face, and neck, with pulmonary HTN being a common complication. Diffuse SSc involves widespread skin disease with early visceral involvement and is associated with anti-topoisomerase I (Scl-70) antibody. Lung disease is the most common cause of morbidity and mortality in scleroderma."
    difficulty: easy
    tags: [rheumatology, scleroderma, CREST]
  - front: "What is the most important complication of scleroderma renal crisis and how is it treated?"
    back: "Malignant arterial HTN with oliguria and microangiopathic hemolytic anemia. Treated with ACE inhibitors.\n\nScleroderma renal crisis occurs in 10-15% of patients, usually with diffuse SSc. Anti-RNA polymerase III antibody is associated with increased risk. Prednisone >20 mg may provoke renal crisis. Raynaud's phenomenon treatment includes vasodilators (CCBs, nitroglycerine cream, PDE5 inhibitors)."
    difficulty: medium
    tags: [rheumatology, scleroderma, renal-crisis]
  - front: "What are the characteristic skin findings of dermatomyositis?"
    back: "Gottron's papules (pink-violaceous flat-topped papules over dorsal MCP and IP joints, pathognomonic), heliotrope rash (violaceous rash over eyelids with edema), shawl sign (poikilodermatous rash over neck/chest/shoulders), mechanic's hands (dry, cracked lesions on palmar surfaces).\n\nDM is associated with malignancy (screen with thorough exam, CXR, CT, mammogram). CK is elevated in 80%. Treatment: high-dose glucocorticoids + immunosuppressive agents (azathioprine, MTX). IVIG for severe/refractory cases. PM is a T cell-mediated process, while DM is complement-mediated."
    difficulty: easy
    tags: [rheumatology, dermatomyositis]
  - front: "What are the features of Sjögren's syndrome and what is the increased malignancy risk?"
    back: "Autoimmune condition causing dry eyes (keratoconjunctivitis sicca) and dry mouth (xerostomia) from lymphocytic infiltration of salivary and lacrimal glands. Increased risk of non-Hodgkin's lymphoma (lifetime incidence 6-7%).\n\nPrevalence 0.5%, F>>M at 10:1, ages 40-60. Diagnosis: anti-SSA/Ro (40-95%), labial salivary gland biopsy with focus score ≥1, Schirmer's test <5 mm/5 min. Treatment: artificial tears, pilocarpine for dry mouth, good dental hygiene. Rituximab for severe organ-threatening disease."
    difficulty: easy
    tags: [rheumatology, Sjogrens-syndrome]
  - front: "What are the classic features of granulomatosis with polyangiitis (GPA, formerly Wegener's)?"
    back: "Triad: granulomatous vasculitis of upper and lower respiratory tract + focal segmental glomerulonephritis. Features include sinusitis/rhinitis, nasoseptal perforation, saddle nose deformity, pulmonary nodules/cavitary lesions, and renal involvement. Highly associated with c-ANCA/PR3-ANCA.\n\nGPA is a small vessel ANCA-associated vasculitis. Treatment of severe disease: IV glucocorticoids + cyclophosphamide or rituximab for induction, then rituximab for maintenance. All patients need PJP prophylaxis and osteoporosis prevention. Changes in ANCA levels do not reliably predict relapse."
    difficulty: medium
    tags: [rheumatology, vasculitis, GPA]
  - front: "What are the key differences between giant cell arteritis (GCA) and polymyalgia rheumatica (PMR)?"
    back: "GCA: temporal headache, scalp tenderness, jaw claudication, sudden painless vision loss, elevated ESR/CRP, requires high-dose prednisone 1 mg/kg. PMR: proximal shoulder/pelvic girdle pain and stiffness, elevated ESR/CRP, no true weakness, responds to low-dose prednisone 12.5-25 mg.\n\nGCA is a medical emergency as untreated it can cause permanent blindness in 20-25%. PMR is the most common extracranial manifestation of GCA. If GCA suspected, start prednisone immediately (do not wait for biopsy). Temporal artery biopsy or ultrasound (halo sign) confirms diagnosis."
    difficulty: medium
    tags: [rheumatology, GCA, PMR]
  - front: "What is ankylosing spondylitis and what HLA marker is strongly associated?"
    back: "Chronic inflammatory arthritis of SI joints and vertebrae, with enthesitis as a major feature. HLA-B27 positive in 90-95%. M:F = 3:1, onset in 20s. Presents with inflammatory back pain (morning stiffness >1h, improves with exercise, worse with rest).\n\nX-ray findings progress from 'squaring of edges' to 'bamboo spine' (bridging syndesmophytes). Modified Schober test measures lumbar flexion (normal ≥5 cm increase). Extra-articular: anterior uveitis (25-30%), IBD, aortic regurgitation, apical fibrosis. Treatment: NSAIDs first-line; conventional DMARDs only for peripheral arthritis; anti-TNF or anti-IL-17 for axial disease."
    difficulty: medium
    tags: [rheumatology, ankylosing-spondylitis]
  - front: "What are the 5 patterns of arthritis seen in psoriatic arthritis?"
    back: "1. Asymmetric oligoarthritis (most common, 70%). 2. DIP arthritis (with nail changes). 3. Symmetric polyarthritis (RA-like). 4. Asymmetric sacroiliitis and spondylitis. 5. Arthritis mutilans (destructive, deforming).\n\nPsoriasis precedes arthritis in 85% of cases. Characteristic findings include dactylitis, enthesopathy, psoriatic nail changes (pitting, onycholysis, oil drop sign), and radiologic pencil-in-cup appearance. Treatment: DMARDs early; biologics (anti-TNF, anti-IL-17, anti-IL-23) for resistant disease. Check 'hidden' areas for psoriasis: ears, hairline, umbilicus, gluteal cleft, nails."
    difficulty: medium
    tags: [rheumatology, psoriatic-arthritis]
  - front: "What is the clinical triad of reactive arthritis and what infections trigger it?"
    back: "Triad: arthritis + conjunctivitis/uveitis + urethritis/cervicitis ('Can't see, can't pee, can't climb a tree'). Triggered by GI (Shigella, Salmonella, Campylobacter, Yersinia, C. difficile) or GU (Chlamydia, Mycoplasma) infections, onset 1-4 weeks post-infection.\n\nReA is a seronegative spondyloarthropathy, HLA-B27 positive in 80%. Diagnostic skin findings: keratoderma blennorrhagicum (hyperkeratotic lesions on palms/soles) and balanitis circinata (painless ulcers on glans penis). Usually self-limited (3-5 months), chronic in 15-20%."
    difficulty: easy
    tags: [rheumatology, reactive-arthritis]
  - front: "How do you differentiate gout from pseudogout by crystal analysis?"
    back: "Gout: monosodium urate crystals, needle-shaped, negatively birefringent (yellow when parallel to compensator). Pseudogout: calcium pyrophosphate (CPP) crystals, rhomboid-shaped, positively birefringent (blue when parallel).\n\nGout classically affects the 1st MTP (podagra) in middle-aged males. Pseudogout affects knees and wrists in elderly patients with chondrocalcinosis on x-ray. Precipitants of gout (mnemonic FACT): Fructose, Aspirin (low-dose)/Alcohol, Cyclosporine, Thiazide diuretics. Foods: SALT (Seafood, Alcohol, Liver/kidney, Turkey)."
    difficulty: easy
    tags: [rheumatology, gout, pseudogout, crystal-arthropathy]
  - front: "What is the first-line urate-lowering therapy for chronic gout and when should it be initiated?"
    back: "Allopurinol is first-line for all patients (including CKD stage ≥3). Start low and titrate up. Indications: ≥2 attacks/year, tophi, bone erosions/arthritis, radiographic damage attributable to gout.\n\nAllopurinol and febuxostat both inhibit xanthine oxidase. Febuxostat should not be used if history of cardiovascular disease. When starting ULT, concomitant anti-inflammatory prophylaxis (colchicine, NSAIDs, or low-dose prednisone) should be given for 3-6 months to prevent acute flares."
    difficulty: medium
    tags: [rheumatology, gout, treatment]
  - front: "How do you differentiate inflammatory myositis from PMR from fibromyalgia?"
    back: "Inflammatory myositis: proximal weakness (painless), elevated CK, abnormal muscle biopsy/EMG. PMR: proximal pain/stiffness without weakness, markedly elevated ESR/CRP, responds to low-dose steroids. Fibromyalgia: widespread pain without weakness, normal labs, treated with exercise and sleep restoration.\n\nKey differentiator is the presence or absence of true muscle weakness. Inflammatory myositis has elevated CK and EMG changes; PMR has elevated inflammatory markers but normal CK; fibromyalgia has all normal labs. Myositis requires high-dose steroids, PMR requires low-dose, and fibromyalgia does not respond to steroids."
    difficulty: medium
    tags: [rheumatology, inflammatory-myopathy, PMR, fibromyalgia]
  - front: "What conditions are associated with pseudogout (CPPD disease)?"
    back: "Old age, advanced OA, neuropathic joints. Associated metabolic conditions: hyperparathyroidism, hypothyroidism, hypomagnesemia, hypophosphatasia (low ALP), hemochromatosis.\n\nCPPD can present as acute crystal arthritis (resembling gout), pseudo-OA (progressive degeneration), or pseudo-RA (symmetric polyarticular with morning stiffness). X-rays show chondrocalcinosis in 75%. Treatment: acute - joint aspiration and IA steroids; chronic - NSAIDs with gastroprotection ± low-dose colchicine."
    difficulty: easy
    tags: [rheumatology, pseudogout, CPPD]
  - front: "What is the most common cause of Raynaud's phenomenon secondary to a connective tissue disease?"
    back: "Scleroderma (systemic sclerosis) is the most common cause of secondary Raynaud's phenomenon.\n\nFeatures of pathologic Raynaud's include: new onset, asymmetric, precipitated by stimuli other than cold/emotion, associated with digital pitting/tissue reabsorption, digital ischemia, and capillary dilatation by capillaroscopy. DDx mnemonic COLD HAND: CREST, Obstruction/Occupational, Lupus/CTDs, DM/Drugs, Hematologic, Arterial, Neurologic, Disease of unknown origin."
    difficulty: easy
    tags: [rheumatology, Raynauds-phenomenon, scleroderma]
  - front: "What autoantibodies and their disease associations are most important for the MCCQE1?"
    back: "RF: RA (80%, non-specific). Anti-CCP: RA (80%, 94-98% specific). ANA: SLE (98%, sensitive not specific). Anti-dsDNA: SLE (50-70%, 95% specific, correlates with disease activity). Anti-Sm: SLE (<30%, specific). Anti-centromere: limited SSc/CREST (>80%). Anti-topoisomerase I (Scl-70): diffuse SSc. Anti-Jo1: PM/DM (anti-synthetase syndrome). c-ANCA/PR3: GPA (90%). p-ANCA/MPO: MPA (60-80%).\n\nOrdering ANA/RF only makes sense when pre-test probability of CTD is high, as false positives are common (up to 30% of healthy individuals have low-titre ANA). Anti-dsDNA and complement levels (C3, C4) are useful for monitoring SLE disease activity. Anti-CCP may precede clinical RA symptoms."
    difficulty: medium
    tags: [rheumatology, autoantibodies, serology]
  - front: "What are the key features that differentiate mechanical from inflammatory back pain?"
    back: "Mechanical: acute onset, age 15-90, morning stiffness <30 min, worse with exercise, better with rest, anatomic pain radiation, possible motor/sensory symptoms. Inflammatory: insidious onset, age <45, morning stiffness >1 hour (worse during 2nd half of night), better with exercise, worse with rest, diffuse radiation, responds well to NSAIDs.\n\nInflammatory back pain is characteristic of spondyloarthropathies (AS, PsA, ReA, EA). Key distinguishing features are involvement of other systems (uveitis, IBD, psoriasis), onset <45 years, and HLA-B27 association. Imaging may show sacroiliitis (MRI with bone marrow edema on STIR sequences in early disease)."
    difficulty: easy
    tags: [rheumatology, back-pain, inflammatory-vs-mechanical]
  - front: "What are the 4 types of immune-mediated hypersensitivity reactions and their clinical examples?"
    back: "Type I (IgE-mediated): asthma, anaphylaxis, allergic rhinitis. Type II (cytotoxic Ab-mediated): autoimmune hemolytic anemia, Goodpasture syndrome, Graves' disease, ITP. Type III (immune complex): SLE, PAN, post-streptococcal GN. Type IV (cell-mediated/delayed): contact dermatitis, tuberculin skin test, mycobacterial infection.\n\nUnderstanding hypersensitivity types is essential for mechanistic understanding of rheumatologic diseases. SLE primarily involves Type III (immune complex deposition), Goodpasture and Graves are Type II, and contact dermatitis is the classic Type IV. This framework guides diagnostic approach and treatment selection."
    difficulty: medium
    tags: [immunology, hypersensitivity, autoimmune, rheumatology, Type I-IV]
  - front: "Which HLA types are associated with ankylosing spondylitis, rheumatoid arthritis, and Sjögren's syndrome respectively?"
    back: "HLA-B27: ankylosing spondylitis (relative risk 20x), reactive arthritis, and axial PsA/EA. HLA-DR4/DR1: rheumatoid arthritis (relative risk 2–10x; found in 93% of RA patients). HLA-DR3: Sjögren's syndrome (associated with anti-Ro/SSA and anti-La/SSB antibodies).\n\nHLA typing is supportive but not diagnostic for rheumatic diseases. HLA-B27 has the highest relative risk association with AS; however, 7% of the White Canadian population carries HLA-B27 without disease. HLA testing is useful when pre-test probability is moderate and diagnosis is uncertain."
    difficulty: medium
    tags: [HLA, ankylosing spondylitis, rheumatoid arthritis, Sjögrens, immunogenetics]
  - front: "What is the function of MHC Class I vs. Class II molecules and which T cells recognize each?"
    back: "MHC Class I (HLA-A, B, C): present on all nucleated cells; recognized by CD8+ cytotoxic T lymphocytes. MHC Class II (HLA-DP, DQ, DR): present on antigen-presenting cells (macrophages, B cells, dendritic cells); recognized by CD4+ helper T lymphocytes.\n\nMHC class distinction is fundamental to understanding autoimmune pathophysiology. CD8+ cells kill infected/aberrant cells via lytic granules (perforin/granzyme) and FasL. CD4+ helper T cells coordinate immune response by activating macrophages and B cells and releasing cytokines. This underlies treatment rationale for biologics targeting specific immune pathways."
    difficulty: medium
    tags: [MHC, HLA, CD4, CD8, immunology, rheumatology]
  - front: "What are the key differences between inflammatory and degenerative arthritis on history and physical?"
    back: "Inflammatory: pain at rest relieved by activity, morning stiffness >1 hour, cardinal signs of inflammation (warmth/swelling/erythema/tenderness), extra-articular manifestations, symmetric small joints. Degenerative: pain with motion relieved by rest, morning stiffness <1 hour, gelling, bony enlargement, malalignment, end-of-day pain.\n\nThis distinction guides the diagnostic workup and treatment approach. Inflammatory arthritis requires ESR/CRP, ANA/RF/ACPA testing and DMARDs; degenerative arthritis (OA) requires radiography to confirm and is managed with non-pharmacological measures and analgesics. Morning stiffness duration is the single most useful discriminating feature."
    difficulty: easy
    tags: [arthritis, inflammatory arthritis, osteoarthritis, morning stiffness, rheumatology]
  - front: "What are the 3 most important tests to perform on synovial fluid, and what WBC/mm³ cut-offs differentiate normal, non-inflammatory, inflammatory, and septic fluid?"
    back: "The 3 Cs: Culture and Gram stain, Cell count with differential, Crystal analysis. Cut-offs: Normal <200 WBC; Non-inflammatory <2000; Inflammatory ≥2000 (often much higher in crystal-induced); Septic >50,000 with >75% PMNs.\n\nSynovial fluid analysis is the gold standard for differentiating causes of joint effusion. In septic arthritis, WBC is typically >50,000/mm³ with >75% PMNs; however, gonococcal septic arthritis may have lower WBC and is difficult to culture. Crystal-induced arthritis can have very high WBC (>50,000) mimicking septic arthritis, making crystal analysis essential."
    difficulty: medium
    tags: [synovial fluid, joint aspiration, septic arthritis, crystal arthritis, rheumatology]
  - front: "What defines septic arthritis as a medical emergency, and what are the most common causes?"
    back: "Septic arthritis causes rapid joint destruction and carries 10–15% mortality risk. The knee (50% of cases) and hip are most commonly affected. Most commonly caused by hematogenous spread of Gram-positive cocci (S. aureus most common) > Gram-negative bacilli.\n\nSeptic arthritis requires urgent joint aspiration for diagnosis and source control plus IV antibiotics. Risk factors include IV drug use, hemodialysis, recent STI (gonococcal), RA, type 2 DM, immunosuppression, and advanced age. Gonococcal septic arthritis is important in sexually active young adults and may be difficult to culture from synovial fluid."
    difficulty: easy
    tags: [septic arthritis, joint infection, S. aureus, emergency, rheumatology]
  - front: "What are the differential causes of secondary osteoarthritis?"
    back: "Secondary OA causes include: post-traumatic/mechanical, post-inflammatory (RA) or post-infectious, heritable skeletal disorders (scoliosis), endocrine (acromegaly, hyperparathyroidism, hypothyroidism), metabolic (gout, pseudogout, hemochromatosis, Wilson's disease, ochronosis), neuropathic (Charcot joints from DM/syphilis), AVN, and congenital malformation.\n\nWhen a patient presents with OA in an unusual pattern (e.g., young patient, unusual joints like MCP involvement), consider secondary causes. Hemochromatosis classically causes OA of the 2nd and 3rd MCPs (chondrocalcinosis-associated), hypothyroidism causes effusions and pseudogout, and acromegaly causes premature OA due to cartilage overgrowth."
    difficulty: medium
    tags: [osteoarthritis, secondary OA, hemochromatosis, acromegaly, chondroCalcinosis]
  - front: "What are the 4 radiographic hallmarks of osteoarthritis (LOSS mnemonic)?"
    back: "LOSS: Loss of joint space (non-uniform), Osteophytes, Subchondral cysts, Subchondral Sclerosis. OA typically affects knee, hip, and DIP joints in older patients with new bone formation.\n\nOA radiographic findings contrast with inflammatory arthritis: OA shows non-uniform joint space narrowing, new bone formation (osteophytes), and subchondral changes; inflammatory arthritis shows uniform joint space narrowing, erosions, periarticular osteopenia, and soft tissue swelling. These distinctions guide diagnosis and management."
    difficulty: easy
    tags: [osteoarthritis, radiology, X-ray, osteophytes, LOSS mnemonic]
  - front: "What are the typical joint distribution patterns and hand findings in osteoarthritis?"
    back: "OA commonly affects: DIP (Heberden's nodes = osteophytes), PIP (Bouchard's nodes), 1st CMC (thumb squaring), 1st MTP, knee (medial > lateral compartment), hip, and lumbar spine (L4-L5, L5-S1). MCPs other than 1st are usually spared.\n\nThe distribution of OA helps differentiate from inflammatory arthritis. MCP involvement suggests RA or hemochromatosis, not typical OA. Heberden's nodes (DIP) and Bouchard's nodes (PIP) are characteristic bony osteophytes of hand OA. Thumb CMC involvement causing thumb squaring is highly characteristic of hand OA."
    difficulty: easy
    tags: [osteoarthritis, Heberdens nodes, Bouchards nodes, joint distribution, hand OA]
  - front: "What is the stepped pharmacological approach to treating osteoarthritis?"
    back: "Stepped approach — local before systemic: (1) Topical NSAIDs/capsaicin (knee, hand OA); (2) IA glucocorticoids (knee, hip OA); (3) Acetaminophen, oral NSAIDs; (4) Centrally acting agents (duloxetine). Not recommended: opioids, cannabinoids, hyaluronates, PRP, stem cells, chondroitin, glucosamine.\n\nCanadian OARSI-aligned guidelines emphasize non-pharmacological therapy first (weight loss, exercise, Tai chi, physiotherapy) before pharmacological treatment, and local therapy before systemic agents. Opioids are not recommended for OA pain management. No current treatment alters natural history of OA; total joint replacement is definitive surgical treatment."
    difficulty: medium
    tags: [osteoarthritis, treatment, NSAIDs, acetaminophen, intra-articular injection]
  - front: "How does CRP differ from ESR as an inflammatory marker in rheumatic disease monitoring?"
    back: "CRP: more sensitive for inflammation, responds more quickly to clinical changes, fewer false positives/negatives. ESR: increased by renal disease, female sex, older age, pregnancy, DM, myeloma, CHF; useful for low-grade bone/joint infections and monitoring CTDs (SLE, PMR, GCA). Do not order ESR for acute inflammation.\n\nCRP is preferred for monitoring acute inflammatory conditions (RA exacerbations, septic arthritis response to treatment). ESR is more useful for chronic conditions like PMR and GCA where it serves as a surrogate disease activity marker and guides steroid tapering. Both can be elevated in systemic inflammatory diseases, infections, and malignancies."
    difficulty: easy
    tags: [CRP, ESR, inflammatory markers, rheumatology, monitoring]
  - front: "What distinguishes seropositive from seronegative rheumatic diseases in terms of joint distribution, pelvic involvement, and extra-articular features?"
    back: "Seropositive (RA, SLE, scleroderma): symmetric peripheral arthritis, small and medium joints (PIP, MCP, wrist), no pelvic/axial disease (except C-spine), no enthesitis; extra-articular features include nodules, vasculitis, Raynaud's, rashes. Seronegative (AS, PsA, ReA, EA): asymmetric, larger joints/lower extremities, axial/pelvic disease (SI joints), enthesitis, dactylitis ('sausage digit'), iritis, GI/GU/skin involvement.\n\nThis distinction is clinically critical for diagnosis: SI joint involvement on imaging, HLA-B27 positivity, and enthesitis strongly suggest seronegative spondyloarthropathy. Symmetric small joint involvement with positive RF/ACPA and extra-articular features (nodules, ILD) suggest seropositive disease like RA. Treatment approaches also differ significantly."
    difficulty: medium
    tags: [seropositive, seronegative, arthritis, spondyloarthropathy, rheumatoid arthritis, rheumatology]
  - front: "What is enthesitis and in which rheumatic conditions is it a characteristic feature?"
    back: "Enthesitis is inflammation of the tendon or ligament at its site of attachment to bone (e.g., Achilles tendon insertion, plantar fascia). It is characteristic of seronegative spondyloarthropathies: ankylosing spondylitis, psoriatic arthritis, reactive arthritis, and enteropathic arthritis.\n\nEnthesitis is a hallmark of the spondyloarthropathy family and distinguishes these conditions from seropositive arthritis (RA, SLE). Common sites include the Achilles insertion, plantar fascia, patellar tendon, and iliac crest. On imaging, MRI can detect enthesitis before radiographic changes occur. Treatment includes NSAIDs and biologics (TNF inhibitors, IL-17 inhibitors)."
    difficulty: easy
    tags: [enthesitis, spondyloarthropathy, ankylosing spondylitis, psoriatic arthritis, seronegative]
  - front: "What are the Choosing Wisely Canada recommendations specific to rheumatology ordering practices?"
    back: "1. Do not order ANA as a screening test without specific signs/symptoms of SLE or CTD. 2. Do not order anti-dsDNA or complement without specific signs/symptoms. 3. Do not repeat DEXA more often than every 2 years. 4. Do not prescribe bisphosphonates for patients at low fracture risk. 5. Do not perform whole body bone scans for diagnostic screening of arthritis.\n\nANA is positive in 20–30% of healthy individuals and in many non-rheumatic conditions; ordering it without clinical suspicion leads to unnecessary investigation cascades. These Choosing Wisely recommendations reduce inappropriate testing while maintaining diagnostic quality. Non-judicious ANA ordering is a common clinical error on the MCCQE1."
    difficulty: medium
    tags: [Choosing Wisely, ANA, DEXA, rheumatology, appropriate use, Canada]
  - front: "What is the role of TNF-alpha as a cytokine in rheumatic disease, and what are its major functions?"
    back: "TNF-alpha is produced by T cells and macrophages/monocytes. Major functions: apoptotic cell death, cachexia, induction of other cytokines, T cell stimulation, induction of metalloproteinases and prostaglandins, increased expression of adhesion molecules, and increased vascular permeability (entry of IgG, complement, cells into tissues).\n\nTNF-alpha is a pivotal pro-inflammatory cytokine in RA, AS, and other inflammatory arthritides. TNF inhibitors (adalimumab, etanercept, infliximab, certolizumab, golimumab) are highly effective DMARDs that work by blocking these pathways. Key risks of TNF inhibition include reactivation of latent TB, serious infections, and increased malignancy risk."
    difficulty: medium
    tags: [TNF-alpha, cytokines, biologics, rheumatoid arthritis, immunology]
  - front: "What is IL-6's role in inflammation and what clinical conditions does it drive?"
    back: "IL-6 is produced by many cell types. Functions: anemia of inflammation (via hepcidin production), proliferation of B and T cells, acute phase reactant production (CRP, fibrinogen), induction of natural protease inhibitors, promotion of erosions, elevation of CRP. Clinically important in RA (tocilizumab targets IL-6 receptor).\n\nIL-6 drives the acute phase response, causing elevated ESR/CRP and fibrinogen. The anemia of chronic inflammation via hepcidin is an IL-6-mediated effect. Tocilizumab (IL-6 receptor inhibitor) is effective in RA, giant cell arteritis, and was used in COVID-19 cytokine storm. Monitoring CRP is particularly useful as it reflects IL-6 activity."
    difficulty: hard
    tags: [IL-6, cytokines, tocilizumab, anemia of chronic disease, rheumatoid arthritis]
  - front: "What non-pharmacological treatments are strongly recommended for knee and hip osteoarthritis?"
    back: "Weight loss (minimum 5–10 lbs if overweight), exercise (supervised more effective; physiotherapist-led or class-based), Tai chi (strongly recommended for hip/knee OA), self-management programs (goal-setting, patient education), thermal intervention (heat or cold), and occupational therapy (aids, splints, cane, bracing).\n\nNon-pharmacological therapy is first-line for OA. A Cochrane systematic review of 54 studies confirmed land-based therapeutic exercise significantly reduces knee OA pain (6 points/100) and improves physical function sustained 2–6 months post-treatment. Tai chi has specific evidence for both pain reduction and fall prevention in older adults with OA."
    difficulty: easy
    tags: [osteoarthritis, non-pharmacological, exercise, Tai chi, physiotherapy, weight loss]
  - front: "What is the approach to acute monoarthritis, and what are the main diagnostic categories to consider?"
    back: "Categories: (1) Non-inflammatory: hemarthrosis, internal derangement (loose body, torn meniscus). (2) Crystal-induced: monosodium urate (gout), CPPD (pseudogout), hydroxyapatite. (3) Infectious: gonococcal, non-gonococcal, mycobacterial, fungal. (4) Seronegative: AS, PsA, ReA, EA. Joint aspiration (synovial fluid analysis) is essential for diagnosis.\n\nAcute monoarthritis requires urgent joint aspiration to exclude septic arthritis (medical emergency). Crystal-induced arthritis and septic arthritis may both have very high WBC (>50,000/mm³) in synovial fluid; crystals under polarized microscopy and culture/Gram stain are the key discriminating tests. Gonococcal arthritis should be considered in sexually active young adults."
    difficulty: medium
    tags: [monoarthritis, joint aspiration, gout, septic arthritis, crystal arthritis, rheumatology]
  - front: "Which autoantibody is the serologic hallmark of Rheumatoid Arthritis, and what is its sensitivity and specificity?"
    back: "Rheumatoid Factor (RF) is the serologic hallmark of RA. Sensitivity ~80%, but it is non-specific (only ~50% specific for RA; present in SLE 20%, IE, TB, hepatitis C, silicosis, sarcoidosis). Positive RF is associated with more aggressive disease, extra-articular features (nodules), and erosions.\n\nRF is directed against the Fc domain of IgG. While sensitive (~80%), it is not specific to RA and can be present in many inflammatory and infectious conditions. Its presence is associated with worse prognosis including erosive disease and extra-articular manifestations."
    difficulty: easy
    tags: [rheumatology, rheumatoid-arthritis, autoantibodies, serology]
  - front: "What is the sensitivity and specificity of anti-CCP antibodies in Rheumatoid Arthritis, and what is their clinical utility?"
    back: "Anti-CCP sensitivity ~80%, specificity 94-98% for RA. Useful in early disease and predicting persistent/erosive disease. Can occur before clinical disease becomes apparent. Associated with increased extra-articular RA manifestations.\n\nAnti-CCP (anti-cyclic citrullinated peptide) antibodies are highly specific for RA and can precede clinical symptoms. Their detection supports early diagnosis and can guide prognosis by identifying patients likely to develop persistent, erosive disease."
    difficulty: easy
    tags: [rheumatology, rheumatoid-arthritis, autoantibodies, anti-CCP]
  - front: "What is the sensitivity of ANA in SLE, and why is a negative ANA clinically useful?"
    back: "ANA is 98% sensitive for SLE. Because of its high sensitivity, a negative ANA can effectively rule out SLE. However, ANA has poor specificity (present in many conditions including other CTDs, healthy individuals up to 30% at low titres). Only measure when pre-test probability is high.\n\nANA (antinuclear antibody) tests are directed against nuclear components (DNA, RNA, histones, centromere). The high sensitivity means nearly all SLE patients are ANA-positive, making a negative result useful for exclusion. However, low-titre positivity is common in the general population, especially with age."
    difficulty: easy
    tags: [rheumatology, SLE, ANA, autoantibodies, serology]
  - front: "Which autoantibodies are specific for SLE (not just sensitive), and do their levels correlate with disease activity?"
    back: "Anti-dsDNA (95% specific, 50-70% sensitive): levels correlate with disease activity (rise with flares, complement levels fall). Anti-Sm (<30% sensitive): highly specific (99%) for SLE but does not correlate with disease activity and remains positive throughout disease course.\n\nAnti-dsDNA and anti-Sm are the two most SLE-specific antibodies. Anti-dsDNA is the more clinically useful for monitoring because its titre tracks disease activity alongside C3/C4 levels. Anti-Sm, while highly specific, is a static marker not used for monitoring."
    difficulty: medium
    tags: [rheumatology, SLE, autoantibodies, anti-dsDNA, anti-Sm]
  - front: "What are the clinical implications of anti-Ro (SSA) antibodies in pregnancy?"
    back: "Anti-Ro (SSA) antibodies in pregnancy increase the risk of neonatal lupus syndrome and congenital heart block in the fetus/neonate. Anti-La (SSB) also increases this risk. These antibodies cross the placenta and can affect fetal cardiac conduction.\n\nAnti-Ro antibodies are seen in Sjögren's syndrome (40-95%), SLE (32%), and RA (15%). When present in pregnancy, they can cross the placenta and cause neonatal lupus and irreversible congenital complete heart block — a key clinical concern requiring fetal cardiac monitoring."
    difficulty: medium
    tags: [rheumatology, SLE, Sjogrens, anti-Ro, pregnancy, neonatal-lupus]
  - front: "What autoantibody is associated with drug-induced SLE, and which drugs most commonly cause it?"
    back: "Anti-histone antibodies are highly specific (95%) for drug-induced SLE. Common causative drugs: antihypertensives (hydralazine), anticonvulsants (phenytoin), antiarrhythmics (procainamide), isoniazid, biologics, minocycline. Symptoms resolve with discontinuation of the offending drug.\n\nDrug-induced lupus is characterized by anti-histone antibodies and resolves when the causative drug is stopped. It typically lacks renal and CNS involvement compared to idiopathic SLE. Procainamide and hydralazine are the classic high-risk agents."
    difficulty: medium
    tags: [rheumatology, drug-induced-lupus, anti-histone, SLE]
  - front: "What autoantibody is specific for CREST syndrome (limited systemic sclerosis), and which antibody is associated with diffuse systemic sclerosis and ILD?"
    back: "Anti-centromere antibody: specific for CREST (limited cutaneous SSc). Anti-topoisomerase I (anti-Scl-70): specific for SSc, associated with diffuse cutaneous SSc and increased risk of interstitial lung disease (ILD).\n\nCREST features Calcinosis, Raynaud's, Esophageal dysmotility, Sclerodactyly, and Telangiectasias. Limited SSc (CREST) carries anti-centromere antibody and has pulmonary HTN as a major complication. Diffuse SSc with anti-Scl-70 carries higher risk of ILD and renal crisis."
    difficulty: medium
    tags: [rheumatology, scleroderma, CREST, anti-centromere, anti-Scl70, autoantibodies]
  - front: "What does c-ANCA (anti-PR3 by ELISA) indicate, and which vasculitis is it most specific for?"
    back: "c-ANCA (anti-PR3 by ELISA) is 80-95% specific for Granulomatosis with Polyangiitis (GPA, formerly Wegener's). Present in 90% of active GPA. ELISA method (anti-PR3) is more specific than immunofluorescence technique.\n\nANCA-associated vasculitides include GPA, MPA, and EGPA. c-ANCA (cytoplasmic pattern) predominantly indicates anti-PR3 antibodies and strongly suggests GPA. p-ANCA (anti-MPO) is more commonly seen in MPA (60-80%) and EGPA. ELISA is preferred over immunofluorescence for specificity."
    difficulty: medium
    tags: [rheumatology, vasculitis, GPA, ANCA, c-ANCA]
  - front: "What is the 2010 ACR/EULAR scoring system for RA classification, and what score is required for definite RA?"
    back: "Score ≥6/10 is required for definite RA. Categories: A) Joint involvement (0-5 points; ≥10 joints including small = 5); B) Serology (0-3; high-positive RF or anti-CCP >3× ULN = 3); C) Acute phase reactants (0-1; abnormal CRP or ESR = 1); D) Symptom duration (0-1; ≥6 weeks = 1). Must have ≥1 joint with definite clinical synovitis not better explained by another diagnosis.\n\nThe 2010 ACR/EULAR criteria replaced the older 1987 criteria to enable earlier diagnosis. Small joint involvement, high-titre seropositivity, elevated inflammatory markers, and persistent symptoms all contribute to the score. The minimum requirement is at least one swollen joint."
    difficulty: hard
    tags: [rheumatology, rheumatoid-arthritis, classification-criteria, ACR-EULAR]
  - front: "What is the pathophysiology of RA at the cellular and molecular level?"
    back: "Autoimmune disorder with unknown etiology. Genetic predisposition (HLA-DR4/DR1 in 93%), environmental trigger (cigarette smoking induces citrullination via enzyme upregulation). Anti-CCP antibodies form. Synovial inflammation leads to pannus formation — invasive tissue that degrades cartilage and bone. Elevated TNF increases osteoclasts/decreases osteoblasts → periarticular osteopenia. Upregulation of RANK ligand → osteoclast-mediated bone destruction.\n\nRA pathogenesis involves loss of immune tolerance to citrullinated proteins, likely triggered by smoking. The resulting synovitis transforms the synovium into pannus, an invasive tissue. TNF-α and RANK-L are key mediators of bone erosion, making them therapeutic targets (anti-TNF biologics, denosumab)."
    difficulty: hard
    tags: [rheumatology, rheumatoid-arthritis, pathophysiology, pannus, TNF, HLA]
  - front: "Which joints are most commonly involved in RA, and what joint deformities are characteristic?"
    back: "Most common: MCPs, PIPs, wrists, MTPs (small joints of hands and feet). Symmetric distribution. Spares DIP joints (unlike OA and psoriatic arthritis). Classic deformities: swan neck (PIP hyperextension, DIP flexion), boutonnière (PIP flexion, DIP hyperextension), ulnar deviation and MCP subluxation, radial deviation of wrist, hammer/mallet/claw toes. C-spine: atlanto-axial subluxation (risk during intubation).\n\nRA preferentially affects synovial-lined joints and tendons. The pattern of small joint involvement with MCP/PIP/MTP involvement and DIP sparing helps differentiate RA from OA. C-spine involvement (atlanto-axial subluxation) is a critical surgical consideration requiring pre-operative C-spine X-ray."
    difficulty: medium
    tags: [rheumatology, rheumatoid-arthritis, joint-deformities, swan-neck, boutonniere]
  - front: "What are the poor prognostic factors in Rheumatoid Arthritis?"
    back: "Poor prognostic factors: young age of onset, high RF titre, elevated ESR, involvement of >20 joints, presence of extra-articular features (e.g. nodules, vasculitis, Felty's syndrome), positive anti-CCP, functional limitations at baseline.\n\nIdentifying poor prognostic factors early is critical because it guides treatment escalation (e.g., early biologics). RA is associated with increased overall mortality/morbidity from cardiovascular disease, lymphoma, and infections. Aggressive early treatment ('window of opportunity' in first 3 months) can improve long-term outcomes."
    difficulty: medium
    tags: [rheumatology, rheumatoid-arthritis, prognosis, poor-prognostic-factors]
  - front: "What are the extra-articular manifestations of RA classified by pathophysiology?"
    back: "Vasculitic: periungual infarctions, cutaneous ulcers, palpable purpura, episcleritis/scleritis, peri/myocarditis, pulmonary fibrosis/effusion/pleuritis, peripheral neuropathy (mononeuritis multiplex). Lymphocytic infiltrate: rheumatoid nodules, keratoconjunctivitis sicca (Sjögren's overlap), xerostomia, Hashimoto's thyroiditis. Hematologic: Felty's syndrome (arthritis + splenomegaly + neutropenia). Renal: amyloidosis.\n\nExtra-articular features reflect systemic inflammation beyond joints. Felty's syndrome (rare) consists of RA + splenomegaly + neutropenia and is associated with severe seropositive disease. Sjögren's overlap is common. Amyloidosis from chronic inflammation is a late renal complication."
    difficulty: medium
    tags: [rheumatology, rheumatoid-arthritis, extra-articular, Feltys-syndrome, nodules]
  - front: "What is the first-line DMARD for RA, what are its contraindications, and what monitoring is required before starting?"
    back: "Methotrexate (MTX) is gold standard and first-line DMARD for RA. Pre-treatment workup: CBC, liver enzymes (ALT), creatinine/creatinine clearance, hepatitis B and C serology, CXR. Contraindications: liver disease, significant alcohol intake, pregnancy, lactation. If MTX contraindicated: hydroxychloroquine (weaker), sulfasalazine, or leflunomide (more potent, also contraindicated in pregnancy, long washout period).\n\nMTX works by inhibiting dihydrofolate reductase and has anti-inflammatory effects. Pre-treatment assessment ensures no baseline hepatic/renal impairment or active infection. Combination therapy (MTX + hydroxychloroquine + SSZ, or MTX + biologic) is used when monotherapy is insufficient or poor prognostic features exist."
    difficulty: medium
    tags: [rheumatology, rheumatoid-arthritis, treatment, methotrexate, DMARDs]
  - front: "When should biologics (bDMARDs) be initiated in RA, and what are the first-line biologic options?"
    back: "Biologics should be initiated if inadequate response to DMARDs (after 3-6 months). Should be combined with DMARD therapy for faster response and longer duration of effect. First-line: anti-TNF agents — infliximab, etanercept, adalimumab, golimumab, certolizumab. Non-anti-TNF options: abatacept, rituximab, tocilizumab (anti-IL-6). Anakinra (IL-1 blocker) almost never used for RA.\n\nAnti-TNF biologics are the primary biologic class in RA and target the key cytokine mediating synovial inflammation. Combination with MTX reduces immunogenicity and enhances efficacy. JAK inhibitors (tofacitinib, upadacitinib) are oral synthetic DMARDs considered after DMARD failure."
    difficulty: medium
    tags: [rheumatology, rheumatoid-arthritis, biologics, anti-TNF, bDMARDs]
  - front: "What is the RA classification of global functional status?"
    back: "Class I: performs all usual ADLs (self-care, vocational, avocational). Class II: performs self-care and vocational; restriction of avocational. Class III: performs self-care only; restriction of vocational and avocational. Class IV: limited ability to perform self-care, vocational, and avocational activities.\n\nThis functional classification provides a standardized way to assess RA disease burden and therapeutic response. It complements disease activity measures (swollen joint count, CRP, ESR) and helps justify escalation of therapy or surgical intervention."
    difficulty: easy
    tags: [rheumatology, rheumatoid-arthritis, functional-status, classification]
  - front: "What is the entry criterion for the 2019 EULAR/ACR SLE classification criteria, and what total score is required for diagnosis?"
    back: "Entry criterion: ANA titre ≥1:80. Total score ≥10 with at least one clinical criterion required for SLE classification. Criteria span clinical domains (constitutional, hematologic, neuropsychiatric, mucocutaneous, serosal, musculoskeletal, renal) and immunologic domains (antiphospholipid antibodies, complement, SLE-specific antibodies).\n\nThe 2019 EULAR/ACR criteria replaced the older ACR criteria and are weighted/additive. Key high-scoring items include Class III/IV lupus nephritis (10 points), acute cutaneous lupus (6 points), seizure (5 points), and pleural/pericardial effusion (5 points). Anti-dsDNA or anti-Sm positivity contributes 6 points."
    difficulty: hard
    tags: [rheumatology, SLE, classification-criteria, EULAR-ACR-2019]
  - front: "What are the multisystem clinical features of SLE?"
    back: "Systemic: fatigue, fever, lymphadenopathy. Hematologic: hemolytic anemia, leukopenia, thrombocytopenia, splenomegaly. Renal: glomerulonephritis (hematuria, proteinuria, casts). Dermatologic: malar rash, discoid rash, photosensitivity, oral ulcers, alopecia. Musculoskeletal: Jaccoud's arthritis (non-erosive, reducible). Cardiac: pericarditis, Libman-Sacks endocarditis, CAD. Neurologic: seizures, psychosis, stroke. Vascular: Raynaud's, livedo reticularis. Respiratory: pleuritis, pulmonary HTN.\n\nSLE is a prototypical multisystem autoimmune disease. The malar (butterfly) rash spares nasolabial folds. Jaccoud's arthritis is non-erosive and reducible, distinguishing it from RA. Libman-Sacks is non-bacterial endocarditis associated with APLA. SLE is an independent risk factor for atherosclerosis/CAD."
    difficulty: medium
    tags: [rheumatology, SLE, clinical-features, multisystem]
  - front: "How is SLE monitored serologically, and which tests track disease activity versus diagnosis?"
    back: "Disease activity monitoring: anti-dsDNA titre (rises with flares) and serum complement (C3, C4 decrease with flares). ANA titre is NOT useful for monitoring disease course — only used for screening/diagnosis. Anti-Sm is static (remains positive throughout course). APLA (anti-cardiolipin, lupus anticoagulant, anti-B2GP1) assessed for thrombosis risk.\n\nA clinically useful teaching point: ANA is for diagnosis, not monitoring. Anti-dsDNA + C3/C4 are the monitoring pair — rising anti-dsDNA with falling complement predicts a flare. This guides decisions on escalating immunosuppression."
    difficulty: hard
    tags: [rheumatology, SLE, monitoring, anti-dsDNA, complement, ANA]
  - front: "What is the treatment approach for SLE organized by organ system and severity?"
    back: "Mild/dermatologic: hydroxychloroquine (first-line; reduces mortality, prevents flares) + topical steroids, sunscreen. Musculoskeletal: NSAIDs + hydroxychloroquine. Organ-threatening: high-dose prednisone or IV methylprednisolone. Steroid-sparing: azathioprine, MTX, mycophenolate. Lupus nephritis: cyclophosphamide IV (induction) or mycophenolate mofetil (induction). Refractory: rituximab, anifrolumab (anti-Type I interferon). Moderate refractory: belimumab. APLA: avoid estrogen-containing contraceptives.\n\nHydroxychloroquine is the cornerstone of SLE treatment for all patients unless contraindicated — it reduces mortality and prevents flares. Cyclophosphamide is reserved for severe organ involvement (nephritis, cerebritis). Anifrolumab is a newer agent blocking Type I interferons, key to SLE pathogenesis."
    difficulty: hard
    tags: [rheumatology, SLE, treatment, hydroxychloroquine, cyclophosphamide, mycophenolate]
  - front: "What are the classification criteria for Antiphospholipid Antibody Syndrome (APS), and what laboratory tests are required?"
    back: "APS requires 1 clinical AND 1 laboratory criterion. Clinical: vascular thrombosis (confirmed by imaging/histopathology) OR pregnancy morbidity (≥1 fetal death ≥10 wk, premature birth <34 wk due to eclampsia/placental insufficiency, or ≥3 consecutive spontaneous abortions <10 wk). Laboratory: lupus anticoagulant, anti-cardiolipin IgG/IgM (medium-high titre >40 GPL/MPL), or anti-B2GP1 IgG/IgM (>99th percentile). Labs must be positive on 2 occasions ≥12 weeks apart.\n\nThe '12 weeks apart' requirement is critical to exclude transient antibody positivity from infection. Arterial and venous thromboses in APS are usually mutually exclusive. False positive VDRL is seen in APLA carriers due to phospholipid cross-reactivity."
    difficulty: hard
    tags: [rheumatology, APS, antiphospholipid, thrombosis, classification-criteria]
  - front: "What is catastrophic APS, and how is it treated?"
    back: "Catastrophic APS: development within 1 week of small vessel thrombotic occlusion in ≥3 organ systems with positive APLA. Associated with high mortality. Treatment: high-dose steroids + anticoagulation + cyclophosphamide + plasmapheresis. Treat any triggering factor (infection, malignancy). Refractory: rituximab (B cell depletion) or eculizumab (complement inhibition).\n\nCatastrophic APS is a medical emergency. The multi-organ microvascular occlusion distinguishes it from typical APS. The treatment combines immunosuppression, anticoagulation, and plasma exchange to simultaneously reduce antibody burden and prevent further thrombosis."
    difficulty: hard
    tags: [rheumatology, APS, catastrophic-APS, treatment, emergency]
  - front: "What is the anticoagulation target INR in APS for different thrombotic scenarios?"
    back: "First venous thrombotic event: target INR 2.0-3.0 (lifelong warfarin). Recurrent venous event or arterial thrombosis: target INR >3.0, or INR 2-3 with addition of ASA. Obstetric APS: LMWH + ASA during pregnancy; prophylactic heparin for 6 weeks postpartum to reduce maternal thrombosis risk.\n\nLifelong anticoagulation distinguishes APS management from standard DVT treatment. Obstetric APS is treated with anticoagulation during pregnancy (warfarin is teratogenic, so LMWH is used) plus low-dose ASA. The postpartum period carries particularly high thrombosis risk."
    difficulty: hard
    tags: [rheumatology, APS, anticoagulation, warfarin, INR, obstetric-APS]
  - front: "What are the two main subtypes of systemic sclerosis (scleroderma), and how do they differ?"
    back: "Limited systemic sclerosis (CREST): skin involvement restricted to hands, face, neck (distal to elbows/knees); anti-centromere Ab; pulmonary HTN is major complication; survival >70% at 10 years. Diffuse systemic sclerosis: widespread skin disease (proximal, can involve trunk), early visceral involvement (renal, pulmonary fibrosis); anti-topoisomerase I (anti-Scl-70); survival 40-60% at 10 years.\n\nCREST mnemonic: Calcinosis, Raynaud's, Esophageal dysmotility, Sclerodactyly, Telangiectasia. Limited SSc has a more favorable prognosis but can develop pulmonary arterial HTN late. Diffuse SSc carries worse prognosis due to early renal and pulmonary fibrosis involvement."
    difficulty: medium
    tags: [rheumatology, scleroderma, systemic-sclerosis, CREST, limited-vs-diffuse]
  - front: "What is the ACR/EULAR sufficient criterion for classification of scleroderma, and what score is required for definite diagnosis?"
    back: "Sufficient criterion: skin thickening of fingers of both hands extending proximal to the MCP joints (score 9, immediate definite classification). Otherwise, score ≥9 is required using additional items: puffy fingers (2), sclerodactyly (4), digital tip ulcers (4), fingertip pitting scars, telangiectasias (2), abnormal nailfold capillaries (3), pulmonary arterial HTN (2), ILD (2), Raynaud's phenomenon (2), scleroderma-related antibodies (2 each). Sensitivity 0.95, specificity 0.93.\n\nThe ACR/EULAR 2013 criteria for SSc replaced the 1980 criteria to improve sensitivity for early/limited disease. The sufficient criterion (proximal skin thickening) immediately classifies a patient. Without this, points are tallied across vascular, dermatologic, antibody, and organ involvement domains."
    difficulty: hard
    tags: [rheumatology, scleroderma, classification-criteria, ACR-EULAR]
  - front: "What are the gastrointestinal manifestations of scleroderma, and what is the pathognomonic radiographic finding?"
    back: "GI involvement in ~90% of SSc. Distal esophageal hypomotility → dysphagia. Loss of LES function → GERD, ulcerations, strictures. Small bowel hypomotility → bacterial overgrowth, diarrhea, bloating, malabsorption. Large bowel hypomotility + wide-mouth diverticula (pathognomonic on barium study). Treatment: PPIs for GERD; broad-spectrum antibiotics for bacterial overgrowth; prokinetics for motility disturbances.\n\nWide-mouth (saccular) diverticula on the antimesenteric border of the colon on barium enema are pathognomonic of scleroderma. GI hypomotility results from smooth muscle fibrosis. Unlike most GI conditions, the diverticula in SSc are wide-mouthed due to loss of smooth muscle support rather than mucosal herniation."
    difficulty: hard
    tags: [rheumatology, scleroderma, GI-manifestations, wide-mouth-diverticula, GERD]
  - front: "How is interstitial lung disease (ILD) in systemic sclerosis treated, and which antibody predicts ILD risk?"
    back: "Anti-topoisomerase I (anti-Scl-70) is associated with increased risk of ILD in SSc. First-line treatment: mycophenolate mofetil (less toxicity, better tolerated) or cyclophosphamide for 1 year. Other options: tocilizumab, rituximab. Anti-fibrotic therapy: nintedanib (TKI). Pulmonary HTN: vasodilators (bosentan, epoprostenol, PDE5 inhibitors). Rapidly progressive disease: consider hematopoietic stem cell transplantation.\n\nILD and pulmonary HTN are the most common causes of morbidity and mortality in SSc. The SLS-II trial showed mycophenolate mofetil was equivalent to cyclophosphamide in SSc-ILD with better tolerability, making it the preferred agent. Nintedanib is specifically approved for SSc-ILD as an anti-fibrotic."
    difficulty: hard
    tags: [rheumatology, scleroderma, ILD, mycophenolate, nintedanib, treatment]
  - front: "What are Raynaud's phenomenon features that suggest a pathologic (secondary) cause versus primary (idiopathic)?"
    back: "Features suggesting pathologic Raynaud's: new onset (not lifelong), asymmetric, precipitated by stimuli other than cold/emotion, associated with digital pulp pitting or tissue reabsorption, digital ischemia, capillary dilatation on capillaroscopy. DDx (COLD HAND): Connective tissue disease, Obstruction/Occupational, Lupus/other CTD, DM/Drugs, Hematologic (polycythemia/leukemia), Arterial problems, Neurologic, Disease unknown (idiopathic). Scleroderma is the most common secondary cause.\n\nPrimary Raynaud's is symmetric, triggered by cold/emotion, without tissue injury, and has no underlying disease. Secondary Raynaud's typically develops in middle age, may be asymmetric, causes tissue injury (pitting, gangrene), and has abnormal nailfold capillaries on capillaroscopy — a key screening tool."
    difficulty: medium
    tags: [rheumatology, Raynauds-phenomenon, scleroderma, primary-vs-secondary]
  - front: "What are the classification and key features of Idiopathic Inflammatory Myopathies (IIM)?"
    back: "IIM include: Dermatomyositis (DMM), Polymyositis (PM), Necrotizing autoimmune myopathy (NAM), and Inclusion Body Myositis (IBM). Newer subgroups: immune-mediated necrotizing myopathy, anti-synthetase syndrome, anti-MDA5 DM, cancer-associated myositis, overlap myositis. IBM: age >50, M>F, slowly progressive, predominantly distal > proximal weakness, vacuoles on biopsy, unresponsive to treatment. All associated with malignancy risk (DMM > PM).\n\nIIM are characterized by proximal muscle weakness and elevated CK. IBM is unique in causing distal > proximal weakness and is treatment-refractory. The association with malignancy is highest in DMM, particularly with anti-p155/140 antibodies, requiring cancer screening at diagnosis."
    difficulty: medium
    tags: [rheumatology, inflammatory-myopathy, dermatomyositis, polymyositis, inclusion-body-myositis]
  - front: "What are the characteristic skin findings of Dermatomyositis (DMM)?"
    back: "Gottron's papules (pathognomonic): pink-violaceous flat-topped papules overlying dorsal surface of MCP and IP joints (occur in 70% of DMM). Gottron's sign: erythematous patches over extensor surfaces of elbows, knees, medial malleoli. Heliotrope rash: violaceous rash over eyelids with edema. Shawl sign: poikilodermatous erythema over neck, upper chest, shoulders. Mechanic's hands: dry, crackled lesions on palmar/lateral surfaces of digits (also seen in anti-synthetase syndrome). Periungual erythema, calcinosis.\n\nGottron's papules over MCP/IP joints are pathognomonic of DMM. Heliotrope rash is highly characteristic. The shawl sign reflects photodistributed involvement. Mechanic's hands, when present alongside ILD and anti-Jo-1 antibodies, constitute anti-synthetase syndrome."
    difficulty: medium
    tags: [rheumatology, dermatomyositis, skin-findings, Gottrons-papules, heliotrope]
  - front: "What is the pathophysiology of Polymyositis versus Dermatomyositis at the cellular level?"
    back: "Polymyositis (PM): T cell-mediated process; CD8+ T cells are primary effectors; focal endomysial infiltrates surrounding muscle fibres; myocytes are primary target; occurs in adults. Dermatomyositis (DMM): complement-mediated process; perivascular inflammatory infiltrates (CD4+ > CD8+ T cells); leads to perifascicular atrophy of muscle fibres.\n\nThe cellular distinction between PM and DMM has implications for understanding immune pathways. PM is cell-mediated (MHC-I on myocytes triggers CD8+ cytotoxicity). DMM is humoral/complement-mediated (deposition of membrane attack complex in capillaries causes ischemic perifascicular atrophy). This explains why DMM has prominent skin findings."
    difficulty: hard
    tags: [rheumatology, dermatomyositis, polymyositis, pathophysiology, CD8, CD4, complement]
  - front: "What investigations are used to diagnose Polymyositis/Dermatomyositis, and what is the role of muscle biopsy?"
    back: "Lab: CK (elevated in 80% of DMM; elevated in PM), CBC, ESR/CRP, TSH, ANA, anti-Jo-1, anti-Mi-2, anti-SRP. EMG: characteristic changes of muscle inflammation/damage. MRI: used to localize biopsy site. Muscle biopsy: can aid in diagnosis but NOT needed if classic skin findings (Gottron's papules, heliotrope rash) plus proximal muscle weakness are present — clinical diagnosis sufficient in typical DMM.\n\nAnti-Jo-1 is the most common myositis-specific antibody and is associated with ILD and anti-synthetase syndrome. Anti-Mi-2 is specific but not sensitive for DMM (15-20%). Anti-SRP is associated with necrotizing myopathy. CK elevation correlates with active muscle inflammation and is used to monitor treatment response."
    difficulty: medium
    tags: [rheumatology, dermatomyositis, polymyositis, investigations, muscle-biopsy, anti-Jo1]
  - front: "Which malignancy-associated features increase risk of cancer in inflammatory myopathy patients?"
    back: "Risk factors for malignancy in IIM: age >50, DMM > PM (DMM has higher risk), elevated CK, peak incidence of malignancy at onset or within first year of myositis, dysphagia, ulcerative skin lesions, cutaneous vasculitis, anti-p155/140 antibodies. Malignancy screening is recommended at diagnosis and periodically thereafter.\n\nThe association between IIM and malignancy is well-established, particularly for DMM. Cancer can trigger inflammatory myopathy as a paraneoplastic syndrome. Anti-TIF1-γ (anti-p155/140) is strongly associated with cancer-associated myositis. Common associated cancers: ovarian, lung, GI, and breast carcinomas."
    difficulty: hard
    tags: [rheumatology, dermatomyositis, paraneoplastic, malignancy, inflammatory-myopathy]
  - front: "A 35-year-old woman presents with symmetric joint swelling in her MCPs and PIPs, morning stiffness lasting 3 hours, elevated CRP, and positive RF and anti-CCP. How would you score her using the 2010 ACR/EULAR RA criteria?"
    back: "Joint involvement: multiple small joints involved — if 4-10 small joints = 3 points, or if >10 joints = 5 points (assume at least 3 points). Serology: positive RF and anti-CCP — if >3× ULN = 3 points; if low positive = 2 points. Acute phase reactants: elevated CRP = 1 point. Symptom duration: assuming >6 weeks = 1 point. Total ≥6 = definite RA. Must confirm at least 1 joint with definite synovitis not better explained by another diagnosis.\n\nThis vignette is classic RA. The combination of small joint symmetric arthritis, morning stiffness, elevated inflammatory markers, and dual seropositivity (RF + anti-CCP) with symptoms >6 weeks would easily score ≥6. Early diagnosis enables prompt DMARD initiation within the therapeutic 'window of opportunity.'"
    difficulty: hard
    tags: [rheumatology, rheumatoid-arthritis, clinical-vignette, diagnosis, ACR-EULAR-criteria]
  - front: "A patient with known SLE develops worsening proteinuria, rising anti-dsDNA titre, and falling C3/C4. What do these findings indicate and what is the next step?"
    back: "This pattern indicates an SLE flare with likely lupus nephritis (worsening proteinuria = renal involvement). Rising anti-dsDNA and falling complement (C3/C4) are serologically concordant markers of disease activity. Next step: renal biopsy to classify lupus nephritis (Class I-VI). Treatment based on class: Class III/IV (proliferative) requires induction with cyclophosphamide IV or mycophenolate mofetil, plus high-dose steroids.\n\nAnti-dsDNA and complement levels are the key monitoring tools in SLE (not ANA). Lupus nephritis Classes III and IV are the most severe and require aggressive immunosuppression. Mycophenolate mofetil is now preferred over cyclophosphamide for induction in many patients due to equivalent efficacy and better tolerability."
    difficulty: hard
    tags: [rheumatology, SLE, lupus-nephritis, monitoring, disease-activity, treatment]
  - front: "What is anti-synthetase syndrome and what are its key features?"
    back: "Anti-synthetase syndrome is a subtype of inflammatory myopathy characterized by: anti-aminoacyl-tRNA synthetase antibodies (most commonly anti-Jo-1), interstitial lung disease (ILD), inflammatory myositis (proximal weakness), mechanic's hands (dry, crackled lesions on palmar/lateral digits), Raynaud's phenomenon, and non-erosive arthritis. It can occur in DMM and PM subsets.\n\nAnti-Jo-1 is the most common myositis-specific antibody and defines the anti-synthetase syndrome. ILD is the most life-threatening feature. Mechanic's hands are a distinctive dermatologic finding. The syndrome requires aggressive immunosuppression targeting both myositis and ILD components."
    difficulty: hard
    tags: [rheumatology, anti-synthetase-syndrome, anti-Jo1, ILD, dermatomyositis, polymyositis]
  - front: "What is Inclusion Body Myositis (IBM) and how does it differ from Polymyositis?"
    back: "IBM: age >50, M>F, slowly progressive course over years. Predominantly DISTAL > proximal muscle weakness (opposite of PM/DMM). Muscle biopsy: vacuoles (rimmed vacuoles) with inclusion bodies. Unresponsive to immunosuppressive treatment. Unlike PM (T cell-mediated, responds to steroids), IBM has degenerative features alongside inflammation and is treatment-refractory.\n\nIBM is the most common acquired myopathy in patients >50 years. The distal pattern (finger flexors, knee extensors affected early) contrasts with PM/DMM. The treatment refractoriness is a key MCCQE1 point — steroids and other immunosuppressants do not benefit IBM. Genetic counselling and supportive care are the mainstays."
    difficulty: medium
    tags: [rheumatology, inclusion-body-myositis, IBM, myopathy, distal-weakness]
  - front: "What is the epidemiology of SLE and what factors increase disease risk?"
    back: "Prevalence 0.05%. M:F = 1:10. Age of onset in reproductive years (15-45). More common and severe in Hispanic, Asian, and individuals of African descent. Risk increased by: combined OCP use, hormone replacement therapy, UV radiation, smoking, vitamin D deficiency, silica dust exposure. HLA-B8/DR3 association; ~10% positive family history. Bimodal mortality: early (active SLE/nephritis/infection) and late (atherosclerosis).\n\nThe strong female predominance (10:1) reflects estrogen's role in promoting SLE — estrogenic metabolites are elevated in affected males. The reproductive-age onset correlates with hormonal influence. Estrogen-containing contraceptives are relatively contraindicated, especially with APLA."
    difficulty: easy
    tags: [rheumatology, SLE, epidemiology, risk-factors]
  - front: "What are the first-line and adjunctive pharmacological treatments for inflammatory myopathy (dermatomyositis/polymyositis)?"
    back: "First-line: high-dose glucocorticoids (prednisone 1 mg/kg/d, not exceeding 80 mg/d) with slow taper after ~6 weeks of improvement. Add immunosuppressive agents (azathioprine, MTX). IVIG for severe or refractory muscle weakness with dysphagia/dyspnea. Rituximab for severe/refractory muscle disease or ILD. Hydroxychloroquine for dermatomyositis (DMM) rash.\n\nHigh-dose steroids remain the cornerstone of induction therapy. Steroid-sparing agents reduce cumulative toxicity. IVIG is used when functional swallowing or breathing is compromised. Rituximab targets B-cell-mediated mechanisms in refractory cases."
    difficulty: medium
    tags: [rheumatology, myositis, dermatomyositis, polymyositis, treatment, glucocorticoids, rituximab, IVIG]
  - front: "What malignancy surveillance is recommended for patients with inflammatory myopathy (dermatomyositis/polymyositis)?"
    back: "Detailed history and physical (breast, pelvic, rectal exams). CXR, abdominal and pelvic ultrasound, fecal occult blood, Pap test, mammogram, plus CT scan of thorax, abdomen, and pelvis.\n\nInflammatory myopathies, especially dermatomyositis, are strongly associated with occult malignancy. Comprehensive surveillance at diagnosis and annually thereafter is essential to identify underlying cancers that may drive the myopathy."
    difficulty: medium
    tags: [rheumatology, dermatomyositis, polymyositis, malignancy, cancer screening, surveillance]
  - front: "What is Sjögren's syndrome and what are its key epidemiologic features?"
    back: "Autoimmune condition characterized by dry eyes (keratoconjunctivitis sicca/xerophthalmia) and dry mouth (xerostomia), caused by lymphocytic infiltration of salivary and lacrimal glands. Prevalence 0.5%, F:M = 10:1, age 40–60 years. Primary and secondary forms (secondary associated with RA, SLE, DMM, HIV). Increased risk of non-Hodgkin's lymphoma (lifetime incidence 6–7%).\n\nSjögren's has a strong female predominance and can be primary or secondary to other CTDs. The significantly elevated risk of NHL (particularly MALT lymphoma) makes monitoring essential."
    difficulty: easy
    tags: [rheumatology, Sjogrens syndrome, epidemiology, lymphoma, autoimmune]
  - front: "What are the ACR/EULAR classification criteria items and scores for primary Sjögren's syndrome?"
    back: "Score ≥4 required (after inclusion criteria met, no exclusion criteria): Labial salivary gland biopsy with focal lymphocytic sialadenitis (focus score ≥1/4mm²) = 3 points; Anti-SSA/Ro-positive = 3 points; Ocular staining score ≥5 (or van Bijsterveld ≥4 on at least one eye) = 1 point; Schirmer's test <5 mm/5 min on at least one eye = 1 point; Unstimulated whole saliva flow rate <0.1 mL/min = 1 point.\n\nThe ACR/EULAR 2017 criteria require ≥4 points with the highest-weighted items being salivary gland biopsy and Anti-SSA/Ro seropositivity. These two alone (total 6 points) can diagnose SS without functional tests."
    difficulty: hard
    tags: [rheumatology, Sjogrens syndrome, classification criteria, ACR, EULAR, anti-SSA, anti-Ro]
  - front: "What are the extraglandular manifestations of Sjögren's syndrome?"
    back: "Fatigue, low-grade fever; autoimmune thyroid dysfunction; arthralgias/arthritis (small joint, asymmetric, non-erosive); subclinical diffuse ILD, xerotrachea (dry chronic cough); renal disease, glomerulonephritis; palpable purpura, vasculitis; peripheral neuropathy; increased lymphoma risk.\n\nUp to 20% of Sjögren's patients develop systemic extraglandular disease. The arthritis is non-erosive unless the patient has co-existing RA, in which case it becomes erosive and symmetric. Vasculitis and lymphoma risk are serious complications."
    difficulty: medium
    tags: [rheumatology, Sjogrens syndrome, extraglandular, ILD, vasculitis, neuropathy, lymphoma]
  - front: "What are the treatment options for Sjögren's syndrome?"
    back: "Ocular: artificial tears/tear gel, moisture-retaining eyewear, humidifiers, surgical punctal occlusion. Oral: good dental hygiene, hydration, avoid alcohol/tobacco, pilocarpine (parasympathomimetic to stimulate salivary flow), topical nystatin or clotrimazole for oral candidiasis. Systemic: hydroxychloroquine and corticosteroids are generally ineffective; rituximab for severe organ-threatening disease (e.g., vasculitis).\n\nManagement is mostly symptomatic. Pilocarpine stimulates muscarinic receptors to increase salivation. Systemic immunosuppression has limited efficacy in Sjögren's except for specific organ-threatening complications like vasculitis."
    difficulty: medium
    tags: [rheumatology, Sjogrens syndrome, treatment, pilocarpine, rituximab, artificial tears]
  - front: "What defines Mixed Connective Tissue Disease (MCTD) and what is its key antibody?"
    back: "MCTD is a syndrome with features of three different CTDs (SLE, scleroderma, myositis). Common symptoms include Raynaud's phenomenon and swollen fingers. The key antibody is anti-RNP. Pulmonary arterial hypertension (PAH) is a major cause of death.\n\nMCTD overlaps multiple CTDs and is defined by anti-U1-RNP antibodies. The prognosis is variable — some go into remission, others evolve into a distinct CTD, and some develop severe disease with PAH as the leading cause of mortality."
    difficulty: easy
    tags: [rheumatology, MCTD, mixed connective tissue disease, anti-RNP, Raynaud, pulmonary hypertension]
  - front: "How is vasculitis classified by vessel size and what are the main categories?"
    back: "Large vessel: GCA/temporal arteritis (affects extracranial arteries, age >50), Takayasu's arteritis (pulseless disease, young Asian adults). Medium vessel: PAN (ANCA-negative, lung-sparing), Kawasaki disease. Small vessel ANCA-associated: GPA (c-ANCA/PR3), MPA (p-ANCA/MPO), EGPA (50% ANCA+, MPO). Small vessel non-ANCA: IgA vasculitis (HSP), cryoglobulinemic vasculitis, cutaneous vasculitis, anti-GBM disease.\n\nThe Chapel Hill Consensus classification organizes vasculitides by vessel size, which guides clinical presentation and treatment approach. Knowing the prototypic antibody (ANCA subtype) is essential for MCCQE1."
    difficulty: medium
    tags: [rheumatology, vasculitis, classification, ANCA, GCA, GPA, MPA, EGPA, PAN, Takayasu]
  - front: "What are the classic clinical features of cutaneous (leukocytoclastic) vasculitis and its common causes?"
    back: "Clinical: palpable purpura on lower extremities, vesicles, ulceration, urticaria, macules, papules, bullae, subcutaneous nodules. Renal or joint involvement may occur (especially in children). Causes: drug-induced (allopurinol, gold, sulfonamides, penicillin, phenytoin), viral/bacterial infection, idiopathic. Pathology: leukocytoclastic vasculitis of post-capillary venules with neutrophil debris. Treatment: stop offending drug, treat underlying disease, NSAIDs, low-dose corticosteroids.\n\nCutaneous vasculitis is the most common form and is characterized by immune complex deposition in small vessels (post-capillary venules). It is usually self-limiting but can recur and occasionally requires immunosuppression."
    difficulty: medium
    tags: [rheumatology, vasculitis, cutaneous vasculitis, leukocytoclastic, palpable purpura, drug-induced]
  - front: "What are the ACR 2022 classification criteria for GPA and the scoring threshold?"
    back: "Diagnosed if score ≥5. Nasal involvement (crusting, ulcers, epistaxis, congestion, septal perforation): +3. Cartilaginous involvement (ear/nose, hoarseness, saddle nose): +2. Hearing loss: +1. c-ANCA or anti-PR3 positive: +5. Pulmonary nodules/mass/cavitation on chest imaging: +2. Granuloma/giant cells on biopsy: +2. Sinus/mastoid inflammation on imaging: +1. Pauci-immune GN on biopsy: +2. p-ANCA or anti-MPO: -1. Eosinophils >1×10⁹/L: -4.\n\nThe 2022 ACR criteria replace the older 1990 criteria. The high weight on PR3-ANCA (+5) and nasal involvement (+3) reflects their diagnostic specificity. Negative weights for MPO and eosinophilia help distinguish GPA from EGPA/MPA."
    difficulty: hard
    tags: [rheumatology, GPA, classification criteria, ACR, ANCA, PR3]
  - front: "What is the treatment for severe, life/organ-threatening Granulomatosis with Polyangiitis (GPA)?"
    back: "Induction: IV glucocorticoids (methylprednisolone 0.5–1.0 g/d IV x1–3 d, then prednisone 1 mg/kg/d PO x2–4 wk with gradual taper) PLUS either cyclophosphamide (2 mg/kg/d PO max 3–6 mo, or IV 15 mg/kg every 2 wk x3 then every 3 wk) OR rituximab (375 mg/m² x4 weekly OR 1 g IV x2 doses 14 d apart). Maintenance: rituximab (1st line), or azathioprine/MTX/mycophenolate. Prophylaxis: TMP-SMX 160/800 mg PO 3x/wk for PJP. Plasma exchange NOT recommended for initial induction.\n\nThe RAVE trial demonstrated rituximab non-inferiority to cyclophosphamide for induction in ANCA-vasculitis. Rituximab is now also first-line maintenance. PJP prophylaxis is mandatory given the combination of cyclophosphamide and high-dose steroids."
    difficulty: hard
    tags: [rheumatology, GPA, treatment, cyclophosphamide, rituximab, glucocorticoids, PJP prophylaxis, RAVE trial]
  - front: "What are the key features that distinguish Polyarteritis Nodosa (PAN) from other vasculitides?"
    back: "PAN is a systemic necrotizing vasculitis of medium-sized vessels. It is ANCA-negative and classically lung-sparing. 5–10% associated with hepatitis B. Affects visceral arteries and their branches. CT/MRI angiography shows beading of blood vessels with aneurysms. Incidence 0.7/100,000; affects 40–60 year olds; M:F = 1:2.\n\nPAN's lung-sparing nature and ANCA negativity distinguish it from GPA and MPA. The association with hepatitis B is clinically important — treatment differs (antivirals + plasma exchange rather than long-term immunosuppression). Aneurysms on angiography are characteristic."
    difficulty: medium
    tags: [rheumatology, PAN, polyarteritis nodosa, ANCA-negative, hepatitis B, medium vessel, vasculitis]
  - front: "What is the Five-Factor Score (FFS) used for in PAN, and what factors comprise it?"
    back: "The FFS is a survival prognostic score for PAN (and EGPA) that guides treatment intensity. Five factors: (1) cardiomyopathy due to vasculitis, (2) CNS involvement due to vasculitis, (3) severe GI involvement due to vasculitis, (4) serum creatinine >140 µmol/L, (5) proteinuria >1 g/day. FFS = 0 (no major organ involvement): glucocorticoids + azathioprine. FFS ≥1: high-dose glucocorticoids + cyclophosphamide for 3–6 mo, then maintenance for minimum 18 months.\n\nThe FFS stratifies PAN patients by organ-threatening features to guide whether cyclophosphamide induction is required. A higher FFS correlates with worse prognosis and warrants more aggressive immunosuppression."
    difficulty: hard
    tags: [rheumatology, PAN, five-factor score, FFS, prognosis, cyclophosphamide, treatment]
  - front: "What is the treatment for hepatitis B virus (HBV)-associated PAN?"
    back: "Prednisone 1 mg/kg/d PO x7 d (then taper and withdraw by 14 d) + methylprednisolone 15 mg/kg/d IV x1–3 d. After corticosteroid therapy: plasma exchange + antiviral therapy. Rationale: prolonged immunosuppression promotes HBV replication; plasma exchange removes immune complexes; antivirals treat the underlying trigger.\n\nHBV-associated PAN is treated differently because sustained immunosuppression promotes viral replication and worsening liver disease. The goal is to briefly dampen inflammation then transition to antiviral therapy to eliminate the trigger."
    difficulty: hard
    tags: [rheumatology, PAN, hepatitis B, treatment, plasma exchange, antiviral, prednisone]
  - front: "What are the classification criteria for Giant Cell Arteritis (GCA) and the diagnostic threshold?"
    back: "Absolute requirement: age ≥50. Score ≥6 required from: Morning stiffness in shoulders/neck (+2), Sudden visual loss (+3), Jaw or tongue claudication (+2), New temporal headache (+2), Scalp tenderness (+2), Abnormal temporal artery exam (+2), ESR ≥50 mm/h or CRP ≥10 mg/L (+3), Positive temporal artery biopsy or halo sign on temporal artery US (+5), Bilateral axillary involvement (+2), FDG-PET activity throughout aorta (+2). Cumulative score ≥6 = sensitivity 87%, specificity 95%.\n\nThe 2022 ACR GCA criteria give the highest weight to temporal artery biopsy/ultrasound halo sign (+5). New imaging modalities (PET, US) have replaced biopsy in some centres. The absolute age requirement (≥50) reflects that GCA almost never occurs in younger patients."
    difficulty: hard
    tags: [rheumatology, GCA, giant cell arteritis, temporal arteritis, classification criteria, ACR, halo sign]
  - front: "What are the clinical features of Giant Cell Arteritis (GCA)?"
    back: "Most common vasculitis in North America. Age >50 (peak 70–80), F:M = 2:1. Features: new-onset temporal headache + scalp tenderness overlying temporal artery; sudden painless vision loss/diplopia (ophthalmic or posterior ciliary artery involvement); jaw/tongue claudication; PMR (proximal shoulder/pelvic girdle pain, stiffness, elevated ESR) — most common extracranial symptom; aortic arch syndrome (pulseless disease); constitutional symptoms. Untreated: permanent blindness in 20–25%.\n\nGCA is a medical emergency when vision is threatened. The combination of jaw claudication and temporal headache in an elderly patient with elevated ESR/CRP should prompt immediate treatment before confirmation by biopsy to prevent irreversible vision loss."
    difficulty: medium
    tags: [rheumatology, GCA, giant cell arteritis, temporal arteritis, vision loss, jaw claudication, PMR]
  - front: "What is the treatment for GCA and what is the approach when vision loss is present?"
    back: "Suspected GCA (no vision loss): immediately start prednisone 1 mg/kg PO in divided doses x2–4 wk, then taper 10 mg per 1–2 wk as symptoms resolve. With vision loss at diagnosis: methylprednisolone 1000 mg/d IV x3 d followed by high-dose prednisone 1 mg/kg/d PO with taper. Consider low-dose ASA if vertebral/carotid involvement. Tocilizumab (IL-6 receptor monoclonal Ab) can be added to glucocorticoids (new or relapsing). Screening: yearly CXR + abdominal US (thoracic aortic aneurysm risk).\n\nTreatment must not be delayed for biopsy results as GCA biopsy remains positive for up to 2 weeks after starting steroids. Tocilizumab enables steroid-sparing and is approved for GCA. Long-term risk of thoracic aortic aneurysm warrants annual imaging."
    difficulty: hard
    tags: [rheumatology, GCA, treatment, prednisone, methylprednisolone, tocilizumab, vision loss, aortic aneurysm]
  - front: "What are the ANCA subtypes and which vasculitides are they associated with?"
    back: "c-ANCA (cytoplasmic pattern, PR3-ANCA): primarily GPA (Wegener's). p-ANCA (perinuclear pattern, MPO-ANCA): primarily MPA (70% ANCA+), EGPA (40–50%, mostly MPO). Note: p-ANCA with other antigens (lactoferrin, cathepsin, elastase) can be seen in IBD and other conditions. Only MPO antibodies have been associated with the development of vasculitis.\n\nThe ANCA subtype (c vs p; PR3 vs MPO) helps classify ANCA-associated vasculitis. PR3-ANCA strongly suggests GPA, while MPO-ANCA suggests MPA or EGPA. ANCA levels do not reliably predict remission or relapse."
    difficulty: medium
    tags: [rheumatology, ANCA, c-ANCA, p-ANCA, PR3, MPO, GPA, MPA, EGPA]
  - front: "What is the EGPA (Eosinophilic Granulomatosis with Polyangiitis, formerly Churg-Strauss) triad?"
    back: "Triad: (1) Allergic rhinitis and asthma (often quiescent at time of vasculitis), (2) Eosinophilic infiltrative disease resembling pneumonia, (3) Systemic vasculitis often with mononeuritis multiplex/peripheral neuropathy and peripheral eosinophilia. 50% ANCA-positive (MPO-ANCA in 40–50%). Other: GI involvement, myocarditis, rarely coronary arteritis. Average age 40s.\n\nEGPA is distinguished from GPA and MPA by its eosinophilia, asthma, and allergic rhinitis. The cardiac involvement (myocarditis, coronary arteritis) is a serious complication. The FFS is also used for EGPA to guide treatment intensity."
    difficulty: medium
    tags: [rheumatology, EGPA, Churg-Strauss, vasculitis, eosinophilia, asthma, mononeuritis multiplex]
  - front: "What are the features of Takayasu's arteritis and how does it differ from GCA?"
    back: "Takayasu's: 'Pulseless disease,' chronic inflammation of aorta and its branches. Most common in young adults of Asian descent, ages 10–40, F>M. Risk of aortic aneurysm. Presents with unequal peripheral pulses, limb claudication, BP differences between arms. GCA: age >50, predominantly affects extracranial vessels, temporal headache, jaw claudication, vision loss, PMR.\n\nBoth are large vessel vasculitides but differ by age and geography. Takayasu's affects younger Asian women; GCA affects older Northern European/North American patients. Both can cause aortic aneurysm as a late complication."
    difficulty: medium
    tags: [rheumatology, Takayasus arteritis, GCA, large vessel vasculitis, pulseless disease, aortic aneurysm]
  - front: "What are the features of Behcet's disease and Buerger's disease (Thromboangiitis Obliterans)?"
    back: "Behcet's: multi-system disorder with uveitis, recurrent oral AND genital ulceration, venous thrombosis, skin and joint involvement. Most common in Mediterranean and Asian populations, average age 30, M>F. Buerger's: inflammation and clotting of small/medium arteries and veins of distal extremities, leading to distal claudication and gangrene. Most important etiology: cigarette smoking. Most common in young Asian males.\n\nBehcet's is unique with its combined oral-genital ulceration and uveitis. The pathergy test (pustule formation at skin prick sites) is characteristic. Buerger's is essentially limited to smokers and cessation is the primary treatment."
    difficulty: medium
    tags: [rheumatology, Behcets disease, Buergers disease, thromboangiitis obliterans, oral ulcers, genital ulcers, smoking]
  - front: "What HLA association and sex ratio characterize ankylosing spondylitis (AS)?"
    back: "HLA-B27 positive in 90–95% of AS patients (vs. 9% of general population). M:F = 3:1 (females have milder disease, more peripheral arthritis and upper spine spondylitis, and may be under-diagnosed). Rule of 2s: AS occurs in 2% of HLA-B27 positive individuals, and 20% of HLA-B27 positive individuals with an affected family member.\n\nHLA-B27 is the strongest genetic risk factor for AS but is neither necessary nor sufficient. Its prevalence in the general population explains why most HLA-B27 positive people do not develop AS. Family history increases risk 10-fold."
    difficulty: easy
    tags: [rheumatology, ankylosing spondylitis, HLA-B27, spondyloarthropathy, epidemiology]
  - front: "What are the ASAS classification criteria for axial spondyloarthritis?"
    back: "Back pain ≥3 months AND age of onset <45 years, PLUS either: (A) Sacroiliitis on imaging (active inflammation on MRI suggestive of sacroiliitis OR definite radiographic sacroiliitis grade ≥2 bilaterally or grade 3–4 unilaterally) + ≥1 SpA feature, OR (B) HLA-B27 positive + ≥2 SpA features. SpA features: HLA-B27, inflammatory back pain, arthritis, enthesitis (heel), uveitis, dactylitis, psoriasis, IBD (Crohn's/colitis), good response to NSAIDs, family history of SpA, elevated CRP.\n\nThe ASAS criteria enable classification of axial SpA including non-radiographic axial SpA (nr-axSpA), which lacks structural damage on x-ray but has MRI evidence of active inflammation. This is important for early recognition and treatment."
    difficulty: hard
    tags: [rheumatology, ankylosing spondylitis, axial spondyloarthritis, ASAS, classification criteria, HLA-B27, sacroiliitis]
  - front: "What are the axial clinical features of ankylosing spondylitis?"
    back: "Mid and lower back stiffness, morning stiffness >1 h, night pain, alternating buttock pain, painful SI joint (FABER test positive). Spinal restriction: decreased lumbar ROM (Schöber test), decreased chest expansion (<5 cm at T4), decreased cervical extension. Postural changes: decreased lumbar lordosis + increased thoracic kyphosis + increased cervical flexion → increased occiput to wall distance (>5 cm). X-ray: 'bamboo spine' (bridging syndesmophytes), 'shiny corner sign,' symmetric sacroiliitis.\n\nThe Modified Schöber test measures lumbar flexion (normal increase ≥5 cm from baseline). The postural changes in AS are progressive, with loss of lumbar lordosis being an early finding. The 'bamboo spine' is a late radiographic finding from bridging syndesmophytes (ossified outer annulus fibrosus)."
    difficulty: medium
    tags: [rheumatology, ankylosing spondylitis, bamboo spine, Schöber test, sacroiliitis, postural changes, FABER test]
  - front: "What are the extra-articular manifestations of ankylosing spondylitis (5 A's)?"
    back: "Anterior uveitis (acute, 25–30% of patients); Aortic incompetence/aortitis; Amyloidosis (kidneys, late and rare); Autoimmune bowel disease (IBD — UC/Crohn's); Apical fibrosis (rare). Also: cardiac conduction disturbances, IgA nephropathy, cauda equina syndrome (rare), psoriasis.\n\nThe mnemonic '5 A's' captures the key extra-articular manifestations. Anterior uveitis is the most common. Cardiac complications (aortic regurgitation, conduction defects) occur in a minority but have significant morbidity. Consider AS in the differential for causes of aortic regurgitation in young males."
    difficulty: medium
    tags: [rheumatology, ankylosing spondylitis, extra-articular, anterior uveitis, aortic regurgitation, amyloidosis, IBD]
  - front: "How does inflammatory back pain differ from mechanical back pain?"
    back: "Inflammatory: insidious onset, age <45, improved with exercise, worse with rest, worse in 2nd half of night, morning stiffness >1 h, responds to NSAIDs, involves other systems (uveitis, IBD), positive family history. Mechanical: acute onset, any age (15–90), worse with exercise, better with rest, morning stiffness <30 min, anatomic pain radiation (L5-S1), may have sensory/motor deficits.\n\nDistinguishing inflammatory from mechanical back pain is critical for early AS diagnosis. The key distinguishing features are improvement with exercise, worsening with rest, prolonged morning stiffness, nocturnal pain, and NSAID responsiveness in inflammatory back pain."
    difficulty: easy
    tags: [rheumatology, inflammatory back pain, mechanical back pain, ankylosing spondylitis, diagnosis]
  - front: "What is the pharmacological treatment of ankylosing spondylitis?"
    back: "First line: NSAIDs (both peripheral and axial disease). Glucocorticoids: topical eye drops, local injections; occasional systemic use. Conventional DMARDs (SSZ, MTX): only for peripheral arthritis — NOT effective for axial disease. If inadequate response to 2 NSAIDs (or DMARD for peripheral disease): anti-TNF agents or anti-IL-17 inhibitors (both axial and peripheral). Manage extra-articular manifestations separately.\n\nThe key distinction is that conventional DMARDs do not work for axial AS — only biologics (anti-TNF, anti-IL-17) are effective for axial disease unresponsive to NSAIDs. This differs from RA where conventional DMARDs are first-line. Anti-IL-17 (secukinumab) is preferred when IBD is NOT present."
    difficulty: hard
    tags: [rheumatology, ankylosing spondylitis, treatment, NSAIDs, anti-TNF, anti-IL-17, DMARDs, biologics]
  - front: "What are the features of enteropathic arthritis (EA)?"
    back: "MSK manifestations in UC or Crohn's disease. Two patterns: (1) Spondylitis — HLA-B27 associated, M>F, may precede IBD, does NOT parallel IBD course, symmetric sacroiliitis; (2) Peripheral arthritis — not HLA-B27 associated, M=F, does NOT precede IBD, DOES parallel IBD course. Treatment: NSAIDs (use cautiously as they may exacerbate bowel disease) for spondylitis; NSAIDs, DMARDs, TNF inhibitors for peripheral arthritis.\n\nThe important distinction is that the spondylitis component of EA behaves independently of bowel disease activity, while peripheral arthritis tracks with IBD flares. This has treatment implications — treating the IBD may improve peripheral arthritis but not the spondylitis."
    difficulty: medium
    tags: [rheumatology, enteropathic arthritis, IBD, spondylitis, Crohns, ulcerative colitis, HLA-B27]
  - front: "What are the 5 patterns of joint involvement in psoriatic arthritis (PsA)?"
    back: "(1) Asymmetric oligoarthritis: <5 small/large joints, asymmetric — most common (70%); (2) Arthritis of DIPs (nail changes more common); (3) Symmetric polyarthritis (similar to RA); (4) Asymmetric sacroiliitis and spondylitis (usually older male patients); (5) Arthritis mutilans (destructive, deforming small joint polyarthritis). Also: dactylitis, enthesopathy, morning stiffness >30 min (50%).\n\nPsA has heterogeneous joint presentations. The DIP involvement with nail changes and arthritis mutilans are particularly characteristic of PsA and rarely seen in RA. Pencil-in-cup deformity and floating syndesmophytes are classic radiographic findings."
    difficulty: medium
    tags: [rheumatology, psoriatic arthritis, PsA, joint patterns, DIP, arthritis mutilans, dactylitis]
  - front: "What are the CASPAR criteria for psoriatic arthritis and the diagnostic threshold?"
    back: "Patient must have inflammatory articular disease (joint, spine, or entheseal) PLUS ≥3 points from: (1) Evidence of psoriasis: current skin (2 pts), past history or family history (1 pt each); (2) Psoriatic nail dystrophy (onycholysis, pitting, hyperkeratosis) = 1 pt; (3) Negative RF = 1 pt; (4) Dactylitis (current or past) = 1 pt; (5) Juxta-articular bone formation on hand/foot x-rays = 1 pt.\n\nThe CASPAR criteria (2006) have high sensitivity (91.4%) and specificity (98.7%) for PsA. Current psoriasis is weighted most heavily (2 points). Negative RF helps distinguish PsA from seropositive RA. Juxta-articular bone formation (periostitis) is a distinctive radiographic feature."
    difficulty: hard
    tags: [rheumatology, psoriatic arthritis, CASPAR criteria, classification, dactylitis, nail dystrophy]
  - front: "What are the biologic treatment options for psoriatic arthritis?"
    back: "Anti-TNF agents (first-line biologic). Anti-IL-17: secukinumab, ixekizumab, bimekizumab. Anti-IL-23: guselkumab, risankizumab. Anti-IL-12/23: ustekinumab. JAK inhibitors. Also: non-biologic DMARDs (MTX, SSZ, leflunomide) for peripheral joint involvement. NSAIDs and/or IA steroids as adjuvants (not sole therapy >3 months). Treat skin lesions (steroid cream, salicylic/retinoic acid, tar, UV light).\n\nPsA treatment targets both skin and joints. IL-17 and IL-23 inhibitors are particularly effective for psoriatic skin involvement. TNF inhibitors remain first-line biologics. JAK inhibitors (tofacitinib, upadacitinib) are approved for PsA. DMARDs do not treat axial disease."
    difficulty: medium
    tags: [rheumatology, psoriatic arthritis, biologics, anti-TNF, anti-IL-17, anti-IL-23, JAK inhibitors, secukinumab]
  - front: "What is reactive arthritis and what are its classic clinical triad and triggering infections?"
    back: "Seronegative spondyloarthropathy with peripheral arthritis + ≥1 extra-articular manifestation appearing 1–4 weeks after GI or GU infection. Classic triad: conjunctivitis/uveitis + urethritis/cervicitis + arthritis ('Can't See, Can't Pee, Can't Climb a Tree'). GI triggers: Shigella, Salmonella, Campylobacter, Yersinia, C. difficile. GU triggers: Chlamydia (16–44% of cases), Mycoplasma. Epidemiology: ages 20–40; M>F if GU-associated, M=F if GI-associated.\n\nReactive arthritis is a post-infectious arthritis where the causative organism is typically NOT cultured from the joint (sterile). The classic triad occurs in <33% of patients but is pathognomonic. Chlamydia is the most common GU trigger in developed countries."
    difficulty: medium
    tags: [rheumatology, reactive arthritis, ReA, Reiters syndrome, Chlamydia, spondyloarthropathy, conjunctivitis, urethritis]
  - front: "What are the skin findings diagnostic of reactive arthritis?"
    back: "Keratoderma blennorrhagicum: hyperkeratotic skin lesions on palms and soles (resembles pustular psoriasis). Balanitis circinata: small, shallow, painless ulcers of the glans penis and urethral meatus. These dermatologic findings, combined with the classic triad, are diagnostic of reactive arthritis.\n\nKeratoderma blennorrhagicum and balanitis circinata are pathognomonic dermatologic findings of reactive arthritis. They occur regardless of whether the triggering infection was GI or GU in origin, highlighting the immune-mediated (not directly infectious) nature of the disease."
    difficulty: medium
    tags: [rheumatology, reactive arthritis, keratoderma blennorrhagicum, balanitis circinata, skin lesions]
  - front: "What is the treatment for reactive arthritis?"
    back: "Antibiotics for non-articular infections. NSAIDs (naproxen 500 mg PO BID/TID, diclofenac 50 mg PO TID, indomethacin 50 mg PO TID/QID), physiotherapy, exercise. Local therapy: IA steroid injection (triamcinolone acetonide), topical steroids for ocular involvement. Note: course is usually weeks to months, often recurring; spinal involvement may persist.\n\nNSAIDs are the primary treatment for articular symptoms. Antibiotic treatment of the triggering infection (particularly for Chlamydia) may reduce disease duration and recurrence. DMARDs (SSZ, MTX) may be needed for persistent or refractory disease."
    difficulty: medium
    tags: [rheumatology, reactive arthritis, treatment, NSAIDs, indomethacin, triamcinolone, antibiotics]
  - front: "Compare HLA-B27 positivity rates across the seronegative spondyloarthropathies."
    back: "Ankylosing spondylitis (AS): 90–95%. Reactive arthritis (ReA): 80%. Psoriatic arthritis (PsA): 40% (higher if spondylitis present). Enteropathic arthritis (EA): 30% (spondylitis component is HLA-B27 associated; peripheral arthritis is not). General population: ~9%.\n\nHLA-B27 is most strongly associated with AS. In PsA, HLA-B27 prevalence is low overall but increases when axial involvement is present (approaching AS-like rates). This supports the concept that HLA-B27 drives axial rather than peripheral disease across spondyloarthropathies."
    difficulty: medium
    tags: [rheumatology, HLA-B27, spondyloarthropathy, AS, reactive arthritis, psoriatic arthritis, enteropathic arthritis]
  - front: "What radiographic findings are characteristic of ankylosing spondylitis on spinal X-ray?"
    back: "Early: 'Shiny corner sign' — erosion and sclerosis at corners of vertebral bodies. Progressive: squaring of vertebral bodies. Late: ossification of outer fibres of annulus fibrosus → bridging syndesmophytes → 'bamboo spine.' SI joints: pseudowidening (erosion) → bony fusion; symmetric sacroiliitis. MRI (early disease): bone marrow edema best seen on T2 STIR sequences.\n\nThe shiny corner sign (Romanus lesion) represents early active inflammation at vertebral endplates. Bridging syndesmophytes (vertical) differ from the bulky, non-marginal osteophytes of DISH and the non-marginal 'skip' syndesmophytes of PsA ('floating syndesmophytes')."
    difficulty: hard
    tags: [rheumatology, ankylosing spondylitis, x-ray, bamboo spine, syndesmophytes, sacroiliitis, radiology]
  - front: "What features of Behcet's disease distinguish it from other vasculitides?"
    back: "Multi-system disorder with: uveitis (ocular), recurrent oral AND genital ulceration (pathognomonic combination), venous thrombosis, skin involvement, joint involvement. Most common in Mediterranean (Turkey highest) and Asian populations. Average age 30, M>F. Pathergy test: pustule formation 24–48 h after skin prick. Not classified as a true vasculitis by Chapel Hill Consensus — it is a 'variable vessel vasculitis.'\n\nThe combination of recurrent oral + genital ulcers + uveitis is the clinical hallmark of Behcet's disease. Unlike other vasculitides that affect a specific vessel calibre, Behcet's can affect vessels of any size. It is more common along the ancient Silk Road."
    difficulty: medium
    tags: [rheumatology, Behcets disease, oral ulcers, genital ulcers, uveitis, pathergy, variable vessel vasculitis]
  - front: "What are the features of IgA vasculitis (formerly Henoch-Schönlein Purpura) and how is it classified?"
    back: "Small vessel non-ANCA-associated vasculitis. Vascular deposition of IgA causing systemic vasculitis. Classic tetrad: palpable purpura (skin, usually lower extremities), arthritis/arthralgias, abdominal pain (GI involvement), renal involvement (IgA nephropathy-like). Most common systemic vasculitis in childhood. Usually self-limiting. Classified as small vessel non-ANCA-associated immune complex-mediated vasculitis.\n\nIgA vasculitis is the most common vasculitis in children and shares pathophysiology with IgA nephropathy (Berger's disease). Both involve IgA immune complex deposition. Adults tend to have more severe renal involvement. Treatment is usually supportive."
    difficulty: medium
    tags: [rheumatology, IgA vasculitis, Henoch-Schönlein purpura, HSP, children, palpable purpura, IgA nephropathy]
  - front: "What is cryoglobulinemic vasculitis and what conditions are associated with it?"
    back: "Systemic vasculitis caused by circulating cryoproteins forming immune complexes. Associations: 60–80% due to hepatitis C, 5–10% due to a CTD (SLE, RA, SS), 5–10% due to a lymphoproliferative disorder, 5–10% idiopathic ('essential'). It is a small vessel non-ANCA-associated vasculitis.\n\nHepatitis C is by far the most common cause of cryoglobulinemic vasculitis. Cryoglobulins precipitate in cold temperatures and cause immune complex deposition in small vessels. Treatment involves addressing the underlying cause (e.g., HCV antiviral therapy) plus immunosuppression for severe manifestations."
    difficulty: medium
    tags: [rheumatology, cryoglobulinemic vasculitis, hepatitis C, small vessel vasculitis, immune complex, cryoglobulins]
  - front: "What psoriatic nail changes are seen in psoriatic arthritis and why are they clinically important?"
    back: "Nail changes: pitting, transverse or longitudinal ridging, discolouration, subungual hyperkeratosis, onycholysis (nail separating from nail bed), oil drop sign. Clinical importance: nail lesions are an important predictor for the development of PsA in patients with cutaneous psoriasis. 'Check hidden areas for psoriatic lesions: ears, hairline, umbilicus, gluteal cleft, nails.'\n\nNail involvement in psoriasis reflects enthesitis at the nail insertion and correlates with DIP arthritis. The presence of nail changes should prompt screening for PsA. The oil drop sign (salmon-coloured discolouration under the nail) is particularly specific for psoriasis."
    difficulty: medium
    tags: [rheumatology, psoriatic arthritis, nail changes, onycholysis, oil drop sign, pitting, psoriasis]
  - front: "How does the spondylitis of ankylosing spondylitis progress pathologically?"
    back: "Inflammation → osteopenia → erosion → ossification → osteoproliferation (syndesmophytes). Pathologically: inflammatory cells infiltrate the entheses (insertion points of ligaments/tendons) → erosion of bone → reactive new bone formation → bridging syndesmophytes from outer annulus fibrosus ossification → 'bamboo spine.' This contrasts with RA where inflammation leads to erosion without new bone formation.\n\nAS is unique among inflammatory arthritides in that the end result is excessive bone formation (ankylosis/fusion) rather than pure erosion. This paradox (erosion followed by new bone formation) is thought to be driven by TNF-mediated inflammation and Wnt/BMP signalling."
    difficulty: hard
    tags: [rheumatology, ankylosing spondylitis, pathophysiology, syndesmophytes, enthesitis, ankylosis, ossification]
  - front: "What is the classic crystal type in gout, and how does it appear under polarized light microscopy?"
    back: "Monosodium urate (MSU) crystals; negatively birefringent (yellow when parallel to the compensator filter), needle-shaped.\n\nNegative birefringence distinguishes MSU crystals from calcium pyrophosphate (CPP) crystals seen in pseudogout, which are positively birefringent (blue when parallel) and rhomboid-shaped. This distinction is essential for diagnosis on joint aspirate."
    difficulty: easy
    tags: [gout, crystal arthropathy, synovial fluid analysis, polarized microscopy, rheumatology]
  - front: "A 55-year-old man presents with acute severe pain, redness and swelling of the first metatarsophalangeal (MTP) joint. Joint aspirate shows negatively birefringent, needle-shaped crystals. What is the diagnosis and what are the first-line acute treatment options?"
    back: "Acute gout (podagra). First-line acute treatments: NSAIDs (high-dose, then taper), colchicine (1.2 mg at first signs, then 0.6 mg 1 h later, then 0.6 mg BID until attack resolves), or corticosteroids (IA preferred; PO or IM if NSAIDs contraindicated).\n\nThe first MTP joint (podagra) is the classic site of acute gout. Joint aspirate showing >90% MSU crystals confirms the diagnosis. Colchicine is most effective when started within the first 12-24 hours. Corticosteroids are preferred when renal, cardiovascular, or GI disease precludes NSAIDs."
    difficulty: easy
    tags: [gout, podagra, acute arthritis, colchicine, NSAIDs, corticosteroids, rheumatology]
  - front: "What are the indications for initiating urate-lowering therapy (ULT) in gout?"
    back: "Indications for ULT: ≥2 gout attacks per year, presence of tophi, bone erosions/arthritis on imaging.\n\nPer 2020 ACR guidelines, allopurinol is preferred over all other ULTs as first-line for all patients including those with CKD stage ≥3. Concomitant anti-inflammatory prophylaxis (colchicine, NSAIDs, or prednisone/prednisolone) should be initiated with ULT. The serum urate target is <6 mg/dL."
    difficulty: medium
    tags: [gout, urate-lowering therapy, allopurinol, febuxostat, Canadian guidelines, rheumatology]
  - front: "What drug mnemonic summarizes the major precipitants of acute gout, and what drugs and foods are included?"
    back: "Drugs: 'FACT' — low-dose aspirin, Cyclosporine, Thiazide diuretics. Foods: 'SALT' — Seafood, Alcohol (beer and spirits), Liver and kidney, Turkey (meat).\n\nThese precipitants raise serum uric acid either by decreasing renal excretion (e.g., thiazides, cyclosporine, low-dose ASA) or by providing exogenous purines (high-purine foods). Fructose/sugar-sweetened foods are also important dietary precipitants."
    difficulty: easy
    tags: [gout, precipitants, hyperuricemia, diet, medications, rheumatology]
  - front: "What are the radiographic findings characteristic of gout vs. pseudogout?"
    back: "Gout: punched-out bone erosions with 'overhanging edges' (Martel sign), soft tissue tophi. Pseudogout: chondrocalcinosis (radiodensities in fibrocartilage/hyaline cartilage, e.g., knee menisci).\n\nIn gout, tophi deposit adjacent to joints and erode bone, creating the classic overhanging edge on x-ray. In pseudogout (CPPD), calcium pyrophosphate deposits in cartilage appear as chondrocalcinosis on plain x-ray, visible in 75% of cases. Ultrasound in gout shows the double-contour sign."
    difficulty: medium
    tags: [gout, pseudogout, CPPD, radiology, chondrocalcinosis, rheumatology]
  - front: "Compare gout and pseudogout with regard to gender, age, crystal type, crystal shape, birefringence, and classic joint distribution."
    back: "Gout: M>F, middle-aged males; monosodium urate, needle-shaped, negatively birefringent (yellow when parallel); first MTP (podagra), midfoot, ankle, knee. Pseudogout: M=F, usually elderly or post-menopausal; CPP, rhomboid-shaped, positively birefringent (blue when parallel); knee and wrist most common.\n\nDifferentiating these two crystal arthropathies is a high-yield MCCQE1 topic. Both can cause acute inflammatory monoarthritis, but the crystal characteristics, birefringence patterns, demographic profile, and joint distribution differ importantly."
    difficulty: medium
    tags: [gout, pseudogout, CPPD, crystal arthropathy, differential diagnosis, rheumatology]
  - front: "What is the first-line urate-lowering therapy for gout, including its use in chronic kidney disease (CKD)?"
    back: "Allopurinol is first-line ULT for all patients, including those with CKD stage ≥3. Start low and titrate up. Febuxostat is second-line but should NOT be used in patients with a history of cardiovascular disease.\n\nBoth allopurinol and febuxostat inhibit xanthine oxidase, reducing uric acid production. Allopurinol is not nephrotoxic and can be used in CKD with dose adjustment. Febuxostat showed increased cardiovascular mortality in a landmark trial, hence the contraindication in cardiovascular disease. Anti-inflammatory prophylaxis for 3-6 months is required when starting ULT to prevent flares."
    difficulty: medium
    tags: [gout, allopurinol, febuxostat, CKD, urate-lowering therapy, cardiovascular risk, rheumatology]
  - front: "What conditions are associated with calcium pyrophosphate dihydrate (CPPD) deposition disease (pseudogout)?"
    back: "Old age, advanced osteoarthritis, neuropathic joints; metabolic associations: hyperparathyroidism, hypothyroidism, hypomagnesemia, hypophosphatasia (low ALP), hemochromatosis.\n\nA mnemonic for metabolic causes of CPPD: 'HHHH' — Hyperparathyroidism, Hypothyroidism, Hypomagnesemia, Hemochromatosis, plus Hypophosphatasia. These are commonly tested on licensing exams. Identifying an underlying metabolic cause is important as treatment of the cause may slow crystal deposition."
    difficulty: medium
    tags: [pseudogout, CPPD, hyperparathyroidism, hemochromatosis, hypothyroidism, rheumatology]
  - front: "What are the clinical presentations of CPPD disease, and how is acute CPPD managed?"
    back: "CPPD presentations: asymptomatic chondrocalcinosis, acute crystal arthritis (pseudogout flare), pseudo-OA, pseudo-RA. Acute CPPD treatment: joint aspiration, intra-articular steroid injection, NSAIDs, cool packs, rest, splinting.\n\nCPPD can mimic several other rheumatologic conditions (hence the 'pseudo' terminology). Acute attacks are often triggered by dehydration, illness, surgery, or trauma. Unlike gout, there is no disease-modifying therapy for CPPD, and no treatment is required for asymptomatic chondrocalcinosis."
    difficulty: medium
    tags: [CPPD, pseudogout, pseudo-OA, pseudo-RA, chondrocalcinosis, rheumatology]
  - front: "What are the required criteria and scoring algorithm for classifying Polymyalgia Rheumatica (PMR)?"
    back: "Required criteria (all must be present): age >50 years, bilateral shoulder aching, and abnormal ESR or CRP. Scoring (without ultrasound): ≥4 points = PMR. Items scored: morning stiffness >45 min (2 pts), hip pain or limited ROM (1 pt), absence of RF or ACPA (2 pts), absence of other joint involvement (1 pt). With ultrasound: ≥5 points = PMR (additional US criteria can add up to 2 more points).\n\nThe 2012 ACR/EULAR PMR classification criteria allow diagnosis based on clinical and laboratory findings, with optional ultrasound to increase sensitivity and specificity. PMR has a strong association with giant cell arteritis (GCA); patients must be monitored for GCA symptoms."
    difficulty: hard
    tags: [polymyalgia rheumatica, PMR, classification criteria, ESR, CRP, giant cell arteritis, rheumatology]
  - front: "How is Polymyalgia Rheumatica (PMR) treated, and what are key monitoring considerations?"
    back: "Start prednisone 12.5-25 mg PO once daily. Expect response within days; reconsider diagnosis if no response. Taper slowly over approximately 1 year. Treat relapses aggressively (50% relapse rate). Monitor for: steroid side effects, glucocorticoid-induced osteoporosis (prevention), and GCA symptoms (headache, jaw claudication, scalp tenderness).\n\nPMR responds dramatically to low-dose corticosteroids — this rapid response is itself diagnostically helpful. Do not treat a rise in ESR alone as a relapse; use clinical assessment. The strong association with GCA means all PMR patients must be counseled about GCA symptoms, as GCA can cause blindness if untreated."
    difficulty: medium
    tags: [polymyalgia rheumatica, PMR, prednisone, corticosteroids, giant cell arteritis, osteoporosis prevention, rheumatology]
  - front: "What are the 2010 ACR diagnostic criteria for fibromyalgia?"
    back: "All three must be met: (1) Widespread Pain Index (WPI) ≥7 AND Symptom Severity (SS) score ≥5, OR WPI 3-6 AND SS score ≥9; (2) symptoms present at similar level for ≥3 months; (3) no other disorder that would otherwise explain the pain. The SS score includes: severity of fatigue, waking unrefreshed, cognitive symptoms, and extent of somatic symptoms (each rated 0-3).\n\nThe 2010 criteria replaced the older tender point examination and emphasize the multisystem symptomatic burden of fibromyalgia. The WPI tallies up to 19 body areas. This criteria are validated by the 2012 Canadian Guidelines for Diagnosis and Management of Fibromyalgia."
    difficulty: hard
    tags: [fibromyalgia, diagnostic criteria, ACR 2010, widespread pain index, symptom severity, rheumatology]
  - front: "What is the recommended pharmacological management of fibromyalgia?"
    back: "First-line: low-dose tricyclic antidepressants (e.g., amitriptyline) for sleep restoration. SNRIs: duloxetine, milnacipran. Anticonvulsants: pregabalin, gabapentin. Opioids are NOT encouraged. NSAIDs are no longer encouraged (controversial). Pharmacotherapy is adjunctive — not curative.\n\nPer the 2012 Canadian Guidelines, fibromyalgia management is multimodal. Non-pharmacological therapy (graded aerobic exercise, resistance training, CBT) is the cornerstone. Pharmacological agents provide only modest benefit. Tricyclics are chosen for lower anticholinergic side effect profiles when possible."
    difficulty: medium
    tags: [fibromyalgia, amitriptyline, duloxetine, pregabalin, SNRIs, anticonvulsants, Canadian guidelines, rheumatology]
  - front: "What non-pharmacological therapies are recommended for fibromyalgia?"
    back: "Graded aerobic exercise (>20 min/day, 2-3 days/week), resistance training (>8 repetitions per exercise, 2-3 days/week), counseling on self-management strategies. Therapies with some evidence: acupuncture, cognitive-behavioural therapy (CBT), hydrotherapy, meditative movement (yoga, Tai chi).\n\nExercise is the most consistently effective intervention for fibromyalgia. The 2012 Canadian Guidelines and EULAR 2017 revised recommendations both emphasize that a healthy lifestyle and active patient participation are the cornerstone of care. Non-pharmacological therapy should be offered to all patients."
    difficulty: easy
    tags: [fibromyalgia, exercise, CBT, non-pharmacological, Canadian guidelines, rheumatology]
  - front: "How do Inflammatory Myositis, PMR, and Fibromyalgia differ in terms of muscle weakness, ESR/CRP, and treatment?"
    back: "Inflammatory Myositis: proximal muscle weakness YES, ESR/CRP usually normal, treatment = high-dose steroids + immunosuppressants. PMR: weakness NO (periarticular pain only), ESR/CRP markedly elevated, treatment = low-dose steroids. Fibromyalgia: weakness NO, ESR/CRP normal, treatment = exercise + sleep restoration.\n\nMuscle weakness is a key distinguishing feature — it is present only in inflammatory myositis (polymyositis/dermatomyositis). PMR has significantly elevated inflammatory markers and responds dramatically to low-dose steroids. Fibromyalgia has entirely normal investigations and is managed non-pharmacologically first."
    difficulty: medium
    tags: [inflammatory myositis, PMR, fibromyalgia, differential diagnosis, CK, ESR, rheumatology]
  - front: "What are the first-line and second-line analgesic treatments for osteoarthritis (OA), and what are the key contraindications to consider?"
    back: "First-line: acetaminophen 1000 mg TID (max 3 g/day) — avoid in severe liver disease. Second-line: NSAIDs (e.g., ibuprofen, diclofenac, naproxen) — avoid with GI bleed, renal impairment, ASA/NSAID allergy, pregnancy (T3), PUD, anticoagulants. COX-2 inhibitors (celecoxib): preferred in dyspepsia/GERD but avoid in renal impairment and cardiovascular disease.\n\nCanadian and ACR/EULAR guidelines recommend a stepwise approach to OA pharmacotherapy. Topical NSAIDs (e.g., diclofenac gel — Pennsaid®, Voltaren Emulgel®) are an option for patients who fail acetaminophen but wish to avoid systemic therapy, particularly for small joints. IA corticosteroid injections provide short-term (weeks to months) benefit."
    difficulty: medium
    tags: [osteoarthritis, acetaminophen, NSAIDs, COX-2 inhibitors, celecoxib, analgesia, rheumatology]
  - front: "What are the monitoring requirements for hydroxychloroquine (Plaquenil®) used as a DMARD?"
    back: "Annual ophthalmological screening to monitor for retinopathy. Maintenance dose: 200-400 mg PO once daily (5 mg/kg ideal body weight per day, maximum 400 mg/day). Contraindicated in pre-existing retinal disease.\n\nHydroxychloroquine-induced retinopathy (bull's-eye maculopathy) is the major serious adverse effect. It is typically dose-dependent and cumulative. Annual ophthalmology screening is mandated. Hydroxychloroquine is widely used in RA, SLE, and Sjögren's syndrome due to its favorable safety profile compared to other DMARDs."
    difficulty: easy
    tags: [hydroxychloroquine, DMARD, retinopathy, monitoring, SLE, RA, rheumatology]
  - front: "What are the major adverse effects and contraindications of methotrexate (MTX) when used as a DMARD?"
    back: "Adverse effects: oral ulcers, GI symptoms, cirrhosis, myelosuppression, pneumonitis, tubular necrosis, fatigue. Contraindications: bone marrow suppression, liver disease, significant lung disease, immunodeficiency, pregnancy, EtOH use, moderate-to-severe kidney disease.\n\nMTX is the anchor DMARD for RA. Folic acid supplementation (1 mg/day) is routinely co-administered to reduce side effects, particularly oral ulcers and GI symptoms. LFTs, CBC, and creatinine should be monitored regularly. Pregnancy must be avoided for ≥3 months after stopping MTX."
    difficulty: medium
    tags: [methotrexate, DMARD, adverse effects, contraindications, RA, myelosuppression, pneumonitis, rheumatology]
  - front: "What are the major adverse effects of leflunomide (Arava®), and in which patients is it contraindicated?"
    back: "Adverse effects: alopecia, GI symptoms, liver dysfunction, interstitial pulmonary fibrosis, hypertension. Contraindicated in: liver disease, lung disease, pregnancy.\n\nLeflunomide is a pyrimidine synthesis inhibitor used as an alternative DMARD in RA. It has teratogenic potential, and a cholestyramine washout protocol is required before pregnancy. In the landmark leflunomide RA trial, it showed similar efficacy to MTX for active RA."
    difficulty: medium
    tags: [leflunomide, DMARD, alopecia, pulmonary fibrosis, contraindications, RA, rheumatology]
  - front: "What is the mechanism of action of the following biologics: adalimumab, etanercept, rituximab, tocilizumab, abatacept?"
    back: "Adalimumab: monoclonal anti-TNF. Etanercept: fusion protein of TNF receptor and Fc portion of IgG (decoy receptor). Rituximab: anti-CD20, causes B cell depletion. Tocilizumab: IL-6 receptor antagonist. Abatacept: costimulation modulator of T cell activation (CTLA4-Ig).\n\nThese five biologics represent distinct mechanisms of immunomodulation in rheumatology. Biosimilars are available in Canada for adalimumab, etanercept, and rituximab. Understanding the mechanism helps predict the class of adverse effects (e.g., TNF inhibitors increase risk of TB reactivation; rituximab depletes B cells causing hypogammaglobulinemia)."
    difficulty: medium
    tags: [biologics, adalimumab, etanercept, rituximab, tocilizumab, abatacept, TNF inhibitors, rheumatology]
  - front: "What is the mechanism of action of tofacitinib and upadacitinib, and how do they differ from traditional biologics?"
    back: "Both are JAK inhibitors that interfere with the JAK-STAT intracellular signaling pathway. Tofacitinib (Xeljanz®): selective JAK 1/3 inhibitor, 5 mg PO BID. Upadacitinib (Rinvoq®): selective JAK inhibitor, 15 mg PO once daily. Unlike biologics, JAK inhibitors are small-molecule oral drugs.\n\nJAK inhibitors represent a class of targeted synthetic DMARDs (tsDMARDs). Their oral bioavailability is a major clinical advantage over injectable biologics. Safety considerations include increased risk of infections, VTE, and cardiovascular events (particularly tofacitinib). Screening for TB, hepatitis, and lipids is required before initiation."
    difficulty: medium
    tags: [JAK inhibitors, tofacitinib, upadacitinib, JAK-STAT, DMARDs, RA, rheumatology]
  - front: "What did the COMET trial demonstrate about combination therapy vs. methotrexate monotherapy in early RA?"
    back: "MTX + etanercept achieved clinical remission in 50% of patients vs. 28% on MTX alone. Radiographic non-progression occurred in 80% (combination) vs. 59% (MTX alone). Both were statistically significant (P<0.0001).\n\nThe COMET trial (Lancet 2008) established that combination therapy with a biologic (etanercept) plus MTX is superior to MTX monotherapy for achieving both clinical remission and preventing radiographic joint damage in early moderate-to-severe RA."
    difficulty: hard
    tags: [COMET trial, RA, etanercept, methotrexate, combination therapy, landmark trials, rheumatology]
  - front: "What were the key findings of the PREMIER trial regarding adalimumab + MTX combination therapy in early RA?"
    back: "ACR50 response achieved in 62% (combination) vs. 46% (MTX alone) vs. 47% (adalimumab alone). Combination therapy caused significantly less radiographic progression than either monotherapy (P<0.002). 49% of combination patients achieved remission at 2 years.\n\nPREMIER (Arthritis Rheum 2006) showed that adalimumab + MTX combination is superior to either agent alone in early aggressive RA. This supports the treat-to-target strategy with early aggressive combination therapy in RA."
    difficulty: hard
    tags: [PREMIER trial, adalimumab, methotrexate, RA, combination therapy, landmark trials, rheumatology]
  - front: "What did the RAVE trial demonstrate about rituximab vs. cyclophosphamide in ANCA-associated vasculitis (AAV)?"
    back: "64% of rituximab patients achieved remission without prednisone at 6 months vs. 53% of cyclophosphamide patients (noninferior, P<0.001). For relapsing disease, rituximab was superior: 67% vs. 42% remission (P=0.01).\n\nRAVE (NEJM 2010) established rituximab as an effective alternative to cyclophosphamide for remission induction in severe AAV, with particular superiority in relapsing disease. This is important because cyclophosphamide carries significant toxicity (hemorrhagic cystitis, bladder cancer, gonadal toxicity)."
    difficulty: hard
    tags: [RAVE trial, rituximab, cyclophosphamide, ANCA-associated vasculitis, AAV, landmark trials, rheumatology]
  - front: "In ANCA-associated vasculitis (AAV) remission maintenance, which is superior: mycophenolate mofetil or azathioprine?"
    back: "Azathioprine (AZA) is superior. In the IMPROVE trial, mycophenolate mofetil had significantly more relapses (55%) compared to AZA (37.5%) for maintenance therapy after cyclophosphamide-induced remission.\n\nIMPROVE (JAMA 2010) contrasts with lupus nephritis, where mycophenolate mofetil is preferred. In AAV, AZA remains the standard maintenance therapy. This distinction between AAV and lupus nephritis is a high-yield MCCQE1 differentiation point."
    difficulty: hard
    tags: [IMPROVE trial, AAV, ANCA vasculitis, azathioprine, mycophenolate mofetil, maintenance therapy, rheumatology]
  - front: "What did the Belimumab trial (BLISS) demonstrate in SLE, and what is belimumab's mechanism of action?"
    back: "Belimumab (BLyS inhibitor/anti-BAFF monoclonal antibody) significantly improved SLE Responder Index rates vs. placebo: 51% (1 mg/kg) and 58% (10 mg/kg) vs. 44% placebo. It was the first biologic specifically approved for SLE.\n\nBLyS (B lymphocyte stimulator, also called BAFF) promotes B cell survival. Belimumab inhibits BLyS, reducing autoreactive B cell survival and autoantibody production. The Lancet 2011 trial established its efficacy in seropositive, active SLE patients already on standard of care."
    difficulty: hard
    tags: [belimumab, SLE, BAFF, BLyS, biologics, landmark trials, rheumatology]
  - front: "What did the landmark mycophenolate mofetil vs. cyclophosphamide trial (Ginzler 2005) show for lupus nephritis?"
    back: "Mycophenolate mofetil achieved complete remission in 22.5% of patients vs. 5.8% for IV cyclophosphamide (P=0.005). Mycophenolate mofetil was more efficacious with a better safety profile for inducing remission in active lupus nephritis.\n\nThis NEJM 2005 trial changed practice by establishing mycophenolate mofetil as the preferred induction therapy for lupus nephritis, replacing the more toxic cyclophosphamide. This contrasts with AAV (where cyclophosphamide remains standard induction), making this distinction clinically and examination-relevant."
    difficulty: hard
    tags: [lupus nephritis, mycophenolate mofetil, cyclophosphamide, SLE, landmark trials, rheumatology]
  - front: "What did the CYCLOPS trial demonstrate about pulse vs. daily oral cyclophosphamide in ANCA-associated vasculitis?"
    back: "Pulse cyclophosphamide (15 mg/kg IV every 2-3 weeks) was equivalent to daily oral cyclophosphamide for inducing remission (88.1% vs. 87.7% at 9 months), required less cumulative cyclophosphamide, and caused fewer cases of leukopenia.\n\nCYCLOPS (Ann Intern Med 2009) supports using pulse rather than daily oral cyclophosphamide for AAV induction, as equivalent efficacy is achieved with reduced cumulative toxicity. This is relevant to minimizing long-term adverse effects of cyclophosphamide (bladder cancer, gonadotoxicity)."
    difficulty: hard
    tags: [CYCLOPS trial, cyclophosphamide, ANCA vasculitis, AAV, pulse therapy, landmark trials, rheumatology]
  - front: "What did the MAINRITSAN3 trial establish about prolonged rituximab use for AAV maintenance?"
    back: "Prolonged rituximab (every 6 months for 18 months) resulted in 96% relapse-free survival vs. 74% in the placebo group at 28 months (absolute difference 22%; HR 7.5, P=0.008). Prolonged rituximab was superior to standard maintenance therapy for preventing AAV relapses.\n\nMAINRITSAN3 (Ann Intern Med 2020) builds on earlier MAINRITSAN trials to support extended rituximab maintenance in AAV. This is particularly relevant for patients with PR3-ANCA and relapsing disease, who are at highest risk of relapse."
    difficulty: hard
    tags: [MAINRITSAN3 trial, rituximab, AAV, ANCA vasculitis, maintenance therapy, relapse prevention, rheumatology]
  - front: "What was the key finding of the ATLAS trial regarding adalimumab in ankylosing spondylitis (AS)?"
    back: "58.2% of adalimumab-treated AS patients achieved ASAS20 response at week 12 vs. 20.6% placebo (P<0.001). Adalimumab also achieved significantly better ASAS40 and ASAS5/6 responses.\n\nATLAS (Arthritis Rheum 2006) established the efficacy of anti-TNF therapy (adalimumab) in active AS. The ASAS20 (Assessment in AS International Working Group 20% improvement) is the standard primary outcome measure for AS clinical trials. TNF inhibitors are indicated in AS refractory to NSAIDs."
    difficulty: hard
    tags: [ATLAS trial, adalimumab, ankylosing spondylitis, TNF inhibitors, ASAS20, landmark trials, rheumatology]
  - front: "What did the WGET trial demonstrate about etanercept in granulomatosis with polyangiitis (GPA/Wegener's)?"
    back: "Etanercept was NOT effective for remission maintenance in GPA. There were no significant differences between etanercept and placebo for rates of stable low-level disease activity, sustained remission, or time to achieve those outcomes.\n\nWGET (NEJM 2005) is important because it contradicts the use of TNF inhibitors in GPA, unlike their established role in RA and AS. The pathophysiology of AAV differs from RA, and rituximab (anti-CD20) has replaced cyclophosphamide and etanercept for GPA management."
    difficulty: hard
    tags: [WGET trial, etanercept, GPA, Wegeners granulomatosis, AAV, TNF inhibitors, landmark trials, rheumatology]
  - front: "What did the febuxostat vs. allopurinol trial (Becker 2005) demonstrate for hyperuricemia and gout?"
    back: "Primary endpoint (serum urate <6 mg/dL at last 3 monthly measurements): febuxostat 80 mg achieved 53%, febuxostat 120 mg achieved 62%, vs. allopurinol 300 mg only 21% (P<0.001 for both febuxostat doses vs. allopurinol). Febuxostat was more effective than standard-dose allopurinol at lowering serum urate.\n\nThis NEJM 2005 trial established febuxostat as an effective alternative ULT. However, subsequent cardiovascular safety data led to restrictions: febuxostat should not be used in patients with cardiovascular disease. Allopurinol titrated to higher doses can achieve similar serum urate lowering."
    difficulty: hard
    tags: [febuxostat, allopurinol, gout, hyperuricemia, urate-lowering therapy, landmark trials, rheumatology]
  - front: "What is the mechanism of action of secukinumab (Cosentyx®) and in which rheumatologic conditions is it used?"
    back: "Secukinumab blocks IL-17A. It is used in ankylosing spondylitis (AS), psoriatic arthritis (PsA), and plaque psoriasis. Dose: 150 mg SC monthly.\n\nIL-17A is a key cytokine in the pathogenesis of spondyloarthropathies. Secukinumab represents an important alternative to TNF inhibitors for AS and PsA, particularly in patients who have failed or cannot tolerate anti-TNF therapy. It is part of the newer biologic DMARD armamentarium."
    difficulty: medium
    tags: [secukinumab, IL-17, ankylosing spondylitis, psoriatic arthritis, biologics, rheumatology]
  - front: "What are the adverse effects of cyclophosphamide, and in which rheumatologic conditions is it used?"
    back: "Adverse effects: cardiotoxicity, GI symptoms, hemorrhagic cystitis, nephrotoxicity, bone marrow suppression, sterility, bladder cancer. Used in: ANCA-associated vasculitis (remission induction), lupus nephritis (induction), scleroderma-associated ILD.\n\nCyclophosphamide is an alkylating agent with serious long-term toxicity. Mesna co-administration reduces the risk of hemorrhagic cystitis from the toxic acrolein metabolite. The CYCLOPS trial showed pulse IV is preferred over daily oral to reduce cumulative dose and leukopenia. Adequate hydration is essential."
    difficulty: medium
    tags: [cyclophosphamide, adverse effects, hemorrhagic cystitis, vasculitis, SLE, scleroderma, rheumatology]
  - front: "What did the cyclophosphamide vs. placebo scleroderma lung disease trial (Tashkin 2006) demonstrate?"
    back: "Oral cyclophosphamide (<2 mg/kg/day) for 1 year produced a mean absolute difference in 12-month adjusted FVC of 2.53% compared to placebo (P<0.03), sustained at 24 months. Cyclophosphamide had significant clinical benefit for scleroderma-related ILD with active alveolitis.\n\nScleroderma-related ILD is a major cause of morbidity and mortality in systemic sclerosis. This NEJM 2006 trial was landmark in establishing cyclophosphamide as an evidence-based option for symptomatic scleroderma ILD, though the effect size was modest and more recent data support mycophenolate mofetil as an alternative with better tolerability."
    difficulty: hard
    tags: [scleroderma, ILD, cyclophosphamide, FVC, systemic sclerosis, landmark trials, rheumatology]
  - front: "What are the adverse effects of azathioprine, and what enzyme deficiency predisposes to severe toxicity?"
    back: "Adverse effects: skin rash, pancytopenia (especially leukopenia), transaminitis, biliary stasis, vomiting, diarrhea. Thiopurine S-methyltransferase (TPMT) deficiency is a contraindication, as it predisposes to severe myelosuppression due to inability to metabolize the drug.\n\nTPMT genotyping or phenotyping is recommended before starting azathioprine to identify poor metabolizers who are at high risk for life-threatening myelosuppression. Regular CBC and LFT monitoring is required. Azathioprine is used for maintenance in AAV, SLE, inflammatory myopathies, and as a steroid-sparing agent."
    difficulty: medium
    tags: [azathioprine, TPMT, myelosuppression, adverse effects, pancytopenia, rheumatology]
  - front: "A 70-year-old woman has chondrocalcinosis on knee x-ray but no symptoms. What treatment is recommended?"
    back: "No treatment is required. Asymptomatic chondrocalcinosis does not require pharmacological intervention. Investigate for underlying metabolic causes (hyperparathyroidism, hypothyroidism, hypomagnesemia, hemochromatosis, hypophosphatasia).\n\nPer EULAR recommendations, there are no disease-modifying treatments for CPPD crystal arthritis, and no treatment is indicated for asymptomatic chondrocalcinosis. However, any associated metabolic condition should be identified and treated. The clinical relevance lies in not over-treating an incidental finding."
    difficulty: medium
    tags: [CPPD, chondrocalcinosis, asymptomatic, management, EULAR, rheumatology]
  - front: "What are the common sites of tophi deposition in chronic gout?"
    back: "First MTP joint (podagra site), ear helix, olecranon bursae, Achilles tendon insertions. Can also deposit in subcutaneous tissues, synovium, cartilage, and kidney (causing gouty nephropathy and uric acid nephrolithiasis).\n\nTophi are deposits of monosodium urate crystals surrounded by chronic inflammatory tissue. They appear as firm, white-yellow subcutaneous nodules. On x-ray, tophi cause characteristic punched-out erosions with overhanging edges. Chronic untreated gout can lead to destructive arthropathy."
    difficulty: easy
    tags: [gout, tophi, chronic gout, first MTP, olecranon, ear helix, rheumatology]
  - front: "A patient with gout is started on allopurinol. What anti-inflammatory prophylaxis should be co-prescribed, and for how long?"
    back: "Low-dose NSAIDs or colchicine should be started concomitantly with urate-lowering therapy (ULT) for 3-6 months to prevent acute gout flares triggered by the mobilization of urate crystals as serum urate drops.\n\nParadoxically, initiation of ULT can precipitate acute gout flares as serum urate levels fluctuate and crystals dissolve. Anti-inflammatory prophylaxis blunts this risk. The serum urate target is <6 mg/dL (or <5 mg/dL in severe tophaceous gout). ULT should not be initiated or discontinued during an acute flare."
    difficulty: medium
    tags: [gout, allopurinol, ULT, prophylaxis, colchicine, flare prevention, rheumatology]
  - front: "What is pegloticase, and when is it indicated in gout management?"
    back: "Pegloticase is a PEGylated recombinant uricase (urate oxidase) that converts uric acid to allantoin, which is readily excreted. It is indicated in patients with frequent gout flares or non-resolving subcutaneous tophi who have failed to achieve serum urate <6 mg/dL on maximally tolerated conventional ULT (allopurinol, febuxostat, uricosurics).\n\nPer 2020 ACR gout guidelines, pegloticase is reserved for refractory severe gout. It requires IV infusion every 2 weeks and carries risk of infusion reactions and immunogenicity. Serum urate monitoring during therapy is essential as a rising urate level may precede infusion reactions."
    difficulty: hard
    tags: [pegloticase, gout, refractory gout, uricase, urate-lowering therapy, rheumatology]
  - front: "What is the ultrasound finding in gout, and what does the CPP crystal aspirate show in pseudogout?"
    back: "Gout: double-contour sign on ultrasound (hyperechoic line over the cartilage surface). Pseudogout: CPP crystals are present in only 60% of aspirates, are positively birefringent (blue when parallel to compensator filter), and are rhomboid-shaped.\n\nThe double-contour sign in gout represents MSU crystal deposition on the surface of hyaline cartilage. In pseudogout, crystals may be sparse and difficult to find in the aspirate. X-ray showing chondrocalcinosis is present in 75% of CPPD cases and is often the initial diagnostic clue."
    difficulty: medium
    tags: [gout, pseudogout, CPPD, ultrasound, double-contour sign, synovial fluid, rheumatology]
  - front: "What are the fibromyalgia epidemiology characteristics and associated conditions?"
    back: "M:F = 1:3. Primarily ages 25-45. Prevalence 2-5% in general population. Strongly associated with: psychiatric illness (depression, anxiety), chronic fatigue syndrome, myofascial pain syndrome, IBS, bladder syndrome, migraines, restless leg syndrome, obesity.\n\nThe 2012 Canadian Guidelines highlight fibromyalgia as a complex condition with significant psychiatric and somatic comorbidities. These associations support a central sensitization model of chronic pain. Fibromyalgia must be distinguished from inflammatory conditions (normal ESR/CRP, no weakness, normal CK)."
    difficulty: easy
    tags: [fibromyalgia, epidemiology, chronic fatigue syndrome, depression, central sensitization, rheumatology]
  - front: "What is the role of IA corticosteroid injections in osteoarthritis management, and how frequently can they be given?"
    back: "IA corticosteroid injections provide short-term (weeks to months) joint-specific pain relief. Infection must be ruled out before injection. There is a theoretical risk of cartilage damage and tendon weakening if used more frequently than every 3 months.\n\nIA corticosteroids are particularly useful for OA flares with significant inflammation. They are not disease-modifying. The 3-month interval guideline is based on the theoretical risk of cumulative cartilage damage from frequent injections. Septic arthritis must always be excluded before injecting any joint."
    difficulty: easy
    tags: [osteoarthritis, intra-articular injection, corticosteroids, OA management, rheumatology]
  - front: "What did the hyaluronan intra-articular injection trial (Ann Rheum Dis 2010) conclude for knee OA?"
    back: "IA hyaluronan (sodium hyaluronate) was without clinical effect in patients with moderate-severe knee OA (Lequesne algofunctional index ≥10). No significant differences vs. saline placebo in time to recurrence, LFI, walking pain, paracetamol consumption, or global assessment.\n\nThis multicentre RCT (n=337) showed that viscosupplementation with hyaluronan injections does not provide clinically meaningful benefit in moderate-to-severe knee OA. Current guidelines (OARSI, ACR) do not strongly recommend viscosupplementation, particularly for moderate-severe disease."
    difficulty: medium
    tags: [hyaluronan, viscosupplementation, knee OA, osteoarthritis, landmark trials, rheumatology]
  - front: "What are the key differences in clinical features between PMR and fibromyalgia regarding pain distribution, investigations, and treatment?"
    back: "PMR: pain in shoulder and hip girdle (proximal), markedly elevated ESR/CRP, normal CK, responds dramatically to low-dose prednisone (12.5-25 mg/day). Fibromyalgia: diffuse widespread pain (axial + left/right + upper/lower), normal ESR/CRP, normal TSH required to exclude thyroid disease, treated with exercise and sleep restoration (not steroids).\n\nThis distinction is critical: PMR is a steroid-responsive inflammatory condition while fibromyalgia is a central sensitization syndrome with normal inflammatory markers. Misdiagnosing fibromyalgia as PMR leads to unnecessary prolonged corticosteroid exposure with significant adverse effects."
    difficulty: medium
    tags: [PMR, fibromyalgia, differential diagnosis, ESR, prednisone, central sensitization, rheumatology]
  - front: "What is apremilast (Otezla®) and what is its mechanism of action in rheumatology?"
    back: "Apremilast is a PDE4 (phosphodiesterase-4) inhibitor that reduces production of TNF-α and other inflammatory cytokines. It is taken orally (titrated to 30 mg BID). It is used in psoriatic arthritis and plaque psoriasis.\n\nPDE4 inhibition increases intracellular cAMP, reducing inflammatory cytokine production. Apremilast has a favorable safety profile compared to biologics (no immunosuppression risk, no TB reactivation screening required, oral administration) but is generally less efficacious than biologic DMARDs. It is an option for mild-to-moderate PsA."
    difficulty: medium
    tags: [apremilast, PDE4 inhibitor, psoriatic arthritis, DMARDs, TNF-alpha, rheumatology]
  - front: "What did the BeSt (Behandel Strategieën) trial demonstrate about therapeutic strategies in early RA?"
    back: "Groups 3 (initial combination + tapered high-dose prednisone) and 4 (initial combination + infliximab) showed significantly greater functional improvement (D-HAQ) and less radiographic damage at 3 months and 1 year compared to groups 1 (sequential DMARD monotherapy) and 2 (step-up combination therapy). Earlier aggressive treatment is superior in early RA.\n\nThe BeSt study (Arthritis Rheum 2005) demonstrated the 'window of opportunity' concept: treating early RA aggressively with combination therapy (including biologics or high-dose steroids) achieves better outcomes than sequential or step-up approaches. This supports the treat-to-target strategy in current RA guidelines."
    difficulty: hard
    tags: [BeSt trial, RA, treat to target, combination therapy, infliximab, early RA, landmark trials, rheumatology]
  - front: "What is the role of sulfasalazine in reactive arthritis (ReA) and spondylarthropathy?"
    back: "Sulfasalazine (SSZ) is used as a DMARD for refractory reactive arthritis with peripheral joint involvement (not axial disease). In spondylarthropathy, the SSZ trial showed 60% improvement vs. 44% placebo; greatest efficacy was in the psoriatic arthritis subgroup. It is used when disease is refractory to NSAIDs.\n\nSulfasalazine is a traditional DMARD used for peripheral spondyloarthritis but lacks evidence for axial disease in ankylosing spondylitis. In reactive arthritis, it is only used for refractory peripheral disease; axial inflammation requires TNF-α inhibitors when refractory to NSAIDs and DMARDs."
    difficulty: medium
    tags: [sulfasalazine, reactive arthritis, spondylarthropathy, psoriatic arthritis, DMARD, rheumatology]
