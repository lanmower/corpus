  - front: "What is suppressive therapy for herpes in pregnancy at 36 weeks?"
    back: "Acyclovir 400 mg PO TID daily OR valacyclovir 500 mg PO BID at 36 weeks\n\nSuppressive therapy near term reduces HSV recurrence and viral shedding at delivery, reducing need for cesarean section."
