  - front: "What is the first-line SSRI therapy for youth according to Toronto Notes 2025?"
    back: "Fluoxetine (Prozac®)\n\nFluoxetine is recommended as first-line SSRI therapy for youth, while paroxetine is not recommended due to controversy."
