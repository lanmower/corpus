# Urology Infertility (Urology) - generated from srs-mccqe1
cards:
  - front: "What is the definition of infertility and what are the relative contributions of male, female, and combined factors?"
    back: "Failure to conceive after 1 year of unprotected and properly timed intercourse. Incidence 15% of all couples: female factor 35-40%, male factor 20%, combined 25-30%.\n\nIn Canada, evaluation typically begins after 1 year (or 6 months if female partner >35 years). Both partners must be investigated. Male factor infertility is often overlooked—semen analysis is the key initial test."
    difficulty: easy
    tags: [urology, infertility, male factor, epidemiology]
  - front: "What are the most common causes of male infertility?"
    back: "Idiopathic (40-50%), varicocele (35-40%), post-infectious (epididymo-orchitis, mumps orchitis), congenital (Klinefelter syndrome), obstructive (vas deferens absence, CF, gonorrhea, chlamydia, trauma), endocrine (HPTA: Kallmann's syndrome, hyperprolactinemia), cryptorchidism.\n\nVaricocele is the most common identifiable and correctable cause. Klinefelter syndrome (47,XXY) presents with triad: small firm testes, gynecomastia, azoospermia. CFTR gene mutation causes congenital bilateral absence of vas deferens."
    difficulty: easy
    tags: [urology, male infertility, varicocele, azoospermia, Klinefelter]
  - front: "What are the normal semen analysis (SA) parameters?"
    back: "Volume: 1.5–7.6 mL. Concentration: >15 million sperm/mL. Morphology: >30% normal forms. Motility: >40% with adequate forward progression. Liquefaction: complete in 20 min. pH: 7.2–7.8. WBC: <10/HPF or <10^6 WBC/mL.\n\nTwo SA specimens collected 1-2 weeks apart are required for diagnosis. Common terminology: teratospermia (abnormal morphology), asthenospermia (abnormal motility), oligospermia (decreased sperm count), azoospermia (no sperm), oligoasthenospermia (combined)."
    difficulty: medium
    tags: [urology, infertility, semen analysis, normal values, azoospermia]
  - front: "What medications are known to impair male fertility (mnemonic SPERM COUNT)?"
    back: "S - Systemic factors/Smoking. P - ? (Psychotropics/SSRIs). E - Estrogens. R - Retrograde ejaculation drugs. M - Medications (cytotoxic, GnRH agonists, anabolic steroids, nitrofurantoin, cimetidine, sulfasalazine, spironolactone, alpha-blockers). C - Cocaine/Cannabis. O - ? N - Narcotics. T - Testicular (prior chemo/radiation, heat).\n\nKey drug classes: cytotoxic chemotherapy (direct gonadotoxicity), GnRH agonists (suppress HPT axis), anabolic steroids (suppress endogenous testosterone), sulfasalazine (directly impairs spermatogenesis), spironolactone (antiandrogenic). Exogenous testosterone alone suppresses spermatogenesis—hypogonadal men wanting fertility should NOT use isolated testosterone therapy."
    difficulty: hard
    tags: [urology, male infertility, medications, spermatogenesis, drug side effects]
  - front: "What hormonal axis governs male reproduction, and what are the roles of LH and FSH?"
    back: "HPTA axis: pulsatile GnRH (hypothalamus) → LH and FSH release (anterior pituitary). LH: acts on Leydig (interstitial) cells → testosterone synthesis. FSH: acts on Sertoli cells → structural/metabolic support to spermatogenic cells. Both FSH and testosterone support spermatogenesis.\n\nSperm route: epididymis → vas deferens → ejaculatory ducts → prostatic urethra. Klinefelter syndrome: elevated FSH/LH, low testosterone. Kallmann's syndrome: congenital GnRH deficiency with anosmia. Prolactin excess suppresses GnRH."
    difficulty: easy
    tags: [urology, male reproduction, HPTA, LH, FSH, testosterone, Sertoli cells, Leydig cells]
  - front: "What genetic investigations are indicated in male infertility?"
    back: "Chromosomal studies (Klinefelter syndrome – 47,XXY), Y-chromosome microdeletion studies, CF gene mutation (CFTR) testing—especially before ICSI in patients with congenital bilateral absence of vas deferens.\n\nICSI requires CF screening of both patient and partner when there is congenital bilateral absence of vas deferens (CBAVD), as the offspring may be carriers or affected. Y-microdeletions are found in men with azoospermia or severe oligospermia."
    difficulty: hard
    tags: [urology, male infertility, genetics, Klinefelter, Y-microdeletion, CFTR, ICSI]
  - front: "What is Kartagener's syndrome and how does it cause male infertility?"
    back: "Kartagener's syndrome is an autosomal recessive disorder causing defective cilia action (primary ciliary dyskinesia). It causes male infertility via immotile sperm (asthenospermia/azoospermia) due to absent or abnormal dynein arms.\n\nThe classic triad is: bronchiectasis, sinusitis, and situs inversus. Infertility results from immotile sperm (same ciliary defect affecting flagella). Females may also have reduced fertility. Diagnosis: nasal brushing biopsy, electron microscopy of cilia."
    difficulty: hard
    tags: [urology, Kartagener syndrome, primary ciliary dyskinesia, infertility, asthenospermia]
  - front: "What is Klinefelter syndrome and what is its classic triad?"
    back: "Klinefelter syndrome (47,XXY): classic triad of small firm testes, gynecomastia, and azoospermia. It causes primary hypogonadism with elevated LH/FSH and low testosterone.\n\nKlinefelter is the most common sex chromosome aneuploidy in males. It is suggested by learning disabilities and poor school performance. Infertile patients with Klinefelter may still have focal spermatogenesis detectable by testicular biopsy. Confirmed by karyotype. Managed with testosterone replacement."
    difficulty: easy
    tags: [urology, Klinefelter syndrome, azoospermia, gynecomastia, genetic, infertility]
  - front: "What investigations are required in the workup of male infertility?"
    back: "1. Semen analysis (x2, collected 1-2 weeks apart). 2. Hormonal evaluation (testosterone, FSH; add LH and prolactin if abnormal). 3. Genetic evaluation (karyotype for Klinefelter, Y-chromosome microdeletion, CFTR mutation). 4. Immunologic studies (antisperm antibodies). 5. Testicular biopsy (if azoospermic). 6. Scrotal U/S (varicocele, testicular size). 7. Vasography (assess vas deferens patency).\n\nAzoospermic patients with NORMAL FSH may be assumed to be obstructive without a testicular biopsy. Abnormal FSH with azoospermia suggests primary testicular failure. The algorithm branches based on bilateral vs. unilateral testicular atrophy and FSH level."
    difficulty: hard
    tags: [urology, male infertility, investigations, semen analysis, hormones, genetics]
  - front: "What are the assisted reproductive technology (ART) options for male infertility?"
    back: "1. Sperm washing + intrauterine insemination (IUI). 2. In vitro fertilization (IVF). 3. Intracytoplasmic sperm injection (ICSI)—especially for severe male factor; requires CF screening of patient and partner when congenital bilateral absence of vas deferens is present.\n\nICSI bypasses natural fertilization barriers, allowing a single sperm to be injected directly into an oocyte. CF screening is mandatory before ICSI in CBAVD cases to counsel couples on risk of having an affected child. ART referral is to an infertility specialist."
    difficulty: medium
    tags: [urology, infertility, ART, ICSI, IUI, IVF, CBAVD]
