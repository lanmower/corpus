# Pediatrics Sids (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the risk factors for Sudden Infant Death Syndrome (SIDS) and the key prevention strategies?"
    back: "Risk factors — Maternal: young age (<20 yr), smoking/alcohol/drug use in pregnancy, late/no prenatal care. Infant: prematurity, low birthweight, prone sleeping, soft bedding, sibling of SIDS victim (5–6x increased risk). Environmental: second-hand smoke, bed-sharing, overheating, swaddling. Prevention: supine sleeping ('Back to Sleep'), firm mattress, avoid loose bedding/pillows, avoid bed-sharing, avoid tobacco smoke, pacifier use (protective), exclusive breastfeeding, immunizations (protective).\n\nSIDS is the leading cause of death between 1–12 months in full-term infants, with peak incidence at 2–4 months. The 'triple-risk model' proposes an underlying vulnerability + a trigger + a critical developmental period. Infant monitors do NOT reduce incidence. The Canadian Paediatric Society endorses supine sleep positioning."
    difficulty: easy
    tags: [pediatrics, SIDS, infant safety, sudden infant death]
