# Rheumatoid Arthritis & Autoimmune (Rheumatology) - generated from srs-mccqe1
cards:
  - front: "Which antibody is most specific for rheumatoid arthritis and predicts erosive disease?"
    back: "Anti-cyclic citrullinated peptide antibody (anti-CCP / ACPA)\n\nAnti-CCP has ~95% specificity for RA and is present in 60–70% of RA patients. It predicts erosive, destructive joint disease and may be positive years before symptom onset. RF has lower specificity."
    difficulty: easy
    tags: [rheumatoid-arthritis, anti-CCP, serology, erosive-disease]
  - front: "A 42-year-old woman presents with 8 weeks of symmetric swollen MCPs, PIPs, and wrists with >1 hour of morning stiffness. RF and anti-CCP are positive. What is the diagnosis and first-line DMARD?"
    back: "Rheumatoid arthritis; methotrexate (MTX) is first-line DMARD\n\nEarly aggressive treatment with MTX prevents joint destruction. ACR/EULAR recommend starting MTX within 3 months of diagnosis. Folic acid supplementation reduces MTX toxicity. Target is remission or low disease activity."
    difficulty: medium
    tags: [rheumatoid-arthritis, methotrexate, DMARD, early-treatment]
  - front: "What blood tests should be monitored in a patient on methotrexate for RA?"
    back: "CBC, LFTs, creatinine every 4–8 weeks initially, then every 3 months\n\nMTX causes hepatotoxicity, myelosuppression, and nephrotoxicity. Alcohol use and other hepatotoxins increase risk. Monitoring guidelines: CBC + differential, AST/ALT, creatinine per ACR/CORA recommendations."
    difficulty: easy
    tags: [methotrexate, monitoring, RA, hepatotoxicity, DMARD]
  - front: "A patient with RA has failed methotrexate monotherapy after 3 months. Disease activity remains moderate. What is the next step per Canadian guidelines?"
    back: "Add a biologic DMARD (e.g., TNF inhibitor) or targeted synthetic DMARD (e.g., JAK inhibitor) in combination with MTX\n\nCORA (Canadian Rheumatology Association) guidelines recommend combination therapy when target (remission/low disease activity) is not achieved at 3 months. TNFi (etanercept, adalimumab) plus MTX is most evidence-based combination."
    difficulty: hard
    tags: [rheumatoid-arthritis, biologic, TNF-inhibitor, JAK-inhibitor, CORA]
  - front: "What is the recommended screening before starting a TNF inhibitor for RA?"
    back: "TB screening (TST or IGRA), hepatitis B serology, and updated vaccinations (especially live vaccines before starting biologics)\n\nTNFi increase risk of reactivation TB and hepatitis B. All patients must be screened for latent TB (treat if positive before starting biologic) and hepatitis B (antiviral prophylaxis if HBsAg+). Live vaccines must be given before biologics."
    difficulty: medium
    tags: [TNF-inhibitor, TB-screening, hepatitis-B, biologic, RA]
  - front: "Which extra-articular manifestation of RA is the most common cause of premature death?"
    back: "Cardiovascular disease (accelerated atherosclerosis)\n\nRA is associated with a 1.5–2x increased CV risk independent of traditional risk factors. Systemic inflammation promotes atherosclerosis. Aggressive disease control and CV risk factor management are essential."
    difficulty: medium
    tags: [rheumatoid-arthritis, cardiovascular, extra-articular, atherosclerosis]
  - front: "What is Felty syndrome?"
    back: "RA + splenomegaly + neutropenia (with recurrent infections)\n\nFelty syndrome occurs in <1% of RA patients, usually with severe seropositive erosive disease. It increases risk of serious infections and lymphoma. Treatment includes aggressive RA control; G-CSF for severe neutropenia."
    difficulty: easy
    tags: [Felty-syndrome, RA, splenomegaly, neutropenia]
  - front: "A 55-year-old woman with RA on biologics develops a dry cough and dyspnea. CXR shows bilateral lower lobe ground-glass opacities. What should be considered?"
    back: "Methotrexate pneumonitis or rheumatoid interstitial lung disease (ILD)\n\nBoth MTX (hypersensitivity pneumonitis) and RA-ILD can present this way. Discontinue MTX. HRCT chest and pulmonology referral are needed. RA-ILD (UIP pattern) may require antifibrotics (nintedanib) or immunosuppression."
    difficulty: hard
    tags: [RA, interstitial-lung-disease, methotrexate-pneumonitis, biologic]
  - front: "Which DAS28 score indicates remission in rheumatoid arthritis?"
    back: "DAS28 <2.6\n\nThe Disease Activity Score 28 (DAS28) uses tender/swollen joint counts, ESR or CRP, and patient global assessment. Scores: <2.6 = remission, 2.6–3.2 = low activity, 3.2–5.1 = moderate, >5.1 = high activity. Treat-to-target aims for DAS28 <2.6."
    difficulty: easy
    tags: [DAS28, disease-activity, RA, remission, treat-to-target]
  - front: "What is the leading cause of atlantoaxial subluxation in patients with long-standing RA?"
    back: "Erosion of the transverse ligament and odontoid process by chronic synovitis of C1-C2 joint\n\nAtlantoaxial instability (C1-C2) occurs in 30–40% of RA patients with long disease duration and can cause cervical myelopathy. Flexion-extension cervical X-rays screen for it. Pre-operative cervical spine assessment is essential before intubation."
    difficulty: medium
    tags: [atlantoaxial-subluxation, RA, cervical-spine, cervical-myelopathy]
  - front: "What are the ACR/EULAR 2010 RA classification criteria?"
    back: "Score >=6/10: joint involvement (0-5), serology RF/ACPA (0-3), acute phase reactants (0-1), duration >=6wks (1). Must have definite synovitis in >=1 joint\n\nFirst-line treatment: methotrexate (anchor DMARD). Target: remission or low disease activity within 6 months. Add biologic (anti-TNF, abatacept, tocilizumab) if inadequate response."
    difficulty: hard
    tags: [RA, ACR/EULAR]
  - front: "What are the 2010 ACR/EULAR classification criteria for RA?"
    back: "Score >=6/10: Joint involvement (0-5), Serology RF/anti-CCP (0-3), Acute phase ESR/CRP (0-1), Duration >=6wk (0-1). Requires at least 1 swollen joint not explained otherwise\n\nEarly RA diagnosis critical - treat within window of opportunity (first 3-6 months). Anti-CCP >95% specific. Seronegative RA exists. CRA 2012 guidelines recommend early aggressive DMARD therapy."
    difficulty: hard
    tags: [RA, ACR/EULAR, classification]
  - front: "What is the treat-to-target approach in RA?"
    back: "DMARD within 3mo of diagnosis. Target remission or low disease activity by 6mo. MTX first-line 15-25mg/wk + folic acid. If inadequate at 3mo: add/switch DMARD or biologic\n\nCRA 2012. Monitor CBC/LFTs/Cr q4-8wk on MTX. Biologic options: TNFi, abatacept, tocilizumab, rituximab, JAK inhibitors. Bridge with short-course prednisone <=7.5mg while waiting for DMARD effect."
    difficulty: hard
    tags: [RA, treat-to-target, methotrexate]
  - front: "What are the conventional DMARDs and their key monitoring?"
    back: "MTX: hepatotoxicity, myelosuppression (CBC/LFTs). Sulfasalazine: GI, myelosuppression. Leflunomide: hepatotoxicity, teratogenic. HCQ: retinal toxicity (eye exam after 5yr)\n\nAll take 6-12wk for effect. MTX contraindicated in pregnancy, liver disease, renal impairment. Folic acid reduces MTX side effects. Leflunomide requires washout with cholestyramine if pregnancy desired."
    difficulty: hard
    tags: [DMARDs, methotrexate, monitoring]
  - front: "What biologics are used in RA and what pre-screening is required?"
    back: "TNFi, IL-6i (tocilizumab), abatacept, rituximab, JAKi (tofacitinib). Pre-screen: TB (IGRA), HBV/HCV, CXR, update vaccines. Avoid live vaccines on biologics\n\nTreat latent TB before starting. TNFi CI in Class III/IV HF and demyelinating disease. JAKi: VTE and malignancy concerns (ORAL Surveillance trial). Biologics increase infection risk significantly."
    difficulty: hard
    tags: [biologics, TNF inhibitor, RA]
  - front: "What are the extra-articular manifestations of RA?"
    back: "Rheumatoid nodules, ILD, pericarditis/pleuritis, scleritis, vasculitis, Felty syndrome (splenomegaly+neutropenia), atlantoaxial subluxation, accelerated atherosclerosis\n\n1.5-2x CV mortality. Screen CV risk factors. ILD in ~10%. C-spine XR before surgery. Secondary amyloidosis in poorly controlled disease. Cervical myelopathy risk with atlantoaxial instability."
    difficulty: hard
    tags: [RA, extra-articular, complications]
  - front: "How do RA and OA differ clinically?"
    back: "RA: symmetric, MCP/PIP/wrist, stiffness >60min, inflammatory, soft tissue swelling. OA: asymmetric, DIP/CMC/knee/hip, stiffness <30min, bony enlargement, non-inflammatory\n\nRA spares DIP (DIP = OA or PsA). RA: ulnar deviation, swan-neck, boutonniere. OA: Heberden (DIP) and Bouchard (PIP) nodes. XR: RA=erosions+periarticular osteopenia; OA=osteophytes+joint space narrowing."
    difficulty: medium
    tags: [RA, OA, differential]
  - front: "How is an RA flare managed?"
    back: "Short-course prednisone 10-15mg taper 2-4wk, IA steroid for monoarticular flare, optimize DMARD, assess adherence. Rule out septic arthritis in acute monoarthritis\n\nAvoid long-term glucocorticoids. >=2 flares on current regimen: escalate therapy. NSAIDs for symptoms but no disease modification. Septic joint is always in differential for acute monoarticular flare."
    difficulty: hard
    tags: [RA flare, prednisone, management]
  - front: "What perioperative considerations exist for RA patients on DMARDs?"
    back: "MTX: continue (reduces flare). Biologics: hold 2-5 half-lives pre-surgery. C-spine XR for intubation safety. Stress-dose steroids if on chronic prednisone. Resume biologics when wound healed\n\nCRA/ACR perioperative guidelines. Infection risk increased post-surgery on biologics. Flexion-extension C-spine views assess atlantoaxial stability. Fragile skin and osteoporosis considerations."
    difficulty: hard
    tags: [RA, perioperative, biologics]
  - front: "What is the management of acute gout vs chronic gout prevention?"
    back: "Acute: NSAIDs or colchicine (1.2mg then 0.6mg at 1h) or prednisone 30-40mg x5d. Do NOT start/stop allopurinol during flare. Chronic: allopurinol start 100mg titrate to urate <360 umol/L\n\nCrystal confirmation gold standard (negatively birefringent MSU). Allopurinol start low (50mg if CKD). Febuxostat if intolerant. Colchicine prophylaxis 0.6mg daily x6mo when starting ULT. Lifestyle: weight loss, limit alcohol/purines."
    difficulty: hard
    tags: [gout, colchicine, allopurinol]
  - front: "How is pseudogout (CPPD) differentiated from gout?"
    back: "CPPD: positively birefringent rhomboid crystals, chondrocalcinosis on XR, large joints (knee/wrist). No ULT equivalent. Treat acute: NSAIDs/colchicine/steroids. If <60: investigate metabolic causes (hyperPTH, hemochromatosis)\n\nUnlike gout no disease-modifying therapy exists. Chronic CPPD can mimic RA or OA. Associated: hyperparathyroidism, hemochromatosis, hypomagnesemia. Joint aspiration is both diagnostic and therapeutic."
    difficulty: medium
    tags: [pseudogout, CPPD, crystal arthropathy]
  - front: "What is the difference between psoriatic arthritis and rheumatoid arthritis regarding nail changes?"
    back: "Psoriatic arthritis (affecting 20-30% of psoriasis patients) is associated with nail involvement (pitting, onycholysis, oil spots). Nail or scalp psoriasis increases risk of developing psoriatic arthritis. RA does not typically cause nail changes.\n\nNail involvement is a key predictor of psoriatic arthritis development in psoriasis patients. Psoriatic arthritis can present with asymmetric oligoarthritis, DIP joint involvement, dactylitis, and enthesitis — features that distinguish it from RA."
    difficulty: medium
    tags: [psoriatic arthritis, psoriasis, nail changes, rheumatoid arthritis, dactylitis]
  - front: "What skin findings are associated with reactive arthritis (formerly Reiter's syndrome)?"
    back: "Keratoderma blennorrhagica (on feet) and balanitis circinata (on male penis).\n\nReactive arthritis classically follows GI or genitourinary infection and presents with the triad of urethritis, arthritis, and conjunctivitis. The skin findings are characteristic and help distinguish it from other seronegative arthropathies."
    difficulty: medium
    tags: [reactive arthritis, keratoderma blennorrhagica, balanitis circinata]
  - front: "What are the features of giant cell arteritis (temporal arteritis) and what is the gold standard test?"
    back: "Vasculitis of large and mid-sized arteries; female:male = 3:1; most common age >70 yr. Features: headache, scalp tenderness, jaw claudication, arthralgia, myalgia, fever, malaise, weight loss. Exam: tender temporal artery, RAPD, optic disc edema. Labs: elevated ESR, elevated CRP. Gold standard: temporal artery biopsy. Associated with polymyalgia rheumatica. Treatment: high-dose steroids immediately — do NOT wait for biopsy results.\n\nUntreated GCA can cause sudden irreversible blindness (from anterior ischemic optic neuropathy). High-dose prednisone (40–60 mg/day) must be started immediately when GCA is clinically suspected. Biopsy should ideally be done within 1–2 weeks of starting steroids but results don't change the decision to treat."
    difficulty: medium
    tags: [giant cell arteritis, temporal arteritis, ESR, blindness, steroids]
  - front: "What features distinguish inflammatory from non-inflammatory joint pain?"
    back: "Inflammatory: morning stiffness >30 min, pain/stiffness that eases with activity, mid-day fatigue, soft tissue swelling. Non-inflammatory: morning stiffness <30 min, stiffness short-lived after inactivity, increasing pain with activity.\n\nThis distinction guides the differential diagnosis. Inflammatory arthritis includes RA, crystalline arthritis (gout, pseudogout), reactive arthritis, and septic arthritis. Non-inflammatory includes osteoarthritis and mechanical causes. The pattern of joint involvement (mono vs. polyarticular, symmetric vs. asymmetric) further refines the differential."
    difficulty: easy
    tags: [joint pain, inflammatory arthritis, osteoarthritis, morning stiffness]
  - front: "What is the ED management of a septic joint?"
    back: "Empiric IV antibiotics PLUS orthopedic consultation for joint decompression and drainage. Joint aspirate should be sent for: culture, WBC, polymorphonuclear cells, glucose, Gram stain, and crystals.\n\nSeptic arthritis (usually Staph aureus, or Neisseria gonorrhoeae in sexually active young adults) is a medical emergency. Delay in drainage causes irreversible cartilage damage. WBC >50,000/μL with >75% PMNs strongly suggests septic arthritis; crystals suggest gout/pseudogout but do not exclude concurrent infection."
    difficulty: medium
    tags: [septic joint, joint aspiration, IV antibiotics, orthopedics]
