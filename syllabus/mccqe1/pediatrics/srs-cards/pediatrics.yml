# Pediatrics (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the contraindication for rotavirus (Rot-1) vaccine?"
    back: "History of intussusception, immunocompromised status, and abdominal disorders (e.g., Meckel's diverticulum).\n\nRotavirus vaccine is a live oral vaccine. Since intussusception is a known rare adverse event, prior history is an absolute contraindication. Immunocompromised infants cannot receive live vaccines."
    difficulty: easy
    tags: [pediatrics, immunization, vaccines]
  - front: "What is the contraindication for MMR vaccine?"
    back: "Pregnancy, immunocompromised infants (except healthy HIV-positive children), anaphylactic reaction to gelatin, and cannot give within 4 weeks of TB skin test.\n\nMMR is a live attenuated vaccine and is contraindicated in pregnancy and immunocompromised patients. It can interfere with tuberculin skin test results if given within 4 weeks."
    difficulty: easy
    tags: [pediatrics, immunization, vaccines]
  - front: "Which live vaccines can be given to patients with asplenia, isolated IgA deficiency, or complement deficiencies?"
    back: "Live attenuated vaccines can be given to those with isolated IgA, IgG subclass, or complement deficiencies, or asplenia.\n\nThese conditions represent limited immune defects that do not significantly impair the response to live vaccines. However, severely immunocompromised patients should avoid live vaccines."
    difficulty: medium
    tags: [pediatrics, immunization, immunodeficiency]
  - front: "What are the average growth parameters at birth for weight, length, and head circumference?"
    back: "Weight: 3.25 kg (7 lbs), Length: 50 cm (20 in), Head circumference: 35 cm (14 in).\n\nThese are standard values that serve as baselines. Birth weight doubles by 4-5 months, triples by 1 year, and quadruples by 2 years. Half of adult height is achieved by age 2."
    difficulty: easy
    tags: [pediatrics, growth, neonatology]
  - front: "At what age does the Moro reflex disappear?"
    back: "3-6 months.\n\nThe Moro reflex involves abduction and extension of arms followed by flexion and adduction when head support is suddenly withdrawn. Persistence beyond 6 months suggests neurological abnormality such as cerebral palsy."
    difficulty: easy
    tags: [pediatrics, development, reflexes]
  - front: "At what age should a child be able to walk without support, use a fine pincer grasp, and say one word with meaning?"
    back: "12 months.\n\nAt 12 months, children typically walk a few steps with wide gait, use fine pincer grasp with fingertips, say 1 word besides mama/dada, and can follow 1-step commands with gesture."
    difficulty: easy
    tags: [pediatrics, development, milestones]
  - front: "What are the developmental red flags that should prompt further evaluation?"
    back: "No social smile at 4 months, no pointing at 15-18 months, fewer than 6 words at 18 months, hand preference before 18 months, and loss of previously acquired skills at any age.\n\nThese red flags suggest possible developmental delay, cerebral palsy, or autism spectrum disorder. Early identification allows for early intervention which improves outcomes."
    difficulty: easy
    tags: [pediatrics, development, screening]
  - front: "What is the recommended age for exclusive breastfeeding, and what supplementation is required?"
    back: "Exclusive breastfeeding for the first 6 months, with vitamin D supplementation (400 IU/day, or 800 IU/day if risk factors present).\n\nBreastfeeding provides optimal nutrition and immunological benefits. Vitamin D supplementation is needed because breast milk has insufficient vitamin D, and deficiency leads to rickets."
    difficulty: easy
    tags: [pediatrics, nutrition, breastfeeding]
  - front: "Why should honey be avoided in infants under 12 months?"
    back: "Risk of infant botulism from Clostridium botulinum spores.\n\nThe immature infant gut cannot prevent colonization by C. botulinum spores found in honey. The bacteria produce toxin in the GI tract causing descending flaccid paralysis."
    difficulty: easy
    tags: [pediatrics, nutrition, infectious disease]
  - front: "What are the absolute maternal contraindications to breastfeeding?"
    back: "HIV, HTLV type I and II, and infant galactosemia.\n\nHIV and HTLV are transmissible through breast milk. Galactosemia is an inborn error of metabolism where the infant cannot metabolize galactose in breast milk, leading to liver failure and sepsis."
    difficulty: easy
    tags: [pediatrics, breastfeeding, contraindications]
  - front: "What is the definition of infantile colic and when does it typically resolve?"
    back: "Unexplained paroxysms of irritability and crying >3 hours/day, >3 days/week, for >3 weeks (rule of 3s/Wessel criteria) in a healthy, well-fed baby. Resolves by 3-6 months.\n\nColic is a diagnosis of exclusion with onset at 10 days to 3 months, peaking at 6-8 weeks. Etiology is unknown. Management focuses on parental support and reassurance."
    difficulty: easy
    tags: [pediatrics, colic, common complaints]
  - front: "What is the definition and management of primary nocturnal enuresis?"
    back: "Involuntary urinary incontinence at night in a child >5 years who has never achieved bladder control. Management: reassurance (~20% resolve spontaneously/year), behavioral modification, wet alarm (70% success), desmopressin for short-term use in children >7 years.\n\nPrimary nocturnal enuresis is a developmental/maturational lag. It should not be formally treated until age 7 due to high spontaneous cure rates. Punishment should be avoided."
    difficulty: easy
    tags: [pediatrics, enuresis, common complaints]
  - front: "What is the definition of failure to thrive (FTT)?"
    back: "Weight <3rd percentile, falls across two major percentile curves, or <80% of expected weight for height and age.\n\nInadequate caloric intake is the most common cause. The pattern of growth parameter abnormalities helps identify etiology: decreased weight alone suggests caloric insufficiency, while all three decreased suggest intrauterine insult."
    difficulty: easy
    tags: [pediatrics, growth, failure to thrive]
  - front: "What defines childhood obesity for ages 5-19 years?"
    back: "Overweight: BMI >85th percentile. Obese: BMI >97th percentile.\n\nFor children 2-5 years, different cutoffs apply (>97th and >99.9th). Childhood obesity is associated with T2DM, dyslipidemia, HTN, slipped capital femoral epiphysis, OSA, and psychological trauma."
    difficulty: easy
    tags: [pediatrics, obesity, growth]
  - front: "What are the SIDS risk factors and prevention strategies?"
    back: "Risk factors: prone sleeping, soft bedding, prematurity, maternal smoking/alcohol/drug use, bed-sharing, overheating. Prevention: 'Back to Sleep, Front to Play,' avoid bed-sharing, avoid smoke exposure, firm mattress, breastfeeding, pacifier use.\n\nSIDS is the leading cause of death between 1-12 months with peak incidence at 2-4 months. The 'Back to Sleep' campaign significantly reduced SIDS rates. Pacifiers and immunizations appear protective."
    difficulty: easy
    tags: [pediatrics, SIDS, injury prevention]
  - front: "What physical findings in a child should raise suspicion of non-accidental injury (child abuse)?"
    back: "Bruises on soft-tissue areas (abdomen, buttocks, genitalia, cheeks, ears, neck), patterned injuries, posterior rib/metaphyseal/scapular fractures, immersion burns, retinal hemorrhages, and injuries inconsistent with developmental age or provided history.\n\nThe TEN-4-FACESp tool screens for concerning bruising in children <4 years. Traumatic head injury is the leading cause of death in child maltreatment. Physicians have a legal duty to report suspected abuse."
    difficulty: medium
    tags: [pediatrics, child abuse, legal]
  - front: "What are the three fetal shunts and what triggers their closure at birth?"
    back: "1) Ductus arteriosus (PA to aorta) - closes due to increased O2 and decreased prostaglandins. 2) Foramen ovale (RA to LA) - closes due to increased left atrial pressure from increased pulmonary flow. 3) Ductus venosus (umbilical vein to IVC) - closes after placental separation.\n\nUnderstanding fetal circulation is key to understanding congenital heart disease. Many cyanotic heart defects depend on these shunts remaining open, which is why prostaglandin E1 is given to maintain ductal patency."
    difficulty: medium
    tags: [pediatrics, cardiology, fetal circulation]
  - front: "What is the most common congenital heart defect?"
    back: "Ventricular septal defect (VSD), accounting for 30-50% of all congenital heart defects.\n\nMost small VSDs close spontaneously. Large VSDs can cause CHF by 2 months and secondary pulmonary HTN if untreated. The murmur intensity is inversely related to VSD size (loud = small)."
    difficulty: easy
    tags: [pediatrics, cardiology, congenital heart disease]
  - front: "What is the classic murmur of a patent ductus arteriosus (PDA)?"
    back: "Continuous 'machinery' murmur best heard at the left infraclavicular area, with bounding pulses and wide pulse pressure.\n\nPDA connects the descending aorta to the left pulmonary artery. Indomethacin antagonizes prostaglandin E2 to promote closure but is only effective in premature infants. Term infants typically require catheter or surgical closure."
    difficulty: easy
    tags: [pediatrics, cardiology, PDA]
  - front: "What are the four components of Tetralogy of Fallot?"
    back: "VSD, right ventricular outflow tract obstruction (RVOTO/pulmonary stenosis), overriding aorta, and right ventricular hypertrophy (RVH).\n\nToF is the most common cyanotic heart defect diagnosed beyond infancy. The degree of RVOTO determines cyanosis severity. 'Tet spells' are treated with knee-chest position, O2, fluid bolus, morphine, and propranolol."
    difficulty: easy
    tags: [pediatrics, cardiology, tetralogy of Fallot]
  - front: "What is the most common cyanotic congenital heart defect in neonates, and what is the classic CXR finding?"
    back: "Transposition of the great arteries (TGA). CXR shows an 'egg on a string' appearance (egg-shaped heart with narrow mediastinum).\n\nIn TGA, the systemic and pulmonary circulations run in parallel. Survival depends on mixing through PDA, ASD, or VSD. Management involves prostaglandin E1 infusion and arterial switch operation within the first 2 weeks."
    difficulty: medium
    tags: [pediatrics, cardiology, TGA]
  - front: "What are the 4 key features of congestive heart failure in children?"
    back: "Tachycardia, tachypnea, cardiomegaly, and hepatomegaly ('2 Tachys and 2 Megalys').\n\nUnlike adults, orthopnea, PND, and pedal edema are uncommon in children. Infants present with feeding difficulties, diaphoresis, and FTT. Management includes diuretics, ACEI, and correction of underlying cause."
    difficulty: easy
    tags: [pediatrics, cardiology, CHF]
  - front: "What is the most common cause of congenital heart block in neonates?"
    back: "Maternal anti-Ro (SSA) or anti-La (SSB) antibodies, as seen in mothers with SLE.\n\nThese maternal IgG antibodies cross the placenta and damage the fetal cardiac conduction system. It is often diagnosed in utero and may lead to fetal hydrops. Symptomatic patients require pacemaker implantation."
    difficulty: medium
    tags: [pediatrics, cardiology, heart block, autoimmune]
  - front: "What distinguishes innocent from pathological heart murmurs in children?"
    back: "Innocent: asymptomatic, systolic ejection murmur, grade <3/6, soft/vibratory, physiologic S2 splitting, varies with position. Pathological: symptoms present, diastolic/pansystolic/continuous, grade ≥3/6, harsh, fixed split or single S2.\n\n50-80% of children have audible murmurs at some point, most of which are innocent. Murmurs become louder in high-output states like fever and anemia. Five common innocent murmurs include Still's, venous hum, and pulmonary flow."
    difficulty: medium
    tags: [pediatrics, cardiology, murmurs]
  - front: "What is global developmental delay (GDD)?"
    back: "Significant delay (≥2 SDs below mean) in at least 2 developmental domains in a child <5 years. Domains include gross motor, fine motor, speech/language, cognitive, social/personal, and ADLs.\n\nGDD affects up to 3% of the pediatric population. First-line investigations include chromosomal microarray and Fragile X DNA testing. After age 5, the term 'intellectual disability' is used instead."
    difficulty: easy
    tags: [pediatrics, development, GDD]
  - front: "What is the most common preventable cause of intellectual disability?"
    back: "Fetal Alcohol Spectrum Disorder (FASD), with a prevalence of ~1%.\n\nFASD sentinel facial features include short palpebral fissures, flattened philtrum, and thin upper lip. Diagnosis requires multidisciplinary assessment. No safe amount of alcohol in pregnancy has been established."
    difficulty: easy
    tags: [pediatrics, FASD, intellectual disability]
  - front: "What are the DSM-5 diagnostic criteria for Autism Spectrum Disorder?"
    back: "1) Persistent deficits in social communication/interaction (social-emotional reciprocity, nonverbal communication, relationships). 2) Restricted, repetitive patterns of behavior/interests (≥2 of: stereotyped movements, insistence on sameness, fixated interests, sensory hyper/hypo-reactivity). Symptoms present in early development.\n\nASD prevalence is 1 in 36 children (M:F=4:1). It is not better explained by intellectual disability. Treatment is team-based with behavioral therapy, and pharmacotherapy targets comorbid symptoms, not ASD itself."
    difficulty: medium
    tags: [pediatrics, autism, neurodevelopment]
  - front: "What is the first-line treatment for ADHD in children ≥6 years?"
    back: "Combination of psychosocial intervention plus stimulant medication (methylphenidate or amphetamines). For children <6 years, psychosocial intervention alone is first line.\n\nADHD diagnosis requires onset before age 12, symptoms in ≥2 settings, and ≥6 symptoms for ≥6 months. Second-line agents include atomoxetine and guanfacine XR. Treatment with stimulants actually decreases future substance misuse risk."
    difficulty: easy
    tags: [pediatrics, ADHD, pharmacology]
  - front: "What is the diagnostic criteria for Type 1 Diabetes in children?"
    back: "Symptoms (polyuria, polydipsia, weight loss) plus random glucose ≥11.1 mmol/L, OR two of: fasting glucose ≥7.0, 2h OGTT ≥11.1, HbA1c ≥6.5% on separate occasions.\n\nT1DM is the most common form in children with bimodal peaks at 5-9 and 10-14 years. ~30% present with DKA. HbA1c target is <7.5% to minimize hypoglycemia. Screen for microvascular complications and autoimmune comorbidities."
    difficulty: easy
    tags: [pediatrics, endocrinology, diabetes]
  - front: "What are the warning signs of cerebral edema in pediatric DKA?"
    back: "Headache, bradycardia, irritability, decreased level of consciousness, incontinence, and specific neurological signs.\n\nCerebral edema complicates 0.5-1% of DKA cases. Management includes mannitol, IV fluid restriction, and ICU transfer. Insulin bolus should be avoided and infusion delayed until 1 hour after fluid resuscitation in pediatric DKA protocols."
    difficulty: medium
    tags: [pediatrics, DKA, emergency]
  - front: "What is 21-hydroxylase deficiency, and how does it present?"
    back: "Autosomal recessive enzyme deficiency causing ~95% of congenital adrenal hyperplasia (CAH). Decreased cortisol and aldosterone with increased androgens. Classic with salt-wasting: FTT, hyperkalemia, hyponatremia. Classic without salt-wasting: virilization. Most common cause of ambiguous genitalia in 46,XX females.\n\nElevated 17-OH progesterone is diagnostic. Cortisol deficiency causes elevated ACTH and adrenal hyperplasia. Treatment includes glucocorticoids (hydrocortisone) and mineralocorticoids (fludrocortisone) with stress dosing."
    difficulty: medium
    tags: [pediatrics, endocrinology, CAH]
  - front: "What is the normal sequence of pubertal development in females?"
    back: "1) Thelarche (breast budding), 2) Pubarche (axillary hair, body odor, acne), 3) Growth spurt, 4) Menarche (mean age 12.5 years). Onset ages 8-13.\n\nEarly puberty in females is common and often constitutional. Precocious puberty is defined as development of secondary sexual characteristics before age 8 in females or 9 in males. Central precocious puberty is treated with GnRH agonists."
    difficulty: easy
    tags: [pediatrics, endocrinology, puberty]
  - front: "How do you assess the degree of dehydration in a child <2 years?"
    back: "Mild (5%): normal pulse, slightly dry mucosa, decreased urine output. Moderate (10%): rapid pulse, dry mucosa, sunken fontanelle/eyes, decreased skin turgor. Severe (15%): rapid weak pulse, decreased BP, anuria, tenting, markedly sunken fontanelle.\n\nFor children >2 years, the percentages are 3%, 6%, and 9%. Capillary refill >3 seconds suggests severe dehydration. IV resuscitation with NS 20 mL/kg bolus is indicated for severe dehydration."
    difficulty: medium
    tags: [pediatrics, fluids, dehydration]
  - front: "What is the 4:2:1 rule for maintenance IV fluids in pediatrics?"
    back: "First 10 kg: 4 mL/kg/hr. Next 10 kg (11-20): add 2 mL/kg/hr. Each kg >20: add 1 mL/kg/hr.\n\nEquivalent to the 100:50:20 rule per day. All pediatric maintenance fluids should contain dextrose due to higher risk of hypoglycemia. Standard choice is D5W/NS + KCl 20 mEq/L for children. Sodium should not be corrected faster than 12 mmol/L/day."
    difficulty: easy
    tags: [pediatrics, fluids, maintenance]
  - front: "What is the classic triad of pyloric stenosis?"
    back: "Projectile non-bilious emesis within 30 minutes after feeding, palpable 'olive' mass in RUQ, and hypochloremic hypokalemic metabolic alkalosis.\n\nPyloric stenosis typically presents at 2-6 weeks of age. Ultrasound of the pylorus is diagnostic. The metabolic alkalosis results from loss of gastric HCl through vomiting. Surgical pyloromyotomy is curative."
    difficulty: easy
    tags: [pediatrics, GI, pyloric stenosis]
  - front: "What is the classic triad of intussusception?"
    back: "Colicky abdominal pain, vomiting, and 'red currant jelly' stools (present in <15% of patients).\n\nIntussusception usually occurs at the ileocecal junction in children <2 years. Ultrasound is diagnostic (target sign). Air or saline enema reduces 75% of cases. Recurrence rate is 10-15%."
    difficulty: easy
    tags: [pediatrics, GI, intussusception]
  - front: "What is the '4 Fs' management of toddler's diarrhea?"
    back: "Adequate Fiber, normal Fluid intake, lower dietary Fat (35-40%), and discourage excess Fruit juice.\n\nToddler's diarrhea is the most common cause of chronic diarrhea in infancy (6-36 months). It is a diagnosis of exclusion in a thriving child. It resolves spontaneously between 2-4 years."
    difficulty: easy
    tags: [pediatrics, GI, diarrhea]
  - front: "What is the first-line treatment for acute otitis media in children?"
    back: "High-dose amoxicillin 75-90 mg/kg/day BID for 5 days (10 days if age <2 years, perforated TM, or recurrent AOM).\n\nMost common pathogens are S. pneumoniae and H. influenzae. Watchful waiting is appropriate for mild cases in children >6 months. Second-line is amoxicillin-clavulanate. Recurrent AOM may require tympanostomy tubes."
    difficulty: easy
    tags: [pediatrics, infectious disease, otitis media]
  - front: "What are the CSF findings in bacterial vs viral meningitis?"
    back: "Bacterial: elevated neutrophils (100-10000), low glucose (CSF:blood <0.4), elevated protein (>1.0 g/L). Viral: elevated lymphocytes (10-1000), normal glucose, mildly elevated protein (0.4-1.0 g/L).\n\nLP is required for definitive diagnosis but should not delay empiric antibiotics. Neonatal meningitis is treated with ampicillin + cefotaxime; children >90 days get ceftriaxone + vancomycin. Dexamethasone is given before antibiotics for H. influenzae meningitis."
    difficulty: medium
    tags: [pediatrics, infectious disease, meningitis]
  - front: "What are the three stages of pertussis (whooping cough)?"
    back: "1) Catarrhal (1-7 days): URTI symptoms. 2) Paroxysmal (4-6 weeks): paroxysms of cough with inspiratory whoop, post-tussive emesis. 3) Convalescent (1-2 weeks): decreasing frequency and severity of cough.\n\nPertussis is caused by B. pertussis. Infants <6 months may present with apnea without whoop. Treatment is macrolide antibiotics (azithromycin). Prophylaxis with macrolides for all household contacts."
    difficulty: easy
    tags: [pediatrics, infectious disease, pertussis]
  - front: "What is the Jones Criteria for diagnosing rheumatic fever?"
    back: "Requires 2 major OR 1 major + 2 minor criteria PLUS evidence of preceding strep infection. Major: carditis/valvulitis, arthritis, Sydenham chorea, subcutaneous nodules, erythema marginatum. Minor: arthralgia, fever, elevated ESR/CRP, prolonged PR interval.\n\nRheumatic fever is an inflammatory disease from antibody cross-reactivity following GAS infection. Peak incidence is 5-15 years. Treatment is penicillin x 10 days. Secondary prophylaxis with daily penicillin prevents recurrence."
    difficulty: medium
    tags: [pediatrics, rheumatic fever, cardiology]
  - front: "What is the approach to the febrile neonate (<28 days)?"
    back: "Admit for full septic workup (CBC, blood/urine/CSF cultures, CXR) and empiric antibiotics regardless of clinical appearance.\n\nFebrile neonates are considered high-risk regardless of clinical features because protocols like Rochester Criteria are not as sensitive in the 1-28 day age group. The younger the child, the greater the difficulty in clinically assessing severity."
    difficulty: medium
    tags: [pediatrics, infectious disease, fever, neonatology]
  - front: "What are the features of erythema infectiosum (fifth disease)?"
    back: "Caused by parvovirus B19. 'Slapped cheek' bilateral facial erythema with circumoral sparing, followed by lacy reticular rash on trunk/extremities. Rash appears 10-17 days after prodromal flu-like illness.\n\nThe rash appears after viremia resolves (immune response), so patients are no longer infectious when the rash appears. Complications include transient aplastic crisis in patients with chronic hemolytic anemias."
    difficulty: easy
    tags: [pediatrics, infectious disease, exanthems]
  - front: "What are the classic features of Kawasaki disease?"
    back: "Fever ≥5 days plus ≥4 of: bilateral conjunctival injection, oral changes (strawberry tongue, cracked lips), cervical lymphadenopathy, polymorphous rash, extremity changes (edema, desquamation).\n\nKawasaki disease is the most common cause of acquired heart disease in children in developed countries. Coronary artery aneurysms are the major complication. Treatment is IVIG plus high-dose aspirin."
    difficulty: medium
    tags: [pediatrics, Kawasaki disease, vasculitis]
  - front: "What is the classic presentation of infectious mononucleosis?"
    back: "Classic triad: fever, generalized non-tender lymphadenopathy, and exudative pharyngitis/tonsillitis. May also have hepatosplenomegaly and rash (especially after ampicillin/amoxicillin).\n\nCaused by EBV, peak incidence 15-19 years. Diagnosed with heterophile antibody test (Monospot, 85% sensitive in older children). All patients should avoid contact sports for 6-8 weeks due to risk of splenic rupture."
    difficulty: easy
    tags: [pediatrics, infectious disease, EBV]
  - front: "What are the most common pediatric UTI pathogens and when should a child be admitted?"
    back: "E. coli accounts for ~70%. Admit if: age <2 months, urosepsis, persistent vomiting, inability to tolerate oral medications, moderate-severe dehydration, immunocompromised.\n\nUTI prevalence in febrile infants is 7%. Clean catch or catheterized specimen is required for diagnosis. Bag specimens can only be used to rule out (not confirm) UTI. Renal/bladder ultrasound recommended for all febrile UTIs in children <2 years."
    difficulty: medium
    tags: [pediatrics, infectious disease, UTI]
  - front: "What is the triad of hemolytic uremic syndrome (HUS)?"
    back: "1) Non-immune microangiopathic hemolytic anemia, 2) Thrombocytopenia, 3) Acute renal injury.\n\nSTEC-HUS (90%) is caused by Shiga toxin-producing E. coli (O157:H7). Presents 3-10 days after bloody diarrhea. Avoid antibiotics, NSAIDs, and antidiarrheal agents in STEC-HUS. Blood smear shows schistocytes."
    difficulty: easy
    tags: [pediatrics, nephrology, HUS]
  - front: "What are the defining features of nephrotic syndrome vs nephritic syndrome?"
    back: "Nephrotic (HELP): Hypoalbuminemia, Edema, Lipids elevated, Proteinuria >50 mg/kg/day. Nephritic: Hematuria (RBC casts), proteinuria (<50 mg/kg), azotemia, oliguria, HTN.\n\nMCD causes 85% of idiopathic nephrotic syndrome in children, peaking at ages 2-6. MCD responds to prednisone in 80% of cases. Post-streptococcal GN is the most common cause of nephritic syndrome with decreased C3."
    difficulty: medium
    tags: [pediatrics, nephrology, nephrotic syndrome, nephritic syndrome]
  - front: "What are the most common causes of childhood cancer by age?"
    back: "Leukemia is the most common cancer in children 0-14 years (ALL 80%, AML 15%). Neuroblastoma is most common in the first year of life. Wilms' tumor peaks at 2-5 years.\n\nChildren with Down syndrome are 15x more likely to develop leukemia. Neuroblastoma arises from sympathetic tissue (adrenal most common site) with elevated urine catecholamines. Wilms' tumor presents as an asymptomatic abdominal mass in 80%."
    difficulty: easy
    tags: [pediatrics, oncology, leukemia]
  - front: "What syndromes are associated with Wilms' tumor?"
    back: "WAGR syndrome (Wilms' tumor, Aniridia, Genitourinary anomalies, Range of developmental delays) - 50% risk. Beckwith-Wiedemann syndrome - 5-10% risk. Denys-Drash syndrome - 90% risk.\n\nWAGR involves 11p13 deletion. Beckwith-Wiedemann features organomegaly, hemihypertrophy, and omphalocele. Denys-Drash features gonadal dysgenesis and nephropathy. Wilms' tumor has >95% 5-year survival with surgery and chemotherapy."
    difficulty: medium
    tags: [pediatrics, oncology, Wilms tumor, genetics]
  - front: "What is the congenital hypothyroidism presentation and when must treatment begin?"
    back: "Usually asymptomatic at birth (maternal T4 crosses placenta). Later: prolonged jaundice, feeding difficulty, lethargy, constipation, umbilical hernia, macroglossia, large fontanelles, hypotonia. Most commonly detected via newborn screening. Treatment (thyroxine) must begin within 2 weeks.\n\nCongenital hypothyroidism occurs in 1:2000-4000 births and is one of the most common preventable causes of intellectual disability. If treatment is delayed beyond 3-6 months, permanent developmental delay results."
    difficulty: easy
    tags: [pediatrics, endocrinology, hypothyroidism, neonatology]
  - front: "What is coarctation of the aorta and how does it present?"
    back: "Narrowing of the aorta at the level of the ductus arteriosus. Presents with BP discrepancy between upper and lower extremities (>20 mmHg), diminished/delayed femoral pulses (brachial-femoral delay). Associated with bicuspid aortic valve (50%) and Turner syndrome (35%).\n\nSevere coarctation presents with shock in neonatal period when the ductus closes. Management: prostaglandins to keep ductus patent, then surgical correction. Older children may receive balloon arterioplasty."
    difficulty: medium
    tags: [pediatrics, cardiology, coarctation]
  - front: "What are the Rochester criteria used for?"
    back: "To identify febrile infants <60 days at low risk of serious bacterial infection. Low risk: clinically well, WBC 5-15 x 10⁹/L, urinalysis <10 WBC/HPF, stool <5 WBC/HPF (if diarrhea), born >37 weeks, no hospitalizations, no prior antibiotics, no chronic disease.\n\nThese criteria are not sensitive in the 0-28 day age group, so all febrile neonates <28 days should be treated as high risk. The younger the child, the greater the difficulty in clinically assessing illness severity."
    difficulty: medium
    tags: [pediatrics, infectious disease, fever, neonatology]
  - front: "What is the celiac disease screening consideration in children with IgA deficiency?"
    back: "Celiac disease has increased prevalence of IgA deficiency. Since tissue transglutaminase (tTG) is an IgA-detecting test, you must order an accompanying total IgA level to avoid false negatives.\n\nCeliac disease in children presents at any age, often 6-24 months with gluten introduction. Symptoms include FTT, diarrhea, iron-deficiency anemia, and dermatitis herpetiformis. A gluten-free diet must avoid BROW foods (Barley, Rye, Oats, Wheat)."
    difficulty: medium
    tags: [pediatrics, GI, celiac disease]
  - front: "What are the features of scarlet fever?"
    back: "Acute onset fever, sore throat, strawberry tongue. Sandpaper rash starting in groin/axillae/neck 24-48h after pharyngitis, becomes generalized with perioral sparing. Pastia's lines in flexural areas. Desquamation after 3-4 days.\n\nScarlet fever is a delayed-type hypersensitivity to GAS pyrogenic exotoxin requiring prior strep exposure. Treatment is penicillin, amoxicillin, or erythromycin for 10 days. Complications include rheumatic fever and post-streptococcal GN."
    difficulty: easy
    tags: [pediatrics, infectious disease, scarlet fever]
  - front: "What is the HEEADSSS adolescent psychosocial assessment?"
    back: "Home, Education/Employment, Eating, Activities, Drugs, Sexuality, Suicidality/Depression, Safety/Violence.\n\nReview confidentiality and its limits with adolescents before taking history. Start with impersonal questions before personal ones. The CRAFFT screen is validated for substance use in adolescents 12-21 years. Age of sexual consent in Canada is 16."
    difficulty: easy
    tags: [pediatrics, adolescent medicine, assessment]
  - front: "What are the characteristics of night terrors vs nightmares?"
    back: "Night terrors: first 1/3 of night, arousal from deep (stage 4) sleep, screaming, eyes open, no memory of event, inconsolable, 15% of children. Nightmares: last 1/3 of night, REM sleep, child alert on awakening with clear recall, common ages 4-7.\n\nNight terrors involve autonomic arousal without recall. Management for both is reassurance. For night terrors, parents can try to wake the child 15 minutes before the usual time to disrupt the pattern. Both typically resolve before puberty."
    difficulty: easy
    tags: [pediatrics, sleep, parasomnias]
  - front: "What is the OSA management in children?"
    back: "First-line: adenotonsillectomy and weight management. Intranasal corticosteroids as temporizing measure in mild OSA. CPAP if adenotonsillectomy is contraindicated or for residual OSA.\n\nPediatric OSA affects 1-5% of preschool children. Diagnosis: polysomnography is gold standard but not required. Adenotonsillectomy improves behavior, QOL, and polysomnographic findings but does not improve executive function/attention."
    difficulty: easy
    tags: [pediatrics, sleep, OSA]
  - front: "What is Hirschsprung's disease and how is it diagnosed?"
    back: "Congenital absence of ganglion cells in the distal colon causing functional obstruction. Presents with bilious emesis, abdominal distension, and failure to pass stool in neonates. Diagnosed by abdominal x-ray, contrast enema, and rectal biopsy (gold standard).\n\nHirschsprung's is an important organic cause of constipation in neonates. Most healthy newborns pass meconium within 24-48 hours. Failure to pass meconium should raise suspicion. Treatment is surgical resection of the aganglionic segment."
    difficulty: easy
    tags: [pediatrics, GI, Hirschsprung]
  - front: "What is the most common cause of acute renal failure in children?"
    back: "Hemolytic uremic syndrome (HUS).\n\nSTEC-HUS from E. coli O157:H7 accounts for 90% of pediatric HUS. The pathophysiology involves Shiga toxin damaging endothelial cells, especially in the kidney, causing platelet-fibrin thrombi and microangiopathic hemolytic anemia. Mortality is <5% but 30% develop long-term renal damage."
    difficulty: easy
    tags: [pediatrics, nephrology, HUS]
  - front: "What is the normal heart rate range for a neonate (<28 days) while awake?"
    back: "100-205 beats per minute (awake); 90-160 bpm asleep.\n\nNeonatal heart rates are significantly higher than adult ranges due to their higher metabolic rate and predominantly sympathetic tone. Bradycardia in neonates (HR <100 bpm) is concerning and requires evaluation. Normal respiratory rate for neonates is 30-53 breaths/min."
    difficulty: easy
    tags: [pediatrics, vital signs, neonates, normal values]
  - front: "What is the definition of fever by rectal temperature measurement in pediatric patients?"
    back: "Rectal temperature ≥38°C (normal range 36.6-38°C).\n\nRectal temperature is the most accurate measurement method. Different measurement routes have different fever thresholds: rectal ≥38°C, ear ≥38°C, oral ≥37.5°C, axillary ≥37.5°C. In infants <3 months, fever ≥38°C by any route warrants urgent evaluation for serious bacterial infection."
    difficulty: easy
    tags: [pediatrics, fever, vital signs, neonates]
  - front: "What is the recommended temperature measurement technique for children under 2 years of age?"
    back: "Rectal temperature (definitive); axillary (screening).\n\nRectal temperature is the gold standard for accuracy in infants and young children. Tympanic and temporal artery measurements are acceptable screening tools in hospital settings for children aged 2-5 years. For children over 5 years, oral temperature is the definitive method."
    difficulty: easy
    tags: [pediatrics, temperature measurement, fever, clinical skills]
  - front: "What does the Canadian Pediatric Society (CPS) recommend for the schedule of well-child visits?"
    back: "Newborn (48-72h post-discharge), 2, 4, 6, 9, 12, 18 months; annually ages 2-5; every 1-2 years ages 6-18.\n\nWell-child visits allow monitoring of growth, development, immunizations, nutrition, and anticipatory guidance. The Rourke Baby Record (birth to age 5) and Greig Health Record (ages 6-17) are recommended evidence-based clinical tools used in Canadian primary care."
    difficulty: easy
    tags: [pediatrics, primary care, well-child visit, CPS guidelines]
  - front: "What is the BINDS mnemonic for pediatric history taking?"
    back: "B - Birth history; I - Immunizations; N - Nutritional history; D - Developmental history; S - Social history.\n\nBINDS is a structured approach to pediatric history unique to children. Each domain captures age-specific information crucial for comprehensive assessment: birth complications, vaccine status, feeding patterns, developmental milestones, and family/social environment."
    difficulty: easy
    tags: [pediatrics, history taking, clinical skills, BINDS]
  - front: "What is the HEEADSSS assessment and when is it used in pediatric practice?"
    back: "HEEADSSS (Home, Education/Employment, Eating, Activities, Drugs, Sexuality, Suicide/depression, Safety/violence) is used for psychosocial screening in adolescents during well-child visits.\n\nHEEADSSS provides a structured framework for confidential adolescent health interviews covering major risk domains. SSHADESS is an alternative framing that starts with Strengths. It is used to identify mental health concerns, substance use, and safety issues that adolescents may not volunteer spontaneously."
    difficulty: easy
    tags: [pediatrics, adolescent medicine, HEEADSSS, mental health screening]
  - front: "What additional vaccines are required for children with asplenia or hyposplenia (e.g., sickle cell disease)?"
    back: "All routine immunizations PLUS: quadrivalent meningococcal conjugate (Men-C-ACYW), meningococcal B vaccine (8 weeks apart, booster every 5 years), pneumococcal polysaccharide (Pneu-P-23), pneumococcal conjugate vaccine (Pneu-C-13), and consider single Hib booster >5 years.\n\nAsplenic patients are at high risk for overwhelming post-splenectomy infection (OPSI) from encapsulated organisms (S. pneumoniae, H. influenzae, N. meningitidis, E. coli, Klebsiella, Salmonella, Group B Strep). Enhanced vaccination is critical for prevention. No vaccines are contraindicated in asplenia, though live vaccines should be used with caution in immunocompromised states."
    difficulty: hard
    tags: [pediatrics, immunization, asplenia, sickle cell disease, vaccines]
  - front: "What are the true contraindications to childhood vaccination?"
    back: "Moderate/severe illness with fever, and allergy to a vaccine component. (Mild illness is NOT a contraindication to vaccination.)\n\nCommon misconceptions about vaccine contraindications lead to missed vaccination opportunities. Mild illness without significant fever is NOT a contraindication. True contraindications are few: severe illness with fever and known allergy to vaccine components (e.g., egg allergy for influenza vaccines). Previous anaphylaxis to a vaccine dose is an absolute contraindication to subsequent doses."
    difficulty: easy
    tags: [pediatrics, immunization, contraindications, vaccines]
  - front: "What maternal screening tests are included in the standard pediatric obstetrical history review?"
    back: "Blood group, antibody screen, Rh status, DAT, HBsAg, rubella, syphilis, HIV, GBS (Group B Streptococcus).\n\nThese maternal screening tests directly affect neonatal risk assessment and management. GBS status determines intrapartum antibiotic prophylaxis; HBsAg determines need for neonatal hepatitis B immunoglobulin; Rh status determines need for anti-D. Each result has direct implications for the newborn's health."
    difficulty: medium
    tags: [pediatrics, neonatology, maternal screening, obstetrical history]
  - front: "What is the normal systolic blood pressure range for a school-age child (6-9 years)?"
    back: "97-115 mmHg.\n\nPediatric blood pressure norms are age-dependent and significantly lower than adult values. Hypertension in children is defined as SBP/DBP above the 95th percentile for age, sex, and height on three separate occasions. Knowledge of age-appropriate norms is essential for identifying hypertension in pediatric patients."
    difficulty: easy
    tags: [pediatrics, vital signs, blood pressure, normal values]
  - front: "What are the distinguishing clinical features of bacterial gastroenteritis compared to viral gastroenteritis in children?"
    back: "Bacterial gastroenteritis: severe abdominal pain, high fever, bloody diarrhea. Viral gastroenteritis: slight fever, malaise, vomiting, vague abdominal pain, resolves in 3-7 days, often associated with URTIs.\n\nCommon bacterial causes include Salmonella, Campylobacter, Shigella, pathogenic E. coli, Yersinia, and C. difficile. Viral causes (rotavirus, norovirus, adenovirus) are more common overall. Distinguishing features guide antibiotic use decisions."
    difficulty: easy
    tags: [gastroenteritis, pediatric GI, infectious diarrhea, bacterial vs viral]
  - front: "What investigations help differentiate bacterial from viral gastroenteritis in children?"
    back: "Bacterial: elevated band count on CBC, positive stool cultures, presence of C. difficile toxins. Parasitic: elevated eosinophil count on CBC, stool examination for ova and parasites.\n\nViral gastroenteritis is typically a clinical diagnosis not requiring lab confirmation. Bacterial investigations are warranted when there is bloody diarrhea, high fever, systemic symptoms, or exposure history (travel, poorly cooked meat)."
    difficulty: easy
    tags: [gastroenteritis, investigations, stool cultures, CBC]
  - front: "What is the management of pediatric gastroenteritis with significant vomiting?"
    back: "Ondansetron is indicated for suspected gastroenteritis with mild to moderate dehydration or failed oral rehydration therapy (ORT) with significant vomiting. Antidiarrheal medications are NOT indicated.\n\nPrevention and treatment of dehydration is the most important management goal. Early refeeding with age-appropriate diet after rehydration is advisable. Zinc supplementation is recommended. Antibiotic/antiparasitic therapy only when indicated."
    difficulty: easy
    tags: [gastroenteritis, ondansetron, ORT, pediatric management]
  - front: "What is toddler's diarrhea and how is it managed?"
    back: "Toddler's diarrhea is the most common cause of chronic diarrhea during infancy (onset 6-36 months, resolves 2-4 years). Diagnosis of exclusion in a thriving child with 4-6 BM/day. Management: the 4 F's — adequate Fibre, normal Fluid intake, lower dietary Fat (35-40%), discourage excess Fruit juice.\n\nExcess juice intake overwhelms small bowel resulting in disaccharide malabsorption. Stools may contain undigested food particles. No routine investigations needed if child is growing appropriately. Condition is self-limiting."
    difficulty: medium
    tags: [toddlers diarrhea, chronic diarrhea, pediatric nutrition, 4Fs]
  - front: "How is lactose intolerance diagnosed in children, and what are the two main types?"
    back: "Primary lactose intolerance: crampy abdominal pain with loose stool in older children (more common in East Asian and African descent). Secondary lactose intolerance: persistent diarrhea in older infants following viral/bacterial infection, celiac disease, or IBD. Diagnosis: trial of lactose-free diet; positive breath hydrogen test if >6 years after oral lactose load.\n\nInvestigations are usually not needed for diagnosis. Demonstration of lactose malabsorption should be combined with assessment of intolerance symptoms. Management includes lactose-free diet and lactase-containing supplements (Lacteeze, Lactaid)."
    difficulty: medium
    tags: [lactose intolerance, pediatric GI, breath hydrogen test, malabsorption]
  - front: "What is the association between celiac disease and IgA deficiency, and what test must be ordered?"
    back: "Celiac disease is associated with an increased prevalence of IgA deficiency. Since tTG (tissue transglutaminase) is an IgA-detecting test, an accompanying IgA level MUST be ordered to avoid false negatives.\n\nIf IgA-deficient, tTG-IgA will be falsely negative despite celiac disease. In this case, IgG-based antibodies (tTG-IgG, DGP-IgG) should be used. Celiac disease diet must avoid gluten present in BROW foods: Barley, Rye, Oats (controversial), Wheat."
    difficulty: medium
    tags: [celiac disease, IgA deficiency, tTG, gluten, BROW]
  - front: "What are the BROW foods to avoid in celiac disease?"
    back: "B - Barley, R - Rye, O - Oats (controversial), W - Wheat. These foods contain gluten which triggers the immune response in celiac disease.\n\nCeliac disease is an immune-mediated enteropathy triggered by gluten. In children it presents at any age, often 6-24 months with introduction of gluten in the diet. Non-GI manifestations include iron-deficiency anemia, dermatitis herpetiformis, osteopenia, short stature, and delayed puberty."
    difficulty: easy
    tags: [celiac disease, gluten, BROW, dietary restriction]
  - front: "What is the difference between IgE-mediated and non-IgE-mediated cow's milk allergy (CMA) in children?"
    back: "IgE-mediated CMA: occurs within hours of exposure; skin (urticaria, pruritus), respiratory (wheeze, cough), and GI (pain, N/V, diarrhea) symptoms. Non-IgE-mediated CMA: occurs hours after ingestion; includes FPIAP (mild diarrhea, bloody stools), FPIES (severe vomiting/diarrhea, anemia, hematochezia), food protein-induced enteropathy (FTT, chronic diarrhea, hypoalbuminemia).\n\nUp to 50% of children intolerant to cow's milk may also be intolerant to soy protein. Food challenge is the gold standard for diagnosis. Non-IgE-mediated CMA: stop exposure, reintroduce milk at 6-8 months; >90% will outgrow by 1 year."
    difficulty: medium
    tags: [cows milk allergy, CMA, FPIES, FPIAP, food allergy]
  - front: "What are the Rome IV criteria for functional constipation in children >4 years?"
    back: "≥2 of the following, present at least once per week for ≥1 month: <2 defecations/week, ≥1 episode/week of fecal incontinence, history of retentive posturing or excessive volitional stool retention, history of painful or hard bowel movements, evidence of large fecal mass in rectum, history of large-diameter stools that may obstruct the toilet. Symptoms not fully explained by another medical condition.\n\nFunctional constipation accounts for 99% of constipation cases in children. Common precipitants include lack of fibre, poor fluid intake, toilet training, starting school, or pain on defecation. Treatment is maintained for at least 3-6 months."
    difficulty: medium
    tags: [constipation, Rome IV criteria, functional constipation, pediatric GI]
  - front: "What is the management of functional constipation in children?"
    back: "1. Education for parents/older children. 2. Clean out (if encopresis): PEG 3350 (1-1.5 g/kg/d). 3. Maintenance: adequate fluid intake, dietary fibre, medications (PEG 3350, Senna), appropriate toilet training (dedicated 3-10 min, 1-2x/day). Treat for at least 3-6 months.\n\nPEGlyte is used for inpatient clean out. Children should not be weaned from maintenance therapy until having regular BMs without difficulty. Complications include anal fissures, chronic dilatation, and overflow incontinence (pain-retention cycle)."
    difficulty: easy
    tags: [constipation, PEG 3350, encopresis, laxatives, pediatric management]
  - front: "What are organic causes of constipation in children?"
    back: "Endocrine/metabolic: hypothyroidism, DM, hypercalcemia, CF, lead poisoning, hypokalemia. Neurologic: spinal cord abnormalities/trauma, NF, Hirschsprung disease, cerebral palsy. Anatomic: bowel obstruction, anorectal anomalies. Drugs: lead, chemotherapy, opioids. Other: celiac disease, generalized joint hypermobility.\n\nThese organic causes must be considered when constipation does not respond to standard treatment. Hirschsprung disease presents with failure to pass meconium within 24-48 hours of birth, bilious vomiting, and abdominal distension."
    difficulty: medium
    tags: [constipation, organic causes, Hirschsprung, hypothyroidism, pediatric]
  - front: "What is the 'classic triad' of intussusception, and how common is it?"
    back: "Classic triad: abdominal pain, vomiting, and red currant jelly stools. Present in <15% of patients. More common presentation: sudden onset of recurrent, paroxysmal, severe periumbilical pain with inconsolable crying, legs raised toward abdomen, with pain-free intervals.\n\nIntussusception is the telescoping of a bowel segment into a distal segment. 90% are idiopathic. Affects 80-90% before age 2, M:F = 3:2. Lethargy may be the only presenting symptom. Usually diagnosed on ultrasound."
    difficulty: medium
    tags: [intussusception, classic triad, currant jelly stools, pediatric surgery]
  - front: "What is the treatment for ileocolic intussusception?"
    back: "Air or saline/contrast enema can be therapeutic (reduces intussusception in 75% of cases), reduction under hydrostatic pressure. Surgery is rarely needed. Recurrence rate is 10-15%; consider pathologic lead point. Ileoileal intussusception is often not significant and usually does not require treatment.\n\nLead points of telescoping segment include swollen Peyer's patches, Meckel's diverticulum, polyp, malignancy, HSP-related bowel wall edema. Children with CF or GJ tubes are at significantly increased risk."
    difficulty: medium
    tags: [intussusception, enema, treatment, lead point, pediatric surgery]
  - front: "What are the red flags for an organic etiology of chronic abdominal pain in children?"
    back: "Age <5, fever, pain that localizes away from midline, anemia, evidence of GI blood loss, significant vomiting, chronic severe diarrhea, pain that wakes child at night, travel history, prominent vomiting/diarrhea, weight loss or failure to gain weight, deceleration in linear growth, joint pain, family history of IBD, abnormal physical exam findings.\n\nOrganic causes account for <10% of chronic abdominal pain. The remaining 90% is functional. Functional abdominal pain seldom awakens child from sleep and is less common on weekends — useful distinguishing feature from organic disease."
    difficulty: medium
    tags: [chronic abdominal pain, red flags, organic vs functional, pediatric GI]
  - front: "What are the functional abdominal pain subtypes in children?"
    back: "1. Functional dyspepsia: pain in upper abdomen. 2. Irritable bowel syndrome: alternating bowel movements. 3. Abdominal migraine: paroxysmal abdominal pain with anorexia, nausea, vomiting, pallor. 4. Functional abdominal pain syndrome.\n\nFunctional abdominal pain affects 10% of school children (peak 8-10 years, F>M). Rule of 3s: 3 episodes of severe pain, over a 3-month period. Psychological factors and psychiatric comorbidity (anxiety, somatoform, mood disorders) are common."
    difficulty: medium
    tags: [functional abdominal pain, abdominal migraine, IBS, functional dyspepsia, pediatric]
  - front: "What are the most common malignant and non-malignant renal abdominal masses in children?"
    back: "Non-malignant renal: hydronephrosis, polycystic kidney disease, hamartoma. Malignant renal: nephroblastoma (Wilms' tumour), renal cell carcinoma. Note: 50% of abdominal masses in newborns are renal in origin.\n\nWilms' tumour: asymptomatic abdominal swelling, abdominal pain (30-40%), hematuria (12-25%), fever, hypertension (25%). Treatment: surgery, chemotherapy, radiation. Renal cell carcinoma classic triad: flank pain, hematuria, palpable renal mass."
    difficulty: medium
    tags: [abdominal mass, Wilms tumor, nephroblastoma, pediatric oncology]
  - front: "What are the most common causes of lower GI bleeding in children by acuity?"
    back: "Acute causes: infectious (bacterial, parasitic), antibiotic-induced C. difficile, NEC in preterm infants, malrotation/volvulus, intussusception, Hirschsprung disease, Meckel's diverticulitis, anal fissures, HSP, HUS, coagulopathy. Chronic causes: anal fissures (most common), infectious colitis, IBD, FPIAP, allergic (milk protein), polyps (mostly hamartomas).\n\nLower GI bleed may present as melena (if it involves the small bowel) or hematochezia. Meckel's radionuclide scan is a key investigation. Acute stabilization: ABCs, volume and blood replacement, bowel rest (NPO, NG tube)."
    difficulty: medium
    tags: [lower GI bleeding, hematochezia, melena, anal fissures, pediatric GI]
  - front: "What are normal hemoglobin values by age in children?"
    back: "Newborn: 137-201 g/L. 2 months: (lower limit). 6 months-5 years: 105-140 g/L. 7-29 years: 110-160 g/L. Adult female: 120-160 g/L. Adult male: 140-180 g/L.\n\nGeneral rule for lower normal limit of MCV = 70 + age (years) until 80 fL (adult standard). Understanding age-specific norms is essential to avoid over- or under-diagnosis of anemia in children."
    difficulty: easy
    tags: [hemoglobin, normal values, pediatric hematology, anemia]
  - front: "What is physiologic anemia of infancy and when does it nadir?"
    back: "High Hb and reticulocyte count at birth (relatively hypoxic intrauterine environment). After birth, levels fall due to shorter fetal RBC lifespan, decreased RBC production (virtually no erythropoiesis in first 6-8 weeks), and increasing blood volume with growth. Nadir: Hb ~100 g/L at 8-12 weeks (earlier and more exaggerated in premature infants).\n\nUsually no treatment required. Red flags for non-physiologic anemia: Hb lower than expected, signs of hemolysis, or symptoms of anemia. A 'normal' reticulocyte count in the context of anemia indicates inadequate bone marrow response."
    difficulty: easy
    tags: [physiologic anemia, anemia of infancy, reticulocyte, neonatal hematology]
  - front: "What is iron deficiency anemia in pediatrics and who is most at risk?"
    back: "Most common cause of childhood anemia. Full-term infants exhaust iron reserves by 6 months; premature infants by 2-3 months. Most common between 6 months-3 years and 11-17 years. At-risk groups: premature, maternal iron deficiency, low birth weight, low SES, food insecurity, selective eating (e.g., autism), cow's milk in the first year, >500 mL/day of non-iron fortified milk (age 1-5 years).\n\nIron deficiency is rare in children <6 months in the absence of blood loss or low birth weight. Cow's milk is a significant risk factor in the first year. Communities facing poverty and diminished access to traditional foods are also at risk."
    difficulty: easy
    tags: [iron deficiency anemia, pediatric anemia, risk factors, cows milk]
  - front: "What is the Mentzer index and how is it used to distinguish iron deficiency anemia from thalassemia?"
    back: "Mentzer index = MCV/RBC count. Ratio <13 suggests thalassemia. Ratio >13 suggests iron deficiency anemia.\n\nBoth iron deficiency anemia and thalassemia cause microcytic anemia. In thalassemia, the RBC count tends to be normal or elevated despite low MCV. Ferritin should always be ordered with CRP since ferritin is an acute phase reactant and may be falsely normal in the presence of infection/inflammation."
    difficulty: medium
    tags: [Mentzer index, iron deficiency anemia, thalassemia, microcytic anemia, MCV]
  - front: "Why must ferritin always be ordered with CRP when investigating iron deficiency anemia?"
    back: "Ferritin is an acute phase reactant. Therefore, normal or high ferritin does NOT rule out iron deficiency anemia if there is concurrent inflammation (e.g., infection). A CRP must be ordered alongside ferritin to determine if the ferritin is falsely elevated.\n\nTrue iron deficiency presents with low ferritin, low serum iron, high TIBC, high transferrin, and low transferrin saturation. Blood smear shows hypochromic, microcytic RBCs, pencil-shaped cells, and poikilocytosis."
    difficulty: medium
    tags: [ferritin, CRP, acute phase reactant, iron deficiency anemia, investigations]
  - front: "What is the treatment for iron deficiency anemia in children?"
    back: "Oral iron therapy: 4-6 mg/kg/day elemental iron, divided BID to TID, for 3-6 months. Response markers: increased reticulocyte count in 2-3 days (peaks day 5-7), increased hemoglobin by 30 days, repletion of iron stores in 1-3 months. Repeat Hb levels after 1 month of treatment. Limit homogenized milk to 500 mL/day.\n\nPoor response to oral iron therapy suggests: non-adherence, medication intolerance, ongoing blood loss, IBD, celiac disease, or incorrect diagnosis. Emerging evidence for IV iron sucrose use especially when adherence is a concern. Untreated IDA can cause irreversible behavioural and intellectual deficiencies."
    difficulty: easy
    tags: [iron deficiency anemia, treatment, oral iron, pediatric hematology]
  - front: "What are the iron supplementation recommendations for breastfed and low birth weight infants?"
    back: "Breastfed term infants: at 6 months ensure >2 iron-rich feeds/day; if unable, consider iron supplementation. Non-breastfed term infants (<50% diet): iron-fortified formula from birth. Low birth weight (2.0-2.5 kg): 1-2 mg/kg/day for first 6 months. BW <2.0 kg: 2-3 mg/kg/day for first 12 months.\n\nNo cow's milk until 12 months. Total daily iron should be 1 mg (ages 6-12 months) and 7 mg (ages 1-3 years). Screen Hb levels in infants not receiving iron-fortified formula at 9-12 months, and earlier if risk factors present."
    difficulty: medium
    tags: [iron supplementation, premature infant, breastfeeding, pediatric nutrition]
  - front: "What is Vitamin K Deficiency Bleeding (VKDB) in neonates — when does it present and how is it prevented?"
    back: "VKDB (formerly hemorrhagic disease of the newborn) has three presentations: early-onset (first 24 hours), classic (2-7 days), and late-onset (2-12 weeks up to 7 months — highest risk of intracranial hemorrhage). Prevention: Vitamin K IM injection (0.5-1 mg) at birth. Can also be given orally (at first feed, 1, 4, 8 weeks) for breastfed term infants but carries higher risk of VKDB.\n\nMost commonly occurs in infants <6 months due to hepatic immaturity, inefficient vitamin K use, poor vitamin K stores, and low vitamin K content in milk. Coagulation profile shows elevated PT and PTT with normal platelet count."
    difficulty: medium
    tags: [VKDB, vitamin K deficiency, hemorrhagic disease of newborn, neonatal bleeding]
  - front: "How is acute VKDB (Vitamin K Deficiency Bleeding) managed?"
    back: "Managed urgently with IV/SC vitamin K (1-2 mg). If severe bleeding, also administer fresh frozen plasma (FFP) or prothrombin complex concentrate (PCC).\n\nVitamin K-dependent clotting factors are II, VII, IX, X (and proteins C and S). VKDB causes PT and PTT prolongation. Risk factors for non-classic VKDB include maternal medications (antiepileptics, certain antibiotics, warfarin), chronic malabsorption (CF, celiac, IBD, biliary atresia), liver failure."
    difficulty: easy
    tags: [VKDB, vitamin K, FFP, prothrombin complex, neonatal management]
  - front: "What is Immune Thrombocytopenic Purpura (ITP) in children — definition, epidemiology, and clinical features?"
    back: "ITP: isolated thrombocytopenia (platelets <100,000/μL with normal WBC and Hb). Most common cause of symptomatic thrombocytopenia in childhood. Peak age: 2-5 years, M slightly > F. 60% present within 1 month after viral illness. Sudden onset petechiae, purpura, bleeding in an otherwise well child. No lymphadenopathy or hepatosplenomegaly.\n\nCaused by autoantibodies binding platelet membranes → Fc-receptor mediated splenic destruction. Clinically significant bleed in only 3%; <0.5% risk of intracranial hemorrhage. Diagnosis of exclusion — made in well-appearing patients with mucocutaneous bleeding and normal WBC/Hb."
    difficulty: easy
    tags: [ITP, thrombocytopenia, petechiae, purpura, pediatric hematology]
  - front: "What is the management of ITP in children based on bleeding severity?"
    back: "No/mild bleeding (bruising/petechiae only): watchful waiting regardless of platelet level. Moderate bleeding (severe skin manifestations, mucosal lesions, troublesome epistaxis/menorrhagia): IVIg (1 g/kg) or steroids; anti-D if Rh-positive and DAT-negative. Severe bleeding (prolonged epistaxis, GI bleeding, ICH): IV steroids + IVIg; tranexamic acid as adjunct. Life-threatening bleed: platelet transfusion + emergency splenectomy.\n\nIVIg provides faster increase in platelet count vs. steroids. Bone marrow aspirate only if red flags present. Anti-D is not indicated in low Hb from blood loss or autoimmune hemolysis. Avoid contact sports and ASA/NSAIDs. Persistent ITP: >3-12 months; chronic ITP: >12 months."
    difficulty: hard
    tags: [ITP, IVIg, steroids, platelet transfusion, pediatric hematology]
  - front: "What are the distinguishing lab findings in hemophilia A, hemophilia B, von Willebrand disease, and ITP?"
    back: "Hemophilia A: prolonged PTT, decreased Factor VIII:C. Hemophilia B: prolonged PTT, all others normal. Von Willebrand Disease: prolonged PFA, normal/prolonged PTT, decreased VWF and Factor VIII:C. ITP: prolonged PFA, decreased platelets. DIC: prolonged everything, decreased fibrinogen. Vitamin K deficiency: prolonged PT and PTT.\n\nPFA (platelet function assay) is prolonged in platelet disorders and vWD. PT reflects extrinsic pathway; PTT reflects intrinsic pathway. Extensive bruising in absence of lab abnormalities should raise suspicion for child maltreatment."
    difficulty: hard
    tags: [bleeding disorders, hemophilia, von Willebrand, coagulation labs, PTT, PT]
  - front: "What are the most common pediatric malignancies and at what age groups do they peak?"
    back: "Leukemia: most common overall (30%), infancy/childhood. Brain tumours: 25%, infancy/childhood. Lymphomas: 15%, adolescence. Age-specific peaks: Newborns — neuroblastoma, Wilms' tumour, retinoblastoma. Infancy/childhood — leukemia, neuroblastoma, CNS tumours, Wilms' tumour, retinoblastoma. Adolescence — lymphoma, leukemia, gonadal/germ cell tumours, thyroid cancers, melanoma, bone tumours.\n\nCancer is the second most common cause of death after injuries in children >1 year. Overall cure rates >80% with modern treatment. Unique pediatric considerations: radiation, chemotherapy, and surgery can impact growth, development, endocrine function, and fertility."
    difficulty: easy
    tags: [pediatric oncology, leukemia, brain tumors, lymphoma, neuroblastoma]
  - front: "What clinical features distinguish malignant from benign lymphadenopathy in children?"
    back: "Malignant features: firm, discrete, non-tender, enlarging, immobile, worrisome location (supraclavicular or generalized), abnormal imaging/bloodwork, constitutional symptoms (fever, weight loss, night sweats). Benign (infectious) features: fluctuance, warmth, tenderness.\n\nKey investigation: early biopsy if supraclavicular nodes, nodes >4 cm, or groups of nodes with total diameter >3 cm. Late biopsy (within 4 weeks) if increasing in size, or >2 cm with unclear diagnosis or no response to treatment. Supraclavicular lymphadenopathy requires CXR to rule out mediastinal mass."
    difficulty: medium
    tags: [lymphadenopathy, lymphoma, supraclavicular, pediatric oncology, malignant vs benign]
  - front: "What are the indications for biopsy in pediatric lymphadenopathy?"
    back: "Early biopsy: supraclavicular nodes, nodes >4 cm, or groups of nodes with total diameter >3 cm. Late biopsy (within 4 weeks): node increasing in size, node >2 cm with unclear diagnosis, or no response to treatment. Regional lymphadenopathy: biopsy if persistent >4 weeks and/or constitutional symptoms present.\n\nSupraclavicular lymphadenopathy requires CXR to rule out mediastinal mass — often associated with lymphoma. Generalized lymphadenopathy (≥4 body areas) requires CBC, differential, blood culture, inflammatory markers (ESR, CRP), serology, uric acid, LDH, and CXR."
    difficulty: medium
    tags: [lymphadenopathy, biopsy indications, supraclavicular, pediatric oncology]
  - front: "What is the most common cause of acute abdomen in children after age 5?"
    back: "Appendicitis is the most common cause of acute abdomen after age 5. Clinical features: low-grade fever, abdominal pain, anorexia, N/V (after onset of pain), peritoneal signs (generalized peritonitis is a common presentation in infants/young children). Treatment is surgical. Complications include perforation (common in young children) and abscess.\n\nYoung children are at higher risk of perforation because they have difficulty localizing and describing pain, leading to delayed diagnosis. Generalized peritonitis at presentation is therefore more common in infants/young children compared to older children or adults."
    difficulty: easy
    tags: [appendicitis, acute abdomen, peritonitis, pediatric surgery]
  - front: "What risk factors predispose children to cancer and what are the most common predisposing syndromes?"
    back: "Chromosomal syndromes (e.g., Trisomy 21/Down syndrome), cancer predisposition syndromes (e.g., Li-Fraumeni syndrome), prior malignancies, neurocutaneous syndromes, immunodeficiency syndromes, family history, exposure to radiation/chemicals/biologic agents.\n\nThe cause of pediatric cancer is rarely known. Overall survival and cure rates have improved remarkably to >80% for many pediatric cancers. Unique treatment considerations exist because therapies can impact growth, development, endocrine function, and fertility."
    difficulty: easy
    tags: [pediatric oncology, cancer risk factors, Li-Fraumeni, Down syndrome, cancer predisposition]
  - front: "What is the approach to anemia classification based on reticulocyte count and RBC indices?"
    back: "Step 1: Decreased reticulocytes = production problem → classify by MCV: Microcytic (IDA, thalassemia, lead poisoning, sideroblastic anemia, anemia of chronic disease), Normocytic (anemia of chronic disease, aplastic anemia, recent blood loss), Macrocytic (megaloblastic — B12/folate deficiency, hypothyroidism, alcohol). Step 2: Increased reticulocytes = hemolysis or blood loss → classify by DAT: DAT+ = immune hemolysis; DAT- = intrinsic (hereditary spherocytosis, SCD, thalassemia, G6PD) or extrinsic non-immune (TTP, HUS).\n\nA 'normal' reticulocyte count in the context of anemia is indicative of an inadequate bone marrow response. True hemolysis produces an elevated absolute reticulocyte count as the marrow compensates. This framework helps identify the underlying mechanism before specific testing."
    difficulty: hard
    tags: [anemia, reticulocyte count, MCV, DAT, classification, pediatric hematology]
  - front: "What are the major Jones Criteria for diagnosing Acute Rheumatic Fever?"
    back: "Carditis and valvulitis, arthritis, CNS involvement (Sydenham chorea), subcutaneous nodules, and erythema marginatum.\n\nThe revised Jones Criteria require 2 major OR 1 major + 2 minor criteria PLUS evidence of preceding GAS infection (history of scarlet fever, positive culture/rapid Ag test, or elevated ASOTs). Recognizing these criteria is essential for diagnosing ARF in Canadian practice."
    difficulty: easy
    tags: [rheumatic fever, Jones criteria, pediatrics, GAS, carditis]
  - front: "What are the minor Jones Criteria for diagnosing Acute Rheumatic Fever?"
    back: "Arthralgia, fever, elevated ESR or CRP, and prolonged PR interval on ECG.\n\nMinor criteria alone are insufficient; they supplement major criteria in diagnosis. Prolonged PR interval reflects subclinical carditis. Elevated acute phase reactants confirm systemic inflammation from GAS-triggered autoimmune response."
    difficulty: easy
    tags: [rheumatic fever, Jones criteria, pediatrics, ECG]
  - front: "What evidence of preceding GAS infection is required to diagnose Acute Rheumatic Fever using Jones Criteria?"
    back: "History of scarlet fever, positive GAS pharyngitis culture, positive rapid antigen detection test, or elevated ASOTs (anti-streptolysin O titres).\n\nARF is an autoimmune sequela of GAS infection; demonstrating prior GAS exposure is mandatory for diagnosis. Without microbiological or serological evidence of GAS, the diagnosis cannot be made even if major/minor criteria are present."
    difficulty: medium
    tags: [rheumatic fever, GAS, ASOT, pediatrics, diagnosis]
  - front: "What is the treatment for acute Rheumatic Fever, including management of severe carditis?"
    back: "Penicillin or erythromycin for 10 days (acute GAS eradication); prednisone if severe carditis. Secondary prophylaxis with daily penicillin or erythromycin.\n\nAntibiotics eliminate the inciting GAS organism. Corticosteroids are reserved for severe carditis to reduce inflammation. Long-term secondary prophylaxis prevents recurrent GAS infections, which can cause cumulative valvular damage and rheumatic heart disease."
    difficulty: medium
    tags: [rheumatic fever, treatment, penicillin, prednisone, secondary prophylaxis]
  - front: "What are the chronic complications of Rheumatic Fever and when do they typically manifest?"
    back: "Valvular heart disease (mitral and/or aortic insufficiency/stenosis), infectious endocarditis, thromboembolic phenomena. Onset is usually 10–20 years after acute carditis.\n\nRepeated or severe acute rheumatic carditis leads to scarring and fibrosis of heart valves, most commonly the mitral valve (mitral stenosis is a classic late sequela). This latency period underscores the importance of secondary prophylaxis to prevent further valve damage."
    difficulty: medium
    tags: [rheumatic fever, valvular disease, mitral stenosis, complications, pediatrics]
  - front: "What is Post-Streptococcal Glomerulonephritis (PSGN) and what triggers it?"
    back: "PSGN is an antigen-antibody mediated, complement-activating diffuse proliferative glomerulonephritis occurring 1–3 weeks after GAS infection (skin or throat), most common in children ages 4–8 years.\n\nStreptococcal antigens form immune complexes that deposit in the glomerulus, activating complement and causing inflammatory injury. Unlike ARF, PSGN can follow skin (impetigo) or throat infection and does not require prophylaxis, as most children recover fully."
    difficulty: medium
    tags: [PSGN, glomerulonephritis, GAS, nephritis, pediatrics]
  - front: "How is Post-Streptococcal Glomerulonephritis confirmed on investigations?"
    back: "Elevated serum antibody titres against streptococcal antigens (ASOT, anti-DNAase B) and low serum complement (C3), combined with clinical features of acute nephritis and recent GAS infection.\n\nLow C3 reflects complement consumption by immune complex deposition. ASOT may be normal after skin infections; anti-DNAase B is more sensitive for skin-associated PSGN. These findings differentiate PSGN from other causes of nephritic syndrome."
    difficulty: medium
    tags: [PSGN, C3, ASOT, anti-DNAase B, nephritis, investigations]
  - front: "What is the prognosis and management of Post-Streptococcal Glomerulonephritis in children?"
    back: "95% of children recover completely within 1–2 weeks. Management: fluid/sodium restriction, loop diuretics for hypertension/edema, dialysis if severely impaired. Treat persistent GAS infection with penicillin or erythromycin.\n\nPSGN is generally self-limited in children. Antibiotics do not alter the glomerular course but eradicate ongoing GAS infection. 5–10% have persistent hematuria. Long-term renal sequelae are rare in children, unlike adults."
    difficulty: medium
    tags: [PSGN, management, prognosis, pediatrics, diuretics]
  - front: "What is the peak age for pediatric meningitis and what are the main causative organisms by age group?"
    back: "Peak age <1 year; 90% of cases in children <5 years. 0–28d: GBS, E. coli, Listeria → Ampicillin + cefotaxime. 28–90d: overlap of neonatal + older pathogens → Ceftriaxone + vancomycin (+ ampicillin if immunocompromised). >90d: S. pneumoniae, N. meningitidis, H. influenzae → Ceftriaxone + vancomycin.\n\nNeonates are susceptible to maternal flora (GBS, E. coli, Listeria). Beyond 3 months, encapsulated bacteria predominate. Empiric antibiotic selection must cover likely pathogens for the age group while awaiting culture results."
    difficulty: medium
    tags: [meningitis, pediatrics, pathogens, antibiotics, age-specific]
  - front: "What are the contraindications to lumbar puncture in meningitis, and how should management proceed if LP is contraindicated?"
    back: "Contraindications: thrombocytopenia, DIC, signs of raised ICP, unstable patient, known anatomical lumbar abnormalities. If contraindicated: commence empiric antibiotics immediately — do NOT delay antibiotic therapy for LP.\n\nLP is the gold standard for diagnosing bacterial meningitis, but clinical deterioration from performing LP outweighs diagnostic benefit in high-risk patients. Blood cultures should still be drawn. Empiric coverage should not be delayed as mortality increases with each hour of untreated bacterial meningitis."
    difficulty: medium
    tags: [meningitis, lumbar puncture, contraindications, empiric antibiotics, pediatrics]
  - front: "When is adjuvant dexamethasone indicated in pediatric bacterial meningitis?"
    back: "Dexamethasone should be given BEFORE antibiotics for H. influenzae type b (Hib) meningitis; consider for children >6 weeks with pneumococcal meningitis.\n\nDexamethasone reduces inflammation by suppressing cytokine release, decreasing risk of sensorineural hearing loss and neurological sequelae. Timing before antibiotics is critical as antibiotic-induced bacterial lysis releases inflammatory mediators. Evidence is strongest for Hib meningitis."
    difficulty: medium
    tags: [meningitis, dexamethasone, Hib, pneumococcal, pediatrics]
  - front: "What are the signs of meningismus in children?"
    back: "Nuchal rigidity, Kernig's sign (inability to extend knee with hip flexed), Brudzinski's sign (involuntary knee flexion with neck flexion), and opisthotonos (arching of the back).\n\nThese signs reflect meningeal irritation from inflammation. Nuchal rigidity occurs due to reflex muscle spasm. These signs may be absent in infants, making clinical diagnosis more challenging. In infants, bulging fontanelle and toxic appearance are more reliable indicators."
    difficulty: easy
    tags: [meningitis, meningismus, Kernig, Brudzinski, physical exam]
  - front: "What are the chronic complications of bacterial meningitis in children?"
    back: "Hearing loss (most common), neuromotor/cognitive delay, learning disabilities, neurological deficit, seizure disorder, hydrocephalus.\n\nSensorineural hearing loss is the most common long-term complication of bacterial meningitis, emphasizing the importance of post-meningitis hearing assessment. Inflammatory damage to the cochlea is irreversible. Hydrocephalus results from impaired CSF absorption at the arachnoid villi."
    difficulty: easy
    tags: [meningitis, complications, hearing loss, hydrocephalus, pediatrics]
  - front: "What is the causative agent of mumps, its incubation period, and infectivity window?"
    back: "Mumps virus (RNA Rubulavirus, Paramyxoviridae family). Incubation: 14–16 days (range 12–25 days). Infectivity: 7 days before parotitis to 5 days after parotitis onset.\n\nThe pre-parotitis infectious period is why mumps spreads before symptoms appear. Droplet precautions must be maintained for 5 days after onset of parotid swelling. Two-dose MMR vaccination has dramatically reduced Ontario incidence to ~25 cases/year."
    difficulty: easy
    tags: [mumps, paramyxovirus, incubation, infectivity, pediatrics]
  - front: "What are the complications of mumps?"
    back: "Common: aseptic meningitis, orchitis/oophoritis. Less common: encephalitis, pancreatitis, thyroiditis, myocarditis, arthritis, glomerulonephritis, ocular complications, hearing impairment.\n\nMumps virus spreads hematogenously to secondary sites (salivary glands, gonads, pancreas, meninges, kidneys, heart, thyroid). Orchitis occurs in post-pubertal males and can cause infertility. Aseptic meningitis is the most common CNS complication."
    difficulty: medium
    tags: [mumps, orchitis, aseptic meningitis, complications, pediatrics]
  - front: "How is mumps diagnosed and managed?"
    back: "Clinical diagnosis; confirmed by IgM serology within 4 weeks, PCR, or viral cultures. Management: supportive (analgesics, antipyretics, warm/cold packs). Droplet precautions until 5 days after parotid swelling onset. Admit for serious complications (meningitis, pancreatitis).\n\nMumps is primarily a clinical diagnosis supported by serology. Management is supportive as no antiviral therapy is available. Lab confirmation is important for public health reporting. Vaccination with two-dose MMR is the key prevention strategy."
    difficulty: easy
    tags: [mumps, diagnosis, management, MMR, pediatrics]
  - front: "Describe the three clinical stages of pertussis (whooping cough) and their duration."
    back: "1. Catarrhal stage: 1–7 days; URTI symptoms (coryza, mild cough), no or low-grade fever. 2. Paroxysmal stage: 4–6 weeks; paroxysms of cough ('100-day cough'), inspiratory whoop, post-tussive emesis. 3. Convalescent stage: 1–2 weeks; decreasing cough frequency, non-infectious.\n\nPertussis is most contagious during the catarrhal phase when it resembles a common cold. Infants <6 months often lack the characteristic whoop and may present with post-tussive apnea — a life-threatening presentation requiring hospital admission."
    difficulty: easy
    tags: [pertussis, whooping cough, catarrhal, paroxysmal, convalescent, pediatrics]
  - front: "What is the causative organism of pertussis, the gold standard diagnostic test, and the recommended antibiotic treatment?"
    back: "Causative organism: Bordetella pertussis (Gram-negative pleomorphic rod). Gold standard: culture on Regan-Lowe agar from NP specimen (PCR more commonly used in practice). Treatment: macrolide antibiotics (azithromycin, erythromycin, or clarithromycin).\n\nPCR has largely replaced culture due to higher sensitivity and faster turnaround. Macrolides reduce transmission and severity if given in the catarrhal phase; benefit is less clear in the paroxysmal phase. All household contacts require macrolide prophylaxis regardless of vaccination status."
    difficulty: medium
    tags: [pertussis, Bordetella, Regan-Lowe, PCR, macrolide, treatment]
  - front: "What are the indications for hospital admission in a child with pertussis?"
    back: "Admit if paroxysms of cough are associated with cyanosis and/or apnea; give supplemental oxygen. Also required for young infants <6 months given high mortality risk.\n\nInfants <6 months have the highest pertussis mortality (~0.3% overall, higher in this age group) and are at greatest risk for life-threatening apnea and cyanosis. Pertussis mortality is highest in infants <6 months — the primary reason for universal infant immunization (Pentacel) and adolescent boosters (Adacel)."
    difficulty: medium
    tags: [pertussis, admission criteria, infants, apnea, pediatrics]
  - front: "What is the most common causative organism of pediatric UTI, and what are the most common Gram-negative and Gram-positive organisms?"
    back: "Most common overall: E. coli (~70%). Gram-negative bacilli: E. coli, Klebsiella, Proteus, Enterobacter, Pseudomonas, Citrobacter. Gram-positive cocci: S. saprophyticus, Enterococcus.\n\nE. coli dominates pediatric UTI due to its virulence factors enabling urinary tract colonization. S. saprophyticus is more common in sexually active adolescent females. Knowledge of common organisms guides empiric antibiotic selection based on local susceptibility patterns."
    difficulty: easy
    tags: [UTI, E. coli, pediatrics, microbiology, organisms]
  - front: "What urine specimen is acceptable for culture in pediatric UTI, and what colony counts confirm diagnosis?"
    back: "Acceptable sterile specimens: clean catch, catheterization (≥50,000 CFU/mL), suprapubic aspiration. Bag specimens: only for urinalysis to RULE OUT diagnosis — never send for culture. Diagnosis confirmed: ≥50,000 CFU/mL on catheter specimen OR ≥100,000 CFU/mL on clean catch.\n\nBag specimens have high contamination rates and cannot reliably diagnose UTI. Catheterization is preferred in infants and young children. Suprapubic aspiration is the most sterile method but rarely used. Combining urinalysis findings (leukocyte esterase, nitrites) with culture criteria improves diagnostic accuracy."
    difficulty: medium
    tags: [UTI, urine culture, CFU, catheterization, pediatrics, diagnosis]
  - front: "What imaging is recommended after a first febrile UTI in children, and what are the indications for VCUG?"
    back: "Renal and bladder ultrasound (RBUS) for all febrile infants <2 years and all ages with recurrent febrile UTIs. VCUG: NOT recommended after first febrile UTI unless RBUS shows hydronephrosis, obstructive uropathies, or signs suggestive of high-grade VUR.\n\nRBUS screens for anatomical abnormalities, hydronephrosis, and renal abscesses. VCUG exposes children to radiation and catheterization, so it is reserved for cases where high-grade VUR is suspected. This approach balances diagnostic yield against procedural risk and radiation exposure."
    difficulty: medium
    tags: [UTI, imaging, VCUG, VUR, renal ultrasound, pediatrics]
  - front: "What are the indications for hospital admission in a child with UTI, and what are the empiric antibiotic regimens by age?"
    back: "Admit: <2 months, urosepsis, persistent vomiting, inability to tolerate oral meds, moderate-severe dehydration, immunocompromised, complex urologic pathology, failed outpatient therapy. Neonates: IV ampicillin + aminoglycoside. Infants/children (inpatient): IV ampicillin + gentamicin or ceftriaxone monotherapy. Outpatient: oral antibiotics based on local E. coli sensitivity. Duration: 5–10 days.\n\nNeonates require IV therapy due to septicemia risk and inability to tolerate oral medications. Empiric antibiotic selection should be guided by local antibiograms given increasing E. coli resistance to ampicillin. Treatment is tailored once urine culture and sensitivity results are available."
    difficulty: medium
    tags: [UTI, admission, antibiotics, neonates, pediatrics]
  - front: "What are the classifications of gestational age (GA) at birth?"
    back: "Preterm: <37 weeks (extremely preterm <28 wk, very preterm 28–32 wk, moderate-late preterm 32–37 wk). Term: 37–42 weeks. Post-term: >42 weeks.\n\nClassification by GA guides management and helps predict complications. Extremely preterm infants (<28 weeks) face the highest morbidity and mortality. GA can be estimated post-delivery using Dubowitz/Ballard scoring (physical and neuromuscular maturity criteria), accurate to ±2 weeks."
    difficulty: easy
    tags: [gestational age, preterm, neonatology, definitions, pediatrics]
  - front: "What are the birth weight classifications in neonates?"
    back: "SGA: <10th percentile or >2 SD below mean for GA. AGA: within 2 SD of mean for GA. LGA: >90th percentile or >2 SD above mean for GA. Low birthweight (LBW) <2500 g, Very LBW <1500 g, Extremely LBW (ELBW) <1000 g.\n\nSGA and LGA infants face different but overlapping risks. SGA is associated with perinatal hypoxia, hypoglycemia, polycythemia. LGA (often due to maternal diabetes) is associated with birth trauma, meconium aspiration, hypoglycemia. These classifications guide monitoring and intervention in the newborn period."
    difficulty: easy
    tags: [birth weight, SGA, LGA, AGA, neonatology, ELBW]
  - front: "What are the common causes and problems associated with preterm birth (<37 weeks)?"
    back: "Causes: maternal (HTN, DM, cardiac/renal disease), fetal (multiple pregnancy, congenital abnormalities, RBC isoimmunization), pregnancy issues (placental insufficiency, placenta previa, infection). Problems: RDS, apnea of prematurity, bronchopulmonary dysplasia, NEC, feeding difficulties, hypoglycemia, hypocalcemia, hypothermia, anemia, jaundice, retinopathy of prematurity, ICH/IVH, PDA.\n\nPreterm infants lack sufficient surfactant (RDS), have an immature CNS (apnea), immature gut (NEC), and susceptible retinal vessels (retinopathy of prematurity). PDA is common in preterm due to oxygen-sensitive ductal closure mechanisms. Understanding these complications guides neonatal intensive care management."
    difficulty: medium
    tags: [preterm, RDS, complications, apnea of prematurity, BPD, neonatology]
  - front: "What are the problems associated with Large for Gestational Age (LGA) infants, and what is the most common cause?"
    back: "Most common cause: maternal diabetes. Problems: birth trauma (shoulder dystocia), perinatal depression (meconium aspiration), RDS, transient tachypnea of newborn (TTN), jaundice, polycythemia, hypoglycemia, hypocalcemia.\n\nMaternal hyperglycemia causes fetal hyperinsulinemia, promoting macrosomia. After birth, persistent hyperinsulinism causes hypoglycemia despite no ongoing glucose source. Polycythemia in LGA infants results from hypoxia-driven erythropoiesis. Hypocalcemia in LGA infants of diabetic mothers results from maternal-fetal calcium transfer abnormalities."
    difficulty: medium
    tags: [LGA, macrosomia, maternal diabetes, hypoglycemia, neonatology]
  - front: "What are the components of the Apgar score and when is it assessed?"
    back: "Assessed at 1 and 5 minutes. Five components (APGAR): Appearance (color), Pulse (heart rate), Grimace (irritability/reflex), Activity (muscle tone), Respiration. Each scored 0–2; total 0–10. If <7 at 5 min, reassess every 5 minutes until >7.\n\nThe 1-minute Apgar reflects immediate transition from intrauterine life; the 5-minute score better correlates with neonatal outcome. Resuscitation must NOT be delayed to assign Apgar scores — start resuscitation based on rapid assessment of tone, color, and breathing."
    difficulty: easy
    tags: [Apgar score, neonatal resuscitation, newborn assessment, pediatrics]
  - front: "What are the steps of initial neonatal resuscitation and when is PPV initiated?"
    back: "Warm/dry the newborn (remove wet blankets), stimulate (rub lower back or flick soles), position airway ('sniffing' position), suction if needed, assess breathing and HR. If apneic/ineffective respiration and HR <100: PPV with room air (30% if preterm). If HR <60: effective ventilation + chest compressions + 100% oxygen.\n\nThe 2015 neonatal resuscitation guidelines recommend starting with room air (not 100% O2) as hyperoxia can cause oxidative injury. For preterm infants, 30% O2 is used. Chest compressions are reserved for HR <60 despite effective ventilation, at a 3:1 compression:ventilation ratio."
    difficulty: medium
    tags: [neonatal resuscitation, PPV, Apgar, airway, neonatology]
  - front: "What is the dose and indication for epinephrine in neonatal resuscitation?"
    back: "Indication: HR <60 not rising despite effective ventilation and chest compressions. IV dose: 0.02 mg/kg (0.2 mL/kg of 1:10,000 solution). Endotracheal dose (while awaiting IV): 0.05–0.1 mg/kg (0.5–1 mL/kg of 1:10,000). Can repeat every 3–5 minutes PRN.\n\nIV access (umbilical vein) is the preferred route; endotracheal epinephrine is less reliable and only used as a bridge. Epinephrine increases cardiac contractility and peripheral vasoconstriction to restore cardiac output. Avoid rapid large-volume infusions to prevent IVH in neonates."
    difficulty: hard
    tags: [neonatal resuscitation, epinephrine, bradycardia, dose, neonatology]
  - front: "What is the definition of neonatal apnea, and what are the three types?"
    back: "Apnea: absence of respiratory gas flow for >20 seconds OR less if associated with bradycardia or desaturation. Types: (1) Central — no chest wall movement, no obstruction. (2) Obstructive — chest wall movement against obstructed upper airway, no airflow. (3) Mixed — combination of central and obstructive.\n\nDistinguish from periodic breathing (normal: rapid respirations alternating with 5–10 second pauses). Mixed apnea is most common in preterm infants. Apnea in term infants always requires a full septic workup to exclude infection as the cause."
    difficulty: medium
    tags: [apnea, neonatal, prematurity, central, obstructive, mixed]
  - front: "What is apnea of prematurity and how is it treated?"
    back: "Apnea of prematurity: occurs in infants <34 weeks due to CNS immaturity; resolves by 36 weeks corrected GA. Treatment: caffeine (methylxanthine) — stimulates CNS and diaphragm. Also: tactile stimulation, O2/ventilatory support. Infants require cardiorespiratory monitoring in NICU and an apnea-free period before discharge.\n\nCaffeine is the preferred methylxanthine due to its wider therapeutic index, once-daily dosing, and evidence supporting improved long-term neurodevelopmental outcomes. Term infants with apnea should NOT receive caffeine — a full diagnostic workup is mandatory to identify treatable underlying causes."
    difficulty: medium
    tags: [apnea of prematurity, caffeine, methylxanthine, neonatology, NICU]
  - front: "What is Neonatal Alloimmune Thrombocytopenia (NAIT), and how is it treated?"
    back: "NAIT: maternal IgG antibodies against HPA antigens on fetal platelets (platelet equivalent of Rh disease). Affects 1 in 4000–5000 births. Presentation: petechiae, purpura, thrombocytopenia in an otherwise healthy neonate; can cause ICH. Treatment: platelet transfusion (HPA-specific preferred, random donor acceptable); IVIG to mother prenatally (starts second trimester) + steroids + fetal platelet transfusions; consider IVIG to neonate.\n\nUnlike autoimmune thrombocytopenia, NAIT can occur in the first pregnancy because the fetal platelet antigen (usually HPA-1a) is paternally inherited. ICH is the most serious complication and can cause stillbirth or severe neurological damage. Maternal washed platelets are effective but logistically difficult."
    difficulty: hard
    tags: [NAIT, alloimmune thrombocytopenia, HPA, neonatology, ICH, platelets]
  - front: "How does neonatal autoimmune thrombocytopenia differ from NAIT in pathophysiology, severity, and treatment?"
    back: "Autoimmune thrombocytopenia: caused by maternal ITP or SLE; passive transfer of anti-platelet antibodies across placenta. Usually LESS severe than NAIT and less likely to cause bleeding. Treatment: steroids or IVIG to mother 10–14 days pre-delivery; IVIG to neonate if active bleeding, platelets <20,000 (or <50,000 in sick/premature). Platelet transfusion only in severe cases (antibodies will destroy transfused platelets).\n\nThe key distinction is that autoimmune thrombocytopenia involves antibodies against self-platelet antigens (HPA-positive in both mother and fetus), so the titer tends to be lower and disease milder. NAIT involves antibodies against foreign (paternal) antigens on fetal platelets, often causing more severe thrombocytopenia."
    difficulty: hard
    tags: [autoimmune thrombocytopenia, ITP, SLE, neonatology, IVIG, platelets]
  - front: "What is Bronchopulmonary Dysplasia (BPD) and how is it classified?"
    back: "BPD (neonatal chronic lung disease): O2 dependency persisting to 28 days of life, further classified at 36 weeks corrected GA. Mild: weaned from O2 by 36 weeks. Moderate: requires up to 30% O2 at 36 weeks. Severe: requires >30% O2, CPAP, or mechanical ventilation at 36 weeks. Caused by damage from prolonged ventilation, high O2, and infection.\n\nBPD results from the combined injury of mechanical ventilation, oxidative stress, and inflammation to the immature developing lung. The 36-week classification standardizes severity across different gestational ages. Dexamethasone reduces inflammation but is associated with adverse neurodevelopmental outcomes — significant practice variation exists."
    difficulty: medium
    tags: [BPD, bronchopulmonary dysplasia, neonatology, chronic lung disease, prematurity]
  - front: "What are the long-term outcomes of Bronchopulmonary Dysplasia (BPD)?"
    back: "Pulmonary HTN, poor growth, right-sided heart failure (cor pulmonale). Significant respiratory impairment persisting into adolescence. Airway obstruction, airway hyper-reactivity, and emphysema may persist into adulthood. Increased risk of adverse neurodevelopmental outcomes.\n\nBPD is one of the most significant long-term morbidities of preterm birth. Pulmonary HTN from chronic hypoxemia leads to right heart strain. The neurodevelopmental risk may be partly related to corticosteroid exposure used in BPD management, complicating treatment decisions."
    difficulty: medium
    tags: [BPD, pulmonary hypertension, cor pulmonale, neurodevelopment, neonatology]
  - front: "What newborn screening tests are performed in Ontario?"
    back: "Metabolic disorders (amino acid disorders, organic acid disorders, fatty acid oxidation defects, biotinidase deficiency, galactosemia), blood disorders (sickle cell disease, hemoglobinopathies), endocrine disorders (CAH, congenital hypothyroidism), others (CF, SCID), congenital hearing loss, critical congenital heart disease (CCHD), spinal muscular atrophy (SMA), congenital CMV. Parent screening for biliary atresia.\n\nOntario's newborn screening program detects treatable conditions before symptoms appear. Early identification of congenital hypothyroidism prevents intellectual disability; early identification of SCID allows life-saving HSCT before infections occur. CCHD screening uses pulse oximetry post-ductal."
    difficulty: medium
    tags: [newborn screening, Ontario, CCHD, congenital hypothyroidism, SMA, neonatology]
  - front: "What routine prophylaxis is given to all newborns at birth and why?"
    back: "Vitamin K IM: prophylaxis against Vitamin K Deficiency Bleeding (VKDB). Erythromycin eye ointment: prophylaxis against ophthalmia neonatorum (N. gonorrhoeae) — no longer recommended by CPS but required by law in some provinces.\n\nNewborns have low vitamin K stores and sterile gut (no bacterial vitamin K synthesis), making them susceptible to VKDB including intracranial hemorrhage. IM vitamin K is more effective than oral. Erythromycin eye prophylaxis prevents gonococcal conjunctivitis which can cause corneal scarring and blindness."
    difficulty: easy
    tags: [vitamin K, VKDB, erythromycin, ophthalmia neonatorum, newborn, prophylaxis]
  - front: "What are the cardinal signs of orbital cellulitis (as opposed to periorbital/preseptal cellulitis)?"
    back: "Ophthalmoplegia/diplopia, proptosis, decreased visual acuity, pain with extraocular eye movement.\n\nOrbital cellulitis (postseptal) involves infection posterior to the orbital septum, affecting the extraocular muscles and compressing the optic nerve. These features distinguish it from periorbital (preseptal) cellulitis, which is anterior to the septum and does not affect eye movement or vision. Orbital cellulitis is a surgical emergency."
    difficulty: easy
    tags: [orbital cellulitis, proptosis, ophthalmoplegia, pediatrics, ophthalmology]
  - front: "When should antibiotics be prescribed for sinusitis in children, and what is the first-line antibiotic?"
    back: "Antibiotics (amoxicillin) are indicated for ALL children if symptoms persist >10 days OR if symptoms are worsening/severe. Most viral sinusitis resolves spontaneously within a few weeks without antibiotics.\n\nSinusitis complicates 10% of pediatric URTIs. Diagnostic imaging is NOT required for diagnosis in children. CT is reserved for suspected complications, recurrent disease, or pre-surgical planning. Complications include orbital cellulitis, brain abscess, meningitis, and Pott's Puffy tumour (frontal osteomyelitis with subperiosteal abscess)."
    difficulty: easy
    tags: [sinusitis, amoxicillin, antibiotics, pediatrics, complications]
  - front: "What is Pott's Puffy Tumour and how is it managed?"
    back: "Pott's Puffy Tumour: complication of sinusitis presenting with tender, soft tissue erythematous swelling of the forehead, headache, photophobia, and fever. Results from frontal sinusitis causing osteomyelitis with subperiosteal abscess. Managed with IV antibiotics and ENT consult.\n\nPott's Puffy Tumour is a rare but serious intracranial complication of sinusitis — osteomyelitis of the frontal bone with associated subperiosteal abscess. It can also be associated with intracranial complications (epidural abscess, subdural empyema, cerebral abscess). Surgical drainage is often required alongside IV antibiotics."
    difficulty: hard
    tags: [Potts Puffy Tumour, sinusitis, osteomyelitis, pediatrics, ENT]
  - front: "A 6-year-old presents 2 weeks after a GAS throat infection with cola-coloured urine, facial puffiness, and hypertension. Investigations show low C3, elevated ASOT, and RBC casts on urinalysis. What is the diagnosis and expected prognosis?"
    back: "Post-Streptococcal Glomerulonephritis (PSGN). Prognosis: excellent — 95% of children recover completely within 1–2 weeks; 5–10% have persistent hematuria.\n\nThe classic triad of hematuria (cola/tea-coloured urine), hypertension, and edema following GAS infection 1–3 weeks prior, combined with low C3 and elevated streptococcal antibodies, is diagnostic of PSGN. Management is supportive. This contrasts with IgA nephropathy where hematuria occurs during (not after) infection."
    difficulty: hard
    tags: [PSGN, nephritis, hematuria, C3, GAS, pediatrics, clinical scenario]
  - front: "A 3-week-old term infant presents with a petechial rash and platelet count of 12,000/μL but is otherwise well. Mother has no known platelet disorder. What is the most likely diagnosis and management?"
    back: "Most likely: Neonatal Alloimmune Thrombocytopenia (NAIT). Management: platelet transfusion (HPA-specific platelets preferred; random donor acceptable). Consider IVIG. Obtain maternal and paternal platelet typing and platelet alloantibody identification.\n\nNAIT presents in otherwise well neonates (unlike sepsis-associated thrombocytopenia). A mother without ITP/SLE suggests alloimmune rather than autoimmune cause. HPA-1a is the most common antigen involved. ICH risk is high with platelets <30,000 — immediate transfusion is warranted. Prenatal IVIG and steroids are given in subsequent pregnancies."
    difficulty: hard
    tags: [NAIT, thrombocytopenia, neonatology, platelet transfusion, HPA, clinical scenario]
  - front: "What is the m-CENTOR score used for, and what are its components in pediatric practice?"
    back: "Used to estimate probability of streptococcal pharyngitis. Components: Cough (absent = +1), Exudates or tonsillar swelling (+1), Nodes (anterior cervical lymphadenopathy = +1), Only Young (<15 years = +1), Rarely Elder (>45 years = -1).\n\nThe m-CENTOR score guides decision-making for GAS pharyngitis: score 0–1 suggests no testing or antibiotics; score 2–3 suggests rapid strep test; score ≥4 suggests rapid strep test and consider antibiotics. This prevents inappropriate antibiotic prescribing for viral pharyngitis."
    difficulty: medium
    tags: [m-CENTOR, streptococcal pharyngitis, GAS, score, antibiotics, pediatrics]
  - front: "What is the hyperoxia test and how do you interpret results in a cyanotic neonate?"
    back: "Obtain baseline PaO2 in room air, then PaO2 on 100% O2 after 10-15 min. PaO2 <150 mmHg suggests cyanotic CHD or PPHN; PaO2 >150 mmHg suggests respiratory or non-cardiac cause.\n\nThe hyperoxia test distinguishes cardiac from respiratory causes of cyanosis. In cyanotic CHD, the R→L shunt bypasses the lungs entirely, so supplemental O2 cannot meaningfully raise PaO2. PPHN behaves similarly due to persistent fetal circulation. Respiratory causes improve with supplemental oxygen."
    difficulty: medium
    tags: [neonatology, cyanosis, CHD, PPHN, hyperoxia test, pediatrics]
  - front: "What are the classic clinical features of congenital diaphragmatic hernia (CDH) on physical examination?"
    back: "Scaphoid abdomen, barrel-shaped chest, dull percussion and absent breath sounds on affected side (may hear bowel sounds instead), heart sounds shifted contralaterally (if left-sided), asymmetric chest movements, trachea deviated away from affected side.\n\nCDH results from herniation of abdominal organs into the thorax through a developmental diaphragmatic defect, typically on the left (Bochdalek). The displaced bowel causes the characteristic scaphoid abdomen. Associated pulmonary hypoplasia and PPHN are major sources of morbidity."
    difficulty: easy
    tags: [neonatology, diaphragmatic hernia, CDH, pediatrics, respiratory distress]
  - front: "Why is bag-mask ventilation contraindicated in a newborn with suspected congenital diaphragmatic hernia?"
    back: "Air will enter the stomach and herniated bowel, further compressing the already hypoplastic lungs, worsening respiratory status.\n\nImmediate endotracheal intubation is required at birth. A large-bore orogastric tube should be placed to decompress the bowel. Bag-mask ventilation risks rapid distension of intrathoracic gut, causing critical lung compression in an infant who already has severely limited pulmonary reserve."
    difficulty: easy
    tags: [neonatology, diaphragmatic hernia, resuscitation, pediatrics]
  - front: "What is the definition of neonatal hypoglycemia?"
    back: "Blood glucose <2.6 mmol/L within the first 72 hours of life, OR <3.3 mmol/L after the first 72 hours of life.\n\nNeonates have limited glycogen stores and immature counter-regulatory mechanisms. At-risk infants (infants of diabetic mothers, LGA, SGA, preterm) require pre-feed glucose monitoring. Symptomatic hypoglycemia manifests as jitteriness, lethargy, poor feeding, apnea, or seizures."
    difficulty: easy
    tags: [neonatology, hypoglycemia, metabolic, pediatrics]
  - front: "A neonate with persistent hypoglycemia (>72 h, glucose <2.8 mmol/L) is being worked up. What 'critical blood work' should be sent during the hypoglycemic episode?"
    back: "Confirmatory plasma glucose, ABG, ammonia, beta-hydroxybutyrate, cortisol, carnitine, acylcarnitine profiling, free fatty acids, GH, insulin, lactate, urine dipstick for ketones.\n\nPersistent neonatal hypoglycemia beyond 72 hours requires investigation for underlying causes including hyperinsulinism (elevated insulin:glucose ratio), hormone deficiencies (low cortisol, GH), and inborn errors of metabolism (fatty acid oxidation defects, galactosemia). Critical sample must be drawn during the hypoglycemic episode for meaningful interpretation."
    difficulty: hard
    tags: [neonatology, hypoglycemia, metabolic workup, hyperinsulinism, pediatrics]
  - front: "What causes neonatal hypoglycemia in infants of mothers who took labetalol during pregnancy?"
    back: "Labetalol is a beta-blocker; beta-blockade impairs glycogenolysis and gluconeogenesis, blunting the counter-regulatory epinephrine response and suppressing glucose mobilization.\n\nLabetalol is commonly used for hypertension in preeclampsia. Beta-adrenergic blockade inhibits catecholamine-mediated glycogenolysis in the liver and glucagon release from the pancreas, predisposing neonates to hypoglycemia, particularly in the first hours of life."
    difficulty: hard
    tags: [neonatology, hypoglycemia, labetalol, beta-blocker, pharmacology, pediatrics]
  - front: "When is neonatal jaundice always considered pathological?"
    back: "Jaundice occurring within the first 24 hours of life, and any conjugated hyperbilirubinemia at any age, are always pathological.\n\nPhysiologic jaundice does not appear until day 3-4 in term neonates. Jaundice in the first 24 hours suggests hemolytic disease (Rh incompatibility, ABO incompatibility), sepsis, or TORCH infection. Conjugated (direct) hyperbilirubinemia always indicates an underlying pathology such as biliary atresia, neonatal hepatitis, or metabolic disease."
    difficulty: easy
    tags: [neonatology, jaundice, hyperbilirubinemia, pathologic, pediatrics]
  - front: "What are the timing characteristics of physiologic jaundice in term vs. premature neonates?"
    back: "Term infants: onset 3-4 days of life, resolution by 10 days. Premature infants: higher peak bilirubin and longer duration.\n\nPhysiologic jaundice results from increased bilirubin load (high hematocrit, shortened RBC lifespan), immature hepatic glucuronyl transferase system (reduced conjugation capacity), and increased enterohepatic circulation. Premature infants have even more immature enzyme systems and higher bilirubin burdens."
    difficulty: easy
    tags: [neonatology, jaundice, physiologic jaundice, prematurity, pediatrics]
  - front: "Distinguish breastfeeding jaundice from breast milk jaundice."
    back: "Breastfeeding jaundice: early onset due to inadequate milk intake → dehydration → exaggerated physiologic jaundice. Breast milk jaundice: onset day 7, peak at 2-3 weeks, resolves by 6 weeks; caused by a glucuronyl transferase inhibitor in breast milk; affects 1 in 200 breastfed infants.\n\nThese are distinct entities. Breastfeeding jaundice is a volume/hydration problem managed by improving latch and feeding frequency. Breast milk jaundice is a biochemical phenomenon where a substance in mature breast milk inhibits hepatic conjugation. In breast milk jaundice, interrupting breastfeeding for 24-48 hours leads to a rapid decline in bilirubin, confirming the diagnosis."
    difficulty: medium
    tags: [neonatology, jaundice, breastfeeding, breast milk jaundice, pediatrics]
  - front: "What investigations are indicated in a neonate with unconjugated hyperbilirubinemia?"
    back: "Hemolytic workup: CBC, reticulocyte count, blood group (mother and infant), peripheral blood smear, Coombs test (DAT). If unwell/febrile: septic workup (CBC + differential, blood/urine cultures, LP, CXR). Others: G6PD screen (especially males), TSH.\n\nThe initial goal is to identify hemolytic causes (most urgent) vs. non-hemolytic causes. ABO/Rh incompatibility and G6PD deficiency are the most common immune and enzymatic causes. TSH is checked because hypothyroidism can present with prolonged unconjugated jaundice. G6PD deficiency particularly affects males (X-linked)."
    difficulty: medium
    tags: [neonatology, jaundice, hyperbilirubinemia, investigations, G6PD, pediatrics]
  - front: "What investigations should be considered for conjugated hyperbilirubinemia in a neonate?"
    back: "Liver enzymes (AST, ALT), coagulation studies (PT, PTT), serum albumin, ammonia, TSH, TORCH screen, septic workup, galactosemia screen (erythrocyte galactose-1-phosphate uridyltransferase), metabolic screen, abdominal U/S, HIDA scan, sweat chloride.\n\nConjugated hyperbilirubinemia must be investigated without delay. Key diagnoses to exclude include biliary atresia (urgent—Kasai procedure most successful if done before 8 weeks), neonatal hepatitis, metabolic disorders (galactosemia, alpha-1-antitrypsin deficiency), and hypothyroidism. HIDA scan assesses bile excretion."
    difficulty: hard
    tags: [neonatology, conjugated hyperbilirubinemia, biliary atresia, HIDA, pediatrics]
  - front: "How does phototherapy work in neonatal unconjugated hyperbilirubinemia, and what are its contraindications?"
    back: "Blue-green wavelength light converts insoluble unconjugated bilirubin to excretable form via photoisomerization. Contraindicated in conjugated hyperbilirubinemia (causes 'bronzed baby' syndrome due to accumulation of a toxic photoproduct).\n\nPhotoisomerization converts bilirubin to water-soluble lumirubin and configurational isomers excreted in bile/urine without conjugation. The effect is reversible, so bilirubin may rebound after phototherapy is stopped. Eye shields are used routinely to prevent retinal damage. Side effects include skin rash, diarrhea, and dehydration."
    difficulty: medium
    tags: [neonatology, phototherapy, jaundice, bronzed baby, pediatrics]
  - front: "What is kernicterus and at what bilirubin level does risk significantly increase?"
    back: "Kernicterus is permanent brain damage (basal ganglia and brainstem necrosis) from unconjugated bilirubin deposition when it exceeds albumin binding capacity. Incidence increases significantly above 340 µmol/L.\n\nUnbound (free) unconjugated bilirubin crosses the blood-brain barrier. Risk is increased at lower bilirubin levels in the presence of sepsis, meningitis, hemolysis, hypoxia, acidosis, hypothermia, hypoglycemia, and prematurity, all of which reduce albumin binding or disrupt the blood-brain barrier."
    difficulty: medium
    tags: [neonatology, kernicterus, bilirubin, brain injury, pediatrics]
  - front: "What are the stages of acute bilirubin encephalopathy?"
    back: "Early: lethargy, hypotonia, poor feeding, emesis. Intermediate: hypertonia, high-pitched cry, opisthotonic posturing (back arching), bulging fontanelle. Late: apnea, inability to feed, seizures, hypertonia, weak/absent cry, death.\n\nAcute bilirubin encephalopathy is a medical emergency. Progression through the stages reflects increasing bilirubin deposition in the basal ganglia and brainstem. Chronic bilirubin encephalopathy (in survivors) manifests as hypotonia, delayed motor skills, choreoathetoid cerebral palsy, gaze palsy, and sensorineural hearing loss."
    difficulty: medium
    tags: [neonatology, kernicterus, bilirubin encephalopathy, pediatrics]
  - front: "What is biliary atresia, how does it present, and what is the definitive surgical treatment?"
    back: "Progressive obliterative cholangiopathy of extrahepatic bile ducts leading to conjugated hyperbilirubinemia. Presents with dark urine, pale stools, persistent jaundice >2 weeks, hepatomegaly, abdominal distension. Treatment: hepatoportoenterostomy (Kasai procedure), most successful if performed before 8 weeks of age; 2/3 eventually require liver transplantation.\n\nBiliary atresia affects 1 in 10,000-15,000 births and is the most common indication for pediatric liver transplantation. Early diagnosis is critical because the Kasai procedure has the best outcomes before 8 weeks. Postoperative management includes fat-soluble vitamins (A, D, E, K) and medium-chain triglyceride-enriched diet due to fat malabsorption from cholestasis."
    difficulty: medium
    tags: [pediatrics, biliary atresia, Kasai procedure, neonatology, cholestasis]
  - front: "What is necrotizing enterocolitis (NEC) and what is its hallmark radiologic finding?"
    back: "NEC is intestinal inflammation with focal or diffuse ulceration/necrosis, primarily affecting the terminal ileum and colon. The hallmark AXR finding is pneumatosis intestinalis (intramural air).\n\nNEC predominantly affects preterm/VLBW infants (1-5% of NICU admissions). Pathophysiology involves immature gut defenses, mucosal ischemia, enteral feeding, and bacterial overgrowth. Additional AXR findings include portal venous gas, free intraperitoneal air (perforation), and fixed bowel loops. Abdominal U/S with Doppler may be more sensitive than X-rays."
    difficulty: easy
    tags: [neonatology, NEC, necrotizing enterocolitis, pneumatosis intestinalis, preterm, pediatrics]
  - front: "What are the risk factors for necrotizing enterocolitis?"
    back: "Prematurity (most important), low birth weight, asphyxia/shock (poor bowel perfusion), hyperosmolar feeds, formula feeding (breast milk is protective), sepsis, congenital heart disease, IUGR.\n\nBreast milk is protective in NEC, likely due to secretory IgA, oligosaccharides, lactoferrin, and beneficial microbiome modulation. The modified Bell criteria are used to stage NEC severity. Perforation carries ~40% mortality, managed with peritoneal drain or surgical resection of necrotic bowel."
    difficulty: medium
    tags: [neonatology, NEC, risk factors, preterm, pediatrics]
  - front: "What is the empiric antibiotic regimen for NEC?"
    back: "Ampicillin + gentamicin + metronidazole (metronidazole added if risk of perforation); for 7-10 days. NPO for 7-10 days, NG tube decompression, IV fluids, TPN.\n\nMetronidazole provides anaerobic coverage important if gut perforation is suspected. Serial AXRs are essential for early detection of perforation. Surgical intervention (peritoneal drain or bowel resection) is required for perforation or failure of medical management."
    difficulty: medium
    tags: [neonatology, NEC, antibiotics, management, pediatrics]
  - front: "What is the pathophysiology of persistent pulmonary hypertension of the newborn (PPHN)?"
    back: "Persistent elevation of pulmonary vascular resistance causes R→L shunt through PDA and patent foramen ovale, leading to decreased pulmonary blood flow and hypoxemia, which further promotes pulmonary vasoconstriction (vicious cycle).\n\nPPHN represents failure of the normal circulatory transition at birth. In utero, the foramen ovale and ductus arteriosus are patent with high PVR. At birth, lung expansion and oxygenation normally reduce PVR. Secondary PPHN is associated with asphyxia, MAS, RDS, sepsis, pneumonia, and structural abnormalities (diaphragmatic hernia, pulmonary hypoplasia)."
    difficulty: medium
    tags: [neonatology, PPHN, pulmonary hypertension, pathophysiology, pediatrics]
  - front: "How is PPHN diagnosed and what are the key treatment modalities?"
    back: "Diagnosis: pre/post-ductal O2 gradient, hyperoxia test to exclude CHD, echocardiogram (confirms elevated pulmonary pressures and R→L shunt, rules out cardiac defects). Treatment: maintain SaO2 >95%, O2 supplementation, mechanical ventilation (including high-frequency oscillation), sedation, minimize handling, milrinone (pressor), inhaled nitric oxide, surfactant, ECMO if refractory.\n\nA pre-ductal (right hand) vs. post-ductal (foot) SpO2 difference >10% confirms the right-to-left ductal shunt. Inhaled nitric oxide is a selective pulmonary vasodilator and is a cornerstone of PPHN treatment. ECMO is reserved for cases failing other therapies at specialized centres."
    difficulty: hard
    tags: [neonatology, PPHN, nitric oxide, ECMO, management, pediatrics]
  - front: "Compare the CXR findings in RDS, TTN, and MAS."
    back: "RDS: homogeneous infiltrates, air bronchograms, decreased lung volumes; severe = 'white-out'. TTN: perihilar infiltrates, fluid in fissures ('wet silhouette'), normal to increased lung volumes. MAS: hyperinflation, patchy atelectasis, coarse patchy infiltrates; 10-20% have pneumothorax.\n\nRDS (hyaline membrane disease) is due to surfactant deficiency in preterm neonates. TTN ('wet lung') results from delayed resorption of fetal lung fluid and typically resolves in 24-72 hours. MAS occurs in term/post-term infants and involves airway obstruction plus chemical inflammation from meconium, leading to air trapping and pneumothorax risk."
    difficulty: medium
    tags: [neonatology, RDS, TTN, MAS, CXR, respiratory distress, pediatrics]
  - front: "What is the gestational age distribution and primary prevention for RDS vs. TTN?"
    back: "RDS: preterm infants. Prevention: prenatal corticosteroids (e.g., betamethasone 12 mg q24h x2 doses) if risk of preterm delivery <34 wks; monitor L/S ratio (>2:1 indicates lung maturity). TTN: term and late preterm, associated with elective Cesarean (especially before 38 weeks GA). Prevention: avoid elective cesarean before 38 weeks.\n\nPrenatal corticosteroids accelerate fetal lung maturation by inducing surfactant synthesis. The L/S (lecithin:sphingomyelin) ratio from amniocentesis assesses lung maturity. TTN is more common after elective cesarean because the 'thoracic squeeze' during vaginal delivery helps expel fetal lung fluid."
    difficulty: medium
    tags: [neonatology, RDS, TTN, prevention, corticosteroids, pediatrics]
  - front: "What is the treatment for RDS and MAS in neonates?"
    back: "RDS: resuscitation, oxygen, ventilation, exogenous surfactant (decreases alveolar surface tension, improves lung compliance, maintains FRC). MAS: resuscitation, oxygen, ventilatory support, surfactant, inhaled nitric oxide, ECMO for associated PPHN.\n\nExogenous surfactant is the cornerstone of RDS treatment. In MAS, meconium inactivates endogenous surfactant, providing rationale for exogenous surfactant replacement. If the infant is depressed at birth with meconium-stained fluid, intubation and tracheal suctioning can be done based on clinical judgment (not mandatory in current NRP sequence)."
    difficulty: medium
    tags: [neonatology, RDS, MAS, surfactant, treatment, pediatrics]
  - front: "What are the pathogens of early-onset vs. late-onset neonatal sepsis?"
    back: "Early onset (<72 h): GBS, E. coli, Listeria monocytogenes (vertical transmission). Late onset (72 h-28 d): coagulase-negative Staphylococcus (most common in NICU), GBS, anaerobes, E. coli, Klebsiella (acquired after birth).\n\nGBS is the leading cause of early-onset neonatal sepsis and meningitis. E. coli is significant, particularly in preterm neonates. Late-onset sepsis in NICU infants is dominated by coagulase-negative Staphylococcus (S. epidermidis) due to central-line colonization. Listeria should be considered in early-onset sepsis with maternal exposure to unpasteurized food."
    difficulty: medium
    tags: [neonatology, sepsis, GBS, Listeria, NICU, pediatrics]
  - front: "What is the empiric antibiotic regimen for early-onset neonatal sepsis vs. suspected neonatal meningitis?"
    back: "Early-onset sepsis (non-meningitic): IV ampicillin + gentamicin. Suspected meningitis or late-onset sepsis: IV ampicillin + cefotaxime + vancomycin at meningitic doses. Add IV acyclovir if HSV infection is suspected.\n\nAmpicillin covers GBS, Listeria, and many gram-negatives. Gentamicin provides synergistic gram-negative coverage. Cefotaxime achieves better CSF penetration than gentamicin for meningitis. Vancomycin covers resistant gram-positive organisms common in late-onset NICU sepsis. Acyclovir is added empirically when HSV encephalitis/sepsis is possible (skin/oral lesions, maternal HSV history)."
    difficulty: medium
    tags: [neonatology, sepsis, meningitis, antibiotics, management, pediatrics]
  - front: "What CBC findings suggest neonatal sepsis?"
    back: "WBC <5 x 10^9/L or >30 x 10^9/L (or left-shifted), low absolute neutrophil count (ANC) <1.5 x 10^9/L. No single CBC value reliably identifies occult bacteremia in infants <3 months.\n\nBoth leukopenia and leukocytosis can indicate sepsis in neonates. A left shift (increased band neutrophils) reflects bone marrow stress response to infection. The immature-to-total neutrophil ratio (I:T ratio) >0.2 is also used clinically. No individual CBC parameter has sufficient sensitivity and specificity alone to rule in or rule out neonatal sepsis."
    difficulty: medium
    tags: [neonatology, sepsis, CBC, investigations, pediatrics]
  - front: "What is congenital dermal melanocytosis (Mongolian spot) and what is its clinical significance?"
    back: "Slate grey patches, usually over the lower back/buttocks/lower limbs, caused by dermal melanocytes. Prevalence: Asian > Black > Hispanic > White. Typically fades within first 2 years. Benign; may be mistaken for bruising—important to document to avoid false accusations of child abuse.\n\nCongenital dermal melanocytosis represents entrapped melanocytes in the dermis during neural crest migration. The slate-grey colour is due to the Tyndall effect. Documentation at birth is critical because the appearance can mimic inflicted injury bruising."
    difficulty: easy
    tags: [neonatology, skin, dermal melanocytosis, pediatrics, normal variant]
  - front: "What is erythema toxicum neonatorum and how is it distinguished from serious neonatal skin conditions?"
    back: "Common benign rash consisting of yellow-white papules/pustules surrounded by erythema; eosinophils within lesions on smear. Resolves in 5-7 days. Distinguished from infection by the eosinophil-predominant smear and the absence of systemic illness.\n\nErythema toxicum neonatorum occurs in up to 50% of term newborns. The etiology is unknown. Wright stain of pustule contents showing eosinophils distinguishes it from neonatal herpes (multinucleated giant cells) and bacterial pustulosis (neutrophils). No treatment is required."
    difficulty: easy
    tags: [neonatology, skin, erythema toxicum, pediatrics, normal variant]
  - front: "What is hemolytic uremic syndrome (HUS) and what is the classic triad?"
    back: "Simultaneous occurrence of: (1) non-immune microangiopathic hemolytic anemia, (2) thrombocytopenia, (3) acute renal injury. Most common cause of acute renal failure in children.\n\nSTEC-HUS (90% of pediatric HUS) is caused by Shiga toxin-producing E. coli O157:H7. Shiga toxin damages colonic and renal endothelial cells, triggering platelet/fibrin thrombi in the microvasculature. RBCs forced through occluded vessels become fragmented (schistocytes), seen on peripheral smear."
    difficulty: easy
    tags: [pediatrics, HUS, hemolytic uremic syndrome, renal, E. coli]
  - front: "Why are antibiotics contraindicated in STEC-HUS (E. coli O157:H7 infection)?"
    back: "Antibiotics promote bacterial lysis, releasing large amounts of Shiga toxin, which can worsen the systemic toxin burden and increase risk of HUS development.\n\nSeveral observational studies suggest antibiotic use for E. coli O157:H7 diarrhea increases HUS risk, likely through toxin release. NSAIDs and antidiarrheal agents are also avoided (NSAIDs due to renal toxicity; antidiarrheals because they prolong toxin exposure). Supportive care is the mainstay of STEC-HUS treatment."
    difficulty: medium
    tags: [pediatrics, HUS, E. coli O157, antibiotics contraindication, Shiga toxin]
  - front: "What is the treatment for atypical HUS vs. STEC-HUS?"
    back: "STEC-HUS: supportive care (nutrition, hydration, blood products), dialysis if needed; avoid antibiotics, NSAIDs, antidiarrheal agents. Atypical HUS: plasma exchange or eculizumab (complement inhibitor).\n\nAtypical HUS is caused by dysregulation of the complement pathway (hereditary mutations) or non-Shiga toxin infections (S. pneumoniae, HIV). Eculizumab is a monoclonal antibody against complement C5 that prevents terminal complement activation, and is now standard of care for atypical HUS. Atypical HUS has a much worse prognosis (50% death or dialysis-dependent)."
    difficulty: hard
    tags: [pediatrics, HUS, eculizumab, atypical HUS, complement, renal]
  - front: "What defines nephritic syndrome and what are its key urinalysis findings?"
    back: "Glomerular injury/inflammation characterized by hematuria (>5 RBCs/HPF), dysmorphic RBCs, and RBC casts on urinalysis, often with proteinuria (<50 mg/kg/d), edema, HTN, azotemia, and oliguria.\n\nRBC casts are pathognomonic of glomerulonephritis. Dysmorphic RBCs (acanthocytes) result from RBCs being deformed as they pass through damaged glomerular basement membranes. Nephritic syndrome is most common in children ages 5-15 years. The mechanism involves humoral immune response → immunoglobulin deposition → complement activation → glomerular inflammation."
    difficulty: medium
    tags: [pediatrics, nephritic syndrome, glomerulonephritis, urinalysis, renal]
  - front: "What are the major causes of nephritic syndrome with decreased C3 vs. normal C3?"
    back: "Decreased C3: post-infectious GN (most common—post-streptococcal), membranoproliferative GN (types I and II), SLE, bacterial endocarditis, shunt nephritis, cryoglobulinemia. Normal C3: IgA nephropathy, HSP (very common in pediatrics), anti-GBM disease, ANCA-associated vasculitis (granulomatosis with polyangiitis, polyarteritis nodosa), Goodpasture's syndrome.\n\nComplement levels are a key discriminating point in the workup of nephritic syndrome. Low C3 indicates complement consumption in the pathogenesis. Post-streptococcal GN has the best prognosis among primary nephritic syndromes. IgA nephropathy (Berger disease) is the most common worldwide cause of GN and has normal complement."
    difficulty: hard
    tags: [pediatrics, nephritic syndrome, C3, post-streptococcal GN, IgA nephropathy, renal]
  - front: "What investigations are used to confirm a recent streptococcal infection in post-infectious GN?"
    back: "ASOT (anti-streptolysin O titre), anti-hyaluronidase, anti-streptokinase, anti-NAD, anti-DNAse B antibodies.\n\nPost-streptococcal GN typically follows pharyngitis (2 weeks) or impetigo (4-6 weeks). A single negative ASOT does not exclude streptococcal etiology because it may not rise after skin infections (use anti-DNAse B for impetigo). C3 is depressed in the acute phase and normalizes within 6-8 weeks; persistent low C3 beyond 8 weeks should prompt evaluation for other causes (MPGN, SLE)."
    difficulty: medium
    tags: [pediatrics, post-streptococcal GN, ASOT, investigations, renal]
  - front: "When is renal biopsy indicated in nephritic syndrome?"
    back: "Renal biopsy should be considered when there is acute renal failure, no evidence of streptococcal infection, and normal C3/C4.\n\nWhen the clinical picture clearly fits post-streptococcal GN (elevated streptococcal titres, decreased C3, appropriate timeline), biopsy is generally not needed. However, if the etiology is uncertain, ARF is present, or C3 remains persistently low, biopsy is necessary to guide immunosuppressive therapy and determine prognosis."
    difficulty: medium
    tags: [pediatrics, nephritic syndrome, renal biopsy, management, renal]
  - front: "Why are ACE inhibitors and ARBs avoided in acute nephritic syndrome with hypertension?"
    back: "In acute nephritic syndrome, ACEIs/ARBs may further decrease GFR (which is already impaired due to glomerular inflammation), potentially worsening renal function. They are appropriate for chronic persistent HTN in nephritic syndrome, not acute cases.\n\nIn the acute phase, efferent arteriolar dilation by RAAS blockade risks precipitous GFR decline in already compromised kidneys. Acute HTN management prioritizes salt and fluid restriction. In contrast, chronic nephritic syndrome with persistent HTN benefits from RAAS blockade for both BP control and renoprotection (reducing proteinuria)."
    difficulty: hard
    tags: [pediatrics, nephritic syndrome, ACE inhibitors, hypertension, renal]
  - front: "Define nephrotic syndrome and give the mnemonic for its key features."
    back: "Clinical syndrome characterized by significant proteinuria (>50 mg/kg/d), peripheral edema, hypoalbuminemia (<20 g/L), and hyperlipidemia. Mnemonic: HELP — Hypoalbuminemia, Edema, Lipids elevated, Proteinuria.\n\nMassive urinary protein loss (primarily albumin) drives the pathophysiology: reduced oncotic pressure → edema; liver compensatory hyperlipidemia (decreased catabolism, increased VLDL synthesis) → hyperlipidemia; loss of clotting factors and immunoglobulins → increased infection and thrombosis risk. Most common in children ages 2-6 years."
    difficulty: easy
    tags: [pediatrics, nephrotic syndrome, renal, HELP mnemonic]
  - front: "What is the most common cause of nephrotic syndrome in children and how is it confirmed?"
    back: "Minimal change disease (MCD), accounting for ~85% of primary nephrotic syndrome in pediatrics. Diagnosed clinically when steroid-responsive; renal biopsy shows no glomerular changes on light microscopy (effacement of podocyte foot processes on electron microscopy).\n\nMCD is idiopathic (primary nephrotic syndrome without systemic disease). Characterized by absence of glomerular inflammation on biopsy. The hallmark is dramatic steroid responsiveness, so most children are treated empirically with corticosteroids without initial biopsy. Biopsy is reserved for atypical presentations or steroid-resistant cases."
    difficulty: medium
    tags: [pediatrics, nephrotic syndrome, minimal change disease, MCD, renal]
  - front: "What are the secondary causes of nephrotic syndrome in pediatrics?"
    back: "Autoimmune: SLE, DM, juvenile idiopathic arthritis. Genetic: sickle cell disease, Alport syndrome. Infections: hepatitis B/C, post-streptococcal, infective endocarditis, HUS, HIV. Malignancies: leukemia, lymphoma. Medications: captopril, penicillamine, NSAIDs, antiepileptics. Vasculitides: HSP, granulomatosis with polyangiitis.\n\nSecondary nephrotic syndrome accounts for <10% of pediatric cases. In contrast to MCD, these require treatment of the underlying condition. HSP (Henoch-Schönlein Purpura/IgA vasculitis) is a very common pediatric vasculitis that can cause nephritic and/or nephrotic syndrome."
    difficulty: medium
    tags: [pediatrics, nephrotic syndrome, secondary causes, renal, HSP]
  - front: "What is the annual incidence of HUS in Canada and what is the E. coli serotype most commonly responsible?"
    back: "Annual incidence: 1-2 per 100,000 in Canada. Most common E. coli serotype: O157:H7 (Shiga toxin-producing E. coli, STEC).\n\nSTEC-HUS accounts for 90% of pediatric HUS in Canada. O157:H7 produces Shiga toxins 1 and 2, with Stx2 being more nephrotoxic. Outbreaks are linked to contaminated ground beef, unpasteurized apple cider, sprouts, and contaminated water. The incubation period is 3-5 days, and HUS develops 5-10 days after the onset of diarrhea."
    difficulty: medium
    tags: [pediatrics, HUS, E. coli O157, epidemiology, Canada, renal]
  - front: "What neonatal skin condition appearing as firm white pearly papules on the nasal bridge is a normal finding?"
    back: "Milia — 1-2 mm firm white pearly papules on the nasal bridge, cheeks, and palate; self-resolve within the first few weeks of life.\n\nMilia are benign epidermal inclusion cysts arising from retained keratin within immature pilosebaceous follicles. They are found in up to 50% of newborns and require no treatment. They differ from Epstein pearls (similar white papules on the gingiva/palate) but both are normal and self-resolving."
    difficulty: easy
    tags: [neonatology, skin, milia, normal variant, pediatrics]
  - front: "What neonatal conditions can present with a flank mass?"
    back: "Hydronephrosis, polycystic kidney disease (autosomal dominant or recessive), and renal tumour (e.g., Wilms tumour).\n\nA flank mass in a neonate is most commonly hydronephrosis (usually detected on antenatal U/S). Bilateral flank masses suggest polycystic kidney disease—ARPKD presents at birth with massively enlarged kidneys and is associated with Potter sequence (oligohydramnios, pulmonary hypoplasia, characteristic facies). A unilateral mass in an older child warrants urgent evaluation for Wilms tumour."
    difficulty: easy
    tags: [pediatrics, renal, flank mass, hydronephrosis, polycystic kidney, neonatology]
  - front: "What is the prognosis of STEC-HUS vs. atypical HUS in children?"
    back: "STEC-HUS: <5% mortality; 30% develop long-term renal damage (HTN, proteinuria, decreased GFR). Atypical HUS: much worse prognosis; 50% of cases result in death or dialysis-dependent renal disease.\n\nLong-term follow-up after STEC-HUS should include annual BP monitoring and urinalysis to detect chronic kidney disease. Atypical HUS has a poor prognosis because complement dysregulation causes relapsing or chronic TMA. Eculizumab has significantly improved outcomes in atypical HUS by blocking terminal complement activation."
    difficulty: medium
    tags: [pediatrics, HUS, prognosis, atypical HUS, renal, eculizumab]
