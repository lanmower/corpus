# Gastroenterology Diarrhea (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is the definition and classification of diarrhea?"
    back: "Clinical definition: stools that are looser and/or more frequent than normal (≥3×/day). Physiological definition: 24-hour stool weight >200 g (less useful clinically).\n\nClassification:\n1. Acute vs. chronic\n2. Small volume (tablespoons; typical of colonic diseases) vs. large volume (>½ cup; typical of small bowel diseases)\n3. Watery: secretory (persists with fasting) vs. osmotic (stops with fasting)\n4. Steatorrhea (fatty diarrhea)\n5. Inflammatory (bloody or watery)\n\nThis classification framework guides the investigation strategy. The secretory vs. osmotic distinction is made clinically by fasting: osmotic diarrhea stops when intake ceases because the osmotic agent is removed, whereas secretory diarrhea continues regardless of fasting."
    difficulty: easy
    tags: [diarrhea, classification, secretory, osmotic, steatorrhea, gastroenterology]
  - front: "What distinguishes inflammatory from non-inflammatory diarrhea?"
    back: "Inflammatory diarrhea:\n- Site: usually colon\n- Mechanism: organisms/cytotoxins invade mucosa → destruction of mucosal cells\n- Symptoms: bloody (not always), small volume, high frequency, lower abdominal cramping with urgency and tenesmus, may have fever and shock\n- Sigmoidoscopy: usually abnormal mucosa\n- Investigations: fecal WBC and RBC positive\n- Higher yield with stool C&S\n- Risk of life-threatening megacolon, perforation, hemorrhage\n- ABx may be helpful\n\nNon-inflammatory diarrhea:\n- Site: usually small intestine\n- Mechanism: stimulation of intestinal water secretion + inhibition of water absorption (net secretion)\n- Symptoms: watery, little or no blood, large volume, low frequency, upper/periumbilical pain/cramping ± shock\n- Sigmoidoscopy: usually normal mucosa\n- Investigations: fecal WBC negative\n- Lower yield with stool C&S\n- Chief life-threatening problem is electrolyte disturbances/fluid depletion\n- ABx unlikely helpful\n\nThis distinction guides investigation and treatment. Inflammatory diarrhea from bacterial invasion (CHESS organisms) requires stool cultures and sometimes antibiotics. Non-inflammatory diarrhea management focuses on rehydration."
    difficulty: medium
    tags: [inflammatory diarrhea, non-inflammatory diarrhea, classification, gastroenterology]
  - front: "What are the infectious causes of inflammatory (bloody) diarrhea? Use the mnemonic CHESS."
    back: "CHESS:\n- C: Campylobacter\n- H: Hemorrhagic E. coli (e.g. O157:H7 — EHEC)\n- E: Entamoeba histolytica\n- S: Salmonella\n- S: Shigella\n\nAlso: C. difficile\n\nThese organisms invade the colonic mucosa producing bloody, small-volume, high-frequency diarrhea with tenesmus. EHEC O157:H7 is particularly dangerous due to Shiga toxin causing hemolytic uremic syndrome (HUS). Antibiotics are contraindicated in EHEC because they may increase Shiga toxin release."
    difficulty: easy
    tags: [inflammatory diarrhea, CHESS, Campylobacter, E. coli O157:H7, Shigella, Salmonella, gastroenterology]
  - front: "What are the indications for antimicrobial therapy in acute diarrhea?"
    back: "Always indicated:\n- Shigella\n- Vibrio cholerae\n- C. difficile\n- Traveller's diarrhea (E. coli ETEC)\n- Giardia\n- Entamoeba histolytica\n- Cyclospora\n\nSituational (case-by-case):\n- Salmonella (treat only if: Salmonella typhi; OR underlying immunodeficiency, hemolytic anemia, extremes of age, aneurysms, prosthetic valve/grafts/joints, sickle cell disease)\n- Campylobacter\n- Yersinia\n- Non-enterotoxigenic E. coli\n\nGeneral indications: septicemia; prolonged fever with fecal blood or WBCs on O&P.\n\nAntibiotics are NOT routinely indicated in acute diarrhea — most infections are self-limiting. EHEC O157:H7 is a key contraindication to antibiotics (increases HUS risk). Non-typhi Salmonella typically should NOT be treated unless specific high-risk conditions are present."
    difficulty: hard
    tags: [acute diarrhea, antibiotics, Salmonella, Shigella, C. difficile, gastroenterology]
  - front: "What are the contraindications to antimotility agents (e.g. loperamide) in diarrhea, and what are their side effects?"
    back: "Contraindications: mucosal inflammation; bloody diarrhea.\n\nSide effects of antimotility agents (diphenoxylate, loperamide):\n- Abdominal cramps\n- Toxic megacolon\n\nNote: Bismuth subsalicylate (Pepto-Bismol) — a modifier of fluid transport — may be helpful but should NOT be used in the presence of bloody diarrhea or fever.\n\nIn inflammatory diarrhea, antimotility agents can trap infectious organisms and toxins in the gut, promoting toxic megacolon — especially dangerous in C. difficile colitis and EHEC infection. Loperamide is appropriate only in non-inflammatory, non-bloody diarrhea."
    difficulty: medium
    tags: [loperamide, antimotility agents, toxic megacolon, diarrhea, contraindications, gastroenterology]
  - front: "What are the clinical features of Salmonella typhi (typhoid fever)?"
    back: "Salmonella typhi (typhoid/enteric fever) features:\n- Prodrome: high fever, relative bradycardia (pulse-temperature dissociation), headache, abdominal pain\n- Rose spot rash: transient maculopapular rash on anterior thorax and upper abdomen\n- Diarrhea is NOT the initial presentation\n\nTreatment: always treat Salmonella typhi (unlike non-typhi Salmonella).\n\nTyphoid fever's classic features — relative bradycardia + high fever + rose spot rash — distinguish it from other febrile illnesses. Diarrhea typically occurs later in the illness. All typhoid cases must be treated with antibiotics (fluoroquinolones or azithromycin) and reported to public health."
    difficulty: medium
    tags: [Salmonella typhi, typhoid fever, rose spot, relative bradycardia, gastroenterology]
  - front: "What are the indications for stool culture (C&S/O&P) in acute diarrhea?"
    back: "Stool cultures are required only if diarrhea is:\n1. Inflammatory (bloody diarrhea)\n2. Severe\n3. For epidemiological purposes:\n   - Daycare worker or nursing home resident\n   - Community outbreaks (e.g. Walkerton)\n   - Travel history\n\nImportant limitations:\n- O&P results take up to 3 weeks\n- C&S only tests Campylobacter, Salmonella, Shigella, E. coli, Yersinia — other organisms must be ordered separately\n- C. difficile toxin: indicated if recent/remote antibiotic use, hospitalization, nursing home living, or recent chemotherapy\n\nThe Walkerton outbreak (2000, Ontario) — E. coli O157:H7 and Campylobacter contaminating municipal water — is a landmark Canadian public health event that shaped infectious diarrhea reporting protocols. Routine stool cultures in mild, self-limited diarrhea are not cost-effective."
    difficulty: medium
    tags: [stool culture, C&S, O&P, acute diarrhea, epidemiology, Walkerton, gastroenterology]
