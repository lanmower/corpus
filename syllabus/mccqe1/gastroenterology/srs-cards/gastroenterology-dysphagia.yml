# Gastroenterology Dysphagia (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "Distinguish oropharyngeal from esophageal dysphagia."
    back: "Oropharyngeal dysphagia: difficulty initiating swallowing, with choking, coughing, and nasal regurgitation. Causes include neurological (cortical, bulbar, peripheral), muscular (muscular dystrophy, polymyositis, myasthenia gravis), and structural (Zenker's diverticulum, thyromegaly, cervical spur, cricopharyngeal dysfunction).\n\nEsophageal dysphagia: inability to move food down the esophagus. Causes include mechanical obstruction and neuromuscular disorders.\n\nDistinguishing oropharyngeal from esophageal dysphagia guides the differential diagnosis. Key questions include: solids only vs. solids+liquids; intermittent vs. progressive; and associated symptoms (regurgitation, chest pain, voice change, weight loss)."
    difficulty: easy
    tags: [dysphagia, oropharyngeal, esophageal, differential diagnosis, gastroenterology]
  - front: "What does dysphagia to solids only versus solids AND liquids suggest in terms of etiology?"
    back: "Dysphagia to solids only suggests mechanical obstruction (structural narrowing such as carcinoma, peptic stricture, Schatzki ring). Dysphagia to both solids and liquids suggests a neuromuscular disorder (e.g. achalasia, scleroderma, diffuse esophageal spasm).\n\nThis clinical distinction is a key diagnostic clue: structural lesions impede solid boluses first, while motility disorders (affecting peristalsis and LES function) impair transport of both solid and liquid."
    difficulty: easy
    tags: [dysphagia, mechanical obstruction, neuromuscular, achalasia, gastroenterology]
