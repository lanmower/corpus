# Family Medicine Chest Pain (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the differential diagnoses of chest pain in primary care, and what clinical finding best distinguishes pericarditis from other causes?"
    back: "Differential: acute MI, chest wall pain, GERD, panic disorder/anxiety, pericarditis, pneumonia, heart failure, pulmonary embolism, acute thoracic aortic dissection. Pericarditis: classic triad of pleuritic chest pain (worse with inspiration and lying down, better sitting forward), pericardial friction rub, and ECG changes (diffuse ST elevation and PR depression without T-wave inversion).\n\nThe 'sit forward' sign is pathognomonic for pericarditis — the pericardial space enlarges when leaning forward, reducing friction. In contrast, MI pain is typically constant and not positional. Aortic dissection presents with severe tearing chest/back pain and pulse differential in upper extremities (LR+ 5.3)."
    difficulty: medium
    tags: [chest pain, differential diagnosis, pericarditis, MI, aortic dissection, family medicine]
  - front: "How does MI present differently in elderly women and diabetic patients compared to classic presentation?"
    back: "Elderly women: may present with dizziness, back pain, lightheadedness, or symptoms different from the stereotypical presentation (atypical presentation). Diabetics: may present with dyspnea, syncope, and fatigue in the absence of chest pain (due to autonomic neuropathy causing silent ischemia).\n\nAtypical MI presentations are a major source of missed diagnoses. Autonomic neuropathy in long-standing diabetes blunts the perception of ischemic pain (silent MI). Women are also more likely to present with nausea, jaw pain, or fatigue as the dominant symptom. ECG and cardiac enzymes are essential regardless of presentation."
    difficulty: medium
    tags: [MI, atypical presentation, elderly women, diabetes, chest pain, family medicine]
  - front: "What is the immediate management of acute MI in primary care before transfer to emergency?"
    back: "ASA 160–325 mg chewed STAT, clopidogrel (Plavix®) or ticagrelor (Brilinta®), LMWH (enoxaparin), morphine, oxygen, NTG. Reperfusion therapy with fibrinolytics (tPA, reteplase, tenecteplase, or streptokinase) if within 12 hours (ideally <30 min), or PCI if time from first medical contact to catheter lab is <30 min. Start beta-blocker (e.g., metoprolol 25 mg PO q6h or BID, titrate to HR 55–60 bpm).\n\nThe mnemonic MONA (Morphine, Oxygen, Nitrates, Aspirin) captures the initial steps. ASA should be chewed (not swallowed whole) for faster absorption. Fibrinolytics are used when PCI is not available within the required timeframe. Beta-blockers reduce myocardial oxygen demand and limit infarct size."
    difficulty: medium
    tags: [MI, management, ASA, fibrinolytics, PCI, beta-blocker, family medicine, emergency]
