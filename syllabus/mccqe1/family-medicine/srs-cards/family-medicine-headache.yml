# Family Medicine Headache (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the primary and secondary categories of headache, and which is more common in family medicine?"
    back: "Primary headaches (tension, migraine, cluster) are the most common in family medicine. Secondary headaches are caused by underlying organic disease and account for <10% of all headaches — but may be life-threatening.\n\nSecondary causes must be ruled out before diagnosing a primary headache disorder. Key secondary causes include vascular (SAH, aneurysm), neoplastic, infectious (meningitis), traumatic, and drug-related etiologies."
    difficulty: easy
    tags: [headache, neurology, family-medicine, primary-headache, secondary-headache]
  - front: "What are the POUND criteria for diagnosing migraine?"
    back: "P — Pulsatile quality\nO — Duration Over 4–72 hours\nU — Unilateral\nN — Nausea and vomiting\nD — Disabling intensity\n\nIf ≥4 criteria are present, migraine diagnosis is likely (positive likelihood ratio = 24).\n\nPOUND is a validated clinical screening tool. A positive likelihood ratio of 24 is very high, making it clinically useful for confident diagnosis of migraine in primary care without imaging."
    difficulty: easy
    tags: [migraine, headache, POUND, diagnosis, family-medicine]
  - front: "What are the red flags (SNOOP) in headache evaluation that warrant urgent investigation?"
    back: "S — Systemic symptoms (fever, anticoagulation, pregnancy)\nN — Neurologic signs/symptoms (impaired mental status, focal neurological deficits, neck stiffness)\nO — Onset sudden and severe (thunderclap)\nO — Other associated conditions (following head trauma, awakens from sleep, jaw claudication, temporal artery tenderness)\nP — Prior headache history change (different pattern, progressive worsening)\n\nAlso: new headache after age 50.\n\nRed flag headaches require neuroimaging (CT or MRI) and possibly lumbar puncture to exclude SAH, meningitis, or mass lesion. Thunderclap headache mandates CT head immediately followed by LP if CT is negative."
    difficulty: medium
    tags: [headache, red-flags, SNOOP, neurology, family-medicine]
  - front: "List the causes of secondary headaches by category (vascular, infectious, drug, endocrine, neoplastic, traumatic)."
    back: "Vascular: aneurysm, stroke, SAH, HTN, temporal arteritis\nInfectious: meningitis, encephalitis, abscess\nDrug: withdrawal, medication overuse, side effects, carbon monoxide\nEndocrine: thyroid disease, pheochromocytoma\nNeoplastic: tumour\nTraumatic: TMJ injury, c-spine injury, head injury, subdural hematoma, SAH\nOther: ophthalmological, otolaryngological causes\n\nTemporal arteritis (giant cell arteritis) is a vascular cause especially important in patients >50 with new onset headache and elevated ESR/CRP — can lead to irreversible vision loss if not treated promptly with steroids."
    difficulty: medium
    tags: [headache, secondary-causes, family-medicine]
  - front: "When are investigations indicated in headache, and what are the options?"
    back: "Investigations are indicated only when red flags are present:\n- CBC: for suspected systemic or intracranial infection\n- ESR or CRP: for suspected temporal arteritis\n- Neuroimaging (CT or MRI): to rule out intracranial pathology\n- CSF analysis: for suspected intracranial hemorrhage or infection\n\nRoutine neuroimaging is not indicated for primary headaches without red flags, as it adds cost without improving outcomes. However, suspected temporal arteritis requires urgent ESR/CRP and same-day ophthalmology/rheumatology referral."
    difficulty: medium
    tags: [headache, investigations, temporal-arteritis, family-medicine]
  - front: "What acupuncture evidence exists for migraine prophylaxis?"
    back: "Cochrane meta-analysis of 22 RCTs (n=4,985): acupuncture moderately reduced headache frequency compared to no acupuncture. Acupuncture showed a small but statistically significant reduction vs. sham acupuncture post-treatment and at follow-up. Acupuncture is similarly effective to pharmacological prophylaxis for migraine, and superiority is maintained at follow-up.\n\nAdding acupuncture to symptomatic attack treatment reduces headache frequency. The modest but consistent evidence supports offering acupuncture as a non-pharmacological prophylaxis option for patients who prefer to avoid or cannot tolerate medications such as topiramate or propranolol."
    difficulty: medium
    tags: [migraine, acupuncture, prophylaxis, evidence, family-medicine]
