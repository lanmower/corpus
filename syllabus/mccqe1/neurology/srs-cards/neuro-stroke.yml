  - front: "What did the Women's Health Initiative (WHI) find about combined hormone therapy?"
    back: "WHI (JAMA 2002): Combined estrogen + progesterone in healthy postmenopausal women showed that overall health risks (including breast cancer and CHD) exceeded benefits\n\nThis landmark trial led to significant changes in hormone replacement therapy prescribing - now used at lowest dose for shortest duration for severe symptoms."
