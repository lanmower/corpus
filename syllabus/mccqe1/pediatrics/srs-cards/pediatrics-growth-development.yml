# Pediatrics Growth Development (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "When using WHO Growth Charts, what growth tool is used for premature infants, and until what age is it used?"
    back: "Fenton Curve is used for premature infants (<37 weeks gestation), with corrected gestational age used until 2 years of age\n\nWHO Growth Charts are used for term infants and children. The Fenton Curve is specifically designed to assess growth in preterm infants and allows classification as small for gestational age (SGA) or large for gestational age (LGA). Corrected gestational age (chronological age minus weeks premature) is used until 2 years for all developmental and growth assessments."
    difficulty: easy
    tags: [growth charts, premature infants, Fenton curve, pediatrics]
  - front: "What are the expected average growth parameters for weight in the first 2 years of life?"
    back: "Birth weight ~3.25 kg; gain 20-30 g/day (term neonate); regain birth weight by ~10-14 days; 2x birth weight by 4-5 months; 3x birth weight by 1 year; 4x birth weight by 2 years. Up to 10% weight loss in first 7 days is normal.\n\nNeonatal weight loss of up to 10% in the first 7 days reflects normal physiological fluid loss and is not a sign of failure to thrive as long as birth weight is regained by 10-14 days. The doubling, tripling, and quadrupling milestones are key MCCQE1 facts used to identify failure to thrive."
    difficulty: easy
    tags: [growth parameters, weight, neonatal, pediatrics]
  - front: "At what age does the head circumference grow most rapidly, and what is the rate of growth?"
    back: "Most rapidly in first 3 months: 2 cm/month; then 1 cm/month at 3-6 months; 0.5 cm/month at 6-12 months\n\nHead circumference is measured around the occipital, parietal, and frontal prominences to obtain the greatest circumference. The mean birth head circumference is 35 cm. Rapid early head growth reflects rapid brain development. Deviation from expected growth may suggest microcephaly (e.g., TORCH, genetic) or macrocephaly (e.g., hydrocephalus)."
    difficulty: easy
    tags: [head circumference, growth, neonatal, pediatrics]
  - front: "What are the primitive reflexes and their expected ages of disappearance?"
    back: "Moro: 3-6 months; Galant: 2-3 months; Grasp: 3-4 months; ATNR (asymmetric tonic neck reflex): 4-6 months; Stepping: 2-3 months; Rooting: 2-3 months. Lateral propping does NOT disappear (appears by 6-8 months).\n\nPrimitive reflexes are mediated by the brainstem. Persistence beyond the expected age of disappearance suggests cerebral palsy or other CNS pathology. Absence during the neonatal period, asymmetry, or persistence after 4-6 months are red flags. Babinski's (upgoing plantar) is normal in infants up to 2 years."
    difficulty: medium
    tags: [primitive reflexes, Moro, ATNR, developmental milestones, pediatrics]
  - front: "What are the key developmental red flags at any age for pediatric patients?"
    back: "Loss of previously acquired skills (regression) is a red flag at any age. Other age-specific red flags: not smiling at 4 months; not pointing at 15-18 months; hand preference before 18 months (suggests contralateral weakness); <6 words at 18 months; not seeing or hearing normally.\n\nDevelopmental regression (loss of previously acquired skills) is always concerning regardless of age and warrants urgent evaluation. Hand preference before 18 months may suggest hemiplegia contralateral to the preferred hand. Early identification of developmental delays allows for timely intervention during the critical window of neuroplasticity."
    difficulty: medium
    tags: [developmental red flags, regression, milestones, pediatrics]
  - front: "What are the key developmental milestones at 12 months of age?"
    back: "Gross motor: walks a few steps, wide gait. Fine motor: fine pincer grasp (fingertips), finger-feeds, voluntary release. Language: 1 word with meaning (besides mama/dada), responds to own name, follows 1-step command with gesture. Cognitive: uses objects functionally, cause and effect. Social: points at wanted items.\n\nThe 12-month milestone is critical for MCCQE1. The fine pincer grasp (index finger + thumb tip) replaces the raking/inferior pincer grasp seen at 9 months. One meaningful word other than mama/dada is required. Pointing to show interest (protodeclarative pointing) is a key social-communicative milestone relevant to autism screening."
    difficulty: easy
    tags: [12 months, developmental milestones, pediatrics, language]
  - front: "What are the developmental milestones at 18 months and 24 months of age?"
    back: "18 months: runs, stoops and recovers; tower of 4 blocks, scribbles; 15-25 words; symbolic play; parallel play; 3 body parts. 24 months: jumps on two feet; tower of 6 blocks, established handedness; 2-3 word phrases, 50% intelligible, 50+ words; new problem-solving strategies; testing limits/tantrums.\n\nBy 18 months, children should have at least 15-25 words — fewer than 6 words is a red flag. By 24 months, speech should be 50% intelligible to strangers. Lack of 2-word phrases by 24 months is a red flag. Handedness is established by 24 months — earlier preference may suggest contralateral motor deficit."
    difficulty: medium
    tags: [18 months, 24 months, developmental milestones, pediatrics]
  - front: "What is the definition of failure to thrive (FTT) in children?"
    back: "Weight <3rd percentile, OR weight falling across two major percentile curves on growth chart, OR <80% of expected weight for height and age. Inadequate caloric intake is the most common factor.\n\nFTT is a sign, not a diagnosis. The growth pattern helps identify the underlying cause. Decreased weight with normal height and head circumference suggests caloric insufficiency. Decreased weight and height with normal head circumference suggests structural dystrophies or endocrine disorder. Decreased weight, height, and head circumference suggests intrauterine insult. Management is typically outpatient and multidisciplinary."
    difficulty: medium
    tags: [failure to thrive, FTT, growth, malnutrition, pediatrics]
  - front: "What does the mnemonic SMALL KID represent in the clinical signs of failure to thrive?"
    back: "S - Subcutaneous fat loss; M - Muscle atrophy; A - Alopecia; L - Lagging behind normal milestones; L - Loss of skin turgor; K - Kwashiorkor features (edema); I - Irritability; D - Dermatitis\n\nThe SMALL KID mnemonic summarizes the physical signs of malnutrition in a child with FTT. Kwashiorkor (protein deficiency) presents with edema, hypoalbuminemia, and dermatitis, distinct from marasmus (caloric deficiency) which shows severe wasting without edema. FTT investigations include CBC, electrolytes, T4/TSH, ferritin, calcium, celiac screen, and bone age x-ray."
    difficulty: medium
    tags: [failure to thrive, SMALL KID, malnutrition, kwashiorkor, pediatrics]
  - front: "What pattern of growth parameters suggests intrauterine insult as the cause of failure to thrive?"
    back: "Decreased weight + decreased height + decreased head circumference (all three growth parameters reduced) suggests intrauterine insult (e.g., TORCH infections, placental insufficiency, genetic/chromosomal abnormalities).\n\nThe FTT pattern table distinguishes causes by which growth parameters are affected. Head circumference-sparing (decreased weight/height, normal HC) suggests endocrine or structural causes. When all three parameters are affected (symmetric growth restriction), the insult occurred prenatally affecting overall growth including brain growth. This contrasts with postnatal FTT where head circumference is typically preserved until late stages."
    difficulty: hard
    tags: [failure to thrive, intrauterine growth restriction, head circumference, growth parameters]
  - front: "What are the main categories of etiology for failure to thrive?"
    back: "1. Psychosocial/parent-child interaction issues; 2. Inadequate caloric intake (poor latch, cleft palate, oromotor dysfunction); 3. Inadequate absorption (celiac, IBD, CF, milk protein allergy, biliary atresia); 4. Increased metabolism (CF, chronic infection, hyperthyroidism, asthma, malignancy, renal failure); 5. Increased losses; 6. Increased utilization (chromosomal disorders); 7. Prenatal factors (placental insufficiency, maternal disease/substance use).\n\nFTT etiology is broadly divided into organic and non-organic, though most cases involve an interplay. Psychosocial factors (feeding environment, parent-child attachment, postpartum depression, poverty) are the most common underlying contributors in developed countries. CF is a classic cause of FTT with both malabsorption and increased metabolic demands. All causes require a multidisciplinary approach."
    difficulty: hard
    tags: [failure to thrive, etiology, malabsorption, CF, psychosocial, pediatrics]
  - front: "What are the signs of readiness for toilet training, and at what age do most children achieve daytime bladder control?"
    back: "Toilet readiness signs (usually 18-24 months): ambulating independently, stable on potty, motivated to please/be independent, sufficient expressive and receptive language (2-step commands), can stay dry for several hours, recognizes need to go, can remove clothing. 25% toilet trained by age 2; 98% by age 3. Females generally train earlier than males.\n\nToilet training should be child-led and begin when readiness signs are present. Most children attain bowel control before bladder control (90%). Coercive or premature toilet training is a risk factor for retentive encopresis. A stepwise approach using a potty chair with positive reinforcement is recommended."
    difficulty: easy
    tags: [toilet training, developmental milestones, encopresis, pediatrics]
  - front: "What is the HEEADSSS/SSHADESS assessment used for in pediatric history taking?"
    back: "HEEADSSS (or SSHADESS) is a structured psychosocial history framework used for adolescents. It covers: Home, Education/Employment, Eating, Activities, Drugs, Sexuality, Suicide/Depression, Safety (and Strengths in SSHADESS). It screens for key adolescent risk factors in a systematic, confidential manner.\n\nAdolescent health visits require a structured psychosocial assessment due to the unique risk profile of this age group. HEEADSSS allows clinicians to open conversation about sensitive topics (substance use, sexual activity, mental health, safety). The interview should include confidential time alone with the adolescent to encourage honest disclosure. ITHELPS is another tool covering social determinants: income, transportation, home, education, legal status, personal safety, support."
    difficulty: easy
    tags: [HEEADSSS, adolescent health, psychosocial history, pediatrics]
  - front: "What is the upper-to-lower segment ratio at birth and in adulthood, and what conditions affect it?"
    back: "Newborn: 1.7 (upper > lower). Adult male: 0.9; adult female: 1.0 (lower > upper). INCREASED ratio (short limbs): achondroplasia, short limb syndromes, hypothyroidism, storage diseases. DECREASED ratio (long limbs): Marfan syndrome, Klinefelter syndrome, Kallmann syndrome, testosterone deficiency.\n\nThe upper/lower segment ratio uses the pubic symphysis as midpoint. Upper segment: crown to pubis; lower segment: pubis to floor. Infants are proportionally top-heavy due to large heads and short limbs. With growth, limbs elongate and the ratio falls. Disproportionate short stature (high ratio) vs. disproportionate tall stature (low ratio) helps classify the cause of growth abnormalities."
    difficulty: hard
    tags: [upper lower segment ratio, achondroplasia, Marfan syndrome, growth, pediatrics]
  - front: "What developmental milestone is achieved at 3 years of age?"
    back: "Gross motor: rides tricycle, climbs stairs alternating feet. Fine motor: toilet trained, undresses, draws circle and cross (+). Language: 3-4 word phrases, 'W' questions (why), 200 words, 75% intelligible, 3-step commands. Cognitive: identifies shapes, counts to 3, simple time concepts. Social: cooperative/role play, separates easily, sharing.\n\nAt 3 years, speech should be 75% intelligible to strangers (rising to 100% by 4 years). The ability to draw a circle and then a cross (+) reflects fine motor development. Pretend/cooperative play emerges, distinguishing it from the parallel play of 18-month-olds. The ability to count to 3 and understand simple time concepts reflects cognitive advancement."
    difficulty: easy
    tags: [3 years, developmental milestones, language, fine motor, pediatrics]
  - front: "What are the requirements for Growth Hormone (GH) therapy in pediatric GH deficiency?"
    back: "1. GH deficiency confirmed by 2 different stimulation tests (arginine, glucagon, or insulin); 2. Growth velocity <3rd percentile OR height <3rd percentile; 3. Bone age x-rays showing unfused epiphyses/delayed bone age.\n\nGH therapy is indicated for confirmed GH deficiency (not just short stature) and must be started early to maximize adult height potential. Idiopathic short stature (height <3rd percentile without any identified etiology) is also a recognized indication for GH therapy."
    difficulty: medium
    tags: [pediatrics, growth, GH deficiency, endocrinology, short stature]
  - front: "What is the most common cause of tall stature from a genetic etiology in pediatrics, and what are the key associated syndromes?"
    back: "Genetic causes of tall stature include: Klinefelter syndrome (47,XXY), Marfan syndrome, homocystinuria, and Sotos syndrome. Endocrine causes include Beckwith-Wiedemann syndrome, hyperthyroidism, hypophyseal gigantism, and precocious puberty.\n\nTall stature is defined as height >2 SDs above mean for a given age, sex, and race. Constitutional/familial causes are most common. Genetic syndromes like Marfan and Klinefelter are important to recognize due to associated systemic complications (cardiovascular, cognitive, etc.)."
    difficulty: medium
    tags: [pediatrics, tall stature, Marfan syndrome, Klinefelter syndrome, genetics]
  - front: "What is the normal sequence of pubertal development in males?"
    back: "Onset ages 9–14 years. Usual sequence: 1. Testicular enlargement → 2. Penile enlargement → 3. Pubarche (axillary and facial hair, body odour, mild acne) → 4. Growth spurt (occurs later in boys than girls). Early puberty is uncommon in males (rule out organic causes); late puberty is common and often constitutional.\n\nGynecomastia (transient breast tissue development) occurs in ~50% of males during puberty and is self-limited. Any nipple discharge or fixed mass should be investigated further. The growth spurt occurs later in boys, distinguishing male from female pubertal progression."
    difficulty: easy
    tags: [pediatrics, puberty, testicular enlargement, male development, gynecomastia]
  - front: "What is the definition and epidemiology of precocious puberty?"
    back: "Development of secondary sexual characteristics 2–2.5 SDs before population mean: <8 years in females, <9 years in males. Epidemiology: 1 in 10,000; F > M. Usually idiopathic in females (90%); more suggestive of pathology in males (50%).\n\nThe higher rate of pathological causes in males means boys with precocious puberty require more aggressive investigation. In females, idiopathic/constitutional precocious puberty is most common. Obesity is also a recognized cause of central precocious puberty."
    difficulty: easy
    tags: [pediatrics, precocious puberty, HPG axis, epidemiology]
  - front: "What is the difference between central (GnRH-dependent) and peripheral (GnRH-independent) precocious puberty?"
    back: "Central: GnRH-dependent; hypergonadotropic hypergonadism; premature activation of HPG axis; LH/FSH levels as in normal puberty. DDx: idiopathic (most common in females), obesity, CNS disturbances (tumours, hamartomas, post-meningitis, increased ICP, radiotherapy), NF1, primary severe hypothyroidism. Peripheral: GnRH-independent; hypogonadotropic hypergonadism. DDx: testicular/ovarian tumours, adrenal disorders (CAH, neoplasm), exogenous steroids, McCune-Albright syndrome.\n\nThe key distinction is whether GnRH is the driver. Central precocious puberty responds to GnRH agonists (e.g., leuprolide) which suppress the HPG axis. Peripheral causes require treatment of the underlying source of sex steroids."
    difficulty: hard
    tags: [pediatrics, precocious puberty, central, peripheral, GnRH, McCune-Albright]
  - front: "What is the management of central vs. peripheral precocious puberty?"
    back: "Central: GnRH agonists (e.g., leuprolide) are most effective; goals: preserve final adult height and alleviate psychosocial stress. Peripheral: medications that decrease production of a specific sex steroid or block its effects (e.g., ketoconazole, spironolactone, tamoxifen, anastrozole); surgical intervention as needed.\n\nIndications for medical intervention: rapid advancement of puberty, very early age of onset, risk of compromised final adult height, and psychological effects. GnRH agonists paradoxically suppress gonadotropins when given continuously (versus pulsatile endogenous GnRH)."
    difficulty: medium
    tags: [pediatrics, precocious puberty, leuprolide, GnRH agonist, management]
  - front: "What are the definitions of delayed puberty in males and females?"
    back: "Failure to develop secondary sex characteristics by 2–2.5 SDs beyond population mean. Males: lack of testicular enlargement by age 14. Females: lack of breast development by age 13, OR absence of menarche by age 16, OR absence of menarche within 5 years of pubertal onset. Epidemiology: M > F. Usually constitutional delay in males; more suggestive of pathology in females.\n\nThe most common cause of delayed puberty overall is constitutional delay of growth and puberty (CDGP), especially in males. In females, delayed puberty is less common and more likely to represent an organic etiology such as Turner syndrome or chronic illness."
    difficulty: easy
    tags: [pediatrics, delayed puberty, constitutional delay, menarche]
  - front: "What are the central and peripheral causes of delayed puberty?"
    back: "Central (hypogonadotropic hypogonadism): constitutional delay of HPG axis activation (most common), Kallmann syndrome, hypothalamic/pituitary disorders, chronic illness, hypothyroidism, hyperprolactinemia, poor nutrition, excessive exercise. Peripheral (hypergonadotropic hypogonadism): primary gonadal failure, Turner syndrome, Klinefelter syndrome, androgen insensitivity syndrome, hormone deficiency.\n\nFSH/LH levels distinguish central (low) from peripheral (elevated) causes. Turner syndrome (45,X0) in females and Klinefelter syndrome (47,XXY) in males are key genetic causes. Kallmann syndrome features hypogonadotropic hypogonadism plus anosmia."
    difficulty: hard
    tags: [pediatrics, delayed puberty, hypogonadism, Turner syndrome, Kallmann syndrome]
  - front: "What are the Tanner staging criteria for female breast development?"
    back: "Stage 1: Papilla elevation only (prepubertal). Stage 2: Breast and papilla elevated as small mound, enlargement of areola. Stage 3: Enlargement of breast and areola, no separation of contour. Stage 4: Areola and papilla form secondary mound above level of breast. Stage 5: Mature adult breast; only nipple projects; areola recessed to general contour.\n\nTanner (now called Maturity Rating) staging is used to standardize assessment of pubertal development in pediatrics. It guides timing of investigations for precocious or delayed puberty and is based on external primary and secondary sex characteristics."
    difficulty: easy
    tags: [pediatrics, Tanner staging, breast development, puberty, maturity rating]
  - front: "What are normal growth velocity parameters during puberty for males and females?"
    back: "Prepubertal minimum: 4 cm/year. Growth spurt: males 10–14 cm/year; females 8–12 cm/year. (Males have a later but larger pubertal growth spurt than females.)\n\nGrowth velocity is a key parameter in the assessment of both precocious and delayed puberty. Reduced growth velocity may indicate endocrine pathology, chronic illness, or malnutrition, while accelerated velocity may indicate precocious puberty."
    difficulty: easy
    tags: [pediatrics, growth velocity, puberty, growth spurt]
  - front: "What investigations are included in the initial and secondary workup for precocious puberty?"
    back: "Initial: bone age, serum hormone levels (estradiol, testosterone, LH, FSH, TSH, free T4, DHEA-S, 17-OH-progesterone, prolactin). Secondary: MRI brain, pelvic ultrasound, beta-hCG, GnRH stimulation test, and/or ACTH stimulation test. All boys with precocious puberty should receive brain MRI.\n\nBone age advancement (on wrist X-ray) confirms the effect of sex steroids on skeletal maturation and helps predict final adult height. GnRH stimulation test differentiates central (LH surge) from peripheral (no LH surge) precocious puberty."
    difficulty: medium
    tags: [pediatrics, precocious puberty, bone age, GnRH stimulation, MRI]
  - front: "What is the 'jump start' therapy for constitutional delayed puberty?"
    back: "Low-dose, short-course sex hormone therapy to induce puberty in patients with constitutional delay or GnRH deficiency: cyclic estradiol and progesterone for females; testosterone for males. These patients should be referred to a pediatric endocrinologist for hormone therapy.\n\nConstitutional delay of growth and puberty (CDGP) is the most common cause of delayed puberty, especially in males, and is a diagnosis of exclusion. Jump start therapy is offered to alleviate psychosocial distress and has no significant effect on final adult height."
    difficulty: medium
    tags: [pediatrics, delayed puberty, constitutional delay, testosterone, hormone therapy]
