# Geriatrics (Geriatrics) - generated from srs-mccqe1
cards:
  - front: "An 80-year-old nursing home resident is found on the floor after a fall. What intrinsic and extrinsic risk factors should be assessed, and what is the most important medication class to review?"
    back: "Intrinsic: orthostatic hypotension, visual impairment, gait/balance problems, cognitive impairment, neuropathy, deconditioning. Extrinsic: loose rugs, poor lighting, lack of grab bars. Most important medications: antidepressants (OR 1.68 for falls), followed by neuroleptics (1.59) and sedatives/hypnotics (1.54).\n\nFalls are the most common concern of ambulatory patients >75 years. Multifactorial interventions including medication review, exercise programs (Tai Chi), home hazard modification, and vitamin D supplementation are recommended. The Rockwood Clinical Frailty Scale helps assess vulnerability."
    difficulty: medium
    tags: [geriatrics, falls, polypharmacy, preventive-medicine]
  - front: "What are the four cognitive enhancer medications used for Alzheimer's dementia, and what is their mechanism of action?"
    back: "Donepezil (Aricept), galantamine (Reminyl), rivastigmine (Exelon) - all are acetylcholinesterase inhibitors. Memantine (Ebixa) is an NMDA receptor antagonist. Cholinesterase inhibitors are for mild-moderate dementia; memantine for mild-moderate as well.\n\nCommon side effects of cholinesterase inhibitors include nausea, diarrhea, anorexia, insomnia, and muscle cramps. Bradycardia and heart block are uncommon but important adverse effects. Memantine can cause dizziness, headache, and constipation."
    difficulty: easy
    tags: [geriatrics, neurology, Alzheimer, pharmacology]
  - front: "What is the Cockcroft-Gault formula for estimating creatinine clearance, and why is serum creatinine alone misleading in elderly patients?"
    back: "CrCl (mL/min) = [weight (kg) x (140 - age) x 1.23] / serum creatinine (micromol/L). Multiply by 0.85 for females. Serum creatinine is misleading in elderly because decreased muscle mass produces less creatinine, masking reduced renal function.\n\nA normal serum creatinine in an elderly patient may represent significantly impaired renal function. The formula underestimates CrCl in patients without significant age-related decline and overestimates in those with muscle mass reduced beyond normal aging."
    difficulty: medium
    tags: [geriatrics, nephrology, pharmacology, renal-function]
  - front: "What are the Rome IV diagnostic criteria for constipation, and how many must be present?"
    back: "At least 2 of the following must be present in >1/4 of bowel movements for >3 months (symptom onset ≥6 months prior): straining, hard stools, sensation of incomplete evacuation, use of manual maneuvers, sensation of anorectal obstruction/blockage, or <3 bowel movements per week. Also: loose stools rarely present without laxatives, and IBS criteria not met.\n\nThe Rome IV criteria are the standard diagnostic framework for functional constipation. In older adults, chronic constipation is common (up to 1/3 of patients >65 yr and 1/2 of patients >80 yr). Fecal impaction with overflow diarrhea is an important atypical presentation to recognize in geriatric patients."
    difficulty: easy
    tags: [geriatrics, constipation, GI, Rome IV, diagnosis]
  - front: "Which drugs are commonly associated with constipation in older adults?"
    back: "Opioids; psychotropics (antipsychotics, TCAs); anticholinergics (dimenhydrinate, diphenhydramine, TCAs, antimuscarinics for urinary incontinence); calcium channel blockers; diuretics; supplements (iron, calcium).\n\nMedication review is a crucial step in managing constipation in older adults. Polypharmacy is common in this population and many drug classes slow intestinal motility or affect fluid balance. Reducing or substituting offending agents is a key non-pharmacological intervention."
    difficulty: easy
    tags: [geriatrics, constipation, pharmacology, polypharmacy, adverse drug reactions]
  - front: "What are the alarm symptoms for constipation that warrant urgent investigation?"
    back: "Fever; hematochezia/blood in stool/positive FOBT or FIT; severe nausea/vomiting or abdominal pain; abdominal/rectal mass; obstipation; new bowel habit changes in patients >50 yr; unexplained anemia or iron deficiency; acute onset; constipation unresponsive to treatment; weight loss >5 kg in 6 months; change in stool caliber; family history of colon cancer.\n\nAlarm symptoms ('red flags') indicate possible organic pathology such as colorectal cancer, IBD, or obstruction requiring prompt investigation with colonoscopy or imaging. In older adults, new-onset constipation should always raise suspicion for malignancy."
    difficulty: medium
    tags: [geriatrics, constipation, red flags, colorectal cancer, GI]
  - front: "What metabolic causes of constipation should be considered in older adults?"
    back: "Hypercalcemia, hypothyroidism, hypokalemia, hypomagnesemia.\n\nMetabolic derangements are important reversible causes of constipation in older adults. Hypercalcemia (from malignancy or hyperparathyroidism) and hypothyroidism are particularly relevant in this age group. Electrolyte abnormalities should be checked during workup."
    difficulty: easy
    tags: [geriatrics, constipation, metabolic, electrolytes, thyroid]
  - front: "What is the Confusion Assessment Method (CAM) and what criteria define delirium using this tool?"
    back: "The CAM is a standardized screening tool for delirium. Delirium is likely if criteria 1 AND 2 are present, PLUS either 3 OR 4: (1) Acute onset and fluctuating course; (2) Inattention; (3) Disorganized thinking; (4) Altered level of consciousness.\n\nThe CAM is the most widely validated and used tool for identifying delirium in hospitalized patients. It has high sensitivity and specificity. Recognizing delirium early is critical because it is associated with high morbidity and mortality, especially in older adults."
    difficulty: easy
    tags: [geriatrics, delirium, CAM, diagnosis, cognitive impairment]
  - front: "What are the three subtypes of delirium?"
    back: "Hyperactive, hypoactive, and mixed.\n\nHypoactive delirium is the most commonly missed subtype because patients appear quiet and withdrawn rather than agitated. It is associated with worse outcomes than hyperactive delirium. Mixed delirium fluctuates between hyperactive and hypoactive states."
    difficulty: easy
    tags: [geriatrics, delirium, subtypes, diagnosis]
  - front: "What does the mnemonic 'DIMES' represent in the assessment of delirium precipitants?"
    back: "D – Drugs (prescribed, OTC, overdose, intoxication, withdrawal e.g. alcohol, benzodiazepines, nicotine, cannabis); I – Infection (UTI, pneumonia, skin, bacteremia, CNS); M – Metabolic disturbances (fluid imbalances, electrolyte abnormalities, nutritional deficiencies [B12, B1], hepatic encephalopathy, thyroid disorders); E – Environmental (room changes, lighting, noise); S – Structural insults (cardiovascular, CNS, pulmonary, GI, Foley catheter, urinary retention, constipation).\n\nA systematic approach to identifying delirium precipitants is essential for effective management. Delirium is usually multifactorial in older adults, so addressing multiple contributing factors simultaneously is required. The DIMES framework helps ensure no reversible cause is missed."
    difficulty: easy
    tags: [geriatrics, delirium, DIMES, precipitants, assessment]
  - front: "What are evidence-based non-pharmacological interventions for delirium prevention in hospitalized older adults?"
    back: "Orientation strategies (clocks, calendars, date/time); cognitive stimulation (therapeutic activities, family visitation); sleep enhancement (reduce night interruptions, dim lights, avoid sedatives); early mobilization; adequate nutrition and hydration; optimal prescribing (limit opioids, avoid sedatives/anticholinergics/antipsychotics); correction of sensory deficits (glasses, hearing aids); reduce acute insults (remove Foleys early, monitor for urinary retention and constipation).\n\nNon-pharmacological delirium prevention is the cornerstone of management. Network meta-analyses show that re-orientation programs alongside adequate nutrition, hydration, oxygenation, medication review, and bowel/bladder care are probably effective. Pharmacological agents (antipsychotics) are NOT recommended for routine prevention or treatment of delirium."
    difficulty: medium
    tags: [geriatrics, delirium, prevention, non-pharmacological, hospital]
  - front: "How do you differentiate delirium, dementia, and depression using the 3 Ds framework? Focus on onset, level of consciousness, attention, and natural history."
    back: "Delirium: acute onset (hours-days), fluctuating LOC, impaired attention, reversible with days-weeks course but high morbidity/mortality. Dementia: gradual/stepwise onset, normal LOC (initially), intact attention early, progressive irreversible decline over months-years. Depression: subacute onset (weeks-months), normal LOC, possible reduced concentration, usually reversible.\n\nDistinguishing the 3 Ds is a key clinical skill. Key distinguishing features: delirium is the only one with acutely fluctuating LOC and impaired attention as cardinal features. Dementia raises the risk of subsequent delirium. Depression can mimic dementia ('pseudodementia'). History from an informant is essential to establish baseline cognitive function."
    difficulty: medium
    tags: [geriatrics, delirium, dementia, depression, 3Ds, differential diagnosis, cognitive impairment]
  - front: "What is the current evidence on antipsychotics for treating delirium in hospitalized adults?"
    back: "Systematic review evidence shows NO difference in mortality between haloperidol, second-generation antipsychotics, or placebo. No significant difference between antipsychotic classes. Short-term use does not appear to cause neurological harm but poses a risk of QT prolongation. Current evidence does NOT support routine use of haloperidol or second-generation antipsychotics for delirium management.\n\nDespite common use, antipsychotics have not been shown to reduce duration or severity of delirium or improve outcomes. Pharmacological treatment should be reserved for patients who are a safety risk to themselves or others and when delirium is impeding treatment of the underlying cause. QT prolongation risk must be considered."
    difficulty: medium
    tags: [geriatrics, delirium, antipsychotics, haloperidol, evidence-based medicine, QT prolongation]
  - front: "What are the types of elder abuse recognized under the Canadian Criminal Code?"
    back: "Physical abuse, sexual abuse, emotional/psychological abuse, financial exploitation, and neglect. Elder abuse is a criminal offence under the Criminal Code of Canada.\n\nIn Canada, elder abuse is a significant public health issue. Globally, elder abuse affects approximately 1 in 6 older adults (141 million people). In Canada (2019), approximately 4,518 seniors were victims of police-reported family violence. The most common perpetrators are grown children (34%) and spouses (26%). In Ontario, reporting is mandatory when a resident of a Long-Term Care Home or Retirement Home is involved."
    difficulty: easy
    tags: [geriatrics, elder abuse, Canada, legal, Criminal Code, reporting]
  - front: "What are the risk factors for elder abuse?"
    back: "Situational/social factors: social isolation. Victim characteristics: physical or emotional dependence on caregiver, lack of close family ties, history of family violence, dementia or recent deterioration in health. Perpetrator characteristics: related to victim, dependency on older adult (e.g. financial dependency).\n\nUnderstanding risk factors helps clinicians identify vulnerable patients. Dementia is a particularly important risk factor as it reduces the patient's ability to self-report abuse. Social isolation limits protective oversight. Financial dependency of the perpetrator on the victim is a key risk for financial exploitation."
    difficulty: easy
    tags: [geriatrics, elder abuse, risk factors, dementia, screening]
  - front: "What is the Elder Abuse Suspicion Index (EASI) and what makes a response positive?"
    back: "The EASI is a 6-item questionnaire (Q1-5 asked of patient; Q6 answered by physician). A response of 'yes' on 1 or more of questions 2-6 is considered a positive screen for elder abuse. Q1 asks about dependence on others for ADLs. Q2-5 ask about whether anyone has prevented care, upset/threatened the patient, forced them to sign documents, or made them afraid/touched inappropriately. Q6 is the physician's clinical observation for signs like poor hygiene, malnourishment, or medication compliance issues.\n\nThe EASI was developed and validated in Canadian family medicine settings. It has a sensitivity of 0.47 and specificity of 0.75, with administration time under 2 minutes. A positive screen should prompt referral for further assessment and may involve reporting to authorities or connecting patients with resources like the Older Adults Safety Line or Advocacy Centre for the Elderly."
    difficulty: medium
    tags: [geriatrics, elder abuse, EASI, screening tool, Canada]
  - front: "What is the definition of a fall in geriatric medicine?"
    back: "An event resulting in a person coming to rest inadvertently on a lower level, other than as a consequence of sudden paralysis, epileptic seizure, or overwhelming external force.\n\nThe definition excludes falls due to acute neurological events or overwhelming force. Approximately 20-30% of Canadian adults ≥65 years fall each year, with prevalence increasing with age. Hip fractures are associated with 25% of falls and significant hospitalizations. More than 1/3 of older adults are admitted to LTC after fall-related hospitalization."
    difficulty: easy
    tags: [geriatrics, falls, definition, epidemiology, Canada]
  - front: "What are the three categories of risk factors for falls in older adults?"
    back: "Intrinsic factors: age-related changes and diseases (MSK: arthritis, muscle weakness; sensory: visual, proprioceptive, vestibular; cognitive: depression, dementia, delirium, anxiety; cardiovascular: CAD, arrhythmia, MI, low BP; neurologic: stroke, decreased LOC, gait disturbances; metabolic: glucose, electrolytes) and orthostatic/syncopal causes. Extrinsic factors: environmental hazards (home layout, slippery surfaces, overcrowding), medication side effects, polypharmacy (>4 medications), substance misuse. Situational factors: activities (rushing to toilet, distracted walking).\n\nFalls are multifactorial and require a comprehensive assessment addressing all three categories. Polypharmacy (>4 medications) is a particularly important modifiable extrinsic risk factor. The most implicated drug classes include antidepressants (OR 1.68), neuroleptics/antipsychotics (OR 1.59), sedatives/hypnotics (OR 1.47), and anti-epileptics."
    difficulty: medium
    tags: [geriatrics, falls, risk factors, intrinsic, extrinsic, polypharmacy]
  - front: "Which medication classes have the highest odds ratios for increasing fall risk in older adults?"
    back: "Antidepressants (OR 1.68), neuroleptics/antipsychotics (OR 1.59), sedatives/hypnotics (OR 1.47), anti-epileptics. Also: NSAIDs (OR 1.21), diuretics (OR 1.07), beta-blockers (OR 1.07).\n\nMedication-related falls are a critical target for intervention. Gradual tapering or discontinuation of psychotropic medications is recommended for fall prevention. Antidepressants have the highest fall risk, likely due to orthostatic hypotension, sedation, and anticholinergic effects. This evidence supports deprescribing initiatives in older adults."
    difficulty: medium
    tags: [geriatrics, falls, medications, antidepressants, antipsychotics, deprescribing]
  - front: "What are the key evidence-based interventions for fall prevention in community-dwelling older adults?"
    back: "Muscle strengthening and balance retraining (e.g. Tai Chi); group exercise programs; home hazard assessment and modification with occupational therapy; fitted gait aid; taper/discontinue psychotropic medications; manage postural hypotension and arrhythmias; eyesight optimization (cataract surgery) and footwear optimization; compression socks for venous edema; hip protectors; vitamin D 1000 IU/day if stores are low; calcium optimization (diet + 1200 mg supplement if osteoporosis risk).\n\nMultifactorial, multidisciplinary fall prevention programs are most effective. The global initiative on falls recommends that all older adults should be counselled on falls prevention and physical activity. Opportunistic case-finding for falls is recommended in community-dwelling older adults, and those at high risk should receive a comprehensive multifactorial falls risk assessment."
    difficulty: medium
    tags: [geriatrics, falls, prevention, Tai Chi, vitamin D, osteoporosis, multidisciplinary]
  - front: "What investigations should be ordered in the workup of falls in older adults?"
    back: "Comprehensive Geriatric Assessment (CGA) to identify potential causes. Tailored investigations based on history and physical: CBC, electrolytes, BUN, creatinine, glucose, Ca2+, TSH, vitamin B12, urinalysis, cardiac enzymes, ECG, CT head (as directed by history), coagulation profile. Bone densitometry (DXA) for osteoporosis screening in all women and men >65 years.\n\nThe investigation workup for falls is tailored to identify reversible contributing factors. DXA screening in all patients >65 years reflects Canadian guidelines for osteoporosis screening. Early identification and treatment of osteoporosis reduces fracture risk from future falls. The Timed Up-and-Go Test and orthostatic blood pressure measurement are key physical exam components."
    difficulty: medium
    tags: [geriatrics, falls, investigations, DXA, osteoporosis, CGA]
  - front: "Define frailty in the geriatric medicine context."
    back: "Frailty is a clinically recognizable state of decreased reserve in older adults with increased vulnerability to acute stressors, resulting from functional decline across multiple physiologic systems. It is associated with higher risk of in-hospital death, adverse events, longer length of stay, hospital readmission, and newly dependent status at discharge following critical illness.\n\nFrailty is distinct from normal aging and disability. It represents a state of vulnerability that amplifies the consequences of acute illness or intervention. Recognizing frailty guides prognosis, informs shared decision-making, and identifies patients who may benefit from CGA and targeted interventions."
    difficulty: easy
    tags: [geriatrics, frailty, definition, CGA, prognosis]
  - front: "Describe the Rockwood Clinical Frailty Scale and its 9 categories."
    back: "1-Very Fit: robust, active, exercise regularly. 2-Fit: no active disease but less fit than cat. 1. 3-Managing Well: medical problems well-controlled, not regularly active. 4-Very Mild Frailty: early independence limitation, slowed, easily tired. 5-Mild Frailty: need help with high-order IADLs (finances, transportation, heavy housework). 6-Moderate Frailty: need help with all outside activities and housekeeping, problems with stairs, need help bathing. 7-Severe Frailty: completely dependent for personal care, stable but at risk. 8-Very Severe Frailty: completely dependent for personal care, approaching end of life, cannot recover from minor illness. 9-Terminally Ill: life expectancy <6 months, not otherwise living with severe frailty.\n\nThe Clinical Frailty Scale (Rockwood) is a validated, practical bedside tool for frailty assessment. Scores of 5+ indicate frailty. The scale incorporates both physical and cognitive dimensions. It is used preoperatively, in hospital triage, and for prognosis in critical illness. Scores 7-8 represent the most vulnerable patients."
    difficulty: medium
    tags: [geriatrics, frailty, Rockwood, Clinical Frailty Scale, CGA, assessment]
  - front: "What is the '5 M's Framework' used in geriatric medicine?"
    back: "Mind: mentation, dementia, delirium, depression, chronic pain screening. Mobility: impaired gait and balance, fall injury prevention (exercise, vision evaluation, home safety, OT, calcium and vitamin D). Medications: polypharmacy monitoring, optimal prescribing, deprescribing, adherence, adverse effects. Multimorbidity: bio-psycho-social approach to comorbidities. Matters Most: values and priorities (independence, preventing adverse events, comfort, prolonging life).\n\nThe 5 M's Framework provides a structured, person-centred approach to geriatric assessment. It emphasizes what matters most to the patient as a core domain alongside clinical assessment. This patient-centred approach is essential for shared decision-making and goal-concordant care in older adults."
    difficulty: easy
    tags: [geriatrics, 5Ms, framework, assessment, person-centred care, geriatric assessment]
  - front: "What is a Comprehensive Geriatric Assessment (CGA) and what does evidence show about its effectiveness?"
    back: "CGA is a multidisciplinary, systematic evaluation of older adults addressing medical, functional, cognitive, psychological, and social domains. Evidence: Inpatient CGA increases the likelihood that patients will be alive in their own homes at 3-12 months (RR 1.06, 95% CI 1.01-1.10) and decreases the likelihood of admission to a nursing home at 3-12 months (RR 0.80). For community-dwelling high-risk/frail older adults, CGA resulted in no difference in mortality at 12 months (RR 0.88) but may decrease risk of unplanned hospital admission over 18 months (RR 0.83).\n\nCGA is the gold standard tool in geriatric medicine for comprehensive patient evaluation. Inpatient CGA has the strongest evidence for benefit. Its components include functional assessment (ADLs/IADLs), cognitive and mood assessment, medication review, social assessment, and goal-setting. CGA guides individualized care planning."
    difficulty: medium
    tags: [geriatrics, CGA, comprehensive geriatric assessment, evidence-based medicine, multidisciplinary]
  - front: "What does ABCDETT represent in geriatric functional assessment of ADLs?"
    back: "A – Ambulating; B – Bathing; C – Continence; D – Dressing; E – Eating; T – Transferring; T – Toileting. These are the Basic Activities of Daily Living (BADLs).\n\nADL assessment is fundamental to geriatric evaluation, helping quantify functional status and track decline over time. BADLs reflect basic self-care. IADLs (SHAFT: Shopping, Housework, Accounting/finances, Food preparation, Transportation, Telephone, Taking medications) reflect higher-order independence. Loss of IADLs typically precedes BADL loss in the trajectory of functional decline."
    difficulty: easy
    tags: [geriatrics, ADLs, BADLs, functional assessment, ABCDETT]
  - front: "What does SHAFT represent in geriatric functional assessment of IADLs?"
    back: "S – Shopping; H – Housework; A – Accounting/managing finances; F – Food preparation; T – Transportation; T – Telephone; T – Taking medications. These are the Instrumental Activities of Daily Living (IADLs).\n\nIADLs reflect a higher level of independence than BADLs and are typically the first to be affected in early functional decline. Loss of IADLs is an early indicator of mild frailty (CFS level 5) and dementia. Assessment of IADLs helps guide care planning, including need for home support services and caregiver resources."
    difficulty: easy
    tags: [geriatrics, IADLs, SHAFT, functional assessment, frailty, mild frailty]
  - front: "What physiological changes occur in the neurological system with normal aging?"
    back: "Decreased brain mass and cerebral blood flow; increased white matter changes; reduced number of neurons; reduced action potential speed; reduced reflex response. Functional impact: mild impact on working memory and processing speed, reduced sleep time, reduced fine-motor control.\n\nNormal neurological aging causes mild cognitive changes but should NOT be confused with pathological dementia. Pathological changes occurring more frequently with aging include insomnia, neurocognitive disorders (vascular dementia, Alzheimer's disease), and stroke. Reduced motor strength on neurological exam is NOT expected with normal MSK aging and should prompt investigation."
    difficulty: easy
    tags: [geriatrics, aging physiology, neurological, brain, normal aging]
  - front: "What cardiovascular physiological changes occur with normal aging and what pathological conditions are more common?"
    back: "Physiological: increased LV thickness and stiffness, increased vascular resistance, reduced pacemaker cells, decreased baroreflex and autonomic reflexes, decreased vessel elasticity, decreased cardiac myocyte size and number, decreased beta-adrenergic responsiveness. Functional impact: increased SBP, decreased DBP, HR, CO, wide pulse pressure; heart and blood vessels less responsive to physiological stress. Pathological: atherosclerosis, CAD, MI, CHF, HTN, arrhythmias, orthostatic hypotension.\n\nThe aging cardiovascular system has reduced reserve and compensatory capacity. Wide pulse pressure results from aortic stiffening. Orthostatic hypotension is a direct consequence of impaired baroreflex, and is a major fall risk. These changes explain why older adults are more susceptible to adverse effects of antihypertensives and vasodilators."
    difficulty: medium
    tags: [geriatrics, aging physiology, cardiovascular, orthostatic hypotension, HTN, normal aging]
  - front: "What renal physiological changes occur with normal aging and what are the clinical implications?"
    back: "Physiological: decreased renal mass and number of renal tubules and glomeruli, reduced renal blood flow, reduced nerve density, diminished detrusor function, reduced diurnal antidiuretic hormone. Functional impact: decreased eGFR and concentration ability, increased urine pH, urinary frequency/urgency, nocturia, proteinuria. Pathological: urinary incontinence, BPH, prostate cancer, pyelonephritis, nephrolithiasis, UTI, testicular atrophy, urinary retention. Also: reduced hydroxylation of vitamin D.\n\nDeclining eGFR with aging is the most important pharmacokinetic change for drug dosing in older adults. The Cockcroft-Gault formula uses creatinine clearance (CrCl), which adjusts for age, weight, and sex. Reduced vitamin D hydroxylation (to active 1,25-dihydroxyvitamin D) contributes to osteoporosis risk."
    difficulty: medium
    tags: [geriatrics, aging physiology, renal, eGFR, pharmacokinetics, vitamin D, normal aging]
  - front: "What MSK physiological changes occur with aging and what pathological conditions are more frequent?"
    back: "Physiological: increased calcium loss from bone, decreased muscle mass/sarcopenia, decreased cartilage and synovial fluid lubrication, joint stiffness and reduced joint capsule flexibility. Functional impact: decreased strength (but REDUCED MOTOR STRENGTH ON NEUROLOGICAL EXAM IS NOT EXPECTED — should prompt investigation). Pathological: arthritis, bursitis, osteoporosis, muscle weakness with gait abnormalities, polymyalgia rheumatica.\n\nSarcopenia (age-related muscle loss) is distinct from the frailty syndrome but is a major contributor to falls and disability. The key teaching point is that reduced motor strength on formal neurological examination is NOT a normal age-related finding and requires neurological workup. This distinguishes age-related functional decline from pathological neurological disease."
    difficulty: medium
    tags: [geriatrics, aging physiology, MSK, sarcopenia, osteoporosis, normal aging, neurological exam]
  - front: "What immunological changes occur with aging and what are the clinical consequences?"
    back: "Physiological: decreased antigen-antibody affinity, decreased efficacy of neutrophils and macrophages, decreased numbers of B and T cells (excluding memory B and T cells). Functional impact: reduced response to new pathogens, reduced response to immunizations (need for boosters), blunted fever response, atypical presentation of infections leading to delayed care. Pathological: increased susceptibility to malignancies, infections, and autoimmune conditions.\n\nImmunosenescence has major clinical implications. The blunted fever response means that serious infections (pneumonia, UTI, sepsis) may present with only mild or absent fever in older adults. Delirium, falls, functional decline, or loss of appetite may be the only presenting symptoms of infection. Adequate immunization strategies including boosters for influenza, pneumococcus, and shingles are recommended."
    difficulty: medium
    tags: [geriatrics, aging physiology, immunology, immunosenescence, atypical presentation, infection, vaccination]
  - front: "What endocrine physiological changes occur with normal aging?"
    back: "Increased: NE (norepinephrine), PTH, insulin, vasopressin. Decreased: thyroid and adrenal corticosteroid secretion. Functional impact: impaired stress response. Pathological: increased DM, hypothyroidism.\n\nIncreased PTH with aging contributes to bone loss and osteoporosis, even in the absence of primary hyperparathyroidism. Increased vasopressin with impaired renal concentrating ability increases risk of hyponatremia with SIADH-inducing medications. Impaired cortisol response to stress reduces ability to mount an adequate physiological response to acute illness or surgery."
    difficulty: medium
    tags: [geriatrics, aging physiology, endocrine, PTH, osteoporosis, DM, hypothyroidism]
  - front: "What sensorineural changes occur with normal aging, and what pathological conditions are associated?"
    back: "Eyes: thickened lenses, reduced pupil diameter, increased lipid infiltrates, decreased lacrimal gland secretion → reduced visual acuity, dark adaptation. ENT: reduced saliva, atrophied hair cells, reduced cochlear and inner ear neurons, reduced ossicular articulation → reduced smell and taste, reduced detection of higher frequency sounds (presbycusis — sensorineural hearing loss), reduced vestibular function. Pathological: increased glaucoma, cataracts, macular degeneration, tinnitus, vertigo, oral dryness.\n\nPresbycusis (age-related sensorineural hearing loss) affects high-frequency sounds first and is the most common cause of hearing loss in older adults. Presbyopia (reduced near vision due to lens stiffening) is universal with aging. Both conditions are risk factors for social isolation and cognitive decline. Correcting sensory deficits is a key component of delirium prevention."
    difficulty: easy
    tags: [geriatrics, aging physiology, presbycusis, presbyopia, sensory, hearing, vision, normal aging]
  - front: "What is presbycusis and how does it present?"
    back: "Presbycusis is sensorineural hearing loss associated with aging. It results from atrophy of cochlear hair cells, reduced inner ear neurons, and reduced ossicular articulation. It presents with reduced detection of higher frequency sounds, difficulty hearing in noisy environments, and progressive bilateral hearing impairment.\n\nPresbycusis is the most common cause of hearing loss in older adults and is a major contributor to social isolation, depression, and cognitive decline. A simple in-office whisper test is recommended during geriatric physical examination. Hearing aids are the main treatment and also reduce fall risk by improving environmental awareness and spatial orientation."
    difficulty: easy
    tags: [geriatrics, presbycusis, hearing loss, sensorineural, aging, ENT]
  - front: "What components are included in a focused geriatric physical examination?"
    back: "General/vital signs: weight (cachexia/weight loss), height (vertebral compression fractures), orthostatic vitals (BP and HR). Head/neck: visual acuity, whisper test (hearing), dentition/denture fit, lymphadenopathy. Cardiac: arrhythmias, murmurs, extra heart sounds. Respiratory: auscultation, SOB. Peripheral vascular: arterial/venous insufficiency, edema, ulcers, peripheral pulses. Dermatologic: premalignant/malignant lesions, pressure injuries, foot wounds (diabetes/neuropathy/PVD), unexplained bruises (elder abuse). MSK: range of motion. Gait: footwear, gait aid, systematic gait assessment, Romberg, sit-to-stand, tandem stance/gait. Neurologic: cranial nerves, tone, reflexes, sensation, signs of parkinsonism/tremor, cerebellar testing.\n\nThe geriatric physical exam extends beyond routine examination to include fall-risk assessment (gait, orthostatics), elder abuse screening (unexplained bruises), nutritional assessment (weight/height), and sensory deficits. Height reduction suggests vertebral compression fractures from osteoporosis. The sit-to-stand test and Timed Up-and-Go Test are simple, validated tools for fall risk stratification."
    difficulty: medium
    tags: [geriatrics, physical examination, gait assessment, Romberg, CGA, elder abuse, falls]
  - front: "What psychiatric and cognitive changes are associated with normal aging, and what pathological conditions occur more frequently?"
    back: "Normal aging: decreased processing speed, cognitive flexibility, visuospatial perception, working memory, and divided attention. Loss of synaptic plasticity. Pathological: increased depression, dementia, delirium, suicidality, anxiety, sleep disruption.\n\nNormal cognitive aging involves subtle declines in processing speed and working memory but does NOT include significant memory loss, personality change, or functional impairment. These features indicate pathological cognitive decline. Depression is frequently underdiagnosed in older adults and can mimic dementia. Screening for depression should be part of the geriatric assessment."
    difficulty: easy
    tags: [geriatrics, aging physiology, cognitive, depression, dementia, psychiatric, normal aging]
  - front: "What respiratory physiological changes occur with normal aging and what pathological conditions are more common?"
    back: "Physiological: increased tracheal cartilage calcification, mucous gland hypertrophy; decreased elastic recoil, increased residual volume, reduced vital capacity and FEV1; reduced chest wall compliance. Functional impact: decreased arterial PO2, decreased exercise tolerance, decreased pulmonary reserve. Pathological: COPD, pneumonia, pulmonary embolism.\n\nLoss of elastic recoil increases residual volume and functional residual capacity, resembling obstructive physiology. This explains why older adults have reduced pulmonary reserve and are more susceptible to respiratory failure during acute illness. Decreased exercise tolerance and increased dyspnea on exertion may be partly due to normal aging rather than pathology alone."
    difficulty: easy
    tags: [geriatrics, aging physiology, respiratory, COPD, pulmonary reserve, normal aging]
  - front: "What GI physiological changes occur with normal aging?"
    back: "Increased intestinal villous atrophy. Decreased esophageal peristalsis, gastric acid secretion, liver mass, hepatic blood flow, calcium and iron absorption. Functional impact: reduced B12, calcium, and iron absorption; reduced B12. Pathological: dysphagia, cancer, diverticulitis, constipation, fecal incontinence, hemorrhoids, intestinal obstruction, malnutrition, weight loss.\n\nReduced gastric acid secretion decreases absorption of iron, calcium, and vitamin B12 (which requires intrinsic factor and acidic environment for release from food). This contributes to common nutritional deficiencies in older adults. Decreased esophageal peristalsis increases dysphagia risk and GERD. Liver mass and hepatic blood flow reduction affect first-pass metabolism of medications."
    difficulty: easy
    tags: [geriatrics, aging physiology, GI, malnutrition, B12, calcium, constipation, normal aging]
  - front: "What integumentary changes occur with normal aging and what skin conditions are more common?"
    back: "Physiological: atrophy of sebaceous and sweat glands, decreased epidermal and dermal thickness, dermal vascularity, melanocytes, collagen synthesis, and elastin synthesis. Functional impact: increased skin laxity, wrinkles, stiffness, and easy bruising. Pathological: lentigo, cherry hemangiomas, pruritus, seborrheic keratosis, pressure injuries, skin cancer, onychomycosis, senile purpura, xerosis cutis.\n\nSkin changes in aging have important clinical implications. Easy bruising (senile purpura) can mimic elder abuse — but it is a normal finding in older adults due to loss of dermal support for blood vessels. Reduced sweating impairs thermoregulation and increases heat stroke risk. Pressure injuries are a significant morbidity risk in immobile older adults."
    difficulty: easy
    tags: [geriatrics, aging physiology, skin, integumentary, pressure injuries, senile purpura, normal aging]
  - front: "In Ontario, when is reporting elder abuse mandatory?"
    back: "In Ontario, reporting elder abuse is mandatory when an older adult resides in a Long-Term Care (LTC) Home or a Retirement Home.\n\nThis mandatory reporting requirement applies specifically to institutional settings in Ontario. Unlike child abuse, there is no universal mandatory reporting requirement for elder abuse in community settings in Canada. However, clinicians must still conduct a full safety assessment and offer referrals to community resources. The Older Adults Safety Line (24/7) and Advocacy Centre for the Elderly are key Canadian resources."
    difficulty: easy
    tags: [geriatrics, elder abuse, Ontario, mandatory reporting, LTC, legal, Canada]
  - front: "What management steps should be taken when elder abuse is suspected?"
    back: "1. Assess patient's decision-making capacity regarding any proposed intervention. 2. Address imminent safety. 3. Consider referral to local resources (home care, respite agencies, shelters, legal services, police services, government-supported elder abuse consultants). 4. Create an emergency safety plan. 5. Offer assistance with reporting abuse. 6. In Ontario: mandatory reporting if resident of LTC or Retirement Home.\n\nRespecting autonomy while ensuring safety is a key ethical tension in elder abuse management. Patients with intact decision-making capacity have the right to refuse interventions. Shared decision-making, safety planning, and connecting patients to community resources are priorities. Capacity assessment may require involvement of social work and psychiatry."
    difficulty: medium
    tags: [geriatrics, elder abuse, management, safety, capacity, Ontario, LTC]
