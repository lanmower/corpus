# Neurology Motor Neuron (Neurology) - generated from srs-mccqe1
cards:
  - front: "What is ALS (Amyotrophic Lateral Sclerosis)? Describe its UMN and LMN clinical features."
    back: "ALS (Lou Gehrig's disease): progressive neurodegenerative disease affecting both UMN and LMN, ultimately fatal.\n\nUMN symptoms:\n- Poor dexterity, spasticity (spastic gait)\n- Hyperreflexia\n- Bulbar: dysarthria (spastic, strained slow speech), dysphagia, pseudobulbar affect, laryngospasm\n\nLMN symptoms:\n- Weakness (hands, arms, tongue, pharynx, diaphragm)\n- Muscle atrophy\n- Fasciculations\n- Muscle cramps\n- Bulbar: dysarthria (flaccid, slurred, nasal quality), dysphagia\n\nCognitive/behavioural dysfunction and FTD in ~15%\n\nThe combination of UMN and LMN signs in the same patient is the diagnostic hallmark of ALS. Sensory symptoms are uncommon (20-30%). Most common genetic cause is C9orf72 mutation (familial ALS accounts for 5-10%). EMG shows denervation (fibrillations, positive sharp waves) and reinnervation (increased amplitude/duration motor units)."
    difficulty: easy
    tags: [ALS, amyotrophic lateral sclerosis, motor neuron disease, UMN, LMN]
  - front: "What are the two disease-modifying treatments for ALS and their mechanisms?"
    back: "1. Riluzole: slows disease progression and prolongs survival; mechanism: reduces glutamate-mediated excitotoxicity\n2. Edaravone: shown to slow functional decline by 33% in early-stage ALS; mechanism: free radical scavenger\n\nNon-pharmacologic: BiPAP (ventilatory support improves survival), PEG tube for nutritional support.\n\nRiluzole is the original disease-modifying therapy shown in trials to extend survival. Edaravone benefit was shown in a 2017 RCT (Lancet Neurology) in carefully selected early-stage patients meeting stringent inclusion criteria. BiPAP is also shown to improve survival. Median survival is 3 years, with death typically from respiratory failure."
    difficulty: medium
    tags: [ALS, riluzole, edaravone, motor neuron disease, treatment, BiPAP]
  - front: "Differentiate Progressive Muscular Atrophy, Primary Lateral Sclerosis, and Progressive Bulbar Palsy."
    back: "Progressive Muscular Atrophy (progressive bulbar palsy):\n- Only LMN symptoms, asymmetric weakness\n- Isolated LMN version of ALS; 5-10% of ALS centre patients\n\nPrimary Lateral Sclerosis:\n- Only UMN symptoms\n- Later onset, not fatal, variable disability\n- Isolated UMN version of ALS; 5-10% of ALS centre patients\n\nProgressive Bulbar Palsy:\n- Both UMN and LMN disorder of cranial muscles\n- Prominent bulbar symptoms (dysarthria, dysphagia)\n\nThese are considered variants on the ALS spectrum. Prognosis is better for PMA and PLS than classic ALS. Progressive bulbar palsy has prominent cranial nerve involvement and significant impact on communication and swallowing."
    difficulty: medium
    tags: [motor neuron disease, progressive muscular atrophy, primary lateral sclerosis, progressive bulbar palsy, ALS variants]
