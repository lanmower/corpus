  - front: "What is the treatment for herpes genitalis in pregnancy with primary infection?"
    back: "Acyclovir 400 mg PO TID x7-10 days OR valacyclovir 1g PO BID x7-10 days\n\nTreatment of primary HSV in pregnancy is recommended to reduce viral shedding and risk of transmission."
