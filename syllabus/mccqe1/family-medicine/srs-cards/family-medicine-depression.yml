# Family Medicine Depression (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the PHQ-2 screening questions for depression, and what score triggers use of the PHQ-9?"
    back: "PHQ-2 questions (over past 2 weeks): 1. 'How often have you been bothered by little interest or pleasure in doing things?' 2. 'How often have you been bothered by feeling down, depressed, or hopeless?' Each scored 0–3; total score out of 6. A score of ≥3 is considered positive → proceed to PHQ-9 for full diagnostic evaluation. The Canadian Task Force on Preventive Health Care (2013) recommends NOT routinely screening for depression in the general population.\n\nPHQ-9 screens for and monitors all 9 DSM criteria for major depressive disorder. GDS (Geriatric Depression Scale) is used for the elderly population. At least 5 out of 9 criteria (including anhedonia or depressed mood for >2 weeks) must be met for diagnosis. Early diagnosis and treatment improve outcomes."
    difficulty: easy
    tags: [depression, PHQ-2, PHQ-9, screening, family medicine, Canadian guidelines]
  - front: "What are the phases of depression treatment and their durations?"
    back: "1. Acute phase (8–12 weeks): relieve symptoms, improve quality of life; counsel on risks (sexual side effects, discontinuation syndrome). 2. Maintenance phase (6–12 months after symptom resolution): prevent relapse/recurrence; stress importance of continuing medication for full duration.\n\nTwo-thirds of patients may not receive appropriate treatment for depression. Stopping antidepressants too early (when the patient 'feels better') is the most common cause of relapse. Combination therapy (pharmacotherapy + psychotherapy) is synergistic and most effective, showing significantly greater improvements than medications alone (OR 1.86, 95% CI 1.38–2.52)."
    difficulty: easy
    tags: [depression, treatment phases, antidepressants, maintenance, family medicine]
  - front: "What is the first-line SSRI for depression in youth (ages 10–21), and what monitoring is required?"
    back: "Fluoxetine is first-line among SSRIs in youth (most evidence). For mild depression: a period of active support and monitoring before initiating treatment is recommended. Monitor closely for adverse effects including suicidal ideation and behavior. Psychotherapy (CBT or IPT alone) can be used for mild depression. Psychotherapy plus medication for moderate to severe depression. Reassess and refer if no improvement after 6–8 weeks. Consider referral for adolescents with moderate/severe depression + psychosis or substance misuse.\n\nThe increased risk of suicidal ideation with antidepressants in youth (not actual suicide) is a black box warning in Canada and the US. This risk is highest in the first 1–4 weeks of therapy. Despite this, untreated depression carries its own significant suicide risk. Regular monitoring (especially in the first month) is essential."
    difficulty: medium
    tags: [depression, youth, fluoxetine, SSRI, suicidal ideation, pediatrics, family medicine]
  - front: "What must be ruled out before diagnosing depression, and what medical conditions can cause depressive symptoms?"
    back: "Must rule out: suicidal/homicidal ideation, psychosis, substance use/misuse/withdrawal, bipolar/manic/hypomanic episodes, postpartum depression. Medical causes: Cancer (especially oropharyngeal, lung, pancreas — 50% develop depression before cancer diagnosis), chronic fatigue syndrome, early dementia, endocrine (hypo/hyperthyroidism, DM, adrenal disorders), infections (mononucleosis), liver/renal failure, medication side effects (beta-blockers, benzodiazepines, glucocorticoids, interferon), menopause, neurological (Parkinson's, MS), vitamin deficiency (pernicious anemia, pellagra).\n\nPancreatic cancer is classically associated with depression presenting before the cancer is diagnosed — a high-yield MCCQE1 fact. Hypothyroidism mimics depression very closely (fatigue, weight gain, psychomotor slowing, low mood). TSH should be checked in all new presentations of depression."
    difficulty: medium
    tags: [depression, differential diagnosis, medical causes, pancreatic cancer, hypothyroidism, family medicine]
  - front: "What is Form 1 in Ontario and under what circumstances is it completed by a physician?"
    back: "Form 1 is an application by a physician to hospitalize a patient against their will for psychiatric assessment for up to 72 hours. It is completed when a patient with depression (or other psychiatric condition) is deemed high-risk for suicide or homicide.\n\nForm 1 is used under the Ontario Mental Health Act. It allows involuntary psychiatric assessment but NOT treatment — the patient still has the right to refuse treatment after assessment. After 72 hours, the patient must be further certified (Form 3) for continued involuntary admission if necessary. This is an Ontario-specific legal instrument important for the MCCQE1."
    difficulty: easy
    tags: [Form 1, involuntary hospitalization, depression, suicidal ideation, Ontario, mental health act, family medicine]
