  - front: "What are the potential harms of PSA screening that outweigh benefits?"
    back: "Bleeding, infection, urinary incontinence, false positive results, and overdiagnosis\n\nPSA screening can lead to unnecessary procedures and treatments with significant complications, while the mortality benefit is at best marginal."
