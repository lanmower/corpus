# Ob Labour Stages (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What are the signs indicating placental separation during the third stage of labour?"
    back: "1. Gush of fresh blood\n2. Umbilical cord lengthening\n3. Uterine fundus becoming firm and globular\n4. Uterine fundus rising upward\n\nThese four signs collectively indicate placental separation from the uterine wall. Recognition is important as the third stage (delivery of placenta) can last up to 30 minutes before intervention is indicated. Active management with oxytocin reduces PPH risk by >40%."
    difficulty: easy
    tags: [obstetrics, labour, third stage, placenta, postpartum hemorrhage]
  - front: "What is the active management of the third stage of labour and what is its benefit?"
    back: "Administration of oxytocin 10 IU IM or 5 mg IV push (or IV drip) after delivery of the anterior shoulder (or after placental delivery). Benefit: reduces risk of PPH by >40%.\n\nActive management of the third stage of labour with oxytocin is standard of care in Canada. It can be given after delivery of the anterior shoulder in anticipation of placental delivery, or after the placenta is delivered. Routine oxytocin in the third stage significantly reduces postpartum hemorrhage risk."
    difficulty: easy
    tags: [obstetrics, labour, third stage, oxytocin, PPH prevention]
  - front: "What monitoring occurs in the fourth stage of labour?"
    back: "- Monitor vital signs and bleeding\n- Repair lacerations\n- Ensure uterus is contracted (palpate uterus, monitor uterine bleeding)\n- Inspect placenta for completeness and umbilical cord for 2 arteries and 1 vein\n\nThe fourth stage of labour is the first postpartum hour, and is considered the most dangerous period for the mother along with the third stage due to risk of hemorrhage. Ensuring the uterus is contracted and placenta is complete prevents PPH. A single umbilical artery may indicate fetal anomalies."
    difficulty: easy
    tags: [obstetrics, labour, fourth stage, postpartum, monitoring]
