# Gynecology Oncology (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What did the PORTEC-3 trial conclude about adjuvant therapy for high-risk endometrial cancer?"
    back: "For women with stage 3 or serous endometrial cancers, chemoradiotherapy should be recommended over radiotherapy alone, with improved 5-year overall survival (81.4% vs. 76.1%) and failure-free survival (76.5% vs. 69.1%).\n\nPORTEC-3 (Lancet 2019) was a randomized phase 3 trial comparing adjuvant chemoradiotherapy vs. pelvic radiotherapy alone in high-risk endometrial cancer. Distant metastases were reduced in the chemoradiotherapy group (78/330 vs. 98/330). This trial established the standard of combined adjuvant therapy for high-risk endometrial cancer."
    difficulty: hard
    tags: [gynecology, endometrial-cancer, chemoradiotherapy, landmark-trial, PORTEC-3]
  - front: "What did the LACC trial demonstrate about surgical approach for early-stage cervical cancer?"
    back: "Minimally invasive radical hysterectomy (laparoscopic/robotic) was associated with lower disease-free survival (86% vs. 96.5% at 4.5 years) and lower overall survival compared to open abdominal radical hysterectomy.\n\nThe LACC trial (NEJM 2018) included patients with stage IA1, IA2, or IB1 cervical cancer. Despite the appeal of minimally invasive surgery, open surgery was significantly superior in both disease-free and overall survival. This landmark trial changed practice, leading to open surgery being preferred for cervical cancer radical hysterectomy."
    difficulty: hard
    tags: [gynecology, cervical-cancer, radical-hysterectomy, minimally-invasive, LACC-trial]
  - front: "What did the LION trial conclude about lymphadenectomy in advanced ovarian cancer?"
    back: "Pelvic and para-aortic lymphadenectomy in patients with advanced ovarian cancer who underwent macroscopically complete resection and had clinically negative nodes did NOT improve overall survival and increased complication rates.\n\nThe LION trial (NEJM 2019) randomized patients with advanced epithelial ovarian cancer after complete resection with negative lymph nodes to lymphadenectomy vs. no lymphadenectomy. Median OS was 65.5 months vs. 69.2 months (no benefit). Repeat laparotomy was higher in the lymphadenectomy group (12.4% vs. 6.5%). This changed practice by eliminating routine lymphadenectomy in this setting."
    difficulty: hard
    tags: [gynecology, ovarian-cancer, lymphadenectomy, landmark-trial, LION]
