# Psychiatry Anxiety (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What is the definition and pathophysiology of anxiety disorders?"
    back: "Pathological fear (anxiety) occurs when: fear is greatly out of proportion to the threat, response continues beyond the existence of the threat, or social/occupational functioning is impaired. Physiologically: the amygdala is the main brain structure involved; neurotransmitters include 5-HT, cholecystokinin, epinephrine, norepinephrine, and DA. Behaviourally: avoidance perpetuates the fear-avoidance cycle.\n\nUnderstanding the anxiety fear-avoidance cycle is crucial for explaining why exposure-based CBT is effective — graduated exposure prevents avoidance reinforcement and allows extinction learning. The amygdala's central role makes it a target for pharmacological intervention (e.g., SSRIs modulate 5-HT input to amygdala)."
    difficulty: easy
    tags: [psychiatry, anxiety, pathophysiology, amygdala]
  - front: "What medical conditions can cause or mimic anxiety disorders?"
    back: "Cardiovascular: post-MI, arrhythmia, CHF, pulmonary embolus, mitral valve prolapse. Respiratory: asthma, COPD, pneumonia. Endocrine: hyperthyroidism, hypoglycemia, hyperadrenalism, hyperparathyroidism. Metabolic: B12 deficiency, folate deficiency, porphyria, hypoxemia, hypercalcemia. Neurologic: neoplasm, vestibular dysfunction, encephalitis, trauma, MS, temporal lobe epilepsy, migraine. Infectious: meningitis, HIV, syphilis. GI: gastritis, esophageal spasm. Substance-induced: intoxication (caffeine, cannabis, amphetamines, cocaine) or withdrawal (benzodiazepines, alcohol).\n\nThe differential diagnosis of anxiety disorders is broad. A thorough medical workup is required before attributing anxiety to a primary psychiatric cause. Hyperthyroidism and pheochromocytoma are classic 'great mimickers' of panic disorder."
    difficulty: medium
    tags: [psychiatry, anxiety, differential diagnosis, organic causes]
  - front: "What are the DSM-5 diagnostic criteria for Panic Disorder?"
    back: "A. Recurrent unexpected panic attacks — abrupt surge of intense fear peaking within minutes with ≥4 of: palpitations/tachycardia, sweating, trembling, shortness of breath, choking, chest pain, nausea/abdominal distress, dizziness/lightheadedness, chills/heat sensations, paresthesias, derealization/depersonalization, fear of losing control/'going crazy,' fear of dying. B. ≥1 attack followed by ≥1 month of: persistent worry about additional attacks OR significant maladaptive behavioural change related to attacks. Mnemonic: STUDENTS FEAR the 3 Cs (Sweating, Trembling, Unexpected, Derealization/depersonalization, Excessive heart rate/palpitations, Nausea, Tingling, Shortness of breath; Fear of dying/losing control; 3 Cs: Chest pain, Chills/hot flashes, Choking).\n\nPanic disorder is characterized by the unexpectedness of attacks and the persistent concern about future attacks (anticipatory anxiety). The catastrophic misinterpretation of somatic symptoms (e.g., interpreting palpitations as a heart attack) perpetuates the cycle."
    difficulty: medium
    tags: [psychiatry, panic disorder, DSM-5, panic attacks]
  - front: "What is the medical workup for anxiety disorders?"
    back: "Recommended routine screening: vitals, physical exam, CBC, electrolytes, thyroid function test (TSH), glucose, ECG. Additional screening (as needed): extended electrolytes, vitamin B12, B-HCG, folate, chest X-ray, and other tests per differential diagnosis.\n\nThyroid function testing is essential given that hyperthyroidism can present identically to panic disorder or generalized anxiety disorder. ECG is important to rule out cardiac arrhythmias, which can cause palpitations and be misattributed to anxiety."
    difficulty: easy
    tags: [psychiatry, anxiety, workup, investigations]
