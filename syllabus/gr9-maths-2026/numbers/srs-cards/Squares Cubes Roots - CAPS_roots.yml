# Gr 9 Maths CAPS — numbers / Squares Cubes Roots
deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
notes:
  - guid: a1f3c9e027b46d58
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "What does it mean to square a number? Give the meaning of 7² and its value."
      Back: "Squaring means multiplying a number by itself.\n7² = 7 × 7 = 49\nThe small raised 2 is the exponent. ∴ '7 squared' = 49.\nMistake to avoid: 7² is NOT 7 × 2 = 14."
    tags: ["squaring", "subject:numbers"]
  - guid: b7d20e4a91c8f635
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "List the perfect squares from 1² to 12²."
      Back: "1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144.\nThese come from 1², 2², 3², ... 12².\nKnowing these by heart makes root and estimation questions fast in exams."
    tags: ["perfect-squares", "subject:numbers"]
  - guid: c3e81b07d2a4956f
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "What does the square root symbol √ mean? Find √81."
      Back: "√ asks: which positive number, multiplied by itself, gives the number inside?\n√81 = 9 because 9 × 9 = 81.\nSquare root is the inverse (opposite) of squaring."
    tags: ["square-roots", "subject:numbers"]
  - guid: d9a4f7c1e308b562
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "What does it mean to cube a number? Give the meaning of 4³ and its value."
      Back: "Cubing means using a number as a factor three times.\n4³ = 4 × 4 × 4 = 64\nThe exponent 3 shows three factors. ∴ '4 cubed' = 64.\nMistake to avoid: 4³ is NOT 4 × 3 = 12."
    tags: ["cubing", "subject:numbers"]
  - guid: e1c5072d9b4af836
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "List the perfect cubes from 1³ to 6³ (and give 10³)."
      Back: "1³ = 1, 2³ = 8, 3³ = 27, 4³ = 64, 5³ = 125, 6³ = 216.\nAlso useful: 7³ = 343, 8³ = 512, 9³ = 729, 10³ = 1000.\nMemorise these for cube-root questions."
    tags: ["perfect-cubes", "subject:numbers"]
  - guid: f4b80e62a17d39c5
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "What does the cube root symbol ∛ mean? Find ∛125."
      Back: "∛ asks: which number, used three times as a factor, gives the number inside?\n∛125 = 5 because 5 × 5 × 5 = 125.\nCube root is the inverse of cubing."
    tags: ["cube-roots", "subject:numbers"]
  - guid: 0a7c3e9162d4b8f5
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Method: How do you use prime factorisation to find a square root? Demonstrate with √576."
      Back: "Steps:\n1. Prime factorise: 576 = 2⁶ × 3².\n2. Pair the prime factors (or halve each exponent).\n3. Take ONE factor from each pair.\n√576 = 2³ × 3¹ = 8 × 3 = 24.\nCheck: 24 × 24 = 576. ✓"
    tags: ["prime-factorisation", "subject:numbers"]
  - guid: 1b8d4f0273e5c9a6
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Use prime factorisation to find √324."
      Back: "324 = 2² × 3⁴.\nHalve each exponent: 2¹ × 3² = 2 × 9 = 18.\n∴ √324 = 18.\nCheck: 18² = 324. ✓"
    tags: ["prime-factorisation", "subject:numbers"]
  - guid: 2c9e5a1384f6d0b7
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Method: How do you use prime factorisation to find a cube root? Demonstrate with ∛1728."
      Back: "Steps:\n1. Prime factorise: 1728 = 2⁶ × 3³.\n2. Group factors in threes (or divide each exponent by 3).\n3. Take ONE factor from each group of three.\n∛1728 = 2² × 3¹ = 4 × 3 = 12.\nCheck: 12 × 12 × 12 = 1728. ✓"
    tags: ["prime-factorisation", "subject:numbers"]
  - guid: 3d0f6b2495a7e1c8
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Use prime factorisation to find ∛3375."
      Back: "3375 = 3³ × 5³.\nDivide each exponent by 3: 3¹ × 5¹ = 3 × 5 = 15.\n∴ ∛3375 = 15.\nCheck: 15³ = 3375. ✓"
    tags: ["prime-factorisation", "subject:numbers"]
  - guid: 4e1a7c3506b8f2d9
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Why pair factors for square roots but group in threes for cube roots?"
      Back: "A square root undoes an exponent of 2, so each pair of identical primes contributes ONE factor.\nA cube root undoes an exponent of 3, so each group of three identical primes contributes ONE factor.\nRule: divide every exponent by 2 (square root) or by 3 (cube root)."
    tags: ["prime-factorisation", "subject:numbers"]
  - guid: 5f2b8d4617c9a3e0
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Method: How do you estimate √50 without a calculator (between which integers)?"
      Back: "Find the nearest perfect squares either side of 50: 49 = 7² and 64 = 8².\nSince 49 < 50 < 64, we know 7 < √50 < 8.\n√50 ≈ 7,07 (closer to 7, since 50 is close to 49).\nAnswer: √50 lies between 7 and 8."
    tags: ["estimating-roots", "subject:numbers"]
  - guid: 6a3c9e5728d0b4f1
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Between which two integers does √90 lie? Explain."
      Back: "Nearest perfect squares: 81 = 9² and 100 = 10².\n81 < 90 < 100, so 9 < √90 < 10.\n√90 ≈ 9,49.\n∴ √90 lies between 9 and 10."
    tags: ["estimating-roots", "subject:numbers"]
  - guid: 7b4d0f6839e1c5a2
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Between which two integers does ∛100 lie? Explain."
      Back: "Nearest perfect cubes: 64 = 4³ and 125 = 5³.\n64 < 100 < 125, so 4 < ∛100 < 5.\n∛100 ≈ 4,64.\n∴ ∛100 lies between 4 and 5."
    tags: ["estimating-roots", "subject:numbers"]
  - guid: 8c5e1a794af2d6b3
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "How do you square a fraction? Work out (2/3)²."
      Back: "Square the numerator AND the denominator separately.\n(2/3)² = 2²/3² = 4/9.\nMistake to avoid: do NOT square only the top. (2/3)² ≠ 4/3."
    tags: ["fractions-decimals", "subject:numbers"]
  - guid: 9d6f2b805ba3e7c4
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "How do you find the square root of a fraction? Work out √(9/16)."
      Back: "Take the square root of the numerator and denominator separately.\n√(9/16) = √9/√16 = 3/4.\nCheck: (3/4)² = 9/16. ✓"
    tags: ["fractions-decimals", "subject:numbers"]
  - guid: ae70c3916cb4f8d5
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "How do you cube a fraction? Work out (1/2)³."
      Back: "Cube the numerator and the denominator.\n(1/2)³ = 1³/2³ = 1/8.\nThe cube of ½ is ⅛."
    tags: ["fractions-decimals", "subject:numbers"]
  - guid: bf81d4a27dc509e6
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "How do you square a decimal? Work out 0,3²."
      Back: "0,3² = 0,3 × 0,3 = 0,09.\nTip: there is one decimal place in 0,3, so the answer has two decimal places.\nMistake to avoid: 0,3² is NOT 0,9."
    tags: ["fractions-decimals", "subject:numbers"]
  - guid: c092e5b38ed61af7
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Find √0,64 and explain the decimal places."
      Back: "√0,64 = 0,8 because 0,8 × 0,8 = 0,64.\nThink: 64 = 8², and matching the decimal places gives 0,8.\nCheck: 0,8² = 0,64. ✓"
    tags: ["fractions-decimals", "subject:numbers"]
  - guid: d1a3f6c49fe70b58
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Order of operations with roots: evaluate √(36 + 64)."
      Back: "A root acts like a bracket — simplify INSIDE first.\n√(36 + 64) = √100 = 10.\nMistake to avoid: √36 + √64 = 6 + 8 = 14 is WRONG. √(a + b) ≠ √a + √b."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: e2b4a7d5a0f81c69
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Evaluate using order of operations: 3² + ∛27 × 2."
      Back: "Powers and roots first, then × ÷, then + −.\n3² = 9 and ∛27 = 3.\n= 9 + 3 × 2\n= 9 + 6 (multiply before add)\n= 15."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: f3c5b8e6b1092d70
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Evaluate: √144 − 2³ + 5²."
      Back: "Roots and powers first:\n√144 = 12, 2³ = 8, 5² = 25.\n= 12 − 8 + 25\n= 4 + 25\n= 29.\nWork left to right for + and −."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: 04d6c9f7c21a3e81
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Squares Cubes Roots"
    fields:
      Front: "Common error check: is √(a²) related to a? And does (−5)² differ from −5²?"
      Back: "√(a²) = a for positive a (e.g. √(7²) = 7).\n(−5)² = (−5) × (−5) = 25 (brackets square the sign too).\n−5² = −(5²) = −25 (only the 5 is squared).\n∴ (−5)² ≠ −5²."
    tags: ["common-mistakes", "subject:numbers"]
