# Urology Pediatric (Urology) - generated from srs-mccqe1
cards:
  - front: "What is antenatal hydronephrosis and what are its causes?"
    back: "Antenatal hydronephrosis is dilation of the fetal renal collecting system detected on U/S (1-5% of fetal U/S). Causes: transient primary hydronephrosis, UPJ obstruction, vesicoureteral reflux (VUR), UVJ obstruction/megaureter, ureterocele, ectopic ureter, megacystitis (posterior urethral valves, Prune Belly syndrome).\n\nMajority of antenatal hydronephroses resolve during pregnancy or within the first year of life. ABx prophylaxis at birth is controversial but may benefit high-grade hydronephrosis with dilated ureter or bladder abnormality (amoxicillin, cephalexin, or trimethoprim)."
    difficulty: medium
    tags: [urology, antenatal hydronephrosis, pediatric urology, UPJ obstruction, VUR]
  - front: "What are the SFU grades of hydronephrosis?"
    back: "Grade 0: no dilation, calyceal walls opposed. Grade 1 (mild): dilation of renal pelvis only. Grade 2 (mild): dilation of pelvis and some calyces, pelvicalyceal pattern retained, no parenchymal atrophy. Grade 3 (moderate): moderate dilation of pelvis and calyces, thinning/blunting of fornices, flattening of papillae. Grade 4 (severe): gross dilation of pelvis and calyces with parenchymal thinning.\n\nSFU (Society for Fetal Urology) grading is based on ultrasound and should be supplemented with UTD (Urinary Tract Dilation) classification. Higher grades have worse prognosis and are less likely to resolve spontaneously."
    difficulty: medium
    tags: [urology, hydronephrosis, SFU grading, pediatric urology, ultrasound]
  - front: "What is posterior urethral valves (PUV) and how does it present across different ages?"
    back: "PUV: most common congenital obstructive urethral lesion in male infants due to abnormal mucosal folds at the distal prostatic urethra. Antenatal: bilateral hydronephrosis, distended bladder, oligohydramnios. Neonatal (recognized): palpable abdominal mass, urinary ascites, respiratory distress, weak urinary stream. Neonatal (not recognized): urosepsis, dehydration, electrolyte abnormalities, failure to thrive. Toddlers: UTIs, voiding dysfunction. School-aged: urinary incontinence.\n\nPUV 'keyhole sign' on prenatal U/S = dilated posterior urethra. VCUG shows dilated/elongated posterior urethra and trabeculated bladder. Treatment: immediate catheterization then cystoscopic resection; vesicostomy if resection not possible. Associated with renal dysplasia and secondary VUR."
    difficulty: medium
    tags: [urology, posterior urethral valves, PUV, pediatric, obstructive uropathy, keyhole sign]
  - front: "What is UPJ obstruction? How does it present and how is it treated?"
    back: "UPJ (ureteropelvic junction) obstruction is the most common congenital defect of the ureter; M:F=2:1, up to 40% bilateral. Etiology: adynamic ureteral segment, stenosis, strictures, extrinsic compression, aberrant blood vessels. Presentation: infants (abdominal mass, UTI), children (pain, vomiting, failure to thrive), adolescents/adults (Dietl's crisis—episodic pain after alcohol/high fluid intake). Treatment: surgical pyeloplasty; consider nephrectomy if <15% differential renal function.\n\nDietl's crisis is episodic UPJ obstruction triggered by increased diuresis (e.g., after alcohol). Investigation: antenatal serial U/S, postnatal renal scan with furosemide (MAG3 or DMSA). Pyeloplasty has >90% success rate."
    difficulty: medium
    tags: [urology, UPJ obstruction, pediatric urology, Dietls crisis, pyeloplasty]
  - front: "What is vesicoureteral reflux (VUR), and how is it graded?"
    back: "VUR: retrograde passage of urine from bladder through UVJ into ureter. Grading: Grade I—ureters only fill. Grade II—ureters and pelvis fill. Grade III—ureters and pelvis fill with some calyceal filling, mild dilation. Grade IV—moderate dilation/tortuosity of ureters and pelvis. Grade V—ureters, pelvis, and calyces fill with gross dilation and tortuous ureters.\n\nPrimary VUR: incompetent UVJ (short submucosal segment). Secondary VUR: high intravesical pressure from PUV or neuropathic bladder. Risk factors: white race, female gender, age <2 years, genetic predisposition. Higher grades associated with renal scarring. Diagnosed with VCUG."
    difficulty: medium
    tags: [urology, VUR, vesicoureteral reflux, grading, pediatric urology, VCUG]
