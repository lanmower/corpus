# Nephrology Esrd (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What are the three components of the presentation of End Stage Renal Disease (ESRD)?"
    back: "1. Volume overload: weight gain from fluid retention, HTN, pulmonary/peripheral edema, orthopnea (due to increased total body Na⁺). 2. Electrolyte abnormalities: high K⁺, high PO₄³⁻; low Ca²⁺ (decreased vitamin D activation + hyperphosphatemia + hypoalbuminemia), low HCO₃⁻ (metabolic acidosis). 3. Uremic syndrome: retention of uremic toxins + hormone deficiencies → multisystem manifestations.\n\nVolume overload results from Na⁺ retention by the failing kidneys. The electrolyte picture is characteristic: hyperkalemia, hyperphosphatemia, hypocalcemia, metabolic acidosis. Uremic syndrome affects all organ systems and includes uremic pericarditis, encephalopathy, asterixis, and platelet dysfunction."
    difficulty: easy
    tags: [nephrology, ESRD, uremic syndrome, volume overload, electrolytes, hyperkalemia]
  - front: "What is the GFR definition of ESRD and what is the strongest predictor of progression to ESRD?"
    back: "ESRD: irreversible decline in kidney function requiring renal replacement therapy; GFR <15 mL/min/1.73m². Strongest predictor of progression to ESRD: amount of daily proteinuria.\n\nA GFR <15 corresponds to CKD G5. While GFR <15 is the definition, renal replacement therapy (dialysis or transplant) may be initiated based on symptoms (uremic symptoms, volume overload, electrolyte abnormalities) rather than GFR alone. Proteinuria is the strongest predictor because it directly causes tubular injury and interstitial fibrosis."
    difficulty: easy
    tags: [nephrology, ESRD, GFR, proteinuria, progression, definition]
