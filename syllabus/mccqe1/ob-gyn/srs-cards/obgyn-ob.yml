    back: "Treatment is unnecessary unless symptomatic, or if high-risk pregnancy, prior IUD insertion, gynecologic surgery, induced abortion, or upper tract instrumentation\n\nBacterial vaginosis is caused by overgrowth of Gardnerella vaginalis, Mycoplasma hominis, and anaerobes. Treatment is typically reserved for symptomatic patients or those undergoing procedures."
