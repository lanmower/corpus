# Pediatrics Nephrology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the definition of nephrotic syndrome (NS) in children, and what are the four cardinal features?"
    back: "NS is defined by: (1) massive proteinuria (urine protein/creatinine ratio >300 mg/mmol on first morning urine), (2) hypoalbuminemia (<25 g/L), (3) edema, and (4) hyperlipidemia/hypercholesterolemia (total cholesterol >5 mmol/L).\n\nThe tetrad reflects the pathophysiology: glomerular leak of protein → hypoalbuminemia → reduced oncotic pressure → edema, with reactive hepatic lipoprotein synthesis causing hyperlipidemia. Minimal change disease (MCD) is the most common cause in children and is steroid-responsive in ~80%."
    difficulty: easy
    tags: [nephrology, nephrotic syndrome, pediatrics, proteinuria, hypoalbuminemia]
  - front: "In pediatric nephrotic syndrome, how does edema typically progress throughout the day, and what is the most severe form called?"
    back: "Edema starts periorbital (often first sign, most prominent in morning) and pretibial, then becomes gravity-dependent — periorbital edema decreases and pretibial edema increases over the day. Anasarca is the most severe form: marked periorbital and peripheral edema, ascites, pleural effusions, and scrotal/labial edema.\n\nEdema is detectable when fluid retention exceeds 3-5% of body weight. The gravity-dependent shift explains the clinical observation that periorbital puffiness is worse on waking. Anasarca requires urgent management including furosemide + albumin infusion."
    difficulty: easy
    tags: [nephrology, nephrotic syndrome, edema, anasarca, pediatrics]
  - front: "What investigations are used to diagnose nephrotic syndrome in children?"
    back: "Urine: dipstick (3-4+ proteinuria ± microscopic hematuria), first morning urine protein/creatinine ratio >300 mg/mmol. Blood: hypoalbuminemia (<25 g/L), hypercholesterolemia (>5 mmol/L). Secondary: electrolytes (hypocalcemia, hyperkalemia, hyponatremia), renal function (↑BUN, Cr), coagulation profile (↑PTT). Rule out secondary causes: CBC, C3/C4, ANA, hepatitis B/C, ASOT, HIV.\n\nThe urine protein/creatinine ratio on a random or first morning urine sample is a reliable non-invasive method to quantify proteinuria, avoiding 24-hour urine collection in children. Complement levels (C3/C4) help distinguish MCD (normal) from membranoproliferative GN or lupus nephritis (low)."
    difficulty: medium
    tags: [nephrology, nephrotic syndrome, investigations, proteinuria, pediatrics]
  - front: "What are the indications for renal biopsy in a child with nephrotic syndrome?"
    back: "Indications: HTN, gross hematuria, ↓renal function, low serum C3/C4, no response to steroids after 4 weeks of therapy, frequent relapses (>2 in 6 months), presentation before first year of life (congenital nephrotic syndrome), presentation after age 12 (rule out serious pathology beyond MCD).\n\nMost children aged 1-12 years with typical nephrotic syndrome (no hematuria, normal complement, normal BP) are empirically treated with steroids for presumed MCD without biopsy. Biopsy is reserved for atypical features or steroid resistance, which suggests focal segmental glomerulosclerosis, membranous nephropathy, or other entities."
    difficulty: medium
    tags: [nephrology, nephrotic syndrome, renal biopsy, MCD, pediatrics]
  - front: "What is the first-line treatment for minimal change disease (MCD) in children, and what precaution must be taken before initiating?"
    back: "Oral prednisone 2 mg/kg/day (or equivalent) for up to 12 weeks. Before starting, varicella immune status must be confirmed — prednisone can significantly exacerbate varicella infection.\n\nMCD accounts for ~80-90% of nephrotic syndrome in children aged 1-8 years and has an excellent response to corticosteroids (~80% respond). Varicella exposure while on corticosteroids requires varicella immunoglobulin + acyclovir. Pneumococcal vaccine should be given at diagnosis, and varicella vaccine after remission."
    difficulty: easy
    tags: [nephrology, MCD, prednisone, nephrotic syndrome, pediatrics, treatment]
  - front: "List the major complications of nephrotic syndrome in children."
    back: "1. Infections: spontaneous bacterial peritonitis, pneumonia/empyema, cellulitis, sepsis (due to urinary loss of immunoglobulins and complement). 2. Hypercoagulability: PE, renal vein thrombosis (due to ↓intravascular volume + antithrombin III depletion). 3. Intravascular volume depletion → hypotension, shock, renal failure. 4. Anasarca. 5. Adverse effects on growth. 6. Drug side effects from long-term steroids.\n\nAntithrombin III is lost in urine along with other proteins, combined with hemoconcentration from low intravascular oncotic pressure, creating a prothrombotic state. The GOOD CUSHINGS mnemonic captures steroid side effects: Growth impairment, Obesity, Osteoporosis, Dorsal hump, Cataracts, Ulcers, Striae, Hypertension, Immunosuppression, Necrosis (avascular), Glucose dysregulation, Salt/water retention."
    difficulty: medium
    tags: [nephrology, nephrotic syndrome, complications, hypercoagulability, infections, pediatrics]
  - front: "What is the prognosis of nephrotic syndrome due to MCD in children?"
    back: "Generally good: ~80% respond to corticosteroids. Up to 2/3 experience relapse (often multiple times). Most achieve sustained remission with normal kidney function by adolescence.\n\nFrequent relapsers (>2 relapses in 6 months) may require cytotoxic agents (cyclophosphamide), immunomodulators (mycophenolate, tacrolimus), or high-dose pulse corticosteroids. Long-term prognosis is excellent for MCD, unlike focal segmental glomerulosclerosis which has higher risk of progression to ESRD."
    difficulty: easy
    tags: [nephrology, MCD, prognosis, nephrotic syndrome, pediatrics]
  - front: "What is the mnemonic for side effects of long-term corticosteroid use in children with nephrotic syndrome?"
    back: "GOOD CUSHINGS: Growth impairment, Obesity, Osteoporosis, Dorsal hump (buffalo hump), Cataracts, Ulcers (peptic), Striae, Hypertension, Immunosuppression, Necrosis (avascular necrosis), Glucose dysregulation (DM), Salt and water retention.\n\nLong-term corticosteroid side effects are a major concern in pediatric nephrotic syndrome given frequent relapses requiring repeated courses. Calcium and vitamin D supplementation should be given during corticosteroid therapy to mitigate bone loss. Growth velocity should be monitored; if significantly impaired, alternate-day dosing or steroid-sparing agents may be considered."
    difficulty: easy
    tags: [nephrology, nephrotic syndrome, corticosteroids, side effects, pediatrics]
  - front: "A 3-year-old boy presents with periorbital edema, foamy urine, and fatigue. Urine protein/creatinine ratio is 350 mg/mmol, serum albumin 18 g/L, cholesterol 7.2 mmol/L. What is the diagnosis, most likely etiology, and initial treatment?"
    back: "Diagnosis: Nephrotic syndrome. Most likely etiology: Minimal Change Disease (MCD) — most common cause in children aged 1-8 years. Initial treatment: Oral prednisone 2 mg/kg/day for up to 12 weeks, after confirming varicella immune status.\n\nThe classic tetrad is present (heavy proteinuria, hypoalbuminemia, edema, hypercholesterolemia). In this age group without red flags (normal BP, no gross hematuria, normal complement), empiric steroid therapy is appropriate without renal biopsy. ~80% of children with MCD respond to steroids. Renal biopsy would be considered if no response after 4 weeks."
    difficulty: medium
    tags: [nephrology, nephrotic syndrome, MCD, case, pediatrics, prednisone]
