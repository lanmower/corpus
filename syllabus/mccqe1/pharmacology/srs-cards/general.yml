# General (Pharmacology) - generated from srs-mccqe1
cards:
  - front: "What does SGLT2 stand for?"
    back: "Sodium-Glucose Cotransporter 2\n\nSGLT2 inhibitors (dapagliflozin, empagliflozin) are now first-line therapy for HFrEF regardless of diabetes status due to proven mortality benefits."
    difficulty: easy
    tags: [heart-failure, pharmacology, cardiology-terminology, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does ACEI stand for?"
    back: "Angiotensin-Converting Enzyme Inhibitor\n\nACEIs (ramipril, enalapril, lisinopril) are first-line therapy for HFrEF, reducing preload, afterload, and adverse cardiac remodeling."
    difficulty: easy
    tags: [heart-failure, pharmacology, cardiology-terminology, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does ARNI stand for?"
    back: "Angiotensin Receptor-Neprilysin Inhibitor\n\nSacubitril/valsartan (Entresto) combines ARB and neprilysin inhibition. It superior to ACEI in HFrEF for reducing mortality and HF hospitalizations."
    difficulty: easy
    tags: [heart-failure, pharmacology, cardiology-terminology, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does DOAC stand for?"
    back: "Direct Oral Anticoagulant\n\nDOACs (apixaban, rivaroxaban, dabigatran, edoxaban) are preferred over warfarin for non-valvular atrial fibrillation and VTE treatment."
    difficulty: easy
    tags: [anticoagulation, pharmacology, cardiology-terminology, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "Why does the transplanted heart not respond to anticholinergics like atropine?"
    back: "The donor heart is completely denervated - it does not receive parasympathetic vagal stimulation or intrinsic postganglionic sympathetic stimulation\n\nDenervation eliminates both vagal tone and sympathetic innervation, making the heart rate dependent on circulating catecholamines rather than autonomic reflexes."
    difficulty: medium
    tags: [cardiac-transplantation, denervation, pharmacology, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the effect of alpha-1 adrenergic receptor activation on the cardiovascular system?"
    back: "Constriction of vascular smooth muscle, particularly in skin, skeletal muscle, and splanchnic vessels\n\nAlpha-1 receptors mediate vasoconstriction. Blocking these receptors (e.g., with prazosin) causes vasodilation."
    difficulty: easy
    tags: [pharmacology, adrenergic receptors, alpha receptors, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the effect of beta-1 adrenergic receptor activation on the cardiovascular system?"
    back: "Increased myocardial contractility, accelerated SA node conduction, accelerated ectopic pacemakers, and stimulation of renin release\n\nBeta-1 receptors are predominantly found in the heart. Blocking these receptors (e.g., with metoprolol) reduces heart rate and contractility."
    difficulty: easy
    tags: [pharmacology, adrenergic receptors, beta receptors, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the effect of beta-2 adrenergic receptor activation on the cardiovascular and respiratory systems?"
    back: "Decreased vascular smooth muscle tone (vasodilation), bronchodilation, stimulation of gluconeogenesis and glycogenolysis, bladder wall relaxation\n\nBeta-2 agonists (e.g., albuterol) are used for asthma. Beta-2 receptors in vasculature can cause hypotension."
    difficulty: easy
    tags: [pharmacology, adrenergic receptors, beta receptors, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is isoproterenol and what are its effects?"
    back: "Pure beta-agonist (non-selective: beta-1 and beta-2) - causes increased heart rate, contractility, and bronchodilation\n\nIsoproterenol has no alpha activity, making it useful when pure beta-stimulation is desired without vasoconstriction."
    difficulty: medium
    tags: [pharmacology, beta agonists, adrenergic, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the effects of alpha-2 adrenergic receptor stimulation?"
    back: "Vasoconstrict and dilate (opposing alpha-1 vasoconstrictor effects peripherally), inhibition of myenteric plexus, stimulation of liver gluconeogenesis and glycogenolysis\n\nAlpha-2 receptors are primarily inhibitory and often counterbalance alpha-1 effects. Central alpha-2 activation reduces sympathetic outflow."
    difficulty: medium
    tags: [pharmacology, alpha receptors, adrenergic, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the effects of beta-1 adrenergic receptor stimulation?"
    back: "Increased myocardial contractility, accelerated SA node conduction, accelerated ectopic pacemakers, decreased heart rate (via baroreceptor reflex), stimulation of renin release\n\nBeta-1 receptors are predominantly found in the heart. Their stimulation increases cardiac output through positive inotropic and chronotropic effects."
    difficulty: medium
    tags: [pharmacology, beta receptors, cardiac, adrenergic, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the effects of beta-2 adrenergic receptor stimulation?"
    back: "Bronchodilation, decreased vascular smooth muscle tone, uterine relaxation, bladder wall relaxation, gluconeogenesis, glycogenolysis, fat cell lipolysis\n\nBeta-2 receptors mediate smooth muscle relaxation in multiple organ systems and metabolic effects including increased glucose and free fatty acids."
    difficulty: medium
    tags: [pharmacology, beta receptors, adrenergic, smooth muscle, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of epinephrine?"
    back: "Acts on alpha-1, alpha-2, beta-1, and beta-2 receptors (non-selective)\n\nEpinephrine activates all adrenergic receptor types. At low doses, beta effects predominate; at high doses, alpha effects predominate."
    difficulty: easy
    tags: [pharmacology, epinephrine, adrenergic agonist, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of metoprolol?"
    back: "Selective beta-1 antagonist (cardioselective)\n\nMetoprolol blocks beta-1 receptors preferentially at therapeutic doses, reducing heart rate and contractility. Less bronchospasm risk than non-selective beta-blockers."
    difficulty: easy
    tags: [pharmacology, metoprolol, beta blocker, cardiology, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of propranolol?"
    back: "Non-selective beta-blocker blocking both beta-1 and beta-2 receptors\n\nPropranolol blocks beta receptors in heart, lungs, and other tissues. Can cause bronchospasm and masks hypoglycemic symptoms in diabetics."
    difficulty: easy
    tags: [pharmacology, propranolol, beta blocker, non-selective, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of carvedilol?"
    back: "Non-selective beta-blocker with additional alpha-1 blocking activity\n\nCarvedilol provides beta-blockade plus vasodilation from alpha-1 blockade. It has antioxidant properties and is used in heart failure."
    difficulty: medium
    tags: [pharmacology, carvedilol, beta blocker, heart failure, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of esmolol?"
    back: "Ultra-short acting beta-1 selective blocker\n\nEsmolol has a half-life of approximately 9 minutes due to rapid hydrolysis by red blood cell esterases. Useful for rate control in critical settings."
    difficulty: medium
    tags: [pharmacology, esmolol, beta blocker, critical care, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the dosing regimen for bupropion in smoking cessation?"
    back: "150 mg once daily x 3 days, then 150 mg BID x 7-12 weeks, with quit date set after 1-2 weeks of treatment\n\nPatients continue smoking for the first 1-2 weeks while building therapeutic levels, then set a quit date."
    difficulty: medium
    tags: [pharmacology, smoking-cessation, dosing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the varenicline dosing regimen for smoking cessation?"
    back: "0.5 mg once daily x 3 days, then 0.5 mg BID x 4 days, then 1 mg BID x 12 weeks, with quit date on day 8\n\nA gradual quit date approach is also acceptable: start varenicline, reduce smoking 50% by wk 4, another 50% by wk 8, quit by wk 12."
    difficulty: hard
    tags: [pharmacology, smoking-cessation, dosing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of action of naltrexone in alcohol use disorder?"
    back: "Competitive opioid antagonist that reduces cravings and pleasurable effects of drinking\n\nNaltrexone blocks opioid receptors, reducing the rewarding effects of alcohol."
    difficulty: medium
    tags: [alcohol, pharmacology, naltrexone, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of action of acamprosate?"
    back: "Glutamate receptor modulator that reduces craving\n\nAcamprosate helps maintain abstinence by modulating glutamatergic neurotransmission."
    difficulty: medium
    tags: [alcohol, pharmacology, acamprosate, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of action of disulfiram (Antabuse)?"
    back: "Blocks conversion of acetaldehyde to acetic acid, causing flushing, headache, N/V, hypotension if alcohol is ingested\n\nDisulfiram creates an aversive reaction to alcohol by accumulating acetaldehyde."
    difficulty: medium
    tags: [alcohol, pharmacology, disulfiram, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "Is disulfiram available in Canada?"
    back: "No, it is no longer available in Canada (available in the US)\n\nDisulfiram was previously available but is no longer marketed in Canada."
    difficulty: easy
    tags: [alcohol, pharmacology, disulfiram, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "Can bupropion and varenicline be used in combination with NRT?"
    back: "Yes, they may be used in combination with NRT\n\nCombination therapy with bupropion or varenicline plus NRT may improve quit rates."
    difficulty: medium
    tags: [smoking-cessation, pharmacology, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the dosing schedule for bupropion for smoking cessation?"
    back: "150 mg once daily x 3 days, then 150 mg BID x 7-12 weeks, may continue 150 mg BID for maintenance up to 6 months\n\nThe initial low dose minimizes side effects; therapeutic levels are reached after 1 week of treatment."
    difficulty: medium
    tags: [smoking-cessation, pharmacology, bupropion, dosing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the dosing schedule for varenicline for smoking cessation?"
    back: "0.5 mg once daily x 3 days, then 0.5 mg BID x 4 days, then 1 mg BID x 12 weeks; quit date is day 8\n\nGradual titration reduces nausea; the quit date is set on day 8 when therapeutic levels are achieved."
    difficulty: medium
    tags: [smoking-cessation, pharmacology, varenicline, dosing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of action of acamprosate in alcohol use disorder?"
    back: "Glutamate receptor modulator that reduces craving\n\nAcamprosate helps maintain abstinence by modulating glutamatergic neurotransmission."
    difficulty: easy
    tags: [alcohol, pharmacology, acamprosate, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the dosing regimen for varenicline?"
    back: "0.5 mg daily x 3 days, then 0.5 mg BID x 4 days, then 1 mg BID x 12 weeks (quit on day 8)\n\nThe standard regimen starts with titration over 7 days, with patients setting a quit date around day 8. A gradual quit approach is also acceptable."
    difficulty: medium
    tags: [pharmacology, smoking-cessation, varenicline, dosing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What medications are used for alcohol withdrawal?"
    back: "Diazepam (benzodiazepine of choice)\n\nBenzodiazepines are the standard of care for alcohol withdrawal to prevent seizures and delirium tremens."
    difficulty: easy
    tags: [alcohol, pharmacology, withdrawal, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of naltrexone in alcohol use disorder?"
    back: "Competitive opioid antagonist that reduces cravings and pleasurable effects of drinking\n\nNaltrexone blocks opioid receptors, diminishing the rewarding effects of alcohol."
    difficulty: medium
    tags: [alcohol, pharmacology, naltrexone, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of acamprosate in alcohol use disorder?"
    back: "Glutamate receptor modulator that reduces craving\n\nAcamprosate helps maintain abstinence by modulating NMDA glutamate receptors."
    difficulty: medium
    tags: [alcohol, pharmacology, acamprosate, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of disulfiram (Antabuse)?"
    back: "Impairs metabolism of alcohol by blocking conversion of acetaldehyde to acetic acid\n\nThis causes accumulation of acetaldehyde, leading to flushing, headache, N/V, and hypotension if alcohol is ingested."
    difficulty: easy
    tags: [alcohol, pharmacology, disulfiram, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the dosing schedule for bupropion smoking cessation?"
    back: "150mg daily x 3 days, then 150mg BID x 7-12 weeks; therapeutic levels reached in 1 week\n\nPatients continue smoking for 1-2 weeks while building therapeutic levels before quit date."
    difficulty: medium
    tags: [pharmacology, smoking-cessation, bupropion, dosing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the dosing schedule for varenicline smoking cessation?"
    back: "0.5mg daily x 3 days, then 0.5mg BID x 4 days, then 1mg BID x 12 weeks (maintenance optional up to 6 months)\n\nGradual titration reduces side effects; quit date is typically day 8 of treatment."
    difficulty: medium
    tags: [pharmacology, smoking-cessation, varenicline, dosing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of action of SNRIs (e.g., venlafaxine)?"
    back: "Block serotonin and norepinephrine reuptake\n\nSNRIs inhibit reuptake of both serotonin and norepinephrine, providing dual neurotransmitter effect."
    difficulty: easy
    tags: [pharmacology, SNRI, mechanism, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the mechanism of action of TCAs?"
    back: "Block serotonin and norepinephrine reuptake\n\nTCAs inhibit reuptake of both serotonin and norepinephrine similarly to SNRIs."
    difficulty: easy
    tags: [pharmacology, TCA, mechanism, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are examples of SNRIs?"
    back: "Venlafaxine (Effexor®) and Desvenlafaxine (Pristiq®)\n\nSNRIs block both serotonin and norepinephrine reuptake."
    difficulty: easy
    tags: [pharmacology, psychiatry, depression, SNRI, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Why are TCAs considered dangerous in overdose?"
    back: "Narrow therapeutic window; lethal in overdose\n\nTCAs have a narrow therapeutic index, and overdose can cause fatal cardiac arrhythmias and seizures."
    difficulty: easy
    tags: [TCA, amitriptyline, depression, pharmacology, toxicity, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What pharmacologic options are available for alcohol withdrawal?"
    back: "Diazepam\n\nBenzodiazepines like diazepam are first-line for alcohol withdrawal to prevent seizures and delirium tremens."
    difficulty: medium
    tags: [alcohol, treatment, pharmacology, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the mechanism of acamprosate?"
    back: "Glutamate receptor modulator that reduces craving\n\nAcamprosate helps maintain abstinence by modulating NMDA glutamate receptors."
    difficulty: medium
    tags: [alcohol, treatment, pharmacology, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What does disulfiram (Antabuse) do?"
    back: "Blocks conversion of acetaldehyde to acetic acid, causing flushing, headache, N/V, hypotension if alcohol is ingested\n\nThis creates an aversive reaction to alcohol as a deterrent; it is not available in Canada."
    difficulty: medium
    tags: [alcohol, treatment, pharmacology, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the dosing regimen for varenicline in smoking cessation?"
    back: "0.5 mg daily x 3 days, then 0.5 mg BID x 4 days, then 1 mg BID x 12 weeks\n\nStart 1 week before quit date: 0.5 mg daily for 3 days, then 0.5 mg BID for 4 days, then 1 mg BID. Quit on day 8."
    difficulty: medium
    tags: [pharmacology, smoking-cessation, dosing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the key concerns with TCA use?"
    back: "Narrow therapeutic window, lethal in overdose\n\nTCAs have a narrow safety margin and can be fatal in overdose due to cardiac toxicity."
    difficulty: medium
    tags: [pharmacology, psychiatry, depression, TCA, safety, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the on-demand treatment for non-erosive esophagitis (NERD)?"
    back: "Antacids (Mg(OH)2, Al(OH)3), alginate, H2-blockers, or PPIs\n\nOn-demand therapy for NERD includes antacids, alginate, H2-blockers, or PPIs used as needed."
    difficulty: easy
    tags: [NERD, treatment, pharmacology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What antispasmodic medications are used for IBS pain and when should they be taken?"
    back: "Hyoscine, pinaverium, or trimebutine - taken before meals\n\nAntispasmodics reduce intestinal smooth muscle contractions and are most effective when taken before meals to prevent postprandial pain."
    difficulty: medium
    tags: [IBS, treatment, antispasmodics, pharmacology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are secretagogues used for IBS-C and how do they work?"
    back: "Linaclotide and plecanatide - guanylate cyclase-C agonists that increase water secretion into the intestinal lumen.\n\nThese medications mimic guanylin, increasing intestinal fluid secretion and accelerating transit, improving both constipation and abdominal pain."
    difficulty: medium
    tags: [IBS-C, Pharmacology, Secretagogues, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the treatment for on-demand therapy in NERD (non-erosive reflux disease)?"
    back: "Antacids (Mg(OH)2, Al(OH)3), alginate, H2-blockers, or PPIs"
    difficulty: easy
    tags: [NERD, treatment, pharmacology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What stimulant laxatives are used for constipation?"
    back: "Senna and bisacodyl - effective within 24 hours\n\nStimulants activate peristalsis by irritating the colon mucosa."
    difficulty: medium
    tags: [constipation, laxatives, treatment, pharmacology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are secretagogues used for constipation and how do they work?"
    back: "Linaclotide and plecanatide - increase water secretion into the intestinal lumen\n\nThese medications activate guanylate cyclase-C to increase intestinal fluid secretion."
    difficulty: medium
    tags: [constipation, secretagogues, treatment, pharmacology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the mechanism of action of linaclotide and plecanatide in constipation?"
    back: "Secretagogues that increase water secretion into the intestinal lumen by activating guanylate cyclase-C receptors\n\nThese medications mimic guanylin/uroguanylin, increasing intestinal fluid secretion and accelerating transit."
    difficulty: hard
    tags: [Constipation, Mechanism of Action, Pharmacology, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What medications were used in the PREDESCI trial?"
    back: "Propranolol or carvedilol (non-selective beta-blockers).\n\nBoth propranolol and carvedilol are non-selective beta-blockers that reduce portal pressure through beta-1 (reduced cardiac output) and beta-2 (reduced splanchnic blood flow) blockade; carvedilol also has alpha-1 blocking activity."
    difficulty: medium
    tags: [propranolol, carvedilol, beta-blockers, pharmacology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is the first-line urate-lowering therapy for chronic gout?"
    back: "Allopurinol (preferred first-line agent, not nephrotoxic)\n\nAllopurinol inhibits xanthine oxidase to reduce uric acid production. Start low and titrate up. Febuxostat is second-line."
    difficulty: medium
    tags: [gout, treatment, pharmacology, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
