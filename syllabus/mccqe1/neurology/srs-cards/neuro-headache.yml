# Headache Disorders & Migraine (Neurology) - generated from srs-mccqe1
cards:
  - front: "A 25-year-old woman has unilateral throbbing headache with nausea, photophobia, and phonophobia, lasting 8-72 hours and occurring 3x/month. Diagnosis and acute treatment?"
    back: "Migraine without aura; acute treatment: NSAIDs (naproxen, ibuprofen), triptans (sumatriptan) for moderate-severe, anti-emetics (metoclopramide) — treat early for best effect\n\nICHD-3 diagnostic criteria for migraine without aura: 5+ attacks lasting 4-72h, 2+ of: unilateral, pulsating, moderate-severe, aggravated by activity; plus nausea/vomiting or photophobia + phonophobia. CTHF guidelines recommend treating early before headache becomes severe."
    difficulty: medium
    tags: [migraine, headache, triptan, NSAID, neurology]
  - front: "What is the criteria for migraine prophylaxis and what are first-line agents?"
    back: "Prophylaxis indicated when: ≥4 headache days/month, significantly disabling attacks, analgesic overuse risk, patient preference; first-line: propranolol, topiramate, amitriptyline, valproate (avoid in women of childbearing age)\n\nCanadian Headache Society guidelines recommend prophylaxis to reduce frequency by ≥50%. CGRP monoclonal antibodies (erenumab, fremanezumab, galcanezumab) are first-line for chronic migraine or episodic migraine refractory to traditional prophylactics."
    difficulty: medium
    tags: [migraine prophylaxis, propranolol, topiramate, CGRP antibody, neurology]
  - front: "What is medication overuse headache (MOH) and which analgesics cause it?"
    back: "MOH: headache on ≥15 days/month from regular use of analgesics ≥10-15 days/month; triptans, opioids, butalbital: overuse ≥10 days/month; NSAIDs, acetaminophen: ≥15 days/month\n\nMOH is the most common cause of chronic daily headache. Canadian Headache Society recommends withdrawal of overused medications — headache often worsens initially (rebound) before improving. Topiramate or amitriptyline can ease withdrawal. Opioid overuse requires medically supervised withdrawal."
    difficulty: hard
    tags: [medication overuse headache, MOH, analgesic overuse, chronic daily headache, neurology]
  - front: "What are red flag features in headache requiring urgent investigation?"
    back: "Thunderclap onset (SAH), neurological deficits, fever + meningism, papilledema, new headache in age >50, immunocompromised, cancer history, postural component, worsening with Valsalva\n\nSNNOOP10 red flag criteria identify potentially dangerous secondary headaches. Thunderclap headache (reaching maximum in <1 min) requires urgent CT head followed by LP to exclude SAH. Headache with fever + stiff neck → meningitis workup."
    difficulty: medium
    tags: [headache red flags, thunderclap headache, SAH, secondary headache, neurology]
  - front: "What is cluster headache and how does it differ from migraine?"
    back: "Cluster: unilateral periorbital/temporal pain, maximal intensity within minutes, lasting 15-180 min, with ipsilateral autonomic features (lacrimation, rhinorrhea, ptosis, miosis, facial flushing); occurs in clusters (1-3x/day x weeks to months)\n\nCluster headache is more common in men (3:1). Episodic or chronic form. Acute treatment: 100% O2 (7-12 L/min x15-20 min) and subcutaneous sumatriptan. Prophylaxis: verapamil (first-line), lithium, melatonin. Occipital nerve block for transitional therapy."
    difficulty: hard
    tags: [cluster headache, trigeminal autonomic cephalalgia, O2 therapy, verapamil, neurology]
  - front: "What is giant cell arteritis (GCA) and why must it be treated immediately?"
    back: "GCA: granulomatous large vessel vasculitis in patients >50; temporal headache, scalp tenderness, jaw claudication, elevated ESR and CRP; treat immediately with high-dose prednisone (60-100 mg/day) — risk of irreversible blindness\n\nGCA affects temporal arteries and can involve ophthalmic artery causing ischemic optic neuropathy and permanent vision loss. Temporal artery biopsy confirms diagnosis but treatment must NOT be delayed waiting for biopsy. Biopsy remains positive for 2 weeks after starting steroids."
    difficulty: hard
    tags: [giant cell arteritis, GCA, temporal arteritis, blindness, prednisone, neurology]
  - front: "What is idiopathic intracranial hypertension (IIH) and who is at risk?"
    back: "IIH: elevated ICP without hydrocephalus or mass lesion; predominantly overweight women of childbearing age; symptoms: headache, visual obscurations, pulsatile tinnitus, papilledema; treat with weight loss and acetazolamide\n\nIIH diagnosis: elevated opening pressure >25 cm H2O on LP, normal CSF composition, normal MRI (may see empty sella, flattening of posterior globe). Acetazolamide reduces CSF production. Bariatric surgery for morbid obesity. Optic nerve sheath fenestration or VP shunt for vision-threatening cases."
    difficulty: hard
    tags: [IIH, idiopathic intracranial hypertension, pseudotumor cerebri, acetazolamide, papilledema, neurology]
  - front: "What is the mechanism of action of triptans and their main side effects?"
    back: "Triptans: 5-HT1B/1D agonists — cause cranial vasoconstriction and inhibit CGRP release; side effects: chest tightness, flushing, paresthesias, contraindicated in cardiovascular disease and uncontrolled hypertension\n\nTriptans are contraindicated in: coronary artery disease, MI, uncontrolled hypertension, stroke/TIA, and hemiplegic migraine. Serotonin syndrome risk when combined with MAOIs. Multiple triptans exist with different routes (SC, nasal spray, oral); subcutaneous fastest onset."
    difficulty: easy
    tags: [triptans, 5-HT agonist, migraine treatment, contraindications, neurology]
  - front: "What is a migraine with aura and what aura types are associated with contraindication to OCPs?"
    back: "Migraine with aura: reversible focal neurological symptoms (visual: scintillating scotoma, fortification spectra; sensory; speech/language) before or during headache; aura increases stroke risk — migraine with aura + OCP + smoking = very high stroke risk\n\nCanadian Headache Society and SOGC: combined OCP contraindicated in migraine with aura due to increased ischemic stroke risk. Progestin-only pill or non-hormonal contraception is safer. Migraine with aura is an independent risk factor for ischemic stroke in young women."
    difficulty: hard
    tags: [migraine with aura, OCP contraindication, stroke risk, aura, neurology]
  - front: "What is tension-type headache and how is it differentiated from migraine?"
    back: "Tension-type headache: bilateral, pressing/tightening (non-pulsating), mild-moderate intensity, not aggravated by activity, no nausea/vomiting (may have photophobia OR phonophobia but not both)\n\nTension-type headache is the most common headache type. Treatment: NSAIDs or acetaminophen for acute episodes; amitriptyline for prophylaxis. Absence of nausea and aggravation by activity distinguishes from migraine. Combination analgesics (codeine-containing) should be avoided to prevent MOH."
    difficulty: easy
    tags: [tension headache, headache classification, ICHD-3, differentiate migraine, neurology]
  - front: "What distinguishes migraine from tension headache from cluster?"
    back: "Migraine: unilateral pulsating 4-72h, nausea, photo/phonophobia. Tension: bilateral pressing, no nausea. Cluster: unilateral periorbital, autonomic features (lacrimation, rhinorrhea), 15-180min\n\nMigraine with aura: visual scotoma before headache. Cluster: O2 15L/min or sumatriptan SC for acute. Preventive: verapamil."
    difficulty: medium
    tags: [headache, differential]
  - front: "What are the ICHD-3 diagnostic criteria for migraine without aura?"
    back: ">=5 attacks lasting 4-72 hours with >=2 of: unilateral, pulsating, moderate-severe, aggravated by activity; AND >=1 of: nausea/vomiting, photophobia and phonophobia.\n\nICHD-3 criteria are the gold standard. Migraine affects ~12% of Canadians (F:M 3:1). MCCQE1 expects distinguishing migraine from tension-type and cluster headache."
    difficulty: medium
    tags: [migraine criteria, ICHD-3, headache diagnosis, neurology]
  - front: "What are the first-line and second-line prophylactic medications for migraine?"
    back: "First-line: propranolol (40-240mg), amitriptyline (10-75mg), topiramate (50-200mg), candesartan (16mg). Second-line: venlafaxine, valproate. CGRP mAbs (erenumab, fremanezumab) after failing >=2 preventives. Start prophylaxis when >=4 migraine days/month.\n\nCanadian Headache Society recommends >=2-month trial at adequate dose. Topiramate is contraindicated in pregnancy. CGRP antibodies available in Canada with special authorization."
    difficulty: hard
    tags: [migraine prophylaxis, prevention, pharmacology, neurology]
  - front: "What are the diagnostic features and treatment of cluster headache?"
    back: "Severe unilateral orbital/temporal pain 15-180 min with ipsilateral autonomic features (lacrimation, conjunctival injection, nasal congestion, ptosis). Acute: sumatriptan SC 6mg or high-flow O2 12-15 L/min. Prophylaxis: verapamil first-line.\n\nCluster headache has M:F 3:1 (opposite of migraine). High-flow oxygen is uniquely effective with no contraindications. Verapamil requires ECG monitoring for PR prolongation."
    difficulty: hard
    tags: [cluster headache, trigeminal autonomic cephalalgia, treatment, neurology]
  - front: "What red flags (SNOOP) warrant urgent headache investigation?"
    back: "S: Systemic symptoms (fever, cancer, HIV). N: Neurological signs. O: Onset sudden (thunderclap). O: Older (>50, new onset). P: Pattern change, positional, Valsalva-precipitated, papilledema, progressive, pregnancy/postpartum.\n\nThunderclap headache mandates CT + LP to rule out SAH (CT ~95% sensitive within 6 hours). Canadian guidelines support CTA within 6 hours as potentially sufficient without LP."
    difficulty: hard
    tags: [red flags, secondary headache, SNOOP, neurology]
  - front: "What is medication overuse headache and how is it managed?"
    back: "MOH: acute medications >=10-15 days/month for >3 months (triptans/opioids >=10 days; simple analgesics >=15 days). Management: withdraw offending medication, bridge with naproxen or prednisone taper, start preventive.\n\nMOH is the third most common headache disorder and a major cause of chronic daily headache. Withdrawal headache lasts 2-10 days for triptans, longer for opioids. Patient education on limiting acute medication is essential."
    difficulty: hard
    tags: [medication overuse headache, MOH, chronic headache, neurology]
  - front: "How is subarachnoid hemorrhage diagnosed?"
    back: "CT head (98% sensitive within 6h, drops to 50% by day 7). If CT negative: LP at >=6-12 hours for xanthochromia. CTA to identify aneurysm. Treatment: nimodipine 60mg q4h for 21 days; secure aneurysm within 24 hours.\n\nOttawa SAH Rule identifies patients needing investigation. Recent Canadian data suggest CTA within 6 hours may suffice without LP. Nimodipine prevents vasospasm. Aneurysm secured by clipping or coiling."
    difficulty: hard
    tags: [SAH, subarachnoid hemorrhage, thunderclap headache, neurology]
  - front: "What is the acute migraine treatment algorithm in the ED?"
    back: "First-line: IV metoclopramide 10-20mg + diphenhydramine 25-50mg. Alternatives: ketorolac 30mg IV, prochlorperazine 10mg IV. Avoid opioids. Dexamethasone 10mg IV reduces 72-hour recurrence (NNT 9).\n\nCanadian Headache Society and CAEP guidelines emphasize dopamine antagonists as ED first-line, not opioids. Dexamethasone single dose prevents recurrence. IV fluids recommended for dehydrated patients."
    difficulty: hard
    tags: [migraine ED treatment, acute management, neurology]
  - front: "What features distinguish tension-type headache from migraine?"
    back: "TTH: bilateral, pressing/tightening, mild-moderate, NOT aggravated by activity, no nausea, may have photophobia OR phonophobia (not both). Duration 30 min to 7 days. Prophylaxis for chronic TTH: amitriptyline.\n\nTTH is the most common primary headache but less disabling. Chronic TTH (>=15 days/month) should be distinguished from MOH and chronic migraine. Canadian guidelines recommend limiting analgesic use."
    difficulty: easy
    tags: [tension headache, TTH, differential diagnosis, neurology]
  - front: "What is the evaluation and treatment of idiopathic intracranial hypertension?"
    back: "Overweight woman with daily headache, pulsatile tinnitus, visual obscurations, papilledema. Opening pressure >25 cmH2O, normal CSF, normal MRI. Treatment: weight loss, acetazolamide 500-1000mg BID. Surgery if vision threatened.\n\nIIH requires urgent ophthalmologic assessment. Acetazolamide is primary therapy (IIHTT trial). Canadian guidelines recommend 5-10% weight loss. Topiramate is second-line (promotes weight loss + reduces CSF)."
    difficulty: hard
    tags: [IIH, pseudotumor cerebri, papilledema, neurology]
  - front: "What are the CGRP-targeted therapies for migraine?"
    back: "CGRP mAbs: erenumab (anti-receptor), fremanezumab, galcanezumab (anti-ligand)-monthly/quarterly SC. Gepants (rimegepant, ubrogepant): acute treatment. Available in Canada after failing 2-3 conventional preventives.\n\nCGRP therapies are migraine-specific with minimal side effects. Unlike triptans, they have no vasoconstrictive effects and are not contraindicated in cardiovascular disease. Canadian Headache Society supports use after conventional failures."
    difficulty: hard
    tags: [CGRP, migraine therapy, erenumab, neurology]
  - front: "When should CT head be ordered before lumbar puncture?"
    back: "Focal neurological deficits, papilledema, altered consciousness, immunocompromised, new seizure, age >60\n\nIDSA guidelines. CT before LP to rule out mass lesion/herniation risk. Do NOT delay antibiotics for LP/CT in suspected meningitis."
    difficulty: medium
    tags: [CT, LP, indications]
  - front: "A 35-year-old woman presents with the worst headache of her life, sudden onset reaching maximum intensity within seconds, and neck stiffness. What is the most critical diagnosis to rule out, and what is the diagnostic algorithm?"
    back: "Subarachnoid hemorrhage (SAH). Algorithm: 1) Non-contrast CT head (sensitivity ~98% within 6 hours). 2) If CT negative and clinical suspicion remains, perform lumbar puncture looking for xanthochromia and elevated RBCs that do not clear with sequential tubes. 3) If LP positive, CT angiography to identify the aneurysm.\n\nThunderclap headache (maximal intensity within seconds) is SAH until proven otherwise. The Ottawa SAH Rule can help identify patients who need investigation. CT sensitivity decreases over time (98% at 6h, 93% at 12h, 50% at 1 week), making LP essential when CT is negative but suspicion is high."
    difficulty: hard
    tags: [headache, SAH, thunderclap, neurology, emergency, red-flags]
  - front: "A 72-year-old woman presents with new-onset unilateral temporal headache, jaw claudication, and visual disturbances. ESR is 85 mm/hr. What is the diagnosis and the most urgent step?"
    back: "Giant cell (temporal) arteritis. Start high-dose corticosteroids (prednisone 1 mg/kg/day) IMMEDIATELY — do not wait for temporal artery biopsy. Biopsy should be performed within 2 weeks (remains positive despite steroids). Untreated GCA can cause irreversible bilateral blindness from anterior ischemic optic neuropathy.\n\nGCA should be suspected in any patient >50 with new headache, scalp tenderness, jaw claudication, visual symptoms, or unexplained elevated ESR/CRP. Polymyalgia rheumatica coexists in 40-60% of cases. Temporal artery biopsy is the gold standard but may show skip lesions causing false negatives."
    difficulty: hard
    tags: [headache, temporal-arteritis, GCA, rheumatology, emergency, red-flags]
  - front: "What are the red flag features in a headache presentation that suggest a secondary (dangerous) cause? Use the mnemonic SNOOP."
    back: "S — Systemic symptoms/signs (fever, weight loss, HIV, cancer). N — Neurological signs (focal deficits, papilledema, altered consciousness). O — Onset sudden (thunderclap). O — Older age of onset (>50, new headache). P — Pattern change (progressive worsening, positional, Valsalva-triggered, waking from sleep).\n\nSNOOP flags identify headaches requiring urgent neuroimaging and further workup. Headaches worsening with Valsalva or recumbency suggest raised intracranial pressure. Morning headaches with papilledema and progressive neurological deficits raise concern for intracranial mass lesion."
    difficulty: easy
    tags: [headache, red-flags, SNOOP, neurology, clinical-approach]
  - front: "A 20-year-old presents with fever, severe headache, photophobia, and neck stiffness. Kernig's and Brudzinski's signs are positive. What is the diagnosis and the immediate management before LP results are available?"
    back: "Bacterial meningitis until proven otherwise. Immediate empiric antibiotics (ceftriaxone + vancomycin; add ampicillin if >50 or immunocompromised for Listeria coverage) and dexamethasone BEFORE or WITH the first dose of antibiotics. Do not delay antibiotics for LP or CT.\n\nIn suspected bacterial meningitis, every hour of antibiotic delay increases mortality. CT before LP is only needed if there are signs of raised ICP, focal neurological deficits, immunocompromise, or altered consciousness. CSF findings in bacterial meningitis: high WBC (neutrophilic), high protein, low glucose, positive Gram stain/culture."
    difficulty: hard
    tags: [headache, meningitis, emergency, infectious-disease, neurology]
  - front: "What are the Ottawa SAH Rule criteria for investigating headache?"
    back: "Investigate if ≥1 high-risk variable present in neurologically intact adults presenting to ED within 14 days of headache onset: (1) Age ≥40 yr; (2) Neck pain or stiffness; (3) Witnessed loss of consciousness; (4) Onset during exertion; (5) Thunderclap headache (instantly peaking pain); (6) Limited neck flexion on examination. Not for patients with new neurologic deficits, previous SAH, or known brain tumors.\n\nThe Ottawa SAH Rule has 100% sensitivity and 13.6% specificity. Non-contrast CT head is 100% sensitive for SAH within 6 hours of onset. If CT is normal and SAH is still suspected after 6 hours, LP is performed to look for xanthochromia (yellow CSF from hemoglobin breakdown)."
    difficulty: medium
    tags: [SAH, subarachnoid hemorrhage, Ottawa SAH rule, headache, thunderclap]
  - front: "What is the investigation of choice for SAH and what is done if it is negative?"
    back: "Non-contrast CT head — 100% sensitive within 6 hours of symptom onset (hyperattenuating signal around Circle of Willis). If CT is negative and SAH is still suspected after 6 hours: lumbar puncture (LP) to look for xanthochromia. Management: urgent neurosurgery consult.\n\nSensitivity of CT for SAH decreases with time (100% at 6h, ~93% at 24h, less thereafter). Xanthochromia (yellow discoloration of CSF due to breakdown of hemoglobin) develops 2–4 hours after hemorrhage and persists for up to 2 weeks. CT angiogram or MR angiography is used to identify the underlying aneurysm."
    difficulty: medium
    tags: [SAH, CT head, xanthochromia, LP, neurosurgery]
  - front: "What are the treatment options for an acute migraine in the ED?"
    back: "First-line: NSAIDs, acetaminophen, Aspirin (simple analgesics), antiemetics (e.g., metoclopramide, prochlorperazine), triptans. ED-specific: ketorolac 30 mg IV, ergotamine, sumatriptan, other analgesics. Consider parenteral dexamethasone to prevent headache recurrence within 72 hours.\n\nAntiemetics (especially dopamine antagonists like prochlorperazine) have intrinsic antimigraine properties in addition to treating nausea. Dexamethasone has been shown to reduce migraine recurrence within 72 hours when added to standard abortive therapy (NNT ~9). Opioids are generally avoided due to risk of medication overuse headache and limited efficacy."
    difficulty: easy
    tags: [migraine, headache, ED treatment, antiemetics, triptans]
