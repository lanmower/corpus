  - front: "What is the blue dot sign in torsion of testicular appendix?"
    back: "Blue infarcted appendage visible through scrotal skin, typically in children. Cremaster reflex is preserved and testicle has vertical lie.\n\nThis finding helps differentiate from true testicular torsion where the reflex is absent and testicle lies horizontally."
    difficulty: medium
