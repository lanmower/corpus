# Family Medicine Alcohol (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the four CAGE questions used to screen for alcohol dependence?"
    back: "C – Have you ever felt you should Cut down on your drinking? A – Have people Annoyed you by criticizing your drinking? G – Have you ever felt bad or Guilty about your drinking? E – Have you ever had a drink first thing in the morning (Eye opener) to steady your nerves or get rid of a hangover?\n\nTwo or more positive responses on the CAGE questionnaire is considered a positive screen, indicating the need for further exploration of alcohol misuse or dependence. In family practice, 10–15% of patients misuse alcohol, and diagnosis is more commonly missed in women, the elderly, and those with high socioeconomic status."
    difficulty: easy
    tags: [alcohol use disorder, CAGE, screening, family medicine]
  - front: "What is the typical AST:ALT ratio in alcohol use disorder, and what other lab values are used for monitoring?"
    back: "AST:ALT ratio approaches 2:1 in alcohol use disorder. GGT and MCV are used for baseline and follow-up monitoring. CBC (anemia, thrombocytopenia) and INR (decreased clotting factor production) are also checked.\n\nThe 2:1 AST:ALT ratio is a classic finding that differentiates alcoholic hepatitis from other causes of hepatitis (where ALT usually exceeds AST). GGT is a sensitive marker for alcohol use, and macrocytosis (elevated MCV) reflects nutritional deficiency (folate, B12) common in chronic alcohol use."
    difficulty: easy
    tags: [alcohol use disorder, liver enzymes, AST ALT, GGT, investigations, family medicine]
  - front: "What pharmacologic agents are used in the management of alcohol use disorder in Canada?"
    back: "1. Diazepam (benzodiazepine) for withdrawal. 2. Naltrexone: competitive opioid antagonist that reduces cravings and pleasurable effects of drinking (caution: may trigger withdrawal in opioid-dependent patients). 3. Acamprosate: glutamate receptor modulator that reduces craving. Note: Disulfiram (Antabuse®) is no longer available in Canada (available in U.S.).\n\nDisulfiram blocks aldehyde dehydrogenase, causing acetaldehyde accumulation and an aversive reaction (flushing, N/V, hypotension) if alcohol is consumed. Its unavailability in Canada is a high-yield MCCQE1 fact. Acamprosate is preferred for maintenance of abstinence, while naltrexone is effective at reducing heavy drinking days."
    difficulty: medium
    tags: [alcohol use disorder, pharmacology, naltrexone, acamprosate, disulfiram, Canada]
  - front: "What percentage of patients in alcohol withdrawal will develop seizures or delirium tremens?"
    back: "10% of patients in alcohol withdrawal will have seizures or delirium tremens.\n\nAlcohol withdrawal is a medical emergency for the subset who develop delirium tremens (DTs), which typically occurs 48–96 hours after the last drink and carries significant mortality if untreated. Benzodiazepines (e.g., diazepam) are the treatment of choice for withdrawal management and seizure prophylaxis."
    difficulty: easy
    tags: [alcohol withdrawal, seizures, delirium tremens, family medicine]
  - front: "What are the criteria for referral to specialist or inpatient alcohol treatment program?"
    back: "1. Dangerous or highly unstable home environment. 2. Severe medical or psychiatric concern. 3. Addiction to a drug that may require inpatient detoxification. 4. Refractory to other treatment programs.\n\nMost patients with alcohol use disorder can be managed in primary care with outpatient or day programs, Alcoholics Anonymous, individualized counselling, and pharmacotherapy. The prognosis is better than commonly perceived: 25–30% exhibit spontaneous improvement over 1 year, and 60–70% of those with jobs and families have improved quality of life 1 year post-treatment."
    difficulty: easy
    tags: [alcohol use disorder, referral, management, family medicine]
