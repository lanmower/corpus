# Family Medicine Hypertension (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What is the Canadian epidemiology of hypertension?"
    back: "22% of Canadian adults have HTN (52% prevalence in ages 60–70). Lifetime risk of developing HTN is approximately 90%. 64% of Canadians with HTN are treated and controlled; 17% are unaware they have HTN. HTN is the 3rd leading risk factor associated with death.\n\nDespite high awareness and treatment rates in Canada, a significant proportion remain uncontrolled. HTN is a major modifiable risk factor for CAD, HF, cerebrovascular disease, renal failure, and PVD, making population-level management critical."
    difficulty: easy
    tags: [hypertension, epidemiology, Canada, family-medicine]
  - front: "Define the BP thresholds for diagnosing hypertension in diabetic vs. non-diabetic patients using office measurement."
    back: "Diabetic patients: OBPM >130/80 mmHg for ≥3 measurements on different days = probable HTN\nNon-diabetic patients: AOBP >135/85 mmHg OR OBPM ≥140/90 mmHg = probable HTN (then rule out white coat HTN)\nABPM: daytime mean >135/85 or 24-hr mean >130/80 = HTN\nHBPM series mean ≥135/85 = HTN\nAOBP or OBPM sBP ≥180 or dBP ≥110 mmHg = HTN regardless\n\nHypertension Canada uses lower thresholds for diabetic patients given their increased cardiovascular risk. Automated office BP (AOBP) avoids white coat effect by taking multiple readings automatically without a provider present."
    difficulty: medium
    tags: [hypertension, diagnosis, thresholds, diabetes, family-medicine]
  - front: "Distinguish between hypertensive urgency and hypertensive emergency."
    back: "Hypertensive urgency: sBP >210 mmHg or dBP >120 mmHg with minimal or no target-organ damage.\nHypertensive emergency: severe HTN (dBP >120 mmHg) WITH acute target-organ damage — acute heart failure, MI, aortic dissection, acute kidney injury, hypertensive encephalopathy, hypertensive retinopathy.\nAccelerated HTN: significant recent BP rise with vascular damage on fundoscopy but without papilledema.\nMalignant HTN: BP sufficient to cause papilledema plus other vascular damage (retinal hemorrhages, bulging discs, mental status changes, rising creatinine).\n\nThe key distinction is end-organ damage. Hypertensive emergency requires immediate IV antihypertensive therapy (carefully controlled reduction) and hospitalization. Urgency can be managed with oral agents and close follow-up."
    difficulty: hard
    tags: [hypertension, emergency, urgency, target-organ-damage, family-medicine]
  - front: "What is white coat hypertension vs. masked hypertension?"
    back: "White coat HTN: high clinic BP with normal home and 24-hr ambulatory BP — caused by anxiety in the clinical setting.\nMasked HTN: normal clinic BP with high BP at home and/or ambulatory setting — often provoked by anxiety, job stress, or exercise.\n\nBoth conditions are identified by comparing office BP with ABPM or HBPM. White coat HTN carries lower CV risk than sustained HTN but may progress. Masked HTN paradoxically carries higher CV risk than white coat HTN and requires treatment."
    difficulty: medium
    tags: [hypertension, white-coat, masked-HTN, ambulatory-BP, family-medicine]
  - front: "What are the most common causes of secondary hypertension?"
    back: "Renal: renovascular HTN, renal parenchymal disease (glomerulonephritis, pyelonephritis, polycystic kidney disease)\nEndocrine: primary hyperaldosteronism, pheochromocytoma, Cushing's syndrome, hyperthyroidism/hyperparathyroidism, hypercalcemia\nVascular: coarctation of the aorta, renal artery stenosis\nDrug-induced: estrogens/OCP, steroids, NSAIDs, MAOIs, lithium, decongestants, cocaine, amphetamines, alcohol\n\nSecondary HTN accounts for ~10% of cases but is important to identify as many causes are reversible. Primary hyperaldosteronism is the most common endocrine cause. Suspect renovascular HTN with sudden onset, young age, abdominal bruit, or HTN resistant to ≥3 drugs."
    difficulty: medium
    tags: [hypertension, secondary-hypertension, causes, family-medicine]
  - front: "When should you suspect primary hyperaldosteronism in a hypertensive patient?"
    back: "Suspect when:\n- HTN refractory to treatment with >3 drugs\n- Spontaneous hypokalemia\n- Profound diuretic-induced hypokalemia (<3.0 mmol/L)\n\nInvestigate with plasma aldosterone and plasma renin (aldosterone-to-renin ratio) from morning samples taken in the sitting position after 15 min rest.\n\nPrimary hyperaldosteronism (Conn syndrome) is the most common surgically correctable cause of HTN. A high aldosterone-to-renin ratio is the screening test. Discontinue aldosterone antagonists, ARBs, β-blockers, and clonidine prior to testing as they affect results."
    difficulty: hard
    tags: [hyperaldosteronism, secondary-hypertension, hypokalemia, aldosterone-renin-ratio, family-medicine]
  - front: "What baseline investigations are indicated for ALL patients with newly diagnosed hypertension?"
    back: "Electrolytes, creatinine, fasting blood glucose and/or HbA1c, lipid profile, 12-lead ECG, urinalysis. Self-measurement of BP at home is also encouraged.\n\nThese investigations assess for target organ damage (ECG for LVH; urinalysis for proteinuria), identify contributing metabolic factors (dyslipidemia, DM), and establish a baseline for monitoring treatment effects on renal function and electrolytes."
    difficulty: easy
    tags: [hypertension, investigations, baseline, family-medicine]
  - front: "What are the lifestyle modification targets for hypertension management per Canadian guidelines?"
    back: "- Diet: DASH diet, limit salt to 5 g/day (2000 mg Na), increase dietary potassium\n- Exercise: moderate-intensity dynamic exercise 30–60 min, 4–7×/week\n- Smoking cessation\n- Low-risk alcohol consumption\n- Healthy BMI (18.5–24.9 kg/m²) and waist circumference (<102 cm men, <88 cm women)\n- Individualized stress reduction\nNote: potassium/magnesium/calcium supplements are NOT recommended for HTN\n\nLifestyle changes can reduce sBP by 2–14 mmHg depending on the intervention (e.g., weight loss of 10 kg reduces sBP ~5–20 mmHg; sodium restriction reduces sBP ~2–8 mmHg). These are first-line and must continue alongside pharmacotherapy."
    difficulty: easy
    tags: [hypertension, lifestyle, management, DASH, family-medicine]
  - front: "What are the BP treatment targets per Hypertension Canada guidelines?"
    back: "<140/90 mmHg for most patients.\n<130/80 mmHg for patients with diabetes mellitus.\n\nLower targets in diabetics reflect their higher baseline cardiovascular risk. High-risk populations (Framingham Risk >20%, age >50) should initiate treatment at sBP ≥130 mmHg. The 2017 ACC/AHA guidelines target <130/80 for most — Canadian guidelines are somewhat less aggressive."
    difficulty: easy
    tags: [hypertension, treatment-target, diabetes, family-medicine]
  - front: "What are the indications to initiate antihypertensive pharmacotherapy?"
    back: "- sBP ≥140 mmHg or dBP ≥90 mmHg WITH target organ damage or CV risk factors\n- sBP ≥160 mmHg or dBP ≥100 mmHg WITHOUT target organ damage or CV risk factors\n- sBP ≥130 mmHg for high-risk populations (Framingham Risk >20%, age >50)\n- sBP ≥130 mmHg or dBP ≥80 mmHg for patients with DM\nNote: caution in elderly patients\n\nThresholds balance the benefits of BP reduction against risks of overtreatment (hypotension, falls, adverse drug effects) especially in the elderly. Lower thresholds for high-risk patients reflect the disproportionate CV benefit of treatment."
    difficulty: medium
    tags: [hypertension, pharmacotherapy, indications, family-medicine]
  - front: "What are the first-line antihypertensive drug classes for isolated systolic/diastolic HTN without other compelling indications?"
    back: "Monotherapy: thiazide/thiazide-like diuretics (longer-acting preferred), β-blockers, ACEIs, ARBs, or long-acting CCBs.\nSingle pill combinations: ACEI + CCB, ARB + CCB, or ACEI/ARB + diuretic.\nNote: β-blockers not recommended as monotherapy for age ≥60; ACEIs not recommended as monotherapy in Black patients.\n\nβ-blockers have less benefit for stroke prevention in older patients. ACEIs have reduced efficacy in Black patients likely due to lower renin activity — ARBs or CCBs are preferred. Combination therapy with a single pill improves adherence."
    difficulty: medium
    tags: [hypertension, first-line, antihypertensives, pharmacotherapy, family-medicine]
  - front: "What combination of antihypertensives should be AVOIDED?"
    back: "1. Non-DHP CCB (diltiazem/verapamil) + β-blocker: risk of bradycardia/heart block\n2. ACEI + ARB combination: increased risk of hypotension, hyperkalemia, and renal failure without additive CV benefit\nMonitor potassium and creatinine when combining ACEI/ARB with a potassium-sparing diuretic.\n\nThe ONTARGET trial demonstrated no additional benefit of ACEI+ARB dual blockade but increased harm. Non-DHP CCBs and β-blockers both slow AV conduction, risking severe bradyarrhythmias when combined."
    difficulty: hard
    tags: [hypertension, drug-combinations, avoid, ACEI-ARB, family-medicine]
  - front: "What are the preferred antihypertensive agents in each of the following specific comorbidities: (a) heart failure, (b) post-MI, (c) CAD, (d) DM with albuminuria, (e) cerebrovascular disease?"
    back: "(a) Heart failure: ACEI (or ARB) + β-blockers + aldosterone antagonists; ARB/neprilysin inhibitor for HFrEF on guideline therapy\n(b) Post-MI: β-blocker + ACEI (or ARB if ACEI intolerant)\n(c) CAD: ACEI or ARB; β-blocker or CCB for stable angina; avoid short-acting nifedipine\n(d) DM with albuminuria: ACEI or ARB (preferred over thiazide if adding DHP CCB)\n(e) Cerebrovascular disease: ACEI + thiazide/thiazide-like diuretic combination\n\nCompelling indications drive drug selection beyond BP control. ACE inhibitors reduce mortality in HF and post-MI. ACEI/ARB provide renoprotection in diabetic nephropathy. The PROGRESS trial established ACEI + thiazide combination for secondary stroke prevention."
    difficulty: hard
    tags: [hypertension, compelling-indications, heart-failure, MI, diabetes, stroke, family-medicine]
  - front: "What antihypertensive medications are safe in pregnancy and lactation?"
    back: "Pregnancy first-line (oral): Labetalol, Methyldopa, Long-acting oral nifedipine\nPregnancy second-line: Clonidine, Hydralazine, Thiazide diuretics, Other β-blockers (acebutolol, metoprolol, pindolol, propranolol)\nAVOID in pregnancy: ACEIs and ARBs (fetotoxic to renal system)\nSafe in lactation: Labetalol, Methyldopa, Long-acting nifedipine, Enalapril, Captopril\n\nACEIs and ARBs are absolutely contraindicated in pregnancy (Category D/X) due to fetal renal dysgenesis, oligohydramnios, and neonatal renal failure. Labetalol and methyldopa have the longest safety record in obstetric hypertension."
    difficulty: hard
    tags: [hypertension, pregnancy, lactation, labetalol, methyldopa, ACEI, ARB, family-medicine]
  - front: "What are the follow-up intervals for hypertension management in Canadian primary care?"
    back: "Lifestyle modification: follow-up every 3–6 months.\nPharmacological: follow-up every 1–2 months until BP under target for 2 consecutive visits, then every 3–6 months once at target.\nFrequent follow-up: for symptomatic/severe HTN, drug intolerance, or target organ damage.\nReferral: for refractory HTN, suspected secondary causes, or worsening renal failure.\nHospitalization: for malignant HTN.\n\nRegular follow-up is essential to assess adherence to both lifestyle and pharmacotherapy, monitor for drug side effects, and ensure BP target is maintained. Refractory HTN (uncontrolled on ≥3 drugs including a diuretic) warrants workup for secondary causes."
    difficulty: easy
    tags: [hypertension, follow-up, management, family-medicine]
  - front: "What is isolated systolic hypertension and what population is typically affected?"
    back: "Isolated systolic HTN: sBP ≥140 mmHg AND dBP <90 mmHg. Associated with progressive reduction in vascular compliance (arterial stiffness). Usually begins in the 40s.\n\nAs arteries stiffen with age, the aorta can no longer effectively dampen the systolic pulse wave, causing elevated sBP with normal or even low dBP. It is the most common form of HTN in older adults and is a stronger predictor of cardiovascular risk in the elderly than diastolic HTN."
    difficulty: medium
    tags: [hypertension, isolated-systolic, vascular-compliance, elderly, family-medicine]
  - front: "What is renovascular hypertension and when should it be suspected?"
    back: "Suspect renovascular HTN when ≥2 of the following are present:\n- Sudden onset or worsening of HTN AND age >55 or <30\n- Presence of abdominal bruit\n- HTN resistant to 3 or more drugs\n- Rise in creatinine ≥30% associated with use of ACEI or ARB\n- Other atherosclerotic vascular disease (especially smokers or dyslipidemia)\n- Recurrent pulmonary edema associated with hypertensive surges\nInvestigate: renal ultrasound, captopril renal scan (if GFR >60), MRA/CTA (if normal renal function).\n\nRenovascular HTN from renal artery stenosis causes renin-dependent HTN. ACEI/ARB cause rise in creatinine by reducing glomerular filtration pressure in the stenotic kidney. Fibromuscular dysplasia is the cause in young women; atherosclerosis in older patients."
    difficulty: hard
    tags: [hypertension, renovascular, renal-artery-stenosis, secondary-hypertension, family-medicine]
