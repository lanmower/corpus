# General (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What are the first-line treatments for bacterial vaginosis?"
    back: "Metronidazole 500 mg PO BID x 7 days, OR metronidazole 0.75% gel intravaginally nightly x 5 days, OR clindamycin 2% cream intravaginally nightly x 7 days\n\nBV is caused by anaerobic overgrowth. Metronidazole and clindamycin are both effective against the anaerobic organisms involved."
    difficulty: easy
    tags: [gynecology, bacterial vaginosis, treatment, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "When should vulvovaginal candidiasis be treated?"
    back: "Only treat if patient is symptomatic\n\nAsymptomatic candidiasis does not require treatment as Candida can be a normal commensal in the vaginal flora."
    difficulty: easy
    tags: [gynecology, infectious disease, candidiasis, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is first-line treatment for bacterial vaginosis?"
    back: "Metronidazole 500mg PO BID x 7 days OR Metronidazole 0.75% gel intravaginally nightly x 5 days OR Clindamycin 2% cream intravaginally nightly x 7 days\n\nMetronidazole is the preferred oral treatment. Alternative regimens include topical clindamycin for patients who cannot tolerate metronidazole."
    difficulty: easy
    tags: [gynecology, infectious disease, bacterial vaginosis, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are alternative treatments for bacterial vaginosis (second-line)?"
    back: "Metronidazole 2g PO single dose OR Clindamycin 300mg PO BID x 7 days\n\nSecond-line options are used when first-line treatment fails or is not tolerated."
    difficulty: medium
    tags: [gynecology, bacterial vaginosis, STI, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the recommended suppressive therapy for herpes at 36 weeks gestation?"
    back: "Acyclovir 400mg PO TID daily OR Valacyclovir 500mg PO BID at 36 weeks\n\nSuppressive therapy near term reduces the need for cesarean delivery due to active lesions at delivery."
    difficulty: medium
    tags: [obstetrics, herpes, pregnancy, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the first-line oral treatment for vulvovaginal candidiasis?"
    back: "Fluconazole 150 mg PO single dose\n\nFluconazole is the oral treatment of choice. Treatment is only indicated if the patient is symptomatic."
    difficulty: easy
    tags: [gynecology, candidiasis, fungal, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the first-line treatment for bacterial vaginosis?"
    back: "Metronidazole 500 mg PO BID for 7 days\n\nMetronidazole is the first-line oral therapy. Alternatives include metronidazole gel or clindamycin cream."
    difficulty: easy
    tags: [gynecology, bacterial vaginosis, treatment, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the alternative treatments for bacterial vaginosis?"
    back: "Metronidazole 0.75% gel: one applicator (5 g) intravaginally at bedtime for 5 days, OR clindamycin 2% cream: one applicator (5 g) intravaginally at bedtime for 7 days\n\nTopical alternatives are available for patients who cannot tolerate oral metronidazole."
    difficulty: easy
    tags: [gynecology, bacterial vaginosis, treatment, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the three most common STIs associated with vaginal discharge in adult women?"
    back: "Bacterial vaginosis (BV), vulvovaginal candidiasis (VVC), and trichomoniasis\n\nThese three infections account for the majority of vaginal discharge complaints in adult women and require different treatment approaches."
    difficulty: easy
    tags: [STI, vaginal-discharge, gynecology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the first-line oral treatment for bacterial vaginosis?"
    back: "Metronidazole 500 mg PO twice daily for 7 days\n\nMetronidazole 500mg BID x7 days is the preferred oral regimen for BV."
    difficulty: easy
    tags: [gynecology, bacterial vaginosis, antibiotic, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the first-line topical treatment for bacterial vaginosis?"
    back: "Metronidazole 0.75% gel: one applicator (5g) intravaginally at bedtime for 5 days OR Clindamycin 2% cream: one applicator (5g) at bedtime for 7 days\n\nTopical alternatives to oral metronidazole are effective for BV treatment."
    difficulty: easy
    tags: [gynecology, bacterial vaginosis, antibiotic, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is suppressive therapy dose for herpes genitalis at 36 weeks gestation?"
    back: "Acyclovir 400 mg PO TID daily OR valacyclovir 500 mg PO BID starting at 36 weeks\n\nSuppressive therapy in late pregnancy reduces viral shedding and need for cesarean delivery."
    difficulty: medium
    tags: [obstetrics, herpes, HSV, antiviral, pregnancy, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the cause of vulvovaginal candidiasis?"
    back: "Candida species (most commonly Candida albicans)\n\nCandida is a yeast that can cause vulvovaginal infection when it overgrows."
    difficulty: easy
    tags: [gynecology, candidiasis, yeast, microbiology, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the second-line oral treatment for bacterial vaginosis?"
    back: "Metronidazole 2g PO single dose OR clindamycin 300 mg PO BID x7 days"
    difficulty: easy
    tags: [gynecology, bacterial vaginosis, antibiotic, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the topical treatment for bacterial vaginosis using metronidazole gel?"
    back: "Metronidazole 0.75% gel - one applicator (5 g) intravaginally at bedtime for 5 days\n\nTopical metronidazole is an alternative for patients who cannot tolerate oral therapy."
