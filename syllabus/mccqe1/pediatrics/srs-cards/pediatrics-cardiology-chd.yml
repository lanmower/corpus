# Pediatrics Cardiology Chd (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the three fetal circulatory shunts, and what happens to each at birth?"
    back: "1. Ductus arteriosus (pulmonary artery → aorta): closes with increased O₂ concentration after first breath → decreased prostaglandins → closure. 2. Foramen ovale (RA → LA): closes with increased left atrial pressure from increased pulmonic blood flow. 3. Ductus venosus (umbilical vein → IVC): closes with separation of low-resistance placenta.\n\nFetal circulation is designed to preferentially deliver oxygenated blood to the brain and myocardium. At birth, with the first breath, pulmonary resistance decreases, pulmonary blood flow increases, and systemic resistance rises. Understanding these transitions is fundamental to the pathophysiology of congenital heart disease."
    difficulty: medium
    tags: [pediatrics, cardiology, fetal circulation, congenital heart disease, ductus arteriosus]
  - front: "What is the most common congenital heart defect, and what is the most common cyanotic congenital heart defect diagnosed beyond infancy?"
    back: "Most common overall CHD: ventricular septal defect (VSD) — 30–50% of all CHD. Most common cyanotic CHD beyond infancy: Tetralogy of Fallot (10% of CHD, peak incidence 2–4 months).\n\nThe most common cyanotic CHD in neonates is transposition of the great arteries (TGA). VSD accounts for the largest proportion of congenital heart defects. The epidemiology of CHD is 8 per 1000 live births overall."
    difficulty: easy
    tags: [pediatrics, cardiology, VSD, tetralogy of Fallot, congenital heart disease]
  - front: "What are the characteristic CXR findings for Tetralogy of Fallot, Transposition of Great Arteries, and Total Anomalous Pulmonary Venous Return?"
    back: "Tetralogy of Fallot: boot-shaped heart (coeur en sabot), decreased pulmonary vasculature, right aortic arch in 25%. Transposition of Great Arteries: egg-shaped heart with narrow mediastinum ('egg on a string'). Total Anomalous Pulmonary Venous Return: 'snowman' heart.\n\nThese are classic radiological signs tested on MCCQE1. Boot-shaped heart reflects right ventricular hypertrophy with pulmonary oligemia. The egg-on-a-string appearance in TGA is due to the narrow superior mediastinum from the parallel position of the great vessels."
    difficulty: easy
    tags: [pediatrics, cardiology, CXR, tetralogy of Fallot, TGA, TAPVR, congenital heart disease]
  - front: "What are the three types of Atrial Septal Defect (ASD), which is most common, and what are the characteristic physical exam and ECG findings?"
    back: "Types: ostium secundum (most common, 50–70%, at septum between LA and RA), ostium primum (common in Down syndrome, near mitral/tricuspid valves), sinus venosus (at SVC–RA junction). Physical exam: grade 2–3/6 pulmonic outflow murmur, widely split and fixed S2. ECG: RAD, mild RVH, RBBB.\n\nThe fixed split S2 is pathognomonic for ASD. The split is fixed because ASD equalizes preload between ventricles throughout the respiratory cycle. ASDs <8 mm have an 80–100% spontaneous closure rate. Surgical or catheter closure is done electively between ages 2–5 years if indicated."
    difficulty: medium
    tags: [pediatrics, cardiology, ASD, atrial septal defect, congenital heart disease]
  - front: "What is the relationship between VSD size and murmur intensity, and what are the clinical features of moderate-to-large VSD?"
    back: "VSD size is INVERSELY related to murmur intensity — a smaller VSD produces a louder murmur. Moderate-to-large VSD: holosystolic murmur at LLSB, mid-diastolic rumble at apex, delayed growth, decreased exercise tolerance, recurrent URTIs/'asthma' episodes, loss of S2 splitting and loud P2 (suggests pulmonary HTN). CHF develops by 2 months if untreated.\n\nThe inverse relationship between VSD size and murmur intensity is a classic exam pearl. A restrictive (small) VSD creates a high-pressure gradient across a small defect — loud murmur. A large VSD has equalized pressures, reducing turbulence — softer murmur. Surgical closure before 1 year is required for large VSDs to prevent irreversible pulmonary vascular disease."
    difficulty: medium
    tags: [pediatrics, cardiology, VSD, ventricular septal defect, murmur]
  - front: "What is the classic murmur of Patent Ductus Arteriosus (PDA), and how does management differ between premature and term infants?"
    back: "Classic murmur: continuous 'machinery' murmur best heard at left infraclavicular area, with bounding pulses and wide pulse pressure. Premature infants: indomethacin (Indocid®) — antagonizes prostaglandin E2 that maintains ductal patency; effective only in premature infants. Term infants: indomethacin NOT effective; catheter or surgical closure if causing respiratory compromise, FTT, or persists beyond 3 months.\n\nPDA occurs due to failure of the ductus arteriosus to close after birth. In premature infants, the ductal smooth muscle is less responsive to oxygen, so indomethacin (a prostaglandin inhibitor) is effective. In term infants, the pathophysiology is a structural/functional defect, making indomethacin ineffective. PDA accounts for 5–10% of CHD."
    difficulty: medium
    tags: [pediatrics, cardiology, PDA, patent ductus arteriosus, indomethacin]
  - front: "What are the clinical features and associations of Coarctation of the Aorta?"
    back: "Definition: narrowing of aorta at the level of the ductus arteriosus. Associations: bicuspid aortic valve (50%), Turner syndrome (35%). Physical exam: BP discrepancy between upper and lower extremities (>20 mmHg is significant), diminished/delayed femoral pulses (brachial-femoral delay), systolic murmur at apex/left axilla/left back. Severe: shock in neonatal period when ductus closes. Management: prostaglandins to keep ductus patent → surgical correction in neonates; balloon arterioplasty for older infants/children.\n\nCoarctation of the aorta is a classic cause of hypertension in a young person with differential blood pressures. Turner syndrome (45,X) has a strong association. ECG shows RVH in early infancy and LVH later. Complications include HTN; associated with PDA/VSD → CHF."
    difficulty: medium
    tags: [pediatrics, cardiology, coarctation of aorta, Turner syndrome, hypertension]
  - front: "What are the four components of Tetralogy of Fallot, and how do 'tet spells' present and get managed?"
    back: "Four components (PROVE mnemonic): Pulmonary stenosis/RVOTO, Right ventricular hypertrophy, Overriding aorta, VSD. Tet spells: triggered by exertion (crying, exercise) → increased pulmonary vascular resistance + decreased systemic resistance → increased R-to-L shunting → paroxysmal cyanosis, rapid deep breathing, irritability, decreased murmur intensity; patient squats for relief. Management: O₂, knee-chest position, IV fluid bolus, morphine sulfate, propranolol, phenylephrine. Definitive treatment: surgical repair at 4–6 months.\n\nSquatting increases peripheral vascular resistance, which reduces right-to-left shunting and improves oxygenation. The knee-chest position achieves the same effect in infants. Tetralogy of Fallot has an embryological origin from anterior-superior deviation of the outlet septum. CXR shows boot-shaped heart with decreased pulmonary vasculature."
    difficulty: hard
    tags: [pediatrics, cardiology, tetralogy of Fallot, tet spells, cyanotic CHD]
  - front: "What is the pathophysiology of Transposition of the Great Arteries (TGA) and how is it initially managed?"
    back: "Pathophysiology: parallel pulmonary and systemic circulations — systemic: body→RA→RV→aorta→body; pulmonary: lungs→LA→LV→PA→lungs. Survival depends on mixing via PDA, ASD, or VSD. CXR: egg-shaped heart ('egg on a string'). Initial management: prostaglandin E1 infusion to keep ductus open → balloon atrial septostomy (Rashkind). Surgical repair: arterial switch operation within first 2 weeks (before LV muscle mass decreases). TGA without VSD has no murmur.\n\nTGA is the most common cyanotic CHD in neonates (3–5% of all CHD). Without mixing, oxygenated blood circulates only through the pulmonary circuit, and deoxygenated blood only through the systemic circuit — incompatible with life. The arterial switch operation must be done early while the LV is still conditioned to handle systemic pressures."
    difficulty: hard
    tags: [pediatrics, cardiology, TGA, transposition of great arteries, arterial switch, cyanotic CHD]
  - front: "What is the hyperoxic (hyperoxia) test and how is it interpreted in a cyanotic neonate?"
    back: "Procedure: obtain preductal (right radial) ABG in room air, then repeat after the child breathes 100% O₂ for 10 minutes. Interpretation: if PaO₂ improves to >150 mmHg → cyanosis is less likely cardiac in origin (more likely pulmonary). If PaO₂ remains low (<150 mmHg) → cardiac cyanosis likely (R-to-L shunt). Pre- and post-ductal pulse oximetry: >5% difference suggests R-to-L shunt.\n\nThe hyperoxia test exploits the fact that pulmonary causes of cyanosis (e.g., respiratory distress syndrome) respond to supplemental oxygen, whereas cardiac R-to-L shunts do not, because blood bypasses the alveoli entirely. Pre- vs post-ductal oxygen saturation differences help identify ductal-dependent lesions."
    difficulty: hard
    tags: [pediatrics, cardiology, hyperoxia test, cyanosis, neonatal, congenital heart disease]
  - front: "What is Hypoplastic Left Heart Syndrome (HLHS) and how is it managed?"
    back: "HLHS: LV hypoplasia ± atretic/stenotic mitral and/or aortic valve, small ascending aorta, and coarctation. Epidemiology: 1–3% of CHD; most common cause of cardiac death in first month of life. Systemic circulation is ductus-dependent. Presentation: circulatory shock + metabolic acidosis when ductus closes. Management: intubate, correct metabolic acidosis, IV prostaglandin E1 to keep ductus patent, surgical palliation (Norwood procedure, overall survival 50%) or heart transplant.\n\nHLHS is a duct-dependent lesion — any neonate presenting with cardiogenic shock shortly after birth should raise suspicion for HLHS or critical coarctation, both of which require immediate prostaglandin E1. The 4 key features are hypoplastic LV, narrow mitral/aortic valves, small ascending aorta, and coarctation."
    difficulty: hard
    tags: [pediatrics, cardiology, HLHS, hypoplastic left heart, ductus dependent, congenital heart disease]
  - front: "What are the 5 Ts of cyanotic congenital heart disease?"
    back: "1. Tetralogy of Fallot, 2. Transposition of the great vessels, 3. Tricuspid atresia, 4. Truncus arteriosus, 5. Total anomalous pulmonary venous return (TAPVR).\n\nThe 5 Ts is a classic mnemonic for cyanotic CHD. Each involves right-to-left shunting or a mixing lesion where deoxygenated blood enters the systemic circulation. Ebstein's anomaly and Hypoplastic Left Heart Syndrome are additional cyanotic lesions that don't fit the T mnemonic. All present with cyanosis that fails to improve significantly with supplemental oxygen."
    difficulty: easy
    tags: [pediatrics, cardiology, cyanotic CHD, 5 Ts, congenital heart disease]
  - front: "What are the four key clinical features of pediatric congestive heart failure?"
    back: "The '2 Tachys and 2 Megalys': Tachycardia, Tachypnea, Cardiomegaly, Hepatomegaly. Additional features in infants: weak cry, diaphoresis while eating/sleeping, feeding difficulties, FTT. In children: decreased exercise tolerance, frequent URTIs or 'asthma' episodes.\n\nPediatric CHF differs from adult CHF in that orthopnea, paroxysmal nocturnal dyspnea, and pedal edema are uncommon in children. The predominant features in infants are feeding difficulties and diaphoresis. The most common causes are CHD, cardiomyopathy, high-output states, pressure overload (aortic/pulmonary stenosis), and volume overload (L-to-R shunts)."
    difficulty: easy
    tags: [pediatrics, cardiology, CHF, congestive heart failure, heart failure]
  - front: "What is Total Anomalous Pulmonary Venous Return (TAPVR) and what is the required management?"
    back: "All pulmonary veins drain into the right-sided circulation (systemic veins or RA) instead of the LA. No direct oxygenated pulmonary venous return to the LA. An ASD must be present for oxygenated blood to reach the systemic circulation. Often associated with obstruction at connection sites. CXR: 'snowman' heart. Management: surgical repair required in ALL cases; urgent surgery for severe cyanosis.\n\nTAPVR accounts for 1–2% of CHD. It is a mixing lesion and is included among the cyanotic CHDs. The presence of obstruction at the anomalous connection determines severity — obstructed TAPVR presents with severe cyanosis and pulmonary edema in the newborn period and is a surgical emergency."
    difficulty: hard
    tags: [pediatrics, cardiology, TAPVR, total anomalous pulmonary venous return, cyanotic CHD]
  - front: "What are the acyanotic vs. cyanotic classifications of congenital heart disease and the mechanism explaining cyanosis?"
    back: "Acyanotic CHD (L-to-R shunt or obstruction beyond lungs): blood passes through pulmonary circulation → oxygenation occurs → low levels of deoxygenated Hb in systemic circulation → no cyanosis. Examples: ASD, VSD, PDA, coarctation, aortic/pulmonary stenosis. Cyanotic CHD (R-to-L shunt): blood bypasses lungs → no oxygenation → high levels of deoxygenated Hb in systemic circulation → cyanosis (absolute deoxygenated Hb ≥30 g/dL). Examples: 5 Ts + Ebstein's anomaly + HLHS.\n\nCyanosis becomes clinically apparent when absolute concentration of deoxygenated hemoglobin reaches 30 g/dL. This is why anemic patients may not appear cyanotic despite severe hypoxemia. Untreated L-to-R shunts can eventually reverse to R-to-L (Eisenmenger syndrome) due to progressive pulmonary vascular disease."
    difficulty: medium
    tags: [pediatrics, cardiology, cyanosis, acyanotic, cyanotic CHD, shunts]
