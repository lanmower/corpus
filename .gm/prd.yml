- id: checkin-render-plan-in-thread
  title: Daily check-in session plan shown only as truncated 6s/120-char toast then markCheckedIn consumes it (tutor-panel.js:519-523) — the generated plan is discarded. Render the overview into the chat thread or a pinned card.
  phase: EXECUTE
