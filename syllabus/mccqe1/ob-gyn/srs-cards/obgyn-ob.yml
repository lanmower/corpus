  - front: "What is the treatment for recurrent herpes in pregnancy in patients with prior infection within the previous year?"
    back: "Acyclovir 800 mg PO BID x 5 days, OR 800 mg PO TID x 2 days, OR valacyclovir 500 mg PO BID x 3 days, OR 1 g PO daily x 5 days\n\nRecurrent episodes in pregnancy are treated with shorter antiviral courses."
    difficulty: medium
    tags: [obstetrics, HSV, pregnancy, recurrent, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "When is treatment required for bacterial vaginosis?"
    back: "Treat only if symptomatic; asymptomatic patients require treatment only if high-risk pregnancy, prior IUD insertion, gynecologic surgery, induced abortion, or upper tract instrumentation\n\nBV is caused by overgrowth of Gardnerella vaginalis, Mycoplasma hominis, and anaerobes. Treatment is generally unnecessary unless specific obstetric/gynecologic risks exist."
    difficulty: medium
    tags: [gynecology, bacterial vaginosis, treatment, obstetrics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "How is first-episode herpes simplex virus treated in pregnancy?"
    back: "Acyclovir 400 mg PO TID x 7-10 days OR valacyclovir 1 g PO BID x 7-10 days\n\nFirst-episode HSV in pregnancy requires treatment to reduce viral shedding and risk of neonatal transmission."
    difficulty: medium
    tags: [obstetrics, HSV, herpes, pregnancy, antiviral, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "How is recurrent HSV managed in pregnancy for patients with prior infection within the previous year?"
    back: "Acyclovir 800 mg PO BID x 5 days OR 800 mg PO TID x 2 days OR valacyclovir 500 mg PO BID x 3 days or 1 g daily x 5 days; suppressive therapy at 36 weeks: acyclovir 400 mg PO TID daily or valacyclovir 500 mg PO BID\n\nSuppressive therapy at 36 weeks reduces HSV recurrence at delivery and need for cesarean section."
    difficulty: hard
    tags: [obstetrics, HSV, herpes, pregnancy, antiviral, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the screening laboratory values for hemochromatosis?"
    back: "Transferrin saturation (Fe/TIBC) >45% and serum ferritin >400 ng/mL\n\n90% of primary hemochromatosis involves the C282Y allele of the HFE gene."
    difficulty: medium
    tags: [hemochromatosis, diagnosis, screening, laboratory, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What laboratory findings are characteristic of Primary Biliary Cholangitis?"
    back: "Increased ALP, GGT, bilirubin (later), elevated IgM, increased cholesterol (especially HDL)\n\nThe cholestatic pattern (high ALP/GGT) is hallmark. Bilirubin rises in later stages. Elevated IgM and cholesterol (particularly HDL) are common."
    difficulty: medium
    tags: [PBC, laboratory, ALP, cholestasis, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What are the screening laboratory criteria for hemochromatosis?"
    back: "Transferrin saturation >45%, Serum ferritin >400 ng/mL\n\nElevated transferrin saturation (>45%) and ferritin (>400 ng/mL) are initial screening tests indicating possible iron overload and warrant further investigation."
    difficulty: easy
    tags: [hemochromatosis, diagnosis, hepatology, investigations, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the approach to evaluating chronic diarrhea?"
    back: "Chronic diarrhea evaluation requires systematic assessment including history, physical exam, laboratory tests, endoscopy, and imaging based on clinical presentation\n\nA review (NEJM 1995) outlines the diagnostic approach to chronic diarrhea including differential diagnosis and appropriate investigations"
    difficulty: hard
    tags: [chronic diarrhea, diarrhea, diagnosis, gastroenterology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What laboratory findings are characteristic of active SLE?"
    back: "Low complement (C3, C4), low hemolytic complement (CH50), and often false positive VDRL\n\nSLE can also present with leukopenia, lymphopenia, and proteinuria."
    difficulty: easy
    tags: [sle, laboratory, complement, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the hallmark laboratory finding in polymyositis/dermatomyositis?"
    back: "Elevated CK (creatine kinase) in 80% of patients\n\nDiagnosis is confirmed with muscle biopsy, EMG, and sometimes MRI."
    difficulty: easy
    tags: [polymyositis, dermatomyositis, laboratory, ck, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "Can hydronephrosis be physiologic?"
    back: "Yes, for example in pregnancy (gravid uterus compresses ureters and progesterone decreases ureteral tone)\n\nPhysiologic hydronephrosis in pregnancy typically resolves postpartum and may not require intervention."
    difficulty: easy
    tags: [hydronephrosis, physiologic, pregnancy, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
