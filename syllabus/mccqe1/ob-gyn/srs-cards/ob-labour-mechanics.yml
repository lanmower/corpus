# Ob Labour Mechanics (ObGyn) - generated from srs-mccqe1
cards:
  - front: "List the cardinal movements of fetal delivery in order."
    back: "1. Head floating (before engagement)\n2. Engagement\n3. Descent + flexion\n4. Further descent + internal rotation beginning\n5. Complete internal rotation\n6. Extension (complete)\n7. Restitution (external rotation)\n8. Delivery of anterior shoulder\n9. Delivery of posterior shoulder\n\nThe cardinal movements describe the sequence of fetal head and body movements as the fetus navigates the birth canal. Internal rotation brings the occiput to the pubic symphysis (OA position). Extension delivers the head under the pubic arch. Restitution/external rotation aligns the head with the shoulders for delivery."
    difficulty: medium
    tags: [obstetrics, labour, cardinal movements, fetal delivery, mechanism of labour]
