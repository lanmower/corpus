  - front: "What are the common side effects of SNRIs (e.g., venlafaxine)?"
    back: "Insomnia, tremors, tachycardia, sweating\n\nSNRIs block serotonin and norepinephrine reuptake, causing sympathetic side effects like insomnia, tremors, tachycardia, and sweating."
    difficulty: easy
    tags: [psychiatry, pharmacology, SNRI, depression, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
