# Sexually Transmitted Infections (InfectiousDisease) - generated from srs-mccqe1
cards:
  - front: "A 22-year-old woman has mucopurulent cervical discharge and cervical motion tenderness. Cervical NAAT is positive for Chlamydia trachomatis. Diagnosis and treatment?"
    back: "Chlamydial cervicitis (or pelvic inflammatory disease if upper tract involvement); treat with doxycycline 100mg BID x7 days (or azithromycin 1g single dose for uncomplicated)\n\nPHAC/AMMI STI guidelines recommend doxycycline as preferred treatment for chlamydial infections; azithromycin single-dose acceptable for uncomplicated urethral/cervical infection but inferior for rectal chlamydia. Test-of-cure not routinely required. Treat partners within 60 days."
    difficulty: medium
    tags: [chlamydia, STI, doxycycline, cervicitis, infectious disease]
  - front: "What is the treatment for gonorrhea per current Canadian guidelines?"
    back: "Ceftriaxone 500 mg IM single dose (1g if weight >150kg); test-of-cure recommended at 1 week; treat all partners and retest for chlamydia\n\nPHAC STI guidelines updated due to rising fluoroquinolone and azithromycin resistance in Neisseria gonorrhoeae. Ceftriaxone remains effective. Dual therapy (with azithromycin) no longer recommended routinely. Disseminated gonococcal infection (septic arthritis, skin lesions): IV ceftriaxone."
    difficulty: medium
    tags: [gonorrhea, ceftriaxone, NAAT, STI treatment, infectious disease]
  - front: "A pregnant woman has a positive RPR (1:64) and positive FTA-ABS. She has no prior treatment. What is the treatment?"
    back: "Primary/secondary/early latent syphilis in pregnancy: benzathine penicillin G 2.4 million units IM single dose — penicillin allergy: desensitize and give penicillin (no safe alternatives in pregnancy)\n\nPHAC STI guidelines: all pregnant women should be screened for syphilis at first prenatal visit and at 28-32 weeks (and delivery) in high-prevalence areas. Congenital syphilis is preventable with timely treatment. Penicillin is the only proven treatment to prevent congenital transmission."
    difficulty: hard
    tags: [syphilis in pregnancy, benzathine penicillin, congenital syphilis, RPR, SOGC, infectious disease]
  - front: "What are the stages of syphilis and their clinical features?"
    back: "Primary: painless chancre (2-3 weeks post-exposure); Secondary: diffuse maculopapular rash including palms/soles, condylomata lata, mucous patches (6-8 weeks); Latent: asymptomatic; Tertiary: gummas, cardiovascular (aortitis), neurosyphilis\n\nAll stages require treatment. Late latent or unknown duration syphilis: benzathine penicillin G 2.4 million units IM x3 weeks. Neurosyphilis: IV penicillin G for 10-14 days. Diagnosis: RPR/VDRL (non-treponemal) + FTA-ABS/TPPA (treponemal confirmatory)."
    difficulty: medium
    tags: [syphilis stages, primary syphilis, secondary syphilis, treatment, infectious disease]
  - front: "What is pelvic inflammatory disease (PID) and how is it treated?"
    back: "PID: infection of upper female genital tract (endometrium, fallopian tubes, ovaries); treat outpatient with ceftriaxone 500mg IM single dose + doxycycline 100mg BID x14 days + metronidazole 500mg BID x14 days\n\nPID is usually polymicrobial (N. gonorrhoeae, C. trachomatis, anaerobes). Laparoscopy is gold standard for diagnosis but not required. Sequelae: chronic pelvic pain, infertility, ectopic pregnancy. Hospitalise if: severe illness, tubo-ovarian abscess, pregnancy, surgical emergency cannot be excluded."
    difficulty: hard
    tags: [PID, pelvic inflammatory disease, ceftriaxone, doxycycline, STI treatment, infectious disease]
  - front: "A 27-year-old man has painful penile vesicles that ulcerate. Tzanck smear shows multinucleated giant cells. Diagnosis and treatment?"
    back: "Genital herpes (HSV-2 most common, HSV-1 also possible); treat with oral acyclovir 400mg TID x7-10 days for primary episode, or valacyclovir 1g BID x5-10 days\n\nPHAC STI guidelines recommend antiviral therapy for all primary genital herpes episodes regardless of symptom duration. Suppressive therapy (valacyclovir 500mg OD daily) reduces recurrences and transmission. PCR is more sensitive than Tzanck smear for diagnosis."
    difficulty: medium
    tags: [genital herpes, HSV, acyclovir, valacyclovir, STI treatment, infectious disease]
  - front: "What is HIV post-exposure prophylaxis (PEP) for sexual exposure and what are the criteria?"
    back: "PEP: TDF/FTC + bictegravir (or DTG/RAL) for 28 days; start within 72 hours of exposure; indicated for high-risk exposures (unprotected anal/vaginal sex with HIV-positive source or unknown status in high-prevalence setting)\n\nPHAC guidelines recommend PEP for receptive anal sex with HIV-positive partner (highest risk). Risk assessment using estimated transmission probability. Document HIV-negative status of recipient before starting. Follow-up HIV testing at 4-6 weeks and 3 months. Discuss PrEP transition."
    difficulty: hard
    tags: [PEP, HIV post-exposure, sexual exposure, TDF/FTC, infectious disease]
  - front: "What is the recommended screening frequency for STIs in sexually active MSM?"
    back: "Syphilis, gonorrhea (pharynx, rectum, urethra), chlamydia every 3 months if high-risk (multiple partners, no consistent condom use, illicit drug use during sex, partner with STI/HIV)\n\nPHAC STI guidelines recommend more frequent screening for MSM at high risk. Regular HIV and hepatitis C testing recommended. HPV vaccine recommended for MSM up to age 45. Hepatitis A and B vaccination."
    difficulty: easy
    tags: [MSM screening, STI screening, gonorrhea, chlamydia, syphilis, infectious disease]
  - front: "A 25-year-old woman has a thin homogeneous vaginal discharge with fishy odor (whiff test positive). Clue cells seen on wet mount. Diagnosis and treatment?"
    back: "Bacterial vaginosis; treat with metronidazole 500mg BID x7 days or metronidazole 0.75% vaginal gel x5 days or clindamycin vaginal cream x7 days\n\nBacterial vaginosis results from overgrowth of anaerobes (Gardnerella vaginalis) replacing normal Lactobacillus flora. Amsel criteria (3 of 4): thin homogeneous discharge, clue cells, vaginal pH >4.5, positive whiff test. Partners do not require treatment (not an STI)."
    difficulty: medium
    tags: [bacterial vaginosis, BV, metronidazole, clue cells, infectious disease]
  - front: "What is the treatment for Trichomonas vaginalis infection?"
    back: "Metronidazole 2g PO single dose (or 500mg BID x7 days) for both patient and sexual partners simultaneously\n\nTrichomoniasis is the most common curable STI. Presentations: yellow-green frothy discharge, vulvar pruritus, \"strawberry cervix\" (punctate hemorrhages). PHAC guidelines: treat all sexual partners. Test-of-cure recommended if symptoms persist."
    difficulty: easy
    tags: [trichomoniasis, Trichomonas, metronidazole, STI treatment, infectious disease]
  - front: "What is uncomplicated gonorrhea treatment in Canada?"
    back: "Ceftriaxone 250-500mg IM single dose\n\nTest of cure 2-4 weeks. Treat partners. Report to public health. Screen concurrent CT/HIV."
    difficulty: medium
    tags: [gonorrhea, PHAC]
  - front: "What is the recommended treatment for uncomplicated gonorrhea per Canadian guidelines?"
    back: "Ceftriaxone 500 mg IM × 1 dose (if <150 kg; 1g if ≥150 kg). If cephalosporin allergy: gentamicin 240 mg IM + azithromycin 2g PO. Always treat empirically for concurrent chlamydia: doxycycline 100 mg BID × 7 days (preferred over azithromycin 1g).\n\nCanadian STI guidelines 2024 no longer recommend dual therapy with azithromycin for gonorrhea (ceftriaxone alone sufficient). Doxycycline added for chlamydia co-treatment. Test of cure at 2 weeks for pharyngeal GC (harder to eradicate). NAAT at 3-6 months for reinfection. Report to public health."
    difficulty: hard
    tags: [STI, gonorrhea, ceftriaxone, chlamydia, treatment, ID]
  - front: "What is the screening protocol for STIs in Canada?"
    back: "Screen all sexually active individuals: gonorrhea/chlamydia NAAT (urine or swab), syphilis serology, HIV (opt-out). High-risk (MSM, multiple partners, PWID): screen q3-6 months including pharyngeal/rectal sites. Pregnant: syphilis + HIV + HBV + GC/CT at first prenatal visit.\n\nPHAC STI screening guidelines prioritize NAAT over culture for GC/CT (higher sensitivity). Extragenital screening (pharyngeal, rectal) important for MSM — many infections asymptomatic at these sites. Syphilis screening: RPR or VDRL (non-treponemal) → confirm with TP-PA or FTA-ABS (treponemal). Reverse screening algorithm increasingly used."
    difficulty: medium
    tags: [STI, screening, NAAT, syphilis, gonorrhea, chlamydia, ID]
  - front: "What are the stages of syphilis and their treatment?"
    back: "Primary (painless chancre): benzathine penicillin G 2.4 MU IM × 1. Secondary (rash, condylomata lata, mucous patches): same. Early latent (<1 yr): same. Late latent (>1 yr)/unknown duration: 2.4 MU IM weekly × 3 weeks. Neurosyphilis: IV penicillin G 3-4 MU q4h × 10-14 days.\n\nTertiary syphilis: gummatous (skin/bone), cardiovascular (aortitis), neurosyphilis (tabes dorsalis, general paresis, Argyll Robertson pupil). All syphilis patients should be tested for HIV. Jarisch-Herxheimer reaction: fever, rigors within 24h of treatment (cytokine release from spirochete lysis) — warn patients, supportive care. PCN allergy: desensitize (no adequate alternative for neurosyphilis)."
    difficulty: hard
    tags: [STI, syphilis, penicillin, benzathine, neurosyphilis, stages, ID]
  - front: "What is the approach to genital herpes (HSV) management?"
    back: "First episode: valacyclovir 1g BID × 10 days or acyclovir 400 mg TID × 10 days. Recurrent: valacyclovir 500 mg BID × 3 days or 1g daily × 5 days. Suppressive therapy (≥6 recurrences/year or serodiscordant partner): valacyclovir 500 mg daily.\n\nHSV-2 causes most genital herpes; HSV-1 increasing. Type-specific serology (HSV-1/2 IgG) can confirm but not recommended as routine screening. Viral shedding occurs even when asymptomatic. Suppressive therapy reduces transmission by ~50%. Condoms further reduce risk. Pregnancy: acyclovir suppression from 36 weeks if history of genital HSV; C-section if active lesions at delivery."
    difficulty: medium
    tags: [STI, herpes, HSV, valacyclovir, suppressive therapy, ID]
  - front: "What is the treatment for chlamydia and its complications?"
    back: "Uncomplicated: doxycycline 100 mg BID × 7 days (first-line, superior to azithromycin for rectal CT). Alternative: azithromycin 1g PO × 1. Pregnancy: azithromycin 1g × 1. Complications: PID, epididymitis, reactive arthritis, neonatal conjunctivitis/pneumonia, infertility.\n\nChlamydia is the most commonly reported STI in Canada. Often asymptomatic (70% women, 50% men). PID: doxycycline + ceftriaxone + metronidazole × 14 days. Test of cure not routine except pregnancy. Retest at 3-6 months for reinfection. Treat all partners within 60 days. Expedited partner therapy available in some provinces."
    difficulty: medium
    tags: [STI, chlamydia, doxycycline, PID, screening, ID]
  - front: "What is the management of pelvic inflammatory disease (PID)?"
    back: "Outpatient (mild-moderate): ceftriaxone 500 mg IM × 1 + doxycycline 100 mg BID × 14 days + metronidazole 500 mg BID × 14 days. Inpatient (severe, TOA, pregnant, surgical emergency): cefoxitin IV + doxycycline → step-down to oral.\n\nPID: ascending infection from cervix (GC, CT, BV-associated organisms, anaerobes). Clinical diagnosis: lower abdominal pain + cervical motion/adnexal/uterine tenderness. Low threshold to treat (prevent infertility, ectopic pregnancy, chronic pelvic pain). TOA: antibiotics ± IR drainage if >6 cm or not improving. Remove IUD only if no improvement at 48-72h."
    difficulty: hard
    tags: [STI, PID, ceftriaxone, doxycycline, TOA, ID]
  - front: "What are the HPV-related diseases and vaccination schedule?"
    back: "HPV causes: cervical (16,18→70%), anal, oropharyngeal, penile, vulvar cancer, genital warts (6,11). Gardasil-9: covers 6,11,16,18,31,33,45,52,58. Schedule: age 9-14: 2 doses (0,6 months). ≥15: 3 doses (0,2,6). NACI recommends for all 9-26 years; shared decision up to 45.\n\nHPV vaccine prevents ~90% of HPV-related cancers. Males and females equally benefit. Catch-up vaccination encouraged even if prior HPV infection (protects against other types). Cervical screening continues despite vaccination. Canadian provinces fund school-based programs (grade 4-7 typically)."
    difficulty: medium
    tags: [STI, HPV, Gardasil, vaccination, cervical cancer, NACI, ID]
  - front: "What causes genital ulcer disease and how is it differentiated?"
    back: "Painful: HSV (most common, vesicles→shallow ulcers, grouped), chancroid (H. ducreyi, ragged purulent ulcer + tender LAD). Painless: syphilis (chancre, indurated, clean base), LGV (Chlamydia L1-3, inguinal buboes). Granuloma inguinale: painless, beefy red, Donovan bodies.\n\nHSV is by far the most common cause of genital ulcers in Canada. Multiple causes can coexist. Always test for syphilis and HIV with any genital ulcer. LGV: increasingly reported in MSM, causes proctitis. Treat with doxycycline 100 mg BID × 21 days. Chancroid rare in Canada."
    difficulty: hard
    tags: [STI, genital ulcer, HSV, syphilis, chancroid, LGV, ID]
  - front: "What is expedited partner therapy (EPT)?"
    back: "Providing prescriptions/medications to the sexual partners of STI-positive patients without direct clinical assessment of the partner. Used for GC and CT to improve partner treatment rates and reduce reinfection.\n\nEPT is legal/permitted in several Canadian provinces. Index patient gives medication/prescription to partner(s). Limitations: cannot assess for allergies, drug interactions, pregnancy. Not appropriate for syphilis (needs staging) or MSM (should be screened for HIV/syphilis). PHAC supports EPT as a public health strategy for CT/GC."
    difficulty: medium
    tags: [STI, EPT, partner therapy, public health, ID]
  - front: "What is the approach to rectal STIs in MSM?"
    back: "Screen all MSM: rectal NAAT for GC/CT at each visit (even if asymptomatic). Rectal GC: ceftriaxone 500 mg IM. Rectal CT: doxycycline 100 mg BID × 7 days (superior to azithromycin rectally). LGV proctitis: doxycycline 100 mg BID × 21 days. Also screen for syphilis, HIV, mpox.\n\nRectal GC/CT are often asymptomatic and missed without site-specific testing. LGV proctitis mimics IBD (bloody discharge, tenesmus). Doxycycline 100 mg post-exposure (doxyPEP) reduces STI incidence in MSM by 60-70% — emerging prevention strategy, not yet standard of care in Canadian guidelines but under review."
    difficulty: hard
    tags: [STI, MSM, rectal, LGV, proctitis, doxyPEP, ID]
  - front: "What are the key differences between HSV-1 and HSV-2 infections?"
    back: "HSV-1: typically 'cold sores' at mucocutaneous junction of lips/face/hard palate; NOT on soft non-keratinized mucous membranes. HSV-2: usually sexually transmitted (incubation 2–20 days); causes gingivostomatitis, vulvovaginitis (edematous, extremely tender, profuse vaginal discharge), urethritis; recurrent on vulva, vagina, penis for 5–7 days.\n\nBoth subtypes are biologically and immunologically different. HSV remains latent in dorsal root ganglia after primary infection and reactivates with triggers such as fever, sun exposure, menstruation, and stress."
    difficulty: easy
    tags: [HSV, herpes simplex, HSV-1, HSV-2, STI, dermatology]
  - front: "What is the management of first-episode genital herpes (HSV-2)?"
    back: "Acyclovir 400 mg PO TID for 7–10 days. Concurrent STIs should be tested and treated. Pain control with sitz baths and analgesia. Famciclovir and valacyclovir may be substituted (better enteric absorption, less frequent dosing).\n\nRecurrent genital herpes can be managed with daily suppressive therapy (acyclovir 400 mg PO BID) or episodic therapy (acyclovir 800 mg PO TID for 5 days or TID for 2 days, started during prodrome or within 1 day of lesion onset)."
    difficulty: medium
    tags: [HSV-2, genital herpes, acyclovir, treatment, STI]
  - front: "What HPV types are associated with genital warts (condyloma acuminata) and which types cause cervical cancer?"
    back: "Genital warts: commonly HPV 6 and 11 (low-risk, non-oncogenic). Cervical dysplasia, SCC, and invasive cancer: HPV 16, 18, 31, 33 (high-risk, oncogenic).\n\nCondyloma acuminata are skin-coloured papules to cauliflower-like masses in genital/perianal areas. They are highly contagious, transmitted sexually and non-sexually (Koebner phenomenon). Acetowhitening (acetic acid 5% × 5 min) reveals subclinical lesions."
    difficulty: easy
    tags: [HPV, condyloma acuminata, genital warts, cervical cancer, STI]
  - front: "What are the three stages of syphilis and their key clinical features?"
    back: "Primary: single painless indurated chancre at inoculation site after 3 weeks, heals 4–6 weeks, with non-tender regional lymphadenopathy. Secondary (2–6 months later): generalized lymphadenopathy, maculopapular rash (non-pruritic), condyloma lata, mucous patches, systemic symptoms. Tertiary (3–7 years later): gumma (granulomatous non-tender nodule), rare.\n\nSyphilis is caused by Treponema pallidum. VDRL is negative in primary but positive in secondary stage. FTA-ABS has greater sensitivity and can detect disease earlier. Treatment: penicillin G 2.4 million units IM (single dose for primary/secondary; weekly × 3 for tertiary)."
    difficulty: medium
    tags: [syphilis, Treponema pallidum, STI, chancre, stages]
  - front: "How do you distinguish primary syphilis from chancroid and HSV on clinical grounds?"
    back: "Primary syphilis: single, painless, indurated ulcer (chancre) with non-tender lymphadenopathy. Chancroid: painful ulcer. HSV: multiple painful vesicles/ulcers. Definitive distinction requires laboratory testing (dark-field examination for spirochetes, VDRL, FTA-ABS, PCR).\n\nClinical features alone are insufficient to diagnose primary syphilis. Dark-field examination of chancre fluid or lymph node material may reveal spirochetes. VDRL may be negative in primary syphilis, so FTA-ABS should be performed."
    difficulty: medium
    tags: [syphilis, chancre, differential diagnosis, STI, chancroid]
  - front: "What are the clinical features of disseminated gonococcemia and how is it managed?"
    back: "Features: hemorrhagic tender pustules on a purpuric/petechial background on distal extremities; fever, arthritis, urethritis, proctitis, pharyngitis, tenosynovitis; neonatal conjunctivitis if infected via birth canal. Management: notify public health, screen for other STIs, ceftriaxone 1 g IM or IV every 24 hours.\n\nGonococcemia is caused by Neisseria gonorrhoeae. Tests are often negative, requiring a high index of suspicion. Bacterial culture of blood, joint fluid, and skin lesions should be obtained."
    difficulty: medium
    tags: [gonorrhea, gonococcemia, Neisseria gonorrhoeae, STI, disseminated infection]
  - front: "What is the photosensitivity and secondary syphilis rash, and what are the differential diagnoses?"
    back: "Secondary syphilis rash: flat-topped scaling, non-pruritic, sharply defined, circular/annular maculopapules appearing 2–6 months after primary infection. Also: condyloma lata (wart-like moist papules in genital/perianal region) and mucous patches (oral mucosa). Differential: pityriasis rosea, tinea corporis, drug eruptions, lichen planus.\n\nSecondary syphilis is also associated with generalized lymphadenopathy, splenomegaly, headache, fever, arthralgias, and malaise. Lesions heal in 1–5 weeks but may recur for 1 year. VDRL and FTA-ABS are both positive in secondary syphilis."
    difficulty: medium
    tags: [secondary syphilis, syphilitic rash, condyloma lata, STI, differential diagnosis]
  - front: "What antiviral agents are used for genital herpes, and what are the recommended dosing regimens for first episode vs. recurrent disease?"
    back: "For genital herpes: Famciclovir 250 mg TID x7–10 days (1st episode) or 125 mg BID x3 days (recurrence). Valacyclovir 1000 mg BID x3 days (1st episode) or 500 mg BID x5 days (recurrence). Both require dose reduction with renal impairment.\n\nThese antivirals reduce severity and duration of outbreaks and can be used for prophylaxis to reduce transmission. Drug interactions include cladribine and varicella/zoster vaccines. Valacyclovir is a prodrug of acyclovir with improved oral bioavailability."
    difficulty: medium
    tags: [famciclovir, valacyclovir, genital herpes, antiviral, dosing]
  - front: "What is the management of pelvic inflammatory disease (PID) in the ED?"
    back: "Broad-spectrum antibiotics: ceftriaxone 500 mg IM x 1 dose, PLUS doxycycline 100 mg PO/IV q12h x 2 weeks, PLUS metronidazole 500 mg PO/IV q12h x 2 weeks. Low threshold to treat empirically based on clinical suspicion (cervical motion tenderness/'chandelier sign').\n\nPID is caused by ascending infection (often N. gonorrhoeae and C. trachomatis). Untreated PID can lead to chronic pelvic pain, infertility, and ectopic pregnancy. The 'chandelier sign' — severe pain with cervical manipulation — is classic. Patients with TOA or who fail outpatient therapy require admission."
    difficulty: medium
    tags: [PID, pelvic inflammatory disease, antibiotics, gynecology]
  - front: "What STI prophylaxis is given after sexual assault?"
    back: "Assume positive for gonorrhea and chlamydia: ceftriaxone IM x1 dose (500 mg if <150 kg; 1 g if >150 kg) AND doxycycline 100 mg PO BID x7 days (alternative: azithromycin 1 g PO x1 dose). May also start post-exposure prophylaxis for hepatitis B, syphilis, and HIV. Offer pregnancy prophylaxis: levonorgestrel 1.5 mg PO STAT (Plan B).\n\nEmpiric STI treatment is recommended because culture results take days and follow-up is uncertain. Emergency contraception is most effective when given immediately after assault. VDRL (syphilis serology) should be repeated at 3 months if initially negative. HIV PEP must be started within 72 hours."
    difficulty: medium
    tags: [sexual assault, STI prophylaxis, ceftriaxone, doxycycline, Plan B, HIV PEP]
  - front: "What is the pediatric antibiotic treatment for streptococcal pharyngitis?"
    back: "Group A beta-hemolytic Streptococcus (GAS): penicillin/amoxicillin (first line), cefalexin, or erythromycin (can cause GI upset).\n\nPenicillin remains the drug of choice for GAS pharyngitis and has never developed resistance. Treatment prevents rheumatic fever (but not post-streptococcal glomerulonephritis). A 10-day course is recommended. Amoxicillin is preferred by some due to better taste compliance. Macrolides are used for penicillin allergy but resistance is increasing."
    difficulty: easy
    tags: [strep pharyngitis, GAS, penicillin, amoxicillin, rheumatic fever]
  - front: "What is Disseminated Gonococcal Infection (DGI) and who is most at risk?"
    back: "DGI presents with: fever, skin lesions (pustules/vesicles on erythematous base, ~5 mm), arthritis (joint swelling and tenderness), and septic arthritis in larger joints (knees, ankles, elbows). Most common in gonococcus-positive women during menstruation or pregnancy. Skin lesions appear in extremities and resolve quickly (<7 days).\n\nDGI occurs when N. gonorrhoeae disseminates hematogenously. The triad of migratory polyarthralgia, tenosynovitis, and dermatitis is classic. Treatment: IV ceftriaxone 1g daily. All sexual partners within 60 days should be tested and treated. Screen for co-infection with chlamydia, syphilis, HIV."
    difficulty: medium
    tags: [DGI, gonococcal infection, arthritis, skin lesions, STI, dermatology]
  - front: "What are the PHE recommendations for STI screening in high-risk groups?"
    back: "High-risk groups: voluntary HIV antibody screening (Grade A), gonorrhea screening (Grade A), chlamydia screening in women (Grade B), syphilis screening (Grade A), VDRL test for syphilis high-risk groups (Grade A). General counselling on protection against STIs (Grade B) for all adults.\n\nSTI screening in high-risk populations (MSM, sex workers, multiple partners, history of STI) allows early detection and treatment to prevent transmission and complications. Chlamydia screening in women is critical to prevent pelvic inflammatory disease and infertility."
    difficulty: easy
    tags: [STI screening, HIV, gonorrhea, chlamydia, syphilis, preventive health, periodic health exam]
  - front: "What are the signs and symptoms of urethritis and how does it differ from cystitis in presentation?"
    back: "Urethritis: INITIAL dysuria (at start of micturition), urethral/vaginal discharge, history of STI. Organisms: C. trachomatis, N. gonorrhoeae, Trichomonas spp., Candida spp., herpes. Cystitis: INTERNAL dysuria throughout micturition, frequency, urgency, hematuria, nocturia, suprapubic discomfort.\n\nThe distinction between initial vs. throughout micturition dysuria helps localize infection. Positive urethral swab or PCR for chlamydia or gonorrhea must be reported to Public Health. All urethritis patients should return 4-7 days after completing therapy."
    difficulty: medium
    tags: [urethritis, cystitis, dysuria, STI, chlamydia, gonorrhea]
  - front: "What is the first-line treatment for vulvovaginal candidiasis in a symptomatic patient?"
    back: "Fluconazole 150 mg PO x 1 dose OR miconazole 2% cream (Monistat 7%): one applicator (5 g) intravaginally QHS x 7 days. Treat only if patient is symptomatic.\n\nVulvovaginal candidiasis is caused by Candida species. Oral fluconazole is convenient; topical azole preparations (e.g., miconazole) are equally effective. Canadian guidelines emphasize treating only symptomatic patients."
    difficulty: easy
    tags: [candidiasis, vulvovaginal, antifungal, fluconazole, gynecology]
  - front: "What are the organisms responsible for bacterial vaginosis (BV) and what is the first-line treatment?"
    back: "BV is caused by overgrowth of Gardnerella vaginalis, Mycoplasma hominis, and anaerobes. First-line: metronidazole 500 mg PO BID x 7 days OR metronidazole 0.75% gel one applicator (5 g) intravaginally QHS x 5 days OR clindamycin 2% cream one applicator (5 g) intravaginally QHS x 7 days.\n\nBV results from disruption of normal vaginal flora. Treatment is indicated for symptomatic patients and for asymptomatic high-risk cases (e.g., high-risk pregnancy, prior to IUD insertion, gynecologic surgery). Metronidazole remains the cornerstone of Canadian guideline-recommended therapy."
    difficulty: easy
    tags: [bacterial vaginosis, metronidazole, clindamycin, vaginal infection]
  - front: "In what clinical circumstances should asymptomatic bacterial vaginosis be treated?"
    back: "Asymptomatic BV should be treated in: high-risk pregnancy, prior to IUD insertion, prior to gynecologic surgery, prior to induced abortion, or prior to upper tract instrumentation.\n\nBV increases the risk of ascending infection and preterm labour. Treatment in these specific scenarios reduces procedural and obstetric complications even without symptoms."
    difficulty: medium
    tags: [bacterial vaginosis, asymptomatic treatment, pregnancy, IUD]
  - front: "What is the treatment regimen for a first episode of genital herpes (HSV)?"
    back: "First episode: acyclovir 400 mg PO TID x 5–10 days OR famciclovir 250 mg PO TID x 5 days OR valacyclovir 1000 mg PO BID x 10 days.\n\nAntiviral therapy initiated early reduces the duration and severity of the primary episode. Valacyclovir and famciclovir have improved bioavailability compared with acyclovir. All three are acceptable per Canadian STI guidelines."
    difficulty: easy
    tags: [herpes simplex, genital herpes, acyclovir, valacyclovir, antiviral]
  - front: "What is the recommended suppressive therapy for genital herpes in pregnancy at 36 weeks gestation?"
    back: "Acyclovir 400 mg PO TID daily OR valacyclovir 500 mg PO BID starting at 36 weeks gestation.\n\nSuppressive antiviral therapy near term reduces viral shedding and the risk of neonatal herpes transmission. It also reduces the likelihood of clinical recurrence necessitating caesarean section."
    difficulty: medium
    tags: [herpes simplex, pregnancy, suppressive therapy, neonatal herpes]
  - front: "What is the recommended treatment for gonorrhea/chlamydia co-infection in Canada?"
    back: "Ceftriaxone 250 mg IM x 1 dose PLUS azithromycin 1 g PO x 1 dose. No intercourse for 1 week after treatment.\n\nDual therapy is recommended to cover both Neisseria gonorrhoeae and Chlamydia trachomatis due to frequent co-infection. Ceftriaxone addresses gonorrhea (including fluoroquinolone-resistant strains) while azithromycin covers chlamydia."
    difficulty: easy
    tags: [gonorrhea, chlamydia, ceftriaxone, azithromycin, STI treatment]
  - front: "What is the first-line treatment for uncomplicated Chlamydia trachomatis infection?"
    back: "Doxycycline 100 mg PO BID x 7 days. No intercourse for 1 week after treatment.\n\nDoxycycline is recommended over azithromycin as monotherapy for chlamydia based on superior cure rates. Abstaining from intercourse for 1 week ensures treatment completion and prevents re-transmission."
    difficulty: easy
    tags: [chlamydia, doxycycline, STI, C. trachomatis]
