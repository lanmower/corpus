# General (Cardiology) - generated from srs-mccqe1
cards:
  - front: "What are the branches of the Right Coronary Artery (RCA)?"
    back: "Conus artery, acute marginal branches, AV nodal artery, and PDA (posterior descending artery)\n\nThe RCA typically supplies the right ventricle and inferior wall of the left ventricle, with the PDA usually providing posterior interventricular artery supply."
    difficulty: easy
    tags: [cardiology, coronary anatomy, RCA, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What are the branches of the Left Coronary Artery (LCA)?"
    back: "LAD (with septal and diagonal branches) and LCx (with obtuse marginal branches)\n\nThe LCA bifurcates into the LAD, which supplies the anterior wall and septum, and the LCx, which supplies the lateral and posterior walls."
    difficulty: easy
    tags: [cardiology, coronary anatomy, LCA, LAD, LCx, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "Where do the coronary arteries originate?"
    back: "From the aortic sinuses of Valsalva\n\nThe right and left coronary arteries arise from the left and right aortic sinuses respectively, just above the aortic valve."
    difficulty: easy
    tags: [cardiology, coronary anatomy, aortic valve, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does LAD stand for and what does it supply?"
    back: "Left Anterior Descending artery; supplies the anterior wall of the left ventricle and the interventricular septum\n\nThe LAD is the most important coronary artery in terms of myocardial mass supplied and is commonly involved in acute coronary syndromes."
    difficulty: easy
    tags: [cardiology, coronary anatomy, LAD, ischemic heart disease, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does LCx stand for and what does it supply?"
    back: "Left Circumflex artery; supplies the lateral and posterior walls of the left ventricle\n\nThe LCx courses in the left atrioventricular groove and gives off obtuse marginal branches to the lateral wall."
    difficulty: easy
    tags: [cardiology, coronary anatomy, LCx, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What structures does the RCA typically supply via its branches?"
    back: "Right ventricle, SA node (in ~60% of people), AV node (in ~90% of people), and inferior wall of the left ventricle via the PDA\n\nRCA occlusion commonly causes inferior MI and may lead to bradyarrhythmias due to SA and AV nodal artery involvement."
    difficulty: medium
    tags: [cardiology, coronary anatomy, RCA, inferior MI, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does TTE stand for?"
    back: "Transthoracic Echocardiography\n\nTTE is the first-line non-invasive cardiac imaging modality used to assess cardiac structure, function, and hemodynamics."
    difficulty: easy
    tags: [cardiac-imaging, echocardiography, cardiology-terminology, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does ICD stand for?"
    back: "Implantable Cardioverter Defibrillator\n\nICDs are indicated for primary prevention in high-risk patients (LVEF ≤35%, NYHA II-III) and secondary prevention after cardiac arrest or sustained VT."
    difficulty: easy
    tags: [electrophysiology, device-therapy, cardiology-terminology, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does CABG stand for?"
    back: "Coronary Artery Bypass Graft\n\nCABG is surgical revascularization using arterial or venous grafts. Preferred for multivessel disease, left main disease, and diabetes."
    difficulty: easy
    tags: [cardiac-surgery, revascularization, cardiology-terminology, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What does CRT stand for in cardiac device therapy?"
    back: "Cardiac Resynchronization Therapy (biventricular pacing)\n\nCRT is indicated for HFrEF patients with LBBB, QRS >150ms, and LVEF ≤35% who remain symptomatic on optimal medical therapy. Improves ventricular synchrony and reduces mortality."
    difficulty: easy
    tags: [heart-failure, device-therapy, cardiology-terminology, toronto-notes, pages-0091-0092-0093-0094-0095-0096-0097-0098-0099-0100]
  - front: "What is the treatment approach for acute atrial flutter in an unstable patient?"
    back: "Electrical cardioversion\n\nUnstable patients with atrial flutter (hypotension, CHF, angina) require immediate synchronized electrical cardioversion to restore normal sinus rhythm."
    difficulty: easy
    tags: [cardiology, atrial flutter, treatment, cardioversion, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is the treatment of choice for typical isthmus-dependent atrial flutter?"
    back: "Radiofrequency (RF) ablation of the cavotricuspid isthmus\n\nRF ablation has high success rates (>90%) for typical flutter and is preferred over long-term antiarrhythmic therapy due to better efficacy and avoiding medication side effects."
    difficulty: easy
    tags: [cardiology, atrial flutter, ablation, treatment, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What maneuver can unmask flutter waves in atrial flutter with 2:1 block?"
    back: "Carotid sinus massage, Valsalva maneuver, or adenosine\n\nThese vagal maneuvers temporarily increase AV nodal block, slowing ventricular response and allowing flutter waves to become visible on ECG."
    difficulty: easy
    tags: [cardiology, atrial flutter, ECG, diagnostic maneuvers, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What are the diagnostic ECG criteria for multifocal atrial tachycardia (MAT)?"
    back: "At least 3 distinct P wave morphologies, varying PR intervals, and atrial rate of 100-200 bpm\n\nMAT mimics AFib on rhythm but has identifiable P waves with different morphologies, indicating multiple ectopic foci in the atria."
    difficulty: medium
    tags: [cardiology, MAT, arrhythmias, ECG, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What distinguishes a premature atrial contraction (PAC) from a normal sinus beat on ECG?"
    back: "The P wave morphology of a PAC differs from that of a normal sinus beat\n\nPACs are ectopic supraventricular beats originating in the atria outside the SA node, resulting in different atrial depolarization vectors and P wave shapes."
    difficulty: easy
    tags: [cardiology, PAC, arrhythmias, ECG, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is a retrograde P wave in the context of junctional premature beats?"
    back: "An inverted or absent P wave that may appear before or closely follow the QRS complex, occurring because the impulse travels backward ('retrograde') through the AV node to depolarize the atria\n\nJunctional beats originate near the AV node, so the atrial depolarization occurs in a retrograde direction rather than the normal antegrade pathway."
    difficulty: medium
    tags: [cardiology, junctional beats, ECG, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is a junctional premature beat?"
    back: "An ectopic supraventricular beat originating near the AV node. The P wave is usually absent or inverted, and may appear before or closely after the QRS complex (retrograde P wave).\n\nJunctional beats arise from the AV junction when the SA node fails to fire or is transiently suppressed. Like PACs, they are usually benign and treatment is often unnecessary."
    difficulty: easy
    tags: [cardiology, arrhythmias, junctional beat, ECG, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is the treatment of choice for typical, isthmus-dependent atrial flutter?"
    back: "Radiofrequency (RF) ablation of the cavotricuspid isthmus\n\nSince typical atrial flutter uses a defined macro-reentry circuit involving the cavotricuspid isthmus, catheter ablation can interrupt this circuit and provide a cure with high success rates."
    difficulty: easy
    tags: [cardiology, arrhythmias, atrial flutter, ablation, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "Why does carotid sinus massage help diagnose atrial flutter with 2:1 block?"
    back: "Carotid sinus massage increases vagal tone, causing transient AV nodal block. This transiently slows ventricular conduction, unmasking the flutter waves that may be hidden at faster ventricular rates.\n\nWith 2:1 block at a flutter rate of 300 bpm, the ventricular rate is 150 bpm - too fast to easily see flutter waves. Vagal stimulation slows conduction enough to reveal the underlying atrial rhythm."
    difficulty: hard
    tags: [cardiology, arrhythmias, atrial flutter, diagnostic maneuvers, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "Compare AVNRT vs AVRT in terms of mechanism"
    back: "AVNRT (AV nodal reentrant tachycardia): Uses dual pathways within the AV node itself - a slow pathway (anterograde) and fast pathway (retrograde). AVRT (AV reentrant tachycardia): Uses an accessory pathway (bypass tract like in WPW) separate from the AV node, creating a reentry circuit.\n\nBoth are AV node-dependent tachycardias that can terminate with adenosine. However, AVRT involving an accessory pathway may be dangerous with AV nodal blocking agents if pre-excitation is present."
    difficulty: hard
    tags: [cardiology, arrhythmias, AVNRT, AVRT, electrophysiology, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "Why must daily nitrate-free intervals be maintained?"
    back: "To prevent tolerance (tachyphylaxis)\n\nContinuous nitrate exposure causes depletion of sulfhydryl groups needed for nitric oxide generation, leading to reduced efficacy within 24 hours."
    difficulty: easy
    tags: [cardiology, nitrates, pharmacology, toronto-notes, pages-0121-0122-0123-0124-0125-0126-0127-0128-0129-0130]
  - front: "What is the COMPASS trial indication for rivaroxaban in CAD?"
    back: "Low-dose rivaroxaban in combination with aspirin for patients with chronic coronary disease\n\nThe COMPASS trial showed reduced cardiovascular events with combined rivaroxaban-aspirin therapy in high-risk CAD patients."
    difficulty: medium
    tags: [cardiology, anticoagulation, rivaroxaban, toronto-notes, pages-0121-0122-0123-0124-0125-0126-0127-0128-0129-0130]
  - front: "What are the 4 major diagnostic criteria for acute pericarditis?"
    back: "1. Sharp chest pain (pleuritic, radiates to trapezius, improves sitting forward), 2. Pericardial friction rub, 3. ECG changes (diffuse ST elevation), 4. Pericardial effusion on imaging\n\nDiagnosis requires 2 of 4 major criteria and 4 total findings from major and minor criteria combined. These reflect the classic inflammatory presentation of pericarditis."
    difficulty: easy
    tags: [cardiology, pericarditis, diagnosis, clinical criteria, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What is immune checkpoint-inhibitor-associated pericarditis and why is it significant?"
    back: "A severe form of pericarditis associated with immune checkpoint inhibitor therapy that requires immunosuppressive therapy\n\nWith increasing use of immunotherapy for cancer, recognition of this complication is important as standard NSAID therapy may be insufficient."
    difficulty: medium
    tags: [cardiology, pericarditis, immunotherapy, oncology, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What are the major predictors of poor prognosis in acute pericarditis?"
    back: "Fever >38°C, subacute onset, large pericardial effusion, lack of response to ASA or NSAIDs after at least 1 week of therapy\n\nThese major criteria, validated by multivariate analysis, help identify high-risk patients requiring more aggressive workup and treatment."
    difficulty: medium
    tags: [cardiology, pericarditis, prognosis, risk stratification, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What were the outcomes of the LAMPOON technique in the 2019 study?"
    back: "100% technical success with successful laceration, 100% immediate survival, 93% 30-day survival, 0% had LVOT gradient >30 mmHg (optimal range), 73% procedural success in remaining subjects\n\nThe LAMPOON technique demonstrated high feasibility and enabled TMVR in patients otherwise ineligible due to prohibitive LVOT obstruction risk."
    difficulty: hard
    tags: [cardiology, LAMPOON, TMVR, mitral valve, clinical trials, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What were the mortality outcomes in the COAPT trial?"
    back: "Death from any cause occurred in 29.1% of the TMVR group versus 46.1% of the control group at 24 months\n\nTMVR not only reduced HF hospitalizations but also significantly improved survival, establishing TMVR as a treatment option for symptomatic HF with secondary MR."
    difficulty: hard
    tags: [cardiology, MitraClip, mortality, heart failure, clinical trials, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What are the characteristics of chest pain in pericarditis?"
    back: "Sharp, rapid onset (may be dull or throbbing), commonly radiates to trapezius ridge, pleuritic (related to inspiration, coughing, hiccoughs), improves with sitting up/leaning forward\n\nThe pleuritic nature and positional improvement help distinguish pericardial chest pain from ischemic causes."
    difficulty: easy
    tags: [cardiology, pericarditis, chest pain, clinical presentation, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "How do you hear a pericardial friction rub?"
    back: "With the patient leaning forward or on elbows and knees, listen along the left lower sternal border\n\nPositioning the patient forward brings the pericardium closer to the chest wall, maximizing detection of the characteristic friction rub."
    difficulty: easy
    tags: [cardiology, pericarditis, physical exam, friction rub, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What is the reversal agent for dabigatran?"
    back: "Idarucizumab (Praxbind) is the FDA-approved reversal agent for dabigatran\n\nIdarucizumab is a monoclonal antibody fragment that binds dabigatran with high affinity, neutralizing its anticoagulant effect."
    difficulty: easy
    tags: [cardiology, anticoagulants, direct-thrombin-inhibitors, reversal, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of rivaroxaban and apixaban?"
    back: "Direct, selective, and reversible inhibition of factor Xa in both intrinsic and extrinsic coagulation pathways\n\nDirect factor Xa inhibitors offer fixed dosing without routine monitoring, unlike warfarin, but still carry bleeding risk."
    difficulty: easy
    tags: [cardiology, anticoagulants, factor-Xa-inhibitors, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the reversal agent for apixaban and rivaroxaban?"
    back: "Andexanet alfa is the FDA-approved reversal agent for apixaban and rivaroxaban\n\nAndexanet alfa is a recombinant modified human factor Xa molecule that binds direct factor Xa inhibitors."
    difficulty: easy
    tags: [cardiology, anticoagulants, factor-Xa-inhibitors, reversal, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of aspirin as an antiplatelet agent?"
    back: "Irreversibly acetylates platelet COX-1, preventing thromboxane A2-mediated platelet aggregation\n\nAspirin's antiplatelet effect lasts for the platelet's entire lifespan (7-10 days), which is relevant when planning invasive procedures."
    difficulty: easy
    tags: [cardiology, antiplatelets, pharmacology, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "How do thienopyridines (clopidogrel, ticlopidine, prasugrel) work as antiplatelet agents?"
    back: "P2Y12 receptor antagonists that block platelet ADP receptors, preventing ADP-mediated platelet activation and aggregation\n\nThienopyridines require metabolic activation by CYP450 enzymes, which can lead to variable response, especially with clopidogrel."
    difficulty: medium
    tags: [cardiology, antiplatelets, pharmacology, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "How do GP IIb/IIIa inhibitors work as antiplatelet agents?"
    back: "Block binding of fibrinogen to the GP IIb/IIIa receptor on activated platelets, preventing cross-linking and aggregation\n\nGP IIb/IIIa inhibitors like abciximab, eptifibatide, and tirofiban are used during PCI to prevent acute thrombotic complications."
    difficulty: medium
    tags: [cardiology, antiplatelets, mechanism, PCI, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of nitroglycerin?"
    back: "Relaxes vascular smooth muscle by releasing nitric oxide, which increases cyclic guanosine monophosphate, producing venous and arteriolar dilation\n\nVenodilation reduces preload, while arteriolar dilation reduces afterload, decreasing myocardial oxygen demand in angina."
    difficulty: medium
    tags: [cardiology, nitrates, mechanism, angina, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "How do PCSK9 inhibitors (evolocumab, alirocumab) lower LDL?"
    back: "Monoclonal antibodies that inhibit PCSK9's action on LDL receptor recycling, increasing LDL receptor number on hepatocyte surfaces\n\nMore LDL receptors mean more LDL clearance from blood. PCSK9 inhibitors can reduce LDL by 50-60%."
    difficulty: medium
    tags: [cardiology, lipid-lowering, PCSK9-inhibitors, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the effects of alpha-1 adrenergic receptor activation on the cardiovascular system?"
    back: "Constriction of vascular smooth muscle, including skin, skeletal muscle, and splanchnic vessels\n\nAlpha-1 stimulation causes vasoconstriction, increasing peripheral vascular resistance and blood pressure."
    difficulty: easy
    tags: [cardiology, adrenergic-receptors, alpha-receptors, vascular, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the effects of beta-1 adrenergic receptor activation on the cardiovascular system?"
    back: "Increased myocardial contractility, accelerated SA node conduction, accelerated ectopic pacemakers, and decreased heart rate (via baroreceptor reflex)\n\nBeta-1 receptors are predominantly located in the heart. Selective B1 agonists like dobutamine increase cardiac output."
    difficulty: easy
    tags: [cardiology, adrenergic-receptors, beta-receptors, heart, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the effects of beta-2 adrenergic receptor activation on the cardiovascular and respiratory systems?"
    back: "Decreased vascular smooth muscle tone (vasodilation), bronchodilation, bladder wall relaxation, and stimulation of renal renin release\n\nBeta-2 receptors are found in vascular smooth muscle, bronchial tree, bladder, and kidney. Activation causes relaxation."
    difficulty: easy
    tags: [cardiology, adrenergic-receptors, beta-receptors, bronchodilation, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of phenylephrine?"
    back: "Selective alpha-1 adrenergic receptor agonist causing vasoconstriction\n\nPhenylephrine is used as a vasopressor to treat hypotension. Its selective alpha-1 action increases systemic vascular resistance."
    difficulty: easy
    tags: [cardiology, adrenergic-agonists, alpha-agonists, vasopressors, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of epinephrine at alpha and beta receptors?"
    back: "Acts on both alpha and beta receptors: alpha-1 (vasoconstriction), beta-1 (increased contractility/HR), beta-2 (bronchodilation/vasodilation)\n\nEpinephrine is used in anaphylaxis (for bronchodilation and vasoconstriction to maintain BP) and cardiac arrest (to increase coronary perfusion pressure)."
    difficulty: medium
    tags: [cardiology, adrenergic-agonists, epinephrine, anaphylaxis, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of clonidine?"
    back: "Central alpha-2 adrenergic receptor agonist that reduces sympathetic outflow from the CNS\n\nClonidine is used for hypertension and can also reduce opioid withdrawal symptoms. Side effects include sedation and dry mouth."
    difficulty: easy
    tags: [cardiology, adrenergic-agonists, alpha-2-agonists, hypertension, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of prazosin?"
    back: "Selective alpha-1 adrenergic receptor antagonist causing vasodilation\n\nPrazosin blocks alpha-1 receptors, reducing peripheral vascular resistance. It is used for hypertension and benign prostatic hyperplasia."
    difficulty: easy
    tags: [cardiology, adrenergic-antagonists, alpha-blockers, hypertension, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of metoprolol?"
    back: "Selective beta-1 adrenergic receptor antagonist (cardioselective beta-blocker)\n\nMetoprolol preferentially blocks beta-1 receptors in the heart. At higher doses, it loses selectivity and also blocks beta-2 receptors."
    difficulty: easy
    tags: [cardiology, adrenergic-antagonists, beta-blockers, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of carvedilol?"
    back: "Non-selective beta-blocker (blocks beta-1 and beta-2) with additional alpha-1 blocking activity\n\nCarvedilol is used in heart failure (mortality benefit) and provides both vasodilation (alpha-1 block) and anti-adrenergic effects."
    difficulty: medium
    tags: [cardiology, adrenergic-antagonists, beta-blockers, heart-failure, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of esmolol?"
    back: "Ultra-short-acting beta-1 selective adrenergic receptor antagonist\n\nEsmolol's short half-life (~9 minutes) allows for titratable rate control in acute settings like perioperative hypertension or SVTs."
    difficulty: medium
    tags: [cardiology, adrenergic-antagonists, beta-blockers, acute-care, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the reversal agents for rivaroxaban and apixaban?"
    back: "Andexanet alfa (FDA-approved agent for reversal of apixaban and rivaroxaban bleeding)\n\nThese are direct factor Xa inhibitors used for AFib, venous thrombosis, and PE."
    difficulty: easy
    tags: [cardiology, anticoagulants, factor Xa inhibitors, reversal, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of aspirin (ASA)?"
    back: "Irreversibly acetylates platelet COX-1, preventing thromboxane A2-mediated platelet aggregation\n\nASA is a salicylate antiplatelet agent used for CAD, acute MI, post-MI, post-PCI, and CABG."
    difficulty: easy
    tags: [cardiology, antiplatelets, aspirin, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of thienopyridines (clopidogrel, ticlopidine, prasugrel)?"
    back: "P2Y12 antagonist - blocks platelet ADP receptors, preventing ADP-mediated platelet activation\n\nUsed for acute MI, post-MI, post-PCI, and CABG. Ticlopidine can cause neutropenia and thrombocytopenic purpura."
    difficulty: medium
    tags: [cardiology, antiplatelets, P2Y12 inhibitors, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of PCSK9 inhibitors (evolocumab, alirocumab)?"
    back: "Monoclonal antibodies that inhibit PCSK9's action on LDL receptor recycling, thereby increasing LDL receptors on hepatocyte surfaces\n\nUsed for hypercholesterolemia when statins are insufficient. Side effects include injection site reactions and nasopharyngitis."
    difficulty: hard
    tags: [cardiology, lipid-lowering, PCSK9 inhibitors, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of abciximab, eptifibatide, and tirofiban?"
    back: "Block binding of fibrinogen to glycoprotein IIb/IIIa receptors on platelets, preventing platelet aggregation\n\nGp IIb/IIIa inhibitors are used during PCI and acute MI to prevent thrombotic complications."
    difficulty: medium
    tags: [cardiology, antiplatelets, GPIIbIIIa inhibitors, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "Which antiplatelet agent has a different binding site than thienopyridines for P2Y12?"
    back: "Ticagrelor (Brilinta) - same receptor (P2Y12) but different binding site than thienopyridines\n\nTicagrelor is a nucleoside analogue that provides more rapid and consistent P2Y12 inhibition than clopidogrel."
    difficulty: medium
    tags: [cardiology, antiplatelets, P2Y12 inhibitors, ticagrelor, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "Which guidelines address pericardial diseases, and what year?"
    back: "2015 ESC Guidelines for the diagnosis and management of pericardial diseases (endorsed by EACTS)"
    difficulty: easy
    tags: [cardiology, pericardial-disease, guidelines, ESC, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "How do direct factor Xa inhibitors (rivaroxaban, apixaban, edoxaban) work?"
    back: "Direct, selective, and reversible inhibition of factor Xa in both intrinsic and extrinsic coagulation pathways\n\nThese drugs directly bind and inhibit factor Xa, preventing conversion of prothrombin to thrombin. They don't require antithrombin III."
    difficulty: easy
    tags: [cardiology, anticoagulants, factor Xa inhibitors, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of action of aspirin?"
    back: "Irreversibly acetylates platelet COX-1, preventing thromboxane A2-mediated platelet aggregation\n\nAspirin's antiplatelet effect comes from irreversible inhibition of cyclooxygenase, blocking thromboxane A2 synthesis in platelets."
    difficulty: easy
    tags: [cardiology, antiplatelets, aspirin, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "How do thienopyridines (clopidogrel, ticlopidine, prasugrel) work?"
    back: "P2Y12 receptor antagonists that block platelet ADP receptors\n\nThese drugs inhibit the P2Y12 ADP receptor on platelets, preventing ADP-mediated platelet activation and aggregation."
    difficulty: easy
    tags: [cardiology, antiplatelets, P2Y12 inhibitors, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the indications for ticagrelor (Brilinta)?"
    back: "Acute coronary syndromes, but with a different binding site than thienopyridines\n\nTicagrelor is also a P2Y12 antagonist but binds reversibly to a different site than thienopyridines. It has faster onset and more potent platelet inhibition."
    difficulty: medium
    tags: [cardiology, antiplatelets, ticagrelor, ACS, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "How do glycoprotein IIb/IIIa inhibitors work?"
    back: "Block binding of fibrinogen to the GP IIb/IIIa receptor on platelets\n\nExamples include eptifibatide, tirofiban, and abciximab. This prevents the final common pathway of platelet aggregation."
    difficulty: easy
    tags: [cardiology, antiplatelets, GP IIb/IIIa inhibitors, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "How do nitrates (nitroglycerin) work?"
    back: "Relax vascular smooth muscle, producing venous and arteriolar dilation\n\nNitrates release nitric oxide, activating guanylyl cyclase and increasing cGMP, leading to smooth muscle relaxation. Primary effect is venodilation."
    difficulty: easy
    tags: [cardiology, nitrates, angina, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "How do PCSK9 inhibitors (evolocumab, alirocumab) work?"
    back: "Monoclonal antibodies that inhibit PCSK9's action on LDL receptor recycling, increasing LDL receptor numbers on hepatocyte surfaces\n\nPCSK9 normally promotes LDL receptor degradation. Inhibiting PCSK9 allows more receptors to recycle, increasing LDL clearance from blood."
    difficulty: medium
    tags: [cardiology, PCSK9 inhibitors, hypercholesterolemia, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "According to the 2015 ESC Guidelines, what is the first-line treatment for acute pericarditis with significant effusion?"
    back: "NSAIDs (ibuprofen or aspirin) plus colchicine; avoid corticosteroids as first-line\n\nESC 2015 pericardial disease guidelines recommend NSAIDs (typically ibuprofen 1200-2400mg/day or aspirin) combined with colchicine as first-line therapy. Corticosteroids are reserved for refractory cases, autoimmune causes, or when NSAIDs/colchicine are contraindicated."
    difficulty: hard
    tags: [cardiology, pericarditis, pericardial disease, NSAIDs, colchicine, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What is the Ross Procedure and what are its long-term outcomes?"
    back: "Pulmonary autograft for aortic valve replacement; long-term data shows excellent durability but requires reintervention on both valve positions over time\n\nThe Ross procedure (pulmonary autograft to aortic position with homograft replacement of pulmonary valve) was studied by Aboud et al., showing favorable hemodynamics and survival but acknowledging that both the aortic and pulmonary positions may require future interventions."
    difficulty: medium
    tags: [cardiology, aortic stenosis, valvular surgery, Ross procedure, aortic valve replacement, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What are the appropriate use criteria for echocardiography according to ACC/ASE/AHA guidelines?"
    back: "Appropriate use criteria classify echocardiography as Appropriate, Uncertain, or Inappropriate based on clinical scenario, with scoring by expert panels\n\nThe 2011 ACCF-ASE-AHA-ASNC-HFSAPHRS-SCAI-SCCM-SCCT-SCMR appropriate use criteria provide evidence-based guidance for when echocardiography should be performed, helping optimize resource utilization in cardiovascular imaging."
    difficulty: medium
    tags: [cardiology, echocardiography, imaging, appropriate use criteria, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What is the management approach for peripheral arterial disease according to Canadian Cardiovascular Society Consensus?"
    back: "Risk factor modification, antiplatelet therapy, supervised exercise, and revascularization when indicated\n\nThe CCS consensus conference executive summary by Abramson et al. outlines a comprehensive approach to PAD including smoking cessation, statin therapy, antiplatelet agents, structured exercise programs, and endovascular or surgical revascularization for lifestyle-limiting claudication or critical limb ischemia."
    difficulty: medium
    tags: [cardiology, peripheral arterial disease, vascular medicine, claudication, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "Which two organizations publish the ACC/AHA Guidelines for cardiovascular disease management?"
    back: "American College of Cardiology (ACC) and American Heart Association (AHA)\n\nThese joint guidelines represent the standard of care for cardiovascular conditions in North America and are frequently referenced in MCCQE preparation."
    difficulty: easy
    tags: [guidelines, AHA, ACC, cardiology, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What does ESC stand for in cardiology guidelines, and which region does it represent?"
    back: "European Society of Cardiology; represents European cardiovascular practice\n\nESC guidelines often differ slightly from ACC/AHA guidelines due to regional differences in practice patterns and available resources."
    difficulty: easy
    tags: [guidelines, ESC, cardiology, European, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What is the Canadian Cardiovascular Society (CCS) role in cardiovascular guidelines?"
    back: "Develops Canadian-specific cardiovascular guidelines and consensus statements\n\nCCS guidelines are tailored to Canadian healthcare context and resources, often integrating ACC/AHA and ESC recommendations with Canadian considerations."
    difficulty: easy
    tags: [guidelines, CCS, cardiology, Canada, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What did the SPRINT trial find regarding intensive BP control?"
    back: "Intensive treatment (target BP <120mmHg) reduced cardiovascular complications to 1.65%/year vs 2.19%/year with standard treatment in high-risk patients\n\nSPRINT showed that intensive BP control to a systolic target of 120mmHg significantly reduced major cardiovascular events in high-risk patients."
    difficulty: medium
    tags: [cardiology, hypertension, clinical trial, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What did the HOPE-3 trial demonstrate about statins in intermediate-risk patients?"
    back: "Rosuvastatin 10mg daily reduced LDL by 26.5% and significantly reduced vascular events (3.7% vs 4.8% placebo) in intermediate-risk patients without CV disease\n\nHOPE-3 showed that statin therapy provides cardiovascular benefit even in patients without established cardiovascular disease but at intermediate risk."
    difficulty: medium
    tags: [cardiology, hyperlipidemia, statins, clinical trial, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What was the HOPE-3 trial investigating and what were the results?"
    back: "Rosuvastatin 10 mg daily vs placebo in intermediate-risk patients without CV disease. LDL reduced by 26.5%, vascular events reduced from 4.8% to 3.7%\n\nHOPE-3 showed statin benefit in primary prevention for intermediate-risk patients regardless of baseline LDL."
    difficulty: medium
    tags: [cardiology, primary prevention, statins, cholesterol, clinical trial, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What was the conclusion of the SPRINT trial regarding intensive BP control?"
    back: "Intensive treatment significantly reduced cardiovascular complications (1.65%/year vs 2.19%/year) in patients at high risk for CV events\n\nIntensive BP control to <120 mmHg systolic reduced major CV events and mortality in high-risk patients."
    difficulty: medium
    tags: [cardiology, hypertension, clinical trial, SPRINT, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What was the primary finding of the HOPE-3 trial regarding statin use?"
    back: "Rosuvastatin 10mg daily in intermediate-risk patients without CV disease reduced LDL by 26.5% and significantly reduced vascular events (3.7% vs 4.8% placebo)\n\nStatins benefit intermediate-risk patients even without established cardiovascular disease."
    difficulty: medium
    tags: [cardiology, cholesterol, statin, clinical trial, HOPE-3, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What did the HOPE-3 trial conclude about statins in intermediate-risk patients?"
    back: "Rosuvastatin 10mg daily in intermediate-risk patients without cardiovascular disease reduced LDL by 26.5% and significantly reduced vascular events (3.7% vs 4.8% with placebo)\n\nHOPE-3 supports statin use for primary prevention in intermediate-risk individuals."
    difficulty: hard
    tags: [cardiology, cholesterol, primary prevention, clinical trial, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What symptoms may be present in hypertensive patients?"
    back: "Usually asymptomatic; may have occipital headache upon awakening or organ-specific symptoms with target organ damage\n\nHTN is typically asymptomatic ('the silent killer'); headaches suggest severe HTN or hypertensive emergency."
    difficulty: easy
    tags: [hypertension, symptoms, cardiology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What was the HOPE-3 trial finding regarding statins in intermediate-risk patients?"
    back: "Rosuvastatin 10mg daily reduced LDL by 26.5% and significantly lowered vascular events: 3.7% (treatment) vs 4.8% (placebo)\n\nHOPE-3 demonstrated benefit of statins in primary prevention for intermediate-risk patients without established cardiovascular disease."
    difficulty: medium
