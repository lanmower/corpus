# Ent Inner Ear (ENT) - generated from srs-mccqe1
cards:
  - front: "What is otosclerosis, what is its inheritance pattern, and what is Carhart's notch?"
    back: "Fusion of the stapes footplate to the oval window preventing vibration. Autosomal dominant with ~40% penetrance, F>M, progresses during pregnancy. Carhart's notch is a characteristic dip at 2000 Hz on audiogram.\n\nOtosclerosis is the 2nd most common cause of CHL in 15-50 year olds (after cerumen impaction). The abnormal bone remodeling fixes the stapes, causing conductive hearing loss. Schwartz's sign (pink blush through TM) reflects neovascularization of otosclerotic bone. The Carhart notch at 2000 Hz is a mechanical artifact of stapes fixation on bone conduction testing, not true sensorineural loss."
    difficulty: medium
    tags: [otolaryngology, otosclerosis, stapes, conductive hearing loss, Carharts notch]
  - front: "What are the treatment options for otosclerosis?"
    back: "Monitor with serial audiograms, hearing aid (BAHA), or definitive surgical treatment: stapedectomy or stapedotomy (using laser or drill) with prosthesis.\n\nStapedectomy/stapedotomy is the definitive treatment and highly effective, restoring conductive hearing. A prosthesis is placed to bypass the fixed stapes and transmit sound. BAHA (bone-anchored hearing aid) is an alternative for those who cannot or choose not to have surgery. Monitoring is appropriate for patients coping well with mild loss."
    difficulty: easy
    tags: [otolaryngology, otosclerosis, stapedectomy, BAHA, treatment]
  - front: "What gene mutation is the most common cause of non-syndromic hereditary sensorineural hearing loss?"
    back: "Connexin 26 (GJB2 gene) is the most common cause. It is often idiopathic and autosomal recessive.\n\nNon-syndromic SNHL accounts for 70% of hereditary hearing loss. GJB2 mutations disrupt gap junction communication in the cochlea, impairing potassium recycling essential for hair cell function. This is the most commonly identified genetic cause of congenital SNHL. Testing for GJB2 mutations is part of the workup for unexplained bilateral SNHL in children."
    difficulty: medium
    tags: [otolaryngology, congenital SNHL, connexin 26, GJB2, genetics]
  - front: "Name 4 syndromes associated with hereditary sensorineural hearing loss and their key distinguishing features."
    back: "1. Waardenburg: white forelock, heterochromia iridis, wide nasal bridge, increased intercanthal distance. 2. Pendred: euthyroid goiter, SLC26A4 gene, enlarged vestibular aqueducts. 3. Treacher-Collins: first and second branchial cleft anomalies. 4. Alport: hereditary nephritis.\n\nSyndromic SNHL accounts for 30% of hereditary hearing loss. Waardenburg involves pigmentation abnormalities from neural crest migration defects. Pendred is the most common cause of syndromic SNHL; goiter is typically euthyroid. Treacher-Collins involves mandibulofacial dysostosis. Alport syndrome manifests as nephritis plus SNHL, pointing to type IV collagen defects in both the kidney and cochlea."
    difficulty: hard
    tags: [otolaryngology, syndromic hearing loss, Waardenburg, Pendred, Alport, Treacher-Collins]
  - front: "What TORCH infections and postnatal infections are risk factors for congenital/acquired SNHL?"
    back: "Prenatal TORCH: Toxoplasmosis, Other (syphilis, varicella-zoster, parvovirus B19), Rubella, CMV, HSV, and Zika virus. Postnatal: bacterial meningitis, mumps, measles.\n\nCMV is the most common congenital infection causing SNHL. Rubella was historically significant but vaccination has reduced its incidence. Bacterial meningitis (especially S. pneumoniae) causes SNHL through labyrinthitis ossificans. Early ABR testing is performed for any at-risk neonates before NICU discharge and at 3 months adjusted age."
    difficulty: medium
    tags: [otolaryngology, congenital SNHL, TORCH, CMV, meningitis, risk factors]
  - front: "What is presbycusis and what are its characteristic audiologic features?"
    back: "SNHL associated with aging (starting in the 5th and 6th decades). Features: progressive bilateral hearing deterioration initially at high frequencies, followed by middle and lower frequencies; loss of speech discrimination especially with background noise; recruitment phenomenon (inability to tolerate loud sounds); tinnitus.\n\nPresbycusis results from cumulative hair cell degeneration, age-related basilar membrane degeneration, cochlear neuron damage, and inner ear ischemia. The high-frequency loss explains difficulty with consonants (speech understanding). The recruitment phenomenon is due to outer hair cell loss with preserved inner hair cells at the outer hair cell recruitment threshold. Hearing aids are indicated when HL >30-35 dB and speech discrimination is adequate."
    difficulty: easy
    tags: [otolaryngology, presbycusis, SNHL, aging, hearing loss]
  - front: "What is sudden sensorineural hearing loss (SSHL) and what is the recommended treatment according to Canadian guidelines?"
    back: "Sudden onset significant SNHL (usually unilateral) ± tinnitus, vertigo, aural fullness. 80-90% are idiopathic. Treatment: intratympanic or oral corticosteroids (prednisone 1 mg/kg/d for 7-14 days), started within 3 days (ideal), up to 14 days of onset.\n\nSSHL is defined as loss of at least 30 dB affecting three consecutive frequencies. MRI to rule out tumour and/or CT for ischemic/hemorrhagic stroke is indicated if focal neurological signs are present. Routine labs, CT, or MRI are not required unless indicated by history and physical. 70% resolve within 10-14 days, 20% partial resolution, 10% permanent loss. Idiopathic SSHL may be confused with ischemic brain events — keep high index of suspicion in elderly patients."
    difficulty: medium
    tags: [otolaryngology, sudden SNHL, corticosteroids, idiopathic, treatment]
  - front: "What is the prognosis of sudden SNHL?"
    back: "70% resolve within 10-14 days; 20% experience partial resolution; 10% experience permanent hearing loss.\n\nPrognosis depends on degree of hearing loss at presentation. Spontaneous recovery is common, but corticosteroids are started empirically to improve outcomes in idiopathic cases. Intratympanic steroids are an alternative when systemic steroids are contraindicated. Delays beyond 14 days significantly worsen prognosis."
    difficulty: easy
    tags: [otolaryngology, sudden SNHL, prognosis]
  - front: "What is autoimmune inner ear disease and how does it present?"
    back: "AIIED is an idiopathic condition (ages 20-50) causing rapidly progressive or fluctuating bilateral SNHL ± tinnitus, aural fullness, vestibular symptoms (ataxia, disequilibrium, vertigo). May be associated with systemic autoimmune diseases (RA, SLE) or vasculitides (GPA, polyarteritis nodosa).\n\nAIIED is distinguished from idiopathic sudden SNHL by its bilateral nature and rapid progression over weeks to months. Autoimmune workup includes CBC, ESR, ANA, and rheumatoid factor. Treatment involves high-dose corticosteroids for at least 30 days. Cytotoxic medication (e.g., methotrexate, cyclophosphamide) may be used for steroid non-responders."
    difficulty: medium
    tags: [otolaryngology, autoimmune inner ear disease, SNHL, bilateral, corticosteroids]
  - front: "Which aminoglycosides are vestibulotoxic vs. cochleotoxic, and what is the mechanism of ototoxicity?"
    back: "Vestibulotoxic: streptomycin and gentamicin. Cochleotoxic: kanamycin and tobramycin. Mechanism: destroys sensory hair cells (outer first, then inner); toxic by any route (oral, IV, topical) especially if TM is perforated.\n\nAminoglycoside ototoxicity occurs days to weeks post-treatment. High-frequency hearing loss develops earliest because outer hair cells (lost first) are most numerous in the basal turn (high-frequency region). Otoacoustic emissions are lost first since they require intact outer hair cells. Once-daily dosing (q24h determined by creatinine clearance) reduces ototoxicity because aminoglycoside toxicity displays saturable kinetics. Duration of treatment is the most important predictor of ototoxicity."
    difficulty: hard
    tags: [otolaryngology, aminoglycoside, ototoxicity, cochleotoxic, vestibulotoxic]
  - front: "What is noise-induced SNHL and at what frequency is the classic audiogram notch seen?"
    back: "SNHL caused by cochlear damage from sounds 85-90 dB over months/years, single impulses >135 dB, or repetitive vibratory insults. Classic audiogram shows bilateral SNHL with a notch at 4000 Hz ('boilermaker's notch'), the resonant frequency of the temporal bone.\n\nThe 4000 Hz notch is pathognomonic for noise-induced hearing loss. Speech reception is not affected until HL >30 dB at speech frequencies, so significant cochlear damage can occur silently. Temporary threshold shift (reversible) occurs with acute noise exposure; permanent threshold shift is irreversible. Prevention includes ear protectors (muffs, plugs), noise exposure limits, and regular audiologic follow-up."
    difficulty: medium
    tags: [otolaryngology, noise-induced hearing loss, SNHL, 4000 Hz, boilermakers notch]
