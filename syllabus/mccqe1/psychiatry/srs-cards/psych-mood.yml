  - front: "What is a serious psychiatric side effect of varenicline?"
    back: "Increased risk of psychosis, depression, and suicidal ideation\n\nVarenicline carries a black box warning for psychiatric effects; patients with pre-existing psychiatric conditions should be monitored closely."
