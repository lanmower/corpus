  - front: "Why does the Canadian Task Force recommend against PSA screening in men ages 55-69?"
    back: "The potential small benefit is outweighed by potential significant harms: bleeding, infection, urinary incontinence, false positive results, and overdiagnosis\n\nThe evidence shows inconsistent small potential benefit but clear evidence of harms."
