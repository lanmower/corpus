  - front: "What are the SMART goals for diabetes management?"
    back: "A1C: Optimal <7%, BP: Optimal <130/80, Cholesterol: LDL-C <2 mmol/L if treating, consider ACEI/ARB, Statin, ASA, Exercise/Eating, Smoking Cessation\n\nSMART goals provide targets for comprehensive diabetes management to reduce complications."
