# Multiple Sclerosis & Demyelinating Disease (Neurology) - generated from srs-mccqe1
cards:
  - front: "A 28-year-old woman has an episode of unilateral visual loss with eye pain (optic neuritis). MRI shows periventricular white matter lesions. Diagnosis and treatment?"
    back: "Multiple sclerosis (clinically isolated syndrome or MS); treat optic neuritis with IV methylprednisolone 1g/day x3-5 days to speed recovery; start disease-modifying therapy (DMT) to prevent further relapses\n\nMcDonald Criteria diagnose MS based on dissemination in space (DIS) and time (DIT). Optic neuritis is the presenting feature in 25% of MS. MS Canada/Canadian MS guidelines recommend starting DMT after first episode with MRI evidence of MS."
    difficulty: hard
    tags: [multiple sclerosis, optic neuritis, McDonald criteria, DMT, neurology]
  - front: "What are the McDonald criteria for MS diagnosis?"
    back: "MS diagnosis requires dissemination in space (DIS: ≥2 lesions in different CNS regions: periventricular, juxtacortical, infratentorial, spinal cord) AND dissemination in time (DIT: T1 gadolinium-enhancing lesion at same time as T2 lesion, or new T2 lesion on follow-up)\n\nMcDonald 2017 criteria allow MS diagnosis at first attack (CIS) with appropriate MRI evidence of DIS and DIT. CSF oligoclonal bands can substitute for DIT. MS must be distinguished from neuromyelitis optica (AQP4-IgG+) which requires different treatment."
    difficulty: medium
    tags: [McDonald criteria, MS diagnosis, dissemination, MRI, neurology]
  - front: "What disease-modifying therapies (DMTs) are available for relapsing-remitting MS?"
    back: "First-line: interferons (IFNβ-1a, IFNβ-1b), glatiramer acetate, dimethyl fumarate, teriflunomide; High-efficacy: natalizumab, ocrelizumab, siponimod, cladribine, ofatumumab\n\nMS Canada guidelines recommend starting DMT early to prevent disability accumulation. High-efficacy DMTs (natalizumab, ocrelizumab) are increasingly used earlier. Treatment decision: relapse frequency, MRI activity, disability progression, patient preferences."
    difficulty: easy
    tags: [DMT, disease-modifying therapy, relapsing MS, natalizumab, ocrelizumab, neurology]
  - front: "A patient with MS is on natalizumab and develops progressive confusion and hemiplegia. MRI shows large demyelinating lesion. What is the concerning diagnosis?"
    back: "Progressive multifocal leukoencephalopathy (PML) from JC virus reactivation — risk stratified by anti-JCV antibody titer (index >0.9 increases risk); withdraw natalizumab, manage PML with immune reconstitution\n\nPML is a serious natalizumab complication. JCV antibody monitoring guides risk stratification; after 24 months and index >1.5, consider switching DMT. PML management: immune reconstitution with plasma exchange (to remove natalizumab), then manage IRIS."
    difficulty: hard
    tags: [PML, natalizumab complication, JC virus, progressive multifocal leukoencephalopathy, neurology]
  - front: "What is Uhthoff phenomenon?"
    back: "Transient worsening of MS symptoms with increased body temperature (fever, hot bath, exercise) — NOT a relapse; symptoms resolve when temperature normalizes\n\nUhthoff phenomenon occurs because demyelinated axons are temperature-sensitive — conduction impairs with heat. Management: cooling strategies. Distinguished from MS relapse (which lasts >24h and may require steroids). Pseudorelapse (fatigue, infection) must also be excluded."
    difficulty: easy
    tags: [Uhthoff phenomenon, MS, heat sensitivity, pseudorelapse, neurology]
  - front: "What is neuromyelitis optica spectrum disorder (NMOSD) and how does it differ from MS?"
    back: "NMOSD: AQP4-IgG (aquaporin-4 antibody) positive in most cases; attacks are more severe (bilateral optic neuritis, longitudinally extensive transverse myelitis >3 segments); does NOT respond to MS DMTs — may worsen\n\nDistinguishing NMOSD from MS is critical because: interferons and natalizumab may exacerbate NMOSD. AQP4-IgG serology is diagnostic. Treatment: high-dose steroids for acute attacks; rituximab, inebilizumab, eculizumab, or satralizumab for prevention."
    difficulty: hard
    tags: [NMOSD, neuromyelitis optica, AQP4-IgG, aquaporin-4, neurology]
  - front: "What are the symptoms of MS and which physical findings help localize lesions?"
    back: "Vision changes (optic neuritis), weakness/spasticity (corticospinal tract), sensory loss (spinothalamic/dorsal column), internuclear ophthalmoplegia (MLF lesion), bladder dysfunction, cerebellar signs, cognitive changes\n\nInternuclear ophthalmoplegia (bilateral in MS) is highly specific for MS in a young person. L'Hermitte sign (electric shock sensation on neck flexion) indicates cervical cord demyelination. Lhermitte sign supports cervical spinal cord involvement."
    difficulty: medium
    tags: [MS symptoms, internuclear ophthalmoplegia, Lhermitte sign, neurology]
  - front: "What are the prognostic factors for disability progression in MS?"
    back: "Poor prognosis: male sex, older age at onset, high relapse frequency, incomplete recovery from relapses, high lesion burden on MRI, presence of T1 black holes, progressive course\n\nProgressive MS (PPMS, SPMS) is associated with faster disability accumulation. Ocrelizumab (anti-CD20) has modest benefit in PPMS — first treatment approved for primary progressive MS (ORATORIO trial). Regular MRI surveillance monitors disease activity and DMT efficacy."
    difficulty: medium
    tags: [MS prognosis, disability progression, progressive MS, MRI, neurology]
  - front: "What is spasticity in MS and how is it managed?"
    back: "Spasticity: velocity-dependent increase in muscle tone from upper motor neuron damage; treat with: physiotherapy, oral baclofen (first-line), tizanidine, nabiximols (cannabis extract, Sativex), intrathecal baclofen for severe cases\n\nSpasticity causes pain, reduced mobility, and difficulty with ADLs. Physiotherapy and regular stretching are foundational. Baclofen pump is highly effective for severe spasticity resistant to oral medications. Nabiximols (Sativex) is Health Canada-approved for MS spasticity."
    difficulty: medium
    tags: [spasticity, MS treatment, baclofen, tizanidine, nabiximols, neurology]
  - front: "What is the role of vitamin D in multiple sclerosis?"
    back: "Low vitamin D levels are associated with increased MS risk and disease activity; supplementation (2000 IU/day) is recommended — not proven to treat MS but may have benefit as adjunct\n\nEpidemiological studies show strong inverse correlation between sun exposure, vitamin D, and MS prevalence (higher rates at northern latitudes). Canadian MS patients have high rates of vitamin D deficiency. Current evidence does not support high-dose vitamin D treatment."
    difficulty: medium
    tags: [vitamin D, MS risk, supplementation, neurology, multiple sclerosis]
  - front: "What are the McDonald 2017 criteria for diagnosing multiple sclerosis?"
    back: "MS requires dissemination in space (DIS) and time (DIT). DIS: >=1 T2 lesion in >=2 of 4 CNS areas (periventricular, cortical/juxtacortical, infratentorial, spinal cord). DIT: simultaneous enhancing and non-enhancing lesions, OR new lesion on follow-up, OR CSF oligoclonal bands.\n\nThe 2017 McDonald criteria allow earlier MS diagnosis by incorporating CSF oligoclonal bands as a substitute for DIT. This enables diagnosis at CIS with appropriate MRI and CSF findings, facilitating earlier treatment."
    difficulty: hard
    tags: [McDonald criteria, MS diagnosis, MRI, neurology]
  - front: "What are the first-line disease-modifying therapies for relapsing-remitting MS in Canada?"
    back: "First-line: interferon beta, glatiramer acetate, teriflunomide, dimethyl fumarate. High-efficacy: natalizumab, fingolimod, ocrelizumab. Highly active disease: alemtuzumab, cladribine.\n\nCanadian MS Treatment Optimization Recommendations support both escalation and early intensive strategies. High-efficacy therapies reduce relapse rate by 50-70% vs interferon at 30%. Treatment choice considers JC virus status and family planning."
    difficulty: hard
    tags: [DMT, MS treatment, disease-modifying therapy, neurology]
  - front: "How is an acute MS relapse managed?"
    back: "IV methylprednisolone 1g daily for 3-5 days. Oral prednisone 1250 mg for 3 days is non-inferior (COPOUSEP trial). Plasma exchange for steroid-refractory relapses. Must involve new/worsening deficit lasting >24 hours without fever/infection.\n\nCanadian guidelines align with AAN recommendations for high-dose corticosteroids. Pseudo-relapses (worsening due to infection, heat, stress) should be excluded before steroids. Tapered oral steroids lack strong evidence."
    difficulty: hard
    tags: [MS relapse, corticosteroids, treatment, neurology]
  - front: "What is the risk of PML with natalizumab and how is it mitigated?"
    back: "PML risk depends on: JC virus antibody status, anti-JCV antibody index (>1.5 = higher risk), and prior immunosuppressant use. Risk ranges from <1/10,000 (JCV negative) to ~1/80 (JCV+ with index >1.5 and prior IS). Mitigation: JCV testing q6 months, extended interval dosing.\n\nPML is a devastating JC virus reactivation. Canadian MS clinics routinely monitor JCV status. Extended interval dosing (every 6-8 weeks) reduces PML risk while maintaining efficacy. Ocrelizumab is a common switch option."
    difficulty: hard
    tags: [PML, natalizumab, JC virus, MS, neurology]
  - front: "What are the typical CSF findings in MS?"
    back: "Oligoclonal bands present in CSF but not serum (>95% sensitivity), elevated IgG index (>0.7), mildly elevated WBC (<50 lymphocytes), normal-mildly elevated protein. CSF is not required if MRI criteria are met.\n\nCSF oligoclonal bands are the most sensitive lab finding. The 2017 McDonald criteria allow OCBs to substitute for dissemination in time. CSF is particularly valuable when MRI findings are equivocal."
    difficulty: medium
    tags: [CSF, oligoclonal bands, MS diagnosis, neurology]
  - front: "What distinguishes MS subtypes (RRMS, SPMS, PPMS)?"
    back: "RRMS (85%): discrete relapses with recovery, stable between attacks. SPMS: RRMS transitioning to progressive worsening without distinct relapses. PPMS (10-15%): progressive from onset, typically progressive myelopathy, equal sex ratio.\n\nRRMS converts to SPMS at ~2-3% per year untreated. PPMS has later onset (~40) and fewer MRI lesions. Ocrelizumab is the only DMT with PPMS evidence (ORATORIO trial). Canadian guidelines recommend annual screening for progression."
    difficulty: medium
    tags: [MS subtypes, RRMS, SPMS, PPMS, neurology]
  - front: "How is NMOSD distinguished from MS and why does it matter?"
    back: "NMOSD: AQP4-IgG antibody positive, severe bilateral optic neuritis and longitudinally extensive transverse myelitis (>=3 vertebral segments). Brain MRI often normal early. Treatment: azathioprine, rituximab, eculizumab. Interferon beta WORSENS NMOSD.\n\nNMOSD must be distinguished because MS therapies (interferons, fingolimod) can exacerbate it. AQP4-IgG has >99% specificity. Canadian neurologists test AQP4 antibodies in any patient with optic neuritis or longitudinally extensive myelitis."
    difficulty: hard
    tags: [NMOSD, Devic disease, AQP4, differential diagnosis, neurology]
  - front: "What are the EDSS score milestones in MS?"
    back: "EDSS 0: normal exam. 4.0: walks >500m without aid. 6.0: requires unilateral assistance to walk 100m. 6.5: bilateral assistance. 7.0: wheelchair-bound. 8.0: bed-bound. 10.0: death from MS.\n\nThe EDSS is the standard disability measure in MS trials and Canadian MS clinics. Key limitation is heavy weighting toward ambulation. EDSS 4.0 and 6.0 are major milestones used in treatment decisions."
    difficulty: medium
    tags: [EDSS, disability, MS assessment, neurology]
  - front: "What is the recommended MRI monitoring protocol for MS patients on DMT?"
    back: "Baseline MRI brain and spinal cord before starting DMT. Follow-up at 6 months then annually. New T2 or gadolinium-enhancing lesions on therapy indicate breakthrough disease requiring DMT reassessment.\n\nCanadian MS Treatment Optimization Recommendations define breakthrough disease as new MRI activity, relapses, or disability progression on DMT. MRI is the most sensitive measure. Spinal cord MRI is added when clinical features suggest cord involvement."
    difficulty: medium
    tags: [MRI monitoring, DMT, MS follow-up, neurology]
  - front: "What are the common presentations of clinically isolated syndrome (CIS)?"
    back: "Optic neuritis (25%): unilateral painful vision loss. Transverse myelitis: band-like sensory level, weakness, urinary retention. Brainstem syndrome: diplopia, vertigo, INO, facial numbness. Lhermitte sign. Uhthoff phenomenon: symptom worsening with heat.\n\nCIS is the first clinical demyelinating event. MRI showing >=2 T2 lesions at CIS predicts 80%+ conversion to MS. Canadian neurologists initiate DMT at CIS when McDonald criteria are met to delay disability."
    difficulty: medium
    tags: [CIS, optic neuritis, MS presentation, neurology]
  - front: "What are the disease-modifying therapies for MS and their key side effects?"
    back: "Platform: interferon-beta (flu-like, hepatotoxicity), glatiramer (injection site). Oral: fingolimod (bradycardia, macular edema), dimethyl fumarate (flushing, lymphopenia). High-efficacy: natalizumab (PML risk), ocrelizumab (infusion reactions)\n\nEscalation vs early aggressive approach. PML risk with natalizumab: JCV antibody positive + >2 years use. Ocrelizumab: first-line for primary progressive MS. Alemtuzumab: autoimmune complications."
    difficulty: hard
    tags: [MS, DMT, treatment]
  - front: "Compare interferon-beta and glatiramer acetate for MS: mechanism, efficacy, and key side effects."
    back: "Both reduce relapse rate by ~30%. IFN-beta: immunomodulatory; side effects include flu-like symptoms, injection site reactions, hepatotoxicity, depression, leukopenia. Glatiramer: mimics myelin basic protein; side effects include injection site reactions, benign immediate post-injection reaction, lipoatrophy.\n\nBoth are first-line moderate-efficacy DMTs for RRMS per Canadian MS guidelines. IFN-beta requires LFTs and CBC monitoring; glatiramer does not require blood monitoring. Adherence is often limited by injection burden, prompting switches to oral agents."
    difficulty: medium
    tags: [interferon, glatiramer, DMT, RRMS, side-effects]
  - front: "What is the mechanism, efficacy, and major risk of natalizumab in MS?"
    back: "Anti-alpha4-integrin monoclonal antibody blocking lymphocyte migration across BBB. Reduces relapses by ~68%. Major risk: PML from JC virus reactivation. Risk stratified by JCV antibody index, prior immunosuppressant use, and treatment duration >2 years.\n\nPML risk is ~1/1000 overall but ~1/90 in JCV-positive patients with prior immunosuppression and >2 years treatment. Canadian guidelines recommend JCV antibody testing every 6 months and MRI surveillance. Extended interval dosing (every 6 weeks) may reduce PML risk."
    difficulty: hard
    tags: [natalizumab, PML, JCV, high-efficacy-DMT, alpha4-integrin]
  - front: "What is the role of ocrelizumab in MS and what monitoring is needed?"
    back: "Anti-CD20 monoclonal antibody approved for both RRMS and PPMS (first DMT approved for PPMS). IV every 6 months. Requires hepatitis B screening, immunoglobulin levels monitoring, infection screening. No live vaccines.\n\nOPERA I/II showed superiority over IFN-beta in RRMS. ORATORIO showed modest PPMS benefit. Hepatitis B reactivation is a serious risk. Hypogammaglobulinemia can develop with prolonged use requiring IgG monitoring. Canadian guidelines recommend it as high-efficacy therapy."
    difficulty: hard
    tags: [ocrelizumab, anti-CD20, PPMS, RRMS, B-cell-depletion]
  - front: "A 30-year-old woman presents with acute unilateral vision loss, pain with eye movement, and RAPD. What is the workup?"
    back: "Optic neuritis workup: MRI brain/orbits with gadolinium, OCT, visual evoked potentials (prolonged P100), AQP4-IgG and MOG-IgG antibodies, CSF (oligoclonal bands), visual field testing.\n\nOptic neuritis is the presenting symptom in 20% of MS. The ONTT showed IV methylprednisolone speeds recovery but does not change final visual outcome. MRI findings determine MS risk: >=1 white matter lesion = 72% 15-year risk vs 25% if normal. AQP4 testing rules out NMOSD."
    difficulty: medium
    tags: [optic-neuritis, MRI, RAPD, demyelination, visual-evoked-potentials]
  - front: "How do you differentiate NMOSD from MS?"
    back: "NMOSD: AQP4-IgG positive (70-80%), severe poorly-recovering attacks, bilateral optic neuritis, longitudinally extensive transverse myelitis (>=3 segments), area postrema syndrome, brain MRI often normal. MS: oligoclonal bands in CSF, periventricular/juxtacortical lesions, short spinal cord lesions (<2 segments).\n\nDistinguishing NMOSD from MS is critical because IFN-beta and natalizumab can worsen NMOSD. NMOSD treatment: rituximab, eculizumab, inebilizumab, satralizumab. AQP4-IgG has >99% specificity via cell-based assay. MOG-antibody disease is a separate entity with better prognosis."
    difficulty: hard
    tags: [NMOSD, AQP4, NMO-vs-MS, longitudinal-myelitis, differential-diagnosis]
  - front: "What are the McDonald criteria for MS diagnosis?"
    back: "Demonstrate dissemination in space (DIS: lesions in >=2 of 4 CNS regions — periventricular, cortical/juxtacortical, infratentorial, spinal cord) AND dissemination in time (DIT: simultaneous enhancing and non-enhancing lesions, or new lesion on follow-up). CSF oligoclonal bands can substitute for DIT.\n\n2017 McDonald criteria allow diagnosis at first clinical event with a single MRI, enabling earlier DMT initiation. Canadian MS guidelines adopt these criteria. They apply only to typical MS presentations — must exclude mimics (NMOSD, sarcoidosis, vasculitis) first."
    difficulty: hard
    tags: [McDonald-criteria, DIS, DIT, MRI, MS-diagnosis]
  - front: "When is MS treatment escalation indicated?"
    back: "Breakthrough disease on current DMT: >=1 relapse/year, new/enlarging MRI lesions, or disability progression. Switch from moderate-efficacy (IFN-beta, glatiramer, dimethyl fumarate) to high-efficacy DMT (natalizumab, ocrelizumab, alemtuzumab, cladribine).\n\nCanadian guidelines recognize both escalation and early intensive treatment approaches. Younger patients with high lesion burden and poor prognostic factors may benefit from first-line high-efficacy therapy (TREAT-MS paradigm). NEDA (No Evidence of Disease Activity) is an emerging treatment target."
    difficulty: hard
    tags: [treatment-escalation, NEDA, high-efficacy-DMT, breakthrough, MS-management]
  - front: "How is an acute MS relapse managed?"
    back: "IV methylprednisolone 1 g daily for 3-5 days. Reassess at 2 weeks. If incomplete recovery, consider plasma exchange (PLEX) — 5-7 exchanges over 10-14 days, especially for severe steroid-refractory relapses.\n\nSteroids hasten recovery but do not alter final disability. Canadian MS guidelines recommend treating relapses causing functional impairment; minor sensory symptoms may be observed. GI prophylaxis with PPI and glucose monitoring during pulse steroids are standard supportive measures."
    difficulty: medium
    tags: [MS-relapse, methylprednisolone, PLEX, acute-management, steroids]
  - front: "What vaccines are contraindicated in MS patients on immunosuppressive DMTs?"
    back: "All live vaccines (MMR, varicella, live zoster/Zostavax, yellow fever, BCG) are contraindicated. Inactivated vaccines are safe but may have reduced efficacy on anti-CD20 therapies. Recombinant zoster vaccine (Shingrix) is safe. Ideally complete vaccination before starting DMT.\n\nCanadian MS guidelines recommend completing vaccination before B-cell depleting therapies due to blunted response. Time vaccines >=4-6 weeks before or >=3 months after anti-CD20 infusion. Annual influenza, COVID-19, pneumococcal, and hepatitis B (screen before anti-CD20) are recommended."
    difficulty: medium
    tags: [vaccination, immunosuppression, DMT, live-vaccines, MS-management]
  - front: "What are poor prognostic factors in MS at diagnosis?"
    back: "Male sex, older onset (>40), primary progressive course, high T2 lesion volume, spinal cord lesions, infratentorial lesions, incomplete recovery from first relapse, short inter-relapse interval, African descent, early cognitive impairment.\n\nPrognostic factors guide treatment intensity. Patients with multiple poor factors may benefit from early high-efficacy DMT. EDSS tracks disability over time. Brain atrophy rate on serial MRI is an emerging prognostic biomarker in Canadian MS research."
    difficulty: medium
    tags: [prognosis, prognostic-factors, MS-outcome, EDSS, treatment-decision]
