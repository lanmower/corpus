# Geriatrics & Elder Care (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the five domains of the FRAIL scale used to screen for frailty in older adults?"
    back: "Fatigue, Resistance (stair climbing), Ambulation (walking), Illnesses (>5 comorbidities), Loss of weight (>5%)\n\nThe FRAIL scale is a validated, quick screening tool. Scores 0=robust, 1–2=pre-frail, 3–5=frail. It predicts falls, hospitalization, and mortality in community-dwelling older adults."
    difficulty: easy
    tags: [frailty, FRAIL-scale, geriatrics, screening]
  - front: "A 79-year-old woman falls at home. Which standardized test best assesses her dynamic balance and fall risk?"
    back: "Timed Up and Go (TUG) test\n\nTUG measures time to rise from a chair, walk 3 m, turn, and return. >12 seconds indicates fall risk. The Canadian Falls Prevention Curriculum recommends TUG for all community-dwelling older adults after a fall."
    difficulty: easy
    tags: [falls, TUG, balance, geriatrics]
  - front: "Which drug class is the most common pharmacological contributor to falls in older adults?"
    back: "Psychotropics (benzodiazepines, antipsychotics, antidepressants)\n\nPsychotropics cause sedation, orthostatic hypotension, and impaired coordination. Benzodiazepines double fall risk. Deprescribing is a priority in fall prevention per the AGS Beers Criteria and STOPP criteria."
    difficulty: medium
    tags: [falls, benzodiazepines, psychotropics, deprescribing, geriatrics]
  - front: "What Mini-Cog score suggests possible cognitive impairment requiring further evaluation?"
    back: "Score of 0–2 out of 5 (0–3 recall words + clock drawing)\n\nThe Mini-Cog combines 3-word recall (1 point each) and clock drawing (0 or 2 points). A score ≤2 suggests possible dementia and warrants further evaluation with MoCA or formal neuropsychological testing."
    difficulty: easy
    tags: [dementia, Mini-Cog, cognitive-screening, geriatrics]
  - front: "An 80-year-old man is admitted post-hip fracture. On day 2 he becomes acutely confused, agitated, and disoriented. What is the diagnosis and key precipitant to address?"
    back: "Delirium; address pain, urinary retention, constipation, medications, and infection\n\nDelirium affects 14–56% of hospitalized older adults. Post-operative pain under-treatment is a key precipitant in hip fracture patients. Use the CAM tool to confirm. Non-pharmacological multicomponent prevention is first-line."
    difficulty: hard
    tags: [delirium, hip-fracture, geriatrics, CAM, hospitalization]
  - front: "Which calcium and vitamin D daily doses are recommended for fracture prevention in adults over 70 years?"
    back: "Calcium 1200 mg/day (dietary preferred) + Vitamin D 800–2000 IU/day\n\nOsteoporosis Canada recommends 1200 mg calcium and at least 800 IU vitamin D daily for those ≥50 years, with up to 2000 IU/day in elderly or institutionalized individuals. Calcium supplements may modestly increase CV risk."
    difficulty: easy
    tags: [osteoporosis, calcium, vitamin-D, fracture-prevention, geriatrics]
  - front: "What is the DAST-10 used for in geriatric patients?"
    back: "Screening for drug/substance use problems (Drug Abuse Screening Test — 10 items)\n\nDAST-10 identifies problematic substance use including prescription opioids, benzodiazepines, and alcohol. Substance misuse is underdiagnosed in older adults and contributes to falls, delirium, and cognitive decline."
    difficulty: easy
    tags: [substance-use, screening, DAST, geriatrics]
  - front: "A 77-year-old woman with a recent hip fracture has a T-score of -2.7. She is on vitamin D and calcium. What pharmacological therapy should be started?"
    back: "Bisphosphonate (e.g., alendronate or zoledronic acid)\n\nPost-fracture patients with T-score ≤-2.5 meet criteria for pharmacological osteoporosis therapy. Zoledronic acid IV annually is effective post-hip fracture and reduces mortality. Alendronate 70 mg weekly is an oral option."
    difficulty: medium
    tags: [osteoporosis, bisphosphonate, hip-fracture, T-score, zoledronic-acid]
  - front: "What is the recommended screening interval for cognitive impairment in adults ≥65 in Canadian primary care?"
    back: "Annual assessment using a validated tool (e.g., MoCA, Mini-Cog) in those with risk factors; no routine universal screening recommended by CTFPHC\n\nThe Canadian Task Force on Preventive Health Care (CTFPHC) does not recommend routine cognitive screening of asymptomatic adults. However, case-finding in those with memory complaints, vascular risk factors, or functional decline is appropriate."
    difficulty: medium
    tags: [dementia, cognitive-screening, CTFPHC, geriatrics]
  - front: "Which scale quantifies severity of functional impairment in activities of daily living (ADLs) in older adults?"
    back: "Katz Index of ADLs (bathing, dressing, toileting, transferring, continence, feeding)\n\nThe Katz ADL Index scores 6 basic self-care functions. It is used to assess functional status, plan care transitions, and monitor disease progression. Lawton-Brody IADL scale assesses instrumental ADLs (cooking, finances, etc.)."
    difficulty: easy
    tags: [ADL, Katz-index, functional-status, geriatrics]
  - front: "An 85-year-old nursing home resident is refusing meals and has lost 8% of body weight over 3 months. What is the first step in management?"
    back: "Comprehensive assessment for reversible causes (dental problems, dysphagia, depression, medications, pain, constipation)\n\nMalnutrition in older adults is often multifactorial. Reversible causes must be excluded before considering appetite stimulants or feeding tubes (which are rarely appropriate in advanced dementia). MNA (Mini Nutritional Assessment) can quantify risk."
    difficulty: medium
    tags: [malnutrition, weight-loss, nursing-home, geriatrics, dysphagia]
  - front: "Which antihypertensive target is recommended for community-dwelling adults ≥75 years according to Hypertension Canada?"
    back: "SBP <130 mmHg if tolerated (based on SPRINT trial data)\n\nSPRINT trial showed benefit of intensive BP control (SBP <120 target) in adults ≥75 without diabetes. Hypertension Canada recommends SBP <130 mmHg in high-CV-risk elderly patients if tolerated, with close monitoring for orthostatic hypotension."
    difficulty: hard
    tags: [hypertension, elderly, SBP-target, SPRINT, Hypertension-Canada]
  - front: "What is urge urinary incontinence and what is first-line non-pharmacological management?"
    back: "Involuntary urine leakage with sudden urge; first-line is bladder training and pelvic floor exercises\n\nUrge incontinence (overactive bladder) is the most common type in elderly women. Bladder training (scheduled voiding, urge suppression) and pelvic floor physiotherapy are first-line before anticholinergics (which cause cognitive side effects in elderly)."
    difficulty: medium
    tags: [urinary-incontinence, overactive-bladder, pelvic-floor, geriatrics]
  - front: "A 78-year-old man has a PMR (polymyalgia rheumatica) flare after prednisone taper. He also has osteoporosis. What bone protection should be prescribed?"
    back: "Bisphosphonate (alendronate or zoledronic acid) plus calcium and vitamin D\n\nPatients on glucocorticoids ≥7.5 mg/day for ≥3 months require bone protection. Osteoporosis Canada and ACR recommend bisphosphonate therapy with calcium/vitamin D supplementation to prevent glucocorticoid-induced osteoporosis."
    difficulty: medium
    tags: [glucocorticoid-induced-osteoporosis, PMR, bisphosphonate, geriatrics]
  - front: "What is advance care planning and when should it be initiated in older adults?"
    back: "Ongoing process of discussing future healthcare goals, values, and preferences — ideally started early, before a health crisis\n\nACP includes identifying a substitute decision-maker, completing advance directives/personal directives, and discussing goals of care. Canadian guidelines recommend initiating ACP with all patients ≥65, especially those with life-limiting illness."
    difficulty: easy
    tags: [advance-care-planning, goals-of-care, geriatrics, substitute-decision-maker]
  - front: "What is the approach to polypharmacy in elderly?"
    back: "Use STOPP/START criteria or Beers Criteria. Deprescribe: PPIs, benzodiazepines, anticholinergics, statins in limited life expectancy. Use deprescribing.org algorithms\n\nPolypharmacy: >=5 medications. Associated with falls, ADRs, hospitalizations, cognitive decline. Medstopper tool helps prioritize. Review at every visit."
    difficulty: medium
    tags: [polypharmacy, geriatrics]
  - front: "What distinguishes delirium from dementia?"
    back: "Delirium: acute onset, fluctuating course, inattention, reversible. Dementia: insidious onset, progressive, attention preserved (early), irreversible\n\nDelirium causes: infection, metabolic, drugs (anticholinergics, benzos, opioids), urinary retention, constipation. CAM tool for diagnosis. Treat underlying cause. Avoid restraints and benzos if possible."
    difficulty: medium
    tags: [delirium, dementia]
  - front: "What is the comprehensive geriatric assessment (CGA)?"
    back: "Systematic evaluation of: medical (comorbidities, medications, nutrition), functional (ADLs, IADLs, mobility), psychological (cognition, mood, behavior), social (support, caregiver, housing, finances)\n\nCGA improves outcomes: reduces mortality, institutionalization, and functional decline. Interdisciplinary team approach. Tools: Katz ADL index, Lawton IADL, MMSE/MoCA, GDS, Timed Up and Go. Canadian Geriatrics Society promotes CGA in acute and community settings."
    difficulty: medium
    tags: [CGA, geriatric assessment, functional status]
  - front: "How are delirium and dementia differentiated clinically?"
    back: "Delirium: acute onset, fluctuating, inattention, often reversible. Dementia: gradual onset, progressive, attention initially preserved, irreversible. Delirium can be superimposed on dementia\n\nDelirium screening: CAM (Confusion Assessment Method) - requires acute change + inattention + EITHER disorganized thinking OR altered LOC. Dementia screening: MoCA (>=26 normal) or MMSE (>=24). Delirium is a medical EMERGENCY requiring cause identification."
    difficulty: hard
    tags: [delirium, dementia, CAM, MoCA]
  - front: "What are the common causes of delirium (mnemonic)?"
    back: "DELIRIUM(S): Drugs, Electrolytes, Lack of drugs (withdrawal), Infection (UTI, pneumonia), Reduced sensory input, Intracranial event, Urinary retention/constipation, Myocardial/pulmonary event, (Subdural)\n\nDrugs are the most common modifiable cause (anticholinergics, benzodiazepines, opioids). Non-pharmacological prevention: orientation, mobilization, sleep hygiene, hydration, avoid restraints. Avoid antipsychotics unless patient is danger to self/others."
    difficulty: hard
    tags: [delirium, causes, geriatrics]
  - front: "What is the approach to falls prevention in elderly patients?"
    back: "Multifactorial assessment: gait/balance (TUG test), medications (review for culprits), vision, orthostatic BP, home hazards, footwear, vitamin D, strength/balance exercise (Otago program)\n\nFalls affect 30% of >=65 annually, leading cause of injury-related death in elderly. High-risk meds: benzodiazepines, antihypertensives, anticholinergics, opioids, antipsychotics. Tai chi and Otago exercise program have best evidence. Home safety assessment by OT reduces falls."
    difficulty: hard
    tags: [falls prevention, elderly, geriatrics]
  - front: "What are the stages and types of dementia?"
    back: "Alzheimer (60-80%): memory first, gradual. Vascular: stepwise, executive dysfunction. Lewy body: visual hallucinations, parkinsonism, fluctuations. Frontotemporal: personality/behavior changes, younger onset. Staging: mild/moderate/severe by function\n\nDiagnosis: clinical history + cognitive testing (MoCA) + labs to exclude reversible causes (TSH, B12, calcium, CBC, electrolytes, glucose) + CT/MRI. Alzheimer treatment: cholinesterase inhibitors (donepezil, rivastigmine, galantamine) for mild-moderate, memantine for moderate-severe."
    difficulty: hard
    tags: [dementia, Alzheimer, Lewy body, vascular]
  - front: "What medications are used for dementia and what are their side effects?"
    back: "Cholinesterase inhibitors (donepezil 5-10mg, rivastigmine, galantamine): nausea, diarrhea, bradycardia, syncope. Memantine (NMDA antagonist): for moderate-severe, better tolerated. Neither reverses or halts progression\n\nStart low go slow. Modest benefit: ~2 points MMSE. Discontinue if no benefit after 3-6 months or severe stage. Monitor for bradycardia (caution with beta-blockers). Anticholinergic medications worsen cognition and should be discontinued."
    difficulty: hard
    tags: [dementia treatment, donepezil, memantine]
  - front: "What is the approach to urinary incontinence in elderly?"
    back: "Classify: stress (cough/sneeze), urge (detrusor overactivity), overflow (retention), functional (mobility/cognition). Assess: bladder diary, PVR, UA. Treat: pelvic floor exercises (stress), bladder training + antimuscarinics (urge)\n\nAvoid oxybutynin in elderly (crosses BBB, cognitive impairment). Mirabegron (beta-3 agonist) preferred for urge incontinence in elderly. Timed voiding for functional incontinence. Address contributing factors: constipation, medications, caffeine, mobility."
    difficulty: medium
    tags: [urinary incontinence, elderly, geriatrics]
  - front: "What is frailty and how is it assessed?"
    back: "Frailty phenotype (Fried): >=3 of: unintentional weight loss, exhaustion, low physical activity, slow gait, weak grip. Pre-frail: 1-2. Also: Clinical Frailty Scale (Rockwood) 1-9\n\nFrailty predicts adverse outcomes: falls, disability, hospitalization, mortality. CFS is widely used in Canadian healthcare (used in COVID triage). Frailty is potentially modifiable with exercise, nutrition optimization, medication review, and social support."
    difficulty: medium
    tags: [frailty, Clinical Frailty Scale, geriatrics]
  - front: "What are the principles of prescribing in elderly patients?"
    back: "Start low, go slow, but get there. Review all medications regularly. Use Beers/STOPP/START criteria. Avoid anticholinergic burden (ACB score). Consider life expectancy in preventive therapy. Deprescribe proactively\n\nPharmacokinetic changes: decreased renal clearance, hepatic metabolism, increased body fat (longer half-life lipophilic drugs), decreased albumin (higher free drug). Pharmacodynamic: increased sensitivity to CNS depressants, anticholinergics, anticoagulants."
    difficulty: medium
    tags: [prescribing, elderly, pharmacology]
  - front: "How is elder abuse screened for and managed?"
    back: "Types: physical, emotional, financial, sexual, neglect. Screen: direct questioning, look for unexplained injuries, poor hygiene, fearfulness. Report to APS (Adult Protective Services) per provincial legislation. Mandatory reporting varies by province\n\nElder abuse affects ~10% of Canadian seniors. Risk factors: social isolation, dementia, caregiver stress, financial dependence. Physicians should screen in private without caregiver present. Document findings carefully. Connect with community resources and social work."
    difficulty: medium
    tags: [elder abuse, screening, geriatrics]
  - front: "What is the approach to malnutrition in elderly patients?"
    back: "Screen with MNA (Mini Nutritional Assessment). Causes: poor dentition, depression, medications, poverty, functional limitations, malabsorption. Target protein 1-1.2 g/kg/day. Supplement vitamin D. Address reversible causes\n\nMalnutrition affects 30-50% of hospitalized elderly. Consequences: poor wound healing, immune dysfunction, muscle wasting (sarcopenia), increased mortality. Oral nutritional supplements improve outcomes. Dietitian referral. Address social determinants (food insecurity, Meals on Wheels)."
    difficulty: medium
    tags: [malnutrition, nutrition, elderly]
  - front: "What is the approach to driving assessment in elderly patients with cognitive impairment?"
    back: "MoCA <18 or significant functional impairment: consider unfit. Refer for comprehensive driving evaluation. Mandatory reporting of medically unfit drivers varies by province (mandatory in AB, ON; discretionary in BC, QC)\n\nCMA Physician Guide to Determining Fitness to Drive. Dementia per se does not preclude driving - functional assessment needed. Provincial reporting obligations: physicians may/must report. Consider progressive nature. Patient safety vs autonomy. Discuss transportation alternatives."
    difficulty: hard
    tags: [driving fitness, cognitive impairment, reporting]
  - front: "What is the palliative approach to care in geriatrics?"
    back: "Early integration of palliative principles alongside disease-directed therapy. Symptom management (pain, dyspnea, nausea, delirium). Goals of care conversations. Caregiver support. Hospice referral when appropriate\n\nPalliative approach differs from end-of-life care - can be concurrent with curative treatment. In Canada hospice and palliative care is publicly funded. ESAS (Edmonton Symptom Assessment System) for symptom monitoring. Opioids for dyspnea and pain are appropriate at end of life."
    difficulty: medium
    tags: [palliative care, geriatrics, symptom management]
  - front: "What are the criteria for and management of behavioral and psychological symptoms of dementia (BPSD)?"
    back: "Non-pharmacological first: identify triggers, routine, music therapy, redirection, caregiver education. Pharmacological only for severe agitation/psychosis: risperidone 0.25-1mg (only approved antipsychotic for BPSD in Canada). Time-limited trial\n\nAntipsychotics carry black-box warning for increased mortality in elderly dementia (1.6-1.7x). Attempt taper after 3 months stability. Avoid benzodiazepines (paradoxical agitation, falls). Trazodone for sleep. Assess for pain, constipation, infection as causes."
    difficulty: hard
    tags: [BPSD, dementia, antipsychotic, geriatrics]
  - front: "What is the Choosing Wisely Canada approach to geriatric care?"
    back: "Key recommendations: do not use antipsychotics first-line for BPSD, avoid benzodiazepines for insomnia in elderly, do not screen with PSA >70, avoid screening tests when life expectancy <10y, do not use PPI long-term without reassessment\n\nChoosing Wisely Canada promotes evidence-based reduction of unnecessary tests and treatments. Particularly relevant in elderly where harms of interventions may exceed benefits. Each specialty society contributes top 5 recommendations. Promotes shared decision-making."
    difficulty: medium
    tags: [Choosing Wisely, geriatrics, overtreatment]
  - front: "What are the functional assessments used in geriatric rehabilitation?"
    back: "ADLs (Katz Index): bathing, dressing, toileting, transferring, continence, feeding. IADLs (Lawton): phone, shopping, cooking, housekeeping, laundry, transport, medications, finances\n\nFunctional decline predicts mortality and institutionalization. Comprehensive geriatric assessment includes: medical, functional, cognitive (MoCA/MMSE), mood (GDS), nutrition (MNA), social supports, falls risk, polypharmacy."
    difficulty: medium
    tags: [geriatrics, functional assessment]
  - front: "What is the Timed Up and Go test for falls risk?"
    back: "Patient rises from chair, walks 3m, turns, walks back, sits. >=12 seconds = increased falls risk. Part of multifactorial falls assessment\n\nFalls assessment: gait/balance (TUG), vision, medications (sedatives, antihypertensives), orthostatic BP, home hazards, footwear, vitamin D, bone density. Multifactorial intervention reduces falls 20-30%."
    difficulty: easy
    tags: [falls, TUG, geriatrics]
  - front: "What are the types and staging of pressure injuries?"
    back: "Stage 1: non-blanchable erythema. Stage 2: partial thickness (blister/shallow ulcer). Stage 3: full thickness (subcutaneous visible). Stage 4: full thickness with exposed bone/tendon/muscle. Unstageable: covered by eschar\n\nBraden Scale assesses risk (sensory, moisture, activity, mobility, nutrition, friction). Prevention: reposition q2h, pressure-redistributing surfaces, nutrition optimization, moisture management."
    difficulty: medium
    tags: [pressure injury, staging]
  - front: "What are the types of urinary incontinence and first-line treatments?"
    back: "Stress: leaks with cough/sneeze — pelvic floor exercises (Kegels), pessary, surgery. Urge: sudden urge, frequency — bladder training, antimuscarinic (oxybutynin) or mirabegron. Overflow: incomplete emptying — treat obstruction, intermittent catheterization\n\nMixed incontinence common. Functional: mobility/cognitive barriers. Avoid antimuscarinics in elderly (cognitive decline, dry mouth, constipation). Mirabegron (beta-3 agonist) safer in elderly."
    difficulty: medium
    tags: [incontinence, geriatrics]
  - front: "What are the major risk factors for falls in the elderly, and what screening tool is used for fall risk assessment?"
    back: "Risk factors: previous falls, muscle weakness, gait/balance impairment, polypharmacy (especially sedatives, antihypertensives), visual impairment, cognitive impairment, orthostatic hypotension, environmental hazards. Screening: Timed Up and Go (TUG) test — abnormal if >12 seconds.\n\nFalls are the leading cause of injury-related death and hospitalization in Canadians over 65. The TUG test assesses functional mobility by timing a patient rising from a chair, walking 3 meters, turning, and returning. A multifactorial approach addressing all identified risk factors is more effective than single interventions."
    difficulty: easy
    tags: [falls, elderly, Timed Up and Go, risk assessment, polypharmacy]
  - front: "What is the multifactorial intervention approach for fall prevention in elderly patients?"
    back: "Exercise program (balance + strength training), medication review (reduce/stop sedatives, antihypertensives), vision correction, home safety assessment, vitamin D supplementation (if deficient), management of orthostatic hypotension, footwear assessment, assistive device fitting.\n\nThe Otago Exercise Programme (strength and balance exercises) reduces falls by ~35% in community-dwelling elderly. Vitamin D (at least 800 IU/day) reduces falls in those who are deficient. Deprescribing psychotropic medications is one of the highest-yield interventions. Hip protectors may reduce hip fracture risk in institutionalized patients."
    difficulty: medium
    tags: [fall prevention, multifactorial intervention, exercise, deprescribing, vitamin D]
  - front: "An 82-year-old presents after a fall with groin pain, shortened and externally rotated leg. What is the likely diagnosis, and what is the management approach?"
    back: "Hip fracture (femoral neck or intertrochanteric). Management: pain control, IV fluids, preoperative medical optimization (within 24-48 hours ideally), surgical fixation (displaced femoral neck: hemiarthroplasty or THA in active patients; intertrochanteric: sliding hip screw or IM nail).\n\nHip fractures carry 30-day mortality of ~5-10% and 1-year mortality of ~20-30%. Surgery within 48 hours reduces mortality, delirium, and pressure injuries. Nondisplaced femoral neck fractures may be treated with internal fixation (screws). All hip fracture patients should be assessed for osteoporosis and started on treatment."
    difficulty: medium
    tags: [hip fracture, femoral neck fracture, hemiarthroplasty, elderly, surgical timing]
  - front: "What are the types of urinary incontinence, and how do you differentiate stress from urge incontinence clinically?"
    back: "Stress: involuntary leakage with cough, sneeze, exertion (weak pelvic floor/urethral sphincter). Urge: sudden compelling desire to void followed by involuntary leakage (detrusor overactivity). Overflow: incomplete emptying with dribbling (obstruction or detrusor underactivity). Functional: physical or cognitive barriers to reaching toilet.\n\nStress incontinence is most common in women (post-childbirth, menopause) and treated with pelvic floor exercises (Kegels) first-line, then surgical sling procedures. Urge incontinence is treated with bladder training, antimuscarinic agents (oxybutynin, tolterodine), or beta-3 agonist (mirabegron). Antimuscarinics should be avoided in elderly due to anticholinergic burden."
    difficulty: medium
    tags: [urinary incontinence, stress incontinence, urge incontinence, pelvic floor, geriatrics]
  - front: "What is the initial workup for urinary incontinence in the elderly?"
    back: "History (type, frequency, severity, triggers), voiding diary, medication review (diuretics, anticholinergics, alpha-blockers), urinalysis (rule out UTI, hematuria), post-void residual (rule out overflow/retention), cognitive and functional assessment.\n\nTransient causes of incontinence can be remembered with the mnemonic DIAPPERS: Delirium, Infection, Atrophic vaginitis, Pharmaceuticals, Psychological, Excess fluid input, Restricted mobility, Stool impaction. Addressing reversible causes should precede invasive workup or treatment. Urodynamic studies are reserved for refractory or complex cases."
    difficulty: easy
    tags: [incontinence workup, DIAPPERS, post-void residual, voiding diary, geriatric assessment]
  - front: "What are the stages of pressure injuries, and what defines an unstageable pressure injury?"
    back: "Stage I: intact skin with non-blanchable erythema. Stage II: partial-thickness skin loss (shallow open ulcer or blister). Stage III: full-thickness skin loss (fat visible, no bone/tendon). Stage IV: full-thickness tissue loss with exposed bone, tendon, or muscle. Unstageable: full-thickness loss covered by slough or eschar preventing staging.\n\nDeep tissue pressure injury (DTPI) is a newer category presenting as intact skin with persistent deep red/maroon/purple discoloration that may rapidly deteriorate. The sacrum, heels, and ischial tuberosities are the most common sites. Prevention with repositioning every 2 hours and pressure-redistribution surfaces is more effective than treatment."
    difficulty: easy
    tags: [pressure injury, staging, unstageable, wound classification, geriatrics]
  - front: "What is the Braden Scale, and how is it used in pressure injury prevention?"
    back: "The Braden Scale assesses 6 risk factors: sensory perception, moisture, activity, mobility, nutrition, and friction/shear. Scored 6-23; lower scores = higher risk. Score ≤18: at risk; ≤12: high risk; ≤9: very high risk.\n\nThe Braden Scale should be completed on admission and regularly reassessed. Interventions for high-risk patients include repositioning every 2 hours, pressure-redistribution mattresses, nutritional optimization (protein, calories), moisture management, and heel elevation. Incontinence-associated dermatitis increases risk and should be managed with barrier creams."
    difficulty: easy
    tags: [Braden Scale, pressure injury prevention, risk assessment, repositioning, nursing care]
  - front: "What is the Clinical Frailty Scale (CFS), and how does it guide clinical decision-making?"
    back: "The CFS is a 9-point scale from 1 (very fit) to 9 (terminally ill). Score ≥5 (mildly frail) identifies patients at increased risk of adverse outcomes (falls, disability, hospitalization, death). It is used to guide goals of care discussions, surgical risk assessment, and resource allocation.\n\nFrailty is distinct from disability and comorbidity — it represents decreased physiological reserve. CFS ≥5 is associated with higher ICU mortality and is used in some triage frameworks. Comprehensive geriatric assessment (CGA) with targeted interventions can improve outcomes in frail patients, including reduced hospital readmissions and functional decline."
    difficulty: medium
    tags: [Clinical Frailty Scale, frailty, geriatric assessment, goals of care, prognosis]
  - front: "What are the components of a Comprehensive Geriatric Assessment (CGA)?"
    back: "Medical: comorbidities, medications, nutrition, continence, pain. Functional: ADLs (Katz Index), IADLs (Lawton Scale), mobility, falls risk. Cognitive: MMSE or MoCA, delirium screening. Psychological: depression (GDS), anxiety. Social: caregiver support, living situation, finances, advance directives.\n\nCGA has been shown to increase the likelihood of patients being alive and in their own homes at 12 months following hospitalization. It is most beneficial for frail patients who are not too well (no benefit) or too sick (futile). CGA should be performed by an interdisciplinary team including geriatrician, nurse, social worker, physiotherapist, and occupational therapist."
    difficulty: medium
    tags: [CGA, comprehensive geriatric assessment, ADL, IADL, interdisciplinary]
  - front: "What are the types of elder abuse, and what are the risk factors and screening considerations?"
    back: "Types: physical, psychological/emotional, financial/material, sexual, neglect (including self-neglect). Risk factors: social isolation, caregiver stress/substance abuse, cognitive impairment, functional dependence. Screen by interviewing patient alone; ask direct questions in a non-judgmental manner.\n\nElder abuse affects approximately 10% of older Canadians. Financial abuse is the most common type. All provinces have adult protection legislation, though mandatory reporting requirements vary by jurisdiction. Clinicians should be alert to unexplained injuries, malnutrition, poor hygiene, fearful behavior around caregivers, and unusual financial transactions."
    difficulty: medium
    tags: [elder abuse, risk factors, screening, types of abuse, mandatory reporting]
  - front: "What interventions prevent deconditioning in hospitalized elderly patients?"
    back: "Early mobilization (within 24 hours of admission), minimize bed rest orders, remove unnecessary tethers (IVs, catheters, telemetry), physical therapy consult, avoid benzodiazepines and anticholinergics, adequate nutrition/protein, maintain day-night orientation, promote independence in ADLs.\n\nHospitalized elderly lose ~5% of muscle strength per day of bed rest. Deconditioning leads to prolonged hospitalization, falls, institutionalization, and death. The Hospital Elder Life Program (HELP) reduces delirium incidence by 40% and includes mobility protocols, cognitive stimulation, sleep enhancement, and nutrition/hydration support."
    difficulty: easy
    tags: [deconditioning, hospital elder life, early mobilization, bed rest, functional decline]
  - front: "What is polypharmacy, and what tools are used to identify potentially inappropriate medications in the elderly?"
    back: "Polypharmacy: use of ≥5 medications concurrently. Tools: Beers Criteria (AGS list of potentially inappropriate medications in older adults), STOPP/START criteria (screening tool for potentially inappropriate prescriptions and for prescriptions that should be started). Common offenders: benzodiazepines, anticholinergics, NSAIDs, first-generation antihistamines.\n\nPolypharmacy increases risk of adverse drug events, drug interactions, falls, cognitive impairment, and non-adherence. Deprescribing should be systematic — prioritize stopping medications with highest risk and lowest benefit. The deprescribing.org algorithms provide evidence-based guidance for tapering PPIs, benzodiazepines, antipsychotics, and other commonly overused medications."
    difficulty: medium
    tags: [polypharmacy, Beers Criteria, STOPP/START, deprescribing, medication safety]
  - front: "What is the approach to wound care for Stage III and IV pressure injuries?"
    back: "Debride necrotic tissue (sharp, enzymatic, or autolytic), manage bacterial bioburden (topical antiseptics if colonized, systemic antibiotics only for cellulitis/sepsis), maintain moist wound environment (hydrogels, foams, alginates), optimize nutrition (protein 1.25-1.5 g/kg/day, vitamin C, zinc), offload pressure, reassess regularly.\n\nThe TIME framework guides wound management: Tissue (debridement), Infection/Inflammation (bioburden control), Moisture (balance), Edge (wound edge advancement). Negative pressure wound therapy (VAC) can promote granulation in large Stage III/IV wounds. Surgical flap closure may be considered for recurrent or non-healing wounds in appropriate candidates."
    difficulty: medium
    tags: [wound care, pressure injury management, debridement, TIME framework, nutrition]
  - front: "An 85-year-old nursing home resident is found with unexplained bruising on the upper arms in different stages of healing. What should you consider, and what are the next steps?"
    back: "Consider physical elder abuse. Next steps: document injuries in detail (size, location, color, stage), interview patient alone, assess for other signs (fear, depression, malnutrition), review for medical causes (coagulopathy, steroid use), report to adult protective services as required by provincial legislation.\n\nBruising in unusual locations (inner arms, trunk, face) or in different stages suggests non-accidental injury. Patterned injuries (hand, belt, ligature marks) are highly suspicious. Medical causes of easy bruising (anticoagulants, thrombocytopenia, senile purpura) must be excluded. Documentation should be factual and non-judgmental, using body diagrams and photography if possible."
    difficulty: medium
    tags: [elder abuse, unexplained bruising, mandatory reporting, documentation, adult protective services]
  - front: "What is overflow incontinence, and what are the common causes and management?"
    back: "Overflow incontinence: involuntary leakage from an overdistended bladder that cannot empty properly. Causes: BPH (most common in men), diabetic neuropathy, medications (anticholinergics, opioids), spinal cord lesions, strictures. Management: treat underlying cause, intermittent catheterization, alpha-blockers (tamsulosin) or 5-alpha reductase inhibitors for BPH.\n\nPost-void residual >200 mL confirms urinary retention. Acute retention requires catheter decompression. Chronic retention with overflow is often painless and may present with recurrent UTIs or renal impairment. Anticholinergics used for urge incontinence can worsen overflow incontinence, so PVR should be checked before starting these medications."
    difficulty: medium
    tags: [overflow incontinence, urinary retention, BPH, post-void residual, catheterization]
  - front: "What are the key elements of geriatric assessment in family medicine?"
    back: "Comprehensive Geriatric Assessment (CGA): Functional: ADLs (bathing, dressing, feeding, toileting, transferring, continence) and IADLs (cooking, cleaning, finances, medications, transportation). Cognitive: screening with MoCA (preferred in Canada) or MMSE. Mood: PHQ-2/GDS (Geriatric Depression Scale). Mobility/Falls: Timed Up and Go (TUG) test, gait speed, fall history and risk factors. Nutrition: weight loss, BMI, MNA. Medications: polypharmacy review (Beers criteria/STOPP-START), deprescribing. Social: caregiver burden, driving safety, advance care planning, living situation, supports.\n\nCGA has been shown to reduce mortality, institutionalization, and functional decline in frail elderly. MoCA (Montreal Cognitive Assessment) is preferred over MMSE in Canada — it is more sensitive for mild cognitive impairment and was developed in Montreal. The Canadian Deprescribing Network provides evidence-based deprescribing guidelines for common medications in the elderly."
    difficulty: medium
    tags: [geriatric assessment, CGA, MoCA, falls, polypharmacy, family medicine]
  - front: "What are the principles of deprescribing in elderly patients and which medications are commonly targeted?"
    back: "Principles: 1) Review all medications regularly; 2) Identify potentially inappropriate medications (Beers criteria, STOPP/START); 3) Prioritize deprescribing based on risk-benefit; 4) Taper gradually (avoid abrupt discontinuation); 5) Monitor for withdrawal effects and return of symptoms; 6) Involve patient/family in shared decision-making. Common targets: PPIs (>8 weeks without indication), benzodiazepines/Z-drugs, anticholinergics, antipsychotics (for BPSD without clear indication), statins (in limited life expectancy), sulfonylureas (hypoglycemia risk), NSAIDs (GI/renal/CV risk).\n\nPolypharmacy (≥5 medications) affects ~40% of Canadian seniors and increases falls, adverse drug events, and hospitalization. The Canadian Deprescribing Network (deprescribing.org) provides free, evidence-based algorithms. Benzodiazepine deprescribing should reduce dose by ~10-25% every 2-4 weeks — abrupt discontinuation risks seizures."
    difficulty: medium
    tags: [deprescribing, polypharmacy, Beers criteria, geriatrics, family medicine]
  - front: "What are the Canadian guidelines for driving assessment in elderly patients and when must a physician report to the licensing authority?"
    back: "Assessment: screen for conditions affecting driving (vision, cognition, medications, physical function); cognitive screen (MoCA <18 suggests impairment); review medications (sedatives, opioids, anticholinergics); DriveABLE or road test referral if uncertain. Mandatory reporting: physicians are legally required to report to provincial licensing authority when a patient has a medical condition that makes driving unsafe (dementia, seizures, vision loss, syncope, severe cardiac/respiratory/metabolic disease). Varies by province — in Ontario, mandatory reporting under Highway Traffic Act; in some provinces, permissive rather than mandatory.\n\nThis is a common ethical/legal exam topic. Physician reporting for fitness to drive overrides patient confidentiality and does not breach privacy legislation. Most provinces protect physicians from liability for good-faith reporting. The CMA Driver's Guide provides condition-specific medical standards for driving fitness across Canada."
    difficulty: medium
    tags: [driving assessment, mandatory reporting, geriatrics, medical-legal, family medicine]
  - front: "What are the key elements of advance care planning in Canadian family medicine?"
    back: "Advance care planning (ACP): 1) Identify substitute decision-maker (SDM) — varies by province (power of attorney for personal care in Ontario, mandate in Quebec, representation agreement in BC); 2) Discuss values, goals, and preferences for care; 3) Document advance directives (living will); 4) Discuss specific scenarios (CPR, intubation, ICU, dialysis, feeding tubes); 5) Review and update regularly (change in health status, new diagnosis); 6) Ensure SDM understands their role (substituted judgment — what the patient WOULD want, not what SDM wants). POLST/Medical Orders for Scope of Treatment: physician-signed medical orders reflecting ACP conversations.\n\nACP is distinct from advance directives — ACP is the ongoing process of discussion, while advance directives are the written documents. In Canada, health care consent legislation is provincial. Speak Up Canada (advancecareplanning.ca) is the national framework promoted by the Canadian Hospice Palliative Care Association."
    difficulty: medium
    tags: [advance care planning, substitute decision-maker, advance directives, palliative care, family medicine]
  - front: "What is the approach to falls assessment and prevention in elderly patients?"
    back: "Assessment (multifactorial): History: number of falls, circumstances, witnesses, LOC, prodromal symptoms. Medications: sedatives, antihypertensives, anticholinergics, polypharmacy. Exam: orthostatic vitals, visual acuity, gait/balance (TUG test — abnormal >12 seconds), lower extremity strength, footwear, cognitive screen, cardiac exam. Investigations: CBC, electrolytes, glucose, vitamin D, ECG, consider Holter/echocardiogram if cardiac cause suspected. Prevention (evidence-based): exercise programs (tai chi, balance training — strongest evidence), vitamin D supplementation (≥1000 IU/day), medication review/deprescribing, home safety assessment, vision correction, management of orthostatic hypotension.\n\nFalls affect ~30% of community-dwelling Canadians ≥65 annually and are the leading cause of injury-related hospitalization in seniors. The Canadian Falls Prevention guidelines recommend multifactorial risk assessment for all seniors who report a fall. Exercise is the single most effective intervention — reduces falls by 20-30%."
    difficulty: medium
    tags: [falls, elderly, prevention, TUG test, geriatrics, family medicine]
  - front: "What are the principles of palliative care in Canadian family medicine and how is Medical Assistance in Dying (MAiD) regulated?"
    back: "Palliative care principles: symptom management (pain, dyspnea, nausea, delirium), psychosocial/spiritual support, advance care planning, caregiver support, home-based care when possible. MAiD (Criminal Code of Canada, 2016, amended 2021): Eligibility: ≥18 years, capable of making health decisions, grievous and irremediable medical condition causing enduring suffering, informed consent. Two tracks: Track 1 (natural death reasonably foreseeable): 10-day reflection period, 2 independent assessors. Track 2 (natural death NOT reasonably foreseeable): 90-day assessment period, one assessor must have expertise in the condition, must be informed of and offered alternative treatments. Sole mental illness: eligibility was extended but implementation has been delayed.\n\nCanada has one of the most permissive MAiD frameworks globally. MAiD accounted for ~4.1% of deaths in Canada in 2022. Physicians have the right to conscientiously object but must provide effective referral. The expansion to sole mental illness remains controversial and has been deferred multiple times. Palliative care access remains uneven across Canadian provinces."
    difficulty: hard
    tags: [palliative care, MAiD, medical assistance in dying, end of life, family medicine]
  - front: "What are the tips to reduce drug-related adverse events in elderly patients (prescribing principles)?"
    back: "1) Review longstanding medications for age/renal/hepatic adjustments. 2) Reassess drugs started in hospital. 3) Deprescribe unnecessary/harmful medications. 4) Verify adherence before dose escalation. 5) Prefer high therapeutic index drugs. 6) Reconcile medications to avoid duplication.\n\nElderly patients are at higher risk for ADRs due to polypharmacy, altered pharmacokinetics (reduced renal/hepatic function, increased fat:muscle ratio), and pharmacodynamic changes. Systematic medication review and deprescribing are key Canadian geriatric care principles."
    difficulty: medium
    tags: [geriatrics, polypharmacy, deprescribing, elderly, adverse drug events, medication review]
  - front: "What age-related skin changes occur and what conditions do they predispose to?"
    back: "With aging: epidermis attenuates (rete ridge effacement), keratinocytes lose proliferative ability, dermis loses volume, hyaluronic acid diminishes. Leads to: senile purpura and androgenic alopecia.\n\nSenile (actinic) purpura presents as non-blanchable red-to-purple patches resolving over 1–3 weeks, leaving brown-yellow haemosiderin discolouration. These changes reflect loss of skin integrity from regenerative decline."
    difficulty: easy
    tags: [dermatology, aging, senile purpura, skin changes]
  - front: "What is asteatotic dermatitis and how is it managed?"
    back: "Diffuse mild pruritic dermatitis secondary to dry skin ('dried river bed' appearance on shins). Very common in the elderly, especially in winter ('winter itch'). Management: skin rehydration with moisturizing routine (products with urea) + topical corticosteroids (TCS).\n\nAsteatotic dermatitis results from loss of skin surface lipids, leading to a cracked, fissured pattern especially on lower legs. Environmental humidity control and emollients are preventive."
    difficulty: easy
    tags: [dermatology, asteatotic dermatitis, elderly, eczema]
  - front: "What PHE screening is recommended for adults over 65 years, specifically regarding cognitive impairment and falls?"
    back: "Adults >65: Follow up on caregiver concern of cognitive impairment (Grade A). Multidisciplinary post-fall assessment (Grade A). Hearing impairment screening (inquiry, whispered voice test, audioscope, Grade C).\n\nGeriatric preventive care focuses on functional outcomes. Cognitive impairment screening is triggered by caregiver concern (not routine MMSE in the absence of concern). Fall prevention is a critical safety issue for older adults, requiring multidisciplinary assessment including medication review, vision, gait assessment, and home safety evaluation."
    difficulty: easy
    tags: [geriatrics, dementia, cognitive impairment, falls, preventive health, periodic health exam]
  - front: "What are the 5 criteria of the Physical Frailty Phenotype (Fried criteria), and how many are needed to diagnose frailty?"
    back: "Criteria: (1) Shrinking – unintentional weight loss ≥10 lbs or ≥5% body weight in prior year; (2) Weakness – grip strength in lowest 20% by gender/BMI; (3) Poor endurance – self-reported exhaustion; (4) Slowness – walking time for 15 feet in slowest 20% by gender/height; (5) Low activity – kcals/week in lowest 20% (males <383, females <270 kcal/wk). Frail = ≥3 criteria; Pre-frail/at-risk = 1–2 criteria.\n\nThe Fried phenotype is widely used in geriatric assessment. Pre-frail patients are targets for preventive intervention. The MCCQE1 may test the number of criteria required for diagnosis or the specific components."
    difficulty: easy
    tags: [frailty, geriatrics, Fried criteria, sarcopenia]
  - front: "What is the Cumulative Deficit Approach (Rockwood frailty index)?"
    back: "The frailty index = number of deficits present / number of deficits possible. It balances assets (health, attitudes, resources, caregiver support) against deficits (illness, disability, dependence, caregiver burden) to determine whether a person can maintain independence in the community.\n\nThe Rockwood Cumulative Deficit model conceptualizes frailty as accumulation of deficits across multiple domains rather than a specific phenotype. It complements the Fried phenotype model."
    difficulty: easy
    tags: [frailty, geriatrics, Rockwood, frailty index]
  - front: "What are the key immune and endocrine mechanisms underlying frailty?"
    back: "Immune: elevated IL-6, CRP, WBCs, monocytes; elevated clotting markers (factor VIII, fibrinogen, D-dimer) → chronic inflammation → skeletal muscle decline. Endocrine: sarcopenia via decreased GH and IGF-1, increased cortisol, decreased DHEA-S, decreased vitamin D; stress dysregulation of autonomic nervous system; age-related changes in renin-angiotensin system and mitochondria.\n\nUnderstanding the pathophysiology of frailty helps identify modifiable targets. These inflammatory and hormonal changes contribute to the sarcopenia central to the frailty syndrome."
    difficulty: medium
    tags: [frailty, sarcopenia, inflammation, endocrine, geriatrics]
  - front: "What does CGA stand for in geriatrics, and what are its components?"
    back: "CGA = Comprehensive Geriatric Assessment. Components include: past medical history, medications, allergies, social history, function, and geriatric review of systems (cognition, mood, sleep, pain, nutrition, falls, continence, vision/hearing, skin, and safety); physical exam; investigations (CBC, electrolytes, TSH, vitamin B12, vitamin D, LFTs, extended electrolytes).\n\nCGA is the cornerstone of geriatric medicine. It informs management of geriatric syndromes and guides interdisciplinary care. Knowing its components is essential for MCCQE1."
    difficulty: easy
    tags: [CGA, geriatrics, frailty, assessment]
  - front: "What are the DIAPERS transient causes of urinary incontinence in older adults?"
    back: "D – Delirium; I – Infection (urinary); A – Atrophic urethritis/vaginitis; P – Pharmaceuticals; E – Excessive urine output; R – Restricted mobility; S – Stool impaction.\n\nDIAPERS is a classic mnemonic for reversible/transient causes of incontinence in older adults. Addressing these causes can often resolve incontinence without further workup."
    difficulty: easy
    tags: [urinary incontinence, geriatrics, mnemonic, DIAPERS]
  - front: "What are the 4 subtypes of urinary incontinence?"
    back: "(1) Stress incontinence – leakage with physical strain (e.g., coughing, sneezing); (2) Urge incontinence – leakage with oversensitive bladder and strong urge to urinate; (3) Overflow incontinence – leakage from poor bladder emptying (e.g., BPH, neurogenic bladder); (4) Functional incontinence – leakage due to illness/disability not related to the urinary tract (e.g., immobility, dementia).\n\nClassifying the subtype guides management. Stress responds to pelvic floor exercises; urge to bladder training and antimuscarinics (used cautiously in elderly); overflow to alpha-blockers or catheterization; functional to environmental modifications."
    difficulty: easy
    tags: [urinary incontinence, geriatrics, stress, urge, overflow, functional]
  - front: "What is the prevalence of urinary incontinence in older adults, and what are its morbidities?"
    back: "Prevalence: 15–30% community-dwelling older adults; ≥50% institutionalized. Morbidities: cellulitis, pressure injuries, UTIs, falls with fractures, sleep deprivation, social withdrawal, depression, sexual dysfunction. Importantly, UI is NOT associated with increased mortality.\n\nUrinary incontinence is under-reported and under-treated. Its downstream complications (particularly falls/fractures) significantly impact older adult morbidity."
    difficulty: easy
    tags: [urinary incontinence, geriatrics, epidemiology, complications]
  - front: "What are the 3 subtypes of fecal incontinence?"
    back: "(1) Passive incontinence – involuntary discharge of stool or gas without awareness; (2) Urge incontinence – discharge of fecal matter despite active attempts to retain bowel contents; (3) Fecal seepage – leakage of stool following otherwise normal evacuation.\n\nDistinguishing subtypes guides management. Passive incontinence suggests internal sphincter dysfunction; urge incontinence suggests external sphincter or rectal hypersensitivity; seepage may relate to incomplete evacuation or rectal pathology."
    difficulty: medium
    tags: [fecal incontinence, geriatrics, subtypes]
  - front: "What is the MEALS ON WHEELS mnemonic for etiology of malnutrition in older adults?"
    back: "M – Medications; E – Emotional problems (depression); A – Anorexia; L – Late-life paranoia; S – Swallowing disorders; O – Oral problems; N – Nosocomial infections; W – Wandering/dementia-related activity; H – Hyperthyroid/hypercalcemia/hypoadrenalism; E – Enteric disorders; E – Eating problems; L – Low salt/low fat diet; S – Social isolation/inability to shop.\n\nMEALS ON WHEELS is a useful mnemonic for the many causes of malnutrition in elderly patients. Many causes are reversible, making a thorough assessment essential."
    difficulty: easy
    tags: [malnutrition, geriatrics, mnemonic, MEALS ON WHEELS]
  - front: "What are the diagnostic criteria for malnutrition per the 2018 Global Leadership Initiative on Malnutrition (GLIM)?"
    back: "Requires combination of ≥1 phenotypic criterion AND ≥1 etiologic criterion. Phenotypic: weight loss (>5% in 6 months or >10% beyond 6 months), low BMI, reduced muscle mass (by DXA, BIA, CT, or MRI). Etiologic: reduced food intake, or inflammation (from acute disease/injury or chronic disease).\n\nThe GLIM 2018 criteria standardize the definition of malnutrition and require both phenotypic and etiologic components. BMI concern thresholds in older adults: <23.5 in males and <22.0 in females."
    difficulty: medium
    tags: [malnutrition, geriatrics, GLIM, diagnosis]
  - front: "What investigations are ordered for malnutrition workup in older adults?"
    back: "CBC, electrolytes, Ca²⁺/albumin, Mg²⁺, PO₄³⁻, creatinine, LFTs (INR, bilirubin), vitamin B12, folate, TSH, lipid profile. If indicated: urinalysis, ESR, CXR.\n\nA broad metabolic panel helps identify reversible or contributing causes (e.g., hypothyroidism, B12 deficiency, liver disease). Hypoalbuminemia (<38 g/L community, <35 g/L hospital) and hypocholesterolemia (<4.1 mmol/L) also support the diagnosis."
    difficulty: easy
    tags: [malnutrition, geriatrics, investigations]
  - front: "What are the NPIAP staging criteria for pressure injuries (Stages 1–4, Unstageable, and Deep Tissue)?"
    back: "Stage 1: Nonblanchable erythema of intact skin. Stage 2: Partial thickness skin loss with exposed dermis; viable pink/red moist wound bed ± serum blister. Stage 3: Full thickness skin loss; adipose visible; slough/eschar may be present. Stage 4: Full thickness skin and tissue loss; exposed fascia/muscle/tendon/ligament/cartilage/bone. Unstageable: Full thickness loss obscured by slough/eschar; depth cannot be determined. Deep Tissue Injury: Intact/non-intact skin with nonblanchable maroon/purple discoloration or blood-filled blister; results from intense/prolonged pressure at bone-muscle interface.\n\nAccurate staging guides treatment decisions. Stage 1–2 can often be managed conservatively; Stages 3–4 may require debridement and surgical consultation. Deep tissue injuries may evolve rapidly."
    difficulty: medium
    tags: [pressure injuries, NPIAP, staging, geriatrics, wound care]
  - front: "What are the risk factors for pressure injuries?"
    back: "Extrinsic: friction, pressure, shear force, moisture. Intrinsic: immobility, malnutrition, comorbidities (DM, PVD, vasculitis, immunodeficiency, CHF), sensory loss. Geriatric-specific: age-related skin changes, being bedbound, cognitive impairment, chronic illness.\n\nIdentifying risk factors enables targeted prevention. Multiple validated tools (e.g., Braden Scale) assess pressure injury risk on admission."
    difficulty: easy
    tags: [pressure injuries, risk factors, geriatrics]
  - front: "What is the recommended repositioning frequency to prevent pressure injuries in bed vs. chair?"
    back: "In bed: reposition every 2 hours (q2h). In chair: reposition every 1 hour (q1h).\n\nFrequent repositioning redistributes pressure and is the cornerstone of pressure injury prevention. Advanced static mattresses or overlays are also recommended by the American College of Physicians for high-risk patients."
    difficulty: easy
    tags: [pressure injuries, prevention, repositioning, geriatrics]
  - front: "When is sharp debridement indicated for pressure injuries, and how does it differ from other debridement methods?"
    back: "Sharp debridement is performed urgently when there is risk of sepsis or cellulitis. Other forms (mechanical, enzymatic, autolytic) are non-urgent. All ulcers with necrosis warrant debridement.\n\nDebridement removes necrotic tissue to allow healing. The urgency depends on the clinical situation: infected wounds with systemic signs require urgent sharp debridement, while stable wounds can use slower methods."
    difficulty: medium
    tags: [pressure injuries, debridement, wound care, geriatrics]
  - front: "What are the infectious complications of pressure injuries?"
    back: "Bacteremia/sepsis, cellulitis, osteomyelitis, septic arthritis, sinus tracts, abscess, endocarditis, meningitis.\n\nPressure injuries can serve as portals of entry for serious infection. Osteomyelitis underlying a pressure injury may be difficult to diagnose and requires bone biopsy for definitive diagnosis."
    difficulty: easy
    tags: [pressure injuries, complications, infection, geriatrics]
  - front: "What are the key recommendations for preventing functional decline during hospitalization in older adults?"
    back: "Early mobilization (for most complications), medication review (for delirium, falls, ADRs, urinary incontinence), orientation/sensory aids/volume repletion/noise reduction for delirium, daily inspection and q2h repositioning for pressure injuries, incentive spirometry/physiotherapy for respiratory function, structured exercise and progressive resistance training for functional decline, and removal of unnecessary IV lines/catheters/NG tubes for infection prevention.\n\nHospitalization itself is a risk factor for geriatric decline (Hospital-Associated Disability). Interdisciplinary strategies targeting these sequelae are standard of care in ACE units."
    difficulty: medium
    tags: [hospitalization, geriatrics, hazards, delirium, falls, functional decline]
  - front: "What are the healthcare institution types for older adults in Canada, from most to least independent?"
    back: "1. Home and Community Support Services – independent living at home with professional/personal/homemaking support. 2. Retirement Home – fairly independent, minimal ADL/IADL support, often privately owned. 3. Supportive Housing – minimal to moderate assistance, independent living in apartment. 4. Long-Term Care / Skilled Nursing Facility – around-the-clock nursing, on-call physician, OT/PT/RT available. 5. Hospice – care for terminally ill with prognosis <3 months, focus on quality of life.\n\nMatching the level of care to patient needs is a core geriatric competency. Choosing appropriate placement requires assessing functional capacity, social supports, and socioeconomic status."
    difficulty: easy
    tags: [healthcare institutions, geriatrics, long-term care, hospice, community services]
  - front: "A 78-year-old woman living alone is found to have unintentional weight loss of 12 lbs over 6 months, grip strength in the lowest quartile for her age and BMI, self-reported exhaustion, and walks slowly. She scores 3/5 on the Fried frailty criteria. What is her frailty status and what management approach is indicated?"
    back: "She meets criteria for FRAILTY (≥3 Fried criteria). Management: Comprehensive Geriatric Assessment (CGA); physical activity programs and nutritional optimization; multicomponent interventions; interdisciplinary primary care; medication optimization; referral to Acute Care for Elders (ACE) unit if hospitalized; caregiver support.\n\nFrail older adults benefit from structured multicomponent interventions addressing physical activity, nutrition, and psychosocial support. Evidence from RCTs shows these reduce incident mobility disability in frail older adults with sarcopenia."
    difficulty: medium
    tags: [frailty, geriatrics, CGA, management, Fried criteria]
  - front: "What complications of immobility in older adults affect the cardiovascular, respiratory, and musculoskeletal systems?"
    back: "Cardiovascular: orthostatic hypotension, venous thrombosis, pulmonary embolism. Respiratory: decreased ventilation, atelectasis, pneumonia. MSK: muscle atrophy, contractures, bone loss (osteoporosis).\n\nImmobility is a major contributor to hospital-associated disability. Early mobilization is the primary preventive strategy for most of these complications."
    difficulty: easy
    tags: [immobility, geriatrics, complications, DVT, pneumonia, atrophy]
  - front: "What are the psychological and genitourinary complications of immobility in older adults?"
    back: "Psychological: sensory deprivation, delirium, depression. Genitourinary: infection (UTI), urinary retention, bladder/renal calculi, incontinence. Also gastrointestinal: anorexia, constipation, incontinence, dehydration, malnutrition. Skin: pressure injuries.\n\nThese complications of immobility are interconnected — delirium worsens immobility, which worsens delirium. A multicomponent, interdisciplinary approach is needed to interrupt these cycles."
    difficulty: easy
    tags: [immobility, geriatrics, complications, delirium, UTI]
