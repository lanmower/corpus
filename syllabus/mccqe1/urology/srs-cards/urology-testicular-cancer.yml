# Urology Testicular Cancer (Urology) - generated from srs-mccqe1
cards:
  - front: "What is the most common solid malignancy in young males aged 15-35 years?"
    back: "Testicular tumours are the most common solid malignancy in young males aged 15-35 years, though overall they are rare.\n\nAny solid testicular mass or acute hydrocele in a young patient must rule out malignancy. Slightly more common in right testis (corresponding to higher right-sided cryptorchidism incidence). Risk factors include cryptorchidism, atrophy, abnormal sex hormone exposure, HIV, infertility, and family/personal history of testicular cancer."
    difficulty: easy
    tags: [urology, testicular cancer, epidemiology]
  - front: "What are the pathological types of testicular tumours and their relative frequencies?"
    back: "95% are germ cell tumours (all malignant): seminoma (50%) — classic, anaplastic, spermatocytic; NSGCT — embryonal cell carcinoma (10%), teratoma (5%), choriocarcinoma (<1%), yolk sac (<1%), mixed cell type (35%). 5% are non-germ cell tumours (usually benign): Leydig cells (produce testosterone, cause precocious puberty), Sertoli cells (cause gynecomastia, decreased libido). Secondary testicular tumours (male >50 years) are usually lymphoma or metastases.\n\nCryptorchidism increases malignancy risk by 10-40 times. The most common bilateral testicular tumour in men >50 years is lymphoma. Secondary tumours from lung, prostate, and GI tract can also occur."
    difficulty: medium
    tags: [urology, testicular cancer, germ cell tumours, seminoma, NSGCT]
  - front: "What are the tumour markers for testicular cancer and which are elevated in seminoma vs. NSGCT?"
    back: "Tumour markers: β-hCG, LDH, AFP. β-hCG and AFP are positive in 85% of non-seminomatous tumours (NSGCT). β-hCG is positive in only 7% of pure seminomas. AFP is NEVER elevated with pure seminoma.\n\nElevated marker levels return to normal postoperatively if no metastasis remains. These markers are used for diagnosis, staging, and monitoring treatment response. LDH is a non-specific marker of tumour burden."
    difficulty: medium
    tags: [urology, testicular cancer, tumour markers, AFP, beta-hCG, seminoma, NSGCT]
  - front: "Why is trans-scrotal biopsy or orchiectomy contraindicated for testicular cancer diagnosis?"
    back: "The scrotum has different lymphatic drainage than the testis. Trans-scrotal approach risks tumour seeding and disrupts the normal lymphatic drainage, potentially altering spread patterns. Radical inguinal orchiectomy with ligation of the spermatic cord inside the inguinal canal is the correct approach.\n\nTesticular lymphatics drain to retroperitoneal (para-aortic) nodes via the spermatic cord, whereas scrotal skin drains to inguinal nodes. Scrotal violation can lead to inguinal or pelvic nodal spread in addition to retroperitoneal spread, complicating staging and treatment."
    difficulty: medium
    tags: [urology, testicular cancer, orchiectomy, inguinal approach, lymphatic drainage]
  - front: "What is the staging of testicular cancer and how does lymphatic spread differ between right and left testis?"
    back: "Stage I: disease limited to testis, epididymis, or spermatic cord. Stage II: disease limited to retroperitoneal nodes. Stage III: metastatic to supradiaphragmatic nodal or visceral sites. Right testis drains to medial, paracaval, anterior, and lateral nodes. Left testis drains to left lateral and anterior para-aortic nodes. Cross-over metastases from right to left are common, but not from left to right.\n\nInvestigations for staging include CT chest (lung metastases), CT abdomen/pelvis (retroperitoneal lymphadenopathy), and tumour markers (β-hCG, AFP, LDH). Hematogenous spread is most commonly to lung, liver, bones, and kidney."
    difficulty: medium
    tags: [urology, testicular cancer, staging, lymphatic drainage, retroperitoneal]
  - front: "What is the prognosis of testicular cancer and what is the standard initial management for all stages?"
    back: "Prognosis: 99% cured with Stage I and II disease; 70-80% complete remission with advanced disease. Standard initial management for all stages: radical orchiectomy through inguinal incision with ligation of the spermatic cord inside the inguinal canal. Also consider sperm banking and testicular prosthesis.\n\nTesticular cancer is one of the most curable solid tumours. Orchiopexy (surgical descent of undescended testis) does not eliminate malignancy risk but allows for self-examination and reduces infertility risk. Needle aspiration is contraindicated due to risk of tumour seeding."
    difficulty: easy
    tags: [urology, testicular cancer, prognosis, radical orchiectomy, treatment]
  - front: "What is the relationship between cryptorchidism and testicular cancer?"
    back: "Cryptorchidism increases the risk of testicular malignancy by 10-40 times. 2-3% of testicular cancers are bilateral. Orchiopexy (surgical descent of the undescended testis) does not eliminate the risk of malignancy but allows for earlier detection by self-examination and reduces infertility risk.\n\nCryptorchidism is the most important risk factor for testicular cancer. Evidence of testicular microlithiasis is NOT a risk factor for testicular cancer. Any solid testicular mass in a young patient must be worked up for malignancy regardless of history."
    difficulty: easy
    tags: [urology, cryptorchidism, testicular cancer, orchiopexy]
  - front: "What are the clinical features of testicular tumours?"
    back: "Painless testicular enlargement (painful if intratesticular hemorrhage or infarction), dull/heavy ache in lower abdomen/anal area/scrotum, associated hydrocele (10%), coincidental trauma (10%), gynecomastia (from secretory tumour effects), supraclavicular and inguinal lymphadenopathy, abdominal mass (retroperitoneal lymph node metastases), infertility (rarely presenting complaint).\n\nThe painless nature is the most clinically important feature — any painless testicular mass should be worked up with U/S. Testicular U/S showing hypoechoic area within tunica albuginea is high suspicion for testicular cancer."
    difficulty: easy
    tags: [urology, testicular cancer, clinical features, painless mass]
