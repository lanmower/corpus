# Psychiatry Schizophrenia (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What are the DSM-5 Criterion A symptoms for schizophrenia, and how many are required?"
    back: "At least 2 of the following must be present for a significant portion of 1 month, and at least one must be (1), (2), or (3): (1) delusions, (2) hallucinations, (3) disorganized speech, (4) grossly disorganized or catatonic behaviour, (5) negative symptoms (diminished emotional expression or avolition).\n\nThe requirement that at least one symptom must be a 'core' symptom (delusions, hallucinations, or disorganized speech) means negative symptoms alone are insufficient for Criterion A. This distinguishes schizophrenia from disorders that may present predominantly with negative features."
    difficulty: easy
    tags: [psychiatry, schizophrenia, DSM-5, diagnosis]
  - front: "What are the epidemiological features of schizophrenia (prevalence, sex ratio, age of onset, suicide risk)?"
    back: "Prevalence: 0.3–0.7%; Sex ratio: M:F = 1:1; Age of onset: females late-20s (with 2nd peak in mid-life), males early- to mid-20s; Suicide risk: 5–6% die by suicide, 20% attempt suicide.\n\nSchizophrenia affects men and women equally but the age of onset differs — men typically develop schizophrenia earlier. The lifetime suicide risk is substantially elevated, making suicide risk assessment a critical ongoing clinical task."
    difficulty: easy
    tags: [psychiatry, schizophrenia, epidemiology, suicide]
  - front: "What is the 'dopamine hypothesis' of schizophrenia?"
    back: "Excess dopamine activity in the mesolimbic pathway mediates positive symptoms of psychosis (delusions, hallucinations), while decreased dopamine in the prefrontal cortex mediates negative and cognitive symptoms. GABA, glutamate, and ACh dysfunction are also implicated.\n\nThe dopamine hypothesis underpins antipsychotic pharmacotherapy — D2 receptor blockade reduces positive symptoms. However, the insufficiency of this model to explain negative symptoms has led to interest in glutamate (NMDA receptor) and other neurotransmitter theories."
    difficulty: medium
    tags: [psychiatry, schizophrenia, pathophysiology, dopamine]
  - front: "What are the genetic risk factors for schizophrenia?"
    back: "Monozygotic twin concordance: 40%; Dizygotic twins/siblings/children of one affected parent: 10%; If both parents have schizophrenia: 46% risk. Vulnerable genes include: DISC1, NRG1, DTNBP1 (dysbindin), COMT, DAOA, GRM3, BDNF.\n\nThe genetics of schizophrenia are complex and polygenic. The MZ concordance rate of only 40% (not 100%) demonstrates that environmental factors also play a significant role in disease expression."
    difficulty: medium
    tags: [psychiatry, schizophrenia, genetics, risk factors]
  - front: "What environmental risk factors are associated with schizophrenia?"
    back: "Cannabis use, geographic variance, winter season of birth, obstetrical complications, prenatal viral exposure.\n\nCannabis use is associated with a 2.7-year earlier onset of psychosis in users versus nonusers (meta-analysis, Arch Gen Psychiatry 2011). These environmental factors interact with genetic vulnerability to precipitate illness."
    difficulty: medium
    tags: [psychiatry, schizophrenia, environmental risk, cannabis]
  - front: "What catatonic behaviours may be seen in schizophrenia?"
    back: "Catatonic stupor (fully conscious but mute and immobile, may hold bizarre positions), catatonic excitement (uncontrolled aimless motor activity, extreme agitation), stereotypy (repeated non-goal-directed movements), mannerisms (odd goal-directed activities, e.g., grimacing), echopraxia (imitates others' movements), automatic obedience (robot-like execution of commands), negativism (refuses simple requests for no apparent reason), inappropriate affect, neglect of self-care.\n\nCatatonia is a specifier applicable to many psychiatric disorders including schizophrenia, mood disorders, and medical conditions. Recognizing catatonic features is important because lorazepam (benzodiazepine) is first-line treatment."
    difficulty: medium
    tags: [psychiatry, schizophrenia, catatonia, psychosis]
  - front: "What is the management of schizophrenia (biological and psychosocial components)?"
    back: "Biological: Antipsychotics (risperidone, aripiprazole, haloperidol, paliperidone; clozapine if treatment-resistant); long-acting injectables (LAI/depot) more effective for reducing relapse. Adjunctive: mood stabilizers (lithium, valproate, carbamazepine), anxiolytics, ECT. Maintenance: ≥2 yr after first episode, ≥5 yr after multiple episodes. Psychosocial: CBT, ACT (Assertive Community Treatment), social skills training, employment programs, housing support.\n\nLong-acting injectable antipsychotics are particularly beneficial for patients with poor medication adherence, which is common in schizophrenia. Clozapine remains the gold standard for treatment-resistant schizophrenia but requires regular CBC monitoring due to risk of agranulocytosis."
    difficulty: medium
    tags: [psychiatry, schizophrenia, treatment, antipsychotics, clozapine]
  - front: "What is the long-term prognosis of schizophrenia (rule of thirds)?"
    back: "Over time: 1/3 improve, 1/3 remain the same, 1/3 worsen. Positive symptoms typically diminish with treatment; negative symptoms are most persistent; cognitive symptoms may not improve.\n\nThe rule of thirds provides a useful framework for counselling patients and families about expected outcomes. The chronicity of negative and cognitive symptoms underscores the importance of psychosocial rehabilitation alongside pharmacotherapy."
    difficulty: easy
    tags: [psychiatry, schizophrenia, prognosis, course]
  - front: "What is the relationship between Duration of Untreated Psychosis (DUP) and outcomes in schizophrenia?"
    back: "Longer DUP is associated with: poorer response to antipsychotic treatment, lower likelihood of remission, poorer social functioning and global outcomes. Shorter DUP is associated with: greater response to antipsychotics, better global and social functioning, improved negative symptoms. Longer DUP was NOT associated with employment, quality of life, or hospital treatment outcomes.\n\nDUP is considered a potentially modifiable prognostic factor, which has driven early psychosis intervention programs in Canada (e.g., PEPP, CAMH early psychosis programs). Early identification and treatment can meaningfully improve long-term outcomes."
    difficulty: medium
    tags: [psychiatry, schizophrenia, DUP, prognosis, early intervention]
  - front: "What is the risk of developing psychosis for first-degree relatives of someone with schizophrenia, and how does parental history change this risk?"
    back: "Children/siblings/DZ twins with ONE parent affected: ~10% risk. Both parents have schizophrenia: ~46% risk. MZ twins: ~40% concordance. This demonstrates both genetic loading and the non-purely-genetic nature of schizophrenia (100% concordance not achieved in MZ twins).\n\nGenetic counselling for relatives of patients with schizophrenia is important. The incomplete MZ concordance strongly implicates gene-environment interactions. This also supports the value of targeted early intervention in high-risk populations."
    difficulty: medium
    tags: [psychiatry, schizophrenia, genetics, family history, risk]
