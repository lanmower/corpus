  - front: "What are the three most common clinical manifestations of Wilson's disease affecting the liver, eyes, and CNS?"
    back: "Liver: chronic active hepatitis/cirrhosis; Eyes: Kayser-Fleischer rings; CNS: basal ganglia degeneration (wing-flapping tremor, Parkinsonism)\n\nKayser-Fleischer rings are copper deposits in Descemet's membrane, visible via slit-lamp exam, and occur in ~50% of liver-only presentations."
    difficulty: medium
    tags: [wilsons disease, clinical features, hepatology, neurology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the three histological features of alcoholic hepatitis on liver biopsy?"
    back: "1) Ballooned (swollen) hepatocytes; 2) Mallory bodies (eosinophilic intracellular aggregates of cytokeratins); 3) Chicken-wire fibrosis (pericellular network)\n\nThese findings distinguish alcoholic hepatitis from other causes of liver injury."
    difficulty: medium
    tags: [alcoholic hepatitis, histology, pathology, liver biopsy, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the approximate percentage of individuals with alcohol use disorder who develop each stage of alcohol-related liver disease?"
    back: "Steatotic liver disease: common (most); Acute alcoholic hepatitis: 35%; Cirrhosis: 10-15%\n\nSteatosis is reversible with alcohol cessation, but cirrhosis represents permanent architectural changes."
    difficulty: easy
    tags: [alcoholic liver disease, epidemiology, progression, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
