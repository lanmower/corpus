# Urology Anatomy (Urology) - generated from srs-mccqe1
cards:
  - front: "What are the anatomy and layers of the scrotum from outside inward?"
    back: "Skin → Dartos fascia → External spermatic fascia → Cremaster muscle → Internal spermatic fascia → Tunica vaginalis → Testis.\n\nThe scrotal layers correspond to the layers of the abdominal wall (external oblique → external spermatic fascia; internal oblique → cremaster; transversalis fascia → internal spermatic fascia). This anatomy is important for understanding scrotal pathology and surgical approaches."
    difficulty: medium
    tags: [scrotum, anatomy, layers, dartos, cremaster, tunica vaginalis]
  - front: "What are the components of the pampiniform plexus and what is its clinical relevance?"
    back: "The pampiniform plexus is a network of veins surrounding the testicular artery in the spermatic cord, which functions as a countercurrent heat exchanger to maintain testicular temperature below core body temperature. Dilation forms a varicocele.\n\nThe pampiniform plexus cools arterial blood before it reaches the testis. Varicocele (dilation of the plexus) impairs this mechanism, raising testicular temperature and potentially causing infertility. The left varicocele is more common due to the left testicular vein draining at a right angle into the left renal vein."
    difficulty: medium
    tags: [pampiniform plexus, varicocele, testis, anatomy, infertility, temperature regulation]
  - front: "What are the segments of the male urethra from proximal to distal?"
    back: "Posterior urethra (prostatic urethra → membranous urethra containing the external sphincter/rhabdosphincter) → Anterior urethra (bulbar urethra → penile/spongy urethra → meatus).\n\nThe bulbar urethra is the most common site of urethral stricture from straddle injuries and instrumentation. The membranous urethra (containing the external sphincter) is most vulnerable to injury in pelvic fractures. The spongy urethra runs through the corpus spongiosum."
    difficulty: easy
    tags: [urethra, anatomy, prostatic urethra, membranous urethra, bulbar urethra, male]
  - front: "What are the layers of the scrotum from external to internal?"
    back: "Skin → Dartos muscle and fascia → Epithelium → Cremasteric fascia → Internal spermatic fascia → Tunica vaginalis.\n\nKnowledge of scrotal layers is essential for understanding spread of infection, hematoma, and surgical anatomy. The tunica vaginalis is the innermost layer, derived from peritoneum."
    difficulty: medium
    tags: [urology, scrotal anatomy, layers]
