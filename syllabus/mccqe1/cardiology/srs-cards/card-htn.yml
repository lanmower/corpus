  - front: "What are the diagnostic criteria for hypertension in diabetic vs. non-diabetic patients?"
    back: "Diabetic: office BP >130/80 mmHg for ≥3 measurements on different days. Non-diabetic: automated office BP >135/85 mmHg or office BP ≥140/90 mmHg. Confirm with ABPM: daytime mean >135/85 mmHg or 24-hour mean >130/80 mmHg\n\nLower thresholds apply to diabetic patients due to increased cardiovascular risk. Home BP monitoring and ABPM help rule out white coat hypertension."
    difficulty: medium
    tags: [hypertension, diagnosis, cardiology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What was the DASH trial and what diet showed the best blood pressure reduction?"
    back: "DASH trial (NEJM 1997): A diet rich in fruits, vegetables, and low-fat dairy products (combination diet) reduced BP more than control or fruits/vegetables alone - 5.5/3.0 mmHg in normotensive and 11.4/5.5 mmHg in hypertensive patients\n\nThe DASH diet is now recommended as first-line lifestyle intervention for hypertension and prehypertension."
    difficulty: medium
    tags: [hypertension, nutrition, landmark trial, prevention, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What did the SPRINT trial demonstrate about intensive blood pressure control?"
    back: "Intensive treatment (target SBP <120 mmHg) vs. standard (<140 mmHg) significantly reduced cardiovascular events (1.65%/year vs 2.19%/year) in high-risk patients over 3 years\n\nSPRINT showed that more intensive BP control in high-risk patients reduces major cardiovascular complications and mortality."
    difficulty: hard
    tags: [hypertension, clinical trial, cardiovascular, SPRINT, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What antibiotics cover ascending cholangitis?"
    back: "Broad spectrum covering Gram-negatives, Enterococcus, and anaerobes: ampicillin+sulbactam, piperacillin/tazobactam, metronidazole+3rd gen cephalosporin or fluoroquinolone, or carbapenem monotherapy\n\nAntibiotic choice should cover the typical organisms (E. coli, Klebsiella, Enterobacter, Enterococcus) and anaerobes, especially during CBD manipulation."
    difficulty: medium
    tags: [cholangitis, antibiotics, treatment, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What are the late-stage signs of Primary Biliary Cholangitis?"
    back: "Jaundice, melanosis (darkening skin), xanthelasma, hepatocellular failure, portal hypertension, ascites\n\nChronic cholestasis leads to skin changes, xanthelasma (yellow bumps around eyes), and eventually end-stage liver disease with failure and portal hypertension."
    difficulty: medium
    tags: [PBC, cholestasis, portal hypertension, liver failure, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What antibiotics should be considered for Ascending Cholangitis?"
    back: "Broad spectrum covering Gram-negatives, Enterococcus, and anaerobes: ampicillin+sulbactam, piperacillin/tazobactam, metronidazole+3rd gen cephalosporin/fluoroquinolone, or carbapenem monotherapy\n\nCoverage must include E. coli, Klebsiella, Enterobacter, Enterococcus, and anaerobes (especially after CBD manipulation)."
    difficulty: medium
    tags: [cholangitis, antibiotics, treatment, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What complications are associated with PBC?"
    back: "High incidence of osteoporosis, hepatocellular failure, portal hypertension, ascites\n\nChronic cholestasis leads to malabsorption of fat-soluble vitamins and bone loss. End-stage disease results in liver failure and portal hypertension."
    difficulty: medium
    tags: [PBC, complications, osteoporosis, portal hypertension, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What antibiotics are used for ascending cholangitis?"
    back: "Ampicillin + sulbactam OR piperacillin/tazobactam; OR metronidazole + 3rd generation cephalosporin or fluoroquinolone; OR carbapenem monotherapy\n\nCoverage must include Gram-negatives, Enterococcus, and anaerobes, especially during CBD manipulation"
    difficulty: medium
    tags: [Gastroenterology, Cholangitis, Treatment, Antibiotics, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is clinically significant portal hypertension (CSPH) in cirrhosis?"
    back: "Portal hypertension sufficient to increase risk of decompensation, typically defined by hepatic venous pressure gradient ≥10 mmHg\n\nCSPH represents the threshold at which patients with compensated cirrhosis become at risk for decompensation events like ascites, varices, or hepatic encephalopathy."
    difficulty: medium
    tags: [portal hypertension, cirrhosis, HVPG, decompensation, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is the definition of clinically significant portal hypertension (CSPH)?"
    back: "Hepatic venous pressure gradient (HVPG) ≥10 mmHg, associated with increased risk of decompensation.\n\nCSPH (HVPG ≥10 mmHg) marks the threshold at which patients with cirrhosis develop varices and are at risk for decompensation events like ascites and variceal bleeding."
    difficulty: medium
    tags: [portal-hypertension, hvpg, cirrhosis, diagnosis, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What are the late-stage complications of Primary Biliary Cholangitis?"
    back: "Hepatocellular failure, portal hypertension, and ascites\n\nEnd-stage PBC leads to liver failure and complications of portal hypertension due to chronic cholestasis and fibrosis."
    difficulty: medium
    tags: [PBC, complications, cirrhosis, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is clinically significant portal hypertension (CSPH) defined as in the PREDESCI trial?"
    back: "Hepatic venous pressure gradient (HVPG) ≥10 mmHg\n\nCSPH is a key predictor of cirrhosis decompensation and is defined hemodynamically by an HVPG of 10 mmHg or greater."
    difficulty: medium
    tags: [portal-hypertension, HVPG, cirrhosis, diagnostic-criteria, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is clinically significant portal hypertension (CSPH) in the context of cirrhosis?"
    back: "Portal hypertension with hepatic venous pressure gradient ≥10 mmHg, associated with increased risk of cirrhosis decompensation\n\nCSPH is defined by a hepatic venous pressure gradient of 10 mmHg or higher and marks the transition from compensated to decompensated cirrhosis risk."
    difficulty: medium
    tags: [portal hypertension, cirrhosis, HVPG, hepatology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What are the risk factors for wound hemorrhage and hematoma?"
    back: "Anticoagulant therapy, coagulopathies, thrombocytopenia, DIC, severe liver disease, myeloproliferative disorders, severe arterial hypertension, and severe cough; more common with transverse muscle incisions.\n\nThese conditions impair hemostasis or increase pressure on the wound, leading to bleeding into the surgical site."
    difficulty: easy
    tags: [surgery, hemorrhage, hematoma, risk factors, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What foods should be avoided in gout (mnemonic)?"
    back: "FACT - Feverfew, Alcohol, Cyclosporine, Thiazide diuretics; and SALT - Seafood, Alcohol, Liver, Turkey\n\nThese foods and drugs can precipitate gout attacks by increasing uric acid levels or reducing excretion."
    difficulty: hard
    tags: [gout, diet, precipitants, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What is the mnemonic for gout precipitants?"
    back: "FACT (Feverfew, Alcohol, Cyclosporine, Thiazide) and SALT (Seafood, Alcohol, Liver, Turkey)\n\nThese help remember common triggers that can precipitate acute gout attacks."
    difficulty: medium
    tags: [gout, precipitants, mnemonic, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What are the indications for surgical treatment of vesicoureteral reflux?"
    back: "Failure of medical management, renal scarring (renal insufficiency, hypertension), breakthrough UTIs, or persistent high-grade (IV or V) reflux\n\nSurgical options include ureteral reimplantation or subureteric injection with bulking agents (Deflux or Macroplastique)."
    difficulty: medium
    tags: [VUR, surgical treatment, indications, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What receptor does clonidine act on, and what is its primary clinical use?"
    back: "Alpha-2 (a2) agonist; primary use is hypertension (also used for opioid/alcohol withdrawal and ADHD)\n\nClonidine stimulates central a2 receptors, reducing sympathetic outflow and lowering blood pressure. It can cause rebound hypertension upon abrupt discontinuation. Methyldopa, another a2 agonist, is safe in pregnancy for hypertension management."
    difficulty: medium
    tags: [clonidine, alpha-2 agonist, hypertension, adrenergic]
  - front: "Beta-1 selective adrenergic blockers (e.g., metoprolol, atenolol) are preferred over non-selective beta-blockers in patients with which comorbidity?"
    back: "Reactive airway disease (asthma/COPD) — beta-1 selective agents have less bronchospasm risk than non-selective agents like propranolol\n\nNon-selective beta-blockers (propranolol, timolol) block both B1 and B2 receptors; B2 blockade causes bronchoconstriction. Cardioselective (B1-selective) agents like metoprolol and atenolol are relatively safer in obstructive airway disease but should still be used cautiously."
    difficulty: easy
    tags: [beta-blockers, metoprolol, atenolol, asthma, selectivity, adrenergic]
  - front: "SPRINT trial compared intensive SBP control (<120 mmHg) to standard control (<140 mmHg) in high-CV-risk patients without diabetes. What was found?"
    back: "Intensive BP control (<120 mmHg) significantly reduced major CV events and all-cause mortality compared to standard control (<140 mmHg)\n\nSPRINT (NEJM 2015) showed intensive SBP control reduced the primary composite by 25% (HR 0.75) and all-cause mortality by 27% (HR 0.73) in non-diabetic high-CV-risk patients. This influenced Canadian Hypertension guidelines toward lower BP targets."
    difficulty: medium
    tags: [SPRINT, hypertension, blood pressure target, intensive control, cardiovascular risk]
  - front: "HYVET trial studied antihypertensive treatment in patients aged >80 with SBP >160. What was the key finding?"
    back: "Indapamide (with or without perindopril) reduced stroke risk, stroke death, and all-cause mortality in patients over 80 with hypertension\n\nHYVET (NEJM 2008) demonstrated that treating hypertension in octogenarians with indapamide SR 2.5 mg (±perindopril) resulted in a 30% reduction in stroke and 21% reduction in all-cause mortality. This challenged the previous concern that aggressive BP treatment in the elderly was harmful."
    difficulty: medium
    tags: [HYVET, hypertension, elderly, indapamide, perindopril, octogenarian]
  - front: "What is the key difference between alpha-1 (a1) and alpha-2 (a2) receptor effects on cardiovascular physiology?"
    back: "a1 receptors cause vasoconstriction of skin, skeletal muscle, and splanchnic vessels with increased myocardial contractility; a2 receptors peripherally modulate vessel tone (both vasoconstrict and dilate) and decrease HR\n\na1 blockade (e.g., prazosin) reduces peripheral vascular resistance and is used in hypertension. a2 agonism (e.g., clonidine) reduces central sympathetic outflow. Understanding receptor subtypes guides selection of adrenergic drugs in clinical practice."
    difficulty: medium
    tags: [alpha receptors, adrenergic, vasoconstriction, pharmacology]
  - front: "Define hypertensive emergency and name the end organs that can be damaged."
    back: "Severe BP elevation with evidence of end-organ damage. Affected organs: CNS (stroke, encephalopathy, seizures), retinal (hemorrhage, papilledema), cardiovascular (dissection, ACS, CHF), renal (elevated creatinine, proteinuria, hematuria), GI (N/V, elevated liver enzymes). In pregnancy: HELLP syndrome.\n\nThe key distinction from hypertensive urgency (asymptomatic severe HTN) is end-organ damage. The degree of BP elevation alone does not define an emergency—it is the presence of target organ injury that mandates urgent treatment."
    difficulty: easy
    tags: [hypertensive emergency, end-organ damage, emergency, hypertension]
  - front: "What is the BP reduction strategy for hypertensive emergency?"
    back: "Lower BP by 25% over the initial 60 minutes, then gradually over 24-48 hours. Do NOT rapidly normalize BP (risk of ischemia to adapted organs).\n\nChronically hypertensive patients have autoregulatory curves shifted to tolerate higher BP. Rapid normalization removes perfusion pressure from vital organs, causing ischemic stroke, AKI, or coronary ischemia. Exception: aortic dissection requires rapid reduction of sBP to 110-120 mmHg STAT."
    difficulty: medium
    tags: [hypertensive emergency, BP reduction, labetalol, treatment]
  - front: "Why are non-selective beta-blockers avoided in hypertensive emergencies caused by cocaine/pheochromocytoma?"
    back: "They block β-mediated vasodilation while leaving α-adrenergic vasoconstriction unopposed, worsening hypertension. Use phentolamine (α-blocker) instead.\n\nIn states of catecholamine excess (cocaine, pheochromocytoma), both α- and β-receptors are stimulated. β-blockers only block vasodilation (β2), allowing the pressor α1 effect to dominate, causing a paradoxical BP rise. Labetalol (combined α+β blocker) is acceptable, or use phentolamine for pure α-blockade."
    difficulty: hard
    tags: [hypertensive emergency, cocaine, pheochromocytoma, beta-blockers, phentolamine]
  - front: "What is the management of hypertensive emergency in aortic dissection?"
    back: "Rapid reduction of sBP to 110-120 mmHg STAT. Use esmolol + sodium nitroprusside. Do NOT resuscitate with IV fluids.\n\nAortic dissection is propagated by high BP and aortic wall shear stress (dP/dt). Unlike other hypertensive emergencies, the goal is rapid—not gradual—BP reduction. Esmolol controls heart rate and reduces dP/dt; nitroprusside (or nicardipine) reduces afterload. IV fluids increase cardiac output and worsen dissection."
    difficulty: hard
    tags: [aortic dissection, hypertensive emergency, esmolol, treatment]
  - front: "What is the initial drug of choice for most hypertensive emergencies and what are its contraindications?"
    back: "Labetalol (IV). Contraindications: acute CHF, heart block >1st degree, severe asthma (relative).\n\nLabetalol is a combined α1 + β (nonselective) blocker that reduces BP without causing reflex tachycardia. It is preferred in most hypertensive emergencies including eclampsia. Its onset is 5-10 minutes and duration is 3-6 hours. It should be avoided in acute decompensated CHF (β-blockade worsens cardiac output)."
    difficulty: easy
    tags: [labetalol, hypertensive emergency, treatment, pharmacology]
  - front: "According to CTFPHC guidelines, what is the recommended blood pressure measurement standard for the periodic health examination?"
    back: "BP measurement should be performed using techniques described in CHEP (Canadian Hypertension Education Program) guidelines (Grade A recommendation in PHE table).\n\nThe CHEP guidelines specify proper BP measurement technique: patient seated quietly for 5 minutes, two measurements taken at least 1 minute apart, automated oscillometric devices preferred for office measurement, and out-of-office (home or ambulatory) BP measurement to confirm hypertension diagnosis. This is a Grade A recommendation in the Canadian PHE."
    difficulty: easy
    tags: [blood pressure, hypertension, CHEP, periodic health exam, screening, CTFPHC]
  - front: "What are the key results and conclusion of the DASH trial?"
    back: "The DASH diet (combination diet rich in fruits, vegetables, and low-fat dairy) reduced systolic/diastolic BP by 5.5/3.0 mmHg in normotensive patients and by 11.4/5.5 mmHg in hypertensive patients compared to a control diet. Conclusion: Dietary modification can significantly reduce blood pressure.\n\nThe DASH trial demonstrated that dietary patterns have a clinically meaningful effect on blood pressure. This supports lifestyle modification as first-line management for hypertension, consistent with Canadian Hypertension guidelines (Hypertension Canada)."
    difficulty: medium
    tags: [DASH diet, hypertension, blood pressure, lifestyle modification, landmark trial]
  - front: "What was the SPRINT trial and what were its key findings?"
    back: "SPRINT (2015) compared intensive BP target (systolic <120 mmHg) vs. standard target (<140 mmHg) in 9,361 high-CV-risk patients. Results: intensive treatment reduced CV complications (1.65%/yr vs. 2.19%/yr). Conclusion: Intensive BP control in high-risk patients reduces major CV events.\n\nSPRINT influenced guidelines supporting lower BP targets (systolic <120 mmHg) in high-CV-risk patients. However, the method of BP measurement (unattended automated) differs from typical office measurement, a key contextual point for the MCCQE1."
    difficulty: medium
    tags: [SPRINT trial, hypertension, intensive BP control, cardiovascular risk, landmark trial]
