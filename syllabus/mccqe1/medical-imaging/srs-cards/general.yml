# General (Medical Imaging) - generated from srs-mccqe1
cards:
  - front: "What are the Ottawa Knee Rules for obtaining knee X-rays?"
    back: "Age ≥55 OR Tenderness at head of fibula OR Isolated tenderness of patella OR Inability to flex to 90° OR Inability to bear weight both immediately and in ED\n\nThese rules reduce unnecessary radiography in knee trauma."
    difficulty: hard
    tags: [Ottawa Knee Rules, knee, radiology, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the Ottawa Ankle Rules for obtaining ankle X-rays?"
    back: "Pain in malleolar zone with: Bony tenderness at posterior edge or tip of medial OR lateral malleolus, OR inability to bear weight both immediately and in ED\n\nThese rules help determine when ankle radiography is needed."
    difficulty: hard
    tags: [Ottawa Ankle Rules, ankle, radiology, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the radiographic features of gout?"
    back: "Soft tissue swelling from tophi, punched-out lesions, erosions with 'overhanging edge' sign\n\nX-rays may show characteristic erosions with overhanging edges, which helps differentiate from other arthropathies."
    difficulty: medium
    tags: [gout, radiology, investigations, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What radiographic finding is characteristic of pseudogout?"
    back: "Chondrocalcinosis (calcification of cartilage)\n\nCalcium pyrophosphate deposition disease shows characteristic chondrocalcinosis on X-ray, often in the knee or wrist."
    difficulty: medium
    tags: [pseudogout, CPPD, radiology, investigations, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
