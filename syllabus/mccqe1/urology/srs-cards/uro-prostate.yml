# Prostate Disease & Urologic Cancer (Urology) - generated from srs-mccqe1
cards:
  - front: "What is benign prostatic hyperplasia (BPH) and what are the typical lower urinary tract symptoms (LUTS)?"
    back: "Non-malignant enlargement of the prostate causing bladder outlet obstruction; LUTS: urinary frequency, urgency, nocturia (storage symptoms), weak stream, hesitancy, straining, incomplete emptying (voiding symptoms)\n\nBPH affects >50% of men >60 years. IPSS (International Prostate Symptom Score) quantifies severity. DRE: smooth, rubbery enlargement. First-line treatment: lifestyle modifications, then alpha-blockers (tamsulosin) or 5-alpha-reductase inhibitors (finasteride)."
    difficulty: easy
    tags: [BPH, LUTS, tamsulosin, finasteride, IPSS]
  - front: "What is the mechanism of action of alpha-1 blockers (tamsulosin, alfuzosin) in treating BPH?"
    back: "Relax smooth muscle in prostate and bladder neck by blocking alpha-1 adrenergic receptors, reducing outlet resistance\n\nAlpha-1 blockers provide faster symptom relief (1–2 weeks) than 5-ARIs. Side effects: orthostatic hypotension, retrograde ejaculation, rhinitis. Tamsulosin is more uroselective with fewer systemic effects than terazosin/doxazosin."
    difficulty: easy
    tags: [alpha-blocker, tamsulosin, BPH, mechanism, alpha-1-adrenergic]
  - front: "A 70-year-old man with BPH cannot void and has a palpable bladder. What is the acute management?"
    back: "Urinary catheterization (Foley catheter) to relieve acute urinary retention\n\nAcute urinary retention is a urological emergency. Post-void residual on ultrasound or catheterization >300 mL confirms significant retention. Start alpha-blocker before catheter removal (trial without catheter in 24–72 h). Urology referral for TURP if recurrent or fails trial."
    difficulty: medium
    tags: [acute-urinary-retention, catheterization, BPH, alpha-blocker, TURP]
  - front: "What PSA level and DRE finding warrant urology referral for possible prostate cancer in a 55-year-old man?"
    back: "PSA >3–4 ng/mL or abnormal DRE (firm, irregular, asymmetric nodule or induration) regardless of PSA\n\nCanadian Cancer Society: offer PSA screening discussion to men 50–74 (or 40+ with risk factors: African ancestry, family history). Abnormal DRE + any PSA, or PSA >3–4 → transrectal ultrasound-guided biopsy or MRI-targeted biopsy."
    difficulty: medium
    tags: [PSA, prostate-cancer, DRE, urology-referral, screening]
  - front: "What is the gleason grading system for prostate cancer?"
    back: "Histological grading based on differentiation; Gleason grade 1–5 (most to least differentiated); combined Gleason score (primary + secondary pattern) 6–10; Grade group 1–5 maps to Gleason scores 6, 3+4=7, 4+3=7, 8, 9–10\n\nGleason ≤6 (Grade group 1) = low-risk, favorable prognosis. Gleason ≥8 (Grade group 4–5) = high-risk, aggressive. The Grade Group system (1–5) is now preferred for clarity. Used in risk stratification and treatment decisions."
    difficulty: easy
    tags: [Gleason-score, prostate-cancer, grade-group, risk-stratification, histology]
  - front: "What is active surveillance in prostate cancer and when is it appropriate?"
    back: "Regular monitoring (PSA every 3–6 months, DRE, repeat biopsy ±MRI) without immediate treatment; appropriate for low-risk, localized prostate cancer (Gleason 6, PSA <10, T1c-T2a, <3 cores positive)\n\nActive surveillance avoids overtreatment of indolent cancers. Approximately 30% of patients on AS will eventually require treatment (progression). It is endorsed by the Canadian Urological Association (CUA) for Grade Group 1 disease."
    difficulty: medium
    tags: [active-surveillance, prostate-cancer, low-risk, CUA, Gleason-6]
  - front: "What are the most common side effects of radical prostatectomy vs. external beam radiotherapy for prostate cancer?"
    back: "Prostatectomy: erectile dysfunction (~60–80%) and urinary incontinence (5–15%); radiotherapy: rectal toxicity (bleeding, urgency), cystitis, and later development of ED\n\nBoth are equivalent in cancer control for localized disease. Choice depends on patient preference, anatomy, comorbidities, and urinary/sexual function baseline. Brachytherapy and HIFU are alternatives for appropriate candidates."
    difficulty: medium
    tags: [prostate-cancer, prostatectomy, radiotherapy, erectile-dysfunction, side-effects]
  - front: "What is the first-line treatment for metastatic castration-sensitive prostate cancer (mCSPC)?"
    back: "Androgen deprivation therapy (ADT) + docetaxel or abiraterone acetate (intensification therapy)\n\nADT alone (surgical or medical castration with LHRH agonist/antagonist) is no longer standard for mCSPC. Intensification with docetaxel (CHAARTED trial) or abiraterone (LATITUDE trial) significantly improves overall survival."
    difficulty: medium
    tags: [prostate-cancer, ADT, metastatic, abiraterone, docetaxel]
  - front: "A 65-year-old man on long-term ADT for prostate cancer develops osteoporosis. What should be prescribed?"
    back: "Calcium + vitamin D + bisphosphonate (zoledronic acid annually) or denosumab\n\nADT causes castrate testosterone levels → bone loss and increased fracture risk. DEXA scan should be performed at baseline and every 1–2 years. Zoledronic acid or denosumab reduce fracture risk. Prevent falls (exercise, medication review)."
    difficulty: medium
    tags: [ADT, osteoporosis, prostate-cancer, zoledronic-acid, denosumab]
  - front: "What is the purpose of the IPSS (International Prostate Symptom Score) in BPH management?"
    back: "Quantifies symptom severity: 0–7 mild, 8–19 moderate, 20–35 severe; guides treatment decisions\n\nIPSS includes 7 voiding/storage symptom questions plus quality-of-life item. Mild symptoms (≤7): watchful waiting. Moderate (8–19): medical therapy. Severe (≥20) or failed medical therapy: surgical intervention (TURP, laser prostatectomy)."
    difficulty: easy
    tags: [IPSS, BPH, symptom-score, TURP, treatment-decision]
  - front: "What is PSA screening approach in Canada?"
    back: "CTFPHC recommends AGAINST routine PSA screening. If requested: shared decision-making discussing benefits (small mortality reduction) vs harms (overdiagnosis, overtreatment, biopsy complications)\n\nCUA more supportive of informed discussion in men 55-69. PSA >4: repeat, free/total ratio, consider MRI before biopsy. High-grade PCa management: radical prostatectomy or radiation +/- ADT."
    difficulty: medium
    tags: [PSA, screening]
  - front: "What is the IPSS score and how does it guide BPH management?"
    back: "International Prostate Symptom Score: 7 questions on urinary symptoms + 1 QoL. Mild 0-7: watchful waiting. Moderate 8-19: medical therapy. Severe 20-35: consider surgery\n\nBPH evaluation: DRE, PSA (baseline), urinalysis, creatinine, IPSS. Uroflowmetry and PVR for moderate-severe. BPH does NOT increase prostate cancer risk. Prostate size does not correlate well with symptom severity."
    difficulty: medium
    tags: [BPH, IPSS, prostate]
  - front: "What are the medical treatments for BPH?"
    back: "Alpha-blockers (tamsulosin, alfuzosin): rapid symptom relief. 5-alpha reductase inhibitors (finasteride, dutasteride): reduce prostate size over 6mo, for large prostates. Combination if large prostate. Tadalafil 5mg daily also effective\n\nAlpha-blockers SE: orthostatic hypotension, dizziness, retrograde ejaculation, intraoperative floppy iris syndrome. 5-ARI SE: decreased libido, ED, gynecomastia, reduces PSA by ~50% (double PSA value for cancer screening). 5-ARI reduces risk of acute retention and surgery."
    difficulty: medium
    tags: [BPH, alpha-blocker, tamsulosin, finasteride]
  - front: "When is surgical intervention indicated for BPH?"
    back: "Indications: refractory urinary retention, recurrent UTIs, bladder stones, renal insufficiency from obstruction, failed medical therapy, recurrent gross hematuria. TURP is gold standard. Alternatives: HoLEP, UroLift, Rezum\n\nTURP complications: retrograde ejaculation (75%), TUR syndrome (hyponatremia from irrigation), bleeding, urethral stricture. HoLEP: size-independent, less bleeding. Minimally invasive (UroLift, Rezum): preserve ejaculation, for moderate symptoms."
    difficulty: hard
    tags: [BPH, TURP, surgery]
  - front: "What is the approach to PSA screening and an elevated PSA?"
    back: "CTFPHC: against routine screening. CUA: shared decision-making 50-70 (45 if high-risk). Elevated PSA: repeat in 4-6wk. If persistently elevated: consider MRI then targeted biopsy. PSA >100 suggests metastatic disease\n\nPSA elevations: BPH, prostatitis, recent ejaculation, cycling, UTI, cancer. PSA velocity >0.75ng/mL/yr concerning. Free PSA%: <10% more likely cancer, >25% more likely benign. mpMRI with PI-RADS scoring reduces unnecessary biopsies."
    difficulty: hard
    tags: [PSA, prostate cancer, screening]
  - front: "How is localized prostate cancer managed?"
    back: "Low-risk (Gleason 6, PSA<10, T1-T2a): active surveillance preferred (PSA q3-6mo, DRE q12mo, repeat biopsy). Intermediate/high-risk: radical prostatectomy or radiation + ADT. Metastatic: ADT + docetaxel or novel hormonal agents\n\nActive surveillance avoids overtreatment. Gleason score: 6=low, 7=intermediate (3+4 better than 4+3), 8-10=high. Side effects of treatment: erectile dysfunction, incontinence (surgery), bowel/bladder toxicity (radiation). 10-year cancer-specific survival >95% for localized."
    difficulty: hard
    tags: [prostate cancer, active surveillance, Gleason]
  - front: "What is the presentation and management of acute urinary retention in BPH?"
    back: "Presentation: inability to void, suprapubic pain, distended bladder. Management: Foley catheter, start tamsulosin, trial of void in 3-5 days. If fails: long-term catheter or surgery referral\n\nPrecipitants: medications (anticholinergics, sympathomimetics, opioids), alcohol, cold, constipation. Measure residual volume. If >1L: slow decompression (controversial) and monitor for post-obstructive diuresis (replace fluids if significant). TWOC success ~60% with alpha-blocker."
    difficulty: medium
    tags: [urinary retention, BPH, catheter]
  - front: "What is the approach to an incidental prostate nodule on DRE?"
    back: "Firm, irregular, asymmetric nodule on DRE requires investigation regardless of PSA. Order PSA. Refer urology for biopsy (TRUS-guided or MRI-targeted). 50% of palpable nodules are cancer\n\nDRE detects primarily peripheral zone tumors (70% of cancers arise here). Normal DRE does not exclude cancer. DRE + PSA together are more informative than either alone. BPH causes smooth symmetric enlargement."
    difficulty: medium
    tags: [prostate nodule, DRE, biopsy]
  - front: "What is androgen deprivation therapy and its side effects?"
    back: "ADT: GnRH agonists (leuprolide) or antagonists (degarelix), or surgical orchidectomy. For metastatic or locally advanced prostate cancer. Side effects: hot flashes, osteoporosis, metabolic syndrome, CV risk, sarcopenia, cognitive decline\n\nInitial GnRH agonist causes testosterone flare (can worsen bone pain/cord compression) - give with antiandrogen flare protection x2wk. GnRH antagonists avoid flare. Monitor: DXA, metabolic panel, CV risk. Exercise program essential. Intermittent ADT may reduce side effects."
    difficulty: hard
    tags: [ADT, prostate cancer, side effects]
  - front: "How is erectile dysfunction evaluated and managed?"
    back: "Evaluation: history (psychogenic vs organic), medications review, CV risk assessment, testosterone level, glucose/lipids. Management: lifestyle (exercise, weight loss, smoking cessation), PDE5 inhibitor first-line (sildenafil, tadalafil). Second: vacuum device, ICI, penile prosthesis\n\nED is a marker of CV disease (shares risk factors and endothelial dysfunction). Assess CV fitness for sexual activity. PDE5i contraindicated with nitrates (severe hypotension). Testosterone replacement if confirmed hypogonadism. Psychogenic: CBT + PDE5i."
    difficulty: medium
    tags: [erectile dysfunction, PDE5 inhibitor, management]
  - front: "What is the approach to a scrotal mass?"
    back: "Painless: testicular cancer until proven otherwise (US + tumor markers AFP/bHCG/LDH). Transilluminates: hydrocele. Does not: solid mass (cancer concern). Painful: torsion (emergency, <6h), epididymitis. Testicular cancer: radical inguinal orchiectomy (never transscrotal)\n\nTesticular torsion: no cremasteric reflex, high-riding testis, <6h for salvage. US if diagnosis unclear but do not delay surgery. Testicular cancer: peak 15-35yr. Seminoma (radiosensitive) vs non-seminoma (chemo). Staging CT + markers guide treatment. 95% cure rate overall."
    difficulty: hard
    tags: [scrotal mass, testicular cancer, torsion]
  - front: "How is BPH (benign prostatic hyperplasia) evaluated and managed?"
    back: "Evaluation: IPSS (International Prostate Symptom Score): mild 0-7, moderate 8-19, severe 20-35; DRE (smooth, firm, symmetrically enlarged prostate); PSA (to rule out cancer — discuss with patient); urinalysis, creatinine, post-void residual (PVR). Management by severity: Mild (IPSS <8): watchful waiting, lifestyle (limit fluids before bed, avoid caffeine/alcohol, timed voiding). Moderate-severe: Alpha-blockers (tamsulosin, alfuzosin — rapid symptom relief in days-weeks; SE: orthostatic hypotension, retrograde ejaculation). 5-alpha reductase inhibitors (finasteride, dutasteride — reduce prostate size over 6-12 months; for large prostates >30-40g; SE: decreased libido, ED, gynecomastia; reduce PSA by ~50%). Combination: alpha-blocker + 5ARI for large prostates. Surgery: TURP (gold standard) for refractory symptoms, urinary retention, recurrent UTI, bladder stones, renal insufficiency.\n\nCUA (Canadian Urological Association) guidelines recommend alpha-blockers as first-line pharmacotherapy. 5ARIs take 6-12 months to show effect but reduce progression to urinary retention and need for surgery. Tamsulosin is more uroselective than older alpha-blockers (less orthostatic hypotension). TURP carries risks of retrograde ejaculation (~75%), TUR syndrome (hyponatremia from irrigation fluid absorption), and bleeding."
    difficulty: medium
    tags: [BPH, IPSS, alpha-blockers, finasteride, TURP, urology]
  - front: "How is erectile dysfunction evaluated and managed, including cardiovascular risk assessment?"
    back: "Evaluation: history (onset, duration, situational vs global, libido, relationship, medications, psychosocial); risk factors (diabetes, hypertension, dyslipidemia, smoking, obesity); medication review (beta-blockers, SSRIs, spironolactone, 5ARIs); labs: fasting glucose/A1C, lipid panel, testosterone (morning), TSH, prolactin if low T. Cardiovascular risk: ED is an independent predictor of CVD events — ED often precedes MI by 3-5 years (shared endothelial dysfunction). Stratify cardiac risk before prescribing PDE5 inhibitors. Treatment: 1st line: PDE5 inhibitors (sildenafil, tadalafil, vardenafil); CI: nitrates (absolute — fatal hypotension), alpha-blockers (relative — use with caution). 2nd line: intracavernosal injections (alprostadil), vacuum erection devices. 3rd line: penile prosthesis. Address modifiable risk factors (exercise, weight loss, smoking cessation, optimize diabetes/HTN).\n\nCUA guidelines recommend treating ED as a cardiovascular risk marker — all men with new ED should have CV risk assessment. PDE5 inhibitors require sexual stimulation to work and should be tried on 6-8 occasions before deeming them ineffective. Tadalafil has the longest duration (36h) and is available as daily dosing (5 mg). Low testosterone should be confirmed with two morning levels before initiating testosterone replacement."
    difficulty: medium
    tags: [erectile dysfunction, PDE5 inhibitors, cardiovascular risk, testosterone, urology]
  - front: "What is the epidemiology of erectile dysfunction (ED)?"
    back: "Approximately 20% of men aged 40 and 50% of men aged 70 are affected. F:M ratio not applicable — affects males.\n\nED prevalence increases dramatically with age, largely due to increasing vascular disease, comorbidities, and medication use. It is an important marker of cardiovascular disease, as endothelial dysfunction is a shared mechanism."
    difficulty: easy
    tags: [erectile dysfunction, epidemiology, prevalence, aging]
  - front: "How do you differentiate organic vs. psychogenic erectile dysfunction?"
    back: "Organic: gradual onset, global (all circumstances), constant course, poor non-coital erections, absent morning erections, secondary psychosexual problems. Psychogenic: acute onset, situational, variable course, rigid non-coital erections, present morning erections, primary anxiety.\n\nThe presence or absence of nocturnal/morning erections is the most useful clinical differentiator. Preserved nocturnal erections suggest intact neurovascular function and a psychogenic etiology."
    difficulty: medium
    tags: [erectile dysfunction, organic, psychogenic, morning erections, differential]
  - front: "What is the most common cause of organic erectile dysfunction and what are the pharmacologic contraindications?"
    back: "Most common cause: vascular (90%) — arterial insufficiency, atherosclerosis. First-line pharmacologic treatment: PDE5 inhibitors (sildenafil, tadalafil, vardenafil). Absolute contraindication: concurrent use of nitrates (risk of fatal hypotension).\n\nPDE5 inhibitors cause smooth muscle relaxation in penile vasculature via cGMP accumulation. Nitrates also act through cGMP pathways — combined use causes profound, potentially fatal hypotension."
    difficulty: medium
    tags: [erectile dysfunction, PDE5 inhibitors, sildenafil, nitrates, contraindication, vascular]
  - front: "What are the three PDE5 inhibitors used for erectile dysfunction, and how do they differ?"
    back: "Sildenafil (Viagra): 25-100 mg, take 0.5-4h before, lasts ~24h. Tadalafil (Cialis): 5-20 mg, effects last 36h. Vardenafil (Levitra): 2.5-20 mg, take 1h before. All share side effects: flushing, headache, indigestion. All contraindicated with nitrates.\n\nTadalafil's longer duration of action (36h) allows for more spontaneous sexual activity ('weekend pill'). All three are equally effective. Choice depends on patient preference, frequency of sexual activity, and cost."
    difficulty: easy
    tags: [PDE5 inhibitors, sildenafil, tadalafil, vardenafil, erectile dysfunction]
  - front: "What testosterone-related investigations are indicated in erectile dysfunction workup?"
    back: "Hypothalamic-pituitary-gonadal axis: free and total testosterone, prolactin, LH. Risk factor evaluation: fasting glucose, HbA1C, lipid profile. Others: TSH, CBC, urinalysis. Specialized: nocturnal penile tumescence and rigidity (NPTR) assessment, vascular diagnostics (Doppler, angiography), psychological/psychiatric consultation.\n\nTestosterone deficiency with hypogonadism is an indication for testosterone replacement in ED. Note: breast and prostate cancer are absolute contraindications to testosterone therapy."
    difficulty: medium
    tags: [erectile dysfunction, testosterone, prolactin, LH, investigations, hypogonadism]
  - front: "What are the non-pharmacologic management options for erectile dysfunction?"
    back: "Lifestyle changes (reduce alcohol, smoking cessation, exercise); relationship/sexual counselling; vacuum erection devices; referral to urology for: significant penile anatomic disease, young patient with pelvic/perineal trauma history, need for vascular/neurosurgical intervention, complicated endocrinopathies, complicated psychiatric/psychosocial problems.\n\nLifestyle modification and CV risk factor reduction are both associated with significant improvements in IIEF-5 (erectile function) scores. Treating underlying vascular risk factors can improve ED without pharmacotherapy."
    difficulty: easy
    tags: [erectile dysfunction, lifestyle, vacuum device, referral, non-pharmacologic]
