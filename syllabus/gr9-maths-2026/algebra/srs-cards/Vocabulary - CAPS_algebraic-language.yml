# Gr 9 Maths CAPS — algebra / Vocabulary
deck: "Corpus::Gr9 Maths::Vocabulary"
notes:
  - guid: a1b2c3d4e5f60718
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Vocabulary"
    fields:
      Front: "What is a 'term' in an algebraic expression?"
      Back: "A term is a single number, variable, or product/quotient of numbers and variables, separated from other terms by + or − signs.\nIn 3x² − 5x + 7 there are THREE terms: 3x², −5x and 7.\nKey: the + and − signs are what split an expression into terms (each sign belongs to the term that follows it)."
    tags: ["term", "subject:algebra"]
  - guid: b2c3d4e5f6071829
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Vocabulary"
    fields:
      Front: "Define: variable, constant and coefficient. Identify each in 7x − 4."
      Back: "Variable: a letter standing for an unknown value (x).\nConstant: a term that is just a number, with no variable (−4).\nCoefficient: the number multiplying a variable (the 7 in 7x).\nIn 7x − 4: variable = x, coefficient = 7, constant = −4.\nNote: x alone has a coefficient of 1; −x has coefficient −1."
    tags: ["variable", "coefficient", "constant", "subject:algebra"]
  - guid: c3d4e5f607182930
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Vocabulary"
    fields:
      Front: "What are 'like terms' and why do they matter?"
      Back: "Like terms have EXACTLY the same variable(s) raised to EXACTLY the same power(s). Only the coefficient may differ.\nLike: 3x and −5x; 2xy and 7xy; 4x² and x².\nUnlike: 3x and 3x² (different powers); 2x and 2y (different variables).\nThey matter because ONLY like terms can be added or subtracted (combined) when simplifying."
    tags: ["like-terms", "subject:algebra"]
  - guid: d4e5f60718293041
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Vocabulary"
    fields:
      Front: "Classify by number of terms: monomial, binomial, trinomial. Give an example of each."
      Back: "Monomial = 1 term, e.g. 5x²y.\nBinomial = 2 terms, e.g. 3x − 2.\nTrinomial = 3 terms, e.g. x² + 5x + 6.\nA general expression with many terms is a 'polynomial'. Count the terms (the chunks split by + and −) to classify."
    tags: ["monomial-binomial-trinomial", "subject:algebra"]
  - guid: e5f6071829304152
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Vocabulary"
    fields:
      Front: "What is the 'degree' of an expression? Find the degree of 4x³ − 2x²y² + x."
      Back: "The degree is the HIGHEST total exponent found in any single term.\nFor a single variable, it's the largest power.\nFor a term with several variables, ADD their exponents.\n4x³ → degree 3; −2x²y² → 2+2 = 4; x → 1.\nHighest is 4, so the expression has degree 4."
    tags: ["degree", "subject:algebra"]
  - guid: f607182930415263
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Vocabulary"
    fields:
      Front: "How many terms, and what is the coefficient of x, in 9 − x + 2x²?"
      Back: "Three terms: 9, −x and 2x².\nThe coefficient of x is −1 (because −x means −1×x). The sign always travels WITH the coefficient.\nThe constant term is 9 and the coefficient of x² is 2."
    tags: ["term", "coefficient", "subject:algebra"]
