# Ob Analgesia (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What non-pharmacologic pain relief techniques are available in labour?"
    back: "- Reduction of painful stimuli: movement, position change, counter-pressure, abdominal compression\n- Peripheral sensory activation: heat/cold, water immersion, touch/massage, acupuncture, TENS, intradermal sterile water over sacrum, aromatherapy\n- Enhancement of descending inhibitory pathways: attention focusing, distraction, hypnosis, music, biofeedback\n\nNon-pharmacologic techniques work through various mechanisms including gate control theory (TENS, massage), endorphin release (immersion, exercise), and cognitive/psychological modulation (hypnosis, distraction). These are important first-line options and are often used in combination with pharmacologic methods."
    difficulty: easy
    tags: [obstetrics, labour analgesia, non-pharmacologic, pain management]
  - front: "What pharmacologic methods are available for pain relief in labour?"
    back: "- Nitrous oxide (e.g., Entonox® — self-administered)\n- Narcotics (usually combined with anti-emetic)\n- Pudendal nerve block\n- Perineal infiltration with local anesthetic\n- Regional anesthesia: epidural block, combined spinal-epidural, spinal\n\nRegional anesthesia (epidural) is the most effective form of labour analgesia in Canada. Nitrous oxide provides moderate analgesia with rapid onset and offset. Narcotics cross the placenta and can cause neonatal respiratory depression if given close to delivery. Pudendal nerve block is useful for perineal repair and outlet forceps."
    difficulty: easy
    tags: [obstetrics, labour analgesia, pharmacologic, epidural, regional anesthesia]
