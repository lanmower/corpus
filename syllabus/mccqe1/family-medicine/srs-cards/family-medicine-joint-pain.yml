# Family Medicine Joint Pain (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What features in the history help distinguish inflammatory from non-inflammatory joint pain?"
    back: "Inflammatory (WARM joints): Worse with rest, better with activity; swelling in the latter half of the night; Morning stiffness ≥30 min; Soft tissue swelling and erythema.\nNon-inflammatory: Worse with activity, better with rest; morning stiffness <30 min ('gelling').\n\nThis distinction guides the diagnostic workup and treatment approach. Inflammatory arthritis warrants serology and DMARDs; non-inflammatory (e.g., OA) is managed with analgesia and mechanical interventions. Morning stiffness duration is a key differentiator."
    difficulty: medium
    tags: [joint-pain, inflammatory, non-inflammatory, rheumatology, family-medicine]
  - front: "Which autoantibodies are associated with each of the following conditions: RA, SLE, Sjogren's, dermatomyositis/polymyositis, reactive arthritis?"
    back: "RA: rheumatoid factor (RhF), anti-CCP (anti-cyclic citrullinated peptide)\nSLE: ANA (positive), anti-dsDNA, anti-Sm\nSjogren's: anti-SSA/Ro, anti-La, RhF\nDermatomyositis/Polymyositis: anti-Jo1 (anti-histidyl tRNA synthetase)\nReactive arthritis/Ankylosing spondylitis: HLA-B27\nNote: negative ANA helps exclude SLE\n\nAnti-CCP is more specific than RhF for RA. Anti-dsDNA and anti-Sm are highly specific for SLE. HLA-B27 is more consistent with reactive arthritis and ankylosing spondylitis than RA. Anti-Jo1 suggests inflammatory myopathy with interstitial lung disease."
    difficulty: hard
    tags: [autoantibodies, rheumatology, RA, SLE, Sjogren, family-medicine]
  - front: "What are the systemic features in joint pain history that suggest an extra-articular connective tissue disorder?"
    back: "Fever (SLE, infection), rash (SLE, psoriatic arthritis), uveitis (psoriatic, reactive arthritis, ankylosing spondylitis), myalgias (fibromyalgia, myopathy), muscle weakness (polymyositis, neuropathy), GU symptoms (reactive arthritis, IBD).\n\nA thorough ROS is essential in joint pain evaluation. Psoriatic skin and nail changes, eye inflammation, and bowel symptoms point to seronegative spondyloarthropathies. Constitutional symptoms (weight loss, fever) may indicate septic arthropathy or malignancy."
    difficulty: medium
    tags: [joint-pain, systemic-features, SLE, psoriatic-arthritis, rheumatology, family-medicine]
