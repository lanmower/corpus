# Ob Operative Delivery (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What are the prerequisites (ABCDEFGHIJK) for operative vaginal delivery?"
    back: "- **A:** Anesthesia (adequate)\n- **B:** Bladder empty\n- **C:** Cervix fully dilated and effaced with ROM\n- **D:** Determine position of fetal head\n- **E:** Equipment ready (including facilities for emergent CD)\n- **F:** Fontanelle (posterior fontanelle midway between thighs)\n- **G:** Gentle traction\n- **H:** Handle elevated\n- **I:** Incision (episiotomy)\n- **J:** Jaw visible, remove forceps\n- **K:** Knowledgeable operator\n\nOperative vaginal delivery (forceps or vacuum) requires strict adherence to prerequisites to minimize maternal and fetal complications. An empty bladder prevents bladder injury. Knowing the exact fetal head position is mandatory before applying forceps. The requirement for CD capability is absolute — if operative delivery fails, emergency CD must be immediately available."
    difficulty: medium
    tags: [obstetrics, operative vaginal delivery, forceps, vacuum, prerequisites]
  - front: "What are the indications and contraindications for operative vaginal delivery?"
    back: "**Indications:**\n- Fetal: atypical/abnormal FHR tracing, evidence of fetal compromise, prolonged second stage\n- Maternal: need to avoid voluntary expulsive effort (cardiac/cerebrovascular disease), exhaustion, lack of cooperation, excessive analgesia\n\n**Contraindications:**\n- Cervix not fully dilated\n- Membranes intact\n- Unknown fetal head position\n- Unengaged head\n- Fetal bone demineralization disorder (osteogenesis imperfecta)\n- Fetal bleeding disorder (hemophilia, VWD)\n- Brow or face presentation\n\nOperative vaginal delivery is indicated when benefits outweigh risks and prerequisites are met. Fetal bleeding disorders are contraindications because the compression forces from forceps or vacuum can cause intracranial hemorrhage. Face presentation can be delivered with forceps in mento-anterior position but brow presentation cannot. An unengaged head with an operative attempt risks severe trauma and is absolutely contraindicated."
    difficulty: medium
    tags: [obstetrics, operative vaginal delivery, indications, contraindications, forceps, vacuum]
  - front: "Classify forceps deliveries by station and describe the types of forceps."
    back: "**Classification by station:**\n- **Outlet forceps:** Head visible between labia between contractions; sagittal suture in/close to AP diameter; rotation ≤45°\n- **Low forceps:** Presenting part at station ≥+2 cm; subdivided by rotation (<45° or >45°)\n- **Mid forceps:** Presenting part below spines but above +2 cm\n\n**Types of forceps:**\n- **Simpson or Tucker-McLane:** OA presentations\n- **Kielland (rotational) forceps:** Rotation of head or correction of asynclitism\n- **Piper forceps:** After-coming head in breech delivery\n- **Wrigley's:** Preterm babies\n\nForceps classification by station has important medicolegal implications — mid-cavity forceps carry higher maternal and fetal complication rates. The choice of forceps depends on indication: Simpson forceps are most commonly used, Kielland forceps for rotational delivery, Piper forceps for the head in breech delivery (rotated to bring the posterior fossa into view)."
    difficulty: medium
    tags: [obstetrics, forceps delivery, types of forceps, operative delivery]
  - front: "Compare forceps vs. vacuum extraction: advantages, disadvantages, and complications."
    back: "**Forceps:**\n- Advantages: Higher overall success rate for vaginal delivery\n- Disadvantages: Greater incidence of maternal injury; requires more anesthesia\n- Complications: Maternal — cervical/vaginal/perineal lacerations (including OASIS), bladder/uterus/bone injury, pelvic nerve damage, PPH, infections; Fetal — fractures, facial nerve palsy, face/scalp trauma, intracranial hemorrhage, cephalohematoma, cord compression\n\n**Vacuum extraction:**\n- Advantages: Easier to apply; less anesthesia required; less maternal soft tissue injury than forceps\n- Disadvantages: Suitable only for vertex presentations; contraindicated <34 weeks GA\n- Complications: Maternal — perineal lacerations/OASIS, PPH, infection; Fetal — cephalohematoma, retinal hemorrhages, jaundice (increased vs. forceps), subgaleal hemorrhage, spine injuries, soft tissue trauma\n- Limits: Stop after 3 pulls over 3 contractions with no progress; 3 pop-offs; or 20 min if delivery not imminent\n\nThe choice between forceps and vacuum depends on clinical situation, GA, and operator expertise. Vacuum is contraindicated <34 weeks due to higher risk of subgaleal (subaponeurotic) hemorrhage in preterm neonates. Subgaleal hemorrhage is a serious complication as the potential space can accommodate significant blood volume. Vacuum has higher neonatal jaundice rates due to increased red blood cell breakdown from cephalohematoma."
    difficulty: medium
    tags: [obstetrics, forceps, vacuum extraction, operative delivery, comparison, complications]
  - front: "Classify perineal lacerations and describe their management."
    back: "**Classification:**\n- **1st degree:** Involves skin and vaginal mucosa only (not underlying fascia/muscle)\n- **2nd degree:** Involves fascia and muscles of perineal body but not anal sphincter\n- **3rd degree:** Involves the anal sphincter:\n  - 3A: <50% of external anal sphincter\n  - 3B: >50% of external anal sphincter\n  - 3C: External AND internal anal sphincters\n- **4th degree:** Extends through entire anal sphincter complex into rectal mucosa\n\n**3rd and 4th degree (OASIS) management:**\n- Single prophylactic dose of IV antibiotics (2nd-generation cephalosporin, e.g., cefoxitin or cefotetan) OR cefazolin + metronidazole\n- Laxatives; avoid constipation\n- Postpartum pelvic physiotherapy\n- Endoanal U/S at 3-4 months post-repair to assess anal sphincter integrity\n\nOASIS (Obstetric Anal Sphincter Injuries) include 3rd and 4th degree tears. Risk factors include vacuum delivery (highest odds, OR 4.23), prolonged second stage, forceps, VBAC, and episiotomy. Failure to identify and properly repair OASIS leads to fecal incontinence. Prophylactic antibiotics reduce post-repair wound complications and infection."
    difficulty: medium
    tags: [obstetrics, perineal lacerations, OASIS, anal sphincter, operative delivery]
