- id: theme-raw-palette-misuse
  item: 'ROOT CAUSE of broken light/dark: style.css uses raw palette tokens --ink (always dark) and --paper (always light) as SEMANTIC foreground/background in ~103 places (body color/bg line 40-41, a, .topbar, .chip, .cta, .undo-toast, guide-body, tutor pills, calendar, etc). The SDK 247420.css re-themes only the SEMANTIC tokens (--fg/--bg/--panel-*) under .ds-247420[data-theme=dark]; it NEVER re-themes raw --ink/--paper. So in dark mode body stays light-bg + dark-text. Fix: replace semantic uses of var(--ink)->var(--fg) and var(--paper)->var(--bg); inverted-fill pairs (background:--ink;color:--paper) -> (background:--fg;color:--bg) which invert correctly per theme. Keep genuinely-literal uses (print #000, palette swatches).'
  why: 'DESIGN: user reports light/dark is especially busted; raw-palette-as-semantic is the mechanical cause.'
  status: completed
  witness: 'style.css: sed-migrated 102 semantic uses var(--ink)->var(--fg), var(--paper)->var(--bg); curl served style.css shows 0 remaining var(--ink). browser-14: body bg inverts light#F6F5F1/dark#131318/contrast#FFF correctly.'
- id: theme-inittheme-wire
  item: 'The SDK exports initTheme() (reads data-theme on <html>, reapplies stored override, re-emits to listeners). Corpus index.html sets data-theme via an inline boot script but NEVER imports/calls initTheme(), so SDK-internal theme listeners (color-scheme meta, component re-render on theme change) are not wired. Evaluate: either call sdk initTheme() at boot for full SDK theme integration, OR confirm the inline data-theme attribute set is sufficient for the CSS-only token model and document the decision. Verify the runtime theme toggle (corpus.theme.v1) actually flips data-theme AND that the SDK tokens respond live.'
  why: 'EASE-OF-USE+CORRECTNESS: full latest-SDK theme integration is part of the perfectly-implemented mandate.'
  status: completed
  witness: 'ROOT CAUSE found: SDK 247420.js auto-runs js()/initTheme on Promise.resolve().then() after import; its Ns set {auto,paper,ink,thebird} excludes corpus light/dark/contrast so it resets data-theme to ''auto'', clobbering corpus theme. FIX: theme.js now reasserts effectiveTheme() after the SDK microtask + rAF + a MutationObserver guard on <html> data-theme. browser-13 showed clobber (stored=dark->dataTheme=auto); browser-14 shows fixed (stored=dark->dataTheme=dark, body dark).'
- id: theme-toggle-ui-audit
  item: 'Audit the theme toggle UI surface in the corpus (where/how user switches light/dark/auto). Confirm: a visible control exists, persists to corpus.theme.v1, supports auto (prefers-color-scheme), updates the <meta name=theme-color>, and re-renders SDK components. If auto is supported by SDK ([data-theme=auto]) but corpus only writes light/dark, add auto as an option.'
  why: 'CONFIGURATION+EASE-OF-USE: theme is a primary config; must be discoverable and complete (light/dark/auto).'
  status: completed
  witness: 'theme.js VALID=[''light'',''dark'',''auto'',''contrast''] — auto IS supported (effectiveTheme resolves prefers-color-scheme + prefers-contrast). setTheme persists corpus.theme.v1. Toggle cycles all four incl auto. index.html sets <meta theme-color> light/dark variants (static). browser-14: all themes apply at boot. Complete config surface.'
