# Ent Rhinitis (ENT) - generated from srs-mccqe1
cards:
  - front: "What is rhinitis medicamentosa and how is it treated?"
    back: "Rebound nasal congestion caused by overuse of intranasal vasoconstrictors (topical decongestants). Treatment: limit topical decongestant use to no more than 3-5 days; treat with saline irrigations and intranasal corticosteroid.\n\nRhinitis medicamentosa occurs when prolonged use of vasoconstrictors (e.g., oxymetazoline) causes tachyphylaxis and rebound vasodilation upon discontinuation. Patients become dependent on the decongestant to breathe. The mainstay of treatment is intranasal corticosteroids which reduce mucosal inflammation and allow gradual withdrawal of the decongestant."
    difficulty: easy
    tags: [otolaryngology, rhinitis medicamentosa, rebound congestion, decongestant, treatment]
  - front: "What nasal discharge character suggests neoplasia vs. allergic/viral rhinitis?"
    back: "Serosanguinous discharge suggests neoplasia. Bloody discharge suggests trauma, neoplasia, bleeding disorder, or HTN/vascular disease. Watery/mucoid suggests allergic, viral, vasomotor rhinitis, or CSF leak. Mucopurulent suggests bacterial infection or foreign body.\n\nThe character of nasal discharge guides the differential diagnosis. Unilateral serosanguinous or bloody discharge in an adult should raise concern for sinonasal malignancy until proven otherwise. CSF leak (e.g., from skull base fracture) can mimic watery rhinorrhea — the halo sign and beta-2 transferrin testing help confirm CSF. Mucopurulent discharge from one side in a child suggests foreign body."
    difficulty: medium
    tags: [otolaryngology, nasal discharge, rhinitis, differential diagnosis, neoplasia]
  - front: "What is allergic rhinitis, and what is the first-line treatment?"
    back: "IgE-mediated hypersensitivity rhinitis to foreign allergens (seasonal or perennial). First-line treatment: intranasal corticosteroid (INCS) — mainstay of treatment, combined with allergen identification and avoidance, nasal saline irrigation, and oral antihistamines.\n\nAllergic rhinitis affects people usually under 20 years with personal/family history of atopy. Seasonal triggers include pollen (trees, grass, ragweed); perennial triggers include dust mites, cockroach residue, animal dander, moulds, tobacco. Physical exam shows gray/blue congested turbinates and nasal tip transverse crease ('allergic salute'). Allergen immunotherapy is used for patients not adequately controlled with pharmacotherapy. Decongestants carry rhinitis medicamentosa risk. Complications include chronic sinusitis/polyps and serous otitis media."
    difficulty: easy
    tags: [otolaryngology, allergic rhinitis, IgE, intranasal corticosteroid, treatment]
  - front: "What is vasomotor rhinitis and how does its treatment differ from allergic rhinitis?"
    back: "Rhinitis from dysregulation of nociceptors and autonomic nerves causing increased vascular permeability, triggered by temperature changes, alcohol, dust, smoke, or stress. Treatment: eliminate irritants; congestion-predominant — intranasal antihistamine/INCS; rhinorrhea-predominant — intranasal anticholinergic (ipratropium) ± INCS/antihistamine.\n\nVasomotor rhinitis is non-allergic and non-infectious; allergy must be ruled out. It causes chronic intermittent nasal obstruction that varies from side to side. Unlike allergic rhinitis, IgE testing is negative. The key distinction in treatment is the use of ipratropium (anticholinergic) for rhinorrhea-predominant symptoms, which reduces parasympathetic-driven glandular secretion. Exercise provides symptomatic relief via increased sympathetic tone."
    difficulty: medium
    tags: [otolaryngology, vasomotor rhinitis, non-allergic rhinitis, ipratropium, treatment]
