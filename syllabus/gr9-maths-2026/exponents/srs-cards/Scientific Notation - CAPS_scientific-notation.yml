# Gr 9 Maths CAPS — exponents / Scientific Notation
deck: "Corpus::Gr9 Maths::Scientific Notation"
notes:
  - guid: 1a2f9c4e7b0d6351
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Scientific Notation"
    fields:
      Front: "What is scientific notation (standard form) and what are the rules for the number a?"
      Back: "Scientific notation writes a number as a × 10ⁿ, where:\n• 1 ≤ a < 10 (a has exactly ONE non-zero digit before the decimal point), and\n• n is an integer (positive, negative or zero).\nExamples: 4 500 = 4,5 × 10³ and 0,0072 = 7,2 × 10⁻³.\nIt is used to write very large or very small numbers compactly. The value of a must be at least 1 but less than 10 — so 45 × 10² is NOT correct standard form; rewrite as 4,5 × 10³."
    tags: ["scientific-notation", "subject:exponents"]
  - guid: 2b3e0d5f8c1a7462
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Scientific Notation"
    fields:
      Front: "Write the large number 384 000 000 in scientific notation. (Method)"
      Back: "Step 1: Place the decimal point after the first non-zero digit: 3,84000000\nStep 2: Count how many places the point moved from its original (end) position: it moved 8 places LEFT.\nStep 3: For a LARGE number the exponent is POSITIVE and equals that count: n = 8.\nAnswer: 384 000 000 = 3,84 × 10⁸.\nCheck: moving the point 8 places right in 3,84 restores the original number."
    tags: ["scientific-notation", "large-numbers", "subject:exponents"]
  - guid: 3c4f1e608d2b8573
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Scientific Notation"
    fields:
      Front: "Write the small number 0,000 062 in scientific notation. (Method)"
      Back: "Step 1: Place the decimal after the first non-zero digit: 6,2\nStep 2: Count how many places the point moved from its original position: 5 places RIGHT.\nStep 3: For a SMALL number (less than 1) the exponent is NEGATIVE and equals that count: n = −5.\nAnswer: 0,000 062 = 6,2 × 10⁻⁵.\nCheck: 10⁻⁵ = 1/100 000, and 6,2 ÷ 100 000 = 0,000 062. ✓"
    tags: ["scientific-notation", "small-numbers", "subject:exponents"]
  - guid: 4d5a2f719e3c9684
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Scientific Notation"
    fields:
      Front: "Convert 2,05 × 10⁴ and 9,1 × 10⁻³ back to ordinary (decimal) notation."
      Back: "Rule: a POSITIVE exponent moves the decimal point RIGHT; a NEGATIVE exponent moves it LEFT. The exponent = number of places.\n2,05 × 10⁴: move point 4 places right → 20 500.\n9,1 × 10⁻³: move point 3 places left → 0,0091.\nFill in zeros as needed while shifting. A positive power gives a big number; a negative power gives a small (less than 1) number."
    tags: ["scientific-notation", "converting", "subject:exponents"]
  - guid: 5e6b3a820f4d0795
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Scientific Notation"
    fields:
      Front: "Multiply in scientific notation: (3 × 10⁵) × (2 × 10⁴)."
      Back: "Method: multiply the a-values together, and use Law 1 (ADD exponents) on the powers of 10.\n(3 × 10⁵) × (2 × 10⁴)\n= (3 × 2) × (10⁵ × 10⁴)\n= 6 × 10⁵⁺⁴\n= 6 × 10⁹.\nSince 1 ≤ 6 < 10, this is already correct standard form."
    tags: ["scientific-notation", "multiplying", "subject:exponents"]
  - guid: 6f7c4b931a5e1806
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Scientific Notation"
    fields:
      Front: "Multiply (5 × 10⁶) × (4 × 10³) and fix the answer into correct standard form."
      Back: "(5 × 10⁶) × (4 × 10³) = (5 × 4) × 10⁶⁺³ = 20 × 10⁹.\nPitfall: 20 is NOT between 1 and 10, so this is not yet standard form.\nRewrite 20 = 2 × 10¹, so 20 × 10⁹ = 2 × 10¹ × 10⁹ = 2 × 10¹⁰.\nFinal answer: 2 × 10¹⁰. Always check that 1 ≤ a < 10 at the end."
    tags: ["scientific-notation", "multiplying", "subject:exponents"]
  - guid: 7a8d5c042b6f2917
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Scientific Notation"
    fields:
      Front: "Divide in scientific notation: (8 × 10⁷) ÷ (2 × 10³)."
      Back: "Method: divide the a-values, and use Law 2 (SUBTRACT exponents) on the powers of 10.\n(8 × 10⁷) ÷ (2 × 10³)\n= (8 ÷ 2) × 10⁷⁻³\n= 4 × 10⁴.\nIf the a-division had given a value below 1 (e.g. 2 ÷ 8 = 0,25), rewrite it: 0,25 × 10ⁿ = 2,5 × 10ⁿ⁻¹ to restore 1 ≤ a < 10."
    tags: ["scientific-notation", "dividing", "subject:exponents"]
  - guid: 8b9e6d153c7a3a28
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Scientific Notation"
    fields:
      Front: "Real-world: A red blood cell is about 0,000 008 m wide; the distance to the Sun is about 150 000 000 km. Write both in scientific notation."
      Back: "Cell: 0,000 008 = 8 × 10⁻⁶ m (small number → negative exponent; point moves 6 right).\nSun distance: 150 000 000 = 1,5 × 10⁸ km (large number → positive exponent; point moves 8 left).\nScientific notation is ideal for sizes of atoms/cells (tiny, negative powers) and astronomical distances (huge, positive powers)."
    tags: ["scientific-notation", "real-world", "subject:exponents"]
