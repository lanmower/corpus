# Obstetrics Antepartum (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What is the GTPAL format used in obstetric history?"
    back: "G = Gravidity (total pregnancies including current); T = Term deliveries (>37 weeks); P = Preterm deliveries (20+0 to 36+6 weeks); A = Abortions and ectopic pregnancies (<20 weeks, both induced and spontaneous); L = Living children.\n\nGTPAL provides a structured, standardized format for documenting obstetric history. Gravidity counts each pregnancy once (even multiple gestations). This format is used across Canadian obstetric practice (SOGC guidelines) for clear communication of pregnancy history."
    difficulty: easy
    tags: [obstetrics, obstetric history, GTPAL, gravidity, parity, prenatal care]
  - front: "What are the physical signs of early pregnancy and at what gestational ages do they appear?"
    back: "Goodell's sign (cervical softening): 4–6 weeks; Chadwick's sign (bluish cervix/vagina from venous engorgement): 6 weeks; Hegar's sign (cervical isthmus softening): 6–8 weeks. Also: uterine enlargement, breast engorgement, areola darkening.\n\nThese classical signs reflect the increased pelvic vascularity (Chadwick's) and progesterone-mediated cervical and uterine softening (Goodell's, Hegar's) of early pregnancy. Recognition on physical exam can confirm pregnancy before investigations."
    difficulty: easy
    tags: [obstetrics, pregnancy diagnosis, physical signs, Chadwick, Goodell, Hegar, prenatal care]
  - front: "What are the β-hCG 'Rule of 10s' levels during normal pregnancy?"
    back: "10 IU at the time of missed menses; 100,000 IU peak at approximately 10 weeks GA; then levels decline but remain measurable throughout pregnancy.\n\nβ-hCG doubles every 48h in normal early pregnancy and peaks at 8–10 weeks (up to ~100,000 IU/L). Suboptimal doubling suggests ectopic pregnancy or miscarriage; elevated levels suggest molar pregnancy, multiple gestation, or trisomy 21. Important for interpreting prenatal screening."
    difficulty: easy
    tags: [obstetrics, β-hCG, pregnancy diagnosis, prenatal screening, ectopic pregnancy]
  - front: "What does transvaginal ultrasound show at 5 weeks, 6 weeks, and 6–8 weeks gestational age?"
    back: "5 weeks: gestational sac visible; 6 weeks: fetal pole visible; 6–8 weeks: fetal heart activity visible (FHR visible after 6 weeks on TVUS). Transabdominal USS: intrauterine pregnancy visible at 6–8 weeks.\n\nTVUS is the modality of choice for early pregnancy evaluation due to superior resolution. Failure to see expected structures at these timeframes raises concern for ectopic pregnancy, missed abortion, or inaccurate dating—all requiring further investigation."
    difficulty: easy
    tags: [obstetrics, ultrasound, TVUS, early pregnancy, gestational age, fetal heart rate]
  - front: "How is the estimated date of delivery (EDD) calculated using Naegele's rule?"
    back: "Naegele's rule: Add 1 year + 7 days, then subtract 3 months from the first day of the LMP. Example: LMP = April 1, 2021 → EDD = January 8, 2022. Adjust for cycle length variations (add days if >28d cycle, subtract if <28d).\n\nNaegele's rule assumes a regular 28-day cycle and ovulation on day 14. If LMP is uncertain or cycle is irregular, early ultrasound (ideally <12 weeks) provides more reliable dating and is used to confirm or revise the EDD in Canadian practice (SOGC guidelines)."
    difficulty: easy
    tags: [obstetrics, EDD, Naegeles rule, gestational age, LMP, prenatal care]
  - front: "What are the cardiovascular changes of normal pregnancy?"
    back: "Increased: cardiac output (CO), heart rate, blood volume. Decreased: blood pressure (from decreased PVR due to progesterone's vasodilation) and venous return (uterine compression of IVC). Risk of varicose veins, hemorrhoids, and leg edema from increased venous pressure.\n\nPregnancy creates a hyperdynamic circulation. BP typically falls in the 1st and 2nd trimesters and returns to normal in the 3rd. Understanding these changes prevents misdiagnosis of physiologic changes (e.g., systolic murmurs, supine hypotension) as pathology."
    difficulty: easy
    tags: [obstetrics, physiologic changes pregnancy, cardiovascular, cardiac output, blood pressure]
  - front: "What hematologic changes occur in normal pregnancy and what is gestational thrombocytopenia?"
    back: "Hemodilution causes physiologic anemia (decreased Hgb/Hct). Leukocyte count increases but function is impaired. Hypercoagulable state (increased DVT/PE risk but decreased bleeding at delivery). Gestational thrombocytopenia: mild (platelets >70,000/μL), asymptomatic, normalizes 2–12 weeks postpartum.\n\nGestational thrombocytopenia (platelet counts 100,000–150,000/μL) is the most common cause of thrombocytopenia in pregnancy and is benign. Must be distinguished from ITP, HELLP syndrome, and TTP-HUS. The hypercoagulable state reflects increased clotting factors and decreased fibrinolysis."
    difficulty: medium
    tags: [obstetrics, physiologic changes pregnancy, hematologic, anemia, thrombocytopenia, hypercoagulable, DVT]
  - front: "What respiratory changes occur in normal pregnancy?"
    back: "Increased: O₂ consumption, minute ventilation (causing mild respiratory alkalosis helping CO₂ cross placenta). Decreased: TLC, FRC, RV. No change in: vital capacity, FEV₁. Elevated diaphragm. Increased nasal congestion.\n\nThe compensated respiratory alkalosis of pregnancy (PCO₂ ~30 mmHg) creates a gradient for CO₂ diffusion from fetal to maternal circulation. Decreased FRC means pregnant patients desaturate more rapidly with apnea—critical for anesthetic management and intubation."
    difficulty: medium
    tags: [obstetrics, physiologic changes pregnancy, respiratory, minute ventilation, FRC, respiratory alkalosis]
  - front: "What GI changes occur in pregnancy and what is their mechanism?"
    back: "Progesterone causes: increased gallstones (gallbladder stasis), constipation (decreased GI motility), predisposition to GERD (reduced lower esophageal sphincter tone + delayed gastric emptying + uterine compression). Hemorrhoids result from constipation and increased intra-abdominal pressure.\n\nProgesterone's smooth muscle relaxation effects throughout the GI tract underlie most pregnancy-related GI symptoms. GERD symptoms affect up to 80% of pregnant patients. These changes also increase aspiration risk in obstetric anesthesia (Mendelson syndrome risk)."
    difficulty: easy
    tags: [obstetrics, physiologic changes pregnancy, gastrointestinal, progesterone, GERD, constipation, gallstones]
  - front: "What genitourinary changes occur in pregnancy and why does creatinine decrease?"
    back: "Increased CO → increased GFR → decreased creatinine (normal in pregnancy: 35–44 mmol/L), uric acid, and BUN. Ureteral and renal pelvis dilation (R>L) from progesterone and uterine pressure. Glycosuria can be physiologic (especially T3) due to GFR increase exceeding tubular reabsorption capacity. Increased UTI/pyelonephritis risk from urinary stasis.\n\nCreatinine normal values must be adjusted in pregnancy—a 'normal' non-pregnant creatinine of 80 mmol/L may represent significant renal impairment in pregnancy. Glycosuria in T1 or T2 should prompt diabetes testing; in T3 alone it may be physiologic."
    difficulty: medium
    tags: [obstetrics, physiologic changes pregnancy, renal, GFR, creatinine, glycosuria, UTI]
  - front: "What endocrine changes occur in the thyroid during pregnancy?"
    back: "Moderate thyroid enlargement; increased total thyroxine (T4) and thyroxine-binding globulin (TBG); normal FREE thyroxine index and TSH. Physiologic TSH suppression in T1 due to β-hCG cross-reactivity with TSH receptors.\n\nTBG rises due to estrogen stimulation, increasing total T4 but not free T4. Physiology TSH suppression in T1 (β-hCG shares structural homology with TSH) can mimic hyperthyroidism—free T4 and clinical context are key. This is why free hormone levels and clinical symptoms guide thyroid management in pregnancy."
    difficulty: medium
    tags: [obstetrics, physiologic changes pregnancy, thyroid, TSH, TBG, T1 trimester, β-hCG]
  - front: "What folic acid supplementation does the CTFPHC recommend for all patients capable of becoming pregnant?"
    back: "0.4 mg/day of folic acid supplementation for all patients capable of becoming pregnant (CTFPHC Grade II-2-A recommendation). Higher doses (4–5 mg/day) are recommended for high-risk patients (prior NTD, diabetes, antiepileptic drug use).\n\nFolic acid reduces the risk of neural tube defects (NTDs) by ~70%. Supplementation must begin BEFORE conception as the neural tube closes by 4 weeks GA—often before pregnancy is confirmed. This is a key preconception counselling point in Canadian family medicine and obstetrics."
    difficulty: easy
    tags: [obstetrics, preconception counselling, folic acid, neural tube defects, NTD, CTFPHC, prenatal vitamins]
  - front: "When should the initial prenatal visit occur and what conditions warrant earlier assessment?"
    back: "Initial prenatal visit should occur within 8–12 weeks of the first day of LMP. Earlier assessment is warranted for: age <20 or >35 years, vaginal bleeding, severe nausea/vomiting, or other risk factors.\n\nEarly prenatal care optimizes outcomes by establishing accurate gestational age dating, identifying medical conditions requiring modification, initiating appropriate supplementation, and providing counselling. First trimester screening (weeks 11–13+6) depends on timely presentation."
    difficulty: easy
    tags: [obstetrics, prenatal care, initial prenatal visit, antepartum care, gestational age]
  - front: "What is the critical period of organogenesis in pregnancy and why does it matter for preconception counselling?"
    back: "Weeks 3–8 GA is the critical period of organogenesis (most organ systems develop). Early preparation is vital because teratogenic exposures during this window can cause structural fetal anomalies, often before pregnancy is recognized.\n\nPreconception counselling focuses on medication review and teratogen avoidance, folic acid initiation, and optimizing maternal health BEFORE conception, since organogenesis occurs at 3–8 weeks—when many patients are unaware they are pregnant."
    difficulty: easy
    tags: [obstetrics, preconception counselling, organogenesis, teratogenicity, fetal development]
  - front: "What infections should be screened for at preconception/initial prenatal visit in Canada?"
    back: "Rubella, HBsAg (hepatitis B), VDRL (syphilis), Pap smear, gonorrhea/chlamydia, HIV. Additionally: TB testing based on travel/healthcare work history; varicella history or vaccination; parvovirus immunity if exposed to small children.\n\nThis comprehensive SOGC-aligned screening panel detects infections that can cause vertical transmission, congenital anomalies, or maternal morbidity. Early identification allows for interventions (immunoglobulin, antivirals, prophylaxis) to reduce fetal and neonatal harm."
    difficulty: easy
    tags: [obstetrics, prenatal screening, infection, rubella, hepatitis B, HIV, syphilis, SOGC]
  - front: "What does the placenta produce and what is its structural composition?"
    back: "Composition: discoid mass of fetal tissue (chorion frondosum) and maternal tissue (decidua basalis), divided by fissures into cotyledons on the uterine side. Produces: progesterone, placental lactogen, estrogen, relaxin, β-hCG, and infant growth factors.\n\nThe placenta is both the interface for nutrient/gas exchange and a major endocrine organ. Its hormonal products maintain the corpus luteum (β-hCG), support uterine quiescence (progesterone), and regulate fetal growth. Abnormal implantation causes antepartum hemorrhage (placenta previa, abruption)."
    difficulty: easy
    tags: [obstetrics, placenta, fetal circulation, anatomy, placental hormones, β-hCG, progesterone]
  - front: "What trimesters are defined in obstetrics and what is considered a normal term pregnancy?"
    back: "T1 (first trimester): weeks 1–14; T2 (second trimester): weeks 14–28; T3 (third trimester): weeks 28–42. Normal term pregnancy: 37–42 weeks GA.\n\nTrimester definitions help structure clinical care—first trimester screening occurs in T1, gestational diabetes screening in T2 (24–28 weeks), and Group B Streptococcus (GBS) screening in T3 (35–37 weeks). Preterm is defined as <37 weeks and post-term as >42 weeks."
    difficulty: easy
    tags: [obstetrics, trimester, gestational age, term pregnancy, preterm, prenatal care]
  - front: "What skin changes are normal in pregnancy and what causes them?"
    back: "Increased pigmentation of perineum and areola; chloasma (melasma—pigmentation under eyes/nose bridge); linea nigra (midline abdominal pigmentation). Also: proliferation of skin tags; spider angiomas; palmar erythema (estrogen); striae gravidarum (connective tissue changes).\n\nMost skin changes reflect elevated estrogen (palmar erythema, spider angiomas) and melanocyte-stimulating hormone activity (increased pigmentation). These are physiologic and usually resolve postpartum, though striae and linea nigra may persist."
    difficulty: easy
    tags: [obstetrics, physiologic changes pregnancy, skin, chloasma, linea nigra, striae, estrogen]
  - front: "What calcium changes occur in pregnancy and how is bone density maintained?"
    back: "Decreased total maternal Ca²⁺ (due to decreased albumin). Free ionized Ca²⁺ remains normal due to decreased PTH → increased bone resorption, gut absorption, and bone turnover. Bone density is maintained by estrogen inhibition of excessive resorption.\n\nFetal calcium demands are met primarily through increased maternal gut absorption and decreased renal losses. Despite increased bone turnover markers, net bone density is preserved in pregnancy (unlike lactation). This is clinically relevant for vitamin D and calcium supplementation guidance."
    difficulty: medium
    tags: [obstetrics, physiologic changes pregnancy, calcium, PTH, bone density, endocrine]
