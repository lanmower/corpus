  - front: "Why does cirrhosis cause gynecomastia?"
    back: "Reduced ability of liver to metabolize and inactivate estrogens\n\nLiver dysfunction leads to increased estrogen levels relative to androgens, stimulating breast tissue."
    difficulty: hard
