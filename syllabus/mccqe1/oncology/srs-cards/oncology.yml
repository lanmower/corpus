# Oncology (Oncology) - generated from srs-mccqe1
cards:
  - front: "What are the characteristics of small cell lung cancer (SCLC) vs. non-small cell lung cancer (NSCLC)?"
    back: "SCLC (10-15%): central location, strong smoking correlation, neuroendocrine origin, disseminated at presentation, treated with chemo + radiation (surgery rare). NSCLC (85-90%): includes adenocarcinoma (most common, peripheral), SCC (central), large cell (peripheral).\n\nAdenocarcinoma is the most common subtype in nonsmokers. SCLC has the worst prognosis. Paraneoplastic syndromes (SIADH, Cushing's, Lambert-Eaton) are most often associated with SCLC. PD-L1 testing guides immunotherapy."
    difficulty: medium
    tags: [oncology, pulmonology, lung cancer]
  - front: "What paraneoplastic syndromes are associated with lung cancer?"
    back: "SCLC: SIADH, Cushing's (ACTH), Lambert-Eaton syndrome. SCC: hypercalcemia (PTHrP). NSCLC: clubbing, HPOA, Trousseau's syndrome (migratory thrombophlebitis). Bronchial carcinoid: carcinoid syndrome.\n\nLung cancer is the most common cause of cancer mortality worldwide in both men and women. 2/3 of primary lung cancers metastasize to the lower lung due to increased blood flow to the base."
    difficulty: medium
    tags: [oncology, pulmonology, paraneoplastic syndromes]
  - front: "What are the risk factors for esophageal SCC vs. adenocarcinoma?"
    back: "SCC: smoking, alcohol, hot liquids, achalasia, strictures, diverticula; more common in Black/Asian populations. Adenocarcinoma: Barrett's esophagus (most important), GERD, obesity, smoking; more common in White populations.\n\nAdenocarcinoma is most common in Western countries (lower 1/3). SCC is most common worldwide (upper 2/3). Both present with progressive dysphagia (solids then liquids). Prognosis is usually poor due to late presentation."
    difficulty: medium
    tags: [oncology, surgery, esophageal cancer]
  - front: "What are the two greatest risk factors for breast cancer?"
    back: "Female sex (99% of cases) and age (83% diagnosed >50 years old).\n\nOther risk factors include personal/family history, estrogen exposure (nulliparity, early menarche, late menopause, HRT >5 years), high breast density, BRCA1/2 mutations, and radiation exposure. 1 in 8 Canadian women will be diagnosed."
    difficulty: easy
    tags: [oncology, surgery, breast cancer]
  - front: "What is the triple test for diagnosis of breast cancer?"
    back: "(1) Clinical breast exam, (2) Imaging (mammography + U/S if ≥30; U/S alone if <30/pregnant/lactating), (3) Pathology (U/S or mammography-guided core needle biopsy).\n\nA normal mammogram does not rule out cancer based on clinical findings. MRI is used for patients with ≥25% lifetime risk. Any palpable dominant breast mass requires further investigation regardless of age."
    difficulty: easy
    tags: [oncology, surgery, breast cancer, diagnosis]
  - front: "What is the key principle regarding breast-conserving surgery (BCS) vs. mastectomy?"
    back: "There is no survival benefit of mastectomy over BCS plus radiation for stage I and II disease. BCS + radiation achieves equivalent survival to mastectomy when local control is achieved.\n\nBCS contraindications include inflammatory breast cancer, multifocal disease, failure to obtain clear margins, and inability to receive radiation. Sentinel lymph node biopsy is performed in clinically node-negative disease."
    difficulty: medium
    tags: [oncology, surgery, breast cancer, treatment]
  - front: "What are the hormonal therapy options for ER-positive breast cancer?"
    back: "Premenopausal: tamoxifen (SERM) for 5-10 years. Postmenopausal: aromatase inhibitors (e.g., anastrozole). Other options: ovarian ablation (GnRH agonist, oophorectomy).\n\nWomen receiving tamoxifen need regular gynecologic follow-up due to increased risk of endometrial cancer. For HER2-positive breast cancer, add trastuzumab + pertuzumab to chemotherapy. Triple-negative disease (ER/PR/HER2-negative) has worse prognosis."
    difficulty: medium
    tags: [oncology, pharmacology, breast cancer]
  - front: "What is DCIS and how is it treated?"
    back: "Ductal carcinoma in situ: malignant cells contained within breast ducts, 80% non-palpable, detected by screening mammogram as microcalcifications. Treatment: lumpectomy + radiation (5-10% invasive cancer risk) or mastectomy if large/multifocal (risk reduced to 1%). 99% 5-year survival.\n\nDCIS carries a 35% risk of invasive ductal carcinoma in the same breast over 10 years if untreated. LCIS is different — it's a risk factor for invasive carcinoma (~1%/year) in either breast and is managed with surveillance."
    difficulty: medium
    tags: [oncology, surgery, breast cancer, DCIS]
