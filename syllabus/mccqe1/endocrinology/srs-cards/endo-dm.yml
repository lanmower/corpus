    back: "Personal or family history of autoimmune disease\n\nT1DM is an autoimmune condition with strong association with other autoimmune diseases."
    difficulty: easy
    tags: [endocrinology, diabetes, T1DM, risk factors, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the recommended screening for T2DM?"
    back: "FBG or HbA1C in everyone ≥40 q3yr, or at high-risk using CANRISK calculator; more frequent/earlier testing if >1 risk factor present\n\nScreening recommendations allow for risk-stratified testing in high-risk individuals."
    difficulty: medium
    tags: [endocrinology, diabetes, screening, prevention, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the daily insulin requirement calculation for T1DM?"
    back: "0.5-0.7 units/kg/day\n\nT1DM patients typically require 0.5-0.7 units/kg/day of total insulin."
