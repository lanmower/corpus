  - front: "What should be included in the initial diabetes assessment?"
    back: "History (symptoms of hyperglycemia, ketoacidosis, hypoglycemia), past medical history, family history, risk factors, medications, sexual function, lifestyle, physical exam (height, weight, BMI, BP, WC, fundoscopy, thyroid, cardiovascular, neurological), investigations (FBG, HbA1C, fasting lipids, Cr, urine ACR, ECG)\n\nComprehensive initial assessment establishes baseline and guides management."
    difficulty: medium
    tags: [endocrinology, diabetes, assessment, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What monitoring is required for diabetes patients?"
    back: "HbA1C q2-4mo (q3mo if at goal), fasting lipid profile annually, random urine ACR and Cr annually, foot exam (10g monofilament), retinopathy screening annually, BP at each visit, influenza/pneumococcal vaccination\n\nRegular monitoring helps prevent and detect diabetes complications early."
    difficulty: medium
    tags: [endocrinology, diabetes, monitoring, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are major complications of diabetes mellitus?"
    back: "Leading cause of new-onset blindness and renal dysfunction; Canadian adults with DM are twice as likely to die prematurely\n\nDiabetes causes significant microvascular (retinopathy, nephropathy) and macrovascular (CVD) complications."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are risk factors for Type 1 Diabetes Mellitus?"
    back: "Personal or family history of autoimmune disease\n\nT1DM is an autoimmune condition with strong association with other autoimmune disorders and family history."
    difficulty: easy
    tags: [endocrinology, diabetes, T1DM, risk factors, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are risk factors for Type 2 Diabetes Mellitus?"
    back: "First-degree relative with DM, age ≥40yr, obesity (especially abdominal), HTN, hyperlipidemia, CAD, vascular disease, prior gestational diabetes, macrosomic baby >4kg, PCOS, IGT or IFG, high-risk ethnicity, certain medications (glucocorticoids, atypical antipsychotics, HAART)\n\nT2DM has multiple modifiable and non-modifiable risk factors including metabolic syndrome components and genetic predisposition."
    difficulty: easy
    tags: [endocrinology, diabetes, T2DM, risk factors, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
