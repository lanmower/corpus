# Dementia & Cognitive Impairment (Neurology) - generated from srs-mccqe1
cards:
  - front: "A 75-year-old has progressive memory loss, word-finding difficulty, and disorientation to date over 2 years. MMSE is 18/30. Family reports personality changes. What is the most likely diagnosis?"
    back: "Alzheimer disease (AD) — most common dementia (60-70%); characterized by insidious onset, gradual progression, early episodic memory impairment, language difficulties\n\nAlzheimer Disease diagnostic criteria require cognitive decline from prior functioning in ≥2 cognitive domains causing functional impairment. Canadian Consensus Conference on Dementia (CCCD) guidelines: comprehensive dementia assessment including cognitive testing, functional status, and biomarker support (CSF, PET, MRI)."
    difficulty: medium
    tags: [Alzheimer disease, dementia, MMSE, memory loss, neurology]
  - front: "What cognitive screening tools are used in Canada for dementia assessment?"
    back: "MMSE (Mini-Mental State Examination, 0-30 points), MoCA (Montreal Cognitive Assessment, 0-30 points) — MoCA is more sensitive for mild cognitive impairment (cutoff <26/30)\n\nCCCD recommends MoCA as preferred screening tool for cognitive impairment as it is more sensitive than MMSE for MCI and early dementia. MMSE is less sensitive for detecting executive dysfunction and visuospatial problems. Comprehensive neuropsychological testing for complex cases."
    difficulty: easy
    tags: [MMSE, MoCA, cognitive screening, dementia assessment, neurology]
  - front: "What is mild cognitive impairment (MCI) and what is its prognosis?"
    back: "MCI: cognitive decline greater than expected for age with preserved functional independence; converts to dementia at ~15%/year vs. 1-2%/year in normal aging\n\nCCCD guidelines: MCI requires comprehensive assessment to determine etiology. Amnestic MCI has highest risk of progression to AD. No pharmacological treatment proven to prevent MCI progression to dementia. CCCD recommends lifestyle interventions (exercise, cognitive engagement, vascular risk factor control)."
    difficulty: medium
    tags: [MCI, mild cognitive impairment, prognosis, dementia risk, neurology]
  - front: "What reversible causes of dementia must be excluded?"
    back: "B12 deficiency, hypothyroidism, depression (pseudodementia), normal pressure hydrocephalus (NPH), subdural hematoma, neurosyphilis, HIV encephalopathy, medication effects (anticholinergics, benzodiazepines)\n\nCCCD guidelines require a basic laboratory workup: CBC, B12, TSH, electrolytes, creatinine, calcium, glucose, LFTs. CT head or MRI to exclude structural causes. NPH triad: wet (incontinence), wobbly (gait disturbance), wacky (dementia) — gait disturbance most prominent feature."
    difficulty: easy
    tags: [reversible dementia, hypothyroidism, B12 deficiency, NPH, neurology]
  - front: "What features distinguish Lewy body dementia (DLB) from Alzheimer disease?"
    back: "DLB: visual hallucinations, parkinsonism, fluctuating cognition, REM sleep behavior disorder; extreme sensitivity to antipsychotics; alpha-synuclein pathology — early gait disturbance before severe cognitive decline\n\nCCCD guidelines: DLB is the second most common neurodegenerative dementia. Avoid conventional antipsychotics in DLB (neuroleptic sensitivity causing rigidity, sedation, death). Cholinesterase inhibitors (rivastigmine) have evidence for cognitive benefit in DLB."
    difficulty: hard
    tags: [Lewy body dementia, DLB, visual hallucinations, parkinsonism, antipsychotic sensitivity, neurology]
  - front: "What is vascular dementia and how does it differ from Alzheimer disease?"
    back: "Vascular dementia: stepwise cognitive decline with focal neurological signs, prominent executive dysfunction, gait disturbance; associated with stroke, white matter changes on MRI; often overlaps with AD\n\nCCCD: pure vascular dementia uncommon; vascular cognitive impairment (VCI) includes full spectrum from VaMCI to vascular dementia. Treatment: aggressive management of vascular risk factors (BP, diabetes, dyslipidemia, antiplatelet for strokes). Cholinesterase inhibitors less evidence than in AD."
    difficulty: medium
    tags: [vascular dementia, VCI, vascular risk factors, executive dysfunction, neurology]
  - front: "What is frontotemporal dementia (FTD) and how does it present differently from Alzheimer disease?"
    back: "FTD: early personality change, disinhibition, apathy, language dysfunction (semantic dementia, progressive non-fluent aphasia); relatively preserved memory early; younger onset (50s-60s)\n\nCCCD guidelines: FTD diagnosis requires neuropsychological testing and neuroimaging (frontotemporal atrophy on MRI). Behavioral variant FTD: social inappropriateness, impulsivity, loss of empathy. TDP-43 or FUS protein pathology. No approved disease-modifying therapy."
    difficulty: hard
    tags: [frontotemporal dementia, FTD, behavioral variant, personality change, neurology]
  - front: "What pharmacological treatments are available for Alzheimer disease?"
    back: "Cholinesterase inhibitors (donepezil, rivastigmine, galantamine) for mild-moderate AD; memantine (NMDA antagonist) for moderate-severe AD or as add-on; lecanemab (anti-amyloid antibody) for early AD — modest benefits\n\nCCCD recommends cholinesterase inhibitors as first-line for mild-moderate AD. They improve cognitive and functional outcomes. Memantine reduces agitation and improves moderate-severe AD. Lecanemab (FDA and Health Canada approved 2024) slows cognitive decline in early AD by 27%."
    difficulty: medium
    tags: [AD treatment, cholinesterase inhibitors, donepezil, memantine, lecanemab, neurology]
  - front: "What is the approach to behavioral and psychological symptoms of dementia (BPSD)?"
    back: "Non-pharmacological first: structured environment, activities, caregiver education, sleep hygiene; pharmacological only if non-pharm fails: antidepressants (SSRIs for depression/agitation), low-dose atypical antipsychotics (risperidone for severe agitation/psychosis)\n\nCCCD guidelines emphasize non-pharmacological approaches for BPSD as first-line. Conventional antipsychotics and benzodiazepines increase falls, sedation, and mortality in dementia. Atypical antipsychotics (risperidone, quetiapine) carry black box warning for increased mortality in elderly dementia patients."
    difficulty: medium
    tags: [BPSD, behavioral symptoms, dementia management, non-pharmacological, antipsychotics, neurology]
  - front: "A 70-year-old has dementia with early gait disturbance, urinary incontinence, and enlarged ventricles on CT with no significant cortical atrophy. Diagnosis and treatment?"
    back: "Normal pressure hydrocephalus (NPH); treat with large-volume LP (remove 30-50 mL CSF) as diagnostic test — if gait improves, proceed to VP shunt\n\nNPH triad: gait disturbance (most prominent and first), urinary incontinence, dementia. Diagnosis: CT/MRI showing hydrocephalus out of proportion to cortical atrophy; CSF tap test with gait assessment before and after 30-50 mL removal. Ventriculoperitoneal (VP) shunt provides durable improvement."
    difficulty: hard
    tags: [normal pressure hydrocephalus, NPH, VP shunt, LP test, gait disturbance, neurology]
  - front: "What is the diagnostic workup for dementia per CCCD guidelines?"
    back: "History (including informant), cognitive testing (MoCA/MMSE), functional assessment, neurological exam; Labs: CBC, B12, TSH, electrolytes, LFTs, creatinine, glucose; Brain MRI (preferred over CT); neuropsychological testing\n\nStructural neuroimaging (MRI preferred) is recommended in all new dementia assessments to exclude reversible causes and support subtype diagnosis. CSF biomarkers (amyloid, tau) and amyloid PET scan increasingly available to confirm AD pathology."
    difficulty: easy
    tags: [dementia workup, CCCD, MoCA, brain MRI, laboratory tests, neurology]
  - front: "What is the role of genetic testing in early-onset dementia?"
    back: "Genetic counseling and testing offered for: family history of early-onset AD (<65), APOE ε4 status (increases AD risk 3-8x), APP/PSEN1/PSEN2 mutations (autosomal dominant AD), FTD-related mutations (C9orf72, MAPT, GRN)\n\nCCCD guidelines: genetic testing for familial early-onset AD requires genetic counseling first. APOE ε4 is a risk factor, not diagnostic. PSEN1 mutation carriers have nearly 100% lifetime AD risk. Genetic testing affects insurance and employment — careful pre-test counseling."
    difficulty: hard
    tags: [genetic testing, early-onset dementia, APOE, PSEN1, neurology]
  - front: "What is Creutzfeldt-Jakob disease (CJD) and what are its diagnostic features?"
    back: "CJD: rapidly progressive dementia with myoclonus, cerebellar ataxia, visual disturbances; EEG: periodic sharp wave complexes; MRI: DWI cortical ribboning/basal ganglia signal; CSF 14-3-3 protein; RT-QuIC in CSF\n\nPrion disease: abnormal PrP protein accumulates. Sporadic CJD most common. Variant CJD (vCJD) from BSE exposure — young adults. CJD is rapidly fatal (median 8 months). No effective treatment. Public health reporting required."
    difficulty: hard
    tags: [CJD, prion disease, rapidly progressive dementia, EEG, neurology]
  - front: "What ethical and legal considerations are important in dementia care?"
    back: "Advance care planning early in disease; capacity assessment for medical decisions; Power of Attorney (POA) for personal care and property; driving assessment and reporting; residential care planning\n\nCCCD guidelines recommend discussing advance care planning and legal documents (POA, advance directive) early in dementia. Capacity is decision-specific and fluctuating. Substitute decision-makers follow patient's prior expressed wishes. Driving assessment: formal road test often required."
    difficulty: medium
    tags: [advance care planning, capacity, POA, driving in dementia, ethics, neurology]
  - front: "How should pain be assessed and managed in a non-verbal patient with advanced dementia?"
    back: "Use observational pain scales (PAINAD, PACSLAC for non-verbal); treat pain with acetaminophen first-line; opioids for moderate-severe pain; avoid NSAIDs (GI/renal risk in elderly)\n\nCCCD and CCEC (Canadian Coalition for End-of-life Care) guidelines emphasize that pain assessment requires behavioral observation in patients who cannot self-report. Regular scheduled analgesics often preferable to PRN dosing in dementia. Non-pharmacological approaches (positioning, massage) as adjuncts."
    difficulty: medium
    tags: [pain assessment dementia, non-verbal pain, PAINAD, palliative care, neurology]
  - front: "What is the workup for new-onset dementia?"
    back: "CBC, lytes, Ca, TSH, B12, glucose, syphilis serology, CT/MRI brain. Consider: HIV, heavy metals, LP if atypical\n\nReversible causes: B12 deficiency, hypothyroidism, NPH, subdural hematoma, depression. Alzheimer's: temporal/parietal atrophy. Vascular: stepwise decline, periventricular WM changes."
    difficulty: medium
    tags: [dementia, workup]
  - front: "What is the recommended initial workup for suspected dementia?"
    back: "Cognitive testing (MoCA preferred), bloodwork (CBC, electrolytes, calcium, glucose, TSH, B12, folate), and neuroimaging (CT or MRI brain). Consider HIV, syphilis serology in appropriate contexts.\n\nCCCD recommends MoCA over MMSE for screening (better sensitivity for MCI). Reversible causes must be excluded. MRI is preferred for vascular and frontotemporal patterns."
    difficulty: medium
    tags: [dementia workup, investigation, MoCA, neurology]
  - front: "What distinguishes Alzheimer, frontotemporal, Lewy body, and vascular dementia?"
    back: "AD: episodic memory loss, temporal-parietal atrophy. FTD: personality/behavioral change or progressive aphasia, age <65. DLB: fluctuating cognition, visual hallucinations, parkinsonism, REM sleep behavior disorder. VaD: stepwise decline, executive dysfunction, white matter disease.\n\nDistinguishing subtypes is high-yield for MCCQE1. DLB patients have severe neuroleptic sensitivity. FTD is the second most common young-onset dementia. CCCD guidelines emphasize clinical phenotyping."
    difficulty: hard
    tags: [dementia subtypes, differential diagnosis, Alzheimer, DLB, neurology]
  - front: "What pharmacological treatments are available for Alzheimer disease?"
    back: "Cholinesterase inhibitors (donepezil 5-10mg, rivastigmine, galantamine) for mild-moderate AD. Memantine (NMDA antagonist) for moderate-severe AD. Can combine ChEI + memantine.\n\nCCCD guidelines recommend ChEIs as first-line for mild-moderate AD. Side effects: GI (nausea, diarrhea), bradycardia, syncope. Memantine added at moderate stage (MMSE 10-20). Reassess at 3-6 months."
    difficulty: hard
    tags: [Alzheimer treatment, cholinesterase inhibitors, memantine, neurology]
  - front: "What is the MoCA test and how does it compare to MMSE?"
    back: "MoCA: 30-point test assessing visuospatial/executive, naming, memory, attention, language, abstraction, orientation. Score <26 suggests impairment (+1 if <=12 years education). MoCA detects MCI better than MMSE (sensitivity 90% vs 18%).\n\nMoCA was developed in Montreal and is the preferred Canadian screening tool. It assesses executive function more thoroughly than MMSE, making it superior for vascular cognitive impairment and MCI."
    difficulty: medium
    tags: [MoCA, MMSE, cognitive screening, neurology]
  - front: "What are the diagnostic criteria for mild cognitive impairment (MCI)?"
    back: "Subjective cognitive complaint, objective impairment on testing (1-1.5 SD below norms), preserved functional independence (ADLs intact), does NOT meet dementia criteria. Subtypes: amnestic and non-amnestic.\n\nAmnestic MCI converts to AD at ~10-15% per year. Canadian guidelines recommend annual reassessment. No pharmacological treatment is recommended for MCI. Exercise and vascular risk management are advised."
    difficulty: medium
    tags: [MCI, mild cognitive impairment, diagnosis, neurology]
  - front: "What are the potentially reversible causes of dementia?"
    back: "Hypothyroidism, B12 deficiency, neurosyphilis, HIV, normal pressure hydrocephalus (gait apraxia, incontinence, dementia), chronic subdural hematoma, depression (pseudodementia), medication effects (anticholinergics, benzodiazepines).\n\nCCCD guidelines mandate screening for reversible causes. NPH is treatable with VP shunt. Depression-related pseudodementia improves with antidepressants. Anticholinergic burden is a major modifiable risk factor in elderly."
    difficulty: medium
    tags: [reversible dementia, differential diagnosis, NPH, neurology]
  - front: "What is the management hierarchy for behavioral symptoms of dementia (BPSD)?"
    back: "(1) Non-pharmacological first: caregiver education, structured routines, music therapy, redirection. (2) Risperidone (only antipsychotic with Health Canada approval for BPSD) at lowest dose. (3) Avoid benzodiazepines and anticholinergics.\n\nCCCD guidelines emphasize non-pharmacological approaches first. Antipsychotics carry a black box warning for increased mortality in elderly dementia patients (1.6-1.7x). Attempt tapering q3 months."
    difficulty: hard
    tags: [BPSD, behavioral symptoms, antipsychotics, dementia management, neurology]
  - front: "What is the presentation and management of normal pressure hydrocephalus?"
    back: "Triad: gait apraxia (magnetic gait, first symptom), urinary incontinence, cognitive decline. Ventriculomegaly on imaging (Evans index >0.3). CSF tap test: removal of 30-50 mL improves gait. Treatment: VP shunt.\n\nNPH is one of few surgically treatable dementias. CSF tap test has ~50-80% sensitivity for predicting shunt response. VP shunt improves gait in ~80%, cognition in ~50% of selected patients."
    difficulty: hard
    tags: [NPH, normal pressure hydrocephalus, treatable dementia, neurology]
  - front: "What genetic risk factors and biomarkers are relevant in Alzheimer disease?"
    back: "APOE e4: strongest genetic risk (3x heterozygote, 12x homozygote). Early-onset AD genes: APP, PSEN1, PSEN2 (autosomal dominant). Biomarkers: CSF Abeta42 (decreased), CSF tau/p-tau (increased), amyloid PET.\n\nAPOE testing is not recommended for routine diagnosis per Canadian guidelines. CSF biomarkers are primarily research tools in Canada. Plasma p-tau217 is an emerging blood-based biomarker."
    difficulty: hard
    tags: [APOE, biomarkers, Alzheimer genetics, neurology]
  - front: "How is Lewy body dementia managed differently from other dementias?"
    back: "DLB responds to ChEIs (rivastigmine preferred). AVOID antipsychotics-severe neuroleptic sensitivity. If needed: quetiapine at lowest dose only. Parkinsonism: cautious low-dose levodopa. RBD: melatonin first-line.\n\nNeuroleptic sensitivity in DLB is a critical safety concern. Up to 50% experience severe reactions to antipsychotics. DLB has the best ChEI response among dementias. Visual hallucinations alone may not require treatment if non-distressing."
    difficulty: hard
    tags: [Lewy body dementia, neuroleptic sensitivity, DLB treatment, neurology]
  - front: "What non-pharmacological interventions have evidence for dementia prevention?"
    back: "Physical exercise (strongest evidence), cognitive stimulation, Mediterranean diet, vascular risk factor management, social engagement, hearing aid use for hearing loss. Midlife hearing loss treatment may reduce risk by 8%.\n\nLancet Commission identified 12 modifiable risk factors for 40% of dementias. Canadian Brain Health Strategy emphasizes midlife hypertension treatment, activity, and social engagement. FINGER trial showed multimodal lifestyle intervention benefit."
    difficulty: medium
    tags: [dementia prevention, lifestyle, risk factors, neurology]
  - front: "What is the prognosis of different dementia types?"
    back: "AD: median 8-10 years. VaD: stepwise, 5-year survival. DLB: 5-7 years, faster decline. FTD: 6-8 years. CJD: rapid progressive dementia, death in <1 year.\n\nUnderstanding trajectories aids prognostication and advance care planning. Canadian guidelines recommend early goals-of-care discussions. CJD should be suspected with rapid dementia + myoclonus + periodic sharp waves on EEG."
    difficulty: medium
    tags: [dementia prognosis, trajectory, survival, neurology]
  - front: "When is genetic testing indicated in dementia?"
    back: "Early-onset AD (<65) with autosomal dominant pattern, suspected genetic FTD (C9orf72, GRN, MAPT). FTD has highest heritability (~40% family history). APOE genotyping NOT recommended routinely.\n\nCanadian guidelines are conservative on genetic testing. C9orf72 causes both FTD and ALS. Genetic counseling is mandatory before and after testing. Early-onset AD genes: APP, PSEN1, PSEN2."
    difficulty: hard
    tags: [genetic testing, familial dementia, early-onset, neurology]
  - front: "What tools are used for staging dementia severity?"
    back: "GDS (Global Deterioration Scale): 7 stages. CDR (Clinical Dementia Rating): 0-3 scale. FAST: 7 stages aligned with AD. Practical: mild (MMSE 20-26), moderate (10-19), severe (<10).\n\nGDS and CDR are used in Canadian clinical practice. FAST >=7A predicts <6 month survival for palliative care referral. ChEIs continued until moderate-severe stage, then reassessed."
    difficulty: medium
    tags: [dementia staging, GDS, CDR, FAST, neurology]
  - front: "What medicolegal issues arise in dementia care in Canada?"
    back: "Capacity is decision-specific. Power of attorney should be established early. Mandatory driving reporting in most provinces. Elder abuse screening. Cognitive impairment does not automatically negate capacity.\n\nIn Canada, capacity must be assessed for each specific decision per provincial legislation (e.g., Ontario Substitute Decisions Act). Physicians must report unfit drivers to the Ministry of Transportation in most provinces."
    difficulty: hard
    tags: [capacity, medicolegal, driving, dementia, neurology]
  - front: "What distinguishes Lewy body dementia from Alzheimer's and frontotemporal dementia?"
    back: "LBD: visual hallucinations, parkinsonism, fluctuating cognition, REM sleep behavior disorder, neuroleptic sensitivity. FTD: personality/behavioral changes, disinhibition, early executive dysfunction, language variants. AD: memory loss, temporal-parietal atrophy\n\nLBD: avoid antipsychotics (severe sensitivity). Treatment: cholinesterase inhibitors effective. FTD: no effective disease-modifying treatment, younger onset (45-65), SSRIs for behavioral symptoms. Overlap with ALS in some cases."
    difficulty: hard
    tags: [dementia, LBD, FTD, differential]
  - front: "What are the distinguishing clinical features of Lewy body dementia vs frontotemporal dementia vs vascular dementia?"
    back: "LBD: visual hallucinations, fluctuating cognition, parkinsonism, REM sleep behaviour disorder, severe neuroleptic sensitivity. FTD: early personality/behavioural changes (disinhibition, apathy), language variants (semantic, nonfluent), preserved visuospatial initially. Vascular: stepwise decline, focal neurological signs, executive dysfunction, vascular risk factors, white matter changes on MRI.\n\nAccurate subtype diagnosis guides treatment: cholinesterase inhibitors help LBD and AD but not FTD. Antipsychotics can cause life-threatening reactions in LBD. Canadian Consensus Conference on Dementia provides diagnostic criteria. FTD is the most common dementia in patients <65 years."
    difficulty: hard
    tags: [LBD, FTD, vascular-dementia, differential-diagnosis, clinical-features]
  - front: "What are the indications, efficacy, and side effects of cholinesterase inhibitors in dementia?"
    back: "Indicated for mild-moderate Alzheimer's and LBD. Agents: donepezil (5-10 mg), rivastigmine (patch or oral), galantamine. Modest benefit (2-4 point ADAS-cog improvement). Side effects: nausea, diarrhea, anorexia, bradycardia, insomnia, muscle cramps. Monitor for falls and syncope.\n\nCanadian Consensus Conference recommends cholinesterase inhibitors for mild-moderate AD. Benefit should be reassessed every 6-12 months. Abrupt discontinuation may cause acute cognitive decline. They are particularly beneficial in LBD for hallucinations and cognition. Not recommended for FTD or MCI."
    difficulty: medium
    tags: [cholinesterase-inhibitor, donepezil, Alzheimer, LBD, side-effects]
  - front: "What are evidence-based non-pharmacologic approaches to managing behavioural and psychological symptoms of dementia (BPSD)?"
    back: "First-line (before medications): identify and treat triggers (pain, infection, constipation, environment), person-centred care, music therapy, structured activities, caregiver education (PIECES/GPA frameworks), physical exercise, aromatherapy, reduce sensory overload, maintain routines.\n\nCanadian guidelines (CCCDTD) strongly recommend non-pharmacologic interventions as first-line for BPSD. The P.I.E.C.E.S. framework (Physical, Intellectual, Emotional, Capabilities, Environment, Social) is a Canadian model for understanding and managing BPSD. Antipsychotics should be last resort due to increased mortality risk."
    difficulty: medium
    tags: [BPSD, non-pharmacologic, PIECES, person-centred, dementia-management]
  - front: "When are antipsychotics indicated for BPSD, and what are the risks?"
    back: "Indicated only when: severe aggression/agitation causing danger to self/others, psychosis causing significant distress, AND non-pharmacologic approaches have failed. Use lowest effective dose, reassess in 1-3 months. Risks: 1.5-1.7x increased mortality (black box warning), stroke risk, metabolic effects, falls, parkinsonism.\n\nHealth Canada and CCCDTD recommend time-limited use with regular reassessment and deprescribing attempts. Risperidone is the only antipsychotic with Health Canada approval for BPSD. Avoid in LBD (severe sensitivity). The Canadian Deprescribing Network provides an antipsychotic deprescribing algorithm."
    difficulty: hard
    tags: [antipsychotic, BPSD, mortality-risk, risperidone, deprescribing]
  - front: "What tools are used to assess decision-making capacity in patients with dementia?"
    back: "Capacity assessment evaluates 4 domains: 1) understanding (comprehend relevant information), 2) appreciation (apply information to own situation), 3) reasoning (weigh risks/benefits), 4) expressing a choice (communicate consistent decision). Tools: Aid to Capacity Evaluation (ACE), MacArthur Competence Assessment Tool (MacCAT).\n\nCapacity is decision-specific, not global — a patient may lack capacity for financial decisions but retain capacity for simple medical decisions. In Canada, capacity is a clinical (not legal) determination. Each province has specific legislation (e.g., Ontario Health Care Consent Act). Document assessment thoroughly."
    difficulty: medium
    tags: [capacity-assessment, ACE-tool, decision-making, consent, dementia]
  - front: "What is the role of memantine in dementia management?"
    back: "NMDA receptor antagonist indicated for moderate-severe Alzheimer's disease. Can be combined with cholinesterase inhibitor. Modest benefit in cognition and function. Better tolerated than ChEIs (side effects: dizziness, headache, constipation). Not indicated for mild AD or other dementia types.\n\nCanadian Consensus Conference recommends memantine for moderate-severe AD when ChEIs alone are insufficient. The combination of donepezil + memantine showed benefit in the DOMINO-AD trial. Memantine may help with agitation in some patients. Dose adjustment needed with renal impairment."
    difficulty: medium
    tags: [memantine, NMDA, moderate-severe-AD, combination-therapy, pharmacotherapy]
  - front: "What cognitive screening tools are recommended for dementia assessment in primary care?"
    back: "MoCA (Montreal Cognitive Assessment): preferred, tests executive function, visuospatial, memory, attention, language, orientation. Score <26/30 is abnormal. MMSE: older tool, less sensitive for mild cognitive impairment and executive dysfunction. Clock Drawing Test: quick screen for visuospatial/executive function.\n\nMoCA was developed in Montreal and is the preferred screening tool per Canadian guidelines. It is more sensitive than MMSE for MCI and vascular cognitive impairment. Education-adjusted scoring exists. Neither tool is diagnostic alone — comprehensive neuropsychological testing is needed for atypical presentations."
    difficulty: easy
    tags: [MoCA, MMSE, cognitive-screening, primary-care, dementia-assessment]
  - front: "How do you differentiate delirium from dementia, and what is their relationship?"
    back: "Delirium: acute onset, fluctuating attention, altered consciousness, often reversible, triggered by medical illness/drugs. Dementia: insidious onset, progressive, clear consciousness (until late), irreversible. Key: delirium is common IN dementia (dementia is the #1 risk factor for delirium) and delirium accelerates dementia progression.\n\nThe Confusion Assessment Method (CAM) diagnoses delirium: acute onset + fluctuating course + inattention + EITHER disorganized thinking or altered consciousness. Delirium in hospitalized dementia patients is often missed (hypoactive subtype). Canadian guidelines recommend delirium prevention protocols in all hospitalized elderly."
    difficulty: medium
    tags: [delirium-vs-dementia, CAM, acute-confusion, risk-factors, prevention]
  - front: "What are the recommended investigations in the workup of new-onset dementia?"
    back: "Bloodwork: CBC, electrolytes, calcium, glucose, TSH, B12, creatinine. Consider: syphilis serology (if risk factors), HIV. Neuroimaging: CT or MRI (to exclude structural causes — SDH, NPH, tumor). MRI preferred for subtyping (hippocampal atrophy in AD, focal atrophy in FTD, white matter disease in vascular).\n\nCCCDTD recommends routine bloodwork and neuroimaging for all new dementia diagnoses to exclude reversible causes (5-10%). Reversible causes include hypothyroidism, B12 deficiency, NPH, and depression (pseudodementia). Specialized biomarkers (CSF amyloid/tau, PET) are reserved for atypical presentations."
    difficulty: medium
    tags: [dementia-workup, reversible-causes, neuroimaging, B12, TSH]
  - front: "What resources and supports should be discussed with families of newly diagnosed dementia patients?"
    back: "Advance care planning and power of attorney (while capacity remains), driving assessment, home safety evaluation, Alzheimer Society of Canada resources, caregiver support groups, day programs, respite care, community services (meals on wheels, personal support workers), medication management (blister packs, supervision).\n\nCanadian guidelines emphasize early advance care planning while the patient retains capacity. The Alzheimer Society of Canada provides First Link programs connecting families to local resources. Caregiver burnout is a major concern — 50% of caregivers develop depression. Provincial home care services vary but should be proactively arranged."
    difficulty: easy
    tags: [caregiver-support, advance-care-planning, Alzheimer-Society, community-resources, driving]
  - front: "How is acetylcholinesterase (ACh) action terminated in the synapse, and which drugs exploit this mechanism therapeutically?"
    back: "ACh is rapidly hydrolyzed by acetylcholinesterase in the synaptic cleft and by pseudocholinesterase in plasma. Acetylcholinesterase inhibitors (pyridostigmine, donepezil, galantamine, rivastigmine) increase ACh by blocking its breakdown.\n\nAcetylcholinesterase inhibitors are used in myasthenia gravis (pyridostigmine — peripheral) and Alzheimer's disease (donepezil, galantamine, rivastigmine — central). Organophosphate poisoning also inhibits acetylcholinesterase, causing a cholinergic crisis."
    difficulty: medium
    tags: [acetylcholine, acetylcholinesterase, cholinesterase inhibitors, myasthenia gravis, Alzheimers, pyridostigmine]
  - front: "How do cholinesterase inhibitors (donepezil, galantamine, rivastigmine) differ in their approved indications for dementia?"
    back: "Donepezil: approved for moderate to severe Alzheimer's dementia. Galantamine and rivastigmine: approved for mild to moderate Alzheimer's dementia. All three are reversible acetylcholinesterase inhibitors. Rivastigmine has very slow reversal ('pseudoirreversible'). Common side effects: nausea, vomiting, diarrhea, anorexia.\n\nDonepezil is the only cholinesterase inhibitor approved for moderate-severe Alzheimer's disease. All three share the same general mechanism but differ in pharmacokinetics and indication scope."
    difficulty: medium
    tags: [dementia, Alzheimers, cholinesterase inhibitors, donepezil, galantamine, rivastigmine, geriatrics]
  - front: "What is the mechanism of action and indication for memantine in dementia?"
    back: "Memantine is an NMDA-receptor antagonist. It is indicated for mild to moderate Alzheimer's dementia. Starting dose is 5 mg PO once daily, titrated up to 10 mg PO BID. Side effects include dizziness, headache, hypertension, constipation, confusion, and hallucinations.\n\nMemantine works by blocking pathological glutamate-mediated NMDA receptor activation (excitotoxicity), which differs from the cholinergic mechanism of cholinesterase inhibitors. It can be used in combination with cholinesterase inhibitors."
    difficulty: easy
    tags: [dementia, memantine, NMDA, Alzheimers, geriatrics]
