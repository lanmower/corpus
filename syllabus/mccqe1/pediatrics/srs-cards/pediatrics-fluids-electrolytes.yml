# Pediatrics Fluids Electrolytes (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "How do you clinically assess the degree of dehydration in pediatric patients?"
    back: "Based on % body weight loss and physical exam findings: Mild (<2yr: 5%; >2yr: 3%): normal/full pulse, normal BP, decreased urine output, slightly dry mucosa, normal fontanelle/eyes/skin turgor, normal capillary refill. Moderate (<2yr: 10%; >2yr: 6%): rapid pulse, low-normal BP, markedly decreased urine, dry mucosa, sunken fontanelle/eyes, decreased turgor, normal-increased refill. Severe (<2yr: 15%; >2yr: 9%): rapid/weak pulse, decreased BP (very late/dangerous), anuria, parched mucosa, markedly sunken fontanelle/eyes, tenting, increased refill (>3s).\n\nBP decrease is a very late sign in pediatric dehydration and indicates impending shock—children compensate well via tachycardia and vasoconstriction until critically decompensated. Capillary refill time and skin turgor are more sensitive early markers."
    difficulty: medium
    tags: [pediatrics, dehydration, fluid management, assessment, capillary refill]
  - front: "What are the indications for oral rehydration therapy (ORT) vs. IV rehydration in pediatric dehydration?"
    back: "ORT: mild to moderate dehydration. Advantages: lower cost, no IV needed, no iatrogenic hyper/hyponatremia, parental involvement. IV rehydration indications: severe dehydration requiring close monitoring; inability to tolerate ORT (vomiting, altered mental status, ileus, monosaccharide malabsorption); inability to provide ORT; failure of ORT to achieve adequate rehydration.\n\nORT is the preferred first-line approach for mild-to-moderate dehydration per Canadian/international guidelines. Severe dehydration requires IV resuscitation with NS bolus (20 mL/kg). ORT can be initiated once the patient is stabilized from severe dehydration."
    difficulty: easy
    tags: [pediatrics, dehydration, ORT, IV fluids, rehydration]
  - front: "What is the 100:50:20 rule for pediatric maintenance fluid requirements?"
    back: "Daily maintenance fluids: First 10 kg: 100 mL/kg/day. Next 10 kg (11–20 kg): 1000 mL + 50 mL/kg/day for every kg >10 kg. >20 kg: 1500 mL + 20 mL/kg/day for every kg >20 kg. Hourly rate equivalent (4:2:1 rule): ≤10 kg: 4 mL/kg/h; 11–20 kg: 40 mL/h + 2 mL/kg/h per kg >10; >20 kg: 60 mL/h + 1 mL/kg/h per kg >20.\n\nThis is the Holliday-Segar method. All pediatric maintenance fluids should include a dextrose component due to higher risk of hypoglycemia (especially if NPO). Isotonic fluids (D5W/NS + KCl) are preferred in children to reduce risk of iatrogenic hyponatremia."
    difficulty: medium
    tags: [pediatrics, maintenance fluids, 100-50-20 rule, Holliday-Segar, IV fluids]
  - front: "What are the appropriate IV fluid formulations for pediatric maintenance therapy at different ages?"
    back: "Newborn: D10W (dextrose 10% in water). First month of life: D5W/0.45 NS + KCl 20 mEq/L (only add KCl if voiding). Children without special considerations: D5W/NS + KCl 20 mEq/L (isotonic preferred to decrease risk of hyponatremia). For significant hypovolemia: IV normal saline bolus.\n\nHypotonic fluids in children can cause SIADH-related hyponatremia and acute cerebral edema. The shift toward isotonic maintenance fluids (D5W/NS) in children reflects evidence that hypotonic solutions carry increased risk of iatrogenic hyponatremia."
    difficulty: medium
    tags: [pediatrics, IV fluids, maintenance, hyponatremia, SIADH]
  - front: "What is SIADH in pediatrics and what are its risk factors and complications?"
    back: "SIADH = Syndrome of Inappropriate ADH secretion. Clinical signs: hyponatremia + excretion of concentrated urine. Risk factors: certain medications (e.g., morphine), postoperative state, pain, mechanical ventilation, pulmonary disease (e.g., pneumonia), CNS disease (e.g., meningitis). Complication: acute hyponatremia is associated with rapid administration of hypotonic IV fluids → cerebral edema, brain herniation, or central pontine myelinolysis.\n\nSIADH must be kept in mind when prescribing IV fluids. Sodium correction should not exceed 12 mmol/L/day to avoid central pontine myelinolysis (osmotic demyelination). Children are at particular risk due to their larger brain:skull ratio."
    difficulty: medium
    tags: [pediatrics, SIADH, hyponatremia, cerebral edema, IV fluids]
  - front: "What is the electrolyte content of gastric juice and its clinical significance in pediatric dehydration?"
    back: "Gastric juice: Na+ 60–80 mmol/L, K+ ~1 mmol/L, Cl- ~100 mmol/L, HCO3- 0 mmol/L. Prolonged vomiting of gastric contents (e.g., pyloric stenosis) leads to loss of HCl → hypokalemic, hypochloremic metabolic alkalosis.\n\nKnowing the electrolyte composition of various body fluids (gastric, pancreatic, bile, small/large bowel) is essential for predicting the metabolic consequence of fluid losses and guiding replacement therapy. Pancreatic juice is alkaline (HCO3- 40–100 mmol/L), so pancreatic fistulas cause metabolic acidosis."
    difficulty: medium
    tags: [pediatrics, electrolytes, gastric juice, metabolic alkalosis, pyloric stenosis]
