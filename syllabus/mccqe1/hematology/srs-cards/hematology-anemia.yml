# Hematology Anemia (Hematology) - generated from srs-mccqe1
cards:
  - front: "What is the clinical utility of RDW in distinguishing iron deficiency anemia from beta-thalassemia minor?"
    back: "In iron deficiency anemia, RDW is increased (cells of varying sizes). In beta-thalassemia minor, RDW is normal (cells are uniformly small, similar size) and RBC count is typically elevated.\n\nBoth conditions present with microcytic anemia, but RDW differentiates them. In iron deficiency, the progressive depletion of iron stores leads to increasingly smaller and more variable cells (high RDW). In beta-thalassemia minor, all RBCs are uniformly smaller than normal (normal RDW). The combination of microcytosis + normal/high RBC count + normal RDW suggests thalassemia."
    difficulty: medium
    tags: [hematology, RDW, iron-deficiency, thalassemia, microcytic-anemia, CBC]
  - front: "What is the definition of anemia in adult males and females?"
    back: "Adult males: Hb <130 g/L or Hct <38%. Adult females: Hb <120 g/L or Hct <37%.\n\nThese thresholds reflect a decrease in RBC mass detectable by laboratory measures. Hemoglobin thresholds differ by sex due to the influence of androgens on erythropoiesis. Values also change during pregnancy (trimester-specific). Anemia is a clinical finding, not a diagnosis — identifying the underlying cause (e.g., iron deficiency, chronic disease, hemolysis) is essential."
    difficulty: easy
    tags: [hematology, anemia, definition, hemoglobin, diagnosis]
  - front: "What are the key physical signs of anemia and at what hemoglobin levels do they appear?"
    back: "Pallor in mucous membranes/conjunctiva at Hb <90 g/L; ocular bruits at Hb <55 g/L; pallor in palmar skin creases at Hb <75 g/L. Other signs: tachycardia, orthostatic hypotension, systolic flow murmur, wide pulse pressure, angular cheilitis, koilonychia (nail spooning), glossitis.\n\nThe hemoglobin-specific thresholds for physical signs are high-yield for clinical examination questions. Pallor in the palmar creases (Hb <75 g/L) requires significant anemia. In hemolytic anemia, additional signs include jaundice, icterus, and splenomegaly. The systolic flow murmur is due to high cardiac output in compensation for decreased oxygen-carrying capacity."
    difficulty: medium
    tags: [hematology, anemia, physical-signs, clinical-features, hemoglobin]
  - front: "How does the reticulocyte count help classify anemia?"
    back: "Reticulocytosis (elevated reticulocyte count) in anemia suggests appropriate bone marrow response (e.g., hemolysis, blood loss). Normal or low reticulocyte count in anemia suggests decreased production (BM infiltration, nutritional deficiency, or other hypoproliferative cause).\n\nWith acute blood loss, reticulocytes should increase 2-3x initially, then 5-7x over subsequent days. The reticulocyte count must always be interpreted relative to Hb concentration. A normal absolute reticulocyte count in the context of significant anemia represents an inappropriately low response. The reticulocyte index (RI) corrects for anemia severity."
    difficulty: medium
    tags: [hematology, reticulocyte, anemia, classification, bone-marrow-response]
