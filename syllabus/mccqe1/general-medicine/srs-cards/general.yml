# General (General Medicine) - generated from srs-mccqe1
cards:
  - front: "How does the duration of action compare between naloxone and naltrexone?"
    back: "Naloxone is short-acting (t½ = 1 hour); naltrexone is longer-acting (t½ = 10 hours)\n\nThis significant difference in half-life affects clinical use—naloxone for acute overdose reversal, naltrexone for maintenance therapy."
    difficulty: easy
    tags: [naloxone, naltrexone, pharmacokinetics, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What is the clinical definition of chronic pain?"
    back: "Pain that persists or recurs for longer than 3 months, or pain of duration/intensity beyond normal tissue healing that adversely affects functioning\n\nChronic pain differs from acute pain in duration and often involves CNS changes like central sensitization."
    difficulty: easy
    tags: [chronic pain, pain classification, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What is the definition and primary predictor of chronic post-surgical pain?"
    back: "Pain developing after surgery persisting ≥2 months; primary predictor is history of chronic pain; other risk factors include female gender, surgical approach, poor social supports, catastrophizing\n\nUnderstanding risk factors allows identification of high-risk patients who may benefit from preventive analgesia strategies."
    difficulty: medium
    tags: [chronic pain, post-surgical pain, risk factors, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What were the key findings of the Cochrane review comparing PCA vs. non-patient controlled opioid analgesia?"
    back: "PCA had lower VAS pain scores over first 48 hours, higher patient satisfaction, higher opioid consumption, and higher incidence of pruritus—but not other adverse events\n\nThe review (49 studies, 1725 PCA vs 1687 control patients) found moderate-to-low quality evidence supporting PCA efficacy."
    difficulty: medium
    tags: [PCA, postoperative pain, Cochrane review, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What are the nociceptive pathways involved in labour pain at different stages?"
    back: "Early labour: cervical dilation and effacement stimulates visceral nerve fibers entering spinal cord at T10-L1; Late labour/delivery: distention of lower vagina and perineum causes somatic nociceptive impulses via pudendal nerve at S2-S4\n\nThis dual innervation explains why different analgesic techniques may be more effective at different stages of labour."
    difficulty: hard
    tags: [labour pain, nociceptive pathways, anatomy, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What does each component of the PQRSTU approach represent on an ECG?"
    back: "P wave = atrial contraction; P-R interval = conduction from SA to AV node; QRS complex = ventricular depolarization; ST segment = completion of ventricular depolarization; T wave = ventricular repolarization; U wave = repolarization of Purkinje fibers/myocardium\n\nThe PQRSTU approach organizes ECG interpretation by anatomical correlates of cardiac electrical activity."
    difficulty: easy
    tags: [ECG, basic cardiology, electrophysiology, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What are the normal characteristics of a P wave in leads II and V1?"
    back: "Lead II: rounded, <120 msec duration, <2.5 mm height; Lead V1: biphasic with positive then negative phase\n\nNormal P wave characteristics help identify atrial abnormalities and arrhythmias."
    difficulty: easy
    tags: [ECG, P wave, atrial activity, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What ECG findings characterize atrial flutter?"
    back: "Sawtooth P waves with continuous atrial activity at 300 bpm. Visualized best by flipping ECG upside-down and checking inferior leads (II, III, aVF)\n\nAtrial flutter creates a characteristic sawtooth pattern due to the atrial macroreentry circuit."
    difficulty: easy
    tags: [ECG, arrhythmia, atrial flutter, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What ECG finding indicates right atrial enlargement (RAE) and what is it called?"
    back: "Tall P wave (>2.5 mm) in lead II or V1; called P pulmonale\n\nRAE causes increased P wave amplitude due to delayed right atrial depolarization, often from pulmonary disease."
    difficulty: easy
    tags: [ECG, atrial enlargement, right heart, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What ECG findings indicate left atrial enlargement (LAE)?"
    back: "Biphasic P wave with negative deflection >1 mm deep or >1 mm wide in V1; wide (>100 msec) notched P wave in lead II\n\nLAE produces characteristic P wave changes reflecting prolonged left atrial conduction time."
    difficulty: medium
    tags: [ECG, atrial enlargement, left heart, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What is the normal P-R interval on ECG and what does it represent?"
    back: "Normal P-R interval is 120-200 msec, representing time from sinus node activation to start of ventricular depolarization (atrial conduction, AV node, bundle of His)\n\nThe P-R interval reflects conduction through the atria, AV node, and His-Purkinje system."
    difficulty: easy
    tags: [ECG, conduction, AV node, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What is dromotropy in the context of ECG interpretation?"
    back: "Dromotropy refers to conduction velocity through the AV node. Positive dromotropy = faster conduction (e.g., sympathetic stimulation); Negative dromotropy = slower conduction (e.g., vagal stimulation)\n\nUnderstanding dromotropy helps explain P-R interval changes with autonomic nervous system activity."
    difficulty: medium
    tags: [ECG, autonomic, conduction, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What ECG finding suggests pre-excitation syndrome and what causes it?"
    back: "Short P-R interval (<120 msec) with a delta wave (upsloping of the first part of the QRS complex); caused by accessory pathways (e.g., Bundle of Kent in WPW)\n\nPre-excitation allows electrical impulses to bypass the AV node, shortening the P-R interval."
    difficulty: medium
    tags: [ECG, WPW, accessory pathway, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What defines a pathological Q wave indicating myocardial necrosis?"
    back: "Q wave >40 msec duration OR >1/3 of total QRS amplitude\n\nPathological Q waves indicate prior or current myocardial infarction with tissue necrosis."
    difficulty: easy
    tags: [ECG, MI, Q wave, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What is the normal position of the ST segment on ECG?"
    back: "The ST segment should be at the same level as the baseline (T-P segment)\n\nDeviation of the ST segment from baseline is a key finding in ischemia and infarction."
    difficulty: easy
    tags: [ECG, ST segment, ischemia, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "In which leads is the T wave typically negative under normal conditions?"
    back: "Lead aVR and V1 normally have negative T waves; all other leads should be positive\n\nNormal T wave polarity follows repolarization patterns, with aVR being the main exception."
    difficulty: easy
    tags: [ECG, T wave, repolarization, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What is T wave alternans and what is its clinical significance?"
    back: "Beat-to-beat variations in T wave morphology, often due to PVC overlap (R on T phenomenon). Can precipitate VT or VFib\n\nT wave alternans is an electrical instability marker associated with sudden cardiac death risk."
    difficulty: hard
    tags: [ECG, arrhythmia, sudden death, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What are normal QTc values and how is QTc calculated?"
    back: "Normal QTc: males 360-450 msec, females 360-460 msec. QTc = QT / √(RR) using Bazett's formula (NOTE: inaccurate at rapid rates >100 bpm)\n\nQTc corrects the QT interval for heart rate, allowing comparison across different rates."
    difficulty: easy
    tags: [ECG, QT interval, arrhythmia risk, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What is the proposed origin of the U wave on ECG?"
    back: "Repolarization of Purkinje fibers OR delayed/prolonged repolarization of the myocardium\n\nThe exact origin of U waves remains debated but may represent late repolarization events."
    difficulty: medium
    tags: [ECG, U wave, electrophysiology, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "Where do you measure ST changes relative to the J point?"
    back: "ST changes are measured starting at 60 msec from the J point (junction between QRS complex and ST segment)\n\nStandardized measurement from the J point ensures consistent interpretation of ST changes."
    difficulty: medium
    tags: [ECG, ST segment, measurement, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "What ECG findings suggest low atrial rhythm?"
    back: "Short P-R interval (<120 msec) with inverted P waves in leads II, III, and aVF\n\nLow atrial rhythm originates near the AV node, causing retrograde atrial activation."
    difficulty: medium
    tags: [ECG, arrhythmia, atrial rhythm, toronto-notes, pages-0101-0102-0103-0104-0105-0106-0107-0108-0109-0110]
  - front: "How does volume overload (e.g., aortic insufficiency) lead to cardiac remodeling?"
    back: "Volume overload causes ventricular dilatation (eccentric remodeling)\n\nIncreased preload stretches the myocardium, leading to chamber enlargement while maintaining cardiac output initially."
    difficulty: medium
    tags: [heart failure, pathophysiology, cardiac remodeling, toronto-notes, pages-0131-0132-0133-0134-0135-0136-0137-0138-0139-0140]
  - front: "What is pulsus alternans and what does it indicate?"
    back: "Alternating strong and weak pulses with regular rhythm; indicates severe left ventricular dysfunction\n\nPulsus alternans reflects beat-to-beat variation in stroke volume due to impaired myocardial contractility in advanced heart failure."
    difficulty: medium
    tags: [heart failure, clinical findings, physical exam, toronto-notes, pages-0131-0132-0133-0134-0135-0136-0137-0138-0139-0140]
  - front: "What is Kussmaul's sign and what does it indicate?"
    back: "JVP rises with inspiration instead of falling; indicates right ventricular failure or constrictive pericarditis\n\nNormally JVP falls with inspiration due to increased venous return to the right heart; failure of this response suggests RV dysfunction."
    difficulty: medium
    tags: [heart failure, clinical findings, physical exam, toronto-notes, pages-0131-0132-0133-0134-0135-0136-0137-0138-0139-0140]
  - front: "What were the key findings of the LEADER trial regarding liraglutide in cardiovascular outcomes?"
    back: "Liraglutide reduced major adverse cardiovascular events in T2DM patients regardless of HF history (HR:0.89 with HF; HR:0.83 without HF; P=0.63); no increased HF hospitalization risk\n\nThe LEADER trial demonstrated cardiovascular benefit of liraglutide in high-risk diabetic patients, with consistent effects regardless of baseline heart failure status."
    difficulty: hard
    tags: [LEADER trial, liraglutide, GLP-1 agonist, cardiovascular outcomes, toronto-notes, pages-0131-0132-0133-0134-0135-0136-0137-0138-0139-0140]
  - front: "What is pulsus alternans?"
    back: "Alternating strong and weak pulses with regular rhythm, indicating severe left ventricular dysfunction\n\nPulsus alternans reflects beat-to-beat variation in stroke volume due to impaired ventricular contractility and is a sign of advanced systolic heart failure."
    difficulty: easy
    tags: [heart failure, physical exam, pulsus alternans, toronto-notes, pages-0131-0132-0133-0134-0135-0136-0137-0138-0139-0140]
  - front: "What is the median survival after cardiac transplantation and how does it differ for 1-year survivors?"
    back: "Median survival is 12.5 years overall, extending to 14.8 years among 1-year survivors\n\nLong-term survival data shows most deaths occur early; those surviving the first year have significantly better long-term outcomes."
    difficulty: easy
    tags: [cardiac-transplantation, prognosis, outcomes, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the gold standard for detecting cardiac transplant rejection?"
    back: "Endomyocardial biopsy\n\nEndomyocardial biopsy allows direct histological examination of myocardial tissue to identify rejection episodes."
    difficulty: easy
    tags: [cardiac-transplantation, rejection, diagnosis, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the most common cause of LATE death following cardiac transplantation?"
    back: "Allograft vasculopathy - approximately 50% develop graft vasculopathy within 10 years\n\nProgressive coronary artery disease in the donor heart develops due to chronic immune-mediated injury and is a major long-term concern."
    difficulty: easy
    tags: [cardiac-transplantation, allograft-vasculopathy, late-complications, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What malignancy is most commonly associated with cardiac transplant immunosuppression?"
    back: "Cutaneous neoplasms (most common), followed by non-Hodgkin lymphoma and lung cancer; overall 15% develop malignancy\n\nChronic immunosuppression increases risk of skin cancers and lymphoproliferative disorders."
    difficulty: easy
    tags: [cardiac-transplantation, malignancy, immunosuppression, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What are the three main indications for ventricular assist devices (VAD)?"
    back: "Bridge to transplantation, bridge to decision (for transplant evaluation), or long-term permanent therapy ('destination therapy')\n\nVADs provide mechanical circulatory support across different clinical scenarios in advanced heart failure."
    difficulty: easy
    tags: [VAD, mechanical-circulatory-support, heart-failure, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "How does an intra-aortic balloon pump (IABP) work mechanically?"
    back: "IABP is catheter-based inserted via femoral artery to descending aorta. The balloon inflates during diastole to increase ascending aorta and coronary artery blood flow, thereby decreasing afterload and myocardial O2 demand\n\nCounterpulsation is the fundamental mechanism - diastolic inflation augments coronary perfusion while reducing systolic afterload."
    difficulty: medium
    tags: [IABP, mechanical-support, physiology, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "Which Canadian guidelines address fitness to drive after LVAD implantation?"
    back: "Canadian Cardiovascular Society Focused Position Statement Update on Assessment of the Cardiac Patient for Fitness to Drive (Can J Cardiol 2012;28:137-140) - patients with continuous-flow LVAD who are stable 2 months post-implantation qualify for private passenger vehicle driving\n\nLVAD patients can typically resume private driving after demonstrating clinical stability, though commercial driving requires additional assessment."
    difficulty: medium
    tags: [LVAD, driving, guidelines, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What are the selection criteria recommendations from the Canadian Cardiovascular Society/Canadian Cardiac Transplant Network 2020 position statement?"
    back: "Cardiac transplantation recommended for HF patients <70 years; frailty assessment with validated tool recommended for all candidates; LVAD implantation recommended for eligible patients with pulmonary HTN on right heart catheterization; NOT recommended for non-adherent patients, those with alcohol/illicit drug use, mental illness affecting compliance\n\nThe 2020 statement provides updated Canadian-specific guidance emphasizing frailty assessment and strict adherence requirements."
    difficulty: medium
    tags: [cardiac-transplantation, selection-criteria, Canadian-guidelines, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What are the components of a typical VAD circuit?"
    back: "A pump (implantable), an outflow graft, and a driveline to connect to an external power source and controller\n\nVAD systems require both implanted and external components to deliver mechanical circulatory support."
    difficulty: easy
    tags: [VAD, mechanical-circulatory-support, device-components, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "When is postoperative mechanical VAD support indicated?"
    back: "When unable to separate from cardiopulmonary bypass (CPB) despite inotropic and IABP support\n\nPost-cardiotomy shock requiring escalating mechanical support represents an important bridge-to-recovery indication for VAD therapy."
    difficulty: medium
    tags: [VAD, post-cardiotomy, mechanical-support, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the typical configuration of VAD support for left, right, or biventricular failure?"
    back: "LVAD for left ventricular support, RVAD for right ventricular support, or BiVAD for biventricular support\n\nDifferent configurations address failure of specific cardiac chambers, with biventricular support reserved for the most severe cases."
    difficulty: easy
    tags: [VAD, LVAD, RVAD, BiVAD, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the median survival after cardiac transplantation and how does it change for 1-year survivors?"
    back: "Median survival is 12.5 years, extending to 14.8 years among 1-year survivors\n\nLong-term survival data from cardiac transplant recipients shows that surviving the first year significantly improves prognosis, with median survival approaching 15 years."
    difficulty: easy
    tags: [cardiac-transplant, prognosis, outcomes, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the gold standard test to detect cardiac transplant rejection?"
    back: "Endomyocardial biopsy\n\nSerial endomyocardial biopsies allow direct histological assessment of rejection, typically graded using the ISHLT classification system."
    difficulty: easy
    tags: [cardiac-transplant, rejection, diagnosis, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "When is the risk of acute rejection greatest after cardiac transplantation?"
    back: "During the first 3 months after transplant\n\nThe initial post-transplant period has the highest rejection risk before immunosuppression achieves adequate therapeutic levels and tolerance develops."
    difficulty: easy
    tags: [cardiac-transplant, rejection, timeline, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What percentage of cardiac transplant recipients develop graft vasculopathy within 10 years?"
    back: "Approximately 50%\n\nAllograft vasculopathy is a form of accelerated atherosclerosis that affects coronary arteries in the transplanted heart, representing chronic rejection."
    difficulty: easy
    tags: [cardiac-transplant, allograft-vasculopathy, chronic-rejection, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What malignancy is most common in cardiac transplant recipients and why?"
    back: "Cutaneous neoplasms (most common), followed by non-Hodgkin lymphoma and lung cancer, due to immunosuppressive medication\n\nChronic immunosuppression impairs immune surveillance against malignant cells, particularly affecting skin and lymphoid tissue."
    difficulty: easy
    tags: [cardiac-transplant, malignancy, immunosuppression, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "Why does a transplanted heart not respond to anticholinergics like atropine?"
    back: "The donor heart is completely denervated and does not receive parasympathetic vagal stimulation or intrinsic postganglionic sympathetic stimulation\n\nDenervation occurs during organ harvest and reinnervation does not reliably occur, so the heart rate is controlled solely by circulating catecholamines."
    difficulty: medium
    tags: [cardiac-transplant, cardiac-denervation, autonomic-nervous-system, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "How does an intra-aortic balloon pump (IABP) decrease myocardial oxygen demand?"
    back: "The balloon inflates during diastole to increase ascending aorta and coronary artery pressure, then deflates during systole to decrease afterload\n\nCounterpulsation reduces left ventricular workload by decreasing systolic pressure while enhancing coronary perfusion during diastole."
    difficulty: medium
    tags: [IABP, mechanical-circulatory-support, hemodynamics, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What percentage of patients were discharged with the device in-place comparing continuous-flow vs pulsatile-flow LVAD?"
    back: "86% of continuous-flow patients and 6% of pulsatile-flow patients\n\nThe dramatic difference in discharge rates reflects the superior durability and lower complication profile of continuous-flow devices."
    difficulty: medium
    tags: [LVAD, continuous-flow, outcomes, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the second most common cause of late death following cardiac transplantation?"
    back: "Malignancy\n\nPost-transplant lymphoproliferative disorder and solid tumors develop due to impaired immune surveillance from chronic immunosuppression."
    difficulty: easy
    tags: [cardiac-transplant, malignancy, mortality, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What percentage of cardiac transplant recipients develop malignancy due to immunosuppressive medication?"
    back: "15%\n\nRegular skin examinations and cancer screening are essential components of long-term post-transplant care."
    difficulty: easy
    tags: [cardiac-transplant, malignancy, immunosuppression, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the recommended age cutoff for cardiac transplant consideration and what frailty assessment is recommended?"
    back: "Consideration for patients <70 years; all patients being considered should have frailty assessed with a validated tool\n\nFrailty assessment helps identify patients who may not tolerate the physiological stress of transplant surgery and immunosuppression."
    difficulty: medium
    tags: [cardiac-transplant, patient-selection, frailty, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the median survival after cardiac transplantation and how does it extend for 1-year survivors?"
    back: "Median survival is 12.5 years, extending to 14.8 years among 1-year survivors\n\nLong-term outcomes after cardiac transplantation are favorable for patients who survive the first year, with significantly improved survival rates compared to those who don't reach the 1-year mark."
    difficulty: easy
    tags: [cardiac-transplantation, survival-outcomes, heart-failure, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What are the three functions of ventricular assist devices (VADs)?"
    back: "Bridge to transplantation, bridge to decision (for transplant evaluation), or destination therapy (long-term permanent support)\n\nVADs provide mechanical circulatory support for different clinical scenarios, from temporary support while awaiting transplant to permanent support in patients ineligible for transplantation."
    difficulty: easy
    tags: [VAD, mechanical-circulatory-support, heart-failure, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "How does an intra-aortic balloon pump (IABP) work to decrease afterload?"
    back: "Inflation of the balloon occurs during diastole to increase ascending aorta and coronary artery blood flow, which decreases afterload, reduces myocardial O2 demand, and increases coronary perfusion\n\nCounterpulsation with IABP is the most common temporary mechanical circulatory support, providing hemodynamic benefits through diastolic augmentation."
    difficulty: medium
    tags: [IABP, hemodynamics, afterload-reduction, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "Can LVAD-supported patients with stable NYHA class achieve fitness to drive?"
    back: "Stable patients 2 months post-LVAD implantation may qualify for private driving; commercial driving is generally not recommended\n\nCanadian Cardiovascular Society guidelines address driving restrictions for LVAD patients, balancing patient independence with road safety concerns."
    difficulty: easy
    tags: [LVAD, driving, patient-counseling, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the recommended evaluation for frailty in patients being considered for cardiac transplantation or LVAD?"
    back: "Assessment of frailty with a validated tool is recommended for all patients being considered for cardiac transplantation\n\nFrailty assessment helps identify patients at higher risk for poor outcomes and guides shared decision-making regarding transplant or mechanical circulatory support."
    difficulty: easy
    tags: [cardiac-transplantation, frailty, patient-evaluation, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What are the nephrotoxic effects of common post-transplant immunosuppressive medications?"
    back: "Immunosuppressives such as prednisone, cyclosporine, and tacrolimus may have nephrotoxic effects\n\nCalcineurin inhibitors (cyclosporine and tacrolimus) are cornerstone immunosuppressants but carry significant nephrotoxic risk, potentially causing chronic kidney disease."
    difficulty: medium
    tags: [immunosuppression, nephrotoxicity, medication-side-effects, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the Ross Procedure, and what are its long-term outcomes?"
    back: "The Ross Procedure involves replacing a diseased aortic valve with the patient's own pulmonary valve (autograft). Long-term outcomes show favorable results, though reoperation may be needed on the pulmonary homograft."
    difficulty: hard
    tags: [cardiac-surgery, valve-disease, aortic-valve, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What are the treatment options for a failed pulmonary homograft in Ross patients?"
    back: "Transcatheter versus surgical valve replacement for a failed pulmonary homograft"
    difficulty: hard
    tags: [cardiac-surgery, valve-replacement, Ross-procedure, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What organization published the 2015 guidelines for the diagnosis and management of pericardial diseases?"
    back: "European Society of Cardiology (ESC)\n\nThe 2015 ESC Guidelines addressed pericardial diseases and were endorsed by the European Association for Cardio-Thoracic Surgery (EACTS)."
    difficulty: easy
    tags: [pericardial disease, guidelines, ESC, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What is the classification for cardiac conduction system anatomy?"
    back: "SA node, AV node, bundle of His, bundle branches, and Purkinje fibers\n\nAnderson et al. described the anatomy of the cardiac conduction system including the sinoatrial node, atrioventricular node, and distal conduction pathways."
    difficulty: easy
    tags: [cardiac conduction, electrophysiology, anatomy, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What is the management approach for transcatheter vs surgical valve replacement for failed pulmonary homograft in Ross patients?"
    back: "Transcatheter valve-in-valve approach is an alternative to surgical re-replacement\n\nMassas et al. compared transcatheter versus surgical valve replacement for failed pulmonary homografts in the Ross population."
    difficulty: medium
    tags: [valve replacement, transcatheter, Ross procedure, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What diagnostic modalities are covered under the 2011 ACCF/AHA Appropriate Use Criteria for Echocardiography?"
    back: "Transthoracic, transesophageal, and stress echocardiography\n\nThe 2011 Appropriate Use Criteria document provides guidance on when echocardiography should be used based on clinical scenarios."
    difficulty: easy
    tags: [echocardiography, appropriate use criteria, diagnosis, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "Define drug efficacy and how it is measured."
    back: "The relative ability of a drug to produce a maximal response; measured by Emax (the maximal response a drug can elicit).\n\nEfficacy represents the ceiling effect of a drug—the maximum biological or biochemical effect achievable under ideal conditions."
    difficulty: easy
    tags: [pharmacodynamics, efficacy, Emax, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "Define drug potency and how it is measured."
    back: "The concentration of drug needed to produce 50% of Emax; measured by EC50 (or ED50 if dose is used). A drug with a lower EC50 is more potent.\n\nPotency is distinct from efficacy—a drug may be more potent but less efficacious depending on where their dose-response curves plateau."
    difficulty: easy
    tags: [pharmacodynamics, potency, EC50, dose-response, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the difference between affinity and efficacy for agonists?"
    back: "Affinity is the ability of the agonist to bind to the receptor; efficacy is the ability to elicit a response once bound.\n\nA drug like salbutamol has greater affinity for β2-receptors than β1-receptors, allowing preferential binding, but its efficacy depends on the downstream signal it produces."
    difficulty: medium
    tags: [pharmacodynamics, agonists, affinity, efficacy, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "How does competitive (reversible) antagonism differ from non-competitive antagonism?"
    back: "Competitive antagonism: antagonist binds to the active site, increasing agonist concentration can overcome the blockade (e.g., naloxone vs. morphine). Non-competitive antagonism: antagonist binds to an allosteric site, producing effects that reduce agonist binding; cannot be overcome by increasing agonist concentration.\n\nReversible competitive antagonists bind non-covalently, allowing competitive displacement, while non-competitive antagonists cause insurmountable blockade through allosteric mechanisms."
    difficulty: hard
    tags: [pharmacodynamics, antagonists, receptor-theory, competitive, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What clinical scenario would prompt use of therapeutic drug monitoring (TDM)?"
    back: "TDM is most useful when steady-state concentration has been reached, for drugs with narrow therapeutic indices, and particularly for drugs with non-linear kinetics (e.g., phenytoin, theophylline) where drug-specific nomograms are required.\n\nTDM helps optimize dosing for drugs where the relationship between dose and concentration is complex or where small concentration changes cause significant clinical effects."
    difficulty: medium
    tags: [pharmacokinetics, TDM, therapeutic-monitoring, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "A drug with EC50 of 2mg is compared to a drug with EC50 of 5mg. Which is more potent and why?"
    back: "The drug with EC50 of 2mg is more potent because it requires a lower concentration to produce 50% of its maximal effect.\n\nLower EC50 indicates higher potency—a drug reaches its half-maximal effect at a lower concentration, though this does not necessarily mean greater efficacy (Emax)."
    difficulty: easy
    tags: [pharmacodynamics, potency, EC50, dose-response, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the difference between efficacy and potency?"
    back: "Efficacy is the ability of a drug to produce a maximal biological response (measured by Emax). Potency is the concentration of drug needed to produce 50% of Emax (measured by EC50/ED50). A drug with lower EC50 is more potent.\n\nDrug A with EC50 lower than Drug B means A is more potent. However, potency and efficacy are independent properties — a drug can be highly potent but have lower efficacy than a less potent drug."
    difficulty: medium
    tags: [pharmacodynamics, efficacy, potency, dose-response, EC50, Emax, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is competitive antagonism and how does it differ from non-competitive antagonism?"
    back: "Competitive antagonists bind to the active site on a receptor, preventing agonist binding without activating the receptor. In reversible competitive antagonism, increased agonist concentration can overcome the antagonist (e.g., naloxone vs. morphine). Non-competitive antagonists bind to an allosteric site distinct from the active site and reduce agonist binding through allosteric effects.\n\nReversible competitive antagonism produces parallel rightward shifts of the dose-response curve that can be overcome with increasing agonist concentration, while non-competitive antagonism produces a decrease in maximal effect."
    difficulty: hard
    tags: [pharmacodynamics, antagonists, receptor-theory, competitive-antagonism, non-competitive-antagonism, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the graded dose-response relationship?"
    back: "The graded dose-response relationship relates the dose (or concentration) of a drug to the intensity of the effect it produces in an individual, typically plotted as log(dose) vs. response on a sigmoidal curve.\n\nFrom this curve, key parameters are derived including ED50 (dose producing 50% of maximal effect), EC50 (concentration producing 50% of Emax), and Emax (maximal achievable effect)."
    difficulty: easy
    tags: [pharmacodynamics, dose-response, graded-response, Emax, EC50, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "Which drugs commonly exhibit zero-order kinetics in the therapeutic range and are targets for therapeutic drug monitoring?"
    back: "Phenytoin, theophylline, and aspirin (at high doses) exhibit zero-order kinetics and are common targets for therapeutic drug monitoring (TDM). Drug-specific nomograms exist to guide dosing.\n\nThe complexity of dosing drugs with non-linear kinetics — where small dose changes can produce disproportionate changes in concentration — has led to the creation of specialized clinical nomograms for drugs like phenytoin and theophylline."
    difficulty: medium
    tags: [clinical-pharmacology, zero-order-kinetics, TDM, phenytoin, theophylline, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the difference between drug efficacy and drug effectiveness?"
    back: "Drug efficacy is the ability of a drug to produce a maximal response under ideal/controlled conditions. Drug effectiveness is a better measure of how the drug works in real-world clinical situations, accounting for factors like patient adherence, variable absorption, and disease state.\n\nHigh efficacy in clinical trials does not always translate to high effectiveness in practice. Effectiveness incorporates practical real-world factors that may limit the drug's performance compared to its theoretical maximum."
    difficulty: easy
    tags: [pharmacodynamics, efficacy, effectiveness, drug-performance, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What drugs exhibit zero-order (non-linear) kinetics at therapeutic concentrations?"
    back: "Alcohol, phenytoin, and aspirin (more commonly associated with overdose)\n\nIn zero-order kinetics, a constant amount of drug is eliminated per unit time regardless of concentration, and the half-life concept does not apply."
    difficulty: medium
    tags: [pharmacokinetics, zero-order kinetics, non-linear kinetics, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "Why does phenytoin follow non-linear kinetics?"
    back: "Saturation of various ADME processes creates non-linear kinetics, with first-order at lower concentrations and zero-order at higher concentrations after saturation\n\nThis complexity has led to drug-specific nomograms for dosing, and phenytoin is a common target for therapeutic drug monitoring."
    difficulty: hard
    tags: [pharmacokinetics, phenytoin, non-linear kinetics, saturation, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "How many half-lives are required to achieve steady-state levels?"
    back: "Approximately 4-5 half-lives\n\nThis is a fundamental principle for predicting when therapeutic drug concentrations will be reached."
    difficulty: easy
    tags: [pharmacokinetics, steady-state, half-life, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is EC50 and what does it measure?"
    back: "EC50 is the concentration of a drug needed to produce 50% of its maximal effect (Emax); it measures drug potency\n\nA drug with a lower EC50 is more potent, as it achieves 50% of maximal effect at a lower concentration."
    difficulty: easy
    tags: [pharmacodynamics, potency, EC50, dose-response, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is competitive antagonism and how can it be overcome?"
    back: "Antagonist binds directly to the active site on the receptor (zero efficacy) and prevents agonist binding; reversible competitive antagonists can be overcome by increasing agonist concentration\n\nExample: naloxone is a reversible competitive antagonist to morphine/heroin at opioid receptors."
    difficulty: medium
    tags: [pharmacodynamics, competitive antagonism, antagonists, naloxone, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the difference between reversible and irreversible competitive antagonists?"
    back: "Reversible antagonists bind non-covalently and can be displaced by increased agonist; irreversible antagonists form covalent bonds and cannot be displaced\n\nIrreversible antagonists permanently block receptors, so no amount of agonist can overcome the blockade."
    difficulty: medium
    tags: [pharmacodynamics, competitive antagonism, reversible, irreversible, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is non-competitive antagonism?"
    back: "Antagonist (negative allosteric modulator) binds to an alternate site distinct from the active site, producing allosteric effects that reduce agonist binding\n\nExample: phenoxybenzamine forms a covalent bond with adrenergic receptors, preventing adrenaline and norepinephrine from binding."
    difficulty: hard
    tags: [pharmacodynamics, non-competitive antagonism, allosteric modulation, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the mechanism of naloxone?"
    back: "Naloxone is a reversible competitive antagonist at opioid receptors (μ, κ, δ), displacing morphine and heroin from binding sites\n\nUsed clinically to reverse opioid overdose, naloxone's competitive nature means higher doses may be needed with potent opioids."
    difficulty: medium
    tags: [pharmacodynamics, naloxone, opioid, competitive antagonist, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "Why are drugs with non-linear kinetics often targeted for therapeutic drug monitoring (TDM)?"
    back: "The complexity of dosing drugs with non-linear kinetics requires drug-specific nomograms; small dose increases can cause disproportionate changes in plasma concentration\n\nExamples include phenytoin and theophylline, where linear dosing assumptions lead to toxicity."
    difficulty: hard
    tags: [therapeutic drug monitoring, non-linear kinetics, phenytoin, clinical pharmacology, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the difference between ED50 and EC50?"
    back: "ED50 uses dose to measure potency (dose required for 50% of maximal effect); EC50 uses concentration (concentration required for 50% of Emax)\n\nBoth measure potency but in different units—ED50 in dose (mg/kg) and EC50 in concentration (M or μg/mL)."
    difficulty: medium
    tags: [pharmacodynamics, ED50, EC50, potency, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "Which drugs follow zero-order (non-linear) kinetics in the therapeutic range?"
    back: "Alcohol, phenytoin, and aspirin follow zero-order kinetics in the therapeutic range. Zero-order kinetics is more commonly associated with overdose.\n\nIn zero-order kinetics, a constant amount of drug is eliminated per unit time regardless of concentration. The concept of half-life does not apply."
    difficulty: easy
    tags: [pharmacokinetics, zero-order-kinetics, non-linear, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the key difference between reversible and irreversible competitive antagonists?"
    back: "Reversible competitive antagonists bind non-covalently to the receptor active site, so increasing concentrations of agonist can overcome the antagonist (e.g., naloxone vs. morphine). Irreversible competitive antagonists form a covalent bond with the receptor and cannot be displaced.\n\nThe reversibility of antagonism has important clinical implications - reversible antagonists can be overcome by dose escalation, while irreversible antagonists permanently block the receptor."
    difficulty: medium
    tags: [pharmacodynamics, antagonists, competitive-antagonism, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is therapeutic drug monitoring (TDM) and when is it most useful?"
    back: "TDM is most useful when steady-state concentration has been reached. It is particularly important for drugs with non-linear kinetics (e.g., phenytoin, theophylline) where drug-specific nomograms are used to aid clinicians in dosing.\n\nDrugs with narrow therapeutic indices or non-linear kinetics are common targets for TDM because small dose changes can lead to disproportionate changes in plasma concentration."
    difficulty: easy
    tags: [pharmacokinetics, therapeutic-drug-monitoring, clinical-pharmacology, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What are the three main classification levels used in clinical practice guidelines?"
    back: "Class I (benefit >>> risk, recommended), Class IIa (benefit >> risk, reasonable), Class IIb (benefit ≥ risk, may be considered)\n\nThese classification levels help clinicians understand the strength of recommendation and evidence quality supporting each guideline statement."
    difficulty: easy
    tags: [guidelines, evidence-based medicine, clinical practice, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What conditions does the 2015 ESC pericardial diseases guideline cover?"
    back: "Acute and chronic pericarditis, pericardial effusion, constrictive pericarditis, and pericardial tamponade\n\nPericardial disease guidelines address diagnostic criteria and treatment algorithms for both inflammatory and effusive conditions."
    difficulty: easy
    tags: [pericardial disease, pericarditis, ESC guidelines, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What drugs follow zero-order (non-linear) kinetics in the therapeutic range?"
    back: "Alcohol, phenytoin, and aspirin follow zero-order kinetics at therapeutic concentrations\n\nZero-order kinetics means a constant amount (not proportion) is eliminated per unit time regardless of concentration. These drugs often require therapeutic drug monitoring and have specific dosing nomograms."
    difficulty: easy
    tags: [pharmacokinetics, zero-order-kinetics, TDM, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "How many half-lives are required to reach steady-state?"
    back: "Approximately 4-5 half-lives\n\nThis is why steady-state is achieved gradually with repeated dosing, which is clinically important for timing of therapeutic drug monitoring."
    difficulty: easy
    tags: [pharmacokinetics, steady-state, half-life, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "Define potency and how is it measured?"
    back: "The concentration of drug needed to produce 50% of Emax; measured by EC50 (or ED50 if dose is used)\n\nA drug with lower EC50 is more potent, meaning it achieves therapeutic effect at a lower concentration."
    difficulty: easy
    tags: [pharmacodynamics, potency, EC50, dose-response, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "How do reversible vs irreversible competitive antagonists differ?"
    back: "Reversible antagonists bind non-covalently and can be displaced by increased agonist; irreversible antagonists form covalent bonds and permanently block the receptor\n\nReversible competitive antagonists show parallel rightward shifts of dose-response curves that can be overcome with higher agonist concentrations."
    difficulty: medium
    tags: [pharmacodynamics, antagonists, receptor-binding, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the best time to measure drug concentrations for therapeutic drug monitoring?"
    back: "When steady-state concentration has been reached (after 4-5 half-lives)\n\nMeasuring before steady-state provides unreliable data for dose adjustment, as concentrations are still rising toward the therapeutic range."
    difficulty: easy
    tags: [therapeutic-drug-monitoring, pharmacokinetics, clinical-pharmacology, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is Nikolsky's sign and what condition is it associated with?"
    back: "Epidermal detachment with shear stress. Positive in Pemphigus Vulgaris due to loss of intercellular adhesion from anti-desmoglein antibodies.\n\nNikolsky's sign reflects the intraepidermal acantholysis seen in pemphigus, where antibodies disrupt desmosomal connections between keratinocytes."
    difficulty: easy
    tags: [pemphigus-vulgaris, clinical-signs, autoimmune, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the 4 criteria for diagnosing a drug reaction (Naranjo scale)?"
    back: "1) Temporal relationship between drug exposure and reaction, 2) Recognized response to suspected drug, 3) Improvement after drug withdrawal, 4) Recurrence of reaction on re-challenge. All 4 = definite; #1-3 = probable; only #1 = possible.\n\nThe Naranjo algorithm provides a standardized method to assess causality in adverse drug reactions, with re-challenge being the most definitive but rarely performed."
    difficulty: medium
    tags: [drug-reactions, diagnosis, naranjo-scale, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the mortality rate of untreated severe DRESS syndrome?"
    back: "10% mortality if severe, undiagnosed, and untreated.\n\nThe systemic involvement, particularly hepatitis and organ damage, makes DRESS a potentially life-threatening condition requiring prompt recognition and treatment."
    difficulty: easy
    tags: [DRESS, prognosis, mortality, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What complication can occur if the offending drug is not discontinued in DRESS?"
    back: "Progression to generalized exfoliative dermatitis or erythroderma.\n\nContinued drug exposure triggers escalating immune activation, leading to widespread epidermal inflammation and shedding."
    difficulty: easy
    tags: [DRESS, complications, erythroderma, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What neurological association exists with Bullous Pemphigoid?"
    back: "One or more neurologic disorders are present in 22-46% of cases of bullous pemphigoid.\n\nThe shared basement membrane antigens between skin and brain may explain this association, suggesting a possible common autoimmune pathogenesis."
    difficulty: easy
    tags: [bullous-pemphigoid, neurological-associations, comorbidities, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the difference between Pemphigus Vulgaris and Pemphigus Foliaceus?"
    back: "Pemphigus Foliaceus is more superficial, caused by antibodies against desmoglein-1 only, appears as crusted patches/erosions rather than flaccid bullae, and can be managed with topical steroids in localized disease.\n\nThe more superficial split in pemphigus foliaceus means blistering is less clinically apparent, and the disease tends to be less severe than pemphigus vulgaris."
    difficulty: medium
    tags: [pemphigus-foliaceus, pemphigus-vulgaris, differential-diagnosis, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the age range and gender distribution for Bullous Pemphigoid?"
    back: "Mean age of onset: 60-80 years. Female equals male (F=M).\n\nBullous pemphigoid predominantly affects elderly patients, reflecting the age-related changes in immune regulation."
    difficulty: easy
    tags: [bullous-pemphigoid, epidemiology, demographics, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the prognosis of Bullous Pemphigoid and Pemphigus Vulgaris?"
    back: "Pemphigoid: heals without scarring, usually chronic, rarely fatal. Pemphigus Vulgaris: heals with hyperpigmentation but no scarring, may be fatal unless treated with immunosuppression.\n\nThe fundamentally different depths of blistering and immune mechanisms result in markedly different outcomes between these two conditions."
    difficulty: easy
    tags: [pemphigus-vulgaris, bullous-pemphigoid, prognosis, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What common sites are affected in Bullous Pemphigoid?"
    back: "Flexor aspect of forearms, axillae, medial thighs, groin, abdomen, and mouth (in approximately 33% of cases).\n\nThe distribution reflects areas of friction and skin movement, though any body surface may be involved in extensive disease."
    difficulty: easy
    tags: [bullous-pemphigoid, clinical-features, distribution, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What investigations are done for Pemphigus Vulgaris?"
    back: "Immunofluorescence showing intraepidermal IgG and C3 deposition. Circulating serum anti-desmoglein IgG antibodies (usually anti-desmoglein-3 first, then anti-desmoglein-1).\n\nThese serological and histological tests confirm the diagnosis and help differentiate from other blistering disorders."
    difficulty: medium
    tags: [pemphigus-vulgaris, diagnosis, immunofluorescence, antibodies, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the time course of drug-induced urticaria?"
    back: "Hours to days after exposure depending on the mechanism (IgE-mediated reactions occur faster than immune complex-mediated).\n\nThe timing helps distinguish urticaria types and may indicate whether the mechanism is immediate hypersensitivity or serum sickness-like."
    difficulty: easy
    tags: [drug-urticaria, time-course, hypersensitivity, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the first-line treatment for scabies?"
    back: "Permethrin 5% cream applied from neck down to soles of feet, left on for 8-14 hours; requires second treatment 7 days after first\n\nPermethrin is a topical insecticide that kills scabies mites and eggs. The second treatment 7 days later ensures杀灭 newly hatched eggs from eggs that survived the first application."
    difficulty: easy
    tags: [scabies, treatment, management, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the first-line treatment for head lice?"
    back: "Permethrin 1% cream rinse (ovicidal); repeat treatment 7 days after first treatment; comb with fine-toothed comb using dilute vinegar solution to remove nits\n\nPermethrin kills live lice but not all eggs, which is why a second treatment after the eggs have hatched is essential for complete eradication."
    difficulty: easy
    tags: [lice, treatment, management, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What causes bed bug bites, and when do they typically feed?"
    back: "Cimex lectularius feeds mainly at night and hides in crevices in walls and furniture during the day\n\nBed bugs are nocturnal parasites that emerge at night to feed on sleeping hosts, then retreat to hiding spots in the bedroom environment during daylight hours."
    difficulty: easy
    tags: [bed bugs, etiology, parasitic infection, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the treatment for recurrent genital herpes?"
    back: "Daily suppressive therapy (acyclovir 400 mg PO BID) or episodic therapy (acyclovir 800 mg PO TID for 5 days or 2 days)\n\nSuppressive therapy reduces frequency and transmission risk; episodic therapy started within 24 hours of prodrome reduces duration of outbreaks."
    difficulty: medium
    tags: [HSV, treatment, genital herpes, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the treatment dosing for primary oral herpes?"
    back: "Acyclovir 400 mg PO 5 times daily for 5 days\n\nThe higher frequency of dosing (5x daily) is needed to maintain adequate drug levels against HSV replication in primary infections which are typically more severe."
    difficulty: easy
    tags: [HSV, treatment, oral herpes, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the treatment options for genital herpes?"
    back: "First episode: acyclovir 400mg PO TID for 7-10 days. Recurrent: suppressive therapy (acyclovir 400mg PO BID) or episodic therapy (acyclovir 800mg PO TID for 5 days or BID for 2 days). Famciclovir and valacyclovir are alternatives with better bioavailability.\n\nThe frequency of recurrences determines whether suppressive or episodic therapy is preferred. Daily suppression reduces transmission risk and is preferred for frequent recurrences (≥6/year)."
    difficulty: medium
    tags: [hsv, genital-herpes, treatment, antiviral, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the clinical features of pubic lice (Phthirus pubis) infestation?"
    back: "Nits (louse eggs) attached to pubic hairs, with associated excoriations and intense pruritus in the genital region.\n\nPubic lice are typically transmitted through sexual contact. The parasite's claw morphology is adapted to grasp the coarse hair of the pubic region."
    difficulty: easy
    tags: [lice, pubic-lice, pediculosis, clinical-features, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the incubation period for genital herpes (HSV-2)?"
    back: "2-20 days after exposure to the virus.\n\nThe relatively long and variable incubation period reflects the time needed for viral replication and establishment of primary infection before symptoms appear."
    difficulty: easy
    tags: [hsv, genital-herpes, incubation, epidemiology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the treatment for first-episode genital herpes?"
    back: "Acyclovir 400mg PO TID for 7-10 days. Also test and treat concurrent STIs, and provide pain control with sitz baths and analgesia.\n\nFirst episodes are more severe than recurrences and require longer antiviral courses. Counseling about transmission and disclosure is essential."
    difficulty: medium
    tags: [genital herpes, HSV-2, treatment, acyclovir, STI, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the treatment options for recurrent genital herpes?"
    back: "Daily suppressive therapy (acyclovir 400mg PO BID) or episodic therapy started during prodrome or within 1 day of lesion onset (acyclovir 800mg PO TID for 5 days or TID for 2 days). Famciclovir and valacyclovir are alternatives with better absorption.\n\nSuppressive therapy reduces transmission risk and is preferred for patients with >4-6 recurrences per year. Episodic therapy is cost-effective for infrequent recurrences."
    difficulty: medium
    tags: [genital herpes, HSV, treatment, suppressive therapy, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "How is Kaposi Sarcoma diagnosed?"
    back: "Biopsy (showing spindle cells, vascular slits, extravasated RBCs) and PCR for HHV-8 DNA sequences\n\nHHV-8 PCR is highly sensitive and specific for KS. Immunohistochemistry for HHV-8 LANA-1 antigen can also be performed on biopsy specimens."
    difficulty: medium
    tags: [Kaposi sarcoma, diagnosis, biopsy, PCR, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the mechanism and dose of finasteride for male androgenetic alopecia?"
    back: "Finasteride (Propecia®) 1 mg/day is a 5-alpha-reductase inhibitor, blocking conversion of testosterone to DHT\n\nBy reducing DHT levels, finasteride slows hair loss and promotes some regrowth. It is FDA-approved for male pattern hair loss."
    difficulty: medium
    tags: [androgenetic alopecia, finasteride, 5-alpha-reductase, treatment, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What procedural treatments are available for androgenetic alopecia?"
    back: "Hair transplantation and platelet-rich plasma (PRP) therapy\n\nHair transplantation involves moving hair follicles from the permanent zone (occiput) to balding areas. PRP contains growth factors that may stimulate follicular activity."
    difficulty: easy
    tags: [androgenetic alopecia, treatment, hair transplant, PRP, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the diagnostic test of choice to confirm Kaposi Sarcoma?"
    back: "Skin biopsy showing characteristic spindle cells with vascular slits, plus PCR for HHV-8 DNA\n\nHistology demonstrates interlocking fascicles of spindle cells with erythrocyte extravasation; PCR confirms HHV-8 infection."
    difficulty: medium
    tags: [kaposi sarcoma, diagnosis, pathology, HHV-8, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the mechanism of action of spironolactone in female androgenetic alopecia?"
    back: "Anti-androgenic effects - blocks androgen receptors and inhibits ovarian androgen production\n\nSpironolactone is commonly used off-label for female pattern hair loss due to its anti-androgenic properties."
    difficulty: hard
    tags: [androgenetic alopecia, spironolactone, anti-androgen, treatment, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the most common cause of Cutaneous T-Cell Lymphoma in patients >50 years old?"
    back: "Mycosis fungoides, with a male to female ratio of 2:1\n\nMycosis fungoides is the most common primary cutaneous lymphoma, typically presenting in older adults with indolent progression."
    difficulty: easy
    tags: [cutaneous T-cell lymphoma, mycosis fungoides, epidemiology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What biopsy findings confirm the diagnosis of Cutaneous T-Cell Lymphoma?"
    back: "Histology showing atypical lymphocytes, lymphocyte antigen cell markers (CD3+, CD4+), and T-cell receptor gene rearrangement studies\n\nThe combination of histopathology, immunophenotyping, and molecular studies for clonality establishes the diagnosis."
    difficulty: medium
    tags: [cutaneous T-cell lymphoma, diagnosis, biopsy, pathology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the maximum weekly dosage of calcipotriol cream for adults >14 years?"
    back: "100 g/week\n\nCalcipotriol is a vitamin D analogue used for psoriasis. Maximum weekly dosage varies by age: ≤25yr = 25g, 6-10yr = 50g, 11-14yr = 75g, >14yr = 100g."
    difficulty: easy
    tags: [calcipotriol, psoriasis, topical therapy, dosing, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "Which topical agents for atopic dermatitis lack the adverse effects of steroids?"
    back: "Pimecrolimus, Tacrolimus, and Crisaborole\n\nThese calcineurin inhibitors and PDE4 inhibitor can be used on all skin surfaces including head, neck, and intertriginous areas without causing skin atrophy, striae, or systemic effects associated with topical steroids."
    difficulty: easy
    tags: [atopic dermatitis, pimecrolimus, tacrolimus, crisaborole, topical therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for dapsone therapy?"
    back: "G6PD before treatment, CBC qwk ×4, then qmo ×6, then q6mo; LFTs at baseline then periodically\n\nDapsone 50-150mg daily is used for dermatitis herpetiformis and neutrophilic dermatoses. Side effects include neuropathy and hemolysis; vitamin C and E supplementation may help prevent hemolysis."
    difficulty: medium
    tags: [dapsone, dermatitis herpetiformis, oral therapy, monitoring, G6PD, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the total cumulative dose and typical duration of isotretinoin therapy?"
    back: "Total cumulative dose of 120 mg/kg, typically achieved over 16-24 weeks\n\nIsotretinoin 0.5-1mg/kg/d is used for severe nodular/inflammatory acne. The drug may be discontinued at 16-20 weeks when nodule count drops >70%. Refractory cases may require >3 courses."
    difficulty: medium
    tags: [isotretinoin, acne, oral therapy, teratogenicity, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the itraconazole regimen for onychomycosis of toenails?"
    back: "200 mg PO bid on 3 consecutive days per month, repeated for 3 months (pulse therapy)\n\nItraconazole pulse therapy for toenail onychomycosis uses 200mg bid for 1 week per month, repeated 3 times. Capsules must be taken with food and swallowed whole."
    difficulty: medium
    tags: [itraconazole, onychomycosis, oral therapy, antifungal, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the ivermectin dosing for scabies?"
    back: "200-250 mcg/kg PO once, repeated one week later\n\nIvermectin is used off-label for scabies in Canada (licensed for onchocerciasis in the USA only). It is taken as directed with the repeat dose given one week later for optimal efficacy."
    difficulty: easy
    tags: [ivermectin, scabies, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the mechanism of action of tacrolimus and pimecrolimus?"
    back: "Calcineurin inhibitors - they block T-cell activation and cytokine production\n\nThese topical immunomodulators bind to FKBP-12 (tacrolimus) or cyclophilin (pimecrolimus), inhibiting calcineurin and preventing IL-2 transcription, reducing inflammatory response in atopic dermatitis."
    difficulty: medium
    tags: [tacrolimus, pimecrolimus, atopic dermatitis, immunomodulator, mechanism, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What special populations should avoid topical steroids and what are the alternatives?"
    back: "Infants, facial skin, intertriginous areas - use pimecrolimus, tacrolimus, or crisaborole instead\n\nTopical steroids cause skin atrophy and striae on thin skin areas. Calcineurin inhibitors (pimecrolimus, tacrolimus) and crisaborole are safe alternatives for sensitive areas in all age groups."
    difficulty: easy
    tags: [topical steroids, atopic dermatitis, alternatives, special populations, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What investigations confirm Kaposi Sarcoma?"
    back: "Biopsy (showing spindle cells, vascular slits, extravasated RBCs) and PCR identifying HHV-8 DNA sequences\n\nHistology combined with HHV-8 PCR provides both morphological confirmation and etiologic proof of Kaposi sarcoma."
    difficulty: medium
    tags: [Kaposi sarcoma, diagnosis, investigations, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the typical timeline for hair loss in Telogen Effluvium after exposure to precipitant?"
    back: "2-4 months after exposure to the precipitating factor\n\nThe delay reflects the time needed for follicles to complete their transition to telogen and shed the club hair, which occurs as a synchronized pulse."
    difficulty: medium
    tags: [telogen effluvium, timeline, pathophysiology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the maximum weekly dosage of topical calcipotriol (Dovonex®) cream for patients over 14 years old?"
    back: "100g/week\n\nCalcipotriol is a vitamin D analog used for psoriasis. Maximum weekly dosages vary by age: ≤5yr 25g, 6-10yr 50g, 11-14yr 75g, >14yr 100g/week."
    difficulty: easy
    tags: [psoriasis, topical-therapy, calcipotriol, dosing, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the dosing of valacyclovir (Valtrex®) for recurrent genital herpes?"
    back: "500mg PO BID x 5 days; reduce dose if impaired renal function\n\nValacyclovir is a prodrug of acyclovir with better bioavailability. It reduces viral shedding and can be used for treatment and prophylaxis of recurrent genital herpes."
    difficulty: easy
    tags: [genital-herpes, valacyclovir, antiviral, dosing, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What baseline and follow-up monitoring is required for dapsone therapy?"
    back: "Baseline: G6PD level; CBC q1-2 weeks x4, then monthly x6, then q6 months; LFTs at baseline then periodically\n\nDapsone is used for dermatitis herpetiformis and neutrophilic dermatoses. Hemolysis is a major side effect, particularly in G6PD-deficient patients, requiring regular CBC monitoring."
    difficulty: medium
    tags: [dapsone, monitoring, hemolysis, dermatitis-herpetiformis, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the dosing of ivermectin for scabies and what is its status in Canada?"
    back: "200-250 mcg/kg PO as a single dose, repeat one week later; not licensed for use in Canada but efficacious; also used for onchocerciasis in the USA\n\nIvermectin is an oral antiparasitic agent effective for scabies. While it requires an Health Canada special access request, it is a useful alternative when topical therapy fails or is impractical."
    difficulty: easy
    tags: [ivermectin, scabies, parasitic-infection, off-label, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the best imaging modality for evaluating intracranial injury?"
    back: "Non-contrast head CT\n\nNon-contrast head CT is the best imaging modality for ruling out intracranial hemorrhage, fractures, and other acute brain injuries."
    difficulty: easy
    tags: [CT head, intracranial injury, imaging, trauma, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the two main categories of injuries?"
    back: "Blunt (most common: MVC, pedestrian-automobile, falls, assault) and penetrating (increasing incidence: GSW, stabbing, impalement)\n\nUnderstanding the mechanism of injury helps anticipate specific traumatic injuries."
    difficulty: easy
    tags: [trauma, injury classification, mechanism, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is RUSH exam in emergency medicine?"
    back: "Rapid Ultrasound in Shock - a protocol used to evaluate hypotensive patients\n\nRUSH exam assesses pump (heart), tank (IVC and fluid status), and pipes (aorta and DVT) in unstable patients."
    difficulty: medium
    tags: [POCUS, RUSH, shock, ultrasound, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are signs of urethral injury that require further evaluation before catheterization?"
    back: "Blood at urethral meatus\n\nBlood at the urethral meatus suggests possible urethral injury and requires further evaluation before catheter placement."
    difficulty: easy
    tags: [urinary catheter, trauma, urethral injury, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the GCS score range and what does it assess?"
    back: "3-15; assesses eye opening, verbal response, and motor response\n\nGlasgow Coma Scale is used to assess level of consciousness and neurological status in trauma patients."
    difficulty: easy
    tags: [GCS, neurological exam, trauma, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the CD4:CD8 ratio characteristic of Sézary syndrome?"
    back: "CD4:CD8 ratio >10\n\nWhile characteristic, this ratio is not diagnostic of Sézary syndrome as it can be seen in other conditions; it supports the diagnosis."
    difficulty: hard
    tags: [sezary-syndrome, flow-cytometry, CD4, CD8, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the treatment for avulsion of the base of 5th metatarsal?"
    back: "Supportive tensor or below-knee walking boot for 3 weeks\n\nThis injury occurs with inversion injury and typically heals with conservative management."
    difficulty: easy
    tags: [5th metatarsal, foot, avulsion, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the landmarks for chest compressions in adults?"
    back: "Center of the chest, lower half of the sternum\n\nCompressions should be performed in the center of the chest on the lower half of the sternum, avoiding pressure on the xiphoid process."
    difficulty: easy
    tags: [CPR, compression landmarks, anatomy, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the best imaging modality for detecting intracranial injury?"
    back: "Non-contrast head CT\n\nNon-contrast head CT is the gold standard for evaluating intracranial hemorrhage, fractures, and brain injury in trauma patients."
    difficulty: easy
    tags: [imaging, CT head, neurological, trauma, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "How should chest compressions be performed in adults?"
    back: "2 hands: heel of one hand with second hand on top, pushing hard and fast with complete recoil\n\nProper hand placement and technique maximize cardiac output while minimizing complications from compressions."
    difficulty: easy
    tags: [CPR, technique, resuscitation, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the GCS (Glasgow Coma Scale) used to assess?"
    back: "Level of consciousness by evaluating eye, verbal, and motor responses\n\nGCS scores range from 3-15 and help classify brain injury severity and guide management decisions."
    difficulty: easy
    tags: [GCS, neurological exam, consciousness, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the maximum weekly dosage of calcipotriol cream for patients over 14 years old?"
    back: "100 g/week\n\nCalcipotriol maximum weekly dosage varies by age: >14 years = 100g/wk, 11-14 years = 75g/wk, 6-10 years = 50g/wk, <6 years = 25g/wk"
    difficulty: easy
    tags: [calcipotriol, psoriasis, dosing, topical therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for cyclosporine therapy?"
    back: "BUN/Cr x2 at baseline, then q2 weeks x3 months, then monthly; BP x2, CBC, K+, Mg, lipid panel, uric acid at baseline then q2 weeks x3 months; LFTs\n\nCyclosporine requires renal function monitoring due to nephrotoxicity. Long-term use >2 years is not recommended due to cumulative toxicity"
    difficulty: hard
    tags: [cyclosporine, psoriasis, monitoring, nephrotoxicity, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the dosing of ivermectin for scabies?"
    back: "200-250 mcg/kg orally, repeat one week later\n\nIvermectin is given at 200-250 mcg/kg orally, taken once and repeated one week later for scabies treatment. Not licensed for scabies in Canada"
    difficulty: medium
    tags: [ivermectin, scabies, oral therapy, off-label, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the recommended dosing of valacyclovir for first episode genital herpes?"
    back: "1000 mg PO twice daily for 3 days\n\nValacyclovir 1000mg BID x3 days for first episode genital herpes. For recurrent episodes, 500mg BID x5 days"
    difficulty: easy
    tags: [valacyclovir, genital herpes, HSV, antiviral, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the recommended treatment duration for oral itraconazole in onychomycosis?"
    back: "200 mg PO twice daily for 3 days, once per month, repeated 3 times (pulse therapy)\n\nItraconazole pulse therapy for onychomycosis: 200mg BID x3 days per month for 3 months. Fingernails may only need one pulse"
    difficulty: medium
    tags: [itraconazole, onychomycosis, antifungal, pulse therapy, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the best imaging modality for intracranial injury?"
    back: "Non-contrast head CT\n\nNon-contrast head CT is the gold standard for evaluating intracranial bleeding, fractures, and brain injury in trauma patients."
    difficulty: easy
    tags: [CT head, intracranial injury, imaging, trauma, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are high-risk injuries that should be suspected based on mechanism?"
    back: "The text lists these but mechanism-specific injuries should be anticipated (e.g., aortic injury with high-speed MVC, spinal injury with falls)\n\nKnowing mechanism of injury allows anticipation of occult injuries that may not be immediately apparent."
    difficulty: medium
    tags: [trauma, high-risk injuries, mechanism, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the management approach for lumbosacral strain and disc herniation?"
    back: "Analgesia and continue daily activities as much as tolerated; discuss red flags and organize follow-up\n\nMost disc-related back pain improves with early mobilization rather than bed rest."
    difficulty: easy
    tags: [back pain, management, musculoskeletal, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the typical presentation of musculoskeletal back pain?"
    back: "Moderate pain, worse with movement or cough, no visceral symptoms\n\nMechanical back pain typically worsens with activity and improves with rest, distinguishing it from visceral or inflammatory causes."
    difficulty: easy
    tags: [back pain, musculoskeletal, diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the frostbite classification figure showing (4% 4% vs 4% 4%)?"
    back: "This represents anterior vs posterior views showing the distribution of frostbite grades on the hands\n\nVisual representation helps clinicians assess extent of frostbite injury"
    difficulty: easy
    tags: [frostbite, classification, anatomy, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "Using the rule of nines, what percentage of body surface area is involved if a patient has burns to both arms and the anterior trunk?"
    back: "36% (both arms = 18%, anterior trunk = 18%)\n\nRule of nines: each arm = 9%, each leg = 18%, anterior trunk = 18%, posterior trunk = 18%, head = 9%, perineum = 1%. First-degree burns are not included."
    difficulty: easy
    tags: [EmergencyMedicine, Burns, PlasticSurgery, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "A patient presents with full thickness (3rd degree) burns. What characteristic findings would you expect on physical exam?"
    back: "Skin is pale, insensate, and charred or leathery in appearance\n\nThird degree (full thickness) burns involve epidermis and all dermal layers, resulting in complete loss of sensation and characteristic leathery or charred appearance."
    difficulty: easy
    tags: [EmergencyMedicine, Burns, PlasticSurgery, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the diagnostic marker for pancreatitis?"
    back: "Elevated serum lipase\n\nLipase is more specific than amylase for pancreatitis; may not be elevated in chronic/recurrent pancreatitis"
    difficulty: easy
    tags: [pancreatitis, diagnosis, lipase, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are common pathogens in spontaneous bacterial peritonitis (SBP)?"
    back: "E. coli, Klebsiella, Streptococcus\n\nSBP typically arises from translocation of gut bacteria in patients with cirrhosis"
    difficulty: easy
    tags: [cirrhosis, peritonitis, infection, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "When is LP indicated in psychiatric presentations?"
    back: "When anti-NMDA receptor encephalitis is suspected\n\nAnti-NMDA receptor encephalitis is an autoimmune cause of psychosis requiring CSF analysis"
    difficulty: medium
    tags: [psychosis, LP, autoimmune, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the characteristics of a deep (4th degree) burn?"
    back: "Involvement of fat, muscle, even bone\n\n4th degree burns are catastrophic with potential for limb loss and require specialized care."
    difficulty: easy
    tags: [burns, classification, clinical-features, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the Parkland formula used for in burn management?"
    back: "Guiding fluid replacement of insensate losses in 2nd and 3rd degree burns\n\nThe formula calculates fluid requirements based on burn size and patient weight."
    difficulty: medium
    tags: [burns, fluid-resuscitation, treatment, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What glucose level triggers adding dextrose to IV fluids in DKA management?"
    back: "When blood glucose <14 mmol/L\n\nDextrose is added once glucose falls below 14 mmol/L to prevent hypoglycemia while continuing insulin to resolve ketosis."
    difficulty: easy
    tags: [DKA, dextrose, glucose, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the diagnostic threshold for blood glucose in HHS?"
    back: ">33.3 mmol/L\n\nHHS is characterized by extreme hyperglycemia >33.3 mmol/L due to relative insulin deficiency."
    difficulty: easy
    tags: [HHS, hyperglycemia, diagnostic criteria, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the estimated total water deficit in HHS?"
    back: "100 cc/kg body weight\n\nPatients with HHS have severe dehydration with an average water deficit of approximately 100 cc/kg."
    difficulty: medium
    tags: [HHS, dehydration, fluids, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the target timeline and magnitude for BP reduction in hypertensive emergency?"
    back: "Gradual reduction over 24-48 hours\n\nBP should be lowered gradually and progressively over 24-48 hours to prevent end-organ ischemia."
    difficulty: medium
    tags: [hypertensive emergency, treatment, BP, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What non-selective beta-blockers should be avoided in hypertensive emergency and why?"
    back: "Avoid non-selective beta-blockers as they inhibit beta-2 mediated vasodilation, leaving alpha-adrenergic vasoconstriction unopposed\n\nNon-selective beta-blockers worsen hypertension by blocking vasodilatory beta-2 receptors."
    difficulty: hard
    tags: [hypertensive emergency, beta-blockers, contraindication, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What investigations are needed for suspected DKA/HHS?"
    back: "CBC, electrolytes, extended lytes, Cr, BUN, glucose, ketones, osmolality, urine glucose/ketones, VBG, CXR, ECG, blood/urine C&S\n\nComprehensive workup assesses severity, identifies complications, and finds precipitating causes."
    difficulty: medium
    tags: [DKA, HHS, investigations, workup, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What electrolytes should be monitored frequently in DKA/HHS management?"
    back: "Potassium, sodium, glucose\n\nElectrolyte shifts during treatment require close monitoring; particularly potassium as insulin causes hypokalemia."
    difficulty: easy
    tags: [DKA, HHS, monitoring, electrolytes, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the diagnostic test for pancreatitis?"
    back: "Elevated serum lipase\n\nSerum lipase is the preferred test for pancreatitis diagnosis. Note: lipase may not be elevated in chronic or recurrent pancreatitis."
    difficulty: easy
    tags: [pancreatitis, diagnosis, lipase, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the common pathogens in spontaneous bacterial peritonitis?"
    back: "E. coli, Klebsiella, Streptococcus\n\nThese enteric bacteria are the most common causative organisms in SBP, typically arising from bacterial translocation across the gut wall."
    difficulty: easy
    tags: [SBP, pathogens, cirrhosis, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "For ASA overdose, how many serum level measurements are required before discharge?"
    back: "At least 3 levels showing decreasing toxin concentration\n\nTwo measurements must show decreasing serum ASA levels before discharge, meaning a minimum of 3 total measurements."
    difficulty: medium
    tags: [ASA overdose, discharge, monitoring, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the main function of VLDL?"
    back: "Transport hepatic synthesized triglycerides from liver to adipose tissue and muscle\n\nVLDL (Very Low-Density Lipoprotein) is produced by the liver and delivers endogenous triglycerides to peripheral tissues."
    difficulty: easy
    tags: [VLDL, lipoprotein, TG transport, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the main function of HDL?"
    back: "Transport cholesterol from peripheral tissues to liver (reverse cholesterol transport)\n\nHDL acts as a reservoir for apolipoproteins and helps remove excess cholesterol from tissues, protecting against atherosclerosis."
    difficulty: easy
    tags: [HDL, lipoprotein, cholesterol, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the clinical significance of elevated LDL?"
    back: "LDL is a major risk factor for atherosclerosis and coronary artery disease\n\nLDL particles deposit cholesterol in arterial walls, forming atherosclerotic plaques that can lead to CAD."
    difficulty: easy
    tags: [LDL, atherosclerosis, CAD, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the approximate LDL reduction with statin therapy?"
    back: "Statins lower LDL by about 30-40%\n\nEach 1.0 mmol/L decrease in LDL corresponds to approximately 20-25% relative risk reduction in cardiovascular disease."
    difficulty: easy
    tags: [statin, treatment, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the approximate LDL reduction with PCSK9 inhibitors?"
    back: "PCSK9 inhibitors lower LDL by about 50%\n\nPCSK9 inhibitors are monoclonal antibodies that enhance LDL receptor recycling, providing substantial LDL reduction."
    difficulty: easy
    tags: [PCSK9 inhibitor, treatment, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the rule for doubling statin dose?"
    back: "If statin dose is doubled, there is approximately a 6% increase in LDL-lowering efficacy\n\nThis demonstrates the rule of diminishing returns with statin dose escalation; adding second-line agents is often more effective."
    difficulty: medium
    tags: [statin, dosing, treatment, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is Tangier disease?"
    back: "Autosomal recessive disorder due to ABCA1 gene mutations causing near-absent HDL and cholesterol accumulation in tonsils, liver, spleen, and cornea\n\nPatients present with enlarged orange tonsils, mild hypertriglyceridemia, neuropathy, and premature atherosclerosis."
    difficulty: hard
    tags: [Tangier disease, HDL, genetics, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the relationship between HDL and cardiovascular outcomes?"
    back: "Increased HDL is associated with decreased CVD and mortality\n\nHigher HDL levels are protective, though recent trials questioning HDL-raising therapies highlight complex pathophysiology."
    difficulty: easy
    tags: [HDL, CVD, risk, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is IDL (Intermediate-Density Lipoprotein)?"
    back: "Product of hydrolysis of TG in VLDL by lipoprotein lipase, enriched in cholesterol esters, an atherogenic particle\n\nIDL is formed when triglycerides are depleted from VLDL and can further convert to LDL."
    difficulty: easy
    tags: [IDL, lipoprotein, VLDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the function of VLDL?"
    back: "Transport hepatic synthesized triglycerides from liver to adipose tissue and muscle\n\nVLDL is produced in the liver and delivers endogenously synthesized triglycerides to peripheral tissues."
    difficulty: easy
    tags: [lipoproteins, VLDL, TG transport, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the function of HDL?"
    back: "Transport cholesterol from peripheral tissues to liver; acts as a reservoir for apolipoproteins\n\nHDL is protective against atherosclerosis and facilitates reverse cholesterol transport."
    difficulty: easy
    tags: [lipoproteins, HDL, cholesterol transport, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is IDL and how is it formed?"
    back: "IDL is the product of hydrolysis of triglycerides in VLDL by lipoprotein lipase, resulting in depletion of the triglyceride core and enrichment with cholesterol esters\n\nIDL (intermediate-density lipoprotein) is an intermediate particle between VLDL and LDL."
    difficulty: easy
    tags: [lipoproteins, IDL, VLDL metabolism, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the cardiovascular risk reduction per 1.0 mmol/L decrease in LDL?"
    back: "Approximately 20-25% relative risk reduction in cardiovascular disease\n\nThis underscores the importance of aggressive LDL lowering in high-risk patients."
    difficulty: easy
    tags: [cardiovascular risk, LDL, treatment effect, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the endogenous lipid pathway?"
    back: "Liver synthesizes VLDL → transports hepatic triglycerides to adipose tissue and muscle → VLDL converted to IDL then to LDL\n\nThis pathway delivers endogenously produced lipids to peripheral tissues."
    difficulty: easy
    tags: [lipid metabolism, endogenous pathway, VLDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the mechanism of action of bile acid sequestrants?"
    back: "Bind bile acids in the intestine, preventing their reabsorption and increasing LDL receptor activity in the liver\n\nThis increases LDL clearance from blood, lowering LDL cholesterol."
    difficulty: medium
    tags: [treatment, bile acid sequestrant, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the role of PCSK9 in LDL metabolism?"
    back: "PCSK9 binds to LDL receptors and promotes their degradation, reducing LDL clearance from blood\n\nPCSK9 inhibitors block this process, leading to increased LDL receptor recycling and ~50% LDL reduction."
    difficulty: medium
    tags: [PCSK9, LDL receptor, treatment, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the relationship between HDL and cardiovascular disease?"
    back: "Increased HDL is associated with decreased CVD and mortality\n\nHowever, HDL-targeted therapies (e.g., CETP inhibitors) have not shown clinical benefit, emphasizing that HDL function matters more than HDL level."
    difficulty: easy
    tags: [HDL, cardiovascular disease, epidemiology, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is oxidized LDL and why is it important?"
    back: "LDL that has been oxidized in the subendothelial space of blood vessels; taken up by macrophages via scavenger receptors, leading to foam cell formation and atherosclerosis\n\nOxidized LDL is more atherogenic than native LDL and is a key mediator in plaque formation."
    difficulty: medium
    tags: [atherosclerosis, oxidized LDL, pathophysiology, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the treatment of choice for toxic alcohol poisoning?"
    back: "Fomepizole 15 mg/kg IV bolus\n\nFomepizole is the treatment of choice for toxic alcohol poisoning. Alternative is 10% ethanol IV to achieve blood level of 22 mmol/L."
    difficulty: easy
    tags: [toxic alcohols, fomepizole, treatment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What co-ingestion is protective in toxic alcohol poisoning?"
    back: "Ethanol (EtOH)\n\nEthanol co-ingestion is protective in toxic alcohol poisoning as it competitively inhibits metabolism of methanol and ethylene glycol to toxic metabolites."
    difficulty: easy
    tags: [toxic alcohols, ethanol, methanol, ethylene glycol, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "How long is ED observation adequate for TCA overdose if asymptomatic with no ECG abnormalities?"
    back: "6 hours\n\nFor TCA overdose that is asymptomatic with no ECG abnormalities, 6 hours of ED observation is adequate following proper decontamination."
    difficulty: easy
    tags: [TCA overdose, disposition, observation, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What finding most commonly accompanies TCA overdose?"
    back: "Sinus tachycardia\n\nSinus tachycardia is the most common ECG finding in TCA overdose and warrants ED observation and poison centre consultation."
    difficulty: easy
    tags: [TCA, ECG, sinus tachycardia, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What assessment tools are used to evaluate suicide risk in the ED?"
    back: "SAD PERSONS scale and Columbia-Suicide Severity Rating Scale\n\nThe SAD PERSONS scale and Columbia-Suicide Severity Rating Scale are validated tools used to assess suicide risk in emergency settings."
    difficulty: easy
    tags: [suicide risk, SAD PERSONS, psychiatric emergency, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the key elements of safety assessment before seeing a psychiatric patient?"
    back: "Ensure own safety, have security/police available if necessary\n\nBefore seeing a psychiatric patient in the ED, clinicians must ensure their own safety and have security or police support available when needed."
    difficulty: easy
    tags: [safety, psychiatric emergency, ED, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "When should a patient be certified under mental health legislation?"
    back: "When patient is medically cleared but requires involuntary psychiatric treatment, demonstrating apparent mental illness and risk to self/others\n\nCertification under local mental health legislation is indicated when a patient who is medically cleared demonstrates apparent mental illness and poses a risk to themselves or others."
    difficulty: medium
    tags: [certification, mental health, psychiatric emergency, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the function of LDL?"
    back: "Cholesterol-rich atherogenic particles that deliver cholesterol to peripheral tissues\n\nLDL is the main carrier of cholesterol in blood and is the most atherogenic lipoprotein. Elevated LDL is a major risk factor for CAD."
    difficulty: easy
    tags: [lipoproteins, LDL, cholesterol, atherosclerosis, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the LDL reduction with each 1.0 mmol/L decrease?"
    back: "Approximately 20-25% relative risk reduction in cardiovascular disease\n\nThis demonstrates the significant clinical benefit of LDL lowering regardless of baseline cholesterol level."
    difficulty: easy
    tags: [treatment, LDL, CVD risk, statin, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "By how much do statins lower LDL?"
    back: "About 30-40% LDL reduction\n\nStatins are first-line therapy for dyslipidemia. They work by inhibiting HMG-CoA reductase, the rate-limiting enzyme in cholesterol synthesis."
    difficulty: easy
    tags: [treatment, statin, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "By how much do PCSK9 inhibitors lower LDL?"
    back: "About 50% LDL reduction\n\nPCSK9 inhibitors are monoclonal antibodies that prevent LDL receptor degradation, dramatically lowering LDL levels."
    difficulty: easy
    tags: [treatment, PCSK9 inhibitor, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the primary function of VLDL?"
    back: "Transport hepatic synthesized triglycerides from liver to adipose tissue and muscle\n\nVLDL (Very-Low-Density Lipoprotein) is produced in the liver and delivers endogenous triglycerides to peripheral tissues."
    difficulty: easy
    tags: [lipoproteins, physiology, triglycerides, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the primary function of HDL?"
    back: "Transport cholesterol from peripheral tissues to liver (reverse cholesterol transport)\n\nHDL (High-Density Lipoprotein) removes excess cholesterol from peripheral tissues and delivers it to the liver for excretion."
    difficulty: easy
    tags: [lipoproteins, physiology, cholesterol, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the function of IDL?"
    back: "Product of hydrolysis of triglycerides in VLDL by lipoprotein lipase, enriched in cholesterol esters\n\nIDL (Intermediate-Density Lipoprotein) is an intermediate particle formed when lipoprotein lipase removes triglycerides from VLDL."
    difficulty: easy
    tags: [lipoproteins, physiology, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What cofactor is required for lipoprotein lipase to function?"
    back: "ApoC-II (apolipoprotein C-II)\n\nLipoprotein lipase requires activation by ApoC-II to hydrolyze triglycerides in chylomicrons and VLDL."
    difficulty: easy
    tags: [lipoproteins, enzymes, apolipoproteins, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What causes Tangier disease?"
    back: "Autosomal recessive mutations in ABCA1 gene\n\nThis causes impaired HDL-mediated cholesterol efflux from macrophages and severely depressed HDL cholesterol levels."
    difficulty: medium
    tags: [primary dyslipidemia, genetics, HDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "By how much do statins typically lower LDL?"
    back: "About 30-40%\n\nStatins are the most effective LDL-lowering medications available."
    difficulty: easy
    tags: [treatment, statins, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "List the eight etiologies of hypopituitarism (The Eight I's)"
    back: "Invasive, Infarction, Infiltrative, Infectious, Injury, Immunologic, Iatrogenic, Idiopathic\n\nThese cover the major categories: tumors (invasive), vascular events (infarction), inflammatory conditions, infections, trauma, autoimmune destruction, treatment-related causes, and unknown causes."
    difficulty: medium
    tags: [pituitary, hypopituitarism, etiology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the function of calcitonin?"
    back: "Inhibits osteoclast activity and increases renal calcium excretion\n\nCalcitonin is produced by parafollicular C cells. It lowers serum calcium by depositing it in bones and increasing renal calcium excretion. Its clinical significance is limited."
    difficulty: easy
    tags: [thyroid, calcitonin, calcium, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What hormonal hyperfunction states can pituitary adenomas cause?"
    back: "Prolactin (galactorrhea, hypogonadism), GH (acromegaly/gigantism), ACTH (Cushing's syndrome)\n\nPituitary adenomas can befunctioning (secrete hormones) or non-functioning. The most common secreting adenomas are prolactinomas, followed by GH and ACTH secreting tumors."
    difficulty: easy
    tags: [pituitary, adenoma, hyperfunction, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the cosyntropin stimulation test used for?"
    back: "To evaluate adrenal insufficiency (when 8am cortisol is low/borderline)\n\nCosyntropin (synthetic ACTH) is administered and cortisol response measured. A blunted response indicates adrenal insufficiency. In secondary adrenal insufficiency (pituitary cause), the test may be abnormal if chronic."
    difficulty: hard
    tags: [pituitary, ACTH, adrenal, diagnosis, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is IDL?"
    back: "Intermediate-Density Lipoprotein; product of hydrolysis of TG in VLDL by lipoprotein lipase, enriched in cholesterol esters\n\nIDL is a transitional particle formed when lipoprotein lipase removes triglycerides from VLDL."
    difficulty: easy
    tags: [lipoproteins, IDL, VLDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "How much does each 1.0 mmol/L decrease in LDL reduce cardiovascular risk?"
    back: "Approximately 20-25% relative risk reduction\n\nThis is a key target for statin therapy in primary and secondary prevention."
    difficulty: easy
    tags: [LDL, cardiovascular risk, treatment benefit, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the relationship between HDL and CVD?"
    back: "Increased HDL is associated with decreased CVD and mortality\n\nHowever, raising HDL pharmacologically has not consistently shown CV benefit in trials."
    difficulty: easy
    tags: [HDL, cardiovascular risk, epidemiology, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the mechanism of action of fibrates?"
    back: "Activate PPAR-alpha to increase lipoprotein lipase activity, decreasing TG levels\n\nFibrates are primarily used for hypertriglyceridemia and can raise HDL modestly."
    difficulty: easy
    tags: [fibrates, mechanism of action, TG, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the mechanism of action of niacin?"
    back: "Lowers ApoB and TG, raises HDL by decreasing hepatic ApoA-1 synthesis and increasing LPL activity\n\nNiacin is rarely used due to flushing side effects and limited benefit beyond statins."
    difficulty: easy
    tags: [niacin, mechanism of action, lipids, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What lipoprotein is most atherogenic?"
    back: "LDL (Cholesterol-rich atherogenic particles)\n\nLDL penetrates the arterial wall, undergoes oxidation, and initiates atherosclerosis."
    difficulty: easy
    tags: [LDL, atherosclerosis, risk, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the role of LCAT in lipid metabolism?"
    back: "Lecithin-cholesterol acyltransferase - transfers cholesterol esters from HDL to other lipoproteins\n\nLCAT is important for HDL maturation and reverse cholesterol transport."
    difficulty: medium
    tags: [LCAT, HDL, cholesterol metabolism, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the imaging of choice for evaluating the pituitary sella?"
    back: "MRI of the sella\n\nMRI provides superior soft tissue resolution compared to CT and is the standard imaging modality for pituitary pathology."
    difficulty: easy
    tags: [pituitary, imaging, MRI, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is reverse T3 and when is it produced?"
    back: "Metabolically inactive T3 produced in times of stress to decrease metabolic activity\n\nReverse T3 is formed by peripheral deiodination of T4 and acts as a mechanism to conserve energy during illness/stress."
    difficulty: medium
    tags: [thyroid, reverse T3, stress, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the most common cause of sellar mass lesions?"
    back: "Pituitary adenoma\n\nPituitary adenomas account for the majority of sellar/suprasellar masses. Other causes include craniopharyngioma, cysts, and metastases."
    difficulty: easy
    tags: [pituitary, adenoma, sellar mass, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the rule for statin dose doubling?"
    back: "If the dose of a statin is doubled, there is approximately a 6% increase in the LDL-lowering efficacy\n\nThis demonstrates the logarithmic (rather than linear) relationship between statin dose and LDL reduction."
    difficulty: easy
    tags: [statins, dosing, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What lipoprotein is required for activation of lipoprotein lipase?"
    back: "ApoC-II is required to activate lipoprotein lipase\n\nLipoprotein lipase hydrolyzes triglycerides in chylomicrons and VLDL, and requires ApoC-II as a cofactor for activation."
    difficulty: easy
    tags: [ApoC-II, lipoprotein lipase, triglycerides, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the endogenous lipid transport pathway?"
    back: "The pathway that transports hepatic synthesized triglycerides from the liver to adipose tissue and muscle via VLDL\n\nThis pathway delivers endogenously produced lipids from the liver to peripheral tissues."
    difficulty: easy
    tags: [lipid transport, endogenous pathway, VLDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is LCAT and what is its role?"
    back: "Lecithin-cholesterol acyltransferase - transfers cholesterol esters from HDL to HDL phospholipids in plasma\n\nLCAT is crucial for HDL maturation and the reverse cholesterol transport process."
    difficulty: easy
    tags: [LCAT, HDL, cholesterol, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is hepatic lipase and what does it do?"
    back: "An enzyme that removes residual TG from IDL core, converting IDL to LDL\n\nHepatic lipase plays a key role in the conversion of IDL to LDL in the endogenous lipid pathway."
    difficulty: easy
    tags: [hepatic lipase, IDL, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the role of bile acid sequestrants in lipid management?"
    back: "They bind bile acids in the bowel and prevent reabsorption, lowering LDL cholesterol\n\nBile acid sequestrants (resins) are an older class of lipid-lowering agents used primarily when other agents are not tolerated."
    difficulty: easy
    tags: [bile acid sequestrants, treatment, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is niacin's mechanism of action in lipid management?"
    back: "Niacin reduces hepatic VLDL production and increases HDL via multiple mechanisms including effects on apoA-I\n\nNiacin is the most effective HDL-raising agent but is limited by flushing side effects."
    difficulty: medium
    tags: [niacin, HDL, treatment, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the recommended statin follow-up for monitoring?"
    back: "Monitor liver enzymes and for symptoms of myopathy\n\nRegular monitoring is essential due to potential hepatotoxicity and myopathy side effects of statin therapy."
    difficulty: easy
    tags: [statins, monitoring, safety, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the relationship between LDL and cardiovascular disease risk?"
    back: "Increased LDL is a major risk factor for atherosclerosis and CAD\n\nLDL is the primary atherogenic lipoprotein, and LDL-lowering is the cornerstone of cardiovascular prevention."
    difficulty: easy
    tags: [LDL, CAD risk, atherosclerosis, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the mechanism of PCSK9 inhibitors?"
    back: "They inhibit PCSK9, which normally degrades LDL receptors, thereby increasing LDL receptor availability and LDL clearance from blood\n\nPCSK9 inhibitors are monoclonal antibodies that dramatically lower LDL by enhancing LDL receptor recycling."
    difficulty: medium
    tags: [PCSK9, LDL receptors, mechanism, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is the target postprandial blood glucose range?"
    back: "5-10 mmol/L\n\nPostprandial BG target is 5-10 mmol/L when titrating bolus insulin."
    difficulty: easy
    tags: [blood glucose, postprandial, target, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is typical blood glucose in DKA?"
    back: "Typically 14-55 mmol/L\n\nDKA is characterized by severe hyperglycemia, usually in the range of 14-55 mmol/L."
    difficulty: easy
    tags: [DKA, blood glucose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is typical blood glucose in HHS?"
    back: "Typically 44.4-133.2 mmol/L\n\nHHS is characterized by extremely high glucose levels, higher than DKA, typically 44.4-133.2 mmol/L."
    difficulty: easy
    tags: [HHS, blood glucose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the characteristic breath odor in DKA?"
    back: "Acetone-odoured breath\n\nKetone bodies (acetone) are exhaled, giving characteristic fruity/acetone odor to breath."
    difficulty: easy
    tags: [DKA, ketones, breath, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical onset of HHS?"
    back: "Insidious\n\nHHS has an insidious onset, preceded by weakness, polyuria, and polydipsia over days to weeks."
    difficulty: easy
    tags: [HHS, onset, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the primary metabolic abnormality in HHS?"
    back: "Hyperosmolality without significant ketosis\n\nHHS is characterized by extreme hyperosmolality and dehydration without significant ketosis or acidosis."
    difficulty: medium
    tags: [HHS, hyperosmolality, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the key lab finding that monitors DKA resolution?"
    back: "Anion Gap (AG)\n\nAnion gap is the most important endpoint for monitoring resolution of metabolic acidosis in DKA, not BG or serum ketones."
    difficulty: medium
    tags: [DKA, anion gap, monitoring, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "When is D5W or D10W added to IV fluids in DKA treatment?"
    back: "When serum BG reaches 14.0 mmol/L\n\nOnce BG reaches 14.0 mmol/L, add D5W or D10W to maintain BG of 12-14 mmol/L to prevent hypoglycemia."
    difficulty: medium
    tags: [DKA, glucose, IV fluids, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "When should fluid be switched from NS to 0.45% NaCl?"
    back: "When corrected serum Na+ is high or normal, or if osmolality falling too slowly\n\nSwitch to 0.45% NaCl if corrected Na+ is high/normal, or if rate of fall of plasma osmolality is < 3 mOsm/kg/h."
    difficulty: medium
    tags: [DKA, HHS, fluids, sodium, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the urine finding in DKA?"
    back: "Positive for glucose and ketones\n\nUrinalysis shows glucosuria and ketonuria in DKA due to overflow hyperglycemia and ketone production."
    difficulty: easy
    tags: [DKA, urine, ketones, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the urine finding in HHS?"
    back: "Negative for ketones (unless starvation ketosis)\n\nUrine is positive for glucose but typically negative for ketones in HHS, unless concurrent starvation ketosis."
    difficulty: easy
    tags: [HHS, urine, ketones, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What ABG finding is typical in DKA?"
    back: "Anion gap metabolic acidosis with possible secondary respiratory alkalosis\n\nDKA shows high anion gap metabolic acidosis; hyperventilation may cause respiratory alkalosis as compensation."
    difficulty: medium
    tags: [DKA, ABG, acidosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What ABG finding is typical in HHS?"
    back: "Metabolic acidosis absent unless underlying precipitant\n\nHHS typically has normal pH/acid-base status unless a separate precipitant (e.g., lactic acidosis from MI) causes acidosis."
    difficulty: medium
    tags: [HHS, ABG, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What causes mental obtundation in HHS?"
    back: "High serum osmolality causing fluid shift from neurons to ECF\n\nExtreme hyperosmolality causes water to shift out of neurons, leading to cerebral dehydration and altered mental status."
    difficulty: hard
    tags: [HHS, mental status, osmolality, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical K+ replacement approach in HHS compared to DKA?"
    back: "Less severe K+ depletion in HHS\n\nHHS typically has less severe potassium depletion compared to DKA, but monitoring is still essential."
    difficulty: medium
    tags: [HHS, potassium, electrolytes, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the target BG when switching to D5W in DKA treatment?"
    back: "12-14 mmol/L\n\nOnce BG reaches 14.0 mmol/L, add dextrose to maintain BG of 12-14 mmol/L to prevent hypoglycemia while continuing insulin."
    difficulty: medium
    tags: [DKA, glucose, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What are the clinical features of GH deficiency in adults?"
    back: "Increased fat mass, decreased lean body mass, decreased BMD, fatigue\n\nGH deficiency in adults leads to altered body composition and reduced bone density rather than growth issues."
    difficulty: medium
    tags: [pituitary, GH, deficiency, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are clinical features of LH/FSH deficiency (hypogonadotropic hypogonadism)?"
    back: "Oligo-/amenorrhea, infertility, decreased facial/body hair and muscle mass in men, erectile dysfunction, delayed puberty\n\nGonadotropin deficiency causes hypogonadism with reproductive and sexual symptoms due to lack of sex steroid production."
    difficulty: easy
    tags: [pituitary, LH, FSH, hypogonadism, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the imaging of choice for pituitary pathology?"
    back: "MRI of the sella\n\nMRI with gadolinium provides optimal visualization of pituitary tumors and surrounding structures including the optic chiasm."
    difficulty: easy
    tags: [pituitary, imaging, MRI, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What hormones can be hypersecreted by pituitary adenomas?"
    back: "Prolactin (galactorrhea, hypogonadism), GH (acromegaly/gigantism), ACTH (Cushing's syndrome)\n\nFunctional pituitary adenomas can cause endocrine syndromes based on which hormone they secrete in excess."
    difficulty: easy
    tags: [pituitary, adenoma, hyperfunction, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the role of calcitonin?"
    back: "Inhibits osteoclast activity and increases renal calcium excretion\n\nCalcitonin is produced by parafollicular C cells and lowers blood calcium levels, counteracting parathyroid hormone."
    difficulty: easy
    tags: [thyroid, calcium, calcitonin, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "Which posterior pituitary hormones are affected in pituitary disease?"
    back: "ADH (causing diabetes insipidus) and oxytocin\n\nADH deficiency causes central diabetes insipidus with extreme thirst, polydipsia, and hypernatremia. Oxytocin deficiency is usually asymptomatic except during labour and breastfeeding."
    difficulty: easy
    tags: [pituitary, ADH, oxytocin, diabetes insipidus, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the imaging choice for evaluating pituitary pathology?"
    back: "MRI of the sella\n\nMRI with gadolinium contrast is the gold standard for visualizing pituitary tumours, cysts, and other sellar/parasellar lesions."
    difficulty: easy
    tags: [pituitary, imaging, MRI, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What visual complication requires formal visual field testing in pituitary tumours?"
    back: "Tumours compressing the optic chiasm\n\nFormal visual field testing (like Goldmann perimetry) is essential to detect and quantify bitemporal hemianopsia from chiasmal compression."
    difficulty: easy
    tags: [pituitary, visual fields, adenoma, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "Which pituitary adenomas cause galactorrhea and hypogonadism?"
    back: "Prolactin (PRL) secreting adenomas\n\nHyperprolactinemia inhibits GnRH, causing hypogonadism (amenorrhea, infertility) and stimulates breast tissue causing galactorrhea."
    difficulty: easy
    tags: [pituitary, prolactin, adenoma, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What clinical features do ACTH-secreting pituitary adenomas cause?"
    back: "Cushing's syndrome - typically cause Cushing's disease\n\nACTH-secreting adenomas cause pituitary-dependent Cushing's syndrome, with features of hypercortisolism including central obesity, striae, hypertension, and hyperglycemia."
    difficulty: easy
    tags: [pituitary, ACTH, Cushings, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "At what blood glucose level should D5W or D10W be added to IV fluids during DKA treatment?"
    back: "When BG reaches 14.0 mmol/L\n\nOnce BG reaches 14.0 mmol/L, add dextrose to maintain BG of 12-14 mmol/L to prevent hypoglycemia while continuing insulin to resolve acidosis."
    difficulty: medium
    tags: [DKA, treatment, insulin, dextrose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical urine finding in DKA vs HHS?"
    back: "DKA: positive for glucose and ketones; HHS: negative for ketones (unless starvation ketosis)\n\nThe presence of ketones distinguishes DKA from HHS. HHS may have glucosuria but ketonuria is absent."
    difficulty: easy
    tags: [DKA, HHS, urine, ketones, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical onset pattern of HHS compared to DKA?"
    back: "HHS has an insidious onset; DKA has a more acute onset\n\nHHS develops over days to weeks with polyuria, polydipsia, and progressive dehydration, while DKA presents more rapidly."
    difficulty: easy
    tags: [HHS, DKA, onset, presentation, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What hormone deficiencies cause central adrenal insufficiency?"
    back: "ACTH deficiency (secondary adrenal insufficiency)"
    difficulty: easy
    tags: [ACTH, adrenal insufficiency, hypopituitarism, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What clinical features result from LH/FSH deficiency (hypogonadotropic hypogonadism)?"
    back: "Oligo- or amenorrhea, infertility, decreased facial/body hair and muscle mass in men, erectile dysfunction, delayed puberty"
    difficulty: easy
    tags: [LH, FSH, hypogonadism, reproductive, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What conditions cause infiltrative/inflammatory hypopituitarism?"
    back: "Sarcoidosis, hemochromatosis, histiocytosis"
    difficulty: medium
    tags: [infiltrative, hypopituitarism, 病因, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What pituitary tumor secretes ACTH and causes Cushing's syndrome?"
    back: "Pituitary adenoma"
    difficulty: easy
    tags: [ACTH, Cushings syndrome, pituitary adenoma, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the clinical features of acromegaly?"
    back: "GH excess in adults - enlarged hands/feet, facial changes, organomegaly"
    difficulty: easy
    tags: [acromegaly, GH, pituitary adenoma, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the effects of GH deficiency in adults?"
    back: "Increased fat and decreased lean body mass, decreased BMD, fatigue"
    difficulty: easy
    tags: [GH deficiency, adults, metabolism, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the function of oxytocin?"
    back: ""
    difficulty: easy
    tags: [oxytocin, pituitary, function, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the clinical presentation of prolactin deficiency?"
    back: "Usually asymptomatic; inability to breastfeed"
    difficulty: easy
    tags: [prolactin, lactation, deficiency, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the role of reverse T3?"
    back: "Metabolically inactive; produced in times of stress to decrease metabolic activity"
    difficulty: medium
    tags: [reverse T3, stress, metabolism, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the effects of PTH on calcium and phosphate in the kidney?"
    back: "PTH increases calcium reabsorption and decreases phosphate reabsorption in the distal tubules\n\nPTH's renal effects result in increased serum calcium and decreased serum phosphate - the opposite of vitamin D effects."
    difficulty: easy
    tags: [PTH, physiology, kidney, calcium, phosphate, toronto-notes, pages-0351-0352-0353-0354-0355-0356-0357-0358-0359-0360]
  - front: "Why is calcitonin only effective for 48 hours?"
    back: "Tachyphylaxis develops - downregulation of calcitonin receptors with prolonged use\n\nCalcitonin's calcium-lowering effect diminishes rapidly, so it's used as a bridge to bisphosphonate effect."
    difficulty: medium
    tags: [hypercalcemia, calcitonin, mechanism, toronto-notes, pages-0351-0352-0353-0354-0355-0356-0357-0358-0359-0360]
  - front: "What is the source of the cholesterol precursor for steroid synthesis?"
    back: "Cholesterol, converted by cholesterol 11-hydroxylase to pregnenolone"
    difficulty: medium
    tags: [steroid, adrenal, biochemistry, synthesis, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the pathway for cortisol synthesis?"
    back: "Cholesterol → Pregnenolone → 17-OH-pregnenolone → 17-OH-progesterone → 11-deoxycortisol → Cortisol\n\nCortisol synthesis involves multiple enzymatic steps including 17-hydroxylase and 11-hydroxylase."
    difficulty: medium
    tags: [Cortisol, Steroidogenesis, Biochemistry, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the pathway for aldosterone synthesis?"
    back: "Cholesterol → Pregnenolone → Progesterone → 11-deoxycorticosterone → Corticosterone → 18-hydroxycorticosterone → Aldosterone\n\nAldosterone synthesis requires 18-hydroxylase and 18-oxidase in the zona glomerulosa."
    difficulty: medium
    tags: [Aldosterone, Steroidogenesis, Biochemistry, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the diurnal variation of ACTH and cortisol?"
    back: "ACTH and cortisol peak at 0200-0400h and reach trough levels at 1800-2400h\n\nThis diurnal rhythm must be considered when interpreting cortisol levels."
    difficulty: easy
    tags: [ACTH, Cortisol, Physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the two feedback loops regulating aldosterone?"
    back: "Long loop: aldosterone + volume expansion feedback to juxtaglomerular apparatus; Short loop: angiotensin II + peripheral vasoconstriction\n\nThese feedback mechanisms maintain homeostasis of blood pressure and volume."
    difficulty: medium
    tags: [Aldosterone, Feedback, Physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the role of 11-hydroxylase in steroid synthesis?"
    back: "Converts 11-deoxycortisol to cortisol and deoxycorticosterone to corticosterone\n\n11-hydroxylase deficiency is a form of congenital adrenal hyperplasia."
    difficulty: medium
    tags: [Steroidogenesis, Enzymes, Biochemistry, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the role of 18-hydroxylase and 18-oxidase in steroid synthesis?"
    back: "These enzymes convert corticosterone to 18-hydroxycorticosterone and then to aldosterone in the zona glomerulosa\n\nThese are the final steps unique to aldosterone production."
    difficulty: medium
    tags: [Steroidogenesis, Enzymes, Aldosterone, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "In the ACCORD Combination Lipid Therapy trial, did adding fibrate to statin therapy reduce major CV events in T2DM patients?"
    back: "No - no significant differences in primary outcome between statin alone vs statin plus fibrate\n\nThe ACCORD Lipid trial found that adding fibrate therapy to statin therapy did not reduce major cardiovascular event risk in patients with T2DM."
    difficulty: medium
    tags: [diabetes, T2DM, lipid-therapy, fibrates, statins, clinical-trial, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In UKPDS 33, what percentage reduction in diabetes-related endpoints did intensive glucose control achieve in T2DM?"
    back: "12% reduction (95% CI 1-21%, p=0.029)\n\nUKPDS 33 showed that intensive glucose control with sulfonylurea or insulin reduced microvascular complications in newly diagnosed T2DM patients."
    difficulty: medium
    tags: [diabetes, T2DM, microvascular, UKPDS, clinical-trial, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the mean follow-up duration in the ACCORD trials?"
    back: "4.7 years\n\nBoth the ACCORD Blood Pressure and ACCORD Combination Lipid Therapy trials had a mean follow-up of 4.7 years."
    difficulty: easy
    tags: [diabetes, T2DM, ACCORD, clinical-trial, follow-up, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In the DCCT/EDIC studies, what percentage of original participants were followed in the EDIC study?"
    back: "93%\n\nThe EDIC study followed 93% of the original DCCT participants (1441 patients) until 2005, with a mean duration of 17 years from DCCT enrollment."
    difficulty: easy
    tags: [diabetes, T1DM, DCCT, EDIC, clinical-trial, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the mean number of BP medications at 1 year in the intensive vs standard ACCORD BP arms?"
    back: "Intensive: 3.4 medications; Standard: 2.1 medications\n\nPatients in the intensive BP control arm required significantly more antihypertensive medications to achieve target sBP <120 mmHg."
    difficulty: medium
    tags: [diabetes, T2DM, blood-pressure, ACCORD, treatment-intensity, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Did adding fibrate to statin therapy reduce CV events in ACCORD Lipid Trial?"
    back: "No, no significant difference in primary outcome\n\nThe ACCORD Lipid Trial found no significant differences in major CV events, all MI, all stroke, or all-cause mortality between statin-only and statin+fibrate arms."
    difficulty: medium
    tags: [diabetes, lipid-therapy, fibrates, statins, clinical-trials, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Did intensive glucose control in UKPDS 33 reduce macrovascular complications?"
    back: "No, it did not significantly reduce macrovascular complications\n\nIntensive therapy reduced microvascular but not macrovascular complications in T2DM. Risk reduction for diabetes-related death was 10% (CI -1 to 27, P=0.34)."
    difficulty: hard
    tags: [diabetes, t2dm, macrovascular, clinical-trials, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the mean number of BP medications at 1 year in the intensive arm of ACCORD BP?"
    back: "3.4 medications\n\nThe intensive therapy arm required 3.4 medications (95% CI 3.4-3.5) vs 2.1 medications (95% CI 2.1-2.2) for standard therapy at 1 year."
    difficulty: medium
    tags: [diabetes, blood-pressure, polypharmacy, clinical-trials, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What proportion of patients withdrew from the 4T Trial biphasic arm vs other arms?"
    back: "5.1% in biphasic vs 11.7% prandial and 8.5% basal\n\nThere was a significant difference in withdrawal rates (P=0.04), with biphasic having the lowest withdrawal rate."
    difficulty: medium
    tags: [diabetes, insulin, clinical-trials, adherence, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What is the recommended colorectal cancer screening for adults ages 60-74 according to 2016 Canadian Task Force guidelines?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (strong recommendation, moderate quality evidence)\n\nThe Canadian Task Force recommends FOBT q2yr or flexible sigmoidoscopy q10yr for average-risk adults 60-74. This is a strong recommendation based on moderate quality evidence showing screening reduces CRC mortality."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive medicine, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended colorectal cancer screening for adults ages 50-59 according to 2016 Canadian Task Force guidelines?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (weak recommendation, moderate quality evidence)\n\nFor adults 50-59, the same tests are recommended but as a weak recommendation due to lower certainty of benefits in this age group."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive medicine, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What are the Ontario Cervical Screening Program 2022 guidelines for average-risk women?"
    back: "Women age 25+ who are or have ever been sexually active, screen with cytology q3yr if normal\n\nOntario recommends starting at age 25 (or 21 if immunocompromised) for sexually active women, screening q3yr with normal cytology."
    difficulty: medium
    tags: [cervical cancer, screening, Ontario, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommendation for PSA screening in men ages 55-69?"
    back: "Recommend not screening with PSA test (weak recommendation, moderate quality evidence); clinicians should discuss risks/benefits\n\nThe potential small benefit from PSA screening is outweighed by potential harms (bleeding, infection, incontinence, false positives, overdiagnosis). Shared decision-making is essential."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "Should men under age 55 be screened for prostate cancer with PSA?"
    back: "No, recommend not screening men under age 55 (strong recommendation, low quality evidence)\n\nThere is no evidence that PSA screening reduces mortality in men <55, and there is evidence of potential harms."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the motivational interviewing approach for patients in pre-contemplation stage?"
    back: "Encourage patient to consider the possibility of change; explore their concerns and ambivalence\n\nIn pre-contemplation, patients are not yet considering change. The physician's aim is to help them consider the possibility and explore their reasons for not changing."
    difficulty: medium
    tags: [motivational interviewing, behaviour change, health promotion, counselling, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "Does adding fibrate therapy to statin therapy reduce major CV events in T2DM patients?"
    back: "No - the ACCORD Lipid trial showed no significant difference in primary outcome\n\nAdding fibrate to statin in T2DM patients did not reduce major CV events (nonfatal MI, nonfatal stroke, or CV death)."
    difficulty: medium
    tags: [T2DM, lipidemia, fibrate, statin, ACCORD, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the key finding of the 10-year UKPDS follow-up regarding legacy effects of intensive glucose control?"
    back: "Improved glucose control persisted and there were long-term benefits on macrovascular outcomes\n\nPost-trial monitoring showed that benefits of intensive therapy persisted and emerged as macrovascular benefits over time (metabolic memory)."
    difficulty: hard
    tags: [T2DM, UKPDS, legacy effect, macrovascular, long-term, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What percentage of patients withdrew from each arm in the 4T trial?"
    back: "Biphasic: 5.1%, Prandial: 11.7%, Basal: 8.5% (P=0.04)\n\nThere was a significant difference in withdrawal rates between arms, with biphasic having the lowest and prandial the highest."
    difficulty: medium
    tags: [T2DM, insulin, 4T trial, withdrawal, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What target FPG was used in UKPDS intensive treatment arm?"
    back: "FPG <6 mmol/L\n\nUKPDS used target FPG <6 mmol/L for intensive treatment vs <15 mmol/L without hyperglycemic symptoms for conventional treatment."
    difficulty: easy
    tags: [T2DM, UKPDS, FPG, target, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In the ACCORD trial, how many medications on average were needed at 1 year for intensive vs standard BP therapy?"
    back: "Intensive: 3.4 medications, Standard: 2.1 medications\n\nMean number of antihypertensive medications at 1 year was significantly higher in the intensive therapy arm."
    difficulty: medium
    tags: [T2DM, ACCORD, BP, medications, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Does intensive glucose control in T2DM reduce macrovascular complications?"
    back: "No immediate reduction in UKPDS, but 10-year follow-up showed emerging macrovascular benefits (legacy effect)\n\nUKPDS 33 showed no macrovascular benefit initially, but post-trial monitoring showed long-term macrovascular risk reduction."
    difficulty: hard
    tags: [T2DM, macrovascular, UKPDS, legacy effect, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the follow-up duration of the EDIC study after the DCCT?"
    back: "Mean 17-year follow-up, with 93% of original DCCT participants followed until 2005\n\nThe DCCT ran from 1983-1993 (mean 6.5 years of intensive therapy). The EDIC observational study followed participants for cardiovascular events through 2005, demonstrating the long-term legacy effects of early intensive therapy."
    difficulty: easy
    tags: [diabetes, T1DM, cardiovascular, long-term-follow-up, clinical-trials, EDIC, DCCT, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "How many patients were enrolled in the UKPDS 33 trial?"
    back: "3867 patients with newly diagnosed T2DM\n\nUKPDS 33 investigated intensive blood-glucose control with sulfonylurea or insulin vs. conventional treatment (diet alone) in newly diagnosed T2DM patients."
    difficulty: easy
    tags: [diabetes, T2DM, clinical-trials, UKPDS, sample-size, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What is the recommended colorectal cancer screening approach for adults ages 50-59 at average risk?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (weak recommendation)\n\nThis is a weak recommendation based on moderate quality evidence, unlike the stronger recommendation for ages 60-74."
    difficulty: easy
    tags: [colorectal cancer, screening, prevention, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the Ontario Cervical Screening Program (2022) recommendation for average-risk women?"
    back: "Women ages ≥25 who are or have ever been sexually active, screening every 3 years (if cytology normal)\n\nProvincial guidelines may vary; Ontario recommends starting at age 25 with 3-year intervals."
    difficulty: medium
    tags: [cervical cancer, screening, Ontario, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommendation for PSA testing in men ages 55-69?"
    back: "Recommend not screening with PSA test (weak recommendation; moderate quality evidence); clinicians should discuss risks/benefits\n\nThe potential small benefit is outweighed by potential harms (bleeding, infection, urinary incontinence, false positives, overdiagnosis)."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, mens health, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommendation for PSA testing in men under age 55?"
    back: "Recommend not screening with PSA test (strong recommendation; low quality evidence)\n\nThere is no evidence that PSA screening reduces mortality in this age group, and there is evidence of harms."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, mens health, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the most effective preventive strategy in healthcare?"
    back: "Health promotion\n\nAccording to Toronto Notes, health promotion is the most effective preventive strategy."
    difficulty: easy
    tags: [health promotion, prevention, primary care, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What model should guide discussions about healthy behaviours with patients?"
    back: "Stage of change model (Transtheoretical Model)\n\nIt is helpful to be guided by a patient's present stage of change when having discussions around healthy behaviours."
    difficulty: easy
    tags: [behaviour change, motivational interviewing, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "For a patient in the Pre-Contemplation stage of change, what should the physician's aim be?"
    back: "Encourage patient to consider the possibility of change\n\nThe physician should help the patient recognize that change may be worthwhile before moving to contemplation."
    difficulty: medium
    tags: [motivational interviewing, behaviour change, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to 2016 Canadian guidelines, what is recommended for colorectal cancer screening in adults ages 50-59?"
    back: "FOBT (either gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (weak recommendation)\n\nFor ages 50-59, the same screening modalities are recommended but as a weak recommendation due to moderate quality evidence."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "Should FIT testing be used for symptomatic patients being screened for colorectal cancer?"
    back: "No - do not use FIT for symptomatic patients\n\nFIT testing is not appropriate for symptomatic patients; they should be referred to a specialist for evaluation instead."
    difficulty: medium
    tags: [colorectal cancer, FIT, diagnostics, symptomatic, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommendation for PSA screening in men under age 55?"
    back: "Recommend NOT screening for prostate cancer with PSA test (strong recommendation, low quality evidence)\n\nThere is no evidence that PSA screening reduces mortality in men <55, and there is evidence of harms, leading to a strong recommendation against screening."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "A patient presents with rectal bleeding. What is the appropriate management?"
    back: "Refer to specialist for evaluation\n\nPatients with symptoms such as rectal bleeding or anemia should be referred to a specialist for diagnostic evaluation rather than screening tests."
    difficulty: medium
    tags: [colorectal cancer, rectal bleeding, referral, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What are the 2016 Canadian Task Force recommendations for colorectal cancer screening in adults ages 60-74?"
    back: "FOBT (either gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (strong recommendation, moderate quality evidence)\n\nThe Canadian Task Force recommends FOBT or flexible sigmoidoscopy for average-risk adults 60-74, with strong recommendation based on moderate quality evidence showing mortality benefit."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive health, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What are the 2016 Canadian Task Force recommendations for colorectal cancer screening in adults ages 50-59?"
    back: "FOBT (either gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (weak recommendation, moderate quality evidence)\n\nFor ages 50-59, the recommendation is weaker compared to ages 60-74, but still recommends FOBT or flexible sigmoidoscopy based on moderate quality evidence."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive health, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What does the 2016 Canadian Task Force recommend for colorectal cancer screening in adults age 75 and older?"
    back: "Recommend NOT screening adults age 75 and older for colorectal cancer (weak recommendation, low quality evidence)\n\nThe Task Force recommends against screening in this age group due to limited evidence of benefit and increasing likelihood of harms from screening and treatment."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive health, elderly, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to 2014 Canadian Task Force guidelines, what is the recommendation for PSA screening in men ages 55-69?"
    back: "Recommend NOT screening with PSA test (weak recommendation, moderate quality evidence); clinicians should discuss risks/benefits with each man\n\nThe potential small benefit is outweighed by potential significant harms including bleeding, infection, urinary incontinence, false positives, and overdiagnosis."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to 2014 Canadian Task Force guidelines, should men under age 55 be screened for prostate cancer with PSA?"
    back: "No - recommend NOT screening (strong recommendation, low quality evidence)\n\nThere is no evidence that PSA screening reduces mortality in men under 55, and there is evidence of potential harms."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to 2014 Canadian Task Force guidelines, should men age 70+ be screened for prostate cancer with PSA?"
    back: "No - recommend NOT screening (strong recommendation, low quality evidence)\n\nThere is no evidence that PSA screening reduces mortality in men 70+, while there is clear evidence of potential harms."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, elderly, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the most effective preventive strategy in healthcare according to Toronto Notes?"
    back: "Health promotion\n\nHealth promotion is identified as the most effective preventive strategy in healthcare, more effective than screening or treatment alone."
    difficulty: easy
    tags: [health promotion, preventive health, primary care, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What model should guide discussions around healthy behaviors according to motivational interviewing principles?"
    back: "Patient's stage of change (Transtheoretical Model)\n\nBeing guided by a patient's present stage of change is helpful when having discussions around healthy behaviours - precontemplation, contemplation, preparation, action, maintenance."
    difficulty: easy
    tags: [motivational interviewing, behaviour change, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "For a patient in the Pre-contemplation stage of change, what should be the physician's aim?"
    back: "Encourage patient to consider the possibility of change\n\nIn precontemplation, patients are not considering change, so the physician's goal is to help them start thinking about the possibility of change."
    difficulty: easy
    tags: [motivational interviewing, behaviour change, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "For a patient in the Contemplation stage of change, what is the physician's goal?"
    back: "Explore ambivalence and tip the balance toward change\n\nIn contemplation, patients are ambivalent about change - the physician should help them explore pros and cons to move toward change."
    difficulty: easy
    tags: [motivational interviewing, behaviour change, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "For a patient in the Preparation stage of change, what should the physician assist with?"
    back: "Develop an action plan\n\nIn preparation, patients are ready to take action - the physician should help them create a concrete plan for change."
    difficulty: easy
    tags: [motivational interviewing, behaviour change, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "For a patient in the Action stage of change, what support should the physician provide?"
    back: "Reinforce and provide support\n\nIn the action stage, patients are actively making changes - the physician should reinforce progress and provide support to maintain momentum."
    difficulty: easy
    tags: [motivational interviewing, behaviour change, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "For a patient in the Maintenance stage of change, what is the physician's role?"
    back: "Help prevent relapse\n\nIn maintenance, the goal is to sustain changes and prevent regression to previous behaviors - ongoing support is key."
    difficulty: easy
    tags: [motivational interviewing, behaviour change, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "A 45-year-old average-risk patient asks about colorectal cancer screening. What do you recommend?"
    back: "Average-risk patients should begin screening at age 50; screening is not recommended for average-risk patients under 50\n\nCanadian guidelines recommend starting at age 50 for average-risk individuals, with stronger recommendations for ages 60-74."
    difficulty: medium
    tags: [colorectal cancer, screening, age, preventive health, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended colorectal cancer screening for adults ages 60-74 per 2016 Canadian Task Force guidelines?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (strong recommendation, moderate quality evidence)\n\nThe Canadian Task Force recommends FOBT or flexible sigmoidoscopy for average-risk adults aged 60-74, with a strong recommendation based on moderate quality evidence."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive medicine, Canadian guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended colorectal cancer screening for adults ages 50-59 per 2016 Canadian Task Force guidelines?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (weak recommendation, moderate quality evidence)\n\nFor adults aged 50-59, the Canadian Task Force gives a weak recommendation for the same screening modalities as older adults."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive medicine, Canadian guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the PSA screening recommendation for men ages 55-69?"
    back: "Recommend not screening (weak recommendation, moderate quality evidence); clinicians should discuss risks/benefits with each patient\n\nThe potential small benefit from PSA screening is outweighed by potential harms (bleeding, infection, incontinence, false positives, overdiagnosis)."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, preventive medicine, mens health, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the PSA screening recommendation for men under 55?"
    back: "Recommend not screening (strong recommendation, low quality evidence)\n\nThere is no evidence that PSA screening reduces mortality in men under 55, but there is evidence of harms."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "In motivational interviewing, what is the physician's goal for a patient in the 'Pre-Contemplation' stage?"
    back: "Encourage patient to consider the possibility of change\n\nPre-contemplation is when patients are not yet considering change. The physician's aim is to help them consider the possibility of change."
    difficulty: easy
    tags: [motivational interviewing, behaviour change, health promotion, counselling, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the first step in health promotion according to Toronto Notes?"
    back: "Respectfully explore the values and purposes of the patient's habits or behaviours\n\nHealth promotion is most effective when it begins by understanding the patient's perspective and motivations."
    difficulty: easy
    tags: [health promotion, behaviour change, motivational interviewing, counselling, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What should guide discussions around healthy behaviours in health promotion?"
    back: "The patient's present stage of change\n\nMotivational strategies should be tailored to the patient's current stage in the Transtheoretical Model of behavior change."
    difficulty: easy
    tags: [health promotion, behaviour change, stages of change, motivational interviewing, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What was the serious adverse event rate difference in ACCORD intensive vs standard BP arms?"
    back: "3.3% vs 1.27% (P<0.001) - significantly higher in intensive arm\n\nIntensive BP control led to significantly more serious adverse events, especially bradycardia/arrhythmia and hyperkalemia."
    difficulty: hard
    tags: [Diabetes, Hypertension, Clinical Trial, Adverse Events, T2DM, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Does adding fibrate to statin therapy reduce major CV events in T2DM?"
    back: "No, no significant difference\n\nThe ACCORD Lipid Trial showed no significant difference in primary outcome (major CV events) between statin plus fibrate versus statin alone."
    difficulty: medium
    tags: [Diabetes, Dyslipidemia, Clinical Trial, Fibrate, Statin, T2DM, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What major complication did DCCT show intensive therapy significantly reduces in T1DM?"
    back: "Retinopathy development and progression\n\nIntensive treatment significantly reduced the risk for development and progression of retinopathy in both primary and secondary intervention cohorts."
    difficulty: medium
    tags: [Diabetes, T1DM, Clinical Trial, Retinopathy, Microvascular, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the primary outcome measured in UKPDS 33?"
    back: "Any diabetes-related endpoint\n\nUKPDS 33 investigated intensive blood-glucose control with sulfonylurea or insulin versus conventional treatment on risk of complications in T2DM."
    difficulty: easy
    tags: [Diabetes, T2DM, Clinical Trial, UKPDS, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What percentage risk reduction for any diabetes-related endpoint did intensive therapy show in UKPDS 33?"
    back: "12% reduction (95% CI 1-21, P=0.029)\n\nPatients allocated to intensive treatment had lower median HbA1c and 12% reduced risk for any diabetes-related endpoint compared to conventional treatment."
    difficulty: hard
    tags: [Diabetes, T2DM, Clinical Trial, UKPDS, Microvascular, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What did 10-year follow-up of UKPDS show about persistent effects of intensive glucose control?"
    back: "Improved glucose control persisted and led to long-term reduction in macrovascular outcomes\n\nPost-trial monitoring showed that benefits of intensive therapy persisted, with reduced microvascular and emerging macrovascular benefits over 10 years."
    difficulty: hard
    tags: [Diabetes, T2DM, Clinical Trial, UKPDS, Long-term Outcomes, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "How many medications on average were needed at 1 year in intensive vs standard BP arms of ACCORD?"
    back: "3.4 medications (intensive) vs 2.1 medications (standard)\n\nThe mean number of medications at 1 year for intensive therapy was 3.4 (95% CI 3.4-3.5) versus 2.1 (95% CI 2.1-2.2) for standard therapy."
    difficulty: hard
    tags: [Diabetes, Hypertension, Clinical Trial, T2DM, Medications, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What are the 5 Rs of motivational intervention for smoking cessation?"
    back: "Relevance, Risks, Rewards, Roadblocks, Repetition\n\nThe 5 Rs are used to motivate patients unwilling to quit by exploring personal relevance, risks of smoking, rewards of quitting, roadblocks to cessation, and providing repetition."
    difficulty: medium
    tags: [smoking-cessation, motivational-interviewing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the average number of smoking cessation attempts before success?"
    back: "7 attempts\n\nPatients should be reassured that most people require multiple attempts before successfully quitting."
    difficulty: easy
    tags: [smoking-cessation, epidemiology, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When is the highest relapse rate for smoking cessation?"
    back: "Within 3 months of quitting\n\nThe first three months after quitting are the highest risk period for relapse."
    difficulty: easy
    tags: [smoking-cessation, relapse, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is one standard drink equivalent in grams of pure alcohol?"
    back: "13.64 g of pure alcohol\n\nA standard drink contains approximately 13.64 g of pure alcohol regardless of the beverage type."
    difficulty: easy
    tags: [alcohol, standard-drink, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the alcohol content in 12 oz of 5% beer/cider/coolers?"
    back: "One standard drink equivalent\n\n12 oz of 5% alcohol beer equals one standard drink (12 oz x 0.05 = 0.6 oz alcohol ≈ 13.64 g)."
    difficulty: easy
    tags: [alcohol, standard-drink, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the components of the CAGE questionnaire for alcohol screening?"
    back: "Have you ever felt you needed to Cut down? Have people Annoyed you by criticizing your drinking? Have you ever felt Guilty about drinking? Have you ever needed an Eye opener in the morning?\n\nTwo or more positive responses suggest possible alcohol misuse or dependence."
    difficulty: medium
    tags: [alcohol, screening, CAGE, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What does AUDIT stand for?"
    back: "Alcohol Use Disorders Identification Test\n\nAUDIT is a tool developed by the WHO to assess alcohol use, drinking behaviours, and alcohol-related problems."
    difficulty: easy
    tags: [alcohol, screening, AUDIT, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the typical AST:ALT ratio in persons with alcohol use disorder?"
    back: "Approximately 2:1 (AST:ALT)\n\nThe AST:ALT ratio is typically 2:1 or greater in alcoholic liver disease due to alcohol-induced mitochondrial damage."
    difficulty: medium
    tags: [alcohol, investigations, liver-enzymes, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What liver enzymes are most elevated in alcohol use disorder?"
    back: "GGT and AST (with AST:ALT ratio ~2:1)\n\nGGT is sensitive to alcohol-induced liver injury, and MCV is also commonly elevated."
    difficulty: medium
    tags: [alcohol, investigations, liver-enzymes, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What percentage of persons with alcohol use disorder exhibit spontaneous improvement over 1 year?"
    back: "25-30%\n\nAbout a quarter to a third of patients with AUD show spontaneous improvement without formal treatment."
    difficulty: easy
    tags: [alcohol, prognosis, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the neurologic complications of problem drinking?"
    back: "Wernicke-Korsakoff syndrome, peripheral neuropathy\n\nThiamine deficiency from alcohol misuse causes Wernicke-Korsakoff syndrome and alcoholic neuropathy."
    difficulty: medium
    tags: [alcohol, complications, neurologic, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the first-line treatment for pregnant patients who cannot quit smoking using non-pharmacologic methods?"
    back: "Counselling is recommended as first-line; NRT should be made available if needed\n\nNicotine replacement therapy should be offered to pregnant women who cannot quit using behavioural methods alone."
    difficulty: medium
    tags: [smoking-cessation, pregnancy, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the first-line treatment for smoking cessation in pregnant patients?"
    back: "Counselling is recommended as first-line; NRT may be used if non-pharmacologic methods fail\n\nNicotine and tobacco exposure harms the fetus; counselling is preferred, but NRT is safer than continued smoking."
    difficulty: easy
    tags: [smoking-cessation, pregnancy, prenatal-care, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the average number of quit attempts before successful smoking cessation?"
    back: "7 attempts\n\nMost smokers require multiple attempts before successfully quitting; repetition reassures unsuccessful patients."
    difficulty: easy
    tags: [smoking-cessation, epidemiology, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When is the highest risk of smoking relapse?"
    back: "Within 3 months of quitting\n\nEarly relapse prevention is critical; regular follow-up during this period improves success rates."
    difficulty: easy
    tags: [smoking-cessation, relapse, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is one standard drink equivalent in Canada?"
    back: "13.64 g of pure alcohol\n\nThis equals 12 oz of 5% beer/cider/cooler, 8-9 oz of 7% malt liquor, 5 oz of 12-17% wine, or 1.5 oz of 40% liquor."
    difficulty: easy
    tags: [alcohol, standard-drink, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the CAGE questionnaire questions for alcohol screening?"
    back: "Have you ever felt you needed to Cut down? Have people Annoyed you by criticizing your drinking? Have you ever felt Guilty about drinking? Have you ever needed an Eye opener in the morning?\n\nTwo or more positive answers suggest possible alcohol misuse or dependence."
    difficulty: easy
    tags: [alcohol, screening, CAGE, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What investigations are used to monitor alcohol use disorder?"
    back: "GGT, MCV, AST, ALT, CBC, INR\n\nGGT and MCV are sensitive markers; AST:ALT ratio approaches 2:1 in alcohol use disorder."
    difficulty: easy
    tags: [alcohol, investigations, liver-function, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the AST:ALT ratio typically seen in alcohol use disorder?"
    back: "Approximately 2:1 (AST higher than ALT)\n\nThis ratio is characteristic due to alcohol-induced hepatic injury patterns."
    difficulty: easy
    tags: [alcohol, liver-function, diagnostic, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the spontaneous improvement rate for alcohol use disorder over 1 year?"
    back: "25-30%\n\nA significant proportion of persons with alcohol use disorder show natural improvement without treatment."
    difficulty: easy
    tags: [alcohol, prognosis, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the medical consequences of problem drinking on the GI system?"
    back: "Gastritis, dyspepsia, pancreatitis, liver disease, bleeds, diarrhea, oral/esophageal issues\n\nAlcohol directly irritates GI mucosa and causes pancreatic and hepatic injury."
    difficulty: easy
    tags: [alcohol, complications, gastrointestinal, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the neurologic complications of chronic alcohol use?"
    back: "Wernicke-Korsakoff syndrome, peripheral neuropathy\n\nThese result from both direct alcohol toxicity and thiamine (B1) deficiency."
    difficulty: easy
    tags: [alcohol, complications, neurologic, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the AUDIT test used for?"
    back: "To assess alcohol use, drinking behaviours, and alcohol-related problems\n\nThe Alcohol Use Disorders Identification Test is a validated 10-question screening tool."
    difficulty: easy
    tags: [alcohol, screening, AUDIT, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is first-line treatment for alcohol withdrawal?"
    back: "Diazepam\n\nBenzodiazepines are the mainstay for alcohol withdrawal management due to cross-receptor activity."
    difficulty: easy
    tags: [alcohol, withdrawal, treatment, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What should be assessed when a patient screens positive for alcohol use disorder?"
    back: "Screen for other drug use, identify medical/psychiatric complications, ask about drinking and driving, ask about past recovery attempts and assess readiness to change\n\nComprehensive assessment helps identify comorbidities and guide appropriate intervention."
    difficulty: medium
    tags: [alcohol, assessment, management, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the 5 Rs framework for motivational interviewing in smoking cessation?"
    back: "Relevance, Risks, Rewards, Roadblocks, Repetition\n\nA framework to motivate patients to quit: relevance to patient, risks of smoking, rewards of quitting, roadblocks to quitting, and repetition of message."
    difficulty: easy
    tags: [smoking-cessation, motivational-interviewing, behaviour-change, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is a standard drink equivalent in Canada?"
    back: "13.64 g of pure alcohol; equals 12 oz beer (5%), 8-9 oz malt liquor (7%), 5 oz wine (12-17%), or 1.5 oz liquor (30%)\n\nStandard drink definitions are used to assess patient alcohol consumption patterns and calculate units per day/week."
    difficulty: easy
    tags: [alcohol-use-disorder, epidemiology, assessment, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What does the CAGE questionnaire assess?"
    back: "Screening tool for alcohol dependence: Have you ever felt you needed to Cut down? Have people Annoyed you by criticizing your drinking? Have you ever felt Guilty about drinking? Have you ever needed an Eye opener?\n\nCAGE is a 4-question screening tool. Two or more positive responses suggest possible alcohol misuse or dependence requiring further assessment."
    difficulty: easy
    tags: [alcohol-use-disorder, assessment, screening, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the typical AST:ALT ratio in alcohol use disorder?"
    back: "Approximately 2:1\n\nThe AST:ALT ratio is characteristically elevated in alcoholic liver disease compared to viral hepatitis where ALT usually exceeds AST."
    difficulty: easy
    tags: [alcohol-use-disorder, investigations, diagnosis, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the neurologic complications of alcohol use disorder?"
    back: "Wernicke-Korsakoff syndrome, peripheral neuropathy\n\nThiamine deficiency from chronic alcohol use leads to Wernicke encephalopathy (acute) and Korsakoff syndrome (chronic), and alcoholic neuropathy."
    difficulty: medium
    tags: [alcohol-use-disorder, complications, neurologic, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What pharmacologic agents are used for alcohol withdrawal?"
    back: "Diazepam\n\nBenzodiazepines like diazepam are first-line for alcohol withdrawal to prevent seizures and treat delirium tremens through cross-receptor activity."
    difficulty: easy
    tags: [alcohol-use-disorder, withdrawal, treatment, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When should a patient with alcohol use disorder be referred to specialist or inpatient programs?"
    back: "Dangerous or unstable home environment, severe medical/psychiatric concern, addiction requiring inpatient detoxification, refractory to other treatments\n\nReferral criteria include safety concerns, medical complexity, and treatment-refractory cases that require intensive interventions."
    difficulty: medium
    tags: [alcohol-use-disorder, management, referral, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the average number of attempts before successfully quitting smoking?"
    back: "7 attempts\n\nMost smokers require multiple quit attempts before achieving abstinence. Repetition of motivational interventions is essential."
    difficulty: easy
    tags: [smoking-cessation, behaviour-change, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When is the highest relapse rate after quitting smoking?"
    back: "Within 3 months of quitting\n\nThe first three months post-cessation are critical for maintaining abstinence. Follow-up during this period improves success rates."
    difficulty: easy
    tags: [smoking-cessation, relapse, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the average number of smoking cessation attempts before successful quit?"
    back: "7 attempts\n\nMost people require multiple attempts before successfully quitting - repetition and reassurance are important."
    difficulty: easy
    tags: [smoking-cessation, epidemiology, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the standard drink equivalent for 12 oz of 5% beer?"
    back: "1 standard drink (12 oz beer = 1 standard drink at 5% alcohol)\n\nStandard drink contains 13.64 g of pure alcohol; different beverages have different volumes at the same alcohol content."
    difficulty: easy
    tags: [alcohol, alcohol-use-disorder, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is a standard drink equivalent for 5 oz of 12% wine?"
    back: "1 standard drink\n\n5 oz of 12-17% wine equals one standard drink (13.64 g pure alcohol)."
    difficulty: easy
    tags: [alcohol, alcohol-use-disorder, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is a standard drink equivalent for 1.5 oz of 40% spirits/liquor?"
    back: "1 standard drink\n\n1.5 oz of 40% (80 proof) liquor equals one standard drink (13.64 g pure alcohol)."
    difficulty: easy
    tags: [alcohol, alcohol-use-disorder, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What does the AST:ALT ratio typically look like in alcohol use disorder?"
    back: "AST:ALT approaches 2:1\n\nThis pattern is characteristic of alcohol-induced liver injury, though not specific."
    difficulty: medium
    tags: [alcohol, liver, investigations, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the relapse rate for alcohol use disorder?"
    back: "Relapse is common and should not be viewed as failure; 25-30% show spontaneous improvement over 1 year\n\nRegular monitoring for signs of relapse is crucial, but long-term outcomes can be positive with treatment."
    difficulty: easy
    tags: [alcohol, prognosis, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When should you refer a patient with alcohol use disorder to specialist or inpatient program?"
    back: "Dangerous or highly unstable home environment, severe medical/psychiatric concern, addiction requiring inpatient detoxification, refractory to other treatments\n\nIntensive treatment is needed when outpatient management is insufficient or unsafe."
    difficulty: medium
    tags: [alcohol, management, referral, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the highest risk period for relapse after smoking cessation?"
    back: "Within the first 3 months of quitting\n\nRecent quitters need intensive support during this vulnerable period."
    difficulty: easy
    tags: [smoking-cessation, relapse, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What prescriptive interventions address smoking relapse triggers?"
    back: "Address weight gain, negative mood, withdrawal symptoms, lack of support\n\nTargeted interventions for specific relapse triggers improve long-term quit rates."
    difficulty: medium
    tags: [smoking-cessation, management, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "Does adding fibrate therapy to statin therapy reduce CV events in T2DM?"
    back: "No. The ACCORD Lipid trial found no significant difference in major CV events when fenofibrate was added to simvastatin in patients with T2DM.\n\nThe ACCORD Combination Lipid Therapy trial (NEJM 2010) with 5518 T2DM patients showed no benefit from adding fibrate to statin therapy for primary prevention of major cardiovascular events."
    difficulty: medium
    tags: [diabetes, lipids, clinical-trial, T2DM, ACCORD, statin, fibrate, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What are the 5 components of motivational intervention for smoking cessation (the 5 Rs)?"
    back: "Relevance, Risks, Rewards, Roadblocks, Repetition\n\nThe 5 Rs framework addresses patient motivation by exploring personal relevance, risks, benefits, barriers, and the need for repeated attempts."
    difficulty: easy
    tags: [smoking-cessation, motivational-interviewing, behavioral-medicine, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When is the highest relapse rate after smoking cessation?"
    back: "Within 3 months of quitting\n\nEarly relapse prevention is critical; intensive support should focus on the first 3 months."
    difficulty: easy
    tags: [smoking-cessation, relapse-prevention, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What percentage increase in quit rates does simple physician advice provide?"
    back: "1-3% increase over unassisted quit rate\n\nEven brief advice shows measurable benefit, with more intensive advice and follow-up providing additional gains."
    difficulty: easy
    tags: [smoking-cessation, clinical-effectiveness, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What percentage of Canadian premature deaths are alcohol-related?"
    back: "10%\n\nAlcohol contributes significantly to mortality, including accidents, liver disease, and cancers."
    difficulty: easy
    tags: [alcohol, epidemiology, mortality, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What does the CAGE questionnaire screen for?"
    back: "Alcohol dependence\n\nCAGE is a brief 4-question screening tool for potential alcohol problems in clinical settings."
    difficulty: easy
    tags: [alcohol, screening, CAGE, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is AUDIT?"
    back: "Alcohol Use Disorders Identification Test - a tool to assess alcohol use, drinking behaviours, and alcohol-related problems\n\nAUDIT is a WHO-developed 10-question instrument more comprehensive than CAGE for assessing alcohol use."
    difficulty: easy
    tags: [alcohol, screening, AUDIT, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are common roadblocks to smoking cessation?"
    back: "Fear of withdrawal, weight gain, failure, lack of support\n\nAddressing these barriers proactively improves quit attempt success rates."
    difficulty: easy
    tags: [smoking-cessation, barriers, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the treatment for alcohol withdrawal?"
    back: "Diazepam\n\nBenzodiazepines are first-line for alcohol withdrawal management due to cross-receptor activity."
    difficulty: easy
    tags: [alcohol, withdrawal, treatment, diazepam, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the CAGE questionnaire?"
    back: "4-question screening tool: Have you ever felt you needed to Cut down? Have people Annoyed you by criticizing your drinking? Have you ever felt Guilty about drinking? Have you ever felt you needed a drink first thing in the morning (Eye opener)?\n\nTwo or more positive answers suggest problem drinking requiring further assessment."
    difficulty: easy
    tags: [alcohol, screening, CAGE, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the INR finding in alcohol use disorder and why?"
    back: "Decreased INR due to decreased clotting factor production by the liver\n\nLiver dysfunction from alcoholic liver disease impairs synthesis of clotting factors."
    difficulty: medium
    tags: [alcohol, liver, coagulation, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What was the conclusion of the ACCORD Lipid Trial regarding combination therapy with fibrate and statin in T2DM?"
    back: "Adding fibrate to statin therapy does not reduce major CV event risk in T2DM patients\n\nThis double-blinded RCT with 5518 T2DM patients over 4.7 years found no significant difference in major CV events between statin + fibrate vs statin alone"
    difficulty: medium
    tags: [diabetes, lipid, fibrates, statins, clinical-trials, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In UKPDS 33, what reduction in complications was achieved with intensive glucose control in newly diagnosed T2DM?"
    back: "12% reduction in any diabetes-related endpoint (P=0.029), but no significant reduction in mortality\n\nUKPDS 33 studied 3867 newly diagnosed T2DM patients comparing intensive therapy (sulfonylurea or insulin, target FPG <6 mmol/L) vs conventional diet therapy"
    difficulty: medium
    tags: [type-2-diabetes, intensive-therapy, microvascular, clinical-trials, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the difference in weight gain between intensive therapy and conventional therapy in UKPDS?"
    back: "Intensive therapy was associated with weight gain\n\nBoth UKPDS 33 (intensive sulfonylurea/insulin) and UKPDS 34 noted that intensive therapy led to weight gain, though metformin caused less weight gain than sulfonylureas or insulin"
    difficulty: easy
    tags: [type-2-diabetes, weight, intensive-therapy, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What does the 2016 Canadian Task Force recommend for colorectal cancer screening in adults ages 75 and older?"
    back: "Recommend NOT screening for colorectal cancer (weak recommendation, low quality evidence)\n\nThe harms of screening likely outweigh benefits in this age group due to limited life expectancy and increased complications."
    difficulty: easy
    tags: [colorectal cancer, screening, elderly, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What are the 2014 Canadian Task Force recommendations for PSA screening in men ages 55-69?"
    back: "Recommend NOT screening (weak recommendation); clinicians should discuss risks/benefits with each man based on his preferences\n\nThe potential small benefit is outweighed by potential harms including bleeding, infection, urinary incontinence, false positives, and overdiagnosis."
    difficulty: easy
    tags: [prostate cancer, PSA, screening, shared decision making, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What does the Canadian Task Force recommend for PSA screening in men under age 55?"
    back: "Recommend NOT screening (strong recommendation, low quality evidence)\n\nNo evidence of mortality benefit in this age group, and there is evidence of harms."
    difficulty: easy
    tags: [prostate cancer, PSA, screening, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What does the Canadian Task Force recommend for PSA screening in men age 70 and older?"
    back: "Recommend NOT screening (strong recommendation, low quality evidence)\n\nNo evidence that PSA screening reduces mortality in this age group, while harms are documented."
    difficulty: easy
    tags: [prostate cancer, PSA, screening, elderly, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is health promotion in the context of preventive medicine?"
    back: "The most effective preventive strategy\n\nHealth promotion involves respectfully exploring patient values and purposes around their health behaviours."
    difficulty: easy
    tags: [health promotion, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What model helps guide discussions about healthy behaviours?"
    back: "Transtheoretical Model (Stages of Change)\n\nBeing guided by a patient's present stage of change (precontemplation, contemplation, preparation, action, maintenance) helps tailor interventions."
    difficulty: easy
    tags: [behavioural change, stages of change, motivational interviewing, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "A patient is in the precontemplation stage of change. What should be the physician's aim?"
    back: "Encourage patient to consider the possibility of change\n\nIn precontemplation, patients are not yet considering change, so raising awareness is the first step."
    difficulty: medium
    tags: [behavioural change, stages of change, motivational interviewing, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "A patient is in the contemplation stage of change. What is the physician's aim?"
    back: "Help the patient weigh pros and cons of behaviour change\n\nContemplation involves ambivalence about change; the physician should help explore motivations and barriers."
    difficulty: medium
    tags: [behavioural change, stages of change, motivational interviewing, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "A patient is in the preparation stage of change. What should the physician do?"
    back: "Assist the patient in developing a concrete action plan\n\nIn preparation, patients are ready to act; a specific plan helps them move to action."
    difficulty: medium
    tags: [behavioural change, stages of change, action plan, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "A patient is in the action stage of change. What should be the physician's role?"
    back: "Provide positive reinforcement and support to maintain new behaviour\n\nAction stage requires reinforcement to prevent relapse; celebrate successes and address challenges."
    difficulty: medium
    tags: [behavioural change, stages of change, behaviour maintenance, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended interval for FOBT (gFOBT or FIT) screening in average-risk colorectal cancer screening?"
    back: "Every 2 years\n\nFIT/gFOBT should be performed every 2 years for average-risk adults per Canadian guidelines."
    difficulty: easy
    tags: [colorectal cancer, FOBT, FIT, screening interval, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended interval for flexible sigmoidoscopy in colorectal cancer screening?"
    back: "Every 10 years\n\nFlexible sigmoidoscopy can be performed every 10 years as an alternative to FOBT."
    difficulty: easy
    tags: [colorectal cancer, sigmoidoscopy, screening interval, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "In the Ontario cervical screening pathway, what is the management for ASCUS (atypical squamous cells of unknown significance) with negative HPV?"
    back: "Return to cytology screening every 3 years\n\nASCUS with negative HPV is low risk and returns to routine screening interval."
    difficulty: medium
    tags: [cervical cancer, screening, ASCUS, HPV, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "In the Ontario cervical screening pathway, what is the management for ASCUS with positive HPV?"
    back: "Refer for colposcopy\n\nASCUS with oncogenic HPV positivity requires colposcopic evaluation due to higher risk."
    difficulty: medium
    tags: [cervical cancer, screening, ASCUS, HPV, colposcopy, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is overdiagnosis in the context of cancer screening?"
    back: "Detection of cancers that would never have caused symptoms or death during the patient's lifetime\n\nOverdiagnosis leads to unnecessary treatment and harms without benefit, a key concern in PSA screening."
    difficulty: medium
    tags: [overdiagnosis, cancer screening, harms, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the prevalence of diabetes in Canada?"
    back: "Up to 10% of Canadians\n\nDiabetes is a major health concern affecting approximately 10% of the Canadian population."
    difficulty: easy
    tags: [diabetes, epidemiology, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Why is the incidence of T2DM rising?"
    back: "Increasing obesity, sedentary lifestyle, and aging population\n\nModifiable lifestyle factors are major contributors to the rising T2DM incidence worldwide."
    difficulty: easy
    tags: [diabetes, T2DM, epidemiology, risk factors, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How does diabetes affect mortality in Canadian adults?"
    back: "Canadian adults with DM are twice as likely to die prematurely compared to persons without DM\n\nDiabetes significantly increases cardiovascular mortality and all-cause mortality risk."
    difficulty: easy
    tags: [diabetes, mortality, epidemiology, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the macrovascular complications of diabetes?"
    back: "Coronary artery disease (CAD), cerebrovascular disease (CVD), peripheral vascular disease (PVD)\n\nMacrovascular complications are the leading cause of mortality in diabetes patients."
    difficulty: easy
    tags: [diabetes, complications, cardiovascular, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the SMART framework for diabetes management?"
    back: "S: Screening, M: Medications, A: Assessment/Agents, R: Resources, T: Team/Treatment\n\nSMART provides a structured approach to comprehensive diabetes care and management."
    difficulty: medium
    tags: [diabetes, management, framework, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "According to the 2016 Canadian Task Force guidelines, what is the recommended colorectal cancer screening for adults ages 60-74?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (strong recommendation)\n\nThe Canadian Task Force recommends FOBT q2yr or flexible sigmoidoscopy q10yr for ages 60-74 with moderate quality evidence."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive medicine, Canadian guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to 2014 Canadian Task Force guidelines, should men ages 55-69 be screened for prostate cancer with PSA?"
    back: "No - recommend not screening with PSA test (weak recommendation); clinicians should discuss risks and benefits with each patient\n\nPotential small benefit is outweighed by significant harms including bleeding, infection, urinary incontinence, false positives, and overdiagnosis."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to 2014 Canadian Task Force guidelines, what is the recommendation for PSA screening in men ages 70 and older?"
    back: "Strong recommendation not to screen for prostate cancer with PSA test\n\nThere is no evidence that PSA screening reduces mortality in men 70+, while there is evidence of harms."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the strongest preventive strategy in medicine according to health promotion principles?"
    back: "Health promotion is the most effective preventive strategy\n\nInitial steps should include respectfully exploring patient values and being guided by their stage of change."
    difficulty: easy
    tags: [health promotion, preventive medicine, motivational interviewing, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended FIT screening interval for average-risk colorectal cancer screening in Ontario?"
    back: "Every 2 years\n\nFIT (fecal immunochemical test) has replaced guaiac FOBT and is performed q2yr for average-risk adults."
    difficulty: easy
    tags: [colorectal cancer, FIT, screening, Ontario, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended flexible sigmoidoscopy interval for colorectal cancer screening?"
    back: "Every 10 years\n\nFlexible sigmoidoscopy q10yr is an acceptable alternative to FOBT for average-risk CRC screening."
    difficulty: easy
    tags: [colorectal cancer, sigmoidoscopy, screening, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to the 2016 Canadian Task Force, at what age should colorectal cancer screening stop?"
    back: "Age 75 - recommend not screening adults ages 75+ (weak recommendation, low quality evidence)\n\nThe harm-benefit ratio changes with advancing age, leading to recommendation against screening in older adults."
    difficulty: easy
    tags: [colorectal cancer, screening, elderly, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "Should FIT be used for symptomatic patients being evaluated for colorectal cancer?"
    back: "No - do not use FIT for symptomatic patients\n\nFIT is only appropriate for asymptomatic screening. Symptomatic patients require specialist evaluation."
    difficulty: easy
    tags: [colorectal cancer, FIT, screening, symptoms, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "Does adding fibrate therapy to statin therapy reduce major CV events in patients with T2DM?"
    back: "No. The ACCORD Lipid trial (n=5518) found no significant difference in major CV events when adding fibrate to statin therapy in T2DM patients.\n\nThis double-blinded RCT with 4.7-year follow-up showed no difference in primary outcome (composite of nonfatal MI, nonfatal stroke, or CV death) or all-cause mortality."
    difficulty: medium
    tags: [diabetes, dyslipidemia, T2DM, clinical-trials, ACCORD, fibrates, statins, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What are the key components of fever history to document?"
    back: "Peak temperature, thermometer type, measurement site, duration, time of day, and response to antipyretics\n\nDocumenting fever pattern helps differentiate between infection and inflammatory conditions."
    difficulty: easy
    tags: [fever, history taking, clinical skills, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the non-pharmacological treatments for fever?"
    back: "Increase fluid intake, sponge bath, light clothing\n\nThese measures help dissipate heat and prevent dehydration from insensible losses."
    difficulty: easy
    tags: [fever, treatment, supportive care, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the screening test for hearing loss in adults?"
    back: "Whispered-voice test (stands 0.6m behind patient, whispers 6 letters/numbers, tests one ear at a time)\n\nThis simple test can detect significant hearing loss in the primary care setting."
    difficulty: easy
    tags: [hearing, screening, clinical skills, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the treatment options for hearing amplification?"
    back: "Hearing aids, assistive listening devices, and cochlear implants\n\nThese interventions can dramatically improve quality of life for those with hearing disability."
    difficulty: easy
    tags: [hearing, treatment, rehabilitation, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What counseling points should be provided for hearing loss prevention?"
    back: "Noise control and hearing protection programs\n\nHigh-quality evidence supports noise avoidance for preventing noise-induced hearing loss."
    difficulty: easy
    tags: [hearing, prevention, counseling, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the prevalence of hearing loss by age?"
    back: "6% of 35-44 year olds, 43% of 65-84 year olds; 90% of age-related hearing loss (presbycusis) is sensorineural\n\nPrevalence increases dramatically with age. Hearing loss detectable by audiology affects >1/3 of people over 65."
    difficulty: easy
    tags: [hearing, epidemiology, presbycusis, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What screening tests are used for hearing assessment?"
    back: "Whispered-voice test (6 letters/numbers at 0.6m behind patient, one ear at a time), Rinne and Weber tuning fork tests (distinguish conductive vs sensorineural), formal audiologic assessment (pure tone, speech audiometry, impedance audiometry)\n\nScreening tests identify patients needing formal audiological evaluation."
    difficulty: medium
    tags: [hearing, screening, assessment, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What distinguishes primary from secondary headaches?"
    back: "Primary: no underlying organic disease; Secondary: caused by underlying life-threatening pathology\n\nSecondary headaches account for <10% but must be ruled out before diagnosing primary."
    difficulty: easy
    tags: [headache, classification, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the definition of hearing impairment vs disability?"
    back: "Impairment: raised hearing threshold in decibels; Disability: impairment interfering with daily tasks\n\nDistinction important for determining need for rehabilitation and assistive devices."
    difficulty: easy
    tags: [hearing, classification, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What screening tests assess hearing?"
    back: "Whispered-voice test (0.6m behind patient, repeat 6 letters/numbers), Rinne and Weber tuning fork tests\n\nSimple office tests differentiate conductive from sensorineural hearing loss."
    difficulty: medium
    tags: [hearing, screening, examination, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are treatment options for hearing loss?"
    back: "Hearing aids, assistive listening devices, cochlear implants\n\nAmplification devices dramatically improve quality of life for appropriate candidates."
    difficulty: easy
    tags: [hearing, treatment, rehabilitation, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What infectious contacts should be asked about in fever history?"
    back: "Travel history, camping, daycare, TB contact, foodborne illness exposure, animal exposure\n\nExposure history helps identify source and guide investigations for unusual infections."
    difficulty: medium
    tags: [fever, history, exposure, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the prevalence of hearing loss by age group?"
    back: "6% of 35-44 year olds, 43% of 65-84 year olds\n\nPrevalence increases dramatically with age; 90% of age-related hearing loss (presbycusis) is sensorineural."
    difficulty: easy
    tags: [hearing, epidemiology, presbycusis, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What tuning fork tests are used to distinguish hearing loss types?"
    back: "Rinne test and Weber test\n\nRinne compares air vs bone conduction; Weber lateralizes to the affected ear in conductive loss or the normal ear in sensorineural loss."
    difficulty: medium
    tags: [hearing, clinical skills, diagnosis, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the treatment options for hearing loss?"
    back: "Hearing amplification (hearing aids), assistive listening devices, and cochlear implants\n\nThese interventions can dramatically improve quality of life for patients with hearing impairment."
    difficulty: easy
    tags: [hearing, treatment, rehabilitation, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the recommended colorectal cancer screening test for average-risk adults ages 60-74 according to 2016 Canadian Task Force guidelines?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years\n\nStrong recommendation with moderate quality evidence for ages 60-74. FIT has replaced guaiac FOBT."
    difficulty: easy
    tags: [colorectal cancer, screening, prevention, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "At what age does the Canadian Task Force recommend NOT screening for colorectal cancer?"
    back: "Age 75 and older\n\nWeak recommendation with low quality evidence for adults age 75 and older."
    difficulty: easy
    tags: [colorectal cancer, screening, prevention, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "Should FIT be used for symptomatic patients being screened for colorectal cancer?"
    back: "No - do not use FIT for symptomatic patients\n\nFIT should not be used for symptomatic patients. Refer symptomatic patients (e.g., rectal bleeding) or those with anemia to specialist for evaluation."
    difficulty: easy
    tags: [colorectal cancer, FIT, screening, diagnosis, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended PSA screening approach for men ages 55-69?"
    back: "Do not screen - discuss risks and benefits with each man in context of his preferences\n\nWeak recommendation with moderate quality evidence. Potential small benefit is outweighed by potential significant harms (bleeding, infection, incontinence, false positives, overdiagnosis)."
    difficulty: easy
    tags: [prostate cancer, PSA, screening, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to 2014 Canadian guidelines, at what ages is PSA screening NOT recommended?"
    back: "Under age 55 and age 70 and older\n\nStrong recommendation with low quality evidence for both age groups. No evidence that PSA reduces mortality in these ages."
    difficulty: easy
    tags: [prostate cancer, PSA, screening, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the most effective preventive strategy in health promotion?"
    back: "Health promotion\n\nHealth promotion is identified as the most effective preventive strategy in clinical practice."
    difficulty: easy
    tags: [health promotion, prevention, behaviour, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the quality of evidence for PSA screening recommendations in men ages 55-69?"
    back: "Moderate quality evidence\n\nThe recommendation against PSA screening in ages 55-69 is weak with moderate quality evidence, based on inconsistent evidence of small potential benefit and clear evidence of harms."
    difficulty: medium
    tags: [prostate cancer, PSA, screening, evidence, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the screening interval for FIT in average-risk colorectal cancer screening in Ontario?"
    back: "Every 2 years (biennial)"
    difficulty: easy
    tags: [colorectal cancer, FIT, screening, Ontario, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the interval for flexible sigmoidoscopy in colorectal cancer screening?"
    back: "Every 10 years\n\nFlexible sigmoidoscopy every 10 years is an acceptable alternative to FOBT/FIT for average-risk screening."
    difficulty: easy
    tags: [colorectal cancer, sigmoidoscopy, screening, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended colorectal cancer screening method for average-risk adults ages 60-74 according to the 2016 Canadian Task Force?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (strong recommendation)\n\nThe 2016 Canadian Task Force recommends FOBT q2yr or flexible sigmoidoscopy q10yr for ages 60-74 with moderate quality evidence."
    difficulty: easy
    tags: [colorectal cancer, screening, guidelines, FOBT, sigmoidoscopy, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the Ontario Cervical Screening Program recommendation for women age ≥25?"
    back: "Screening q3yr if cytology normal (for those who are or have ever been sexually active)\n\nOntario recommends screening every 3 years for women 25+ who are or have ever been sexually active, if cytology is normal."
    difficulty: medium
    tags: [cervical cancer, screening, Ontario, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the prostate cancer screening recommendation for men ages 55-69?"
    back: "Recommend NOT screening with PSA test (weak recommendation); clinicians should discuss risks/benefits\n\nThe potential small benefit from PSA screening is outweighed by potential harms (bleeding, infection, incontinence, false positives, overdiagnosis)."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the prostate cancer screening recommendation for men age ≥70?"
    back: "Recommend NOT screening with PSA test (strong recommendation, low quality evidence)\n\nThere is no evidence that PSA screening reduces mortality in men ≥70, but there is evidence of harms."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, elderly, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "According to the Toronto Notes, what is considered the most effective preventive strategy?"
    back: "Health promotion\n\nHealth promotion is identified as the most effective preventive strategy in family medicine."
    difficulty: easy
    tags: [health promotion, prevention, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What framework should guide discussions around healthy behaviours with patients?"
    back: "The patient's present stage of change\n\nIt is helpful to be guided by a patient's stage of change when having discussions about healthy behaviours."
    difficulty: easy
    tags: [behaviour change, stages of change, motivational interviewing, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the physician's aim when the patient is in the Pre-Contemplation stage of change?"
    back: "Encourage patient to consider the possibility of change\n\nIn Pre-Contemplation, the physician's aim is to encourage the patient to consider the possibility of making a change."
    difficulty: medium
    tags: [motivational interviewing, behaviour change, stages of change, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "For average-risk adults ages 50-59, what is the strength of recommendation for CRC screening with FOBT or flexible sigmoidoscopy?"
    back: "Weak recommendation (moderate quality evidence)\n\nFor ages 50-59, screening with FOBT q2yr or flexible sigmoidoscopy q10yr is a weak recommendation, unlike ages 60-74 where it is strong."
    difficulty: medium
    tags: [colorectal cancer, screening, guidelines, evidence, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended follow-up for a patient discharged from colposcopy with negative HPV result?"
    back: "Return to cytology screening every 3 years\n\nPatients with negative HPV at discharge from colposcopy should return to routine cytology screening every 3 years."
    difficulty: medium
    tags: [cervical cancer, colposcopy, HPV, follow-up, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What symptoms suggest URTI as the cause of fever?"
    back: "Cough, coryza, ear pain (consider influenza or COVID-19)\n\nUpper respiratory tract infections are common causes of fever. Influenza and COVID-19 should be considered, especially during respiratory virus seasons."
    difficulty: easy
    tags: [fever, URTI, infection, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What symptoms suggest UTI/pyelonephritis as the cause of fever?"
    back: "Dysuria, foul-smelling urine, incontinence, frequency, hematuria, flank pain\n\nUrinary tract infections and pyelonephritis present with lower urinary symptoms plus flank pain. Fever indicates possible upper UTI or pyelonephritis."
    difficulty: easy
    tags: [fever, UTI, infection, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the diagnostic tests for hearing loss evaluation?"
    back: "Pure tone, air, and bone conduction testing; speech audiometry; impedance audiometry\n\nFormal audiologic assessment provides detailed information about type and degree of hearing loss to guide management."
    difficulty: easy
    tags: [hearing, investigations, audiology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the modifiable risk factors for osteoporosis?"
    back: "Glucocorticoid use (prednisone dose >5 mg daily), current smoking, alcohol >3 drinks/d, low body mass index <20 kg/m²\n\nModifiable risk factors should be addressed through lifestyle modifications and medication review to reduce fracture risk."
    difficulty: easy
    tags: [osteoporosis, risk-factors, modifiable, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended calcium intake for adults over 50 years?"
    back: "1200 mg per day\n\nAdequate calcium intake is essential for maintaining bone health, with higher requirements for older adults."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended exercise regimen for osteoporosis prevention and management?"
    back: "Balance and muscle-strengthening exercises more than twice weekly\n\nRegular exercise improves balance and strength, reducing fall risk and helping maintain bone density."
    difficulty: easy
    tags: [osteoporosis, exercise, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the most common STI in Canada?"
    back: "Chlamydia\n\nChlamydia is the most commonly reported STI in Canada, followed by gonorrhea."
    difficulty: easy
    tags: [STI, chlamydia, epidemiology, Canada, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the STI screening recommendations for sexually active individuals under 30?"
    back: "Annual screening for gonorrhea and chlamydia\n\nYoung sexually active individuals have higher rates of these infections and should be screened annually."
    difficulty: easy
    tags: [STI, screening, guidelines, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the Pap test screening recommendation for individuals with a cervix?"
    back: "Every 3 years for anyone aged 25 to 69 who has ever been sexually active\n\nRegular Pap testing detects cervical dysplasia and early cervical cancer, primarily caused by HPV."
    difficulty: easy
    tags: [STI, Pap-test, cervical-cancer, screening, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended HPV vaccine (Gardasil⁹) indication?"
    back: "Females between ages 9 to 27, and women ≥27 if at risk of ongoing exposure\n\nGardasil⁹ protects against HPV types causing most cervical cancers and genital warts."
    difficulty: easy
    tags: [STI, HPV, vaccination, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "List the rare STIs mentioned in Toronto Notes"
    back: "Chancroid, granuloma inguinale, lymphogranuloma venereum\n\nThese tropical STIs are rare in Canada but may be seen in travelers or specific populations."
    difficulty: easy
    tags: [STI, rare, tropical, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the calcium content of 1 cup of yogurt?"
    back: "332 mg\n\nYogurt provides slightly more calcium than milk per serving."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the calcium content of 3 oz canned salmon with bones?"
    back: "240 mg\n\nCanned salmon with bones is a good calcium source, particularly for those who avoid dairy."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the second most common STI in Canada?"
    back: "Gonorrhea\n\nAfter chlamydia, gonorrhea is the second most commonly reported STI in Canada."
    difficulty: easy
    tags: [STI, gonorrhea, Canada, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What fall risk assessment methods are mentioned for osteoporosis patients?"
    back: "Ability to get up from chair without support with arms, and walking several steps and return\n\nThese functional assessments help identify patients at increased fall risk who need intervention."
    difficulty: easy
    tags: [osteoporosis, fall-risk, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the daily calcium requirement for adults age 50-64?"
    back: "1000 mg/day\n\nCalcium needs increase with age to maintain bone health and prevent osteoporosis."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the daily calcium requirement for adults over age 65?"
    back: "1200 mg/day\n\nOlder adults require higher calcium intake due to decreased intestinal absorption and increased bone loss."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the calcium content of 1/2 cup of yogurt?"
    back: "332 mg\n\nYogurt provides calcium and protein, supporting bone health."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "List 5 common STIs"
    back: "Chlamydia, gonorrhea, HPV, genital herpes\n\nThese are the most frequently encountered STIs in clinical practice."
    difficulty: easy
    tags: [STI, epidemiology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "List 3 rare STIs"
    back: "Chancroid, granuloma inguinale, lymphogranuloma venereum\n\nThese tropical infections are rarely seen in Canada but should be considered in travelers."
    difficulty: medium
    tags: [STI, rare, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended Pap test screening schedule for those with a cervix aged 25-69?"
    back: "Every 3 years for anyone who has ever been sexually active\n\nPap testing detects cervical dysplasia from HPV infection."
    difficulty: easy
    tags: [STI, HPV, screening, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "Which populations should be screened annually for gonorrhea and chlamydia?"
    back: "All sexually active people under 30 years old\n\nYoung sexually active individuals have the highest STI rates."
    difficulty: easy
    tags: [STI, screening, chlamydia, gonorrhea, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What type of exercise is recommended for osteoporosis prevention?"
    back: "Balance and muscle-strengthening exercises more than twice weekly\n\nWeight-bearing and resistance exercise improve bone density and reduce fall risk."
    difficulty: easy
    tags: [osteoporosis, prevention, exercise, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What foods are recommended for bone health?"
    back: "Foods rich in calcium and protein\n\nAdequate protein intake preserves muscle mass and bone health."
    difficulty: easy
    tags: [osteoporosis, nutrition, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the 5 Rs framework for motivational intervention in smoking cessation?"
    back: "Relevance, Risks, Rewards, Roadblocks, Repetition\n\nThis framework guides brief interventions: relevance to patient, risks of smoking, rewards of quitting, roadblocks to quitting, and repeated encouragement."
    difficulty: medium
    tags: [smoking-cessation, motivational-interviewing, counseling, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What baseline investigations are recommended in alcohol use disorder?"
    back: "GGT, MCV, AST, ALT, CBC, INR\n\nThese tests assess liver function, hematologic effects, and help monitor for complications of alcohol use."
    difficulty: medium
    tags: [alcohol, investigations, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the definition of hearing impairment vs. disability?"
    back: "Impairment: raised hearing threshold measured in dB loss; Disability: impairment interfering with daily tasks\n\nImpairment is a measurable deficit; disability reflects functional impact."
    difficulty: easy
    tags: [hearing, definition, classification, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the UTI/pyelonephritis symptoms to ask about in fever history?"
    back: "Dysuria, foul-smelling urine, incontinence, frequency, hematuria, flank pain\n\nUTI is a common cause of fever, especially in children and women."
    difficulty: easy
    tags: [fever, UTI, symptoms, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the recommended daily calcium intake for adults over 50 years?"
    back: "1200 mg/day for adults over 50 years\n\nAdequate calcium intake is essential for bone health and osteoporosis prevention."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the most common STIs in Canadian clinical practice?"
    back: "Chlamydia (most common), gonorrhea (2nd most common), HPV, genital herpes\n\nThese infections have the highest prevalence and require routine screening in at-risk populations."
    difficulty: easy
    tags: [STI, epidemiology, Canada, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the rare STIs mentioned in Toronto Notes?"
    back: "Chancroid, granuloma inguinale, lymphogranuloma venereum\n\nThese tropical infections are rare in Canada but may be seen in travelers or specific populations."
    difficulty: easy
    tags: [STI, rare-infections, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended annual STI screening for sexually active people under 30?"
    back: "Annual screening for gonorrhea and chlamydia\n\nThese infections are most prevalent in younger sexually active populations and can cause long-term complications if untreated."
    difficulty: easy
    tags: [STI, chlamydia, gonorrhea, screening, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the key principle in STI management regarding prevention vs. treatment?"
    back: "Primary prevention is vastly more effective than treating STIs and their sequelae\n\nPrevention through vaccination, education, and barrier protection is more effective than treatment of established infections."
    difficulty: easy
    tags: [STI, prevention, management, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What glucocorticoid dose is considered a risk factor for osteoporosis?"
    back: "Prednisone dose >5 mg daily\n\nGlucocorticoids at this dose significantly increase bone loss and fracture risk."
    difficulty: easy
    tags: [osteoporosis, glucocorticoids, risk-factors, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the daily calcium requirements by age group in Canada?"
    back: "Age 50-64: 1000mg/day; Age 65-69 with 1 risk factor: 1200mg/day; Age >70 with no risk factors: 1000mg/day; Age >70 with risk factors: 1500mg/day\n\nCalcium requirements increase with age and risk factors."
    difficulty: medium
    tags: [osteoporosis, calcium, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "List the four most common STIs in Canada"
    back: "Chlamydia (most common), Gonorrhea (2nd most common), HPV, Genital herpes\n\nThese are the four most common STIs in Canada."
    difficulty: easy
    tags: [STI, epidemiology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are three rare STIs?"
    back: "Chancroid, granuloma inguinale, lymphogranuloma venereum\n\nThese are rare STIs but important to recognize in specific clinical scenarios."
    difficulty: medium
    tags: [STI, epidemiology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended STI screening frequency for people under 30?"
    back: "Annual screening for all sexually active people under 30 for gonorrhea and chlamydia\n\nYoung sexually active individuals have highest STI rates and should be screened annually."
    difficulty: easy
    tags: [STI, screening, guidelines, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What key elements should be obtained in a fever history regarding the fever pattern?"
    back: "Peak temperature, type of thermometer, site of measurement, duration, time of day, response to antipyretics\n\nDetailed fever history includes peak temperature, thermometer type, measurement site, duration, timing, and antipyretic response."
    difficulty: easy
    tags: [Fever, History, Assessment, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the first step in managing a patient with fever?"
    back: "Increase fluid intake\n\nManagement begins with increasing fluid intake to prevent dehydration, along with general measures like light clothing and antipyretics."
    difficulty: easy
    tags: [Fever, Management, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "When are investigations indicated for headache?"
    back: "Only when red flags are present\n\nHeadache investigations are indicated only when red flags are present to rule out serious intracranial pathology."
    difficulty: easy
    tags: [Headache, Investigations, Red Flags, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the management approach for headaches?"
    back: "Based on underlying disorder; analgesics may provide symptomatic relief\n\nHeadache management is directed at the underlying cause; symptomatic relief with analgesics may be used while addressing etiology."
    difficulty: easy
    tags: [Headache, Management, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What counseling is recommended for patients with hearing loss?"
    back: "Noise control and hearing protection programs\n\nCounseling about noise control and hearing protection programs has high-quality evidence supporting its benefit."
    difficulty: easy
    tags: [Hearing, Prevention, Counseling, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the diagnostic tests for formal audiologic assessment?"
    back: "Pure tone air and bone conduction testing, speech audiometry, impedance audiometry\n\nFormal audiologic assessment includes pure tone testing (air and bone), speech audiometry, and impedance audiometry."
    difficulty: easy
    tags: [Hearing, Investigations, Audiology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the prevalence of osteoporosis in Canada?"
    back: "1 in 4 women and 1 in 8 men\n\nOsteoporosis affects approximately 25% of Canadian women and 12.5% of Canadian men."
    difficulty: easy
    tags: [osteoporosis, epidemiology, canada, prevalence, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "How much calcium does 1 cup of yogurt contain?"
    back: "332 mg\n\nYogurt provides slightly more calcium per cup than milk."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, food-sources, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "How much calcium does 3 oz of canned salmon with bones contain?"
    back: "240 mg\n\nCanned fish with soft bones are good non-dairy calcium sources."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, food-sources, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the most common STIs in Canada?"
    back: "Chlamydia (most common), gonorrhea (2nd most common), HPV, genital herpes\n\nThese represent the highest burden of STI in Canadian clinical practice."
    difficulty: easy
    tags: [sti, epidemiology, canada, common, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What HPV vaccine is recommended and for what age groups?"
    back: "Gardasil 9 - recommended for females ages 9-27, and women ≥27 if at risk of ongoing exposure\n\nGardasil 9 provides protection against HPV strains causing most cancers and genital warts."
    difficulty: easy
    tags: [sti, hpv, vaccination, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended Pap test screening schedule in Canada?"
    back: "Every 3 years for anyone with a cervix aged 25 to 69 who has ever been sexually active\n\nThis screening protocol detects precancerous cervical changes."
    difficulty: easy
    tags: [sti, hpv, cervical-cancer, screening, pap-test, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended frequency of balance and muscle-strengthening exercises for osteoporosis?"
    back: "More than twice weekly\n\nRegular exercise is essential for maintaining bone strength and preventing falls."
    difficulty: easy
    tags: [osteoporosis, exercise, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are neurologic complications of problem drinking?"
    back: "Wernicke-Korsakoff syndrome, peripheral neuropathy\n\nWernicke-Korsakoff is caused by thiamine deficiency, often seen in chronic alcoholics with malnutrition."
    difficulty: medium
    tags: [alcohol, complications, neurologic, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What interventions are recommended for a recent smoking cessation success?"
    back: "Congratulate success, encourage ongoing abstinence, review benefits and risks\n\nMinimal practice: congratulate, encourage continuation, and reinforce the benefits of remaining smoke-free."
    difficulty: easy
    tags: [smoking-cessation, intervention, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What prescriptive interventions help maintain smoking cessation?"
    back: "Address weight gain, negative mood, withdrawal, lack of support\n\nThese are common challenges during smoking cessation that require targeted intervention strategies."
    difficulty: easy
    tags: [smoking-cessation, intervention, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are indications for referral to inpatient alcohol treatment?"
    back: "Dangerous/unstable home environment, severe medical/psychiatric concern, addiction requiring inpatient detoxification, refractory to other treatments\n\nInpatient treatment is reserved for patients with severe dependence, comorbidities, or those who have failed outpatient management."
    difficulty: medium
    tags: [alcohol, treatment, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What roadblocks to quitting smoking should be addressed?"
    back: "Fear of withdrawal, weight gain, failure, lack of support\n\nIdentifying obstacles helps develop strategies to overcome them during the quitting process."
    difficulty: easy
    tags: [smoking-cessation, motivational-interviewing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What screening tests can be used to assess hearing?"
    back: "Whispered-voice test (stands 0.6m behind patient, whispers 6 letters/numbers, tests one ear at a time with masking) and Rinne/Weber tuning fork tests (distinguish conductive from sensorineural loss)\n\nThese are quick bedside tests to screen for and classify hearing loss."
    difficulty: medium
    tags: [hearing, screening, physical-exam, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the first-line treatment for mastitis?"
    back: "Cloxacillin 500 mg PO QID x 7 days (for S. aureus), OR cephalexin 500 mg PO QID x 7 days (for S. pyogenes)\n\nMastitis is typically caused by S. aureus or S. pyogenes. Antibiotics should cover penicillinase-producing staphylococci."
    difficulty: easy
    tags: [breast, mastitis, infection, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What was the conclusion of the HOPE-3 trial regarding statins?"
    back: "Rosuvastatin 10 mg daily in intermediate-risk patients without cardiovascular disease reduced LDL by 26.5% and significantly reduced vascular events (3.7% vs 4.8% placebo)\n\nHOPE-3 demonstrated that statin therapy benefits intermediate-risk patients even without established cardiovascular disease."
    difficulty: medium
    tags: [cholesterol, statins, clinical trial, HOPE-3, prevention, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the recommended daily calcium intake for adults aged 65-69 with no risk factors?"
    back: "1000 mg/day\n\nCanadian guidelines specify 1000 mg daily for adults 65-69 without risk factors, increasing to 1200 mg for those with risk factors or over 70."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
