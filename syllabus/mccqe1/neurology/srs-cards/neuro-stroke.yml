  - front: "What finding from the ACCORD trials is most relevant for clinical practice?"
    back: "Intensive BP control to <120 mmHg does not reduce major CV events (except stroke) but increases adverse events; adding fibrates to statins provides no additional CV benefit\n\nBoth ACCORD trials showed that more intensive interventions beyond standard targets do not improve primary cardiovascular outcomes in T2DM."
    difficulty: hard
    tags: [diabetes, blood-pressure, lipids, clinical-practice, clinical-trials, endocrinology, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Did intensive BP control in ACCORD reduce major CV events?"
    back: "No, except for stroke events\n\nNo significant difference in primary outcomes (nonfatal MI, stroke, CV death) or all-cause mortality, but significant reduction in any stroke (0.32%/yr vs 0.53%/yr, P=0.01)."
