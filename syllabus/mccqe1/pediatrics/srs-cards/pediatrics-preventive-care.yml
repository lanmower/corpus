# Pediatrics Preventive Care (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the leading causes of death from injury in children >1 year of age?"
    back: "Motor vehicle crashes, burns, drowning, falls, choking, and infanticide\n\nInjuries are the leading cause of death in children older than 1 year. Motor vehicle collisions are the #1 cause. Prevention counselling at each well-child visit (Rourke Baby Record) addresses age-specific hazards. Car seat use is mandatory in Ontario and is required before leaving hospital for newborns."
    difficulty: easy
    tags: [injury prevention, pediatrics, child safety, leading causes of death]
  - front: "What is the CPS position on routine male newborn circumcision?"
    back: "The Canadian Paediatric Society (CPS) states circumcision is NOT medically indicated and does NOT recommend routine circumcision for every newborn male. It is often performed for religious or cultural reasons.\n\nWhile circumcision has some potential benefits (slight reduction in UTI risk, STI including HIV, phimosis, balanitis, penile cancer), the CPS concludes these do not justify routine circumcision in otherwise healthy newborns. The procedure has a complication rate <1% (infection, bleeding, urethral injury, meatal stenosis) but complications are higher in older children vs. infants. It is contraindicated in the presence of genital abnormalities (e.g., hypospadias) or bleeding disorders."
    difficulty: easy
    tags: [circumcision, CPS guidelines, newborn, pediatrics]
  - front: "When does primary dentition erupt and how many teeth does a child have?"
    back: "Primary dentition: 20 teeth. First tooth (lower central incisor) erupts at 5-9 months, then 1 new tooth per month. By 1 year: 6-8 central teeth. Secondary (adult) dentition: 32 teeth; first adult tooth is 1st molar at age 6, then lower incisors.\n\nThe first dental assessment should occur 6 months after the first tooth erupts and certainly by 1 year (Grade B recommendation). Early dental assessment helps prevent early childhood caries, which is multifactorial (diet, bacteria, host, social determinants). The 6-year molar is often called the 'key to the dental arch' and is the first permanent tooth to erupt."
    difficulty: easy
    tags: [dentition, primary teeth, secondary teeth, pediatrics]
  - front: "What are the key prevention strategies for early childhood dental caries?"
    back: "No bottle at bedtime; clean teeth after last feed; no juice or sweetened pacifier; <3 yr: daily brushing with rice-grain sized fluoridated toothpaste; 3-6 yr: pea-sized fluoridated toothpaste with adult assistance; first dental visit by 1 year; no prolonged bottle feeding or putting to bed with bottle.\n\nEarly childhood caries (ECC) is the most common chronic disease of childhood. Inappropriate feeding practices are major modifiable risk factors: prolonged bottle feeding, bottle at bedtime (pools sugary liquid around teeth), excessive juice. Fluoridated toothpaste is recommended as soon as teeth emerge. Ontario's Healthy Smiles program supports low-income families' dental access."
    difficulty: easy
    tags: [dental caries, prevention, fluoride, pediatrics, oral health]
  - front: "What are the Canadian screen time guidelines for children by age group?"
    back: "Under 2 years: no screen time recommended. Ages 2-4 years: <1 hour/day. Ages 5-17 years: ≤2 hours/day. Physical activity: 1 hour/day for children with obesity.\n\nScreen time guidelines come from the Canadian Society for Exercise Physiology. Excessive screen time displaces physical activity, disrupts sleep, and is associated with obesity, behavioral problems, and developmental delays. For childhood obesity management, small sustainable changes in energy expenditure and intake are recommended (lose approximately 1 lb/month), with a long-term goal of maintaining BMI <85th percentile."
    difficulty: easy
    tags: [screen time, obesity, Canadian guidelines, pediatrics, physical activity]
  - front: "What household substances are most dangerous to children from a poisoning perspective, and what is the risk of alcohol?"
    back: "Dangerous substances: medications, illicit drugs, drain cleaners, furniture polish, insecticides, cosmetics, nail polish remover (acetone), automotive products. Alcohol: as little as 3 oz of hard liquor can kill a 2-year-old.\n\nUnintentional poisoning is a leading cause of injury in children. Children aged 1-4 years are at highest risk. Prevention involves storing all medications, chemicals, and household products in locked, child-resistant containers out of reach and sight. Chemicals should never be stored in beverage containers. Poison Control Centre (1-800-268-9017 in Ontario) should be contacted immediately for suspected ingestions."
    difficulty: easy
    tags: [poison prevention, pediatrics, injury prevention, alcohol toxicity]
  - front: "What injury prevention advice is most important for a 6-month-old infant?"
    back: "Never leave unattended on bed, changing table, or in tub; install stair barriers; discourage use of walkers; keep crib rails up; check water temperature before bathing; avoid co-sleeping; always position to sleep on back with no soft objects in crib (SIDS prevention); appropriate car seats; cover electrical outlets; supervise during feeding; unplug appliances when not in use.\n\nAt 6-12 months, infants become mobile (rolling, crawling, pulling to stand) and are at risk for falls, burns, and aspiration. Infant walkers are strongly discouraged as they cause falls (especially down stairs) and delay gross motor development. Car seats are mandatory. Co-sleeping increases SIDS risk substantially. 'Back to sleep' is the most effective SIDS prevention strategy."
    difficulty: easy
    tags: [injury prevention, 6 months, SIDS, car seats, walker, pediatrics]
