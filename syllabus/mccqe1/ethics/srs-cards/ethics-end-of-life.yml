# End-of-Life Care & MAID (Ethics) - generated from srs-mccqe1
cards:
  - front: "What is Medical Assistance in Dying (MAID) in Canada and who is eligible?"
    back: "MAID (Bill C-14, 2016; amended Bill C-7, 2021): adult with serious and incurable illness, disease, or disability; advanced state of irreversible decline; experiencing grievous and intolerable suffering (physical or psychological); grievous and irremediable condition — natural death need not be reasonably foreseeable\n\nMAID in Canada is the most comprehensive in the world. Exclusions: mental illness as sole underlying condition (planned eligibility 2024); non-therapeutic permanent disabilities; minors. Two assessors + 10-day reflection period. Optional for physicians (conscience exemption must ensure patient access to another provider)."
    difficulty: medium
    tags: [MAID, medical assistance in dying, Bill C-7, Canada, ethics]
  - front: "What is the difference between palliative sedation, palliative care, and MAID?"
    back: "Palliative sedation: sedation to unconsciousness to relieve refractory suffering at end of life (NOT intended to hasten death); Palliative care: comfort-focused care that may be concurrent with disease-directed treatment; MAID: physician actively ending patient's life at their explicit request\n\nDouble effect principle justifies palliative sedation and high-dose opioids for symptom control if the primary intent is comfort, not death acceleration. MAID requires explicit, capable, repeated request and meets legal eligibility criteria. Palliative sedation does not require MAID eligibility criteria."
    difficulty: hard
    tags: [palliative sedation, MAID, double effect principle, palliative care, ethics]
  - front: "What are the principles of good palliative care?"
    back: "Pain and symptom management, comfort-focused goals of care, psychosocial-spiritual support, advance care planning, family support (including bereavement), avoiding unnecessary interventions, patient-centered care\n\nCanadian Hospice Palliative Care Association (CHPCA): palliative care should begin at diagnosis for serious illness (concurrent with disease-directed treatment), not just at end of life. Early palliative care referral improves quality of life and may extend survival (NEJM Temel study)."
    difficulty: easy
    tags: [palliative care, end of life, CHPCA, advance care planning, ethics]
  - front: "A patient with terminal cancer has severe pain despite high-dose oral opioids. What options exist?"
    back: "Rotate opioids (incomplete cross-tolerance may improve analgesia), increase dose, add adjuvant analgesics (steroids, anticonvulsants, TCAs for neuropathic pain), consider interventional pain management (nerve blocks, epidural), palliative sedation for refractory suffering\n\nCHPCA guidelines: opioids are the cornerstone of cancer pain management. WHO analgesic ladder: non-opioids → weak opioids → strong opioids ± adjuvants. Opioids do not hasten death when used appropriately. Opiophobia and undertreatment of cancer pain are significant problems."
    difficulty: hard
    tags: [cancer pain, opioid rotation, palliative care, end of life, ethics]
  - front: "What are the ethical principles involved in withdrawing life-sustaining treatment?"
    back: "Withdrawing life-sustaining treatment (mechanical ventilation, dialysis, artificial nutrition) when: patient or SDM requests withdrawal, goals of care have shifted, or treatment is no longer in patient's best interests — ethically equivalent to not starting treatment (withholding)\n\nCanadian ethicists and the courts agree: there is no ethical or legal difference between withholding and withdrawing life support. Once started, treatment can be withdrawn. SDM must guide decisions for incapable patients using prior wishes or best interests. Palliative sedation may accompany ventilator withdrawal."
    difficulty: hard
    tags: [withdrawal of life support, withholding treatment, SDM, palliative care, ethics]
  - front: "What is prognostication and why is it important in end-of-life care?"
    back: "Prognostication: estimating likely disease course and life expectancy; important for: goals of care discussions, advance care planning, appropriate palliative care referral, avoiding unwanted aggressive interventions, and enabling final preparations\n\nClinicians systematically over-estimate prognosis in cancer and serious illness. Validated tools: PPS (Palliative Performance Scale), Surprise Question (\"Would I be surprised if this patient died in the next year?\"), PaP score. Honest communication improves decision-making and reduces aggressive end-of-life care."
    difficulty: medium
    tags: [prognostication, palliative care, goals of care, PPS, ethics]
  - front: "What are the signs of imminent death in the dying patient?"
    back: "Signs of imminent death (hours to days): Cheyne-Stokes or irregular breathing, mottled skin (livedo reticularis), cooling of extremities, Kussmaul breathing, gurgling respirations (death rattle), decreased consciousness, inability to swallow\n\nCHPCA End-of-Life Care Recommendations: family education about signs of dying reduces distress. Glycopyrrolate reduces death rattle (secretion management). Comfort measures: position for comfort, moist mouth care, discontinue vitals and monitoring, restrict unnecessary medications, reposition q4h."
    difficulty: easy
    tags: [imminent death, dying process, palliative care, family support, ethics]
  - front: "What is the role of truth-telling in communicating a serious diagnosis?"
    back: "Physicians are ethically and legally obligated to be truthful with patients who have capacity — withholding a diagnosis violates patient autonomy; frame truth compassionately, give information in digestible amounts, ensure follow-up support\n\nCMPA guidelines: cultural practices of withholding diagnosis from patients (common in some cultures) cannot override patient's right to know their diagnosis. However, physician can explore patient's information preferences (\"how much detail would you like me to share?\"). Third-party requests to withhold information must be addressed."
    difficulty: medium
    tags: [truth-telling, serious diagnosis, communication, autonomy, ethics]
  - front: "What are the obligations when a patient requests MAID but you have a conscientious objection?"
    back: "Physician must provide an effective referral to a provider who will provide MAID — refusing to provide referral violates the patient's Charter right to access a legal medical service\n\nCMA and provincial colleges: conscientious objection is a protected right but does not extend to obstructing patient access. Physician must provide all relevant clinical information to the patient and facilitate timely transfer of care. System must not allow conscientious objection to create barriers to access."
    difficulty: hard
    tags: [conscientious objection, MAID, effective referral, CMA, ethics]
  - front: "What is a goals of care conversation and what does it involve?"
    back: "Goals of care: exploring patient values, understanding prognosis, identifying treatment goals (cure, extend life, maintain function, quality of life, comfort) and matching treatment plan to goals — using SPIKES protocol for difficult conversations\n\nSPIKES protocol: Setting up, Perception (what does patient know/want to know), Invitation (how much detail), Knowledge (giving information), Empathy and Exploration, Strategy and Summary. CHPCA recommends goals of care conversations for all patients with serious illness."
    difficulty: medium
    tags: [goals of care, SPIKES protocol, advance care planning, palliative care, ethics]
  - front: "A 72-year-old man with COPD completed an advance directive 5 years ago stating 'no mechanical ventilation under any circumstances.' He now presents with a severe COPD exacerbation and is drowsy but arousable. He nods when asked if he wants to feel better. His daughter (SDM) insists on intubation. The advance directive was not updated after a mild MI last year. What governs here?\n\nA) The advance directive governs because it is the most recent written expression of his wishes\nB) The SDM's decision governs because the patient's nodding represents a new contemporaneous expression overriding the directive\nC) The advance directive governs only if the physician determines the current situation is exactly what the patient envisioned when signing it\nD) The advance directive is invalidated by failure to update after a significant health event\nE) The patient's current nodding constitutes valid consent for intubation and overrides the advance directive"
    back: "E) The patient's current nodding constitutes valid consent for intubation and overrides the advance directive\n\nA key principle: if a CAPABLE patient makes a contemporaneous decision, it takes precedence over a prior advance directive. The patient is arousable and nodding — this may represent current capable expression of preference for treatment. Physicians must assess whether he currently has capacity. If he does, his current wishes control. If he does not, the advance directive guides the SDM. The failure to update after the MI does not automatically invalidate the directive — but the nodding raises a critical question about present capacity."
    difficulty: hard
    tags: [Advance Directives, MCQ, Toronto Notes]
  - front: "Under Bill C-7 (2021 amendments to the Criminal Code regarding MAiD), which of the following BEST describes Track 2 eligibility?\n\nA) Natural death is foreseeable and there is an irremediable serious illness\nB) Natural death is NOT reasonably foreseeable, the person has a serious and incurable illness, disease, or disability, is in advanced decline, and experiences enduring physical or psychological suffering that cannot be relieved under acceptable conditions\nC) MAiD may be requested solely on the basis of mental illness as of March 2023\nD) The person must have exhausted all available treatments before applying\nE) The 10-day reflection period has been eliminated for all track 2 patients"
    back: "B) Natural death is NOT reasonably foreseeable, the person has a serious and incurable illness, disease, or disability, is in advanced decline, and experiences enduring physical or psychological suffering that cannot be relieved under acceptable conditions\n\nBill C-7 created two tracks. Track 1: natural death IS reasonably foreseeable (the 10-day reflection period was ELIMINATED here). Track 2: natural death is NOT reasonably foreseeable — requires additional safeguards: 90-day minimum assessment period, two independent assessors (one must have expertise in the relevant condition), serious and incurable illness causing enduring and intolerable suffering. As of March 2024, MAiD for mental illness ALONE was extended (not yet implemented). The 'exhausted all treatments' requirement was removed from Track 1 in C-7 but Track 2 requires consideration of alternative means."
    difficulty: hard
    tags: [Medical Assistance in Dying, MCQ, Toronto Notes]
  - front: "A physician receives a MAiD request from a 58-year-old woman with ALS who has clear decision-making capacity. The physician has a sincere conscientious objection to providing MAiD. What are the physician's obligations under Canadian professional standards?\n\nA) The physician may refuse all involvement, including referral, as conscientious objection is absolute\nB) The physician must provide MAiD regardless of personal beliefs as it is a legal medical procedure\nC) The physician may decline to provide MAiD but must provide an effective referral or transfer of care to ensure timely access\nD) The physician must refer only to another physician within the same specialty\nE) The physician is required to inform the patient that MAiD is not available at this institution"
    back: "C) The physician may decline to provide MAiD but must provide an effective referral or transfer of care to ensure timely access\n\nIn Canada, conscientious objection to MAiD is respected, but physicians retain an obligation to ensure patients receive TIMELY ACCESS to care. The standard (per CMA guidelines and most provincial colleges) is an 'effective referral' — actively connecting the patient with a willing provider or service, not merely suggesting they look elsewhere. In provinces like Ontario (CPSO), effective referral is explicitly required. Simply refusing and leaving the patient without recourse is unacceptable. The physician must not obstruct access."
    difficulty: hard
    tags: [Medical Assistance in Dying, MCQ, Toronto Notes]
  - front: "A patient with early-stage Alzheimer's disease has decision-making capacity today and wishes to create an advance request for MAiD to be administered in the future when she loses capacity. Which statement is MOST accurate regarding Canadian law as of 2024?\n\nA) Advance requests for MAiD are currently legally permitted in Canada following the C-7 amendments\nB) Advance requests for MAiD are NOT currently legally permitted in Canada — the assessments and consent must occur when the person still has capacity\nC) Advance requests are permitted only for patients with a terminal illness with less than 6 months prognosis\nD) Advance requests may be accepted if witnessed by a notary and two physicians\nE) A substitute decision-maker can request MAiD on behalf of an incapacitated patient"
    back: "B) Advance requests for MAiD are NOT currently legally permitted in Canada — the assessments and consent must occur when the person still has capacity\n\nAs of 2024, advance requests for MAiD are NOT legally permitted in Canada under the Criminal Code amendments — assessments and the final consent must occur while the person retains capacity. This is a significant gap for neurodegenerative diseases like Alzheimer's. Bill C-7 directed the government to study advance requests; Parliament has been debating expanding the law to permit them but as of 2024, legislation has not been passed. SDMs cannot request MAiD on behalf of an incapacitated person. This is a commonly tested MCCQE1 nuance."
    difficulty: hard
    tags: [Medical Assistance in Dying, MCQ, Toronto Notes]
  - front: "On the day of a scheduled MAiD procedure, the patient has received her pre-medication. Just before administration of the lethal medication, she states 'wait, I'm not sure.' She appears distressed. The practitioner should:\n\nA) Proceed as scheduled — pre-medication does not constitute withdrawal of consent and mild distress is expected\nB) Stop immediately and assess whether the patient is expressing a genuine withdrawal of consent or peri-procedural anxiety; MAiD cannot proceed if the patient withdraws consent\nC) Proceed unless the patient explicitly states 'I do not want to die today'\nD) Consult the second assessor before proceeding\nE) Delay 24 hours and reassess"
    back: "B) Stop immediately and assess whether the patient is expressing a genuine withdrawal of consent or peri-procedural anxiety; MAiD cannot proceed if the patient withdraws consent\n\nUnder Canadian MAiD legislation, the person may WITHDRAW their request at any time, including moments before the procedure. The expression 'I'm not sure' is ambiguous and could represent: (1) genuine withdrawal of consent, or (2) peri-procedural anxiety. The practitioner must STOP and explore this clearly. If there is any doubt about whether the patient still wants to proceed, MAiD cannot ethically or legally continue. Capacity and voluntary consent must be confirmed immediately before administration. Proceeding under ambiguity would constitute unlawful homicide."
    difficulty: hard
    tags: [Medical Assistance in Dying, MCQ, Toronto Notes]
  - front: "A 44-year-old person with treatment-resistant depression (TRD) and no other concurrent physical illness requests MAiD. They have capacity and have tried multiple medication regimens, ECT, and ketamine infusions. Under the current Canadian legal framework, which is MOST accurate?\n\nA) This person is eligible for MAiD now under Track 2 — mental illness is explicitly excluded from the eligibility criteria\nB) This person may be eligible under Track 2 if MAiD for mental illness has been implemented and all eligibility criteria are met, but as of March 2024 the implementation has been delayed\nC) This person qualifies because TRD meets the 'serious and incurable illness' criterion regardless of the mental illness exclusion\nD) This person cannot be assessed for MAiD as they are under 65\nE) MAiD may be provided only if TRD is accompanied by a concurrent physical illness"
    back: "B) This person may be eligible under Track 2 if MAiD for mental illness has been implemented and all eligibility criteria are met, but as of March 2024 the implementation has been delayed\n\nBill C-7 explicitly EXCLUDED mental illness as the sole underlying condition from MAiD eligibility (a temporary exclusion in s.241.2(2.1) of the Criminal Code). The original sunset date (March 17, 2023) was extended, then extended again to March 17, 2024, and then further delayed by Parliament pending a regulatory framework and training standards. As of 2024, MAiD for mental illness alone is NOT yet legally available despite being conceptually within the expanded framework. This is a rapidly evolving area — candidates must know the current status."
    difficulty: hard
    tags: [Medical Assistance in Dying, MCQ, Toronto Notes]
  - front: "An ICU team determines that continued mechanical ventilation for a 92-year-old patient with multi-organ failure is physiologically futile — the patient will not survive to hospital discharge regardless of intervention intensity. The family demands 'everything be done.' What is the most ethically and legally defensible position?\n\nA) The family's wishes take precedence — physicians must provide any treatment requested by a family\nB) The physician has no obligation to provide treatments that are physiologically futile; the family should be counselled but consent is not required to withdraw futile treatment\nC) The team must seek a court order before withdrawing mechanical ventilation\nD) Withdrawal requires unanimous consent from all family members\nE) A second opinion from another intensivist is mandatory before withdrawal can proceed"
    back: "B) The physician has no obligation to provide treatments that are physiologically futile; the family should be counselled but consent is not required to withdraw futile treatment\n\nPhysiologic futility means the treatment CANNOT achieve its intended physiologic effect. Unlike value-laden futility (where benefit is debated), physiologically futile treatment need not be provided even if the family demands it. Canadian courts (e.g., Rasouli v. Sunnybrook, now Cuthbertson v. Rasouli at the SCC) have established that in Ontario, a physician seeking to withdraw life support over family objection must go through the Consent and Capacity Board. However, the underlying ETHICAL principle is that physicians are not obligated to provide futile treatment. Jurisdictional specifics matter in exam questions."
    difficulty: hard
    tags: [End of Life, MCQ, Toronto Notes]
  - front: "Following the Supreme Court of Canada's decision in Cuthbertson v. Rasouli (2013), in Ontario, when a physician wishes to withdraw life support from an incapable patient over the objection of the SDM, the physician must:\n\nA) Proceed with withdrawal after notifying the family 48 hours in advance\nB) Obtain a court order from the Superior Court of Justice\nC) Apply to the Consent and Capacity Board for a determination\nD) Seek a second opinion from two independent physicians\nE) File a complaint with the CPSO to obtain authorization"
    back: "C) Apply to the Consent and Capacity Board for a determination\n\nIn Cuthbertson v. Rasouli, the SCC held that in Ontario, withdrawal of life support IS a 'treatment' under the Health Care Consent Act, and therefore requires either consent from the SDM or a ruling from the CONSENT AND CAPACITY BOARD (CCB) if the SDM refuses consent. This is Ontario-specific — other provinces may handle this differently. The CCB (not courts, not other physicians) is the mandated forum. This is a high-yield MCCQE1 legal fact about Ontario's unique framework."
    difficulty: hard
    tags: [End of Life, MCQ, Toronto Notes]
  - front: "A 66-year-old patient with metastatic pancreatic cancer has an advance directive explicitly refusing CPR. He is found pulseless in a hospital hallway and a nurse begins CPR before seeing the bracelet. Once the DNR order is identified, CPR is stopped after 2 minutes. The patient is resuscitated but suffers anoxic brain injury. Which legal/ethical framework applies to this error?\n\nA) The nurse committed assault by performing CPR against the advance directive\nB) The advance directive creates an absolute obligation to not resuscitate in all circumstances\nC) A valid DNR/advance directive refusing CPR must be honored; initiating CPR against a known directive without re-assessment may constitute battery\nD) The error is excusable because the directive was not immediately visible and constitutes a good faith exception\nE) No liability exists because CPR was ultimately stopped before completion"
    back: "C) A valid DNR/advance directive refusing CPR must be honored; initiating CPR against a known directive without re-assessment may constitute battery\n\nA valid, clearly documented DNR order in a hospital setting creates a legal obligation NOT to resuscitate. Initiating CPR against a known advance directive (once known) may constitute battery (unconsented touching). The 'good faith' exception may mitigate liability for the seconds before the directive was identified, but there is no general exception for system failures. The key teaching point: once the DNR is identified, CPR MUST STOP immediately. The institution bears responsibility for ensuring advance directives are prominently communicated at the bedside."
    difficulty: hard
    tags: [End of Life, MCQ, Toronto Notes]
  - front: "A palliative care physician titrates a patient's intravenous morphine to control intractable dyspnea, fully aware that doses sufficient to relieve symptoms may hasten death. The patient has capacity and has consented to the treatment. This clinical situation is best described by which ethical principle?\n\nA) This constitutes slow euthanasia and is illegal in Canada\nB) This is ethically justified under the principle of double effect, provided the intent is symptom relief, not death\nC) This requires a MAiD consultation as it involves intentional hastening of death\nD) This is acceptable only if the patient has a DNR order in place\nE) This requires consent from the patient's next of kin in addition to the patient"
    back: "B) This is ethically justified under the principle of double effect, provided the intent is symptom relief, not death\n\nThe DOCTRINE OF DOUBLE EFFECT (DDE) justifies actions with both a good and a potentially harmful effect when: (1) the action is not itself immoral, (2) the agent intends the good effect only, (3) the harmful effect is foreseen but not intended, and (4) the good effect is proportionate to the risk. Palliative sedation/opioid titration for symptom control is a classic application. It is LEGALLY and ETHICALLY distinct from MAiD because intent is relief of suffering, not death. Canadian courts and medical ethics support this distinction."
    difficulty: hard
    tags: [End of Life, MCQ, Toronto Notes]
  - front: "A 17-year-old with osteosarcoma and full decision-making capacity refuses limb-sparing surgery and chemotherapy, citing quality of life concerns. His parents consent on his behalf. He is cognitively intact, articulate about his values, and has received repeated counselling. In most Canadian jurisdictions, how should this be managed?\n\nA) Parental consent overrides the minor's refusal for life-saving treatment in all cases\nB) If the minor is assessed as a mature minor with capacity, his refusal carries legal weight and generally should be respected in most provinces\nC) Proceed with surgery as the parents' consent legally governs treatment decisions until age 18\nD) Seek a court order to override both the patient's refusal and the parents' consent\nE) Refer to psychiatry to rule out depression before accepting the refusal"
    back: "B) If the minor is assessed as a mature minor with capacity, his refusal carries legal weight and generally should be respected in most provinces\n\nWhile the mature minor doctrine is more nuanced when a minor refuses life-saving treatment, a 17-year-old with full capacity who articulates a coherent values-based refusal carries significant legal and ethical weight. In provinces without specific statutory age of consent (e.g., outside Quebec's s.14 threshold), courts have recognized mature minors' right to refuse even life-saving treatment (see AC v. Manitoba, 2009 SCC). Courts must balance the best interests standard against the mature minor's autonomy. Blanket parental override is inappropriate. Psychiatric consultation to assess decision-making quality (not to override) is reasonable but should not be used to coerce consent."
    difficulty: hard
    tags: [End of Life, MCQ, Toronto Notes]
  - front: "A capable patient with terminal lung cancer, in agreement with his family, requests a 'slow code' — a visually active but deliberately ineffective resuscitation attempt for the benefit of family members who cannot accept a full DNR. What is the most appropriate physician response?\n\nA) Agree, as this respects family wishes and avoids confrontation\nB) Slow codes are ethically impermissible as they involve deception and a breach of professional integrity\nC) Agree provided the patient has provided written consent\nD) This is acceptable only in acute care settings when family is present\nE) Refer the request to the hospital ethics committee for approval"
    back: "B) Slow codes are ethically impermissible as they involve deception and a breach of professional integrity\n\nSlow codes are almost universally condemned in medical ethics. They constitute DECEPTION of both the family (who believe a genuine resuscitation is occurring) and violate the physician's duty of honesty. They also involve delivering a medical intervention (CPR) that the physician knows to be purposeless, which itself raises ethical issues. The correct approach is compassionate, direct family communication about the prognosis and the rationale for a DNR order. Ethics consultation may assist in navigating family dynamics. A deceptive performance is never ethically justified."
    difficulty: hard
    tags: [End of Life, MCQ, Toronto Notes]
  - front: "What is the palliative approach to symptom management in end-of-life care?"
    back: "Pain: WHO ladder (non-opioid, weak opioid, strong opioid). Dyspnea: low-dose opioids, fan/air. Nausea: identify cause (haloperidol, metoclopramide, ondansetron). Delirium: haloperidol. Secretions: glycopyrrolate\n\nPalliative sedation: for refractory symptoms. Advance care planning: goals of care discussions, substitute decision-makers. MAID: eligible if grievous and irremediable medical condition (Criminal Code criteria updated 2021)."
    difficulty: medium
    tags: [palliative, end-of-life]
