# General (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What medication is used for variceal bleeding?"
    back: "Octreotide\n\nOctreotide reduces splanchnic blood flow and portal pressure to control variceal hemorrhage"
    difficulty: easy
    tags: [varices, GI bleed, treatment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the most common cause of GI bleed in chronic alcohol users?"
    back: "Gastritis\n\nAlcohol is a direct irritant to the gastric mucosa and impairs mucosal defense, making gastritis the most frequent cause of GI bleeding in chronic drinkers."
    difficulty: easy
    tags: [gastroenterology, alcohol, GI bleed, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the first-line treatment for variceal GI bleeding?"
    back: "Octreotide\n\nOctreotide reduces portal pressure by splanchnic vasoconstriction and is the first-line pharmacologic agent for variceal hemorrhage."
    difficulty: easy
    tags: [varices, GI bleed, treatment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is first-line treatment for variceal GI bleed?"
    back: "Octreotide\n\nOctreotide is the first-line pharmacological agent for variceal GI bleeding as it reduces portal pressure by splanchnic vasoconstriction."
    difficulty: easy
    tags: [variceal bleed, octreotide, GI bleed, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the recommended colorectal cancer screening modality for adults ages 60-74 at average risk?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years\n\nThe 2016 Canadian Task Force on Preventive Health Care recommends these screening options with strong recommendation and moderate quality evidence."
    difficulty: easy
    tags: [colorectal cancer, screening, gastroenterology, prevention, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommended colorectal cancer screening modality for average-risk adults ages 60-74 according to 2016 Canadian Task Force guidelines?"
    back: "FOBT (either gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years (strong recommendation)\n\nThe 2016 Canadian Task Force on Preventive Health Care recommends screening adults ages 60-74 with FOBT q2yr or flexible sigmoidoscopy q10yr as a strong recommendation with moderate quality evidence."
    difficulty: easy
    tags: [colorectal cancer, screening, gastroenterology, preventive medicine, FOBT, FIT, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What are the GI complications of problem drinking?"
    back: "Gastritis, dyspepsia, pancreatitis, liver disease, bleeds, diarrhea\n\nAlcohol is directly irritating to the GI tract and causes pancreatic and hepatic injury."
    difficulty: medium
    tags: [alcohol, complications, GI, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "List gastrointestinal complications of problem drinking"
    back: "Gastritis, dyspepsia, pancreatitis, liver disease, bleeds, diarrhea, oral esophageal issues\n\nAlcohol directly irritates the GI tract and causes significant hepatic and pancreatic damage."
    difficulty: easy
    tags: [alcohol, gastroenterology, complications, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the GI complications of alcohol use disorder?"
    back: "Gastritis, dyspepsia, pancreatitis, liver disease, bleeds, diarrhea\n\nAlcohol directly irritates the GI tract and pancreas, and chronic use leads to alcoholic hepatitis and cirrhosis."
    difficulty: medium
    tags: [alcohol, complications, gi, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are GI complications of problem drinking?"
    back: "Gastritis, dyspepsia, pancreatitis, liver disease, bleeds, diarrhea\n\nAlcohol irritates the GI mucosa and is a common cause of pancreatitis and alcoholic liver disease."
    difficulty: easy
    tags: [alcohol, complications, GI, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the appropriate management for non-erosive esophagitis (NERD)?"
    back: "On-demand therapy with antacids (Mg(OH)2, Al(OH)3), alginate, H2-blockers, or PPIs\n\nNERD patients may not require continuous PPI therapy and can use on-demand treatment for symptom control, as disease progression is less likely."
    difficulty: medium
    tags: [NERD, treatment, gastroenterology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the most common bacterial cause of diarrhea in Canada?"
    back: "Campylobacter jejuni\n\nCampylobacter is the most common bacterial cause of diarrhea in Canada, often associated with consuming undercooked poultry."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, bacteria, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which pathogen causes emetic syndrome with a short incubation of 1-6 hours?"
    back: "Bacillus cereus (Type A)\n\nB. cereus Type A causes emetic syndrome from preformed exotoxin in rice dishes with a very short 1-6 hour incubation."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, bacteria, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common cause of traveler's diarrhea?"
    back: "Enterotoxigenic E. coli (ETEC)\n\nETEC produces heat-labile and heat-stable toxins and accounts for the majority of traveler's diarrhea cases."
    difficulty: easy
    tags: [gastroenterology, travelers-diarrhea, bacteria, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which pathogen is associated with Guillain-Barré syndrome?"
    back: "Campylobacter jejuni\n\nCampylobacter jejuni infection is a common trigger for Guillain-Barré syndrome due to molecular mimicry."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, neurology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which pathogen causes massive watery diarrhea (1-3 L/day)?"
    back: "Vibrio cholerae\n\nVibrio cholerae causes cholera, characterized by massive watery diarrhea; mortality is <1% with proper treatment."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, cholera, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for Vibrio cholerae?"
    back: "Tetracycline or fluoroquinolones (e.g., ciprofloxacin)\n\nAntibiotics reduce duration and fluid requirements; tetracycline and ciprofloxacin are effective treatments."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, treatment, cholera, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What pathogen has a very low infectious dose (very small inoculum needed)?"
    back: "Shigella\n\nShigella requires a very small inoculum for infection; it causes bloody diarrhea and can lead to toxic megacolon."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, shigella, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first-line treatment for Shigella?"
    back: "Fluoroquinolones\n\nFluoroquinolones are the treatment of choice for Shigella dysentery; antidiarrheals may increase toxic megacolon risk."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for Salmonella typhi (typhoid fever)?"
    back: "Ceftriaxone, ciprofloxacin, or azithromycin\n\nEmpiric treatment for enteric fever includes ceftriaxone, ciprofloxacin, or azithromycin; fluoroquinolone resistance is increasing."
    difficulty: hard
    tags: [gastroenterology, infectious-diarrhea, treatment, typhoid, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which protozoan causes 'beaver fever' and is associated with daycare and untreated water?"
    back: "Giardia lamblia\n\nGiardia is transmitted fecal-oral via contaminated food/water; treatment is metronidazole or nitazoxanide."
    difficulty: easy
    tags: [gastroenterology, parasitic-diarrhea, giardia, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for Giardia lamblia?"
    back: "Metronidazole or nitazoxanide\n\nTreatment of symptomatic Giardia infection; treatment of asymptomatic carriers is NOT recommended."
    difficulty: medium
    tags: [gastroenterology, parasitic-diarrhea, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which parasite can cause liver abscess if untreated?"
    back: "Entamoeba histolytica\n\nEntamoeba histolytica can cause amoebic liver abscess if untreated; treated with metronidazole followed by iodoquinol or paromomycin."
    difficulty: medium
    tags: [gastroenterology, parasitic-diarrhea, entamoeba, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common viral cause of gastroenteritis in adults?"
    back: "Norovirus\n\nNorovirus (including Norwalk virus) is the most common viral cause of gastroenteritis, with 24-hour incubation and 24-hour duration."
    difficulty: easy
    tags: [gastroenterology, viral-diarrhea, norovirus, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first-line treatment for traveler's diarrhea?"
    back: "Rehydration - sealed beverages or oral rehydration solutions\n\nRehydration is the mainstay of therapy; oral rehydration solutions (1 packet in 1L water) are used for severe fluid loss."
    difficulty: easy
    tags: [gastroenterology, travelers-diarrhea, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the efficacy of Dukoral vaccine against cholera and ETEC?"
    back: "~80% against cholera, ~50-67% against ETEC\n\nDukoral requires 2 doses taken 2 weeks prior to travel; effect lasts up to 3 months."
    difficulty: medium
    tags: [gastroenterology, travelers-diarrhea, prevention, vaccine, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the definition of chronic diarrhea?"
    back: "Passage of frequent unformed stool for >4 weeks\n\nChronic diarrhea is defined as >4 weeks duration, compared to persistent diarrhea lasting 14-30 days."
    difficulty: easy
    tags: [gastroenterology, chronic-diarrhea, definition, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What percentage of travelers to developing countries get traveler's diarrhea in the first 2 weeks?"
    back: "Up to 50%\n\nTraveler's diarrhea is the most common illness affecting travelers; 10-20% get it after returning home."
    difficulty: easy
    tags: [gastroenterology, travelers-diarrhea, epidemiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the approximate proportion of bacterial vs. viral vs. protozoal causes of traveler's diarrhea?"
    back: "Bacterial 80-90%, viral 5-8%, protozoal ~10% in long-term travelers\n\nE. coli (ETEC) is the most common bacterial cause; protozoal causes are rare except in long-term travelers."
    difficulty: medium
    tags: [gastroenterology, travelers-diarrhea, epidemiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the recommended prevention strategy for traveler's diarrhea?"
    back: "Proper hygiene: avoid street vendor food, untreated water, raw fruits/vegetables without peel; bismuth subsalicylate 60% effective\n\nAntibiotic prophylaxis is NOT recommended due to increased resistance risk; Dukoral offers partial protection."
    difficulty: medium
    tags: [gastroenterology, travelers-diarrhea, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What investigations are needed for chronic diarrhea?"
    back: "Guided by history; stool analysis for C. difficile toxin, C&S\n\nMost chronic diarrhea cases are non-infectious; investigations should be guided by the clinical history."
    difficulty: hard
    tags: [gastroenterology, chronic-diarrhea, investigation, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which bacteria produces heat-stable preformed exotoxin causing rapid onset (2-4 hours)?"
    back: "Staphylococcus aureus\n\nS. aureus produces heat-stable preformed exotoxin in unrefrigerated meat and dairy, causing symptoms within 2-4 hours."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, staph-aureus, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for Clostridium perfringens?"
    back: "None (supportive care only)\n\nC. perfringens causes self-limiting diarrhea <24 hours; spores are heat-resistant and secondary enterotoxin is produced."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common bacterial cause of infectious diarrhea in Canada?"
    back: "Campylobacter jejuni\n\nCampylobacter is the most common bacterial cause of diarrhea in Canada, typically associated with consumption of uncooked poultry."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, bacteria, campylobacter, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What are the clinical features of B. cereus Type A (emetic) food poisoning?"
    back: "Incubation 1-6 hours, duration <12 hours, associated with rice dishes, caused by preformed exotoxin\n\nB. cereus emetic syndrome is caused by a heat-stable preformed exotoxin in rice dishes, with rapid onset and short duration."
    difficulty: medium
    tags: [gastroenterology, food-poisoning, bacteria, bacillus, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What pathogen causes C. perfringens food poisoning and what is its key feature?"
    back: "Clostridium perfringens; spores are heat-resistant\n\nC. perfringens food poisoning is caused by contaminated meat and poultry; the spores are heat-resistant and can survive cooking."
    difficulty: medium
    tags: [gastroenterology, food-poisoning, bacteria, clostridium, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common cause of traveller's diarrhea?"
    back: "Enterotoxigenic E. coli (ETEC)\n\nETEC produces heat-labile and heat-stable toxins and is the leading cause of traveller's diarrhea worldwide."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, e-coli, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What pathogen causes S. aureus food poisoning?"
    back: "Heat-stable preformed exotoxin in unrefrigerated meat and dairy\n\nS. aureus produces a heat-stable toxin in improperly refrigerated foods like meat, dairy, and salads."
    difficulty: medium
    tags: [gastroenterology, food-poisoning, staphylococcus, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the mortality of cholera with proper treatment?"
    back: "Less than 1%\n\nWith appropriate fluid replacement and antibiotics, cholera mortality is less than 1%."
    difficulty: easy
    tags: [gastroenterology, cholera, vibrio, prognosis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for symptomatic Entamoeba histolytica?"
    back: "Metronidazole followed by iodoquinol or paromomycin\n\nMetronidazole treats invasive tissue infection, then iodoquinol or paromomycin eliminates intestinal cysts."
    difficulty: hard
    tags: [gastroenterology, parasites, entamoeba, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common cause of viral gastroenteritis in adults?"
    back: "Norovirus\n\nNorovirus is the most common cause of viral gastroenteritis in adults, causing brief but intense symptoms."
    difficulty: easy
    tags: [gastroenterology, viruses, norovirus, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the etiology breakdown of traveller's diarrhea?"
    back: "Bacterial 80-90% (E. coli most common), viral 5-8%, protozoal ~10% in long-term travellers\n\nBacterial pathogens, especially ETEC, dominate traveller's diarrhea; protozoal causes are more common in long-term travelers."
    difficulty: medium
    tags: [gastroenterology, travellers-diarrhea, etiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the mainstay of traveller's diarrhea treatment?"
    back: "Rehydration\n\nFluid replacement is the cornerstone of traveller's diarrhea treatment, using sealed beverages or oral rehydration solutions."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the efficacy of Dukoral vaccine for cholera and ETEC?"
    back: "~80% efficacy for cholera, 50-67% for ETEC\n\nDukoral provides moderate protection against cholera and ETEC, lasting up to 3 months with two doses."
    difficulty: medium
    tags: [gastroenterology, vaccines, cholera, travellers-diarrhea, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What pathogen causes 'beaver fever'?"
    back: "Giardia lamblia\n\nGiardia lamblia is also known as 'beaver fever' and is transmitted via contaminated food/water, commonly affecting daycare children and those who drink untreated water."
    difficulty: easy
    tags: [gastroenterology, parasites, infectious-disease, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the recommended treatment for Giardia lamblia?"
    back: "Metronidazole or nitazoxanide\n\nGiardia lamblia is treated with metronidazole or nitazoxanide; treatment of asymptomatic carriers is NOT recommended."
    difficulty: medium
    tags: [gastroenterology, parasites, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "At what age is the rotavirus oral vaccine given?"
    back: "2 and 4 months of age\n\nThe rotavirus oral vaccine is given at 2 and 4 months of age. Virtually all children are infected by age 3, and rotavirus can cause severe dehydration."
    difficulty: easy
    tags: [gastroenterology, vaccines, pediatrics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the mainstay of treatment for traveller's diarrhea?"
    back: "Rehydration\n\nRehydration is the mainstay of therapy for traveller's diarrhea. Use sealed beverages for mild cases and oral rehydration solutions (1 package in 1L water) for severe fluid loss."
    difficulty: easy
    tags: [gastroenterology, treatment, travel-medicine, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the efficacy of Dukoral vaccine against cholera?"
    back: "~80%\n\nDukoral vaccine offers approximately 80% protection against V. cholerae and 50-67% against ETEC. Two doses should be taken 2 weeks prior to traveling."
    difficulty: easy
    tags: [gastroenterology, vaccines, travel-medicine, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What pathogen is associated with Guillain-Barré syndrome?"
    back: "Campylobacter jejuni\n\nCampylobacter jejuni infection is associated with Guillain-Barré syndrome, an autoimmune demyelinating condition."
    difficulty: medium
    tags: [gastroenterology, infectious-disease, neurology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the characteristic stool volume in Vibrio cholerae?"
    back: "Massive watery diarrhea (1-3 L/day)\n\nVibrio cholerae causes massive watery diarrhea of 1-3 liters per day, which can be fatal without treatment. Mortality is <1% with proper therapy."
    difficulty: easy
    tags: [gastroenterology, infectious-disease, cholera, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What type of toxin does B. cereus Type A (emetic) produce?"
    back: "Preformed exotoxin\n\nB. cereus Type A (emetic) produces a preformed exotoxin found in rice dishes, with rapid onset of 1-6 hours and duration <12 hours."
    difficulty: medium
    tags: [gastroenterology, bacteria, food-poisoning, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What dietary intervention is recommended for IBS with pain, bloating, and diarrhea?"
    back: "Low FODMAP diet (Fermentable Oligo-, Di-, Monosaccharides And Polyols)\n\nLow FODMAP diet reduces fermentable carbohydrates that cause gas, bloating, and diarrhea in IBS patients."
    difficulty: easy
    tags: [IBS, treatment, diet, FODMAP, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What probiotics have evidence for IBS symptom improvement?"
    back: "Lactobacillus or Bifidobacterium species\n\nProbiotics can improve abdominal pain, bloating, and flatulence in IBS patients, particularly certain bacterial strains."
    difficulty: easy
    tags: [IBS, treatment, probiotics, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is recommended for IBS-D regarding fiber?"
    back: "Increase soluble fiber (bran or psyllium) to improve stool consistency; avoid insoluble fiber which may worsen gas/bloating\n\nSoluble fiber helps form stool while insoluble fiber may worsen abdominal discomfort in IBS-D."
    difficulty: medium
    tags: [IBS-D, treatment, fiber, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What medications are used for IBS-C?"
    back: "Soluble fiber, PEG 3350, osmotic laxatives, prokinetics (prucalopride), secretagogues (linaclotide, plecanatide), tenapanor\n\nIBS-C treatment progresses from fiber to osmotic agents to prokinetics and secretagogues. PEG improves stool form but not abdominal pain."
    difficulty: medium
    tags: [IBS-C, treatment, constipation, laxatives, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "How is constipation defined?"
    back: "Passage of infrequent/hard stools and/or difficult stool evacuation (straining, sensation of anorectal blockage)\n\nNormal stool frequency is 3/day to 3/week. Constipation involves difficulty with passage or infrequency."
    difficulty: easy
    tags: [constipation, definition, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are the three types of constipation?"
    back: "1) Normal transit constipation, 2) Delayed transit constipation, 3) Outlet dysfunction/dyssynergic defecation\n\nThese types can be found in combination. Dyssynergic defecation involves inability to coordinate anorectum during defecation."
    difficulty: medium
    tags: [constipation, types, pathophysiology, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the most common cause of constipation?"
    back: "Functional, idiopathic constipation\n\nMost constipation is functional with no identifiable organic cause. Organic causes should be considered only if other symptoms exist."
    difficulty: easy
    tags: [constipation, etiology, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are stimulant cathartics for constipation?"
    back: "Senna and bisacodyl - effective within 24 hours\n\nStimulants are more potent laxatives that work by stimulating intestinal motility. Used when osmotic agents insufficient."
    difficulty: easy
    tags: [constipation, treatment, stimulant laxatives, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are linaclotide and plecanatide?"
    back: "Secretagogues that increase water secretion into intestinal lumen\n\nThese medications mimic guanylate cyclase-C agonists to increase intestinal fluid secretion and accelerate transit."
    difficulty: medium
    tags: [constipation, treatment, secretagogues, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is tenapanor?"
    back: "An NHE3 (sodium-proton) inhibitor used for IBS-C and constipation\n\nTenapanor reduces phosphate absorption and increases water secretion in the gut by inhibiting sodium-hydrogen exchange."
    difficulty: medium
    tags: [IBS-C, constipation, treatment, NHE3 inhibitor, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is eluxadoline used for?"
    back: "IBS with diarrhea (IBS-D)\n\nEluxadoline is a mixed mu-opioid receptor agonist and delta-opioid receptor antagonist that reduces GI motility and secretion."
    difficulty: medium
    tags: [IBS-D, treatment, eluxadoline, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What neurologic conditions can cause constipation?"
    back: "Intestinal pseudo-obstruction, Parkinson's disease, multiple sclerosis\n\nNeurologic diseases can affect autonomic innervation of the gut, leading to impaired motility and constipation."
    difficulty: medium
    tags: [constipation, neurologic, Parkinsons, pseudo-obstruction, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the definition of constipation?"
    back: "Passage of infrequent/hard stools and/or difficult stool evacuation (e.g., straining, sensation of anorectal blockage)\n\nConstipation is defined by stool frequency (<3/week), hard stool consistency, and difficult passage."
    difficulty: easy
    tags: [constipation, definition, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What defines upper gastrointestinal bleeding?"
    back: "Bleeding proximal to the ligament of Treitz (suspensory ligament where the fourth portion of duodenum transitions to jejunum).\n\nThe ligament of Treitz marks the boundary between upper and lower GI bleeding, with 75% of all GI bleeds being upper GI in origin."
    difficulty: easy
    tags: [Upper GI Bleed, Anatomy, Gastroenterology, Ligament of Treitz, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the clinical presentation of outlet dysfunction (dyssynergic defecation)?"
    back: "Inability to coordinate anorectal muscles during defecation - patients strain excessively but have difficulty expelling stool, often requiring digital assistance.\n\nThis is a functional disorder where the puborectalis fails to relax or actually contracts during defecation, creating a functional obstruction. Biofeedback therapy is often effective."
    difficulty: hard
    tags: [Dyssynergic Defecation, Pelvic Floor, Gastroenterology, Functional Disorder, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are stimulant cathartics used for constipation and examples?"
    back: "Senna and bisacodyl - effective within 24 hours. Used for short-term relief of constipation.\n\nStimulants directly irritate the colonic mucosa and increase peristalsis. They are more effective than surface-acting agents but should not be used long-term."
    difficulty: easy
    tags: [Constipation, Stimulant Laxatives, Senna, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What dietary intervention is recommended for IBS symptoms?"
    back: "Low FODMAP diet (Fermentable Oligo-, Di-, Monosaccharides And Polyols) for pain, bloating, gas, and diarrhea\n\nFODMAPs are poorly absorbed carbohydrates that ferment in the gut, causing IBS symptoms. This diet reduces osmotic and fermentative load."
    difficulty: easy
    tags: [IBS, Low FODMAP Diet, Gastroenterology, Treatment, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the treatment for IBS with constipation (IBS-C)?"
    back: "Increase soluble fiber (bran or psyllium), PEG 3350, linaclotide, plecanatide, tenapanor, or osmotic laxatives\n\nThese treatments work by increasing water content in the intestine, softening stool, or promoting bowel movements. Soluble fiber increases stool consistency."
    difficulty: medium
    tags: [IBS-C, Constipation, Gastroenterology, Treatment, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the recommended dietary fiber intake for constipation?"
    back: "Aim for 30 grams daily, increase dose slowly\n\nGradual increase helps minimize side effects like bloating and gas. Fiber adds bulk and promotes regular bowel movements."
    difficulty: easy
    tags: [Constipation, Dietary Fiber, Treatment, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the definition of upper gastrointestinal bleeding?"
    back: "Bleeding proximal to the ligament of Treitz (suspensory ligament where fourth portion of duodenum transitions to jejunum)\n\nThe ligament of Treitz marks the boundary between upper and lower GI bleeding. Upper GI bleeds account for 75% of all GI bleeds."
    difficulty: easy
    tags: [Upper GI Bleed, Anatomy, Ligament of Treitz, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Define constipation according to clinical criteria"
    back: "Passage of infrequent/hard stools and/or difficult stool evacuation (e.g., straining, sensation of anorectal blockage)\n\nNormal stool frequency is considered 3/day to 3/week."
    difficulty: easy
    tags: [constipation, definition, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "List neurologic causes of constipation"
    back: "Intestinal pseudo-obstruction, Parkinson's disease, multiple sclerosis\n\nNeurologic conditions can impair the autonomic innervation of the bowel."
    difficulty: medium
    tags: [constipation, neurologic, etiology, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the location of the ligament of Treitz?"
    back: "The suspensory ligament where the fourth portion of the duodenum transitions to the jejunum\n\nThe ligament of Treitz marks the boundary between upper and lower GI bleeding."
    difficulty: easy
    tags: [anatomy, ligament of Treitz, duodenum, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is aortoenteric fistula and why is it concerning?"
    back: "A rare and lethal cause of GI bleed, most common in patients with history of aortic graft surgery\n\nThis is a surgical emergency with a narrow window of opportunity for intervention."
    difficulty: hard
    tags: [aortoenteric fistula, GI bleeding, emergency, surgery, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What pathogen is associated with Guillain-Barré syndrome following diarrhea?"
    back: "Campylobacter jejuni\n\nCampylobacter jejuni infection is a common trigger for Guillain-Barré syndrome due to molecular mimicry."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, neurological, campylobacter, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which E. coli pathotype is the most common cause of traveller's diarrhea?"
    back: "Enterotoxigenic E. coli (ETEC)\n\nETEC produces heat-labile and heat-stable toxins and is the most common cause of traveller's diarrhea."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, e-coli, travellers-diarrhea, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What toxin does Staphylococcus aureus produce causing food poisoning?"
    back: "Heat-stable preformed exotoxin (emetic toxin)\n\nS. aureus produces a heat-stable exotoxin in unrefrigerated food, causing rapid onset vomiting."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, staphylococcus, food-poisoning, toxin, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the classic presentation of Vibrio cholerae diarrhea?"
    back: "Massive watery diarrhea (1-3 L/day)\n\nVibrio cholerae causes voluminous rice-water diarrhea that can rapidly cause dehydration and death."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, vibrio, cholera, dehydration, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the classic food source for B. cereus emetic syndrome?"
    back: "Rice dishes (particularly leftover rice)\n\nB. cereus type A (emetic) is associated with rice dishes where spores survive improper storage."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, b-cereus, food-poisoning, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for Entamoeba histolytica?"
    back: "Metronidazole followed by iodoquinol or paromomycin\n\nMetronidazole treats invasive disease, then iodoquinol/paromomycin eliminates cysts."
    difficulty: hard
    tags: [gastroenterology, infectious-diarrhea, entamoeba, treatment, parasite, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "When is the rotavirus vaccine given?"
    back: "At 2 and 4 months of age\n\nOral rotavirus vaccine is administered at 2 and 4 months of age to prevent severe rotavirus gastroenteritis."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, rotavirus, vaccine, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What percentage of travellers to developing countries get traveller's diarrhea in the first 2 weeks?"
    back: "Up to 50%\n\nTraveller's diarrhea affects up to 50% of travellers to developing countries in the first 2 weeks."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, epidemiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common bacterial cause of traveller's diarrhea?"
    back: "Enterotoxigenic E. coli (ETEC)\n\nETEC is the most common cause, accounting for 80-90% of bacterial traveller's diarrhea cases."
    difficulty: medium
    tags: [gastroenterology, travellers-diarrhea, etec, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the efficacy of bismuth subsalicylate (Pepto-Bismol) for preventing traveller's diarrhea?"
    back: "60% effective\n\nBismuth subsalicylate is 60% effective for prevention when taken as 2 tablets QID."
    difficulty: medium
    tags: [gastroenterology, travellers-diarrhea, prevention, bismuth, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common cause of bacterial food poisoning with short incubation (1-6 hours)?"
    back: "Staphylococcus aureus (2-4 hours) or B. cereus type A (1-6 hours)\n\nS. aureus has 2-4h incubation; B. cereus emetic type has 1-6h incubation from preformed toxin."
    difficulty: hard
    tags: [gastroenterology, infectious-diarrhea, food-poisoning, incubation, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What pathogen causes diarrhea with incubation of 8-12 hours and is associated with meat/poultry?"
    back: "Clostridium perfringens\n\nC. perfringens has 8-12h incubation, associated with contaminated meat and poultry, spores are heat-resistant."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, clostridium-perfringens, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for severe Campylobacter jejuni diarrhea?"
    back: "Macrolide (e.g., azithromycin) or fluoroquinolone if susceptible\n\nMacrolides are first-line; fluoroquinolones are used if susceptibility confirmed, noting increasing resistance."
    difficulty: hard
    tags: [gastroenterology, infectious-diarrhea, campylobacter, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first-line treatment for Shigella dysentery?"
    back: "Fluoroquinolone (e.g., ciprofloxacin)\n\nFluoroquinolones are first-line for Shigella; antidiarrheals may increase toxic megacolon risk."
    difficulty: hard
    tags: [gastroenterology, infectious-diarrhea, shigella, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first-line treatment for Yersinia enterocolitica severe illness?"
    back: "Fluoroquinolone (e.g., ciprofloxacin)\n\nFluoroquinolones are first-line for severe Yersinia infection; most cases in children <4 years are self-limited."
    difficulty: hard
    tags: [gastroenterology, infectious-diarrhea, yersinia, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the pathogen distribution in traveller's diarrhea by type?"
    back: "Bacterial 80-90%, viral 5-8%, protozoal ~10% (in long-term travellers)\n\nBacterial causes dominate (ETEC most common), with norovirus/rotavirus for viral and Giardia/Cryptosporidium for protozoal."
    difficulty: medium
    tags: [gastroenterology, travellers-diarrhea, epidemiology, pathogens, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What foods should be avoided to prevent traveller's diarrhea?"
    back: "Foods from unhygienic establishments, raw fruits/vegetables without peel, raw/undercooked meat/seafood, untreated water, beer on tap\n\nAvoid high-risk foods and beverages to prevent traveller's diarrhea; proper hygiene practices are essential."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What investigations are used for chronic diarrhea?"
    back: "Guided by history; stool analysis for C. difficile toxin, C&S\n\nChronic diarrhea workup is guided by history; stool studies including C. difficile toxin and culture are initial tests."
    difficulty: medium
    tags: [gastroenterology, chronic-diarrhea, investigation, diagnosis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A 25-year-old returning traveler from Southeast Asia presents with 3 days of watery diarrhea. Which bacterium is the most common cause of traveler's diarrhea?"
    back: "Enterotoxigenic E. coli (ETEC)\n\nETEC is the most common cause of traveler's diarrhea, producing heat-labile and heat-stable toxins that cause secretory diarrhea."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, travel-medicine, bacterial, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A patient with raw poultry consumption develops diarrhea with Guillain-Barré syndrome. Which organism is responsible?"
    back: "Campylobacter jejuni\n\nCampylobacter jejuni is the most common bacterial cause of diarrhea in Canada and is associated with Guillain-Barré syndrome due to molecular mimicry."
    difficulty: medium
    tags: [gastroenterology, campylobacter, neurological-complications, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A traveler develops profuse watery diarrhea (1-3 L/day). What organism causes this and what is the mortality with treatment?"
    back: "Vibrio cholerae; mortality <1% with treatment\n\nVibrio cholerae causes cholera, characterized by massive rice-water diarrhea. Proper rehydration and antibiotics (tetracycline or fluoroquinolones) reduce mortality to less than 1%."
    difficulty: medium
    tags: [gastroenterology, cholera, vibrio, travel-medicine, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A patient with AIDS develops watery diarrhea. Oocysts are seen on acid-fast stain. What is the treatment?"
    back: "Paromomycin + nitazoxanide (with immune reconstitution)\n\nCryptosporidium causes severe diarrhea in immunocompromised patients. Treatment requires paromomycin plus nitazoxanide and immune reconstitution."
    difficulty: hard
    tags: [gastroenterology, cryptosporidium, immunocompromised, parasites, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A patient with dysentery develops toxic megacolon. Which organism is associated and what should NOT be given?"
    back: "Shigella; antidiarrheals should be avoided\n\nShigella can cause toxic megacolon as a complication. Antidiarrheals increase the risk of toxic megacolon and should be avoided."
    difficulty: hard
    tags: [gastroenterology, shigella, complications, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A 35-year-old man has diarrhea 2 weeks after returning from India. He reports 'beaver fever' from camping. What parasite?"
    back: "Giardia lamblia\n\nGiardia lamblia is transmitted via contaminated water (often from beavers - 'beaver fever') and causes foul-smelling, fatty diarrhea."
    difficulty: easy
    tags: [gastroenterology, giardia, travel-medicine, parasites, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the defining feature of enteroinvasive E. coli (EIEC)?"
    back: "Invades colonic mucosa causing dysentery-like illness\n\nEIEC invades colonic epithelial cells, similar to Shigella, causing inflammatory dysentery with fever, abdominal pain, and bloody diarrhea."
    difficulty: hard
    tags: [gastroenterology, e-coli, pathogenesis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A patient with diarrhea has a history of recent clindamycin use. What is the most likely organism?"
    back: "Clostridioides difficile\n\nClindamycin, along with fluoroquinolones, penicillins, and cephalosporins, is a major risk factor for C. difficile infection."
    difficulty: easy
    tags: [gastroenterology, clostridioides-difficile, antibiotic-associated, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common protozoal cause of traveler's diarrhea?"
    back: "Giardia lamblia\n\nWhile protozoa account for only ~10% of traveler's diarrhea in long-term travelers, Giardia is the most common protozoal cause."
    difficulty: medium
    tags: [gastroenterology, travel-medicine, giardia, parasites, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A patient with dysentery develops a liver abscess. What is the organism and complication?"
    back: "Entamoeba histolytica; amebic liver abscess\n\nWithout treatment, E. histolytica can spread hematogenously to the liver, causing amebic liver abscess - the most common extraintestinal complication."
    difficulty: hard
    tags: [gastroenterology, entamoeba, complications, liver-abscess, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common cause of bacterial diarrhea in Canada?"
    back: "Campylobacter jejuni\n\nCampylobacter jejuni is the most common bacterial cause of infectious diarrhea in Canada, typically from undercooked poultry."
    difficulty: easy
    tags: [gastroenterology, campylobacter, epidemiology-canada, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A patient with watery diarrhea has a history of recent camping and untreated water ingestion. What parasite is associated with this?"
    back: "Giardia lamblia (also called 'beaver fever')\n\nGiardia is commonly acquired from contaminated water sources during camping or drinking untreated water ('beaver fever')."
    difficulty: easy
    tags: [gastroenterology, giardia, waterborne, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first-line treatment for Clostridium perfringens food poisoning?"
    back: "None - supportive care only\n\nC. perfringens food poisoning is self-limited, lasting less than 24 hours. Treatment is supportive; antibiotics are not indicated."
    difficulty: easy
    tags: [gastroenterology, clostridium-perfringens, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is unique about the spores of Clostridium perfringens?"
    back: "They are heat-resistant\n\nC. perfringens spores are heat-resistant, allowing them to survive cooking and germinate in cooked meat held at improper temperatures."
    difficulty: medium
    tags: [gastroenterology, clostridium-perfringens, pathogenesis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What type of fiber should be increased in IBS-D and what caution applies?"
    back: "Soluble fiber (bran or psyllium) to increase stool consistency\n\nSoluble fiber can improve stool consistency in IBS-D but may worsen abdominal gas and bloating in some patients - this is controversial."
    difficulty: easy
    tags: [Gastroenterology, IBS-D, Treatment, Fiber, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What treatments are recommended for IBS-C (IBS with constipation)?"
    back: "Increase soluble fiber, PEG 3350, linaclotide, plecanatide, tenapanor, or osmotic/other laxatives\n\nSoluble fiber may increase bloating. PEG 3350 improves stool form. Linaclotide and plecanatide are secretagogues; tenapanor is an NHE3 inhibitor."
    difficulty: easy
    tags: [Gastroenterology, IBS-C, Treatment, Constipation, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Name 3 neurologic causes of constipation"
    back: "Intestinal pseudo-obstruction, Parkinson's disease, multiple sclerosis\n\nNeurologic conditions can affect the autonomic innervation of the gut, leading to impaired motility."
    difficulty: easy
    tags: [Gastroenterology, Constipation, Neurology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the only test indicated for constipation if it is the only presenting symptom (per 2013 AGA recommendation)?"
    back: "Complete blood count (CBC)\n\nThe American Gastroenterology Association recommends only CBC as initial test when constipation is the sole presenting symptom."
    difficulty: easy
    tags: [Gastroenterology, Constipation, Investigations, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the recommended daily dietary fiber intake for constipation?"
    back: "30 grams daily, with dose increased slowly\n\nDietary fiber is useful for mild to moderate constipation but not severe cases. Gradual increase helps minimize bloating."
    difficulty: easy
    tags: [Gastroenterology, Constipation, Treatment, Diet, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Name 2 stimulant/cathartic laxatives used for constipation and when are they effective?"
    back: "Senna and bisacodyl - effective in 24 hours\n\nStimulant laxatives promote intestinal motility and are used when osmotic agents are insufficient."
    difficulty: easy
    tags: [Gastroenterology, Constipation, Treatment, Stimulant Laxatives, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the mechanism of action of linaclotide and plecanatide?"
    back: "Secretagogues that increase water secretion into the intestinal lumen\n\nThese medications activate guanylate cyclase-C receptors to increase chloride and water secretion, softening stool."
    difficulty: medium
    tags: [Gastroenterology, Constipation, Treatment, Secretagogues, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the mechanism of action of tenapanor?"
    back: "NHE3 (sodium-proton) inhibitor - reduces sodium absorption in the intestine\n\nTenapanor inhibits NHE3 to increase water retention in the lumen, improving stool consistency."
    difficulty: medium
    tags: [Gastroenterology, Constipation, Treatment, NHE3 Inhibitor, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Define upper gastrointestinal bleeding"
    back: "Bleeding proximal to the ligament of Treitz (accounts for 75% of GI bleeds)\n\nThe ligament of Treitz is the suspensory ligament where the fourth portion of duodenum transitions to jejunum."
    difficulty: easy
    tags: [Gastroenterology, GI Bleeding, Definition, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the ligament of Treitz?"
    back: "Suspensory ligament where the fourth portion of the duodenum transitions to jejunum\n\nThis landmark marks the anatomical division between upper and lower GI bleeding."
    difficulty: easy
    tags: [Gastroenterology, Anatomy, GI Bleeding, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What dietary intervention has evidence for treating IBS symptoms?"
    back: "Low FODMAP (Fermentable Oligo-, Di-, Monosaccharides And Polyols) diet\n\nThe low FODMAP diet is effective for pain, bloating, gas, and diarrhea in IBS. It should be symptom-guided and implemented with proper education."
    difficulty: easy
    tags: [IBS, Low FODMAP, Diet, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What medications are used specifically for IBS-C (IBS with constipation)?"
    back: "Soluble fiber, PEG 3350, osmotic or other laxatives, linaclotide, plecanatide, and tenapanor\n\nPEG 3350 can alter stool form but has no evidence for helping abdominal pain. Linaclotide and plecanatide are secretagogues that increase water secretion into the intestinal lumen."
    difficulty: medium
    tags: [IBS-C, Laxatives, Treatment, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the definition of constipation according to Toronto Notes?"
    back: "Passage of infrequent/hard stools and/or difficult stool evacuation (e.g., straining, sensation of anorectal blockage)\n\nConstipation is characterized by infrequent bowel movements (<3/week), hard stools, and difficult evacuation often requiring straining."
    difficulty: easy
    tags: [Constipation, Definition, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the recommended dietary fiber intake for constipation treatment and how should it be implemented?"
    back: "Aim for 30 grams daily, increase dose slowly\n\nDietary fiber is useful for mild to moderate constipation but not for severe cases. Gradual dose increases help minimize bloating and gas."
    difficulty: easy
    tags: [Constipation, Dietary Fiber, Treatment, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What stimulant cathartics are used for constipation and how quickly do they work?"
    back: "Senna and bisacodyl - effective within 24 hours\n\nStimulant cathartics directly stimulate intestinal motility and are used for more acute constipation relief."
    difficulty: medium
    tags: [Constipation, Stimulants, Treatment, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the treatment approach for constipation in order of increasing potency?"
    back: "Dietary fiber → surface-acting agents (softeners) → osmotic agents → stimulants → enemas/suppositories → prokinetics → secretagogues → NHE3 inhibitors\n\nTreatment follows a stepwise approach starting with the least invasive interventions and escalating based on response."
    difficulty: hard
    tags: [Constipation, Treatment, Stepwise Approach, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is eluxadoline and what is its indication?"
    back: "Eluxadoline is a medication used for IBS with diarrhea (IBS-D)\n\nEluxadoline is a mixed mu-opioid receptor agonist and delta-opioid receptor antagonist that reduces bowel motility and secretion in IBS-D."
    difficulty: medium
    tags: [IBS-D, Eluxadoline, Treatment, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is tenesmus in the context of constipation?"
    back: "The sensation of incomplete evacuation after defecation, often with straining\n\nTenesmus is a common symptom of constipation and can be associated with outlet dysfunction or dyssynergic defecation."
    difficulty: medium
    tags: [Constipation, Tenesmus, Symptoms, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are the organic causes of constipation that should be considered?"
    back: "Intestinal obstruction, left-sided colon cancer (consider in older patients), fecal impaction, and painful anal conditions (e.g., fissures)\n\nOrganic causes should be suspected when constipation is accompanied by other symptoms beyond just infrequent bowel movements."
    difficulty: medium
    tags: [Constipation, Organic Causes, Cancer, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Define constipation according to standard criteria."
    back: "Passage of infrequent/hard stools and/or difficult stool evacuation (e.g., straining, sensation of anorectal blockage)\n\nConstipation is defined by stool frequency (<3/week), consistency (hard/lumpy), and evacuation difficulty."
    difficulty: easy
    tags: [Constipation, Definition, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Define upper gastrointestinal bleeding (UGIB)."
    back: "Bleeding proximal to the ligament of Treitz (where fourth portion of duodenum transitions to jejunum)\n\nThe ligament of Treitz is the anatomic landmark distinguishing upper from lower GI bleeding."
    difficulty: easy
    tags: [UGIB, Definition, Anatomy, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is a characteristic feature of an enteric fistula as a cause of GI bleed?"
    back: "Enteric fistula is a rare and lethal cause of GI bleed, most common in patients with a history of aortic graft surgery.\n\nAortoenteric fistulas present with GI bleeding and abdominal pain; they require urgent surgical evaluation."
    difficulty: hard
    tags: [GI Bleed, Enteric Fistula, Aortic Graft, Rare Cause, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What pathogen is the most common cause of traveller's diarrhea?"
    back: "Enterotoxigenic E. coli (ETEC)\n\nETEC is the most common cause of traveller's diarrhea, producing heat-labile and heat-stable enterotoxins."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, etec, bacteria, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What food is associated with Bacillus cereus emetic syndrome, and what is the toxin type?"
    back: "Rice dishes; preformed heat-stable exotoxin\n\nB. cereus emetic syndrome is associated with reheated rice dishes and is caused by a preformed heat-stable exotoxin (cereulide)."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, bacillus-cereus, food-poisoning, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What type of toxin does Clostridium perfringens produce, and what foods are associated?"
    back: "Secondary enterotoxin; heat-resistant spores in meat and poultry\n\nC. perfringens produces a secondary enterotoxin and is associated with contaminated meat and poultry; spores are heat-resistant."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, clostridium-perfringens, food-poisoning, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the mechanism of Staphylococcus aureus food poisoning?"
    back: "Heat-stable preformed exotoxin in unrefrigerated meat and dairy\n\nS. aureus produces a heat-stable preformed exotoxin in unrefrigerated meat and dairy products (custard, pudding, potato salad, mayonnaise)."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, staphylococcus, food-poisoning, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "At what ages is the rotavirus oral vaccine typically given?"
    back: "2 and 4 months of age\n\nThe rotavirus oral vaccine is given at 2 and 4 months of age; virtually all children are infected by age 3 years."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, viruses, rotavirus, vaccine, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What percentage of traveller's diarrhea cases are caused by bacteria?"
    back: "80-90%\n\nBacterial pathogens cause 80-90% of traveller's diarrhea cases, with ETEC being the most common overall cause."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, epidemiology, bacteria, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "In which region is fluoroquinolone resistance particularly high in traveller's diarrhea pathogens?"
    back: "South and Southeast Asia\n\nFluoroquinolone resistance is particularly high in South and Southeast Asia, limiting the use of ciprofloxacin for empiric treatment in these regions."
    difficulty: medium
    tags: [gastroenterology, travellers-diarrhea, antibiotic-resistance, asia, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "How effective is bismuth subsalicylate (Pepto-Bismol) for preventing traveller's diarrhea?"
    back: "~60% effective (2 tablets QID)\n\nBismuth subsalicylate is approximately 60% effective for preventing traveller's diarrhea when taken as 2 tablets four times daily."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, prevention, bismuth, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the efficacy of Dukoral vaccine against V. cholerae and ETEC?"
    back: "~80% against cholera, ~50-67% against ETEC\n\nDukoral provides ~80% protection against cholera and ~50-67% protection against ETEC, lasting up to 3 months."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, vaccine, dukoral, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the mainstay of therapy for traveller's diarrhea?"
    back: "Rehydration\n\nRehydration is the mainstay of therapy for traveller's diarrhea; oral rehydration solutions (1 package in 1L water) are used for severe fluid loss."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, treatment, rehydration, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "How is chronic diarrhea defined in terms of duration?"
    back: "Passage of frequent unformed stool for >4 weeks\n\nChronic diarrhea is defined as passage of frequent unformed stool for more than 4 weeks, distinguishing it from persistent diarrhea (14-30 days)."
    difficulty: easy
    tags: [gastroenterology, chronic-diarrhea, definition, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the majority etiology of chronic diarrhea?"
    back: "Non-infectious causes\n\nThe majority of chronic diarrhea cases are non-infectious in etiology, requiring investigation for other causes like IBD, IBS, malabsorption, etc."
    difficulty: easy
    tags: [gastroenterology, chronic-diarrhea, etiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the estimated effectiveness of Salmonella Typhi vaccines?"
    back: "50-70%\n\nTwo vaccines against Salmonella Typhi are available with an estimated effectiveness of 50-70%."
    difficulty: easy
    tags: [gastroenterology, salmonella-typhi, vaccine, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Define constipation according to the text."
    back: "Passage of infrequent/hard stools and/or difficult stool evacuation (e.g., straining, sensation of anorectal blockage)\n\nConstipation is defined by stool frequency (<3/week), consistency (hard/lumpy), and ease of passage."
    difficulty: easy
    tags: [Constipation, Definition, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What neurological conditions can cause constipation?"
    back: "Intestinal pseudo-obstruction, Parkinson's disease, multiple sclerosis\n\nNeurological diseases affect the autonomic innervation of the GI tract, impairing motility."
    difficulty: medium
    tags: [Constipation, Etiology, Neurological, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the recommended daily dietary fibre intake for constipation?"
    back: "30 grams daily, increase dose slowly\n\nDietary fibre is useful for mild-moderate constipation but not severe. Slow titration reduces gas/bloating side effects."
    difficulty: easy
    tags: [Constipation, Treatment, Diet, Fibre, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are stimulant/cathartic laxatives for constipation and examples?"
    back: "Effective in 24 hours. Examples: senna, bisacodyl\n\nStimulant laxatives directly stimulate colonic motility and are used when faster relief is needed."
    difficulty: easy
    tags: [Constipation, Treatment, Stimulant Laxatives, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is eluxadoline and what is it used for?"
    back: "Medication for IBS-D (irritable bowel syndrome with diarrhea)\n\nEluxadoline is a mixed opioid receptor agonist/antagonist that reduces GI motility and secretion."
    difficulty: medium
    tags: [IBS-D, Treatment, Eluxadoline, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are enema and suppository options for constipation?"
    back: "Saline enema, phosphate enema, glycerin suppository, bisacodyl suppository\n\nRectal interventions provide rapid relief and are useful for fecal impaction or when oral laxatives are insufficient."
    difficulty: easy
    tags: [Constipation, Treatment, Enema, Suppository, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the first-line dietary intervention for IBS?"
    back: "Low FODMAP diet (Fermentable Oligo-, Di-, Monosaccharides And Polyols) - helps with pain, bloating, gas, and diarrhea.\n\nFODMAPs are poorly absorbed carbohydrates that ferment in the colon, causing IBS symptoms. This is a first-line dietary therapy with good evidence."
    difficulty: easy
    tags: [IBS, Diet Therapy, FODMAP, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Define constipation according to clinical criteria."
    back: "Passage of infrequent/hard stools and/or difficult stool evacuation (e.g., straining, sensation of anorectal blockage).\n\nNormal stool frequency is 3-21 per week; constipation is typically <3 BMs/week with hard stools."
    difficulty: easy
    tags: [Constipation, Definition, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the recommended dietary intervention for IBS symptoms?"
    back: "Low FODMAP diet (Fermentable Oligo-, Di-, Monosaccharides And Polyols) for pain, bloating, gas, and diarrhea\n\nFODMAPs are poorly absorbed carbohydrates that ferment in the gut, worsening IBS symptoms. This diet is supported by evidence for symptom relief."
    difficulty: easy
    tags: [IBS, Diet Therapy, Low FODMAP, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What probiotic species have evidence for improving IBS symptoms?"
    back: "Lactobacillus or Bifidobacterium species\n\nProbiotics can improve abdominal pain, bloating, and flatulence in IBS, though evidence is variable across strains."
    difficulty: easy
    tags: [IBS, Probiotics, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are the two types of Bacillus cereus food poisoning and their respective incubations?"
    back: "Type A (emetic) has 1-6h incubation from rice dishes; Type B (diarrheal) has 8-16h incubation from meats and vegetables\n\nB. cereus produces two distinct syndromes: emetic from preformed exotoxin in rice dishes (short incubation), and diarrheal from secondary endotoxin in meats and vegetables (longer incubation)."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, bacteria, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What pathogen causes massive watery diarrhea (1-3 L/day)?"
    back: "Vibrio cholerae\n\nVibrio cholerae causes cholera, characterized by massive watery diarrhea of 1-3 liters per day, with mortality less than 1% with proper treatment."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, Vibrio, cholera, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What percentage of travellers to developing countries are affected by traveller's diarrhea in the first 2 weeks?"
    back: "Up to 50%\n\nTraveller's diarrhea is the most common illness affecting travellers, with up to 50% affected in the first 2 weeks and 10-20% after returning home."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, epidemiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the efficacy of bismuth subsalicylate (Pepto-Bismol) in preventing traveller's diarrhea?"
    back: "60% effective (2 tablets QID)\n\nBismuth subsalicylate (Pepto-Bismol) is 60% effective for preventing traveller's diarrhea when taken as 2 tablets four times daily."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What does Dukoral vaccine protect against and with what efficacy?"
    back: "Vibrio cholerae (~80% efficacy) and ETEC (~50-67% efficacy)\n\nDukoral oral vaccine provides ~80% protection against cholera and 50-67% protection against ETEC, lasting up to 3 months with 2 doses taken 2 weeks prior to travel."
    difficulty: medium
    tags: [gastroenterology, travellers-diarrhea, vaccine, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the most common etiology of traveller's diarrhea?"
    back: "Bacterial (80-90%), with E. coli (ETEC) being the most common bacterial cause\n\nBacterial pathogens account for 80-90% of traveller's diarrhea, with ETEC being the most common; viral causes account for 5-8%, and protozoal causes (~10%) are more common in long-term travellers."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, etiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is unique about the pathophysiology of Staph aureus food poisoning?"
    back: "Heat-stable preformed exotoxin\n\nStaphylococcus aureus produces a heat-stable preformed exotoxin that causes vomiting within 2-4 hours after eating contaminated unrefrigerated meat and dairy products."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, Staph-aureus, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the hallmark of Clostridium perfringens food poisoning?"
    back: "Heat-resistant spores\n\nClostridium perfringens food poisoning results from heat-resistant spores in contaminated meat and poultry, producing a secondary enterotoxin causing diarrhea within 8-12 hours."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, C-perfringens, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the typical duration of norovirus gastroenteritis?"
    back: "24 hours\n\nNorovirus (including Norwalk virus) causes a short-lived gastroenteritis lasting approximately 24 hours with nausea and vomiting predominating."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, viruses, norovirus, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is Primary Biliary Cholangitis (PBC)?"
    back: "Chronic inflammation and fibrous obliteration of intrahepatic bile ductules\n\nPBC is an autoimmune disease affecting mainly middle-aged women (M:F=1:9), often associated with Sjogren's syndrome, scleroderma, CREST syndrome, RA, and thyroiditis."
    difficulty: easy
    tags: [PBC, autoimmune liver disease, bile ducts, gastroenterology, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What are the extrahepatic manifestations of PBC?"
    back: "Pruritus, fatigue, jaundice, melanosis (dark skin), xanthelasma, osteoporosis\n\nEnd-stage disease presents with hepatocellular failure, portal hypertension, and ascites"
    difficulty: easy
    tags: [Gastroenterology, Hepatology, PBC, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is the prognosis of PBC with UDCA treatment?"
    back: "Treatment improves prognosis; normalization or near-normalization of ALP with UDCA is associated with improved survival comparable to age- and sex-matched controls\n\nNot all asymptomatic patients show progression, but disease can be fatal if untreated"
    difficulty: easy
    tags: [Gastroenterology, Hepatology, PBC, Prognosis, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "When is serum amylase >5x normal almost always due to?"
    back: "Pancreatitis or renal insufficiency\n\nThis degree of elevation strongly suggests pancreatic origin rather than non-pancreatic causes"
    difficulty: easy
    tags: [Gastroenterology, Pancreas, Diagnostic, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What pathogen is most commonly associated with traveller's diarrhea?"
    back: "Enterotoxigenic E. coli (ETEC)\n\nETEC produces heat-labile and heat-stable toxins and is the most common cause of traveller's diarrhea, accounting for 80-90% of bacterial cases."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, e-coli, infectious-diarrhea, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the key feature distinguishing B. cereus emetic vs diarrheal syndrome?"
    back: "Incubation period - emetic (1-6h) from preformed toxin, diarrheal (8-16h) from secondary endotoxin\n\nB. cereus type A (emetic) has short incubation from preformed exotoxin in rice dishes, while type B (diarrheal) has longer incubation from secondary endotoxin."
    difficulty: medium
    tags: [gastroenterology, b-cereus, infectious-diarrhea, bacteria, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which pathogen causes pseudomembranous colitis?"
    back: "Clostridium difficile\n\nC. difficile is normally present in small numbers but overgrowth occurs after antibiotic exposure, causing pseudomembranous colitis."
    difficulty: easy
    tags: [gastroenterology, c-difficile, pseudomembranous-colitis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for cholera?"
    back: "Tetracycline or fluoroquinolones (e.g., ciprofloxacin)\n\nCholera causes massive watery diarrhea (1-3 L/day) and mortality is less than 1% with proper treatment including antibiotics."
    difficulty: easy
    tags: [gastroenterology, cholera, vibrio, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which parasite is associated with 'beaver fever'?"
    back: "Giardia lamblia\n\nGiardia is transmitted fecal-orally through contaminated water (historically from beaver ponds) and causes prolonged diarrhea with malodorous stools."
    difficulty: easy
    tags: [gastroenterology, giardia, parasites, infectious-diarrhea, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which virus is the most common cause of viral gastroenteritis in adults?"
    back: "Norovirus\n\nNorovirus (including Norwalk virus) is the most common cause of viral gastroenteritis in adults, with 24-hour incubation and self-limited 24-hour course."
    difficulty: easy
    tags: [gastroenterology, norovirus, viral-gastroenteritis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the mechanism of action of B. cereus emetic syndrome?"
    back: "Preformed exotoxin in rice dishes\n\nB. cereus type A (emetic) produces a preformed heat-stable exotoxin in reheated rice, causing symptoms within 1-6 hours."
    difficulty: medium
    tags: [gastroenterology, b-cereus, pathophysiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which protozoal parasites account for ~10% of traveller's diarrhea in long-term travellers?"
    back: "Giardia, Entamoeba histolytica, Cryptosporidium, and Cyclospora\n\nProtozoal causes are rare (~10%) in short-term travellers but more significant in long-term travellers to endemic areas."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, protozoa, parasites, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the incubation period for C. perfringens?"
    back: "8-12 hours\n\nC. perfringens has an 8-12 hour incubation period, causes diarrhea without fever, and is self-limited within 24 hours."
    difficulty: easy
    tags: [gastroenterology, c-perfringens, infectious-diarrhea, bacteria, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the recommended prevention strategy for traveller's diarrhea?"
    back: "Proper hygiene: avoid street vendor food, raw fruits/vegetables without peel, undercooked meat/seafood, untreated water\n\nPrevention includes avoiding risky foods/beverages. Bismuth subsalicylate (Pepto-Bismol) is 60% effective. Antibiotic prophylaxis is NOT recommended."
    difficulty: easy
    tags: [gastroenterology, travellers-diarrhea, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the usual duration of non-typhoidal salmonellosis?"
    back: "3-7 days\n\nNon-typhoidal salmonellosis typically lasts 3-7 days and usually does not require antibiotics except in severe illness, extremes of age, or specific comorbidities."
    difficulty: easy
    tags: [gastroenterology, salmonella, infectious-diarrhea, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the key investigation finding in Entamoeba histolytica sigmoidoscopy?"
    back: "Flat ulcers with yellow exudates\n\nSigmoidoscopy in amebic dysentery may show flat ulcers with yellow exudates, distinguishing it from other causes of dysentery."
    difficulty: medium
    tags: [gastroenterology, entamoeba, investigations, parasites, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first-line treatment for Giardia lamblia?"
    back: "Metronidazole or nitazoxanide\n\nMetronidazole is first-line for Giardia, with nitazoxanide as an alternative. Treatment of asymptomatic carriers is NOT recommended."
    difficulty: easy
    tags: [gastroenterology, giardia, antibiotics, parasites, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the typical incubation period for Giardia?"
    back: "1-4 weeks\n\nGiardia lamblia has an incubation period of 1-4 weeks, transmitted fecal-orally through contaminated food/water."
    difficulty: easy
    tags: [gastroenterology, giardia, parasites, incubation, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first-line dietary intervention for IBS symptoms?"
    back: "Low FODMAP diet (Fermentable Oligo-, Di-, Monosaccharides And Polyols) for pain, bloating, gas, and diarrhea.\n\nLow FODMAP diet reduces fermentable carbohydrate absorption, decreasing symptoms in many IBS patients."
    difficulty: easy
    tags: [Gastroenterology, IBS, Diet Therapy, FODMAP, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "How is constipation defined according to Toronto Notes?"
    back: "Passage of infrequent/hard stools and/or difficult stool evacuation (e.g., straining, sensation of anorectal blockage).\n\nConstipation is defined by stool frequency (<3/week), form (hard/lumpy), and/or difficult passage."
    difficulty: easy
    tags: [Gastroenterology, Constipation, Definition, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
