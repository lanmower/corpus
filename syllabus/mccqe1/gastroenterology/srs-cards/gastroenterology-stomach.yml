# Gastroenterology Stomach (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What are the cells of the gastric mucosa and their secretory products?"
    back: "- Parietal cells: gastric acid (HCl) and intrinsic factor (IF); stimulated by histamine, acetylcholine (ACh), and gastrin\n- Chief cells: pepsinogen; stimulated by vagal input and local acid\n- D-cells: somatostatin; inhibits release of hormones including gastrin\n- G-cells: gastrin; stimulates H+ production from parietal cells\n- Superficial epithelial cells: mucus and HCO3−; protect gastric mucosa\n\nUnderstanding gastric cell physiology is fundamental to the pharmacology of acid suppression (PPIs block H+/K+-ATPase on parietal cells; H2 blockers antagonize histamine at parietal cells) and to conditions like pernicious anemia (loss of IF from parietal cells causes B12 deficiency)."
    difficulty: easy
    tags: [gastric mucosa, parietal cells, chief cells, gastrin, intrinsic factor, gastroenterology]
