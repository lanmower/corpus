# SLE & Connective Tissue Disease (Rheumatology) - generated from srs-mccqe1
cards:
  - front: "A 28-year-old woman presents with a malar rash, arthritis, proteinuria, and a positive ANA (1:320). Which antibody is most specific for SLE?"
    back: "Anti-dsDNA (anti-double-stranded DNA antibody)\n\nAnti-dsDNA has ~95% specificity for SLE and correlates with disease activity and lupus nephritis. Anti-Sm is also highly specific but less sensitive. ANA is sensitive (>95%) but not specific."
    difficulty: easy
    tags: [SLE, anti-dsDNA, ANA, antibody, lupus]
  - front: "Which organ involvement in SLE most significantly impacts long-term prognosis?"
    back: "Lupus nephritis (renal involvement)\n\nLupus nephritis occurs in 50% of SLE patients and is a major cause of morbidity and mortality. Class III/IV proliferative nephritis requires aggressive immunosuppression (hydroxychloroquine + mycophenolate or cyclophosphamide + high-dose steroids)."
    difficulty: medium
    tags: [lupus-nephritis, SLE, prognosis, immunosuppression]
  - front: "What is the mechanism of antiphospholipid syndrome (APS) complicating SLE?"
    back: "Antiphospholipid antibodies (lupus anticoagulant, anti-cardiolipin, anti-β2GP1) cause hypercoagulability leading to arterial/venous thrombosis and pregnancy loss\n\nAPS in SLE increases risk of DVT, stroke, and recurrent miscarriage. Diagnosis requires a clinical event plus persistent positive antibody test >12 weeks apart. Treatment: long-term anticoagulation with warfarin."
    difficulty: medium
    tags: [antiphospholipid-syndrome, SLE, thrombosis, lupus-anticoagulant, warfarin]
  - front: "Which drug is recommended for all patients with SLE regardless of disease severity?"
    back: "Hydroxychloroquine (HCQ)\n\nHCQ reduces SLE flares, organ damage accrual, thrombosis risk, and improves pregnancy outcomes. It is recommended indefinitely for all SLE patients. Annual ophthalmology screening for retinopathy is required."
    difficulty: easy
    tags: [SLE, hydroxychloroquine, HCQ, retinopathy, treatment]
  - front: "A 25-year-old woman with SLE is planning pregnancy. Which antibody predicts risk of neonatal lupus and congenital heart block?"
    back: "Anti-Ro/SSA (and anti-La/SSB) antibodies\n\nAnti-Ro antibodies cross the placenta and can cause neonatal lupus (transient rash, cytopenias) and congenital complete heart block (irreversible). Fetal cardiac monitoring by echocardiography is recommended from 16–28 weeks in anti-Ro+ mothers."
    difficulty: medium
    tags: [SLE, pregnancy, anti-Ro, neonatal-lupus, congenital-heart-block]
  - front: "What are the SLEDAI criteria used for?"
    back: "Scoring SLE disease activity (SLE Disease Activity Index)\n\nSLEDAI assesses 24 clinical and laboratory features across 9 organ systems. Scores >4 indicate active disease requiring treatment adjustment. It is used in clinical care and research to monitor disease activity over time."
    difficulty: easy
    tags: [SLE, SLEDAI, disease-activity, monitoring]
  - front: "A patient with SLE develops a butterfly rash flare 3 days after starting trimethoprim-sulfamethoxazole for a UTI. What phenomenon is this?"
    back: "Drug-induced lupus or SLE flare triggered by sulfonamide antibiotic\n\nSulfonamides, procainamide, hydralazine, and minocycline can trigger drug-induced lupus or exacerbate SLE. Nitrofurantoin or cephalosporins are safer UTI treatment options in SLE patients."
    difficulty: medium
    tags: [SLE, drug-induced-lupus, sulfonamide, flare, medication-safety]
  - front: "What are the SLICC criteria for SLE diagnosis?"
    back: ">=4 of 11 clinical criteria (including malar rash, discoid, photosensitivity, oral ulcers, arthritis, serositis, renal, neuro, hematologic, immunologic, ANA) OR biopsy-proven lupus nephritis + ANA or anti-dsDNA\n\nAnti-dsDNA specific for SLE and correlates with nephritis activity. Anti-Smith most specific. Complement C3/C4 low in active disease. Hydroxychloroquine for all SLE patients (reduces flares, thrombosis, mortality)."
    difficulty: hard
    tags: [SLE, SLICC]
  - front: "What are the 2019 EULAR/ACR classification criteria for SLE?"
    back: "Entry: ANA >=1:80. Score domains (>=10): hematologic, neuropsych, mucocutaneous, serosal, MSK, renal + immunology (anti-dsDNA, complement, aPL). Each criterion not attributable to other diagnosis\n\nANA 98% sensitive, not specific. Anti-dsDNA and anti-Smith are specific. Weighted scoring replaced 1997 criteria. Anti-dsDNA: monitor for flare (rising titer). Low complement: active disease."
    difficulty: hard
    tags: [SLE, classification, ANA]
  - front: "How is SLE managed by severity?"
    back: "Mild (skin/joints): HCQ + NSAIDs + topical steroids. Moderate (serositis/cytopenias): + low-dose pred + MTX/AZA. Severe (nephritis/CNS): + high-dose steroids + MMF or cyclophosphamide + belimumab\n\nHCQ for ALL SLE: reduces flares, damage, mortality, thrombosis. 5mg/kg/day. Eye exam after 5yr. Lupus nephritis: biopsy to classify, Class III/IV need aggressive IS. Voclosporin newer option for nephritis."
    difficulty: hard
    tags: [SLE, hydroxychloroquine, management]
  - front: "What lab monitoring is needed in SLE?"
    back: "CBC (cytopenias), Cr, urinalysis + uPCR, C3/C4 (low=active), anti-dsDNA (rising=flare), ESR. Active nephritis: low complement + rising dsDNA + active sediment (RBC casts, proteinuria)\n\nSLEDAI for disease activity. Drug monitoring: CBC for AZA/MTX, LFTs for MTX, eye exam for HCQ. Distinguish flare from infection: procalcitonin may help. Annual: lipids, glucose (accelerated atherosclerosis)."
    difficulty: hard
    tags: [SLE, monitoring, complement]
  - front: "What are the major complications of SLE?"
    back: "Nephritis (50%), accelerated atherosclerosis (leading late death), infections (leading early death), AVN (steroids), APS (20-30%), lymphoma risk\n\nCV disease 5-10x. Manage CV risk aggressively. Pregnancy: high-risk, plan when quiescent x6mo. Anti-Ro/La: neonatal lupus risk, congenital heart block 2%."
    difficulty: hard
    tags: [SLE, complications, nephritis]
  - front: "What is antiphospholipid syndrome and how is it managed?"
    back: "Clinical (thrombosis or pregnancy morbidity) + lab (LAC, aCL, anti-B2GP x2 tests 12wk apart). Treatment: lifelong warfarin (NOT DOACs per TRAPS trial). Pregnancy: LMWH + ASA\n\nAPS primary or secondary to SLE. INR 2-3 venous, consider 3-4 arterial. Catastrophic APS: multi-organ failure, treat with plasma exchange + anticoag + steroids + IVIG. DOACs inferior to warfarin."
    difficulty: hard
    tags: [APS, antiphospholipid, warfarin]
  - front: "How is SLE managed in pregnancy?"
    back: "Continue HCQ (safe, protective). Stop MTX/MMF/CYC (teratogenic). Use AZA if IS needed. ASA from 12wk. Monitor anti-Ro (2% CHB risk, fetal HR from 16wk). Plan when quiescent >=6mo\n\nFlare vs preeclampsia: low complement + active sediment = flare. High-risk: preeclampsia, flare, IUGR, preterm. Multidisciplinary care. Breastfeeding safe with HCQ, AZA, prednisone, NSAIDs."
    difficulty: hard
    tags: [SLE, pregnancy, HCQ]
  - front: "What is drug-induced lupus?"
    back: "Triggers: hydralazine, procainamide, INH, minocycline, TNFi. Features: arthralgia, serositis, no renal/CNS. Anti-histone Ab+ (>95%), anti-dsDNA usually negative. Resolves on discontinuation\n\nMilder than SLE. No nephritis or significant cytopenias. Symptoms resolve weeks-months after stopping drug. Short-course NSAIDs or low-dose prednisone for symptom control if needed."
    difficulty: medium
    tags: [drug-induced lupus, anti-histone]
  - front: "What skin manifestations occur in SLE?"
    back: "Malar rash (spares nasolabial folds), discoid (scarring), photosensitivity, oral ulcers (usually painless), alopecia, Raynaud. Subacute cutaneous: annular, anti-Ro+, photosensitive\n\nMalar vs rosacea (involves nasolabial folds) vs seborrheic dermatitis. Discoid can occur without systemic SLE (5-10% progress). Livedo reticularis suggests APS. Bullous lupus with vesicles/bullae."
    difficulty: medium
    tags: [SLE, skin, malar rash]
  - front: "What is lupus nephritis classification and treatment?"
    back: "ISN/RPS I-VI. Class III/IV (proliferative): induction with MMF or CYC + steroids, maintenance with MMF/AZA. Class V (membranous): treat if nephrotic. Add belimumab or voclosporin\n\nBiopsy essential for classification. Class IV worst prognosis. Target: proteinuria <0.5-0.8g/d by 12mo. 10-30% progress to ESRD. Monitor creatinine, proteinuria, complement, anti-dsDNA serially."
    difficulty: hard
    tags: [lupus nephritis, ISN/RPS, MMF]
  - front: "What infection risks exist in immunosuppressed SLE patients?"
    back: "Increased: bacterial (pneumonia, UTI), herpes zoster, PCP, CMV, TB. Vaccinate before IS (no live vaccines on IS). PCP prophylaxis with TMP-SMX on CYC or high-dose steroids\n\nInfections = leading cause early SLE death. Screen latent TB before biologics/CYC. Update pneumococcal, influenza, COVID, HBV. Shingrix (non-live) safe on IS. Fever: distinguish flare vs infection."
    difficulty: hard
    tags: [SLE, infection, immunosuppression]
  - front: "Classify the vasculitides and describe the key features of GPA, GCA, PAN, and IgA vasculitis."
    back: "Classification by vessel size: Large: GCA, Takayasu; Medium: PAN, Kawasaki; Small (ANCA-associated): GPA, MPA, EGPA; Small (immune complex): IgA vasculitis, cryoglobulinemic. GPA (granulomatosis with polyangiitis, formerly Wegener): c-ANCA/PR3+, triad of upper airway (sinusitis, saddle nose, epistaxis), lungs (nodules, cavities, hemorrhage), kidneys (RPGN); Tx: cyclophosphamide + glucocorticoids induction, then rituximab or azathioprine maintenance. GCA (giant cell arteritis): age >50, temporal headache, jaw claudication, visual loss (EMERGENCY — can cause bilateral blindness), elevated ESR/CRP; Tx: high-dose prednisone immediately (do NOT wait for biopsy), temporal artery biopsy. PAN: medium vessel, NO glomerulonephritis, associated with HBV, mesenteric ischemia, mononeuritis multiplex, renal artery microaneurysms; ANCA-negative. IgA vasculitis (Henoch-Schonlein purpura): palpable purpura (buttocks/legs), arthritis, abdominal pain, renal involvement (IgA nephropathy); mostly children.\n\nANCA testing is critical for small vessel vasculitis: c-ANCA/PR3 = GPA, p-ANCA/MPO = MPA/EGPA. GCA is the most common systemic vasculitis in adults >50. Temporal artery biopsy should be performed within 2 weeks of starting steroids (inflammation persists). Canadian Vasculitis Research Network (CanVasc) provides national treatment guidelines."
    difficulty: hard
    tags: [vasculitis, GPA, GCA, PAN, IgA vasculitis, ANCA, rheumatology]
  - front: "What are the treatment principles for ANCA-associated vasculitis (GPA, MPA)?"
    back: "Induction (severe/organ-threatening): rituximab (anti-CD20) OR cyclophosphamide + high-dose glucocorticoids (pulse IV methylprednisolone for severe disease, then prednisone taper). Plasma exchange (PLEX): for severe RPGN or pulmonary hemorrhage (evidence evolving — PEXIVAS trial showed no significant benefit for mortality but may help in select cases). Maintenance: rituximab (preferred) or azathioprine for ≥2 years after remission; methotrexate alternative for non-renal GPA. Adjuncts: TMP-SMX for Pneumocystis prophylaxis (all patients on immunosuppression), pneumococcal/influenza vaccines. Monitoring: ANCA titers (can guide relapse risk), renal function, urinalysis.\n\nThe RAVE trial established rituximab as non-inferior to cyclophosphamide for induction, with better outcomes in relapsing disease. CanVasc consensus guidelines recommend rituximab for maintenance. GPA has a high relapse rate (~50% within 5 years) — long-term monitoring is essential. TMP-SMX may also help prevent relapse in upper airway GPA (in addition to PJP prophylaxis)."
    difficulty: hard
    tags: [ANCA vasculitis, rituximab, cyclophosphamide, GPA, MPA, rheumatology]
  - front: "What nail finding is pathognomonic for scleroderma (systemic sclerosis)?"
    back: "Nail fold telangiectasias (periungual telangiectasias with cuticular hemorrhages and capillary changes). Also: pterygium inversum unguis (distal nail plate does not separate from nail bed).\n\nNailfold capillaroscopy showing giant capillaries and capillary loss is a key diagnostic finding in scleroderma. These nail changes also appear in SLE and dermatomyositis."
    difficulty: medium
    tags: [scleroderma, nail fold telangiectasias, nail changes]
  - front: "What skin manifestation is classic for Behçet's disease?"
    back: "Painful aphthous ulcers in oral cavity AND genital mucous membranes, plus erythema nodosum and acneiform papules.\n\nBehçet disease is a systemic vasculitis. The combination of oral and genital ulcers is the hallmark. Other features include uveitis, arthritis, and neurological involvement. No definitive diagnostic test exists."
    difficulty: medium
    tags: [Behçet disease, oral ulcers, genital ulcers, vasculitis]
  - front: "What are the classic skin findings of dermatomyositis?"
    back: "Heliotrope rash (periorbital violaceous erythema with edema), Gottron's papules (violaceous flat-topped papules over knuckles), periungual erythema/telangiectasia, photosensitive erythema over extensor surfaces, calcinosis cutis.\n\nDermatomyositis is associated with malignancy (lung, breast, ovary) in adults, so cancer screening is essential at diagnosis. Anti-Mi-2 antibodies are specific; anti-MDA5 correlates with ILD."
    difficulty: medium
    tags: [dermatomyositis, Gottrons papules, heliotrope, skin manifestations]
  - front: "What skin manifestations are associated with SLE?"
    back: "Malar (butterfly) rash, discoid rash (erythematous plaques with keratotic scale, follicular plugging, atrophic scarring), photosensitivity, palpable purpura, alopecia, mucosal ulcers, hemorrhagic bullae.\n\nThe malar rash spares the nasolabial folds (distinguishing from rosacea and seborrheic dermatitis). Discoid lupus can cause permanent scarring alopecia. Anti-dsDNA and anti-Smith antibodies are specific for SLE."
    difficulty: medium
    tags: [SLE, lupus, malar rash, discoid rash, skin manifestations]
  - front: "What are the skin manifestations of scleroderma/systemic sclerosis?"
    back: "Raynaud's phenomenon, non-pitting edema, digital ulcers, cutaneous calcification (calcinosis cutis), periungual telangiectasias, acrosclerosis, salt-and-pepper pigmentation. Morphea: localized scleroderma with waxy/shiny/tense atrophic skin.\n\nCREST syndrome (Calcinosis, Raynaud's, Esophageal dysmotility, Sclerodactyly, Telangiectasias) is a limited form of scleroderma. Anti-centromere antibodies are associated with CREST; anti-Scl-70 with diffuse scleroderma."
    difficulty: medium
    tags: [scleroderma, Raynauds, morphea, CREST syndrome]
