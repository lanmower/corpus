  - front: "What foods should be avoided in GERD?"
    back: "Alcohol, coffee, spices, tomatoes, and citrus juices\n\nThese dietary triggers may worsen GERD symptoms but do not affect the underlying disease process."
    difficulty: easy
    tags: [GERD, diet, lifestyle, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "When should PPIs be continued as maintenance therapy in GERD?"
    back: "If symptoms recur after discontinuation, or if patient has Barrett's esophagus or erosive esophagitis\n\nMaintenance PPI is indicated for complicated GERD, but can be discontinued in recovered patients without BE or erosive esophagitis."
    difficulty: medium
    tags: [GERD, PPI, maintenance therapy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is on-demand therapy appropriate for in GERD?"
    back: "Non-erosive esophagitis (NERD)\n\nPatients with NERD can use on-demand therapy with antacids, alginates, H2-blockers, or PPIs rather than daily therapy."
    difficulty: medium
    tags: [GERD, NERD, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the classic endoscopic appearance of Barrett's esophagus?"
    back: "Salmon pink mucosa in the distal esophagus\n\nThe salmon-pink (or reddish) appearance in the distal esophagus is the classic endoscopic finding, though biopsy confirmation is required."
    difficulty: easy
    tags: [Barretts esophagus, endoscopy, appearance, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What causes esophageal stricture in GERD?"
    back: "Scarring from chronic inflammation\n\nChronic GERD leads to repeated injury and healing, resulting in fibrosis and stricture formation that causes dysphagia to solids."
    difficulty: easy
    tags: [GERD, esophageal stricture, pathology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
