# Dermatology (Dermatology) - generated from srs-mccqe1
cards:
  - front: "A 3-month-old infant presents with a hot, firm, red-blue plaque on the face that appeared shortly after birth and has been growing. What is the most likely diagnosis, and when should treatment be considered?"
    back: "Hemangioma of infancy. Treatment is considered if there is functional impairment (visual compromise, airway obstruction, high-output cardiac failure) or cosmesis. 50% resolve spontaneously by age 5. First-line treatment includes topical timolol or systemic propranolol.\n\nInfantile hemangiomas are benign vascular tumours that proliferate after birth then regress. Early specialist referral is needed for high-risk locations. Propranolol has become standard first-line systemic therapy."
    difficulty: easy
    tags: [dermatology, pediatrics, vascular tumours, hemangioma]
  - front: "A 45-year-old man with chronic liver disease has multiple small red lesions on his upper body that blanch when the central arteriole is compressed with a paperclip. What are these lesions?"
    back: "Spider angiomas (Campbell telangiectasia). They consist of a central red arteriole with slender radiating branches and can be associated with hyperestrogenic states such as liver disease, pregnancy, or OCP use.\n\nSpider angiomas blanch when pressure is applied to the central arteriole. While they can occur in healthy individuals, multiple spider angiomas suggest a hyperestrogenic state, most commonly chronic liver disease."
    difficulty: easy
    tags: [dermatology, hepatology, vascular lesions, spider angioma]
  - front: "What is the backbone of topical acne therapy, and what combination approach is most effective for mild-to-moderate acne?"
    back: "Topical retinoids (tretinoin, adapalene, tazarotene) are the backbone of topical acne therapy. A combination of topical retinoids with topical erythromycin or clindamycin is more effective than either agent alone. Benzoyl peroxide should be included to prevent antibiotic resistance.\n\nRetinoids target the microcomedone, the precursor to all acne lesions, by normalizing follicular keratinization. Adding benzoyl peroxide prevents C. acnes resistance that occurs with antibiotic monotherapy."
    difficulty: easy
    tags: [dermatology, acne, pharmacology, retinoids]
  - front: "A 17-year-old male with severe nodulocystic acne is being started on isotretinoin. What baseline investigations are required, and what is the most critical counselling point?"
    back: "Baseline investigations: fasting lipid profile (risk of hypertriglyceridemia), LFTs, and pregnancy test (f-hCG). The most critical counselling point is teratogenicity -- isotretinoin is associated with spontaneous abortion and major birth defects (facial dysmorphism, cognitive impairment). Two forms of contraception are required for female patients.\n\nIsotretinoin is highly teratogenic and requires pregnancy exclusion before initiation. Hypertriglyceridemia and hepatotoxicity are monitored adverse effects. Most other side effects are temporary and resolve on discontinuation."
    difficulty: medium
    tags: [dermatology, acne, isotretinoin, teratogenicity, pharmacology]
  - front: "How can rosacea be differentiated from acne vulgaris on clinical examination?"
    back: "Rosacea is differentiated from acne by: (1) absence of comedones, (2) predilection for the central face (forehead, nose, cheeks, chin), and (3) presence of flushing and telangiectasia. Rosacea also features dome-shaped inflammatory papules and pustules with remissions and exacerbations triggered by heat, cold, alcohol, and spicy food.\n\nThe key distinguishing feature is the absence of comedones in rosacea. Acne has comedones as a hallmark. Rosacea predominantly affects fair-skinned individuals aged 30-50 with F>M prevalence."
    difficulty: easy
    tags: [dermatology, rosacea, acne, differential diagnosis]
  - front: "A 6-month-old infant presents with erythematous, pruritic plaques on the face and extensor surfaces. There is a family history of asthma. What is the most likely diagnosis, and what is the underlying genetic association?"
    back: "Atopic dermatitis (eczema). It is associated with a genetic mutation in the filaggrin gene (FLG), causing impaired epidermal barrier function and prolonged skin dryness. It is part of the atopic triad with asthma and allergic rhinitis.\n\nAtopic dermatitis affects 10-20% of children under 5 in developed countries. The filaggrin gene mutation leads to barrier dysfunction, allowing allergen penetration. Distribution varies by age: face/extensors in infants, flexural areas in older children and adults."
    difficulty: easy
    tags: [dermatology, atopic dermatitis, pediatrics, filaggrin, genetics]
  - front: "What are the advantages of topical calcineurin inhibitors (tacrolimus, pimecrolimus) over topical corticosteroids in the management of atopic dermatitis?"
    back: "Topical calcineurin inhibitors do not cause skin atrophy, making them safe for sensitive areas such as the face and neck. They can be used as steroid-sparing agents for long-term use and applied 2-3 times per week to recurrent sites for relapse prevention. The main side effect is a burning sensation that decreases with continued use.\n\nLong-term topical corticosteroid use causes atrophy, striae, telangiectasia, and purpura. Calcineurin inhibitors avoid these effects by selectively inhibiting T-cell activation without affecting dermal collagen synthesis."
    difficulty: medium
    tags: [dermatology, atopic dermatitis, calcineurin inhibitors, pharmacology]
  - front: "How do you distinguish irritant contact dermatitis from allergic contact dermatitis?"
    back: "Irritant contact dermatitis is a non-immune toxic injury causing erythema, dryness, and burning, occurring in anyone given sufficient irritant exposure. Allergic contact dermatitis is a Type IV delayed hypersensitivity reaction causing papulovesicular eruptions with pruritus, requiring prior sensitization that persists indefinitely. Patch testing identifies the specific allergen in allergic contact dermatitis.\n\nIrritant contact dermatitis is more common and affects the hands most frequently. Allergic contact dermatitis requires sensitization and can be confirmed with patch testing. Common allergens include nickel, fragrance, and tattoo dyes."
    difficulty: medium
    tags: [dermatology, contact dermatitis, type IV hypersensitivity, patch testing]
  - front: "A patient with chronic venous insufficiency presents with erythematous, scaly, pruritic plaques on the medial ankles with brown hemosiderin deposition. What is the most important therapy?"
    back: "Compression stockings are the most important therapy for stasis dermatitis (if no peripheral arterial disease). Additional management includes leg elevation, daily moisturizer after shower, and mid-to-high potency topical corticosteroids for inflammation.\n\nStasis dermatitis results from chronic venous insufficiency causing venous stasis and surrounding soft tissue inflammation. Complications include ulceration (commonly at the medial malleolus) and secondary bacterial infections. Peripheral arterial disease must be ruled out before compression."
    difficulty: easy
    tags: [dermatology, stasis dermatitis, venous insufficiency, compression therapy]
  - front: "What are the '6 Ps' of lichen planus, and what is the pathognomonic finding on oral examination?"
    back: "The 6 Ps are: Purple, Polygonal, Planar (flat-topped), Pruritic, Papules, and Peripheral (wrists). Wickham's striae -- a lacy, whitish reticular network on oral mucosa -- is the pathognomonic finding.\n\nLichen planus is an immune-mediated condition affecting skin, mucous membranes, hair follicles, and nails. Oral involvement occurs in 60% of cases. Erosive oral lichen planus carries an increased risk of SCC. It is rarely associated with hepatitis C."
    difficulty: easy
    tags: [dermatology, lichen planus, Wickham striae, oral pathology]
  - front: "A 25-year-old presents with an oval, scaly plaque on the trunk followed 2 weeks later by multiple smaller oval plaques arranged along skin tension lines in a 'Christmas tree' pattern. What is the diagnosis?"
    back: "Pityriasis rosea. The initial lesion is the 'herald patch,' and the subsequent eruption follows Langer lines (skin tension lines). It is self-limiting, resolving spontaneously in 6-12 weeks.\n\nPityriasis rosea is an acute, self-limiting eruption suspected to be caused by HHV-7 or HHV-6 reactivation. No treatment is required. Symptomatic relief with TCS can be provided if pruritic. The 'Christmas tree' pattern on the back is characteristic."
    difficulty: easy
    tags: [dermatology, pityriasis rosea, herald patch, papulosquamous]
  - front: "What is the Auspitz sign, and in which dermatological condition is it found?"
    back: "The Auspitz sign is pinpoint bleeding observed when the silvery-white scale of plaque psoriasis is removed. It is characteristic of plaque psoriasis.\n\nThe Auspitz sign results from the thinned epidermis overlying dilated and tortuous capillaries in the dermal papillae. Psoriasis is characterized by well-circumscribed erythematous plaques with silvery scales on extensor surfaces, scalp, and trunk."
    difficulty: easy
    tags: [dermatology, psoriasis, Auspitz sign, clinical signs]
  - front: "A 30-year-old patient with psoriasis affecting >10% BSA (PASI >10) has failed topical therapy. What are the next steps in management?"
    back: "For moderate-to-severe psoriasis (BSA >10%, PASI >10): phototherapy (if accessible), systemic therapy (methotrexate, cyclosporine, acitretin, apremilast), or biologic therapy (anti-TNF, anti-IL-17, anti-IL-23 agents). TCS plus topical vitamin D3 analogue can be used as adjunct therapy.\n\nSeverity guides treatment: mild psoriasis is managed topically, while moderate-to-severe disease requires systemic or biologic therapy. Biologics such as secukinumab (anti-IL-17A) and guselkumab (anti-IL-23) show high efficacy rates."
    difficulty: medium
    tags: [dermatology, psoriasis, biologics, systemic therapy]
  - front: "What is guttate psoriasis, and what antecedent infection is commonly associated with it?"
    back: "Guttate psoriasis presents as discrete, scattered salmon-pink small scaling papules diffusely on the trunk and legs, sparing palms and soles. It is commonly preceded by streptococcal pharyngitis (GAS). Treatment includes broadband UVB phototherapy and antibiotics if GAS is confirmed on throat culture.\n\nGuttate psoriasis is triggered by molecular mimicry between streptococcal antigens and keratinocyte proteins. It typically affects younger patients and may resolve after treatment of the streptococcal infection, though some patients progress to chronic plaque psoriasis."
    difficulty: easy
    tags: [dermatology, guttate psoriasis, streptococcal infection, phototherapy]
  - front: "What is erythrodermic psoriasis, and why is it a medical emergency?"
    back: "Erythrodermic psoriasis is generalized erythema affecting >90% of BSA with fine desquamative scale. It is potentially life-threatening due to risk of dehydration, electrolyte imbalance, and hypothermia. It requires immediate hospitalization with IV fluids, electrolyte monitoring, and treatment with cyclosporine, acitretin, methotrexate, or biologics.\n\nThe massive skin inflammation leads to loss of thermoregulation and barrier function. Aggravating factors include lithium, beta-blockers, NSAIDs, antimalarials, and sudden corticosteroid withdrawal. It is one of the few true dermatologic emergencies."
    difficulty: medium
    tags: [dermatology, erythrodermic psoriasis, dermatologic emergency]
  - front: "How do you differentiate bullous pemphigoid from pemphigus vulgaris based on clinical features and pathophysiology?"
    back: "Bullous pemphigoid: tense subepidermal bullae, pruritic, IgG against basement membrane (BP180/BP230), heals without scarring, age 60-80. Pemphigus vulgaris: flaccid intraepidermal bullae, non-pruritic, IgG against desmoglein-1 and -3, positive Nikolsky sign, oral involvement in 90%, age 15-50, potentially fatal without treatment.\n\nThe mnemonic is: pemphigus Vulgaris = superficial/intraepidermal/flaccid; pemphigoiD = deeper/dermal-epidermal junction/tense. The level of blister formation determines the tenseness of the bulla."
    difficulty: medium
    tags: [dermatology, bullous pemphigoid, pemphigus vulgaris, autoimmune blistering]
  - front: "A patient with intensely pruritic grouped papulovesicles on the extensor elbows, knees, and buttocks is found to have IgA deposits on skin biopsy. What is the diagnosis and what associated GI condition must be investigated?"
    back: "Dermatitis herpetiformis. 90% of patients have gluten-sensitive enteropathy (celiac disease), though only 20% have intestinal symptoms. Treatment includes dapsone and a lifelong gluten-free diet, which also reduces the risk of intestinal lymphoma.\n\nDermatitis herpetiformis is caused by transglutaminase IgA deposits in the skin. Patients carry HLA-DQ2 or DQ8. The gluten-free diet treats both the skin and intestinal manifestations and reduces lymphoma risk in untreated celiac disease."
    difficulty: medium
    tags: [dermatology, dermatitis herpetiformis, celiac disease, IgA, dapsone]
  - front: "What are the four criteria used to classify drug reactions by Naranjo et al.?"
    back: "(1) Temporal relationship between drug exposure and reaction, (2) recognized response to the suspected drug, (3) improvement after drug withdrawal, (4) recurrence on re-challenge. A definite drug reaction requires all 4 criteria; probable requires criteria 1-3; possible requires only criterion 1.\n\nThe Naranjo criteria provide a systematic approach to establishing causality in adverse drug reactions. Re-challenge is rarely performed deliberately due to safety concerns but may occur inadvertently."
    difficulty: easy
    tags: [dermatology, pharmacology, drug eruptions, Naranjo criteria]
  - front: "A patient presents with a morbilliform rash, fever, cervical lymphadenopathy, and hepatitis 3 weeks after starting carbamazepine. What is the diagnosis, and what is the mortality rate if untreated?"
    back: "Drug Reaction with Eosinophilia and Systemic Symptoms (DRESS) / Drug-Induced Hypersensitivity Syndrome (DIHS). Mortality is 10% if severe, undiagnosed, and untreated. Common causative agents include anticonvulsants (phenytoin, carbamazepine, lamotrigine), sulfonamides, and allopurinol.\n\nDRESS typically presents 1-6 weeks after first drug exposure and persists weeks after drug withdrawal. It starts on the face and spreads caudally without mucosal involvement. Treatment is drug discontinuation plus prednisone 0.5 mg/kg/day."
    difficulty: medium
    tags: [dermatology, DRESS, drug hypersensitivity, carbamazepine]
  - front: "What distinguishes Stevens-Johnson syndrome (SJS) from toxic epidermal necrolysis (TEN), and what is the mortality difference?"
    back: "SJS: <10% BSA with epidermal detachment; 5% mortality. SJS/TEN overlap: 10-30% BSA. TEN: >30% BSA; 30% mortality. Both present with prodromal rash, positive Nikolsky sign, full-thickness epidermal loss, and mucous membrane erosions. Common causative drugs include allopurinol, anti-epileptics, sulfonamides, and NSAIDs.\n\nSJS and TEN represent a spectrum of the same disease, differentiated by BSA involvement. The SCORTEN score predicts mortality. HLA-B*1502 (carbamazepine in East Asians) and HLA-B*5801 (allopurinol) are pharmacogenomic risk factors. Treatment includes ICU admission, supportive care, and IVIg or cyclosporine."
    difficulty: hard
    tags: [dermatology, SJS, TEN, drug reaction, dermatologic emergency]
  - front: "What are the diagnostic criteria for Neurofibromatosis Type 1 (NF1)?"
    back: "Diagnosis requires 2 or more of: (1) >=6 cafe-au-lait macules (>1.5 cm in adults, >0.5 cm prepubertal), (2) axillary or inguinal freckling, (3) >=2 Lisch nodules (iris hamartomas), (4) optic glioma, (5) >=2 neurofibromas or 1 plexiform neurofibroma, (6) distinctive bony lesion (sphenoid wing dysplasia), (7) heterozygous pathogenic NF1 variant.\n\nNF1 is autosomal dominant with 1:3000 incidence and high spontaneous mutation rate. It is caused by loss-of-function of neurofibromin. Associated conditions include pheochromocytoma, scoliosis, and renal artery stenosis. A child of an affected parent needs only 1 criterion."
    difficulty: medium
    tags: [dermatology, genetics, neurofibromatosis, NF1, neurocutaneous]
  - front: "What autoimmune conditions should be investigated in a patient diagnosed with vitiligo?"
    back: "Thyroid disease (most common), pernicious anemia, Addison's disease, and Type 1 diabetes mellitus. Wood's lamp can detect lesions by illuminating UV light onto skin to reveal porcelain white (amelanotic) discolouration.\n\nVitiligo is an autoimmune destruction of melanocytes with 1% incidence. It displays the Koebner phenomenon and affects extensor and periorificial areas. Treatment options include topical calcineurin inhibitors, TCS, phototherapy (NB-UVB), and topical ruxolitinib (JAK inhibitor)."
    difficulty: easy
    tags: [dermatology, vitiligo, autoimmune, thyroid disease]
  - front: "A child presents with honey-crusted lesions on the face. What is the diagnosis, and what is the first-line treatment for localized disease?"
    back: "Impetigo, caused by GAS, S. aureus, or both. For localized disease: topical antibiotics such as mupirocin 2% or fusidic acid 2% TID, continuing for 7-10 days after resolution. For extensive disease: systemic antibiotics (dicloxacillin or cephalexin for 7-10 days).\n\nImpetigo is an acute superficial bacterial infection common in preschool children. The golden-yellow 'honey-crusted' appearance is characteristic. Differential diagnosis includes infected eczema, HSV, and VZV."
    difficulty: easy
    tags: [dermatology, impetigo, bacterial infection, pediatrics]
  - front: "How do erysipelas and cellulitis differ in terms of clinical features and depth of skin involvement?"
    back: "Erysipelas involves the upper dermis: confluent erythematous plaque with sharp, raised edges, well-demarcated, very painful, caused primarily by GAS, spreads via lymphatics. Cellulitis involves the lower dermis/subcutaneous fat: unilateral erythematous flat lesion, poorly demarcated, not uniformly raised, caused by GAS and S. aureus.\n\nBoth present with erythema and pain but differ in depth and border definition. Erysipelas classically has sharply demarcated raised borders. Both are treated with beta-lactam antibiotics (penicillin/cephalexin) as first line."
    difficulty: easy
    tags: [dermatology, erysipelas, cellulitis, bacterial infection]
  - front: "What is the treatment for tinea capitis, and why are oral agents required?"
    back: "Oral terbinafine (Lamisil) for 4 weeks is the first-line treatment. Oral agents are required because the dermatophyte resides within the hair root, which topical agents cannot penetrate. Adjunctive antifungal shampoos (selenium sulfide, ketoconazole) may prevent spread.\n\nTinea capitis presents with round, scaly patches of alopecia with broken hairs. A kerion (boggy, purulent nodule) may form. It primarily affects children and is very contagious. Terbinafine is a CYP2D6 inhibitor with potential liver toxicity."
    difficulty: easy
    tags: [dermatology, tinea capitis, dermatophyte, terbinafine]
  - front: "A patient presents with intense nocturnal pruritus and linear burrows in the finger web spaces, axillae, and groin. What is the diagnosis and treatment?"
    back: "Scabies (Sarcoptes scabiei). Treatment: apply permethrin 5% cream from neck down to soles, leave on 8-14 hours, repeat in 7 days. Also treat family/close contacts, wash linens in hot water. Ivermectin is an alternative. Pruritus may persist 2-3 weeks after effective treatment due to prolonged hypersensitivity.\n\nScabies is transmitted primarily through prolonged skin-to-skin contact with 1-month incubation. The mite burrows into the stratum corneum. Post-treatment pruritus is common and can be managed with mid-potency TCS and antihistamines."
    difficulty: easy
    tags: [dermatology, scabies, parasitic infection, permethrin]
  - front: "What is the Hutchinson sign in herpes zoster, and what does it signify?"
    back: "Hutchinson's sign is herpes zoster (shingles) involving the tip of the nose, signifying ocular involvement via the nasociliary branch of the ophthalmic division (V1) of the trigeminal nerve. This requires urgent ophthalmologic evaluation.\n\nThe nasociliary branch supplies the nose tip and the eye. When zoster involves V1, corneal involvement (herpes zoster ophthalmicus) can lead to vision-threatening complications. Antiviral therapy must be initiated within 72 hours."
    difficulty: easy
    tags: [dermatology, herpes zoster, Hutchinson sign, ophthalmology]
  - front: "What are the stages of syphilis and their characteristic skin findings?"
    back: "Primary: single painless indurated chancre at inoculation site, heals in 4-6 weeks. Secondary (2-6 months later): maculopapular rash (non-pruritic, includes palms/soles), condylomata lata (genital wart-like papules), mucous patches. Tertiary (3-7 years later): gumma (granulomatous non-tender nodule).\n\nPrimary syphilis may have a negative VDRL; FTA-ABS is more sensitive early on. Dark field microscopy can detect spirochetes in chancre fluid. Treatment is penicillin G 2.4 million units IM -- single dose for primary/secondary, weekly for 3 weeks for tertiary."
    difficulty: medium
    tags: [dermatology, syphilis, STI, infectious disease]
  - front: "A 70-year-old man presents with a rough, gritty, erythematous papule with white scale on his sun-exposed forehead. What is the diagnosis, and what is the risk of malignant transformation?"
    back: "Actinic keratosis (solar keratosis). The risk of transformation to squamous cell carcinoma is <1 in 1000 per year, but higher if persistent or in immunosuppressed patients. Treatment options include cryotherapy, topical 5-fluorouracil, imiquimod, photodynamic therapy, or excision.\n\nActinic keratoses result from cumulative UVB damage to keratinocytes with UV-induced p53 gene mutations. They are easier to appreciate on palpation (gritty, sandpaper texture) than inspection. They are pre-malignant and should be treated to prevent SCC progression."
    difficulty: easy
    tags: [dermatology, actinic keratosis, pre-malignant, SCC, skin cancer]
  - front: "What is the most common malignancy in humans, and what is the most common subtype?"
    back: "Basal cell carcinoma (BCC) is the most common malignancy in humans, accounting for 75% of all malignant skin tumours in those over 40. The most common subtype is nodular BCC, presenting as a skin-coloured papule/nodule with a rolled, translucent ('pearly') telangiectatic border and depressed/ulcerated centre.\n\nBCC arises from malignant proliferation of basal keratinocytes, primarily due to UVB exposure with a 20-50 year latency. It is locally aggressive but rarely metastasizes. Mohs surgery offers the highest cure rate for facial lesions. 95% cure rate if treated when <2 cm."
    difficulty: easy
    tags: [dermatology, basal cell carcinoma, skin cancer, Mohs surgery]
  - front: "What are the ABCDE criteria for evaluating a suspicious pigmented lesion for melanoma?"
    back: "A = Asymmetry, B = Border irregularity, C = Colour variation (varied), D = Diameter (increasing or >6 mm), E = Evolution (change in colour, size, or shape). This has 92% sensitivity for melanoma.\n\nAbout 2/3 of melanomas arise de novo without a pre-existing nevus. The most common subtype is superficial spreading melanoma (60-70%). Most common site is back in males and calves in females. Breslow thickness is the most important prognostic factor."
    difficulty: easy
    tags: [dermatology, melanoma, ABCDE criteria, skin cancer screening]
  - front: "A patient has a melanoma with Breslow thickness of 2.5 mm. What is the approximate AJCC stage and 5-year survival?"
    back: "Breslow thickness 2.01-4.0 mm corresponds to Stage III (if node involvement) with approximately 45% 5-year survival, or Stage II (T3) with approximately 70% 5-year survival depending on ulceration and nodal status.\n\nBreslow thickness is the single most important prognostic factor for melanoma. Sentinel lymph node biopsy is offered for melanomas >=1 mm (or 0.8 mm with ulceration). Treatment options for advanced melanoma include anti-PD1 agents (nivolumab, pembrolizumab), anti-CTLA-4 (ipilimumab), and BRAF inhibitors for BRAF V600E mutations."
    difficulty: hard
    tags: [dermatology, melanoma, Breslow thickness, staging, prognosis]
  - front: "What is mycosis fungoides, and what is the more aggressive variant called?"
    back: "Mycosis fungoides is a cutaneous T-cell lymphoma (CTCL) characterized by scaling, erythematous patches/plaques/tumours on the trunk and buttocks, caused by clonal proliferation of skin-homing CD4 T-cells. Sezary syndrome is the aggressive widespread variant with erythroderma, lymphadenopathy, and circulating Sezary cells.\n\nMycosis fungoides typically affects patients >50 years (M:F = 2:1) and has excellent prognosis in early disease. Hypopigmented MF is the most common subtype in children with darker skin. Sezary syndrome has high mortality and requires systemic therapy including extracorporeal photopheresis."
    difficulty: medium
    tags: [dermatology, mycosis fungoides, Sezary syndrome, CTCL, lymphoma]
  - front: "A woman presents with recurrent painful inflammatory nodules with sinus tracts and scarring in the axillae and inguinal folds. What is the diagnosis?"
    back: "Hidradenitis suppurativa (HS). It is a chronic scarring inflammatory condition resulting from follicular occlusion in intertriginous zones rich in apocrine glands. Affects 1-4% of the population, F>M, onset in 2nd-3rd decade. Associated with smoking and obesity.\n\nHS is part of the follicular occlusion tetrad (with cicatricial alopecia, acne conglobata, and pilonidal disease). Treatment ranges from topical antibiotics for mild disease to biologics (adalimumab, infliximab) for refractory moderate-to-severe disease. Behavioral modifications include smoking cessation and weight management."
    difficulty: medium
    tags: [dermatology, hidradenitis suppurativa, follicular occlusion, biologics]
  - front: "What is the differential diagnosis for erythema nodosum, and what investigation should be ordered first?"
    back: "Causes include idiopathic (40%), drugs (sulfonamides, OCPs), infections (GAS, TB, histoplasmosis, Yersinia), inflammation (sarcoidosis, Crohn's > UC), and malignancy (leukemia, Hodgkin's). A chest X-ray should be ordered first to rule out sarcoidosis and chest infection.\n\nErythema nodosum is a panniculitis presenting as tender red nodules on the shins. It is most common in women aged 15-30 (F:M = 3:1). Lesions resolve spontaneously in 6 weeks. The mnemonic 'No DOSUMM' helps: No cause, Drugs, Other infections, Sarcoidosis, UC, Malignancy, Many infections."
    difficulty: medium
    tags: [dermatology, erythema nodosum, panniculitis, sarcoidosis, differential diagnosis]
  - front: "What skin findings are associated with dermatomyositis?"
    back: "Heliotrope rash (periorbital violaceous erythema with edema), Gottron's papules (violaceous flat-topped papules with atrophy over the knuckles/MCP/PIP joints), periungual erythema/telangiectasia, and calcinosis cutis. Dermatomyositis is associated with underlying malignancy (breast, lung, ovary).\n\nDermatomyositis is an inflammatory myopathy with characteristic cutaneous findings. It is important to screen for underlying malignancy, especially in adult-onset cases. The skin findings may precede or accompany proximal muscle weakness."
    difficulty: medium
    tags: [dermatology, rheumatology, dermatomyositis, paraneoplastic, Gottron papules]
  - front: "What is acanthosis nigricans, and what is its clinical significance?"
    back: "Acanthosis nigricans is thickened, velvety hyperpigmentation of flexural skin, most commonly perinuchal. It is a cutaneous marker of tissue insulin resistance, associated with diabetes mellitus, obesity, and other endocrine disorders. It can also be associated with malignancy (especially GI adenocarcinoma).\n\nThe insulin resistance drives epidermal hyperproliferation via IGF-1 receptor activation. When it appears suddenly in a non-obese patient, malignancy should be suspected (paraneoplastic acanthosis nigricans). Treatment targets the underlying cause."
    difficulty: easy
    tags: [dermatology, endocrinology, acanthosis nigricans, insulin resistance, paraneoplastic]
  - front: "What is the first-line treatment for hemangioma of infancy causing functional impairment?"
    back: "Topical timolol or systemic propranolol. Systemic corticosteroids, laser treatment, or surgery are alternatives.\n\nHemangiomas of infancy are benign vascular tumours that appear shortly after birth and regress spontaneously in ~50% by age 5. Treatment is reserved for the ~10% causing functional impairment such as visual compromise or airway obstruction."
    difficulty: easy
    tags: [dermatology, pediatrics, vascular tumours]
  - front: "What condition is associated with spider angiomas, and how do you confirm the diagnosis on physical exam?"
    back: "Spider angiomas are associated with hyperestrogenic states (liver disease, pregnancy, OCPs). Applying a paperclip tip to the centre blanches the lesion.\n\nSpider angiomas have a central arteriole with slender radiating branches. While they can be associated with liver disease or pregnancy, they are more often idiopathic. Blanching with central pressure confirms the diagnosis."
    difficulty: easy
    tags: [dermatology, gastroenterology, physical exam]
  - front: "A patient presents with localized lipid deposits manifesting as papules, plaques, or nodules in the skin. What investigation should be ordered?"
    back: "Fasting lipid panel (to assess for hyperlipidemia) and biopsy (shave, punch, or excisional).\n\nXanthomas can be associated with hyperlipidemia (macrophage uptake of oxidized LDL) or with monoclonal gammopathy/multiple myeloma. A fasting lipid panel is essential except for verruciform xanthomas, which are not associated with hyperlipidemia."
    difficulty: easy
    tags: [dermatology, dyslipidemia, xanthoma]
  - front: "What is the classification system for acne vulgaris severity, and what is the backbone of topical acne therapy?"
    back: "Type I: comedonal, sparse, no scarring. Type II: comedonal, papular, moderate. Type III: comedonal, papular, pustular with scarring. Type IV: nodulocystic, risk of severe scarring. Topical retinoids are the backbone of therapy.\n\nAll acne regimens should include a retinoid unless the patient cannot tolerate it. Benzoyl peroxide helps prevent Cutibacterium acnes resistance. The pathophysiology involves follicular hyperkeratinization, excess sebum production, and C. acnes colonization."
    difficulty: easy
    tags: [dermatology, acne]
  - front: "What are the absolute contraindications for isotretinoin, and what monitoring is required before starting treatment?"
    back: "Pregnancy is the absolute contraindication (teratogenic — requires 2 forms of contraception). Baseline monitoring includes lipid profile (risk of hypertriglyceridemia), LFTs, and β-hCG.\n\nIsotretinoin is associated with spontaneous abortion and major birth defects including facial dysmorphism and cognitive impairment. Most adverse effects are temporary. Patients may experience transient acne exacerbation before improvement."
    difficulty: medium
    tags: [dermatology, pharmacology, isotretinoin]
  - front: "How is rosacea differentiated from acne vulgaris?"
    back: "Rosacea lacks comedones, has a predilection for the central face, and presents with symptoms of flushing. It features dome-shaped inflammatory papules, pustules, non-transient erythema, and telangiectasia.\n\nRosacea affects ages 30-50, F>M, and is most prevalent in fair-skinned people. Exacerbating factors include heat, cold, wind, sun, stress, hot liquids, alcohol, and spices. Phyma (rhinophyma) can develop in longstanding cases."
    difficulty: easy
    tags: [dermatology, rosacea, differential diagnosis]
  - front: "What is the mechanism of contact dermatitis and how do irritant and allergic types differ?"
    back: "Irritant: toxic injury to skin via non-immune mechanism (erythema, dryness, burning). Allergic: Type IV delayed hypersensitivity reaction (erythema with papulovesicular eruption, pruritus). Irritant is more common; allergic persists indefinitely once sensitized.\n\nHands are the most common site for irritant contact dermatitis. Patch testing is used to identify specific allergens in allergic contact dermatitis. Common allergens include nickel, fragrance, and tattoo dyes."
    difficulty: easy
    tags: [dermatology, contact dermatitis, immunology]
  - front: "What is the pathophysiology of atopic dermatitis and what genetic mutation is associated?"
    back: "T-cell driven inflammatory process with epidermal barrier dysfunction. Associated with filaggrin gene (FLG) mutation causing impaired skin barrier function and prolonged dryness.\n\nAtopic dermatitis affects 10-20% of children under 5 in developed countries and is associated with personal/family history of atopy (asthma, allergic rhinitis). Distribution varies by age: face/extensors in infants, flexural in children, and hands/face in adults."
    difficulty: medium
    tags: [dermatology, atopic dermatitis, genetics]
  - front: "What are the advantages of topical calcineurin inhibitors (tacrolimus, pimecrolimus) over topical corticosteroids in atopic dermatitis?"
    back: "No skin atrophy; safe for sensitive areas such as the face and neck. Can be used as steroid-sparing agents for long-term use.\n\nTacrolimus ointment (0.03% and 0.1%) and pimecrolimus cream (1%) can be used for acute treatment and long-term maintenance. The main side effect is burning sensation, which decreases with continued use. Health Canada recently removed prior black box warnings."
    difficulty: easy
    tags: [dermatology, pharmacology, atopic dermatitis]
  - front: "What is the most important therapy for stasis dermatitis, and what is the classic location?"
    back: "Compression stockings (if no peripheral arterial disease). Classic location is the medial ankle with erythematous, scaly, pruritic plaques on lower legs.\n\nStasis dermatitis results from chronic venous insufficiency leading to venous stasis and surrounding soft tissue inflammation. Late stages show brown hemosiderin deposition, woody fibrosis, and lipodermatosclerosis. Ulceration commonly occurs at the medial malleolus."
    difficulty: easy
    tags: [dermatology, stasis dermatitis, venous insufficiency]
  - front: "What are the '6 Ps' of lichen planus?"
    back: "Purple, Pruritic, Polygonal, Planar (flat-topped), Peripheral (wrists), Papules.\n\nLichen planus is an immune-mediated condition affecting 1% of the population, ages 30-60, F>M. Wickham's striae (lacy white reticular network on oral mucosa) is pathognomonic. It exhibits the Koebner phenomenon and is rarely associated with hepatitis C."
    difficulty: easy
    tags: [dermatology, lichen planus]
  - front: "A patient presents with oval plaques following skin tension lines in a 'Christmas tree' pattern on the back, preceded by a 'herald patch.' What is the diagnosis and management?"
    back: "Pityriasis rosea. No treatment required — clears spontaneously in 6-12 weeks. TCS if pruritic.\n\nPityriasis rosea is an acute, self-limiting eruption suspected to be caused by HHV-7 or HHV-6 reactivation. The herald patch precedes other lesions by 1-2 weeks. Lesions are red or flesh-coloured oval plaques with central scale."
    difficulty: easy
    tags: [dermatology, pityriasis rosea]
  - front: "What is the Auspitz sign and what condition is it associated with?"
    back: "Pinpoint bleeding observed when scale is removed from a psoriatic plaque. It is associated with plaque psoriasis.\n\nPlaque psoriasis is characterized by well-circumscribed erythematous papules/plaques with silvery-white scales on extensor surfaces, scalp, trunk, and nails. The shortened keratinocyte cell cycle correlates with Th1- and Th17-mediated inflammatory response."
    difficulty: easy
    tags: [dermatology, psoriasis, physical exam]
  - front: "What percentage of psoriasis patients develop psoriatic arthritis, and what features increase risk?"
    back: "20-30% of patients with psoriasis develop psoriatic arthritis. Nail or scalp involvement increases risk.\n\nPsoriatic arthritis is a seronegative spondyloarthropathy. Psoriasis has polygenic inheritance with 8% risk if one parent is affected and 41% if both parents are affected. Risk factors include smoking, obesity, alcohol, drugs, infections, and physical trauma."
    difficulty: easy
    tags: [dermatology, rheumatology, psoriatic arthritis]
  - front: "Differentiate bullous pemphigoid from pemphigus vulgaris by lesion type, depth, and antibody target."
    back: "Bullous pemphigoid: tense subepidermal bullae, IgG against BP180/BP230 (hemidesmosomes), age 60-80. Pemphigus vulgaris: flaccid intraepidermal bullae, IgG against desmoglein-1 and -3, age 15-50. Mnemonic: 'PemphigoiD = Deeper; Vulgaris = superficial flaccid.'\n\nBullous pemphigoid heals without scarring and is rarely fatal. Pemphigus vulgaris may be fatal without immunosuppressive treatment. Nikolsky's sign (epidermal detachment with shear stress) is positive in pemphigus vulgaris."
    difficulty: medium
    tags: [dermatology, autoimmune, bullous diseases]
  - front: "What is the BSA classification for SJS vs SJS/TEN overlap vs TEN?"
    back: "SJS: <10% BSA epidermal detachment. SJS/TEN overlap: 10-30%. TEN: >30%. SJS mortality is ~5%; TEN mortality is ~30%.\n\nCommon causative agents include allopurinol, anti-epileptics, sulfonamides, NSAIDs, and cephalosporins. HLA-B1502 (East Asians, carbamazepine) and HLA-B5801 (allopurinol) are risk factors. Management includes drug discontinuation, ICU/burn unit care, and IVIg or cyclosporine."
    difficulty: medium
    tags: [dermatology, drug reactions, SJS, TEN]
  - front: "What are the SCORTEN criteria used for in TEN, and what scores predict mortality?"
    back: "SCORTEN predicts TEN mortality. One point each for: age ≥40, malignancy, initial BSA detached ≥10%, tachycardia ≥120, serum urea >10, glucose >14, bicarbonate <20. Score 0-1: 94% survival; 2: 87%; 3: 53%; 4: 25%; ≥5: 17%.\n\nSCORTEN is calculated at admission and determines appropriate clinical setting. Higher scores indicate need for ICU/burn unit care. Treatment includes IV fluids, electrolyte replacement, wound care, and potentially IVIg, cyclosporine, or corticosteroids."
    difficulty: hard
    tags: [dermatology, TEN, prognostic scoring]
  - front: "What autoimmune diseases should be screened for in a patient with vitiligo?"
    back: "Thyroid disease, pernicious anemia, Addison's disease, and type 1 diabetes mellitus.\n\nVitiligo is an acquired autoimmune destruction of melanocytes with 1% incidence. It presents with sharply demarcated white patches on extensor surfaces and periorificial areas. Wood's lamp illuminates amelanotic patches. Treatment includes topical calcineurin inhibitors, TCS, and phototherapy."
    difficulty: easy
    tags: [dermatology, vitiligo, autoimmune]
  - front: "What is the first-line oral antifungal for tinea capitis and why are oral agents required?"
    back: "Terbinafine (Lamisil) for 4 weeks. Oral agents are required because topical agents cannot penetrate the hair root where the dermatophyte resides.\n\nTinea capitis presents with round, scaly patches of alopecia with broken hairs on the scalp. Kerion formation (boggy, purulent, inflamed nodule) can occur. Adjunctive antifungal shampoos (selenium sulfide, ketoconazole) may prevent spread."
    difficulty: easy
    tags: [dermatology, dermatophytosis, tinea capitis]
  - front: "What is the treatment for scabies and how long may pruritus persist after treatment?"
    back: "Permethrin 5% cream from neck down, left on 8-14 hours, repeated in 7 days. Also treat family/close contacts. Pruritus may persist 2-3 weeks after effective treatment due to prolonged hypersensitivity.\n\nScabies is caused by Sarcoptes scabiei mite, transmitted via prolonged skin-skin contact. It presents with superficial burrows, intense nocturnal pruritus, and inflammatory papules in web spaces, axillae, and groin. The head/neck is spared except in infants."
    difficulty: easy
    tags: [dermatology, parasitology, scabies]
  - front: "What are the stages of syphilis and their key features?"
    back: "Primary: painless chancre at inoculation site (3 weeks post-exposure), heals in 4-6 weeks. Secondary: 2-6 months later — maculopapular rash, condylomata lata, mucous patches, systemic symptoms. Tertiary: 3+ years — gummas, cardiovascular and neurosyphilis.\n\nPrimary syphilis is treated with penicillin G 2.4 million units IM single dose. VDRL is negative in primary, positive in secondary. FTA-ABS has greater sensitivity for early disease. Dark field examination can detect spirochetes in chancre fluid."
    difficulty: medium
    tags: [dermatology, infectious disease, syphilis, STI]
  - front: "What is the ABCDE mnemonic for melanoma and what are the clinical subtypes from most to least common?"
    back: "A=Asymmetry, B=Border irregular, C=Colour varied, D=Diameter >6mm, E=Evolution. Subtypes: superficial spreading (60-70%), nodular (15-30%), lentigo maligna (5-15%), acral lentiginous (5-10%).\n\nAbout 2/3 of melanomas arise de novo. Nodular melanoma is rapidly fatal with primarily vertical growth. Acral lentiginous is the most common subtype in patients with Type 6 skin. Breslow depth determines excision margins and staging."
    difficulty: medium
    tags: [dermatology, oncology, melanoma]
  - front: "What is the most common malignancy in humans, and what is the typical cure rate when treated early?"
    back: "Basal cell carcinoma (BCC). 95% cure rate if the lesion is <2cm or treated early.\n\nBCC is a malignant proliferation of basal keratinocytes with primarily tangential growth and rare metastasis. >80% occur on sun-exposed sites due to UVB exposure. Subtypes include nodular (most common), pigmented, superficial, and morpheaform."
    difficulty: easy
    tags: [dermatology, oncology, basal cell carcinoma]
  - front: "What is the most common cutaneous malignancy in immunocompromised patients such as organ transplant recipients?"
    back: "Squamous cell carcinoma (SCC), with increased mortality compared to immunocompetent patients.\n\nSCC is a malignant neoplasm of keratinocytes with primarily vertical growth. Rate of metastasis from primary SCC is 2-5%. Higher risk factors for metastasis include diameter >2cm, depth >2mm, recurrence, and immunosuppression."
    difficulty: easy
    tags: [dermatology, oncology, SCC, transplant medicine]
  - front: "What is hidradenitis suppurativa (HS) and what is the follicular occlusion tetrad?"
    back: "HS is a chronic scarring inflammatory condition of intertriginous areas due to follicular occlusion. The follicular occlusion tetrad includes: HS, cicatricial alopecia, acne conglobata, and pilonidal disease.\n\nHS affects 1-4% of the population, F>M, onset between puberty and age 40. Axillae are the most common site. It is associated with smoking and excess weight. Moderate-to-severe disease may require biologic therapy such as adalimumab."
    difficulty: medium
    tags: [dermatology, hidradenitis suppurativa]
  - front: "What are the dermatologic manifestations of dermatomyositis?"
    back: "Heliotrope rash (periorbital violaceous erythema with edema), Gottron's papules (violaceous flat-topped papules over knuckles with atrophy), periungual erythema, telangiectasia, calcinosis cutis.\n\nDermatomyositis is an autoimmune condition that can be a paraneoplastic syndrome associated with breast, lung, or ovarian cancer. The heliotrope rash and Gottron's papules are pathognomonic. Skin manifestations are part of the systemic disease involving proximal muscle weakness."
    difficulty: medium
    tags: [dermatology, rheumatology, dermatomyositis, paraneoplastic]
  - front: "What skin finding is a cutaneous marker of insulin resistance?"
    back: "Acanthosis nigricans — thickened, velvety, hyperpigmented skin most commonly in the peri-nuchal (posterior neck) area and flexural regions.\n\nAcanthosis nigricans is associated with diabetes mellitus, obesity, other endocrine disorders, and malignancy. It can also be seen in polycystic ovary syndrome. When associated with malignancy, it may appear more extensive and involve unusual locations."
    difficulty: easy
    tags: [dermatology, endocrinology, acanthosis nigricans, insulin resistance]
  - front: "What is the erythema nodosum DDx mnemonic (NOSUMM)?"
    back: "No cause identified (40% idiopathic), OCPs/pregnancy, Sarcoidosis, Ulcerative colitis/Crohn's, Malignancy (leukemia, Hodgkin's), Many infections (GAS, TB, histoplasmosis, Yersinia).\n\nErythema nodosum presents as round, red, tender, poorly demarcated nodules on the extensor lower legs (shins). It is an acute/chronic inflammation of subcutaneous fat (panniculitis). Affects ages 15-30, F:M 3:1. Resolves spontaneously in 6 weeks."
    difficulty: easy
    tags: [dermatology, erythema nodosum, differential diagnosis]
