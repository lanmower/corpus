# Resp Pna (Respirology) - generated from srs-mccqe1
cards:
  - front: "What are clinical indications for Succinylcholine?"
    back: "Rapid sequence induction for intubation, especially with increased aspiration risk (full stomach, hiatus hernia, obesity, pregnancy)\n\nSCh's rapid onset and brief duration make it the preferred agent when quick intubation conditions are needed."
    difficulty: easy
    tags: [anesthesia, succinylcholine, indications, RSI, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "Why do pregnant patients desaturate more rapidly during apnea?"
    back: "Decreased FRC (functional residual capacity) combined with increased O₂ consumption causes faster oxygen depletion\n\nThe reduced oxygen reservoir and increased metabolic demands of pregnancy make preoxygenation especially critical."
    difficulty: medium
    tags: [respiratory physiology, pregnancy, anesthesia, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What happens to the risk of assisted delivery when epidural analgesia technique has improved (post-2005 studies)?"
    back: "The increased risk of assisted vaginal delivery becomes non-significant (RR 1.19, 95% CI 0.97-1.46)\n\nThis suggests modern epidural techniques (lower concentrations, PCEA) may reduce the risk of instrumental delivery."
    difficulty: hard
    tags: [epidural, assisted delivery, obstetric outcomes, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What are the most common infectious causes of pericarditis?"
    back: "Viral (most common): Coxsackie virus A and B, echovirus, Parvovirus B19, EBV, HIV; Bacterial: S. pneumoniae, S. aureus, B. burgdorferi, M. tuberculosis\n\nWhile idiopathic (presumed viral) accounts for the majority of cases, identifying specific etiology is not required in all patients, especially in low TB prevalence regions."
    difficulty: easy
    tags: [cardiology, pericarditis, infectious disease, viral, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What happens to the dose-response curve with irreversible competitive antagonism?"
    back: "Irreversible competitive antagonists form a covalent bond with the receptor and cannot be displaced. At high enough antagonism concentrations, no amount of agonist can elicit a response, producing a non-parallel rightward shift with loss of maximal effect.\n\nUnlike reversible competitive antagonists, the effects of irreversible antagonists cannot be overcome simply by increasing agonist concentration, as the receptor itself is functionally removed from the available pool."
    difficulty: hard
    tags: [pharmacodynamics, irreversible-antagonism, competitive-antagonism, dose-response, receptor-theory, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What are the mechanisms by which skin regenerative abilities decline with age?"
    back: "Loss of self-renewing capacities, altered proliferative activity, and functional decline of both epidermal and dermal cells\n\nThese age-related changes affect both keratinocytes and fibroblasts, leading to diminished skin repair and maintenance capabilities."
    difficulty: easy
    tags: [dermatology, skin-aging, geriatrics, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are the three main age-related changes in skin regenerative capacity?"
    back: "Loss of self-renewing capacities, altered proliferative activity, and functional decline of skin cells\n\nBoth keratinocytes and fibroblasts undergo these changes with aging, leading to thinner, less resilient skin."
    difficulty: easy
    tags: [dermatology, skin aging, geriatrics, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Lipomas are composed of what cell type enclosed in what structure?"
    back: "Adipocytes (fat cells) enclosed in a fibrous capsule\n\nLipomas are benign tumors of mature adipocytes that develop within a fibrous tissue capsule, making them soft, mobile, and non-tender."
    difficulty: easy
    tags: [dermatology, lipoma, adipose-tissue, benign-tumors, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What happens to the dose-response curve with increasing concentrations of reversible competitive antagonist?"
    back: "Parallel rightward shift of the curve; the maximum effect remains unchanged but higher agonist concentrations are required\n\nThis is the classic signature of competitive reversible antagonism - the agonist can overcome the block with sufficient concentration."
    difficulty: medium
    tags: [pharmacodynamics, competitive-antagonism, dose-response, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What happens to the dose-response curve with non-competitive antagonist?"
    back: "Decreased maximum effect (Emax reduced); curve shifts downward rather than rightward\n\nNon-competitive antagonists cannot be overcome by increasing agonist concentration because they bind to a different (allosteric) site."
    difficulty: medium
    tags: [pharmacodynamics, non-competitive-antagonism, dose-response, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What happens to skin regenerative abilities with aging?"
    back: "Loss of self-renewing capacities, altered proliferative activity, and functional decline in skin cells\n\nBoth keratinocytes and fibroblasts undergo age-related changes including loss of proliferative abilities and decreased hyaluronic acid in the dermis."
    difficulty: easy
    tags: [dermatology, skin-aging, geriatrics, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the typical age of onset and clinical course of cherry angioma (Campbell de Morgan spot)?"
    back: ">30 years old. Lesions do not fade, are bright red to deep maroon, dome-shaped papules (1-5mm) on the trunk. Lesions bleed infrequently.\n\nCherry angiomas are benign vascular neoplasms that appear in adulthood and persist indefinitely without treatment."
    difficulty: easy
    tags: [dermatology, vascular tumors, cherry angioma, benign neoplasm, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the pathophysiology of lipoma formation?"
    back: "Adipocytes enclosed in a fibrous capsule, representing a benign proliferation of fat cells.\n\nLipomas are the most common soft tissue tumors, composed of mature adipocytes within a fibrous tissue capsule."
    difficulty: easy
    tags: [dermatology, soft tissue tumors, lipoma, benign neoplasm, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the clinical presentation and management of pyogenic granuloma?"
    back: "Bright red, dome-shaped, friable nodule that grows rapidly over weeks to months. Sites: fingers, lips, mouth, trunk. Management: surgical excision with histology.\n\nPyogenic granulomas are rapidly developing capillary hemangiomas that may persist indefinitely if untreated. DDx includes glomus tumor, nodular melanoma, SCC, and nodular BCC."
    difficulty: easy
    tags: [dermatology, vascular_tumors, surgery, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the age-related changes in skin that result from decline in regenerative abilities?"
    back: "Loss of self-renewing capacities, altered proliferative activity, and functional decline of skin cells\n\nBoth keratinocytes and fibroblasts lose their regenerative capacity with aging, leading to cumulative skin damage and impaired healing."
    difficulty: easy
    tags: [dermatology, skin aging, geriatric dermatology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are the annular, reticular, targetoid, and satellite patterns of skin lesion distribution?"
    back: "Annular: ring-shaped; Reticular: net-like/lacy; Targetoid: target or iris-like; Satellite: small lesions surrounding a larger one\n\nThese distribution patterns are diagnostically important and help differentiate conditions like tinea corporis (annular), livedo reticularis (reticular), erythema multiforme (targetoid), and candidiasis (satellite)."
    difficulty: easy
    tags: [dermatology, lesion distribution, clinical patterns, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What risk factors predict development of psoriatic arthritis in psoriasis patients?"
    back: "20-30% of psoriasis patients develop psoriatic arthritis. Nail involvement and scalp involvement increase risk. See Rheumatology chapter for full details.\n\nNail findings (pitting, onycholysis) reflect psoriatic involvement of the nail matrix and bed, which shares embryologic origin with entheses."
    difficulty: easy
    tags: [dermatology, psoriasis, rheumatology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the three types of lice, and what areas do they affect?"
    back: "Phthirus pubis (pubic lice), Pediculus humanus capitis (scalp lice), Pediculus humanus humanus (body lice)\n\nEach species of louse has adapted to colonize specific body regions based on hair type and feeding patterns, though there can be overlap."
    difficulty: easy
    tags: [lice, pediculosis, etiology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What three types of lice affect humans and what areas do they infest?"
    back: "Phthirus pubis (pubic lice), Pediculus humanus capitis (scalp lice), and Pediculus humanus humanus (body lice) - each infests its respective body region and attaches to hair.\n\nEach louse species is adapted to specific body sites with appropriate hair density and temperature. Body lice differ by living in clothing seams rather than directly on skin."
    difficulty: easy
    tags: [lice, pediculosis, etiology, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the most common triggers for erythema multiforme?"
    back: "Herpes simplex virus (HSV) infection and Mycoplasma pneumoniae infection are the most common triggers.\n\nHSV-associated EM is most common; the rash typically appears 1-2 weeks after HSV recurrence. Mycoplasma-associated EM is more common in children and young adults."
    difficulty: easy
    tags: [erythema-multiforme, etiology, triggers, infectious-disease, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the clinical features of scalp lice (pediculosis capitis)?"
    back: "Nits (louse eggs) attached to hairs, red excoriated scalp, secondary bacterial infection, and regional lymphadenopathy.\n\nScalp lice are common in school-aged children. Secondary bacterial infection from scratching is a frequent complication."
    difficulty: easy
    tags: [lice, pediculosis capitis, scalp, clinical features, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "Why must itraconazole capsules be taken with food?"
    back: "To ensure adequate absorption (fatty meals enhance bioavailability)\n\nItraconazole capsules require gastric acid and fatty food for optimal absorption. The capsules must be swallowed whole and taken with food."
    difficulty: easy
    tags: [dermatology, itraconazole, antifungal, onychomycosis, absorption, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the itraconazole (Sporanox®) dosing regimen for onychomycosis of toenails?"
    back: "200mg PO BID for 1 week per month (pulse therapy), repeated for 3 months; give capsules with food; swallow whole; contraindicated in CHF\n\nItraconazole is an azole antifungal with excellent nail penetration. Pulse therapy achieves high drug levels in nail tissue with reduced total drug exposure."
    difficulty: medium
    tags: [itraconazole, onychomycosis, antifungal, dosing, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the three types of lice (pediculosis) and their etiologies?"
    back: "Phthirus pubis (pubic), Pediculus humanus capitis (scalp), Pediculus humanus humanus (body)\n\nEach type attaches to specific body hair and feeds on the nearby body site."
    difficulty: easy
    tags: [lice, pediculosis, dermatology, parasitic infection, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the treatment for suspected scaphoid fracture with negative X-ray?"
    back: "Thumb spica splint, repeat X-ray in 1 week + CT scan/bone scan\n\nScaphoid fractures may not be visible initially; immobilization prevents AVN."
    difficulty: medium
    tags: [scaphoid fracture, wrist, AVN, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the risk of not immobilizing a scaphoid fracture?"
    back: "Avascular necrosis (AVN) of the scaphoid\n\nThe scaphoid has retrograde blood supply making it vulnerable to AVN."
    difficulty: medium
    tags: [scaphoid fracture, AVN, complications, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "How long is a scaphoid fracture typically immobilized?"
    back: "6-8 weeks with thumb spica splint\n\nRepeat X-ray at 2 weeks to assess healing."
    difficulty: easy
    tags: [scaphoid fracture, treatment, immobilization, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of anterior shoulder dislocation?"
    back: "Reduce with traction or scapular manipulation techniques, immobilize in internal rotation, repeat X-ray, outpatient orthopedics follow-up. Look for fracture with forceful injury.\n\nAxillary and musculocutaneous nerves are at risk. Lateral view shows humeral head anterior to glenoid. Reduction should be attempted promptly with appropriate sedation."
    difficulty: easy
    tags: [shoulder-dislocation, upper-extremity, reduction, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "When is fasciotomy indicated for compartment syndrome?"
    back: "When intracompartmental pressure exceeds capillary perfusion pressure, leading to muscle/nerve necrosis. Remove constrictive casts/dressings first, then emergent fasciotomy if needed.\n\nDo not wait for all 6 Ps to appear - they indicate advanced disease. Capillary perfusion pressure is ~30 mmHg vs radial pulse of 120/80."
    difficulty: medium
    tags: [compartment-syndrome, fasciotomy, emergency, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "Which carpal bones are in the proximal row vs distal row?"
    back: "Proximal: scaphoid, lunate, triquetrum, pisiform. Distal: trapezium, trapezoid, capitate, hamate\n\nKnowledge of carpal bone anatomy is essential for interpreting wrist injuries and radiographic findings."
    difficulty: easy
    tags: [carpal-bones, anatomy, wrist, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the common signs and symptoms of seizures?"
    back: "Preceding aura, rapid onset, brief duration, alterations in consciousness, tonic-clonic movements, postictal period. Signs include tongue biting (high specificity), loss of bladder/bowel control, emesis, and aspiration\n\nTongue biting has high specificity for generalized tonic-clonic seizures"
    difficulty: easy
    tags: [Emergency Medicine, Seizures, Clinical Presentation, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the management of scaphoid fracture with negative initial x-ray?"
    back: "Thumb spica splint, repeat x-ray in 1 week + CT/bone scan\n\nClinical suspicion warrants immobilization even with negative initial imaging."
    difficulty: medium
    tags: [Emergency Medicine, Orthopedics, Wrist, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the treatment duration for a confirmed scaphoid fracture?"
    back: "Thumb spica splint for 6-8 weeks, repeat x-ray in 2 weeks\n\nProlonged immobilization is required due to poor blood supply risk."
    difficulty: easy
    tags: [Emergency Medicine, Orthopedics, Wrist, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the major complication of scaphoid fracture if not immobilized?"
    back: "Avascular necrosis (AVN) of scaphoid\n\nThe scaphoid has a retrograde blood supply making it prone to AVN."
    difficulty: medium
    tags: [Emergency Medicine, Orthopedics, Wrist, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of a suspected scaphoid fracture with negative initial X-ray?"
    back: "Thumb spica splint, repeat X-ray in 1 week + CT scan/bone scan\n\nScaphoid fractures may not be visible initially; immobilization and follow-up imaging are required."
    difficulty: medium
    tags: [emergency-medicine, orthopedics, scaphoid-fracture, wrist, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of a confirmed scaphoid fracture?"
    back: "Thumb spica splint for 6-8 weeks, repeat X-ray in 2 weeks\n\nProlonged immobilization is needed due to risk of avascular necrosis."
    difficulty: medium
    tags: [emergency-medicine, orthopedics, scaphoid-fracture, wrist, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "Name the 8 carpal bones from radial to ulnar (proximal row)"
    back: "Scaphoid, Lunate, Triquetrum, Pisiform\n\nThese are the four carpal bones in the proximal row."
    difficulty: easy
    tags: [emergency-medicine, orthopedics, anatomy, carpal-bones, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "Name the 4 carpal bones in the distal row from radial to ulnar"
    back: "Trapezium, Trapezoid, Capitate, Hamate\n\nThese are the four carpal bones in the distal row."
    difficulty: easy
    tags: [emergency-medicine, orthopedics, anatomy, carpal-bones, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the high-specificity clinical signs of a seizure?"
    back: "Tongue biting (high specificity), loss of bladder/bowel control, emesis, and aspiration\n\nThese signs help differentiate seizures from other causes of transient loss of consciousness like syncope."
    difficulty: easy
    tags: [Emergency Medicine, Seizures, Clinical Presentation, Diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the key historical features and physical exam findings that suggest a seizure rather than syncope?"
    back: "Preceding aura, rapid onset, brief duration, alterations in consciousness, tonic-clonic movements, postictal period, tongue biting (high specificity), loss of bladder/bowel control, emesis, aspiration\n\nTongue biting has high specificity for seizures. The postictal period is characteristic of seizure activity."
    difficulty: medium
    tags: [Emergency Medicine, Seizures, Clinical Assessment, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the capillary perfusion pressure in mmHg?"
    back: "30 mmHg\n\nThis is critical because compartment syndrome develops when intracompartmental pressure exceeds capillary perfusion pressure, leading to muscle/nerve necrosis."
    difficulty: medium
    tags: [orthopedics, compartment-syndrome, physiology, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "List the 8 carpal bones in order from radial to ulnar (proximal and distal rows)"
    back: "Proximal row: Scaphoid, Lunate, Triquetrum, Pisiform | Distal row: Trapezium, Trapezoid, Capitate, Hamate\n\nKnowledge of carpal bone anatomy is essential for interpreting wrist radiographs and localizing injuries."
    difficulty: easy
    tags: [orthopedics, wrist, anatomy, carpal-bones, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "In compartment syndrome, why is presence of any of the 6 Ps concerning?"
    back: "Because radial pulse pressure (120/80 mmHg) far exceeds capillary perfusion pressure (30 mmHg); seeing any of the 6 Ps indicates advanced compartment syndrome\n\nThis means significant ischemia has already occurred by the time these signs appear, necessitating urgent intervention."
    difficulty: hard
    tags: [orthopedics, compartment-syndrome, physiology, emergency-medicine, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "How long is thumb spica splint worn for scaphoid fracture?"
    back: "6-8 weeks, with repeat X-ray at 2 weeks\n\nExtended immobilization is required due to scaphoid's poor blood supply and risk of nonunion."
    difficulty: medium
    tags: [orthopedics, scaphoid, fracture, treatment, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What imaging is indicated for hypothermia?"
    back: "Chest X-ray to assess for aspiration pneumonia and pulmonary edema\n\nPulmonary complications are common in hypothermia"
    difficulty: easy
    tags: [hypothermia, diagnosis, imaging, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are common signs observed during a seizure?"
    back: "Tongue biting (high specificity), loss of bladder/bowel control, emesis, and aspiration\n\nThese clinical features help differentiate seizures from other transient loss of consciousness events like syncope."
    difficulty: easy
    tags: [Neurology, Seizures, Clinical Presentation, Physical Exam, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What imaging is recommended for hypothermia patients?"
    back: "CXR (aspiration pneumonia and pulmonary edema are common complications)\n\nMonitoring for pulmonary complications is essential in hypothermic patients."
    difficulty: easy
    tags: [hypothermia, diagnostics, imaging, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What happens when a statin dose is doubled?"
    back: "Approximately only 6% additional LDL-lowering efficacy (rule of 6)\n\nThis explains why adding a second agent (e.g., ezetimibe or PCSK9 inhibitor) is more effective than doubling statin dose."
    difficulty: easy
    tags: [statin, dosing, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What happens when statin dose is doubled?"
    back: "Approximately 6% additional LDL-lowering efficacy\n\nThis demonstrates the diminishing returns of statin dose titration. Adding second-line agents is more effective than doubling statin dose."
    difficulty: easy
    tags: [statin, dosing, LDL, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What happens to BUN and Cr in DKA?"
    back: "Both increased due to dehydration\n\nPre-renal azotemia develops from osmotic diuresis and dehydration, causing elevated BUN and creatinine."
    difficulty: easy
    tags: [endocrinology, DKA, renal, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What happens to LDL-lowering efficacy when a statin dose is doubled?"
    back: "Approximately 6% additional LDL reduction\n\nThis demonstrates the diminishing returns of statin dose escalation, explaining why combination therapy is often preferred."
    difficulty: medium
    tags: [treatment, statins, dosing, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What happens to 85% of secreted T4 in the periphery?"
    back: "It is converted to T3 or reverse T3 by deiodinase enzymes\n\nPeripheral conversion allows regulation of active hormone levels. Reverse T3 is metabolically inactive and is produced in times of stress to decrease metabolic activity."
    difficulty: medium
    tags: [thyroid, T4, deiodinase, metabolism, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "In HHS, what happens to serum osmolality and mental status?"
    back: "Serum osmolality becomes severely elevated (>320 mOsm/kg) leading to mental obtundation and coma\n\nExtreme hyperosmolality in HHS causes water shift from neurons to ECF, resulting in altered mental status ranging from lethargy to coma."
    difficulty: medium
    tags: [endocrinology, diabetes, HHS, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What happens to insulin secretagogues when bolus insulin is added?"
    back: "They are typically stopped\n\nInsulin secretagogues (e.g., glyburide) are usually discontinued when prandial/bolus insulin is added to avoid hypoglycemia."
    difficulty: easy
    tags: [endocrinology, diabetes, insulin, medications, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What happens to the T3/T4 ratio in iodine deficiency?"
    back: "Increased ratio of T3 to T4\n\nIn iodine deficiency, the thyroid preferentially synthesizes T3 (which has higher potency) to maintain hormonal activity with limited substrate."
    difficulty: medium
    tags: [thyroid, iodine, T3, T4, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What happens to reverse T3 levels in stress?"
    back: "Reverse T3 increases to decrease metabolic activity during stress\n\nIn times of illness or stress, the body converts more T4 to reverse T3 (which is metabolically inactive) rather than active T3, reducing overall metabolic rate."
    difficulty: medium
    tags: [thyroid, reverse T3, stress, endocrinology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What happens to T3/T4 ratio in iodine deficiency?"
    back: "Increased ratio of T3 to T4"
    difficulty: medium
    tags: [iodine deficiency, T3, T4, adaptation, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What happens to lymphocyte counts with glucocorticoid excess?"
    back: "Glucocorticoids cause lymphopenia (decreased lymphocytes) while stimulating leukocytosis (increased white blood cells)\n\nThis immunosuppression effect is exploited therapeutically but also increases infection risk."
    difficulty: medium
    tags: [glucocorticoids, immune system, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "Which of the following is NOT a recommended test for colorectal cancer screening: FIT, colonoscopy, CT colonography, or capsule colonoscopy?"
    back: "All except FIT are not recommended (colonoscopy, CT colonography, and capsule colonoscopy)\n\nFIT (fecal immunochemical test) is recommended; colonoscopy, CT colonography, capsule colonoscopy, double contrast barium enema, and metabolomic/DNA tests are not recommended."
    difficulty: easy
    tags: [colorectal cancer, screening, guidelines, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the mnemonics for symptoms of major depressive disorder (M-SIGECAPS)?"
    back: "M-Depressed Mood, S-Increased/decreased Sleep, I-Decreased Interest, G-Increased/decreased Appetite, E-Psychomotor agitation/retardation, C-Concentration loss, A-Feelings of guilt/worthlessness, P-Psychomotor retardation, S-Suicidal ideation\n\nM-SIGECAPS is a useful mnemonic to remember the 9 diagnostic criteria for major depressive disorder from DSM-5."
    difficulty: easy
    tags: [psychiatry, depression, diagnosis, mnemonic, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What does the mnemonic M-SIGECAPS stand for?"
    back: "M: Depressed Mood, S: Sleep (increased/decreased), I: Interest (decreased), G: Guilt, E: Energy (loss), C: Concentration (impaired), A: Appetite (increased/decreased), P: Psychomotor agitation/retardation, S: Suicidal ideation\n\nM-SIGECAPS is the diagnostic criteria for major depressive disorder in DSM-5."
    difficulty: easy
    tags: [psychiatry, depression, diagnosis, mnemonic, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What does the mnemonic M-SIGECAPS stand for in depression diagnosis?"
    back: "M: Depressed Mood, S: Sleep disturbance, I: Interest loss, G: Guilt, E: Energy loss, C: Concentration problems, A: Appetite changes, P: Psychomotor changes, S: Suicidal ideation\n\nM-SIGECAPS is the diagnostic criteria for major depressive disorder, requiring at least 5 symptoms present for 2+ weeks."
    difficulty: medium
    tags: [depression, diagnosis, psychiatry, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
