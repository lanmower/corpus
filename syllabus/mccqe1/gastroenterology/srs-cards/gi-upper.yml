  - front: "What is dysphagia?"
    back: "Difficulty swallowing\n\nDysphagia refers to difficulty initiating swallowing (oropharyngeal) or moving food down the esophagus (esophageal)."
    difficulty: easy
    tags: [dysphagia, definition, symptoms, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
