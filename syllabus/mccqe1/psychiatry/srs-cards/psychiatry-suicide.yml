# Psychiatry Suicide (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What are the key components of a safety plan for a patient with suicidal ideation?"
    back: "A safety plan should include: (1) agreement not to harm themselves, (2) avoid alcohol, drugs, and triggering situations, (3) follow-up at a designated time, (4) contact a healthcare worker, crisis line, or go to the ED if unsafe or if suicidal feelings return/intensify.\n\nSafety planning is a cornerstone of suicide risk management in Canadian practice. It is a collaborative, structured intervention that identifies warning signs, coping strategies, social supports, and professional resources. The goal is to create a personalized action plan the patient agrees to follow when suicidal urges escalate."
    difficulty: easy
    tags: [psychiatry, suicide, safety planning, crisis intervention]
  - front: "What is the recommended management approach for a suicidal patient with alcohol or substance use disorder?"
    back: "Suicidality usually resolves with abstinence for a few days. If suicidality persists after a few days of abstinence, suspect underlying depression and treat accordingly.\n\nSubstance intoxication and withdrawal can precipitate or amplify suicidal ideation. In Canadian emergency settings, it is important to reassess suicidal risk after the patient has become sober before committing to a psychiatric admission solely for substance-related suicidality."
    difficulty: easy
    tags: [psychiatry, suicide, substance use, alcohol]
