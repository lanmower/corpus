  - front: "The DASH trial showed what regarding blood pressure?"
    back: "The combination diet (rich in fruits, vegetables, and low-fat dairy) reduced systolic BP by 11.4 mmHg and diastolic by 5.5 mmHg in hypertensive patients\n\nDASH (Dietary Approaches to Stop Hypertension) demonstrated that dietary modifications significantly lower blood pressure, with the combination diet being most effective."
    difficulty: medium
