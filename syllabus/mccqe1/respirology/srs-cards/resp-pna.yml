    back: "Depressed Mood, Sleep disturbance (increased/decreased), Interest loss, Guilt, Energy decrease, Concentration impairment, Appetite disturbance (increased/decreased), Psychomotor agitation/retardation, Suicidal ideation\n\nM-SIGECAPS is the mnemonic for major depressive disorder symptoms. At least 5 symptoms must be present for 2+ weeks for diagnosis."
    difficulty: easy
    tags: [psychiatry, depression, diagnosis, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the M-SIGECAPS mnemonic components for depression?"
    back: "M-Depressed Mood, S-Increased/decreased Sleep, I-Decreased Interest, G-Increased/decreased Appetite, E-Feelings of Guilt, C-Psychomotor agitation/retardation, A-Concentration, P-Psychomotor agitation/retardation (repeated), S-Suicidal ideation\n\nM-SIGECAPS is a mnemonic for the 9 diagnostic criteria for major depressive disorder in DSM."
