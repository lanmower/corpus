# Family Medicine Menopause (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What is the definition of menopause and when does it typically occur?"
    back: "Menopause is defined as 12 months of amenorrhea following the final menstrual period. The mean age of menopause in Canada is 51.4 years.\n\nMenopause is a retrospective diagnosis — the 12-month amenorrhea confirms that the final menstrual period has occurred. It results from ovarian follicular depletion and the consequent decline in estrogen and progesterone production."
    difficulty: easy
    tags: [menopause, definition, gynecology, family-medicine]
  - front: "What are the clinical features of menopause and estrogen deprivation?"
    back: "Urogenital: atrophy, vaginal dryness/itching, urinary frequency/urgency/incontinence, bleeding.\nVascular: vasomotor instability (hot flashes), increased risk of heart disease.\nBones: bone loss, joint/muscle/back pain, fractures, loss of height.\nBrain: depression, irritability, mood swings, memory loss.\n\nEstrogen has widespread protective effects. Vasomotor symptoms affect up to 75% of menopausal women. Bone loss accelerates at menopause (up to 5% per year initially) due to loss of estrogen's anti-resorptive effect, increasing fracture risk significantly."
    difficulty: easy
    tags: [menopause, clinical-features, estrogen, hot-flashes, osteoporosis, family-medicine]
  - front: "What are the benefits and risks of hormone therapy (HT) for menopause?"
    back: "Benefits: decreases risk of osteoporotic fractures and colorectal cancer.\nRisks: increases risk of DVT and PE. If initiated >60 years OR >10 years post-menopause: can increase risk of breast cancer and stroke.\nHT should NOT be initiated >10 years post-menopause.\nRegimens: cyclic or continuous estrogen-progestin; estrogen-only patch/gel/cream/ring/vaginal tablet if no uterus.\n\nThe timing hypothesis states HT is most beneficial when started close to menopause onset (the 'window of opportunity'). Late initiation (>60 yr or >10 yr post-menopause) is associated with increased cardiovascular and breast cancer risk, consistent with WHI trial findings."
    difficulty: hard
    tags: [menopause, hormone-therapy, benefits-risks, DVT, breast-cancer, family-medicine]
  - front: "What non-hormonal pharmacological options are available for menopausal vasomotor symptoms?"
    back: "Venlafaxine, SSRIs, or gabapentin can be used to ease vasomotor instability (hot flashes).\n\nThese agents are particularly useful when HT is contraindicated (e.g., hormone-sensitive breast cancer, prior DVT/PE, uncontrolled CV disease). Venlafaxine and paroxetine have the best evidence for hot flash reduction among non-hormonal options. Gabapentin is especially useful for nocturnal hot flashes."
    difficulty: medium
    tags: [menopause, vasomotor, venlafaxine, SSRI, gabapentin, family-medicine]
  - front: "What are the calcium and vitamin D supplementation recommendations for menopausal women?"
    back: "Calcium: 1200 mg/day (adequate intake/supplementation)\nVitamin D: 1000 IU/day\n\nThese are non-pharmacological cornerstones of osteoporosis prevention in menopausal women. Adequate calcium and vitamin D are necessary for bone mineralization; estrogen deficiency accelerates bone resorption, so ensuring nutritional adequacy is foundational before considering bisphosphonate therapy."
    difficulty: easy
    tags: [menopause, calcium, vitamin-D, osteoporosis, family-medicine]
