# Gastroenterology Dyspepsia (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What are the red flag symptoms of dyspepsia that raise suspicion for gastrointestinal malignancy?"
    back: "Red flags in dyspepsia (raise suspicion for GI malignancy):\n- Unintended weight loss\n- Persistent vomiting\n- Progressive dysphagia\n- Odynophagia\n- Unexplained anemia or iron deficiency\n- Melena/hematemesis\n- Palpable abdominal mass or lymphadenopathy\n- Family history of upper GI cancer\n- Previous gastric surgery\n\nDyspepsia is most commonly functional, but these alarm features mandate prompt gastroscopy to exclude malignancy. In Canada, gastroscopy is recommended for patients >60 years with dyspepsia, or younger patients with red flag features or risk factors for gastric cancer."
    difficulty: easy
    tags: [dyspepsia, red flags, gastric cancer, alarm symptoms, gastroscopy, gastroenterology]
