    back: "Insomnia, tremors, tachycardia, sweating\n\nSNRIs have similar side effects to SSRIs plus norepinephrine-related effects like tachycardia and sweating."
    difficulty: medium
    tags: [pharmacology, psychiatry, depression, SNRI, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are common side effects of SNRIs (e.g., venlafaxine)?"
    back: "Insomnia, tremors, tachycardia, sweating\n\nSNRIs have similar side effects to SSRIs but additionally affect norepinephrine, causing more autonomic symptoms."
    difficulty: easy
    tags: [pharmacology, antidepressants, SNRI, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the four phases of clinical drug testing in order, and what is the primary purpose of each?"
    back: "Phase I: PK and safety in healthy volunteers (small N); Phase II: efficacy, safety, dose range, PK in patients (small N); Phase III: safety and efficacy vs. placebo/standard of care in large RCTs; Phase IV: post-marketing surveillance for effectiveness and previously undetected ADRs.\n\nHealth Canada requires all four phases before a drug receives a Drug Identification Number (DIN). Phase III double-blinded RCTs provide the highest level of evidence for regulatory approval, while Phase IV detects rare adverse effects that were missed in pre-approval trials."
    difficulty: easy
    tags: [pharmacology, drug testing, clinical trials, phases, Health Canada]
  - front: "A 55-year-old patient is prescribed sublingual nitroglycerin for angina. What pharmacokinetic advantage does the sublingual route have over the oral route?"
    back: "Sublingual administration bypasses intestinal and hepatic first-pass metabolism, providing faster onset and higher bioavailability compared to oral nitroglycerin which undergoes extensive first-pass effect.\n\nNitroglycerin is almost completely metabolized by first-pass effect when taken orally, making it ineffective PO. The sublingual route delivers drug directly into the systemic circulation via the highly vascularized sublingual mucosa, achieving rapid therapeutic levels for acute angina relief."
    difficulty: easy
    tags: [sublingual, first-pass effect, bioavailability, nitroglycerin, angina]
  - front: "Which route of drug administration has 100% bioavailability by definition?"
    back: "Intravenous (IV) administration has 100% bioavailability (F = 1), as the drug is delivered directly into the systemic circulation with no absorption step required.\n\nBioavailability (F) is the proportion of a dose that reaches systemic circulation unchanged. The IV route bypasses all absorption and first-pass processes, so the entire dose is available; all other routes have F < 1 due to incomplete absorption or presystemic clearance."
    difficulty: easy
    tags: [bioavailability, IV, pharmacokinetics, routes of administration]
  - front: "A patient taking oral simvastatin is started on erythromycin for a respiratory infection. What pharmacokinetic interaction should be anticipated and why?"
    back: "Erythromycin is a CYP3A4 inhibitor. It inhibits simvastatin's metabolism (simvastatin is a CYP3A4 substrate), leading to markedly elevated simvastatin plasma levels and increased risk of myopathy/rhabdomyolysis.\n\nCYP3A4 inhibition by erythromycin (a macrolide antibiotic) reduces first-pass and systemic metabolism of simvastatin, substantially increasing its AUC. Canadian prescribing guidelines recommend avoiding this combination or temporarily discontinuing the statin during macrolide therapy to prevent statin-induced myotoxicity."
    difficulty: medium
    tags: [CYP3A4, drug interaction, simvastatin, erythromycin, myopathy, enzyme inhibition]
  - front: "A patient drinks large amounts of grapefruit juice daily while taking simvastatin. What is the mechanism of the resulting drug interaction?"
    back: "Grapefruit juice is a potent inhibitor of intestinal CYP3A4, markedly reducing first-pass metabolism of simvastatin and increasing its AUC up to 17-fold, raising the risk of statin toxicity (myopathy/rhabdomyolysis).\n\nCertain furanocoumarins in grapefruit juice irreversibly inhibit CYP3A4 in enterocytes, preventing pre-systemic metabolism of CYP3A4 substrates. Because grapefruit affects intestinal rather than hepatic CYP3A4, the interaction applies mainly to drugs with significant first-pass metabolism. Patients should be counselled to avoid grapefruit with many CYP3A4 substrates."
    difficulty: medium
    tags: [grapefruit, CYP3A4, drug interaction, simvastatin, first-pass effect, food-drug interaction]
  - front: "A patient with epilepsy is started on carbamazepine. After several weeks, drug levels decline despite consistent dosing. What pharmacokinetic phenomenon explains this?"
    back: "Carbamazepine induces its own metabolism (autoinduction) by upregulating CYP enzymes, increasing its own biotransformation rate over time and reducing its plasma levels.\n\nCarbamazepine is an enzyme inducer that enhances transcription of CYP enzymes (primarily CYP3A4), which metabolize carbamazepine itself. This autoinduction effect typically develops over 2-4 weeks and requires dose escalation to maintain therapeutic levels. This is a classic example of enzyme induction causing clinically significant pharmacokinetic changes."
    difficulty: medium
    tags: [carbamazepine, autoinduction, enzyme induction, CYP, pharmacokinetics, epilepsy]
  - front: "A woman on oral contraceptive pills is started on phenobarbital for seizures. What pharmacokinetic interaction should be discussed?"
    back: "Phenobarbital is a potent CYP enzyme inducer that increases the metabolism of oral contraceptives, reducing their plasma levels and potentially causing contraceptive failure.\n\nEnzyme-inducing anticonvulsants (phenobarbital, phenytoin, carbamazepine, rifampin) increase hepatic CYP-mediated metabolism of estrogen and progestin components of oral contraceptives. Canadian guidelines recommend using alternative or additional contraception (e.g., barrier methods) in women taking enzyme-inducing drugs with OCP."
    difficulty: medium
    tags: [phenobarbital, enzyme induction, oral contraceptives, drug interaction, CYP, contraception failure]
  - front: "A chronic heavy alcohol user takes a standard dose of acetaminophen. Why is this patient at higher risk for hepatotoxicity compared to an occasional drinker?"
    back: "Chronic alcohol consumption induces CYP2E1, which converts acetaminophen to its toxic metabolite NAPQI. With greater NAPQI production, hepatic glutathione stores are depleted more rapidly, leading to hepatocellular damage at lower acetaminophen doses.\n\nIn acute alcohol ingestion, CYP2E1 is competitively inhibited by ethanol, temporarily reducing NAPQI formation. However, chronic alcohol use upregulates CYP2E1 expression and depletes glutathione reserves, making the liver more vulnerable to acetaminophen-induced oxidative injury. Health Canada recommends caution with acetaminophen in those who consume 3 or more alcoholic drinks per day."
    difficulty: medium
    tags: [acetaminophen, hepatotoxicity, CYP2E1, NAPQI, alcohol, chronic, drug interaction]
  - front: "A patient taking codeine for pain has an ultra-rapid CYP2D6 metabolizer genotype. What clinical concern does this raise?"
    back: "Ultra-rapid CYP2D6 metabolizers convert codeine to morphine extremely rapidly and in large quantities, leading to dangerously high morphine concentrations with risk of opioid toxicity (respiratory depression) even at standard doses.\n\nCodeine is a prodrug activated by CYP2D6 to morphine. Health Canada has issued warnings about codeine use in ultra-rapid metabolizers — especially concerning in breastfeeding mothers (morphine transferred to infant) and children post-tonsillectomy, where deaths have been reported. Codeine is now contraindicated in children under 12 in Canada."
    difficulty: hard
    tags: [codeine, CYP2D6, pharmacogenomics, ultra-rapid metabolizer, morphine, opioid toxicity, prodrug]
  - front: "A patient on warfarin is found to carry CYP2C9 loss-of-function alleles. How does this affect warfarin management?"
    back: "CYP2C9 loss-of-function alleles reduce warfarin metabolism, leading to higher warfarin plasma concentrations and greater anticoagulant effect; these patients require lower warfarin doses to maintain therapeutic INR and are at higher risk of bleeding.\n\nWarfarin (specifically the more potent S-enantiomer) is primarily metabolized by CYP2C9. Genetic variants (e.g., CYP2C9*2, *3) significantly reduce enzyme activity, necessitating dose reductions of up to 50-90%. Pharmacogenomic testing for CYP2C9 and VKORC1 variants can guide initial warfarin dosing to reduce bleeding complications."
    difficulty: hard
    tags: [warfarin, CYP2C9, pharmacogenomics, anticoagulation, bleeding risk, INR]
  - front: "A patient with severe liver disease requires dosing adjustment for which pharmacokinetic reason?"
    back: "Hepatic dysfunction reduces drug-metabolizing enzyme activity, particularly CYP enzymes, leading to decreased first-pass metabolism and reduced clearance of hepatically-metabolized drugs, resulting in higher and prolonged drug concentrations.\n\nThe liver is the primary site of biotransformation for most drugs. Conditions such as cirrhosis, hepatitis, and hepatocellular carcinoma can decrease CYP enzyme activity and reduce hepatic blood flow. However, the liver has significant reserve capacity so clinically significant effects typically occur only with advanced disease (e.g., Child-Pugh B or C cirrhosis)."
    difficulty: medium
    tags: [liver disease, hepatic metabolism, CYP enzymes, drug clearance, dose adjustment, cirrhosis]
  - front: "Why do neonates and elderly patients generally require dose reductions for many drugs compared to healthy adults?"
    back: "Both neonates and elderly patients have reduced drug biotransformation capacity due to immature or declining CYP enzyme activity, respectively, leading to higher drug concentrations and prolonged effects at standard adult doses.\n\nNeonates lack fully developed hepatic CYP enzyme systems and have reduced renal function, while elderly patients experience progressive decline in both hepatic blood flow and renal function (approximately 7.5 mL/min GFR loss per decade). Additionally, altered Vd due to body composition changes in both populations further affects drug disposition. Canadian prescribing principles advocate 'start low, go slow' in elderly patients."
    difficulty: easy
    tags: [neonates, elderly, biotransformation, pharmacokinetics, dose adjustment, age]
  - front: "What is the first-pass effect and which routes of administration avoid it?"
    back: "The first-pass effect is drug metabolism occurring in the GI tract and/or liver before the drug reaches systemic circulation, reducing bioavailability. Routes that avoid it include: IV, sublingual, buccal, inhalation, transdermal, rectal (partially), and intranasal.\n\nWhen a drug is absorbed orally, it travels via the portal vein to the liver where significant metabolism can occur before reaching systemic circulation. Drugs with high first-pass effects (e.g., nitroglycerin, lidocaine, morphine) have much lower bioavailability when given orally compared to parenteral routes. Recognizing which drugs have high first-pass effects guides route selection in clinical practice."
    difficulty: easy
    tags: [first-pass effect, bioavailability, pharmacokinetics, routes of administration, liver metabolism]
  - front: "What is volume of distribution (Vd) and what does a very large Vd indicate about a drug's pharmacological properties?"
    back: "Vd is the theoretical volume into which a drug distributes, calculated as dose divided by initial plasma concentration. A large Vd (much greater than total body water ~40 L) indicates the drug extensively distributes into tissues (e.g., fat, muscle) and has low plasma concentrations relative to total body drug content.\n\nVd is a theoretical value that does not correspond to an actual anatomical compartment. Drugs with large Vd (e.g., chloroquine, amiodarone, digoxin) are difficult to remove by hemodialysis because most drug is tissue-bound rather than in plasma. Conversely, drugs with small Vd (e.g., warfarin, aminoglycosides) remain predominantly in plasma and are more amenable to dialysis."
    difficulty: medium
    tags: [volume of distribution, Vd, tissue distribution, pharmacokinetics, plasma protein binding]
  - front: "An elderly patient with low serum albumin is started on phenytoin at a standard dose. What pharmacokinetic alteration should be anticipated?"
    back: "Hypoalbuminemia reduces phenytoin protein binding, increasing the free (unbound) drug fraction. The measured total phenytoin level will appear low while the pharmacologically active free fraction is elevated, increasing the risk of phenytoin toxicity.\n\nPhenytoin is ~90% protein-bound to albumin. In hypoalbuminemia, fewer binding sites are available, increasing the free fraction and pharmacological effect. Standard total drug levels will underestimate drug activity. A Sheiner-Tozer correction formula is used clinically to adjust the reported level. Free phenytoin levels should be checked when hypoalbuminemia is present."
    difficulty: hard
    tags: [phenytoin, protein binding, hypoalbuminemia, free drug, pharmacokinetics, elderly, toxicity]
  - front: "What is the elimination half-life of a drug and how many half-lives are required to reach steady-state?"
    back: "The elimination half-life is the time for serum drug concentration to decrease by 50%. Approximately 4-5 half-lives are required to reach steady-state with repeated dosing (and for complete elimination after stopping a drug).\n\nSteady-state is reached when the rate of drug administration equals the rate of elimination. This principle applies to first-order kinetics (most drugs). Clinically, this means a drug with a 12-hour half-life reaches steady-state in approximately 2-3 days, while a drug with a 5-day half-life (e.g., amiodarone) takes weeks. Loading doses are used when rapid therapeutic levels are required."
    difficulty: easy
    tags: [half-life, steady-state, pharmacokinetics, first-order kinetics, elimination]
  - front: "What are Phase I and Phase II drug metabolism reactions and how do they differ?"
    back: "Phase I reactions (oxidation, reduction, hydrolysis) introduce polar groups via CYP enzymes, slightly increasing water solubility. Phase II reactions (conjugation with glucuronic acid, glutathione, sulfate, acetyl, methyl groups, or amino acids) dramatically increase water solubility, facilitating renal/biliary excretion.\n\nPhase I reactions place a polar 'handle' on lipophilic drugs to permit subsequent Phase II conjugation. Phase II reactions generally inactivate drugs (though some conjugates retain activity, e.g., morphine-6-glucuronide). Some drugs undergo only Phase II conjugation (e.g., morphine is directly glucuronidated without requiring Phase I modification). Understanding these pathways helps predict drug interactions and effects of hepatic or renal impairment."
    difficulty: medium
    tags: [Phase I metabolism, Phase II metabolism, CYP enzymes, conjugation, glucuronidation, biotransformation]
  - front: "A patient on digoxin is started on clarithromycin. What drug interaction should be anticipated and what is its mechanism?"
    back: "Clarithromycin (a macrolide antibiotic) inhibits P-glycoprotein (P-gp), a multidrug efflux pump. Digoxin is a P-gp substrate; inhibition of P-gp increases digoxin absorption and reduces its elimination, leading to elevated digoxin levels and risk of toxicity.\n\nP-glycoprotein (P-gp) in intestinal epithelium and renal proximal tubules normally effluxes digoxin back into the gut lumen and renal tubule, respectively. Most macrolide antibiotics inhibit P-gp, substantially increasing digoxin bioavailability and reducing renal excretion. Digoxin toxicity (nausea, visual changes, arrhythmias) can occur; monitoring of digoxin levels is essential when macrolides are co-prescribed."
    difficulty: hard
    tags: [P-glycoprotein, digoxin, clarithromycin, drug interaction, macrolide, efflux pump, toxicity]
  - front: "A patient on rifampin for tuberculosis is also on cyclosporine post-transplant. What pharmacokinetic interaction occurs?"
    back: "Rifampin is a potent P-gp and CYP inducer (especially CYP3A4). It markedly increases cyclosporine metabolism and efflux, dramatically reducing cyclosporine plasma levels, potentially leading to organ rejection.\n\nRifampin induces hepatic and intestinal CYP3A4 as well as P-gp, both of which are critical to cyclosporine disposition. Cyclosporine levels can drop by up to 80% when rifampin is co-administered. This interaction requires vigilant therapeutic drug monitoring and often necessitates substantially increased cyclosporine doses. Alternative anti-tuberculosis regimens should be considered in transplant recipients when possible."
    difficulty: hard
    tags: [rifampin, cyclosporine, P-glycoprotein, CYP3A4, enzyme induction, drug interaction, transplant]
  - front: "What is enterohepatic recirculation and what is its clinical significance for drug therapy?"
    back: "Enterohepatic recirculation occurs when drugs or their conjugated metabolites excreted into bile are deconjugated by gut bacteria in the intestine, reabsorbed, and returned to the liver. This cycle prolongs the drug's half-life and duration of effect.\n\nClinically relevant examples include oral contraceptives (disrupted by antibiotics that alter gut flora, reducing OCP effectiveness) and certain NSAIDs. Some drugs with high enterohepatic recirculation (e.g., cholestyramine can interrupt this cycle for digoxin toxicity treatment). Understanding this mechanism helps explain prolonged drug effects and some drug interactions mediated by gut microbiome disruption."
    difficulty: medium
    tags: [enterohepatic recirculation, pharmacokinetics, bile, gut bacteria, oral contraceptives, half-life]
  - front: "How does renal drug excretion occur and what are the three major processes involved?"
    back: "Renal drug excretion = glomerular filtration + tubular secretion − tubular reabsorption. Glomerular filtration is passive (free drug only); tubular secretion is an active saturable process (both bound and free drug); tubular reabsorption can be active or passive and reduces net drug excretion.\n\nRenal function decreases approximately 7.5 mL/min GFR per decade of age after 40. Most drugs requiring dose adjustment in renal impairment are renally eliminated. Probenecid inhibits tubular secretion of penicillin (sharing organic anion transporters), historically used to increase penicillin levels. Drug clearance via kidneys is assessed using serum creatinine to estimate GFR."
    difficulty: medium
    tags: [renal excretion, glomerular filtration, tubular secretion, tubular reabsorption, pharmacokinetics, renal clearance]
  - front: "A patient with chronic kidney disease on multiple medications requires dose adjustment. What pharmacokinetic principles guide drug dosing in CKD?"
    back: "In CKD: (1) renally-excreted drugs accumulate due to reduced GFR and tubular secretion; (2) protein binding may be altered (reduced albumin, uremic displacement); (3) drug metabolism is often reduced; (4) Vd may change. Dose adjustment (dose reduction or extended interval) is guided by degree of renal impairment (eGFR).\n\nMany drugs or their active/toxic metabolites accumulate in CKD, requiring dose reduction or interval extension. Additionally, uremia affects drug protein binding and may alter drug metabolism. Canadian guidelines recommend using eGFR (Cockcroft-Gault or CKD-EPI) to guide dosing of renally-cleared drugs such as antibiotics, anticoagulants (e.g., LMWH, DOACs), digoxin, and metformin."
    difficulty: medium
    tags: [CKD, renal impairment, dose adjustment, pharmacokinetics, eGFR, drug accumulation]
  - front: "A geriatric patient is prescribed diazepam for procedural sedation. Why might this drug have a prolonged effect in this population?"
    back: "In elderly patients, increased body fat serves as a depot for lipid-soluble drugs like diazepam, greatly increasing its volume of distribution (Vd), prolonging the elimination half-life and drug effect, in addition to reduced hepatic metabolism.\n\nDiazepam is highly lipophilic and accumulates in adipose tissue. Elderly patients have increased body fat and reduced lean body mass and total body water, significantly enlarging the Vd for fat-soluble drugs. Combined with reduced hepatic CYP activity and decreased albumin, this leads to prolonged benzodiazepine effects and increased risk of falls, sedation, and cognitive impairment. Shorter-acting, non-hepatically metabolized benzodiazepines (e.g., lorazepam, oxazepam) are preferred in elderly patients."
    difficulty: medium
    tags: [diazepam, benzodiazepine, elderly, lipophilic, volume of distribution, adipose, pharmacokinetics]
  - front: "What is the Drug Identification Number (DIN) in Canada and how does it differ from a Natural Product Number (NPN)?"
    back: "A DIN (Drug Identification Number) is assigned by Health Canada to each approved pharmaceutical drug. An NPN (Natural Product Number) is assigned to natural health products (excluding homeopathic medicines) regulated by the Natural and Non-Prescription Health Products Directorate (NNHPD).\n\nIn Canada, the DIN system ensures that approved drugs meet safety, efficacy, and quality standards. Natural health products with NPNs have a different, less rigorous regulatory pathway than prescription or OTC drugs with DINs. Homeopathic products carry a DIN-HM. Clinicians should be aware of this distinction when counselling patients about supplement-drug interactions, as NPN products may have limited safety data."
    difficulty: easy
    tags: [DIN, NPN, Health Canada, drug regulation, natural health products, pharmacology]
  - front: "A patient is taking St. John's Wort as a herbal supplement along with apixaban for atrial fibrillation. What pharmacokinetic interaction should be anticipated?"
    back: "St. John's Wort is a P-gp inducer. Apixaban is a P-gp substrate. Induction of P-gp by St. John's Wort increases apixaban efflux and elimination, reducing apixaban plasma levels and potentially increasing thromboembolic risk.\n\nP-gp inducers (e.g., rifampin, St. John's Wort) increase efflux activity in intestinal epithelium and renal proximal tubules, reducing absorption and increasing elimination of P-gp substrate drugs. For anticoagulants such as apixaban, rivaroxaban, and dabigatran that are P-gp substrates, concurrent use of P-gp inducers can reduce anticoagulant effectiveness and increase stroke risk in atrial fibrillation. Canadian CCS guidelines recommend avoiding concurrent use."
    difficulty: hard
    tags: [St. Johns Wort, P-glycoprotein, apixaban, DOAC, drug interaction, herbal, atrial fibrillation]
  - front: "What is the Henderson-Hasselbalch equation's relevance to drug absorption, and which form of a weak acid drug crosses cell membranes more readily?"
    back: "The Henderson-Hasselbalch equation determines the ratio of ionized to non-ionized drug based on compartment pH and drug pKa. The non-ionized (uncharged) form of drugs crosses cell membranes more readily by passive diffusion; weak acids are more non-ionized in acidic environments.\n\nFor a weak acid (e.g., ASA, pKa ~3.5), non-ionized form predominates in the acidic gastric environment, facilitating absorption there. In the more alkaline intestine and blood, more drug is ionized. This concept of 'ion trapping' is clinically used in urine alkalinization (e.g., sodium bicarbonate) to increase ionization of weak acid drugs (salicylates, barbiturates) in urine and enhance their renal elimination in overdose."
    difficulty: hard
    tags: [Henderson-Hasselbalch, ionization, drug absorption, weak acid, pH, passive diffusion, ion trapping]
  - front: "A patient taking tacrolimus (a P-gp substrate) is started on a macrolide antibiotic. What is the expected pharmacokinetic consequence?"
    back: "Macrolide antibiotics inhibit P-gp (and often CYP3A4), reducing the efflux and increasing the absorption and plasma concentration of tacrolimus, potentially causing tacrolimus toxicity (nephrotoxicity, neurotoxicity).\n\nTacrolimus has a narrow therapeutic index and is both a CYP3A4 substrate and P-gp substrate. Macrolide-mediated inhibition of both pathways can dramatically increase tacrolimus levels. Therapeutic drug monitoring of tacrolimus trough levels is essential whenever inhibitors or inducers of CYP3A4 or P-gp are initiated or discontinued in transplant patients."
    difficulty: hard
    tags: [tacrolimus, macrolide, P-glycoprotein, CYP3A4, drug interaction, transplant, narrow therapeutic index]
  - front: "What are the advantages and disadvantages of transdermal drug delivery compared to oral administration?"
    back: "Advantages of transdermal: avoids first-pass effect, no GI adverse effects, sustained/constant absorption, easy application, improved adherence. Disadvantages: delayed onset, site irritation, limited to lipid-soluble drugs with small molecular weight, lower drug loading capacity.\n\nTransdermal delivery is suitable for drugs requiring continuous systemic levels where first-pass effect would significantly reduce bioavailability (e.g., fentanyl, nicotine, estradiol, scopolamine). The delayed onset (12-24 hours for fentanyl patch) means this route is inappropriate for acute pain management. Canadian prescribing guidelines note that transdermal fentanyl is reserved for opioid-tolerant patients with chronic stable pain."
    difficulty: easy
    tags: [transdermal, drug delivery, first-pass effect, pharmacokinetics, routes of administration, fentanyl]
  - front: "How does smoking affect the pharmacokinetics of clozapine, and what are the clinical implications?"
    back: "Smoking induces CYP1A2, which is the primary enzyme metabolizing clozapine. Smokers require higher clozapine doses to achieve therapeutic plasma levels; if a patient stops smoking, CYP1A2 induction reverses and clozapine levels can rise dramatically, risking toxicity.\n\nPolycyclic aromatic hydrocarbons in tobacco smoke (not nicotine) induce CYP1A2. Clozapine plasma levels in smokers may be 30-50% lower than in non-smokers at equivalent doses. When a patient with schizophrenia stops smoking (e.g., during hospitalization), clozapine levels can rise and cause serious adverse effects including seizures, sedation, and agranulocytosis. Dose reduction by 25-40% is typically recommended upon smoking cessation."
    difficulty: hard
    tags: [clozapine, smoking, CYP1A2, enzyme induction, pharmacokinetics, schizophrenia, drug monitoring]
  - front: "What is a prodrug? Give two clinically relevant examples and the enzymes responsible for activation."
    back: "A prodrug is an inactive drug that requires biotransformation in the body to form an active metabolite. Examples: (1) Codeine → morphine via CYP2D6; (2) Tamoxifen → endoxifen via CYP2D6. Also: clopidogrel → active thienopyridine via CYP2C19.\n\nProdrug design exploits metabolic activation to improve bioavailability, reduce toxicity, or target drug delivery. Clinical implications include genetic polymorphisms affecting activation (e.g., CYP2D6 poor metabolizers have reduced analgesic response to codeine; CYP2C19 poor metabolizers have reduced antiplatelet effect with clopidogrel). Canadian guidelines recommend prasugrel or ticagrelor over clopidogrel in ACS patients where CYP2C19 poor metabolizer status is a concern."
    difficulty: medium
    tags: [prodrug, CYP2D6, codeine, tamoxifen, clopidogrel, pharmacogenomics, biotransformation]
  - front: "Why is probenecid used to enhance the effect of penicillin, and what pharmacokinetic principle does this exploit?"
    back: "Probenecid inhibits organic anion transporters responsible for tubular secretion of penicillin in the renal proximal tubule, reducing penicillin excretion and increasing its plasma half-life and concentration.\n\nTubular secretion is a saturable, active transport process. Penicillin and probenecid share the same organic anion transporter (OAT). By competing for this transporter, probenecid effectively blocks penicillin secretion, historically used to extend penicillin action when drug supply was limited. This principle of exploiting transporter competition is also relevant to understanding interactions between NSAIDs, diuretics, and other drugs sharing renal organic anion transport systems."
    difficulty: medium
    tags: [probenecid, penicillin, tubular secretion, organic anion transporter, renal excretion, drug interaction]
  - front: "A patient requires rapid therapeutic levels of amiodarone for a new-onset ventricular arrhythmia. What pharmacokinetic principle justifies giving a loading dose, and after how many half-lives is steady-state achieved with maintenance dosing?"
    back: "Loading doses are used for drugs with long half-lives to rapidly achieve therapeutic levels. Steady-state is achieved after approximately 4-5 half-lives of maintenance dosing.\n\nAmiodarone has an extremely long half-life (weeks), so without a loading dose it would take months to reach therapeutic levels. Steady-state concentration is reached when drug input equals elimination, typically after 4-5 half-lives."
    difficulty: easy
    tags: [pharmacokinetics, loading dose, steady-state, amiodarone, half-life]
  - front: "Why is nitroprusside administered as a continuous infusion rather than intermittent doses?"
    back: "Nitroprusside has a very short half-life, so continuous infusion maintains a steady therapeutic level; intermittent dosing would result in rapidly fluctuating (and inadequate) drug levels.\n\nDrugs with very short half-lives require continuous infusion to maintain therapeutic concentrations when long-term effect is needed and frequent repeated doses are impractical. This applies to nitroprusside, unfractionated heparin, and naloxone."
    difficulty: easy
    tags: [pharmacokinetics, continuous infusion, nitroprusside, half-life]
  - front: "How is total body drug clearance (Cl) calculated from elimination rate constant (ke) and volume of distribution (Vd)?"
    back: "Cl = ke × Vd, where ke = ln2 / half-life.\n\nClearance quantifies the volume of body fluid from which a substance is removed per unit time. Total body clearance equals the product of the elimination rate constant and the volume of distribution."
    difficulty: medium
    tags: [pharmacokinetics, clearance, volume of distribution, elimination rate constant]
  - front: "A patient takes phenytoin at a dose that saturates hepatic enzymes. What type of elimination kinetics applies, and what is the clinical implication?"
    back: "Zero-order (non-linear) kinetics: a constant amount of drug is eliminated per unit time regardless of concentration. Small dose increases can cause disproportionately large rises in serum levels, making dosing unpredictable.\n\nPhenytoin, alcohol, and high-dose aspirin can exhibit zero-order kinetics when elimination pathways become saturated. Unlike first-order kinetics, the concept of half-life does not apply, and drug-specific nomograms or therapeutic drug monitoring are required."
    difficulty: medium
    tags: [pharmacokinetics, zero-order kinetics, phenytoin, non-linear kinetics, TDM]
  - front: "What is the graphical hallmark that distinguishes first-order from zero-order elimination kinetics when plotted?"
    back: "First-order kinetics shows a linear (straight) relationship on a log-concentration vs. time plot. Zero-order kinetics shows a straight line on a linear concentration vs. time plot (curved on the log scale).\n\nFirst-order kinetics eliminates a constant proportion of drug per unit time; converting the concentration axis to log scale linearizes the relationship. Zero-order kinetics eliminates a constant amount per unit time, remaining linear on a regular (non-log) concentration-time graph."
    difficulty: medium
    tags: [pharmacokinetics, first-order kinetics, zero-order kinetics, elimination]
  - front: "Drug A reaches 50% of its maximal effect at a concentration of 0.1 mg/L, while Drug B requires 1 mg/L. Both achieve the same maximal effect. Which drug is more potent and which is more efficacious?"
    back: "Drug A is more potent (lower EC50). Both drugs have equal efficacy (same Emax).\n\nPotency is measured by EC50 — the concentration needed to produce 50% of maximal effect. Efficacy is measured by Emax — the maximal response achievable. A drug can be highly potent but have low efficacy (e.g., partial agonist) or vice versa."
    difficulty: easy
    tags: [pharmacodynamics, potency, efficacy, EC50, Emax]
  - front: "What is the difference between ED50, TD50, and LD50, and how is the Therapeutic Index calculated?"
    back: "ED50 = dose effective in 50% of population; TD50 = dose toxic in 50%; LD50 = dose lethal in 50%. Therapeutic Index (TI) = TD50/ED50 (or LD50/ED50 in animal studies). A higher TI means a safer drug.\n\nThe TI is a measure of relative drug safety. Drugs with a narrow TI (e.g., digoxin, lithium, warfarin, phenytoin, theophylline) require careful monitoring because the therapeutic dose is close to the toxic dose."
    difficulty: easy
    tags: [pharmacodynamics, therapeutic index, ED50, TD50, LD50, drug safety]
  - front: "Which drugs classically have a narrow therapeutic window requiring therapeutic drug monitoring (TDM)? List at least five."
    back: "Digoxin, warfarin, lithium, phenytoin, theophylline, cyclosporine, vancomycin, aminoglycosides (gentamicin, tobramycin).\n\nDrugs with narrow therapeutic indices have a small margin between therapeutic and toxic concentrations. TDM uses serum drug levels (ideally at steady-state after 4-5 half-lives) to optimize dosing and minimize toxicity or therapeutic failure."
    difficulty: easy
    tags: [TDM, therapeutic drug monitoring, narrow therapeutic index, digoxin, lithium, warfarin]
  - front: "When should serum drug levels be drawn for therapeutic drug monitoring to be most useful?"
    back: "At steady-state, which is reached after approximately 4-5 half-lives of consistent dosing.\n\nTDM is most useful once steady-state is achieved, because pre-steady-state levels do not reflect the true relationship between dose and effect. Timing of sample collection (trough vs. peak) also depends on the drug."
    difficulty: easy
    tags: [TDM, steady-state, therapeutic drug monitoring, pharmacokinetics]
  - front: "A patient taking warfarin is started on ciprofloxacin and develops a supratherapeutic INR. What mechanism explains this drug interaction?"
    back: "Ciprofloxacin (and macrolides like clarithromycin/erythromycin) inhibit CYP enzymes responsible for warfarin metabolism, increasing warfarin plasma concentrations and anticoagulant effect. Antibiotics may also reduce gut flora producing vitamin K.\n\nThis is a pharmacokinetic (PK) drug interaction via altered metabolism. CYP inhibition reduces warfarin clearance, elevating levels into the toxic range. Canadian prescribing guidelines recommend close INR monitoring when adding enzyme inhibitors to warfarin therapy."
    difficulty: medium
    tags: [drug interactions, warfarin, ciprofloxacin, CYP inhibition, INR, pharmacokinetics]
  - front: "A patient taking selegiline (an irreversible MAO-B inhibitor) is started on an SSRI. What dangerous drug interaction can occur?"
    back: "Serotonin syndrome — a potentially life-threatening condition caused by excess serotonergic activity, presenting with hyperthermia, clonus, agitation, and autonomic instability.\n\nThis is a pharmacodynamic (PD) drug interaction via additive/synergistic effects on serotonin. MAO inhibitors reduce serotonin breakdown while SSRIs block serotonin reuptake, leading to serotonin excess. This combination is contraindicated."
    difficulty: medium
    tags: [drug interactions, serotonin syndrome, MAOI, SSRI, selegiline, pharmacodynamics]
  - front: "What are the five types of adverse drug reactions (A through E) with examples?"
    back: "A (Augmented): dose-related extension of pharmacologic effect (e.g., beta-blockers → bradycardia). B (Bizarre): unpredictable, not dose-related (e.g., penicillin hypersensitivity, malignant hyperthermia). C (Chronic): cumulative dose-related (e.g., bisphosphonate → atypical femoral fracture). D (Delayed): occurs after drug use (e.g., doxorubicin → cardiotoxicity). E (End of use): withdrawal (e.g., opioid withdrawal).\n\nType A reactions account for >80% of all ADRs and are predictable from the drug's pharmacology. Type B reactions are idiosyncratic and unpredictable, often immune-mediated or genetic in origin. Recognition of ADR type guides management and reporting."
    difficulty: medium
    tags: [adverse drug reactions, ADR classification, Type A, Type B, drug safety]
  - front: "Which adverse drug reactions must be reported to the Canadian Adverse Drug Reaction Monitoring Program (CADRMP)?"
    back: "All suspected ADRs that are: 1) unexpected, 2) serious, or 3) reactions to recently marketed drugs (on the market <5 years), regardless of nature or severity.\n\nCanada's MedEffect/CADRMP program collects post-market safety data. Healthcare providers can report online through Health Canada. This pharmacovigilance is essential for detecting rare and delayed ADRs not captured in pre-market trials."
    difficulty: easy
    tags: [ADR reporting, pharmacovigilance, Health Canada, CADRMP, drug safety]
  - front: "A patient with a penicillin allergy needs antibiotic treatment. What is the risk of cross-reactivity with cephalosporins? With carbapenems?"
    back: "Cross-reactivity between penicillin and cephalosporins is <2%. Cross-reactivity between penicillin and carbapenems is <1%. Patients with history of severe immediate reaction (anaphylaxis) to penicillin require caution.\n\nThe historically cited 10% cross-reactivity between penicillin and cephalosporins is an overestimate. Modern evidence shows the actual rate is <2%. Canadian guidelines support using cephalosporins in most penicillin-allergic patients with appropriate assessment."
    difficulty: medium
    tags: [penicillin allergy, cross-reactivity, cephalosporins, carbapenems, drug allergy]
  - front: "Does a 'sulfa allergy' to sulfamethoxazole-trimethoprim mean the patient will react to furosemide or hydrochlorothiazide?"
    back: "No. Current evidence suggests cross-reactivity is unlikely between sulfonamide antibiotics and non-antibiotic sulfonamides such as loop diuretics (furosemide), thiazides (hydrochlorothiazide), sulfonylureas, and carbonic anhydrase inhibitors.\n\nThe term 'sulfa allergy' is often misapplied. Sulfonamide antibiotics contain an arylamine group at N4 responsible for most allergic reactions, which non-antibiotic sulfonamides lack. Clinical decisions should not withhold necessary medications based on unsubstantiated cross-reactivity fears."
    difficulty: medium
    tags: [sulfa allergy, cross-reactivity, furosemide, hydrochlorothiazide, drug allergy]
  - front: "What is the Certain Safety Factor and how does it differ from the Therapeutic Index?"
    back: "Certain Safety Factor = TD1/ED99. It compares the dose toxic in <1% of people with the dose effective in ≥99% of people. TI = TD50/ED50. The CSF is a more stringent safety measure; regulatory agencies often require it to exceed 100.\n\nThe Therapeutic Index uses median values (50th percentile) which may underestimate risk in real populations. The Certain Safety Factor examines the extremes of the dose-response curve, providing a more conservative estimate of whether a drug can be safe across diverse patients."
    difficulty: hard
    tags: [therapeutic index, certain safety factor, drug safety, pharmacodynamics, TD1, ED99]
  - front: "What are common causes of variability in drug response between individual patients?"
    back: "Age, genetics (e.g., CYP polymorphisms), disease states (liver/renal dysfunction), drug interactions, diet (e.g., grapefruit juice), medication adherence, altered absorption (vomiting, diarrhea), distribution (body composition, BBB integrity), and pharmacodynamic variability.\n\nInter-individual variability in drug response means population-average dosing recommendations may not be appropriate for all patients. Genetic polymorphisms in CYP enzymes and drug transporters are increasingly recognized as important contributors to variable drug response."
    difficulty: easy
    tags: [pharmacokinetics, drug variability, CYP polymorphism, personalized medicine, genetics]
  - front: "Statins combined with gemfibrozil or clarithromycin significantly increase the risk of what serious adverse effect, and what is the mechanism?"
    back: "Rhabdomyolysis. Gemfibrozil inhibits OATP1B1/OATP1B3 hepatic uptake transporters, and clarithromycin inhibits CYP3A4, both reducing statin clearance and causing elevated statin levels in muscle.\n\nThis is a pharmacokinetic interaction at the level of hepatic uptake transporters (OATP) and/or CYP3A4 metabolism. Elevated statin concentrations in skeletal muscle cause mitochondrial dysfunction and myocyte destruction (rhabdomyolysis), which can precipitate acute kidney injury."
    difficulty: hard
    tags: [drug interactions, statin, rhabdomyolysis, gemfibrozil, clarithromycin, OATP, CYP3A4]
  - front: "Warfarin plus high-dose acetaminophen leads to elevated INR. What is the proposed mechanism?"
    back: "NAPQI (the toxic metabolite of acetaminophen) inhibits enzymes in the vitamin K cycle, potentiating warfarin's anticoagulant effect. Acetaminophen may also inhibit CYP2C9-mediated warfarin metabolism.\n\nThe warfarin-acetaminophen interaction is clinically significant with higher acetaminophen doses and prolonged use. Patients on warfarin should avoid high-dose acetaminophen and have their INR monitored when using it regularly."
    difficulty: hard
    tags: [drug interactions, warfarin, acetaminophen, NAPQI, vitamin K, INR]
  - front: "Match the following drug name endings to their drug class: -olol, -pril, -sartan, -statin, -azepam, -mab."
    back: "-olol = beta-blocker (e.g., metoprolol); -pril = ACE inhibitor (e.g., captopril); -sartan = ARB (e.g., candesartan); -statin = HMG-CoA reductase inhibitor (e.g., atorvastatin); -azepam = benzodiazepine (e.g., lorazepam); -mab = monoclonal antibody (e.g., adalimumab).\n\nRecognizing drug name suffixes (stems) is an important clinical skill for identifying drug classes quickly, anticipating mechanisms of action, and anticipating class-specific adverse effects on MCCQE1."
    difficulty: easy
    tags: [drug nomenclature, drug suffixes, pharmacology, drug class identification]
  - front: "Match these drug endings to their class: -afil, -nib, -terol, -prazole, -vir, -tidine."
    back: "-afil = PDE-5 inhibitor (e.g., sildenafil); -nib = small molecule inhibitor (e.g., imatinib); -terol = beta-2 agonist (e.g., albuterol); -prazole = proton pump inhibitor (e.g., omeprazole); -vir = antiviral (e.g., acyclovir); -tidine = H2 antagonist (e.g., cimetidine).\n\nDrug name stems are standardized by WHO's International Nonproprietary Name (INN) program. Note exceptions: methimazole ends in -azole but is antithyroid; nystatin ends in -statin but is an antifungal."
    difficulty: easy
    tags: [drug nomenclature, drug suffixes, PDE5 inhibitor, antiviral, beta-2 agonist]
  - front: "What dangerous abbreviation error is associated with writing 'U' for units, and what is the recommended correction?"
    back: "'U' for units can be mistaken for '0' (zero), '4', or 'cc', leading to 10-fold dosing errors (e.g., 10U of insulin misread as 100). Always write out 'unit' in full.\n\nThe Institute for Safe Medication Practices Canada (ISMP Canada) identifies dangerous abbreviations that contribute to medication errors. Writing out full words (unit, daily, millilitre) rather than abbreviations is mandated in Canadian healthcare settings."
    difficulty: easy
    tags: [medication safety, dangerous abbreviations, ISMP, medication errors, unit]
  - front: "What medication error can occur when a trailing zero is written (e.g., 1.0 mg), and how should it be corrected?"
    back: "The decimal point may be overlooked, leading to a 10-fold overdose (1.0 mg misread as 10 mg). Never write a trailing zero — write 'X mg' not 'X.0 mg'. Always use a leading zero (e.g., 0.5 mg, not .5 mg).\n\nTrailing zeros and absent leading zeros are major sources of medication errors in Canada. ISMP Canada mandates their elimination. The inverse rule applies: always use a leading zero before a decimal point to prevent under-dosing by overlooking the decimal."
    difficulty: easy
    tags: [medication safety, trailing zero, leading zero, medication errors, ISMP Canada]
  - front: "Why is writing 'QD' or 'QOD' for dosing frequency potentially dangerous?"
    back: "'QD' (every day) can be misread as 'QID' (4 times daily) — a 4-fold dosing error. 'QOD' (every other day) can be confused with 'QD' or 'QID'. Correct alternatives: write 'daily' and 'every other day' in full.\n\nThese are among ISMP Canada's listed dangerous abbreviations. Handwritten 'Q' can be misinterpreted as '2', and the proximity of 'QD' and 'QID' in appearance has led to serious patient harm. Clear, unambiguous written instructions are a core patient safety principle."
    difficulty: easy
    tags: [medication safety, dangerous abbreviations, QD, QOD, ISMP, dosing frequency]
  - front: "Writing 'MS' on a prescription is potentially dangerous. Why?"
    back: "'MS' can be confused between morphine sulfate (MS/MSO4) and magnesium sulfate (MgSO4), which have very different indications and can cause serious harm if confused. Drug names should never be abbreviated.\n\nISMP Canada prohibits abbreviating drug names because similar abbreviations exist for multiple drugs. Confusion between MS (morphine) and MgSO4 (magnesium) has caused patient deaths. Full drug names must always be written."
    difficulty: easy
    tags: [medication safety, dangerous abbreviations, morphine, magnesium, medication errors]
  - front: "Writing 'mcg' vs. 'μg' for micrograms — which is preferred and why?"
    back: "'mcg' is preferred. The symbol 'μg' can be misread as 'mg', resulting in a 1000-fold overdose. Always write 'mcg' rather than the Greek symbol μ.\n\nISMP Canada identifies the μg symbol as a dangerous dose designation because handwritten versions are easily confused with 'mg'. A 1000-fold overdose of many drugs (e.g., fentanyl, levothyroxine) would be fatal."
    difficulty: easy
    tags: [medication safety, micrograms, dangerous abbreviations, dosing, ISMP]
  - front: "What is 'DC' as a dangerous abbreviation in hospital prescribing?"
    back: "'DC' intended to mean 'discharge' can be misinterpreted as 'discontinue', potentially leading nurses to stop all current medications when discharge medications are intended. Always write 'discharge' in full.\n\nThis is a common hospital medication safety issue. ISMP Canada mandates writing out full words rather than ambiguous abbreviations. Medication reconciliation at discharge is a required Canadian patient safety practice."
    difficulty: easy
    tags: [medication safety, discharge, DC abbreviation, medication errors, ISMP]
  - front: "What are the origins of parasympathetic and sympathetic preganglionic fibres, and what neurotransmitters do they use?"
    back: "Parasympathetic: cranial nerves III, VII, IX, X and sacral S2-S4 ('craniosacral'). Sympathetic: T1-L2/L3 ('thoracolumbar'). Both systems use ACh at preganglionic synapses (nicotinic receptors). Parasympathetic postganglionic → ACh (muscarinic). Sympathetic postganglionic → NE (adrenergic); exception: sweat glands use ACh (M3).\n\nUnderstanding autonomic anatomy is essential for predicting effects of autonomic drugs. Sympathetic ganglia are in paravertebral or prevertebral chains; parasympathetic ganglia are near/within target organs. This explains why ganglionic blockers have widespread effects."
    difficulty: medium
    tags: [autonomic nervous system, parasympathetic, sympathetic, ACh, NE, ganglia]
  - front: "How is norepinephrine (NE) action terminated at the sympathetic synapse?"
    back: "NE action is terminated by: 1) reuptake at the presynaptic membrane (primary), 2) diffusion from the synaptic cleft, and 3) enzymatic degradation by MAO and COMT.\n\nUnderstanding NE termination is clinically relevant: TCAs and SNRIs block reuptake increasing NE; MAOIs inhibit MAO preventing NE breakdown; cocaine blocks NE reuptake causing sympathomimetic effects. COMT inhibitors (entacapone) are used in Parkinson's disease."
    difficulty: medium
    tags: [norepinephrine, sympathetic nervous system, MAO, COMT, reuptake, autonomic]
  - front: "What vascular receptor distribution determines the effect of alpha-1 adrenergic stimulation in skin/splanchnic vs. coronary vessels?"
    back: "α1 receptors in skin and splanchnic vasculature cause vasoconstriction. Coronary vessels also express α1 and β2 receptors: α1 stimulation causes constriction while β2 stimulation causes dilation. Overall coronary flow depends on local metabolic autoregulation.\n\nThe differential receptor distribution explains why vasopressors (e.g., norepinephrine with α1 activity) can increase blood pressure via peripheral vasoconstriction while coronary perfusion is maintained through autoregulation. β2 stimulation by epinephrine causes coronary dilation."
    difficulty: medium
    tags: [autonomic nervous system, alpha-1 receptor, vasoconstriction, coronary vessels, adrenergic]
  - front: "Which exception to parasympathetic innervation is clinically important — what structures lack parasympathetic supply?"
    back: "Blood vessels (most), sweat glands, the spleen capsule, and the adrenal medulla lack parasympathetic innervation. These structures are regulated exclusively by the sympathetic system.\n\nThis explains why sympathetic blockade (e.g., spinal anesthesia) causes vasodilation from loss of sympathetic tone without any compensatory parasympathetic vasodilation. Sweat glands, though innervated by sympathetic fibres, use ACh as their neurotransmitter (M3 receptors)."
    difficulty: medium
    tags: [autonomic nervous system, parasympathetic, sweat glands, adrenal medulla, sympathetic]
  - front: "In pharmacogenomics, what is the clinical significance of CYP2D6 polymorphism for codeine use?"
    back: "CYP2D6 converts codeine to morphine. Poor metabolizers get no analgesia. Ultra-rapid metabolizers convert codeine too rapidly, producing dangerously high morphine levels — risk of respiratory depression and death, especially in children and breastfeeding mothers.\n\nHealth Canada and FDA have issued warnings against codeine use in pediatric patients and breastfeeding mothers due to CYP2D6 ultra-rapid metabolizer risk. CYP polymorphisms are a key example of biotransformation variability affecting drug response."
    difficulty: hard
    tags: [pharmacogenomics, CYP2D6, codeine, morphine, ultra-rapid metabolizer, drug variability]
  - front: "Pharmacogenetic warfarin dosing was studied in the CoumaGen-I trial. What were the key findings?"
    back: "Pharmacogenetic dosing algorithms were non-inferior to standard dosing, reduced out-of-range INRs (31% vs. 42% at 1 month), and increased time in therapeutic range (69% vs. 58% at 1 month) compared to standard care.\n\nThe CoumaGen-I trial (Circulation 2012) demonstrated that incorporating genetic information (CYP2C9 and VKORC1 polymorphisms) into warfarin dosing improves anticoagulation control. This supports the use of pharmacogenomics to personalize anticoagulation therapy."
    difficulty: hard
    tags: [warfarin, pharmacogenomics, CoumaGen, INR, therapeutic range, clinical trial]
  - front: "A patient presents with an acute generalized eruption of sterile pustules following a new antibiotic. What is the diagnosis and its cause?"
    back: "Acute generalized exanthematous pustulosis (AGEP): rapidly appearing sterile pustules on an erythematous base, most commonly caused by a drug reaction (especially antibiotics like penicillins and macrolides).\n\nAGEP typically resolves within 1–2 weeks after stopping the causative drug. It must be differentiated from pustular psoriasis (by drug history and rapid resolution). This is classified as a severe cutaneous adverse drug reaction."
    difficulty: hard
    tags: [dermatology, AGEP, drug reaction, pustule, antimicrobials]
  - front: "What are the Naranjo criteria for classifying a drug reaction?"
    back: "Four criteria: (1) temporal relationship between drug exposure and reaction, (2) recognized response to the suspected drug, (3) improvement after drug withdrawal, (4) recurrence on re-challenge. Definite = all 4 met; Probable = criteria 1-3; Possible = only criterion 1.\n\nThese criteria help establish causality in adverse drug reactions. The time course (7-14 days after drug initiation for exanthematous reactions) is a key temporal relationship."
    difficulty: medium
    tags: [drug reaction, Naranjo criteria, adverse drug reaction, pharmacovigilance]
  - front: "What are the common causative agents and management of Exanthematous Drug Reaction?"
    back: "Common agents: penicillin, sulfonamides, phenytoin. Onset 7-14 days after drug initiation. Management: weigh risks of drug discontinuation, antihistamines, emollients, topical corticosteroids.\n\nExanthematous (morbilliform) drug reaction is the most common cutaneous drug reaction. It presents as erythematous macules and papules that spread symmetrically from trunk to extremities and fades 7-14 days after withdrawal."
    difficulty: easy
    tags: [exanthematous drug reaction, morbilliform, penicillin, sulfonamides, phenytoin]
  - front: "What is DRESS syndrome and what are its key features?"
    back: "Drug Reaction with Eosinophilia and Systemic Symptoms (DRESS): morbilliform rash involving face/trunk/arms with facial edema, fever, malaise, cervical lymphadenopathy, and organ involvement (hepatitis, nephritis, pneumonitis). Onset 1-6 weeks after first drug exposure. 10% mortality if severe and untreated.\n\nCommon causative agents include anticonvulsants (phenytoin, phenobarbital, carbamazepine, lamotrigine), sulfonamides, and allopurinol. Management: discontinue offending drug + prednisone 0.5 mg/kg/day."
    difficulty: medium
    tags: [DRESS, drug hypersensitivity, eosinophilia, anticonvulsants, allopurinol, drug reaction]
  - front: "Which drugs most commonly cause DRESS/Drug-Induced Hypersensitivity Syndrome?"
    back: "Anticonvulsants (phenytoin, phenobarbital, carbamazepine, lamotrigine), sulfonamides, and allopurinol.\n\nDRESS has 10% mortality if severe, undiagnosed, and untreated, and may progress to erythroderma if the drug is not discontinued. Management includes discontinuing the drug and systemic corticosteroids."
    difficulty: easy
    tags: [DRESS, anticonvulsants, allopurinol, sulfonamides, drug hypersensitivity]
  - front: "What is the most common cause of drug-induced angioedema and what is the mechanism?"
    back: "ACE inhibitors are the most common cause of drug-induced angioedema (bradykinin-mediated, not IgE-mediated). Other causative agents include penicillins, analgesics/anti-inflammatories, and radiographic contrast media.\n\nDrug-induced urticaria and angioedema is the second most common cutaneous drug reaction. Management involves discontinuing the offending drug, antihistamines, oral corticosteroids, and epinephrine if anaphylactic."
    difficulty: easy
    tags: [angioedema, ACE inhibitor, bradykinin, drug-induced urticaria, anaphylaxis]
  - front: "What is a Serum Sickness-Like Reaction and what are its common causative drugs?"
    back: "Symmetrical urticarial eruption with malaise, low-grade fever, arthralgia, and lymphadenopathy. Appears 1-3 weeks after drug initiation, resolves 2-3 weeks after withdrawal. Common agents: cefaclor (children), bupropion (adults).\n\nMore prevalent in children (0.02-0.2%). Management involves discontinuing the drug and topical/oral corticosteroids. Unlike true serum sickness, it is not complement-mediated."
    difficulty: medium
    tags: [serum sickness-like reaction, cefaclor, bupropion, urticaria, drug reaction]
  - front: "What is Acute Generalized Exanthematous Pustulosis (AGEP) and what drugs cause it?"
    back: "AGEP: extensive erythematous edematous sterile pustules with high fever and leukocytosis (neutrophilia). Appears within 1 week of drug initiation. Common causative agents: aminopenicillins, cephalosporins, clindamycin, calcium channel blockers.\n\nAGEP is rare (1-5/million) and the pustules start in the face and intertriginous areas, spreading to trunk and extremities. Management: discontinue offending drug and systemic corticosteroids."
    difficulty: medium
    tags: [AGEP, pustular drug reaction, aminopenicillins, sterile pustules, drug reaction]
  - front: "What are the most common causative drugs for SJS/TEN and which HLA types confer risk?"
    back: "Common drugs: allopurinol, anti-epileptics (carbamazepine, phenobarbital, phenytoin, lamotrigine), sulfonamides, NSAIDs, cephalosporins, immune checkpoint inhibitors. HLA-B1502 (carbamazepine, especially East Asians); HLA-B5801 (allopurinol, Asian and White populations).\n\nDrugs are responsible for 50% of SJS and 80% of TEN cases. Viral and mycoplasma infections account for some SJS cases. Risk factors include SLE, HIV/AIDS."
    difficulty: medium
    tags: [SJS, TEN, allopurinol, carbamazepine, HLA-B1502, HLA-B5801, drug reaction]
  - front: "What is Fixed Drug Eruption and what drugs commonly cause it?"
    back: "Sharply demarcated erythematous oval patches on skin or mucous membranes that recur in the SAME location upon re-exposure. Common sites: face, mucosa, genitalia, acral. Common agents: antimicrobials (tetracycline, sulfonamides), anti-inflammatories, barbiturates, phenolphthalein.\n\nThe 'fixed' location upon re-challenge is the defining feature. Management involves discontinuing the drug, prednisone 1 mg/kg/day for 2 weeks for generalized lesions, and potent topical corticosteroids for non-eroded lesions."
    difficulty: easy
    tags: [fixed drug eruption, drug reaction, tetracycline, sulfonamides, recurrence]
  - front: "What is the difference between a phototoxic and photoallergic drug reaction?"
    back: "Phototoxic: 'exaggerated sunburn' (erythema, edema, vesicles, bullae) confined ONLY to sun-exposed areas; direct tissue injury mechanism. Photoallergic: pruritic eczematous eruption with papules, vesicles, scaling that may SPREAD beyond sun-exposed areas; type IV delayed hypersensitivity.\n\nCommon causative agents: chlorpromazine, doxycycline, thiazide diuretics, procainamide. Management: sun protection and topical/oral corticosteroids."
    difficulty: medium
    tags: [phototoxic, photoallergic, drug reaction, doxycycline, thiazides, chlorpromazine]
  - front: "A 70-year-old patient on allopurinol for gout develops erosions of the oral mucosa, conjunctiva, and urogenital area, with flaccid bullae covering 35% of BSA and positive Nikolsky sign 2 weeks after starting therapy. What is the diagnosis and appropriate disposition?"
    back: "Toxic Epidermal Necrolysis (TEN) — BSA >30%. Disposition: immediate discontinuation of allopurinol and admission to intensive care/burn unit. Supportive care: IV fluids, electrolytes, nutrition, wound care. Consider cyclosporine (best evidence for survival benefit).\n\nAllopurinol is one of the most common causes of TEN, particularly in patients with HLA-B5801 (Asian and White populations). SCORTEN score should be calculated at admission to predict mortality. Mortality in TEN is approximately 30%."
    difficulty: hard
    tags: [TEN, allopurinol, toxic epidermal necrolysis, HLA-B5801, burn unit, Nikolsky sign, SCORTEN]
  - front: "What drugs can exacerbate acne?"
    back: "Systemic: lithium, phenytoin, steroids, halogens, androgens, iodides, bromides, danazol. Topical: TCS (topical corticosteroids), tars, ointments, oily cosmetics. Mechanical: pressure or occlusion (leaning face on hands). Emotional stress is also an aggravating factor.\n\nDrug-induced acne should be considered especially when acne develops or worsens after starting a new medication. Unlike acne vulgaris, drug-induced acne often lacks comedones and may appear at unusual ages."
    difficulty: medium
    tags: [dermatology, acne, drug-induced, lithium, steroids]
  - front: "What drug interaction causes pseudotumour cerebri in acne treatment, and which two drug classes are involved?"
    back: "Concurrent use of isotretinoin (a systemic retinoid) AND tetracycline-class antibiotics (e.g., doxycycline, tetracycline) both independently and together increase the risk of pseudotumour cerebri (benign intracranial hypertension). This combination should be avoided.\n\nBoth isotretinoin and tetracyclines can independently raise intracranial pressure; when combined, the risk is significantly increased. Patients should be warned about symptoms such as headache and visual disturbances."
    difficulty: medium
    tags: [isotretinoin, tetracycline, pseudotumour cerebri, drug interaction, acne]
  - front: "What are the local and systemic side effects of topical corticosteroids?"
    back: "Local: skin atrophy, perioral dermatitis, steroid acne, rosacea, contact dermatitis, tachyphylaxis, telangiectasia, striae, hypertrichosis, hypopigmentation. Systemic (rare with significant absorption): HPA axis suppression, hyperglycemia, fluid/sodium retention, mood changes, weight gain.\n\nThe risk of systemic side effects from topical steroids is rare under normal clinical use, but can occur with very potent preparations over large body surface areas, especially under occlusion. Infants and thin-skinned sites are most vulnerable."
    difficulty: medium
    tags: [topical steroids, side effects, skin atrophy, HPA axis]
  - front: "What is the maximum dose of lidocaine for local anesthesia in laceration repair?"
    back: "7 mg/kg WITH epinephrine; 5 mg/kg WITHOUT epinephrine.\n\nEpinephrine causes local vasoconstriction, which delays systemic absorption and allows higher safe doses. The mnemonic 'epi adds 2' (5 → 7 mg/kg) aids recall. Historically epinephrine was avoided in digits/ears/nose/penis due to ischemia risk, but evidence supporting this is limited for digits at low concentrations."
    difficulty: easy
    tags: [lidocaine, local anesthesia, laceration, pharmacology]
  - front: "What analgesics are used in acute extremity pain in the ED, and does opioid combination provide superior pain relief?"
    back: "Options: ibuprofen 400 mg + acetaminophen 1000 mg; oxycodone 5 mg + acetaminophen 325 mg; hydrocodone 5 mg + acetaminophen 300 mg; codeine 30 mg + acetaminophen 300 mg. Evidence: No statistically significant difference in pain reduction at 2 hours among single doses of these combinations (NEJM study, P=0.053).\n\nThis 2017 NEJM trial showed ibuprofen + acetaminophen was equally effective as opioid combinations for acute extremity pain in the ED, with approximately 4-point reduction in NRS. This supports using non-opioid analgesia as first-line for acute musculoskeletal pain, reducing opioid exposure."
    difficulty: easy
    tags: [analgesia, extremity pain, opioids, ibuprofen, acetaminophen]
  - front: "What are the ECG features of digitalis toxicity?"
    back: "Range of arrhythmias: bidirectional VT (pathognomonic), supraventricular tachycardia with slow ventricular response, frequent PVCs. Risk for AV blocks and ventricular irritability.\n\nDigoxin toxicity causes increased vagal tone (AV block) and increased automaticity (ventricular arrhythmias). Bidirectional VT (alternating QRS axis) is the pathognomonic pattern. Hypokalemia and hypomagnesemia worsen toxicity. Treatment: digoxin-specific antibody fragments (Digibind/DigiFab), correct electrolytes, avoid calcium."
    difficulty: medium
    tags: [digoxin toxicity, ECG, arrhythmia, bidirectional VT]
  - front: "What monitoring is recommended for patients on statin therapy?"
    back: "Liver enzymes: measured at baseline and once after therapy initiated; both if patient has jaundice, RUQ pain, or dark urine. Lipids: measured annually once stabilized. CK: at baseline and if patient complains of myalgia. Discontinue statin if CK >10x upper limit of normal or persistent myalgia.\n\nStatin-related myopathy is the most clinically significant adverse effect. Rhabdomyolysis (rare but serious) can occur. Risk increases with high-dose statins, drug interactions (CYP3A4 inhibitors), hypothyroidism, and renal impairment. Routine LFT monitoring is no longer mandatory during treatment in most guidelines."
    difficulty: easy
    tags: [statin monitoring, myopathy, CK, liver enzymes, adverse effects]
  - front: "What are the major adverse effects of the main antihyperglycemic drug classes for T2DM?"
    back: "SGLT2i: UTI, rare DKA, genital mycotic infections. GLP-1 agonists: GI side effects (nausea, vomiting). DPP-4 inhibitors: rare (generally well tolerated). Sulfonylureas: hypoglycemia, weight gain. Insulin: hypoglycemia, weight gain. Thiazolidinediones (TZDs): edema, heart failure, fractures, weight gain.\n\nSGLT2 inhibitors cause euglycemic DKA (must be held before surgery). GLP-1 agonists are contraindicated in personal/family history of medullary thyroid carcinoma or MEN2. TZDs are contraindicated in heart failure. Choice of agent must consider the patient's comorbidities and risk profile."
    difficulty: medium
    tags: [antihyperglycemic adverse effects, SGLT2i, GLP-1, thiazolidinedione, sulfonylurea]
  - front: "What drugs are known to induce diabetes mellitus?"
    back: "Glucocorticoids (steroid-induced diabetes), thyroid hormone, beta-adrenergic agonists, thiazides, phenytoin, and antipsychotics (second-generation).\n\nGlucocorticoids cause insulin resistance and increased hepatic gluconeogenesis — the most clinically significant cause. Steroid-induced hyperglycemia often peaks in the afternoon (matching steroid peak), so afternoon glucose monitoring is especially important. Antipsychotics (clozapine, olanzapine) cause weight gain and direct metabolic effects."
    difficulty: easy
    tags: [drug-induced diabetes, glucocorticoids, steroid diabetes, antipsychotics, thiazides]
  - front: "How does aging affect drug distribution for lipophilic vs. hydrophilic drugs?"
    back: "Increased total body fat → larger volume of distribution for lipophilic drugs (longer half-life, slower elimination). Decreased lean body mass and total body water → decreased volume of distribution for hydrophilic drugs (higher plasma concentration at same dose).\n\nThese pharmacokinetic changes explain why lipophilic drugs (e.g., benzodiazepines, antipsychotics) accumulate in older adults, and why hydrophilic drugs (e.g., aminoglycosides, digoxin) have higher peak concentrations. Dose adjustments are necessary."
    difficulty: medium
    tags: [pharmacokinetics, geriatrics, drug distribution, lipophilic, hydrophilic]
  - front: "How does aging affect drug protein binding, and what are the implications?"
    back: "Increased α₁-glycoprotein → increased binding of basic drugs. Decreased albumin → decreased binding of acidic drugs (more free drug → increased pharmacologic effect and potential toxicity at standard doses).\n\nMany drugs used in older adults are acidic (e.g., warfarin, NSAIDs, phenytoin). Hypoalbuminemia (common in older adults) increases free fraction of these drugs, increasing both efficacy and toxicity risk."
    difficulty: medium
    tags: [pharmacokinetics, geriatrics, protein binding, albumin]
  - front: "What is the approximate overall reduction in renal function with aging, and what are its pharmacokinetic implications?"
    back: "Overall reduction in renal function of 30–50% due to decreased renal blood flow, GFR, and tubular secretion. Implication: renally cleared drugs accumulate → lower doses may be therapeutic (e.g., digoxin, aminoglycosides, metformin, direct oral anticoagulants).\n\nRenal function decline with aging may not be reflected in serum creatinine due to decreased muscle mass. Using CrCl (Cockcroft-Gault) or eGFR equations that account for age and weight is essential for dosing in older adults."
    difficulty: easy
    tags: [pharmacokinetics, geriatrics, renal function, dose adjustment]
  - front: "Which drug classes have increased sensitivity in older adults, and which have decreased sensitivity?"
    back: "Increased sensitivity: warfarin, sedatives, antipsychotics, anticholinergics, digoxin, narcotics. Decreased sensitivity: β-blockers and β-adrenergic stimulants (though may have increased sensitivity in some cases).\n\nAge-related pharmacodynamic changes alter receptor responsiveness and homeostatic reserve. Increased sensitivity to CNS-active drugs contributes to falls, delirium, and cognitive impairment in older adults."
    difficulty: easy
    tags: [pharmacodynamics, geriatrics, drug sensitivity, warfarin, sedatives]
  - front: "What is a prescribing cascade, and what three questions should clinicians ask to identify one?"
    back: "A prescribing cascade occurs when an ADR is misinterpreted as a new medical condition, and a new drug is prescribed to treat the drug-induced event. Three questions: (1) Is the new drug being prescribed to address an ADR from a previously prescribed drug? (2) Is the initial drug really needed, especially if causing a cascade? (3) Do the benefits of the initial drug outweigh the harms?\n\nClassic example: NSAID → edema → diuretic → urinary incontinence → anticholinergic. Recognizing cascades reduces polypharmacy and ADRs in older adults."
    difficulty: medium
    tags: [prescribing cascade, polypharmacy, geriatrics, ADR, inappropriate prescribing]
  - front: "What is polypharmacy and how prevalent is it in Canadian older adults?"
    back: "Polypharmacy = prescription, administration, or use of more medications than are clinically indicated. In Canada, >60% of older adults report using ≥5 medications. Hospitalized older adults receive an average of 10 medications during admission.\n\nPolypharmacy increases risks of ADRs, drug interactions, non-adherence, and prescribing cascades. It is a major geriatric health concern."
    difficulty: easy
    tags: [polypharmacy, geriatrics, epidemiology, Canada]
  - front: "What are the intrinsic risk factors for adverse drug reactions in older adults?"
    back: "Comorbidities (>5), age >85, low BMI, age-related changes in pharmacokinetics and pharmacodynamics, CrCl <50 mL/min.\n\nThese intrinsic factors synergize with extrinsic factors (>9 medications, >12 doses/day, multiple prescribers, unreliable drug history, prior ADR) to dramatically increase ADR risk in frail older adults."
    difficulty: easy
    tags: [ADR, adverse drug reaction, geriatrics, polypharmacy, risk factors]
  - front: "What are the Beers Criteria and what drug classes are commonly listed?"
    back: "The Beers Criteria is a list of medications to avoid in adults ≥65 years due to safety concerns (last updated 2024). Commonly listed: long-acting benzodiazepines, strong anticholinergics, high-dose sedatives. Categories include: inappropriate in most older adults, avoid with certain conditions, use with caution, drug-drug interactions, and drugs requiring renal dose adjustment.\n\nThe Beers Criteria is one of the most widely used screening tools for inappropriate prescribing. It should be used alongside clinical judgment, as some listed medications may be appropriate in individual cases."
    difficulty: easy
    tags: [Beers Criteria, inappropriate prescribing, geriatrics, polypharmacy]
  - front: "What do STOPP and START stand for, and what population do they apply to?"
    back: "STOPP = Screening Tool of Older Person's Prescriptions (systems-based list of medications contraindicated in adults ≥65 years in context of their diagnoses). START = Screening Tool to Alert physicians to Right Treatment (systems-based list of medications indicated in adults ≥65 years in context of their diagnoses). Together they address both over- and under-prescribing.\n\nSTOPP/START is the European counterpart to the Beers Criteria. START addresses the fact that older adults are often under-treated with proven medications such as ACEIs, ASA, beta-blockers, thrombolytics, and oral anticoagulants."
    difficulty: easy
    tags: [STOPP, START, inappropriate prescribing, geriatrics, polypharmacy]
  - front: "Which drugs are most commonly listed as potentially inappropriate for older adults across prescribing criteria?"
    back: "Benzodiazepines (diazepam listed in all 14 criteria reviewed), NSAIDs, antihistamines, and antipsychotics. Amitriptyline was listed in 13/14 criteria, doxepin in 12/14.\n\nThese drug classes carry particular risks in older adults: benzodiazepines → falls/delirium; NSAIDs → GI bleed/renal failure; antihistamines → anticholinergic effects; antipsychotics → stroke risk and mortality in dementia patients."
    difficulty: easy
    tags: [inappropriate prescribing, geriatrics, Beers, STOPP, benzodiazepines, NSAIDs]
  - front: "What is an important note about docusate in the management of constipation in older adults?"
    back: "Docusate has been shown to be INEFFECTIVE for the prevention or treatment of constipation in older adults and should not be routinely used.\n\nDespite being widely prescribed, evidence does not support docusate (a stool softener) for constipation in older adults. More effective options include osmotic laxatives (PEG, lactulose) and stimulant laxatives (senna, bisacodyl) when indicated."
    difficulty: easy
    tags: [constipation, docusate, laxatives, geriatrics, polypharmacy]
  - front: "What are the mechanisms of the main laxative classes used in older adults?"
    back: "Bulk-forming: psyllium, bran – absorb water and increase stool mass. Osmotic: lactulose, PEG 3350 (polyethylene glycol) – retain water in colon. Stimulant: senna, bisacodyl – stimulate colonic motility and secretion.\n\nPEG 3350 (Lax-A-Day) is well-tolerated and effective for older adults. Lactulose can cause excess gas/cramping. Stimulant laxatives are appropriate short-term but should be used cautiously in the context of bowel obstruction or inflammatory bowel disease."
    difficulty: easy
    tags: [laxatives, constipation, geriatrics, pharmacology]
  - front: "A 70-year-old man is started on a calcium channel blocker for hypertension and develops ankle edema. His physician then starts furosemide. Two weeks later he develops urinary incontinence and is prescribed oxybutynin. What geriatric pharmacology concept does this illustrate?"
    back: "This is a prescribing cascade: calcium channel blocker → ankle edema (ADR misinterpreted as new condition) → furosemide → urinary urgency/incontinence → oxybutynin (anticholinergic, on Beers Criteria for older adults). The solution is to identify and stop the offending drug rather than adding more medications.\n\nOxybutynin is a strong anticholinergic and is listed on the Beers Criteria as inappropriate for older adults due to risk of cognitive impairment, delirium, falls, and urinary retention. The cascade should be unwound by removing the CCB."
    difficulty: hard
    tags: [prescribing cascade, polypharmacy, geriatrics, Beers Criteria, ADR, anticholinergic]
  - front: "What is the mechanism of action and key indications for elagolix (Orlissa) in gynecology?"
    back: "Elagolix is a synthetic GnRH antagonist that induces a reversible hypoestrogenic state. Indications: pelvic pain associated with endometriosis; emerging evidence for fibroids and adenomyosis. Dosing: 150 mg PO daily or 400 mg PO BID. Side effects: hot flushing, nausea, headache. Contraindicated in: pregnancy, osteoporosis, undiagnosed vaginal bleeding, severe hepatic dysfunction.\n\nUnlike GnRH agonists that cause an initial flare before down-regulation, GnRH antagonists (like elagolix) achieve immediate suppression of FSH and LH without a flare effect. Hypoestrogenism reduces endometriotic implant activity and pain. Use is limited by the side effects of menopause (bone density loss with prolonged use)."
    difficulty: medium
    tags: [elagolix, GnRH antagonist, endometriosis, pharmacology]
  - front: "What is the mechanism of action of clomiphene citrate, and what are its key indications and common side effects?"
    back: "Clomiphene citrate: selective estrogen receptor modulator (SERM) that blocks estrogen feedback at the hypothalamus/pituitary, increasing output of FSH and LH to induce ovulation. Indication: patients with persistent ovulatory dysfunction (e.g. amenorrhea, PCOS) who desire pregnancy. Dosing: 50 mg daily × 5 days (can increase to 100 or 150 mg). Common side effects: hot flashes, abdominal discomfort, exaggerated cyclic ovarian enlargement, accentuation of Mittelschmerz. Rare: ovarian hyperstimulation syndrome, multiple pregnancy, visual blurring, birth defects. Note: No longer commercially available in Canada but may be available via compounding pharmacy.\n\nClomiphene is an anti-estrogen that acts at the hypothalamic-pituitary axis to increase gonadotropin release, driving follicular development. Contraindicated in pregnancy, liver disease, hormone-dependent tumours, ovarian cysts, and undiagnosed vaginal bleeding."
    difficulty: medium
    tags: [clomiphene, ovulation induction, PCOS, infertility, pharmacology]
  - front: "What is the mechanism of action and key clinical applications of bromocriptine (Parlodel) in gynecology?"
    back: "Bromocriptine is a dopaminomimetic (D2 agonist, D1 antagonist) that acts directly on anterior pituitary cells to inhibit prolactin synthesis and release. Indications: galactorrhea + amenorrhea secondary to hyperprolactinemia; prolactin-dependent menstrual disorders and infertility; prolactin-secreting adenomas (micro- and macroadenomas prior to surgery); IVF cycles. Dosing: start 1.25-2.5 mg PO at night with food; increase by 2.5 mg every 2-7 days; usual range 1.5-15 mg daily. Side effects: nausea/vomiting, headache, postural hypotension, somnolence.\n\nDopamine normally inhibits prolactin secretion from the anterior pituitary. Bromocriptine mimics this inhibitory effect. Contraindications include uncontrolled HTN, pregnancy-induced HTN, CAD, and breastfeeding. Drug interactions include domperidone, macrolides, and octreotide."
    difficulty: medium
    tags: [bromocriptine, hyperprolactinemia, galactorrhea, amenorrhea, pharmacology]
