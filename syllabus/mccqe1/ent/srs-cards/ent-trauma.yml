# Ent Trauma (ENT) - generated from srs-mccqe1
cards:
  - front: "Compare otic capsule-involving vs. otic capsule-sparing temporal bone fractures regarding hearing loss, CN VII involvement, and incidence."
    back: "Otic capsule-involving (10-20%): SNHL from direct cochlear injury, CN VII palsy in 50%, frontal/occipital trauma. Otic capsule-sparing (70-90%): CHL from ossicular injury, CN VII palsy in 10-20%, lateral skull trauma. Otic capsule-sparing is more common.\n\nTemporal bone fractures are traditionally described as transverse or longitudinal relative to the petrous long axis, but most are mixed. Otic capsule-involving fractures are severe and carry a high rate of profound SNHL and facial nerve injury. Otic capsule-sparing fractures may present with hemotympanum, TM perforation, and step formation in the EAC. Battle's sign (mastoid ecchymosis) and raccoon eyes (periorbital ecchymosis) are signs of basilar skull fracture."
    difficulty: hard
    tags: [otolaryngology, temporal bone fracture, otic capsule, SNHL, CN VII, basilar skull fracture]
  - front: "What are the surgical indications for exploring temporal bone fractures?"
    back: "CN VII palsy (immediate and complete), gunshot wound, depressed fracture of external auditory meatus, early meningitis (mastoidectomy), bleeding intracranially from sinus, and CSF otorrhea (may resolve spontaneously but may require surgery).\n\nImmediate and complete CN VII palsy suggests direct nerve transection and warrants early exploration. Delayed or incomplete facial palsy may be managed conservatively as it suggests neuropraxia with potential for recovery. Prevention of otogenic meningitis is the primary medical management goal. Facial nerve anastomosis, interpositional grafts, or anastomosis to other motor nerves may be needed for reanimation."
    difficulty: hard
    tags: [otolaryngology, temporal bone fracture, CN VII, surgical indications, meningitis]
