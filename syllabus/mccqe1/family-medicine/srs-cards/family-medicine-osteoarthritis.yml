# Family Medicine Osteoarthritis (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the hallmark clinical and radiographic features of osteoarthritis?"
    back: "Clinical: joint pain with activity (improved with rest), morning stiffness/gelling <30 min, deformity, bony enlargement, crepitus, limited range of motion, periarticular muscle atrophy.\nCommon sites: DIP, PIP, 1st CMC joints of hand; hip; knee; 1st MTP; L4-L5/L5-S1; C-spine.\nRadiographic (hallmark): joint space narrowing, subchondral sclerosis, subchondral cysts, osteophytes.\nNote: no laboratory tests diagnose OA.\n\nAlmost everyone >65 years shows OA changes on X-ray, but only 33% are symptomatic — radiographic severity does not correlate well with symptoms. The absence of inflammation distinguishes OA from RA (no elevated ESR/CRP, no systemic features)."
    difficulty: easy
    tags: [osteoarthritis, clinical-features, radiology, rheumatology, family-medicine]
  - front: "What is the stepwise pharmacological management of osteoarthritis?"
    back: "1st line: Acetaminophen up to 4 g/day (OA is NOT an inflammatory disorder)\n2nd line: NSAIDs (COX-2 selective preferred) in low doses for short durations\n3rd line: Duloxetine, combination analgesics (acetaminophen + codeine)\nAdjuncts: Intra-articular corticosteroid or hyaluronic acid injections; topical NSAIDs (diclofenac); capsaicin cream; oral glucosamine (inconclusive evidence)\nNote: medications do NOT alter the natural course of OA.\n\nAcetaminophen is preferred first-line due to its safety profile. COX-2 selective NSAIDs reduce GI risk compared to non-selective NSAIDs but carry cardiovascular risk. Surgery (total joint arthroplasty) is reserved for persistent pain and functional impairment despite optimal pharmacotherapy."
    difficulty: medium
    tags: [osteoarthritis, pharmacotherapy, NSAIDs, acetaminophen, family-medicine]
  - front: "What is the epidemiology of osteoarthritis and who is most affected?"
    back: "Most common form of arthritis in primary care. Prevalence: 10–12%, increases with age. Results in long-term disability in 2–3% of patients with OA. Almost everyone >65 years shows OA signs on X-ray, but only 33% of these are symptomatic.\n\nOA is primarily a disease of aging and mechanical wear, but genetic, metabolic, and biomechanical factors also contribute. Risk factors include obesity (knee OA), joint injury, repetitive occupational joint use, and female sex (post-menopause)."
    difficulty: easy
    tags: [osteoarthritis, epidemiology, family-medicine]
