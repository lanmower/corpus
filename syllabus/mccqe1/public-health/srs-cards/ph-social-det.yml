  - front: "What are the key features of intimate partner violence (IPV) that should prompt suspicion in the ED?"
    back: "Suggestive injuries (bruises, sprains, abrasions, fractures, burns inconsistent with history), somatic symptoms (chronic vague complaints), psychosocial symptoms, clinician impression (overbearing partner who won't leave patient's side). Women are usually victims but male victimization also occurs.\n\nIPV affects approximately 1 in 3 women in Canada. A high index of suspicion is needed as victims rarely disclose voluntarily. Physicians should assess danger (risk of escalating violence), create a safety plan, and document findings. Patient must consent to follow-up investigation/reporting unless patient is <16 years old. Child protection services should be notified if children are at risk."
    difficulty: medium
    tags: [intimate partner violence, IPV, domestic violence, screening]
