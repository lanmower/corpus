# Perioperative Care (Surgery) - generated from srs-mccqe1
cards:
  - front: "What preoperative cardiac risk assessment is done for non-cardiac surgery?"
    back: "Revised Cardiac Risk Index (RCRI): ischemic heart disease, congestive HF, cerebrovascular disease, diabetes on insulin, creatinine >177 μmol/L, high-risk surgery — 1 point each; RCRI ≥3 = major cardiac risk\n\nCCS perioperative guidelines recommend RCRI calculation for all patients undergoing non-cardiac surgery. RCRI ≥3 → consider preoperative stress testing. Decision to test based on whether result would change management. Biomarker testing (troponin, BNP) adds prognostic information."
    difficulty: medium
    tags: [preoperative assessment, RCRI, cardiac risk, non-cardiac surgery, surgery]
  - front: "When should antithrombotic medications be held before elective surgery?"
    back: "Warfarin: hold 5 days pre-op; DOACs (apixaban, rivaroxaban): hold 24-48h (48-96h if high bleeding risk or CrCl <50 mL/min); ASA: continue unless high bleeding risk surgery (neurosurgery, intracranial, spinal); clopidogrel: hold 5-7 days\n\nCCS perioperative antithrombotic guidelines balance thrombotic vs. bleeding risk. High VTE/thrombotic risk patients (mechanical valve, recent VTE, AF with prior stroke) may need bridging with LMWH. Recent PCI (within 6 months): consult cardiology."
    difficulty: hard
    tags: [perioperative anticoagulation, warfarin, DOAC, antithrombotic, surgery]
  - front: "What is VTE prophylaxis in surgical patients?"
    back: "Low-risk (minor procedure, ambulatory): early mobilization; Moderate-risk: LMWH or unfractionated heparin; High-risk (hip/knee arthroplasty, oncology surgery): LMWH or DOACs (rivaroxaban for THA/TKA); mechanical: compression stockings + IPC\n\nCCS guidelines and Thrombosis Canada recommend pharmacological VTE prophylaxis for most surgical patients ≥40 years. Duration: general surgery 7-10 days; cancer surgery 28 days; major orthopedic surgery 35 days (DOACs preferred post-THA/TKA per CCS/ACCP)."
    difficulty: medium
    tags: [VTE prophylaxis, LMWH, perioperative, thromboprophylaxis, surgery]
  - front: "What is the significance of perioperative beta-blockade?"
    back: "Continue beta-blockers if patient is already on them; do NOT start beta-blockers de novo in the perioperative period for high RCRI alone (POISE trial: reduced MI but increased stroke and death)\n\nPOISE trial showed initiating high-dose metoprolol on day of surgery increased 30-day mortality and stroke despite reducing MI. CCS guidelines: continue chronic beta-blockers, do not initiate unless patient is on them already or has compelling indication (rate control)."
    difficulty: hard
    tags: [perioperative beta-blockers, POISE trial, cardiac protection, surgery]
  - front: "What is the approach to fasting before elective surgery?"
    back: "Clear fluids: up to 2 hours before; solids and milk: 6 hours before (or 4h for light meal); NPO for emergency surgery\n\nASA and Canadian Anesthesiologists Society fasting guidelines: 2-4-6 rule. Prolonged fasting is not necessary for clear fluids and may worsen dehydration, anxiety, and hemodynamics. Preoperative carbohydrate loading (CHO drink 2h pre-op) in ERAS protocols reduces insulin resistance."
    difficulty: easy
    tags: [preoperative fasting, NPO, anesthesia, ERAS, surgery]
  - front: "What are the components of an Enhanced Recovery After Surgery (ERAS) protocol?"
    back: "Pre-op: carbohydrate loading, counseling; Intra-op: goal-directed fluid therapy, minimally invasive surgery, opioid-sparing analgesia, hypothermia prevention; Post-op: early oral feeding, early mobilization, multimodal analgesia, VTE prophylaxis\n\nERAS protocols reduce length of stay by 2-3 days, complications, and costs without compromising outcomes. Originally developed for colorectal surgery, now applied to many specialties. Core elements: minimal opioids, early feeding, early ambulation, and standardized perioperative care."
    difficulty: easy
    tags: [ERAS, enhanced recovery, perioperative care, length of stay, surgery]
  - front: "How is a patient's surgical risk classified per American Society of Anesthesiologists (ASA) classification?"
    back: "ASA I: healthy; ASA II: mild systemic disease; ASA III: severe systemic disease; ASA IV: severe systemic disease that is a constant threat to life; ASA V: moribund, not expected to survive without surgery; ASA VI: brain dead\n\nASA classification correlates with perioperative mortality. ASA III-IV patients require thorough preoperative optimization and monitoring. ASA IV-V patients should have goals of care discussion. Emergency suffix (E) added for emergency procedures."
    difficulty: easy
    tags: [ASA classification, surgical risk, perioperative, anesthesia, surgery]
  - front: "What are the principles of perioperative management of diabetic patients?"
    back: "Hold oral hypoglycemics (metformin 48h before, SGLT2i 3-4 days before); continue insulin (reduce to 50-80% of basal dose while NPO); monitor glucose q1-2h; target glucose 5-10 mmol/L intraoperatively\n\nSGLT2 inhibitors must be stopped before surgery to prevent euglycemic DKA. Metformin held due to lactic acidosis risk if AKI develops. Insulin-dependent patients should not have their basal insulin completely stopped. CDA/Diabetes Canada perioperative guidelines."
    difficulty: medium
    tags: [perioperative diabetes, SGLT2i, metformin, insulin management, surgery]
  - front: "What is the approach to managing antiplatelet therapy in a patient with coronary stents requiring elective surgery?"
    back: "BMS: defer elective surgery ≥1 month (ideally 3 months); DES: defer elective surgery ≥6 months (ideally 12 months); if surgery cannot be deferred: continue ASA, hold only clopidogrel with cardiology consultation\n\nCCS perioperative guidelines recommend that surgery should ideally be deferred until dual antiplatelet therapy can be discontinued safely. If emergent surgery required: continue ASA, restart antiplatelet ASAP post-op. Risk of stent thrombosis vs. perioperative hemorrhage must be balanced."
    difficulty: hard
    tags: [coronary stent, perioperative antiplatelet, DES, BMS, surgery]
  - front: "What are the criteria for discontinuing a perioperative blood transfusion trigger in surgical patients?"
    back: "Restrictive transfusion: target Hgb 70-80 g/L (transfuse when Hgb <70) for most surgical patients; Hgb <80 for high-risk cardiac patients; pre-op autologous donation, intraoperative cell salvage to reduce allogeneic transfusion\n\nTRICC, FOCUS, and TRICS trials support restrictive transfusion strategy. Restrictive strategy non-inferior to liberal strategy for most patients. Pre-operative anemia management (IV iron, ESA) should be optimized before elective surgery to minimize transfusion requirement."
    difficulty: medium
    tags: [blood transfusion, transfusion trigger, restrictive strategy, perioperative, surgery]
  - front: "A 65-year-old man undergoes elective CABG. He has a history of prior carotid endarterectomy (asymptomatic 80% right ICA stenosis was treated). During cardiopulmonary bypass (CPB), the perfusionist reports a fall in cerebral oximetry (NIRS) from 68 to 54 bilaterally. What is the most likely cause and appropriate response?\n\nA) Embolic stroke — immediately discontinue CPB and proceed to CT head\nB) Global cerebral hypoperfusion — increase CPB flow rate and MAP to 70–80 mmHg\nC) Air embolism into cerebral vasculature — Trendelenburg position and increase FiO2\nD) Cerebral vasospasm — calcium channel blocker infusion"
    back: "B) Global cerebral hypoperfusion — increase CPB flow rate and MAP to 70–80 mmHg\n\nCerebral oximetry (NIRS) monitoring during CPB detects bilateral desaturation as a surrogate for cerebral ischemia. Bilateral symmetric desaturation in context of CPB is most consistent with global cerebral hypoperfusion (inadequate CPB flow, MAP too low — especially in a patient with prior carotid disease). Management: increase CPB flow rate, increase MAP (target 70–80 mmHg during CPB, especially in patients with cerebrovascular disease), ensure adequate oxygen carrying capacity (check Hct on CPB). Unilateral NIRS desaturation suggests embolic or carotid-related problem. The NIRS-guided strategy reduces stroke and neurocognitive outcomes in cardiac surgery."
    difficulty: hard
    tags: [Cardiac Surgery, MCQ, Toronto Notes]
  - front: "A 70-year-old man undergoes mechanical aortic valve replacement. He is anticoagulated with warfarin post-operatively. On day 7, his INR is 1.4 (target 2.5–3.5). He is on heparin bridging. Which prosthetic mechanical valve in the aortic position carries the LOWEST thromboembolism risk and allows the lowest INR target?\n\nA) Starr-Edwards ball-cage valve — INR target 3.0–4.5\nB) St. Jude Medical bileaflet mechanical valve — INR target 2.0–3.0\nC) Medtronic Hall tilting-disc valve — INR target 2.5–3.5\nD) On-X bileaflet valve — INR target 1.5–2.0 after 3 months"
    back: "D) On-X bileaflet valve — INR target 1.5–2.0 after 3 months\n\nThe On-X bileaflet carbon mechanical valve has been shown in the PROACT trial to allow safe reduction of INR target to 1.5–2.0 in the aortic position (with aspirin) after 3 months of full anticoagulation, due to its superior hemodynamics and reduced turbulence profile. This is unique among mechanical valves and has FDA approval for the reduced INR target. All other mechanical valves in the aortic position require INR 2.0–3.0 (minimum), with mitral position requiring 2.5–3.5. The Starr-Edwards valve (historical) required INR 3.0–4.5 due to very high thrombogenicity. This is a key pharmacological distinction in cardiac surgery."
    difficulty: hard
    tags: [Cardiac Surgery, MCQ, Toronto Notes]
  - front: "During cardiopulmonary bypass for CABG, the patient develops diffuse ST elevation, elevated pump pressures, and air in the aortic root visible on TEE. What is the most likely cause and management?\n\nA) Coronary ostial cannulation injury — remove cannula and proceed off-pump\nB) Massive coronary air embolism — head-down (Trendelenburg) position, increase perfusion pressure, aspirate air from aorta, fine coronary irrigation\nC) Aortic dissection from aortic cannulation — immediately convert to femoral cannulation\nD) Ventricular fibrillation from hypothermia — increase CPB temperature and defibrillate"
    back: "B) Massive coronary air embolism — head-down (Trendelenburg) position, increase perfusion pressure, aspirate air from aorta, fine coronary irrigation\n\nCoronary air embolism during CPB is a recognized complication causing diffuse coronary obstruction, ST changes, and hemodynamic collapse. Management protocol: (1) Trendelenburg/left lateral decubitus position to trap air away from coronary ostia; (2) Maintain high CPB perfusion pressure (> 80 mmHg) to force air bubbles distally through the vasculature; (3) Aspirate visible air from the aortic root via existing aortic vent; (4) Coronary sinus retrograde cardioplegia to flush air; (5) Prolonged CPB support while air resorbs. Hyperbaric oxygen is an adjunct post-procedure. The right coronary is most vulnerable (ostium faces upward — air floats)."
    difficulty: hard
    tags: [Cardiac Surgery, MCQ, Toronto Notes]
  - front: "A 68-year-old woman undergoes re-do mitral valve replacement (third operation). Three days post-op, she develops oliguria (UO 15 mL/hr), rising creatinine (2.8), hypotension (MAP 58), and metabolic acidosis. PA catheter shows: CO 2.4 L/min, CI 1.3 L/min/m², SVR 2100 dyn·s·cm⁻⁵, PCWP 22 mmHg. She is on vasopressin and norepinephrine. What additional intervention is MOST likely to improve her cardiac output?\n\nA) Increase norepinephrine — higher SVR will improve coronary perfusion pressure\nB) Add low-dose dobutamine — improves inotropy without increasing SVR further\nC) Add milrinone — PDE3 inhibitor reduces SVR and improves contractility\nD) Urgent IABP or Impella — mechanical circulatory support for low-output state"
    back: "D) Urgent IABP or Impella — mechanical circulatory support for low-output state\n\nThis is post-cardiac surgery low-output syndrome (LCOS): CI < 2.0, high SVR, elevated filling pressures. After maximal inotrope optimization, if LCOS persists, mechanical circulatory support is appropriate. IABP reduces afterload and augments diastolic coronary perfusion — particularly effective post-cardiac surgery. Impella CP provides more robust output support. Adding milrinone further reduces SVR (already on vasopressin) which may worsen hypotension. Increasing norepinephrine raises SVR further, increasing LV afterload which is already impaired (CI 1.3). Mechanical support is the appropriate escalation in post-cardiotomy LCOS refractory to pharmacotherapy."
    difficulty: hard
    tags: [Cardiac Surgery, MCQ, Toronto Notes]
  - front: "A 54-year-old man undergoes off-pump CABG (OPCAB). His LIMA is grafted to the LAD and SVG to the circumflex and RCA. Three months later, angiography for recurrent angina shows: LIMA-LAD patent, SVG-circumflex 100% occluded at 3 months, SVG-RCA 70% stenosis. What is the most likely mechanism for the early SVG failure?\n\nA) Intimal hyperplasia — the dominant mechanism of SVG failure in the first year\nB) Atherosclerosis within the graft — same risk factors as native coronary disease\nC) Early thrombotic occlusion due to inadequate antiplatelet therapy\nD) Vasospasm of the SVG causing functional occlusion"
    back: "A) Intimal hyperplasia — the dominant mechanism of SVG failure in the first year\n\nSVG failure occurs in distinct time-dependent phases: (1) Early (< 1 month): thrombosis — platelet-mediated; prevented by aspirin (started within 6 hours of OPCAB); (2) 1–12 months: intimal hyperplasia — smooth muscle cell proliferation and migration stimulated by surgical trauma and compliance mismatch — the dominant cause of SVG failure in the first year (3-month occlusion is classic intimal hyperplasia); (3) Long-term (> 5 years): accelerated atherosclerosis — similar to native CAD, prevented by statins. This 3-month SVG occlusion = intimal hyperplasia. Adding P2Y12 inhibitor to aspirin may reduce intimal hyperplasia (DACAB trial: ticagrelor + aspirin improves early SVG patency)."
    difficulty: hard
    tags: [Cardiac Surgery, MCQ, Toronto Notes]
  - front: "A 45-year-old woman with rheumatic MS (MVA 0.9 cm²) is referred for mitral valve surgery. Wilkins score is 11. She has severe pulmonary hypertension (PASP 72 mmHg) and a permanent pacemaker for complete heart block. She is NYHA class III. What is the most appropriate surgical procedure?\n\nA) Commissurotomy + debridement — preserves native valve\nB) Mitral valve repair — superior to replacement for any mitral pathology\nC) Mitral valve replacement with bioprosthesis — avoid anticoagulation given pacemaker leads\nD) Mitral valve replacement with mechanical prosthesis + pacemaker lead extraction and upgrade"
    back: "D) Mitral valve replacement with mechanical prosthesis + pacemaker lead extraction and upgrade\n\nWilkins score > 8 indicates anatomy unfavorable for PMBV (high calcium, severe subvalvular disease, leaflet thickening — poor commissurotomy result). Surgical MVR is indicated. Prosthesis choice: In a 45-year-old with rheumatic disease, mechanical prosthesis is standard (durability — avoids redo surgery in 15 years). The pacemaker leads traversing the TV and tricuspid annulus region become entrapped post-MVR — transvenous pacing leads create a conduit for infection and thrombosis around a new mechanical valve. Upgrade to epicardial pacing leads (via thoracotomy during MVR) is the standard approach when concomitant permanent pacing is required with MVR. Anticoagulation for the mechanical valve also covers the pacing system."
    difficulty: hard
    tags: [Cardiac Surgery, MCQ, Toronto Notes]
  - front: "What is ASA physical status classification?"
    back: "I: healthy. II: mild systemic disease. III: severe systemic disease. IV: constant threat to life. V: moribund. VI: brain dead\n\nASA III+ associated with higher perioperative complications. Guides anesthesia risk stratification and informed consent."
    difficulty: easy
    tags: [ASA, perioperative]
  - front: "What is perioperative VTE prophylaxis for major surgery?"
    back: "LMWH (enoxaparin 40mg SC daily) or UFH 5000U SC q8-12h starting preop or within 12h postop. Extend to 28 days for cancer/major abdominal surgery\n\nAdd mechanical prophylaxis (TED stockings, IPC). Higher risk: cancer, prior VTE, immobility. Caprini score stratifies VTE risk."
    difficulty: medium
    tags: [VTE, prophylaxis, periop]
  - front: "What is the ASA Physical Status classification?"
    back: "ASA I: healthy. ASA II: mild systemic disease (e.g., controlled HTN, BMI 30-40, smoker). ASA III: severe systemic disease (e.g., poorly controlled DM, COPD, BMI >=40, active hepatitis, EF 20-40%). ASA IV: severe life-threatening disease (e.g., recent MI <3 months, sepsis, DIC). ASA V: moribund. ASA VI: brain-dead organ donor.\n\nASA classification is the most widely used preoperative risk stratification tool. It predicts perioperative mortality and complications. Canadian anesthesia guidelines use ASA class to guide monitoring requirements and postoperative disposition."
    difficulty: medium
    tags: [ASA classification, preoperative assessment, perioperative, surgery]
  - front: "What is the Revised Cardiac Risk Index (RCRI) and how does it guide preoperative cardiac evaluation?"
    back: "RCRI (Lee index): 6 factors each scoring 1 point: high-risk surgery, history of IHD, history of CHF, history of cerebrovascular disease, insulin-dependent DM, creatinine >177 umol/L. Score 0: 0.4% risk of MACE. 1: 0.9%. 2: 6.6%. >=3: 11% MACE risk.\n\nRCRI guides whether additional cardiac testing is needed per CCS perioperative guidelines. Patients with RCRI >=1 having elevated-risk surgery should have NT-proBNP measured. If elevated, cardiac risk assessment and potentially further testing or management optimization."
    difficulty: hard
    tags: [RCRI, cardiac risk, preoperative, perioperative, surgery]
  - front: "What are the current guidelines for perioperative VTE prophylaxis?"
    back: "Low risk (minor surgery, mobile): early ambulation. Moderate risk (most general surgery): LMWH (enoxaparin 40mg SC daily) or UFH 5000U SC BID-TID. High risk (major orthopedic, cancer surgery): LMWH + mechanical prophylaxis (IPC). Duration: until fully mobile, or 28-35 days for hip/knee arthroplasty and cancer surgery.\n\nCanadian guidelines (Thrombosis Canada) recommend pharmacological VTE prophylaxis for most surgical inpatients. DOACs (rivaroxaban) are alternatives for orthopedic prophylaxis. Bleeding risk must be balanced against thrombotic risk using Caprini or Padua scores."
    difficulty: hard
    tags: [VTE prophylaxis, DVT prevention, enoxaparin, perioperative, surgery]
  - front: "How should anticoagulants and antiplatelets be managed perioperatively?"
    back: "Warfarin: stop 5 days pre-op, bridge with LMWH if high thrombotic risk (mechanical valve, recent VTE). DOACs: stop 1-2 days (renal-dependent for dabigatran, up to 4 days if CrCl <50). ASA: continue for most surgeries unless high bleeding risk. DAPT: defer elective surgery until completed (6-12 months post-stent); if urgent, continue ASA, hold P2Y12 inhibitor 5-7 days.\n\nCCS perioperative anticoagulation guidelines provide detailed bridging recommendations. High thrombotic risk patients (CHA2DS2-VASc >=7, mechanical mitral valve, VTE <3 months) warrant LMWH bridging. Most DOAC patients do not need bridging due to short half-lives."
    difficulty: hard
    tags: [anticoagulation, perioperative, bridging, DOAC, surgery]
  - front: "What preoperative investigations are indicated for healthy patients undergoing elective surgery?"
    back: "No routine preoperative testing for healthy patients (ASA I-II) undergoing low-risk surgery per Choosing Wisely Canada. Indicated tests based on clinical factors: ECG if cardiac risk factors, CBC if expected blood loss, Cr if nephrotoxic medications or renal disease, glucose if DM, coagulation if anticoagulant use or liver disease.\n\nChoosing Wisely Canada specifically recommends against routine preoperative tests (CBC, electrolytes, CXR, ECG) in healthy patients undergoing low-risk surgery. This reduces healthcare costs and avoids false-positive results leading to unnecessary investigations."
    difficulty: medium
    tags: [preoperative testing, Choosing Wisely, investigations, perioperative, surgery]
  - front: "What are the guidelines for perioperative management of diabetes?"
    back: "Day of surgery: hold oral hypoglycemics and non-insulin injectables. Type 1 DM: never discontinue basal insulin (reduce to 60-80% of usual dose). Type 2 on insulin: reduce basal by 50-75%. Target glucose 6-10 mmol/L intraoperatively. Hold metformin day of surgery (restart when eating and renal function normal). Hold SGLT2 inhibitors 3 days pre-op (DKA risk).\n\nCanadian Diabetes Association guidelines address perioperative glycemic management. SGLT2 inhibitor-associated euglycemic DKA is an increasingly recognized perioperative risk. Insulin infusion protocols are used for major surgeries. Hyperglycemia >10 mmol/L increases surgical site infection risk."
    difficulty: hard
    tags: [diabetes perioperative, insulin management, SGLT2, surgery]
  - front: "What is enhanced recovery after surgery (ERAS) and its key components?"
    back: "ERAS protocols include: preoperative-carbohydrate loading (clear fluids 2h pre-op), no routine bowel prep, multimodal analgesia planning. Intraoperative-goal-directed fluid therapy, normothermia, minimally invasive approach when possible. Postoperative-early oral intake, early mobilization, multimodal analgesia (minimize opioids), early catheter removal.\n\nERAS protocols reduce hospital stay by 2-3 days and reduce complications by 30-40%. Widely adopted in Canadian surgical centres, particularly for colorectal surgery. Key principle is reducing surgical stress response through evidence-based interventions at each phase."
    difficulty: medium
    tags: [ERAS, enhanced recovery, perioperative care, surgery]
  - front: "What is the WHO Surgical Safety Checklist and when are its phases performed?"
    back: "Three phases: (1) Sign-in (before induction): patient identity, procedure, consent, site marking, known allergies, airway assessment, blood loss risk. (2) Time-out (before incision): team introductions, confirm patient/procedure/site, antibiotic prophylaxis given, anticipated critical events. (3) Sign-out (before leaving OR): procedure name confirmed, instrument/sponge count, specimen labeling, equipment concerns, recovery plan.\n\nThe WHO Surgical Safety Checklist reduces surgical mortality by 47% and complications by 36% (Haynes et al). Mandatory in Canadian hospitals since adoption by CPSI. Based on aviation safety checklists. Non-compliance is a patient safety concern."
    difficulty: easy
    tags: [WHO Surgical Safety Checklist, patient safety, perioperative, surgery]
  - front: "How should perioperative antibiotic prophylaxis be administered?"
    back: "Within 60 minutes of incision (120 min for vancomycin/fluoroquinolones). Cefazolin 2g IV (3g if >120kg) is standard for most clean/clean-contaminated cases. Redose q3-4h if prolonged surgery. Discontinue within 24h post-op. Add metronidazole for colorectal. Vancomycin for MRSA risk or beta-lactam allergy.\n\nCanadian guidelines (Bugs & Drugs) and Surgical Care Improvement Project (SCIP) metrics define appropriate prophylaxis. Timely antibiotic administration is the single most effective measure to reduce SSI. Weight-based dosing is essential for optimal tissue concentrations."
    difficulty: medium
    tags: [antibiotic prophylaxis, surgical infection, cefazolin, perioperative, surgery]
  - front: "What are the risk factors and prevention strategies for postoperative complications?"
    back: "SSI: obesity, diabetes, smoking, prolonged surgery-prevention with antibiotics, normothermia, glucose control. Pneumonia: age, COPD, upper abdominal surgery-prevention with incentive spirometry, early mobilization. Delirium: age >65, cognitive impairment, polypharmacy-prevention with orientation, sleep hygiene, avoid benzodiazepines.\n\nPostoperative delirium occurs in 15-50% of elderly surgical patients and increases mortality, LOS, and institutionalization. Canadian Patient Safety Institute identifies SSI and VTE as key preventable surgical complications. Multimodal prehabilitation reduces complications."
    difficulty: hard
    tags: [postoperative complications, SSI prevention, delirium, perioperative, surgery]
  - front: "What are Light's criteria for pleural effusion?"
    back: "Exudate if ANY: pleural/serum protein >0.5, pleural/serum LDH >0.6, pleural LDH >2/3 upper limit of normal serum LDH. Otherwise transudate\n\nTransudate: CHF, cirrhosis, nephrotic. Exudate: infection, malignancy, PE, rheumatic. If borderline, serum-effusion albumin gradient >12g/L suggests transudate. Also send: cell count, glucose, pH, cytology, cultures."
    difficulty: medium
    tags: [pleural effusion, Lights criteria]
  - front: "What are the indications for central venous catheter placement, and what are the preferred sites?"
    back: "Indications: vasopressor administration, TPN, poor peripheral access, CVP monitoring, hemodialysis, transvenous pacing. Preferred sites: internal jugular (lowest infection risk with ultrasound), subclavian (lowest thrombosis risk), femoral (easiest landmark, highest infection risk).\n\nUltrasound-guided IJ placement is now the standard of care, reducing complication rates by >50% compared to landmark technique. Subclavian carries the highest risk of pneumothorax but lowest infection/thrombosis rates. Post-procedure chest X-ray is required to confirm position and rule out pneumothorax (except femoral lines)."
    difficulty: medium
    tags: [central line, CVC, internal jugular, ultrasound-guided, vascular access]
  - front: "What are the complications of central line insertion, and how is pneumothorax from subclavian line placement managed?"
    back: "Complications: pneumothorax, arterial puncture, air embolism, infection, thrombosis, arrhythmia, nerve injury. Small pneumothorax (<2 cm): observe with serial CXR. Large/symptomatic: chest tube or pigtail catheter insertion.\n\nArterial puncture is identified by pulsatile bright red blood and confirmed by blood gas analysis or transducing the line. Air embolism presents with sudden cardiovascular collapse and is managed by placing the patient in left lateral decubitus (Durant maneuver) and aspirating air. Bundle compliance (hand hygiene, full barrier precautions, chlorhexidine) reduces CLABSI rates."
    difficulty: medium
    tags: [central line complications, pneumothorax, CLABSI, arterial puncture, air embolism]
  - front: "What are the indications for chest tube insertion, and where is the 'triangle of safety' for placement?"
    back: "Indications: pneumothorax (tension, large, symptomatic), hemothorax, pleural effusion (large/symptomatic), empyema, post-thoracic surgery. Triangle of safety: bordered by lateral border of pectoralis major, lateral border of latissimus dorsi, line of the 5th intercostal space, and apex in the axilla.\n\nThe triangle of safety minimizes risk of injury to the internal mammary artery, long thoracic nerve, and abdominal organs. The tube is inserted just above the rib to avoid the neurovascular bundle running along the inferior rib border. For pneumothorax, the tube is directed apically; for effusion, posteriorly and basally."
    difficulty: medium
    tags: [chest tube, triangle of safety, pneumothorax, hemothorax, thoracostomy]
  - front: "What is the immediate management of tension pneumothorax?"
    back: "Needle decompression with a 14-16 gauge needle at the 2nd intercostal space, midclavicular line (or 4th-5th ICS anterior axillary line), followed by chest tube insertion.\n\nTension pneumothorax is a clinical diagnosis — do not wait for CXR. Classic findings include hypotension, tracheal deviation away from the affected side, absent breath sounds, and distended neck veins. It is a form of obstructive shock where positive pleural pressure impairs venous return to the heart."
    difficulty: medium
    tags: [tension pneumothorax, needle decompression, emergency procedure, obstructive shock]
  - front: "What are the indications, contraindications, and key landmarks for lumbar puncture?"
    back: "Indications: suspected meningitis, SAH (if CT negative), MS workup, normal pressure hydrocephalus, intrathecal medications. Contraindications: raised ICP with mass lesion, skin infection at site, coagulopathy, spinal epidural abscess. Landmark: L3-L4 or L4-L5 interspace (level of iliac crests = L4).\n\nCT head before LP is required if papilledema, focal neurologic deficits, altered LOC, immunocompromised state, or seizures are present. Do not delay antibiotics for LP in suspected meningitis. Normal opening pressure is 6-20 cmH2O; elevated opening pressure suggests meningitis, SAH, or idiopathic intracranial hypertension."
    difficulty: medium
    tags: [lumbar puncture, meningitis, opening pressure, contraindications, CSF analysis]
  - front: "How do you differentiate a diagnostic paracentesis result using the serum-ascites albumin gradient (SAAG)?"
    back: "SAAG ≥11 g/L: portal hypertension (cirrhosis, heart failure, Budd-Chiari). SAAG <11 g/L: non-portal hypertension (peritoneal carcinomatosis, TB peritonitis, nephrotic syndrome, pancreatitis).\n\nSAAG replaced the older transudate/exudate classification for ascites and has 97% accuracy for identifying portal hypertension. Spontaneous bacterial peritonitis (SBP) is diagnosed by ascitic fluid PMN count ≥250 cells/mm³ and is treated empirically with cefotaxime. Albumin infusion (1.5 g/kg day 1, 1 g/kg day 3) reduces mortality in SBP."
    difficulty: medium
    tags: [paracentesis, SAAG, portal hypertension, SBP, ascites]
  - front: "What are Light's criteria for differentiating exudative from transudative pleural effusions?"
    back: "Exudate if ANY of: (1) pleural fluid protein/serum protein >0.5, (2) pleural fluid LDH/serum LDH >0.6, (3) pleural fluid LDH >2/3 upper limit of normal serum LDH. All three must be absent for transudate.\n\nCommon transudates: CHF, cirrhosis, nephrotic syndrome. Common exudates: infection (pneumonia, TB, empyema), malignancy, PE, pancreatitis. Light's criteria misclassify ~25% of CHF effusions as exudative, especially after diuresis. In such cases, serum-effusion albumin gradient >12 g/L confirms transudate."
    difficulty: medium
    tags: [Lights criteria, thoracentesis, pleural effusion, exudate, transudate]
  - front: "How do you analyze joint aspiration fluid to differentiate septic arthritis, crystal arthropathy, and inflammatory arthritis?"
    back: "Normal: <200 WBC, clear. Non-inflammatory: 200-2000 WBC (OA). Inflammatory: 2000-50,000 WBC (RA, crystal). Septic: >50,000 WBC (often >100,000), >75% PMNs, positive Gram stain/culture. Gout: needle-shaped, negatively birefringent. Pseudogout: rhomboid, positively birefringent.\n\nSeptic arthritis is an emergency requiring IV antibiotics and joint washout. Crystal arthritis and septic arthritis can coexist, so crystals do not rule out infection. S. aureus is the most common organism in non-gonococcal septic arthritis; N. gonorrhoeae in sexually active young adults."
    difficulty: hard
    tags: [joint aspiration, synovial fluid, septic arthritis, gout, birefringence]
  - front: "What is the difficult airway algorithm, and when is a surgical airway (cricothyrotomy) indicated?"
    back: "Difficult airway: assess predictors (LEMON: Look, Evaluate 3-3-2, Mallampati, Obstruction, Neck mobility). If intubation fails after 3 attempts, proceed to supraglottic airway (LMA). If ventilation fails ('can't intubate, can't oxygenate'), perform cricothyrotomy.\n\nCricothyrotomy is the definitive rescue in a 'can't intubate, can't oxygenate' scenario. The membrane is located between the thyroid and cricoid cartilages. Video laryngoscopy has improved first-pass success rates and is now recommended as the primary intubation device in many algorithms."
    difficulty: hard
    tags: [difficult airway, cricothyrotomy, LEMON assessment, intubation, airway management]
  - front: "What are the indications for rapid sequence intubation (RSI), and what are the standard medications used?"
    back: "Indications: airway protection (GCS ≤8), respiratory failure, expected deterioration, procedural need. Standard RSI: preoxygenation, induction agent (propofol or ketamine) + neuromuscular blocker (succinylcholine or rocuronium), intubation without bag-mask ventilation.\n\nSuccinylcholine has rapid onset (45 sec) and short duration (6-10 min) but is contraindicated in hyperkalemia, burns >48h, crush injuries, and neuromuscular disease. Rocuronium (1.2 mg/kg) has similar onset but longer duration; sugammadex can reverse it. Ketamine is preferred in hemodynamically unstable patients due to sympathomimetic effects."
    difficulty: hard
    tags: [RSI, rapid sequence intubation, succinylcholine, rocuronium, ketamine]
  - front: "What are the components of the central line insertion bundle to prevent CLABSI?"
    back: "Hand hygiene, maximal sterile barrier precautions (cap, mask, gown, gloves, full drape), chlorhexidine skin antisepsis, optimal catheter site selection (avoid femoral if possible), daily review for line necessity and prompt removal.\n\nImplementation of the central line bundle has reduced CLABSI rates by up to 66% in ICU settings. Chlorhexidine is superior to povidone-iodine for skin preparation. Antibiotic-impregnated catheters may further reduce infection risk in high-risk patients. Daily assessment of line necessity is critical as infection risk increases with dwell time."
    difficulty: easy
    tags: [CLABSI prevention, central line bundle, infection control, hand hygiene, chlorhexidine]
  - front: "During a therapeutic paracentesis, how much fluid can be safely removed, and when is albumin replacement required?"
    back: "Large volume paracentesis (>5L) requires IV albumin infusion (6-8 g per liter removed) to prevent post-paracentesis circulatory dysfunction. Smaller volumes (<5L) generally do not require albumin replacement.\n\nPost-paracentesis circulatory dysfunction manifests as renal impairment, hyponatremia, and increased mortality. Albumin expands intravascular volume and prevents the hemodynamic shifts that occur with large fluid removal. The procedure is performed in the left or right lower quadrant, lateral to the rectus sheath, using ultrasound to mark the pocket."
    difficulty: medium
    tags: [paracentesis, large volume, albumin replacement, circulatory dysfunction, ascites]
  - front: "What is the significance of a pleural fluid pH <7.20 in the context of a parapneumonic effusion?"
    back: "A pleural fluid pH <7.20 indicates a complicated parapneumonic effusion or empyema that requires chest tube drainage. Additional drainage criteria: glucose <3.3 mmol/L, LDH >1000 IU/L, positive Gram stain/culture, or frank pus.\n\nUncomplicated parapneumonic effusions may resolve with antibiotics alone, but complicated effusions require drainage to prevent loculation and fibrothorax. If the effusion does not improve with tube drainage, intrapleural fibrinolytics (tPA + DNase) or surgical decortication (VATS) may be needed."
    difficulty: hard
    tags: [parapneumonic effusion, empyema, pleural pH, chest tube drainage, thoracentesis]
  - front: "What are the contraindications to lumbar puncture, and what CSF findings differentiate bacterial meningitis from viral meningitis?"
    back: "Contraindications: signs of raised ICP with mass effect, coagulopathy (INR >1.5, platelets <50,000), skin infection at site. Bacterial: high WBC (>1000, PMN predominant), low glucose (<2.2 mmol/L or CSF/serum <0.4), high protein (>1 g/L), positive Gram stain. Viral: moderate WBC (10-500, lymphocyte predominant), normal glucose, mildly elevated protein.\n\nCT before LP is indicated for immunocompromised patients, focal neurological deficits, papilledema, altered consciousness, or new seizures. Antibiotics should never be delayed for LP in suspected bacterial meningitis. TB meningitis shows lymphocytic pleocytosis, very low glucose, and very high protein with a subacute presentation."
    difficulty: medium
    tags: [lumbar puncture, CSF analysis, bacterial meningitis, viral meningitis, contraindications]
  - front: "What are the indications for emergent thoracotomy in trauma, and what is the role of the 'clam-shell' approach?"
    back: "Indications: penetrating thoracic trauma with loss of vital signs within 15 minutes (or blunt with loss within 5 minutes), cardiac tamponade, massive air embolism, uncontrollable thoracic hemorrhage. Clam-shell: bilateral anterolateral thoracotomy for access to both hemithoraces and the heart.\n\nResuscitative thoracotomy allows direct cardiac massage, aortic cross-clamping to redirect blood to the heart and brain, and repair of cardiac injuries. Survival is best for penetrating cardiac injuries with tamponade (~35%) and worst for blunt trauma (<2%). The procedure should be performed by a surgeon or trained emergency physician."
    difficulty: hard
    tags: [emergency thoracotomy, trauma, cardiac tamponade, resuscitative thoracotomy]
  - front: "What are the desired effects of muscle relaxation during anesthesia?"
    back: "1. Facilitate intubation, 2. Assist with mechanical ventilation, 3. Prevent muscle stretch reflex/decrease muscle tone, 4. Allow surgical field access for intracavity surgery\n\nThese effects optimize conditions for both airway management and surgical intervention."
    difficulty: easy
    tags: [anesthesia, muscle relaxation, indications, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is the main advantage of Sevoflurane for mask induction?"
    back: "Sevoflurane has low airway irritability and provides smooth inhalational induction, especially useful in pediatric anesthesia\n\nUnlike Desflurane, Sevoflurane does not provoke breath holding, laryngospasm, or excessive salivation during induction."
    difficulty: easy
    tags: [anesthesia, sevoflurane, induction, pediatric, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "Why is the block height increased in pregnant patients receiving neuraxial anesthesia?"
    back: "Engorged epidural veins from increased blood volume reduce epidural space volume, causing greater spread of local anesthetic\n\nThis anatomical change means smaller doses of local anesthetic are needed for equivalent block height in pregnant patients."
    difficulty: medium
    tags: [neuraxial anesthesia, epidural, pregnancy, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What interventions effectively prevent hypotension during spinal anesthesia for caesarean section?"
    back: "Crystalloids, colloids, ephedrine, phenylephrine, ondansetron, lower limb compression, positional changes (lying vs. walking)\n\nEvidence is low to moderate quality, but these interventions are standard practice to maintain maternal BP and fetal perfusion."
    difficulty: medium
    tags: [spinal anesthesia, hypotension prevention, caesarean section, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What is the relative contraindication for neuraxial anesthesia in pregnant patients?"
    back: "Thrombocytopenia\n\nThrombocytopenia increases risk of epidural/spinal hematoma, particularly with platelet counts below 100,000/μL."
    difficulty: easy
    tags: [neuraxial anesthesia, thrombocytopenia, contraindications, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What is the size threshold distinguishing petechiae from purpura?"
    back: "Petechiae: pinpoint extravasation <3mm, non-blanchable. Purpura: larger than petechiae\n\nBoth represent dermal blood extravasation but differ in size, which helps identify severity and cause of bleeding disorders."
    difficulty: easy
    tags: [dermatology, hemorrhagic lesions, clinical examination, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the first-line antiviral dosing for chickenpox in adults?"
    back: "Famciclovir 250 mg PO tid × 7-10 days\n\nAntivirals for varicella zoster include famciclovir 250mg tid or valacyclovir 1000mg bid. Treatment should begin within 24-72 hours of rash onset for maximum efficacy."
    difficulty: easy
    tags: [antivirals, chickenpox, famciclovir, valacyclovir, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the indication forfamciclovir in dermatology?"
    back: "Chickenpox (varicella): 250mg PO TID x7-10 days; genital herpes (first episode): 250mg PO BID x7-10 days; reduce dose in renal impairment\n\nFamciclovir is a guanosine analog antiviral effective against herpesviruses including VZV and HSV. Early treatment of varicella reduces complications."
    difficulty: easy
    tags: [famciclovir, herpes, chickenpox, antiviral, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the dosing of famciclovir for chickenpox in adults?"
    back: "250 mg PO three times daily for 7-10 days\n\nFamciclovir 250mg TID x7-10 days for chickenpox. Dose should be reduced in impaired renal function"
    difficulty: easy
    tags: [famciclovir, chickenpox, varicella, antiviral, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What specific findings on physical exam suggest cauda equina syndrome in a patient with back pain?"
    back: "Saddle anesthesia and bowel or bladder dysfunction\n\nCauda equina syndrome is a surgical emergency requiring immediate spine surgery consultation for decompression."
    difficulty: medium
    tags: [Emergency Medicine, Cauda Equina, Neurological Emergency, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the layers of the lateral abdominal wall from superficial to deep?"
    back: "1. Skin (epidermis, dermis, subcutaneous fat)\n2. Superficial fascia: Camper's fascia (fatty) and Scarpa's fascia (membranous)\n3. Muscles: external oblique, internal oblique, transversus abdominis\n4. Transversalis fascia\n5. Preperitoneal fat\n6. Peritoneum\n\nKnowledge of abdominal wall layers is essential for understanding hernias, surgical incisions, and wound complications. Each fascial layer has clinical relevance — e.g., Scarpa's fascia is continuous with Colles' fascia in the perineum, relevant in pelvic trauma. The transversalis fascia forms the posterior wall of the inguinal canal."
    difficulty: easy
    tags: [anatomy, abdominal wall, surgery, layers]
  - front: "What is the arcuate line, and how does it affect the rectus sheath composition?"
    back: "The arcuate line is located midway between the symphysis pubis and umbilicus.\n- Above arcuate line: anterior rectus sheath = external oblique aponeurosis + anterior leaf of internal oblique; posterior rectus sheath = posterior leaf of internal oblique + transversus abdominis aponeurosis.\n- Below arcuate line: aponeuroses of all three muscles (external oblique, internal oblique, transversus abdominis) pass ANTERIOR to rectus abdominis; there is no posterior rectus sheath (only transversalis fascia + peritoneum posteriorly).\n\nBelow the arcuate line, the posterior rectus sheath is absent, making the inferior rectus region relatively weak — a factor in lower abdominal hernias. This anatomy also affects the spread of rectus sheath hematomas, which are typically confined above the arcuate line."
    difficulty: medium
    tags: [anatomy, rectus sheath, arcuate line, abdominal wall]
  - front: "What is the arterial blood supply to the gallbladder?"
    back: "The cystic artery, which is a branch of the right hepatic artery.\n\nThe cystic artery arises from the right hepatic artery (itself a branch of the hepatic proper artery from the common hepatic artery from the celiac trunk). Anatomic variants are common and surgically important — the cystic artery may arise from the left hepatic, gastroduodenal, or directly from the hepatic proper artery."
    difficulty: easy
    tags: [anatomy, arterial supply, gallbladder, surgery]
  - front: "Which artery supplies the duodenum and pancreas?"
    back: "The pancreaticoduodenal arteries: the superior pancreaticoduodenal is a branch of the gastroduodenal artery (from celiac trunk), and the inferior pancreaticoduodenal is a branch of the superior mesenteric artery (SMA). These two vessels form an arcade between the celiac and SMA territories.\n\nThe dual blood supply of the duodenum/pancreas (from both the celiac and SMA) is clinically relevant in mesenteric ischemia — occlusion of one vessel may be compensated by collateral flow. The gastroduodenal artery is also the vessel most commonly eroded by a posterior duodenal ulcer, causing significant upper GI hemorrhage."
    difficulty: medium
    tags: [anatomy, arterial supply, duodenum, pancreas, SMA]
  - front: "What are the key preoperative investigations required before elective surgery?"
    back: "Selective testing based on clinical indication:\n- CBC, electrolytes, creatinine\n- INR/PTT\n- Group and screen or crossmatch (procedure-dependent)\n- CXR (PA and lateral): only if history of cardiac or pulmonary disease\n- ECG: if clinically indicated OR age >69 with no risk factors\n- β-hCG: ALL women of reproductive age\nNote (Choosing Wisely): For ambulatory/elective surgery, routine CBC, INR, PTT, and CXR should be AVOIDED in low-risk patients (ASA I or II) without systemic disease.\n\nRoutine preoperative testing is not evidence-based for low-risk patients. Only ASA class and surgical risk independently predict postoperative adverse effects. This reflects the Choosing Wisely Canada recommendations to reduce unnecessary preoperative testing, which adds cost without improving outcomes."
    difficulty: easy
    tags: [preoperative, investigations, surgery, Choosing Wisely, Canada]
  - front: "What medications should be withheld perioperatively?"
    back: "Medications to HOLD preoperatively:\n- Hypoglycemic agents (oral antidiabetics and insulin adjustments)\n- Diuretics\n- ACE inhibitors\n\nPatients with primary or secondary adrenal insufficiency (e.g., Addison's, chronic glucocorticoid use) require additional glucocorticoid STRESS DOSE COVERAGE perioperatively.\n\nAnticoagulants/antiplatelets: must be managed (e.g., bridging from warfarin to LMWH) to balance bleeding vs. thrombotic risk.\n\nACE inhibitors are held due to risk of refractory intraoperative hypotension. Diuretics are held to avoid volume depletion. Oral hypoglycemics and insulin require dose adjustment to prevent perioperative hypoglycemia. Adrenal insufficiency patients need stress doses to prevent addisonian crisis under surgical stress."
    difficulty: easy
    tags: [perioperative, medications, surgery, ACE inhibitors, adrenal insufficiency]
  - front: "What is the recommended prophylactic antibiotic regimen for contaminated abdominal surgery?"
    back: "Cefazolin (covers skin flora, gram-positive organisms) PLUS metronidazole (covers GI/anaerobic flora) for contaminated cases.\nAdministered immediately within 1 hour prior to incision.\n\nSurgical site infection (SSI) prophylaxis is most effective when antibiotics achieve adequate tissue levels at time of incision. Cefazolin alone is sufficient for clean procedures. Metronidazole is added for GI/colorectal surgery where anaerobic contamination is expected. Prolonged postoperative antibiotics do not reduce SSI rates and contribute to resistance."
    difficulty: easy
    tags: [prophylactic antibiotics, surgery, SSI, cefazolin, metronidazole]
  - front: "When is mechanical bowel preparation (MBP) indicated prior to colorectal surgery?"
    back: "MBP is indicated for: open or laparoscopic LOW ANTERIOR RESECTION (LAR) — rectal resection where anastomosis is at or below the sacral promontory — given with antibiotics.\n\nMBP is NOT routinely indicated for non-LAR elective colorectal surgery (evidence shows no impact on postoperative complications).\n\nBased on RCT evidence (14 RCTs, 5071 participants, 8 meta-analyses from U of T Best Practice in Surgery), routine MBP does not reduce anastomotic leak or SSI for most colorectal procedures. The exception is LAR/rectal anastomosis with transrectal stapling, where preoperative bowel cleansing (with a Fleet enema for left colon anastomoses) is still recommended."
    difficulty: medium
    tags: [bowel preparation, colorectal surgery, MBP, perioperative, Canada]
  - front: "What is the definition of postoperative fever, and what does the timing suggest?"
    back: "Definition: Temperature >38°C on two consecutive postoperative days OR >39°C on any postoperative day.\n\nTiming:\n- Immediate/POD 1: Inflammatory response to surgery (most common non-infectious cause POD 1-3); malignant hyperthermia; blood product reaction\n- POD 1-2: Atelectasis; early necrotizing fasciitis (Clostridium perfringens, Group A Strep — look for crepitus, 'dishwater' drainage); aspiration pneumonitis; acute adrenal insufficiency; thyroid storm; transfusion reaction\n- POD 3-7 (likely infectious): UTI, surgical site infection, IV line infection, septic thrombophlebitis, anastomotic leak (tachycardia + hypotension + oliguria + abdominal pain)\n- POD 8+: Intra-abdominal abscess, DVT/PE (most common POD 8-10), drug fever; also C. difficile colitis, URTI, infected seroma/biloma/hematoma, endocarditis\n\nThe mnemonic '5 W's' (Wind, Water, Wound, Walking, Wonder drugs) is a classic teaching aid for postoperative fever, though modern evidence shows atelectasis alone rarely causes fever. Note: fever may be blunted in patients on chemotherapy, glucocorticoids, or other immunosuppressants. Early necrotizing fasciitis is a surgical emergency requiring immediate debridement."
    difficulty: medium
    tags: [postoperative fever, surgery, complications, POD, timing]
  - front: "What are the wound/incisional care guidelines after surgery?"
    back: "- Showering: allowed POD 2-3 after wound epithelialization\n- Dressings: most can be removed POD 2 and left uncovered if dry\n- Steri-strips or Dermabond: left on up to 2 weeks\n- Skin sutures/staples: removed POD 7-10\n- Exceptions (remove at POD 14 or if signs of infection earlier): incision crosses crease (groin), closed under tension, in extremities (e.g., hand), elderly patients, patients on corticosteroids or immunosuppressed\n- Negative pressure dressings (foam + suction): promote granulation; ideal for large grafted sites or non-healing wounds (irradiated skin or ulcers)\n\nEarly wound inspection is important for detecting surgical site infection. Signs of infection include fever, tachycardia, and wound pain/erythema. Negative pressure wound therapy (NPWT) creates a moist environment, reduces edema, and promotes granulation tissue, making it valuable for complex or chronic wounds."
    difficulty: easy
    tags: [wound care, surgery, postoperative, sutures, wound healing]
  - front: "What is the AMPLE history in surgical emergencies?"
    back: "A - Allergies\nM - Medications\nP - Past medical/surgical history (including anesthesia and bleeding disorders)\nL - Last meal\nE - Events leading up to the emergency\n\nThe AMPLE history is a standardized approach to rapidly gathering essential information before emergency surgery. 'Last meal' determines aspiration risk (NPO status) and can affect anesthetic timing/technique. Bleeding disorders and prior anesthesia complications (e.g., malignant hyperthermia) are critical surgical safety factors."
    difficulty: easy
    tags: [history taking, surgery, AMPLE, emergency, preoperative]
  - front: "What are the contraindications to nasogastric (NG) tube insertion?"
    back: "1. Suspected basal skull fracture (risk of intracranial placement)\n2. Obstruction of nasal passages\n3. Esophageal stricture\n4. Esophageal varices\n\nIn basal skull fracture, a nasogastric tube can inadvertently pass through the cribriform plate into the cranial vault. Esophageal varices represent a risk of precipitating life-threatening variceal hemorrhage from tube trauma. In these cases, orogastric tube placement may be considered as an alternative."
    difficulty: easy
    tags: [NG tube, contraindications, surgery, nasogastric]
  - front: "What is the surgical principle regarding timing of elective procedures following COVID-19 infection?"
    back: "Timing depends on clinical severity:\n- Mild COVID-19 (asymptomatic/upper respiratory): wait >6 weeks for elective surgery\n- Moderate COVID-19 (hospitalization): wait >7 weeks\n- Severe COVID-19 (significant lung involvement/comorbidities): wait >7 weeks\n- Critically ill COVID-19 (ICU): wait >12 weeks for elective surgery\nUrgent/emergent cases: proceed regardless but consider nonoperative options if safe and available for severe/critically ill patients (within 7 weeks of infection).\n\nPerioperative COVID-19 infection increases risk of pulmonary complications, thromboembolic events, and mortality. The waiting periods allow recovery of cardiopulmonary reserve and normalization of the hypercoagulable/inflammatory state. The ACATS/PCATS (Canadian consensus) guidelines inform these recommendations."
    difficulty: medium
    tags: [COVID-19, surgery, perioperative, timing, Canada]
  - front: "What is the celiac trunk and what does it supply?"
    back: "The celiac trunk (T12 level) is the first major branch of the abdominal aorta. It divides into three main branches:\n1. Left gastric artery → lesser curvature of stomach, lower esophagus\n2. Common hepatic artery → hepatic proper (→ left and right hepatic arteries), right gastric, gastroduodenal (→ superior pancreaticoduodenal, right gastroepiploic)\n3. Splenic artery → spleen, left gastroepiploic, short gastric arteries, pancreatic branches\nSupplies: distal esophagus, stomach, proximal duodenum, liver, gallbladder, spleen, pancreas\n\nThe celiac trunk supplies the foregut derivatives. The watershed zone between celiac and SMA territories (mid-duodenum to proximal jejunum) and between SMA and IMA territories (splenic flexure, Griffith's point) are prone to ischemia in hypotensive states. The celiac trunk is also relevant in median arcuate ligament syndrome (external compression)."
    difficulty: medium
    tags: [celiac trunk, arterial supply, anatomy, foregut]
  - front: "What are the branches and territory of the superior mesenteric artery (SMA)?"
    back: "SMA (L1 level) branches:\n1. Inferior pancreaticoduodenal → pancreas, duodenum\n2. Ileal and jejunal branches → small bowel\n3. Ileocolic artery → ileum, cecum, appendix\n4. Right colic artery → ascending colon\n5. Middle colic artery → transverse colon\nSMA territory: distal duodenum through the proximal two-thirds of the transverse colon (midgut derivatives)\n\nSMA occlusion (embolism or thrombosis) causes acute mesenteric ischemia — a surgical emergency presenting with 'pain out of proportion to physical findings.' The SMA is vulnerable to embolism (cardiac source, e.g., atrial fibrillation) and to low-flow states causing non-occlusive mesenteric ischemia. CT angiography is the diagnostic test of choice."
    difficulty: medium
    tags: [SMA, superior mesenteric artery, anatomy, mesenteric ischemia]
  - front: "What are the branches and territory of the inferior mesenteric artery (IMA)?"
    back: "IMA (L3 level) branches:\n1. Left colic artery → descending colon\n2. Sigmoid arteries → sigmoid colon\n3. Superior rectal artery → upper rectum\nIMA territory: distal one-third of transverse colon through upper rectum (hindgut derivatives)\n\nThe IMA is ligated during left colectomy and sigmoid resection. The superior rectal artery from the IMA anastomoses with the middle and inferior rectal arteries (from internal iliac), providing collateral circulation. The watershed zone at the splenic flexure (Griffith's point) between SMA and IMA territories is the most vulnerable to ischemia."
    difficulty: medium
    tags: [IMA, inferior mesenteric artery, anatomy, colon, hindgut]
