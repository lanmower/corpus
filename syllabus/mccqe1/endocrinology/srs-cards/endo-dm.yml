  - front: "In UKPDS 34, what was the HbA1c difference between metformin and conventional therapy?"
    back: "7.4% vs 8.0% (0.6% lower with metformin)\n\nPatients allocated to metformin had reduced HbA1c of 7.4% compared to 8.0% in the conventional therapy group."
