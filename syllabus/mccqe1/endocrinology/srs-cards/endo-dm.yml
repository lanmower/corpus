  - front: "Define Diabetes Mellitus according to Toronto Notes 2025"
    back: "A metabolic disorder characterized by the presence of hyperglycemia due to defective insulin secretion, defective insulin action, or both\n\nDM is fundamentally a disorder of glucose metabolism due to inadequate insulin action or secretion."
    difficulty: easy
    tags: [endocrinology, diabetes, definition, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the major complications of diabetes mellitus?"
    back: "Leading cause of new-onset blindness and renal dysfunction\n\nDiabetic retinopathy is the leading cause of blindness, and diabetic nephropathy is a major cause of renal failure."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the recommended screening for T2DM in average-risk adults?"
    back: "FBG or HbA1C in everyone ≥40 years old every 3 years\n\nStandard screening recommendation is to test adults age 40+ every 3 years using fasting blood glucose or HbA1c."
    difficulty: easy
    tags: [endocrinology, diabetes, screening, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the advantage of HbA1C over fasting blood glucose for diabetes diagnosis?"
    back: "Better predictor of CVD than FBG or 2-hour OGTT; reflects long-term glucose; convenient (any time of day); slow day-to-day variability\n\nHbA1c provides a better measure of chronic glucose exposure and cardiovascular risk prediction."
    difficulty: medium
    tags: [endocrinology, diabetes, diagnosis, HbA1c, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the optimal HbA1C target for diabetes management?"
    back: "Usually <7%\n\nOptimal glycemic control is generally defined as HbA1c below 7% to reduce complications."
    difficulty: easy
    tags: [endocrinology, diabetes, management, targets, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the TIDM insulin requirement estimate?"
    back: "0.5-0.7 units/kg/day\n\nType 1 diabetes typically requires approximately 0.5-0.7 units of insulin per kg body weight daily."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, dosing, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the T2DM insulin requirement estimate?"
    back: "0.3 units/kg/day\n\nType 2 diabetes typically requires lower insulin doses (approximately 0.3 units/kg/day) due to residual insulin secretion."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, dosing, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What non-pharmacological interventions can reduce HbA1C?"
    back: "Diet and exercise can reduce HbA1C by 1-2%\n\nLifestyle modifications including diet and physical activity have significant impact on glycemic control."
    difficulty: easy
    tags: [endocrinology, diabetes, management, lifestyle, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the primary conclusion of the 4T Trial regarding insulin regimens in T2DM?"
    back: "Basal insulin (detemir) provides the best glycemic control over 3 years with better HbA1c, fewer hypoglycemic events, and less weight gain compared to prandial and biphasic insulin\n\nThe 4T Trial compared three insulin regimens in 708 T2DM patients on maximal metformin and sulfonylurea therapy over 3 years"
    difficulty: medium
    tags: [diabetes, insulin, clinical-trials, treatment, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the main adverse effect of intensive insulin therapy in the DCCT?"
    back: "Severe hypoglycemia\n\nWhile intensive therapy significantly reduced microvascular complications in T1DM, it was associated with an increased occurrence of severe hypoglycemic events"
    difficulty: easy
    tags: [type-1-diabetes, hypoglycemia, intensive-therapy, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Why is metformin recommended as first-line therapy for overweight T2DM patients?"
    back: "It decreases risk of diabetes-related endpoints with less weight gain and fewer hypoglycemic episodes compared to sulfonylureas or insulin\n\nUKPDS 34 showed metformin was superior to sulfonylureas/insulin for any diabetes-related endpoint (P=0.0034), all-cause mortality (P=0.021), and stroke (P=0.032)"
    difficulty: easy
    tags: [type-2-diabetes, metformin, treatment-guidelines, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the difference in hypoglycemia rates between intensive and conventional therapy in UKPDS?"
    back: "Intensive therapy (sulfonylurea or insulin) induced more hypoglycemic episodes than conventional therapy\n\nUKPDS 33 and 34 both demonstrated that intensive glucose control with sulfonylureas or insulin increased hypoglycemia risk compared to conventional treatment"
    difficulty: easy
    tags: [type-2-diabetes, hypoglycemia, intensive-therapy, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What is the approximate prevalence of diabetes mellitus in Canadians?"
    back: "Up to 10%\n\nDiabetes is a major health concern in Canada, affecting approximately 10% of the population, with rising incidence due to obesity and sedentary lifestyle."
    difficulty: easy
    tags: [endocrinology, diabetes, epidemiology, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the complications of diabetes mellitus?"
    back: "Blindness (leading cause of new-onset), renal dysfunction, CAD, CVD, PVD\n\nDiabetes causes both microvascular (retinopathy, nephropathy, neuropathy) and macrovascular (CAD, CVD, PVD) complications."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "List 5 risk factors for Type 2 Diabetes Mellitus"
    back: "First-degree relative with DM, age ≥40yr, obesity (especially abdominal), HTN, hyperlipidemia, CAD, vascular disease, prior gestational diabetes, macrosomic baby >4kg, PCOS, history of IGT or IFG, member of high-risk population (Indigenous, Hispanic, Asian, African descent), certain medications (glucocorticoids, atypical antipsychotics, HAART)\n\nT2DM has multiple modifiable and non-modifiable risk factors; screening should be individualized based on risk profile."
    difficulty: medium
    tags: [endocrinology, diabetes, risk factors, T2DM, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "List 3 risk factors for Type 1 Diabetes Mellitus"
    back: "Personal or family history of autoimmune disease\n\nT1DM is an autoimmune condition characterized by destruction of pancreatic beta cells, often associated with other autoimmune disorders."
    difficulty: easy
    tags: [endocrinology, diabetes, risk factors, T1DM, autoimmune, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the screening test and frequency for T2DM in average-risk adults ≥40?"
    back: "FBG or HbA1C every 3 years\n\nScreening should begin at age 40 for average-risk adults using FBG or HbA1C, with more frequent testing for higher-risk individuals."
    difficulty: easy
    tags: [endocrinology, diabetes, screening, prevention, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Calculate the estimated total daily insulin requirement for a 70kg patient with T1DM"
    back: "Approximately 35.5 units/day (0.5 × 70kg)\n\nThe starting estimate for total daily insulin is 0.5-0.7 units/kg/day for T1DM, divided between basal and bolus insulin."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, calculation, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Calculate the estimated total daily insulin requirement for a 80kg patient with T2DM"
    back: "Approximately 24 units/day (0.3 × 80kg)\n\nT2DM patients typically start at 0.3 units/kg/day as they often have residual insulin secretion."
    difficulty: medium
    tags: [endocrinology, diabetes, insulin, calculation, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What dietary modifications can reduce HbA1C?"
    back: "Can reduce HbA1C by 1-2%\n\nMedical nutrition therapy is foundational in diabetes management and can significantly improve glycemic control."
    difficulty: easy
