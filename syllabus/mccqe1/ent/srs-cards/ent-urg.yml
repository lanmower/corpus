# ENT Emergencies (ENT) - generated from srs-mccqe1
cards:
  - front: "A 3-year-old child is brought to the ED with sudden-onset stridor at rest, drooling, and a muffled \"hot potato\" voice. He appears toxic and is sitting upright. What is the immediate priority?"
    back: "Maintain airway; do NOT examine the throat or lay the child down — emergent anesthesia/ENT for intubation in OR\n\nThis presentation is epiglottitis until proven otherwise (H. influenzae type b or S. aureus). Manipulating the throat can trigger complete airway obstruction. Call anesthesia and ENT immediately. After airway secured: ceftriaxone IV, dexamethasone."
    difficulty: hard
    tags: [epiglottitis, stridor, airway-emergency, H-influenzae, ceftriaxone]
  - front: "What is the most common complication of untreated group A streptococcal pharyngitis?"
    back: "Peritonsillar abscess (PTA) — collection of pus between the tonsil and superior constrictor muscle\n\nPTA presents with unilateral bulging of the soft palate, uvular deviation, severe dysphagia, trismus, and \"hot potato\" voice. Treatment: needle aspiration or I&D + penicillin IV, then PO amoxicillin-clavulanate. Quinsy tonsillectomy for recurrent PTA."
    difficulty: medium
    tags: [peritonsillar-abscess, group-A-strep, pharyngitis, uvular-deviation, trismus]
  - front: "An adult presents with 3 days of right-sided facial pain, purulent nasal discharge, fever, and maxillary teeth pain worse on leaning forward. What is the diagnosis and treatment?"
    back: "Acute bacterial rhinosinusitis (ABRS); treat with amoxicillin 500 mg TID × 10 days if moderate-severe or no improvement after 7 days of symptomatic therapy\n\nABRS requires: symptoms >10 days without improvement, or severe symptoms (fever >39°C, unilateral facial pain) from onset, or double-worsening. Most viral ARS resolves in 7–10 days. Saline irrigation and decongestants provide symptomatic relief."
    difficulty: medium
    tags: [acute-sinusitis, ABRS, amoxicillin, facial-pain, rhinosinusitis]
  - front: "What are the danger signs of orbital cellulitis (vs periorbital/preseptal cellulitis)?"
    back: "Proptosis, ophthalmoplegia (restricted/painful eye movements), diplopia, decreased visual acuity, and afferent pupillary defect — all indicate postseptal (orbital) cellulitis\n\nOrbital cellulitis is a surgical emergency requiring CT orbits + sinuses, IV antibiotics (vancomycin + ceftriaxone), and ophthalmology/ENT consultation. Periorbital cellulitis (preseptal) is treated with oral antibiotics."
    difficulty: hard
    tags: [orbital-cellulitis, proptosis, ophthalmoplegia, preseptal, CT-orbits]
  - front: "What is the management of a posterior epistaxis that fails conservative measures?"
    back: "Posterior nasal packing (or Foley catheter balloon) + anterior packing; consult ENT for arterial ligation or embolization if packing fails\n\nPosterior epistaxis is from the sphenopalatine artery. It is less common but more dangerous than anterior bleeds (Kiesselbach plexus). Posterior packing requires hospital admission for monitoring (risk of hypoxia, pressure necrosis)."
    difficulty: medium
    tags: [epistaxis, posterior-nasal-packing, sphenopalatine-artery, ENT, arterial-embolization]
  - front: "A 45-year-old presents with sudden onset severe unilateral otalgia, vesicles in the ear canal, facial nerve palsy, and vertigo. What is the diagnosis?"
    back: "Ramsay Hunt syndrome (herpes zoster oticus — reactivation of VZV in geniculate ganglion)\n\nTriad: otic pain, vesicles in the ear/pinna, and ipsilateral facial palsy. Treatment: oral acyclovir/valacyclovir + prednisone within 72 hours. Prognosis for facial nerve recovery is worse than Bell palsy. Audiometry for SNHL."
    difficulty: medium
    tags: [Ramsay-Hunt, herpes-zoster-oticus, facial-palsy, VZV, valacyclovir]
  - front: "What is the appropriate management of a fish bone foreign body in the pharynx/esophagus?"
    back: "Direct or indirect laryngoscopy ± rigid esophagoscopy under GA for retrieval if lodged below cricopharyngeus\n\nFish bones are radiopaque on lateral neck X-ray but are often missed. Bones above the cricopharyngeus can be removed in the ED with forceps. Bones in the esophagus require rigid endoscopy. Flexible endoscopy is second choice. CT neck/chest if X-ray negative but high suspicion."
    difficulty: medium
    tags: [foreign-body, pharynx, esophagoscopy, fish-bone, laryngoscopy]
  - front: "What is the management of epistaxis?"
    back: "Anterior: direct pressure 15min, nasal packing (Merocel/RhinoRocket) if persistent, cauterize with silver nitrate. Posterior: posterior packing (Foley catheter) or balloon, ENT consultation, possible embolization\n\n90% anterior (Kiesselbach plexus). Posterior from sphenopalatine artery — higher risk. Check BP, coagulation studies, medications (anticoagulants). Topical oxymetazoline before packing."
    difficulty: medium
    tags: [epistaxis]
  - front: "How is anterior epistaxis managed?"
    back: "1) Sit forward, pinch soft nose 15min continuous. 2) Topical vasoconstrictor (oxymetazoline). 3) Silver nitrate cautery if bleeding point visible. 4) Anterior nasal packing (Merocel/Rapid Rhino). 5) ENT if refractory\n\n90% epistaxis is anterior (Kiesselbach plexus/Little area). Posterior epistaxis: posterior pack or balloon, admit. Check BP, coagulation, medications (anticoagulants, antiplatelets). Do NOT cauterize both sides of septum (perforation risk)."
    difficulty: medium
    tags: [epistaxis, nasal packing, management]
  - front: "How is peritonsillar abscess (PTA) diagnosed and treated?"
    back: "Presentation: severe sore throat, trismus, hot-potato voice, uvular deviation, unilateral tonsillar swelling. Diagnosis: clinical +/- CT or US. Treatment: needle aspiration or I&D + antibiotics (amox-clav or clindamycin). IV fluids\n\nPTA is most common deep neck space infection. Complication: parapharyngeal abscess, airway compromise, Lemierre syndrome (IJV thrombophlebitis from Fusobacterium). Tonsillectomy recommended if recurrent PTA (>2). Always assess airway before instrumentation."
    difficulty: hard
    tags: [peritonsillar abscess, PTA, drainage]
  - front: "What is the approach to a patient with stridor?"
    back: "Inspiratory stridor: supraglottic/glottic obstruction (croup, epiglottitis, foreign body, anaphylaxis). Biphasic: glottic/subglottic (croup, subglottic stenosis). Expiratory: lower airway (asthma, bronchiolitis). Assess severity: can they speak, drooling, position?\n\nCroup (6mo-3yr): barky cough, viral, dexamethasone 0.6mg/kg PO single dose + nebulized epinephrine if severe. Epiglottitis: drooling, toxic, do NOT examine throat, urgent anesthesia/ENT for intubation. Adult epiglottitis still occurs."
    difficulty: hard
    tags: [stridor, croup, epiglottitis, airway]
  - front: "How is acute sinusitis managed?"
    back: "Viral (most common, <10d): supportive (saline irrigation, analgesics, intranasal corticosteroids). Bacterial (symptoms >10d, or worsening after 5-7d, or severe onset): amoxicillin 500mg TID x5-7d. Second-line: amox-clav\n\nCTFPHC recommends delayed antibiotics for most sinusitis. Bacterial signs: purulent discharge, unilateral facial pain/pressure, fever, double sickening. Imaging NOT needed for uncomplicated. CT only for complications or chronic. Complications: orbital cellulitis, intracranial abscess."
    difficulty: medium
    tags: [sinusitis, amoxicillin, management]
  - front: "What are the red flags for serious causes of sore throat?"
    back: "Drooling/unable to swallow (PTA, epiglottitis, retropharyngeal abscess). Trismus. Respiratory distress/stridor. Neck swelling/erythema (Ludwig angina). Unilateral swelling. Hot-potato voice. Toxic appearance\n\nLudwig angina: bilateral submandibular space infection, floor of mouth elevation, potential airway emergency. Lemierre syndrome: sore throat + septic thrombophlebitis of IJV (Fusobacterium). Retropharyngeal abscess: neck stiffness, dysphagia, CT confirms."
    difficulty: hard
    tags: [sore throat, red flags, Ludwig angina]
  - front: "How is group A strep pharyngitis diagnosed and managed?"
    back: "Centor/McIsaac criteria: fever>38, tonsillar exudate, tender anterior cervical LAD, no cough (+1 if age 3-14, -1 if >45). Score 0-1: no test. 2-3: rapid strep then culture. 4+: empiric abx. Treat: penicillin V 600mg BID x10d or amoxicillin\n\nTreatment prevents rheumatic fever (rare in Canada) and reduces symptoms by ~1 day. Alternatives: cephalexin, azithromycin if penicillin allergic. Complications: PTA, rheumatic fever, PSGN (not prevented by antibiotics), scarlet fever."
    difficulty: medium
    tags: [strep pharyngitis, Centor, penicillin]
  - front: "What is the approach to a foreign body in the ear or nose?"
    back: "Ear: irrigation if not button battery or live insect (kill insect first with mineral oil). Nose: positive pressure (parent blow or Katz extractor). Button battery: EMERGENCY removal (mucosal necrosis in 2h)\n\nButton battery in nose or esophagus is a TRUE EMERGENCY - causes liquefactive necrosis rapidly. Do not delay for imaging. Nasal FB: occlude unaffected nostril, parent blows into mouth. Ear FB: do not push deeper. ENT referral if failed removal."
    difficulty: medium
    tags: [foreign body, ear, nose, emergency]
  - front: "How is a nasal fracture assessed and managed?"
    back: "Assess: deformity, crepitus, epistaxis, septal hematoma (fluctuant swelling - drain immediately to prevent necrosis/saddle nose). XR not needed. Closed reduction if displaced (within 7-10 days for adults)\n\nSeptal hematoma is a surgical EMERGENCY - avascular necrosis of cartilage if not drained. Simple nasal fracture: ice, analgesia, reassess in 5-7 days when swelling reduced, reduce if cosmetic deformity. Rule out: CSF rhinorrhea (beta-2 transferrin), orbital blowout fracture."
    difficulty: medium
    tags: [nasal fracture, septal hematoma, management]
  - front: "What is the 2-week rule for head and neck cancer referral?"
    back: "Urgent ENT referral (2wk) for: hoarseness >3wk, persistent neck lump, unilateral ear pain with normal ear, oral ulcer/lesion >3wk, unexplained dysphagia, unilateral nasal obstruction with bloody discharge\n\nHead and neck SCC risk factors: tobacco, alcohol, HPV (oropharyngeal). HPV+ oropharyngeal cancer increasing in young non-smokers, better prognosis. Pan-endoscopy for staging. Treatment: surgery and/or chemoradiation depending on site and stage."
    difficulty: hard
    tags: [head and neck cancer, referral, red flags]
  - front: "How is obstructive sleep apnea diagnosed and managed?"
    back: "Diagnosis: polysomnography (AHI>=5 + symptoms or AHI>=15). STOP-BANG screening (>=3 high risk). Treatment: CPAP (first-line moderate-severe), weight loss, positional therapy, MAD for mild. Surgery: UPPP/tonsillectomy for select patients\n\nOSA affects 5-15% adults. Consequences: HTN, CV disease, MVA risk, depression. CPAP reduces AHI and CV risk. Adherence is the main challenge (50% at 1yr). Commercial driver screening required in many jurisdictions. Children: adenotonsillectomy is first-line."
    difficulty: medium
    tags: [OSA, CPAP, STOP-BANG]
  - front: "How do you diagnose and manage a peritonsillar abscess (PTA)?"
    back: "Presentation: severe sore throat (usually unilateral), trismus (difficulty opening mouth), 'hot potato' voice, drooling, uvula deviation AWAY from abscess, unilateral tonsillar bulge, fever. Diagnosis: clinical; CT with contrast if uncertain or concern for deep space extension. Management: 1) Needle aspiration (first-line, ~90% success) or incision and drainage (I&D) if aspiration fails; 2) IV antibiotics (ampicillin-sulbactam or clindamycin); 3) Corticosteroids (dexamethasone — reduce pain and trismus); 4) Analgesia; 5) Ensure adequate oral intake or IV hydration. Complications: airway obstruction, parapharyngeal/retropharyngeal abscess extension, Lemierre syndrome (internal jugular vein thrombophlebitis).\n\nPTA is the most common deep head and neck infection. Trismus is the key distinguishing feature from severe tonsillitis. Lemierre syndrome (septic thrombophlebitis from Fusobacterium) should be suspected if PTA patient develops persistent fevers, neck swelling, and septic emboli. Most patients can be managed as outpatient after drainage."
    difficulty: hard
    tags: [peritonsillar abscess, trismus, needle aspiration, Lemierre syndrome, ENT]
  - front: "What is the approach to foreign body in the ear, nose, and airway?"
    back: "Ear FB: common in children (beads, insects); insects — kill with mineral oil/lidocaine drops first, then remove; remove with alligator forceps, suction, or irrigation (NOT irrigation if TM perforation or organic material that may swell). Nasal FB: unilateral foul-smelling discharge in a child = nasal FB until proven otherwise; remove with positive pressure ('mother's kiss' technique), suction, or forceps; avoid pushing posteriorly (aspiration risk). Airway FB: if partial obstruction (coughing, stridor) — encourage coughing, do NOT intervene if effective cough; complete obstruction — Heimlich maneuver (abdominal thrusts) in >1yr, back blows + chest thrusts in infants <1yr; if unconscious — CPR and direct laryngoscopy. Refer to ENT/OR if: failed removal, button battery (EMERGENCY — causes necrosis within 2 hours), or sharp/impacted objects.\n\nButton batteries in nose or esophagus are true emergencies — they cause liquefactive necrosis within 2 hours and can perforate the septum or esophagus. Canadian ED guidelines mandate immediate removal. The 'mother's kiss' technique (parent blows into child's mouth while occluding unaffected nostril) has ~60% success rate for nasal FB."
    difficulty: medium
    tags: [foreign body, ear, nose, airway, button battery, emergency, ENT]
  - front: "What is sudden sensorineural hearing loss (SSNHL) and how is it managed?"
    back: "SSNHL is a medical emergency: sudden-onset (usually <72 hours) unilateral sensorineural hearing loss ≥30 dB across at least 3 consecutive frequencies. Management: high-dose systemic corticosteroids + urgent ENT referral.\n\nSSNHL is idiopathic in most cases (viral or vascular etiology postulated). Early treatment with corticosteroids improves recovery rates. An elderly patient with unilateral tinnitus or SSNHL must be presumed to have an acoustic neuroma (vestibular schwannoma) until proven otherwise."
    difficulty: medium
    tags: [SSNHL, hearing loss, emergency, ENT, corticosteroids]
  - front: "Where do 90% of nosebleeds originate, and what is this area called?"
    back: "90% originate from the anterior nasal septum at Kiesselbach's plexus (Little's area). This is a confluence of multiple arteries (anterior and posterior ethmoid arteries, superior labial artery, greater palatine artery, and sphenopalatine artery).\n\nKiesselbach's plexus is highly vascular and superficial, making it prone to trauma-related bleeding. Digital trauma (nose picking) is the most common cause. Posterior bleeds are less common but more dangerous, involving the sphenopalatine artery with larger blood vessels."
    difficulty: easy
    tags: [epistaxis, Kiesselbachs plexus, Littles area, nosebleed, ENT]
  - front: "What is the management of anterior epistaxis that fails initial first-aid measures?"
    back: "1) Apply anterior nasal pack (Vaseline gauze, nasal tampon, or balloon) with topical anesthesia/vasoconstrictors. 2) If bleeding site identified: cauterize with silver nitrate (one side only—bilateral cauterization risks septal perforation). 3) If packing both nares: prophylactic anti-staphylococcal antibiotics (e.g., amoxicillin-clavulanate) to prevent sinusitis or toxic shock syndrome.\n\nFirst-aid for epistaxis is leaning forward and pinching the cartilaginous nose for 20 minutes. If this fails twice, packing or cautery is indicated. Only one side of the septum should be cauterized to avoid septal perforation and ischemic necrosis."
    difficulty: medium
    tags: [epistaxis, nasal packing, cautery, silver nitrate, ENT]
  - front: "What are the complications of nasal packing for epistaxis?"
    back: "Hypoxemia, pharyngeal fibrosis/stenosis, alar/septal necrosis. Bilateral packing requires prophylactic anti-staphylococcal antibiotics to prevent sinusitis or toxic shock syndrome. Posterior packing can cause significant vagal response and respiratory compromise.\n\nNasal packing creates pressure necrosis if left too long or placed too tightly. Bilateral nasal obstruction reduces O2 saturation. Nasal packing colonized with S. aureus producing TSST-1 toxin can cause TSS — hence prophylactic antibiotics. Packs are typically removed in 48-72 hours."
    difficulty: medium
    tags: [epistaxis, nasal packing, complications, TSS, ENT]
