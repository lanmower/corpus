# Pediatrics Musculoskeletal (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "List the four Kocher criteria used to differentiate septic arthritis from transient synovitis of the hip."
    back: "Kocher criteria — septic arthritis is more likely than transient synovitis when MORE of these 4 criteria are met: (1) Non-weight bearing, (2) Temperature >38.5°C, (3) ESR >40 mm/hr, (4) WBC >12,000 cells/mm³. Probability of septic arthritis increases with each additional criterion met.\n\nThe Kocher criteria are the key clinical decision tool for differentiating septic arthritis from transient synovitis in children with hip pain. Septic arthritis is a medical emergency requiring prompt surgical drainage and IV antibiotics, so accurate differentiation is critical. CRP >2 mg/dL has been added in some updated criteria. If ≥3 criteria are met, septic arthritis probability is very high and surgical aspiration is indicated."
    difficulty: medium
    tags: [pediatrics, orthopedics, septic-arthritis, transient-synovitis, Kocher-criteria, hip]
  - front: "What are the clinical features of Transient Synovitis of the Hip, and how does it differ from septic arthritis?"
    back: "Transient synovitis: benign, self-limited inflammatory hip disorder, typically follows URTI/pharyngitis/AOM. Age 3-10 yr, M>F, more common on right side. Features: afebrile or low-grade fever, sudden hip or knee pain (referred from hip), painful limp but FULL ROM preserved, child does NOT look toxic. WBC normal; ESR/CRP mildly elevated; joint effusion on ultrasound. Resolves in 7-10 d spontaneously; treatment is supportive. Complication: may lead to Legg-Calvé-Perthes disease.\n\nTransient synovitis is the most common cause of acute hip pain/limp in children. The key distinguishing feature from septic arthritis is the preserved range of motion (albeit painful) and the child not appearing toxic. Septic arthritis is a medical emergency: child appears unwell, febrile, refuses to move the joint, and requires urgent surgical drainage plus IV antibiotics. Use Kocher criteria to stratify risk."
    difficulty: medium
    tags: [pediatrics, orthopedics, transient-synovitis, hip, limp, septic-arthritis]
  - front: "What are the red flags in a child presenting with a limp that should prompt urgent evaluation?"
    back: "Red flags for limp requiring urgent evaluation: inability to weight bear; severe or localized joint/bone pain; persistent symptoms (>7 days); fever (suggests infection or malignancy); pinpoint tenderness (fracture, osteomyelitis); night pain; weight loss; erythema overlying bone/joint. Constitutional/nocturnal/systemic symptoms raise suspicion for infection, inflammation, and malignancy. Bone malignancy: intermittent pain at rest or at night ± palpable bony mass.\n\nMost childhood limp (80% of cases associated with pain) is benign, but red flags mandate urgent workup. The most common diagnosis is transient synovitis; however, septic arthritis (Kocher criteria), osteomyelitis, leukemia, and neuroblastoma must be excluded. If a child appears generally unwell, serious systemic conditions must be considered first. Child abuse should be considered and CAS contacted if suspected."
    difficulty: easy
    tags: [pediatrics, orthopedics, limp, red-flags, emergency]
  - front: "What physical exam finding suggests each of the following hip diagnoses in a limping child: (a) septic arthritis, (b) developmental dysplasia, (c) intra-articular pathology (Legg-Calvé-Perthes/SCFE)?"
    back: "(a) Septic arthritis: flexed and externally rotated hip at rest. (b) Developmental dysplasia of the hip: limited hip abduction; positive Trendelenburg test (also seen with weak hip abductors). (c) Intra-articular hip pathology (Legg-Calvé-Perthes, SCFE): limited internal rotation of the hip.\n\nThese specific exam findings direct diagnosis in a limping child. SCFE classically presents with loss of internal rotation and obligate external rotation when the hip is flexed. Legg-Calvé-Perthes (avascular necrosis of the femoral head) also restricts internal rotation and abduction. Developmental dysplasia assessment includes the Ortolani/Barlow maneuvers in neonates and later the Trendelenburg sign. Septic arthritis positions the hip to minimize intra-articular pressure (flexion + external rotation + abduction)."
    difficulty: hard
    tags: [pediatrics, orthopedics, limp, hip, physical-exam, SCFE, DDH, septic-arthritis]
  - front: "What imaging modalities are used in evaluating a limping child and what does each detect?"
    back: "Radiography (AP + lateral): first-line if focal findings present; both lower limbs if no focal findings. Ultrasound: more sensitive for detecting hip effusions (useful for transient synovitis vs. septic arthritis). MRI: confirms osteomyelitis and stress fractures; visualizes malignancy. Bone scintigraphy: considered if other investigations do not reveal a diagnosis (not commonly used as first-line). Blood work if infection/inflammation/malignancy suspected: CBC, ESR, CRP, blood culture (pre-antibiotics).\n\nImaging selection in a limping child depends on clinical presentation. Plain X-ray is first-line for fractures and some bony pathology. Ultrasound is particularly useful for hip effusions — it can guide diagnostic/therapeutic aspiration. MRI is the gold standard for osteomyelitis, soft tissue infection, and malignancy. Bone scan is sensitive but non-specific and involves radiation. Synovial fluid analysis (cell count, Gram stain, culture) is essential if septic arthritis is suspected."
    difficulty: medium
    tags: [pediatrics, orthopedics, limp, imaging, MRI, ultrasound, osteomyelitis]
  - front: "What is the differential diagnosis of limb pain in a child >10 years old?"
    back: "In children >10 years: Trauma; Infectious (septic arthritis, osteomyelitis); Inflammatory (JIA, spondyloarthritis, SLE, dermatomyositis, HSP); Anatomic/Orthopedic (Slipped Capital Femoral Epiphysis [SCFE], Osgood-Schlatter disease, Legg-Calvé-Perthes less common); Neoplastic (leukemia, bone tumour); Hematologic (hemophilia/hemarthrosis, sickle cell anemia); Pain syndromes (fibromyalgia, complex regional pain syndrome).\n\nSCFE (Slipped Capital Femoral Epiphysis) occurs predominantly in obese adolescents, while Osgood-Schlatter (tibial tubercle apophysitis) peaks in active adolescents during growth spurts. Legg-Calvé-Perthes is more common in younger children (4-8 years). In any age group with limb pain, infection, malignancy, and acute orthopedic conditions must be ruled out first."
    difficulty: medium
    tags: [pediatrics, orthopedics, limb-pain, differential-diagnosis, SCFE, leukemia]
