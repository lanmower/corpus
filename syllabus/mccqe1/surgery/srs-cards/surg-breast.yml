# Breast Disease & Cancer (Surgery) - generated from srs-mccqe1
cards:
  - front: "A 55-year-old woman has a hard, irregular, non-tender breast lump. What is the triple assessment and what are the next steps?"
    back: "Triple assessment: clinical examination + breast imaging (mammogram ± ultrasound) + tissue biopsy (core needle biopsy preferred) — all three should be concordant before treatment decision\n\nCanadian Cancer Society guidelines recommend triple assessment as the standard for evaluating breast lumps. Core needle biopsy provides histological diagnosis, receptor status (ER, PR, HER2), and grade. Open surgical biopsy is rarely required. Concordant benign triple assessment = safe discharge with follow-up."
    difficulty: medium
    tags: [breast cancer, triple assessment, core biopsy, mammogram, surgery]
  - front: "What are the breast cancer screening recommendations in Canada?"
    back: "Mammogram every 2 years for women 50-74; discuss with women 40-49 (benefits and harms); high-risk women (BRCA, strong family history): annual MRI + mammogram starting at 30-40\n\nCTFPHC (Canadian Task Force on Preventive Health Care) recommends routine screening mammography for 50-74 years. Women 40-49: individualized decision-making. High-risk screening (BRCA1/2, first-degree relative with BRCA, lifetime risk >25%): annual MRI + mammogram per Canadian Cancer Society."
    difficulty: easy
    tags: [breast cancer screening, mammogram, BRCA, high-risk, surgery]
  - front: "A 45-year-old woman has a 2.5 cm breast cancer (ER+, HER2-) with 2 positive axillary lymph nodes (N1). What is the staging and systemic treatment?"
    back: "Stage IIA-IIB (T2N1M0 or T1N1M0); systemic treatment: chemotherapy (AC-T) followed by endocrine therapy (tamoxifen or aromatase inhibitor x5-10 years)\n\nCanadian breast cancer guidelines recommend adjuvant chemotherapy for node-positive ER+ breast cancer, especially in premenopausal patients. Aromatase inhibitors (letrozole, anastrozole) preferred for postmenopausal women. OncotypeDX genomic test may guide chemotherapy decision in node-negative HR+ HER2- disease."
    difficulty: hard
    tags: [breast cancer staging, adjuvant chemotherapy, tamoxifen, aromatase inhibitor, surgery]
  - front: "What is the sentinel lymph node biopsy (SLNB) and when is it used?"
    back: "SLNB: injection of tracer (blue dye or radioisotope) identifies first draining lymph nodes in axilla — samples 1-5 nodes rather than full axillary dissection; used when clinically node-negative breast cancer\n\nSLNB has replaced routine axillary lymph node dissection (ALND) for clinically node-negative breast cancer. Avoids unnecessary ALND and its complications (lymphedema, nerve damage, shoulder dysfunction). ALND only if SLNB positive with ≥3 positive nodes or node-positive after neoadjuvant chemotherapy."
    difficulty: medium
    tags: [sentinel lymph node biopsy, SLNB, axillary lymph node, breast cancer surgery, surgery]
  - front: "What is the role of HER2-targeted therapy in breast cancer?"
    back: "HER2-positive breast cancer (amplified by FISH or 3+ IHC): trastuzumab (Herceptin) for 1 year reduces recurrence by 50% — cardiotoxicity (monitor LVEF); pertuzumab + trastuzumab for node-positive disease\n\nCanadian breast cancer guidelines recommend dual HER2 blockade (pertuzumab + trastuzumab + chemotherapy) for HER2+ node-positive or high-risk node-negative disease. T-DM1 for residual HER2+ disease after neoadjuvant chemotherapy. Cardiotoxicity: do not use concurrently with anthracyclines."
    difficulty: medium
    tags: [HER2, trastuzumab, breast cancer treatment, pertuzumab, surgery]
  - front: "What is breast-conserving surgery (BCS) and when is mastectomy required?"
    back: "BCS (lumpectomy + radiation) is equivalent to mastectomy for OS and DFS in eligible patients; mastectomy required for: multicentric disease, large tumor-to-breast ratio, inability to achieve clear margins, patient preference, radiation contraindication, inflammatory breast cancer\n\nMilan trial established BCS + radiation equivalence to mastectomy. Clear margins (no ink on tumor) are required. Contralateral prophylactic mastectomy offered to BRCA1/2 carriers. Oncoplastic techniques improve cosmetic outcomes after BCS."
    difficulty: medium
    tags: [breast-conserving surgery, mastectomy, lumpectomy, margins, surgery]
  - front: "What is inflammatory breast cancer and what is its management?"
    back: "Inflammatory breast cancer: erythema, edema (peau d'orange), warmth of ≥1/3 of breast skin — often misdiagnosed as mastitis; treat with neoadjuvant chemotherapy followed by mastectomy + radiation\n\nInflammatory breast cancer has the worst prognosis of all breast cancer subtypes (5-year survival ~40%). It is a clinical diagnosis — does not require skin lymphatic invasion on biopsy. Often presents without a palpable mass. NOT an indication for BCS."
    difficulty: hard
    tags: [inflammatory breast cancer, peau d orange, neoadjuvant chemotherapy, mastectomy, surgery]
  - front: "What is the hereditary breast cancer risk associated with BRCA1/2 mutations?"
    back: "BRCA1: lifetime breast cancer risk 65-80%, ovarian cancer 39-46%; BRCA2: breast cancer 45-70%, ovarian cancer 11-27% — prophylactic mastectomy reduces risk by 90-95%\n\nBRCA1/2 carriers should be referred to genetic counseling and hereditary cancer program. Risk-reducing interventions: bilateral prophylactic mastectomy (reduces breast cancer risk >90%), salpingo-oophorectomy (reduces ovarian and breast cancer risk). Surveillance: annual MRI + mammogram starting at 30."
    difficulty: medium
    tags: [BRCA1 BRCA2, hereditary breast cancer, prophylactic mastectomy, genetic counseling, surgery]
  - front: "What is the treatment for locally advanced (Stage III) breast cancer?"
    back: "Neoadjuvant chemotherapy (± HER2 or immunotherapy based on subtype) → surgery → radiation ± additional systemic therapy; goal: downstage tumor, assess chemotherapy response, increase BCS eligibility\n\nNeoadjuvant chemotherapy for locally advanced breast cancer allows assessment of pathological complete response (pCR) — a prognostic marker. Triple-negative breast cancer: add pembrolizumab to neoadjuvant chemotherapy (KEYNOTE-522). HER2+: add pertuzumab + trastuzumab."
    difficulty: hard
    tags: [locally advanced breast cancer, neoadjuvant chemotherapy, pathological complete response, surgery]
  - front: "What are common benign breast conditions and how are they distinguished from malignancy?"
    back: "Fibroadenoma (young women, rubbery smooth mobile), fibrocystic changes (cyclical pain, diffuse nodularity), breast abscess (periductal mastitis — smokers), fat necrosis (post-trauma/surgery), galactocele (lactating women)\n\nBenign breast conditions are more common than cancer. Fibroadenomas: ultrasound-guided core biopsy if >2 cm or rapid growth; may be excised. Breast abscess: ultrasound-guided aspiration ± antibiotics; incision and drainage for large or recurrent abscesses. Triple assessment required for all suspicious lesions."
    difficulty: easy
    tags: [benign breast disease, fibroadenoma, fibrocystic, breast abscess, surgery]
  - front: "What is the BIRADS classification for breast imaging?"
    back: "0: incomplete. 1: negative. 2: benign. 3: probably benign (<2% malignancy). 4: suspicious (4a/b/c). 5: highly suspicious (>=95%). 6: known malignancy\n\nBIRADS 4+: biopsy recommended. BIRADS 3: short-interval follow-up at 6 months. Triple assessment: clinical exam, imaging, biopsy."
    difficulty: medium
    tags: [breast, BIRADS]
  - front: "What is the BIRADS classification system and its clinical implications?"
    back: "BIRADS 0: incomplete. 1: negative. 2: benign. 3: probably benign (<2% malignancy, 6-month follow-up). 4: suspicious (4A: 2-10%, 4B: 10-50%, 4C: 50-95%-all need biopsy). 5: highly suggestive of malignancy (>95%, biopsy). 6: known biopsy-proven malignancy.\n\nBIRADS (Breast Imaging Reporting and Data System) standardizes mammographic reporting. Canadian radiologists use BIRADS to guide management. All BIRADS 4 and 5 lesions require tissue diagnosis (core needle biopsy preferred over FNA for solid masses)."
    difficulty: medium
    tags: [BIRADS, mammography, breast imaging, surgery]
  - front: "What is the Canadian breast cancer screening recommendation?"
    back: "Average risk: mammography every 2-3 years for women aged 50-74 (CTFPHC, though recently updated). High risk (BRCA, prior chest radiation, >25% lifetime risk): annual mammography + MRI starting at 30. Self-exam not recommended as screening. Clinical breast exam has insufficient evidence.\n\nCTFPHC guidelines differ from some international bodies that recommend starting at 40. The 2024 update moved toward screening from age 40. High-risk screening with MRI has higher sensitivity (>90%) than mammography alone (40-60%) in dense breast tissue."
    difficulty: medium
    tags: [breast cancer screening, mammography, CTFPHC, surgery]
  - front: "What is the triple assessment for a breast lump?"
    back: "(1) Clinical examination, (2) Imaging (mammogram for age >=30, ultrasound for age <30 or dense breasts), (3) Tissue sampling (core needle biopsy preferred, or FNA). All three must be concordant to rule out malignancy.\n\nTriple assessment is the standard Canadian approach to breast lumps. Core biopsy is preferred over FNA as it provides histological architecture and receptor status (ER, PR, HER2). Discordant results require excisional biopsy."
    difficulty: medium
    tags: [triple assessment, breast lump, biopsy, surgery]
  - front: "What are the surgical options for breast cancer and their indications?"
    back: "Breast-conserving surgery (lumpectomy + radiation): equivalent survival to mastectomy for Stage I-II. Contraindications to BCS: multicentric disease, prior chest radiation, large tumor relative to breast, positive margins after re-excision, first/second trimester pregnancy. Sentinel lymph node biopsy: standard for clinically node-negative.\n\nNSABP B-06 established equivalence of lumpectomy + radiation to mastectomy. Canadian guidelines follow NCCN. SLNB replaced axillary dissection for staging (ACOSOG Z0011: no completion ALND for 1-2 positive SLNs with BCS and planned radiation)."
    difficulty: hard
    tags: [breast surgery, lumpectomy, mastectomy, SLNB, surgery]
  - front: "What are the prognostic and predictive markers in breast cancer?"
    back: "ER/PR: positive predicts response to endocrine therapy. HER2: positive predicts response to trastuzumab. Ki-67: proliferation index. Oncotype DX (21-gene recurrence score): guides chemotherapy decision in ER+/HER2- node-negative. Luminal A (ER+/HER2-/low Ki-67) has best prognosis. Triple-negative (ER-/PR-/HER2-) has worst.\n\nMolecular subtyping guides adjuvant therapy in Canadian oncology practice. Oncotype DX is funded in most Canadian provinces for ER+/HER2-/node-negative or limited node-positive disease. TAILORx trial established that RS <25 does not benefit from chemotherapy."
    difficulty: hard
    tags: [breast cancer markers, ER, PR, HER2, Oncotype DX, surgery]
  - front: "What are the common benign breast conditions and their management?"
    back: "Fibroadenoma: rubbery, mobile, well-circumscribed; observe if <2cm and age <35, excise if growing. Fibrocystic changes: cyclical pain and lumpiness, reassurance. Breast cyst: aspiration (non-bloody = reassurance, bloody = cytology). Fat necrosis: post-trauma, may mimic cancer. Intraductal papilloma: bloody nipple discharge, ductogram, excision.\n\nFibrocystic changes are the most common breast condition. Phyllodes tumor (cystosarcoma phylloides) requires wide excision with margins. Proliferative lesions with atypia (ADH, ALH) increase cancer risk 4-5x and require annual screening."
    difficulty: medium
    tags: [benign breast disease, fibroadenoma, breast cyst, surgery]
  - front: "What is the approach to nipple discharge?"
    back: "Pathological discharge: unilateral, spontaneous, single duct, bloody/serous. Workup: mammogram + ultrasound, duct excision if suspicious. Most common cause of bloody discharge: intraductal papilloma. Physiological discharge: bilateral, multi-duct, non-bloody-check prolactin and TSH.\n\nNipple discharge accounts for 5% of breast clinic referrals. Galactorrhea (milky bilateral discharge) in non-lactating women requires evaluation for hyperprolactinemia. Canadian guidelines recommend surgical duct excision for persistent pathological discharge."
    difficulty: medium
    tags: [nipple discharge, intraductal papilloma, breast evaluation, surgery]
  - front: "What are the indications for genetic testing and prophylactic mastectomy in breast cancer?"
    back: "BRCA1/2 testing: early-onset breast cancer (<40), triple-negative breast cancer, bilateral breast cancer, ovarian cancer, male breast cancer, strong family history. BRCA1 carriers: 60-80% lifetime breast cancer risk. Prophylactic bilateral mastectomy reduces risk by >95%.\n\nCanadian guidelines (SOGC, CCMG) recommend genetic counseling for high-risk patients. Prophylactic bilateral salpingo-oophorectomy reduces breast and ovarian cancer risk in BRCA carriers. Risk-reducing mastectomy is a personal decision with extensive counseling."
    difficulty: hard
    tags: [BRCA, genetic testing, prophylactic mastectomy, surgery]
  - front: "What is the role of neoadjuvant chemotherapy in breast cancer?"
    back: "Indications: locally advanced (Stage III), inflammatory breast cancer, large tumors to enable BCS, HER2+ or triple-negative subtypes. Benefits: downstaging for surgical options, in vivo chemosensitivity assessment, pathological complete response (pCR) is a prognostic marker.\n\nCanadian oncology guidelines recommend neoadjuvant chemotherapy for inflammatory and locally advanced breast cancer. Achieving pCR (particularly in HER2+ and triple-negative) predicts excellent long-term outcomes. Residual disease guides escalation of adjuvant therapy."
    difficulty: hard
    tags: [neoadjuvant chemotherapy, breast cancer, downstaging, surgery]
  - front: "What is the management of ductal carcinoma in situ (DCIS)?"
    back: "Wide local excision (lumpectomy) with clear margins + whole breast radiation. Mastectomy for extensive DCIS. SLNB for mastectomy or large DCIS (occult invasion in 10-20%). Endocrine therapy (tamoxifen) reduces ipsilateral and contralateral recurrence. Van Nuys Prognostic Index guides management.\n\nDCIS accounts for 20-25% of screen-detected breast cancers in Canadian programs. Without treatment, 30-50% progress to invasive cancer over 10-20 years. Radiation after BCS reduces local recurrence by 50%. Observation alone may be considered for low-risk DCIS."
    difficulty: hard
    tags: [DCIS, ductal carcinoma in situ, breast conservation, surgery]
  - front: "Describe the staging and treatment algorithm for breast cancer based on hormone receptor and HER2 status."
    back: "Staging: TNM — tumor size (T1 ≤2cm, T2 2-5cm, T3 >5cm, T4 chest wall/skin), nodes (N0-3), metastases. Key biomarkers: ER/PR (hormone receptor-positive ~70%), HER2 (amplified ~15-20%), Ki-67 (proliferation index). Treatment by subtype: HR+/HER2-: surgery + adjuvant endocrine therapy (tamoxifen if premenopausal, aromatase inhibitor if postmenopausal) ± chemotherapy (based on Oncotype DX recurrence score) ± CDK4/6 inhibitor (palbociclib/ribociclib for advanced). HER2+: surgery + chemotherapy + trastuzumab (Herceptin) ± pertuzumab × 1 year. Triple-negative (ER-/PR-/HER2-): surgery + chemotherapy (most aggressive subtype); immunotherapy (pembrolizumab) if PD-L1+. Radiation: after breast-conserving surgery (lumpectomy), and select post-mastectomy cases (large tumors, positive nodes).\n\nOncotype DX is a 21-gene assay that guides chemotherapy decisions in HR+/HER2- early breast cancer — low recurrence score (<26) generally does not benefit from chemotherapy (TAILORx trial). Canadian Cancer Society guidelines recommend multidisciplinary tumor board review for all new breast cancers. Genetic testing (BRCA1/2) should be offered per Canadian guidelines for high-risk patients."
    difficulty: hard
    tags: [breast cancer, ER PR HER2, staging, trastuzumab, tamoxifen, surgery, oncology]
  - front: "What is the BRCA1/2 genetic testing criteria and how does it change breast cancer management?"
    back: "Genetic testing criteria (Canadian guidelines): breast cancer diagnosed ≤35 years; triple-negative breast cancer ≤60 years; bilateral breast cancer; male breast cancer; ovarian cancer (any age); breast + ovarian cancer in same patient; Ashkenazi Jewish ancestry with breast/ovarian cancer; family history suggestive of hereditary syndrome (multiple affected relatives, young onset). BRCA impact on management: Increased screening: MRI + mammography annually starting age 25-30; Risk reduction: bilateral risk-reducing mastectomy (reduces breast cancer risk by ~90%), bilateral salpingo-oophorectomy (by age 35-40 for BRCA1, 40-45 for BRCA2 — reduces ovarian cancer risk by ~80%); Treatment: PARP inhibitors (olaparib) are specifically effective in BRCA-mutated cancers; platinum-based chemotherapy may be more effective. Cascade testing of family members recommended.\n\nBRCA1 carriers have ~70% lifetime risk of breast cancer and ~40% risk of ovarian cancer. BRCA2: ~70% breast, ~15% ovarian. In Canada, genetic counselling is provided before and after testing through provincial genetics programs. PARP inhibitors exploit the DNA repair deficiency in BRCA-mutated tumors (synthetic lethality) and have transformed BRCA-associated cancer treatment."
    difficulty: hard
    tags: [BRCA, genetic testing, breast cancer, PARP inhibitors, risk reduction, oncology]
  - front: "What is the role of sentinel lymph node biopsy and Oncotype DX in breast cancer management?"
    back: "Sentinel lymph node biopsy (SLNB): identifies the first draining lymph node(s) from the tumor using blue dye and/or radioactive tracer; if SLNB is negative — no axillary lymph node dissection (ALND) needed (avoids lymphedema, nerve injury); if positive (1-2 nodes with micrometastasis): ALND may be omitted if meeting Z0011 criteria (T1-2, 1-2 positive SLNs, breast-conserving surgery with radiation, no extracapsular extension). Oncotype DX: 21-gene recurrence score for ER+/HER2-/node-negative early breast cancer; Low RS (<11): endocrine therapy alone; Intermediate RS (11-25): endocrine therapy alone in postmenopausal (TAILORx); may benefit from chemo if premenopausal and RS 16-25 (RxPONDER); High RS (≥26): endocrine therapy + chemotherapy.\n\nSLNB has replaced routine ALND and dramatically reduced surgical morbidity. The Z0011 trial changed practice by showing that ALND could be safely omitted in select patients with 1-2 positive sentinel nodes. Oncotype DX is funded in most Canadian provinces for eligible patients and is a critical tool for avoiding unnecessary chemotherapy. The TAILORx and RxPONDER trials provide the evidence base for Oncotype DX-guided treatment decisions."
    difficulty: hard
    tags: [sentinel lymph node, Oncotype DX, breast cancer, SLNB, surgery, oncology]
  - front: "What is the most common risk factor for gallbladder carcinoma?"
    back: "Chronic symptomatic gallstones (present in 70% of cases).\n\nOther risk factors include old age, female sex, gallbladder polyps, porcelain gallbladder, chronic infection (Salmonella, Helicobacter), primary sclerosing cholangitis, and abnormal pancreaticobiliary duct junction. Gallstones cause chronic inflammation predisposing to malignant transformation."
    difficulty: easy
    tags: [gallbladder cancer, risk factors, gallstones]
  - front: "What are the three categories of benign breast lesions and which carries increased cancer risk?"
    back: "1. Non-proliferative (no increased cancer risk). 2. Proliferative without atypia (low/slightly increased risk). 3. Atypical hyperplasia (increased risk of breast cancer).\n\nAtypical ductal hyperplasia (ADH) and atypical lobular hyperplasia (ALH) require complete resection and risk modification (avoid exogenous hormones, close follow-up). Non-proliferative lesions (e.g., breast cysts, fibrocystic changes) do not increase cancer risk."
    difficulty: medium
    tags: [breast, benign, fibrocystic, atypical hyperplasia]
  - front: "What are the clinical features of fibrocystic breast changes and how is it managed?"
    back: "Breast pain, focal areas of nodularity or cysts (upper outer quadrant), often bilateral, mobile, varies with menstrual cycle, nipple discharge (straw-like, brown, or green). Management: reassurance, analgesia (ibuprofen/ASA); for severe symptoms: OCP, danazol, or bromocriptine.\n\nFibrocystic changes are the most common non-proliferative benign breast condition, occurring most often between age 30 and menopause. They are rare after menopause unless HRT is used. Imaging (U/S, mammography) may be required to evaluate dominant masses."
    difficulty: easy
    tags: [fibrocystic breast, benign breast, management]
  - front: "What is the most common benign breast tumour in women under 30 and how is it managed?"
    back: "Fibroadenoma. Management: generally conservative with serial observation (q6 months ultrasound x 2 years). Consider excision if size 2-3 cm and growing on serial U/S, if symptomatic, if formed after age 35, or per patient preference.\n\nFibroadenomas are firm, rubbery, discrete, well-circumscribed, non-tender, mobile, and hormone-dependent (unlike cysts, aspiration yields no fluid). Core or excisional biopsy is sometimes required if concerned about malignancy. U/S and FNA alone cannot differentiate fibroadenoma from phyllodes tumour."
    difficulty: easy
    tags: [fibroadenoma, benign breast, young women]
  - front: "What is the most common cause of spontaneous, unilateral, bloody nipple discharge?"
    back: "Intraductal papilloma (solitary benign tumour within the central duct).\n\nIntraductal papilloma presents as pathologic nipple discharge, breast mass, or nodule on U/S. Surgical excision is indicated if symptomatic, large, atypia on biopsy, or progression on imaging. It can harbour areas of atypia or DCIS."
    difficulty: easy
    tags: [nipple discharge, intraductal papilloma, breast]
  - front: "What is pathognomonic for fat necrosis on mammography?"
    back: "Oil cysts on mammography are pathognomonic for fat necrosis.\n\nFat necrosis results from trauma (positive history in only 50%) or prior breast surgery. It presents as a firm, ill-defined mass with possible skin/nipple retraction, tenderness, and ecchymosis. It regresses spontaneously but requires complete imaging + biopsy to rule out carcinoma."
    difficulty: easy
    tags: [fat necrosis, breast, mammography, oil cyst]
  - front: "What is the lifetime risk of breast cancer in Canadian women, and what are the two greatest risk factors?"
    back: "1 in 8 (12.9% lifetime risk). The two greatest risk factors are female sex followed by age (83% of cases occur in women >50).\n\nBreast cancer is the leading cancer diagnosis in women in North America and the 2nd leading cause of cancer mortality in women. All-age relative survival is 87%. Approximately 1 in 31 women in Canada will die from breast cancer."
    difficulty: easy
    tags: [breast cancer, epidemiology, risk factors, Canada]
  - front: "What estrogen-related factors increase vs. decrease risk of breast cancer?"
    back: "Increased risk: nulliparity, first pregnancy >30 yr, menarche <12 yr, menopause >55 yr, >5 yr HRT use, >10 yr OCP use. Decreased risk: lactation, early menopause, early first childbirth.\n\nCumulative estrogen exposure is a key driver of breast cancer risk. BRCA1 and BRCA2 mutations, high breast density, radiation exposure (e.g., mantle radiation for Hodgkin's), alcohol use, obesity, and sedentary lifestyle also increase risk."
    difficulty: medium
    tags: [breast cancer, estrogen, risk factors, BRCA]
  - front: "What are the indications for BRCA1/2 genetic testing in a patient with breast cancer?"
    back: "Young patient (<35 yr), bilateral breast cancer in patients <50 yr, personal history of breast AND ovarian cancer, strong family history of breast/ovarian cancer, family history of male breast cancer.\n\nMale breast cancer accounts for <1% of cases and is most often hormone receptor positive. Stage-for-stage prognosis is similar to female breast cancer. BRCA testing guides risk-reducing interventions for the patient and family members."
    difficulty: medium
    tags: [BRCA, genetic testing, breast cancer, hereditary]
  - front: "What is the 'triple test' for breast cancer diagnosis?"
    back: "1. Clinical breast exam. 2. Imaging (mammography ± U/S for age ≥30; U/S alone for age <30, lactating, or pregnant). 3. Pathology (biopsy — core needle biopsy is most common).\n\nAll three components of the triple test must be concordant. A normal mammogram does not rule out cancer if clinical suspicion is present. Core needle biopsy under U/S or mammographic guidance is preferred over excisional biopsy for diagnosis."
    difficulty: easy
    tags: [breast cancer, triple test, diagnosis, biopsy]
  - front: "What mammographic features indicate higher risk of breast malignancy?"
    back: "Poorly defined or spiculated border mass, microcalcifications, architectural distortion, and interval mammographic changes.\n\nMRI has high sensitivity but low specificity; it is used annually alongside mammography for patients with ≥25% lifetime risk. Digital Breast Tomosynthesis (DBT) improves localization for noncalcified lesions. Galactography is used for pathologic nipple discharge."
    difficulty: medium
    tags: [breast cancer, mammography, microcalcifications, imaging]
  - front: "What pathological features are used in breast cancer staging?"
    back: "Tumour size and type, grade (modified Bloom-Richardson I-III), number of axillary nodes positive/total resected, extranodal extension, SLNB status, tumour biology (ER, PR, HER2/neu), margins, lymphovascular invasion (LVI), extensive in situ component (EIC), and dermal lymphatic involvement (inflammatory — automatically Stage IIIb).\n\nNegative margin is sufficient for invasive breast cancer; ≥2 mm margin is preferred for DCIS. Higher axillary lymph node level involvement (Levels I→II→III) indicates worse prognosis."
    difficulty: hard
    tags: [breast cancer, staging, pathology, ER PR HER2]
  - front: "What is ductal carcinoma in situ (DCIS) and how is it treated?"
    back: "Proliferation of malignant epithelial cells completely contained within breast ducts/lobules (non-invasive). Treatment: lumpectomy with wide excision margins + radiation (5-10% risk of invasive cancer). If large, high-grade, or multifocal: mastectomy (reduces invasive cancer risk to 1%). Consider adjuvant tamoxifen. 5-year survival is 99%.\n\nDCIS accounts for 80% of non-palpable breast lesions detected by screening mammography as microcalcifications. Risk of invasive ductal carcinoma in the same breast is up to 35% at 10 years without treatment."
    difficulty: medium
    tags: [DCIS, breast cancer, non-invasive, treatment]
  - front: "What is lobular carcinoma in situ (LCIS) and how does its management differ from DCIS?"
    back: "LCIS: neoplastic cells confined to breast lobule, no palpable mass or mammographic findings, usually incidental finding. Management: if found on core biopsy, excisional biopsy to rule out malignancy; if on excisional biopsy, wide excision NOT needed (LCIS is multicentric, managed as risk marker not precursor). Clinical follow-up + consider chemoprevention (e.g., tamoxifen).\n\nLCIS is a risk factor for invasive carcinoma (~1%/yr) in either breast, not a direct precursor lesion. Unlike DCIS, it is not treated with excision margins. It often co-exists with invasive lobular carcinoma."
    difficulty: hard
    tags: [LCIS, breast cancer, management, tamoxifen]
  - front: "What is the most common type of invasive breast cancer and what are its pathological characteristics?"
    back: "Invasive ductal carcinoma (IDC), representing 80% of invasive breast cancers. Characteristics: hard, scirrhous, infiltrating tentacles, gritty on cross-section; originates from ductal epithelium infiltrating supporting stroma; graded I (well-differentiated) to III (poorly-differentiated).\n\nSubtypes include tubular, mucinous, medullary, and inflammatory. Invasive lobular carcinoma (8-10%) is 20% bilateral, harder to detect on mammography (lacks microcalcifications), and usually ER/PR positive."
    difficulty: easy
    tags: [invasive ductal carcinoma, breast cancer, pathology]
  - front: "What is Paget's disease of the breast and how does it present?"
    back: "Ductal carcinoma that invades the nipple, presenting with scaling, ulceration, erythema, and an eczematous lesion of the nipple/areola.\n\nPaget's disease accounts for 1-3% of breast cancers and is almost always associated with an underlying in situ or invasive ductal carcinoma. Any non-healing eczematous nipple lesion should be biopsied to rule out Paget's disease."
    difficulty: easy
    tags: [Pagets disease, breast cancer, nipple, eczematous]
  - front: "What is inflammatory breast carcinoma and what is its most ominous clinical sign?"
    back: "The most aggressive form of breast cancer; ductal carcinoma invading and blocking dermal lymphatics. Most ominous sign: peau d'orange (skin dimpling resembling orange peel indicating advanced disease, Stage IIIb-IV).\n\nFeatures include erythema, skin edema, warmth, swollen and tender breast ± lump, nipple changes. It grows in nests (vs. solid tumour) and is automatically classified as Stage IIIb (dermal lymphatic involvement). It does not always present as a discrete mass."
    difficulty: medium
    tags: [inflammatory breast cancer, peau dorange, dermal lymphatics]
  - front: "What are the axillary lymph node levels and what does higher level involvement indicate?"
    back: "Level I: lateral to pectoralis minor. Level II: deep to pectoralis minor. Level III (apical): medial to pectoralis minor. Higher level involvement = worse prognosis.\n\nAxillary lymph node status is one of the most important prognostic factors in breast cancer. Sentinel lymph node biopsy (SLNB) is used to assess nodal status without full axillary dissection in clinically node-negative patients."
    difficulty: medium
    tags: [axillary lymph nodes, breast cancer, staging, prognosis]
  - front: "What metastatic workup is indicated in Stage II-IV breast cancer?"
    back: "Bone scan, abdominal U/S, CXR (or CT chest/abdomen/pelvis), and CT head (if specific neurological symptoms).\n\nBreast cancer most commonly metastasizes to bone, lung, liver, and brain. Metastatic workup is not routinely indicated in Stage I disease. MRI is used annually alongside mammography for patients at ≥25% lifetime risk."
    difficulty: medium
    tags: [breast cancer, metastatic workup, staging, bone scan]
