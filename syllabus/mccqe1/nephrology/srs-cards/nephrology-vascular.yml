# Nephrology Vascular (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What are the classic signs and symptoms of acute renal artery occlusion (renal infarction)?"
    back: "Fever, nausea/vomiting, flank pain; leukocytosis; markedly elevated LDH (>4x upper limit of normal with minimal AST/ALT elevation — strongly suggestive); acute onset HTN or sudden worsening of chronic HTN; renal dysfunction (elevated Cr if bilateral or solitary functioning kidney).\n\nRenal infarction is an important, potentially reversible cause of renal failure. LDH elevation disproportionate to AST/ALT is a hallmark. HTN results from RAAS activation due to ischemia of the kidney."
    difficulty: medium
    tags: [nephrology, renal infarction, renal artery occlusion, vascular disease, LDH]
  - front: "Which laboratory finding is 'strongly suggestive' of renal infarction?"
    back: "LDH >4x the upper limit of normal with minimal elevations in AST/ALT.\n\nThe disproportionate rise in LDH compared to AST/ALT is characteristic of renal infarction because LDH is abundant in renal tissue. This pattern helps distinguish renal infarction from hepatic causes of enzyme elevation."
    difficulty: easy
    tags: [nephrology, renal infarction, LDH, labs]
  - front: "What are the two main causes of renal artery stenosis and how do they differ?"
    back: "1. Atherosclerotic plaques (90%): affect proximal 1/3 of renal artery; males >55 yr, smokers. 2. Fibromuscular dysplasia (FMD, 10%): affects distal 2/3 of renal artery or segmental branches; young females (typical onset <30 yr).\n\nAtherosclerosis is by far the most common cause and is associated with cardiovascular risk factors. FMD is the classic cause in young women and typically involves the distal renal artery. Treatment strategies differ — FMD patients with confirmed disease should be considered for revascularization."
    difficulty: easy
    tags: [nephrology, renal artery stenosis, fibromuscular dysplasia, atherosclerosis, renovascular HTN]
  - front: "A 65-year-old male smoker with known diffuse atherosclerosis presents with refractory hypertension and spontaneous hypokalemia. His creatinine rises after starting an ACEI. What is the most likely diagnosis?"
    back: "Renal artery stenosis (ischemic renal disease / renovascular HTN) — likely atherosclerotic in etiology.\n\nClassic features of renovascular HTN include severe/refractory HTN, spontaneous hypokalemia (from renin-angiotensin-aldosterone activation), and paradoxical rise in Cr with ACEI/ARB (due to loss of efferent arteriolar constriction that was maintaining GFR). In a male >55 yr with atherosclerotic risk factors, atherosclerotic renal artery stenosis is the leading cause."
    difficulty: medium
    tags: [nephrology, renovascular HTN, renal artery stenosis, ACEI, hypokalemia]
  - front: "What is the gold standard investigation for renal artery stenosis and what is the best non-invasive screening test?"
    back: "Gold standard: renal arteriography (risk of contrast nephropathy). Best non-invasive screening: duplex Doppler ultrasound (assesses kidney size and blood flow; operator dependent). CT or MR angiography are effective non-invasive alternatives; avoid gadolinium if GFR <30 mL/min (risk of systemic dermal fibrosis).\n\nDigital subtraction angiography and CT/MR angiography are effective to establish stenosis. For MR angiography, gadolinium contrast is avoided when GFR <30 mL/min due to risk of nephrogenic systemic fibrosis. The STAR trial showed stenting provided no benefit over medical therapy for atherosclerotic renal artery stenosis."
    difficulty: medium
    tags: [nephrology, renal artery stenosis, investigations, duplex Doppler, angiography]
  - front: "According to the STAR trial (NEJM 2014), what is the recommended initial treatment for atherosclerotic renal artery stenosis with HTN or CKD?"
    back: "Medical management is recommended as first-line. Percutaneous renal artery angioplasty and stenting offers no significant benefit over comprehensive medical therapy alone for atherosclerotic renal artery stenosis.\n\nThe STAR (Stenting and Medical Therapy for Atherosclerotic Renal Artery Stenosis) trial showed no significant difference in cardiovascular events, renal outcomes, or mortality between stenting plus medical therapy vs. medical therapy alone. Stenting may be considered in select cases: uncontrolled HTN resistant to maximal pharmacotherapy, progressive renal function loss, or recurrent acute pulmonary edema with significant stenosis."
    difficulty: medium
    tags: [nephrology, renal artery stenosis, stenting, STAR trial, medical therapy]
  - front: "What are the three major categories of causes of renal vein thrombosis?"
    back: "1. Endothelial damage: blunt trauma, tumour infiltration (RCC), vasculitis, renal transplant rejection. 2. Stasis: severe volume loss (GI fluid loss, hemorrhage, dehydration), renal vein compression. 3. Hypercoagulability: nephrotic syndrome (especially membranous nephropathy), sepsis, oral contraceptives, disseminated malignancy, intrinsic hypercoagulability, sickle cell disease.\n\nNephrotic syndrome — especially membranous nephropathy — is the classic association with renal vein thrombosis due to urinary loss of anticoagulant proteins (antithrombin III, protein C, protein S) and increased hepatic synthesis of procoagulant factors."
    difficulty: medium
    tags: [nephrology, renal vein thrombosis, nephrotic syndrome, hypercoagulability, membranous nephropathy]
  - front: "What is the classic first presenting symptom of chronic renal vein thrombosis?"
    back: "Pulmonary embolism (PE) is the typical first presenting symptom of chronic renal vein thrombosis, along with increasing proteinuria and/or tubular dysfunction.\n\nChronic renal vein thrombosis develops collateral circulation which prevents the acute signs (flank pain, hematuria, rising creatinine). Instead, the thrombus propagates and dislodges causing PE. Acute renal vein thrombosis presents with N/V, flank pain, hematuria, elevated LDH, rising Cr, and sudden increase in proteinuria."
    difficulty: medium
    tags: [nephrology, renal vein thrombosis, pulmonary embolism, chronic]
  - front: "What is the treatment for renal vein thrombosis?"
    back: "Anticoagulation therapy: initial IV heparin, followed by warfarin (target INR 2.5) within 3–10 days, continued for minimum 1 year. Select cases suitable for thrombectomy or thrombolysis (streptokinase, urokinase, tPA).\n\nAnticoagulation aids recanalisation, improves renal function, and reduces thromboembolism risk. The minimum 1-year duration reflects the underlying thrombophilic state (often nephrotic syndrome). Thrombolysis is reserved for cases not responding to anticoagulation."
    difficulty: easy
    tags: [nephrology, renal vein thrombosis, anticoagulation, warfarin, treatment]
  - front: "What is atheroembolic renal disease and what are its characteristic laboratory/biopsy findings?"
    back: "Progressive renal insufficiency from embolic obstruction of small- and medium-sized renal vessels by atheromatous emboli. Lab: eosinophilia, eosinophiluria, hypocomplementemia. Biopsy: needle-shaped cholesterol clefts (from tissue-processing artifacts) with surrounding tissue reaction in small/medium vessels.\n\nAtheroembolic disease can occur spontaneously or following arterial manipulation (angiography, surgery, angioplasty). Anticoagulants and thrombolytics can worsen disease by interfering with ulcerated plaque healing. Prognosis is poor — at least one-third develop ESRD. There is no effective specific treatment."
    difficulty: medium
    tags: [nephrology, atheroembolic renal disease, cholesterol emboli, eosinophilia, biopsy]
  - front: "What is the pathophysiology of how renal artery stenosis causes secondary hypertension?"
    back: "Decreased renal perfusion → increased renin release → increased angiotensin II production → 1) generalized arteriolar constriction (immediate BP rise) and 2) aldosterone release → Na⁺ and water retention (sustained BP elevation). GFR is maintained by angiotensin II-induced efferent arteriolar constriction which raises filtration fraction (GFR/RBF). Elevated BP leads to further kidney damage and worsening HTN.\n\nThis is renovascular HTN — the most common cause of secondary HTN (1-2% of all hypertensive patients). ACEI/ARB effectively lower BP by blocking angiotensin II and efferent arteriolar constriction. However, in bilateral RAS or unilateral RAS in a solitary kidney, ACEI/ARB can precipitate acute renal failure by removing the efferent tone that was maintaining GFR."
    difficulty: hard
    tags: [nephrology, renovascular HTN, renin, angiotensin II, RAAS, secondary hypertension, GFR]
