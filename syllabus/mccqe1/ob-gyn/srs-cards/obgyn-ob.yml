  - front: "When is treatment for bacterial vaginosis (BV) indicated in asymptomatic patients?"
    back: "Treat asymptomatic BV only if: high-risk pregnancy, prior IUD insertion, gynecologic surgery, induced abortion, or upper tract instrumentation\n\nBV is treated in symptomatic patients. Asymptomatic non-pregnant patients typically do not require treatment due to risks outweighing benefits."
    difficulty: medium
    tags: [gynecology, infectious disease, bacterial vaginosis, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
