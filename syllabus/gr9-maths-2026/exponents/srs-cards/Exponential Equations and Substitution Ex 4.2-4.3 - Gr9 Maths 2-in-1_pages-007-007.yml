# Gr 9 Maths 2-in-1 — exponents / Exponential Equations and Substitution
deck: "Corpus::Gr9 Maths::Exponential Equations"
notes:
  - guid: 11a2b3c4d5e60718
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Correct the false statement (Q10.1): x² + x² = 2x⁴. What is the right-hand side?"
      Back: "It is FALSE. x² + x² are LIKE terms (same base and exponent), so you ADD the coefficients, you do NOT add exponents.\nx² + x² = 2x².\nThe exponent stays 2; only the count of terms (the coefficient) becomes 2.\nAdding exponents is for MULTIPLYING (x²·x² = x⁴), not for adding."
    tags: ["exponents", "common-mistake", "subject:exponents"]
  - guid: 22b3c4d5e6f71829
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Correct the false statement (Q10.2): 1/(6x⁻²) = 6x². What is correct?"
      Back: "It is FALSE. The 6 is NOT affected by the negative exponent — only x⁻² is.\n1/(6x⁻²) = 1/(6 · 1/x²) = 1/(6/x²) = x²/6.\nSo 1/(6x⁻²) = x²/6 (= (1/6)x²), NOT 6x².\nMethod: x⁻² in the denominator moves up as x²; the 6 stays in the denominator."
    tags: ["exponents", "negative-exponents", "common-mistake", "subject:exponents"]
  - guid: 33c4d5e6f7081930
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "True or False, correcting if false (Q11.1–11.4): 2a⁻³ = 1/(2a³)? (−1)⁵ = −1? (2ab)³ = 6a³b⁹? a⁰ = 0?"
      Back: "Q11.1 2a⁻³ = 1/(2a³): FALSE. Only a is to the −3, so 2a⁻³ = 2/a³ (the 2 stays on top).\nQ11.2 (−1)⁵ = −1: TRUE (odd power keeps the negative).\nQ11.3 (2ab)³ = 6a³b⁹: FALSE. = 2³a³b³ = 8a³b³ (cube 2 → 8, and b³ not b⁹).\nQ11.4 a⁰ = 0: FALSE. a⁰ = 1 (for a ≠ 0)."
    tags: ["exponents", "true-false", "subject:exponents"]
  - guid: 44d5e6f708192041
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "True or False, correcting if false (Q11.5–11.8): 2⁻¹ = −2? a⁻³a² = 1/a? (3/4)⁻¹ = 4/3? a³b³/(ab⁷) = (a/b)²?"
      Back: "Q11.5 2⁻¹ = −2: FALSE. 2⁻¹ = 1/2.\nQ11.6 a⁻³a² = 1/a: TRUE. a^(−3+2) = a⁻¹ = 1/a.\nQ11.7 (3/4)⁻¹ = 4/3: TRUE (a negative power flips the fraction).\nQ11.8 a³b³/(ab⁷) = (a/b)²: FALSE. = a^(3−1)b^(3−7) = a²b⁻⁴ = a²/b⁴, which is (a/b²)², not (a/b)²."
    tags: ["exponents", "true-false", "subject:exponents"]
  - guid: 55e6f70819204152
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "True or False, correcting if false (Q11.9–11.10): 2³ × 2⁴ = 4⁷? 5²÷5⁵ = 1/5³?"
      Back: "Q11.9 2³ × 2⁴ = 4⁷: FALSE. Same base: add exponents but KEEP the base. 2³×2⁴ = 2⁷ (not 4⁷).\nQ11.10 5² ÷ 5⁵ = 1/5³: TRUE. 5^(2−5) = 5⁻³ = 1/5³.\nKey rule: when multiplying/dividing same-base powers, the base never changes — only exponents are added/subtracted."
    tags: ["exponents", "true-false", "subject:exponents"]
  - guid: 66f708192041526a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Substitution (Ex 4.2 Q1): Calculate a × bᶜ where a = 3, b = 2, c = −1."
      Back: "Substitute carefully: a × bᶜ = 3 × 2⁻¹.\n2⁻¹ = 1/2.\n= 3 × ½ = 3/2 = 1½.\nMethod: work out the power bᶜ first (2⁻¹ = ½), then multiply by a."
    tags: ["exponents", "substitution", "subject:exponents"]
  - guid: 7708192041526a7b
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Substitution (Ex 4.2 Q2): Calculate (ab)ᶜ where a = 1, b = 5, c = −2."
      Back: "(ab)ᶜ = (1×5)⁻² = 5⁻² = 1/5² = 1/25.\nMethod: simplify inside the bracket first (1×5 = 5), then apply the negative exponent: 5⁻² = 1/25."
    tags: ["exponents", "substitution", "subject:exponents"]
  - guid: 88192041526a7b8c
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Substitution (Ex 4.2 Q3): Calculate aᵇ + bᶜ where a = 2, b = −1, c = 3."
      Back: "aᵇ + bᶜ = 2⁻¹ + (−1)³.\n2⁻¹ = ½.\n(−1)³ = −1 (odd power keeps the sign).\n= ½ + (−1) = ½ − 1 = −½.\nMethod: evaluate each power separately (mind the sign of (−1)³), then add."
    tags: ["exponents", "substitution", "subject:exponents"]
  - guid: 992041526a7b8c9d
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "How do you solve an exponential equation like 2ˣ = 2³ (Ex 4.3, the method)?"
      Back: "Method (equal-base method): rewrite BOTH sides as powers of the SAME base. Once the bases are equal, the exponents must be equal — drop the bases and solve for x.\nExample 1.1: 2ˣ = 2³ ⇒ x = 3.\nExample 1.2: 5^(x−1) = 5² ⇒ x − 1 = 2 ⇒ x = 3.\nIf a side is not already a power of the base, convert it (e.g. 9 = 3², 64 = 2⁶, 81 = 3⁴)."
    tags: ["exponents", "exponential-equations", "method", "subject:exponents"]
  - guid: aa2041526a7b8c9e
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 3^(2x) = 3⁶ (1.3) and 3ˣ = 9 (1.4)."
      Back: "1.3: 3^(2x) = 3⁶ ⇒ 2x = 6 ⇒ x = 3.\n1.4: 3ˣ = 9. Write 9 = 3². So 3ˣ = 3² ⇒ x = 2.\nMethod: make bases equal, then equate exponents."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: bb31526a7b8c9eaf
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 8ˣ = 64 (1.5) and 2ˣ = ¼ (1.6)."
      Back: "1.5: 8ˣ = 64. Use base 2: 8 = 2³, 64 = 2⁶, so 2^(3x) = 2⁶ ⇒ 3x = 6 ⇒ x = 2. (Or directly 8² = 64.)\n1.6: 2ˣ = ¼ = 1/2² = 2⁻². So 2ˣ = 2⁻² ⇒ x = −2.\nMethod: convert each number to a power of the common base, including reciprocals as negative exponents."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: cc426a7b8c9eafb0
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 7ˣ = 1 (1.7) and 5^(2x) = 5 (1.8)."
      Back: "1.7: 7ˣ = 1. Since any non-zero base to the power 0 is 1, 7ˣ = 7⁰ ⇒ x = 0.\n1.8: 5^(2x) = 5 = 5¹ ⇒ 2x = 1 ⇒ x = ½.\nMethod: recognise 1 = base⁰ and a lone base = base¹."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: dd537b8c9eafb0c1
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 11ˣ = 121 (1.9) and 10ˣ = 0,1 (1.10)."
      Back: "1.9: 11ˣ = 121 = 11² ⇒ x = 2.\n1.10: 10ˣ = 0,1 = 1/10 = 10⁻¹ ⇒ x = −1.\nMethod: rewrite the right side as a power of the base (0,1 = 10⁻¹)."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: ee648c9eafb0c1d2
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 3^(x−2) = 81 (1.11) and (1/3)ˣ = 3 (1.13)."
      Back: "1.11: 81 = 3⁴, so 3^(x−2) = 3⁴ ⇒ x − 2 = 4 ⇒ x = 6.\n1.13: (1/3)ˣ = 3. Write 1/3 = 3⁻¹, so 3⁻ˣ = 3¹ ⇒ −x = 1 ⇒ x = −1.\nMethod: convert to common base 3; a reciprocal base becomes a negative exponent."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: ff759eafb0c1d2e3
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 9ˣ = 27 (1.14) and 2ˣ = 0,125 (1.15)."
      Back: "1.14: 9ˣ = 27. Base 3: 9 = 3², 27 = 3³, so 3^(2x) = 3³ ⇒ 2x = 3 ⇒ x = 3/2.\n1.15: 2ˣ = 0,125 = 1/8 = 1/2³ = 2⁻³ ⇒ x = −3.\nMethod: pick the smallest common base (3 and 2 respectively); express decimals as fractions then powers."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: 0086afb0c1d2e3f4
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 5ˣ = 0,04 (1.16) and 3^(2x+1) = 3^(x+3) (1.17)."
      Back: "1.16: 5ˣ = 0,04 = 4/100 = 1/25 = 1/5² = 5⁻² ⇒ x = −2.\n1.17: bases already equal, so equate exponents: 2x + 1 = x + 3 ⇒ x = 2.\nMethod: equal-base method; when both exponents are expressions, set them equal and solve the linear equation."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: 1197b0c1d2e3f405
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 2ˣ·2³ = 32 (1.18) and (4ˣ)² = 64 (1.19)."
      Back: "1.18: 2ˣ·2³ = 2^(x+3) = 32 = 2⁵ ⇒ x + 3 = 5 ⇒ x = 2.\n1.19: (4ˣ)² = 4^(2x) = 64. Base 4: 64 = 4³, so 4^(2x) = 4³ ⇒ 2x = 3 ⇒ x = 3/2.\nMethod: first combine the left side using exponent laws into a single power, then match bases."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: 22a8c1d2e3f40516
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 5ˣ/5² = 125 (1.20) and 8^(x+1) = 1/8 (1.21)."
      Back: "1.20: 5ˣ/5² = 5^(x−2) = 125 = 5³ ⇒ x − 2 = 3 ⇒ x = 5.\n1.21: 8^(x+1) = 1/8 = 8⁻¹ ⇒ x + 1 = −1 ⇒ x = −2.\nMethod: simplify the left to one power (Law 2), then equate exponents; 1/8 = 8⁻¹."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: 33b9d2e3f4051627
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): 7^(x−2) = 1 (1.22) and 9^(x−2) = 81 (1.23)."
      Back: "1.22: 7^(x−2) = 1 = 7⁰ ⇒ x − 2 = 0 ⇒ x = 2.\n1.23: 9^(x−2) = 81. Base 3: 9 = 3², 81 = 3⁴, so 3^(2(x−2)) = 3⁴ ⇒ 2(x−2) = 4 ⇒ x − 2 = 2 ⇒ x = 4. (Or base 9: 81 = 9² ⇒ x−2 = 2 ⇒ x = 4.)\nMethod: 1 = base⁰; otherwise equal-base method."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: 44c0e3f405162738
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3, cubic-type): x³ = −8 (1.24) and 2x³ = 54 (1.25)."
      Back: "1.24: x³ = −8 ⇒ x = ∛(−8) = −2 (since (−2)³ = −8).\n1.25: 2x³ = 54 ⇒ x³ = 27 ⇒ x = ∛27 = 3.\nMethod: isolate x³, then take the cube root. Unlike square roots, a cube root of a negative number is negative."
    tags: ["exponents", "cube-root", "subject:exponents"]
  - guid: 55d1f40516273849
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Solve for x (Ex 4.3): x = ∛27 (1.26), x⁻¹ = ½ (1.27) and x⁻² = 4/9 (1.28)."
      Back: "1.26: x = ∛27 = 3.\n1.27: x⁻¹ = ½ means 1/x = ½ ⇒ x = 2.\n1.28: x⁻² = 4/9 means 1/x² = 4/9 ⇒ x² = 9/4 ⇒ x = ±√(9/4) = ±3/2.\nMethod: a negative exponent means reciprocal; for x² remember TWO answers (±)."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: 66e205162738495a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Ex 4.3 Q2: Determine x if (p⁵)³ = p²·pˣ. Q3: find product of x and y if 2ˣ + 3ʸ = 41, x,y natural."
      Back: "Q2: (p⁵)³ = p¹⁵ and p²·pˣ = p^(2+x). Equate: 15 = 2 + x ⇒ x = 13.\nQ3: need 2ˣ + 3ʸ = 41 with natural numbers. Try powers: 2⁵ = 32 and 3² = 9 ⇒ 32 + 9 = 41 ✓. So x = 5, y = 2.\nProduct x·y = 5 × 2 = 10."
    tags: ["exponents", "exponential-equations", "subject:exponents"]
  - guid: 77f30617283945ab
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exponential Equations"
    fields:
      Front: "Ex 4.3 Q4: with x = 3 and y = −2, which sign (<, >, =) goes in each box? 4.1 y² □ x²  4.2 (3³)³ □ (y²)²  4.3 (x·y)⁴ □ 4ˣʸ"
      Back: "4.1 y² = (−2)² = 4; x² = 3² = 9. So 4 < 9 ⇒ y² < x².\n4.2 (3³)³ = 3⁹ = 19683; (y²)² = ((−2)²)² = 4² = 16. So 19683 > 16 ⇒ (3³)³ > (y²)².\n4.3 (x·y)⁴ = (3×−2)⁴ = (−6)⁴ = 1296; 4ˣʸ = 4^(3×−2) = 4⁻⁶ = 1/4096. So 1296 > 1/4096 ⇒ (x·y)⁴ > 4ˣʸ.\nMethod: substitute, evaluate both sides fully, then compare."
    tags: ["exponents", "substitution", "compare", "subject:exponents"]
