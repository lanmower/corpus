# Trauma & ATLS Principles (Surgery) - generated from srs-mccqe1
cards:
  - front: "What is the primary survey in ATLS (Advanced Trauma Life Support)?"
    back: "ABCDE: Airway (maintain with cervical spine precaution), Breathing (ventilation, tension pneumothorax), Circulation (hemorrhage control, shock), Disability (neurological status, GCS), Exposure (expose patient, prevent hypothermia)\n\nATLS primary survey focuses on immediately life-threatening injuries. Life-saving interventions are performed as problems are identified (not sequentially). Resuscitation occurs simultaneously with the survey. Secondary survey follows after stabilization."
    difficulty: easy
    tags: [ATLS, primary survey, ABCDE, trauma assessment, surgery]
  - front: "What is the diagnosis and management of tension pneumothorax?"
    back: "Tension pneumothorax: dyspnea, absent ipsilateral breath sounds, tracheal deviation, hypotension, JVD; needle decompression 2nd intercostal space midclavicular line immediately, then chest tube\n\nTension pneumothorax is a clinical diagnosis — do NOT delay treatment for CXR. Needle decompression is temporizing; definitive treatment is chest tube (28-32Fr) in 5th intercostal space anterior axillary line (safe triangle). Mechanism: air accumulates under pressure, compresses mediastinum."
    difficulty: hard
    tags: [tension pneumothorax, needle decompression, chest tube, ATLS, surgery]
  - front: "A multiply-injured patient has hemoperitoneum on FAST exam and BP 80/50. What is the immediate next step?"
    back: "Emergent laparotomy for hemorrhage control — permissive hypotension (SBP 80-90 mmHg) until surgical control, massive transfusion protocol (1:1:1 ratio PRBCs:FFP:platelets)\n\nFAST (Focused Assessment with Sonography in Trauma) identifies intraperitoneal blood. Hemodynamically unstable patient with positive FAST → operating room. Damage control surgery: control bleeding and contamination first, pack abdomen, ICU resuscitation, then definitive repair."
    difficulty: hard
    tags: [FAST exam, hemoperitoneum, damage control surgery, massive transfusion, surgery, trauma]
  - front: "What is damage control resuscitation (DCR) and its key components?"
    back: "DCR: 1:1:1 ratio of PRBCs:FFP:platelets to correct coagulopathy, permissive hypotension until surgical control, early tranexamic acid (within 3h of injury), minimize crystalloids, prevent lethal triad (hypothermia, acidosis, coagulopathy)\n\nCRASH-2 trial: tranexamic acid within 3 hours of injury reduces mortality from hemorrhage. The lethal triad (hypothermia <35°C, acidosis pH <7.3, coagulopathy INR >1.5) is a predictor of mortality. DCR replaces ATLS crystalloid-heavy approach."
    difficulty: hard
    tags: [damage control resuscitation, DCR, massive transfusion, tranexamic acid, surgery, trauma]
  - front: "What are the 4 classes of hemorrhagic shock and what defines Class III/IV?"
    back: "Class I: <750 mL (<15%); Class II: 750-1500 mL (15-30%); Class III: 1500-2000 mL (30-40%) — altered consciousness, marked tachycardia, decreased BP; Class IV: >2000 mL (>40%) — immediately life-threatening, severe hypotension, mental obtundation\n\nATLS shock classification guides fluid resuscitation and blood product decisions. Class I-II may respond to crystalloid alone. Class III-IV require blood products. End-points: normalization of HR, MAP, urine output (0.5 mL/kg/h), lactate clearance."
    difficulty: medium
    tags: [hemorrhagic shock, ATLS classification, blood loss, resuscitation, surgery]
  - front: "What is a flail chest and how does it cause respiratory failure?"
    back: "Flail chest: ≥3 consecutive ribs fractured in ≥2 places creating a free-floating segment; paradoxical breathing movement → poor respiratory mechanics; treat with positive pressure ventilation for respiratory failure, analgesia\n\nPulmonary contusion underneath flail segment is the primary cause of respiratory failure. Management: aggressive analgesia (epidural preferred), positive pressure ventilation if respiratory failure, surgical rib fixation for severe cases. Incentive spirometry and physiotherapy for mild cases."
    difficulty: hard
    tags: [flail chest, rib fracture, paradoxical breathing, pulmonary contusion, surgery, trauma]
  - front: "What is the management of pelvic fractures with hemodynamic instability?"
    back: "Pelvic binder immediately to reduce volume, MTP (massive transfusion protocol), angioembolization for arterial bleeding (IR) or pre-peritoneal pelvic packing (surgery) — external fixation for mechanical instability\n\nPelvic fractures can cause massive retroperitoneal hemorrhage (4-6L). Pelvic binder closes open book fractures, reducing pelvic volume and decreasing venous bleeding. CT angiography identifies arterial bleeding for embolization. Laparotomy contraindicated without pelvic bleeding control first."
    difficulty: hard
    tags: [pelvic fracture, hemorrhage control, pelvic binder, embolization, surgery, trauma]
  - front: "What is the Glasgow Coma Scale (GCS) and how is it used in trauma?"
    back: "GCS: Eye (4: spontaneous, 3: to voice, 2: to pain, 1: none) + Verbal (5-1) + Motor (6-1) = max 15; Mild TBI: GCS 13-15; Moderate: 9-12; Severe: ≤8\n\nGCS ≤8 requires endotracheal intubation (cannot protect airway). GCS guides neurological monitoring and prognosis. ATLS primary survey uses GCS and pupillary responses in the Disability component. Serial GCS assessments detect deterioration."
    difficulty: easy
    tags: [GCS, Glasgow Coma Scale, TBI, traumatic brain injury, ATLS, surgery]
  - front: "What is a traumatic aortic injury and what are its clinical and imaging features?"
    back: "Traumatic aortic injury: deceleration mechanism (MVA, fall from height); may be asymptomatic; CXR: widened mediastinum >8cm, loss of aortic knob, left apical cap; diagnose with CT angiography; treat with TEVAR (endovascular)\n\nAortic injury occurs at the isthmus (site of ligamentum arteriosum) — 90% of cases. Widened mediastinum on CXR has high sensitivity but low specificity. CT angiography confirms and grades injury. TEVAR has replaced open repair as standard of care."
    difficulty: hard
    tags: [aortic injury, widened mediastinum, TEVAR, deceleration injury, surgery, trauma]
  - front: "What is the Ottawa Ankle Rule and when can ankle radiography be avoided?"
    back: "Ottawa Ankle Rule: X-ray NOT needed if: no bony tenderness at posterior inferior tip of fibula or tibia, AND able to bear weight for 4 steps; SAVES up to 30-40% unnecessary radiographs\n\nOttawa Rules have 96-100% sensitivity for clinically significant fractures. Apply to patients ≥2 years old with normal mental status and no distracting injuries. Ottawa Foot Rule: tenderness at navicular or 5th metatarsal base requires X-ray."
    difficulty: easy
    tags: [Ottawa Ankle Rule, ankle fracture, clinical decision rule, emergency medicine, surgery]
  - front: "What is the NEXUS criteria and how does it help in cervical spine clearance?"
    back: "NEXUS: cervical spine imaging NOT required if: no posterior midline tenderness, no focal neurological deficit, normal alertness, no intoxication, no distracting painful injury\n\nNEXUS criteria allow clinical clearance of cervical spine without imaging in low-risk trauma patients, reducing unnecessary radiography. Canadian C-Spine Rule has higher specificity for identifying patients who need imaging. CT cervical spine indicated for all high-energy mechanism trauma with any NEXUS criterion present."
    difficulty: medium
    tags: [cervical spine clearance, NEXUS, Canadian C-Spine Rule, trauma assessment, surgery]
  - front: "A trauma patient develops sudden onset oliguria, increasing abdominal distension, and rising peak airway pressures on the ventilator post-laparotomy. What is the diagnosis?"
    back: "Abdominal compartment syndrome (ACS): intraabdominal pressure >20 mmHg with new organ dysfunction; treat with decompressive laparotomy\n\nACS results from bowel edema, massive transfusion, abdominal packing, or reperfusion edema. Diagnosis: bladder pressure >20 mmHg x2 measurements. Decompressive laparotomy with temporary abdominal closure (vacuum dressing) is the treatment. Oliguria, respiratory failure, and cardiovascular compromise are cardinal features."
    difficulty: hard
    tags: [abdominal compartment syndrome, intraabdominal pressure, decompressive laparotomy, surgery, trauma]
  - front: "What are the management principles for open fractures?"
    back: "IV antibiotics within 1 hour (cefazolin ± gentamicin), tetanus prophylaxis, saline-soaked dressing, urgent orthopedic consultation; surgical debridement and washout within 6-8 hours; external fixation for unstable fractures\n\nGustilo-Anderson classification guides antibiotic duration: Type I-II: 24-48h cefazolin; Type III: 72h cefazolin + aminoglycoside ± metronidazole. Antibiotic prophylaxis and debridement timing are most important factors for infection prevention."
    difficulty: medium
    tags: [open fracture, Gustilo-Anderson, IV antibiotics, debridement, surgery, trauma]
  - front: "What is the role of the FAST exam in trauma and what does it assess?"
    back: "FAST: Focused Assessment with Sonography in Trauma; assesses 4 windows: pericardial (cardiac tamponade), RUQ (hepatorenal space, Morrison pouch), LUQ (splenorenal), suprapubic (bladder/pelvis) — detects free fluid (blood)\n\nFAST is a bedside screening tool for hemoperitoneum and hemopericardium in trauma. Sensitivity 85-90% for intraperitoneal fluid. Negative FAST does not exclude abdominal injury. Extended FAST (eFAST) adds bilateral thorax windows to assess for pneumothorax and hemothorax."
    difficulty: easy
    tags: [FAST exam, trauma ultrasound, hemoperitoneum, pericardial tamponade, surgery]
  - front: "A patient has a stab wound to the right chest. He is hemodynamically stable. CXR shows a moderate hemothorax. Management?"
    back: "Chest tube (32-36Fr) in 5th intercostal space anterior axillary line (safe triangle); drain hemothorax to prevent clotted hemothorax; video-assisted thoracoscopy (VATS) for retained hemothorax\n\nHemothorax: blood in pleural space. Massive hemothorax: >1500 mL immediate drainage or >200 mL/h for 4h → thoracotomy. Tube thoracostomy drains hemothorax and allows monitoring of bleeding rate. VATS for retained/clotted hemothorax within 72-96h."
    difficulty: medium
    tags: [hemothorax, chest tube, thoracostomy, VATS, surgery, trauma]
  - front: "A 62-year-old man presents with sudden-onset tearing chest pain radiating to the interscapular region. He is diaphoretic. BP is 170/100 in the right arm and 130/80 in the left arm. CT angiography shows an intimal flap starting 2 cm distal to the subclavian artery origin, extending to the renal arteries. What is the classification and most appropriate management?\n\nA) Stanford Type A — emergency surgical repair\nB) Stanford Type B — uncomplicated; IV antihypertensives, rate control, pain control\nC) Stanford Type B complicated — TEVAR (thoracic endovascular aortic repair)\nD) Stanford Type B — immediate open surgical repair"
    back: "B) Stanford Type B — uncomplicated; IV antihypertensives, rate control, pain control\n\nStanford classification: Type A = involves ascending aorta (regardless of origin site) → emergency surgery (high mortality otherwise). Type B = descending aorta only (origin distal to L subclavian). This patient has Type B aortic dissection. UNCOMPLICATED Type B dissection (no malperfusion, no rupture, no refractory pain): initial management is intensive medical therapy — IV beta-blockade (labetalol, esmolol) as first line (HR target <60, systolic BP 100–120 mmHg), then vasodilators if needed. COMPLICATED Type B (malperfusion — renal, limb, visceral; rupture; refractory pain): TEVAR is preferred over open surgery. Medical management alone for uncomplicated Type B has survival equivalent to surgery."
    difficulty: hard
    tags: [Aorta, MCQ, Toronto Notes]
  - front: "A 68-year-old man with a known 5.8cm infrarenal abdominal aortic aneurysm (AAA) presents with acute onset of severe back and flank pain. BP is 100/60, HR 116. He has a pulsatile abdominal mass. On CT, there is a periaortic hematoma and contrast extravasation. He is awake and talking. What is the immediate management?\n\nA) Emergency exploratory laparotomy or EVAR — immediate repair regardless of BP\nB) Resuscitate to systolic BP 120–130 mmHg with IV fluids, then proceed to OR\nC) Permissive hypotension (systolic ~70–80 mmHg) maintained until aortic control achieved in OR\nD) IV tranexamic acid to reduce hemorrhage, then transfer to a tertiary vascular centre"
    back: "C) Permissive hypotension (systolic ~70–80 mmHg) maintained until aortic control achieved in OR\n\nRuptured AAA management: 'permissive hypotension' (systolic BP 70–80 mmHg) — aggressive fluid resuscitation before aortic control causes the 'pop the clot' phenomenon, increasing bleeding. Maintain systolic ~70–80 mmHg to preserve cerebral and coronary perfusion without dislodging the retroperitoneal tamponade. Immediate transfer to OR. EVAR (if anatomy suitable) has lower 30-day mortality than open surgery for hemodynamically stable patients. Open repair for unstable patients or unsuitable anatomy. Blood product resuscitation in 1:1:1 ratio (PRBC:FFP:Plt) — damage control principles. Aggressive crystalloid resuscitation is harmful (dilutional coagulopathy)."
    difficulty: hard
    tags: [Aorta, MCQ, Toronto Notes]
  - front: "A 45-year-old woman with Marfan syndrome has an aortic root diameter of 44mm and is planning pregnancy. She has no prior dissection. What is the appropriate aortic root threshold for prophylactic surgery, and what counseling should be provided?\n\nA) 50mm threshold — defer surgery; proceed with pregnancy with close monitoring\nB) 45–50mm — surgery should be completed before pregnancy given Marfan status\nC) 47mm — pregnancy contraindicated; surgery mandatory immediately\nD) Aortic root size alone is not sufficient — valve function determines surgical timing"
    back: "B) 45–50mm — surgery should be completed before pregnancy given Marfan status\n\nMarfan syndrome aortic surgery thresholds: Prophylactic aortic root surgery recommended at: ≥50mm (general population); ≥45mm if risk factors (family history of dissection, rapid growth >3mm/year, severe AR, desire for pregnancy). For women with Marfan syndrome planning pregnancy: ESC 2018 recommends completing prophylactic aortic surgery before pregnancy if aortic diameter ≥45mm, given that pregnancy further increases dissection risk (cardiac output increases 40%, increased wall stress). At 44mm approaching the 45mm threshold in a woman planning pregnancy, surgical consultation and likely prophylactic surgery before conception is appropriate."
    difficulty: hard
    tags: [Aorta, MCQ, Toronto Notes]
  - front: "A 70-year-old man with a 5.2cm AAA is referred for elective repair. He has COPD (FEV1 55%), CAD (EF 45%), and creatinine 1.8. His anatomy shows a 15mm infrarenal neck with mild angulation (55 degrees) and no significant iliac tortuosity. Which repair strategy is preferred?\n\nA) Open surgical repair — EVAR not appropriate for compromised pulmonary function\nB) EVAR — associated with lower 30-day mortality, less cardiopulmonary stress, appropriate anatomy\nC) Watchful waiting — repair threshold for symptomatic AAA is 6.0cm\nD) Hybrid repair — endovascular with iliac extension and open renal debranching"
    back: "B) EVAR — associated with lower 30-day mortality, less cardiopulmonary stress, appropriate anatomy\n\nEVAR vs. Open repair for elective AAA: EVAR has significantly lower 30-day operative mortality (1.2% vs 4.8%) and is preferred in patients with significant cardiopulmonary comorbidities (EVAR 1, DREAM, OVER trials). Long-term survival is similar at 2–4 years, with EVAR requiring more reinterventions (endoleak surveillance, sac regression). EVAR anatomical requirements: neck length ≥15mm, neck angulation <60°, neck diameter 18–32mm. This patient meets EVAR criteria: 15mm neck, 55° angulation (acceptable), no prohibitive iliac disease. Given his COPD and CAD, EVAR's lower cardiopulmonary stress makes it the appropriate choice."
    difficulty: hard
    tags: [Aorta, MCQ, Toronto Notes]
  - front: "A 65-year-old male smoker with claudication at 200m has an ABI of 0.58 in the right leg and 0.72 in the left. His symptoms have been stable for 2 years. He is on aspirin and a statin. Which additional intervention has the STRONGEST mortality-reducing evidence in PAD?\n\nA) Endovascular angioplasty + stenting of the right iliac artery\nB) Cilostazol 100mg BID for symptom improvement\nC) ACE inhibitor (ramipril) or ARB for cardiovascular risk reduction\nD) Supervised exercise therapy — 30–45 minutes 3x/week for 12 weeks"
    back: "C) ACE inhibitor (ramipril) or ARB for cardiovascular risk reduction\n\nIn PAD, treatment targets are: (1) symptom improvement; (2) reduction of cardiovascular events (MI, stroke, death). Mortality/cardiovascular event reduction: aspirin + statin + ACE inhibitor are the cornerstone. The HOPE trial and CONSENSUS demonstrated ramipril reduces MACE by ~25% in PAD patients (even without proteinuria or HF) — ACE inhibitors are a Class I recommendation in PAD. Cilostazol improves walking distance (symptom relief only, no mortality benefit — also contraindicated in HF). Supervised exercise therapy improves walking distance but has limited data on MACE reduction. Revascularization is indicated for limb-threatening ischemia or severe lifestyle-limiting claudication."
    difficulty: hard
    tags: [Peripheral Vascular, MCQ, Toronto Notes]
  - front: "A 72-year-old woman presents with acute right leg pain, pallor, paresthesias, pulselessness, and paralysis for 3 hours. ABI is not measurable in the right leg. CT angiography shows abrupt occlusion of the right superficial femoral artery at the Hunter's canal. She has AF on her presenting ECG and no prior cardiac history. What is the treatment of choice?\n\nA) IV heparin + surgical embolectomy (Fogarty catheter)\nB) Catheter-directed thrombolysis (CDT) with tPA — first-line for all ALI\nC) Systemic IV tPA — fastest reperfusion for embolic ALI\nD) Emergency bypass surgery — Hunter's canal occlusions not amenable to embolectomy"
    back: "A) IV heparin + surgical embolectomy (Fogarty catheter)\n\nAcute Limb Ischemia (ALI): 6Ps — pain, pallor, pulselessness, paresthesia, paralysis, poikilothermia. Rutherford Class IIb (paresthesia + some motor loss) = immediately threatened limb requiring emergent revascularization within 6 hours. For embolic ALI (source: AF + abrupt occlusion of a large vessel without proximal disease): Fogarty balloon embolectomy is the treatment of choice. Immediate anticoagulation (UFH bolus) to prevent propagation. CDT is preferred for in-situ thrombosis (underlying atherosclerosis, longer occlusion, < 14 days) in Rutherford IIa (non-immediately threatened). This is embolic etiology → surgical embolectomy."
    difficulty: hard
    tags: [Peripheral Vascular, MCQ, Toronto Notes]
  - front: "A 60-year-old man has critical limb ischemia (CLI) — rest pain and non-healing ulcer on the right great toe. ABI is 0.24. CT angiography shows iliac artery disease (40% stenosis proximal right iliac), significant SFA disease with occlusion from Hunter's canal to the popliteal, and 2 patent tibial runoff vessels (peroneal and posterior tibial). Which revascularization is most appropriate?\n\nA) Iliac artery stenting only — the proximal inflow lesion is most important\nB) Below-knee bypass (popliteal-to-tibial) with autologous saphenous vein\nC) Femoro-popliteal bypass with synthetic graft (PTFE)\nD) Hybrid procedure — iliac stenting + distal bypass/endovascular procedure for SFA"
    back: "B) Below-knee bypass (popliteal-to-tibial) with autologous saphenous vein\n\nCLI with infrapopliteal disease requires tibial level revascularization to heal the foot wound. SFA occlusion with patent tibial runoff: bypass surgery to the tibial level (posterior tibial or peroneal) provides the most durable revascularization for CLI. Autologous great saphenous vein (GSV) is the conduit of choice for infrapopliteal bypass — superior patency to PTFE (BASIL trial: no difference to endovascular initially, but surgery superior at 2 years). The mild iliac lesion (40%) does not likely need treatment. If significant inflow disease were present, a hybrid approach (iliac stent + distal bypass) would be appropriate. Limb salvage is the goal."
    difficulty: hard
    tags: [Peripheral Vascular, MCQ, Toronto Notes]
  - front: "A 55-year-old woman presents with acute onset of severe hypertension (BP 245/140), excruciating posterior headache, and nuchal rigidity. CT head shows no hemorrhage. Her creatinine is 1.4 (baseline 1.0). Ophthalmoscopy reveals bilateral flame hemorrhages and papilledema. ECG shows LVH with strain. Urinalysis shows 3+ protein and granular casts. What is the most likely renal mechanism of injury?\n\nA) IgA nephropathy exacerbated by hypertension\nB) Hypertensive emergency causing thrombotic microangiopathy (fibrinoid necrosis of arterioles)\nC) Malignant hypertension from primary aldosteronism — renin-mediated\nD) ANCA-associated vasculitis presenting as hypertensive emergency"
    back: "B) Hypertensive emergency causing thrombotic microangiopathy (fibrinoid necrosis of arterioles)\n\nMalignant hypertension (BP > 180/120 with papilledema/retinal hemorrhages + target organ damage) causes fibrinoid necrosis of the renal arterioles — a form of thrombotic microangiopathy. The afferent arterioles undergo fibrinoid necrosis, resulting in a proliferative endarteritis ('onion skinning') — leading to renal cortical ischemia, activation of the RAAS (secondary hyperaldosteronism), and a vicious cycle of further BP elevation. MAHA (schistocytes) may appear. The kidneys show flea-bitten appearance. Aggressive BP control (target MAP reduction 25% in first hour) is essential. This mechanism is distinct from IgA nephropathy or ANCA vasculitis."
    difficulty: hard
    tags: [Peripheral Vascular, MCQ, Toronto Notes]
  - front: "What is the ATLS primary survey?"
    back: "ABCDE: Airway (c-spine), Breathing, Circulation (hemorrhage control), Disability (GCS, pupils), Exposure/Environment\n\nImmediately life-threatening: tension pneumothorax, massive hemothorax, cardiac tamponade, flail chest, open pneumothorax. Treat during primary survey."
    difficulty: medium
    tags: [ATLS, trauma]
  - front: "What is the ATLS primary survey and its sequence?"
    back: "A: Airway with C-spine protection. B: Breathing and ventilation. C: Circulation with hemorrhage control. D: Disability (GCS, pupils). E: Exposure/Environmental control. Adjuncts: monitors, urinary catheter, gastric tube, X-rays (CXR, pelvis, C-spine), FAST exam.\n\nATLS is the standard trauma assessment protocol used in Canadian trauma centres. Life-threatening conditions are identified and treated in sequence. The primary survey should be completed within minutes. C-spine immobilization until cleared."
    difficulty: hard
    tags: [ATLS, primary survey, trauma, surgery]
  - front: "What is the ATLS secondary survey and when is it performed?"
    back: "Complete head-to-toe physical examination performed after primary survey and initial resuscitation. Includes: detailed history (AMPLE: Allergies, Medications, Past history, Last meal, Events), complete physical exam of every body region, log roll, digital rectal exam if indicated, additional imaging (CT, angiography).\n\nThe secondary survey is only performed after the primary survey is complete and the patient is hemodynamically stable. Any deterioration requires returning to the primary survey. Canadian trauma centres use standardized documentation. Tertiary survey at 24h catches missed injuries."
    difficulty: medium
    tags: [ATLS, secondary survey, trauma assessment, surgery]
  - front: "What are the ATLS classes of hemorrhagic shock?"
    back: "Class I: <750mL (<15%), normal vitals. Class II: 750-1500mL (15-30%), tachycardia, decreased pulse pressure. Class III: 1500-2000mL (30-40%), tachycardia, hypotension, altered mental status. Class IV: >2000mL (>40%), severe tachycardia, hypotension, lethargy/obtundation.\n\nHemorrhagic shock classification guides resuscitation strategy. Class III and IV require blood products. Massive transfusion protocol (1:1:1 PRBC:FFP:platelets) for uncontrolled hemorrhage. Canadian Blood Services guidelines support balanced resuscitation."
    difficulty: hard
    tags: [hemorrhagic shock, ATLS classification, trauma, surgery]
  - front: "What is the FAST exam and what does it assess?"
    back: "Focused Assessment with Sonography in Trauma: 4 views-RUQ (Morison pouch/hepatorenal), LUQ (splenorenal), suprapubic (pelvis), subxiphoid (pericardium). Detects free intraperitoneal fluid (>200mL) and pericardial effusion. Extended FAST (eFAST) adds bilateral anterior chest for pneumothorax.\n\nFAST sensitivity is 73-88% for hemoperitoneum. Positive FAST in unstable patient = emergent laparotomy. Negative FAST does not exclude injury-CT is needed if clinical suspicion remains. eFAST has 95% sensitivity for pneumothorax, superior to supine CXR."
    difficulty: hard
    tags: [FAST exam, ultrasound, trauma assessment, surgery]
  - front: "What is the management of hemodynamically unstable blunt abdominal trauma?"
    back: "Positive FAST + unstable = emergent laparotomy. Negative FAST + unstable = consider other causes (chest, pelvis, external). If DPL positive (>10mL gross blood or RBC >100,000/mm3) = laparotomy. Splenic and liver injuries in unstable patients require surgical intervention.\n\nCanadian trauma guidelines follow ATLS principles. Non-operative management of solid organ injuries is appropriate only in hemodynamically stable patients. Pelvic binder and angioembolization for pelvic hemorrhage. Permissive hypotension (SBP 80-90) until hemorrhage control."
    difficulty: hard
    tags: [blunt abdominal trauma, unstable, laparotomy, surgery]
  - front: "What are the indications for chest tube insertion in trauma?"
    back: "Pneumothorax (especially tension or >15% on CXR), hemothorax, open pneumothorax (after sealing with three-sided occlusive dressing), flail chest with respiratory compromise, positive eFAST for pneumothorax in ventilated patient. Size: 28-32 Fr, inserted at 5th intercostal space, anterior axillary line.\n\nNeedle decompression (2nd ICS MCL or 5th ICS AAL) is the immediate treatment for tension pneumothorax, followed by chest tube. Massive hemothorax (>1500mL initial output or >200mL/h for 2-4h) requires thoracotomy. Autotransfusion can be used with hemothorax."
    difficulty: hard
    tags: [chest tube, pneumothorax, hemothorax, trauma, surgery]
  - front: "How is traumatic brain injury classified and initially managed?"
    back: "GCS: Mild (13-15), Moderate (9-12), Severe (3-8). Severe TBI: intubate if GCS <=8. Prevent secondary injury: maintain SBP >100, PaO2 >60, normothermia, head of bed 30°. CT head emergently. Neurosurgical consult for epidural/subdural hematoma, depressed skull fracture. ICP monitoring if GCS <=8.\n\nCanadian Head CT Rules guide imaging decisions for mild TBI. In severe TBI, ICP target <22 mmHg, CPP 60-70 mmHg. Mannitol (0.25-1g/kg) or hypertonic saline (3%) for raised ICP. Avoid hypotension-single episode of SBP <90 doubles mortality."
    difficulty: hard
    tags: [TBI, traumatic brain injury, GCS, neurosurgery, surgery]
  - front: "What are the Canadian CT Head Rules for minor head injury?"
    back: "CT indicated if GCS <15 at 2h, suspected open/depressed skull fracture, signs of basal skull fracture (raccoon eyes, Battle sign, hemotympanum, CSF leak), >=2 vomiting episodes, age >=65, amnesia before impact >=30 min, dangerous mechanism.\n\nThe Canadian CT Head Rule was developed and validated in Canadian EDs and has 100% sensitivity for neurosurgical intervention. It reduces unnecessary CT scans by ~40% compared to clinical judgment alone. Applies to GCS 13-15 with witnessed LOC, amnesia, or confusion."
    difficulty: medium
    tags: [Canadian CT Head Rule, minor head injury, imaging, surgery]
  - front: "What is the management of splenic injury by grade?"
    back: "Grade I-II (hemodynamically stable): non-operative management with bed rest, serial Hb, serial imaging. Grade III (stable): non-operative + consider angioembolization. Grade IV-V (unstable or failed NOM): splenectomy. Post-splenectomy: vaccinate against encapsulated organisms (pneumococcus, meningococcus, H. influenzae).\n\nNon-operative management is successful in >90% of hemodynamically stable patients. Canadian trauma centres use serial abdominal exams and Hb monitoring. Post-splenectomy patients receive lifelong pneumococcal prophylaxis and are educated about overwhelming post-splenectomy infection (OPSI)."
    difficulty: hard
    tags: [splenic injury, non-operative management, splenectomy, trauma, surgery]
  - front: "What is the approach to penetrating neck trauma?"
    back: "Zone I (clavicle to cricoid): CTA + angiography, high mortality. Zone II (cricoid to angle of mandible): traditionally surgical exploration if platysma violated, now selective with CTA. Zone III (above angle of mandible): CTA + angiography, difficult surgical access.\n\nModern approach in Canadian trauma centres favours CTA for all zones (no-zone approach). Hard signs (active hemorrhage, expanding hematoma, airway compromise, air bubbling) require immediate surgical exploration regardless of zone."
    difficulty: hard
    tags: [penetrating neck trauma, zones, CTA, surgery]
  - front: "What is the management of pelvic fractures in trauma?"
    back: "Unstable patient: pelvic binder (sheet or commercial device), massive transfusion protocol, angioembolization for arterial bleeding, preperitoneal packing if available. Tile classification: Type A (stable), B (rotationally unstable), C (rotationally + vertically unstable).\n\nPelvic fractures can cause life-threatening hemorrhage (venous plexus in 80%, arterial in 20%). Canadian trauma guidelines recommend early pelvic binder in the field. CT with angiography guides embolization. Definitive fixation after stabilization."
    difficulty: hard
    tags: [pelvic fracture, pelvic binder, trauma, surgery]
  - front: "What are the indications for ED thoracotomy?"
    back: "Penetrating thoracic trauma with witnessed cardiac arrest or rapid deterioration (survival up to 35%). Blunt trauma with cardiac arrest has very poor outcomes (<2% survival). Performed to: release pericardial tamponade, control cardiac/great vessel hemorrhage, cross-clamp descending aorta, open cardiac massage.\n\nED thoracotomy (resuscitative thoracotomy) is a last resort. Best outcomes with penetrating cardiac injury (stab > GSW). Canadian trauma centres have protocols defining inclusion criteria. Futile if >15 min CPR in penetrating or >10 min in blunt trauma."
    difficulty: hard
    tags: [ED thoracotomy, resuscitative, cardiac arrest, trauma, surgery]
  - front: "How are burns assessed and initially managed?"
    back: "Rule of 9s for BSA (adult): head 9%, each arm 9%, anterior trunk 18%, posterior trunk 18%, each leg 18%, perineum 1%. Fluid resuscitation: Parkland formula = 4mL x kg x %BSA (give half in first 8h). Intubate early if inhalation injury suspected. Refer to burn centre if: >10% BSA, face/hands/feet/genitalia, electrical, chemical, inhalation injury.\n\nThe Parkland formula uses lactated Ringer and titrates to urine output 0.5-1 mL/kg/h. Canadian burn referral criteria follow ABA guidelines. Circumferential full-thickness burns require escharotomy to prevent compartment syndrome."
    difficulty: hard
    tags: [burns, rule of nines, Parkland formula, trauma, surgery]
  - front: "What is the management of tension pneumothorax?"
    back: "Clinical diagnosis (do NOT wait for imaging): tracheal deviation away, absent breath sounds, JVD, hypotension, hyperresonance. Immediate needle decompression at 2nd ICS MCL (or 5th ICS AAL) with large-bore needle, followed by chest tube insertion.\n\nTension pneumothorax is immediately life-threatening and a primary survey diagnosis. In Canadian EDs, needle decompression is performed at 5th ICS AAL in some protocols due to greater chest wall thickness at 2nd ICS. Chest tube is the definitive treatment."
    difficulty: hard
    tags: [tension pneumothorax, needle decompression, emergency, trauma, surgery]
  - front: "What is the approach to C-spine clearance in trauma?"
    back: "Canadian C-Spine Rule: no imaging needed if: GCS 15, no high-risk factors (age >=65, dangerous mechanism, paresthesias), >=1 low-risk factor (simple rear-end MVC, ambulatory, delayed neck pain, midline tenderness absent), AND able to actively rotate neck 45° left and right.\n\nThe Canadian C-Spine Rule (CCR) was developed in Canadian EDs and is superior to NEXUS criteria. CT is the imaging modality of choice (not plain films). MRI is used for suspected ligamentous injury with normal CT. CCR has 100% sensitivity for clinically significant C-spine injury."
    difficulty: medium
    tags: [C-spine clearance, Canadian C-Spine Rule, trauma, surgery]
  - front: "What is the Ottawa Ankle Rule for ordering ankle X-rays?"
    back: "X-ray if: bone tenderness at posterior edge or tip of medial/lateral malleolus, OR inability to bear weight (4 steps) immediately and in ED\n\nSensitivity ~98% for significant fractures. Ottawa Knee Rule: age>55, isolated patella tenderness, fibula head tenderness, inability to flex 90 degrees, inability to bear weight."
    difficulty: easy
    tags: [Ottawa rules, imaging]
  - front: "What is the pathophysiology of verruciform xanthoma?"
    back: "May be a response to local trauma or inflammation\n\nUnlike other xanthomas, verruciform xanthoma is not associated with hyperlipidemia. It appears to develop as an immune reaction to local tissue trauma or inflammation, rather than from systemic lipid abnormalities."
    difficulty: medium
    tags: [dermatology, xanthoma, verruciform, pathophysiology, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the prodromal symptoms and common triggers for recurrent herpes simplex virus infection?"
    back: "Prodrome: tingling, pruritus, and pain. Common triggers include fever, excess sun exposure, physical trauma, menstruation, emotional stress, and URIs.\n\nRecognition of prodromal symptoms allows for early initiation of antiviral therapy, which is most effective when started during the prodromal phase or within 1 day of lesion onset."
    difficulty: easy
    tags: [HSV, herpes-simplex, clinical-presentation, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What triggers can precipitate HSV reactivation?"
    back: "Fever, excess sun exposure, physical trauma, menstruation, emotional stress, and URI\n\nVarious stressors can reactivate latent HSV from the dorsal nerve root ganglion, causing recurrent cold sores or genital herpes episodes."
    difficulty: easy
    tags: [HSV, pathophysiology, triggers, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are triggers for HSV reactivation?"
    back: "Fever, excess sun exposure, physical trauma, menstruation, emotional stress, and URIs (upper respiratory infections).\n\nAny immunocompromising condition or stressor can trigger viral reactivation from the dorsal root ganglion."
    difficulty: easy
    tags: [HSV, reactivation, triggers, pathophysiology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are triggers for HSV recurrence?"
    back: "Fever, excess sun exposure, physical trauma, menstruation, emotional stress, and URTI\n\nHSV remains latent in the dorsal nerve root ganglion after primary infection and reactivates with these triggers."
    difficulty: easy
    tags: [HSV, herpes simplex, dermatology, pathophysiology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the two main categories of traumatic injuries?"
    back: "Blunt (most common): MVC, pedestrian-automobile impact, motorcycle collision, fall, assault, sports; Penetrating: gunshot wound, stabbing, impalement\n\nBlunt trauma is more common and typically results from motor vehicle collisions, falls, or assaults. Penetrating injuries (increasing in incidence) include gunshot wounds and stabbings."
    difficulty: easy
    tags: [Traumatology, Mechanism of Injury, Emergency Medicine, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are high-risk injuries that require urgent evaluation?"
    back: "Blood at urethral meatus, Significant mid-face trauma, Basal skull fracture\n\nThese findings suggest serious underlying injuries: urethral blood indicates pelvic trauma, mid-face trauma may involve complex fractures, and basal skull fracture (Battle's sign, raccoon eyes) indicates significant head trauma."
    difficulty: medium
    tags: [Traumatology, High-Risk Findings, Emergency Medicine, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the components of the secondary survey in trauma?"
    back: "Full physical exam and CT if indicated by history and exam findings, performed after primary survey and initial resuscitation\n\nThe secondary survey is a complete head-to-toe examination performed after the primary survey (ABCDE) and initial stabilization to identify other injuries or areas of concern."
    difficulty: medium
    tags: [Traumatology, Primary Survey, Secondary Survey, Emergency Medicine, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are key components of the neurological exam in trauma?"
    back: "GCS, cranial nerve exam, limb strength and sensation, assessment of pupils and reaction to light/RAPD, limb tone, reflexes (including corneal and gag), posturing\n\nA comprehensive neurological assessment in trauma patients includes evaluating level of consciousness via GCS, motor function, sensory function, cranial nerves, reflexes, and signs of increased intracranial pressure."
    difficulty: medium
    tags: [Neurological Exam, Trauma, GCS, Emergency Medicine, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the indications for DRE (digital rectal exam) in the emergency setting?"
    back: "Suspected GI bleed, and in trauma if pelvic fracture or frank hematuria is present\n\nThe DRE is indicated in specific emergency scenarios including suspected gastrointestinal bleeding and trauma patients with pelvic fractures or visible blood in urine."
    difficulty: medium
    tags: [Physical Exam, Trauma, DRE, Emergency Medicine, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the 'golden hour' in trauma care?"
    back: "The first 4-6 hours after injury when rapid surgical intervention can significantly decrease mortality\n\nThe 'golden hour' refers to the early phase (4-6 hours post-injury) where timely trauma care has the greatest impact on survival outcomes."
    difficulty: easy
    tags: [Traumatology, Golden Hour, Emergency Medicine, Trauma Care, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the indications for POCUS (point-of-care ultrasound) in hypotensive trauma patients?"
    back: "Consider using RUSH (Rapid Ultrasound in Shock) or FAST exam to guide diagnosis and management\n\nIn hypotensive trauma patients, POCUS including RUSH or FAST exams can quickly identify sources of bleeding and guide resuscitation decisions."
    difficulty: medium
    tags: [POCUS, Ultrasound, Trauma, Emergency Medicine, RUSH Protocol, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "In Canada, what are the annual statistics for traumatic injuries?"
    back: "Over 269,000 hospitalizations and 17,000 deaths (2018 data)\n\nTrauma is the leading cause of death in patients under 45 years and the 4th highest cause of death in North America."
    difficulty: easy
    tags: [trauma, epidemiology, Canada, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are absolute contraindications to NG tube insertion?"
    back: "Significant mid-face trauma, basal skull fracture\n\nThese injuries contraindicate nasogastric tube placement due to risk of intracranial placement."
    difficulty: easy
    tags: [NG tube, contraindications, trauma, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What should be assessed in the abdominal exam for trauma?"
    back: "Peritonitis, abdominal distention, focal areas of tenderness, digital rectal exam for suspected GI bleed or pelvic fracture\n\nA thorough abdominal examination helps identify intra-abdominal injuries requiring intervention."
    difficulty: easy
    tags: [trauma, abdominal exam, physical exam, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What does STAND stand for in open fracture management?"
    back: "Tetanus prophylaxis, Antibiotics, Neurovascular status (before and after), Dressings (to cover wound), (implied: Surgical debridement)\n\nSTAND is a mnemonic for initial management of open fractures in the ED."
    difficulty: medium
    tags: [open fracture, orthopedics, emergency medicine, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the life-threatening orthopedic injuries (usually due to blood loss)?"
    back: "Major pelvic fractures, Traumatic amputations, Massive long bone injuries with fat emboli syndrome\n\nThese injuries require rapid assessment and management due to significant hemorrhage risk."
    difficulty: medium
    tags: [orthopedics, trauma, life-threatening, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the limb-threatening orthopedic injuries (usually due to interrupted blood supply)?"
    back: "Fracture/dislocation of ankle (talar AVN), Crush injuries, Compartment syndrome, Vascular injury proximal to knee/elbow, Dislocations of knee/hip, Fractures above knee\n\nThese require urgent intervention to prevent permanent limb loss."
    difficulty: medium
    tags: [orthopedics, vascular injury, limb-threatening, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the standard timeframe for definitive surgical management of open fractures?"
    back: "Within 6 hours\n\nEarly surgical intervention reduces risk of osteomyelitis in open fractures."
    difficulty: easy
    tags: [open fracture, orthopedics, timing, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is a Colles' fracture?"
    back: "Distal radius fracture with dorsal displacement from FOOSH (Fall on Outstretched Hand)\n\nClassic mechanism is falling onto an outstretched hand with wrist extended."
    difficulty: easy
    tags: [Colles fracture, wrist, distal radius, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the radiographic features of Colles' fracture on AP view?"
    back: "Radial shortening, radial deviation, radial displacement\n\nThese findings help confirm the diagnosis and guide reduction."
    difficulty: medium
    tags: [Colles fracture, radiology, wrist, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the radiographic features of Colles' fracture on lateral view?"
    back: "Dorsal displacement, volar angulation\n\nLateral view shows the characteristic dorsal displacement of the distal fragment."
    difficulty: medium
    tags: [Colles fracture, radiology, wrist, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What mechanism causes calcaneal fractures?"
    back: "Fall from height with axial loading\n\nCalcaneal fractures are often associated with other injuries from the same fall."
    difficulty: easy
    tags: [calcaneal fracture, foot, mechanism, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What other injuries may be associated with calcaneal fracture?"
    back: "Ankles, knees, hips, pelvis, lumbar spine injuries\n\nAxial loading from height can affect multiple skeletal structures."
    difficulty: medium
    tags: [calcaneal fracture, trauma, associated injuries, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the 'golden hour' in trauma?"
    back: "The first 4-6 hours after injury when rapid intervention significantly decreases mortality\n\nStudies show that trauma patients who receive definitive care within the golden hour have improved outcomes."
    difficulty: easy
    tags: [trauma, golden hour, resuscitation, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are contraindications to nasogastric tube insertion?"
    back: "Significant mid-face trauma or basal skull fracture\n\nNG tube placement is contraindicated in these situations due to risk of intracranial placement through fractured bones."
    difficulty: medium
    tags: [NG tube, trauma, contraindications, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are absolute indications for NG tube (not contraindicated)?"
    back: "Blood at urethral meatus (urethral injury), pelvic fracture (assess with DRE), frank hematuria\n\nThese findings warrant further evaluation and may indicate intra-abdominal or genitourinary injury requiring NG tube for decompression."
    difficulty: medium
    tags: [NG tube, trauma, indications, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are indications for digital rectal examination in trauma?"
    back: "Suspected GI bleed, pelvic fracture, or frank hematuria\n\nDRE in trauma helps assess for rectal injury, prostate position, and presence of gross blood."
    difficulty: easy
    tags: [DRE, trauma, physical exam, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the components of the secondary survey?"
    back: "Complete physical exam, full neurological assessment, CT if indicated, identification of other injuries\n\nThe secondary survey occurs after primary survey and stabilization, systematically evaluating for additional injuries."
    difficulty: easy
    tags: [secondary survey, trauma, assessment, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "When should POCUS (point-of-care ultrasound) be considered in hypotensive trauma patients?"
    back: "Use RUSH (Rapid Ultrasound in Shock) exam to guide resuscitation\n\nPOCUS quickly identifies sources of hypotension including pericardial tamponade, pneumothorax, and intra-abdominal bleeding."
    difficulty: medium
    tags: [POCUS, RUSH, ultrasound, trauma, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the leading causes of traumatic death in patients <45 years?"
    back: "Trauma is the leading cause of death in patients <45 years and 4th highest in North America\n\nIn Canada, traumatic injuries cause over 269,000 hospitalizations and 17,000 deaths annually."
    difficulty: easy
    tags: [trauma, epidemiology, mortality, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the components of the primary survey in trauma?"
    back: "A - Airway with C-spine protection, B - Breathing, C - Circulation with hemorrhage control, D - Disability (GCS), E - Exposure\n\nThe primary survey identifies and treats immediately life-threatening injuries in a systematic manner."
    difficulty: easy
    tags: [primary survey, ATLS, trauma, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the management of 5th metatarsal base avulsion fracture?"
    back: "Supportive tensor bandage or below-knee walking boot for 3 weeks\n\nThis injury occurs with inversion trauma. Conservative management is typically sufficient with adequate immobilization."
    difficulty: easy
    tags: [foot-fracture, metatarsal, conservative-management, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of calcaneal fracture?"
    back: "Associated with fall from height and axial loading. May have associated injuries to ankles, knees, hips, pelvis, lumbar spine - evaluate for these.\n\nCalcaneal fractures are high-energy injuries. Always assess for associated lower extremity and spinal injuries."
    difficulty: easy
    tags: [calcaneal-fracture, foot, high-energy, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "List life-threatening orthopedic injuries"
    back: "Major pelvic fractures, traumatic amputations, massive long bone injuries with fat emboli syndrome\n\nThese injuries are life-threatening primarily due to significant blood loss. Pelvic fractures can have mortality up to 50%."
    difficulty: easy
    tags: [life-threatening, orthopedic-emergency, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "List limb-threatening orthopedic injuries"
    back: "Fracture/dislocation of ankle (talar AVN), crush injuries, compartment syndrome, vascular injury proximal to knee/elbow, dislocations of knee/hip, fractures above knee, open fractures\n\nThese injuries threaten limb viability due to interruption of blood supply or risk of tissue necrosis. Require urgent intervention."
    difficulty: easy
    tags: [limb-threatening, orthopedic-emergency, vascular, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the red flags for back pain that require urgent evaluation?"
    back: "Fracture (osteoporosis, age >50, trauma), infection (fever, IV drug use, recent spinal intervention, immunosuppression), cancer, cauda equina syndrome (saddle anesthesia, bowel/bladder dysfunction), and vascular causes (cardiac risk factors)\n\nRed flags indicate serious underlying pathology requiring imaging and specialized management"
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Red Flags, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What spinal emergencies require urgent intervention in back pain patients?"
    back: "Osteomyelitis, cauda equina syndrome, epidural abscess or hematoma, discitis, spinal fracture, and malignancy\n\nThese conditions can lead to permanent neurological damage if not treated promptly"
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Spinal Emergencies, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "When is imaging indicated for acute back pain?"
    back: "Reserve imaging for patients with neurological deficits, known metastases, or high-risk patients (fracture risk, infection risk, cancer risk, vascular cause)\n\nUncomplicated mechanical back pain does not require imaging initially"
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Investigations, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the common causes of seizures?"
    back: "Primary seizure disorder, structural causes (trauma, intracranial hemorrhage, infection, increased ICP), metabolic disturbances (hypo-/hyperglycemia, hypo-/hypernatremia, hypocalcemia, hypomagnesemia), and toxins/drugs\n\nIdentifying the cause guides acute management and long-term treatment"
    difficulty: easy
    tags: [Emergency Medicine, Seizures, Etiology, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the 3 goals of ED treatment for fractures?"
    back: "Diagnose life/limb-threatening injuries, reduce and immobilize fractures, provide adequate pain relief\n\nThese three goals guide initial orthopedic management in the emergency department."
    difficulty: easy
    tags: [Emergency Medicine, Orthopedics, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
