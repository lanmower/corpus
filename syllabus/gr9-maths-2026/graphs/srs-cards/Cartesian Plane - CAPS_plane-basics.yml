# Gr 9 Maths CAPS — graphs / Cartesian Plane
deck: "Corpus::Gr9 Maths::Cartesian Plane"
notes:
  - guid: a1f3c9e72b4d6081
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Cartesian Plane"
    fields:
      Front: "What is the Cartesian plane and what are its main parts?"
      Back: "The Cartesian plane is a flat surface formed by two number lines that cross at right angles (90°).\nParts:\n• x-axis — the horizontal number line.\n• y-axis — the vertical number line.\n• origin — the point where the axes cross, with coordinates (0;0).\nThe two axes divide the plane into four regions called quadrants. Every point on the plane is named by an ordered pair (x;y)."
    tags: ["cartesian-plane", "subject:graphs"]
  - guid: 7d2b8e14a6c93f50
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Cartesian Plane"
    fields:
      Front: "What does an ordered pair (x;y) mean, and why is the order important?"
      Back: "An ordered pair (x;y) gives the position of a point.\n• First number = x-coordinate: how far LEFT/RIGHT from the origin (along the x-axis).\n• Second number = y-coordinate: how far UP/DOWN from the origin (along the y-axis).\nOrder matters: (3;5) is NOT the same point as (5;3). Always read x first, then y.\nNote: in SA CAPS a semicolon separates the values: (x;y)."
    tags: ["ordered-pairs", "subject:graphs"]
  - guid: c4a9017f6e2d8b35
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Cartesian Plane"
    fields:
      Front: "How do you plot the point (−4;3) on the Cartesian plane?"
      Back: "Step 1: Start at the origin (0;0).\nStep 2: x = −4 → move 4 units LEFT (negative x is left).\nStep 3: y = 3 → move 3 units UP (positive y is up).\nStep 4: Mark a dot there.\nThe point lies in the second quadrant (top-left), since x is negative and y is positive."
    tags: ["plotting-points", "subject:graphs"]
  - guid: 0e6d3b9a1c7f4528
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Cartesian Plane"
    fields:
      Front: "How do you READ the coordinates of a plotted point off the Cartesian plane?"
      Back: "Step 1: From the point, drop a line straight DOWN (or up) to the x-axis — read that value = x-coordinate.\nStep 2: From the point, go straight ACROSS to the y-axis — read that value = y-coordinate.\nStep 3: Write as (x;y).\nExample: a point above 2 on the x-axis and across from −1 on the y-axis is (2;−1)."
    tags: ["reading-points", "subject:graphs"]
  - guid: 5b8f2a4e7d0c6913
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Cartesian Plane"
    fields:
      Front: "Name the four quadrants and the signs of (x;y) in each."
      Back: "Quadrants are numbered anticlockwise starting top-right:\n• Quadrant I (top-right): (+;+) — x positive, y positive.\n• Quadrant II (top-left): (−;+) — x negative, y positive.\n• Quadrant III (bottom-left): (−;−) — both negative.\n• Quadrant IV (bottom-right): (+;−) — x positive, y negative.\nMemory aid: signs of x go +,−,−,+ and signs of y go +,+,−,−."
    tags: ["quadrants", "subject:graphs"]
  - guid: 9a1c7e5f3b2d8460
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Cartesian Plane"
    fields:
      Front: "In which quadrant does each point lie? (5;2), (−3;−6), (−1;4), (7;−2)"
      Back: "Use the sign rule (x-sign; y-sign):\n• (5;2) → (+;+) → Quadrant I.\n• (−3;−6) → (−;−) → Quadrant III.\n• (−1;4) → (−;+) → Quadrant II.\n• (7;−2) → (+;−) → Quadrant IV."
    tags: ["quadrants", "subject:graphs"]
  - guid: 2f6b0d8a4c9e1357
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Cartesian Plane"
    fields:
      Front: "Where do points lie if x = 0, or if y = 0? Are axis points in a quadrant?"
      Back: "• If x = 0, the point is ON the y-axis, e.g. (0;4) sits on the y-axis.\n• If y = 0, the point is ON the x-axis, e.g. (−3;0) sits on the x-axis.\n• The origin (0;0) is where the axes cross.\nPoints lying ON an axis are NOT in any quadrant — quadrants are the open regions between the axes."
    tags: ["axes", "subject:graphs"]
  - guid: 8c3a5e9b7f1d0264
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Cartesian Plane"
    fields:
      Front: "Common pitfall: a learner plots (2;−5) by going up 2 and right 5. What went wrong?"
      Back: "Two errors:\n1) They swapped x and y. The first number (2) is the x-value → move RIGHT 2, not up.\n2) The second number (−5) is the y-value → move DOWN 5 (negative = down).\nCorrect: from origin, right 2, then down 5 → Quadrant IV.\nRule: ALWAYS x first (across), then y (up/down)."
    tags: ["plotting-points", "subject:graphs"]
