    back: "FBG (fasting blood glucose) or HbA1C in everyone ≥40 q3yr, or at high-risk using CANRISK calculator\n\nScreening guidelines recommend testing adults ≥40 years every 3 years, with earlier/more frequent testing for high-risk individuals."
    difficulty: easy
    tags: [endocrinology, diabetes, screening, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are causes of secondary achalasia?"
    back: "Scleroderma and diabetes mellitus (DM)\n\nSecondary achalasia (pseudoachalasia) can result from systemic diseases like scleroderma affecting esophageal smooth muscle function."
    difficulty: medium
    tags: [achalasia, scleroderma, diabetes, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the causes of esophageal motor disorders?"
    back: "Idiopathic, achalasia, scleroderma, diabetes mellitus, and distal esophageal spasm (DES)\n\nThese disorders present with dysphagia to solids, liquids, or both, sometimes with chest pain. Manometry is required for definitive diagnosis."
    difficulty: medium
    tags: [esophageal motor disorders, achalasia, scleroderma, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the patient-specific risk factors for surgical site infection?"
    back: "Age, diabetes mellitus, steroids, immunosuppression, smoking, obesity, burns, malnutrition, other infections, traumatic wounds, radiation, and chemotherapy.\n\nThese patient factors impair wound healing and increase susceptibility to infection through various mechanisms including impaired immunity and tissue perfusion."
    difficulty: easy
    tags: [surgery, SSI, risk factors, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "GLP-1 receptor agonists (liraglutide, semaglutide, dulaglutide) have demonstrated what cardiovascular benefit beyond glycemic control in T2DM patients?"
    back: "Reduced major adverse cardiovascular events (MACE: CV death, non-fatal MI, non-fatal stroke) in high-risk T2DM patients\n\nMultiple trials (LEADER, SUSTAIN-6, REWIND, HARMONY-OUTCOMES) consistently showed GLP-1 receptor agonists reduce MACE in T2DM patients at high CV risk. Canadian Diabetes Association guidelines recommend GLP-1 RAs with proven CV benefit for T2DM patients with established CVD."
    difficulty: medium
    tags: [GLP-1, liraglutide, semaglutide, MACE, T2DM, cardiovascular]
  - front: "CANVAS trial found canagliflozin (SGLT2 inhibitor) reduced cardiovascular events in T2DM but also increased risk of what serious adverse event?"
    back: "Lower limb amputation (particularly at the toe/forefoot level)\n\nCANVAS (NEJM 2017) showed canagliflozin reduced MACE but doubled amputation risk (6.3 vs. 3.4 per 1000 patient-years). This risk appears to be a class effect but is most pronounced with canagliflozin. Canadian guidelines recommend caution in patients with peripheral artery disease or prior amputations."
    difficulty: medium
    tags: [CANVAS, canagliflozin, SGLT2 inhibitor, amputation, T2DM]
  - front: "EMPA-REG OUTCOME demonstrated empagliflozin's benefit in T2DM with high CV risk. What was the notable finding regarding hospitalization for heart failure?"
    back: "Empagliflozin significantly reduced hospitalization for heart failure and CV death, but did not significantly reduce MI or stroke rates\n\nEMPA-REG OUTCOME (NEJM 2015) showed empagliflozin reduced HF hospitalization and CV death by ~35%, with a specific HF benefit that appeared early in the trial. Genital infections were more common with empagliflozin. This established SGLT2 inhibitors as cardioprotective beyond glucose lowering."
    difficulty: hard
    tags: [EMPA-REG, empagliflozin, SGLT2 inhibitor, heart failure, T2DM, cardiovascular]
  - front: "A patient with T2DM at high CV risk is asking about oral semaglutide (GLP-1 agonist) for CV protection. According to PIONEER 6, what can you tell them?"
    back: "Oral semaglutide's CV risk profile was non-inferior to placebo — it demonstrated CV safety but was not shown to be superior in the PIONEER 6 trial\n\nPIONEER 6 (NEJM 2019) was primarily a safety trial demonstrating that oral semaglutide was non-inferior to placebo for MACE in T2DM patients at high CV risk. However, subcutaneous semaglutide (SUSTAIN-6) showed superior CV outcomes, supporting injectable semaglutide for CV risk reduction."
    difficulty: hard
    tags: [PIONEER 6, oral semaglutide, GLP-1, T2DM, cardiovascular safety]
  - front: "What skin manifestations are associated with diabetes mellitus?"
    back: "Acanthosis nigricans, necrobiosis lipoidica diabeticorum, granuloma annulare, eruptive xanthomas, diabetic bullae, infections (boils, candidiasis, tinea), pruritus, diabetic foot.\n\nNecrobiosis lipoidica diabeticorum presents as waxy yellow-orange plaques with telangiectasias on the pretibial areas. Acanthosis nigricans reflects insulin resistance. These skin findings may precede formal DM diagnosis."
    difficulty: medium
    tags: [diabetes mellitus, acanthosis nigricans, necrobiosis lipoidica, skin manifestations]
  - front: "What is acanthosis nigricans and what conditions is it associated with?"
    back: "Velvety hyperpigmentation of flexural skin (most commonly peri-nuchal). Associated with insulin resistance, DM, obesity, other endocrine disorders, and malignancy (especially GI adenocarcinoma).\n\nAcanthosis nigricans is a cutaneous marker of insulin resistance. Malignant acanthosis nigricans is typically more extensive and rapidly progressive, often associated with gastric adenocarcinoma."
    difficulty: medium
    tags: [acanthosis nigricans, insulin resistance, diabetes, malignancy]
  - front: "What is the triad of diabetic ketoacidosis (DKA)?"
    back: "Hyperglycemia, ketosis (ketonemia/ketonuria), and metabolic acidosis — caused by severe insulin deficiency with counter-regulatory hormone excess.\n\nDKA most commonly affects young patients with T1DM, though it can be the first presentation of undiagnosed T2DM. SGLT2 inhibitors can cause euglycemic DKA (normal blood glucose). Precipitating factors include infection, cardiac or mesenteric ischemia, MI, intoxication, and insulin omission."
    difficulty: easy
    tags: [DKA, diabetes, ketoacidosis, triad]
  - front: "What are the clinical features of DKA from early to late?"
    back: "Early: polyuria, polydipsia, malaise, nocturia, weight loss, abdominal pain. Late GI: anorexia, nausea, vomiting, worsening abdominal pain. Neurological: fatigue, drowsiness, stupor, coma. Respiratory: Kussmaul's respiration (deep, laboured), dyspnea (compensatory for acidosis), fruity ketotic breath.\n\nKussmaul breathing is a deep, sighing respiratory pattern that represents respiratory compensation for metabolic acidosis — the body attempts to blow off CO2 to increase pH. Fruity breath results from acetone (a ketone) exhalation. Altered consciousness correlates with severity of acidosis and osmolality."
    difficulty: easy
    tags: [DKA, clinical features, Kussmaul, ketosis]
  - front: "What investigations are required in DKA?"
    back: "Blood work: CBC, electrolytes, Ca²⁺, Mg²⁺, PO4³⁻, Cr, BUN, glucose, ketones, osmolality, AST/ALT/ALP, troponin. Urine: glucose and ketones. VBG (pH, bicarbonate, pCO2). ECG (electrolyte disturbances → dysrhythmia; MI rarely precipitant).\n\nPotassium is particularly critical: DKA causes total body potassium depletion (cellular K+ shifts to extracellular space due to acidosis), but serum K+ may be normal or elevated initially. As insulin is given, K+ shifts intracellularly and hypokalemia can develop rapidly — continuous cardiac monitoring is required."
    difficulty: medium
    tags: [DKA, investigations, potassium, VBG]
  - front: "How is pseudohyponatremia corrected in DKA?"
    back: "Add 3 mmol/L of sodium for every 10 mmol/L of glucose above 5.5 mmol/L. This corrects for the dilutional effect of hyperglycemia on measured serum sodium.\n\nHyperglycemia draws water from cells into the extracellular space, diluting plasma sodium. The corrected sodium reflects the true sodium once glucose is normalized. Using uncorrected sodium overestimates hyponatremia severity and can lead to under-treatment of sodium imbalance."
    difficulty: hard
    tags: [DKA, pseudohyponatremia, sodium correction, hyperglycemia]
  - front: "What are the key principles of initial fluid resuscitation in DKA?"
    back: "Bolus of normal saline (NS), then high-rate NS infusion. Beware of overhydration and cerebral edema (especially in pediatric patients). Replace KCl 20 mEq/L only if patient is voiding, has adequate renal function, and initial K+ <5.5 mmol/L. Use cardiac monitoring if potassium is normal or low.\n\nFluid resuscitation is the first priority in DKA to restore intravascular volume and correct hyperosmolality. Aggressive IV fluid replacement also dilutes glucose and ketones. Pediatric patients are at higher risk of cerebral edema with rapid fluid administration — a common cause of DKA mortality in children."
    difficulty: medium
    tags: [DKA, fluid resuscitation, normal saline, potassium, cerebral edema]
  - front: "What is Whipple's triad for hypoglycemia?"
    back: "1) Low plasma glucose, 2) Symptoms suggestive of hypoglycemia, 3) Prompt resolution of symptoms when glucose is administered.\n\nWhipple's triad is the classic diagnostic criterion for hypoglycemia. All three components must be present to confirm the diagnosis. The most common cause in the ED is excessive insulin use in the setting of poor oral intake."
    difficulty: easy
    tags: [hypoglycemia, emergency, endocrinology, diagnosis]
  - front: "A hypoglycemic patient cannot take oral glucose and has no IV access. What is the next step?"
    back: "Glucagon 1-2 mg IM, repeat in 10-20 minutes.\n\nWhen neither oral glucose nor IV access is available, IM glucagon is the treatment of choice. Glucagon stimulates hepatic glycogenolysis and gluconeogenesis to raise blood glucose. If IV access is later obtained, D50W 50 mL IV push is the preferred treatment."
    difficulty: easy
    tags: [hypoglycemia, glucagon, emergency, treatment]
  - front: "Why must thiamine be given before dextrose in a suspected alcoholic with hypoglycemia?"
    back: "To prevent Wernicke's encephalopathy. Glucose metabolism without thiamine (vitamin B1) in thiamine-deficient patients precipitates acute Wernicke's. Thiamine 300 mg IM should be given first.\n\nPatients with alcohol use disorder are at high risk for thiamine deficiency. Administering dextrose without thiamine drives pyruvate into a pathway that depletes remaining thiamine stores, precipitating Wernicke's encephalopathy (confusion, ataxia, ophthalmoplegia)."
    difficulty: easy
    tags: [hypoglycemia, alcohol, thiamine, Wernicke, emergency]
  - front: "When should insulin NOT be given in DKA management?"
    back: "When potassium is <3.3 mmol/L. Insulin drives K+ into cells and will worsen hypokalemia, risking fatal dysrhythmias.\n\nInsulin therapy is critical in DKA to inhibit ketogenesis and gluconeogenesis, but administering it in the setting of hypokalemia can cause life-threatening cardiac arrhythmias. Potassium must be repleted to ≥3.3 mmol/L before starting insulin."
    difficulty: medium
    tags: [DKA, insulin, potassium, hypokalemia, emergency]
  - front: "At what blood glucose level should dextrose be added to IV fluids in DKA management?"
    back: "When blood glucose drops below 14 mmol/L. Dextrose is added to maintain euglycemia while insulin continues to suppress ketogenesis.\n\nInsulin must continue until ketoacidosis resolves (pH >7.3, bicarbonate >18 mEq/L, anion gap normalized), even after glucose normalizes. Adding dextrose to IVF at glucose <14 mmol/L prevents hypoglycemia while allowing continued insulin infusion."
    difficulty: medium
    tags: [DKA, dextrose, glucose, insulin, emergency]
  - front: "How does Hyperosmolar Hyperglycemic State (HHS) differ from DKA in typical presentation?"
    back: "HHS: older T2DM patients, glucose ≥33.3 mmol/L, fewer GI symptoms, more neurological deficits (mental disturbances, coma, seizures), symptoms evolving over days to weeks, larger fluid losses. Expected pH >7.3 and bicarbonate >18 mEq/L (no significant ketoacidosis).\n\nHHS results from relative insulin deficiency causing extreme hyperglycemia and osmotic diuresis without significant ketosis. The neurological manifestations predominate due to hyperosmolarity. DKA typically has metabolic acidosis with ketosis and more GI symptoms."
    difficulty: medium
    tags: [HHS, DKA, hyperglycemia, emergency, comparison]
  - front: "What drugs have been associated with precipitating HHS?"
    back: "Diuretics, glucocorticoids, lithium, and atypical antipsychotics. HHS can also follow cardiac surgery.\n\nUnlike DKA which has classic precipitants (infection, missed insulin), HHS has additional drug-related precipitants. Atypical antipsychotics cause insulin resistance and impair insulin secretion. This is important to recognize in patients on these medications who present with altered mental status."
    difficulty: medium
    tags: [HHS, precipitants, medications, emergency]
  - front: "What is the role of HDL in lipid transport?"
    back: "HDL transports cholesterol from peripheral tissues to the liver (reverse cholesterol transport) and acts as a reservoir for apolipoproteins.\n\nHDL-mediated reverse cholesterol transport is cardioprotective. High HDL levels are associated with decreased CVD and mortality. LCAT (lecithin-cholesterol acyltransferase) esterifies cholesterol in HDL. HDL also receives phospholipids and gives cholesterol esters in exchange with IDL."
    difficulty: easy
    tags: [HDL, reverse cholesterol transport, cardiovascular protection]
  - front: "What enzyme is required to activate lipoprotein lipase (LPL), and what is its significance?"
    back: "ApoC-II is required to activate lipoprotein lipase. Deficiency of LPL or ApoC-II causes hereditary chylomicronemia with severe hypertriglyceridemia.\n\nLPL degrades TG in chylomicrons and VLDL at capillary surfaces of adipose tissue and muscle. ApoC-II is an obligate cofactor. Both LPL deficiency and ApoC-II deficiency lead to familial chylomicronemia syndrome with markedly elevated TG and risk of pancreatitis."
    difficulty: easy
    tags: [lipoprotein lipase, ApoC-II, hypertriglyceridemia, familial chylomicronemia]
  - front: "What is Familial Hypercholesterolemia (FH), and what are its key clinical features?"
    back: "FH is an autosomal dominant disorder caused by defects in LDLR (most common), PCSK9, or ApoB, leading to markedly elevated LDL cholesterol. Clinical features include tendinous xanthomata (Achilles, patellar, extensor tendons of hand), arcus cornealis, and xanthelasmata.\n\nFH heterozygotes have 50% risk of MI in men by age 30. FH homozygotes manifest CAD and vascular disease early in childhood (can be fatal before age 20). Risk calculators (Framingham, SCORE) do not apply to FH patients — all adults with FH should be considered 'high-risk.'"
    difficulty: easy
    tags: [familial hypercholesterolemia, LDLR, PCSK9, xanthoma, LDL]
  - front: "What is the treatment approach for Familial Hypercholesterolemia?"
    back: "1st line: maximally tolerated statin. 2nd line: add ezetimibe and/or PCSK9 inhibitor. 3rd line (homozygotes): portacaval shunt, LDL apheresis, or potential liver transplant.\n\nFH homozygotes have extremely high LDL levels and often require LDL apheresis due to lack of functional LDL receptors in the liver. PCSK9 inhibitors work by blocking PCSK9-mediated LDLR degradation, increasing hepatic LDL clearance. Drug-resistant cases should be referred to a lipid specialist."
    difficulty: medium
    tags: [familial hypercholesterolemia, statin, PCSK9 inhibitor, ezetimibe, LDL apheresis]
  - front: "What are the key features of Familial Combined Hyperlipidemia?"
    back: "Elevated ApoB, elevated TG, and elevated LDL (multiple phenotypes). Caused by increased hepatic production of ApoB-100-containing lipoproteins. Associated with premature coronary heart disease, xanthelasma, and obesity.\n\nFamilial combined hyperlipidemia (FCHL) is the most common primary dyslipidemia causing premature CAD. Unlike FH, it can present with elevated LDL, elevated TG, or both. Treatment: statin 1st; add ezetimibe/PCSK9 inhibitor if LDL not controlled; fibrate if TG >10 mmol/L."
    difficulty: medium
    tags: [familial combined hyperlipidemia, ApoB, hypertriglyceridemia, premature CAD]
  - front: "What is Tangier Disease and what are its characteristic clinical features?"
    back: "Tangier Disease is an autosomal recessive disorder caused by ABCA1 gene mutations, resulting in very low HDL cholesterol. Characteristic features include enlarged orange-coloured tonsils, neuropathy, splenomegaly, hepatomegaly, corneal clouding, mild hypertriglyceridemia, and premature atherosclerosis.\n\nABCA1 is essential for HDL-mediated cholesterol efflux from macrophages. Without it, cholesterol accumulates in tissues (hence the orange tonsils from cholesterol-laden macrophages). Treatment focuses on lifestyle modifications and managing coexisting lipid abnormalities to reduce atherosclerosis risk."
    difficulty: medium
    tags: [Tangier disease, HDL, ABCA1, orange tonsils, rare dyslipidemia]
  - front: "What are the secondary causes of hypertriglyceridemia?"
    back: "Endocrine: obesity/metabolic syndrome, DM. Renal: nephrotic syndrome, CKD. Drugs: corticosteroids, estrogen, hydrochlorothiazide, retinoic acid, beta-blockers (without ISA), antiretrovirals, atypical antipsychotics, OCPs. Lifestyle: alcohol, high carbohydrate/high fat diet. Other: pregnancy.\n\nSecondary causes of dyslipidemia are much more common than primary genetic causes. Identifying and treating the underlying cause is essential. Insulin resistance (obesity, DM) promotes excess VLDL production by the liver, leading to hypertriglyceridemia."
    difficulty: medium
    tags: [hypertriglyceridemia, secondary dyslipidemia, drugs, metabolic syndrome]
  - front: "What are the secondary causes of hypercholesterolemia?"
    back: "Endocrine: hypothyroidism. Renal: nephrotic syndrome, CKD. Immunologic: monoclonal gammopathy. Hepatic: cholestatic liver disease (e.g. primary biliary cirrhosis). Nutritional: anorexia nervosa. Drugs: cyclosporin, carbamazepine, steroids. Lifestyle: smoking, obesity.\n\nHypothyroidism causes elevated LDL due to decreased LDL receptor activity and reduced bile acid synthesis. Nephrotic syndrome causes elevated LDL due to increased hepatic lipoprotein synthesis in response to hypoalbuminemia. Treating the underlying condition is the first step."
    difficulty: medium
    tags: [hypercholesterolemia, secondary dyslipidemia, hypothyroidism, nephrotic syndrome]
  - front: "What is the LDL-lowering effect of statins, ezetimibe, and PCSK9 inhibitors?"
    back: "Statins lower LDL by ~30-40%. Ezetimibe lowers LDL by ~18%. PCSK9 inhibitors lower LDL by ~50%. Each 1.0 mmol/L decrease in LDL corresponds to approximately 20-25% relative risk reduction in cardiovascular disease. Doubling the statin dose only adds ~6% further LDL reduction.\n\nThe rule of 6: each doubling of statin dose provides approximately a 6% incremental reduction in LDL beyond the initial response. This is why combining agents (ezetimibe, PCSK9 inhibitors) is preferred over simply escalating statin dose for patients who need greater LDL reduction."
    difficulty: easy
    tags: [statin, ezetimibe, PCSK9 inhibitor, LDL reduction, cardiovascular risk reduction]
  - front: "According to CCS 2021 guidelines, when should lipid-lowering therapy be intensified with ezetimibe and/or PCSK9 inhibitors?"
    back: "In patients with established ASCVD who have LDL-C ≥1.8 mmol/L (or non-HDL cholesterol ≥2.4 mmol/L or ApoB >0.7 g/L) despite maximally tolerated statin therapy.\n\nPatients with clinical atherosclerosis, AAA, LDL-C ≥5.0 mmol/L, and most with diabetes or CKD should be started on statin therapy. For ASCVD patients not at LDL target on max statin, add ezetimibe first, then PCSK9 inhibitor if still above target."
    difficulty: medium
    tags: [ASCVD, LDL target, ezetimibe, PCSK9 inhibitor, CCS guidelines 2021]
  - front: "What are the diagnostic criteria for pre-diabetes (impaired glucose tolerance/impaired fasting glucose) per Diabetes Canada 2018?"
    back: "IFG: fasting plasma glucose 6.1–6.9 mmol/L. IGT: 2h 75g OGTT 7.8–11.0 mmol/L. A1C: 6.0–6.4%.\n\nPre-diabetes carries significant cardiovascular risk. Approximately 15% per year progress to diabetes; 50-80% revert to normal glucose tolerance. Lifestyle modifications reduce progression by 58%; metformin reduces it by 31%. Weight loss of 5-10% of body weight can improve glucose tolerance."
    difficulty: easy
    tags: [pre-diabetes, IFG, IGT, Diabetes Canada, fasting glucose]
  - front: "What are the diagnostic criteria for diabetes mellitus per Diabetes Canada 2018?"
    back: "Any ONE of: FPG ≥7.0 mmol/L (fasting = no caloric intake ≥8h); A1C ≥6.5% (adults only; not for T1DM, children, adolescents, or pregnant women); 2h PG in 75g OGTT ≥11.1 mmol/L; Random PG ≥11.1 mmol/L. In the ABSENCE of hyperglycemia symptoms, a confirmatory test on another day is required.\n\nIf the patient has hyperglycemia symptoms (polyuria, polydipsia, polyphagia, weight loss, blurry vision), a single abnormal test is sufficient. A1C is not used to diagnose T1DM, in children/adolescents, or in pregnant women, as factors like hemolysis or hemoglobinopathies can affect A1C accuracy."
    difficulty: easy
    tags: [diabetes diagnosis, fasting glucose, A1C, OGTT, Diabetes Canada 2018]
  - front: "What are the main differences between Type 1 and Type 2 diabetes mellitus?"
    back: "T1DM: onset usually <30 yr, 5-10% of DM, autoimmune/idiopathic beta-cell destruction, absolute insulin deficiency, HLA DR3/DR4 association, islet cell antibodies in 60-85%, normal to thin body habitus, treated with insulin. T2DM: onset usually >40 yr, 90% of DM, multifactorial insulin resistance + secretion impairment, treated with lifestyle + non-insulin agents ± insulin.\n\nT1DM monozygotic twin concordance is 30-40%; T2DM is 70-90%, reflecting greater heritability. The most common autoantibody in T1DM is against glutamic acid decarboxylase (GAD). T2DM involves the 'ominous octet': impaired insulin secretion, enhanced glucagon, increased hepatic glucose production, decreased incretin effect, increased lipolysis, decreased muscle glucose uptake, increased renal reabsorption, neurotransmitter dysfunction."
    difficulty: easy
    tags: [T1DM, T2DM, diabetes comparison, autoimmune, HLA]
  - front: "What are the causes of diabetes mellitus due to diseases of the exocrine pancreas?"
    back: "Pancreatitis, pancreatectomy, neoplasia, cystic fibrosis, and hemochromatosis ('bronze diabetes').\n\nThese represent Type 3c diabetes (pancreatogenic/exocrine pancreas disease-related). Hemochromatosis causes iron deposition in the pancreas (and liver, heart, gonads, skin), leading to 'bronze diabetes.' Cystic fibrosis-related diabetes (CFRD) is increasingly common as CF patients live longer."
    difficulty: easy
    tags: [diabetes etiology, pancreatogenic diabetes, hemochromatosis, cystic fibrosis, Type 3c]
  - front: "Which endocrinopathies can cause secondary diabetes mellitus?"
    back: "Acromegaly (excess GH causes insulin resistance), Cushing's syndrome (cortisol causes insulin resistance), glucagonoma (excess glucagon promotes gluconeogenesis), pheochromocytoma (catecholamines inhibit insulin secretion), and hyperthyroidism (accelerated glucose metabolism and insulin resistance).\n\nCounter-regulatory hormones (GH, cortisol, glucagon, catecholamines, thyroid hormone) all antagonize insulin action. Treatment of the underlying endocrinopathy may improve glycemic control. Recognition is important as these conditions may be curable (e.g., surgical resection of an adrenal adenoma in Cushing's)."
    difficulty: easy
    tags: [secondary diabetes, acromegaly, Cushing syndrome, glucagonoma, pheochromocytoma]
  - front: "What infections are associated with causing diabetes mellitus?"
    back: "Congenital rubella, cytomegalovirus (CMV), and coxsackievirus are associated with causing diabetes mellitus (Type 1 pathogenesis).\n\nViral infections can trigger autoimmune destruction of pancreatic beta cells in genetically susceptible individuals. Molecular mimicry (viral antigens resembling islet cell proteins) is one proposed mechanism. These are categorized under the 'Other Specific Causes' of DM in the etiologic classification."
    difficulty: easy
    tags: [diabetes etiology, viral diabetes, congenital rubella, CMV, coxsackievirus]
  - front: "What is the honeymoon period in Type 1 Diabetes?"
    back: "After initial T1DM presentation, a honeymoon period often occurs where glycemic control can be achieved with little or no insulin as residual beta cells are still able to produce insulin. Once these cells are destroyed, complete insulin deficiency results.\n\nThe honeymoon period (partial remission phase) typically lasts weeks to months. During this time, insulin requirements are very low. It is important to continue some insulin therapy during this phase to preserve remaining beta cells and avoid ketoacidosis. Eventually, progressive autoimmune destruction leads to absolute insulin deficiency."
    difficulty: easy
    tags: [T1DM, honeymoon period, partial remission, beta cell]
  - front: "What is the A1C target for most adults with T1DM or T2DM, and when might a higher or lower target be appropriate?"
    back: "Target A1C <7.0% for most patients. Lower target <6.5% may be set to further reduce nephropathy/retinopathy risk if no significant hypoglycemia. Higher targets 7.1-8.5% are appropriate for limited life expectancy, greater functional dependency, or history of recurrent severe hypoglycemia.\n\nA1C reflects average glucose over ~3 months and should be measured every 3-6 months. Targets must be personalized. More intensive control (A1C <6.0%) may cause harm (ACCORD trial). A1C can be falsely elevated in iron/B12 deficiency, alcoholism, CKD; falsely lowered in chronic liver disease, reticulocytosis, ASA/vitamin C use."
    difficulty: easy
    tags: [A1C target, glycemic control, T1DM, T2DM, Diabetes Canada]
  - front: "What are the time-in-range targets for glucose monitoring in diabetes?"
    back: "Time in range (glucose 3.9-10 mmol/L): >70%. Time above range: <25%. Time below range (hypoglycemia): <4%.\n\nContinuous glucose monitoring (CGM) provides time-in-range metrics that supplement A1C. Time-in-range has been associated with reduced risk of microvascular complications. CGM devices can be recommended for some people with diabetes to optimize self-management."
    difficulty: easy
    tags: [time in range, CGM, glucose monitoring, diabetes targets]
  - front: "What are the nutritional recommendations for patients with diabetes?"
    back: "45-60% carbohydrates, 15-20% protein, <35% fats as a percentage of total daily energy. <7% saturated fats and <10% polyunsaturated fats. Replace high-glycemic-index with low-glycemic-index carbohydrates. Increase fibre. Limit sodium, alcohol, caffeine. Nutritional therapy can reduce A1C by 1-2%.\n\nIn T1DM, carbohydrate counting is used to determine prandial insulin dosing. In T2DM, weight reduction is the primary dietary goal to improve insulin sensitivity and glycemic control. Personalized dietary patterns based on values and preferences are encouraged by Diabetes Canada guidelines."
    difficulty: easy
    tags: [diabetes nutrition, carbohydrate counting, glycemic index, dietary therapy]
  - front: "What are the exercise recommendations for T2DM?"
    back: "At least 150 minutes per week of moderate-vigorous aerobic exercise and at least 2 sessions per week of resistance exercise.\n\nRegular physical exercise improves insulin sensitivity, lowers lipid concentrations, and helps control blood pressure. Losing 5-10% of initial body weight can improve insulin sensitivity, glycemic control, hypertension, and dyslipidemia. Smoking cessation and psychosocial support are also important components of T2DM management."
    difficulty: easy
    tags: [diabetes, exercise, T2DM, lifestyle modification]
  - front: "When should pharmacologic therapy be initiated in T2DM?"
    back: "Initiate non-insulin antihyperglycemic therapy within 3 months if lifestyle management does not achieve adequate glycemic control. If initial A1C is more than 1.5% above the patient's target, start pharmacologic therapy immediately and consider combination therapy. If presenting in metabolic decompensation, start insulin + metformin.\n\nThe 'treat to target' approach requires adjusting therapy in a timely fashion to achieve target A1C within 3-6 months of diagnosis. Metformin remains the preferred initial agent due to high efficacy, low hypoglycemia risk, weight-neutral or weight-lowering effect, low cost, and cardiovascular safety."
    difficulty: easy
    tags: [T2DM treatment, metformin, pharmacotherapy initiation, glycemic control]
  - front: "What are the key properties of metformin as initial therapy for T2DM?"
    back: "Metformin: high A1C-lowering efficacy, low hypoglycemia risk, weight neutral/loss effect, low cost. Main side effect: lactic acidosis (rare). Should be held when patient is ill and unable to maintain fluid intake or has acute decline in renal function (part of 'SAD MANS' medications to hold when sick).\n\nSAD MANS = Sulfonylureas, ACEIs, Diuretics/direct renin inhibitors, Metformin, ARBs, NSAIDs, SGLT2i — medications to hold on sick days to prevent acute kidney injury, electrolyte disturbances, and lactic acidosis. Metformin is contraindicated or should be dose-adjusted in significant renal impairment."
    difficulty: easy
    tags: [metformin, T2DM, sick day management, SAD MANS, lactic acidosis]
  - front: "What is the 'SAD MANS' mnemonic for sick day medication management in diabetes?"
    back: "SAD MANS = Sulfonylureas, ACEIs, Diuretics and direct renin inhibitors, Metformin, ARBs, NSAIDs, SGLT2i. These should be held when a diabetic patient is ill, unable to maintain fluid intake, or has acute renal function decline.\n\nSick day management is critical in diabetes. Holding these medications prevents acute kidney injury (NSAIDs, ACEIs, ARBs, diuretics), lactic acidosis (metformin), hypoglycemia (sulfonylureas), euglycemic DKA (SGLT2i), and electrolyte disturbances. Blood glucose should be monitored more frequently when ill."
    difficulty: easy
    tags: [sick day management, SAD MANS, diabetes, AKI prevention]
  - front: "What are the 8 I's that precipitate diabetic ketoacidosis (DKA)?"
    back: "The 8 I's precipitating DKA: Infection, Ischemia or Infarction, Iatrogenic (glucocorticoids), Intoxication, Insulin missed, Inflammation (pancreatitis, cholecystitis), Intraoperative/perioperative stress, Infant (pregnancy-related).\n\nDKA occurs primarily in T1DM but can also occur in T2DM (especially with SGLT2i). Identifying and treating the precipitating cause is essential alongside insulin and fluid resuscitation. The most common precipitant is infection. Missed insulin is preventable through patient education."
    difficulty: easy
    tags: [DKA precipitants, 8 Is, diabetic ketoacidosis, T1DM]
  - front: "What are the second-line add-on therapy options for T2DM, and what factors guide selection?"
    back: "Options include: SGLT2 inhibitors, GLP-1 receptor agonists, DPP-4 inhibitors, sulfonylureas, insulin (usually basal), thiazolidinediones, and other agents. Selection is guided by: CV risk, kidney disease, heart failure, GFR, glucose-lowering effectiveness, hypoglycemia risk, and effect on body weight.\n\nSGLT2 inhibitors and GLP-1 receptor agonists have demonstrated cardiovascular and renal protective benefits beyond glucose lowering in high-risk patients. Sulfonylureas have the highest efficacy but carry hypoglycemia risk and weight gain. Thiazolidinediones cause edema, heart failure risk, and fractures. Cost also varies significantly between agents."
    difficulty: medium
    tags: [T2DM, antihyperglycemic agents, SGLT2i, GLP-1, DPP-4, sulfonylurea]
  - front: "What is the onset, peak, and duration of rapid-acting insulin analogues (e.g., aspart, lispro, glulisine)?"
    back: "Onset: 10-15 minutes. Peak: 1-1.5 hours. Duration: 3.5-4.75 hours. Insulin faster aspart (Fiasp) has faster onset of ~4 minutes.\n\nRapid-acting analogues are given just before or at mealtime (prandial/bolus insulin). They mimic the normal physiological insulin spike after meals. Their faster onset compared to regular insulin (30 min onset, 2-3h peak, 6.5h duration) allows more flexible meal timing."
    difficulty: easy
    tags: [insulin pharmacokinetics, rapid-acting insulin, bolus insulin, aspart, lispro]
  - front: "What are the long-acting basal insulin analogues and their durations?"
    back: "Insulin detemir (Levemir): 16-24 hours. Insulin glargine 100 units/mL (Lantus/Basaglar): 24 hours. Insulin glargine 300 units/mL (Toujeo): >30 hours. Insulin degludec (Tresiba): ~42 hours.\n\nLong-acting insulins have no pronounced peak, providing stable background insulin coverage. Glargine 300 and degludec have lower hypoglycemia risk due to flatter profiles. Detemir may require twice-daily dosing. These basal insulins are used in both T1DM (with bolus) and T2DM (with oral agents initially)."
    difficulty: easy
    tags: [basal insulin, glargine, detemir, degludec, long-acting insulin]
  - front: "What is the basal-bolus insulin regimen for T1DM?"
    back: "Estimated total insulin requirement: 0.5-0.7 units/kg/day. 40% given as basal insulin at bedtime. 20% given as bolus insulin before each of breakfast, lunch, and dinner (i.e., 60% total as bolus, split equally between 3 meals).\n\nBasal-bolus (multiple daily injections, MDI) is the standard regimen for T1DM. Alternatively, a continuous subcutaneous insulin infusion (CSII/insulin pump) can be used. When paired with continuous glucose monitoring, automated insulin delivery ('artificial pancreas') significantly improves time-in-range."
    difficulty: easy
    tags: [T1DM insulin regimen, basal-bolus, MDI, insulin pump, CSII]
  - front: "How do you titrate insulin for hyperglycemia readings throughout the day?"
    back: "High AM sugar → increase bedtime basal insulin. High lunch sugar → increase AM rapid/regular insulin. High supper sugar → increase lunch rapid/regular insulin OR increase AM basal insulin. High bedtime sugar → increase supper rapid/regular insulin.\n\nPattern management of blood glucose requires systematic identification of which insulin dose is responsible for which time period. AM glucose reflects overnight basal control; post-meal readings reflect bolus coverage. This logical approach helps avoid overcorrecting with incorrect insulin type or timing."
    difficulty: medium
    tags: [insulin titration, blood glucose pattern, basal insulin, bolus insulin, diabetes management]
  - front: "What genetic syndromes are associated with development of diabetes mellitus?"
    back: "Down's syndrome (trisomy 21), Klinefelter's syndrome (47,XXY), and Turner's syndrome (45,XO) are all associated with increased risk of diabetes mellitus.\n\nThese chromosomal abnormalities are categorized under 'genetic syndromes associated with DM.' Down syndrome is associated with both T1DM and T2DM. Klinefelter syndrome is associated with hypogonadism and metabolic syndrome increasing T2DM risk. Turner syndrome is associated with autoimmune T1DM risk."
    difficulty: easy
    tags: [diabetes genetics, Down syndrome, Klinefelter, Turner syndrome, chromosomal abnormalities]
  - front: "What are the glycemic targets for patients with diabetes as per Diabetes Canada guidelines?"
    back: "Fasting/preprandial plasma glucose: 4-7 mmol/L. 2h post-prandial glucose: 5-10 mmol/L (5-8 mmol/L if A1C not at target and can be safely achieved). LDL-C: <2.0 mmol/L or 50% reduction. Blood pressure: <130/80 mmHg.\n\nThese comprehensive targets reflect the multifactorial nature of diabetes management — not just glucose but also lipid and BP control are critical. The combination of glycemic control, BP management, and statin therapy has additive benefits in reducing microvascular and macrovascular complications."
    difficulty: easy
    tags: [diabetes targets, glucose targets, LDL target, blood pressure target, Diabetes Canada]
  - front: "What are the autoantibodies associated with Type 1 Diabetes?"
    back: "Islet cell antibodies present in up to 60-85% of T1DM patients. Most common is anti-glutamic acid decarboxylase (anti-GAD). Up to 60% have antibodies against insulin. Pancreatic islet autoantibodies (Stages 1-2) can be detected as a subclinical prodrome in first- and second-degree relatives.\n\nScreening first-degree relatives for islet autoantibodies can identify pre-symptomatic T1DM (Stage 1: two or more autoantibodies, normoglycemia; Stage 2: dysglycemia; Stage 3: symptomatic). LADA (latent autoimmune diabetes in adults) is classified under T1DM and presents with slow autoimmune beta-cell destruction."
    difficulty: easy
    tags: [T1DM autoantibodies, anti-GAD, islet cell antibodies, LADA, T1DM staging]
  - front: "What is icosapent ethyl (Vascepa) and in what clinical context is it used in Canada?"
    back: "Icosapent ethyl is a purified EPA (eicosapentaenoic acid) omega-3 fatty acid used to decrease cardiovascular event risk in patients with ASCVD or with diabetes plus ≥1 CVD risk factor who have TG 1.5-5.6 mmol/L even on maximally tolerated statin therapy (per CCS 2021 guidelines).\n\nThe REDUCE-IT trial demonstrated significant CV event reduction with icosapent ethyl. A substudy showed it had minimal effect on Lp(a), homocysteine, oxidized LDL, interleukin-6, and hs-CRP, while the mineral oil comparator increased these biomarkers — suggesting the mineral oil may have attenuated the true benefit seen in REDUCE-IT."
    difficulty: medium
    tags: [icosapent ethyl, REDUCE-IT, omega-3, hypertriglyceridemia, CCS 2021, ASCVD]
  - front: "What is Maturity-Onset Diabetes of the Young (MODY)?"
    back: "MODY (also known as monogenic diabetes) is a type of diabetes caused by genetic defects in beta-cell function (category III of DM etiologic classification). It presents typically in young people, is autosomal dominant, and mimics either T1DM or T2DM depending on the subtype.\n\nMODY is often misdiagnosed as T1DM or T2DM. Key features: strong family history (autosomal dominant), onset usually <25 years, non-obese, absent islet autoantibodies. Different MODY subtypes have different genes affected (e.g., MODY2: GCK mutations; MODY3: HNF1A). Genetic testing is required for definitive diagnosis."
    difficulty: medium
    tags: [MODY, monogenic diabetes, beta-cell defect, diabetes genetics, young onset diabetes]
  - front: "What was the primary conclusion of the 4T Trial (ATTrial) regarding insulin regimens in T2DM?"
    back: "The basal insulin (detemir) regimen provided the best glycemic control over 3 years, with fewer severe hypoglycemic events and less weight gain compared to prandial or biphasic insulin regimens.\n\nThe 4T Trial compared thrice-daily prandial aspart, twice-daily biphasic aspart, and once-daily basal detemir over 3 years. Despite no significant difference in median HbA1c between arms, basal insulin had the fewest hypoglycemic events and least weight gain, making it the preferred starting insulin regimen."
    difficulty: medium
    tags: [diabetes, insulin, T2DM, basal insulin, clinical trials]
  - front: "What did the ACCORD Blood Pressure Trial conclude about intensive BP control (target <120 mmHg) in T2DM patients with CV risk factors?"
    back: "Intensive BP lowering to <120 mmHg (vs. 140 mmHg) in T2DM patients with CV risk factors did NOT reduce major CV events (composite nonfatal MI, nonfatal stroke, CV death), but did significantly reduce stroke rates. It increased adverse events including bradycardia/arrhythmia and hyperkalemia.\n\nThe ACCORD BP trial (n=4733) found no significant difference in the composite primary outcome with intensive vs. standard BP control. However, stroke rates were significantly reduced (0.32%/yr vs. 0.53%/yr). Intensive therapy required more medications (mean 3.4 vs. 2.1) and caused more serious adverse events."
    difficulty: medium
    tags: [diabetes, blood pressure, T2DM, ACCORD, cardiovascular outcomes]
  - front: "What did the ACCORD Lipid Trial conclude about adding fibrate therapy to statin therapy in T2DM?"
    back: "Adding fibrate therapy to statin therapy in T2DM did NOT reduce major cardiovascular events (nonfatal MI, nonfatal stroke, or CV death).\n\nThe ACCORD Lipid Trial (n=5518, mean follow-up 4.7 years) found no significant differences in the primary composite outcome, all MI, all stroke, or all-cause mortality between statin + fibrate vs. statin alone. This does not support routine combination therapy for CV risk reduction in T2DM."
    difficulty: medium
    tags: [diabetes, lipids, fibrate, statin, ACCORD, T2DM]
  - front: "What were the key findings of the DCCT trial regarding intensive insulin therapy in T1DM?"
    back: "Intensive therapy (≥3 daily injections or insulin pump with QID BG monitoring) significantly reduced retinopathy development/progression, microalbuminuria, albuminuria, and clinical neuropathy compared to conventional therapy (1-2 injections/day). It increased severe hypoglycemia.\n\nThe DCCT trial (n=1441 T1DM patients) demonstrated that tight glycemic control reduces microvascular complications. This established the evidence base for intensive insulin therapy in T1DM. The tradeoff is increased risk of severe hypoglycemia."
    difficulty: easy
    tags: [T1DM, DCCT, microvascular complications, intensive insulin, retinopathy]
  - front: "What did the EDIC study (post-DCCT follow-up) show about the long-term cardiovascular benefits of intensive therapy in T1DM?"
    back: "Over 17-year follow-up, intensive therapy reduced the risk of any cardiovascular event by 42% and nonfatal MI, stroke, or CV death by 57% compared to conventional therapy.\n\nThe EDIC follow-up of DCCT patients demonstrated 'metabolic memory' — the CV protective effects of intensive glycemic control during the DCCT persisted long after glycemic differences were equalized. This supports early intensive glucose control in T1DM for both micro- and macrovascular benefit."
    difficulty: medium
    tags: [T1DM, EDIC, DCCT, cardiovascular outcomes, metabolic memory]
  - front: "What did UKPDS 33 demonstrate about intensive glucose control with sulfonylurea or insulin in newly diagnosed T2DM?"
    back: "Intensive glucose control (target FPG <6 mmol/L) reduced microvascular complications by 25% and any diabetes-related endpoint by 12%, but did NOT significantly reduce macrovascular events or all-cause mortality. It increased hypoglycemia and weight gain.\n\nUKPDS 33 (n=3867 newly diagnosed T2DM) established that intensive glycemic control primarily benefits microvascular outcomes. The lack of macrovascular benefit with sulfonylurea/insulin (unlike metformin in UKPDS 34) guided subsequent treatment algorithms."
    difficulty: medium
    tags: [T2DM, UKPDS, sulfonylurea, insulin, microvascular, glycemic control]
  - front: "What did UKPDS 34 show about metformin as first-line therapy in overweight T2DM patients?"
    back: "Metformin reduced any diabetes-related endpoint by 32%, diabetes-related death by 42%, and all-cause mortality by 36% in overweight T2DM. It outperformed sulfonylureas and insulin for diabetes-related endpoints, all-cause mortality, and stroke, with less weight gain and hypoglycemia.\n\nUKPDS 34 established metformin as the preferred first-line agent in overweight T2DM, as it provided both microvascular AND macrovascular benefits — unlike sulfonylurea/insulin in UKPDS 33. This remains foundational to Canadian Diabetes guidelines recommending metformin as first-line therapy."
    difficulty: medium
    tags: [T2DM, UKPDS, metformin, overweight, macrovascular, first-line therapy]
  - front: "What is the key concept of 'legacy effect' or 'metabolic memory' demonstrated by the UKPDS Extension (10-year follow-up)?"
    back: "Despite early loss of between-group HbA1c differences after the trial ended, sustained reductions in microvascular risk and emergent risk reductions for MI and all-cause mortality persisted in both the sulfonylurea/insulin and metformin groups over 10 years of post-trial follow-up.\n\nThe UKPDS Extension showed that early intensive glucose control produces durable benefits even after glycemic equalization — the 'legacy effect.' The metformin group showed 33% reduction in MI and 27% reduction in all-cause mortality at 10 years. This supports early glycemic optimization."
    difficulty: hard
    tags: [T2DM, UKPDS, legacy effect, metabolic memory, macrovascular, long-term outcomes]
  - front: "What did the Steno-2 study demonstrate about multifactorial intervention in T2DM with microalbuminuria?"
    back: "Intensified, target-driven multifactorial therapy (combination of medications and focused behavior modification) significantly reduced all-cause mortality, cardiovascular mortality, cardiovascular events, progression to end-stage renal disease, and rates of retinal photocoagulation compared to conventional treatment.\n\nSteno-2 (n=160 T2DM patients with microalbuminuria) demonstrated that addressing multiple risk factors simultaneously (BP, lipids, glucose, lifestyle) yields greater benefits than treating each factor in isolation. This supports comprehensive risk factor management in high-risk T2DM."
    difficulty: medium
    tags: [T2DM, Steno-2, multifactorial, microalbuminuria, cardiovascular outcomes]
  - front: "What did the FIELD study show about fenofibrate in T2DM patients?"
    back: "Fenofibrate in T2DM patients not on statin therapy significantly reduced non-fatal MI (HR 0.76) and total cardiovascular events (HR 0.89), but did NOT significantly reduce coronary events or CHD mortality. Overall, it did not significantly reduce the primary coronary event endpoint.\n\nFIELD (n=9,795 T2DM patients) showed modest benefit of fenofibrate for total CV events but failed the primary coronary endpoint. Combined with the neutral ACCORD Lipid result, this does not support routine fibrate use for primary CV risk reduction in T2DM, especially when added to statin therapy."
    difficulty: medium
    tags: [fenofibrate, fibrate, T2DM, FIELD, lipids, cardiovascular outcomes]
  - front: "What additional cardiovascular and renal outcomes trials are relevant for GLP-1 agonists in T2DM (list key trials)?"
    back: "Key GLP-1 agonist CV outcome trials: REWIND (dulaglutide, Lancet 2019), SUSTAIN-6 (semaglutide, NEJM 2016), PIONEER 6 (oral semaglutide, NEJM 2019), HARMONY-OUTCOMES (albiglutide, Lancet 2018), AMPLITUDE-O (efpeglenatide, NEJM 2021). SELECT trial (semaglutide in obesity without diabetes, NEJM 2023) showed CV benefit even without T2DM.\n\nMultiple GLP-1 receptor agonists have demonstrated cardiovascular benefits beyond glucose lowering in T2DM. The SELECT trial established that semaglutide reduces major adverse cardiovascular events (MACE) in obese patients without T2DM, expanding the indication for weight management with CV benefit."
    difficulty: hard
    tags: [GLP-1 agonist, semaglutide, dulaglutide, cardiovascular outcomes, T2DM, obesity]
  - front: "What is the Canadian screening recommendation for Type 2 diabetes in adults without risk factors?"
    back: "Screen all adults ≥40 years with FBG or HbA1C every 3 years. Use the CANRISK calculator to identify high-risk individuals who may need earlier/more frequent testing.\n\nDiabetes Canada recommends population-level screening starting at age 40 every 3 years. More frequent/earlier testing is required if ≥1 risk factor is present. The CANRISK calculator assesses individual risk."
    difficulty: easy
    tags: [diabetes, T2DM, screening, HbA1C, FBG, CANRISK]
  - front: "What are the key risk factors for Type 2 diabetes in Canada?"
    back: "First-degree relative with DM; age ≥40; obesity (especially abdominal); HTN, hyperlipidemia, CAD, vascular disease; prior gestational DM or macrosomic baby (>4 kg); PCOS; history of IGT or IFG; acanthosis nigricans; medications (glucocorticoids, atypical antipsychotics, HAART); high-risk populations (Indigenous, Hispanic, Asian, African descent).\n\nIndigenous Canadians have particularly high rates of T2DM — 1 in 5 Indigenous people has diabetes. Risk factors reflect both metabolic predispositions and social determinants of health."
    difficulty: easy
    tags: [T2DM, risk factors, diabetes, Indigenous, PCOS, gestational diabetes]
  - front: "What are the advantages and disadvantages of HbA1C as a screening/monitoring tool for diabetes?"
    back: "Advantages: convenient (any time of day), single sample, predicts microvascular complications, better CVD predictor than FBG, low day-to-day variability, reflects long-term glucose. Disadvantages: costly, misleading in hemoglobinopathies/iron deficiency/hemolytic anemia/severe hepatic or renal disease, altered by ethnicity and aging, NOT for diagnosis in children/adolescents, pregnant women, CF, or suspected T1DM.\n\nHbA1C reflects average blood glucose over ~3 months (RBC lifespan). Its accuracy is compromised in conditions affecting RBC turnover or structure. Standardized, validated assays are required."
    difficulty: medium
    tags: [HbA1C, diabetes monitoring, limitations, screening]
  - front: "What are the SMART goals for diabetes management in Canada?"
    back: "A1C: <7% (optimal glycemic control); BP: <130/80 mmHg; Cholesterol: LDL-C <2 mmol/L if treating; Drugs: consider ACEi/ARB, Statin, and ASA; Exercise/Eating; Smoking Cessation.\n\nThe SMART mnemonic captures the multifactorial targets in diabetes management. Achieving multiple targets simultaneously reduces microvascular and macrovascular complications more effectively than glycemic control alone."
    difficulty: easy
    tags: [diabetes, SMART goals, A1C, blood pressure, LDL, cardiovascular risk]
  - front: "What is the initial pharmacologic approach for a newly diagnosed T2DM patient with HbA1C >1.5% above target?"
    back: "Start metformin PLUS a second agent (rather than metformin alone). If symptomatic hyperglycemia or metabolic decompensation is present, start insulin + metformin.\n\nDiabetes Canada guidelines recommend more aggressive initial therapy when HbA1C is substantially above target. Dual therapy from the start speeds attainment of glycemic goals and reduces time-to-target."
    difficulty: medium
    tags: [T2DM, metformin, pharmacology, dual therapy, insulin, HbA1C]
  - front: "Which T2DM pharmacologic agents have demonstrated cardiorenal benefits and when should they be prioritized?"
    back: "SGLT2 inhibitors (empagliflozin, dapagliflozin, canagliflozin) and GLP-1 receptor agonists (liraglutide, semaglutide, dulaglutide) have cardiorenal benefits. Prioritize SGLT2i for patients with atherosclerotic CVD, CKD, or heart failure (especially with reduced ejection fraction). GLP-1 RA preferred if ASCVD with MACE risk or weight loss needed.\n\nPer 2020 Diabetes Canada CPG, SGLT2i are the preferred add-on for HF and CKD. GLP-1 RAs are preferred for ASCVD with prominent MACE risk. Both classes reduce CV mortality beyond glucose lowering."
    difficulty: hard
    tags: [SGLT2 inhibitors, GLP-1 agonists, cardiorenal, T2DM, cardiovascular, CKD, heart failure]
  - front: "When should an ACEi/ARB be used in a diabetic patient?"
    back: "Use ACEi or ARB in DM patients with: clinical macrovascular disease; age ≥55; OR age <55 with microvascular complications.\n\nACEi/ARBs reduce progression of diabetic nephropathy and provide cardiovascular protection. They are recommended regardless of blood pressure status when the above criteria are met."
    difficulty: easy
    tags: [ACEi, ARB, diabetes, nephropathy, macrovascular, microvascular]
  - front: "When should a statin be prescribed in a diabetic patient?"
    back: "Prescribe statin if: clinical macrovascular disease; age ≥40; OR age <40 with diabetes duration >15 yr and age >30 yr, microvascular complications, or other CV risk factors.\n\nStatins reduce cardiovascular events in diabetic patients. The age-based thresholds reflect increasing absolute CV risk with advancing age and disease duration."
    difficulty: easy
    tags: [statin, diabetes, cardiovascular risk, LDL, T2DM]
  - front: "What are the non-pharmacologic management strategies for T2DM?"
    back: "Diet: reduce HbA1C by 1-2%, moderate weight loss (5%) improves glycemic control, see registered dietician, decrease saturated + trans fats to <10% calories, avoid simple sugars, low glycemic index foods. Physical activity: ≥150 min aerobic exercise + 2 resistance training sessions/week; encourage 30-45 min moderate exercise 4-7 days/week.\n\nLifestyle interventions are the cornerstone of T2DM management. Even modest weight loss of 5% meaningfully improves glycemic control and cardiovascular risk. Exercise increases insulin sensitivity and lowers BP."
    difficulty: easy
    tags: [T2DM, lifestyle, diet, exercise, non-pharmacologic, weight loss]
  - front: "What is the definition of T2DM remission and what weight loss is required?"
    back: "T2DM remission: achieving prediabetes or normal HbA1C levels without antihyperglycemic medications for a minimum of 3 months. Sustained weight loss of ≥15 kg from initial body weight is associated with the greatest probability of remission.\n\nRemission is most achievable in early T2DM in overweight/obese patients with motivation for weight loss. It is not appropriate for patients with significant eating disorders, mental health conditions, atherosclerotic CVD, CHF, or CKD."
    difficulty: medium
    tags: [T2DM, remission, weight loss, HbA1C, diabetes]
  - front: "List the oral pharmacologic agents used for T2DM."
    back: "Biguanides (metformin); Thiazolidinediones (pioglitazone, rosiglitazone); α-glucosidase inhibitors (acarbose); Non-sulfonylurea insulin secretagogues (repaglinide); Sulfonylureas (glyburide, glimepiride, gliclazide); DPP-4 inhibitors (sitagliptin, linagliptin); SGLT2 inhibitors (canagliflozin, dapagliflozin, empagliflozin).\n\nEach class has different mechanisms, side effect profiles, and cardiorenal implications. Metformin remains first-line. SGLT2i and GLP-1 RAs have added cardiorenal benefits beyond glucose lowering."
    difficulty: easy
    tags: [T2DM, oral agents, metformin, SGLT2, DPP4, sulfonylureas]
  - front: "What is the recommended physical activity target for type 2 diabetic patients?"
    back: "At least 150 minutes of aerobic exercise per week plus 2 sessions of resistance training per week. Encourage 30-45 minutes of moderate exercise 4-7 days/week. Promotes cardiovascular fitness, increases insulin sensitivity, lowers BP, and improves lipid profile.\n\nExercise is a cornerstone of T2DM management with effects on multiple risk factors. Patients using insulin may need to adjust diet, insulin regimen, injection sites, and blood glucose monitoring around exercise."
    difficulty: easy
    tags: [T2DM, exercise, physical activity, insulin sensitivity, lifestyle]
