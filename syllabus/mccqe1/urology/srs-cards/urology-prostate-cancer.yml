# Urology Prostate Cancer (Urology) - generated from srs-mccqe1
cards:
  - front: "What are the epidemiology and key risk factors for prostate cancer?"
    back: "Most prevalent cancer in males; 3rd leading cause of male cancer deaths (following lung and colon). Lifetime risk of death from prostate cancer is 3%; 75% diagnosed between ages 60-85. Risk factors: age >50 (increases 1%/yr after 65), African descent, high dietary fat (2x risk), family history (1st degree relative 2x; 1st and 2nd degree 9x), positive BRCA mutation.\n\nUp to 50% risk of prostate cancer at age 50 (histological). Most prostate cancers are adenocarcinoma (>95%), often multifocal, graded by Gleason score. 60-70% of nodules arise in the peripheral zone."
    difficulty: easy
    tags: [urology, prostate cancer, epidemiology, risk factors]
  - front: "What are the anatomical zones of the prostate and their relative risk of cancer development?"
    back: "Peripheral zone: 60-70% of cancers arise here. Transition zone: 10-20%. Central zone: 5-10%.\n\nThe peripheral zone is the most common site of adenocarcinoma and is palpable on DRE. The transition zone is where BPH typically arises. Prostate cancer is often multifocal and the peripheral zone location means many cancers are detectable by DRE."
    difficulty: easy
    tags: [urology, prostate cancer, anatomy, peripheral zone]
  - front: "What are the most common metastatic sites of prostate cancer and its patterns of spread?"
    back: "Bony metastases to the axial skeleton are most common. Visceral metastases (liver, lung, adrenal gland) are less common. Lymphatic spread: obturator > iliac > presacral/para-aortic nodes. Leg pain and edema occur with nodal metastases obstructing lymphatic and venous drainage.\n\nHematogenous dissemination occurs early. Metastatic prostate cancer commonly causes osteoblastic (sclerotic) bone lesions, distinguishing it from most other cancers which cause osteolytic lesions."
    difficulty: medium
    tags: [urology, prostate cancer, metastases, bone metastases, lymphatic spread]
  - front: "What is the TNM T staging for prostate cancer (AJCC 8th edition)?"
    back: "T1: clinically undetectable, normal DRE and TRUS (T1a: incidental <5% of TURP tissue; T1b: incidental >5% of TURP tissue; T1c: identified by needle biopsy due to elevated PSA). T2: palpable, confined to prostate (T2a: <1/2 one lobe; T2b: >1/2 one lobe; T2c: both lobes). T3: extends through capsule (T3a: extracapsular extension; T3b: seminal vesicle invasion). T4: invades adjacent structures besides seminal vesicles.\n\nThere is no pathological T1 — pathological staging begins at pT2. The T prefix (c) = clinical; (p) = pathological."
    difficulty: hard
    tags: [urology, prostate cancer, TNM staging, AJCC]
  - front: "What defines low-risk, intermediate-risk, and high-risk prostate cancer?"
    back: "Low-risk: PSA <10, Gleason score <7 (Grade Group 1), stage pT1-2a. Intermediate-risk: PSA 10-20, Gleason score 7 (Grade Groups 2 and 3), stage pT2b-T2c. High-risk: PSA >20, Gleason score 8-10 (Grade Groups 4 and 5), stage pT3/4.\n\nRisk stratification guides treatment decisions. Low-risk disease is appropriate for active surveillance. Intermediate and high-risk disease generally requires definitive therapy. Active surveillance for low-risk, small volume Gleason ≤7 prostate cancer is safe for most patients."
    difficulty: medium
    tags: [urology, prostate cancer, Gleason score, risk stratification, PSA]
  - front: "What are the treatment options for localized prostate cancer and their key limitations?"
    back: "Watchful waiting: short life expectancy; only palliative therapy if progression. Active surveillance (serial PSA, DRE, biopsies): low-grade disease; risk of disease progression, serial testing burden. Brachytherapy: low volume, low PSA, low grade; ED (50%), incontinence (<5%). EBRT: locally advanced, older patients; radiation proctitis (5%), ED (25-50%), risk of rectal/bladder cancer. Radical prostatectomy (RP): young (<75 yr), high-risk; incontinence (10%), ED (30-50%).\n\nMinimal differences in cure or recurrence rates between definitive treatment modalities for localized disease. Other options include cryosurgery, HIFU, hormonal ablation, focal laser ablation."
    difficulty: hard
    tags: [urology, prostate cancer, treatment, radical prostatectomy, EBRT, brachytherapy]
  - front: "What is the treatment for metastatic/advanced prostate cancer (N>0 or M>0)?"
    back: "Hormonal therapy (ADT): GnRH agonists (leuprolide, goserelin) or GnRH antagonist (degarelix) + one of enzalutamide, apalutamide, darolutamide + docetaxel, abiraterone, or docetaxel alone. Bilateral orchiectomy decreases testosterone by 90%. Combined androgen blockade (ADT + anti-androgen e.g. bicalutamide). Local irradiation of painful metastases.\n\nFor T3/T4: ADT + calcium + vitamin D + bisphosphonates + EBRT/docetaxel/abiraterone. Castration-resistant prostate cancer (CRPC): maintain ADT; non-metastatic CRPC: apalutamide, enzalutamide, or darolutamide; metastatic CRPC: abiraterone, enzalutamide, docetaxel. Bone metastases: denosumab and/or zoledronic acid."
    difficulty: hard
    tags: [urology, prostate cancer, ADT, GnRH agonist, castration-resistant, metastatic]
  - front: "What is PSA and what are important considerations about its interpretation?"
    back: "PSA is a glycoprotein produced by epithelial cells of the prostate gland that leaks into circulation when glandular architecture is disrupted. <4 ng/mL is traditionally considered normal but there is no single justifiable cut-off. Serum PSA = 15% free + 85% bound. Decreased free:total PSA, elevated PSA velocity, and elevated PSA density are associated with increased CaP rates. PSA is specific to the prostate, NOT to prostate cancer.\n\nNon-malignant causes of elevated PSA include BPH, prostatitis, prostatic ischemia/infarction, prostate biopsy/surgery, prostatic massage, acute urinary retention, urethral catheterization, cystoscopy, TRUS, strenuous exercise, ejaculation, acute renal failure, cardiac surgery-related ischemia, and radiation therapy."
    difficulty: medium
    tags: [urology, PSA, prostate cancer screening, biomarker]
  - front: "What are the 2022 Canadian Urological Association recommendations for PSA screening?"
    back: "Men electing PSA screening should start at age 50; men at increased risk should start at age 45. Screening intervals based on PSA levels: PSA <1 ng/mL = q4 years; PSA 1-3 ng/mL = q2 years; PSA >3 ng/mL = more frequent testing or adjunctive strategies. Men with PSA <1 ng/mL at age 60 may consider discontinuing. All other men: discontinue at age 70. Men with life expectancy <10 years: discontinue.\n\nDRE should be included as part of initial screening. Suspicious DRE findings include abnormal feeling, nodularity, focal lesion, or discrete change in texture/fullness/symmetry. Elevated PSA or abnormal DRE leads to biopsy."
    difficulty: medium
    tags: [urology, PSA screening, prostate cancer, CUA guidelines, Canadian]
