  witness: 'Swept site/*.{js,html,css} excl 247420 bundle for double-decoded UTF-8 (Ã,â€,â˜,Ëœ,â—,â†): after theme.js fix, only triage-live.js line 445 ''next case â†’'' + decorative ✓/× found; converted to ''next case ->'', ''[x]'', ''[ ]''. Final sweep returns clean (no remaining mojibake in source).'
