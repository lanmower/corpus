# Suicide Risk Assessment (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "A 45-year-old man expresses a wish to die. What are the key elements of suicide risk assessment?"
    back: "SADPERSONS or Columbia Suicide Severity Rating Scale (C-SSRS): assess ideation (passive/active/plan/intent/means), history of attempts, protective factors, psychiatric diagnosis, social support, current stressors, access to means (especially firearms, medications)\n\nCANMAT and CPA (Canadian Psychiatric Association) guidelines: all suicidal patients require structured risk assessment. High-risk features: plan + intent + means, prior attempt, male sex, older age, hopelessness, access to lethal means. Risk assessment guides level of care: safety planning, voluntary/involuntary hospitalization."
    difficulty: hard
    tags: [suicide risk assessment, C-SSRS, Columbia scale, SADPERSONS, psychiatry]
  - front: "What are the key epidemiological facts about suicide in Canada?"
    back: "~4500 suicide deaths annually (Canada); highest rates in men 45-65 and Indigenous Canadians; men 3x more likely to die by suicide; women 3x more likely to attempt; firearms are the most lethal method (85% case fatality)\n\nPHAC (Public Health Agency of Canada) suicide statistics: suicide is the 2nd leading cause of death for ages 15-34. Indigenous Canadians have 2-3x higher rates. Means restriction (reducing access to firearms and medications) is one of the most evidence-based suicide prevention strategies."
    difficulty: easy
    tags: [suicide epidemiology, Canada, risk factors, means restriction, psychiatry]
  - front: "What is the difference between suicidal ideation, intent, and plan?"
    back: "Ideation: thoughts of death or self-harm; Intent: decision/resolution to act on ideation; Plan: specific method, time, and place identified — all three together = highest risk (requires immediate intervention and likely hospitalization)\n\nC-SSRS distinguishes passive ideation (\"I wish I were dead\"), active ideation without plan, active with plan but no intent, active with intent and plan. Risk level guides intervention intensity. Safety planning and means restriction are key interventions before hospitalization."
    difficulty: medium
    tags: [suicidal ideation, intent, plan, risk assessment, psychiatry]
  - front: "What is a safety plan and how does it differ from a no-harm contract?"
    back: "Safety plan: personalized crisis management plan — warning signs, coping strategies, social contacts, professional resources, means restriction; Evidence-based. No-harm contract: \"I will not hurt myself\" promise — NOT evidence-based and may provide false reassurance\n\nCANMAT guidelines: safety planning (Stanley-Brown Safety Planning Intervention) is evidence-based and superior to no-harm contracts. Key elements: warning signs, internal coping strategies, social distractors, social supports to contact, crisis resources (distress lines), means restriction."
    difficulty: medium
    tags: [safety planning, no-harm contract, suicide prevention, crisis plan, psychiatry]
  - front: "Under what circumstances can a physician involuntarily admit a patient with suicidal ideation in Canada?"
    back: "When patient has a mental disorder (not just suicidal ideation alone in some provinces), poses serious risk of physical harm to self or others, AND requires hospitalization for treatment — governed by provincial Mental Health Acts (e.g., Form 1 in Ontario, Form H1 in BC)\n\nEach province has its own Mental Health Act for involuntary psychiatric admission. In Ontario, Form 1 (72h detention) can be completed by any physician who has examined the patient. Criteria must be met: serious mental disorder + imminent serious harm to self/others + needs hospitalization."
    difficulty: hard
    tags: [involuntary admission, Mental Health Act, Form 1, Ontario, psychiatry]
  - front: "What are the modifiable risk factors for suicide that should be targeted in treatment?"
    back: "Hopelessness (strongest predictor), depression severity, untreated pain, access to lethal means (especially firearms), social isolation, substance use, poor treatment adherence — all are modifiable\n\nCANMAT suicide prevention guidelines: reducing hopelessness is the strongest therapeutic target. Treating the underlying mental illness is essential. Means restriction: discuss safe storage of firearms and medications with family. Suicide-specific interventions: CBT-SP (CBT for suicide prevention), DBT, CAMS (Collaborative Assessment and Management of Suicidality)."
    difficulty: medium
    tags: [suicide risk factors, hopelessness, means restriction, suicide prevention, psychiatry]
  - front: "What are the protective factors that reduce suicide risk?"
    back: "Social support (family, community), reasons for living (children, religious beliefs, pets), engaged in mental health treatment, problem-solving skills, positive therapeutic alliance, cultural/spiritual beliefs that discourage suicide\n\nCANMAT guidelines: protective factors help balance risk assessment and guide individualized safety planning. Connectedness to family and community is a strong protective factor — especially in First Nations communities where community-based prevention programs are effective. Hope is a key therapeutic target."
    difficulty: easy
    tags: [protective factors, suicide prevention, resilience, reasons for living, psychiatry]
  - front: "A 70-year-old man lost his wife 3 months ago and now expresses passive death wish. He drinks heavily and has given away his possessions. What is his risk level and management?"
    back: "High risk — multiple risk factors: older male, recent loss, alcohol use, passive death wish, giving away possessions (preparatory behaviors); requires urgent psychiatric assessment and likely hospitalization\n\nGiving away possessions and saying goodbyes are preparatory behaviors indicating high near-term risk. Older men are a high-risk group — often present to GPs rather than psychiatrists. Alcohol use markedly increases immediate suicide risk. CANMAT guidelines recommend hospitalization for high-risk patients."
    difficulty: hard
    tags: [suicide risk, elderly, bereavement, alcohol, high risk, psychiatry]
  - front: "What is the evidence for lithium in suicide prevention?"
    back: "Lithium reduces suicide and suicidal behavior by 60-80% in bipolar disorder and recurrent unipolar depression — the strongest anti-suicidal pharmacological agent; mechanism includes serotonergic effects and may reduce impulsivity\n\nCANMAT Bipolar Guidelines: lithium is the only pharmacological agent with proven anti-suicidal properties. This is not true of valproate or other mood stabilizers. When starting lithium for bipolar disorder, the anti-suicidal benefit should be explicitly discussed with the patient."
    difficulty: medium
    tags: [lithium, anti-suicidal, bipolar disorder, suicide prevention, psychiatry]
  - front: "What is the Columbia Suicide Severity Rating Scale (C-SSRS) and how is it used clinically?"
    back: "C-SSRS: 2 categories — ideation severity (passive wish to be dead, active ideation, ideation with plan, ideation with intent) and behavior (preparatory acts, interrupted attempt, aborted attempt, actual attempt) — standardized risk assessment tool\n\nCANMAT recommends C-SSRS as the standard clinical suicide risk assessment tool. C-SSRS has been validated in emergency departments, inpatient, and outpatient settings. Identifies individuals at risk more reliably than clinical interview alone. Free online training available."
    difficulty: easy
    tags: [C-SSRS, Columbia scale, suicide assessment, risk stratification, psychiatry]
  - front: "What is postvention and why is it important?"
    back: "Postvention: support provided to survivors (family, friends, colleagues) after a suicide death — reduces grief complications, survivor guilt, and secondary PTSD; also involves connecting to resources and reducing suicide contagion\n\nCANMAT/CAMH: suicide survivors have 3x higher risk of dying by suicide. Postvention programs for schools, workplaces, and communities are evidence-based. Media guidelines (Reporting on Suicide): avoid detailed method descriptions, romanticization, and sensationalism — reduce contagion effect."
    difficulty: medium
    tags: [postvention, suicide survivors, contagion, media guidelines, psychiatry]
  - front: "What is passive suicidal ideation and how does it differ from active suicidal ideation?"
    back: "Passive: wishes to be dead or \"not wake up\" — \"I wish I were dead\" without intent to act; Active: actual thoughts of killing oneself, with or without specific plan or intent\n\nClinical assessment of passive vs. active ideation guides management. Passive ideation may escalate to active ideation — requires monitoring and treatment of underlying disorder. Both require empathic inquiry without minimization. Passive ideation alone does not typically warrant involuntary hospitalization if protective factors are strong."
    difficulty: easy
    tags: [passive suicidal ideation, active suicidal ideation, risk assessment, C-SSRS, psychiatry]
  - front: "How should suicide risk be documented in the medical record?"
    back: "Document: specific ideation content, presence/absence of plan and intent, means identified, history of attempts, protective factors, risk level assessment, clinical reasoning for management decision, plan and follow-up — comprehensive documentation supports continuity of care and medicolegal protection\n\nCMPA (Canadian Medical Protective Association) guidelines: complete documentation of suicide risk assessment and rationale for management decisions is a medicolegal requirement. Include that means restriction was addressed. Document collateral information sources. Document capacity assessment if involuntary admission considered."
    difficulty: medium
    tags: [documentation, suicide risk, medicolegal, capacity, psychiatry]
  - front: "What are the evidence-based psychotherapies for suicidal patients?"
    back: "CBT for suicide prevention (CBT-SP), Dialectical Behavior Therapy (DBT) — especially for BPD, Collaborative Assessment and Management of Suicidality (CAMS), Brief Cognitive Behavioral Therapy (BCBT-MIL)\n\nCANMAT: DBT (Marsha Linehan) is the gold standard for BPD with suicidal behavior — reduces attempts by 50%. CAMS is a therapeutic framework for collaborative suicide risk assessment and management. CBT-SP reduces attempts in adolescents. All approaches involve hope installation and reasons for living."
    difficulty: medium
    tags: [CBT-SP, DBT, CAMS, suicide psychotherapy, psychiatry]
  - front: "What is physician-assisted dying (MAID) and how does it differ from suicide?"
    back: "MAID (Medical Assistance in Dying): legal in Canada, for adults with a serious irremediable medical condition causing intolerable suffering — patient-requested, physician-administered or patient self-administered; NOT the same as suicide\n\nBill C-14 (2016) and C-7 (2021) legalized and expanded MAID in Canada. Eligibility: ≥18 years, serious irremediable illness, grievous/intolerable suffering (physical or psychological), capable of informed consent. Mental illness as sole underlying condition: planned eligibility from 2024. CANMAT provides guidance on mental health MAID requests."
    difficulty: hard
    tags: [MAID, medical assistance in dying, Canada, Bill C-7, psychiatry]
  - front: "What is the SAD PERSONS suicide risk assessment?"
    back: "Sex(male), Age(<19/>45), Depression, Previous attempt, Ethanol, Rational thinking loss, Social supports lacking, Organized plan, No spouse, Sickness(chronic)\n\nHigher score = higher risk. Key high-risk factors: prior attempt (strongest predictor), male, access to lethal means, social isolation, hopelessness. Always assess intent, plan, means, protective factors."
    difficulty: medium
    tags: [suicide, risk assessment]
  - front: "What is the SAD PERSONS scale for suicide risk assessment?"
    back: "S: Sex (male), A: Age (<19 or >45), D: Depression, P: Previous attempt, E: Ethanol/drug abuse, R: Rational thinking loss (psychosis), S: Social supports lacking, O: Organized plan, N: No spouse, S: Sickness (chronic illness). Each scores 1 point. 0-2: may be safe to discharge with follow-up. 3-4: close follow-up. 5-6: strongly consider hospitalization. 7-10: hospitalize.\n\nWhile SAD PERSONS is widely taught, its predictive validity is limited. Canadian guidelines recommend comprehensive risk assessment over sole reliance on scales. Columbia Suicide Severity Rating Scale (C-SSRS) is increasingly used in Canadian EDs. No scale replaces clinical judgment."
    difficulty: medium
    tags: [SAD PERSONS, suicide risk, assessment tool, psychiatry]
  - front: "What are the key risk factors for completed suicide?"
    back: "Strongest: previous suicide attempt (single strongest predictor), psychiatric illness (MDD, bipolar, schizophrenia, BPD, SUD), male sex (3:1 completed suicide ratio M:F), access to lethal means (especially firearms). Other: older age, chronic pain/illness, recent discharge from psychiatric care, family history, social isolation, recent loss, Indigenous identity (3x rate in Canada).\n\nIn Canada, suicide is the 9th leading cause of death and 2nd leading cause in youth (15-24). Canadian Armed Forces members and Indigenous peoples have significantly elevated rates. Means restriction (e.g., safe firearm storage, bridge barriers) is one of the most effective population-level interventions."
    difficulty: hard
    tags: [suicide risk factors, completed suicide, epidemiology, psychiatry]
  - front: "What is the approach to acute suicide risk assessment in the ED?"
    back: "(1) Ensure safety (remove means, 1:1 observation). (2) Assess: suicidal ideation (active vs passive), plan (specific, lethal, available means), intent, timeline. (3) Prior attempts (method, lethality, rescue). (4) Risk factors and warning signs. (5) Protective factors (reasons for living, children, religious beliefs, social support, future-oriented thinking). (6) Formulation: low vs moderate vs high risk. (7) Disposition: safety plan + follow-up vs psychiatric consultation vs voluntary/involuntary admission.\n\nNo suicide risk assessment tool is predictive enough to determine disposition alone. Canadian psychiatric emergency guidelines emphasize clinical formulation. The \"4 Ds\" of high risk: desire, determined plan, dangerous method, deterrents absent. Asking about suicide does NOT increase risk-it opens dialogue."
    difficulty: hard
    tags: [suicide assessment, ED, risk evaluation, psychiatry]
  - front: "What is a safety plan and how does it differ from a no-harm contract?"
    back: "Safety plan (Stanley-Brown): (1) Warning signs that crisis is developing, (2) Internal coping strategies (relaxation, distraction), (3) People/social settings that provide distraction, (4) People to contact for help (friends, family), (5) Professionals/agencies to contact (crisis lines, ED), (6) Making environment safe (means restriction). NO-HARM CONTRACTS are NOT recommended-no evidence of efficacy and may provide false reassurance.\n\nSafety plans are evidence-based and reduce suicide attempts by 50% (Stanley et al, 2018). Canadian guidelines recommend safety planning for all patients with suicidal ideation. Crisis Services Canada 988 (national crisis line). Canadian Association for Suicide Prevention provides resources."
    difficulty: hard
    tags: [safety plan, crisis intervention, means restriction, psychiatry]
  - front: "What are the Canadian legal frameworks for involuntary psychiatric admission?"
    back: "Each province has its own Mental Health Act. Common criteria: the person has a mental disorder AND is at risk of serious harm to self or others AND is unwilling/unable to consent to voluntary admission. Two physician certificates are typically required for extended hold. Initial police/physician hold: typically 72 hours for assessment. Patient has right to legal counsel and review board hearing.\n\nIn Ontario: Form 1 (72h assessment by physician), Form 3 (2-week certificate of involuntary admission), Form 4 (additional certificate for renewal). Criteria vary: some provinces include \"deterioration criterion\" (likely to deteriorate without treatment). Capacity to consent is assessed separately from certification under mental health legislation."
    difficulty: hard
    tags: [involuntary admission, Mental Health Act, legal framework, psychiatry]
  - front: "What are the warning signs of imminent suicide risk?"
    back: "Acute warning signs: talking about wanting to die, looking for means (guns, pills, heights), giving away possessions, saying goodbye, increased substance use, withdrawing from activities/people, dramatic mood change (calm after being depressed), researching methods online, making final arrangements.\n\nCanadian Suicide Prevention Service (988) emphasizes recognizing acute warning signs. A sudden improvement in mood in a previously severely depressed patient may indicate they have made the decision to die and feel relieved. This should heighten, not decrease, concern."
    difficulty: medium
    tags: [warning signs, imminent suicide, recognition, psychiatry]
  - front: "How should clinicians respond to a patient who discloses suicidal ideation?"
    back: "(1) Remain calm and non-judgmental, (2) Validate feelings without reinforcing hopelessness, (3) Ask directly about plan, intent, means, and timeline-be specific, (4) Assess protective factors, (5) Determine level of risk, (6) Create safety plan collaboratively, (7) Means restriction counseling, (8) Document thoroughly, (9) Arrange appropriate follow-up or disposition. NEVER dismiss or minimize disclosure.\n\nCMPA (Canadian Medical Protective Association) recommends thorough documentation of suicide risk assessments. Asking about suicide is a clinical duty-omission may constitute negligence. Canadian guidelines recommend that all healthcare providers receive suicide risk assessment training (Applied Suicide Intervention Skills Training-ASIST)."
    difficulty: hard
    tags: [suicidal ideation, clinical response, documentation, psychiatry]
  - front: "What is the epidemiology of suicide in special populations in Canada?"
    back: "Indigenous peoples: 3x national rate, Inuit youth 11x. LGBTQ+ youth: 4x more likely to attempt. Physicians: elevated risk compared to general population. Elderly men: highest rate of completed suicide per capita. Veterans/military: elevated risk. Post-discharge psychiatric patients: highest risk period is first 2 weeks after discharge.\n\nCanadian federal government has identified Indigenous suicide as a public health crisis. Culturally appropriate, community-led interventions are essential. The \"Hope for Wellness\" helpline provides culturally competent crisis support for Indigenous peoples. Transition from inpatient to outpatient care is a critical high-risk period."
    difficulty: medium
    tags: [suicide epidemiology, Indigenous, special populations, psychiatry]
  - front: "What medications are associated with increased vs decreased suicide risk?"
    back: "Increased risk: antidepressants in youth <25 (black box warning-monitor closely first 4 weeks), isotretinoin (controversial), corticosteroids, mefloquine, varenicline (warning removed but monitor). Decreased risk: lithium (only medication with strong anti-suicidal evidence-30% reduction), clozapine (reduces suicidality in schizophrenia-InterSePT trial), ketamine/esketamine (rapid anti-suicidal effect).\n\nHealth Canada black box warning on all antidepressants for age <25 mandates close monitoring (weekly for first 4 weeks). Lithium anti-suicidal effect is independent of mood-stabilizing effect. Clozapine is FDA-approved specifically for suicide risk reduction in schizophrenia. Canadian guidelines recommend lithium consideration when suicide risk is a prominent concern."
    difficulty: hard
    tags: [medication suicide risk, lithium, black box warning, psychiatry]
  - front: "What is the approach to self-harm (non-suicidal self-injury)?"
    back: "NSSI: deliberate self-inflicted tissue damage without suicidal intent (cutting, burning, scratching). Distinct from suicide attempt but NSSI is a risk factor for eventual suicide. Assessment: function (emotion regulation, self-punishment, communication), frequency, severity. Treatment: DBT (most evidence), CBT, emotion regulation skills. Treat underlying conditions (BPD, depression). Do NOT assume it is \"just attention-seeking.\"\n\nNSSI prevalence is 15-25% of adolescents and 4% of adults. Canadian Emergency Department guidelines recommend compassionate, non-judgmental care. NSSI increases future suicide risk 3-6x. Social contagion (peer influence) is a recognized phenomenon, particularly in adolescent inpatient settings."
    difficulty: hard
    tags: [self-harm, NSSI, non-suicidal self-injury, DBT, psychiatry]
  - front: "What is the physician duty to report and duty to protect in suicidal patients?"
    back: "Confidentiality may be broken when there is imminent risk of harm to self or others (per CMA Code of Ethics and provincial legislation). Duty to protect: warn identifiable third parties at risk (Tarasoff-type duty). Documentation requirements: risk assessment, clinical reasoning, safety plan, disposition rationale. Duty to follow up: arrange timely post-discharge care.\n\nCMPA guidance emphasizes that adequate documentation of clinical reasoning protects against liability. Canadian courts have held physicians liable for inadequate suicide risk assessment. The standard is reasonable clinical judgment, not prediction of suicide. Collegial consultations should be documented."
    difficulty: hard
    tags: [duty to report, confidentiality, legal obligations, psychiatry]
  - front: "What is the approach to suicide bereavement and postvention?"
    back: "Postvention: organized response after a suicide to promote healing and prevent further suicides (suicide contagion). Components: immediate crisis response for family/close contacts, screening for at-risk individuals, memorial guidance (avoid glorification), support groups. Bereaved individuals have elevated suicide risk (peer and family). Clinician self-care after patient suicide (50% of psychiatrists experience patient suicide during career).\n\nCanadian Mental Health Association provides suicide bereavement resources. Media guidelines for reporting suicide (avoid details of method, avoid sensationalization) reduce imitative suicides. Schools should have postvention protocols. Clinicians experiencing patient suicide should access peer support-CMPA provides assistance."
    difficulty: medium
    tags: [postvention, suicide bereavement, contagion prevention, psychiatry]
  - front: "What are the protective factors against suicide and how are they incorporated into risk assessment?"
    back: "Individual: problem-solving skills, coping abilities, reasons for living, fear of death/pain, future-oriented thinking, help-seeking behavior. Social: strong family connections, social support, children in the home, therapeutic alliance. Community: access to mental health services, cultural/religious beliefs against suicide. These factors modulate risk but do NOT eliminate it in the presence of strong risk factors.\n\nCanadian suicide risk assessment frameworks (e.g., CARMS: Columbia, Assessment, Risk, Mitigation, Safety plan) integrate protective factors into formulation. Protective factors should be actively strengthened as part of the safety plan. Reasons for living (Linehan inventory) can be used therapeutically."
    difficulty: medium
    tags: [protective factors, risk assessment, safety planning, psychiatry]
  - front: "What is the management of suicide risk in adolescents?"
    back: "Assessment adapted for age: collateral from parents/school, assess social media involvement, bullying, LGBTQ+ identity/discrimination, academic stress. Treatment: CBT, DBT-A (adolescent adaptation), family therapy. Pharmacotherapy: fluoxetine has best risk-benefit profile (only SSRI consistently showing efficacy in adolescent MDD). Close monitoring during SSRI initiation. Safety: means restriction counseling with parents, school-based interventions.\n\nYouth suicide is the second leading cause of death in Canadian adolescents. Kids Help Phone (1-800-668-6868) provides 24/7 support. CPS recommends universal screening for depression/suicidality in adolescents. Social media use and cyberbullying are emerging risk factors. School-based gatekeeper training programs (e.g., safeTALK) are widely implemented in Canada."
    difficulty: hard
    tags: [adolescent suicide, youth mental health, fluoxetine, psychiatry]
  - front: "What are the ethical considerations in end-of-life requests and distinguishing from suicidality?"
    back: "Medical Assistance in Dying (MAID) is legal in Canada (Bill C-14, expanded C-7). Eligibility: >=18, capable of consent, serious and incurable illness/condition, in advanced state of irreversible decline, enduring suffering. Mental illness as sole condition: currently under legislative review/moratorium in Canada. MAID requests require 2 independent physician assessments. Suicidality from mental illness is NOT equivalent to a MAID request.\n\nCanada is one of few countries where MAID is available for conditions where death is not reasonably foreseeable (Track 2). The extension of MAID to mental illness as sole condition was postponed to 2027. Clinicians must carefully differentiate MAID requests from suicidal ideation driven by treatable mental illness."
    difficulty: hard
    tags: [MAID, end of life, medical assistance in dying, ethics, psychiatry]
  - front: "What is the Columbia Suicide Severity Rating Scale (C-SSRS) and how is it used?"
    back: "Standardized tool assessing suicidal ideation severity (5 levels: wish to be dead, nonspecific active thoughts, active ideation without plan, active ideation with plan, active ideation with plan and intent) and suicidal behaviour (actual attempt, interrupted attempt, aborted attempt, preparatory acts). Guides risk stratification and intervention level.\n\nC-SSRS is recommended by Canadian Association for Suicide Prevention and used in many Canadian EDs. It provides a common language for suicide risk communication between providers. Any endorsement of active ideation with plan and intent (level 4-5) warrants immediate safety intervention. The tool differentiates ideation from behaviour, guiding appropriate response."
    difficulty: medium
    tags: [C-SSRS, suicide-assessment, risk-stratification, ideation-severity, standardized-tool]
  - front: "What are the essential components of a suicide safety plan?"
    back: "1) Warning signs (triggers, thoughts, moods, behaviours). 2) Internal coping strategies (distraction, self-soothing). 3) Social contacts for distraction. 4) People to ask for help (family, friends). 5) Professionals/agencies to contact (crisis line, therapist, ED). 6) Making the environment safe (means restriction). Documented, accessible, reviewed regularly.\n\nStanley-Brown Safety Planning is evidence-based and recommended over no-suicide contracts. Canadian Mental Health Commission supports safety planning as a brief intervention. The plan should be collaborative, patient-driven, and stored where accessible (wallet, phone). Studies show safety planning reduces suicidal behaviour by 50% in the 6 months following ED visit."
    difficulty: medium
    tags: [safety-plan, Stanley-Brown, suicide-prevention, crisis-intervention, CMHA]
  - front: "What is means restriction and why is it the most effective suicide prevention strategy?"
    back: "Removing or limiting access to lethal means (firearms, medications, bridges, pesticides). Most effective because: suicide attempts are often impulsive (70% within 1 hour of decision), method substitution is uncommon, reducing access to the planned method reduces overall suicide rate. Examples: medication lockboxes, safe firearm storage, bridge barriers.\n\nMeans restriction is the only suicide prevention strategy with Level 1 evidence. In Canada, firearm-related suicides account for 15% of deaths — safe storage counselling is recommended. Canadian guidelines advise asking about access to firearms and medications during risk assessment. Prescribing smaller quantities of lethal medications (TCAs, lithium) is a clinical application."
    difficulty: medium
    tags: [means-restriction, suicide-prevention, firearms, evidence-based, public-health]
  - front: "What are the key components of a post-suicide attempt assessment?"
    back: "Assess: lethality of attempt (method, medical severity), intent (did they expect to die, precautions against discovery, suicide note), current suicidal ideation (ongoing wish to die?), precipitants, access to means, psychiatric diagnosis, substance use, previous attempts, social supports, protective factors. Disposition: admit if ongoing ideation/plan/intent, inadequate supports, or high-lethality attempt.\n\nThe first 30 days post-attempt carry highest re-attempt risk (100x general population). Canadian guidelines recommend follow-up within 72 hours of ED discharge. The transition from ED to outpatient is the highest-risk period. Caring contacts (follow-up calls/texts) reduce re-attempts. Document risk assessment and rationale for disposition thoroughly."
    difficulty: hard
    tags: [post-attempt, assessment, lethality, disposition, follow-up]
  - front: "What are the unique risk factors for youth suicide?"
    back: "Bullying/cyberbullying, social media/contagion effect, LGBTQ2S+ identity (especially with family rejection), Indigenous youth (3-5x higher rate), impulsivity, substance use (cannabis, alcohol), romantic breakup, academic pressure, previous self-harm, family history of suicide, access to means, recent discharge from psychiatric care.\n\nSuicide is the second leading cause of death in Canadian youth aged 15-24. Indigenous youth have the highest rates, particularly in remote communities. The Canadian Paediatric Society recommends universal screening in clinical settings. Trevor Project evidence supports that family acceptance reduces LGBTQ2S+ suicide risk by 50%. Postvention (support after a peer suicide) prevents contagion."
    difficulty: medium
    tags: [youth-suicide, risk-factors, Indigenous, LGBTQ2S+, CPS]
  - front: "What protective factors against suicide should be assessed and strengthened?"
    back: "Strong social connections (family, friends, community), reasons for living (children, religious beliefs, future plans), problem-solving skills, access to mental health care, restricted access to lethal means, cultural connectedness (especially for Indigenous peoples), employment/purpose, therapeutic alliance, treatment engagement.\n\nCanadian suicide prevention frameworks emphasize building protective factors alongside reducing risk. The Assembly of First Nations and Inuit Tapiriit Kanatami highlight cultural continuity and self-determination as protective for Indigenous communities. Protective factors should be documented in risk assessments and actively reinforced in safety plans."
    difficulty: easy
    tags: [protective-factors, resilience, suicide-prevention, Indigenous, cultural-connectedness]
  - front: "What is the role of the 988 Suicide Crisis Helpline in Canada?"
    back: "988 launched in November 2023 as Canada's national suicide crisis helpline (call or text). Provides immediate support from trained crisis responders 24/7, in English and French. Connects callers to local crisis services. Designed to reduce barriers to accessing help and divert appropriate calls from 911/EDs.\n\nThe 988 line is operated by the Canadian Mental Health Association with PHAC funding. It complements existing provincial crisis lines and the Crisis Text Line (text HOME to 686868). Emergency physicians should include 988 in discharge safety plans. Healthcare providers should familiarize themselves with local crisis resources for warm handoffs."
    difficulty: easy
    tags: [988, crisis-helpline, CMHA, suicide-prevention, Canadian-resource]
  - front: "How should a physician document a suicide risk assessment?"
    back: "Document: risk factors identified, protective factors, current suicidal ideation (frequency, duration, plan, intent, means access), mental status exam, collateral information obtained, clinical formulation of risk level (acute vs chronic, low/moderate/high), safety plan reviewed, means restriction discussed, disposition rationale, and follow-up plan.\n\nDocumentation of suicide risk assessment is both a clinical and medicolegal necessity. Canadian Medical Protective Association (CMPA) recommends documenting the clinical reasoning behind decisions, not just the outcome. Risk level should be described as a clinical judgment (not a prediction). Regular reassessment and updated documentation are expected standards of care."
    difficulty: medium
    tags: [documentation, risk-assessment, medicolegal, CMPA, clinical-reasoning]
  - front: "What is postvention and why is it important after a patient suicide?"
    back: "Postvention: organized response after a suicide to support those affected (family, peers, healthcare team, community). Includes bereavement support, monitoring at-risk individuals (contagion effect), debriefing for healthcare providers, mortality review, and community-level response (school protocols after student suicide).\n\nEach suicide directly affects an estimated 135 people. Healthcare providers are also affected — physician mental health support should be offered after patient suicide. Canadian guidelines recommend structured postvention protocols in schools and workplaces. The contagion effect is real, particularly among youth, requiring media guidelines and targeted monitoring."
    difficulty: medium
    tags: [postvention, contagion, bereavement, healthcare-provider, community-response]
  - front: "What are the warning signs that suggest imminent suicide risk requiring emergency intervention?"
    back: "Expressing intent to die or kill oneself, actively searching for means (buying firearms, stockpiling medications), giving away possessions, saying goodbye, sudden calmness after a period of depression (may indicate decision made), writing a suicide note, increased substance use, social withdrawal, dramatic mood changes, insomnia/agitation, hopelessness, feeling like a burden.\n\nThe IS PATH WARM mnemonic summarizes warning signs: Ideation, Substance abuse, Purposelessness, Anxiety/agitation, Trapped, Hopelessness, Withdrawal, Anger, Recklessness, Mood change. Any patient expressing imminent intent should not be left alone and requires emergency psychiatric evaluation. Canadian Emergency Department guidelines recommend direct observation until assessment is complete."
    difficulty: medium
    tags: [warning-signs, imminent-risk, IS-PATH-WARM, emergency, intervention]
  - front: "What are the four key functions of an emergency psychiatric assessment?"
    back: "1. Rule out medical cause of psychiatric symptoms. 2. Determine if psychiatric consult is needed. 3. Assess for safety issues (suicidal ideation, homicidal ideation). 4. Determine if patient is certifiable (present test: risk to self/others; future test: apparent mental illness).\n\nPsychiatric emergencies require a systematic approach that prioritizes excluding organic causes (e.g., delirium, metabolic, structural) before attributing symptoms to primary psychiatric illness. Certification under mental health legislation enables involuntary treatment when safety is threatened."
    difficulty: medium
    tags: [psychiatric emergency, suicidality, certification, mental health, emergency medicine]
  - front: "What epidemiological facts about suicide are important for MCCQE1?"
    back: "Attempted suicide: females > males. Completed suicide: males > females. Suicide is the second leading cause of death in people under 24 years. Significantly increased incidence among marginalized communities, particularly Indigenous peoples and 2SLGBTQQIA+ Canadians.\n\nWomen attempt suicide more often but use less lethal methods; men use more lethal means resulting in higher completion rates. Indigenous Canadians and sexual/gender minority youth have disproportionately high suicide rates due to systemic social determinants including colonization and discrimination."
    difficulty: easy
    tags: [suicide, epidemiology, Indigenous health, 2SLGBTQQIA+, public health]
  - front: "What are the SAD PERSONS risk factors for suicide?"
    back: "S – Sex (male), A – Age >45 yr, D – Depression, P – Previous attempts, E – Ethanol use, R – Rational thinking loss, S – Suicide in family, O – Organized plan, N – No spouse/support system, S – Serious illness.\n\nThe SAD PERSONS scale provides a structured mnemonic for suicide risk stratification. High-risk features include active intent with organized plan and access to lethal means, which are indications for admission. The Columbia-Suicide Severity Rating Scale is another validated tool used in Canadian EDs."
    difficulty: easy
    tags: [SAD PERSONS, suicide risk, risk stratification, emergency psychiatry]
  - front: "When should a suicidal patient be admitted from the ED?"
    back: "Admit if there is: active intent and organized plan, or access to lethal means. Patient may require certification under local mental health legislation if unwilling to stay voluntarily. Even willing patients at high risk should be certified depending on local regulations. Do NOT start long-term psychiatric medications in the ED.\n\nCertification under provincial mental health legislation (e.g., Ontario Mental Health Act) allows involuntary admission when a patient poses imminent risk. The standard is a two-part test: present risk and likely mental disorder. Intoxicated patients should be reassessed for suicidality once sober."
    difficulty: medium
    tags: [suicidal patient, admission criteria, certification, mental health act, emergency medicine]
