# Pediatrics Endocrinology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the diagnostic criteria and epidemiology of Type 1 Diabetes Mellitus (T1DM) in Canadian children?"
    back: "Epidemiology: most common form of DM in children (M=F), affects 32 per 100,000 children in Canada, bimodal peaks at 5–9 and 10–14 years. Diagnosis (any one): symptoms (polyuria, polydipsia, weight loss) + random glucose ≥11.1 mmol/L; OR two of: fasting glucose ≥7.0 mmol/L, 2h OGTT ≥11.1 mmol/L, HbA1c ≥6.5% on one occasion; OR each of those on two separate occasions without symptoms.\n\n30% of children with T1DM present with DKA (higher incidence in younger children). Diabetes Canada guidelines recommend an HbA1c target of <7.5% for children with T1DM (less stringent than <7% to minimize hypoglycemia). HbA1c is not recommended as the sole diagnostic test in G6PD deficiency."
    difficulty: medium
    tags: [pediatrics, diabetes, T1DM, diagnosis, Diabetes Canada]
  - front: "What are the clinical features of T1DM presentation in children, and what is the cornerstone of management?"
    back: "Clinical features: polyuria (may manifest as nocturia or secondary enuresis), polydipsia, weight loss (catabolic state), polyphagia, perineal candidiasis (younger children), visual disturbances, DKA (30% of presentations). Management cornerstone: family-centred pediatric multidisciplinary team providing education and support for survival skills, meal plans, and insulin injections.\n\nDiet should maintain consistent carbohydrate levels avoiding high glycemic index foods. Approximately 60 min of aerobic exercise daily is recommended. Children are more susceptible to hypoglycemia. Complications screening includes ophthalmology, microalbuminuria, diabetic foot exam, thyroiditis, celiac disease, mental health, HTN, and dyslipidemia."
    difficulty: medium
    tags: [pediatrics, diabetes, T1DM, clinical features, management]
  - front: "What is the Diabetes Canada HbA1c target for children with T1DM, and why is it different from adults?"
    back: "Target: <7.5% for children with T1DM (less stringent than the <7% recommended for adults and the <7% target for children with T2DM). The rationale is to minimize hypoglycemia, as children are more susceptible to hypoglycemia and its neurological consequences.\n\nSevere hypoglycemia in children can lead to seizures, coma, and permanent neurological complications. The slightly relaxed HbA1c target balances glycemic control with hypoglycemia prevention. This contrasts with T2DM in children where <7% is targeted."
    difficulty: medium
    tags: [pediatrics, diabetes, T1DM, HbA1c, Diabetes Canada, hypoglycemia]
  - front: "How is pediatric DKA managed differently from adult DKA, and what is the most feared complication?"
    back: "Pediatric-specific protocols: ABCs, 100% O2, admit, monitor, correct fluid losses with ISOTONIC fluids. Insulin: avoid bolus; delay infusion until 1 hour after fluid resuscitation; SC if mild DKA, IV if moderate/severe. Normalize glucose GRADUALLY. Monitor BG, electrolytes, fluids, neurological status. Maintain potassium in fluids; add glucose once BG reaches threshold. Most feared complication: cerebral edema (0.5–1% of DKA cases). If suspected: mannitol, restrict IV fluids, move to ICU; imaging only after stabilization.\n\n~40% of children with new-onset T1DM present with DKA. Cerebral edema is the leading cause of DKA-related mortality in children. Warning signs of neurological deterioration: headache, bradycardia, irritability, decreased LOC, incontinence, focal neurological signs."
    difficulty: hard
    tags: [pediatrics, DKA, cerebral edema, management, insulin]
  - front: "What are the warning signs of cerebral edema during DKA treatment in children?"
    back: "Headache, bradycardia, irritability, decreased level of consciousness (LOC), incontinence, and specific neurological signs. Management: give mannitol, restrict IV fluids, transfer to ICU. Do NOT obtain imaging until patient is stabilized.\n\nCerebral edema complicates 0.5–1% of pediatric DKA cases and is most common in younger children. Risk factors include aggressive fluid resuscitation. It is a life-threatening emergency. The clinical triad of headache, bradycardia, and altered LOC in a child being treated for DKA should immediately prompt treatment."
    difficulty: hard
    tags: [pediatrics, DKA, cerebral edema, emergency, complications]
  - front: "What are the risk factors for Type 2 DM in children, and what is the first-line pharmacotherapy?"
    back: "Risk factors: first- or second-degree relative with T2DM, high-risk ethnic group, obesity, impaired glucose tolerance, PCOS, in utero diabetes exposure, acanthosis nigricans, hypertension, dyslipidemia, NAFLD, atypical antipsychotic medications. Breastfeeding is protective. First-line medication: metformin (can be initiated at diagnosis if HbA1c >7%). If targets not met, add liraglutide ± basal insulin (especially if HbA1c >8.5%).\n\nT2DM in children is rare before age 10; mean age ~14 years. Rising prevalence is driven by childhood obesity. 10–20% of children with clinical T2DM diagnosis may actually have T1DM — check pancreatic autoantibodies. Initial therapy with insulin is used for severe decompensation (DKA or HbA1c >9%)."
    difficulty: medium
    tags: [pediatrics, diabetes, T2DM, risk factors, metformin]
  - front: "When should screening for T2DM be initiated in asymptomatic children?"
    back: "Screening at least every 3 years in overweight or obese asymptomatic children after puberty OR ≥10 years old if >1 risk factor is present. Preferred screening test: fasting plasma glucose. 2-hour OGTT has higher detection rate in severe obesity (BMI >99th percentile) and those with multiple risk factors.\n\nEarly detection of T2DM in youth is critical to prevent complications. HbA1c may underestimate T2DM in children with severe obesity. Pancreatic autoantibodies should be checked to exclude T1DM as 10–20% of apparent T2DM in children may be T1DM."
    difficulty: medium
    tags: [pediatrics, diabetes, T2DM, screening, obesity]
  - front: "Define short stature and list the 'ABCDEFG' differential diagnosis mnemonic."
    back: "Short stature: height <3rd percentile. ABCDEFG: A — Affected infant (IUGR/SGA), B — Bone dysplasias (rickets, collagen disorders, mucopolysaccharidoses, achondroplasia), C — Chromosomal (Turner, Down), D — Delayed growth (constitutional delay of growth and puberty, CDGP), E — Endocrine (hypopituitary, low GH, Cushing's, hypothyroidism), F — Familial (familial short stature), G — GI malabsorption (celiac, Crohn's).\n\nShort stature is defined by height <3rd percentile. Pathological causes are associated with DECREASED growth velocity (height crossing major percentile lines downward), whereas non-pathological causes (familial short stature, CDGP) have NORMAL growth velocity. Decreased growth velocity is often more clinically worrisome than absolute height."
    difficulty: medium
    tags: [pediatrics, growth, short stature, ABCDEFG, differential diagnosis]
  - front: "How is constitutional delay of growth and puberty (CDGP) differentiated from familial short stature (FSS)?"
    back: "Both have NORMAL growth velocity. CDGP is distinguished by DELAYED bone age on AP x-ray of left hand/wrist, indicating the child has more growth potential. FSS shows bone age appropriate for chronological age, with likely low mid-parental height. Mid-parental height calculation: male = (mother's + father's height + 12.5 cm)/2; female = (mother's + father's height − 12.5 cm)/2.\n\nBone age (left hand/wrist x-ray) is the key investigation to distinguish CDGP from FSS. Children with CDGP will eventually reach their genetic height potential but do so later. Risk factors for GH deficiency include prior head trauma, intracranial bleed/infection, head surgery or irradiation, breech delivery, and positive family history."
    difficulty: hard
    tags: [pediatrics, growth, short stature, CDGP, bone age]
  - front: "What is the management approach for mild versus severe hypoglycemia in a child with T1DM?"
    back: "Mild hypoglycemia: administer simple oral carbohydrate (e.g., sweetened fruit juice — '15-15 rule'). Severe hypoglycemia (seizure, coma, unable to take PO): administer IM glucagon OR IV dextrose. Symptoms of hypoglycemia: lethargy, unusual behaviour, tremor, pallor, tachycardia, diaphoresis, seizure, coma.\n\nChildren are more susceptible to hypoglycemia than adults. Severe hypoglycemia can lead to seizures, coma, and permanent neurological complications. The HbA1c target in children with T1DM is relaxed to <7.5% (vs <7% in adults) specifically to minimize hypoglycemia risk."
    difficulty: easy
    tags: [pediatrics, diabetes, hypoglycemia, T1DM, management]
  - front: "What autoimmune complications should be screened for in children with T1DM?"
    back: "Concurrent autoimmune diseases: thyroiditis (most common — screen with TSH) and celiac disease (screen with anti-tTG IgA). Also screen for: mental health issues (depression, eating disorders), hypertension, and dyslipidemia. Routine immunizations and annual influenza vaccine are recommended.\n\nT1DM is an autoimmune condition associated with other autoimmune diseases due to shared genetic susceptibility (HLA associations). The prevalence of thyroiditis in T1DM children is ~15–30% and celiac disease ~5–10%, both higher than the general population."
    difficulty: medium
    tags: [pediatrics, diabetes, T1DM, autoimmune, screening, celiac, thyroid]
  - front: "What is the most common cause of congenital hyperthyroidism (neonatal Graves' disease), and how is it managed?"
    back: "Caused by transplacental transfer of TSH receptor antibody (TRAb) from a mother with Graves' disease. Management: methimazole + beta-adrenergic blocker (e.g., propranolol). Epidemiology: ~1 in 25,000 neonates, M=F.\n\nNeonatal Graves' disease is transient as maternal antibodies clear, but prompt treatment is essential to prevent long-term CNS/cognitive complications. Key clinical features include low birthweight, IUGR, tachycardia, goitre, and hepatosplenomegaly."
    difficulty: medium
    tags: [pediatrics, congenital hyperthyroidism, neonatal Graves, TRAb, thyroid]
  - front: "What is the incidence and epidemiology of congenital hypothyroidism (CH), and why is early treatment critical?"
    back: "Incidence: 1 in 2,000–4,000 newborns; F:M = 2:1. It is one of the most common preventable causes of intellectual disability. Treatment (thyroxine) must normalize hormones within 2 weeks to avoid cognitive impairment. Excellent outcome if started within 1–2 months; permanent disability if delayed beyond 3–6 months.\n\nCongenital hypothyroidism is screened universally through newborn screening (TSH most sensitive for primary CH). Most infants are asymptomatic at birth because maternal T4 crosses the placenta, making newborn screening essential for early detection."
    difficulty: easy
    tags: [pediatrics, congenital hypothyroidism, newborn screening, intellectual disability, thyroid]
  - front: "What are the clinical features of congenital hypothyroidism in the neonatal period?"
    back: "Usually asymptomatic at birth (maternal T4 crosses placenta). Features develop over first few months: prolonged jaundice, feeding difficulty, lethargy, constipation, umbilical hernia, macroglossia, large fontanelles, puffy face, swollen eyes, hypotonia. Central CH also associated with hypoglycemia, micropenis, undescended testes, and features of diabetes insipidus.\n\nThe classic 'cretinism' features (macroglossia, umbilical hernia, hypotonia) develop gradually, reinforcing the need for universal newborn screening rather than relying on clinical detection. Central CH has additional pituitary/hypothalamic features."
    difficulty: easy
    tags: [pediatrics, congenital hypothyroidism, clinical features, neonatal, thyroid]
  - front: "What are the primary and secondary causes of congenital hypothyroidism (CH)?"
    back: "Primary CH (85%): thyroid dysgenesis (most common), inborn errors of thyroid hormone biosynthesis (15%). Secondary/central CH: pituitary or hypothalamic dysfunction. Peripheral CH: deficits in thyroid hormone transport, metabolism, or action. Transient CH causes: maternal antibody-mediated, iodine deficiency, antithyroid medications, congenital liver hemangiomas, gene mutations.\n\nPrimary CH is detected by elevated TSH on newborn screening. Secondary/central CH may have normal or low TSH with low free T4. Distinguishing the type guides further investigations (e.g., MRI and gene analysis for central CH)."
    difficulty: hard
    tags: [pediatrics, congenital hypothyroidism, etiology, thyroid dysgenesis, pituitary]
  - front: "What is the most common cause of ambiguous genitalia in a genotypically normal (46,XX) female?"
    back: "Congenital Adrenal Hyperplasia (CAH), specifically 21-hydroxylase deficiency, is the most common cause of ambiguous genitalia in 46,XX females (virilizing CAH).\n\nIn CAH, deficiency of 21-OH leads to decreased cortisol and aldosterone with compensatory ACTH elevation and androgen excess. In 46,XX females, this results in virilization/clitoromegaly and labioscrotal fusion at birth. The incidence of genital abnormalities is ~1 in 300 births; complex ambiguity ~1 in 5,000."
    difficulty: easy
    tags: [pediatrics, ambiguous genitalia, CAH, DSD, 46XX]
  - front: "What are the key physical exam findings in 46,XY vs. 46,XX disorders of sexual development (DSD)?"
    back: "46,XY DSD: small phallus, hypospadias, bilateral cryptorchidism (undescended testes). 46,XX DSD: clitoromegaly, labioscrotal fusion. Both: look for concurrent midline defects, dysmorphic features, and congenital abnormalities.\n\nThe physical examination must be systematic to avoid premature sex assignment. Management should avoid announcing probable sex until all investigations (karyotype, FISH for SRY gene, hormones, electrolytes, imaging) are complete. Psychosocial support is essential."
    difficulty: easy
    tags: [pediatrics, DSD, ambiguous genitalia, physical exam, cryptorchidism]
  - front: "What enzyme deficiency accounts for ~95% of Congenital Adrenal Hyperplasia (CAH) cases, and what are its biochemical consequences?"
    back: "21-hydroxylase (21-OH) deficiency accounts for ~95% of CAH. Results in: decreased cortisol AND aldosterone production, with compensatory ACTH elevation causing adrenal hyperplasia and shunting toward excess androgen production.\n\nRarer causes include deficiencies in 11-OH, cholesterol desmolase, 17-OH, and 3-HSD. The cortisol deficiency drives ACTH excess, which perpetuates adrenal hyperplasia and androgen overproduction—the core pathophysiology of classic CAH."
    difficulty: medium
    tags: [pediatrics, CAH, 21-hydroxylase, adrenal, cortisol]
  - front: "What are the three clinical presentations of 21-OH deficiency CAH and their key features?"
    back: "1. Classic with salt-wasting (majority): inadequate aldosterone → FTT, hyperkalemia, hyponatremia, hypoglycemia, acidosis. 2. Classic without salt-wasting (simple virilization): adequate aldosterone; females have genital ambiguity, males present later with virilization. 3. Non-classic: mild androgen excess, sometimes asymptomatic, precocious puberty/virilization later; may mimic PCOS.\n\nDiagnostic test: elevated serum 17-OH progesterone. Salt-wasting crisis can be life-threatening. Non-classic CAH is rarely detected by newborn screening. Management: glucocorticoids (hydrocortisone) + mineralocorticoids (fludrocortisone); extra glucocorticoids during stress."
    difficulty: medium
    tags: [pediatrics, CAH, 21-OH deficiency, salt-wasting, virilization]
  - front: "What is the diagnostic test for 21-OH deficiency CAH, and what other investigations should be ordered?"
    back: "High serum 17-OH progesterone in a random blood sample is diagnostic. Additional investigations: plasma ACTH, serum electrolytes (Na+, K+), plasma glucose, plasma aldosterone, plasma renin activity, blood gas, and ultrasound (enlarged adrenal gland, presence of uterus).\n\n21-OH deficiency screening is part of many newborn screening programs across North America. The non-classical variant is rarely detected by screening. Elevated 17-OH progesterone reflects the enzymatic block upstream of the deficient 21-hydroxylase."
    difficulty: medium
    tags: [pediatrics, CAH, 17-OH progesterone, investigations, newborn screening]
  - front: "What did the TODAY trial demonstrate about glycemic management in youth with type 2 diabetes?"
    back: "TODAY trial (NEJM 2012): RCT of 699 patients aged 10-17 yr with recent-onset T2DM. Assigned to: (1) metformin alone (51.7% failure rate), (2) metformin + rosiglitazone (38.6% failure rate), or (3) metformin + lifestyle modification focused on weight loss (46.6% failure rate). Loss of glycemic control = HbA1c >8% for ≥6 months. Conclusion: Metformin + rosiglitazone was significantly better than metformin alone; metformin + lifestyle intervention did NOT significantly improve control vs. metformin alone.\n\nThe TODAY trial highlighted the aggressive nature of T2DM in youth — high failure rates even with combination therapy. Youth with T2DM have more rapid beta-cell decline than adults. Rosiglitazone (a thiazolidinedione) combined with metformin showed the best glycemic control, though rosiglitazone has largely been replaced by newer agents due to cardiovascular concerns. The ELLIPSE trial showed liraglutide (GLP-1 agonist) + metformin is more effective than metformin alone in this population."
    difficulty: hard
    tags: [pediatrics, endocrinology, type-2-diabetes, metformin, TODAY-trial, youth, glycemic-control]
