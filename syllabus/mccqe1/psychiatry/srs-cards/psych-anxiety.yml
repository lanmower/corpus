# Anxiety & PTSD (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "A 30-year-old has excessive worry about multiple life domains (work, family, health) that she cannot control, occurring more days than not for 8 months, with muscle tension, fatigue, and sleep difficulty. Diagnosis and first-line treatment?"
    back: "Generalized Anxiety Disorder (GAD); first-line: SSRI (escitalopram, sertraline) or SNRI (venlafaxine, duloxetine) + CBT (cognitive restructuring, worry management)\n\nCANMAT Anxiety Guidelines: CBT is the most effective psychotherapy for GAD. SSRIs/SNRIs take 4-8 weeks to work. Buspirone is an alternative non-benzodiazepine anxiolytic. Benzodiazepines: short-term only, risk of dependence. Pregabalin has evidence for GAD."
    difficulty: medium
    tags: [GAD, generalized anxiety disorder, SSRI, CBT, CANMAT, psychiatry]
  - front: "What are the DSM-5 criteria for panic disorder?"
    back: "Recurrent unexpected panic attacks (≥1 month of concern about future attacks OR behavioral change), at least 1 attack in past month; panic attack: abrupt surge of intense fear peaking within minutes with ≥4 symptoms (palpitations, dyspnea, chest pain, dizziness, paresthesias, depersonalization, fear of dying/going crazy)\n\nCANMAT guidelines: panic disorder responds well to CBT (interoceptive exposure) and SSRIs. Breathing retraining and relaxation are adjuncts. Agoraphobia frequently complicates panic disorder. Benzodiazepines provide rapid relief but do not address underlying pathology and risk dependence."
    difficulty: medium
    tags: [panic disorder, panic attack, DSM-5, CBT, psychiatry]
  - front: "What is the CANMAT recommended pharmacotherapy for panic disorder?"
    back: "First-line: SSRIs (paroxetine, sertraline, escitalopram, citalopram) or SNRIs (venlafaxine); second-line: TCAs (imipramine, clomipramine); adjunct: benzodiazepines (short-term only) — avoid abrupt discontinuation\n\nCANMAT panic disorder guidelines: start SSRI at low dose to avoid initial anxiogenic effect (jitteriness — worsen symptoms in first 1-2 weeks). Titrate slowly. Minimum 12 months of pharmacotherapy after remission. Propranolol is NOT effective for panic disorder (only for performance anxiety)."
    difficulty: easy
    tags: [panic disorder treatment, SSRI, paroxetine, CANMAT, psychiatry]
  - front: "A 25-year-old refuses to leave home alone, won't drive, and avoids shopping malls due to fear of having a panic attack in a place she can't escape. Diagnosis?"
    back: "Agoraphobia; treat with exposure therapy (graduated real-life exposure is the most effective psychotherapy), SSRIs, or combined approach\n\nAgoraphobia: fear of ≥2 situations (public transport, open spaces, enclosed spaces, crowds, outside alone) due to fear of escape being difficult or help unavailable if panic occurs. Comorbid with panic disorder in 50%. 40% of agoraphobia occurs without panic disorder."
    difficulty: medium
    tags: [agoraphobia, exposure therapy, panic disorder, CBT, psychiatry]
  - front: "What is social anxiety disorder (social phobia) and how is it treated?"
    back: "Marked fear of social situations where one may be scrutinized; first-line: CBT (exposure + cognitive restructuring) or SSRI/SNRI; performance-only subtype: propranolol or benzodiazepine PRN\n\nCANMAT: paroxetine, sertraline, and venlafaxine have strongest evidence for SAD. CBT with exposures is highly effective. For performance anxiety: propranolol 10-40 mg PRN (30-60 min before performance). CBT + pharmacotherapy superior to either alone for severe SAD."
    difficulty: medium
    tags: [social anxiety disorder, social phobia, CBT, SSRI, propranolol, psychiatry]
  - front: "What are the criteria for specific phobia and what is the most effective treatment?"
    back: "Specific phobia: marked fear of specific object/situation (animals, blood-injection-injury, natural environment, situational) causing avoidance, >6 months, disproportionate to actual danger; treatment: exposure therapy (in vivo exposure)\n\nCANMAT: exposure therapy is the gold standard for specific phobia (85% response rate). Imaginal exposure for phobias where in vivo is impractical. Blood-injection-injury phobia: applied tension technique (prevents vasovagal syncope). Medications generally not effective for specific phobia."
    difficulty: easy
    tags: [specific phobia, exposure therapy, DSM-5, behavior therapy, psychiatry]
  - front: "What is PTSD and what are the DSM-5 criteria?"
    back: "PTSD: exposure to trauma (death/threatened death, actual/threatened serious injury, sexual violence) → 4 symptom clusters: Intrusion (flashbacks, nightmares), Avoidance, Negative cognitions/mood, Hyperarousal — lasting >1 month\n\nCANMAT PTSD Guidelines: 70% of Canadians will experience a traumatic event; PTSD develops in ~20%. Risk factors: severity of trauma, peritraumatic dissociation, prior trauma, lack of social support. First-line treatments: prolonged exposure therapy, EMDR, CPT (cognitive processing therapy), SSRIs/SNRIs."
    difficulty: medium
    tags: [PTSD, post-traumatic stress disorder, DSM-5 criteria, trauma, psychiatry]
  - front: "What pharmacotherapy is recommended for PTSD?"
    back: "SSRIs (sertraline, paroxetine — FDA-approved) and SNRIs (venlafaxine) are first-line; prazosin for PTSD nightmares; benzodiazepines are NOT recommended (no evidence, may worsen PTSD outcomes)\n\nCANMAT PTSD guidelines: psychotherapy (PE, CPT, EMDR) is preferred over pharmacotherapy alone. Prazosin (alpha-1 blocker) reduces PTSD-associated nightmares and sleep disturbance. Benzodiazepines increase avoidance, impair fear extinction, and may worsen long-term outcomes."
    difficulty: medium
    tags: [PTSD treatment, SSRI, prazosin, benzodiazepine contraindication, psychiatry]
  - front: "What is complex PTSD and how does it differ from PTSD?"
    back: "Complex PTSD (ICD-11 but not DSM-5): PTSD symptoms + disturbances in self-organization: affect dysregulation, negative self-concept, interpersonal difficulties — results from prolonged, repeated trauma (childhood abuse, domestic violence, torture)\n\nICD-11 (used in Canada) includes complex PTSD as a separate diagnosis. CANMAT guidelines recognize that treatment is more challenging and requires longer duration. Stabilization phase before trauma processing is crucial. DBT and schema therapy useful for affect dysregulation."
    difficulty: hard
    tags: [complex PTSD, ICD-11, trauma, affect dysregulation, psychiatry]
  - front: "A 19-year-old has intrusive contamination obsessions and compulsive hand-washing for 3 hours daily causing significant distress. Diagnosis and first-line treatment?"
    back: "OCD (Obsessive-Compulsive Disorder); first-line: CBT with exposure and response prevention (ERP) AND/OR SSRI (fluvoxamine, fluoxetine, sertraline, paroxetine, clomipramine)\n\nCANMAT OCD guidelines: ERP (exposure to feared stimuli + preventing compulsive response) is the most effective psychotherapy for OCD. SSRIs at higher doses than depression (e.g., fluoxetine up to 80 mg). Clomipramine (TCA) most effective SSRI but poorest tolerability. Augmentation with atypical antipsychotics for partial response."
    difficulty: hard
    tags: [OCD, obsessive-compulsive disorder, ERP, SSRI, CBT, psychiatry]
  - front: "What is the difference between OCD and OCD-related disorders?"
    back: "OCD-related: Body dysmorphic disorder (preoccupation with perceived defect), hoarding disorder (inability to discard possessions), trichotillomania (hair pulling), excoriation (skin picking), illness anxiety disorder — all involve repetitive behaviors/thoughts\n\nCANMAT/DSM-5: OCD spectrum disorders respond to SSRIs and habit-reversal training (trichotillomania, excoriation). BDD has overlap with social anxiety — treats with SSRI + CBT. Hoarding disorder: SSRI + specialized hoarding-specific CBT; traditional CBT less effective."
    difficulty: medium
    tags: [OCD spectrum, body dysmorphic disorder, hoarding disorder, trichotillomania, psychiatry]
  - front: "What is the difference between adjustment disorder and acute stress reaction?"
    back: "Acute stress reaction: immediate brief emotional/behavioral response within 3 days of trauma, resolving within 1 month; Adjustment disorder: emotional/behavioral symptoms within 3 months of identifiable stressor, disproportionate, lasting up to 6 months (12 months for chronic stressors)\n\nAdjustment disorder: impairment must exceed expected reaction given the stressor. Does not meet criteria for other mental disorders. Treatment: supportive psychotherapy, brief CBT. Consider if full PTSD, MDD, or anxiety disorder diagnosis is more appropriate."
    difficulty: easy
    tags: [adjustment disorder, acute stress reaction, DSM-5, stressor, psychiatry]
  - front: "What is health anxiety (illness anxiety disorder) and how is it managed?"
    back: "Illness anxiety: preoccupation with having or acquiring a serious illness despite no/minimal medical symptoms; reassurance-seeking reinforces anxiety; treat with CBT (exposure + cognitive restructuring, stop reassurance-seeking) ± SSRI\n\nFormerly somatic symptom disorder with poor illness anxiety (DSM-IV hypochondriasis). CBT targeting reassurance-seeking behaviors is most effective. Physicians should avoid extensive unnecessary testing. Regular brief scheduled appointments instead of symptom-driven visits reduce healthcare utilization."
    difficulty: medium
    tags: [illness anxiety disorder, health anxiety, CBT, reassurance-seeking, psychiatry]
  - front: "What is separation anxiety disorder in adults and how does it present?"
    back: "Separation anxiety disorder (SAD): excessive fear of separation from attachment figures (usually parents or partner); may persist from childhood or develop in adulthood; avoid separation situations, somatic complaints on separation\n\nDSM-5 removed the \"childhood onset\" criterion — SAD can be diagnosed in adults. CANMAT: more common in women. Treat with CBT (exposure to separation) and SSRIs. Distinguish from agoraphobia (fear of panic situations, not specifically separation) and dependent personality disorder."
    difficulty: medium
    tags: [separation anxiety disorder, adult SAD, CBT, SSRI, psychiatry]
  - front: "What is the response to benzodiazepines in anxiety treatment and what are the risks?"
    back: "Rapid symptom relief (30-60 min) via GABA-A receptor enhancement; risks: tolerance, physical dependence (withdrawal seizures if abrupt discontinuation), cognitive impairment, falls in elderly, sedation, rebound anxiety\n\nCANMAT guidelines: benzodiazepines are not recommended as long-term anxiolytic monotherapy. Short-term use (2-4 weeks) acceptable for acute anxiety. Taper gradually when discontinuing (10% dose reduction per week). Diazepam or clonazepam preferred for tapering due to longer half-life."
    difficulty: medium
    tags: [benzodiazepines, anxiety treatment, dependence, withdrawal, CANMAT, psychiatry]
  - front: "What defines PTSD per DSM-5?"
    back: "Exposure to traumatic event + intrusion symptoms + avoidance + negative cognitions/mood + hyperarousal. Duration >1 month. Causes significant distress/impairment\n\n<1 month = acute stress disorder. Treatment: trauma-focused CBT (first-line), EMDR. Pharmacotherapy: SSRIs (sertraline, paroxetine). Prazosin for nightmares."
    difficulty: medium
    tags: [PTSD, DSM-5]
  - front: "What are the DSM-5 criteria for generalized anxiety disorder?"
    back: "Excessive anxiety and worry occurring more days than not for >=6 months about multiple events/activities. Difficulty controlling worry. >=3 of 6 symptoms: restlessness, fatigue, difficulty concentrating, irritability, muscle tension, sleep disturbance. Causes significant distress or functional impairment.\n\nGAD is the most common anxiety disorder in primary care. CANMAT guidelines recommend both CBT and pharmacotherapy as first-line treatments. Differentiate from adjustment disorder (identifiable stressor, <6 months) and normal worry (no impairment)."
    difficulty: medium
    tags: [GAD, generalized anxiety disorder, DSM-5, psychiatry]
  - front: "What is the first-line pharmacotherapy for anxiety disorders per CANMAT?"
    back: "GAD: escitalopram, sertraline, venlafaxine, duloxetine, pregabalin. Panic disorder: escitalopram, sertraline, venlafaxine. Social anxiety disorder: escitalopram, sertraline, venlafaxine, fluvoxamine, paroxetine. OCD: fluoxetine, fluvoxamine, sertraline, paroxetine (higher doses needed). PTSD: sertraline, paroxetine, venlafaxine.\n\nCANMAT recommends SSRIs/SNRIs as first-line for all anxiety disorders. Start at half the antidepressant dose (anxiety patients are sensitive to activation effects). Benzodiazepines are second-line and time-limited. OCD requires higher SSRI doses (e.g., fluoxetine 40-80mg) than depression."
    difficulty: hard
    tags: [anxiety treatment, SSRI, CANMAT, pharmacotherapy, psychiatry]
  - front: "What are the DSM-5 criteria for panic disorder and its management?"
    back: "Recurrent unexpected panic attacks (abrupt surge of intense fear peaking within minutes with >=4 of 13 symptoms: palpitations, sweating, trembling, SOB, choking, chest pain, nausea, dizziness, chills/heat, paresthesias, derealization, fear of losing control, fear of dying). >=1 month of persistent concern about additional attacks OR maladaptive behavioral change.\n\nCBT with interoceptive exposure is the most effective psychotherapy for panic disorder. CANMAT recommends SSRI/SNRI + CBT as optimal combination. Benzodiazepines for acute attacks but avoid long-term use. Rule out cardiac, pulmonary, and endocrine causes before diagnosing."
    difficulty: medium
    tags: [panic disorder, DSM-5, panic attacks, psychiatry]
  - front: "What is the approach to obsessive-compulsive disorder (OCD)?"
    back: "DSM-5: obsessions (recurrent intrusive thoughts causing anxiety) AND/OR compulsions (repetitive behaviors/mental acts in response to obsessions). Time-consuming (>1h/day) or causing distress/impairment. Treatment: first-line is exposure and response prevention (ERP)-specific CBT for OCD. Pharmacotherapy: SSRI at high dose (e.g., fluoxetine 40-80mg, sertraline 200mg). Augment with low-dose antipsychotic if partial SSRI response.\n\nOCD has a distinct neurobiology (cortico-striato-thalamo-cortical circuit) and treatment approach from other anxiety disorders. CANMAT emphasizes ERP as the most effective treatment. Treatment-resistant OCD may respond to IV clomipramine, deep brain stimulation (experimental), or neurosurgery (extremely rare)."
    difficulty: hard
    tags: [OCD, obsessive-compulsive, ERP, treatment, psychiatry]
  - front: "What is the diagnosis and management of PTSD?"
    back: "DSM-5 criteria: exposure to traumatic event + symptoms in 4 clusters lasting >1 month: (1) intrusion (flashbacks, nightmares, distress with reminders), (2) avoidance (of memories, triggers), (3) negative cognitions/mood (guilt, detachment, anhedonia), (4) hyperarousal (hypervigilance, startle, irritability, sleep disturbance, reckless behavior). Treatment: trauma-focused CBT (cognitive processing therapy, prolonged exposure) first-line. Pharmacotherapy: SSRI (sertraline, paroxetine) or venlafaxine.\n\nCANMAT PTSD guidelines recommend trauma-focused psychotherapy as first-line over pharmacotherapy. Prazosin (alpha-1 blocker) can be used for PTSD-related nightmares. Benzodiazepines are NOT recommended for PTSD (may impair extinction of fear memory). Screen for comorbid substance use and depression."
    difficulty: hard
    tags: [PTSD, trauma, CBT, treatment, psychiatry]
  - front: "What is social anxiety disorder and how is it differentiated from normal shyness?"
    back: "DSM-5: marked fear/anxiety about social situations where scrutinized (speaking, eating, performing), fear of showing anxiety symptoms and being judged, social situations almost always provoke anxiety, avoided or endured with intense anxiety, out of proportion, >=6 months, functional impairment. Differentiate: shyness does not cause significant impairment or avoidance.\n\nSocial anxiety disorder (social phobia) is one of the most common anxiety disorders. CANMAT recommends CBT (including group CBT) and/or SSRI/SNRI as first-line. Performance-only subtype may respond to PRN propranolol or benzodiazepine. Comorbid alcohol use disorder is common (self-medication)."
    difficulty: medium
    tags: [social anxiety disorder, social phobia, DSM-5, psychiatry]
  - front: "What is the role and limitations of benzodiazepines in anxiety treatment?"
    back: "Role: rapid symptom relief for acute anxiety, panic attacks, agitation. Short-term use (<2-4 weeks) during SSRI initiation. Limitations: tolerance, physical dependence (withdrawal: seizures, delirium), cognitive impairment (especially elderly), falls, paradoxical disinhibition, respiratory depression (especially with opioids), impair psychotherapy outcomes. Long-acting (clonazepam, diazepam) preferred over short-acting (alprazolam, lorazepam).\n\nCANMAT recommends benzodiazepines as second-line and time-limited for anxiety disorders. Canadian guidelines emphasize deprescribing benzodiazepines in elderly (Beers criteria). Taper gradually (10-25% reduction every 1-2 weeks) to prevent withdrawal seizures. CTFPHC identifies benzodiazepines as a potentially inappropriate medication in elderly."
    difficulty: hard
    tags: [benzodiazepines, limitations, anxiety, deprescribing, psychiatry]
  - front: "What are specific phobias and their treatment?"
    back: "DSM-5: marked fear/anxiety about a specific object or situation (animals, natural environment, blood-injection-injury, situational, other), almost always provokes immediate anxiety, avoided or endured with intense anxiety, out of proportion, >=6 months. Treatment: exposure therapy (systematic desensitization, graded exposure) is the ONLY effective treatment. Pharmacotherapy is NOT first-line.\n\nSpecific phobias are the most common anxiety disorder. Blood-injection-injury phobia is unique: causes vasovagal response (bradycardia, hypotension, fainting) rather than tachycardia. Applied tension technique (tensing muscles during exposure) is the specific treatment for BII phobia. CBT exposure therapy has >90% success rate."
    difficulty: easy
    tags: [specific phobia, exposure therapy, CBT, psychiatry]
  - front: "What is illness anxiety disorder (hypochondriasis) and somatic symptom disorder?"
    back: "Illness anxiety disorder (DSM-5): preoccupation with having/acquiring a serious illness, somatic symptoms absent or mild, high anxiety about health, excessive health-related behaviors (checking, reassurance-seeking) or maladaptive avoidance. Somatic symptom disorder: >=1 distressing somatic symptom + disproportionate thoughts, feelings, or behaviors related to symptoms. Treatment: scheduled regular visits, CBT, SSRI, avoid unnecessary investigations.\n\nThese disorders are common in primary care. Key management principle: validate suffering without reinforcing sick role. Scheduled visits (not contingent on symptoms) reduce ED utilization. CANMAT recommends CBT as most effective treatment. Canadian guidelines emphasize avoiding iatrogenic harm from unnecessary investigations."
    difficulty: medium
    tags: [illness anxiety disorder, somatic symptom disorder, management, psychiatry]
  - front: "What is the approach to acute agitation in the ED?"
    back: "De-escalation first: quiet environment, verbal techniques, offer PRN oral medication. Oral: lorazepam 1-2mg OR olanzapine 5-10mg (dissolving tablet). If oral refused: IM olanzapine 10mg (do NOT combine with IM benzodiazepine-respiratory depression risk), OR IM haloperidol 5mg + lorazepam 2mg + diphenhydramine 50mg (B52 cocktail). Monitor vitals, consider medical causes (hypoglycemia, delirium, intoxication).\n\nCanadian ER psychiatric guidelines emphasize verbal de-escalation and voluntary oral medication before chemical restraint. Physical restraint requires continuous monitoring and documentation. Rule out medical causes-20% of psychiatric presentations in ED have an underlying medical etiology."
    difficulty: hard
    tags: [acute agitation, chemical restraint, ED management, psychiatry]
  - front: "What is the approach to body dysmorphic disorder (BDD)?"
    back: "DSM-5: preoccupation with perceived defects in physical appearance not observable by others, repetitive behaviors (mirror checking, excessive grooming, reassurance-seeking, comparing). Related to OCD spectrum. Treatment: CBT (ERP-type, targeting avoidance and checking behaviors) + SSRI at high doses (same as OCD). Do NOT refer for cosmetic procedures (high dissatisfaction rate).\n\nBDD is often underdiagnosed due to patient shame. Prevalence ~2%. Canadian guidelines recognize BDD as an OCD-spectrum disorder. Insight ranges from good to delusional (absent insight treated with SSRI augmented by antipsychotic, not antipsychotic alone). Suicide risk is elevated (25% attempt)."
    difficulty: medium
    tags: [body dysmorphic disorder, BDD, OCD spectrum, psychiatry]
  - front: "What is separation anxiety disorder in adults and children?"
    back: "DSM-5: developmentally inappropriate, excessive anxiety about separation from attachment figures, >=3 of 8 symptoms (distress when separated, worry about losing attachment figure, reluctance to go out/be alone, nightmares about separation, somatic symptoms). Duration: >=4 weeks in children, >=6 months in adults. Peak onset: childhood, but can present in adults.\n\nSeparation anxiety disorder was previously only a childhood diagnosis-DSM-5 extended it to adults. Treatment: CBT focusing on graduated exposure to separation. In children, parental involvement in therapy is essential. SSRI for moderate-severe cases. Canadian child psychiatry guidelines emphasize school refusal as a common presentation."
    difficulty: medium
    tags: [separation anxiety, childhood, adult, DSM-5, psychiatry]
  - front: "What are the features and management of adjustment disorder?"
    back: "DSM-5: emotional/behavioral symptoms within 3 months of identifiable stressor, out of proportion to severity of stressor, significant impairment. Does NOT meet criteria for another mental disorder. Subtypes: with depressed mood, with anxiety, with mixed, with disturbance of conduct, unspecified. Resolves within 6 months of stressor ending. Treatment: supportive therapy, brief psychotherapy, short-term pharmacotherapy if needed.\n\nAdjustment disorder is the most common psychiatric diagnosis in consultation-liaison psychiatry. Distinguished from normal stress reactions by functional impairment and from MDD/GAD by duration and precipitant. Self-limited by definition. If symptoms persist >6 months after stressor resolves, reconsider diagnosis."
    difficulty: easy
    tags: [adjustment disorder, stressor, differential, psychiatry]
  - front: "What is the first-line pharmacotherapy for generalized anxiety disorder?"
    back: "SSRIs (escitalopram, sertraline) or SNRIs (venlafaxine, duloxetine). Start low, titrate over 4-6 weeks. Buspirone as alternative. Benzodiazepines for short-term only (max 2-4 weeks)\n\nCANMAT guidelines. Full response takes 8-12 weeks. CBT equally effective and preferred as first-line (or combined). Pregabalin is second-line. Avoid benzodiazepines long-term (dependence, falls in elderly, cognitive impairment)."
    difficulty: medium
    tags: [GAD, pharmacotherapy, CANMAT]
  - front: "What are the key differences between panic disorder, social anxiety, and GAD?"
    back: "Panic: recurrent unexpected panic attacks with fear of future attacks. Social anxiety: intense fear of social/performance situations. GAD: excessive worry about multiple life areas for >=6 months, muscle tension, restlessness\n\nPanic: spontaneous attacks with somatic symptoms (palpitations, dyspnea, chest pain). Agoraphobia often comorbid. Social anxiety: avoidance of public speaking, eating in public. All respond to SSRIs + CBT."
    difficulty: medium
    tags: [anxiety, differential, panic]
  - front: "What is borderline personality disorder and how is it managed?"
    back: "DSM-5: >=5 of 9: abandonment fears, unstable relationships, identity disturbance, impulsivity, self-harm, affective instability, emptiness, anger, transient paranoia/dissociation. Treatment: DBT (dialectical behavior therapy)\n\nSplitting: idealization/devaluation of healthcare providers. Management: consistent boundaries, DBT skills (mindfulness, distress tolerance, emotion regulation, interpersonal effectiveness). Pharmacotherapy targets symptoms not disorder."
    difficulty: hard
    tags: [BPD, DBT, personality disorder]
  - front: "Describe the three clusters of personality disorders with their defining features and key examples."
    back: "Cluster A (odd/eccentric): Paranoid PD (pervasive distrust), Schizoid PD (detachment from social relationships, restricted affect), Schizotypal PD (cognitive/perceptual distortions, eccentric behavior, magical thinking). Cluster B (dramatic/emotional/erratic): Borderline, Narcissistic, Histrionic, Antisocial PD. Cluster C (anxious/fearful): Avoidant PD (social inhibition, feelings of inadequacy), Dependent PD (excessive need to be taken care of), Obsessive-Compulsive PD (preoccupation with orderliness, perfectionism, control).\n\nMnemonic: Cluster A is 'mad' (psychotic-spectrum), Cluster B is 'bad' (impulsive/dramatic), Cluster C is 'sad' (anxious). Schizotypal PD has genetic links to schizophrenia. OCPD is distinct from OCD — OCPD is ego-syntonic (the person sees their rigidity as a virtue)."
    difficulty: easy
    tags: [personality disorders, clusters, DSM-5, psychiatry]
  - front: "What are the DSM-5 criteria for borderline personality disorder (BPD) and its core features?"
    back: "5 or more of 9 criteria: 1) Frantic efforts to avoid real/imagined abandonment; 2) Pattern of unstable, intense relationships (idealization/devaluation); 3) Identity disturbance (unstable self-image); 4) Impulsivity in 2+ areas (spending, sex, substances, reckless driving, binge eating); 5) Recurrent suicidal behavior/self-harm; 6) Affective instability; 7) Chronic feelings of emptiness; 8) Inappropriate intense anger; 9) Transient stress-related paranoid ideation or dissociation.\n\nBPD affects ~1-2% of the population and is associated with high healthcare utilization. 'Splitting' (seeing people as all good or all bad) is the characteristic defense mechanism. CPA guidelines emphasize that BPD is a treatable condition with good prognosis — 50% no longer meet criteria after 10 years."
    difficulty: medium
    tags: [borderline personality disorder, DSM-5, identity disturbance, self-harm, psychiatry]
  - front: "What is dialectical behavior therapy (DBT) and what are its four modules?"
    back: "DBT is the gold-standard evidence-based treatment for borderline personality disorder developed by Marsha Linehan. Four modules: 1) Mindfulness (core skill — present-moment awareness); 2) Distress tolerance (crisis survival skills without making things worse); 3) Emotion regulation (understanding and managing intense emotions); 4) Interpersonal effectiveness (assertiveness, maintaining relationships while respecting self). Standard DBT includes: individual therapy, skills group, phone coaching, and consultation team.\n\nDBT has the strongest evidence for reducing self-harm and suicidal behavior in BPD. It balances acceptance (validation) with change (behavioral strategies). In Canada, DBT programs are available through many provincial mental health systems, though waitlists can be lengthy. Other evidence-based therapies for BPD include mentalization-based therapy (MBT) and transference-focused psychotherapy."
    difficulty: medium
    tags: [DBT, borderline personality disorder, psychotherapy, psychiatry]
  - front: "How should 'splitting' in a patient with BPD be managed in a healthcare setting?"
    back: "Splitting: defense mechanism where patient views staff as 'all good' or 'all bad,' causing team conflict. Management: 1) Consistent treatment team with clear communication; 2) Regular team meetings to ensure consistent messaging; 3) Clear treatment plan documented and shared with all staff; 4) Firm but empathic boundary-setting; 5) Validate the patient's emotions while maintaining limits; 6) Avoid 'special' treatment or punitive responses; 7) Single point of contact for decisions when possible.\n\nSplitting can lead to staff burnout and inconsistent care if not recognized. The key principle is a unified, compassionate, and consistent approach. Canadian hospital policies increasingly include BPD care pathways that emphasize team consistency and trauma-informed care rather than labeling patients as 'difficult.'"
    difficulty: medium
    tags: [splitting, borderline personality disorder, healthcare management, team communication, psychiatry]
  - front: "What defines antisocial personality disorder (ASPD) and what is its relationship to conduct disorder?"
    back: "ASPD DSM-5: Age ≥18; pervasive pattern of disregard for/violation of rights of others since age 15 with 3+: failure to conform to laws, deceitfulness, impulsivity, irritability/aggressiveness, reckless disregard for safety of self/others, consistent irresponsibility, lack of remorse. REQUIRES evidence of conduct disorder before age 15. Conduct disorder: repetitive pattern of behavior violating others' rights or age-appropriate norms (aggression, destruction, deceitfulness, rule violations).\n\nNot all children with conduct disorder develop ASPD (~40% do). ASPD has strong comorbidity with substance use disorders. There are no effective pharmacotherapies for ASPD itself — treatment targets comorbidities. Forensic psychiatry in Canada frequently deals with ASPD in criminal justice assessments (NCR and fitness evaluations under the Criminal Code)."
    difficulty: medium
    tags: [antisocial personality disorder, conduct disorder, forensic psychiatry, psychiatry]
  - front: "Compare avoidant personality disorder with social anxiety disorder. How do they differ?"
    back: "Avoidant PD: pervasive pattern of social inhibition, feelings of inadequacy, hypersensitivity to negative evaluation; avoids occupational activities requiring interpersonal contact; reluctant to engage unless certain of being liked; views self as socially inept and inferior. Social anxiety disorder (SAD): fear/anxiety of social situations where scrutiny is possible — but the person's core identity and self-concept are intact. Key difference: Avoidant PD is more pervasive, affects all domains of functioning, has deeper identity-level feelings of inferiority, while SAD is more circumscribed to specific social performance situations.\n\nThese conditions frequently co-occur (~50% overlap). Avoidant PD responds to similar treatments as SAD (CBT, SSRIs), but psychotherapy is typically longer and more focused on core schema change. CPA guidelines note the distinction is clinically relevant for treatment planning and prognosis."
    difficulty: medium
    tags: [avoidant personality disorder, social anxiety, differential diagnosis, psychiatry]
  - front: "What are the key features of narcissistic personality disorder?"
    back: "DSM-5 (5+ of 9): Grandiose sense of self-importance; preoccupied with fantasies of unlimited success/power/beauty; believes they are 'special' and should associate with high-status people; requires excessive admiration; sense of entitlement; interpersonally exploitative; lacks empathy; often envious or believes others are envious of them; arrogant/haughty behaviors. Underlying: fragile self-esteem vulnerable to 'narcissistic injury' (perceived slight) → rage or depression.\n\nNarcissistic PD is more common in males. 'Narcissistic injury' (criticism or failure) can precipitate depression, substance abuse, or suicidal behavior. Treatment is challenging as patients rarely present voluntarily — typically present during crisis or at partner's insistence. Schema therapy and transference-focused psychotherapy have some evidence."
    difficulty: medium
    tags: [narcissistic personality disorder, DSM-5, personality disorders, psychiatry]
  - front: "What distinguishes schizotypal personality disorder from schizoid personality disorder and schizophrenia?"
    back: "Schizoid PD: social detachment, restricted affect, DOES NOT have perceptual distortions or magical thinking — simply prefers solitude, appears cold/indifferent. Schizotypal PD: odd beliefs/magical thinking (telepathy, sixth sense), unusual perceptual experiences (illusions, bodily sensations), odd speech (vague, metaphorical), suspiciousness, eccentric behavior — has attenuated psychotic features but maintains reality testing. Schizophrenia: frank psychosis (delusions, hallucinations, disorganized thought) with functional decline.\n\nSchizotypal PD is genetically related to schizophrenia (higher prevalence in first-degree relatives of schizophrenia patients) and is considered part of the schizophrenia spectrum. ~10% of schizotypal PD patients eventually develop schizophrenia. Low-dose antipsychotics may help with perceptual symptoms in schizotypal PD."
    difficulty: hard
    tags: [schizotypal, schizoid, personality disorders, schizophrenia spectrum, psychiatry]
  - front: "How does obsessive-compulsive personality disorder (OCPD) differ from obsessive-compulsive disorder (OCD)?"
    back: "OCPD: ego-SYNTONIC (patient sees their rigidity, perfectionism, and need for control as virtues); pervasive pattern of preoccupation with orderliness, perfectionism, and mental/interpersonal control at the expense of flexibility and efficiency; hoarding, excessive devotion to work, miserliness, rigidity. OCD: ego-DYSTONIC (patient recognizes obsessions as intrusive and unwanted); obsessions (recurrent intrusive thoughts) + compulsions (ritualistic behaviors to reduce anxiety); causes significant distress. OCPD is a personality pattern; OCD is an anxiety-spectrum disorder.\n\nOCPD is the most common personality disorder (~3-8% prevalence). Only ~25% of patients with OCPD also have OCD. OCPD patients often present at the insistence of frustrated family/colleagues. Treatment: psychotherapy (CBT focusing on cognitive flexibility). OCPD is associated with better work functioning but worse interpersonal relationships."
    difficulty: medium
    tags: [OCPD, OCD, personality disorders, differential diagnosis, psychiatry]
  - front: "A patient with BPD presents to the ED after superficial self-harm. She is angry at staff and threatening to leave. What is the approach to crisis management?"
    back: "1) Ensure safety (remove means of further self-harm); 2) Use calm, validating, non-judgmental approach ('I can see you're in a lot of pain right now'); 3) Assess suicide risk thoroughly (self-harm ≠ suicide attempt, but BPD patients DO die by suicide — 8-10% lifetime); 4) Treat medical injuries; 5) Explore precipitant (often interpersonal crisis/perceived abandonment); 6) Develop safety plan collaboratively; 7) Brief intervention — do NOT admit unless genuinely suicidal (prolonged admissions can worsen BPD through regression); 8) Arrange outpatient follow-up within 24-72h; 9) Document clearly and communicate with outpatient team.\n\nShort, structured ED visits with validation and safety planning are preferred over admission for chronic self-harm in BPD. However, always take suicidal ideation seriously — BPD has significant completed suicide rates. Canadian ED mental health guidelines emphasize trauma-informed care and avoiding pejorative language ('attention-seeking')."
    difficulty: hard
    tags: [borderline personality disorder, self-harm, crisis management, emergency psychiatry, psychiatry]
  - front: "What are the differences between histrionic and borderline personality disorders?"
    back: "Histrionic PD: excessive emotionality and attention-seeking; uncomfortable when not center of attention; inappropriate sexually seductive behavior; rapidly shifting shallow emotions; uses physical appearance to draw attention; impressionistic/vague speech; theatrical/exaggerated emotions; suggestible. Borderline PD: unstable relationships with idealization/devaluation (splitting); identity disturbance; self-harm and suicidal behavior; chronic emptiness; intense inappropriate anger; abandonment fears; transient paranoia/dissociation. Key distinctions: Histrionic — seeks attention and admiration, emotions are shallow and shifting but not as intense; BPD — fears abandonment, emotions are deeply felt, self-destructive behavior is prominent, identity is fundamentally unstable.\n\nBoth are Cluster B personality disorders and can co-occur. Histrionic PD is less associated with self-harm and suicidal behavior compared to BPD. Histrionic PD has less evidence-based treatment available compared to BPD (which has DBT, MBT). In clinical practice, the distinction can be difficult and often requires longitudinal assessment."
    difficulty: medium
    tags: [histrionic PD, borderline PD, personality disorders, differential diagnosis, psychiatry]
  - front: "What are the DSM-5 diagnostic criteria for OCD and what is the first-line treatment?"
    back: "Obsessions (recurrent intrusive thoughts causing anxiety) and/or compulsions (repetitive behaviours/mental acts to reduce anxiety). Time-consuming (>=1 hour/day) or causing significant distress/impairment. First-line: CBT with exposure and response prevention (ERP), and/or SSRI (fluoxetine, fluvoxamine, sertraline, paroxetine) at higher doses than for depression.\n\nCANMAT recommends ERP as first-line for mild-moderate OCD and combined ERP + SSRI for moderate-severe. OCD SSRIs require higher doses (e.g., fluoxetine 60-80 mg) and longer trial duration (8-12 weeks) compared to depression treatment. Clomipramine is effective but used as second-line due to side effects. Treatment-resistant OCD may benefit from augmentation with low-dose antipsychotic."
    difficulty: medium
    tags: [OCD, ERP, SSRI, CBT, CANMAT]
  - front: "What is the first-line pharmacotherapy for social anxiety disorder?"
    back: "SSRIs (escitalopram, paroxetine, sertraline) or SNRIs (venlafaxine XR) are first-line. Start low, titrate slowly. Continue 12+ months after response. CBT (cognitive restructuring + exposure) is equally effective and preferred by some patients. Combination CBT + medication for severe cases.\n\nCANMAT guidelines rate SSRIs and venlafaxine as first-line with Level 1 evidence. Beta-blockers (propranolol) are useful for performance-only subtype but not generalized SAD. Benzodiazepines are NOT recommended due to dependence risk. MAOIs (phenelzine) are effective but reserved as third-line due to dietary restrictions."
    difficulty: medium
    tags: [social-anxiety, SSRI, SNRI, CBT, CANMAT]
  - front: "What is the difference between specific phobia treatment and other anxiety disorders?"
    back: "Specific phobia: exposure-based therapy (systematic desensitization or flooding) is the ONLY evidence-based first-line treatment. Medications are NOT effective for specific phobia (unlike other anxiety disorders). Single-session exposure therapy can be curative. No role for SSRIs or benzodiazepines as maintenance.\n\nSpecific phobias are the most common anxiety disorder but rarely present for treatment unless functionally limiting (e.g., needle phobia affecting medical care, flight phobia). CANMAT confirms that pharmacotherapy has no sustained benefit. Short-term benzodiazepines may be used situationally (e.g., pre-flight) but do not address the phobia itself."
    difficulty: medium
    tags: [specific-phobia, exposure-therapy, no-medication, CBT, CANMAT]
  - front: "How is separation anxiety disorder diagnosed in children and what is the treatment?"
    back: "Developmentally inappropriate, excessive anxiety about separation from attachment figures lasting >=4 weeks in children. Symptoms: refusal to go to school/sleep alone, nightmares about separation, somatic complaints (stomachache, headache) when separation anticipated. Treatment: CBT (parent-involved), gradual exposure, parent training. SSRIs for moderate-severe or CBT-refractory cases.\n\nSeparation anxiety is normal until age 3-4; pathological when persistent, excessive, and impairing. CPS and CANMAT recommend CBT as first-line. School refusal is a common presentation requiring collaborative approach with school. SSRIs (fluoxetine, sertraline) are evidence-based for pediatric anxiety disorders including separation anxiety."
    difficulty: medium
    tags: [separation-anxiety, pediatric, school-refusal, CBT, SSRI]
  - front: "What differentiates OCD from obsessive-compulsive personality disorder (OCPD)?"
    back: "OCD: ego-dystonic (patient recognizes thoughts as irrational and distressing), specific obsessions/compulsions, causes significant distress. OCPD: ego-syntonic (patient views rigidity as appropriate), pervasive pattern of perfectionism, orderliness, and control, no specific obsessions/compulsions, patient does not typically seek treatment for these traits.\n\nOCD and OCPD are distinct disorders despite similar names. They can co-occur (~25% overlap). OCD responds to SSRIs and ERP; OCPD is treated with psychotherapy (not typically pharmacotherapy). DSM-5 classifies OCD separately from anxiety disorders in its own chapter. OCPD is a Cluster C personality disorder."
    difficulty: medium
    tags: [OCD-vs-OCPD, ego-dystonic, ego-syntonic, personality-disorder, differential]
  - front: "What are the CANMAT-recommended first-line treatments for generalized anxiety disorder?"
    back: "Pharmacotherapy: SSRIs (escitalopram, paroxetine, sertraline) or SNRIs (venlafaxine XR, duloxetine). Pregabalin is first-line in CANMAT (unlike US guidelines). Psychotherapy: CBT. Combined approach for severe or refractory cases. Continue pharmacotherapy for 12+ months after response.\n\nCANMAT uniquely includes pregabalin as first-line for GAD based on European evidence. Buspirone is second-line (slower onset, modest efficacy). Benzodiazepines are third-line only for short-term use due to dependence risk, cognitive impairment in elderly, and falls. CANMAT emphasizes tapering benzodiazepines that were previously prescribed."
    difficulty: medium
    tags: [GAD, SSRI, pregabalin, CANMAT, first-line]
  - front: "What is the evidence for ERP (Exposure and Response Prevention) in OCD treatment?"
    back: "ERP is the most effective psychotherapy for OCD: 50-70% of patients achieve clinically significant improvement. Involves systematic, prolonged exposure to anxiety-provoking stimuli while preventing compulsive responses. Typically 12-16 sessions. Effect sizes are larger than SSRIs alone. Y-BOCS is used to measure severity and response.\n\nCANMAT recommends ERP as first-line for all OCD severity levels. Response defined as >=35% reduction in Y-BOCS score. Barriers include patient avoidance, limited therapist availability, and high dropout rates. Intensive ERP (daily sessions over 3 weeks) shows comparable results to standard delivery. Combination with SRI is superior to either alone for severe OCD."
    difficulty: medium
    tags: [ERP, OCD-treatment, Y-BOCS, CBT, evidence-based]
  - front: "How is panic disorder managed and what is the role of benzodiazepines?"
    back: "First-line: SSRIs (paroxetine, sertraline, fluoxetine), SNRIs (venlafaxine), and/or CBT (interoceptive exposure + cognitive restructuring). Benzodiazepines are NOT first-line: reserved for short-term bridging (2-4 weeks) while waiting for SSRI onset. Long-term benzodiazepine use leads to dependence and is associated with worse outcomes.\n\nCANMAT recommends CBT as first-line either alone or combined with pharmacotherapy. Panic-focused CBT includes education about fight-or-flight, interoceptive exposure (inducing physical symptoms to reduce fear), and in-vivo exposure to avoided situations. Agoraphobia often co-occurs and requires specific exposure targets."
    difficulty: medium
    tags: [panic-disorder, SSRI, CBT, benzodiazepine, CANMAT]
  - front: "A child presents with excessive worry about multiple domains (school, health, family) lasting >6 months with restlessness and sleep difficulty. What is the diagnosis and management?"
    back: "Generalized anxiety disorder in children. Management: first-line is CBT (child-focused, with parent involvement). If moderate-severe or CBT-refractory: SSRI (fluoxetine or sertraline — best evidence in pediatric anxiety). Monitor for suicidality during SSRI initiation (Health Canada black box warning for <25 years).\n\nAnxiety disorders are the most common psychiatric conditions in children (10-20% prevalence). The CAMS trial showed CBT + sertraline was superior to either alone (81% response). Canadian guidelines recommend CBT first for mild cases. School-based interventions and parent training augment treatment. Screen for comorbid depression and ADHD."
    difficulty: medium
    tags: [pediatric-GAD, CBT, SSRI-pediatric, CAMS-trial, anxiety]
  - front: "What are hoarding disorder's key features and how is it treated?"
    back: "Persistent difficulty discarding possessions regardless of value, perceived need to save items, distress associated with discarding, accumulation clutters living spaces compromising intended use. Treatment: CBT specifically adapted for hoarding (sorting, decision-making, exposure to discarding). SSRIs have limited efficacy. Harm reduction approach when treatment-resistant.\n\nHoarding disorder was separated from OCD in DSM-5 as a distinct diagnosis. It has poor response to standard OCD treatments (SSRIs, ERP). Specialized CBT for hoarding includes in-home sessions and motivational interviewing. Prevalence is 2-6%. Fire safety and public health concerns often trigger referral. Canadian municipal bylaws may mandate cleanup."
    difficulty: medium
    tags: [hoarding-disorder, DSM-5, CBT, OCD-spectrum, harm-reduction]
