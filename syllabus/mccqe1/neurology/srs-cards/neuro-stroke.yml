  - front: "What is the relationship between transferrin saturation and ferritin in hemochromatosis screening?"
    back: "Transferrin saturation >45% is the initial sensitive screening test; serum ferritin >400 ng/mL supports the diagnosis\n\nTransferrin saturation is elevated first in iron overload. Ferritin is an acute phase reactant and can be elevated in inflammation even without iron overload."
    difficulty: medium
    tags: [hemochromatosis, diagnosis, iron studies, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the initial symptoms of Primary Biliary Cholangitis?"
    back: "Pruritus and fatigue\n\nPatients are often asymptomatic initially, but when symptoms appear, pruritus (itching) and fatigue are the most common initial presentations."
    difficulty: easy
