# Urology (Urology) - generated from srs-mccqe1
cards:
  - front: "What are the four types of kidney stones, their key features, and which is radiolucent on KUB x-ray?"
    back: "Calcium (75-85%): radiopaque, most common. Uric acid (5-10%): RADIOLUCENT on KUB, seen on CT, acidic urine pH <5.5. Struvite (5-10%): associated with UTI from urease-producing organisms, staghorn calculi. Cystine (1%): autosomal recessive, aggressive disease in young patients.\n\nUric acid stones are the only radiolucent stones on KUB but are visible on CT. Struvite stones are caused by urease-splitting organisms (Proteus, Pseudomonas, Klebsiella) and require complete clearance. E. coli does NOT cause struvite stones. Calcium stone prevention includes increased fluids, citrate, reduced salt, and thiazide diuretics for hypercalciuria."
    difficulty: medium
    tags: [urology, kidney stones, nephrolithiasis]
  - front: "A 25-year-old male presents with a painless testicular mass. Serum AFP is elevated but β-hCG is normal. What is the most likely tumor type and what is the initial management?"
    back: "Non-seminomatous germ cell tumor (AFP is NEVER elevated in pure seminoma). Initial management is radical inguinal orchiectomy.\n\nTesticular tumors are divided into seminoma (50%) and non-seminoma (50%). AFP is never elevated in pure seminoma, making it a key distinguishing marker. β-hCG can be elevated in both (7% of pure seminomas). All stages require radical orchiectomy via an inguinal approach - a trans-scrotal approach is contraindicated due to risk of lymphatic seeding."
    difficulty: medium
    tags: [urology, testicular cancer, oncology]
  - front: "What is the most common congenital obstructive urethral lesion in male infants and how does it present on prenatal ultrasound?"
    back: "Posterior urethral valves (PUV). Prenatal U/S shows bilateral hydronephrosis, thickened trabeculated bladder, dilated posterior urethra ('keyhole sign'), and oligohydramnios in a male fetus.\n\nPUV is caused by abnormal mucosal folds at the distal prostatic urethra. Treatment involves immediate catheterization followed by cystoscopic resection. If resection is not possible, vesicostomy is indicated. PUV can lead to renal dysplasia and secondary vesicoureteral reflux."
    difficulty: medium
    tags: [urology, pediatric urology, posterior urethral valves, congenital]
  - front: "What is the Bosniak classification system and at what class is surgical resection recommended?"
    back: "Bosniak classifies renal cysts by CT features and malignancy risk. Class I-II: simple cysts, near zero risk, no follow-up. Class IIF: minimally complex, ≤20% risk, surveillance. Class III: complex cyst, >50% risk, surgical resection. Class IV: likely malignant, >90% risk, surgical resection.\n\nThe Bosniak classification uses contrast CT features including septal thickness, calcification, and enhancement to stratify renal cyst malignancy risk. Simple cysts (Class I-II) are extremely common (up to 50% at age 50) and require no intervention. Class III and IV cysts require surgical resection due to significant malignancy risk."
    difficulty: medium
    tags: [urology, renal mass, Bosniak classification, oncology]
  - front: "A 65-year-old smoker presents with painless gross hematuria. What is the most important diagnosis to rule out and what is the initial investigation of choice?"
    back: "Urothelial (bladder) carcinoma must be ruled out. Initial investigation: cystoscopy combined with CT urography.\n\nUnexplained hematuria in any individual >40 years must be investigated to rule out malignancy. Cystoscopy is the initial procedure of choice for diagnosis and staging of urothelial malignancy. TURBT is both diagnostic and often therapeutic, establishing diagnosis and determining depth of invasion. The 'field defect' theory explains why urothelial carcinoma has a high recurrence rate."
    difficulty: easy
    tags: [urology, bladder cancer, hematuria, oncology]
  - front: "What is post-obstructive diuresis and how should it be managed?"
    back: "Polyuria (>3L/24h or >200 cc/h for 2 consecutive hours) after relief of urinary obstruction. Management: admit, monitor hemodynamics/electrolytes, replace every 1 mL of urine output with 0.5 mL half-normal saline IV.\n\nPhysiologic POD is due to excretion of retained urea, sodium, and water (high osmotic load) and is self-limiting within 48 hours. Pathologic POD is a sodium-wasting nephropathy from impaired tubular concentrating ability. Avoid glucose-containing fluids to prevent iatrogenic diuresis. Monitor Na and K every 6-12 hours."
    difficulty: medium
    tags: [urology, post-obstructive diuresis, fluid management]
  - front: "What is the classic triad of renal cell carcinoma and how often does it present?"
    back: "Gross hematuria, flank pain, palpable mass — only found in 10-15% of patients ('too late triad').\n\nMost RCC is diagnosed incidentally by US or CT (>50%). RCC originates from proximal convoluted tubule cells, with clear cell being the most common subtype (75-85%). Top 3 risk factors are smoking, HTN, and obesity. Paraneoplastic syndromes occur in 10-40% of patients."
    difficulty: easy
    tags: [urology, RCC]
  - front: "What are the paraneoplastic syndromes associated with renal cell carcinoma?"
    back: "Hematopoietic (anemia, polycythemia, elevated ESR), endocrinopathies (hypercalcemia, erythrocytosis, HTN from renin), Stauffer syndrome (abnormal LFTs without metastases), hemodynamic (systolic HTN from AV shunting).\n\nStauffer syndrome is hepatic cell dysfunction (abnormal LFTs, decreased WBC, fever, hepatic necrosis) that is reversible following removal of the primary tumor. RCC may invade renal veins and IVC, resulting in varicocele, ascites, and pulmonary emboli."
    difficulty: medium
    tags: [urology, RCC, paraneoplastic]
  - front: "What is the most common histological type of bladder cancer and its key presenting symptom?"
    back: "Urothelial carcinoma (>90%) presenting with painless hematuria (85-90% at diagnosis).\n\nSmoking is implicated in 60% of new bladder cancer cases. Non-muscle invasive disease (75%) has >80% overall survival but high recurrence rates. Muscle-invasive disease (25%) has 50-60% 5-year survival. TURBT is the gold standard for diagnosis and often therapeutic. BCG intravesical therapy prevents progression."
    difficulty: easy
    tags: [urology, bladder-cancer]
  - front: "What is the Gleason score in prostate cancer?"
    back: "A grading system based on cellular differentiation and pattern of prostate adenocarcinoma, used to determine mortality risk: <7 = low risk, 7 = intermediate, 8-10 = high risk.\n\nProstate cancer is the most prevalent cancer in males and 3rd leading cause of male cancer death. 60-70% of nodules arise in the peripheral zone. DRE and PSA are primary screening tools. Active surveillance is safe for low-risk, small volume Gleason <7 disease."
    difficulty: easy
    tags: [urology, prostate-cancer]
  - front: "What is the management of testicular torsion?"
    back: "Emergency surgical exploration and bilateral orchiopexy. Definitive diagnosis is NOT necessary before proceeding to the OR. Necrosis of testicular tissue occurs in 5-6 hours.\n\nTesticular torsion presents with acute severe scrotal pain, absent cremasteric reflex, negative Prehn's sign, and horizontal lie of the testicle. US Doppler shows decreased uptake. Any acute scrotal swelling/pain in a young boy should be considered torsion until proven otherwise."
    difficulty: medium
    tags: [urology, testicular-torsion, emergency]
  - front: "What tumour markers are used for testicular cancer staging?"
    back: "Beta-hCG, AFP, and LDH. Beta-hCG and AFP are positive in 85% of non-seminomatous tumours. Beta-hCG is positive in 7% of pure seminomas. AFP is NEVER elevated in pure seminoma.\n\nTesticular cancer is the most common solid malignancy in young males (15-35 years). 95% are germ cell tumours (50% seminoma, 50% non-seminoma). Radical inguinal orchiectomy is the standard approach — trans-scrotal approach is contraindicated to avoid disrupting lymphatic drainage."
    difficulty: medium
    tags: [urology, testicular-cancer, tumour-markers]
  - front: "What are the risk factors and complications of cryptorchidism?"
    back: "Risk factors: prematurity. Complications: reduced fertility (bilateral untreated = ~100% infertility), increased malignancy risk (10-40x), increased testicular torsion risk.\n\nCryptorchidism occurs in 1-4.6% of full-term newborns. Most undescended testes complete descent within the first 4 months of life. Orchiopexy is the standard treatment and facilitates testicular monitoring, may reduce malignancy risk, and reduces torsion risk."
    difficulty: easy
    tags: [urology, cryptorchidism, pediatrics]
  - front: "What investigation must be performed before attempting urethral catheterization in suspected urethral injury?"
    back: "Retrograde urethrogram (RUG).\n\nSigns of urethral injury include blood at the urethral meatus, high-riding prostate on DRE, butterfly perineal hematoma, and sensation of voiding without urine output. Posterior urethral injuries are associated with pelvic fractures; anterior injuries are from straddle injuries. Stricture is the most common complication."
    difficulty: medium
    tags: [urology, trauma, urethral-injury]
  - front: "What is the Bosniak classification for renal cysts?"
    back: "Class I: simple cyst, near zero malignancy risk. Class II: thin septum, minimal risk. Class IIF: minimally complex, ≤20% risk, needs follow-up. Class III: complex with thickened septa, >50% risk, surgical resection. Class IV: likely malignant with enhancing components, >90% risk, surgical resection.\n\nSimple renal cysts are very common (up to 50% at age 50) and are usually incidental findings. The Bosniak system stratifies cysts by CT features to guide management decisions from observation to surgical intervention."
    difficulty: medium
    tags: [urology, renal-cysts, radiology]
  - front: "What is the approach to managing a small solid renal mass?"
    back: "Initial workup: kidney function, CXR, contrast CT/MRI ± biopsy. If limited life expectancy: watchful waiting. <2 cm: active surveillance with imaging q3-6 months. 2-4 cm: active surveillance or definitive therapy (biopsy + ablation or partial nephrectomy).\n\nThere is controversy over optimal management of small renal masses. Partial nephrectomy (nephron-sparing) is preferred for tumors roughly <4 cm or in solitary kidney/bilateral tumors. Radical nephrectomy involves en bloc removal of kidney, tumor, ipsilateral adrenal, and Gerota's fascia."
    difficulty: medium
    tags: [urology, renal-mass, management]
  - front: "What conditions are associated with congenital bilateral absence of vas deferens?"
    back: "Cystic fibrosis transmembrane conductance regulator (CFTR) gene mutations.\n\nCFTR mutations cause congenital bilateral absence of vas deferens and epididymal obstruction, leading to obstructive azoospermia. Before intracytoplasmic sperm injection (ICSI), both the patient and partner should be screened for CF. Kartagener syndrome (ciliary dyskinesia) also causes infertility through impaired sperm motility."
    difficulty: medium
    tags: [urology, infertility, cystic-fibrosis]
  - front: "What is Wilms' tumour and how does it present?"
    back: "Embryonal kidney tumour in children (average age 3.5 years), presenting as a large, firm, unilateral abdominal mass (80%), with flank pain (30-40%) and microscopic hematuria (12-25%).\n\nWilms' tumour is the most common primary malignant renal tumour of childhood, comprising 5% of all childhood cancers. Associated syndromes include WAGR (Wilms', aniridia, genital anomaly, retardation), Beckwith-Wiedemann, and Denys-Drash. Treatment combines surgery, radiation, and chemotherapy with 90% 5-year survival."
    difficulty: easy
    tags: [urology, pediatrics, wilms-tumour]
  - front: "What is hypospadias and when should it be repaired?"
    back: "A congenital condition where the urethral meatus opens on the ventral side of the penis, proximal to normal. Optimal surgical repair is before age 2. Neonatal circumcision should be deferred because the foreskin may be needed for repair.\n\nHypospadias occurs in 1 in 300 live male births, with distal forms being more common. It may be associated with ventral penile curvature, disorders of sexual differentiation, undescended testicles, or inguinal hernia. Prevalence is higher in white males."
    difficulty: easy
    tags: [urology, pediatrics, hypospadias]
  - front: "What is the most common congenital obstructive urethral lesion in male infants?"
    back: "Posterior urethral valves (PUV).\n\nPUV are abnormal mucosal folds at the distal prostatic urethra causing varying obstruction. Antenatal features include bilateral hydronephrosis, distended bladder, and oligohydramnios. The 'keyhole sign' on prenatal US is characteristic. Treatment is immediate catheterization followed by cystoscopic valve resection."
    difficulty: easy
    tags: [urology, pediatrics, PUV]
  - front: "What is the PSA and what causes it to be elevated?"
    back: "PSA (prostate-specific antigen) is a glycoprotein produced by prostate epithelial cells. Elevated by: BPH, prostatitis, prostate biopsy/surgery, prostatic massage, urinary retention, catheterization, cystoscopy, exercise, ejaculation, and prostate cancer.\n\nPSA is specific to the prostate but NOT to prostate cancer. No single cut-off is universally justifiable, though <4 ng/mL is traditional. Decreased free:total PSA ratio and elevated PSA velocity/density are associated with increased cancer risk. Canadian guidelines recommend shared decision-making about screening starting at age 50."
    difficulty: easy
    tags: [urology, prostate-cancer, PSA, screening]
  - front: "A 28-year-old sexually active woman presents with 2 days of dysuria and urinary frequency without vaginal discharge. Urine dipstick shows positive leukocytes and nitrites. What is the first-line treatment?"
    back: "TMP/SMX (cotrimoxazole) 160/800 mg BID for 3 days, OR nitrofurantoin 100 mg BID for 5 days.\n\nUncomplicated UTI in women can be treated empirically when history, exam, and dipstick are consistent. The UTI clinical decision aid uses dysuria + positive leukocytes + positive nitrites (2 or more criteria) to justify treatment without culture."
    difficulty: easy
    tags: [urology, infectious-disease, family-medicine, UTI, pharmacology]
  - front: "What are the risk factors that classify a UTI as 'complicated,' requiring longer antibiotic courses?"
    back: "Male sex, pregnancy, recent urinary tract instrumentation, functional/anatomic abnormality of urinary tract, chronic renal disease, immunosuppression, indwelling catheter.\n\nComplicated UTIs require broader spectrum antibiotics for 7-14 days (e.g., TMP/SMX 160/800 BID for 7-14 days or ciprofloxacin 500 BID for 7 days) because the risk of treatment failure and complications is higher."
    difficulty: easy
    tags: [urology, infectious-disease, UTI, family-medicine]
  - front: "A 55-year-old man reports gradual onset of erectile dysfunction over 6 months with absent morning erections. What is the most likely etiology, and what distinguishes this from psychogenic ED?"
    back: "Organic (vascular) ED. Organic ED has gradual onset, global (not situational), constant course, poor non-coital erections, and absent morning erections. Psychogenic ED has acute onset, situational, varying course, and preserved morning erections.\n\nVascular disease accounts for 90% of organic ED. The presence or absence of morning erections is a key differentiator. Initial workup includes testosterone, prolactin, LH, HbA1c, and lipid profile. First-line treatment is PDE5 inhibitors."
    difficulty: medium
    tags: [urology, erectile-dysfunction, family-medicine]
  - front: "What are the contraindications to prescribing phosphodiesterase type 5 inhibitors (e.g., sildenafil) for erectile dysfunction?"
    back: "Concurrent use of nitrates (absolute contraindication due to risk of severe hypotension).\n\nPDE5 inhibitors potentiate the hypotensive effects of nitrates by enhancing nitric oxide-mediated vasodilation. This combination can cause life-threatening hypotension. Patients on any form of nitrate therapy must not use PDE5 inhibitors."
    difficulty: easy
    tags: [urology, pharmacology, erectile-dysfunction, cardiology]
  - front: "What is the first-line treatment for uncomplicated UTI in women?"
    back: "TMP/SMX 160/800 mg BID x 3 days OR nitrofurantoin 100 mg BID x 5 days.\n\nIf dysuria + leukocytes + nitrites on dipstick, treat empirically without further investigations. Complicated UTIs (male, immunocompromised, catheter) require longer broader-spectrum courses (7-14 days)."
    difficulty: easy
    tags: [urology, infectious disease, UTI]
  - front: "What differentiates organic from psychogenic erectile dysfunction?"
    back: "Organic: gradual onset, global (all circumstances), constant course, poor morning erections, absent non-coital erections. Psychogenic: acute onset, situational, varying course, morning erections present.\n\nVascular causes account for 90% of organic ED. Key investigations include testosterone, prolactin, LH, HbA1C, and lipid profile. PDE5 inhibitors are contraindicated with nitrates."
    difficulty: medium
    tags: [urology, erectile dysfunction]
  - front: "What is the most common histological subtype of renal cell carcinoma (RCC) and from which cells does it originate?"
    back: "Clear cell subtype (75-85%), originating from proximal convoluted tubule epithelial cells.\n\nOther subtypes include papillary (10-15%), chromophobe (5-10%), collecting duct (<1%), and other (<1%). Sarcomatoid or rhabdoid elements in any subtype are markers of poor prognosis. Hereditary forms are seen with von Hippel-Lindau syndrome."
    difficulty: easy
    tags: [urology, renal-cell-carcinoma]
  - front: "What is the classic 'too late triad' of renal cell carcinoma?"
    back: "Gross hematuria, flank pain, and palpable mass. Found in only 10-15% of patients.\n\nRCC is usually asymptomatic and frequently diagnosed incidentally by U/S or CT in over 50% of cases. The classic triad indicates advanced disease. Most patients now present before developing all three features due to widespread use of abdominal imaging."
    difficulty: easy
    tags: [urology, renal-cell-carcinoma]
  - front: "What are the top 3 risk factors for renal cell carcinoma?"
    back: "Smoking, hypertension, and obesity.\n\nOther risk factors include end-stage renal disease with acquired renal cystic disease and environmental exposures such as aromatic hydrocarbons. Hereditary syndromes (von Hippel-Lindau, hereditary papillary RCC, Birt-Hogg-Dube) also increase risk significantly."
    difficulty: easy
    tags: [urology, renal-cell-carcinoma]
  - front: "What paraneoplastic syndromes are associated with RCC?"
    back: "Hematopoietic disturbances (anemia, polycythemia, elevated ESR), endocrinopathies (hypercalcemia from increased vitamin D hydroxylation, erythrocytosis from increased erythropoietin, HTN from increased renin), Stauffer syndrome (abnormal LFTs, decreased WBC, fever, hepatic necrosis without metastases), and hemodynamic alterations (systolic HTN, peripheral edema).\n\nParaneoplastic syndromes occur in 10-40% of RCC patients. Stauffer syndrome is particularly notable as it mimics hepatic metastases but is reversible following removal of the primary tumor. These syndromes can be the presenting features of RCC."
    difficulty: hard
    tags: [urology, renal-cell-carcinoma, paraneoplastic]
  - front: "What is the difference between radical nephrectomy and partial nephrectomy for RCC?"
    back: "Radical nephrectomy involves en bloc removal of the kidney, tumour, ipsilateral adrenal gland (in upper pole tumours), and intact Gerota's fascia. Partial nephrectomy (nephron-sparing) is used for small tumours (roughly <4 cm) or in cases of solitary kidney/bilateral tumours.\n\nBoth approaches provide excellent oncologic results for early RCC. The EORTC-30904 trial showed no significant difference in 10-year survival between NSS and radical nephrectomy for small, solitary, low-stage RCC. Partial nephrectomy preserves renal function and is preferred when feasible."
    difficulty: medium
    tags: [urology, renal-cell-carcinoma, surgery]
  - front: "What is the 5-year survival for RCC by T stage?"
    back: "T1: 90-100%, T2-T3: 60%, Metastatic disease: <5% 10-year survival.\n\nStage at diagnosis is the most important prognostic factor for RCC. Predictors of relapse include tumour grade, local extent of the primary tumour, presence of local metastases, and histological subtype. Most common metastatic sites are bone, brain, lung, and liver."
    difficulty: easy
    tags: [urology, renal-cell-carcinoma, prognosis]
  - front: "What is the Bosniak classification used for, and what are the management recommendations for each class?"
    back: "It stratifies renal cysts for risk of malignancy based on contrast CT features. Class I-II (simple/minimally complex): no follow-up. Class IIF: follow-up imaging 6-12 months, surgery if evolves. Class III (>50% malignancy risk): surgical resection. Class IV (>90% malignancy risk): surgical resection.\n\nThe Bosniak classification helps determine whether a renal cyst requires intervention. Key features that increase malignancy risk include thickened/irregular septa, calcifications, and enhancement after contrast administration. Growing literature suggests surveillance may be safe for some Class III cysts."
    difficulty: medium
    tags: [urology, renal-cysts, bosniak-classification]
  - front: "What is the most common type of bladder carcinoma and what is the main risk factor?"
    back: "Urothelial carcinoma (UC) accounts for >90% of cases. Smoking is the main risk factor, implicated in 60% of new cases.\n\nOther risk factors include aromatic amines, cyclophosphamide, pelvic radiation, Schistosoma hematobium (associated with SCC), and chronic irritation. Bladder cancer is the 2nd most common urological malignancy with M:F ratio of 3:1 and mean age at diagnosis of 65 years."
    difficulty: easy
    tags: [urology, bladder-cancer]
  - front: "What is the key presenting symptom of bladder carcinoma and what is the gold standard investigation?"
    back: "Hematuria is the key symptom (85-90% at diagnosis). TURBT (transurethral resection of bladder tumour) is the gold standard — it is both diagnostic and often therapeutic, establishing diagnosis and determining depth of penetration.\n\nUnexplained hematuria in any individual over 40 years old must be investigated to rule out malignancy. The entire urinary tract must be evaluated unless there is clear evidence of glomerular bleeding. Cystoscopy is the initial procedure of choice for diagnosis and staging."
    difficulty: easy
    tags: [urology, bladder-cancer]
  - front: "What is the treatment approach for non-muscle invasive bladder cancer (NMIBC) vs muscle invasive bladder cancer?"
    back: "NMIBC: TURBT + intravesical chemotherapy, with BCG for high-risk (T1, CIS, high-grade Ta). Muscle invasive (T2+): radical cystectomy + pelvic lymph node dissection, with neoadjuvant chemotherapy (gemcitabine-platinum). Chemoradiation is an alternative for select patients.\n\n75% of bladder cancers are non-muscle invasive at diagnosis with >80% overall survival, though 15% progress to invasive disease. For muscle invasive disease, neoadjuvant chemotherapy before cystectomy improves survival compared to cystectomy alone, as shown in landmark trials."
    difficulty: hard
    tags: [urology, bladder-cancer, treatment]
  - front: "What is the 'field defect' theory in urothelial carcinoma?"
    back: "The entire urothelium (from renal pelvis to bladder) is bathed in carcinogens, which explains why UC has multiple lesions and a high recurrence rate.\n\nThis theory has important clinical implications: the entire urinary tract must be evaluated in patients with UC, and lifelong surveillance with cystoscopy is required. UC is frequently multifocal, and recurrence rates are high even after complete resection of visible tumours."
    difficulty: medium
    tags: [urology, bladder-cancer, urothelial-carcinoma]
  - front: "What is the tumour grade's significance in bladder cancer prognosis?"
    back: "Tumour grade is the single most important prognostic factor for progression. Low grade: 10% invasive, 60% recur locally. High grade: 50-80% are invasive or expected to progress to invasive.\n\nGrading determines aggressiveness of treatment. High-grade tumours require more intensive surveillance and often intravesical BCG therapy. Carcinoma in situ (CIS) is a high-grade flat lesion with aggressive behavior and higher recurrence rates following radical cystectomy."
    difficulty: medium
    tags: [urology, bladder-cancer, prognosis]
  - front: "What are the risk factors for prostate cancer?"
    back: "Age >50 years (risk increases 1%/yr after 65), African descent, high dietary fat (2x risk), family history (1st degree relative = 2x, 1st and 2nd degree = 9x risk), and positive BRCA mutation.\n\nProstate cancer is the most prevalent cancer in males and the 3rd leading cause of male cancer deaths. Up to 50% risk at age 50, with 75% diagnosed between ages 60-85. The mean age at diagnosis is 65 years, and lifetime risk of death from prostate cancer is 3%."
    difficulty: easy
    tags: [urology, prostate-cancer]
  - front: "Where do most prostate cancer nodules arise anatomically?"
    back: "60-70% arise in the peripheral zone. 10-20% in the transition zone. 5-10% in the central zone.\n\nThe peripheral zone location explains why DRE can detect many prostate cancers, as the peripheral zone is accessible to digital examination posteriorly. In contrast, BPH primarily affects the transition zone. The zonal anatomy is important for understanding cancer detection and treatment."
    difficulty: easy
    tags: [urology, prostate-cancer, anatomy]
  - front: "How is prostate cancer risk stratified and what are the categories?"
    back: "Low-risk: PSA <10, Gleason <7 (Grade Group 1), stage T1-T2a. Intermediate-risk: PSA 10-20, Gleason 7 (Grade Group 2-3), stage T2b-T2c. High-risk: PSA >20, Gleason 8-10 (Grade Group 4-5), stage T3/T4.\n\nRisk stratification guides treatment decisions. Any single criterion meeting a higher risk category places the patient in that category. Low-risk patients may be candidates for active surveillance, while high-risk patients require definitive therapy with or without adjuvant treatments."
    difficulty: medium
    tags: [urology, prostate-cancer, risk-stratification]
  - front: "What is the role of active surveillance in prostate cancer management?"
    back: "Active surveillance (serial PSA, DRE, and biopsies) is safe for low-risk, small volume, Gleason <7 prostate cancer. It avoids the side effects of definitive treatment while monitoring for disease progression.\n\nThe ProtecT trial showed that at 10 years, prostate-cancer-specific mortality was low regardless of treatment (monitoring vs. surgery vs. radiotherapy). However, surgery and radiotherapy had lower rates of disease progression and metastasis compared to active monitoring."
    difficulty: medium
    tags: [urology, prostate-cancer, active-surveillance]
  - front: "What is castration-resistant prostate cancer (CRPC) and how is it managed?"
    back: "CRPC is prostate cancer that progresses despite castrate levels of testosterone. ADT should be maintained. Non-metastatic CRPC: observation vs. apalutamide/enzalutamide/darolutamide. Metastatic CRPC: abiraterone, enzalutamide, or docetaxel-based chemotherapy. Post-docetaxel: cabazitaxel. Bone mets: denosumab/zoledronic acid + palliative radiation.\n\nCRPC represents a lethal phenotype of prostate cancer. Multiple new agents have improved survival in recent years, including androgen receptor signaling inhibitors and PARP inhibitors (olaparib for HRR mutations). Lutetium-177 PSMA is a newer option post-docetaxel and ARPI failure."
    difficulty: hard
    tags: [urology, prostate-cancer, CRPC]
  - front: "What are causes of elevated PSA besides prostate cancer?"
    back: "BPH, prostatitis, prostatic ischemia/infarction, prostate biopsy/surgery, prostatic massage, acute urinary retention, urethral catheterization, cystoscopy, TRUS, strenuous exercise, ejaculation, acute renal failure, cardiac surgery-related ischemia, and radiation therapy.\n\nPSA is specific to the prostate but NOT to prostate cancer. This is why PSA screening has high sensitivity but lower specificity. Free:total PSA ratio, PSA velocity, and PSA density can help improve specificity. No single justifiable PSA cut-off point exists."
    difficulty: easy
    tags: [urology, PSA, prostate-cancer]
  - front: "What is the most common solid malignancy in young males aged 15-35?"
    back: "Testicular cancer.\n\nAny solid testicular mass or acute hydrocele in a young patient must rule out malignancy. 95% are germ cell tumours (50% seminoma, 50% non-seminoma). Risk factors include cryptorchidism (10-40x increased risk), testicular atrophy, HIV, infertility, and family history."
    difficulty: easy
    tags: [urology, testicular-cancer]
  - front: "What tumour markers are used in testicular cancer and how do they distinguish seminoma from non-seminoma?"
    back: "Beta-hCG, AFP, and LDH. Beta-hCG and AFP are positive in 85% of non-seminomatous tumours. Beta-hCG is positive in only 7% of pure seminomas. AFP is NEVER elevated with seminoma.\n\nIf AFP is elevated, the tumor is non-seminomatous regardless of histology, which is critical for treatment planning. Elevated markers return to normal post-orchiectomy if no metastasis. These markers are also used for staging and monitoring treatment response."
    difficulty: medium
    tags: [urology, testicular-cancer, tumour-markers]
  - front: "Why must orchiectomy for testicular cancer be performed through an inguinal incision rather than a scrotal approach?"
    back: "The testicle drains via inguinal lymphatics. A trans-scrotal approach risks tumour seeding along scrotal lymphatics, which would alter the pattern of metastatic spread and complicate treatment.\n\nRadical inguinal orchiectomy involves ligating the spermatic cord inside the inguinal canal to prevent proximal tumour spread. This approach preserves the normal lymphatic drainage pattern, which is important for subsequent staging and treatment decisions including retroperitoneal lymph node dissection."
    difficulty: medium
    tags: [urology, testicular-cancer, surgery]
  - front: "What is the clinical presentation and management of testicular torsion?"
    back: "Acute onset severe scrotal pain and swelling, retracted and transverse-lying testicle (horizontal lie), negative Prehn's sign, and absent cremasteric reflex. Management: emergency surgical exploration and bilateral orchiopexy. Testicular necrosis occurs in 5-6 hours. Definitive diagnosis is NOT necessary to take to OR.\n\nTesticular torsion is a surgical emergency. The 'bell clapper deformity' predisposes to torsion. In young boys, any acute scrotal swelling/pain is torsion until proven otherwise. Bilateral orchiopexy is performed because the contralateral testis often has the same predisposing anatomy."
    difficulty: medium
    tags: [urology, testicular-torsion]
  - front: "How do you differentiate testicular torsion from epididymitis on physical exam?"
    back: "Torsion: diffuse tenderness, absent cremasteric reflex, negative Prehn's sign (no pain relief with testicular elevation), horizontal lie. Epididymitis: epididymal tenderness, present cremasteric reflex, positive Prehn's sign (pain relief with elevation).\n\nThe cremasteric reflex is elicited by stroking the inner thigh and observing ipsilateral testicular elevation. Its absence is highly suggestive of torsion. Doppler ultrasound showing decreased blood flow to the testicular artery confirms torsion, but surgery should not be delayed for imaging if clinical suspicion is high."
    difficulty: medium
    tags: [urology, testicular-torsion, epididymitis]
  - front: "What is the transurethral resection (TUR) syndrome and how does it present?"
    back: "Caused by absorption of large volume of hypotonic irrigation solution (glycine) through perforated venous sinusoids during TURP, leading to hypervolemic hyponatremic state. Presents with dilutional hyponatremia, confusion, nausea, vomiting, HTN, bradycardia, visual disturbances, CHF, and pulmonary edema.\n\nTreatment involves diuresis and, if severe, hypertonic saline administration. This complication does not occur with bipolar TURP because saline is used as irrigation instead of glycine. Recognition of early symptoms (confusion, visual changes) is important to prevent progression."
    difficulty: hard
    tags: [urology, BPH, TURP-syndrome]
  - front: "What are the medical treatment options for BPH and their mechanisms?"
    back: "Alpha-blockers (tamsulosin, terazosin, doxazosin): reduce stromal smooth muscle tone (dynamic component). 5-alpha reductase inhibitors (finasteride, dutasteride): block testosterone to DHT conversion, reduce prostate volume (static component). Combination therapy is more effective than either alone.\n\nThe MTOPS trial showed combination therapy with doxazosin and finasteride reduced BPH clinical progression by 66% vs placebo, significantly more than either agent alone. Alpha-blockers provide faster symptom relief, while 5-ARIs take months to reduce prostate volume."
    difficulty: medium
    tags: [urology, BPH, medications]
  - front: "What are the indications for TURP in BPH?"
    back: "Obstructive uropathy (large bladder diverticula, renal insufficiency), two or more episodes of urinary retention, recurrent UTIs, recurrent gross hematuria, bladder stones, and intolerance/failure of medical therapy.\n\nTURP is the traditional gold standard surgical treatment for BPH. Newer options include green-light laser photovaporization, laser enucleation, and minimally invasive surgical therapies (Rezum water-vapour therapy, UroLift, iTind). Retrograde ejaculation occurs in >75% post-TURP."
    difficulty: medium
    tags: [urology, BPH, TURP]
  - front: "What are the indications and contraindications for extracorporeal shock wave lithotripsy (ESWL)?"
    back: "Indications: renal calculi <1.5 cm and ureteral calculi; must be radio-opaque (not for uric acid stones). Contraindications: acute UTI/urosepsis, bleeding disorder/coagulopathy, pregnancy, uncontrolled HTN, aortic aneurysm, and obstruction distal to stone.\n\nESWL is the least invasive treatment option but also least successful. It uses fluoroscopy-guided shockwaves to fragment stones. Common complications include hematuria, bacteremia, ureteric obstruction by fragments, and perinephric hematoma. Patient preference and wait times play a large role in stone management."
    difficulty: medium
    tags: [urology, kidney-stones, ESWL]
  - front: "What is von Hippel-Lindau syndrome and its urological significance?"
    back: "An autosomal dominant syndrome featuring multiple bilateral renal cysts and/or renal cell carcinomas (50% incidence of RCC), along with cerebellar/spinal/retinal hemangioblastomas, pancreatic and epididymal cysts, and pheochromocytomas.\n\nVHL is caused by a mutation in the VHL tumour suppressor gene on chromosome 3p. Patients require lifelong surveillance for RCC and other tumours. Genetic testing should be considered in patients with bilateral/multifocal renal tumours, onset <45 years, or family history of renal tumours."
    difficulty: medium
    tags: [urology, renal-cell-carcinoma, von-hippel-lindau]
  - front: "What is angiomyolipoma and what CT finding is pathognomonic?"
    back: "A benign renal neoplasm consisting of blood vessels (angio-), smooth muscle (-myo-), and fat (-lipoma). Negative attenuation (-20 HU) on CT (representing fat) is pathognomonic.\n\nAngiomyolipomas account for <10% of adult renal tumours, with 20% associated with tuberous sclerosis (especially if multiple/recurrent). They may extend into regional lymphatics. Management includes surgical excision or embolization if symptomatic, with potential role for mTOR inhibitors in unresectable disease."
    difficulty: medium
    tags: [urology, angiomyolipoma, renal-mass]
  - front: "What is Wilms' tumour and what are its associated syndromes?"
    back: "An embryonal tumour (nephroblastoma) from immature kidney cells, the most common primary malignant renal tumour of childhood (average age 3.5 years). Presents as a large, firm, unilateral abdominal mass. Associated syndromes: WAGR (Wilms', aniridia, genital anomaly, retardation), Beckwith-Wiedemann, and Denys-Drash.\n\nTreatment involves radical nephrectomy or nephron-sparing surgery plus chemotherapy and radiation. Bilateral disease (5%) is treated with neoadjuvant chemotherapy followed by nephron-sparing surgery. Prognosis is excellent with 90% 5-year survival and 15% recurrence rate."
    difficulty: medium
    tags: [urology, wilms-tumour, pediatric]
  - front: "What are the clinical features of urethral injury and what investigation should all patients with suspected urethral injury undergo?"
    back: "Blood at urethral meatus, high-riding prostate on DRE, butterfly perineal hematoma, penile/scrotal hematoma, sensation of voiding without urine output, distended bladder. All patients should undergo retrograde urethrogram (RUG).\n\nUrethral injury is a contraindication to blind catheterization as it may convert a partial tear to a complete disruption. RUG or cystoscopy should be performed before attempting catheterization. If catheterization is not possible, a suprapubic cystostomy is placed."
    difficulty: medium
    tags: [urology, urethral-injury, trauma]
  - front: "What are the contraindications to urethral catheterization?"
    back: "Blood at the urinary meatus, scrotal hematoma, pelvic fracture, and/or high-riding prostate.\n\nThese signs suggest urethral injury, and blind catheterization could worsen the injury. A retrograde urethrogram should be performed first. If urethral injury is confirmed or catheterization is not possible, suprapubic catheterization is the alternative."
    difficulty: easy
    tags: [urology, catheterization, trauma]
  - front: "What percentage of blunt renal traumas are minor, and what are the indications for surgical intervention?"
    back: "90% are minor (contusions and superficial lacerations). Absolute indication for surgery: hemorrhage with hemodynamic instability. Relative indications: non-viable tissue, major laceration, urinary extravasation, vascular injury, expanding/pulsating perirenal mass.\n\nThe majority of renal trauma is now managed conservatively and nonoperatively. CT with contrast (triphasic) is the imaging modality of choice for stable patients. The degree of hematuria does not correlate with severity of injury. HTN develops in 5% as a late complication."
    difficulty: medium
    tags: [urology, renal-trauma]
  - front: "What is ischemic (low-flow) priapism and how is it managed?"
    back: "A prolonged erection lasting >4 hours in the absence of sexual excitement/desire, most commonly ischemic (thromboembolic, e.g., sickle cell disease). Management: needle aspiration and decompression of corpora cavernosa, phenylephrine intracorporeal injection q3-5 min, and surgical shunt if no response.\n\nIschemic priapism is a urological emergency because prolonged ischemia leads to corporal smooth muscle necrosis and permanent erectile dysfunction. Cavernosal blood gas analysis and Doppler U/S help distinguish ischemic from non-ischemic priapism. Non-ischemic (high-flow) priapism from trauma is generally self-limited."
    difficulty: hard
    tags: [urology, priapism]
  - front: "What is the mechanism of PDE5 inhibitors in erectile dysfunction and what is an absolute contraindication?"
    back: "PDE5 inhibitors (sildenafil, tadalafil, vardenafil) selectively inhibit phosphodiesterase-5, which degrades cGMP, leading to sinusoidal smooth muscle relaxation, increased blood flow, and erection. Absolute contraindication: concurrent use of nitrates (risk of severe hypotension).\n\nAll four PDE5 inhibitors have similar effectiveness. Tadalafil has a longer half-life, no cyanopsia, and can be taken with food. They are also contraindicated in patients with history of priapism or conditions predisposing to priapism (leukemia, sickle cell disease, polycythemia)."
    difficulty: easy
    tags: [urology, erectile-dysfunction, PDE5-inhibitors]
  - front: "What is the CHAARTED trial's main finding regarding metastatic hormone-sensitive prostate cancer?"
    back: "Combination of docetaxel and ADT resulted in significantly longer overall survival (13.6 months longer median OS) compared to ADT alone in hormone-sensitive metastatic prostate cancer.\n\nThis landmark trial established the role of early chemotherapy in metastatic hormone-sensitive prostate cancer. The median time to progression was also significantly longer in the combination group (20.2 vs 11.7 months). This changed the standard of care for newly diagnosed metastatic prostate cancer."
    difficulty: hard
    tags: [urology, prostate-cancer, landmark-trial]
  - front: "What is the GnRH agonist 'flare' phenomenon in prostate cancer treatment?"
    back: "GnRH agonists (leuprolide, goserelin) initially stimulate LH, causing a transient increase in testosterone ('flare') that can worsen bone pain in patients with bone metastases. After continued use, they suppress LH and testosterone levels.\n\nThe flare phenomenon occurs in the first 1-2 weeks of GnRH agonist therapy. To prevent clinical consequences, an antiandrogen (e.g., bicalutamide) is given for the first few weeks. Alternatively, GnRH antagonists (e.g., degarelix) can be used as they do not cause a flare."
    difficulty: medium
    tags: [urology, prostate-cancer, GnRH-agonist]
  - front: "What is cryptorchidism and what are its long-term complications?"
    back: "Abnormal location of testes along the normal path of descent (1-4.6% of full-term newborns). Complications: reduced fertility (untreated bilateral = ~100% infertility), increased malignancy risk (10-40x, intra-abdominal > inguinal), and increased risk of testicular torsion.\n\nMost undescended testes complete descent within the first 4 months of life (0.7-1.0% remain at 1 year). Treatment is orchiopexy, which does not eliminate malignancy risk but allows easier monitoring and may reduce risk. Hormonal therapy has not been proven beneficial over surgery."
    difficulty: medium
    tags: [urology, cryptorchidism, pediatric]
  - front: "What is a varicocele, how common is it, and what are the indications for treatment?"
    back: "Dilation and tortuosity of the pampiniform plexus due to incompetent valves in testicular veins. Found in 15% of men, 90% left-sided. Feels like a 'bag of worms.' Treatment indications: impaired sperm quality/quantity, pain/ache affecting QOL, affected testis fails to grow in adolescents, and cosmetic concerns.\n\nVaricoceles are present in 35-40% of infertile males, making them the most common correctable cause of male infertility. The left-sided predominance is due to the left testicular vein draining into the left renal vein at a right angle. A new right-sided varicocele should raise suspicion for retroperitoneal mass."
    difficulty: easy
    tags: [urology, varicocele, infertility]
  - front: "What is hydronephrosis and what are the two main categories of its etiology?"
    back: "Hydronephrosis is dilation of the renal pelvis, calyces, and ureters generally caused by obstruction of antegrade urine flow (pelvicaliectasis). The two main etiologic categories are: (1) Mechanical — intrinsic (calculi, BPH, strictures, trauma, neoplasms, previous urologic surgery) or extrinsic (pregnancy, uterine fibroids, colorectal/uterine/cervical malignancies, aortic aneurysm); and (2) Functional — neuropathic (neurogenic bladder, diabetic neuropathy, spinal cord disease) or hormonal (pregnancy, as progesterone decreases ureteral tone).\n\nHydronephrosis is a common urology presentation on the MCCQE1. Distinguishing mechanical from functional causes guides management. Pregnancy is a physiologic cause (both mechanical from gravid uterus and hormonal from progesterone). Imaging with U/S (>90% sensitive and specific) is first-line; MAG3 renogram adds functional data."
    difficulty: easy
    tags: [urology, hydronephrosis, obstruction, upper urinary tract]
  - front: "What imaging modality is >90% sensitive and specific for hydronephrosis, and what does a MAG3 diuretic renogram add?"
    back: "Ultrasound (U/S) is >90% sensitive and specific for hydronephrosis. MAG3 (mercaptoacetyltriglycine) diuretic renogram provides little anatomic/structural information but evaluates differential renal function and demonstrates whether functional obstruction exists (i.e., delayed drainage of radiotracer). CT better delineates anatomy and potential causes (e.g., obstructing stone) but provides less functional information.\n\nOn the MCCQE1, knowing which modality gives anatomic vs. functional information is high-yield. U/S is the go-to first-line imaging. MAG3 is key for evaluating UPJ obstruction and differential renal function. Retrograde pyelogram can both delineate anatomy and allow stent insertion."
    difficulty: easy
    tags: [urology, hydronephrosis, imaging, MAG3, ultrasound]
  - front: "Define post-obstructive diuresis (POD) and distinguish physiologic from pathologic POD."
    back: "Post-obstructive diuresis (POD) is polyuria (>3 L/24 h or >200 cc/h for 2 consecutive hours) resulting from relief of obstructive uropathy with elevated creatinine. Physiologic POD: excretion of retained urea, Na+, and H2O (high osmotic load) after obstruction relief — self-limiting, usually resolves within 48 h with PO fluids. Pathologic POD: Na+-wasting nephropathy from impaired concentrating ability of renal tubules due to decreased reabsorption of NaCl in the thick ascending limb and urea in the collecting tubule, increased medullary blood flow (solute washout), and increased flow/solute in distal nephrons.\n\nRecognizing the transition from physiologic to pathologic POD is clinically critical. Pathologic POD requires careful IV replacement. The key management rule is replacing every 1 mL of urine output with 0.5 mL of 1/2 normal saline IV to avoid perpetuating the diuresis. Glucose-containing fluids must be avoided (cause iatrogenic osmotic diuresis)."
    difficulty: medium
    tags: [urology, post-obstructive diuresis, electrolytes, nephrology]
  - front: "How is post-obstructive diuresis managed?"
    back: "Management of POD: (1) Admit patient; (2) Monitor hemodynamics and electrolytes (Na+ and K+ q6–12h, replace PRN); (3) Follow creatinine and BUN to baseline; (4) Monitor urine output q2h; (5) Ensure total fluid intake < urine output by replacing every 1 mL of urine output with 0.5 mL of 1/2 NS IV (PO fluids if physiologic POD); (6) Avoid glucose-containing fluids (cause iatrogenic osmotic diuresis).\n\nThe '0.5 mL replacement per 1 mL urine output' rule is a key MCCQE1 testable fact. Over-replacement perpetuates the diuresis; under-replacement risks hemodynamic instability. Electrolyte monitoring every 6–12 hours reflects the rapid shifts that can occur."
    difficulty: medium
    tags: [urology, post-obstructive diuresis, management, fluid replacement]
  - front: "Define overactive bladder (OAB) and its diagnostic criteria."
    back: "Overactive bladder is a symptom complex including: urinary urgency (with or without incontinence), urinary frequency (voiding ≥8 times in 24 hours), and nocturia (awakening ≥1 time per night to void). Diagnosis requires: (1) Focused history (past GU disorders, LUTS questionnaire, 3-day micturition diary); (2) Physical exam (genitourinary, pelvic, and rectal examination); (3) Urinalysis to rule out hematuria and infection. Additional tests if indicated: post-void residual, cystoscopy (to rule out carcinoma in situ, recurrent infections), urodynamics (in older men to rule out obstruction).\n\nOAB is thought to result from involuntary detrusor contractions. The MCCQE1 may test the distinction from stress urinary incontinence (SUI) — OAB involves urgency, while SUI involves leakage with increased abdominal pressure. The diagnostic minimum requires history, exam, and urinalysis."
    difficulty: easy
    tags: [urology, overactive bladder, LUTS, incontinence]
  - front: "What are the first-line pharmacological treatments for overactive bladder?"
    back: "First-line pharmacological options for OAB: (1) Antimuscarinics — oxybutynin hydrochloride, tolterodine, solifenacin, fesoterodine, darifenacin, propiverine, or trospium; (2) β3-adrenoceptor agonist — mirabegron. For refractory OAB: botulinum toxin bladder injection, sacral neuromodulation, or percutaneous tibial nerve stimulation (not commonly used in Canada).\n\nNon-pharmacological therapy (bladder training, pelvic floor exercises, fluid management, caffeine/alcohol avoidance, weight loss) is tried first. Antimuscarinics are the most established pharmacotherapy; mirabegron is an alternative with a different mechanism and side effect profile (avoids dry mouth). Botulinum toxin is third-line."
    difficulty: easy
    tags: [urology, overactive bladder, pharmacology, antimuscarinics, mirabegron]
  - front: "What conditions can contribute to symptoms of overactive bladder (OAB)?"
    back: "Conditions contributing to OAB symptoms: Lower urinary tract (UTI, obstruction, impaired bladder contractility); Neurological (stroke, MS, dementia, diabetic neuropathy); Systemic diseases (CHF, sleep disorders — primarily causing nocturia); Functional and behavioural (excessive caffeine and alcohol, constipation, impaired mobility); Medications (diuretics, cholinergic agents, narcotics, calcium-channel blockers, cholinesterase inhibitors).\n\nThe MCCQE1 may present a case with apparent OAB symptoms requiring you to exclude secondary causes. Cholinesterase inhibitors (used in dementia) can worsen bladder overactivity — this is a common drug-induced cause. Treating the underlying condition (e.g., UTI, CHF) may resolve OAB symptoms."
    difficulty: medium
    tags: [urology, overactive bladder, differential diagnosis, contributing conditions]
  - front: "What is the antibiotic treatment for simple uncomplicated UTI in Canada?"
    back: "First-line options for simple, uncomplicated UTI: (1) TMP-SMX 160/800 mg PO BID × 3 days; (2) Nitrofurantoin 100 mg PO BID × 5 days; (3) Fosfomycin 3g PO × single dose. Choice should be guided by local resistance patterns. Fluoroquinolones (e.g., ciprofloxacin) are reserved for complicated UTIs due to resistance concerns.\n\nThe MCCQE1 tests antibiotic selection for UTI. TMP-SMX is cheap and effective but local resistance rates must be considered (avoid if local resistance >20%). Nitrofurantoin is safe in pregnancy (avoid near term). Fosfomycin's single-dose convenience improves adherence. Fluoroquinolones should be preserved for complicated UTIs."
    difficulty: easy
    tags: [urology, UTI, antibiotics, treatment, infectious disease]
  - front: "What antibiotic regimens are used for gonococcal vs. non-gonococcal urethritis?"
    back: "Gonococcal urethritis: Ceftriaxone 250 mg IM × 1 dose PLUS treat for Chlamydia trachomatis co-infection. Non-gonococcal urethritis (usually Chlamydia): Azithromycin 1g PO × 1 day OR doxycycline 100 mg PO BID × 7 days. Antibiotic therapy should always be based on local resistance patterns and adjusted according to culture and sensitivity results.\n\nCo-treatment for chlamydia when treating gonorrhea is standard practice due to high co-infection rates. Reactive arthritis (formerly Reiter's syndrome — urethritis, uveitis/conjunctivitis, arthritis — 'can't pee, can't see, can't climb a tree') can follow Chlamydia infection. If culture-negative or unresponsive to treatment, consider Mycoplasma/Ureaplasma."
    difficulty: easy
    tags: [urology, urethritis, gonorrhea, chlamydia, antibiotics, STI]
  - front: "What are the defining features and antibiotic duration for acute vs. chronic bacterial prostatitis?"
    back: "Acute bacterial prostatitis (Category I): LUTS + pelvic pain + systemic signs (fever, chills, malaise) + leukocytosis in prostatic fluid + positive bacterial cultures (SEEK PP, 80% E. coli); treat with ciprofloxacin or TMP-SMX × 2–4 weeks. Chronic bacterial prostatitis (Category II): LUTS + pelvic pain without systemic signs + recurrent UTIs + leukocytosis + positive cultures; treat with ciprofloxacin × 4–6 weeks (plus α-blockers, anti-inflammatories). Chronic pelvic pain syndrome (Category III): LUTS + pelvic pain without evidence of infection; multimodal therapy.\n\nThe four NIH categories of prostatitis are high-yield for MCCQE1. The key distinction between Categories I and II is systemic signs (fever, malaise) only in acute. Category III (CPPS) is the most common — 90% of prostatitis cases — and does not require antibiotics unless culture-naive. Category IV is asymptomatic and found incidentally."
    difficulty: medium
    tags: [urology, prostatitis, infectious disease, antibiotics]
  - front: "What is the 4-glass test used for in prostatitis diagnosis?"
    back: "The 4-glass (Meares-Stamey) test involves culturing: VB1 (first voided urine = urethral specimen), VB2 (midstream urine = bladder specimen), EPS (expressed prostatic secretions obtained after prostate massage), and VB3 (urine voided after massage = post-massage specimen). It is used in chronic bacterial prostatitis (Category II) to localize infection to the prostate versus the urethra or bladder. Leukocytosis in EPS/VB3 with positive cultures confirms Category II; leukocytosis without positive cultures suggests Category IIIA.\n\nThe 4-glass test is the gold standard for differentiating prostatitis categories, particularly separating Category I (acute — cultures not needed due to obvious systemic presentation) from Categories II and III. In chronic prostatitis, the NIH Chronic Prostatitis Symptom Index (NIH-CPSI) is also used to quantify symptom burden."
    difficulty: hard
    tags: [urology, prostatitis, diagnosis, 4-glass test]
  - front: "What are the clinical features, diagnosis, and treatment of epididymitis?"
    back: "Epididymitis clinical features: sudden onset scrotal pain and swelling (± radiation along cord to flank), scrotal erythema and tenderness, Prehn's sign (pain relief with testicle elevation), fever, storage symptoms, purulent discharge, reactive hydrocele. Diagnosis: U/A, urine C&S, urethral Gram stain/culture; if uncertain, MUST rule out testicular torsion with Doppler U/S; U/S confirms with increased vascularity. Treatment: <35 yr (presumed STI) — ceftriaxone 200 mg IM × 1 PLUS doxycycline 100 mg PO BID × 10 days; ≥35 yr (presumed urinary source) — ofloxacin 300 mg PO BID × 10 days. Plus scrotal support, bed rest, ice, and analgesia.\n\nDifferentiating epididymitis from testicular torsion is critical — torsion is a surgical emergency. Prehn's sign (pain relief with elevation) suggests epididymitis, but is not reliable. Any diagnostic uncertainty mandates urgent Doppler U/S. In <35 yr, Neisseria gonorrhoeae and Chlamydia trachomatis are the dominant pathogens; in ≥35 yr, GI organisms (E. coli) predominate."
    difficulty: medium
    tags: [urology, epididymitis, orchitis, scrotal pain, STI, testicular torsion]
  - front: "What are the typical organisms causing epididymitis by age group?"
    back: "<35 years: Neisseria gonorrhoeae or Chlamydia trachomatis (sexually transmitted). ≥35 years or penetrative anal intercourse: GI organisms, especially E. coli. Other causes: mumps orchitis (post-parotitis), TB, syphilis, granulomatous (autoimmune) in elderly men, amiodarone (involves only the head of the epididymis), and chemical epididymitis (urine reflux into ejaculatory ducts — due to increased prostatic urethral pressure from straining, heavy lifting).\n\nAge is the key determinant for empiric antibiotic choice in epididymitis. Amiodarone is a unique drug-induced cause affecting only the epididymal head. Chemical epididymitis from urinary reflux is sterile and treated symptomatically. Mumps orchitis can cause infertility in post-pubertal males."
    difficulty: easy
    tags: [urology, epididymitis, microbiology, STI, amiodarone]
  - front: "What is the definition of UTI and how is it classified?"
    back: "UTI definition: symptoms suggestive of UTI plus evidence of pyuria and bacteriuria on U/A or urine C&S. Asymptomatic bacteriuria = asymptomatic + ≥100,000 CFU/mL (treatment only in pregnancy, immunosuppressed, or prior to urologic surgery). Classifications: (1) Uncomplicated — lower UTI in a functionally and structurally normal urinary tract; (2) Complicated — structural/functional abnormality, male patients, immunocompromised, diabetic, iatrogenic complication, pregnancy, pyelonephritis, catheter-associated; (3) Recurrent — ≥3 UTIs/year or ≥2 UTIs/6 months.\n\nThe MCCQE1 frequently tests when NOT to treat bacteriuria — asymptomatic bacteriuria should be left untreated except in pregnancy and before urologic procedures. Complicated UTI requires longer antibiotic courses (up to 2–3 weeks) and imaging. Male UTI is always considered complicated."
    difficulty: easy
    tags: [urology, UTI, classification, asymptomatic bacteriuria]
  - front: "What organisms most commonly cause UTIs and what are the atypical organisms?"
    back: "Typical UTI organisms (mnemonic SEEK PP): E. coli (75–95% of cases), plus Enterococcus, Klebsiella, Proteus, Pseudomonas, and Staphylococcus saprophyticus. Atypical organisms: Mycobacterium tuberculosis (TB), Chlamydia trachomatis, Mycoplasma (Ureaplasma urealyticum), and fungi (Candida).\n\nE. coli dominates UTI microbiology due to its ability to produce adhesins that bind uroepithelium. S. saprophyticus is the second most common in young sexually active women. Atypical organisms require specific testing (PCR, AFB culture). Sterile pyuria should raise suspicion for TB, Chlamydia, or inadequately treated UTI."
    difficulty: easy
    tags: [urology, UTI, microbiology, E. coli, organisms]
  - front: "What is recurrent/chronic cystitis and how is it defined?"
    back: "Recurrent/chronic cystitis is defined as ≥3 UTIs per year or ≥2 UTIs per 6 months. Etiology: (1) Bacterial reinfection (80%) — recurrence with a different organism, the same organism if cultured >2 weeks after therapy, or any organism with an intermittent sterile culture; (2) Bacterial persistence (relapse) — same organism cultured within 2 weeks of sensitivity-based therapy. Treatment: lifestyle changes (↑ fluids, ↓ caffeine), antibiotics (continuous low-dose daily suppression vs. post-coital only vs. self-start therapy), vaginal estrogen for post-menopausal women.\n\nDistinguishing reinfection from persistence guides workup — persistence implies a persistent anatomic nidus (e.g., stone, biofilm, fistula) requiring investigation. Continuous prophylaxis with TMP-SMX or nitrofurantoin is recommended for 6–12 months. Topical vaginal estrogen restores atrophic mucosa that predisposes to UTI in post-menopausal women."
    difficulty: medium
    tags: [urology, recurrent cystitis, UTI, prophylaxis]
  - front: "What is interstitial cystitis (IC/PBS) and how is it diagnosed and treated?"
    back: "Interstitial cystitis (painful bladder/bladder pain syndrome): bladder pain, chronic urgency, and frequency without other identifiable cause. 90% in females; prevalence 20/100,000; median age 40 years. Types: non-ulcerative (more common, younger) and ulcerative (Hunner's lesions, older). Features: pelvic pain (suprapubic tenderness), storage symptoms (frequency > urgency > nocturia), negative U/A + urine C&S + cytology. Cystoscopy: glomerulations (submucosal petechiae) ± Hunner's lesions (not required for diagnosis). Treatment: 1st line — education, dietary modification, bladder retraining, stress management, pelvic floor physio; 2nd line — amitriptyline, cimetidine, hydroxyzine, pentosan polysulfate (oral/intravesical), gabapentin; 3rd line — hydrodistension, botulinum toxin, sacral neuromodulation; 4th line — radical surgery.\n\nIC is a diagnosis of exclusion. The classic triad — pelvic pain, urgency/frequency, negative cultures — in a middle-aged white woman is the MCCQE1 profile. Cystoscopic evaluation is not necessary to diagnose IC but can identify Hunner's lesions which respond to endoscopic treatment (cauterization, triamcinolone injection). Ketamine and tiaprofenic acid are drug-induced causes."
    difficulty: medium
    tags: [urology, interstitial cystitis, bladder pain syndrome, chronic pelvic pain]
  - front: "What are the clinical features of acute pyelonephritis and how is it investigated?"
    back: "Acute pyelonephritis: infection of renal parenchyma with local and systemic manifestations. Clinical features: rapid onset (<24 h), LUTS (frequency, urgency, hematuria — NOT dysuria unless concurrent cystitis), fever, chills, nausea, vomiting, myalgia, malaise, CVA tenderness, and/or flank pain. Investigations: U/A + urine C&S, CBC with differential (leukocytosis, left shift), imaging only if complicated pyelonephritis or no improvement after 48–72 h (U/S or CT), DMSA scan (photopenic defect = active infection or scar).\n\nThe absence of dysuria in pyelonephritis (unless concurrent cystitis) is a high-yield distinction. Gram-positive organisms (Enterococcus, S. aureus) require ampicillin treatment. Emphysematous pyelonephritis (gas-forming infection, typically in DM patients) usually requires nephrectomy. If febrile with suspected obstruction, emergent decompression (stent or nephrostomy) is needed."
    difficulty: medium
    tags: [urology, pyelonephritis, infectious disease, renal infection]
  - front: "What are the causative organisms in acute pyelonephritis?"
    back: "Ascending infection (most common, from lower UTI): Gram-negative bacilli — E. coli, Klebsiella, Proteus, Pseudomonas, Enterobacter. Hematogenous route: Gram-positive cocci — Enterococcus faecalis, S. aureus, S. saprophyticus. Common underlying causes: stones, strictures, prostatic obstruction, vesicoureteric reflux, neurogenic bladder, catheters, DM, sickle-cell disease, PCKD, immunosuppression, post-renal transplant, instrumentation, pregnancy.\n\nKnowing the route of infection predicts the likely organism — ascending (GN bacilli) vs. hematogenous (GP cocci). E. coli is still the most common overall. Suspected Enterococcus requires ampicillin. DMSA nuclear medicine scan is used when pyelonephritis diagnosis is uncertain — a photopenic defect confirms active infection or scarring."
    difficulty: medium
    tags: [urology, pyelonephritis, microbiology, gram-negative, gram-positive]
  - front: "What is the epidemiology and recurrence rate of urinary stone disease?"
    back: "Prevalence: ~8% (increasing). Sex ratio: M:F = 2:1. Peak incidence: 30–50 years. Recurrence rate: 10% at 1 year, 50% at 5 years, 60–80% lifetime. Most common stone type: calcium oxalate. Others: uric acid (5–10%), struvite (5–10%), calcium phosphate, cystine (1%).\n\nStone recurrence rates are clinically important because they justify metabolic workup and preventive therapy. Most important risk factor is minimal fluid intake. The high lifetime recurrence rate (60–80%) means virtually all stone patients require dietary counseling and often pharmacologic prevention after the first stone."
    difficulty: easy
    tags: [urology, nephrolithiasis, kidney stones, epidemiology]
  - front: "What are the four narrowest passage points for upper urinary tract stones?"
    back: "The four narrowest passage points for upper tract stones are: (1) Ureteropelvic junction (UPJ); (2) Pelvic brim (where ureter crosses iliac vessels); (3) Under the vas deferens/broad ligament; (4) Ureterovesical junction (UVJ) — the narrowest point.\n\nStones most commonly lodge at these anatomic narrowings, with UVJ being the tightest. Location of obstruction determines pain radiation pattern — UVJ stones cause trigonal irritation (frequency, urgency) and may radiate to the tip of the penis or labia. Stones <5 mm at any location have a 75% spontaneous passage rate."
    difficulty: easy
    tags: [urology, kidney stones, anatomy, ureteral colic]
  - front: "What are the clinical features of renal colic from ureteral stones?"
    back: "Renal colic features: urinary obstruction → upstream distention → pain. Types: (1) Flank pain from renal capsular distention (non-colicky); (2) Severe waxing and waning pain radiating from flank to groin, testis, or tip of penis (ureteral colic from distended collecting system/ureter). Associated features: writhing persistent discomfort, nausea/vomiting, hematuria (90% microscopic), diaphoresis, tachycardia, tachypnea. UVJ stones: trigonal irritation symptoms (frequency, urgency). Bladder stones: storage and voiding LUTS, terminal hematuria, suprapubic pain.\n\nHematuria (90% microscopic) is nearly universal in ureteral colic. The writhing/restless nature of colic differentiates it from peritoneal irritation (where patients lie still). The pain pattern follows the ureteral course. Fever with colic mandates ruling out concurrent pyelonephritis/obstruction — a urologic emergency requiring emergent decompression."
    difficulty: easy
    tags: [urology, kidney stones, renal colic, clinical features]
  - front: "What medications are associated with kidney stone formation?"
    back: "Medications causing kidney stones: Loop diuretics (furosemide, bumetanide — hypercalciuria), acetazolamide (alkaline urine → calcium phosphate stones), topiramate and zonisamide (carbonic anhydrase inhibitors → hypocitraturia, alkaline urine), indinavir and atazanavir (HIV protease inhibitors — radiolucent stones), acyclovir, sulfadiazine, triamterene.\n\nIndinavir and atazanavir stones are radiolucent on KUB x-ray and even on CT (unlike most stones which are radiopaque on CT). Topiramate/zonisamide cause stone formation via carbonic anhydrase inhibition leading to hypocitraturia and alkaline urine (calcium phosphate stones). This is an MCCQE1 high-yield drug-side-effect pairing."
    difficulty: medium
    tags: [urology, kidney stones, drug-induced, pharmacology]
  - front: "What are the key features of calcium oxalate stones (etiology, radiologic appearance, prevention)?"
    back: "Calcium stones (75–85%): Etiology — hypercalciuria (most common), hyperuricosuria (25% of calcium stone patients), hyperoxaluria (<5%), hypocitraturia (12%), hypomagnesemia, high dietary Na+, high urinary pH/low urine volume, hyperparathyroidism, obesity, gout, DM. Radiology: radiopaque on KUB x-ray. Prevention: increase fluids (>2 L/day), reduce animal protein, oxalate, Na+, sucrose, fructose; avoid high-dose vitamin C. NOTE: Reducing dietary calcium is NOT recommended (increases GI oxalate absorption → higher urinary calcium oxalate). Medications: thiazide diuretics (hypercalciuria), potassium citrate (hypocitraturia, hyperuricosuria), allopurinol (hyperuricosuria).\n\nThe counterintuitive teaching — low dietary calcium increases stone risk — is MCCQE1 high-yield. Low Ca2+ in the gut means more oxalate absorption → more urinary oxalate → more calcium oxalate precipitation. Citrate is a stone inhibitor (forms soluble complex with calcium), explaining why potassium citrate prevents stones. Thiazides reduce urinary calcium excretion."
    difficulty: medium
    tags: [urology, kidney stones, calcium oxalate, prevention, hypercalciuria]
  - front: "What are the key features of uric acid stones?"
    back: "Uric acid stones (5–10%): Etiology — uric acid precipitates in low-volume, acidic urine with high uric acid concentration; caused by hyperuricosuria, diet (purine-rich red meats), drugs (ASA, thiazides), high cell turnover (leukemia, cytotoxic drugs), gout. Key features: radiolucent on KUB x-ray but radiopaque on CT; acidic urine (pH <5.5) — NOT necessarily elevated urinary uric acid. Treatment: increase fluid intake to >2 L/day, alkalinize urine to pH 6.5–7 (potassium citrate, sodium bicarbonate), ± allopurinol; avoid making urine too alkaline (pH >7 → calcium phosphate stones).\n\nThe characteristic radiolucent appearance on KUB is the key radiologic feature — uric acid stones are the main radiolucent stone type (along with indinavir/atazanavir stones). Unlike other stones, uric acid stones can be dissolved with urinary alkalinization — this is a unique feature. The pH target of 6.5–7 is critical to know for the exam."
    difficulty: medium
    tags: [urology, kidney stones, uric acid, gout, radiolucent]
  - front: "What are the key features of struvite (infection) stones?"
    back: "Struvite stones (5–10%): Etiology — infection with urea-splitting organisms (Proteus, Pseudomonas, Providencia, Klebsiella, Mycoplasma, Serratia, S. aureus) → alkaline urinary pH → precipitation of magnesium ammonium phosphate (struvite). Key features: often staghorn calculi; perpetuates UTI (stone harbours organisms); positive urine dipstick and cultures; M:F = 1:3 (UTI more common in females). Note: E. coli does NOT cause struvite stones. Treatment: complete stone clearance required (stone harbours organisms), antibiotics for 6 weeks, regular follow-up urine cultures. ESWL partially effective; mixed calcium-struvite requires stone removal to treat infection.\n\nStruvite stones are the most clinically dangerous — they perpetuate infection and grow to fill the collecting system (staghorn calculi). Complete stone clearance is mandatory because organisms embedded in the stone matrix cannot be eradicated with antibiotics alone. This distinguishes struvite from other stone types where medical management may be adequate."
    difficulty: medium
    tags: [urology, kidney stones, struvite, staghorn calculus, infection stones]
  - front: "What are the key features of cystine stones?"
    back: "Cystine stones (1%): Etiology — autosomal recessive defect in intestinal mucosal absorption and renal tubular absorption of dibasic amino acids → COLA in urine (cystine, ornithine, lysine, arginine). Key features: aggressive stone disease in children and young adults, recurrent stone formation, family history, often staghorn calculi, faintly radiopaque on KUB x-ray. Diagnosis: positive urine sodium nitroprusside test, urine chromatography for cystine. Treatment: increased fluid intake (3–4 L/day), alkalinize urine (bicarbonate, potassium citrate), penicillamine/α-mercaptopropionylglycine or captopril (form soluble complex with cystine); SWL NOT effective.\n\nCystine stones are the only stone type caused by a hereditary amino acid transport defect. The COLA mnemonic (Cystine, Ornithine, Lysine, Arginine) covers all dibasic amino acids affected. SWL failure is clinically important — these hard stones require ureteroscopy or PCNL. The nitroprusside test (turns purple with cystine) is a bedside diagnostic tool."
    difficulty: hard
    tags: [urology, kidney stones, cystine, hereditary, amino acid transport]
  - front: "What are the indications for urgent intervention in renal stone disease?"
    back: "Urgent intervention is required for renal stones in the following situations: (1) Solitary kidney with obstruction; (2) Bilateral obstructing stones; (3) Renal failure from obstruction; (4) Sepsis with obstruction (urgent decompression via ureteric stent or percutaneous nephrostomy — definitive stone treatment delayed until sepsis resolves). Hospitalization is indicated if: pain cannot be controlled, unable to tolerate fluids/medications, persistent vomiting, high-grade obstruction, solitary kidney, comorbidities affecting stone passage.\n\nSepsis + obstructing stone is the most critical emergency — decompression takes precedence over stone removal. A ureteric stent (via cystoscopy) is the first-line decompression method; percutaneous nephrostomy is second-line. Definitive stone treatment (SWL, ureteroscopy, PCNL) is delayed until the sepsis resolves. This principle is frequently tested on the MCCQE1."
    difficulty: medium
    tags: [urology, kidney stones, emergency, sepsis, obstruction]
  - front: "What are the indications for percutaneous nephrolithotomy (PCNL)?"
    back: "Indications for PCNL: (1) Stone size >2 cm; (2) Staghorn calculus; (3) UPJ obstruction with concurrent stone requiring correction; (4) Large cystine stones (poorly fragmented with SWL); (5) Anatomical abnormalities preventing retrograde access; (6) Failure of less invasive modalities (SWL, ureteroscopy).\n\nThe treatment hierarchy for renal stones: medical management → ESWL (extracorporeal shock wave lithotripsy, less invasive) → ureteroscopic laser lithotripsy (more invasive, higher success) → PCNL (requires admission, general/spinal anesthesia, for large stones) → laparoscopic/open surgery (rare, only if concomitant procedure needed). PCNL is definitive for stones >2 cm."
    difficulty: medium
    tags: [urology, kidney stones, PCNL, surgical treatment, nephrolithiasis]
  - front: "What is the evidence for α-blockers as medical expulsive therapy (MET) for ureteral stones?"
    back: "Per Cochrane meta-analysis (2018) of 67 RCTs (10,509 adult patients): α-blockers resulted in increased stone clearance compared to standard therapy (RR 1.45, 95% CI: 1.36–1.55; low-quality evidence). Subgroup analysis suggests α-blockers may be less effective for smaller stones (<5 mm). Slight increase in major adverse events noted. Conclusion: α-blockers likely increase stone clearance but also slightly increase risk of major adverse events; benefit most apparent for stones 5–10 mm.\n\nMedical expulsive therapy (MET) with α-blockers (tamsulosin) is used for distal ureteral stones 5–10 mm. The rationale is that α1-receptors in the distal ureter promote smooth muscle relaxation, facilitating stone passage. Stones <5 mm have a 75% spontaneous passage rate and may not benefit significantly from MET. Stones >10 mm require procedural intervention."
    difficulty: medium
    tags: [urology, kidney stones, alpha-blockers, MET, evidence-based medicine]
  - front: "What investigations are performed for renal stones and when is each test indicated?"
    back: "All patients: CBC, U/A, urine C&S. KUB x-ray: first episode renal colic (shows 90% radiopaque stones; good for follow-up; cannot see uric acid stones; do not confuse phleboliths for stones). Ultrasound: pregnant patients, recurrent stone formers, pediatric cases, uncertain diagnosis (avoids radiation, 90% sensitivity, can assess hydronephrosis, no radiation). CT (non-contrast): gold standard diagnostic test; sees adjacent organs, exact stone location, can plan surgery; can assess stone density; concern: radiation (especially young females). Cystoscopy: suspected bladder stones, pediatric cases, stone not seen on KUB. Urine pH: suspected uric acid stone (pH <5.5). PTH + 24-hour urine ×2 (for volume, Cr, Ca, Na+, PO4, Mg, oxalate, citrate, cystine): recurrent calcium stone formers — to rule out metabolic cause.\n\nCT non-contrast is the gold standard for acute renal colic (sensitivity >95%). The 24-hour urine collection is done twice for reproducibility and guides long-term prevention strategy. PTH is checked to rule out primary hyperparathyroidism as a cause of hypercalciuria. Ultrasound is preferred in pregnancy to avoid radiation."
    difficulty: medium
    tags: [urology, kidney stones, investigations, CT, ultrasound, metabolic workup]
  - front: "What are the stone pathogenesis mechanisms and inhibitory factors?"
    back: "Stone pathogenesis requires: (1) Supersaturation of stone constituents (at appropriate temperature and pH); (2) Stasis, low flow, and low urine volume (dehydration); (3) Crystal formation and stone nidus; (4) Loss of inhibitory factors. Inhibitory factors preventing stone formation: Citrate (forms soluble complex with calcium), Magnesium (forms soluble complex with oxalate), Pyrophosphate, Tamm-Horsfall glycoprotein.\n\nUnderstanding why certain patients form stones despite normal serum levels requires recognizing urinary inhibitor deficiency. Hypocitraturia is common in stone formers and treated with potassium citrate supplementation. Citric acid intake (lemon juice, orange juice) is a dietary source. This mechanistic understanding explains why potassium citrate prevents both calcium oxalate and uric acid stones."
    difficulty: medium
    tags: [urology, kidney stones, pathogenesis, citrate, inhibitors]
  - front: "What is reactive arthritis (formerly Reiter's syndrome) and how does it relate to urethritis?"
    back: "Reactive arthritis (formerly Reiter's syndrome) is a triad of urethritis, uveitis (or conjunctivitis), and arthritis — remembered by the mnemonic 'can't pee, can't see, can't climb a tree.' It is triggered by Chlamydia trachomatis urethritis (or GI infections). It represents an immune-mediated reaction to infection, not direct bacterial invasion of the joints/eyes.\n\nReactive arthritis is a seronegative spondyloarthropathy associated with HLA-B27. On the MCCQE1, a young male with urethritis + joint pain + eye redness should prompt consideration of reactive arthritis. Chlamydia is the most common genitourinary trigger; Campylobacter, Salmonella, Shigella, and Yersinia are common GI triggers."
    difficulty: medium
    tags: [urology, urethritis, reactive arthritis, Reiter syndrome, chlamydia, rheumatology]
  - front: "What are the risk factors for UTI development?"
    back: "UTI risk factors: (1) Stasis and obstruction — residual urine from impaired flow (PUVs, reflux, medications, BPH, urethral stricture, cystocele, neurogenic bladder); (2) Foreign body — catheter or instrumentation introduces pathogens or acts as nidus; (3) Decreased host resistance — DM, malignancy, immunosuppression, spermicide use, estrogen depletion, prior antimicrobial use; (4) Other — trauma, anatomic abnormalities, female sex, sexual activity, menopause, fecal incontinence.\n\nSpermicide use disrupts vaginal flora (kills Lactobacillus), predisposing to E. coli colonization. Estrogen depletion in post-menopausal women causes urogenital atrophy and reduced Lactobacillus — vaginal estrogen is recommended for recurrent UTIs in these women. Catheter-associated UTI (CAUTI) is the most common hospital-acquired infection."
    difficulty: easy
    tags: [urology, UTI, risk factors, prevention]
  - front: "What is the treatment approach for acute pyelonephritis based on clinical severity?"
    back: "Hemodynamically stable: outpatient oral antibiotics plus single initial IV dose (ciprofloxacin ± ceftriaxone 1g IV or ciprofloxacin 400 mg IV × 1). Severe or non-resolving: admit, hydrate, IV antibiotics (fluoroquinolone, gentamicin + ampicillin, extended-spectrum cephalosporin, extended-spectrum penicillin, or carbapenem). Emphysematous pyelonephritis: most patients require nephrectomy after IV antibiotics started and patient stabilized (consider temporization with nephrostomy tubes). Renal obstruction: admit for emergent stenting or percutaneous nephrostomy tube. Suspected/confirmed Enterococcus: requires ampicillin.\n\nThe step-down approach (IV → oral) is standard once clinical improvement occurs (usually 48–72 hours). Total duration is 10–14 days. The key decision point is whether to admit — fever + poor oral intake + inability to tolerate fluids = inpatient. Emphysematous pyelonephritis is a gas-forming infection usually in diabetics with a mortality of >50% if managed conservatively."
    difficulty: medium
    tags: [urology, pyelonephritis, treatment, antibiotics, emphysematous pyelonephritis]
  - front: "What dietary modifications prevent kidney stone recurrence?"
    back: "Universal dietary changes for all stone types: increase fluid intake (>2 L/day). Calcium oxalate stones: ↑ citrate (lemon/orange juice), ↓ animal protein, ↓ oxalate-rich foods, ↓ Na+, ↓ sucrose/fructose, avoid high-dose vitamin C; do NOT reduce dietary calcium (increases GI oxalate absorption). Uric acid stones: ↓ purine-rich foods (red meats), alkalinize urine to pH 6.5–7. Cystine stones: ↑ fluids to 3–4 L/day, alkalinize urine. General: weight loss if BMI >30, avoid living/working in extreme heat.\n\nThe anti-intuitive calcium advice is the most frequently tested dietary prevention pearl. Normal dietary calcium binds oxalate in the gut, preventing absorption — so restricting calcium paradoxically worsens oxaluria. Sodium restriction is important because high Na+ increases urinary calcium excretion. Oxalate restriction is secondary to fluid/sodium management."
    difficulty: medium
    tags: [urology, kidney stones, prevention, diet, fluid intake]
  - front: "What is the most common cause of vesicoureteral reflux (VUR) in children, and what is the rate of spontaneous resolution?"
    back: "Primary VUR is caused by a congenitally short intravesical ureter. Spontaneous resolution occurs in approximately 60% of cases, particularly in lower grades (I-II).\n\nVUR is graded I-V. Lower grades (I-II) are managed medically with daily antibiotic prophylaxis (TMP/SMX, trimethoprim, amoxicillin, or nitrofurantoin at half the treatment dose). The RIVUR trial showed prophylaxis reduces recurrent UTIs but does not reduce renal scarring risk. Siblings and family members may be screened (though controversial)."
    difficulty: easy
    tags: [vesicoureteral reflux, VUR, pediatric urology, urinary tract]
  - front: "What are the surgical indications for treatment of vesicoureteral reflux (VUR)?"
    back: "Indications include: failure of medical management, renal scarring (renal insufficiency, HTN), breakthrough UTIs, and persistent high-grade (IV or V) reflux.\n\nSurgical options include ureteral reimplantation with ureteroplasty, or subureteric injection with bulking agents (Deflux® or Macroplastique®). Medical treatment (daily antibiotic prophylaxis) is tried first for lower grades. Surgery addresses both the anatomical defect and complications like renal damage."
    difficulty: medium
    tags: [vesicoureteral reflux, VUR, surgical management, pediatric urology]
  - front: "Define hypospadias and state the recommended timing of surgical correction."
    back: "Hypospadias is a condition where the urethral meatus opens on the ventral (underside) of the penis, proximal to the normal location in the glans. Optimal surgical repair is before age 2 years.\n\nHypospadias occurs in 1 in 300 live male births; distal types are more common than proximal. It may be associated with ventral penile curvature (chordee), disorders of sexual differentiation, undescended testicles, or inguinal hernia. Neonatal circumcision should be deferred as foreskin tissue may be needed for surgical reconstruction."
    difficulty: easy
    tags: [hypospadias, pediatric urology, congenital, penis]
  - front: "What is the exstrophy-epispadias complex and how does severity range?"
    back: "A spectrum of defects from rupture of the cloacal membrane: epispadias (least severe — urethra opens dorsally), bladder exstrophy (exposed bladder lumen through abdominal wall defect), and cloacal exstrophy (most severe — exposed bladder and bowel with imperforate anus, associated with spina bifida >50%).\n\nThe incidence is rare: 1 in 30,000, with M:F = 3:1. It represents failure of closure of the cloacal membrane. Surgical correction is performed at birth; later corrections may be needed for incontinence, VUR, and low bladder capacity. Morbidity is high with multiple reconstructive surgeries required."
    difficulty: medium
    tags: [bladder exstrophy, epispadias, congenital, pediatric urology]
  - front: "What is Wilms' tumour (nephroblastoma) and what are its key clinical features?"
    back: "Wilms' tumour is an embryonal tumour arising from abnormal proliferation of metanephric blastema. Key features: large firm unilateral abdominal mass (80%), flank pain (30-40%), microscopic hematuria (12-25%), nausea/vomiting. Average age of incidence is 3.5 years.\n\nIt is the most common primary malignant renal tumour of childhood, accounting for 5-10% of childhood cancers. It is bilateral in 5% and associated with congenital malformation syndromes (WAGR — Wilms', aniridia, genital anomaly, retardation; Beckwith-Wiedemann; Denys-Drash). Treatment: radical or nephron-sparing nephrectomy + radiation + chemotherapy. 5-year survival is ~90%."
    difficulty: easy
    tags: [Wilms tumour, nephroblastoma, pediatric oncology, renal tumour]
  - front: "Which syndromes are associated with Wilms' tumour?"
    back: "WAGR syndrome (Wilms', aniridia, genital anomaly, intellectual disability/retardation), Beckwith-Wiedemann syndrome, and Denys-Drash syndrome.\n\nRecognition of these associated syndromes prompts earlier surveillance for Wilms' tumour. Bilateral Wilms' tumour occurs in ~5% of cases. The contralateral kidney and renal vein (for tumour thrombus) must always be evaluated before treatment. Bilateral disease is treated with nephron-sparing surgery after neoadjuvant chemotherapy."
    difficulty: medium
    tags: [Wilms tumour, WAGR syndrome, Beckwith-Wiedemann, Denys-Drash]
  - front: "What is cryptorchidism and what are the long-term complications of untreated bilateral cryptorchidism?"
    back: "Cryptorchidism is the abnormal location of a testis somewhere along the normal path of descent (inguinal canal, abdominal). Untreated bilateral cryptorchidism leads to ~100% infertility (due to Leydig and germ cell loss) and increased malignancy risk (intra-abdominal > inguinal location).\n\nPrevalence is 1-4.6% in full-term newborns; most descend within 4 months of life. Denis Browne pouch (between external oblique fascia and Scarpa's fascia) is the most common ectopic location. Treatment is orchiopexy. Paternity rates in formerly bilateral cryptorchid men are 33-65% vs. 93% in normal men. Surgery also facilitates testicular monitoring and may reduce malignancy risk."
    difficulty: medium
    tags: [cryptorchidism, undescended testes, pediatric urology, infertility, testicular cancer]
  - front: "What is the most common cause of disorders of sexual differentiation (DSD) in 46,XX individuals?"
    back: "Congenital adrenal hyperplasia (CAH), most commonly due to 21-hydroxylase deficiency, is the most common cause of 46,XX DSD. It creates a shunt in the steroid biosynthetic pathway leading to excess androgens.\n\nUndiagnosed and untreated CAH can cause life-threatening electrolyte abnormalities (salt-wasting CAH) in newborns. Bilateral non-palpable testicles in apparent males should be considered 46,XX with salt-wasting CAH until proven otherwise. Laboratory tests include plasma 17-OH-progesterone (elevated in CAH) and serum electrolytes. Treatment includes steroid supplementation."
    difficulty: medium
    tags: [DSD, disorders of sexual differentiation, CAH, 21-hydroxylase, pediatric urology]
  - front: "What key laboratory test confirms the diagnosis of 21-hydroxylase deficiency (most common cause of CAH)?"
    back: "Elevated plasma 17-OH-progesterone (measured after 36 hours of life) confirms 21-hydroxylase deficiency.\n\nOther labs: elevated plasma 11-deoxycortisol indicates 11-beta-hydroxylase deficiency; serum testosterone and DHT pre- and post-hCG stimulation assess testicular function; serum electrolytes assess for salt-wasting. Chromosomal evaluation (karyotype) and ultrasound of adrenals, gonads, uterus, and fallopian tubes are also part of the workup. Management includes sex assignment after extensive consultation and reconstruction between 6-12 months."
    difficulty: medium
    tags: [CAH, 21-hydroxylase deficiency, 17-OH-progesterone, DSD, congenital adrenal hyperplasia]
  - front: "What is the French (Fr) scale used for in urological catheterization, and what is the standard catheter size?"
    back: "The French scale measures catheter circumference in mm (30 Fr = 1 cm diameter). Each 1 mm increase in diameter equals approximately 3 Fr. Standard catheter size is 14-18 Fr.\n\nA two-way Foley catheter is standard for indwelling use; a three-way Foley has an irrigation port and is used for continuous bladder irrigation (CBI) to prevent clot formation (22-24 Fr recommended). Coudé tip catheters are used for difficult catheterization due to BPH (angled tip navigates around enlarged prostate — always angle up/anteriorly)."
    difficulty: easy
    tags: [urological catheterization, Foley catheter, French scale, bladder catheterization]
  - front: "What are the medical indications and contraindications for neonatal circumcision per the Canadian Paediatric Society?"
    back: "Indications: pathological phimosis, recurrent paraphimosis, recurrent UTIs (especially in infants with urinary abnormalities), balanitis xerotica obliterans. Contraindications: unstable/sick infant, congenital genital abnormalities (hypospadias, epispadias, penoscrotal webbing, concealed penis), family history of bleeding disorders.\n\nThe Canadian Paediatric Society (2015, reaffirmed 2018) does not recommend routine circumcision of every newborn male. The procedure reduces HIV acquisition in heterosexual men by 38-66% (per WHO meta-analysis), but this does not justify universal neonatal circumcision in Canada. Complication rate is 0.6-2%, including early risks (bleeding, infection, glans injury) and late risks (adhesions, meatal stenosis, phimosis)."
    difficulty: medium
    tags: [circumcision, neonatal, Canadian Paediatric Society, phimosis, UTI prevention]
  - front: "What is post-TURP (transurethral resection syndrome) and how is it treated?"
    back: "Post-TURP syndrome is caused by absorption of large volumes of hypotonic irrigation solution (glycine) through perforated venous sinusoids, causing hypervolemic hyponatremia. Features: dilutional hyponatremia, confusion, nausea, vomiting, HTN, bradycardia, visual disturbances, CHF, and pulmonary edema. Treatment: diuresis and (if severe) hypertonic saline administration.\n\nThis complication does NOT occur with bipolar TURP because normal saline is used as irrigation instead of glycine. TURP is not a cancer operation — it relieves obstruction by resecting the periurethral transition zone. Chronic complications include retrograde ejaculation (>75%), erectile dysfunction (5-10%), urethral stricture, and bladder neck contracture. Incontinence after TURP is <1%."
    difficulty: medium
    tags: [TURP, transurethral resection, post-TURP syndrome, hyponatremia, BPH]
  - front: "What are the vasectomy post-procedure criteria for abandoning contraception?"
    back: "Contraception can be abandoned if: azoospermia is confirmed OR fewer than 100,000 immotile spermatozoa are found on semen analysis at 3-4 months post-vasectomy.\n\nPost-vasectomy semen analyses should be performed at approximately 3 and 4 months. If >100,000 immotile sperm or any motile sperm are present on repeat analysis 4-8 weeks after initial analysis, a redo vasectomy is indicated. Risk of pregnancy after vasectomy is ~0.1%. No-scalpel vasectomy has lower early complication rates. Complications include chronic scrotal pain (1-14%), sperm granuloma, and congestive epididymitis."
    difficulty: medium
    tags: [vasectomy, contraception, azoospermia, semen analysis, male sterilization]
  - front: "What are the indications for cystoscopy?"
    back: "Indications include: hematuria, lower urinary tract symptoms (LUTS — storage or voiding), urethral and bladder neck strictures, bladder stones, bladder tumour surveillance, and evaluation of upper tracts with retrograde pyelography.\n\nCystoscopy provides endoscopic inspection of the lower urinary tract (urethra, prostate, bladder, ureteral orifices). It is done under local anesthesia without NPO or routine antibiotics; antibiotic prophylaxis is recommended only for high-risk or immunosuppressed patients. Complications include infection, urinary retention (short-term), and stricture (long-term). Scopes can be flexible or rigid."
    difficulty: easy
    tags: [cystoscopy, hematuria, bladder tumour, LUTS, endoscopy]
  - front: "What are the complications of radical prostatectomy for prostate cancer?"
    back: "Late complications: moderate-to-severe stress urinary incontinence (3-10%), mild stress urinary incontinence (20-30%), erectile dysfunction (30-50%, depending on whether neurovascular bundles are preserved). Perioperative: lymphocele (if lymphadenectomy), blood loss, urine leak from anastomosis.\n\nAfter radical prostatectomy there is no ejaculate because the seminal vesicles are removed. Intraoperative complications are rare but include rectal, ureteral, or obturator nerve injury. A Cochrane review (2017) showed laparoscopic (LRP) and robotic-assisted (RARP) prostatectomy have similar urinary and sexual quality of life outcomes compared to open surgery, with shorter hospital stays."
    difficulty: medium
    tags: [radical prostatectomy, prostate cancer, urinary incontinence, erectile dysfunction, complications]
  - front: "What are the phosphodiesterase-5 (PDE5) inhibitors used for erectile dysfunction, and what are their key contraindications?"
    back: "PDE5 inhibitors: sildenafil, tadalafil, vardenafil. Mechanism: inhibit PDE5 (which degrades cGMP), leading to sinusoidal smooth muscle relaxation and increased blood flow. Key contraindications: concurrent nitrates (severe hypotension risk), history of priapism, or conditions predisposing to priapism (leukemia, sickle cell disease, myelofibrosis, polycythemia).\n\nAdverse effects include flushing, headaches, and dyspepsia. Alternative agents for ED include alprostadil (PGE1 — urethral suppository MUSE or intracavernosal injection), papaverine, and phentolamine. Intracavernosal injections can cause Peyronie's plaque (thickening of tunica albuginea) with repeated injections. Triple therapy (papaverine + phentolamine + PGE1) is also used."
    difficulty: medium
    tags: [erectile dysfunction, PDE5 inhibitors, sildenafil, tadalafil, nitrates contraindication]
  - front: "What is the mechanism and key adverse effect unique to tamsulosin/alfuzosin/silodosin compared to non-selective alpha-blockers for BPH?"
    back: "Tamsulosin, alfuzosin, and silodosin are selective alpha-1A adrenergic antagonists. Their key unique adverse effect is intraoperative floppy iris syndrome (IFIS) if cataract surgery is performed. Non-selective alpha-blockers (terazosin, doxazosin) more commonly cause orthostatic presyncope and leg edema.\n\nAll alpha-blockers reduce the dynamic component of bladder outlet obstruction by reducing stromal smooth muscle tone. Common class effects include retrograde ejaculation, headache, asthenia, and nasal congestion. Patients planning cataract surgery should inform their ophthalmologist of alpha-blocker use. Finasteride/dutasteride (5-alpha reductase inhibitors) address the static component by reducing prostatic volume and PSA levels."
    difficulty: medium
    tags: [BPH, alpha blockers, tamsulosin, floppy iris syndrome, 5-alpha reductase inhibitors]
  - front: "What is the mechanism of GnRH agonists (leuprolide, goserelin) in prostate cancer treatment, and what is the 'flare' phenomenon?"
    back: "GnRH agonists initially stimulate LH, causing a transient increase in testosterone ('flare'), which can worsen bone pain if bone metastases are present. With continued use, they cause downregulation of GnRH receptors, leading to sustained low testosterone levels (castration levels).\n\nTo prevent the flare, a non-steroidal antiandrogen (e.g., bicalutamide) is often given for the first 2-4 weeks. Common adverse effects of androgen deprivation therapy (ADT): hot flashes, headache, decreased libido, gynecomastia, osteoporosis. Abiraterone inhibits CYP17, blocking androgen synthesis in tumour, testes, and adrenal glands — requires concurrent steroids to prevent adrenal insufficiency."
    difficulty: hard
    tags: [GnRH agonist, leuprolide, prostate cancer, androgen deprivation therapy, testosterone flare]
  - front: "What is mirabegron's mechanism of action for overactive bladder, and how does it differ from anticholinergic agents?"
    back: "Mirabegron is a beta-3 adrenergic agonist. It causes detrusor relaxation (anticholinergic-like effect) and urinary sphincter contraction (sympathomimetic effect). Unlike anticholinergics, it does not cause dry mouth, blurred vision, or constipation, but blood pressure should be monitored.\n\nAnticholinergics (oxybutynin, tolterodine, solifenacin, darifenacin, trospium, fesoterodine, propiverine) inhibit acetylcholine on smooth muscle, decreasing uninhibited detrusor contractions. All anticholinergics are equally effective; long-acting formulations are better tolerated. Botulinum toxin A injections are used for refractory overactive bladder (both neurogenic and non-neurogenic) — risks include urinary retention and UTI."
    difficulty: medium
    tags: [overactive bladder, mirabegron, beta-3 agonist, anticholinergics, urge incontinence]
  - front: "What did the MTOPS trial demonstrate about combination therapy for BPH?"
    back: "The MTOPS trial (NEJM 2003) demonstrated that combination therapy with doxazosin (alpha-blocker) and finasteride (5-alpha reductase inhibitor) reduced clinical progression of BPH significantly more than either therapy alone (66% risk reduction vs. 39% for doxazosin alone and 34% for finasteride alone).\n\nClinical progression was defined as ≥4-point increase in AUA symptoms score, acute urinary retention, urinary incontinence, renal insufficiency, or recurrent UTI. Mean follow-up was 4.5 years. Combination therapy also reduced the need for invasive therapy long-term. This trial supports the current practice of combining alpha-blockers with 5-alpha reductase inhibitors in men with moderate-to-severe BPH symptoms."
    difficulty: hard
    tags: [MTOPS trial, BPH, doxazosin, finasteride, combination therapy]
  - front: "What did the CHAARTED trial demonstrate for metastatic hormone-sensitive prostate cancer?"
    back: "The CHAARTED trial (NEJM 2015) showed that combining docetaxel with androgen deprivation therapy (ADT) resulted in 13.6 months longer median overall survival compared to ADT alone, in men with metastatic hormone-sensitive prostate cancer.\n\nMethods: Patients randomized to ADT + docetaxel vs. ADT alone. Results: median overall survival 13.6 months longer with combination; median time to progression 20.2 vs. 11.7 months. This established docetaxel plus ADT as a standard of care for high-volume metastatic hormone-sensitive prostate cancer. The ERSPC trial (updated 2014) showed PSA screening reduces prostate cancer mortality by ~21% at 13 years but is associated with high rates of overdiagnosis."
    difficulty: hard
    tags: [CHAARTED trial, prostate cancer, docetaxel, androgen deprivation therapy, metastatic prostate cancer]
  - front: "What is the PCPT trial finding regarding finasteride and prostate cancer?"
    back: "PCPT (NEJM 2003): Finasteride reduced prostate cancer prevalence by 24.8% over 7 years compared to placebo. However, there was a significant increase in high-grade (Gleason high) disease in the finasteride group (6.4% vs. 5.1%). Long-term follow-up (2013) attributed the high-grade increase to better detection, not true increase in risk.\n\n18,882 men ≥55 years with normal DRE and PSA ≤3.0 ng/mL were randomized to finasteride 5 mg/day or placebo for 7 years. This was the first study to show a medication reduces prostate cancer likelihood. The reduction was primarily in low-grade cancers. Finasteride reduces PSA by approximately 50% — this must be accounted for when monitoring PSA in men on finasteride."
    difficulty: hard
    tags: [PCPT trial, finasteride, prostate cancer prevention, PSA, 5-alpha reductase]
  - front: "What is bladder and bowel dysfunction (BBD) in children and what are the treatment principles?"
    back: "BBD describes voiding and defecation symptoms without a neurogenic or anatomic cause. Storage symptoms: urgency, frequency, urge incontinence. Voiding symptoms: hesitancy, slow flow, intermittency. GI symptoms: constipation and encopresis. Treatment: stool softeners (polyethylene glycol 3350), urotherapy and bladder retraining, pelvic floor physiotherapy, anticholinergics (solifenacin, propiverine, tolterodine), neuromodulation via transcutaneous electrical nerve stimulation.\n\nBBD is important to recognize and treat because it is associated with vesicoureteral reflux and recurrent UTIs. The RIVUR trial studied children with VUR and found antibiotic prophylaxis reduced UTI recurrence but not renal scarring. Constipation management (with osmotic laxatives) is a key component because it directly affects bladder function through shared neural pathways and pelvic floor mechanics."
    difficulty: medium
    tags: [bladder bowel dysfunction, BBD, pediatric urology, anticholinergics, urotherapy]
  - front: "What is the RIVUR trial conclusion regarding antibiotic prophylaxis for children with vesicoureteral reflux?"
    back: "The RIVUR trial (2-year multicenter placebo-controlled RCT, n=607) concluded that antibiotic prophylaxis (trimethoprim-sulfamethoxazole) reduced the risk of recurrent UTIs in children with VUR after a first or second symptomatic UTI, particularly when the index infection was febrile and in those with baseline bladder and bowel dysfunction. However, it was NOT associated with a reduced risk of renal scarring.\n\nThis evidence supports the use of prophylaxis for recurrence prevention but argues against its use solely for preventing renal scarring. This changes the risk-benefit calculation: if the primary concern is preventing renal scarring, prophylaxis alone may not be sufficient and surgical correction should be considered for high-grade VUR. Surgical correction is indicated for grades IV-V, breakthrough UTIs, and failed medical management."
    difficulty: hard
    tags: [RIVUR trial, VUR, antibiotic prophylaxis, UTI prevention, renal scarring]
  - front: "What is gender-affirming penile inversion vaginoplasty and what are its key follow-up requirements?"
    back: "Penile inversion vaginoplasty forms a vaginal cavity and vulva (clitoris, urethra, mons, labia) using penile and scrotal skin. Key follow-up: lubrication required for penetration, prostate exams conducted vaginally, regular dilation of vaginal cavity to avoid stenosis. Complications: granulation tissue, urinary symptoms, fistula formation, hair growth in neovagina.\n\nPer WPATH Standards of Care Version 8, some gender-affirming procedures require 1 year of hormone therapy trial and preoperative evaluation letters from mental health professionals. Orchiectomy eliminates the need for testosterone blockers. Phalloplasty (radial forearm or anterolateral thigh flap) has high complication rates related to urethral connections (fistula, stricture, retention). Metoidioplasty (release of hormonally-enlarged clitoris) has lower complications but is not capable of penetrative intercourse."
    difficulty: medium
    tags: [gender affirming surgery, vaginoplasty, transgender, WPATH, phalloplasty]
