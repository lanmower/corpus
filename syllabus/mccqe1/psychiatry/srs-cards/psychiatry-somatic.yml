# Psychiatry Somatic (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What are the general characteristics of somatic symptom and related disorders?"
    back: "Physical symptoms lacking objective medical support, emerging in the presence of psychological factors. Key features: symptoms produced unconsciously (not malingering/factitious disorder); cause significant distress or functional impairment; may involve primary gain (symbolic resolution of unconscious conflict, reduces anxiety) or secondary gain (external benefits, sick role).\n\nThe key distinction is that somatic symptoms are unconsciously produced. Malingering involves intentional production of symptoms for external reward (secondary gain). Factitious disorder involves intentional production without external reward (patient seeks nurturance/attention). This distinction is clinically and medicolegally important."
    difficulty: medium
    tags: [somatic symptom, somatoform, malingering, factitious disorder, primary gain]
  - front: "What are the DSM-5 diagnostic criteria for Somatic Symptom Disorder?"
    back: "A. One or more somatic symptoms causing distress or disruption of daily life. B. Excessive thoughts, feelings, or behaviours (at least one): (1) disproportionate/persistent thoughts about symptom seriousness, (2) persistently high anxiety about health/symptoms, (3) excessive time/energy devoted to symptoms. C. Symptomatic state persistent (typically >6 months). Prevalence: 5–7%; F > M.\n\nSomatic symptom disorder replaces the older DSM-IV category of 'somatization disorder.' A key change is that physical symptoms do not need to be 'medically unexplained' — comorbid medical illness can coexist. Common comorbidities: anxiety and depression (up to 80%). Rule out organic causes (e.g., MS) as somatic disorders are often misdiagnosed."
    difficulty: medium
    tags: [somatic symptom disorder, DSM-5, criteria, somatoform]
  - front: "How does illness anxiety disorder differ from somatic symptom disorder?"
    back: "Illness anxiety disorder: preoccupation with fear of having/developing a serious disease; minimal or no somatic symptoms (not acute); convictions persist despite negative investigations and reassurance; patient CAN acknowledge possible absence of disease (unlike delusion); high anxiety; maladaptive behaviour (excessive checking OR avoidance); duration ≥6 months; onset 3rd–4th decade. Prevalence: 3–5% of primary care patients. Somatic symptom disorder: prominent somatic symptoms are present.\n\nThe ability to acknowledge the possibility that the feared disease is not present distinguishes illness anxiety disorder from a somatic delusion. SSRIs may be helpful due to high anxiety levels. Specifiers: care-seeking type vs. care-avoidant type."
    difficulty: medium
    tags: [illness anxiety disorder, hypochondriasis, somatic symptom disorder, differential]
  - front: "What is Conversion Disorder (Functional Neurological Symptom Disorder) and what neurological signs can help differentiate it from organic disease?"
    back: "Conversion disorder: one or more symptoms/deficits affecting voluntary motor or sensory function mimicking neurological or GMC (e.g., paralysis, impaired coordination, double vision, non-epileptic seizures). Spontaneous remission: 95% of acute cases, 50% of chronic cases (>6 months). Neurological testing signs: Hoover's sign (involuntary extension of 'paralyzed' leg when patient flexes contralateral leg against resistance); dermatome testing inconsistency. La belle indifférence: inappropriately cavalier attitude — associated but NOT diagnostic.\n\nConversion disorder does NOT require a preceding psychological event per DSM-5, but this is still worth exploring. Incidence: 2–5/100,000 general population; up to 20–25% of neurology inpatients. More common in rural populations. Incompatible findings on neurological examination help differentiate from organic disease."
    difficulty: hard
    tags: [conversion disorder, functional neurological, Hoovers sign, la belle indifference]
  - front: "What are the key differences between somatic symptom disorder, illness anxiety disorder, conversion disorder, factitious disorder, and malingering?"
    back: "Somatic symptoms: present in somatic symptom disorder / conversion disorder (neurological) / factitious disorder & malingering (can falsify); mild or absent in illness anxiety disorder. Symptom production: unconscious in somatic symptom disorder, illness anxiety, and conversion disorder; conscious in factitious disorder and malingering. External reward (secondary gain): absent in somatic symptom disorder, illness anxiety, conversion, and factitious disorder; PRESENT in malingering.\n\nThe two key axes are: (1) conscious vs. unconscious production, and (2) presence vs. absence of external secondary gain. Factitious disorder is conscious production WITHOUT external reward (the patient seeks nurturance, sympathy). Malingering is conscious production WITH external reward (e.g., disability, avoiding legal consequences)."
    difficulty: hard
    tags: [somatic symptom, illness anxiety, conversion disorder, factitious disorder, malingering, differential]
  - front: "What is the management approach for somatic symptom and related disorders?"
    back: "Non-pharmacological (mainstay): brief regularly scheduled GP visits (e.g., q4–6 wk); limit physicians involved; minimize unnecessary investigations; coordinate care; focus on functional improvement (physiotherapy, OT); psychoeducation; psychotherapy (CBT, psychodynamic, mindfulness, biofeedback). Pharmacological: minimize psychotropics; short-term anxiolytics only (associated with worse long-term outcomes); antidepressants for comorbid depression/anxiety.\n\nThe therapeutic relationship with a single GP is central to management. Emphasize mechanism of symptoms over searching for a cause; focus on what the patient can control. Functional recovery is the goal, not symptom elimination. Avoid iatrogenic harm from unnecessary investigations and procedures."
    difficulty: medium
    tags: [somatic symptom disorder, management, CBT, scheduled visits]
