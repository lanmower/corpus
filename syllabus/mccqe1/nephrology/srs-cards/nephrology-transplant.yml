# Nephrology Transplant (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What are the two mechanisms of calcineurin inhibitor (cyclosporine/tacrolimus) nephrotoxicity?"
    back: "1. Acute (reversible): afferent and efferent arteriolar vasoconstriction → decreased GFR → prerenal azotemia + tubular vacuolization. Treatment: calcium channel blockers or prostaglandin analogs, reduce/switch immunosuppressive drug. 2. Chronic (largely irreversible): obliterative arteriolopathy → interstitial nephritis and CKD (striped fibrosis pattern).\n\nCalcineurin inhibitors are a major cause of kidney failure in other solid organ transplants (e.g., heart). The ELITE-Symphony trial showed tacrolimus-based regimens had superior renal outcomes vs. cyclosporine or sirolimus regimens. Low-dose tacrolimus is now preferred for renal transplantation."
    difficulty: medium
    tags: [nephrology, calcineurin inhibitor, cyclosporine, tacrolimus, nephrotoxicity, transplant]
