# Pediatrics Rheumatology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the diagnostic criteria for Growing Pains in children?"
    back: "Growing pains is a diagnosis of exclusion in children aged 2-12 yr (M=F). Criteria: intermittent, non-articular pain with normal physical exam; pain at night, often bilateral, limited to calf, shin, or thigh; short-lived, relieved by heat, massage, or mild analgesics; child is well and asymptomatic during the day with no functional limitations. Lab investigations are NOT necessary if presentation is typical.\n\nGrowing pains affect 2-12 year olds and represent a benign functional pain syndrome. The key distinguishing features from pathological causes are the normal daytime exam, bilateral nocturnal location (calf/shin/thigh), and absence of joint swelling, fever, or functional limitation. No workup is needed for typical presentations — reassurance and supportive care suffice."
    difficulty: easy
    tags: [pediatrics, rheumatology, growing-pains, musculoskeletal]
  - front: "What are the diagnostic criteria for Juvenile Idiopathic Arthritis (JIA)?"
    back: "JIA requires ALL of: (1) arthritis in ≥1 joint(s), (2) duration >6 weeks, (3) onset age <16 years, and (4) exclusion of other causes of arthritis. Classification is defined by features and number of joints affected in the first 6 months of onset.\n\nJIA is a heterogeneous group of conditions. The 6-week duration threshold distinguishes it from transient reactive arthritis. Classification into subtypes (systemic, oligoarticular, polyarticular RF-/RF+, enthesitis-related, psoriatic) guides prognosis and management, particularly the risk of uveitis and systemic complications."
    difficulty: easy
    tags: [pediatrics, rheumatology, JIA, arthritis]
  - front: "A 5-year-old has daily fever spikes >38.5°C with rapid return to baseline, a salmon-coloured maculopapular rash, lymphadenopathy, and hepatosplenomegaly. What is the diagnosis and key lab findings?"
    back: "Systemic JIA (Still's Disease). Key lab findings: high ESR, CRP, WBC (leukocytosis), and platelet count (thrombocytosis). Arthritis may appear weeks to months later. Occurs at any age, M=F. Extra-articular features include erythematous salmon-coloured rash, lymphadenopathy, hepatosplenomegaly, serositis (pericarditis).\n\nSystemic JIA (Still's disease) is characterized by quotidian (once or twice daily) fever spikes with temperature returning rapidly to baseline — children appear acutely unwell during fever episodes. The salmon-coloured maculopapular rash is classic and transient, often appearing with fever. Serositis (especially pericarditis) is a serious complication. High inflammatory markers (WBC, platelets, ESR, CRP) are typical."
    difficulty: medium
    tags: [pediatrics, rheumatology, JIA, systemic-JIA, Stills-disease, fever]
  - front: "Which subtype of JIA is most common, and what are the key features including ocular risk?"
    back: "Oligoarticular JIA (1-4 joints) is the most common type. Key features: onset early childhood (<5 yr), F>M; typically affects large joints (knees most common, ankles, elbows, wrists — hip involvement unusual); ANA positive ~60-80%, RF negative. Screening eye exams essential for asymptomatic anterior uveitis (occurs in ~30%). Complications: knee flexion contracture, leg-length discrepancy, growth disturbances.\n\nOligoarticular JIA is the most common JIA subtype. Asymptomatic anterior uveitis occurs in approximately 30% of patients and can lead to blindness if undetected — hence the requirement for regular slit-lamp eye exams regardless of ocular symptoms. ANA positivity (~60-80%) increases uveitis risk. The hip is characteristically spared, unlike septic arthritis."
    difficulty: medium
    tags: [pediatrics, rheumatology, JIA, oligoarticular, uveitis, ANA]
  - front: "Compare RF-positive vs RF-negative Polyarticular JIA."
    back: "RF-negative polyarticular JIA (more common): onset bimodal at 2-4 yr and 6-12 yr, F>M; symmetrical large and small joints of hands/feet, TMJ, cervical spine; ANA positive in 50%, uveitis in 10%. RF-positive polyarticular JIA: onset late childhood/early adolescence, F>M; similar to aggressive adult rheumatoid arthritis, progresses into adulthood in most cases; severe rapidly destructive symmetrical arthritis of large and small joints; may have rheumatoid nodules at pressure points.\n\nRF-positive polyarticular JIA is functionally the pediatric equivalent of adult RA and carries the worst joint prognosis among JIA subtypes, with rapid destructive disease and frequent adult continuation. RF-negative disease is more common and typically milder. Both types require DMARDs when NSAIDs fail; RF-positive disease often needs biologic therapy (TNF antagonists)."
    difficulty: medium
    tags: [pediatrics, rheumatology, JIA, polyarticular, RF, rheumatoid-arthritis]
  - front: "What are the features of Enthesitis-Related Arthritis (ERA) in JIA, and what adult disease can it progress to?"
    back: "ERA: onset late childhood/adolescence, M>F. RF-negative arthritis and/or enthesitis (inflammation at tendon/ligament insertion to bone). Affects weight-bearing joints especially hip and intertarsal joints, or sacroiliitis. Associated with HLA-B27 and development of symptomatic uveitis/iritis (as opposed to asymptomatic uveitis in oligoarticular JIA). Risk of developing ankylosing spondylitis in adulthood. Asymmetric lower limb involvement.\n\nERA is the JIA subtype most closely related to the spondyloarthropathy spectrum. HLA-B27 positivity and axial involvement (sacroiliitis) distinguish it from other JIA subtypes. Unlike the asymptomatic uveitis of oligoarticular JIA, ERA uveitis is symptomatic (acute anterior uveitis/iritis with pain, redness, photophobia). Ankylosing spondylitis in adulthood is the major long-term risk."
    difficulty: medium
    tags: [pediatrics, rheumatology, JIA, enthesitis, HLA-B27, ankylosing-spondylitis, spondyloarthropathy]
  - front: "What are the diagnostic features of Psoriatic JIA?"
    back: "Psoriatic JIA: onset bimodal at 2-4 yr and 9-11 yr, F>M. Diagnosis requires arthritis AND psoriasis OR arthritis plus at least TWO of: dactylitis, nail pitting or other nail abnormalities, or family history of psoriasis in a 1st-degree relative. Joint involvement: asymmetric or symmetric small or large joints (usually knees and small joints of hands/feet). Skin: erythematous scaly lesions on scalp, post-auricular area, peri-umbilicus, or over extensor surfaces.\n\nPsoriatic JIA mirrors adult psoriatic arthritis in its key features. Dactylitis ('sausage digit') and nail changes (pitting, onycholysis) can precede skin disease. The requirement for only two of three minor criteria (dactylitis, nail changes, family history) allows diagnosis even without obvious psoriatic skin disease — important clinically as skin disease may lag joint disease in children."
    difficulty: medium
    tags: [pediatrics, rheumatology, JIA, psoriatic-arthritis, dactylitis]
  - front: "Outline the management approach for JIA."
    back: "Goals: eliminate inflammation, prevent joint damage, promote normal growth and development, minimize medication toxicity. Multidisciplinary: OT/PT, social work, orthopedics, ophthalmology, rheumatology. Exercise: moderate-intensity aerobic, flexibility, and strengthening to maintain ROM and muscle strength. 1st line: NSAIDs, intra-articular corticosteroids. 2nd line: DMARDs (methotrexate, sulfasalazine, leflunomide), systemic corticosteroids (acute severe disease), biologic agents (IL-1/IL-6 inhibition for systemic JIA; TNF antagonists for polyarticular JIA).\n\nJIA management is stepped. NSAIDs and intra-articular steroid injections are first-line for oligoarticular disease. Methotrexate is the most commonly used DMARD. Biologics are used when DMARDs fail: IL-1 inhibitors (anakinra, canakinumab) and IL-6 inhibitors (tocilizumab) for systemic JIA; TNF inhibitors (etanercept, adalimumab) for polyarticular JIA. Ophthalmologic surveillance for uveitis must continue throughout."
    difficulty: medium
    tags: [pediatrics, rheumatology, JIA, treatment, DMARDs, biologics, NSAIDs]
  - front: "What are the clinical features of Henoch-Schönlein Purpura (HSP) and what investigations are required?"
    back: "HSP is the most common childhood vasculitis (small vessel). Peak 4-10 yr, M:F=2:1. Often preceded by URTI 1-3 weeks before onset. Clinical triad: (1) palpable purpura (non-thrombocytopenic, lower extremities and buttocks), (2) abdominal pain (GI bleeding, intussusception), (3) arthritis/arthralgia (large joints with painful edema). Renal: microscopic hematuria, IgA nephropathy, proteinuria, HTN, renal failure in <5%. Investigations: urinalysis (blood, protein:creatinine ratio), serum urea/electrolytes/creatinine/albumin, elevated IgA; skin/renal biopsy shows IgA deposition; ultrasound for intussusception.\n\nHSP (IgA vasculitis) is diagnosed clinically — palpable purpura is required for diagnosis. The key investigations are renal function tests and urinalysis because nephritis can develop late (up to 6 months after presentation). Monthly urinalysis and BP monitoring for 6 months is recommended. Renal biopsy is reserved for progressive renal disease. Skin biopsy (IgA deposition) only for diagnostic uncertainty."
    difficulty: medium
    tags: [pediatrics, rheumatology, HSP, vasculitis, IgA, purpura, nephritis]
  - front: "What is the management and prognosis of HSP (Henoch-Schönlein Purpura)?"
    back: "Management: mainly supportive. Anti-inflammatory medications for joint pain. Corticosteroids for severe abdominal pain. Monitor for proteinuria on urinalysis and hypertension every month for 6 months to detect renal disease (immunosuppressive therapy if severe renal involvement). Prognosis: self-limited, resolves within 4 weeks. Recurrence in about one-third of patients. Long-term prognosis depends on severity of nephritis.\n\nHSP is generally self-limiting but the main concern is renal involvement (IgA nephropathy), which can develop weeks to months after the initial presentation and may progress to chronic kidney disease. Hence the requirement for 6 months of renal monitoring. Corticosteroids do NOT prevent renal involvement but are used for severe abdominal pain or severe joint disease. Recurrence occurs in ~33%."
    difficulty: medium
    tags: [pediatrics, rheumatology, HSP, vasculitis, prognosis, nephritis, monitoring]
  - front: "A child aged 7 presents with palpable purpura over the buttocks, colicky abdominal pain, and swollen knee. Which diagnosis must also be urgently considered as a complication, and how is it detected?"
    back: "HSP (Henoch-Schönlein Purpura) with the classic triad. Intussusception is a serious GI complication that must be urgently excluded. It is detected by abdominal ultrasound (bowel-within-bowel sign). Additionally, testicular torsion/swelling can occur and should be evaluated with scrotal ultrasound if testicular pain/swelling is present.\n\nHSP causes IgA-mediated vasculitis of the GI tract, leading to submucosal edema and hemorrhage. This can act as a lead point for intussusception — an emergency requiring air/hydrostatic enema reduction or surgery. GI bleeding can also occur. Renal involvement (IgA nephropathy) is the most important long-term complication, requiring 6 months of urinalysis and BP monitoring post-diagnosis."
    difficulty: hard
    tags: [pediatrics, rheumatology, HSP, intussusception, vasculitis, complications]
  - front: "What are the key differences between childhood-onset SLE and adult-onset SLE?"
    back: "Childhood-onset SLE vs. adult-onset SLE: Children have MORE ACTIVE disease, are more likely to have RENAL DISEASE, receive more INTENSIVE drug therapy, and have a POORER PROGNOSIS compared to adults. SLE: autoimmune illness affecting multiple organ systems; incidence 1 in 1000; more commonly occurs >10 yr in children; F:M = 10:1.\n\nChildhood-onset SLE (before age 18) tends to be more severe than adult SLE, with higher rates of lupus nephritis, neuropsychiatric lupus, and haematologic involvement. The female predominance (10:1) is similar to adults. Children require more aggressive treatment and have a higher disease burden over their lifetime. Monitoring for organ damage, particularly renal, is essential."
    difficulty: medium
    tags: [pediatrics, rheumatology, SLE, lupus, renal]
  - front: "What organisms cause Reactive Arthritis in children, and what syndromes can it progress to?"
    back: "Reactive arthritis (typically the knee) follows bacterial infection, especially Salmonella, Shigella, Yersinia, Campylobacter, Chlamydia, and most commonly Streptococcus (post-streptococcal reactive arthritis). Typically resolves spontaneously. May progress to chronic illness or Reiter's syndrome (classic triad: urethritis, conjunctivitis, arthritis — 'can't pee, can't see, can't climb a tree').\n\nReactive arthritis is a sterile synovitis triggered by an infection at a distant site. The arthritis appears 1-4 weeks after the triggering infection, is typically asymmetric, and affects large joints. Post-streptococcal reactive arthritis is distinct from rheumatic fever (no carditis). Reiter's syndrome (now called reactive arthritis triad) is the classic presentation in adults and adolescents with urethritis + conjunctivitis + arthritis."
    difficulty: medium
    tags: [pediatrics, rheumatology, reactive-arthritis, Reiter-syndrome, post-streptococcal]
  - front: "What investigations are indicated in the workup of limb pain in a child, and which are 'basic' vs. 'as indicated'?"
    back: "Basic investigations: CBC and differential, blood smear, ESR, CRP, X-ray. As indicated (based on clinical suspicion): Blood tests — ANA, RF, blood culture, viral/bacterial serology, CK, PTT, sickle cell screen, immunoglobulins, complement; Urinalysis; Synovial fluid (cell count, Gram stain, culture); TB skin test; Additional imaging (MRI, bone scan); Bone marrow aspiration; Slit-lamp exam (for uveitis screening in JIA).\n\nThe basic workup for limb pain is targeted at the most common serious diagnoses: infection (CBC, blood culture), inflammation (ESR, CRP, ANA, RF), malignancy (CBC with differential, blood smear for blasts), and structural causes (X-ray). Additional tests are ordered based on clinical findings. Bone marrow aspiration is reserved for suspected leukemia. Slit-lamp exam is essential for uveitis surveillance in ANA-positive oligoarticular JIA."
    difficulty: medium
    tags: [pediatrics, rheumatology, limb-pain, investigations, workup]
