    back: "Incidence of cirrhosis decompensation (ascites, variceal bleeding, hepatic encephalopathy) or death.\n\nThe trial aimed to determine if lowering hepatic venous pressure gradient with beta-blockers decreases the risk of decompensation in compensated cirrhosis patients with CSPH."
    difficulty: easy
    tags: [cirrhosis, clinical-trials, hepatology, decompensation, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "In the PREDESCI trial, what was the relative risk reduction for ascites with beta-blockers?"
    back: "58% relative risk reduction (HR 0.42, 95% CI 0.19-0.92, p=0.03)\n\nThe reduction in ascites incidence accounted for the primary difference between treatment and placebo groups, making it the main benefit of beta-blocker therapy."
    difficulty: medium
    tags: [ascites, beta-blockers, risk-reduction, hepatology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is the primary endpoint of the PREDESCI trial?"
    back: "Incidence of cirrhosis decompensation or death\n\nThe PREDESCI trial studied whether lowering hepatic venous pressure gradient with beta-blockers decreases risk of decompensation in patients with compensated cirrhosis and clinically significant portal hypertension."
    difficulty: easy
    tags: [cirrhosis, portal hypertension, clinical trial, hepatology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What was the primary mechanism by which beta-blockers reduced decompensation in the PREDESCI trial?"
    back: "Reduced incidence of ascites (HR 0.42, 95% CI 0.19-0.92, P=0.03)\n\nThe difference in the primary endpoint was primarily due to a reduced incidence of ascites in the beta-blocker group compared to placebo."
    difficulty: medium
    tags: [cirrhosis, ascites, beta-blockers, hepatology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is the conclusion of the PREDESCI trial regarding beta-blocker therapy in cirrhosis with CSPH?"
    back: "Long-term treatment with beta-blockers increases decompensation-free survival in patients with cirrhosis and CSPH, mainly by reducing the incidence of ascites\n\nThe trial demonstrated that beta-blockers (propranolol or carvedilol) significantly reduce the risk of first decompensation event, primarily through prevention of ascites development."
    difficulty: medium
    tags: [cirrhosis, portal hypertension, beta-blockers, ascites, hepatology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What are the exclusion criteria for Sjogren's syndrome classification?"
    back: "Prior head/neck radiation, active hepatitis C (PCR-confirmed), AIDS, sarcoidosis, amyloidosis, graft-versus-host disease, or IgG4-related disease\n\nThese conditions can cause similar sicca symptoms and must be excluded."
    difficulty: medium
    tags: [Sjogrens, Diagnosis, Differential, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What skin manifestations are associated with liver disease?"
    back: "Pruritus, jaundice, hyperpigmentation, spider nevi, palmar erythema, Terry's nails (white nails), porphyria cutanea tarda, xanthomas, hair loss.\n\nSpider nevi (>5 may be pathological) and palmar erythema are signs of hyperestrogenism in cirrhosis. Porphyria cutanea tarda causes photosensitive blistering on sun-exposed skin and is associated with HCV and alcohol."
    difficulty: medium
    tags: [liver disease, spider nevi, palmar erythema, pruritus]
  - front: "What AST/ALT ratio suggests alcoholic hepatitis rather than other causes of hepatitis?"
    back: "AST/ALT ratio >2 suggests alcohol as the cause of hepatitis.\n\nAlcohol preferentially damages mitochondria (which are rich in AST) and depletes pyridoxine (needed for ALT synthesis), leading to a disproportionate rise in AST. In viral hepatitis, both enzymes typically rise proportionately."
    difficulty: easy
    tags: [alcoholic hepatitis, AST, ALT, liver, emergency medicine]
  - front: "What are the common pathogens in spontaneous bacterial peritonitis (SBP), and what is the diagnostic procedure?"
    back: "Common pathogens: E. coli, Klebsiella, Streptococcus. Diagnosis: paracentesis (PMN >250 cells/mm³ is diagnostic). Albumin infusion improves outcomes in SBP patients.\n\nSBP occurs in cirrhotic patients with ascites, where bacterial translocation from the gut leads to peritoneal infection. Paracentesis is essential for diagnosis and culture. IV albumin at the time of diagnosis reduces hepatorenal syndrome and mortality."
    difficulty: medium
    tags: [SBP, spontaneous bacterial peritonitis, cirrhosis, paracentesis, ascites]
  - front: "What is the treatment for variceal GI bleeding in a patient with known cirrhosis?"
    back: "Octreotide (somatostatin analogue) for variceal bleeds. For minor GI bleeds: PPI. For severe or recurrent bleeds: endoscopy.\n\nOctreotide reduces splanchnic blood flow and portal pressure, decreasing variceal bleeding. Endoscopic band ligation or sclerotherapy provides definitive hemostasis. Most GI bleeds in cirrhotic patients are actually from gastritis or ulcers even if varices are known."
    difficulty: medium
    tags: [variceal bleed, cirrhosis, octreotide, GI bleeding, emergency medicine]
  - front: "What is the blood supply to the liver and what is the proportion from each source?"
    back: "The liver receives blood from two sources: the portal vein (75–80%) and the hepatic artery (20–25%).\n\nThe dual blood supply makes the liver unique. The portal vein delivers nutrient-rich blood from the GI tract; the hepatic artery provides oxygenated blood. This dual supply also means the liver is relatively protected from arterial occlusion alone."
    difficulty: easy
    tags: [liver anatomy, hepatic blood supply, portal vein, hepatic artery]
  - front: "What are the common causes of upper GI bleeding (UGIB)?"
    back: "Common: peptic ulcers (H. pylori, ASA, NSAIDs), esophageal varices, Mallory-Weiss tears, erosive esophagitis, erosive gastritis. Uncommon: tumours, arteriovenous malformation (AVM), Dieulafoy's lesion, GAVE (gastric antral vascular ectasia). Rare: aorto-enteric fistulae, hemobilia.\n\nPeptic ulcer disease is the most common cause of UGIB (~50%). Risk stratification (Rockford/Blatchford score) guides management. Prior to EGD, endotracheal intubation is indicated if massive UGIB, acidemia, or inability to protect airway."
    difficulty: medium
    tags: [upper GI bleed, UGIB, peptic ulcer, varices, Mallory-Weiss, Dieulafoy]
  - front: "What are the causes of conjugated hyperbilirubinemia (jaundice)?"
    back: "Hepatocellular disease: drugs, cirrhosis (any cause), hepatitis (any cause), infiltrative disease (hemochromatosis), familial disorders (Rotor syndrome, Dubin-Johnson syndrome, cholestasis of pregnancy), sepsis, post-operative/TPN. Biliary obstruction — Intraductal: gallstones, stricture, parasites, malignancy (cholangiocarcinoma), PSC, PBC. Extraductal: malignancy (pancreatic cancer, lymphoma), metastases in periportal nodes, pancreatitis.\n\nConjugated bilirubin is water-soluble and appears in urine (tea-coloured urine). The key distinction is hepatocellular (elevated ALT/AST) vs. cholestatic (elevated ALP/GGT) pattern. Imaging (ultrasound) is used to distinguish intra- vs. extra-hepatic obstruction."
    difficulty: hard
    tags: [conjugated hyperbilirubinemia, jaundice, cholestasis, hepatocellular, biliary obstruction]
  - front: "What are the causes of unconjugated hyperbilirubinemia?"
    back: "Overproduction: hemolysis, ineffective erythropoiesis (megaloblastic anemias). Decreased conjugation: drug inhibition (e.g., chloramphenicol), Crigler-Najjar syndromes type I and II, Gilbert's syndrome, neonatal jaundice.\n\nUnconjugated bilirubin is not water-soluble and does not appear in urine. Gilbert's syndrome is the most common inherited cause (benign, intermittent jaundice with fasting/illness). Crigler-Najjar type I is severe (requires liver transplant); type II is less severe (responds to phenobarbital)."
    difficulty: medium
    tags: [unconjugated bilirubin, jaundice, Gilberts syndrome, hemolysis, Crigler-Najjar]
  - front: "Define upper GI bleeding (UGIB) and list the most common etiologies in order of frequency."
    back: "Bleeding proximal to the ligament of Treitz (75% of GI bleeds). Etiology by frequency: gastric/duodenal ulcer (most common, ~40%), erosive gastritis (20%), esophageal varices (10–30%), Mallory-Weiss tear (10%), esophagitis, gastric cancer, Dieulafoy's lesion (rare), aortoenteric fistula (rare).\n\nThe ligament of Treitz is the suspensory ligament at the junction of the 4th portion of the duodenum and jejunum. Peptic ulcer disease remains the most common cause of UGIB. Varices carry the highest mortality per bleeding episode."
    difficulty: easy
    tags: [UGIB, upper GI bleeding, peptic ulcer, varices, etiology]
  - front: "What are the clinical features of UGIB listed in order of likely decreasing severity?"
    back: "Hematochezia (brisk UGIB) > hematemesis > melena > coffee-ground emesis > occult blood in stool.\n\nHematochezia from an upper GI source implies brisk bleeding with rapid transit. Coffee-ground emesis indicates slower bleeding with hemoglobin oxidation in the stomach. Melena (black tarry stool) results from digestion of blood during intestinal transit."
    difficulty: easy
    tags: [UGIB, hematochezia, hematemesis, melena, clinical features]
  - front: "What is the Forrest classification for peptic ulcer bleeding, and what are the associated rebleed risks?"
    back: "Class Ia: arterial bleeding (spurting) — 55–100% rebleed risk. Class Ib: oozing — 55–100%. Class IIa: visible vessel — 43%. Class IIb: sentinel clot — 22%. Class IIc: hematin-covered flat spot — 10%. Class III: no stigmata of recent hemorrhage — 5%.\n\nThe Forrest classification guides endoscopic intervention. High-risk stigmata (Ia, Ib, IIa) require endoscopic therapy. IV PPI therapy is used to stabilize clots and reduce rebleeding in patients with high-risk features."
    difficulty: hard
    tags: [Forrest classification, peptic ulcer, rebleed risk, UGIB]
  - front: "What is the recommended management of acute UGIB including pre-endoscopic and endoscopic steps?"
    back: "1. Stabilize: 1–2 large-bore IVs, IV fluids, NPO, monitoring. 2. Labs: CBC, cross/type, platelets, PT, PTT, electrolytes, BUN, Cr, LFTs. 3. IV PPI (to stabilize clot). 4. IV octreotide + antibiotics for suspected variceal bleed. 5. Consider IV erythromycin/metoclopramide for gastric emptying. 6. Endoscopy within 24h — epinephrine injection + thermal hemostasis (dual therapy standard of care). Hb transfusion threshold <80 g/L (higher if cardiovascular disease).\n\nDual endoscopic therapy (epinephrine + thermal or mechanical) outperforms single therapy. H2-antagonists are not useful as they have minimal impact on rebleeding. The restrictive transfusion strategy (threshold <80 g/L) showed better survival than liberal strategy in trials."
    difficulty: hard
    tags: [UGIB, management, endoscopy, PPI, octreotide, transfusion]
  - front: "What is the prognosis of UGIB from peptic ulcers, and what endoscopic predictors indicate high risk of rebleeding?"
    back: "80% stop spontaneously. Mortality is low (2%) unless rebleeding occurs (25% of patients, 10% mortality). High-risk endoscopic predictors: spurting/oozing blood, visible vessel, fibrin clot (Forrest class Ia, Ib, IIa). Patients with clean ulcer base and no comorbidities can be discharged after endoscopy.\n\nIdentifying high-risk endoscopic stigmata allows risk stratification and guides the decision to admit vs discharge. High-dose IV PPI for 72h post-endoscopy is recommended for high-risk lesions that have been treated endoscopically."
    difficulty: medium
    tags: [UGIB, prognosis, rebleeding, Forrest, PPI]
  - front: "What is the risk of variceal bleeding and rebleeding, and what is the initial management of variceal hemorrhage?"
    back: "Bleeding risk: 30% in 1st year. Rebleeding risk: 50–70% (20% mortality at 6 weeks). Management: (1) Hemodynamic stabilization and resuscitation. (2) IV octreotide (splanchnic vasoconstriction, decreases portal pressure). (3) Broad-spectrum antibiotics (e.g. ceftriaxone — lowers sepsis and SBP risk, reduces rebleed rate and mortality). (4) Endoscopic variceal ligation (EVL) or sclerotherapy.\n\nEarly empirical antibiotics are strongly recommended as soon as variceal bleeding is suspected — they reduce infectious complications and rebleeding mortality. Octreotide decreases portal collateral circulation. EVL is preferred over sclerotherapy for esophageal varices."
    difficulty: hard
    tags: [esophageal varices, variceal bleeding, octreotide, EVL, antibiotics, portal hypertension]
  - front: "What is a Mallory-Weiss tear, and how is it managed?"
    back: "Longitudinal laceration in the gastric mucosa on the lesser curvature near the GE junction, caused by rapid increases in gastric pressure from retching/vomiting against a closed glottis. Often associated with hiatus hernia. Classically: hematemesis following an episode of retching without blood. Management: 90% stop spontaneously; if persistent — endoscopy with epinephrine injection + clips or surgical repair.\n\nThe classical history of initial retching without blood followed by hematemesis distinguishes Mallory-Weiss tear from other UGIB causes. The tear is caused by the pressure differential during forceful vomiting. Spontaneous resolution is the rule."
    difficulty: easy
    tags: [Mallory-Weiss tear, UGIB, hematemesis, retching, endoscopy]
  - front: "What are the causes of lower GI bleeding (LGIB), and what is the mnemonic?"
    back: "Mnemonic CHAND: Colitis (radiation, infectious, ischemic, IBD — UC > CD), Hemorrhoids/fissure, Angiodysplasia, Neoplasm (polyps, post-polypectomy, cancer), Diverticular disease. Also includes vascular malformations (AVM).\n\nDiverticular bleeding is the most common cause of significant LGIB (painless, acute hematochezia, 80% resolve spontaneously). Angiodysplasia is common in elderly patients. Hemorrhoids are the most common cause of minor rectal bleeding."
    difficulty: easy
    tags: [LGIB, lower GI bleeding, CHAND, diverticular, angiodysplasia]
  - front: "What is the initial investigation of choice for lower GI bleeding, and when should angiography be considered?"
    back: "Initial investigation of choice: colonoscopy. If bleeding is severe or ongoing, consider radionuclide imaging or angiography (requires estimated bleeding rate >0.5 cc/min for angiography). Always exclude upper GI source before localizing to lower GI tract.\n\nUpper GI source must be excluded first as brisk UGIB can present as hematochezia. Colonoscopy identifies the bleeding site and allows therapeutic intervention. Radionuclide scan is more sensitive than angiography but cannot guide treatment."
    difficulty: medium
    tags: [LGIB, colonoscopy, angiography, hematochezia, management]
  - front: "What are the features of diverticular bleeding?"
    back: "Painless hematochezia with acute onset. Stool ranges from bright red to dark maroon; gelatinous clots often mixed in. Bleeding is most common from the right colon (thinner walled). 80% resolve spontaneously. Due to herniation of diverticula exposing vasa recta.\n\nThe painless nature differentiates diverticular bleeding from ischemic or inflammatory causes. Right-sided diverticular bleeding explains why the blood can be maroon rather than bright red. Colonoscopy rarely identifies the specific bleeding site."
    difficulty: medium
    tags: [diverticular bleeding, LGIB, hematochezia, right colon]
  - front: "What are the main liver function tests (LFTs), what do they reflect, and how should an elevated PT/INR be interpreted?"
    back: "PT/INR: hepatic protein synthesis (all coagulation factors except VIII); elevated with hepatocellular dysfunction or vitamin K deficiency. Serum albumin: hepatic protein synthesis; decreased by hepatocellular dysfunction, malnutrition, renal/GI losses, inflammation, malignancy. Direct bilirubin: hepatic excretion; increased with liver dysfunction (conjugation preserved even in end-stage liver failure). PT/INR corrects with vitamin K if deficiency is the cause, but NOT if due to hepatocellular dysfunction.\n\nDistinguishing vitamin K deficiency from hepatocellular dysfunction via PT/INR response to vitamin K administration is clinically important. Factor VIII is synthesized in the endothelium (not just liver), so it is NOT decreased in cirrhosis — this is why bleeding risk does not correlate closely with INR in cirrhosis."
    difficulty: hard
    tags: [liver function tests, PT/INR, albumin, bilirubin, hepatocellular function]
  - front: "How do you interpret a hepatocellular vs. cholestatic pattern on liver enzyme testing?"
    back: "Hepatocellular: elevated ALT and AST (both elevated highly suggestive of liver injury). Cholestatic: elevated ALP and GGT (if ALP elevated alone, rule out bone disease by fractionating ALP and/or checking GGT). If ALP elevation is disproportionate to ALT/AST elevation, consider: obstruction of CBD (pancreatic cancer, stones, cholangiocarcinoma, sclerosing cholangitis), destruction of microscopic ducts (PBC), bile acid transporter defects (drugs, intrahepatic cholestasis of pregnancy), liver infiltration (metastases, lymphoma, granulomas, amyloid).\n\nGGT is used to confirm hepatic origin of elevated ALP (as ALP also comes from bone, placenta, intestine). ALT is more liver-specific than AST. In acute biliary obstruction from a stone, a hepatocellular pattern may predominate initially as ALP is an inducible enzyme that takes time to rise."
    difficulty: hard
    tags: [liver enzymes, ALT, AST, ALP, GGT, cholestasis, hepatocellular]
  - front: "What causes transaminases >1000 U/L?"
    back: "Viral hepatitis, drugs/toxins (especially acetaminophen overdose), autoimmune hepatitis, hepatic ischemia ('shock liver'), and less commonly, acute biliary obstruction from a common bile duct stone.\n\nMarkedly elevated transaminases (>1000) typically indicate acute hepatocellular necrosis. Alcoholic hepatitis usually causes a more modest rise (typically AST <300) with AST:ALT ratio >2:1. The pattern helps narrow the differential."
    difficulty: medium
    tags: [transaminases, ALT, AST, hepatocellular necrosis, differential diagnosis]
  - front: "What is the AST:ALT ratio pattern in alcoholic hepatitis vs. other hepatitis causes?"
    back: "ALT > AST: most causes of hepatitis (viral, autoimmune, drug-induced, MASLD). AST > ALT (ratio typically >2:1): alcoholic liver disease or other causes that have progressed to advanced cirrhosis. AST in alcoholic hepatitis is usually <300 U/L.\n\nThe AST:ALT ratio >2 in alcoholic hepatitis is due to alcohol-induced mitochondrial damage (where AST localizes) and pyridoxine deficiency (which is required for ALT synthesis more than AST). This pattern is a useful clinical clue."
    difficulty: medium
    tags: [AST, ALT, ratio, alcoholic hepatitis, liver disease]
  - front: "What are the clinical features of acute viral hepatitis?"
    back: "Most are subclinical. Flu-like prodrome 1–2 weeks before jaundice: N/V, anorexia, headaches, fatigue, myalgia, low-grade fever, arthralgia, urticaria. Only some progress to icteric phase (lasting days to weeks): pale stools and dark urine 1–5 days prior to jaundice, hepatomegaly with RUQ pain, splenomegaly and cervical lymphadenopathy (10–20%).\n\nThe prodrome reflects systemic immune activation. Pale stools (acholic) and dark urine indicate conjugated hyperbilirubinemia (intrahepatic cholestasis). Not all patients develop jaundice — subclinical infection is common, especially in children."
    difficulty: easy
    tags: [acute viral hepatitis, clinical features, jaundice, prodrome]
  - front: "What investigations are done in acute viral hepatitis and what are poor prognostic indicators?"
    back: "Investigations: AST and ALT (>10–20x normal in hepatocellular necrosis), ALP minimally elevated, viral serology (anti-HAV IgM, anti-HBc IgM). Poor prognostic indicators: comorbidities, persistently high bilirubin (>340 mmol/L), increased INR, decreased albumin, hypoglycemia. Indications for hospitalization: encephalopathy, coagulopathy, severe vomiting, hypoglycemia.\n\nMarkedly elevated bilirubin, prolonged INR, and hypoglycemia reflect failing hepatic synthetic function. Coagulopathy in the context of acute hepatitis implies significant hepatocellular necrosis and risk of acute liver failure."
    difficulty: medium
    tags: [acute viral hepatitis, investigations, prognosis, ALF, hospitalization]
  - front: "What are the key features of Hepatitis A Virus (HAV)?"
    back: "RNA picornavirus. Fecal-oral transmission. Incubation 4–6 weeks. Diagnosed by elevated transaminases + positive anti-HAV IgM. In children: characteristically asymptomatic. In adults: fatigue, nausea, arthralgia, fever, jaundice, hepatomegaly. Can cause ALF and death (<1–5%). Can relapse (rarely) but NEVER becomes chronic. Treatment: supportive. Preventable by vaccination (Havrix, 2 doses q6mo, or Twinrix combined). Post-exposure prophylaxis available.\n\nHAV's fecal-oral transmission makes it endemic in areas with poor sanitation. Unlike HBV and HCV, HAV never becomes chronic. The vaccine is recommended for travellers to endemic regions and high-risk groups."
    difficulty: easy
    tags: [Hepatitis A, HAV, fecal-oral, anti-HAV IgM, vaccination]
  - front: "Interpret the Hepatitis B serology pattern for: (a) Acute HBV, (b) Chronic HBe-Ag positive HBV, (c) Chronic HBe-Ag negative HBV, (d) Resolved infection, (e) Immunization."
    back: "(a) Acute HBV: HBsAg+, anti-HBs−, HBeAg+, anti-HBe−, anti-HBc IgM+. (b) Chronic HBeAg+: HBsAg+, anti-HBs−, HBeAg+, anti-HBe−, anti-HBc IgG+. (c) Chronic HBeAg−: HBsAg+, anti-HBs−, HBeAg−, anti-HBe+, anti-HBc IgG+. (d) Resolved: HBsAg−, anti-HBs+, HBeAg−, anti-HBe+, anti-HBc IgG+. (e) Immunization: HBsAg−, anti-HBs+, HBeAg−, anti-HBe−, anti-HBc−.\n\nAnti-HBc is the key marker distinguishing resolved infection from immunization (both have anti-HBs+). Anti-HBc IgM indicates acute infection. HBsAg positivity defines current infection. Anti-HBs is the protective antibody."
    difficulty: hard
    tags: [Hepatitis B, HBV serology, HBsAg, anti-HBs, HBeAg, anti-HBc]
  - front: "Describe the 4 phases of chronic hepatitis B infection."
    back: "1. Immune tolerance: very high HBV-DNA (>20,000 IU/mL), HBeAg+, normal ALT/AST; minimal liver damage; characteristic of perinatal infection. 2. Immune clearance (immunoactive): high HBV-DNA (>20,000 IU/mL), HBeAg+; immune attack causes liver damage, progressive fibrosis — benefits from treatment. 3. Chronic inactive (immune control): low HBV-DNA (<2,000 IU/mL), HBeAg−, anti-HBe+, normal ALT/AST; risk of reactivation with immunosuppression. 4. HBeAg-negative chronic hepatitis (immune escape): elevated HBV-DNA (>2,000 IU/mL), HBeAg− (pre-core mutant), anti-HBe+, elevated ALT/AST; progressive fibrosis — benefits from treatment.\n\nPhases 2 and 4 require treatment. Phase 3 patients need monitoring for reactivation, especially if receiving immunosuppressive therapy (e.g. corticosteroids, chemotherapy, biologics). Not all carriers progress through all phases."
    difficulty: hard
    tags: [chronic hepatitis B, HBV phases, immune tolerance, immune clearance, HBeAg]
  - front: "What are the indications for pharmacological treatment of chronic hepatitis B, and what drugs are used?"
    back: "Indications: (1) HBeAg+ with HBV-DNA >20,000 IU/mL and elevated ALT. (2) HBeAg− with HBV-DNA >2,000 IU/mL and elevated ALT ± stage ≥2 fibrosis. (3) Before immunosuppressive therapy (steroids, chemotherapy, biologics) to prevent flare. Treatment drugs: tenofovir (preferred), entecavir (preferred), lamivudine (not preferred — high resistance rate). Treatment goal: undetectable serum HBV-DNA.\n\nTenofovir and entecavir have high barrier to resistance and are first-line. Reducing HBV-DNA to undetectable levels reduces risk of cirrhosis, HCC, and liver-related death. HAV vaccination is also recommended if serology is negative."
    difficulty: hard
    tags: [chronic hepatitis B, treatment, tenofovir, entecavir, antiviral, HBV-DNA]
  - front: "Who should receive HCC surveillance in the context of hepatitis B, and what is the recommended test and interval?"
    back: "Ultrasound (U/S) every 6 months, especially for patients with: high serum HBV-DNA levels, cirrhosis, male sex, Asian men age >40, Asian women age >50, African descent age >20.\n\nHCC risk in HBV increases with age (surrogate for progressive fibrosis/cirrhosis) and with serum HBV-DNA levels. HCV and HBV treatment both lower HCC risk. Surveillance U/S allows detection at an early, potentially curable stage."
    difficulty: medium
    tags: [HCC surveillance, hepatitis B, ultrasound, cirrhosis, HBV]
  - front: "What is Hepatitis D virus (HDV), and what is the difference between coinfection and superinfection?"
    back: "HDV is a defective RNA virus requiring HBsAg for hepatocyte entry — it only infects patients with HBV. Coinfection: acquire HDV and HBV simultaneously (increased acute severity but HDV does NOT increase risk of chronic hepatitis). Superinfection: new HDV acquisition in a patient with chronic HBV (increases progression to cirrhosis, can cause ALF). Treatment: low-dose interferon (20% response) and liver transplant for end-stage disease.\n\nThe distinction between coinfection and superinfection is clinically important: superinfection has a worse prognosis because the patient already has established chronic HBV infection, allowing HDV to cause accelerated disease progression."
    difficulty: hard
    tags: [Hepatitis D, HDV, coinfection, superinfection, HBV, cirrhosis]
  - front: "What are the key features of Hepatitis C virus (HCV) including transmission, diagnosis, and treatment?"
    back: "RNA virus, 7 genotypes (genotype 1 most common in North America). Blood-borne transmission; sexual transmission is 'inefficient'. Major risk factor: injection drug use. Other risks: blood transfusion before 1992, tattoos, intranasal cocaine use. Diagnosis: elevated ALT/AST + anti-HCV (screening), confirmed by detectable HCV-RNA in serum. Note: normal enzymes do NOT rule out active disease or advanced fibrosis. Treatment: direct-acting antivirals (DAAs) — glecaprevir/pibrentasvir (Maviret) or sofosbuvir/velpatasvir (Epclusa); check for HBV before starting DAAs (risk of HBV reactivation).\n\nHCV is now curable in >95% of patients with 8–12 weeks of pan-genotypic DAA therapy. Importantly, normal liver enzymes can occur with chronic HCV, so clinical suspicion should drive serology testing regardless of enzyme levels."
    difficulty: medium
    tags: [Hepatitis C, HCV, DAA, glecaprevir, sofosbuvir, injection drug use]
  - front: "What is the prognosis of Hepatitis C and what extrahepatic complications can occur?"
    back: "70–80% of acute HCV becomes chronic; of these, 20% develop cirrhosis within 20 years. Risk of HCC if cirrhotic. Extrahepatic: cryoglobulinemia, membranoproliferative glomerulonephritis, B-cell non-Hodgkin lymphoma.\n\nHCV is unique among hepatitis viruses in that it is often asymptomatic in the acute phase, leading to undiagnosed chronicity. The extrahepatic manifestations reflect immune complex deposition and B-cell dysregulation driven by chronic viral infection."
    difficulty: medium
    tags: [Hepatitis C, HCV, prognosis, cirrhosis, cryoglobulinemia, lymphoma]
  - front: "What is autoimmune hepatitis (AIH), what are the key diagnostic features, and how is it treated?"
    back: "Chronic inflammatory liver disease from loss of tolerance to liver antigens. Diagnosis of exclusion (rule out viral, drug/alcohol, metabolic, genetic causes). 40% mortality at 6 months without treatment. Key features: hypergammaglobulinemia (elevated IgG), positive ANA and/or anti-smooth muscle antibody (SMA), anti-LKM (especially in children), false-positive anti-HCV, biopsy showing periportal (zone 1) interface inflammation and necrosis. Extrahepatic: sicca, Raynaud's, thyroiditis, Sjogren's, arthralgias. Treatment: corticosteroids (80% respond) + azathioprine (prevents relapse during steroid taper).\n\nAIH can overlap with PSC and PBC. Azathioprine is added to allow steroid tapering — most patients relapse if steroids are withdrawn without azathioprine. Anti-LKM is more common in children (Type 2 AIH) while ANA/SMA characterize Type 1 AIH."
    difficulty: hard
    tags: [autoimmune hepatitis, AIH, ANA, anti-smooth muscle, azathioprine, corticosteroids]
  - front: "What are the two types of hepatotoxins (predictable vs. idiosyncratic), and give examples of each?"
    back: "Predictable (intrinsic): dose-dependent, short latency (hours to days), host factors not important. Examples: acetaminophen, CCl4. Idiosyncratic: not dose-dependent, longer latency (weeks to months), host factors very important. Examples: phenytoin, isoniazid (INH).\n\nMost drug-induced liver injury is idiosyncratic, making it unpredictable. Acetaminophen is the major exception — it causes predictable hepatotoxicity above threshold doses (10–15 g in healthy individuals, 4–6 g in those with depleted glutathione from alcohol use disorder, malnutrition, or anticonvulsant use)."
    difficulty: medium
    tags: [drug-induced liver injury, DILI, acetaminophen, isoniazid, hepatotoxins]
  - front: "What are the key drug-induced liver injury patterns for isoniazid (INH), methotrexate (MTX), chlorpromazine, and amiodarone?"
    back: "INH: 20% develop elevated transaminases, <1% clinically significant disease; susceptibility increases with age (idiosyncratic hepatotoxicity). MTX: causes fibrosis/cirrhosis; risk increased with obesity, DM, alcoholism (pre-existing fatty liver); develops without symptoms or enzyme changes — may need biopsy in long-term use. Chlorpromazine: cholestasis in 1% after 4 weeks, often with fever, rash, jaundice, pruritus, eosinophilia. Amiodarone: can cause same histology and clinical outcome as alcoholic hepatitis.\n\nAntimicrobials are the most common overall class causing drug-induced liver injury (amoxicillin-clavulanate, INH, nitrofurantoin, TMP-SMX). MTX hepatotoxicity is silent — routine LFTs are unreliable for monitoring; cumulative dose guides decision for biopsy."
    difficulty: hard
    tags: [drug-induced liver injury, isoniazid, methotrexate, chlorpromazine, amiodarone, DILI]
  - front: "Compare the hepatitis viruses: which have RNA vs DNA genomes, which are fecal-oral vs parenteral, and which cause chronic infection?"
    back: "DNA: HBV. RNA: HAV, HCV, HDV, HEV, CMV (DNA), EBV (DNA). Fecal-oral: HAV, HEV. Parenteral/sexual: HBV, HCV, HDV. Chronicity: None (HAV, HEV). HBV: 5% adults, 90% infants. HCV: 70–80%. HDV: 5%. CMV/EBV: common latent infections.\n\nThe route of transmission drives prevention strategies. HAV and HEV prevention relies on hygiene and vaccination; HBV/HCV/HDV requires blood and body fluid precautions. Chronicity risk is inversely related to age at HBV acquisition (reflects immune maturity)."
    difficulty: medium
    tags: [viral hepatitis, comparison, chronicity, transmission, HAV HBV HCV HDV HEV]
  - front: "What are the unique features of Hepatitis E virus (HEV)?"
    back: "RNA calicivirus. Fecal-oral transmission. Endemic in Africa, Asia, Central America, India, Pakistan. Incubation 2–8 weeks. Acute onset. Does NOT cause chronic infection. Mortality: 1–2% overall, but 10–20% in pregnancy (third trimester). Serology: anti-HEV IgG/IgM. No vaccine available.\n\nHEV is particularly dangerous in pregnancy, especially in the third trimester, where it can cause fulminant hepatic failure with up to 20% mortality. This makes it an important consideration in pregnant travellers returning from endemic regions."
    difficulty: medium
    tags: [Hepatitis E, HEV, pregnancy, fecal-oral, endemic]
  - front: "What are the diagnostic tests used for specific liver diseases (quick reference)?"
    back: "Viral hepatitis: anti-HAV IgM, HBsAg, anti-HCV. Autoimmune hepatitis: ANA, SMA (anti-smooth muscle antibody), anti-LKM, IgG levels. Wilson's disease: ceruloplasmin, liver biopsy. Hereditary hemochromatosis: iron saturation, ferritin, HFE genetic testing. Alpha-1-antitrypsin deficiency: alpha-1-antitrypsin levels, genotyping, liver biopsy. Drug-induced liver injury: careful medication history, liver biopsy. MASLD: uric acid, metabolic testing, liver biopsy after excluding other causes.\n\nThe diagnostic approach to liver disease starts with identifying the pattern (hepatocellular vs. cholestatic) then using targeted serologic tests. Liver biopsy remains the gold standard for fibrosis staging but non-invasive tests (FibroScan) are increasingly used."
    difficulty: medium
    tags: [liver disease, diagnostic tests, autoimmune hepatitis, Wilsons, hemochromatosis, alpha-1-antitrypsin]
  - front: "What is the DDx for hepatomegaly?"
    back: "Congestive: right heart failure, Budd-Chiari syndrome. Malignant: primary (HCC), secondary (metastases), lymphoproliferative disease, leukemia. Benign: fatty liver, cysts, hemochromatosis, extramedullary hematopoiesis, amyloid. Infectious: viral hepatitis, tuberculosis, abscess, echinococcus. Inflammatory: granulomas (sarcoidosis), histiocytosis X.\n\nA systematic approach to hepatomegaly uses CMIBI categories. Congestive hepatomegaly from right heart failure often presents with tender hepatomegaly and elevated JVP. Budd-Chiari (hepatic vein thrombosis) can present acutely with RUQ pain and ascites."
    difficulty: medium
    tags: [hepatomegaly, differential diagnosis, Budd-Chiari, HCC, right heart failure]
  - front: "What is the approach to iron deficiency anemia with a GI source, and when is wireless capsule endoscopy indicated?"
    back: "If overt GI bleeding (hematochezia or melena): upper and lower endoscopy. Rule out non-GI sources (menorrhagia, hemolysis). If source found — treat. If no source found: wireless endoscopy capsule or double balloon endoscopy for small bowel. If overt bleeding is hemodynamically significant (estimated >0.5 cc/min): angiography. CT enterography if capsule/double balloon not available.\n\nWireless capsule endoscopy is the investigation of choice for suspected small bowel bleeding after negative upper and lower endoscopy. It helps localize the lesion to guide double balloon enteroscopy for therapeutic intervention."
    difficulty: hard
    tags: [iron deficiency anemia, GI bleeding, capsule endoscopy, double balloon enteroscopy, angiography]
  - front: "What is the venous drainage of the GI tract, and where does it ultimately drain?"
    back: "GI venous blood drains into the portal vein, which receives:\n- Superior mesenteric vein (SMV): drains small bowel and right colon\n- Splenic vein: drains spleen, stomach; receives the inferior mesenteric vein (IMV) which drains left colon and rectum\n- Left gastric (coronary) vein, right gastric vein, cystic vein, and paraumbilical veins\nThe portal vein drains to the liver via the hepatic sinusoids, then to hepatic veins → inferior vena cava.\n\nPortal hypertension causes reversal of flow in portosystemic anastomoses (e.g., esophageal varices from left gastric-azygos, caput medusae from paraumbilical veins, anorectal varices from superior rectal-middle/inferior rectal). Understanding portal venous anatomy is essential for managing variceal bleeding and planning liver surgery."
    difficulty: medium
    tags: [anatomy, portal vein, venous drainage, portal hypertension]
  - front: "How do you differentiate hepatocellular jaundice from obstructive (cholestatic) jaundice biochemically?"
    back: "Hepatocellular jaundice: elevated bilirubin + elevated ALT/AST\nObstructive/cholestatic jaundice: elevated bilirubin + elevated ALP/GGT + duct dilatation on biliary ultrasound\nHemolytic jaundice: decreased haptoglobin + elevated LDH (indirect hyperbilirubinemia)\n\nThis biochemical differentiation guides further investigation. Cholestatic jaundice with bile duct dilatation on ultrasound suggests mechanical obstruction (stone, stricture, malignancy) and warrants ERCP or MRCP. Hepatocellular pattern with elevated transaminases suggests viral hepatitis, drug toxicity, or alcoholic hepatitis."
    difficulty: easy
    tags: [jaundice, bilirubin, hepatocellular, cholestatic, biochemistry]
  - front: "What is the PREDESCI trial and its key findings regarding beta-blockers in cirrhosis?"
    back: "PREDESCI (Lancet 2019): randomized double-blind placebo-controlled trial of 201 patients with compensated cirrhosis and clinically significant portal hypertension (CSPH).\nIntervention: propranolol or carvedilol vs. placebo\nResult: Primary endpoint (decompensation or death) occurred in 16% of beta-blocker group vs. 27% placebo (HR 0.51, 95% CI 0.26-0.97, p=0.041)\nEffect driven by: reduced incidence of ascites (HR 0.42, p=0.03)\nConclusion: Long-term beta-blocker treatment increases decompensation-free survival in compensated cirrhosis with CSPH, mainly by reducing ascites.\n\nClinically significant portal hypertension (HVPG ≥10 mmHg) in compensated cirrhosis predicts decompensation. Beta-blockers (especially carvedilol) reduce portal pressure by decreasing cardiac output (β1) and splanchnic vasoconstriction (β2/α1 for carvedilol). This trial supports primary prophylaxis with beta-blockers before the first decompensating event (ascites, variceal bleed, hepatic encephalopathy)."
    difficulty: hard
    tags: [cirrhosis, portal hypertension, beta-blockers, PREDESCI, clinical trial]
  - front: "What are the major risk factors for cholangiocarcinoma?"
    back: "Ages 50-70, gallstones, ulcerative colitis (UC), primary sclerosing cholangitis (PSC), choledochal cyst, Clonorchis sinensis (liver fluke), hepatolithiasis, Lynch syndrome, CF, BAP1 tumour predisposition syndrome.\n\nPSC is one of the most important risk factors for cholangiocarcinoma in Canada. The overall 5-year survival is poor: 30% localized, 24% regional, and only 2% for distant disease."
    difficulty: medium
    tags: [cholangiocarcinoma, risk factors, PSC, liver fluke]
  - front: "What is the surgical treatment for lower third vs. upper third cholangiocarcinoma?"
    back: "Upper third: duct resection + Roux-en-Y hepaticojejunostomy ± liver resection. Middle third (uncommon): duct resection + Roux-en-Y hepaticojejunostomy. Lower third: Whipple procedure (pancreaticoduodenectomy).\n\nResectability requires wide excision margins. Unresectable lesions are palliated with biliary stent or choledochojejunostomy (surgical bypass) plus chemotherapy and/or radiotherapy."
    difficulty: hard
    tags: [cholangiocarcinoma, surgery, Whipple, hepaticojejunostomy]
  - front: "A 55-year-old presents with painless progressive jaundice, pruritis, dark urine, and pale stools. CA 19-9 is elevated. What is the most likely diagnosis and what investigation best determines resectability?"
    back: "Cholangiocarcinoma. ERCP or percutaneous transhepatic cholangiography (PTC) or endoscopic U/S (EUS) is used to determine resectability and obtain biopsies.\n\nCholangiocarcinoma classically presents with gradual biliary obstruction symptoms. LFTs show an obstructive pattern. CT and U/S show dilated ducts. ERCP/PTC allows tissue sampling and assessment of extent of disease."
    difficulty: hard
    tags: [cholangiocarcinoma, jaundice, ERCP, resectability]
