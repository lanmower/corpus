# Adrenal Disorders & Cushing's (Endocrinology) - generated from srs-mccqe1
cards:
  - front: "A 45-year-old has hypertension, central obesity, moon face, buffalo hump, wide purple striae, and hyperglycemia. What is the diagnosis and screening test?"
    back: "Cushing syndrome; screen with: 24h urine free cortisol, late-night salivary cortisol (x2), or 1mg overnight dexamethasone suppression test (failure to suppress cortisol to <50 nmol/L)\n\nEndogenous Cushing syndrome most commonly from pituitary ACTH-secreting adenoma (Cushing disease, 65%). Distinguish ACTH-dependent (pituitary or ectopic ACTH) from independent (adrenal adenoma) with plasma ACTH. CRH stimulation and high-dose dexamethasone test to differentiate."
    difficulty: hard
    tags: [Cushing syndrome, cortisol, dexamethasone suppression test, ACTH, endocrinology]
  - front: "What is the approach to primary adrenal insufficiency (Addison disease)?"
    back: "Primary AI: low cortisol + elevated ACTH + hyponatremia + hyperkalemia + hyperpigmentation; diagnose with cosyntropin stimulation test (peak cortisol <500 nmol/L); treat with hydrocortisone + fludrocortisone\n\nAddison disease is most commonly autoimmune in developed countries. Adrenal crisis precipitated by illness/surgery/stress requires stress dosing. Patients must carry medical alert bracelet. Emergency management: IV hydrocortisone 100mg stat, IV fluids."
    difficulty: hard
    tags: [Addison disease, primary adrenal insufficiency, cortisol, hydrocortisone, fludrocortisone, endocrinology]
  - front: "A patient on prednisone 20mg/day for 6 months is having elective surgery. How should perioperative steroids be managed?"
    back: "Stress-dose corticosteroids: hydrocortisone 50-100mg IV q8h on day of surgery and taper to usual dose over 1-3 days depending on surgical stress (major surgery: 3-5 days)\n\nHPA axis suppression occurs after ≥4 weeks of ≥20mg/day prednisone equivalent. Adrenal crisis with perioperative hypotension is potentially fatal. Any dose of exogenous steroid for >3 weeks requires stress dosing for major procedures. Minor procedures require modest increases."
    difficulty: hard
    tags: [perioperative steroids, adrenal suppression, stress dose steroids, HPA axis, endocrinology]
  - front: "What is a pheochromocytoma and what is the pre-operative management?"
    back: "Catecholamine-secreting adrenal tumor causing hypertensive crises; diagnose with plasma free metanephrines; pre-operative management: alpha-blockade (phenoxybenzamine) ≥2 weeks, then beta-blockade, high-sodium diet\n\nPhenoxybenzamine (non-selective irreversible alpha-blocker) is standard pre-op preparation; alpha-1 selective blockers (doxazosin) also used. Never start beta-blocker before alpha-blocker — may cause hypertensive crisis (unopposed alpha stimulation). IV saline to expand volume pre-operatively."
    difficulty: hard
    tags: [pheochromocytoma, pre-operative management, phenoxybenzamine, alpha-blockade, endocrinology]
  - front: "How is secondary adrenal insufficiency differentiated from primary?"
    back: "Secondary (pituitary): low ACTH, low cortisol, NO hyperkalemia or hyperpigmentation (aldosterone axis intact); Primary (adrenal): high ACTH, low cortisol, hyperkalemia, hyperpigmentation\n\nSecondary AI: pituitary causes (ACTH deficiency), usually from long-term exogenous steroids causing HPA suppression, or pituitary tumor/surgery. No mineralocorticoid deficiency (aldosterone regulated by RAS). Treatment: hydrocortisone alone (no fludrocortisone needed)."
    difficulty: medium
    tags: [secondary adrenal insufficiency, ACTH, cortisol, pituitary, endocrinology]
  - front: "What is congenital adrenal hyperplasia (CAH) and what is the most common enzyme deficiency?"
    back: "CAH: autosomal recessive disorder of adrenal steroidogenesis; most common: 21-hydroxylase deficiency (90%): cortisol and aldosterone deficiency, excess androgens — virilization and salt-wasting in classic form\n\n21-hydroxylase deficiency: low cortisol → ACTH excess → adrenal hyperplasia → androgen excess. Classic salt-wasting: ambiguous genitalia in females, adrenal crisis in neonates. Treatment: glucocorticoid replacement suppresses ACTH and androgen excess. Newborn screening in Canada."
    difficulty: hard
    tags: [CAH, congenital adrenal hyperplasia, 21-hydroxylase, cortisol, endocrinology]
  - front: "What are the indications for adrenalectomy for an adrenal incidentaloma?"
    back: "Adrenalectomy for: functioning tumors (cortisol-secreting, pheochromocytoma, aldosteronoma), malignant features (>4cm, heterogeneous, irregular, >10 HU on unenhanced CT), rapid growth (>1cm/year)\n\nAdrenal incidentalomas found in ~5% of abdominal CT scans. All incidentalomas require biochemical screening: 1mg DST, plasma metanephrines, aldosterone/renin ratio (if hypertensive). Non-functioning adenomas <4cm: repeat CT in 6-12 months, then annually for 3 years."
    difficulty: medium
    tags: [adrenal incidentaloma, adrenalectomy, pheochromocytoma, functional adrenal tumor, endocrinology]
  - front: "What is Cushing syndrome diagnostic approach?"
    back: "Screen: 24h urine cortisol, 1mg dex suppression, late-night salivary cortisol. Two positive tests needed\n\nThen ACTH: low=adrenal. High=pituitary vs ectopic. High-dose dex + IPSS differentiates."
    difficulty: hard
    tags: [Cushing]
  - front: "What is the Cushing syndrome diagnostic workup?"
    back: "Screen (2 of 3 positive): 24h urine free cortisol, late-night salivary cortisol ×2, 1mg overnight DST (cortisol >50 = positive). Then ACTH: high→pituitary MRI±IPSS; low→adrenal CT.\n\nCushing disease = pituitary ACTH adenoma (70%). Ectopic ACTH (15%): SCLC, carcinoid. Adrenal (15%): adenoma/carcinoma. High-dose DST suppresses pituitary not ectopic. IPSS differentiates pituitary from ectopic."
    difficulty: hard
    tags: [adrenal, Cushing, DST, ACTH, endocrinology]
  - front: "What is primary adrenal insufficiency (Addison) and its diagnosis?"
    back: "Adrenal cortex destruction→cortisol+aldosterone+androgen deficiency. Features: fatigue, hypotension, hyperpigmentation, salt craving, hyperK, hypoNa. Diagnosis: cosyntropin stim test (250μg IV)→cortisol <500 at 30-60 min confirms.\n\nMost common cause in Canada: autoimmune (anti-21-hydroxylase Ab). Secondary AI: NO hyperpigmentation, NO hyperK (aldosterone intact). Treatment: hydrocortisone 15-25 mg/day + fludrocortisone 0.05-0.2 mg daily."
    difficulty: hard
    tags: [adrenal, Addison, cosyntropin, hydrocortisone, endocrinology]
  - front: "What is adrenal crisis management?"
    back: "Acute cortisol deficiency: refractory hypotension/shock, AMS, fever, abdominal pain, hyperK, hypoNa, hypoglycemia. Treatment: IV hydrocortisone 100 mg bolus then 50-100 mg q8h + aggressive IV NS. Do NOT delay for diagnostics.\n\nPrecipitants: stress in undiagnosed/under-replaced AI, steroid withdrawal, bilateral adrenal hemorrhage (Waterhouse-Friderichsen). Dexamethasone 4 mg IV if diagnosis uncertain (doesn't interfere with cosyntropin test)."
    difficulty: hard
    tags: [adrenal, crisis, emergency, hydrocortisone, endocrinology]
  - front: "How is pheochromocytoma diagnosed and managed perioperatively?"
    back: "Screen: plasma free metanephrines (most sensitive). Localize: CT/MRI abdomen. Pre-op: alpha blockade first (phenoxybenzamine/doxazosin) ×10-14 days, THEN beta blockade. Never beta-block first (unopposed alpha→crisis). Genetic testing for all (~40% hereditary).\n\nRule of 10s outdated. Associated with MEN2, VHL, SDH mutations. Intraoperative: sodium nitroprusside or phentolamine for hypertensive crisis. Post-op: monitor for hypotension (loss of catecholamine drive) and hypoglycemia."
    difficulty: hard
    tags: [adrenal, pheochromocytoma, metanephrines, alpha blockade, endocrinology]
  - front: "What is primary hyperaldosteronism screening and confirmation?"
    back: "Screen (ARR) if: resistant HTN, hypoK, adrenal incidentaloma. Confirm: salt loading test or fludrocortisone suppression. Differentiate: CT + adrenal vein sampling. Unilateral adenoma→adrenalectomy. Bilateral hyperplasia→spironolactone/eplerenone.\n\nConn syndrome = 5-10% of hypertension. Stop interfering drugs before ARR (spironolactone 6 weeks). Adrenalectomy cures HTN in ~50% of unilateral cases."
    difficulty: hard
    tags: [adrenal, hyperaldosteronism, ARR, Conn, endocrinology]
  - front: "What is the approach to adrenal incidentaloma?"
    back: "4-5% of CT scans. Assess: 1) Function: plasma metanephrines (pheo), 1mg DST (Cushing), ARR if hypertensive. 2) Malignancy: >4cm, HU >10, irregular→surgery. HU <10 on non-contrast CT = benign adenoma (~100%).\n\nMetastases common in known extra-adrenal cancer — biopsy only if changes management (rule out pheo first!). Follow-up: repeat imaging 6-12 months, repeat functional testing annually ×4 years."
    difficulty: hard
    tags: [adrenal, incidentaloma, CT, Hounsfield, endocrinology]
  - front: "What is CAH and its most common form?"
    back: "21-hydroxylase deficiency (>90%): AR. Classic: salt-wasting crisis in neonates + female virilization. Non-classic: hirsutism/oligomenorrhea in women. Diagnosis: elevated 17-OHP. Treatment: hydrocortisone + fludrocortisone (salt-wasting). Newborn screening in all Canadian provinces.\n\nCortisol deficiency→ACTH excess→adrenal hyperplasia→androgen excess. Stress dosing needed during illness. Non-classic: low-dose dexamethasone or OCP for hirsutism."
    difficulty: hard
    tags: [adrenal, CAH, 21-hydroxylase, 17-OHP, endocrinology]
  - front: "What are sick day/stress dose steroid rules?"
    back: "Minor illness: double/triple oral hydrocortisone ×2-3 days. Moderate stress: 50 mg IM/IV pre-procedure. Major surgery: 100 mg IV q8h, taper post-op. Vomiting: IM hydrocortisone 100 mg + ER.\n\nAll AI patients need MedicAlert + emergency IM hydrocortisone kit. Family trained for injection. Also applies to chronic steroid users (≥5mg prednisone ×3+ weeks). Failure to stress dose→adrenal crisis."
    difficulty: hard
    tags: [adrenal, stress dose, sick day, hydrocortisone, endocrinology]
  - front: "What is secondary adrenal insufficiency from exogenous steroids?"
    back: "Most common cause of AI. HPA suppression after ≥3 weeks prednisone ≥5 mg/day. Taper 10-20% q1-2 weeks. At physiologic dose, check morning cortisol or cosyntropin test. NO hyperpigmentation, NO hyperK (aldosterone intact).\n\nEven inhaled/topical steroids in high doses can suppress HPA, especially in children. Recovery takes weeks-months. Stress dosing needed until HPA axis recovery confirmed."
    difficulty: hard
    tags: [adrenal, secondary, steroid withdrawal, HPA, endocrinology]
  - front: "What are MEN syndromes?"
    back: "MEN1 (3Ps): Parathyroid + Pituitary + Pancreatic NET (menin gene). MEN2A: MTC + Pheo + Hyperparathyroidism (RET). MEN2B: MTC + Pheo + Mucosal neuromas + Marfanoid (RET, no HPT).\n\nRET mutation carriers: prophylactic thyroidectomy (timing by mutation risk). Always screen for pheo before any surgery. MEN1: screen for gastrinoma, insulinoma, prolactinoma."
    difficulty: hard
    tags: [adrenal, MEN, MEN1, MEN2, RET, endocrinology]
  - front: "What is the workup for an adrenal incidentaloma?"
    back: "All: 1mg overnight dexamethasone suppression test (Cushing), plasma metanephrines (pheo), aldosterone/renin ratio if hypertensive (Conn). If >4cm or suspicious features: surgical referral\n\nPrevalence 4-5% on CT. Most are non-functioning adenomas. Imaging features of concern: >4cm, irregular margins, >10 HU on unenhanced CT, interval growth. Follow with repeat imaging at 6-12 months if <4cm."
    difficulty: hard
    tags: [adrenal incidentaloma, workup]
  - front: "An adrenal incidentaloma is found on CT. What is the workup algorithm?"
    back: "All adrenal incidentalomas require two assessments: 1) FUNCTIONAL workup (rule out hormone excess): Pheochromocytoma: 24h urine metanephrines or plasma free metanephrines (MUST rule out first — hypertensive crisis risk); Cushing syndrome: 1 mg overnight dexamethasone suppression test (cortisol <50 nmol/L is normal); Primary aldosteronism (if hypertensive): aldosterone-to-renin ratio; Sex hormones: DHEA-S if virilization signs. 2) MALIGNANCY assessment: Size: <4 cm with benign features (homogeneous, lipid-rich, <10 HU on unenhanced CT) — likely adenoma; >4 cm, irregular, >20 HU, heterogeneous — concerning for malignancy; >6 cm — consider surgical excision. Follow-up: repeat imaging at 6-12 months for stable incidentalomas; repeat functional testing annually for 5 years.\n\nAdrenal incidentalomas are found in ~5% of abdominal CT scans. The most important step is ruling out pheochromocytoma (even in normotensive patients) because undiagnosed pheo can cause fatal hypertensive crisis during surgery or anesthesia. Canadian Endocrine Society guidelines follow European Society of Endocrinology recommendations for workup and follow-up protocols."
    difficulty: hard
    tags: [adrenal incidentaloma, pheochromocytoma, Cushing, aldosteronism, endocrinology]
  - front: "What is the approach to a patient with suspected pheochromocytoma?"
    back: "Classic triad: episodic headache, diaphoresis, palpitations/tachycardia (+ hypertension — often paroxysmal). The '10% rule': 10% bilateral, 10% extra-adrenal (paraganglioma), 10% malignant, 10% familial (MEN2A/2B, VHL, NF1, SDH mutations — actually 30-40% are hereditary). Diagnosis: plasma free metanephrines (most sensitive screening test — >99% sensitivity) or 24h urine metanephrines/catecholamines. Imaging: CT or MRI abdomen/pelvis after biochemical confirmation. Management: alpha-blockade FIRST (phenoxybenzamine or doxazosin for 10-14 days), THEN beta-blockade (propranolol — NEVER beta-block first → unopposed alpha stimulation → hypertensive crisis), volume expansion with salt/fluid loading, then surgical resection. Genetic testing recommended for all patients.\n\nThe rule 'alpha before beta' is critical and commonly tested — beta-blockade alone removes beta-2 vasodilation, leaving unopposed alpha vasoconstriction causing severe hypertension. Phenoxybenzamine is an irreversible alpha-blocker preferred preoperatively. Canadian Endocrine Society recommends genetic testing for all pheochromocytoma patients given the high rate of hereditary syndromes."
    difficulty: hard
    tags: [pheochromocytoma, metanephrines, alpha-blockade, MEN2, endocrinology]
  - front: "How is primary aldosteronism (Conn syndrome) diagnosed as part of the adrenal incidentaloma workup?"
    back: "Suspect if: hypertension (especially resistant), hypokalemia (but most patients are normokalemic), adrenal incidentaloma. Screening: aldosterone-to-renin ratio (ARR) — elevated aldosterone with suppressed renin (ARR >100 pmol/L per ng/mL/h, or equivalent cutoffs depending on assay). Prepare: hold interfering medications (spironolactone 6 weeks, ACEi/ARB/beta-blockers 2 weeks if possible; use alpha-blockers/verapamil for BP control during testing). Confirmatory testing: oral sodium loading test, IV saline infusion test, or fludrocortisone suppression test (aldosterone fails to suppress). Subtype differentiation: adrenal CT + adrenal vein sampling (AVS) to lateralize — unilateral adenoma (Conn): laparoscopic adrenalectomy; bilateral hyperplasia (more common): mineralocorticoid receptor antagonist (spironolactone or eplerenone).\n\nPrimary aldosteronism is the most common cause of secondary hypertension (~5-10% of hypertensive patients). Adrenal vein sampling is essential before surgery because CT alone misclassifies ~40% of cases. Canadian Hypertension Education Program (CHEP/Hypertension Canada) guidelines recommend screening for primary aldosteronism in resistant hypertension."
    difficulty: hard
    tags: [primary aldosteronism, Conn syndrome, ARR, adrenal vein sampling, endocrinology]
  - front: "What is the workup for Cushing syndrome as part of adrenal incidentaloma evaluation?"
    back: "Screening tests (need 2+ positive for diagnosis): 1) 1 mg overnight dexamethasone suppression test (DST): give 1 mg dexa at 11 PM, measure 8 AM cortisol — normal suppression <50 nmol/L (1.8 μg/dL); 2) 24h urine free cortisol (×2 collections — elevated >3× upper limit suggests Cushing); 3) Late-night salivary cortisol (×2 — loss of diurnal variation). Localization after confirming Cushing syndrome: ACTH level — ACTH-independent (low ACTH): adrenal source (adenoma, carcinoma); ACTH-dependent (normal-high ACTH): pituitary (Cushing disease, 70%) or ectopic (lung small cell, carcinoid). High-dose DST and inferior petrosal sinus sampling (IPSS) differentiate pituitary from ectopic. For adrenal incidentaloma: subclinical Cushing (autonomous cortisol secretion without classic features) is common — may warrant surgery if associated comorbidities (diabetes, hypertension, osteoporosis).\n\nThe 1 mg overnight DST is the preferred screening test for adrenal incidentalomas. False positives occur with depression, alcoholism, obesity, OCP use, and medications that increase dexamethasone metabolism (phenytoin, rifampin). Canadian Endocrine Society guidelines recommend monitoring adrenal incidentalomas for subclinical cortisol excess annually."
    difficulty: hard
    tags: [Cushing syndrome, dexamethasone suppression, ACTH, adrenal, endocrinology]
  - front: "Phenoxybenzamine is used in pheochromocytoma pre-operatively. What type of receptor antagonism does it produce and why is it particularly useful?"
    back: "Phenoxybenzamine is an irreversible non-competitive (allosteric) antagonist at adrenergic receptors. It forms a covalent bond, providing sustained blockade that cannot be overcome by surges in catecholamine release during pheochromocytoma manipulation.\n\nNon-competitive antagonists bind to an allosteric site distinct from the active site, reducing maximal agonist effect and lowering the Emax without shifting the EC50. The irreversible covalent bond makes phenoxybenzamine ideal for sustained alpha-blockade in pheochromocytoma."
    difficulty: hard
    tags: [pharmacodynamics, non-competitive antagonism, phenoxybenzamine, pheochromocytoma, adrenergic]
  - front: "What skin manifestations are seen in Addison's disease (primary adrenal insufficiency)?"
    back: "Generalized hyperpigmentation or limited to skin folds, buccal mucosa, and scars due to excess ACTH and MSH stimulation.\n\nIn primary adrenal insufficiency, low cortisol leads to elevated ACTH, which cross-reacts with MSH receptors causing hyperpigmentation. The buccal mucosa and scars are classic sites. Secondary adrenal insufficiency does NOT cause hyperpigmentation."
    difficulty: medium
    tags: [Addisons disease, hyperpigmentation, adrenal insufficiency]
  - front: "What skin manifestation is associated with Cushing's syndrome?"
    back: "Moon facies, purple (violaceous) striae, acne, hirsutism, hyperpigmentation, atrophic skin with telangiectasias.\n\nPurple striae (>1 cm wide) in young patients are a classic feature of Cushing's syndrome. The skin atrophy is due to excess glucocorticoids inhibiting fibroblast activity. Screening is with 24-hour urinary free cortisol or overnight dexamethasone suppression test."
    difficulty: easy
    tags: [Cushings syndrome, purple striae, moon facies, cortisol]
  - front: "What are the major endocrine organs and their key hormones?"
    back: "Hypothalamus: CRH, GnRH, TRH, GHRH, ADH*, Oxytocin*. Anterior pituitary: GH, PRL, TSH, LH, FSH, ACTH. Posterior pituitary: ADH, Oxytocin. Thyroid: T3, T4. Parathyroid: PTH. Adrenal cortex: aldosterone, cortisol, androgens. Adrenal medulla: catecholamines. Pancreas: insulin, glucagon, somatostatin. Ovaries: estrogen, progesterone. Testes: testosterone. (*ADH and oxytocin are produced in the hypothalamus but stored in the posterior pituitary.)\n\nThe hypothalamic-pituitary axis is the master regulator of endocrine function. Releasing hormones from the hypothalamus stimulate or inhibit anterior pituitary hormone secretion, which in turn regulates peripheral gland hormone production (classic negative feedback loops). ADH and oxytocin are synthesized in hypothalamic nuclei and transported axonally to the posterior pituitary for release."
    difficulty: easy
    tags: [endocrine system, hypothalamus, pituitary, hormones, anatomy]
  - front: "What is ACTH (adrenocorticotropic hormone) and what are its key features?"
    back: "ACTH is a polypeptide cleaved from the prohormone POMC, secreted in a pulsatile fashion from the anterior pituitary with diurnal variability (peak 0200–0400 h; trough 1800–2400 h). It stimulates adrenal cortex growth and release of glucocorticoids, adrenal androgens, and (to a very limited extent) mineralocorticoids.\n\nACTH secretion is regulated by CRH and AVP from the hypothalamus. Importantly, ACTH can directly bind MSH receptors on melanocytes, enhancing melanogenesis — explaining hyperpigmentation in primary adrenal insufficiency where ACTH is very high."
    difficulty: easy
    tags: [ACTH, pituitary, adrenal, POMC, diurnal]
  - front: "What are the three zones of the adrenal cortex and what hormones does each produce?"
    back: "Zona glomerulosa → mineralocorticoids (aldosterone); Zona fasciculata → glucocorticoids (cortisol); Zona reticularis → sex steroids (DHEA, androstenedione).\n\nMnemonic: 'GFR' (glomerulosa, fasciculata, reticularis) — Salt, Sugar, Sex. The zona glomerulosa is regulated by RAAS; the fasciculata and reticularis are regulated by ACTH."
    difficulty: easy
    tags: [adrenal cortex, aldosterone, cortisol, DHEA, steroidogenesis]
  - front: "How is aldosterone regulated and what are its physiological effects?"
    back: "Aldosterone is regulated by the RAAS and hyperkalemia. It acts on the distal tubule Na+/K+ ATPase to cause Na+ (and Cl−) retention and K+ (and H+) excretion, expanding extracellular fluid volume.\n\nNegative feedback to the JGA occurs via long loop (aldosterone + volume expansion) and short loop (angiotensin II + peripheral vasoconstriction). Dopamine and prostaglandins also modulate renin release."
    difficulty: easy
    tags: [aldosterone, RAAS, mineralocorticoid, potassium, JGA]
  - front: "What are the stimulatory and inhibitory physiological effects of glucocorticoids (cortisol)?"
    back: "Stimulatory: hepatic gluconeogenesis, insulin resistance in peripheral tissues, protein catabolism, leukocytosis/lymphopenia, increased cardiac output/vascular tone/Na+ retention, increased PTH release and urine calcium excretion. Inhibitory: bone formation (stimulates resorption), fibroblasts/collagen, inflammation/cell-mediated immunity, GH axis*, reproductive axis*, vitamin D3/calcium uptake. (*Only with excess cortisol.)\n\nThese effects explain the clinical manifestations of Cushing's syndrome (hyperglycemia, osteoporosis, immunosuppression, HTN, central obesity) and are relevant to understanding steroid side effects in clinical practice."
    difficulty: medium
    tags: [glucocorticoids, cortisol, metabolism, immunosuppression, osteoporosis]
  - front: "What are the principal adrenal androgens and what is their main physiological role?"
    back: "Principal adrenal androgens: DHEA, androstenedione, and 11-hydroxyandrostenedione. They are regulated by ACTH and are primarily responsible for adrenarche (growth of axillary and pubic hair). Their proportion of total androgens (adrenal:gonadal) increases with age.\n\nAdrenal androgens are weak compared to gonadal testosterone but play a significant role in women's androgenic physiology. Elevated adrenal androgens are seen in CAH, adrenal tumours, and Cushing's disease."
    difficulty: easy
    tags: [adrenal androgens, DHEA, androstenedione, adrenarche, ACTH]
  - front: "How is the Cosyntropin (ACTH analogue) Stimulation Test performed and interpreted?"
    back: "Administer 250 mcg cosyntropin IV/IM; measure plasma cortisol before and at 30 and 60 min after. A physiologic response is stimulated plasma cortisol >500 nmol/L (>18 mcg/dL) at 30 or 60 min. An inappropriate response (peak cortisol <500 nmol/L) indicates adrenal insufficiency.\n\nThis test assesses glucocorticoid reserve. It is used to diagnose primary adrenal insufficiency (Addison's disease). The threshold may vary with newer assays; confirm with local lab. It does NOT reliably diagnose recent-onset secondary AI."
    difficulty: medium
    tags: [cosyntropin, ACTH stimulation test, adrenal insufficiency, cortisol]
  - front: "How is the low-dose overnight dexamethasone (DXM) suppression test performed and interpreted?"
    back: "Give 1 mg DXM orally between 11 pm and midnight; measure plasma cortisol the next morning at 8–9 am. Physiologic response (normal): cortisol <50 nmol/L (<1.8 mcg/dL). Failure to suppress (cortisol ≥50 nmol/L) is a positive screen for Cushing's syndrome.\n\nFalse positives occur with obesity, depression, alcoholism, pregnancy, medications inducing DXM metabolism (e.g., rifampin, phenytoin, barbiturates), or oral contraceptives. A positive screen must be confirmed with additional tests."
    difficulty: medium
    tags: [dexamethasone suppression test, Cushings, cortisol, screening]
  - front: "What are three screening tests for Cushing's syndrome and what constitutes a positive result?"
    back: "1) 24-hour urine free cortisol (≥2 tests) — elevated value; 2) Low-dose overnight DXM suppression test — failure to suppress cortisol below 50 nmol/L; 3) Late-night salivary cortisol (≥2 tests) — cortisol >145 ng/dL (4 nmol/L) at midnight (lacks normal diurnal nadir).\n\nAt least one of these tests must be performed; confirm with one of the remaining. Late-night salivary cortisol is convenient and non-invasive. Reasons for false positives include pregnancy, depression, alcoholism, morbid obesity, poorly controlled DM, and intense chronic exercise."
    difficulty: medium
    tags: [Cushings syndrome, urine free cortisol, DXM suppression, salivary cortisol, screening]
  - front: "What is Primary Aldosteronism (PA) and what are its clinical features?"
    back: "PA is excess aldosterone production from an intra-adrenal cause. Clinical features: hypertension, hypokalemia (+ mild hypernatremia), metabolic alkalosis, fatigue, weakness, paresthesia, headache. Severe hypokalemia (<2.5 mEq/L) may cause tetany or intermittent paralysis. Increased cardiovascular risk (LV hypertrophy, AF, stroke, MI) and elevated risk of metabolic syndrome/T2DM.\n\nPA is the most common cause of secondary hypertension. Unlike secondary hyperaldosteronism, PA features elevated aldosterone with suppressed renin (high aldosterone:renin ratio). Secondary hyperaldosteronism shows elevated aldosterone AND elevated renin."
    difficulty: medium
    tags: [primary aldosteronism, Conns syndrome, hypertension, hypokalemia, aldosterone]
  - front: "When should plasma aldosterone:renin ratio be investigated for primary aldosteronism (PA)?"
    back: "Investigate in patients with: (1) HTN and hypokalemia; (2) drug-resistant HTN; (3) HTN and a first-degree relative with PA; (4) HTN and family history of stroke in a first-degree relative <40 yr; (5) HTN and adrenal incidentaloma.\n\nPA is underdiagnosed. A positive screen (elevated aldosterone:renin ratio with high aldosterone) requires confirmatory testing demonstrating inappropriate aldosterone secretion with ECF volume expansion. Adrenal vein sampling may be needed to lateralize disease."
    difficulty: medium
    tags: [primary aldosteronism, aldosterone:renin ratio, hypertension, screening]
  - front: "How does the aldosterone:renin ratio differ between primary and secondary hyperaldosteronism?"
    back: "Primary hyperaldosteronism: elevated aldosterone:renin ratio (high aldosterone, LOW/suppressed renin). Secondary hyperaldosteronism: normal aldosterone:renin ratio (high aldosterone, HIGH renin — both elevated in response to RAAS activation).\n\nThis distinction is critical. In PA, autonomous aldosterone secretion suppresses renin via negative feedback. In secondary hyperaldosteronism (e.g., renal artery stenosis, heart failure), RAAS is overactivated, so both aldosterone and renin are elevated."
    difficulty: medium
    tags: [aldosterone:renin ratio, primary hyperaldosteronism, secondary hyperaldosteronism, RAAS]
  - front: "What is the confirmatory test for primary aldosteronism and how is it interpreted?"
    back: "IV saline loading test (confirmatory): infuse 500 mL/h of NS for 4 hours, then measure plasma aldosterone. Plasma aldosterone >277 pmol/L confirms PA; <140 pmol/L is normal (indeterminate: 140–277 pmol/L). Oral salt loading with 24-hour urine aldosterone can also be used.\n\nECF volume expansion normally suppresses aldosterone. Failure to suppress confirms autonomous aldosterone secretion. Multiple medications (e.g., spironolactone, eplerenone, ACE inhibitors, ARBs, diuretics) can interfere with screening/confirmatory tests and may need to be held prior to testing."
    difficulty: hard
    tags: [primary aldosteronism, saline infusion test, confirmatory test, aldosterone]
  - front: "What are the treatment options for primary aldosteronism?"
    back: "1) Aldosterone-producing adenoma (Conn's): surgical excision (adrenalectomy) — curative. 2) Medical management: aldosterone antagonists — spironolactone or eplerenone (first-line); triamterene or amiloride (act on sodium channels). 3) Secondary hyperaldosteronism: treat underlying cause.\n\nSpironolactone is the preferred medical treatment; eplerenone has fewer anti-androgenic side effects. Bilateral adrenal hyperplasia is typically managed medically rather than surgically. Adrenal vein sampling is required to confirm lateralization before surgery."
    difficulty: medium
    tags: [primary aldosteronism, spironolactone, adrenalectomy, eplerenone, treatment]
  - front: "What is Cushing's syndrome and what are its major causes by ACTH-dependency?"
    back: "Cushing's syndrome is a metabolic disorder caused by chronic glucocorticoid excess. ACTH-dependent (85%): ACTH-secreting pituitary adenoma — Cushing's disease (80% of ACTH-dependent); ectopic ACTH-secreting tumour (e.g., small cell lung carcinoma). ACTH-independent (15%): primary adrenocortical tumours (adenoma/carcinoma); bilateral adrenal nodular hyperplasia; iatrogenic (most common overall — exogenous glucocorticoids).\n\nIatrogenic Cushing's is likely more common than endogenous disease. Distinguishing ACTH-dependent from ACTH-independent causes requires measuring ACTH levels and imaging. Cushing's disease specifically refers to pituitary ACTH hypersecretion."
    difficulty: medium
    tags: [Cushings syndrome, Cushings disease, ACTH, ectopic ACTH, adrenal]
  - front: "What are the classic clinical features of Cushing's syndrome?"
    back: "Symptoms: weakness, insomnia, mood disorders, impaired cognition, easy bruising, oligomenorrhea/amenorrhea, hirsutism, acne (ACTH-dependent). Signs: central obesity, moon face, supraclavicular and dorsal fat pads (buffalo hump), facial plethora, proximal muscle wasting, purple abdominal striae, skin atrophy, acanthosis nigricans, HTN, hyperglycemia, osteoporosis/pathologic fractures, hyperpigmentation (if ACTH-dependent), hyperandrogenism (if ACTH-dependent).\n\nPurple striae (vs. pink/white stretch marks in obesity) are characteristic. Hyperpigmentation is a feature of high ACTH states (Cushing's disease, ectopic ACTH) due to ACTH binding MSH receptors — it is NOT seen in ACTH-independent causes."
    difficulty: easy
    tags: [Cushings syndrome, moon face, striae, buffalo hump, hyperpigmentation, clinical features]
  - front: "What is the treatment of Cushing's syndrome based on etiology?"
    back: "Adrenal adenoma: unilateral adrenalectomy (curative) + postoperative glucocorticoid supplementation (taper slowly). Adrenal carcinoma: adrenalectomy if localized; adjunctive mitotane for high recurrence risk; mitotane + chemo for metastatic disease. Pituitary (Cushing's disease): transsphenoidal resection + postoperative glucocorticoid supplementation; if failed/contraindicated: ketoconazole, mitotane, pasireotide, cabergoline. Ectopic ACTH: surgical resection if possible; chemo/radiation for primary; medical: mitotane or ketoconazole.\n\nAll surgical patients need perioperative glucocorticoid supplementation because the suppressed contralateral adrenal requires time to recover. Medical management (ketoconazole) inhibits cortisol synthesis and is used while awaiting surgery or when surgery is not possible."
    difficulty: hard
    tags: [Cushings syndrome, adrenalectomy, transsphenoidal, ketoconazole, mitotane]
  - front: "A patient has drug-resistant HTN and a low potassium. Investigations reveal elevated plasma aldosterone with suppressed renin. What is the likely diagnosis and most appropriate next step?"
    back: "Likely diagnosis: primary aldosteronism (PA). Next step: confirmatory testing — IV saline loading test (500 mL/h NS for 4 hours; plasma aldosterone >277 pmol/L confirms PA) and CT adrenal glands; then adrenal vein sampling if CT is non-diagnostic to lateralize aldosterone excess before surgical planning.\n\nAn elevated aldosterone:renin ratio with high absolute aldosterone in the context of hypertension warrants confirmation. CT helps identify an adenoma (Conn's) vs. bilateral hyperplasia. Adrenal vein sampling is the gold standard for lateralization and determines surgical candidacy."
    difficulty: hard
    tags: [primary aldosteronism, drug-resistant hypertension, hypokalemia, adrenal vein sampling, Conns]
  - front: "What is hyperandrogenism and what are its main etiologies in women?"
    back: "Hyperandrogenism is excessive secretion of androgens (DHEA, DHEA-sulfate, testosterone). Main etiologies in women: Ovarian (most common) — PCOS, ovarian hyperthecosis, theca cell tumours; Adrenal — CAH (late-onset), adrenal tumours (adenoma/carcinoma); Pituitary — Cushing's disease (high ACTH), hyperprolactinemia; Medications — anabolic steroids, ACTH, androgens, progestational agents.\n\nPCOS is the most common cause of hyperandrogenism in women of reproductive age. It is important to differentiate true hirsutism (androgen-dependent hair) from hypertrichosis (drug-induced, non-androgenic) and distinguish from virilization, which suggests a more severe/tumoral cause."
    difficulty: medium
    tags: [hyperandrogenism, PCOS, hirsutism, CAH, adrenal tumour]
  - front: "What is the Ferriman-Gallwey scoring system and how is it used to assess hirsutism?"
    back: "A standardized scoring system to quantify severity of androgen-dependent (male-pattern) terminal body hair in women. Score >8 is abnormal for White/Black women; >9 for Mediterranean/Hispanic/Middle-Eastern women; >2 for Asian women. Scores 8–15: mild; 16–25: moderate; >25: severe hirsutism. Scores should be interpreted considering cosmetic hair removal practices.\n\nEthnic-specific thresholds reflect the variation in baseline hair density. This system specifically assesses androgen-sensitive areas (face, back, chest, upper abdomen, linea alba). Drug-induced hypertrichosis (phenytoin, cyclosporine, minoxidil, diazoxide) is NOT true hirsutism — it is non-androgenic generalized hair growth."
    difficulty: medium
    tags: [hirsutism, Ferriman-Gallwey, hyperandrogenism, PCOS, androgen]
  - front: "What investigations are indicated in a woman presenting with hirsutism?"
    back: "First-line: testosterone (total and free), DHEA-S (measures adrenal androgen production), LH/FSH (LH:FSH >2.5 suggests PCOS). 17-OH progesterone (elevated in CAH due to 21-hydroxylase deficiency — check on day 3 of menstrual cycle with a progesterone level). If virilization present: CT/MRI of adrenals and ovaries to identify tumours. If PCOS suspected: fasting blood glucose and lipids.\n\n17-OH progesterone is the key test for non-classic (late-onset) CAH. DHEA-S elevation suggests adrenal source. Very high testosterone (>5–7 nmol/L) or rapid onset virilization warrants urgent tumour workup. Virilization (clitoromegaly, voice deepening, frontal balding) suggests significant androgen excess."
    difficulty: medium
    tags: [hirsutism, testosterone, DHEA-S, 17-OH progesterone, CAH, investigations]
  - front: "What are the treatment options for hyperandrogenism (hirsutism)?"
    back: "1) Discontinue causative medications (DHEA, valproate, danazol). 2) Antiandrogens: spironolactone (first-line medical therapy). 3) Oral contraceptives (increase SHBG, bind androgens > estrogens; reduce ovarian androgen production). 4) Surgical resection if tumour identified. 5) Glucocorticoid + mineralocorticoid if CAH confirmed. 6) Treat specific causative disorders (Cushing's, tumours). 7) Cosmetic therapy (laser, electrolysis).\n\nIn PCOS, combined OCP + spironolactone is often used. OCP reduces LH-driven androgen production and increases SHBG. Spironolactone blocks androgen receptors and inhibits 5-alpha reductase. Metformin helps with insulin resistance in PCOS but has modest effects on hirsutism."
    difficulty: medium
    tags: [hirsutism, spironolactone, OCP, antiandrogen, PCOS, treatment]
  - front: "What are the causes of primary adrenocortical insufficiency (Addison's disease)?"
    back: "Autoimmune (70–90%): isolated Addison's disease or polyglandular autoimmune syndromes types I and II. Infections: TB (7–20%, most common in developing world), fungal (histoplasmosis, paracoccidioidomycosis), HIV, CMV, syphilis. Infiltrative: metastatic cancer (lung > stomach > esophagus > colon > breast), lymphoma, sarcoidosis, amyloidosis, hemochromatosis. Vascular: bilateral adrenal hemorrhage (heparin/warfarin risk), sepsis (meningococcal, Pseudomonas), Waterhouse-Friderichsen syndrome (children), thrombosis/infarction. Drugs: ketoconazole, etomidate, megestrol acetate (inhibit cortisol); rifampin, phenytoin, barbiturates (increase cortisol metabolism).\n\nAutoimmune is the most common cause in developed countries. Bilateral adrenal hemorrhage in the context of anticoagulation or meningococcemia (Waterhouse-Friderichsen) is a medical emergency. Adrenoleukodystrophy is a rare genetic cause presenting in young males."
    difficulty: medium
    tags: [Addisons disease, adrenal insufficiency, autoimmune, TB, adrenal hemorrhage]
  - front: "How do primary and secondary adrenal insufficiency differ in clinical features and electrolytes?"
    back: "Primary AI (Addison's): hyperpigmentation (high ACTH stimulates MSH receptors), hyperkalemia, hyponatremia, metabolic acidosis. Associated with primary hypothyroidism, T1DM, vitiligo. Diagnosed with Cosyntropin stimulation test + high morning ACTH + high renin. Secondary AI: pale skin (low ACTH), normokalemia, hyponatremia, NO metabolic acidosis, NO mineralocorticoid deficiency. Associated with central hypogonadism/hypothyroidism, GH deficiency, DI. Diagnosed with cosyntropin stimulation test + low/inappropriately normal morning ACTH.\n\nIn primary AI, mineralocorticoid (aldosterone) is also deficient → hyperkalemia, metabolic acidosis, salt craving, and hypotension. In secondary AI, aldosterone secretion is relatively preserved (still responsive to RAAS) → no hyperkalemia or metabolic acidosis."
    difficulty: hard
    tags: [adrenal insufficiency, Addisons, primary vs secondary, hyperpigmentation, hyperkalemia]
  - front: "How is an acute adrenal crisis managed?"
    back: "1) IV NS 1L within the first hour, then continuous IV NS guided by requirements; add D5W if hypoglycemic. 2) Hydrocortisone 100 mg IV stat, then 50 mg IV q6h. 3) Identify and correct precipitating factors (infection, surgery, trauma, medication non-compliance).\n\nAdrenal crisis is life-threatening and must be treated empirically if suspected — do not delay treatment to obtain cortisol levels. Precipitating factors must be identified and treated. After stabilization, transition to oral hydrocortisone and investigate for the underlying cause of AI."
    difficulty: medium
    tags: [adrenal crisis, hydrocortisone, adrenal insufficiency, emergency, treatment]
  - front: "What is the maintenance treatment for chronic primary adrenal insufficiency?"
    back: "Glucocorticoid: hydrocortisone 15–25 mg/day PO (or cortisone acetate 20–35 mg/day) in 2–3 divided doses, with the highest dose in the morning (mimics diurnal cortisol peak). Alternatively, prednisolone 3–5 mg once daily or BID for improved compliance. Mineralocorticoid: fludrocortisone (Florinef) 0.05–0.2 mg PO once daily (required in primary AI only). Stress dosing: increase steroids 2–3 fold during moderate-severe illness; hydrocortisone 150–300 mg/day IV divided q8h for major stress (surgery, trauma). Medical alert bracelet and emergency injectable hydrocortisone/dexamethasone.\n\nFludrocortisone is essential in primary AI to replace aldosterone (prevents hyperkalemia, volume depletion). It is NOT needed in secondary AI. Sick day rules (doubling/tripling dose) and emergency injection kits are critical patient education elements for safety."
    difficulty: medium
    tags: [adrenal insufficiency, hydrocortisone, fludrocortisone, stress dosing, maintenance]
  - front: "What is pheochromocytoma and what is the classic clinical triad?"
    back: "Pheochromocytoma is a catecholamine-secreting tumour derived from chromaffin cells of the adrenal gland. Classic triad (not found in most patients): episodic 'pounding' headache, palpitations/tachycardia, and diaphoresis. 50% have paroxysmal HTN; others have sustained HTN.\n\nPheo is a rare cause of HTN (<0.2% of all hypertensives). Symptoms may be triggered by stress, exertion, anesthesia, abdominal pressure, or tyramine-containing foods (aged cheese, cured meats). Other signs include orthostatic hypotension, papilledema, hyperglycemia, and dilated cardiomyopathy."
    difficulty: easy
    tags: [pheochromocytoma, catecholamines, hypertension, headache, diaphoresis, palpitations]
  - front: "What genetic syndromes are associated with pheochromocytoma/paraganglioma?"
    back: "30–40% of cases are linked to germline mutations. Key syndromes (all autosomal dominant): MEN2A/2B (RET mutation, 50% frequency) — most common hereditary association; von Hippel-Lindau (VHL, 10–20%); Neurofibromatosis type 1 (NF1, 0.1–5.7%). Other mutations: SDHx, SDHAF2. All patients are currently offered genetic testing.\n\nPheochromocytomas and paragangliomas have the greatest genetic inheritance among neuroendocrine tumours. Hereditary forms present earlier and are more likely bilateral. Probability of germline disease increases with young age, multifocal disease, or paraganglioma. RET genetic screening is standard of care in MEN2."
    difficulty: medium
    tags: [pheochromocytoma, MEN2, VHL, NF1, germline, genetic]
  - front: "How is pheochromocytoma diagnosed biochemically?"
    back: "First-line: urine metanephrines (increased catecholamine metabolites — metanephrines and catecholamines). Plasma metanephrines (most sensitive, if available). Cut-off values depend on assay used. Imaging: CT abdomen; if negative, whole-body CT + MIBG scintigraphy, Octreoscan, or MRI.\n\nPlasma free metanephrines have higher sensitivity than urine metanephrines but lower specificity. MIBG (meta-iodo-benzylguanidine) scintigraphy is highly specific for functional chromaffin tissue and is used to locate extra-adrenal or metastatic disease. Urinary VMA and HVA are older tests, now less used."
    difficulty: medium
    tags: [pheochromocytoma, metanephrines, MIBG, diagnosis, urine catecholamines]
  - front: "What is the preoperative preparation for surgical resection of pheochromocytoma?"
    back: "1) Alpha-blockade FIRST (10–21 days preoperatively): doxazosin or phenoxybenzamine (most commonly used); IV phentolamine perioperatively if needed. 2) Beta-blockade ONLY after adequate alpha-blockade (if needed for HR control — adding beta-blocker before alpha-blocker risks severe hypertension). 3) Metyrosine (catecholamine synthesis inhibitor) + alpha-blocker. 4) Volume restoration with vigorous salt-loading and IV fluids. 5) Monitor for hypoglycemia postoperatively. 6) Rescreen urine 1–3 months postoperatively.\n\nAlpha-blockade first is critical — unopposed alpha receptors (with beta-blockade alone) cause paradoxical severe vasoconstriction and hypertensive crisis. Preoperative volume loading counteracts the vasoconstriction and prepares for the hypotension that follows catecholamine surge removal at surgery."
    difficulty: hard
    tags: [pheochromocytoma, alpha-blockade, phenoxybenzamine, preoperative, surgery]
  - front: "What is MEN1 and what are its classic three components (3 Ps)?"
    back: "MEN1 (chromosome 11, autosomal dominant) — the 3 Ps: Pituitary adenomas (30–40%) — most commonly prolactinomas; also GH, ACTH-secreting, non-functional. Parathyroid (>95%) — primary hyperparathyroidism from hyperplasia or adenomas (most common manifestation). Pancreas/entero-pancreatic endocrine (30–80%) — gastrinoma (most common functional tumour), insulinoma, VIPoma, glucagonoma, carcinoid.\n\nParathyroid disease is the most common and earliest manifestation of MEN1. Gastrinoma (Zollinger-Ellison syndrome) presents with refractory peptic ulcers. Insulinoma causes hypoglycemia. MEN1 mutation (menin gene on chromosome 11) should be screened in all patients with clinical MEN1 and their first-degree relatives."
    difficulty: medium
    tags: [MEN1, pituitary, parathyroid, gastrinoma, insulinoma, multiple endocrine neoplasia]
  - front: "What are the components and clinical manifestations of MEN2A (Sipple's syndrome)?"
    back: "MEN2A (chromosome 10, RET mutation, autosomal dominant) — triad: 1) Medullary thyroid cancer (MTC, ~90%) — neck mass/thyroid nodule, non-tender anterior lymph nodes. 2) Pheochromocytoma (40–50%) — HTN, palpitations, headache, sweating. 3) Primary hyperparathyroidism (20–30%) — symptoms of hypercalcemia. Some cases also have cutaneous lichen amyloidosis (scaly skin rash).\n\nMTC arises from parafollicular C-cells and secretes calcitonin. It is the most common and lethal component if untreated. Pheochromocytoma must be ruled out BEFORE thyroidectomy to avoid perioperative hypertensive crisis. Prophylactic thyroidectomy is recommended in RET mutation carriers."
    difficulty: medium
    tags: [MEN2A, Sipples syndrome, medullary thyroid cancer, pheochromocytoma, RET mutation]
  - front: "What distinguishes MEN2B (MEN3) from MEN2A?"
    back: "MEN2B has: MTC (90%, more aggressive and earlier onset than MEN2A), pheochromocytoma (>50%), mucosal neuromas and intestinal ganglioneuromas (100% — chronic constipation, megacolon), Marfanoid habitus (without aortic abnormalities). MEN2B does NOT have hyperparathyroidism. Both are caused by RET mutations (chromosome 10).\n\nMEN2B is the most aggressive form of MEN2. The Marfanoid habitus and mucosal neuromas (lips, tongue, eyelid margins) are pathognomonic. MTC in MEN2B presents earlier and is more aggressive — these patients require prophylactic thyroidectomy in infancy."
    difficulty: medium
    tags: [MEN2B, MEN3, medullary thyroid cancer, mucosal neuroma, Marfanoid, RET]
  - front: "What laboratory investigations confirm gastrinoma in MEN1?"
    back: "Significantly elevated serum gastrin with a low gastric pH. If gastrin is <10x ULN, a secretin stimulation test may be required (secretin paradoxically increases gastrin in gastrinoma, unlike other causes of hypergastrinemia).\n\nGastrinoma (Zollinger-Ellison syndrome) causes refractory peptic ulcers, esophagitis, and secretory diarrhea due to excess gastrin. The secretin stimulation test distinguishes gastrinoma (gastrin rises ≥200 pg/mL) from G-cell hyperplasia and other causes. PPI therapy is essential for symptom control."
    difficulty: hard
    tags: [gastrinoma, MEN1, Zollinger-Ellison, secretin stimulation test, gastrin]
  - front: "What laboratory tests confirm insulinoma in MEN1?"
    back: "Hypoglycemia with inappropriately high insulin AND C-peptide levels for the level of glucose (C-peptide confirms endogenous insulin secretion, ruling out exogenous insulin use).\n\nInsulinoma is the most common functional pancreatic neuroendocrine tumour in MEN1. The 72-hour supervised fast is the gold standard diagnostic test, with measurement of glucose, insulin, C-peptide, and proinsulin at the time of hypoglycemia. C-peptide distinguishes insulinoma from factitious hypoglycemia (exogenous insulin suppresses C-peptide)."
    difficulty: medium
    tags: [insulinoma, MEN1, hypoglycemia, C-peptide, insulin]
  - front: "What is the management strategy for MEN2 regarding medullary thyroid cancer?"
    back: "Prophylactic thyroidectomy is recommended in individuals with documented pathogenic RET mutation and increased risk of aggressive MTC. If incident MTC, thyroidectomy after diagnosis. Genetic screening for RET mutations (chromosome 10) is the standard of care for all individuals with a family history of MEN2. Rule out pheochromocytoma AND hyperparathyroidism before thyroidectomy. Thyroid hormone supplementation following total thyroidectomy.\n\nThe timing of prophylactic thyroidectomy in RET mutation carriers depends on the specific mutation (risk stratification A–D). Calcitonin levels are used to monitor for MTC recurrence. Pheochromocytoma must be excluded and treated first to avoid hypertensive crisis during thyroidectomy."
    difficulty: hard
    tags: [MEN2, medullary thyroid cancer, prophylactic thyroidectomy, RET, calcitonin]
  - front: "A patient with a family history of MEN2 is found to have a RET mutation. What is the recommended management?"
    back: "Prophylactic thyroidectomy (timing based on specific RET mutation risk category). Before thyroidectomy: rule out pheochromocytoma (24-hour urine/plasma metanephrines) and hyperparathyroidism (serum Ca2+ and PTH). Monitor calcitonin levels for MTC surveillance. Genetic counseling offered to first-degree relatives. Thyroid hormone supplementation following total thyroidectomy.\n\nRET mutation carriers face near-certainty of developing MTC, which is lethal if untreated. Prophylactic thyroidectomy is the only cure. The sequence is critical: pheochromocytoma must be managed first (alpha-blockade + surgery) to prevent hypertensive crisis during thyroid surgery. Annual biochemical surveillance is lifelong."
    difficulty: hard
    tags: [MEN2, RET mutation, prophylactic thyroidectomy, medullary thyroid cancer, management]
  - front: "What is glucagonoma and how does it present?"
    back: "Glucagonoma is a glucagon-secreting pancreatic islet cell tumour seen in MEN1. Presents with: elevated glucagon levels, necrolytic migratory erythema (characteristic rash), anorexia, anemia, secretory diarrhea, glossitis. Managed with somatostatin analogue (e.g., octreotide) for symptom control, and surgery.\n\nNecrolytic migratory erythema (NME) is the pathognomonic rash of glucagonoma — erythematous, pruritic, blistering lesion affecting the lower extremities and perineum. Hyperglycemia (due to glucagon's counter-regulatory effect on insulin) and weight loss are also common. Somatostatin analogues suppress glucagon secretion."
    difficulty: hard
    tags: [glucagonoma, MEN1, necrolytic migratory erythema, somatostatin, pancreatic neuroendocrine]
  - front: "What drugs can cause or worsen adrenal insufficiency and through what mechanism?"
    back: "Drugs that inhibit cortisol synthesis: ketoconazole (antifungal), etomidate (anesthetic induction agent), megestrol acetate (progestogen). Drugs that increase cortisol metabolism (reduce effectiveness of replacement): rifampin, phenytoin, barbiturates. Exogenous glucocorticoids: cause secondary AI via HPA axis suppression upon withdrawal.\n\nEtomidate is notable as a single dose can suppress adrenal function for 24–48 hours — relevant in ICU patients. Ketoconazole inhibits steroidogenic enzymes (17-alpha hydroxylase, 11-beta hydroxylase) and is also used therapeutically to reduce cortisol in Cushing's syndrome. Abrupt steroid withdrawal after prolonged use is a common cause of secondary AI."
    difficulty: medium
    tags: [adrenal insufficiency, ketoconazole, etomidate, rifampin, steroid withdrawal, drug-induced]
  - front: "What is the Waterhouse-Friderichsen syndrome?"
    back: "Bilateral adrenal hemorrhage and acute adrenal crisis occurring as a complication of severe bacterial sepsis, classically Neisseria meningitidis (meningococcemia) in children, but also Pseudomonas and other organisms. Presents with rapidly progressive hemorrhagic purpura, cardiovascular collapse, and adrenal failure. A medical emergency requiring immediate IV hydrocortisone and antibiotics.\n\nBilateral adrenal hemorrhage can also occur in adults on anticoagulation (heparin, warfarin) or with coagulopathy. The adrenal glands are highly vascular and vulnerable to hemorrhagic infarction. Diagnosis may require CT adrenals. Treatment is empiric stress-dose hydrocortisone + management of the underlying infection."
    difficulty: medium
    tags: [Waterhouse-Friderichsen syndrome, adrenal hemorrhage, meningococcemia, adrenal crisis, sepsis]
  - front: "What are the triggers for symptoms/paroxysms in pheochromocytoma?"
    back: "Symptoms may be triggered by: physical or emotional stress, exertion, anesthesia induction, abdominal pressure (e.g., palpation, urination in bladder paraganglioma), tyramine-containing foods (aged/strong cheese, cured meats), certain medications (e.g., metoclopramide, glucagon, tricyclic antidepressants).\n\nTyramine-containing foods trigger catecholamine release from the tumour. This is relevant in patients on MAO inhibitors where the 'cheese effect' is amplified. Awareness of anesthetic triggers is critical — alpha-blockade must be in place before any surgery or anesthesia in a known or suspected pheochromocytoma."
    difficulty: medium
    tags: [pheochromocytoma, tyramine, triggers, paroxysmal hypertension, anesthesia]
  - front: "A 45-year-old woman presents with HTN, episodic headaches, palpitations, and sweating. Plasma metanephrines are markedly elevated. CT abdomen shows a 4 cm right adrenal mass. What is the correct sequence of management?"
    back: "1) Alpha-blockade first: start doxazosin or phenoxybenzamine for 10–21 days preoperatively. 2) Add beta-blocker ONLY after adequate alpha-blockade (for HR control if needed). 3) Vigorous salt-loading and IV fluid hydration for volume restoration. 4) Surgical excision of the adrenal mass (adrenalectomy). 5) Monitor for hypoglycemia postoperatively. 6) Rescreen urine/plasma metanephrines 1–3 months postoperatively. 7) Offer genetic testing (germline mutations).\n\nStarting a beta-blocker before alpha-blockade is dangerous — it removes beta-mediated vasodilation while leaving alpha-mediated vasoconstriction unopposed, causing severe hypertensive crisis. IV phentolamine (short-acting alpha-blocker) is available perioperatively for acute BP surges during tumour manipulation."
    difficulty: hard
    tags: [pheochromocytoma, alpha-blockade, adrenalectomy, perioperative management, metanephrines]
  - front: "What is secondary adrenocortical insufficiency and what are its common causes?"
    back: "Secondary AI is inadequate pituitary ACTH secretion leading to reduced cortisol production (but relatively preserved aldosterone). Most common cause: exogenous glucocorticoid use with abrupt withdrawal (suppresses HPA axis). Other causes: pituitary tumours, pituitary surgery/radiation, Sheehan's syndrome (postpartum pituitary necrosis), head trauma, infiltrative diseases (sarcoidosis, hemochromatosis), lymphocytic hypophysitis.\n\nIn secondary AI, aldosterone is mostly preserved because it is primarily regulated by the RAAS (not ACTH) — therefore no hyperkalemia, salt craving, or metabolic acidosis. Patients may have other signs of hypopituitarism (secondary hypogonadism, hypothyroidism, GH deficiency). The insulin tolerance test is the gold standard for diagnosing secondary AI when there is uncertainty."
    difficulty: medium
    tags: [secondary adrenal insufficiency, ACTH, steroid withdrawal, hypopituitarism, cortisol]
