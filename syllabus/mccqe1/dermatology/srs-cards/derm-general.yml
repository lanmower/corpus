    difficulty: medium
    tags: [melanoma, targeted-therapy, BRAF, oncology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the approximate 5-year survival for Stage I (T<1.0mm) melanoma?"
    back: "90%\n\nThin melanomas (<1mm Breslow thickness) have excellent prognosis with surgical excision, with 5-year survival approaching 90%."
    difficulty: easy
    tags: [melanoma, staging, prognosis, AJCC, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the approximate 5-year survival for Stage III (any nodal involvement) melanoma?"
    back: "45%\n\n nodal involvement significantly worsens prognosis in melanoma, with 5-year survival approximately 45% despite adjuvant therapies."
    difficulty: easy
    tags: [melanoma, staging, prognosis, lymph-nodes, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the AJCC T staging criterion for T1 melanoma?"
    back: "Tumor thickness <1.0 mm\n\nT1 melanomas are further subdivided: T1a = <1.0 mm without ulceration (90% 5-yr survival), T1b = <1.0 mm with ulceration OR 1.01-2.0 mm without ulceration."
    difficulty: medium
    tags: [melanoma, AJCC, staging, breslow, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the total cumulative dose goal for isotretinoin in severe nodular acne?"
    back: "120 mg/kg total dose over 20-24 weeks\n\nIsotretinoin is given at 0.5-1mg/kg/day to achieve a total cumulative dose of 120 mg/kg, typically over 20-24 weeks"
    difficulty: medium
    tags: [isotretinoin, acne, dosing, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the dosing of doxycycline for acne vulgaris?"
    back: "100 mg PO twice daily\n\nDoxycycline 100mg BID is used for acne vulgaris and rosacea. Contraindications include pregnancy, hepatic impairment, and drug hypersensitivity"
    difficulty: easy
    tags: [doxycycline, acne, rosacea, oral therapy, antibiotics, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "A patient presents with fever, headache, confusion, stiff neck, and rash. What is the most likely diagnosis?"
    back: "Meningitis\n\nThe triad of fever, altered mental status, and nuchal rigidity with rash is classic for meningitis."
    difficulty: easy
    tags: [fever, meningitis, neurology, infectious disease, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the red flag symptoms for fever requiring urgent evaluation?"
    back: "Meningitis (headache, confusion, stiff neck, rash), osteomyelitis (bone pain), skin purulent discharge\n\nThese symptoms suggest serious bacterial infections requiring prompt investigation."
    difficulty: medium
    tags: [fever, red-flag, emergency, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the key symptoms to ask about for possible meningitis in a febrile patient?"
    back: "Headache, confusion, stiff neck, and rash\n\nMeningismus (neck stiffness) and altered mental status are classic signs of meningeal irritation requiring urgent evaluation."
    difficulty: medium
    tags: [fever, meningitis, neurology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What symptoms suggest meningitis as the cause of fever?"
    back: "Headache, confusion, stiff neck, rash\n\nMeningitis is a medical emergency. The classic triad is fever, headache, and neck stiffness, often with altered mental status and may have a characteristic rash."
    difficulty: easy
    tags: [fever, meningitis, neurology, emergency, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the meningitis symptoms to assess in fever?"
    back: "Headache, confusion, stiff neck, rash\n\nMeningitis is a medical emergency requiring urgent evaluation."
    difficulty: easy
    tags: [fever, meningitis, emergency, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What symptoms suggest meningitis when evaluating fever?"
    back: "Headache, confusion, stiff neck, rash\n\nMeningitis symptoms include headache, altered mental status, nuchal rigidity, and characteristic rash."
    difficulty: easy
    tags: [Fever, Meningitis, Red Flags, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the first-line treatment for uncomplicated cellulitis in adults?"
    back: "Cephalexin 500 mg PO QID x 10-14 days\n\nCellulitis is typically caused by S. aureus and Group A Streptococcus. Cephalexin covers both pathogens effectively."
    difficulty: easy
    tags: [dermatology, cellulitis, infection, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is first-line treatment for cellulitis in adults?"
    back: "Cephalexin 500mg PO QID x 10-14 days\n\nCephalexin provides coverage for both S. aureus and Group A Streptococcus, the primary pathogens in cellulitis."
    difficulty: easy
    tags: [dermatology, infectious disease, cellulitis, bacterial infection, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the second-line treatments for uncomplicated cellulitis in adults?"
    back: "Cloxacillin 500 mg PO QID for 10-14 days OR clindamycin 300 mg PO for 10-14 days\n\nAlternative options for penicillin-allergic patients or treatment failures."
    difficulty: easy
    tags: [infectious disease, cellulitis, treatment, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the first-line oral treatment for cellulitis in adults?"
    back: "Cephalexin 500 mg PO QID x10-14 days\n\nCephalexin is the preferred first-line oral agent for uncomplicated cellulitis in adults."
    difficulty: easy
    tags: [infectious disease, cellulitis, antibiotic, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the most common causes of cellulitis?"
    back: "Staphylococcus aureus and Group A Streptococcus (Streptococcus pyogenes)\n\nThese two pathogens account for the majority of uncomplicated cellulitis cases."
    difficulty: easy
    tags: [infectious disease, cellulitis, microbiology, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the second-line oral treatment for cellulitis in adults?"
    back: "Cloxacillin 500 mg PO QID x10-14 days OR clindamycin 300 mg PO x10-14 days\n\nAlternative options for penicillin-allergic patients or suspected MRSA."
    difficulty: medium
    tags: [infectious disease, cellulitis, antibiotic, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the characteristic symptoms of meningitis in a febrile patient?"
    back: "Headache, confusion, stiff neck, and rash\n\nMeningitis is a life-threatening cause of fever; the classic triad includes fever, headache, and neck stiffness, but presentation may be incomplete."
    difficulty: medium
    tags: [fever, meningitis, neurologic, emergency, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What organisms cause uncomplicated cellulitis?"
    back: "Staphylococcus aureus and Group A Streptococcus (Streptococcus pyogenes)\n\nThese are the two most common causes. MRSA coverage may be needed in high-risk or suspected MRSA cases."
    difficulty: easy
    tags: [infectious disease, cellulitis, microbiology, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is first-line treatment for uncomplicated cellulitis in adults?"
    back: "Cephalexin 500 mg PO four times daily for 10-14 days\n\nCephalexin covers both S. aureus and Group A Streptococcus. Oral therapy is appropriate for uncomplicated cases without systemic symptoms."
    difficulty: easy
    tags: [infections, bacterial, cellulitis, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the 'Rose spots' associated with Typhoid fever?"
    back: "Pink blanching maculopapular rash on the anterior thorax and upper abdomen\n\nSalmonella Typhi (causing enteric fever/typhoid) presents with 'rose spot' rash, fever, and abdominal pain preceding diarrhea."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, typhoid, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What are the 'rosespot' rash findings in Salmonella Typhi?"
    back: "Pink spots on anterior thorax and upper abdomen\n\nSalmonella Typhi (Enteric Fever) causes a characteristic 'rosespot' rash - pink spots on the anterior thorax and upper abdomen, along with fever and abdominal pain preceding diarrhea."
    difficulty: medium
    tags: [gastroenterology, infectious-disease, typhoid, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What are the common causes of uncomplicated cellulitis?"
    back: "Staphylococcus aureus and Group A Streptococcus\n\nThese two pathogens account for the majority of community-acquired cellulitis cases."
    difficulty: easy
    tags: [dermatology, cellulitis, S. aureus, Streptococcus, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the first-line treatment for cellulitis in adults?"
    back: "Cephalexin 500 mg PO QID x 10-14 days\n\nFirst-generation cephalosporins are first-line for uncomplicated cellulitis in adults."
    difficulty: easy
    tags: [internal medicine, cellulitis, antibiotics, cephalexin, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are second-line treatments for cellulitis in adults?"
    back: "Cloxacillin 500 mg PO QID x 10-14 days, OR clindamycin 300 mg PO x 10-14 days\n\nSecond-line options include penicillinase-resistant penicillins or clindamycin for penicillin-allergic patients."
    difficulty: easy
    tags: [internal medicine, cellulitis, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the characteristic rash seen in Salmonella Typhi (typhoid fever)?"
    back: "Rose spots\n\nRose spots are blanching erythematous macules on the anterior thorax and upper abdomen in typhoid fever."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, salmonella, typhoid, rose-spots, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which bacteria is associated with 'rose spot' rash on the anterior thorax?"
    back: "Salmonella Typhi (Typhoid fever)\n\nSalmonella Typhi causes typhoid fever with characteristic 'rose spots' on the upper abdomen and anterior thorax, along with fever and abdominal pain."
    difficulty: medium
    tags: [gastroenterology, salmonella, typhoid, rash, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What are the classic skin findings in Dermatomyositis?"
    back: "Heliotrope rash (periorbital) and Gottron's papules (violaceous papules over knuckles and IPs)\n\nDermatomyositis also presents with shawl sign (photosensitivity macular erythema over chest/shoulders) and proximal muscle weakness."
    difficulty: easy
    tags: [dermatomyositis, clinical-features, skin-manifestations, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What skin manifestation of dermatomyositis is treated with hydroxychloroquine?"
    back: "Dermatomyositis (DM) rash\n\nHydroxychloroquine is particularly effective for the characteristic skin findings in DM."
    difficulty: easy
    tags: [Dermatomyositis, Hydroxychloroquine, Dermatology, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is the most common type of penile cancer?"
    back: "Squamous cell carcinoma (>95%). Basal cell, melanoma, and Paget disease are extremely rare.\n\nSCC of the penis is associated with HPV subtypes. Definitive diagnosis requires full thickness biopsy."
    difficulty: easy
    tags: [urology, penile cancer, oncology, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
  - front: "What syndromes are associated with Wilms' tumour?"
    back: "WAGR syndrome (Wilms' aniridia genitourinary anomaly retardation), Beckwith-Wiedemann syndrome, and Denys-Drash syndrome\n\nApproximately 10% of Wilms' tumours are associated with congenital malformation syndromes."
    difficulty: medium
    tags: [Wilms tumour, associated syndromes, WAGR, Beckwith-Wiedemann, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
