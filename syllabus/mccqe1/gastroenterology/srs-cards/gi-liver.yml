  - front: "List the clinical manifestations of Wilson's disease involving the liver"
    back: "Acute hepatitis, acute liver failure, chronic active hepatitis, cirrhosis; low risk of HCC\n\nLiver involvement is the most common presentation, ranging from acute hepatitis to chronic active hepatitis and cirrhosis. Patients typically present before age 40."
    difficulty: easy
    tags: [Wilsons disease, hepatology, liver, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "When is liver biopsy indicated in hemochromatosis?"
    back: "To detect cirrhosis or if there is a potential for other causes of liver disease (e.g., NAFLD, excess EtOH, hepatitis); especially in compound heterozygotes\n\nBiopsy is indicated when there are markers of advanced fibrosis (age >40, elevated LFTs, ferritin >1000 ng/mL) or when other liver diseases are suspected."
    difficulty: hard
    tags: [Hemochromatosis, diagnosis, biopsy, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the prognosis of hemochromatosis with treatment?"
    back: "Normal life expectancy if treated before development of cirrhosis or diabetes\n\nEarly diagnosis and treatment prevent irreversible organ damage. Once cirrhosis or diabetes develops, prognosis is significantly worse."
    difficulty: easy
    tags: [Hemochromatosis, prognosis, outcome, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the spectrum of alcohol-related liver disease?"
    back: "1) Steatotic liver disease (reversible with abstinence), 2) Acute alcoholic hepatitis (35% of cases, often reversible), 3) Cirrhosis (10-15%, permanent architectural changes)\n\nAlcohol-related liver disease exists on a spectrum from reversible fatty liver to irreversible cirrhosis."
    difficulty: easy
    tags: [Alcoholic liver disease, spectrum, pathology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "A patient with history of heavy alcohol use presents with jaundice. Labs show elevated AST > ALT (ratio >2), and biopsy shows Mallory bodies. What is the most likely diagnosis?"
    back: "Alcoholic hepatitis\n\nAST:ALT ratio >2, history of heavy alcohol use, and presence of Mallory bodies on biopsy are classic for alcoholic hepatitis."
    difficulty: medium
    tags: [Alcoholic liver disease, case, clinical reasoning, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the risk of HCC in hemochromatosis with cirrhosis?"
    back: "200x increased risk compared to general population\n\nPatients with hemochromatosis and cirrhosis require HCC screening due to this markedly elevated risk."
