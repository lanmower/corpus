# Seizures & Epilepsy (Neurology) - generated from srs-mccqe1
cards:
  - front: "A 28-year-old with no prior seizure has a 3-minute generalized tonic-clonic seizure and returns to normal neurologically within 30 minutes. What is the appropriate workup?"
    back: "First unprovoked seizure workup: CBC, electrolytes, glucose, creatinine, LFTs, drug/alcohol levels, ECG, brain MRI (preferred), EEG — determine if provoked (reversible cause) vs. unprovoked\n\nCAEP (Canadian) and AAN guidelines: first seizure does not require immediate AED unless second seizure occurs. Identify and treat reversible causes (metabolic, toxic). Risk of recurrence after first unprovoked seizure is 30-50% (highest in first 2 years)."
    difficulty: medium
    tags: [first seizure workup, unprovoked seizure, MRI, EEG, neurology]
  - front: "When is anticonvulsant therapy started after a first seizure?"
    back: "Start AED after first seizure if: high recurrence risk (abnormal EEG with epileptiform discharges, structural brain lesion, nocturnal seizures) or patient occupational/safety concerns — not required for all first seizures\n\nEpilepsy Canada guidelines support AED after first seizure only when recurrence risk and consequences are high. Starting AED after first seizure reduces recurrence but does not alter long-term remission rates. Shared decision-making is key."
    difficulty: medium
    tags: [first seizure, AED, anticonvulsant, epilepsy treatment, neurology]
  - front: "What is status epilepticus (SE) and what is the treatment protocol?"
    back: "SE: seizure >5 minutes or ≥2 seizures without recovery between them; Protocol: lorazepam IV 0.1 mg/kg (max 4mg) as first-line; if no response: IV fosphenytoin, valproate, or levetiracetam; refractory SE: intubation + propofol or midazolam infusion\n\nTime is critical in SE: the longer the seizure, the harder to terminate. RAMPART and Veterans Affairs trials established benzodiazepines as most effective first-line. Identify and treat precipitants (hypoglycemia, metabolic, AED non-compliance, CNS infection, hemorrhage)."
    difficulty: hard
    tags: [status epilepticus, lorazepam, seizure treatment, protocol, neurology]
  - front: "What are the main seizure types and how are they classified per ILAE 2017?"
    back: "Focal (aware, impaired awareness, focal-to-bilateral TC); Generalized (absence, myoclonic, tonic-clonic, atonic, tonic); Unknown\n\nILAE 2017 classification uses 3 levels: seizure type, epilepsy type (focal, generalized, combined, unknown), epilepsy syndrome. Seizure classification guides AED selection: valproate for generalized, carbamazepine/lamotrigine for focal."
    difficulty: easy
    tags: [seizure classification, ILAE, focal seizure, generalized seizure, neurology]
  - front: "A 7-year-old has brief episodes of staring and eyelid fluttering lasting 5-10 seconds, occurring 30+ times per day. EEG shows 3 Hz spike-wave. Diagnosis and treatment?"
    back: "Childhood absence epilepsy; first-line treatment: ethosuximide (preferred) or valproate — do NOT use carbamazepine (worsens absence seizures)\n\nAbsence seizures may be confused with focal impaired awareness seizures. Key distinguishing features: shorter duration, no post-ictal state, hyperventilation provokes absence seizures. Ethosuximide preferred in girls (avoids valproate teratogenicity). Most children outgrow by adolescence."
    difficulty: hard
    tags: [absence epilepsy, childhood absence, ethosuximide, 3Hz spike-wave, neurology]
  - front: "What are the teratogenic risks of antiepileptic drugs (AEDs) in pregnancy?"
    back: "Valproate: highest risk (neural tube defects 1-2%, cognitive impairment in children — avoid if possible); Carbamazepine: neural tube defects (0.5%); Lamotrigine: lowest risk among older AEDs; Levetiracetam: likely low risk\n\nEpilepsy Canada and SOGC guidelines: valproate should be avoided in women of childbearing age unless no alternatives exist. Periconceptional folic acid 5 mg/day for women on AEDs. All women on AEDs with seizures should receive detailed pregnancy counseling."
    difficulty: hard
    tags: [AED teratogenicity, valproate, pregnancy, epilepsy, SOGC, neurology]
  - front: "What is juvenile myoclonic epilepsy (JME) and what AEDs are first-line?"
    back: "JME: myoclonic jerks (especially morning), generalized tonic-clonic seizures, absence seizures; first-line: valproate or levetiracetam (especially in women due to valproate teratogenicity) — lifetime AED treatment usually required\n\nJME is the most common generalized epilepsy syndrome. Onset in adolescence; lifelong AED required as relapse is very high (>90%) after AED withdrawal. Triggers: sleep deprivation, alcohol, photic stimulation. Carbamazepine and phenytoin are contraindicated."
    difficulty: medium
    tags: [juvenile myoclonic epilepsy, JME, valproate, levetiracetam, neurology]
  - front: "What is the mechanism of action of common AEDs?"
    back: "Valproate: multiple mechanisms; Phenytoin/carbamazepine: sodium channel blockade; Levetiracetam: SV2A binding; Lamotrigine: sodium channel; Gabapentin/pregabalin: calcium channel (alpha-2-delta subunit); Ethosuximide: T-type calcium channel\n\nAED mechanism guides drug selection based on seizure type. Sodium channel blockers effective for focal seizures. Valproate and levetiracetam effective for generalized epilepsies. Ethosuximide specific for absence (T-type calcium channels)."
    difficulty: medium
    tags: [AED mechanism, antiepileptic drugs, valproate, levetiracetam, neurology]
  - front: "What is the workup for new-onset seizure in the emergency department?"
    back: "Bedside glucose immediately; CBC, BMP, calcium, magnesium, creatinine, LFTs, blood and urine toxicology; ECG; brain CT (non-contrast) stat; LP if meningitis suspected after CT; MRI when stable\n\nPoint-of-care glucose is first — hypoglycemia is immediately reversible and can cause seizures. ECG to exclude cardiac arrhythmia mimicking seizure (cardiac syncope with tonic activity). CT head identifies structural causes, hemorrhage, tumor, or abscess requiring urgent intervention."
    difficulty: easy
    tags: [seizure workup ED, glucose, CT head, LP, toxicology, neurology]
  - front: "How do you clinically distinguish epileptic seizures from non-epileptic events (psychogenic NES)?"
    back: "Epileptic: stereotyped, short post-ictal confusion, incontinence, tongue biting, elevated prolactin (within 20 min); PNES: gradual onset, prolonged, waxing/waning, asymmetric, recall during event, no post-ictal state, normal EEG during event\n\nPNES (psychogenic non-epileptic seizures) occur in up to 20% of patients treated for epilepsy. Gold standard diagnosis: video-EEG monitoring capturing a typical episode. Treatment: psychotherapy (CBT), address underlying trauma/stressors. AEDs are not effective for PNES."
    difficulty: hard
    tags: [PNES, non-epileptic seizures, video-EEG, psychogenic, neurology]
  - front: "A 50-year-old on carbamazepine has a rash with mucous membrane involvement and skin blistering. Diagnosis and action?"
    back: "Stevens-Johnson syndrome (SJS)/Toxic Epidermal Necrolysis (TEN) from carbamazepine — STOP carbamazepine immediately; dermatology consultation; supportive care\n\nSJS/TEN are severe life-threatening mucocutaneous reactions. Carbamazepine, lamotrigine, phenobarbital, phenytoin are common causes. HLA-B*1502 genotyping recommended before carbamazepine in patients of Asian descent (high risk). CADRMP (Canadian adverse drug reaction monitoring) reporting."
    difficulty: hard
    tags: [SJS TEN, carbamazepine, adverse drug reaction, AED side effects, neurology]
  - front: "What is febrile seizure and which type requires further workup?"
    back: "Simple febrile seizure: <15 min, generalized, single episode in 24h — no further workup; Complex: >15 min, focal, recurrent in 24h — requires EEG and MRI\n\nFebrile seizures occur in 2-5% of children aged 6 months to 5 years. Most do not require AED treatment. Complex febrile seizures or first febrile seizure <12 months requires CSF to exclude meningitis. Long-term epilepsy risk: 2-7% overall, higher with complex features."
    difficulty: easy
    tags: [febrile seizure, complex febrile seizure, children, neurology]
  - front: "What are the driving restrictions for patients with epilepsy in Canada?"
    back: "Generally seizure-free period required: commercial vehicle: 10 years seizure-free, no AEDs; private vehicle: varies by province, typically 3-6 months seizure-free (most provinces 3 months)\n\nEpilepsy Canada and provincial motor vehicle act guidelines require reporting to public health/licensing authority in most provinces. Physician must notify if patient refuses to stop driving (Ontario, Nova Scotia). Duration of seizure-free period varies by province and seizure type."
    difficulty: medium
    tags: [driving restriction, epilepsy, seizure-free period, reporting obligations, neurology]
  - front: "What is Lennox-Gastaut syndrome (LGS)?"
    back: "Severe childhood epilepsy syndrome: multiple seizure types (tonic, atonic, absence), intellectual disability, characteristic EEG (<2.5 Hz generalized slow spike-wave); difficult to treat\n\nLGS: onset 2-8 years. AEDs used: valproate, lamotrigine, clobazam, rufinamide, topiramate. Corpus callosotomy for disabling atonic (drop) seizures. VNS (vagal nerve stimulation) as adjunctive therapy. Ketogenic diet may reduce seizure frequency."
    difficulty: medium
    tags: [Lennox-Gastaut, epilepsy syndrome, tonic atonic seizures, childhood epilepsy, neurology]
  - front: "When can AED therapy be discontinued in an epilepsy patient?"
    back: "After 2-5 years seizure-free: discuss AED withdrawal; weigh recurrence risk (higher if: abnormal EEG, structural lesion, juvenile onset, multiple seizure types) vs. side effects\n\nEpilepsy Canada guidelines: AED withdrawal can be considered after 2+ years seizure-free in low-risk patients. Gradual taper over months. Patient counseling about driving restrictions during withdrawal and for 3-6 months after stopping. Shared decision-making essential."
    difficulty: medium
    tags: [AED withdrawal, seizure-free, epilepsy treatment, driving restriction, neurology]
  - front: "What is the management of status epilepticus?"
    back: "0-5min: ABCs, check glucose. 5-20min: IV lorazepam 4mg (repeat x1). 20-40min: fosphenytoin/levetiracetam/valproate. >40min: continuous midazolam/propofol infusion\n\nSE defined as continuous seizure >5min or >=2 seizures without return to baseline. Goal: terminate within 60min. EEG monitoring if refractory."
    difficulty: hard
    tags: [status epilepticus]
  - front: "What is the definition and timeline of status epilepticus?"
    back: "Continuous seizure activity >=5 minutes, or >=2 seizures without return to baseline between them. Refractory SE: persists after 2 appropriate AED trials. Super-refractory: continues >=24h after anesthetic initiation.\n\nThe 5-minute definition reflects evidence that seizures >5 minutes rarely self-terminate and cause neuronal injury. Canadian guidelines align with the Neurocritical Care Society protocol for staged management."
    difficulty: hard
    tags: [status epilepticus, seizure, emergency, neurology]
  - front: "What is the step-by-step protocol for status epilepticus management?"
    back: "Stage 1 (0-5 min): ABCs, IV access, glucose, lorazepam 4mg IV (repeat x1). Stage 2 (5-20 min): phenytoin 20mg/kg IV or levetiracetam 60mg/kg IV or valproate 40mg/kg IV. Stage 3 (20-40 min): intubation + midazolam or propofol infusion. Stage 4: ketamine or pentobarbital.\n\nThis staged approach follows Neurocritical Care Society and Canadian guidelines. Lorazepam IV is preferred (or midazolam IM if no IV access per RAMPART trial). Continuous EEG monitoring is essential in refractory SE."
    difficulty: hard
    tags: [status epilepticus, protocol, seizure management, neurology]
  - front: "What is the first-line AED for each major seizure type?"
    back: "Focal seizures: carbamazepine, lamotrigine, or levetiracetam. Generalized tonic-clonic: valproate or lamotrigine. Absence: ethosuximide or valproate. Myoclonic: valproate or levetiracetam. Note: carbamazepine and phenytoin can worsen absence and myoclonic seizures.\n\nSelection follows ILAE guidelines. Valproate is avoided in women of childbearing potential due to teratogenicity (NTD risk ~7%). Lamotrigine and levetiracetam are preferred alternatives in this population."
    difficulty: hard
    tags: [AED, seizure type, pharmacology, neurology]
  - front: "What are the ILAE 2017 criteria for the classification of seizure types?"
    back: "Seizures classified by: (1) onset-focal, generalized, or unknown; (2) awareness-focal aware vs focal impaired awareness; (3) motor vs non-motor. Focal to bilateral tonic-clonic replaces secondary generalized.\n\nThe ILAE 2017 classification replaced the 1981 system. Simple partial and complex partial are replaced by focal aware and focal impaired awareness. This guides AED selection and surgical candidacy."
    difficulty: medium
    tags: [ILAE, seizure classification, epilepsy, neurology]
  - front: "When can driving resume after a first unprovoked seizure in Canada?"
    back: "Most Canadian provinces require a seizure-free interval of 3-12 months (varies by province) for private driving. Commercial driving typically requires 3-5 years seizure-free, often off medications.\n\nDriving restrictions after seizures are provincially regulated. In Ontario, a first unprovoked seizure requires 6 months seizure-free; in Alberta, 12 months. Physicians have a legal duty to report in most provinces."
    difficulty: medium
    tags: [driving, seizure, Canadian regulations, neurology]
  - front: "What workup is indicated after a first unprovoked seizure in an adult?"
    back: "MRI brain (preferred over CT), routine EEG (sleep-deprived if routine is normal), basic bloodwork (electrolytes, glucose, calcium, magnesium, CBC, liver/renal function, toxicology screen). LP if infection suspected.\n\nCanadian guidelines recommend MRI as the neuroimaging standard due to superior sensitivity for epileptogenic lesions. EEG abnormalities and MRI lesions are the strongest predictors of recurrence and guide the decision to start AED."
    difficulty: medium
    tags: [first seizure, workup, investigation, neurology]
  - front: "What are the indications to start AED therapy after a first unprovoked seizure?"
    back: "AED initiation is recommended when recurrence risk is high: abnormal EEG, structural brain lesion on MRI, nocturnal seizure, prior brain injury, or Todd paralysis. Without risk factors, observation is reasonable (2-year recurrence ~35%).\n\nThe decision balances recurrence risk (~45% at 2 years) against AED side effects. FIRST and MESS trials showed early treatment reduces recurrence but does not alter long-term remission rates. Canadian Epilepsy Alliance supports shared decision-making."
    difficulty: hard
    tags: [first seizure, AED, treatment decision, neurology]
  - front: "What are the key teratogenic risks of AEDs and the recommended approach for women of childbearing age?"
    back: "Valproate has highest teratogenicity (NTD 7%, IQ reduction). Phenytoin, carbamazepine, phenobarbital carry moderate risk. Lamotrigine and levetiracetam have lowest risk. All women on AEDs should take folic acid 5 mg/day.\n\nSOGC and Canadian guidelines recommend high-dose folic acid (5 mg/day) for women on AEDs starting 3 months preconception. Valproate should be avoided if possible. AED levels should be monitored during pregnancy due to pharmacokinetic changes."
    difficulty: hard
    tags: [teratogenicity, AED, pregnancy, folic acid, neurology]
  - front: "What distinguishes epileptic seizures from psychogenic non-epileptic events (PNEE)?"
    back: "PNEE features: asynchronous limb movements, side-to-side head shaking, pelvic thrusting, eye closure during event, prolonged duration (>2 min), preserved awareness with bilateral movements, no post-ictal confusion. Diagnosis confirmed by video-EEG.\n\nPNEE account for 20-30% of patients referred to Canadian epilepsy monitoring units. Up to 10% have both epilepsy and PNEE. Treatment involves CBT and psychiatric care; AEDs should not be escalated for PNEE."
    difficulty: hard
    tags: [PNEE, psychogenic seizure, differential diagnosis, neurology]
  - front: "What are the surgical options for drug-resistant epilepsy?"
    back: "Resective surgery (temporal lobectomy for mesial temporal sclerosis-60-80% seizure-free), lesionectomy, corpus callosotomy (for drop attacks), vagus nerve stimulator, responsive neurostimulation (RNS). Drug resistance: failure of 2 appropriate AED trials.\n\nCanadian Epilepsy Surgery Centres follow ILAE criteria. Temporal lobectomy is the most effective intervention (Engel Class I in 60-80%). Presurgical evaluation includes video-EEG, MRI, neuropsychology, and may include invasive EEG."
    difficulty: hard
    tags: [epilepsy surgery, drug-resistant, temporal lobectomy, neurology]
  - front: "How should acute seizures from alcohol withdrawal be managed?"
    back: "Alcohol withdrawal seizures occur 6-48h after last drink, usually generalized tonic-clonic. Treat with IV benzodiazepines. Do NOT start chronic AEDs-phenytoin is ineffective for withdrawal seizures. Prevent with CIWA-guided benzodiazepine protocol.\n\nAlcohol withdrawal seizures are provoked and do not require long-term AED therapy. Up to 1/3 progress to delirium tremens if untreated. Canadian Addiction Medicine guidelines recommend symptom-triggered benzodiazepine protocols."
    difficulty: hard
    tags: [alcohol withdrawal, seizure, benzodiazepine, neurology]
  - front: "What are the EEG patterns associated with specific epilepsy syndromes?"
    back: "3 Hz spike-and-wave: childhood absence. Hypsarrhythmia: infantile spasms (West syndrome). Centrotemporal spikes: benign rolandic epilepsy. Generalized polyspike-and-wave: juvenile myoclonic epilepsy. PLEDs: herpes encephalitis or acute structural lesion.\n\nEEG pattern recognition is essential for epilepsy syndrome diagnosis. Childhood absence has the most recognizable pattern (3 Hz generalized spike-wave activated by hyperventilation). JME presents in adolescence with morning myoclonic jerks."
    difficulty: medium
    tags: [EEG, epilepsy syndromes, patterns, neurology]
  - front: "What is the SUDEP risk and how is it communicated?"
    back: "SUDEP incidence is ~1/1000 patient-years in chronic epilepsy, ~1/150 in drug-resistant epilepsy. Risk factors: uncontrolled GTCS, nocturnal seizures, non-adherence. Reduced by optimizing seizure control.\n\nCanadian Epilepsy Alliance recommends SUDEP counselling for all epilepsy patients. SUDEP is the leading cause of premature death in epilepsy. The mechanism likely involves post-ictal respiratory and cardiac dysfunction."
    difficulty: hard
    tags: [SUDEP, mortality, epilepsy, neurology]
  - front: "What medication interactions are critical to know for AEDs?"
    back: "Enzyme inducers (carbamazepine, phenytoin, phenobarbital) reduce efficacy of OCPs, warfarin, and many drugs. Valproate inhibits metabolism and increases lamotrigine levels (reduce lamotrigine dose by 50%). Levetiracetam has minimal interactions.\n\nThe valproate-lamotrigine interaction doubles lamotrigine levels and increases Stevens-Johnson syndrome risk. Women on enzyme-inducing AEDs need higher-dose OCP or non-oral contraception per SOGC guidelines."
    difficulty: hard
    tags: [drug interactions, AED, pharmacology, neurology]
  - front: "What is the approach to febrile seizures and when do they require investigation?"
    back: "Simple febrile seizures (<15 min, generalized, single episode, age 6mo-5yr): reassurance only. Complex (>15 min, focal, recurrent within 24h, or age <6mo): require investigation. LP if <12 months or clinical concern. EEG and MRI not routinely indicated for simple FS.\n\nCPS guidelines state simple febrile seizures carry no increased epilepsy risk above baseline (~1%). Risk factors for recurrence: age <18 months, lower temperature at seizure. Antipyretics do NOT prevent febrile seizures."
    difficulty: medium
    tags: [febrile seizure, pediatrics, investigation, neurology]
  - front: "What are the Canadian driving restrictions after a seizure?"
    back: "Varies by province. Generally: 3-12 month seizure-free period for private driving (6mo in most provinces). Commercial driving: typically 5 years seizure-free off medication. Provoked seizure: shorter restrictions\n\nPhysician has mandatory reporting obligation in some provinces (ON, AB), discretionary in others (BC, QC). Must document discussion. Seizure while driving is a criminal code offense if physician has warned patient."
    difficulty: medium
    tags: [seizure, driving, restrictions]
  - front: "What is the workup for a first unprovoked seizure in an adult?"
    back: "History (witness account, prodrome, post-ictal features), neurological exam, blood work (glucose, electrolytes, calcium, magnesium, renal/liver function, toxicology), MRI brain with epilepsy protocol (preferred over CT), EEG (within 24-48 hours ideally), and ECG to exclude cardiac syncope.\n\nCanadian League Against Epilepsy recommends MRI over CT for first seizure workup due to superior sensitivity for structural lesions. EEG within 24 hours has highest yield. After a single unprovoked seizure, recurrence risk is ~40% at 2 years; AED treatment reduces this to ~20% but does not change long-term prognosis."
    difficulty: medium
    tags: [first-seizure, workup, MRI, EEG, CLAE]
  - front: "What are the driving restrictions after a first seizure in Canadian provinces?"
    back: "Varies by province but generally: private vehicle — seizure-free for 3-12 months (most provinces require 6 months minimum for unprovoked seizure). Commercial vehicle — typically 1-5 years seizure-free depending on province. Must be seizure-free off medication for some commercial licenses. Physician has duty to report in most provinces.\n\nCanadian Council of Motor Transport Administrators (CCMTA) provides national guidelines adopted variably by provinces. Ontario requires 6 months seizure-free for Group 1 (private). Physicians have mandatory reporting obligations in most provinces (exceptions: Alberta, Quebec allow patient self-reporting). Document counselling in chart."
    difficulty: medium
    tags: [driving-restrictions, seizure, CCMTA, provincial-rules, physician-reporting]
  - front: "What is appropriate seizure first aid and what common myths should be dispelled?"
    back: "Do: protect from injury (clear surroundings), place on side (recovery position), time the seizure, stay with patient, call 911 if >5 minutes. Do NOT: restrain, put anything in the mouth, give oral fluids/meds during active seizure. Post-ictal: reassure, check for injuries, assess for incontinence.\n\nEpilepsy Canada emphasizes public education on seizure first aid. The myth of swallowing the tongue persists and causes harm from oral insertion attempts. Seizure lasting >5 minutes warrants emergency response due to risk of status epilepticus. Buccal midazolam or intranasal midazolam can be prescribed for home use."
    difficulty: easy
    tags: [seizure-first-aid, myths, public-education, recovery-position, Epilepsy-Canada]
  - front: "What is SUDEP and what are its risk factors?"
    back: "Sudden Unexpected Death in Epilepsy — sudden death in an epilepsy patient without structural or toxicologic cause. Risk ~1/1000 per year. Risk factors: generalized tonic-clonic seizures (most important), poor AED adherence, nocturnal seizures, young adult onset, polypharmacy, intellectual disability, prone sleeping position.\n\nSUDEP is the leading cause of epilepsy-related mortality. Canadian epilepsy guidelines recommend discussing SUDEP with all epilepsy patients as part of informed care. Seizure freedom is the most protective factor. Nocturnal seizure monitoring devices may reduce risk. Autopsy is essential for diagnosis."
    difficulty: hard
    tags: [SUDEP, mortality, risk-factors, epilepsy, counselling]
  - front: "How is refractory status epilepticus managed?"
    back: "Stage 1 (0-5 min): benzodiazepines (IV lorazepam 0.1 mg/kg or IM midazolam). Stage 2 (5-20 min): IV phenytoin/fosphenytoin, valproate, or levetiracetam. Stage 3 (>20 min, refractory): ICU with continuous EEG, anesthetic agents (propofol, midazolam infusion, or thiopental) titrated to burst suppression.\n\nRefractory status epilepticus (RSE) fails two adequate AED trials. Super-refractory SE persists >24 hours despite anesthesia. Canadian guidelines recommend continuous EEG monitoring. Mortality is 20-40% for RSE. Always investigate underlying cause (infection, metabolic, structural, autoimmune encephalitis)."
    difficulty: hard
    tags: [status-epilepticus, refractory, benzodiazepine, anesthetic, burst-suppression]
  - front: "Which AEDs are preferred for focal seizures vs generalized seizures?"
    back: "Focal: lamotrigine, levetiracetam, carbamazepine, oxcarbazepine (first-line). Generalized tonic-clonic: valproate (most effective but teratogenic), lamotrigine, levetiracetam. Absence: ethosuximide (first-line), valproate, lamotrigine. Avoid carbamazepine/phenytoin in generalized — may worsen absence and myoclonic seizures.\n\nCanadian League Against Epilepsy recommends valproate avoidance in women of childbearing potential due to teratogenicity (NTD 1-2%, IQ reduction). Levetiracetam and lamotrigine are preferred in this population. All AED changes in women should include contraception counselling and folic acid 5 mg daily."
    difficulty: medium
    tags: [AED-selection, focal-seizure, generalized-seizure, lamotrigine, valproate]
  - front: "What is the approach to AED withdrawal in a seizure-free patient?"
    back: "Consider withdrawal after >=2 years seizure-free. Taper over minimum 2-3 months (6 months for benzodiazepines/barbiturates). Recurrence risk ~30-40% within 2 years. Favorable factors: single seizure type, normal EEG, normal MRI, idiopathic etiology. Unfavorable: juvenile myoclonic epilepsy (lifelong treatment), structural lesion.\n\nCanadian guidelines recommend discussing recurrence risk and driving implications before tapering. Driving restrictions restart if seizures recur during taper. JME has >90% relapse rate if medication stopped. EEG before withdrawal helps risk-stratify. Taper one medication at a time in polytherapy."
    difficulty: medium
    tags: [AED-withdrawal, seizure-free, tapering, recurrence-risk, JME]
  - front: "How do you differentiate epileptic seizures from psychogenic non-epileptic events (PNEE)?"
    back: "PNEE features: eyes closed during event (eyes typically open in epileptic seizures), waxing/waning intensity, pelvic thrusting, side-to-side head movement, prolonged duration (>2 min), preserved awareness during bilateral convulsive movements, crying during/after event, no post-ictal confusion. Definitive diagnosis: video-EEG monitoring.\n\nPNEE (previously called pseudoseizures) are not volitional. They commonly coexist with epilepsy in 10-20% of patients. Canadian guidelines emphasize delivering the diagnosis compassionately. CBT is the evidence-based treatment. Inappropriate AED treatment causes harm. Video-EEG is the gold standard."
    difficulty: medium
    tags: [PNEE, psychogenic, video-EEG, differential-diagnosis, non-epileptic]
  - front: "What are the special considerations for epilepsy management in pregnancy?"
    back: "Preconception: folic acid 5 mg daily, switch from valproate to safer AED (lamotrigine, levetiracetam). During pregnancy: monitor AED levels (especially lamotrigine which decreases significantly), avoid polytherapy, plan delivery at tertiary centre. Postpartum: readjust doses, breastfeeding generally safe with most AEDs.\n\nValproate is Category X — NTD risk 1-2%, autism risk, and mean IQ reduction of 6-9 points in exposed children. Canadian epilepsy and SOGC guidelines mandate contraception counselling for all women on AEDs. The Canadian Epilepsy Pregnancy Registry provides outcome data. Lamotrigine levels drop 50-60% during pregnancy requiring dose increases."
    difficulty: hard
    tags: [epilepsy-pregnancy, valproate-teratogenicity, folic-acid, lamotrigine, SOGC]
  - front: "What features on history and exam help distinguish seizure from syncope?"
    back: "Seizure: aura (deja vu, epigastric rising), lateral tongue bite, post-ictal confusion >5 min, urinary incontinence, cyanosis during event, tonic-clonic movements >30 seconds. Syncope: prodrome (lightheadedness, warmth, nausea, greying vision), rapid recovery (<1 min), pallor, brief myoclonic jerks (<10 seconds) are common and do not indicate epilepsy.\n\nConvulsive syncope (brief myoclonus from cerebral hypoperfusion) is often misdiagnosed as epilepsy. Lateral tongue bite is highly specific for generalized seizure (PPV >95%). Frontal tongue bite is non-specific. Canadian guidelines recommend ECG in all first seizure presentations to exclude cardiac causes."
    difficulty: medium
    tags: [seizure-vs-syncope, tongue-bite, post-ictal, differential-diagnosis, convulsive-syncope]
  - front: "Define status epilepticus and its threshold for diagnosis."
    back: "Continuous or intermittent seizure activity for greater than 5 minutes without regaining consciousness. It is a life-threatening emergency.\n\nStatus epilepticus represents a failure of normal seizure-terminating mechanisms and can lead to neuronal injury, systemic complications, and death. The 5-minute threshold guides when to initiate aggressive treatment. The prior 30-minute threshold has been shortened given evidence of injury with prolonged seizures."
    difficulty: easy
    tags: [seizure, status epilepticus, emergency, neurology]
  - front: "What is the first-line treatment for status epilepticus in the emergency department?"
    back: "Benzodiazepine — lorazepam 2 mg IV push up to 10 mg, OR midazolam 5 mg IM up to 10 mg. Repeat at 10 minutes if ineffective. Use intranasal route if no IV/IO access.\n\nBenzodiazepines enhance GABA-mediated inhibition to terminate seizures. IV lorazepam and IM midazolam are both effective; randomized trials showed IM midazolam is non-inferior to IV lorazepam with faster delivery in the prehospital setting. Early administration is critical."
    difficulty: medium
    tags: [status epilepticus, benzodiazepine, lorazepam, midazolam]
  - front: "What is the second-line treatment if benzodiazepines fail to terminate status epilepticus?"
    back: "Phenytoin 20 mg/kg IV at 25–50 mg/min in adults; may give additional 10 mg/kg IV 10 min after loading infusion. Patient must be on cardiac monitor (risk of dysrhythmias and hypotension).\n\nIf benzodiazepines fail, phenytoin (or fosphenytoin) is given as the second-line antiepileptic. Levetiracetam (loading dose 60 mg/kg IV, max 4500 mg over 5–15 min) is an alternative or adjunct for seizure prevention after resolution. Phenytoin requires cardiac monitoring due to risk of dysrhythmias and hypotension."
    difficulty: medium
    tags: [status epilepticus, phenytoin, second-line, antiepileptic]
  - front: "What is the minimum workup for an adult presenting with a first-time seizure?"
    back: "CBC and differential, blood glucose (POCT capillary), electrolytes, calcium, magnesium, VBG, serum glucose, toxicology screen, antiepileptic drug levels (if relevant), beta-hCG (in women of childbearing age).\n\nThe minimum workup aims to identify reversible metabolic causes (hypoglycemia, electrolyte disturbances), toxic causes, and assess baseline status. Neuroimaging (CT then MRI) and LP are considered based on clinical presentation and risk factors for structural or infectious etiology."
    difficulty: medium
    tags: [seizure, workup, investigations, emergency]
  - front: "How do you clinically differentiate syncope from a seizure?"
    back: "Seizure: preceded by aura, tonic-clonic movements, tongue biting (high specificity), loss of bladder/bowel control, postictal period. Syncope: prodrome (presyncope symptoms), postural context, no postictal confusion, myoclonic jerks (a sign of syncope NOT seizure), rapid return to baseline.\n\nMyoclonic jerks during the event are commonly mistaken for seizure activity but are a normal feature of syncope due to cerebral hypoperfusion. The postictal period (confusion, fatigue after the event) is the most reliable clinical distinguishing feature of seizure."
    difficulty: medium
    tags: [syncope, seizure, differential diagnosis]
