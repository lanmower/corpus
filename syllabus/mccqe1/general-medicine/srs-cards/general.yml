    back: "Chlamydia (most common), gonorrhea (2nd most common), HPV\n\nThese three infections account for the majority of STI cases in Canadian clinical practice."
    difficulty: easy
    tags: [STI, epidemiology, Canada, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
