# Gr 9 Maths CAPS — numbers / Integers
deck: "Corpus::Gr9 Maths::Integers"
notes:
  - guid: 3a1f9c4b7e2d0581
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "What are integers? Give examples and where they sit on the number line."
      Back: "Integers are the whole numbers together with their negatives and zero:\n… −3, −2, −1, 0, 1, 2, 3 …\nThey include positive integers (right of 0), negative integers (left of 0) and zero (neither positive nor negative).\nOn a number line, numbers increase to the right and decrease to the left, so −5 < −2 < 0 < 3."
    tags: ["integers-definition", "subject:numbers"]
  - guid: 8d2e6a01f5b3c794
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "How do you compare two negative integers, e.g. which is greater: −8 or −3?"
      Back: "On the number line the number further to the RIGHT is greater.\n−3 lies to the right of −8, so −3 > −8.\nWarning: with negatives the bigger digit is the smaller number. −8 is smaller than −3 even though 8 > 3.\nAnswer: −3 is greater."
    tags: ["comparing-integers", "subject:numbers"]
  - guid: 1c7b4f9028e6a3d5
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Add integers with the SAME sign: rule and example −6 + (−4)."
      Back: "Same signs → ADD the values and KEEP the common sign.\n−6 + (−4):\nBoth negative, so add 6 + 4 = 10, keep the minus.\n= −10\nThink: going 6 steps left, then 4 more steps left → 10 steps left of 0."
    tags: ["adding-integers", "subject:numbers"]
  - guid: 5e9a2d6c1b8f4073
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Add integers with DIFFERENT signs: rule and example −9 + 5."
      Back: "Different signs → SUBTRACT the smaller value from the larger, and KEEP the sign of the number with the larger value.\n−9 + 5:\nLarger value is 9 (negative). 9 − 5 = 4, keep minus.\n= −4\nCheck on number line: start at −9, move 5 right → −4."
    tags: ["adding-integers", "subject:numbers"]
  - guid: a0f3c8b25d7e1469
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "State the \"keep–change–change\" rule for subtracting integers."
      Back: "To SUBTRACT an integer, turn it into an ADDITION:\n1. KEEP the first number.\n2. CHANGE the subtraction sign to addition.\n3. CHANGE the sign of the second number.\nThen apply the addition rules.\nExample: 7 − (−2) → 7 + (+2) = 9.\nExample: −5 − 3 → −5 + (−3) = −8."
    tags: ["subtracting-integers", "subject:numbers"]
  - guid: 6b1d9e4a3c8f5072
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Why does subtracting a negative equal adding? Evaluate 4 − (−6)."
      Back: "Subtracting a negative removes a debt, which increases the value, so − (−) = +.\n4 − (−6) = 4 + 6 = 10.\nTwo minus signs next to each other (a \"double negative\") become a plus:\n−(−6) = +6.\nMistake to avoid: writing 4 − 6 = −2. The two negatives must first become a plus."
    tags: ["double-negatives", "subject:numbers"]
  - guid: 2f8c5b0e7a934d61
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Simplify a chain of additions and subtractions: −3 + 8 − (−5) − 11."
      Back: "First change all subtractions to additions:\n−3 + 8 − (−5) − 11\n= −3 + 8 + 5 + (−11)\nWork left to right:\n−3 + 8 = 5\n5 + 5 = 10\n10 + (−11) = −1\nAnswer: −1.\nTip: you may add all positives (8 + 5 = 13) and all negatives (−3 − 11 = −14), then 13 − 14 = −1."
    tags: ["adding-integers", "subject:numbers"]
  - guid: 9a4e1c7b6d2f5803
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "State the sign rules for MULTIPLYING and DIVIDING two integers."
      Back: "Same signs → POSITIVE answer.\nDifferent signs → NEGATIVE answer.\n(+)(+) = +    (−)(−) = +\n(+)(−) = −    (−)(+) = −\nThe same rules hold for division.\nMemory aid: \"a friend (+) of my enemy (−) is my enemy (−); an enemy of my enemy is my friend.\""
    tags: ["multiplying-dividing", "subject:numbers"]
  - guid: c3071f9b8a5e2d46
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Evaluate −7 × 4 and −6 × −8."
      Back: "−7 × 4: different signs → negative. 7 × 4 = 28 → −28.\n−6 × −8: same signs → positive. 6 × 8 = 48 → +48.\nWork out the digits first, then decide the sign from the rule."
    tags: ["multiplying-dividing", "subject:numbers"]
  - guid: 7d2a8f0c4b9e1635
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Evaluate the divisions: −48 ÷ 6 and −72 ÷ −9."
      Back: "−48 ÷ 6: different signs → negative. 48 ÷ 6 = 8 → −8.\n−72 ÷ −9: same signs → positive. 72 ÷ 9 = 8 → +8.\nDivision follows exactly the same sign rules as multiplication."
    tags: ["multiplying-dividing", "subject:numbers"]
  - guid: 4b9e0d3a1c6f7852
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Find the sign of a PRODUCT of several integers: (−2)(−3)(−1)(4)."
      Back: "Count the negative factors. An EVEN number of negatives → positive; an ODD number → negative.\n(−2)(−3)(−1)(4): three negatives → ODD → answer is negative.\nValues: 2 × 3 × 1 × 4 = 24.\nAnswer: −24."
    tags: ["multiplying-dividing", "subject:numbers"]
  - guid: e1c6b40a9d2f7385
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "What is the difference between (−3)² and −3² ? Evaluate both."
      Back: "The brackets decide what gets squared.\n(−3)² means (−3) × (−3) = +9. The whole −3 is squared.\n−3² means −(3 × 3) = −9. Only the 3 is squared; the minus stays in front.\nSo (−3)² = 9 but −3² = −9.\nThis is a very common exam trap — always check for brackets."
    tags: ["exponents-of-negatives", "subject:numbers"]
  - guid: 0a7f3c8b2e951d64
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Evaluate (−2)³ and (−2)⁴. What pattern decides the sign of a power of a negative?"
      Back: "(−2)³ = (−2)(−2)(−2) = −8.\n(−2)⁴ = (−2)(−2)(−2)(−2) = +16.\nPattern: a negative base raised to an EVEN power is positive; raised to an ODD power is negative.\nOdd exponent → odd number of negative factors → negative result."
    tags: ["exponents-of-negatives", "subject:numbers"]
  - guid: 8c4b1f0e6a3d9275
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Give the order of operations (BODMAS) used with integers."
      Back: "Work in this order:\nB – Brackets\nO – Of / Orders (exponents, roots)\nD – Division\nM – Multiplication\nA – Addition\nS – Subtraction\nDivision and Multiplication rank equally (left to right); Addition and Subtraction rank equally (left to right).\nApply the integer sign rules at each step."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: 2d9a5c0b7e4f1386
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Evaluate using BODMAS: −12 + 3 × (−4)."
      Back: "Multiplication before addition:\n3 × (−4) = −12 (different signs → negative).\nNow: −12 + (−12) = −24.\nMistake to avoid: doing −12 + 3 = −9 first, then × (−4) = 36. Multiplication must be done before the addition."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: 5f0c8b3a1d6e9472
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Evaluate: (−5 + 2)² − (−4)."
      Back: "Brackets first: −5 + 2 = −3.\nExponent: (−3)² = 9.\nNow the subtraction of a negative: 9 − (−4) = 9 + 4 = 13.\nAnswer: 13."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: 9e3a7c1b0d5f8264
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Evaluate: −20 ÷ (−4) + (−3) × 2."
      Back: "Division and multiplication first (left to right):\n−20 ÷ (−4) = 5 (same signs → positive).\n(−3) × 2 = −6 (different signs → negative).\nNow add: 5 + (−6) = −1.\nAnswer: −1."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: 3b8f2d9a4c0e7165
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Temperature word problem: At 06:00 the temperature was −4 °C. By midday it rose by 11 °C, then dropped 6 °C by evening. Find the evening temperature."
      Back: "Translate to integers and work left to right:\nStart: −4\nRose 11 °C: −4 + 11 = 7\nDropped 6 °C: 7 − 6 = 1\nEvening temperature = 1 °C.\nA rise means add; a drop means subtract."
    tags: ["word-problems", "subject:numbers"]
  - guid: 6c1e9b4a0d3f8527
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Bank balance word problem: Thabo's account is R250 in debit (−R250). He deposits R400, then withdraws R180. What is the new balance?"
      Back: "Debit means a negative balance.\nStart: −250\nDeposit R400 (add): −250 + 400 = 150\nWithdraw R180 (subtract): 150 − 180 = −30\nNew balance = −R30, i.e. R30 in debit (overdrawn)."
    tags: ["word-problems", "subject:numbers"]
  - guid: a4d0c7b91e2f6385
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Altitude word problem: A diver is 18 m below sea level (−18 m). A bird flies 25 m above sea level (+25 m). What is the vertical distance between them?"
      Back: "Distance = difference between the two positions.\n25 − (−18) = 25 + 18 = 43.\nThe vertical distance is 43 m.\nSubtracting the negative (−18) adds it on, which makes sense: you cross 18 m to reach the surface, then 25 m more to the bird."
    tags: ["word-problems", "subject:numbers"]
  - guid: f2b8d4a06c1e9573
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "What is the additive inverse (opposite) of an integer, and what is −(−7)?"
      Back: "The additive inverse of a number is the number that adds to it to give 0.\nThe inverse of 7 is −7, because 7 + (−7) = 0.\nThe inverse of −7 is +7.\nSo −(−7) = 7. The minus sign in front means \"the opposite of\", and the opposite of −7 is 7."
    tags: ["double-negatives", "subject:numbers"]
  - guid: 70c3f9b1a8d2e546
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Integers"
    fields:
      Front: "Common mistake check: evaluate −6 − (−6) and −6 + (−6)."
      Back: "−6 − (−6): change to addition → −6 + 6 = 0.\n−6 + (−6): same signs, add and keep sign → −12.\nNotice how one sign change flips the answer from 0 to −12. Always rewrite subtraction of a negative as addition before calculating."
    tags: ["double-negatives", "subject:numbers"]
