    tags: [diabetes, T2DM, UKPDS, metformin, first-line-therapy, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In the 4T Trial, which insulin regimen had the highest rate of patient withdrawal?"
    back: "Prandial insulin aspart had the highest withdrawal rate at 11.7%, compared to 8.5% for basal and 5.1% for biphasic (P=0.4).\n\nThe 4T Trial showed significant differences in withdrawal rates (P=0.04), with prandial regimen having the highest dropout rate, possibly due to the burden of thrice-daily injections."
    difficulty: medium
