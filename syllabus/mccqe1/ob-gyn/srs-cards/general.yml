  - front: "What are alternative second-line treatments for bacterial vaginosis?"
    back: "Metronidazole 2 g PO single dose, OR clindamycin 300 mg PO BID x 7 days\n\nThese are second-line options when first-line treatments (7-day metronidazole or clindamycin cream) fail or are not suitable."
