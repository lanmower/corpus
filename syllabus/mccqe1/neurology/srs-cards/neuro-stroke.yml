    back: "Abnormal stool frequency (>3/day or <3/week), abnormal stool form (lumpy/hard/loose/watery) >25% of defecations, abnormal stool passage (straining, urgency, incomplete evacuation) >25%, passage of mucus >25%, and bloating\n\nThese supportive symptoms help characterize IBS subtype and severity but are not required for diagnosis per Rome IV criteria."
