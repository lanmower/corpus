  - front: "What conditions are associated with gynecomastia? (4 major categories)"
    back: "Drugs, congenital (Klinefelter syndrome), tumors (especially germ cell tumors), and chronic diseases (cirrhosis, CKD)\n\nThese conditions alter estrogen/androgen balance or metabolism."
