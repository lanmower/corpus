# Family Medicine Fever (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the diagnostic temperature thresholds for fever in adults?"
    back: "Oral temperature >37.2°C (AM) or >37.7°C (PM); rectal temperature 37.5°C–38.3°C; axillary temperature >37.2°C.\n\nFever thresholds vary by measurement site and time of day due to normal diurnal variation. Rectal temperature is the gold standard in children <2 years; tympanic membrane (TM) measurement is not accurate until age >5 years."
    difficulty: easy
    tags: [fever, definitions, temperature, pediatrics, family-medicine]
  - front: "Why is a rectal temperature required for children <2 years old with fever, and when does TM temperature become reliable?"
    back: "Rectal temperature is required in children <2 yr for accuracy. Tympanic membrane (TM) measurement is not accurate until the child is >5 years old.\n\nYoung children have ear canal anatomy and compliance that makes TM infrared readings unreliable. Rectal measurement directly reflects core temperature, which is the most clinically relevant in febrile young infants where early sepsis detection is critical."
    difficulty: easy
    tags: [fever, pediatrics, temperature-measurement, family-medicine]
  - front: "List the four main categories of differential diagnosis for fever."
    back: "1. Infection (bacterial, viral, other)\n2. Cancer (leukemia, lymphoma, other malignancies)\n3. Medications (e.g., allopurinol, captopril, cimetidine, heparin, INH, meperidine, nifedipine, phenytoin, diuretics, barbiturates, antihistamines)\n4. Other (Inflammatory Bowel Disease, Collagen Vascular Disease)\n\nDrug-induced fever is often overlooked; offending agents include many common medications. Always review the medication list in a patient with unexplained fever. Neoplasms cause fever through cytokine release and tumour necrosis."
    difficulty: medium
    tags: [fever, differential-diagnosis, medications, family-medicine]
  - front: "What investigations are appropriate in the workup of a febrile patient?"
    back: "CBC and differential, blood culture, urine culture, urinalysis; viral swab (influenza, COVID-19); stool O&P, Gram stain, culture; CXR, Mantoux skin test, sputum culture; lumbar puncture (if meningitis suspected).\n\nInvestigation should be guided by history and examination findings to identify the source. Lumbar puncture is reserved for suspected meningitis/encephalitis. A comprehensive initial screen helps narrow the differential between infectious, inflammatory, and malignant causes."
    difficulty: medium
    tags: [fever, investigations, family-medicine]
  - front: "What is the management of fever in the outpatient setting?"
    back: "Increase fluid intake; general cooling measures (sponge bath, light clothing); acetaminophen or ibuprofen as needed; treat the underlying cause.\n\nAntipyretics provide symptomatic relief and reduce metabolic demand. Treating the underlying cause is essential — antibiotics only if bacterial infection confirmed or strongly suspected. Aspirin is avoided in children due to Reye syndrome risk."
    difficulty: easy
    tags: [fever, management, antipyretics, family-medicine]
