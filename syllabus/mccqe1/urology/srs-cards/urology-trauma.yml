# Urology Trauma (Urology) - generated from srs-mccqe1
cards:
  - front: "In a trauma patient, what findings suggest urethral injury and make urethral catheterization contraindicated?"
    back: "Blood at the urethral meatus, scrotal hematoma, and/or high-riding prostate on DRE. Catheterization is contraindicated unless performed by urology.\n\nThese findings suggest urethral disruption, usually from pelvic fractures. Blind urethral catheterization risks converting a partial tear to a complete one. A retrograde urethrogram (RUG) should be performed to delineate the injury before any catheterization attempt."
    difficulty: medium
    tags: [urethral injury, trauma, catheterization, contraindication, pelvic fracture]
  - front: "What are the classification and common etiologies of renal trauma?"
    back: "Classification: Minor (contusions, superficial lacerations/hematomas—90% of blunt trauma) and Major (medullary/collecting system laceration, major vascular injury, shattered kidney). Etiology: 80% blunt (MVC, assault, falls), 20% penetrating (stab, gunshot).\n\nDegree of hematuria does NOT correlate with severity of renal injury. CT with contrast (triphasic) is indicated for stable patients. Staging I-V guides management."
    difficulty: easy
    tags: [urology, renal trauma, classification, hematuria]
  - front: "Describe the staging of renal trauma (Grade I–V)."
    back: "Grade I: contusion/hematoma. Grade II: <1 cm laceration, no urinary extravasation. Grade III: >1 cm laceration, no urinary extravasation. Grade IV: laceration causing urinary extravasation and/or main arterial or vein injury with contained hematoma. Grade V: shattered kidney or avulsion of pedicle.\n\nStaging guides management but does not always correlate with clinical status. The majority of renal trauma is now managed conservatively/non-operatively. Absolute surgical indications: hemorrhage with hemodynamic instability. Relative: non-viable tissue, urinary extravasation, vascular injury, expanding perirenal mass."
    difficulty: medium
    tags: [urology, renal trauma, staging, grading]
  - front: "What are the absolute and relative surgical indications for renal trauma?"
    back: "Absolute: hemorrhage with hemodynamic instability. Relative: non-viable tissue, major laceration, urinary extravasation, vascular injury, expanding or pulsating perirenal mass.\n\nThe trend is toward non-operative management of renal trauma using angiography and embolization when possible. Microscopic hematuria with isolated minor injuries can be managed without hospitalization. Gross hematuria with contusion requires hospitalization and bedrest."
    difficulty: medium
    tags: [urology, renal trauma, surgical indications, management]
  - front: "What is the most common cause of bladder trauma, and how does it present?"
    back: "Blunt trauma (MVC, falls, crush injury); associated with pelvic fracture in 97% of blunt bladder trauma cases. Presentation: gross hematuria (90%), abdominal tenderness, distention, peritonitis, inability to void, suprapubic pain.\n\nBladder trauma types: contusion (no extravasation), intraperitoneal rupture (bladder dome, requires surgical repair), extraperitoneal rupture (anterior/lateral wall, typically managed non-operatively with Foley catheter). Mortality ~20%, usually from associated injuries."
    difficulty: medium
    tags: [urology, bladder trauma, pelvic fracture, hematuria]
  - front: "How is intraperitoneal bladder rupture managed differently from extraperitoneal rupture?"
    back: "Intraperitoneal rupture: usually requires surgical repair and suprapubic catheterization. Extraperitoneal rupture: typically non-operative with Foley catheter insertion followed by cystogram; surgery if infected urine, rectal/vaginal perforation, bony spike, bladder neck involvement, or failed conservative management.\n\nIntraperitoneal rupture often involves the bladder dome and urine leaks freely into the peritoneum causing peritonitis. CT cystogram (including post-drainage films) is the key diagnostic investigation."
    difficulty: hard
    tags: [urology, bladder trauma, intraperitoneal, extraperitoneal, management]
  - front: "What are the classic clinical features of urethral injury?"
    back: "Blood at urethral meatus, high-riding prostate on DRE, butterfly perineal hematoma, penile/scrotal hematoma, sensation of voiding without urinary output, distended bladder.\n\nAll patients with suspected urethral injury should undergo retrograde urethrogram (RUG) before catheterization. Posterior urethral injury (membranous-prostatic junction) is associated with pelvic fractures/MVCs. Anterior urethral injury (bulbar) occurs with straddle injury."
    difficulty: easy
    tags: [urology, urethral injury, trauma, butterfly hematoma, RUG]
  - front: "What is the initial investigation and management principle for suspected urethral injury?"
    back: "Initial investigation: retrograde urethrogram (RUG) or cystoscopy BEFORE attempting catheterization. Management: simple contusions (no treatment), partial disruption (gentle catheterization by urologist or suprapubic cystostomy), complete disruption (immediate repair if stable; suprapubic tube if unstable, delayed repair).\n\nBlind catheterization risks converting partial to complete disruption. The most common complication is urethral stricture. Posterior urethral injury from pelvic fracture has the classic triad: blood at meatus, high-riding prostate, inability to void."
    difficulty: medium
    tags: [urology, urethral injury, RUG, management, stricture]
