# Family Medicine Bronchitis (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What is the etiology of acute bronchitis, and what is the evidence base for antibiotic use?"
    back: "80% viral (rhinovirus, coronavirus, adenovirus, influenza, parainfluenza, RSV), 20% bacterial (M. pneumoniae, C. pneumoniae, S. pneumoniae). Current literature does NOT support routine antibiotic use in acute bronchitis because it is most often viral. Antibiotics may be useful for those with comorbidities, suspected pneumonia, sepsis, or older adults. Antibiotics show no benefit in children.\n\nAcute bronchitis is the 5th most common diagnosis in family medicine. The most common cause is URTI. A key clinical point: purulent sputum does NOT indicate bacterial infection — viral bronchitis commonly produces mucopurulent sputum. CXR should be ordered only if pneumonia is suspected (abnormal vitals, localized chest findings)."
    difficulty: easy
    tags: [acute bronchitis, antibiotics, viral, family medicine, antimicrobial stewardship]
