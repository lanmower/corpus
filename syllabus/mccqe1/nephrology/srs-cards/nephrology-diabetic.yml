# Nephrology Diabetic (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What is the most common cause of end-stage renal disease in North America?"
    back: "Diabetic nephropathy (diabetic progressive glomerulosclerosis) is the most common cause of ESRD in North America.\n\nApproximately 50% of patients with diabetes will develop nephropathy. Diabetic nephropathy is a slow, progressive increase in albuminuria followed later by a decrease in eGFR. It is associated with HTN and retinopathy (especially type 1 DM) and neuropathy (especially type 2 DM). Indigenous Canadians with diabetes have 2.59 times higher risk of ESRD than non-Indigenous people with diabetes."
    difficulty: easy
    tags: [nephrology, diabetic nephropathy, ESRD, diabetes, epidemiology]
  - front: "What are the four stages of diabetic progressive glomerulosclerosis (Mogensen stages)?"
    back: "Stage 1: Increased GFR (120-150%, compensatory hyperfiltration), normal albumin. Stage 2: No detectable albuminuria, slight increase in mesangial matrix. Stage 3 (incipient nephropathy): A2 albuminuria (30-300 mg/24h; ACR 2.0-20 mg/mmol), normal GFR. Stage 4 (overt nephropathy): A3 albuminuria (>300 mg/24h; ACR >20 mg/mmol), declining GFR, sclerosed glomeruli (<20% of filtration surface area).\n\nOnce A3 albuminuria is established, 50% of patients reach ESRD within 7-10 years. The classic pathological lesion is Kimmelstiel-Wilson nodular glomerulosclerosis (15-20%); more common is diffuse glomerulosclerosis with uniform increase in mesangial matrix."
    difficulty: hard
    tags: [nephrology, diabetic nephropathy, albuminuria, stages, GFR, Kimmelstiel-Wilson]
  - front: "What features in a patient with diabetes suggest a non-diabetic cause of renal disease?"
    back: "1. Rising creatinine with little/no proteinuria. 2. Lack of retinopathy or neuropathy (retinopathy precedes nephropathy in ~80% type 1 DM, ~50% type 2 DM). 3. Persistent hematuria (microscopic or macroscopic). 4. Signs/symptoms of other systemic disease. 5. Time course disproportionate to diabetes duration (e.g., rapidly rising Cr in short-duration DM). 6. Family history of non-diabetic renal disease (e.g., PKD, Alport's).\n\nThese red flags prompt investigation for alternative diagnoses such as IgA nephropathy, membranous nephropathy, lupus nephritis, or hereditary nephropathy. Retinopathy almost always precedes nephropathy in type 1 DM, so nephropathy without retinopathy strongly suggests a non-diabetic etiology."
    difficulty: medium
    tags: [nephrology, diabetic nephropathy, differential diagnosis, retinopathy, hematuria]
  - front: "What is the first-line treatment for hypertension in diabetic nephropathy and what is the blood pressure target?"
    back: "First-line: ACEI or ARB (provide renoprotection even in normotensive diabetic nephropathy). Second-line: dihydropyridine calcium channel blockers. Target BP: <130/80 mmHg. Combination of ACEI and ARB is NOT recommended.\n\nACEI/ARBs reduce intraglomerular pressure by dilating the efferent arteriole, decreasing proteinuria and slowing nephropathy progression independent of BP lowering. Serum Cr can safely rise up to 30% with initiation — usually stabilizes after 2-4 weeks. If >30% rise or hyperkalemia develops, discontinue and consider second-line agent. Monitor K+ and Cr within 1 week of initiation."
    difficulty: easy
    tags: [nephrology, diabetic nephropathy, ACEI, ARB, blood pressure, renoprotection]
  - front: "What SGLT2 inhibitors are indicated for renoprotection in diabetic nephropathy and what is their mechanism?"
    back: "Canagliflozin, dapagliflozin, and empagliflozin provide renoprotection independent of glycemic effects. Indicated in type 2 DM with CKD and eGFR ≥20 mL/min/1.73m², and in CKD with ACR ≥20 mg/mmol or heart failure irrespective of albuminuria level. Mechanism: reduce intraglomerular pressure via tubuloglomerular feedback (reduced glucose/sodium reabsorption → increased macula densa NaCl → afferent arteriolar constriction).\n\nThe CREDENCE trial demonstrated canagliflozin reduces renal outcomes in type 2 DM with diabetic nephropathy. SGLT2i also reduce risk of heart failure hospitalization and have independent cardiovascular benefits. They should be continued unless not tolerated or kidney replacement therapy is initiated."
    difficulty: medium
    tags: [nephrology, SGLT2 inhibitor, canagliflozin, dapagliflozin, empagliflozin, diabetic nephropathy, CREDENCE trial]
  - front: "What are the four renal complications of diabetes?"
    back: "1. Progressive glomerulosclerosis (Kimmelstiel-Wilson nodular and diffuse). 2. Accelerated atherosclerosis (decreased GFR, increased ATN risk with contrast). 3. Autonomic neuropathy (atonic bladder → functional obstruction, urinary retention, infection, obstructive nephropathy). 4. Papillary necrosis (ischemic necrosis of medullary papillae in type 1 DM; sloughed papillae may obstruct ureter, present as renal colic).\n\nDiabetic papillary necrosis occurs due to ischemia of the vasa recta that supply the papillae. Sloughed papillae can obstruct the ureter causing renal colic or hydronephrosis. Autonomic neuropathy leading to atonic bladder promotes stasis and recurrent UTIs, causing obstructive nephropathy."
    difficulty: medium
    tags: [nephrology, diabetes, papillary necrosis, autonomic neuropathy, glomerulosclerosis, complications]
  - front: "What referral criteria to a nephrologist are recommended for patients with CKD and diabetes?"
    back: "Refer if: ACR >60 mg/mmol, eGFR <30 mL/min, progressive loss of kidney function, inability to achieve BP targets, or inability to stay on ACEI or ARB.\n\nThese criteria reflect high-risk features requiring specialist involvement for optimization of CKD management, consideration of dialysis preparation, and management of complications beyond primary care scope. Early referral (eGFR <30 rather than waiting for ESRD) allows for timely dialysis access planning and transplant evaluation."
    difficulty: easy
    tags: [nephrology, CKD, diabetes, nephrology referral, ACR, eGFR]
  - front: "What is the GLP-1 receptor agonist's role in type 2 DM with CKD?"
    back: "A long-acting GLP-1 RA should be used in adults with type 2 DM and CKD who have not achieved glycemic targets despite metformin and SGLT2 inhibitor, or who are unable to use these agents. Prioritize GLP-1 RA agents with documented CV benefits (e.g., semaglutide, liraglutide).\n\nGLP-1 RAs provide weight loss, glucose lowering, and cardiovascular protection. They are third-line after metformin and SGLT2i in type 2 DM with CKD. Their renal benefits are partly via BP reduction, weight loss, and direct anti-inflammatory/anti-fibrotic effects. Dose adjustment may be needed in advanced CKD."
    difficulty: medium
    tags: [nephrology, GLP-1 receptor agonist, semaglutide, type 2 DM, CKD, renoprotection]
  - front: "What is the finerenone indication in CKD?"
    back: "Finerenone (a non-steroidal mineralocorticoid receptor antagonist) provides renoprotection on top of RAAS blockade in CKD, particularly in type 2 DM with diabetic nephropathy.\n\nFinerenone differs from spironolactone/eplerenone in being non-steroidal with greater selectivity for the mineralocorticoid receptor, reducing off-target sex-hormone side effects. It reduces proteinuria, slows CKD progression, and reduces cardiovascular events. It is used on top of ACEI or ARB, not as a replacement."
    difficulty: medium
    tags: [nephrology, finerenone, mineralocorticoid receptor antagonist, CKD, diabetic nephropathy, RAAS]
