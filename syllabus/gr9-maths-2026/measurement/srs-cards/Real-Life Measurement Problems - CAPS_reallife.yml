# Gr 9 Maths CAPS — measurement / Real-Life Measurement Problems
deck: "Corpus::Gr9 Maths::Real-Life Measurement Problems"
notes:
  - guid: b4d6f8a0c2137e59
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Real-Life Measurement Problems"
    fields:
      Front: "FENCING: a rectangular garden is 15 m by 9 m. Fencing costs R45 per metre. Find the total cost."
      Back: "Fencing follows the PERIMETER.\nP = 2(ℓ + b) = 2(15 + 9) = 2 × 24 = 48 m.\nCost = 48 × R45 = R2 160.\nKey: fencing/edging/border problems use PERIMETER (length), then multiply by cost per metre."
    tags: ["real-life", "fencing", "perimeter", "subject:measurement"]
  - guid: 7e9a1c3f5b08d246
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Real-Life Measurement Problems"
    fields:
      Front: "TILING: a floor is 4 m by 3 m. Tiles cost R120 per m². Find the cost to tile the floor."
      Back: "Tiling/covering follows AREA.\nA = ℓ × b = 4 × 3 = 12 m².\nCost = 12 × R120 = R1 440.\nKey: covering a surface (tiles, carpet, paint, grass) uses AREA, then multiply by cost per m²."
    tags: ["real-life", "tiling", "area", "subject:measurement"]
  - guid: 1a3c5e7f9b024d68
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Real-Life Measurement Problems"
    fields:
      Front: "How many 25 cm × 25 cm tiles are needed to cover a 4 m × 3 m floor?"
      Back: "Method: total area ÷ area of one tile (use same units!).\nFloor = 4 m × 3 m = 12 m² = 120 000 cm² (since 1 m² = 10 000 cm²).\nOne tile = 25 × 25 = 625 cm².\nNumber of tiles = 120 000 ÷ 625 = 192 tiles.\nPitfall: convert to the same unit first; in real life round UP to a whole tile."
    tags: ["real-life", "tiling", "number-of-tiles", "subject:measurement"]
  - guid: 4c6e8a0b2d15f397
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Real-Life Measurement Problems"
    fields:
      Front: "PAINTING: a wall is 5 m by 3 m. One litre of paint covers 8 m². How many litres are needed for one coat?"
      Back: "Area to paint = 5 × 3 = 15 m².\nPaint needed = area ÷ coverage = 15 ÷ 8 = 1,875 litres.\nIn practice you must buy a whole/round amount, so round UP to 2 litres.\nKey: painting uses AREA ÷ coverage rate; round up so you don't run short."
    tags: ["real-life", "painting", "area", "subject:measurement"]
  - guid: 9c1e3a5f7b08d264
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Real-Life Measurement Problems"
    fields:
      Front: "How do you decide whether a real-life problem needs PERIMETER or AREA?"
      Back: "Ask: am I going AROUND the edge, or COVERING the surface?\nPERIMETER (length, e.g. m): fencing, edging/trim, skirting, border, length of ribbon/rope around.\nAREA (squared units, e.g. m²): tiling, carpeting, painting, planting grass, glass for a window, cost per m².\nWrong choice is the most common exam error — read the context carefully."
    tags: ["real-life", "perimeter-vs-area", "subject:measurement"]
  - guid: 2e4a6c8b0d137f59
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Real-Life Measurement Problems"
    fields:
      Front: "COST PER m²: a plot of land of 250 m² sells for R375 000. Find the price per square metre."
      Back: "Price per m² = total cost ÷ area.\n= R375 000 ÷ 250 = R1 500 per m².\nReverse use: if you know the rate, multiply by the area to get the total cost (e.g. 250 × R1 500 = R375 000)."
    tags: ["real-life", "cost-per-m2", "subject:measurement"]
  - guid: 5a7c9e1b3d048f26
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Real-Life Measurement Problems"
    fields:
      Front: "BORDER/PATH: a 10 m × 8 m lawn has a 1 m wide paved path around the OUTSIDE. Find the area of the path."
      Back: "Outer rectangle adds 1 m on every side: (10 + 2) × (8 + 2) = 12 × 10 = 120 m².\nInner lawn = 10 × 8 = 80 m².\nPath area = outer − inner = 120 − 80 = 40 m².\nPitfall: a border adds the width on BOTH sides, so add 2 × (path width) to each dimension."
    tags: ["real-life", "border-path", "area", "subject:measurement"]
