  - front: "What is the baseline ECG recommendation when prescribing SSRIs?"
    back: "Baseline ECG is suggested due to QT interval prolongation risk\n\nSome SSRIs (particularly citalopram) can prolong QT interval, necessitating baseline ECG in at-risk patients."
    difficulty: medium
