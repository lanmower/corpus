  - front: "What is the differential diagnosis of dysuria?"
    back: "Infectious (cystitis, urethritis, prostatitis, epididymitis, cervicitis, vulvovaginitis, TB), Neoplasm (bladder, prostate, penis, vagina/vulva, BPH), Calculi (bladder, urethral, ureteral stone), Inflammatory (reactive arthritis, interstitial cystitis, CPPS, drugs), Hormonal (endometriosis, hypoestrogenism), Trauma (catheter, post-coital cystitis), Psychogenic, Other (foreign body, radiation cystitis, contact sensitivity).\n\nUTI is the most common cause, but non-infectious causes must be considered especially in recurrent or treatment-refractory dysuria. Urethral discharge should be tested for gonorrhea and chlamydia; vaginal discharge warrants wet mount."
    difficulty: easy
    tags: [dysuria, cystitis, urethritis, differential diagnosis, urology]
