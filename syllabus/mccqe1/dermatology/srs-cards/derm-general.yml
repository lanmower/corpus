  - front: "What are the characteristic primary and secondary lesions of scabies?"
    back: "Primary: superficial linear burrows; Secondary: small urticarial crusted papules, eczematous plaques, excoriations\n\nScabies presents with characteristic burrows (linear tracks where mites tunnel) and secondary lesions from hypersensitivity reactions to mite antigens."
    difficulty: easy
