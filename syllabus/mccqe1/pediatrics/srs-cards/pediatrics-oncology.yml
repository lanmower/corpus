# Pediatrics Oncology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the most commonly diagnosed cancer in children aged 0-14 years in Canada?"
    back: "Leukemia\n\nLeukemia is the most common pediatric cancer, with ALL accounting for 80% of cases, AML 15%, CML <5%, and CLL <1%. Children with Down syndrome are 15× more likely to develop leukemia."
    difficulty: easy
    tags: [leukemia, pediatric oncology, epidemiology]
  - front: "What percentage of pediatric leukemia cases are Acute Lymphoblastic Leukemia (ALL)?"
    back: "80%\n\nALL is by far the most common pediatric leukemia. AML accounts for 15%, CML <5%, and CLL <1%. The mean age of diagnosis is 4 years but can occur at any age."
    difficulty: easy
    tags: [ALL, leukemia, pediatric oncology]
  - front: "What are the clinical features of leukemia resulting from bone marrow infiltration vs. tissue infiltration?"
    back: "Bone marrow infiltration → bone pain, anemia, neutropenia, thrombocytopenia. Tissue infiltration → lymphadenopathy, hepatosplenomegaly, CNS manifestations, testicular disease.\n\nLeukemic cell infiltration of bone marrow causes failure of normal hematopoiesis. Extramedullary infiltration leads to organomegaly and end-organ dysfunction. CNS symptoms include early morning vomiting, facial weakness, blurred vision, and seizures."
    difficulty: easy
    tags: [leukemia, clinical features, bone marrow failure]
  - front: "What defines hyperleukocytosis and why is it a medical emergency?"
    back: "Hyperleukocytosis is total WBC >100 × 10⁹/L. It is a medical emergency due to hyperviscosity causing leukostasis, leading to ICH, pulmonary leukostasis syndrome, and tumour lysis syndrome.\n\nManagement includes IV fluids, allopurinol/rasburicase, FFP/platelets, induction chemotherapy, and avoiding RBC transfusion unless symptomatic (and then only small volumes). Leukapheresis is used at some centres."
    difficulty: medium
    tags: [hyperleukocytosis, leukemia, oncologic emergency]
  - front: "What is the 5-year survival rate for ALL vs. AML in pediatric patients?"
    back: "ALL: 80-90% 5-year event-free survival. AML: 65% 5-year survival.\n\nALL has excellent prognosis with combination chemotherapy. The most important prognostic variable for ALL is initial response to therapy. Other factors include WBC, age, CNS/testicular disease, immunophenotype, and cytogenetics."
    difficulty: easy
    tags: [leukemia, prognosis, ALL, AML]
  - front: "What is the most important prognostic variable in pediatric ALL?"
    back: "Initial response to therapy\n\nPatients are stratified into standard-risk and high-risk based on WBC and age. Other prognostic factors include presence of CNS/testicular disease, immunophenotype, cytogenetics, and initial response to therapy — which is the most important."
    difficulty: easy
    tags: [ALL, prognosis, leukemia]
  - front: "What are the constitutional ('B') symptoms of Hodgkin lymphoma?"
    back: "Fever, chills, night sweats, and unexplained weight loss ≥10% body weight over 6 months.\n\nConstitutional B symptoms occur in ~30% of pediatric patients with Hodgkin lymphoma. They indicate systemic disease and influence staging and prognosis. Hodgkin lymphoma spreads contiguously."
    difficulty: easy
    tags: [Hodgkin lymphoma, B symptoms, constitutional symptoms]
  - front: "What is the most common presentation of Hodgkin lymphoma in children?"
    back: "Persistent, painless, firm, rubbery cervical or supraclavicular lymphadenopathy.\n\nHodgkin lymphoma has a bimodal incidence peaking at 15-34 and >50 years. It may also present with persistent cough or dyspnea from a mediastinal mass, splenomegaly, or axillary/inguinal lymphadenopathy."
    difficulty: easy
    tags: [Hodgkin lymphoma, lymphadenopathy, pediatric oncology]
  - front: "How is Hodgkin lymphoma definitively diagnosed?"
    back: "Histological examination of a biopsy specimen — excisional biopsy of enlarged lymph node (preferred), incisional biopsy (acceptable), or multiple core needle biopsies (acceptable).\n\nPET scanning plays an increasing role in assessing early disease response and planning therapy. Investigations include CBC, electrolytes, LDH, ESR, CXR, CT neck/chest/abdomen/pelvis, BM aspirate, and LP."
    difficulty: easy
    tags: [Hodgkin lymphoma, diagnosis, biopsy]
  - front: "What is the 5-year survival rate for pediatric Hodgkin lymphoma?"
    back: ">90%\n\nManagement includes combination chemotherapy and radiation. Recurrent or refractory disease is treated with chemotherapy, targeted therapy, checkpoint inhibitors, hematopoietic stem cell transplant, and involved-site radiation."
    difficulty: easy
    tags: [Hodgkin lymphoma, prognosis, pediatric oncology]
  - front: "How does pediatric Non-Hodgkin Lymphoma (NHL) differ from adult NHL?"
    back: "Pediatric NHL is rapidly growing with distant metastases at presentation, unlike adult NHL. Peak incidence is 7-11 years. Includes Burkitt, diffuse large B-cell, T-cell lymphoblastic, and anaplastic large cell subtypes.\n\nPediatric NHL most commonly involves the abdomen (intussusception), chest (mediastinal mass), and head and neck. Radiation has no added benefit in pediatric protocols. 5-year survival is 75-90%."
    difficulty: medium
    tags: [Non-Hodgkin lymphoma, pediatric oncology, NHL]
  - front: "Why is a patient with a large mediastinal mass at risk during procedures, and how should they be positioned?"
    back: "A mediastinal mass can compress the trachea, SVC, or ventricular outflow when supine, causing cardiac or respiratory arrest. Procedures should be performed with the patient on their side or prone.\n\nThis is a critical complication of mediastinal NHL (and Hodgkin lymphoma). The compression worsens in the supine position, so any procedure requiring sedation or anesthesia carries significant risk and positioning is life-saving."
    difficulty: medium
    tags: [mediastinal mass, NHL, perioperative, positioning]
  - front: "What metabolic abnormalities characterize tumour lysis syndrome?"
    back: "Hyperuricemia, hyperkalemia, and hyperphosphatemia (from rapid breakdown of malignant cells).\n\nTumour lysis syndrome can occur spontaneously or after initiation of chemotherapy. Management includes aggressive IV hydration, allopurinol or rasburicase (for uric acid), and monitoring electrolytes."
    difficulty: easy
    tags: [tumour lysis syndrome, metabolic emergency, oncology]
  - front: "What is the most common primary renal neoplasm of childhood?"
    back: "Wilms' tumour (Nephroblastoma)\n\nWilms' tumour is usually diagnosed between 2-5 years of age. In 5-10% of cases, both kidneys are affected. It is the most common primary renal neoplasm in children."
    difficulty: easy
    tags: [Wilms tumour, nephroblastoma, pediatric oncology]
  - front: "What congenital syndrome is associated with ~50% risk of Wilms' tumour and involves an 11p13 deletion?"
    back: "WAGR syndrome (Wilms' tumour, Aniridia, Genitourinary anomalies, Range of developmental delays)\n\nWAGR syndrome is associated with deletion of chromosome 11p13 and carries approximately 50% risk of Wilms' tumour. Denys-Drash syndrome has the highest risk (~90%)."
    difficulty: medium
    tags: [WAGR syndrome, Wilms tumour, congenital syndromes, 11p13]
  - front: "What are the features of Beckwith-Wiedemann syndrome and its associated cancer risks?"
    back: "Enlargement of body organs (especially macroglossia), hemihypertrophy, renal medullary cysts, adrenal cytomegaly, omphalocele, ear creases, macrosomia. Associated with 5-10% Wilms' tumour risk, hepatoblastoma, adrenocortical tumours, neuroblastomas, and rhabdomyosarcomas.\n\nBeckwith-Wiedemann syndrome is an overgrowth syndrome due to abnormalities in imprinted genes on chromosome 11p15. Regular surveillance with abdominal ultrasound is recommended."
    difficulty: medium
    tags: [Beckwith-Wiedemann syndrome, Wilms tumour, overgrowth syndrome]
  - front: "What is the classic presentation of Wilms' tumour?"
    back: "80% present with an asymptomatic, unilateral abdominal mass. May also present with HTN, gross hematuria, abdominal pain, vomiting, fever, UTI, and anemia.\n\nPulmonary metastases may be present at diagnosis though children rarely present with respiratory symptoms. Imaging starts with abdominal ultrasound, followed by contrast-enhanced CT or MRI chest/abdomen/pelvis."
    difficulty: easy
    tags: [Wilms tumour, clinical features, abdominal mass]
  - front: "What is the 5-year survival rate for Wilms' tumour?"
    back: ">95%\n\nExcellent prognosis is achieved with staging + nephrectomy and chemotherapy (± radiation for advanced disease). The COG approach recommends surgery first; SIOP recommends neoadjuvant chemotherapy first."
    difficulty: easy
    tags: [Wilms tumour, prognosis, nephroblastoma]
  - front: "What is the most common cancer in the first year of life?"
    back: "Neuroblastoma (average age at diagnosis is 2.5 years)\n\nNeuroblastoma arises from neural crest cells (sympathetic neuroblasts) and can originate from any site in the sympathetic nervous system. The most common site is the adrenal gland."
    difficulty: easy
    tags: [neuroblastoma, pediatric oncology, neural crest]
  - front: "What are the paraneoplastic features of neuroblastoma?"
    back: "HTN, palpitations, sweating (from excessive catecholamines); diarrhea, FTT (from VIP secretion); opsomyoclonus (dancing eyes-dancing feet syndrome).\n\nNeuroblastoma secretes catecholamines (measured as urinary HVA and VMA) and can produce VIP. Opsomyoclonus myoclonus is a paraneoplastic syndrome strongly associated with neuroblastoma."
    difficulty: medium
    tags: [neuroblastoma, paraneoplastic, catecholamines, opsomyoclonus]
  - front: "What investigations are used to diagnose neuroblastoma?"
    back: "CBC, electrolytes, urinalysis, serum/urine catecholamine metabolites (HVA and VMA), Cr; imaging: MRI or CT, MIBG scan; biopsy for definitive diagnosis.\n\nDefinitive diagnosis requires either unequivocal histology (small round blue cells, pseudorosettes) OR bone marrow metastases with elevated urinary/serum catecholamines. MIBG scan is specific for neuroblastoma."
    difficulty: easy
    tags: [neuroblastoma, investigations, HVA, VMA, MIBG]
  - front: "What are good prognostic factors for neuroblastoma?"
    back: "Age <18 months, stage I/II/IV-S disease, primary site in posterior mediastinum or neck, more differentiated histology, aneuploidy, absent MYCN oncogene amplification.\n\nPrognosis is often poor due to late detection (>50% present with advanced disease). IV-S is a special classification for infants with widespread disease involving liver, skin, or bone marrow but without cortical bone involvement — these can spontaneously regress."
    difficulty: medium
    tags: [neuroblastoma, prognosis, MYCN, prognostic factors]
  - front: "What histological finding on neuroblastoma biopsy confirms the diagnosis?"
    back: "Small round blue cells with pseudorosettes (Homer Wright rosettes).\n\nAlternatively, the diagnosis can be made if bone marrow aspirate shows metastases along with elevated urinary or serum catecholamines (HVA/VMA). MIBG scan shows uptake in neuroblastoma tissue."
    difficulty: easy
    tags: [neuroblastoma, histology, small round blue cells]
  - front: "What are the three major cancer predisposition syndromes with pediatric onset mentioned in Toronto Notes?"
    back: "Li-Fraumeni syndrome (soft tissue sarcomas, osteosarcoma, CNS tumours, adrenocortical carcinoma), hereditary retinoblastoma, and Fanconi anemia (leukemias and oral cancers).\n\nCancer predisposition syndromes should be suspected in cases of multiple primary neoplasms, early onset cancers, or family history consistent with a known syndrome. Early recognition allows surveillance to limit required therapies."
    difficulty: medium
    tags: [cancer predisposition syndromes, Li-Fraumeni, Fanconi anemia, retinoblastoma]
