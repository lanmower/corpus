# Ent Middle Ear (ENT) - generated from srs-mccqe1
cards:
  - front: "What is a cholesteatoma and what are the two main types?"
    back: "A cyst composed of keratinized desquamated epithelial cells occurring in the middle ear, mastoid, and temporal bone. The two types are congenital and acquired (primary and secondary).\n\nCongenital cholesteatoma appears as a 'small white pearl' behind an intact TM (anterior and medial to the malleus) due to aberrant migration of external canal ectoderm during development. Acquired cholesteatoma is more common and results from retraction pockets or epithelial migration through TM perforations. The progressive destruction of surrounding bone leads to serious complications."
    difficulty: easy
    tags: [otolaryngology, cholesteatoma, middle ear, congenital, acquired]
  - front: "What are the intracranial complications of cholesteatoma?"
    back: "Meningitis, sigmoid sinus thrombosis, intracranial abscess (subdural, epidural, cerebellar), and facial paralysis (CN VII).\n\nCholesteatoma causes progressive enzymatic and pressure-induced destruction of surrounding bone structures. Erosion through the tegmen can lead to meningitis or intracranial abscess. Sigmoid sinus erosion causes thrombosis. Facial canal erosion causes CN VII palsy. Early surgical intervention (mastoidectomy + tympanoplasty) is essential to prevent these life-threatening complications."
    difficulty: medium
    tags: [otolaryngology, cholesteatoma, complications, meningitis, intracranial abscess]
  - front: "What are the local (non-intracranial) complications of cholesteatoma?"
    back: "Ossicular erosion causing CHL, inner ear erosion causing SNHL/dizziness/labyrinthitis, temporal bone infection (mastoiditis, petrositis), and facial paralysis.\n\nCholesteatoma's keratinizing epithelium produces collagenases that erode bone. Ossicular chain destruction is the most common complication, causing conductive hearing loss. Extension into the labyrinth causes sensorineural hearing loss and vestibular symptoms. These complications indicate the need for urgent surgical management."
    difficulty: medium
    tags: [otolaryngology, cholesteatoma, complications, conductive hearing loss, SNHL]
  - front: "What is the definitive treatment for cholesteatoma?"
    back: "Surgical: mastoidectomy + tympanoplasty + ossicular reconstruction.\n\nThere is no medical treatment for cholesteatoma. Surgical excision is required because the lesion is locally destructive and will continue to erode surrounding structures. Mastoidectomy removes infected mastoid air cells and the cholesteatoma. Tympanoplasty repairs the TM, and ossicular reconstruction restores hearing. Audiogram and non-contrast CT of temporal bones are performed preoperatively."
    difficulty: easy
    tags: [otolaryngology, cholesteatoma, treatment, mastoidectomy, tympanoplasty]
  - front: "What is acute mastoiditis, what organisms cause it, and what is the classic clinical triad?"
    back: "Infection (usually subperiosteal) of mastoid air cells, most commonly ~2 weeks after untreated or inadequately treated AOM. Caused by same organisms as AOM: S. pneumoniae, H. influenzae, M. catarrhalis, S. aureus, P. aeruginosa. Classic triad: (1) tenderness to pressure over the mastoid, (2) retroauricular swelling with protruding ear, (3) otorrhea.\n\nMastoiditis is a complication of AOM when bacteria spread from the middle ear into the mastoid air cells. Coalescence occurs when infection destroys the bony septa between air cells. CT shows opacification and interruption of normal trabeculations. Complications of AOM are rare due to widespread antibiotic treatment but mastoiditis is the most common serious complication when AOM is undertreated."
    difficulty: easy
    tags: [otolaryngology, mastoiditis, AOM, pediatric, infections]
  - front: "What are the indications for surgical intervention (cortical mastoidectomy) in acute mastoiditis?"
    back: "Failure of medical treatment after 48 hours, symptoms of intracranial complications, and aural discharge persisting for 4 weeks resistant to antibiotics.\n\nMost acute mastoiditis cases respond to IV antibiotics with myringotomy and ventilation tubes. Cortical mastoidectomy (debridement of infected tissue for aeration and drainage) is reserved for treatment failures. Incision and drainage may be needed for postauricular abscess. Intracranial complications such as meningitis, brain abscess, or sigmoid sinus thrombosis require urgent surgical exploration."
    difficulty: medium
    tags: [otolaryngology, mastoiditis, mastoidectomy, surgical indications]
