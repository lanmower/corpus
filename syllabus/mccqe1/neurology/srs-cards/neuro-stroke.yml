    back: "Combined estrogen-progesterone therapy showed overall health risks exceeded benefits in healthy postmenopausal women. CHD and breast cancer both increased.\n\nWHI findings led to dramatic changes in HRT prescribing, limiting use to lowest effective dose for shortest duration in symptomatic patients."
    difficulty: medium
