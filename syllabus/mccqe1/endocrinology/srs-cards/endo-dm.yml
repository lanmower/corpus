    back: "Initial: FBG, HbA1c, fasting lipids, Cr, urine ACR, baseline ECG. Ongoing: HbA1c q3mo, fasting lipids annually, random urine ACR and Cr annually\n\nRegular monitoring helps assess glycemic control and detect complications early."
    difficulty: medium
    tags: [endocrinology, diabetes, monitoring, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
