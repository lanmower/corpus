  - front: "What is the recommended surveillance protocol for low-grade dysplasia in Barrett's esophagus?"
    back: "Every 6 months for 1 year, then annually\n\nFor low-grade dysplasia, surveillance every 6 months for 1 year then annually is satisfactory, though endoscopic ablation/resection is also an option."
    difficulty: medium
    tags: [Barretts, surveillance, guidelines, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "Define dysphagia"
    back: "Difficulty in swallowing\n\nDysphagia refers to difficulty in swallowing, which can be oropharyngeal (difficulty initiating) or esophageal (inability to move food down)."
    difficulty: easy
    tags: [dysphagia, symptom, definition, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What type of dysphagia suggests mechanical obstruction?"
    back: "Solid food only\n\nSolid food only dysphagia suggests mechanical obstruction, while solids and liquids suggests neuromuscular disorder."
    difficulty: medium
    tags: [dysphagia, diagnosis, approach, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What type of dysphagia suggests neuromuscular disorder?"
    back: "Both solids and liquids\n\nDysphagia with both solids and liquids suggests a neuromuscular disorder, as opposed to mechanical obstruction which typically affects solids first."
    difficulty: medium
    tags: [dysphagia, diagnosis, neuromuscular, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "In a patient <50 years old with GERD symptoms and no alarm features, what is the initial management before endoscopy?"
    back: "Trial of PPI first\n\nIf concomitant GERD symptoms in patients <50 with no alarm features, consider a trial of PPI first before proceeding to endoscopy."
    difficulty: medium
    tags: [dysphagia, GERD, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What does Barrett's esophagus predispose the esophageal lining to?"
    back: "Premalignant changes characterized as low or high-grade dysplasia\n\nBE predisposes the esophageal lining to premalignant changes characterized as low or high-grade dysplasia, which can progress to adenocarcinoma."
    difficulty: medium
    tags: [Barretts, dysplasia, pathophysiology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is indicated for patients with chronic GERD and alarm features?"
    back: "EGD (esophagogastroduodenoscopy)\n\nEGD is recommended for patients with chronic GERD or symptoms suggestive of complicated disease like anorexia, weight loss, bleeding, or dysphagia."
    difficulty: easy
    tags: [GERD, screening, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the surgical treatment for GERD?"
    back: "Fundoplication (wrapping of gastric fundus around the lower end of the esophagus)\n\nSurgical fundoplication wraps the gastric fundus around the lower esophagus; more likely to help if lower esophageal pressure is diminished."
    difficulty: easy
    tags: [GERD, surgery, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What type of dysphagia pattern suggests progressive disease?"
    back: "Progressive (worsening over time)\n\nProgressive dysphagia that worsens over time suggests concerning pathology and requires investigation."
    difficulty: medium
    tags: [dysphagia, progression, diagnosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are oropharyngeal dysphagia symptoms?"
    back: "Difficulty initiating swallowing, choking, coughing, nasal regurgitation\n\nOropharyngeal dysphagia involves difficulty initiating swallowing, choking, coughing, and nasal regurgitation."
    difficulty: easy
    tags: [dysphagia, oropharyngeal, symptoms, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are esophageal dysphagia symptoms?"
    back: "Inability to move food down the esophagus\n\nEsophageal dysphagia is characterized by the inability to move food down the esophagus after swallowing."
    difficulty: easy
    tags: [dysphagia, esophageal, symptoms, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the prevalence of BE in GERD patients who seek medical attention?"
    back: "Up to 10%\n\nUp to 10% of GERD patients will have already developed BE by the time they seek medical attention."
    difficulty: medium
    tags: [Barretts, epidemiology, prevalence, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the definition of upper GI bleeding?"
    back: "Bleeding proximal to the ligament of Treitz\n\nThe ligament of Treitz is the suspensory ligament where the fourth portion of duodenum transitions to jejunum. Upper GI bleeds account for 75% of GI bleeds."
    difficulty: easy
    tags: [upper GI bleeding, definition, ligament of Treitz, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Define Upper GI Bleeding"
    back: "Bleeding proximal to the ligament of Treitz (where 4th portion of duodenum transitions to jejunum); accounts for 75% of GI bleeds\n\nThe ligament of Treitz is the anatomic landmark separating upper and lower GI bleeding."
    difficulty: easy
    tags: [GI bleeding, upper GI, anatomy, ligament of Treitz, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What lifestyle modifications have proven benefit in GERD?"
    back: "Weight loss (if obese or significant weight gain) and elevating the head of bed (for nocturnal symptoms)\n\nWhile dietary modifications may help symptoms, only weight loss and head-of-bed elevation have demonstrated true disease modification."
    difficulty: easy
    tags: [GERD, lifestyle, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is Barrett's esophagus (BE)?"
    back: "Metaplasia of normal squamous esophageal epithelium to intestinal columnar epithelium in the distal esophagus\n\nBE is acquired via long-standing GERD and consequent damage to squamous epithelium, increasing risk for esophageal adenocarcinoma."
    difficulty: easy
    tags: [Barretts esophagus, pathology, gastroenterology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the malignant transformation risk in Barrett's esophagus?"
    back: "Approximately 0.12% per year for all BE patients prior to dysplasia; 32-59% over 5-8 years in high-grade dysplasia"
    difficulty: medium
    tags: [Barretts esophagus, oncology, risk factors, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "How is Barrett's esophagus without dysplasia managed?"
    back: "Acid suppressive therapy with high-dose PPI indefinitely, plus surveillance gastroscopy every 3-5 years"
    difficulty: medium
    tags: [Barretts esophagus, treatment, surveillance, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
