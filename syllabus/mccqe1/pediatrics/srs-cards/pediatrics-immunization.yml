# Pediatrics Immunization (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the Ontario publicly funded immunization schedule age for the first dose of DTaP-IPV-Hib vaccine?"
    back: "2 months of age\n\nThe Ontario publicly funded schedule administers DTaP-IPV-Hib (diphtheria, tetanus, acellular pertussis, inactivated polio, Haemophilus influenzae type b) at 2, 4, and 6 months, with a booster at 4-6 years. This protects infants during their most vulnerable period for pertussis and Hib disease."
    difficulty: easy
    tags: [immunization, pediatrics, DTaP, Ontario vaccine schedule]
  - front: "At what age and via what route is rotavirus (Rot-1) vaccine given in Ontario's publicly funded schedule?"
    back: "Orally (PO) at 2 and 4 months of age (up to 15 weeks for first dose, up to 32 weeks for last dose)\n\nRotavirus vaccine is given orally as it is a live attenuated oral vaccine. The first dose must be given before 15 weeks of age and the series completed before 32 weeks. It is contraindicated in children with a history of intussusception or abdominal disorders such as Meckel's diverticulum."
    difficulty: easy
    tags: [immunization, rotavirus, pediatrics, Ontario vaccine schedule]
  - front: "Which vaccines are contraindicated in pregnancy?"
    back: "MMR, Varicella (Var), MMRV, and DTaP (first trimester). Live attenuated vaccines are generally contraindicated in pregnancy.\n\nLive attenuated vaccines (MMR, Var, MMRV) are contraindicated in pregnancy due to theoretical risk of fetal infection. DTaP is contraindicated in the first trimester. Inactivated vaccines like Tdap and influenza are safe and recommended in pregnancy. Women should avoid pregnancy for 3 months after Varicella vaccination."
    difficulty: easy
    tags: [immunization, pregnancy, contraindications, pediatrics]
  - front: "What are the contraindications to MMR vaccination?"
    back: "Pregnancy, immunocompromised state (except healthy HIV-positive children), anaphylactic reaction to gelatin; cannot give MMR within 4 weeks of TB skin test (but can receive on same day)\n\nMMR is a live attenuated vaccine and is contraindicated in pregnancy and severely immunocompromised patients. Healthy HIV-positive children are an exception and may receive MMR. Gelatin allergy is a contraindication. The TB skin test interaction is important: giving MMR can suppress tuberculin reactivity for up to 4-6 weeks, so tests should not be done within 4 weeks after MMR."
    difficulty: medium
    tags: [MMR, immunization, contraindications, pediatrics]
  - front: "What is the adverse effect of rotavirus vaccine that is also listed as a contraindication to future doses?"
    back: "Intussusception — it is both a potential adverse effect and an absolute contraindication to Rot-1 vaccine\n\nIntussusception is the telescoping of one segment of bowel into another. It is a rare adverse effect of rotavirus vaccine. A prior history of intussusception is an absolute contraindication to rotavirus vaccination. Other contraindications include immunocompromised state and abdominal disorders (e.g., Meckel's diverticulum)."
    difficulty: medium
    tags: [rotavirus, intussusception, adverse effects, vaccine contraindications]
  - front: "What are the adverse effects of TdaP-IPV vaccine, and when is it contraindicated?"
    back: "Adverse effects: prolonged crying, hypotonic-hyporesponsive episode (rare), seizure on day of vaccine (rare). Contraindications: evolving unstable neurologic disease, hyporesponsive/hypotonic episode after previous dose, anaphylaxis to vaccine components (neomycin/streptomycin), encephalopathy within 7 days of prior pertussis vaccine, GBS within 8 weeks of prior tetanus vaccine.\n\nTdaP-IPV is an inactivated combination vaccine. The hypotonic-hyporesponsive episode (HHE) is a rare but recognized adverse event — child becomes pale, limp, and unresponsive. History of HHE after a previous dose is a contraindication. Encephalopathy within 7 days and GBS within 8 weeks of prior doses are specific contraindications related to the pertussis and tetanus components, respectively."
    difficulty: medium
    tags: [TdaP, vaccine adverse effects, pertussis, tetanus, pediatrics]
  - front: "What are the cold chain requirements for vaccine storage?"
    back: "+2 to +8°C (refrigerated, not frozen, for most vaccines)\n\nMaintaining the cold chain is critical for vaccine efficacy. Most vaccines must be stored between +2 and +8°C. Vaccines exposed to temperatures outside this range (frozen or overheated) may lose potency. Adverse effects following immunization (AEFI) must be reported to local/regional health units when they meet reporting criteria (temporal association, no other cause, serious criteria met, or unexpected)."
    difficulty: easy
    tags: [vaccine storage, cold chain, immunization, pediatrics]
  - front: "Which immunizations can be given to immunocompromised patients, and which cannot?"
    back: "Inactivated vaccines: generally can be given (reduced response possible). Live attenuated vaccines: generally contraindicated if severely immunocompromised. Exception: live viral vaccines OK for phagocyte/neutrophil disorders; live bacterial vaccines are contraindicated. Live vaccines OK for isolated IgA/IgG subclass/complement deficiencies or asplenia.\n\nImmune response to vaccines varies in immunocompromised patients. Inactivated vaccines (e.g., influenza, Hepatitis B, DTaP) are safe but may have reduced immunogenicity. Live vaccines (MMR, Var, rotavirus) are contraindicated in severe immunocompromise. Extra or booster doses may be needed. Post-immunization antibody titres should be considered."
    difficulty: hard
    tags: [immunocompromised, live vaccines, inactivated vaccines, pediatrics]
  - front: "What is the recommended approach when dealing with vaccine-hesitant parents?"
    back: "Use a presumptive approach (announce the vaccine rather than asking), motivational interviewing, open-ended questions, non-judgmental validation of concerns, compelling disease stories, address pain management, discuss community protection (herd immunity). Do not dismiss families.\n\nHealthcare professionals' vaccine advice is the most influential factor in parental decisions. The presumptive announcement approach ('Today your child will get these vaccines') is more effective than a participatory approach. Motivational interviewing, listening without judgment, and addressing specific concerns respectfully are key. Altruism (protecting others) and herd immunity are important discussion points."
    difficulty: medium
    tags: [vaccine hesitancy, communication, pediatrics, public health]
