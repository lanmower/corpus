  - front: "What is the dosing regimen for metronidazole in bacterial vaginosis (alternative regimen)?"
    back: "Metronidazole 0.75% gel one applicator (5g) intravaginally at bedtime x 5 days\n\nTopical metronidazole is an alternative to oral therapy and has fewer systemic side effects."
