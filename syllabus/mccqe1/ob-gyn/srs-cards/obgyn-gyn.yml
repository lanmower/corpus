  - front: "What is the most common gynecological cause of pelvic pain, and how is it managed?"
    back: "Ruptured ovarian cysts are the most common cause. Management: if unruptured or ruptured but hemodynamically stable — analgesia and follow-up. If ruptured with significant hemoperitoneum — may require surgery.\n\nOvarian cysts can rupture spontaneously, especially at mid-cycle (mittelschmerz). Most are managed conservatively. Key differentials requiring urgent action include ovarian torsion (requires surgical detorsion), ectopic pregnancy, and TOA. β-hCG must always be checked to exclude pregnancy."
    difficulty: easy
    tags: [ovarian cyst, pelvic pain, gynecology, emergency]
  - front: "What are the causes of non-pregnant abnormal uterine bleeding using PALM-COEIN?"
    back: "PALM (structural): Polyps, Adenomyosis, Leiomyoma, Malignancy/hyperplasia. COEIN (non-structural): Coagulopathy, Ovulatory dysfunction, Endometrial, Iatrogenic, Not yet classified.\n\nPALM-COEIN is the FIGO classification system for abnormal uterine bleeding in non-pregnant women. Structural causes are diagnosed by imaging/hysteroscopy; non-structural causes require laboratory investigation. Initial management aims to establish hemostasis (TXA, hormonal therapy) before definitive diagnosis."
    difficulty: medium
    tags: [abnormal uterine bleeding, PALM-COEIN, gynecology, leiomyoma, coagulopathy]
  - front: "What were the key results of the Women's Health Initiative (WHI) trial on combined hormone therapy?"
    back: "WHI (2002): 16,608 postmenopausal women with intact uterus randomized to combined estrogen + progesterone vs. placebo. Results: Increased risk of CHD and breast cancer in the treatment group. Conclusion: Overall health risks exceed benefits of combined hormone therapy in healthy postmenopausal women.\n\nThe WHI trial significantly influenced practice regarding hormone replacement therapy (HRT). Combined HRT is now not recommended as primary prevention for cardiovascular disease. It remains an option for symptomatic menopausal women with informed consent and individualized risk-benefit assessment."
    difficulty: medium
    tags: [Womens Health Initiative, HRT, hormone replacement, menopause, breast cancer risk]
  - front: "What is the gold standard medical method for termination of pregnancy up to 9 weeks GA, and how does it work?"
    back: "Mifepristone 200 mg PO on day 1, followed by misoprostol 800 mcg PV/BUC on day 2 or 3. Efficacy: 95–98% up to 49 days after LMP.\n- Mifepristone: blocks progesterone receptor → alters endometrium, softens cervix, induces bleeding\n- Misoprostol: synthetic prostaglandin → stimulates uterine contractions and expulsion of products of conception\n\nThis two-drug regimen is highly effective and avoids surgical risks. Mifepristone primes the uterus; misoprostol provides the expulsive force. Side effects include expected bleeding, pain, nausea, diarrhea, and chills/fever (prostaglandin effects). D&C backup must be accessible if medical abortion fails."
    difficulty: medium
    tags: [abortion, mifepristone, misoprostol, medical abortion]
  - front: "What are the absolute contraindications to mifepristone-based medical abortion?"
    back: "Absolute contraindications:\n1. Ectopic pregnancy\n2. Chronic adrenal failure\n3. Ambivalence about the decision\n\nRelative contraindications:\n- Unconfirmed GA\n- IUD in situ\n- Long-term steroid therapy\n- Bleeding disorder or anticoagulation\n- Porphyria\n\nMifepristone blocks glucocorticoid receptors as well as progesterone receptors, so adrenal insufficiency is dangerous (adrenal crisis risk). Ectopic pregnancy will not be treated by this regimen. Patients must confirm and be certain of their decision."
    difficulty: hard
    tags: [abortion, mifepristone, contraindications]
  - front: "What is the definition of infertility and when should investigations begin based on age?"
    back: "Infertility: inability to conceive or carry to term after 1 year of regular unprotected intercourse.\n- <35 yr: investigate after 12 months\n- 35–40 yr: investigate after 6 months\n- >40 yr: investigate immediately\n\nInvestigate earlier if: history of PID, prior infertility in a previous relationship, prior pelvic surgery, chemotherapy/radiation in either partner, recurrent pregnancy loss, or moderate-to-severe endometriosis.\n\nFertility declines with age, especially after 35, and the threshold for investigation is lowered accordingly. Infertility affects 10–15% of couples; both partners must be investigated. 75% of couples achieve pregnancy within 6 months and 85% within 1 year of trying."
    difficulty: easy
    tags: [infertility, investigation, female factors]
  - front: "What day 3 hormonal investigations are ordered to assess ovarian reserve and ovulatory function in female infertility?"
    back: "Day 3 labs: FSH, LH, estradiol, TSH, prolactin, free and total testosterone, androstenedione, DHEAS.\nDay 21–23: serum progesterone (high levels confirm ovulation).\nAny day: Anti-Müllerian hormone (AMH) — marker of ovarian reserve; higher = better reserve.\n\nDay 3 FSH/LH/estradiol assess ovarian reserve and baseline gonadotropin status. Elevated day 3 FSH suggests diminished ovarian reserve. AMH reflects antral follicle count and is the most reliable independent marker of ovarian reserve. Progesterone on day 21–23 confirms the luteal phase and ovulation."
    difficulty: medium
    tags: [infertility, ovarian reserve, AMH, FSH, investigations]
  - front: "What imaging and procedural investigations assess tubal patency in female infertility?"
    back: "1. Hysterosalpingogram (HSG): dye insufflated into uterus with X-ray — shows uterine cavity shape and tubal patency; can be therapeutic (opens tubes)\n2. Sonohysterogram (SHG): saline insufflated with U/S — shows uterine cavity and tube patency; can be therapeutic\n3. Laparoscopy with dye insufflation (tubal dye test): rarely used as diagnostic; also evaluates peritoneal cavity for endometriosis/adhesions\n4. Hysteroscopy: evaluates uterine cavity (submucosal fibroids, polyps, adhesions)\n\nHSG is the standard first-line imaging for tubal patency. It is minimally invasive and may itself be therapeutic by flushing debris. SHG is better for evaluating the uterine cavity. Laparoscopy is reserved for cases where peritoneal pathology (endometriosis, adhesions) is suspected."
    difficulty: medium
    tags: [infertility, HSG, tubal patency, investigations]
  - front: "What ovulation induction agents are used in female infertility, and which is preferred in PCOS?"
    back: "- Letrozole (aromatase inhibitor): preferred first-line in PCOS — associated with higher live birth rates vs. clomiphene\n- Clomiphene citrate (estrogen antagonist): not available in Canada; blocks estrogen perception → increases FSH/LH release; better if anovulatory\n- Metformin: used alone or combined with clomiphene for PCOS\n- Human menopausal gonadotropins (HMG, e.g., Pergonal), recombinant FSH, LHRH: for more complex cases\n- Bromocriptine/cabergoline: if elevated prolactin\n\nLetrozole is now the preferred first-line agent in PCOS-related anovulatory infertility per Canadian and international guidelines, showing higher live birth rates than clomiphene with fewer multiple pregnancies. Metformin improves insulin sensitivity in PCOS, reducing androgen production and restoring ovulation."
    difficulty: hard
    tags: [infertility, ovulation induction, letrozole, PCOS, clomiphene]
  - front: "What are the Rotterdam diagnostic criteria for Polycystic Ovarian Syndrome (PCOS)?"
    back: "PCOS requires 2 of 3 criteria:\n1. Oligomenorrhea/irregular menses for ≥6 months\n2. Hyperandrogenism:\n   - Clinical: hirsutism or acne\n   - Biochemical: raised free testosterone\n3. Polycystic ovaries on U/S (not appropriate in adolescents): ≥12 small follicles 2–9 mm (\"string of pearls\") or ovarian volume >10 cc\n\nNote: In adolescents, wait at least 1–2 years before diagnosing as puberty normally resembles PCOS.\n\nThe Rotterdam criteria are the most widely used diagnostic criteria for PCOS. Since any 2 of 3 criteria suffice, patients can have PCOS without polycystic ovaries on U/S. The diagnosis requires excluding other causes (late-onset CAH, Cushing's, hyperprolactinemia, hypothyroidism)."
    difficulty: easy
    tags: [PCOS, Rotterdam criteria, diagnosis]
  - front: "What are the long-term health consequences and metabolic complications of PCOS?"
    back: "Long-term consequences:\n- Hyperlipidemia\n- Endometrial hyperplasia (from unopposed estrogen due to anovulation)\n- Subfertility\n- Obesity\n- Sleep apnea\n- Insulin resistance → impaired glucose tolerance (35%), T2DM (10%)\n- Acanthosis nigricans (marker of insulin resistance)\n\nChronic anovulation in PCOS leads to unopposed estrogen stimulation of the endometrium, increasing risk of endometrial hyperplasia and cancer. Insulin resistance drives androgen overproduction and perpetuates the cycle. Annual OGTT (75g every 2 years if obese) is recommended for metabolic surveillance."
    difficulty: medium
    tags: [PCOS, complications, endometrial hyperplasia, insulin resistance]
  - front: "What is the pathophysiology of PCOS?"
    back: "Insulin resistance → compensatory hyperinsulinemia → increased ovarian androgen secretion + decreased FSH secretion and increased LH secretion → anovulation → infertility, oligomenorrhea. Peripheral conversion of androgens to estrogens (by adipose) contributes further. Obesity worsens insulin resistance, creating a positive feedback loop. LH:FSH ratio >2:1 is characteristic (low sensitivity/specificity).\n\nHyperinsulinemia acts synergistically with LH to stimulate ovarian theca cells to produce androgens. This excess androgen impairs follicle maturation, causing multiple small arrested follicles (\"string of pearls\"). FSH suppression prevents dominant follicle selection. The LH:FSH ratio >2:1 reflects the chronic LH elevation."
    difficulty: hard
    tags: [PCOS, pathophysiology, insulin resistance, hyperandrogenism]
  - front: "What are the treatment options for PCOS hirsutism?"
    back: "- Any combined OCP (suppresses LH and androgens)\n- Diane-35 (cyproterone acetate): anti-androgenic OCP\n- Yasmin (drospirenone + ethinyl estradiol): spironolactone analogue (inhibits steroid receptors)\n- Spironolactone: androgen receptor inhibitor\n- Flutamide: androgen receptor blocker/reuptake inhibitor\n- Finasteride: 5-alpha reductase inhibitor\n- Mechanical hair removal\n\nHirsutism results from androgen excess stimulating terminal hair follicles. Combined OCPs suppress pituitary LH (reducing ovarian androgen production) and increase SHBG (reducing free testosterone). Anti-androgens block peripheral androgen action. Mechanical removal addresses existing terminal hair."
    difficulty: medium
    tags: [PCOS, hirsutism, anti-androgens, treatment]
  - front: "What investigations are ordered at PCOS presentation, and what surveillance is recommended?"
    back: "At presentation: assess BMI, BP, fasting lipid profile.\nLaboratory: prolactin, TSH, free T4; 17-hydroxyprogesterone (to exclude late-onset CAH); LH:FSH ratio; DHEAS, androstenedione, free testosterone (most sensitive for hyperandrogenism).\nTransvaginal or transabdominal U/S for polycystic ovaries.\nSurveillance: 75g OGTT every 2 years (especially if obese).\nConsider endometrial biopsy if long-standing abnormal uterine bleeding (to rule out hyperplasia).\n\nPCOS is a diagnosis of exclusion — hypothyroidism, hyperprolactinemia, and late-onset CAH (17-OHP elevated) must be ruled out. Free testosterone is the most sensitive biochemical marker for hyperandrogenism. Regular OGTT surveillance addresses the significant metabolic risk in PCOS."
    difficulty: medium
    tags: [PCOS, investigations, surveillance, 17-hydroxyprogesterone]
  - front: "What is the significance of acanthosis nigricans in PCOS?"
    back: "Acanthosis nigricans — darkening of skin folds in intertriginous zones (neck, axillae, groin) — is a cutaneous marker of insulin resistance. It occurs in both lean and obese patients with PCOS and indicates significant hyperinsulinemia.\n\nHyperinsulinemia stimulates keratinocyte and fibroblast proliferation via IGF-1 receptors, causing the characteristic velvety hyperpigmented plaques. In PCOS, its presence should prompt evaluation for glucose intolerance and guide treatment toward insulin sensitizers (metformin)."
    difficulty: easy
    tags: [PCOS, acanthosis nigricans, insulin resistance]
  - front: "What is physiologic vaginal discharge and how does it differ from pathologic discharge?"
    back: "Physiologic: clear/white, flocculent, odourless, pH 4.0–4.5; contains epithelial cells and Lactobacilli; increases with elevated estrogen states (pregnancy, OCP, mid-cycle, PCOS, premenarchal).\nPathologic: suggests infection (vulvovaginitis, chlamydia, gonorrhea, PID), non-infectious inflammation (chemical irritants, atrophic vaginitis, foreign body), neoplasia, or systemic conditions. If increased in a perimenopausal/postmenopausal woman, investigate for excess estrogen effects (e.g., endometrial cancer).\n\nThe acidic pH of normal vaginal discharge is maintained by Lactobacillus-produced lactic acid, which protects against pathogens. Elevated pH (>4.5) suggests BV or trichomoniasis. Postmenopausal women with new discharge require evaluation for estrogen-secreting tumours or endometrial pathology."
    difficulty: easy
    tags: [vaginal discharge, vulvovaginitis, gynecological infections]
  - front: "What are the causes and management of prepubertal vulvovaginitis?"
    back: "Cause: non-specific vulvovaginitis in 25–75% of cases. Contributing factors: lack of labial fat pads, non-estrogenized thin alkaline mucosa (pH >7), obesity, poor hygiene, proximity of anus to vagina, foreign bodies (toilet paper), bubble baths/perfumed soaps, lichen sclerosis.\nInfectious causes: pinworms, Candida (if diapers/antibiotics), Group A Streptococcus, S. aureus, Shigella.\nImportant: discovery of an STI should raise suspicion of sexual abuse.\n\nManagement: enhanced hygiene (wipe front to back, white cotton underwear, sitz baths, mild detergent, no bubble baths, no fabric softener, avoid tight clothes). Antibiotics for identified infectious organism.\n\nThe prepubertal vaginal environment is susceptible to irritation due to low estrogen, which results in thin mucosa and higher pH. Non-specific vulvovaginitis is most commonly due to hygiene issues. Clinicians must be alert to the possibility of sexual abuse when STIs are found in prepubertal children."
    difficulty: medium
    tags: [vulvovaginitis, prepubertal, pediatrics, sexual abuse]
  - front: "What are the causes of female infertility organized by category?"
    back: "Ovarian: diminished ovarian reserve (age, chemotherapy, radiation, Fragile X), ovulatory dysfunction (hypogonadotropic hypogonadal anovulation — Kallmann's, hyperprolactinemia; normogonadotropic anovulation — PCOS, obesity [70–85%]; hypergonadotropic hypoestrogenic — primary ovarian insufficiency, Turner's syndrome [10–30%]), luteal phase defect.\nTubal: PID, peritubal adhesions, tubal ligation, hydrosalpinx.\nUterine: submucosal fibroids/polyps, congenital anomalies (bicornuate, septate, didelphys, MRKH), Asherman's syndrome, intrauterine adhesions, DES exposure.\nCervical: hostile cervical mucus, anti-sperm antibodies, structural defects (cone biopsy, cryotherapy).\nOther: endometriosis, adenomyosis, medications, systemic disease (renal/hepatic failure, Cushing's, DM).\n\nPCOS is the most common cause of normogonadotropic anovulation (70–85%). PID is the most common cause of tubal infertility. Asherman's syndrome (intrauterine adhesions) is a complication of uterine surgery. Systematic evaluation of all categories is essential — 10–15% of couples are affected."
    difficulty: medium
    tags: [infertility, female factors, etiology, PCOS, tubal]
  - front: "What is the most common histological type of cervical cancer, and what is the second most common type that is increasing in incidence?"
    back: "Squamous cell carcinoma (SCC) accounts for ~90% of cervical cancers. Adenocarcinoma accounts for ~10% and is increasing in incidence.\n\nSCC arises predominantly from the transformation zone (TZ) at the squamocolumnar junction. Adenocarcinoma arises from endocervical glandular cells; its relative increase is partly attributable to better SCC prevention via Pap screening."
    difficulty: easy
    tags: [cervical cancer, histology, gynecology]
  - front: "What is the transformation zone (TZ) of the cervix, and why is it clinically significant?"
    back: "The TZ is the area between the original squamocolumnar junction and the new (current) squamocolumnar junction that forms after squamous metaplasia. It is the site where the majority of cervical dysplasias and cancers arise, because active metaplasia in the presence of an inducing agent (e.g. HPV) leads to dysplasia.\n\nDuring puberty, estrogen causes eversion of columnar epithelium (ectopy), which is then exposed to the acidic vaginal pH and undergoes metaplasia to squamous epithelium. This active metaplastic process in the TZ is vulnerable to HPV-induced dysplastic transformation."
    difficulty: medium
    tags: [transformation zone, cervical cancer, metaplasia, HPV]
  - front: "Which HPV types are considered high-risk for cervical neoplasia, and what proportion of cervical cancers contain a high-risk HPV type?"
    back: "High-risk HPV types: 16, 18, 31, 33, 35, 39, 45, 51, 52, 56, 58, 59, 68, 73, and 82. >99% of cervical cancers contain one of these high-risk HPV types. Low-risk types (6, 11) are associated with condylomata but not malignancy.\n\nHPV types 16 and 18 together account for approximately 70% of cervical cancers. The near-universal presence of high-risk HPV in cervical cancers underpins prophylactic HPV vaccination as the primary prevention strategy."
    difficulty: easy
    tags: [HPV, cervical cancer, high-risk HPV, prevention]
  - front: "What are the early and late clinical features of cervical cancer?"
    back: "Early: often asymptomatic; watery to brown/red vaginal discharge; postcoital bleeding. Late: vaginal bleeding (postcoital, postmenopausal, or irregular) in 80-90%; pelvic or back pain (tumour extension to pelvic walls); bladder/bowel symptoms. Signs: friable, raised, reddened, or ulcerated area on cervix.\n\nThe majority of patients present late with abnormal vaginal bleeding. SCC typically appears as an exophytic fungating tumour, whereas adenocarcinoma is often endophytic with a barrel-shaped cervix. Early disease is detected through screening (Pap/colposcopy), underscoring the importance of cervical cancer screening programs."
    difficulty: easy
    tags: [cervical cancer, clinical features, symptoms]
  - front: "Describe the indications for LEEP (loop electrosurgical excision procedure) in the workup of cervical cancer."
    back: "LEEP is indicated for: unsatisfactory colposcopy (poor visualization/access to TZ); discrepancy between cytology, colposcopy, and histological findings; positive findings/glandular abnormalities on endocervical curettage (ECC); recurrence of lesion post-ablation or excision; inability to rule out invasive disease (large lesions extending into endocervical canal, widely on cervix, or onto vaginal epithelium). Cold-knife conization is preferred if glandular abnormality (AIS) is suspected.\n\nLEEP is both diagnostic and therapeutic for CIN lesions. It provides a histological specimen with interpretable margins. ECC is performed when the entire lesion is not visible or when no lesion is visible on colposcopy."
    difficulty: medium
    tags: [LEEP, colposcopy, cervical cancer diagnosis, CIN]
  - front: "According to FIGO 2018 staging, what defines Stage IB1, IB2, and IB3 cervical cancer?"
    back: "Stage IB1: stromal invasion ≥5 mm and <2 cm wide. Stage IB2: stromal invasion ≥5 mm and 2 cm to <4 cm wide. Stage IB3: ≥4 cm in width. All Stage IB lesions are limited to the cervix.\n\nStage I cervical cancer is confined to the cervix. Substaging of IB reflects tumour size because it influences choice of treatment (surgery vs. chemoradiation) and prognosis. Stage IA is diagnosed only by microscopy (IA1: <3 mm deep; IA2: 3 to <5 mm deep)."
    difficulty: medium
    tags: [cervical cancer staging, FIGO, gynecology]
  - front: "What is the management of Stage IA2, IB1, and IB2 cervical cancer?"
    back: "Typically treated with radical hysterectomy and pelvic lymphadenectomy (sentinel node or pelvic LN dissection). If high chance of adjuvant radiation, consider primary chemoradiation to avoid double-modality morbidity. For fertility preservation with tumour <2 cm: radical trachelectomy (removal of cervix and parametria) + nodes instead of radical hysterectomy. Adjuvant chemoradiation if high-risk pathological features: positive pelvic LNs, positive parametria, or positive margins.\n\nEqual cure rates can be achieved with surgery or radiation; surgery allows accurate staging, sparing of ovaries (preserving endocrine function), and more targeted adjuvant therapy. Trachelectomy is an option in carefully selected patients with early-stage disease who desire future fertility."
    difficulty: hard
    tags: [cervical cancer, treatment, radical hysterectomy, trachelectomy]
  - front: "What is the treatment for Stage IB3, II, III, and IV cervical cancer?"
    back: "Primary chemoradiation therapy. CT is used to assess extent of disease and evaluate pelvic and para-aortic nodes. If PET shows positive nodes: primary chemoradiation with extended field radiation therapy. Hysterectomy is generally not recommended following primary curative-intent chemoradiation.\n\nAdvanced cervical cancer (stage IB3 and beyond) is not amenable to primary surgical cure due to the extent of disease. Concurrent cisplatin-based chemotherapy with external beam radiation (+ brachytherapy) is the standard of care for locally advanced disease."
    difficulty: medium
    tags: [cervical cancer, chemoradiation, advanced stage, treatment]
  - front: "What are the 5-year survival rates by FIGO stage for cervical cancer?"
    back: "Stage 0: 99%. Stage I: 85%. Stage II: 55%. Stage III: 30%. Stage IV: 7%. Overall: 50-60%.\n\nPrognosis is strongly dependent on stage at diagnosis. The dramatic drop in survival from Stage I to Stage II reflects parametrial or vaginal extension. This underscores the critical importance of early detection through cervical cancer screening programs."
    difficulty: easy
    tags: [cervical cancer, prognosis, survival, FIGO staging]
  - front: "Compare Gardasil 9 and Cervarix HPV vaccines in terms of strains covered, dosing schedule, and approved age."
    back: "Gardasil 9: covers types 6, 11, 16, 18, 31, 33, 45, 52, 58. 2-dose schedule (second dose 6-12 months after first) for ages <15; 3-dose (0, 2, 6 months) for ages ≥15. Approved for females and males ages 9-45. Cervarix: covers types 16, 18 only. Schedule: 0, 1, 6 months. Approved for females ages 9-45. Both given IM; contraindicated in pregnancy.\n\nGardasil 9 (9-valent) provides broader protection than Cervarix (bivalent), covering the two low-risk condyloma-causing types (6, 11) in addition to five additional high-risk oncogenic types beyond 16 and 18. Vaccination before sexual debut provides maximum benefit but is still recommended for sexually active individuals."
    difficulty: medium
    tags: [HPV vaccine, Gardasil, Cervarix, prevention, cervical cancer]
  - front: "What are the key features of CIN/HSIL management based on patient age according to Canadian guidelines?"
    back: "Women ≥25 years with HSIL/CIN II-III: excisional procedures (cold knife, LEEP, or laser) preferred; positive margins require follow-up colposcopy with directed biopsies ± ECC. Women <25 years with HSIL: colposcopy every 6 months for 2 years or treatment may be acceptable based on patient preference. For LSIL in women ≥25: if HPV negative → routine Pap every 3 years; if HPV positive → follow-up colposcopy with cytology and HPV test (if ≥30 years) in 1 year.\n\nThe age-stratified approach for CIN management reflects the higher likelihood of spontaneous regression in younger women and concerns about excisional procedures increasing preterm birth risk in nulliparous patients. Canadian guidelines emphasize risk-based screening and management."
    difficulty: hard
    tags: [CIN, HSIL, cervical dysplasia, management, Canada]
  - front: "What is the classic triad of fallopian tube carcinoma, and what is the most specific symptom?"
    back: "Classic triad: watery discharge ('hydrops tubae profluens' — most specific), vaginal bleeding or discharge (50%), and crampy lower abdominal/pelvic pain. Most patients actually present with a pelvic mass rather than the classic triad.\n\nFallopian tube carcinoma is the least common female reproductive tract malignancy (0.3%), usually serous epithelial type. Emerging evidence suggests some serous ovarian cancers actually originate in the fallopian tube. Treatment is the same as for malignant epithelial ovarian tumours."
    difficulty: medium
    tags: [fallopian tube carcinoma, clinical features, gynecology]
  - front: "Compare lichen sclerosus, lichen simplex chronicus, and lichen planus of the vulva."
    back: "Lichen sclerosus: 'figure of 8' distribution, thin atrophic membrane-like epithelium, labial fusion, postmenopausal (any age), risk of SCC transformation; treat with high-potency topical steroid (clobetasol). Lichen simplex chronicus: thickened hyperkeratotic 'leather-like' labia majora, pruritus/burning especially at night, typically postmenopausal; treat with medium-potency steroid + nighttime antihistamines. Lichen planus: autoimmune (T cells attack basal keratinocytes), 3 variants (erosive, papulosquamous, hypertrophic), peak age 30-60, can extend into vagina causing desquamative vaginitis, associated with oral lichen planus; treat with ultrapotent steroid BID.\n\nAll three are non-neoplastic disorders of vulvar epithelium requiring biopsy to exclude malignancy. Lichen sclerosus carries the highest risk of progression to SCC and requires long-term monitoring. Every suspicious vulvar lesion should be biopsied."
    difficulty: medium
    tags: [lichen sclerosus, lichen planus, vulvar disorders, benign vulvar lesions]
  - front: "What are the two types of vulvar SCC (Type I and Type II), and how do they differ in etiology and patient demographics?"
    back: "Type I (HPV-related): 50-70% of vulvar SCC; caused by HPV types 16 and 18 (90% of VIN contain HPV DNA); associated with usual/classical vulvar intraepithelial neoplasia (VIN); more common in younger patients. Type II (non-HPV-related): associated with vulvar dystrophy, differentiated VIN, and lichen sclerosus; typically postmenopausal patients.\n\nRecognizing the two distinct etiological pathways has clinical implications: HPV-related vulvar SCC may be preventable via HPV vaccination, while non-HPV-related disease requires surveillance of at-risk conditions like lichen sclerosus. Both types are predominantly SCC (90% of vulvar malignancies)."
    difficulty: medium
    tags: [vulvar cancer, SCC, HPV, VIN, lichen sclerosus]
  - front: "What is the most important prognostic factor in vulvar carcinoma, and what are the key features of the FIGO 2022 staging system?"
    back: "Nodal involvement is the single most important prognostic factor, followed by tumour size. Lesions >4 cm are associated with poorer prognosis. FIGO 2022: Stage I = confined to vulva (IA: <2 cm and invasion <1 mm; IB: >2 cm or invasion >1 mm). Stage II = extension to lower 1/3 of urethra/vagina/anus with negative nodes. Stage III = any size with extension to adjacent structures or non-fixed/non-ulcerated lymph node metastases (IIIA: LN metastases <5 mm; IIIB: >5 mm; IIIC: extracapsular spread). Stage IV = fixed to bone, fixed/ulcerated LNs, or distant metastases. Overall 5-year survival: 79%.\n\nThe updated FIGO 2022 staging emphasizes nodal characteristics (size and extracapsular spread) in the Stage III substaging. Treatment is stage-dependent: Stage I → radical local excision; Stage II → modified radical vulvectomy; Stages III-IV → sentinel LN biopsy followed by surgical resection ± adjuvant chemotherapy/radiation."
    difficulty: hard
    tags: [vulvar cancer, FIGO staging, prognosis, lymph nodes]
  - front: "What are the most common site and histological type of primary vaginal carcinoma, and what are its risk factors?"
    back: "Most common site: upper 1/3 of the posterior wall. Most common histology: SCC (80-90%). Risk factors: HPV infection (analogous to cervical cancer), prior history of cervical or vulvar cancer. More than 50% diagnosed between age 70-90. Primary vaginal carcinoma represents 2-3% of female genital tract malignancies; most vaginal cancers are metastatic from cervix, endometrium, ovary, or colon.\n\nBecause most vaginal cancers are secondary (metastatic), workup must always rule out disease on the cervix, vulva, or anus as the primary source. Schiller test (Lugol's iodine staining of normal squamous epithelium) and colposcopy with biopsy are used in diagnosis."
    difficulty: medium
    tags: [vaginal cancer, SCC, risk factors, gynecology]
  - front: "What is the primary FIGO staging system used for ovarian cancer versus cervical cancer, and why?"
    back: "Ovarian cancer uses surgical (pathological) staging because laparotomy is needed to fully evaluate the extent of disease. Cervical cancer uses clinical staging because it is most prevalent in developing countries that lack advanced imaging technologies (CT, MRI), facilitating consistent international staging.\n\nClinical staging of cervical cancer (FIGO 2018) allows all imaging modalities and pathological findings to inform staging, but the system was designed so that examination, colposcopy, biopsy, and basic imaging (CXR, IVP) alone are sufficient. Surgical staging of ovarian cancer accounts for the need for cytoreduction and allows assessment of retroperitoneal nodes."
    difficulty: medium
    tags: [ovarian cancer staging, cervical cancer staging, FIGO, clinical vs surgical staging]
  - front: "What is the Risk of Malignancy Index (RMI) and how is it calculated?"
    back: "RMI = U × M × CA-125. U (ultrasound score): U=1 if 0 or 1 ultrasound features; U=4 if 2-5 features. Ultrasound features scored: multilocular cyst, solid areas, metastases, ascites, bilateral lesions. M (menopausal status): M=1 premenopausal; M=4 postmenopausal. CA-125: actual serum level in U/mL. RMI >200 warrants referral to gynecologic oncology.\n\nThe RMI combines three factors to stratify risk of ovarian malignancy before surgery. An RMI >200 has a sensitivity of approximately 70-80% and specificity of 90% for malignancy. It guides appropriate surgical triage: low-risk patients can be managed by general gynecologists, while high-risk patients require gynecologic oncologists."
    difficulty: hard
    tags: [ovarian cancer, RMI, CA-125, ultrasound, risk stratification]
  - front: "What is the goal of primary surgical treatment for advanced epithelial ovarian cancer, and what does evidence show about cytoreduction margins?"
    back: "The goal of primary surgery is optimal cytoreduction with residual disease <1 cm (ideally 0 cm). Evidence shows: suboptimal cytoreduction (residual >1 cm) vs. optimal (<1 cm) results in reduced survival estimates favouring lower-volume disease. Borderline difference in progression-free survival when residual disease >2 cm vs. <2 cm is compared (p=0.05). No significant difference in overall survival between suboptimal debulking approaches.\n\nCytoreductive surgery (debulking) for advanced epithelial ovarian cancer reduces tumour burden, improving sensitivity to subsequent platinum-based chemotherapy. Optimal debulking (ideally no residual macroscopic disease) is the primary surgical goal. The surgeon should attempt maximal resection including bowel resection, diaphragm stripping, and splenectomy when needed."
    difficulty: hard
    tags: [ovarian cancer, cytoreduction, debulking, surgery, prognosis]
  - front: "What treatment is recommended for vulvar intraepithelial neoplasia (VIN) and what is the risk of progression to cancer?"
    back: "VIN presents as multicentric white or pigmented plaques on the vulva (may only be visible at colposcopy). Treatment options: local excision (superficial vulvectomy ± split-thickness skin grafting for defects), ablative therapy (laser, cauterization), or local immunotherapy (imiquimod). Progression to invasive cancer rarely occurs with appropriate management.\n\nVIN is a precancerous change; 90% of lesions contain HPV DNA (types 16, 18) in Type I disease. The choice of treatment depends on lesion size, location, and patient characteristics. Imiquimod (topical immune response modifier) is a non-surgical option that has shown efficacy in clearing HPV-associated VIN."
    difficulty: medium
    tags: [VIN, vulvar intraepithelial neoplasia, treatment, imiquimod, HPV]
  - front: "What colposcopic features are used to identify suspicious cervical lesions requiring biopsy?"
    back: "After application of acetic acid, suspicious features include: acetowhite lesions (abnormal cells appear white due to increased nuclear protein density), punctation (stippled red dots representing capillary loops), mosaicism (mosaic tile-like vascular pattern), and abnormal blood vessels (irregular, corkscrew-shaped vessels). Endocervical curettage (ECC) is performed if the entire lesion is not visible or no lesion is visible.\n\nColposcopy is a clinical procedure that facilitates identification and biopsy of suspicious cells. It is indicated after abnormal Pap results. The Bethesda Classification System is based on cytological results of Pap testing, while carcinoma is a histological diagnosis requiring tissue biopsy."
    difficulty: medium
    tags: [colposcopy, acetowhite, cervical biopsy, CIN diagnosis]
  - front: "What is the role of salpingectomy in ovarian cancer prevention?"
    back: "Opportunistic salpingectomy (removal of fallopian tubes at time of other pelvic surgery) is recommended to prevent ovarian cancer, as emerging evidence shows that some serous ovarian cancers originate in the fallopian tube (specifically the fimbriated end). This is a prevention strategy offered to women who have completed childbearing.\n\nThe 'fallopian tube origin hypothesis' for high-grade serous ovarian cancer is supported by the finding of STIC (serous tubal intraepithelial carcinoma) lesions in the fallopian tubes of women with BRCA mutations. Bilateral salpingectomy with delayed oophorectomy is one risk-reduction strategy for BRCA carriers who wish to preserve ovarian function."
    difficulty: medium
    tags: [salpingectomy, ovarian cancer prevention, fallopian tube, BRCA]
