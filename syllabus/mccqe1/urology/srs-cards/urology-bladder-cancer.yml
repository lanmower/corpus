# Urology Bladder Cancer (Urology) - generated from srs-mccqe1
cards:
  - front: "What are the risk factors and key epidemiology of carcinoma of the renal pelvis and ureter?"
    back: "Risk factors: smoking, aristolochic acid (Balkan endemic nephropathy, Chinese herbal nephropathy), industrial dyes (aniline dyes), analgesic misuse (acetaminophen, ASA, phenacetin), prior cyclophosphamide exposure. Epidemiology: 5% of all UC, frequently multifocal, 2-5% bilateral, M:F=3:1. Relative incidence bladder:renal:ureter = 100:10:1.\n\nLynch syndrome should be considered if there is personal or family history of other malignancies (colorectal, stomach, prostate, endometrial, etc.). Treatment is radical nephroureterectomy with excision of ipsilateral bladder cuff."
    difficulty: medium
    tags: [urology, upper tract urothelial carcinoma, renal pelvis, ureter, risk factors]
  - front: "What is the gold standard for diagnosis of bladder carcinoma?"
    back: "TURBT (transurethral resection of bladder tumour) is the gold standard — both diagnostic and often therapeutic. It establishes diagnosis and determines depth of penetration. Involvement of muscularis propria confirms muscle invasion (T2).\n\nInitial investigations also include U/A, urine C&S, urine cytology, ultrasound, contrast CT, and cystoscopy with biopsy for small lesions. Cystoscopy is the initial procedure of choice for diagnosis and staging of urothelial malignancy."
    difficulty: easy
    tags: [urology, bladder carcinoma, TURBT, diagnosis]
  - front: "What is the most important risk factor for bladder carcinoma, and what is the predominant histological type?"
    back: "Smoking is the main risk factor, implicated in 60% of new cases. The predominant histological type is urothelial carcinoma (UC), accounting for >90% of cases.\n\nOther risk factors include aromatic amines (naphthylamines, benzidine), cyclophosphamide, prior pelvic radiation, Schistosoma haematobium (associated with SCC), chronic irritation (cystitis, chronic catheterization, bladder stones — also SCC), and aristolochic acid. Bladder is the 2nd most common urological malignancy; M:F=3:1; mean age 65."
    difficulty: easy
    tags: [urology, bladder carcinoma, risk factors, smoking, urothelial carcinoma]
  - front: "What is the 'field defect' theory in bladder carcinoma?"
    back: "The field defect theory explains why UC has multiple lesions and high recurrence rates: the entire urothelium from renal pelvis to bladder is bathed in carcinogens, predisposing the entire urothelial surface to malignant change.\n\nThis is why the ENTIRE urinary tract must be evaluated in patients with hematuria (unless there is clear evidence of glomerular bleeding). Cystoscopy with CT urography is required for complete evaluation."
    difficulty: medium
    tags: [urology, bladder carcinoma, field defect, recurrence, hematuria]
  - front: "What is carcinoma in situ (CIS) of the bladder and why is it clinically significant?"
    back: "CIS is a flat, non-papillary erythematous lesion characterized by dysplasia confined to the urothelium. It is clinically significant because it is more aggressive, has worse prognosis, higher recurrence rates, is associated with radioresistance, is usually multifocal, and may progress to invasive UC.\n\nStorage urinary symptoms should prompt consideration of CIS. CIS is staged as Tis. Despite being non-invasive, it has a high risk of progression and requires aggressive intravesical BCG therapy."
    difficulty: medium
    tags: [urology, bladder CIS, carcinoma in situ, urothelial carcinoma]
  - front: "What is the key symptom of bladder carcinoma and what percentage of patients present with it?"
    back: "Hematuria is the key symptom, occurring in 85-90% of bladder carcinoma patients at diagnosis. Unexplained hematuria in any individual >40 years must be investigated to rule out malignancy.\n\nBladder carcinoma may also present as asymptomatic (20%), pain (50%), clot retention (17%), storage urinary symptoms (consider CIS), palpable mass on bimanual exam (suggests muscle invasion), or obstruction of ureters causing hydronephrosis/uremia (bad prognostic factor)."
    difficulty: easy
    tags: [urology, bladder carcinoma, hematuria, clinical features]
  - front: "What are the stages and prognoses of urothelial carcinoma of the bladder at diagnosis?"
    back: "Non-muscle invasive (75%): >80% overall survival; 15% progress to invasive UC. Invasive (25%): 50-60% 5-year survival; 85% have no prior superficial UC (de novo); 50% have occult metastases at diagnosis.\n\n5-year survival by T stage: T1=90%, T2=55%, T3=30%, T4/N+/M+ <5%. Tumour grade is the single most important prognostic factor for progression."
    difficulty: medium
    tags: [urology, bladder carcinoma, prognosis, staging]
  - front: "What is the treatment for non-muscle invasive bladder carcinoma (NMIBC) based on risk stratification?"
    back: "Low risk (Ta low-grade): TURBT + intravesical chemo, follow-up with cystoscopy and cytology. Intermediate risk (multifocal, recurrent Ta): TURBT + intravesical chemo + BCG. High risk (T1, Tis, Ta high-grade): TURBT + intravesical chemo, repeat TURBT in 2-6 weeks (T1 only), BCG (3 years).\n\nBCG is the only intravesical therapy associated with decreased risk of bladder cancer progression. Standard BCG is induction with weekly instillations for 6 weeks, followed by maintenance (weekly over 3 weeks) at months 3, 6, 12, 18, 24, 30, and 36."
    difficulty: hard
    tags: [urology, NMIBC, BCG, TURBT, intravesical therapy, bladder cancer treatment]
  - front: "What does radical cystectomy involve in males vs. females?"
    back: "Male: removal of bladder, prostate, and seminal vesicles. Female: removal of bladder, uterus, ovaries, and anterior vagina.\n\nRadical cystectomy with pelvic lymph node dissection (PLND) is the treatment for muscle-invasive disease. Urinary diversion options include ileal conduit, Indiana pouch, or ileal neobladder. Neoadjuvant chemotherapy plus cystectomy improves outcomes over cystectomy alone for locally advanced disease."
    difficulty: medium
    tags: [urology, radical cystectomy, bladder cancer, surgical treatment]
  - front: "What is the differential diagnosis for a filling defect in the urinary tract?"
    back: "Differential diagnosis of filling defect in the urinary tract: urothelial carcinoma (differentiate via cytology and CT), uric acid stone (differentiate via cytology and CT), blood clot, pyeitis cystica, papillary necrosis, fungus ball, gas bubble from gas-producing organisms.\n\nCTU (CT urography) is the investigation of choice for upper tract lesions. Cystoscopy with retrograde pyelogram is also used. The clinical context (hematuria, risk factors, age) helps prioritize the differential."
    difficulty: medium
    tags: [urology, filling defect, urinary tract, differential diagnosis, hematuria]
  - front: "What is the TNM T staging of bladder carcinoma (AJCC 8th edition)?"
    back: "Ta: noninvasive papillary carcinoma. Tis: CIS (flat tumour). T1: invades subepithelial connective tissue. T2: invades muscularis propria (T2a: inner half; T2b: outer half). T3: invades perivesical tissue (T3a: microscopically; T3b: macroscopically). T4: invades prostatic stroma, seminal vesicles, uterus, vagina, pelvic wall, or abdominal wall (T4a: prostatic stroma/uterus/vagina; T4b: pelvic/abdominal wall).\n\nNon-muscle invasive disease includes Ta, Tis, and T1 — managed without cystectomy initially. T2 and above is muscle-invasive and typically requires radical cystectomy. A palpable mass on bimanual exam or obstructive symptoms suggest muscle invasion."
    difficulty: hard
    tags: [urology, bladder carcinoma, TNM staging, AJCC, muscle-invasive]
  - front: "What is the treatment for muscle-invasive and advanced/metastatic bladder carcinoma?"
    back: "Muscle-invasive: radical cystectomy + pelvic lymph node dissection (PLND). Neoadjuvant chemotherapy (gemcitabine-platinum) improves outcomes. Advanced/metastatic (T4, N+, M+): chemotherapy + radiation + immunotherapy.\n\nChemoradiation (maximal TURBT + chemoradiation) is an alternative for those not fit for radical cystectomy. Neoadjuvant chemotherapy plus cystectomy is superior to cystectomy alone for locally advanced bladder cancer."
    difficulty: medium
    tags: [urology, bladder carcinoma, radical cystectomy, chemotherapy, muscle-invasive]
