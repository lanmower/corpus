# Gi Upper (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is the first-line treatment for classic GERD symptoms?"
    back: "Empiric 8-week trial of PPIs\n\nPPIs are the most effective therapy for GERD. After 8 weeks, discontinue if no Barrett's or erosive esophagitis, but symptoms may recur."
    difficulty: easy
    tags: [GERD, treatment, pharmacology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the only beneficial lifestyle changes for GERD?"
    back: "Weight loss (if obese/significant weight gain) and elevating head of bed (for nocturnal symptoms)\n\nDiet helps symptoms but not the disease. Avoid EtOH, coffee, spices, tomatoes, and citrus juices - these reduce symptoms but don't alter disease progression."
    difficulty: medium
    tags: [GERD, lifestyle, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the complications of GERD?"
    back: "Esophageal stricture disease (scarring causing dysphagia to solids), esophagitis (ulceration/bleeding), Barrett's esophagus, and esophageal adenocarcinoma\n\nComplications range from benign strictures to premalignant Barrett's and最终的 adenocarcinoma. Chronic GERD is the key risk factor."
    difficulty: easy
    tags: [GERD, complications, pathology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is Barrett's esophagus?"
    back: "Metaplasia of normal squamous esophageal epithelium to intestinal columnar epithelium\n\nAcquired via long-standing GERD and consequent damage to squamous epithelium. Endoscopy shows salmon pink mucosa in distal esophagus; diagnosis requires biopsy showing specialized intestinal epithelium."
    difficulty: easy
    tags: [Barretts, pathology, metaplasia, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the risk factors for Barrett's esophagus?"
    back: "Male sex, age >50, White individuals, smokers, overweight, hiatus hernia, and long history of reflux symptoms\n\nIn North America and Western Europe, 0.5-20% of adults have BE. Up to 10% of GERD patients have developed BE by time of presentation."
    difficulty: medium
    tags: [Barretts, epidemiology, risk factors, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the malignant transformation rate of Barrett's esophagus?"
    back: "Approximately 0.12% per year for all BE patients prior to dysplasia; 32-59% over 5-8 years in high-grade dysplasia\n\nRisk is very low in non-dysplastic BE but significantly higher once high-grade dysplasia develops, warranting intensive surveillance or intervention."
    difficulty: medium
    tags: [Barretts, oncology, risk, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "How is Barrett's esophagus managed?"
    back: "High-dose PPI indefinitely (or fundoplication) to reduce transformation; surveillance gastroscopy every 3-5 years if no dysplasia\n\nHigh-grade dysplasia requires intensive biopsy surveillance, endoscopic ablation/resection, or esophagectomy. Evidence increasingly favors endoscopic ablation with mucosal resection or radiofrequency ablation."
    difficulty: medium
    tags: [Barretts, treatment, management, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the role of esophageal manometry in GERD?"
    back: "Indicated in patients with non-cardiac chest pain and/or dysphagia with normal gastroscopy; diagnoses peristalsis abnormalities and decreased LES tone\n\nCannot detect presence of reflux but is essential before surgical fundoplication to ensure intact esophageal function; excludes alternative diagnoses like scleroderma and achalasia."
    difficulty: medium
    tags: [GERD, diagnosis, esophageal manometry, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "When is 24-hour pH monitoring indicated in GERD?"
    back: "Most accurate test for reflux; most useful if PPIs do not improve symptoms\n\nNot required or performed in most cases, but valuable for confirming reflux in PPI-refractory symptoms before considering surgical intervention."
    difficulty: medium
    tags: [GERD, diagnosis, pH monitoring, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What key questions differentiate oropharyngeal from esophageal dysphagia?"
    back: "Oropharyngeal: difficulty initiating swallowing, choking, coughing, nasal regurgitation. Esophageal: inability to move food down the esophagus\n\nAlso assess: associated symptoms (regurgitation, chest pain, voice change, weight loss), solid vs liquid vs both, intermittent vs progressive, and presence of GERD."
    difficulty: medium
    tags: [dysphagia, diagnosis, clinical, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the causes of oropharyngeal dysphagia?"
    back: "Neurological: cortical, bulbar. Muscular: muscular dystrophy, polymyositis, myasthenia gravis. Structural: Zenker's diverticulum, cricopharyngeal, thyromegaly\n\nRequires careful neurological exam. Key distinguishing features include difficulty initiating swallow, choking, coughing, and nasal regurgitation."
    difficulty: medium
    tags: [dysphagia, neurology, etiology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the approach to a patient <50 with dysphagia and no alarm features but concomitant GERD?"
    back: "Trial of PPIs first before proceeding to endoscopy\n\nIf no alarm features (dysphagia, odynophagia, weight loss, anemia, GI bleeding) and patient has GERD symptoms, empiric PPI trial is appropriate first step."
    difficulty: medium
    tags: [dysphagia, treatment, GERD, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the difference between dysphagia and odynophagia?"
    back: "Dysphagia = difficulty in swallowing. Odynophagia = pain on swallowing\n\nThese are distinct symptoms with different etiologies. Dysphagia suggests mechanical or motility issue; odynophagia suggests inflammatory or ulcerative process."
    difficulty: easy
    tags: [definitions, symptoms, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the recommended surveillance protocol for non-dysplastic Barrett's esophagus?"
    back: "Surveillance gastroscopy every 3-5 years\n\nIf low-grade dysplasia: every 6 months for 1 year then annually. High-grade dysplasia requires intensive surveillance with biopsy, endoscopic ablation/resection, or esophagectomy."
    difficulty: medium
    tags: [Barretts, surveillance, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are alarm features in GERD that warrant endoscopy?"
    back: "Anorexia, weight loss, bleeding, dysphagia (suggesting complicated disease)\n\nChronic GERD or symptoms suggestive of complicated disease warrant EGD. Also: chronic GERD patients should be evaluated for Barrett's risk factors."
    difficulty: easy
    tags: [GERD, endoscopy, alarm features, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the most accurate test for diagnosing gastroesophageal reflux disease (GERD)?"
    back: "24-hour pH monitoring\n\n24-hour pH monitoring is the most accurate test for reflux, though not required in most cases. It is most useful when PPIs do not improve symptoms."
    difficulty: easy
    tags: [GERD, diagnosis, gastroenterology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the only beneficial lifestyle changes for GERD symptoms?"
    back: "Weight loss (if obese or significant weight gain) and elevating the head of bed (if nocturnal symptoms)\n\nWhile diet may help symptoms, it does not change the underlying disease. Only weight loss and head-of-bed elevation have proven benefit."
    difficulty: easy
    tags: [GERD, treatment, lifestyle, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the gold standard treatment for GERD?"
    back: "Proton pump inhibitors (PPIs)\n\nPPIs are the most effective therapy for GERD. An empiric 8-week trial is recommended for patients with classic symptoms."
    difficulty: easy
    tags: [GERD, treatment, pharmacology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are complications of untreated/complicated GERD?"
    back: "Esophageal stricture (scarring causing dysphagia to solids), esophagitis (ulceration, bleeding), and Barrett's esophagus leading to adenocarcinoma\n\nChronic GERD can lead to scarring causing strictures, mucosal damage causing esophagitis, and metaplasia (Barrett's) that can progress to cancer."
    difficulty: medium
    tags: [GERD, complications, oncology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is Barrett's esophagus defined as histologically?"
    back: "Replacement of normal squamous esophageal epithelium with intestinal columnar epithelium (specialized intestinal metaplasia)\n\nDiagnosis requires biopsy demonstrating specialized intestinal epithelium of any length within the esophagus, seen endoscopically as salmon pink mucosa."
    difficulty: medium
    tags: [Barretts esophagus, pathology, gastroenterology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are risk factors for Barrett's esophagus?"
    back: "Male sex, age >50, White race, smokers, overweight/obesity, hiatus hernia, and long history of reflux symptoms\n\nBarrett's is more common in males over 50 with chronic GERD, particularly those with obesity, hiatus hernia, and smoking history."
    difficulty: easy
    tags: [Barretts esophagus, epidemiology, risk factors, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the annual malignant transformation rate for Barrett's esophagus without dysplasia?"
    back: "Approximately 0.12% per year\n\nThe rate of malignant transformation is very low (0.12%/year) for all BE patients prior to dysplasia, but significantly higher (32-59% over 5-8 years) in high-grade dysplasia."
    difficulty: medium
    tags: [Barretts esophagus, oncology, prognosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "How is Barrett's esophagus with high-grade dysplasia managed?"
    back: "Regular intensive biopsy surveillance, endoscopic ablation/mucosal resection, or esophagectomy\n\nEvidence increasingly favours endoscopic ablation (RFA) with mucosal resection over esophagectomy for high-grade dysplasia in BE."
    difficulty: medium
    tags: [Barretts esophagus, treatment, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "How do you distinguish oropharyngeal from esophageal dysphagia on history?"
    back: "Oropharyngeal: difficulty initiating swallowing, choking, coughing, nasal regurgitation. Esophageal: inability to move food down the esophagus\n\nOropharyngeal dysphagia presents with problems starting to swallow (transfer problem), while esophageal dysphagia is a passage problem."
    difficulty: medium
    tags: [dysphagia, diagnosis, clinical skills, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the most common cause of esophageal stricture?"
    back: "Peptic stricture (from chronic GERD)\n\nPeptic strictures from chronic GERD are the most common cause of esophageal structural narrowing, causing dysphagia to solids."
    difficulty: easy
    tags: [dysphagia, pathology, GERD, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the recommended surveillance interval for Barrett's esophagus without dysplasia?"
    back: "Every 3-5 years\n\nPatients with BE and no dysplasia should undergo surveillance gastroscopy every 3-5 years to monitor for dysplasia progression."
    difficulty: easy
    tags: [Barretts esophagus, surveillance, gastroenterology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the first-line treatment approach for a patient <50 years with dysphagia and no alarm features who also has GERD symptoms?"
    back: "Empiric 8-week PPI trial before proceeding to endoscopy\n\nIn younger patients with dysphagia and GERD symptoms without alarm features, an empiric PPI trial is recommended as first-line before endoscopy."
    difficulty: medium
    tags: [dysphagia, GERD, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What lifestyle modifications have been shown to benefit GERD symptoms?"
    back: "Weight loss (if obese or significant weight gain) and elevating the head of bed (for nocturnal symptoms)\n\nWhile diet may help symptoms, it doesn't change the disease. Only weight loss and head-of-bed elevation are evidence-based lifestyle changes."
    difficulty: easy
    tags: [GERD, lifestyle, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the alarm features in GERD that warrant endoscopy?"
    back: "Dysphagia, odynophagia, weight loss, anorexia, anemia, GI bleeding\n\nEGD is recommended for patients with chronic GERD or symptoms suggestive of complicated disease including anorexia, weight loss, bleeding, or dysphagia."
    difficulty: easy
    tags: [GERD, endoscopy, alarm features, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the annual malignant transformation rate for Barrett's esophagus patients without dysplasia?"
    back: "Approximately 0.12% per year\n\nThe rate of malignant transformation is approximately 0.12% per year for all BE patients prior to dysplasia, but is significantly higher in high-grade dysplasia (32-59% over 5-8 years)."
    difficulty: medium
    tags: [Barretts esophagus, carcinogenesis, oncology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "How often should surveillance endoscopy be performed in Barrett's esophagus without dysplasia?"
    back: "Every 3-5 years\n\nFor Barrett's esophagus without dysplasia, surveillance gastroscopy is recommended every 3-5 years, with more intensive surveillance for high-grade dysplasia."
    difficulty: easy
    tags: [Barretts esophagus, surveillance, gastroenterology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the preferred treatment for high-grade dysplasia in Barrett's esophagus?"
    back: "Endoscopic ablation with mucosal resection or radiofrequency ablation (RFA)\n\nEvidence increasingly favors endoscopic ablation with mucosal resection or radiofrequency ablation over esophagectomy for high-grade dysplasia."
    difficulty: medium
    tags: [Barretts esophagus, treatment, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What type of dysphagia (solid foods only vs. solids and liquids) suggests a mechanical obstruction versus a neuromuscular disorder?"
    back: "Solid food only suggests mechanical obstruction; solids, liquids, or both suggests neuromuscular disorder\n\nIn the approach to dysphagia, solid food alone points to mechanical obstruction, while involvement of both solids and liquids indicates a neuromuscular disorder."
    difficulty: easy
    tags: [dysphagia, diagnosis, differential, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the key distinguishing feature of oropharyngeal dysphagia?"
    back: "Difficulty initiating swallowing, choking, coughing, nasal regurgitation\n\nOropharyngeal dysphagia presents with difficulty initiating the act of swallowing, choking, coughing, and nasal regurgitation, as opposed to esophageal dysphagia."
    difficulty: easy
    tags: [dysphagia, oropharyngeal, clinical presentation, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "In a patient <50 years old with dysphagia and no alarm features but with GERD, what is the initial management before endoscopy?"
    back: "Empiric 8-week PPI trial\n\nIf concomitant GERD symptoms in patients <50 with no alarm features, a trial of PPI first before proceeding to endoscopy is recommended."
    difficulty: medium
    tags: [dysphagia, GERD, treatment algorithm, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
