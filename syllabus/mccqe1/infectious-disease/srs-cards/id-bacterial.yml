cards:
  - front: "What is the Baggish scoring algorithm for acute HF diagnosis and what are its performance characteristics?"
    back: "Score <6 suggests HF unlikely; score >6 had sensitivity of 96% and specificity of 84% (P<0.001) for acute HF diagnosis\n\nThe Baggish algorithm combines clinical and biochemical parameters to risk-stratify patients presenting with dyspnea, with high sensitivity for ruling out acute heart failure."
    difficulty: hard
    tags: [heart failure, diagnosis, Baggish score, BNP, toronto-notes, pages-0131-0132-0133-0134-0135-0136-0137-0138-0139-0140]
  - front: "What is the leading cause of morbidity and mortality after cardiac transplantation?"
    back: "Infection - risk peaks early (first few months) then declines to a low persistent rate\n\nImmunosuppressive medications required to prevent rejection simultaneously increase susceptibility to opportunistic and non-opportunistic infections."
    difficulty: easy
    tags: [cardiac-transplantation, complications, infection, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "When does infection risk peak after cardiac transplantation?"
    back: "Early during the first few months after transplantation, then declines to a low persistent rate\n\nThe period of highest immunosuppression coincides with peak infectious risk, requiring prophylactic and vigilant monitoring strategies."
    difficulty: easy
    tags: [cardiac-transplant, infection, timeline, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What are the clinical features of pemphigus vulgaris?"
    back: "Flaccid, non-pruritic intraepidermal bullae/vesicles on mucous membranes and/or skin; erosions and secondary infection common; sites: mouth (90%), scalp, face, chest, axillae, groin, umbilicus; positive Nikolsky's sign and Asboe-Hansen sign\n\nPemphigus vulgaris typically begins in the oral mucosa and spreads to skin. The flaccid nature of bullae and positive Nikolsky's sign reflect the intraepidermal location of the split."
    difficulty: easy
    tags: [dermatology, bullous-diseases, autoimmune, clinical-features, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the key clinical features of Pemphigus Vulgaris?"
    back: "Flaccid, non-pruritic intraepidermal bullae/vesicles on mucous membranes and/or skin; may present with erosions and secondary infection; sites: mouth (90%), scalp, face, chest, axillae, groin, umbilicus; positive Nikolsky sign; positive Asboe-Hansen sign\n\nPemphigus vulgaris classically starts in the mouth and is intensely uncomfortable but not very itchy. The flaccid nature of bullae reflects their superficial intraepidermal location."
    difficulty: easy
    tags: [dermatology, pemphigus, autoimmune, mucocutaneous, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What investigations can confirm a diagnosis of herpes simplex virus infection?"
    back: "Tzanck smear with Giemsa stain showing multinucleated giant epithelial cells (not type-specific). Viral culture, electron microscopy, PCR, and direct fluorescence antibody test of specimen from unroofed base of a new lesion. Serologic testing can detect antibodies for current or past infection.\n\nThe Tzanck smear is a rapid, inexpensive test but cannot distinguish HSV-1 from HSV-2. PCR is the most sensitive test for definitive diagnosis."
    difficulty: medium
    tags: [HSV, herpes-simplex, diagnosis, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the complications of herpes simplex virus infection?"
    back: "Dendritic corneal ulcer (ocular HSV), erythema multiforme (EM), herpes simplex encephalitis (infants at particular risk), and Kaposi's varicelliform eruption (eczema herpeticum) - HSV infection on atopic dermatitis.\n\nHSV can cause both mucocutaneous disease and serious systemic complications, particularly in immunocompromised patients and infants."
    difficulty: medium
    tags: [HSV, complications, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the incubation period for scabies after initial exposure?"
    back: "Incubation period of approximately 1 month after initial exposure, after which pruritus begins. Re-infection is followed by hypersensitivity reaction within 24 hours.\n\nThe long incubation period reflects the time required for the host immune response to develop against scabies antigens, unlike re-infection which triggers rapid hypersensitivity."
    difficulty: easy
    tags: [scabies, pathophysiology, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What investigations are used to diagnose HSV?"
    back: "Tzanck smear (multinucleated giant cells), viral culture, PCR, direct fluorescence antibody test, serology for past/current infection\n\nMultiple diagnostic modalities exist because each has different sensitivity/specificity depending on lesion age and type. Tzanck smear is rapid but non-specific."
    difficulty: medium
    tags: [HSV, diagnosis, investigations, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the complication of eczema herpeticum?"
    back: "HSV infection spreading on skin affected by atopic dermatitis (AD), causing Kaposi's varicelliform eruption\n\nPatients with AD have impaired skin barrier and immune dysfunction, making them susceptible to widespread HSV infection that can be life-threatening."
    difficulty: medium
    tags: [HSV, complications, atopic dermatitis, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is erythema multiforme, and what are its typical triggers?"
    back: "Target lesions (macules/papules with central vesicles, bull's-eye pattern); most commonly triggered by HSV infection or Mycoplasma\n\nEM is a hypersensitivity reaction manifesting as characteristic target lesions. HSV is the most common identifiable trigger, making antiviral prophylaxis sometimes indicated."
    difficulty: medium
    tags: [erythema multiforme, clinical features, triggers, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What symptoms may persist for weeks after scabies treatment despite effective therapy?"
    back: "Pruritus (itching) may persist for 2-3 weeks due to prolonged hypersensitivity reaction\n\nThis persistent itching is NOT a sign of treatment failure. Mid-potency topical corticosteroids and antihistamines can help manage these symptoms."
    difficulty: easy
    tags: [scabies, post-treatment, clinical reasoning, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the classic clinical features of scabies?"
    back: "Superficial linear burrows, intense nocturnal pruritus, and secondary infection; commonly affects axillae, groin, buttocks, and hand/foot web spaces with sparing of head and neck (except in infants).\n\nScabies mites burrow into the stratum corneum to lay eggs, causing intense itching that worsens at night due to increased mite activity. The distribution pattern helps differentiate from other pruritic conditions."
    difficulty: easy
    tags: [scabies, clinical-features, dermatology, parasitic-infection, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the prodrome for recurrent herpes simplex infection?"
    back: "Tingling, pruritus, and pain preceding the appearance of vesicular lesions by several hours to 1-2 days.\n\nThe prodromal phase reflects viral migration along sensory neurons to the skin surface. Recognizing this phase allows early initiation of antiviral therapy for maximum benefit."
    difficulty: easy
    tags: [hsv, prodrome, clinical-features, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are serious complications of HSV infection?"
    back: "Dendritic corneal ulcer (ocular HSV), erythema multiforme, herpes simplex encephalitis (especially in infants), and eczema herpeticum (Kaposi's varicelliform eruption on atopic dermatitis patients).\n\nHSV can cause vision-threatening keratitis, life-threatening CNS infection, and widespread cutaneous dissemination in immunocompromised or eczematous patients."
    difficulty: medium
    tags: [hsv, complications, ophthalmology, neurology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the classic clinical features of scabies and where does it typically spare?"
    back: "Superficial burrows, intense nocturnal pruritus, and secondary infection. Common sites: axillae, groin, buttocks, hands/feet (especially web spaces). Spares head and neck (except in infants).\n\nScabies presents with characteristic burrows and intense itching that worsens at night. The distribution pattern helps differentiate it from other pruritic conditions."
    difficulty: easy
    tags: [scabies, dermatology, parasitic infection, pruritus, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What complications can occur with HSV infection?"
    back: "Dendritic corneal ulcer (ocular), erythema multiforme, HSV encephalitis (especially in infants), and eczema herpeticum (Kaposi's varicelliform eruption) on atopic dermatitis patients.\n\nEczema herpeticum is a medical emergency requiring urgent antiviral treatment. HSV encephalitis has high mortality without prompt treatment."
    difficulty: medium
    tags: [HSV, complications, encephalitis, eczema herpeticum, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "How is HSV diagnosed?"
    back: "Tzanck smear (Giemsa stain) shows multinucleated giant epithelial cells. Gold standard: viral culture, PCR, direct fluorescent antibody test, or electron microscopy from unroofed vesicle base. Serologic testing for past/current infection.\n\nTzanck smear is rapid but cannot differentiate HSV-1 from HSV-2. PCR is now the preferred diagnostic test due to high sensitivity."
    difficulty: medium
    tags: [HSV, diagnosis, Tzanck smear, PCR, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What investigations are used for leishmaniasis?"
    back: "Histology, culture, and PCR. Most cases resolve spontaneously; treatment with oral antifungals (fluconazole, ketoconazole) or parenteral therapy may be considered in severe/complicated cases.\n\nLeishmaniasis is transmitted by sandflies infected with Leishmania. Diagnosis requires tissue confirmation."
    difficulty: medium
    tags: [leishmaniasis, tropical dermatology, investigations, parasitic infection, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is Kaposi sarcoma and what virus is required for its development?"
    back: "An angioproliferative neoplasm that requires infection with Human Herpesvirus 8 (HHV-8)\n\nHHV-8 is the necessary etiologic agent for all forms of Kaposi sarcoma, distinguishing it from other vascular tumors."
    difficulty: easy
    tags: [kaposi sarcoma, HHV-8, virology, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What are the contraindications for doxycycline in acne and rosacea?"
    back: "Pregnancy, hepatic impairment, drug hypersensitivity, concurrent acitretin/isotretinoin, penicillin antibiotics, and oral typhoid vaccine\n\nDoxycycline 100mg bid is used for acne vulgaris and rosacea. Photosensitivity is a common side effect requiring sun avoidance counseling."
    difficulty: medium
    tags: [doxycycline, acne, rosacea, oral therapy, contraindications, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the contraindications to cyclosporine?"
    back: "Abnormal renal function, uncontrolled hypertension, malignancy (except NMSC), uncontrolled infection, immunodeficiency (excluding autoimmune disease), hypersensitivity\n\nCyclosporine is nephrotoxic and can worsen hypertension. Baseline and ongoing monitoring of renal function and blood pressure is mandatory during therapy."
    difficulty: medium
    tags: [cyclosporine, contraindications, nephrotoxicity, psoriasis, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are absolute contraindications for doxycycline?"
    back: "Pregnancy, hepatic impairment, drug hypersensitivity, concurrent use with acitretin/isotretinoin/penicillin antibiotics, and oral typhoid vaccine\n\nDoxycycline is contraindicated in pregnancy due to fetal tooth discoloration and bone growth effects, and should not be combined with other tetracyclines or retinoids."
    difficulty: medium
    tags: [dermatology, doxycycline, acne, rosacea, contraindications, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the contraindications to doxycycline in dermatology?"
    back: "Pregnancy, hepatic impairment, drug hypersensitivity, concurrent use of acitretin or isotretinoin, concurrent use of penicillin antibiotics, concurrent oral typhoid vaccine\n\nDoxycycline is a tetracycline antibiotic used for acne vulgaris, rosacea, and bullous pemphigoid. It chelates calcium and is contraindicated in pregnancy and with certain drugs."
    difficulty: medium
    tags: [doxycycline, acne, rosacea, contraindications, tetracycline, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the clinical features of herpes simplex virus (HSV) infections?"
    back: "Herpetiform (grouped) vesicles on an erythematous base on skin or mucous membranes\n\nHSV is transmitted via contact with erupted vesicles or asymptomatic viral shedding."
    difficulty: easy
    tags: [HSV, herpes simplex, dermatology, viral infection, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is eczema herpeticum (Kaposi's varicelliform eruption)?"
    back: "HSV infection on atopic dermatitis (AD) patients causing widespread vesicular eruption\n\nThis is a serious complication where HSV spreads extensively on skin compromised by atopic dermatitis."
    difficulty: medium
    tags: [HSV, eczema herpeticum, dermatology, complications, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What investigations confirm HSV infection?"
    back: "Tzanck smear with Giemsa stain (shows multinucleated giant epithelial cells), viral culture, PCR, direct fluorescence antibody test\n\nSerologic testing can also determine current or past infection."
    difficulty: medium
    tags: [HSV, herpes simplex, dermatology, diagnosis, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the clinical features of head lice?"
    back: "Nits (louse eggs) on hairs; red, excoriated skin with secondary bacterial infection; lymphadenopathy\n\nIntense pruritus leads to excoriations, which can become secondarily infected."
    difficulty: easy
    tags: [lice, pediculosis, dermatology, clinical features, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the contraindications for Doxycycline in acne vulgaris?"
    back: "Pregnancy, hepatic impairment, drug hypersensitivity. Also contraindicated with acitretin, isotretinoin, or penicillin antibiotics. Avoid with oral typhoid vaccine.\n\nDoxycycline is a tetracycline antibiotic used for acne vulgaris, rosacea, and bullous pemphigoid. Works via anti-inflammatory and anti-bacterial effects."
    difficulty: medium
    tags: [dermatology, acne, doxycycline, oral therapy, contraindications, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the management of anterior urethral injury?"
    back: "Conservative; if cannot void, Foley or suprapubic cystostomy and antibiotics\n\nMost anterior urethral injuries can be managed non-operatively."
    difficulty: medium
    tags: [urethra, urology, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of urethral injuries?"
    back: "Anterior urethral injuries: conservative, or Foley/suprapubic cystostomy + antibiotics if cannot void. Posterior: suprapubic cystostomy (avoid catheterization) + surgical repair\n\nPosterior urethral injuries are often associated with pelvic fractures. Catheterization should be avoided as it may worsen injury."
    difficulty: medium
    tags: [urethral-injury, genitourinary, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management for suspected spinal infection?"
    back: "Early IV antibiotics and infectious disease/spine surgery consultation\n\nSpinal infections require prompt antimicrobial therapy and surgical evaluation"
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Spinal Infection, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the management of an anterior urethral injury?"
    back: "Conservative management; if unable to void, Foley or suprapubic cystostomy with antibiotics\n\nAnterior urethral injuries are typically managed conservatively; catheterization or suprapubic cystostomy is needed if urinary retention occurs."
    difficulty: easy
    tags: [emergency-medicine, urology, urethral-injury, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management for spinal infection?"
    back: "Early IV antibiotics and infectious disease/spine surgery consultation\n\nSpinal infections require prompt antimicrobial therapy and surgical assessment for potential debridement."
    difficulty: medium
    tags: [back pain, spinal infection, management, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "List common precipitating factors for HHS"
    back: "Infection (pneumonia, UTI, sepsis), missed insulin doses, cardiac surgery, and drugs (diuretics, glucocorticoids, lithium, atypical antipsychotics)\n\nIdentifying and treating the precipitating cause is essential in HHS management, similar to DKA, as it prevents ongoing hyperglycemic stress."
    difficulty: medium
    tags: [HHS, Etiology, Emergency Medicine, Diabetes, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the management of anterior urethra injury?"
    back: "Conservative; if cannot void, Foley or suprapubic cystostomy and antibiotics\n\nAnterior urethral injuries are often managed conservatively unless obstruction occurs."
    difficulty: medium
    tags: [emergency-medicine, gu-injury, urethra, urology, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of spinal infection?"
    back: "Early IV antibiotics and infectious disease/spine surgery consultation\n\nDelayed treatment of spinal infection can lead to neurological compromise and sepsis."
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Infection, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the management for spinal infection causing back pain?"
    back: "Early IV antibiotics and infectious disease/spine surgery consultation\n\nSpinal infections (osteomyelitis, discitis, epidural abscess) require prompt antimicrobial therapy and surgical drainage if indicated."
    difficulty: hard
    tags: [Emergency Medicine, Spinal Infection, Osteomyelitis, Management, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What causes secondary low HDL?"
    back: "Obesity/metabolic syndrome, DM, acute infections, inflammatory conditions\n\nLow HDL is often associated with metabolic syndrome and is a target for lifestyle intervention."
    difficulty: easy
    tags: [secondary dyslipidemia, low HDL, metabolic syndrome, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What are causes of low HDL?"
    back: "Obesity/metabolic syndrome, DM, smoking, drugs (beta-blockers without ISA, anabolic steroids), acute infections, inflammatory conditions\n\nLow HDL is an independent risk factor for CAD, especially in patients with DM and post-menopausal women."
    difficulty: medium
    tags: [secondary dyslipidemia, low HDL, causes, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What are the causes of low HDL cholesterol?"
    back: "Obesity/metabolic syndrome, diabetes, drugs (beta-blockers, anabolic steroids), acute infections, inflammatory conditions, smoking\n\nLow HDL is an important independent cardiovascular risk factor that requires management of underlying causes."
    difficulty: easy
    tags: [HDL, risk factors, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What is complete androgen insensitivity syndrome (CAIS)?"
    back: "A condition where androgen receptors are completely non-functional, leading to female external genitalia despite XY karyotype\n\nMutations in the androgen receptor gene prevent androgen action, resulting in phenotypic female with intra-abdominal testes."
    difficulty: medium
    tags: [endocrinology, androgen insensitivity, CAIS, DSD, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is the foot exam recommendation for diabetes patients?"
    back: "Foot exam for sensation using 10g monofilament, ulcers or infection\n\nRegular foot exams are essential to prevent diabetic foot complications."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, prevention, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "A patient with fever presents with dysuria, foul-smelling urine, and flank pain. What investigations are indicated?"
    back: "Urinalysis, urine culture, and consider CBC\n\nThese symptoms suggest UTI/pyelonephritis; urine culture is gold standard for diagnosis."
    difficulty: easy
    tags: [fever, UTI, nephritis, infectious disease, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What investigations are indicated for suspected meningitis?"
    back: "CBC, blood culture, and lumbar puncture for CSF analysis\n\nLP is essential for definitive diagnosis unless contraindicated by increased ICP signs."
    difficulty: easy
    tags: [meningitis, investigations, neurology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the three most common infections associated with vaginal discharge in adult women?"
    back: "Bacterial vaginosis (BV), vulvovaginal candidiasis (VVC), and trichomoniasis\n\nThese three conditions account for the majority of vaginal discharge complaints in adult women."
    difficulty: easy
    tags: [STI, vaginal-discharge, gynecology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the three most common infections causing vaginal discharge in adult women?"
    back: "Vulvovaginal candidiasis (VVC), bacterial vaginosis (BV), trichomoniasis\n\nThese are the three most common causes of vaginal discharge in adult women."
    difficulty: easy
    tags: [STI, vaginitis, gynecology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the first-line treatment for primary herpes simplex virus infection?"
    back: "Acyclovir 400 mg PO TID x 5-10 days, OR famciclovir 250 mg PO TID x 5 days, OR valacyclovir 1000 mg PO BID x 10 days\n\nAntiviral therapy reduces symptom duration and viral shedding. Treatment is most effective when started within 72 hours of lesion onset."
    difficulty: easy
    tags: [infectious disease, herpes, HSV, antiviral, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the foot exam recommendation for diabetic patients?"
    back: "Foot exam for sensation using 10g monofilament, ulcers or infection assessment\n\nRegular foot examinations using monofilament testing are essential to detect peripheral neuropathy and prevent diabetic foot ulcers."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, prevention, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are second-line antibiotics for cellulitis in adults?"
    back: "Cloxacillin 500 mg PO QID OR clindamycin 300 mg PO for 10-14 days\n\nClindamycin is useful for penicillin-allergic patients or suspected MRSA."
    difficulty: medium
    tags: [dermatology, infectious disease, cellulitis, antibiotic, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What investigations are indicated for suspected secondary headache?"
    back: "CBC (for infection), ESR/CRP (for temporal arteritis), neuroimaging (CT/MRI), and CSF analysis\n\nInvestigations are only indicated when red flags suggest secondary etiology; neuroimaging rules out intracranial pathology."
    difficulty: medium
    tags: [headache, investigations, neurology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What antibiotic is first-line for severe Campylobacter jejuni infection?"
    back: "Macrolides (e.g., azithromycin) or fluoroquinolones\n\nMacrolides are preferred; fluoroquinolones are alternatives, with treatment duration typically about 1 week for diarrhea >1 week."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for C. difficile infection?"
    back: "Stop the culprit antibiotic if possible; oral vancomycin is first-line, with IV metronidazole if ileus present; fidaxomicin is an alternative\n\nFor fulminant C. difficile, oral vancomycin plus IV metronidazole is recommended; fidaxomicin has lower recurrence rates."
    difficulty: hard
    tags: [gastroenterology, infectious-diarrhea, c-difficile, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for Yersinia infection?"
    back: "Fluoroquinolones only for severe illness\n\nMost Yersinia cases are self-limiting; fluoroquinolones are reserved for severe illness only."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the typical duration of EIEC infection?"
    back: "1-10 days\n\nEnteroinvasive E. coli (EIEC) causes dysentery-like illness with bloody stool, abdominal pain, and fever; relatively uncommon."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, e-coli, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the association between Campylobacter infection and Guillain-Barré syndrome?"
    back: "Campylobacter infection is associated with Guillain-Barré syndrome as a post-infectious complication\n\nCampylobacter jejuni infection can trigger Guillain-Barré syndrome through molecular mimicry."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, neurological, complications, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first step in managing C. difficile infection?"
    back: "Stop the culprit antibiotic if possible\n\nDiscontinuing the inciting antibiotic is the first step in C. difficile treatment, along with supportive therapy."
    difficulty: medium
    tags: [gastroenterology, c-difficile, pseudomembranous-colitis, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What are first-line antibiotics for C. difficile infection?"
    back: "Oral vancomycin or fidaxomicin; metronidazole if access is limited\n\nVancomycin and fidaxomicin are first-line for C. difficile; metronidazole is reserved for mild cases when other options are unavailable."
    difficulty: medium
    tags: [gastroenterology, c-difficile, treatment, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the characteristic complication of C. difficile infection?"
    back: "Pseudomembranous colitis\n\nC. difficile toxins cause pseudomembranous colitis, characterized by adherent yellow-white plaques on colonoscopy."
    difficulty: medium
    tags: [gastroenterology, c-difficile, pseudomembranous-colitis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What antibiotics are used for ETEC (traveller's diarrhea)?"
    back: "Fluoroquinolone or azithromycin\n\nFluoroquinolones and azithromycin are effective against ETEC, though fluoroquinolone resistance is increasing in some regions."
    difficulty: medium
    tags: [gastroenterology, travellers-diarrhea, treatment, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What antibiotics are used for Salmonella Typhi?"
    back: "Ceftriaxone, ciprofloxacin, or azithromycin\n\nEmpiric treatment for typhoid uses ceftriaxone, ciprofloxacin, or azithromycin; fluoroquinolone resistance is increasing."
    difficulty: medium
    tags: [gastroenterology, salmonella, typhoid, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is unique about Shigella infection?"
    back: "Very small inoculum needed for infection\n\nShigella is highly transmissible with as few as 10-100 organisms needed to cause infection."
    difficulty: medium
    tags: [gastroenterology, shigella, infectious-diarrhea, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What complications can occur with Shigella infection?"
    back: "Toxic megacolon and HUS\n\nShigella dysenteriae can cause toxic megacolon; antidiarrheals may increase this risk."
    difficulty: hard
    tags: [gastroenterology, shigella, complications, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the characteristic stool output in Vibrio cholerae infection?"
    back: "Massive watery diarrhea (1-3 liters per day)\n\nCholera causes profuse watery diarrhea that can rapidly lead to severe dehydration and death without treatment."
    difficulty: easy
    tags: [gastroenterology, cholera, vibrio, dehydration, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What antibiotics are used for Vibrio cholerae?"
    back: "Tetracycline or fluoroquinolones (e.g., ciprofloxacin)\n\nTetracycline and fluoroquinolones are effective against V. cholerae and reduce bacterial shedding."
    difficulty: medium
    tags: [gastroenterology, cholera, treatment, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for severe Yersinia infection?"
    back: "Fluoroquinolones for severe illness\n\nFluoroquinolones are used for severe Yersinia infections; most cases in children are self-limited."
    difficulty: hard
    tags: [gastroenterology, yersinia, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the main concern with rotavirus infection?"
    back: "Severe dehydration\n\nRotavirus can cause profuse watery diarrhea leading to severe dehydration, particularly in young children."
    difficulty: easy
    tags: [gastroenterology, viruses, rotavirus, dehydration, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Why is antibiotic prophylaxis not recommended for traveller's diarrhea?"
    back: "Increases risk of infection with resistant organisms\n\nProphylactic antibiotics promote resistance and may lead to infection with resistant organisms; not recommended by CDC."
    difficulty: medium
    tags: [gastroenterology, travellers-diarrhea, prevention, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What stool investigations are indicated for chronic diarrhea?"
    back: "C. difficile toxin and culture/sensitivity\n\nStool analysis for C. difficile toxin and bacterial culture are initial investigations guided by history in chronic diarrhea."
    difficulty: medium
    tags: [gastroenterology, chronic-diarrhea, investigation, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What antibiotic is used for fulminant C. difficile infection?"
    back: "Oral vancomycin\n\nFor fulminant C. difficile infection (previously called severe), oral vancomycin is used, with IV metronidazole added if ileus is present."
    difficulty: medium
    tags: [gastroenterology, infectious-disease, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What investigation is recommended for chronic diarrhea?"
    back: "Stool analysis for C. difficile toxin and culture/sensitivity\n\nInvestigations for chronic diarrhea are guided by history, with stool analysis for C. difficile toxin and C&S being key initial tests."
    difficulty: medium
    tags: [gastroenterology, investigations, chronic-diarrhea, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Why are antidiarrheals contraindicated in Shigella infection?"
    back: "They increase the risk of toxic megacolon\n\nAntidiarrheals may increase the risk of toxic megacolon in Shigella infection and should be avoided despite the pathogen requiring only a very small inoculum for transmission."
    difficulty: hard
    tags: [gastroenterology, treatment, shigella, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What antibiotic is typically used for severe non-typhoidal salmonellosis?"
    back: "Ciprofloxacin only in severe illness\n\nCiprofloxacin is reserved for severe non-typhoidal salmonellosis in extreme age, joint prostheses, valvular heart disease, severe atherosclerosis, cancer, or uremia."
    difficulty: medium
    tags: [gastroenterology, antibiotics, salmonella, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What are the three most common infections associated with vaginal discharge?"
    back: "Bacterial vaginosis, vulvovaginal candidiasis, and trichomoniasis\n\nThese cause the majority of vaginal discharge presentations in adult women."
    difficulty: easy
    tags: [STI, vaginal-discharge, gynecology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the characteristic stool pattern in C. difficile infection?"
    back: "Pseudomembranous colitis\n\nC. difficile can cause pseudomembranous colitis, characterized by pseudomembranes visible on colonoscopy."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, c-difficile, pseudomembranous-colitis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What antibiotic is first-line for C. difficile infection?"
    back: "Oral vancomycin\n\nFor C. difficile infection, oral vancomycin is the first-line treatment; fidaxomicin is an alternative."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, c-difficile, antibiotics, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the infective dose of Shigella (how many organisms needed for infection)?"
    back: "Very small inoculum (as few as 10-100 organisms)\n\nShigella has a very low infective dose, making it highly transmissible via fecal-oral route."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, shigella, transmission, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for Giardia lamblia infection?"
    back: "Metronidazole or nitazoxanide\n\nGiardia is treated with metronidazole or nitazoxanide; treatment of asymptomatic carriers is NOT recommended."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, giardia, parasite, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the complication of untreated Entamoeba histolytica infection?"
    back: "Liver abscess\n\nEntamoeba histolytica can spread hematogenously to cause amoebic liver abscess if untreated."
    difficulty: hard
    tags: [gastroenterology, infectious-diarrhea, entamoeba, liver-abscess, parasite, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What pathogen is normally present in colon in small numbers and causes disease after antibiotic exposure?"
    back: "Clostridioides difficile (C. difficile)\n\nC. difficile is normally present in low numbers; disease occurs after antibiotic exposure disrupts flora."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, c-difficile, antibiotic-associated, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which antibiotics are highest risk for C. difficile infection?"
    back: "Clindamycin, fluoroquinolones, penicillins, cephalosporins\n\nBroad-spectrum antibiotics especially clindamycin, fluoroquinolones, penicillins, and cephalosporins disrupt colonic flora."
    difficulty: medium
    tags: [gastroenterology, c-difficile, risk-factors, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for first-episode herpes simplex virus (HSV) infection?"
    back: "Acyclovir 400 mg PO TID x 5-10 days OR famciclovir 250 mg PO TID x 5 days OR valacyclovir 1000 mg PO BID x 10 days\n\nAntiviral therapy reduces symptom duration, viral shedding, and speeds healing of lesions."
    difficulty: easy
    tags: [infectious disease, HSV, herpes, antiviral, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "A patient with recurrent C. difficile infection is being treated. Which antibiotic has the lowest recurrence rate?"
    back: "Fidaxomicin\n\nFidaxomicin has a lower recurrence rate compared to vancomycin for C. difficile infection due to its narrow spectrum and inhibition of spore production."
    difficulty: hard
    tags: [gastroenterology, clostridioides-difficile, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What are the 'rose spots' associated with Salmonella typhi infection and when do they appear?"
    back: "Pink blanching maculopapular rash on the anterior thorax and upper abdomen; appears in the second week of illness\n\nSalmonella typhi (typhoid fever) causes rose spots - transient, blanching erythematous papules that appear on the trunk during the second week of fever."
    difficulty: medium
    tags: [gastroenterology, salmonella-typhi, typhoid-fever, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which bacterial pathogen requires the smallest inoculum to cause infection?"
    back: "Shigella\n\nShigella requires a very small inoculum (as few as 10-100 organisms) to cause infection due to its ability to invade colonic epithelium."
    difficulty: medium
    tags: [gastroenterology, shigella, pathogenesis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What antibiotics are associated with C. difficile infection?"
    back: "Clindamycin, fluoroquinolones, penicillins, and cephalosporins\n\nThese antibiotics disrupt normal colonic flora, allowing C. difficile to overgrow and produce toxins. Recent hospitalization within 6 weeks is also a risk factor."
    difficulty: easy
    tags: [gastroenterology, clostridioides-difficile, antibiotic-risk, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "A traveler to Mexico develops moderate diarrhea. What is the first-line empiric antibiotic?"
    back: "Azithromycin (given increasing fluoroquinolone resistance)\n\nIn areas with high fluoroquinolone resistance (e.g., South and Southeast Asia), azithromycin is preferred for empiric treatment of traveler's diarrhea."
    difficulty: medium
    tags: [travel-medicine, antibiotics, resistance, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the first-line treatment for Shigella infection?"
    back: "Fluoroquinolones (e.g., ciprofloxacin)\n\nFluoroquinolones are first-line for Shigella infection. Supportive therapy is important, but antidiarrheals should be avoided due to risk of toxic megacolon."
    difficulty: medium
    tags: [gastroenterology, shigella, treatment, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the prevention strategy for traveler's diarrhea (non-antibiotic)?"
    back: "Avoid high-risk foods/beverages, proper hygiene, bismuth subsalicylate (Pepto-Bismol) 60% effective\n\nPrevention includes avoiding street vendor food, unbottled water, raw fruits without peels, and taking bismuth subsalicylate 2 tablets QID."
    difficulty: easy
    tags: [travel-medicine, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the treatment for Campylobacter jejuni infection?"
    back: "Macrolides (e.g., azithromycin) or fluoroquinolones if susceptible\n\nMacrolides are first-line for Campylobacter. Fluoroquinolone resistance is increasing, so empiric treatment should consider local resistance patterns."
    difficulty: medium
    tags: [gastroenterology, campylobacter, treatment, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What neurological complication is associated with Campylobacter jejuni infection?"
    back: "Guillain-Barré syndrome\n\nCampylobacter jejuni infection is a trigger for Guillain-Barré syndrome due to molecular mimicry between bacterial and neural antigens."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, campylobacter, neurological-complications, guillain-barre, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What complication can develop from Clostridioides difficile infection?"
    back: "Pseudomembranous colitis\n\nC. difficile infection can lead to pseudomembranous colitis, characterized by inflammatory plaques on the colonic mucosa."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, c-difficile, pseudomembranous-colitis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Should antibiotics be used to treat EHEC (STEC) diarrhea?"
    back: "No - antibiotics increase risk of HUS\n\nAntibiotics are NOT recommended for EHEC/STEC infection as they increase the risk of HUS by promoting shiga toxin release."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, ehec, stec, treatment, contraindicated, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the characteristic rash seen in Salmonella Typhi (typhoid fever) infection?"
    back: "Rose spots - blanching erythematous macules on the anterior thorax and upper abdomen\n\nRose spots are a characteristic finding in typhoid fever, typically appearing on the trunk as small, blanching erythematous papules."
    difficulty: medium
    tags: [gastroenterology, salmonella, typhoid-fever, rose-spots, rash, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is notable about the infectious dose of Shigella?"
    back: "Very small inoculum needed for infection (as few as 10-100 organisms)\n\nShigella requires a very small inoculum to cause infection, making it highly transmissible via person-to-person spread."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, shigella, epidemiology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the typical daily stool volume in severe Vibrio cholerae infection?"
    back: "1-3 liters per day (massive watery diarrhea)\n\nVibrio cholerae causes profuse watery diarrhea with stool volumes up to 1-3 liters daily, which can rapidly cause life-threatening dehydration."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, vibrio-cholera, cholera, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What should be included in stool analysis for chronic diarrhea?"
    back: "C. difficile toxin and culture & sensitivity (C&S)\n\nStool analysis for chronic diarrhea should include C. difficile toxin testing and culture & sensitivity to identify bacterial pathogens."
    difficulty: easy
    tags: [gastroenterology, chronic-diarrhea, investigation, c-difficile, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What antibiotic is first-line for fulminant C. difficile infection?"
    back: "Oral vancomycin (with IV metronidazole if ileus present)\n\nFor fulminant C. difficile infection, oral vancomycin is used; IV metronidazole is added to the regimen if ileus is present."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, C-difficile, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is unique about Shigella infection requiring treatment?"
    back: "Very small inoculum needed for infection\n\nShigella requires a very small inoculum to cause infection, making it highly contagious. Complications include toxic megacolon and HUS."
    difficulty: easy
    tags: [gastroenterology, infectious-diarrhea, Shigella, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which antibiotic is typically used for severe Campylobacter jejuni infection?"
    back: "Macrolide (e.g., azithromycin) or fluoroquinolone if diarrhea >1 week, bloody, or immunocompromised\n\nCampylobacter jejuni is treated with macrolides or fluoroquinolones when diarrhea is prolonged (>1 week), bloody, or in immunocompromised patients."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, Campylobacter, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Why are antibiotics contraindicated in EHEC/STEC infection?"
    back: "Antibiotics increase the risk of HUS\n\nAntibiotics increase the risk of hemolytic uremic syndrome (HUS) in EHEC/STEC infection, so treatment is supportive and antidiarrheals should be avoided."
    difficulty: medium
    tags: [gastroenterology, infectious-diarrhea, E-coli, HUS, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which antibiotics are typically avoided in patients developing C. difficile?"
    back: "Clindamycin, fluoroquinolones, penicillins, and cephalosporins\n\nC. difficile infection typically follows treatment with clindamycin, fluoroquinolones, penicillins, or cephalosporins; these should be stopped if possible when C. difficile develops."
    difficulty: easy
    tags: [gastroenterology, C-difficile, antibiotics, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is Ascending Cholangitis?"
    back: "Infection of the biliary tree due to stasis from obstruction or stricture\n\nMost commonly caused by E. coli, Klebsiella, Enterobacter, Enterococcus, with possible coinfection by Bacteroides and Clostridia."
    difficulty: easy
    tags: [cholangitis, biliary infection, GI infection, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is the prognosis of treated ascending cholangitis (without Reynolds' pentad)?"
    back: "Good with effective drainage and antibiotics\n\nMild to moderate cases have good outcomes when promptly treated with drainage (preferably ERCP) and appropriate antibiotics."
    difficulty: easy
    tags: [cholangitis, prognosis, treatment, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What bacteria cause ascending cholangitis?"
    back: "E. coli, Klebsiella, Enterobacter, Enterococcus; coinfection with Bacteroides and Clostridia can occur\n\nBroad-spectrum antibiotics covering Gram-negatives, Enterococcus, and anaerobes are required"
    difficulty: easy
    tags: [Gastroenterology, Cholangitis, Microbiology, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What complication is associated with Shigella dysenteriae infection?"
    back: "Toxic megacolon and HUS\n\nShigella can cause toxic megacolon, and antidiarrheals may increase this risk. HUS is also a complication."
    difficulty: medium
    tags: [gastroenterology, shigella, toxic-megacolon, hus, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "Which pathogen has the smallest inoculum required for infection?"
    back: "Shigella\n\nShigella requires a very small inoculum for infection, making it highly transmissible through fecal-oral route."
    difficulty: easy
    tags: [gastroenterology, shigella, infectious-diarrhea, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the typical duration of norovirus infection?"
    back: "24 hours\n\nNorovirus causes self-limited gastroenteritis with 24-hour incubation period and 24-hour duration, with no specific treatment."
    difficulty: easy
    tags: [gastroenterology, norovirus, viral-gastroenteritis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What stool studies should be ordered for chronic diarrhea workup?"
    back: "C. difficile toxin and culture & sensitivity (C&S)\n\nStool analysis for C. difficile toxin and C&S are part of the initial workup for chronic diarrhea, guided by history."
    difficulty: medium
    tags: [gastroenterology, chronic-diarrhea, investigations, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the recommended antibiotic prophylaxis for cirrhotic patients with upper gastrointestinal bleeding?"
    back: "Antibiotic prophylaxis is recommended for cirrhotic patients with upper GI bleeding to prevent bacterial infections and reduce rebleeding\n\nA Cochrane updated review (Aliment Pharmacol Ther 2011) demonstrated that antibiotic prophylaxis improves outcomes in cirrhotics with variceal or non-variceal bleeding"
    difficulty: hard
    tags: [cirrhosis, GI bleeding, antibiotic prophylaxis, varices, hepatology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is the epidemiology and treatment of cholera?"
    back: "Cholera is an enteric infection caused by Vibrio cholerae, presenting with voluminous watery diarrhea, and treated with rehydration (oral and IV) and antibiotics\n\nA review (Lancet 2012) covers cholera pathophysiology, transmission, clinical presentation, and treatment approaches including antibiotic therapy"
    difficulty: medium
    tags: [cholera, infectious diarrhea, Vibrio, travel medicine, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What antibiotics should be used for Ascending Cholangitis?"
    back: "Broad-spectrum antibiotics covering Gram-negatives, Enterococcus, and anaerobes (e.g., ampicillin-sulbactam, piperacillin-tazobactam, or metronidazole + 3rd gen cephalosporin)\n\nNo clear consensus exists; consider coverage especially when CBD manipulation is anticipated."
    difficulty: medium
    tags: [cholangitis, antibiotics, treatment, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is the infection rate for dirty/infected surgical wounds?"
    back: "Approximately 30-40%.\n\nDirty/infected wounds (established infection before surgery or traumatic wounds with devitalized tissue) have the highest infection rate at 30-40%."
    difficulty: easy
    tags: [surgery, SSI, wound classification, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What are the procedure-related risk factors for surgical site infection?"
    back: "Prolonged preoperative hospitalization, inadequate skin preparation, multiple antibiotics, reduced blood flow, breaks in sterile technique, foreign bodies (drains, sutures), excessive tension, hematoma, seroma, hypoxemia, and hypothermia.\n\nThese factors create an environment conducive to bacterial growth or compromise host defenses at the surgical site."
    difficulty: easy
    tags: [surgery, SSI, risk factors, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What are the non-antibiotic measures to prevent surgical site infection?"
    back: "Normothermia (maintain 36-38°C), hyperoxygenation (FiO2 80%), chlorhexidine-alcohol skin wash, hair removal only if necessary (clipping preferred over shaving), and consider delayed primary closure for contaminated wounds.\n\nThese measures optimize host defenses and reduce bacterial load through physical and physiological optimization."
    difficulty: easy
    tags: [surgery, SSI, prophylaxis, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "When do surgical site infections typically present postoperatively?"
    back: "Postoperative day 5-8, though Streptococcus and Clostridium can present within 24 hours.\n\nMost SSIs present in the first week after surgery, but early-onset infections within 24-48 hours suggest highly virulent organisms like Streptococcus or Clostridium."
    difficulty: easy
    tags: [surgery, SSI, clinical features, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What are the clinical features of surgical site infection?"
    back: "Fever, localized pain, blanchable erythema, induration, purulent discharge, and warmth.\n\nThese classic signs of infection result from the inflammatory response to bacterial contamination of the surgical wound."
    difficulty: easy
    tags: [surgery, SSI, clinical features, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What are the complications of surgical site infection?"
    back: "Fistula, sinus tracts, sepsis, abscess, suppressed wound healing, superinfection, necrotizing fasciitis, wound dehiscence, evisceration, and hernia.\n\nSSI can progress to deep tissue involvement and systemic complications if not adequately treated, potentially becoming life-threatening."
    difficulty: medium
    tags: [surgery, SSI, complications, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What is the treatment for established surgical site infection?"
    back: "Examine the wound (inspect, compress, swab drainage for C&S), reopen affected portion, drain and pack to heal by secondary intention; debride necrotic tissue for deeper infections; antibiotics only if cellulitis or immunodeficiency.\n\nTreatment focuses on source control—drainage and removal of infected tissue—plus antibiotics for selected cases. Most SSIs heal by secondary intention."
    difficulty: medium
    tags: [surgery, SSI, treatment, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What organisms commonly cause surgical site infections from skin flora?"
    back: "Gram-positive cocci including Staphylococcus aureus and Streptococcus species.\n\nThese are the most common pathogens in clean surgeries where endogenous flora from skin is the source of contamination."
    difficulty: easy
    tags: [surgery, SSI, microbiology, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "When should postoperative antibiotics be reserved for in SSI management?"
    back: "Postoperative antibiotics should be reserved for treatment of suspected or documented intra-abdominal infection, not routine prophylaxis.\n\nUnnecessary postoperative antibiotics contribute to resistance without benefit; they should only be used when treating established infection."
    difficulty: easy
    tags: [surgery, antibiotics, SSI, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What is the sensitivity and specificity of Anti-CCP for Rheumatoid Arthritis?"
    back: "Sensitivity 80%, Specificity 94-98%\n\nAnti-CCP is highly specific for RA and may be useful in early disease to predict persistent and erosive disease."
    difficulty: easy
    tags: [rheumatoid-arthritis, anti-CCP, autoantibodies, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the sensitivity and specificity of ANCA (anti-PR3 by ELISA) for Granulomatosis with Polyangiitis?"
    back: "Sensitivity 90%, Specificity 80-95%\n\nANCA testing using ELISA method (anti-PR3) is more specific than immunofluorescence technique."
    difficulty: medium
    tags: [gpa, anca, vasculitis, autoantibodies, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "Why is Rheumatoid Arthritis considered an independent risk factor for cardiovascular disease?"
    back: "RA is associated with increased overall mortality and morbidity from all causes, particularly cardiovascular disease, neoplasms (especially lymphoma), and infection\n\nThe chronic inflammatory state in RA contributes to accelerated atherosclerosis."
    difficulty: medium
    tags: [rheumatoid-arthritis, cardiovascular, mortality, prognosis, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the clinical significance of a negative ANA test in a patient suspected of having SLE?"
    back: "A negative ANA can help rule out SLE due to its high sensitivity (98%)\n\nGiven the high false positive rate, ANA should only be measured when there is high pre-test probability."
    difficulty: easy
    tags: [sle, ana, diagnosis, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the first-line imaging study for hydronephrosis and its sensitivity/specificity?"
    back: "Ultrasound - greater than 90% sensitive and specific\n\nUltrasound is the initial imaging modality of choice due to its high sensitivity and specificity for detecting hydronephrosis without radiation exposure."
    difficulty: easy
    tags: [hydronephrosis, imaging, ultrasound, diagnosis, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the first-line antibiotic for uncomplicated UTI?"
    back: "TMP-SMX (160 mg/800 mg PO BID) for 3 days, or nitrofurantoin (100 mg PO BID) for 5 days, or fosfomycin (3g PO single dose)\n\nChoice should be based on local resistance patterns and adjusted according to culture and sensitivity results."
    difficulty: easy
    tags: [UTI, antibiotics, treatment, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the definition of asymptomatic bacteriuria?"
    back: "Asymptomatic with 100,000 CFU/mL of a single organism on urine culture\n\nAsymptomatic bacteriuria only requires treatment in specific patients (pregnancy, immunosuppressed, prior to urologic surgery)."
    difficulty: easy
    tags: [UTI, asymptomatic bacteriuria, diagnosis, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "When should cystoscopy be considered in overactive bladder evaluation?"
    back: "To rule out recurrent infections, carcinoma in situ, and other intravesical abnormalities\n\nCystoscopy is indicated when there is suspicion of structural or malignant pathology."
    difficulty: medium
    tags: [overactive bladder, cystoscopy, diagnosis, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What laboratory investigations are needed for hydronephrosis?"
    back: "CBC, electrolytes, creatinine, BUN, urinalysis, and urine culture and sensitivity\n\nThese tests evaluate for infection, renal function impairment, and guide antibiotic therapy if needed."
    difficulty: easy
    tags: [hydronephrosis, laboratory, diagnosis, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
