  - guid: 354657687980a1b2
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Functions and Relationships"
    fields:
      Front: "What is the first-difference test for deciding if a relationship is linear from a table?"
      Back: "Make sure x increases by a constant step. Then work out the FIRST DIFFERENCES of y (each y minus the previous y).\nIf the first differences are all the SAME (constant) ⇒ the relationship is LINEAR (a straight line, y = mx + c).\nIf they are NOT constant ⇒ NON-LINEAR.\nExample: y = 3,7,11,15 → differences 4,4,4 (constant) ⇒ linear."
    tags: ["linear", "non-linear", "first-difference", "subject:functions-and-relationships"]
  - guid: 4657687980a1b2c3
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Functions and Relationships"
    fields:
      Front: "Is x = 1,2,3,4,5 → y = 2,5,8,11,14 linear or non-linear? Give the reason."
      Back: "First differences: 5−2=3, 8−5=3, 11−8=3, 14−11=3.\nAll equal 3 (constant) ⇒ LINEAR.\nReason to write: 'The first difference between consecutive y-values is constant (3), so the relationship is linear.'\nIts rule: y = 3x − 1."
    tags: ["linear", "first-difference", "subject:functions-and-relationships"]
  - guid: 57687980a1b2c3d4
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Functions and Relationships"
    fields:
      Front: "Is x = 1,2,3,4 → y = 3,6,11,18 linear or non-linear? Show how you know."
      Back: "First differences: 6−3=3, 11−6=5, 18−11=7.\nThe differences (3, 5, 7) are NOT constant ⇒ NON-LINEAR.\nReason: 'The first differences are not equal, so the relationship is not linear.'\n(Note: the second differences 5−3=2, 7−5=2 are constant, which signals a quadratic — here y = x² + 2.)"
    tags: ["non-linear", "quadratic", "first-difference", "subject:functions-and-relationships"]
  - guid: 687980a1b2c3d4e5
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Functions and Relationships"
    fields:
      Front: "Common pitfall: x jumps unevenly. x = 1,2,4,7 → y = 2,4,8,14. Is it linear?"
      Back: "You CANNOT compare raw y-differences when x steps are unequal. Compare the RATE Δy ÷ Δx instead.\n1→2: Δx=1, Δy=2, rate 2.\n2→4: Δx=2, Δy=4, rate 2.\n4→7: Δx=3, Δy=6, rate 2.\nThe rate is constant (2) ⇒ LINEAR. Rule: y = 2x.\nPitfall: the y-differences 2,4,6 look non-constant, but the relationship is still linear because x did not step evenly."
    tags: ["linear", "rate-of-change", "first-difference", "subject:functions-and-relationships"]
  - guid: 7980a1b2c3d4e5f6
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Functions and Relationships"
    fields:
      Front: "How can you recognise a linear relationship from its equation or its graph?"
      Back: "Equation: linear if it has the form y = mx + c — x is to the power 1 only, with NO x², √x, 1/x, etc.\nLinear examples: y = 3x + 2, y = −x, y = ½x − 4.\nNon-linear examples: y = x², y = x² − 1, y = 1/x.\nGraph: linear relationships plot as a STRAIGHT LINE; non-linear ones plot as a curve."
    tags: ["linear", "non-linear", "equation", "graph", "subject:functions-and-relationships"]
