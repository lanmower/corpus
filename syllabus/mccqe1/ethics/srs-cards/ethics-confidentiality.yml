# Confidentiality & Disclosure (Ethics) - generated from srs-mccqe1
cards:
  - front: "When is a physician permitted to break patient confidentiality?"
    back: "Mandatory reporting: communicable diseases (public health legislation), child abuse/neglect, gunshot wounds; Discretionary: imminent danger to identifiable third party (Tarasoff duty to protect), fitness to drive impairment, child protection\n\nCMPA guidelines: confidentiality is a cornerstone of the physician-patient relationship. Exceptions require a higher ethical duty. Physicians in Canada do not have a \"duty to warn\" in the same way as the US Tarasoff ruling — but provinces have various discretionary and mandatory reporting laws."
    difficulty: medium
    tags: [confidentiality, mandatory reporting, Tarasoff, duty to warn, ethics]
  - front: "What are the mandatory reporting obligations for physicians in Ontario regarding child abuse?"
    back: "ALL healthcare professionals (and others) who reasonably suspect a child under 16 (Ontario — 18 in some provinces) is being abused or neglected MUST report to the Children's Aid Society (CAS) — duty is personal and cannot be delegated\n\nCMPA: reporting child abuse is a positive legal duty — failure to report is an offense under the Child, Youth and Family Services Act. Report any reasonable suspicion — physicians do not need certainty. Report even if child or parents ask you not to. CAS investigates; physician's role is to report, not investigate."
    difficulty: medium
    tags: [mandatory reporting, child abuse, CAS, Ontario, ethics]
  - front: "A patient tells you they plan to seriously harm their ex-partner. What are your obligations?"
    back: "Duty to protect: warn the potential victim, notify police, consider involuntary hospitalization — balance confidentiality against duty to protect identifiable third party from serious bodily harm\n\nCanadian law (Tsilhqot'in v. BC, provincial legislation): no universal Tarasoff-style duty to warn in all provinces, but most colleges and CMPA guidelines support discretionary disclosure to protect identifiable third party from serious, imminent harm. Exhaust other options first (hospitalization, persuasion to seek help)."
    difficulty: hard
    tags: [duty to warn, confidentiality, Tarasoff, third party protection, ethics]
  - front: "What is the physician's obligation regarding reporting unfit drivers?"
    back: "Report to Ministry of Transportation (mandatory in Ontario and most provinces) when patient has a medical condition affecting safe driving ability that the patient refuses to voluntarily stop driving or report themselves\n\nHighway Traffic Act (Ontario): physician has mandatory duty to report patients with medical conditions affecting fitness to drive if patient refuses to self-report. Protected from liability for reporting in good faith. Advise patient of the reporting obligation first. Vision, dementia, epilepsy, cardiac conditions are common."
    difficulty: medium
    tags: [driving fitness, mandatory reporting, MTO, medical condition, ethics]
  - front: "What information can be disclosed to insurance companies or employers?"
    back: "Only information the patient has explicitly authorized in writing — insurance companies and employers are NOT entitled to information without patient consent; physician should provide only information relevant to the request\n\nCMPA: informed consent for disclosure to third parties is required. Patient should understand what information will be released and to whom. Physicians should exercise professional judgment about what is clinically relevant. IME (Independent Medical Examination) reports have different confidentiality rules."
    difficulty: easy
    tags: [third party disclosure, insurance, employer, patient consent, ethics]
  - front: "What are a patient's rights regarding access to their own medical records?"
    back: "Patients have the right to access their own medical records in most circumstances — physician may withhold information if disclosure would cause direct harm (PHIPA Ontario); 30-day response time required\n\nPHIPA (Personal Health Information Protection Act) Ontario: patient right to access records within 30 days. Physician may refuse access if: disclosure would result in risk of serious bodily harm, information is about third parties. Patient can request amendment of their record."
    difficulty: easy
    tags: [medical records access, PHIPA, patient rights, confidentiality, ethics]
  - front: "What is the duty of a physician when they learn a colleague is impaired?"
    back: "Report to the relevant regulatory college (CPSO in Ontario) or hospital department chief; Canadian provincial colleges have policies on physician impairment — duty to report and protect patients\n\nCMPA and CPSO: physician health programs (e.g., PHP in Ontario) exist to support impaired physicians. Colleagues should encourage voluntary participation. If patient safety is at risk, mandatory reporting is required. CMA Code of Ethics: duty to protect public from impaired colleagues."
    difficulty: medium
    tags: [impaired physician, mandatory reporting, CPSO, physician health, ethics]
  - front: "A patient with HIV refuses to disclose their status to their sexual partner. What should the physician do?"
    back: "Counsel patient about risk to partners; if patient refuses disclosure and continues to pose risk: notify public health (mandatory for HIV under public health legislation in most provinces); public health officer can then notify partner\n\nMost Canadian provinces: HIV is notifiable to public health. Public health officer (not physician directly) notifies contacts if patient refuses. Physician should exhaust persuasion before notifying. Balancing confidentiality and public health protection is a legal and ethical obligation."
    difficulty: hard
    tags: [HIV disclosure, partner notification, public health reporting, confidentiality, ethics]
  - front: "What is the therapeutic exception to informed consent?"
    back: "Therapeutic exception: information can be withheld if it would cause direct psychological harm sufficient to impair rational decision-making capacity — extremely narrow exception, NOT to be used to withhold information to avoid \"upsetting\" patient\n\nCMPA: therapeutic exception is controversial and rarely applicable. Physician must document justification clearly. Cultural requests to withhold information must be balanced against patient autonomy. Pre-empting distress by providing information thoughtfully is preferable to invoking therapeutic exception."
    difficulty: medium
    tags: [therapeutic exception, informed consent, withholding information, CMPA, ethics]
  - front: "What are the obligations when a patient discloses domestic violence?"
    back: "Screen for safety, offer resources (shelters, legal aid, counseling), document in chart with patient's consent, report to police ONLY if patient consents (except for mandatory reporting of child abuse if children at risk) — do NOT report without consent in adult DV\n\nCMPA and CMA: mandatory reporting of domestic violence against competent adults does NOT exist in Canada (unlike child abuse). Respecting patient autonomy means not reporting without consent — could worsen safety if abuser is notified. Safety planning, community resources, and follow-up are the physician's role."
    difficulty: hard
    tags: [domestic violence, reporting obligations, safety planning, patient consent, ethics]
  - front: "A 35-year-old truck driver discloses to his family physician that he has been experiencing syncope episodes approximately once per week for the past month. He has not yet been investigated. He begs the physician not to report him as he will lose his livelihood. He has not had a syncopal episode while driving. What is the physician's MOST appropriate action?\n\nA) Maintain strict confidentiality as no accident has occurred\nB) Report him immediately to the Ministry of Transportation as syncope is a mandatory reportable condition in most provinces\nC) Investigate the syncope urgently and advise him to stop driving pending workup, with mandatory reporting if he refuses\nD) Negotiate a voluntary cessation of driving agreement and avoid mandatory reporting if he complies\nE) Refer to neurology and defer any reporting decision until a diagnosis is established"
    back: "C) Investigate the syncope urgently and advise him to stop driving pending workup, with mandatory reporting if he refuses\n\nSyncope in a commercial driver represents a serious, IMMEDIATE public safety risk. Most provinces have mandatory reporting obligations for physicians when a patient's medical condition impairs their ability to drive safely. Uncontrolled syncope is explicitly listed in most provincial motor vehicle legislation as a reportable condition. The standard approach: advise the patient to stop driving, explain your reporting obligation, attempt voluntary compliance first, but proceed with mandatory reporting if he refuses or if the risk is imminent. Simply waiting for a diagnosis without acting is inappropriate."
    difficulty: hard
    tags: [Confidentiality, MCQ, Toronto Notes]
  - front: "A 28-year-old woman discloses to her ER physician that her injuries (bruising on the arms, a cracked rib) were inflicted by her common-law partner, not a fall as she initially stated. She is cognitively intact, has no children at home, and explicitly asks the physician not to report or contact police. What is the most appropriate response?\n\nA) Call police immediately as this is an assault\nB) Respect her autonomous refusal of police contact, provide safety resources, and document carefully\nC) Report immediately under mandatory domestic violence reporting legislation applicable in all provinces\nD) Admit her against her will for her safety\nE) Consult social work and make reporting contingent on their assessment"
    back: "B) Respect her autonomous refusal of police contact, provide safety resources, and document carefully\n\nCritically: there is NO universal mandatory reporting law for domestic violence involving competent ADULTS in Canada. Unlike child abuse or gunshot wounds, spousal/partner abuse in a capable adult does NOT trigger mandatory reporting in most Canadian jurisdictions. The competent adult woman's autonomous decision NOT to involve police must be respected. The physician's role is: treat injuries, assess safety, provide resources (shelters, safety planning), document carefully, and ensure follow-up. Calling police without consent violates her autonomy and may even increase danger."
    difficulty: hard
    tags: [Mandatory Reporting, MCQ, Toronto Notes]
  - front: "A physician treats a 19-year-old with a gunshot wound to the leg. The patient, fully alert and coherent, insists the wound was self-inflicted by accident while cleaning a firearm and begs the physician not to contact police. What is the most legally correct action in most Canadian provinces?\n\nA) Respect the patient's privacy and treat without reporting\nB) Report to police as gunshot wounds are subject to mandatory reporting in most provinces regardless of patient wishes\nC) Report only if the physician suspects the wound was inflicted by a third party\nD) Report only if the injury is consistent with attempted homicide\nE) Report only after obtaining explicit patient consent"
    back: "B) Report to police as gunshot wounds are subject to mandatory reporting in most provinces regardless of patient wishes\n\nGunshot wounds are subject to MANDATORY REPORTING to police in most Canadian provinces (e.g., Ontario's Gunshot Wounds Mandatory Reporting Act, 2005). This applies regardless of: (a) patient consent/refusal, (b) whether the wound was self-inflicted or inflicted by another, and (c) the clinical severity. Knife/stab wounds have variable reporting requirements by province. The patient's wishes do not override the mandatory statutory obligation. The physician should inform the patient of the reporting requirement."
    difficulty: hard
    tags: [Mandatory Reporting, MCQ, Toronto Notes]
  - front: "A physician is treating an HIV-positive patient who is sexually active with a known partner and refuses to disclose his status to that partner despite extensive counselling over 6 months. The physician knows the partner personally from the community. Under the duty-to-warn framework, which action is MOST appropriate?\n\nA) Breach confidentiality immediately and warn the partner directly\nB) Continue counselling indefinitely as disclosure requires patient consent\nC) Discharge the patient from care for non-compliance\nD) Notify public health and allow them to conduct partner notification (contact tracing)\nE) Seek a court injunction preventing the patient from having unprotected sex"
    back: "D) Notify public health and allow them to conduct partner notification (contact tracing)\n\nMost provinces have a structured approach: (1) counsel extensively; (2) if persistent refusal, involve public health for PARTNER NOTIFICATION (anonymous contact tracing). Public health authorities have legal powers to conduct contact tracing without identifying the physician as the source. This balances confidentiality with duty to warn. Direct personal disclosure by the physician is a last resort and must follow provincial guidelines. In Ontario, the duty to warn is codified — physicians MAY disclose to identifiable partners at serious risk, but public health notification is the preferred pathway."
    difficulty: hard
    tags: [Confidentiality, MCQ, Toronto Notes]
  - front: "A pediatrician sees a 4-year-old with multiple bruises in various stages of healing on the torso and buttocks. The mother's explanation is plausible but inconsistent between visits. The physician is not certain abuse has occurred. Which statement is MOST correct regarding mandatory reporting in Canada?\n\nA) The physician must be certain abuse has occurred before making a child protection report\nB) The reporting threshold is 'reasonable suspicion' — not certainty — that a child may be in need of protection\nC) The physician should first contact the parents and obtain their explanation before reporting\nD) Reporting should be deferred until a skeletal survey and forensic interview are completed\nE) Reports should be made to police, not child protective services"
    back: "B) The reporting threshold is 'reasonable suspicion' — not certainty — that a child may be in need of protection\n\nChild protection reporting in ALL Canadian provinces and territories is triggered by REASONABLE SUSPICION, not certainty or proof. Physicians are NOT investigators. The purpose of the report is to trigger a professional investigation by child protective services. Failure to report is a provincial offence. A physician who delays reporting to gather more evidence, or who does not report because they 'aren't sure,' may face professional and legal consequences. Reports go to child protective services (e.g., CAS in Ontario), not directly to police (though police may be involved concurrently)."
    difficulty: hard
    tags: [Mandatory Reporting, MCQ, Toronto Notes]
  - front: "A psychiatrist has been treating a patient with paranoid schizophrenia who, during a session, makes a detailed threat to harm a specific named coworker 'the next time I see him.' The patient has a prior history of violence and access to weapons. The coworker is not the patient's treating physician's contact. What is the MOST appropriate action based on Canadian ethical/legal standards?\n\nA) Maintain confidentiality as the threat reflects the patient's illness, not genuine intent\nB) Hospitalize the patient involuntarily and notify the named coworker and/or police\nC) Document the threat and increase session frequency\nD) Inform the patient's family only\nE) Notify the CPSO for guidance before taking action"
    back: "B) Hospitalize the patient involuntarily and notify the named coworker and/or police\n\nBased on the Tarasoff principle (adapted in Canadian law) and the duty to protect, when there is a SERIOUS, CREDIBLE, IMMINENT threat to an IDENTIFIABLE victim, the physician has a duty to protect that person. Actions include: (1) hospitalize involuntarily if criteria are met, (2) notify police, (3) warn the identifiable victim directly. The presence of prior violence + access to weapons + specific named target + specific timeframe makes this a high-risk scenario. Confidentiality is overridden by the duty to protect third parties. Doing nothing or just increasing sessions is insufficient."
    difficulty: hard
    tags: [Confidentiality, MCQ, Toronto Notes]
  - front: "A hospital receives a request from a pharmaceutical company for de-identified patient data from their EMR to be used for drug efficacy research. The hospital privacy officer has confirmed the data is sufficiently de-identified under PIPEDA standards. No patient consent was obtained. Which statement is MOST accurate?\n\nA) This is not permitted — research use always requires explicit patient consent\nB) De-identified data is not subject to PIPEDA and may be shared without restriction\nC) Research use of de-identified health information may be permitted under provincial health privacy legislation without individual consent, subject to REB oversight and specific conditions\nD) De-identification removes all ethical obligations toward the data subjects\nE) The data can only be shared with academic institutions, not private companies"
    back: "C) Research use of de-identified health information may be permitted under provincial health privacy legislation without individual consent, subject to REB oversight and specific conditions\n\nProvincial health privacy legislation (e.g., PHIPA in Ontario) permits disclosure of de-identified data for research purposes without consent under specific conditions: (1) the data is truly de-identified per accepted standards, (2) the research has REB approval, (3) the researcher enters into a data sharing agreement. However, de-identification must meet a rigorous standard — re-identification risk must be acceptably low. Sharing with pharmaceutical companies is not categorically prohibited but requires careful governance. PIPEDA's application to de-identified data is nuanced — once data no longer identifies an individual, it falls outside PIPEDA's scope."
    difficulty: hard
    tags: [Privacy, MCQ, Toronto Notes]
  - front: "A physician treating a patient with type 1 diabetes learns the patient is a licensed airline pilot. The patient's most recent HbA1C is 10.2% and they have had three documented hypoglycemic episodes in the past year, one requiring glucagon administration. Transport Canada requires pilots to meet specific metabolic criteria. The patient refuses consent for the physician to contact Transport Canada. What is the appropriate response?\n\nA) Respect confidentiality absolutely — the physician has no authority to contact Transport Canada\nB) The physician should advise the patient of the potential duty to report and, if the patient refuses voluntary disclosure, report to Transport Canada under aviation safety obligations\nC) The physician should report only if the patient has had an in-flight hypoglycemic episode\nD) A referral to endocrinology resolves the physician's obligation\nE) The physician can only report if they know the patient is currently flying"
    back: "B) The physician should advise the patient of the potential duty to report and, if the patient refuses voluntary disclosure, report to Transport Canada under aviation safety obligations\n\nAviation safety represents a public safety exception to confidentiality. Physicians have a duty to protect the public from medically unfit pilots. Transport Canada's requirements for pilots with insulin-dependent diabetes are strict. Poorly controlled T1DM with recurrent hypoglycemia (especially one requiring glucagon) clearly disqualifies this pilot. The approach mirrors the impaired driver pathway: advise the patient, request voluntary disclosure, report if he refuses. Waiting for an in-flight incident is clinically and ethically unacceptable."
    difficulty: hard
    tags: [Mandatory Reporting, MCQ, Toronto Notes]
  - front: "A patient's employer contacts her family physician requesting a general assessment of her 'mental fitness for work' without specifying a diagnosis. The patient has signed a generic release form provided by the employer. Which is the most appropriate response?\n\nA) Provide a full psychiatric history as the patient has signed a release\nB) Decline to provide any information — releases to employers are categorically impermissible\nC) Provide only information relevant and proportionate to the specific fitness-for-work assessment, after confirming the scope of consent with the patient\nD) Forward the entire medical record as the signed release constitutes unlimited consent\nE) Refer the patient to an occupational medicine specialist to avoid a conflict of interest"
    back: "C) Provide only information relevant and proportionate to the specific fitness-for-work assessment, after confirming the scope of consent with the patient\n\nA generic release form does NOT constitute unlimited consent to disclose all medical information. Consent must be INFORMED, VOLUNTARY, and SPECIFIC to the information being released. The physician should: (1) discuss the request with the patient to clarify what she understands she consented to, (2) release only the minimum necessary information relevant to the stated purpose, (3) not volunteer diagnoses beyond what is functionally relevant. Occupational assessments require care to avoid dual loyalty conflicts between employer and patient interests."
    difficulty: hard
    tags: [Privacy, MCQ, Toronto Notes]
  - front: "An 82-year-old woman with moderate dementia is admitted to hospital. Her daughter, who does not hold legal SDM status, insists the medical team not disclose the diagnosis of cancer to the patient 'because it will upset her.' The patient, when lucid moments occur, repeatedly asks the team 'do I have cancer?' What is the MOST ethically sound approach?\n\nA) Respect the family's cultural wishes and withhold the diagnosis\nB) Disclose the diagnosis to the patient when she has a lucid moment, as her expressed questions indicate she wants information\nC) Formally assess the patient's capacity; if she has capacity for this specific decision, honor her request for information despite family objections\nD) Involve the ethics committee before making any disclosure\nE) Disclose the diagnosis only if it will directly affect a treatment decision in the next 24 hours"
    back: "C) Formally assess the patient's capacity; if she has capacity for this specific decision, honor her request for information despite family objections\n\nTherapeutic privilege (withholding information to prevent harm) is narrowly defined and highly controversial in Canadian medical ethics. It does NOT extend to family-directed censorship of information. If the patient has capacity during lucid moments, she has the right to receive her own medical information. Her repeated questions indicate she is seeking disclosure. The daughter, without SDM status, has no legal right to control what information the patient receives. Capacity assessment (decision-specific) is the key step — if she has capacity to receive this information, disclose it."
    difficulty: hard
    tags: [Confidentiality, MCQ, Toronto Notes]
  - front: "Under Ontario's Personal Health Information Protection Act (PHIPA), which of the following would constitute a PRIVACY BREACH requiring notification?\n\nA) A physician accidentally sees a colleague's test results while logged into the shared EMR and immediately logs out\nB) A nurse faxes a patient's discharge summary to the correct physician but the fax is sent to a wrong number and received by an unrelated business\nC) A resident discusses a patient case using a pseudonym at a hospital education rounds\nD) A privacy officer accesses patient files as part of a formal quality assurance audit\nE) A hospital shares de-identified data with a provincial health authority for planning purposes"
    back: "B) A nurse faxes a patient's discharge summary to the correct physician but the fax is sent to a wrong number and received by an unrelated business\n\nPHIPA defines a privacy breach as the collection, use, or disclosure of personal health information in contravention of the Act. A misdirected fax containing identifiable patient information constitutes an unauthorized disclosure — even if unintentional. PHIPA (s.12) requires health information custodians to notify affected individuals of privacy breaches 'at the first reasonable opportunity.' The other scenarios do not constitute breaches: pseudonymized case discussions for education are generally permitted; quality assurance audits by authorized personnel are not breaches; de-identified data falls outside PHIPA's scope."
    difficulty: hard
    tags: [Privacy Law, MCQ, Toronto Notes]
  - front: "A patient who was treated for a mental health crisis 3 years ago requests a copy of all her health records from the hospital under PHIPA. The treating psychiatrist believes releasing records regarding her delusional beliefs may cause her serious harm. What is the MOST appropriate response?\n\nA) Release all records immediately — patients have an absolute right of access under PHIPA\nB) The hospital may withhold specific portions of the record if disclosure would result in serious harm to the patient or a third party, after assessing each record individually\nC) The psychiatrist may deny the entire request based on therapeutic privilege\nD) The patient's access rights under PHIPA do not apply to mental health records\nE) Release the records only if accompanied by a mandatory counselling session"
    back: "B) The hospital may withhold specific portions of the record if disclosure would result in serious harm to the patient or a third party, after assessing each record individually\n\nPHIPA grants patients a general right of access to their health information, but s.52(1)(e) allows a custodian to WITHHOLD specific information if disclosure 'could reasonably be expected to result in serious bodily harm to the individual or another person.' This is NOT a blanket denial — it must be applied to specific portions of the record. The custodian must provide access to the severable remainder. The patient may challenge the withholding to the Information and Privacy Commissioner. A blanket denial based on general therapeutic privilege is not permitted."
    difficulty: hard
    tags: [Privacy Law, MCQ, Toronto Notes]
  - front: "A 17-year-old presents for STI testing. Results show gonorrhea. He refuses to allow the physician to notify his parents. He is a mature minor. The physician is required to report the STI to public health. What is the appropriate approach?\n\nA) Notify parents as gonorrhea is a serious STI requiring parental guidance\nB) Maintain confidentiality with the patient; report to public health using the patient's identifying information as required by the applicable communicable disease legislation; offer partner notification support\nC) Refuse to treat without parental consent as the patient is under 18\nD) Notify parents if the patient is still living in the parental home\nE) Only report to public health with explicit patient consent"
    back: "B) Maintain confidentiality with the patient; report to public health using the patient's identifying information as required by the applicable communicable disease legislation; offer partner notification support\n\nGonorrhea is a REPORTABLE COMMUNICABLE DISEASE under all provincial public health acts — reporting is mandatory and does not require patient consent. However, the patient's mature minor status protects his confidentiality FROM HIS PARENTS — the mandatory report goes to public health, not to parents. Public health reporting and parental notification are entirely separate obligations. The physician should: treat, report to public health as required, maintain confidentiality from parents, and offer assisted partner notification. This is a classic 'two separate obligations' question."
    difficulty: hard
    tags: [Confidentiality, MCQ, Toronto Notes]
  - front: "A patient who is a police officer asks her physician to provide medical records to her employer documenting a psychiatric hospitalization 2 years ago. The physician knows the request relates to a fitness-for-duty evaluation. The patient has signed a release form. What specific risk should the physician consider before releasing the full psychiatric records?\n\nA) No risk — the signed release removes all physician obligations\nB) The risk that the patient signed the consent under employment duress (coercive consent), and the physician should confirm the consent is truly voluntary and informed before releasing sensitive psychiatric records\nC) The risk of civil liability from releasing accurate medical information\nD) No release should occur without a second signature from a family member\nE) The physician must notify the CMPA before releasing psychiatric records to employers"
    back: "B) The risk that the patient signed the consent under employment duress (coercive consent), and the physician should confirm the consent is truly voluntary and informed before releasing sensitive psychiatric records\n\nWhile a patient-signed release generally permits disclosure, the physician must consider whether the consent was TRULY VOLUNTARY when it arises in an employment context — especially for a police officer facing a mandatory fitness-for-duty evaluation. COERCIVE CONSENT is a recognized concern when refusal to sign may result in job loss or disciplinary action. The physician should: (1) meet with the patient privately, (2) confirm understanding of what will be disclosed, (3) discuss any concerns, (4) release minimum necessary information relevant to fitness for duty only. Full psychiatric records may go far beyond what is functionally necessary."
    difficulty: hard
    tags: [Confidentiality, MCQ, Toronto Notes]
  - front: "A medical student on a surgery rotation discusses a patient case in detail (including the patient's name and diagnosis) with classmates at a hospital cafeteria. Several non-hospital visitors overhear the conversation. This scenario MOST directly represents:\n\nA) Acceptable peer learning as clinical discussion is educational\nB) A privacy breach — identifiable patient information disclosed in a public setting without clinical or educational justification, violating PHIPA and professional obligations\nC) A CPSO reportable incident\nD) Only problematic if the patient was a public figure\nE) Acceptable if all overheard individuals are healthcare workers"
    back: "B) A privacy breach — identifiable patient information disclosed in a public setting without clinical or educational justification, violating PHIPA and professional obligations\n\nIdentifiable patient information (name + diagnosis) discussed in a public space (hospital cafeteria with non-hospital visitors) constitutes a PRIVACY BREACH under PHIPA. Clinical discussion for educational purposes is permitted in appropriate settings (private team rooms, education rounds) but must NOT involve identifiable information in spaces accessible to the public. This is an extremely common real-world scenario that is heavily emphasized in Canadian medical education. Medical students are bound by the same confidentiality obligations as licensed physicians."
    difficulty: hard
    tags: [Confidentiality, MCQ, Toronto Notes]
  - front: "Social media posts by a physician showing them at a party captioned 'crazy night after a crazy day in the OR — you wouldn't believe what I saw!' do not name any patients or include any images of patients. Is this a privacy concern?\n\nA) No — no patients are identified, so no privacy breach has occurred\nB) Potentially yes — depending on context, such posts may disclose enough detail about clinical encounters to be identifiable in small communities, and violate professionalism standards even without explicit identification; physicians must maintain professional conduct on social media\nC) No — personal social media activity is completely separate from professional obligations\nD) Only if a patient files a complaint\nE) Only if the physician's hospital is tagged in the post"
    back: "B) Potentially yes — depending on context, such posts may disclose enough detail about clinical encounters to be identifiable in small communities, and violate professionalism standards even without explicit identification; physicians must maintain professional conduct on social media\n\nCPSO and CMA social media guidelines recognize that professional obligations extend to online conduct. Even without naming patients, a post that is 'unprofessional, disrespectful, or that breaches patient confidentiality' (including through suggestive disclosures) may violate standards. In small communities, clinical descriptions can be identifying. Beyond the privacy risk, language like 'you wouldn't believe what I saw' (suggesting disclosure of unusual patient circumstances for entertainment) is itself a professionalism violation. The standard: 'Would this post be appropriate if my patient, my colleagues, and a CPSO investigator saw it?'"
    difficulty: hard
    tags: [Privacy, MCQ, Toronto Notes]
  - front: "What are the mandatory reporting obligations for physicians in Canada?"
    back: "Child abuse/neglect, gunshot wounds, certain communicable diseases (TB, STIs), unfit drivers, patient safety incidents. Varies by province\n\nReporting overrides confidentiality. Child welfare: reasonable suspicion threshold (not certainty). Duty to warn: Tarasoff-like obligations when patient poses imminent threat to identifiable third party."
    difficulty: medium
    tags: [professionalism, mandatory reporting]
  - front: "What is the Canadian physician's duty to report, and give three examples?"
    back: "Physicians are legally required to report certain conditions to authorities. Examples: gunshot wounds, suspected child abuse, communicable diseases, medical unsuitability to drive, risk of substantial harm to others. (Specifics vary by province.)\n\nMandatory reporting overrides normal confidentiality obligations. Failure to report can result in professional and legal consequences. Physicians should be familiar with province-specific legislation."
    difficulty: easy
    tags: [duty to report, ethics, confidentiality, public health]
  - front: "What is the physician's obligation when child abuse is suspected in Canada?"
    back: "Mandatory obligation to report any suspected or known case of child abuse (physical, sexual, emotional, human trafficking, child marriage) or neglect to the Children's Aid Society (CAS) personally — you cannot delegate this responsibility. Document injuries and consider consulting child abuse specialists, ordering skeletal survey X-rays (especially in non-ambulatory children), ophthalmology consult, and CT head.\n\nAll Canadian provinces and territories have mandatory reporting laws for child abuse. The threshold is reasonable suspicion, not certainty. The obligation is personal and non-delegable. Failure to report is a criminal offence. Skeletal surveys are indicated for non-ambulatory infants to detect occult fractures."
    difficulty: medium
    tags: [child abuse, mandatory reporting, CAS, pediatric, ethics]
  - front: "What is intimate partner violence (IPV) and what are the two validated screening tools used in Canada?"
    back: "IPV includes physical, sexual, emotional, psychological, and financial abuse. Screening tools: (A) WAST-SHORT (2 questions about relationship tension and conflict resolution — either endorsed with 'a lot of tension' or 'with great difficulty' is significant); (B) HITS (Hit, Insult, Threaten, Scream — scored 1-5 each, total ≥10 is significant).\n\nPhysician recognition rates of IPV are as low as 5%. Asking about abuse is the strongest predictor of disclosure. Both WAST and HITS are validated brief tools appropriate for primary care settings."
    difficulty: medium
    tags: [intimate partner violence, IPV, domestic violence, WAST, HITS, screening]
  - front: "What is the most dangerous time for a victim of intimate partner violence?"
    back: "The victim is most at risk for homicide when attempting to leave the home or following separation.\n\nSafety planning must address this high-risk period. Plans include ensuring access to an exit, establishing a safe place to go, and having emergency items prepared (money, clothes, keys, medications, important documents)."
    difficulty: easy
    tags: [intimate partner violence, safety planning, homicide risk, domestic violence]
  - front: "What are the mandatory reporting requirements for abuse in Canada?"
    back: "Reporting of suspected or known child abuse is MANDATORY. Reporting of spousal/partner abuse is NOT mandatory without the person's permission (criminal act but not reportable). Elder abuse reporting is mandatory for those in long-term care homes.\n\nCanadian law distinguishes between child, elder, and partner abuse in terms of mandatory reporting. Physicians must balance patient confidentiality with legal duties. All abuse-related visits should be documented with verbatim quotations for medico-legal purposes."
    difficulty: medium
    tags: [mandatory reporting, child abuse, elder abuse, domestic violence, confidentiality]
  - front: "What is the prevalence of intimate partner violence (IPV) in Canada and what groups have increased incidence?"
    back: "Lifetime prevalence of IPV against women: 25-30%. Similar prevalence against men (less likely reported due to stigma). Increased incidence in: pregnancy, disabled women, transgender and non-binary individuals, bisexual individuals, 18-24 age group. 25-50% chance of child abuse when partner abuse occurs.\n\nIPV occurs across all socioeconomic, educational, gender identities, and cultural groups. Physician recognition rates are as low as 5%, emphasizing the importance of universal screening. Children exposed to home violence are more likely to experience or perpetrate violence later."
    difficulty: easy
    tags: [intimate partner violence, prevalence, Canada, domestic violence, risk groups]
  - front: "In Canada, in which provinces is physician reporting of medically unfit drivers to the Ministry of Transportation mandatory vs. discretionary?"
    back: "Mandatory in all provinces and territories EXCEPT Quebec, Nova Scotia, and Alberta, where reporting is discretionary.\n\nCanadian physicians have varying legal obligations for reporting unsafe drivers depending on jurisdiction. In Ontario and British Columbia, physicians must also refer drivers ≥80 years for re-testing."
    difficulty: medium
    tags: [driving competency, geriatrics, physician reporting, Canadian guidelines, ethics]
  - front: "What are the driving restrictions after a TIA, stroke, STEMI, and first unprovoked seizure in Canada?"
    back: "TIA: No driving until medical assessment completed. Stroke: No driving for at least 1 month; may resume if functionally able with no significant motor/cognitive/perceptual/visual deficits, no obvious risk of sudden recurrence, no post-stroke seizure. STEMI or NSTEMI with significant LV damage: No driving for 1 month following hospital discharge. First unprovoked seizure: No driving for 3 months pending complete neurologic assessment, EEG, CT head.\n\nThese timelines reflect Canadian (and Ontario-specific) guidelines. They test the physician's ability to counsel patients and fulfill reporting obligations. NSTEMI with minor LV damage: no driving for 48h if PCI or 7 days if no PCI."
    difficulty: medium
    tags: [driving competency, geriatrics, TIA, stroke, seizure, STEMI, Canadian guidelines]
  - front: "What are the driving restrictions for epilepsy and insulin-dependent diabetes in Canada?"
    back: "Epilepsy: Can drive if seizure-free for 6 months, on medication that does not impair driving, and physician has insight into patient compliance (Ontario guideline). Insulin-dependent diabetes: May drive if no complications (retinopathy, nephropathy, neuropathy, cardiovascular, cerebrovascular) AND no severe hypoglycemic episode in the last 6 months.\n\nThese are common scenarios in clinical and ethical contexts. Diet-controlled or oral hypoglycemic agents have no restrictions in the absence of diabetes complications."
    difficulty: medium
    tags: [driving competency, epilepsy, diabetes, geriatrics, Canadian guidelines]
  - front: "What are the visual acuity and visual field thresholds that contraindicate driving?"
    back: "Visual acuity: contraindicated if <20/50 with both eyes examined simultaneously. Visual field: contraindicated if <120° along horizontal meridian and <15° continuous above and below fixation with both eyes examined simultaneously.\n\nMinimum visual standards ensure drivers can safely perceive hazards. Physicians should refer patients with borderline vision for ophthalmologic assessment."
    difficulty: easy
    tags: [driving competency, vision, geriatrics, visual acuity, visual field]
  - front: "What cognitive impairment level is a contraindication to driving, and which cognitive tests can suggest impaired driving fitness?"
    back: "Moderate to severe dementia is a contraindication to driving, defined as inability to independently perform 2 or more IADLs or any basic ADL. Tests suggesting impaired driving: poor MMSE, clock drawing test, or Trails B. However, MMSE score alone (whether normal or low) is insufficient to determine fitness to drive.\n\nCognitive assessment for driving fitness requires multiple domains. Systematic reviews show composite cognitive batteries consistently predict driving performance better than individual tests."
    difficulty: medium
    tags: [driving competency, dementia, cognitive impairment, geriatrics, MMSE]
