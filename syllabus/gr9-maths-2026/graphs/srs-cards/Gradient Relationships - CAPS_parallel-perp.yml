notes:
  - guid: 3c7a1e5f9b0d2864
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Gradient Relationships"
    fields:
      Front: "What is the gradient rule for PARALLEL lines?"
      Back: "Parallel lines never meet and have the SAME steepness, so they have EQUAL gradients: m₁ = m₂.\nExample: y = 3x + 1 and y = 3x − 4 are parallel because both have gradient 3 (only the y-intercept differs).\nTo test if two lines are parallel, compare their gradients — equal means parallel."
    tags: ["parallel-lines", "subject:graphs"]
  - guid: 8e2c6a0f4b9d1573
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Gradient Relationships"
    fields:
      Front: "Are y = 2x + 5 and 2y = 4x − 3 parallel? Show your working."
      Back: "Put each in y = mx + c form.\n• First: y = 2x + 5 → m = 2.\n• Second: 2y = 4x − 3 → divide by 2 → y = 2x − 3/2 → m = 2.\nBoth gradients are 2, so YES the lines are parallel.\nPitfall: read m only after y is the subject; do not compare 2x with 4x directly."
    tags: ["parallel-lines", "subject:graphs"]
  - guid: 1f5a9c3e7b0d2648
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Gradient Relationships"
    fields:
      Front: "Find the equation of the line parallel to y = −3x + 2 passing through (1;4)."
      Back: "Parallel → same gradient, so m = −3.\ny = −3x + c. Substitute (1;4):\n4 = −3(1) + c → 4 = −3 + c → c = 7.\nEquation: y = −3x + 7.\nCheck: 4 ≠ the other line's value at x=1, so it is a different (parallel) line. ✓"
    tags: ["parallel-lines", "subject:graphs"]
  - guid: 6a0e4c8f2b1d9357
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Gradient Relationships"
    fields:
      Front: "What is the gradient rule for PERPENDICULAR lines (lines meeting at 90°)?"
      Back: "Perpendicular lines cross at a right angle. The PRODUCT of their gradients is −1:\nm₁ × m₂ = −1.\nThis means each gradient is the NEGATIVE RECIPROCAL of the other: flip the fraction and change the sign.\nExample: if m₁ = 2, then m₂ = −1/2, since 2 × (−1/2) = −1."
    tags: ["perpendicular-lines", "subject:graphs"]
  - guid: 9c3e7a1f5b8d0246
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Gradient Relationships"
    fields:
      Front: "Line A has gradient 3/4. What is the gradient of a line perpendicular to it?"
      Back: "Perpendicular gradient = negative reciprocal of 3/4.\nStep 1: flip the fraction 3/4 → 4/3.\nStep 2: change the sign → −4/3.\nCheck: (3/4) × (−4/3) = −12/12 = −1 ✓.\nSo the perpendicular gradient is −4/3."
    tags: ["perpendicular-lines", "subject:graphs"]
  - guid: 4a8c0e2f6b9d1735
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Gradient Relationships"
    fields:
      Front: "Are the lines y = 2x + 1 and y = −(1/2)x + 4 parallel, perpendicular, or neither?"
      Back: "Gradients: m₁ = 2 and m₂ = −1/2.\n• Equal? No (2 ≠ −1/2), so not parallel.\n• Product: m₁ × m₂ = 2 × (−1/2) = −1 → yes, perpendicular.\nThe lines are PERPENDICULAR (they meet at 90°)."
    tags: ["perpendicular-lines", "subject:graphs"]
  - guid: 0e4c8a2f6b1d9573
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Gradient Relationships"
    fields:
      Front: "Pitfall: for perpendicular lines a learner says m₂ is just the reciprocal of m₁. What is missing?"
      Back: "They forgot the NEGATIVE sign. Perpendicular gradients are negative reciprocals, not just reciprocals.\nIf m₁ = 5, the reciprocal is 1/5 but the perpendicular gradient is −1/5.\nTest: 5 × (1/5) = 1 (wrong), but 5 × (−1/5) = −1 (correct). The product must equal −1."
    tags: ["perpendicular-lines", "subject:graphs"]
