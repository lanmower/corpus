# UTI & Urinary Tract Disorders (Urology) - generated from srs-mccqe1
cards:
  - front: "What is the definition of asymptomatic bacteriuria (ASB) and in which populations should it be treated?"
    back: "≥10⁵ CFU/mL in one (women) or two (men) clean-catch midstream specimens without UTI symptoms; treat only in pregnant women and before urological procedures\n\nIDSA/AMMI guidelines: routine treatment of ASB in elderly, diabetics, catheterized patients, or before non-urological surgery is not recommended and increases antibiotic resistance. Screen and treat in pregnancy (risk of pyelonephritis and preterm birth)."
    difficulty: medium
    tags: [asymptomatic-bacteriuria, ASB, pregnancy, treatment-guidelines, AMMI]
  - front: "A 25-year-old non-pregnant woman presents with 2 days of dysuria, frequency, and urgency without fever or flank pain. Urinalysis shows pyuria and bacteriuria. What is first-line treatment?"
    back: "Nitrofurantoin macrocrystals 100 mg BID × 5 days, or trimethoprim-sulfamethoxazole 160/800 mg BID × 3 days (if local resistance <20%), or fosfomycin 3 g single dose\n\nUncomplicated UTI in premenopausal non-pregnant women. Fluoroquinolones should be reserved for more serious infections to preserve effectiveness. Check local antibiogram for TMP-SMX resistance rates."
    difficulty: easy
    tags: [uncomplicated-UTI, nitrofurantoin, TMP-SMX, fosfomycin, cystitis]
  - front: "What clinical and laboratory features distinguish uncomplicated cystitis from pyelonephritis?"
    back: "Pyelonephritis: fever >38°C, rigors, costovertebral angle tenderness/pain, nausea/vomiting, elevated WBC and CRP — cystitis lacks these systemic features\n\nDistinction matters because pyelonephritis requires longer antibiotic course (7–14 days) and may require IV antibiotics if severe. Blood cultures if systemically ill. Imaging (CT/US) if no improvement at 48–72 hours."
    difficulty: medium
    tags: [pyelonephritis, cystitis, CVA-tenderness, fever, clinical-differentiation]
  - front: "What is the antibiotic of choice for acute uncomplicated pyelonephritis in an outpatient?"
    back: "Ciprofloxacin 500 mg BID × 7 days (if susceptible) or TMP-SMX 160/800 mg BID × 14 days\n\nFluoroquinolones are first-line for pyelonephritis because they achieve high urinary and tissue concentrations. Beta-lactams are less effective for pyelonephritis. If local fluoroquinolone resistance >10%, obtain culture and use based on susceptibility."
    difficulty: medium
    tags: [pyelonephritis, ciprofloxacin, outpatient, fluoroquinolone, antibiotic-treatment]
  - front: "What is the most common organism causing UTI overall?"
    back: "Escherichia coli (accounts for 75–90% of community-acquired uncomplicated UTIs)\n\nE. coli produces fimbriae (type 1 and P) that allow adhesion to uroepithelium. Other common organisms: Klebsiella pneumoniae, S. saprophyticus (young women), Proteus mirabilis (struvite stones), Enterococcus faecalis."
    difficulty: easy
    tags: [E-coli, UTI, uropathogens, fimbriae, microbiology]
  - front: "A 75-year-old man with a Foley catheter develops fever, rigors, and pyuria. Urine culture grows >10⁵ CFU/mL of P. aeruginosa. What is the management?"
    back: "Remove or replace catheter, treat with anti-pseudomonal antibiotic (piperacillin-tazobactam or cefepime or ciprofloxacin based on sensitivity) for 7 days\n\nCatheter-associated UTI (CAUTI): catheter removal is the most important intervention. Use smallest bore catheter for shortest time. Pseudomonas is an intrinsically resistant organism — susceptibility testing is essential. Prevention: bladder bundles, closed drainage systems."
    difficulty: hard
    tags: [CAUTI, catheter-UTI, Pseudomonas, piperacillin-tazobactam, catheter-removal]
  - front: "What is recurrent UTI and what prophylactic strategies are available for women?"
    back: "≥2 UTIs in 6 months or ≥3 in 12 months; strategies: post-coital antibiotic prophylaxis, continuous low-dose prophylaxis (nitrofurantoin or TMP), patient-initiated therapy, cranberry products (modest evidence)\n\nRecurrent UTIs affect 25% of women after first episode. Topical estrogen for postmenopausal women reduces recurrences by restoring vaginal lactobacillus colonization. Cranberry (proanthocyanidins) may prevent E. coli adhesion."
    difficulty: medium
    tags: [recurrent-UTI, prophylaxis, nitrofurantoin, post-coital, cranberry]
  - front: "What is the appropriate investigation for a man with his first UTI?"
    back: "Urine culture, urinalysis; consider urology referral and renal/bladder ultrasound to exclude structural abnormality or obstruction\n\nUTIs in men are considered complicated. Causes include prostatitis, BPH, urethral stricture, or calculi. Blood cultures if febrile. Treat for 7–14 days (vs. 3 days for women). Ciprofloxacin or TMP-SMX depending on culture."
    difficulty: medium
    tags: [male-UTI, complicated-UTI, prostatitis, urological-workup, urology-referral]
  - front: "What is the CAUTI prevention bundle per Safer Healthcare Now!/IPAC Canada?"
    back: "Appropriate catheter indication, insertion using aseptic technique, closed drainage system maintenance, daily assessment for removal (ABCDE bundle), and nurse-driven protocol for early catheter removal\n\nCatheter-associated UTIs are the most common healthcare-associated infections. Every day with an unnecessary catheter increases CAUTI risk by 3–7%. Regular reassessment of catheter necessity is the most impactful intervention."
    difficulty: medium
    tags: [CAUTI-prevention, catheter-bundle, IPAC, healthcare-associated-infection, aseptic-technique]
  - front: "What is urethritis and which organisms cause it in sexually active young adults?"
    back: "Inflammation of the urethra caused by STIs; most common: Chlamydia trachomatis (non-gonococcal urethritis) and Neisseria gonorrhoeae\n\nSymptoms: dysuria, urethral discharge, meatal erythema. NAAT (urine or urethral swab) for gonorrhea and chlamydia. Treat empirically for both: ceftriaxone 500 mg IM (gonorrhea) + azithromycin 1 g PO or doxycycline 100 mg BID × 7 days (chlamydia). Notify and treat partners."
    difficulty: medium
    tags: [urethritis, chlamydia, gonorrhea, NAAT, ceftriaxone]
  - front: "How do you distinguish uncomplicated from complicated UTI?"
    back: "Uncomplicated: non-pregnant woman, no structural abnormalities, no catheter. Complicated: male, pregnant, structural abnormality, catheter, immunocompromised, upper tract involvement\n\nUncomplicated cystitis: nitrofurantoin 100mg BID 5d or TMP-SMX 3d. Complicated: fluoroquinolone or broader spectrum, longer course (7-14d). Pyelonephritis: fluoroquinolone or ceftriaxone."
    difficulty: medium
    tags: [UTI, complicated]
  - front: "How is uncomplicated vs complicated UTI defined and what empiric antibiotics are used?"
    back: "Uncomplicated: cystitis in non-pregnant premenopausal woman. Rx: nitrofurantoin 100mg BID x5d (first-line) or TMP-SMX x3d. Complicated: pregnancy, male, catheter, structural abnormality, immunosuppression, upper tract - broader coverage needed\n\nAMMI Canada/Bugs & Drugs guidelines. Avoid fluoroquinolones for uncomplicated UTI (collateral damage, resistance). Complicated: requires culture, imaging if recurrent. Pyelonephritis: TMP-SMX or ciprofloxacin PO x7d if mild, IV ceftriaxone if requires admission."
    difficulty: medium
    tags: [UTI, uncomplicated, nitrofurantoin]
  - front: "What is the management of acute pyelonephritis?"
    back: "Outpatient (mild, can tolerate PO): ciprofloxacin x7d or TMP-SMX x14d. Inpatient: IV ceftriaxone or fluoroquinolone. Admit if: sepsis, unable to tolerate PO, obstruction, pregnancy, immunosuppressed\n\nUrine culture + sensitivities essential. Blood cultures if septic. CT with contrast (or US) if no improvement at 48-72h (rule out abscess, obstruction). Pregnant: admit for IV antibiotics (ceftriaxone). Urologic obstruction with infection = EMERGENCY drainage."
    difficulty: hard
    tags: [pyelonephritis, ceftriaxone, management]
  - front: "When should asymptomatic bacteriuria (ASB) be treated?"
    back: "Treat ONLY in: pregnancy (risk pyelo/preterm labor) and before urologic procedures. Do NOT treat: elderly, diabetics, catheterized, spinal cord injury, nursing home residents\n\nScreening for ASB recommended only in pregnancy (first trimester). Treatment of ASB in other populations increases resistance and C. difficile risk without benefit. A common source of inappropriate antibiotic use in Canada."
    difficulty: medium
    tags: [asymptomatic bacteriuria, pregnancy, antibiotics]
  - front: "What is the approach to recurrent UTIs in women?"
    back: ">=3 UTIs/year or >=2 in 6 months. Behavioral: post-coital voiding, hydration, cranberry (weak evidence). Prophylaxis options: post-coital antibiotic (nitrofurantoin 100mg or TMP-SMX), continuous low-dose prophylaxis, self-start therapy\n\nUrine culture to confirm each episode. Rule out structural abnormality (US, CT). Consider: vaginal estrogen for postmenopausal women (restores lactobacilli). Imaging/cystoscopy if atypical features. D-mannose has some evidence for prevention."
    difficulty: medium
    tags: [recurrent UTI, prophylaxis, women]
  - front: "How is UTI managed in pregnancy?"
    back: "ASB: screen in first trimester, treat with cephalexin, amoxicillin, or nitrofurantoin (avoid at term). Cystitis: same as ASB treatment x7d. Pyelonephritis: admit for IV antibiotics (ceftriaxone)\n\nAvoid: TMP-SMX (first trimester: folate antagonist; third: kernicterus), fluoroquinolones (cartilage), nitrofurantoin near term (hemolytic anemia). Monthly urine cultures after treatment. Untreated ASB in pregnancy: 20-40% develop pyelo."
    difficulty: hard
    tags: [UTI, pregnancy, antibiotics]
  - front: "How is catheter-associated UTI (CAUTI) managed?"
    back: "Diagnosis requires symptoms (NOT just positive culture). Remove or replace catheter. Treat x7d (10-14d if delayed response). Do NOT treat asymptomatic catheterized patients even with positive culture\n\nCAUTI prevention: avoid unnecessary catheters, remove early, closed drainage, daily reassessment of need. Nurse-driven removal protocols reduce CAUTI rates. Candida in urine with catheter: usually colonization, only treat if symptomatic or high-risk (neutropenic, renal transplant)."
    difficulty: medium
    tags: [CAUTI, catheter, UTI]
  - front: "How is UTI diagnosed in elderly patients?"
    back: "Symptoms required: dysuria, frequency, urgency, suprapubic pain, new incontinence, gross hematuria. Do NOT rely on pyuria alone (common asymptomatic finding). Confusion alone is NOT an indication to treat UTI\n\nOver-diagnosis of UTI in elderly is extremely common and harmful. Positive UA/culture without urinary symptoms should not be treated. Delirium workup should include UTI in differential but also other causes. Urine dip sensitivity/specificity poor in elderly."
    difficulty: medium
    tags: [UTI, elderly, diagnosis]
  - front: "What is the management of acute prostatitis?"
    back: "Presentation: fever, perinatal pain, dysuria, urinary retention, boggy tender prostate on DRE. Treatment: fluoroquinolone (ciprofloxacin) x4-6wk or TMP-SMX x4-6wk. If septic: IV ceftriaxone + aminoglycoside\n\nProstatic abscess: suspect if no improvement at 48h, CT confirms, may need drainage. Chronic bacterial prostatitis: recurrent UTI with same organism, treat x4-6wk. Chronic prostatitis/CPPS (most common): no infection, multimodal therapy (alpha-blocker, physio, CBT)."
    difficulty: hard
    tags: [prostatitis, fluoroquinolone, management]
  - front: "What is the approach to urinary retention?"
    back: "Acute: catheterize (Foley or intermittent). Measure PVR. If >1L: monitor for post-obstructive diuresis. Causes: BPH (most common in men), medications (anticholinergics, opioids), neurogenic (cauda equina - emergency), stricture\n\nCauda equina syndrome: saddle anesthesia, bilateral leg weakness, urinary retention - MRI STAT and surgical decompression. Medications causing retention: anticholinergics, opioids, alpha-agonists (pseudoephedrine), antihistamines. Post-catheterization trial of void with alpha-blocker."
    difficulty: medium
    tags: [urinary retention, catheter, cauda equina]
  - front: "What is the approach to hematuria?"
    back: "Microscopic (>3 RBC/HPF) or gross. Workup: UA+culture, cytology, CT urogram + cystoscopy for patients >35 or risk factors (smoking, occupational). Transient causes: UTI, exercise, menstruation - repeat UA before full workup\n\nRed flags: gross, painless, >35yo, smoking history. Bladder cancer is most important diagnosis to rule out. Glomerular hematuria (dysmorphic RBCs, casts, proteinuria): nephrology referral. IgA nephropathy most common glomerulonephritis worldwide."
    difficulty: medium
    tags: [hematuria, workup, cystoscopy]
  - front: "What is testicular torsion and how is it managed?"
    back: "Sudden severe testicular pain, high-riding testis, absent cremasteric reflex, abnormal lie. <6h: surgical exploration (90% salvage). >24h: <10% salvage. Manual detorsion: medial to lateral ('open the book')\n\nPeak: neonatal and adolescent. Bell clapper deformity predisposes. Doppler US if diagnosis uncertain but do NOT delay surgery for imaging if clinical suspicion high. Always fix contralateral testis (bilateral bell clapper)."
    difficulty: hard
    tags: [testicular torsion, emergency]
  - front: "A 14-year-old boy presents with sudden-onset severe left testicular pain and nausea. The affected testis is high-riding with an absent cremasteric reflex. What is the diagnosis and management?"
    back: "Testicular torsion — a surgical EMERGENCY. Must detorse within 6 hours for >90% salvage rate (drops to <10% after 24h). Clinical: sudden severe unilateral scrotal pain, nausea/vomiting, high-riding testis with horizontal lie, absent cremasteric reflex (most sensitive sign), negative Prehn sign (elevation does not relieve pain). Diagnosis: clinical — do NOT delay for imaging if high suspicion; Doppler ultrasound only if diagnosis uncertain. Management: 1) Attempt manual detorsion at bedside ('open the book' — medial to lateral rotation); 2) URGENT surgical exploration and bilateral orchidopexy (fix both testes) regardless of manual detorsion success; 3) If delayed >6h: intraoperative assessment of viability — orchiectomy if non-viable.\n\nBell clapper deformity (high attachment of tunica vaginalis allowing free rotation) is the predisposing anatomical variant — it is bilateral, which is why BOTH testes are fixed during surgery. The cremasteric reflex has ~99% negative predictive value — if present, torsion is very unlikely. Canadian surgical guidelines mandate that torsion should be treated as 'door-to-OR' within 1-2 hours."
    difficulty: hard
    tags: [testicular torsion, surgical emergency, bell clapper, orchidopexy, urology]
  - front: "What are the types of kidney stones, their presentation, diagnosis, and management?"
    back: "Types: Calcium oxalate (80% — most common), calcium phosphate, uric acid (radiolucent), struvite (infection/'staghorn'), cystine (hereditary). Presentation: acute colicky flank pain radiating to groin, hematuria (90%), nausea/vomiting, restlessness. Diagnosis: CT KUB without contrast (gold standard — 98% sensitivity); ultrasound in pregnancy/children. Management: <5mm: medical expulsive therapy (tamsulosin 0.4 mg daily — relaxes ureter, increases passage rate by 30%), NSAIDs for pain (ketorolac), hydration. 5-10mm: MET with close follow-up, intervention if not passing. >10mm or complicated (obstruction with infection, AKI, intractable pain, solitary kidney): urgent urology — ESWL (extracorporeal shock wave lithotripsy) for <2cm renal/upper ureteral stones; ureteroscopy for ureteral stones; PCNL for large stones >2cm.\n\nCUA guidelines recommend CT KUB as first-line imaging. Tamsulosin for MET has strongest evidence for distal ureteral stones 5-10mm. Obstructing stone with fever/UTI is a urologic emergency requiring urgent decompression (ureteral stent or nephrostomy) — antibiotics alone are insufficient. Prevention: increase fluid intake to >2.5L/day urine output, dietary modifications based on stone type."
    difficulty: hard
    tags: [nephrolithiasis, kidney stones, CT KUB, tamsulosin, urology]
  - front: "What is the investigation of choice for suspected renal colic (nephrolithiasis)?"
    back: "Non-contrast CT of abdomen/pelvis (CT KUB) — best sensitivity and specificity. Abdominal ultrasound is preferred in females of childbearing age, children, or if CT is contraindicated.\n\nNon-contrast CT can detect stones of any composition, size, and location, and identify hydronephrosis and alternative diagnoses. AXR can identify large radiopaque stones (calcium, struvite, cystine) but misses uric acid stones and small stones. Uric acid stones are radiolucent."
    difficulty: easy
    tags: [nephrolithiasis, renal colic, CT KUB, imaging, urology]
  - front: "What percentage of renal stones pass spontaneously, and what size determines this?"
    back: "75% of stones <4 mm pass spontaneously within 2 weeks. Larger stones (>5 mm) are less likely to pass and may require urological intervention.\n\nStone size and location determine spontaneous passage rates. Distal ureteral stones pass more readily than proximal ones. Alpha-blockers (e.g., tamsulosin) relax ureteral smooth muscle and can increase stone passage rates in select cases with stones 5-10 mm."
    difficulty: easy
    tags: [nephrolithiasis, stone passage, tamsulosin, urology]
  - front: "What are the indications for urgent urology consult in nephrolithiasis?"
    back: "Stone >5 mm, bilateral obstructing stones, obstruction + infection (urological emergency), fever (septic stone), renal impairment, solitary kidney, intractable vomiting, single kidney with ureteral obstruction.\n\nObstruction + infection is the most urgent indication—it represents obstructive pyelonephritis requiring immediate decompression (ureteral stent or percutaneous nephrostomy) plus IV antibiotics and fluids. This cannot be managed with antibiotics alone."
    difficulty: medium
    tags: [nephrolithiasis, urology consult, obstructive pyelonephritis, emergency]
  - front: "What is the preferred analgesic for renal colic and why?"
    back: "NSAIDs (e.g., ketorolac/Toradol) are preferred over opioids. NSAIDs reduce ureteral prostaglandin-mediated spasm, treat both pain and ureteral obstruction. Opioids provide pain relief but do not address ureteral spasm.\n\nProstaglandins cause ureteral smooth muscle contraction and promote inflammation around the stone. NSAIDs block prostaglandin synthesis, reducing ureteral spasm and edema. Ketorolac IV is highly effective. Opioids are used as adjuncts or when NSAIDs are contraindicated (renal impairment)."
    difficulty: easy
    tags: [renal colic, ketorolac, NSAIDs, analgesia, urology]
  - front: "What composition are the majority of kidney stones?"
    back: "Calcium oxalate: ~75-80%. Also: struvite (magnesium ammonium phosphate), uric acid (~10%), cystine, calcium phosphate.\n\nCalcium oxalate stones are most common and are radiopaque on AXR. Struvite (infection/triple phosphate) stones form staghorn calculi associated with urease-producing bacteria (Proteus, Klebsiella). Uric acid stones are radiolucent and occur in gout/hyperuricemia. Cystine stones are rare (cystinuria)."
    difficulty: easy
    tags: [kidney stones, calcium oxalate, struvite, uric acid, urology]
  - front: "What is the first-line treatment for uncomplicated UTI in women, per Canadian guidelines?"
    back: "TMP/SMX (cotrimoxazole) 160/800 mg BID × 3 days OR nitrofurantoin 100 mg BID × 5 days.\n\nShort-course therapy with TMP/SMX or nitrofurantoin is effective for uncomplicated cystitis in non-pregnant women. Nitrofurantoin should be avoided in the third trimester of pregnancy. Culture is not required if dipstick is positive for nitrites + leukocytes with ≥2 clinical criteria."
    difficulty: easy
    tags: [UTI, cystitis, TMP/SMX, nitrofurantoin, antibiotics, treatment]
  - front: "What are the risk factors for a complicated UTI?"
    back: "Male sex; pregnancy; recent urinary tract instrumentation; functional or anatomic abnormality of the urinary tract; chronic renal disease; immunosuppression; indwelling catheter.\n\nComplicated UTIs require longer courses (7-14 days) of broader-spectrum antibiotics such as TMP/SMX or ciprofloxacin. Complicated UTIs are at higher risk of treatment failure and systemic spread."
    difficulty: easy
    tags: [UTI, complicated, risk factors, immunosuppression, catheter]
  - front: "How should bacteriuria in pregnancy be managed?"
    back: "Pregnant women with bacteriuria (2-7%) MUST be treated even if asymptomatic. First-line: amoxicillin, nitrofurantoin (avoid in third trimester), cephalexin. Follow with monthly urine cultures and repeat treatment if still infected. Risk of untreated: pyelonephritis, preterm labour, low birth weight, perinatal mortality.\n\nAsymptomatic bacteriuria in pregnancy is an important exception to the general rule of not treating asymptomatic bacteriuria. Untreated ASB in pregnancy has significant maternal and fetal consequences."
    difficulty: medium
    tags: [UTI, pregnancy, bacteriuria, asymptomatic, nitrofurantoin, pyelonephritis]
  - front: "What are the common causative organisms for UTI/cystitis (KEEPS mnemonic)?"
    back: "KEEPS: Klebsiella, E. coli, Enterobacter spp., P. mirabilis, Pseudomonas spp., S. saprophyticus.\n\nE. coli is by far the most common cause of uncomplicated UTI (80%). S. saprophyticus is classically seen in sexually active young women. KEEPS helps recall the spectrum of common uropathogens."
    difficulty: easy
    tags: [UTI, bacteriology, E. coli, KEEPS, organisms]
  - front: "What are the signs and symptoms of pyelonephritis compared to cystitis?"
    back: "Cystitis: internal dysuria, frequency, urgency, incontinence, hematuria, nocturia, back pain, suprapubic discomfort, low-grade fever (rare). Pyelonephritis: internal dysuria, FEVER, chills, flank pain radiating to groin, CVA tenderness, nausea/vomiting.\n\nPyelonephritis indicates upper urinary tract infection and requires more aggressive treatment. CVA (costovertebral angle) tenderness on percussion is a key physical exam finding. CBC and differential should be ordered if pyelonephritis is suspected."
    difficulty: easy
    tags: [pyelonephritis, cystitis, UTI, CVA tenderness, fever, comparison]
  - front: "How does the UTI Clinical Decision Aid work?"
    back: "If the patient has: (1) Dysuria + (2) Leukocytes on dipstick + (3) Nitrites on dipstick — if ≥2 criteria are met, treat empirically without culture. If <2 criteria met, culture is required before treatment.\n\nThis clinical decision aid avoids unnecessary cultures and reduces antibiotic overuse. It applies to uncomplicated UTI in non-pregnant women without risk factors for complicated UTI."
    difficulty: medium
    tags: [UTI, clinical decision aid, dipstick, nitrites, leukocytes, empiric treatment]
