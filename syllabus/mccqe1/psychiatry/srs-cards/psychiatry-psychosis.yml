# Psychiatry Psychosis (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What defines a psychotic disorder and what are the two major symptom categories?"
    back: "Psychotic disorders are characterized by significant impairment in reality testing. The two major categories are: (1) Positive symptoms — delusions, hallucinations, grossly disorganized/abnormal motor behaviour, formal thought disorder; (2) Negative symptoms — diminished emotional expression (affective flattening), anhedonia, avolition, alogia, asociality.\n\nUnderstanding the positive/negative symptom dichotomy is critical for MCCQE1. Positive symptoms are typically more responsive to antipsychotic medications, while negative symptoms are more treatment-resistant and more closely associated with functional impairment."
    difficulty: easy
    tags: [psychiatry, psychosis, schizophrenia, positive symptoms, negative symptoms]
  - front: "What is the key differentiating feature that distinguishes Brief Psychotic Disorder, Schizophreniform Disorder, and Schizophrenia?"
    back: "Duration of illness: Brief Psychotic Disorder lasts <1 month (with full return to premorbid functioning), Schizophreniform Disorder lasts >1 month but <6 months, Schizophrenia lasts >6 months.\n\nDuration of untreated psychosis is a key factor in prognosis. All three disorders require at least one Criterion A positive symptom from schizophrenia criteria. The temporal boundaries are frequently tested on the MCCQE1."
    difficulty: easy
    tags: [psychiatry, psychosis, schizophrenia, brief psychotic disorder, schizophreniform]
  - front: "What investigations should be ordered for a first-episode psychosis workup?"
    back: "Routine: CBC, electrolytes (including extended electrolytes), creatinine, glucose, urinalysis, urine drug screen, TSH, vitamin B12. Baseline before antipsychotic initiation: LFTs, fasting lipids, HbA1C. Optional: ECG (antipsychotics affect cardiac conduction). As clinically indicated: infectious workup, inflammatory markers, brain imaging.\n\nA thorough medical workup is essential to rule out organic causes of psychosis (e.g., thyroid disease, metabolic derangements, substance intoxication, CNS pathology) before labeling a first episode as a primary psychiatric disorder."
    difficulty: medium
    tags: [psychiatry, psychosis, investigations, workup]
  - front: "What is Schizophreniform Disorder and how does it differ from schizophrenia in terms of diagnosis and prognosis?"
    back: "Schizophreniform Disorder meets criteria A, D, and E of schizophrenia; episode lasts >1 month but <6 months (symptoms extending >6 months → reclassify as schizophrenia). Prognosis is better than schizophrenia: 1/3 recover within 6 months, 2/3 progress to schizophrenia.\n\nSchizophreniform disorder is conceptually a 'provisional' diagnosis that may resolve or evolve into schizophrenia. Good prognostic features include acute onset, confusion/perplexity at peak illness, good premorbid functioning, and absence of blunted/flat affect."
    difficulty: medium
    tags: [psychiatry, schizophreniform, psychosis, diagnosis, prognosis]
  - front: "What are the DSM-5 diagnostic criteria and prognosis of Brief Psychotic Disorder?"
    back: "Criteria: Criterion A1–A4, D, and E of schizophrenia are met; episode lasts ≥1 day but <1 month with eventual full return to premorbid function. Can occur after a stressful event or postpartum. Treatment: secure/safe environment, antipsychotics, anxiolytics. Prognosis: good, self-limiting, return to premorbid function within 1 month.\n\nBrief Psychotic Disorder is a time-limited condition by definition. The postpartum specifier is important to differentiate from postpartum depression (which is predominantly a mood disorder) and postpartum psychosis (which may meet criteria for Brief Psychotic Disorder or Bipolar I)."
    difficulty: medium
    tags: [psychiatry, brief psychotic disorder, psychosis, postpartum]
  - front: "What are the DSM-5 criteria for Schizoaffective Disorder?"
    back: "A. Uninterrupted period of illness with a major mood episode (MDE or manic) concurrent with Criterion A of schizophrenia. B. Delusions or hallucinations for ≥2 weeks in the absence of a major mood episode during the lifetime of the illness. C. Symptoms meeting criteria for a major mood episode are present for the majority of the total duration of the active and residual illness. D. Not attributable to substances or medical condition. Specifiers: bipolar type or depressive type.\n\nSchizoaffective disorder lies between schizophrenia and mood disorders. Criterion B (at least 2 weeks of psychosis without mood symptoms) distinguishes it from mood disorder with psychotic features, while Criterion C (mood symptoms predominant overall) distinguishes it from schizophrenia."
    difficulty: hard
    tags: [psychiatry, schizoaffective disorder, DSM-5, diagnosis]
  - front: "How does schizoaffective disorder differ from schizophrenia and mood disorder with psychotic features in terms of diagnosis?"
    back: "Schizoaffective: psychosis present for ≥2 weeks WITHOUT mood symptoms (B), AND mood symptoms present for the MAJORITY of total illness duration (C). Mood disorder with psychotic features: psychosis occurs ONLY during mood episodes. Schizophrenia: mood episodes are brief or rare relative to psychotic symptoms.\n\nThe key diagnostic challenge is determining which symptom cluster (psychosis vs. mood) predominates and whether psychosis exists independently of mood disturbance. This distinction guides treatment (antipsychotics + mood stabilizers/antidepressants for schizoaffective vs. predominantly antipsychotics for schizophrenia)."
    difficulty: hard
    tags: [psychiatry, schizoaffective disorder, differential diagnosis, psychosis, mood disorders]
  - front: "What is the epidemiology, treatment, and prognosis of Schizoaffective Disorder?"
    back: "Epidemiology: 1/3 as prevalent as schizophrenia; bipolar type more common in young adults, depressive type in older adults; lifetime suicide risk 5%. Treatment: antipsychotics + mood stabilizers + antidepressants. Prognosis: between that of schizophrenia and mood disorder.\n\nThe depressive subtype of schizoaffective disorder carries elevated suicide risk, similar to major depressive disorder with psychotic features. Treatment must address both psychotic and mood symptom domains simultaneously."
    difficulty: medium
    tags: [psychiatry, schizoaffective disorder, epidemiology, prognosis, treatment]
  - front: "What are the DSM-5 diagnostic criteria for Delusional Disorder?"
    back: "A. ≥1 delusion with duration ≥1 month. B. Criterion A of schizophrenia has never been met (hallucinations, if present, are not prominent and are related to the delusional theme). C. Functioning is not markedly impaired apart from the delusion's impact; behaviour is not obviously bizarre. D. Any mood episodes have been brief relative to the delusional periods. E. Not attributable to substances or another medical condition. Subtypes: erotomanic, grandiose, jealous, persecutory, somatic, mixed, unspecified.\n\nThe key distinguishing feature of delusional disorder is relatively preserved functioning outside the delusional domain. The non-bizarre vs. bizarre delusion distinction (situations that could vs. could not occur in real life) helps differentiate from schizophrenia."
    difficulty: medium
    tags: [psychiatry, delusional disorder, DSM-5, diagnosis]
  - front: "What is the treatment and prognosis of Delusional Disorder?"
    back: "Treatment: antipsychotics, psychotherapy, and antidepressants. Prognosis: may respond to antipsychotics, but most patients refuse treatment and have a chronic, unremitting course. Some maintain high level of functioning; some progress to schizophrenia.\n\nPoor insight is characteristic of delusional disorder — patients typically do not believe they are ill and therefore refuse antipsychotics. Therapeutic alliance and indirect approaches (treating comorbid depression or anxiety) may improve engagement."
    difficulty: medium
    tags: [psychiatry, delusional disorder, treatment, prognosis]
  - front: "What is the difference between bizarre and non-bizarre delusions?"
    back: "Non-bizarre delusions involve situations that could plausibly occur in real life (e.g., being followed, poisoned, loved at a distance from afar). Bizarre delusions involve situations that could not possibly occur in real life (e.g., being kidnapped by aliens, having one's organs stolen).\n\nThis distinction is clinically relevant in differentiating Delusional Disorder (which can include non-bizarre delusions) from Schizophrenia (which often includes bizarre delusions). Bizarre delusions automatically satisfy one Criterion A symptom of schizophrenia."
    difficulty: easy
    tags: [psychiatry, delusions, psychosis, schizophrenia, delusional disorder]
