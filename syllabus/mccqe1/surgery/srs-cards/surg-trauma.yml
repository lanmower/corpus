  - front: "In trauma, what does FAST stand for and what is its purpose?"
    back: "Focused Assessment with Sonography for Trauma - used to rapidly detect free fluid in the peritoneal and pericardial cavities\n\nFAST is a rapid, non-invasive ultrasound examination performed at the bedside in trauma."
    difficulty: easy
    tags: [FAST, ultrasound, trauma, free fluid, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the components of neurological assessment in the Primary Survey (disability)?"
