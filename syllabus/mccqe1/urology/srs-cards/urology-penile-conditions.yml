  - front: "What is Peyronie's disease and how is it managed?"
    back: "Acquired penile curvature due to fibrous thickening of the tunica albuginea. Management: supportive (PDE5 inhibitor for ED, NSAIDs for pain), medical (traction device, intralesional verapamil or collagenase), surgical (plaque excision, plication surgery, penile prosthesis).\n\nPeyronie's is associated with DM, vascular disease, autoimmunity, Dupuytren's contracture, and erectile dysfunction. Trauma/repeated inflammation leads to fibrous plaque formation. Intralesional collagenase clostridium histolyticum (Xiaflex) is an approved non-surgical option."
    difficulty: medium
    tags: [urology, Peyronies disease, erectile dysfunction, penile curvature]
  - front: "What is priapism? Differentiate ischemic (low-flow) from non-ischemic (high-flow) priapism."
    back: "Priapism: prolonged erection >4h without sexual excitement. Ischemic (low-flow): thromboembolic (e.g. sickle cell), painful, requires urgent treatment (aspiration, phenylephrine injection, surgical shunt). Non-ischemic (high-flow): traumatic arteriovenous fistula, often painless, self-limited, consider arterial embolization.\n\nIschemic priapism is a urological emergency. Treatment escalation: needle aspiration → phenylephrine intracorporeal injection q3-5min → surgical shunt if no response. Sickle cell disease is the most common hematological cause."
    difficulty: medium
    tags: [urology, priapism, ischemic, sickle cell, emergency]
  - front: "What is paraphimosis and how is it managed?"
    back: "Paraphimosis: retracted foreskin behind the glans that cannot be reduced, causing a constricting band proximal to the corona. Management: manual pressure/analgesia, dorsal slit, or circumcision (urgent to prevent recurrence).\n\nParaphimosis is a urological emergency—the constricting band impairs venous and lymphatic drainage causing progressive swelling and can lead to ischemia of the glans. Causes include iatrogenic (post-instrumentation), trauma, or infection."
    difficulty: easy
    tags: [urology, paraphimosis, foreskin, emergency]
  - front: "What is premature ejaculation and how is it classified and treated?"
    back: "Premature ejaculation: ejaculation prior to when one or both partners desire, with ejaculatory latency <1 min and inability to control/delay ejaculation. Primary (lifelong): no period of acceptable control. Secondary (acquired): after period of control, not associated with general medical condition. Treatment: rule out medical conditions, address psychiatric concerns (counseling), SSRIs or clomipramine, topical lidocaine-prilocaine.\n\nSSRIs (dapoxetine is specifically approved; other SSRIs used off-label) delay ejaculation by their serotonergic effects on ejaculatory reflex. Topical anesthetics reduce penile sensitivity. Combined pharmacological and behavioral therapy is most effective."
    difficulty: medium
    tags: [urology, premature ejaculation, sexual dysfunction, SSRI, treatment]
