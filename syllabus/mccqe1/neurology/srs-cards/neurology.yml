# Neurology (Neurology) - generated from srs-mccqe1
cards:
  - front: "What is the TRAP mnemonic for Parkinson's disease?"
    back: "T: Tremor (resting, 4-6 Hz pill-rolling). R: Rigidity (cogwheel). A: Akinesia/bradykinesia. P: Postural instability (late finding).\n\nPD diagnosis requires bradykinesia plus either resting tremor or rigidity, with asymmetric onset and progressive course. Motor symptoms emerge when >70% of dopaminergic neurons in substantia nigra pars compacta are lost. Non-motor features include anosmia, REM sleep behavior disorder, constipation, and depression."
    difficulty: easy
    tags: [neurology, Parkinsons disease, movement disorders]
  - front: "What is the pathophysiology of Parkinson's disease?"
    back: "Alpha-synuclein accumulates as Lewy bodies causing neuronal loss, especially in substantia nigra pars compacta → decreased dopamine in striatum → disinhibited indirect pathway and decreased direct pathway activation → increased inhibition of cortical motor areas.\n\nAlpha-synuclein pathology progresses from medulla/olfactory bulbs (early: constipation, anosmia) to pons (REM sleep disorder), midbrain/substantia nigra (motor symptoms), and cortex (cognitive impairment, hallucinations). This explains the sequence of prodromal to advanced features."
    difficulty: hard
    tags: [neurology, Parkinsons disease, pathophysiology]
  - front: "What are the major adverse effects of levodopa therapy in Parkinson's disease?"
    back: "Dyskinesia (most important), wearing-off phenomenon (end-of-dose deterioration), on-off fluctuations, and delayed onset of response affected by meals.\n\nLevodopa is combined with carbidopa or benserazide (peripheral decarboxylase inhibitors) to decrease peripheral metabolism and side effects. Dopamine agonists have fewer motor side effects but worse symptom control and more non-motor side effects (hallucinations, dizziness)."
    difficulty: medium
    tags: [neurology, Parkinsons disease, pharmacology]
  - front: "What are the clinical features that distinguish progressive supranuclear palsy (PSP) from Parkinson's disease?"
    back: "PSP: vertical gaze palsy (especially downgaze), early postural instability with frequent falls, axial rigidity, and little or no response to levodopa.\n\nPSP is a tauopathy (unlike PD which is a synucleinopathy). The vertical gaze limitation can be overcome by the oculocephalic reflex, indicating a supranuclear rather than nuclear cause. Early falls and poor levodopa response are red flags against typical PD."
    difficulty: hard
    tags: [neurology, PSP, atypical parkinsonism]
  - front: "What is Huntington's disease and what are its genetics?"
    back: "Autosomal dominant CAG trinucleotide repeat expansion in HTT gene on chromosome 4. ≥40 repeats = full penetrance. Shows genetic anticipation (repeats increase with subsequent generations).\n\nHD presents with insidious chorea, cognitive decline, and psychiatric symptoms (mean onset 35-44 years). MRI shows caudate atrophy and ventricular enlargement. Treatment is symptomatic only: tetrabenazine for chorea, antidepressants and antipsychotics for psychiatric symptoms."
    difficulty: medium
    tags: [neurology, Huntingtons disease, genetics]
  - front: "How do you differentiate essential tremor from Parkinson's disease tremor?"
    back: "Essential tremor: action-postural (6-12 Hz), worse with sustained posture, upper limbs > head, autosomal dominant FHx, improved by alcohol. PD tremor: resting (3-6 Hz), pill-rolling, upper limb > jaw, asymmetric, not improved by alcohol.\n\nEssential tremor is the most common movement disorder and usually does not require treatment. When treatment is needed, propranolol and primidone are first-line. In young patients with tremor, TSH and ceruloplasmin should be checked to rule out thyroid disease and Wilson's disease."
    difficulty: medium
    tags: [neurology, tremor, movement disorders]
  - front: "What are the clinical features of cerebellar dysfunction?"
    back: "Ipsilateral limb ataxia (dysmetria, intention tremor, dysdiadochokinesia), truncal ataxia (wide-based gait), nystagmus, scanning speech, and hypotonia with pendular reflexes.\n\nLateral cerebellar hemisphere lesions cause limb ataxia, while vermis lesions cause truncal ataxia. Cerebellar signs are always ipsilateral to the lesion. Friedreich's ataxia is the most common hereditary ataxia (autosomal recessive, onset 8-15 years)."
    difficulty: easy
    tags: [neurology, cerebellar disorders, ataxia]
  - front: "What is ALS and what are its characteristic upper and lower motor neuron findings?"
    back: "Progressive neurodegenerative disease with UMN (spasticity, hyperreflexia, bulbar dysarthria) and LMN (weakness, muscle atrophy, fasciculations, muscle cramps) symptoms simultaneously.\n\nALS affects anterior horn cells, cranial nerve motor nuclei, and corticospinal tracts. Median survival is 3 years, usually due to respiratory failure. Riluzole prolongs survival; edaravone slows functional decline. BiPAP is the other intervention proven to improve survival."
    difficulty: medium
    tags: [neurology, ALS, motor neuron disease]
  - front: "What features on exam help distinguish an ALS diagnosis from mimics?"
    back: "ALS: combined UMN and LMN signs, no sensory loss, no bowel/bladder incontinence, no extraocular muscle weakness. These absent features help distinguish ALS from other conditions.\n\nEMG shows active denervation (fibrillations, positive sharp waves) and chronic reinnervation (increased amplitude motor units) in multiple regions. MRI brain and spine are done to exclude alternatives. Sensory symptoms, predominant pain, and bowel/bladder dysfunction are red flags against ALS."
    difficulty: medium
    tags: [neurology, ALS, motor neuron disease]
  - front: "What is carpal tunnel syndrome and how is it diagnosed?"
    back: "Compression of median nerve at the wrist. Symptoms: paresthesias in thumb, index, middle, and lateral ring finger; decreased grip strength. Signs: positive Tinel's and Phalen's tests, thenar atrophy. Diagnosis: clinical + EMG/NCS.\n\nRisk factors include pregnancy, diabetes, rheumatoid arthritis, acromegaly, and hypothyroidism. Tinel's sign is elicited by tapping over the median nerve at the wrist. Phalen's test involves holding wrists in forced flexion for 30-60 seconds."
    difficulty: easy
    tags: [neurology, carpal tunnel, peripheral neuropathy]
  - front: "What are the key features of Guillain-Barré syndrome?"
    back: "Acute ascending demyelinating polyradiculoneuropathy with distal-to-proximal weakness, areflexia, and autonomic dysfunction. CSF shows albuminocytologic dissociation (high protein, normal WBC).\n\nGBS is a neurological emergency due to risk of respiratory failure. It usually follows a viral/bacterial infection. EMG/NCS shows conduction block and slowing. Treatment is IVIG or plasmapheresis. Miller-Fischer variant presents with ophthalmoplegia, ataxia, and areflexia."
    difficulty: medium
    tags: [neurology, GBS, peripheral neuropathy]
  - front: "What differentiates myasthenia gravis from Lambert-Eaton syndrome?"
    back: "MG: autoantibodies to acetylcholine receptors, decremental response on repetitive stimulation, associated with thymoma, ocular/bulbar predominant. LEMS: antibodies to presynaptic voltage-gated calcium channels, incremental response, associated with small cell lung cancer, proximal limb predominant with autonomic symptoms.\n\nMG shows fatigable weakness that worsens with activity and improves with rest. LEMS shows post-exercise enhancement (reflexes increase after active contraction). Both are autoimmune disorders of the neuromuscular junction but target different components."
    difficulty: medium
    tags: [neurology, myasthenia gravis, Lambert-Eaton, NMJ]
  - front: "What is the treatment approach for myasthenia gravis?"
    back: "1st line: acetylcholinesterase inhibitors (pyridostigmine). 2nd: corticosteroids. Crisis: IVIG or plasmapheresis. Long-term: azathioprine, mycophenolate. Thymectomy for non-thymomatous AChR antibody-positive generalized MG.\n\nNewer therapies include eculizumab (complement inhibitor) and efgartigimod (neonatal Fc receptor blocker). Per the thymectomy trial, surgery improved clinical outcomes over 3 years with lower prednisone requirements. 15% of MG patients have thymoma."
    difficulty: medium
    tags: [neurology, myasthenia gravis, treatment]
  - front: "What is the classic presentation of botulism?"
    back: "Descending paralysis starting with cranial neuropathies (ptosis, extraocular weakness, dilated pupils, dysarthria, dysphagia) → symmetric descending weakness → autonomic dysfunction. Onset 6-48 hours after ingestion.\n\nBotulinum toxin blocks presynaptic acetylcholine release. Infantile botulism (most common form) is from ingestion of honey or corn syrup. Treatment is botulinum antitoxin plus supportive care. Unlike GBS which is ascending, botulism descends."
    difficulty: medium
    tags: [neurology, botulism, NMJ disorders]
  - front: "What is myotonic dystrophy type 1 and what are its systemic features?"
    back: "Autosomal dominant CTG repeat expansion at 19q13.3. Features: distal weakness, myotonia (delayed muscle relaxation), cardiac conduction defects (90%), subcapsular cataracts, frontal baldness, diabetes, testicular atrophy.\n\nThis is the most common adult muscular dystrophy. EMG shows electrical myotonia ('dive-bomber' sound). Unlike other myopathies, weakness is distal > proximal. Genetic anticipation occurs. No cure exists; progressive with death usually around age 50."
    difficulty: medium
    tags: [neurology, myotonic dystrophy, myopathies]
  - front: "What is Tourette's syndrome and how is it defined?"
    back: "Multiple motor and ≥1 vocal tics persisting >1 year, onset <18 years, not due to substance or medical condition. Tics wax and wane, can be suppressed temporarily, and worsen with stress.\n\nPrevalence is 3-8/1000 school-age children (M:F 2-4:1). Peak severity at ages 10-12 with decline in adolescence (50% tic-free by age 18). Commonly associated with OCD and ADHD. Treatment: mild tics with behavioral therapy; severe tics with alpha-2 agonists (guanfacine) or antipsychotics."
    difficulty: easy
    tags: [neurology, Tourettes, tic disorders]
  - front: "What does an axonal vs. demyelinating pattern on EMG/NCS indicate?"
    back: "Axonal neuropathy: decreased amplitude on NCS (fewer functioning axons). Demyelinating neuropathy: decreased conduction velocity on NCS (slower signal transmission through damaged myelin).\n\nThis distinction is crucial for differential diagnosis. Demyelinating neuropathies include GBS, CIDP, and Charcot-Marie-Tooth. Axonal neuropathies include DM, alcohol, renal failure, and toxins. GBS shows conduction block, decreased F-wave, and sural sparing on NCS."
    difficulty: medium
    tags: [neurology, EMG, peripheral neuropathy]
  - front: "What is Wernicke-Korsakoff syndrome and what causes it?"
    back: "Wernicke's encephalopathy (acute): confusion, ataxia, ophthalmoplegia — from thiamine (B1) deficiency. Korsakoff's psychosis (chronic): anterograde amnesia, confabulation. Most common cause: alcohol use disorder.\n\nOther causes include malabsorption, gastric bypass surgery, malnutrition, and hemodialysis. Thiamine should be given BEFORE glucose in malnourished patients to prevent precipitating Wernicke's. Alcohol can also cause cerebellar ataxia separate from thiamine deficiency."
    difficulty: easy
    tags: [neurology, Wernicke-Korsakoff, thiamine deficiency]
  - front: "How do you differentiate peripheral from central vertigo based on associated symptoms?"
    back: "Peripheral: hearing loss, tinnitus, nausea/vomiting, worsened by head movement; no neurologic deficits. Central: diplopia, dysphagia, dysarthria, ataxia, altered consciousness, motor/sensory deficits.\n\nPeripheral vertigo involves the inner ear or vestibular nerve and often has audiological symptoms. Central vertigo involves brainstem or cerebellar lesions and presents with neurological deficits requiring urgent workup."
    difficulty: medium
    tags: [neurology, otolaryngology, vertigo, family-medicine]
  - front: "What are the four types of dizziness and how do you differentiate vestibular from non-vestibular causes?"
    back: "Vertigo, pre-syncope, disequilibrium, and lightheadedness. Vestibular causes worsen with head movement or eye closure; non-vestibular causes show no change.\n\nThis distinction is critical for guiding workup. Neurologic symptoms (diplopia, dysarthria, ataxia) suggest central causes. Audiologic symptoms (hearing loss, tinnitus) suggest peripheral vestibular disorders."
    difficulty: medium
    tags: [neurology, otolaryngology, dizziness]
  - front: "What are the headache red flags that require urgent investigation (mnemonic SNOOP)?"
    back: "Systemic symptoms/illness/fever, Neurologic signs (focal deficits, altered mental status), Onset sudden/severe, Older age (new after 50), Prior headache history with different pattern. Also: awakens from sleep, jaw claudication, trauma.\n\nSecondary headaches account for <10% of all headaches but may be life-threatening. Investigations may include CBC, ESR/CRP, neuroimaging (CT/MRI), and CSF analysis depending on clinical suspicion."
    difficulty: easy
    tags: [neurology, headache, red flags]
  - front: "What are the key features of a CORTICAL lesion?"
    back: "Contralateral hemiparesis (differential face/arm vs. leg), contralateral hemisensory loss, cortical sensory loss (graphesthesia, stereognosis), homonymous hemianopsia/quadrantanopsia, gaze deviation (frontal eye field), seizure, agnosia, and dominant hemisphere: aphasia/alexia/agraphia/acalculia/left-right disorientation; non-dominant hemisphere: hemineglect, dysprosody, constructional apraxia, alien hand syndrome.\n\nCortical lesions produce a rich constellation of signs due to the dense concentration of function. Dominant hemisphere lesions (usually left) impair language-related functions, while non-dominant (usually right) cause spatial and attentional deficits. This localization is essential for MCCQE1 neurological examination questions."
    difficulty: medium
    tags: [neurology, lesion-localization, cortex, neurological-exam]
  - front: "How does an INTERNAL CAPSULE lesion differ from a CORTICAL lesion in terms of hemiparesis?"
    back: "Internal capsule lesion: contralateral hemiparesis with EQUAL face, arm, and leg involvement WITHOUT cortical/sensory deficits (pure motor). Cortical lesion: hemiparesis with DIFFERENTIAL involvement of face/arm vs. leg, AND may have sensory/cortical signs (aphasia, neglect, etc.).\n\nThe internal capsule is a compact white matter tract where corticospinal and corticobulbar fibers run tightly together, causing equal motor loss in all regions. The cortex has a wider somatotopic spread, so lesions produce differential weakness. Distinguishing these is a high-yield MCCQE1 localization concept."
    difficulty: medium
    tags: [neurology, lesion-localization, internal-capsule, hemiparesis]
  - front: "What are the four internal capsule stroke syndromes?"
    back: "1. Pure motor hemiparesis (contralateral face, arm, leg equally). 2. Sensorimotor stroke (contralateral hemiparesis + sensory deficit). 3. Ataxic hemiparesis (contralateral dysmetria/clumsiness + paresis). 4. Clumsy hand-dysarthria syndrome (dysarthria + ataxia of hand).\n\nThese lacunar syndromes result from small vessel disease affecting the internal capsule or pons. They are classic MCCQE1 vignette presentations for lacunar infarcts in hypertensive patients. Ataxic hemiparesis and clumsy hand-dysarthria are especially high-yield."
    difficulty: hard
    tags: [neurology, lacunar-infarct, internal-capsule, stroke]
  - front: "What is the hallmark pattern of a BRAINSTEM lesion?"
    back: "CROSSED findings: ipsilateral cranial nerve deficits (face) + contralateral hemiplegia/hemisensory loss (body). Also: ipsilateral limb ataxia, nystagmus, diplopia, ptosis, pupil abnormalities, dysphagia, dysarthria, hearing loss, vertigo, ipsilateral Horner's syndrome.\n\nCrossed deficits (ipsilateral face, contralateral body) are pathognomonic for brainstem localization. This pattern occurs because cranial nerve nuclei are ipsilateral to their effect, while corticospinal and sensory tracts have already crossed or haven't yet crossed at certain brainstem levels."
    difficulty: medium
    tags: [neurology, brainstem, lesion-localization, crossed-signs]
  - front: "What are the features of a CEREBELLAR lesion, and on which side do they occur relative to the lesion?"
    back: "Symptoms are IPSILATERAL to the side of the lesion. Features: limb ataxia (dysmetria, intention tremor, dysdiadochokinesia, hypotonia with pendular reflexes), truncal ataxia (wide-based gait, inability to tandem walk, truncal titubation), nystagmus, hypermetric/hypometric saccades, impaired smooth pursuit, scanning speech (explosive with pauses).\n\nCerebellar pathways are double-crossed: they cross to the contralateral cortex and back, so the net effect is ipsilateral. This contrasts with cortical/subcortical lesions causing contralateral deficits. Scanning (cerebellar) speech is a distinct dysarthria pattern tested on MCCQE1."
    difficulty: medium
    tags: [neurology, cerebellum, ataxia, lesion-localization]
  - front: "What is the significance of a 'sensory level' and 'saddle anesthesia' in spinal cord localization?"
    back: "Sensory level: a dermatomal line below which there is sensory loss, indicating the level of a spinal cord lesion. Suspended 'cape-like' sensory level occurs in central cord lesions. Saddle anesthesia (perineum, inner thighs) with preserved lower limb sensation indicates involvement of the conus medullaris (S3-S5 segments).\n\nA sensory level is a hallmark of spinal cord pathology (e.g., transverse myelitis, cord compression). The suspended cape-like pattern of central cord syndrome spares deep sensation. Saddle anesthesia localizes to the conus, whereas cauda equina lesions also cause saddle anesthesia but with LMN signs."
    difficulty: hard
    tags: [neurology, spinal-cord, lesion-localization, sensory-level]
  - front: "How do ANTERIOR HORN CELL lesions differ from PERIPHERAL NERVE lesions clinically?"
    back: "Anterior horn cell: weakness WITHOUT sensory symptoms, plus fasciculations, atrophy, cramps. Peripheral nerve: weakness OR sensory loss respecting the distribution of a SPECIFIC nerve (median, ulnar, radial), or length-dependent stocking-glove pattern for polyneuropathy. Anterior horn cell examples: ALS, spinal muscular atrophy, polio.\n\nAnterior horn cells house lower motor neurons but receive no sensory input, so their lesions are purely motor with LMN features. Peripheral nerve lesions involve mixed fibers, causing both motor AND sensory deficits in a nerve distribution. This distinction is key for EMG/NCS interpretation on MCCQE1."
    difficulty: medium
    tags: [neurology, anterior-horn-cell, peripheral-nerve, LMN]
  - front: "What are the distinguishing features of a NEUROMUSCULAR JUNCTION (NMJ) lesion?"
    back: "Fluctuating/FATIGABLE symptoms, facial and limb weakness, bulbar dysfunction (dysarthria, dysphonia, dysphagia), ocular involvement (diplopia, ptosis), respiratory distress. Reflexes usually preserved unless severe or in LEMS. No sensory deficits. Examples: myasthenia gravis, LEMS, botulism.\n\nThe key differentiator for NMJ disorders is fatigability — weakness worsens with repetitive activity (MG) or improves with repetition (LEMS). Preserved reflexes (unless LEMS) and absence of sensory symptoms help exclude neuropathy. MCCQE1 frequently tests MG vs. LEMS distinction."
    difficulty: medium
    tags: [neurology, neuromuscular-junction, myasthenia-gravis, LEMS]
  - front: "How do MYOPATHY lesions present, and what are the exceptions to the usual proximal weakness pattern?"
    back: "Usually: symmetric PROXIMAL weakness (difficulty climbing stairs, rising from chair) without sensory deficits. Exceptions with distal/asymmetric weakness: distal myopathies, inclusion body myositis, some glycogen storage diseases, facioscapulohumeral dystrophy. Also: myalgia, muscle atrophy.\n\nProximal symmetric weakness without sensory loss is the classic myopathy pattern. Inclusion body myositis is notable for asymmetric weakness with both proximal and distal involvement, and facioscapulohumeral dystrophy has a distinctive facial + shoulder-girdle pattern. Creatine kinase is elevated in myopathies (except late stage)."
    difficulty: medium
    tags: [neurology, myopathy, muscle-disease, weakness]
  - front: "Compare LMN, UMN, and extrapyramidal lesions across: tone, atrophy, reflexes, plantar response, and involuntary movements."
    back: "LMN: hypotonia, significant denervation atrophy, hyporeflexia/areflexia, flexor plantar, fasciculations. UMN: spasticity (velocity-dependent hypertonia), disuse atrophy over time, hyperreflexia, extensor plantar (Babinski), no involuntary movements. Extrapyramidal: rigidity (non-velocity-dependent hypertonia), variable atrophy, variable reflexes, flexor plantar, tremor/chorea/hemiballism/myoclonus.\n\nThis table is foundational for MCCQE1 neurology. Key distinctions: spasticity is velocity-dependent (catches then releases = clasp-knife), rigidity is not velocity-dependent (lead-pipe or cogwheel). Babinski sign is the most reliable UMN sign. Fasciculations indicate active denervation (LMN)."
    difficulty: easy
    tags: [neurology, LMN, UMN, extrapyramidal, motor-exam]
  - front: "What are the components of the Glasgow Coma Scale (GCS), and what is the maximum/minimum score?"
    back: "GCS = Eye opening (E/4) + Verbal response (V/5) + Motor response (M/6). Total: 3-15. Eye: 1=none, 2=to pain, 3=to voice, 4=spontaneous. Verbal: 1=none, 2=incomprehensible sounds, 3=inappropriate words, 4=confused, 5=oriented. Motor: 1=none, 2=extension to pain (decerebrate), 3=flexion to pain (decorticate), 4=withdraws, 5=localizes, 6=obeys commands.\n\nGCS is universally used to assess level of consciousness and severity of brain injury. Score ≤8 generally indicates coma requiring airway protection. Minimum score is 3 (not 0). GCS is a key component of trauma assessment and is tested on the MCCQE1 for both interpretation and clinical decision-making."
    difficulty: easy
    tags: [neurology, GCS, consciousness, trauma, neurological-exam]
  - front: "What are the MMSE and MoCA cutoffs for normal cognitive function, and what are the MMSE ranges for mild, moderate, and severe impairment?"
    back: "MMSE: scored /30. Normal >24; mild impairment 19-23; moderate impairment 10-18; severe impairment <10. MoCA: scored /30. Normal ≥26.\n\nThe MMSE and MoCA are standard screening tools for cognitive impairment in Canadian clinical practice. MoCA is more sensitive for mild cognitive impairment. Both are tested on MCCQE1 in the context of dementia evaluation, delirium workup, and fitness-to-drive assessments."
    difficulty: easy
    tags: [neurology, MMSE, MoCA, cognitive-assessment, dementia]
  - front: "What is a Relative Afferent Pupillary Defect (RAPD), and how is it detected?"
    back: "RAPD (Marcus Gunn pupil) = relative reduction in afferent pupillary light response in one eye due to optic nerve or extensive retinal disease. Detected by SWINGING FLASHLIGHT TEST: alternating light between eyes; the affected eye shows paradoxical dilation (both pupils dilate when light moves to that eye) while the normal eye shows constriction.\n\nRAPD indicates a unilateral defect in the afferent arc of the pupillary light reflex (CN II). Common causes: optic neuritis (MS), optic nerve compression, severe retinal disease. It is absent if the lesion is bilateral or posterior to the optic chiasm. RAPD is a key CN II exam finding on MCCQE1."
    difficulty: medium
    tags: [neurology, RAPD, optic-nerve, cranial-nerve-exam, pupil]
  - front: "What does CN III (oculomotor) palsy look like clinically, and what are the key causes?"
    back: "Eye position 'DOWN AND OUT,' ptosis, mydriasis (fixed dilated pupil), oblique binocular diplopia. Pupil-involving CN III palsy = posterior communicating artery aneurysm (surgical emergency). Pupil-sparing CN III palsy = microvascular (diabetes, hypertension).\n\nCN III innervates the superior rectus, inferior rectus, medial rectus, inferior oblique (extraocular muscles), levator palpebrae (eyelid), and parasympathetic pupilloconstrictor. External compression (PComm aneurysm) affects the outer parasympathetic fibers first (mydriasis), while ischemic causes spare them. This distinction is critical on MCCQE1."
    difficulty: hard
    tags: [neurology, CN-III, oculomotor-nerve, diplopia, aneurysm]
  - front: "What is the difference between LMN and UMN CN VII (facial nerve) palsies?"
    back: "LMN (Bell's palsy): ipsilateral complete facial weakness including FOREHEAD (upper and lower face affected). UMN (e.g., stroke): contralateral lower facial weakness with FOREHEAD SPARING (upper face has bilateral cortical representation). LMN also may cause decreased lacrimation, salivation, hyperacusis, loss of anterior 2/3 tongue taste.\n\nThe forehead-sparing pattern in UMN lesions occurs because the upper facial motor neurons receive bilateral cortical input, so a unilateral cortical/subcortical lesion only partially affects them. Complete ipsilateral facial palsy including forehead always indicates LMN pathology. This is one of the most high-yield MCCQE1 facial nerve questions."
    difficulty: medium
    tags: [neurology, CN-VII, facial-nerve, Bell-palsy, LMN-UMN]
  - front: "What does CN IV (trochlear nerve) palsy cause, and what is the compensatory head position?"
    back: "CN IV palsy causes vertical binocular diplopia and hypertropia (affected eye sits higher). The superior oblique performs INtorsion, DEpression, and ABduction. Compensatory head TILT to the contralateral side (tilting away from the affected eye reduces diplopia by compensating for the lost intorsion).\n\nCN IV has the longest intracranial course and is the most vulnerable CN to closed head trauma. The 3H test (Hypertropia, worsened with Head tilt to ipsilateral side, worsened on contralateral Horizontal gaze) confirms CN IV palsy. Contralateral head tilt is the classic compensatory posture."
    difficulty: hard
    tags: [neurology, CN-IV, trochlear-nerve, diplopia, cranial-nerve-exam]
  - front: "What does CN VI (abducens nerve) palsy cause?"
    back: "Horizontal binocular diplopia (worse on ipsilateral gaze), abduction deficit of the affected eye, and esotropia (eye deviated medially at rest). CN VI has the longest intracranial course before it exits the brainstem and is therefore vulnerable to raised ICP (false localizing sign) and trauma.\n\nCN VI palsy is the most common isolated ocular motor nerve palsy. It causes a lateral rectus palsy — the affected eye cannot abduct. Bilateral CN VI palsy after LP is a recognized complication of post-LP CSF hypotension. Raised ICP causing bilateral CN VI palsy is a 'false localizing sign' (not indicating a pontomedullary lesion)."
    difficulty: medium
    tags: [neurology, CN-VI, abducens-nerve, diplopia, raised-ICP]
  - front: "Describe the extraocular muscles and their cranial nerve innervations."
    back: "CN III (oculomotor): superior rectus (elevation), inferior rectus (depression), medial rectus (adduction), inferior oblique (elevation in adduction, extorsion). CN IV (trochlear): superior oblique (depression in adduction, intorsion). CN VI (abducens): lateral rectus (abduction). Mnemonic: SO4, LR6, all others CN3.\n\nKnowing which muscle each CN innervates allows precise localization of diplopia. The superior oblique (CN IV) is tested with the eye in adduction — asking the patient to look down and in isolates it. The lateral rectus (CN VI) is tested by asking the patient to look directly laterally."
    difficulty: medium
    tags: [neurology, extraocular-muscles, CN-III, CN-IV, CN-VI]
  - front: "What are the caloric test responses and what do they indicate?"
    back: "Cold water irrigation → nystagmus AWAY (towards contralateral ear, fast phase away from irrigated ear). Warm water → nystagmus TOWARDS (fast phase towards irrigated ear). Mnemonic: COWS = Cold Opposite, Warm Same. Tests vestibular (CN VIII) function and brainstem integrity.\n\nThe caloric test evaluates the vestibuloocular reflex. Absent responses indicate ipsilateral brainstem or CN VIII pathology. In comatose patients, absent response to cold caloric suggests severe brainstem dysfunction. The fast phase of nystagmus is the direction conventionally used to describe nystagmus direction."
    difficulty: medium
    tags: [neurology, CN-VIII, caloric-test, vestibular, nystagmus]
  - front: "What is the CN XI (accessory nerve) function, and what are the clinical deficits when it is damaged?"
    back: "CN XI innervates the sternocleidomastoid (SCM) and trapezius. Deficits: ipsilateral shoulder shrug weakness (trapezius) and contralateral head turn weakness. Note: the left SCM turns the head RIGHT (contracts to rotate head contralaterally). Damage causes inability to turn head away from the side of the lesion.\n\nCN XI is commonly injured by neck dissection surgery, radiation, or trauma. The SCM contraction rotates the head to the opposite side — so a right SCM lesion causes weakness turning the head LEFT. Trapezius weakness leads to shoulder drooping and difficulty elevating the arm above 90 degrees."
    difficulty: medium
    tags: [neurology, CN-XI, accessory-nerve, SCM, trapezius]
  - front: "What does CN XII (hypoglossal nerve) palsy cause, and which way does the tongue deviate?"
    back: "Tongue DEVIATES toward the WEAK side on protrusion. Also: atrophy and fasciculations of the tongue on the affected side (LMN lesion). UMN lesion: contralateral deviation (tongue deviates away from the lesion side). LMN lesion: ipsilateral deviation with atrophy/fasciculations.\n\nThe tongue deviates toward the weak side because the normal side pushes harder. LMN CN XII palsy (e.g., skull base tumour, neck mass) produces ipsilateral atrophy + deviation. UMN CN XII palsy (e.g., stroke) causes contralateral deviation without atrophy. Testing through the cheek assesses tongue strength."
    difficulty: medium
    tags: [neurology, CN-XII, hypoglossal, tongue-deviation, cranial-nerve-exam]
  - front: "What does CN X (vagus nerve) damage cause?"
    back: "Oropharyngeal dysphagia, hoarseness/dysarthria (vocal cord paralysis), soft palate drooping on the affected side, uvula deviates to the CONTRALATERAL (normal) side, absent gag reflex (efferent limb). Unilateral vagal palsy: uvula pulled toward intact side.\n\nCN X damage can result from brainstem lesions (Wallenberg syndrome), skull base pathology, or neck tumors. The uvula deviates away from the weak side — toward the functioning muscles. The vagus also provides parasympathetic innervation to thoracic and abdominal viscera. CN IX provides the afferent limb of the gag reflex."
    difficulty: medium
    tags: [neurology, CN-X, vagus-nerve, uvula, gag-reflex]
  - front: "What are the indications and key contraindications for lumbar puncture (LP)?"
    back: "Indications — Diagnostic: CNS infection (meningitis, encephalitis), SAH (if CT head negative), idiopathic intracranial hypertension (IIH), NPH, MS, GBS, CNS vasculitis. Therapeutic: decrease ICP, intrathecal drugs (anesthesia, chemotherapy, antibiotics). Imaging: intrathecal contrast for myelography. Contraindications: increased ICP with mass/edema/obstructive hydrocephalus (risk herniation — CT head first), skin infection/epidural abscess at insertion site, severe thrombocytopenia (<50×10⁹/L), high INR (>1.4), coagulopathy.\n\nLP is performed at L3-L4 or L4-L5, below the conus medullaris (L1-L2). In suspected bacterial meningitis, do NOT delay antibiotics to wait for CT or LP — give antibiotics immediately if LP is delayed. A normal CT does not completely exclude elevated ICP, but it is required to rule out obstructive causes before LP."
    difficulty: medium
    tags: [neurology, lumbar-puncture, CSF, meningitis, contraindications]
  - front: "What are the features and management of post-LP headache?"
    back: "Onset within 24-48 hours of LP, worse when upright (orthostatic), better when supine (positional). Prevention: smaller gauge needle (22G), reinserting stylet before removal, blunt-ended (atraumatic) needle. Treatment — symptomatic: oral analgesics, antiemetics, IV caffeine/sodium benzoate. Definitive: epidural blood patch.\n\nPost-LP headache (5-40% incidence) results from CSF leakage through the dural puncture site, causing intracranial hypotension. The hallmark orthostatic pattern distinguishes it from other headaches. Epidural blood patch (autologous blood injected into epidural space to seal the leak) is the definitive treatment when conservative measures fail."
    difficulty: medium
    tags: [neurology, lumbar-puncture, post-LP-headache, epidural-blood-patch]
  - front: "What is xanthochromia, and what is its diagnostic significance?"
    back: "Xanthochromia is yellow discolouration of the CSF caused by bilirubin from the breakdown of RBCs. It is diagnostic of SUBARACHNOID HEMORRHAGE (SAH). Also, in SAH, RBC count is equal in tube #1 and tube #4 (vs. traumatic tap where tube #1 >> tube #4).\n\nXanthochromia typically appears 2-4 hours after SAH and can persist for up to 2-3 weeks. A CT head negative for SAH should be followed by LP looking for xanthochromia or elevated RBCs. The RBC count comparison between first and last tubes differentiates SAH from traumatic tap — a critical MCCQE1 concept."
    difficulty: medium
    tags: [neurology, xanthochromia, SAH, CSF-analysis, lumbar-puncture]
  - front: "Compare the CSF findings in bacterial meningitis vs. viral meningitis vs. SAH."
    back: "Bacterial meningitis: cloudy, high protein (~1.0 g/L), low/normal glucose, high WBC (>1000×10⁶/L, neutrophil-predominant), high opening pressure. Viral meningitis: clear, normal or high protein (0.50-3.0 g/L), normal glucose, high WBC (<1000×10⁶/L, lymphocyte-predominant), usually normal opening pressure. SAH: xanthochromic or grossly bloody, high protein, normal glucose, high RBC (equal in tubes 1 and 4), normal opening pressure.\n\nCSF interpretation is high-yield on MCCQE1. The key differentiators: glucose (low in bacterial, normal in viral), cell type (neutrophils in bacterial, lymphocytes in viral), and colour (xanthochromia in SAH). Low glucose in meningitis results from both bacterial consumption and impaired transport."
    difficulty: medium
    tags: [neurology, CSF-analysis, meningitis, SAH, lumbar-puncture]
  - front: "What are the CSF findings in Guillain-Barré Syndrome (GBS), and what is the classic pattern called?"
    back: "GBS CSF: clear fluid, HIGH protein (often markedly elevated), NORMAL WBC count (<5×10⁶/L), normal glucose, normal opening pressure. This pattern is called ALBUMINOCYTOLOGIC DISSOCIATION (elevated protein with normal cell count).\n\nAlbuminocytologic dissociation is the CSF hallmark of GBS. It reflects inflammatory damage to nerve roots causing protein leakage without pleocytosis. The degree of protein elevation generally correlates with disease severity. This is one of the most frequently tested CSF patterns on MCCQE1."
    difficulty: medium
    tags: [neurology, GBS, CSF-analysis, albuminocytologic-dissociation]
  - front: "What are the CSF findings in Multiple Sclerosis (MS)?"
    back: "MS CSF: clear, normal or slightly elevated protein, normal glucose, normal or slightly elevated WBC (lymphocyte-predominant), normal opening pressure. Key finding: OLIGOCLONAL BANDS on CSF protein electrophoresis (IgG bands present in CSF but not in serum, indicating intrathecal IgG synthesis).\n\nOligoclonal bands are found in >90% of MS patients but are not specific (also seen in CNS Lyme, neurosyphilis, viral encephalitis). The finding of oligoclonal bands, combined with clinical presentation and MRI, supports the diagnosis of MS. Elevated IgG index is another supportive finding."
    difficulty: medium
    tags: [neurology, multiple-sclerosis, CSF-analysis, oligoclonal-bands]
  - front: "What is the normal CSF opening pressure range in adults, and how is it measured?"
    back: "Normal CSF opening pressure in adults: 6-25 cmH₂O. In children: 12-28 cmH₂O. Measured using a manometer BEFORE collection of CSF, with the patient in LATERAL DECUBITUS position, head neutral, and legs extended.\n\nAccurate opening pressure measurement requires proper patient positioning — legs extended (not fetal position) to avoid falsely elevated readings. Elevated opening pressure (>25 cmH₂O in adults) suggests idiopathic intracranial hypertension, CNS infection, or venous sinus thrombosis. IIH (pseudotumor cerebri) has elevated pressure with otherwise normal CSF."
    difficulty: easy
    tags: [neurology, lumbar-puncture, CSF-pressure, IIH]
  - front: "In radiculopathy vs. peripheral neuropathy affecting C6, which muscles would be weak in each condition?"
    back: "C6 radiculopathy: ALL muscles supplied by C6 are weak — both biceps brachii (musculocutaneous nerve, elbow flexion) AND extensor carpi radialis longus (radial nerve, wrist extension). C6 peripheral neuropathy (e.g., musculocutaneous nerve palsy): ONLY biceps brachii (elbow flexion) weak, wrist extension spared. C6 radial nerve palsy: ONLY wrist extension weak, elbow flexion spared.\n\nThe key principle: radiculopathy affects ALL muscles sharing a nerve root regardless of which peripheral nerve delivers them. Peripheral neuropathy affects only muscles served by that specific nerve. This table-based approach (Table 5 in Toronto Notes) is high-yield for MCCQE1 EMG and clinical localization questions."
    difficulty: hard
    tags: [neurology, radiculopathy, peripheral-neuropathy, C6, localization]
  - front: "Which spinal nerve roots are responsible for key myotomal functions (C5-S2)?"
    back: "C5: shoulder abduction (deltoid). C6: elbow flexion, wrist extension. C7: elbow extension, finger extension. C8/T1: finger abduction, thumb movements. L2: hip flexion. L3: hip adduction. L4: knee extension, ankle dorsiflexion. L5: ankle dorsiflexion, big toe extension. S1: ankle plantarflexion. S1-S2: ankle plantarflexion (gastrocnemius/soleus).\n\nMyotomes are essential for localizing radiculopathy. Quick mnemonics: C5=shake hands/raise elbow; C6=bend elbow; C7=push down; C8/T1=fingers; L4=kick forward (knee ext); L5=walk on heels; S1=walk on toes. These are also the reflexes: C5-6=biceps, C7=triceps, L4=patellar, S1=ankle."
    difficulty: medium
    tags: [neurology, myotomes, radiculopathy, dermatomes, spinal-nerve]
  - front: "What does the Romberg test assess, and what does a positive result indicate?"
    back: "Romberg test: patient stands with feet together and eyes CLOSED. POSITIVE if patient becomes unstable when eyes are closed (but was stable with eyes open). Indicates loss of proprioception causing SENSORY ATAXIA (dorsal column dysfunction). Eyes-open instability suggests cerebellar ataxia (Romberg negative).\n\nThe Romberg test isolates proprioception by removing visual compensation. With eyes open, vision compensates for proprioceptive loss. When eyes close, the patient with dorsal column disease (e.g., B12 deficiency, tabes dorsalis, MS) becomes unsteady. Cerebellar ataxia is present even with eyes open, making Romberg negative."
    difficulty: medium
    tags: [neurology, Romberg-test, proprioception, sensory-ataxia, dorsal-column]
  - front: "Compare the four pathways: dorsal column-medial lemniscus vs. spinothalamic tract — what do they carry and where do they decussate?"
    back: "Dorsal column-medial lemniscus (DCML): fine touch, vibration, proprioception from body. Decussates at the MEDULLA (internal arcuate fibers → medial lemniscus). Spinothalamic tract: pain and temperature from body. Decussates within 1-2 SPINAL LEVELS of entry (crosses at spinal cord level), then ascends as spinothalamic tract.\n\nThe different decussation levels explain the pattern in spinal cord syndromes: Brown-Séquard (hemisection) causes ipsilateral loss of fine touch/vibration/proprioception (DCML) and CONTRALATERAL loss of pain/temperature (spinothalamic) below the lesion. Central cord lesions disrupt crossing spinothalamic fibers, causing bilateral pain/temperature loss in a cape-like distribution."
    difficulty: hard
    tags: [neurology, spinothalamic, dorsal-column, sensory-pathways, decussation]
  - front: "What are the key features of neuromuscular disease on EMG/NCS for each category: motor neuron disease, peripheral neuropathy, NMJ disorder, and myopathy?"
    back: "Motor neuron disease (e.g. ALS): EMG shows denervation/reinnervation (large motor unit potentials); NCS normal or abnormal; CK normal/mildly increased. Peripheral neuropathy: EMG denervation/reinnervation; NCS shows demyelination and/or axonal loss; CK normal. NMJ disorder: EMG shows jitter on single-fibre EMG; NCS shows decremental response on repetitive nerve stimulation (MG) or incremental response (LEMS); CK normal. Myopathy: EMG shows small, short motor unit potentials; NCS normal; CK increased (early/mid-stage).\n\nEMG/NCS interpretation is high-yield for MCCQE1. Repetitive nerve stimulation: MG shows decremental response (>10% decrement at 3Hz); LEMS shows incremental response (>100% facilitation at high-frequency stimulation). Single-fibre EMG is most sensitive for NMJ disorders. CK elevation points to myopathy or motor neuron disease."
    difficulty: hard
    tags: [neurology, EMG, NCS, neuromuscular-disease, myopathy]
  - front: "What are the gait patterns associated with common neurological conditions?"
    back: "Antalgic: limping due to pain. Hemiplegic: circumduction of a spastic leg (UMN). Ataxic: wide-based, staggering (cerebellar or sensory). Parkinsonian: shuffling, festinating, stooped posture, reduced arm swing, difficulty initiating. Steppage (foot drop): high steps to clear a dropped foot (peroneal nerve/L4-L5 lesion). Broad-based: cerebellar or normal pressure hydrocephalus. Apraxic: 'magnetic gait' (feet stick to floor, NPH).\n\nGait assessment is a key component of the neurological exam. The pull test (stand behind patient, pull shoulders back) assesses postural instability in Parkinson's disease (positive = retropulsion >2 steps). NPH presents with the triad: magnetic gait (apraxic), urinary incontinence, and cognitive decline."
    difficulty: medium
    tags: [neurology, gait, Parkinson, cerebellar, NPH, foot-drop]
  - front: "What is the approach to a patient presenting with WEAKNESS, including key differentiating features and investigations?"
    back: "Mode of onset: abrupt (vascular/toxic/metabolic), subacute (neoplastic/inflammatory), insidious (genetic/degenerative). Course: worse at onset (vascular), progressive (neoplastic/degenerative), episodic (vascular/inflammatory), activity-dependent (NMJ/muscle). Pattern: generalized vs. localized; proximal vs. distal; UMN vs. LMN; symmetric vs. asymmetric. Investigations: LMN → NCS/EMG; UMN → brain/spinal cord MRI; myopathy → CK, muscle biopsy, EMG; NMJ → NCS/EMG with repetitive stimulation, AChR antibodies (MG), VGCC antibodies (LEMS).\n\nA structured approach to weakness localizes the lesion: proximal symmetric → myopathy; distal symmetric → polyneuropathy; fatigable → NMJ; fasciculations + atrophy → anterior horn cell; UMN signs + sensory level → spinal cord; hemiplegia + cortical signs → cortex. This framework guides efficient MCCQE1 clinical reasoning."
    difficulty: medium
    tags: [neurology, weakness, clinical-approach, differential-diagnosis]
  - front: "What is the significance of 'dissociated sensory loss,' and what conditions cause it?"
    back: "Dissociated sensory loss: loss of one sensory modality while the other is preserved. Spinothalamic loss (pain/temperature) with preserved dorsal column (fine touch/proprioception): central cord lesion (syringomyelia), Brown-Séquard syndrome. Dorsal column loss with preserved spinothalamic: posterior cord infarction, Tabes dorsalis, B12 deficiency, Friedrich's ataxia.\n\nThe anatomical separation of the spinothalamic tract (anterior/lateral) and dorsal columns (posterior) allows selective loss. Syringomyelia causes a cape-like bilateral pain/temperature loss from central canal expansion disrupting crossing spinothalamic fibers. Brown-Séquard (cord hemisection) causes ipsilateral DCML loss and contralateral spinothalamic loss below the lesion."
    difficulty: hard
    tags: [neurology, sensory-loss, spinothalamic, dorsal-column, syringomyelia]
  - front: "What is the Circle of Willis, and which arteries compose it?"
    back: "The Circle of Willis is an anastomotic ring at the base of the brain providing collateral flow. Components: bilateral anterior cerebral arteries (ACA) connected by the anterior communicating artery (AComm); bilateral internal carotid arteries (ICA); bilateral posterior cerebral arteries (PCA) connected to the ICA by the posterior communicating arteries (PComm); basilar artery (formed by vertebral arteries) → PCAs.\n\nThe Circle of Willis allows collateral circulation if one vessel is occluded. The most common aneurysm location is the AComm (35%), followed by PComm and middle cerebral artery bifurcation. A PComm aneurysm classically causes CN III palsy. Understanding the circle is essential for stroke localization and aneurysm management on MCCQE1."
    difficulty: medium
    tags: [neurology, circle-of-Willis, cerebrovascular, aneurysm, neuroanatomy]
  - front: "What are the key arteries supplying the brainstem and cerebellum, and what syndromes result from their occlusion?"
    back: "Basilar artery: pons (occlusion → locked-in syndrome or death). PICA (posterior inferior cerebellar artery, from vertebral artery): lateral medulla and inferior cerebellum → Wallenberg syndrome (lateral medullary syndrome). AICA (anterior inferior cerebellar artery, from basilar): lateral pons and anterior-inferior cerebellum → lateral pontine syndrome. SCA (superior cerebellar artery, from basilar): superior cerebellum.\n\nWallenberg (PICA) syndrome is high-yield: ipsilateral face loss of pain/temperature (spinal trigeminal), contralateral body loss of pain/temperature (spinothalamic), ipsilateral Horner's, ipsilateral dysmetria, dysphagia, vertigo, nystagmus. AICA occlusion classically causes ipsilateral CN VII and VIII deficits. The '5 Ds' of posterior circulation stroke: Diplopia, Dysarthria, Dysphagia, Dizziness, Drop attacks."
    difficulty: hard
    tags: [neurology, brainstem-arteries, Wallenberg, PICA, AICA, stroke]
  - front: "What is the corticospinal tract pathway, and where does it decussate?"
    back: "Upper motor neuron originates in primary motor cortex → descends through internal capsule → cerebral peduncle → pons (pyramidal tracts) → MEDULLA (pyramidal decussation, ~85% of fibers cross) → contralateral lateral corticospinal tract (limb muscles). Remaining ~15% descend ipsilaterally as the anterior corticospinal tract (axial muscles, cross at each spinal level).\n\nPyramidal decussation at the cervicomedullary junction explains why cortical/subcortical strokes cause contralateral weakness. The anterior corticospinal tract controls axial/trunk muscles bilaterally, explaining why trunk control is often preserved in hemiplegia. Lesions above the decussation cause contralateral weakness; lesions below cause ipsilateral weakness."
    difficulty: medium
    tags: [neurology, corticospinal-tract, motor-pathway, decussation, UMN]
  - front: "What are the autonomic functions of the sympathetic vs. parasympathetic nervous systems relevant to the pupil?"
    back: "Sympathetic: dilates the pupil (mydriasis) via the dilator pupillae. 3-neuron arc: hypothalamus → ciliospinal center (C8-T2) → superior cervical ganglion → pupil. Disruption → Horner's syndrome (miosis, ptosis, anhidrosis). Parasympathetic: constricts the pupil (miosis) via sphincter pupillae, carried by CN III (Edinger-Westphal nucleus → ciliary ganglion → pupil).\n\nHorner's syndrome (sympathetic disruption): miosis + partial ptosis (loss of Müller's muscle) + anhidrosis of the face. Central Horner's (brainstem/cord): no anhidrosis above T1. Pre-ganglionic (between T1 and superior cervical ganglion): anhidrosis of entire face. Post-ganglionic (above superior cervical ganglion): anhidrosis of medial face only. Localization guides the workup."
    difficulty: hard
    tags: [neurology, autonomic, pupil, Horner-syndrome, sympathetic]
  - front: "What are the key components assessed when characterizing an abnormal gait?"
    back: "Posture, stride length, width between feet, height of step, stability of pelvis, symmetry, arm swing, difficulty turning, tremor, elaborate/inconsistent movements, standing from sitting, and antalgia.\n\nA systematic gait assessment is required before ordering investigations. Red flags that prompt urgent workup include sudden onset, cerebellar ataxia, paresis (hemi-, para-, quadri-), and bowel/bladder incontinence."
    difficulty: easy
    tags: [neurology, gait, neurological exam]
  - front: "What type of gait is associated with proprioceptive loss, and what is the classic finding on exam?"
    back: "Sensory ataxia: wide-based gait with high stepping posture and a positive Romberg sign.\n\nProprioceptive loss causes a sensory ataxia due to impaired joint position sense. Causes include demyelinating neuropathies, paraneoplastic syndrome, tabes dorsalis, MS, compressive myelopathy, and vitamin B12 deficiency. The positive Romberg (worsening with eyes closed) distinguishes it from cerebellar ataxia."
    difficulty: easy
    tags: [neurology, gait, proprioception, ataxia]
  - front: "What is a steppage gait and what causes it?"
    back: "Steppage gait results from foot drop (inability to dorsiflex the foot), causing the patient to lift the leg high to clear the foot. Causes include acquired/hereditary peripheral neuropathy, compressive peroneal neuropathy, and L4-L5 radiculopathy.\n\nFoot drop is caused by lower limb nerve disorders affecting the peroneal nerve or L4/L5 nerve roots. The patient compensates by exaggerated hip and knee flexion to clear the foot during the swing phase."
    difficulty: easy
    tags: [neurology, gait, foot drop, peroneal nerve]
  - front: "Describe the Parkinsonian gait and list four causes of Basal Ganglia gait disturbance."
    back: "Parkinsonian gait: short stride length, stooped posture, reduced arm swing. Causes include: Parkinson's disease (PD), progressive supranuclear palsy, multiple system atrophy (MSA), Huntington's disease, infarct, neuroleptic medications, Wilson's disease.\n\nBasal ganglia dysfunction leads to impaired initiation and modulation of movement. Other features of Parkinsonism include festination (progressive quickening of pace), freezing, and difficulty turning. Choreic, hemiballistic, and dystonic gaits are also basal ganglia manifestations."
    difficulty: medium
    tags: [neurology, gait, Parkinsons, basal ganglia]
  - front: "How does cerebellar ataxic gait differ from sensory ataxic gait?"
    back: "Cerebellar ataxia: wide-based gait WITHOUT high stepping, veers to the side of the lesion. Sensory ataxia: wide-based WITH high stepping and a positive Romberg sign.\n\nIn cerebellar ataxia the Romberg test is negative (patient is unsteady with eyes both open and closed). In sensory ataxia, closing the eyes dramatically worsens balance (positive Romberg). Cerebellar causes include neoplasm, toxins (EtOH), vitamin E deficiency, hypothyroidism, hypoxia, and paraneoplastic syndrome."
    difficulty: medium
    tags: [neurology, gait, cerebellar ataxia, sensory ataxia, Romberg]
  - front: "What is a waddling gait and what underlying conditions cause it?"
    back: "A broad-based, short-stepped gait with pronounced lumbar lordosis and rotation of the pelvis due to proximal muscle weakness. Caused by myopathies: muscular dystrophy and inflammatory myopathies.\n\nProximal hip girdle weakness prevents normal stabilization of the pelvis during walking, causing the characteristic waddling movement. Patients also typically have difficulty rising from a chair and climbing stairs."
    difficulty: easy
    tags: [neurology, gait, myopathy, muscular dystrophy]
  - front: "What are the features of a spastic gait and what conditions cause bilateral spastic gait?"
    back: "Spastic gait features: spastic foot drop, circumduction, scissoring of legs or toe walking with bilateral circumduction. Bilateral causes include cervical spondylosis, cerebral palsy, spinal cord tumour, combined spinal cord degeneration, MS, and motor neuron disease.\n\nSpastic gait results from corticospinal tract lesions. Unilateral spastic gait is typically caused by stroke (ischemic or hemorrhagic). Bilateral involvement suggests spinal cord pathology or bilateral upper motor neuron disease."
    difficulty: medium
    tags: [neurology, gait, spastic gait, corticospinal tract, UMN]
  - front: "What is Kallmann syndrome and which cranial nerve deficit is associated with it?"
    back: "Kallmann syndrome is a congenital disorder characterized by anosmia (CN I deficit) and hypogonadotropic hypogonadism.\n\nKallmann syndrome involves failure of GnRH neurons and olfactory neurons to migrate properly during development. It is an important cause of congenital anosmia and must be distinguished from acquired causes when evaluating CN I deficits."
    difficulty: medium
    tags: [neurology, cranial nerves, anosmia, Kallmann syndrome, CN I]
  - front: "What are the main categories in the differential diagnosis of anosmia (CN I deficit)?"
    back: "1. Nasal obstruction (rhinitis, nasal mass, septal deformity, choanal atresia). 2. Olfactory receptor neuron injury (head trauma, smoking, COVID-19). 3. Central olfactory structure involvement: neurological disease (AD, PD, MS), anterior cranial fossa mass (meningioma, aneurysm), intracranial surgery, Kallmann syndrome.\n\nCOVID-19 causing anosmia via damage to receptor neurons is an important recent addition to the differential. Loss of smell is often perceived as altered taste since olfaction contributes to flavour perception."
    difficulty: medium
    tags: [neurology, cranial nerves, CN I, anosmia]
  - front: "What is the classic eye position in a complete CN III palsy and what are the associated findings?"
    back: "Eye is 'down and out' (unopposed lateral rectus and superior oblique). Associated features: mydriasis (pupillary constrictor paralysis) and ptosis (levator palpebrae superioris paralysis). Vertical and horizontal (oblique) binocular diplopia.\n\nCN III innervates the superior rectus, inferior rectus, medial rectus, inferior oblique, levator palpebrae, and pupillary constrictor. Loss of these functions with preserved lateral rectus (CN VI) and superior oblique (CN IV) results in the characteristic down-and-out position."
    difficulty: medium
    tags: [neurology, cranial nerves, CN III, oculomotor, diplopia]
  - front: "In CN III palsy, how does the pupillary response distinguish ischemic from compressive causes?"
    back: "Pupil-sparing CN III palsy suggests ischemic cause (microvascular). Mydriasis (dilated, non-reactive pupil) suggests compressive cause (e.g., posterior communicating artery aneurysm, uncal herniation).\n\nParasympathetic pupillary constrictor fibers travel in the periphery of CN III and are selectively compressed by external mass lesions. Smaller central blood vessels are more susceptible to ischemia (microvascular), which spares the peripheral parasympathetic fibers. This distinction is clinically critical — compressive causes require urgent neuroimaging."
    difficulty: hard
    tags: [neurology, cranial nerves, CN III, pupil, aneurysm, ischemia]
  - front: "What are the three main categories in the DDx of CN III palsy?"
    back: "1. Ischemic (microvascular — pupil sparing). 2. Compressive (posterior communicating artery aneurysm, cavernous sinus lesion — mydriasis). 3. Midbrain lesion (mass, infarction, demyelination).\n\nA posterior communicating artery aneurysm is an emergency and must be ruled out promptly when CN III palsy presents with mydriasis. Additional compressive causes include uncal herniation, trauma, and orbital or cavernous sinus lesions."
    difficulty: medium
    tags: [neurology, cranial nerves, CN III, aneurysm]
  - front: "What are the clinical features of a CN IV (trochlear nerve) palsy?"
    back: "Vertical and torsional binocular diplopia, hypertropia (paralysis of superior oblique with unopposed elevation), contralateral head tilt, difficulty going down stairs or reading.\n\nCN IV is the only cranial nerve that exits the brainstem posteriorly. Its axons decussate in the superior medullary velum. Therefore, lesions of the trochlear nucleus cause contralateral superior oblique paralysis. Common causes include microvascular ischemia, trauma (TBI or surgical), and cavernous sinus lesions."
    difficulty: medium
    tags: [neurology, cranial nerves, CN IV, trochlear, diplopia]
  - front: "How do CN III, IV, and VI palsies differ clinically in their eye position and diplopia?"
    back: "CN III: eye 'down and out', ptosis, mydriasis, vertical/horizontal diplopia. CN IV: hypertropia, contralateral head tilt, diplopia worse going downstairs, torsional diplopia. CN VI: esotropia, diplopia worse on lateral gaze toward affected side (horizontal diplopia only).\n\nDifferentiating the cranial nerve responsible requires careful analysis of eye position at rest, direction of diplopia, associated features (ptosis, pupil changes, head tilt), and direction that worsens diplopia. CN VI palsy presents with horizontal diplopia due to failure of abduction."
    difficulty: hard
    tags: [neurology, cranial nerves, diplopia, CN III, CN IV, CN VI]
  - front: "What is the clinical significance of CN VI being a false localizing sign?"
    back: "CN VI is vulnerable to increased or decreased ICP because of its long intracranial course, resulting in abducens palsy that does not localize the lesion to the pons — it is a 'false localizing sign'.\n\nThe long intracranial path of the abducens nerve makes it susceptible to stretching with elevated or decreased ICP. Therefore, an isolated CN VI palsy does not necessarily indicate a pontine lesion and should prompt investigation for raised ICP (e.g., LP after ruling out mass lesion)."
    difficulty: hard
    tags: [neurology, cranial nerves, CN VI, raised ICP, false localizing sign]
  - front: "What is the difference between LMN and UMN facial nerve (CN VII) palsy in terms of clinical presentation?"
    back: "LMN: complete ipsilateral facial paralysis (forehead AND lower face). UMN: contralateral paralysis WITH forehead sparing (bilateral UMN input to frontalis via facial motor nucleus).\n\nThe forehead (frontalis) receives bilateral UMN input, so a unilateral upper motor neuron lesion (e.g., stroke in internal capsule) spares forehead movement. A LMN lesion (e.g., Bell's palsy) involves all ipsilateral facial muscles including the forehead. Additional LMN features include decreased lacrimation, hyperacusis, and loss of taste in anterior 2/3 of tongue."
    difficulty: medium
    tags: [neurology, cranial nerves, CN VII, facial palsy, Bells palsy, UMN vs LMN]
  - front: "What are the main causes of CN VII palsy?"
    back: "Bell's palsy (idiopathic, 80-90% of cases), herpes zoster oticus (Ramsay Hunt syndrome), otitis media/mastoiditis, sarcoidosis, Lyme meningitis, HIV, parotid gland disorder, temporal bone fracture.\n\nBell's palsy is the most common cause and is a diagnosis of exclusion. Ramsay Hunt syndrome presents with painful herpetic vesicles in the ear canal and is associated with worse prognosis. Bilateral facial palsy should prompt investigation for Lyme disease or sarcoidosis."
    difficulty: easy
    tags: [neurology, cranial nerves, CN VII, Bells palsy, Ramsay Hunt]
  - front: "What are the clinical features of CN IX (glossopharyngeal nerve) palsy?"
    back: "Oropharyngeal dysphagia (paralysis of stylopharyngeus — less severe than CN X), absent gag reflex (CN IX = afferent limb), loss of taste and sensation from posterior 1/3 of tongue.\n\nCN IX provides the afferent limb of the gag reflex while CN X provides the efferent limb. Isolated CN IX palsy is rare; it often occurs with CN X palsy (jugular foramen syndrome). The dysphagia from CN IX palsy is less severe than CN X because CN X supplies most pharyngeal muscles."
    difficulty: medium
    tags: [neurology, cranial nerves, CN IX, glossopharyngeal, dysphagia]
  - front: "What is glossopharyngeal neuralgia and how is it treated?"
    back: "Paroxysmal, shock-like pain from the posterior tongue, oropharynx, and ear, triggered by swallowing, chewing, coughing, or talking. Causes: vascular compression (usually PICA), neck mass, Eagle syndrome, demyelination, idiopathic. Treatment: antiepileptic drugs (carbamazepine), lidocaine, or surgery (microvascular decompression or surgical ablation of CN IX).\n\nGlossopharyngeal neuralgia parallels trigeminal neuralgia in its paroxysmal character and response to carbamazepine. The distinction from trigeminal neuralgia is based on trigger zones (swallowing vs. touch) and location (oropharynx vs. face)."
    difficulty: medium
    tags: [neurology, cranial nerves, CN IX, neuralgia, carbamazepine]
  - front: "What direction does the uvula deviate in a CN X LMN lesion and why?"
    back: "The uvula deviates AWAY from (contralateral to) the lesion, because paralysis of ipsilateral soft palate muscles prevents elevation on that side, causing the uvula to be pulled to the intact side.\n\nCN X innervates most muscles of the soft palate. When the ipsilateral palatal muscles are weak, the contralateral muscles pull the uvula toward the healthy side. This is opposite to tongue deviation in CN XII, where the tongue deviates toward the weak side."
    difficulty: hard
    tags: [neurology, cranial nerves, CN X, vagus, uvula deviation]
  - front: "What is the proper clinical screening test for dysphagia and aspiration risk?"
    back: "Observe the patient drinking water from a cup while watching for coughing, choking, or 'wetness' of voice. The presence of a gag reflex alone is insufficient as a screening test.\n\nThe gag reflex tests CN IX/X but does not reliably predict aspiration risk or safe swallowing. The water swallow test is a validated bedside screening tool. Patients with suspected aspiration should be referred for formal swallowing assessment by speech-language pathology."
    difficulty: medium
    tags: [neurology, cranial nerves, CN X, dysphagia, aspiration]
  - front: "What are the clinical features of CN XI (accessory nerve) palsy?"
    back: "Contralateral head turn weakness (paralysis of sternocleidomastoid) and ipsilateral shoulder shrug weakness (paralysis of trapezius). LMN lesion: ipsilateral paralysis; UMN lesion: contralateral paralysis. CN XI is vulnerable to injury during neck surgery.\n\nThe sternocleidomastoid turns the head to the contralateral side, so its ipsilateral weakness (LMN) presents as weakness turning the head toward the contralateral side. The trapezius elevates the ipsilateral shoulder. CN XI can be damaged during cervical lymph node dissection or other neck surgery."
    difficulty: medium
    tags: [neurology, cranial nerves, CN XI, accessory nerve]
  - front: "In what direction does the tongue deviate in CN XII (hypoglossal nerve) palsy, and how does LMN vs UMN differ?"
    back: "LMN lesion: tongue deviates TOWARD the weak (ipsilateral) side with atrophy and fasciculations. UMN lesion: tongue deviates AWAY from (contralateral to) the lesion, without wasting.\n\nThe genioglossus muscle protrudes the tongue. In LMN hypoglossal palsy, the ipsilateral genioglossus is weak, so the stronger contralateral side pushes the tongue toward the weak side. LMN signs (atrophy, fasciculations) help distinguish from UMN palsy."
    difficulty: medium
    tags: [neurology, cranial nerves, CN XII, hypoglossal, tongue deviation, UMN vs LMN]
  - front: "What clinical triad characterizes optic neuropathy?"
    back: "1. Vision loss (decreased visual acuity, decreased colour vision, visual field defect). 2. Relative afferent pupillary defect (RAPD) — only if unilateral or asymmetric. 3. Change in appearance of optic disc (disc edema or pallor).\n\nRAPD (Marcus Gunn pupil) is tested with the swinging flashlight test and indicates optic nerve asymmetry. It is absent in symmetric bilateral optic neuropathy. Optic disc pallor indicates chronic irreversible optic atrophy from ganglion cell loss."
    difficulty: medium
    tags: [neurology, neuro-ophthalmology, optic neuropathy, RAPD]
  - front: "Compare arteritic vs non-arteritic anterior ischemic optic neuropathy (AION)."
    back: "Arteritic AION: usually caused by GCA; associated with headache, scalp tenderness, jaw claudication, systemic symptoms (weight loss, fatigue, fever); RAPD present; treated with corticosteroids urgently. Non-arteritic AION: associated with vascular risk factors (DM, hyperlipidemia, HTN, atherosclerosis); no proven treatment; optimize risk factors.\n\nIf GCA is suspected, corticosteroids must be started IMMEDIATELY without waiting for temporal artery biopsy, as delay risks bilateral blindness. Investigation includes CBC, ESR, CRP, and temporal artery biopsy. Non-arteritic AION typically affects patients >50 yr and is the more common form."
    difficulty: hard
    tags: [neurology, neuro-ophthalmology, AION, GCA, ischemic optic neuropathy]
  - front: "What distinguishes optic neuritis from papilledema in terms of clinical features?"
    back: "Optic neuritis: unilateral/binocular central vision loss with pain on eye movement, RAPD present, age <50, associated with MS. Papilledema: bilateral disc edema from raised ICP, late vision loss, no RAPD, associated with headache/nausea/vomiting and neurological deficits.\n\nPapilledema is bilateral optic disc edema specifically due to increased intracranial pressure and does not initially cause significant vision loss. Optic neuritis causes acute vision loss with pain on eye movement and is a classic MS presentation. Treatment of optic neuritis: high-dose IV or PO corticosteroids (accelerates recovery but does not improve long-term outcome)."
    difficulty: hard
    tags: [neurology, neuro-ophthalmology, optic neuritis, papilledema, MS]
  - front: "What visual field defect is associated with a lesion at the optic chiasm, and what causes it by age group?"
    back: "Bitemporal hemianopsia (loss of both temporal fields). Causes by age: children — craniopharyngioma; 20-50 yr — pituitary adenoma; >60 yr — meningioma.\n\nThe optic chiasm contains decussating nasal fibers from both eyes. A compressive lesion at the chiasm (usually from below, e.g., pituitary adenoma) preferentially damages these crossing fibers, causing loss of both temporal visual fields — bitemporal hemianopsia."
    difficulty: medium
    tags: [neurology, neuro-ophthalmology, visual fields, optic chiasm, bitemporal hemianopsia]
  - front: "Where is the lesion in left homonymous hemianopsia with macular sparing, and what is the significance of congruence?"
    back: "Left homonymous hemianopsia = right-sided lesion (optic tract, temporal/parietal radiation, or occipital cortex). Macular sparing suggests occipital cortex lesion. More posterior lesions produce more congruent (symmetric in both eyes) deficits.\n\nHomonymous hemianopsia affects the same side of the visual field in both eyes and indicates a post-chiasmal lesion. The more posterior the lesion, the more congruent and complete the defect. Macular sparing with occipital lesions may be due to dual blood supply of the macula or the large cortical representation of the macula."
    difficulty: hard
    tags: [neurology, neuro-ophthalmology, visual fields, homonymous hemianopsia, occipital cortex]
  - front: "What visual field defect results from a lesion of Meyer's loop (temporal radiation)?"
    back: "Left upper quadrantanopsia (pie in the sky defect) from a right temporal lesion affecting Meyer's loop.\n\nMeyer's loop carries inferior retinal fibers (representing the superior visual field) through the temporal lobe. A temporal lobe lesion (e.g., from temporal lobe surgery or tumour) causes a contralateral superior quadrantanopsia ('pie in the sky'). Parietal lobe lesions cause inferior quadrantanopsia."
    difficulty: hard
    tags: [neurology, neuro-ophthalmology, visual fields, Meyers loop, quadrantanopsia]
  - front: "How does a frontal eye field (FEF) lesion vs. FEF seizure affect gaze deviation?"
    back: "FEF lesion (stroke/tumour): eye deviation TOWARD the side of lesion. FEF seizure (overactivation): eye deviation AWAY from the side of overactivation.\n\nThe frontal eye field normally drives gaze contralaterally. A destructive lesion removes this drive, so the contralateral FEF drives gaze toward the side of the lesion. During a seizure, the FEF is overactivated and drives gaze to the contralateral side (away from the seizure focus). Similarly, PPRF lesions cause eye deviation away from the side of the lesion."
    difficulty: hard
    tags: [neurology, neuro-ophthalmology, eye deviation, frontal eye field, seizure]
  - front: "What is internuclear ophthalmoplegia (INO) and what causes it?"
    back: "INO is caused by a lesion of the medial longitudinal fasciculus (MLF). It presents with: adduction deficit in the eye ipsilateral to the lesion, and abducting nystagmus in the contralateral eye, with preserved convergence. Causes: demyelination (MS, most common), brainstem infarction/mass.\n\nThe MLF connects the abducens nucleus in the pons to the contralateral medial rectus subnucleus of CN III. A MLF lesion impairs the horizontal gaze pathway. Since convergence is independent of the horizontal gaze pathway, preserved convergence helps distinguish INO from CN III palsy. INO can be bilateral, especially in MS."
    difficulty: hard
    tags: [neurology, eye movement, INO, MLF, MS, diplopia]
  - front: "How do you differentiate monocular from binocular diplopia and what does each imply?"
    back: "Monocular: diplopia remains when the unaffected eye is closed — implies optical problem (refractive error, cataract, corneal abnormality, dry eye) or functional. Binocular: diplopia disappears when either eye is closed — implies ocular misalignment from muscle, neuromuscular junction (MG, LEMS), or nerve/brain pathology.\n\nThis distinction is the first step in evaluating diplopia. Binocular diplopia is the neurologically significant form and requires systematic assessment of which CN or muscle is involved, based on the direction of diplopia (vertical, horizontal, oblique) and the direction of gaze that worsens it."
    difficulty: medium
    tags: [neurology, diplopia, eye movement disorders]
  - front: "What are the distinguishing features of peripheral vs. central nystagmus?"
    back: "Peripheral (vestibular): horizontal + torsional, unidirectional, fast phase away from lesion, gaze fixation DECREASES nystagmus, severe vertigo, auditory symptoms common, adapts within days. Central (brainstem/cerebellum): may be purely vertical/horizontal/torsional, bidirectional/multidirectional, gaze fixation has NO effect, mild vertigo, other neurological signs common, persists.\n\nThe most clinically useful differentiating feature is that gaze fixation suppresses peripheral nystagmus (tested by removing visual fixation with Frenzel goggles). Pure vertical nystagmus is always central. Central nystagmus requires urgent neuroimaging. Causes of peripheral: BPPV, vestibular neuritis, Ménière's disease."
    difficulty: hard
    tags: [neurology, nystagmus, vestibular, cerebellar, BPPV]
  - front: "What neurological condition is nitrous oxide misuse associated with, and by what mechanism?"
    back: "Nitrous oxide misuse causes functional vitamin B12 deficiency (inactivates cobalamin), leading to subacute combined degeneration — myeloneuropathy with dorsal and lateral column involvement.\n\nNitrous oxide irreversibly oxidizes vitamin B12 (cobalamin), rendering it unable to act as a cofactor for methionine synthase. This is clinically important in recreational nitrous oxide users. Serum B12 may appear normal despite functional deficiency; methylmalonic acid and homocysteine levels are more reliable."
    difficulty: hard
    tags: [neurology, nutritional deficiency, nitrous oxide, vitamin B12, myelopathy]
  - front: "What are the classic manifestations of Wernicke-Korsakoff syndrome (thiamine/B1 deficiency)?"
    back: "Wernicke's encephalopathy triad: ophthalmoplegia (eye movement abnormalities), ataxia, confusion. Korsakoff syndrome: anterograde > retrograde amnesia with confabulation. Caused by thiamine (vitamin B1) deficiency, classically in chronic alcohol use.\n\nWernicke's encephalopathy is a medical emergency. If suspected: thiamine 500 mg IV TID for 2 days, then 250 mg IV/IM for 2 days before any glucose administration. Standard treatment for thiamine deficiency: 200 mg IV TID until nutritional status is stable. Korsakoff syndrome represents irreversible neuronal damage from chronic thiamine deficiency."
    difficulty: medium
    tags: [neurology, nutritional deficiency, thiamine, Wernicke-Korsakoff, alcohol]
  - front: "What are the neurological effects of copper deficiency and what is a common cause?"
    back: "Copper deficiency causes myelopathy, myeloneuropathy, sensory ataxia, and spastic gait (similar to B12 deficiency). A common cause is excessive zinc supplementation (zinc competitively inhibits copper absorption). Treatment: discontinue zinc; supplement copper.\n\nCopper deficiency myelopathy mimics subacute combined degeneration of B12 deficiency. Investigation includes serum copper, ceruloplasmin, urinary copper, MRI spine, and EMG/NCS. Bariatric surgery (malabsorptive) is another important cause of copper (and B12) deficiency."
    difficulty: hard
    tags: [neurology, nutritional deficiency, copper, myelopathy, bariatric surgery]
  - front: "What are the neurological features of pellagra (niacin/B3 deficiency)?"
    back: "Pellagra: encephalopathy, dementia, and peripheral neuropathy. The classic mnemonic: 3 Ds — Dermatitis, Diarrhea, Dementia.\n\nPellagra is niacin (vitamin B3) deficiency. Neurological manifestations include cognitive impairment (encephalopathy, dementia) and peripheral neuropathy. Investigation: urinary nicotinamide mononucleotide (NMN) and nuclear matrix protein (NMP) tests, niacin index. Treatment: nicotinic acid 25-50 mg PO/IM daily (watch for niacin flush)."
    difficulty: medium
    tags: [neurology, nutritional deficiency, niacin, pellagra]
  - front: "What occupational neurotoxin is associated with parkinsonism (manganism), and what psychiatric features precede it?"
    back: "Manganese. Psychiatric symptoms and hallucinations ('manganese madness') precede extrapyramidal features, headache, dystonia, and parkinsonism (manganism). Associated with battery/metal production, welding, alloy work.\n\nManganese toxicity primarily affects the basal ganglia, particularly the globus pallidus, causing a parkinsonism that may be clinically indistinguishable from PD but does not respond well to levodopa. Pesticide exposure is also associated with increased PD risk."
    difficulty: hard
    tags: [neurology, neurotoxicology, manganese, parkinsonism, occupational]
  - front: "What neurological findings are caused by lead toxicity?"
    back: "Headache, difficulty concentrating, short-term memory deficits, delayed development and permanent learning disabilities (children), peripheral neuropathy (commonly radial neuropathy causing wrist drop), seizures, coma, delirium, death from encephalopathy (rare).\n\nLead causes a predominantly motor peripheral neuropathy preferentially affecting the radial nerve (wrist drop). Children are more vulnerable to neurodevelopmental toxicity. Sources include battery/metal production, solder, pipes, and paint."
    difficulty: medium
    tags: [neurology, neurotoxicology, lead, peripheral neuropathy, wrist drop]
  - front: "Define seizure and epilepsy, and what are the diagnostic criteria for epilepsy?"
    back: "Seizure: transient signs/symptoms due to abnormal hyper-synchronization of neurons. Epilepsy: enduring predisposition to generate epileptic seizures. Diagnosis requires: 1) ≥2 unprovoked seizures >24h apart, OR 2) one unprovoked seizure with ≥60% recurrence risk (based on EEG/imaging), OR 3) diagnosis of an epilepsy syndrome.\n\nProvoked seizures (due to acute brain insults: metabolic, toxic, febrile) do not constitute epilepsy. Etiologies of epilepsy include genetic, structural, autoimmune, metabolic, infectious, and unknown. The most common cause of late-onset (>50 yr) seizures is stroke, accounting for 50-80% of cases."
    difficulty: medium
    tags: [neurology, epilepsy, seizure, definition]
  - front: "What are the features of absence seizures (petit mal) and what is the classic EEG finding?"
    back: "Absence seizures: brief unresponsiveness for 5-10 seconds with arrest of activity, staring, blinking or eye-rolling; NO post-ictal confusion; usually in children. EEG: 3 Hz spike and slow wave activity. Drug of choice: ethosuximide.\n\nAbsence seizures can be mistaken for daydreaming. The lack of post-ictal confusion distinguishes them from complex partial seizures. Generalized absence seizures can occur dozens of times per day. Ethosuximide is first-line, with valproate as an alternative (noting safety profile concerns in women of childbearing age)."
    difficulty: medium
    tags: [neurology, epilepsy, absence seizure, petit mal, EEG]
  - front: "What are the phases of a tonic-clonic (grand mal) seizure?"
    back: "1. Prodrome: unease/irritability hours to days before. 2. Tonic phase: muscle rigidity. 3. Clonic phase: repetitive violent jerking of face/limbs, tongue biting, cyanosis, frothing, incontinence. 4. Post-ictal phase: flaccid limbs, extensor plantar reflexes, headache, confusion, aching muscles, amnesia, elevated CK — may have focal paralysis (Todd's paralysis), lasting hours.\n\nTodd's paralysis is a transient post-ictal focal neurological deficit (typically hemiparesis) lasting minutes to hours, reflecting post-ictal cortical depression. It is important to recognize as it mimics stroke — a careful history of the preceding seizure is essential."
    difficulty: medium
    tags: [neurology, epilepsy, tonic-clonic seizure, Todds paralysis, post-ictal]
  - front: "What are the features of a temporal lobe (complex partial) seizure?"
    back: "Focal impaired awareness with automatisms (chewing, swallowing, lip-smacking, scratching, fumbling, running, disrobing). Aura may include fear, olfactory or gustatory hallucinations, visceral sensations, or déjà vu. May secondarily generalize.\n\nTemporal lobe seizures are the most common focal seizures in adults. Automatisms are stereotyped, repetitive, purposeless movements. The aura (if present) represents simple partial seizure activity before impaired awareness begins. Temporal lobe epilepsy is often amenable to surgical resection if refractory."
    difficulty: medium
    tags: [neurology, epilepsy, temporal lobe seizure, complex partial, automatisms]
  - front: "How do you differentiate seizure, syncope, and functional (pseudoseizure) on clinical grounds?"
    back: "Seizure: sudden onset in any position (including sleep), aura possible, brief or prolonged, lateral tongue biting, post-ictal confusion/Todd's paresis/aphasia, incontinence common, synchronous stereotypic movements. Syncope: gradual onset, upright position, lightheadedness/pallor/diaphoresis, brief, no post-ictal, brief tonic stiffening possible. Pseudoseizure: provoked by emotional disturbance/suggestion, prolonged, variable, tip tongue biting, opisthotonos, pelvic thrust, crying.\n\nEEG is usually abnormal in seizures (interictal or ictal discharges) and normal in syncope and pseudoseizures. Lateral tongue biting is highly specific for seizure, while tip tongue biting may occur in pseudoseizures. Pseudoseizures do not rule out coexisting epilepsy."
    difficulty: hard
    tags: [neurology, epilepsy, seizure, syncope, functional seizure, pseudoseizure]
  - front: "What are EEG findings suggestive of predisposition to epilepsy?"
    back: "Spike and wave discharges, polyspike and wave discharges, and spike wave complex discharges.\n\nEEG has a sensitivity of 17% after a first seizure, increasing to 51% with a sleep-deprived EEG. EEG is specific (95%) but not sensitive; a normal EEG does not rule out epilepsy. If the first routine EEG is normal, a sleep-deprived EEG should be considered. EEG guides treatment decisions (indications for anti-seizure medication)."
    difficulty: medium
    tags: [neurology, epilepsy, EEG, investigations]
  - front: "What are the indications for initiating anti-seizure medication (ASM) after a first seizure?"
    back: "EEG with epileptiform activity, prior brain injury (organic brain disease, prior head injury, CNS infection), abnormal neurological exam or neuroimaging, nocturnal seizure, and recurrent unprovoked seizure.\n\nNot every first seizure requires ASM. The decision is based on risk of recurrence. If recurrence risk is ≥60%, ASM is indicated. The presence of structural brain pathology or epileptiform EEG significantly increases recurrence risk and generally warrants treatment."
    difficulty: medium
    tags: [neurology, epilepsy, anti-seizure medication, ASM, treatment]
  - front: "Which anti-seizure medications are used for primarily focal seizures (with or without secondary generalization) but should NOT be used for generalized seizures?"
    back: "Carbamazepine (Tegretol), phenytoin (Dilantin), gabapentin, lacosamide, oxcarbazepine, eslicarbazepine, pregabalin, tiagabine, vigabatrin, cenobamate.\n\nThese sodium channel blockers and GABA modulators can worsen certain generalized epilepsies (especially absence and myoclonic seizures). Valproate and lamotrigine are broad-spectrum and effective for both focal and generalized seizures. Ethosuximide is specific to absence seizures."
    difficulty: hard
    tags: [neurology, epilepsy, anti-seizure medication, carbamazepine, phenytoin, focal seizure]
  - front: "What is the first-line drug for generalized tonic-clonic seizures in Canada, and what alternatives exist?"
    back: "Valproate (sodium valproate/Depakene) remains the preferred first-line treatment for generalized tonic-clonic seizures. Lamotrigine and levetiracetam are suitable alternatives, especially considering safety profiles for those of childbearing potential.\n\nValproate is highly effective for generalized seizures but has significant teratogenicity (neural tube defects, fetal valproate syndrome). In women of childbearing age, lamotrigine or levetiracetam are preferred alternatives. This reflects Canadian and ILAE guidelines balancing efficacy and tolerability."
    difficulty: medium
    tags: [neurology, epilepsy, valproate, generalized seizure, anti-seizure medication]
  - front: "What are the driving regulations for patients with seizures in Canada?"
    back: "By law, the Ministry of Transportation in most provinces must be contacted for all patients who have had a seizure. Patients will have their license suspended until seizure-free for 6 months. Commercial drivers face a longer waiting period.\n\nPhysicians have a duty to report seizures to the Ministry of Transportation in most Canadian provinces. This is a mandatory safety regulation regardless of patient consent. Counseling patients about driving restrictions, operating heavy machinery, bathing alone, and swimming is an essential part of seizure management."
    difficulty: medium
    tags: [neurology, epilepsy, driving, duty to report, Canadian regulations]
  - front: "Define status epilepticus. What are its major complications?"
    back: "Status epilepticus: seizure lasting ≥5 minutes OR two seizures without return to neurological baseline between them. Complications: hypoxia/anoxia, cerebral ischemia, MI, cerebral edema, arrhythmia/cardiac arrest, rhabdomyolysis (→acute kidney injury), aspiration pneumonitis/pneumonia.\n\nStatus epilepticus is a medical emergency that can cause irreversible brain damage without prompt treatment. The most common causes include anti-seizure medication non-compliance, remote symptomatic causes (prior brain injury), and stroke. Despite being a common seizure trigger, EtOH withdrawal is a rare cause of status epilepticus."
    difficulty: medium
    tags: [neurology, epilepsy, status epilepticus, emergency]
  - front: "What is the initial management of status epilepticus?"
    back: "1. ABCs, vitals, monitors, lateral decubitus position, 100% O2 via non-rebreather, 2 peripheral IVs, point-of-care glucose, IV fluids, ECG. 2. Blood work: CBC, electrolytes, Ca, Mg, PO4, glucose, ABG/VBG, toxicology, ASM levels. 3. Treat specific causes: D50 for hypoglycemia, IV thiamine for alcohol withdrawal, magnesium sulfate for eclampsia. 4. Anti-seizure medications (benzodiazepines first-line).\n\nImmediate glucose correction and thiamine administration (before glucose in suspected alcoholics to prevent precipitating Wernicke's) are critical. Consider non-convulsive status epilepticus in any patient with persistent decreased level of consciousness >20 minutes after a generalized seizure — requires EEG to diagnose."
    difficulty: hard
    tags: [neurology, epilepsy, status epilepticus, emergency management]
  - front: "What aura features are suggestive of a frontoparietal cortex seizure origin?"
    back: "Contralateral focal sensory or motor phenomena (e.g., focal paresthesias, jerking of a limb).\n\nThe primary sensory cortex (parietal) and motor cortex (frontal) are somatotopically organized. Focal seizures arising here produce contralateral sensory or motor symptoms that may spread along the body's map in a 'Jacksonian march,' spreading from one body part to adjacent ones as the seizure propagates."
    difficulty: medium
    tags: [neurology, epilepsy, focal seizure, aura, frontoparietal]
  - front: "What is a Jacksonian march and what does it indicate?"
    back: "Jacksonian march is the sequential spreading of clonic or sensory seizure activity to adjacent muscle groups (e.g., thumb → hand → arm → face), indicating a focal motor/sensory cortex seizure spreading across the motor homunculus.\n\nThe Jacksonian march reflects the organized somatotopic representation of the motor cortex. As epileptic activity spreads, successive body parts become involved in a predictable pattern. This is pathognomonic of a focal cortical seizure originating in the primary motor or sensory cortex."
    difficulty: medium
    tags: [neurology, epilepsy, focal seizure, Jacksonian march, motor cortex]
  - front: "What are the features of cavernous sinus syndrome affecting cranial nerves?"
    back: "Cavernous sinus lesions can cause palsies of CN III, IV, VI, V1, and V2, as well as orbital pain and proptosis. Causes include internal carotid artery aneurysm, meningioma, and sinus thrombosis.\n\nThe cavernous sinus contains CN III, IV, VI, V1, V2 and the internal carotid artery (with its sympathetic plexus). Horner syndrome (ptosis, miosis, anhidrosis) may also occur from sympathetic involvement. Multiple cranial nerve palsies should always raise suspicion for cavernous sinus pathology."
    difficulty: hard
    tags: [neurology, cranial nerves, cavernous sinus, multiple cranial nerve palsy]
  - front: "What is the ILAE 2017 seizure classification system's primary division?"
    back: "Seizures are classified by onset as: 1) Focal onset (with or without impaired awareness), 2) Generalized onset (motor or nonmotor), 3) Unknown onset. Focal onset seizures can secondarily spread to become focal to bilateral tonic-clonic (previously called secondary generalization).\n\nThe ILAE 2017 classification replaced older terms: 'simple partial' → focal aware; 'complex partial' → focal impaired awareness; 'secondary generalization' → focal to bilateral tonic-clonic. This standardized terminology improves communication and guides treatment selection."
    difficulty: medium
    tags: [neurology, epilepsy, ILAE, seizure classification]
  - front: "What is the neurological significance of pyridoxine (vitamin B6) deficiency in infants?"
    back: "Pyridoxine deficiency in infants causes intractable epilepsy (pyridoxine-dependent epilepsy), which responds specifically to pyridoxine supplementation. In adults: painful sensorimotor peripheral neuropathy and confusion.\n\nPyridoxine is a cofactor for glutamic acid decarboxylase (GAD), which synthesizes GABA. Deficiency reduces GABA levels, lowering the seizure threshold. Pyridoxine-dependent epilepsy is a rare but treatable cause of refractory neonatal/infantile seizures. Investigation: serum pyridoxal phosphate, EMG/NCS, EEG in infants."
    difficulty: hard
    tags: [neurology, nutritional deficiency, pyridoxine, vitamin B6, epilepsy]
  - front: "What is the neurological screening approach for patients with suspected aspiration from CN X dysfunction?"
    back: "Observe the patient drinking water from a cup, watching for coughing, choking, or 'wetness' of voice (wet dysphonia). The gag reflex alone is insufficient to screen for aspiration risk.\n\nA preserved gag reflex does not guarantee safe swallowing. The water swallow test is a validated, simple bedside tool to identify patients at risk for aspiration. Patients with positive screen should be referred for formal videofluoroscopic swallowing study (modified barium swallow) by speech-language pathology."
    difficulty: medium
    tags: [neurology, cranial nerves, CN X, dysphagia, aspiration screening]
  - front: "What is the first-line abortive treatment for status epilepticus and what is the dose?"
    back: "Benzodiazepines are first-line: lorazepam 4 mg IV (0.1 mg/kg) at 2 mg/min, repeat every 3 minutes; OR midazolam 10 mg IM/IN.\n\nEarly benzodiazepine administration is critical to terminate seizure activity. Lorazepam is preferred IV; midazolam IM/IN is used when IV access is unavailable. Both are GABA-A receptor agonists that rapidly suppress seizure activity."
    difficulty: easy
    tags: [neurology, status-epilepticus, benzodiazepines, emergency]
  - front: "What maintenance antiseizure medications are used in status epilepticus after benzodiazepines fail to terminate seizures?"
    back: "Phenytoin 20 mg/kg IV (or fosphenytoin 1000–1500 mg IV at 150 mg/min), valproic acid 40 mg/kg IV, or levetiracetam 60 mg/kg IV.\n\nAfter initial benzodiazepines, a second-line agent is needed to prevent seizure recurrence. Fosphenytoin is preferred over phenytoin for faster and safer IV administration. Valproic acid and levetiracetam are alternatives, especially when phenytoin is contraindicated."
    difficulty: medium
    tags: [neurology, status-epilepticus, antiseizure-medications, phenytoin, levetiracetam]
  - front: "What is the third-line treatment for refractory status epilepticus?"
    back: "Continuous IV infusion of midazolam, propofol, or pentobarbital with EEG monitoring targeting burst suppression pattern in an ICU setting.\n\nRefractory status epilepticus requires aggressive ICU management. Continuous infusions of anesthetic agents are titrated to burst suppression on EEG to completely suppress electrical seizure activity. Ketamine is an additional option."
    difficulty: medium
    tags: [neurology, status-epilepticus, refractory, ICU, propofol]
  - front: "What folic acid dose is recommended for women with epilepsy planning pregnancy who are on antiseizure medications (ASMs)?"
    back: "4 mg/day of folic acid (higher than the standard 0.4 mg/day recommended for the general population).\n\nASMs, especially valproic acid and multi-drug regimens, are associated with a 2x increased risk of fetal malformations including neural tube defects. High-dose folic acid (4 mg/day) supplementation is recommended preconceptionally to reduce this risk."
    difficulty: medium
    tags: [neurology, epilepsy, pregnancy, folic-acid, teratogenicity]
  - front: "Which antiseizure medication carries the highest teratogenic risk during pregnancy?"
    back: "Valproic acid has the highest teratogenic risk, especially when combined with two or more concurrent ASMs.\n\nValproic acid is associated with the highest rate of major congenital malformations among ASMs, including neural tube defects, cardiac defects, cleft palate, and urogenital abnormalities. The risk increases with polytherapy. Monotherapy at the lowest effective dose is preferred."
    difficulty: easy
    tags: [neurology, epilepsy, valproic-acid, teratogenicity, pregnancy]
  - front: "What are the four features of the Confusion Assessment Method (CAM) used to diagnose delirium?"
    back: "Feature 1: Acute onset and fluctuating course. Feature 2: Inattention. Feature 3: Disorganized thinking. Feature 4: Altered level of consciousness. Diagnosis requires features 1 AND 2, plus either 3 OR 4.\n\nThe CAM is the standard validated tool for diagnosing delirium. Its key distinguishing features from dementia are the acute onset, fluctuating course, and inattention. Delirium carries significant morbidity and mortality and should be recognized promptly."
    difficulty: easy
    tags: [neurology, delirium, confusion-assessment-method, geriatrics]
  - front: "What clinical triad is associated with Neuroleptic Malignant Syndrome (NMS)?"
    back: "Muscle rigidity, hyperthermia, and autonomic instability in the context of antipsychotic medication use.\n\nNMS is a life-threatening reaction to antipsychotics (dopamine antagonists). The classic triad is: (1) severe muscle rigidity, (2) hyperthermia, and (3) autonomic instability. Lab findings include elevated CK, leukocytosis, and elevated LFTs. Treatment includes stopping the offending agent, supportive care, dantrolene, and bromocriptine."
    difficulty: easy
    tags: [neurology, NMS, antipsychotics, emergency]
  - front: "What are the diagnostic criteria for Mild Neurocognitive Disorder (Mild Cognitive Impairment)?"
    back: "1) Change in cognition; 2) Impairment in one or more cognitive domains (amnestic or non-amnestic); 3) Preservation of independence in ADLs/IADLs (minimal impairment); 4) Not meeting criteria for major NCD; 5) No other reversible/identifiable cause.\n\nMild NCD represents a transitional state between normal aging and major dementia. Amnestic subtype is the most common and most strongly associated with Alzheimer's pathology. Annual follow-up is recommended; those with mild NCD have a relative risk 3.3x higher for developing major NCD over 2-5 years."
    difficulty: medium
    tags: [neurology, mild-cognitive-impairment, dementia, NCD]
  - front: "What is the prevalence of depression in patients with Mild Cognitive Impairment (MCI)?"
    back: "Pooled prevalence is approximately 32% (95% CI 27–37%); higher in clinic-based populations (40%) than community-based populations (25%).\n\nDepression is the most common neuropsychiatric symptom in mild NCD, affecting up to 50% in some series. Recognizing and treating depression is important as it may be a modifiable risk factor for progression to major dementia and significantly affects quality of life."
    difficulty: medium
    tags: [neurology, mild-cognitive-impairment, depression, neuropsychiatric]
  - front: "What cognitive screening tools are used for neurocognitive disorder, and which is more sensitive for early changes?"
    back: "MMSE (sensitivity 87%, specificity 82%) and MoCA (sensitivity 85%, specificity 82%). MoCA is more sensitive for early cognitive change and mild NCD.\n\nBoth the MMSE and MoCA are validated screening tools, but MoCA detects earlier and more subtle cognitive changes. Neither should be used in isolation; they must be combined with history, neurological exam, and neuropsychological testing. Clock drawing and frontal lobe testing (go/no-go, word lists) add additional information."
    difficulty: easy
    tags: [neurology, dementia, MoCA, MMSE, cognitive-screening]
  - front: "What are the reversible causes of major neurocognitive disorder (dementia) that must be ruled out?"
    back: "EtOH (intoxication/withdrawal, Wernicke's), medications (benzodiazepines, anticholinergics), heavy metal toxicity, hepatic/renal failure, vitamin B12 deficiency, hypo/hyperglycemia, cortisol abnormality, thyroid dysfunction, NPH, depression (pseudodementia), intracranial tumour, subdural hematoma, and hypercalcemia.\n\nUp to 10-15% of dementias have potentially reversible causes. Initial workup includes CBC, TSH, vitamin B12, glucose, electrolytes, LFTs, renal function, lipids, and calcium. CT head rules out structural lesions. Treating reversible causes can prevent or partially reverse cognitive decline."
    difficulty: medium
    tags: [neurology, dementia, reversible-causes, workup]
  - front: "What are the 'geriatric giants' that should be assessed in the history of a patient with suspected major NCD?"
    back: "Confusion, incontinence, and falls (the 3 classic geriatric giants associated with cognitive decline).\n\nThe geriatric giants represent common presentations of underlying disease in older adults. In the context of NCD, all three may reflect functional decline. Safety assessment (wandering, driving, stove use) and evaluation of ADLs/IADLs are essential components of the clinical encounter."
    difficulty: easy
    tags: [neurology, dementia, geriatrics, clinical-assessment]
  - front: "What are the key clinical features distinguishing Alzheimer's disease (AD) from normal aging?"
    back: "AD: Forgetting names of close relations, repeating phrases/stories in the same conversation, increased frequency of forgetting, unpredictable mood changes, decreased interest in activities. Normal aging: Forgetting acquaintances' names, briefly forgetting part of an experience, not putting things away properly, mood changes in response to appropriate causes, changes in usual interests.\n\nDistinguishing pathological cognitive decline from normal aging is clinically important. The key features in AD are the severity of memory impairment, its impact on daily functioning, and the presence of behavioral/psychiatric changes. Importantly, social cognition is relatively preserved until late in the course of AD."
    difficulty: medium
    tags: [neurology, Alzheimer, normal-aging, differential-diagnosis]
  - front: "What is the most common cause of dementia and what percentage of cases does it account for?"
    back: "Alzheimer's disease (AD), accounting for 60–90% of all dementias depending on setting and diagnostic criteria.\n\nAD is by far the most prevalent dementia. Its prevalence increases dramatically with age: 1/12 of the population aged 65–75 and up to 1/3 of those over 85 are affected. The second most common cause is vascular NCD. FTD is the 4th most common and accounts for 5% of cases."
    difficulty: easy
    tags: [neurology, Alzheimer, dementia, epidemiology]
  - front: "What are the three genes associated with autosomal dominant early-onset Alzheimer's disease?"
    back: "1) Amyloid precursor protein (APP) gene on chromosome 21; 2) Presenilin 1 (PSEN1) on chromosome 14; 3) Presenilin 2 (PSEN2) on chromosome 1. Together they account for 5–10% of early-onset AD cases.\n\nFamilial AD is rare (<1% of all AD) but important to identify for genetic counseling. Autosomal dominant mutations in these three genes cause early-onset AD (before age 65). Note that Down syndrome (trisomy 21) also predisposes to early AD due to three copies of the APP gene."
    difficulty: hard
    tags: [neurology, Alzheimer, genetics, early-onset, PSEN1]
  - front: "What is the role of APOE ε4 in Alzheimer's disease?"
    back: "APOE ε4 is a susceptibility genotype that increases risk and decreases age of onset of AD. It is neither necessary nor sufficient for disease occurrence and cannot serve as a diagnostic marker. APOE ε2 is protective.\n\nAPOE ε4 is the most common genetic risk factor for sporadic late-onset AD. However, many people with ε4 do not develop AD, and many AD patients do not carry ε4. Therefore, APOE genotyping is not recommended as a routine diagnostic test but is used in research settings."
    difficulty: medium
    tags: [neurology, Alzheimer, APOE, genetics, risk-factors]
  - front: "What are the four classic microscopic pathological findings in Alzheimer's disease?"
    back: "1) Senile β-amyloid plaques (extracellular deposits in grey matter); 2) Neurofibrillary tangles (intracytoplasmic hyperphosphorylated tau protein); 3) Loss of synapses; 4) Loss of cholinergic neurons in the nucleus basalis of Meynert.\n\nThe amyloid cascade hypothesis proposes that abnormal aggregation of β-amyloid triggers downstream tau pathology and neuronal death. Loss of cholinergic neurons from the nucleus basalis of Meynert accounts for the 50–90% reduction in choline acetyltransferase activity and forms the basis for cholinesterase inhibitor therapy."
    difficulty: medium
    tags: [neurology, Alzheimer, pathology, amyloid, tau, cholinergic]
  - front: "What imaging findings are characteristic of Alzheimer's disease on MRI and SPECT?"
    back: "MRI: preferential atrophy of hippocampi and precuneus of the parietal lobe, dilated lateral ventricles, widened cortical sulci. SPECT: hypoperfusion in temporal and parietal lobes.\n\nNeuroimaging in AD cannot confirm the diagnosis but supports it by demonstrating characteristic atrophy patterns. PET with Pittsburgh compound B (PIB) can image β-amyloid plaques, and FDG-PET shows regional cortical hypometabolism, particularly helpful to distinguish AD from FTD and DLB."
    difficulty: medium
    tags: [neurology, Alzheimer, MRI, SPECT, neuroimaging]
  - front: "What pharmacological treatments are available for Alzheimer's disease and what are their indications?"
    back: "1) Acetylcholinesterase inhibitors (donepezil, rivastigmine, galantamine) — for mild to severe AD; 2) Memantine (NMDA antagonist) — moderate-to-severe AD (MMSE <17); 3) Combination therapy (AChEI + memantine) — most effective for reducing morbidity; 4) Lecanemab (anti-β-amyloid monoclonal antibody) — for early AD.\n\nAChEIs do not prolong life but reduce morbidity. Key contraindications include bradycardia, heart block, CHF, asthma/COPD, and peptic ulcer disease. Galantamine is contraindicated in hepatic/renal impairment. Lecanemab represents a newer disease-modifying approach targeting aggregated β-amyloid."
    difficulty: medium
    tags: [neurology, Alzheimer, treatment, donepezil, memantine, lecanemab]
  - front: "What are the four core diagnostic features of Dementia with Lewy Bodies (DLB)?"
    back: "1) Fluctuating cognition with pronounced variations in attention and alertness; 2) Recurrent well-formed, detailed visual hallucinations; 3) ≥1 feature of parkinsonism (bradykinesia, rest tremor, or rigidity) with onset AFTER cognitive decline; 4) REM sleep behaviour disorder.\n\nProbable DLB requires ≥2 core features; possible DLB requires ≥1 core feature. The sequence of symptoms is important: in DLB, parkinsonism occurs AFTER cognitive decline (opposite of Parkinson's disease dementia, where cognitive decline occurs ≥1 year after motor symptoms). Severe neuroleptic sensitivity is a critical distinguishing feature and a safety concern."
    difficulty: medium
    tags: [neurology, DLB, Lewy-bodies, dementia, diagnosis]
  - front: "Why are neuroleptics dangerous in Dementia with Lewy Bodies (DLB)?"
    back: "Patients with DLB have severe sensitivity to neuroleptic medications, which can cause severe rigidity, neuroleptic malignant syndrome, and worsened extrapyramidal symptoms, leading to significant morbidity and mortality.\n\nNeuroleptic sensitivity in DLB is thought to be due to profound dopaminergic depletion. Even low doses of typical or atypical antipsychotics can precipitate life-threatening reactions. This is a critical prescribing consideration. If behavioral symptoms require treatment, acetylcholinesterase inhibitors or very cautious use of quetiapine may be considered."
    difficulty: medium
    tags: [neurology, DLB, neuroleptics, drug-safety, Lewy-bodies]
  - front: "What SPECT/PET finding is indicative (most diagnostic) of Dementia with Lewy Bodies?"
    back: "Low striatal dopamine transporter (DAT) uptake on SPECT/PET imaging.\n\nDAT imaging (DaTSCAN) demonstrates reduced dopaminergic activity in the striatum, reflecting degeneration of the nigrostriatal pathway. This finding can help distinguish DLB from AD and other dementias. Supportive SPECT/PET findings include generalized low uptake with occipital predominance."
    difficulty: hard
    tags: [neurology, DLB, SPECT, dopamine-transporter, neuroimaging]
  - front: "What is the treatment for REM sleep behaviour disorder in Dementia with Lewy Bodies?"
    back: "Melatonin (first-line) or clonazepam (use with caution in patients with cognitive impairment and gait disorders).\n\nREM sleep behaviour disorder (RBD) is a core feature of DLB where patients act out dreams due to loss of normal REM atonia. Melatonin is preferred due to its favorable safety profile. Clonazepam is effective but carries risks of falls, sedation, and cognitive worsening in this population."
    difficulty: medium
    tags: [neurology, DLB, REM-sleep, melatonin, clonazepam]
  - front: "What are the five core symptoms required for behavioural variant Frontotemporal Dementia (bvFTD) diagnosis (at least 3 of 5 must be present)?"
    back: "1) Behavioural disinhibition (socially inappropriate/impulsive); 2) Apathy or inertia; 3) Loss of sympathy or empathy; 4) Perseverative, stereotyped, or compulsive/ritualistic behaviour; 5) Hyperorality and dietary changes (binge eating, increased EtOH/cigarettes, or eating inedible objects).\n\nbvFTD is the most common variant of FTD and typically presents early (within the first 3 years). Memory is relatively spared early, distinguishing it from AD. It reflects progressive frontal lobe degeneration. Genetic variants include MAPT (tau), PGRN, and C9ORF72 genes. Median survival is 6–11 years from symptom onset."
    difficulty: medium
    tags: [neurology, FTD, behavioural-variant, frontotemporal-dementia, diagnosis]
  - front: "What are the three subtypes of Primary Progressive Aphasia (PPA) in frontotemporal dementia?"
    back: "1) Nonfluent/agrammatic PPA (NFAV-PPA): non-fluent, laboured speech, anomia, preserved single-word comprehension, impaired repetition. 2) Semantic variant PPA (SV-PPA): fluent, anomia, impaired single-word comprehension, intact repetition, uses generalizations. 3) Logopenic progressive aphasia (LPA): naming difficulty and impaired repetition.\n\nPPA is defined by prominent language decline as the initial presenting feature. Distinguishing the three subtypes requires detailed language assessment. SV-PPA is particularly recognized by the inability to understand word meaning (e.g., using 'animal' for 'dog'). LPA is most often associated with underlying AD pathology."
    difficulty: hard
    tags: [neurology, PPA, FTD, aphasia, language]
  - front: "What is vascular neurocognitive disorder (vascular NCD) and what is its neuroimaging definition?"
    back: "Vascular NCD is cognitive impairment due to cerebrovascular disease (CVD) as the dominant pathology. Neuroimaging criteria include: ≥1 large vessel infarct or hemorrhage, a strategically placed single infarct (angular gyrus, thalamus, basal forebrain), ≥2 lacunar infarcts outside brainstem, or extensive confluent white matter lesions.\n\nVascular NCD is the second most common cause of dementia. Unlike AD, it characteristically affects complex attention and frontal-executive function. Classic teaching describes stepwise deterioration, but progressive decline is actually most common. Risk factor optimization (HTN, DM, dyslipidemia, smoking) is the cornerstone of management."
    difficulty: medium
    tags: [neurology, vascular-dementia, NCD, CVD, neuroimaging]
  - front: "What are the cognitive domains primarily affected in vascular neurocognitive disorder, and how does this differ from Alzheimer's disease?"
    back: "Vascular NCD predominantly affects complex attention (processing speed) and frontal-executive function. In contrast, AD typically affects episodic memory first, with later involvement of language and visuospatial function.\n\nThe predominant frontal-executive and attention deficits in vascular NCD reflect disruption of cortical-subcortical circuits by white matter lesions and lacunar infarcts. This pattern is sometimes called 'bradyphrenia' or subcortical dementia. Associated features include personality/mood changes, abulia, emotional lability, and psychomotor slowing."
    difficulty: medium
    tags: [neurology, vascular-dementia, Alzheimer, executive-function, differential-diagnosis]
  - front: "What are the key clinical features, investigations, and prognosis of Creutzfeldt-Jakob Disease (CJD)?"
    back: "Features: rapidly progressive cognitive impairment, myoclonus, ataxia, akinetic mutism, parkinsonism. Investigations: MRI (cortical ribbon sign, hockey stick sign on FLAIR), EEG (periodic complexes), CSF analysis, real-time quaking-induced conversion test; definitive diagnosis by brain biopsy. Most cases are sporadic (85%). No cure exists — only symptomatic management.\n\nCJD is a fatal prion disease caused by misfolded prion proteins converting from α-helix (normal) to β-pleated sheet (abnormal), leading to aggregation and neuronal loss with spongiform changes. It is the most common cause of rapidly progressive dementia alongside FTD, diffuse Lewy body disease, and tauopathies."
    difficulty: hard
    tags: [neurology, CJD, prion, rapidly-progressive-dementia]
  - front: "What are the language areas of the brain and their functions?"
    back: "Broca's area (posterior inferior frontal lobe): language production (expressive). Wernicke's area (posterior superior temporal lobe): language comprehension (receptive). Angular gyrus: relays written visual stimuli to Wernicke's for reading. Arcuate fasciculus: connects Wernicke's and Broca's areas.\n\nUnderstanding the neural architecture of language is essential for localizing aphasia lesions. >99% of right-handed people have left hemisphere language dominance; 70% of left-handed people also have left hemisphere dominance. Aphasia localizes the lesion to the dominant cerebral hemisphere."
    difficulty: easy
    tags: [neurology, aphasia, neuroanatomy, Broca, Wernicke]
  - front: "A patient has non-fluent speech, poor comprehension, and poor repetition. What type of aphasia is this and where is the lesion?"
    back: "Global aphasia. Lesion involves both the posterior inferior frontal lobe and posterior superior temporal lobe (combined Broca's and Wernicke's area), typically from a large MCA territory infarct.\n\nGlobal aphasia is the most severe form, with impairment in all language domains: fluency, comprehension, repetition, and naming. It results from extensive dominant hemisphere damage. In contrast, mixed transcortical aphasia (poor fluency, poor comprehension, but intact repetition) spares the perisylvian language core."
    difficulty: medium
    tags: [neurology, aphasia, global-aphasia, localization]
  - front: "A patient has fluent speech with poor comprehension but intact repetition. What type of aphasia is this?"
    back: "Sensory transcortical aphasia (STCA). Lesion is in the posterior superior temporal watershed region between MCA and PCA territories.\n\nTranscortical aphasias are typically associated with cerebral anoxia (e.g., post-MI, CO poisoning, hypotension). The hallmark of all transcortical aphasias is preserved repetition because the perisylvian language core (Broca's, Wernicke's, arcuate fasciculus) is intact, but the surrounding association cortex is damaged."
    difficulty: hard
    tags: [neurology, aphasia, transcortical-aphasia, localization]
  - front: "What is Conduction aphasia and what is the key distinguishing feature?"
    back: "Conduction aphasia: fluent speech, intact comprehension, but poor repetition. Lesion is in the arcuate fasciculus (the white matter tract connecting Wernicke's and Broca's areas).\n\nConduction aphasia results from disconnection between the comprehension and production areas while both remain intact. Patients can understand speech and produce fluent speech but cannot accurately repeat what is said to them. Phonemic paraphasias (substituting similar-sounding words) are characteristic."
    difficulty: medium
    tags: [neurology, aphasia, conduction-aphasia, arcuate-fasciculus]
  - front: "What is ideomotor apraxia, and what is the hemispheric localization?"
    back: "Ideomotor apraxia is the inability to perform skilled learned motor sequences (e.g., blowing out a match, combing one's hair) despite intact strength, sensation, and comprehension. It localizes to the left (dominant) hemisphere.\n\nApraxia is a higher-order motor disorder that cannot be explained by primary weakness, ataxia, sensory loss, or impaired comprehension. It reflects damage to praxis networks in the dominant hemisphere. Ideational apraxia (inability to sequence actions, e.g., mailing an envelope) involves both hemispheres."
    difficulty: medium
    tags: [neurology, apraxia, ideomotor, localization]
  - front: "What are the features of Gerstmann's syndrome and what lesion causes it?"
    back: "Gerstmann's syndrome: acalculia (inability to calculate), agraphia (inability to write), finger agnosia (inability to identify fingers), and left-right disorientation. Caused by lesions of the dominant (usually left) parietal lobe.\n\nGerstmann's syndrome is a classic localization finding. The four components may not all be present simultaneously. It is commonly tested because it localizes precisely to the dominant parietal lobe (specifically the angular gyrus region). In contrast, non-dominant parietal lobe lesions cause neglect, anosognosia, and asomatognosia."
    difficulty: medium
    tags: [neurology, Gerstmann, parietal-lobe, agnosia, localization]
  - front: "What are the findings associated with non-dominant parietal lobe lesions?"
    back: "Neglect (hemispatial neglect), anosognosia (unawareness of deficits), and asomatognosia (unawareness of one's own body parts). Also cortical sensory loss: impaired graphesthesia, astereognosis, and impaired 2-point discrimination.\n\nThe non-dominant (usually right) parietal lobe is critical for spatial awareness and body schema. Neglect is the failure to attend to stimuli on the contralateral side despite intact primary sensation. Anosognosia is particularly dangerous as patients may deny their hemiplegia, affecting rehabilitation compliance."
    difficulty: medium
    tags: [neurology, parietal-lobe, neglect, anosognosia, non-dominant]
  - front: "What is prosopagnosia and what is the localization of the lesion?"
    back: "Prosopagnosia is the inability to recognize familiar faces despite intact visual perception and intact auditory recognition. Lesion is in bilateral temporo-occipital areas or the right inferior temporo-occipital region.\n\nProsopagnosia is a specific form of visual associative agnosia affecting face recognition. Despite knowing a face is a face, patients cannot identify whose face it is. This condition is distinct from visual field defects or general agnosia. It most commonly results from bilateral or right fusiform gyrus lesions."
    difficulty: hard
    tags: [neurology, prosopagnosia, agnosia, temporal-occipital, localization]
  - front: "What are the diagnostic criteria and clinical features of mild Traumatic Brain Injury (concussion)?"
    back: "Mild TBI = concussion. Trauma-induced transient alteration in mental status: loss of consciousness <30 min, initial GCS 13–15, and post-traumatic amnesia <24 hours. Hallmark: confusion and amnesia. Physical symptoms include headache, sleep disturbance, nausea, blurred vision, photophobia, phonophobia, dizziness.\n\nConcussion is the most common form of TBI (75% of all TBIs). Highest-risk groups are children 0–4 yr, adolescents 15–19 yr, and elderly >65 yr. Cognitive symptoms include attentional impairment, slowed reaction time, and amnesia. The extent of retrograde amnesia correlates with injury severity (more retrograde amnesia = more recent memories affected)."
    difficulty: easy
    tags: [neurology, concussion, TBI, mild-TBI, diagnosis]
  - front: "What are the Canadian CT Head Rules indications for CT in mild TBI?"
    back: "CT head is indicated by the Canadian CT Head Rules (specific criteria include: GCS score <15 at 2h after injury, suspected open/depressed skull fracture, any sign of basal skull fracture, vomiting ≥2 episodes, age ≥65, amnesia before impact ≥30 min, dangerous mechanism). X-ray skull is NOT indicated.\n\nThe Canadian CT Head Rules are a validated, widely used clinical decision tool developed in Canada to reduce unnecessary CT imaging after minor head injury while ensuring high sensitivity for clinically important brain injury. MRI is not indicated in initial evaluation but may be considered for persistent or worsening symptoms with a normal CT."
    difficulty: medium
    tags: [neurology, concussion, CT-head-rules, Canadian-guidelines, TBI]
  - front: "What are the sequelae of mild Traumatic Brain Injury (concussion)?"
    back: "1) Post-concussion syndrome: dizziness, headache, neuropsychiatric symptoms, cognitive impairment (usually resolves within weeks to months). 2) Post-traumatic headaches (begin within 7 days of injury). 3) Post-traumatic epilepsy (~2% risk; prophylactic anticonvulsants NOT effective). 4) Post-traumatic vertigo.\n\nWhile most patients recover with minimal treatment, some experience prolonged or permanent effects. Previous concussion increases risk of subsequent concussions. Repeat TBI can cause second impact syndrome (life-threatening cerebral edema) or cumulative brain injury including chronic traumatic encephalopathy (CTE)."
    difficulty: medium
    tags: [neurology, concussion, post-concussion-syndrome, TBI, sequelae]
  - front: "What are the components of the basal ganglia and their functional pathways?"
    back: "Components: caudate nucleus, putamen, globus pallidus, subthalamic nucleus, and substantia nigra. Input from cerebral cortex; output to thalamus → back to cerebral cortex. Direct pathway: promotes movement. Indirect pathway: inhibits movement.\n\nUnderstanding basal ganglia circuitry is essential for movement disorder pharmacology. In Parkinson's disease, dopamine deficiency from substantia nigra pars compacta reduces direct pathway activity and increases indirect pathway activity, resulting in reduced movement. Dopaminergic therapy restores this balance."
    difficulty: easy
    tags: [neurology, basal-ganglia, movement-disorders, neuroanatomy]
  - front: "What are the key considerations in managing a patient with major NCD (summarized by the ABCDs mnemonic)?"
    back: "A — Affective disorders, ADLs. B — Behaviour management. C — Caretaker support, Cognitive medications and stimulation. D — Directives (advanced), Driving (fitness to drive), glasses/hearing aids (sensory aids).\n\nComprehensive dementia management extends beyond pharmacotherapy to include legal, safety, and psychosocial domains. Fitness to drive is a mandatory reporting requirement for physicians in Canada when cognitive impairment poses a safety risk. Advanced directives (power of attorney, living will) should be discussed early while the patient still has capacity."
    difficulty: medium
    tags: [neurology, dementia, management, ABCDs, Canadian-guidelines]
  - front: "What cognitive and neuropsychiatric symptoms characterize the mild versus major phases of Alzheimer's disease?"
    back: "Mild NCD (mild phase): memory and learning impairment, sometimes executive function deficits, major depressive disorder and/or apathy. Major NCD: visuospatial/perceptual-motor deficits, language impairment, and behavioural/psychiatric manifestations (psychosis, irritability, agitation, combativeness, wandering) in 80% of patients. Motor symptoms (gait disturbance, dysphagia, incontinence, myoclonus, seizures) occur late.\n\nThe progression of AD follows a predictable trajectory. Social cognition is preserved until late in the disease course. Behavioral and psychiatric manifestations are a major source of caregiver burden and often the primary reason for institutionalization. Acetylcholinesterase inhibitors and appropriate psychosocial interventions can reduce this burden."
    difficulty: medium
    tags: [neurology, Alzheimer, clinical-features, staging, neuropsychiatric]
  - front: "What genetic mutations are associated with Frontotemporal Dementia (FTD)?"
    back: "MAPT gene (tau protein), PGRN gene (progranulin), C9ORF72 gene (associated with FTD-ALS), TARDBP gene (TDP-43), VCP gene, and CHMP2B gene. 40% of FTD patients have a family history of early-onset NCD.\n\nFTD has a strong genetic component compared to other dementias. The C9ORF72 hexanucleotide repeat expansion is the most common genetic cause of both FTD and ALS, explaining the FTD-ALS overlap syndrome. Histologically, FTD shows inclusions of either tau or TDP-43 protein."
    difficulty: hard
    tags: [neurology, FTD, genetics, C9ORF72, MAPT, TDP-43]
  - front: "How does Down syndrome predispose to Alzheimer's disease?"
    back: "Down syndrome (trisomy 21) involves three copies of chromosome 21, which carries the amyloid precursor protein (APP) gene. This leads to overproduction of APP and consequently increased β-amyloid, predisposing to early-onset AD (typically by age 40).\n\nThe genetic basis for early AD in Down syndrome validates the amyloid cascade hypothesis. People with Down syndrome develop AD pathology (amyloid plaques and neurofibrillary tangles) decades earlier than the general population. This also explains why familial AD is associated with APP mutations on chromosome 21."
    difficulty: medium
    tags: [neurology, Alzheimer, Down-syndrome, trisomy-21, APP, amyloid]
  - front: "What is the prognosis of major NCD due to Alzheimer's disease, and what is the most common cause of death?"
    back: "Mean survival after diagnosis is approximately 10 years, reflecting the advanced age of most patients rather than the disease course itself. Most common cause of death is aspiration (aspiration pneumonia).\n\nAs AD progresses, patients develop dysphagia in the late stage, leading to aspiration of food and secretions and ultimately aspiration pneumonia. Other late-stage complications include urinary/fecal incontinence, immobility, pressure ulcers, and infections. Goals of care discussions and advance directives should be initiated early."
    difficulty: easy
    tags: [neurology, Alzheimer, prognosis, aspiration, end-of-life]
  - front: "What is the average survival for Dementia with Lewy Bodies (DLB) compared to Alzheimer's disease and Frontotemporal Dementia?"
    back: "DLB: average survival 5–7 years. AD: mean survival ~10 years. FTD: median survival 6–11 years from symptom onset, 3–4 years from diagnosis.\n\nDLB and FTD have shorter survival than AD. In FTD, survival is shorter and cognitive decline is faster than in typical AD. Vascular NCD prognosis depends heavily on vascular risk factor control. These prognostic differences inform discussions with patients and families about disease trajectory and planning."
    difficulty: medium
    tags: [neurology, DLB, FTD, Alzheimer, prognosis, survival]
  - front: "What is the minimum neurological observation period after mild TBI, and when is hospitalization indicated?"
    back: "Minimum: hourly clinical observations for at least 4 hours post-injury. Hospitalization is indicated if: CT is abnormal, OR CT is normal but symptoms are not improving at 4–6 hours post-injury.\n\nEarly observation allows detection of deterioration from intracranial hemorrhage expansion or cerebral edema. Early rehabilitation (OT, PT, SLP, vestibular therapy, sleep hygiene) maximizes outcomes. Return to Play guidelines (www.thinkfirst.ca) must be followed for sport-related concussions in Canada."
    difficulty: easy
    tags: [neurology, concussion, TBI, observation, hospitalization, Canadian-guidelines]
  - front: "What is the risk of post-traumatic epilepsy after mild TBI and is prophylactic anticonvulsant therapy effective?"
    back: "Approximately 2% risk of post-traumatic epilepsy after mild TBI. Prophylactic anticonvulsants are NOT effective in preventing post-traumatic epilepsy.\n\nPost-traumatic epilepsy is a recognized complication of TBI. While phenytoin may reduce early post-traumatic seizures (within the first week), it does not prevent the development of late epilepsy. Levetiracetam is often used in moderate-severe TBI for early seizure prophylaxis in clinical practice."
    difficulty: medium
    tags: [neurology, concussion, TBI, post-traumatic-epilepsy, anticonvulsants]
  - front: "What investigations are recommended to exclude treatable causes of cognitive impairment in a patient with suspected NCD?"
    back: "CBC (with MCV), glucose, TSH, vitamin B12, RBC folate, electrolytes, LFTs, renal function, lipids, serum calcium, CT head. As clinically indicated: VDRL, HIV, ANA, anti-dsDNA, ANCA, ceruloplasmin, copper, cortisol, toxicology, heavy metals. Consider SPECT or MRI.\n\nA systematic approach ensures reversible causes are not missed. Vitamin B12 deficiency (causing subacute combined degeneration) and hypothyroidism are particularly important to exclude, as both are treatable. NPH (normal pressure hydrocephalus) presents with the classic triad of gait disturbance, incontinence, and dementia and is identified on CT/MRI."
    difficulty: easy
    tags: [neurology, dementia, workup, investigations, reversible-dementia]
  - front: "What are the clinical features of Vitamin B12 deficiency relevant to neurology?"
    back: "Neurological: confusion/change in mental status (if advanced), decreased vibration sense, distal numbness and paresthesia, weakness with upper motor neuron findings (subacute combined degeneration). Hematological: macrocytic anemia, pallor, shortness of breath, fatigue, chest pain, palpitations. GI: diarrhea, anorexia.\n\nVitamin B12 deficiency causes subacute combined degeneration of the spinal cord, affecting the posterior columns (loss of vibration/proprioception) and corticospinal tracts (UMN signs). It is a reversible cause of cognitive impairment. Mean corpuscular volume (MCV) is elevated on CBC, providing a clue to the diagnosis."
    difficulty: easy
    tags: [neurology, B12-deficiency, subacute-combined-degeneration, reversible-dementia]
  - front: "What is the first-line treatment for Myasthenia Gravis (MG)?"
    back: "Acetylcholinesterase inhibitors (e.g. pyridostigmine) are first-line. If ineffective, corticosteroids (e.g. prednisone) are the mainstay. Short-term immunomodulation (IVIG, plasmapheresis) is used for myasthenic crisis.\n\nPyridostigmine increases acetylcholine availability at the neuromuscular junction by inhibiting its degradation. Corticosteroids modulate the autoimmune response. IVIG and plasmapheresis provide rapid but short-lived benefit during crisis."
    difficulty: easy
    tags: [myasthenia gravis, neuromuscular junction, acetylcholinesterase inhibitors, pyridostigmine, neurology]
  - front: "What are the long-term immunosuppressive options used as steroid-sparing agents in Myasthenia Gravis?"
    back: "Azathioprine, cyclophosphamide, and mycophenolate are used as steroid-sparing agents in long-term MG immunosuppression.\n\nThese agents reduce the immune-mediated destruction of acetylcholine receptors, allowing corticosteroid doses to be reduced and minimizing steroid side effects over the long term."
    difficulty: medium
    tags: [myasthenia gravis, immunosuppression, azathioprine, mycophenolate, neurology]
  - front: "What newer disease-specific agents are available for Myasthenia Gravis?"
    back: "Eculizumab (complement inhibitor) and efgartigimod (neonatal Fc receptor blocker) are newer, more disease-specific therapies for MG.\n\nEculizumab inhibits complement-mediated destruction at the neuromuscular junction. Efgartigimod reduces circulating IgG antibody levels (including anti-AChR antibodies) by blocking the neonatal Fc receptor recycling pathway."
    difficulty: hard
    tags: [myasthenia gravis, eculizumab, efgartigimod, biologic therapy, neurology]
  - front: "When is thymectomy indicated in Myasthenia Gravis, and what is its success rate?"
    back: "Thymectomy is an option in non-thymomatous, acetylcholine receptor antibody-positive generalized MG, with an 85% remission rate. A randomized trial showed thymectomy plus alternate-day prednisone reduced MG manifestations and prednisone requirements compared to prednisone alone.\n\nThe thymus is thought to harbour autoreactive T cells in MG. Thymectomy reduces the antigenic stimulus. The MGTX trial demonstrated clinical benefit over 3 years in AChR-antibody-positive, non-thymomatous generalized MG patients."
    difficulty: medium
    tags: [myasthenia gravis, thymectomy, remission, AChR antibody, neurology]
  - front: "What is the underlying pathophysiology of Lambert-Eaton Myasthenic Syndrome (LEMS)?"
    back: "LEMS is caused by autoimmune antibodies against presynaptic voltage-gated calcium channels (P/Q-type), leading to decreased acetylcholine release at the neuromuscular junction.\n\nUnlike MG where antibodies target postsynaptic AChRs, LEMS antibodies impair presynaptic calcium influx needed to trigger vesicle fusion and ACh release. This results in weakness that paradoxically improves transiently with repetitive activity."
    difficulty: medium
    tags: [LEMS, Lambert-Eaton, voltage-gated calcium channels, neuromuscular junction, neurology]
  - front: "What malignancy is most commonly associated with Lambert-Eaton Myasthenic Syndrome?"
    back: "Small cell carcinoma of the lung is associated with LEMS in 50-66% of cases.\n\nLEMS is a paraneoplastic syndrome in the majority of cases. Small cell lung cancer cells express voltage-gated calcium channels, triggering an immune response that cross-reacts with presynaptic NMJ channels. All patients with LEMS should be screened for malignancy."
    difficulty: easy
    tags: [LEMS, paraneoplastic, small cell lung cancer, neurology]
  - front: "How does Lambert-Eaton Myasthenic Syndrome differ from Myasthenia Gravis clinically?"
    back: "LEMS: proximal and lower limb muscles predominantly affected, reflexes diminished but increase after exercise, bulbar/ocular involvement in only 25%, prominent autonomic symptoms (dry mouth > impotence > constipation > blurred vision). MG: bulbar and ocular involvement in 90%, reflexes usually preserved, no autonomic symptoms.\n\nThe key distinguishing features are the pattern of weakness (LEMS predominantly proximal/lower limb), the incremental reflex response after exercise in LEMS (vs. fatigable weakness in MG), and the prominent autonomic involvement in LEMS. EMG shows incremental response on rapid repetitive stimulation in LEMS vs. decremental in MG."
    difficulty: hard
    tags: [LEMS, myasthenia gravis, differential diagnosis, neuromuscular junction, neurology]
  - front: "What is the electrodiagnostic finding that differentiates LEMS from MG on repetitive nerve stimulation?"
    back: "LEMS shows an incremental (facilitating) response on rapid (>10 Hz) repetitive nerve stimulation and with exercise. MG shows a decremental response on slow repetitive stimulation.\n\nIn LEMS, repeated stimulation allows calcium to accumulate presynaptically, overcoming the channel deficiency and releasing more ACh (facilitation). In MG, the postsynaptic AChRs are depleted/blocked, leading to progressive decremental response."
    difficulty: hard
    tags: [LEMS, EMG, repetitive nerve stimulation, electrodiagnostics, neurology]
  - front: "What antibody is used to confirm Lambert-Eaton Myasthenic Syndrome?"
    back: "Anti-P/Q-type voltage-gated calcium channel (VGCC) antibodies are present in 85-95% of patients with LEMS.\n\nThese antibodies are highly specific for LEMS and can be detected in both paraneoplastic and autoimmune (non-paraneoplastic) forms. Their presence supports the diagnosis and mandates workup for underlying malignancy, especially small cell lung cancer."
    difficulty: medium
    tags: [LEMS, anti-VGCC antibody, laboratory, neurology]
  - front: "How is botulism caused and what is the most common form?"
    back: "Botulism is caused by Clostridium botulinum toxin, which can enter through wounds or by ingestion. Infantile botulism is the most common form, usually from ingestion of honey or corn syrup.\n\nBotulinum toxin irreversibly cleaves SNARE proteins required for presynaptic ACh vesicle fusion. Infants lack the gut flora to prevent C. botulinum spore germination; hence honey and corn syrup are contraindicated in children under 1 year."
    difficulty: easy
    tags: [botulism, Clostridium botulinum, infantile botulism, neuromuscular junction, neurology]
  - front: "Describe the typical clinical progression of botulism."
    back: "Symptoms begin 6-48 h after ingestion. Pattern: GI symptoms → bilateral cranial neuropathies (ptosis, extraocular weakness, dilated poorly reactive pupils, dysarthria, dysphagia) → symmetric descending weakness with absent/decreased reflexes → autonomic dysfunction → respiratory failure.\n\nThe descending pattern of paralysis and prominent cranial nerve involvement distinguish botulism from Guillain-Barré syndrome (ascending) and MG. Autonomic findings (dry mouth, constipation, urinary retention, orthostatic hypotension) reflect cholinergic blockade."
    difficulty: medium
    tags: [botulism, cranial neuropathy, descending paralysis, respiratory failure, neurology]
  - front: "What is the treatment for botulism?"
    back: "Botulinum anti-toxin (good prognosis with prompt treatment) plus supportive therapy including monitoring of respiratory status and assessment for intubation.\n\nAnti-toxin neutralizes circulating toxin but cannot reverse already-bound toxin. Supportive care is critical as respiratory failure is the main cause of death. CT/MRI is normal in botulism and is used to rule out intracranial lesions."
    difficulty: easy
    tags: [botulism, antitoxin, respiratory support, treatment, neurology]
  - front: "What are the key clinical, biopsy, and laboratory features of polymyositis vs. dermatomyositis?"
    back: "Polymyositis: proximal muscle weakness, myalgias, nasopharyngeal involvement; biopsy shows endomysial infiltrates and necrosis; elevated CK. Dermatomyositis: proximal muscle weakness, myalgias, characteristic rashes (heliotrope, Gottron's papules), can be paraneoplastic; biopsy shows perifascicular atrophy; elevated CK.\n\nThe distinction is important because dermatomyositis has characteristic skin findings and higher malignancy association. Biopsy pattern differs: endomysial in polymyositis vs. perifascicular in dermatomyositis, reflecting different immune effectors (cytotoxic T cells vs. complement-mediated)."
    difficulty: medium
    tags: [polymyositis, dermatomyositis, inflammatory myopathy, biopsy, rheumatology, neurology]
  - front: "What is inclusion body myositis and how does it differ from polymyositis?"
    back: "Inclusion body myositis features weakness of quadriceps AND deep finger flexors (distal involvement), mildly elevated CK, and biopsy showing inclusion bodies. It differs from polymyositis in its distal involvement pattern, older age of onset, and poor response to immunosuppression.\n\nThe asymmetric distal involvement (especially deep finger flexors and quadriceps) is the hallmark. Inclusion bodies on biopsy are pathognomonic. Unlike polymyositis, inclusion body myositis does not respond well to steroids or immunosuppression."
    difficulty: medium
    tags: [inclusion body myositis, myopathy, distal weakness, biopsy, neurology]
  - front: "What is the genetic basis and inheritance of Myotonic Dystrophy Type 1?"
    back: "Myotonic Dystrophy Type 1 is caused by an unstable CTG trinucleotide repeat expansion in the myotonic dystrophy protein kinase gene (DMPK) at chromosome 19q13.3. It is autosomal dominant with genetic anticipation (increasing severity with successive generations).\n\nThe number of CTG repeats correlates with disease severity. Genetic anticipation occurs because the repeat tends to expand further with each transmission, especially maternally. This is the most common adult muscular dystrophy (prevalence 3-5/100,000)."
    difficulty: medium
    tags: [myotonic dystrophy, trinucleotide repeat, CTG, genetic anticipation, autosomal dominant, neurology]
  - front: "What are the multisystem features of Myotonic Dystrophy Type 1?"
    back: "Distal > proximal weakness (steppage gait), myotonia (percussion myotonia of thenar muscles), cardiac (90% have conduction defects: 1° heart block, atrial arrhythmias), respiratory (hypoventilation), ocular (subcapsular cataracts, retinal degeneration), DM, infertility, testicular atrophy, frontal baldness, facial/levator/masticatory muscle atrophy.\n\nThe multisystem involvement distinguishes myotonic dystrophy from other muscular dystrophies. Cardiac disease and respiratory failure are leading causes of death. EMG shows electrical myotonia with waxing/waning discharges ('dive-bomber' sound)."
    difficulty: medium
    tags: [myotonic dystrophy, multisystem, cardiac, myotonia, cataracts, neurology]
  - front: "How is myotonia elicited on physical examination in myotonic dystrophy?"
    back: "Percussion myotonia is elicited by tapping on the thenar muscles with a reflex hammer; delayed muscle relaxation (myotonia) is observed. EMG shows electrical myotonia with waxing and waning discharges that sound like a 'dive-bomber'.\n\nMyotonia refers to delayed muscle relaxation after contraction. Patients may also report difficulty releasing a handshake. The distribution of weakness in myotonic dystrophy is distal > proximal, the reverse of most other myopathies."
    difficulty: easy
    tags: [myotonia, myotonic dystrophy, clinical examination, EMG, neurology]
  - front: "What is the treatment for myotonia in Myotonic Dystrophy Type 1?"
    back: "Myotonia is treated with mexiletine (first choice) or phenytoin. There is no cure for the underlying disease; management is supportive.\n\nMexiletine is a sodium channel blocker that reduces the repetitive muscle membrane depolarizations causing myotonia. Phenytoin can be used as an alternative. Overall prognosis depends on age of onset and number of CTG repeats; death typically occurs around age 50."
    difficulty: medium
    tags: [myotonic dystrophy, mexiletine, myotonia treatment, neurology]
  - front: "What are the red flag features in headache evaluation ('SNOOP4') that indicate the need for neuroimaging?"
    back: "SNOOP4: Systemic symptoms/secondary risk factors (fever, weight loss, immunocompromised); Neurological symptoms; Onset sudden (thunderclap); Older age (new headache >50 yr); Pattern change; Positional variation; Precipitated by Valsalva/cough; Pregnancy (venous sinus thrombosis, IIH, preeclampsia).\n\nThese red flags identify headaches that may represent serious secondary causes requiring urgent investigation (CT/MRI and possibly LP). If CT is negative but SAH or meningitis is clinically suspected, lumbar puncture must be performed."
    difficulty: medium
    tags: [headache, red flags, SNOOP4, neuroimaging, emergency, neurology]
  - front: "Compare tension-type, migraine, and cluster headaches in terms of location, quality, duration, sex bias, and associated features."
    back: "Tension: bilateral frontal/nuchal-occipital, band-like constant, minutes-days, F>M, no nausea/photophobia. Migraine: unilateral > bilateral fronto-temporal, pulsating/throbbing, hours-days, F>M (post-pubertal), N/V + photo/phonophobia + aura. Cluster: retro-orbital/supra-orbital, constant/stabbing, 10 min-2h, M>F, red/watery eye, eyelid/forehead swelling, nasal congestion, Horner's, wakes from sleep.\n\nCluster headache is the most severe (wakes from sleep) and has distinctive autonomic features (ipsilateral lacrimation, conjunctival injection, nasal congestion, Horner's). Migraine's pulsating quality and photo/phonophobia are diagnostic. Tension is mildest and most common (30-40% prevalence)."
    difficulty: medium
    tags: [headache, tension, migraine, cluster, differential diagnosis, neurology]
  - front: "What are the acute (abortive) and prophylactic treatments for migraine headache?"
    back: "Acute/Abortive: NSAIDs, triptans, ergotamine, anti-emetics, CGRP antagonists. Prophylactic: beta-blockers (propranolol, timolol - level A), amitriptyline (TCA - level A), flunarizine (CCB - level A), valproate (level A), topiramate (level A), CGRP antibodies (e.g. galcanezumab), botulinum toxin.\n\nTriptans are 5-HT1B/1D agonists that cause vasoconstriction and reduce CGRP release. Prophylaxis is indicated if attacks are frequent or disabling. Valproate and topiramate each reduce headache days by ~4 and ~1 day/month respectively and double the likelihood of >50% frequency reduction."
    difficulty: medium
    tags: [migraine, triptans, prophylaxis, valproate, topiramate, CGRP, neurology]
  - front: "What are the diagnostic criteria for migraine headache?"
    back: "≥5 attacks, each lasting >4 hours, with at least 2 of: unilateral, pulsating, moderate-severe intensity, aggravated by routine activity; AND at least 1 of: nausea/vomiting, photophobia/phonophobia/osmophobia; not better explained by another diagnosis.\n\nThese are the International Headache Society (IHS) criteria. Migraine occurs in 18% of females and 6% of males; frequency decreases with age and at menopause. About 20% of migraines are associated with aura caused by cortical spreading depression."
    difficulty: medium
    tags: [migraine, diagnostic criteria, IHS criteria, neurology]
  - front: "What is the pathophysiology of migraine aura?"
    back: "Migraine aura is caused by a depolarizing wave of 'cortical spreading depression' across the cerebral cortex (e.g., visual symptoms result from wave through occipital cortex), associated with possible vasoconstriction/dilation. Auras are positive or negative phenomena lasting 5-60 minutes.\n\nAbout 20% of migraineurs experience aura. Cortical spreading depression is a slowly propagating wave of neuronal and glial depolarization followed by suppression. This is distinct from TIA/stroke (negative symptoms, no spreading quality) and seizures (shorter duration, typically without spreading march)."
    difficulty: hard
    tags: [migraine, aura, cortical spreading depression, pathophysiology, neurology]
  - front: "What are the contraindications and key side effects of propranolol and valproate in migraine prophylaxis?"
    back: "Propranolol (level A): contraindicated in asthma, DM (masks hypoglycemia), CHF; side effects: fatigue, depression, light-headedness. Valproate (level A): contraindicated in liver/pancreatic disease; side effects: weight gain, elevated liver enzymes, hyperammonemia, tremor, alopecia; teratogenic (neural tube defect).\n\nBoth have strong evidence (level A) for migraine prevention. Valproate's teratogenicity makes it problematic in women of childbearing age. Topiramate (level A) causes weight loss (vs. weight gain with valproate), paresthesia, cognitive effects, and rare acute angle-closure glaucoma."
    difficulty: medium
    tags: [migraine prophylaxis, propranolol, valproate, contraindications, side effects, neurology]
  - front: "What are the acute and prophylactic treatments for cluster headache?"
    back: "Acute: sumatriptan (nasal or SC injection). Prophylaxis: verapamil (first-line), lithium, methysergide, prednisolone, CGRP antibody (galcanezumab). Patients walk around during attacks (vs. lying still in migraine).\n\nCluster headache affects 1% of the population with M>F predominance, occurring in daily attacks for weeks to months (often nocturnal/early AM). A randomized trial showed galcanezumab reduced weekly cluster attack frequency by 8.7 vs. 5.2 in placebo."
    difficulty: medium
    tags: [cluster headache, sumatriptan, verapamil, galcanezumab, prophylaxis, neurology]
  - front: "What are the clinical features of trigeminal neuralgia and its first-line treatment?"
    back: "Recurrent sudden, excruciating, unilateral, paroxysmal, electric-shock pain in trigeminal territory (V3>V2>>V1); triggered by touching face, eating, talking, cold wind, shaving. First-line treatment: carbamazepine or oxcarbazepine. Second-line: baclofen or lamotrigine. Refractory: microvascular decompression.\n\nClassical trigeminal neuralgia is caused by compression of the trigeminal nerve by a tortuous vessel (usually superior cerebellar artery). Sensory exam is usually normal; if abnormal, suspect secondary cause. MRI is required to rule out structural causes (mass, MS)."
    difficulty: medium
    tags: [trigeminal neuralgia, carbamazepine, V3, facial pain, microvascular decompression, neurology]
  - front: "What is postherpetic neuralgia and how is it prevented and treated?"
    back: "Pain persisting in the region of a herpes zoster cutaneous outbreak; constant deep ache, burning, lancinating pain, and allodynia. Prevention: varicella vaccine (childhood); Shingrix® (>50 yr, more efficacious) or Zostavax® (>60 yr, live). Treatment: amitriptyline (TCA), pregabalin/gabapentin, opiates, lidocaine patch, topical capsaicin; early antivirals (famciclovir/valacyclovir) during acute zoster. Corticosteroids during acute zoster do NOT prevent postherpetic neuralgia.\n\nPostherpetic neuralgia results from destruction of sensory ganglion neurons during herpes zoster reactivation. Incidence increases with age (2% <60 yr, 19% >70 yr). Hutchinson's sign (tip of nose involvement) predicts corneal involvement when V1 is affected."
    difficulty: medium
    tags: [postherpetic neuralgia, herpes zoster, Shingrix, prevention, amitriptyline, neurology]
  - front: "What are the Canadian Pain Society first-line treatments for neuropathic pain?"
    back: "First-line (Canadian Pain Society, 2014): gabapentinoids (pregabalin, gabapentin), TCAs, and SNRIs. Second-line: tramadol, opioid analgesics. Third-line: cannabinoids. Fourth-line: methadone, anticonvulsants (lamotrigine, lacosamide), tapentadol, botulinum toxin.\n\nThis stepwise approach is used regardless of neuropathic pain etiology. The goal is to identify and treat the underlying cause first. Non-pharmacologic therapies (CBT, physiotherapy) and surgical options (dorsal column neurostimulator, DBS) complement pharmacotherapy."
    difficulty: medium
    tags: [neuropathic pain, Canadian Pain Society, gabapentin, pregabalin, TCA, SNRI, neurology]
  - front: "Define allodynia and hyperalgesia, and in what condition are they characteristically found?"
    back: "Allodynia: pain response to a non-noxious stimulus. Hyperalgesia: exaggerated pain response to a noxious stimulus. Both are characteristic features of neuropathic pain and complex regional pain syndrome (CRPS).\n\nThese phenomena reflect sensitization of the peripheral and central somatosensory system. They are key diagnostic features of neuropathic pain and CRPS, distinguishing them from nociceptive pain where the pain response is proportional to stimulus intensity."
    difficulty: easy
    tags: [allodynia, hyperalgesia, neuropathic pain, CRPS, neurology]
  - front: "What are the Budapest Criteria for diagnosing Complex Regional Pain Syndrome (CRPS)?"
    back: "1. Continuing regional pain disproportionate to inciting event. 2. Symptoms in ≥3 of 4 categories AND signs in ≥2 of 4 categories: sensory (hyperesthesia/allodynia), vasomotor (temperature/colour asymmetry), sudomotor/edema (edema, sweating changes), motor/trophic (decreased ROM, motor dysfunction, trophic changes). 3. No other diagnosis better explains the findings.\n\nCRPS is a clinical diagnosis. Bone scintigraphy within 5 months of onset may support the diagnosis but a negative test does not exclude it. MRI can rule out other causes. Early mobilization after injury/stroke prevents CRPS."
    difficulty: hard
    tags: [CRPS, complex regional pain syndrome, Budapest criteria, diagnosis, neurology]
  - front: "How are CRPS Type I and Type II differentiated?"
    back: "CRPS Type I (reflex sympathetic dystrophy): preceded by minor injuries or remote body area lesions, WITHOUT identifiable nerve injury. CRPS Type II (causalgia): preceded by identifiable peripheral nerve injury.\n\nBoth types present with regional pain, autonomic changes, and trophic features. The key distinction is the presence of a defined nerve injury in Type II. Treatment principles are similar: early mobilization, PT/OT, topical agents, gabapentinoids, and sympathetic blockade for refractory cases."
    difficulty: medium
    tags: [CRPS, reflex sympathetic dystrophy, causalgia, Type I, Type II, neurology]
  - front: "What is the first-line treatment for painful diabetic neuropathy?"
    back: "Pregabalin is first-line. Second-line options include venlafaxine, duloxetine, amitriptyline, gabapentin, valproate, and rarely opioids or capsaicin.\n\nPain is neuropathic if it is present at rest, improves with walking, is sharp/tingling, and more prominent in feet than calves. This distinguishes it from vascular (claudication) pain, which worsens with walking. Tight glycemic control addresses the underlying cause."
    difficulty: easy
    tags: [diabetic neuropathy, pregabalin, neuropathic pain, endocrinology, neurology]
  - front: "What are the diagnostic criteria and epidemiology of insomnia?"
    back: "Insomnia: difficulty initiating/maintaining sleep or waking earlier than desired (non-restorative sleep) despite adequate opportunity. Common secondary causes include psychiatric disorders (80% of psychiatric patients), neurologic disorders, sleep disorders (RLS, OSA), medical conditions, drugs/toxins. Treatment: CBT (first-line), sleep hygiene, stimulus control, sleep restriction, melatonin.\n\nCognitive behavioural therapy for insomnia (CBT-I) is the most evidence-based long-term treatment. Medications (e.g., benzodiazepines, Z-drugs) are second-line and used short-term. Fatal familial insomnia is a rare prion protein mutation causing autonomic dysfunction and intractable insomnia."
    difficulty: easy
    tags: [insomnia, sleep disorder, CBT, sleep hygiene, neurology]
  - front: "What are the types, diagnosis, and treatment of sleep apnea?"
    back: "Types: Obstructive (airway collapse in deep/REM sleep), Central (no respiratory effort >10s; etiology: heart failure, opiates, brainstem pathology, myotonic dystrophy), Mixed. Diagnosis: polysomnography (home or in-hospital); AHI ≥5. Treatment: CPAP (mainstay), weight loss, positional therapy, dental devices, surgery; ensure driving safety.\n\nSleep apnea affects >6% of Canadians. Risk factors: older age, obesity, male sex, craniofacial/upper airway abnormalities. Significant comorbidities include HTN, stroke, heart failure, and increased accident risk. Central sleep apnea has distinct etiologies requiring targeted management."
    difficulty: easy
    tags: [sleep apnea, OSA, central sleep apnea, CPAP, polysomnography, neurology]
  - front: "What are the clinical features, associations, and treatment of Restless Legs Syndrome (RLS)?"
    back: "RLS: urge to move legs with uncomfortable sensations, beginning/worsening with rest, partially or totally relieved with movement, worse in evening/night. Associated with iron deficiency, neuropathy, PD, alcohol, pregnancy, end-stage renal disease. 90% also have periodic limb movement disorder. Treatment: iron (target ferritin >75 μg/L), gabapentinoids, dopamine agonists (pramipexole, rotigotine), benzodiazepines (clonazepam), opioids if refractory.\n\nIron deficiency is a key reversible cause; ferritin should be checked and repleted to >75 μg/L. Dopamine agonists are effective but may cause augmentation (worsening of symptoms with treatment). The evening predominance reflects circadian variation in dopamine levels."
    difficulty: medium
    tags: [restless legs syndrome, RLS, iron deficiency, dopamine agonist, sleep disorder, neurology]
  - front: "What are the four cardinal features of narcolepsy and how is it diagnosed?"
    back: "1. Excessive daytime sleepiness (all narcolepsy). 2. Cataplexy (pathognomonic): sudden loss of muscle tone triggered by emotion. 3. Sleep paralysis: inability to move upon waking. 4. Hypnagogic (falling asleep) and hypnopompic (waking) hallucinations. Diagnosis: clinical history + multiple sleep latency test (MSLT) showing sleep latency <8 min and REM onset within 15 min of sleep on ≥2/4 naps.\n\nNarcolepsy results from autoimmune destruction of orexin/hypocretin-producing neurons in the hypothalamus. Prevalence is 1:2000, onset in adolescence/early adulthood. Cataplexy is pathognomonic but not present in all narcolepsy cases."
    difficulty: medium
    tags: [narcolepsy, cataplexy, MSLT, orexin, hypocretin, sleep disorder, neurology]
  - front: "What is the treatment for narcolepsy including agents for excessive daytime sleepiness and cataplexy?"
    back: "Excessive daytime sleepiness: sleep hygiene, scheduled brief naps, modafinil (non-amphetamine stimulant, first-line), methylphenidate. Cataplexy: TCAs, SSRIs, sodium oxybate. Driving restrictions apply.\n\nModafinil is preferred over amphetamines due to lower abuse potential. Sodium oxybate (GHB) is effective for both EDS and cataplexy. Restricted driving is important as narcolepsy is a life-long disorder with significant safety implications."
    difficulty: medium
    tags: [narcolepsy, modafinil, sodium oxybate, cataplexy treatment, sleep disorder, neurology]
  - front: "What are the mitochondrial myopathy syndromes MERRF, MELAS, and Kearns-Sayre and their key features?"
    back: "MERRF (mitochondrial encephalomyopathy with ragged red fibres): myoclonus, generalized seizures, dementia, myopathy; biopsy: ragged red fibres; elevated lactate. MELAS (lactic acidosis and stroke-like episodes): pediatric onset, stroke-like symptoms, episodic vomiting, dementia. Kearns-Sayre: progressive ophthalmoplegia, retinal pigment degeneration, cardiac conduction abnormalities.\n\nMitochondrial myopathies are maternally inherited. 'Ragged red fibres' on Gomori trichrome stain represent abnormal mitochondrial accumulation in subsarcolemmal regions. Elevated lactate reflects impaired oxidative phosphorylation causing lactic acidosis."
    difficulty: hard
    tags: [mitochondrial myopathy, MERRF, MELAS, Kearns-Sayre, ragged red fibres, neurology]
  - front: "What is McArdle's disease and what are its key clinical and laboratory features?"
    back: "McArdle's disease (myophosphorylase deficiency) is a hereditary metabolic myopathy presenting with exercise-induced myalgias, cramping, and myoglobinuria. Key lab: elevated serum/urinary myoglobin; elevated lactate post-exercise.\n\nMcArdle's is caused by absence of muscle glycogen phosphorylase, preventing glycogen breakdown during exercise. A 'second wind' phenomenon occurs as fatty acids become available. It is the prototypical glycogen storage disease affecting muscle."
    difficulty: medium
    tags: [McArdle disease, metabolic myopathy, exercise intolerance, myoglobinuria, neurology]
  - front: "What are the differences between Duchenne and Becker muscular dystrophies?"
    back: "Duchenne: early onset, rapidly progressive proximal weakness, absent dystrophin, calf pseudohypertrophy, X-linked; genetic testing + absent dystrophin on analysis. Becker: later onset, slower progression, reduced (not absent) dystrophin; genetic testing + reduced dystrophin analysis.\n\nBoth result from mutations in the dystrophin gene (Xp21), but Duchenne involves frameshift mutations causing complete absence, while Becker involves in-frame mutations preserving some dystrophin function. Calf pseudohypertrophy results from fatty/fibrous replacement of muscle."
    difficulty: medium
    tags: [Duchenne muscular dystrophy, Becker muscular dystrophy, dystrophin, X-linked, neurology]
  - front: "What are the key features of temporal arteritis (giant cell arteritis) as a secondary headache cause?"
    back: "Age >60 yr, temporal location, variable severity, jaw claudication (provoking), associated polymyalgia rheumatica, visual loss risk, temporal artery changes (firm, nodular, incompressible, tender). Management: urgent prednisone, CT/MRI; see Rheumatology (RH22).\n\nTemporal arteritis (GCA) is a vasculitis primarily affecting medium/large vessels, most commonly the temporal artery. Visual loss (ischemic optic neuropathy) is a feared complication requiring immediate corticosteroid treatment. ESR and CRP are elevated; temporal artery biopsy is diagnostic."
    difficulty: medium
    tags: [temporal arteritis, giant cell arteritis, headache, jaw claudication, visual loss, neurology]
  - front: "What are the distinguishing features of increased intracranial pressure (ICP) as a secondary headache cause?"
    back: "Gradual onset, worse nocturnal and in the AM, worse with lying down/Valsalva/exertion, associated focal neurological symptoms, decreased LOC, papilledema on exam. Etiology: tumour, CSVT, idiopathic intracranial hypertension (IIH), malignant HTN. Management: CT/MRI with gadolinium and treatment to reduce pressure.\n\nIncreased ICP headache worsens with maneuvers that raise intracranial pressure (lying down, Valsalva, coughing). Papilledema is the key physical finding. This contrasts with low-pressure headache (post-LP) which worsens with standing."
    difficulty: medium
    tags: [increased ICP, secondary headache, papilledema, IIH, neurology]
  - front: "What are the stages of an uncomplicated migraine attack?"
    back: "1. Prodrome (hours to days before headache): mood changes, fatigue, food cravings. 2. Aura (in 20%): visual/sensory/motor symptoms lasting 5-60 min. 3. Headache: unilateral, pulsating, moderate-severe, with N/V, photo/phonophobia, 4-72h. 4. Postdrome: fatigue, cognitive slowing.\n\nRecognition of these stages helps in appropriate timing of abortive therapy. Triptans are most effective when taken early in the headache phase (not during aura). The postdrome ('migraine hangover') can be as debilitating as the headache itself."
    difficulty: easy
    tags: [migraine, prodrome, aura, postdrome, stages, neurology]
  - front: "What parasomnia is associated with Parkinson's disease in the elderly, and what sleep disorder is associated with parasomnias in children?"
    back: "In the elderly, REM sleep behaviour disorder (RBD) is associated with Parkinson's disease. In children, slow wave sleep arousals (sleepwalking/night terrors) may be associated with sleep-disordered breathing (e.g., obstructive sleep apnea from tonsillar hypertrophy).\n\nRBD involves loss of normal REM sleep muscle atonia, causing patients to act out dreams. It is a prodromal marker of synucleinopathies (PD, Lewy body dementia, MSA). Clonazepam is used for RBD. Tonsillectomy is beneficial for children with obstructive-related parasomnias."
    difficulty: medium
    tags: [REM sleep behaviour disorder, Parkinsons disease, parasomnias, sleepwalking, sleep apnea, neurology]
  - front: "What is the zoster vaccine efficacy data from the landmark NEJM 2005 trial?"
    back: "The live attenuated Oka/Merck VZV (zoster) vaccine in adults ≥60 years: reduced herpes zoster illness burden by 61.1% (P<0.001), incidence of herpes zoster infection by 51.3% (P<0.001), and incidence of postherpetic neuralgia (PHN) by 66.5% (P<0.001). (Oxman et al., NEJM 2005)\n\nThis landmark trial (38,546 adults ≥60 years) established the benefit of zoster vaccination in older adults. It led to widespread vaccination recommendations. A recombinant adjuvanted herpes zoster subunit vaccine (Shingrix) was subsequently shown to have higher efficacy (~97% in adults 50-69 years, Lal et al., NEJM 2015) and is now the preferred vaccine in Canada, replacing the live attenuated vaccine (Zostavax). PHN risk increases significantly with age."
    difficulty: medium
    tags: [neurology, herpes zoster, PHN, vaccination, clinical trial]
  - front: "What are the two major types of stroke and their approximate proportions?"
    back: "Ischemic (~80%) and hemorrhagic (~20%).\n\nIschemic stroke results from arterial thrombosis (large vessel or small vessel/lacunar), cardioembolism, or systemic hypoperfusion. Hemorrhagic stroke includes intracerebral hemorrhage (ICH) and subarachnoid hemorrhage (SAH). Recognizing the distinction is critical because treatment differs dramatically (thrombolytics for ischemic vs. risk of harm in hemorrhagic)."
    difficulty: easy
    tags: [stroke, ischemic stroke, hemorrhagic stroke, neurology, epidemiology]
  - front: "What is a TIA and how does it differ from a stroke?"
    back: "A TIA is a transient (<24 h) episode of neurological dysfunction caused by focal brain, spinal cord, or retinal ischemia WITHOUT acute infarction on CT or MRI. Stroke involves permanent tissue injury confirmed by neuroimaging.\n\nThe key distinguishing feature of TIA vs. stroke is the absence of infarction on imaging. TIA may present with amaurosis fugax (transient monocular painless vision loss). TIA is a medical emergency because it predicts high short-term stroke risk, necessitating urgent evaluation and secondary prevention."
    difficulty: easy
    tags: [TIA, stroke, transient ischemic attack, amaurosis fugax, neurology]
  - front: "What is the most common cause of large vessel ischemic stroke?"
    back: "Atherosclerosis.\n\nLarge vessel ischemic stroke involves stenosis or occlusion of the internal carotid artery, vertebral artery, basilar artery, or anterior/middle/posterior cerebral arteries. Atherosclerosis is the most common underlying process, causing insufficient blood flow beyond the lesion (hemodynamic stroke). Other causes include dissection and vasculitis."
    difficulty: easy
    tags: [ischemic stroke, large vessel stroke, atherosclerosis, neurology]
  - front: "What is the mechanism of lacunar stroke and which structures are most commonly affected?"
    back: "Chronic hypertension and diabetes cause vessel wall thickening and decreased luminal diameter in small penetrating arteries. Most commonly affects the basal ganglia, internal capsule, and thalamus.\n\nLacunar infarcts result from disease of small deep penetrating arteries. The five classic lacunar syndromes are: pure motor hemiparesis, pure sensory loss, sensorimotor stroke, ataxic hemiparesis, and dysarthria-clumsy hand syndrome. HTN and DM are the primary risk factors."
    difficulty: medium
    tags: [lacunar stroke, small vessel stroke, hypertension, diabetes, neurology]
  - front: "What is the most common cardiac source of cardioembolic stroke?"
    back: "Atrial fibrillation.\n\nCardioembolic stroke occurs when thrombus from a cardiac source blocks cerebral arterial blood flow. Atrial fibrillation is the most common cause. Other sources include rheumatic valve disease, prosthetic heart valves, recent MI, and infectious endocarditis. Cardioembolic strokes may develop hemorrhagic transformation within 1 week of initial infarction."
    difficulty: easy
    tags: [cardioembolic stroke, atrial fibrillation, stroke, neurology]
  - front: "What are the classic clinical features of a middle cerebral artery (MCA) stroke?"
    back: "Contralateral face and arm weakness/sensory deficit, cortical sensory loss, contralateral homonymous hemianopsia or quadrantanopia, aphasia (dominant hemisphere), neglect/anosognosia (non-dominant hemisphere), and eye deviation toward the side of the lesion (away from the weak side).\n\nMCA is the most common artery involved in ischemic stroke. It supplies the lateral cerebral cortex including motor and sensory cortex for face and arm, but not leg (which is ACA territory). Left (dominant) hemisphere MCA involvement causes aphasia; right (non-dominant) causes neglect and anosognosia."
    difficulty: medium
    tags: [MCA stroke, middle cerebral artery, aphasia, neglect, neurology]
  - front: "What are the clinical features of anterior cerebral artery (ACA) stroke?"
    back: "Contralateral leg weakness and/or sensory deficit, and neurocognitive deficits (e.g., abulia, agitation, emotional lability).\n\nACA supplies the medial cerebral cortex including the motor and sensory areas for the leg. Therefore ACA stroke causes contralateral leg > arm weakness, which contrasts with MCA (arm > leg). Frontal lobe involvement causes behavioral changes such as abulia (lack of motivation) and emotional lability."
    difficulty: medium
    tags: [ACA stroke, anterior cerebral artery, stroke syndromes, neurology]
  - front: "What is Wallenberg (lateral medullary) syndrome and which artery is involved?"
    back: "Posterior inferior cerebellar artery (PICA) occlusion. Features: ipsilateral ataxia, ipsilateral Horner's syndrome, ipsilateral facial sensory loss, contralateral limb pain and temperature loss, nystagmus, vertigo, N/V, dysphagia, dysarthria, and hiccups.\n\nLateral medullary syndrome affects the lateral medulla including the spinothalamic tract (contralateral pain/temp loss), trigeminal nucleus (ipsilateral facial sensory loss), vestibular nuclei (nystagmus/vertigo), nucleus ambiguus (dysphagia/dysarthria), and sympathetic fibers (ipsilateral Horner's). Crossed sensory findings (ipsilateral face, contralateral body) are pathognomonic."
    difficulty: hard
    tags: [Wallenberg syndrome, lateral medullary syndrome, PICA, stroke, neurology]
  - front: "What are the neurological findings of a proximal basilar artery occlusion?"
    back: "Impaired eye movements, vertical nystagmus, reactive miosis, hemi- or quadriplegia, dysarthria, ataxia, locked-in syndrome, and coma.\n\nProximal basilar artery occlusion (usually thrombotic) affects the pons and brainstem structures. Locked-in syndrome is a devastating complication where the patient is conscious but cannot move or speak. Distal basilar (top of the basilar syndrome, usually embolic) causes somnolence, memory/behaviour abnormalities, and oculomotor deficits."
    difficulty: hard
    tags: [basilar artery, locked-in syndrome, stroke, brainstem, neurology]
  - front: "What are the five classic lacunar stroke syndromes?"
    back: "1. Pure motor hemiparesis (posterior limb of internal capsule or ventral pons)\n2. Pure sensory loss (ventral thalamic)\n3. Sensorimotor stroke (weakness and numbness without cortical signs)\n4. Ataxic hemiparesis (ventral pons or internal capsule)\n5. Dysarthria-clumsy hand syndrome (ventral pons or genu of internal capsule)\n\nLacunar syndromes result from small vessel disease in deep brain structures. Key feature is absence of cortical signs (no aphasia, apraxia, or visual field loss). The location within the internal capsule or pons determines which syndrome manifests. Distinguishing lacunar from cortical strokes affects prognosis and management."
    difficulty: hard
    tags: [lacunar stroke, lacunar syndromes, internal capsule, pons, neurology]
  - front: "What is the NIHSS and what score indicates a severe stroke?"
    back: "The National Institute of Health Stroke Scale (NIHSS) is a standardized 11-item clinical examination (scored 0-42) assessing LOC, visual system, facial palsy, motor, sensory, cerebellar function, and language abilities. Score >21 = severe stroke; 16-20 = moderate-to-severe; 5-15 = moderate; 1-4 = mild; 0 = no stroke.\n\nNIHSS quantifies stroke severity and guides treatment decisions including eligibility for thrombolysis and thrombectomy. It is used acutely and to monitor response to therapy. For secondary prevention, high-risk TIA or minor stroke is defined as NIHSS <4."
    difficulty: easy
    tags: [NIHSS, stroke severity, stroke assessment, neurology]
  - front: "What is the ASPECTS score and what cutoff predicts high risk of bleeding with tPA?"
    back: "ASPECTS (Alberta Stroke Program Early CT Score) is a 10-point quantitative score to assess early ischemic changes on CT. Score <4/10 signifies high risk of bleeding with tPA. Score 10/10 is normal.\n\nASPECTS subtracts 1 point for each abnormal structure within the ischemic hemisphere: caudate nucleus, lentiform, insula, internal capsule, and MCA regions 1-6. Lower scores indicate larger infarct cores and higher hemorrhagic transformation risk with thrombolysis, making it important for treatment decisions."
    difficulty: medium
    tags: [ASPECTS score, CT stroke, tPA, thrombolysis, neurology]
  - front: "What are the early CT signs of acute ischemic stroke?"
    back: "Loss of cortical white-grey differentiation, sulcal effacement (mass effect decreasing sulcal visibility), hypodensity of parenchyma, insular ribbon sign, and hyperdense middle cerebral artery sign.\n\nCT may appear normal in the first several hours after stroke onset, especially in posterior circulation strokes. The hyperdense MCA sign indicates thrombus in the MCA. CT is performed urgently to exclude hemorrhage before thrombolysis. MRI is more sensitive but less practical in the acute setting."
    difficulty: medium
    tags: [CT stroke, stroke imaging, MCA sign, neurology]
  - front: "What is the time window for IV tPA in acute ischemic stroke and what is the current recommended agent?"
    back: "tPA (alteplase) or tenecteplase (TNK) should be given within 4.5 hours of acute ischemic stroke onset if clinical indications are met and there are no contraindications.\n\nThe NINDS trial established the 3-hour window; ECASS3 extended this to 4.5 hours. Current standard of care is IV tPA + mechanical thrombectomy for large vessel occlusions. If tPA is given, delay antiplatelet/anticoagulation by 24 hours. Blood work should only delay treatment if anticoagulant use, low platelet count, or abnormal electrolytes are suspected."
    difficulty: easy
    tags: [tPA, thrombolysis, acute ischemic stroke, time window, neurology]
  - front: "What are absolute contraindications to tPA in acute ischemic stroke?"
    back: "Hemorrhage on brain imaging, any condition that could increase the risk of hemorrhage (e.g., active bleeding, recent surgery, prior ICH), conditions increasing hemorrhagic risk, and prior stroke.\n\nRelative contraindications include: head/spine trauma or surgery in preceding 3 months, major surgery in preceding 14 days, arterial puncture at non-compressible site, another acute neurological condition (e.g., post-ictal Todd's paralysis), blood glucose <2.7 or >22.2 mmol/L, INR >1.7, aPTT elevated, platelet count <100x10⁹/mm³, and CT signs of extensive infarction."
    difficulty: medium
    tags: [tPA contraindications, thrombolysis, stroke treatment, neurology]
  - front: "What are the time windows for mechanical thrombectomy in ischemic stroke?"
    back: "<6 hours: with small-to-moderate ischemic core on CT. 6-24 hours: CT perfusion used to select patients meeting DAWN trial criteria (mismatch between clinical deficit and infarct size). For basilar occlusions, weigh risks and benefits individually.\n\nCurrent standard of care is IV tPA + mechanical thrombectomy for proximal anterior circulation occlusion. The DAWN trial demonstrated benefit of thrombectomy 6-24 hours after stroke in patients with clinical deficit-infarct mismatch. Multiple RCTs (MR CLEAN, ESCAPE) confirmed benefit <6 hours."
    difficulty: medium
    tags: [mechanical thrombectomy, endovascular treatment, stroke, DAWN trial, neurology]
  - front: "What is the recommended acute antiplatelet therapy for TIA or minor stroke if tPA is NOT given?"
    back: "Loading dose ASA 160 mg chewed at presentation. For high-risk TIA or minor stroke (NIHSS <4): dual antiplatelet therapy with ASA + clopidogrel (300 mg loading dose) for 21 days (ASA 81 mg + clopidogrel 75 mg), followed by antiplatelet monotherapy.\n\nIf patient is intolerant to ASA, use clopidogrel 300 mg. Long-term combined ASA and clopidogrel is NOT recommended for secondary prevention beyond 21 days due to increased bleeding risk and mortality, unless there is an alternate indication (e.g., coronary drug-eluting stent). The POINT trial supported dual antiplatelet therapy for 21 days in high-risk TIA/minor stroke."
    difficulty: medium
    tags: [antiplatelet therapy, TIA, stroke prevention, aspirin, clopidogrel, neurology]
  - front: "What are the blood pressure targets in acute ischemic stroke for thrombolysed vs. non-thrombolysed patients?"
    back: "Non-thrombolysed: withhold antihypertensives for 48-72 hours (permissive hypertension) unless sBP >220 mmHg or dBP >120 mmHg, or acute MI/renal failure/aortic dissection (use IV labetalol if needed). Thrombolysed: target BP <180/105 mmHg.\n\nAcutely elevated BP is necessary to maintain perfusion to the ischemic penumbra. Most patients with acute cerebral infarction are initially hypertensive and their BP improves within 1-2 days. Aggressive lowering can extend the infarct by compromising penumbral perfusion."
    difficulty: medium
    tags: [blood pressure, acute stroke, permissive hypertension, tPA, neurology]
  - front: "What are the CHADS2 score components and what score warrants anticoagulation in atrial fibrillation?"
    back: "C=CHF (1), H=HTN sBP >160 mmHg/treated HTN (1), A=Age >75 yr (1), D=DM (1), S=prior Stroke/TIA (2). Score ≥2 (high risk, 4-18.2% annual stroke risk) warrants anticoagulation. Score 1 (intermediate): anticoagulant or antiplatelet (patient-specific). Score 0 (low risk): antiplatelet. Current Canadian guidelines recommend virtually all AFib patients without contraindication be anticoagulated.\n\nCurrent 2014 Stroke guidelines recommend anticoagulation for virtually all patients with AFib unless contraindicated. DOACs (dabigatran, apixaban, rivaroxaban, edoxaban) are alternatives to warfarin (INR 2-3) and generally have lower ICH risk. DOACs should NOT be used with mechanical heart valves or valvular AF."
    difficulty: medium
    tags: [CHADS2, atrial fibrillation, anticoagulation, stroke prevention, neurology]
  - front: "What are the reversal agents for dabigatran and the Factor Xa inhibitors (apixaban, rivaroxaban)?"
    back: "Dabigatran: idarucizumab (Praxbind®). Apixaban and rivaroxaban: andexanet alfa (Andexanet®).\n\nReversal agents are essential for life-threatening bleeding or urgent surgery. Dabigatran is a direct thrombin inhibitor; idarucizumab is a monoclonal antibody fragment that binds dabigatran with high affinity. Andexanet alfa is a modified Factor Xa decoy protein that binds and sequesters Factor Xa inhibitors."
    difficulty: medium
    tags: [dabigatran, apixaban, rivaroxaban, reversal agents, anticoagulation, neurology]
  - front: "What does the NASCET trial conclude about carotid endarterectomy?"
    back: "Carotid endarterectomy clearly benefits symptomatic patients with severe (70-99%) carotid stenosis and to a lesser degree those with moderate (50-69%) stenosis. 2-year cumulative risk of ipsilateral stroke: 26% medical vs. 9% surgical (17% absolute risk reduction).\n\nNASCET (1991) established the benefit of carotid endarterectomy in symptomatic carotid stenosis. For asymptomatic stenosis >60%, endarterectomy reduces stroke risk by 1%/year but carries 5% complication risk, making it controversial. The CREST trial showed similar composite outcomes between carotid stenting and endarterectomy, but stenting has higher periprocedural stroke risk while endarterectomy has higher periprocedural MI risk."
    difficulty: medium
    tags: [carotid endarterectomy, NASCET, carotid stenosis, stroke prevention, neurology]
  - front: "What are the BP targets for primary prevention of stroke in hypertensive patients?"
    back: "<140/90 mmHg in general. sBP <120 mmHg for high-risk patients without DM (SPRINT trial). <130/80 mmHg for patients with DM or renal disease.\n\nFor secondary prevention, combination ACE inhibitor + thiazide diuretic is recommended in patients with previous stroke/TIA (PROGRESS trial). Ramipril 10 mg daily is effective in high-cardiovascular-risk patients (HOPE trial), reducing stroke risk by 32% (4.9% vs. 3.4%) beyond its antihypertensive effect."
    difficulty: medium
    tags: [hypertension, stroke prevention, blood pressure targets, SPRINT trial, neurology]
  - front: "What does the SPARCL trial conclude about statins after stroke or TIA?"
    back: "High-dose atorvastatin (80 mg/day) in patients with recent stroke/TIA and LDL 2.6-4.9 mmol/L reduced fatal or nonfatal stroke by 2.2% absolute risk reduction over 5 years (11.2% vs. 13.1%), though hemorrhagic stroke rates were higher with atorvastatin.\n\nSPARCL established statins for secondary stroke prevention. Target LDL <2 mmol/L (or 50% LDL reduction). Despite the increased hemorrhagic stroke risk, atorvastatin reduced overall stroke incidence. Lower doses are acceptable if high dose is intolerable. Statins are also recommended for primary prevention in patients with CAD or high cardiovascular risk."
    difficulty: medium
    tags: [statins, atorvastatin, SPARCL, stroke prevention, LDL, neurology]
  - front: "What are the most common sites for hypertensive intracerebral hemorrhage?"
    back: "Putamen, caudate nucleus, thalamus, cerebellum, and pons.\n\nHypertensive ICH (most common type of hemorrhagic stroke) is due to chronic arteriosclerosis predisposing vessels to focal necrosis and pseudoaneurysm formation. The specific locations correspond to the deep penetrating arteries most susceptible to hypertensive damage. Early seizure activity occurs in 5-25% of patients after ICH."
    difficulty: medium
    tags: [intracerebral hemorrhage, ICH, hypertension, hemorrhagic stroke, neurology]
  - front: "What are the BP targets for managing acute intracerebral hemorrhage (ICH) per 2020 Canadian Stroke Best Practice Guidelines?"
    back: "sBP <140-160 mmHg for the first 24-48 hours post-ICH is reasonable (based on 2020 Canadian Stroke Best Practice Guidelines). No conclusive BP target ranges exist, and the INTERACT2 trial showed intensive lowering (target <140 mmHg) did not significantly reduce death or severe disability but may improve functional outcomes.\n\nThe INTERACT2 trial randomized 2839 patients with spontaneous ICH to intensive BP treatment (target <140 mmHg within 1 hour) vs. guideline-based (<180 mmHg). While death/major disability did not significantly differ, functional outcomes slightly favored intensive treatment. Current guidelines recommend sBP <140-160 mmHg as reasonable."
    difficulty: medium
    tags: [intracerebral hemorrhage, blood pressure, ICH management, INTERACT2, neurology]
  - front: "What is cerebral venous sinus thrombosis (CVST) and what is its treatment?"
    back: "CVST involves thrombosis of cerebral venous sinuses presenting with headache alone, seizures, focal neurologic deficits, decreased LOC, or cranial nerve palsies. Diagnosis by CT venography or MR venography. Treatment: anticoagulation with heparin initially, then warfarin.\n\nCVST is an important differential for stroke and headache. Fever with decreased LOC, fluctuating symptoms, gradual onset, and absence of typical focal stroke signs suggest CVST. Unlike arterial stroke where anticoagulation is typically delayed, CVST is treated promptly with anticoagulation even in the presence of hemorrhagic infarction."
    difficulty: hard
    tags: [cerebral venous sinus thrombosis, CVST, anticoagulation, neurology]
  - front: "What is multiple sclerosis (MS) and what are the key epidemiological features?"
    back: "MS is an autoimmune chronic inflammatory disease of the CNS characterized by relapsing-remitting or progressive neurological symptoms due to inflammation, demyelination, and axonal degeneration. Onset 17-35 years; F:M = 3:1; global prevalence ~2.8 million; more common in regions with less sun exposure (Canada, Europe, US, New Zealand, SE Australia); linked to HLA-DRB1 gene and Epstein-Barr virus.\n\nCanada has one of the highest rates of MS in the world. MS has polygenetic susceptibility (HLA-DRB1), 30% concordance in monozygotic twins, and 2-4% risk in offspring of affected parents. Vitamin D insufficiency (less sun exposure) is a key environmental risk factor."
    difficulty: easy
    tags: [multiple sclerosis, MS epidemiology, HLA-DRB1, vitamin D, neurology]
  - front: "What are the four clinical patterns of MS?"
    back: "1. Relapsing-remitting MS (RRMS) — 85%: episodes of neurological dysfunction followed by recovery\n2. Primary progressive MS (PPMS) — 10%: progressive from onset, no relapses\n3. Secondary progressive MS (SPMS): initially RRMS, transitions to progressive course\n4. Progressive relapsing MS (PRMS) — 5%: progressive from onset with acute relapses\n\nMost RRMS eventually converts to SPMS. SPMS presents with progressive weakness and gait dysfunction with cerebellar findings. PPMS has poor prognosis, higher disability rates, and poor response to therapy. The Expanded Disability Status Scale (EDSS) scored 0-10 tracks disability progression."
    difficulty: easy
    tags: [MS patterns, RRMS, PPMS, SPMS, multiple sclerosis, neurology]
  - front: "What are the diagnostic criteria for MS (McDonald Criteria 2017)?"
    back: "Demonstration of dissemination in TIME and SPACE:\n- Time: ≥2 attacks (≥24h, ≥30 days apart), OR simultaneous gadolinium-enhancing + non-enhancing MRI lesions, OR new T2/gadolinium lesion on follow-up MRI, OR CSF oligoclonal bands.\n- Space: ≥1 T2 lesion in ≥2 of 4 CNS regions (periventricular, cortical/juxtacortical, infratentorial, spinal cord) OR second attack in different CNS region.\n\nThe McDonald criteria allow earlier diagnosis of MS using MRI and CSF findings. CSF oligoclonal bands are found in ~90% of MS patients. Clinically isolated syndrome (CIS) is the first episode suggestive of MS; early DMT reduces conversion to clinically definite MS."
    difficulty: medium
    tags: [McDonald criteria, MS diagnosis, MRI, oligoclonal bands, neurology]
  - front: "What are the classic MRI findings in MS?"
    back: "Hyperintense lesions on T2-weighted MRI in periventricular, corpus callosum (Dawson's fingers), cerebellar peduncles, brainstem, juxtacortical, and dorsolateral spinal cord regions. Active lesions enhance with gadolinium. T1 'black holes' indicate permanent axonal loss. Cranial MRI is more sensitive than spinal MRI.\n\nDawson's fingers are periventricular lesions extending perpendicular into the corpus callosum — highly characteristic of MS. Gadolinium enhancement indicates blood-brain barrier disruption in active inflammation. CSF shows oligoclonal bands in 90% and increased IgG. Evoked potentials show delayed but well-preserved waveforms."
    difficulty: medium
    tags: [MS MRI, Dawsons fingers, oligoclonal bands, multiple sclerosis, neurology]
  - front: "What are Lhermitte's sign and Uhthoff's phenomenon in MS?"
    back: "Lhermitte's sign: flexion of neck causes an electric shock sensation down the back into the limbs — suggestive of a dorsal cervical cord lesion. Uhthoff's phenomenon: worsening of MS symptoms in heat (fever, exercise, hot bath).\n\nBoth phenomena are highly characteristic of MS though not exclusive to it. Lhermitte's sign occurs because neck flexion stretches the demyelinated dorsal columns of the cervical spinal cord. Uhthoff's phenomenon occurs because elevated temperature impairs conduction in demyelinated axons, which have narrow safety margins for conduction."
    difficulty: medium
    tags: [Lhermittes sign, Uhthoff phenomenon, multiple sclerosis, demyelination, neurology]
  - front: "What is the treatment for an acute MS exacerbation?"
    back: "Methylprednisolone 1000 mg IV daily x 3-7 days (no taper required) OR prednisone 1000-1250 mg PO daily x 3-7 days (no taper required). If poor response to corticosteroids, consider plasma exchange.\n\nAn MS exacerbation is defined as new neurological symptoms lasting >24 hours in the absence of fever or infection. High-dose corticosteroids accelerate recovery but do not alter long-term outcomes. Plasma exchange (plasmapheresis) is an option for severe steroid-refractory relapses. Long-term vitamin D 4000 units daily is recommended."
    difficulty: medium
    tags: [MS relapse, methylprednisolone, MS treatment, plasma exchange, neurology]
  - front: "What are the first-line and second-line disease modifying therapies (DMTs) for relapsing MS?"
    back: "First-line: teriflunomide, interferon-β (Betaseron®, Avonex®, Rebif®), glatiramer acetate (Copaxone®), dimethyl fumarate (Tecfidera®). Second-line: natalizumab (Tysabri®), fingolimod (Gilenya®), ocrelizumab (Ocrevus®), alemtuzumab (Lemtrada®), cladribine (Mavenclad®), ofatumumab (Kesimpta®).\n\nFirst-line DMTs reduce relapse rate by ~30%; second-line by 50-90%. Natalizumab carries increased risk of progressive multifocal leukoencephalopathy (PML) caused by JC virus reactivation; PML risk also described with fingolimod, dimethyl fumarate, and ocrelizumab. PPMS is treated with ocrelizumab (ORATORIO trial); SPMS with siponimod (Mayzent®)."
    difficulty: medium
    tags: [MS DMT, disease modifying therapy, natalizumab, PML, multiple sclerosis, neurology]
  - front: "What is PML and which MS medication carries the highest risk?"
    back: "Progressive multifocal leukoencephalopathy (PML) is a serious opportunistic infection caused by JC virus reactivation causing demyelination and often fatal or severely disabling. The highest risk is with natalizumab (Tysabri®); also occurs with fingolimod, dimethyl fumarate, and ocrelizumab to a lesser degree.\n\nPML risk with natalizumab depends on JC virus antibody status, prior immunosuppressant use, and duration of therapy. JC antibody-positive patients on natalizumab >2 years have the highest risk. Monitoring JC antibody index helps risk stratify. PML must be distinguished from MS relapse clinically and radiologically."
    difficulty: hard
    tags: [PML, progressive multifocal leukoencephalopathy, natalizumab, JC virus, MS, neurology]
  - front: "What is Devic's disease (neuromyelitis optica spectrum disorder) and how does it differ from MS?"
    back: "NMO/Devic's: severe optic neuritis AND longitudinally extensive transverse myelitis extending >3 vertebral segments, aquaporin-4 (AQP4) antibody positive. Differs from MS in severity, aquaporin-4 antibody positivity, and the extent of spinal cord involvement.\n\nNMO is an MS variant that is aquaporin-4 IgG antibody-mediated targeting the water channel on astrocytes. It causes more severe relapses with less recovery than MS. MRI shows extensive spinal cord lesions (>3 vertebral segments) unlike MS (typically <2 segments). Treatment differs — some MS DMTs can worsen NMO."
    difficulty: hard
    tags: [NMO, neuromyelitis optica, Devics disease, aquaporin-4, MS variants, neurology]
  - front: "What are good prognostic indicators in MS?"
    back: "Female sex, age <40 at onset, RRMS subtype, presenting with optic neuritis, low MRI lesion burden on initial imaging, low early relapse rate, good recovery between exacerbations.\n\nPPMS carries the worst prognosis with higher disability rates and poor response to therapy. Male sex, older age at onset, progressive subtypes, high initial MRI burden, and incomplete recovery between relapses are poor prognostic indicators. EDSS tracks disability progression (scored 0-10)."
    difficulty: easy
    tags: [MS prognosis, RRMS, PPMS, optic neuritis, multiple sclerosis, neurology]
  - front: "What symptomatic treatments are used for MS-related spasticity, bladder dysfunction, and fatigue?"
    back: "Spasticity: baclofen, tizanidine, dantrolene, benzodiazepines, botulinum toxin. Bladder dysfunction: oxybutynin, mirabegron. Fatigue: amantadine, modafinil, methylphenidate. Pain: TCA, carbamazepine, gabapentin. Depression: psychotherapy, antidepressants, lithium.\n\nSymptomatic management is crucial for quality of life in MS. Baclofen (GABA-B agonist) is first-line for spasticity. Oxybutynin (anticholinergic) treats detrusor overactivity causing urgency/frequency. Fatigue, one of the most disabling MS symptoms, responds to amantadine or stimulants. Sexual dysfunction is treated with PDE5 inhibitors (sildenafil, tadalafil, vardenafil)."
    difficulty: medium
    tags: [MS symptoms, spasticity, baclofen, MS treatment, bladder dysfunction, neurology]
  - front: "What is the levodopa/carbidopa (Sinemet®) mechanism and what is the maximum recommended daily dose?"
    back: "Levodopa is a dopamine precursor that crosses the blood-brain barrier. Carbidopa is a peripheral DOPA decarboxylase inhibitor that prevents peripheral conversion of levodopa to dopamine, increasing CNS bioavailability and reducing peripheral side effects. Maximum: 200 mg carbidopa and 2000 mg levodopa per day.\n\nLevodopa remains the most effective treatment for Parkinson's disease motor symptoms. Long-term use causes motor fluctuations (wearing-off) and dyskinesias. Contraindicated with MAO inhibitors (within 14 days). Key side effects: nausea, hypotension, hallucinations, dyskinesias."
    difficulty: medium
    tags: [levodopa, carbidopa, Sinemet, Parkinsons disease, neurology]
  - front: "What are the contraindications to triptans (e.g., sumatriptan) for acute migraine?"
    back: "Hemiplegic/basilar migraine, ischemic heart disease, cardiovascular disease (CVD), uncontrolled hypertension, use of ergotamine or other 5-HT1 agonist within 24 hours, use of MAO inhibitor in last 14 days, severe hepatic disease.\n\nTriptans are selective 5-HT1B/1D receptor agonists that cause vasoconstriction and inhibit neuropeptide release. They are effective for moderate-to-severe migraine but are contraindicated in vascular disease due to coronary and peripheral vasospasm risk. Serotonin syndrome risk exists with concurrent MAOIs."
    difficulty: medium
    tags: [triptans, sumatriptan, migraine treatment, contraindications, neurology]
  - front: "Which antiepileptic drug is most teratogenic and what are its key indications?"
    back: "Valproic acid (valproate) is the most teratogenic antiseizure medication (ASM) with dose-dependent risk of neural tube defects and other congenital anomalies. It is indicated for partial and generalized seizures, and absence seizures.\n\nValproate is effective for multiple seizure types and was shown superior to topiramate and lamotrigine for generalized epilepsy in the SANAD trial. Despite its teratogenicity, it remains first-line for generalized epilepsy when alternatives are not suitable. Women of childbearing potential should be counselled about risks and offered folate supplementation. Key side effects: hepatic failure, alopecia, N/V, tremor, thrombocytopenia, pancreatitis, hyperammonemic encephalopathy."
    difficulty: medium
    tags: [valproic acid, teratogenicity, epilepsy treatment, antiepileptic, neurology]
  - front: "What are the characteristic side effects of phenytoin (Dilantin®)?"
    back: "Nystagmus, gingival hypertrophy, peripheral neuropathy, Stevens-Johnson syndrome/toxic epidermal necrolysis, SLE-type symptoms, blood dyscrasias, hypotension (IV), constipation, sedation, and teratogenicity.\n\nPhenytoin is a sodium channel blocker used for partial seizures, tonic-clonic seizures, and status epilepticus (IV loading dose 10-15 mg/kg). Gingival hypertrophy is a classic side effect unique to phenytoin. It has many drug interactions due to CYP-450 induction. Caution in pregnancy (teratogenic)."
    difficulty: medium
    tags: [phenytoin, Dilantin, antiepileptic, gingival hypertrophy, epilepsy, neurology]
  - front: "What seizure type is ethosuximide specifically indicated for?"
    back: "Absence seizures (childhood absence epilepsy).\n\nEthosuximide is a succinimide that blocks T-type calcium channels in thalamic neurons, which generate the 3Hz spike-wave discharges characteristic of absence seizures. It is NOT effective for generalized tonic-clonic or partial seizures. Valproate is an alternative for absence seizures and is preferred if generalized tonic-clonic seizures coexist."
    difficulty: easy
    tags: [ethosuximide, absence seizures, antiepileptic, epilepsy, neurology]
  - front: "What is the mechanism and key side effect profile of carbamazepine (Tegretol®)?"
    back: "Mechanism: sodium channel blocker. Indicated for partial seizures with or without secondary generalization and generalized tonic-clonic seizures. Key side effects: drowsiness, dizziness, nausea/vomiting, skin rash, agranulocytosis/aplastic anemia (rare), Stevens-Johnson syndrome. Contraindicated with MAO inhibitors (within 14 days) and history of bone marrow depression.\n\nCarbamazepine is also used for trigeminal neuralgia and bipolar disorder. It is a potent CYP3A4 inducer causing many drug interactions. It can cause hyponatremia (SIADH). Asian patients with HLA-B*1502 allele have dramatically increased risk of Stevens-Johnson syndrome — genetic testing recommended prior to starting."
    difficulty: medium
    tags: [carbamazepine, Tegretol, antiepileptic, Stevens-Johnson, epilepsy, neurology]
  - front: "What is the mechanism of pyridostigmine and what is it used for in neurology?"
    back: "Pyridostigmine (Mestinon®) is an acetylcholinesterase inhibitor that increases acetylcholine at the neuromuscular junction. Used for symptomatic treatment of myasthenia gravis. Dose: 60-1500 mg/day PO in 5-6 divided doses.\n\nIn myasthenia gravis, autoantibodies destroy acetylcholine receptors (AChR) at the NMJ. Pyridostigmine prevents ACh breakdown, increasing the probability of receptor activation. Side effects reflect cholinergic excess: N/V, diarrhea, abdominal cramps, increased secretions, miosis, diaphoresis, muscle cramps, fasciculations, and bradycardia. Overdose causes cholinergic crisis."
    difficulty: medium
    tags: [pyridostigmine, myasthenia gravis, acetylcholinesterase inhibitor, neuromuscular junction, neurology]
  - front: "What does the RE-LY trial conclude about dabigatran vs. warfarin for stroke prevention in AFib?"
    back: "Dabigatran 110 mg BID was non-inferior to warfarin for stroke/systemic embolism with less major bleeding. Dabigatran 150 mg BID was superior to warfarin in reducing stroke/systemic embolism (1.11% vs. 1.69%/yr) with similar major bleeding rates. Both doses lower ICH rates compared to warfarin.\n\nRE-LY (2009) enrolled 18,113 AFib patients. Dabigatran is a direct thrombin inhibitor requiring no INR monitoring. Lower dose (110 mg) prioritizes bleeding safety; higher dose (150 mg) prioritizes stroke prevention. Contraindicated in CrCl <30 mL/min and mechanical heart valves. Reversal: idarucizumab (Praxbind®)."
    difficulty: medium
    tags: [RE-LY trial, dabigatran, warfarin, atrial fibrillation, stroke prevention, neurology]
  - front: "What does the ARISTOTLE trial establish about apixaban vs. warfarin in atrial fibrillation?"
    back: "Apixaban was superior to warfarin for preventing stroke or systemic embolism (1.27% vs. 1.60%/yr; P<0.001 for non-inferiority, P=0.01 for superiority) with lower rates of major bleeding (2.13% vs. 3.09%) and death (3.52% vs. 3.94%) in AFib patients.\n\nARISTOTLE (2011) enrolled 18,201 AFib patients with ≥1 additional stroke risk factor. Apixaban is a Factor Xa inhibitor dosed 2.5 or 5 mg BID. It was the first DOAC to show superiority over warfarin in all three key outcomes (stroke, bleeding, mortality). This makes apixaban a preferred DOAC for many patients with AFib."
    difficulty: medium
    tags: [ARISTOTLE trial, apixaban, atrial fibrillation, stroke prevention, DOAC, neurology]
  - front: "What does the DAWN trial establish about thrombectomy timing in ischemic stroke?"
    back: "Endovascular thrombectomy performed 6-24 hours after stroke onset improved disability outcomes in patients with mismatch between clinical deficit and infarct size. 90-day functional independence: 49% thrombectomy vs. 13% control.\n\nDAWN (2018) enrolled 206 patients selected by clinical-radiological mismatch (large clinical deficit relative to small infarct core). The key criterion is that patients were last known well 6-24 hours earlier. This extended the thrombectomy window significantly. CT perfusion imaging is used to identify eligible patients (penumbra > core)."
    difficulty: medium
    tags: [DAWN trial, thrombectomy, stroke window, mechanical thrombectomy, neurology]
  - front: "What does the POINT trial establish about dual antiplatelet therapy in high-risk TIA or minor stroke?"
    back: "Clopidogrel + ASA (dual antiplatelet) reduces major ischemic events vs. ASA alone (5% vs. 6.5%; HR 0.75) in minor ischemic stroke or high-risk TIA, but increases major hemorrhage risk (0.9% vs. 0.4%) over 3 months.\n\nPOINT (2018) supports dual antiplatelet therapy with clopidogrel + ASA for 21 days in high-risk TIA or minor stroke (NIHSS <4), followed by antiplatelet monotherapy. This is consistent with Canadian guidelines recommending 21-day dual antiplatelet therapy. Prolonged dual therapy beyond 21 days increases bleeding without additional benefit."
    difficulty: medium
    tags: [POINT trial, dual antiplatelet, TIA, minor stroke, clopidogrel, neurology]
  - front: "What does the SAMMPRIS trial establish about intracranial stenting vs. medical management?"
    back: "Aggressive medical management alone is superior to percutaneous transluminal angioplasty and stenting (PTAS) for 70-99% symptomatic intracranial arterial stenosis. 30-day stroke/death: 14.7% PTAS vs. 5.8% medical management (P=0.002). 1-year primary endpoint: 20.0% PTAS vs. 12.2% medical (P=0.009).\n\nSAMMPRIS (2011) challenged the widespread use of intracranial stenting. The high periprocedural complication rate of PTAS (likely due to difficulty of the procedure and complexity of intracranial vasculature) made medical management the preferred strategy. Aggressive medical management included dual antiplatelet therapy, intensive risk factor control, and lifestyle modification."
    difficulty: medium
    tags: [SAMMPRIS trial, intracranial stenosis, stenting, stroke prevention, neurology]
  - front: "What does the HOPE trial establish about ACE inhibitors for stroke prevention?"
    back: "Ramipril 10 mg/day in high-cardiovascular-risk patients (≥55 years with vascular disease or DM + one other risk factor) reduced stroke risk by 32% (3.4% vs. 4.9%; RR 0.68; P<0.001), MI/stroke/CV mortality by 26%, and all-cause mortality by 16% over 5 years.\n\nHOPE (2000) enrolled 9297 patients and showed ramipril benefits extend beyond blood pressure lowering — the stroke risk reduction was greater than expected from BP reduction alone, suggesting direct vascular protective effects. ACE inhibitors + thiazide diuretic combination is recommended for secondary stroke prevention (PROGRESS trial)."
    difficulty: medium
    tags: [HOPE trial, ramipril, ACE inhibitor, stroke prevention, cardiovascular risk, neurology]
  - front: "What is the SANAD trial conclusion regarding antiepileptic drugs for generalized epilepsy?"
    back: "Valproate should remain first-line therapy for generalized and unclassified epilepsies due to superior efficacy and safety compared to topiramate and lamotrigine. Valproate was significantly better than topiramate for time to treatment failure and better than lamotrigine for time to 12-month remission.\n\nSANAD compared valproate, lamotrigine, and topiramate. Despite valproate's superior efficacy, its teratogenicity limits use in women of childbearing potential. In such patients, lamotrigine or levetiracetam may be preferred. The MESS trial showed immediate antiepileptic treatment reduces early seizures but does not affect long-term remission."
    difficulty: medium
    tags: [SANAD trial, valproate, lamotrigine, topiramate, generalized epilepsy, neurology]
  - front: "What are the indications for topiramate in migraine prophylaxis and what are its major side effects?"
    back: "Indication: migraine prophylaxis. Contraindicated in nephrolithiasis. Major side effects: sedation, mood disturbance, cognitive dysfunction ('dopamax'), anorexia, nausea, diarrhea, paresthesias, metabolic acidosis, glaucoma, Stevens-Johnson syndrome, toxic epidermal necrolysis.\n\nTopiramate (Topamax®) is also used as an antiseizure medication. Starting dose is 25 mg PO in the evening, titrated to 50 mg BID. Its mechanism includes sodium channel blockade, GABA-A potentiation, and glutamate AMPA/kainate receptor inhibition. The cognitive side effects ('dopamax') are particularly limiting for patients requiring mental clarity."
    difficulty: medium
    tags: [topiramate, migraine prophylaxis, antiepileptic, side effects, neurology]
  - front: "What is the contraindication and key side effect profile of propranolol for migraine prophylaxis?"
    back: "Contraindications: uncompensated CHF, severe bradycardia or heart block, severe COPD or asthma. Side effects: fatigue, cognitive dysfunction, disturbed sleep, rashes, dyspepsia, dry eyes, heart failure, bronchospasm, risk of acute tachycardia and HTN on abrupt withdrawal.\n\nPropranolol (Inderal®) is a non-selective beta-blocker used for migraine prophylaxis (80-240 mg/day) and essential tremor. Its migraine mechanism is incompletely understood but may involve beta-adrenergic blockade, serotonergic effects, and inhibition of nitric oxide synthesis. Abrupt discontinuation can trigger rebound HTN and tachycardia."
    difficulty: medium
    tags: [propranolol, migraine prophylaxis, beta-blocker, contraindications, neurology]
  - front: "What is the correct dosing of acetylcholinesterase inhibitor donepezil for Alzheimer's disease and what are its contraindications?"
    back: "Donepezil (Aricept®): 5 mg PO once daily, may increase to 10 mg PO once daily after 4-6 weeks. Contraindicated in hypersensitivity to donepezil or piperidine derivatives. Side effects: diarrhea, N/V, insomnia, muscle cramps, fatigue, anorexia, HTN, syncope, AV block.\n\nDonepezil is indicated for mild to moderate Alzheimer's disease and dementia with Lewy bodies. It inhibits acetylcholinesterase, increasing acetylcholine at cholinergic synapses in the basal forebrain. CATIE-AD trial showed atypical antipsychotics (olanzapine, quetiapine, risperidone) used for behavioral symptoms in Alzheimer's cause faster cognitive decline vs. placebo."
    difficulty: easy
    tags: [donepezil, Aricept, Alzheimers disease, cholinesterase inhibitor, dementia, neurology]
  - front: "What does the CATIE-AD trial conclude about atypical antipsychotics in Alzheimer's disease?"
    back: "Long-term use of atypical antipsychotics (olanzapine, quetiapine, risperidone) for behavioral symptoms and psychosis in Alzheimer's dementia is associated with greater rates of cognitive decline compared to placebo (MMSE decline -0.067/week vs. -0.007/week).\n\nCATIE-AD (2011) enrolled 421 outpatients with Alzheimer's and psychosis/agitation randomized to atypical antipsychotics or placebo. Despite being used commonly for behavioral disturbances, the cognitive harm suggests these agents should be reserved for situations where non-pharmacological approaches fail and risk-benefit is carefully considered. Atypical antipsychotics also carry a black box warning for increased mortality in elderly dementia patients."
    difficulty: medium
    tags: [CATIE-AD, Alzheimers disease, atypical antipsychotics, cognitive decline, dementia, neurology]
  - front: "What are the DOAC options for stroke prevention in atrial fibrillation and which patients should NOT receive DOACs?"
    back: "DOACs: dabigatran (110 or 150 mg PO BID), apixaban (2.5 or 5 mg PO BID), rivaroxaban (15 or 20 mg PO once daily), edoxaban (30 or 60 mg once daily). DOACs should NOT be used in: patients with mechanical heart valves OR AF with valvular heart disease (mitral stenosis).\n\nDOACs offer predictable pharmacokinetics, no INR monitoring, fewer drug/food interactions, and generally lower ICH risk compared to warfarin. The RE-LY (dabigatran), ARISTOTLE (apixaban), ROCKET AF (rivaroxaban) and ENGAGE AF (edoxaban) trials all established DOAC non-inferiority or superiority to warfarin. Warfarin (INR 2-3) remains standard for mechanical heart valves."
    difficulty: medium
    tags: [DOAC, atrial fibrillation, stroke prevention, mechanical valve, anticoagulation, neurology]
  - front: "What does the ROCKET AF trial establish about rivaroxaban vs. warfarin in AFib?"
    back: "Rivaroxaban (20 mg once daily) was non-inferior to warfarin for prevention of stroke or systemic embolism (1.7% vs. 2.2%/yr), with significantly lower rates of intracranial hemorrhage (0.5% vs. 0.7%) and fatal bleeding (0.2% vs. 0.5%) in non-valvular AFib.\n\nROCKET AF (2011) enrolled 14,264 patients with non-valvular AFib at increased stroke risk. Rivaroxaban demonstrated non-inferiority (not superiority) to warfarin for stroke prevention. Its major advantage is the once-daily dosing improving compliance. Contraindicated with concomitant anticoagulants, severe hepatic disease, pregnancy, and strong CYP3A4/P-glycoprotein inhibitors."
    difficulty: medium
    tags: [ROCKET AF, rivaroxaban, warfarin, atrial fibrillation, stroke prevention, neurology]
  - front: "What is the PreCISe trial conclusion about glatiramer acetate in clinically isolated syndrome (CIS)?"
    back: "Early treatment with glatiramer acetate (20 mg SC/day) in CIS patients with ≥2 T2 brain lesions reduced the risk of converting to clinically definite MS by 45% (HR 0.55; P=0.0005) and prolonged time to conversion by 115% compared to placebo.\n\nPreCISe (2009) enrolled 481 CIS patients and established early DMT benefit. In CIS, first-line DMTs including glatiramer acetate, interferons, and teriflunomide all have RCT data supporting early treatment. The most common adverse events with glatiramer acetate are injection-site reactions and immediate post-injection reactions (transient chest pain, flushing)."
    difficulty: medium
    tags: [PreCISe trial, glatiramer acetate, CIS, clinically isolated syndrome, MS prevention, neurology]
  - front: "What are the systemic hypoperfusion (global cerebral ischemia) watershed areas susceptible to stroke?"
    back: "Watershed (border zone) areas between the major cerebral arterial territories — typically between the ACA-MCA territory and MCA-PCA territory on the cortical surface, and between the deep penetrating arteries and cortical branches (internal watershed).\n\nSystemic hypoperfusion occurs when cardiac output is insufficient (cardiac arrest, arrhythmia, MI) causing ischemia in the most distal territory from the major arteries — the watershed zones. Classic presentation: bilateral proximal arm weakness (the 'man-in-a-barrel' syndrome from anterior and posterior watershed infarcts), cortical blindness, and cognitive deficits."
    difficulty: hard
    tags: [watershed infarct, global cerebral ischemia, cardiac arrest, stroke, neurology]
  - front: "A 68-year-old with known atrial fibrillation presents with sudden left-sided weakness, left facial droop, and gaze deviation to the right. NIHSS is 16. NCHCT shows no hemorrhage. What is the most likely diagnosis and next step?"
    back: "Right MCA ischemic stroke (cardioembolic from AFib). NIHSS 16 = moderate-to-severe stroke. Urgent CT angiography to evaluate for large vessel occlusion; administer IV tPA within 4.5 h of symptom onset if no contraindications; proceed to mechanical thrombectomy if proximal large vessel occlusion confirmed.\n\nGaze deviation is TOWARD the side of the lesion (away from weakness) in supratentorial stroke. Left-sided weakness + left facial droop + rightward gaze = right hemisphere involvement = right MCA territory. NIHSS 16 = moderate-to-severe. The clinical scenario calls for CODE STROKE activation: CT head (no hemorrhage), CT angiography, then tPA + thrombectomy as per current standard of care."
    difficulty: hard
    tags: [MCA stroke, code stroke, tPA, thrombectomy, atrial fibrillation, neurology]
  - front: "What is the ECASS3 trial and what does it establish about tPA timing?"
    back: "ECASS3 (2008) demonstrated that IV alteplase (0.9 mg/kg) given 3-4.5 hours after acute ischemic stroke onset improved clinical outcomes (favorable outcome 52.4% vs. 45.2%; OR 1.34) compared to placebo, despite higher intracranial hemorrhage rates (27.0% vs. 17.6%). No significant mortality difference.\n\nECASS3 extended the tPA window from 3 hours (NINDS trial) to 4.5 hours. Key exclusions in the 3-4.5 hour window include: age >80, NIHSS >25, prior stroke + DM, and anticoagulant use. The modest but significant benefit must be weighed against the increased ICH risk. Current Canadian guidelines support tPA within 4.5 hours."
    difficulty: medium
    tags: [ECASS3, tPA, alteplase, 4.5 hour window, stroke thrombolysis, neurology]
  - front: "What is the target smoking cessation timeline after which stroke risk returns to baseline?"
    back: "After smoking cessation, the risk of stroke decreases to baseline within 2-5 years.\n\nSmoking increases stroke risk in a dose-dependent manner (primary prevention). For secondary prevention, a combination of pharmacological therapy (e.g., varenicline, bupropion, NRT) and behavioural therapy should be offered. The 2-5 year timeline to return to baseline stroke risk underscores the importance of counselling stroke patients about smoking cessation."
    difficulty: easy
    tags: [smoking cessation, stroke prevention, risk factors, neurology]
  - front: "What are the secondary prevention HbA1c and glucose targets in diabetic stroke patients?"
    back: "HbA1c <7%, fasting blood glucose 4-7 mmol/L, 2-hour postprandial plasma glucose target 5-10 mmol/L.\n\nBoth Type 1 and Type 2 diabetes are independent risk factors for ischemic stroke, particularly lacunar stroke. Glycemic control reduces microvascular complications and contributes to stroke risk reduction. During acute stroke, hyperglycemia should be avoided as it increases infarct size."
    difficulty: easy
    tags: [diabetes, HbA1c, stroke prevention, glucose targets, neurology]
