# Gr 9 Maths CAPS — numbers / Properties of Numbers
deck: "Corpus::Gr9 Maths::Properties of Numbers"
notes:
  - guid: a1f3c9e072b4d68a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "State the commutative property of addition and give an example."
      Back: "Commutative property of addition: the ORDER of the numbers does not change the sum.\na + b = b + a\nExample: 7 + 3 = 3 + 7 = 10.\n∴ You may swap the order of numbers being ADDED."
    tags: ["commutative-property", "subject:numbers"]
  - guid: b2e4d0a183c5e79b
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "State the commutative property of multiplication and give an example."
      Back: "Commutative property of multiplication: the ORDER of the factors does not change the product.\na × b = b × a\nExample: 4 × 6 = 6 × 4 = 24.\n∴ You may swap the order of numbers being MULTIPLIED."
    tags: ["commutative-property", "subject:numbers"]
  - guid: c3f5e1b294d6f8ac
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Is subtraction commutative? Is division commutative? Show why not."
      Back: "NO — neither subtraction nor division is commutative.\nSubtraction: 8 − 3 = 5 but 3 − 8 = −5, so 8 − 3 ≠ 3 − 8.\nDivision: 12 ÷ 4 = 3 but 4 ÷ 12 = ⅓, so 12 ÷ 4 ≠ 4 ÷ 12.\n∴ Order MATTERS for − and ÷."
    tags: ["commutative-property", "subject:numbers"]
  - guid: d4061f2305e709bd
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "State the associative property of addition with an example."
      Back: "Associative property of addition: the GROUPING (brackets) does not change the sum.\n(a + b) + c = a + (b + c)\nExample: (2 + 5) + 4 = 7 + 4 = 11 and 2 + (5 + 4) = 2 + 9 = 11.\n∴ Same answer regardless of which pair you add first."
    tags: ["associative-property", "subject:numbers"]
  - guid: e5172a3416f810ce
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "State the associative property of multiplication with an example."
      Back: "Associative property of multiplication: the GROUPING (brackets) does not change the product.\n(a × b) × c = a × (b × c)\nExample: (3 × 2) × 5 = 6 × 5 = 30 and 3 × (2 × 5) = 3 × 10 = 30.\n∴ Same product regardless of which pair you multiply first."
    tags: ["associative-property", "subject:numbers"]
  - guid: f6283b4527a921df
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Is subtraction associative? Show a counterexample."
      Back: "NO — subtraction is NOT associative.\n(10 − 4) − 2 = 6 − 2 = 4\n10 − (4 − 2) = 10 − 2 = 8\nSince 4 ≠ 8, (a − b) − c ≠ a − (b − c).\n∴ Where you place brackets changes the answer for −."
    tags: ["associative-property", "subject:numbers"]
  - guid: 07394c5638ba32e0
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Is division associative? Show a counterexample."
      Back: "NO — division is NOT associative.\n(24 ÷ 6) ÷ 2 = 4 ÷ 2 = 2\n24 ÷ (6 ÷ 2) = 24 ÷ 3 = 8\nSince 2 ≠ 8, (a ÷ b) ÷ c ≠ a ÷ (b ÷ c).\n∴ Brackets matter for ÷."
    tags: ["associative-property", "subject:numbers"]
  - guid: 184a5d6749cb43f1
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "State the distributive property of multiplication over addition."
      Back: "Distributive property: a(b + c) = ab + ac.\nMultiply the outside number by EACH term inside the brackets.\nExample: 3(x + 4) = 3·x + 3·4 = 3x + 12."
    tags: ["distributive-property", "subject:numbers"]
  - guid: 295b6e785adc5402
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Expand using the distributive property: 5(2x + 3)."
      Back: "Multiply 5 by each term inside the brackets:\n5(2x + 3) = 5·2x + 5·3 = 10x + 15.\n∴ 5(2x + 3) = 10x + 15."
    tags: ["distributive-property", "subject:numbers"]
  - guid: 3a6c7f896bed6513
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Distributive property over SUBTRACTION: expand 4(3x − 5)."
      Back: "a(b − c) = ab − ac. Distribute the 4 to BOTH terms, keeping the sign:\n4(3x − 5) = 4·3x − 4·5 = 12x − 20.\nCommon mistake: forgetting to multiply the second term, giving 12x − 5. WRONG.\n∴ 4(3x − 5) = 12x − 20."
    tags: ["distributive-property", "subject:numbers"]
  - guid: 4b7d80907cfe7624
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Expand with a NEGATIVE outside the bracket: −2(x − 6)."
      Back: "Distribute −2 to each term, watching the signs (negative × negative = positive):\n−2(x − 6) = −2·x + (−2)·(−6) = −2x + 12.\nCommon mistake: writing −2x − 12. WRONG — the second sign flips.\n∴ −2(x − 6) = −2x + 12."
    tags: ["distributive-property", "subject:numbers"]
  - guid: 5c8e91a18d0f8735
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Use the distributive property for easy mental maths: 6 × 47."
      Back: "Break 47 into (40 + 7) and distribute:\n6 × 47 = 6(40 + 7) = 6·40 + 6·7 = 240 + 42 = 282.\n∴ Distribution makes large multiplications easier."
    tags: ["distributive-property", "subject:numbers"]
  - guid: 6d9fa2b29e1f9846
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "What is the additive identity? State the rule."
      Back: "The additive identity is 0.\nAdding 0 to any number leaves it unchanged:\na + 0 = a and 0 + a = a.\nExample: 17 + 0 = 17."
    tags: ["identity-element", "subject:numbers"]
  - guid: 7e0ab3c30f2ea957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "What is the multiplicative identity? State the rule."
      Back: "The multiplicative identity is 1.\nMultiplying any number by 1 leaves it unchanged:\na × 1 = a and 1 × a = a.\nExample: 23 × 1 = 23."
    tags: ["identity-element", "subject:numbers"]
  - guid: 8f1bc4d4103fba68
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "What is the additive inverse of a number? Give the rule and an example."
      Back: "The additive inverse of a is −a — the number you ADD to get 0.\na + (−a) = 0.\nExample: the additive inverse of 7 is −7, because 7 + (−7) = 0.\nThe additive inverse of −5 is 5, because −5 + 5 = 0."
    tags: ["inverse-element", "subject:numbers"]
  - guid: 902cd5e5214acb79
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "What is the multiplicative inverse (reciprocal)? Give the rule and examples."
      Back: "The multiplicative inverse of a is 1/a — the number you MULTIPLY by to get 1.\na × 1/a = 1 (a ≠ 0).\nExample: the reciprocal of 5 is ⅕, because 5 × ⅕ = 1.\nThe reciprocal of ⅔ is 3/2, because ⅔ × 3/2 = 1.\nNote: 0 has NO multiplicative inverse."
    tags: ["inverse-element", "subject:numbers"]
  - guid: a13de6f63205dc8a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "What does BODMAS stand for and what is the order of operations?"
      Back: "BODMAS gives the order to work out a calculation:\nB — Brackets\nO — Of / Orders (exponents, roots)\nD — Division\nM — Multiplication\nA — Addition\nS — Subtraction\nKey rule: Division and Multiplication rank EQUALLY (left to right); Addition and Subtraction rank EQUALLY (left to right)."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: b24ef7074316ed9b
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Work out using BODMAS: 5 + 3 × 4."
      Back: "Multiplication before addition:\n5 + 3 × 4 = 5 + 12 = 17.\nCommon mistake: working left to right gives 8 × 4 = 32. WRONG.\n∴ 5 + 3 × 4 = 17."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: c35008185427fe0c
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Work out using BODMAS: 2 × (3 + 4)² − 6."
      Back: "Step 1 Brackets: (3 + 4) = 7\nStep 2 Orders (exponent): 7² = 49\nStep 3 Multiplication: 2 × 49 = 98\nStep 4 Subtraction: 98 − 6 = 92.\n∴ 2 × (3 + 4)² − 6 = 92."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: d4611929653801fd
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Work out using BODMAS: 20 ÷ 4 + 2 × 3."
      Back: "Do ÷ and × first (left to right), then add:\n20 ÷ 4 = 5 and 2 × 3 = 6\n5 + 6 = 11.\nCommon mistake: doing 20 ÷ (4 + 2) first. WRONG — there are no brackets there.\n∴ 20 ÷ 4 + 2 × 3 = 11."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: e572202a7649020e
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "Work out using BODMAS: 18 − 12 ÷ (2 + 1) + 4²."
      Back: "Step 1 Brackets: (2 + 1) = 3\nStep 2 Orders: 4² = 16\nStep 3 Division: 12 ÷ 3 = 4\nStep 4 left to right (− then +): 18 − 4 + 16 = 14 + 16 = 30.\n∴ 18 − 12 ÷ (2 + 1) + 4² = 30."
    tags: ["order-of-operations", "subject:numbers"]
  - guid: f683313b875a031f
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Properties of Numbers"
    fields:
      Front: "BODMAS pitfall: explain why 10 − 4 − 3 is NOT 9."
      Back: "Addition and subtraction are done LEFT TO RIGHT, not subtraction-of-everything-grouped.\n10 − 4 − 3 = (10 − 4) − 3 = 6 − 3 = 3.\nCommon mistake: grouping as 10 − (4 − 3) = 10 − 1 = 9. WRONG.\n∴ 10 − 4 − 3 = 3."
    tags: ["order-of-operations", "subject:numbers"]
