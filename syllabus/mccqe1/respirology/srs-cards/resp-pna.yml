  - front: "What is the cause of head lice and pubic lice?"
    back: "Head lice: Pediculus humanus capitis; Pubic lice (crabs): Phthirus pubis\n\nThese are two different species of parasitic lice affecting different body areas."
    difficulty: easy
    tags: [dermatology, parasites, lice, microbiology, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What herbs and supplements have been associated with drug-induced liver injury?"
    back: "Khat, chaparral leaf, Chinese herbs (germander, comfrey, bush tea), weight loss supplements (green tea extract), body-building supplements\n\nVarious herbal and dietary supplements can cause hepatotoxicity, ranging from cholestasis to acute liver failure."
    difficulty: easy
    tags: [DILI, herbs, hepatotoxicity, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the signs and symptoms of hypercapnia?"
    back: "Confusion, headache, dyspnea, drowsiness, asterixis, warm periphery, chemosis, plethora, increased ICP (secondary to vasodilatation)\n\nHypercapnia (elevated PaCO2) causes CO2 narcosis. The symptoms result from CO2-induced cerebral vasodilation and acidosis."
    difficulty: easy
    tags: [hypercapnia, signs and symptoms, clinical presentation, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "What defines hypercapnic respiratory failure?"
    back: "PaCO2 increased, PaO2 decreased (Type II respiratory failure)\n\nHypercapnic respiratory failure is also called Type II. The low PaO2 results from hypoventilation and V/Q mismatch."
    difficulty: easy
    tags: [hypercapnic respiratory failure, type II respiratory failure, definitions, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "When should ventilation be considered for hypercapnic respiratory failure?"
    back: "PaCO2 >50 mmHg and pH <7.35\n\nThis indicates acute on chronic hypercapnic respiratory failure with acidosis requiring ventilatory support."
    difficulty: easy
    tags: [hypercapnia, ventilation, indications, critical care, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "What are the direct lung injury causes of ARDS?"
    back: "Aspiration (gastric contents, drowning), pneumonia, inhalation injury (oxygen toxicity, nitrogen dioxide, smoke), embolism (fat, amniotic fluid), reperfusion injury\n\nDirect injuries affect the lung directly, causing damage to alveolar epithelium and capillary endothelium."
    difficulty: medium
    tags: [ARDS, etiology, direct lung injury, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "What happens during the exudative phase of ARDS (first 7 days)?"
    back: "Alveolar capillary endothelial cells and type I pneumocytes are injured, causing loss of the normally tight alveolar barrier. Patients develop dyspnea, tachypnea, increased work of breathing, leading to respiratory fatigue and failure\n\nThis is the acute phase where the injury is fresh and alveolar damage is predominant."
    difficulty: medium
    tags: [ARDS, clinical course, exudative phase, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "What happens during the fibroproliferative phase of ARDS (after day 7)?"
    back: "Most patients improve and wean off ventilation. Some develop fibrotic lung changes requiring long-term supplemental oxygen or ventilation. If fibrosis develops, mortality increases\n\nThis is the recovery or progression phase. Fibrosis is a poor prognostic sign."
    difficulty: medium
    tags: [ARDS, clinical course, fibroproliferative phase, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "Compare gout vs pseudogout: crystal type and birefringence"
    back: "Gout: monosodium urate crystals, negative birefringence (yellow when parallel), needle-shaped. Pseudogout: calcium pyrophosphate crystals, positive birefringence (blue when parallel), rhomboid-shaped\n\nPolarized microscopy is the definitive diagnostic test to differentiate these crystal arthropathies."
    difficulty: hard
    tags: [gout, pseudogout, CPPD, diagnosis, comparison, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What is the treatment for indirect inguinal hernia?"
    back: "Surgical repair (herniorrhaphy or hernioplasty)\n\nHernias do not resolve spontaneously. Surgical repair is indicated for symptomatic hernias or to prevent strangulation."
    difficulty: easy
    tags: [urology, hernia, treatment, toronto-notes, pages-1561-1562-1563-1564-1565-1566-1567-1568-1569-1570]
