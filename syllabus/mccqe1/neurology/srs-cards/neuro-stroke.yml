  - front: "What was the primary finding of the ACCORD BP trial regarding intensive BP control (<120 mmHg) vs standard (<140 mmHg) in T2DM patients?"
    back: "No significant reduction in major CV events, but significant reduction in stroke (0.32%/yr vs 0.53%/yr, P=0.01)\n\nIntensive BP lowering reduced stroke risk but not overall major CV events. It increased serious adverse events (3.3% vs 1.27%, P<0.001)."
    difficulty: hard
    tags: [T2DM, blood pressure, stroke, ACCORD, cardiovascular, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Did intensive BP control (<120 mmHg) in T2DM patients reduce major CV events?"
    back: "No significant reduction in major CV events, but there was a significant reduction in any stroke (0.32%/yr vs. 0.53%/yr, P=0.01) and nonfatal stroke (0.30%/yr vs. 0.47%/yr, P=0.03)\n\nThe ACCORD BP trial found intensive therapy required more medications (3.4 vs. 2.1 at 1 year) and had more serious adverse events (3.3% vs. 1.27%, P<0.001), but no reduction in major CV events or all-cause mortality."
    difficulty: hard
