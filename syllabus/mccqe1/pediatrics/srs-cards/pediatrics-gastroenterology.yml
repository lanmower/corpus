# Pediatrics Gastroenterology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the red flag symptoms of vomiting in pediatric patients?"
    back: "Non-specific red flags: prolonged vomiting (>12h in neonates, >24h in children <2yr, >48h in children >2yr), profound lethargy, significant weight loss. GI obstruction/disease: bilious vomit, projectile vomit, hematemesis, hematochezia, marked abdominal distension, peritoneal signs. Neurological/systemic: bulging fontanelle, headache, positional triggers, altered consciousness, focal neurologic deficits, history/signs of trauma, hypotension disproportionate to illness, hyponatremia with hyperkalemia.\n\nVomiting without diarrhea is NOT always gastroenteritis—consider DKA, increased ICP, pyloric stenosis (non-bilious projectile), or inborn errors of metabolism. Bilious vomiting in a neonate is a surgical emergency until proven otherwise."
    difficulty: medium
    tags: [pediatrics, vomiting, red flags, bilious emesis, increased ICP]
  - front: "What are the key distinguishing features and diagnostic approach for pyloric stenosis in a neonate?"
    back: "Pyloric stenosis: projectile non-bilious emesis within 30 minutes after feeding; fatigue, dehydration; palpable 'olive' in RUQ; decreased stools; hungry infant after vomiting. Investigations: CBC, electrolytes, Cr, BUN, ABG (hypokalemic, hypochloremic metabolic alkalosis); ultrasound of pylorus (first-line); upper GI study if US nondiagnostic.\n\nThe classic metabolic picture is hypokalemic hypochloremic metabolic alkalosis due to loss of HCl from gastric juice. The 'olive' is felt on exam in ~70–90% of cases. Ultrasound is the diagnostic gold standard (pyloric muscle thickness ≥4mm, channel length ≥16mm)."
    difficulty: medium
    tags: [pediatrics, pyloric stenosis, projectile vomiting, metabolic alkalosis, ultrasound]
  - front: "What is the classic presentation and diagnostic approach for intussusception in a child?"
    back: "Classic triad: 1. Colicky progressive abdominal pain with drawing of legs up to chest; 2. Lethargy; 3. Bloody 'red currant jelly' stool. Investigations: abdominal ultrasound (diagnostic); AXR (rule out other etiologies and perforation).\n\nIntussusception is most common between 6 months and 2 years of age. The red currant jelly stool is a late sign caused by mucosal ischemia. Air or hydrostatic enema via fluoroscopy or ultrasound guidance is both diagnostic and therapeutic if no peritonitis/perforation."
    difficulty: easy
    tags: [pediatrics, intussusception, red currant jelly stool, abdominal pain, gastroenterology]
  - front: "What are the clinical features of neonatal GERD vs. GERD in older children/adolescents?"
    back: "Infants with GERD: poor weight gain, irritability, sleep disturbance, respiratory symptoms (coughing, choking, wheezing). Older children/adolescents: abdominal pain/heartburn, dysphagia, asthma, recurrent pneumonia/upper respiratory infections (if aspirating), recurrent otitis media, upper airway symptoms (chronic cough, hoarseness), dental erosions, weight loss, nocturnal vomiting.\n\nGER is extremely common in infancy (up to 50%) but is only GERD when it causes troublesome symptoms or complications. Respiratory symptoms in infants may be the only presentation of GERD. In adolescents, the presentation mimics adult GERD."
    difficulty: easy
    tags: [pediatrics, GERD, reflux, infants, respiratory symptoms]
  - front: "What is the management of GERD in infants and children?"
    back: "Conservative (infants): thickened feeds, smaller/more frequent feeds, head elevation, hydrolyzed protein or amino-acid based formula; breastfeeding mothers: sequential elimination diet (milk, beef, soy, egg). Older children: lifestyle changes + PPIs as in adults. Medical: PPI or H2-blocker when conservative measures fail, moderate-severe disease, or biopsy-proven esophagitis. NOT recommended: acid suppressants/motility agents for uncomplicated infant reflux; D2 antagonists (domperidone, metoclopramide) generally not recommended for GERD. Surgical: Nissen fundoplication; gastrojejunal tube for post-pyloric feeds (failure of medical therapy or multisystem comorbidity).\n\nAcid suppressants and motility agents are not recommended for uncomplicated GER in infants due to lack of benefit and potential harm. Several recommendations must be used cautiously in preterm infants given higher risk of NEC."
    difficulty: medium
    tags: [pediatrics, GERD, PPI, Nissen fundoplication, management]
  - front: "What is the definition of diarrhea in pediatrics, and what are the major pathophysiological mechanisms?"
    back: "Definition: infants — increase in stool frequency to twice as often per day; older children — 3+ loose or watery stools/day. Acute: <2 weeks; chronic: >2 weeks. Pathophysiology: 1. Osmotic — non-absorbable solutes in GI tract (e.g., lactose intolerance); 2. Secretory — increased Cl- and water secretion into intestinal lumen (e.g., bacterial toxin); 3. Malabsorption — increased motility or fewer villi (e.g., short bowel syndrome).\n\nDifferentiating the mechanism helps guide management. Osmotic diarrhea stops with fasting; secretory diarrhea persists despite fasting. In the MCCQE1 context, recognizing chronic diarrhea red flags (poor growth, bloody stool, recurrent hospitalizations) is critical for identifying serious underlying pathology."
    difficulty: medium
    tags: [pediatrics, diarrhea, osmotic, secretory, malabsorption]
  - front: "What are the key differential diagnoses for chronic diarrhea in different pediatric age groups?"
    back: "0–3 months (no FTT): GI infection, toddler's diarrhea. With FTT: food protein-induced allergic proctocolitis (FPIAP), CF, Hirschsprung's disease. 3 months–3 years: GI infection, lactase deficiency, disaccharidase deficiency. 3–18 years: GI infection, celiac disease, IBD. Uncommon: short bowel syndrome, Shwachman-Diamond syndrome, HIV, autoimmune enteropathy, eosinophilic gastroenteritis, endocrine causes (thyrotoxicosis, Addison's), neoplastic (pheochromocytoma, lymphoma).\n\nCeliac disease and IBD are high-yield causes of chronic diarrhea in older children. Celiac screen (anti-tTG IgA + total IgA) and IBD panel are important workup steps. CF should be considered in infants with FTT and malabsorption."
    difficulty: hard
    tags: [pediatrics, chronic diarrhea, celiac disease, IBD, CF, differential diagnosis]
  - front: "What is the approach to investigation of acute versus chronic diarrhea in pediatric patients?"
    back: "Acute diarrhea (well child, non-bloody): often no investigations needed. If indicated: stool C&S, O&P, electron microscopy for viruses, C. difficile toxin, stool multiplex PCR, blood/urine cultures, CBC, electrolytes, BUN, Cr, glucose, abdominal imaging. Chronic diarrhea (growing well): limited workup (stool cultures, stool reducing substances). Red flags (poor growth, bloody stool, vomiting, recurrent hospitalizations): full workup including endoscopy, small bowel biopsy, sweat chloride, celiac screen, thyroid function, urine VMA/HVA.\n\nMicrobiologic testing for gastroenteritis is indicated for immunocompromised hosts, bloody or mucusy stool, persistent diarrhea >7 days, international travel, or exposure to unsafe foods/farm animals/untreated water."
    difficulty: medium
    tags: [pediatrics, diarrhea, investigations, stool culture, celiac, workup]
  - front: "Which antibiotics are most commonly associated with Clostridioides difficile (C. diff) infection in pediatrics?"
    back: "Fluoroquinolones, clindamycin, broad-spectrum cephalosporins, and broad-spectrum penicillins (e.g., amoxicillin-clavulanate) are most commonly associated with C. difficile infection.\n\nC. difficile should be considered when diarrhea occurs following recent antibiotic use. Diagnosis: C. difficile toxin A/B assay or stool multiplex PCR. Treatment: oral metronidazole (first episode, mild-moderate) or vancomycin (severe or recurrent cases)."
    difficulty: easy
    tags: [pediatrics, C. difficile, antibiotics, clindamycin, fluoroquinolones]
  - front: "A 5-week-old male presents with projectile non-bilious vomiting after each feeding, remains hungry after vomiting, and has a palpable mass in the right upper quadrant. What metabolic abnormality would you expect on blood work?"
    back: "Hypokalemic, hypochloremic metabolic alkalosis. This is the classic metabolic picture of pyloric stenosis due to repeated loss of gastric HCl.\n\nThe management of pyloric stenosis requires metabolic correction before surgical repair (pyloromyotomy). Operating on a patient with significant alkalosis increases anesthetic risk. IV fluid resuscitation with normal saline plus KCl correction is performed first."
    difficulty: medium
    tags: [pediatrics, pyloric stenosis, metabolic alkalosis, hypokalemia, hypochloremia]
