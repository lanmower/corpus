# Neuro Sz (Neurology) - generated from srs-mccqe1
cards:
  - front: "Define seizure and status epilepticus"
    back: "Seizure: paroxysmal alteration of behaviour and/or EEG changes from abnormal, excessive neuronal activity. Status epilepticus: continuous or intermittent seizure activity for >5 min without regaining consciousness\n\nStatus epilepticus is life-threatening and requires immediate intervention"
    difficulty: easy
    tags: [Emergency Medicine, Seizures, Neurology, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the loading dose of levetiracetam for status epilepticus?"
    back: "Loading dose of 60 mg/kg IV in adults, maximum 4500 mg, infused over 5-15 min\n\nLevetiracetam is used after seizure resolves to prevent recurrence"
    difficulty: medium
    tags: [Emergency Medicine, Seizures, Management, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the definition of status epilepticus?"
    back: "Continuous or intermittent seizure activity for greater than 5 minutes without regaining consciousness\n\nStatus epilepticus is a life-threatening emergency requiring immediate intervention to prevent permanent neurological damage."
    difficulty: easy
    tags: [Emergency Medicine, Seizures, Status Epilepticus, Neurology, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What investigations should be ordered urgently in status epilepticus?"
    back: "CBC, electrolytes, calcium, magnesium, venous blood gas, serum blood glucose, toxins, antiepileptic drug levels, pregnancy test (β-hCG)\n\nThese tests help identify underlying metabolic, toxic, or infectious causes of seizures."
    difficulty: medium
    tags: [seizures, status epilepticus, investigations, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "After a seizure resolves, what antiepileptic drug is recommended to prevent recurrence?"
    back: "Levetiracetam: loading dose of 60mg/kg IV in adults, maximum 4500mg, infused over 5-15 min\n\nLevetiracetam is preferred due to its favorable side effect profile and broad-spectrum efficacy."
    difficulty: medium
    tags: [seizures, antiepileptic, pharmacology, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the urgent management for status epilepticus if seizures persist after initial benzodiazepine therapy?"
    back: "Establish second IV line. If status persists, give phenytoin 20mg/kg IV at 25-50 mg/min in adults; may give additional 10mg/kg IV 10 min after loading infusion. If seizure resolves, start antiepileptic drug (e.g., levetiracetam loading dose 60mg/kg IV, max 4500mg).\n\nPhenytoin requires cardiac monitoring due to risk of dysrhythmias. Loading doses achieve therapeutic levels rapidly."
    difficulty: hard
    tags: [Emergency Medicine, Seizures, Status Epilepticus, Management, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the key differences between DKA and HHS clinical features?"
    back: "HHS occurs in older T2DM patients with more comorbid illness, larger fluid losses, symptoms evolving over days to weeks, fewer GI symptoms, and more neurological deficits including coma, delirium, and seizures\n\nUnlike DKA, HHS typically presents with predominant neurological manifestations due to extreme hyperosmolarity, and lacks the GI symptoms and metabolic acidosis seen in DKA."
    difficulty: medium
    tags: [DKA, HHS, Diabetes, Emergency Medicine, Differential Diagnosis, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the key clinical features distinguishing a seizure from syncope?"
    back: "Seizure: rapid onset, brief duration, tongue biting (high specificity), loss of bladder/bowel control, emesis, postictal period; Syncope: slower onset, brief loss of tone, usually no tongue biting or postictal confusion\n\nDifferentiation is critical as management differs significantly between these conditions."
    difficulty: medium
    tags: [Emergency Medicine, Seizures, Differential Diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the loading dose of levetiracetam after seizure resolves in status epilepticus?"
    back: "60 mg/kg IV (maximum 4500 mg), infused over 5-15 minutes\n\nLevetiracetam is used to prevent seizure recurrence after acute control is achieved."
    difficulty: hard
    tags: [Emergency Medicine, Seizures, Treatment, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What neurological deficits are more common in HHS compared to DKA?"
    back: "Mental disturbances, coma, delirium, and seizures are more common in HHS.\n\nHHS occurs in older T2DM patients with more severe hyperosmolarity leading to neurological complications."
    difficulty: medium
    tags: [HHS, neurological, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "When can a patient with a seizure typically be discharged from the emergency department?"
    back: "If the patient had a brief generalized seizure, has returned to baseline function, and is neurologically intact\n\nMost first-time seizures with complete recovery and normal investigation can be managed as outpatient with neurologist follow-up."
    difficulty: medium
    tags: [Neurology, Seizure, Disposition, ED Management, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What investigations should be sent urgently in a patient with suspected status epilepticus?"
    back: "CBC, electrolytes, calcium, magnesium, VBG, serum glucose, toxins screen, and antiepileptic drug levels; also send p-hCG in women of childbearing age\n\nThese tests help identify reversible causes and guide ongoing management in the emergent setting."
    difficulty: hard
    tags: [Neurology, Status Epilepticus, Investigations, Laboratory, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the loading dose of levetiracetam for seizure termination in status epilepticus?"
    back: "Loading dose of 60 mg/kg IV in adults, maximum 4500 mg, infused over 5-15 minutes\n\nLevetiracetam is increasingly used as first-line adjunct therapy after benzodiazepines due to favorable side effect profile."
    difficulty: hard
    tags: [Neurology, Levetiracetam, Status Epilepticus, Antiepileptic, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What vasopressor support is needed in status epilepticus if hypotension persists despite fluids?"
    back: "Vasopressor support if sBP <90 mmHg or MAP <70 mmHg after aggressive fluid resuscitation\n\nMaintaining cerebral perfusion pressure is crucial in status epilepticus to prevent secondary brain injury."
    difficulty: hard
    tags: [Neurology, Status Epilepticus, Hypotension, Vasopressors, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the key clinical features of heat exhaustion?"
    back: "Non-specific malaise, nausea, headache, fatigue, dehydration (tachycardia, orthostatic hypotension), body temperature <40.5°C, no coma or seizures\n\nHeat exhaustion results from loss of circulating volume due to heat stress and is characterized by volume depletion symptoms without altered mental status."
    difficulty: easy
    tags: [heat exhaustion, emergency medicine, environmental injury, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are the key neurological features of HHS compared to DKA?"
    back: "Mental disturbances, coma, delirium, seizures\n\nHHS has more neurological deficits than DKA due to extreme hyperosmolarity, including altered mental status and seizures."
    difficulty: medium
    tags: [HHS, neurological, DKA, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the clinical features of heat exhaustion?"
    back: "Non-specific malaise, nausea, headache, fatigue, body temperature <40.5°C (usually normal), no coma or seizures, dehydration with orthostatic hypotension\n\nHeat exhaustion results from loss of circulating volume due to heat stress. It may progress to heat stroke if untreated."
    difficulty: easy
    tags: [heat-exhaustion, environmental-medicine, emergency-medicine, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are the key clinical features of HHS compared to DKA?"
    back: "HHS typically occurs in older T2DM patients with more comorbidities. Symptoms evolve over days to weeks. Fewer GI symptoms but MORE neurological deficits including mental disturbances, coma, delirium, and seizures.\n\nThe neurological symptoms in HHS are due to extreme hyperosmolarity, distinguishing it from DKA."
    difficulty: hard
    tags: [HHS, diabetes, emergency medicine, neurological, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the contraindications to bupropion use?"
    back: "Seizure disorder, eating disorder, coma, simultaneous use of MAO inhibitors\n\nBupropion lowers the seizure threshold and is contraindicated in patients with seizure disorders, eating disorders, and those on MAOIs."
    difficulty: medium
    tags: [pharmacology, smoking-cessation, contraindications, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What percentage of patients in alcohol withdrawal will have seizures or delirium tremens?"
    back: "10%\n\nAlcohol withdrawal can be life-threatening; approximately 10% experience seizures or delirium tremens."
    difficulty: medium
    tags: [alcohol, withdrawal, complications, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the contraindications to bupropion?"
    back: "Seizure disorder, coma, eating disorder, MAOI use in past 14 days\n\nBupropion lowers seizure threshold and is contraindicated in conditions predisposing to seizures."
    difficulty: easy
    tags: [smoking-cessation, pharmacology, bupropion, contraindications, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the contraindications to bupropion use for smoking cessation?"
    back: "Seizure disorder, eating disorder, MAOI use within past 14 days\n\nBupropion lowers seizure threshold and is contraindicated in conditions predisposing to seizures."
    difficulty: easy
    tags: [pharmacology, smoking-cessation, contraindications, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the side effects of bupropion?"
    back: "Headache, insomnia, nightmares, seizures\n\nBupropion can cause CNS stimulation (insomnia, nightmares), headache, and importantly - seizures."
    difficulty: easy
    tags: [pharmacology, bupropion, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the side effects and risks of bupropion?"
    back: "Headache, insomnia, nightmares, seizures, less sexual dysfunction\n\nSeizure risk is increased at higher doses; contraindicated in patients with seizure disorders."
    difficulty: easy
    tags: [bupropion, depression, pharmacology, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is a serious side effect of bupropion that requires caution?"
    back: "Seizures\n\nBupropion can cause seizures, particularly at higher doses or in susceptible individuals."
    difficulty: easy
    tags: [psychiatry, pharmacology, bupropion, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
