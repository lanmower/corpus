  - front: "What is partial androgen insensitivity syndrome (PAIS)?"
    back: "A condition with partial androgen receptor dysfunction causing variable virilization of external genitalia\n\nPartial receptor function leads to ambiguous genitalia or undervirilization of varying degrees."
