# Family Medicine (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "According to Canadian screening guidelines, who should be screened for lung cancer with low-dose CT (LDCT)?"
    back: "Adults aged 55-74 with >=30 pack-year smoking history who currently smoke or quit <15 years ago should receive annual LDCT screening up to 3 consecutive times. Screening should only occur in settings with expertise in early diagnosis and treatment of lung cancer. Chest X-ray should NOT be used for lung cancer screening.\n\nThe Canadian Task Force (2016) makes a weak recommendation for LDCT in this high-risk group based on low-quality evidence. For all other adults regardless of age or smoking history, lung cancer screening is not recommended."
    difficulty: easy
    tags: [family medicine, preventive health, lung cancer screening, LDCT]
  - front: "What is the PHQ-2 screening tool for depression, and what score warrants further evaluation?"
    back: "The PHQ-2 asks 2 questions about the past 2 weeks: (1) little interest or pleasure in doing things, and (2) feeling down, depressed, or hopeless. Each scored 0-3, total out of 6. A score >=3 is positive and should prompt evaluation with the PHQ-9 to determine if criteria for depression are met.\n\nThe Canadian Task Force does not recommend routine depression screening. When screening is indicated, PHQ-2 is used as a brief screen, with PHQ-9 for full assessment. All patients with depression should be screened for suicidal ideation. Combination pharmacotherapy and psychotherapy is the most effective treatment."
    difficulty: easy
    tags: [family medicine, psychiatry, depression, PHQ-2, screening]
  - front: "What pharmacotherapy options are available for smoking cessation, and which is most effective?"
    back: "Varenicline (Champix) is the most effective: 23% abstinent at 9-52 weeks vs. 16% bupropion vs. 9% placebo. Bupropion SR (Zyban) has similar effectiveness to NRT. NRT (gum, patch, inhaler, nasal spray) achieves 19.7% abstinence at 12 months vs. 11.5% for placebo. Combining counselling with medication is more effective than either alone.\n\nVarenicline acts as a partial nicotinic receptor agonist (reduces cravings) and partial antagonist (reduces response to smoked nicotine). Side effects include nausea and neuropsychiatric symptoms. The quit date should be 10-14 days after starting. The 5 A's framework guides cessation counselling: Ask, Advise, Assess, Assist, Arrange."
    difficulty: medium
    tags: [family medicine, smoking cessation, varenicline, pharmacology, preventive medicine]
  - front: "A woman presents with vague complaints including headaches, chronic pain, and insomnia, with injuries inconsistent with her history. What diagnosis should you strongly suspect, and what is the strongest predictor of disclosure?"
    back: "Intimate partner violence (domestic violence). Asking about abuse is the strongest predictor of disclosure.\n\nPhysician recognition rates for intimate partner violence are as low as 5%. Screening tools like WAST and HITS can help identify victims. Safety planning is critical as victims are most at risk for homicide when attempting to leave."
    difficulty: medium
    tags: [family-medicine, domestic-violence, screening, social-medicine]
  - front: "A patient presents with fatigue lasting 8 months. Using the PS VINDICATE mnemonic, list the most common causes of fatigue in the family medicine setting."
    back: "Most common: Psychogenic (depression, anxiety, CFS), Sleep disturbance (OSA), Sedentary lifestyle, Infectious (viral), Drugs (beta-blockers, antihistamines), Chronic illness (HF, COPD), Endocrine (hypothyroidism, DM).\n\nPsychosocial causes are the most common etiology of fatigue. About 50% have associated psychological complaints, especially if <6 months duration. One-third of patients have no identifiable cause. Initial workup includes CBC, TSH, ferritin, glucose."
    difficulty: easy
    tags: [family-medicine, fatigue, differential-diagnosis]
  - front: "What are the three required symptoms for diagnosis of Chronic Fatigue Syndrome (ME/CFS) per the 2015 Institute of Medicine criteria?"
    back: "1) Substantial reduction in pre-illness activity lasting >6 months with fatigue not alleviated by rest; 2) Post-exertional malaise; 3) Unrefreshing sleep. Plus at least one of: cognitive impairment OR orthostatic intolerance.\n\nCFS diagnosis requires all three core symptoms plus at least one additional manifestation. It is found in <5% of patients presenting with fatigue. There are no specific diagnostic lab tests. Exercise therapy may have positive effects."
    difficulty: medium
    tags: [family-medicine, chronic-fatigue-syndrome, diagnosis]
  - front: "What are the diagnostic criteria for chronic fatigue syndrome (IOM 2015)?"
    back: "Three required: (1) substantial reduction in pre-illness activity lasting >6 months with new-onset fatigue not alleviated by rest, (2) post-exertional malaise, (3) unrefreshing sleep. PLUS at least one of: cognitive impairment or orthostatic intolerance.\n\nCFS is found in <5% of patients presenting with fatigue. It is more common in women, White individuals, and those in their 30s. Treatment focuses on sleep hygiene, physical activity, and symptom management."
    difficulty: medium
    tags: [family medicine, chronic fatigue syndrome]
  - front: "According to the 2016 Canadian Task Force on Preventive Health Care, what is the recommended colorectal cancer (CRC) screening strategy for adults ages 60–74?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years. This is a STRONG recommendation with moderate quality evidence.\n\nThe 2016 CTFPHC guidelines differentiate between age groups. Ages 60–74 receive a strong recommendation for FOBT q2yr or flexible sigmoidoscopy q10yr, while ages 50–59 receive only a weak recommendation for the same tests. Colonoscopy is NOT recommended as a routine screening test for average-risk individuals."
    difficulty: easy
    tags: [colorectal cancer, screening, CTFPHC, FOBT, FIT, sigmoidoscopy, preventive care]
  - front: "According to the 2016 CTFPHC, what are the CRC screening recommendations for adults ages 50–59?"
    back: "FOBT (gFOBT or FIT) every 2 years OR flexible sigmoidoscopy every 10 years. This is a WEAK recommendation with moderate quality evidence.\n\nThe strength of recommendation differs between age groups: ages 60–74 get a strong recommendation, while ages 50–59 get only a weak recommendation for the same screening modalities. The lower strength reflects less certainty of net benefit in this younger group."
    difficulty: easy
    tags: [colorectal cancer, screening, CTFPHC, FOBT, FIT, preventive care]
  - front: "According to the 2016 CTFPHC, what is the recommendation regarding CRC screening in adults ≥75 years?"
    back: "Recommend NOT screening adults ≥75 years for CRC. This is a weak recommendation with low quality evidence.\n\nThe CTFPHC recommends against screening in adults 75 and older due to low quality evidence. The potential harms of screening (colonoscopy complications, false positives, overdiagnosis) outweigh the benefits in this age group given shorter life expectancy."
    difficulty: easy
    tags: [colorectal cancer, screening, elderly, CTFPHC, preventive care]
  - front: "According to the 2016 CTFPHC, what is the recommendation regarding the use of colonoscopy for CRC screening in average-risk patients?"
    back: "Recommend NOT using colonoscopy as a screening test for CRC in average-risk patients. This is a weak recommendation with low quality evidence.\n\nThe CTFPHC specifically recommends against colonoscopy as a primary screening tool for average-risk individuals. This contrasts with U.S. guidelines. Instead, the CTFPHC endorses FOBT/FIT or flexible sigmoidoscopy. Colonoscopy is still used for diagnostic evaluation (e.g., symptomatic patients, positive FOBT) and for high-risk individuals (e.g., first-degree relative with CRC)."
    difficulty: medium
    tags: [colorectal cancer, colonoscopy, screening, CTFPHC, average risk]
  - front: "Which CRC screening tests are NOT recommended by the CTFPHC for average-risk patients? List at least 4."
    back: "Tests NOT recommended for CRC screening: (1) Colonoscopy (for average-risk patients), (2) Metabolomic (blood or urine) tests, (3) DNA (blood or stool) tests, (4) CT colonography, (5) Capsule colonoscopy, (6) Double-contrast barium enema, (7) Guaiac FOBT (replaced by FIT).\n\nThe CTFPHC provides a clear list of tests that are not recommended for CRC screening. FIT (fecal immunochemical test) has replaced the older guaiac FOBT. CT colonography and capsule colonoscopy lack sufficient evidence for routine screening use. DNA and metabolomic tests are also not recommended."
    difficulty: medium
    tags: [colorectal cancer, screening, CTFPHC, CT colonography, FIT]
  - front: "A 52-year-old woman has a father who was diagnosed with colorectal cancer at age 56. What is the appropriate CRC screening recommendation?"
    back: "She is NOT at average risk. She should have a colonoscopy starting at age 50 OR 10 years earlier than the age her relative was diagnosed (i.e., age 46), whichever comes FIRST. Since she is already 52, she should have colonoscopy now. A complete family history should be taken; if hereditary cancer syndrome is suspected, refer for genetic assessment.\n\nHaving one or more first-degree relatives with CRC places a patient in the 'increased risk' category. The rule is to start colonoscopy at age 50 OR 10 years earlier than the relative's diagnosis age, whichever is first. FIT is NOT appropriate for symptomatic patients; additionally, colonoscopy is the preferred modality for increased-risk patients (not just average-risk screening). Hereditary syndromes (Lynch syndrome, FAP) should be considered."
    difficulty: hard
    tags: [colorectal cancer, family history, colonoscopy, increased risk, hereditary cancer]
  - front: "According to the 2013 Canadian Task Force for Preventive Care, what are the Pap smear/cervical cancer screening recommendations by age group?"
    back: "• <20 years: DO NOT screen (strong recommendation, high quality evidence)\n• 20–24 years: DO NOT routinely screen (weak recommendation, moderate quality evidence)\n• 25–29 years: Pap smear or liquid cytology q3 years (weak recommendation, moderate quality evidence)\n• 30–69 years: Pap smear or liquid-based cytology q3 years (strong recommendation, high quality evidence)\n• ≥70 years, adequately screened (3 consecutive negative Paps in last 10 years): Routine screening may cease\n• ≥70 years, not adequately screened: Continue until 3 negative test results obtained\n\nThe CTFPHC 2013 guidelines recommend against screening in women under 25 and limit screening to q3 years for those 25–69. This is based on the natural history of HPV infection, which often clears spontaneously in younger women, and the harms of unnecessary colposcopy/treatment in young women. Ontario's 2022 guidelines extend screening to women ≥25 who are or have ever been sexually active (or ≥21 if immunocompromised)."
    difficulty: medium
    tags: [cervical cancer, Pap smear, screening, CTFPHC, HPV, preventive care]
  - front: "According to the Ontario Cervical Screening Program (2022), when should cervical cancer screening begin and what is the recommended interval?"
    back: "Women ≥25 years who are or have ever been sexually active: screen every 3 years if cytology is normal. Women ≥21 who are immunocompromised and are or have ever been sexually active may initiate screening earlier.\n\nOntario's 2022 program differs from the national CTFPHC 2013 guidelines (which recommended starting at 25 for all). Ontario allows screening at 21 for immunocompromised patients. Provincial guidelines can vary from national recommendations; knowing both is important for the MCCQE1."
    difficulty: medium
    tags: [cervical cancer, Pap smear, Ontario, cervical screening program, immunocompromised]
  - front: "What is the 2014 CTFPHC recommendation regarding PSA-based prostate cancer screening?"
    back: "• Ages <55: Do NOT screen with PSA (strong recommendation, low quality evidence)\n• Ages 55–69: Do NOT screen with PSA (weak recommendation, moderate quality evidence); however, clinicians should discuss risks and benefits with each man based on his preferences\n• Ages ≥70: Do NOT screen with PSA (strong recommendation, low quality evidence)\n\nThe CTFPHC recommends against routine PSA screening across all age groups because the potential small benefit is outweighed by significant harms: bleeding, infection, urinary incontinence, false positives, and overdiagnosis. For men 55–69 the evidence is inconsistent (small possible benefit vs. harms), hence the weaker recommendation that requires shared decision-making."
    difficulty: easy
    tags: [prostate cancer, PSA, screening, CTFPHC, preventive care]
  - front: "Why does the CTFPHC recommend against PSA screening even for men aged 55–69?"
    back: "Because the potential small benefit from PSA screening is outweighed by potential significant harms of screening and associated follow-up treatment, including: bleeding, infection, urinary incontinence, false positive results, and overdiagnosis/overtreatment.\n\nFor men <55 or ≥70, there is no evidence that PSA screening reduces mortality, whereas there is evidence of harms (strong recommendation against). For men 55–69, there is inconsistent evidence of a small potential benefit, hence only a weak recommendation against with a requirement for shared decision-making. Overdiagnosis is a major concern as many prostate cancers detected by PSA would never cause symptoms."
    difficulty: medium
    tags: [prostate cancer, PSA, screening harms, overdiagnosis, CTFPHC]
  - front: "What are the 6 stages of change in the Transtheoretical (Motivational) Model, and what is the physician's aim at each stage?"
    back: "1. Pre-contemplation: Encourage patient to consider possibility of change; raise issue sensitively, offer neutral information\n2. Contemplation: Understand ambivalence, encourage change; discuss pros/cons using reflective listening\n3. Preparation: Explore options; offer realistic options and discuss difficulties\n4. Action: Help design rewards for success; offer positive reinforcement, explore coping strategies\n5. Maintenance: Help maintain motivation; discuss progress and signs of impending relapse\n6. Relapse: Help view relapse as a learning experience; non-judgmental discussion, reassess readiness\n\nThe Transtheoretical Model (Stages of Change) guides counselling for behaviour change. The physician's approach must be tailored to the patient's current stage. In pre-contemplation, imposing change creates resistance; in preparation, the focus shifts to practical planning. Motivational interviewing techniques (reflective listening, avoiding confrontation) are key across all stages."
    difficulty: medium
    tags: [motivational interviewing, stages of change, behaviour change, health promotion, counselling]
  - front: "A patient says, 'I know smoking is bad for me, but I'm not ready to quit yet.' What stage of change is this patient in, and what is the most appropriate physician response?"
    back: "This patient is in the CONTEMPLATION stage (aware of the problem but ambivalent about change). The most appropriate response is to understand the patient's ambivalence and encourage change by offering an opportunity to discuss the pros and cons of change using reflective listening, without imposing change.\n\nContemplation is characterized by awareness of the problem and ambivalence — the patient is considering change but has not committed. The physician should use reflective listening to explore both sides, build confidence, and gain commitment. Offering unsolicited advice or pressure is counterproductive and creates resistance (as would occur if you treated them as 'pre-contemplative'). Avoid prescribing medication or creating a quit plan until the patient moves to Preparation."
    difficulty: medium
    tags: [stages of change, motivational interviewing, smoking cessation, counselling, contemplation]
  - front: "What are Canada's three Food Guide guidelines for healthy eating?"
    back: "1. Nutritious foods (vegetables, fruits, whole grains, proteins — especially plant-based) are the foundation for healthy eating; foods with mostly unsaturated fat should replace those with mostly saturated fat; water should be the beverage of choice.\n2. Processed or prepared foods and beverages that contribute to excess sodium, free sugars, or saturated fat undermine healthy eating and should not be consumed regularly.\n3. Food skills (cooking, food preparation, and reading food labels) are needed to navigate the complex food environment and support healthy eating.\n\nCanada's Food Guide (2019) moved away from the 'four food groups' model to emphasize: (1) what to eat (healthy foods), (2) what to limit (processed foods), and (3) how to eat (food skills, cooking). It emphasizes plant-based proteins, water as the primary beverage, and mindful eating. It applies to individuals ≥2 years of age."
    difficulty: easy
    tags: [Canada Food Guide, nutrition, healthy eating, preventive care]
  - front: "What are the caloric values per gram for carbohydrates, protein, and fat?"
    back: "• Carbohydrates: 4 kcal/g\n• Protein: 4 kcal/g\n• Fat: 9 kcal/g\n\nThese basic nutritional values are essential for calculating dietary energy intake and counselling patients on weight management. Fat provides more than twice the calories per gram compared to carbohydrates or protein. Calculating total daily energy expenditure is roughly 35 kcal/kg/day, varying by age, weight, height, sex, and activity level."
    difficulty: easy
    tags: [nutrition, calories, macronutrients, energy]
  - front: "What are the Vitamin D supplementation recommendations from the Canadian Cancer Society for adults in Canada?"
    back: "• All adults living in Canada: Consider taking Vitamin D supplementation of 1000 IU/day during the fall and winter.\n• Adults at higher risk of lower Vitamin D levels (older adults, those with dark skin, people who don't go outside often, those who wear clothing covering most of their skin): Consider taking 1000 IU/day year-round.\n• Babies exclusively breast-fed: Consider taking Vitamin D supplementation of 400 IU/day.\n\nThese CCS recommendations are based on research on Vitamin D and prevention of colorectal and breast cancers. Canada's northern latitude means limited sunlight exposure in fall/winter, reducing endogenous Vitamin D synthesis. Groups with darker skin pigmentation, limited sun exposure, or obesity are at higher risk for deficiency. Note these are for cancer prevention; Osteoporosis Canada has separate recommendations for bone health."
    difficulty: medium
    tags: [Vitamin D, supplementation, Canadian Cancer Society, cancer prevention, nutrition]
  - front: "What are the Osteoporosis Canada daily Vitamin D and Calcium recommendations?"
    back: "Vitamin D:\n• 400–1000 IU/day for individuals aged 19–50 years\n• 800–2000 IU/day for individuals ≥50 years or younger adults at high risk (osteoporosis, multiple fractures, inadequate Vitamin D absorption)\n\nCalcium:\n• 1000 mg/day from all sources for individuals aged 19–50 years and pregnant/lactating women\n• 1200 mg/day for individuals >50 years (recommended to obtain from diet whenever possible vs. supplementation)\n\nOsteoporosis Canada recommends higher Vitamin D and calcium for older adults due to decreased absorption efficiency with age. The upper limit of Vitamin D (2000 IU) is used for high-risk patients. Calcium should preferably come from dietary sources (dairy, fortified foods, leafy greens) rather than supplements due to cardiovascular concerns with high-dose calcium supplementation."
    difficulty: medium
    tags: [osteoporosis, Vitamin D, calcium, Osteoporosis Canada, bone health, supplementation]
  - front: "What dietary guidelines are recommended to reduce cardiovascular disease risk regarding fats and alcohol?"
    back: "Fats: Consume mono- and polyunsaturated fats in moderation; minimize trans fat intake; limit saturated fats; use olive and canola oil over butter/margarine/coconut oil; use skim or 1% milk over whole milk.\n\nAlcohol: Limit to <2 drinks/week. Risk continuum:\n• Low risk: <2 drinks/week\n• Moderate risk: 3–6 drinks/week\n• High risk: ≥7 drinks/week\n\nThe 2016 CCS Guidelines and 2023 Canadian Centre on Substance Use and Addiction (CCSA) guidance inform these recommendations. The CCSA released updated alcohol guidance in 2023 emphasizing that any alcohol carries some risk and recommending <2 drinks/week for low risk. This is significantly more conservative than older guidelines and represents an important update for MCCQE1 purposes."
    difficulty: medium
    tags: [cardiovascular disease, diet, alcohol, fats, prevention, CCSA]
  - front: "Compare the Mediterranean diet and the DASH diet in terms of their key components."
    back: "Mediterranean diet:\n• High: leafy green vegetables, fruits, whole grains, nuts, legumes, extra virgin olive oil\n• Moderate: fish, lean meats, low-fat dairy, poultry\n• Low: red meats and sweets\n\nDASH diet (Dietary Approaches to Stop Hypertension):\n• High: vegetables/fruits, no/low-fat dairy, whole grains, poultry, fish, beans, seeds, nuts; high potassium, magnesium, calcium, protein, fibre\n• Low: sodium, sweets, added sugars, sugar-sweetened beverages, fats, red meats, saturated fat, trans fat, cholesterol\n\nBoth diets have evidence for cardiovascular benefit. The DASH diet was specifically designed to reduce blood pressure and is particularly high in potassium, magnesium, and calcium. The Mediterranean diet has the strongest evidence for reducing all-cause mortality and cardiovascular events. The Portfolio Diet (nuts 45g/day, plant protein 50g/day, viscous fibres, plant sterols 2g/day) is another evidence-based option for cholesterol reduction."
    difficulty: medium
    tags: [Mediterranean diet, DASH diet, cardiovascular prevention, hypertension, nutrition]
  - front: "What is the BMI classification for obesity according to Health Canada, and what are the associated disease risks?"
    back: "• Underweight: BMI <18.5 — Increased risk (different complications)\n• Normal: BMI 18.5–24.9 — Least risk\n• Overweight: BMI 25.0–29.9 — Increased risk\n• Obesity Class I: BMI 30.0–34.9 — High risk\n• Obesity Class II: BMI 35.0–39.9 — Very high risk\n• Obesity Class III (Extreme Obesity): BMI ≥40.0 — Extremely high risk\n\nBMI is a useful but imperfect screening tool — it does not directly measure adiposity and may misclassify muscular individuals. The Canadian Adult Obesity Clinical Practice Guidelines (2020) recognize that waist circumference (WC) provides additional information about metabolic risk beyond BMI. The guidelines also emphasize that obesity involves weight bias and stigma, which independently increase complications and mortality."
    difficulty: easy
    tags: [obesity, BMI, classification, metabolic risk, Health Canada]
  - front: "What are the 5 steps in the Canadian Adult Obesity Clinical Practice Guidelines (2020) approach to obesity management?"
    back: "1. ASK: Recognize obesity as a chronic disease; obtain patient permission to discuss and help treat it in an unbiased manner\n2. ASSESS: Use appropriate measures (height, weight, waist circumference, BMI); identify root causes (biological, psychological, life experiences), complications, barriers, and disease severity\n3. ADVISE: Discuss treatment options; create individualized care plans addressing root causes and supporting behaviour change\n4. AGREE: Agree on goals focusing on patient's values, ensuring realistic expectations and sustainable behaviour change\n5. ASSIST: Follow up and reassess regularly; assist with drivers/barriers; advocate for improved obesity care\n\nThe 5A framework (Ask, Assess, Advise, Agree, Assist) is the cornerstone of the 2020 Obesity Canada guidelines. It emphasizes a patient-centred, non-judgmental approach. Obesity is recognized as a chronic, progressive, relapsing disease driven by biological, psychological, and social factors — not simply a failure of willpower. Weight bias and stigma are explicitly acknowledged as contributors to complications."
    difficulty: medium
    tags: [obesity, 5A framework, Obesity Canada, chronic disease, behaviour change]
  - front: "What are the criteria for bariatric surgery candidacy according to Canadian guidelines?"
    back: "Consider bariatric surgery for:\n• BMI ≥40 kg/m², OR\n• BMI ≥35 kg/m² with ≥1 adiposity-related disease (e.g., T2DM)\nWhen optimal medical and behavioural management has been insufficient to produce significant weight loss. The choice of bariatric procedure should be made with an interprofessional team; adjustable gastric banding and single anastomosis gastric bypass are NOT suggested due to unacceptable complications and long-term failure.\n\nBariatric surgery is the most effective long-term treatment for severe obesity and can induce remission of T2DM. The 2020 Obesity Canada guidelines specify that surgery should only be considered after adequate medical/behavioural management has been attempted. The preferred procedures include Roux-en-Y gastric bypass and sleeve gastrectomy. Pharmacotherapy candidates: BMI ≥30 kg/m² or BMI ≥27 kg/m² with ≥1 weight-related condition."
    difficulty: medium
    tags: [bariatric surgery, obesity, surgical criteria, Obesity Canada, T2DM]
  - front: "What are the 4 prescription medications approved in Canada for obesity treatment, and what are their mechanisms?"
    back: "1. Contrave® (naltrexone + bupropion): Reduces hunger and cravings\n2. Saxenda® (liraglutide): Decreases appetite (GLP-1 receptor agonist)\n3. Xenical® (orlistat): Reduces dietary fat absorption by inhibiting pancreatic and gastric lipases\n4. Wegovy® (semaglutide): Improves satiation and satiety, reduces hunger and cravings (GLP-1 receptor agonist)\n\nIndications: BMI ≥30 kg/m² OR BMI ≥27 kg/m² with ≥1 weight-related condition (e.g., HTN, T2DM, dyslipidemia), used alongside reduced calorie diet and increased physical activity.\n\nAs of 2025, these are the 4 approved pharmacotherapies for obesity in Canada. Semaglutide (Wegovy) represents the newest and most effective option. GLP-1 receptor agonists (liraglutide, semaglutide) have additional cardiovascular and glycemic benefits. Orlistat causes gastrointestinal side effects (steatorrhea, oily spotting) due to its mechanism. Naltrexone-bupropion acts centrally on appetite pathways."
    difficulty: medium
    tags: [obesity, pharmacotherapy, semaglutide, orlistat, liraglutide, GLP-1, bupropion]
  - front: "What are the adverse medical complications associated with obesity?"
    back: "• T2DM\n• Dyslipidemia\n• Coronary artery disease (CAD)\n• Osteoarthritis\n• Stroke\n• Hypertension (HTN)\n• Certain cancers (e.g., breast, colon, endometrial)\n• Gallbladder disease\n• Sleep apnea\n• Non-alcoholic steatohepatitis (NASH)\n• Increased total mortality\n• Back/joint pain\n\nObesity is associated with systemic complications affecting virtually every organ system. Metabolic complications (T2DM, dyslipidemia, HTN) form the 'metabolic syndrome.' Mechanical complications include osteoarthritis, sleep apnea, and GERD. Cancer risk is elevated due to inflammatory adipokines and hormonal effects (excess estrogen from adipose tissue). Low BMI is also associated with complications: osteoporosis, infertility, and pregnancy complications."
    difficulty: easy
    tags: [obesity, complications, T2DM, cardiovascular, cancer, metabolic syndrome]
  - front: "What is the definition of metabolic syndrome and its diagnostic criteria?"
    back: "Metabolic syndrome requires: Central obesity (Men: WC >102 cm; Women: WC ≥80 cm) PLUS any TWO of the following four:\n1. TG level ≥1.7 mmol/L (≥150 mg/dL)\n2. Low HDL-C: Men <1.0 mmol/L (40 mg/dL); Women <1.3 mmol/L (50 mg/dL)\n3. Blood pressure ≥130/85 mmHg or taking BP medications\n4. Fasting glucose ≥5.6 mmol/L (100 mg/dL)\n\nMetabolic syndrome is a cluster of cardiometabolic risk factors that significantly increase the risk of CVD and T2DM. Central (abdominal) obesity is the central feature. The IDF definition uses lower WC thresholds for South Asians. The presence of metabolic syndrome roughly doubles the risk of CVD and increases T2DM risk 5-fold. Treatment targets lifestyle modification addressing all components."
    difficulty: hard
    tags: [metabolic syndrome, waist circumference, TG, HDL, hypertension, glucose, diagnosis]
  - front: "According to the 2021 Canadian Cardiovascular Society (CCS) Dyslipidemia Guidelines, what are the risk categories used to determine who needs statin therapy?"
    back: "Statin-indicated conditions (treat regardless of FRS):\n• Clinical atherosclerosis\n• Abdominal aortic aneurysm\n• LDL-C >5 mmol/L or genetic dyslipidemia\n• Most diabetes (age ≥40; or age ≥30 with ≥5 year duration; or microvascular disease; or CKD)\n\nPrimary prevention (calculate FRS or CLEM):\n• Low risk: FRS <10%\n• Intermediate risk: FRS 10–19%\n• High risk: FRS ≥20%, or LDL-C ≥3.5 mmol/L, or Non-HDL >4.3 mmol/L, or ApoB ≥1.2 g/L, or men ≥50/women ≥60 with ≥1 additional risk factor\n\nThe 2021 CCS guidelines emphasize a treat-to-target approach with primary targets of LDL-C <2.0 mmol/L or ≥50% LDL-C reduction, plus ApoB <0.8 g/L or non-HDL-C <2.6 mmol/L. The Framingham Risk Score (FRS) estimates 10-year CAD risk based on age, sex, TC, HDL-C, SBP, smoking, and DM. Family history of premature CVD doubles the FRS."
    difficulty: hard
    tags: [dyslipidemia, CCS guidelines, Framingham Risk Score, statin, cardiovascular risk, LDL]
  - front: "What are the screening recommendations for dyslipidemia in Canada?"
    back: "Screen with a standard lipid profile:\n• Males ≥40 years\n• Females ≥40 years OR postmenopausal\n• Any age with risk factors for dyslipidemia (smoking, T2DM, HTN, family history of premature CVD, family history of dyslipidemia, CKD, inflammatory disease, obesity, erectile dysfunction, HIV, COPD, hypertensive diseases of pregnancy, stigmata of dyslipidemia)\n\nRepeat screening every 5 years if FRS <5%, or every year if FRS ≥5%.\n\nThe standard lipid panel includes TC, LDL-C, HDL-C, TG, and calculated non-HDL-C. Optional additions include ApoB and urine ACR. Secondary causes of dyslipidemia should always be screened for: hypothyroidism, CKD, DM, nephrotic syndrome, and liver disease. Non-fasting lipids (TC and non-HDL-C) hold the same prognostic value as fasting lipids for Framingham risk assessment."
    difficulty: medium
    tags: [dyslipidemia, screening, lipid profile, Framingham Risk Score, CCS]
  - front: "What are the signs of hyperlipidemia on physical examination?"
    back: "• Atheromata: plaques in the intimal layer of arterial walls\n• Xanthelasmata: sharply demarcated yellowish deposits of cholesterol underneath skin, usually on or around the eyelids\n• Tendinous xanthoma: lipid deposit in tendon (especially Achilles tendon)\n• Eruptive xanthoma: hypertriglyceridemia-induced reddish-yellow, pruritic, and painful papular or nodular rash\n• Lipemia retinalis: creamy, white-coloured retinal blood vessels; occurs only with extreme hypertriglyceridemia\n• Corneal arcus (arcus senilis): lipid deposit in cornea\n\nPhysical signs of hyperlipidemia are important for identifying patients with severe or longstanding dyslipidemia who may have genetic causes (familial hypercholesterolemia). Xanthelasmata suggest elevated LDL-C but can occur with normal lipids. Tendinous xanthomas are highly specific for familial hypercholesterolemia. Eruptive xanthomas occur with severe hypertriglyceridemia (TG >10 mmol/L) and signal pancreatitis risk. Arcus senilis before age 45 suggests dyslipidemia."
    difficulty: medium
    tags: [dyslipidemia, physical examination, xanthoma, xanthelasma, hyperlipidemia, signs]
  - front: "What are the treatment targets for dyslipidemia therapy according to the 2021 CCS Guidelines?"
    back: "Treat to target approach:\n• Primary: LDL-C <2.0 mmol/L OR ≥50% reduction in LDL-C\n• Alternative primary targets: ApoB <0.8 g/L OR non-HDL-C <2.6 mmol/L\n\nIf target achieved on maximally tolerated statin dose: reassess\nIf target NOT achieved: discuss add-on therapy (1st line: ezetimibe; alternative: bile acid sequestrants [BAS]; for very high risk: PCSK9 inhibitors as add-on)\n\nThe treat-to-target approach was updated in the 2021 CCS guidelines. The primary LDL-C target of <2.0 mmol/L is a hard endpoint target. ApoB is an increasingly recognized alternative target as it directly measures the number of atherogenic lipoprotein particles. PCSK9 inhibitors (evolocumab, alirocumab) are reserved for high-risk patients unable to reach targets on maximal statin + ezetimibe therapy."
    difficulty: hard
    tags: [dyslipidemia, LDL, treatment target, CCS, statin, ezetimibe, PCSK9]
  - front: "What are the first-line pharmacological and non-pharmacological management strategies for dyslipidemia?"
    back: "Non-pharmacological (Health Behaviour Interventions — can decrease LDL-C by up to 10%):\n1. Smoking cessation (most important for preventing CAD)\n2. Dietary modification: reduce saturated fat, red meat, refined sugar, alcohol; consume nuts, fruits/vegetables, poultry, fish\n3. Physical activity: ≥150 min/week of moderate-to-vigorous aerobic exercise in bouts of >10 min\n\nPharmacological — 1st line: Statins (HMG-CoA reductase inhibitors)\n• Risks: myopathy (myalgia, rhabdomyolysis)\n• If severe side effects: switch to ezetimibe\n\nLifestyle modifications should be employed for at least 3 months before drug therapy for low/intermediate-risk patients; high-risk patients should start therapy immediately with concurrent lifestyle changes. Statins are the cornerstone of pharmacotherapy. Monitoring: ALT and CK at baseline and 6 weeks later; tolerate CK elevation up to 10x ULN (or 2-3x if symptomatic). LDL cannot be calculated when TG ≥4.5 mmol/L."
    difficulty: medium
    tags: [dyslipidemia, management, statin, lifestyle modification, HMG-CoA, smoking cessation]
  - front: "What are the monitoring requirements for patients on statin therapy?"
    back: "• Baseline: ALT and CK\n• 6 weeks after starting: repeat ALT and CK\n• No routine repeated measures of ALT and CK in asymptomatic patients (only if symptomatic)\n• Tolerate CK elevation up to 10× ULN without symptoms; stop if 2–3× ULN if symptomatic\n• Tolerate serum Cr rise of <25%\n• Once adequate response achieved: evaluate fasting lipids every 6–12 months\n\nStatin monitoring has evolved to avoid over-testing. Routine monitoring of liver enzymes is no longer recommended in asymptomatic patients on stable statin therapy. Myopathy monitoring is clinically driven. Use statin + fibrate combinations with caution due to increased risk of myalgias, CK elevations, myopathy, and rhabdomyolysis. Statins slightly increase the incidence of T2DM, but the absolute risk is small relative to the cardiovascular benefit."
    difficulty: medium
    tags: [statin, monitoring, CK, ALT, myopathy, dyslipidemia]
  - front: "What is isolated hypertriglyceridemia, how is it classified, and how is it managed?"
    back: "Definition: Elevated TG with normal HDL-C and TC.\nClassification:\n• Mild: TG ≥2.2 mmol/L (≥200 mg/dL)\n• Marked: TG ≥5.6 mmol/L (≥500 mg/dL)\n• Severe (pancreatitis risk): typically TG >10 mmol/L\n\nManagement:\n• Principal therapy: lifestyle modification (weight loss, exercise, avoid smoking and alcohol, effective blood glucose control in DM, increased omega-3 fatty acid intake)\n• Drug therapy (lowers pancreatitis risk, NOT CAD risk): fibrates\n• Severe hypertriglyceridemia (>10 mmol/L): associated with increased risk of acute pancreatitis\n\nIsolated hypertriglyceridemia itself does not increase cardiovascular risk (this differs from mixed dyslipidemia). However, severe hypertriglyceridemia (>10 mmol/L) carries significant pancreatitis risk. The primary goal of drug therapy in this setting is pancreatitis prevention, not CAD prevention. Fibrates are the drug of choice. Omega-3 fatty acids (prescription doses) can also lower TG. Eruptive xanthomas can appear at very high TG levels."
    difficulty: hard
    tags: [hypertriglyceridemia, dyslipidemia, pancreatitis, fibrates, TG, management]
  - front: "What are the Canadian 24-Hour Movement Guidelines for adults aged 18–64?"
    back: "Physical Activity:\n• ≥150 min/week of moderate-to-vigorous intensity aerobic physical activity in bouts of ≥10 min\n• Muscle/bone strengthening activities using major muscle groups, ≥2 days/week\n\nSleep:\n• 7–9 hours/day of good quality sleep with consistent bed and wake times\n\nSedentary Behaviour:\n• Limit sedentary time to ≤8 hours/day\n• No more than 3 hours/day of recreational screen time\n• Break up long periods of sitting as often as possible\n\nThe 2020 CSEP (Canadian Society for Exercise Physiology) Guidelines use a 24-hour framework integrating physical activity, sedentary behaviour, and sleep as interconnected health behaviours. Adults 18–64 and older adults ≥65 have the same activity and sleep targets. Older adults additionally need activities that challenge balance to prevent falls."
    difficulty: easy
    tags: [exercise, physical activity guidelines, CSEP, sedentary behaviour, sleep, adults]
  - front: "What are the Canadian 24-Hour Movement Guidelines for children aged 5–17?"
    back: "Physical Activity:\n• ≥60 min/day of moderate-to-vigorous aerobic physical activity\n• Muscle/bone strengthening exercises ≥3 days/week\n• A variety of structured/unstructured light physical activities for several hours/day\n\nSleep:\n• 9–11 hours/day (ages 5–13 years)\n• 8–10 hours/day (ages 14–17 years)\n• Uninterrupted, with consistent bed and wake times\n\nSedentary Behaviour:\n• No more than 2 hours/day of recreational screen time\n• Limit sitting for extended periods\n\nChildren and youth have higher physical activity requirements than adults (60 min/day vs. 150 min/week). Moderate activities for children include bike riding and playground play; vigorous activities include running and swimming. Children also need more sleep than adults. Screen time limit of 2 hours/day applies to recreational screen time (not educational)."
    difficulty: easy
    tags: [exercise, physical activity guidelines, CSEP, children, screen time, sleep]
  - front: "What are the benefits of regular physical exercise?"
    back: "• Reduces risk of premature death\n• Reduces risk of heart disease, stroke, and hypertension\n• Reduces risk of certain types of cancer\n• Reduces risk of T2DM\n• Reduces risk of osteoporosis\n• Reduces risk of overweight/obesity\n• Improves fitness, strength, mobility, and functional independence\n• Improves mental health (morale and self-esteem)\n• Improves cardiometabolic risk factors\n• Improves health-related quality of life\n\nExercise is one of the most powerful preventive interventions available. Approximately 25% of Canadians exercise regularly, 50% occasionally, and 25% are sedentary. When counselling patients on exercise: Ask about current activity level, Assess readiness, Advise about guidelines, Agree on a goal, Assist and Arrange follow-up (the 5A approach applied to exercise). Patients with CAD should have cardiac assessment before starting exercise. DM patients risk hypoglycemia with exercise."
    difficulty: easy
    tags: [exercise, benefits, prevention, cardiovascular, mental health, diabetes]
  - front: "What is the epidemiology of smoking in Canada and why is it clinically important?"
    back: "• Smoking is the single most preventable cause of premature illness and death\n• 70% of smokers see a physician each year\n• 2022 Canadian Tobacco and Nicotine Survey (CTNS, ages ≥15): 10.9% are current smokers\n• 4% of youth ages 15–19, 8% of young adults ages 20–24, and 12% of adults ≥25 smoke\n• More males (13%) than females (9%) smoke\n\nThe high physician visit rate among smokers (70%) means every clinical encounter is an opportunity for cessation counselling. Smoking cessation is the single most important intervention for preventing CAD. Even brief advice from a physician can increase quit rates. The CAN-ADAPTT guidelines mandate that all healthcare providers update tobacco use status, advise patients to quit, and assess willingness to quit at every interaction."
    difficulty: easy
    tags: [smoking, epidemiology, smoking cessation, prevention, Canada]
  - front: "What is the 2-3 Pattern of Smoking Cessation withdrawal timeline?"
    back: "• 2–3 hours after last cigarette: Onset of withdrawal\n• 2–3 days: Peak withdrawals\n• 2–3 weeks: Expect improvement of withdrawal symptoms\n• 2–3 months: Resolution of withdrawal; highest relapse rate within first 2–3 months\n\nUnderstanding the withdrawal timeline helps set patient expectations and timing of pharmacotherapy. Nicotine withdrawal symptoms include: low mood, insomnia, irritability, anxiety, difficulty concentrating, restlessness, decreased heart rate, and increased appetite. Physicians should warn patients about these expected symptoms and have a plan for managing them. The highest relapse risk is within the first 2–3 months."
    difficulty: easy
    tags: [smoking cessation, nicotine withdrawal, relapse, timeline]
  - front: "What is the '5 A's' framework for smoking cessation counselling for patients willing to quit?"
    back: "1. ASK: Ask if the patient currently smokes and is willing to discuss cessation\n2. ADVISE: Advise the patient to quit\n3. ASSESS: Assess willingness to quit\n4. ASSIST: Assist in quit attempt(s)\n5. ARRANGE: Arrange follow-up\n\nThe 5 A's is the standard framework for brief smoking cessation counselling. Combining counselling/behavioural therapies with pharmacotherapy is more effective than either alone. Minimum effective counselling: ≥4 sessions, >10 min each, with 6–12 month follow-up. 14% abstinent with counselling vs. 10% without. The STAR plan helps patients: Set a quit date, Tell family and friends, Anticipate challenges, Remove tobacco-related products."
    difficulty: easy
    tags: [smoking cessation, 5As, counselling, CAN-ADAPTT, quit plan]
  - front: "Compare the efficacy of the three main pharmacotherapies for smoking cessation."
    back: "• Placebo: ~8–11.5% abstinent at 12 months\n• NRT (Nicotine Replacement Therapy): 19.7% abstinent at 12 months (vs. 11.5% for placebo); combination NRT (fast-acting form + patch) is superior to single-form NRT\n• Bupropion SR (Zyban®): 21% abstinent at 12 months (vs. 8% placebo); similar effectiveness to NRT; start 7–14 days before quit date\n• Varenicline (Champix®): 23% abstinent from 9–52 weeks (vs. 16% bupropion vs. 9% placebo); most effective option; start 10–14 days before quit date\n\nVarenicline (Champix) is the most effective single pharmacotherapy for smoking cessation. It acts as a partial nicotinic receptor agonist (reduces cravings) and partial competitive antagonist (reduces response to smoked nicotine). Significant side effects (nausea, headache, unusual dreams, neuropsychiatric symptoms) can limit compliance. Bupropion's mechanism for cessation appears independent of its antidepressant effect. Combination NRT (patch + fast-acting form) is superior to single-form NRT."
    difficulty: medium
    tags: [smoking cessation, varenicline, bupropion, NRT, pharmacotherapy, Champix, Zyban]
  - front: "What are the different forms of Nicotine Replacement Therapy (NRT), their dosages, and key points?"
    back: "1. Nicotine Gum (OTC): 2 mg if <25 cigarettes/day; 4 mg if ≥25 cigarettes/day; 1 piece q1–2h for 1–3 months (max 24 pieces/day); chew until 'peppery' taste, then 'park' between gum and cheek\n2. Nicotine Patch (OTC): 8 weeks total; 21 mg/day × 6 wk → 14 mg/day × 2 wk → 7 mg/day × 2 wk; start with lower dose if <10 cigarettes/day; change q24h, alternate sides\n3. Nicotine Inhaler (OTC): 6–16 cartridges/day up to 12 weeks; nicotine absorbed in mouth and throat (not lungs)\n4. Nicotine Nasal Spray (Rx): newer form\n\nNRT provides nicotine without other harmful substances in cigarettes, reducing cravings and withdrawal symptoms. No significant difference in abstinence rates between different NRT forms as monotherapy. Combination NRT (patch + fast-acting form like gum/inhaler) is superior to single-form NRT with high certainty evidence. Use with caution immediately post-MI, worsening angina, or arrhythmia. Advise patients not to smoke while using NRT."
    difficulty: medium
    tags: [NRT, nicotine replacement therapy, smoking cessation, nicotine gum, nicotine patch, varenicline]
  - front: "What is the mechanism of action of varenicline (Champix®) and how does it achieve its effect on smoking cessation?"
    back: "Varenicline is a partial nicotinic receptor agonist AND a partial competitive nicotinic receptor antagonist:\n• As a partial agonist: stimulates nicotine receptors enough to reduce cravings and withdrawal symptoms\n• As a partial competitive antagonist: blocks nicotine from binding to receptors, thereby reducing the rewarding effects of smoked nicotine (reduces the 'pleasure' from cigarettes)\n\nStart 10–14 days before quit date. 23% abstinent from 9–52 weeks vs. 16% with bupropion vs. 9% with placebo.\n\nVarenicline's dual mechanism makes it uniquely effective: it satisfies nicotine cravings while simultaneously preventing the reinforcing effects of continued smoking. Important side effects include nausea, headache, drowsiness, unusual dreams, and neuropsychiatric symptoms (depression, suicidality — though the evidence for this has been debated). FDA and Health Canada require monitoring for mood/behaviour changes. Lower patient compliance due to side effects can limit real-world effectiveness."
    difficulty: hard
    tags: [varenicline, Champix, mechanism of action, nicotinic receptor, smoking cessation]
  - front: "According to Canadian CAN-ADAPTT guidelines, what are the 4 key responsibilities of healthcare providers regarding tobacco cessation?"
    back: "1. Update tobacco use status for all patients regularly\n2. Clearly advise patients to quit\n3. Assess patient willingness to quit and offer assistance to those who express interest\n4. Conduct regular follow-up to assess response and monitor mental health status/other addictions while quitting\n\nThe 2012 CAN-ADAPTT guidelines emphasize that tobacco cessation is a core responsibility of all healthcare providers, not just specialists. The guidelines also emphasize monitoring mental health during cessation (as withdrawal can precipitate mood disorders) and monitoring for other addictions (patients may substitute substances). Social support, community resources, self-help, group therapy, helplines, and web-based strategies should be offered to all patients willing to quit."
    difficulty: easy
    tags: [smoking cessation, CAN-ADAPTT, healthcare provider, tobacco, counselling]
  - front: "What is the Framingham Risk Score (FRS), and how is it used in clinical practice for dyslipidemia?"
    back: "The FRS estimates the 10-year risk of developing CAD and is calculated based on: gender, age, HDL-C, total cholesterol (TC), systolic BP, smoking status, and diabetes.\n\nKey uses:\n• To be completed for men and women ages 40–75 every 5 years\n• Family history of premature CVD (<55 in male 1st-degree relative; <65 in female 1st-degree relative) DOUBLES the FRS\n• Risk categories: Low <10%, Intermediate 10–19%, High ≥20%\n• Used to determine when to initiate pharmacotherapy\n• CV age can be calculated to increase patient adherence\n• LDL cannot be calculated when TG ≥4.5 mmol/L (use non-HDL-C instead)\n\nThe FRS is the primary risk stratification tool in Canadian dyslipidemia guidelines. Non-fasting TC and non-HDL-C hold the same prognostic value as fasting lipids for FRS calculation. Repeat screening every 5 years if FRS <5%, or annually if FRS ≥5%. The Cardiovascular Life Expectancy Model (CLEM) is an alternative risk assessment tool. High-risk patients warrant immediate statin therapy without a 3-month lifestyle modification trial."
    difficulty: medium
    tags: [Framingham Risk Score, cardiovascular risk, dyslipidemia, LDL, CAD, risk stratification]
  - front: "What are the risk factors that indicate screening for dyslipidemia at any age (before the standard age thresholds of 40 years)?"
    back: "• Men and women aged ≥40 (or South Asian individuals or individuals of Asian origin)\n• Current cigarette smoking\n• T2DM\n• Arterial HTN\n• Family history of premature CVD (men <55, women <65 in 1st-degree relative)\n• Chronic kidney disease (CKD)\n• Family history of dyslipidemia\n• Erectile dysfunction\n• Inflammatory disease (lupus, RA, psoriatic arthritis, IBD)\n• HIV infection\n• COPD\n• Clinical evidence of atherosclerosis or carotid artery disease\n• Stigmata of dyslipidemia (arcus cornea, xanthelasma, xanthoma)\n• Obesity (BMI ≥30 kg/m²)\n• Hypertensive diseases of pregnancy\n\nThe standard screening age is 40 years for both sexes, but the presence of risk factors indicates earlier screening. Notably, erectile dysfunction is an independent cardiovascular risk factor and a marker of subclinical atherosclerosis (penile arteries are smaller and affected earlier than coronary arteries). HIV and COPD are recognized as increasing cardiovascular risk. Hypertensive diseases of pregnancy (pre-eclampsia) are associated with long-term cardiovascular risk."
    difficulty: medium
    tags: [dyslipidemia, screening, risk factors, CKD, HIV, erectile dysfunction, inflammatory disease]
  - front: "A 45-year-old man has been on atorvastatin 40 mg for 3 months. He complains of muscle aches. His CK is 5× the upper limit of normal. What is the appropriate management?"
    back: "Since CK is 5× ULN with symptoms (myalgia), this is concerning for statin-induced myopathy. The threshold to stop is CK >2–3× ULN IF symptomatic. With CK at 5× ULN AND symptoms, the statin should be STOPPED. If asymptomatic, tolerate CK up to 10× ULN. After resolution, consider re-challenging with a lower-dose statin or switching to an alternative (e.g., ezetimibe as monotherapy, rosuvastatin at lower dose, or alternate-day dosing).\n\nStatin-induced myopathy ranges from myalgia (muscle pain without CK elevation) to rhabdomyolysis (severe CK elevation with myoglobinuria and renal failure). The CCS monitoring guidelines specify: tolerate CK up to 10× ULN in asymptomatic patients; stop if 2–3× ULN if symptomatic. Rhabdomyolysis risk increases with statin-fibrate combinations. Risk of any adverse event from statins is OR 1.4 (95% CI 1.09–1.80), but serious events are rare (NNH ~400 for serious adverse events)."
    difficulty: hard
    tags: [statin, myopathy, CK, adverse effects, dyslipidemia, management]
  - front: "What is the physical activity recommendation for older adults (≥65 years) according to the 2020 CSEP Guidelines, and what additional consideration applies?"
    back: "Same as adults 18–64:\n• ≥150 min/week of moderate-to-vigorous intensity aerobic physical activity in bouts of ≥10 min\n• Muscle/bone strengthening activities ≥2 days/week\n• 7–9 hours/day of sleep\n• Limit sedentary time ≤8 hours/day\n\nAdditional consideration: Physical activities that challenge BALANCE (those with poor mobility should perform activities to enhance balance and prevent falls).\n\nFall prevention is a key priority for older adults. Activities that improve balance (tai chi, single-leg standing, yoga) should be incorporated in addition to aerobic and resistance training. Falls are the leading cause of injury-related hospitalization in older Canadians. The balance component of the guidelines specifically targets mobility-impaired older adults to prevent falls and fractures."
    difficulty: easy
    tags: [exercise, older adults, fall prevention, balance, CSEP, physical activity guidelines]
  - front: "What are the key differences between a patient in the 'Pre-Contemplation' and 'Preparation' stage of change, and how should the physician approach each differently?"
    back: "Pre-Contemplation:\n• Patient does NOT consider changing behaviour a possibility\n• Physician aim: raise the issue sensitively, offer neutral exchange of information (to AVOID resistance), increase awareness of the problem and its risks\n• Do NOT prescribe action steps yet\n\nPreparation:\n• Patient has decided to change and is choosing how\n• Physician aim: explore realistic options, discuss inevitable difficulties, identify high-risk situations, develop relapse prevention strategies, strengthen commitment and confidence\n• NOW is the time to create a concrete plan (e.g., quit date, STAR plan for smoking)\n\nMatching the physician's response to the patient's stage prevents resistance and builds therapeutic alliance. Pushing action steps on a pre-contemplative patient creates resistance ('Why should I listen to you?'). Providing only awareness-raising to a patient in preparation wastes an opportunity. The Transtheoretical Model underpins motivational interviewing, a key skill tested on the MCCQE1 for chronic disease management and preventive counselling."
    difficulty: hard
    tags: [stages of change, motivational interviewing, pre-contemplation, preparation, behaviour change]
  - front: "In Canada, what is the prevalence of osteoporosis in women and men?"
    back: "1 in 4 women and 1 in 8 men are affected by osteoporosis in Canada.\n\nOsteoporosis is a common age-related disease characterized by decreased bone mass and increased fracture susceptibility. Canadian prevalence data highlights the disproportionate burden in women, particularly post-menopausal women, compared to men."
    difficulty: easy
    tags: [osteoporosis, epidemiology, family-medicine, bone-health]
  - front: "Which two validated Canadian tools are used for 10-year fracture risk assessment in osteoporosis?"
    back: "FRAX (WHO Fracture Risk Assessment Tool) and CAROC (Canadian Association of Radiologists and Osteoporosis Canada) — both validated in the Canadian population and available at osteoporosis.ca.\n\nFRAX and CAROC are the two recommended fracture risk assessment tools in Canada. Both incorporate clinical risk factors and BMD values to estimate 10-year probability of a major osteoporotic fracture, guiding treatment decisions per the 2023 Canadian clinical practice guidelines."
    difficulty: easy
    tags: [osteoporosis, FRAX, CAROC, fracture-risk, family-medicine]
  - front: "According to the 2023 Canadian osteoporosis guidelines, what 10-year fracture risk threshold or T-score triggers pharmacotherapy recommendation?"
    back: "Pharmacotherapy is suggested when 10-year fracture risk >20% OR T-score <-2.5 AND age >70 years.\n\nThe 2023 Canadian Clinical Practice Guidelines for osteoporosis specify that pharmacotherapy should be suggested for patients with high fracture risk (>20% at 10 years) or those aged >70 with T-score <-2.5. Intermediate risk (10–20%) warrants BMD reassessment in 3 years if on therapy."
    difficulty: medium
    tags: [osteoporosis, pharmacotherapy, T-score, fracture-risk, family-medicine]
  - front: "List 5 secondary causes of osteoporosis (conditions that cause secondary osteoporosis)."
    back: "Primary hyperparathyroidism, Type 1 DM, osteogenesis imperfecta, uncontrolled hyperthyroidism, hypogonadism or premature menopause (<45 yr), Cushing's disease, chronic malnutrition/malabsorption, chronic liver disease, COPD, and chronic inflammatory conditions (e.g., IBD).\n\nSecondary osteoporosis arises from identifiable underlying conditions. When these are identified, specialist referral for co-management should be considered. Recognizing secondary causes is important as they may require specific treatments beyond standard osteoporosis pharmacotherapy."
    difficulty: medium
    tags: [osteoporosis, secondary-causes, family-medicine, bone-health]
  - front: "What are the three physical exam findings that suggest possible vertebral fracture in the assessment of osteoporosis?"
    back: "1. Prospective height loss >2 cm or historical height loss >6 cm; 2. Rib-to-pelvis distance <2 finger-breadths in the midaxillary line; 3. Occiput-to-wall distance >5 cm.\n\nThese clinical signs are inexpensive bedside tests that suggest undiagnosed vertebral fractures. A finding of vertebral fracture(s) upgrades fracture risk and can guide appropriate choice and duration of osteoporosis therapy, often prompting lateral spine imaging."
    difficulty: medium
    tags: [osteoporosis, vertebral-fracture, physical-exam, family-medicine]
  - front: "What is the recommended daily calcium intake for adults aged 19–50 years versus those aged >50 years?"
    back: "Adults 19–50: 1000 mg/day. Adults >50: 1200 mg/day.\n\nAdequate calcium intake is fundamental to bone health. Dietary calcium is preferred (e.g., 1 cup milk = 300 mg, 1/2 cup yogurt = 332 mg), with supplementation added only to meet the target. Requirements increase after age 50 due to decreased calcium absorption and increased bone turnover."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, family-medicine]
  - front: "What is the recommended daily vitamin D supplementation for adults 19–50 years versus those >50 years (or those with risk factors)?"
    back: "Adults 19–50: 400–1000 IU/day. Adults >50 or younger adults with risk factors (osteoporosis, multiple fractures, or conditions affecting vitamin D absorption): 800–2000 IU/day.\n\nVitamin D is critical for calcium absorption and bone mineralization. Dietary sources (fortified milk, fatty fish) provide limited amounts, so supplementation is usually necessary. Most multivitamins contain only 400 IU, which may be insufficient for older adults or those at risk."
    difficulty: easy
    tags: [osteoporosis, vitamin-D, supplementation, family-medicine]
  - front: "How often should BMD be reassessed in a patient who was started on osteoporosis pharmacotherapy?"
    back: "Reassess BMD in 3 years if initiated on pharmacotherapy. Reassess earlier if the patient develops secondary causes, a new fracture, or other risk factors for rapid bone loss.\n\nPer the 2023 Canadian osteoporosis guidelines, patients on pharmacotherapy should have BMD measured at 3 years to assess response. Those NOT on pharmacotherapy should be reassessed at 5–10 years if risk <10%, 5 years if risk 10–15%, and 3 years if risk ≥15%."
    difficulty: medium
    tags: [osteoporosis, BMD, monitoring, pharmacotherapy, family-medicine]
  - front: "What investigations should be ordered in the workup of osteoporosis?"
    back: "CBC, creatinine, corrected calcium, ALP, TSH, 25-hydroxyvitamin D (after 3–4 months of adequate supplementation), and serum protein electrophoresis if vertebral fractures are present.\n\nThese investigations help identify secondary causes of osteoporosis and establish a baseline. 25-hydroxyvitamin D should be measured after adequate supplementation to assess true vitamin D status. Protein electrophoresis screens for multiple myeloma, which can cause vertebral fractures."
    difficulty: medium
    tags: [osteoporosis, investigations, laboratory, family-medicine]
  - front: "Which STI is the most common reportable STI in Canada, and which is the second most common?"
    back: "Most common: chlamydia (Chlamydia trachomatis). Second most common: gonorrhea (Neisseria gonorrhoeae).\n\nChlamydia is the most prevalent reportable STI in Canada, often asymptomatic especially in women, leading to underdiagnosis if not screened. Gonorrhea is second most common and has increasing antibiotic resistance. Both are mandatorily reportable to public health."
    difficulty: easy
    tags: [STI, chlamydia, gonorrhea, epidemiology, family-medicine]
  - front: "What are the 5 P's of sexual history taking in STI assessment?"
    back: "Partners (numbers, gender), Practices (vaginal, oral, anal insertive/receptive), Protection, Past history of STIs, Pregnancy prevention.\n\nA thorough sexual history using the 5 P's framework is essential for STI risk assessment. It guides appropriate screening, counseling, and partner notification. Information about practices helps determine which anatomical sites to screen."
    difficulty: easy
    tags: [STI, sexual-history, 5Ps, family-medicine, preventive-care]
  - front: "What are the STI screening recommendations in Canada for gonorrhea and chlamydia?"
    back: "Annual screening for all sexually active people under age 30. Individuals at increased risk should also be screened for hepatitis B, HIV, and syphilis. Pap test every 3 years for anyone with a cervix aged 25–69 who has ever been sexually active.\n\nCanadian STI guidelines emphasize opportunistic screening, particularly in young sexually active individuals. Screening is the cornerstone of STI control since both chlamydia and gonorrhea are frequently asymptomatic, preventing transmission and complications such as PID and infertility."
    difficulty: medium
    tags: [STI, screening, chlamydia, gonorrhea, family-medicine, preventive-care]
  - front: "Which STIs are mandatorily reportable in Canada?"
    back: "Chlamydia, gonorrhea, hepatitis B, HIV, syphilis, and chancroid.\n\nMandatory reporting to public health allows for contact tracing, surveillance, and outbreak control. A patient with a bacterial STI or trichomoniasis should abstain from sexual activity until treatment is complete and for 7 days after treatment for both partners (or until test of cure)."
    difficulty: easy
    tags: [STI, mandatory-reporting, public-health, family-medicine]
  - front: "What is the first-line treatment for uncomplicated gonococcal urethritis/cervicitis?"
    back: "Ceftriaxone 250 mg IM single dose PLUS azithromycin 1 g PO single dose. Always treat for both gonococcal AND non-gonococcal (i.e., chlamydia) simultaneously.\n\nDual therapy is recommended because co-infection with chlamydia is common, and combined treatment reduces antibiotic resistance development. Test of cure with cultures 3–7 days post-treatment is required for pharyngeal infections, ongoing symptoms, treatment failure, or pregnancy."
    difficulty: medium
    tags: [gonorrhea, STI, treatment, antibiotics, family-medicine]
  - front: "What is the treatment for non-gonococcal urethritis/cervicitis (usually Chlamydia trachomatis)?"
    back: "Doxycycline 100 mg PO BID x 7 days plus gonococcal urethritis/cervicitis prescription (dual therapy). Repeat screening at 3 months post-treatment.\n\nChlamydia treatment requires a 7-day course of doxycycline or alternative regimens. Because co-infection with gonorrhea is common, dual treatment is initiated simultaneously. Follow-up screening at 3 months is recommended due to high rates of reinfection."
    difficulty: medium
    tags: [chlamydia, STI, treatment, doxycycline, family-medicine]
  - front: "What is the first-line treatment for primary infectious syphilis (Treponema pallidum)?"
    back: "Benzathine penicillin G 2.4 million units IM single dose. For late latent syphilis: 2.4 million units IM penicillin G once weekly for 3 weeks.\n\nBenzathine penicillin G remains the treatment of choice for syphilis at all stages. Partners from the last 3–12 months must be notified. Continuous follow-up and serological testing is required until patients are seronegative to confirm treatment success."
    difficulty: medium
    tags: [syphilis, STI, treatment, penicillin, family-medicine]
  - front: "What are the treatment options for a first episode of genital herpes (HSV-1 or HSV-2)?"
    back: "Acyclovir 400 mg PO TID x 7–10 days, OR Famciclovir 250 mg PO TID x 7–10 days, OR Valacyclovir 1000 mg PO BID x 7–10 days.\n\nAntiviral therapy for primary genital herpes reduces severity and duration of symptoms. It does not cure the infection or prevent future recurrences. Recurrent episodes are typically milder and shorter. Antivirals do not reliably prevent transmission."
    difficulty: medium
    tags: [herpes, HSV, STI, treatment, antiviral, family-medicine]
  - front: "What HPV vaccine (Gardasil) is offered in Canada and to which groups?"
    back: "Gardasil is offered to: females aged 9–27, women ≥27 at risk of ongoing exposure, males aged 9–27 (to prevent anogenital cancer and genital warts), and individuals ≥27 at risk of ongoing exposure.\n\nHPV vaccination is highly effective at preventing cervical, anal, and genital cancers as well as genital warts. Gardasil 9 protects against HPV types 6, 11, 16, 18, 31, 33, 45, 52, and 58. Vaccination is most effective before exposure (i.e., before sexual debut)."
    difficulty: medium
    tags: [HPV, vaccination, STI, prevention, family-medicine]
  - front: "What is the PODS mnemonic for sinusitis symptoms?"
    back: "Facial Pain/pressure/fullness, nasal Obstruction, nasal Purulence or discoloured postnasal Discharge, Smell disorder (hyposmia/anosmia).\n\nPODS captures the cardinal symptoms of sinusitis as per Canadian guidelines. For a diagnosis of acute bacterial rhinosinusitis (ABRS), the patient must have nasal obstruction or nasal purulence/discharge AND at least one other PODS symptom."
    difficulty: easy
    tags: [sinusitis, PODS, diagnosis, family-medicine, ENT]
  - front: "What are the red flags in sinusitis that warrant urgent referral?"
    back: "Altered mental status, severe headache, systemic toxicity, swelling of the orbit or change in visual acuity or extraocular muscles, hard neurological findings, signs of meningeal irritation, suspected intracranial complications (meningitis, intracranial abscess, cavernous sinus thrombosis), involvement of associated structures (periorbital/preseptal cellulitis, Pott's puffy tumour).\n\nThese red flags indicate potential life-threatening complications of sinusitis including intracranial extension or orbital complications. Urgent assessment and imaging (CT) are required. Pott's puffy tumour is a subperiosteal abscess of the frontal bone — a rare but serious complication."
    difficulty: medium
    tags: [sinusitis, red-flags, urgent-referral, family-medicine, ENT]
  - front: "What is the most common viral etiology of sinusitis and what is the most common bacterial etiology?"
    back: "Most common viral cause: rhinovirus (also influenza, parainfluenza). Most common bacterial causes: Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis.\n\nViral sinusitis is far more common than bacterial. ABRS should be suspected when symptoms worsen after 5–7 days (biphasic illness), persist >7 days without improvement, or purulence is present for 3–4 days with high fever. Antibiotic use should be reserved for ABRS."
    difficulty: easy
    tags: [sinusitis, etiology, bacteria, virus, family-medicine]
  - front: "What is the first-line antibiotic for acute bacterial rhinosinusitis in adults, and what are alternatives for penicillin allergy?"
    back: "First-line: amoxicillin 500 mg PO TID x 5–10 days. Penicillin allergy: doxycycline 100 mg PO BID x 5–10 days. Second-line or antibiotic resistance risk: amoxicillin-clavulanate 500 mg TID or 875 mg BID, or a respiratory fluoroquinolone (levofloxacin 750 mg once daily or moxifloxacin 400 mg daily) x 5–10 days.\n\nAntibiotics are indicated for severe ABRS or those failing to improve with intranasal corticosteroids. Mild-to-moderate ABRS is managed with intranasal corticosteroids alone. ENT referral is warranted for anatomic defects, failure of second-line therapy, or ≥4 episodes per year."
    difficulty: medium
    tags: [sinusitis, antibiotics, amoxicillin, family-medicine, ENT]
  - front: "What is the first-line treatment for mild-to-moderate acute bacterial rhinosinusitis versus severe ABRS?"
    back: "Mild-to-moderate: intranasal corticosteroids (INCS) alone. Severe: INCS plus antibiotics.\n\nPer Canadian sinusitis guidelines, the severity of ABRS guides treatment. Mild symptoms are occasional and easily tolerated; moderate symptoms are steady but manageable; severe symptoms are hard to tolerate and may interfere with activity or sleep. Watchful waiting with symptom relief is appropriate for mild disease."
    difficulty: medium
    tags: [sinusitis, ABRS, treatment, corticosteroids, antibiotics, family-medicine]
  - front: "What is the prevalence of sleep problems in the primary care setting?"
    back: "1/3 of patients in a primary care setting have occasional sleep problems; 10% have chronic sleep problems.\n\nSleep disorders are highly prevalent in primary care and are frequently underdiagnosed. The three main sleep complaints are insomnia (difficulty falling/staying asleep, early wakening, non-refreshing sleep), parasomnias (night terrors, restless leg syndrome, somnambulism), and excessive daytime sleepiness."
    difficulty: easy
    tags: [sleep-disorders, insomnia, epidemiology, family-medicine]
  - front: "What is the first-line treatment for primary insomnia?"
    back: "Cognitive Behavioural Therapy for Insomnia (CBT-I), which includes: sleep hygiene education, relaxation therapy (deep breathing, meditation, biofeedback), stimulus control therapy, and sleep restriction therapy.\n\nCBT-I is the evidence-based first-line treatment for chronic insomnia, superior to pharmacotherapy for long-term outcomes. Pharmacologic treatment (benzodiazepines, non-benzodiazepines) is used only as a short-term supplement (<14 days) with appropriate follow-up in 7–14 days."
    difficulty: easy
    tags: [insomnia, CBT-I, sleep-disorders, family-medicine, treatment]
  - front: "What are the risk factors for obstructive sleep apnea (OSA)?"
    back: "Male gender, obesity (BMI high), large tonsils and adenoids in children, aging (decreased muscle tone), craniofacial abnormalities, and positive family history (FMHx).\n\nOSA results from partial or complete upper airway obstruction due to collapse of the base of the tongue, soft palate with uvula, and epiglottis during sleep. Understanding risk factors guides appropriate screening and referral for nocturnal polysomnography."
    difficulty: easy
    tags: [OSA, obstructive-sleep-apnea, risk-factors, family-medicine, respirology]
  - front: "What is the diagnostic criterion for OSA on nocturnal polysomnography?"
    back: "Greater than 15 apneic/hypopneic episodes per hour of sleep.\n\nThis is the Apnea-Hypopnea Index (AHI) threshold for diagnosing OSA. Apneas are defined as cessation of breathing for ≥10 seconds. Apneic episodes can last 20–180 seconds and occur 100–600 episodes per night in severe cases."
    difficulty: medium
    tags: [OSA, polysomnography, diagnosis, AHI, family-medicine]
  - front: "What are the cardiovascular consequences of untreated OSA?"
    back: "Hypertension (2x increased risk), coronary artery disease (3x increased risk), stroke (4x increased risk), cardiac arrhythmias, pulmonary hypertension, right ventricular dysfunction, and cor pulmonale. OSA is an independent risk factor for CAD.\n\nChronic hypoxemia and sympathetic activation from repetitive apneas drive cardiovascular complications. These significant risks make treatment of OSA critical beyond just improving sleep quality and daytime function. Other consequences include morning headache (hypercapnia), sexual dysfunction, and cognitive impairment."
    difficulty: medium
    tags: [OSA, cardiovascular, complications, hypertension, family-medicine]
  - front: "What is the primary treatment for OSA, and what is the physician's reporting obligation if OSA is not controlled?"
    back: "Primary treatment is CPAP (continuous positive airway pressure), which maintains patent airway in 95% of OSA cases. If OSA is not controlled by CPAP, the physician must report the patient to the Ministry of Transportation (driving restriction).\n\nCPAP is the gold-standard treatment for moderate-to-severe OSA. Reporting to the Ministry of Transportation is required because uncontrolled OSA impairs driving due to excessive daytime sleepiness, creating a significant public safety risk. Surgical options (UPPP, tonsillectomy) are alternatives for those intolerant of CPAP."
    difficulty: medium
    tags: [OSA, CPAP, treatment, Ministry-of-Transportation, family-medicine, medico-legal]
  - front: "What is the Modified Centor Score used for, and what are its criteria?"
    back: "The Modified Centor Score estimates the probability of Group A beta-hemolytic Streptococcus (GABHS) in pharyngitis. Criteria: +1 for absent cough, +1 for fever >38°C history, +1 for tonsillar exudate, +1 for swollen/tender anterior cervical nodes, +1 for age 5–14, 0 for age 15–44, -1 for age >45.\n\nIn communities with moderate strep prevalence (10–20%), a score of 0–2 carries <1–15% probability of GABHS and no further testing or antibiotics are needed. A score ≥3 warrants a Rapid Antigen Detection Test (RADT) and treatment with antibiotics if positive. The score is not applicable to children <5 years."
    difficulty: medium
    tags: [GABHS, Centor-score, pharyngitis, streptococcal, family-medicine]
  - front: "What is the gold standard for diagnosing GABHS pharyngitis, and what is the sensitivity and specificity of rapid antigen detection testing (RADT)?"
    back: "Gold standard: throat culture. RADT: high specificity (95–99%) but moderate sensitivity (85%). Nucleic acid detection has high sensitivity (92%).\n\nRADT provides rapid results but can miss cases (false negatives) due to moderate sensitivity. For this reason, a negative RADT in patients <20 years should be followed by throat culture. In patients >20 years with a negative RADT, antibiotics should not be given."
    difficulty: medium
    tags: [GABHS, pharyngitis, RADT, diagnosis, family-medicine]
  - front: "What are the non-suppurative complications of Group A beta-hemolytic Streptococcal (GABHS) pharyngitis?"
    back: "Acute rheumatic fever and acute glomerulonephritis.\n\nSuppurative complications include abscess, sinusitis, otitis media, cervical adenitis, and pneumonia. Importantly, antibiotic treatment reduces the risk of rheumatic fever but does NOT reduce the incidence of post-streptococcal glomerulonephritis. A 10-day antibiotic course is required for strep treatment."
    difficulty: medium
    tags: [GABHS, rheumatic-fever, glomerulonephritis, complications, family-medicine]
  - front: "What is the antibiotic of choice for streptococcal pharyngitis in adults, and what is used in penicillin allergy?"
    back: "First-line: penicillin V 300 mg PO TID or 600 mg BID x 10 days. Mild penicillin allergy: cefuroxime 500 mg PO BID x 10 days. Severe/anaphylactic penicillin allergy: azithromycin (12 mg/kg/day, max 500 mg/dose) x 5 days.\n\nA full 10-day course of antibiotics is essential for GABHS pharyngitis to prevent rheumatic fever. Penicillin remains the drug of choice due to excellent efficacy and lack of resistance. There is no increased risk of rheumatic fever with a 48-hour delay in treatment pending culture confirmation."
    difficulty: medium
    tags: [streptococcal-pharyngitis, penicillin, treatment, antibiotics, family-medicine]
  - front: "What is infectious mononucleosis (EBV), and how is it managed?"
    back: "EBV (Epstein-Barr virus) causes infectious mononucleosis: pharyngitis, tonsillar exudate, fever, lymphadenopathy, fatigue, and rash. Diagnosis: peripheral blood smear and heterophile antibody test (monospot). Management: self-limiting; symptomatic treatment (acetaminophen/NSAIDs); avoid heavy physical activity and contact sports for at least 1 month or until splenomegaly resolves (risk of splenic rupture); corticosteroids and ENT consult if acute airway obstruction.\n\nEBV-associated mononucleosis is important because antibiotics are NOT indicated and may cause a maculopapular rash (especially with amoxicillin/ampicillin). The key danger is splenic rupture from trauma, requiring activity restrictions. Monospot test has high specificity but lower sensitivity in the first week."
    difficulty: medium
    tags: [EBV, mononucleosis, pharyngitis, splenomegaly, family-medicine]
  - front: "What are the principles of palliative care?"
    back: "Early identification of patients who could benefit; support and treat both patient and family; address physical, psychological, social, and spiritual needs; establish a multidisciplinary team; focus on symptom management and comfort; offer therapeutic environment and bereavement support; ensure maintenance of human dignity.\n\nPalliative care is not limited to end-of-life care but should begin early in a serious illness trajectory. It complements curative treatment and aims to improve quality of life through holistic, patient-centred care. The multidisciplinary team may include physicians, nurses, social workers, chaplains, and others."
    difficulty: easy
    tags: [palliative-care, end-of-life, family-medicine]
  - front: "What is the Cockcroft-Gault formula for creatinine clearance in elderly patients, and why is serum creatinine alone unreliable in the elderly?"
    back: "CrCl (mL/min) = (weight in kg × (140 – age) × 1.23) / serum creatinine in μmol/L. Multiply by 0.85 for females. Serum creatinine is unreliable because elderly patients have reduced muscle mass, leading to less creatinine production — normal serum creatinine can mask significantly reduced renal function.\n\nIn the elderly, age-related muscle loss means creatinine production is reduced; serum creatinine may appear normal even with significant GFR decline. CrCl calculation helps identify true renal function for dosing medications. It overestimates CrCl when muscle mass is disproportionately reduced beyond normal aging."
    difficulty: medium
    tags: [renal-function, Cockcroft-Gault, elderly, creatinine, family-medicine, geriatrics]
  - front: "What is the approach to medication review in elderly patients?"
    back: "Ask patient to bring all current medications; review Beers Criteria (2019) for potentially inappropriate medications; consult deprescribing.org; screen for adverse drug effects and interactions; eliminate unnecessary medications (duplicates or redundant pharmacologic effects); simplify dosing regimen; discuss goals of care to guide pharmacologic management; ensure patient understands medications and directions.\n\nPolypharmacy is a major issue in the elderly, leading to adverse drug events, falls, and hospitalizations. The Beers Criteria identifies medications with risk/benefit profiles that are unfavourable in older adults. Deprescribing is an active, evidence-based process of tapering or stopping inappropriate medications."
    difficulty: medium
    tags: [polypharmacy, elderly, Beers-criteria, deprescribing, family-medicine, geriatrics]
  - front: "What is the prevalence of complementary and integrative medicine (CAM) use among Canadians, and what are the most common reasons for use?"
    back: "50–75% of Canadians report some CAM use over their lifetime, but only half disclose this to their physician. Most common uses: gynecological problems, anxiety, headaches, digestive problems.\n\nNon-disclosure of CAM use is common and clinically significant due to potential herb-drug interactions and false assurance of treatment. Physicians should routinely ask about CAM use, especially herbal products, using a non-judgmental approach. Examples of CAM include chiropractic, acupuncture, naturopathy, and homeopathy."
    difficulty: easy
    tags: [CAM, complementary-medicine, natural-health-products, family-medicine]
  - front: "What are the potential drug interactions of St. John's Wort?"
    back: "Interacts with: antidepressants/SSRIs (serotonin syndrome risk), cyclosporine, digoxin, irinotecan (cancer medication), anticoagulants (warfarin), and is contraindicated with indinavir (HIV drug). Also affects CYP450 enzyme system.\n\nSt. John's Wort (Hypericum perforatum) is used for mild-to-moderate depression but is a potent CYP450 inducer, reducing plasma levels of many medications. It is one of the most clinically important herb-drug interactions. Adverse effects include photosensitivity, anxiety, dry mouth, GI symptoms, and sexual dysfunction."
    difficulty: medium
    tags: [St-Johns-Wort, herbal, drug-interactions, CAM, family-medicine]
  - front: "What are the drug interactions and adverse effects of Ginkgo Biloba?"
    back: "Drug interactions: anticoagulants and ASA (increased bleeding risk). Adverse effects: headache, stomach upset, bleeding, severe allergic reactions (whole plant/seeds/pulp). Raw or roasted seeds/pulp are poisonous if ingested.\n\nGinkgo biloba is used to increase peripheral circulation for conditions like Alzheimer's dementia, intermittent claudication, and tinnitus. The bleeding risk from interaction with anticoagulants and antiplatelet agents (ASA) is clinically significant and should be assessed preoperatively."
    difficulty: medium
    tags: [Ginkgo, herbal, drug-interactions, anticoagulant, CAM, family-medicine]
  - front: "Which herbal product is used for BPH as an adjunct to finasteride, and what are its known drug interactions?"
    back: "Saw palmetto. Drug interactions: none known. Adverse effects include mild GI distress and headache.\n\nSaw palmetto (Serenoa repens) is commonly used for benign prostatic hyperplasia. While some evidence supports modest symptom improvement, clinical evidence is mixed. It is often used alongside finasteride (5-alpha reductase inhibitor) in managing lower urinary tract symptoms."
    difficulty: medium
    tags: [saw-palmetto, BPH, herbal, CAM, family-medicine]
  - front: "What are the key drug interactions of garlic supplements?"
    back: "Interactions with anticoagulants (increased bleeding risk) and saquinavir (HIV drug — reduces plasma levels). May increase postoperative bleeding.\n\nGarlic has antiplatelet effects and can reduce the efficacy of HIV medications like saquinavir. Patients should be counselled to disclose garlic supplement use, especially before surgery or when on anticoagulant therapy. Raw garlic contact dermatitis is a recognized adverse effect."
    difficulty: medium
    tags: [garlic, herbal, drug-interactions, anticoagulant, CAM, family-medicine]
  - front: "What is the first-line antibiotic treatment for community-acquired pneumonia (CAP) in an outpatient without comorbidities?"
    back: "Amoxicillin 1000 mg PO TID x 5–7 days (for patients >50, where mycoplasma is less likely). If atypical organisms suspected, add clarithromycin 500 mg PO BID or azithromycin 500 mg PO on day 1 then 250 mg daily x 4 days. Second-line: doxycycline 200 mg PO on day 1 then 100 mg PO BID x 5–7 days.\n\nCAP outpatient treatment covers typical organisms (S. pneumoniae) as first priority. Adding a macrolide or using doxycycline covers atypical organisms (Mycoplasma, Chlamydia pneumoniae). Fluoroquinolones (levofloxacin, moxifloxacin) are reserved for treatment failure or patients with comorbidities."
    difficulty: hard
    tags: [pneumonia, CAP, antibiotics, amoxicillin, family-medicine, respirology]
  - front: "What are the two regimens recommended for H. pylori eradication in peptic ulcer disease (non-NSAID related)?"
    back: "Option 1 (Triple therapy): PPI PO BID + amoxicillin 1000 mg PO BID + clarithromycin 500 mg PO BID + metronidazole 500 mg PO BID x 7 days. Option 2 (Bismuth quadruple therapy): PPI PO BID + bismuth subsalicylate 525 mg PO QID + metronidazole 500 mg PO QID + tetracycline 500 mg PO QID x 7–14 days.\n\nH. pylori eradication is essential for healing peptic ulcers and preventing recurrence. PPIs include lansoprazole 30 mg, omeprazole 20 mg, pantoprazole 40 mg, or rabeprazole 20 mg. Bismuth quadruple therapy is preferred in regions with high clarithromycin resistance."
    difficulty: hard
    tags: [H-pylori, peptic-ulcer, eradication, PPI, antibiotics, family-medicine, gastroenterology]
  - front: "What is the treatment for Clostridioides difficile (C. difficile) diarrhea — mild-to-moderate versus severe disease?"
    back: "Mild-to-moderate (WBC <15 x 10⁹/L and creatinine <1.5x baseline): vancomycin 125 mg PO QID x 10–14 days. Severe (WBC ≥15 x 10⁹/L or creatinine ≥1.5x baseline): vancomycin 125 mg PO QID x 10–14 days (same regimen, but higher vigilance and possible fidaxomicin or surgical consult).\n\nC. difficile infection most commonly follows antibiotic use (especially clindamycin). Oral vancomycin is preferred over metronidazole for all disease severity per current guidelines. IV vancomycin is not effective as it does not reach the colon; oral route is essential."
    difficulty: hard
    tags: [C-difficile, diarrhea, vancomycin, antibiotics, family-medicine, gastroenterology]
  - front: "What is the first-line treatment for acute otitis media (AOM) in children under 6 months, and what is appropriate for children aged 6–24 months?"
    back: "Under 6 months: treat with antibiotics. Ages 6–24 months: watchful waiting is appropriate if parents can observe child for 48 hours with a plan to reassess in 24–48 hours or return if child worsens; OR provide an antimicrobial prescription to fill if no improvement. First-line: amoxicillin 75–90 mg/kg/day PO divided BID (max 3 g/day) x 10 days if <24 months, 5 days if ≥24 months.\n\nAOM management involves balancing antibiotic benefits against antimicrobial resistance. Young infants (<6 months) require treatment due to immature immune systems. Watchful waiting for 6–24-month-olds reduces unnecessary antibiotic use while maintaining safety through close follow-up."
    difficulty: hard
    tags: [otitis-media, AOM, children, amoxicillin, antibiotics, family-medicine]
  - front: "What is the treatment for otitis externa (swimmer's ear), and what is used for necrotizing otitis externa?"
    back: "Otitis externa (with or without TM perforation): Ciprodex (ciprofloxacin-dexamethasone) otic suspension 4 drops BID x 7 days. Necrotizing (malignant) otitis externa with bone involvement: ciprofloxacin 750 mg PO BID x 4–8 weeks.\n\nOtitis externa is most commonly caused by Pseudomonas aeruginosa, coliforms, and S. aureus. Necrotizing otitis externa is a severe form that involves the temporal bone and surrounding structures, occurring mainly in immunocompromised or diabetic patients. Systemic antibiotics with prolonged courses are required for the necrotizing form."
    difficulty: medium
    tags: [otitis-externa, ciprofloxacin, Ciprodex, antibiotics, family-medicine, ENT]
  - front: "What is the preferred antibiotic for traveller's diarrhea, and why?"
    back: "Azithromycin is the preferred agent (1000 mg PO single dose OR 500 mg PO daily x 1–3 days) due to growing quinolone resistance, particularly in Southeast Asia. Ciprofloxacin and levofloxacin are alternatives.\n\nTraveller's diarrhea is most commonly caused by enterotoxigenic E. coli, Campylobacter, Salmonella, Shigella, viruses, and protozoa. Azithromycin has become preferred due to increasing fluoroquinolone resistance worldwide, especially for Campylobacter. Prevention involves safe food and water precautions."
    difficulty: medium
    tags: [travellers-diarrhea, azithromycin, antibiotics, family-medicine, gastroenterology]
  - front: "When an STI is detected in a child, what evaluation is mandatory?"
    back: "Evaluation for sexual abuse is mandatory.\n\nSTIs in children should always raise the suspicion of sexual abuse. Physicians have a mandatory duty to report suspected child abuse to child protective services. A thorough and sensitive forensic evaluation should be conducted by trained professionals."
    difficulty: easy
    tags: [STI, child-abuse, mandatory-reporting, family-medicine, pediatrics]
  - front: "What are the main uses and key drug interaction of Valerian Root as a natural health product?"
    back: "Uses: sedative, anxiolytic, depression, menopausal symptoms. Adverse effects: drowsiness, dizziness, headache, itching, digestive problems. Drug interactions: CNS depressants, antihistamines, and other sedatives (additive sedation).\n\nValerian root (Valeriana officinalis) acts on GABA receptors to produce sedative effects. The interaction with other CNS depressants and antihistamines can lead to excessive sedation. Patients should be counselled not to drive or operate machinery when taking valerian with other sedating substances."
    difficulty: medium
    tags: [valerian, herbal, drug-interactions, CAM, family-medicine]
  - front: "What are the adverse effects and contraindications of Feverfew?"
    back: "Adverse effects: nausea, GI discomfort, irritation of mouth/skin, 'post-feverfew syndrome' (headaches, sleep disturbances, myalgias, arthralgias after discontinuation), may cause miscarriage (affects uterine contractions). Drug interactions: anticoagulants. Contraindicated in pregnancy.\n\nFeverfew (Tanacetum parthenium) is used primarily for migraine prevention. The post-feverfew syndrome on discontinuation is analogous to withdrawal and occurs after prolonged use. Pregnant women must avoid feverfew due to uterotonic effects that can cause miscarriage."
    difficulty: medium
    tags: [feverfew, herbal, migraine, drug-interactions, CAM, family-medicine]
  - front: "What type of pharyngitis causes coxsackievirus (hand, foot, and mouth disease), and what are its distinguishing features?"
    back: "Coxsackievirus causes hand, foot, and mouth disease: sudden onset in late summer/early fall; fever, pharyngitis, headache, abdominal pain, vomiting; small vesicles that rupture and ulcerate on soft palate, tonsils, pharynx (pale grey, several mm diameter, surrounding erythema); ulcers may appear on hands and feet.\n\nHand, foot, and mouth disease is primarily a pediatric illness caused by coxsackievirus A16 and enterovirus 71. It is distinguished from herpangina (coxsackievirus only in posterior oropharynx) and genital herpes (which has larger, fewer ulcers). Treatment is symptomatic only."
    difficulty: medium
    tags: [coxsackievirus, hand-foot-mouth, pharyngitis, viral, family-medicine, pediatrics]
  - front: "What natural health products must be avoided in immunosuppressed patients?"
    back: "Echinacea should be avoided in immunosuppressed patients (hypersensitivity and potential immune stimulation that may interfere with immunosuppressive therapy).\n\nEchinacea is commonly used for common cold and URTI. Because it stimulates the immune system, it can interfere with immunosuppressive medications used in transplant recipients, autoimmune disease, or cancer therapy. This contraindication is clinically important to screen for in these populations."
    difficulty: medium
    tags: [echinacea, herbal, immunosuppression, CAM, family-medicine]
  - front: "What is the approach to diagnosis and management when a Modified Centor Score is 3 or more in a patient with sore throat?"
    back: "Score ≥3: perform Rapid Antigen Detection Test (RADT). If RADT positive → treat with antibiotics. If RADT negative AND patient <20 years → perform throat culture and treat if positive. If RADT negative AND patient >20 years → no antibiotics should be given.\n\nThis stepwise approach balances appropriate antibiotic use with minimizing unnecessary prescribing. In communities with moderate strep prevalence, a score of ≥3 carries a 15–53% probability of GABHS. Age-stratified decisions reflect lower complication risk and lower pretest probability in older adults."
    difficulty: hard
    tags: [GABHS, Centor-score, pharyngitis, RADT, antibiotics, family-medicine]
  - front: "What is the non-pharmacologic management of snoring?"
    back: "Positional therapy (sleep on side), weight loss, nasal dilators, tongue-retaining devices, mandibular advancement devices. Investigations only if severely symptomatic: nocturnal polysomnography and airway assessment (CT/MRI).\n\nSnoring results from soft tissue vibration at the back of the nose and throat due to turbulent airflow through narrowed air passages. Physical exam findings to assess include obesity, nasal polyps, septal deviation, hypertrophy of nasal turbinates, and enlarged uvula and tonsils. Snoring can be a marker of OSA."
    difficulty: easy
    tags: [snoring, sleep-disorders, OSA, mandibular-device, family-medicine]
