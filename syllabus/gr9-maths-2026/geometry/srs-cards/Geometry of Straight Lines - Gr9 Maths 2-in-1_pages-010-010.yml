# Gr 9 Maths 2-in-1 — geometry / Geometry of Straight Lines
deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
notes:
  - guid: a1b2c3d4e5f60001
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Classify angles by size: acute, right, obtuse, straight, reflex, revolution."
      Back: "Acute angle: lies between 0° and 90°.\nRight angle: exactly 90°.\nObtuse angle: lies between 90° and 180°.\nStraight angle: exactly 180°.\nReflex angle: lies between 180° and 360°.\nRevolution: exactly 360° (a full turn)."
    tags: ["geometry", "straight-lines", "angle-types", "subject:geometry"]
  - guid: b2c3d4e5f6070002
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Complementary angles: definition / angle fact and acceptable reason wording."
      Back: "When the sum of 2 angles is 90°, the angles are COMPLEMENTARY.\nAngle fact: if two angles are complementary then â + b̂ = 90°.\nUse: if one is 35°, its complement is 90° − 35° = 55°.\nReason wording: 'comp ∠ˢ' (complementary angles)."
    tags: ["geometry", "straight-lines", "complementary", "subject:geometry"]
  - guid: c3d4e5f607080003
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Supplementary angles: definition / angle fact and acceptable reason wording."
      Back: "When the sum of 2 angles is 180°, the angles are SUPPLEMENTARY.\nAngle fact: â + b̂ = 180°.\nAdjacent angles on a straight line are supplementary (they add to 180°).\nUse: the supplement of 110° is 70°.\nReason wording: 'sup ∠ˢ' or 'adj ∠ˢ on a str line' / '∠ˢ on a straight line'."
    tags: ["geometry", "straight-lines", "supplementary", "subject:geometry"]
  - guid: d4e5f60708090004
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Adjacent angles: definition and the related FACT."
      Back: "Adjacent angles have a common vertex AND a common arm (they sit next to each other), e.g. angle 1 & angle 2.\nFACT: when 2 lines intersect, adjacent angles (on a straight line) are SUPPLEMENTARY — they add up to 180°.\nReason wording: 'adj ∠ˢ on a str line'."
    tags: ["geometry", "straight-lines", "adjacent", "subject:geometry"]
  - guid: e5f6070809000005
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Vertically opposite angles: definition, the angle fact, and reason wording."
      Back: "When two lines intersect, vertically opposite angles lie OPPOSITE each other at the crossing point, e.g. angle 1 & angle 3, or angle 2 & angle 4.\nFACT: vertically opposite angles are EQUAL.\nUse: if one angle at an intersection is 70°, the one directly opposite is also 70°.\nReason wording: 'vert opp ∠ˢ'."
    tags: ["geometry", "straight-lines", "vertically-opposite", "subject:geometry"]
  - guid: f60708090a000006
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "A transversal cutting two lines creates which families of angles, and what are interior vs exterior angles?"
      Back: "When 2 lines are cut by a third line (a TRANSVERSAL), 8 angles form, in two families of 4.\nINTERIOR angles lie BETWEEN the two lines.\nEXTERIOR angles lie OUTSIDE (above the top line and below the bottom line).\nThese give the corresponding, alternate and co-interior angle pairs."
    tags: ["geometry", "straight-lines", "transversal", "subject:geometry"]
  - guid: 0708090a0b000007
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Corresponding angles: definition, the angle fact (parallel case) and reason wording."
      Back: "Corresponding angles are in the SAME position at each intersection (e.g. both top-left) — they form an 'F' shape.\nFACT: when the 2 lines are PARALLEL, corresponding angles are EQUAL.\n(If the lines are not parallel they are NOT necessarily equal.)\nReason wording: 'corresp ∠ˢ ; ∥ lines'.\nConversely, if corresponding angles are equal, the lines are parallel."
    tags: ["geometry", "straight-lines", "corresponding", "parallel-lines", "subject:geometry"]
  - guid: 08090a0b0c000008
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Alternate angles: definition, the angle fact (parallel case) and reason wording."
      Back: "Alternate angles are on OPPOSITE sides of the transversal. Interior alternate angles sit between the lines and form a 'Z' shape.\nFACT: when the 2 lines are PARALLEL, the (interior) alternate angles are EQUAL.\n(Not necessarily equal if the lines are not parallel. Exterior alternate angles exist but are never used in answers.)\nReason wording: 'alt ∠ˢ ; ∥ lines'.\nConversely, equal alternate angles ⇒ the lines are parallel."
    tags: ["geometry", "straight-lines", "alternate", "parallel-lines", "subject:geometry"]
  - guid: 090a0b0c0d000009
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Co-interior angles: definition, the angle fact (parallel case) and reason wording."
      Back: "Co-interior angles are BOTH interior and on the SAME side of the transversal — they form a 'C' or 'U' shape.\nFACT: when the 2 lines are PARALLEL, co-interior angles are SUPPLEMENTARY (they add up to 180°).\n(Not necessarily supplementary if the lines are not parallel.)\nReason wording: 'co-int ∠ˢ ; ∥ lines'.\nConversely, co-interior angles adding to 180° ⇒ the lines are parallel."
    tags: ["geometry", "straight-lines", "co-interior", "parallel-lines", "subject:geometry"]
  - guid: 0a0b0c0d0e00000a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "State the three parallel-line FACTS and their CONVERSE (how to prove lines parallel)."
      Back: "When 2 PARALLEL lines are cut by a transversal:\n• corresponding angles are EQUAL,\n• (interior) alternate angles are EQUAL,\n• co-interior angles are SUPPLEMENTARY (add to 180°).\nCONVERSELY, the lines are PARALLEL if any one holds: corresponding angles equal, OR alternate angles equal, OR co-interior angles supplementary.\nMemory hooks: F = corresponding, Z = alternate, C/U = co-interior."
    tags: ["geometry", "straight-lines", "parallel-lines", "facts", "subject:geometry"]
  - guid: 0b0c0d0e0f00000b
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Geometry of Straight Lines"
    fields:
      Front: "Worked example: AB ∥ CD cut by a transversal; one angle = 70°. Find the co-interior angle and the alternate angle, with reasons."
      Back: "Alternate angle = 70° (alt ∠ˢ ; ∥ lines) — equal to the given angle.\nCo-interior angle = 180° − 70° = 110° (co-int ∠ˢ ; ∥ lines) — supplementary to the given angle.\nCorresponding angle = 70° (corresp ∠ˢ ; ∥ lines).\nMethod: identify the angle relationship by its shape (Z/C/F), then apply equal (for alternate & corresponding) or supplementary (for co-interior)."
    tags: ["geometry", "straight-lines", "parallel-lines", "worked-example", "subject:geometry"]
