  - front: "What is the prevalence of diabetes mellitus in Canada?"
    back: "Up to 10% of Canadians\n\nDiabetes is a major health concern affecting approximately 10% of the Canadian population."
    difficulty: easy
    tags: [endocrinology, diabetes, epidemiology, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
