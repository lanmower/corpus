# Pediatrics Child Abuse (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the legal obligations of Canadian physicians regarding suspected child abuse and neglect?"
    back: "Upon reasonable grounds to suspect abuse or neglect, physicians are REQUIRED by legislation to contact local child protection agencies (e.g., Children's Aid Society) and personally disclose all relevant information. The duty to report overrides patient confidentiality; the physician is protected against liability. If additional grounds arise, a further report must be made (ongoing duty to report).\n\nThe duty to report is statutory in all Canadian provinces and territories. It applies to all health professionals, not just physicians, and cannot be delegated. 'Reasonable grounds to suspect' is a lower threshold than proof — suspicion alone is sufficient. Failure to report is a legal offence."
    difficulty: easy
    tags: [pediatrics, child abuse, duty to report, neglect, CAS, legal]
  - front: "What are red flag features in the history and physical exam that raise suspicion for physical child abuse?"
    back: "History red flags: inconsistent with developmental capabilities, changes dramatically over time, delayed medical attention (unexplained), previous trauma/hospitalizations. Physical exam red flags: patterned skin injuries, bruises on abdomen/buttocks/genitalia/ears/neck/feet, posterior rib/metaphyseal/scapular/vertebral/sternal fractures, immersion burns, retinal hemorrhages, frenulum tears, traumatic alopecia (patchy hair loss).\n\nTraumatic head injury is the leading cause of death in child maltreatment. The TEN-4-FACESp tool screens for concerning bruising in children <4 years. Clinicians must distinguish genuine injuries from 'red herrings' such as Mongolian spots (slate-grey macule/congenital dermal melanocytosis) and cultural practices like cupping."
    difficulty: medium
    tags: [pediatrics, child abuse, physical abuse, fractures, bruising]
  - front: "What investigations are required when physical child abuse is suspected?"
    back: "Document injuries on a body diagram; photography preferred (police or hospital). Rule out medical causes: if fractures — Ca²⁺, Mg²⁺, PO₄²⁻, ALP, PTH, Vitamin D, albumin. If bruising — CBC, INR, PTT, von Willebrand factor, factors VIII/IX. Abdominal trauma screen: if elevated transaminases/amylase or bruising → abdominal CT. Toxicology screen. Skeletal survey in children <2 years. Neuroimaging (CT/MRI) + dilated eye exam by pediatric ophthalmologist if subdural hemorrhage detected.\n\nA skeletal survey is mandatory in children under 2 years to detect occult fractures. Posterior rib fractures and classic metaphyseal lesions are highly specific for inflicted injury. Ruling out osteogenesis imperfecta, rickets, and bleeding disorders is essential before attributing injuries to abuse."
    difficulty: hard
    tags: [pediatrics, child abuse, skeletal survey, investigations, retinal hemorrhage]
  - front: "What are the key features of the medical assessment for sexual abuse in a prepubertal child?"
    back: "History gathered from caregiver in absence of child (do not take abuse history from young child — requires forensic interview). Anogenital exam performed by trained provider; speculum contraindicated in prepubertal girls; instrumentation not required. Most victims have a NORMAL anogenital exam — a negative exam does NOT rule out sexual abuse. Investigations: STI screen, pregnancy test, consider STI prophylaxis/emergency contraception, drug/alcohol screen if altered consciousness (concern for drug-facilitated assault).\n\nThe absence of physical findings is common in child sexual abuse and does not exclude the diagnosis. Referral to a child maltreatment pediatrician or sexual assault/domestic violence centre is appropriate for a comprehensive sexual assault examination kit. This is a legally and emotionally sensitive area requiring specialized training."
    difficulty: hard
    tags: [pediatrics, child abuse, sexual abuse, forensic, anogenital exam]
  - front: "What are the forms of child neglect and how is medical neglect defined?"
    back: "Physical neglect: failure to provide adequate food, clothing, shelter, supervision, protection. Emotional neglect: failure to provide affection/love/emotional support; child ignored, rejected, prevented from interacting with others. Medical neglect: failure to obtain appropriate medical care for the child, including needed treatment for injuries, physical or mental health disorders, or delaying medical care when child is ill.\n\nNeglect (acts of omission) is distinct from abuse (acts of commission). Neglect is the most common form of child maltreatment. It spans physical, emotional, and medical domains. Physicians have the same duty to report neglect as they do for abuse. Investigations are guided by the specific neglect concern and may include tests to rule out nutritional deficiencies (e.g., thrombocytopenia, coagulopathy)."
    difficulty: easy
    tags: [pediatrics, child abuse, neglect, medical neglect, child protection]
