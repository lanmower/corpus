# Gr 9 Maths CAPS — finance / Budgets and Personal Finance
deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
notes:
  - guid: 30bbff1e13ccaa2f14
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "What is a budget, and what do income, expenditure, surplus and deficit mean?"
      Back: "A budget is a plan of expected income and expenses over a period (usually a month).\nIncome = money coming IN (salary, wages, commission).\nExpenditure = money going OUT (rent, food, transport).\nIf income > expenditure → SURPLUS (you save).\nIf income < expenditure → DEFICIT (you overspend / borrow).\nBalance = income − expenditure."
    tags: ["budget-basics", "subject:finance"]
  - guid: 31ccaa2f14ddbb3a15
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "Thabo earns R12 000 per month. His expenses are: rent R4 500, food R3 000, transport R1 800, airtime R500, savings R1 000. Does he have a surplus or deficit, and how much?"
      Back: "Total expenditure = 4 500 + 3 000 + 1 800 + 500 + 1 000 = R10 800.\nBalance = income − expenditure = 12 000 − 10 800 = R1 200.\nSince income > expenditure, he has a SURPLUS of R1 200."
    tags: ["income-and-expenditure", "subject:finance"]
  - guid: 32ddbb3a15eecc4b16
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "What is commission and how is it calculated? Work out 7% commission on R85 000 of sales."
      Back: "Commission = a percentage of sales paid to a salesperson as earnings.\nCommission = sales × (rate ÷ 100).\n= 85 000 × 0,07 = R5 950.\nIf there is also a fixed 'basic salary', total earnings = basic salary + commission."
    tags: ["commission", "subject:finance"]
  - guid: 33eecc4b16ffdd5c17
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "A salesperson earns a basic salary of R6 000 plus 5% commission on sales above R20 000. If she sells R50 000, what does she earn?"
      Back: "Commission applies only to sales ABOVE R20 000: 50 000 − 20 000 = R30 000.\nCommission = 5% of 30 000 = 0,05 × 30 000 = R1 500.\nTotal earnings = basic + commission = 6 000 + 1 500 = R7 500.\nRead carefully whether commission is on ALL sales or only sales above a threshold."
    tags: ["commission", "subject:finance"]
  - guid: 34ffdd5c17aaee6d18
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "What is inflation, and how do you calculate a new price after inflation?"
      Back: "Inflation = the general rise in prices over time, given as a % increase per year.\nNew price = old price × (1 + inflation rate).\nFor several years it compounds: price after n years = P(1 + i)ⁿ.\nExample: bread R15, inflation 8% → next year 15 × 1,08 = R16,20."
    tags: ["inflation", "subject:finance"]
  - guid: 35aaee6d18bbff7e19
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "A basket of groceries costs R800 now. With inflation at 6% per year, what will it cost in 3 years?"
      Back: "Inflation compounds like compound interest: A = P(1 + i)ⁿ.\nA = 800 × (1,06)³.\n(1,06)³ = 1,191016.\nA = 800 × 1,191016 = R952,81.\nSo in 3 years the basket costs about R952,81."
    tags: ["inflation", "subject:finance"]
  - guid: 36bbff7e19ccaa8f20
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "What is rent/rental, and what is the difference between a loan and rent?"
      Back: "Rental = a regular payment to USE something (a house, flat, car) that you do NOT own — you give it back.\nLoan = borrowed money you must REPAY, usually with interest; you keep what you bought.\nIn a budget both are EXPENSES (money out). Rent is ongoing; a loan repayment ends once the debt is paid."
    tags: ["loans-and-rentals", "subject:finance"]
  - guid: 37ccaa8f20ddbb9a21
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "How do you read a simple bank/account statement to find the closing balance?"
      Back: "A statement lists transactions with deposits (credits, +) and withdrawals/payments (debits, −).\nClosing balance = opening balance + total deposits − total withdrawals.\nExample: opening R2 000, deposit R1 500, withdrawals R900 and R300 → 2 000 + 1 500 − 900 − 300 = R2 300 closing balance."
    tags: ["accounts-and-statements", "subject:finance"]
  - guid: 38ddbb9a21eeccab22
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "A business has income R50 000 and total expenses (stock, rent, wages) R38 000 for a month. State its profit and profit as a % of income."
      Back: "Profit = income − expenses = 50 000 − 38 000 = R12 000.\nProfit as % of income = (12 000 ÷ 50 000) × 100 = 24%.\nFor a business budget, profit (or loss) is the bottom line; a loss occurs if expenses exceed income."
    tags: ["business-profit", "subject:finance"]
  - guid: 39eeccab22ffddbc23
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Budgets and Personal Finance"
    fields:
      Front: "Common mistake: in a budget a learner adds savings to income instead of treating it as money set aside. How should savings be handled?"
      Back: "Savings are money you DEDUCT and keep aside — list them under expenditure (an 'expense to yourself'), not as extra income.\nBalance = income − (all expenses including savings).\nMixing them up gives a false surplus. Income is only money actually earned/received."
    tags: ["common-mistakes", "subject:finance"]
