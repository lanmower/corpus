# Nephrology Tma (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What enzyme is reduced in TTP and what autoantibodies help diagnose it?"
    back: "ADAMTS13 (a metalloprotease that cleaves von Willebrand factor multimers) is reduced in TTP. ADAMTS13 autoantibodies are useful for diagnosing TTP.\n\nIn TTP, autoantibodies against ADAMTS13 prevent cleavage of ultra-large vWF multimers, leading to platelet microthrombi. HUS is more commonly associated with Shiga toxin-producing E. coli and features more renal involvement (fibrin thrombi in glomerular capillary loops and arterioles), while TTP is more neurologically predominant."
    difficulty: medium
    tags: [nephrology, TTP, HUS, ADAMTS13, thrombotic microangiopathy]
  - front: "What is the treatment for TTP-HUS and which agent targets complement-mediated HUS?"
    back: "TTP-HUS: plasma exchange plus corticosteroids. Complement-mediated HUS (atypical HUS): eculizumab (monoclonal antibody against complement C5). Avoid platelet transfusions and ASA in TTP-HUS.\n\nPlasma exchange removes ADAMTS13 autoantibodies and replaces ADAMTS13 enzyme in TTP. Eculizumab blocks terminal complement activation and is used specifically for complement-mediated (atypical) HUS. Platelet transfusions are contraindicated in TTP as they 'fuel the fire' of microthrombus formation."
    difficulty: medium
    tags: [nephrology, TTP, HUS, plasma exchange, eculizumab, complement]
