  - front: "What are the initial investigations for a child with suspected vesicoureteral reflux (VUR)?"
    back: "Focused history (voiding dysfunction, UTI symptoms), growth parameters, blood pressure, serum Cr, urinalysis with C&S, renal ultrasound, and VCUG to confirm diagnosis and grade\n\nInitial evaluation includes assessing renal status, growth, and blood pressure. VCUG is the gold standard for diagnosing and grading VUR."
    difficulty: medium
