# Neurology Movement Disorders (Neurology) - generated from srs-mccqe1
cards:
  - front: "What are the four cardinal features of Parkinson's Disease (TRAP)?"
    back: "T - Tremor (resting, 4-6 Hz pill-rolling)\nR - Rigidity (cogwheel)\nA - Akinesia/Bradykinesia (slow, small amplitude decrementing movements)\nP - Postural instability (late finding)\n\nThese four features define the clinical diagnosis of PD. Bradykinesia is the most essential feature for diagnosis per MDS criteria. Postural instability is a late finding; its early presence should raise suspicion for atypical parkinsonism."
    difficulty: easy
    tags: [Parkinsons disease, movement disorders, neurology, TRAP mnemonic]
  - front: "What is the pathological hallmark of Parkinson's disease at the cellular and regional level?"
    back: "Alpha-synuclein accumulates intracellularly as Lewy bodies and Lewy neurites, causing neuronal loss primarily in the substantia nigra pars compacta. Motor symptoms emerge when ~70% of dopaminergic neurons are lost.\n\nAlpha-synucleinopathy progresses in a stereotyped manner (Braak staging): dorsal motor nucleus of vagus and olfactory bulbs first (constipation, anosmia), then pons (REM sleep behaviour disorder), then midbrain/substantia nigra (motor symptoms), then cortex (cognitive impairment, hallucinations)."
    difficulty: easy
    tags: [Parkinsons disease, alpha-synuclein, Lewy bodies, substantia nigra, neuropathology]
  - front: "What is the mechanism by which levodopa/carbidopa (Sinemet) works in Parkinson's disease, and what is its major adverse effect?"
    back: "Levodopa is a dopamine precursor that crosses the blood-brain barrier and is converted to dopamine. Carbidopa is a peripheral dopa decarboxylase inhibitor that prevents peripheral metabolism of levodopa, increasing its half-life and CNS bioavailability while reducing side effects. Major adverse effect: dyskinesia.\n\nCarbidopa/benserazide (Prolopa in Canada) prevents levodopa conversion outside the CNS, reducing nausea, vomiting, and cardiovascular side effects. Dyskinesia (involuntary movements) is the most significant long-term complication, along with motor fluctuations ('wearing-off', 'on-off' phenomena)."
    difficulty: easy
    tags: [Parkinsons disease, levodopa, carbidopa, Sinemet, dopamine, dyskinesia, pharmacology]
  - front: "A patient with Parkinson's disease develops random oscillations between normal movement and akinesia throughout the day. What is this called, and how does it differ from 'wearing-off'?"
    back: "'On-off' phenomenon: unpredictable random oscillations between mobile ('on') and akinetic ('off') states, not related to dosing timing. 'Wearing-off' is predictable end-of-dose deterioration where symptoms return before the next levodopa dose is due.\n\nBoth are levodopa-related motor fluctuations. 'Wearing-off' is managed by increasing dose frequency or adding adjuncts (dopamine agonists, MAOIs, COMT inhibitors). 'On-off' phenomenon is more difficult to manage and may benefit from continuous dopaminergic stimulation via apomorphine infusion or deep brain stimulation."
    difficulty: medium
    tags: [Parkinsons disease, levodopa, motor fluctuations, on-off phenomenon, wearing-off]
  - front: "What are the red flags (atypical features) that suggest a diagnosis other than idiopathic Parkinson's disease?"
    back: "- Abrupt onset\n- Rapid progression\n- Early falls\n- Early autonomic dysfunction\n- Symmetric symptoms at onset\n- Early age of onset (<50 yr)\n- Early cognitive impairment\n- FMHx of psychiatric disorders and/or dementia\n- Recent diagnosis of psychiatric disease\n- History of encephalitis\n- Unusual toxin exposure\n- Extensive travel history\n\nThese atypical features suggest diagnoses such as progressive supranuclear palsy (PSP), corticobasal syndrome, multiple system atrophy (MSA), vascular parkinsonism, or drug-induced parkinsonism. Poor or absent response to levodopa also favours atypical parkinsonism."
    difficulty: medium
    tags: [Parkinsons disease, atypical parkinsonism, red flags, differential diagnosis]
  - front: "What distinguishes Progressive Supranuclear Palsy (PSP) from Parkinson's disease?"
    back: "PSP features: limited vertical gaze (downgaze palsy more specific), early postural instability with frequent falls, wide-based unsteady gait, axial rigidity, akinesia, dysarthria, dysphagia, and little or no response to levodopa. It is a tauopathy.\n\nThe downgaze palsy in PSP can be overcome by the oculocephalic reflex (doll's eye maneuver), indicating the palsy is supranuclear. Early falls and the characteristic 'surprised' facial expression (from frontalis overactivity compensating for lid retraction) are clinical pearls. PSP does not respond well to levodopa."
    difficulty: medium
    tags: [PSP, progressive supranuclear palsy, atypical parkinsonism, tauopathy, vertical gaze palsy]
  - front: "What are the distinguishing features of Multiple System Atrophy (MSA)?"
    back: "MSA is a synucleinopathy with two subtypes:\n- MSA-C: cerebellar predominant\n- MSA-P: parkinsonism predominant\nKey feature: early autonomic dysfunction (urinary incontinence or orthostatic hypotension) distinguishes it from idiopathic PD.\n\nMSA has poor response to levodopa. Early and prominent autonomic failure (orthostatic hypotension, urinary incontinence, erectile dysfunction) is the hallmark. The combination of cerebellar, parkinsonian, and autonomic features in a patient should prompt consideration of MSA."
    difficulty: medium
    tags: [MSA, multiple system atrophy, atypical parkinsonism, autonomic dysfunction, synucleinopathy]
  - front: "What genetic mutation causes Huntington's disease and what is the inheritance pattern?"
    back: "Autosomal dominant CAG trinucleotide repeat expansion in the HTT gene on chromosome 4p16.3.\n- 27-35 repeats: meiotic instability (premutation)\n- 36-39 repeats: reduced penetrance\n- ≥40 repeats: full disease penetrance\nGenetic anticipation causes repeat expansion with each generation.\n\nThe expanded CAG repeats encode a polyglutamine tract in the huntingtin protein, leading to toxic protein accumulation in neurons. Genetic anticipation means offspring may have more repeats (especially with paternal transmission) and earlier onset."
    difficulty: easy
    tags: [Huntingtons disease, CAG repeats, HTT gene, genetic anticipation, autosomal dominant]
  - front: "Describe the clinical progression of Huntington's disease."
    back: "Insidious onset (mean age 35-44 yr) with clumsiness, fidgetiness, irritability → progresses over 15 years to:\n- Major NCD (progressive memory impairment)\n- Chorea (begins with eyebrow/forehead movement, shoulder shrugging, parakinesia; progresses to dance-like or ballistic movements; late stage replaced by dystonia and rigidity)\n- Mood changes (irritability, depression, anhedonia, impulsivity, violence)\nJuvenile-onset (Westphal variant): parkinsonism, dystonia, rigidity, seizures.\n\nPathology shows global cerebral atrophy particularly affecting the striatum. Loss of striatal neurons increases activity of the direct pathway and decreases indirect pathway activity, causing the characteristic chorea. MRI shows enlarged ventricles and caudate atrophy."
    difficulty: easy
    tags: [Huntingtons disease, chorea, neurodegeneration, NCD, Westphal variant]
  - front: "What is the treatment for chorea in Huntington's disease?"
    back: "Tetrabenazine (vesicular monoamine transporter inhibitor), amantadine, and neuroleptics (antipsychotics). Botulinum toxin for focal dystonia. There is no disease-modifying treatment for HD.\n\nTetrabenazine depletes presynaptic monoamines (including dopamine) and blocks postsynaptic dopamine receptors, reducing chorea. Psychiatric symptoms are managed with antidepressants and antipsychotics. Genetic counselling is essential given the autosomal dominant inheritance."
    difficulty: easy
    tags: [Huntingtons disease, chorea, tetrabenazine, treatment]
  - front: "Define dystonia and list its treatment options."
    back: "Dystonia: co-contraction of agonist and antagonist muscles causing sustained twisting movements that can be tonic (dystonic postures) or phasic (dystonic movements). It is the 3rd most common movement disorder after PD and essential tremor.\n\nTreatment:\n- Local: botulinum toxin (first-line for focal dystonia)\n- Systemic: anticholinergics (trihexyphenidyl, benztropine), baclofen, benzodiazepines, tetrabenazine, levodopa (for dopa-responsive dystonia)\n- Surgical: DBS or denervation\n\nDystonia is exacerbated by fatigue, stress, and emotion, but relieved by sleep or sensory tricks (e.g., touching the chin for cervical dystonia - 'geste antagoniste'). Younger onset or leg dystonia is more likely to be progressive and generalized."
    difficulty: easy
    tags: [dystonia, movement disorders, botulinum toxin, treatment]
  - front: "What is the difference between resting tremor, action-postural tremor, and action-intention tremor in terms of characteristics and common causes?"
    back: "Resting tremor:\n- 3-6 Hz pill-rolling; worse at rest\n- DDx: PD, parkinsonism, Wilson's disease, severe essential tremor\n- Tx: levodopa/carbidopa, DBS\n\nAction-postural tremor:\n- 6-12 Hz fine tremor; worse with sustained posture (outstretched arms)\n- DDx: physiologic, essential tremor, hyperthyroidism, drug toxicity, EtOH/sedative withdrawal\n- Tx: propranolol, primidone, topiramate\n\nAction-intention tremor:\n- <5 Hz coarse; worse during goal-directed movement (finger-to-nose)\n- DDx: cerebellar disorders, Wilson's disease, MS, EtOH\n- Tx: treat underlying cause\n\nEssential tremor usually does not require treatment. Alcohol dampens essential tremor but potentiates intention tremor during abstinence (delirium tremens). In young patients (<45 yr) with tremor, always check TSH, ceruloplasmin (Wilson's), and CT/MRI."
    difficulty: easy
    tags: [tremor, resting tremor, essential tremor, intention tremor, movement disorders]
  - front: "What is asterixis and what conditions cause it?"
    back: "Asterixis is a transient loss of muscle tone (negative myoclonus), causing a flapping tremor when the arms are outstretched. It is caused by metabolic encephalopathies including hepatic encephalopathy, uremia, hypercapnia, and drug toxicity.\n\nAsterixis is assessed by asking the patient to hold arms outstretched with wrists extended - brief lapses in posture cause a 'flapping' movement. It reflects metabolic dysfunction rather than a primary movement disorder and should prompt workup for an underlying systemic cause."
    difficulty: easy
    tags: [asterixis, negative myoclonus, hepatic encephalopathy, metabolic encephalopathy]
  - front: "What is hemiballism and what is its most common cause?"
    back: "Hemiballism is large-amplitude, involuntary, flinging movements that are most commonly unilateral. Most commonly caused by a vascular lesion (stroke/infarction) to the subthalamic nucleus contralateral to the affected limb.\n\nThe subthalamic nucleus normally provides excitatory (glutamate) drive to the globus pallidus interna via the indirect pathway. Loss of this drive disinhibits the thalamus and motor cortex, causing ballistic movements. Management includes tetrabenazine or antipsychotics."
    difficulty: medium
    tags: [hemiballism, subthalamic nucleus, stroke, movement disorders, basal ganglia]
  - front: "What are the DSM-5 diagnostic criteria for Tourette's Syndrome?"
    back: "1. Presence of both multiple motor AND one or more vocal tics at some point during illness (not necessarily concurrently)\n2. Tics have persisted >1 year since first onset (with no tic-free period >3 months)\n3. Onset before 18 years of age\n4. Not due to substance or another medical condition\n\nEpidemiology: prevalence 3-8 in 1000 school-age children, M:F = 2-4:1. Peak severity ages 10-12, with 50% tic-free by age 18. Commonly associated with OCD and ADHD. Tics can be voluntarily suppressed, worsen with anxiety/excitement, and may be preceded by premonitory urges."
    difficulty: easy
    tags: [Tourettes syndrome, tic disorder, DSM-5, pediatric neurology]
  - front: "Differentiate between simple and complex motor and vocal tics, giving examples of each."
    back: "Motor tics:\n- Simple (short, msec): eye blinking, head jerking, shoulder shrugging\n- Complex (longer, more purposeful): copropraxia (obscene gestures), echopraxia (imitating gestures), throwing, touching\n\nVocal tics:\n- Simple: blowing, coughing, grunting, throat clearing\n- Complex: coprolalia (shouting obscenities), echolalia (repeating others' phrases), palilalia (repeating own phrases)\n\nComplex tics appear more purposeful. Coprolalia (uttering obscenities) is the most recognized but actually occurs in only ~10-15% of Tourette's patients. Tics wax and wane in type and severity."
    difficulty: easy
    tags: [tics, Tourettes syndrome, coprolalia, echolalia, motor tics, vocal tics]
  - front: "What are the treatment options for debilitating tics in Tourette's syndrome?"
    back: "- Alpha-2 adrenergic agonists: guanfacine, clonidine (first-line for mild-moderate)\n- Antipsychotics: haloperidol, pimozide (effective but significant side effects)\n- Botulinum toxin (for focal tics)\n- Topiramate\n- Deep Brain Stimulation (DBS) for refractory cases\n- Comprehensive Behavioural Intervention for Tics (CBIT) for mild tics\n- OCD component: exposure-response prevention CBT\n\nTreatment is indicated only when tics affect quality of life. Mild tics are managed with education, counselling, and CBIT. Antipsychotics are effective but carry risks of tardive dyskinesia with long-term use. Guanfacine and clonidine also help with associated ADHD."
    difficulty: easy
    tags: [Tourettes syndrome, tic treatment, guanfacine, haloperidol, DBS]
  - front: "What is myoclonus and what are the major categories of symptomatic myoclonus?"
    back: "Myoclonus: brief muscle group contraction that is focal, segmental, or generalized. Can be stimulus-sensitive (induced by sudden noise, movement, light, visual threat, or pinprick).\n\nCategories:\n1. Physiologic: hiccups, nocturnal myoclonus (sleep starts)\n2. Essential: myoclonus-dystonia\n3. Epileptic: part of seizure disorder\n4. Symptomatic:\n   - Degenerative: Wilson's disease, HD, corticobasal degeneration\n   - Infectious: CJD, viral encephalitis, AIDS-dementia\n   - Metabolic: drug intoxication/withdrawal, hypoglycemia, hyponatremia, hyperglycemic hyperosmolar syndrome, hepatic encephalopathy, uremia, hypoxia\n   - Focal brain damage: stroke, head injury, mass\n\nSymptomatic myoclonus suggests an underlying cause requiring workup. Metabolic causes are common and reversible. CJD (prion disease) characteristically presents with rapidly progressive dementia, ataxia, and myoclonus. Palatal tremor can result from lesions to the dentato-rubro-olivary tract."
    difficulty: medium
    tags: [myoclonus, movement disorders, CJD, metabolic encephalopathy]
  - front: "What is the direct vs. indirect pathway of the basal ganglia, and how do they relate to movement disorders?"
    back: "Direct pathway (facilitates movement): Cortex → Striatum (inhibitory GABA to GPi) → GPi inhibited → thalamus disinhibited → cortex activated\n\nIndirect pathway (suppresses movement): Cortex → Striatum (GABA to GPe) → GPe (GABA to STN) → STN (glutamate to GPi) → GPi activated → thalamus inhibited → cortex suppressed\n\nIn PD: Dopamine (from SNpc) normally facilitates direct and inhibits indirect pathway. Dopamine loss → decreased direct + increased indirect → net cortical inhibition → bradykinesia/rigidity\n\nIn HD: Striatal loss disproportionately affects indirect pathway (early) → decreased GPi output → thalamic disinhibition → chorea\n\nUnderstanding these pathways explains the rationale for PD treatment (dopaminergic agents restore balance) and the pathophysiology of different movement disorders. DBS of the subthalamic nucleus in PD reduces the hyperactive indirect pathway, restoring normal cortical excitation."
    difficulty: hard
    tags: [basal ganglia, direct pathway, indirect pathway, Parkinsons disease, Huntingtons disease, pathophysiology]
  - front: "What protective and risk factors are associated with developing Parkinson's disease?"
    back: "Risk factors: family history, male sex, head injury, rural living, exposure to certain neurotoxins (pesticides, MPTP)\n\nProtective factors: coffee drinking, cigarette smoking, estrogen replacement in postmenopausal women\n\nGenetics: 10% familial (autosomal dominant: alpha-synuclein, LRRK2 mutations; autosomal recessive: parkin, PINK1, DJ-1 - juvenile onset)\n\nPD is the second most common neurodegenerative disorder after AD, with prevalence 0.3% in industrialized countries rising with age (mean onset 60 yr). MPTP is a neurotoxin that selectively destroys dopaminergic neurons in the substantia nigra and has been used to create animal models of PD."
    difficulty: easy
    tags: [Parkinsons disease, risk factors, protective factors, epidemiology, LRRK2]
