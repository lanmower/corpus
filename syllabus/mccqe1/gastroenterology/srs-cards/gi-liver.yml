  - front: "When should HCC screening be initiated in hemochromatosis?"
    back: "Once cirrhosis is present, screening for HCC should begin\n\nHCC surveillance is recommended in all patients with cirrhosis, including those with hemochromatosis."
    difficulty: easy
    tags: [Hemochromatosis, HCC, screening, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the role of liver transplant in Wilson's disease?"
    back: "Used in severe cases of acute liver failure or end-stage liver disease not responding to medical therapy\n\nLiver transplant can be curative in Wilson's disease as it provides normal ATP7B function."
    difficulty: easy
