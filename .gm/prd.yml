  item: 'The theme.js mojibake (â˜€ etc) is one encoding tell -> per gm rule sweep the whole corpus source tree (site/*.js, *.html, *.css excluding the 247420 bundle) for double-decoded UTF-8 sequences (Ã, â€, â˜, Ëœ, â—, etc) and broken glyphs; convert decorative ones to ASCII per the graphical-symbol rule, fix genuine text mojibake, re-save UTF-8 no-BOM. The initial scan found only theme.js but the sweep must be exhaustive (also check triage-live.js which has CRLF + ''â†’'' / ''â†'' seen in codesearch grade-panel: ''next case â†’'', ''✓'',''×'').'
