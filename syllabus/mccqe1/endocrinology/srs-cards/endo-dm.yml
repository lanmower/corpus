  - front: "What percentage of patients reached HbA1c <7.0% in the biphasic arm vs other arms in 4T Trial?"
    back: "Smaller proportion in the biphasic arm\n\nA smaller proportion of patients reached HbA1c <6.5% or <7.0% in the biphasic arm compared to prandial and basal arms."
