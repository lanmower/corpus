  - front: "What is the DMSA renal scan used for in pediatric urology?"
    back: "High-risk detection of structural defects (dysplasia, renal scarring, pyelonephritis); higher sensitivity than ultrasound but entails radiation exposure\n\nDMSA scan is used in children at high risk for renal scarring or structural abnormalities associated with UTIs."
    difficulty: medium
    tags: [DMSA scan, renal imaging, pediatric urology, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
