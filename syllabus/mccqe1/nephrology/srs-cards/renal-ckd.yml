cards:
  - front: "What are the indications for dialysis in toxic alcohol poisoning?"
    back: "Urgent hemodialysis may be required in severe cases\n\nIndications include severe metabolic acidosis, end-organ damage, or when fomepizole is unavailable"
    difficulty: medium
    tags: [toxicology, dialysis, treatment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are indications for urgent hemodialysis in toxic alcohol poisoning?"
    back: "Severe metabolic acidosis (pH <7.25), end-organ damage, renal failure, dangerously high toxic alcohol levels, failure of conservative management\n\nUrgent hemodialysis is indicated for severe toxic alcohol poisoning with significant metabolic acidosis, end-organ involvement, renal failure, or unmanageable toxin levels."
    difficulty: medium
    tags: [hemodialysis, toxic alcohol, methanol, ethylene glycol, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What renal conditions cause dyslipidemia?"
    back: "Nephrotic syndrome and chronic kidney disease (CKD)\n\nRenal disease alters lipid metabolism and commonly causes elevated cholesterol and/or triglycerides."
    difficulty: easy
    tags: [secondary dyslipidemia, nephrotic syndrome, CKD, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
  - front: "What renal conditions cause secondary dyslipidemia?"
    back: "Nephrotic syndrome and chronic kidney disease (CKD)\n\nRenal disease alters lipid metabolism through multiple mechanisms including protein loss and altered lipid synthesis."
    difficulty: easy
    tags: [secondary dyslipidemia, nephrotic syndrome, CKD, toronto-notes, pages-0311-0312-0313-0314-0315-0316-0317-0318-0319-0320]
