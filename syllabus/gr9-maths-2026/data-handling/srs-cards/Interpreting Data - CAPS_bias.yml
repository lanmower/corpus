# Gr 9 Maths CAPS — data-handling / Interpreting Data
deck: "Corpus::Gr9 Maths::Interpreting Data"
notes:
  - guid: b0d2f4a6c8e13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Interpreting Data"
    fields:
      Front: "What does it mean to INTERPRET and ANALYSE data?"
      Back: "To look at the organised data, graphs and summary statistics and draw MEANING from them:\n• What is the typical value (mean/median/mode)?\n• How spread out is it (range, IQR)?\n• Are there trends, patterns or outliers?\n• Does it answer the original question?\n\nAnalysis turns numbers and pictures into conclusions you can report."
    tags: ["interpreting", "subject:data-handling"]
  - guid: d2f4a6c8e0b13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Interpreting Data"
    fields:
      Front: "What is BIAS in data handling? Give two ways it creeps in."
      Back: "Bias is anything that makes results unfairly favour one outcome, so they don't truly represent the population.\n\nSources:\n• Sampling bias — unrepresentative sample (e.g. only surveying friends).\n• Question bias — leading/loaded questions (e.g. 'Don't you agree our food is great?').\nOthers: small samples, non-responses, misleading graphs.\n\nBias → wrong conclusions even with correct calculations."
    tags: ["bias", "subject:data-handling"]
  - guid: f4a6c8e0b2d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Interpreting Data"
    fields:
      Front: "How can a BROKEN (truncated) axis make a graph misleading?"
      Back: "If the vertical axis does NOT start at 0 (a 'broken axis'), small differences look huge. A bar of 102 next to one of 100 can appear twice as tall when the axis starts at 99.\n\nThis exaggerates differences to mislead the reader. To judge fairly, check whether the y-axis starts at 0 and whether the scale is even."
    tags: ["misleading-graphs", "subject:data-handling"]
  - guid: a6c8e0f2b4d33957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Interpreting Data"
    fields:
      Front: "List ways a graph can be MISLEADING (distorted)."
      Back: "• Broken/truncated axis not starting at 0 → exaggerates differences.\n• Uneven or inconsistent scale (jumps of 2 then 10).\n• Missing labels or no scale.\n• 3-D or oversized pictogram icons that distort area/volume.\n• Cherry-picked time range to show a fake trend.\n\nAlways read the axes and scale before trusting a graph's 'story'."
    tags: ["misleading-graphs", "subject:data-handling"]
  - guid: c8e0a2f4b6d33957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Interpreting Data"
    fields:
      Front: "Why can using a pictogram with DIFFERENT-SIZED icons be misleading?"
      Back: "If one icon is scaled up to be twice as tall AND twice as wide to show 'double', its AREA becomes 4 times bigger, so the eye sees a 4× difference instead of 2×.\n\nFair pictograms use identical icons and a clear key (each icon = same fixed amount), using more icons (not bigger ones) to show larger values."
    tags: ["misleading-graphs", "subject:data-handling"]
  - guid: e0a2c4f6b8d33957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Interpreting Data"
    fields:
      Front: "A shop's graph shows sales 'soaring' but the y-axis runs from 480 to 500. How do you critique it?"
      Back: "The y-axis is TRUNCATED (does not start at 0) and covers a tiny range (480–500), so a rise from say 485 to 495 looks dramatic but is only about a 2% increase.\n\nCritique: redraw with the y-axis starting at 0 to show the true, modest change. The original is designed to mislead."
    tags: ["misleading-graphs", "subject:data-handling"]
  - guid: a2c4e6f8b0d33957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Interpreting Data"
    fields:
      Front: "Checklist: what should you ask when CRITICALLY reading any data/graph?"
      Back: "• Who collected it and how? (primary/secondary, sample size, bias)\n• Does the y-axis start at 0? Is the scale even?\n• Are axes and units labelled?\n• Is the right type of graph used?\n• Are outliers hidden or exaggerated?\n• Does the conclusion actually follow from the data?\n\nThinking critically guards against being misled."
    tags: ["interpreting", "subject:data-handling"]
