# Urology Erectile Dysfunction (Urology) - generated from srs-mccqe1
cards:
  - front: "What is the significance of new onset erectile dysfunction in the context of vascular disease screening?"
    back: "New onset ED may be one of the first symptoms of concomitant vascular disease. It should prompt screening for diabetes mellitus and cardiovascular risk factors.\n\nThe penile arteries are small-caliber vessels that manifest atherosclerotic disease earlier than larger coronary or peripheral vessels. ED as a harbinger of cardiovascular disease is well-established; new ED warrants assessment for DM, hypertension, dyslipidemia, and smoking."
    difficulty: easy
    tags: [erectile dysfunction, vascular disease, diabetes mellitus, cardiovascular screening]
  - front: "What are the autonomic and somatic nerve contributions to erection and ejaculation?"
    back: "Erection (POINT): parasympathetics (S2-4) → NO release → increased cGMP → arteriolar dilation and sinusoidal relaxation. Emission (SHOOT): sympathetics (T11-L2) → secretions enter prostatic urethra. Ejaculation (SHOOT): bladder neck closure (sympathetic), bulbocavernosus contraction (somatic S2-4). Detumescence: norepinephrine/endothelin-1 → arteriolar constriction.\n\nPDE5 inhibitors (sildenafil, tadalafil, vardenafil) prevent breakdown of cGMP, maintaining arteriolar dilation. The mnemonic POINT AND SHOOT is helpful: Parasympathetics for erection, Sympathetics for emission/ejaculation."
    difficulty: medium
    tags: [urology, erectile dysfunction, physiology, autonomic, erection, ejaculation]
  - front: "How do you differentiate psychogenic from organic erectile dysfunction?"
    back: "Psychogenic ED: sudden onset, sporadic, varies with partner/circumstance, younger age, nocturnal/morning erections preserved, no organic risk factors. Organic ED: gradual onset, present in all circumstances, no variation, older age, absent nocturnal erections, organic risk factors present (HTN, DM, dyslipidemia).\n\nPreserved nocturnal penile tumescence confirms intact vascular and neurological function, pointing to psychogenic cause. Organic causes can be remembered with IMPOTENCE: Iatrogenic, Mechanical, Psychological, Occlusive, Testosterone deficiency, Neurogenic, Chemical, Endocrine."
    difficulty: medium
    tags: [urology, erectile dysfunction, psychogenic, organic, differential diagnosis]
  - front: "What are the organic risk factors for erectile dysfunction (mnemonic IMPOTENCE)?"
    back: "I - Iatrogenic (pelvic surgery). M - Mechanical (Peyronie's, post-priapism). P - Psychological (depression, stress, PTSD). O - Occlusive (HTN, DM, smoking, hyperlipidemia, PVD). T - Testosterone deficiency. E - Endocrine (COPD, sleep apnea, malnutrition). N - Neurogenic (CNS: Parkinson's, MS, SCI; PNS: DM, peripheral neuropathy). C - Chemical (antihypertensives, SSRIs, antiandrogens, 5-ARIs, statins, GnRH agonists).\n\nED is often multifactorial. Organic ED is more common than psychogenic. Key medications causing ED include antihypertensives, SSRIs, antiandrogens, 5-alpha reductase inhibitors, and GnRH agonists."
    difficulty: medium
    tags: [urology, erectile dysfunction, organic causes, IMPOTENCE mnemonic]
  - front: "What is the mechanism of action of PDE5 inhibitors, and how do the four agents differ?"
    back: "PDE5 inhibitors (sildenafil, tadalafil, vardenafil, avanafil) inhibit phosphodiesterase-5, increasing intracavernosal cGMP → sustained arteriolar dilation and erection. Tadalafil has longer half-life, no cyanopsia, and can be taken on empty or full stomach. All four have similar effectiveness; onset of action difference is not clinically significant. Note: avanafil is not available in Canada.\n\nPDE5 inhibitors are first-line oral therapy for organic ED. They are contraindicated with nitrates (severe hypotension). Tadalafil can be taken as needed or as a daily low-dose regimen. These agents work only with sexual stimulation (require NO release)."
    difficulty: medium
    tags: [urology, erectile dysfunction, PDE5 inhibitors, sildenafil, tadalafil, pharmacology]
  - front: "What are the treatment options for erectile dysfunction in order from least to most invasive?"
    back: "1. Non-invasive: lifestyle changes, psychological counseling, change precipitating medications, treat underlying causes. 2. Minimally invasive: oral PDE5 inhibitors, vacuum devices, MUSE (urethral PGE1 suppository), low-intensity shockwave therapy. 3. Invasive: intracavernous vasoactive injection (triple therapy, bimix, or PGE1 alone). 4. Surgical: penile implant (malleable or inflatable).\n\nMUSE (medicated urethral system for erection) delivers alprostadil (PGE1) directly to the urethra. Intracavernous injection complications include priapism (overdose) and fibrosis (Peyronie's-like). Initial trial of MUSE or intracavernosal injection should be done under medical supervision."
    difficulty: medium
    tags: [urology, erectile dysfunction, treatment, MUSE, penile implant]
