# Psychiatry Dissociative (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What are the key features of Dissociative Identity Disorder (DID)?"
    back: "DID: disruption of identity characterized by ≥2 distinct personality states or experience of possession; sudden alterations in sense of self and agency (ego-dystonic emotions, behaviours, speech); recurrent amnesia (declarative or procedural); episodes of depersonalization and derealization. Rare (<1%). Major risk factor: childhood physical/sexual abuse or neglect. High risk of suicide and self-harm.\n\nDID is associated with significant trauma history. The DDx includes borderline personality disorder (also linked to trauma) and PTSD. Psychotherapy (psychodynamic, CBT) is the mainstay of treatment. There is limited evidence for pharmacotherapy."
    difficulty: medium
    tags: [dissociative identity disorder, DID, multiple personality, trauma, amnesia]
  - front: "What is dissociative amnesia, and how does it differ from generalized vs. localized/selective amnesia?"
    back: "Dissociative amnesia: inability to recall important autobiographical information (usually traumatic/stressful), inconsistent with normal forgetting, not due to psychiatric disorder, medical illness, or substance. Localized/selective: failure to recall all/some events during a specific period (procedural memory preserved). Generalized (rare): complete loss of all life history ± procedural and semantic knowledge; sudden onset; presents with perplexity, disorientation, aimless wandering. Increased risk of suicide as amnesia resolves.\n\nDissociative fugue is a specifier of dissociative amnesia involving sudden unexpected travel away from home accompanied by amnesia for identity or other autobiographical details. Procedural memory (how to ride a bike) is classically preserved in localized dissociative amnesia."
    difficulty: medium
    tags: [dissociative amnesia, dissociative fugue, amnesia, trauma]
  - front: "What is depersonalization/derealization disorder and what is preserved during episodes?"
    back: "Persistent or recurrent episodes of: depersonalization (detachment from oneself, feelings of unreality, outside observer of one's own thoughts/feelings/actions) and/or derealization (unreality/detachment from surroundings, as if in a dream, world appears foggy). Key: reality testing is INTACT (patients know experiences are not real). Episodes can last hours to years. Transient experiences are common in the general population.\n\nIntact reality testing distinguishes depersonalization/derealization disorder from psychosis. Patients are often distressed and fear 'going crazy.' Predisposing factors include severe stress or trauma. Treatment: psychotherapy (CBT, psychodynamic); limited evidence for pharmacotherapy."
    difficulty: medium
    tags: [depersonalization, derealization, dissociative disorders, reality testing]
