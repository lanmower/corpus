# Pediatrics Respirology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What did the MANDALA trial demonstrate about combination rescue inhalers for asthma in children?"
    back: "MANDALA trial (NEJM 2022): RCT of 3132 patients aged 4-11 yr with uncontrolled moderate-to-severe asthma. Randomized to albuterol (180 µg) + budesonide (160 µg) vs. albuterol (180 µg) + budesonide (80 µg) vs. albuterol (180 µg) alone for 24 weeks rescue treatment. Result: Higher-dose combination therapy reduced risk of severe exacerbation by 26% vs. albuterol monotherapy. Conclusion: Albuterol + budesonide as rescue therapy reduces risk of severe asthma exacerbation vs. albuterol alone.\n\nThe MANDALA trial supports the use of ICS-formoterol (or ICS-SABA combinations) as rescue therapy rather than SABA alone. As per updated Canadian Thoracic Society guidelines, anti-inflammatory reliever therapy (AIR) strategy using ICS + SABA rescue is preferred in uncontrolled moderate-severe asthma. This provides both bronchodilation and reduces airway inflammation at the time of exacerbation."
    difficulty: medium
    tags: [pediatrics, respirology, asthma, albuterol, budesonide, MANDALA-trial, rescue-inhaler]
  - front: "What are the defining features of childhood asthma and its Canadian epidemiology?"
    back: "Inflammatory disorder of airways with recurrent episodes of reversible small airway obstruction from airway hyperresponsiveness to endogenous/exogenous stimuli. In Canada: lifetime prevalence 10-15% in childhood; most often presents in early childhood; associated with other atopic diseases (allergies, atopic dermatitis).\n\nConsider asthma in ages 1-5 years with recurrent asthma-like symptoms even if triggered by viral infections. Formal diagnosis requires: documented airflow obstruction + reversibility with asthma therapy + no suspicion of alternative diagnosis. Associated atopic triad: asthma, allergic rhinitis, atopic dermatitis."
    difficulty: easy
    tags: [respirology, asthma, pediatrics, epidemiology, Canada]
  - front: "What are the common triggers for asthma exacerbations in children?"
    back: "URTI (viral or Mycoplasma), weather changes (cold exposure, humidity), allergens (pets, pollen), irritants (cigarette smoke), exercise, emotional stress, drugs (ASA, beta-blockers).\n\nViral URTIs are the most common trigger in children, particularly RSV, rhinovirus, and parainfluenza. ASA-induced asthma (Samter's triad: asthma + nasal polyps + ASA sensitivity) is more common in adults but can occur in children. Beta-blockers (including ophthalmic) can precipitate severe bronchospasm and are generally contraindicated in asthma."
    difficulty: easy
    tags: [respirology, asthma, triggers, pediatrics]
  - front: "What is the acute management of pediatric asthma exacerbations in the emergency department?"
    back: "1. O2 (keep SpO2 >92%) and IV fluids if dehydrated. 2. Salbutamol (Ventolin): MDI + spacer, 4-5 puffs (<20 kg) or 8-10 puffs (>20 kg) q20 min x 3 doses (nebulized in very severe cases). 3. Ipratropium bromide (Atrovent) if severe: 4 puffs (<30 kg) or 8 puffs (≥30 kg) q15-20 min x 3 doses. 4. Steroids: prednisone 1-2 mg/kg/day x5 days or dexamethasone 0.6 mg/kg/day x2 days. 5. If no response: IV magnesium sulphate.\n\nPRAM score (0-12) guides severity: mild (0-3), moderate (4-7), severe (8-12). Discharge criteria: β2-agonist needed not more than q4h, SpO2 ≥92% in room air, improved air entry, minimal WOB, and PRAM <3 sustained for 2-4h after last bronchodilator. Discharge with inhaled corticosteroids (12-week course) if having significant symptoms outside exacerbations."
    difficulty: medium
    tags: [respirology, asthma, acute management, salbutamol, pediatrics, emergency]
  - front: "What are the chronic management steps for pediatric asthma (controller therapy)?"
    back: "First line (all children): low-dose daily inhaled corticosteroids (ICS) with aerochamber. Second line for children <12 yr: moderate dose ICS. Second line for children >12 yr: leukotriene receptor antagonist (LTRA) OR long-acting β2-agonist (LABA) PLUS low-dose ICS; LTRA monotherapy as alternative. Reliever: short-acting β2-agonist (salbutamol) PRN.\n\nPer 2021 Canadian Thoracic Society guidelines, well-controlled asthma criteria include: daytime symptoms <2 times/week, nighttime symptoms <1 time/week, normal physical activity, mild/infrequent exacerbations, no school/work absenteeism, β-agonist use <2 doses/week, FEV1 or PEF ≥90% of personal best, PEF diurnal variation <10-15%, sputum eosinophils <2-3%."
    difficulty: medium
    tags: [respirology, asthma, chronic management, ICS, LTRA, pediatrics]
  - front: "What are the indications for hospitalization in pediatric asthma?"
    back: "1. Ongoing need for supplemental O2. 2. Persistently increased work of breathing. 3. β2-agonists needed more often than q4h after 4-8h of conventional treatment. 4. Patient deteriorates while on systemic steroids.\n\nThese criteria reflect failure of initial outpatient/emergency management. Children with severe or near-fatal asthma attacks may require ICU admission, IV methylprednisolone, continuous nebulized bronchodilators, heliox, or intubation with mechanical ventilation. BiPAP is an intermediate option before intubation."
    difficulty: easy
    tags: [respirology, asthma, hospitalization, pediatrics]
  - front: "Define bronchiolitis: etiology, epidemiology, and clinical features."
    back: "LRTI in children <2 years with wheezing and respiratory distress. Most common LRTI in infants, affects 50% in first 2 years; peak incidence at 6 months; winter/early spring. Etiology: RSV (>50%), parainfluenza, influenza, rhinovirus, adenovirus. Features: first episode of wheeze in child <1 year, URTI prodrome (cough, rhinorrhea ± fever), feeding difficulties, irritability, wheezing, crackles, tachypnea, retractions; symptoms peak at 3-4 days.\n\nRSV bronchiolitis in infancy is associated with increased incidence of asthma later in life (whether causative or marker of atopic predisposition is debated). Premature infants, those with CHD, chronic lung disease, or immunodeficiency are at high risk for severe disease. Apnea may be the presenting sign in young infants."
    difficulty: easy
    tags: [respirology, bronchiolitis, RSV, pediatrics, infant]
  - front: "What is the evidence-based management of bronchiolitis in children?"
    back: "Mild-moderate: supportive care — PO/IV hydration, oral/nasal suctioning, antipyretics, humidified O2. Severe: humidified high-flow O2 or intubation/ventilation. Bronchodilators (salbutamol, ipratropium), corticosteroids, and antibiotics have NO therapeutic value (unless secondary bacterial pneumonia). Routine investigations NOT required (Choosing Wisely). Peak symptoms at 3-4 days; total duration 2-3 weeks.\n\nMeta-analyses (Cochrane 2010, 30 RCTs, 1992 infants) confirm bronchodilators do not improve O2 saturation, hospital admission rates, or duration of hospitalization in bronchiolitis. CXR is only indicated for poor response to therapy or diagnostic uncertainty (shows air trapping, peribronchial thickening, atelectasis, increased linear markings)."
    difficulty: easy
    tags: [respirology, bronchiolitis, management, Choosing Wisely, supportive care, pediatrics]
  - front: "What are the indications for hospitalization in bronchiolitis?"
    back: "1. Hypoxia: O2 saturation <90% on initial presentation or increasing O2 requirements. 2. Signs of severe distress: tachypnea >80/min, tachycardia >180/min, grunting, nasal flaring, marked chest retractions, lethargy. 3. History of chronic lung disease, hemodynamically significant cardiac disease, neuromuscular problem, immunocompromised. 4. High-risk infants: prematurity <34 weeks, weight <4 kg, age <7 weeks. 5. Significant feeding problems. 6. Socioeconomic barriers to improvement.\n\nPalivizumab (monoclonal antibody targeting RSV F-glycoprotein) is recommended as prophylaxis in high-risk infants: premature <30 weeks GA at <6 months of RSV season onset, chronic lung disease of prematurity requiring ongoing O2, hemodynamically significant CHD age <24 months, and infants from remote northern Inuit communities."
    difficulty: medium
    tags: [respirology, bronchiolitis, hospitalization, palivizumab, pediatrics]
  - front: "What is the role of palivizumab in RSV prophylaxis, and which infants qualify in Canada?"
    back: "Palivizumab is a monoclonal antibody targeting the F-glycoprotein of RSV, given monthly during RSV season. Canadian indications (Public Health Agency 2022): (1) premature infants ≤30 weeks GA at <6 months of age at onset of RSV season, (2) children <24 months with chronic lung disease of prematurity requiring ongoing O2 in the preceding 6 months, (3) infants <24 months with hemodynamically significant CHD, (4) infants born <36 weeks GA and age <6 months living in remote northern Inuit communities.\n\nCochrane review (2021): palivizumab reduces RSV-related hospitalizations (RR 0.30, 95% CI 0.21-0.44 in high-risk infants) with little-to-no difference in mortality or adverse events at 2-year follow-up. It is prophylaxis, not treatment for established RSV. Cost-effectiveness considerations limit use to high-risk groups."
    difficulty: medium
    tags: [respirology, palivizumab, RSV, prophylaxis, pediatrics, Canada]
  - front: "What is the etiology of cystic fibrosis (CF), and what mutation is most common?"
    back: "Autosomal recessive; mutation in CFTR gene on chromosome 7, resulting in dysfunctional chloride channel on apical membrane. Most common mutation: ΔF508 (70% of cases), with >1600 different mutations identified. Incidence: 1 in 3000 live births; most common in people of Northern European descent.\n\nCFTR dysfunction leads to relative dehydration of airway secretions (decreased Cl⁻ secretion → increased Na⁺ and H2O reabsorption), impairing mucociliary transport and causing airway obstruction. In sweat glands, CFTR malfunction leads to elevated sweat chloride. Pancreatic ducts obstruct, causing exocrine insufficiency and eventually endocrine (DM) dysfunction."
    difficulty: easy
    tags: [respirology, cystic fibrosis, CFTR, genetics, pediatrics]
  - front: "What are the clinical features of cystic fibrosis across age groups?"
    back: "Neonatal: meconium ileus, prolonged jaundice, antenatal bowel perforation. Infancy: pancreatic insufficiency with steatorrhea and FTT (despite voracious appetite), anemia, hypoproteinemia, hyponatremia. Childhood: heat intolerance, wheezing/chronic cough, recurrent chest infections (S. aureus, P. aeruginosa, H. influenzae), hemoptysis, nasal polyps, distal intestinal obstruction syndrome, rectal prolapse, clubbing. Older: COPD, male infertility (atresia/absence of vas deferens), decreased female fertility.\n\nMnemonic CF PANCREAS: Chronic cough and wheezing, Failure to thrive (despite voracious appetite), Pancreatic insufficiency (steatorrhea), Absence/atresia of vas deferens, Neonatal intestinal obstruction (meconium ileus), Clubbing, Rectal prolapse, Electrolyte elevation in sweat (salty skin), S. aureus or P. aeruginosa in sputum."
    difficulty: easy
    tags: [respirology, cystic fibrosis, clinical features, meconium ileus, pediatrics]
  - front: "How is cystic fibrosis diagnosed?"
    back: "1. Newborn screening (neonatal). 2. Sweat chloride test x2: >60 mEq/L is diagnostic. 3. CFTR gene mutation analysis (if sweat chloride equivocal or clinically suspicious for rare mutation). 4. Newborn genetic screening positive → requires DNA testing + subsequent sweat chloride testing.\n\nFalse positive sweat chloride: malnutrition, atopic dermatitis, hypothyroidism, hypoparathyroidism, GSD, adrenal insufficiency, G6PD deficiency, Klinefelter syndrome, autonomic dysfunction, familial cholestasis. False negative: technical problem, malnutrition, skin edema, mineralocorticoids. Sweat chloride 40-60 mEq/L is equivocal; <40 mEq/L is normal."
    difficulty: medium
    tags: [respirology, cystic fibrosis, diagnosis, sweat chloride, newborn screening]
  - front: "What is the management and prognosis of cystic fibrosis in Canada?"
    back: "Nutritional: high-calorie diet, pancreatic enzyme replacements, fat-soluble vitamin supplements. Chest: physiotherapy, postural drainage, exercise, bronchodilators, aerosolized DNase, inhaled hypertonic saline, antibiotics (per sputum C&S: cephalosporin, cloxacillin, ciprofloxacin, inhaled tobramycin), lung transplantation. Genetic counselling. Current median survival in Canada: 46.6 years.\n\nCFTR modulator therapy (e.g., ivacaftor, lumacaftor/ivacaftor, elexacaftor/tezacaftor/ivacaftor) has dramatically improved outcomes for eligible mutation carriers by correcting the underlying CFTR protein defect. Complications include respiratory failure, pneumothorax (poor prognosis), cor pulmonale, pancreatic fibrosis with DM, gallstones, cirrhosis with portal HTN, male infertility."
    difficulty: medium
    tags: [respirology, cystic fibrosis, management, prognosis, Canada]
  - front: "What are the common causes and first-line antibiotics for community-acquired pneumonia in children by age group?"
    back: "Neonates: GBS, E. coli, Listeria, HSV, Enterovirus → ampicillin + gentamicin. 1-3 months: S. aureus, S. pneumoniae, Chlamydia trachomatis, RSV, influenza → ampicillin OR ceftriaxone (add azithromycin if Chlamydia suspected). 3 months-5 years: S. pneumoniae, S. aureus, S. pyogenes, RSV → high-dose amoxicillin OR ampicillin OR ceftriaxone. >5 years: S. pneumoniae, Mycoplasma pneumoniae, Chlamydophila pneumoniae, S. aureus → high-dose amoxicillin OR ampicillin OR ceftriaxone (add azithromycin/clarithromycin if Mycoplasma/Chlamydophila suspected). Severe/multilobar/pneumatoceles: add vancomycin.\n\nViral etiologies are most common in children <5 years (RSV, influenza, adenovirus, parainfluenza). Mycoplasma pneumoniae becomes increasingly important after age 5 years ('walking pneumonia' with gradual onset, dry cough, headache). CXR in bacterial pneumonia shows lobar consolidation or pleural effusion; viral shows diffuse bilateral streaky infiltrates."
    difficulty: medium
    tags: [respirology, pneumonia, pediatrics, antibiotics, treatment]
  - front: "Distinguish croup, bacterial tracheitis, and epiglottitis in children."
    back: "Croup (laryngotracheitis): subglottis; age 6-36 months; parainfluenza 75%; non-toxic appearance, barking cough, stridor, viral prodrome, hoarseness; CXR steeple sign. Management: corticosteroids ± nebulized epinephrine (severe). Bacterial tracheitis: trachea; age 3 months-6 years; S. aureus; toxic appearance, rapid progression, biphasic stridor, cough, no response to corticosteroids/epinephrine; endoscopy diagnostic. Management: intubation + IV antibiotics. Epiglottitis: supraglottis; age 2-6 years (decreased due to Hib vaccine); H. influenzae (+ S. pneumoniae, S. aureus); toxic, rapid progression, 4Ds (drooling, dysphagia, dysphonia, distress), tripod position, fever >39°C, NO cough; management: DO NOT examine (risk of complete obstruction), intubation + IV antibiotics.\n\nThe 'steeple sign' on AP neck/chest X-ray reflects subglottic narrowing in croup. In epiglottitis, the 'thumb sign' (thickened epiglottis) is seen on lateral neck X-ray. Physical exam must be done cautiously in epiglottitis to avoid precipitating complete airway obstruction — intubation equipment should be at bedside. Hib vaccination has dramatically reduced epiglottitis incidence."
    difficulty: hard
    tags: [respirology, croup, epiglottitis, bacterial tracheitis, stridor, pediatrics]
  - front: "What is choanal atresia, and how does it present bilaterally vs. unilaterally?"
    back: "Choanal atresia: persistence of oronasal membrane preventing nose from joining the oropharynx; 1 in 7000 live births; 2/3 are unilateral; F>M. Bilateral: presents in infancy with noisy breathing, cyanosis worsening with feeds and improving with crying (neonates are obligate nasal breathers). Unilateral: diagnosed later in life with unilateral discharge or obstruction. Diagnosis: inability to pass NG tube through nares; CT definitive. Acute management (bilateral): place oral airway, initiate gavage feedings. Long-term: referral to otolaryngology.\n\nThe key clinical pearl is that bilateral choanal atresia causes cyclical cyanosis: worse when feeding (mouth closed, must breathe through blocked nose) and better when crying (mouth open). This distinguishes it from cardiac cyanosis. CT scan defines the extent of bony/membranous obstruction for surgical planning (surgical puncture and stenting)."
    difficulty: medium
    tags: [respirology, choanal atresia, stridor, neonatal, pediatrics]
  - front: "What causes stridor vs. wheezing in children, and what are the most common differential diagnoses for each?"
    back: "Stridor: high-pitched noisy breathing from obstruction ABOVE the thoracic inlet; may have hoarseness and suprasternal retractions; stridor at rest is an emergency. DDx: croup, bacterial tracheitis, epiglottitis, foreign body aspiration, subglottic stenosis, laryngomalacia/tracheomalacia, retropharyngeal abscess. Wheezing: whistling sound mainly during expiration from obstruction BELOW the thoracic inlet. Common DDx: asthma (>6 yr, recurrent), bronchiolitis (<1 yr, first episode), recurrent aspiration, pneumonia. Uncommon: foreign body (acute unilateral), CF, BPD. Rare: CHF, mediastinal mass, bronchiolitis obliterans.\n\nThe anatomical location of obstruction determines the sound: above the thoracic inlet → inspiratory stridor (extrathoracic); below → expiratory wheeze (intrathoracic). A fixed obstruction (foreign body, subglottic stenosis) may cause biphasic stridor. Laryngomalacia is the most common cause of chronic stridor in infants, due to collapse of the supraglottic structures on inspiration."
    difficulty: medium
    tags: [respirology, stridor, wheezing, differential diagnosis, pediatrics]
  - front: "A 5-month-old infant presents in winter with 3 days of rhinorrhea, increasing wheeze, and poor feeding. O2 saturation is 88% on room air, respiratory rate 85/min. What is the diagnosis and management?"
    back: "Diagnosis: Bronchiolitis (likely RSV). Management: Supportive — humidified high-flow O2 (SpO2 <90% is indication for hospitalization), IV/NG hydration, nasal suctioning, antipyretics. Do NOT give bronchodilators (salbutamol, ipratropium), corticosteroids, or antibiotics. Hospitalization indicated: SpO2 <90%, RR >80/min, age <7 weeks, significant feeding problems.\n\nThis infant meets multiple hospitalization criteria (hypoxia, severe tachypnea, significant feeding difficulty, age <6 months). Bronchodilators have no proven benefit in bronchiolitis (Cochrane meta-analysis). Peak symptoms at 3-4 days; total illness 2-3 weeks. If premature (<34 wks), palivizumab prophylaxis should have been considered prior to RSV season."
    difficulty: medium
    tags: [respirology, bronchiolitis, RSV, management, hospitalization, pediatrics]
  - front: "A 2-year-old presents at midnight with sudden barking cough, inspiratory stridor, and low-grade fever. The child appears non-toxic. What is the diagnosis and management?"
    back: "Diagnosis: Croup (viral laryngotracheitis), most likely parainfluenza virus. Management: Mild-moderate — oral/IM dexamethasone 0.6 mg/kg (single dose) + supportive care. Severe — corticosteroids + nebulized epinephrine (racemic or L-epinephrine 1:1000) + humidified O2 + intubation if necessary.\n\nCroup is most common in children 6-36 months, peaks in fall/winter. The barking cough, stridor, and hoarseness reflect subglottic edema. CXR (if done) shows 'steeple sign' (subglottic narrowing). Dexamethasone reduces severity and hospitalization. Nebulized epinephrine provides temporary relief (2 hours) in severe cases — observe for 2-4 hours post-epinephrine before discharge."
    difficulty: medium
    tags: [respirology, croup, laryngotracheitis, dexamethasone, epinephrine, pediatrics]
