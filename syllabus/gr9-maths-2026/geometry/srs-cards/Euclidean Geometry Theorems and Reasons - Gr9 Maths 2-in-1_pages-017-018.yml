  - guid: f8f901020304154f
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Euclidean Geometry Theorems and Reasons"
    fields:
      Front: "PYTHAGORAS: In a right-angled triangle, the square of the hypotenuse equals the sum of the squares of the other two sides. State it and give the acceptable reason."
      Back: "Statement: in △ with a right angle, hyp² = (side)² + (side)², i.e. c² = a² + b² where c is the hypotenuse (the side opposite the right angle).\nAcceptable reason: Pythagoras OR Theorem of Pythagoras"
    tags: ["geometry-reasons", "pythagoras", "subject:geometry"]
  - guid: 0a01020304051650
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Euclidean Geometry Theorems and Reasons"
    fields:
      Front: "CONVERSE OF PYTHAGORAS: If the square of the longest side of a triangle equals the sum of the squares of the other two sides, then the triangle is right-angled. Acceptable reason?"
      Back: "Acceptable reason: Converse Pythagoras OR Converse Theorem of Pythagoras\nUse this to PROVE a triangle has a right angle: check if (longest side)² = (other)² + (other)²."
    tags: ["geometry-reasons", "pythagoras", "converse", "subject:geometry"]
  - guid: 1b02030405061761
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Euclidean Geometry Theorems and Reasons"
    fields:
      Front: "Worked example (Pythagoras): a right-angled triangle has legs 6 cm and 8 cm. Find the hypotenuse, with reason."
      Back: "hyp² = 6² + 8²  ... Pythagoras\n= 36 + 64 = 100\nhyp = √100 = 10 cm.\nThe hypotenuse is always the longest side, opposite the right angle."
    tags: ["geometry-reasons", "pythagoras", "worked-example", "subject:geometry"]
  - guid: 2c03040506071872
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Euclidean Geometry Theorems and Reasons"
    fields:
      Front: "Worked example (converse Pythagoras): Is a triangle with sides 5, 12, 13 right-angled? Show working and reason."
      Back: "Longest side 13: 13² = 169.\nOther two: 5² + 12² = 25 + 144 = 169.\nSince 13² = 5² + 12², the triangle IS right-angled (right angle opposite the 13 side) ... Converse Pythagoras."
    tags: ["geometry-reasons", "pythagoras", "converse", "worked-example", "subject:geometry"]
