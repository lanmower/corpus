    back: "Cost, misleading in hemoglobinopathies, iron deficiency, hemolytic anemia, severe hepatic/renal disease, altered by ethnicity and aging, not for diagnostic use in children/adolescents, pregnant women, CF, or suspected T1DM\n\nHbA1C has limitations in certain medical conditions and populations where it may give misleading results."
    difficulty: medium
