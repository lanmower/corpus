# Liver Disease & Cirrhosis (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "A 55-year-old alcoholic has jaundice, ascites, spider angiomata, palmar erythema, and asterixis. Labs: bilirubin 85 μmol/L, INR 2.1, albumin 22 g/L. Child-Pugh score?"
    back: "Child-Pugh C (severe cirrhosis): ascites (2), encephalopathy (2), bilirubin >51 μmol/L (3), INR >2.2 (3 pts? score >10 = class C)\n\nChild-Pugh score assesses cirrhosis severity using 5 parameters: bilirubin, albumin, INR, ascites, encephalopathy. Class A (5-6): compensated; Class B (7-9): moderately advanced; Class C (10-15): severely decompensated. Guides liver transplant listing."
    difficulty: hard
    tags: [Child-Pugh, cirrhosis, liver failure, ascites, hepatology, gastroenterology]
  - front: "What is the MELD score and how is it used?"
    back: "MELD = 3.78×ln(bilirubin μmol/L÷17) + 11.2×ln(INR) + 9.57×ln(creatinine μmol/L÷88.4) + 6.43; predicts 90-day mortality — used for liver transplant prioritization\n\nMELD score was originally developed to predict mortality after TIPS. It is now used for organ allocation in liver transplantation. MELD >15 indicates benefit from transplant. MELD >25: high 90-day mortality without transplant."
    difficulty: medium
    tags: [MELD score, liver transplant, cirrhosis prognosis, gastroenterology]
  - front: "A cirrhotic patient develops increasing abdominal girth. Paracentesis shows fluid with SAAG >11 g/L. What is the diagnosis and initial management?"
    back: "Ascites from portal hypertension (SAAG ≥11 g/L); first-line treatment: sodium restriction (88 mmol/day) + spironolactone 100mg ± furosemide 40mg\n\nSAAG (serum-ascites albumin gradient) ≥11 g/L indicates portal hypertension. Spironolactone blocks aldosterone and is more effective than furosemide alone in cirrhotic ascites. AASLD/CJS guidelines: spironolactone:furosemide ratio 100:40 to maintain normokalemia."
    difficulty: hard
    tags: [ascites, SAAG, cirrhosis, spironolactone, portal hypertension, gastroenterology]
  - front: "What is spontaneous bacterial peritonitis (SBP) and how is it diagnosed and treated?"
    back: "SBP: infection of ascites without apparent source; diagnose by paracentesis with PMN >250 cells/μL; treat with IV cefotaxime 2g q8h or ceftriaxone for 5-7 days + IV albumin\n\nSBP occurs in 10-30% of hospitalized cirrhotics with ascites. Most common organism: E. coli. IV albumin (1.5 g/kg on Day 1, 1 g/kg on Day 3) reduces hepatorenal syndrome and mortality. Secondary prophylaxis: norfloxacin or TMP-SMX."
    difficulty: hard
    tags: [SBP, spontaneous bacterial peritonitis, ascites, ceftriaxone, albumin, gastroenterology]
  - front: "What is hepatic encephalopathy (HE) and how is it managed?"
    back: "HE: neuropsychiatric dysfunction from liver failure; manage with lactulose (goal 2-3 soft stools/day), rifaximin for secondary prophylaxis, identify and treat precipitants\n\nPrecipitants of HE: infection (SBP), GI bleeding, constipation, electrolyte abnormalities, benzodiazepines, sedatives. Lactulose reduces ammonia absorption. Rifaximin 550mg BID added for recurrent/persistent HE. Protein restriction is outdated — maintain adequate protein intake."
    difficulty: hard
    tags: [hepatic encephalopathy, lactulose, rifaximin, cirrhosis, ammonia, gastroenterology]
  - front: "A cirrhotic patient vomits large amounts of fresh blood. What is the immediate management?"
    back: "Resuscitate with blood products (target Hgb 70-80 g/L), IV terlipressin or somatostatin analogue (octreotide), prophylactic antibiotics (ceftriaxone), urgent endoscopy within 12 hours\n\nAcute variceal hemorrhage has 20-30% in-hospital mortality. Octreotide/terlipressin reduces portal pressure. Ceftriaxone prevents bacterial infections that precipitate HE and renal failure. TIPS considered for refractory bleeding. Propranolol/ISMN or EVL for secondary prophylaxis."
    difficulty: hard
    tags: [variceal hemorrhage, portal hypertension, octreotide, endoscopy, cirrhosis, gastroenterology]
  - front: "What are the diagnostic criteria for alcoholic hepatitis and how is severity assessed?"
    back: "Acute liver injury in heavy alcohol use: jaundice, hepatomegaly, AST:ALT ratio typically >2:1 (both usually <400 IU/L); severity: Maddrey Discriminant Function (MDF) ≥32 = severe disease\n\nMDF = 4.6 × (PT - control time) + bilirubin (μmol/L) / 17.1. MDF ≥32 or MELD ≥21 indicates severe alcoholic hepatitis with high 30-day mortality. Treatment: prednisolone 40mg/day for 28 days if no infection. Pentoxifylline no longer recommended."
    difficulty: hard
    tags: [alcoholic hepatitis, Maddrey, prednisolone, MDF, liver disease, gastroenterology]
  - front: "What is non-alcoholic fatty liver disease (NAFLD) and when does it progress to NASH?"
    back: "NAFLD: hepatic steatosis without significant alcohol use; NASH (non-alcoholic steatohepatitis): steatosis + inflammation + ballooning ± fibrosis — risk of cirrhosis and hepatocellular carcinoma\n\nNAFLD is the most common liver disease in Canada (25% prevalence). Risk factors: obesity, T2DM, metabolic syndrome. CJS guidelines: weight loss (>7-10% body weight) is most effective treatment. No approved pharmacotherapy; semaglutide and pioglitazone show promise."
    difficulty: medium
    tags: [NAFLD, NASH, liver steatosis, metabolic, gastroenterology]
  - front: "What is the most common cause of acute liver failure in Canada and how is it managed?"
    back: "Acetaminophen overdose (most common); treat with N-acetylcysteine (NAC) regardless of time since ingestion; transfer to transplant centre for King criteria assessment\n\nNAC replenishes glutathione and prevents hepatotoxicity. Effective up to 24h; still beneficial in late presentation. King College Criteria for transplant: pH <7.30 OR all three: PT >100s, creatinine >300 μmol/L, grade III-IV encephalopathy. Call Poison Control."
    difficulty: hard
    tags: [acute liver failure, acetaminophen, NAC, King College Criteria, liver transplant, gastroenterology]
  - front: "What hepatitis B serology pattern indicates acute infection vs. immunity?"
    back: "Acute infection: HBsAg+, anti-HBc IgM+, anti-HBs−; Recovery/immunity (natural): HBsAg−, anti-HBc IgG+, anti-HBs+; Vaccine immunity: anti-HBs+ only (no anti-HBc)\n\nHBV serology interpretation is essential. HBeAg indicates high viral replication. HBV DNA >2000 IU/mL = active replication. Chronic HBV: HBsAg+ >6 months. AMMI Canada guidelines recommend treatment when HBV DNA and ALT elevated with significant fibrosis."
    difficulty: medium
    tags: [hepatitis B, serology, HBsAg, anti-HBc, gastroenterology]
  - front: "When should antiviral treatment be initiated for chronic hepatitis B?"
    back: "HBeAg-positive: HBV DNA >20,000 IU/mL + elevated ALT; HBeAg-negative: HBV DNA >2,000 IU/mL + elevated ALT; treat regardless of ALT if cirrhosis, HCC family history, immunosuppression\n\nAMMI Canada HBV guidelines recommend tenofovir alafenamide (TAF) or entecavir as first-line agents. Pegylated interferon for selected patients (finite duration). Monitor for HCC with ultrasound every 6 months in high-risk patients."
    difficulty: medium
    tags: [hepatitis B treatment, antiviral, tenofovir, entecavir, HCC surveillance, gastroenterology]
  - front: "A 45-year-old has positive HCV antibody and HCV RNA. What is the treatment in Canada?"
    back: "Direct-acting antivirals (DAAs): sofosbuvir-based regimens (e.g., sofosbuvir/velpatasvir) or glecaprevir/pibrentasvir — 8-12 weeks, >95% sustained virological response (SVR)\n\nCJS guidelines recommend pan-genotypic DAA therapy for all patients with chronic HCV regardless of fibrosis stage. SVR is considered virological cure and reduces liver-related mortality, cirrhosis progression, and HCC risk. Testing should be universal in Canada given high rate of undiagnosed HCV."
    difficulty: medium
    tags: [hepatitis C, DAA, sofosbuvir, SVR, gastroenterology]
  - front: "What is the screening and treatment approach for hepatocellular carcinoma (HCC) in cirrhosis?"
    back: "Ultrasound ± AFP every 6 months; if nodule >1cm on US → multi-phase CT or MRI; LI-RADS 5 = definite HCC → treat (resection, ablation, TACE, sorafenib, liver transplant based on Milan criteria)\n\nMilan criteria for liver transplant: single nodule ≤5cm or ≤3 nodules each ≤3cm, no vascular invasion. CJS and CCA guidelines recommend HCC surveillance in all cirrhosis patients and chronic HBV carriers at high risk."
    difficulty: hard
    tags: [HCC, hepatocellular carcinoma, surveillance, cirrhosis, Milan criteria, gastroenterology]
  - front: "What is hepatorenal syndrome (HRS) and how is it treated?"
    back: "HRS: acute renal failure in cirrhosis from splanchnic vasodilation reducing renal perfusion; Type 1 (AKI >50% creatinine rise in <2 weeks); treat with IV albumin + vasoconstrictors (terlipressin or norepinephrine)\n\nHRS is diagnosed by: cirrhosis with ascites, serum creatinine >133 μmol/L, no improvement with fluid resuscitation, absence of shock/nephrotoxins, no proteinuria or hematuria. Terlipressin + albumin is most effective. Liver transplantation is definitive treatment."
    difficulty: hard
    tags: [hepatorenal syndrome, HRS, cirrhosis, terlipressin, albumin, gastroenterology]
  - front: "What are the indications for TIPS (transjugular intrahepatic portosystemic shunt)?"
    back: "Refractory ascites, recurrent variceal hemorrhage refractory to endoscopic/pharmacological therapy, Budd-Chiari syndrome, hepatic hydrothorax\n\nTIPS creates a shunt reducing portal pressure. Contraindications: heart failure, severe hepatic encephalopathy (HE), active sepsis. TIPS worsens HE in ~25% of patients. MELD >18 predicts poor survival post-TIPS."
    difficulty: medium
    tags: [TIPS, portal hypertension, refractory ascites, variceal hemorrhage, gastroenterology]
  - front: "What is Child-Pugh classification?"
    back: "Bilirubin, albumin, INR, ascites, encephalopathy. Each 1-3. A(5-6), B(7-9), C(10-15 decompensated)\n\nClass C: 1-year mortality ~55%. MELD score preferred for transplant listing."
    difficulty: medium
    tags: [cirrhosis, Child-Pugh]
  - front: "How is spontaneous bacterial peritonitis managed?"
    back: "Ceftriaxone 2g IV. Diagnose by ascitic PMN >250. Albumin 1.5g/kg day1 + 1g/kg day3\n\nCommon organisms: E. coli, Klebsiella. Prophylaxis: norfloxacin for prior SBP or GI bleed."
    difficulty: hard
    tags: [SBP, cirrhosis]
  - front: "What are indications for TIPS?"
    back: "Refractory variceal bleeding, refractory ascites, hepatic hydrothorax, Budd-Chiari\n\nContraindications: severe encephalopathy, heart failure. Main complication: hepatic encephalopathy 30-50%."
    difficulty: medium
    tags: [TIPS, portal HTN]
  - front: "What is the Child-Pugh classification and how is it calculated?"
    back: "5 variables, each 1-3 points: bilirubin, albumin, INR, ascites, encephalopathy. Class A: 5-6 (well-compensated); Class B: 7-9 (significant functional compromise); Class C: 10-15 (decompensated). 1-year survival: A=100%, B=80%, C=45%.\n\nChild-Pugh is used for prognosis, surgical risk assessment, and liver transplant listing. Limitations: subjective grading of ascites/encephalopathy, does not include renal function. MELD score has largely replaced Child-Pugh for transplant allocation in Canada."
    difficulty: medium
    tags: [liver, Child-Pugh, cirrhosis, prognosis, GI]
  - front: "What is the MELD score, how is it calculated, and what is it used for?"
    back: "MELD = 3.78×ln(bilirubin mg/dL) + 11.2×ln(INR) + 9.57×ln(creatinine mg/dL) + 6.43. Range 6-40. Used for liver transplant allocation (higher score = higher priority) and 3-month mortality prediction. MELD-Na includes sodium (improves accuracy).\n\nMELD is the standard for organ allocation in Canada (Canadian Blood Services). MELD >15: consider transplant referral. MELD >20: transplant listing. Exception points given for HCC, hepatopulmonary syndrome. MELD-Na better predicts mortality in hyponatremic patients."
    difficulty: hard
    tags: [liver, MELD, transplant, cirrhosis, prognosis, GI]
  - front: "What is the management of acute variceal bleeding?"
    back: "Resuscitate (target Hb 70-80 g/L), IV octreotide (bolus 50 μg then 50 μg/h x 2-5 days), IV ceftriaxone 1g daily x 7 days prophylaxis, emergent endoscopy within 12h for band ligation. TIPS if refractory.\n\nRestrictive transfusion (Hb target 70) improves survival by avoiding portal pressure increase. Antibiotic prophylaxis reduces mortality and rebleeding. PPI is NOT indicated for variceal bleeding. Pre-emptive TIPS within 72h for Child-Pugh C or B with active bleeding on endoscopy reduces mortality."
    difficulty: hard
    tags: [liver, variceal bleeding, octreotide, band ligation, TIPS, GI]
  - front: "What is the primary and secondary prophylaxis for esophageal varices?"
    back: "Primary prophylaxis: NSBB (propranolol/nadolol, target HR 55-60) OR carvedilol 6.25-12.5 mg daily for medium/large varices. Secondary prophylaxis: combination NSBB + endoscopic band ligation (EBL) until varix obliteration.\n\nScreen with EGD at cirrhosis diagnosis. Small varices without red signs: NSBB or surveillance. Carvedilol has both beta-blocking and alpha-blocking effects, reducing portal pressure more effectively. NSBB contraindicated in refractory ascites with SBP <90 or AKI."
    difficulty: hard
    tags: [liver, varices, NSBB, propranolol, EBL, prophylaxis, GI]
  - front: "How is spontaneous bacterial peritonitis (SBP) diagnosed and treated?"
    back: "Diagnosis: ascitic fluid PMN >250 cells/mm³. Treatment: IV ceftriaxone 2g daily (or cefotaxime 2g q8h) x 5 days + IV albumin 1.5 g/kg day 1, 1 g/kg day 3 (if Cr >88 μmol/L, BUN >10.7 mmol/L, or bilirubin >68 μmol/L).\n\nSBP occurs in ~15% of cirrhotics with ascites. Most common organisms: E. coli, Klebsiella, S. pneumoniae. IV albumin reduces hepatorenal syndrome and mortality. Secondary prophylaxis: norfloxacin 400 mg daily or TMP-SMX indefinitely. Culture-negative SBP (PMN>250, negative culture) treated identically."
    difficulty: hard
    tags: [liver, SBP, ascites, peritonitis, albumin, ceftriaxone, GI]
  - front: "What is the diagnostic approach to ascites including the serum-ascites albumin gradient (SAAG)?"
    back: "SAAG ≥11 g/L: portal hypertension (cirrhosis, heart failure, Budd-Chiari). SAAG <11 g/L: non-portal hypertension (peritoneal carcinomatosis, TB peritonitis, nephrotic syndrome, pancreatitis).\n\nSAAG replaces the old transudate/exudate classification for ascites. Total protein helps further classify: SAAG ≥11 + protein >25 g/L = cardiac ascites; SAAG ≥11 + protein <25 g/L = cirrhotic ascites. Always send cell count, culture (inoculate blood culture bottles at bedside), albumin, total protein."
    difficulty: medium
    tags: [liver, ascites, SAAG, paracentesis, portal hypertension, GI]
  - front: "What is the management of refractory ascites in cirrhosis?"
    back: "Salt restriction (<2g Na/day) + diuretics (spironolactone:furosemide 100:40 mg ratio, max 400:160). Refractory: serial large-volume paracentesis (LVP) with albumin replacement (6-8 g per L removed if >5L) or TIPS. Consider liver transplant.\n\nDiuretic-resistant ascites (no response to max diuretics) or diuretic-intractable (complications prevent adequate doses) defines refractory ascites. TIPS improves ascites but risks encephalopathy — contraindicated if MELD >18, severe encephalopathy, or heart failure. Median survival 6 months without transplant."
    difficulty: hard
    tags: [liver, ascites, refractory, spironolactone, TIPS, LVP, GI]
  - front: "What are the grades of hepatic encephalopathy and its management?"
    back: "West Haven: Grade 1 (mild confusion, short attention), Grade 2 (lethargy, disorientation), Grade 3 (somnolent but arousable, marked confusion), Grade 4 (coma). Treat with lactulose (titrate to 2-3 soft stools/day) + rifaximin 550 mg BID for secondary prophylaxis.\n\nHE is caused by ammonia and other toxins bypassing hepatic clearance. Precipitants: GI bleeding, infection, constipation, dehydration, sedatives, hypokalemia, alkalosis. Lactulose (first-line) acidifies colon lumen trapping NH4+. Rifaximin reduces ammonia-producing bacteria and reduces HE recurrence by 50%."
    difficulty: hard
    tags: [liver, hepatic encephalopathy, lactulose, rifaximin, West Haven, GI]
  - front: "What is hepatorenal syndrome (HRS) and how is it classified and treated?"
    back: "HRS-AKI (formerly Type 1): rapid Cr rise ≥26.5 μmol/L in 48h or ≥50% in 7 days, progressive renal failure. HRS-CKD (Type 2): stable moderate renal failure. Treatment: IV albumin + terlipressin (first-line) or norepinephrine + albumin. Definitive: liver transplant.\n\nHRS is functional renal failure due to splanchnic vasodilation and renal vasoconstriction — kidneys are structurally normal. Must exclude other causes: no improvement with albumin challenge (1g/kg x 2 days), no nephrotoxins, no obstruction, no parenchymal disease. Terlipressin is now approved in Canada."
    difficulty: hard
    tags: [liver, HRS, hepatorenal, terlipressin, albumin, AKI, GI]
  - front: "What is the workup for newly diagnosed cirrhosis?"
    back: "Etiology: hepatitis B/C serology, alcohol history, ferritin/transferrin sat (hemochromatosis), ceruloplasmin (Wilson), ANA/ASMA/IgG (autoimmune), AMA (PBC). Assess severity: bloodwork (CBC, INR, albumin, bilirubin, Cr), EGD for varices, US for HCC screening, MELD score.\n\nLiver biopsy may not be needed if diagnosis is clear clinically. Transient elastography (FibroScan) is non-invasive assessment of fibrosis. HCC screening: abdominal US ± AFP every 6 months. Bone density screening (osteoporosis risk). Vaccinate for HepA/B if non-immune."
    difficulty: medium
    tags: [liver, cirrhosis, workup, hepatitis, HCC screening, GI]
  - front: "What are the diagnostic criteria for alcohol-associated hepatitis?"
    back: "Heavy alcohol use (>40 g/day women, >60 g/day men) for >6 months with <60 days abstinence, jaundice onset <8 weeks, AST >50 (AST:ALT ratio >1.5), bilirubin >50 μmol/L. Maddrey discriminant function ≥32: severe, consider prednisolone 40 mg x 28 days.\n\nMaddrey DF = 4.6 × (PT patient - PT control) + bilirubin (mg/dL). MELD >20 also predicts poor prognosis. Lille score at day 7 assesses steroid response: >0.45 = non-responder, stop steroids. Pentoxifylline is no longer recommended (STOPAH trial). Contraindications to steroids: active GI bleeding, uncontrolled infection."
    difficulty: hard
    tags: [liver, alcoholic hepatitis, Maddrey, Lille score, steroids, GI]
  - front: "What is the approach to HCC screening and management in cirrhosis?"
    back: "Screen with abdominal ultrasound ± AFP every 6 months. Suspicious lesion >1 cm: contrast-enhanced CT or MRI (arterial enhancement + washout = diagnostic). Management: BCLC staging → surgical resection, liver transplant (Milan criteria: single ≤5cm or ≤3 nodules each ≤3cm), ablation, TACE, sorafenib/atezolizumab-bevacizumab.\n\nMilan criteria define transplant eligibility for HCC. Beyond Milan: some centres use UCSF criteria. First-line systemic therapy for advanced HCC: atezolizumab + bevacizumab (IMbrave150 trial). HCC screening applies to all cirrhotics and chronic HBV carriers even without cirrhosis."
    difficulty: hard
    tags: [liver, HCC, screening, Milan criteria, BCLC, transplant, GI]
  - front: "What are the features and management of non-alcoholic fatty liver disease (NAFLD/MASLD)?"
    back: "Spectrum: steatosis → steatohepatitis (NASH/MASH) → fibrosis → cirrhosis. Risk factors: metabolic syndrome, obesity, T2DM. Diagnosis: exclude alcohol (>20g/day women, 30g/day men) and other causes. FibroScan or FIB-4 for fibrosis assessment. Management: weight loss ≥7-10%, exercise, treat metabolic syndrome. Pioglitazone or vitamin E for biopsy-proven NASH without diabetes.\n\nNAFLD is the most common liver disease globally. Renamed MASLD (metabolic-associated steatotic liver disease) in 2023. Resmetirom (thyroid hormone receptor agonist) is FDA-approved for NASH with fibrosis. GLP-1 agonists (semaglutide) show benefit. Bariatric surgery improves NASH in obese patients."
    difficulty: hard
    tags: [liver, NAFLD, NASH, MASLD, metabolic, fibrosis, GI]
  - front: "What drugs should be avoided or dose-adjusted in cirrhosis?"
    back: "Avoid: NSAIDs (renal, bleeding), ACEi/ARBs (hypotension, renal), aminoglycosides, metformin (in decompensated), sedatives/opioids (encephalopathy). Dose-adjust: acetaminophen (max 2g/day), statins (monitor closely). Prefer: lactulose, rifaximin, spironolactone.\n\nNSAIDs cause renal vasoconstriction (reduce prostaglandin-mediated afferent dilation) worsening ascites and precipitating HRS. ACEi/ARBs further reduce effective circulating volume. Acetaminophen in reduced doses is safer than NSAIDs for pain. Avoid gadolinium MRI contrast if GFR <30 (NSF risk)."
    difficulty: hard
    tags: [liver, cirrhosis, drug safety, NSAIDs, pharmacology, GI]
  - front: "What are the indications and contraindications for TIPS (transjugular intrahepatic portosystemic shunt)?"
    back: "Indications: refractory variceal bleeding despite endoscopic therapy, refractory ascites, Budd-Chiari syndrome, hepatic hydrothorax. Contraindications: severe hepatic encephalopathy, heart failure (right-sided), MELD >18 (relative), hepatic malignancy, uncontrolled sepsis.\n\nTIPS creates a portosystemic shunt reducing portal pressure. Main complication is hepatic encephalopathy (30-50%). Covered stents (PTFE) have better patency. Pre-emptive TIPS within 72h of variceal bleeding in high-risk patients (Child B with active bleeding or Child C 10-13) reduces mortality."
    difficulty: hard
    tags: [liver, TIPS, portal hypertension, varices, ascites, GI]
  - front: "How do you interpret liver function tests (LFTs)?"
    back: "Hepatocellular: ALT>AST (viral hepatitis), AST>ALT 2:1 (alcoholic). Cholestatic: elevated ALP+GGT+bilirubin (obstructive). Synthetic: low albumin, elevated INR (chronic liver disease)\n\nIsolated elevated ALP: check GGT (if normal, bone source). Very high ALT (>1000): acute viral hepatitis, ischemic hepatitis, toxin (acetaminophen). Conjugated hyperbilirubinemia = post-hepatic obstruction."
    difficulty: medium
    tags: [LFTs, interpretation]
  - front: "A newborn presents with jaundice on day 1 of life. Indirect (unconjugated) bilirubin is markedly elevated. What is the most likely category of jaundice, the most important diagnosis to consider, and the urgency?"
    back: "Pre-hepatic (hemolytic) jaundice. The most important diagnosis is hemolytic disease of the newborn (Rh or ABO incompatibility). This is urgent because severe unconjugated hyperbilirubinemia can cause kernicterus (bilirubin encephalopathy). Immediate workup includes blood type, Coombs test, CBC with reticulocyte count, and peripheral smear.\n\nJaundice within the first 24 hours of life is ALWAYS pathological and requires urgent evaluation. Physiological jaundice does not appear until day 2-3. Pre-hepatic causes produce unconjugated (indirect) hyperbilirubinemia because the liver cannot conjugate the excess bilirubin load from hemolysis."
    difficulty: hard
    tags: [jaundice, neonatal, hemolytic, pre-hepatic, unconjugated, pediatrics]
  - front: "How do you classify jaundice as pre-hepatic, hepatic, or post-hepatic using bilirubin fractions, urine, and stool findings?"
    back: "Pre-hepatic: elevated unconjugated bilirubin, normal/dark urine urobilinogen, dark stool, no bilirubinuria. Hepatic: elevated both conjugated and unconjugated, bilirubinuria present, variable urine urobilinogen. Post-hepatic (obstructive): elevated conjugated bilirubin, bilirubinuria (dark urine/tea-colored), pale/clay-colored stool (acholic), absent urine urobilinogen.\n\nUnconjugated bilirubin is albumin-bound and cannot be filtered by the kidneys, so bilirubinuria only occurs with conjugated hyperbilirubinemia. Clay-colored stools indicate complete biliary obstruction preventing bilirubin from reaching the gut. These simple bedside clues direct the workup efficiently."
    difficulty: medium
    tags: [jaundice, bilirubin, differential-diagnosis, GI, hepatology]
  - front: "A 60-year-old presents with painless progressive jaundice, weight loss, and a palpable non-tender gallbladder. What is the most likely diagnosis?"
    back: "Pancreatic head cancer (periampullary carcinoma). The palpable non-tender gallbladder with painless jaundice is Courvoisier's sign/law, which states that painless jaundice with a palpable gallbladder is unlikely to be due to gallstones (which cause a fibrosed, contracted gallbladder) and more likely malignant obstruction.\n\nCourvoisier's sign has limited sensitivity but reasonable specificity for malignant biliary obstruction. Initial workup includes abdominal ultrasound followed by CT pancreas protocol or MRCP. CA 19-9 is a tumor marker that supports but does not confirm the diagnosis. ERCP with stenting may be needed for biliary decompression."
    difficulty: medium
    tags: [jaundice, post-hepatic, Courvoisier, pancreatic-cancer, surgery]
  - front: "What are the key laboratory patterns that differentiate hepatocellular jaundice from obstructive (cholestatic) jaundice?"
    back: "Hepatocellular: markedly elevated AST/ALT (transaminases, often >1000 in acute hepatitis), moderately elevated ALP/GGT, elevated conjugated and unconjugated bilirubin, prolonged PT (not corrected by vitamin K). Cholestatic/obstructive: markedly elevated ALP/GGT (>3x normal), mild-moderate AST/ALT elevation, elevated conjugated bilirubin, prolonged PT (corrected by vitamin K since fat-soluble vitamin malabsorption is the cause).\n\nThe AST/ALT vs ALP pattern is the critical discriminator. In obstructive jaundice, PT prolongation responds to vitamin K because the coagulopathy results from malabsorption of fat-soluble vitamins due to absent bile salts. In hepatocellular disease, the liver itself cannot synthesize clotting factors, so vitamin K is ineffective."
    difficulty: hard
    tags: [jaundice, liver-enzymes, hepatocellular, cholestatic, laboratory]
  - front: "What is the pathophysiology of cirrhosis and portal hypertension?"
    back: "Chronic liver injury causes fibrosis (stellate cell activation), architectural distortion, increased intrahepatic resistance, portal HTN (HVPG >5mmHg), splanchnic vasodilation, and hyperdynamic circulation\n\nConsequences: varices (HVPG>10), ascites (HVPG>12), hepatorenal syndrome (splanchnic steal), hepatic encephalopathy (portosystemic shunting of ammonia), coagulopathy (decreased synthetic function)."
    difficulty: hard
    tags: [cirrhosis, pathophysiology]
  - front: "What is the SAAG and how does it classify ascites?"
    back: "SAAG = serum albumin - ascitic albumin. >=11g/L: portal hypertension (cirrhosis, CHF, Budd-Chiari). <11g/L: non-portal HTN (peritoneal carcinomatosis, TB, nephrotic, pancreatitis)\n\nDiagnostic paracentesis: cell count (PMN>250 = SBP), albumin, protein, culture. Therapeutic: large volume (>5L) with albumin replacement (6-8g per liter removed) to prevent circulatory dysfunction."
    difficulty: medium
    tags: [SAAG, ascites, paracentesis]
  - front: "What is the approach to chronic hepatitis C treatment?"
    back: "Direct-acting antivirals (DAAs): sofosbuvir-based regimens achieve >95% SVR (cure) in 8-12 weeks. Pan-genotypic: sofosbuvir/velpatasvir or glecaprevir/pibrentasvir. Screen all born 1945-1975\n\nCASL guidelines. No more interferon. Minimal side effects. Check: genotype, fibrosis stage (FibroScan), HBV co-infection status before treatment. SVR at 12 weeks post-treatment = cure. Reinfection possible."
    difficulty: medium
    tags: [hepatitis C, DAA, treatment]
  - front: "What is the current approach to screening and treating chronic hepatitis B and hepatitis C?"
    back: "Hepatitis B screening: HBsAg, anti-HBs, anti-HBc; screen immigrants from endemic areas, IVDU, MSM, HIV+, household/sexual contacts. Chronic HBV treatment indications: elevated ALT + HBV DNA >2000 IU/mL (HBeAg-negative) or >20,000 (HBeAg-positive), significant fibrosis, cirrhosis regardless of ALT. Treatment: tenofovir (TDF or TAF) or entecavir — lifelong in most cases; pegylated interferon-alpha (48 weeks, finite) for select patients. Hepatitis C screening: one-time for baby boomers (born 1945-1975), IVDU, HIV+, incarcerated, recipients of blood products before 1992. Treatment: direct-acting antivirals (DAAs) — cure rate >95% in 8-12 weeks; pan-genotypic regimens: sofosbuvir/velpatasvir (Epclusa) or glecaprevir/pibrentasvir (Maviret). Treat ALL patients with chronic HCV (no longer need to wait for advanced fibrosis).\n\nDAAs have transformed HCV from a chronic disease to a curable one. Canada has committed to WHO hepatitis elimination targets by 2030. Maviret (8-week course) is the most commonly used pan-genotypic regimen in Canada. For HBV, abrupt discontinuation of antivirals can cause severe hepatitis flares — close monitoring required. CASL (Canadian Association for the Study of the Liver) provides national hepatitis treatment guidelines."
    difficulty: hard
    tags: [hepatitis B, hepatitis C, DAAs, tenofovir, entecavir, screening, GI]
  - front: "What is the significance of hepatitis B serologic markers: HBsAg, anti-HBs, anti-HBc IgM vs IgG, HBeAg, and HBV DNA?"
    back: "HBsAg+: active infection (acute or chronic — chronic if persists >6 months). Anti-HBs+: immunity (from vaccination if isolated; from resolved infection if with anti-HBc). Anti-HBc IgM+: acute infection (or reactivation). Anti-HBc IgG+: past exposure (resolved or chronic). HBeAg+: high replication, high infectivity. Anti-HBe+: lower replication (seroconversion). HBV DNA: quantifies viral load, guides treatment decisions. Patterns: Immune (vaccinated): anti-HBs+ only. Resolved infection: anti-HBs+ AND anti-HBc+. Chronic active: HBsAg+, anti-HBc IgG+, HBeAg+ or HBeAg-, HBV DNA detectable. Occult HBV: HBsAg-, anti-HBc+, low-level HBV DNA (risk of reactivation with immunosuppression).\n\nThis is one of the most commonly tested serology interpretation topics on licensing exams. Occult HBV (isolated anti-HBc positive) is important — rituximab, chemotherapy, and other immunosuppressants can reactivate HBV, requiring prophylactic antivirals. CASL guidelines recommend HBV screening before all immunosuppressive therapy."
    difficulty: hard
    tags: [hepatitis B, serology, HBsAg, anti-HBs, HBeAg, infectious disease, GI]
  - front: "What is the treatment approach for hepatitis C with direct-acting antivirals (DAAs)?"
    back: "Pan-genotypic regimens (treat all genotypes): Glecaprevir/pibrentasvir (Maviret): 8 weeks for treatment-naive without cirrhosis (all genotypes); 12 weeks with compensated cirrhosis. Sofosbuvir/velpatasvir (Epclusa): 12 weeks for all genotypes ± cirrhosis. Pre-treatment workup: HCV genotype (may affect regimen choice), fibrosis assessment (FIB-4 index, FibroScan, or liver biopsy), hepatic function (Child-Pugh — decompensated cirrhosis needs specialist), HBV co-infection screening (risk of HBV reactivation during DAA treatment), drug interactions (especially with HIV antiretrovirals, PPIs, statins). SVR12 (sustained virologic response at 12 weeks post-treatment) = CURE (>95%). Post-cure: if cirrhosis, continue HCC surveillance (ultrasound q6 months) — SVR does not eliminate HCC risk in cirrhotics.\n\nDAAs have a >95% cure rate and are well-tolerated (minimal side effects compared to interferon era). All Canadian provinces now cover DAAs without fibrosis restrictions — treat all patients with chronic HCV. HBV reactivation during DAA treatment can be fatal — screen for HBV and consider prophylaxis. CASL guidelines recommend treating HCV as early as possible to prevent transmission and liver disease progression."
    difficulty: hard
    tags: [hepatitis C, DAAs, Maviret, Epclusa, SVR, GI, infectious disease]
  - front: "What are the complications of chronic hepatitis B and when is liver transplant considered?"
    back: "Complications: cirrhosis (15-40% of chronic HBV over 20 years), hepatocellular carcinoma (HCC — can occur even WITHOUT cirrhosis in HBV, unlike HCV), portal hypertension (varices, ascites, hepatic encephalopathy, hepatorenal syndrome), decompensated liver disease. HCC surveillance: abdominal ultrasound ± AFP every 6 months for: all cirrhotics, Asian males >40, Asian females >50, Africans >20, family history of HCC, HBV with high viral load. Liver transplant indications: decompensated cirrhosis (Child-Pugh ≥B7, MELD ≥15), HCC within Milan criteria (single ≤5cm or ≤3 nodules each ≤3cm, no vascular invasion, no extrahepatic disease), acute liver failure. Post-transplant: HBV recurrence prevented with HBIG + antiviral (tenofovir/entecavir) — excellent outcomes.\n\nUnlike HCV, HBV can cause HCC without cirrhosis through direct viral oncogenesis (HBV DNA integration into hepatocyte genome). This is why HCC surveillance is recommended for non-cirrhotic HBV patients based on demographic risk. Canadian Organ Replacement Register tracks transplant outcomes — 5-year survival for liver transplant is ~75%. CASL guidelines provide detailed HCC surveillance recommendations stratified by risk."
    difficulty: hard
    tags: [hepatitis B, HCC, cirrhosis, liver transplant, Milan criteria, GI]
  - front: "What clinical conditions are associated with spider angiomas due to hyperestrogenic states?"
    back: "Liver disease (cirrhosis), pregnancy, and oral contraceptive pill (OCP) use.\n\nHyperestrogenic states increase the likelihood of developing spider angiomas, making them a physical exam finding suggestive of underlying liver disease."
    difficulty: easy
    tags: [dermatology, vascular tumors, spider angioma, liver disease, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the risk factors/associations with Porphyria Cutanea Tarda?"
    back: "Hemochromatosis, alcohol abuse, diabetes mellitus, estrogen therapy, NSAIDs, HIV, hepatitis C, and elevated iron indices\n\nThese conditions share oxidative stress and iron accumulation mechanisms that worsen uroporphyrinogen decarboxylase inhibition"
    difficulty: easy
    tags: [dermatology, porphyria-cutanea-tarda, risk-factors, metabolism, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What AST/ALT ratio suggests alcohol as the cause of hepatitis?"
    back: "AST/ALT ratio >2\n\nAlcoholic hepatitis typically causes higher AST than ALT with this characteristic ratio"
