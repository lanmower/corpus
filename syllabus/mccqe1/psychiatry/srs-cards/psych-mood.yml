  - front: "What are the contraindications for varenicline?"
    back: "Caution with pre-existing psychiatric conditions (risk of psychosis, depression, suicidal ideation)\n\nPatients with psychiatric history should be monitored closely for mood changes while on varenicline."
    difficulty: medium
    tags: [pharmacology, smoking-cessation, contraindications, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the first-line SSRI for youth per Toronto Notes 2025?"
    back: "Fluoxetine (Prozac®)\n\nFluoxetine is recommended as first-line SSRI therapy for youth. Paroxetine is not recommended for youth due to controversy."
