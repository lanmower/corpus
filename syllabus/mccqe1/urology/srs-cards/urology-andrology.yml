cards:
  - front: "What are the clinical features of testosterone deficiency (hypogonadism) in men?"
    back: "Sexual: decreased libido, delayed ejaculation, reduced ejaculate volume, decreased orgasm intensity, ED, loss of morning erections, infertility. Cognitive: fatigue, mood changes, depression, insomnia, irritability. Physical: decreased energy, anemia, gynecomastia, hot flashes, decreased muscle mass, increased visceral fat, osteopenia, testicular atrophy, loss of androgenic hair.\n\nDiagnosis requires clinical features PLUS morning total testosterone <10 nmol/L. Measure LH to distinguish primary (high LH) from secondary (low/normal LH) hypogonadism. Absolute contraindications to testosterone therapy: male breast cancer, desiring fertility, advanced/metastatic prostate cancer."
    difficulty: medium
