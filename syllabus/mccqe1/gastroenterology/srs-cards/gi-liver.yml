  - front: "What are the hepatic manifestations of Wilson's disease?"
    back: "Acute hepatitis, acute liver failure (ALF), chronic active hepatitis, cirrhosis, and low risk of HCC\n\nLiver involvement is often the initial presentation, ranging from mild hepatitis to fulminant liver failure."
    difficulty: medium
    tags: [wilsons-disease, hepatology, liver, cirrhosis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
