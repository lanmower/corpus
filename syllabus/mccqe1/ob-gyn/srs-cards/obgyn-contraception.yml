# Contraception & Family Planning (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What is the most effective reversible contraception method and how effective is it?"
    back: "Intrauterine devices (LNG-IUS: 0.1-0.2% failure rate; copper IUD: 0.6-0.8% failure rate) and implants (etonogestrel implant: 0.05% failure rate) — all >99% effective as LARC (long-acting reversible contraception)\n\nSOGC Contraception Guidelines: LARC methods (IUDs, implants) are most effective because they eliminate user error. Copper IUD is also the most effective emergency contraception (>99% if inserted within 5 days of unprotected intercourse)."
    difficulty: easy
    tags: [LARC, IUD, contraception, efficacy, SOGC, obgyn]
  - front: "What are the absolute contraindications to combined oral contraceptive pills (COCPs)?"
    back: "WHO Category 4: breastfeeding <6 weeks postpartum, hypertension ≥160/100, migraine with aura, stroke/TIA/DVT/PE history, ischemic heart disease, active liver disease/cancer, breast cancer, smoking ≥15 cigarettes/day age ≥35, major surgery with prolonged immobilization\n\nSOGC/WHO MEC (Medical Eligibility Criteria) classify contraceptive use by condition. Category 4 = absolute contraindication; Category 3 = relative contraindication (risks usually outweigh benefits). Combined pills increase VTE and stroke risk in high-risk groups."
    difficulty: medium
    tags: [OCP contraindications, combined pill, WHO MEC, stroke risk, obgyn]
  - front: "What is emergency contraception and what options are available in Canada?"
    back: "Emergency contraception (EC) options: 1) Levonorgestrel (Plan B One-Step) 1.5mg within 72h (reduced efficacy by 120h); 2) Ulipristal acetate (Ella) within 120h (more effective than LNG especially 72-120h); 3) Copper IUD within 120h (most effective >99%)\n\nSOGC EC guidelines: levonorgestrel EC reduces pregnancy risk by 85-95% when used within 72h. Less effective with higher BMI (>75 kg). Ulipristal acetate is superior to LNG for women >75 kg. Copper IUD: most effective EC and provides ongoing contraception."
    difficulty: medium
    tags: [emergency contraception, Plan B, ulipristal, copper IUD, SOGC, obgyn]
  - front: "A 16-year-old requests contraception. What are the ethical and legal considerations in Canada?"
    back: "Minors can consent to contraception without parental involvement in all Canadian provinces — physician must assess for capacity and coercion; maintain confidentiality\n\nCanadian law and SOGC guidelines support provision of contraceptive care to mature minors without parental consent. Mature minor doctrine applies. Assess for coercion or abuse. Maintain confidentiality. Ontario's Personal Health Information Protection Act (PHIPA) protects adolescent health information."
    difficulty: medium
    tags: [adolescent contraception, minors consent, confidentiality, mature minor, obgyn]
  - front: "What is progestin-only contraception and when is it preferred over combined pills?"
    back: "Progestin-only pill (POP), progestin IUD (LNG-IUS), progestin implant, DMPA injection; preferred when estrogen is contraindicated: breastfeeding, migraine with aura, VTE history, cardiovascular disease, smoking ≥35 years\n\nSOGC guidelines: progestin-only methods do not contain estrogen and are safe in situations where estrogen is contraindicated. LNG-IUS (Mirena): most effective progestin-only method, also treats heavy menstrual bleeding and dysmenorrhea."
    difficulty: easy
    tags: [progestin-only contraception, POP, LNG-IUS, estrogen contraindication, obgyn]
  - front: "How does DMPA (Depo-Provera, medroxyprogesterone acetate) injection affect fertility?"
    back: "DMPA (150 mg IM every 12 weeks): fertility return delayed up to 12-18 months after last injection; bone density temporarily reduced (reversible after discontinuation)\n\nSOGC guidelines: DMPA is a highly effective (>99%) injectable contraceptive. Counseling about delayed fertility return is essential for women planning pregnancy within 12-18 months. Adolescents and women who may want pregnancy soon may prefer other methods."
    difficulty: medium
    tags: [DMPA, Depo-Provera, fertility return, bone density, obgyn]
  - front: "What is the mechanism and efficacy of copper IUD as an intrauterine device?"
    back: "Copper IUD (e.g., Mona Lisa NT, IUD380): spermicidal (copper ions inhibit sperm motility), prevents fertilization, possible anti-implantation effect; 10-year efficacy >99%, failure rate 0.6-0.8%/year\n\nSOGC IUD guidelines: copper IUD is inserted by trained providers during any phase of menstrual cycle or up to 5 days after unprotected sex (EC use). Side effects: heavier, more painful periods (opposite of LNG-IUS). No hormones — preferred by women who want hormone-free contraception."
    difficulty: easy
    tags: [copper IUD, intrauterine device, contraception mechanism, heavy periods, obgyn]
  - front: "A patient asks about sterilization (tubal ligation). What should the counseling include?"
    back: "Tubal ligation is a permanent surgical method (assume irreversible); very effective (failure rate <0.5%); inform about failure risk (ectopic pregnancy risk if failure), alternatives (IUD equally effective and reversible), no protection against STIs\n\nSOGC sterilization guidelines: patients should be counseled that sterilization is intended to be permanent. Regret rates: 5-26%, higher in women <30 and those having the procedure postpartum or after a recent pregnancy loss. Vasectomy for male partner is safer with lower failure rate."
    difficulty: medium
    tags: [tubal ligation, sterilization, counseling, permanent contraception, obgyn]
  - front: "What contraceptive options are safest for a breastfeeding mother 6 weeks postpartum?"
    back: "Progestin-only methods (LNG-IUS, etonogestrel implant, POP, DMPA) or copper IUD — combined OCP contraindicated in first 6 weeks postpartum (breastfeeding and VTE risk)\n\nSOGC Postpartum Contraception Guidelines: Breastfeeding provides some contraception (LAM: lactational amenorrhea method) — >98% effective if exclusive BF, amenorrheic, and <6 months postpartum. LARC methods (IUD, implant) can be inserted immediately postpartum (within 10 min of placental delivery) or delayed to 4 weeks."
    difficulty: medium
    tags: [postpartum contraception, breastfeeding, LARC, progestin-only, SOGC, obgyn]
  - front: "A woman with lupus (SLE) asks about contraception options. What is appropriate?"
    back: "Active severe SLE: combined OCP is WHO category 3-4 (avoid if antiphospholipid antibodies, thrombocytopenia, or nephritis); progestin-only IUD or copper IUD are preferred\n\nSOGC/WHO MEC guidelines for SLE: SLE without severe features and negative antiphospholipid antibodies — combined OCP may be used (category 2-3). SLE with antiphospholipid antibodies: combined OCP is contraindicated (category 4) due to VTE/thrombosis risk. LARC methods are safest."
    difficulty: hard
    tags: [SLE, lupus, contraception, antiphospholipid antibodies, obgyn]
  - front: "What are the available contraceptive methods ranked by effectiveness?"
    back: "Most effective (>99%): IUD (copper and LNG), implant (Nexplanon), sterilization. Very effective (91-99% typical use): DMPA injection, combined OCP, patch, ring. Moderate (80-91%): condoms, diaphragm, withdrawal, fertility awareness. Emergency: copper IUD (most effective), ulipristal (ella, up to 5 days), levonorgestrel (Plan B, up to 3 days).\n\nSOGC contraception guidelines emphasize long-acting reversible contraception (LARC: IUD, implant) as first-line due to highest effectiveness and no adherence issues. Canadian data shows 9% typical-use failure rate for OCPs. Contraceptive counseling should use shared decision-making approach."
    difficulty: medium
    tags: [contraception effectiveness, LARC, IUD, gynecology]
  - front: "What are the absolute and relative contraindications to combined hormonal contraception (CHC)?"
    back: "Absolute (WHO Category 4): migraine with aura, VTE history/active, known thrombophilia, SLE with antiphospholipid antibodies, breast cancer, smoking >=15 cig/day AND age >=35, uncontrolled HTN, major surgery with prolonged immobilization, <21 days postpartum. Relative (Category 3): controlled HTN, migraine without aura in >=35, obesity, smoking <15 cig/day AND >=35.\n\nSOGC uses WHO Medical Eligibility Criteria (MEC) framework. Category 1: no restriction. 2: generally use. 3: risks usually outweigh benefits. 4: unacceptable risk. CHC is safe for most women. Estrogen component increases VTE risk 3-4x (absolute risk still low: 3-9 per 10,000 woman-years)."
    difficulty: hard
    tags: [CHC contraindications, WHO MEC, OCP, gynecology]
  - front: "What are the types of IUDs available in Canada and their key features?"
    back: "Copper IUD (Mona Lisa, Flexi-T): hormone-free, effective for 5-10 years, may increase menstrual bleeding/cramping, can be used for emergency contraception. LNG-IUS 52mg (Mirena): 5 years, reduces menstrual bleeding (therapeutic for HMB), amenorrhea in 20-50%. LNG-IUS 19.5mg (Kyleena): 5 years, smaller, less amenorrhea. LNG-IUS 13.5mg (Jaydess): 3 years, smallest.\n\nSOGC recommends IUDs as first-line contraception for all ages including nulliparous women and adolescents. IUDs do NOT increase PID risk (only slightly elevated in first 20 days after insertion). IUDs can be inserted at any time in the cycle. Expulsion rate: 2-10% in first year."
    difficulty: medium
    tags: [IUD, copper IUD, LNG-IUS, Mirena, gynecology]
  - front: "What is the approach to emergency contraception in Canada?"
    back: "Copper IUD: most effective (>99%), can insert up to 7 days post-intercourse. Ulipristal acetate (ella) 30mg: effective up to 5 days, progesterone receptor modulator, more effective than LNG for BMI >26. Levonorgestrel (Plan B) 1.5mg: available OTC, effective up to 3 days (best <24h), less effective with BMI >25. Yuzpe method: less effective, more side effects.\n\nSOGC emergency contraception guidelines recommend copper IUD as most effective option. Ulipristal requires prescription in Canada. LNG (Plan B) is available without prescription. After LNG, hormonal contraception can start next day. After ulipristal, wait 5 days before starting hormonal contraception."
    difficulty: medium
    tags: [emergency contraception, copper IUD, Plan B, ulipristal, gynecology]
  - front: "What is the quick-start method for initiating contraception?"
    back: "Start hormonal contraception on the day of the visit regardless of cycle day (not waiting for next menses). Requirements: reasonably exclude pregnancy (negative urine hCG, no intercourse since last period, or consistent contraception use). Use backup method (condoms) for first 7 days. Preferred approach per SOGC for improving uptake and continuation.\n\nSOGC guidelines endorse quick-start to reduce unintended pregnancy during the waiting period. Traditional Sunday-start or first-day-of-period start methods lead to unnecessary delays and missed opportunities. Same-day IUD insertion is also recommended when pregnancy is reasonably excluded."
    difficulty: medium
    tags: [quick-start, contraception initiation, SOGC, gynecology]
  - front: "What is the management of a missed combined oral contraceptive pill?"
    back: "1 missed pill: take immediately, continue pack, no backup needed. 2 missed pills (or 1 missed in first week): take most recent missed pill, continue pack, use backup x 7 days, consider EC if unprotected intercourse in past 5 days. >=3 missed pills (or >=2 in first week): take most recent, continue pack, backup x 7 days, EC if indicated, skip placebo if in week 3.\n\nSOGC missed pill guidelines simplified in 2015. First-week missed pills are highest risk due to extending the hormone-free interval. The 7-day rule (backup for 7 days after any significant disruption) is the unifying principle. Extended or continuous regimens reduce missed-pill risk."
    difficulty: medium
    tags: [missed pill, OCP management, gynecology]
  - front: "What postpartum contraception options are available and when can they be started?"
    back: "Immediately postpartum: copper IUD or LNG-IUS (within 10 min of placenta delivery or within 48h). Progestin-only methods (POP, implant, DMPA): anytime postpartum. CHC (estrogen-containing): NOT before 21 days postpartum (VTE risk), not before 42 days if additional VTE risk factors. Breastfeeding: progestin-only preferred; CHC may reduce milk supply (avoid <6 weeks).\n\nSOGC recommends postpartum contraception counseling antenatally and before hospital discharge. Immediate postpartum IUD insertion has higher expulsion rates (10-20%) but improves contraception uptake. Ovulation can occur as early as 21 days postpartum in non-breastfeeding women."
    difficulty: medium
    tags: [postpartum contraception, breastfeeding, IUD timing, gynecology]
  - front: "What contraceptive counseling is needed for women with medical comorbidities?"
    back: "Epilepsy on enzyme-inducers: avoid CHC or use higher-dose, consider IUD/DMPA. Migraine with aura: no estrogen (IUD, POP, implant, DMPA). Diabetes: CHC acceptable if no vascular complications. HTN: progestin-only if uncontrolled. VTE history: no estrogen (IUD, POP, implant). Breast cancer: IUD copper only (no hormonal).\n\nSOGC uses WHO MEC criteria for medical eligibility. The copper IUD has no medical contraindications except active PID, uterine anomalies, or Wilson disease. LNG-IUS has fewer systemic effects than other hormonal methods. DMPA may decrease bone density with long-term use."
    difficulty: hard
    tags: [contraception comorbidities, WHO MEC, medical eligibility, gynecology]
  - front: "What are the non-contraceptive benefits of hormonal contraception?"
    back: "CHC: reduces dysmenorrhea, menorrhagia, acne, hirsutism, ovarian cysts, endometrial and ovarian cancer risk (50% reduction with 5 years use), PMS/PMDD. LNG-IUS: treats menorrhagia (90% reduction), endometrial hyperplasia protection, dysmenorrhea. DMPA: reduces endometriosis pain, menorrhagia, sickle cell crises.\n\nSOGC and CFPC guidelines encourage discussion of non-contraceptive benefits. Ovarian cancer risk reduction persists 30+ years after CHC discontinuation. LNG-IUS is first-line treatment for heavy menstrual bleeding per SOGC guidelines. Continuous OCP use eliminates withdrawal bleeding and associated symptoms."
    difficulty: medium
    tags: [non-contraceptive benefits, CHC, LNG-IUS, gynecology]
  - front: "What is the approach to contraception in adolescents?"
    back: "All methods are safe for adolescents. SOGC recommends LARC (IUD, implant) as first-line. Confidentiality is paramount-mature minor doctrine applies in most Canadian provinces. Dual protection (hormonal + condoms for STI prevention) recommended. DMPA: use with caution in <18 due to bone density effects. Emergency contraception: should be discussed proactively.\n\nCanadian law generally allows minors to consent to contraception without parental involvement if they understand the risks and benefits (mature minor doctrine). School-based health centres in many Canadian provinces provide contraception. SOGC emphasizes removing barriers to adolescent contraception access."
    difficulty: medium
    tags: [adolescent contraception, LARC, confidentiality, gynecology]
  - front: "What are the contraindications to IUD insertion (USMEC category 4)?"
    back: "Current pregnancy, current PID/STI (delay insertion), unexplained vaginal bleeding (investigate first), cervical/endometrial cancer, uterine cavity distortion. Copper IUD: Wilson disease\n\nHormonal IUD (Mirena/Kyleena): additional benefit of reduced menstrual bleeding. Can be inserted immediately postpartum or post-abortion. Nulliparity is NOT a contraindication. Expulsion rate 2-10%."
    difficulty: medium
    tags: [IUD, contraindications, contraception]
  - front: "What are the USMEC (or Canadian equivalent) categories for contraceptive eligibility?"
    back: "Category 1: no restriction. Category 2: advantages generally outweigh risks. Category 3: risks generally outweigh advantages (relative contraindication). Category 4: unacceptable health risk (absolute contraindication). SOGC uses WHO Medical Eligibility Criteria adapted for Canadian practice.\n\nMEC categories guide contraceptive prescribing in women with medical conditions. Key Category 4 examples for combined hormonal contraception: migraine with aura, VTE history, breast cancer, smoking >=15 cig/day if age >=35. Progestin-only methods have fewer Category 4 conditions."
    difficulty: easy
    tags: [MEC, contraceptive-eligibility, categories, WHO, SOGC]
  - front: "What are the contraindications to copper IUD and levonorgestrel IUD insertion?"
    back: "Both: current pregnancy, current PID/STI (treat first then insert), unexplained uterine bleeding (investigate first), uterine cavity distortion (large submucosal fibroids), cervical/endometrial cancer. Additional for LNG-IUD: current breast cancer (Category 4). Copper IUD: Wilson disease.\n\nSOGC guidelines emphasize that IUDs are safe for nulliparous women, adolescents, and immediately post-abortion. Past PID is NOT a contraindication. STI screening can be done at time of insertion without delaying placement. Quick start (same-day) insertion improves uptake."
    difficulty: medium
    tags: [IUD, contraindications, copper-IUD, LNG-IUD, SOGC]
  - front: "What are the emergency contraception options available in Canada and their time windows?"
    back: "Levonorgestrel 1.5 mg (Plan B): up to 72 hours, efficacy decreases with time. Ulipristal acetate 30 mg (Ella): up to 120 hours, maintains efficacy throughout. Copper IUD: up to 7 days post-unprotected intercourse, most effective method (>99%), can serve as ongoing contraception.\n\nSOGC recommends copper IUD as most effective EC. Ulipristal is more effective than levonorgestrel at 72-120 hours. Levonorgestrel is less effective in women >75 kg; ulipristal is less effective >90 kg — copper IUD preferred for higher BMI. Hormonal EC is available OTC in Canada."
    difficulty: medium
    tags: [emergency-contraception, Plan-B, ulipristal, copper-IUD, SOGC]
  - front: "What is the recommended timing for postpartum contraception initiation?"
    back: "IUD (copper or LNG): immediately post-placental or at 4-6 weeks. Progestin-only methods (POP, implant, DMPA): immediately postpartum regardless of breastfeeding. Combined hormonal contraception: avoid until 6 weeks postpartum (VTE risk) if breastfeeding, or 3 weeks if not breastfeeding and no VTE risk factors.\n\nSOGC guidelines emphasize that rapid-repeat pregnancy (<18 months interpregnancy interval) increases adverse outcomes. Immediate post-placental IUD insertion is safe and reduces loss to follow-up. Etonogestrel implant (Nexplanon) can be inserted before discharge. DMPA does not impair lactation."
    difficulty: medium
    tags: [postpartum-contraception, timing, breastfeeding, IUD, VTE-risk]
  - front: "A 38-year-old smoker (20 cigarettes/day) with migraines with aura requests contraception. What methods are appropriate?"
    back: "Combined hormonal methods (pill, patch, ring) are Category 4 (absolutely contraindicated) due to both migraine with aura AND smoking >15 cig/day at age >=35 — each independently is Category 4. Safe options: copper IUD, LNG-IUD, progestin-only pill, DMPA, etonogestrel implant.\n\nMigraine with aura increases ischemic stroke risk 2-4 fold; combined estrogen further increases this risk. SOGC and WHO MEC are clear that estrogen-containing methods are contraindicated. Progestin-only methods do not increase stroke risk. IUDs are first-line long-acting options for this patient."
    difficulty: medium
    tags: [migraine-with-aura, smoking, contraindication, estrogen, progestin-only]
  - front: "What is the 'quick start' method for initiating contraception?"
    back: "Start contraception on the day of the visit regardless of menstrual cycle day, after reasonably excluding pregnancy (negative urine hCG, no unprotected intercourse in past 14 days). Use backup method (condoms) for 7 days. Pregnancy test repeated in 3-4 weeks.\n\nSOGC supports quick start to reduce barriers and improve contraception uptake. Traditional advice to wait for next menses leads to interval pregnancies. Quick start applies to OCPs, patch, ring, DMPA, and implant. IUDs can also be inserted same-day with similar approach."
    difficulty: easy
    tags: [quick-start, contraception-initiation, same-day, barrier-reduction, SOGC]
  - front: "What are the advantages and counselling points for the etonogestrel subdermal implant (Nexplanon)?"
    back: "Advantages: >99% efficacy, lasts 3 years, rapid return to fertility, progestin-only (safe with estrogen contraindications), low maintenance. Counselling: irregular bleeding is the most common reason for removal (occurs in up to 30%), weight gain is minimal, no protection against STIs.\n\nSOGC recommends LARC (IUDs, implant) as first-line contraception for all women including adolescents. The implant has the lowest failure rate of any reversible method. Anticipatory counselling about bleeding pattern changes reduces dissatisfaction and early removal. Available in Canada since 2020."
    difficulty: easy
    tags: [Nexplanon, implant, LARC, progestin, counselling]
  - front: "A woman on combined OCP requires treatment with rifampin for latent TB. What contraceptive counselling is needed?"
    back: "Rifampin is a potent CYP3A4 inducer that significantly reduces OCP efficacy — this is a Category 3 interaction. Switch to a non-affected method: copper IUD, LNG-IUD, or DMPA (depot is adequate dose). If continuing OCP, use additional barrier method throughout treatment and for 28 days after stopping rifampin.\n\nSOGC and WHO MEC specifically address enzyme-inducing drug interactions. Rifampin is the strongest inducer and uniquely affects DMPA less. Other enzyme inducers (certain anticonvulsants: carbamazepine, phenytoin) also reduce efficacy. IUDs are unaffected by drug interactions and are preferred."
    difficulty: medium
    tags: [drug-interaction, rifampin, OCP, enzyme-inducer, contraceptive-failure]
  - front: "What is the SOGC recommendation on DMPA (Depo-Provera) and bone mineral density?"
    back: "DMPA is associated with decreased BMD (2-8% over 2 years), partially reversible after discontinuation. SOGC does not restrict use duration in adult women. In adolescents (<18), other methods preferred but DMPA acceptable if alternatives unsuitable. Routine DEXA scanning not recommended.\n\nHealth Canada issued a black box warning in 2005 regarding BMD loss, but SOGC and WHO concluded that benefits generally outweigh risks even for prolonged use. BMD loss stabilizes and partially recovers. No evidence of increased fracture risk has been demonstrated in epidemiologic studies."
    difficulty: medium
    tags: [DMPA, bone-density, Depo-Provera, adolescent, SOGC]
  - front: "What contraceptive options are safe for a woman with a history of VTE currently on anticoagulation?"
    back: "Safe options (Category 1-2): copper IUD, LNG-IUD, progestin-only pill, etonogestrel implant. Contraindicated (Category 4): all combined hormonal contraception (OCP, patch, ring). DMPA is Category 2-3 depending on guideline.\n\nEstrogen-containing methods increase VTE risk 3-4 fold and are absolutely contraindicated with VTE history. SOGC recommends LARC as first-line. LNG-IUD is not associated with systemic levels of progestin sufficient to affect coagulation. Copper IUD is the most evidence-based non-hormonal option."
    difficulty: medium
    tags: [VTE, contraception, estrogen-contraindicated, LARC, anticoagulation]
  - front: "What are the absolute contraindications to combined hormonal contraceptives (CHC)?"
    back: "1. <4 weeks postpartum if breastfeeding, or <21 days postpartum if not breastfeeding\n2. Major surgery with prolonged immobilization\n3. Known/suspected pregnancy\n4. Undiagnosed abnormal vaginal bleeding\n5. Prior thromboembolic events or thromboembolic disorders (Factor V Leiden mutation; protein C, S, or antithrombin III deficiency; active thrombophlebitis)\n6. Cerebrovascular or coronary artery disease\n7. Estrogen-dependent tumours (breast, uterus)\n8. Impaired liver function with acute liver disease\n9. Congenital hypertriglyceridemia\n10. Smoker age >35 yr\n11. Migraines with focal neurological symptoms (excluding aura)\n12. Uncontrolled HTN\n\nCombined hormonal contraceptives increase thrombotic risk due to estrogen. These absolute contraindications reflect situations where that additional risk is unacceptable. Smokers over 35 and those with migraines with aura have substantially elevated stroke risk. These align with Canadian and WHO Medical Eligibility Criteria (MEC) Category 4 conditions."
    difficulty: medium
    tags: [contraception, combined-OCP, contraindications, thromboembolism]
  - front: "A 38-year-old smoker requests combined oral contraceptive pills (OCP). What is the contraindication, and what alternative should be offered?"
    back: "Smoking at age >35 is an absolute contraindication to CHC due to markedly elevated risk of stroke and MI. Offer progestin-only methods (progestin-only pill, Depo-Provera, Nexplanon implant, or levonorgestrel IUS) as they have no estrogen-related thrombotic risk.\n\nThe combination of estrogen-containing contraceptives and smoking in women >35 yr creates a synergistic increase in arterial thrombotic events. Progestin-only contraceptives are safe in this population as progestins do not significantly increase arterial thrombotic risk."
    difficulty: easy
    tags: [contraception, smoking, combined-OCP, progestin-only]
  - front: "What are the advantages of combined oral contraceptive pills (OCPs) beyond contraception?"
    back: "Non-contraceptive benefits include:\n- Cycle regulation\n- Decreased dysmenorrhea and heavy menstrual bleeding (less anemia)\n- Decreased benign breast disease and ovarian cyst development\n- Decreased risk of ovarian and endometrial cancer\n- Increased cervical mucus (may lower STI risk)\n- Decreased PMS symptoms\n- Less acne\n- Possible osteoporosis protection\n\nOCPs suppress ovulation and regulate hormonal fluctuations, which confers protection against hormone-sensitive cancers and cycle-related symptoms. These benefits inform clinical decisions when recommending OCPs for non-contraceptive indications (e.g., dysmenorrhea, PCOS, endometriosis)."
    difficulty: easy
    tags: [contraception, OCP, non-contraceptive benefits]
  - front: "What drugs can decrease the efficacy of combined hormonal contraceptives (CHC), requiring use of a back-up method?"
    back: "Rifampin, phenobarbital, phenytoin, griseofulvin, primidone, and St. John's wort can decrease CHC efficacy via hepatic enzyme induction (CYP450 induction increases OCP metabolism).\n\nThese drugs induce hepatic cytochrome P450 enzymes, accelerating estrogen and progestin metabolism and reducing contraceptive blood levels below effective thresholds. Patients on these medications should use a barrier method or consider a non-hormonal IUD."
    difficulty: medium
    tags: [contraception, drug interactions, OCP, CYP450]
  - front: "What is the missed pill protocol for a combined OCP (e.g., Alesse) if 1 pill is missed within the first week of the cycle?"
    back: "Take 1 pill as soon as possible and continue taking 1 pill daily. Emergency postcoital contraception (EPC) may be necessary if unprotected intercourse occurred in the preceding week.\n\nMissing a pill in the first week is highest risk because the hormone-free interval just ended and ovulation suppression may be insufficient. EPC should be considered if unprotected sex occurred. Missing in weeks 2–3 requires taking the missed pill ASAP and continuing the pack without a hormone-free interval."
    difficulty: medium
    tags: [contraception, OCP, missed pill]
  - front: "What is the Slynd progestin-only pill (POP), and what is its key advantage over older POPs?"
    back: "Slynd contains 4 mg drospirenone (24 active + 4 placebo pills). Its key advantage is a 24-hour missed pill window, compared to the previous 3-hour window of older POPs (e.g., norethindrone). It is best for patients who need to avoid estrogen.\n\nThe longer missed-pill window improves adherence and reduces user error. Drospirenone has anti-androgenic and anti-mineralocorticoid properties. Slynd is suitable for breastfeeding women, those with hypertension, or those with contraindications to estrogen."
    difficulty: medium
    tags: [contraception, progestin-only, Slynd, drospirenone]
  - front: "Compare Mirena and Kyleena levonorgestrel IUS — which patients is each best suited for?"
    back: "Mirena IUS (LNG 52 mcg): best for patients with heavy or painful periods, parous patients; 20% amenorrhea rate; approved up to 8 years.\nKyleena IUS (LNG 19.5 mcg): best for nulliparous patients who want a light period monthly; primarily looking for birth control with lower hormone dose.\n\nMirena delivers a higher daily dose of levonorgestrel, leading to greater endometrial suppression and higher amenorrhea rates — ideal for menorrhagia. Kyleena's lower dose suits patients wanting lighter but persistent periods. Both are highly effective reversible long-acting contraceptives (LARCs)."
    difficulty: medium
    tags: [contraception, IUS, Mirena, Kyleena, levonorgestrel]
  - front: "What are the absolute contraindications to insertion of either a copper IUD or progesterone IUS?"
    back: "Absolute contraindications for BOTH:\n- Known or suspected pregnancy\n- Undiagnosed genital tract bleeding\n- Acute or chronic PID\n- Lifestyle risk for STIs\n- Known distorted uterine cavity\n- Immediately post-septic abortion\n\nAdditional for Copper IUS only:\n- Known allergy to copper or Wilson's disease\n\nIUS insertion in the setting of infection risks ascending infection and sepsis. An undisturbed uterine cavity is required for proper IUS positioning. Copper IUS is contraindicated with Wilson's disease due to impaired copper metabolism leading to systemic copper toxicity."
    difficulty: medium
    tags: [contraception, IUD, IUS, contraindications]
  - front: "What is the mechanism of action and success rate of Plan B (levonorgestrel) emergency postcoital contraception?"
    back: "Plan B (levonorgestrel 750 mcg q12h for 2 doses, or both together): suppresses ovulation, alters endometrium, affects sperm/ova transport. 75–95% effective if used within 24h. Can be used up to 5 days after unprotected intercourse. Less effective if weight >75 kg; not recommended if >80 kg.\n\nPlan B primarily works by delaying or preventing ovulation — it does not disrupt an established pregnancy. Efficacy decreases significantly with time. Body weight affects efficacy because the fixed dose results in lower serum levels in heavier individuals. Ulipristal or copper IUD should be considered in those over 75 kg."
    difficulty: easy
    tags: [contraception, emergency contraception, Plan B, levonorgestrel]
  - front: "What is ulipristal acetate (Ella) and how does it differ from Plan B for emergency contraception?"
    back: "Ulipristal (30 mg PO) is a selective progesterone receptor modulator (SPRM). It delays ovulation by up to 5 days. Used within 5 days of unprotected intercourse. After taking ulipristal, combined OCP must be delayed by 5 days due to mechanism of action. It is not less effective based on weight (unlike Plan B).\n\nUlipristal's antiprogestin activity allows it to delay ovulation even after the LH surge has begun, potentially making it more effective than Plan B when taken later. Concurrent progestins compete at the receptor, reducing ulipristal's efficacy — hence the delay before resuming hormonal contraception."
    difficulty: hard
    tags: [contraception, emergency contraception, ulipristal, SPRM]
  - front: "What is the most effective emergency postcoital contraception method and its time window?"
    back: "The copper IUD (postcoital IUD) is the most effective emergency contraception, with a 1% failure rate. It must be inserted within 7 days of unprotected intercourse. It prevents implantation via a foreign body reaction and sperm toxicity.\n\nThe copper IUD provides near-complete protection and has the added benefit of providing ongoing long-term contraception. It is the preferred option for patients >80 kg where levonorgestrel EPC has reduced efficacy. Cervical swabs for gonorrhea and chlamydia should be done prior to insertion."
    difficulty: easy
    tags: [contraception, emergency contraception, copper IUD]
  - front: "What is the Depo-Provera contraceptive, and what are its advantages and disadvantages?"
    back: "Depo-Provera: depot medroxyprogesterone acetate 150 mg IM every 12 weeks.\nAdvantages: suppresses ovulation, 70% amenorrhea after 1–2 years, does not affect breast milk, effective for dysmenorrhea.\nDisadvantages: irregular breakthrough bleeding, weight gain, controversial decreased bone density (often reversible), return to fertility may take up to 1–2 years.\nNot recommended for long-term use due to bone density concerns.\n\nDepo-Provera is highly effective and convenient (quarterly dosing). The delayed return to fertility (up to 2 years) is important to counsel patients who may desire pregnancy soon. Bone density concerns (reduced due to estrogen suppression) have led to recommendations against long-term use, particularly in adolescents."
    difficulty: easy
    tags: [contraception, Depo-Provera, DMPA, progestin-only]
  - front: "What is Nexplanon and what are its advantages and disadvantages as a contraceptive?"
    back: "Nexplanon: 4 cm etonogestrel 68 mg subdermal implant placed in inner arm; lasts up to 3 years.\nAdvantages: does not affect breast milk, no intrauterine placement needed, good bleeding and pain control, no change in bone density, quick return to fertility after removal.\nDisadvantages: irregular breakthrough bleeding, weight gain.\n\nNexplanon is one of the most effective reversible contraceptive methods (>99% efficacy). Unlike Depo-Provera, it does not suppress estrogen enough to cause bone density loss. It is an excellent option for patients wanting long-term contraception without intrauterine placement."
    difficulty: easy
    tags: [contraception, Nexplanon, etonogestrel, implant]
