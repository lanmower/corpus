# Neurology Peripheral Neuropathy (Neurology) - generated from srs-mccqe1
cards:
  - front: "What is carpal tunnel syndrome? List its symptoms, signs, risk factors, and diagnostic tests."
    back: "Compression of the median nerve in the carpal tunnel at the wrist.\n\nSymptoms: paresthesias in thumb, index, long finger, and lateral half of ring finger; decreased grip strength; nocturnal worsening.\n\nSigns:\n- Tinel's sign (tap over carpal tunnel → reproduces symptoms)\n- Phalen's test (wrist flexion for 30-60s → reproduces symptoms)\n- Thenar atrophy (late)\n\nRisk factors: pregnancy, DM, rheumatoid arthritis, acromegaly, hypothyroidism\n\nDiagnosis: clinical, confirmed by EMG/NCS\n\nCarpal tunnel syndrome is the most common mononeuropathy. NCS shows decreased amplitude (axonal) or decreased conduction velocity (demyelinating). The median nerve supplies the lateral 3.5 fingers (LOAF muscles: lumbricales 1&2, opponens pollicis, abductor pollicis brevis, flexor pollicis brevis). Treatment ranges from splinting and corticosteroids to surgical decompression."
    difficulty: easy
    tags: [carpal tunnel syndrome, median nerve, mononeuropathy, peripheral neuropathy, Tinel, Phalen]
  - front: "What is the approach to classifying peripheral neuropathies?"
    back: "1. Differentiate: motor vs. sensory vs. autonomic vs. mixed\n2. Pattern of deficit: symmetry; focal vs. diffuse; upper vs. lower limb; CN involvement\n3. Temporal pattern: acute vs. chronic; relapsing/remitting vs. progressive\n4. History: PMHx, FMHx, exposures (toxins, insects, travel), systemic symptoms\n5. Detailed peripheral neuro exam: LMN findings, differentiate root vs. peripheral nerve\n\nAxonal neuropathies: decreased amplitude on NCS\nDemyelinating neuropathies: decreased conduction velocity on NCS\n\nCommon patterns: radiculopathy (single dermatomal/myotomal deficit), plexopathy (multiple root territories), mononeuropathy (single nerve), mononeuropathy multiplex (multiple individual nerves, asymmetric, painful - think vasculitis), polyneuropathy (symmetric distal, stocking-glove)."
    difficulty: easy
    tags: [peripheral neuropathy, approach, classification, NCS, EMG]
  - front: "What is Erb's palsy and Klumpke's palsy? Which trunk of the brachial plexus is involved in each?"
    back: "Erb's palsy: Upper trunk injury (C5, C6)\n- Arm hangs at side, internally rotated, extended at elbow (waiter's tip position)\n- Loss of shoulder abduction, external rotation, elbow flexion, supination\n\nKlumpke's palsy: Lower trunk injury (C8, T1)\n- Loss of intrinsic hand muscles, finger flexors\n- Claw hand deformity\n- May have ipsilateral Horner syndrome (T1)\n\nCauses: birth trauma (obstetric), idiopathic neuritis, tumour infiltration, thoracic outlet syndrome\n\nErb's palsy from C5/C6 affects deltoid, biceps, brachioradialis. Klumpke's from C8/T1 affects intrinsic hand muscles. Obstetric brachial plexus injuries occur from excessive lateral head traction during delivery. Horner syndrome in Klumpke's indicates involvement of T1 sympathetic fibres."
    difficulty: medium
    tags: [brachial plexus, Erbs palsy, Klumpkes palsy, peripheral neuropathy, plexopathy]
  - front: "What is the most common cause of symmetrical polyneuropathy and what are the initial screening investigations?"
    back: "Most common cause: Diabetes mellitus (ischemic/axonal mechanism, chronic course, sensory-autonomic pattern).\n\nScreening lab tests:\n- Blood glucose / HbA1c / 2-hour OGTT\n- Serum vitamin B12\n- Serum protein electrophoresis (SPEP)\n- TSH\n- CBC, renal function (Cr, BUN, electrolytes)\n- Genetic testing for cryptogenic cases with hereditary phenotype\n\nDiabetic polyneuropathy is length-dependent (stocking-glove distribution), primarily sensory then autonomic, then motor. The pattern is symmetric, distal-predominant. Vitamin B12 deficiency and hypothyroidism are important treatable causes. CIDP is important immune-mediated cause (demyelinating, increased CSF protein)."
    difficulty: easy
    tags: [polyneuropathy, diabetes, peripheral neuropathy, investigations, B12]
  - front: "What is CIDP (Chronic Inflammatory Demyelinating Polyneuropathy)? How does it differ from GBS?"
    back: "CIDP: Chronic relapsing sensorimotor polyneuropathy or polyradiculopathy with:\n- Increased protein in CSF (without pleocytosis)\n- Demyelination on EMG/NCS\n- Fluctuating/relapsing course\n\nDifferences from GBS:\n- CIDP: chronic/relapsing course; GBS: acute onset (evolves over <4 weeks)\n- CIDP requires treatment to prevent relapse; GBS is monophasic\n\nTreatment of CIDP: First-line prednisone; alternatives: plasmapheresis, IVIG, azathioprine\n\nBoth are immune-mediated demyelinating neuropathies with albuminocytologic dissociation on CSF. GBS is acute and monophasic; CIDP is chronic and relapsing. In CIDP, unlike GBS, long-term immunosuppression is usually needed."
    difficulty: medium
    tags: [CIDP, GBS, demyelinating neuropathy, polyneuropathy, immunotherapy]
  - front: "What is Guillain-Barré Syndrome (GBS)? Describe its presentation, investigations, and treatment."
    back: "Acute (<4 weeks) demyelinating inflammatory polyradiculoneuropathy, often post-infectious.\n\nPresentation:\n- Sensory: distal symmetric paresthesias, loss of proprioception/vibration, neuropathic pain\n- Motor: weakness starting distally in legs, ascending proximally, areflexia\n- Autonomic: BP dysregulation, arrhythmias, bladder dysfunction\n- Respiratory failure (neurological emergency)\n\nInvestigations:\n- CSF: albuminocytologic dissociation (high protein, normal WBC)\n- EMG/NCS: conduction block, motor>sensory slowing, decreased F-wave, sural sparing\n\nTreatment: IVIG or plasmapheresis (equal efficacy), pain management, monitor vital capacity\n\nPrognosis: Peak symptoms 2-3 weeks; 5% mortality; 15% permanent deficits\n\nGBS is a neurological emergency due to risk of respiratory failure (monitor FVC). IVIG and plasmapheresis lead to faster recovery but do not change mortality or relapse rate. Preceding infections include Campylobacter jejuni (associated with axonal variant), CMV, EBV, and others."
    difficulty: easy
    tags: [GBS, Guillain-Barre, polyradiculoneuropathy, IVIG, plasmapheresis, respiratory failure]
  - front: "What is the Miller-Fisher variant of GBS and what is its classic triad?"
    back: "Miller-Fisher variant of GBS:\nClassic triad: Ophthalmoplegia + Ataxia + Areflexia\n\nAssociated with anti-GQ1b antibodies. Unlike classic GBS, weakness is predominantly cranial/ocular rather than ascending limb weakness.\n\nAnti-GQ1b antibodies are present in >90% of Miller-Fisher cases and can help confirm diagnosis. The condition is generally self-limiting with good prognosis. The triad is important to recognize as it can be confused with posterior fossa lesions or botulism."
    difficulty: medium
    tags: [Miller-Fisher, GBS, ophthalmoplegia, ataxia, areflexia, anti-GQ1b]
  - front: "What is mononeuropathy multiplex and what is the most important diagnostic consideration?"
    back: "Mononeuropathy multiplex: subacute involvement of multiple individual peripheral nerves in an asymmetric, non-length-dependent manner; often painful.\n\nMost important diagnostic consideration: vasculitis or collagen vascular disease (SLE, RA, PAN) causing nerve infarction.\n\nAlso consider: MMN (multifocal motor neuropathy), MADSAM, multiple compressive neuropathies, DM, sarcoidosis\n\nThe asymmetric, non-length-dependent, painful involvement of multiple individual nerves (as opposed to the symmetric distal pattern of polyneuropathy) is the hallmark. Vasculitis should always be ruled out as it is treatable. Nerve biopsy showing necrotizing arteritis confirms vasculitic neuropathy."
    difficulty: medium
    tags: [mononeuropathy multiplex, vasculitis, peripheral neuropathy, PAN, SLE]
  - front: "What common peripheral nerve entrapment neuropathies should be known, and where does each nerve get compressed?"
    back: "- Median nerve: carpal tunnel (at wrist) - most common; also at pronator teres (between heads)\n- Ulnar nerve: cubital tunnel syndrome (at elbow)\n- Radial nerve: spiral groove of humerus (Saturday night palsy)\n- Common peroneal nerve: neck of fibula (from crossing legs, surgical positioning)\n- Posterior tibial nerve: tarsal tunnel\n- Obturator nerve: childbirth\n\nRadial nerve palsy at the spiral groove causes wrist drop (loss of wrist/finger extension). Ulnar nerve palsy causes weakness of intrinsic hand muscles and clawing of 4th/5th fingers. Common peroneal palsy causes foot drop (loss of dorsiflexion and eversion). Site of compression determines which muscles are affected."
    difficulty: easy
    tags: [peripheral neuropathy, entrapment neuropathy, ulnar nerve, radial nerve, peroneal nerve, carpal tunnel]
