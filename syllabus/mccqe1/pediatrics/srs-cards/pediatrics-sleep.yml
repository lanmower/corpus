# Pediatrics Sleep (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "A 6-month-old infant wakes screaming, is inconsolable, has eyes open but appears disoriented, with signs of autonomic arousal. The episode occurs in the first third of the night. The parents report no memory of the event upon awakening. What is the diagnosis and management?"
    back: "Night terrors (pavor nocturnus). Management: parental reassurance, ensure child safety (especially if sleepwalking), identify pattern and wake child 15 minutes before typical episode to disrupt the sleep cycle. Condition often remits spontaneously before puberty.\n\nNight terrors arise from arousal from deep slow-wave (stage 4) sleep in the first third of the night and are characterized by abrupt arousal, screaming, autonomic signs, and no recall of the event. They differ from nightmares (REM sleep, child recalls dream, occurs in last third of night). Stress/anxiety can aggravate night terrors."
    difficulty: easy
    tags: [pediatrics, sleep disorders, night terrors, parasomnias]
  - front: "How do nightmares differ from night terrors in pediatrics regarding sleep stage, timing in the night, recall, and demographics?"
    back: "Nightmares: REM sleep, last third of night, child is alert upon awakening and clearly recalls a frightening dream, associated with daytime stress/anxiety, more common in boys aged 4–7 years. Night terrors: deep slow-wave (stage 4) sleep, first third of night, no memory of event, child disoriented if awakened.\n\nDistinguishing nightmares from night terrors is a classic MCCQE1 question. The sleep stage (REM vs slow-wave), timing (late vs early night), and recall (present vs absent) are the key differentiating features. Both are parasomnias but require different counselling to parents."
    difficulty: easy
    tags: [pediatrics, sleep disorders, nightmares, night terrors, parasomnias]
  - front: "What are the diagnostic criteria and epidemiology of obstructive sleep apnea (OSA) in children?"
    back: "OSA definition: partial or intermittent complete airway obstruction during sleep causing disrupted ventilation and sleep pattern. Epidemiology: affects 1–5% of preschool-aged children, more common in Black children. Polysomnography is gold standard for definitive diagnosis but not required to initiate treatment.\n\nIn children, OSA most commonly results from adenotonsillar hypertrophy. Clinical features include snoring/gasping during sleep and daytime irritability, tiredness, or hyperactivity (not sleepiness as in adults). Complications include cardiovascular (HTN, LV remodelling), growth, cognitive, and behavioural problems."
    difficulty: medium
    tags: [pediatrics, sleep disorders, OSA, obstructive sleep apnea]
  - front: "What is first-line management of OSA in children, and when is CPAP indicated?"
    back: "First-line: adenotonsillectomy and weight management. CPAP is indicated when adenotonsillectomy is contraindicated (cleft palate, bleeding disorder, acute tonsillitis), when there is minimal adenotonsillar tissue, or for residual OSA post-surgery. Intranasal corticosteroids are a temporizing measure for mild OSA.\n\nAdenotonsillectomy improves behaviour, quality of life, and polysomnographic findings in children with OSA, though it does NOT improve executive function or attention. Watchful waiting is acceptable in mild-moderate cases. Clinicians should also advise avoidance of pollutants, tobacco smoke, and allergens."
    difficulty: medium
    tags: [pediatrics, OSA, adenotonsillectomy, CPAP, sleep disorders]
  - front: "Describe the management approach to limit-setting sleep disorder versus sleep-onset association disorder in children."
    back: "Limit-setting sleep disorder (preschool+, due to bedtime resistance/caregiver inability to set rules): positive reinforcement, always sleep in own bed in dark/quiet room, avoid screens before bedtime, set strict bedtimes and wind-down routines, do not use bedroom for timeouts. Sleep-onset association disorder (infants/toddlers, child only falls asleep with specific associations): systematic ignoring and gradual extinction (e.g., Ferber method).\n\nSleep-onset association disorder occurs when a child learns to fall asleep only under specific conditions (breastfeeding, rocking, parent present) and cannot self-soothe when they wake. Behavioural interventions (extinction techniques) are evidence-based. Limit-setting disorder involves oppositional behaviour at bedtime requiring consistent routine reinforcement."
    difficulty: medium
    tags: [pediatrics, sleep disorders, behavioural management, limit setting, sleep association]
