  - front: "What medical treatments are used for gynecomastia?"
    back: "Correct underlying disorder, discontinue responsible drug, androgens for hypogonadism, anti-estrogens (tamoxifen has most evidence)\n\nMedical therapy targets the underlying hormonal imbalance."
