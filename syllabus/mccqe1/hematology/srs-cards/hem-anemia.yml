    back: "Cost, misleading in hemoglobinopathies, iron deficiency, hemolytic anemia, severe hepatic/renal disease, altered by ethnicity and aging\n\nHbA1C can be unreliable in various conditions affecting hemoglobin or red blood cell turnover."
    difficulty: medium
    tags: [endocrinology, diabetes, HbA1C, diagnosis, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the clinical triad of hemolytic uremic syndrome (HUS)?"
    back: "Microangiopathic hemolytic anemia, thrombocytopenia, and acute kidney injury\n\nHUS is characterized by the triad of hemolytic anemia, low platelets, and renal impairment, often following EHEC infection."
    difficulty: hard
    tags: [gastroenterology, hus, renal, hematology, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the mechanism of STEC-related HUS?"
    back: "Shiga toxin damages endothelial cells, causing microangiopathic hemolytic anemia, thrombocytopenia, and acute kidney injury\n\nShiga toxin from EHEC/STEC binds to endothelial cells in kidneys, causing endothelial damage that leads to the triad of HUS."
    difficulty: hard
    tags: [gastroenterology, ehec, hus, pathogenesis, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What are causes of secondary hemochromatosis?"
    back: "Parenteral iron overload (transfusions, hemodialysis, IV iron), excessive oral iron intake, other liver diseases (EtOH, NAFLD, viral hepatitis), iron-loading anemias (hemolytic, sideroblastic, aplastic, thalassemia major)\n\nSecondary hemochromatosis results from various conditions causing iron overload, often requiring chelation therapy rather than phlebotomy."
    difficulty: medium
    tags: [Hemochromatosis, etiology, secondary, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the causes of secondary hemochromatosis?"
    back: "Parenteral iron overload (transfusions, hemodialysis, IV iron), excessive oral iron intake, other liver diseases (EtOH, NAFLD, viral hepatitis), iron-loading anemias (thalassemia, sideroblastic), ineffective erythropoiesis\n\nSecondary hemochromatosis results from conditions that either add iron externally or cause ineffective erythropoiesis with increased intestinal absorption."
    difficulty: medium
    tags: [hemochromatosis, secondary, etiology, iron overload, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "List the causes of secondary hemochromatosis"
    back: "Parenteral iron overload (transfusions, hemodialysis, parenteral iron), excessive oral iron intake, other liver diseases (EtOH, NAFLD, viral hepatitis), iron-loading anemias (hemolytic, sideroblastic, aplastic, thalassemia major), ineffective erythropoiesis\n\nSecondary hemochromatosis results from conditions causing iron overload through repeated blood transfusions, excessive intake, or ineffective erythropoiesis driving increased iron absorption."
    difficulty: medium
    tags: [hemochromatosis, etiology, hepatology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the hallmark finding of sideroblastic anemia on bone marrow examination?"
    back: "Ring sideroblasts — iron deposits in mitochondria forming large, abnormal granules that encircle the nucleus of erythroid precursors.\n\nIn sideroblastic anemia, defects in heme biosynthesis cause iron to accumulate in mitochondria (which surround the nucleus), creating the ring sideroblast. This is the diagnostic hallmark distinguishing it from other causes of microcytic anemia."
    difficulty: easy
    tags: [sideroblastic anemia, ring sideroblasts, heme biosynthesis, bone marrow]
  - front: "What are the reversible causes of sideroblastic anemia?"
    back: "Drugs (isoniazid, chloramphenicol), alcohol, lead poisoning, copper deficiency, zinc toxicity, and hypothyroidism.\n\nReversible sideroblastic anemia results from acquired toxins or metabolic disturbances that disrupt heme biosynthesis. Identifying and removing the precipitating cause leads to resolution. Isoniazid is a classic MCCQE1 cause, as it inhibits pyridoxine (B6), a cofactor in heme synthesis."
    difficulty: easy
    tags: [sideroblastic anemia, reversible causes, isoniazid, alcohol, lead]
  - front: "What is the treatment for X-linked hereditary sideroblastic anemia?"
    back: "High-dose pyridoxine (vitamin B6) in some cases.\n\nX-linked sideroblastic anemia is caused by mutations in ALAS2, the pyridoxine-dependent enzyme initiating heme synthesis. High-dose B6 supplementation can partially correct the enzyme deficiency in pyridoxine-responsive patients. Median survival is approximately 10 years."
    difficulty: medium
    tags: [sideroblastic anemia, pyridoxine, X-linked, vitamin B6]
  - front: "In lead poisoning, at what blood lead level do symptoms typically appear, and what is the diagnostic threshold?"
    back: "Symptoms may appear at ≥50 µg/dL; diagnostic threshold is blood lead level >80 µg/dL.\n\nLead poisoning should be considered in any child with microcytic anemia living in a house built before 1977. Lead inhibits heme biosynthesis at multiple steps, causing sideroblastic (microcytic) anemia with basophilic stippling. The mnemonic LEAD describes key features: Lead lines, Encephalopathy, Abdominal colic/Anemia, Drops (wrist/foot drop)."
    difficulty: easy
    tags: [lead poisoning, blood lead level, microcytic anemia, children]
  - front: "What defines aplastic anemia and what are the key bone marrow findings?"
    back: "Destruction of hematopoietic cells leading to pancytopenia and a hypocellular bone marrow (<25% cellularity) with adipose tissue replacement and no evidence of malignant infiltration or fibrosis.\n\nAplastic anemia is a BM failure syndrome where pancytopenia results from loss of hematopoietic stem cells. The hypocellular marrow is the cornerstone diagnostic finding. Idiopathic aplastic anemia is commonly T-cell mediated. PNH is found in ~50% of aplastic anemia patients and must be excluded."
    difficulty: easy
    tags: [aplastic anemia, pancytopenia, bone marrow failure, hypocellular marrow]
  - front: "What are the causes of aplastic anemia?"
    back: "Congenital (Fanconi syndrome, Shwachman-Diamond, dyskeratosis congenita); acquired: idiopathic (T-cell mediated), ionizing radiation, drugs (dose-related: chemotherapy; idiosyncratic: chloramphenicol, antimalarials, phenylbutazone), toxins (benzene, DDT), viral infections (parvovirus B19, EBV, HBV, HHV6, HIV), autoimmune (SLE, GVHD), PNH, pregnancy, anorexia nervosa, thymoma.\n\nAplastic anemia has many causes. Idiosyncratic drug reactions (especially chloramphenicol) are classic exam causes. Parvovirus B19 targets erythroid precursors but also causes aplastic crises in patients with chronic hemolysis. Identifying the cause guides management."
    difficulty: medium
    tags: [aplastic anemia, etiology, Fanconi, chloramphenicol, parvovirus]
  - front: "What is the treatment for idiopathic aplastic anemia?"
    back: "Immunosuppressive therapy (horse or rabbit anti-thymocyte globulin + cyclosporine) for non-transplant candidates; allogeneic bone marrow transplant is potentially curative. Eltrombopag (TPO receptor agonist) is also effective. G-CSF and EPO are NOT effective.\n\nSince idiopathic aplastic anemia is T-cell mediated, immunosuppression with ATG + cyclosporine achieves 40-50% response. Allogeneic BMT is preferred in young patients with matched donors. Eltrombopag stimulates residual stem cells. Note that EPO and G-CSF are ineffective in aplastic anemia."
    difficulty: medium
    tags: [aplastic anemia, immunosuppression, ATG, bone marrow transplant, eltrombopag]
  - front: "What investigations differentiate intravascular from extravascular hemolysis?"
    back: "Intravascular: schistocytes on blood film, free Hb in serum, hemoglobinuria, hemosiderinuria (most sensitive delayed marker). Extravascular: positive direct Coombs (DAT) detecting IgG or complement on RBCs, spherocytes on film. Both share: elevated LDH, decreased haptoglobin, elevated unconjugated bilirubin, reticulocytosis.\n\nHaptoglobin mops up free Hb; it decreases in both types but more profoundly in intravascular hemolysis. Hemosiderinuria is the most sensitive delayed marker of intravascular hemolysis. The DAT is key for extravascular (immune) hemolysis. Schistocytes indicate mechanical RBC destruction (MAHA) — an intravascular process."
    difficulty: medium
    tags: [hemolytic anemia, intravascular, extravascular, Coombs test, haptoglobin, schistocytes]
  - front: "What does the direct antiglobulin test (DAT/direct Coombs) detect and when is it indicated?"
    back: "Detects IgG or complement bound to the surface of patient's RBCs. Indicated in: hemolytic disease of the newborn, autoimmune hemolytic anemia (AIHA), and hemolytic transfusion reactions.\n\nThe DAT adds anti-IgG or anti-complement antibody to the patient's washed RBCs; agglutination = positive. This identifies antibody-coated RBCs undergoing extravascular hemolysis. The indirect Coombs (IAT) detects antibodies in the patient's serum and is used for cross-matching and screening during pregnancy."
    difficulty: easy
    tags: [direct Coombs, DAT, AIHA, hemolytic anemia, transfusion reaction]
  - front: "What Hb electrophoresis pattern is diagnostic of β-thalassemia minor?"
    back: "Elevated HbA2 (3.5–5%; normal 1.5–3.5%). About 50% also have a slight increase in HbF.\n\nβ-thalassemia minor (trait) results from a single defective β-globin allele. Despite microcytosis (MCV <70 fL), anemia is mild (Hb 100–140 g/L). The compensatory increase in δ-chain synthesis raises HbA2, making it the specific diagnostic marker. No treatment is required; genetic counselling is essential."
    difficulty: easy
    tags: [beta-thalassemia minor, HbA2, hemoglobin electrophoresis, microcytic anemia]
  - front: "What are the key features and treatment of β-thalassemia major?"
    back: "Severe microcytic anemia (Hb <60 g/L) appearing at 6–12 months; HbF 90–100%, HbA 0–10%. Features: jaundice, gross hepatosplenomegaly, iron overload (hemochromatosis), stunted growth, 'hair-on-end' skull x-ray. Treatment: lifelong RBC transfusions, iron chelation (deferoxamine, deferasirox, deferiprone), folic acid, allogeneic BMT (curative).\n\nβ-thalassemia major (Cooley's anemia) is autosomal recessive — both β-globin alleles are defective. HbF persists as compensation. Iron overload from transfusions and ineffective erythropoiesis causes organ damage (ABCDI: Arrhythmia/cardiomyopathy, Bronze skin, Cirrhosis, Diabetes, Hypogonadism). Gene therapy (CRISPR-Cas9) is an emerging curative option."
    difficulty: medium
    tags: [beta-thalassemia major, iron overload, transfusion, iron chelation, hair-on-end]
  - front: "How does α-thalassemia severity relate to the number of defective α-globin genes?"
    back: "1 gene (aa/a-): silent carrier, normal Hb, normal MCV. 2 genes (aa/-- or a-/a-): normal Hb, decreased MCV. 3 genes (a-/--): HbH (β4) disease, decreased Hb, decreased MCV, splenomegaly. 4 genes (--/--): Hb Barts (γ4)/hydrops fetalis, usually incompatible with life.\n\nα-thalassemia results from deletions of α-globin genes (normally 4 copies). Cis 2-gene deletion (--/αα) is more common in Southeast Asia and increases risk of hydrops fetalis in offspring; trans deletion (α-/α-) is more common in Africa, with lower fetal risk. HbH disease is similar to β-thalassemia intermedia in management."
    difficulty: medium
    tags: [alpha-thalassemia, HbH, hydrops fetalis, globin gene, gene deletion]
  - front: "What is the molecular basis of sickle cell disease and which populations are most affected?"
    back: "Autosomal recessive Glu→Val substitution at position 6 of the β-globin chain (chromosome 11), producing HbS instead of HbA. Most common in Sub-Saharan African, Indian, Middle Eastern, and Mediterranean populations. HbS allele is thought to confer protection against malaria.\n\nSCD occurs when an individual is homozygous (HbSS) or compound heterozygous (HbS-β-thal, HbSC). At low pO2, deoxyHbS polymerizes into rigid rods that distort RBCs into the sickle shape, causing hemolysis and vaso-occlusion. Sickling is worsened by acidemia, increased CO2, 2,3-DPG, fever, and hyperosmolality."
    difficulty: easy
    tags: [sickle cell disease, HbS, beta-globin, vasoocclusion, pathophysiology]
  - front: "What are the four types of acute crises in sickle cell disease (HbSS)?"
    back: "1. Aplastic crisis — BM suppression (especially parvovirus B19) causing Hb drop. 2. Splenic sequestration crisis — acute Hb drop from massive splenic pooling (mainly in children). 3. Vaso-occlusive crisis — microcirculation infarction causing ischemia-reperfusion injury, pain, fever, leukocytosis. 4. Acute chest syndrome — fever/respiratory symptoms + new pulmonary infiltrate (precipitated by infection, fat emboli, pulmonary infarction).\n\nVaso-occlusive crises are the most common and are precipitated by infections, dehydration, temperature change, pregnancy, menses, and alcohol. Acute chest syndrome is a medical emergency with high mortality. Splenic sequestration occurs mainly in young children as adults develop functional asplenia from repeated infarctions."
    difficulty: medium
    tags: [sickle cell disease, vaso-occlusive crisis, aplastic crisis, acute chest syndrome, splenic sequestration]
  - front: "What is the mechanism of action of hydroxyurea in sickle cell disease and what are its major short-term adverse effects?"
    back: "Mechanism: inhibits repression of the fetal Hb γ-gene, increasing HbF production; HbF reduces polymerization and precipitation of HbS. Short-term adverse effects: dose-related leukopenia, thrombocytopenia, anemia, decreased reticulocyte count; decreased sperm production, mucositis, skin ulcers.\n\nHydroxyurea (hydroxycarbamide) is the cornerstone disease-modifying therapy for SCD. Increased HbF dilutes HbS and impairs sickling. RCT evidence (8 trials, 899 patients) shows significant reductions in pain crises, hospitalizations, acute chest syndrome, and need for transfusions. Long-term concerns include potential teratogenicity and cancer risk."
    difficulty: medium
    tags: [hydroxyurea, sickle cell disease, HbF, disease-modifying therapy]
  - front: "What vaccinations and prophylaxis are recommended in sickle cell disease to prevent infection?"
    back: "Vaccinations: S. pneumoniae, N. meningitidis, H. influenzae type b (in childhood). Prophylactic penicillin from age 3 months to 5 years.\n\nFunctional asplenia (from repeated infarction) in SCD markedly increases susceptibility to encapsulated organisms: S. pneumoniae (most common), H. influenzae, N. meningitidis, and Salmonella (osteomyelitis). Penicillin prophylaxis and vaccination are standard of care per Canadian guidelines."
    difficulty: easy
    tags: [sickle cell disease, functional asplenia, vaccination, penicillin prophylaxis, encapsulated organisms]
  - front: "What are the indications for exchange transfusion in sickle cell disease?"
    back: "SCD complications: acute chest syndrome, aplastic crises, hepatic or splenic sequestration, stroke; prevention of complications; and preoperative preparation.\n\nExchange transfusion rapidly reduces HbS percentage and replaces sickled cells with normal RBCs, avoiding the iron overload of simple transfusion. It is preferred over simple transfusion for serious acute complications like stroke and acute chest syndrome. The SWiTCH trial confirmed transfusions + chelation remain preferred for secondary stroke prevention in children."
    difficulty: medium
    tags: [sickle cell disease, exchange transfusion, acute chest syndrome, stroke, preoperative]
  - front: "How does warm AIHA differ from cold AIHA in antibody type, Coombs result, and first-line management?"
    back: "Warm (75-90%): IgG antibody, agglutination at 37°C, DAT positive for IgG ± complement; first-line = corticosteroids. Cold: IgM antibody, agglutination at 4°C, DAT positive for complement only; first-line = avoid cold + rituximab-based regimen.\n\nWarm AIHA is often primary or secondary to autoimmune disease (SLE), lymphoproliferative disorders, or drugs (penicillin, methyldopa). Cold agglutinin disease is associated with Mycoplasma pneumoniae, EBV, and CLL. Blood film shows spherocytes in warm AIHA and RBC agglutination clumps in cold AIHA."
    difficulty: medium
    tags: [AIHA, warm AIHA, cold AIHA, Coombs, corticosteroids, rituximab]
  - front: "What conditions cause microangiopathic hemolytic anemia (MAHA)/TMA, and what is the key blood film finding?"
    back: "Schistocytes on blood film (mechanical RBC fragmentation). Causes: TTP, HUS, aHUS, DIC, eclampsia/HELLP, malignant hypertension, vasculitis, malfunctioning heart valves, metastatic carcinoma, drugs (calcineurin inhibitors, quinine, simvastatin), catastrophic APS, severe infections (CMV, meningococcus).\n\nMAHA results from fibrin or platelet thrombi in small vessels shearing RBCs into schistocytes. Unlike immune hemolysis, the DAT (Coombs) is negative in MAHA. Recognizing the TMA pentad (MAHA + thrombocytopenia + renal failure + fever + neurological changes) should prompt urgent investigation for TTP."
    difficulty: medium
    tags: [MAHA, TMA, schistocytes, TTP, HUS, DIC, Coombs negative]
  - front: "What is the genetic basis of hereditary spherocytosis and what are its key diagnostic features?"
    back: "Autosomal dominant (variable penetrance) abnormality in RBC membrane proteins (e.g. spectrin), causing spherocytes with elevated MCHC, increased osmotic fragility, splenomegaly, jaundice, and pigmented gallstones.\n\nHereditary spherocytosis is the most common hereditary hemolytic anemia. Spectrin deficiency leads to loss of RBC membrane lipids, creating rigid spheres with decreased deformability that are destroyed in the spleen. Splenectomy is effective in severe cases but deferred in early childhood; pre-splenectomy vaccination against pneumococcus, meningococcus, and H. influenzae is mandatory."
    difficulty: easy
    tags: [hereditary spherocytosis, spectrin, osmotic fragility, MCHC, splenectomy]
  - front: "What triggers hemolysis in G6PD deficiency and what are the key blood film findings?"
    back: "Triggers: oxidative stress, drugs (sulfonamides, antimalarials, nitrofurantoin), infections, and fava beans. Blood film: Heinz bodies (denatured Hb clumps) and bite cells (oxidative hemolysis marker).\n\nG6PD deficiency (X-linked recessive; common in African, Asian, Mediterranean populations) impairs the pentose phosphate pathway, reducing glutathione and increasing RBC oxidative damage. G6PD assay should not be done during acute crisis as reticulocytes (high G6PD) give false-normal results. Management: stop offending agent, avoid triggers, transfuse in severe cases."
    difficulty: medium
    tags: [G6PD deficiency, Heinz bodies, bite cells, oxidative hemolysis, X-linked]
  - front: "What distinguishes megaloblastic from non-megaloblastic macrocytic anemia on blood film?"
    back: "Megaloblastic: large oval macrocytes (ovalocytes) + hypersegmented neutrophils (≥5 lobes); pathophysiology = failure of DNA synthesis causing asynchronous nuclear-cytoplasmic maturation. Non-megaloblastic: large round macrocytes without hypersegmented neutrophils; reflects membrane abnormality/abnormal cholesterol metabolism (e.g. alcohol, liver disease, hypothyroidism).\n\nKey megaloblastic causes: B12 deficiency, folate deficiency, drugs (methotrexate, hydroxyurea, AZT). Non-megaloblastic causes include the ABCDEF mnemonic: Alcoholism/liver disease, B12 deficiency (early), Compensatory reticulocytosis, Drugs/Dysplasia (MDS), Endocrine (hypothyroidism), Folate deficiency/Fetus (pregnancy). MDS is a non-megaloblastic macrocytic anemia with oval macrocytosis and hypolobated neutrophils."
    difficulty: medium
    tags: [megaloblastic anemia, macrocytic anemia, hypersegmented neutrophils, B12, folate]
  - front: "What are the neurological manifestations of vitamin B12 deficiency?"
    back: "Peripheral neuropathy (symmetrical, legs > arms); subacute combined degeneration of the spinal cord (posterior columns: loss of vibration/proprioception/2-point discrimination; pyramidal tracts: spastic weakness, ataxia); cerebral (confusion, delirium, dementia — reversible with B12); rare cranial nerve involvement (optic atrophy).\n\nB12 is essential for myelin synthesis. Neurological damage from B12 deficiency can occur even without significant anemia and may be irreversible if untreated (spinal cord damage). Treating with folate alone (without B12) when both are deficient can correct the anemia but allow neurological deterioration to continue — a critical MCCQE1 concept."
    difficulty: medium
    tags: [B12 deficiency, subacute combined degeneration, posterior columns, neuropathy, pernicious anemia]
  - front: "What is the pathophysiology and diagnostic investigation for pernicious anemia?"
    back: "Pernicious anemia: auto-antibodies against intrinsic factor (IF) or gastric parietal cells → achlorhydria + lack of IF → decreased ileal absorption of B12. Investigations: anti-parietal cell Ab (more sensitive), anti-intrinsic factor Ab (more specific), elevated gastrin, upper endoscopy (atrophic gastritis; screen for gastric malignancy).\n\nPernicious anemia is the most common cause of B12 deficiency in adults. Auto-antibodies destroy parietal cells, reducing both acid secretion and IF. IF is required to bind B12 for absorption in the terminal ileum. Associated with other autoimmune conditions (polyglandular insufficiency). Most common in Northern European White populations, median age 60."
    difficulty: medium
    tags: [pernicious anemia, intrinsic factor, B12 deficiency, anti-parietal cell, atrophic gastritis]
  - front: "What is the treatment for vitamin B12 deficiency and what electrolyte complication must be monitored?"
    back: "Treatment: B12 1000–1200 µg PO daily (if absorption intact) or 1000 µg IM weekly. Maintenance: 1000 µg PO daily or 1000 µg IM monthly. Monitor for hypokalemia and rebound thrombocytosis when treating severe megaloblastic anemia.\n\nRapid erythropoiesis with B12 treatment causes high potassium uptake into new RBCs, precipitating hypokalemia. Rebound thrombocytosis can occur as megakaryocyte production normalizes. Route depends on the underlying cause: IM is required when GI absorption is impaired (pernicious anemia, ileal disease)."
    difficulty: medium
    tags: [B12 deficiency treatment, cyanocobalamin, hypokalemia, thrombocytosis, IM injection]
  - front: "What are the main causes of folate deficiency and why is folate deficiency dangerous in pregnancy?"
    back: "Causes: poor diet/alcohol use, malabsorption (celiac, IBD), drugs (methotrexate, phenytoin, trimethoprim, pyrimethamine, OCP, alcohol), increased demand (pregnancy, hemolysis, prematurity, hemodialysis, exfoliative dermatitis). Maternal folate deficiency causes fetal neural tube defects.\n\nUnlike B12 (stored 3–4 years), folate stores deplete within 3–6 months. Folate is essential for DNA synthesis and neural tube closure. Canadian guidelines recommend folate 0.4–1 mg/day pre-conception and in first trimester (higher dose 4–5 mg for high-risk women). Treatment: folic acid 1–5 mg PO daily x 1–4 months."
    difficulty: easy
    tags: [folate deficiency, neural tube defect, pregnancy, methotrexate, megaloblastic anemia]
  - front: "What monitoring is recommended for patients with sickle cell disease?"
    back: "Regular CBC, reticulocytes, iron indices, BUN, LFTs, creatinine; urinalysis annually (proteinuria/glomerulopathy); transcranial Doppler annually until age 16 (stroke prevention); retinal exams annually from age 8 (retinopathy); echocardiography once in late childhood/early adulthood (pulmonary hypertension).\n\nSystematic screening prevents SCD complications. Transcranial Doppler detects elevated cerebral blood flow velocity (>200 cm/s) indicating stroke risk — these patients benefit from regular transfusion therapy. Retinal screening detects proliferative retinopathy (more common in HbSC). Pulmonary hypertension is a major cause of death in adults with SCD."
    difficulty: medium
    tags: [sickle cell disease, monitoring, transcranial Doppler, retinopathy, pulmonary hypertension]
  - front: "What is the significance of cis vs. trans α-globin gene deletions in α-thalassemia?"
    back: "Cis 2-gene deletion (--/αα) is more common in Southeast Asia and creates risk of offspring inheriting 4-gene deletion (hydrops fetalis/Hb Barts) if partner is also a carrier. Trans 2-gene deletion (α-/α-) is more common in Africa and has lower risk of producing severely affected offspring.\n\nIn cis deletion, both genes are absent from one chromosome; a carrier can pass the chromosome with no α genes to offspring. If both parents carry cis deletions, there is a 1 in 4 chance of Hb Barts (4-gene deletion = lethal). Trans deletions distribute the deleted genes across two chromosomes, making 4-gene deletion in offspring much less likely."
    difficulty: hard
    tags: [alpha-thalassemia, cis deletion, trans deletion, hydrops fetalis, genetic counselling]
  - front: "What is HbSC disease and how does it differ from HbSS?"
    back: "HbSC disease: compound heterozygote with one HbS allele and one HbC allele; most common compound heterozygote SCD. Milder anemia than HbSS; similar complications but less frequent — EXCEPT proliferative sickle cell retinopathy, glomerulonephritis, and avascular necrosis are comparably prevalent. Spleen may not be atrophic in adults.\n\nHbSC occurs in approximately 1 in 833 African-American live births. HbC (Glu→Lys at position 6) has less polymerization tendency than HbS. The milder clinical course can lead to delayed diagnosis. Ophthalmic complications are notably as severe or worse than HbSS, making regular retinal screening essential."
    difficulty: medium
    tags: [HbSC disease, sickle cell, compound heterozygote, retinopathy, avascular necrosis]
