# General (ENT) - generated from srs-mccqe1
cards:
  - front: "What is the definition of hearing impairment?"
    back: "A raised hearing threshold measured as decibels of hearing loss relative to the normal population at specific frequencies\n\nHearing disability is hearing impairment that interferes with performing daily tasks."
    difficulty: easy
    tags: [hearing, otolaryngology, definitions, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the difference between conductive and sensorineural hearing loss?"
    back: "Conductive: external sound does not reach inner ear; Sensorineural: involves inner ear, cochlea, or auditory nerve\n\nRinne and Weber tuning fork tests help distinguish between these types."
    difficulty: easy
    tags: [hearing loss, otolaryngology, clinical skills, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the urgent treatment for unexplained unilateral sudden sensorineural hearing loss?"
    back: "Steroids\n\nPrompt treatment with steroids may improve hearing outcomes in sudden sensorineural hearing loss."
    difficulty: easy
    tags: [hearing loss, otolaryngology, emergency, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "When should a patient with headache be referred to ENT specialist?"
    back: "For serious otolaryngological causes of headache or sudden sensorineural hearing loss\n\nENT evaluation is needed when headache origins may be from ear, nose, or throat pathology."
    difficulty: medium
    tags: [headache, referral, otolaryngology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the purpose of Rinne and Weber tuning fork tests?"
    back: "To distinguish conductive from sensorineural hearing loss\n\nRinne tests air vs bone conduction. Weber lateralizes to the affected ear in conductive loss or the normal ear in sensorineural loss."
    difficulty: medium
    tags: [hearing, clinical skills, otolaryngology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "When should an MRI be considered for hearing loss?"
    back: "Progressive asymmetric sensorineural hearing loss to exclude vestibular schwannoma (acoustic neuroma)\n\nMRI is indicated when there is asymmetric or progressive hearing loss to rule out vestibular schwannoma, which can be managed conservatively, surgically, or with radiation."
    difficulty: medium
    tags: [hearing, investigations, otolaryngology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the types of tuning fork tests and their purpose?"
    back: "Rinne test (compares air vs bone conduction) and Weber test (lateralization) - used to distinguish conductive from sensorineural hearing loss\n\nIn conductive loss, bone conduction > air conduction (Rinne negative). In Weber test, sound lateralizes to the affected ear in conductive loss and to the normal ear in sensorineural loss."
    difficulty: medium
    tags: [hearing, clinical skills, otolaryngology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the prevalence of hearing impairment by age group?"
    back: "6% of 35-44 year olds, 43% of 65-84 year olds\n\nPrevalence increases dramatically with age - 6% in middle-aged adults vs 43% in older adults."
    difficulty: easy
    tags: [Hearing, Epidemiology, ENT, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What percentage of age-related hearing loss (presbycusis) is sensorineural?"
    back: "90%\n\n90% of presbycusis (age-related hearing loss) is sensorineural in nature."
    difficulty: easy
    tags: [Hearing, Presbycusis, ENT, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What do Rinne and Weber tuning fork tests distinguish?"
    back: "Conductive vs sensorineural hearing loss\n\nRinne and Weber tests are tuning fork tests used to differentiate between conductive and sensorineural hearing loss."
    difficulty: easy
    tags: [Hearing, Assessment, ENT, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the management for sudden sensorineural hearing loss?"
    back: "Patients with unexplained, unilateral, sudden sensorineural hearing loss should be treated urgently with steroids and referred to ENT."
    difficulty: medium
    tags: [Hearing, Management, ENT, Emergency, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "When is MRI indicated in hearing loss evaluation?"
    back: "Progressive asymmetric sensorineural hearing loss to exclude vestibular schwannoma (acoustic neuroma)\n\nMRI is considered for progressive asymmetric sensorineural hearing loss to rule out vestibular schwannoma."
    difficulty: medium
    tags: [Hearing, Investigations, ENT, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "When should patients with hearing loss be referred to ENT?"
    back: "Unknown etiology, or sudden sensorineural hearing loss\n\nRefer to ENT specialist when etiology is unknown or for sudden sensorineural hearing loss requiring ongoing care."
    difficulty: easy
    tags: [Hearing, Referral, ENT, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
