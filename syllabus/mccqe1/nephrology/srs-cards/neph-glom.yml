# Glomerulonephritis & Nephrotic Syndrome (Nephrology) - generated from srs-mccqe1
cards:
  - front: "A 5-year-old boy develops periorbital edema, massive proteinuria (>3.5 g/day), hypoalbuminemia, and hypercholesterolemia after an URI. What is the diagnosis and treatment?"
    back: "Minimal change disease (MCD) presenting as nephrotic syndrome in a child; first-line treatment is oral prednisone (60 mg/m2/day or 2 mg/kg/day) — expect complete remission in 80-90%\n\nMCD is the most common cause of nephrotic syndrome in children. Responds dramatically to steroids. Lipoid nephrosis is another term. Diagnosis: clinical response to steroids; biopsy only if steroid-resistant or atypical features."
    difficulty: medium
    tags: [minimal change disease, nephrotic syndrome, children, prednisone, nephrology]
  - front: "What are the clinical features of nephrotic syndrome vs. nephritic syndrome?"
    back: "Nephrotic: massive proteinuria (>3.5 g/day), hypoalbuminemia (<25 g/L), edema, hyperlipidemia, lipiduria — no hematuria; Nephritic: hematuria (RBC casts), proteinuria (less massive), hypertension, oliguria, AKI\n\nNephrotic causes: MCD, FSGS, membranous nephropathy, diabetic nephropathy, amyloid. Nephritic causes: IgA nephropathy, post-streptococcal GN, anti-GBM disease, ANCA vasculitis, lupus nephritis."
    difficulty: easy
    tags: [nephrotic syndrome, nephritic syndrome, proteinuria, hematuria, nephrology]
  - front: "A 35-year-old has hypertension, microscopic hematuria, and mild proteinuria. Renal biopsy shows IgA deposits in mesangium. Diagnosis and prognosis?"
    back: "IgA nephropathy (Berger disease) — most common primary GN worldwide; 20-30% progress to ESKD over 20-30 years; high-risk features: persistent hypertension, heavy proteinuria, elevated creatinine\n\nCKD Canada/KDIGO KDIGO 2021 guidelines: ACEi/ARB for proteinuria >500 mg/day, blood pressure control. Targeted release budesonide (Nefecon) approved for high-risk IgA nephropathy. Sparsentan (dual endothelin/AT1 blocker) reduces proteinuria."
    difficulty: hard
    tags: [IgA nephropathy, Berger disease, hematuria, proteinuria, nephrology]
  - front: "A 60-year-old presents with hemoptysis and hematuria. ANCA (MPO-ANCA/p-ANCA) is positive. Renal biopsy shows pauci-immune crescentic GN. Diagnosis and treatment?"
    back: "Microscopic polyangiitis or granulomatosis with polyangiitis (Wegener) — ANCA vasculitis; treat with pulse IV methylprednisolone + cyclophosphamide (or rituximab) induction, then azathioprine maintenance\n\nANCA-associated vasculitis (AAV) requires immediate immunosuppression to preserve kidney function. PR3-ANCA (c-ANCA) = GPA; MPO-ANCA (p-ANCA) = MPA or eosinophilic GPA (eGPA). Plasma exchange added for dialysis-dependent or pulmonary hemorrhage."
    difficulty: hard
    tags: [ANCA vasculitis, GPA, MPA, crescentic GN, cyclophosphamide, nephrology]
  - front: "A 25-year-old woman with SLE has proteinuria 4g/day, RBC casts, and low complement. Renal biopsy shows diffuse proliferative GN (Class IV lupus nephritis). Treatment?"
    back: "Class III/IV lupus nephritis: mycophenolate mofetil (MMF) or cyclophosphamide induction + high-dose corticosteroids; MMF + belimumab or voclosporin as newer combination approach\n\nISN/RPS classification: Class III (focal) and IV (diffuse) LN require immunosuppressive induction. MMF has equivalent efficacy and better tolerability than cyclophosphamide for most patients. Maintenance: MMF + hydroxychloroquine + low-dose steroids."
    difficulty: hard
    tags: [lupus nephritis, SLE, MMF, Class IV LN, nephrology]
  - front: "A 55-year-old man has nephrotic syndrome with proteinuria 8g/day and subepitheial deposits on electron microscopy. Serology negative. Diagnosis and treatment?"
    back: "Membranous nephropathy; 30% spontaneous remission; treat high-risk patients (persistent heavy proteinuria, declining GFR) with rituximab (preferred) or cyclophosphamide-based regimen\n\nMembranous nephropathy: most common cause of nephrotic syndrome in adults >50. 80% have PLA2R antibodies. Rituximab has replaced older regimens. Check for secondary causes (malignancy, infections, drugs, lupus) before assuming primary."
    difficulty: hard
    tags: [membranous nephropathy, nephrotic syndrome, PLA2R, rituximab, nephrology]
  - front: "What is post-streptococcal glomerulonephritis (PSGN) and when does it occur?"
    back: "PSGN: immune complex GN occurring 1-3 weeks after group A strep pharyngitis or 3-6 weeks after strep skin infection; presents with hematuria, edema, hypertension, low C3\n\nPSGN is most common in children. Diagnosis: low serum C3, elevated ASO titer, throat/skin culture. Renal biopsy not usually required. Treatment: supportive (diuretics, antihypertensives); antibiotics to eradicate strep but do not prevent GN. Prognosis excellent in children."
    difficulty: medium
    tags: [post-streptococcal GN, PSGN, low complement, hematuria, strep infection, nephrology]
  - front: "What distinguishes nephrotic from nephritic syndrome?"
    back: "Nephrotic: proteinuria>3.5g/d, hypoalbuminemia, edema, hyperlipidemia. Nephritic: hematuria/RBC casts, mild proteinuria, HTN\n\nNephrotic: minimal change(kids), membranous, FSGS. Nephritic: IgA, post-strep GN, lupus, ANCA."
    difficulty: medium
    tags: [nephrotic, nephritic]
  - front: "What are the key features distinguishing nephrotic from nephritic syndrome?"
    back: "Nephrotic: proteinuria >3.5 g/day, hypoalbuminemia, edema, hyperlipidemia, lipiduria (oval fat bodies, maltese crosses). Nephritic: hematuria (RBC casts), mild-moderate proteinuria (<3.5g), hypertension, oliguria, elevated Cr, edema.\n\nNephrotic syndrome reflects podocyte damage (increased glomerular permeability to protein). Nephritic syndrome reflects glomerular inflammation with basement membrane disruption. Some GN presents with nephrotic-nephritic overlap (e.g., membranoproliferative GN, lupus nephritis). Renal biopsy is usually required for definitive diagnosis."
    difficulty: medium
    tags: [glomerulonephritis, nephrotic, nephritic, proteinuria, hematuria, nephrology]
  - front: "What are the major causes of nephrotic syndrome in adults?"
    back: "Membranous nephropathy (#1 primary in adults — anti-PLA2R antibodies), focal segmental glomerulosclerosis (FSGS — #1 in Black patients), minimal change disease (MCD — #1 in children, responds to steroids), diabetic nephropathy (#1 secondary), amyloidosis, lupus\n\nWorkup: 24h urine protein or spot uACR, serum albumin, lipids, complement levels (C3/C4), ANA, anti-dsDNA, hepatitis B/C, HIV, PLA2R antibody, SPEP/UPEP (amyloid/myeloma). Complications: thromboembolism (renal vein thrombosis especially in membranous), infection, AKI, hyperlipidemia."
    difficulty: hard
    tags: [glomerulonephritis, nephrotic, membranous, FSGS, MCD, nephrology]
  - front: "What are the major causes of nephritic syndrome (glomerulonephritis)?"
    back: "Post-infectious GN (post-streptococcal — low C3, normal C4), IgA nephropathy (most common GN worldwide — episodic hematuria with URI), lupus nephritis (low C3 and C4), anti-GBM disease (Goodpasture — linear IgG on IF), ANCA vasculitis (GPA, MPA — pauci-immune on IF)\n\nComplement levels help narrow differential: Low C3 only: post-infectious, MPGN (C3 glomerulopathy). Low C3+C4: lupus, cryoglobulinemia. Normal complement: IgA, ANCA, anti-GBM. ANCA pattern: c-ANCA/PR3 = GPA (Wegener); p-ANCA/MPO = MPA. Rapidly progressive GN (RPGN) with crescents requires urgent biopsy and treatment."
    difficulty: hard
    tags: [glomerulonephritis, nephritic, IgA, ANCA, lupus, anti-GBM, nephrology]
  - front: "What is IgA nephropathy and how is it managed?"
    back: "Most common primary GN worldwide. Presents with episodic gross hematuria 1-2 days after URI ('synpharyngitic'), persistent microscopic hematuria, mild proteinuria. Biopsy: mesangial IgA deposits. Management: ACEi/ARB (all), SGLT2i, +corticosteroids if proteinuria >1g/day despite 3 months of optimized RAAS blockade.\n\nIgA nephropathy has variable prognosis: 20-40% progress to ESKD over 20 years. TESTING study showed targeted-release budesonide (Nefecon/Tarpeyo) reduces proteinuria. Fish oil (omega-3) is controversial. Tonsillectomy not recommended routinely (may be considered in Japan). Oxford MEST-C scoring on biopsy guides prognosis."
    difficulty: hard
    tags: [glomerulonephritis, IgA nephropathy, hematuria, ACEi, SGLT2i, nephrology]
  - front: "What is rapidly progressive glomerulonephritis (RPGN) and what are its causes?"
    back: "RPGN: loss of >50% renal function over days-weeks with crescent formation on biopsy. Type I: anti-GBM (linear IF). Type II: immune complex (granular IF — lupus, post-infectious, IgA). Type III: pauci-immune (ANCA — GPA, MPA, EGPA). All require urgent biopsy and treatment.\n\nRPGN is a nephrological emergency. Treatment: Type I (anti-GBM): cyclophosphamide + steroids + plasma exchange. Type II: treat underlying disease. Type III (ANCA): cyclophosphamide (or rituximab) + steroids ± plasma exchange. Delay reduces renal survival. Dialysis-dependent at presentation has poor renal prognosis, especially anti-GBM."
    difficulty: hard
    tags: [glomerulonephritis, RPGN, crescentic, anti-GBM, ANCA, emergency, nephrology]
  - front: "What is membranous nephropathy and how is it managed?"
    back: "Nephrotic syndrome with subepithelial immune deposits (spike and dome on EM). Primary (70%): anti-PLA2R antibodies. Secondary: hepatitis B, lupus, malignancy, NSAIDs. Rule of thirds: 1/3 spontaneous remission, 1/3 persistent proteinuria, 1/3 progressive CKD.\n\nAnti-PLA2R positive + typical biopsy = primary membranous (no malignancy workup needed). PLA2R-negative: search for secondary causes. Treatment: observe 6 months if low risk. High risk (declining GFR, heavy proteinuria): rituximab (first-line per MENTOR trial), or cyclophosphamide + steroids (Ponticelli regimen), or calcineurin inhibitors."
    difficulty: hard
    tags: [glomerulonephritis, membranous, PLA2R, rituximab, nephrotic, nephrology]
  - front: "What is the typical presentation and management of minimal change disease?"
    back: "Children (most common cause of nephrotic syndrome): sudden-onset nephrotic syndrome after viral illness. Normal complement. Biopsy: normal light microscopy, podocyte foot process effacement on EM. Treatment: prednisone 1mg/kg (max 80mg) x 4-6 weeks then taper. >90% respond to steroids.\n\nMCD in adults: biopsy required (cannot assume diagnosis like in children). Relapses common (50% of children). Frequent relapsers: add steroid-sparing agent (cyclophosphamide, calcineurin inhibitor, rituximab, mycophenolate). AKI can occur (especially in elderly with MCD — possible from tubular injury). Always rule out NSAIDs and lymphoma as secondary causes."
    difficulty: hard
    tags: [glomerulonephritis, minimal change, nephrotic, children, steroids, nephrology]
  - front: "What is lupus nephritis classification and management?"
    back: "ISN/RPS classification (I-VI based on biopsy): Class I-II (mesangial): mild, observe. Class III (focal proliferative) & IV (diffuse proliferative): aggressive — induction with mycophenolate or cyclophosphamide + steroids. Class V (membranous): if proteinuric, add immunosuppression. Class VI (sclerotic): supportive.\n\nAll SLE patients should be screened for nephritis (urinalysis, Cr, urine protein). Proliferative nephritis (III/IV) is the most serious — requires prompt biopsy and treatment. Maintenance: mycophenolate (preferred) or azathioprine for 3-5 years minimum. Belimumab and voclosporin are newer additions for lupus nephritis."
    difficulty: hard
    tags: [glomerulonephritis, lupus nephritis, ISN/RPS, mycophenolate, cyclophosphamide, nephrology]
  - front: "What renal biopsy immunofluorescence patterns correspond to which diseases?"
    back: "Linear IgG: anti-GBM disease. Granular IgG: immune complex GN (lupus, post-infectious, membranous). Mesangial IgA: IgA nephropathy, Henoch-Schönlein purpura. Pauci-immune (negative IF): ANCA vasculitis. Full house (IgG, IgA, IgM, C3, C1q): lupus nephritis.\n\nIF pattern is one of the most important diagnostic features on renal biopsy. Combined with light microscopy (proliferation, crescents, sclerosis) and electron microscopy (deposit location: subepithelial, subendothelial, mesangial), a specific diagnosis can usually be made. C3 dominant without immunoglobulins suggests C3 glomerulopathy."
    difficulty: hard
    tags: [glomerulonephritis, immunofluorescence, biopsy, anti-GBM, lupus, IgA, nephrology]
  - front: "What is Goodpasture syndrome (anti-GBM disease) and how is it managed?"
    back: "Anti-GBM antibodies target type IV collagen α3 chain in glomerular AND alveolar basement membranes → RPGN + pulmonary hemorrhage (Goodpasture syndrome). Management: plasma exchange (daily x 14 days to remove antibodies) + cyclophosphamide + high-dose steroids.\n\nPulmonary hemorrhage triggered by smoking or inhaled hydrocarbons. Without lung involvement = anti-GBM disease; with lung = Goodpasture syndrome. Prognosis depends on Cr at presentation: if dialysis-dependent at diagnosis, renal recovery unlikely (< 10%). 10% have concurrent ANCA positivity (double-positive — slightly better prognosis). Monitor anti-GBM titers."
    difficulty: hard
    tags: [glomerulonephritis, anti-GBM, Goodpasture, plasma exchange, pulmonary hemorrhage, nephrology]
  - front: "A 45-year-old male presents with painless gross hematuria. Urinalysis shows no RBC casts or proteinuria. What is the most concerning diagnosis, and what is the workup?"
    back: "Bladder cancer (or upper tract urothelial carcinoma/renal cell carcinoma). Non-glomerular painless gross hematuria in adults >40 requires cystoscopy and CT urogram to evaluate the entire urinary tract for malignancy. Risk factors include smoking, occupational exposure (aniline dyes), and male sex.\n\nThe absence of RBC casts and proteinuria suggests non-glomerular (urological) bleeding. Glomerular hematuria produces dysmorphic RBCs and RBC casts on urine microscopy. Painless hematuria in an older adult is malignancy until proven otherwise, even if intermittent."
    difficulty: medium
    tags: [hematuria, non-glomerular, bladder-cancer, urology, workup]
  - front: "How do you differentiate glomerular from non-glomerular hematuria on urinalysis and urine microscopy?"
    back: "Glomerular: dysmorphic RBCs (acanthocytes), RBC casts, concurrent proteinuria (>500 mg/day), brown/tea-colored urine. Non-glomerular: isomorphic (normal) RBCs, no RBC casts, minimal proteinuria, bright red or pink urine, may have blood clots (clots essentially exclude glomerular source).\n\nRBC casts are pathognomonic for glomerular bleeding as they form in the renal tubules. Dysmorphic RBCs result from passage through the damaged glomerular basement membrane. The presence of blood clots effectively rules out a glomerular source since urokinase in the renal tubules lyses any clots formed glomerularly."
    difficulty: medium
    tags: [hematuria, glomerular, non-glomerular, urinalysis, nephrology]
  - front: "A 10-year-old boy develops periorbital edema, tea-colored urine, and hypertension 2 weeks after a streptococcal pharyngitis. Urinalysis shows RBC casts and proteinuria. What is the diagnosis?"
    back: "Post-streptococcal glomerulonephritis (PSGN). This is a nephritic syndrome with hematuria, RBC casts, proteinuria, hypertension, and edema. Labs show low C3 complement, positive ASO titer or anti-DNase B. It is typically self-limited in children with supportive care (salt/fluid restriction, antihypertensives).\n\nPSGN occurs 1-3 weeks after pharyngitis or 3-6 weeks after skin infection with nephritogenic strains of Group A Streptococcus. The low C3 with normal C4 indicates alternative complement pathway activation. Renal biopsy is usually not needed in children with a classic presentation. Prognosis is excellent in children but worse in adults."
    difficulty: medium
    tags: [hematuria, glomerular, PSGN, nephrology, pediatrics, nephritic]
  - front: "What is the systematic workup algorithm for hematuria in an adult?"
    back: "1) Confirm true hematuria (>3 RBC/HPF on microscopy; exclude myoglobinuria, hemoglobinuria, menstruation, beet ingestion). 2) Urine microscopy: dysmorphic RBCs/casts → glomerular workup (serology: ANA, ANCA, anti-GBM, complements, renal biopsy). Isomorphic RBCs → non-glomerular workup. 3) Non-glomerular: CT urogram + cystoscopy (especially if >40 years old) to evaluate for stones, malignancy, infection.\n\nA positive urine dipstick for blood must be confirmed by microscopy, as myoglobin and hemoglobin also trigger the dipstick. The age of 40 is a critical threshold — all patients >40 with unexplained non-glomerular hematuria require malignancy workup with cystoscopy regardless of whether the hematuria is microscopic or gross."
    difficulty: hard
    tags: [hematuria, workup-algorithm, nephrology, urology, clinical-approach]
