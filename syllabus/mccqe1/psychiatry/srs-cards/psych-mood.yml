  - front: "Can bupropion be used for augmentation of other antidepressants?"
    back: "Yes, often chosen for augmentation due to lack of sexual side effects\n\nBupropion's unique mechanism (dopamine/norepinephrine reuptake inhibition) makes it useful for augmentation."
    difficulty: medium
    tags: [pharmacology, antidepressants, bupropion, treatment, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What class of medication is vortioxetine?"
    back: "SSRI (but also has multimodal action)\n\nVortioxetine is classified as an SSRI but also acts as a serotonin receptor modulator."
    difficulty: easy
    tags: [pharmacology, antidepressants, SSRI, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is a common side effect of TCAs that SSRIs do not typically cause?"
    back: "Significant weight gain\n\nTCAs commonly cause weight gain and anticholinergic effects, unlike most SSRIs which may cause weight loss."
    difficulty: easy
    tags: [pharmacology, antidepressants, TCA, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the prognosis for untreated major depressive disorder?"
    back: "Up to 40% resolve spontaneously within 6-12 months\n\nWithout treatment, approximately 40% of major depressive episodes will resolve spontaneously within 6-12 months."
    difficulty: easy
    tags: [psychiatry, depression, prognosis, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the recurrence risks of major depressive disorder?"
    back: "50% after 1 episode, 70% after 2 episodes, 90% after 3 episodes\n\nThe risk of recurrence increases with each episode: 50% after the first, 70% after the second, and 90% after the third episode."
    difficulty: medium
    tags: [psychiatry, depression, prognosis, recurrence, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are common medication causes of constipation?"
    back: "Narcotics and antidepressants are the most common\n\nMedication side effects are the most common cause of organic constipation. Opioids cause significant slowed motility."
    difficulty: easy
    tags: [constipation, medications, drugs, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Which antidepressants are used for IBS pain?"
    back: "Tricyclic antidepressants (TCAs) - first-line; SSRIs only for concomitant anxiety/depression; SNRIs also used\n\nTCAs help visceral hypersensitivity and pain in IBS. SSRIs have no evidence for pain improvement in IBS alone."
    difficulty: medium
    tags: [IBS, treatment, antidepressants, TCA, SSRI, SNRI, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are the most common causes of constipation?"
    back: "Most common is functional/idiopathic constipation; medication side effects (narcotics, antidepressants) are the most common organic cause\n\nSecondary causes should be considered when other symptoms accompany constipation."
    difficulty: easy
    tags: [constipation, etiology, medications, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the role of TCAs in IBS treatment and when are they indicated?"
    back: "Tricyclic antidepressants are used for IBS, particularly when pain is predominant; helpful for concomitant anxiety or depression\n\nTCAs have analgesic and anticholinergic effects that can help IBS symptoms, especially in IBS-D."
    difficulty: medium
    tags: [IBS, treatment, TCA, antidepressants, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "When are SSRIs indicated in IBS treatment?"
    back: "SSRIs are only helpful to treat concomitant anxiety or depression in IBS patients; no evidence they help pain alone\n\nUnlike TCAs, SSRIs have no independent analgesic effect for IBS pain."
    difficulty: medium
    tags: [IBS, treatment, SSRI, anxiety, depression, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are common drug causes of constipation?"
    back: "Narcotics and antidepressants are the most common medication causes\n\nOpioids cause constipation by reducing gut motility. Many antidepressants (especially TCAs) also slow intestinal transit."
    difficulty: easy
    tags: [Constipation, Drug-Induced, Medications, Etiology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "List the common drug causes of constipation"
    back: "Narcotics and antidepressants are the most common medication causes\n\nMedication side effects are the most common cause of constipation overall."
    difficulty: easy
    tags: [constipation, etiology, medications, pharmacology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What antidepressants are used for IBS and what is their role?"
    back: "TCAs for pain-predominant IBS; SSRIs for concomitant anxiety/depression; SNRIs also used\n\nTCAs help with pain in IBS but SSRIs have no evidence for pain improvement - only for anxiety/depression."
    difficulty: medium
    tags: [IBS, antidepressants, treatment, pharmacology, pain, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the most common organic cause of constipation?"
    back: "Medication side effects (e.g., narcotics, antidepressants)\n\nMedication-induced constipation is the most common identifiable organic cause, highlighting the importance of medication review."
    difficulty: easy
    tags: [Gastroenterology, Constipation, Etiology, Medications, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the role of SSRIs in IBS treatment?"
    back: "SSRIs are only helpful to treat concomitant anxiety or depression in IBS patients\n\nThere is no evidence that SSRIs help pain in IBS when used alone. They may benefit patients with comorbid anxiety or depression."
    difficulty: medium
    tags: [IBS, SSRIs, Treatment, Anxiety, Depression, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What medications are most commonly responsible for drug-induced constipation?"
    back: "Narcotics (opioids) and antidepressants\n\nMedication side effects are the most common cause of secondary constipation. Opioids cause constipation through decreased gut motility."
    difficulty: medium
    tags: [Constipation, Drug-Induced, Opioids, Antidepressants, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Which antidepressants are used in IBS treatment and what is their indication?"
    back: "TCAs (tricyclic antidepressants) for pain-predominant IBS; SSRIs for concomitant anxiety/depression; SNRIs for pain.\n\nTCAs help pain through anticholinergic and analgesic effects; SSRIs only help when anxiety/depression is primary."
    difficulty: medium
    tags: [IBS, Treatment, Antidepressants, TCAs, SSRIs, SNRIs, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Which antidepressant class is first-line for IBS pain modulation?"
    back: "Tricyclic antidepressants (TCAs)\n\nTCAs modulate visceral pain pathways and are first-line for IBS pain. SSRIs only help if comorbid anxiety or depression."
    difficulty: medium
    tags: [IBS, Treatment, TCAs, Antidepressants, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "List common medication causes of constipation."
    back: "Narcotics and antidepressants are the most common medication causes of constipation."
    difficulty: easy
    tags: [Constipation, Etiology, Medications, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What pharmacological treatments are used for IBS with predominant pain?"
    back: "Antispasmodics (hyoscine, pinaverium, trimebutine) before meals; tricyclic antidepressants (TCA); SNRIs; SSRIs for comorbid anxiety/depression.\n\nTCAs help with pain and diarrhea-predominant IBS through anticholinergic effects and visceral hypersensitivity modulation."
    difficulty: medium
    tags: [IBS, Pharmacology, Pain Management, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What pharmacological treatments are first-line for IBS with predominant pain?"
    back: "Antispasmodics before meals (hyoscine, pinaverium, trimebutine), tricyclic antidepressants (TCAs), or SSRIs for concomitant anxiety/depression\n\nAntispasmodics target smooth muscle spasms. TCAs help visceral hypersensitivity and pain modulation. SSRIs only help if anxiety or depression is present."
    difficulty: medium
    tags: [IBS, Treatment, Pharmacology, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What does the mnemonic DOPED stand for regarding causes of constipation?"
    back: "Drugs, Obstruction, Pain, Endocrine dysfunction, Depression\n\nDOPED is a useful mnemonic for secondary causes of constipation. Medications (especially narcotics and antidepressants) are the most common organic cause."
    difficulty: medium
    tags: [Constipation, Etiology, DOPED, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Which antidepressants are used in IBS treatment and what is their purpose?"
    back: "TCAs (tricyclic antidepressants) for pain; SSRIs for concomitant anxiety/depression; SNRIs for pain and mood.\n\nTCAs help pain via gut neuromodulation; SSRIs/SNRIs treat comorbid mood disorders but SSRIs alone don't help IBS pain."
    difficulty: medium
    tags: [Gastroenterology, IBS, Treatment, Antidepressants, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What does the acronym MOAPS represent in the psychiatric review of systems?"
    back: "MOAPS: Mood, Orientation/cognition (implied), Affect, Psychosis, Safety.\n\nThe MOAPS framework ensures systematic coverage of psychiatric domains during an emergency assessment. Each domain guides targeted history-taking and examination to identify the most pressing clinical concern."
    difficulty: easy
    tags: [psychiatric assessment, MOAPS, emergency psychiatry, mental status exam]
  - front: "What is the first-line antidepressant for youth with depression, and which SSRI is NOT recommended for this population?"
    back: "First-line SSRI for youth is fluoxetine. Paroxetine is NOT recommended for youth (controversial).\n\nFluoxetine has the best evidence in pediatric populations. Paroxetine has been associated with increased suicidal ideation in youth and is considered controversial for this age group by Canadian guidelines."
    difficulty: easy
    tags: [antidepressants, SSRI, youth, depression, paroxetine, fluoxetine]
  - front: "List the mnemonic M-SIGECAPS for the diagnostic criteria of major depressive disorder."
    back: "M - Depressed Mood; S - Increased/decreased Sleep; I - Decreased Interest; G - Guilt/worthlessness; E - decreased Energy; C - poor Concentration; A - increased/decreased Appetite and weight; P - Psychomotor agitation/retardation; S - Suicidal ideation. Requires depressed mood for ≥2 weeks.\n\nM-SIGECAPS is a widely used mnemonic for DSM-5 criteria of MDD. A diagnosis requires 5 or more symptoms including depressed mood or anhedonia, present for at least 2 weeks."
    difficulty: easy
    tags: [depression, MDD, M-SIGECAPS, diagnostic criteria]
  - front: "What are the risks of recurrence after episodes of major depressive disorder?"
    back: "50% after 1 episode, 70% after 2 episodes, 90% after 3 episodes. Up to 40% resolve spontaneously within 6-12 months.\n\nThe risk of recurrence increases substantially with each episode of MDD. After 3 episodes, the risk is 90%, emphasizing the importance of long-term maintenance therapy in recurrent depression."
    difficulty: easy
    tags: [depression, MDD, prognosis, recurrence]
  - front: "What are the side effects of SSRIs and what baseline investigation is suggested before starting?"
    back: "Side effects: sexual dysfunction (impotence, decreased libido, delayed ejaculation, anorgasmia), headache, GI upset, weight loss, tremors, insomnia, fatigue, increased QT interval. A baseline ECG is suggested due to QT prolongation risk.\n\nSSRIs are generally well-tolerated but the QT prolongation risk (especially citalopram/escitalopram at higher doses) warrants a baseline ECG. Sexual dysfunction is the most common reason for non-compliance."
    difficulty: easy
    tags: [SSRI, side effects, QT prolongation, ECG, antidepressants]
  - front: "What antidepressant class is often chosen for its lack of sexual side effects and can augment other antidepressants?"
    back: "Bupropion (Wellbutrin®) — an NDRI (blocks dopamine and NE reuptake). It has less sexual dysfunction than SSRIs and can be used for augmentation of antidepressant effects with other medication classes.\n\nBupropion's mechanism of action (dopamine/NE reuptake inhibition rather than serotonin) accounts for its favorable sexual side effect profile. Key side effects include headache, insomnia, nightmares, and seizures (dose-dependent)."
    difficulty: easy
    tags: [bupropion, NDRI, antidepressants, sexual dysfunction, augmentation]
  - front: "Why are TCAs considered dangerous compared to newer antidepressants?"
    back: "TCAs (e.g., amitriptyline) have a narrow therapeutic window and are lethal in overdose. They also cause sexual dysfunction, weight gain, tremors, tachycardia, and sweating.\n\nTCAs block serotonin and NE reuptake but also block muscarinic, histaminergic, and alpha-adrenergic receptors, causing significant anticholinergic and cardiovascular toxicity. Overdose can cause fatal arrhythmias."
    difficulty: easy
    tags: [TCA, amitriptyline, overdose, antidepressants, toxicity]
