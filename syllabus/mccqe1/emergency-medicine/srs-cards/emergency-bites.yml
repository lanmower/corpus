# Emergency Bites (EmergencyMedicine) - generated from srs-mccqe1
cards:
  - front: "What is the recommended antibiotic for dog/cat bites and why is cefalexin NOT appropriate?"
    back: "First line: amoxicillin-clavulanic acid. Cefalexin is NOT appropriate because it does not cover Pasteurella multocida or Eikenella corrodens, key pathogens in dog/cat bites.\n\nCat bites become infected in 10–50% of cases, dog bites in ~5%. A 3–5 day antibiotic course is recommended for hand bites and high-risk wounds. Human bites also require amoxicillin-clavulanic acid and risk assessment for blood-borne infections."
    difficulty: easy
    tags: [bites, antibiotics, Pasteurella, emergency medicine]
  - front: "What animals are the primary rabies reservoirs in Canada and what is the management after exposure?"
    back: "Primary reservoirs: bats and raccoons (warm-blooded animals excluding rodents and lagomorphs). Domestic animal incidence is low. Management: post-exposure vaccine is effective; consult local public health unit for guidance based on local prevalence.\n\nRodents (mice, rats, squirrels) and lagomorphs (rabbits) are NOT considered rabies reservoirs. Risk is higher for animal bites outside Canada. Post-exposure prophylaxis includes rabies immune globulin and vaccine series."
    difficulty: easy
    tags: [rabies, bites, infectious disease, public health, Canada]
