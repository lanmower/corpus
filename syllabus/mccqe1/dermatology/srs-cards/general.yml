# General (Dermatology) - generated from srs-mccqe1
cards:
  - front: "What two cell types undergo age-related decline in skin regenerative abilities?"
    back: "Keratinocytes and fibroblasts\n\nBoth cell types lose self-renewing capacities, have altered proliferative activity, and undergo functional decline with aging."
    difficulty: easy
    tags: [dermatology, skin-aging, geriatric, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is senile purpura and how does it present?"
    back: "Spontaneous non-blanchable red-to-purple patches that resolve over 1-3 weeks, leaving residual brown-yellow discoloration from hemosiderin deposition\n\nSenile purpura (solar/actinic purpura) results from age-related loss of skin integrity and structural support."
    difficulty: easy
    tags: [dermatology, geriatric, vascular, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the normal timeline for keratinocyte progression from stratum basale to stratum corneum?"
    back: "Approximately 4 weeks\n\nKeratinocytes undergo continuous renewal and migration from the basal layer to the surface."
    difficulty: easy
    tags: [dermatology, histology, cell-biology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the keratinocyte to melanocyte ratio in the stratum basale?"
    back: "10:1\n\nDespite this ratio, melanocyte numbers are equal among all races, explaining why differences in skin color result from melanosome activity rather than cell number."
    difficulty: easy
    tags: [dermatology, histology, melanocyte, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What components make up the pilosebaceous unit?"
    back: "Hair, hair follicle, sebaceous gland, and arrector pili muscle\n\nThe pilosebaceous unit is a functional complex involved in hair maintenance and sebum production."
    difficulty: easy
    tags: [dermatology, anatomy, adnexal-structures, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the protective function of sebum?"
    back: "Covers skin surface to provide a protective barrier with antifungal properties\n\nSebum is secreted onto the skin surface via hair follicles, creating a lipid barrier."
    difficulty: easy
    tags: [dermatology, physiology, sebaceous-glands, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Where are apocrine sweat glands concentrated in humans?"
    back: "Axillae and perineum\n\nApocrine glands are considered vestigial in humans but are functional in other species for pheromone production."
    difficulty: easy
    tags: [dermatology, sweat-glands, anatomy, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the primary function of eccrine sweat glands?"
    back: "Temperature regulation via secretion of sweat to cool the skin surface\n\nEccrine glands are found throughout the body (except lips, nail beds, glans penis) and are essential for thermoregulation."
    difficulty: easy
    tags: [dermatology, sweat-glands, physiology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "How does melanin provide UV radiation protection?"
    back: "Melanin is transferred from melanocytes to keratinocytes in melanosomes, where it absorbs UV radiation\n\nThe melanin-keratinocyte unit represents the skin's primary photoprotective mechanism."
    difficulty: medium
    tags: [dermatology, melanocyte, photoprotection, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Where are Merkel cells located and what is their function?"
    back: "Stratum basale; involved in touch sensation\n\nMerkel cells are specialized sensory cells that form close associations with nerve endings."
    difficulty: easy
    tags: [dermatology, histology, sensory, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between a papule and a plaque?"
    back: "Papule is <1cm diameter; plaque is ≥1cm diameter (raised superficial lesion)\n\nSize is the distinguishing feature using SCALDA criteria for lesion classification."
    difficulty: easy
    tags: [dermatology, morphology, lesions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is lichenification?"
    back: "Thickening of the skin with accentuation of normal skin markings\n\nLichenification results from chronic rubbing or scratching and is characteristic of atopic dermatitis."
    difficulty: easy
    tags: [dermatology, morphology, chronic-dermatitis, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between a vesicle and a bulla?"
    back: "Vesicle is <1cm diameter; bulla is ≥1cm diameter (elevated fluid-filled lesion)\n\nBoth contain fluid within the epidermis or subepidermally, distinguished by size."
    difficulty: easy
    tags: [dermatology, morphology, blisters, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the key feature of a wheal?"
    back: "Transient (<24 hours), blanchable papule or plaque with halo and central clearing, formed by dermal edema\n\nWheals are characteristic of urticaria and represent rapid-onset, short-lived edema."
    difficulty: medium
    tags: [dermatology, morphology, urticaria, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between open and closed comedones?"
    back: "Open comedone (blackhead) has an dilated open pore; closed comedone (whitehead) has a sealed pore\n\nBoth represent collections of sebum and keratin but differ in whether the follicle opening is patent."
    difficulty: easy
    tags: [dermatology, morphology, acne, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "How does skin contribute to thermal regulation in cold environments?"
    back: "Peripheral vasoconstriction, hair, and subcutaneous adipose tissue provide insulation\n\nThese mechanisms reduce heat loss to maintain core body temperature."
    difficulty: easy
    tags: [dermatology, physiology, thermoregulation, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are the basophilic granules in stratum granulosum?"
    back: "Keratohyalin granules, which contain proteins involved in keratinization\n\nThese granules mark the transition zone where cells begin the process of cornification."
    difficulty: medium
    tags: [dermatology, histology, keratinization, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is male pattern baldness also known as?"
    back: "Androgenic Alopecia\n\nThis androgen-dependent condition is characterized by progressive hair loss in a characteristic distribution pattern."
    difficulty: easy
    tags: [dermatology, hair-disorders, androgenic-conditions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "How long does it take for cells to progress from stratum basale to stratum corneum?"
    back: "Approximately 4 weeks\n\nThis continuous turnover maintains the epidermal barrier and replaces damaged cells."
    difficulty: easy
    tags: [dermatology, skin-anatomy, keratinocyte-biology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What do melanocytes produce and how do they transfer their product to keratinocytes?"
    back: "Melanosomes containing melanin, transferred via dendritic processes to surrounding keratinocytes\n\nThis transfer determines skin and hair pigmentation and provides UV radiation protection."
    difficulty: easy
    tags: [dermatology, cell-biology, pigmentation, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the pilosebaceous unit?"
    back: "Hair + hair follicle + sebaceous gland + arrector pili muscle\n\nThis functional unit is involved in hair growth, sebum production, and arrector pili muscle contraction."
    difficulty: easy
    tags: [dermatology, skin-anatomy, appendages, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Where are sebaceous glands notably ABSENT?"
    back: "Palms, soles, and lips (non-hair bearing areas)\n\nSebaceous glands are associated with hair follicles, explaining their absence from glabrous skin."
    difficulty: easy
    tags: [dermatology, skin-anatomy, glands, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the function of apocrine sweat glands and where are they found?"
    back: "Likely vestigial pheromone production; found concentrated in axillae and perineum, emptying into hair follicles\n\nUnlike eccrine glands, apocrine glands are not part of the pilosebaceous unit and are not involved in thermoregulation."
    difficulty: easy
    tags: [dermatology, skin-anatomy, glands, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are the four main functions of the skin?"
    back: "Protection, thermal regulation, sensation, and metabolic function\n\nThese functions are essential for homeostasis and survival, encompassing barrier, temperature, sensory, and biochemical roles."
    difficulty: easy
    tags: [dermatology, physiology, integumentary, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "How does skin provide protection against UV radiation, dehydration, and pathogens?"
    back: "Melanin absorbs UV radiation; lipid-rich barrier prevents dehydration; immune cells (Langerhans cells) protect against pathogens\n\nThe skin's continuous recycling and avascular epidermis, along with normal flora, contribute to its protective function."
    difficulty: easy
    tags: [dermatology, physiology, protection, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the SCALDA method for describing skin lesions?"
    back: "Size, Configuration, Arrangement, Location, Distribution, and Associated features\n\nThis systematic approach ensures complete description of skin lesions for accurate diagnosis."
    difficulty: easy
    tags: [dermatology, clinical-skills, lesion-description, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the size threshold distinguishing papules from plaques, and nodules from tumors?"
    back: "Papules are <1cm; plaques are ≥1cm; nodules are <1cm; tumors are ≥1cm\n\nSize is a key distinguishing feature when classifying raised superficial and deep palpable lesions."
    difficulty: easy
    tags: [dermatology, clinical-skills, lesion-description, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between a macule and a patch?"
    back: "Both are flat lesions, but macules are <1cm while patches are ≥1cm\n\nSize categorization applies to all primary lesion types in dermatologic description."
    difficulty: easy
    tags: [dermatology, clinical-skills, primary-lesions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What distinguishes a vesicle from a bulla?"
    back: "Vesicles are <1cm fluid-filled lesions; bullae are ≥1cm\n\nBoth are elevated fluid-filled lesions, distinguished solely by diameter."
    difficulty: easy
    tags: [dermatology, clinical-skills, primary-lesions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between a crust and scale?"
    back: "Crust is dried fluid (serum, blood, or purulent exudate); scale is excess keratin\n\nCrusts form from exudate while scales represent abnormal keratinization."
    difficulty: easy
    tags: [dermatology, clinical-skills, secondary-lesions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is a wheal?"
    back: "A transient (<24 hours) blanchable papule or plaque with halo and central clearing, formed by dermal edema\n\nUrticaria (hives) is the classic example of wheals."
    difficulty: easy
    tags: [dermatology, clinical-skills, morphological-terms, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are the common configurations of skin lesions?"
    back: "Annular, reticular, targetoid/target, and satellite configurations\n\nConfiguration describes the geometric pattern of lesion distribution and is diagnostically important."
    difficulty: easy
    tags: [dermatology, clinical-skills, lesion-description, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What distribution patterns are important in describing skin lesions?"
    back: "Dermatomal, acral, flexural, extensor, intertriginous, and photo-distributed patterns\n\nDistribution often provides clues to etiology, such as viral (dermatomal) or contact (intertriginous) causes."
    difficulty: easy
    tags: [dermatology, clinical-skills, lesion-description, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the keratinocyte:melanocyte ratio in the stratum basale?"
    back: "10:1\n\nDespite this ratio, melanocyte number is equal among all races, explaining racial variation in pigmentation through melanosome distribution rather than cell count."
    difficulty: easy
    tags: [dermatology, skin histology, melanocytes, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What components comprise the pilosebaceous unit?"
    back: "Hair, hair follicle, sebaceous gland, and arrector pili muscle\n\nThis structural unit is important in acne pathogenesis and various dermatologic conditions affecting hair-bearing skin."
    difficulty: easy
    tags: [dermatology, skin anatomy, pilosebaceous unit, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Where are sebaceous glands found and what is their function?"
    back: "Present throughout hair-bearing skin except palms, soles, and lips. They produce sebum which covers the skin surface (protective function) and has antifungal properties\n\nSebum is secreted into hair follicles via the sebaceous duct, where it forms a protective lipid layer."
    difficulty: easy
    tags: [dermatology, cutaneous glands, sebaceous glands, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between apocrine and eccrine sweat glands?"
    back: "Apocrine glands: empty into hair follicle above sebaceous gland, found in axillae/perineum, likely vestigial (pheromone function). Eccrine glands: empty directly to skin surface, found throughout body except lips/nail beds/glans penis, important for thermoregulation\n\nApocrine and eccrine glands have different embryologic origins, locations, and functions in temperature regulation and scent."
    difficulty: easy
    tags: [dermatology, cutaneous glands, thermoregulation, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Describe the SCALDA mnemonic for describing skin lesions."
    back: "Size, Colour, Arrangement, Location/distribution, and Adjacent skin changes\n\nSCALDA provides a systematic approach to describing primary and secondary skin lesions for clinical documentation."
    difficulty: easy
    tags: [dermatology, clinical examination, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the size cutoff distinguishing a papule from a plaque?"
    back: "<1cm = papule; ≥1cm = plaque\n\nBoth are raised superficial lesions, but size is the distinguishing feature in the SCALDA classification."
    difficulty: easy
    tags: [dermatology, primary lesions, clinical examination, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between a nodule and a tumour?"
    back: "Both are deep palpable (dermal or subcutaneous) lesions: nodule <1cm, tumour ≥1cm\n\nThese represent deeper skin involvement compared to superficial papules and plaques."
    difficulty: easy
    tags: [dermatology, primary lesions, clinical examination, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is lichenification and name one common cause?"
    back: "Thickening of the skin with accentuation of normal skin markings; commonly seen in chronic atopic dermatitis\n\nLichenification results from chronic scratching or rubbing, representing a secondary change to primary disease."
    difficulty: easy
    tags: [dermatology, secondary lesions, atopic dermatitis, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is a wheal and how long does it typically last?"
    back: "A transient (<24 hours) blanchable papule or plaque, often with a halo and central clearing, formed by dermal edema. Example: urticaria\n\nThe transient nature distinguishes wheals from other papules and plaques, reflecting the fleeting nature of mast cell-mediated edema."
    difficulty: easy
    tags: [dermatology, morphological terms, urticaria, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between an open and closed comedone?"
    back: "Open comedone (blackhead): pore is open, melanin oxidizes giving black appearance. Closed comedone (whitehead): pore is closed, appears as white papule\n\nComedones are collections of sebum and keratin that form the earliest lesions in acne vulgaris."
    difficulty: easy
    tags: [dermatology, acne, morphological terms, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the function of Merkel cells in the skin?"
    back: "Touch sensation\n\nMerkel cells are located in the stratum basale and function as mechanoreceptors for tactile discrimination."
    difficulty: easy
    tags: [dermatology, skin histology, neurocutaneous, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the first-line medical treatment for problematic infantile hemangiomas?"
    back: "Topical timolol or propranolol (beta-blockers)\n\nBeta-blockers have become first-line treatment for problematic hemangiomas, with topical timolol for superficial lesions and oral propranolol for deeper/complicated lesions."
    difficulty: easy
    tags: [dermatology, hemangioma, treatment, beta-blockers, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "How do you clinically distinguish a venous lake from a melanocytic lesion?"
    back: "Diascopy - compression with a glass slide causes blanching of venous lake\n\nVenous lakes are benign dilations of venules that blanch with pressure, whereas melanocytic lesions do not blanch with diascopy."
    difficulty: easy
    tags: [dermatology, venous-lake, diascopy, clinical-examination, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What maneuver confirms the diagnosis of spider angioma?"
    back: "Blanching with pressure applied to the center of the lesion (e.g., tip of a paperclip)\n\nSpider angiomas blanch from the center outward when pressure is applied because they consist of a central arteriole with branches that empty when compressed."
    difficulty: easy
    tags: [dermatology, spider-angioma, clinical-examination, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What syndrome is associated with nevus flammeus (port-wine stain) in the V1/V2 distribution?"
    back: "Sturge-Weber syndrome\n\nFacial port-wine stains in the V1 (forehead) or V2 (cheek) trigeminal distributions, particularly involving the upper face, raise concern for Sturge-Weber syndrome with leptomeningeal angiomas."
    difficulty: easy
    tags: [dermatology, nevus-flammeus, port-wine-stain, sturge-weber, syndromes, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What percentage of newborns have nevus simplex (salmon patch)?"
    back: "Approximately 3 in 4 newborns (75%)\n\nSalmon patches are extremely common birthmarks caused by telangiectatic vessels in the dermis."
    difficulty: easy
    tags: [dermatology, nevus-simplex, salmon-patch, neonatology, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the typical age of onset for cherry angioma (Campbell de Morgan spot)?"
    back: "After age 30\n\nCherry angiomas are benign vascular neoplasms that typically appear in adulthood and increase in number with age."
    difficulty: easy
    tags: [dermatology, cherry-angioma, vascular-tumors, aging, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "Name the 4 variants of xanthoma described in Toronto Notes"
    back: "Eruptive xanthoma, tuberous xanthoma, tendinous xanthoma, and plane xanthoma\n\nThese variants differ in morphology, location, and association with lipid abnormalities, each having distinct clinical features and diagnostic significance."
    difficulty: easy
    tags: [dermatology, xanthoma, types, classification, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What investigations are appropriate for xanthoma?"
    back: "Biopsy (shave, punch, or excisional) and fasting lipid panel\n\nBiopsy confirms the diagnosis histologically, while a fasting lipid panel helps identify underlying hyperlipidemia that may require treatment."
    difficulty: easy
    tags: [dermatology, xanthoma, investigations, biopsy, lipids, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the DDx for tendinous xanthoma?"
    back: "Rheumatoid nodules, gouty tophi, subcutaneous granuloma annulare, erythema elevatum diutinum\n\nFirm nodules over tendons in a patient with suspected hyperlipidemia should prompt evaluation for tendinous xanthoma versus other nodular eruptions."
    difficulty: medium
    tags: [dermatology, xanthoma, differential-diagnosis, rheumatology, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What treatment options exist for cherry angioma?"
    back: "Usually no treatment needed; laser or electrocautery for small lesions; excision of large lesions if necessary\n\nCherry angiomas are benign and typically require no intervention unless the patient desires removal for cosmetic reasons."
    difficulty: easy
    tags: [dermatology, cherry-angioma, treatment, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is a pilosebaceous unit?"
    back: "Hair + hair follicle + sebaceous gland + arrector pili muscle\n\nThe pilosebaceous unit is a key anatomical structure involved in acne pathogenesis and other dermatologic conditions."
    difficulty: easy
    tags: [dermatology, skin-anatomy, pilosebaceous, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Where are sebaceous glands absent on the body?"
    back: "Non-hair bearing areas including palms, soles, and lips\n\nSebaceous glands are associated with hair follicles and are therefore absent from areas lacking hair."
    difficulty: easy
    tags: [dermatology, skin-anatomy, sebaceous-glands, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the function of sebum produced by sebaceous glands?"
    back: "Protective coating on skin surface with some antifungal properties\n\nSebum is secreted via the sebaceous duct into hair follicles and covers the skin surface, providing a protective lipid barrier."
    difficulty: easy
    tags: [dermatology, sebaceous-glands, dermatology-functions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Where are apocrine sweat glands concentrated and what is their function?"
    back: "Concentrated in axillae and perineum; likely a vestigial structure producing scent/pheromones in other species\n\nApocrine glands are not part of the pilosebaceous unit and their duct empties into hair follicles above the sebaceous gland."
    difficulty: easy
    tags: [dermatology, sweat-glands, anatomy, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "How does the skin protect against UV radiation?"
    back: "Through melanin produced by melanocytes, which absorbs and scatters UV radiation\n\nMelanin in melanosomes is transferred from melanocytes to keratinocytes, providing photoprotection for DNA in proliferating epidermal cells."
    difficulty: easy
    tags: [dermatology, photobiology, skin-protection, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What does SCALDA stand for when describing skin lesions?"
    back: "Size, Configuration/Colour, Arrangement, Location/Distribution, and Adjacent skin changes\n\nSCALDA is a systematic approach to describing morphological characteristics of skin lesions for clinical documentation."
    difficulty: easy
    tags: [dermatology, clinical-approach, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the size threshold distinguishing a macule from a patch?"
    back: "<1 cm = macule; ≥1 cm = patch\n\nBoth macules and patches are flat lesions, but size is the distinguishing criterion, with 1 cm as the cutoff."
    difficulty: easy
    tags: [dermatology, primary-lesions, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What distinguishes a papule from a plaque?"
    back: "Both are raised superficial lesions, but papules are <1 cm diameter while plaques are ≥1 cm\n\nExamples include warts (papule) and psoriasis plaques (plaque), both superficial but differentiated by size."
    difficulty: easy
    tags: [dermatology, primary-lesions, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between a hypertrophic scar and an atrophic scar?"
    back: "Hypertrophic scars show excess fibrosis above the skin surface; atrophic scars show depressed tissue loss below the skin surface\n\nBoth represent replacement fibrosis of dermis and subcutaneous tissue, but the direction of tissue remodeling determines the clinical appearance."
    difficulty: easy
    tags: [dermatology, scarring, wound-healing, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What distinguishes a crust from a scale?"
    back: "Crust is dried fluid (serum, blood, or purulent exudate) on the skin surface; scale is excess keratin accumulation\n\nCrusts form from dried exudate overlaying lesions (e.g., impetigo), while scales represent abnormal keratinization (e.g., seborrheic dermatitis)."
    difficulty: easy
    tags: [dermatology, secondary-lesions, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "How does skin maintain thermal regulation in warm environments?"
    back: "Increased sweat gland activity and increased blood flow within dermal vascular networks to dissipate heat\n\nThe eccrine sweat response and vasodilation in dermal networks are the primary mechanisms for heat dissipation."
    difficulty: easy
    tags: [dermatology, thermoregulation, physiology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "How does skin maintain thermal regulation in cool environments?"
    back: "Peripheral vasoconstriction, hair positioning, and subcutaneous adipose tissue provide insulation\n\nThese mechanisms reduce heat loss to the environment by minimizing blood flow to the skin surface and increasing thermal insulation."
    difficulty: easy
    tags: [dermatology, thermoregulation, physiology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are common distribution patterns for skin lesions?"
    back: "Dermatomal, acral, flexural, extensor, intertriginous, photoexposed, and弥漫性 (diffuse) distributions\n\nRecognizing distribution patterns helps narrow the differential diagnosis, as many dermatoses have characteristic patterns."
    difficulty: easy
    tags: [dermatology, clinical-approach, lesion-distribution, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is androgenic alopecia (male pattern baldness) related to?"
    back: "Decline in skin and hair integrity with aging, influenced by androgens on susceptible hair follicles\n\nGenetically susceptible follicles undergo miniaturization in response to dihydrotestosterone (DHT), leading to progressive hair loss in characteristic patterns."
    difficulty: easy
    tags: [dermatology, hair-disorders, androgenic-alopecia, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What mnemonic helps describe skin lesion morphology systematically?"
    back: "SCALDA: Size, Colour/Configuration, Arrangement, Location/Distribution, Adjacent skin changes\n\nThis systematic approach ensures complete documentation of primary and secondary morphological features of any skin lesion."
    difficulty: easy
    tags: [dermatology, clinical-approach, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What percentage of hemangiomas of infancy require treatment?"
    back: "~10% require treatment\n\nWhile 50% of hemangiomas of infancy resolve spontaneously by age 5, approximately 10% require treatment due to functional impairment (visual compromise, airway obstruction, high-output cardiac failure) or cosmetic concerns."
    difficulty: easy
    tags: [dermatology, hemangioma, vascular_tumors, pediatrics, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is a clinical trick to demonstrate blanching of a spider angioma?"
    back: "Apply the tip of a paperclip to the centre of the lesion\n\nA simple clinical maneuver to demonstrate blanching of a spider angioma is to apply pressure with the tip of a paperclip to the center of the lesion, which causes temporary blanching due to compression of the central arteriole."
    difficulty: easy
    tags: [dermatology, spider_angioma, physical_exam, clinical_trick, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What syndrome is associated with nevus flammeus (port-wine stain) in V1/V2 distribution?"
    back: "Sturge-Weber syndrome\n\nWhile rare, nevus flammeus in the V1 (ophthalmic) or V2 (maxillary) distribution of the trigeminal nerve may be associated with Sturge-Weber syndrome, a neurocutaneous disorder."
    difficulty: medium
    tags: [dermatology, port_wine_stain, sturge_weber, syndrome, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What investigations are recommended for xanthoma?"
    back: "Biopsy (shave, punch, or excisional) and fasting lipid panel (except for verruciform xanthoma)\n\nBiopsy confirms the diagnosis of xanthoma. A fasting lipid panel is indicated to evaluate for hyperlipidemia, except in verruciform xanthoma which is not associated with lipid abnormalities."
    difficulty: medium
    tags: [dermatology, xanthoma, investigations, workup, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What distinguishes the four types of xanthoma clinically?"
    back: "Eruptive (1-5mm erythematous-to-yellow papules), Tuberous (<3cm yellow-to-orange papules/nodules), Tendinous (smooth, firm, mobile, skin-colored nodules), Plane (soft, yellow, thin plaques)\n\nThe four xanthoma variants have distinct clinical presentations: eruptive (scattered small papules), tuberous (larger nodules over pressure points), tendinous (along tendons), and plane (flat plaques, often periorbital)."
    difficulty: medium
    tags: [dermatology, xanthoma, clinical_features, variants, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "When should treatment for hemangioma of infancy be considered?"
    back: "Consider treatment if the hemangioma has not regressed by school age (5 years), or earlier for high-risk lesions causing functional impairment\n\nApproximately 50% of hemangiomas resolve by age 5. Treatment should be considered if the lesion persists past school age or causes functional problems (visual compromise, airway obstruction, cardiac failure)."
    difficulty: medium
    tags: [dermatology, hemangioma, treatment_indications, pediatrics, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the recommended management for cherry angioma?"
    back: "Usually no treatment needed; laser or electrocautery for small lesions, excision for large lesions\n\nCherry angiomas are benign lesions that typically do not require treatment. If treatment is desired for cosmetic reasons or if lesions bleed infrequently, laser therapy, electrocautery, or surgical excision are options."
    difficulty: easy
    tags: [dermatology, cherry_angioma, management, treatment, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "How common is nevus simplex (salmon patch) in newborns and what is its prognosis?"
    back: "Present in 3% of newborns; majority regress spontaneously\n\nNevus simplex (salmon patch or stork bite) occurs in approximately 3% of newborns. Unlike nevus flammeus, the majority of these lesions regress spontaneously over time without treatment."
    difficulty: easy
    tags: [dermatology, nevus_simplex, newborn, prognosis, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the typical age range for cherry angioma development?"
    back: ">30 years old\n\nCherry angiomas (Campbell de Morgan spots) are benign vascular neoplasms that typically develop after age 30, with lesions becoming more common as age increases."
    difficulty: easy
    tags: [dermatology, cherry_angioma, epidemiology, age, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What management options exist for port-wine stain (nevus flammeus)?"
    back: "Laser treatment or camouflage makeup\n\nUnlike nevus simplex, port-wine stains never spontaneously regress and grow proportionally with the child. Treatment options include laser therapy to lighten the lesion or cosmetic makeup for camouflage."
    difficulty: easy
    tags: [dermatology, port_wine_stain, treatment, laser, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What ages are affected by pyogenic granuloma?"
    back: "<30 years old (younger population compared to cherry angioma)\n\nPyogenic granuloma is a rapidly developing lesion that typically occurs in individuals under 30 years of age, distinguishing it from cherry angioma which typically appears after age 30."
    difficulty: easy
    tags: [dermatology, pyogenic_granuloma, epidemiology, age, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the clinical course of pyogenic granuloma?"
    back: "Lesion grows rapidly over weeks to months, then stabilizes; may persist indefinitely if untreated\n\nPyogenic granuloma is a rapidly developing lesion that typically grows over weeks to months, then stabilizes. Unlike some vascular lesions, it does not spontaneously regress and may persist indefinitely without treatment."
    difficulty: easy
    tags: [dermatology, pyogenic_granuloma, natural_history, clinical_course, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the characteristic appearance of tendinous xanthoma?"
    back: "Smooth, firm, mobile, skin-coloured nodules along tendons\n\nTendinous xanthomas present as smooth, firm, mobile nodules that are typically skin-coloured, found along tendons (commonly Achilles tendon, extensor tendons of hands). They are associated with familial hypercholesterolemia."
    difficulty: medium
    tags: [dermatology, tendinous_xanthoma, hypercholesterolemia, clinical_features, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What percentage of infantile hemangiomas resolve spontaneously by age 5?"
    back: "50% of lesions resolve spontaneously by 5 years of age.\n\nInfantile hemangiomas have a natural history of proliferation followed by involution, with half resolving by early childhood."
    difficulty: easy
    tags: [dermatology, pediatric dermatology, vascular tumors, hemangioma, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the key clinical feature that distinguishes a spider angioma (Campbell Telangiectasia)?"
    back: "Central red arteriole with slender branches that is blanchable when pressure is applied (e.g., with a paperclip tip).\n\nSpider angiomas blanch with central pressure due to their arterial nature, which distinguishes them from other vascular lesions."
    difficulty: easy
    tags: [dermatology, vascular tumors, spider angioma, telangiectasia, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the clinical variants of xanthoma?"
    back: "Eruptive xanthoma (1-5mm erythematous-to-yellow papules), tuberous xanthoma (<3cm yellow-to-orange papules/nodules), tendinous xanthoma (smooth, firm, mobile, skin-colored nodules), and plane xanthoma (soft, yellow, thin plaques).\n\nXanthomas present in various forms depending on lipid deposition location, each with distinct clinical features useful for diagnosis."
    difficulty: easy
    tags: [dermatology, metabolic disorders, xanthoma, hyperlipidemia, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "How can venous lake be distinguished from malignant pigmented lesions?"
    back: "Through diascopy - compression with a glass slide blanches the venous lake lesion due to blood expulsion from the dilated venule.\n\nVenous lakes are benign blue-violaceous papular lesions that blanch with compression, unlike pigmented melanocytic lesions."
    difficulty: easy
    tags: [dermatology, benign lesions, venous lake, diascopy, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the clinical pearl to distinguish a venous lake from a melanocytic lesion?"
    back: "Diascopy (compression with a glass slide) blanches the venous lake\n\nVenous lakes are benign blue-violaceous papular lesions caused by dilation of a venule. Unlike melanocytic lesions, they completely blanch under diascopy due to their vascular nature."
    difficulty: easy
    tags: [dermatology, venous lake, diascopy, clinicalPearls, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What clinical finding confirms the diagnosis of a spider angioma?"
    back: "Blanching of the central arteriole when pressure is applied with the tip of a paperclip\n\nSpider angiomas have a characteristic central red arteriole with slender radiating branches. Applying pressure to the center (e.g., with a paperclip tip) causes blanching of the entire lesion, confirming the diagnosis."
    difficulty: easy
    tags: [dermatology, spider angioma, clinicalPearls, physical exam, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What syndrome should be suspected with a port-wine stain (nevus flammeus) in the V1/V2 dermatomal distribution?"
    back: "Sturge-Weber syndrome\n\nNevus flammeus in the trigeminal nerve V1 and V2 distributions (forehead, periorbital region) is associated with Sturge-Weber syndrome, a vascular malformation affecting the face and leptomeninges."
    difficulty: easy
    tags: [dermatology, nevus flammeus, Sturge-Weber syndrome, port-wine stain, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the expected outcome for a 'stork bite' (nevus simplex) located on the nuchal region?"
    back: "Majority regress spontaneously\n\nNevus simplex (salmon patch) is present in approximately 30% of newborns. Midline lesions on the glabella ('angel kiss') and nuchal region ('stork bites') typically regress spontaneously over time."
    difficulty: easy
    tags: [dermatology, nevus simplex, salmon patch, newborn, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What distinguishes cherry angioma from pyogenic granuloma clinically?"
    back: "Cherry angioma lesions do not bleed and occur on the trunk, while pyogenic granuloma bleeds easily and occurs on fingers, lips, mouth, and toes\n\nCherry angiomas are dome-shaped, non-friable vascular papules on the trunk that typically do not bleed. Pyogenic granulomas are rapidly growing, friable nodules that bleed easily and favor acral locations."
    difficulty: medium
    tags: [dermatology, cherry angioma, pyogenic granuloma, differential diagnosis, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the five clinical variants of xanthoma described in the text?"
    back: "Eruptive xanthoma, tuberous xanthoma, tendinous xanthoma, plane xanthoma, and verruciform xanthoma\n\nXanthomas present in several morphologic variants: eruptive (1-5mm papules), tuberous (sub-3cm nodules), tendinous (smooth tendon nodules), plane (soft yellow plaques), and verruciform (warty surface) types."
    difficulty: easy
    tags: [dermatology, xanthoma, clinical variants, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the clinical presentation of a hemangioma of infancy?"
    back: "Hot, firm, red to blue plaques that appear shortly after birth, increase in size over months, then regress. 50% resolve spontaneously by age 5.\n\nHemangiomas of infancy are benign vascular tumors caused by proliferation of endothelial lining. Most are harmless and resolve spontaneously, but ~10% require treatment for functional impairment."
    difficulty: easy
    tags: [dermatology, vascular_tumors, pediatrics, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is a port-wine stain (nevus flammeus) and what syndrome is it associated with?"
    back: "Red to blue macule present at birth following dermatomal distribution that never spontaneously regresses. Associated with Sturge-Weber syndrome when in V1/V2 distribution.\n\nPort-wine stains are congenital vascular malformations of dermal capillaries. Sturge-Weber syndrome involves CNS and ocular involvement."
    difficulty: easy
    tags: [dermatology, vascular_malformations, syndromes, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the different types of xanthomas and their clinical presentations?"
    back: "Eruptive (1-5mm erythematous-to-yellow papules), tuberous (<3cm yellow-orange papules/nodules), tendinous (smooth firm skin-colored nodules), plane (soft yellow thin plaques).\n\nXanthomas are localized lipid deposits in the skin. The type correlates with underlying metabolic abnormality."
    difficulty: easy
    tags: [dermatology, metabolic_disorders, lipids, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "How is venous lake distinguished from malignant pigmented lesions?"
    back: "Diascopy - compression with a glass slide blanches the lesion because it consists of a dilated venule.\n\nVenous lakes are benign blue-violaceous papular lesions on the face, lips, and ears. Unlike melanoma, they blanch with pressure."
    difficulty: easy
    tags: [dermatology, vascular_lesions, diagnosis, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the management for cherry angiomas?"
    back: "Usually no treatment needed. Laser or electrocautery for cosmetic removal of small lesions. Excision for large lesions if necessary.\n\nCherry angiomas are benign and do not require treatment unless patient desires removal for cosmetic reasons."
    difficulty: easy
    tags: [dermatology, vascular_tumors, treatment, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the treatment for spider angioma?"
    back: "Reassurance is often sufficient. Electrodesiccation or laser surgery if patient desires treatment for cosmetic reasons.\n\nSpider angiomas are benign and often improve with treatment of underlying cause (e.g., liver disease, hormonal changes)."
    difficulty: easy
    tags: [dermatology, vascular_tumors, treatment, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What percentage of newborns have salmon patches (nevus simplex)?"
    back: "Present in approximately 3% of newborns.\n\nSalmon patches are common birthmarks, most frequently on the glabella ('Angel Kiss') or nuchal region ('Stork Bites')."
    difficulty: easy
    tags: [dermatology, vascular_malformations, pediatrics, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the keratinocyte to melanocyte ratio in the basal layer?"
    back: "10:1\n\nDespite this ratio, melanocyte numbers are equal among all races, explaining why skin color differences relate to melanosome activity rather than cell number."
    difficulty: easy
    tags: [dermatology, melanocytes, cell biology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What do melanocytes produce and what is their function?"
    back: "Melanosomes containing melanin, which are transferred to keratinocytes to provide UV protection\n\nMelanin absorbs ultraviolet radiation and is transferred via dendrites to surrounding keratinocytes, providing a protective barrier against sun damage."
    difficulty: easy
    tags: [dermatology, melanocytes, pigmentation, UV protection, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the function of Merkel cells?"
    back: "Touch sensation (located in stratum basale)\n\nMerkel cells are specialized mechanoreceptors that respond to light touch and texture, connecting to nerve endings in the dermis."
    difficulty: easy
    tags: [dermatology, Merkel cells, sensation, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the pilosebaceous unit composed of?"
    back: "Hair + hair follicle + sebaceous gland + arrector pili muscle\n\nThe pilosebaceous unit is a complex structure where these components work together for hair production and sebum secretion."
    difficulty: easy
    tags: [dermatology, pilosebaceous unit, hair anatomy, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Where are sebaceous glands ABSENT?"
    back: "Non-hair bearing areas: palms, soles, and lips\n\nSebaceous glands are found throughout haired skin but are notably absent from acral surfaces lacking hair follicles."
    difficulty: easy
    tags: [dermatology, sebaceous glands, anatomical distribution, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Where are apocrine sweat glands found and what is their function?"
    back: "Concentrated in axillae and perineum; likely vestigial pheromone production in humans\n\nApocrine glands are not part of the pilosebaceous unit; their duct empties into hair follicles above the sebaceous gland."
    difficulty: easy
    tags: [dermatology, apocrine glands, sweat glands, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "How does skin contribute to thermal regulation in cool environments?"
    back: "Peripheral vasoconstriction, hair insulation, and subcutaneous adipose tissue\n\nThese mechanisms reduce heat loss from the body surface by minimizing blood flow and providing insulating barriers."
    difficulty: easy
    tags: [dermatology, thermoregulation, physiology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the size threshold distinguishing a papule from a plaque?"
    back: "<1 cm diameter = papule; ≥1 cm diameter = plaque\n\nBoth are raised superficial lesions, but size is the distinguishing feature for clinical classification."
    difficulty: easy
    tags: [dermatology, primary lesions, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What distinguishes a macule from a patch?"
    back: "Size: macule <1 cm diameter; patch ≥1 cm diameter (both are flat lesions)\n\nBoth macules and patches are non-palpable, flat discolorations of the skin, distinguished solely by diameter."
    difficulty: easy
    tags: [dermatology, primary lesions, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What distinguishes a nodule from a tumour?"
    back: "Size: nodule is deep palpable (dermal/subcutaneous) <1 cm; tumour is ≥1 cm\n\nBoth are deep palpable lesions involving the dermis or subcutaneous tissue, differentiated only by size threshold."
    difficulty: easy
    tags: [dermatology, primary lesions, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the difference between a wheal and other papules/plaques?"
    back: "Wheal is transient (<24 hours), blanchable, often with halo and central clearing; formed by dermal edema\n\nWheals are characteristic of urticaria and represent temporary vascular permeability changes rather than permanent skin changes."
    difficulty: medium
    tags: [dermatology, wheal, urticaria, primary lesions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is a pustule?"
    back: "An elevated lesion containing a collection of neutrophils; can be infectious or inflammatory in nature\n\nPustules contain purulent material and are commonly seen in bacterial infections, pustular psoriasis, and other inflammatory conditions."
    difficulty: easy
    tags: [dermatology, pustule, inflammatory lesions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are the key differences between stratum lucidum and stratum granulosum?"
    back: "Stratum granulosum: flat cells with basophilic granules; Stratum lucidum: transparent layers of packed dead cells (more superficial)\n\nThe stratum lucidum is a translucent layer of highly compacted dead cells found only in thick skin (palms and soles), while stratum granulosum contains keratohyalin granules involved in keratinization."
    difficulty: medium
    tags: [dermatology, epidermis, histology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the main barrier property of the stratum corneum?"
    back: "Water-resistant protein keratin that prevents dehydration\n\nThe stratum corneum consists of flat scales of keratin that create a hydrophobic barrier, preventing water loss and blocking pathogen entry."
    difficulty: easy
    tags: [dermatology, stratum corneum, skin barrier, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What are the key clinical features of bullous pemphigoid?"
    back: "Chronic autoimmune bullous eruption with pruritic, tense, subepidermal bullae on erythematous or normal skin base; may present as urticarial plaques without bullae; common sites: flexor forearms, axillae, medial thighs, groin, abdomen; mouth involvement in 33%\n\nBullous pemphigoid is an autoimmune condition where IgG antibodies target basement membrane proteins BP180 and BP230, causing subepidermal blistering that appears as tense bullae."
    difficulty: easy
    tags: [dermatology, bullous-diseases, autoimmune, clinical-features, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "How do you diagnose bullous pemphigoid on immunofluorescence?"
    back: "Linear deposition of IgG and C3 along the basement membrane; serum shows anti-basement membrane antibodies (pemphigoid antibodies)\n\nDirect immunofluorescence of perilesional skin demonstrates the pathognomonic linear pattern of immunoglobulin and complement deposition at the basement membrane zone."
    difficulty: medium
    tags: [dermatology, bullous-diseases, immunofluorescence, diagnosis, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the key distinguishing feature between pemphigus vulgaris and bullous pemphigoid bullae?"
    back: "Pemphigus vulgaris: flaccid, superficial, intraepidermal bullae; Bullous pemphigoid: tense, deeper, subepidermal bullae\n\nThe depth and tension of blisters reflects the level of split in the skin - intraepidermal lesions in pemphigus are fragile (flaccid), while subepidermal lesions in pemphigoid are tense."
    difficulty: easy
    tags: [dermatology, bullous-diseases, differential-diagnosis, clinical-features, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What populations have higher prevalence of pemphigus vulgaris?"
    back: "Jewish, Mediterranean, and Asian populations; age 15-50 years; F>M below 20, M>F above 20\n\nThe higher prevalence in certain ethnic groups suggests genetic susceptibility. The reversal of gender distribution with age is a notable epidemiological feature."
    difficulty: easy
    tags: [dermatology, bullous-diseases, epidemiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "How does pemphigus foliaceus differ from pemphigus vulgaris?"
    back: "Pemphigus foliaceus is more superficial, targeting only desmoglein-1 (not desmoglein-3), appearing as crusted patches, erosions, and/or flaccid bullae starting on trunk; can be localized (managed with TCS) or widespread (treated like pemphigus vulgaris)\n\nDesmoglein-1 is more superficial than desmoglein-3, so antibodies against desmoglein-1 cause more superficial, localized blistering without mucosal involvement."
    difficulty: medium
    tags: [dermatology, bullous-diseases, differential-diagnosis, pathophysiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is Nikolsky's sign and how is it performed?"
    back: "Epidermal detachment with shear stress (lateral pressure applied to skin); positive in pemphigus vulgaris due to intraepidermal acantholysis\n\nThe sign reflects loss of cell-cell adhesion in the epidermis. It is classic for pemphigus vulgaris but can also be positive in other conditions with superficial epidermal fragility."
    difficulty: easy
    tags: [dermatology, clinical-examination, pemphigus, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "How do you diagnose porphyria cutanea tarda?"
    back: "Urine with HCl 5% shows orange-red fluorescence under Wood's lamp; 24h urine has elevated uroporphyrins; stool contains elevated coproporphyrins; immunofluorescence shows IgE at dermal-epidermal junctions\n\nMultiple confirmatory tests exist - urinary porphyrin analysis, stool porphyrins, and Wood's lamp examination all help confirm the diagnosis."
    difficulty: hard
    tags: [dermatology, porphyria, diagnosis, laboratory, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the treatment for porphyria cutanea tarda?"
    back: "Discontinue aggravating substances (alcohol, estrogen); phlebotomy to decrease iron load; low-dose hydroxychloroquine\n\nManagement focuses on removing precipitating factors and reducing iron stores or porphyrin accumulation. Hydroxychloroquine works by complexing with porphyrins to enhance their excretion."
    difficulty: medium
    tags: [dermatology, porphyria, treatment, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the key diagnostic criteria for drug reactions according to Naranjo et al.?"
    back: "1) Temporal relationship between drug exposure and reaction, 2) Recognized response to suspected drug, 3) Improvement after drug withdrawal, 4) Recurrence on re-challenge. Definite=4 criteria, Probable=1-3 criteria, Possible=only criterion 1\n\nThis standardized scoring system helps clinicians attribute cutaneous reactions to specific medications with varying levels of certainty."
    difficulty: medium
    tags: [dermatology, drug-eruptions, diagnosis, clinical-reasoning, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the mortality rate of untreated/unrecognized DRESS syndrome?"
    back: "10% mortality if severe, undiagnosed, and untreated\n\nThe high mortality reflects severe organ involvement (fulminant hepatitis, renal failure) and underscores the importance of early recognition and aggressive treatment."
    difficulty: easy
    tags: [dermatology, drug-eruptions, DRESS, prognosis, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "How is DRESS syndrome treated?"
    back: "Discontinue offending drug immediately; prednisone 0.5 mg/kg/d; consider cyclosporine if steroids inadequate; may progress to exfoliative dermatitis/erythroderma if untreated\n\nPrompt drug withdrawal is critical. Systemic corticosteroids are the mainstay, but the prolonged course often requires careful steroid tapering over weeks to months."
    difficulty: medium
    tags: [dermatology, drug-eruptions, DRESS, treatment, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the time course for drug-induced urticaria/angioedema?"
    back: "Onset within 1 day after exposure, depending on the immunologic mechanism (IgE-mediated reactions occur faster than non-IgE-mediated)\n\nThe rapid onset distinguishes drug-induced urticaria from other drug eruptions with longer latency periods like DRESS or maculopapular eruptions."
    difficulty: easy
    tags: [dermatology, drug-eruptions, urticaria, time-course, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the second most common cutaneous drug reaction?"
    back: "Drug-induced urticaria and angioedema (after exanthematous reactions)\n\nUrticarial reactions are common and can be potentially life-threatening due to their association with anaphylaxis and airway involvement."
    difficulty: easy
    tags: [dermatology, drug-eruptions, urticaria, epidemiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What neurological associations exist with bullous pemphigoid?"
    back: "One or more neurologic disorders are present in 22-46% of bullous pemphigoid cases\n\nThis strong neurological association suggests shared autoimmune pathogenesis or that neurological disease may trigger bullous pemphigoid development."
    difficulty: easy
    tags: [dermatology, bullous-diseases, neurological-associations, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are refractory treatment options for bullous pemphigoid?"
    back: "IVIg, rituximab, dupilumab, or omalizumab for refractory cases\n\nWhen conventional therapy with steroids and immunosuppressants fails, targeted biologics offer alternative mechanisms of action for disease control."
    difficulty: medium
    tags: [dermatology, bullous-diseases, treatment, biologics, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the age of onset and gender distribution of bullous pemphigoid?"
    back: "Mean age of onset: 60-80 years; female equals male (F=M)\n\nBullous pemphigoid predominantly affects elderly patients, reflecting the age-related changes in immune regulation and basement membrane proteins."
    difficulty: easy
    tags: [dermatology, bullous-diseases, epidemiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the prognosis of bullous pemphigoid?"
    back: "Heals without scarring, usually chronic; rarely fatal\n\nUnlike pemphigus vulgaris, bullous pemphigoid typically heals without scarring and has a better overall prognosis with appropriate treatment."
    difficulty: easy
    tags: [dermatology, bullous-diseases, prognosis, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What does immunofluorescence show in Bullous Pemphigoid?"
    back: "Linear deposition of IgG and C3 along the basement membrane zone\n\nThis linear pattern at the dermal-epidermal junction is pathognomonic for bullous pemphigoid, distinguishing it from pemphigus vulgaris which shows intercellular IgG deposits."
    difficulty: easy
    tags: [dermatology, immunofluorescence, bullous-disease, diagnostics, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "How does the Nikolsky sign differ between Pemphigus Vulgaris and Bullous Pemphigoid?"
    back: "Nikolsky sign is POSITIVE in Pemphigus Vulgaris (intraepidermal blistering allows easy epidermal separation) but NEGATIVE in Bullous Pemphigoid (subepidermal blisters maintain epidermal integrity)\n\nThe depth of blister formation determines the Nikolsky sign result. Pemphigus vulgaris affects the intraepidermal desmogleins causing loss of cell-cell adhesion throughout the epidermis."
    difficulty: medium
    tags: [dermatology, clinical-signs, pemphigus, pemphigoid, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What distinguishes Pemphigus Foliaceus from Pemphigus Vulgaris?"
    back: "Pemphigus Foliaceus is more superficial (targets only desmoglein-1), presents with crusted patches and erosions rather than bullae, and is localized to the trunk; it is NOT associated with mucosal involvement\n\nBecause desmoglein-1 is expressed only in the superficial epidermis, pemphigus foliaceus causes more superficial blistering without the mucosal involvement seen in pemphigus vulgaris."
    difficulty: medium
    tags: [dermatology, pemphigus, comparative, desmoglein, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the treatment approach for Porphyria Cutanea Tarda?"
    back: "Discontinue aggravating substances (alcohol, estrogen therapy); phlebotomy to reduce body iron load; low-dose hydroxychloroquine\n\nPhlebotomy depletes iron stores which are essential for the pathophysiology. Hydroxychloroquine works by complexing with porphyrins and enhancing their urinary excretion."
    difficulty: medium
    tags: [dermatology, treatment, porphyria, phlebotomy, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the four criteria for diagnosing drug reactions (Naranjo et al.)?"
    back: "1. Temporal relationship between drug exposure and reaction; 2. Recognized response to suspected drug; 3. Improvement after drug withdrawal; 4. Recurrence of reaction on re-challenge. Definite = all 4; Probable = criteria 1-3; Possible = criterion 1 only\n\nThe Naranjo algorithm provides a standardized approach to adverse drug reaction causality assessment. Re-challenge (criterion 4) is only performed when absolutely necessary due to risk."
    difficulty: medium
    tags: [dermatology, drug-reactions, pharmacology, diagnostics, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the treatment for DRESS syndrome?"
    back: "Immediate discontinuation of the offending drug plus prednisone 0.5 mg/kg/day; consider cyclosporine if steroids are inadequate\n\nPrompt drug withdrawal is critical. Systemic corticosteroids suppress the severe inflammatory response, but the condition may persist for weeks even after drug cessation."
    difficulty: medium
    tags: [dermatology, DRESS, treatment, corticosteroids, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What distinguishes Bullous Pemphigoid from Pemphigus Vulgaris clinically?"
    back: "Bullous Pemphigoid: TENSE bullae (subepidermal), pruritic, Nikolsky negative; Pemphigus Vulgaris: FLACCID bullae (intraepidermal), non-pruritic, Nikolsky positive; Pemphigus is superficial (intraepidermal), Pemphigoid is deeper (dermal-epidermal junction)\n\nThe 'oid' suffix in pemphigoid indicates it resembles pemphigus but is at a different anatomic level. Tense vs flaccid is the most clinically useful distinguishing feature at the bedside."
    difficulty: medium
    tags: [dermatology, pemphigoid, pemphigus, differential-diagnosis, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What neurologic associations exist with Bullous Pemphigoid?"
    back: "22-46% of bullous pemphigoid patients have one or more neurologic disorders, reflecting shared antigen expression between skin and neural tissue (BP180/BP230 are also expressed in the nervous system)\n\nThis strong neurologic association with bullous pemphigoid suggests a shared epitope between the skin basement membrane and neural tissue, possibly explaining the autoimmune targeting."
    difficulty: medium
    tags: [dermatology, neurology, autoimmune, paraneoplastic, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the prognosis of untreated Pemphigus Vulgaris?"
    back: "May be fatal unless treated with immunosuppressive agents; lesions heal with hyperpigmentation but do not scar\n\nBefore the advent of corticosteroids, pemphigus vulgaris had high mortality. Even with scarring absent, the erosive disease and secondary infections were often fatal."
    difficulty: easy
    tags: [dermatology, pemphigus, prognosis, autoimmune, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What refractory treatment options exist for Bullous Pemphigoid?"
    back: "IVIg, rituximab, dupilumab, or omalizumab\n\nFor patients who fail conventional therapy with steroids and steroid-sparing agents, these biologic agents target specific immune pathways. Rituximab is a B-cell depleter, while dupilumab and omalizumab target IgE-mediated pathways."
    difficulty: hard
    tags: [dermatology, treatment, biologics, refractory, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the clinical features of Bullous Pemphigoid?"
    back: "Chronic autoimmune bullous eruption with pruritic, tense, subepidermal bullae on erythematous or normal skin base. May present as urticarial plaques without bullae. Common sites: flexor forearms, axillae, medial thighs, groin, abdomen, mouth (33%).\n\nBullous pemphigoid is an autoimmune condition targeting dermal-epidermal basement membrane proteins BP180 and BP230."
    difficulty: easy
    tags: [dermatology, bullous-disease, autoimmune, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What investigation shows the pathognomonic finding in Bullous Pemphigoid?"
    back: "Immunofluorescence shows linear deposition of IgG and C3 along the basement membrane. Anti-basement membrane antibody (IgG) is detectable in serum.\n\nDirect immunofluorescence is the gold standard for confirming bullous pemphigoid diagnosis."
    difficulty: medium
    tags: [dermatology, immunofluorescence, diagnostics, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What distinguishes Pemphigus Vulgaris clinically from Bullous Pemphigoid?"
    back: "Pemphigus Vulgaris: flaccid, non-pruritic, INTRAEPIDERMAL bullae/vesicles. Nikolsky's sign positive. Sites: mouth (90%), scalp, face, chest, axillae, groin, umbilicus. Asboe-Hansen sign positive.\n\nThe key distinction is flaccid vs tense lesions and intraepidermal vs subepidermal location."
    difficulty: medium
    tags: [dermatology, bullous-disease, differential-diagnosis, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "How is DRESS syndrome managed?"
    back: "Discontinue offending drug immediately + prednisone 0.5 mg/kg/d. Consider cyclosporine if steroids inadequate. Can progress to generalized exfoliative dermatitis/erythroderma if drug not stopped. 10% mortality if severe/untreated.\n\nPrompt drug withdrawal is critical as mortality can reach 10% in severe, untreated cases."
    difficulty: medium
    tags: [dermatology, treatment, drug-reactions, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the 4 criteria for diagnosing drug reactions (Naranjo et al.)?"
    back: "1) Temporal relationship between drug exposure and reaction, 2) Recognized response to suspected drug, 3) Improvement after drug withdrawal, 4) Recurrence of reaction on re-challenge. Definite = all 4 criteria. Probable = criteria 1-3. Possible = criterion 1 only.\n\nThese standardized criteria help establish causality between drug exposure and adverse reaction."
    difficulty: medium
    tags: [dermatology, drug-reactions, diagnostics, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the key mnemonic distinguishing Pemphigoid vs Vulgaris?"
    back: "Pemphigoid = Deeper, TENSE lesions at dermal-epidermal junction (autoantibodies to BP180/230). Pemphigus Vulgaris = Superficial, FLACCID, INTRAEPIDERMAL lesions (autoantibodies to desmogleins 1/3).\n\nTense vs flaccid bullae is the key clinical distinction between these two autoimmune blistering disorders."
    difficulty: easy
    tags: [dermatology, bullous-disease, mnemonic, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "How is Porphyria Cutanea Tarda managed?"
    back: "1) Discontinue aggravating substances (alcohol, estrogen), 2) Phlebotomy to reduce body iron load, 3) Low-dose hydroxychloroquine.\n\nTreatment aims to remove precipitating factors and reduce hepatic iron and porphyrin accumulation."
    difficulty: medium
    tags: [dermatology, treatment, porphyria, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What treatments are available for lice infestation?"
    back: "Permethrin 1% (Nix cream rinse, RC & Cor shampoo, Kwellada-P shampoo) as first-line. Comb hair with fine-toothed comb using dilute vinegar solution to remove nits. Repeat treatment 7 days after first treatment. Shave hair if feasible and change clothing/linens, washing with detergent in hot water cycle.\n\nThe ovicidal properties of permethrin combined with mechanical removal of nits and environmental decontamination provide comprehensive treatment."
    difficulty: easy
    tags: [lice, pediculosis, treatment, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the characteristic clinical description of bed bug bites?"
    back: "Burning wheals that turn to firm papules, often in groups of three, described as 'breakfast, lunch, and dinner,' occurring on areas with easy access such as face, neck, arms, legs, and hands.\n\nThe classic triad pattern of bed bug bites is a helpful clinical clue, though diagnosis is often one of exclusion after ruling out other insect bites and skin conditions."
    difficulty: easy
    tags: [bed-bugs, dermatology, insect-bites, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the treatment regimen for primary genital herpes?"
    back: "Acyclovir 400 mg PO three times daily for 7-10 days for first episode. Also test and treat concurrent STIs, provide pain control with sitz baths, and analgesia.\n\nAntiviral therapy缩短s duration of symptoms and viral shedding in primary infection, and should be combined with comprehensive STI screening given high co-infection rates."
    difficulty: easy
    tags: [HSV, genital-herpes, treatment, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the options for managing recurrent genital herpes (suppressive vs. episodic therapy)?"
    back: "Suppressive therapy: acyclovir 400 mg PO twice daily. Episodic therapy: acyclovir 800 mg PO three times daily for 5 days, or three times daily for 2 days, started during prodromal phase or within 1 day of lesion onset. Famciclovir and valacyclovir are alternatives with better enteric absorption and less frequent dosing.\n\nSuppressive therapy is preferred for patients with frequent recurrences (≥6 episodes/year), while episodic therapy is suitable for those with infrequent outbreaks."
    difficulty: medium
    tags: [HSV, genital-herpes, treatment, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the key histological difference between Bullous Pemphigoid and Pemphigus Vulgaris?"
    back: "Bullous Pemphigoid has subepidermal (tense) bullae, while Pemphigus Vulgaris has intraepidermal (flaccid) bullae\n\nThis distinction reflects the different target antigens: BP180/BP230 are at the dermal-epidermal junction (hemidesmosomes), while desmogleins are within the epidermis (intercellular adhesion)"
    difficulty: medium
    tags: [dermatology, bullous-disease, immunofluorescence, pathophysiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the clinical features distinguishing Pemphigus Vulgaris from Bullous Pemphigoid?"
    back: "Pemphigus Vulgaris: flaccid bullae, oral mucosal involvement (90%), positive Nikolsky sign, Asboe-Hansen sign; Bullous Pemphigoid: tense bullae, rare mucosal involvement (33%), negative Nikolsky sign\n\nThe flaccid nature of pemphigus bullae reflects intraepidermal splitting, while the tense bullae of pemphigoid reflect subepidermal separation"
    difficulty: medium
    tags: [dermatology, pemphigus-vulgaris, bullous-pemphigoid, clinical-features, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is Nikolsky's sign and in which conditions is it positive?"
    back: "Epidermal detachment with shear stress; positive in Pemphigus Vulgaris, Staphylococcal Scalded Skin Syndrome, and Toxic Epidermal Necrolysis\n\nNikolsky sign reflects loss of intercellular adhesion in the epidermis, indicating intraepidermal blistering mechanisms"
    difficulty: easy
    tags: [dermatology, diagnostic-sign, pemphigus, staphylococcal-infection, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What are the four criteria for diagnosing a drug reaction (Naranjo classification)?"
    back: "1) Temporal relationship between drug exposure and reaction, 2) Recognized response to suspected drug, 3) Improvement after drug withdrawal, 4) Recurrence on re-challenge\n\nDefinite reaction requires all 4 criteria; probable requires 1-3; possible requires only criterion 1"
    difficulty: easy
    tags: [dermatology, drug-reaction, diagnosis, pharmacology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the time course for DRESS syndrome onset and resolution?"
    back: "Onset 1-6 weeks after first drug exposure; symptoms persist for weeks after drug withdrawal\n\nThis prolonged time course distinguishes DRESS from other drug reactions and reflects the underlying immune dysregulation"
    difficulty: medium
    tags: [dermatology, DRESS, drug-reaction, timeline, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What treatment is recommended for DRESS syndrome?"
    back: "Discontinue offending drug plus prednisone 0.5 mg/kg/d; consider cyclosporine if steroids are inadequate\n\nPrompt drug withdrawal is critical; systemic corticosteroids suppress the severe hypersensitivity response and prevent progression to exfoliative dermatitis"
    difficulty: medium
    tags: [dermatology, DRESS, treatment, immunosuppression, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What complication can occur if DRESS is not treated promptly?"
    back: "Progression to generalized exfoliative dermatitis/erythroderma\n\nContinued drug exposure and uncontrolled immune activation can lead to widespread skin involvement with significant morbidity and mortality"
    difficulty: medium
    tags: [dermatology, DRESS, complications, erythroderma, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What second-line treatments exist for refractory Bullous Pemphigoid?"
    back: "IVIg, rituximab, dupilumab, or omalizumab\n\nThese biologic agents target specific immune pathways and are reserved for cases resistant to conventional corticosteroid and immunosuppressant therapy"
    difficulty: hard
    tags: [dermatology, bullous-pemphigoid, biologics, treatment, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "How can you distinguish a spider angioma clinically?"
    back: "Blanching with pressure applied to the central red arteriole (like the tip of a paperclip)\n\nThe central arteriole of a spider angioma blanches with compression, and pulsation may be felt at the central point."
    difficulty: easy
    tags: [dermatology, clinical examination, spider angioma, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the management for cherry angioma (Campbell de Morgan spot)?"
    back: "Usually no treatment needed; laser or electrocautery for small lesions, excision for large lesions if necessary\n\nCherry angiomas are benign, occur in >30 year olds, and lesions do not fade. Treatment is only for cosmetic reasons or if bleeding."
    difficulty: easy
    tags: [dermatology, vascular tumors, cherry angioma, treatment, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the clinical feature of venous lake and where does it occur?"
    back: "Benign blue or violaceous papular lesion occurring on the face, lips, and ears due to dilation of a venule\n\nVenous lakes are distinguished from malignant pigmented lesions through diascopy—compression blanches the lesion."
    difficulty: easy
    tags: [dermatology, vascular lesions, venous lake, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What investigations should be performed for suspected xanthoma?"
    back: "Biopsy (shave, punch, or excisional) and fasting lipid panel (except for verruciform xanthoma)\n\nBiopsy confirms the diagnosis histologically. A fasting lipid panel identifies underlying dyslipidemia that may require treatment."
    difficulty: easy
    tags: [dermatology, diagnosis, investigations, xanthoma, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the variants of xanthoma and their clinical descriptions?"
    back: "Eruptive xanthoma (1-5mm erythematous-to-yellow papules); tuberous xanthoma (<3cm yellow-to-orange papules/nodules); tendinous xanthoma (smooth, firm, mobile, skin-coloured nodules); plane xanthoma (soft, yellow, thin plaques)\n\nDifferent xanthoma variants have distinct clinical appearances and associations, helping guide diagnosis and workup."
    difficulty: easy
    tags: [dermatology, xanthoma, clinical features, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What adverse effects are associated with benzoyl peroxide treatment?"
    back: "Erythema, pruritus, and skin burning; higher withdrawal rates than placebo (RR 2.13)\n\nBenzoyl peroxide can cause local skin irritation. The Cochrane review found higher withdrawal rates due to adverse effects compared to no treatment."
    difficulty: easy
    tags: [dermatology, acne, treatment, adverse effects, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the typical clinical course of pyogenic granuloma?"
    back: "Rapidly developing hemangioma over weeks to months, then stabilizes; may persist indefinitely if untreated\n\nPyogenic granuloma grows rapidly initially but then stabilizes. Unlike involuting hemangiomas, these lesions do not spontaneously regress."
    difficulty: easy
    tags: [dermatology, pyogenic granuloma, clinical course, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the management for spider angioma?"
    back: "Reassurance; electrodesiccation or laser surgery if patient wishes\n\nSpider angiomas are benign and increase in number over time. Treatment is purely cosmetic using electrodesiccation or laser ablation."
    difficulty: easy
    tags: [dermatology, spider angioma, treatment, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is diascopy and how is it used clinically?"
    back: "Application of pressure to a skin lesion to observe blanching; distinguishes vascular lesions from pigmented lesions\n\nDiascopy helps differentiate between vascular tumors (which blanch) and pigmented lesions (which do not), as demonstrated with venous lakes."
    difficulty: easy
    tags: [dermatology, clinical examination, physical examination, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "Which sites are commonly affected by scabies, and which area is typically spared in adults?"
    back: "Common sites: axillae, groin, buttocks, hands/feet (especially web spaces); Head and neck are typically spared in adults (but affected in infants)\n\nScabies mites prefer warm, moist areas with thin skin. In adults, the head and neck are spared, but infants may have involvement there."
    difficulty: easy
    tags: [scabies, clinical features, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the classic description of bed bug bite pattern?"
    back: "\"Breakfast, lunch, and dinner\" - groups of three bites in areas with easy access (face, neck, arms, legs, hands)\n\nBed bugs feed multiple times during a blood meal, creating characteristic linear or clustered patterns of bites as they move across the skin."
    difficulty: easy
    tags: [bed bugs, clinical features, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the clinical description of herpes simplex virus lesions?"
    back: "Herpetiform (grouped) vesicles on an erythematous base on skin or mucous membranes\n\nThe classic appearance of grouped vesicles on a red base is pathognomonic for HSV infection and helps distinguish it from other vesicular conditions."
    difficulty: easy
    tags: [HSV, clinical features, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the first-line treatment for scabies and what are the key application instructions?"
    back: "Permethrin 5% cream (Nix) applied from neck down to soles of feet, left on for 8-14 hours, with a second treatment required 7 days after the first.\n\nPermethrin is a topical insecticide that kills scabies mites and eggs. The second application at day 7 is critical to eliminate newly hatched mites before they can reinfest."
    difficulty: easy
    tags: [scabies, parasitic-infection, treatment, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What treatment is used for head lice and what additional measures are required?"
    back: "Permethrin 1% (Nix cream rinse, RC & Cor shampoo, or Kwellada-P shampoo) applied as directed, with repeat treatment in 7 days. Fine-toothed combing with dilute vinegar solution removes nits.\n\nThe ovicidal activity of permethrin kills hatching eggs, but the 7-day retreatment kills any remaining lice from eggs that survived the first application due to imperfect coverage."
    difficulty: easy
    tags: [lice, pediculosis, treatment, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the characteristic presentation of bed bug bites?"
    back: "Burning wheals that evolve into firm papules, characteristically appearing in groups of three ('breakfast, lunch, and dinner') on exposed areas like face, neck, arms, and legs.\n\nEach bed bug feeds sequentially in a linear pattern, creating the distinctive triad of lesions. The bites occur on accessible skin surfaces as bed bugs cannot penetrate clothing."
    difficulty: easy
    tags: [bed-bugs, insect-bites, clinical-features, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the classic morphology of erythema multiforme (EM)?"
    back: "Target lesions: macules/papules with central vesicles surrounded by concentric rings of normal skin, pallor, and erythema creating a 'bull's-eye' or 'target' pattern.\n\nThe target appearance reflects different levels of epidermal injury and inflammation. Lesions appear on acral surfaces and often symmetrically distributed."
    difficulty: easy
    tags: [erythema-multiforme, morphology, clinical-features, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the classic presentation of bed bug bites?"
    back: "Burning wheals that turn into firm papules, often in groups of three — 'breakfast, lunch, and dinner' pattern — on exposed areas with easy access (face, neck, arms, legs, hands).\n\nThe linear triplet pattern is pathognomonic for bed bug bites and helps differentiate from other insect bites or urticaria."
    difficulty: easy
    tags: [bed bugs, Cimex lectularius, insect bites, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are treatment options for Sézary syndrome?"
    back: "Oral retinoids and IFN, extracorporeal photopheresis, total skin electron beam radiation, UV therapy maintenance, other chemotherapy agents\n\nSézary syndrome requires systemic therapy due to its systemic nature. Extracorporeal photopheresis is particularly effective, using UV light to treat blood passing through an extracorporeal circuit."
    difficulty: medium
    tags: [Sézary syndrome, treatment, photopheresis, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "Describe the pattern of male-pattern androgenetic alopecia"
    back: "Fronto-temporal areas progressing to vertex, eventual entire scalp may be bald\n\nThis follows the Norwood-Hamilton classification. The fronto-temporal recession is often the first sign, with progression toward vertex balding."
    difficulty: easy
    tags: [androgenetic alopecia, male-pattern baldness, alopecia, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "Describe the pattern of female-pattern androgenetic alopecia"
    back: "Widening of central part producing a 'Christmas tree' pattern\n\nUnlike men, women typically maintain their frontal hairline. The central part widens diffusely, creating the characteristic pattern visible when hair is parted."
    difficulty: easy
    tags: [androgenetic alopecia, female-pattern baldness, alopecia, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is Telogen Effluvium and when does hair loss typically occur after the precipitating event?"
    back: "Uniform decrease in hair density due to hairs prematurely entering telogen phase; hair loss typically occurs 2-4 months after exposure to the precipitant\n\nThis delayed response reflects the time needed for hairs to complete their transition through catagen and shed from telogen follicles."
    difficulty: medium
    tags: [telogen effluvium, alopecia, hair loss, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "When does hair loss typically appear after chemotherapy in Anagen Effluvium?"
    back: "Hair loss 7-14 days after single pulse of chemotherapy; most clinically apparent after 1-2 months\n\nThe timing reflects the duration needed for affected hairs to break at the shaft (weakest point) and shed. Anagen effluvium typically causes more rapid and extensive shedding than telogen effluvium."
    difficulty: medium
    tags: [anagen effluvium, chemotherapy, timing, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What are the three defining features of Sézary syndrome?"
    back: "Erythroderma, lymphadenopathy, and WBC >20 x 10^9/L with Sézary cells\n\nSézary syndrome is a widespread systemic form of cutaneous T-cell lymphoma with these three hallmark features and high mortality."
    difficulty: easy
    tags: [sézary syndrome, cutaneuous T-cell lymphoma, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the investigation of choice for Kaposi sarcoma?"
    back: "Biopsy and PCR for HHV-8 DNA sequences\n\nHistopathology confirms the diagnosis while PCR can identify HHV-8 DNA, establishing the viral etiology."
    difficulty: easy
    tags: [kaposi sarcoma, diagnosis, investigations, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is telogen effluvium and what is its typical timeline?"
    back: "Uniform decrease in hair density due to hairs prematurely entering telogen phase; hair loss typically occurs 2-4 months after the precipitating event\n\nTelogen effluvium is a reactive hair shedding disorder triggered by physiological stressors that shift follicles from growth to rest prematurely."
    difficulty: medium
    tags: [telogen effluvium, alopecia, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "When does hair loss typically occur after chemotherapy in anagen effluvium?"
    back: "Hair loss occurs 7-14 days after a single pulse of chemotherapy; most clinically apparent after 1-2 months\n\nAnagen effluvium from chemotherapy has a dose-dependent effect on the actively dividing hair matrix cells, causing rapid shedding followed by regrowth after cessation."
    difficulty: medium
    tags: [anagen effluvium, chemotherapy, alopecia, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the treatment for Sézary syndrome?"
    back: "Oral retinoids and IFN, extra-corporeal photopheresis, total skin electron beam radiation, UV therapy maintenance, and other chemotherapy agents\n\nSézary syndrome requires systemic therapy due to its aggressive nature, combining immunomodulatory and cytotoxic approaches."
    difficulty: medium
    tags: [sézary syndrome, treatment, photopheresis, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What etiologic agent is required for Kaposi Sarcoma to develop?"
    back: "Human Herpesvirus 8 (HHV-8), also known as Kaposi Sarcoma Herpesvirus (KSHV)\n\nHHV-8 is found in all forms of Kaposi sarcoma and is necessary for oncogenesis, though immunosuppression influences clinical expression."
    difficulty: easy
    tags: [kaposi sarcoma, virology, HHV-8, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What hormonal mechanism drives Androgenetic Alopecia?"
    back: "Dihydrotestosterone (DHT) acting on genetically susceptible hair follicles via the androgen receptor\n\nDHT causes miniaturization of terminal hairs to vellus hairs in patterned distribution. 5-alpha-reductase converts testosterone to DHT."
    difficulty: medium
    tags: [androgenetic alopecia, androgens, DHT, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the characteristic pattern of hair loss in female androgenetic alopecia?"
    back: "Widening of the central part with a 'Christmas tree' pattern, preserving the frontal hairline\n\nUnlike males, women typically maintain the frontal hairline with diffuse thinning over the crown in a Christmas tree distribution."
    difficulty: easy
    tags: [androgenetic alopecia, female pattern hair loss, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What agents commonly cause Anagen Effluvium besides chemotherapy?"
    back: "Bismuth, levodopa, colchicine, cyclosporine, thallium, boron, and arsenic\n\nThese agents directly interfere with hair follicle mitosis or are directly toxic to the hair matrix."
    difficulty: medium
    tags: [anagen effluvium, drugs, toxins, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What treatment options exist for Sézary Syndrome?"
    back: "Oral retinoids, interferon-alpha, extra-corporeal photopheresis, total skin electron beam radiation, UV therapy maintenance, and other chemotherapy agents\n\nSézary syndrome requires systemic therapy due to its leukemic nature and is generally more aggressive than mycosis fungoides."
    difficulty: medium
    tags: [sézary syndrome, treatment, photopheresis, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What virus is required for the development of Kaposi sarcoma?"
    back: "Human herpesvirus 8 (HHV-8), also known as Kaposi sarcoma-associated herpesvirus (KSHV)\n\nHHV-8 is necessary for Kaposi sarcoma development, though additional factors like immunosuppression influence disease manifestation."
    difficulty: easy
    tags: [dermatology, Kaposi sarcoma, virology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "How is the diagnosis of Kaposi sarcoma confirmed?"
    back: "Biopsy showing characteristic spindle cells and vascular proliferation; PCR can identify HHV-8 DNA sequences\n\nHHV-8 PCR is a specific test that supports the diagnosis when clinical and histological features are equivocal."
    difficulty: medium
    tags: [dermatology, Kaposi sarcoma, diagnosis, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the clinical presentation of androgenetic alopecia in males vs females?"
    back: "Males: fronto-temporal areas progressing to vertex, entire scalp may become bald. Females: widening of central part with 'Christmas tree' pattern\n\nThe pattern reflects differential sensitivity to androgens in hair follicles of varying scalp regions."
    difficulty: easy
    tags: [dermatology, androgenetic alopecia, clinical features, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the timeline for hair loss after chemotherapy in anagen effluvium?"
    back: "Hair loss occurs 7-14 days after a single pulse of chemotherapy and is most clinically apparent after 1-2 months\n\nThe timing depends on the hair cycle phase at time of exposure and the growth rate of scalp hair."
    difficulty: medium
    tags: [dermatology, anagen effluvium, chemotherapy, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What population is most commonly affected by cutaneous T-cell lymphoma and what is the male-to-female ratio?"
    back: "Most commonly seen in patients over 50 years of age with a male-to-female ratio of 2:1\n\nThe male predominance is consistent across most epidemiologic studies of this condition."
    difficulty: easy
    tags: [dermatology, cutaneous T-cell lymphoma, epidemiology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is poikiloderma and which subtype of cutaneous T-cell lymphoma is it associated with?"
    back: "Poikiloderma is a combination of atrophy, telangiectasia, hyperpigmentation, and hypopigmentation, and is associated with mycosis fungoides\n\nThis finding reflects the chronic nature of the disease and dermal damage from long-standing inflammation."
    difficulty: easy
    tags: [dermatology, mycosis fungoides, clinical features, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What characterizes Mycosis Fungoides clinically?"
    back: "Atrophic scaling, erythematous patches/plaques/nodules/tumors with possible pruritus and poikiloderma (atrophy, telangiectasia, hyper/hypopigmentation), commonly on trunk, buttocks, and proximal limbs\n\nMycosis fungoides is the most common cutaneous T-cell lymphoma, typically presenting with these skin findings in middle-aged to older adults."
    difficulty: medium
    tags: [cutaneous T-cell lymphoma, mycosis fungoides, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the recommended dosing for valacyclovir for first episode genital herpes?"
    back: "1000mg PO BID x 3 days\n\nFor initial genital herpes infection, valacyclovir 1000mg is given twice daily for 3 days, while recurrent episodes use 500mg BID x 5 days."
    difficulty: easy
    tags: [dermatology, herpes, antiviral, valacyclovir, genital-infection, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What baseline monitoring is required before starting dapsone?"
    back: "G6PD deficiency testing (hemolysis risk) and baseline CBC\n\nDapsone can cause significant hemolytic anemia, particularly in patients with G6PD deficiency. CBC should be monitored weekly x4, then monthly x6, then every 6 months."
    difficulty: medium
    tags: [dermatology, dapsone, dermatitis-herpetiformis, hemolysis, monitoring, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is re-PUVA therapy?"
    back: "Combination of oral acitretin with PUVA phototherapy\n\nRe-PUVA combines systemic retinoid therapy with psoralen plus UVA light, providing synergistic effectiveness for severe psoriasis with reduced cumulative UV dose."
    difficulty: easy
    tags: [dermatology, psoriasis, acitretin, PUVA, phototherapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What CYP450 enzyme does itraconazole inhibit, and which drugs are affected?"
    back: "CYP3A4; increases concentration of statins and diabetic drugs\n\nItraconazole is a potent CYP3A4 inhibitor, causing significant drug interactions with medications metabolized by this pathway including HMG-CoA reductase inhibitors."
    difficulty: hard
    tags: [dermatology, itraconazole, CYP3A4, drug-interactions, antifungal, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the mechanism by which magnesium supplementation may protect the kidneys during cyclosporine therapy?"
    back: "Magnesium may reduce cyclosporine-induced afferent arteriolar vasoconstriction\n\nConcomitant magnesium administration is thought to protect renal function by modulating vascular tone and reducing the nephrotoxic effects of cyclosporine."
    difficulty: hard
    tags: [dermatology, cyclosporine, nephrotoxicity, magnesium, renal-protection, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the common sites of scabies infestation?"
    back: "Axillae, groin, buttocks, hands/feet (especially web spaces); spares head and neck except in infants\n\nScabies typically spares the face and scalp in adults but can affect the entire body in infants."
    difficulty: easy
    tags: [scabies, dermatology, clinical features, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the classic description of bed bug bites?"
    back: "Burning wheals turning to firm papules, often in groups of three - 'breakfast, lunch, and dinner'\n\nBed bug bites typically occur on areas with easy access: face, neck, arms, legs, and hands."
    difficulty: easy
    tags: [bed bugs, dermatology, clinical features, entomology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the etiology of bed bugs?"
    back: "Cimex lectularius, a small insect that feeds mainly at night and hides in crevices during the day\n\nBed bugs are not known to transmit infectious diseases but cause significant skin irritation."
    difficulty: easy
    tags: [bed bugs, dermatology, parasitic infection, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the clinical presentation of herpes zoster (shingles)?"
    back: "Unilateral dermatomal eruption occurring 3-5 days after pain and paresthesia of that dermatome\n\nLesions include vesicles, bullae, and pustules on an erythematous, edematous base that may last for weeks."
    difficulty: easy
    tags: [herpes zoster, shingles, dermatology, viral infection, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is Erythema Multiforme and what are its classic features?"
    back: "Target lesions with central vesicles and concentric light and dark rings (bull's-eye pattern); most often caused by HSV or Mycoplasma\n\nEM presents as macules/papules with central vesicles in a classic target or iris configuration."
    difficulty: medium
    tags: [erythema multiforme, dermatology, clinical features, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the management for lice infestation including bedding?"
    back: "Change clothing and linens; wash twice with detergent in hot water cycle, then machine dry\n\nAll contaminated items must be treated to prevent re-infestation."
    difficulty: easy
    tags: [lice, pediculosis, dermatology, treatment, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the clinical features of pubic lice (Phthirus pubis)?"
    back: "Nits attached to pubic hairs; excoriations from intense pruritus; can also affect axillary and facial hair\n\nPubic lice are typically sexually transmitted and cause significant discomfort."
    difficulty: easy
    tags: [lice, pubic lice, pediculosis, dermatology, STI, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the dosing protocol for Permethrin in scabies treatment?"
    back: "Apply 1% or 5% cream to all skin areas from neck down, leave on for 8-10 hours, repeat in 1 week\n\nPermethrin is a pyrethroid insecticide. Do not use in children <2 years or those with chrysanthemum sensitivity. Second application after 7 days may be considered."
    difficulty: easy
    tags: [dermatology, scabies, permethrin, topical therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the advantages of Pimecrolimus (Elidel®) 1% cream for atopic dermatitis?"
    back: "Can be used BID on all skin surfaces including face, neck, and intertriginous areas. Lacks adverse effects of steroids. Use for as long as lesions persist.\n\nPimecrolimus is a calcineurin inhibitor approved for mild to moderate AD in patients >3 months old. Main side effect is burning sensation."
    difficulty: easy
    tags: [dermatology, atopic dermatitis, pimecrolimus, topical therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the dosing for Valacyclovir (Valtrex®) in first episode vs recurrent genital herpes?"
    back: "First episode: 1000mg PO BID x 3 days. Recurrent: 500mg PO BID x 5 days.\n\nValacyclovir is a prodrug of acyclovir with better bioavailability. Reduce dose if impaired renal function."
    difficulty: easy
    tags: [dermatology, genital herpes, valacyclovir, antiviral, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for Cyclosporine (Neoral®) therapy?"
    back: "Baseline: BUN/Cr x2, BP x2, CBC, K+, Mg, lipid panel, uric acid, LFTs. Then q2 weeks x 3 months, then q monthly if stable.\n\nCyclosporine is an immunosuppressant used for psoriasis, lichen planus, and AD. Long-term use >2 years is discouraged due to nephrotoxicity and other adverse effects."
    difficulty: hard
    tags: [dermatology, psoriasis, cyclosporine, oral therapy, monitoring, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the baseline monitoring for Dapsone therapy?"
    back: "G6PD testing before treatment starts. CBC weekly x4, then monthly x6, then q6 months. LFTs at baseline and periodically.\n\nDapsone is used for dermatitis herpetiformis and neutrophilic dermatoses. Side effects include neuropathy and hemolysis (vitamin C and E may help prevent)."
    difficulty: hard
    tags: [dermatology, dermatitis herpetiformis, dapsone, oral therapy, monitoring, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the dosing for Ivermectin in onchocerciasis vs scabies?"
    back: "Onchocerciasis: 150-250 mcg/kg PO as single dose, repeat in 1 week. Scabies: 200-250 mcg/kg PO once, repeat one week later.\n\nIvermectin is not licensed for scabies in Canada but is efficacious. No significant serious side effects reported for onchocerciasis treatment."
    difficulty: medium
    tags: [dermatology, scabies, ivermectin, parasitic, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the maximum weekly dosage of Calcipotriol cream by age group?"
    back: ">14 years: 100g/week; 11-14 years: 75g/week; 6-10 years: 50g/week; <6 years: 25g/week\n\nCalcipotriol dosage is weight-based and limited due to risk of hypercalcemia with excessive use. Inactivated by light - do not apply before phototherapy."
    difficulty: medium
    tags: [dermatology, psoriasis, calcipotriol, dosing, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the dosing for Itraconazole in tinea pedis vs onychomycosis?"
    back: "Tinea pedis: 200mg PO BID x 3 days. Onychomycosis (toenails): 200mg PO BID x 3 days once per month, repeated 3x. Tinea corporis/cruris: 200mg PO daily x 7 days.\n\nItraconazole pulse dosing for onychomycosis allows high tissue concentrations while reducing toxicity. Capsule form must be swallowed whole with food."
    difficulty: medium
    tags: [dermatology, fungal, itraconazole, dosing, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the male pattern of androgenetic alopecia distribution?"
    back: "Fronto-temporal areas progressing to vertex, eventually possibly entire scalp\n\nThe characteristic pattern follows the distribution of androgen-sensitive follicles, with temples and crown being affected first."
    difficulty: easy
    tags: [androgenetic-alopecia, clinical-features, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the female pattern of androgenetic alopecia distribution?"
    back: "Widening of central part with 'Christmas tree' pattern\n\nFemale pattern alopecia typically presents as central thinning with preservation of the frontal hairline, appearing like a Christmas tree when viewed from behind."
    difficulty: easy
    tags: [androgenetic-alopecia, clinical-features, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the mnemonic for precipitants of telogen effluvium?"
    back: "SEND - Stress, Illness/surgery, Nutritional (iron/protein deficiency), Drugs\n\nCommon triggers include physiological stress, childbirth, severe illness, surgery, iron deficiency, protein deficiency, and medications like beta-blockers, SSRIs, and retinoids."
    difficulty: medium
    tags: [telogen-effluvium, precipitants, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is poikiloderma in the context of Mycosis fungoides?"
    back: "Combination of atrophy, telangiectasia, hyperpigmentation, and hypopigmentation\n\nPoikiloderma is a characteristic finding in MF lesions, particularly in advanced patches and plaques."
    difficulty: hard
    tags: [mycosis-fungoides, poikiloderma, dermatology, CTCL, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "At what age does cutaneous T-cell lymphoma typically present?"
    back: ">50 years, with male-to-female ratio of 2:1\n\nCTCL is predominantly a disease of older adults, with median onset in the sixth decade of life."
    difficulty: easy
    tags: [CTCL, epidemiology, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What causes anagen effluvium other than chemotherapy?"
    back: "Bismuth, levodopa, colchicine, cyclosporine, thallium, boron, arsenic exposure\n\nThese agents directly impair hair follicle mitosis in a dose-dependent manner, similar to the mechanism of chemotherapy-induced anagen effluvium."
    difficulty: hard
    tags: [anagen-effluvium, drugs, toxins, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the treatment for tinea cruris (jock itch)?"
    back: "Clotrimazole 1% cream BID, OR ketoconazole 2% cream BID\n\nTinea cruris is caused by Trichophyton species. Topical azole antifungals are first-line therapy for uncomplicated cases."
    difficulty: easy
    tags: [dermatology, tinea, fungal, antifungal, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for recurrent genital herpes episode?"
    back: "Acyclovir 800mg PO TID x 2 days OR Famciclovir 1000mg PO BID x 1 day OR Valacyclovir 500mg PO BID x 3 days\n\nRecurrent episodes can be treated with shorter courses of antivirals compared to first episodes."
    difficulty: easy
    tags: [dermatology, infectious disease, herpes, STI, viral infection, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are first-line treatments for tinea cruris/pedis (jock itch/athlete's foot)?"
    back: "Clotrimazole 1% cream BID OR Ketoconazole 2% cream BID\n\nTopical antifungals are first-line for uncomplicated tinea infections. Treatment typically continues for 2-4 weeks."
    difficulty: easy
    tags: [dermatology, fungal infection, tinea, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the treatment options for tinea cruris/pedis (jock itch/athlete's foot)?"
    back: "Clotrimazole 1% cream BID OR ketoconazole 2% cream BID\n\nTopical antifungal therapy is first-line for uncomplicated tinea. Treatment typically lasts 1-2 weeks."
    difficulty: easy
    tags: [dermatology, fungal, tinea, treatment, antifungals, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the first-line topical treatment for tinea cruris or tinea pedis?"
    back: "Clotrimazole 1% cream BID OR ketoconazole 2% cream BID\n\nTopical azole creams are first-line for uncomplicated tinea infections."
    difficulty: easy
    tags: [dermatology, tinea, antifungal, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are common organisms causing tinea cruris and tinea pedis?"
    back: "Trichophyton species (most commonly Trichophyton rubrum)\n\nDermatophyte fungi of the Trichophyton genus cause athlete's foot and jock itch."
    difficulty: easy
    tags: [dermatology, tinea, fungal, microbiology, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the cause of pubic lice (crabs)?"
    back: "Phthirus pubis\n\nPhthirus pubis is a crab louse that infects the pubic region, though it can also affect other hairy areas."
    difficulty: easy
    tags: [dermatology, parasites, lice, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is first-line treatment for first-episode herpes (HSV)?"
    back: "Acyclovir 400 mg PO TID for 5-10 days OR famciclovir 250 mg PO TID for 5 days OR valacyclovir 1000 mg PO BID for 10 days\n\nAntiviral therapy reduces symptoms, accelerates healing, and may reduce viral shedding in primary HSV infection."
    difficulty: easy
    tags: [dermatology, infectious disease, herpes, HSV, antiviral, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is treatment for recurrent herpes episode?"
    back: "Acyclovir 800 mg PO TID for 2 days OR valacyclovir 500 mg PO BID for 3 days\n\nShorter courses are effective for recurrent episodes due to shorter duration of viral shedding."
    difficulty: medium
    tags: [dermatology, infectious disease, herpes, HSV, antiviral, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for tinea cruris (jock itch) or tinea pedis (athlete's foot)?"
    back: "Clotrimazole 1% cream BID OR ketoconazole 2% cream BID\n\nTopical azole antifungals are first-line. Treatment typically lasts 2-4 weeks. Keep area dry and apply beyond lesion borders."
    difficulty: easy
    tags: [dermatology, fungal infection, tinea, antifungals, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the first-line oral treatments for primary episode herpes (HSV)?"
    back: "Acyclovir 400 mg PO TID x 5-10 days OR famciclovir 250 mg PO TID x 5 days OR valacyclovir 1000 mg PO BID x 10 days\n\nAll three are equally effective. Valacyclovir has better bioavailability and simpler dosing, improving adherence."
    difficulty: easy
    tags: [dermatology, infections, viral, HSV, STI, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for recurrent herpes episode?"
    back: "Acyclovir 800 mg PO TID x 2 days OR acyclovir 800 mg PO BID x 5 days; OR famciclovir 1000 mg PO BID x 1 day OR 125 mg PO BID x 5 days; OR valacyclovir 500 mg PO BID x 3 days or 1000 mg PO daily x 5 days\n\nShorter courses are equally effective as longer regimens. Earlier treatment at first sign of recurrence is most effective."
    difficulty: easy
    tags: [dermatology, infections, viral, HSV, STI, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the topical treatments for tinea cruris (jock itch)?"
    back: "Clotrimazole 1% cream BID OR ketoconazole 2% cream BID\n\nTopical azoles are first-line for uncomplicated tinea. Keep area dry, apply for at least 2-4 weeks to prevent recurrence."
    difficulty: easy
    tags: [dermatology, infections, fungal, tinea, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the topical treatments for tinea pedis (athlete's foot)?"
    back: "Clotrimazole 1% cream BID OR ketoconazole 2% cream BID\n\nSame as tinea cruris. Treat for 2-4 weeks minimum. Keep feet dry, use absorbent socks, avoid occlusive footwear."
    difficulty: easy
    tags: [dermatology, infections, fungal, tinea, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "A patient with recurrent genital herpes wants to become pregnant. What suppressive therapy is recommended at 36 weeks?"
    back: "Acyclovir 400 mg PO TID daily OR valacyclovir 500 mg PO BID starting at 36 weeks gestation\n\nSuppressive therapy reduces viral shedding and recurrence at delivery, decreasing likelihood of active lesions requiring cesarean section."
    difficulty: hard
    tags: [dermatology, HSV, pregnancy, STI, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for first-episode herpes (HSV)?"
    back: "Acyclovir 400 mg PO TID x 5-10 days OR famciclovir 250 mg PO TID x 5 days OR valacyclovir 1000 mg PO BID x 10 days\n\nAntiviral therapy reduces viral shedding, accelerates healing, and may reduce recurrence severity when initiated early."
    difficulty: easy
    tags: [dermatology, herpes, HSV, antiviral, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for tinea cruris (jock itch) and tinea pedis (athlete's foot)?"
    back: "Clotrimazole 1% cream BID OR ketoconazole 2% cream BID\n\nBoth are topical azole antifungals effective against Trichophyton species. Treatment typically lasts 2-4 weeks."
    difficulty: easy
    tags: [dermatology, tinea, antifungal, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the treatments for tinea cruris (jock itch) and tinea pedis (athlete's foot)?"
    back: "Clotrimazole 1% cream BID, OR ketoconazole 2% cream BID\n\nBoth are topical antifungals effective against Trichophyton species causing dermatophyte infections."
    difficulty: easy
    tags: [dermatology, fungal, tinea, clotrimazole, ketoconazole, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the topical treatment options for tinea cruris (jock itch) and tinea pedis (athlete's foot)?"
    back: "Clotrimazole 1% cream BID OR ketoconazole 2% cream BID\n\nTopical azoles are first-line for superficial dermatophyte infections; treatment typically lasts 2-4 weeks."
    difficulty: easy
    tags: [dermatology, tinea, antifungal, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the skin finding in hemochromatosis?"
    back: "Bronze or grey skin pigmentation (due to melanin, not iron)\n\nThe bronze/grey skin color in hemochromatosis results from increased melanin deposition, not iron deposition in the skin."
    difficulty: easy
    tags: [hemochromatosis, dermatology, skin findings, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the dermatologic manifestations of hemochromatosis?"
    back: "Bronze or grey skin discoloration\n\nThe bronze/grey color is due to melanin deposition, not iron. This is a characteristic finding but develops late in the disease."
    difficulty: easy
    tags: [hemochromatosis, clinical-features, dermatology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are clinical features of small vessel vasculitis?"
    back: "Palpable purpura, urticaria, superficial ulcers/erosions\n\nCutaneous manifestations reflect leukocytoclastic inflammation of post-capillary venules."
    difficulty: easy
    tags: [Vasculitis, Small vessel, Dermatology, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
