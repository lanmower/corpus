# Osteoporosis & Metabolic Bone Disease (Endocrinology) - generated from srs-mccqe1
cards:
  - front: "When should bone mineral density (BMD) testing with DXA be done per Osteoporosis Canada?"
    back: "Women ≥65 or postmenopausal women <65 with risk factors; men ≥70 or men <70 with risk factors; all patients on long-term steroids (≥3 months at prednisone ≥7.5mg/day)\n\nOsteoporosis Canada guidelines recommend DXA for high-risk individuals. T-score: -1.0 to -2.5 = osteopenia; ≤-2.5 = osteoporosis. FRAX tool estimates 10-year fracture probability to guide treatment decisions."
    difficulty: easy
    tags: [DXA, bone mineral density, osteoporosis screening, Osteoporosis Canada, endocrinology]
  - front: "What is the pharmacological treatment for osteoporosis in postmenopausal women?"
    back: "First-line: bisphosphonates (alendronate weekly or zoledronic acid annual infusion); alternatives: denosumab, raloxifene; anabolic: teriparatide or romosozumab for severe osteoporosis\n\nOsteoporosis Canada guidelines recommend treatment for T-score ≤-2.5 or fragility fracture. Bisphosphonates reduce vertebral fractures by 40-70%, hip fractures by 40-50%. Denosumab reduces vertebral fractures by 68%. Calcium 1000-1200 mg/day + vitamin D 800-2000 IU/day for all."
    difficulty: medium
    tags: [osteoporosis treatment, bisphosphonates, alendronate, denosumab, endocrinology]
  - front: "A 68-year-old woman on alendronate for 7 years has hip pain. Imaging shows cortical thickening of the femoral shaft with a transverse fracture line. Diagnosis?"
    back: "Atypical femoral fracture (AFF) — bisphosphonate complication; hold bisphosphonate, orthopaedic evaluation, consider anabolic therapy (teriparatide) which may enhance healing\n\nAFFs are rare complications of long-term bisphosphonate use (>3-5 years). Prodromal thigh/groin pain may precede fracture. Radiograph shows transverse fracture with cortical thickening. Both femurs should be evaluated. Drug holiday from bisphosphonate after 5 years if risk-benefit appropriate."
    difficulty: hard
    tags: [atypical femoral fracture, bisphosphonate complication, alendronate, teriparatide, endocrinology]
  - front: "What is osteonecrosis of the jaw (ONJ) and when does it occur with osteoporosis treatment?"
    back: "ONJ: exposed bone in maxillofacial region >8 weeks without healing in patients on antiresorptive therapy; risk highest with IV bisphosphonates/denosumab at cancer doses; rare at osteoporosis doses\n\nDental assessment before starting antiresorptive therapy is recommended. ONJ risk with oral bisphosphonates for osteoporosis: ~0.001-0.01%. Cancer patients on IV zoledronic acid monthly: much higher risk. Management: conservative oral hygiene, antimicrobials, avoid elective dental surgery."
    difficulty: medium
    tags: [osteonecrosis of jaw, ONJ, bisphosphonate complication, denosumab, endocrinology]
  - front: "What is hyperparathyroidism and how does it cause bone disease?"
    back: "Primary HPT: parathyroid adenoma (80%) secretes excess PTH → bone resorption (cortical bone especially) → hypercalcemia, hypophosphatemia, hypercalciuria — treat with parathyroidectomy\n\nOsteitis fibrosa cystica is the bone disease of severe primary HPT (now rare). Presentation: usually asymptomatic hypercalcemia on routine labs. Symptoms: bones (fractures), moans, stones, psychic overtones. DXA for fracture risk assessment. Parathyroidectomy curative."
    difficulty: medium
    tags: [primary hyperparathyroidism, PTH, bone disease, parathyroidectomy, endocrinology]
  - front: "What is the FRAX tool and how is it used in osteoporosis management?"
    back: "FRAX: WHO fracture risk assessment tool estimating 10-year probability of major osteoporotic fracture and hip fracture; incorporates age, sex, BMI, BMD, risk factors — guides treatment decisions\n\nOsteoporosis Canada guidelines recommend FRAX to determine treatment thresholds: treat if 10-year major osteoporotic fracture risk ≥20% or hip fracture risk ≥3%. FRAX can be calculated with or without BMD."
    difficulty: easy
    tags: [FRAX, fracture risk, osteoporosis, treatment threshold, endocrinology]
  - front: "A 70-year-old man on prednisone 15mg/day for polymyalgia rheumatica. What bone protection measures should be initiated?"
    back: "Calcium (1200 mg/day) + vitamin D (800-2000 IU/day) + bisphosphonate (alendronate or zoledronic acid) started at initiation of steroid therapy for ≥3 months\n\nGlucocorticoid-induced osteoporosis (GIOP) is the most common secondary cause of osteoporosis. Steroids reduce osteoblast function and increase osteoclast activity. Osteoporosis Canada recommends preventive treatment for patients starting ≥7.5mg prednisone/day for ≥3 months."
    difficulty: medium
    tags: [glucocorticoid-induced osteoporosis, GIOP, calcium, vitamin D, bisphosphonate, endocrinology]
  - front: "What is Paget disease of bone and what treatment is recommended?"
    back: "Paget: excessive and disorganized bone remodeling causing enlarged, deformed bones (skull, spine, pelvis, femur); markedly elevated ALP; treat symptomatic disease with bisphosphonates (zoledronic acid)\n\nPaget disease presents with bone pain, deformity, increased hat size, hearing loss, high-output heart failure (rare). Diagnosis: markedly elevated ALP, bone scan showing increased uptake in affected areas. Zoledronic acid provides prolonged remission."
    difficulty: medium
    tags: [Paget disease, ALP, bisphosphonate, bone remodeling, endocrinology]
  - front: "What is vitamin D deficiency and how is it treated?"
    back: "Vitamin D deficiency (25-OH vitamin D <50 nmol/L): treat with vitamin D3 (cholecalciferol) 1000-2000 IU/day or weekly high-dose loading; recheck in 3 months\n\nVitamin D deficiency is highly prevalent in Canada due to limited sun exposure. Risk groups: elderly, institutionalized, dark skin, malabsorption, low dietary intake. Osteoporosis Canada recommends vitamin D 800-2000 IU/day for adults at risk for osteoporosis."
    difficulty: easy
    tags: [vitamin D deficiency, cholecalciferol, supplementation, osteoporosis prevention, endocrinology]
  - front: "A 55-year-old woman has a fragility fracture of her wrist after a minor fall. DXA T-score: -2.7. What is the diagnosis and management?"
    back: "Osteoporosis with fragility fracture; initiate pharmacotherapy (bisphosphonate first-line) regardless of T-score when fragility fracture has occurred, plus calcium + vitamin D\n\nFragility fractures are defined as fractures from a fall from standing height or less. Any fragility fracture at major sites (hip, spine, wrist) qualifies as osteoporosis regardless of BMD. Hip fractures have 20-30% mortality within 1 year."
    difficulty: medium
    tags: [fragility fracture, osteoporosis, bisphosphonate, treatment threshold, endocrinology]
  - front: "When is osteoporosis pharmacotherapy indicated?"
    back: "Prior fragility fracture, T-score<=-2.5, FRAX major>=20% or hip>=3%\n\nFirst-line: bisphosphonates. Holiday after 5y oral/3y IV. Ensure Ca 1200mg + vitD 800-2000IU."
    difficulty: medium
    tags: [osteoporosis, FRAX]
  - front: "What is FRAX and how is it used in Canada?"
    back: "10-year fracture probability calculator. Inputs: age, sex, BMI, prior fracture, parent hip fx, steroids, RA, secondary OP, alcohol, smoking, BMD. Osteoporosis Canada: treat if major OP fracture ≥20% or hip ≥3%.\n\nCAROC also used in Canada (BMD+age+sex+fracture+steroids→low/moderate/high). Moderate risk (10-20%): use FRAX for additional factors. BMD alone insufficient for treatment decisions."
    difficulty: hard
    tags: [osteoporosis, FRAX, CAROC, risk, endocrinology]
  - front: "What are bisphosphonate options and duration guidelines?"
    back: "Oral: alendronate 70 mg/wk, risedronate 35 mg/wk. IV: zoledronic acid 5 mg/yr. Reassess after 3-5yr (oral) or 3yr (IV). Drug holiday if low risk. Continue if T-score ≤-2.5 or recent fracture.\n\nTake oral fasting, upright, with water, 30-60 min before food. Rare risks: ONJ (dental exam first), atypical femur fractures (thigh pain→X-ray). Contraindicated if eGFR <30-35."
    difficulty: hard
    tags: [osteoporosis, bisphosphonate, alendronate, zoledronic acid, endocrinology]
  - front: "What is denosumab and the rebound concern?"
    back: "Anti-RANKL monoclonal Ab, 60 mg SC q6 months. No renal adjustment needed. CRITICAL: stopping causes rapid rebound bone loss + vertebral fractures. Must transition to bisphosphonate before/at discontinuation.\n\nPreferred when eGFR <30. Rebound fractures 7-12 months after last dose. Osteoporosis Canada: give zoledronic acid 6 months after last denosumab. Monitor calcium (hypocalcemia risk)."
    difficulty: hard
    tags: [osteoporosis, denosumab, RANKL, rebound, endocrinology]
  - front: "Who should be screened for osteoporosis with DXA in Canada?"
    back: "Women ≥65, men ≥70. Younger if: fragility fracture, steroids ≥3 months, parental hip fx, smoking, alcohol, RA, hypogonadism, early menopause (<45). T-score ≤-2.5 = osteoporosis. Hip/vertebral fragility fracture = osteoporosis regardless of T-score.\n\nDXA: lumbar spine + hip, use lowest T-score. VFA can detect asymptomatic vertebral fractures. Repeat DXA q1-3 years. Osteopenia: T-score -1.0 to -2.5."
    difficulty: medium
    tags: [osteoporosis, screening, DXA, T-score, endocrinology]
  - front: "What is glucocorticoid-induced osteoporosis prevention?"
    back: "Prednisone ≥7.5 mg ≥3 months: Ca 1200mg + Vit D 800-2000 IU for ALL. Bisphosphonate/denosumab if FRAX ≥10-20% (lower threshold), or any dose if ≥70 or prior fracture. Teriparatide for severe GIOP.\n\nMost common secondary OP. Bone loss fastest in first 3-6 months. GCs decrease osteoblasts, increase osteoclasts. FRAX underestimates GIOP risk — use lower treatment thresholds."
    difficulty: hard
    tags: [osteoporosis, GIOP, glucocorticoid, prevention, endocrinology]
  - front: "What is teriparatide and when is it used?"
    back: "Recombinant PTH(1-34), 20 μg SC daily ×24 months max. Anabolic (stimulates osteoblasts). For: severe OP (T-score <-3.5 or multiple fractures), GIOP, failed anti-resorptives. Must follow with bisphosphonate/denosumab.\n\nBetter BMD gains than bisphosphonates at spine. Contraindicated: Paget, bone mets, elevated ALP, prior radiation, children. Romosozumab (anti-sclerostin) is newer dual-mechanism anabolic."
    difficulty: hard
    tags: [osteoporosis, teriparatide, anabolic, romosozumab, endocrinology]
  - front: "What non-pharmacologic measures prevent osteoporotic fractures?"
    back: "Weight-bearing + resistance exercise, fall prevention (home safety, vision, medication review, balance/tai chi), Ca 1200 mg/day (diet-first), Vit D 800-2000 IU/day (target 25-OH-D >75 nmol/L), smoking cessation, limit alcohol.\n\nTai chi reduces falls 20-40%. Medication review: minimize benzos, anticholinergics, sedatives. Hip protectors may reduce fractures in institutionalized elderly."
    difficulty: medium
    tags: [osteoporosis, prevention, exercise, calcium, vitamin D, endocrinology]
  - front: "How is vertebral compression fracture managed?"
    back: "Conservative: analgesics, early mobilization, physio, bracing. Vertebroplasty/kyphoplasty if refractory pain >4-6 weeks. Start OP pharmacotherapy immediately. Assess secondary causes.\n\nOnly 1/3 of vertebral fractures symptomatic. Strongest predictor of future fractures (5x risk). Height loss >2cm→VFA or lateral spine X-ray."
    difficulty: medium
    tags: [osteoporosis, vertebral fracture, management, endocrinology]
  - front: "What secondary OP causes should be evaluated?"
    back: "Endocrine: hyperPTH, hyperthyroidism, Cushing, hypogonadism. GI: celiac, IBD. Renal: CKD. Hematologic: myeloma. Drugs: GCs, aromatase inhibitors, PPIs, phenytoin, heparin. Workup: CBC, Ca, PO4, ALP, Cr, 25-OH-D, TSH, SPEP.\n\nSPEP important in elderly to exclude myeloma. Correct secondary causes alongside pharmacotherapy. Additional tests per suspicion: celiac serology, PTH, testosterone."
    difficulty: medium
    tags: [osteoporosis, secondary causes, workup, endocrinology]
  - front: "What is romosozumab?"
    back: "Anti-sclerostin monoclonal Ab: increases bone formation AND decreases resorption. 210 mg SC monthly ×12 months, then anti-resorptive. For very high fracture risk postmenopausal women. Black box: increased CV events→contraindicated if MI/stroke in past year.\n\nARCH trial: romosozumab then alendronate reduced fractures 48% vs alendronate alone. Sequential therapy paradigm: anabolic first, then anti-resorptive for severe OP. Osteoporosis Canada recommends for imminent fracture risk."
    difficulty: hard
    tags: [osteoporosis, romosozumab, sclerostin, anabolic, endocrinology]
  - front: "What are the normal serum calcium values and how is calcium distributed in the blood?"
    back: "Normal total serum Ca2+: 2.2–2.6 mmol/L. Normal ionized/free Ca2+: 1.15–1.31 mmol/L. Distribution: 40% protein-bound (mostly albumin), 45% ionized (biologically active), 15% complexed with PO4^3- and citrate.\n\nOnly ionized calcium is biologically active. When albumin is low, total calcium is low but ionized calcium may be normal (corrected calcium = measured total Ca + 0.02 × (40 − albumin in g/L)). Ionized calcium measurement is more accurate in critically ill patients with abnormal albumin."
    difficulty: easy
    tags: [calcium homeostasis, ionized calcium, albumin, normal values]
  - front: "What are the major regulators of calcium homeostasis and their sources?"
    back: "PTH: parathyroid glands (stimulated by low Ca2+, high PO4, low calcitriol; inhibited by high Ca2+, high calcitriol, FGF23, chronic low Mg2+) → net effect: ↑Ca2+. Calcitriol (1,25-(OH)2D3): synthesized from dietary cholecalciferol/ergocalciferol (UV → cholecalciferol → liver → calcidiol → kidney → calcitriol; stimulated by low PO4, high PTH, low Ca2+) → net effect: ↑Ca2+, ↑PO4. Calcitonin: thyroid C-cells (stimulated by high Ca2+ and pentagastrin; inhibited by low Ca2+) → net effect: ↓Ca2+ (only in pharmacologic doses). FGF23: → ↓Ca2+ and ↓PO4.\n\nPTH and calcitriol act on three target organs: GI tract (absorption), bone (resorption), and kidney (reabsorption/excretion). PTH increases calcitriol production by stimulating 1-alpha-hydroxylase in the kidney. Calcitonin plays a minimal role in normal calcium homeostasis but is clinically used in hypercalcemia treatment."
    difficulty: medium
    tags: [PTH, calcitriol, calcium homeostasis, vitamin D, calcitonin, FGF23]
  - front: "What is primary hyperparathyroidism (PH) and what are the indications for surgery?"
    back: "PH is increased PTH secretion most commonly due to parathyroid adenoma; less often parathyroid carcinoma or multigland hyperplasia. Most common cause of hypercalcemia in healthy outpatients. Surgery is recommended if any of: serum Ca2+ >0.25 mmol/L above ULN; skeletal involvement (fracture on VFA, T-score ≤-2.5, vertebral fracture); renal involvement (eGFR or CrCl <60 mL/min, nephrocalcinosis/nephrolithiasis); hypercalciuria (>250 mg/day women; >300 mg/day men); age <50 yr.\n\nAsymptomatic primary hyperparathyroidism is common. Medical surveillance with annual serum calcium, creatinine, and DEXA is appropriate for those who do not meet surgical criteria. Secondary hyperparathyroidism is elevated PTH in response to low Ca2+ (chronic renal failure, osteomalacia). Tertiary hyperparathyroidism is irreversible autonomous PTH secretion after long-standing secondary disease."
    difficulty: hard
    tags: [primary hyperparathyroidism, hypercalcemia, parathyroidectomy, surgery indications, PTH]
  - front: "What distinguishes primary, secondary, and tertiary hyperparathyroidism?"
    back: "Primary hyperparathyroidism: autonomous overproduction of PTH (usually parathyroid adenoma) → high PTH, high Ca2+. Secondary hyperparathyroidism: elevated PTH in response to low Ca2+ — most commonly in renal failure/osteomalacia → high PTH, low or normal Ca2+. Tertiary hyperparathyroidism: irreversible monoclonal outgrowth of parathyroid glands after long-standing, inadequately treated secondary hyperparathyroidism (typically on dialysis) → autonomous high PTH even if Ca2+ corrected.\n\nSecondary hyperparathyroidism is treated by addressing the underlying cause (e.g., vitamin D supplementation, phosphate binders, calcitriol in CKD, cinacalcet). When PTH secretion becomes autonomous and unresponsive despite normalization of calcium (tertiary), parathyroidectomy may be required."
    difficulty: medium
    tags: [hyperparathyroidism, primary, secondary, tertiary, renal failure, PTH]
  - front: "What is the role of vitamin D in calcium homeostasis and how is it synthesized?"
    back: "Vitamin D (calcitriol/1,25-(OH)2D3) increases intestinal calcium and phosphate absorption, stimulates bone resorption, and reduces renal calcium excretion → net increase in serum Ca2+ and PO4. Synthesis: UV light on skin → cholecalciferol (D3); liver → 25-hydroxylation → calcidiol (25-OH D3); kidney (1-alpha-hydroxylase) → calcitriol (1,25-(OH)2D3 — active form). Synthesis stimulated by: low PO4, high PTH, low Ca2+. Inhibited by: high PO4, low PTH, FGF23, calcitriol (negative feedback).\n\nDeficiency of 1-alpha-hydroxylase (e.g., chronic kidney disease) leads to secondary hyperparathyroidism and renal osteodystrophy — this is why activated vitamin D (calcitriol/alfacalcidol) is used in CKD, not standard cholecalciferol. Checking 25-OH vitamin D (calcidiol) is the appropriate test to assess body stores."
    difficulty: medium
    tags: [vitamin D, calcitriol, calcium homeostasis, 1-alpha-hydroxylase, renal osteodystrophy]
