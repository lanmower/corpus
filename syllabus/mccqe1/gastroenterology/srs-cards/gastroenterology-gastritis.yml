# Gastroenterology Gastritis (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is the Updated Sydney Classification of gastritis? List the types and common etiologies."
    back: "Acute Gastritis:\n- Hemorrhagic/erosive gastritis: EtOH, aspirin/NSAIDs, shock/physiological stress (ICU patients)\n- Helicobacter gastritis: H. pylori\n\nChronic Gastritis:\n- Non-atrophic: H. pylori\n- Atrophic: H. pylori, dietary/environmental factors, autoimmunity\n- Chemical: NSAIDs, bile acid\n- Radiation: radiation injury\n- Lymphocytic: celiac disease, drugs\n- Eosinophilic: food allergies\n- Non-infectious granulomatous: Crohn's disease, sarcoidosis\n- Other infectious: bacteria, viruses, fungi, parasites, TB, syphilis\n\nNon-erosive gastritis is often asymptomatic and requires biopsy for diagnosis. Erosive gastritis can cause bleeding. Management is directed at the underlying etiology — notably H. pylori eradication and NSAID cessation."
    difficulty: medium
    tags: [gastritis, Sydney classification, H. pylori, NSAIDs, gastroenterology]
