  - front: "What did the SPRINT trial demonstrate about intensive BP control?"
    back: "Intensive treatment (target BP <120mmHg) vs. standard (<140mmHg) significantly reduced CV events (1.65%/yr vs 2.19%/yr) in high-risk patients\n\nSPRINT showed that intensive BP control in high-risk patients with systolic BP >130mmHg reduced major cardiovascular complications after 3 years."
    difficulty: medium
    tags: [cardiology, hypertension, clinical trial, SPRINT, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
