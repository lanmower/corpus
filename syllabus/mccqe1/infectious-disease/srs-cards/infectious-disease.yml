# Infectious Disease (InfectiousDisease) - generated from srs-mccqe1
cards:
  - front: "What are the three major endemic mycoses in North America and their geographic distributions?"
    back: "1. Histoplasma capsulatum: Ohio/Mississippi River valleys, Ontario, Quebec (associated with chicken coops, bird roosts, bat caves). 2. Blastomyces dermatitidis: East of Mississippi, Northern Ontario, Great Lakes. 3. Coccidioides immitis: Southwestern US deserts, northwestern Mexico ('Valley fever').\n\nAll are thermally dimorphic (mould in cold/soil, yeast at body temperature), acquired by inhalation of spores, can cause pneumonia and disseminate hematogenously, and may reactivate during immunocompromised states. Previously defined regions of endemicity are expanding."
    difficulty: medium
    tags: [infectious disease, mycoses, fungal infections]
  - front: "What is the classic presentation and treatment of Pneumocystis jirovecii pneumonia (PJP)?"
    back: "Presentation: fever, non-productive cough, progressive dyspnea/hypoxia. CXR: bilateral symmetric interstitial infiltrates. Labs: elevated LDH (>220 IU/L), reduced pO2, elevated A-a gradient. Treatment: TMP/SMX (first-line), add corticosteroids if pO2 <70 mmHg. Prophylaxis: TMP/SMX when CD4 <200 in HIV patients.\n\nPJP occurs in HIV patients with CD4 <200 who lack prophylaxis, and in non-HIV immunocompromised patients. Most clinical disease is due to reactivation. Without prophylaxis, HIV+ patients with CD4 <200 have an 80% lifetime risk. Adjunctive steroids improve survival in severe hypoxia."
    difficulty: medium
    tags: [infectious disease, PJP, opportunistic infections, HIV]
  - front: "What is the leading cause of meningitis in HIV patients, and how is it diagnosed?"
    back: "Cryptococcus neoformans (most commonly). Diagnosis: serum cryptococcal antigen, CSF India-ink stain (50% sensitivity, higher in HIV), CSF cryptococcal antigen test (high sensitivity), LP with opening pressure measurement. Treatment: amphotericin B + flucytosine (2-week induction) → fluconazole (consolidation ≥8 weeks → prolonged maintenance).\n\nC. neoformans is acquired by inhaling encapsulated yeast from soil contaminated with pigeon droppings. It tends to affect immunocompromised hosts while C. gattii affects immunocompetent hosts. Serial lumbar puncture for ICP management is an important adjunct to therapy."
    difficulty: medium
    tags: [infectious disease, cryptococcus, meningitis, HIV]
  - front: "What are the clinical forms of aspergillosis and their presentations?"
    back: "1. ABPA: IgE-mediated asthma-like reaction, transient pulmonary infiltrates (patients with asthma/allergies). 2. Aspergilloma: fungus ball in pre-existing cavity, 'air crescent' sign on CXR, asymptomatic to massive hemoptysis. 3. Invasive aspergillosis: prolonged neutropenia, pneumonia with 'halo' sign on CT, may disseminate to brain/skin, high mortality. 4. Mycotoxicosis: hepatic effects from aflatoxin → hepatocellular carcinoma.\n\nTreatment differs by form: ABPA = corticosteroids + itraconazole; aspergilloma = surgical resection ± bronchial artery embolization; invasive = voriconazole (first-line) or amphotericin B. Invasive aspergillosis is associated with persistent neutropenia or transplantation."
    difficulty: hard
    tags: [infectious disease, aspergillosis, fungal infections]
  - front: "What is the life cycle of Plasmodium malaria and which species can relapse from liver hypnozoites?"
    back: "Cycle: infected Anopheles mosquito injects sporozoites → liver infection → merozoites released → RBC infection → RBC lysis (fever paroxysms). P. vivax and P. ovale can relapse from dormant liver hypnozoites months later. Treatment of hypnozoites requires primaquine or tafenoquine.\n\nP. falciparum is the most lethal species causing cerebral malaria, severe anemia, and ARDS. Malaria is the most common fatal infectious disease imported into Canada. In returned travellers from endemic areas, fever is malaria until proven otherwise. Diagnosis requires thick and thin blood smears ×3 (q12-24h)."
    difficulty: medium
    tags: [infectious disease, malaria, parasitology]
  - front: "What is the treatment for P. falciparum malaria?"
    back: "Most areas show chloroquine resistance. Options: 1) Artemisinin combination therapy (artesunate + doxycycline, or artemether-lumefantrine). 2) Atovaquone/proguanil (Malarone). 3) Quinine + doxycycline or clindamycin. For severe disease: parenteral artesunate. Check local resistance patterns.\n\nMarkers of severity include clinical features plus degree of parasitemia. P. falciparum causes >90% of malaria deaths. Artemisinin and mefloquine resistance is increasing in Southeast Asia. Prevention includes antimalarial prophylaxis, insecticide-treated bed nets, DEET repellent, and covering exposed skin."
    difficulty: hard
    tags: [infectious disease, malaria, treatment]
  - front: "What is the classic triad of congenital toxoplasmosis?"
    back: "Chorioretinitis, hydrocephalus, and intracranial calcifications. Transmitted transplacentally during acute primary maternal infection in pregnancy.\n\nToxoplasma gondii is acquired from cat feces (oocysts), undercooked meat (tissue cysts), or transplacentally. In immunocompetent patients it is usually asymptomatic. In immunocompromised (AIDS with CD4 <200), it causes encephalitis with ring-enhancing lesions on CT. Prevention in pregnancy: avoid undercooked meat and cat litter."
    difficulty: medium
    tags: [infectious disease, toxoplasmosis, TORCH]
  - front: "What is the presentation and treatment of Giardia lamblia infection?"
    back: "Presentation ('beaver fever'): watery diarrhea, steatorrhea, bloating, flatulence, abdominal cramps, weight loss. No blood in stool (no tissue invasion). Chronic infection causes malabsorption. Diagnosis: multiple stool samples for microscopy, stool antigen, multiplex PCR. Treatment: single dose tinidazole or 3-day nitazoxanide; metronidazole for children <12 months.\n\nGiardia is transmitted via the fecal-oral route through contaminated water/food. Risk factors include travel, camping, daycare centres, institutions, and MSM. Key distinguishing feature from amoebic dysentery: no hematochezia because Giardia does not invade the intestinal wall."
    difficulty: easy
    tags: [infectious disease, giardia, parasitology]
  - front: "What parasitic infection is associated with Löffler syndrome, and what is the mechanism?"
    back: "Ascaris lumbricoides and Strongyloides stercoralis. Löffler syndrome (eosinophilic pneumonitis): cough, dyspnea, transient pulmonary infiltrates, and peripheral eosinophilia caused by larval migration through the lungs.\n\nThe larvae of intestinal nematodes migrate through the lungs as part of their life cycle, provoking an eosinophilic inflammatory response. Strongyloides is unique among nematodes in its ability to autoinfect the host, potentially causing hyperinfection syndrome in immunocompromised patients (especially with corticosteroids)."
    difficulty: medium
    tags: [infectious disease, parasitology, pulmonary]
  - front: "What tapeworm causes cysticercosis and what is the clinical presentation?"
    back: "Taenia solium (pork tapeworm). Cysticercosis occurs from ingesting eggs (not larvae), which form mass lesions in CNS, eyes, and skin. Neurocysticercosis causes seizures (most common presentation), headache, and focal neurological deficits. Treatment: corticosteroids + albendazole + praziquantel; antiepileptics for seizures.\n\nIntestinal taeniasis (from eating undercooked pork containing larvae) causes mild GI symptoms. Cysticercosis (from fecal-oral transmission of eggs) is the serious form. Diphyllobothrium latum (fish tapeworm) causes vitamin B12 deficiency and macrocytic anemia."
    difficulty: medium
    tags: [infectious disease, parasitology, neurocysticercosis]
  - front: "What are the chronic complications of Schistosoma infection by species?"
    back: "S. mansoni/S. japonicum: worms in mesenteric veins → intestinal polyps, portal HTN, hepatosplenomegaly, pulmonary HTN. S. haematobium: worms in vesical plexus → hematuria, obstructive uropathy, squamous cell carcinoma of the bladder. All species: neurologic complications (transverse myelitis, seizures).\n\nSchistosomiasis is acquired through fresh water exposure in endemic areas (Africa, Southeast Asia). Acute infection (Katayama fever) presents with fever, hives, eosinophilia. Diagnosis: serology, eggs in stool/urine, eosinophilia. Treatment: praziquantel; add prednisone for acute schistosomiasis."
    difficulty: hard
    tags: [infectious disease, schistosomiasis, parasitology]
  - front: "What is the differential diagnosis for fever in a returned traveller with incubation period <21 days?"
    back: "Malaria (most important to exclude), typhoid fever, dengue fever, chikungunya, Zika, rickettsioses, traveller's diarrhea, respiratory tract infections (including COVID-19). Must also exclude HBV and TB.\n\nFever in a returned traveller from a malaria-endemic area is malaria until proven otherwise. All travellers with fever need CBC, thick and thin blood smears ×3, blood cultures. Incubation >21 days makes dengue, chikungunya, and traveller's diarrhea less likely but does not exclude malaria or typhoid."
    difficulty: medium
    tags: [infectious disease, travel medicine, fever]
  - front: "What are the most common causes of fever of unknown origin (FUO)?"
    back: "Infections (~30%): TB (especially extrapulmonary), abscess, osteomyelitis, endocarditis. Neoplasms (~20%): lymphomas (especially NHL), leukemias, renal cell carcinoma. Collagen vascular diseases (~30%): SLE, RA, temporal arteritis, vasculitis. Miscellaneous (~20%): drug fever, sarcoidosis, IBD, PE/DVT. Unknown in 30-50% despite workup.\n\nFUO is defined as temperature ≥38.3°C on several occasions, duration >3 weeks, and diagnosis uncertain after 3 outpatient visits or 3 days in hospital. TB is the most common infectious cause. Patients who remain undiagnosed despite extensive workup generally have a good prognosis."
    difficulty: medium
    tags: [infectious disease, FUO, differential diagnosis]
  - front: "What types of infections are patients with cell-mediated vs. humoral immune deficiency susceptible to?"
    back: "Cell-mediated (HIV, Hodgkin, cytotoxic drugs): latent viruses (CMV, HSV, VZV), fungi (Candida, Aspergillus, PJP, Cryptococcus), parasites (Toxoplasma), NTM. Humoral (CLL, myeloma, asplenia, sickle cell): encapsulated organisms (S. pneumoniae, H. influenzae, N. meningitidis, Salmonella, GBS).\n\nNeutrophil dysfunction (chemotherapy, chronic granulomatous disease) predisposes to catalase-producing organisms: Staphylococcus, Serratia, Nocardia, Aspergillus. Understanding immune deficiency patterns is critical for predicting likely pathogens and selecting empiric therapy."
    difficulty: hard
    tags: [infectious disease, immunodeficiency, infections]
  - front: "What defines febrile neutropenia and what is the initial management?"
    back: "Definition: fever ≥38.3°C (or ≥38.0°C for ≥1h) + ANC <1.0 × 10⁹/L (severe if <0.5). Workup: blood cultures ×2, urine C&S, culture all catheter ports, CBC, electrolytes, Cr, liver enzymes, chest imaging. Do NOT perform DRE. Treatment: empiric broad-spectrum antibiotics per local protocol. Prophylaxis with G-CSF if risk of FN ≥20%.\n\nFebrile neutropenia is the most common life-threatening complication of cancer chemotherapy. A causative organism is identified only 1/3 of the time. Gram-positive organisms are now more common than gram-negatives. Fungal superinfection (Candida, Aspergillus) occurs with prolonged neutropenia."
    difficulty: medium
    tags: [infectious disease, febrile neutropenia, oncology]
  - front: "What is immune reconstitution inflammatory syndrome (IRIS)?"
    back: "A harmful inflammatory response against a previously acquired infection following immune recovery (e.g., after starting ART in HIV or discontinuing immunosuppressive therapy). Can present as paradoxical worsening of treated infection or new response to previously subclinical infection. Worse with rapid CD4 increase and lower pre-treatment CD4.\n\nIRIS affects ~10% of HIV patients starting ART. Common pathogens include TB, Cryptococcus, PJP, Toxoplasma, and hepatitis viruses. Diagnosis is by exclusion (rule out drug reaction, non-adherence, drug resistance). Management: continue ART (unless life-threatening), treat underlying infection, consider corticosteroids."
    difficulty: hard
    tags: [infectious disease, IRIS, HIV]
  - front: "What infections are common >1 month post solid organ transplant?"
    back: "Viral: CMV, EBV, VZV. Fungal: Aspergillus, Cryptococcus, P. jirovecii. Protozoan: Toxoplasma. Bacterial/mycobacterial: TB, Nocardia, Listeria. Pre-transplant vaccinations: DTaP, pneumococcal, influenza, hepatitis A/B, COVID-19 for all; MMR, varicella, HPV in select patients.\n\nInfection is a leading cause of early morbidity/mortality in transplant recipients. Infections <1 month are typically donor-derived or surgical site/line infections. The degree of immunosuppression determines susceptibility. Live vaccines (MMR, varicella) must be given pre-transplant as they are contraindicated post-transplant."
    difficulty: medium
    tags: [infectious disease, transplant, immunocompromised]
  - front: "What is Chagas disease (American trypanosomiasis) and what are its chronic complications?"
    back: "Caused by Trypanosoma cruzi, transmitted by reduviid bug ('kissing bug') that defecates on skin. Acute: usually asymptomatic; Romaña sign (unilateral periorbital swelling). Chronic (30-40% of infected, 10-25 years later): dilated cardiomyopathy, megaesophagus, megacolon. 60-70% remain in asymptomatic indeterminate phase.\n\nFound in Mexico, Central and South America. Congenital acquisition is increasingly recognized in non-endemic areas. Treatment with benznidazole for acute and indeterminate phases. Chronic determinate phase: symptomatic therapy, may need heart transplant or surgery. Screen seropositive patients before planned immunosuppression."
    difficulty: medium
    tags: [infectious disease, Chagas disease, parasitology]
  - front: "What is the most common reportable STI in Canada, and what is the recommended treatment for concurrent gonococcal and chlamydial urethritis/cervicitis?"
    back: "Chlamydia is the most common reportable STI. Treatment for concurrent infection: ceftriaxone 250 mg IM single dose + azithromycin 1 g PO single dose (always treat for both if either is suspected).\n\nWhen urethritis or cervicitis is suspected, always treat for both gonococcal and non-gonococcal types simultaneously. Mandatory reporting applies to chlamydia, gonorrhea, hepatitis B, HIV, syphilis, and chancroid."
    difficulty: easy
    tags: [infectious-disease, STI, family-medicine, pharmacology]
  - front: "A 10-year-old presents with sore throat, fever 39C, tonsillar exudate, and tender anterior cervical nodes without cough. Using the Modified Centor Score, what is the score and recommended action?"
    back: "Score: 5 (fever +1, tonsillar exudate +1, tender anterior nodes +1, cough absent +1, age 5-14 +1). Score >=3: perform rapid antigen detection test (RADT) and treat with antibiotics if positive.\n\nThe Modified Centor Score stratifies the risk of GABHS pharyngitis. Score 0-2 has low risk (1-8%) and needs no testing. Score >=3 has higher risk and warrants RADT. If RADT negative in patients <20, perform throat culture. Treatment is penicillin V for 10 days."
    difficulty: medium
    tags: [infectious-disease, pharyngitis, pediatrics, family-medicine]
  - front: "A 22-year-old presents with infectious mononucleosis confirmed by positive monospot. What activity restriction is essential, and why?"
    back: "Avoid heavy physical activity and contact sports for at least 1 month or until splenomegaly resolves, due to risk of splenic rupture.\n\nEBV-related infectious mononucleosis causes splenomegaly which increases the risk of traumatic splenic rupture. Treatment is supportive with acetaminophen/NSAIDs. Antibiotics are not indicated. Ampicillin/amoxicillin should be avoided as it causes a maculopapular rash in EBV infection."
    difficulty: easy
    tags: [infectious-disease, EBV, family-medicine, sports-medicine]
  - front: "What is the Modified Centor Score for strep pharyngitis, and how is it used?"
    back: "Criteria (1 point each): cough absent, fever >38°C, tonsillar exudate, swollen/tender anterior nodes, age 5-14 (age 15-44=0, >45=-1). Score 0-2: no testing/antibiotics. Score ≥3: rapid antigen test and treat if positive.\n\nGABHS is the most common bacterial cause of pharyngitis (5-15% adults, 30-40% pediatric). Gold standard is throat culture. Antibiotic treatment reduces severity, transmission (after 24h), and rheumatic fever risk."
    difficulty: medium
    tags: [infectious disease, family medicine, pharyngitis]
  - front: "What is the recommended treatment for Group A beta-hemolytic Streptococcal pharyngitis in adults?"
    back: "Penicillin V 300 mg PO TID or 600 mg BID x 10 days. Mild penicillin allergy: cefuroxime 500 mg BID x 10 days. Severe allergy: azithromycin.\n\nTen days of treatment is required. Antibiotic treatment does not decrease glomerulonephritis incidence. A 48-hour delay in antibiotics does not increase rheumatic fever risk, so culture confirmation is preferred when possible."
    difficulty: easy
    tags: [infectious disease, pharmacology, pharyngitis]
  - front: "What precaution must be observed in infectious mononucleosis (EBV)?"
    back: "Avoid heavy physical activity and contact sports for at least 1 month or until splenomegaly resolves, due to the risk of splenic rupture.\n\nEBV presents with pharyngitis, tonsillar exudate, fever, lymphadenopathy, and fatigue. Diagnosis uses peripheral blood smear and monospot test. Treatment is supportive; antibiotics are not indicated."
    difficulty: easy
    tags: [infectious disease, EBV, family medicine]
  - front: "What are the mandatory reportable STIs in Canada?"
    back: "Chlamydia, gonorrhea, hepatitis B, HIV, syphilis, and chancroid.\n\nChlamydia is the most common reportable STI in Canada. When urethritis/cervicitis is suspected, always treat for both gonococcal and non-gonococcal types (ceftriaxone 250 mg IM + azithromycin 1g PO)."
    difficulty: easy
    tags: [infectious disease, STI, public health]
  - front: "What is the basic structure distinguishing Gram-positive from Gram-negative bacteria, and why does this matter clinically?"
    back: "Gram-positive (GP): thick, rigid peptidoglycan cell wall that retains crystal violet stain (purple). Gram-negative (GN): thin peptidoglycan layer + outer membrane of lipoproteins and lipopolysaccharides (LPS), stains pink. Clinical significance: Gram stain results guide empiric antibiotic selection before culture results are available.\n\nLPS (endotoxin) in GN bacteria triggers immune responses causing sepsis. GP bacteria can also release exotoxins. This structural difference also determines which antibiotics are effective — beta-lactams must penetrate the outer GN membrane."
    difficulty: easy
    tags: [bacteriology, gram stain, gram positive, gram negative, infectious disease]
  - front: "What are acid-fast bacilli (AFB), and which organisms are AFB-positive vs. modified AFB-positive?"
    back: "AFB: bacteria with high mycolic acid content in their cell wall that resist decolourization with acid-alcohol (e.g., Mycobacterium species — positive on both AFB and modified AFB stain). Partially AFB (modified AFB positive only): moderate mycolic acid content, decolourize with acid-alcohol but resist weaker acid (e.g., Nocardia — negative on standard AFB, positive on modified AFB).\n\nThis distinction is clinically important: Mycobacterium tuberculosis and M. avium are AFB-positive. Nocardia causes pulmonary, CNS, and disseminated infections, particularly in immunocompromised hosts, and requires modified staining for identification."
    difficulty: medium
    tags: [AFB, acid-fast bacilli, Mycobacterium, Nocardia, bacteriology, infectious disease]
  - front: "What are the 6 major mechanisms of bacterial virulence/pathogenesis?"
    back: "1. Adherence to skin/mucous membranes (fimbriae/pili attach to epithelial cells, e.g., E. coli UTI). 2. Invasion/crossing epithelial barriers. 3. Evasion of host defenses (capsule inhibits phagocytosis — S. pneumoniae, N. meningitidis, H. influenzae). 4. Toxin production (exotoxins secreted by living bacteria; endotoxins = GN cell wall LPS released on lysis). 5. Intracellular growth (obligate: Rickettsia, Chlamydia; facultative: Salmonella, Listeria, Mycobacteria, Legionella). 6. Biofilm formation (S. epidermidis on prosthetic devices).\n\nUnderstanding virulence mechanisms helps explain clinical presentations and guides treatment. Encapsulated organisms require opsonization for phagocytosis — asplenic patients are particularly susceptible. Biofilm-forming bacteria (S. epidermidis) are major causes of prosthetic device infections."
    difficulty: easy
    tags: [bacteriology, virulence, pathogenesis, infectious disease]
  - front: "Which encapsulated bacteria inhibit phagocytic uptake via their polysaccharide capsule, and why are asplenic patients particularly vulnerable?"
    back: "Key encapsulated bacteria inhibiting phagocytosis: Streptococcus pneumoniae, Neisseria meningitidis, Haemophilus influenzae. The spleen filters and opsonizes encapsulated organisms. Asplenic patients cannot effectively clear these bacteria, putting them at risk for overwhelming post-splenectomy infection (OPSI). Vaccination against these organisms is mandatory post-splenectomy.\n\nThe capsule prevents direct phagocytic recognition. Opsonization with IgG or complement (C3b) is required, and the spleen is a major site for this. Asplenic patients must receive pneumococcal, meningococcal, and Hib vaccines."
    difficulty: medium
    tags: [encapsulated bacteria, asplenia, phagocytosis, pneumococcus, infectious disease]
  - front: "What is the difference between exotoxins and endotoxins? Give clinical examples of each."
    back: "Exotoxins: proteins secreted by living pathogenic bacteria; cause disease even without bacterial presence. Examples: Clostridium tetani (tetanospasmin causing tetanus), Clostridium botulinum (botulinum toxin). Endotoxins: structural LPS components of Gram-negative bacterial cell walls; released during cell lysis. Trigger inflammatory cascade causing sepsis.\n\nExotoxins are heat-labile proteins that can often be neutralized by antitoxins. Endotoxin (LPS) activates toll-like receptor 4 (TLR4) on macrophages, triggering TNF, IL-1, and IL-6 release — the pathogenesis of Gram-negative sepsis and septic shock."
    difficulty: easy
    tags: [exotoxin, endotoxin, LPS, bacteriology, infectious disease]
  - front: "What categories of 'atypical bacteria' are important to recognize, and how do they differ from typical bacteria?"
    back: "Atypical bacteria are not seen on Gram stain and are difficult to culture. Categories: obligate intracellular bacteria (Chlamydia — cannot live outside host cell), bacteria lacking cell wall (Mycoplasma — intrinsically resistant to beta-lactam antibiotics), and spirochetes (Treponema pallidum — syphilis). Require special diagnostic methods and specific antibiotics (e.g., macrolides, doxycycline).\n\nMycoplasma pneumoniae is the classic atypical pneumonia pathogen, which does not respond to beta-lactams because it lacks a cell wall. Spirochetes are visualized by darkfield microscopy or silver staining. Chlamydia is diagnosed by PCR or cell culture."
    difficulty: easy
    tags: [atypical bacteria, Mycoplasma, Chlamydia, spirochetes, infectious disease]
