# Family Medicine Asthma Copd (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the key differences between COPD and asthma in terms of age of onset, reversibility, role of smoking, and spirometry findings?"
    back: "COPD: onset usually 6th decade, >10 pack-year smoking (causal), airflow obstruction is chronic/persistent/not fully reversible, slow progressive worsening, diffusion capacity decreased, hypoxemia chronic in advanced stages. Asthma: any age (50% diagnosed in children), smoking not causal (known trigger), airflow obstruction episodic and usually reversible with therapy, marked improvement with bronchodilators or steroids, diffusion capacity normal, hypoxemia episodic only with severe attacks.\n\nThe hallmark symptom of asthma is wheeze, while COPD presents with chronic cough, sputum, and/or dyspnea. Asthma cannot be diagnosed at first presentation. Spirometry can be done starting at age 6. History of allergy is present in >50% of asthmatics but infrequent in COPD."
    difficulty: medium
    tags: [asthma, COPD, spirometry, differential diagnosis, family medicine, respirology]
  - front: "What are the signs of poorly controlled asthma?"
    back: "Beta-2 agonist (SABA) use more than 3 times per week, asthma-related absence from work/school, exercise-induced asthma, night-time symptoms more than 1 time per week.\n\nThese are key monitoring targets in asthma management. Frequent SABA use signals inadequate control and the need to step up therapy (e.g., add low-dose ICS). Regular use of a peak flow meter helps patients self-monitor at home. All poorly controlled asthmatics should have a written asthma action plan."
    difficulty: easy
    tags: [asthma, poorly controlled, monitoring, SABA, family medicine]
  - front: "Outline the stepwise management of COPD."
    back: "Mild – Step 1: SABA as needed (salbutamol). Step 2: SABA as needed + LAAC (tiotropium) OR + LABA (salmeterol). Moderate – Step 3: SABA/SAMA + LABA, or SABA + LABA, or LAAC; consider inhaled vs. oral steroids. Severe – Step 4: As above + pneumococcal vaccination + annual influenza immunization. All steps: smoking cessation, ongoing patient education, environmental control.\n\nLAAC = long-acting anticholinergic (tiotropium/umeclidinium). LABA = long-acting beta-agonist. The backbone of COPD management differs from asthma — ICS are not first-line in COPD (unlike asthma), and anticholinergics play a central role. Vaccinations are particularly important in COPD due to increased risk of exacerbations."
    difficulty: medium
    tags: [COPD, management, stepwise, SABA, LAAC, LABA, family medicine]
  - front: "Outline the stepwise management of asthma."
    back: "All steps: SABA (salbutamol) as rescue medication + maintenance meds, smoking cessation, patient education. Mild – Step 1: Low-dose ICS. Step 2: Medium/high-dose ICS, or low-dose ICS + LABA, or leukotriene modifier. Moderate – Step 3: Medium/high-dose ICS + LABA or LT modifier. Severe – Step 4: As above + immunotherapy + oral glucocorticosteroids + pneumococcal + annual influenza immunization.\n\nICS are the cornerstone of asthma maintenance therapy at all levels beyond Step 1. SABA (salbutamol) is rescue only — its frequent use (>3x/week) signals inadequate control. Leukotriene modifiers (e.g., montelukast) are alternatives to LABA in mild-to-moderate asthma. Spacers should always be used with MDI inhalers to reduce local side effects and improve lung deposition."
    difficulty: medium
    tags: [asthma, management, stepwise, ICS, SABA, LABA, family medicine]
  - front: "What are the environmental advantages of DPI over MDI inhalers, and what is the key technique difference?"
    back: "MDIs have 20–30 times larger carbon footprints than DPIs (e.g., Accuhaler, Ellipta). DPIs require deep and fast breathing (may not be ideal for young children or during acute exacerbations). MDIs should be used with spacers to reduce local side effects, improve lung deposition, and increase efficiency.\n\nThere is a large clinical push to transition from MDIs to DPIs to reduce environmental impact of aerosol propellants. Nebulizers are recommended when there are contraindications to MDIs. Salbutamol (MDI) may cause hypokalemia — monitor for lethargy, irritability, paresthesias, myalgias, weakness, palpitations, N/V, polyuria."
    difficulty: medium
    tags: [inhalers, MDI, DPI, asthma, COPD, environment, technique, family medicine]
