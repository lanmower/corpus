# Urology Incontinence (Urology) - generated from srs-mccqe1
cards:
  - front: "What are the four types of urinary incontinence and their definitions?"
    back: "1. Stress: leakage with increased intra-abdominal pressure (cough, sneeze, exertion). 2. Urgency: leakage preceded by a strong, sudden urge to void. 3. Mixed: features of both stress and urgency. 4. Overflow: leakage associated with urinary retention.\n\nUnderstanding the type of incontinence guides management: stress incontinence is treated with pelvic floor exercises/slings; urgency with anticholinergics/beta-3 agonists; overflow by treating the underlying cause and catheterization."
    difficulty: easy
    tags: [urinary incontinence, stress incontinence, urgency incontinence, overflow incontinence, LUTS]
  - front: "What is the etiology of stress urinary incontinence?"
    back: "Sphincter incompetence and/or urethral hypermobility. Common in middle-aged and older women, and men following prostate cancer treatment.\n\nStress urinary incontinence results from inadequate urethral closure mechanism during increases in intra-abdominal pressure. In men, it is most commonly iatrogenic following radical prostatectomy."
    difficulty: easy
    tags: [stress incontinence, urethral hypermobility, sphincter incompetence, prostate cancer]
  - front: "What is urgency, and is it the same as urgency incontinence?"
    back: "Urgency is a compelling desire to void that is difficult to defer. It is NOT the same as urgency incontinence — urgency can occur without actual leakage.\n\nThis distinction is clinically important: urgency alone (overactive bladder without incontinence) may respond to behavioral measures alone, whereas urgency incontinence typically requires pharmacological treatment (anticholinergics, beta-3 agonists)."
    difficulty: easy
    tags: [urgency, urgency incontinence, OAB, LUTS]
  - front: "What is the mnemonic DIAPERS and when is it used?"
    back: "DIAPERS = causes of transient incontinence in the elderly: Delirium, Infection (UTI), Atrophic vaginitis/urethritis, Pharmaceuticals/Psychological, Excess UI, Restricted mobility/Retention, Stool impaction.\n\nMany elderly patients have reversible incontinence from non-urological causes. Identifying and treating these causes first can resolve incontinence before considering urological interventions."
    difficulty: easy
    tags: [incontinence, elderly, DIAPERS, geriatrics]
