# Infectious Diseases (InfectiousDisease) - generated from srs-mccqe1
cards:
  - front: "Which bacteria are Gram-positive cocci (aerobes) in the common bacteria classification?"
    back: "Staphylococcus (S. aureus, S. saprophyticus, S. epidermidis, S. lugdunensis) and Streptococcus (S. pneumoniae [diplococci], S. pyogenes [GAS], S. agalactiae [GBS], S. anginosus group) and Enterococcus (E. faecalis)\n\nGram-positive cocci aerobes are clinically important pathogens causing a wide range of infections from skin/soft tissue to endocarditis. Distinguishing staphylococci (catalase-positive) from streptococci (catalase-negative) is a key lab step."
    difficulty: easy
    tags: [microbiology, gram-positive, cocci, bacteria, infectious diseases]
  - front: "Which Gram-positive bacilli are NOT spore-forming?"
    back: "Listeria monocytogenes, Corynebacterium diphtheriae, Actinomyces, Cutibacterium (formerly Propionibacterium) acnes, and Lactobacillus\n\nNon-spore-forming GP bacilli are distinguished from spore-formers like Bacillus and Clostridium. Listeria is important in food-borne illness, particularly in immunocompromised and pregnant patients."
    difficulty: medium
    tags: [microbiology, gram-positive, bacilli, bacteria]
  - front: "Which bacteria are NOT seen on Gram stain and why?"
    back: "Acid-fast bacteria (Mycobacterium tuberculosis, M. leprae, M. avium complex), obligate intracellular bacteria (Rickettsia, Chlamydia), bacteria with no cell wall (Mycoplasma), and spirochetes (Treponema pallidum) are not visible on standard Gram stain.\n\nThese organisms require special staining techniques: acid-fast stain (Ziehl-Neelsen) for mycobacteria, dark-field microscopy or silver stain for spirochetes, and cell culture or PCR for obligate intracellular organisms. Mycoplasma lacks a cell wall entirely."
    difficulty: easy
    tags: [microbiology, gram stain, acid-fast, intracellular bacteria]
  - front: "What is the normal commensal flora of the vagina?"
    back: "Lactobacillus acidophilus, viridans group streptococci, coagulase-negative staphylococci, and facultative anaerobes\n\nLactobacillus is the dominant organism and maintains vaginal pH via lactic acid production, protecting against pathogens. Disruption of this flora (e.g., antibiotics) can predispose to bacterial vaginosis or candidiasis."
    difficulty: easy
    tags: [microbiology, commensal flora, vaginal flora, infectious diseases]
  - front: "What is the key laboratory difference between Staphylococcus aureus and coagulase-negative staphylococci?"
    back: "S. aureus is coagulase-positive; coagulase-negative staphylococci (e.g., S. epidermidis, S. saprophyticus, S. lugdunensis) are coagulase-negative.\n\nThe coagulase test is essential for identifying S. aureus, the more virulent pathogen associated with abscesses, bacteremia, endocarditis, and toxic shock syndrome. Coagulase-negative species are less virulent but important in prosthetic device infections."
    difficulty: easy
    tags: [microbiology, staphylococcus, laboratory identification]
  - front: "How are Streptococci classified in the laboratory?"
    back: "By hemolysis pattern on sheep blood agar (alpha, beta, or gamma hemolysis) and by Lancefield grouping (A, B, C, D, G). S. pneumoniae is alpha-hemolytic, S. pyogenes (GAS) is Group A beta-hemolytic, S. agalactiae (GBS) is Group B beta-hemolytic.\n\nBeta-hemolytic streptococci lyse red blood cells completely, alpha-hemolytic cause partial lysis (greenish discoloration), and gamma-hemolytic cause no lysis. This classification guides empiric antibiotic therapy."
    difficulty: easy
    tags: [microbiology, streptococcus, laboratory identification, hemolysis]
  - front: "How are Gram-negative bacilli (Enterobacterales) further classified in the laboratory?"
    back: "By oxidase test (negative for Enterobacterales), then glucose fermentation, and then lactose fermentation. Lactose fermenters: E. coli, Klebsiella. Non-lactose fermenters: Salmonella typhi, Shigella, Proteus. Oxidase-positive GNB: Pseudomonas, Vibrio, Campylobacter.\n\nThese biochemical tests guide identification and narrow antibiotic selection. For example, non-lactose fermenting colonies on MacConkey agar require further characterization to differentiate enteric pathogens."
    difficulty: medium
    tags: [microbiology, gram-negative, enterobacterales, laboratory identification]
  - front: "What are the three patterns of viral disease?"
    back: "1. Acute infections: host cells lysed during virion release (e.g., adenovirus); some may have late sequelae (e.g., measles causing subacute sclerosing panencephalitis). 2. Chronic infections (>6 months): host cell machinery chronically releases virions (e.g., HBV, HIV). 3. Latent infections: viral genome remains latent and can reactivate (e.g., HSV, VZV).\n\nUnderstanding viral disease patterns informs prognosis and treatment. Latent viruses (herpesviruses) can reactivate during immunosuppression; chronic infections (HBV, HCV) lead to long-term complications like cirrhosis and hepatocellular carcinoma."
    difficulty: easy
    tags: [virology, viral disease, infectious diseases]
  - front: "Which human herpesviruses (HHV) exist, and what disease does each cause?"
    back: "HHV1 (HSV-1): oral/ocular/genital herpes, encephalitis. HHV2 (HSV-2): genital/oral/ocular herpes, encephalitis. HHV3 (VZV): chickenpox, shingles. HHV4 (EBV): mononucleosis, viral hepatitis. HHV5 (CMV): retinitis, pneumonitis, hepatitis, encephalitis. HHV6: roseola. HHV7: roseola. HHV8 (KSHV): Kaposi's sarcoma, multicentric Castleman's disease, body cavity lymphoma.\n\nAll herpesviruses are enveloped dsDNA viruses (Herpesviridae family) and establish lifelong latency. Reactivation is especially clinically significant in immunocompromised patients (HIV, transplant)."
    difficulty: medium
    tags: [virology, herpesviruses, HHV, infectious diseases]
  - front: "Which viruses are positive-sense single-stranded RNA with NO envelope (non-enveloped)?"
    back: "Picornaviridae (poliovirus, echovirus, rhinovirus, coxsackievirus, hepatitis A), Caliciviridae (noroviruses, hepatitis E), Reoviridae (rotavirus — dsRNA).\n\nNon-enveloped viruses are more resistant to desiccation, detergents, and harsh environments, making them effective in fecal-oral transmission. Alcohol-based hand sanitizers are less effective; soap and water are preferred for norovirus."
    difficulty: medium
    tags: [virology, ssRNA, non-enveloped viruses, picornaviridae]
  - front: "What is the key difference between Influenza A and Influenza B viruses?"
    back: "Influenza A infects humans, birds, and mammals and can undergo both antigenic drift AND shift, leading to epidemics and pandemics. Influenza B infects humans only, undergoes antigenic drift but NOT shift, and causes epidemics but NOT pandemics.\n\nAntigenic shift (abrupt, major changes via reassortment) occurs only in Influenza A because it infects multiple species, allowing mixing of viral segments. This is why pandemic influenza is always Influenza A (e.g., H1N1 2009)."
    difficulty: easy
    tags: [virology, influenza, antigenic drift, antigenic shift, pandemic]
  - front: "What is the mechanism of fungal cell membrane and cell wall that differs from human cells and bacteria?"
    back: "Fungi use ergosterol in their cell membrane (humans use cholesterol; bacteria have no sterol) and chitin (complex glycopolysaccharide) in their cell wall (bacteria use peptidoglycan; humans have no cell wall).\n\nThese differences are the basis of antifungal drug targets: azoles and polyenes target ergosterol (analogous to statins targeting cholesterol synthesis in humans). Echinocandins target glucan synthesis in the fungal cell wall."
    difficulty: easy
    tags: [mycology, fungal cell wall, ergosterol, antifungals]
  - front: "What are the 3 morphologies of fungi?"
    back: "1. Yeast (unicellular). 2. Moulds/filamentous fungi (multicellular with hyphae — septate or non-septate). 3. Dimorphic fungi (mould at room temperature, yeast at body temperature — e.g., Histoplasma, Blastomyces, Coccidioides).\n\nThe mnemonic 'mould in the cold, yeast in the heat' applies to dimorphic fungi. Aspergillus (septate hyphae) and Mucor/Rhizopus (non-septate hyphae) are important pathogenic moulds."
    difficulty: easy
    tags: [mycology, fungal morphology, dimorphic fungi]
  - front: "What are the key differences between protozoa and helminths?"
    back: "Protozoa: unicellular, motile trophozoite/inactive cyst stage, multiply in human host, eosinophilia unusual, indefinite lifespan. Helminths: multicellular, adult-egg-larva life cycle, no multiplication in human host, eosinophilia proportional to tissue invasion, definite lifespan.\n\nPeripheral eosinophilia is a key diagnostic clue pointing toward helminthic (parasitic worm) infection. Note: adult Ascaris does NOT cause eosinophilia, but its migratory larval phase causes high-grade eosinophilia."
    difficulty: easy
    tags: [parasitology, protozoa, helminths, eosinophilia]
  - front: "What are the 5 mechanisms of parasitic disease?"
    back: "1. Mechanical obstruction (e.g., ascariasis, clonorchiasis). 2. Competition with host for resources (e.g., anemia in hookworm, vitamin B12 deficiency in diphyllobothriasis). 3. Cytotoxicity causing abscesses/ulcers (e.g., amoebiasis, leishmaniasis). 4. Inflammatory response (acute hypersensitivity in Loeffler's, egg granulomas in schistosomiasis). 5. Immune-mediated injury (autoimmune myocarditis in Chagas, immune complex nephritis in malaria).\n\nUnderstanding the mechanism helps explain clinical presentations: vitamin B12 deficiency from fish tapeworm (Diphyllobothrium latum) consuming B12; Loeffler's syndrome (transient pulmonary eosinophilia) from larval migration."
    difficulty: medium
    tags: [parasitology, mechanisms of disease, infectious diseases]
  - front: "What are the infection control precautions for airborne vs. droplet vs. contact transmission?"
    back: "Airborne (<5 μm droplet nuclei, remain infectious over time and distance): N95 mask, negative pressure room — examples: M. tuberculosis, disseminated VZV, measles. Droplet (>5 μm, <2 m range): surgical mask, private room — examples: influenza, mumps, N. meningitidis, B. pertussis. Contact: gloves, gown — examples: MRSA, skin-to-skin infections.\n\nCOVID-19 experience showed a continuum between droplet and airborne transmission. Hand hygiene remains the most essential precaution across all modes of transmission."
    difficulty: easy
    tags: [infection control, transmission precautions, airborne, droplet, contact]
  - front: "What is the definition of a nosocomial (healthcare-associated) infection?"
    back: "An infection acquired >48 hours after admission to a healthcare facility OR within 30 days from discharge.\n\nThe 48-hour threshold distinguishes hospital-acquired from community-acquired infection. Risk factors include prolonged hospital stay, antibiotic use, surgery, ICU care, hemodialysis, and immunodeficiency."
    difficulty: easy
    tags: [nosocomial infection, healthcare-associated infection, infection control]
  - front: "What are the treatment and decolonization strategies for MRSA?"
    back: "Treatment of MRSA infection: vancomycin, daptomycin, or linezolid. Decolonization: chlorhexidine 2% wash once daily + rifampin + (doxycycline or TMP/SMX) + mupirocin cream BID to nares × 7 days. Infection control: contact precautions.\n\nMRSA screening from nares and peri-anal region identifies colonization. Decolonization is important in preventing transmission and recurrent infection in carriers. Vancomycin is the first-line IV agent for serious MRSA infection."
    difficulty: medium
    tags: [MRSA, antibiotic resistance, nosocomial infection, vancomycin]
  - front: "What is the treatment algorithm for Clostridioides difficile infection (CDI)?"
    back: "1. Stop culprit antibiotic (especially fluoroquinolones and clindamycin). 2. Supportive therapy (IV fluids). 3. Empiric treatment: vancomycin PO or fidaxomicin PO. If access limited, metronidazole may be used. 4. Fulminant CDI: oral vancomycin + IV metronidazole (if ileus). Diagnosis: stool PCR for toxin A and B genes (most sensitive); stool immunoassay less sensitive. Infection control: contact precautions.\n\nThe hypervirulent NAP1/B1/027 strain produces more toxin. Metronidazole is now second-line as fidaxomicin and vancomycin are preferred for efficacy. Fecal microbiota transplantation is used for recurrent CDI."
    difficulty: medium
    tags: [C. difficile, CDI, nosocomial infection, vancomycin, fidaxomicin]
  - front: "What is the treatment for ESBL-producing Enterobacterales infections?"
    back: "Carbapenems (e.g., meropenem, ertapenem) or non-β-lactam antibiotics. ESBL producers are resistant to most β-lactam antibiotics except carbapenems (e.g., resistant to penicillins, cephalosporins, aztreonam). Contact precautions.\n\nESBLs hydrolyze extended-spectrum cephalosporins and penicillins. Common ESBL producers include E. coli and Klebsiella pneumoniae. Carbapenems are the treatment of choice; inappropriate use promotes carbapenem resistance."
    difficulty: medium
    tags: [ESBL, antibiotic resistance, carbapenem, nosocomial infection]
  - front: "What treatment options exist for Carbapenemase-Producing Enterobacterales (CPE)?"
    back: "Colistin, tigecycline (based on susceptibility); newer options available through Canada's Special Access Program: cefiderocol, ceftazidime-avibactam, meropenem-vaborbactam, imipenem-relebactam, plazomicin. Contact precautions required.\n\nCPE represents the most resistant gram-negative organisms. These bacteria are resistant to virtually all β-lactam antibiotics including carbapenems. Treatment options are severely limited and require specialist input."
    difficulty: hard
    tags: [CPE, carbapenem resistance, colistin, special access program, nosocomial infection]
  - front: "What are the common organisms causing community-acquired pneumonia (CAP)?"
    back: "Typical bacteria: S. pneumoniae (most common), Moraxella catarrhalis, Haemophilus influenzae, S. aureus/GAS. Atypical bacteria: Mycoplasma pneumoniae, Chlamydia pneumoniae, Legionella pneumophila. Viral: Influenza, Adenovirus, SARS-CoV-2.\n\nS. pneumoniae remains the most common bacterial cause of CAP. Atypical pathogens do not respond to β-lactams and require macrolides, doxycycline, or fluoroquinolones. Legionella is associated with contaminated water systems and presents with GI symptoms."
    difficulty: easy
    tags: [pneumonia, CAP, community-acquired pneumonia, S. pneumoniae, atypical pneumonia]
  - front: "What organisms cause pneumonia in immunocompromised patients?"
    back: "Pneumocystis jirovecii (PJP), fungi (e.g., Cryptococcus), Nocardia, enteric GNB, S. aureus, oral anaerobes (aspiration), HSV.\n\nPJP is the classic AIDS-defining pneumonia (CD4 <200). Cryptococcus is also common in HIV. Nocardia occurs in T-cell immunodeficiency. Recognizing the immunocompromised state broadens the differential significantly."
    difficulty: medium
    tags: [pneumonia, immunocompromised, PJP, Cryptococcus, Nocardia]
  - front: "What is the CURB-65 score and how is it interpreted?"
    back: "CURB-65 predicts mortality in community-acquired pneumonia. 1 point each for: Confusion (altered mental status), Urea >7 mmol/L or BUN >20 mg/dL, Respiratory Rate >30 breaths/min, Blood Pressure <90 mmHg systolic or <60 mmHg diastolic, Age ≥65. Score 0-1: <5% mortality, consider outpatient. Score 2-3: ~15% mortality, consider hospitalization. Score 4-5: 15-30% mortality, consider ICU.\n\nCURB-65 is a validated clinical prediction tool for CAP. It guides disposition decisions. The PSI (Pneumonia Severity Index) is also used and is preferred by some guidelines but is more complex to calculate."
    difficulty: easy
    tags: [pneumonia, CURB-65, clinical prediction tool, CAP, prognosis]
  - front: "What are the components of the Pneumonia Severity Index (PSI) and its risk classes?"
    back: "PSI uses demographics (age, sex, nursing home residence), comorbidities (neoplasm +30, liver disease +20, CHF +10, CVD +10, renal disease +10), exam findings (AMS +20, RR ≥30 +20, sBP <90 +20, T<35 or ≥40 +15, HR >125 +10), and labs/imaging (pH <7.35 +30, BUN >30 +20, Na <130 +20, glucose ≥250 +10, Hct <30 +10, PaO2 <60 +10, effusion +10). Class I (<51 pts): 0.7%; II (51-70): 0.6%; III (71-90): 0.9-2.8%; IV (91-130): 8.2-9.3%; V (>130): 21-29.2%. Classes I-III: consider outpatient; IV-V: hospitalize.\n\nPSI is more validated and precise than CURB-65 but more complex. The PSI is preferred over CURB-65 in recent IDSA/ATS guidelines for guiding hospitalization decisions in CAP."
    difficulty: hard
    tags: [pneumonia, PSI, pneumonia severity index, CAP, prognosis]
  - front: "What is the outpatient treatment for CAP with no comorbidities per IDSA/ATS 2019 guidelines?"
    back: "Amoxicillin OR Doxycycline OR Macrolide (azithromycin or clarithromycin — if local pneumococcal resistance <25%). For patients with comorbidities: amoxicillin-clavulanate or cephalosporin (cefpodoxime or cefuroxime) PLUS macrolide or doxycycline; OR respiratory fluoroquinolone (moxifloxacin or levofloxacin).\n\nMonotherapy with amoxicillin covers S. pneumoniae. Dual therapy with a β-lactam plus macrolide or doxycycline adds atypical coverage. Respiratory fluoroquinolones cover both typical and atypical pathogens in a single agent."
    difficulty: medium
    tags: [pneumonia, CAP treatment, antibiotics, IDSA, outpatient]
  - front: "What defines severe CAP requiring ICU admission per IDSA/ATS criteria?"
    back: "One MAJOR criterion: septic shock requiring vasopressors, or respiratory failure requiring mechanical ventilation. OR Three or more MINOR criteria: RR ≥30, PaO2/FiO2 <250, multilobar infiltrates, confusion/disorientation, BUN ≥20 mg/dL, WBC <4000/μL (from infection), platelets <100,000/μL, temperature <36°C, hypotension requiring aggressive fluid resuscitation.\n\nSeverity criteria direct triage to ICU and guide empiric antibiotic breadth. Severe CAP requires broader coverage including consideration for Legionella and more coverage of S. pneumoniae."
    difficulty: hard
    tags: [pneumonia, severe CAP, ICU, IDSA, ATS]
  - front: "What antibiotics are recommended for hospital-acquired pneumonia (HAP) without risk factors for MRSA or high mortality risk?"
    back: "Monotherapy with ONE of: piperacillin-tazobactam, cefepime, levofloxacin, imipenem, or meropenem (per IDSA/ATS HAP/VAP guidelines 2016).\n\nHAP (non-VAP) without MRSA risk factors can be treated with antipseudomonal monotherapy. Adding MRSA coverage (vancomycin or linezolid) is indicated when there is increasing likelihood of MRSA or prior IV antibiotic use within 90 days."
    difficulty: medium
    tags: [HAP, hospital-acquired pneumonia, antibiotics, piperacillin-tazobactam, IDSA]
  - front: "What vaccines does the Public Health Agency of Canada recommend for pneumonia/influenza prevention?"
    back: "1. Influenza vaccine annually for all ages ≥6 months. 2. mRNA COVID-19 vaccine (Moderna Spikevax or Pfizer-BioNTech Comirnaty) for all ages ≥5 years, with boosters per public health guidance; and for ages ≥6 months to 5 years at high risk. 3. Pneumococcal conjugate vaccine Pneu-C-15 (VAXNEUVANCE) or Pneu-C-20 (PREVNAR 20) for children 2 months to 18 years; Pneu-C-20 for immunocompromised and all adults ≥65 years.\n\nCanadian pneumococcal vaccine guidelines were updated May 2024 (NACI). Pneu-C-20 covers all serotypes in PNEUMOVAX 23 plus 7 additional. However, Pneu-C-20 and Pneu-C-15 are not yet covered by all provincial/territorial programs."
    difficulty: easy
    tags: [pneumococcal vaccine, influenza vaccine, COVID-19 vaccine, vaccination, prevention]
  - front: "What are the subtypes of influenza A and how are they classified?"
    back: "Influenza A is classified by two envelope glycoproteins: hemagglutinin (H, 18 types) and neuraminidase (N, 11 types). Currently circulating seasonal strains: influenza A (H1N1) and influenza A (H3N2). Antigenic drift creates new strains causing seasonal epidemics; antigenic shift creates entirely new subtypes causing pandemics (influenza A only).\n\nH1N1 caused the 1918 Spanish flu pandemic and the 2009 swine flu pandemic. H5N1 is a highly pathogenic avian influenza strain of pandemic concern. Antigenic shift requires reassortment between two different influenza A strains from different animal hosts."
    difficulty: medium
    tags: [influenza A, hemagglutinin, neuraminidase, antigenic shift, pandemic]
  - front: "What is the treatment for influenza and who is at high risk for complications?"
    back: "Treatment: neuraminidase inhibitors — oseltamivir (Tamiflu) or zanamivir (Relenza) or peramivir (Rapivab) for types A and B. Started within 48 hours; decreases duration by ~1 day. High-risk groups: hospitalized patients, elderly ≥65, children <2 years, pregnant women/≤2 weeks postpartum, immunocompromised, and those with severe/chronic medical conditions (asthma, COPD, CVD, DM, obesity).\n\nTreatment beyond 48 hours may be warranted in immunosuppressed and critically ill patients. Influenza complications include viral pneumonia, secondary bacterial pneumonia, rhabdomyolysis, encephalitis, and Guillain-Barré syndrome. Research also shows influenza increases acute MI risk within 7 days."
    difficulty: easy
    tags: [influenza, oseltamivir, tamiflu, antiviral, high risk]
  - front: "What are the key features of SARS-CoV-2 (COVID-19) pathophysiology and clinical presentation?"
    back: "SARS-CoV-2 is an enveloped positive-sense ssRNA virus. Entry via spike protein binding to ACE2 receptors on lung surface epithelium. Causes cytotoxic damage to alveolar epithelium; dysregulated immune response can lead to cytokine storm and organ failure. Most common symptoms: fever, fatigue, dry cough. Common: dyspnea, anosmia/ageusia, anorexia, myalgia. 1 in 3 infected are asymptomatic.\n\nACE2 is highly expressed in lung, GI tract, heart, kidney, and blood vessels, explaining multisystem involvement. Post-COVID condition (long COVID) causes persistent symptoms across organ systems, often exacerbated by mental and physical overexertion."
    difficulty: easy
    tags: [COVID-19, SARS-CoV-2, ACE2, cytokine storm, clinical features]
  - front: "What is the treatment for critically ill hospitalized COVID-19 adults requiring ventilatory or circulatory support?"
    back: "1. Dexamethasone PO or IV (for duration of hospitalization until discharge). 2. Tocilizumab (if within 14 days of new COVID-19 diagnosis). 3. Prophylactic low molecular-weight or unfractionated heparin (VTE prophylaxis).\n\nDexamethasone reduces mortality in patients requiring oxygen (RECOVERY trial). Tocilizumab (IL-6 receptor antagonist) reduces inflammation and improves survival in severe disease. Anticoagulation prevents COVID-associated coagulopathy and thromboembolic events."
    difficulty: medium
    tags: [COVID-19, dexamethasone, tocilizumab, critical illness, treatment]
  - front: "What is the treatment for mild-to-moderate COVID-19 in high-risk patients who do not require supplemental oxygen?"
    back: "Nirmatrelvir/ritonavir (Paxlovid) if presenting within 5 days of symptom onset, OR remdesivir if presenting within 7 days of symptom onset. Low-risk patients receive supportive care only.\n\nPaxlovid (nirmatrelvir/ritonavir) is an oral protease inhibitor combination with significant drug-drug interactions due to ritonavir's CYP3A4 inhibition. Remdesivir is an RNA polymerase inhibitor given IV. Stratifying by hospitalization risk guides antiviral therapy decisions."
    difficulty: medium
    tags: [COVID-19, Paxlovid, nirmatrelvir, remdesivir, antiviral]
  - front: "Which groups are RECOMMENDED for COVID-19 antiviral therapy regardless of vaccination status?"
    back: "1. Age ≥65 with no other risk factors. 2. Immunocompromised patients (any age): advanced untreated HIV or HIV with CD4 ≤200/mm3, bone marrow/stem cell transplant, solid organ transplant, active hematological malignancy or recent anti-CD20 agents/B-cell depleting agents in last 2 years, CAR T-cell therapy in last 6 months, systemic cancer therapy in last 6 months or radiation in last 3 months, prednisone ≥20 mg/day for ≥14 days or other severely immunosuppressive therapies, primary immunodeficiencies.\n\nAntiviral therapy for COVID-19 is most beneficial in immunocompromised patients who may not mount adequate immune responses to infection. Early treatment (within 5-7 days of symptom onset) is essential for efficacy."
    difficulty: medium
    tags: [COVID-19, antiviral therapy, immunocompromised, high risk, Paxlovid]
  - front: "What is cellulitis and what are its most common causative organisms?"
    back: "Cellulitis is an acute infection of the skin involving principally the dermis and subcutaneous tissue. Most common causative agents: β-hemolytic streptococci (most common in non-purulent cellulitis), S. aureus, and occasionally S. lugdunensis. Immunocompromised or water-exposed patients: also GN rods and fungi. Bite wounds: skin flora of 'bitee' and mouth flora of 'biter'.\n\nNon-purulent cellulitis is predominantly streptococcal; purulent cellulitis (with abscess or drainage) is more likely S. aureus/MRSA. Risk factors include trauma, PVD, lymphedema, DM, and tinea pedis (portal of entry)."
    difficulty: easy
    tags: [cellulitis, skin infection, SSTI, streptococcus, S. aureus]
  - front: "What are the clinical features, investigations, and treatment of cellulitis?"
    back: "Clinical: pain, edema, erythema with indistinct borders ± regional lymphadenopathy, systemic symptoms (fever, chills, malaise); can lead to ascending lymphangitis (red streaking along lymphatics). Investigations: CBC and blood C&S (if malignancy, severe systemic features, unusual predisposing factors); skin swab ONLY if open wound with pus. Treatment: cephalexin PO (broader coverage if GN rod risk); cefazolin IV if extensive erythema or systemic symptoms; empiric MRSA coverage if MRSA suspected.\n\nThe indistinct border of cellulitis helps distinguish it from erysipelas (which has a distinct raised border). Elevating the affected limb reduces edema and speeds recovery. Blood cultures are low yield in uncomplicated cellulitis."
    difficulty: easy
    tags: [cellulitis, cephalexin, SSTI, skin infection, treatment]
  - front: "What is necrotizing fasciitis and what are its two types?"
    back: "Necrotizing fasciitis is a life- and limb-threatening infection of the deep fascia characterized by rapid spread. Type I: polymicrobial (aerobes + anaerobes: e.g., S. aureus, Bacteroides, Enterobacterales). Type II: monomicrobial with GAS (Group A Streptococcus), less commonly S. aureus.\n\nType I is more common in diabetics and post-surgical patients. Type II (GAS) is classic 'flesh-eating disease' with streptococcal toxic shock syndrome. Both require aggressive surgical debridement — delay is fatal."
    difficulty: easy
    tags: [necrotizing fasciitis, SSTI, GAS, polymicrobial, surgical emergency]
  - front: "What are the clinical features of necrotizing fasciitis that distinguish it from cellulitis?"
    back: "1. Pain out of proportion to clinical findings and beyond border of erythema. 2. Edema ± crepitus (subcutaneous gas from anaerobes). 3. Rapid spread. 4. Rapid systemic toxicity (tachycardia, hypotension, disorientation, fever). 5. Late findings: skin turns dusky blue/black (thrombosis and necrosis), induration, hemorrhagic bullae, loss of sensation (paresthesias).\n\nThe hallmark is severe pain disproportionate to the visible skin findings. Crepitus indicates gas-producing anaerobes (Type I). Skin necrosis and bullae are late, ominous signs. Elevated serum CK indicates myonecrosis."
    difficulty: easy
    tags: [necrotizing fasciitis, clinical features, crepitus, pain out of proportion, SSTI]
  - front: "What is the treatment of necrotizing fasciitis?"
    back: "1. IV fluid resuscitation. 2. Emergency surgical debridement (may require amputation) — do NOT wait for investigation results. 3. IV antibiotics: unknown organism: meropenem or pip-tazo + clindamycin IV ± vancomycin. Type I (polymicrobial): piperacillin-tazobactam + clindamycin IV. Type II with GAS: penicillin G + clindamycin IV. Type II with S. aureus: cefazolin (or cloxacillin) + clindamycin IV. 4. Evaluate for streptococcal toxic shock syndrome and consider IVIG (Type I).\n\nClindamycin is added in all regimens to suppress toxin production (blocks ribosome protein synthesis). IVIG may neutralize streptococcal toxins in streptococcal toxic shock syndrome. Surgical debridement is the definitive treatment — antibiotics alone are insufficient."
    difficulty: hard
    tags: [necrotizing fasciitis, treatment, surgical debridement, clindamycin, IVIG]
  - front: "What investigations are used to diagnose necrotizing fasciitis?"
    back: "Clinical/surgical diagnosis — do NOT wait for investigations before treatment. Blood and tissue C&S. Serum creatine kinase (CK) — elevated CK indicates myonecrosis (late sign). Plain film x-ray or CT (preferred) — to visualize soft tissue gas. Surgical exploration for definitive diagnosis and debridement.\n\nCT is the best imaging for detecting soft tissue gas and fascial involvement. However, imaging should never delay surgical intervention when clinical suspicion is high. The LRINEC (Laboratory Risk Indicator for Necrotizing Fasciitis) score can aid diagnosis but is not definitive."
    difficulty: medium
    tags: [necrotizing fasciitis, investigations, CT scan, creatine kinase, diagnosis]
  - front: "A 58-year-old diabetic man presents with severe leg pain far exceeding what is visible on examination, with a small area of erythema. His leg feels tense. What is the most likely diagnosis and what should be done immediately?"
    back: "Most likely diagnosis: necrotizing fasciitis. Immediate action: emergency surgical consultation for debridement; do NOT wait for investigations to confirm before proceeding to surgery. Begin IV fluids and broad-spectrum IV antibiotics (meropenem or pip-tazo + clindamycin IV ± vancomycin).\n\nPain out of proportion to visible findings in a diabetic patient is the classic presentation of necrotizing fasciitis. Diabetes is a major risk factor for Type I (polymicrobial) necrotizing fasciitis. Delay in surgical debridement dramatically increases mortality."
    difficulty: medium
    tags: [necrotizing fasciitis, diabetes, surgical emergency, pain out of proportion, clinical reasoning]
  - front: "A 72-year-old woman is admitted with cough, fever, and a right lower lobe infiltrate. Her CURB-65 score is 3. What does this indicate and what treatment setting is recommended?"
    back: "CURB-65 score of 3 indicates approximately 15% mortality and warrants hospitalization. Inpatient treatment with a β-lactam (e.g., ampicillin-sulbactam, cefotaxime, or ceftriaxone) PLUS a macrolide (azithromycin or clarithromycin), OR a respiratory fluoroquinolone (moxifloxacin or levofloxacin) for non-severe CAP without MRSA/Pseudomonas risk factors.\n\nEach CURB-65 component (Confusion, Urea >7 mmol/L, RR >30, BP <90/60, Age ≥65) contributes one point. Hospitalization is generally recommended for scores ≥2-3. The treatment regimen should cover typical and atypical organisms."
    difficulty: medium
    tags: [pneumonia, CURB-65, CAP, inpatient treatment, clinical reasoning]
  - front: "What is the importance of the 3 As of Klebsiella pneumonia?"
    back: "Klebsiella pneumonia is associated with: Aspiration pneumonia (in alcohol use disorder and diabetic patients), Alcohol use disorder and diabetes as risk factors, and Abscess in lungs. Characteristic sputum: red currant jelly sputum (bloody mucoid).\n\nKlebsiella causes a particularly severe pneumonia often with abscess formation and 'red currant jelly' sputum due to necrosis. It preferentially affects the right upper lobe in alcohol use disorder. Enteric GN rods are more common nosocomial and alcohol use disorder-associated pneumonia pathogens."
    difficulty: easy
    tags: [Klebsiella, pneumonia, aspiration pneumonia, red currant jelly sputum, alcohol use disorder]
  - front: "What is the diagnosis and gold standard test for influenza?"
    back: "Diagnosis is primarily clinical based on symptoms during influenza season. Gold standard: nasopharyngeal swabs for RT-PCR. Rapid antigen detection (DFA, direct fluorescent antibody) has lower sensitivity. Lower respiratory specimens for RT-PCR can also be used. Serology is rarely used for clinical management.\n\nRT-PCR distinguishes influenza A from B and can identify subtypes. Rapid antigen tests are faster but miss more cases, particularly in immunocompromised patients with lower viral loads. Clinical diagnosis is reasonable during established outbreaks."
    difficulty: easy
    tags: [influenza, RT-PCR, diagnosis, rapid antigen test, nasopharyngeal swab]
  - front: "What are the etiology categories for acquired oral lesions?"
    back: "1. Infection (candidiasis, gonococcal infection, HSV). 2. Malignancy (adenocarcinoma, leukoplakia). 3. Poor oral hygiene (caries, periodontal disease). 4. Trauma (e.g., abuse). 5. Toxic ingestion. 6. Xerostomia (dry mouth — age, medications). 7. Systemic diseases (lichen planus, Behçet disease).\n\nOral candidiasis (thrush) is common in immunocompromised patients, those on inhaled corticosteroids, and antibiotic users. Leukoplakia is a white patch that cannot be scraped off and has malignant potential. Behçet disease causes recurrent oral and genital ulcers."
    difficulty: easy
    tags: [oral lesions, oral candidiasis, leukoplakia, infectious diseases, dermatology]
  - front: "What is the commensal flora of the colon?"
    back: "E. coli, Klebsiella, Enterobacter, Enterococcus, and anaerobes (Bacteroides, Peptostreptococcus, Clostridium).\n\nThe colon contains the highest bacterial density of any body site (~10^11/mL). Anaerobes outnumber aerobes 100:1 in the colon. Disruption of this flora by antibiotics predisposes to C. difficile infection. Bacteroides fragilis is the most common anaerobic pathogen from colonic perforation."
    difficulty: easy
    tags: [commensal flora, colon, gut microbiome, microbiology]
  - front: "How does vertical transmission of infectious diseases occur and what are examples?"
    back: "Vertical transmission: spread of disease from parent to offspring. Examples: congenital syndromes (TORCH infections — Toxoplasma, Other [syphilis, varicella, parvovirus B19], Rubella, CMV, Herpes simplex), and perinatal transmission (HIV, HBV, GBS). Prevention: prenatal screening and prophylactic treatment.\n\nTORCH infections can cause serious fetal harm. CMV is the most common congenital infection. GBS (Group B Streptococcus) is screened at 35-37 weeks gestation; intrapartum prophylaxis with penicillin reduces neonatal GBS disease. HIV transmission can be reduced to <1% with antiretroviral therapy."
    difficulty: easy
    tags: [vertical transmission, TORCH, congenital infection, perinatal, GBS]
  - front: "What is the mechanism of action of neuraminidase inhibitors for influenza treatment?"
    back: "Neuraminidase inhibitors (oseltamivir/Tamiflu, zanamivir/Relenza, peramivir/Rapivab) inhibit viral neuraminidase, which normally cleaves sialic acid from cell surfaces to allow newly formed virions to be released from infected cells. Inhibition traps virions on the cell surface, preventing spread to new cells.\n\nNeuraminidase (N) is one of the two surface glycoproteins of influenza A (H and N). Oseltamivir is oral; zanamivir is inhaled (avoid in COPD/asthma due to bronchospasm risk); peramivir is IV. All are active against influenza A and B."
    difficulty: medium
    tags: [neuraminidase inhibitor, oseltamivir, Tamiflu, influenza, mechanism of action]
  - front: "What risk factors associated with moderate-to-high risk of severe COVID-19 outcomes may prompt consideration of antiviral therapy (per Ontario Health guidelines)?"
    back: "Risk factors: never vaccinated, active TB, cerebrovascular disease, CKD (especially stage 4-5 or dialysis), chronic lung diseases (asthma, COPD, bronchiectasis, ILD, pulmonary HTN, PE), chronic liver diseases (cirrhosis, NAFLD, alcoholic liver disease, autoimmune hepatitis), cystic fibrosis, DM (type 1 or 2), Down syndrome, heart conditions (HF, CAD, cardiomyopathy), mental health conditions (mood disorders, schizophrenia), neurologic conditions affecting respiratory secretions (e.g., dementia), obesity (BMI >30), pregnancy or recent pregnancy (≤42 days postpartum).\n\nTherapy is RECOMMENDED for ≥3 risk factors (higher risk), MAY BE CONSIDERED for 2 (moderate risk), and generally not indicated for 0-1 (lower risk). These guidelines from Ontario Health reflect Canadian-specific recommendations for antiviral allocation."
    difficulty: hard
    tags: [COVID-19, high risk, antiviral therapy, Paxlovid, Ontario Health]
  - front: "What are the key distinguishing features between oral candidiasis and oral squamous cell carcinoma?"
    back: "Oral candidiasis: white patches that can be wiped off (pseudomembranous) or red patches (atrophic); risk factors include antibiotics, immunocompromise, inhaled corticosteroids, infants/elderly with dentures. Oral SCC: red, red-and-white, or ulcerated lesion present ≥3 weeks, indurated on palpation; risk factors include tobacco, betel, alcohol, HPV-16.\n\nThe ability to wipe off white patches is a key bedside test: pseudomembranous candidiasis plaques wipe off revealing an erythematous base, while SCC lesions are fixed and indurated. Any oral lesion lasting ≥3 weeks warrants biopsy and ENT referral per Canadian guidelines to exclude malignancy."
    difficulty: easy
    tags: [oral infections, candidiasis, oral cancer, squamous cell carcinoma, HPV, infectious diseases]
  - front: "What is the most common route of infection in septic arthritis, and why is it a medical emergency?"
    back: "Hematogenous spread is the most common route. Septic arthritis is a medical emergency because untreated infection causes rapid, irreversible joint destruction.\n\nBacteria seed the synovial space most often from distant bacteremia. The synovial membrane lacks a limiting basement membrane, allowing rapid bacterial proliferation and enzyme-mediated cartilage destruction. Prompt diagnosis via arthrocentesis and empiric antibiotics are critical to preserve joint function."
    difficulty: easy
    tags: [septic arthritis, joint infections, hematogenous spread, orthopedics, infectious diseases]
  - front: "What are the most common organisms causing septic arthritis in different patient populations?"
    back: "N. gonorrhoeae: young sexually active adults (previously 75%). S. aureus: most non-gonococcal cases in adults (especially RA patients), rapidly destructive. Streptococcus spp. (Group A/B). GN organisms: neonates, elderly, IDU, immunocompromised. S. pneumoniae and Kingella kingae: children <4 yr. Salmonella spp.: sickle cell disease. Coagulase-negative Staphylococcus: prosthetic joints.\n\nOrganism selection guides empiric therapy. S. aureus is the dominant non-gonococcal pathogen and is rapidly destructive; MRSA must be considered. Kingella kingae is increasingly recognized in children <4 years. In sickle cell patients, Salmonella causes osteomyelitis and septic arthritis due to functional asplenia."
    difficulty: medium
    tags: [septic arthritis, microbiology, S. aureus, gonorrhea, infectious diseases]
  - front: "What is the Disseminated Gonococcal Infection (DGI) triad?"
    back: "1. Migratory arthralgias, 2. Tenosynovitis, 3. Pustular skin lesions.\n\nDGI from N. gonorrhoeae can manifest in two overlapping forms: a bacteremic form (triad of migratory arthralgias, tenosynovitis, pustular skin lesions) and a septic arthritis form with local joint findings. DGI is the most common form of disseminated gonococcal disease in young, sexually active adults and is treated with ceftriaxone plus azithromycin for concurrent C. trachomatis."
    difficulty: easy
    tags: [gonococcal arthritis, DGI, N. gonorrhoeae, sexually transmitted infections, infectious diseases]
  - front: "What are the mandatory investigations for suspected septic arthritis, and what synovial fluid findings suggest infection?"
    back: "Arthrocentesis is mandatory. Synovial fluid analysis includes: CBC with differential, Gram stain, culture and sensitivity, crystal assessment. Infectious findings: opaque fluid, WBC >15,000/mm³ (higher WBC increases likelihood), PMNs >90%, culture positive. N. gonorrhoeae grows from synovial fluid in <50% of cases.\n\nArthrocentesis is both diagnostic and therapeutic. The combination of elevated WBC with PMN predominance and positive culture is confirmatory, but culture negativity does not exclude infection (especially gonococcal). Crystal analysis also helps rule out gout and pseudogout, which can mimic septic arthritis."
    difficulty: medium
    tags: [septic arthritis, arthrocentesis, synovial fluid, diagnosis, infectious diseases]
  - front: "What is the empiric antibiotic treatment for septic arthritis in adults vs. fully vaccinated children?"
    back: "Adults: cefazolin + vancomycin (empiric). Fully vaccinated children: cefazolin or cloxacillin IV (unless MRSA is a consideration). Gonococcal: ceftriaxone + azithromycin for 7 days. Non-gonococcal durations: Streptococcus 2–3 weeks IV then PO; S. aureus minimum 4 weeks IV; GNB 4 weeks (early switch to PO is safe and effective per newer evidence).\n\nEmpiric coverage must target the most likely organisms. Vancomycin is included in adults to cover MRSA. In fully vaccinated children, Hib and S. pneumoniae are less likely, so cefazolin/cloxacillin is appropriate. Early switch from IV to oral antibiotics for GNB infections is supported by the OVIVA trial."
    difficulty: medium
    tags: [septic arthritis, antibiotics, empiric therapy, treatment, infectious diseases]
  - front: "What are the indications for surgical intervention in septic arthritis?"
    back: "1. Consider surgery in all cases if possible. 2. Persistent positive joint cultures on repeat arthrocentesis. 3. Hip joint involvement (especially pediatric). 4. Prosthetic joint involvement.\n\nThe hip is an anatomically confined joint where pus under pressure rapidly compromises blood supply, risking avascular necrosis—surgical drainage is particularly urgent in children. Prosthetic joints generally require hardware removal. Daily joint aspirations until cultures are sterile is an alternative in accessible joints."
    difficulty: medium
    tags: [septic arthritis, surgery, hip joint, prosthetic joint, orthopedics]
  - front: "What are the three key pathophysiologic contributors to diabetic foot infections, and how is infection severity classified?"
    back: "Contributors: neuropathy, peripheral vascular disease (PVD), and hyperglycemia — all impair healing and predispose to infection. Severity: Mild = superficial (no bone/joint). Moderate = deep (beneath superficial fascia, bone/joint involvement, or erythema >2 cm). Severe = systemic toxicity (fever, tachypnea, leukocytosis, tachycardia, hypotension).\n\nNeuropathy removes protective sensation enabling unnoticed trauma; PVD impairs perfusion and immune cell delivery; hyperglycemia impairs leukocyte function. The probe-to-bone test (positive if bone palpated) has high specificity for osteomyelitis. MRI is the gold standard for diagnosing osteomyelitis when clinical doubt remains."
    difficulty: easy
    tags: [diabetic foot, osteomyelitis, PVD, neuropathy, infectious diseases, diabetes]
  - front: "What organisms cause mild vs. moderate/severe diabetic foot infections, and what are the corresponding antibiotic treatments?"
    back: "Mild: Streptococcus spp., S. aureus → cloxacillin or cephalexin. Moderate/severe: polymicrobial (S. aureus, Streptococcus, Enterococcus, GNB + anaerobes including Peptostreptococcus, Bacteroides, Clostridium) → amoxicillin/clavulanate or ceftriaxone.\n\nMild infections are monomicrobial and can be managed with oral narrow-spectrum agents targeting skin flora. Moderate/severe infections require broad-spectrum coverage including anaerobes due to polymicrobial etiology. Glycemic optimization, pressure offloading, wound care, and consideration of surgical debridement are essential adjuncts."
    difficulty: medium
    tags: [diabetic foot, antibiotics, polymicrobial infection, treatment, infectious diseases]
  - front: "What are the high-risk vs. low/no-risk cardiac conditions for infective endocarditis prophylaxis?"
    back: "High-risk (prophylaxis indicated): prosthetic cardiac valve, previous IE, unrepaired/recently repaired congenital heart disease (within 6 mo) or with residual defects, cardiac transplant with valve disease, surgically constructed systemic-to-pulmonary shunts/conduits. Low/no risk (no prophylaxis needed): secundum ASD, surgically repaired VSD/PDA, mitral valve prolapse, ischemic heart disease, previous CABG.\n\nIE prophylaxis is targeted only at highest-risk individuals undergoing specific procedures (dental procedures causing bleeding, respiratory tract incision/biopsy, infected skin/soft tissue procedures). Blanket prophylaxis for all cardiac patients is no longer recommended per Canadian/AHA guidelines to reduce antibiotic overuse."
    difficulty: medium
    tags: [infective endocarditis, prophylaxis, congenital heart disease, prosthetic valve, cardiology]
  - front: "What is the order of valve involvement frequency in infective endocarditis, and which valve is most commonly affected in IVDU?"
    back: "Overall: MV >> AV > TV > PV. In IVDU: tricuspid valve is involved in 50% of cases.\n\nThe mitral valve is most commonly affected overall due to its high pressure and flow dynamics. In IVDU, the tricuspid valve predominates because injected organisms enter the venous system and directly seed the right heart. Right-sided IE in IVDU typically presents with septic pulmonary emboli rather than systemic emboli."
    difficulty: easy
    tags: [infective endocarditis, valves, IVDU, tricuspid valve, cardiology, infectious diseases]
  - front: "What organisms most commonly cause infective endocarditis on native valves vs. early prosthetic valve (< 2 months) vs. late prosthetic valve (> 2 months)?"
    back: "Native valve: Streptococcus (36%), S. aureus (28%), Enterococcus (11%), S. epidermidis, GNB. Early prosthetic (<2 mo): S. aureus (68%), Streptococcus (13%), S. epidermidis (17%), GNB, Candida. Late prosthetic (>2 mo): Streptococcus (20%), S. aureus (20%), S. epidermidis (20%), Enterococcus (13%).\n\nEarly prosthetic valve IE is predominantly S. aureus from perioperative inoculation, requiring specific empiric coverage. Late prosthetic valve IE has an etiology similar to native valve IE (Streptococcus, S. aureus). Viridans streptococci are the classic cause of subacute IE from dental bacteremia. S. bovis (now Streptococcus gallolyticus) IE is associated with colon cancer."
    difficulty: hard
    tags: [infective endocarditis, microbiology, prosthetic valve, S. aureus, Streptococcus, cardiology]
  - front: "What are the peripheral stigmata of infective endocarditis and their characteristics?"
    back: "Splinter hemorrhages: linear, reddish-brown lesions in nail bed. Janeway lesions: painless, 5 mm erythematous/hemorrhagic macules or papules on soles/palms (vascular phenomenon). Osler's nodes: painful, raised, red/brown, 3–15 mm on digits (immune complex). Roth's spots: retinal hemorrhages with pale centre (immune complex). Petechiae over legs.\n\nJaneway lesions (painless) vs. Osler's nodes (painful) is a classic MCCQE1 distinction. Janeway = embolic/vascular; Osler's = immune complex. The mnemonic FROM JANE: Fever, Roth spots, Osler nodes, Murmur, Janeway lesions, Anemia, Nail-bed hemorrhages, Emboli. These findings combined with bacteremia and echocardiographic abnormalities form the Modified Duke Criteria."
    difficulty: easy
    tags: [infective endocarditis, physical examination, Osler nodes, Janeway lesions, Roth spots, splinter hemorrhages]
  - front: "How is infective endocarditis diagnosed using the Modified Duke Criteria?"
    back: "Definitive: 2 major criteria, OR 1 major + 3 minor, OR 5 minor. Possible: 1 major + 1 minor, OR 3 minor. Major criteria: (1) Microbiologic (typical organisms in ≥2 blood cultures, or atypical in ≥3, or PCR for Coxiella/Bartonella/Whipplei, or single culture/serology for Coxiella); (2) Imaging (echo/CT showing vegetation, abscess, perforation, fistula, new regurgitation, PET/CT abnormality). (3) Surgical evidence. Minor criteria include: predisposing conditions, fever ≥38°C, vascular phenomena, immunologic phenomena, positive blood cultures not meeting major criteria.\n\nThe Modified Duke Criteria provide a standardized diagnostic framework. Blood cultures are essential — 3 sets from different sites >1 hour apart. TTE is first-line but TEE has ~90% sensitivity and is indicated for non-diagnostic TTE or suspected prosthetic valve/complicated IE. An ECG showing prolonged PR interval suggests perivalvular abscess."
    difficulty: medium
    tags: [infective endocarditis, Duke criteria, diagnosis, echocardiography, blood cultures]
  - front: "What is the empiric antibiotic treatment for native valve vs. prosthetic valve infective endocarditis?"
    back: "Native valve (empiric): vancomycin + ceftriaxone OR gentamicin. Prosthetic valve (empiric): vancomycin + gentamicin + rifampin. Targeted therapy is 4–6 weeks, adjusted based on valve, organism, and susceptibilities.\n\nEmpiric treatment must cover S. aureus, coagulase-negative Staphylococcus, and gram-negative organisms. Rifampin is added for prosthetic valves because biofilm formation on foreign material is better penetrated with rifampin. Blood cultures should always be drawn before starting antibiotics. The POET trial showed that carefully selected IE patients can be transitioned to oral antibiotics."
    difficulty: medium
    tags: [infective endocarditis, antibiotics, vancomycin, rifampin, treatment, cardiology]
  - front: "What are the surgical indications for infective endocarditis?"
    back: "Most common: refractory CHF (most frequent indication). Other indications: valve ring abscess, valve perforation, unstable prosthesis, large vegetation >1 cm, recurrent emboli despite adequate antimicrobial treatment, antimicrobial failure (persistently positive blood cultures), fungal etiology, S. aureus on a prosthetic valve.\n\nHeart failure from acute valvular regurgitation is the leading cause of IE-related death and the primary driver for surgical intervention. S. aureus on a prosthetic valve has high mortality with medical therapy alone, necessitating early surgical consideration. IE with Candida requires surgery given poor response to antifungal therapy alone."
    difficulty: medium
    tags: [infective endocarditis, surgery, indications, CHF, prosthetic valve, cardiology]
  - front: "What is the antibiotic prophylaxis regimen for IE-high-risk patients undergoing dental procedures?"
    back: "Amoxicillin single dose 30–60 minutes prior to procedure. If truly penicillin-allergic: azithromycin or clarithromycin. For infected skin/soft tissue procedures: cephalexin single dose (modify based on etiology).\n\nIE prophylaxis is reserved for high-risk patients (prosthetic valves, previous IE, certain congenital heart diseases, cardiac transplant with valve disease) undergoing procedures that risk bacteremia: dental procedures causing bleeding, respiratory tract incisions/biopsies, or procedures on infected skin/musculoskeletal tissue. GI/GU procedures no longer require routine prophylaxis."
    difficulty: easy
    tags: [infective endocarditis, prophylaxis, amoxicillin, dental procedures, penicillin allergy]
  - front: "What are the common organisms causing bacterial meningitis grouped by age?"
    back: "Age <3 months: GBS, E. coli, L. monocytogenes, Klebsiella. Age >3 months (childhood): S. pneumoniae, N. meningitidis, H. influenzae, L. monocytogenes. Adults: S. pneumoniae, N. meningitidis, L. monocytogenes (especially if age >50 or comorbidities). Viral: HSV-1/2, enteroviruses, VZV, parechoviruses, West Nile. Fungal: Cryptococcus, Coccidioides.\n\nNeonates are especially vulnerable to GBS (from maternal colonization) and gram-negative enteric organisms. L. monocytogenes is classically added to coverage for patients >50 years, pregnant women, and immunocompromised patients. S. pneumoniae remains the most common and most lethal cause of bacterial meningitis in adults."
    difficulty: easy
    tags: [meningitis, bacterial meningitis, age-specific organisms, S. pneumoniae, N. meningitidis, CNS infections]
  - front: "What are Kernig's sign and Brudzinski's sign, and how sensitive are they for meningitis?"
    back: "Brudzinski's sign: passive neck flexion causes involuntary flexion of hips and knees. Kernig's sign: resistance to knee extension when hip is flexed. Jolt accentuation: headache worsens when head turned horizontally 2–3 times per second — more sensitive than Brudzinski's and Kernig's. These signs have limited sensitivity; absence of fever, neck stiffness, and altered mental status effectively rules out meningitis.\n\nClassical meningeal signs have poor sensitivity individually. A JAMA 1999 systematic review showed that clinical history items have low accuracy for meningitis diagnosis in adults. However, the triad of fever + neck stiffness + altered mental status is highly specific. In high-risk patients, clinicians should proceed directly to LP given the serious implications of missing bacterial meningitis."
    difficulty: easy
    tags: [meningitis, physical examination, Kernig sign, Brudzinski sign, clinical diagnosis, CNS infections]
  - front: "What are the typical CSF profiles for bacterial vs. viral meningitis?"
    back: "Bacterial: glucose decreased, protein markedly increased, WBC 500–10,000/μL, predominant cell type = neutrophils. Viral: glucose normal, protein increased (mildly), WBC 10–500/μL, predominant cell type = lymphocytes.\n\nIn bacterial meningitis, glucose is decreased because bacteria consume glucose and impair transport (CSF:serum glucose ratio <0.6 is abnormal). Protein is markedly elevated due to blood-brain barrier breakdown and cellular exudate. High WBC with neutrophil predominance indicates purulent meningitis. Early viral meningitis can occasionally show a neutrophil predominance, making clinical correlation essential."
    difficulty: easy
    tags: [meningitis, CSF analysis, lumbar puncture, bacterial meningitis, viral meningitis, CNS infections]
  - front: "What is the empiric antibiotic treatment for bacterial meningitis by age group, and what key adjunct therapy should be given?"
    back: "Age <28 days: ampicillin + cefotaxime. Age 29 days–3 months: ceftriaxone/cefotaxime + vancomycin + ampicillin. Age >3 months: ceftriaxone + vancomycin. Add ampicillin IV if L. monocytogenes risk (age >50, alcohol use disorder, immunocompromised). Adjunct: dexamethasone IV within 20 minutes prior to or with first antibiotic dose (continue only if pneumococcal meningitis confirmed; discontinue for non-pneumococcal).\n\nBacterial meningitis is a medical emergency — antibiotics must NOT be delayed for CT or LP. Vancomycin is added to ceftriaxone to cover penicillin-resistant S. pneumoniae. Dexamethasone reduces inflammation and decreases mortality/morbidity (particularly deafness) in pneumococcal meningitis by attenuating the inflammatory cascade triggered by bacterial lysis."
    difficulty: medium
    tags: [meningitis, antibiotics, dexamethasone, empiric therapy, L. monocytogenes, CNS infections]
  - front: "What are the complications and mortality rates of bacterial meningitis by organism?"
    back: "Complications: death, headache, seizures, cerebral edema, hydrocephalus, SIADH, residual neurological deficits (especially CN VIII damage causing deafness). Mortality: S. pneumoniae ~25%; N. meningitidis 5–10%; H. influenzae ~5%. Worse prognosis: extremes of age, delayed treatment, stupor/coma, seizures, focal neurological signs, septic shock at presentation.\n\nPneumococcal meningitis carries the highest mortality among common organisms. Sensorineural hearing loss (CN VIII) is the most common neurological sequela of bacterial meningitis overall. Early dexamethasone reduces the incidence of hearing loss. N. meningitidis causes fulminant purpura fulminans via DIC and carries epidemic potential."
    difficulty: medium
    tags: [meningitis, prognosis, complications, deafness, mortality, CNS infections]
  - front: "What are the prophylaxis recommendations for close contacts of meningitis cases?"
    back: "H. influenzae type B: rifampin prophylaxis for household contacts if they live with an inadequately immunized (<4 yr) or immunocompromised (<18 yr) child. N. meningitidis: ciprofloxacin, rifampin, or ceftriaxone for close/household contacts; meningococcal vaccines recommended for post-exposure prophylaxis and outbreak control.\n\nClose contacts of meningococcal meningitis are at significantly elevated risk due to shared respiratory secretions. Single-dose ciprofloxacin is the preferred post-exposure prophylaxis in adults. Meningococcal vaccines (quadrivalent and serogroup B) should be offered in outbreak settings and to immunocompromised patients."
    difficulty: medium
    tags: [meningitis, prophylaxis, N. meningitidis, H. influenzae, rifampin, public health]
  - front: "What is encephalitis, how does it differ from meningitis, and what is the most important empiric treatment to initiate?"
    back: "Encephalitis = inflammation of brain parenchyma, with abnormal cerebral function (altered LOC, seizures, focal neurological signs, abnormal speech/movement). Meningitis = inflammation of meninges, with preserved cerebral function. Overlap ('meningoencephalitis') is common. Most important empiric treatment: IV acyclovir empirically until HSV encephalitis is ruled out (due to high mortality).\n\nHSV encephalitis is the most important cause to identify and treat empirically because it is treatable and has very high mortality if untreated. It causes acute necrotizing encephalitis predominantly in the medial temporal and inferior frontal lobes. CT/MRI shows temporal lobe changes; EEG shows focal slowing and periodic discharges. PCR of CSF for HSV is the diagnostic test of choice."
    difficulty: easy
    tags: [encephalitis, HSV encephalitis, acyclovir, CNS infections, meningitis distinction]
  - front: "What are the characteristic features of herpes simplex encephalitis (HSE)?"
    back: "Acute onset (<1 week) of focal neurological signs: hemiparesis, ataxia, aphasia, focal/generalized seizures. Temporal lobe involvement: behavioural disturbance. Rapidly progressive over days, may result in coma or death. CT/MRI: medial temporal lobe necrosis. EEG: early focal slowing, periodic discharges. Common sequelae: memory and behavioural disturbances. Rare complication 1 month post-treatment: Kluver-Bucy syndrome features.\n\nHSE is caused predominantly by HSV-1 (reactivation of latent virus in trigeminal ganglia) and less often by HSV-2. The temporal lobe predilection causes personality and memory changes resembling psychiatric illness initially. Kluver-Bucy syndrome (hypersexuality, hyperorality, visual agnosia) occurring weeks post-treatment is a recognized rare sequela. PCR of CSF for HSV has >95% sensitivity."
    difficulty: medium
    tags: [HSV encephalitis, temporal lobe, acyclovir, Kluver-Bucy syndrome, CNS infections, herpes simplex]
  - front: "Describe the pathophysiology, clinical features, and treatment of generalized tetanus."
    back: "Pathophysiology: Clostridium tetani (anaerobic GP bacillus) spores contaminate wounds → produce tetanus toxin → retrograde axonal transport to CNS → blocks inhibitory neurotransmitter (GABA) release → disinhibition of spinal motor reflexes → tetany and autonomic hyperactivity. Clinical features: trismus ('lockjaw'), sustained skeletal muscle contraction with painful spasms (triggered by stimuli), respiratory failure from pharyngeal/respiratory muscle contraction, autonomic hyperactivity (diaphoresis, tachycardia, HTN, fever). Treatment: wound debridement + IV metronidazole (or penicillin G) + tetanus immune globulin (TIG) + benzodiazepines + early tracheostomy + autonomic control (labetalol, magnesium sulfate). Vaccination post-diagnosis (infection does not confer immunity).\n\nTetanus toxin (tetanospasmin) irreversibly binds presynaptic inhibitory neurons (Renshaw cells) preventing glycine and GABA release. Antimicrobial therapy alone is insufficient without wound debridement to eliminate spore burden. TIG neutralizes circulating unbound toxin but cannot reverse bound toxin — early treatment is critical."
    difficulty: hard
    tags: [tetanus, Clostridium tetani, trismus, lockjaw, neurotoxin, infectious diseases]
  - front: "What are the 5 stages of rabies infection and what are the two forms of the acute neurologic syndrome?"
    back: "1. Incubation: 1–3 months average (days to years). 2. Prodrome (<1 week): low-grade fever, malaise, pain/paresthesia at wound site — once prodrome begins, rapid irreversible progression. 3. Acute neurologic syndrome: (a) Encephalitic (most common): hyperactivity, fluctuating LOC, hydrophobia, aerophobia, hypersalivation, seizures; (b) Paralytic: quadriplegia, loss of anal sphincter tone, fever. 4. Coma: complete flaccid paralysis, respiratory/cardiovascular failure. 5. Death (within days to weeks).\n\nHydrophobia and aerophobia are pathognomonic of encephalitic rabies — painful pharyngeal spasms are triggered by water and air stimuli respectively. The incubation period length is inversely related to distance of bite from the CNS (facial bites have shorter incubation). Once clinical symptoms appear, the disease is nearly universally fatal — prevention via post-exposure prophylaxis is critical."
    difficulty: medium
    tags: [rabies, encephalitis, hydrophobia, aerophobia, post-exposure prophylaxis, infectious diseases]
  - front: "What is the post-exposure prophylaxis (PEP) protocol for rabies in a non-previously-immunized individual?"
    back: "1. Wound care: clean immediately with soap and running water for 15 minutes. 2. Passive immunization: rabies immunoglobulin (RIG) infiltrated into wound, with remaining volume IM at distant anatomical site. 3. Active immunization: inactivated human diploid cell rabies virus vaccine (HDCV) series — 4 shots on days 0, 3, 7, and 14 into deltoid (NOT gluteal, due to variable response). For previously immunized: wound care + 2 doses HDCV on days 0 and 3 only (no RIG needed).\n\nRIG provides immediate passive immunity while vaccine-induced active immunity develops. RIG should NOT be given into the same site as vaccine. Deltoid administration is required; gluteal injection produces variable, often inadequate antibody responses. Animal bites/contacts potentially causing rabies must be reported to Public Health authorities in Canada."
    difficulty: medium
    tags: [rabies, post-exposure prophylaxis, rabies immunoglobulin, HDCV, vaccination, infectious diseases]
  - front: "How is sepsis defined using the Sepsis-3 criteria, and how does it differ from septic shock?"
    back: "Sepsis: life-threatening organ dysfunction from dysregulated host response to infection, identified by acute SOFA score increase ≥2 points. Quick-SOFA (qSOFA) screening: ≥2 of (1) respiratory rate ≥22/min, (2) sBP <100 mmHg, (3) altered mentation (GCS <15) — SOFA score >2 = ~10% mortality. Septic shock: subset of sepsis with circulatory and cellular/metabolic dysfunction; clinically: despite adequate fluid resuscitation, (1) vasopressors needed to maintain MAP ≥65 mmHg AND (2) serum lactate >2 mmol/L → hospital mortality >40%.\n\nSepsis-3 (2016) eliminated the terms 'severe sepsis' and 'SIRS' from clinical use. The SOFA score assesses organ dysfunction across respiratory, coagulation, hepatic, cardiovascular, CNS, and renal domains. Serum lactate >2 mmol/L despite adequate resuscitation defines septic shock metabolically. Early identification is critical as mortality rises sharply with each hour of delayed antibiotics."
    difficulty: medium
    tags: [sepsis, septic shock, Sepsis-3, SOFA score, qSOFA, critical care]
  - front: "What are the key treatment principles for sepsis and septic shock?"
    back: "1. Respiratory support: O₂ + intubation as needed. 2. Cardiovascular support: IV fluids + blood transfusion + vasopressors + ICU. 3. IV antibiotics (empiric, guided by suspected source) — broad-spectrum (e.g. piperacillin/tazobactam or meropenem); add aminoglycosides for drug-resistant GNB or vancomycin for MRSA; narrow once sensitivities known. 4. Source control: remove catheter, drain abscess. 5. Hydrocortisone IV for septic shock unresponsive to fluids and vasopressors.\n\nThe breadth of empiric coverage should consider estimated adequacy of spectrum vs. degree of instability. Causative organisms are identified in only 50–70% of cases; when identified, GP and GN organisms account for 90%. Hydrocortisone (200 mg/day) in refractory septic shock is supported by Surviving Sepsis Campaign guidelines to correct relative adrenal insufficiency."
    difficulty: medium
    tags: [sepsis, septic shock, antibiotics, vasopressors, hydrocortisone, critical care, source control]
  - front: "What is leprosy (Hansen's disease), and how does it classify into tuberculoid vs. lepromatous forms?"
    back: "Caused by Mycobacterium leprae (obligate intracellular, slow-growing, survives in macrophages). Transmitted via nasal secretions or skin lesions; invades skin and peripheral nerves → chronic granulomatous disease affecting cooler body tissues. Paucibacillary (tuberculoid): intact cell-mediated immunity, 1–5 skin lesions, bacilli absent on smear. Multibacillary (lepromatous): weak cell-mediated immunity, ≥6 lesions OR nerve involvement OR bacilli on slit-skin smear. Borderline: intermediate between the two.\n\nLeprosy is a spectral disease where the host immune response determines clinical form. Strong Th1 response (tuberculoid) limits bacterial spread but causes nerve destruction via granulomatous inflammation. Weak Th1 response (lepromatous) allows unchecked bacillary proliferation with widespread skin and nerve involvement. The cooler extremities (hands, feet, earlobes) are preferentially affected due to optimal temperature for M. leprae replication."
    difficulty: medium
    tags: [leprosy, Hansens disease, M. leprae, tuberculoid, lepromatous, mycobacteria]
  - front: "What is the WHO-recommended treatment for paucibacillary vs. multibacillary leprosy?"
    back: "Paucibacillary: dapsone daily + rifampin monthly + clofazimine monthly AND low-dose clofazimine daily × 6 months. Multibacillary: dapsone daily + rifampin monthly + clofazimine monthly × 12 months AND low-dose clofazimine daily × 12 months.\n\nMulti-drug therapy (MDT) prevents resistance to any single agent. Rifampin is the most bactericidal agent against M. leprae. Clofazimine has anti-inflammatory properties in addition to bacteriostatic activity. Treatment can trigger immune reactions: erythema nodosum leprosum (treated with thalidomide or prednisone) and reversal reaction (treated with prednisone). Clofazimine causes hyperpigmentation, a major cause of social stigma."
    difficulty: medium
    tags: [leprosy, treatment, dapsone, rifampin, clofazimine, WHO guidelines, mycobacteria]
  - front: "What is Lyme disease, what tick transmits it, and what are the three stages of clinical disease?"
    back: "Caused by Borrelia burgdorferi (North America) spirochete, transmitted by Ixodes tick (requires >36 hours attachment). In Canada: southern Ontario/Quebec, Manitoba, New Brunswick, Nova Scotia, southern BC. Stage 1 (early localized, 7–14 days): malaise, fatigue, headache + erythema migrans (expanding non-pruritic bull's-eye target lesion at bite site). Stage 2 (early disseminated, weeks): CNS (aseptic meningitis, CN VII palsy, peripheral neuritis), cardiac (heart block, myocarditis). Stage 3 (late persistent, months–years): MSK (chronic mono/oligoarticular arthritis), neurologic (encephalopathy, neuropathy), acrodermatitis chronicum atrophicans (B. afzelii).\n\nErythema migrans is pathognomonic of Stage 1 Lyme disease and is a clinical diagnosis — serology may be negative this early. The mnemonic BAKE summarizes key Lyme manifestations: Bell's palsy (CN VII), Arthritis, heart blocK, Erythema migrans. Climate change is expanding the geographic range of Ixodes ticks in Canada, increasing Lyme disease incidence."
    difficulty: medium
    tags: [Lyme disease, Borrelia burgdorferi, erythema migrans, Ixodes tick, bells palsy, infectious diseases]
  - front: "What is the treatment for Lyme disease by stage, and what is the post-exposure prophylaxis regimen?"
    back: "Stage 1: doxycycline, amoxicillin, or cefuroxime (oral). Stage 2–3: ceftriaxone IV or doxycycline. Post-exposure prophylaxis: single dose doxycycline within 72 hours of removal of an engorged Ixodes scapularis tick in a hyperendemic area (local tick infection rate ≥20%), for patients >8 years who are not pregnant or lactating.\n\nOral doxycycline is the preferred treatment for most stages in non-pregnant adults. Ceftriaxone IV is used for neurologic and cardiac involvement. Post-exposure prophylaxis with single-dose doxycycline is only indicated under specific conditions (engorged tick, hyperendemic area, adequate time since attachment) — routine prophylaxis for all tick bites is not recommended. Serology in Stage 1 may be negative (primarily clinical diagnosis)."
    difficulty: medium
    tags: [Lyme disease, doxycycline, ceftriaxone, post-exposure prophylaxis, treatment, infectious diseases]
  - front: "What is Toxic Shock Syndrome (TSS), what organisms cause it, and what is the mechanism?"
    back: "TSS is caused by superantigens produced by S. aureus (TSST-1) or Group A Streptococcus (SPEA, SPEB, SPEC). Superantigens cause non-specific, widespread T-cell activation and massive pro-inflammatory cytokine release (IL-1, IL-6, TNF), leading to acute fever, shock, and multi-organ failure. The course is precipitous.\n\nUnlike conventional antigens that activate 0.01% of T cells, superantigens activate up to 20–30% of all T cells simultaneously by binding outside the normal antigen-binding groove. This cytokine storm drives the clinical syndrome. Staphylococcal TSS is associated with tampon use, wound infections, and nasal packing. Streptococcal TSS often complicates invasive GAS infections (necrotizing fasciitis)."
    difficulty: medium
    tags: [toxic shock syndrome, superantigen, S. aureus, Group A Streptococcus, TSST-1, cytokine storm]
  - front: "Which CSF Gram stain findings correspond to N. meningitidis, H. influenzae, L. monocytogenes, and S. pneumoniae?"
    back: "N. meningitidis: Gram-negative diplococci. H. influenzae: pleomorphic Gram-negative coccobacilli. L. monocytogenes: Gram-positive rods. S. pneumoniae: Gram-positive diplococci (lancet-shaped).\n\nRapid identification of organisms on Gram stain allows early directed therapy before culture results. Gram stain sensitivity in bacterial meningitis is approximately 60–90%, highest for S. pneumoniae and N. meningitidis. The morphology and staining directly guide initial antibiotic selection while culture results are pending."
    difficulty: easy
    tags: [meningitis, Gram stain, CSF, N. meningitidis, L. monocytogenes, H. influenzae, microbiology]
  - front: "What are the indications for adding ampicillin to meningitis empiric therapy, and which organism does it cover?"
    back: "Ampicillin is added to cover Listeria monocytogenes in patients with risk factors: age >50 years, alcohol use disorder, or immunocompromised status. L. monocytogenes is intrinsically resistant to all cephalosporins, so ceftriaxone + vancomycin alone is insufficient coverage.\n\nL. monocytogenes has natural resistance to cephalosporins due to low affinity penicillin-binding proteins. It enters macrophages and spreads cell-to-cell, evading humoral immunity. Ampicillin (with or without gentamicin for synergy) is the drug of choice. Trimethoprim-sulfamethoxazole is used in true penicillin allergy. Risk factors reflect impaired cell-mediated immunity needed to control Listeria."
    difficulty: medium
    tags: [meningitis, L. monocytogenes, ampicillin, Listeria, empiric therapy, immunocompromised]
  - front: "What ECG finding in infective endocarditis suggests perivalvular abscess, and what are the indications for TTE vs. TEE?"
    back: "ECG finding: prolonged PR interval (suggests aortic root/perivalvular abscess extending to AV node). TTE: indicated for all suspected IE (poor sensitivity, inadequate in 20% due to obesity/COPD/chest wall deformities). TEE (~90% sensitivity): indicated when TTE is non-diagnostic in patients with at least possible endocarditis, or when prosthetic valve endocarditis or complicated endocarditis (e.g. paravalvular abscess/perforation) is suspected.\n\nA perivalvular abscess (most common at aortic root) can track to the fibrous skeleton of the heart, interrupting the AV node and causing progressive PR prolongation or complete heart block. TEE provides superior visualization of the posterior structures and prosthetic valves due to proximity of the transducer to the heart. TEE is also essential for surgical planning."
    difficulty: medium
    tags: [infective endocarditis, ECG, PR interval, perivalvular abscess, TTE, TEE, echocardiography]
  - front: "What are the pre-exposure vaccination recommendations for rabies in Canada?"
    back: "Recommended for high-risk persons: laboratory staff working with rabies virus, veterinarians, animal and wildlife control workers, long-term travellers to endemic areas. Use standard precautions when caring for rabies patients.\n\nPre-exposure prophylaxis simplifies post-exposure management (only 2 doses of vaccine needed, no RIG) and provides a safety buffer. Canada's Public Health Agency requires mandatory reporting of potential rabies exposures. In Canada, bats are the most important reservoir for human rabies transmission, and any bat contact (including sleeping in the same room) may warrant PEP consideration."
    difficulty: easy
    tags: [rabies, pre-exposure prophylaxis, vaccination, occupational health, public health, infectious diseases]
  - front: "What is the diagnostic test of choice for post-mortem rabies confirmation, and what inclusion bodies are found?"
    back: "Post-mortem: direct immunofluorescence in nerve tissue + identification of Negri bodies (intracytoplasmic inclusion bodies in neurons, particularly in hippocampal Purkinje cells). Antemortem: direct immunofluorescence or PCR on saliva, skin biopsy (nuchal skin), serum, and CSF.\n\nNegri bodies represent aggregates of viral nucleocapsid (ribonucleoprotein) and are pathognomonic of rabies on histopathology. They are most reliably found in Purkinje cells of the cerebellum and pyramidal cells of the hippocampus. Antemortem diagnosis allows public health containment and identification of exposed contacts requiring PEP."
    difficulty: medium
    tags: [rabies, Negri bodies, diagnosis, post-mortem, direct immunofluorescence, infectious diseases]
  - front: "What tick-borne diseases other than Lyme disease are expected to increase in Canada due to climate change?"
    back: "Anaplasmosis, Babesiosis, Powassan virus, and Borrelia miyamotoi disease — all transmitted by Ixodes ticks and expected to increase in prevalence as tick ranges expand northward into Canada due to warmer winters.\n\nClimate change is driving northward expansion of the Ixodes scapularis (blacklegged tick) range in Canada. A negative Lyme disease test does not rule out other tick-borne illnesses — further testing may be needed if symptoms persist. Babesiosis presents like malaria (hemolytic anemia); Anaplasmosis causes leukopenia/thrombocytopenia; Powassan virus causes severe encephalitis."
    difficulty: medium
    tags: [tick-borne diseases, Lyme disease, climate change, Babesiosis, Anaplasmosis, Powassan virus, Canada]
  - front: "What are the three major endemic mycoses in North America, and how are they acquired?"
    back: "Histoplasmosis (Histoplasma capsulatum), blastomycosis (Blastomyces dermatitidis), and coccidioidomycosis (Coccidioides immitis). All are acquired through inhalation of spores from the environment (soil, bird/bat droppings, vegetation) or rarely inoculation injury. They are thermally dimorphic: mould at cold temperatures, yeast at body temperature.\n\nEndemic mycoses are a key MCCQE1 topic. Previously defined geographic regions of endemicity are expanding and can no longer be used to definitively rule out infections. All three can cause pneumonia and may disseminate hematogenously, especially in immunocompromised patients."
    difficulty: easy
    tags: [infectious diseases, fungi, endemic mycoses, histoplasmosis, blastomycosis, coccidioidomycosis]
  - front: "A patient from Ohio presents with fever, cough, chest pain, headache, and myalgia. CXR shows pulmonary infiltrates with hilar lymphadenopathy. What is the most likely diagnosis and how is it confirmed?"
    back: "Histoplasmosis (Histoplasma capsulatum). Confirmed by fungal culture, fungal stain, antigen detection in urine and serum, or serology. Histoplasmosis is commonly associated with exposure to chicken coops, bird roosts, and bat caves.\n\nHistoplasma capsulatum is endemic to the Ohio and Mississippi River valleys in central USA, and in Ontario and Quebec. CXR in acute disease shows pulmonary infiltrates and hilar lymphadenopathy; chronic disease may show cavitary lesions. Dissemination (to bone marrow, GI tract, lymph nodes, skin, liver, adrenals, CNS) occurs primarily in immunocompromised patients."
    difficulty: medium
    tags: [infectious diseases, histoplasmosis, endemic mycoses, fungi, immunocompromised]
  - front: "What is the characteristic skin finding of disseminated blastomycosis, and how does it differ from the typical pulmonary presentation?"
    back: "Disseminated blastomycosis causes verrucous (wart-like) skin lesions that mimic skin cancer, ulcers, and subcutaneous nodules. Other disseminated sites include bones (osteomyelitis, osteolytic lesions) and genitourinary tract (prostatitis, epididymitis). The pulmonary form presents as acute or chronic pneumonia with fever, cough, chest pain, chills, night sweats, and weight loss.\n\nBlastomyces dermatitidis is endemic to states east of the Mississippi River, Northern Ontario, and along the Great Lakes. Diagnosis is made by sputum smear and culture, or direct examination of clinical specimens showing characteristic broad-based budding yeast. The verrucous skin lesions are a classic exam finding."
    difficulty: medium
    tags: [infectious diseases, blastomycosis, endemic mycoses, fungi, skin]
  - front: "What is 'Valley Fever' and what are its characteristic features?"
    back: "Valley Fever is the primary pulmonary form of coccidioidomycosis (Coccidioides immitis infection). It presents as subacute fever, chills, cough, chest pain, sore throat, and fatigue lasting weeks to months. A hypersensitivity reaction with arthralgias and erythema nodosum may develop. Rare dissemination occurs to skin (ulcers), joints (synovitis), bones (lytic lesions), and meninges (meningitis).\n\nCoccidioides immitis is endemic to deserts in the southwestern USA and northwestern Mexico. It is a common opportunistic infection in HIV patients. Diagnosis is by sputum culture or direct examination for characteristic yeast forms. Coccidioidal meningitis is the most feared complication."
    difficulty: medium
    tags: [infectious diseases, coccidioidomycosis, endemic mycoses, fungi, Valley Fever]
  - front: "What is the CD4 threshold for Pneumocystis jirovecii pneumonia (PJP) prophylaxis in HIV-positive patients, and what is the preferred prophylactic agent?"
    back: "HIV-positive patients with CD4 count <200 cells/mm³ should receive prophylaxis with TMP/SMX (trimethoprim-sulfamethoxazole). Without prophylaxis, these patients have an 80% lifetime risk of PJP.\n\nPJP (formerly PCP - Pneumocystis carinii pneumonia) is the most common AIDS-defining opportunistic infection. Most cases occur in patients unaware of HIV status or not using prophylaxis. In HIV-negative patients, PJP occurs almost exclusively in immunocompromised patients (transplant, inflammatory conditions, hematologic malignancies)."
    difficulty: easy
    tags: [infectious diseases, PJP, PCP, Pneumocystis, HIV, opportunistic infections, prophylaxis]
  - front: "Describe the classic CXR finding in PJP and the laboratory hallmarks used in diagnosis."
    back: "Classic CXR: bilateral symmetrical interstitial infiltrates (bilateral diffuse opacities). Laboratory hallmarks: reduced pO₂ and elevated A-a gradient on ABG, elevated serum LDH (>220 IU/L). Diagnosis confirmed by induced sputum or lower airway sampling (BAL) positive for Pneumocystis.\n\nThe hallmark triad of PJP diagnosis is bilateral interstitial infiltrates on CXR, elevated LDH, and hypoxemia with elevated A-a gradient. Pleural effusions are uncommon. Most clinical disease results from reactivation of latent infection or reinfection in immunocompromised patients."
    difficulty: medium
    tags: [infectious diseases, PJP, PCP, Pneumocystis, HIV, radiology, LDH]
  - front: "What is the first-line treatment for PJP and when are corticosteroids added?"
    back: "First-line: TMP/SMX (PO or IV), even for those already taking it for prophylaxis. Alternatives: dapsone + TMP, clindamycin + primaquine, atovaquone, or pentamidine IV (second-line for severe disease). Corticosteroids are added as adjuvant therapy in severe hypoxia: pO₂ <70 mmHg OR A-a gradient >35 mmHg.\n\nAdjuvant corticosteroids in severe PJP reduce mortality by dampening the inflammatory response to dying organisms. The threshold for corticosteroid use (pO₂ <70 mmHg or A-a O₂ gradient >35 mmHg) is a classic MCCQE1 fact."
    difficulty: medium
    tags: [infectious diseases, PJP, PCP, Pneumocystis, TMP-SMX, corticosteroids, treatment]
  - front: "What are the two main Cryptococcus species, how do they differ in host predilection, and what is their geographic distribution?"
    back: "C. neoformans: inhaled from soil contaminated with pigeon droppings; tends to affect immunocompromised hosts. C. gattii: found in certain tree species (Eucalyptus, Douglas fir); tends to affect immunocompetent hosts. C. gattii geographic distribution includes Vancouver Island, Northern Australia, and Papua New Guinea.\n\nCryptococcosis is a key HIV-related opportunistic infection. C. neoformans is the leading cause of meningitis in patients with HIV. The distinction between C. neoformans (immunocompromised) and C. gattii (immunocompetent) is clinically important and frequently tested."
    difficulty: medium
    tags: [infectious diseases, Cryptococcus, fungi, HIV, meningitis, opportunistic infections]
  - front: "What is the diagnostic test of choice for cryptococcal meningitis and what is the sensitivity of India ink stain?"
    back: "CSF cryptococcal antigen test (or lateral flow cryptococcal antigen assay from serum and CSF) is now preferred. India ink stain has only ~50% sensitivity (higher in HIV patients) and has largely been replaced by the cryptococcal antigen test. Culture confirms the diagnosis. Opening pressure must be measured on lumbar puncture.\n\nIn HIV patients with cryptococcal meningitis, elevated ICP is common and requires management with serial lumbar punctures or other ICP-lowering measures. Serum cryptococcal antigen is also useful for screening."
    difficulty: medium
    tags: [infectious diseases, Cryptococcus, meningitis, India ink, CSF, diagnosis]
  - front: "Describe the treatment regimen for cryptococcal meningitis in HIV-positive patients."
    back: "Induction (2 weeks): Amphotericin B + flucytosine. Consolidation (≥8 weeks): fluconazole. Maintenance: lower-dose fluconazole for prolonged period. Serial lumbar puncture or other ICP management is an important adjunct.\n\nThe three-phase approach (induction, consolidation, maintenance) for cryptococcal meningitis in HIV is a classic MCCQE1 treatment protocol. Amphotericin B has significant nephrotoxicity, hence the time-limited induction phase followed by oral azole therapy."
    difficulty: hard
    tags: [infectious diseases, Cryptococcus, meningitis, amphotericin B, fluconazole, HIV, treatment]
  - front: "What are the risk factors for invasive Candida infection, and how does invasive candidiasis differ from mucocutaneous candidiasis?"
    back: "Risk factors for invasive candidiasis: critically ill patients, broad-spectrum antibiotics, central venous catheters, total parenteral nutrition, immunocompromised state (DM, corticosteroids). Invasive disease includes candidemia, endophthalmitis, endocarditis, upper UTI, and hepatosplenic disease — systemic and life-threatening. Mucocutaneous disease (thrush, esophagitis, vulvovaginitis, diaper rash) is superficial and treated topically or with oral fluconazole.\n\nCandida albicans is a normal part of skin, mouth, vaginal, and GI microbiome. Overgrowth leads to disease. A classic finding of cutaneous candidiasis is satellite lesions beyond the margin of the main rash. Treatment escalates from topical (mild mucocutaneous) to fluconazole to echinocandins for systemic disease."
    difficulty: medium
    tags: [infectious diseases, Candida, candidiasis, fungi, immunocompromised, ICU]
  - front: "What are the three clinical syndromes of Aspergillus infection and their key distinguishing features?"
    back: "1. ABPA (Allergic Bronchopulmonary Aspergillosis): IgE-mediated asthma-type reaction; dyspnea, high fever, transient pulmonary infiltrates; occurs in asthmatics/atopics. 2. Aspergilloma (fungus ball): ball of hyphae in pre-existing lung cavity; range from asymptomatic to massive hemoptysis; CXR shows 'air crescent' sign (round opacity with thin lucent rim, upper lobes). 3. Invasive Aspergillosis: severe neutropenia or transplant; fever, cough, dyspnea, cavitation; CXR shows 'halo' sign (nodule with surrounding ground glass); fatal if untreated.\n\nThe 'air crescent' sign (aspergilloma) and 'halo' sign (invasive aspergillosis) are classic radiographic findings. Aflatoxin from A. flavus is associated with hepatocellular carcinoma and is responsible for mycotoxicosis."
    difficulty: hard
    tags: [infectious diseases, Aspergillus, ABPA, aspergilloma, invasive aspergillosis, fungi, radiology]
  - front: "What is the first-line treatment for invasive aspergillosis and for ABPA?"
    back: "Invasive aspergillosis: voriconazole (first-line) or amphotericin B. ABPA: corticosteroids + itraconazole. Aspergilloma: surgical resection ± bronchial artery embolization for severe hemoptysis.\n\nVoriconazole replaced amphotericin B as first-line for invasive aspergillosis due to improved survival and tolerability. ABPA is primarily an allergic/inflammatory condition requiring immune suppression (steroids) plus antifungal to reduce fungal burden."
    difficulty: medium
    tags: [infectious diseases, Aspergillus, invasive aspergillosis, ABPA, voriconazole, treatment]
  - front: "How is Entamoeba histolytica transmitted and what are its major clinical manifestations?"
    back: "Transmission: fecal-oral route via cysts from areas of poor sanitation, or via sexual activity (MSM). Clinical manifestations: (1) Asymptomatic carriage; (2) Amoebic dysentery: abdominal pain, colitis, bloody diarrhea, fever from ulceration of large intestine; (3) Amoebic abscesses: most commonly liver (right upper quadrant pain, weight loss, fever, hepatomegaly), also lungs and brain.\n\nE. histolytica is microscopically indistinguishable from the non-pathogenic E. dispar; distinction requires specific stool antigen detection, multiplex stool PCR, or serology. Treatment: metronidazole for invasive disease, followed by iodoquinol or paromomycin for cyst elimination."
    difficulty: medium
    tags: [infectious diseases, amoebiasis, Entamoeba, protozoa, liver abscess, parasites]
  - front: "What is the treatment for amoebic dysentery and hepatic abscess, and when is aspiration of a hepatic abscess indicated?"
    back: "Treatment: Metronidazole (invasive disease), followed by iodoquinol or paromomycin to eliminate intestinal cysts. Aspiration of hepatic abscess is indicated if: risk of rupture, poor response to medical therapy, or diagnostic uncertainty. Asymptomatic cyst shedding: iodoquinol or paromomycin alone.\n\nThe two-drug strategy (metronidazole + luminal agent) is key to prevent relapse from residual intestinal cysts. Prevention involves good personal hygiene and water purification by boiling or filtration — importantly, chlorination alone does not reliably kill cysts."
    difficulty: medium
    tags: [infectious diseases, amoebiasis, metronidazole, liver abscess, treatment]
  - front: "What are the clinical features that distinguish Giardia lamblia infection from amoebic dysentery?"
    back: "Giardia: watery (not bloody) diarrhea, steatorrhea, bloating, flatulence, no hematochezia, no mucus in stool — no intestinal wall invasion. Chronic giardiasis causes malabsorption with vitamin A/B12/B deficiencies and hypoalbuminemia. Amoebiasis: bloody diarrhea, mucus, ulceration of large intestine, risk of liver abscess.\n\nGiardia ('beaver fever') is transmitted by fecal-oral route, especially in camping/outdoor settings in Canada (e.g., Rocky Mountain streams). Diagnosis: multiple stool samples or multiplex PCR. Treatment: tinidazole (single dose) or nitazoxanide (3 days); metronidazole for children <12 months."
    difficulty: medium
    tags: [infectious diseases, Giardia, protozoa, diarrhea, malabsorption, parasites]
  - front: "What are the clinical features of Trichomonas vaginalis infection and how is it treated?"
    back: "Often asymptomatic (10–50%), especially in males (occasionally urethritis, prostatitis). In females: profuse, malodorous, yellow-green or grey frothy vaginal discharge, pruritus, dysuria, dyspareunia (trichomonal vaginitis). Diagnosed by wet mount showing motile parasites, antigen detection, culture, or urine PCR (in males). Treatment: metronidazole for patient AND all partners.\n\nT. vaginalis causes ~25% of vaginitis cases. Treating partners simultaneously is essential to prevent reinfection. It is sexually transmitted and classified as an STI."
    difficulty: easy
    tags: [infectious diseases, Trichomonas, STI, vaginitis, protozoa, metronidazole]
  - front: "How does Cryptosporidium infection differ in immunocompetent vs. immunocompromised patients, and what is the diagnostic test?"
    back: "Immunocompetent: self-limited watery diarrhea. Immunocompromised: chronic, severe, non-bloody diarrhea with nausea/vomiting, abdominal pain, anorexia, weight loss, and potentially death. Diagnosis: modified acid-fast stain of stool for oocysts, direct fluorescent antibody stool antigen detection, or multiplex enteric parasite PCR.\n\nCryptosporidium is transmitted via fecal-oral route from contaminated water (including from cows). In HIV patients, restoration of immune function (ART to increase CD4 >100) is key to management; nitazoxanide or macrolides may be tried if ART fails."
    difficulty: medium
    tags: [infectious diseases, Cryptosporidium, protozoa, diarrhea, HIV, immunocompromised]
  - front: "What Plasmodium species causes the most severe malaria, and what are its distinguishing features compared to P. vivax and P. ovale?"
    back: "P. falciparum causes the most severe and most lethal malaria. Key features: less predictable fever pattern (vs. 48-h cycles for P. vivax/P. ovale, 72-h for P. malariae), >90% of infected patients ill within 30 days, chloroquine-resistant in most areas. Severe complications: cerebral malaria (seizures, coma), severe anemia, AKI, ARDS. P. vivax and P. ovale produce dormant liver hypnozoites causing relapsing attacks months later.\n\nThe periodicity of fever (48h vs 72h vs irregular) and the capacity for relapse (P. vivax/ovale hypnozoites) are classic exam distinctions. P. knowlesi and rarely P. vivax can also be fatal."
    difficulty: medium
    tags: [infectious diseases, malaria, Plasmodium falciparum, Plasmodium vivax, parasites, tropical medicine]
  - front: "How is malaria diagnosed and what are the laboratory hallmarks?"
    back: "Blood smear q12-24h x3 (Giemsa stain): thick smear for presence of organisms, thin smear for species identification and quantification. CBC triad: thrombocytopenia + elevated LDH + anemia (without leukocytosis). Rapid antigen detection tests and PCR are also available.\n\nThe CBC triad of thrombocytopenia, elevated LDH, and anemia without leukocytosis in a febrile traveller should prompt malaria workup. Three blood smears q12-24h are needed to rule out infection due to cyclical parasitemia."
    difficulty: medium
    tags: [infectious diseases, malaria, diagnosis, blood smear, thrombocytopenia, parasites]
  - front: "What is the treatment for P. falciparum malaria and P. vivax/P. ovale malaria?"
    back: "P. falciparum: Most areas are chloroquine-resistant. Use artemisinin combination therapy (e.g., artesunate + doxycycline, or artemether-lumefantrine), or atovaquone/proguanil (Malarone), or quinine + doxycycline/clindamycin. Check local resistance patterns. P. vivax/P. ovale: Chloroquine + primaquine or tafenoquine (to eradicate liver hypnozoites and prevent relapse). Chloroquine-resistant P. vivax: atovaquone/proguanil + primaquine/tafenoquine.\n\nPrimaquine/tafenoquine are essential for P. vivax and P. ovale to eliminate dormant liver hypnozoites and prevent relapse. G6PD testing is required before using primaquine/tafenoquine (risk of hemolysis). Mefloquine and artemisinin resistance is increasing in Southeast Asia."
    difficulty: hard
    tags: [infectious diseases, malaria, treatment, artemisinin, chloroquine, primaquine, P. falciparum, P. vivax]
  - front: "What is Chagas disease (American trypanosomiasis), how is it transmitted, and what are its chronic complications?"
    back: "Chagas disease is caused by Trypanosoma cruzi, transmitted by the reduviid 'kissing bug' (feces rubbed into bite site or mucous membranes). Also transmitted via blood transfusion, organ transplantation, vertical (placental) transfer, and ingestion of contaminated food/drink. Chronic complications (30–40% of infected, 10–25 years later): dilated cardiomyopathy, esophagomegaly, megacolon.\n\nEndemic in Mexico, Central and South America. Acute phase: usually asymptomatic; 'Romana's sign' (unilateral periorbital swelling) if conjunctival inoculation; 'Chagoma' (local swelling at bite site). The chronic determinate phase can cause fatal cardiomyopathy. Treatment: benznidazole or nifurtimox (acute/indeterminate phases)."
    difficulty: hard
    tags: [infectious diseases, Chagas disease, trypanosomiasis, parasites, tropical medicine, cardiomyopathy]
  - front: "What is 'Romana's sign' and what does it indicate?"
    back: "Romana's sign is unilateral periorbital swelling (palpebral edema and conjunctivitis) resulting from Trypanosoma cruzi inoculation through the conjunctiva. It is a classic sign of acute Chagas disease.\n\nRomana's sign indicates conjunctival entry point for the trypomastigotes. Most acute Chagas is asymptomatic. The Chagoma (local swelling at the skin inoculation site) is the equivalent for skin entry. Both are signs of acute infection."
    difficulty: medium
    tags: [infectious diseases, Chagas disease, Romanas sign, trypanosomiasis, acute]
  - front: "What are the major routes of Toxoplasma gondii transmission and who is at highest risk for severe disease?"
    back: "Transmission: ingestion of oocysts from cat feces (gardening without gloves, emptying litter boxes), undercooked meat (tissue cysts), transplacental transmission (primary maternal infection during pregnancy), organ transplantation, blood transfusion, contaminated water. Highest risk for severe disease: immunocompromised patients (HIV with CD4 <200) and fetuses/neonates (congenital toxoplasmosis).\n\n1/3 of Ontario's population is infected with Toxoplasma gondii. Most immunocompetent adults are asymptomatic or have a mononucleosis-like syndrome. Infection remains latent for life and reactivates with immunosuppression causing CNS ring-enhancing lesions."
    difficulty: medium
    tags: [infectious diseases, toxoplasmosis, Toxoplasma gondii, congenital, HIV, parasites]
  - front: "What is the classic CNS finding in toxoplasmosis in an HIV patient, and how is it treated?"
    back: "Classic finding: single or multiple ring-enhancing masses on CT scan (cortex or deep nuclei), with headache and focal neurological signs — toxoplasmic encephalitis. Treatment for immunocompromised patients: pyrimethamine + sulfadiazine + folinic acid. HIV patients: TMP/SMX (also used for prophylaxis and treatment).\n\nRing-enhancing CNS lesions in an HIV patient with CD4 <200 have a broad differential (toxoplasmosis, CNS lymphoma, abscess). Empiric anti-toxoplasma treatment is often started — clinical/radiologic improvement at 2 weeks supports the diagnosis. Folinic acid (not folic acid) is added to counteract pyrimethamine's antifolate effects."
    difficulty: hard
    tags: [infectious diseases, toxoplasmosis, HIV, ring-enhancing lesion, CNS, pyrimethamine, treatment]
  - front: "What is congenital toxoplasmosis and what are its manifestations?"
    back: "Congenital toxoplasmosis results from acute primary T. gondii infection during pregnancy (a TORCH infection). Can cause stillbirth (rare), or classic tetrad: chorioretinitis, intracranial calcifications, hydrocephalus, and psychomotor delay. Initially asymptomatic infants may develop reactivation chorioretinitis (blurred vision, scotoma, ocular pain, photophobia) as adolescents or adults.\n\nTreatment in pregnancy: spiramycin if fetal infection status unknown; pyrimethamine + sulfadiazine + folinic acid if confirmed fetal infection. Pregnant women should avoid undercooked meat and not empty cat litter boxes."
    difficulty: hard
    tags: [infectious diseases, toxoplasmosis, congenital, TORCH, chorioretinitis, pregnancy]
  - front: "What is the treatment for Ascaris lumbricoides infection and what is Löffler's syndrome?"
    back: "Treatment: mebendazole OR albendazole OR pyrantel pamoate OR ivermectin. Löffler's syndrome is a transient pulmonary infiltrate with eosinophilia caused by larval migration through the lungs, presenting with cough and dyspnea. This can occur with both Ascaris lumbricoides and Strongyloides stercoralis.\n\nAscaris is the most common intestinal roundworm worldwide (tropical/subtropical areas). Heavy infections cause intestinal blockage. The life cycle involves larval migration through the lungs (causing Löffler's syndrome) before larvae mature in the small intestine."
    difficulty: medium
    tags: [infectious diseases, Ascaris, nematodes, roundworms, Löffler syndrome, parasites]
  - front: "What is the diagnosis and treatment of pinworm (Enterobius vermicularis) infection?"
    back: "Diagnosis: sticky tape test applied to perianal skin (need 5–7 tests to rule out; eggs adhere to tape). Examination of perianal skin at night may reveal adult worms. Usually no eosinophilia (no tissue invasion). Treatment: mebendazole or albendazole; pyrantel pamoate (in pregnancy). Treat all family members simultaneously. Prevention: change underwear, bathe in morning, wear pajamas to bed, wash hands, trim fingernails.\n\nPinworm is the most common helminth infection in Canada and other developed countries. Females migrate out of the anus at night to deposit eggs in perianal skin, causing pruritus ani. Reinfection is common due to fecal-oral self-inoculation."
    difficulty: easy
    tags: [infectious diseases, pinworm, Enterobius, nematodes, parasites, pruritus ani]
  - front: "What makes Strongyloides stercoralis unique among intestinal nematodes, and who is at risk for hyperinfection?"
    back: "Strongyloides is one of the few worms able to complete its life cycle and multiply within the human host (autoinfection) — larvae penetrate GI mucosa or perianal skin. Hyperinfection (massive auto-infection) can be fatal, particularly in immunocompromised patients. The most common risk factor for disseminated infection is immunoablative therapy including high-dose corticosteroids. Treatment: ivermectin and/or albendazole.\n\nTransmission: skin penetration from fecal-contaminated soil (barefoot walking). Presents with pruritic dermatitis at penetration site, transient pulmonary symptoms (eosinophilic pneumonitis/Löffler's syndrome), abdominal pain, diarrhea, larva currens (itchy skin rash). Screening for Strongyloides before initiating immunosuppression is important in those from endemic areas."
    difficulty: hard
    tags: [infectious diseases, Strongyloides, nematodes, hyperinfection, immunocompromised, corticosteroids]
  - front: "What are the clinical consequences of Onchocerca volvulus infection and how is it transmitted and treated?"
    back: "Onchocerca volvulus causes river blindness (onchocerciasis) and dermatitis. It is transmitted by blackfly bite in sub-Saharan Africa and Latin America. Treatment: ivermectin + doxycycline.\n\nMicrofilariae of Onchocerca migrate through the skin and eyes, causing intense inflammation that leads to progressive visual loss ('river blindness'). Mass drug administration of ivermectin is used for community-level control."
    difficulty: medium
    tags: [infectious diseases, Onchocerca, river blindness, nematodes, tropical medicine, ivermectin]
  - front: "What are the clinical manifestations of Wuchereria bancrofti infection and how is it treated?"
    back: "Wuchereria bancrofti causes lymphatic filariasis (elephantiasis): lymphadenopathy, lymphedema, lymphatic obstruction, hydrocele, and tropical pulmonary eosinophilia. Transmitted by mosquito bite in the tropics. Treatment: diethylcarbamazine + doxycycline.\n\nThe massive limb swelling (elephantiasis) is due to chronic lymphatic obstruction from adult worms living in the lymphatics. Tropical pulmonary eosinophilia is a hypersensitivity reaction to microfilariae in the lungs."
    difficulty: medium
    tags: [infectious diseases, Wuchereria, lymphatic filariasis, elephantiasis, nematodes, tropical medicine]
  - front: "What distinguishes Taenia solium (pork tapeworm) from Taenia saginata (beef tapeworm) in terms of serious complications?"
    back: "T. solium can cause cysticercosis (ingestion of eggs from human feces): larval cysts lodge in CNS, eyes, and skin causing seizures, mass lesions, and potentially fatal neurocysticercosis. T. saginata (beef tapeworm, from larvae in undercooked beef) only causes mild GI symptoms (taeniasis) — no cysticercosis. Treatment for cysticercosis: corticosteroids + albendazole + praziquantel + antiepileptics if seizures.\n\nThe key distinction: T. solium eggs (from human feces) can cause the serious tissue infection cysticercosis, whereas T. saginata does not cause tissue cysts. Neurocysticercosis is the most common cause of adult-onset epilepsy in many developing countries."
    difficulty: hard
    tags: [infectious diseases, Taenia solium, tapeworm, cysticercosis, neurocysticercosis, cestodes, parasites]
  - front: "What vitamin deficiency does Diphyllobothrium latum cause and why?"
    back: "D. latum (fish tapeworm, from raw fish) causes vitamin B₁₂ deficiency leading to macrocytic anemia and posterior column deficits (subacute combined degeneration). The tapeworm competes with the host for dietary vitamin B₁₂ in the intestinal lumen. Treatment: praziquantel.\n\nD. latum is found in Europe, North America, and Asia, acquired by eating raw fish. It is the largest tapeworm that infects humans and can persist for decades. Posterior column deficits from B₁₂ deficiency include loss of vibration sense, proprioception, and spastic paraparesis."
    difficulty: medium
    tags: [infectious diseases, Diphyllobothrium, fish tapeworm, B12 deficiency, cestodes, parasites]
  - front: "What is the major risk of Echinococcus granulosus infection and how is it managed?"
    back: "E. granulosus (dog tapeworm) causes hydatid cysts in the liver and lungs, which enlarge over years and can cause mass effects or rupture. Risk of anaphylaxis if cystic fluid is released during surgical evacuation. Management options: albendazole + praziquantel alone; surgery + perioperative albendazole; or percutaneous aspiration + perioperative albendazole.\n\nAcquired from dog feces (eggs) in rural, sheep-raising areas. The cysts must be handled carefully during aspiration/surgery to prevent spillage of cyst fluid containing protoscolices, which can cause peritoneal seeding (secondary echinococcosis) and anaphylaxis."
    difficulty: hard
    tags: [infectious diseases, Echinococcus, hydatid cyst, cestodes, anaphylaxis, parasites]
  - front: "What malignancy is associated with Schistosoma haematobium and which Schistosoma species is associated with cholangiocarcinoma?"
    back: "S. haematobium: squamous cell carcinoma (SCC) of the bladder (due to chronic granulomatous inflammation from eggs in the bladder wall causing fibrosis and hematuria). Cholangiocarcinoma is associated with Clonorchis sinensis (liver fluke), which lives in bile ducts and causes chronic biliary inflammation.\n\nThese parasite-cancer associations are high-yield: Schistosoma haematobium → bladder SCC; Clonorchis sinensis (and Opisthorchis) → cholangiocarcinoma; H. pylori → gastric cancer; EBV → Burkitt lymphoma. S. haematobium also causes hematuria and obstructive uropathy."
    difficulty: hard
    tags: [infectious diseases, Schistosoma, bladder cancer, Clonorchis, cholangiocarcinoma, trematodes, parasites]
  - front: "What is Katayama fever and when does it occur in schistosomiasis?"
    back: "Katayama fever is acute schistosomiasis: a hypersensitivity reaction to migrating parasites occurring 4–8 weeks after skin penetration by cercariae. Features: fever, hives, headache, weight loss, cough, abdominal pain, chronic diarrhea, high-grade eosinophilia. Most symptomatic disease occurs in non-immune travellers.\n\nSchistosomiasis has three phases: (1) Swimmer's itch (cercarial dermatitis) at the time of skin penetration; (2) Katayama fever (4–8 weeks post-exposure); (3) Chronic disease (portal hypertension, bladder cancer). Treatment: praziquantel; add prednisone for acute schistosomiasis or neurologic complications."
    difficulty: hard
    tags: [infectious diseases, schistosomiasis, Katayama fever, trematodes, eosinophilia, tropical medicine]
  - front: "What are the chronic hepatic complications of S. mansoni and S. japonicum schistosomiasis?"
    back: "Worms live in mesenteric veins; eggs deposited in portal tracts of liver and bowel cause granulomatous inflammation → periportal (pipestem) fibrosis on liver ultrasound. Heavy infections cause intestinal polyps, portal hypertension, splenomegaly (secondary to portal HTN), and hepatomegaly. Can also cause pulmonary HTN and cor pulmonale.\n\nChronic hepatic schistosomiasis leads to portal hypertension by periportal fibrosis (not cirrhosis of parenchyma). Liver function is often preserved until late. Risk stratification with liver ultrasound (looking for periportal fibrosis) guides management of chronic complications."
    difficulty: hard
    tags: [infectious diseases, schistosomiasis, portal hypertension, liver, trematodes, S. mansoni]
  - front: "Which insect vectors transmit Borrelia burgdorferi, Trypanosoma brucei, and Leishmania spp. respectively?"
    back: "Borrelia burgdorferi (Lyme disease): tick. Trypanosoma brucei (African sleeping sickness/HAT): tsetse fly. Leishmania spp. (Leishmaniasis): sandfly.\n\nInsect vector associations are high-yield for MCCQE1: mosquito (malaria, dengue, West Nile, yellow fever, filariasis, Zika, chikungunya, Japanese encephalitis); tick (Lyme, RMSF); tsetse fly (African trypanosomiasis); sandfly (Leishmaniasis, bartonellosis); blackfly (Onchocerciasis); deerfly (Loiasis); flea (plague, tungiasis)."
    difficulty: easy
    tags: [infectious diseases, vector-borne, Lyme disease, trypanosomiasis, Leishmaniasis, tropical medicine]
  - front: "What pathogens should be considered in a febrile returned traveller and what is the most common cause?"
    back: "Most common: malaria (20–30%). Other causes: non-specific viral/mononucleosis-like syndrome (4–25%), dengue (5%), traveller's diarrhea (10–20%), respiratory tract infections (10–15%), typhoid from Salmonella (2–7%), viral hepatitis (3%), rickettsioses (3%), UTI/STI (2–3%). Rule: fever in a returned traveller from a malaria endemic area is considered malaria until proven otherwise.\n\nThe workup of fever in a returned traveller requires thick and thin blood smears x3, CBC, LFTs, blood C&S, urinalysis, plus special tests based on symptoms. Empiric treatment after 48–72h of fever with negative malaria smears: azithromycin + doxycycline (India/SE Asia) or ciprofloxacin + doxycycline (elsewhere)."
    difficulty: medium
    tags: [infectious diseases, travel medicine, fever, returned traveller, malaria, dengue]
  - front: "How does incubation period help narrow the differential diagnosis in a returned traveller with fever?"
    back: "<21 days: consider malaria, typhoid fever, dengue, chikungunya, Zika, rickettsioses, traveller's diarrhea, respiratory infections (ILI, COVID-19); can exclude HBV and TB. >21 days: consider malaria, TB, typhoid fever; can exclude dengue, chikungunya, traveller's diarrhea, rickettsioses.\n\nUsing the earliest and latest possible dates of exposure to calculate the incubation period is a key tool for narrowing the differential in travel medicine. This is tested on MCCQE1 as part of the systematic approach to a febrile returned traveller."
    difficulty: medium
    tags: [infectious diseases, travel medicine, fever, returned traveller, incubation period, differential diagnosis]
  - front: "What water purification method is effective against Giardia and Cryptosporidium cysts, and what method is NOT effective?"
    back: "Effective: boiling water, filtration, and iodine tablets. NOT reliably effective: chlorination alone. Both Giardia and Cryptosporidium cysts are resistant to standard chlorination concentrations used in water treatment.\n\nThis is a frequently tested public health point. Boiling (most reliable), filtration (0.1–1 micron pore size), and iodine are effective. Chlorine dioxide is more effective than standard chlorine against Cryptosporidium. Travelers should be advised to boil or filter water in endemic areas."
    difficulty: medium
    tags: [infectious diseases, Giardia, Cryptosporidium, water purification, prevention, public health]
  - front: "What are the standard travel vaccines recommended before international travel in Canada?"
    back: "Standard vaccines (ensure up to date): hepatitis B, MMR, tetanus/diphtheria, varicella, pertussis, polio, influenza, meningococcus. Travel-specific vaccines: hepatitis A/B, Japanese encephalitis, typhoid fever, yellow fever, rabies, ETEC, cholera, chikungunya, dengue.\n\nYellow fever vaccine may be required for entry into certain countries or upon return from endemic areas. Pre-travel consultation should assess the itinerary, duration, activities, and medical history to individualize vaccine and prophylaxis recommendations."
    difficulty: easy
    tags: [infectious diseases, travel medicine, vaccines, prevention, immunization]
  - front: "What are the malaria chemoprophylaxis options for travellers, and where does resistance to mefloquine and artemisinin occur?"
    back: "Prophylaxis options: chloroquine (limited use due to widespread resistance), mefloquine, atovaquone/proguanil (Malarone), doxycycline. Mefloquine and artemisinin resistance is increasing in Southeast Asia — check local resistance patterns before prescribing. Mefloquine has neuropsychiatric side effects (abnormal dreams, insomnia, anxiety, depressed mood).\n\nChoice of prophylaxis depends on destination, duration, individual risk factors, drug tolerability, and cost. Atovaquone/proguanil and doxycycline are common first-line options for most travelers. The MCCQE1 expects familiarity with the major prophylaxis options and the issue of drug resistance."
    difficulty: medium
    tags: [infectious diseases, malaria, chemoprophylaxis, travel medicine, drug resistance, mefloquine]
  - front: "What pathogens are transmitted by fresh water exposure and what diseases do they cause?"
    back: "Leptospira spp. (leptospirosis), Schistosoma spp. (schistosomiasis), Acanthamoeba (granulomatous amoebic encephalitis), Naegleria fowleri (primary amoebic meningoencephalitis — rapidly fatal). Soil exposure adds: Hookworms, Toxocara spp. (visceral larva migrans), Leptospira interrogans.\n\nNaegleria fowleri causes primary amoebic meningoencephalitis (PAM) — rapidly fatal, associated with warm freshwater lakes/rivers. Schistosomiasis is a major concern for travellers to sub-Saharan Africa (e.g., Lake Malawi). Leptospirosis occurs via skin/mucosal contact with water contaminated by infected animal urine."
    difficulty: medium
    tags: [infectious diseases, travel medicine, water-borne, leptospirosis, Schistosoma, Naegleria, parasites]
  - front: "What are the risk factors for staphylococcal toxic shock syndrome (TSS)?"
    back: "Tampon use, nasal packing, wound infections (e.g., postpartum vaginal, cesarean, or surgical infections).\n\nStaphylococcal TSS is caused by superantigen toxins (TSST-1) produced by S. aureus. Tampon use creates an anaerobic, protein-rich environment ideal for toxin production. Recognition of these risk factors is key to MCCQE1."
    difficulty: easy
    tags: [infectious diseases, toxic shock syndrome, staphylococcus, risk factors]
  - front: "What are the risk factors for streptococcal toxic shock syndrome (TSS)?"
    back: "Minor trauma, surgical procedures, preceding viral illness (e.g., chickenpox), use of NSAIDs.\n\nGroup A Streptococcus (GAS) TSS often follows skin/soft tissue infection. NSAIDs may mask early symptoms and impair leukocyte function. Varicella is a classic predisposing condition in children."
    difficulty: easy
    tags: [infectious diseases, toxic shock syndrome, streptococcus, risk factors]
  - front: "What are the diagnostic criteria for staphylococcal TSS?"
    back: "Fever >38.9°C, SBP <90 mmHg, diffuse erythroderma with subsequent desquamation (especially palms/soles), and involvement of ≥3 organ systems: GI, muscular (elevated CK), mucous membranes, renal, hepatic, hematologic (thrombocytopenia), or CNS (disorientation). Isolation of S. aureus is NOT required.\n\nS. aureus is rarely recovered from blood in TSS because the disease is toxin-mediated, not bacteremic. The multi-system involvement distinguishes TSS from simple cellulitis or bacteremia. MCCQE1 commonly tests the diagnostic criteria."
    difficulty: medium
    tags: [infectious diseases, toxic shock syndrome, staphylococcus, diagnosis]
  - front: "What are the diagnostic criteria for streptococcal TSS?"
    back: "SBP <90 mmHg AND isolation of GAS from a normally sterile site (blood, pleural, tissue biopsy, or surgical wound) PLUS ≥2 of: coagulopathy, liver involvement, ARDS, soft tissue necrosis (necrotizing fasciitis, myositis, gangrene), renal impairment, or erythematous macular rash that may desquamate.\n\nUnlike staphylococcal TSS, streptococcal TSS requires bacteriologic confirmation from a sterile site. Necrotizing fasciitis is a hallmark complication. Early recognition is life-saving."
    difficulty: medium
    tags: [infectious diseases, toxic shock syndrome, streptococcus, diagnosis]
  - front: "What is the treatment for streptococcal TSS?"
    back: "Supportive care, fluid resuscitation, surgical debridement of infected tissue, IV penicillin + clindamycin + IVIG.\n\nClindamycin is added because it inhibits protein (toxin) synthesis at the ribosomal level, suppressing superantigen production even when organisms are not actively dividing. IVIG neutralizes circulating toxins. These are Canadian/international guidelines."
    difficulty: medium
    tags: [infectious diseases, toxic shock syndrome, streptococcus, treatment]
  - front: "What is the treatment for staphylococcal TSS caused by MRSA versus methicillin-susceptible S. aureus (MSSA)?"
    back: "MSSA: clindamycin + cloxacillin IV. MRSA: clindamycin + vancomycin, for 10–14 days.\n\nClindamycin is included in both regimens to inhibit toxin synthesis. Cloxacillin is the preferred anti-staphylococcal beta-lactam for MSSA. Vancomycin replaces cloxacillin for MRSA coverage."
    difficulty: medium
    tags: [infectious diseases, toxic shock syndrome, staphylococcus, MRSA, treatment]
  - front: "What organism causes cat scratch disease, and how is it transmitted?"
    back: "Bartonella henselae, an intracellular gram-negative bacterium, transmitted via cat scratch or bite.\n\nCats (especially kittens) are the reservoir and are usually asymptomatic carriers. The bacteria are transmitted via cat flea feces inoculated through a scratch. Knowledge of the causative organism is frequently tested."
    difficulty: easy
    tags: [infectious diseases, cat scratch disease, Bartonella, zoonosis]
  - front: "What is the clinical presentation of cat scratch disease?"
    back: "Skin lesion within 3–10 days of inoculation, followed by fever, malaise, and tender regional lymphadenopathy 14–21 days later. Usually self-limited. Dissemination can cause FUO, hepatosplenomegaly, retinitis, encephalopathy, infective endocarditis, or uveitis.\n\nThe temporal progression (skin lesion → lymphadenopathy weeks later) is classic. In HIV-positive patients, Bartonella causes bacillary angiomatosis (violaceous nodular skin lesions + bone involvement). This distinction is high-yield."
    difficulty: easy
    tags: [infectious diseases, cat scratch disease, Bartonella, clinical features]
  - front: "What is bacillary angiomatosis and who is at risk?"
    back: "Bacillary angiomatosis is a disseminated Bartonella henselae infection seen in patients with advanced HIV, presenting as violaceous (purple) nodular skin lesions with underlying bone involvement.\n\nIn immunocompetent hosts, Bartonella causes cat scratch disease. In severely immunocompromised patients (advanced HIV), dissemination leads to bacillary angiomatosis. The violaceous nodules can be mistaken for Kaposi sarcoma."
    difficulty: medium
    tags: [infectious diseases, cat scratch disease, Bartonella, HIV, bacillary angiomatosis]
  - front: "How is cat scratch disease treated?"
    back: "Most lymphadenitis cases are self-limited. Mild-to-moderate: azithromycin. Painful suppurative nodes: needle aspiration. Disseminated disease (endocarditis, neuroretinitis, hepatosplenic): doxycycline or azithromycin + rifampin.\n\nAzithromycin shortens the duration of lymphadenopathy. For serious disseminated disease, combination therapy with rifampin is needed due to poor outcomes with monotherapy."
    difficulty: medium
    tags: [infectious diseases, cat scratch disease, Bartonella, treatment]
  - front: "What organism causes Rocky Mountain Spotted Fever (RMSF) and what is the vector in North America?"
    back: "Rickettsia rickettsii, an obligate intracellular gram-negative bacterium. Vector in North America: Dermacentor ticks. In Mexico/Central America: Rhipicephalus ticks. Reservoir hosts are rodents and dogs.\n\nRMSF causes endothelial inflammation of small blood vessels leading to widespread vasculitis. Despite the name, RMSF is most common in southeastern United States. Knowledge of the vector and organism is core MCCQE1 content."
    difficulty: easy
    tags: [infectious diseases, Rocky Mountain spotted fever, Rickettsia, tick-borne]
  - front: "Describe the characteristic rash of Rocky Mountain Spotted Fever."
    back: "Macular rash appearing on days 2–4 of fever. Begins on the wrists and ankles, spreads centrally to arms, legs, trunk, palms, and soles. Occasionally 'spotless' (in ~10% of patients).\n\nThe centripetal spread (periphery → trunk) starting on wrists/ankles is distinctive. Involvement of palms and soles also occurs in secondary syphilis and hand-foot-mouth disease. The 10% spotless variant is a diagnostic challenge."
    difficulty: easy
    tags: [infectious diseases, Rocky Mountain spotted fever, rash, clinical features]
  - front: "What is the treatment for Rocky Mountain Spotted Fever?"
    back: "Empiric doxycycline, typically 5–7 days (treat for 3 days after defervescence).\n\nDoxycycline is the drug of choice even in children due to the severity of RMSF. Delay in treatment significantly increases mortality. Diagnosis is confirmed by skin biopsy and indirect fluorescent antibody serology, but treatment should not await confirmation."
    difficulty: easy
    tags: [infectious diseases, Rocky Mountain spotted fever, treatment, doxycycline]
  - front: "How is RMSF diagnosed?"
    back: "Skin biopsy and serology (indirect fluorescent antibody test). Treatment should be started empirically and not delayed for results.\n\nThe indirect fluorescent antibody test is the gold standard serologic test. Skin biopsy with immunohistochemistry can provide a rapid diagnosis. Clinical diagnosis and early empiric treatment with doxycycline saves lives."
    difficulty: easy
    tags: [infectious diseases, Rocky Mountain spotted fever, diagnosis]
  - front: "What are the clinical features of West Nile Virus infection?"
    back: "80% asymptomatic. Symptomatic: West Nile fever (acute headache, back pain, myalgia, anorexia, maculopapular non-pruritic rash on chest/back/arms). Severe: encephalitis, meningoencephalitis, acute flaccid paralysis (especially >60 yr).\n\nWest Nile virus is transmitted by mosquitoes that have fed on infected birds (crows, blue jays). Most cases are mild. Severe neuroinvasive disease is more common in elderly and immunocompromised patients. Case fatality in severe cases is ~10%."
    difficulty: easy
    tags: [infectious diseases, West Nile virus, arbovirus, clinical features]
  - front: "What is the best diagnostic test for West Nile Virus infection?"
    back: "IgM antibody in serum or CSF. Note: cross-reactivity with yellow fever and Japanese encephalitis vaccines, dengue, and St. Louis virus. IgM can persist >6 months and may not reflect current illness. PCR from CSF, blood, or tissue has low sensitivity due to transient viremia.\n\nSerology (IgM detection) is the preferred test. CSF PCR has low sensitivity because viremia is brief. The cross-reactivity with other flaviviruses and vaccines is an important limitation to know for MCCQE1."
    difficulty: medium
    tags: [infectious diseases, West Nile virus, diagnosis, serology]
  - front: "How is West Nile Virus infection treated and prevented?"
    back: "Treatment: supportive only. Prevention: mosquito repellent (DEET, picaridin), drain stagnant water, community mosquito control programs.\n\nThere is no antiviral treatment for West Nile Virus. Climate change is expanding the geographic range and transmission season of WNV in Canada. Prevention focuses on mosquito control and personal protection."
    difficulty: easy
    tags: [infectious diseases, West Nile virus, treatment, prevention]
  - front: "What organism causes syphilis and how is it transmitted?"
    back: "Treponema pallidum subspecies pallidum, a thick motile spirochete. Transmitted sexually, vertically (mother to fetus), or parenterally (rare).\n\nT. pallidum cannot survive long outside the human host and cannot be cultured in vitro. Historically detected by dark-field microscopy. Other subspecies cause bejel (T.p. endemicum) and yaws (T.p. pertenue)."
    difficulty: easy
    tags: [infectious diseases, syphilis, Treponema pallidum, STI]
  - front: "Describe the stages of syphilis and their key features."
    back: "1° (3–90 d): painless chancre at inoculation site + regional lymphadenopathy; lasts 3–6 wk. 2° (2–8 wk after chancre): maculopapular non-pruritic rash including palms/soles, generalized lymphadenopathy, fever, malaise, condylomata lata. 3. Latent: asymptomatic; early (<1 yr) vs. late/unknown (>1 yr). 4° Tertiary (1–30 yr): gummas, aortic aneurysm, aortic insufficiency. 5. Congenital. 6. Neurosyphilis.\n\n25% of primary syphilis patients progress to secondary without treatment. Secondary syphilis is highly infectious. Condylomata lata (wart-like, moist lesions on genitals/mouth) differ from HPV condylomata acuminata. The full stage progression is high-yield for MCCQE1."
    difficulty: medium
    tags: [infectious diseases, syphilis, stages, clinical features]
  - front: "What is the Argyll Robertson pupil and in what condition is it classically seen?"
    back: "The Argyll Robertson pupil accommodates but does not react to light ('prostitute's pupil'). Classically seen in neurosyphilis (tertiary/quaternary syphilis).\n\nThe light reflex is lost while the accommodation reflex is preserved. This occurs due to damage to the pretectal nucleus in the midbrain. It is considered pathognomonic for neurosyphilis."
    difficulty: medium
    tags: [infectious diseases, syphilis, neurosyphilis, Argyll Robertson pupil, neurology]
  - front: "What are the features of congenital syphilis?"
    back: "Early: rhinitis (snuffles), lymphadenopathy, hepatosplenomegaly, pseudoparalysis (bone pain from osteitis), maculopapular rash on palms/soles. Late (>2 yr): saddle nose, saber shins, Clutton joints, Hutchinson's teeth, mulberry molars, rhagades, CN VIII deafness, interstitial keratitis.\n\nCongenital syphilis can cause spontaneous abortions, stillbirths, malformations, and developmental delay. Most infected newborns are initially asymptomatic. Hutchinson's triad (interstitial keratitis, Hutchinson's teeth, CN VIII deafness) is a late manifestation."
    difficulty: medium
    tags: [infectious diseases, syphilis, congenital syphilis, pediatrics]
  - front: "What is the Jarisch-Herxheimer reaction?"
    back: "A febrile reaction occurring within 10–24 hours of starting penicillin treatment for 2° or 3° syphilis, caused by lysis of organisms releasing pyrogens.\n\nThe Jarisch-Herxheimer reaction is self-limited and consists of fever, rigors, and worsening of skin lesions. It is most common in secondary syphilis. It is not an allergic reaction to penicillin and is managed with antipyretics and supportive care."
    difficulty: medium
    tags: [infectious diseases, syphilis, Jarisch-Herxheimer reaction, treatment complications]
  - front: "How is syphilis screened and confirmed?"
    back: "Screening: non-treponemal tests (RPR, VDRL) or treponemal tests (EIA, CMIA, CLIA). Confirmatory: treponemal tests (TPPA, FTA-ABS, MHA-TP, TPI). In Canada, testing is ordered through Public Health labs.\n\nNon-treponemal tests (RPR, VDRL) reflect disease activity and can be used to monitor treatment response (titers fall with treatment). Treponemal tests remain positive for life and confirm diagnosis but do not indicate disease activity."
    difficulty: medium
    tags: [infectious diseases, syphilis, diagnosis, serology, RPR, VDRL]
  - front: "When should lumbar puncture be performed in syphilis?"
    back: "LP for neurosyphilis evaluation if: seropositive + symptoms of neurosyphilis, treatment failure/tertiary symptoms, or HIV+ with late latent/unknown duration syphilis.\n\nNeurosyphilis can occur at any stage of syphilis. CSF findings include elevated lymphocytes and protein, and positive VDRL in CSF (highly specific but insensitive). Early diagnosis and treatment prevent permanent neurological damage."
    difficulty: medium
    tags: [infectious diseases, syphilis, neurosyphilis, lumbar puncture]
  - front: "What is the treatment for primary, secondary, and early latent syphilis?"
    back: "Benzathine penicillin G 2.4 million units IM × 1 dose. If truly allergic to penicillin: doxycycline 100 mg PO BID × 14 days. IM ceftriaxone 1 g daily is another alternative.\n\nSingle-dose IM benzathine penicillin remains the standard of care. Doxycycline is the key second-line agent. Pregnant patients allergic to penicillin should undergo oral desensitization (penicillin remains preferred in pregnancy)."
    difficulty: medium
    tags: [infectious diseases, syphilis, treatment, penicillin, STI]
  - front: "What is the treatment for tertiary/late latent syphilis and neurosyphilis?"
    back: "Late latent/tertiary: benzathine penicillin G 2.4 million units IM weekly × 3 doses. If penicillin allergic: doxycycline 100 mg PO BID × 28 days. Neurosyphilis: aqueous penicillin G 16–24 million units/day IV × 14 days + single dose benzathine penicillin.\n\nThe extended treatment duration for late latent syphilis reflects slower organism replication. Neurosyphilis requires IV penicillin to achieve adequate CNS levels. The distinction in treatment between early and late disease is high-yield for MCCQE1."
    difficulty: medium
    tags: [infectious diseases, syphilis, neurosyphilis, treatment]
  - front: "What are the outcomes of Mycobacterium tuberculosis inhalation?"
    back: "1. Immediate clearance. 2. Latent TB infection (asymptomatic, immune-contained) — 90% of infected. 3. Primary TB (symptomatic active disease) — 5%. 4. Secondary TB (reactivation of latent TB) — 5–10% of those with latent TB, usually within 1–2 yr of initial infection.\n\nLatent TB is the most common outcome. Reactivation risk is highest in the first 1–2 years and is greatly increased by immunosuppression (especially HIV), TNF-α inhibitors, diabetes, malnutrition, and extremes of age."
    difficulty: easy
    tags: [infectious diseases, tuberculosis, TB, latent TB, pathophysiology]
  - front: "What populations in Canada are at highest risk of tuberculosis?"
    back: "Canadian-born Indigenous peoples (especially Inuit — TB incidence 25× higher than Canadian-born non-Indigenous people), immigrants from high-prevalence countries (Asia, Latin America, Sub-Saharan Africa, Eastern Europe), people experiencing homelessness, those with low SES, IDU, and people in crowded living conditions.\n\nTB disparities in Indigenous Canadian communities, especially Inuit in Nunavut, are a major public health concern and are specifically highlighted in Canadian guidelines. This social determinants context is important for MCCQE1."
    difficulty: easy
    tags: [infectious diseases, tuberculosis, TB, epidemiology, Indigenous health, Canada]
  - front: "What host factors increase the risk of TB reactivation?"
    back: "HIV infection (highest risk), TNF-α inhibitors, glucocorticoids, silicosis, CKD requiring dialysis, diabetes, malignancy/chemotherapy, substance use (drugs, alcohol, smoking), and extremes of age.\n\nHIV is the single greatest risk factor for TB reactivation. TNF-α inhibitors (used in RA, IBD, etc.) significantly increase TB risk — patients must be screened before initiating therapy. These host factors should be screened in any TB workup."
    difficulty: easy
    tags: [infectious diseases, tuberculosis, TB, risk factors, immunosuppression]
  - front: "What are the clinical features of pulmonary tuberculosis?"
    back: "Chronic productive cough ± hemoptysis, fever, night sweats, weight loss, chest pain, anorexia. CXR: apical-posterior infiltrates, cavitation, lung volume loss. Non-resolving pneumonia despite standard antimicrobials is a key clinical clue.\n\nUpper lobe predominance reflects the high oxygen tension favoring M. tuberculosis growth. Cavitation indicates extensive tissue destruction and high bacterial burden. Failure to respond to standard antibiotics is a red flag prompting TB workup."
    difficulty: easy
    tags: [infectious diseases, tuberculosis, pulmonary TB, clinical features]
  - front: "What is miliary tuberculosis and what is its chest X-ray appearance?"
    back: "Miliary TB is widely disseminated hematogenous TB affecting lungs, abdominal organs, bone marrow, and CNS. CXR shows multiple small 1–5 mm millet seed-like lesions throughout the lungs.\n\nThe term 'miliary' derives from the resemblance to millet seeds. Miliary TB occurs when TB bacilli disseminate via the bloodstream, most commonly in immunocompromised hosts or after primary infection. BCG vaccine is ~80% effective against miliary TB in children."
    difficulty: easy
    tags: [infectious diseases, tuberculosis, miliary TB, radiology]
  - front: "What are common sites of extrapulmonary tuberculosis?"
    back: "Lymphadenitis, pleurisy, pericarditis, hepatitis, peritonitis, meningitis, osteomyelitis (vertebral = Pott disease), adrenal (Addison disease), renal, and ovarian.\n\nPott disease (vertebral TB) is the most common form of skeletal TB and can cause spinal cord compression. Adrenal TB causing Addison disease is a classic teaching point. Extrapulmonary TB is more common in immunocompromised patients."
    difficulty: easy
    tags: [infectious diseases, tuberculosis, extrapulmonary TB, Pott disease]
  - front: "What is the Ghon complex?"
    back: "A parenchymal granuloma (primary focus) combined with a calcified hilar lymph node on the same side, indicating previous primary tuberculosis infection.\n\nThe Ghon complex is seen on chest X-ray as a calcified peripheral nodule (Ghon focus) with ipsilateral hilar lymphadenopathy. It indicates prior healed primary TB. Recognition is important for distinguishing prior infection from active disease."
    difficulty: easy
    tags: [infectious diseases, tuberculosis, Ghon complex, radiology, primary TB]
  - front: "Compare TST (tuberculin skin test) and IGRA (interferon-gamma release assay) for TB screening."
    back: "Both diagnose prior TB infection. IGRA has fewer false positives (does not detect BCG vaccine antigens or most NTM). TST preferred for serial testing (e.g., healthcare workers). IGRA preferred if BCG given after age 1 yr, vaccinated >1 time, or unable to return for reading.\n\nFalse-positive TST results from BCG vaccination are a significant limitation in countries where BCG is routinely used. IGRA (QuantiFERON-TB, T-SPOT.TB) uses specific M. tuberculosis antigens absent from BCG strains. Neither test distinguishes latent from active TB."
    difficulty: medium
    tags: [infectious diseases, tuberculosis, TST, IGRA, screening, diagnosis]
  - front: "What are the causes of false-positive and false-negative TST (tuberculin skin test)?"
    back: "False-positive: BCG vaccine after age 1 year, NTM infection, booster effect. False-negative: poor technique, anergy (immunosuppression, HIV), recent infection (<10 weeks), remotely distant prior infection.\n\nAnergy is particularly common in severe immunosuppression (HIV with low CD4). The booster effect occurs when a remote positive TST reverts to negative and then re-becomes positive on repeat testing — this can be mistaken for new conversion."
    difficulty: medium
    tags: [infectious diseases, tuberculosis, TST, false positive, false negative]
  - front: "What is the standard treatment for active pulmonary tuberculosis?"
    back: "Initiation phase: INH + rifampin + pyrazinamide + ethambutol × 2 months. Continuation phase: INH + rifampin × 4 months. Total: 6 months. Extend continuation to 7 months if >65 yr, pregnant, or high risk of hepatotoxicity. (RIPE regimen)\n\nThe four-drug RIPE regimen covers the risk of undetected primary resistance. Pyrazinamide has unique bactericidal activity in acidic environments (within macrophages). Ethambutol provides additional coverage until susceptibility results are available."
    difficulty: medium
    tags: [infectious diseases, tuberculosis, TB treatment, RIPE regimen]
  - front: "What are the regimens for treatment of latent TB infection (LTBI)?"
    back: "Options: (1) Rifampin daily × 4 months. (2) INH + rifapentine weekly × 3 months (3HP). (3) INH + pyridoxine daily × 9 months (previous standard). (4) INH × 6 months. (5) INH + rifampin daily × 3 months. Pyridoxine (B6) added with INH to prevent neuropathy.\n\nMultiple LTBI regimens are recommended by Canadian guidelines. Shorter rifampin-based regimens (4R, 3HP, 3HR) have better completion rates than the 9-month INH regimen. Active TB must be ruled out before starting LTBI therapy."
    difficulty: medium
    tags: [infectious diseases, tuberculosis, latent TB, LTBI treatment]
  - front: "When should pyridoxine (vitamin B6) be added to isoniazid treatment for TB?"
    back: "Add pyridoxine with INH in cases of diabetes, renal failure, malnutrition, substance use disorders, seizure disorders, pregnancy/breastfeeding, or risk of peripheral neuropathy.\n\nINH competitively inhibits pyridoxine metabolism, causing peripheral neuropathy through pyridoxine deficiency. High-risk groups have lower pyridoxine stores or higher demand. Routine supplementation is common practice in many guidelines."
    difficulty: medium
    tags: [infectious diseases, tuberculosis, isoniazid, pyridoxine, neuropathy prevention]
  - front: "Define multidrug-resistant (MDR) TB and extensively drug-resistant (XDR) TB."
    back: "MDR-TB: resistance to INH + rifampin ± others. XDR-TB: resistance to INH + rifampin + fluoroquinolone + ≥1 injectable second-line agent. Suspect if prior treatment failed, exposure to known MDR index case, or immigration from high-risk area.\n\nMDR- and XDR-TB are a global public health crisis. There were only 5 documented XDR-TB cases in Canada from 1997–2008, but global travel increases risk. Empiric treatment of suspected MDR/XDR-TB requires specialist referral. TB is a reportable disease to Public Health in Canada."
    difficulty: medium
    tags: [infectious diseases, tuberculosis, MDR-TB, XDR-TB, drug resistance]
  - front: "What is the BCG vaccine and who is it recommended for in Canada?"
    back: "BCG (Bacille Calmette-Guérin) is ~80% effective against pediatric miliary and meningeal TB. In Canada, recommended for infants in high-incidence communities (especially Indigenous communities) in whom there is no evidence of HIV infection or immunodeficiency.\n\nBCG effectiveness in adults varies widely (0–80%). BCG is not routinely given to all Canadian infants but is targeted at high-risk communities. BCG causes false-positive TST, which is why IGRA is preferred in BCG-vaccinated populations."
    difficulty: easy
    tags: [infectious diseases, tuberculosis, BCG vaccine, prevention, Canada]
  - front: "What are the components of the HIV virion?"
    back: "Envelope: gp120 (attaches to host T-cell CD4) and gp41 (fusion and entry). Matrix: p17. Capsid: p24 (marker of acute infection). Core contains 2 copies of single-stranded RNA plus reverse transcriptase, integrase, and protease enzymes.\n\np24 antigen is detectable during the window period before antibodies develop, making 4th-generation (combined p24/antibody) tests more sensitive in early infection. gp120 binds CD4 and CCR5/CXCR4 co-receptors. This structure underpins the mechanism of each ART drug class."
    difficulty: medium
    tags: [infectious diseases, HIV, virology, HIV structure]
  - front: "What is the mechanism of HIV entry into CD4+ T lymphocytes?"
    back: "gp120 binds CD4 receptor and then CCR5 or CXCR4 co-receptor on the T-cell surface. gp41 mediates fusion of the viral envelope with the host cell membrane. RNA is then converted to dsDNA by reverse transcriptase, and dsDNA integrates into the host genome by integrase.\n\nCCR5 is the co-receptor used by macrophage-tropic (R5) HIV, while CXCR4 is used by T-tropic (X4) HIV, which emerges later in disease. CCR5 antagonists (maraviroc) block this co-receptor, preventing viral entry."
    difficulty: medium
    tags: [infectious diseases, HIV, pathophysiology, CD4, CCR5, CXCR4]
  - front: "What is the significance of the CCR5 delta-32 mutation?"
    back: "Homozygosity for the CCR5 Δ32 mutation confers near-complete resistance to HIV infection. Heterozygosity slows HIV disease progression.\n\nIndividuals homozygous for CCR5 Δ32 lack functional CCR5 on their T cells, preventing HIV entry. This is the genetic basis for the 'Berlin patient' (Timothy Ray Brown), who was functionally cured of HIV after a bone marrow transplant from a CCR5 Δ32 donor. It supports CCR5 antagonists as ART targets."
    difficulty: hard
    tags: [infectious diseases, HIV, CCR5, genetics, resistance]
  - front: "What are the transmission probabilities of HIV by route of exposure?"
    back: "Rectal (receptive anal sex): 1 in 20 to 1 in 300. Vaginal sex: 1 in 200 to 1 in 2000 (female receiving semen). Male receiving: 1 in 700 to 1 in 3000. Oral (receptive): 1 in 2500. Perinatal (intrapartum): 1 in 5 to 1 in 10. Breastmilk: 1 in 5 to 1 in 10. Blood products: 95 in 100.\n\nRectal receptive anal intercourse has the highest per-act risk due to the thin rectal epithelium. Blood products (before universal screening) had very high transmission rates. Understanding relative risks informs counseling and risk stratification."
    difficulty: medium
    tags: [infectious diseases, HIV, transmission, epidemiology]
  - front: "What are the clinical features of acute retroviral syndrome (primary HIV infection)?"
    back: "40–90% experience an acute non-specific illness 2–6 weeks post-exposure lasting 10–15 days: fever, pharyngitis, lymphadenopathy, rash, arthralgias, myalgias, headache, GI symptoms, oral ulcers, weight loss. Hematologic: lymphopenia, thrombocytopenia. 10–20% develop aseptic meningitis or CN palsies.\n\nAcute retroviral syndrome is the period of highest viral load and transmission risk. HIV RNA and/or p24 may be detected in CSF. The presentation mimics infectious mononucleosis. Testing with 4th-generation assays (p24/antibody) is essential as antibody tests may be negative."
    difficulty: easy
    tags: [infectious diseases, HIV, acute retroviral syndrome, primary HIV]
  - front: "What is the natural history of CD4 count decline in untreated HIV infection?"
    back: "Normal adult CD4 count: 500–1100 cells/mm³. CD4 drops ~60–100 cells/mm³ per year. By 10 years untreated: 50% have AIDS, 30% milder symptoms, <20% asymptomatic.\n\nThe rate of CD4 decline is variable and influenced by viral load, genetic factors, and co-infections. CD4 count is the primary marker of immune function in HIV. ART can reverse CD4 decline and restore immune function."
    difficulty: easy
    tags: [infectious diseases, HIV, CD4 count, natural history, AIDS]
  - front: "What is the case definition of AIDS?"
    back: "HIV-positive AND one or more: opportunistic infections (PJP, esophageal candidiasis, CMV, MAC, TB, toxoplasmosis), malignancy (Kaposi's sarcoma, invasive cervical cancer), wasting syndrome, OR CD4 <200 cells/mm³ (or <15%).\n\nThe CD4 <200 threshold is largely historical because ART can reverse the decline. Clinically, recognizing AIDS-defining conditions prompts HIV testing and workup. PJP is the most common AIDS-defining illness in Canada."
    difficulty: easy
    tags: [infectious diseases, HIV, AIDS, AIDS-defining illness, CD4]
  - front: "What opportunistic infections occur at different CD4 count thresholds in HIV?"
    back: "<500: constitutional symptoms, seborrheic dermatitis, HSV, VZV, oral hairy leukoplakia, candidiasis, recurrent bacterial pneumonia, TB, lymphoma, HPV malignancies. <200: PJP, Kaposi sarcoma, oral thrush, Cryptococcus, Coccidioides, Histoplasma. <100: PML (JC virus), CNS toxoplasmosis. <50: CMV (retinitis, colitis), MAC, bacillary angiomatosis, primary CNS lymphoma.\n\nMemorizing the CD4 thresholds for specific opportunistic infections is essential for MCCQE1. PJP occurs at <200, MAC and CMV occur at <50. Each OI has specific prophylaxis and treatment regimens."
    difficulty: medium
    tags: [infectious diseases, HIV, opportunistic infections, CD4 count, AIDS]
  - front: "What are the prophylaxis regimens for opportunistic infections in HIV?"
    back: "PJP (CD4 <200): TMP/SMX 1SS or DS once daily. Toxoplasma (IgG+ and CD4 <100): TMP/SMX 1DS daily. TB (PPD >5 mm or contact): INH + pyridoxine × 9 months. MAC (CD4 <50): No prophylaxis if started on ART (prophylaxis can be discontinued if CD4 rises above threshold for ≥6 months).\n\nTMP/SMX covers both PJP and toxoplasmosis, making it highly efficient prophylaxis. MAC prophylaxis was previously azithromycin but is no longer recommended if ART is started promptly. Prophylaxis can be discontinued once immune reconstitution occurs on ART."
    difficulty: medium
    tags: [infectious diseases, HIV, prophylaxis, opportunistic infections, TMP-SMX]
  - front: "What is the window period for HIV antibody testing and what are the diagnostic tests used?"
    back: "Antibody window: ~3 weeks median, virtually all by 3 months. Screening: 3rd-gen ELISA (sensitivity ≥99.5%) or 4th-gen combined p24 antigen/antibody test (sensitivity/specificity approaches 100% for chronic, better for early infection). Confirmatory: Western blot (antibodies to ≥2 HIV protein bands: p24, gp41, gp120/160; specificity >99.99%).\n\n4th-generation tests detect p24 antigen before antibodies develop, reducing the window period to ~2 weeks. All positive screening tests require Western blot confirmation. Rapid (point-of-care) tests have higher false-positive rates and also need confirmation."
    difficulty: medium
    tags: [infectious diseases, HIV, diagnosis, ELISA, Western blot, window period]
  - front: "Why do all infants born to HIV-positive mothers test ELISA-positive for HIV, and how is HIV diagnosed in these infants?"
    back: "All infants inherit maternal IgG antibodies (including anti-HIV) that persist for up to 18 months, making ELISA unreliable. Definitive early diagnosis in infants is made by HIV RNA or DNA PCR detection in plasma.\n\nMaternal antibody transfer is the reason standard antibody tests cannot be used in neonates exposed to HIV. HIV RNA/DNA PCR can detect infection as early as the first few weeks of life. Early diagnosis allows prompt ART initiation to prevent disease progression."
    difficulty: medium
    tags: [infectious diseases, HIV, perinatal HIV, diagnosis, neonates]
  - front: "What are the goals and monitoring parameters for HIV management?"
    back: "Goal: viral load <20 copies/mL (undetectable). Viral load should decrease 10-fold within 4–8 weeks and be undetectable by 6 months. Monitor: CD4 count (if non-stable/non-suppressed), HIV RNA viral load q3–6 months, baseline resistance testing, HLA-B*5701, CCR5 tropism testing, TB skin test, serologies (HAV, HBV, HCV, syphilis, toxo, CMV, VZV), annual fasting lipids/glucose.\n\nUndetectable = Untransmittable (U=U): patients with viral load <200 copies/mL do not transmit HIV to sexual partners. CD4 monitoring can be reduced once consistently >500 with suppressed viral load. Annual screening (PAP, STI) and vaccines are part of comprehensive HIV care."
    difficulty: medium
    tags: [infectious diseases, HIV, ART monitoring, viral load, CD4]
  - front: "What is HLA-B*5701 testing and why is it important in HIV treatment?"
    back: "HLA-B*5701 is a genetic allele present in ~5–7% of White individuals (lower in other ethnicities). Individuals carrying this allele are at risk for abacavir hypersensitivity reactions. Screening must be done before starting any abacavir-containing regimen.\n\nAbacavir hypersensitivity is a severe, potentially fatal systemic reaction that includes fever, rash, GI symptoms, and respiratory symptoms. It occurs almost exclusively in HLA-B*5701-positive patients. If rechallenge occurs after stopping abacavir, the reaction can be life-threatening."
    difficulty: medium
    tags: [infectious diseases, HIV, abacavir, HLA-B5701, pharmacogenomics, ART]
  - front: "What is the first-line antiretroviral regimen for treatment-naive HIV-positive adults?"
    back: "2 NRTIs + 1 INSTI or boosted PI. Preferred regimens: (1) bictegravir/TAF/FTC; (2) DTG/ABC/3TC (if HLA-B*5701 negative); (3) DTG + (TAF or TDF)/(FTC or 3TC); (4) raltegravir + TAF/FTC; (5) DTG/3TC.\n\nIntegrase inhibitors (INSTIs) are preferred due to high potency, favorable side effect profile, and high barrier to resistance. Single-pill regimens (e.g., Biktarvy®) improve adherence. The goal is viral suppression <20 copies/mL."
    difficulty: medium
    tags: [infectious diseases, HIV, ART, first-line treatment, INSTI]
  - front: "What are the drug classes of antiretroviral therapy (ART) and their mechanisms?"
    back: "NRTIs: competitively inhibit/terminate reverse transcriptase (chain termination). NNRTIs: non-competitively inhibit reverse transcriptase. PIs: inhibit protease, preventing polyprotein cleavage and virion maturation. INSTIs: inhibit integration of viral DNA into host genome. Fusion inhibitors (enfuvirtide): block gp41, preventing viral fusion. CCR5 antagonists (maraviroc): block CCR5 co-receptor.\n\nEach drug class targets a different step in the HIV life cycle. Combination therapy with at least 3 drugs from ≥2 classes is the standard to prevent resistance. Single-pill regimens combining multiple classes have revolutionized HIV treatment."
    difficulty: medium
    tags: [infectious diseases, HIV, ART, drug mechanisms, antiretroviral]
  - front: "What are key adverse effects of nucleoside reverse transcriptase inhibitors (NRTIs)?"
    back: "Class effect: lactic acidosis (mitochondrial toxicity), lipodystrophy, rash, nausea/vomiting/diarrhea. Drug-specific: AZT → bone marrow suppression, myopathy; ddI/d4T → peripheral neuropathy, pancreatitis; ABC → drug-induced hypersensitivity (HLA-B*5701). Thymidine analogues (AZT, d4T) → lipoatrophy.\n\nLactic acidosis from mitochondrial toxicity is a rare but potentially fatal class effect of NRTIs. Lipodystrophy includes both lipoatrophy (fat loss from face/extremities with thymidine analogues) and lipohypertrophy (fat accumulation centrally). Older NRTIs (AZT, d4T) have worse profiles than newer agents (TAF, TDF)."
    difficulty: medium
    tags: [infectious diseases, HIV, ART, NRTI, adverse effects]
  - front: "What are key adverse effects of non-nucleoside reverse transcriptase inhibitors (NNRTIs)?"
    back: "Rash (including Stevens-Johnson syndrome), CNS effects (dizziness, insomnia, somnolence, abnormal dreams — especially efavirenz), hepatotoxicity (nevirapine — avoid in women with CD4 >250 or men with CD4 >400), CYP3A4 interactions.\n\nEfavirenz is notorious for CNS side effects (vivid dreams, psychiatric symptoms) and is taken at bedtime to minimize impact. Nevirapine hepatotoxicity risk is higher at higher baseline CD4 counts, particularly in women. CYP3A4 interactions affect many co-medications."
    difficulty: medium
    tags: [infectious diseases, HIV, ART, NNRTI, adverse effects, efavirenz]
  - front: "What are key adverse effects of protease inhibitors (PIs)?"
    back: "Lipodystrophy, metabolic syndrome, nausea/vomiting/diarrhea, nephrolithiasis (indinavir), rash (amprenavir), hyperbilirubinemia (atazanavir, indinavir), hyperlipidemia, CYP3A4 interactions. Boosting with ritonavir or cobicistat improves pharmacokinetics.\n\nPIs are pharmacologically 'boosted' with low-dose ritonavir (CYP3A4 inhibitor) to increase drug levels and reduce dosing frequency. Metabolic complications (increased LDL, triglycerides, insulin resistance, increased CVD risk) are class effects. Atazanavir causes a benign unconjugated hyperbilirubinemia."
    difficulty: medium
    tags: [infectious diseases, HIV, ART, protease inhibitors, adverse effects]
  - front: "What is post-exposure prophylaxis (PEP) for HIV?"
    back: "PEP is a 2- or 3-drug ART regimen initiated immediately (<72 hours) after occupational (needle-stick) or non-occupational (consensual sex, sexual assault) HIV exposure, continued for 4 weeks.\n\nPEP efficacy decreases with delay; it should be started as soon as possible and within 72 hours. Pre-exposure prophylaxis (PrEP) is taken before exposure. ART is associated with 96% reduction in HIV transmission risk to sexual partners."
    difficulty: medium
    tags: [infectious diseases, HIV, PEP, post-exposure prophylaxis, prevention]
  - front: "What is pre-exposure prophylaxis (PrEP) for HIV and what are the dosing strategies?"
    back: "PrEP options: (1) Daily oral TDF/FTC or TAF/FTC. (2) 'On-demand' (2-1-1) PrEP: double dose 12–24 h before exposure, then single doses 24 and 48 h after. (3) Injectable cabotegravir every 2 months. Indicated for high-risk HIV-uninfected individuals (MSM, serodiscordant couples, PWID).\n\nPrEP reduces HIV acquisition by ~49–86% compared to placebo in clinical trials. The 2-1-1 strategy is effective for event-driven use in MSM. Injectable cabotegravir (long-acting) eliminates daily pill burden. PrEP does not protect against other STIs."
    difficulty: medium
    tags: [infectious diseases, HIV, PrEP, pre-exposure prophylaxis, prevention]
  - front: "How can vertical (mother-to-child) HIV transmission be prevented?"
    back: "Initiate maternal ART before or as early as possible in pregnancy. If maternal viral load is undetectable prior to delivery, vertical transmission risk is reduced to <1%. Universal precautions, avoidance of breastfeeding in resource-rich settings.\n\nWithout intervention, vertical transmission risk is ~25–40% (intrapartum + breastfeeding). With optimal ART and obstetric management, it approaches <1%. Elective cesarean section may be considered if viral load is detectable near delivery."
    difficulty: medium
    tags: [infectious diseases, HIV, prevention of vertical transmission, pregnancy, ART]
  - front: "What is the definition of HIV treatment failure?"
    back: "Defined primarily by viral load persistently >200 copies/mL. Confirm it is not a transient 'blip.' Assess adherence, drug interactions, and perform resistance testing. Construct a new combination regimen.\n\nA 'blip' is a transient low-level viremia (<200 copies/mL) in a patient with otherwise suppressed viral load — not treatment failure. True treatment failure requires assessment of adherence (the most common cause), pharmacokinetics, and genotypic resistance testing."
    difficulty: medium
    tags: [infectious diseases, HIV, ART, treatment failure, viral load]
  - front: "What vaccines are recommended for HIV-positive patients?"
    back: "Annual influenza vaccine, 23-valent pneumococcal vaccine every 5 years, HBV vaccine (if not immune), HAV vaccine (if seronegative), HPV vaccine.\n\nHIV-positive patients are at increased risk for vaccine-preventable diseases. Live vaccines (e.g., live-attenuated influenza) are generally avoided in severely immunocompromised patients (CD4 <200). Pneumococcal vaccination reduces risk of recurrent pneumonia, a common HIV complication."
    difficulty: easy
    tags: [infectious diseases, HIV, vaccines, immunization, prevention]
  - front: "What are the three types of HIV testing in Canada?"
    back: "1. Nominal (name-based): patient identity known, test ordered by name, positive results reported to Public Health, documented in health record. 2. Non-nominal: test ordered by code/initials. 3. Anonymous: available at specialized clinics, unique code known only to patient, not in health record — but patient ID needed to access ART.\n\nHIV testing is regulated provincially in Canada. Anonymous testing protects patient privacy but requires identification when accessing treatment. All nominal and non-nominal positive HIV tests must be reported to Public Health under communicable disease reporting requirements."
    difficulty: easy
    tags: [infectious diseases, HIV, testing, public health, Canada, privacy]
  - front: "What are the HIV non-disclosure laws in Ontario?"
    back: "Since 2017, non-disclosure of HIV status to a sexual partner is no longer a criminal offense in Ontario if: (1) on ART with viral load <200 copies/mL for ≥6 months, OR (2) viral load 200–1500 copies/mL AND a condom is used properly and does not break.\n\nPrior to 2017, HIV non-disclosure was criminalized regardless of viral load or condom use. The updated law reflects the Undetectable = Untransmittable (U=U) evidence. Healthcare providers should counsel HIV-positive patients on their legal obligations."
    difficulty: medium
    tags: [infectious diseases, HIV, non-disclosure, public health law, Ontario, ethics]
  - front: "What is subcutaneous sporotrichosis and how does it present and spread?"
    back: "Caused by subcutaneous inoculation of Sporothrix schenckii (a soil fungus), classically in gardeners injured by a rose thorn or splinter. Presents as subcutaneous nodule at entry site that may ulcerate. Fungi migrate up lymphatic vessels creating 'nodular lymphangitis'.\n\nSporotrichosis is the classic cause of nodular lymphangitis (ascending lymphatic spread). Other causes include Nocardia, atypical mycobacteria, Leishmania, and Francisella (tularemia). Treatment is with oral azole antifungals; IV amphotericin B for severe/disseminated infection."
    difficulty: medium
    tags: [infectious diseases, fungal infections, sporotrichosis, Sporothrix schenckii, nodular lymphangitis]
  - front: "A gardener presents with a nodule at a rose thorn puncture site and additional nodules tracking up the arm toward the axilla. What is the diagnosis, organism, and treatment?"
    back: "Sporotrichosis (lymphocutaneous form) caused by Sporothrix schenckii. Treatment: oral azole antifungal (itraconazole is first-line). IV amphotericin B for severe or disseminated disease.\n\nThis is the classic presentation of lymphocutaneous sporotrichosis — nodular lymphangitis following a traumatic inoculation in a gardener. Itraconazole for 3–6 months is the standard treatment. Saturated solution of potassium iodide (SSKI) is an older alternative."
    difficulty: medium
    tags: [infectious diseases, fungal infections, sporotrichosis, clinical reasoning, treatment]
  - front: "A patient with HIV and CD4 count of 40 cells/mm³ develops painful periorbital visual changes and CMV retinitis is diagnosed. What else should be screened for at this CD4 level?"
    back: "At CD4 <50: screen for CMV (retinitis, colitis, cholangiopathy, CNS), MAC (Mycobacterium avium complex), bacillary angiomatosis (disseminated Bartonella), and primary CNS lymphoma.\n\nCD4 <50 represents profound immunosuppression and is associated with the most severe opportunistic infections. CMV retinitis can cause blindness if untreated. MAC causes fevers, night sweats, weight loss, and cytopenias. Recognizing CD4-threshold-specific OIs guides prophylaxis and treatment decisions."
    difficulty: hard
    tags: [infectious diseases, HIV, opportunistic infections, CMV, CD4, clinical reasoning]
  - front: "Why is clindamycin added to antibiotic regimens in toxic shock syndrome (TSS)?"
    back: "Clindamycin inhibits bacterial protein synthesis at the ribosomal level (50S subunit), thereby suppressing superantigen toxin production even when organisms are not actively dividing (stationary phase). Beta-lactams are only effective against actively dividing bacteria.\n\nIn TSS, the clinical syndrome is primarily toxin-mediated. Superantigen toxins cause massive T-cell activation and cytokine release. Clindamycin's ability to suppress toxin synthesis at any growth phase makes it essential. This is why it is combined with penicillin/cloxacillin/vancomycin rather than used alone."
    difficulty: hard
    tags: [infectious diseases, toxic shock syndrome, clindamycin, mechanism, pharmacology]
  - front: "How does West Nile Virus epidemiology relate to climate change in Canada?"
    back: "Rising temperatures increase mosquito survival, geographical range, biting rates, and viral replication within mosquitoes, shorten reproduction rates, and lengthen transmission seasons. Climate change also alters bird migration patterns, changing virus spread across Canada.\n\nWNV has been detected throughout the US and much of southern Canada (Quebec, Ontario, Manitoba, Saskatchewan, Alberta). Climate-driven northward expansion of mosquito populations increases WNV risk in previously low-risk Canadian regions. This has public health policy implications."
    difficulty: medium
    tags: [infectious diseases, West Nile virus, epidemiology, climate change, Canada, public health]
  - front: "What is the mechanism of action of amphotericin B?"
    back: "Amphotericin B is a polyene antimicrobial that inserts into the fungal cytoplasmic membrane, causing altered membrane permeability and cell death.\n\nAmphotericin B binds to ergosterol in the fungal cell membrane, creating pores that disrupt ion gradients and lead to cell death. The liposomal formulation reduces nephrotoxicity while maintaining efficacy and is preferred in many clinical settings."
    difficulty: easy
    tags: [antifungals, amphotericin B, mechanism of action, pharmacology]
  - front: "What are the major adverse effects of amphotericin B?"
    back: "Nephrotoxicity, hypo/hyperkalemia, infusion reactions (chills, fevers, headache), and peripheral phlebitis.\n\nNephrotoxicity is the most clinically significant toxicity of conventional amphotericin B; liposomal formulations significantly reduce this risk. Pre-hydration with normal saline can reduce nephrotoxicity. Infusion-related reactions (rigors, fever) occur with IV administration and can be pre-treated with diphenhydramine and acetaminophen."
    difficulty: easy
    tags: [antifungals, amphotericin B, adverse effects, nephrotoxicity]
  - front: "Which infections is amphotericin B used to treat?"
    back: "Endemic mycoses (histoplasmosis, blastomycosis, coccidioidomycosis), pulmonary aspergillosis, and CNS cryptococcosis.\n\nAmphotericin B has the broadest antifungal spectrum and remains the drug of choice or alternative for life-threatening systemic fungal infections. Liposomal amphotericin B is particularly used for CNS infections due to better CNS penetration."
    difficulty: easy
    tags: [antifungals, amphotericin B, indications, cryptococcus, aspergillosis]
  - front: "What is the mechanism of action of azole antifungals?"
    back: "Azoles inhibit ergosterol synthesis by blocking the 14-alpha-demethylase enzyme (CYP51), thereby altering fungal cell membrane permeability.\n\nBy inhibiting fungal ergosterol synthesis (the equivalent of mammalian cholesterol), azoles disrupt membrane integrity and function. This is a fungistatic mechanism (not fungicidal like amphotericin B). The azole class includes fluconazole, itraconazole, voriconazole, posaconazole, and isavuconazole."
    difficulty: easy
    tags: [antifungals, azoles, mechanism of action, ergosterol]
  - front: "A patient on voriconazole develops visual disturbances. What should the clinician know about this side effect?"
    back: "Visual disturbances occur in approximately 30% of patients on voriconazole. This is a common, transient side effect that typically resolves with dose adjustment or discontinuation.\n\nVoriconazole causes transient visual disturbances (blurred vision, photophobia, colour perception changes) in ~30% of patients, most commonly shortly after dosing. Long-term use, especially in immunosuppressed patients, is also associated with cutaneous photosensitivity, cutaneous squamous cell carcinoma, periostitis, and prolonged QT. Hepatotoxicity monitoring is essential."
    difficulty: medium
    tags: [antifungals, voriconazole, adverse effects, visual disturbance]
  - front: "What is the drug of choice for invasive aspergillosis based on landmark trial evidence?"
    back: "Voriconazole is the drug of choice for primary therapy of invasive aspergillosis, demonstrating superior outcomes compared to amphotericin B (52.8% vs 31.6% success rate at 12 weeks).\n\nThe Herbrecht et al. 2002 NEJM trial showed voriconazole was more clinically effective with fewer side effects than amphotericin B for invasive aspergillosis. Survival at 12 weeks was also superior (70.8% vs 57.9%). This is now standard of care per IDSA guidelines."
    difficulty: medium
    tags: [antifungals, aspergillosis, voriconazole, landmark trials]
  - front: "Which azole antifungal is used for esophageal candidiasis in HIV patients (off-label) and mucormycosis?"
    back: "Isavuconazole is used off-label for esophageal candidiasis in HIV patients and is indicated for aspergillosis and mucormycosis.\n\nIsavuconazole (available as isavuconazonium sulfate prodrug) offers coverage for aspergillosis, mucormycosis, and esophageal candidiasis in HIV patients (off-label). It has a favorable safety profile compared to voriconazole, notably with fewer visual side effects and no QTc prolongation (actually shortens QTc — contraindicated in familial short QT syndrome)."
    difficulty: hard
    tags: [antifungals, isavuconazole, mucormycosis, aspergillosis]
  - front: "What is the mechanism of action of echinocandins (caspofungin, micafungin, anidulafungin)?"
    back: "Echinocandins inhibit 1,3-beta-D-glucan synthesis, disrupting the fungal cell wall (which mammals lack, reducing host toxicity).\n\nEchinocandins are fungicidal against Candida and fungistatic against Aspergillus. They are used for azole-resistant candidemia, refractory aspergillosis, and empiric antifungal therapy in febrile neutropenic patients. Their cell wall target (absent in mammals) contributes to their favorable safety profile."
    difficulty: easy
    tags: [antifungals, echinocandins, caspofungin, mechanism of action, glucan]
  - front: "What is the mechanism of action of terbinafine?"
    back: "Terbinafine (an allylamine) inhibits the enzyme squalene epoxidase, blocking ergosterol synthesis in fungal cells.\n\nUnlike azoles (which inhibit 14-alpha-demethylase), terbinafine inhibits squalene epoxidase at an earlier step of ergosterol synthesis. This leads to squalene accumulation (which is toxic to the fungus) and ergosterol deficiency. Terbinafine is primarily used for dermatophytoses and onychomycosis."
    difficulty: medium
    tags: [antifungals, terbinafine, allylamines, mechanism of action, dermatophytes]
  - front: "Which antifungal is contraindicated in pregnancy and patients with planned pregnancy, and also inhibits androgen/testosterone synthesis?"
    back: "Ketoconazole (Nizoral) — it inhibits fungal ergosterol synthesis and also decreases androgen and testosterone synthesis, and is contraindicated in pregnancy.\n\nKetoconazole uniquely inhibits steroidogenesis in addition to ergosterol synthesis, making it teratogenic and causing potential endocrine disruption. Due to hepatotoxicity and drug interactions, systemic ketoconazole use has been largely replaced by other azoles; topical forms remain in use for seborrheic dermatitis and dermatomycoses."
    difficulty: medium
    tags: [antifungals, ketoconazole, contraindications, pregnancy, androgen]
  - front: "What is the mechanism of action of nystatin and why is it not given IV?"
    back: "Nystatin (a polyene) inserts into fungal cell membranes causing altered membrane permeability and cell death — the same mechanism as amphotericin B. It is not given IV because it is highly toxic systemically.\n\nNystatin is not absorbed from the GI tract, making it useful for oral/mucocutaneous candidiasis when taken topically or orally. IV administration would cause severe systemic toxicity. It is primarily used for oropharyngeal, vaginal, and GI candidiasis."
    difficulty: easy
    tags: [antifungals, nystatin, polyene, candidiasis, toxicity]
  - front: "What is the mechanism of action of chloroquine in malaria?"
    back: "Chloroquine inhibits parasite heme polymerase, preventing the detoxification of heme (ferriprotoporphyrin IX) and leading to accumulation of toxic heme metabolites in the parasite.\n\nPlasmodium parasites digest hemoglobin, releasing toxic free heme. They normally polymerize heme into nontoxic hemozoin (malaria pigment). Chloroquine inhibits this polymerization. Resistance in P. falciparum and some P. vivax is widespread, limiting its utility in many endemic regions."
    difficulty: medium
    tags: [antiparasitics, chloroquine, malaria, mechanism of action]
  - front: "Why is primaquine contraindicated in G6PD deficiency?"
    back: "Primaquine causes oxidative stress in red blood cells; in G6PD-deficient individuals who cannot neutralize this oxidative stress, this leads to hemolytic anemia.\n\nG6PD (glucose-6-phosphate dehydrogenase) is needed for maintaining reduced glutathione, which protects RBCs from oxidative damage. Primaquine generates reactive oxygen species in erythrocytes. Before prescribing primaquine for P. vivax or P. ovale (hypnozoite eradication), G6PD testing is required — this is standard Canadian practice."
    difficulty: medium
    tags: [antiparasitics, primaquine, G6PD deficiency, hemolytic anemia, malaria]
  - front: "Which antimalarial drug targets the liver hypnozoite stage of P. vivax and P. ovale?"
    back: "Primaquine — it is the only drug that eradicates the dormant liver stages (hypnozoites) of P. vivax and P. ovale, preventing relapse.\n\nP. vivax and P. ovale form dormant liver hypnozoites that can reactivate months to years later. Chloroquine treats the blood-stage infection but not hypnozoites. Primaquine (or tafenoquine) is required for radical cure. Testing for G6PD deficiency is mandatory before use in Canada."
    difficulty: medium
    tags: [antiparasitics, primaquine, hypnozoites, P. vivax, P. ovale, malaria]
  - front: "What are the key features of 'Cinchonism' caused by quinine?"
    back: "Cinchonism is a toxidrome caused by quinine characterized by tinnitus, vertigo, visual disturbances, nausea/vomiting, diarrhea, and headache/fever.\n\nCinchonism reflects quinine/quinidine toxicity. Quinine is used for chloroquine-resistant Plasmodium falciparum malaria. Other serious adverse effects include hypoglycemia, prolonged QT, and hemolytic uremic syndrome. It is contraindicated in patients with a history of blackwater fever or thrombocytopenic purpura due to quinine."
    difficulty: medium
    tags: [antiparasitics, quinine, cinchonism, malaria, toxicity]
  - front: "What is the mechanism of action of atovaquone/proguanil (Malarone) for malaria treatment?"
    back: "Atovaquone inhibits mitochondrial electron transport; proguanil inhibits dihydrofolate reductase. Together they synergistically block parasite metabolism.\n\nAtovaquone/proguanil (Malarone) is used for treatment and prophylaxis of P. falciparum malaria, including chloroquine-resistant strains. It must be taken with food (fatty meal) to maximize absorption. Contraindicated in severe renal impairment."
    difficulty: medium
    tags: [antiparasitics, atovaquone, proguanil, Malarone, malaria, mechanism]
  - front: "Which antimalarial drug is available in Canada only via Health Canada's Special Access Program?"
    back: "Artemisinin derivatives (artemether, artesunate) — they are not licensed or marketed in Canada but are available via the Special Access Program for treatment of all Plasmodium species including severe malaria (IV artesunate).\n\nArtemisinins are the most potent and fast-acting antimalarials. They bind iron and generate free radicals that damage parasite proteins. IV artesunate is preferred over IV quinine for severe malaria in many international guidelines. In Canada, access requires the Special Access Program due to lack of domestic licensing."
    difficulty: medium
    tags: [antiparasitics, artesunate, artemisinin, severe malaria, Canada, Special Access Program]
  - front: "What is the mechanism of action and key side effect of mefloquine for malaria prophylaxis?"
    back: "Mefloquine's mechanism is not fully understood but it interferes with heme detoxification. Key side effects are neuropsychiatric: irritability, nightmares, psychoses, depression, and seizures.\n\nMefloquine (Lariam) is used for prophylaxis in chloroquine-resistant areas. It is contraindicated in patients with a history of seizures, psychosis, anxiety, depression, or other mental health diagnoses due to its neuropsychiatric side effects. The Black Box Warning cautions about potentially permanent neuropsychiatric effects."
    difficulty: medium
    tags: [antiparasitics, mefloquine, malaria prophylaxis, neuropsychiatric, adverse effects]
  - front: "What is the mechanism of action of praziquantel and which parasites does it treat?"
    back: "Praziquantel increases calcium permeability of helminth cell membranes, causing paralysis and detachment from tissues. It treats schistosomiasis, other flukes (trematodes), and tapeworms (cestodes).\n\nPraziquantel is the drug of choice for schistosomiasis and most tapeworm infections. Increased calcium influx causes tegumental damage, paralysis, and immune-mediated parasite death. Contraindicated in ocular cysticercosis (can worsen inflammation) and with strong CYP450 inducers."
    difficulty: medium
    tags: [antiparasitics, praziquantel, schistosomiasis, tapeworm, antihelminthic]
  - front: "What is the mechanism of action of albendazole and mebendazole?"
    back: "Both inhibit microtubule formation (tubulin polymerization) and glucose uptake in susceptible parasites, causing parasite death.\n\nBenzimidazoles (albendazole, mebendazole) bind to beta-tubulin and block microtubule polymerization, disrupting cell division and nutrient uptake. Albendazole has broader systemic absorption and is used for neurocysticercosis, echinococcosis, and hydatid disease. Both are contraindicated in pregnancy and in ocular/intraventricular cysticercosis."
    difficulty: easy
    tags: [antiparasitics, albendazole, mebendazole, benzimidazole, microtubule, antihelminthic]
  - front: "What is the treatment for strongyloidiasis and onchocerciasis?"
    back: "Ivermectin — it interferes with the polarization of nerve and muscle cells in susceptible parasites, causing paralysis.\n\nIvermectin acts on glutamate-gated chloride channels (unique to invertebrates), increasing membrane permeability and causing hyperpolarization, paralysis, and death. It is first-line for strongyloidiasis, onchocerciasis (river blindness), and scabies. Contraindicated in pregnancy and hypersensitivity."
    difficulty: easy
    tags: [antiparasitics, ivermectin, strongyloidiasis, onchocerciasis, scabies]
  - front: "What were the key results of the EPIC-HR trial (2022) regarding nirmatrelvir/ritonavir for COVID-19?"
    back: "Nirmatrelvir/ritonavir (Paxlovid) reduced COVID-19-related hospitalization or death by 89.1% (relative risk reduction) compared to placebo in high-risk, non-hospitalized adults with COVID-19.\n\nThe EPIC-HR trial (NEJM 2022) enrolled 2246 participants with confirmed SARS-CoV-2 infection. The primary outcome (COVID-19-related hospitalization or death by day 28) was reduced by 6.32% absolute risk reduction (p<0.0001). Treatment was given orally every 12 hours for 5 days (10 doses total). This established nirmatrelvir/ritonavir as a key early treatment option."
    difficulty: medium
    tags: [COVID-19, nirmatrelvir, ritonavir, Paxlovid, landmark trials, EPIC-HR]
  - front: "What did the RECOVERY trial demonstrate about dexamethasone in COVID-19?"
    back: "Dexamethasone (6 mg daily for up to 10 days) reduced 28-day mortality in patients requiring invasive mechanical ventilation (RR 0.64) or supplemental oxygen (RR 0.82), but NOT in patients not requiring respiratory support (where it may have been harmful, RR 1.19).\n\nThe RECOVERY trial (NEJM 2021) enrolled 6425 hospitalized COVID-19 patients. Dexamethasone benefit was restricted to those with hypoxic respiratory failure. In patients without respiratory support, dexamethasone showed a trend toward harm. This nuanced finding is critical: steroids should not be used in mild, non-hypoxic COVID-19."
    difficulty: medium
    tags: [COVID-19, dexamethasone, RECOVERY trial, steroids, mechanical ventilation, landmark trials]
  - front: "What did the PINETREE trial show about remdesivir in COVID-19?"
    back: "A 3-day IV course of remdesivir in non-hospitalized, high-risk COVID-19 patients reduced the risk of hospitalization or death by 87% compared to placebo (0.7% vs 5.3%).\n\nThe PINETREE trial (NEJM 2022) randomized 562 high-risk outpatients within 7 days of symptom onset to receive remdesivir (200 mg IV day 1, then 100 mg IV on days 2-3) or placebo. This established early outpatient IV remdesivir as an alternative to oral antivirals for high-risk COVID-19 patients."
    difficulty: medium
    tags: [COVID-19, remdesivir, PINETREE, landmark trials, outpatient]
  - front: "What did the PneumA trial establish about the duration of antibiotic therapy for ventilator-associated pneumonia (VAP)?"
    back: "8 days of antibiotic therapy was as effective as 15 days for VAP (comparable mortality and recurrence rates), with the benefit of more antibiotic-free days.\n\nThe PneumA trial (JAMA 2003) randomized 401 VAP patients to 8 vs 15 days of antibiotics. No significant difference in mortality (18.8% vs 17.2%) or recurrent infections (28.9% vs 26.0%). Importantly, non-fermenting gram-negative organisms (like Pseudomonas) had higher recurrence with 8-day therapy — suggesting some patient-specific considerations. Current VAP guidelines recommend 7-8 days of treatment."
    difficulty: hard
    tags: [VAP, pneumonia, antibiotic duration, PneumA, landmark trials, critical care]
  - front: "What did the Gans et al. 2002 trial demonstrate about dexamethasone in bacterial meningitis?"
    back: "Dexamethasone (10 mg IV every 6 hours for 4 days, given 15-20 minutes before or with the first antibiotic dose) significantly reduced unfavorable outcomes (RR 0.59) and mortality (RR 0.48) in adults with acute bacterial meningitis without increasing GI bleeding risk.\n\nThis landmark NEJM 2002 trial led to the standard practice of giving dexamethasone before or with the first dose of antibiotics in suspected bacterial meningitis. The benefit was most pronounced for S. pneumoniae meningitis. Dexamethasone reduces inflammation-mediated CNS injury during bacterial lysis."
    difficulty: medium
    tags: [bacterial meningitis, dexamethasone, steroids, landmark trials, Gans 2002]
  - front: "What did the POET trial demonstrate about oral antibiotic step-down therapy for infective endocarditis?"
    back: "Switching from IV to oral antibiotics in stable, left-sided infective endocarditis (after minimum 10 days of IV therapy) was noninferior to continuing IV therapy (composite outcome 9.0% oral vs 12.1% IV).\n\nThe POET trial (NEJM 2019) established oral step-down as a safe option in carefully selected IE patients who are stable, have left-sided infection, and have appropriate sensitivities for oral agents. The composite outcome included all-cause mortality, embolic events, unplanned cardiac surgery, and bacteremia relapse. This simplifies management and allows earlier discharge."
    difficulty: medium
    tags: [infective endocarditis, POET, oral antibiotics, step-down therapy, landmark trials]
  - front: "What did the STOPT trial establish about antibiotic duration for intraabdominal infection?"
    back: "A fixed 4-day course of antibiotics was as effective as a variable course (up to 10 days) for complicated intraabdominal infection with adequate source control (21.8% vs 22.3% adverse outcomes, P=0.92).\n\nThe STOPT trial (NEJM 2015) demonstrated that once adequate source control is achieved (surgical drainage, etc.), prolonged antibiotic courses do not improve outcomes. This aligns with antibiotic stewardship principles. The experimental group received antibiotics for 4±1 days vs up to 10 days in controls."
    difficulty: medium
    tags: [intraabdominal infection, antibiotic duration, STOPT, source control, landmark trials]
  - front: "What did the iPrEx trial establish about HIV pre-exposure prophylaxis (PrEP)?"
    back: "Daily oral FTC-TDF (emtricitabine/tenofovir disoproxil fumarate) reduced HIV acquisition by 44% in HIV-seronegative men and transgender women who have sex with men, compared to placebo.\n\nThe iPrEx trial (NEJM 2010) enrolled 2499 participants over a median 1.2-year follow-up. This trial established the foundation for PrEP as a prevention strategy. Real-world effectiveness is significantly higher (~99%) with perfect adherence. In Canada, PrEP is widely available and recommended for high-risk individuals."
    difficulty: medium
    tags: [HIV, PrEP, iPrEx, FTC-TDF, prevention, landmark trials]
  - front: "What did the Cohen et al. 2011 trial demonstrate about early ART initiation in serodiscordant couples?"
    back: "Early ART initiation (immediate vs delayed by CD4 decline) reduced HIV-1 transmission by 96% (hazard ratio 0.04) in serodiscordant couples, establishing Treatment as Prevention (TasP).\n\nThis landmark trial (NEJM 2011) enrolled 1763 serodiscordant couples. Of 28 linked transmissions, only 1 occurred in the early-therapy group. This established the concept of U=U (Undetectable = Untransmittable) and is foundational to current HIV treatment guidelines recommending immediate ART for all HIV-positive individuals."
    difficulty: medium
    tags: [HIV, treatment as prevention, TasP, early ART, serodiscordant, landmark trials, Cohen 2011]
  - front: "What did the CORTICUS trial find about hydrocortisone in septic shock?"
    back: "Hydrocortisone did not improve survival in septic shock patients, regardless of whether they responded to corticotropin stimulation testing.\n\nThe CORTICUS trial (NEJM 2008) randomized 499 patients with septic shock to hydrocortisone 50 mg IV q6h for 5 days (with taper) vs placebo. No significant mortality benefit was found in either corticotropin-responders or non-responders. Current surviving sepsis guidelines recommend hydrocortisone only for patients with refractory septic shock not responding to vasopressors."
    difficulty: hard
    tags: [septic shock, hydrocortisone, corticosteroids, CORTICUS, landmark trials]
  - front: "What did the OVIVA trial establish about oral vs IV antibiotics for bone and joint infections?"
    back: "Oral antibiotics were noninferior to IV antibiotics for complex orthopedic infections when used for 6 weeks (treatment failure difference -1.4%; 95% CI -5.6 to 2.9).\n\nThe OVIVA trial (NEJM 2019) randomized 1054 patients within 1 week post-surgery to 6 weeks of IV or oral antibiotics. No significant difference in serious adverse events. This supports early oral step-down therapy for osteomyelitis and prosthetic joint infections in appropriate patients, enabling earlier discharge and reduced IV-related complications."
    difficulty: medium
    tags: [osteomyelitis, bone and joint infection, oral antibiotics, OVIVA, landmark trials]
  - front: "What did the DATIPO trial find about antibiotic duration for prosthetic joint infection?"
    back: "12 weeks of antibiotics was superior to 6 weeks for prosthetic joint infection — the 6-week group had significantly higher rates of persistent infection (18.1% vs 9.4%).\n\nThe DATIPO trial (NEJM 2021) randomized 410 patients with microbiologically confirmed prosthetic joint infection to 6 vs 12 weeks of antibiotics. Unlike native bone and joint infections (OVIVA), prosthetic joint infections require longer treatment duration (12 weeks is standard). Shorter duration led to unacceptably higher failure rates."
    difficulty: hard
    tags: [prosthetic joint infection, antibiotic duration, DATIPO, landmark trials, orthopedics]
  - front: "What did the BENEFIT trial conclude about benznidazole for Chagas cardiomyopathy?"
    back: "Benznidazole reduced serum Trypanosoma cruzi PCR levels (66.2% vs 33.5% conversion to negative at end of treatment) but did NOT improve cardiac outcomes in patients with Chagas cardiomyopathy.\n\nThe BENEFIT trial (NEJM 2015) enrolled 2854 patients with Chagas cardiomyopathy randomized to benznidazole vs placebo for up to 80 days. While trypanocidal therapy reduced parasitemia, PCR conversion did not correlate with clinical outcomes. This suggests that by the time cardiomyopathy develops, cardiac damage may be immune-mediated and not reversible by antiparasitic treatment."
    difficulty: hard
    tags: [Chagas disease, benznidazole, BENEFIT, Trypanosoma cruzi, landmark trials]
  - front: "What is the significance of the RTS,S malaria vaccine trial combined with seasonal malaria chemoprevention (SMC)?"
    back: "Combining the RTS,S vaccine with seasonal malaria chemoprevention (sulfadoxine-pyrimethamine + amodiaquine) was markedly superior to either intervention alone, resulting in ~70% further reduction in malaria deaths and hospitalizations and ~60% reduction in uncomplicated malaria compared to SMC alone.\n\nThis NEJM 2021 trial enrolled 6861 children aged 5-17 months in areas with highly seasonal malaria. The combination approach showed synergistic benefit over either RTS,S alone or SMC alone. This has implications for malaria prevention programs in sub-Saharan Africa and underscores the value of combined pharmacological and vaccine strategies."
    difficulty: hard
    tags: [malaria, RTSS vaccine, SMC, seasonal malaria, prevention, landmark trials]
  - front: "A patient with severe septic shock is not responding to vasopressors. According to trial evidence, what is the role of corticosteroids?"
    back: "Hydrocortisone can be considered in patients with refractory septic shock not responding to adequate fluid resuscitation and vasopressors. However, the CORTICUS trial showed no mortality benefit from routine use — current guidelines reserve corticosteroids for vasopressor-refractory cases.\n\nThe CORTICUS trial (NEJM 2008) showed corticotropin stimulation testing is not needed to guide steroid use. The Surviving Sepsis Campaign guidelines recommend hydrocortisone (200 mg/day IV continuous infusion or 50 mg q6h) only in refractory septic shock. The ADRENAL and APROCCHSS trials (2018) provided additional evidence supporting corticosteroids in selected patients."
    difficulty: hard
    tags: [septic shock, corticosteroids, hydrocortisone, vasopressors, CORTICUS, sepsis management]
  - front: "Iodoquinol (Diodoquin) is used for which parasitic infections and what are its key contraindications?"
    back: "Iodoquinol treats intestinal amebiasis (E. histolytica), Dientamoeba fragilis, Balantidium coli, and Blastocystis hominis. Contraindicated in: iodine or 8-hydroxy-quinoline hypersensitivity, hepatic damage, optic neuropathy, and pregnancy.\n\nIodoquinol acts as a contact amebicide in the intestinal lumen by an uncertain mechanism. It treats luminal (not invasive) amebiasis. For invasive or extraintestinal amebiasis, metronidazole is the drug of choice, often followed by a luminal agent like iodoquinol or paromomycin. Neurological toxicity (headache, seizures) can occur with excessive doses."
    difficulty: medium
    tags: [antiparasitics, iodoquinol, amebiasis, E. histolytica, contraindications]
  - front: "What is diethylcarbamazine (DEC) used for and what is the Mazzotti reaction?"
    back: "DEC treats Wuchereria bancrofti (lymphatic filariasis) and Loa loa. The Mazzotti reaction is a severe systemic inflammatory reaction that occurs when DEC is given to patients coinfected with Onchocerca volvulus, due to rapid killing of microfilariae releasing inflammatory mediators.\n\nDEC immobilizes microfilariae and disrupts their surface membranes, enhancing killing by the host immune system. It is contraindicated in onchocerciasis due to the Mazzotti reaction (fever, urticaria, hypotension, and potentially fatal encephalitis from inflammatory destruction of dying microfilariae). Ivermectin is the drug of choice for onchocerciasis."
    difficulty: hard
    tags: [antiparasitics, diethylcarbamazine, DEC, filariasis, Mazzotti reaction, Loa loa]
  - front: "What is posaconazole (Posanol) used for and which drug interactions are most clinically important?"
    back: "Posaconazole is used for candidiasis, aspergillosis, and mucormycosis. Key interactions: contraindicated with cisapride, ergot alkaloids, sirolimus, and QT-prolonging agents (pimozide, quinidine); inhibits CYP3A4 — increases statin levels (atorvastatin, lovastatin, simvastatin).\n\nPosaconazole is a broad-spectrum triazole with activity against mucormycosis (one of few antifungals with this coverage). It is a potent CYP3A4 inhibitor, leading to clinically significant drug interactions. The HMG-CoA reductase inhibitor interaction is important — concurrent statin use requires dose reduction or avoidance to prevent myopathy/rhabdomyolysis."
    difficulty: hard
    tags: [antifungals, posaconazole, mucormycosis, drug interactions, CYP3A4]
  - front: "What is the incubation period for malaria caused by Plasmodium falciparum, and what are its severe complications?"
    back: "Incubation: 1–30 days. Severe P. falciparum complications: kidney failure, seizures, mental confusion, prostration, coma, death, respiratory failure.\n\nP. falciparum is the most dangerous Plasmodium species and must be identified promptly. Diagnosis is by thick and thin blood smear x3, rapid diagnostic test, antigen detection, or PCR. Severe disease is treated with IV artesunate."
    difficulty: medium
    tags: [malaria, travel medicine, infectious disease, parasitology, tropical medicine]
  - front: "A returned traveller from sub-Saharan Africa presents with fever, shaking chills, headache, anemia, and jaundice. What is the first-line diagnostic test and initial treatment for severe disease?"
    back: "Diagnosis: thick and thin blood smear x3 (confirm with rapid diagnostic test, antigen detection, or PCR). Treatment of severe malaria: IV artesunate + Malarone®, doxycycline, or clindamycin.\n\nMalaria must be excluded in any febrile returned traveller, especially from Africa. Blood smear is the gold standard. IV artesunate is preferred over quinine for severe falciparum malaria per current Canadian guidelines."
    difficulty: medium
    tags: [malaria, travel medicine, infectious disease, diagnosis, treatment]
  - front: "What are the classic clinical features of dengue fever, and what analgesic is contraindicated?"
    back: "Features: sudden fever, headache, retro-orbital pain, myalgias, arthralgias, leukopenia, thrombocytopenia, and rarely hemorrhagic manifestations. NSAIDs and ASA are contraindicated due to antiplatelet properties; use acetaminophen.\n\nDengue is spread by day-biting Aedes mosquitoes in Southeast Asia, Caribbean, and tropical regions. Incubation is 3 days to 2 weeks. Diagnosis is by anti-dengue IgM or PCR. NSAIDs increase bleeding risk given thrombocytopenia."
    difficulty: easy
    tags: [dengue, travel medicine, infectious disease, arboviruses]
  - front: "What is the incubation period of typhoid fever, what organism causes it, and what are the treatment options?"
    back: "Incubation: 3–60 days. Causative organism: Salmonella enterica serotype Typhi or Paratyphi. Treatment: quinolone (e.g., ciprofloxacin), ceftriaxone, or macrolide.\n\nTyphoid (enteric fever) presents with sustained fever 39–40°C, abdominal pain, headache, loss of appetite, cough, and constipation. Diagnosed by stool, urine, or blood culture. Most common on the Indian subcontinent."
    difficulty: medium
    tags: [typhoid, salmonella, travel medicine, infectious disease]
  - front: "What is the classic triad of tick typhus, and what is the treatment?"
    back: "Classic triad: fever, headache, spotted rash + eschar at site of tick bite. Treatment: doxycycline.\n\nTick typhus is caused by Rickettsia species and is common in the Mediterranean, South Africa, and India. Incubation is 1–2 weeks. Elevated liver enzymes and thrombocytopenia are also seen. Doxycycline is the treatment of choice for all Rickettsial infections."
    difficulty: easy
    tags: [rickettsia, tick typhus, travel medicine, infectious disease]
  - front: "What are the four major etiologic categories of classical Fever of Unknown Origin (FUO), and what temperature threshold defines FUO?"
    back: "Temperature ≥38.3°C/101°F on several occasions. Four categories: (1) Infectious (~30%), (2) Neoplastic (~20%), (3) Collagen vascular diseases (~30%), (4) Miscellaneous (~20%). Up to 30–50% remain undiagnosed.\n\nClassical FUO requires fever >3 weeks, diagnosis uncertain after 3 outpatient visits or 3 days in hospital or 1 week of intensive investigation. The most common infectious cause is extrapulmonary TB; most common neoplastic cause is lymphoma."
    difficulty: medium
    tags: [FUO, fever of unknown origin, infectious disease, differential diagnosis]
  - front: "What are the four types of Fever of Unknown Origin (FUO), and how does the definition differ for each?"
    back: "1) Classical FUO: >3 weeks, uncertain after 3 outpatient visits or 3 days in hospital. 2) Nosocomial FUO: hospitalized patient, not present on admission, uncertain after 3 days of investigation. 3) Neutropenic FUO: ANC <500/mL, uncertain after 3 days of investigation. 4) HIV-associated FUO: HIV-positive, >4 weeks outpatient or >3 days hospitalized, uncertain after 3 days of investigation.\n\nEach FUO category has distinct definitions and epidemiology. Nosocomial FUO commonly involves catheter infections, drugs, and emboli. Neutropenic FUO involves bacterial and fungal infections. HIV-associated FUO involves opportunistic infections."
    difficulty: hard
    tags: [FUO, fever of unknown origin, infectious disease, classification]
  - front: "What are the most common infectious causes of classical FUO?"
    back: "Extrapulmonary TB (most common single infectious cause), abscesses (subphrenic, liver, splenic, pancreatic, perinephric, diverticular, pelvic, psoas), osteomyelitis, culture-negative infective endocarditis, viral (CMV, EBV, HIV), bacterial (brucellosis, bartonellosis), fungal (histoplasmosis, cryptococcosis), parasitic (toxoplasmosis, leishmaniasis, amoebiasis, malaria).\n\nInfectious causes account for ~30% of classical FUO. Extrapulmonary TB is the single most common infectious cause. Culture-negative endocarditis is an important consideration requiring echocardiography."
    difficulty: hard
    tags: [FUO, fever of unknown origin, infectious disease, tuberculosis]
  - front: "What is the most common neoplastic cause of FUO, and what solid tumour most commonly causes FUO?"
    back: "Most common neoplastic causes overall: lymphomas (especially non-Hodgkin lymphoma) and leukemias. Most common solid tumour causing FUO: renal cell carcinoma.\n\nNeoplastic causes account for ~20% of classical FUO. Other solid tumours include breast, liver (HCC), colon, pancreas, and liver metastases. Multiple myeloma and myelodysplastic syndrome also cause FUO."
    difficulty: medium
    tags: [FUO, fever of unknown origin, oncology, renal cell carcinoma]
  - front: "What collagen vascular and miscellaneous conditions cause classical FUO?"
    back: "Collagen vascular (~30%): SLE, RA, rheumatic fever, vasculitis (temporal arteritis, polyarteritis nodosa), juvenile RA, Still disease. Miscellaneous (~20%): drugs (antimicrobials, antiarrhythmics), sarcoidosis, granulomatous hepatitis, IBD, hereditary periodic fever syndromes (e.g., familial Mediterranean fever), PE/DVT, thyroiditis, thyroid storm, adrenal insufficiency, pheochromocytoma.\n\nCollagen vascular diseases are a major and often overlooked cause of FUO, accounting for ~30%. Still disease (adult-onset juvenile RA) classically presents with quotidian fever, salmon rash, and arthritis. Drug fever is an important reversible cause."
    difficulty: hard
    tags: [FUO, fever of unknown origin, rheumatology, infectious disease]
  - front: "What types of infection are patients with defective cell-mediated immunity most vulnerable to?"
    back: "Latent viruses (e.g., CMV, EBV, VZV), fungi (e.g., Candida, Cryptococcus, Aspergillus, PCP), parasites, and non-tuberculous mycobacteria (NTM).\n\nCell-mediated immunity defects occur with HIV, Hodgkin lymphoma, hairy cell leukemia, cytotoxic drugs, SCID, and DiGeorge syndrome. These patients cannot control intracellular pathogens. Encapsulated bacteria are better handled by humoral immunity."
    difficulty: medium
    tags: [immunodeficiency, cell-mediated immunity, opportunistic infections, infectious disease]
  - front: "Which organisms are encapsulated bacteria that cause infection in patients with humoral immune defects (e.g., asplenia, splenectomy)?"
    back: "S. pneumoniae, H. influenzae, N. meningitidis, Salmonella enterica serotype Typhi, Group B Streptococcus (GBS).\n\nHumoral immunity defects (CLL, multiple myeloma, asplenia, splenectomy, sickle cell, nephrotic syndrome) predispose to encapsulated bacteria because these organisms evade phagocytosis without opsonizing antibodies. Vaccination against S. pneumoniae, H. influenzae, and N. meningitidis is critical in asplenic patients."
    difficulty: medium
    tags: [immunodeficiency, humoral immunity, asplenia, encapsulated bacteria, infectious disease]
  - front: "What organisms are neutrophil-deficient patients (e.g., chronic granulomatous disease) most vulnerable to?"
    back: "Catalase-producing organisms: Staphylococcus, Serratia, Nocardia, Aspergillus.\n\nNeutrophil dysfunction occurs with chemotherapy, myelodysplasia, CGD, C3/C5 deficiencies. Catalase-positive organisms break down H₂O₂, which is the main neutrophil killing mechanism in CGD patients. Aspergillus is a major threat in prolonged neutropenia."
    difficulty: medium
    tags: [immunodeficiency, neutropenia, chronic granulomatous disease, infectious disease]
  - front: "What is the definition of febrile neutropenia?"
    back: "Fever (≥38.3°C/101°F or ≥38.0°C/100.4°F for ≥1 hour) PLUS neutropenia: ANC <1.0 × 10⁹/L. Severe neutropenia is ANC <0.5 × 10⁹/L. ANC = WBC × (% neutrophils + % bands).\n\nFebrile neutropenia is the most common life-threatening complication of cancer therapy. Causative organisms are identified only 1/3 of the time. Gram-negative organisms (especially Pseudomonas) were historically most common; Gram-positive organisms are more common now."
    difficulty: easy
    tags: [febrile neutropenia, oncology, infectious disease, immunocompromised]
  - front: "What examination should NOT be performed in febrile neutropenia, and why?"
    back: "Digital rectal examination (DRE) should NOT be performed. The perianal region should be examined visually for perianal abscess, but instrumentation risks bacteremia in a patient with compromised mucosal integrity.\n\nIn febrile neutropenia, the perianal area and GI tract are common infection sites due to mucositis. DRE can introduce organisms into the bloodstream. Perianal abscesses can be serious and require careful visual inspection."
    difficulty: medium
    tags: [febrile neutropenia, oncology, infectious disease, clinical examination]
  - front: "When is prophylaxis with G-CSF or GM-CSF indicated in febrile neutropenia?"
    back: "Indicated when: (1) risk of febrile neutropenia ≥20%, or (2) febrile neutropenia has occurred in a previous chemotherapy cycle. G-CSF/GM-CSF decreases hospitalization but does NOT affect mortality.\n\nGranulocyte colony-stimulating factors (G-CSF, GM-CSF) stimulate myeloid proliferation and shorten neutropenic periods. They are used prophylactically, not to treat established febrile neutropenia."
    difficulty: medium
    tags: [febrile neutropenia, G-CSF, oncology, prophylaxis, infectious disease]
  - front: "What fungal infections are most common in prolonged neutropenia or concurrent antibiotic use?"
    back: "Candida and Aspergillus. Typhlitis (inflammation of the cecum) is a rare but serious bacterial complication.\n\nFungal superinfection occurs especially when neutropenia is prolonged or when broad-spectrum antibiotics disrupt normal flora. Aspergillus causes invasive pulmonary disease. Typhlitis can lead to serious infection and poor outcomes in febrile neutropenia."
    difficulty: medium
    tags: [febrile neutropenia, candida, aspergillus, oncology, infectious disease]
  - front: "What infections are most common in solid organ transplant recipients in the first month post-transplant versus after 1 month?"
    back: "< 1 month: donor-derived infections, bacterial wound/line/lung infections, herpetic stomatitis. > 1 month: viral (CMV, EBV, VZV), fungal (Aspergillus, Cryptococcus, P. jirovecii), protozoan (Toxoplasma), unusual bacterial/mycobacterial (TB, Nocardia, Listeria).\n\nThe timing of infection in transplant recipients reflects the degree and type of immunosuppression. CMV is the most important pathogen after 1 month and can present as direct disease or predispose to other infections. Prophylaxis is tailored accordingly."
    difficulty: hard
    tags: [transplant, immunocompromised, CMV, opportunistic infections, infectious disease]
  - front: "What is Immune Reconstitution Inflammatory Syndrome (IRIS), and what is the most common clinical setting?"
    back: "IRIS is a harmful inflammatory response directed against a previously acquired (often subclinical) infection following recovery of the immune system. Most cases occur in patients with advanced HIV starting antiretroviral therapy (ART), or immunosuppressed patients discontinuing immunosuppressive therapy.\n\nIRIS affects ~10% of HIV-positive patients starting ART. It represents paradoxical worsening of a treated/partially treated OI, or a new response to a previously unidentified OI. It is thought to be worse with rapid CD4 increase and lower pre-treatment CD4 count."
    difficulty: medium
    tags: [IRIS, immune reconstitution, HIV, antiretroviral therapy, infectious disease]
  - front: "What infections most commonly trigger IRIS, and how is IRIS managed?"
    back: "Common triggers: Mycobacteria (TB, MAC), Cryptococcus, Pneumocystis, Toxoplasma, HBV/HCV, herpes viruses (VZV, HSV, CMV), JC virus (PML), Molluscum contagiosum, COVID-19. Management: continue ARV for mild-moderate symptoms; consider stopping ARV if life-threatening; treat underlying infection; consider corticosteroids/NSAIDs for inflammation. IRIS is a diagnosis of exclusion.\n\nBefore diagnosing IRIS, rule out drug reactions, medication non-adherence, and drug resistance. Treatment initiation for some OIs (e.g., cryptococcal meningitis) should precede ART initiation to reduce IRIS risk."
    difficulty: hard
    tags: [IRIS, immune reconstitution, HIV, opportunistic infections, infectious disease]
  - front: "What is the mechanism of action of penicillins, and what are their major adverse effects?"
    back: "Mechanism: bactericidal; β-lactam binds penicillin-binding proteins (PBP) preventing cross-linking of peptidoglycan in the cell wall. Adverse effects: immediate (IgE-mediated) allergy — anaphylaxis, urticaria; late-onset (IgG) allergy — urticaria, rash, serum sickness; interstitial nephritis; dose-related seizures; diarrhea.\n\nPenicillins are the prototype β-lactam antibiotics. Cross-reactivity with cephalosporins occurs in ~10% of penicillin-allergic patients (type I hypersensitivity cross-reactivity is rare). Allergy history must be carefully characterized."
    difficulty: medium
    tags: [penicillin, antibiotics, pharmacology, beta-lactam, adverse effects]
  - front: "What is the spectrum of coverage of cloxacillin, and what is its primary indication?"
    back: "Coverage: methicillin-sensitive Staphylococcus aureus (MSSA) and streptococci. Primary indication: bacterial infections caused by staphylococci and streptococci, especially skin and soft-tissue infections.\n\nCloxacillin (isoxazolyl penicillin) is penicillinase-resistant, making it the first-line treatment for MSSA infections. It does NOT cover MRSA. For MRSA, vancomycin, daptomycin, or linezolid must be used."
    difficulty: easy
    tags: [cloxacillin, MSSA, antibiotics, staphylococcus, pharmacology]
  - front: "What is the advantage of amoxicillin-clavulanate over amoxicillin alone, and what is a major contraindication?"
    back: "Advantage: the β-lactamase inhibitor clavulanate prevents inactivation of amoxicillin by bacterial β-lactamases, extending coverage to β-lactamase-producing organisms including Staphylococcus, H. influenzae, Enterococcus, and anaerobes. Contraindication: history of amoxicillin-clavulanate–associated jaundice or hepatic dysfunction.\n\nAmoxicillin-clavulanate (Clavulin®/Augmentin®) is used for URTI, sinusitis, AOM, skin/soft-tissue infections, UTI, and intra-abdominal/pelvic infections. Cholestatic jaundice is an idiosyncratic reaction more common in older males and those on prolonged therapy."
    difficulty: medium
    tags: [amoxicillin-clavulanate, beta-lactamase inhibitor, antibiotics, pharmacology]
  - front: "What is the coverage spectrum and clinical use of ceftriaxone (3rd-generation cephalosporin)?"
    back: "Coverage: broad Gram-negative (including Enterobacteriaceae), Streptococcus pneumoniae, limited Staphylococcus aureus (MSSA), NO MRSA, NO Pseudomonas (except ceftazidime), NO Enterococcus. Uses: community-acquired pneumonia, gonorrhea, bacterial meningitis, abdominal/pelvic infections (with metronidazole), convenient once-daily outpatient IV therapy.\n\nThird-generation cephalosporins have enhanced Gram-negative coverage compared to first/second generation. Ceftriaxone's long half-life (8 hours) allows once-daily dosing. It is the drug of choice for gonorrhea and community-acquired bacterial meningitis."
    difficulty: medium
    tags: [ceftriaxone, cephalosporin, antibiotics, pharmacology, pneumonia]
  - front: "Which cephalosporins cover MRSA, and what is their generation?"
    back: "5th-generation cephalosporins: ceftobiprole (Zevtera®) and ceftaroline (Teflaro™). Both cover MRSA. Ceftaroline is available in Canada through the Special Access Program. Note: ceftobiprole does NOT cover Pseudomonas; ceftaroline does not either.\n\nFifth-generation cephalosporins have expanded Gram-positive activity including MRSA, while maintaining broad Gram-negative coverage. They are used for acute bacterial skin and skin structure infections and community-acquired pneumonia."
    difficulty: hard
    tags: [MRSA, cephalosporin, 5th generation, antibiotics, pharmacology]
  - front: "What is the major toxicity of aminoglycosides, and which toxicity is the most important clinically?"
    back: "Toxicities: nephrotoxicity (reversible), vestibular toxicity (irreversible), ototoxicity (irreversible). Most important: vestibular toxicity (irreversible). Contraindicated in patients with pre-existing hearing loss or renal dysfunction.\n\nAminoglycosides (gentamicin, tobramycin, amikacin) inhibit the 30S ribosomal subunit. They are used for Gram-negative infections (including Pseudomonas) and as low-dose synergy with β-lactams/vancomycin for enterococcal endocarditis. Drug levels and renal function must be monitored."
    difficulty: medium
    tags: [aminoglycosides, gentamicin, nephrotoxicity, ototoxicity, pharmacology]
  - front: "What is the spectrum of vancomycin, its mechanism, and its major adverse effects?"
    back: "Coverage: Gram-positive organisms including MRSA; NOT VRE. Oral vancomycin covers C. difficile (GI only, not systemic). Mechanism: glycopeptide sterically inhibits cell wall synthesis. Adverse effects: Red Man syndrome (infusion-related, not true allergy), nephrotoxicity, ototoxicity, thrombocytopenia.\n\nVancomycin is the cornerstone of MRSA treatment. Red Man syndrome is an infusion reaction (flushing, erythema, hypotension) prevented by slowing infusion rate. It is NOT an IgE-mediated allergy. Oral vancomycin is non-absorbable and used only for severe C. difficile infection."
    difficulty: medium
    tags: [vancomycin, MRSA, glycopeptide, Red Man syndrome, pharmacology]
  - front: "Why is daptomycin NOT used to treat MRSA pneumonia?"
    back: "Daptomycin is inactivated by pulmonary surfactant, making it ineffective for pulmonary infections. It should not be used for MRSA pneumonia.\n\nDaptomycin (a lipopeptide) binds to the cell wall forming channels leading to intracellular K⁺ depletion. It is effective for bacteremia, endocarditis, and skin/soft-tissue infections caused by MRSA and VRE, but pulmonary surfactant deactivates it in the lungs."
    difficulty: hard
    tags: [daptomycin, MRSA, pneumonia, pharmacology, antibiotics]
  - front: "What are the major adverse effects of fluoroquinolones, and which populations should avoid them?"
    back: "Adverse effects: headache, dizziness, allergy, seizures, prolonged QT, dysglycemia (levofloxacin/moxifloxacin), tendonitis, tendon rupture. Avoid in: pregnancy, lactation, children under 18 years, and patients on other QT-prolonging medications.\n\nFluoroquinolones inhibit DNA gyrase (topoisomerase II). Respiratory quinolones (levofloxacin, moxifloxacin) cover S. pneumoniae, making them useful for CAP. Tendon rupture risk is highest in the elderly and those on corticosteroids. Dysglycemia can cause both hypoglycemia and hyperglycemia."
    difficulty: medium
    tags: [fluoroquinolones, ciprofloxacin, levofloxacin, adverse effects, pharmacology]
  - front: "What is the mechanism of action of metronidazole, and what is the disulfiram-like reaction?"
    back: "Mechanism: forms toxic metabolites in bacterial cells that damage microbial DNA. Disulfiram-like reaction: co-ingestion with alcohol causes flushing, nausea, vomiting, tachycardia. Alcohol must be avoided during treatment and for 3 days after completion.\n\nMetronidazole (Flagyl®) covers anaerobes and protozoa (Trichomonas, Giardia, Entamoeba). It is first-line for bacterial vaginosis, Trichomonas, C. difficile (now less preferred than vancomycin/fidaxomicin for severe disease), and intra-abdominal infections with anaerobes."
    difficulty: medium
    tags: [metronidazole, anaerobes, disulfiram reaction, pharmacology, antibiotics]
  - front: "What organisms does TMP-SMX cover, and what are its major adverse effects and contraindications?"
    back: "Coverage: GP (S. aureus including most MRSA), GN enteric bacteria, Nocardia, Pneumocystis jirovecii, Toxoplasma. Adverse effects: hepatitis, Stevens-Johnson syndrome, bone marrow suppression, hyperkalemia, drug interactions (increases free warfarin, glyburide). Contraindications: sulfa allergy, infants <4 weeks, hepatic/renal dysfunction, pregnancy/lactation.\n\nTMP-SMX (Septra®/Bactrim®) inhibits the folic acid pathway: SMX competes with PABA and TMP inhibits DHFR. It is used for UTI, RTI, skin/soft-tissue infections (MRSA), and prophylaxis/treatment of PCP in immunocompromised patients."
    difficulty: medium
    tags: [TMP-SMX, trimethoprim, sulfamethoxazole, MRSA, PCP, pharmacology]
  - front: "Why is nitrofurantoin NOT appropriate for pyelonephritis or bacteremia?"
    back: "Nitrofurantoin achieves adequate concentrations only in the urine (lower urinary tract) and does not achieve therapeutic levels in renal tissue, blood, or systemic tissues. It is indicated only for lower UTI. It is contraindicated with significant renal impairment (reduced urinary concentration and risk of peripheral neuropathy).\n\nNitrofurantoin (MacroBID®) inhibits bacterial ribosomal protein synthesis via reactive metabolites. It covers Enterococcus, S. saprophyticus, and GN coliforms. It must not be used in oliguria, anuria, or renal impairment, during labor, or in infants <1 month."
    difficulty: medium
    tags: [nitrofurantoin, UTI, pyelonephritis, pharmacology, antibiotics]
  - front: "What are the four drugs in the standard RIPE regimen for active tuberculosis, and what are the key adverse effects of each?"
    back: "RIPE: Rifampin (hepatotoxicity, P450 induction, orange secretions), Isoniazid/INH (hepatotoxicity, peripheral neuropathy, drug-induced SLE), Pyrazinamide/PZA (hepatotoxicity, gout, GI), Ethambutol (optic neuropathy — loss of central and colour vision).\n\nAll four drugs inhibit mycobacterial pathways. Vitamin B6 (pyridoxine) is given with INH to prevent peripheral neuropathy. Rifampin is a potent P450 inducer causing multiple drug interactions. Ethambutol toxicity requires monitoring visual acuity and colour vision."
    difficulty: medium
    tags: [tuberculosis, RIPE, isoniazid, rifampin, ethambutol, pyrazinamide, pharmacology]
  - front: "What is unique about the mechanism of isoniazid and ethambutol compared to other antibiotics?"
    back: "Both inhibit mycolic acid synthesis, a component unique to the mycobacterial cell wall. This makes them specific to mycobacteria and inactive against other bacteria.\n\nMycolic acids are long-chain fatty acids essential for the mycobacterial cell wall. INH inhibits InhA (enoyl-ACP reductase) in the mycolic acid synthesis pathway. Ethambutol inhibits arabinosyltransferase. This specificity explains why they are reserved for TB/NTM treatment."
    difficulty: hard
    tags: [isoniazid, ethambutol, tuberculosis, mycolic acid, pharmacology]
  - front: "What are the key adverse effects of linezolid, and what important drug interaction must be avoided?"
    back: "Adverse effects with prolonged use: myelosuppression, optic neuropathy, peripheral neuropathy. Drug interaction: linezolid acts as an MAO inhibitor and causes hypertension; concurrent use with or within 2 weeks of MAO inhibitors is contraindicated. Also avoid serotonergic drugs (serotonin syndrome risk).\n\nLinezolid (Zyvoxam®) binds to the 50S ribosome and prevents formation of the functional 70S initiation complex. It covers VRE and MRSA, making it useful when vancomycin cannot be used. CBC monitoring is required with prolonged use due to myelosuppression."
    difficulty: hard
    tags: [linezolid, VRE, MRSA, MAO inhibitor, pharmacology]
  - front: "What is the coverage of clindamycin, and what is its most serious adverse effect?"
    back: "Coverage: Gram-positive (except Enterococcus), most community-acquired MRSA, anaerobes. Most serious adverse effect: pseudomembranous colitis (C. difficile infection). Also causes GI upset.\n\nClindamycin (Dalacin®) inhibits peptide bond formation at the 50S ribosome. It is used for skin/skin-structure infections, oropharyngeal infections, and in combination with Gram-negative coverage for intra-abdominal/pelvic infections. C. difficile risk is higher than with many other antibiotics."
    difficulty: medium
    tags: [clindamycin, C. difficile, anaerobes, MRSA, pharmacology]
  - front: "What are the reasons for using combination antibiotic therapy?"
    back: "1) Polymicrobial infection requiring broad coverage. 2) Empiric therapy pending culture results. 3) Synergy for difficult-to-treat pathogens (e.g., Enterococcus spp. causing endocarditis). 4) To prevent emergence of resistance.\n\nCombination therapy is not routinely indicated but has specific applications. Enterococcal endocarditis requires synergistic therapy (e.g., ampicillin + gentamicin). TB therapy uses multiple agents to prevent resistance. De-escalation to monotherapy based on cultures reduces toxicity and resistance."
    difficulty: medium
    tags: [combination therapy, antibiotics, pharmacology, endocarditis, resistance]
  - front: "What antibiotic classes are bactericidal vs. bacteriostatic? (Use the mnemonics 'Very Finely Proficient At Cell MurDer' and 'ECSTaTiC')"
    back: "Bactericidal ('Very Finely Proficient At Cell MurDer'): Vancomycin, Fluoroquinolones, Penicillins, Aminoglycosides, Cephalosporins, Metronidazole, Daptomycin. Bacteriostatic ('ECSTaTiC'): Erythromycin (macrolides), Clindamycin, Sulfonamides, Trimethoprim, Tetracyclines, Chloramphenicol.\n\nBactericidal agents kill bacteria; bacteriostatic agents inhibit growth and rely on host immunity to clear infection. In immunocompromised patients and endocarditis, bactericidal agents are generally preferred. This distinction is clinically important for serious infections."
    difficulty: medium
    tags: [bactericidal, bacteriostatic, antibiotics, pharmacology, mnemonics]
  - front: "What are the antiviral drugs used for herpes simplex and varicella-zoster infections, and what is the IV adverse effect of acyclovir?"
    back: "Drugs: acyclovir (IV/PO), valacyclovir (prodrug of acyclovir, PO), famciclovir (PO). Mechanism: guanosine analogue inhibiting viral DNA polymerase. IV acyclovir adverse effect: nephrotoxicity and CNS toxicity. PO forms are well-tolerated.\n\nAcyclovir is activated by viral thymidine kinase (selective for infected cells). Valacyclovir has better oral bioavailability. IV acyclovir nephrotoxicity is prevented by adequate hydration. Famciclovir is an alternative with similar efficacy."
    difficulty: easy
    tags: [acyclovir, valacyclovir, herpes, antivirals, pharmacology]
  - front: "What is the treatment for CMV infection, and what is the main hematologic toxicity of ganciclovir?"
    back: "Treatment: ganciclovir (IV) or valganciclovir (PO prodrug). Mechanism: guanosine analogue inhibiting viral DNA polymerase. Main hematologic toxicity: neutropenia, thrombocytopenia, anemia.\n\nGanciclovir/valganciclovir is first-line for CMV disease (retinitis, esophagitis, colitis, pneumonitis, especially in transplant and HIV patients). It also covers HSV-1/2, VZV, HHV-6, and EBV. Foscarnet is used for ganciclovir-resistant CMV."
    difficulty: medium
    tags: [CMV, ganciclovir, valganciclovir, antivirals, pharmacology]
  - front: "What is the mechanism of neuraminidase inhibitors (oseltamivir, zanamivir), and what is the key adverse effect of zanamivir?"
    back: "Mechanism: inhibit neuraminidase, an enzyme required for release of influenza virus from infected cells, preventing viral aggregation and spread. Both treat and prevent Influenza A and B. Key adverse effect of zanamivir: bronchospasm (inhaled formulation; avoid in asthma/COPD).\n\nOseltamivir (Tamiflu®) is the most commonly used neuraminidase inhibitor. It should be started within 48 hours of symptom onset for best effect. Zanamivir (Relenza®) is inhaled and not appropriate for patients with reactive airway disease."
    difficulty: medium
    tags: [neuraminidase inhibitors, oseltamivir, zanamivir, influenza, antivirals]
  - front: "What is nirmatrelvir/ritonavir (Paxlovid®), and what is an important drug interaction concern?"
    back: "Nirmatrelvir/ritonavir (Paxlovid®) is used for COVID-19 infection within 5 days of symptom onset. Nirmatrelvir inhibits SARS-CoV-2 protease; ritonavir is a CYP3A inhibitor boosting nirmatrelvir concentrations. Key interaction: contraindicated with highly CYP3A-dependent substrates (e.g., certain statins, antiarrhythmics) and potent CYP3A inducers (e.g., rifampin).\n\nRitonavir is a potent CYP3A4 inhibitor that increases nirmatrelvir levels. This creates significant drug interactions requiring medication review before prescribing. Side effects include hypertension, diarrhea, dysgeusia, and myalgia."
    difficulty: hard
    tags: [Paxlovid, nirmatrelvir, COVID-19, antivirals, drug interactions, CYP3A]
  - front: "What are the first-line antibiotics for Pseudomonas aeruginosa infections?"
    back: "First-line options: ciprofloxacin, gentamicin, tobramycin, amikacin, piperacillin/tazobactam, ceftazidime, cefepime, imipenem, meropenem. NOT ertapenem (no Pseudomonas coverage).\n\nPseudomonas aeruginosa is an intrinsically resistant Gram-negative rod. Combination therapy is often used for severe infections. Ertapenem is a carbapenem that lacks Pseudomonas coverage, which is a critical distinction on exams."
    difficulty: medium
    tags: [Pseudomonas, antibiotics, pharmacology, Gram-negative, infectious disease]
  - front: "What antibiotics cover VRE (vancomycin-resistant Enterococcus)?"
    back: "For VRE: linezolid, daptomycin, tigecycline. Nitrofurantoin can be used for lower UTI caused by VRE. Vancomycin does NOT cover VRE.\n\nVRE is a significant nosocomial pathogen in immunocompromised patients. Linezolid and daptomycin are the main systemic agents. Tigecycline has broad activity including VRE. Infection control measures are critical to prevent VRE spread."
    difficulty: medium
    tags: [VRE, linezolid, daptomycin, vancomycin resistance, antibiotics]
  - front: "What antibiotics cover anaerobic infections, and which is the drug of choice for intra-abdominal anaerobic infections?"
    back: "Anaerobic coverage: metronidazole, clindamycin, amoxicillin-clavulanate, cefoxitin, piperacillin/tazobactam, carbapenems (imipenem, meropenem, ertapenem), moxifloxacin. Drug of choice for intra-abdominal anaerobes: metronidazole (often combined with a Gram-negative agent).\n\nAnaerobes are important in intra-abdominal, pelvic, and polymicrobial infections. B. fragilis is the most common anaerobic pathogen in bowel flora and is resistant to penicillin alone. Metronidazole has excellent anaerobic activity and CNS penetration (useful for brain abscesses)."
    difficulty: medium
    tags: [anaerobes, metronidazole, B. fragilis, antibiotics, pharmacology]
  - front: "What is the coverage of carbapenems, and which carbapenem does NOT cover Pseudomonas or Enterococcus?"
    back: "Carbapenems cover most Gram-positive (except MRSA), Gram-negative (including ESBL-producing organisms), and anaerobes. Ertapenem is the only carbapenem that does NOT cover Pseudomonas aeruginosa or Enterococcus.\n\nCarbapenems (imipenem, meropenem, ertapenem) are broad-spectrum β-lactams used for ESBL-producing Enterobacteriaceae. Imipenem can lower the seizure threshold. Ertapenem's once-daily dosing is convenient for outpatient IV therapy but its narrower spectrum is a critical distinction."
    difficulty: hard
    tags: [carbapenems, ertapenem, Pseudomonas, ESBL, pharmacology, antibiotics]
  - front: "What are the adverse effects and key drug interaction of rifampin?"
    back: "Adverse effects: hepatic dysfunction, orange tears/saliva/urine (harmless), P450 enzyme induction (major drug interaction reducing efficacy of many drugs). Key rule: NEVER use rifampin as monotherapy (except prophylaxis) due to rapid resistance development.\n\nRifampin inhibits bacterial RNA polymerase. As a potent CYP450 inducer, it significantly reduces concentrations of drugs including warfarin, oral contraceptives, antiretrovirals, and immunosuppressants. It is always used in combination for active TB."
    difficulty: medium
    tags: [rifampin, tuberculosis, CYP450, drug interaction, pharmacology]
  - front: "What is the treatment for latent tuberculosis in Canada?"
    back: "Options for latent TB treatment: isoniazid (INH) alone (9 months), or rifampin alone (4 months), or combined INH + rifapentine regimens. INH alone is most common. Vitamin B6 (pyridoxine) is given with INH to prevent peripheral neuropathy.\n\nLatent TB treatment reduces the risk of reactivation disease. Rifampin for 4 months has comparable efficacy to INH for 9 months with better tolerability. Baseline and monitoring liver function tests are recommended, especially with INH."
    difficulty: medium
    tags: [tuberculosis, latent TB, isoniazid, rifampin, pharmacology, Canadian guidelines]
  - front: "What antiviral agents are used for chronic hepatitis B, and what is the role of pegylated interferon?"
    back: "Antivirals for chronic hepatitis B: tenofovir (first-line), entecavir (first-line), lamivudine (less commonly used due to resistance). Pegylated interferon α-2a or α-2b: inhibits viral protein synthesis; used less commonly now; adverse effects include flu-like syndrome, depression, bone marrow suppression.\n\nTenofovir and entecavir have high genetic barriers to resistance and are preferred. Entecavir is contraindicated as monotherapy in HIV co-infection (risk of HIV resistance). Lamivudine has high resistance rates with long-term use."
    difficulty: medium
    tags: [hepatitis B, tenofovir, entecavir, antivirals, pharmacology]
  - front: "What is the treatment regimen for chronic hepatitis C, and what are the key drug interactions with glecaprevir/pibrentasvir?"
    back: "Hepatitis C treatment: direct-acting antivirals. Glecaprevir/pibrentasvir (Maviret®): NS3/4A protease inhibitor + NS5A inhibitor. Sofosbuvir/velpatasvir (Epclusa®): NS5B polymerase inhibitor + NS5A inhibitor. Contraindications for glecaprevir/pibrentasvir: moderate/severe hepatic impairment, co-administration with atazanavir, rifampin, atorvastatin, dabigatran, ethinyl estradiol, or simvastatin.\n\nModern HCV regimens achieve >95% sustained virologic response (cure). Treatment duration is 8–12 weeks depending on genotype and prior treatment. Ribavirin is rarely needed with current DAA regimens. Drug interactions are a key clinical concern."
    difficulty: hard
    tags: [hepatitis C, direct-acting antivirals, glecaprevir, sofosbuvir, pharmacology]
  - front: "What is the mechanism and indication of remdesivir for COVID-19?"
    back: "Mechanism: adenosine triphosphate analogue that inhibits SARS-CoV-2 RNA-dependent RNA polymerase, blocking viral RNA synthesis. Indication: hospitalized COVID-19 patients. Adverse effects: bradycardia, hypotension, increased ALT/AST, hypersensitivity reactions (anaphylaxis, angioedema), skin rash, GI effects, prolonged prothrombin time, seizure.\n\nRemdesivir was the first antiviral approved for COVID-19 in Canada. It is given IV for 5 days in hospitalized patients. Its benefit is most pronounced when started early in the disease course. It is not used in outpatient settings."
    difficulty: medium
    tags: [remdesivir, COVID-19, antivirals, pharmacology, SARS-CoV-2]
  - front: "What are the major toxicities of dapsone, and in which patient population is it contraindicated?"
    back: "Toxicities: rash, drug fever, agranulocytosis, methemoglobinemia. Contraindicated in: G6PD deficiency (causes hemolytic anemia). Dapsone is used for leprosy (M. leprae), PCP prophylaxis and treatment (with TMP), and toxoplasmosis prophylaxis (with pyrimethamine).\n\nDapsone (a sulfone) inhibits folic acid synthesis by competing with PABA, similar to sulfonamides. G6PD testing should be performed before initiating dapsone. It is an alternative to TMP-SMX for PCP prophylaxis in patients with sulfa allergy."
    difficulty: medium
    tags: [dapsone, G6PD, leprosy, PCP, pharmacology]
  - front: "What tetracyclines are contraindicated in children under 12 years and in pregnancy, and why?"
    back: "All tetracyclines (tetracycline, doxycycline, minocycline) are contraindicated in children under 12 years and in pregnancy/lactation. Reason: yellow teeth staining and stunted bone growth in children; teratogenic effects in pregnancy.\n\nTetracyclines chelate calcium in developing teeth and bone, causing permanent discolouration and growth retardation. They are also hepatotoxic in pregnancy, especially at high doses. Doxycycline is used for malaria prophylaxis, Rickettsial infections, PID (step-down), Chlamydia, Lyme disease, and acne."
    difficulty: easy
    tags: [tetracyclines, doxycycline, contraindications, pharmacology, pediatrics]
  - front: "What are the 'respiratory fluoroquinolones,' and why are they preferred over ciprofloxacin for community-acquired pneumonia (CAP)?"
    back: "Respiratory fluoroquinolones: levofloxacin and moxifloxacin. They cover S. pneumoniae (unlike ciprofloxacin) and atypicals (Legionella, Mycoplasma, Chlamydophila). Moxifloxacin also has additional anaerobic coverage. Ciprofloxacin has poor pneumococcal coverage and should NOT be used for CAP unless a susceptible organism is isolated.\n\nThe distinction between ciprofloxacin and respiratory fluoroquinolones is a common exam topic. Ciprofloxacin has excellent Gram-negative and Pseudomonas coverage but inadequate pneumococcal coverage. Levofloxacin and moxifloxacin are appropriate for CAP monotherapy."
    difficulty: medium
    tags: [fluoroquinolones, levofloxacin, moxifloxacin, community-acquired pneumonia, pharmacology]
  - front: "What are the chloramphenicol adverse effects that limit its use, and when is it still indicated?"
    back: "Adverse effects: aplastic anemia (rare, idiosyncratic, irreversible), Grey Baby syndrome (neonates — cardiovascular collapse due to immature glucuronyl transferase). Indications: serious infections by susceptible organisms when suitable alternatives are not available, including meningococcal disease in patients with anaphylaxis to β-lactams.\n\nChloramphenicol inhibits peptidyl transferase at the 50S ribosome. Despite broad coverage (GP, GN, anaerobes), its toxicity profile limits use to last-resort situations. Grey Baby syndrome occurs because neonates cannot conjugate chloramphenicol, leading to toxic accumulation."
    difficulty: hard
    tags: [chloramphenicol, aplastic anemia, Grey Baby syndrome, pharmacology, antibiotics]
