# Plastic Surgery Burns (Surgery) - generated from srs-mccqe1
cards:
  - front: "What is the Parkland formula for burn resuscitation and how is fluid administered?"
    back: "4 cc × body mass (kg) × % TBSA burned with Lactated Ringer's. Give 1/2 of total in first 8 hours from time of injury, and 1/2 of total in the next 16 hours. Hours 24–48: 0.35–0.5 cc plasma × mass (kg) × % TBSA. After hour 30: D5W at rate to maintain normal serum sodium.\n\nThe Parkland formula guides early resuscitation in burn patients. Time is counted from the time of injury, not presentation. Under-resuscitation leads to organ failure, but over-resuscitation worsens edema and pulmonary complications."
    difficulty: easy
    tags: [burns, fluid resuscitation, Parkland formula, TBSA, plastic surgery]
  - front: "What is the target urine output in adult and pediatric burn patients during resuscitation?"
    back: "Adults: >0.5 cc/kg/h. Children <12 years: 1.0 cc/kg/h. Urine output is the best measure to monitor resuscitation adequacy.\n\nUrine output reflects end-organ perfusion and adequacy of fluid resuscitation. Other targets include maintaining a clear sensorium, HR <120/min, and MAP >70 mmHg."
    difficulty: easy
    tags: [burns, fluid resuscitation, urine output, monitoring]
  - front: "Which burn patients require EXTRA fluid beyond the standard Parkland formula?"
    back: "Burns >80% TBSA, full thickness burns, associated traumatic injury, electrical burns, inhalation injury, delayed start of resuscitation, and pediatric burns.\n\nThese conditions increase capillary leak, metabolic demand, or insensible losses beyond what the standard formula accounts for. Failure to administer adequate fluid leads to burn shock and end-organ failure."
    difficulty: easy
    tags: [burns, fluid resuscitation, special populations]
  - front: "At what intracompartmental pressure is escharotomy or fasciotomy indicated in burn patients?"
    back: ">30 mmHg. However, compartment syndrome may also occur at <30 mmHg in the presence of fracture/crush injury or low systemic perfusion pressures. The delta between compartment pressure and diastolic blood pressure is important — a smaller delta indicates higher risk of tissue ischemia.\n\nCompartment syndrome can occur in both injured and uninjured limbs due to massive fluid resuscitation. Clinical assessment and the perfusion pressure differential are as important as absolute pressure values."
    difficulty: medium
    tags: [burns, compartment syndrome, escharotomy, fasciotomy]
  - front: "What are the indications for tetanus prophylaxis in burn patients?"
    back: "All patients with burns >10% TBSA or deeper than superficial-partial thickness require 0.5 cc tetanus toxoid. Tetanus immunoglobulin (250 U) is also given if prior immunization is absent/unclear or last booster was >10 years ago.\n\nBurns create an anaerobic environment conducive to Clostridium tetani. Tetanus prophylaxis is a standard part of burn care for significant injuries."
    difficulty: easy
    tags: [burns, tetanus prophylaxis, prevention]
  - front: "What are the 3 major respiratory problems in burn patients?"
    back: "1. Burn eschar encircling the chest (requires escharotomy to relieve constriction). 2. CO poisoning (treat with 100% O2 by facemask — decreases carboxyhemoglobin half-life from 210 to 59 min — until carboxyhemoglobin <10%). 3. Smoke inhalation causing pulmonary injury (chemical injury to alveolar basement membrane → pulmonary edema).\n\nEach mechanism requires a different approach. Eschar requires physical release, CO requires high-flow O2, and smoke inhalation requires monitoring for delayed pulmonary insufficiency (up to 48 hr) and edema (48–72 hr)."
    difficulty: easy
    tags: [burns, inhalation injury, CO poisoning, respiratory]
  - front: "What are the clinical indicators of inhalation injury?"
    back: "Injury in a closed space, singed nasal hair/eyebrows, soot around nares/oral cavity, hoarseness, conjunctivitis, tachypnea, carbon particles in sputum, elevated blood CO levels (brighter red coloration).\n\nSuspected inhalation injury requires immediate intubation due to impending airway swelling and obstruction. Neither CXR nor ABG can rule out inhalation injury — direct bronchoscopy is used for diagnosis."
    difficulty: easy
    tags: [burns, inhalation injury, airway management]
  - front: "How does burn depth affect healing? Summarize by degree."
    back: "First degree (superficial): no scarring, complete healing. Second degree superficial partial: re-epithelialized in 7–14 days, residual discolouration, hypertrophic scarring uncommon. Deep second degree (deep partial): re-epithelialized 14–35 days, hypertrophic scarring frequent, grafting recommended. Third degree (full thickness): re-epithelialized from wound edge, grafting/flap necessary. Fourth degree: often requires amputation; flap coverage needed, cannot graft.\n\nHealing time and need for surgical intervention directly correlate with depth of burn. Early excision and grafting are standard of care for deep and full thickness burns."
    difficulty: easy
    tags: [burns, wound healing, burn depth, grafting]
  - front: "What are the most common organisms infecting burn wounds, and in what temporal sequence do they appear?"
    back: "Most common: S. aureus, P. aeruginosa, and C. albicans. Temporal sequence: Days 1–3 (rare): Gram-positive organisms. Days 3–5: Gram-negative organisms (Proteus, Klebsiella).\n\nInfection is a significant complication and major cause of death in burn patients. Keeping bacterial count <10^5 bacteria/g of tissue is critical, as blood cultures may be negative even with wound infection."
    difficulty: medium
    tags: [burns, infection, microbiology, sepsis]
  - front: "Compare the four main topical antimicrobials used in burn wound management."
    back: "Silver nitrate (0.5%): no pain, minimal penetration, may cause methemoglobinemia, stains black, leaches sodium. Nanocrystalline silver (Acticoat®): no/transient pain, medium penetration, may stain blue-gray, raises liver enzymes. Silver sulfadiazine (Flamazine®): minimal pain, medium penetration through eschar, slowed healing, leukopenia. Mafenide acetate (Sulfamylon®): moderate pain, best penetration, may cause metabolic acidosis, used on ears.\n\nChoice of agent depends on wound depth, eschar presence, and anatomical site. Mafenide is preferred for ear burns due to its superior eschar penetration, reducing the risk of suppurative chondritis."
    difficulty: medium
    tags: [burns, antimicrobial dressings, silver sulfadiazine, mafenide]
  - front: "What are the systemic effects of severe burns?"
    back: "Altered hemodynamics (decreased CO, increased SVR), vascular permeability and edema, hypermetabolism, immunosuppression, progressive pulmonary insufficiency, renal failure (secondary to decreased renal blood flow), and increased gut mucosal permeability (GI bleed risk).\n\nBurns >40% TBSA cause a BMR 2–2.5x predicted normal, requiring nutritional supplementation (calories, vitamin C, vitamin A, calcium, zinc, iron). GI bleeds occur subclinically and are managed with antacids and H2 blockers."
    difficulty: easy
    tags: [burns, systemic effects, hypermetabolism, organ failure]
  - front: "What are the signs of sepsis in a burn patient?"
    back: "Sudden onset of hyper- or hypothermia, unexpected CHF or pulmonary edema, development of ARDS, ileus >48 hours post-burn, mental status changes, azotemia, thrombocytopenia, hypofibrinogenemia, and hyper/hypoglycemia (especially if burn >40% TBSA).\n\nBurn patients are significantly immunosuppressed. Sepsis in this population may not manifest with typical signs and blood cultures may be negative. A threshold of >10^5 bacteria/g of tissue is used for wound infection diagnosis."
    difficulty: medium
    tags: [burns, sepsis, infection, immunosuppression]
  - front: "What is the mechanism of injury in alkaline vs. acid chemical burns, and which is worse?"
    back: "Acids cause coagulation necrosis. Alkalines cause saponification followed by liquefactive necrosis. Alkaline burns are worse because liquefactive necrosis allows deeper penetration and more extensive tissue destruction.\n\nThe severity of chemical burns also depends on type, temperature, volume, concentration, contact time, site affected, and tissue penetration. Alkaline agents (e.g., cement) continue to penetrate deeper over time."
    difficulty: easy
    tags: [chemical burns, mechanism of injury, acid burns, alkali burns]
  - front: "How is a hydrofluoric acid burn treated?"
    back: "Water irrigation; clip fingernails to avoid acid trapping; topical calcium gel + subcutaneous injection of calcium gluconate + 10% calcium gluconate IV depending on amount of exposure and pain.\n\nHydrofluoric acid binds free calcium and causes hypocalcemia and cardiac arrhythmias, in addition to direct tissue damage. Calcium supplementation neutralizes the fluoride ions and prevents systemic toxicity."
    difficulty: medium
    tags: [chemical burns, hydrofluoric acid, calcium gluconate, treatment]
  - front: "What are the contraindications to water irrigation in chemical burns?"
    back: "Elemental metal burns (sodium, potassium, magnesium, lithium). In these cases, soak in mineral oil instead, as direct water exposure causes an exothermic reaction.\n\nElemental metals react violently with water. Mineral oil creates a barrier to oxygen and water contact, safely containing the reactive metal before surgical removal."
    difficulty: medium
    tags: [chemical burns, elemental metal, irrigation, contraindications]
  - front: "What are the unique features and complications of electrical burns?"
    back: "Injury from current flow, arc flash, or ignition. Small punctate skin burns with extensive deep tissue damage. Requires ECG monitoring and neurovascular assessment. Complications: abdominal intraperitoneal damage, fractures/dislocations (spine, shoulder), arrhythmias, myoglobinuria → compartment syndrome, seizures, late cataract formation, ATN from myoglobin/hemoglobin toxicity, vessel thrombosis → tissue necrosis.\n\nTissue resistance determines burn severity: nerve < vessel/blood < muscle < skin < tendon < fat < bone. Electrical burns are often underestimated — small entry/exit wounds hide extensive internal injury."
    difficulty: medium
    tags: [electrical burns, myoglobinuria, arrhythmia, compartment syndrome]
  - front: "What is the order of tissue resistance to electrical current from lowest to highest?"
    back: "Nerve < vessel/blood < muscle < skin < tendon < fat < bone.\n\nTissues with lower resistance allow current to pass more easily and are less damaged; tissues with higher resistance convert more electrical energy to heat and are more damaged. This explains why bone and fat can sustain severe internal damage despite minimal surface injury."
    difficulty: easy
    tags: [electrical burns, tissue resistance, pathophysiology]
