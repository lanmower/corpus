# General (EmergencyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the four areas assessed in a FAST exam?"
    back: "Subxiphoid Pericardial Window, Perisplenic, Hepatorenal (Morrison's Pouch), and Pelvic/Retrovesical (Pouch of Douglas)\n\nFAST (Focused Assessment with Sonography for Trauma) examines four areas for free fluid: pericardial sac, splenic region, Morrison's pouch between liver and kidney, and Douglas pouch in the pelvis."
    difficulty: medium
    tags: [FAST, Trauma Ultrasound, Emergency Medicine, Traumatology, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the recommended imaging modality for suspected intracranial injury?"
    back: "Non-contrast head CT\n\nNon-contrast head CT is the best imaging modality for intracranial injury as it effectively rules out fractures and bleeds without contrast administration."
    difficulty: easy
    tags: [Neuroimaging, Trauma, Emergency Medicine, CT, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What should be included in the SAMPLE history?"
    back: "Signs and symptoms, Allergies, Medications, Past medical history, Last meal, Events related to injury or illness\n\nSAMPLE is a mnemonic used in emergency medicine to gather essential patient history: Signs/Symptoms, Allergies, Medications, Past medical history, Last meal, Events/Environment."
    difficulty: easy
    tags: [History Taking, Emergency Medicine, Clinical Skills, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the compression landmark for adult chest compressions?"
    back: "In the centre of the chest, lower half of the sternum\n\nAdult chest compressions should be performed on the lower half of the sternum (the 'center of the chest'), which allows for effective compression of the heart between the sternum and spine."
    difficulty: easy
    tags: [CPR, AHA Guidelines, Resuscitation, Emergency Medicine, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the four components of SAMPLE history in emergency medicine?"
    back: "Signs and symptoms, Allergies, Medications, Past medical history, Last meal, Events related to injury or illness\n\nSAMPLE is a mnemonic used in the secondary survey to obtain a thorough patient history."
    difficulty: easy
    tags: [history, SAMPLE, emergency, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the emergency management for cauda equina syndrome?"
    back: "Dexamethasone and early spine surgery consultation\n\nCauda equina syndrome is a surgical emergency requiring decompression within 24-48 hours"
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Cauda Equina, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "Define dyspnea"
    back: "Dyspnea is the subjective sensation of shortness of breath or difficulty breathing\n\nDyspnea is a patient-reported symptom requiring thorough evaluation"
    difficulty: easy
    tags: [Emergency Medicine, Dyspnea, Definition, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the management of major extraperitoneal bladder rupture?"
    back: "Surgical repair\n\nMajor extraperitoneal bladder ruptures require surgical intervention."
    difficulty: easy
    tags: [Emergency Medicine, Urology, Bladder Injury, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "How is intraperitoneal bladder rupture managed?"
    back: "Surgical repair\n\nIntraperitoneal bladder ruptures require surgical repair due to intra-abdominal contamination risk."
    difficulty: easy
    tags: [Emergency Medicine, Urology, Bladder Injury, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the '6 Ps' of compartment syndrome?"
    back: "Pain out of proportion, Pain worse with passive stretch, Paresthesia/hypoesthesia, Pallor, Polar (cold), Paralysis\n\nThe 6 Ps indicate advanced compartment syndrome; diagnosis should not wait for all signs."
    difficulty: medium
    tags: [Emergency Medicine, Orthopedics, Compartment Syndrome, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What nerves are at risk with anterior shoulder dislocation?"
    back: "Axillary nerve (lateral shoulder) and musculocutaneous nerve (extensor forearm)\n\nThese nerves are commonly injured with anterior shoulder dislocations."
    difficulty: medium
    tags: [Emergency Medicine, Orthopedics, Shoulder, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "When is knee x-ray required according to Ottawa Knee Rules?"
    back: "Age ≥55 OR tenderness at fibular head OR isolated patellar tenderness OR inability to flex 90° OR inability to bear weight (4 steps) immediately and in ED\n\nOttawa Knee Rules help reduce unnecessary x-rays while missing significant fractures."
    difficulty: medium
    tags: [Emergency Medicine, Orthopedics, Knee, Decision Rules, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "When is ankle x-ray required according to Ottawa Ankle Rules?"
    back: "Bony tenderness at malleolar zone OR base of 5th metatarsal OR navicular AND inability to bear weight immediately and in ED\n\nOttawa Ankle Rules reduce unnecessary imaging for ankle injuries."
    difficulty: medium
    tags: [Emergency Medicine, Orthopedics, Ankle, Decision Rules, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of a major extraperitoneal bladder rupture?"
    back: "Surgical repair\n\nMajor extraperitoneal bladder ruptures require surgical intervention for definitive repair."
    difficulty: easy
    tags: [emergency-medicine, urology, bladder-injury, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of an intraperitoneal bladder rupture?"
    back: "Surgical repair\n\nIntraperitoneal bladder ruptures require surgical repair due to contamination of the peritoneal cavity."
    difficulty: easy
    tags: [emergency-medicine, urology, bladder-injury, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of a posterior urethral injury?"
    back: "Suprapubic cystostomy (avoid catheterization) and surgical repair\n\nPosterior urethral injuries, often associated with pelvic fractures, require suprapubic cystostomy and definitive surgical repair."
    difficulty: medium
    tags: [emergency-medicine, urology, urethral-injury, trauma, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the treatment for compartment syndrome?"
    back: "Remove constrictive casts/dressings; emergent fasciotomy if needed\n\nPrompt decompression by removing constrictive elements and surgical fasciotomy is the definitive treatment."
    difficulty: medium
    tags: [emergency-medicine, orthopedics, compartment-syndrome, treatment, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What nerves are at risk in an anterior shoulder dislocation?"
    back: "Axillary nerve (lateral shoulder) and musculocutaneous nerve (extensor forearm)\n\nThese nerves are commonly injured in anterior shoulder dislocations and should be assessed."
    difficulty: medium
    tags: [emergency-medicine, orthopedics, shoulder-dislocation, nerve-injury, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the Ottawa Knee Rules for when to order knee X-rays?"
    back: "Age ≥55, tenderness at fibular head, isolated patellar tenderness, inability to flex to 90°, inability to bear weight (4 steps) both immediately and in ED\n\nThese rules help reduce unnecessary radiography in knee injury patients."
    difficulty: hard
    tags: [emergency-medicine, orthopedics, ottawa-rules, knee, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the Ottawa Ankle Rules for when to order ankle X-rays?"
    back: "Pain in malleolar zone with: bony tenderness at posterior edge/tip of medial or lateral malleolus, OR bony tenderness at base of 5th metatarsal, OR inability to bear weight both immediately and in ED\n\nThese rules help identify ankle fractures requiring radiographic evaluation."
    difficulty: hard
    tags: [emergency-medicine, orthopedics, ottawa-rules, ankle, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the definition of dyspnea?"
    back: "Dyspnea is the subjective sensation of shortness of breath or difficulty breathing\n\nDyspnea is a subjective symptom that requires careful evaluation as it can indicate life-threatening conditions."
    difficulty: easy
    tags: [Emergency Medicine, Dyspnea, Shortness of Breath, Definition, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are typical features of musculoskeletal back pain?"
    back: "Moderate pain, worse with movement or cough, no visceral symptoms, no neurological deficits\n\nMusculoskeletal back pain typically has a mechanical pattern and lacks red flag symptoms suggesting serious pathology."
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Clinical Presentation, Musculoskeletal, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the management for lumbosacral strain and disc herniation?"
    back: "Analgesia and continue daily activities as much as tolerated; discuss red flags and organize follow-up\n\nMost acute back pain from these causes improves with conservative management; early return to activity is encouraged."
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Treatment, Musculoskeletal, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the management approach for lumbosacral strain and disc herniation in the ED?"
    back: "Provide analgesia and encourage continuation of daily activities as much as tolerated. Discuss red flags and organize appropriate follow-up.\n\nMost mechanical back pain is self-limited; early return to normal activities is recommended with appropriate pain management and patient education."
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Management, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "When should dextrose be added to IV fluids in DKA management?"
    back: "When blood glucose falls below 14 mmol/L\n\nDextrose is added once glucose decreases to 14 mmol/L to prevent hypoglycemia while continuing insulin infusion to resolve ketosis."
    difficulty: easy
    tags: [DKA, Diabetes, IV Fluids, Emergency Medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the estimated water deficit in HHS?"
    back: "Average 100 mL/kg body weight\n\nPatients with HHS have profound total body water deficits averaging 100 mL/kg due to prolonged osmotic diuresis, requiring aggressive fluid resuscitation."
    difficulty: easy
    tags: [HHS, Dehydration, Emergency Medicine, IV Fluids, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "Define hypertensive emergency"
    back: "Severe BP elevation with evidence of end-organ damage (CNS, retinal, cardiovascular, renal, GI)\n\nHypertensive emergency requires immediate treatment in an ICU setting to prevent permanent organ damage, unlike hypertensive urgency."
    difficulty: easy
    tags: [Hypertension, Emergency Medicine, End-Organ Damage, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "Why should non-selective beta-blockers be avoided in hypertensive emergency?"
    back: "They inhibit beta-2 mediated vasodilation leaving alpha-adrenergic vasoconstriction unopposed\n\nNon-selective beta-blockers block vasodilatory beta-2 receptors, potentially worsening hypertension and reducing organ perfusion."
    difficulty: medium
    tags: [Hypertension, Treatment, Beta-Blockers, Emergency Medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the management of posterior urethra injury?"
    back: "Suprapubic cystostomy (avoid catheterization) + surgical repair\n\nPosterior urethral injuries are associated with pelvic fractures and require careful management to avoid worsening damage."
    difficulty: medium
    tags: [emergency-medicine, gu-injury, urethra, urology, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the management of ureteral injuries?"
    back: "Ureteroureterostomy\n\nSurgical reconstruction is the standard treatment for ureteral injuries to restore urinary continuity."
    difficulty: hard
    tags: [emergency-medicine, gu-injury, ureter, urology, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the treatment for heat exhaustion?"
    back: "Rest in cool environment, replace fluids PO or IV with salt/electrolyte solutions, treat orthostatic hypotension with IV fluids\n\nHeat exhaustion responds to volume replacement and cooling; if uncertain between heat exhaustion and heat stroke, treat as heat stroke"
    difficulty: easy
    tags: [heat-illness, emergency-medicine, treatment, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the rule of nines for burn assessment?"
    back: "Head/neck: 9%, each upper limb: 9%, each lower limb: 18%, anterior trunk: 18%, posterior trunk: 18%, perineum: 1% (does not include 1st degree burns)\n\nRule of nines estimates total body surface area (TBSA) for fluid resuscitation and burn severity grading"
    difficulty: easy
    tags: [burns, assessment, emergency-medicine, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the management of lumbosacral strain and disc herniation?"
    back: "Analgesia and continue daily activities as much as tolerated; discuss red flags and organize follow-up\n\nMost mechanical back pain resolves with conservative management. Early activity is encouraged to prevent deconditioning."
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Management, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the management of cauda equina syndrome?"
    back: "Dexamethasone and early spine surgery consultation\n\nCauda equina syndrome is a surgical emergency requiring decompression within 24-48 hours to prevent permanent deficits."
    difficulty: hard
    tags: [Emergency Medicine, Back Pain, Cauda Equina, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the estimated total water deficit in HHS and how is it corrected?"
    back: "Total water deficit is estimated at average 100 cc/kg body weight. Rehydrate with IV normal saline.\n\nAggressive fluid resuscitation is the cornerstone of HHS management to correct severe dehydration."
    difficulty: medium
    tags: [HHS, fluids, rehydration, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the definition of hypertensive emergency?"
    back: "Severe elevation of BP with evidence of end-organ damage (CNS, retinal, CVS, renal, GI).\n\nHypertensive emergency requires immediate treatment to prevent irreversible organ damage."
    difficulty: easy
    tags: [hypertensive emergency, emergency medicine, cardiology, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What investigations are required for HHS?"
    back: "CBC, electrolytes, extended lytes, Cr, BUN, glucose, ketones, osmolality, urine glucose and ketones, VBG, ECG, CXR, blood and urine C&S.\n\nWorkup should identify the precipitating cause and assess for complications."
    difficulty: medium
    tags: [HHS, investigations, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What monitoring is required in DKA management?"
    back: "Cardiac monitoring, frequent electrolyte and glucose monitoring.\n\nDKA causes rapid shifts in electrolytes, especially potassium, requiring close monitoring."
    difficulty: easy
    tags: [DKA, monitoring, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What should be monitored in HHS management?"
    back: "Cardiac monitoring, frequent electrolyte and glucose monitoring.\n\nSimilar to DKA, close monitoring is essential due to electrolyte abnormalities."
    difficulty: easy
    tags: [HHS, monitoring, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the first-line treatment for lumbosacral strain and disc herniation causing back pain?"
    back: "Analgesia and continue daily activities as much as tolerated, with education about red flags and follow-up arranged\n\nMost mechanical back pain improves with conservative management including analgesia and maintaining mobility rather than bed rest."
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Management, Treatment, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the typical features of a musculoskeletal back pain presentation?"
    back: "Moderate pain, worse with movement or cough, no visceral symptoms, may be chronic or constant, associated with paresthesia\n\nMechanical back pain follows a predictable pattern and typically lacks red flag features suggesting serious pathology."
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Clinical Presentation, Musculoskeletal, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the neurological causes of dyspnea?"
    back: "Myasthenia gravis, diaphragmatic paralysis, CNS lesions, and primary muscle weakness\n\nNeuromuscular causes affect the respiratory muscles directly, leading to dyspnea from respiratory muscle weakness."
    difficulty: medium
    tags: [Emergency Medicine, Dyspnea, Neurology, Neuromuscular, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the treatment of choice for toxic alcohol ingestion?"
    back: "Fomepizole 15 mg/kg IV bolus\n\nFomepizole inhibits alcohol dehydrogenase, blocking metabolism of toxic alcohols to their harmful metabolites"
    difficulty: easy
    tags: [toxicology, treatment, fomepizole, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What criteria must be met before discharging an alcohol-intoxicated patient from the ED?"
    back: "Stable vital signs, can walk unassisted, fully oriented\n\nPatients must demonstrate recovery of motor function and cognition before discharge"
    difficulty: easy
    tags: [alcohol, disposition, emergency, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the recommended observation period for TCA overdose without symptoms or ECG abnormalities?"
    back: "6 hours\n\nDelayed cardiotoxicity can occur, but 6 hours is adequate for asymptomatic patients with normal ECG"
    difficulty: medium
    tags: [TCA overdose, toxicology, observation, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "Why is EtOH co-ingestion protective in toxic alcohol poisoning?"
    back: "Ethanol has higher affinity for alcohol dehydrogenase, blocking metabolism of toxic alcohols\n\nCompetitive inhibition at the enzyme level prevents formation of toxic metabolites"
    difficulty: medium
    tags: [toxicology, ethanol, mechanism, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the two types of heat exhaustion based on fluid replacement?"
    back: "Water depletion (fluid not adequately replaced) and salt depletion (losses replaced with hypotonic fluid)\n\nHeat exhaustion results from fluid loss during heat exposure; replacing losses with inappropriate fluids can cause different subtypes."
    difficulty: easy
    tags: [heat-illness, emergency-medicine, environmental-injury, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is frostbite?"
    back: "Ice crystals form between cells, causing tissue injury\n\nFrostbite is classified by depth of initial lesion at day 0 after rapid rewarming."
    difficulty: easy
    tags: [frostbite, cold-injury, emergency-medicine, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the rule of nines used for?"
    back: "Calculating burn size (% total body surface area); does not include 1st degree burns\n\nEach major body region accounts for 9% (or multiples thereof) of BSA in adults."
    difficulty: easy
    tags: [burns, assessment, emergency-medicine, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the treatment of choice for toxic alcohol (methanol/ethylene glycol) poisoning?"
    back: "Fomepizole 15 mg/kg IV bolus\n\nFomepizole inhibits alcohol dehydrogenase, blocking the metabolic pathway that produces toxic metabolites from methanol and ethylene glycol."
    difficulty: easy
    tags: [toxicology, treatment, fomepizole, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the alternative treatment for toxic alcohol poisoning if fomepizole is unavailable?"
    back: "10% ethanol IV bolus and infusion to achieve blood level of 22 mmol/L (can also be given PO)\n\nEthanol competes with toxic alcohols for alcohol dehydrogenase, reducing formation of toxic metabolites."
    difficulty: medium
    tags: [toxicology, ethanol, treatment, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "Why is co-ingestion of ethanol protective in toxic alcohol poisoning?"
    back: "Ethanol competes for alcohol dehydrogenase enzyme, slowing metabolism of toxic alcohols to their harmful metabolites\n\nEthanol has a higher affinity for alcohol dehydrogenase, which blocks the conversion of methanol/ethylene glycol to toxic metabolites."
    difficulty: medium
    tags: [toxicology, alcohol dehydrogenase, mechanism, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the observation period for TCA overdose if asymptomatic with no ECG abnormalities?"
    back: "6 hours\n\nAsymptomatic patients with TCA overdose and normal ECG can be observed for 6 hours in the ED after decontamination."
    difficulty: medium
    tags: [TCA overdose, observation, emergency, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "At what blood glucose level should dextrose be added to IV fluids in DKA?"
    back: "Once blood glucose <14 mmol/L, dextrose should be added to the patient's IV fluids.\n\nThis prevents hypoglycemia while continuing insulin therapy to resolve ketosis."
    difficulty: medium
    tags: [DKA, diabetes, emergency medicine, glucose, IV fluids, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the management approach for fluid deficit in HHS?"
    back: "Rehydration with IV NS, with total water deficit estimated at average 100 mL/kg body weight.\n\nAggressive fluid resuscitation is crucial in HHS given the severe dehydration from osmotic diuresis."
    difficulty: medium
    tags: [HHS, diabetes, emergency medicine, IV fluids, dehydration, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is a hypertensive emergency?"
    back: "Hypertensive emergency is defined as severe elevation in BP with evidence of end-organ damage (CNS, retinal, CVS, renal, GI).\n\nThis is distinguished from hypertensive urgency (severe elevation without end-organ damage)."
    difficulty: easy
    tags: [hypertension, emergency medicine, end-organ damage, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "Which beta-blockers should be avoided in hypertensive emergencies and why?"
    back: "Avoid non-selective beta-blockers as they inhibit beta-2 mediated vasodilation, leaving alpha-adrenergic vasoconstriction unopposed.\n\nLabetalol is acceptable as it has both alpha and beta blocking activity."
    difficulty: hard
    tags: [hypertension, emergency medicine, beta-blockers, pharmacology, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the criteria for discharging an alcohol-intoxicated patient from ED?"
    back: "Stable vital signs, can walk unassisted, fully oriented\n\nBefore discharge, ensure the patient has stable vital signs, can walk unassisted, and is fully oriented to person, place, time, and situation."
    difficulty: easy
    tags: [alcohol, disposition, emergency medicine, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the link between aortic graft surgery and GI bleeding?"
    back: "Aortoenteric fistula is a rare but lethal cause of GI bleeding in patients with history of aortic graft surgery\n\nAortoenteric fistula presents with abdominal pain associated with bleeding. This is a surgical emergency with narrow window for intervention."
    difficulty: medium
    tags: [upper GI bleeding, aortoenteric fistula, aortic graft, emergency, gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
