    back: "Salmon pink mucosa in the distal esophagus"
    difficulty: easy
    tags: [Barretts esophagus, endoscopy, findings, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the red flag features in chronic GERD that warrant EGD?"
    back: "Anorexia, weight loss, bleeding, and dysphagia"
    difficulty: easy
    tags: [GERD, endoscopy, red flags, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "In which esophageal motor disorder do patients present with dysphagia to both solids and liquids?"
    back: "Achalasia (due to failure of LES relaxation)"
    difficulty: easy
    tags: [achalasia, dysphagia, presentation, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the indications for esophageal manometry?"
    back: "Patients with non-cardiac chest pain and/or dysphagia with normal gastroscopy; to diagnose peristalsis abnormalities and decreased LES tone; to exclude scleroderma and achalasia; before surgical fundoplication\n\nEsophageal manometry studies motility but cannot detect presence of reflux. It is essential before fundoplication to ensure intact esophageal function."
    difficulty: medium
    tags: [esophageal manometry, dysphagia, pre-operative, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What lifestyle modifications have been shown to benefit GERD?"
    back: "Weight loss (if obese or significant weight gain) and elevating the head of bed (if nocturnal symptoms)\n\nOnly these two lifestyle changes are beneficial. Diet helps symptoms but not the disease - avoid EtOH, coffee, spices, tomatoes, and citrus juices."
    difficulty: easy
    tags: [GERD, lifestyle, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the epidemiology of Barrett's esophagus?"
    back: "0.5-20% of adults in North America/Western Europe; up to 10% of GERD patients; more common in males, ages >50, White individuals, smokers, overweight, with hiatus hernia and long reflux history\n\nBarrett's is a common condition strongly associated with chronic GERD. Key risk factors include male sex, age over 50, and white race."
    difficulty: medium
    tags: [Barretts esophagus, epidemiology, risk factors, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the annual malignant transformation rate of Barrett's esophagus?"
    back: "Approximately 0.12% per year for all BE patients prior to dysplasia\n\nThe risk is relatively low but increases significantly in high-grade dysplasia, with studies reporting 32-59% transformation rate over 5-8 years."
    difficulty: easy
    tags: [Barretts esophagus, malignancy risk, prognosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the treatment approach for Barrett's esophagus without dysplasia?"
    back: "Acid suppressive therapy with high-dose PPI indefinitely (or surgical fundoplication) to reduce transformation, plus surveillance gastroscopy every 3-5 years\n\nEven without dysplasia, indefinite acid suppression is recommended to potentially reduce progression to dysplasia."
    difficulty: medium
    tags: [Barretts esophagus, treatment, surveillance, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the treatment for high-grade dysplasia in Barrett's esophagus?"
    back: "Regular intensive biopsy surveillance, endoscopic ablation/mucosal resection, or esophagectomy - with increasing evidence favoring endoscopic ablation (RFA or EMR)\n\nHigh-grade dysplasia has high transformation risk (32-59% over 5-8 years) and requires aggressive intervention."
    difficulty: medium
    tags: [Barretts esophagus, high-grade dysplasia, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the key distinguishing features between oropharyngeal and esophageal dysphagia?"
    back: "Oropharyngeal: difficulty initiating swallowing, choking, coughing, nasal regurgitation; Esophageal: inability to move food down esophagus, associated with reflux symptoms\n\nOropharyngeal dysphagia originates from neuromuscular disorders (cortical, bulbar, peripheral), while esophageal dysphagia can be mechanical or neuromuscular."
    difficulty: medium
    tags: [dysphagia, diagnosis, differential, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "In a patient with dysphagia, what features suggest proceeding directly to endoscopy vs. trial of PPI?"
    back: "If age >50 with alarm features (weight loss, dysphagia progression) → endoscopy; If age <50 with no alarm features and concomitant GERD → trial PPI first\n\nAge and alarm features guide the approach. Progressive symptoms, weight loss, and older age warrant earlier endoscopic evaluation."
    difficulty: medium
    tags: [dysphagia, management, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the endoscopic appearance of Barrett's esophagus?"
    back: "Salmon pink mucosa in the distal esophagus\n\nThe characteristic salmon-pink (versus pink) color difference between gastric and esophageal mucosa helps identify Barrett's during endoscopy."
    difficulty: easy
    tags: [Barretts esophagus, endoscopy, findings, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the management approach for low-grade dysplasia in Barrett's esophagus?"
    back: "Either surveillance (every 6 months for 1 year then annually) OR endoscopic ablation/resection are satisfactory options\n\nLow-grade dysplasia has more treatment options than high-grade, with both surveillance and intervention being acceptable approaches."
    difficulty: medium
    tags: [Barretts esophagus, low-grade dysplasia, management, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are alarm features in GERD that warrant EGD?"
    back: "Anorexia, weight loss, bleeding, dysphagia - especially in chronic GERD or symptoms suggestive of complicated disease\n\nAlarm features suggest possible complications or malignancy and warrant endoscopic evaluation regardless of duration of symptoms."
    difficulty: easy
    tags: [GERD, endoscopy, alarm features, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What CNS manifestations are seen in Wilson's disease?"
    back: "Basal ganglia (wing flapping tremor, Parkinsonism), cerebellum (dysarthria, dysphagia, incoordination, ataxia), cerebrum (psychosis, affective disorder)\n\nNeurological involvement results from basal ganglia degeneration, with patients presenting with movement disorders, cerebellar signs, and psychiatric symptoms."
    difficulty: medium
    tags: [Wilsons disease, neurology, movement disorders, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What proportion of GI bleeds are upper GI?"
    back: "75% of GI bleeds are upper gastrointestinal\n\nMost GI bleeding originates from the upper GI tract proximal to the ligament of Treitz."
    difficulty: easy
    tags: [UGIB, Epidemiology, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the transfusion threshold for acute upper GI bleeding?"
    back: "Transfuse at hemoglobin <70-80 g/L (or <100 g/L in patients with cardiovascular disease)\n\nRestrictive transfusion strategy (targeting 70-80 g/L) is associated with better outcomes in UGIB."
    difficulty: hard
    tags: [UGIB, Transfusion, Treatment, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are the neurological manifestations of Wilson's disease?"
    back: "Basal ganglia (wing-flapping tremor, Parkinsonism), cerebellum (dysarthria, dysphagia, incoordination, ataxia), cerebrum (psychosis, affective disorder)\n\nNeurological involvement typically presents in younger patients with movement disorders, psychiatric symptoms, and cognitive decline due to copper deposition in the brain."
    difficulty: medium
    tags: [Wilsons disease, neurology, movement disorders, psychiatry, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What CNS manifestations can occur in Wilson's disease?"
    back: "Basal ganglia (wing-flapping tremor, Parkinsonism), cerebellum (dysarthria, dysphagia, incoordination, ataxia), cerebrum (psychosis, affective disorder)\n\nNeurological involvement in Wilson's disease results from copper deposition in the basal ganglia, cerebellum, and cerebral cortex, causing movement disorders, psychiatric symptoms, and cognitive changes."
    difficulty: medium
    tags: [wilsons-disease, neurology, hepatology, psychiatry, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the key components of the Canadian consensus for H. pylori infection management in adults?"
    back: "The Canadian Helicobacter pylori consensus conference provides updated recommendations for diagnosis, treatment, and eradication in adult patients\n\nThe Canadian consensus (J Gastroenterol 1999) addresses screening, treatment regimens, and follow-up for H. pylori infection in Canada"
    difficulty: medium
    tags: [H. pylori, Canadian guidelines, GERD, peptic ulcer, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "When is IVIG indicated in dermatomyositis?"
    back: "Severe or refractory muscle weakness, particularly with dysphagia and/or dyspnea\n\nIVIG provides rapid improvement in severe cases with significant weakness or respiratory involvement."
    difficulty: medium
    tags: [Dermatomyositis, IVIG, Treatment, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
