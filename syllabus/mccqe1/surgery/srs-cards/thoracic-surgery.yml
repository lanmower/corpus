# Thoracic Surgery (Surgery) - generated from srs-mccqe1
cards:
  - front: "What are the four main disease categories leading to lung transplantation?"
    back: "1) Obstructive: COPD, cystic fibrosis, emphysema (alpha-1 antitrypsin deficiency)\n2) Restrictive interstitial: IPF, hypersensitivity pneumonitis\n3) Vascular: IPAH, secondary pulmonary HTN, Eisenmenger's syndrome\n4) Other: sarcoidosis, lymphangioleiomyomatosis, pulmonary Langerhans cell histiocytosis\n\nLung transplantation is considered when advanced lung disease is refractory to maximal medical or surgical therapy. Knowing these categories helps identify candidates. COPD and CF are the most commonly transplanted obstructive conditions in Canada."
    difficulty: easy
    tags: [thoracic surgery, lung transplantation, COPD, cystic fibrosis, IPF, pulmonary hypertension]
  - front: "What are the absolute contraindications to lung transplantation?"
    back: "- Uncontrolled/untreatable pulmonary or extrapulmonary infection\n- Active TB infection\n- Malignancy in last 2 years\n- Vital organ dysfunction: GFR <40 mL/min/1.73 m², stroke within 30 days, acute liver failure or cirrhosis, ACS within 30 days, heart disease not amenable to revascularization, untreatable hematologic disorders\n- Active cigarette smoking\n- BMI ≥35 kg/m²\n- Unresolved psychosocial problems or non-adherence to medical therapy\n- Absence of social support system\n\nThese contraindications reflect the requirement for adequate post-transplant survival benefit. Active smoking, morbid obesity, and untreatable infections markedly reduce post-transplant outcomes and are non-negotiable barriers in Canadian transplant programs."
    difficulty: medium
    tags: [thoracic surgery, lung transplantation, contraindications]
  - front: "What is the median survival after lung transplantation, and how does bilateral compare to single lung transplant?"
    back: "Median survival for all adult recipients: 6.5 years. Bilateral transplant survival is higher than single lung transplant (7.6 vs. 4.7 years, respectively).\n\nBilateral lung transplantation offers superior long-term survival, likely because both lungs are replaced, reducing the risk of complications arising from the native lung. This difference informs decision-making in transplant candidate selection."
    difficulty: easy
    tags: [thoracic surgery, lung transplantation, prognosis]
  - front: "For 1-year and 10-year post-lung-transplant survival, how do COPD, IPF, IPAH, and CF compare?"
    back: "1-year survival (best to worst): COPD > IPF > IPAH\n10-year survival (best to worst): CF and alpha-1 antitrypsin deficiency > IPAH > COPD and IPF\n\nCF patients have better long-term survival despite worse 1-year outcomes, possibly due to younger age at transplant. This has implications for organ allocation and patient counselling in Canadian transplant centres."
    difficulty: medium
    tags: [thoracic surgery, lung transplantation, prognosis, COPD, CF, IPF]
  - front: "What are the relative contraindications to lung transplantation?"
    back: "- Age >70 years with low physiologic reserve\n- BMI 30–34.9 kg/m²\n- Limited functional status including severe malnutrition or osteoporosis\n- HIV infection, HBV infection\n- Alcohol (must remain within healthy drinking guidelines)\n\nRelative contraindications require individualized risk-benefit assessment. Unlike absolute contraindications, these may be managed or monitored to allow transplantation to proceed with appropriate planning."
    difficulty: medium
    tags: [thoracic surgery, lung transplantation, contraindications]
  - front: "What are the postoperative complications of lung transplantation?"
    back: "- Primary graft dysfunction\n- Airway anastomotic complications (bronchial necrosis, dehiscence, tracheobronchomalacia, stenosis)\n- Chronic lung allograft dysfunction (bronchiolitis obliterans syndrome and restrictive allograft syndrome)\n- Infectious complications (bacterial, fungal, CMV, community-acquired respiratory viruses, mycobacteria)\n- Malignancy (non-melanoma skin cancer, PTLD, colon, breast, Kaposi's sarcoma, bladder)\n\nChronic lung allograft dysfunction, particularly bronchiolitis obliterans syndrome, is the leading cause of long-term mortality after lung transplantation. Post-transplant immunosuppression increases infection and malignancy risk."
    difficulty: medium
    tags: [thoracic surgery, lung transplantation, complications, bronchiolitis obliterans]
  - front: "What are the indications for surgical management (lung volume reduction surgery) in COPD?"
    back: "- Dyspnea despite maximal medical therapy and pulmonary rehabilitation\n- CT showing hyperinflation and heterogeneously distributed emphysema predominant in upper lung zones\n- May be used as a bridging procedure to lung transplantation\n\nLung volume reduction surgery (LVRS) selectively removes the most emphysematous, non-functional lung tissue, allowing remaining lung to function more efficiently. Upper-lobe predominant disease responds best."
    difficulty: medium
    tags: [thoracic surgery, COPD, lung volume reduction surgery, emphysema]
  - front: "What are the contraindications to lung volume reduction surgery (LVRS) for COPD?"
    back: "- Age >75 years\n- Cigarette smoking within prior 6 months\n- Higher surgical mortality risk (severe CAD or HF)\n- Homogeneously distributed emphysema without preserved lung tissue\n- Severe cachexia, obesity, chest wall deformity, pulmonary HTN (PA systolic >45 mmHg)\n- DLCO <20% predicted, PaCO₂ >60 mmHg, PaO₂ <45 mmHg\n\nThese contraindications reflect scenarios where LVRS offers minimal benefit or unacceptably high risk. Homogeneous emphysema means there is no better-preserved lung to decompress after excision, negating the functional benefit."
    difficulty: hard
    tags: [thoracic surgery, COPD, lung volume reduction surgery, contraindications]
  - front: "What are the 'Four Ts' of anterior mediastinal masses?"
    back: "Thymoma, Teratoma (germ cell tumours), Thyroid (intrathoracic goitre), Terrible lymphoma\n\nThe anterior mediastinum is bound by the sternum and pericardium/great vessels. The 'Four Ts' is a classic mnemonic. Anterior masses are more likely to be malignant than masses in other mediastinal compartments."
    difficulty: easy
    tags: [thoracic surgery, mediastinal masses, anterior mediastinum, thymoma]
  - front: "Which mediastinal compartment contains neurogenic tumours, and what are the differential diagnoses for each compartment?"
    back: "Anterior: Four Ts (thymoma, teratoma, thyroid, lymphoma), lipoma, pericardial cyst, goitre, ascending aortic aneurysm\nMiddle: pericardial cyst, bronchogenic cyst/tumour, lymphadenopathy, aortic aneurysm\nPosterior: neurogenic tumours, meningocele, enteric cysts, lymphadenopathy, diaphragmatic hernias, esophageal tumours, aortic aneurysm\n\nNeurogenic tumours (e.g., schwannoma, neurofibroma) arise from the sympathetic chain in the posterior mediastinum adjacent to the vertebral bodies. Location narrows the differential significantly."
    difficulty: easy
    tags: [thoracic surgery, mediastinal masses, posterior mediastinum, neurogenic tumours]
  - front: "What investigations are indicated for a mediastinal mass?"
    back: "- CXR (compare to previous)\n- CT with contrast (anatomic location, density, vascular relations)\n- MRI: specifically for neurogenic tumours\n- Echocardiogram: structures near heart/pericardium\n- Radionuclide scanning: ¹³¹I (thyroid), gallium (lymphoma), PET/CT\n- Biochemical: thyroid function, serum calcium/phosphate/PTH, AFP, β-hCG, LDH\n- Biopsy: mediastinoscopy, bronchoscopy, EBUS, percutaneous needle aspiration\n\nBiochemical markers can narrow the differential before biopsy. If AFP, β-hCG, and LDH are all elevated, this is pathognomonic for a germ cell tumour and biopsy is not required before treatment."
    difficulty: medium
    tags: [thoracic surgery, mediastinal masses, investigations]
  - front: "When should biopsy be avoided in a mediastinal mass with elevated AFP, β-hCG, and LDH?"
    back: "When AFP, β-hCG, and LDH are all elevated, this is pathognomonic for a germ cell tumour — biopsy is NOT required and treatment should proceed directly.\n\nElevated tumour markers (AFP, β-hCG, LDH) in an anterior mediastinal mass are diagnostic for germ cell tumour. Proceeding to biopsy would expose the patient to unnecessary procedural risk without changing management."
    difficulty: medium
    tags: [thoracic surgery, mediastinal masses, germ cell tumour, investigations]
  - front: "Describe the Masaoka staging system for thymoma."
    back: "Stage I: Encapsulated tumour\nStage II: Invasion beyond the capsule\nStage III: Invasion into another organ\nStage IVa: Pleural or pericardial metastases\nStage IVb: Hematogenous or lymphatic metastases\n\nThe Masaoka staging system is the most widely used staging tool for thymoma. Stage guides post-operative radiation decisions — radiation is considered for Stage II/III disease."
    difficulty: medium
    tags: [thoracic surgery, thymoma, Masaoka staging]
  - front: "What is the epidemiology and key association of thymoma?"
    back: "- Rare neoplasm in the thymus, located in the anterior mediastinum\n- Peak age: 40–60 years; M = F\n- No known risk factors\n- Strong association with myasthenia gravis and other paraneoplastic syndromes\n\nThymoma is the most common primary anterior mediastinal tumour in adults. The association with myasthenia gravis (anti-acetylcholinesterase antibodies) is a classic MCCQE1 tested relationship."
    difficulty: easy
    tags: [thoracic surgery, thymoma, myasthenia gravis, paraneoplastic syndrome]
  - front: "What is the treatment for resectable vs. unresectable thymoma?"
    back: "Resectable: Surgical resection of thymoma + thymus (median sternotomy or VATS) ± postoperative radiation (Stage II/III)\nUnresectable (invasion into heart/great vessels) or non-surgical: Definitive or palliative chemoradiation\nChemotherapy regimens: cyclophosphamide + doxorubicin + cisplatin, OR cisplatin + etoposide\n\nThymomas are generally slow-growing with good prognosis when completely resected. Median sternotomy allows full exposure; VATS is preferred for smaller tumours. Adjuvant radiation reduces locoregional recurrence for invasive disease."
    difficulty: medium
    tags: [thoracic surgery, thymoma, treatment, chemotherapy]
  - front: "Compare the epidemiology and risk factors of SCC vs. adenocarcinoma of the esophagus."
    back: "SCC:\n- Most common worldwide; upper 2/3 of esophagus\n- Risk factors: smoking, alcohol, hot liquids, achalasia, strictures, diverticula\n- More common in Black and Asian populations\n\nAdenocarcinoma:\n- Most common in Western countries; lower 1/3 of esophagus\n- Risk factors: Barrett's esophagus (most important), smoking, obesity, GERD\n- More common in White populations\n\nBarrett's esophagus, a consequence of chronic GERD causing intestinal metaplasia of the distal esophageal mucosa, is the single most important risk factor for esophageal adenocarcinoma. This distinction is heavily tested on the MCCQE1."
    difficulty: easy
    tags: [thoracic surgery, esophageal carcinoma, SCC, adenocarcinoma, Barretts esophagus]
  - front: "What is the classic presentation of esophageal carcinoma?"
    back: "- Progressive dysphagia (mechanical): first solids, then liquids, then saliva\n- Odynophagia then constant pain\n- Constitutional symptoms (weight loss, anorexia)\n- Regurgitation and aspiration (aspiration pneumonia)\n- Hematemesis and anemia\n- Invasion: trachea (cough), recurrent laryngeal nerve (hoarseness), aorta, liver, lungs, bone, lymph nodes\n\nProgressive dysphagia starting with solids indicates a mechanical/structural obstruction, distinguishing esophageal carcinoma from motor disorders (dysphagia to both solids and liquids simultaneously). Late presentation is common, accounting for poor prognosis."
    difficulty: easy
    tags: [thoracic surgery, esophageal carcinoma, clinical features, dysphagia]
  - front: "What investigations are used for staging esophageal carcinoma?"
    back: "- Barium swallow: shows narrowing (suggestive, not diagnostic)\n- Endoscopic biopsy: confirm diagnosis, assess location and resectability\n- Endoscopic ultrasound (EUS): local disease and regional nodal staging\n- Bronchoscopy/laryngoscopy: rule out airway invasion (upper and middle esophagus)\n- Full metastatic workup: CXR, bone scan, CT head, CT chest/abdomen/pelvis, LFTs\n- PET scan: more sensitive than CT for detecting metastatic disease\n- TNM staging (separate groupings for SCC vs. adenocarcinoma)\n\nEUS is the modality of choice for locoregional staging (T and N staging). PET-CT adds sensitivity for distant metastases. Bronchoscopy is critical for upper/middle esophageal tumours to rule out tracheal invasion, which would preclude curative resection."
    difficulty: medium
    tags: [thoracic surgery, esophageal carcinoma, staging, EUS, PET scan]
  - front: "What is the treatment approach for esophageal carcinoma at different stages?"
    back: "Early stage (non-transmural, no nodal disease):\n- Endoscopic mucosal resection (early mucosal cancer or high-grade dysplasia)\n- Esophagectomy (transthoracic or transhiatal) + lymphadenectomy; stomach used for reconstruction\n\nLocally advanced (invasive or nodal disease):\n- Concurrent external beam radiation + chemotherapy (cisplatin + fluorouracil)\n- Consider curative esophagectomy after chemoradiation\n\nDistant metastatic disease:\n- Systemic therapy + symptom management (esophageal stent or radiation)\n\nMultimodal therapy (chemoradiotherapy followed by esophagectomy) is the standard of care for locally advanced esophageal cancer in Canadian centres. Palliation focuses on maintaining swallowing function."
    difficulty: medium
    tags: [thoracic surgery, esophageal carcinoma, treatment, esophagectomy, chemoradiation]
  - front: "What are the causes of esophageal perforation and which is most common?"
    back: "Most common: Iatrogenic (endoscopy, dilatation, biopsy, intubation, operative procedures, NG tube placement)\nBarogenic (forceful vomiting): Boerhaave's syndrome (transmural perforation)\nTrauma: foreign body, corrosive substance ingestion, penetrating trauma\nCarcinoma\n\nBoerhaave's syndrome is a complete transmural esophageal perforation caused by sudden increase in intraesophageal pressure (forceful vomiting). It carries mortality of 10–50% and must be distinguished from Mallory-Weiss tear (partial/non-transmural, lower mortality)."
    difficulty: easy
    tags: [thoracic surgery, esophageal perforation, Boerhaave syndrome, iatrogenic]
  - front: "What are the clinical features and investigations of esophageal perforation?"
    back: "Clinical features:\n- Neck or chest pain\n- Fever, tachycardia, hypotension, dyspnea, respiratory compromise\n- Subcutaneous emphysema, pneumothorax, pleural effusion, voice changes, hematemesis\n\nInvestigations:\n- CXR: subcutaneous emphysema, pneumothorax, pneumomediastinum, pleural effusion, subdiaphragmatic air, widened mediastinum\n- CT chest (oral + IV contrast): pneumomediastinum, pleural effusion, contrast in chest\n- Contrast esophagram: Gastrografin first-line (water-soluble); if negative, dilute barium follow-up\n\nPneumomediastinum on CXR is a key early finding of esophageal perforation. Gastrografin is used first because barium causes mediastinitis if it extravasates. If Gastrografin is negative, dilute barium is more sensitive for detecting small leaks."
    difficulty: medium
    tags: [thoracic surgery, esophageal perforation, investigations, CXR, Gastrografin]
  - front: "What is the treatment algorithm for esophageal perforation based on timing and patient status?"
    back: "Contained rupture (supportive): NPO, antibiotics, IV fluids, percutaneous drainage of mediastinal collections, enteral/parenteral nutrition, repeat imaging\n\nSurgical (progressively deteriorating/toxic patient):\n- <24 hours: primary closure of healthy esophagus with buttressed intercostal muscle flap, OR resection of diseased esophagus\n- >24 hours, non-viable esophagus, or morbidly toxic: diversion and exclusion → esophagostomy proximally, close esophagus distally, gastrostomy/jejunostomy for decompression/feeding → delayed reconstruction\n\nTiming of repair is critical: primary repair within 24 hours when esophagus is viable has the best outcomes. Beyond 24 hours, contamination and tissue necrosis necessitate damage-control surgery with delayed reconstruction."
    difficulty: hard
    tags: [thoracic surgery, esophageal perforation, treatment, surgery]
  - front: "What distinguishes Boerhaave's syndrome from a Mallory-Weiss tear?"
    back: "Boerhaave's syndrome: transmural (full-thickness) esophageal perforation from forceful emesis\nMallory-Weiss tear: non-transmural (partial thickness) esophageal tear from forceful emesis\nBoth are associated with forceful vomiting, but Boerhaave's is more serious with higher mortality.\n\nMallory-Weiss tears typically present with hematemesis after repeated retching and are managed conservatively. Boerhaave's syndrome presents with the Mackler triad (vomiting, chest pain, subcutaneous emphysema) and requires urgent surgical management."
    difficulty: easy
    tags: [thoracic surgery, esophageal perforation, Boerhaave syndrome, Mallory-Weiss]
  - front: "Classify the types of hiatus hernia and their key distinguishing features."
    back: "Type I (Sliding, 90%): GE junction herniates above diaphragm; reducible; most common; associated with GERD\nType II (Paraesophageal, <10%): GE junction remains below diaphragm; fundus rolls through hiatus; usually asymptomatic; risk of strangulation\nType III (Mixed, most common indication for surgery): Combination of Types I and II; giant hernias; risk of gastric volvulus (Borchardt's triad)\nType IV: Stomach + other organs (colon, spleen, pancreas) herniate into thorax\n\nType I sliding hernias are the most common and are primarily treated medically/endoscopically unless symptomatic. Type III mixed hernias are the most common indication for surgical repair due to risk of strangulation and gastric volvulus."
    difficulty: medium
    tags: [thoracic surgery, hiatus hernia, paraesophageal hernia, gastric volvulus]
  - front: "What are the complications of a sliding hiatus hernia (Type I)?"
    back: "Due to acid reflux:\n1) Esophagitis (dysphagia and heartburn)\n2) Consequences of esophagitis: peptic stricture, Barrett's esophagus, esophageal carcinoma\n3) Extra-esophageal complications: aspiration pneumonitis/pneumonia, bronchospasm, cough, laryngitis\n\nComplications arise from chronic gastroesophageal reflux. Barrett's esophagus (intestinal metaplasia) is the most important complication due to its malignant potential (adenocarcinoma). Regular endoscopic surveillance is recommended for Barrett's."
    difficulty: easy
    tags: [thoracic surgery, hiatus hernia, GERD, Barretts esophagus, complications]
  - front: "What are the indications for surgical treatment of a sliding hiatus hernia (Type I)?"
    back: "- Volume regurgitation\n- Patient unwilling or unable to stay on PPI indefinitely\n- Suboptimal medical therapy\n- Complications of GERD: pharyngitis, esophageal stricture, recurrent nocturnal aspiration, Barrett's esophagus\n- Patient preference\nProcedure: Laparoscopic hiatus hernia repair + fundoplication (<15% of cases require surgery)\n\nThe vast majority of sliding hiatus hernias are managed medically. Surgery achieves 90% success rate for alleviating GERD symptoms. Nissen fundoplication (360° wrap) is most common; partial wraps (Toupet/Dor) have less dysphagia but higher reflux rates."
    difficulty: medium
    tags: [thoracic surgery, hiatus hernia, GERD, Nissen fundoplication, laparoscopic]
  - front: "Compare Nissen, Toupet, and Dor fundoplication procedures."
    back: "Nissen: 360° wrap — most commonly performed; highest success for reflux control; higher rates of dysphagia and gas bloat\nToupet/Dor: Partial fundoplications — less post-operative dysphagia and gas bloat; higher risk of mild reflux symptoms\nAll involve: reduction of hernia, removal of hernia sac, fundoplication, and partial closure of hiatus\n\nPartial fundoplications are preferred in patients with poor esophageal motility to reduce post-operative dysphagia. Nissen provides more durable anti-reflux protection. The choice depends on esophageal manometry findings."
    difficulty: medium
    tags: [thoracic surgery, Nissen fundoplication, hiatus hernia, GERD, surgery]
  - front: "What is Borchardt's triad and what condition does it indicate?"
    back: "Borchardt's triad: Chest pain + retching without vomiting + inability to pass an NG tube\nIndicates: Gastric volvulus (seen in mixed/Type III hiatus hernia)\n\nGastric volvulus is a surgical emergency caused by twisting of the stomach around its axis. Inability to decompress the stomach with an NG tube is pathognomonic. Requires urgent surgical reduction and repair of the hernia."
    difficulty: medium
    tags: [thoracic surgery, hiatus hernia, gastric volvulus, Borchardt triad]
  - front: "What is achalasia, and what are its classic clinical and radiological features?"
    back: "Achalasia: Esophageal smooth muscle motility disorder with failure of the lower esophageal sphincter (LES) to relax; absent peristalsis; 50% have hypertensive LES\n\nClinical features: Dysphagia (initially solids then liquids, but many present with both simultaneously); regurgitation; late: chest pain, nocturnal cough, weight loss\n\nRadiological: Barium esophagram shows smooth tapering of lower esophagus — classic 'bird's beak' appearance\n\nAchalasia is distinguished from esophageal carcinoma by the smooth, symmetric tapering on barium swallow ('bird's beak') vs. an irregular narrowing. Esophageal manometry confirms: absent peristalsis + incomplete LES relaxation."
    difficulty: easy
    tags: [thoracic surgery, achalasia, dysphagia, birds beak, LES]
  - front: "A 58-year-old man presents with progressive dysphagia initially to solids now to liquids, 15 kg weight loss over 3 months, and hoarseness. What is the most likely diagnosis and initial investigation?"
    back: "Most likely diagnosis: Esophageal carcinoma (likely SCC given location if upper/middle, or adenocarcinoma if lower third with GERD history)\nInitial investigation: Endoscopy with biopsy (confirms diagnosis, determines histology, assesses location and resectability)\nAdditional workup: CT chest/abdomen/pelvis, EUS for locoregional staging, bronchoscopy to rule out airway invasion, PET-CT for metastases\n\nProgressive mechanical dysphagia (solids before liquids) + constitutional symptoms + hoarseness (recurrent laryngeal nerve invasion) strongly suggests esophageal carcinoma. Endoscopic biopsy is the gold standard for diagnosis. Hoarseness indicates local invasion and may preclude curative resection."
    difficulty: hard
    tags: [thoracic surgery, esophageal carcinoma, dysphagia, clinical reasoning]
  - front: "A 45-year-old woman presents with sudden-onset chest pain and subcutaneous emphysema after a bout of forceful vomiting. CXR shows pneumomediastinum. What is the diagnosis and management?"
    back: "Diagnosis: Boerhaave's syndrome (spontaneous esophageal perforation)\nManagement:\n1. NPO, IV antibiotics, IV fluids, hemodynamic resuscitation\n2. CT chest with oral + IV contrast to confirm and define extent\n3. Gastrografin esophagram to localize perforation\n4. If <24 hours and healthy esophagus: primary surgical repair with intercostal muscle buttress\n5. If >24 hours or deteriorating: esophageal diversion and exclusion (esophagostomy + gastrostomy/jejunostomy) with delayed reconstruction\nMortality: 10–50% depending on timing\n\nMackler's triad (vomiting + chest pain + subcutaneous emphysema) is classic for Boerhaave's. Pneumomediastinum on CXR is the key radiological sign. Time to diagnosis and repair is the most important prognostic factor — each hour of delay worsens outcomes."
    difficulty: hard
    tags: [thoracic surgery, Boerhaave syndrome, esophageal perforation, pneumomediastinum, emergency management]
  - front: "A 62-year-old woman with known hiatus hernia presents to the ER with chest pain, retching without vomiting, and inability to pass an NG tube. What is the diagnosis and management?"
    back: "Diagnosis: Gastric volvulus (Borchardt's triad: chest pain + retching + inability to pass NG tube) — most likely in the context of a Type III (mixed) hiatus hernia\nManagement:\n- Emergency surgical reduction of gastric volvulus\n- Hernia sac excision, hiatus repair\n- Anti-reflux procedure (Nissen fundoplication)\n- Consider gastropexy to prevent reherniation\n- If high surgical risk: endoscopic reduction + PEG placement to anchor stomach\n\nGastric volvulus is a surgical emergency. The inability to decompress the stomach with NG tube is pathognomonic. If untreated, strangulation and gastric necrosis occur. Type III mixed hernias (GE junction + fundus herniate) are the most common indication for surgical repair."
    difficulty: hard
    tags: [thoracic surgery, gastric volvulus, hiatus hernia, Borchardt triad, emergency]
  - front: "A 55-year-old man with longstanding GERD presents with an anterior mediastinal mass. AFP is 450 ng/mL, β-hCG is 120 IU/L, and LDH is elevated. What is the diagnosis and should a biopsy be performed?"
    back: "Diagnosis: Germ cell tumour (anterior mediastinal primary)\nBiopsy: NOT required — elevated AFP, β-hCG, and LDH are pathognomonic for germ cell tumour; proceed directly to treatment without biopsy\n\nIn an anterior mediastinal mass, the combination of elevated AFP, β-hCG, and LDH is diagnostic for a germ cell tumour. Proceeding to biopsy is unnecessary and exposes the patient to procedural risk. Treatment typically involves chemotherapy (BEP: bleomycin, etoposide, cisplatin) followed by surgical resection if residual mass remains."
    difficulty: medium
    tags: [thoracic surgery, mediastinal masses, germ cell tumour, AFP, beta-hCG]
