# Orthopedics (Orthopedics) - generated from srs-mccqe1
cards:
  - front: "What is the recurrence rate of anterior shoulder dislocation based on age at first dislocation?"
    back: "<20 years: 65-95%, 20-40 years: 60-70%, >40 years: 2-4%\n\nRecurrent dislocation is the most common complication of anterior shoulder dislocation. Young patients have higher recurrence because of greater activity levels and incomplete healing of the capsulolabral complex (Bankart lesion)."
    difficulty: medium
    tags: [orthopedics, shoulder-dislocation]
  - front: "What are the four rotator cuff muscles (SITS) and their functions?"
    back: "Supraspinatus (abduction), Infraspinatus (external rotation), Teres minor (external rotation), Subscapularis (internal rotation and adduction)\n\nAll attach to the greater tuberosity except subscapularis which attaches to the lesser tuberosity. Supraspinatus is most commonly torn due to impingement in the subacromial space. Suprascapular nerve innervates supraspinatus and infraspinatus."
    difficulty: easy
    tags: [orthopedics, rotator-cuff, anatomy]
  - front: "What special tests are used to assess rotator cuff pathology?"
    back: "Jobe's (empty can): supraspinatus. Lift-off/Belly Press: subscapularis. Posterior cuff test: infraspinatus/teres minor. Neer's & Hawkins-Kennedy: impingement. Painful arc: tendinopathy.\n\nA combination of supraspinatus weakness, external rotation weakness, and positive impingement signs best predicts rotator cuff tear. Internal rotation lag test has the highest specificity (97%) for full-thickness tears."
    difficulty: medium
    tags: [orthopedics, rotator-cuff, physical-exam]
  - front: "What is the Rockwood classification for AC joint separation, and when is surgery indicated?"
    back: "Grade I-III: generally non-operative (except Grade III in labourers/athletes). Grade IV-VI: operative. Based on integrity of AC and CC ligaments and direction of clavicular displacement.\n\nGrade I is sprained AC ligament. Grade II is torn AC with sprained CC. Grade III is both torn with superior displacement. Grades IV-VI involve displacement in various directions. Most heal with conservative management."
    difficulty: hard
    tags: [orthopedics, AC-joint, Rockwood]
  - front: "What is the most common location for clavicle fractures?"
    back: "Middle third (80%). Proximal third 5%, distal third 15%.\n\nMiddle-third clavicle fractures are common in children and unite rapidly. Mechanism is usually fall on shoulder (87%). ORIF is considered if shortening >2 cm. Complications include cosmetic bump (most common), pneumothorax, and brachial plexus injury (rare)."
    difficulty: easy
    tags: [orthopedics, clavicle-fracture]
  - front: "What are the three stages of adhesive capsulitis (frozen shoulder)?"
    back: "1. Freezing phase: gradual onset, diffuse pain (6-9 months). 2. Frozen phase: decreased ROM, impacts function (4-9 months). 3. Thawing phase: gradual return of motion.\n\nFrozen shoulder is associated with DM (5%), prolonged immobilization, female gender, and age >40. Primary adhesive capsulitis is idiopathic and usually resolves in 9-18 months. Treatment includes physiotherapy, NSAIDs, steroid injections, and possible manipulation under anesthesia."
    difficulty: easy
    tags: [orthopedics, frozen-shoulder, adhesive-capsulitis]
  - front: "What nerve is most commonly injured in humeral shaft fractures?"
    back: "Radial nerve — especially associated with Holstein-Lewis (distal 1/3) fractures. Presents as wrist drop with sensory loss on dorsum of hand.\n\nRadial nerve palsy is expected to recover spontaneously in 3-4 months. If no recovery, EMG is indicated. Acceptable humeral shaft deformities include <20° anterior angulation, <30° varus, and <3 cm shortening."
    difficulty: medium
    tags: [orthopedics, humeral-shaft-fracture, radial-nerve]
  - front: "What is the most common elbow fracture in children, and what nerve injury is most commonly associated?"
    back: "Supracondylar fracture (peak age ~7 years). Median nerve injury is most commonly associated with extension type.\n\nExtension injuries (>96%) occur via FOOSH. The anterior humeral line should pass through the middle third of the capitellum. Brachial artery injury and compartment syndrome (Volkmann's ischemic contracture) are serious complications."
    difficulty: medium
    tags: [orthopedics, supracondylar-fracture, pediatric]
  - front: "What is the 'terrible triad' of the elbow?"
    back: "Radial head fracture + coronoid fracture + elbow dislocation\n\nThis combination represents a severe elbow injury with significant instability. It typically requires operative management. Radial head fractures are common in young adults (30-60 years) and are classified using the Mason classification."
    difficulty: medium
    tags: [orthopedics, terrible-triad, elbow]
  - front: "What is a Monteggia fracture vs. a Galeazzi fracture?"
    back: "Monteggia: proximal Ulna fracture + radial head dislocation. Galeazzi: distal Radius fracture + DRUJ disruption ('fracture of necessity' — always operative).\n\nRemember: MUG-R — Monteggia = Ulna, Galeazzi = Radius. In all isolated ulna fractures, assess proximal radius to rule out Monteggia. Galeazzi fractures always require ORIF."
    difficulty: medium
    tags: [orthopedics, Monteggia, Galeazzi]
  - front: "What is a Colles' fracture and its classic deformity?"
    back: "Extra-articular transverse distal radius fracture with dorsal displacement ± ulnar styloid fracture. Classic 'dinner fork' deformity. Most common fracture in patients >40 years.\n\nMechanism is FOOSH. Treatment goals are restoring radial height (13 mm), radial inclination (23°), and volar tilt (11°). Smith's fracture is the reverse (volar displacement, 'garden spade' deformity from fall on flexed hand)."
    difficulty: easy
    tags: [orthopedics, Colles-fracture, distal-radius]
  - front: "Why is the scaphoid fracture clinically important and how is it managed if x-ray is initially negative?"
    back: "Blood supply enters at the distal pole, so proximal fractures have high risk of AVN. If snuffbox tenderness but negative x-ray, treat as scaphoid fracture (thumb spica cast) and repeat imaging in 2 weeks (CT or MRI).\n\nScaphoid is the most common carpal bone fracture. Proximal pole fractures have up to 100% AVN rate. Waist fractures have 80-90% healing rates. Non-union leads to SNAC wrist (scaphoid nonunion advanced collapse)."
    difficulty: medium
    tags: [orthopedics, scaphoid-fracture, AVN]
  - front: "What are the cervical nerve root levels and their key motor and reflex associations?"
    back: "C5: deltoid/biceps, biceps reflex. C6: biceps/brachioradialis/wrist extension, brachioradialis reflex. C7: triceps/wrist flexion/finger extension, triceps reflex. C8: interossei/digital flexors, finger jerk.\n\nCervical nerve roots exit above their respective vertebra (C4 root exits above C4), except C8 which exits below C7. Radiculopathy is nerve root impingement; myelopathy is spinal cord impingement."
    difficulty: medium
    tags: [orthopedics, cervical-spine, radiculopathy]
  - front: "What are the lumbar nerve root levels (L4, L5, S1) and their motor, sensory, and reflex associations?"
    back: "L4: quads (knee extension), medial malleolus sensation, knee reflex, femoral stretch test. L5: EHL/tibialis anterior, 1st dorsal webspace, heel walking. S1: gastrocnemius (plantar flexion), lateral foot, ankle reflex, toe walking.\n\nMost common disc herniations are L5-S1 > L4-5. Posterolateral herniations compress the traversing (lower) root (e.g., L4-5 disc → L5 root). Central herniations can cause cauda equina syndrome."
    difficulty: medium
    tags: [orthopedics, lumbar-spine, radiculopathy]
  - front: "What differentiates neurogenic from vascular claudication?"
    back: "Neurogenic: position-dependent, variable walking distance, relieved by flexion/sitting (10 min), aggravated by standing/walking. Vascular: exercise-dependent, reproducible distance, relieved by stopping exercise (2 min).\n\nNeurogenic claudication is caused by spinal stenosis and improves with spinal flexion which opens the spinal canal. Vascular claudication is caused by peripheral arterial disease and is relieved simply by stopping exercise."
    difficulty: medium
    tags: [orthopedics, claudication, spinal-stenosis]
  - front: "What is cauda equina syndrome, and why is it a surgical emergency?"
    back: "Compression of cauda equina nerve roots causing bilateral leg pain/weakness, saddle anesthesia, bowel/bladder dysfunction (urinary retention). Surgical emergency requiring urgent decompression.\n\nMost commonly caused by central lumbar disc herniation. Post-void residual >100 mL should heighten suspicion. Present in 1-10% of disc herniations. Delay in surgical decompression leads to permanent neurological deficit."
    difficulty: medium
    tags: [orthopedics, cauda-equina, emergency]
  - front: "How are femoral neck fractures classified using the Garden classification?"
    back: "Type I: incomplete, non-displaced (valgus). Type II: complete, non-displaced. Type III: complete, partially displaced (varus). Type IV: complete, fully displaced. Types I-II: internal fixation. Types III-IV in elderly: hemi/total hip arthroplasty.\n\nFemoral neck fractures are intracapsular and the blood supply (medial/lateral femoral circumflex arteries) is susceptible to disruption, leading to AVN. Young patients with displaced fractures receive ORIF to preserve the native hip."
    difficulty: hard
    tags: [orthopedics, hip-fracture, Garden-classification]
  - front: "What is the most important clinical sign that differentiates posterior from anterior hip dislocation?"
    back: "Posterior (90%): shortened, adducted, internally rotated limb. Anterior: shortened, abducted, externally rotated limb.\n\nPosterior dislocation occurs from axial load to flexed/adducted knee (dashboard injury). Sciatic nerve palsy occurs in 25%. Hip dislocations must be reduced within 6 hours to decrease AVN risk."
    difficulty: medium
    tags: [orthopedics, hip-dislocation]
  - front: "What are the key physical exam tests for ACL injury?"
    back: "Anterior drawer test (knee at 90°), Lachman test (knee at 20-30° — most reliable), Pivot shift test. Lachman has positive LR of 25.0 and negative LR of 0.1.\n\nACL tears are much more common than PCL tears. Mechanism is typically non-contact pivoting/deceleration. Treatment depends on patient activity level: non-operative for low-demand patients, ACL reconstruction for athletes."
    difficulty: medium
    tags: [orthopedics, ACL, knee-exam]
  - front: "What is the McMurray test and what does it evaluate?"
    back: "Tests for meniscal tear. With knee flexed, palpate joint line for painful pop/click while rotating foot (internal rotation for lateral meniscus, external rotation for medial meniscus) and extending knee.\n\nMcMurray test has a positive LR of only 1.3. Joint line tenderness is the simplest meniscal test. Locking, clicking, and effusion suggest intra-articular pathology. MRI is the gold standard for diagnosis."
    difficulty: medium
    tags: [orthopedics, meniscal-tear, knee-exam]
  - front: "What is the OA findings mnemonic for hip arthritis x-ray?"
    back: "LOSS: Loss of joint space, Osteophytes, Subchondral sclerosis, Subchondral cysts\n\nOA presents with pain and stiffness aggravated by activity, relieved by rest. Internal rotation is usually lost first. Treatment is non-operative initially (weight loss, physiotherapy, NSAIDs), with total hip arthroplasty for advanced disease."
    difficulty: easy
    tags: [orthopedics, osteoarthritis, hip]
  - front: "What is the Tile classification of pelvic fractures?"
    back: "Type A: rotationally and vertically stable. Type B: rotationally unstable, vertically stable (e.g., open book = B1, lateral compression = B2). Type C: rotationally and vertically unstable.\n\nEmergency management includes pelvic binder/sheet, IV fluids/blood, and external fixation or angiography/embolization. Pelvic fractures can cause life-threatening hemorrhage and genitourinary injury. Unstable fractures (Type C) require ORIF."
    difficulty: hard
    tags: [orthopedics, pelvic-fracture, Tile-classification]
  - front: "A 45-year-old man presents with acute low back pain radiating to the left leg below the knee, worsened by sitting. Straight leg raise is positive at 40 degrees. What is the most likely diagnosis and initial management?"
    back: "Lumbar disc herniation with L5 or S1 radiculopathy (sciatica). Initial management: acetaminophen + NSAIDs, prone extension exercises, supine '7' lie position, lumbar roll. Consider opioids only if first-line insufficient.\n\nPositive straight leg raise at <70 degrees (especially with ankle dorsiflexion) indicates lumbosacral nerve root irritation. 90% of low back pain resolves in 6 weeks. Red flags include cauda equina syndrome (saddle anesthesia, urinary retention, fecal incontinence)."
    difficulty: medium
    tags: [orthopedics, low-back-pain, neurology, family-medicine]
  - front: "What are the red flags in low back pain that require urgent or emergent referral?"
    back: "EMERGENCY (hours): cauda equina syndrome (progressive loss of bowel/bladder control, saddle anesthesia). URGENT (24-48h): severe worsening pain especially at night, significant trauma, weight loss/cancer history/fever. SOON: age >50 with new onset, widespread neurological signs.\n\nCauda equina syndrome is a surgical emergency requiring immediate referral. Non-mechanical causes account for only 2% of back pain but include cancer, infection, and inflammatory conditions that need prompt evaluation."
    difficulty: medium
    tags: [orthopedics, low-back-pain, emergency-medicine, red-flags]
  - front: "What are the red flags for non-mechanical low back pain suggesting cauda equina syndrome?"
    back: "Sudden or progressive onset of loss of bladder/bowel control, saddle anesthesia, bilateral lower extremity weakness, and areflexia. This is a surgical emergency requiring referral within hours.\n\nOnly 2% of low back pain has non-mechanical causes. 90% of mechanical low back pain resolves within 6 weeks. A positive straight leg raise at <70° with aggravation by ankle dorsiflexion indicates sciatica."
    difficulty: medium
    tags: [orthopedics, neurology, low back pain, emergency]
  - front: "What is the most common type of shoulder dislocation (>90%) and what direction does the humeral head displace?"
    back: "Anterior shoulder dislocation (>90% of cases). The humeral head displaces anteriorly and inferiorly out of the glenoid fossa.\n\nAnterior dislocations are far more common than posterior (5%) or inferior (luxatio erecta, rare). The mechanism is typically forced abduction, extension, and external rotation. Posterior dislocations classically occur with seizures or electrocution."
    difficulty: easy
    tags: [shoulder, dislocation, orthopedics, trauma]
  - front: "What are the two main osseous complications of anterior shoulder dislocation?"
    back: "Hill-Sachs lesion (compression fracture of the posterolateral humeral head from impact with the anterior glenoid rim) and Bankart lesion (avulsion of the anteroinferior glenoid labrum).\n\nBoth lesions predispose to recurrent instability. A bony Bankart lesion (glenoid rim fracture) is particularly associated with recurrent dislocations. These lesions are best seen on MRI (Bankart) or CT (Hill-Sachs and bony Bankart)."
    difficulty: easy
    tags: [shoulder, dislocation, Hill-Sachs, Bankart, orthopedics]
  - front: "What post-reduction immobilization is used for anterior vs. posterior shoulder dislocation?"
    back: "Anterior dislocation: sling x 3 weeks (avoid abduction and external rotation). Posterior dislocation: sling in abduction and external rotation x 3 weeks.\n\nImmobilization position is opposite to the direction of dislocation to prevent re-dislocation. Both are followed by shoulder rehabilitation focusing on dynamic stabilizer strengthening."
    difficulty: easy
    tags: [shoulder, dislocation, reduction, management]
  - front: "What is the recurrence rate of anterior shoulder dislocation in patients under 20 years old?"
    back: "65-95% recurrence rate in patients under 20 years old.\n\nRecurrence rate is strongly age-dependent: <20 yr = 65-95%, 20-40 yr = 60-70%, >40 yr = 2-4%. Younger patients have greater inherent laxity and activity levels, explaining the dramatically higher recurrence. Surgical stabilization is often considered for young athletes after first dislocation."
    difficulty: easy
    tags: [shoulder, dislocation, recurrence, prognosis]
  - front: "Name the four rotator cuff muscles (SITS mnemonic) and their primary functions."
    back: "Supraspinatus (abduction), Infraspinatus (external rotation), Teres minor (external rotation), Subscapularis (internal rotation and adduction).\n\nAll four muscles attach the scapula to the humerus and stabilize the humeral head in the glenoid. Supraspinatus is supplied by the suprascapular nerve; infraspinatus by suprascapular nerve; teres minor by axillary nerve; subscapularis by subscapular nerve."
    difficulty: easy
    tags: [rotator cuff, anatomy, shoulder, SITS]
  - front: "What nerve supplies each rotator cuff muscle?"
    back: "Supraspinatus: suprascapular nerve. Infraspinatus: suprascapular nerve. Teres minor: axillary nerve. Subscapularis: subscapular nerve.\n\nKnowledge of nerve supply is essential for localizing lesions. Axillary nerve injury (common in shoulder dislocations and proximal humerus fractures) will affect teres minor and deltoid. Suprascapular nerve injury affects both supraspinatus and infraspinatus."
    difficulty: medium
    tags: [rotator cuff, nerve supply, anatomy, shoulder]
  - front: "What is the most common cause of subacromial impingement syndrome (outlet impingement)?"
    back: "Relative imbalance of rotator cuff and larger shoulder muscles, allowing superior translation and wear of rotator cuff tendons between the humeral head and the undersurface of the acromion, AC joint, and coracoacromial ligament.\n\nAlso contributing: glenohumeral muscle weakness, scapular muscle weakness (poor posture), acromial abnormalities (Type III hooked acromion, osteophytes). The supraspinatus tendon is most commonly compressed. Painful arc syndrome occurs between 60-120° of abduction."
    difficulty: easy
    tags: [rotator cuff, impingement, subacromial, shoulder]
  - front: "What are the three acromion morphology types and which is associated with highest impingement risk?"
    back: "Type I (flat), Type II (curved), Type III (hooked). Type III (hooked) acromion is associated with the highest risk of rotator cuff impingement and tears.\n\nThe hooked undersurface of the Type III acromion mechanically compresses the supraspinatus tendon during shoulder elevation. Acromioplasty removes the anterior undersurface of the acromion to relieve this compression in surgical cases."
    difficulty: easy
    tags: [acromion, impingement, shoulder, anatomy]
  - front: "What are the clinical features of rotator cuff disease (impingement/tendinopathy)?"
    back: "Insidious onset; night pain; difficulty sleeping on affected side; pain worsens with active motion especially overhead; weakness and loss of ROM (especially 90-130°); tenderness over greater tuberosity; pain with active abduction >90° (painful arc).\n\nPassive movement is generally permitted because extrinsic compression is relieved. Night pain is a hallmark feature. The painful arc between 60-120° (or 90-130°) occurs as the supraspinatus tendon is compressed during abduction in this range."
    difficulty: easy
    tags: [rotator cuff, impingement, clinical features, shoulder]
  - front: "What imaging modalities are used to assess rotator cuff tears and what does each show?"
    back: "X-ray: high-riding humerus (large tear), sclerosis of acromion/greater tuberosity. MRI: coronal/sagittal/axial orientations assess full/partial tears and tendinopathy; arthrogram shows dye leaking through tear (geyser sign). Arthrogram: full-thickness tears. Ultrasound: adjunct but limited for intra-articular pathology.\n\nMRI is the gold standard for rotator cuff evaluation. A high-riding humerus on plain film (reduced acromiohumeral interval <7 mm) indicates a massive tear. Ultrasound is operator-dependent but cost-effective for large tears."
    difficulty: medium
    tags: [rotator cuff, imaging, MRI, shoulder, investigations]
  - front: "What is the first-line treatment for rotator cuff disease regardless of MRI severity?"
    back: "Physiotherapy (rotator cuff strengthening and scapular stabilization), activity modification, non-narcotic analgesia, and corticosteroid injection if needed.\n\nCanadian guidelines emphasize non-operative management as first-line for all severities of rotator cuff disease. Surgery is indicated only after failure of 2-3 months of physiotherapy and 1-2 corticosteroid injections. Even large tears can improve with conservative management."
    difficulty: easy
    tags: [rotator cuff, treatment, physiotherapy, shoulder]
  - front: "What does Jobe's (Empty Can) test assess and what is a positive result?"
    back: "Tests supraspinatus. Shoulder at 90° abduction, 30° horizontal flexion (scapular plane), thumb pointing down (internal rotation). Positive: weakness or pain with examiner's downward pressure suggests supraspinatus tear.\n\nThe 'empty can' position maximally isolates the supraspinatus and eliminates deltoid substitution. The test has moderate sensitivity (~70%) and specificity for supraspinatus pathology. It should be combined with other tests (Neer's, Hawkins-Kennedy) for higher diagnostic accuracy."
    difficulty: easy
    tags: [rotator cuff, special tests, Jobe, empty can, supraspinatus]
  - front: "What does the Lift-off Test assess and what is a positive result?"
    back: "Tests subscapularis. Arm internally rotated with dorsum of hand on lower back; patient lifts hand away from back. Positive: inability to actively lift hand away from back suggests subscapularis tear.\n\nIf too painful, the Belly Press Test is used instead (patient presses palm into abdomen; inability to maintain wrist extension indicates subscapularis weakness). The subscapularis is the only anterior rotator cuff muscle and is the most important internal rotator."
    difficulty: easy
    tags: [rotator cuff, special tests, lift-off, subscapularis]
  - front: "What does Neer's Test assess and what is a positive result?"
    back: "Tests rotator cuff impingement. Passive shoulder forward flexion while examiner stabilizes the scapula. Positive: pain elicited between 130-170° suggests impingement of the supraspinatus against the anterior acromion.\n\nNeer's test has high sensitivity (~79%) but moderate specificity (~53%) for impingement. It is used alongside Hawkins-Kennedy test, which is more sensitive. A negative impingement sign has a high negative predictive value (NPV 97.2%) for ruling out rotator cuff tears."
    difficulty: easy
    tags: [rotator cuff, Neers test, impingement, special tests]
  - front: "What does the Hawkins-Kennedy Test assess and what indicates a positive result?"
    back: "Tests rotator cuff impingement. Shoulder flexed to 90°, then passively internally rotated. Positive: pain with internal rotation suggests impingement.\n\nHawkins-Kennedy mechanically compresses the supraspinatus tendon against the coracoacromial ligament. It has higher sensitivity (~79%) than Neer's test for impingement. The combination of negative Neer's and Hawkins-Kennedy signs largely excludes significant impingement."
    difficulty: easy
    tags: [rotator cuff, Hawkins-Kennedy, impingement, special tests]
  - front: "What does O'Brien's Test assess and what constitutes a positive result?"
    back: "Tests for SLAP (superior labrum anterior to posterior) lesion. Arm forward flexed 90°, adducted 10-15°, internally rotated (thumb down) — downward force applied. Repeated with arm externally rotated. Positive: pain or clicking in glenohumeral joint in internal but not external rotation.\n\nSLAP lesions involve the superior labrum and biceps anchor. O'Brien's test (active compression test) is the most sensitive clinical test for SLAP tears. MRI arthrogram is the imaging modality of choice for diagnosis. Surgical repair (arthroscopic) is indicated for failed conservative management."
    difficulty: medium
    tags: [SLAP lesion, OBrien test, labrum, shoulder, special tests]
  - front: "What is the Rockwood classification of AC joint separations and what are the treatment principles for each grade?"
    back: "Grade I: joint sprain, AC ligament sprained, CC normal — non-operative. Grade II: AC ligament torn, CC sprained, reducible — non-operative. Grade III: both AC and CC torn, 5 mm elevation, reducible — usually non-operative (operative if labourer or high-level athlete). Grade IV-VI: operative in most cases.\n\nGrades IV-VI are distinguished by direction: IV = clavicle displaced posteriorly into trapezius, V = herniated through deltotrapezial fascia into subcutaneous tissue, VI = inferior to acromion/coracoid (rare). Grade III heals with step deformity but most patients are fully functional in 4-6 months."
    difficulty: medium
    tags: [AC joint, Rockwood classification, shoulder, treatment]
  - front: "What clinical sign is pathognomonic of AC joint dislocation?"
    back: "Piano key sign: palpable step deformity between the distal clavicle and acromion; pressing the elevated clavicle downward causes a spring-back like a piano key.\n\nThe step deformity results from the clavicle riding superiorly when both AC and CC ligaments are torn (Grade III and above). The Zanca view (10-15° cephalic tilt) is the best x-ray to evaluate AC joint separation and compare CC distance bilaterally."
    difficulty: easy
    tags: [AC joint, piano key sign, dislocation, shoulder]
  - front: "What is the most common location of clavicle fractures and what are the treatment principles by location?"
    back: "Middle third (80%) is most common. Treatment: medial and middle-third — sling 1-2 weeks for nondisplaced; ORIF if shortened >2 cm. Distal third — sling if undisplaced with intact ligaments; ORIF if displaced (CC ligament injured).\n\nClavicle fractures are common in children and heal rapidly. ORIF for displaced midshaft fractures reduces nonunion rate from ~14.5% (non-operative) to ~1.7% and improves early functional outcomes. Associated injuries include pneumothorax, brachial plexus injury (proximal third), and rib fractures."
    difficulty: easy
    tags: [clavicle fracture, ORIF, orthopedics, treatment]
  - front: "What is the mechanism and mechanism of injury for clavicle fractures?"
    back: "Fall on shoulder (87%), direct trauma to clavicle (7%), FOOSH (6%).\n\nThe middle third is the most common site because the clavicle is thinnest and lacks muscular support in this region. The proximal (5%) and distal (15%) thirds are protected by the SCJ and ACJ ligamentous attachments respectively."
    difficulty: easy
    tags: [clavicle fracture, mechanism, orthopedics]
  - front: "What is the key clinical feature distinguishing frozen shoulder (adhesive capsulitis) from rotator cuff disease?"
    back: "Frozen shoulder causes decreased BOTH active AND passive ROM; rotator cuff disease typically reduces active ROM but passive ROM is relatively preserved.\n\nThe capsular pattern of frozen shoulder is: external rotation > abduction > internal rotation (all reduced). The global reduction in passive motion reflects true capsular contracture, not just muscular or tendinous pathology. This distinction is critical for diagnosis and management."
    difficulty: medium
    tags: [frozen shoulder, adhesive capsulitis, differential diagnosis, shoulder]
  - front: "What conditions are associated with increased incidence of adhesive capsulitis?"
    back: "Prolonged immobilization (most significant), female gender, age >49, diabetes mellitus (5%), cervical disc disease, hyperthyroidism, MI, trauma and surgery, autoimmune disease.\n\nDM is the most important medical association — patients with DM have a 10-20% lifetime risk of adhesive capsulitis. Management during the freezing phase focuses on ROM maintenance; in the thawing phase, aggressive physiotherapy or manipulation under anesthesia may be required."
    difficulty: easy
    tags: [frozen shoulder, adhesive capsulitis, risk factors]
  - front: "What is the Neer classification of proximal humeral fractures and what determines a 'displaced' fragment?"
    back: "Neer classification divides the proximal humerus into 4 parts: articular segment, greater tuberosity, lesser tuberosity, and shaft. Displacement is defined as >1 cm translation or >45° angulation. Classification is based on number of displaced parts (1-4), not number of fracture lines.\n\nOne-part fractures (85% of proximal humerus fractures) have no displaced parts regardless of number of fracture lines — treated non-operatively. Four-part fractures involve the surgical neck and both tuberosities displaced — highest risk of AVN and often require hemiarthroplasty or reverse TSA."
    difficulty: medium
    tags: [proximal humerus fracture, Neer classification, orthopedics]
  - front: "What nerve is most commonly injured with proximal humeral fractures and how is it tested?"
    back: "Axillary nerve (45% of proximal humerus fractures). Tested by: deltoid contraction (motor) and sensation over the 'regimental badge' area (lateral deltoid skin).\n\nThe axillary nerve wraps around the surgical neck of the humerus, making it vulnerable to injury with fractures at this level or with shoulder dislocations. Most axillary nerve injuries are neuropraxias that recover spontaneously. Persistent deficit warrants EMG/NCS at 3 months."
    difficulty: easy
    tags: [proximal humerus fracture, axillary nerve, neurovascular, complications]
  - front: "What nerve is tested before and after treatment of humeral shaft fractures, and what deficit does injury cause?"
    back: "Radial nerve. Injury causes wrist drop (weakness of wrist and finger extension) and sensory impairment over the dorsum of the hand.\n\nThe radial nerve is most vulnerable in the distal third of the humerus (Holstein-Lewis fracture), where it pierces the lateral intermuscular septum. Radial nerve palsy occurs in ~18% of humeral shaft fractures. Most (70-90%) resolve spontaneously within 3-4 months; EMG/NCS if no recovery by 4 months."
    difficulty: easy
    tags: [humeral shaft fracture, radial nerve, wrist drop, complications]
  - front: "What are the acceptable deformities for non-operative management of humeral shaft fractures?"
    back: "Less than 20° anterior angulation, less than 30° varus angulation, and less than 3 cm of shortening.\n\nThe shoulder's compensatory ROM (especially in abduction/adduction and flexion/extension) allows tolerance of significant humeral shaft deformity. The hanging cast followed by Sarmiento functional brace is the standard non-operative approach. Operative indications include the NO CAST criteria, pathological fractures, and 'floating elbow'."
    difficulty: medium
    tags: [humeral shaft fracture, non-operative, deformity, management]
  - front: "What is the most common site of humeral shaft non-union?"
    back: "Middle third of the humeral shaft.\n\nThe middle third has the poorest blood supply and is most susceptible to non-union, especially with transverse fractures. The radial nerve also courses through this region in the spiral groove. Non-union may require ORIF with bone grafting."
    difficulty: easy
    tags: [humeral shaft fracture, non-union, complications]
  - front: "What is the anterior humeral line and what does disruption suggest?"
    back: "An imaginary line drawn along the anterior cortex of the humerus on lateral x-ray that normally passes through the middle third of the capitellum. If it passes through the anterior third of the capitellum or misses it, a supracondylar fracture (posterior displacement of the capitellum) should be suspected.\n\nThe anterior humeral line is a key radiographic landmark for supracondylar fractures, especially in children. In extension-type supracondylar fractures (>96%), the distal fragment tilts posteriorly, moving the capitellum posteriorly relative to this line."
    difficulty: medium
    tags: [supracondylar fracture, anterior humeral line, radiology, pediatric]
  - front: "What is the most common elbow fracture in the pediatric population and what is the peak age?"
    back: "Supracondylar fracture of the humerus, peak age approximately 7 years old.\n\nSupracondylar fractures account for ~60% of elbow fractures in children. The mechanism is >96% extension injuries via FOOSH (e.g., falling from monkey bars). The median nerve is most commonly injured with extension-type fractures (inability to make 'OK' sign, numbness in volar 1st-3rd digits)."
    difficulty: easy
    tags: [supracondylar fracture, pediatric, elbow, orthopedics]
  - front: "What is the 'brachialis/pucker sign' in supracondylar fractures?"
    back: "Ecchymosis and/or dimpling of the skin in the antecubital fossa, indicating the proximal fracture fragment has pierced the brachialis muscle and tented the skin.\n\nThe pucker sign indicates a significantly displaced fracture where the proximal fragment protrudes anteriorly into the soft tissues. It typically requires operative treatment (closed reduction with percutaneous pinning) and indicates risk of vascular injury (brachial artery kinking)."
    difficulty: medium
    tags: [supracondylar fracture, pucker sign, brachialis, clinical features]
  - front: "What is Volkmann's ischemic contracture and what causes it?"
    back: "Volkmann's ischemic contracture is a fixed flexion deformity of the forearm and hand due to ischemic necrosis of the forearm flexor muscles, caused by compartment syndrome (most commonly from a supracondylar fracture with vascular injury).\n\nThe brachial artery can kink when the distal fragment tilts posteriorly in extension-type supracondylar fractures. The classic presentation is the 5 P's (pain with passive stretch, pulselessness, pallor, paresthesias, paralysis). Emergency fasciotomy is required; established contracture requires surgical release."
    difficulty: medium
    tags: [Volkmanns contracture, compartment syndrome, supracondylar, complications]
  - front: "What does a fat pad sign on lateral elbow x-ray indicate?"
    back: "Presence of elbow joint effusion. An anterior fat pad ('sail sign') can be normal; a posterior fat pad is always abnormal and indicates effusion, which may represent an occult fracture (e.g., radial head fracture).\n\nThe posterior fat pad is normally hidden in the olecranon fossa. Any effusion displaces it posteriorly and makes it visible. In adults with a posterior fat pad and mechanism of injury, a radial head fracture should be assumed even if not visible on x-ray; treat as Mason Class I."
    difficulty: easy
    tags: [fat pad sign, sail sign, elbow, radiology, radial head fracture]
  - front: "What is the Mason Classification of radial head fractures and what is the treatment for each class?"
    back: "Class I: nondisplaced (<2 mm) — elbow slab or sling x 3-5 days with early ROM. Class II: displaced (>2 mm) — ORIF if angulation >30°, involves ≥1/3 of radial head, or ≥3 mm joint incongruity/block to rotation. Class III: comminuted — radial head excision + prosthesis. Class IV: comminuted + posterior elbow dislocation — ORIF or radial head excision with prosthesis.\n\nEarly ROM is critical to prevent stiffness — elbow should not be immobilized >2-3 weeks for any radial head fracture. The terrible triad (radial head fracture + coronoid fracture + elbow dislocation) is a highly unstable injury requiring operative management."
    difficulty: medium
    tags: [radial head fracture, Mason classification, treatment, elbow]
  - front: "What is the terrible triad of the elbow?"
    back: "Radial head fracture + coronoid fracture + elbow dislocation.\n\nThe terrible triad is a complex elbow injury associated with high instability and poor outcomes. Treatment requires surgical repair: coronoid fixation, radial head repair or replacement, and lateral collateral ligament repair. Even with optimal treatment, outcomes can be unsatisfactory."
    difficulty: easy
    tags: [terrible triad, elbow, radial head, coronoid, dislocation]
  - front: "What is the mechanism and treatment of an olecranon fracture?"
    back: "Mechanism: direct blow to point of elbow (posterior aspect) or FOOSH (transverse/oblique). Treatment: non-displaced (<2 mm, intact extensor mechanism) — cast in 90° flexion x 2-3 weeks, then ROM. Displaced or non-intact extensor mechanism — operative (ORIF).\n\nThe triceps attaches to the olecranon via the triceps tendon, creating an avulsion force in FOOSH injuries. Loss of active extension is the hallmark of olecranon fractures (disrupted extensor mechanism). Tension band wiring is the classic technique for transverse fractures."
    difficulty: easy
    tags: [olecranon fracture, elbow, treatment, triceps]
  - front: "What is the third most common joint dislocation (after shoulder and patella), what direction is most common, and what is the treatment?"
    back: "Elbow dislocation. 80% are posterior/posterolateral. Treatment: closed reduction under conscious sedation (Parvin's method — patient prone, arm hanging with gentle traction), followed by long-arm splint in 90° flexion, early ROM within 2 weeks.\n\nElbow dislocations can be simple (no associated fractures) or complex (with fractures and ligament disruption). Neurovascular structures at risk: median nerve, ulnar nerve, and brachial artery. The radio-capitellar line (longitudinal line through radial neck through capitellum center) is used to diagnose radial head dislocation."
    difficulty: easy
    tags: [elbow dislocation, reduction, treatment, orthopedics]
  - front: "What is the radio-capitellar line and what does disruption indicate?"
    back: "An imaginary line drawn along the longitudinal axis of the radial neck that should pass through the centre of the capitellum in all degrees of elbow flexion. Failure to pass through the capitellum centre indicates dislocation of the radial head.\n\nThe radio-capitellar line is used on all elbow x-rays to detect radial head dislocations, which may be subtle. This is especially important in Monteggia fractures where the proximal ulna fracture may be obvious but the radial head dislocation can be missed."
    difficulty: easy
    tags: [radio-capitellar line, elbow, radiology, Monteggia]
  - front: "What is lateral epicondylitis ('tennis elbow')? What is the mechanism and treatment?"
    back: "Inflammation of the common extensor tendon at the lateral epicondyle. Mechanism: repeated/sustained contraction of forearm extensor muscles (chronic overuse). Pain on resisted wrist extension. Treatment: rest, ice, NSAIDs, brace/strap, physiotherapy, corticosteroid injection; surgery (release) if failed 6-12 months conservative treatment.\n\nTennis elbow is actually more common in non-tennis players. Pain is at the lateral epicondyle, reproduced by resisted wrist/finger extension. The common extensor origin (primarily ECRB) undergoes angiofibroblastic tendinosis. It is self-limited but can take 6-18 months to resolve."
    difficulty: easy
    tags: [tennis elbow, lateral epicondylitis, elbow, treatment]
  - front: "How do you distinguish lateral epicondylitis from medial epicondylitis clinically?"
    back: "Lateral epicondylitis (tennis elbow): pain at lateral epicondyle, reproduced by resisted wrist extension. Medial epicondylitis (golfer's elbow): pain at medial epicondyle, reproduced by resisted wrist flexion.\n\nMemory aid: Tennis = laTeral = exTension. Golfer's elbow is less common. Both are overuse injuries, both self-limited, and both treated initially with conservative measures. Medial epicondylitis must be distinguished from ulnar nerve pathology (cubital tunnel syndrome)."
    difficulty: easy
    tags: [epicondylitis, tennis elbow, golfers elbow, lateral, medial]
  - front: "Where is the injection landmark for elbow joint injection?"
    back: "Centre of the triangle formed by the lateral epicondyle, radial head, and olecranon tip.\n\nThis soft spot triangle (also called the 'soft spot' of the elbow) corresponds to the annular ligament region and allows safe access to the elbow joint. Palpation of the radial head (pronation/supination reveals it) and olecranon landmarks guides needle placement."
    difficulty: easy
    tags: [elbow injection, landmark, procedure]
  - front: "What is the Bado classification of Monteggia fractures?"
    back: "Type I: anterior radial head dislocation + proximal/middle ulnar fracture (60%, most common, most common in pediatrics). Type II: posterior dislocation + proximal/middle ulnar fracture (most common in adults). Type III: lateral dislocation + metaphyseal ulnar fracture (20%). Type IV: combined proximal fractures of ulna and radius + radial head dislocation in any direction (<5%).\n\nThe direction of the radial head dislocation corresponds to the apex of the ulnar fracture deformity. All isolated ulna fractures must have the proximal radius assessed (radio-capitellar line) to rule out Monteggia fracture. Adults with unstable Monteggia fractures require ORIF."
    difficulty: medium
    tags: [Monteggia fracture, Bado classification, forearm, radial head]
  - front: "What is the most common nerve injury in Monteggia fractures?"
    back: "Posterior interosseous nerve (PIN) injury, which is the deep branch of the radial nerve. Most resolve spontaneously — observe for 3 months before further investigation.\n\nThe PIN courses around the radial head through the radial tunnel. Anterior dislocation of the radial head in Type I Monteggia fractures can stretch or entrap the PIN. PIN injury causes weakness of finger/thumb extension and wrist radial deviation (ECRL is spared as it branches before the PIN)."
    difficulty: medium
    tags: [Monteggia fracture, PIN injury, posterior interosseous nerve, complications]
  - front: "What is a Nightstick fracture and what are the treatment principles?"
    back: "Isolated ulnar shaft fracture without radial head dislocation (direct downward blow while blocking, e.g., protecting face). Non-displaced: below-elbow cast x 10 days then forearm brace ~8 weeks. Displaced (>50% shaft displacement or >10° angulation): ORIF.\n\nThe term reflects the classic mechanism of a raised arm blocking a blow (e.g., from a nightstick). Unlike Monteggia fractures, the radial head is reduced and the PRUJ is intact. The threshold for operative management is stricter than humeral fractures because perfect forearm alignment is needed for pronation/supination."
    difficulty: easy
    tags: [nightstick fracture, ulna, forearm, treatment]
  - front: "What is a Galeazzi fracture and what is the treatment principle?"
    back: "Fracture of the distal radial shaft (most commonly distal 1/3) with disruption of the distal radioulnar joint (DRUJ). Mechanism: FOOSH with axial loading of pronated forearm or direct wrist trauma. Treatment: ORIF (goal is anatomic reduction to restore forearm rotation).\n\nGaleazzi fractures are the reverse of Monteggia. They are 3x more common than Monteggia fractures. Non-operative management yields poor results for displaced forearm fractures in adults. The DRUJ instability must be assessed intraoperatively; if unstable, K-wire stabilization of DRUJ for 4-6 weeks is added."
    difficulty: medium
    tags: [Galeazzi fracture, DRUJ, forearm, ORIF]
  - front: "Why must radius and ulna shaft fractures (both-bone forearm fractures) be treated with anatomic reduction?"
    back: "Because imperfect alignment significantly limits forearm pronation and supination, which requires the radius to rotate around the ulna in an anatomically precise relationship.\n\nBoth-bone forearm fractures in adults require ORIF with plates and screws; closed reduction with immobilization yields poor results. Complications include compartment syndrome, soft tissue contracture limiting rotation, and radioulnar synostosis (15% in Monteggia fractures)."
    difficulty: easy
    tags: [forearm fractures, both-bone, ORIF, pronation, supination]
  - front: "What is the three-joints-at-the-elbow mnemonic relevant to elbow pathology?"
    back: "Humeroradial joint (radiohumeral), humeroulnar joint (ulnohumeral), and proximal radioulnar joint (PRUJ).\n\nUnderstanding these three articulations is critical for elbow pathology: Monteggia fractures disrupt the PRUJ, Galeazzi fractures disrupt the DRUJ, elbow dislocations primarily involve the humeroulnar joint. The elbow has complex biomechanics requiring all three joints for full function."
    difficulty: easy
    tags: [elbow anatomy, joints, orthopedics]
  - front: "What is the distal goal for restoration of elbow ROM after distal humerus fracture, and why is early ROM important?"
    back: "Goal is to restore functional ROM of at least 30-130° of flexion. Early ROM is critical because the elbow is highly prone to stiffness with prolonged immobilization; adult distal humerus fractures are almost always treated operatively for this reason.\n\nFunctional ROM of the elbow (30-130°) is needed for most activities of daily living. The elbow has the least tolerance of any joint for prolonged immobilization due to the dense ligamentous and capsular structure. Unsatisfactory outcomes occur in ~25% of distal humerus fractures."
    difficulty: easy
    tags: [distal humerus fracture, ROM, elbow, treatment]
  - front: "What is the most common complication of lateral epicondylitis vs. elbow dislocation vs. supracondylar fracture?"
    back: "Lateral epicondylitis: self-limited but takes 6-18 months to resolve (no single most common complication listed). Elbow dislocation: stiffness (loss of extension) is most common. Supracondylar fracture: stiffness is most common; specific: cubitus varus from malalignment.\n\nCubitus varus (gunstock deformity) is a cosmetic complication from malreduction of supracondylar fractures where the distal fragment tilts into varus. It does not typically cause functional limitation but may require corrective osteotomy. Stiffness is the most functionally limiting complication across elbow injuries."
    difficulty: medium
    tags: [elbow, complications, stiffness, cubitus varus, supracondylar]
  - front: "What is the most common complication of clavicle fractures?"
    back: "Cosmetic bump (malunion with callus formation), which is the most common complication.\n\nMiddle-third clavicle fractures heal with a visible and palpable bump in most patients. While cosmetically noticeable, this rarely causes functional impairment. Non-union rates for non-operative management of displaced fractures are ~14.5%, significantly reduced with ORIF (~1.7%)."
    difficulty: easy
    tags: [clavicle fracture, complications, cosmetic, malunion]
  - front: "What speed's test assesses and what indicates a positive result?"
    back: "Speed's test assesses biceps tendinopathy (bicipital tendinitis). Technique: resistance applied to forearm in forward flexion with elbow fully extended. Positive: pain in the bicipital groove.\n\nSpeed's test has moderate sensitivity and specificity for biceps tendinopathy. It should be used alongside O'Brien's test to distinguish bicipital tendinopathy from SLAP lesions. Bicipital tendinopathy is treated with physiotherapy; refractory cases may require biceps tenodesis or tenotomy."
    difficulty: easy
    tags: [Speeds test, biceps tendinopathy, shoulder, special tests]
  - front: "What is Bohler's angle and what does its loss indicate on x-ray?"
    back: "Bohler's angle is the angle formed between the posterior facet and anterior process of the calcaneus on lateral x-ray. Its loss (flattening) indicates a calcaneal fracture with depression of the posterior facet.\n\nIn calcaneal fractures, the posterior facet is driven downward by axial load, flattening Bohler's angle. CT is the gold standard to assess intra-articular extension. The double-density sign is another x-ray finding."
    difficulty: medium
    tags: [orthopedics, foot, calcaneal fracture, radiology]
  - front: "What are the complications of calcaneal fractures?"
    back: "Wound complications, subtalar arthritis, compartment syndrome, and malunion.\n\nCalcaneal fractures, especially intra-articular ones, frequently result in subtalar arthritis due to damage to the posterior facet. Compartment syndrome of the foot can occur due to the enclosed compartments. Wound complications are more common with operative management."
    difficulty: easy
    tags: [orthopedics, foot, calcaneal fracture, complications]
  - front: "Where is the most common site of Achilles tendon rupture and why?"
    back: "2-6 cm proximal to its insertion on the calcaneus, because this region has the poorest blood supply (watershed zone).\n\nThe relative avascularity of this zone makes it susceptible to degenerative changes and rupture. Risk factors include chronic tendonitis, steroid injections, and fluoroquinolone antibiotics, all of which further compromise tendon integrity."
    difficulty: easy
    tags: [orthopedics, Achilles tendon, anatomy, rupture]
  - front: "How is the Thompson test performed and what does a positive result indicate?"
    back: "With the patient prone, the examiner squeezes the calf. Normally, this produces passive plantar flexion. Absence of plantar flexion (positive test) indicates Achilles tendon rupture.\n\nThe Thompson test assesses the continuity of the Achilles tendon. When the calf is squeezed, the gastrocnemius-soleus complex transmits force through an intact tendon to produce plantar flexion. A complete rupture interrupts this mechanism."
    difficulty: easy
    tags: [orthopedics, Achilles tendon, physical exam, Thompson test]
  - front: "What medications are associated with Achilles tendon rupture?"
    back: "Fluoroquinolone antibiotics and corticosteroids (steroid injections into the tendon).\n\nFluoroquinolones are associated with tendinopathy and spontaneous tendon rupture, likely due to impaired matrix metalloproteinase activity and mitochondrial dysfunction in tenocytes. Steroid injections weaken collagen structure and should be avoided around the Achilles tendon."
    difficulty: easy
    tags: [orthopedics, Achilles tendon, pharmacology, fluoroquinolones]
  - front: "What is the recommended treatment for Achilles tendon rupture in a low functional demand patient according to current evidence?"
    back: "Non-operative management with functional bracing/casting in resting equinus (plantar flexion) with functional rehabilitation for 12 weeks. Level 1 evidence shows no difference in re-rupture rates between operative and non-operative management when early ROM rehabilitation is used.\n\nA meta-analysis of 10 RCTs (934 patients) showed non-surgical treatment is preferred when a functional rehabilitation protocol with early range of motion is possible. Re-rupture rates were equivalent (P=0.08). Non-surgical patients had lower complication rates excluding re-rupture."
    difficulty: medium
    tags: [orthopedics, Achilles tendon, treatment, evidence-based medicine]
  - front: "What is plantar fasciitis and what are its classic clinical features?"
    back: "Inflammation of the plantar aponeurosis at its calcaneal origin. Classic features: insidious onset heel pain worst when first getting out of bed in the morning, intense pain when walking from rest that subsides with ambulation, and tenderness at the medial tuberosity of the calcaneus.\n\nPlantar fasciitis results from repetitive microtears and inflammation at the calcaneal insertion. The morning pain occurs because the fascia contracts overnight in a shortened position; first steps re-stretch it. Associated with obesity, DM, inflammatory arthropathies, and runners."
    difficulty: easy
    tags: [orthopedics, foot, plantar fasciitis, clinical features]
  - front: "What is the relationship between heel spurs and plantar fasciitis?"
    back: "Heel spurs are secondary to the inflammation of plantar fasciitis — they are NOT the cause of pain.\n\nPlantar heel spurs develop as a result of chronic traction forces from the inflamed plantar fascia on the calcaneus. Their presence on x-ray indicates prior or ongoing inflammation but does not directly cause symptoms. Treatment targets the fascia, not the spur."
    difficulty: easy
    tags: [orthopedics, foot, plantar fasciitis, heel spur]
  - front: "What is hallux valgus (bunion) and what are its treatment indications?"
    back: "Lateral deviation of the hallux with medial displacement of the first metatarsal and formation of a reactive exostosis (bunion). Operative indications: painful corn or bunion, overriding 2nd toe, persistent symptoms. Non-operative first-line: properly fitted shoes with low heel and toe spacer. Surgery is for pain, NOT cosmesis alone.\n\nHallux valgus is more frequent in women, associated with narrow toe-box/high-heel footwear, and 70% have a family history. Valgus alignment at the 1st MTP allows adductor hallucis to become a deforming force. Surgical options include osteotomy with realignment or arthrodesis."
    difficulty: medium
    tags: [orthopedics, foot, hallux valgus, bunion, treatment]
  - front: "What are the Ottawa Foot Rules for ordering x-rays after foot injury?"
    back: "X-rays are required if there is pain in the midfoot zone AND any of: bony tenderness over the navicular (midfoot zone), bony tenderness over the base of the 5th metatarsal, or inability to bear weight both immediately after injury and in the ER.\n\nThe Ottawa Ankle and Foot Rules (referenced on OR45) are validated clinical decision rules that reduce unnecessary x-rays after ankle/foot trauma without missing clinically significant fractures. They have high sensitivity for fractures."
    difficulty: medium
    tags: [orthopedics, foot, Ottawa rules, fracture, radiology]
  - front: "What is a Jones fracture and how is it treated?"
    back: "A stress injury fracture of the proximal shaft of the 5th metatarsal. Treatment: NWB below-knee cast for 6-8 weeks; ORIF if athlete, displacement, or skin tenting.\n\nThe Jones fracture occurs at a watershed zone of blood supply (metaphyseal-diaphyseal junction), resulting in poor healing. It should be distinguished from an avulsion fracture of the base of the 5th MT (caused by sudden inversion with peroneus brevis contraction), which has better healing and is managed conservatively."
    difficulty: medium
    tags: [orthopedics, foot, Jones fracture, metatarsal, treatment]
  - front: "What is a Lisfranc fracture-dislocation and what are its key clinical features?"
    back: "Tarso-metatarsal fracture-dislocation caused by forceful axial load on a plantar-flexed foot or direct crush injury. Key features: pain over the base of the 2nd metatarsal, swelling over midfoot, inability to bear weight, and bruising on the plantar aspect of the midfoot.\n\nPlantar bruising over the midfoot is a pathognomonic finding for Lisfranc injury. Treatment: ORIF or arthrodesis if displaced; cast immobilization x 8-12 weeks if undisplaced. Missed Lisfranc injuries lead to significant long-term morbidity."
    difficulty: medium
    tags: [orthopedics, foot, Lisfranc fracture, midfoot]
  - front: "What are the pediatric-specific fracture types and which is most common in children?"
    back: "Greenstick (one cortex broken), torus/buckle (impacted cortex), and plastic (bowing). Distal radius fracture is most common in children (phalanges are second most common).\n\nChildren's thicker, more active periosteum results in these unique fracture patterns. The stronger periosteum prevents complete displacement but greenstick fractures can redisplace while in cast due to the intact periosteum. Anatomic reduction is gold standard in adults, but some angular deformity is acceptable in children due to remodeling potential."
    difficulty: easy
    tags: [orthopedics, pediatrics, fractures, greenstick, torus]
  - front: "What fractures in children raise suspicion for non-accidental injury (NAI)?"
    back: "Metaphyseal corner fracture (hallmark of NAI), femur fracture in children <1 year, humeral shaft fracture in children <3 years, sternal fractures, posterior rib fractures, spinous process fractures, and x-ray evidence of healing fractures at different sites in different stages of healing.\n\nHigh index of suspicion is required for non-ambulatory children (<1 yr). When NAI is suspected: admit child, contact appropriate authorities, engage social work, and treat injuries. The mechanism stated must be compatible with the injury pattern — incompatible mechanisms are red flags."
    difficulty: medium
    tags: [orthopedics, pediatrics, non-accidental injury, child abuse, fractures]
  - front: "What is the treatment for each Salter-Harris fracture type?"
    back: "Type I: Closed reduction and cast (heals well, 95% no growth arrest). Type II: Closed reduction and cast if anatomic; ORIF if not. Type III: ORIF to prevent growth arrest; avoid fixation across growth plate. Type IV: Closed reduction/cast if anatomic; otherwise ORIF. Type V: Cast immobilization (operative rarely indicated); high incidence of growth arrest.\n\nTypes III-V involve the epiphysis and/or crush the physis, requiring anatomic reduction to restore the joint surface and preserve growth potential. Fixation crossing the growth plate in Type III can paradoxically cause more growth arrest."
    difficulty: hard
    tags: [orthopedics, pediatrics, Salter-Harris, treatment, growth plate]
  - front: "What is Slipped Capital Femoral Epiphysis (SCFE) and who is most at risk?"
    back: "SCFE is a Type I Salter-Harris epiphyseal injury at the proximal hip with anterosuperior displacement of the metaphysis relative to the epiphysis. Most common adolescent hip disorder. Risk factors: obesity (#1 factor), male sex, hypothyroidism, growth hormone deficiency, prior radiation to hip, renal osteodystrophy, Down syndrome.\n\nThe epiphysis remains in the acetabulum while the metaphysis (femoral neck) displaces anterosuperiorly. It occurs at the pubertal growth spurt when the physis is weakened by rapid growth hormone-driven cartilage proliferation. Black children have the highest genetic risk (autosomal dominant component)."
    difficulty: medium
    tags: [orthopedics, pediatrics, SCFE, hip, epiphysis]
  - front: "What is the Loder classification of SCFE and its prognostic significance?"
    back: "Stable SCFE: able to bear weight with or without crutches — risk of osteonecrosis <10%. Unstable SCFE: unable to ambulate even with crutches — high risk of osteonecrosis (24-47%).\n\nLoder classification provides critical prognostic information. Unstable SCFE has much higher rates of avascular necrosis (AVN) of the femoral head, likely due to disruption of the medial circumflex femoral artery. This affects urgency of surgical management."
    difficulty: medium
    tags: [orthopedics, pediatrics, SCFE, Loder classification, osteonecrosis]
  - front: "What is Klein's line and its significance in SCFE?"
    back: "On AP x-ray, a line drawn along the superolateral border of the femoral neck should cross at least a portion of the femoral epiphysis. In SCFE, the epiphysis slips posteromedially, so Klein's line no longer intersects the epiphysis (disruption of Klein's line).\n\nKlein's line is an important radiographic sign for SCFE. The frog-leg lateral view is often more sensitive than AP for detecting early or subtle slips. AP view may be normal or show only widening/lucency of the growth plate."
    difficulty: medium
    tags: [orthopedics, pediatrics, SCFE, Kleins line, radiology]
  - front: "What is the treatment of SCFE and what is controversial?"
    back: "Operative: percutaneous in-situ pinning WITHOUT reduction (reduction is highly controversial as it may increase AVN risk). Consider prophylactic fixation of contralateral hip in high-risk patients (bilateral involvement in ~25%).\n\nAcute reduction of SCFE is controversial because forceful manipulation may further damage the blood supply to the femoral head. In-situ fixation stabilizes the slip and prevents further displacement while minimizing AVN risk. Complications include AVN, chondrolysis, pin penetration, premature OA."
    difficulty: hard
    tags: [orthopedics, pediatrics, SCFE, treatment, surgical]
  - front: "What is the Drehmann sign in SCFE?"
    back: "Obligatory external rotation of the hip during passive flexion, caused by the posterior slip of the femoral epiphysis reducing the ability to internally rotate during flexion.\n\nIn SCFE, the femoral neck migrates anterosuperiorly relative to the epiphysis, effectively creating a retroverted position. When the hip is flexed, the greater trochanter impinges on the acetabular rim unless the hip externally rotates. This obligatory external rotation during flexion is the Drehmann sign."
    difficulty: hard
    tags: [orthopedics, pediatrics, SCFE, Drehmann sign, physical exam]
  - front: "What is Developmental Dysplasia of the Hip (DDH) and which populations require screening?"
    back: "DDH is abnormal development of the hip resulting in dysplasia, subluxation, or dislocation. Most common orthopedic disorder in newborns. All newborns require screening physical exam. U/S at 4-6 weeks for those with risk factors (5 Fs: Female, Firstborn, Family history, Foot deformity/breech, Left hip) and positive physical findings.\n\nDDH results from ligamentous laxity, muscular underdevelopment, and abnormally shallow acetabular slope. In newborns, the femoral head is cartilaginous and not visible on x-ray until 4-6 months, so U/S is the imaging modality of choice for early screening."
    difficulty: medium
    tags: [orthopedics, pediatrics, DDH, hip dysplasia, screening]
  - front: "How are the Barlow and Ortolani tests performed and what do they detect?"
    back: "Barlow test: With hips and knees at 90°, adduct and push posteriorly — a clunk indicates a dislocatable hip. Ortolani test: Starting from same position, abduct and lift the greater trochanter — a palpable clunk (not heard) felt as the hip reduces indicates a dislocated but reducible hip.\n\nBarlow tests for stability (can the hip be dislocated?), Ortolani tests for reducibility (can a dislocated hip be put back?). These are done in newborns. In older children (>2 yr), Trendelenburg test and gait assessment are more useful. Galeazzi sign (unequal knee heights) suggests unilateral DDH."
    difficulty: medium
    tags: [orthopedics, pediatrics, DDH, Barlow test, Ortolani test, physical exam]
  - front: "What is the age-based treatment approach for DDH?"
    back: "0-6 months: Pavlik harness (maintains abduction and flexion). 6-18 months: Reduction under GA + hip spica cast x 2-3 months (if Pavlik fails). 18 months-2 years: Open reduction with spica casting. >2 years: Pelvic and/or femoral osteotomy.\n\nThe goal is to achieve and maintain concentric reduction. Earlier treatment leads to better outcomes. AVN is a major complication at any age, particularly with severe abduction/flexion in a Pavlik harness or spica cast, due to impingement of the medial circumflex femoral artery."
    difficulty: medium
    tags: [orthopedics, pediatrics, DDH, treatment, Pavlik harness]
  - front: "What is Legg-Calvé-Perthes Disease (LCP) and what are its key epidemiological features?"
    back: "Idiopathic avascular necrosis (AVN) of the femoral head. Presents at 4-8 years of age. M:F = 5:1. 12% bilateral. Rate: 1/1,200 children. Associated with ADHD (33%), delayed bone age (89%), family history, low birth weight, and second-hand smoke exposure.\n\nLCP involves AVN of the proximal femoral epiphysis followed by abnormal physis growth and eventual remodeling of regenerated bone. Prognosis is better in males, age <6 years, <50% femoral head involvement, and abduction >30°. 60% of involved hips do not require operative intervention."
    difficulty: medium
    tags: [orthopedics, pediatrics, Legg-Calve-Perthes, AVN, hip]
  - front: "What is the treatment principle for Legg-Calvé-Perthes Disease?"
    back: "'Contain and maintain' — keep the femoral head contained within the acetabulum and maintain ROM. Non-operative: physiotherapy (ROM exercises) and restricted weight bearing. Operative: femoral or pelvic osteotomy for children >5 years or severe cases.\n\nThe acetabulum acts as a mold for the revascularizing femoral head; containment prevents deformity during this plastic phase. Initial x-ray may be negative; bone scan or MRI is used when clinical suspicion is high. Eventually, collapse of the femoral head becomes diagnostic on x-ray."
    difficulty: medium
    tags: [orthopedics, pediatrics, Legg-Calve-Perthes, treatment]
  - front: "What is Osgood-Schlatter Disease and who does it affect?"
    back: "Inflammation of the patellar ligament at its insertion on the tibial tuberosity (tibial tubercle apophysitis). Affects boys 12-15 years and girls 8-12 years (M>F). Caused by repetitive tensile stress causing minor avulsions and inflammatory reaction.\n\nOsgood-Schlatter is a self-limited condition that resolves when growth ceases. Clinical features: tender lump over tibial tuberosity, pain on resisted leg extension, anterior knee pain exacerbated by jumping or kneeling. X-ray shows fragmentation of the tibial tubercle ± ossicles. Treatment is conservative (activity modification, NSAIDs, PT)."
    difficulty: easy
    tags: [orthopedics, pediatrics, Osgood-Schlatter, knee, apophysitis]
  - front: "What is Congenital Talipes Equinovarus (clubfoot) and what is the CAVE deformity?"
    back: "Congenital foot deformity with CAVE deformity: Cavus (high arch), Adductus (forefoot adduction), Varus (hindfoot varus), Equinus (hindfoot equinus with tight Achilles tendon). Incidence: 1-2 per 1,000 newborns, 50% bilateral, M>F ~2:1.\n\nBony deformity includes: medially and plantarly deviated talar neck, varus calcaneus rotated medially around talus, and medially displaced navicular and cuboid. Etiology includes intrinsic causes (neurologic, muscular, connective tissue) and extrinsic (intrauterine restriction). Examine hips for DDH, knees, and back for dysraphism."
    difficulty: medium
    tags: [orthopedics, pediatrics, clubfoot, talipes equinovarus, CAVE deformity]
  - front: "What is the Ponseti technique for clubfoot treatment?"
    back: "Serial manipulation and casting correcting deformities in CAVE order (Cavus first, then Adductus, Varus, Equinus). Casts changed every 1-2 weeks. Typically requires percutaneous Achilles tendon release after ~2 months of casting, followed by 3 more weeks in maximal dorsiflexion. 3-year recurrence rate is 5-10%.\n\nThe Ponseti technique is the first-line non-operative treatment. Surgical release is reserved for refractory cases and delayed until 3-4 months of age. Even with successful treatment, the affected foot is permanently smaller/stiffer with calf muscle atrophy. Note: Equinus is corrected LAST because premature equinus correction can cause 'rocker bottom' deformity."
    difficulty: medium
    tags: [orthopedics, pediatrics, clubfoot, Ponseti technique, treatment]
  - front: "What is scoliosis and how is it classified by Cobb angle for management?"
    back: "Lateral curvature of the spine with vertebral rotation. Most common in 10-14 year olds; more frequent and severe in females. Cobb angle-based management: <25° observe with serial x-rays; >25° or progressive: bracing; >45° or respiratory problems: surgical correction (spinal fusion).\n\nIdiopathic scoliosis accounts for 90% of cases. The Adams forward bend test demonstrates thoracic or lumbar prominence on the affected side. Screening is NOT recommended in Canada (CTFPHC recommendation). Structural/fixed scoliosis cannot be corrected by bending; postural scoliosis can be corrected by treating the underlying cause."
    difficulty: medium
    tags: [orthopedics, pediatrics, scoliosis, Cobb angle, treatment]
  - front: "What are the x-ray features distinguishing benign from malignant bone lesions?"
    back: "Benign: sharp well-demarcated borders, narrow zone of transition, no periosteal reaction (or uniform smooth thickening), intraosseous/even calcification, no soft tissue mass, no aggressive cortical destruction. Malignant: poorly defined borders with wide zone of transition, acute periosteal reaction (Codman's triangle, onion-skin, sunburst), soft tissue mass, aggressive cortical destruction.\n\nKey x-ray descriptors for bone lesions include: location (which bone, diaphysis/metaphysis/epiphysis), size, morphology (geographic vs. permeative vs. moth-eaten), periosteal reaction, cortical involvement, matrix type (osteoid=cumulus cloud, chondroid=popcorn/punctate, fibrous=ground glass), and associated pathological fracture."
    difficulty: medium
    tags: [orthopedics, bone tumours, radiology, benign vs malignant]
  - front: "What is an osteoid osteoma and what is its characteristic clinical presentation?"
    back: "Benign bone tumour from osteoblasts. Peak incidence 2nd-3rd decades, M:F=2-3:1. Most common in proximal femur and tibia diaphysis. Key feature: constant, progressive NIGHT PAIN that is characteristically relieved by NSAIDs (due to prostaglandin secretion). X-ray: small round radiolucent nidus (<1.5 cm) surrounded by dense sclerotic bone ('bull's-eye').\n\nNight pain relieved by NSAIDs is pathognomonic for osteoid osteoma due to COX1/2 expression by the nidus producing prostaglandins. Treatment: NSAIDs first-line; percutaneous radiofrequency ablation or surgical resection for refractory cases. Spinal osteoid osteomas can cause painful scoliosis."
    difficulty: medium
    tags: [orthopedics, bone tumours, osteoid osteoma, benign, NSAIDs]
  - front: "What is a fibrous cortical defect (non-ossifying fibroma) and what is its significance?"
    back: "Developmental defect where areas that normally ossify are filled with fibrous connective tissue. Most common benign bone tumour in children (35% incidence). Typically asymptomatic, incidental finding. Metaphyseal eccentric 'bubbly' lytic lesion near physis with thin sclerotic margin. Most resolve spontaneously.\n\nPeak incidence 2-25 years, most common in distal femur, distal tibia, proximal tibia. Multiple lesions can be present; large lesions may cause pathological fractures. Treatment: observation; curettage and bone grafting only for symptomatic lesions or prevention of pathologic fracture in larger lesions."
    difficulty: easy
    tags: [orthopedics, bone tumours, fibrous cortical defect, non-ossifying fibroma, pediatrics]
  - front: "What is an osteochondroma, what are its types, and when does malignant transformation occur?"
    back: "Cartilage-capped bony lesion on the external surface of bone. Most common benign bone tumour (~30%). Types: sessile (broad-based, higher malignant degeneration risk) vs. pedunculated (narrow stalk). Malignant degeneration in 1-2% (higher with multiple hereditary osteochondromas). Signs of malignant change: pain or rapid growth after skeletal maturity.\n\nOsteochondromas arise near tendon attachment sites (distal femur, proximal tibia, proximal humerus). Growth ceases at skeletal maturity; continued growth raises concern for malignant transformation to chondrosarcoma. The hereditary multiple form (HME) is autosomal dominant with higher malignant risk. Treatment: observation; surgical excision if symptomatic or concern for transformation."
    difficulty: medium
    tags: [orthopedics, bone tumours, osteochondroma, benign, malignant transformation]
  - front: "What is an enchondroma and what clue suggests malignant degeneration?"
    back: "Benign hyaline cartilage growth in the medullary cavity. 60% occur in small tubular bones of hand/foot. X-ray: well-defined lucent central medullary lesions with punctate/popcorn calcification. Malignant degeneration to chondrosarcoma occurs in 1-2%. Clue: rest/nocturnal pain in the absence of pathological fracture indicates possible malignant change.\n\nMost enchondromas are asymptomatic (incidental finding or pathological fracture). Peak 2nd-3rd decades. Femur is the second most common location (20%). Multiple enchondromas (Ollier's disease or Maffucci syndrome with hemangiomas) have significantly higher malignant degeneration risk."
    difficulty: medium
    tags: [orthopedics, bone tumours, enchondroma, chondrosarcoma, malignant transformation]
  - front: "What is a unicameral (solitary) bone cyst and what is its most common presentation?"
    back: "Most common cystic bone lesion; serous fluid-filled lesion with fibrous lining. Most common in children/young adults (1st-2nd decades). Proximal humerus and femur most common. Presents in 50% of cases as a complete pathological fracture; otherwise asymptomatic or localized pain. X-ray: lytic translucent area on metaphyseal side of growth plate with thinned/expanded cortex.\n\nTreatment: observation with serial x-rays q4-6 months; if needed, aspiration followed by steroid injection; curettage + bone graft if structural integrity is compromised. Simple bone cysts typically migrate away from the growth plate as the child grows."
    difficulty: easy
    tags: [orthopedics, bone tumours, unicameral bone cyst, pathological fracture]
  - front: "What are the radiographic findings of a giant cell tumour of bone and an aneurysmal bone cyst?"
    back: "Giant cell tumour: eccentric lytic lesion in the EPIPHYSIS adjacent to subchondral bone; may break through cortex; T2 MRI shows hyperintense signal (fluid). Aneurysmal bone cyst: expansile, eccentric, lytic lesion with bony septae ('bubbly appearance'); fluid-fluid levels on MRI (pathognomonic).\n\nBoth are benign aggressive tumours. Giant cell tumours occur at skeletal maturity (peak 3rd decade) and have 3% pulmonary metastasis rate. Aneurysmal bone cysts are either solid (fibrous/granular) or blood-filled. Osteoblastoma most commonly occurs in posterior elements of spine and shows calcified central nidus >2 cm. Treatment: intralesional curettage + bone graft/cement; recurrence up to 20%."
    difficulty: hard
    tags: [orthopedics, bone tumours, giant cell tumour, aneurysmal bone cyst, radiology]
  - front: "What is Codman's triangle and what does it represent radiographically?"
    back: "Codman's triangle is a radiographic finding in malignant bone tumours where the partially ossified periosteum is lifted off the cortex by neoplastic tissue, creating a triangular opacity at the edges of the lesion. It indicates aggressive periosteal reaction and is associated with osteosarcoma.\n\nWhen a malignant tumour grows rapidly, it lifts the periosteum. The periosteum attempts to lay down new bone at the edges of the lift, forming a triangular opacity. In the centre, the tumour grows too fast for bone formation. Codman's triangle is also seen with the 'sunburst' pattern in osteosarcoma."
    difficulty: medium
    tags: [orthopedics, bone tumours, Codmans triangle, osteosarcoma, radiology]
  - front: "What is osteosarcoma and what are its key features?"
    back: "Malignant bone tumour, 2nd most common primary malignancy after myeloma. Peak in 2nd decade; second peak in elderly with Paget's disease. Most common sites: distal femur (45%), proximal tibia (20%), proximal humerus (15%). X-ray: 'sunburst' pattern + Codman's triangle + soft tissue mass. Treatment: neo-adjuvant chemo → limb salvage resection → post-surgical chemo. Prognosis: 90% low-grade; 70% high-grade survival.\n\nFrequent metastases without treatment (lung most common). CT chest rules out pulmonary metastases; bone scan rules out skeletal metastases. The lesion characteristically involves the metaphysis and may cross the epiphyseal plate. Symptoms: progressive pain, night pain, poorly defined swelling, decreased ROM."
    difficulty: medium
    tags: [orthopedics, bone tumours, osteosarcoma, malignant, treatment]
  - front: "What is Ewing's sarcoma and how does it mimic infection clinically?"
    back: "Malignant small round cell sarcoma. Most occur ages 5-25 years. Presents with pain, fever, erythema, and swelling + anemia, increased WBC, ESR, and LDH — mimicking osteomyelitis. X-ray: destructive 'moth-eaten' lesion with periosteal lamellated 'onion-skinning' pattern. Treatment: resection + chemotherapy + radiation.\n\nThe inflammatory systemic response (fever, elevated WBC, ESR) in Ewing's sarcoma can mislead clinicians toward an infectious diagnosis. Key distinguishing features: young patient, diaphyseal involvement, 'onion-skin' periosteal reaction. Prognosis: 70% survival; <30% with distant metastases."
    difficulty: medium
    tags: [orthopedics, bone tumours, Ewings sarcoma, malignant, osteomyelitis differential]
  - front: "What is the most common malignant bone tumour?"
    back: "Multiple myeloma is the most common PRIMARY bone malignancy. However, METASTATIC carcinoma is the most common malignant bone lesion overall (more common than all primary bone tumours combined).\n\nThis is a classic distinction on the MCCQE1. Multiple myeloma: 90% in >40 years, M:F=2:1, twice as common in people of African descent. X-ray: multiple 'punched-out' well-demarcated lesions without surrounding sclerosis. Diagnosis via serum/urine immunoelectrophoresis (monoclonal gammopathy) and Bence Jones protein."
    difficulty: easy
    tags: [orthopedics, bone tumours, multiple myeloma, metastases, malignant]
  - front: "What are the most common malignant bone tumours by age group?"
    back: "<1 year: Neuroblastoma. 1-10 years: Ewing's sarcoma of tubular bones. 10-30 years: Osteosarcoma, Ewing's sarcoma of flat bones. 30-40 years: Reticulum cell sarcoma, fibrosarcoma, lymphoma. >40 years: Metastatic carcinoma, multiple myeloma, chondrosarcoma.\n\nRecognizing age-appropriate differentials for bone tumours is critical for MCCQE1. In patients >40 years, always consider metastatic disease (from breast, lung, prostate, kidney, thyroid — 'BLT with a Kosher Pickle') and multiple myeloma before primary bone malignancies. Biopsy should be referred to specialized centres."
    difficulty: medium
    tags: [orthopedics, bone tumours, malignant, age-based differential, osteosarcoma]
  - front: "What is chondrosarcoma and why is its treatment different from other bone sarcomas?"
    back: "Malignant chondrogenic tumour. Primary (2/3): patient >40 years, expands into cortex causing pain. Secondary (1/3): malignant degeneration of enchondroma or osteochondroma (ages 25-45). Treatment: wide surgical resection with reconstruction. NO role for neo-adjuvant chemotherapy or radiation — surgery alone. Regular follow-up x-rays.\n\nChondrosarcoma is unique among malignant bone tumours in that it is chemotherapy- and radiation-resistant. The treatment is purely surgical. X-ray shows irregular 'popcorn' calcification in the medullary cavity. Prognosis: 90% 10-year survival for low-grade; 29-55% for high-grade."
    difficulty: hard
    tags: [orthopedics, bone tumours, chondrosarcoma, treatment, malignant]
  - front: "What are the clinical features and diagnostic workup for suspected multiple myeloma with bone involvement?"
    back: "Cardinal symptom: localized bone pain. Also: compression/pathological fractures, renal failure, nephritic syndrome, recurrent infections (pneumonia, pyelonephritis), anemia, thrombocytopenia, hypercalcemia, elevated Cr and ESR. Diagnosis: serum/urine immunoelectrophoresis (monoclonal gammopathy), Bence Jones protein, CT-guided biopsy of lytic lesions.\n\nThe classic 'CRAB' criteria for myeloma: Calcium elevated, Renal failure, Anemia, Bone lesions ('punched-out' on x-ray without surrounding sclerosis). Myeloma is MOST common primary bone malignancy, but total bone metastases from carcinomas vastly outnumber it. Staging includes CT chest/abdomen/pelvis and bone marrow biopsy."
    difficulty: medium
    tags: [orthopedics, bone tumours, multiple myeloma, diagnosis, workup]
  - front: "What is the staging workup for a suspected malignant bone tumour?"
    back: "Local staging: full-length x-rays of affected bone, CT and/or MRI of affected bone, biopsy (referred to specialized centre). Systemic staging: CBC, electrolytes, LFTs, inflammatory markers, bone profile, calcium; serum electrophoresis + Bence Jones protein (elderly); CT chest/abdomen/pelvis; bone scan or bone marrow biopsy depending on preliminary diagnosis.\n\nBiopsy of suspected malignant bone tumours MUST be referred to a specialized orthopaedic oncology centre. Improper biopsy technique or tract placement can compromise subsequent limb salvage surgery. The biopsy tract is included in the resection specimen. Malignancy is suggested by rapid growth, warmth, tenderness, aggressive imaging features, and constitutional symptoms."
    difficulty: hard
    tags: [orthopedics, bone tumours, staging, biopsy, workup]
  - front: "Why should steroid injections be avoided in Achilles tendonitis?"
    back: "Steroid injections carry a significant risk of Achilles tendon rupture. They weaken collagen structure and can lead to spontaneous rupture, even with normal activity.\n\nCorticosteroids inhibit tenocyte proliferation and collagen synthesis, leading to tendon degeneration. This is in contrast to other tendons (e.g., plantar fascia) where steroid injection is an accepted treatment option. For Achilles tendonitis, non-operative treatment (rest, NSAIDs, eccentric training, shockwave therapy) is preferred."
    difficulty: easy
    tags: [orthopedics, Achilles tendon, steroid injection, contraindication]
  - front: "What is the difference between stress fractures (insufficiency vs. fatigue)?"
    back: "Insufficiency fracture: normal or physiologic stress applied to a weak or structurally deficient bone (e.g., osteoporosis). Fatigue fracture: repetitive, excessive force applied to normal bone (e.g., military recruits, athletes). Most common in adolescent athletes. Most common sites: tibia, calcaneus, metatarsals.\n\nBoth types may not be visible on initial plain films (sensitivity ~50%). Bone scan becomes positive in 12-15 days. MRI demonstrates abnormal bone marrow edema and is the most sensitive imaging modality. Treatment: rest from strenuous activities (weeks to months), protected weight bearing, optional splinting/Aircast."
    difficulty: medium
    tags: [orthopedics, stress fracture, fatigue fracture, insufficiency fracture, pediatrics]
  - front: "What is scoliosis screening policy in Canada and what investigations are used?"
    back: "Scoliosis screening is NOT recommended in Canada (Health Canada/Canadian Task Force recommendation). When scoliosis is clinically suspected: x-ray (3-foot standing AP and lateral). Measure Cobb angle. Adams forward bend test: thoracic or lumbar prominence on the affected side.\n\nThe Lenke classification guides which curves to include within the fusion construct. In neuromuscular scoliosis, look for associated posterior midline skin lesions (café-au-lait spots, dimples, neurofibromas, axillary freckling). In structural scoliosis, bending CANNOT correct the curve; in postural scoliosis, correcting the underlying cause (e.g., leg length discrepancy) corrects the curve."
    difficulty: medium
    tags: [orthopedics, scoliosis, screening, Canada, Cobb angle]
  - front: "What is the Achilles tendon formed by, and what is retrocalcaneal bursitis (Haglund deformity)?"
    back: "The Achilles tendon is formed by the confluence of the soleus and gastrocnemius tendons. It is the largest tendon in the body. Retrocalcaneal bursitis (Haglund deformity) is a painful heel bump that develops secondary to chronic Achilles tendonitis from poor-fitting footwear or activity, causing inflammation of the bursa between the tendon and calcaneus.\n\nHaglund deformity ('pump bump') is a bony prominence of the posterosuperior calcaneus that irritates the overlying bursa and Achilles tendon. Treatment: non-operative (open-back shoes, heel padding, eccentric training); operative (arthroscopic or open debridement of the Haglund lesion) for refractory cases."
    difficulty: easy
    tags: [orthopedics, Achilles tendon, Haglund deformity, bursitis, anatomy]
  - front: "What are the 5 Fs that predispose to Developmental Dysplasia of the Hip (DDH)?"
    back: "Family history, Female sex, Firstborn, Foot deformity/breech presentation, Left hip (most commonly affected).\n\nThese risk factors guide who should receive screening ultrasound at 4-6 weeks. Female sex and family history are the strongest risk factors. Breech presentation significantly increases risk because the hip is held in extension rather than flexion during uterine development, reducing acetabular stimulation."
    difficulty: easy
    tags: [orthopedics, pediatrics, DDH, risk factors, 5 Fs]
