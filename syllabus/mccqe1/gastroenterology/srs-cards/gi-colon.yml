# Colorectal Cancer & Screening (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is the recommended colorectal cancer screening for average-risk individuals in Canada?"
    back: "Start at age 50 (45 per some provincial guidelines): FIT (fecal immunochemical test) every 1-2 years OR flexible sigmoidoscopy every 10 years OR colonoscopy every 10 years\n\nCanadian Cancer Society and CTFPHC recommend CRC screening starting at age 50 for average-risk individuals. FIT is the preferred non-invasive screening modality. Abnormal FIT requires colonoscopy. High-risk groups (IBD, FAP, Lynch, family history) require earlier and more frequent surveillance."
    difficulty: easy
    tags: [CRC screening, colorectal cancer, FIT, colonoscopy, gastroenterology]
  - front: "What genetic syndromes are associated with hereditary colorectal cancer?"
    back: "Lynch syndrome (HNPCC): MSH2, MLH1, MSH6, PMS2 mutations — 80% lifetime CRC risk; FAP: APC mutation — thousands of polyps, near 100% CRC risk\n\nLynch syndrome is the most common hereditary CRC syndrome. Colonoscopy every 1-2 years starting at age 20-25. FAP: prophylactic colectomy in teens. MUTYH-associated polyposis (MAP) is autosomal recessive. All CRC patients <70 should have MMR testing."
    difficulty: medium
    tags: [Lynch syndrome, FAP, hereditary CRC, MMR, gastroenterology]
  - front: "What is the clinical presentation of colorectal cancer and how does it differ by location?"
    back: "Right colon: iron deficiency anemia, weight loss, occult bleeding (large tumor, delayed obstruction); Left colon: change in bowel habits, hematochezia, obstruction (narrower lumen)\n\nCRC is the second most common cancer in Canada. Left-sided CRC typically presents with altered bowel habits and rectal bleeding. Right-sided CRC often presents with anemia and systemic symptoms. All patients >50 with rectal bleeding require colonoscopy."
    difficulty: medium
    tags: [colorectal cancer, presentation, right vs. left colon, CRC, gastroenterology]
  - front: "What is the TNM staging of colorectal cancer and its associated 5-year survival?"
    back: "T1-2 N0 M0 (Stage I): 90%; T3-4 N0 M0 (Stage II): 70-85%; any T N1-2 M0 (Stage III): 40-70%; any T any N M1 (Stage IV): 5-15%\n\nStage determines treatment. Stage I: resection alone. Stage III: resection + adjuvant FOLFOX chemotherapy (oxaliplatin + 5-FU + leucovorin). Stage IV: palliative chemotherapy (FOLFOX, FOLFIRI) ± biologic agents (bevacizumab, cetuximab for KRAS wild-type)."
    difficulty: medium
    tags: [CRC staging, TNM, 5-year survival, colorectal cancer prognosis, gastroenterology]
  - front: "What are adenomatous polyps and which features increase colorectal cancer risk?"
    back: "High-risk adenomas: size ≥10mm, 3 or more adenomas, villous histology, or high-grade dysplasia — require 3-year surveillance colonoscopy\n\nLow-risk adenomas (1-2 tubular adenomas <10mm, no HGD): 5-7 year colonoscopy surveillance. Serrated polyps: sessile serrated lesions ≥10mm or with dysplasia also require 3-year surveillance. CCA/CAG guidelines updated 2020."
    difficulty: medium
    tags: [adenomatous polyps, colorectal cancer risk, surveillance colonoscopy, high-risk adenoma, gastroenterology]
  - front: "A 65-year-old has a 2cm adenomatous polyp removed at colonoscopy. First surveillance colonoscopy is when?"
    back: "3 years — high-risk adenoma (≥10mm) requires 3-year follow-up colonoscopy\n\nCAG surveillance guidelines: 1-2 small tubular adenomas → 5-7 years; 3-4 small adenomas or 1-2 adenomas with any HGD or villous histology → 3 years; ≥5 small adenomas or ≥3 with at least one large → 1-3 years. Return to average risk after normal surveillance."
    difficulty: medium
    tags: [polyp surveillance, colonoscopy follow-up, adenoma, high-risk adenoma, gastroenterology]
  - front: "What is the role of carcinoembryonic antigen (CEA) in colorectal cancer management?"
    back: "CEA is not used for diagnosis or screening; used post-resection for surveillance — elevated preoperative CEA has prognostic value; rising post-op CEA suggests recurrence\n\nCEA should be measured preoperatively (baseline) and every 3 months for 2 years post-resection, then every 6 months for 3 years. Rising CEA mandates imaging to look for recurrence. CEA has poor sensitivity for early CRC."
    difficulty: medium
    tags: [CEA, colorectal cancer surveillance, tumor marker, gastroenterology]
  - front: "What is microsatellite instability (MSI) and why is it tested in colorectal cancer?"
    back: "MSI: deficient DNA mismatch repair (dMMR) leading to accumulation of errors in repetitive DNA sequences; MSI-H tumors respond to immune checkpoint inhibitors (pembrolizumab) and have better prognosis in Stage II\n\nMSI/MMR testing is universal in CRC to screen for Lynch syndrome (germline mutation) and guide treatment. MSI-H Stage II CRC: do NOT benefit from 5-FU adjuvant chemotherapy. MSI-H metastatic CRC: first-line pembrolizumab (KEYNOTE-177)."
    difficulty: hard
    tags: [MSI, microsatellite instability, Lynch syndrome, checkpoint inhibitor, pembrolizumab, gastroenterology]
  - front: "When should colonoscopy be repeated after normal screening colonoscopy?"
    back: "10 years for average-risk individuals with completely normal colonoscopy (no polyps found)\n\nCAG guidelines recommend 10-year intervals for normal colonoscopy. Quality indicators: adequate bowel prep, cecal intubation with photo documentation, adequate withdrawal time (≥6 minutes), adenoma detection rate. Poor prep requires repeat in 1 year."
    difficulty: easy
    tags: [colonoscopy interval, screening, average risk, CRC surveillance, gastroenterology]
  - front: "What is the hereditary cancer surveillance strategy for Lynch syndrome patients?"
    back: "Annual colonoscopy starting at age 20-25 (or 2-5 years before youngest family member diagnosis); consider annual endometrial sampling; aspirin 600mg/day reduces CRC risk (CAPP2 trial)\n\nLynch syndrome also increases risk of endometrial, ovarian, urologic, gastric, and small bowel cancers. CCA/Canadian guidelines recommend comprehensive cancer surveillance. Prophylactic surgery (hysterectomy, BSO) discussed with patients who have completed childbearing."
    difficulty: hard
    tags: [Lynch syndrome, surveillance, colonoscopy, HNPCC, hereditary cancer, gastroenterology]
  - front: "What is CRC screening in Canada per CTFPHC?"
    back: "FIT every 2 years OR flex sig every 10 years, ages 50-74. Colonoscopy NOT primary screening\n\nHigh-risk: colonoscopy q1-5y from age 40. Lynch: q1-2y. CTFPHC differs from US guidelines."
    difficulty: medium
    tags: [CRC, CTFPHC]
  - front: "What is the CRC screening protocol for average-risk Canadians per CTFPHC?"
    back: "FIT (fecal immunochemical test) every 2 years for ages 50-74 (CTFPHC). Flexible sigmoidoscopy every 10 years is alternative. Colonoscopy is NOT recommended as primary screening for average risk by CTFPHC (though CCS and some provinces use it).\n\nCTFPHC prioritizes FIT over colonoscopy for population screening due to non-invasive nature and similar mortality reduction. Positive FIT → diagnostic colonoscopy. Provincial programs vary: Ontario uses FIT, BC uses FIT, some allow screening colonoscopy. CTFPHC recommends against screening <50 and >74."
    difficulty: medium
    tags: [CRC, screening, FIT, CTFPHC, colonoscopy, GI]
  - front: "What are the colonoscopy surveillance intervals after polypectomy?"
    back: "Low-risk adenoma (1-2 tubular <10mm): repeat in 5-10 years. High-risk adenoma (≥10mm, villous, HGD, ≥3 adenomas, or serrated): repeat in 3 years. Piecemeal resection of large polyp: 6 months. Normal colonoscopy: 10 years.\n\nCAG 2020 guidelines simplified surveillance. Sessile serrated lesions ≥10mm or with dysplasia are high-risk. Hyperplastic polyps <10mm in rectosigmoid are not adenomas — standard 10-year interval. Risk stratification at each colonoscopy determines next interval."
    difficulty: hard
    tags: [CRC, polyp, surveillance, colonoscopy, adenoma, CAG, GI]
  - front: "What defines Lynch syndrome and what is the screening approach?"
    back: "Autosomal dominant DNA mismatch repair (MMR) gene mutation (MLH1, MSH2, MSH6, PMS2). Lifetime CRC risk 40-80%. Screen with colonoscopy every 1-2 years starting age 20-25 (or 5 years before youngest family CRC diagnosis). Also screen for endometrial, ovarian, urinary tract cancers.\n\nSuspect Lynch if: Amsterdam II criteria or revised Bethesda guidelines. Universal tumor testing (MMR IHC/MSI) on all new CRC. Germline genetic testing if tumor shows MMR deficiency. Prophylactic hysterectomy/BSO considered after childbearing. ASA may reduce CRC risk (CAPP2 trial)."
    difficulty: hard
    tags: [CRC, Lynch syndrome, HNPCC, MMR, screening, genetic, GI]
  - front: "What is the TNM staging and 5-year survival for CRC?"
    back: "Stage I: T1-2 N0 (>90% survival). Stage II: T3-4 N0 (70-85%). Stage III: any T, N1-2 (50-70%). Stage IV: distant metastases (5-15%). Treatment: Stage I-III curative resection ± adjuvant chemo. Stage IV: palliative chemo ± surgery if resectable metastases.\n\nAdjuvant chemotherapy standard for Stage III (FOLFOX: 5-FU + leucovorin + oxaliplatin x 3-6 months). Stage II with high-risk features (T4, perforation, <12 LN sampled, LVI, poorly differentiated) may benefit from adjuvant chemo. Stage IV: test for RAS/BRAF/MSI for targeted therapy selection."
    difficulty: hard
    tags: [CRC, staging, TNM, survival, chemotherapy, FOLFOX, GI]
  - front: "What is the adenoma-carcinoma sequence in CRC development?"
    back: "Normal mucosa → aberrant crypt foci → small adenoma (tubular) → large adenoma (villous features, high-grade dysplasia) → carcinoma. Key mutations: APC (initiation) → KRAS → DCC/SMAD4 → p53 (progression). Takes 10-15 years.\n\nThis Vogelstein model explains ~80% of sporadic CRC. An alternative pathway (serrated/BRAF/CpG island methylation) accounts for 15-20% of CRC, especially right-sided. Understanding this sequence justifies colonoscopic polypectomy (interrupting the sequence) and 10-year screening intervals."
    difficulty: medium
    tags: [CRC, adenoma-carcinoma, APC, KRAS, p53, pathology, GI]
  - front: "What are the presenting features of left-sided vs right-sided CRC?"
    back: "Left-sided (descending/sigmoid/rectum): change in bowel habits, narrow stools, obstruction, hematochezia, tenesmus. Right-sided (cecum/ascending): insidious iron deficiency anemia, weight loss, vague abdominal pain, palpable mass. Obstruction is rare on right side due to wider lumen.\n\nRight-sided CRC presents later due to liquid stool and distensible colon. Right-sided tumors are more often MSI-high, BRAF-mutated, mucinous, and respond to immunotherapy. Left-sided tumors respond better to anti-EGFR therapy (cetuximab) if RAS wild-type. Sidedness is a prognostic and predictive factor."
    difficulty: medium
    tags: [CRC, left-sided, right-sided, presentation, iron deficiency, GI]
  - front: "What is the management of acute large bowel obstruction from CRC?"
    back: "Resuscitation, NG decompression, CT abdomen/pelvis. Left-sided obstruction: emergent surgery (Hartmann procedure — resection with end-colostomy) or colonic stenting as bridge to elective surgery. Right-sided: right hemicolectomy with primary anastomosis.\n\nSelf-expanding metal stents (SEMS) as bridge to surgery in left-sided obstruction allow bowel decompression, optimization, and single-stage surgery with primary anastomosis. Concerns about stenting: perforation risk, potential tumor seeding. Not recommended if perforation suspected. Hartmann reversal in 3-6 months."
    difficulty: hard
    tags: [CRC, obstruction, Hartmann, stent, emergency, surgery, GI]
  - front: "What is the role of CEA in CRC management?"
    back: "NOT a screening test (low sensitivity/specificity). Use for: pre-op baseline (prognosis — elevated CEA = worse), post-op surveillance for recurrence (check q3-6 months x 3 years, then q6 months x 2 years). Rising CEA post-resection: workup for recurrence with CT chest/abdomen/pelvis.\n\nCEA >5 μg/L preoperatively associated with worse prognosis. Post-op, CEA should normalize within 4-6 weeks. Persistently elevated suggests residual/metastatic disease. CEA can be elevated in smokers, liver disease, IBD, and other cancers — not specific for CRC."
    difficulty: medium
    tags: [CRC, CEA, tumor marker, surveillance, recurrence, GI]
  - front: "What biomarkers guide targeted therapy selection in metastatic CRC?"
    back: "RAS (KRAS/NRAS) wild-type + left-sided: anti-EGFR (cetuximab, panitumumab) + chemo. RAS mutant: bevacizumab (anti-VEGF) + chemo. BRAF V600E mutant: encorafenib + cetuximab. MSI-high/dMMR: pembrolizumab (first-line immunotherapy per KEYNOTE-177).\n\nAll metastatic CRC should be tested for RAS, BRAF, MSI/MMR, and HER2. MSI-H tumors (~15% of CRC) have excellent response to immunotherapy, now first-line. BRAF V600E (5-10%) has poor prognosis with standard chemo. HER2 amplification (3%): trastuzumab + pertuzumab or tucatinib combinations."
    difficulty: hard
    tags: [CRC, biomarkers, KRAS, BRAF, MSI, immunotherapy, targeted therapy, GI]
  - front: "What is the post-CRC resection surveillance protocol?"
    back: "CEA q3-6 months x 3 years, then q6 months x 2 years. CT chest/abdomen/pelvis annually x 3 years (Stage II-III). Colonoscopy at 1 year post-op, then at 3 years, then every 5 years. PET not routine.\n\nGoal: detect resectable recurrence early (especially liver/lung metastases). 80% of recurrences occur within 3 years. Isolated liver metastases: potentially curable with hepatic resection (5-year survival 40-50%). CCS/ASCO guidelines recommend structured follow-up for at least 5 years."
    difficulty: medium
    tags: [CRC, surveillance, post-op, CEA, colonoscopy, GI]
  - front: "A 70-year-old male presents with 10 kg unintentional weight loss over 6 months, fatigue, and early satiety. What is the most important initial workup?"
    back: "Malignancy screen is the priority. Initial workup: CBC (cytopenias → hematologic malignancy), liver enzymes/LDH (metastatic disease), CXR (lung cancer), CT chest/abdomen/pelvis (solid organ malignancy), fecal occult blood test (GI malignancy), age-appropriate cancer screening (colonoscopy, PSA). Also check TSH (hyperthyroidism), HbA1c (diabetes), and HIV.\n\nUnintentional weight loss >5% of body weight over 6-12 months is clinically significant. Malignancy is the leading cause in the elderly (up to 36%). The combination of early satiety, weight loss, and fatigue in an older male should prompt investigation for gastric, pancreatic, and colon cancer as top differentials."
    difficulty: medium
    tags: [weight-loss, malignancy-screening, cancer, clinical-approach]
  - front: "What are the main diagnostic categories for unintentional weight loss, and what key screening tests differentiate them?"
    back: "1) Malignancy (36%): CBC, LDH, CT, cancer screening. 2) Non-malignant GI (17%): celiac screen (tTG-IgA), stool studies, endoscopy. 3) Psychiatric (10%): depression screen (PHQ-9), eating disorders. 4) Endocrine: TSH (hyperthyroidism), HbA1c (uncontrolled diabetes), cortisol (adrenal insufficiency). 5) Chronic infection: HIV, TB. 6) Inflammatory: ESR/CRP (vasculitis, polymyalgia rheumatica).\n\nA thorough history is essential — increased appetite with weight loss suggests hyperthyroidism or diabetes, while decreased appetite narrows to malignancy, depression, or medication side effects. In up to 25% of cases, no cause is found despite workup, and these patients generally have a good prognosis."
    difficulty: medium
    tags: [weight-loss, differential-diagnosis, endocrine, psychiatric, clinical-approach]
  - front: "A 35-year-old woman presents with unintentional weight loss, heat intolerance, tremor, palpitations, and exophthalmos. What is the diagnosis and confirmatory workup?"
    back: "Graves' disease (autoimmune hyperthyroidism). Confirm with TSH (suppressed/low), free T4 and free T3 (elevated), and TSH receptor antibodies (TRAb, positive in Graves'). Radioactive iodine uptake scan shows diffuse homogeneous uptake. Management options: antithyroid drugs (methimazole), radioactive iodine ablation, or thyroidectomy.\n\nGraves' disease is the most common cause of hyperthyroidism and the only cause with ophthalmopathy (exophthalmos). Weight loss occurs despite increased appetite due to elevated metabolic rate. Methimazole is first-line medical therapy (propylthiouracil preferred only in first trimester pregnancy and thyroid storm)."
    difficulty: easy
    tags: [weight-loss, hyperthyroidism, Graves, endocrine, autoimmune]
  - front: "What is the key finding from the DINAMO trial regarding acute diverticulitis?"
    back: "Uncomplicated mild acute diverticulitis can be effectively treated as an outpatient WITHOUT antibiotics. In an RCT of 480 patients, hospital admission rates were similar: 14/238 with antibiotics vs. 8/242 without antibiotics.\n\nThis landmark trial challenges the traditional management of uncomplicated diverticulitis with routine antibiotics. Most uncomplicated diverticulitis is self-limiting and resolves with bowel rest and analgesia. Antibiotics are still indicated for complicated diverticulitis (abscess, perforation, fistula, obstruction)."
    difficulty: medium
    tags: [diverticulitis, antibiotics, DINAMO trial, evidence-based medicine]
  - front: "What are the common causes of constipation, including organic and functional categories?"
    back: "Organic: colorectal cancer, stricture, extrinsic compression, anal disease, rectocele. Medications: narcotics, antidepressants, calcium channel blockers. Metabolic: diabetes mellitus, hypothyroidism, hypercalcemia. Neurologic: Parkinson's disease, multiple sclerosis, stroke. Collagen vascular disease: scleroderma, dermatomyositis. Most often: no cause found → chronic idiopathic constipation, slow transit constipation, or defecatory disorder.\n\nConstipation in the absence of alarm features (weight loss, rectal bleeding, family history of colon cancer) can be managed empirically. New onset constipation in adults >50 warrants colorectal cancer screening."
    difficulty: medium
    tags: [constipation, colorectal cancer, hypothyroidism, narcotics, idiopathic constipation]
  - front: "What are the common causes of lower GI bleeding (LGIB)?"
    back: "Common: diverticulosis, ischemia, angiodysplasia (elderly), infectious colitis, IBD, anorectal disease (hemorrhoids, fissure, ulcer). Uncommon: brisk UGIB, post-polypectomy, radiation colitis. Rare: intussusception, vasculitides, stercoral ulcer, coagulopathies.\n\nDiverticular bleeding is the most common cause of LGIB in adults >40 years. Angiodysplasia is more common in elderly. Anorectal disease (hemorrhoids) is common but benign. Colonoscopy is the primary diagnostic and therapeutic tool for LGIB."
    difficulty: medium
    tags: [lower GI bleed, LGIB, diverticulosis, angiodysplasia, hemorrhoids]
  - front: "What are the distinguishing features of ischemic colitis compared with other causes of lower GI bleeding?"
    back: "Ischemic colitis: acute onset crampy left lower abdominal pain + rectal bleeding + possible abdominal tenderness. Affects watershed areas (splenic flexure and rectosigmoid junction). Risk factors: atherosclerotic risk factors, vasoconstricting medications (e.g., cocaine, vasopressors), history of low flow state (shock, cardiac surgery).\n\nThe splenic flexure and rectosigmoid are watershed areas with dual/marginal blood supply and are most susceptible to ischemia. The clinical picture of left-sided abdominal pain with rectal bleeding in an elderly patient with vascular risk factors should prompt consideration of ischemic colitis."
    difficulty: hard
    tags: [ischemic colitis, lower GI bleed, splenic flexure, watershed area, mesenteric ischemia]
