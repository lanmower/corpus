# General (Oncology) - generated from srs-mccqe1
cards:
  - front: "What infectious agent is required for Kaposi Sarcoma development?"
    back: "Human herpesvirus 8 (HHV-8)\n\nAlso known as Kaposi's sarcoma-associated herpesvirus (KSHV), HHV-8 is necessary but not sufficient for KS development. It is present in all clinical variants of the disease."
    difficulty: easy
    tags: [Kaposi sarcoma, HHV-8, virology, oncology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What infectious agent is REQUIRED for the development of Kaposi Sarcoma?"
    back: "Human Herpesvirus 8 (HHV-8), also known as Kaposi Sarcoma-associated Herpesvirus (KSHV)\n\nHHV-8 is present in all forms of Kaposi sarcoma and is the defining pathogenic agent, required for malignant transformation of endothelial cells."
    difficulty: easy
    tags: [Kaposi sarcoma, virology, HHV-8, oncology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "Which cancers commonly present with paraneoplastic syndromes?"
    back: "Lung, breast, ovaries, or lymphatic system\n\nThese tumors are most frequently associated with paraneoplastic phenomena."
    difficulty: easy
    tags: [oncology, paraneoplastic, cancer, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What cancers commonly present with paraneoplastic syndromes?"
    back: "Lung, breast, ovaries, and lymphatic system malignancies\n\nThese tumors frequently produce ectopic hormones or trigger autoimmune responses."
    difficulty: easy
    tags: [oncology, paraneoplastic, cancers, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the clinical features of ectopic ACTH syndrome?"
    back: "Weight gain in trunk, face, and between shoulders (typical Cushingoid features)\n\nHypercortisolism from ectopic ACTH produces classic Cushing's syndrome signs."
    difficulty: medium
    tags: [oncology, paraneoplastic, Cushings, symptoms, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "Which malignancies are commonly associated with paraneoplastic endocrine syndromes?"
    back: "Lung, breast, ovaries, or lymphatic system.\n\nThese tumors commonly produce ectopic hormones or trigger immune cross-reactions."
    difficulty: medium
    tags: [oncology, paraneoplastic, cancer, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
