# Ear Disorders & Hearing Loss (ENT) - generated from srs-mccqe1
cards:
  - front: "What is the most common causative organism of acute otitis media in children?"
    back: "Streptococcus pneumoniae (most common), followed by non-typeable Haemophilus influenzae and Moraxella catarrhalis\n\nAOM is most common in children 6–24 months. Pneumococcal conjugate vaccine (PCV13/PCV15) has reduced S. pneumoniae AOM. First-line treatment: amoxicillin 90 mg/kg/day divided BID for 10 days (high-dose to overcome resistance)."
    difficulty: easy
    tags: [acute-otitis-media, Streptococcus-pneumoniae, amoxicillin, children, PCV13]
  - front: "What is the Rinne test and what result indicates conductive hearing loss?"
    back: "Rinne test compares air conduction (AC) vs. bone conduction (BC) using a tuning fork; negative Rinne (BC > AC) indicates conductive hearing loss\n\nNormal/sensorineural hearing loss: AC > BC (positive Rinne). Conductive hearing loss: BC > AC (negative Rinne) because air conduction is blocked (effusion, ossicular disease, EAC obstruction). Weber test localizes to affected ear in conductive loss."
    difficulty: easy
    tags: [Rinne-test, hearing-loss, conductive, bone-conduction, tuning-fork]
  - front: "What is Menière disease and what is its classic tetrad of symptoms?"
    back: "Endolymphatic hydrops of the inner ear; tetrad: episodic vertigo (>20 min), fluctuating sensorineural hearing loss, tinnitus, and aural fullness\n\nMenière disease is diagnosed clinically. Treatment: low-sodium diet, diuretics (hydrochlorothiazide + triamterene), vestibular suppressants (dimenhydrinate) for acute attacks. Intratympanic gentamicin or endolymphatic sac decompression for refractory cases."
    difficulty: medium
    tags: [Meniere-disease, endolymphatic-hydrops, vertigo, sensorineural-hearing-loss, tinnitus]
  - front: "What is benign paroxysmal positional vertigo (BPPV) and what is the first-line treatment?"
    back: "Canalith displacement into semicircular canal causing brief positional vertigo; first-line: Epley maneuver (canalith repositioning)\n\nBPPV is the most common cause of vertigo. Dix-Hallpike test reproduces posterior canal BPPV. Epley maneuver cures 80–90%. No medication needed. Semont maneuver is an alternative. Recurrence rate is 15–50% within 1 year."
    difficulty: easy
    tags: [BPPV, canalith, Epley-maneuver, Dix-Hallpike, vertigo]
  - front: "A 5-year-old with recurrent AOM (>3 per 6 months) and bilateral effusions for >3 months with 30 dB hearing loss is referred for what procedure?"
    back: "Tympanostomy tube insertion (ventilation tubes / grommets)\n\nIndications for tubes: recurrent AOM ≥3 in 6 months or ≥4 in 12 months; OME >3 months with hearing loss ≥25 dB; OME with speech delay or learning problems. Tubes equalize middle ear pressure and drain effusions."
    difficulty: easy
    tags: [tympanostomy-tube, otitis-media, ventilation-tube, grommet, hearing-loss]
  - front: "What is otosclerosis and what are the audiological findings?"
    back: "Abnormal remodeling of the otic capsule causing fixation of the stapes footplate; findings: progressive conductive hearing loss with Carhart notch (reduced bone conduction at 2000 Hz) and normal TM on otoscopy\n\nOtosclerosis is autosomal dominant, common in white women, worsened by pregnancy. Audiogram: conductive hearing loss with Carhart notch at 2000 Hz, absent stapedial reflexes, type As (low compliance) tympanogram. Treatment: stapedotomy/stapedectomy."
    difficulty: medium
    tags: [otosclerosis, Carhart-notch, stapedotomy, conductive-hearing-loss, stapes]
  - front: "What is the most appropriate management of a single episode of sudden sensorineural hearing loss?"
    back: "Urgent ENT referral + oral corticosteroids (prednisone 1 mg/kg/day × 7–14 days) within 72 hours\n\nSudden SNHL (≥30 dB loss over ≥3 frequencies within 72 h) may be idiopathic, viral, or vascular. High-dose corticosteroids improve recovery. MRI brain/IAC to exclude acoustic neuroma. Hyperbaric oxygen is adjunctive in some centers."
    difficulty: medium
    tags: [sudden-sensorineural-hearing-loss, prednisone, ENT-referral, MRI, acoustic-neuroma]
  - front: "How do you differentiate acute otitis media from otitis externa?"
    back: "AOM: ear pain, fever, bulging/red TM, middle ear effusion, recent URI. OE: ear canal pain with tragal tenderness, edematous canal, discharge, no TM abnormality\n\nAOM treatment: amoxicillin 90mg/kg/day. Watch and wait if mild in >2y. OE: topical ciprofloxacin/dexamethasone drops, keep ear dry. Malignant OE in diabetics/immunocompromised: IV antibiotics."
    difficulty: medium
    tags: [otitis, ENT]
  - front: "How is acute otitis media diagnosed and managed in children?"
    back: "Diagnosis: moderate-severe bulging of TM or new otorrhea or mild bulging+recent ear pain/erythema. First-line: amoxicillin 75-90mg/kg/d divided BID x5-10d. Watch-and-wait option if >2yr, unilateral, non-severe\n\nCPS guidelines. High-dose amox overcomes pneumococcal resistance. Second-line if failure at 48-72h: amox-clav 90mg/kg/d. Tympanostomy tubes for recurrent AOM (>=3 in 6mo or >=4 in 12mo). Complications: mastoiditis (post-auricular swelling/erythema), meningitis."
    difficulty: medium
    tags: [otitis media, AOM, amoxicillin, pediatric]
  - front: "How does otitis externa differ from otitis media and how is it managed?"
    back: "OE: ear canal pain worse with tragal pressure/pinna traction, canal edema/debris. TM intact. Treat: topical antibiotic+steroid drops (ciprofloxacin-dexamethasone). Keep ear dry. Wick if canal very swollen\n\nOE risk: swimming, hearing aids, cotton swabs. Malignant OE in diabetics/immunocompromised: Pseudomonas, skull base osteomyelitis - requires IV antipseudomonal + CT scan. Fungal OE (otomycosis): fluffy/spore debris, treat with topical antifungal."
    difficulty: medium
    tags: [otitis externa, ear drops, management]
  - front: "What are the causes and management of sudden sensorineural hearing loss?"
    back: "SSNHL: >=30dB loss over <=3 days in >=3 consecutive frequencies. Causes: idiopathic (viral), vascular, autoimmune, Meniere, acoustic neuroma. Treatment: oral prednisone 1mg/kg x14d taper. Urgent ENT referral + audiogram\n\nSSNHL is an otologic EMERGENCY. Rule out: acoustic neuroma (MRI with gadolinium). Prognosis: 65% partial recovery. Intratympanic steroids if oral fails. Always differentiate from conductive loss (tuning fork: Weber lateralizes to affected ear in conductive, away in SNHL)."
    difficulty: hard
    tags: [SSNHL, hearing loss, prednisone]
  - front: "How is benign paroxysmal positional vertigo (BPPV) diagnosed and treated?"
    back: "Diagnosis: Dix-Hallpike test positive (upbeat-torsional nystagmus with 5-20s latency, fatigable, <60s). Posterior canal most common. Treatment: Epley maneuver (canalith repositioning). Avoid meclizine (delays compensation)\n\nBPPV caused by otoconia dislodged into semicircular canal. Dix-Hallpike: head turned 45 degrees, rapidly lie back with head extended. Epley: 93% effective after 1-2 treatments. Horizontal canal BPPV: supine roll test, Lempert maneuver."
    difficulty: medium
    tags: [BPPV, Dix-Hallpike, Epley, vertigo]
  - front: "What is the differential diagnosis of vertigo?"
    back: "Peripheral (ENT): BPPV (brief, positional), Meniere (hours, hearing loss, tinnitus, fullness), vestibular neuritis (days, post-viral). Central (neurology): stroke (HINTS exam abnormal), MS, tumor\n\nHINTS exam for acute vestibular syndrome: Head Impulse (normal=central), Nystagmus (direction-changing=central), Test of Skew (present=central). >90% sensitive for stroke. Peripheral: horizontal nystagmus, unidirectional, suppressed by fixation."
    difficulty: hard
    tags: [vertigo, BPPV, Meniere, HINTS]
  - front: "How is Meniere disease diagnosed and managed?"
    back: "Diagnosis: >=2 episodes of vertigo 20min-12h + low-mid frequency SNHL + aural fullness/tinnitus. Management: sodium restriction <2g/d, diuretic (hydrochlorothiazide), betahistine, acute: dimenhydrinate/benzodiazepine\n\nEndolymphatic hydrops is the pathological finding. Hearing loss is fluctuating initially, progressive over years. Intratympanic gentamicin or dexamethasone for refractory cases. Endolymphatic sac surgery. Avoid caffeine and alcohol."
    difficulty: medium
    tags: [Meniere, vertigo, hearing loss]
  - front: "What is cholesteatoma and how is it managed?"
    back: "Abnormal keratinizing squamous epithelium in middle ear. Presents: chronic otorrhea, conductive hearing loss, TM retraction pocket with debris. Complications: ossicular erosion, facial nerve palsy, intracranial abscess\n\nAcquired >> congenital. CT temporal bone for extent. Treatment: SURGICAL (tympanomastoidectomy). Not curable with antibiotics alone. Complications from erosion: labyrinthine fistula (vertigo), sigmoid sinus thrombosis, brain abscess. Lifelong surveillance for recurrence."
    difficulty: hard
    tags: [cholesteatoma, ear, surgery]
  - front: "How is conductive vs sensorineural hearing loss differentiated?"
    back: "Weber: lateralizes to affected ear (conductive) or normal ear (SNHL). Rinne: BC>AC = conductive loss (negative Rinne). AC>BC normal (positive Rinne). Audiogram confirms type and severity\n\nConductive: cerumen, effusion, TM perforation, ossicular chain, otosclerosis. Sensorineural: noise, presbycusis, ototoxic drugs, Meniere, acoustic neuroma, congenital. Mixed: chronic otitis media. Audiogram is essential investigation."
    difficulty: medium
    tags: [hearing loss, Weber, Rinne, audiogram]
  - front: "What are the indications for tympanostomy tubes?"
    back: "Recurrent AOM: >=3 in 6mo or >=4 in 12mo. Chronic OME: >=3 months bilateral with hearing loss. Chronic OME unilateral >=6mo. Complicated AOM. Eustachian tube dysfunction causing recurrent symptoms\n\nTubes ventilate middle ear and allow topical treatment. Usually extrude spontaneously in 6-18mo. Water precautions controversial (surface swimming generally OK). Otorrhea through tubes: topical ciprofloxacin-dex drops. Risks: persistent perforation 2%, tympanosclerosis."
    difficulty: medium
    tags: [tympanostomy tubes, AOM, OME]
  - front: "What ototoxic drugs should be monitored?"
    back: "Aminoglycosides (vestibulotoxic>cochleotoxic): gentamicin. Cisplatin (cochleotoxic, permanent, high-frequency). Loop diuretics (usually reversible). ASA at high doses (tinnitus, reversible). Vancomycin (especially with aminoglycosides)\n\nBaseline audiogram before ototoxic drugs. Monitor during treatment. Aminoglycoside: once-daily dosing with trough monitoring reduces toxicity. Risk factors: renal impairment, prolonged treatment, concurrent ototoxins. Hearing loss from cisplatin is irreversible."
    difficulty: medium
    tags: [ototoxicity, aminoglycoside, cisplatin]
  - front: "What is the differential diagnosis for conductive vs sensorineural hearing loss, and how do Weber and Rinne tests differentiate them?"
    back: "Conductive hearing loss (CHL): external/middle ear pathology — cerumen impaction, otitis media/effusion, tympanic membrane perforation, otosclerosis, cholesteatoma. Sensorineural hearing loss (SNHL): inner ear/CN VIII — presbycusis (age-related), noise-induced, Meniere disease, acoustic neuroma, ototoxic drugs (aminoglycosides, cisplatin), sudden SNHL. Weber test (tuning fork on forehead): CHL — lateralizes to AFFECTED ear; SNHL — lateralizes to UNAFFECTED ear. Rinne test (tuning fork on mastoid then beside ear): CHL — bone conduction > air conduction (negative Rinne); SNHL — air conduction > bone conduction (positive Rinne, but reduced).\n\nMnemonic for Weber: 'CHL loves the bad ear' (sound conducted through bone to the ear with conductive block). Rinne: in CHL, bone > air because the middle ear conduction is impaired. Audiometry is the definitive test. In Canada, audiologists perform pure-tone audiometry and are accessible via referral."
    difficulty: medium
    tags: [hearing loss, conductive, sensorineural, Weber test, Rinne test, ENT]
  - front: "A 45-year-old wakes up with sudden unilateral hearing loss. What is the diagnosis and urgency of management?"
    back: "Sudden sensorineural hearing loss (SSNHL) — an otologic EMERGENCY. Definition: ≥30 dB loss over 3 contiguous frequencies within 72 hours. Management: urgent audiology (audiogram within 24h), high-dose oral corticosteroids (prednisone 1 mg/kg/day for 10-14 days with taper) — must start within 2 weeks (ideally within 72h) for best outcomes; intratympanic dexamethasone if systemic steroids fail or are contraindicated; MRI with gadolinium to rule out acoustic neuroma (vestibular schwannoma). Workup: CBC, ESR/CRP, glucose, TSH, syphilis serology, autoimmune screen if bilateral.\n\nSSNHL is often misdiagnosed as cerumen impaction or otitis — always do a Rinne/Weber to confirm sensorineural pattern. ~1/3 recover spontaneously, ~1/3 improve with treatment, ~1/3 have permanent loss. Early steroid treatment is the only intervention with proven benefit. Canadian Otolaryngology guidelines emphasize urgent ENT referral within 24-48 hours."
    difficulty: hard
    tags: [sudden hearing loss, SSNHL, emergency, corticosteroids, ENT]
  - front: "A 50-year-old woman presents with progressive bilateral hearing loss. Otoscopy is normal. Rinne test shows bone conduction > air conduction bilaterally. What is the most likely diagnosis?"
    back: "Otosclerosis: abnormal bone remodeling of the stapes footplate causing fixation at the oval window → progressive conductive hearing loss. Features: bilateral (often worse in one ear), family history (autosomal dominant with variable penetrance), Carhart notch (characteristic dip at 2000 Hz on audiometry), Schwartze sign (pink blush behind TM on otoscopy from increased vascularity — not always present), may worsen during pregnancy. Treatment: hearing aids (conservative) or stapedectomy/stapedotomy (surgical — excellent results, >90% improvement).\n\nOtosclerosis is the most common cause of progressive conductive hearing loss in adults with a normal tympanic membrane. It typically presents in the 20s-40s and is more common in females and Caucasians. The Carhart notch is an audiometric artifact, not true sensorineural loss — it resolves after successful stapedectomy. In Canada, stapedectomy is covered under provincial health insurance."
    difficulty: medium
    tags: [otosclerosis, conductive hearing loss, stapedectomy, Carhart notch, ENT]
  - front: "What is the first-line antibiotic for acute otitis media (AOM) in children, and what is used for treatment failure?"
    back: "First line: amoxicillin 75–90 mg/kg/day BID. Penicillin allergy: cefprozil or cefuroxime-axetil 30 mg/kg/day BID/TID OR ceftriaxone 50 mg/kg/day IM x 3 days (minor allergy) OR clarithromycin 15 mg/kg/day BID (severe allergy, inferior bacterial killing). Treatment failure: amoxicillin-clavulanate (T:1 ratio), <35 kg: 45–60 mg/kg/day TID; >35 kg: 500 mg TID.\n\nHigh-dose amoxicillin overcomes low-level penicillin resistance in S. pneumoniae. Amoxicillin-clavulanate covers beta-lactamase producing H. influenzae and M. catarrhalis, common causes of treatment failure. Clarithromycin has suboptimal efficacy for AOM due to inferior bacterial killing but is used for severe penicillin allergy."
    difficulty: medium
    tags: [otitis media, amoxicillin, pediatric, antibiotics, treatment failure]
  - front: "How does the Dix-Hallpike test work and what does a positive result indicate?"
    back: "Patient seated with legs extended, head rotated 45°. Rapidly shift patient to supine with head fully supported in slight extension. Observe for rotatory nystagmus and ask about vertigo. A positive test (rotatory nystagmus + vertigo) indicates BPPV.\n\nThe Dix-Hallpike test assesses the posterior semicircular canal. BPPV is the most common cause of vertigo and is caused by displaced otoliths (canalith repositioning maneuver/Epley technique is treatment)."
    difficulty: medium
    tags: [BPPV, vertigo, Dix-Hallpike, nystagmus, dizziness]
  - front: "Compare the features of BPPV, labyrinthitis, Meniere's disease, and acoustic neuroma."
    back: "BPPV: sudden onset, seconds duration, no hearing loss, no tinnitus. Labyrinthitis: sudden onset, days duration, +/- hearing loss, +/- tinnitus. Meniere's: sudden onset, minutes-hours duration, hearing loss, tinnitus. Acoustic neuroma: insidious onset, chronic duration, hearing loss, tinnitus.\n\nDuration is key in differentiating peripheral causes of vertigo. BPPV lasts seconds and is positional. Labyrinthitis lasts days. Meniere's episodes last minutes to hours. Acoustic neuroma causes chronic progressive symptoms."
    difficulty: medium
    tags: [vertigo, BPPV, Menieres, acoustic neuroma, labyrinthitis, differential]
  - front: "What are ototoxic drugs that can cause dizziness?"
    back: "Aminoglycosides (gentamicin, streptomycin, tobramycin), erythromycin, ASA, antimalarials (ototoxic agents). Furosemide, caffeine, and alcohol can cause hypotension contributing to dizziness.\n\nAminoglycosides damage hair cells in the cochlea and vestibule, causing both hearing loss and vestibular dysfunction. This is irreversible with prolonged use or high doses, particularly in patients with renal insufficiency."
    difficulty: medium
    tags: [ototoxicity, dizziness, aminoglycosides, gentamicin, vestibular]
  - front: "What features in dizziness history suggest a central versus peripheral vestibular cause?"
    back: "Central (neurologic): transient diplopia, dysphagia, dysarthria, ataxia (TIA/VBI/migraine), persistent headache, altered consciousness, sensory/motor deficits. Peripheral (audiologic): hearing loss, tinnitus, otalgia, aural fullness, nausea/vomiting. Worse with head movement = vestibular. Worse with exercise = cardiac/pulmonary.\n\nCentral causes of vertigo are dangerous and require urgent neuroimaging. The HINTS exam (Head Impulse, Nystagmus, Test of Skew) can differentiate central from peripheral vertigo at the bedside."
    difficulty: medium
    tags: [vertigo, dizziness, central vs peripheral, TIA, HINTS exam]
  - front: "What types of dizziness should be clarified in the history and how does each differ?"
    back: "Vertigo: illusion of movement (spinning). Pre-syncope: feeling of impending faint. Disequilibrium: sense of imbalance (often with walking). Lightheadedness: vague, non-specific. Each points to different etiologies: vertigo (vestibular), pre-syncope (cardiac/autonomic), disequilibrium (cerebellar/proprioceptive), lightheadedness (psychiatric/hyperventilation).\n\nClarifying the type of dizziness is the most important initial step. 70% of affected patients initially see GPs. Dizziness is the most common complaint in ambulatory patients >75 years."
    difficulty: medium
    tags: [dizziness, vertigo, pre-syncope, disequilibrium, lightheadedness, differential]
