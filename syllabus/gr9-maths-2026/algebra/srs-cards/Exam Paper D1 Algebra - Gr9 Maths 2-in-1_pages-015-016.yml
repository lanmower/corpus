# Gr 9 Maths 2-in-1 — algebra / Exam Paper D1 Algebra
deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
notes:
  - guid: 100a200b300c400d
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "MCQ (Q1.1): Simplify 2x − x(x + y). Options: A x²+xy  B 2x−x²−xy  C x²−xy  D 2x−x²+xy."
      Back: "Answer: B.\nDistribute the −x: 2x − x(x + y) = 2x − x·x − x·y = 2x − x² − xy.\nWatch the sign: the minus in front of x multiplies BOTH terms in the bracket, making both negative."
    tags: ["exam-d1", "mcq", "distribute", "subject:algebra"]
  - guid: 200b300c400d500e
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "MCQ (Q1.2): The number 1 is NOT a(n)... A rational number  B whole number  C irrational number  D integer."
      Back: "Answer: C (irrational number).\n1 IS rational (1/1), IS a whole number, and IS an integer. An irrational number is one with a non-recurring, non-terminating decimal — 1 is not irrational, so the odd one out is C."
    tags: ["exam-d1", "mcq", "number-types", "subject:algebra"]
  - guid: 300c400d500e600f
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "MCQ (Q1.3): All fractions can be written as a(n)... A percentage  B decimal  C ratio  D option A; B and C."
      Back: "Answer: D (option A; B and C).\nA fraction can be expressed as a percentage, a decimal AND a ratio — these are three different ways of expressing the same fraction, so all apply."
    tags: ["exam-d1", "mcq", "fractions", "subject:algebra"]
  - guid: 400d500e600f7010
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "MCQ (Q1.4): Simplify √(16x⁴/y¹⁶). Options: A 4x²/y⁴  B 8x²/y⁸  C 8x²/y⁴  D 4x²/y⁸."
      Back: "Answer: D (4x²/y⁸).\nTake the square root of each part: √16 = 4; √(x⁴) = x² (halve the exponent); √(y¹⁶) = y⁸ (halve the exponent).\nSo √(16x⁴/y¹⁶) = 4x²/y⁸. To root a power, halve its exponent."
    tags: ["exam-d1", "mcq", "roots", "subject:algebra"]
  - guid: 500e600f70108011
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "MCQ (Q1.5): Find the missing number in the sequence 2 ; 5 ; 10 ; ... ; 26. Options: A 15  B 25  C 17  D 20."
      Back: "Answer: C (17).\nThe pattern of first differences is +3, +5, +7, +9: 2 →(+3) 5 →(+5) 10 →(+7) 17 →(+9) 26.\n(Equivalently the terms are n²+1: 1²+1=2, 2²+1=5, 3²+1=10, 4²+1=17, 5²+1=26.)"
    tags: ["exam-d1", "mcq", "sequences", "subject:algebra"]
  - guid: 600f70108011a012
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "MCQ (Q1.6): The ratio 2/5 : 4/6 : 7/15 simplifies to... A 2:4:7  B 12/30:20/30:14/30  C 12:20:14  D 6:10:7."
      Back: "Answer: D (6:10:7).\nStep 1 common denominator 30: 2/5 : 4/6 : 7/15 = 12/30 : 20/30 : 14/30, so ratio of numerators = 12 : 20 : 14 (×30 to make whole numbers).\nStep 2 simplify by ÷2: 6 : 10 : 7. Always clear fractions, then reduce to lowest terms."
    tags: ["exam-d1", "mcq", "ratio", "subject:algebra"]
  - guid: 70108011a012b013
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Multiply out (Q2.1.1): 3x(y + 4z)."
      Back: "Distribute 3x to each term: 3x(y + 4z) = 3x·y + 3x·4z = 3xy + 12xz.\nEvery term inside the bracket is multiplied by the term outside."
    tags: ["exam-d1", "distribute", "subject:algebra"]
  - guid: 8011a012b013c014
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Expand a perfect square (Q2.1.2): (2x + 1)². What is the pattern?"
      Back: "(2x + 1)² = (2x + 1)(2x + 1) = 4x² + 2x + 2x + 1 = 4x² + 4x + 1.\nPattern (a + b)² = a² + 2ab + b²: square the first (4x²), twice the product (2·2x·1 = 4x), square the last (1). The two middle terms are always equal."
    tags: ["exam-d1", "perfect-square", "foil", "subject:algebra"]
  - guid: 9012b013c014d015
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "FOIL (Q2.1.3): expand (2x − 1)(3x + 2)."
      Back: "FOIL = First, Outer, Inner, Last:\nF: 2x·3x = 6x²;  O: 2x·2 = 4x;  I: −1·3x = −3x;  L: −1·2 = −2.\n(2x − 1)(3x + 2) = 6x² + 4x − 3x − 2 = 6x² + x − 2.\nCombine the like middle terms 4x − 3x = x."
    tags: ["exam-d1", "foil", "binomials", "subject:algebra"]
  - guid: a013c014d015e016
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Multi-step expansion (Q2.1.4): simplify (2x − 5)(x − 3) + (x + 2)⁰ − (x − 2)²."
      Back: "(2x−5)(x−3) = 2x²−6x−5x+15 = 2x²−11x+15.\n(x+2)⁰ = 1 (anything to power 0 is 1).\n(x−2)² = x²−4x+4, and we subtract it: −(x²−4x+4) = −x²+4x−4.\nCombine: 2x²−11x+15 + 1 − x²+4x−4 = x² − 7x + 12.\nKEY: keep the bracket on −(x−2)² so all signs flip correctly."
    tags: ["exam-d1", "foil", "perfect-square", "signs", "subject:algebra"]
  - guid: b014d015e016f017
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Simplify (Q2.2.1): 10x³ ÷ ½x²."
      Back: "Dividing by ½ is multiplying by 2 (put the whole number over 1, flip the fraction):\n10x³ ÷ ½x² = 10x³ ÷ (x²/2) = (10x³/1) × (2/x²) = 20x^(3−2) = 20x.\nTip: ÷ a fraction = × its reciprocal; subtract exponents for the same base."
    tags: ["exam-d1", "dividing", "exponents", "subject:algebra"]
  - guid: c015e016f017a018
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Simplify (Q2.2.2): (2x² × ¼xy × 8x⁰) ÷ (3x × 4y)."
      Back: "Numerator: ¼xy and 8x⁰: x⁰ = 1 so 8x⁰ = 8; ¼ × 8 = 2. So numerator = 2x²·xy·... = 2x² × ¼xy × 8 = 4x³y (since 2x²·xy = 2x³y, ×¼×8 gives 4x³y).\nDenominator: 3x × 4y = 12xy.\nDivide: 4x³y / 12xy = (4/12)x^(3−1)y^(1−1) = (1/3)x² = x²/3.\nNB 8x⁰ = 8(1) = 8, which is different from (8x)⁰ = 1."
    tags: ["exam-d1", "dividing", "zero-exponent", "subject:algebra"]
  - guid: d016f017a018b019
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Simplify the algebraic fraction (Q2.2.3): (6x² − 24)/(3x² + 6x). Why must you factorise first?"
      Back: "You can only cancel FACTORS, not terms — so factorise top and bottom first:\nTop: 6x² − 24 = 6(x² − 4) = 6(x + 2)(x − 2)  [difference of squares].\nBottom: 3x² + 6x = 3x(x + 2).\n= [6(x+2)(x−2)] / [3x(x+2)] = cancel 3 and (x+2): = 2(x − 2)/x.\nNever cancel across a + or − sign."
    tags: ["exam-d1", "algebraic-fractions", "factorising", "subject:algebra"]
  - guid: e017a018b019c01a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Add algebraic fractions (Q2.2.4): (2x²×4y)/(3y²×4x) + (2x²×3)/(2x×9y)."
      Back: "Simplify each fraction first.\nFirst: 8x²y / 12xy² = (8/12)x^(2−1)y^(1−2) = (2/3)x/y = 2x/(3y).\nSecond: 6x² / 18xy = (6/18)x^(2−1)/y = (1/3)x/y = x/(3y).\nSame denominator (3y), so add numerators: 2x/(3y) + x/(3y) = 3x/(3y) = x/y.\nAlways check at the end whether the result simplifies (3x/3y → x/y)."
    tags: ["exam-d1", "algebraic-fractions", "adding", "subject:algebra"]
  - guid: f018b019c01ad01b
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Word problem (Q2.3): An isosceles triangle has two equal sides each = 2x² + 2x and perimeter = 7x² + 10x. Find the third side in terms of x."
      Back: "Perimeter P = sum of all 3 sides.\nThird side = P − (sum of the two equal sides)\n= (7x² + 10x) − (2x² + 2x + 2x² + 2x)\n= 7x² + 10x − (4x² + 4x)\n= 7x² + 10x − 4x² − 4x\n= 3x² + 6x.\nKeep the bracket so both subtracted terms change sign."
    tags: ["exam-d1", "perimeter", "word-problem", "subject:algebra"]
  - guid: 019c01ad01be01c2
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Factorise by common factor (Q3.1): 2x² + 14x."
      Back: "Find the highest common factor of the coefficients and variables: HCF of 2x² and 14x is 2x.\n2x² + 14x = 2x(x + 7).\nCheck by expanding: 2x·x + 2x·7 = 2x² + 14x. ✓"
    tags: ["exam-d1", "factorising", "common-factor", "subject:algebra"]
  - guid: 11ac01bd01ce01d3
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Factorise a difference of squares twice (Q3.2): x⁴ − 16."
      Back: "Difference of squares a² − b² = (a + b)(a − b):\nx⁴ − 16 = (x²)² − 4² = (x² + 4)(x² − 4).\nThe second factor is ITSELF a difference of squares: x² − 4 = (x + 2)(x − 2).\nFinal: x⁴ − 16 = (x² + 4)(x + 2)(x − 2).\n(x² + 4 is a SUM of squares and cannot be factorised further.)"
    tags: ["exam-d1", "factorising", "difference-of-squares", "subject:algebra"]
  - guid: 22bc01cd01de01e4
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Factorise (Q3.3): 4x² − 36. (Two-step.)"
      Back: "Take out the common factor 4 first, then difference of squares:\n4x² − 36 = 4(x² − 9) = 4(x + 3)(x − 3).\nAlways check for a common factor BEFORE applying difference of squares."
    tags: ["exam-d1", "factorising", "common-factor", "difference-of-squares", "subject:algebra"]
  - guid: 33cd01de01ef01f5
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Factorise a trinomial (Q3.4): x² + 7x + 12."
      Back: "Find two numbers that MULTIPLY to +12 and ADD to +7: those are +3 and +4.\nx² + 7x + 12 = (x + 3)(x + 4).\nCheck: 3 × 4 = 12 ✓, 3 + 4 = 7 ✓. Expand to confirm: x²+4x+3x+12 = x²+7x+12. ✓"
    tags: ["exam-d1", "factorising", "trinomial", "subject:algebra"]
  - guid: 44de01ef01f00206
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Factorise by grouping / common bracket (Q3.5): (2x − 3y)x² + (3y − 2x)."
      Back: "Notice (3y − 2x) = −(2x − 3y). Rewrite to expose the common bracket:\n(2x − 3y)x² + (3y − 2x) = (2x − 3y)x² − (2x − 3y) = (2x − 3y)(x² − 1).\nThen x² − 1 is a difference of squares: = (2x − 3y)(x + 1)(x − 1).\nKey trick: factor out −1 to flip a reversed bracket so it matches."
    tags: ["exam-d1", "factorising", "grouping", "difference-of-squares", "subject:algebra"]
  - guid: 55ef01f001020317
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Solve a linear equation (Q4.1.1): 10 − 3x = 1."
      Back: "Isolate the variable term, then divide:\n10 − 3x = 1 → −3x = 1 − 10 → −3x = −9 → x = −9 / −3 → x = 3.\nCheck: 10 − 3(3) = 10 − 9 = 1. ✓"
    tags: ["exam-d1", "solving-equations", "linear", "subject:algebra"]
  - guid: 66f0010203040428
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Solve with brackets on both sides (Q4.1.2): 3(x + 2) = 2 − 1(x + 4)."
      Back: "Expand both sides: 3x + 6 = 2 − x − 4 → 3x + 6 = −x − 2.\nGather x's left, numbers right: 3x + x = −2 − 6 → 4x = −8 → x = −2.\nCheck: LHS 3(0) = 0; RHS 2 − 1(2) = 0. ✓ Remember −1(x + 4) = −x − 4."
    tags: ["exam-d1", "solving-equations", "linear", "subject:algebra"]
  - guid: 7701020304050639
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Solve where x² cancels (Q4.1.3): 3(x + 2) = 2x² + 12 + x²."
      Back: "RHS = 2x² + x² + 12 = 3x² + 12. Equation: 3(x + 2) = 3x² + 12 → 3x + 6 = 3x² + 12.\nDivide both sides by 3: x + 2 = x² + 4 → 0 = x² − x + 2.\nDiscriminant: (−1)² − 4(1)(2) = 1 − 8 = −7 < 0, so there is NO real solution. (At Gr 9 level: state no real solution.)"
    tags: ["exam-d1", "solving-equations", "quadratic", "subject:algebra"]
  - guid: 880203040506074a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Solve an equation with fractions (Q4.1.4): 2x/4 + 1/3 = −4/6."
      Back: "Simplify and clear denominators (LCD = 12). Note 2x/4 = x/2 and −4/6 = −2/3.\nMultiply every term by 12: 12(x/2) + 12(1/3) = 12(−2/3) → 6x + 4 = −8.\n6x = −12 → x = −2.\nCheck: (2·−2)/4 + 1/3 = −1 + 1/3 = −2/3 = −4/6. ✓"
    tags: ["exam-d1", "solving-equations", "fractions", "subject:algebra"]
  - guid: 990304050607085b
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Solve the equation (Q4.1.5): (2x² + x)/x = (4x² + 3)/(2x)."
      Back: "Simplify LHS by dividing each term by x: (2x² + x)/x = 2x + 1.\nSo 2x + 1 = (4x² + 3)/(2x). Multiply both sides by 2x: 2x(2x + 1) = 4x² + 3 → 4x² + 2x = 4x² + 3.\nSubtract 4x²: 2x = 3 → x = 3/2.\n(x ≠ 0 is required since we divided by x.)"
    tags: ["exam-d1", "solving-equations", "algebraic-fractions", "subject:algebra"]
  - guid: aa04050607080906
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Set up an equation from words (Q4.2.1): x + 9 orange and 2x − 3 yellow jellybeans are in a packet with a total of 2(x + 8) yellow-and-orange jellybeans. Write the equation."
      Back: "Total = orange + yellow:\n(x + 9) + (2x − 3) = 2(x + 8).\nSimplify the left: 3x + 6 = 2(x + 8). (You translate 'a total of' into an = sign, sum the two given quantities on one side.)"
    tags: ["exam-d1", "word-problem", "setting-up-equations", "subject:algebra"]
  - guid: bb05060708090a7d
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Solve and answer (Q4.2.2): from 3x + 6 = 2(x + 8), how many orange jellybeans (x + 9) are in the packet?"
      Back: "3x + 6 = 2x + 16 → 3x − 2x = 16 − 6 → x = 10.\nFavourite colour is orange: orange jellybeans = x + 9 = 10 + 9 = 19.\nAlways substitute x back into the quantity the question actually asks for."
    tags: ["exam-d1", "word-problem", "solving-equations", "subject:algebra"]
  - guid: cc060708090a0b8e
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Ratio word problem (Q4.3.1): games won : games lost = 5 : 1, and they only lost x + 4 games. How many games did the girls win, in terms of x?"
      Back: "Won : lost = 5 : 1, so won = 5 × lost.\nLost = x + 4, therefore won = 5(x + 4) = 5x + 20 games.\nMultiply the lost quantity by the won-side of the ratio."
    tags: ["exam-d1", "ratio", "word-problem", "subject:algebra"]
  - guid: dd0708090a0b0c9f
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Exam Paper D1 Algebra"
    fields:
      Front: "Ratio word problem (Q4.3.2): if they played a total of 10x games and lost x + 4 while winning 5x + 20, form and solve an equation for total matches."
      Back: "Total = won + lost: (5x + 20) + (x + 4) = 10x.\n6x + 24 = 10x → 24 = 4x → x = 6.\nTotal games = 10x = 10(6) = 60. (Check: lost = 10, won = 50, and 50:10 = 5:1 ✓.)"
    tags: ["exam-d1", "ratio", "word-problem", "solving-equations", "subject:algebra"]
