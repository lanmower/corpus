# Rheum Arthritis (Rheumatology) - generated from srs-mccqe1
cards:
  - front: "What are the joints commonly affected in hemochromatosis?"
    back: "Any joint can be affected, but especially the metacarpophalangeal (MCP) joints; also chondrocalcinosis\n\nArthropathy in hemochromatosis often involves the MCP joints and is a common presenting feature."
    difficulty: medium
    tags: [Hemochromatosis, rheumatology, joints, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What joint findings are associated with hemochromatosis?"
    back: "Arthralgia affecting any joint, especially metacarpophalangeal joints, and chondrocalcinosis\n\nArthropathy in hemochromatosis results from iron deposition in joints, commonly affecting the MCP joints."
    difficulty: medium
    tags: [hemochromatosis, rheumatology, arthralgia, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What joint involvement is characteristic in hemochromatosis?"
    back: "Arthralgia, especially of the metacarpophalangeal joints, and chondrocalcinosis\n\nMCP joint arthritis is classic. Chondrocalcinosis (calcium pyrophosphate deposition) is also common and can cause acute arthritis attacks."
    difficulty: medium
    tags: [hemochromatosis, rheumatology, arthritis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the serologic hallmark of Rheumatoid Arthritis?"
    back: "Rheumatoid Factor (RF)\n\nRF is present in 70-80% of RA patients and is directed against the Fc domain of IgG."
    difficulty: easy
    tags: [rheumatoid-arthritis, rheumatoid-factor, autoantibodies, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What are the 4 classic clinical features of Rheumatoid Arthritis?"
    back: "Symmetrical polyarthritis (small joints), morning stiffness >1 hour, subcutaneous nodules, and progressive joint deformities\n\nRA is characterized by inflammatory joint disease with extra-articular features including subcutaneous nodules."
    difficulty: easy
    tags: [rheumatoid-arthritis, clinical-features, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the 2010 ACR/EULAR classification criteria score threshold for definite Rheumatoid Arthritis?"
    back: "6 out of 10 points\n\nThe score-based algorithm includes joint involvement (0-5), serology (0-3), acute phase reactants (0-1), and symptom duration (0-1)."
    difficulty: medium
    tags: [rheumatoid-arthritis, acr-eular-criteria, classification, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "In the 2010 ACR/EULAR RA criteria, how many points does involvement of 1-3 small joints score?"
    back: "2 points\n\nJoint involvement scoring: 1 large joint = 0, 2-10 large joints = 1, 1-3 small joints = 2, 4-10 small joints = 3, >10 joints = 5."
    difficulty: medium
    tags: [rheumatoid-arthritis, acr-eular-criteria, classification, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the most sensitive autoantibody test for Rheumatoid Arthritis?"
    back: "Rheumatoid Factor (RF)\n\nRF is sensitive (70-80%) but not specific; it can be negative early in disease course."
    difficulty: easy
    tags: [rheumatoid-arthritis, rheumatoid-factor, diagnosis, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the key radiographic finding in early Rheumatoid Arthritis?"
    back: "Periarticular osteopenia\n\nLater findings include joint space narrowing and erosions."
    difficulty: easy
    tags: [rheumatoid-arthritis, radiography, diagnosis, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the relationship between RF positivity and joint disease in RA?"
    back: "Positive RF is associated with more aggressive joint disease and extra-articular features (e.g., nodules)\n\nRF positivity indicates a more severe disease phenotype."
    difficulty: easy
    tags: [rheumatoid-arthritis, rheumatoid-factor, prognosis, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What immunosuppressive agents are added to glucocorticoid therapy for dermatomyositis?"
    back: "Azathioprine or methotrexate (MTX)\n\nThese steroid-sparing agents help maintain remission and reduce long-term glucocorticoid exposure."
    difficulty: easy
    tags: [Dermatomyositis, Immunosuppression, Treatment, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is pseudogout (CPPD disease)?"
    back: "Joint inflammation caused by calcium pyrophosphate (CPP) crystal deposition in connective tissue\n\nCPP crystals trigger acute inflammatory arthritis when phagocytosed by neutrophils, releasing inflammatory mediators."
    difficulty: medium
    tags: [pseudogout, CPPD, rheumatology, crystals, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What are the common sites of pseudogout involvement?"
    back: "Knees, wrists, metacarpophalangeal (MCP) joints, hips, shoulders; less commonly elbows, ankles, big toe, spine\n\nUnlike gout which favors lower extremities, pseudogout commonly affects the knee and wrist."
    difficulty: medium
    tags: [pseudogout, CPPD, clinical presentation, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
