# Urology Renal Neoplasms (Urology) - generated from srs-mccqe1
cards:
  - front: "What is the Bosniak classification system used for, and what imaging modality is it based on?"
    back: "The Bosniak classification stratifies renal cysts for risk of malignancy based on cyst features from contrast CT.\n\nBosniak Class I and II are simple cysts with near-zero to minimal malignancy risk requiring no follow-up. Class IIF has up to 20% risk and needs imaging follow-up. Class III (>50%) and IV (>90%) require surgical resection."
    difficulty: easy
    tags: [urology, renal mass, Bosniak, renal cysts, CT]
  - front: "What are the Bosniak class features and risk of malignancy for each class?"
    back: "I: simple, no septa/calcification/enhancement, <20 HU — near zero. II: thin septum, fine calcification, no enhancement, <3 cm — minimal. IIF: multiple thin septa, calcifications, no enhancement, >3 cm — <20%. III: irregular thickened calcified septa with enhancement — >50%. IV: irregular thickened septa with enhancement plus enhancing soft-tissue components — >90%.\n\nClass I and II require no follow-up; IIF requires imaging at 6-12 months with resection if evolving; Class III and IV require surgical resection. Growing literature suggests surveillance may be safe for some Class III lesions."
    difficulty: medium
    tags: [urology, Bosniak, renal cysts, malignancy risk]
  - front: "What is the management approach for small solid renal masses based on size?"
    back: "<2 cm: active surveillance with imaging q3-6 months, intervene if growth >2 cm or >0.5 cm/yr. 2-4 cm: active surveillance or definitive therapy (biopsy + thermal ablation or partial nephrectomy). If limited life expectancy: watchful waiting.\n\nInitial workup includes kidney function (Cr, eGFR), CXR, contrast CT or MRI, ± renal biopsy. The management is tailored to tumour size and patient factors including life expectancy."
    difficulty: medium
    tags: [urology, renal mass, active surveillance, partial nephrectomy]
  - front: "What are the distinguishing features of angiomyolipoma (AML) on CT?"
    back: "Negative attenuation (-20 HU) on CT is pathognomonic for AML due to fat content. AML consists of blood vessels (angio-), smooth muscle (-myo-), and fat (lipoma).\n\nAML is a clonal neoplasm. 20% are associated with tuberous sclerosis, especially if multiple/recurrent. Most are incidental; symptomatic cases (pain, bleeding) or high bleeding risk (e.g., pregnancy) may require surgical excision or embolization. mTOR inhibitors have a potential role in unresectable/metastatic disease."
    difficulty: easy
    tags: [urology, angiomyolipoma, renal mass, CT, tuberous sclerosis]
  - front: "Why is renal oncocytoma treated as RCC until proven otherwise?"
    back: "Renal oncocytoma is difficult to distinguish from RCC on imaging. It appears as a spherical, capsulated mass with possible central scar on CT; biopsy may be performed to rule out malignancy.\n\nOncocytoma accounts for 3-7% of renal tumours and is histologically composed of eosinophilic cells originating from intercalated cells of the collecting duct. Most are managed with surveillance; large masses may need partial/radical nephrectomy."
    difficulty: medium
    tags: [urology, renal oncocytoma, RCC, renal mass]
  - front: "What cell of origin and histological subtypes characterize renal cell carcinoma (RCC)?"
    back: "RCC originates from proximal convoluted tubule epithelial cells (clear cell subtype). Subtypes: clear cell (75-85%), papillary (10-15%), chromophobe (5-10%), collecting duct (<1%). Sarcomatoid/rhabdoid elements in any subtype indicate poor prognosis.\n\nRCC accounts for 85% of primary malignant kidney tumours and ~3% of all malignancies. Peak incidence is ages 50-60 with M:F ratio of 1.5:1. Hereditary forms occur with von Hippel-Lindau syndrome, hereditary papillary renal carcinoma, Birt-Hogg-Dubé syndrome, and hereditary leiomyomatosis."
    difficulty: medium
    tags: [urology, RCC, renal cell carcinoma, histology]
  - front: "What is the 'too late triad' of renal cell carcinoma, and how commonly is it seen?"
    back: "The classic triad is: gross hematuria (50%), flank pain (<50%), and palpable mass (<30%). It is seen in only 10-15% of patients and indicates advanced disease.\n\nThe majority of RCCs (>50%) are now diagnosed incidentally by U/S or CT. The triad indicates late presentation. Poor prognostic indicators include weight loss, weakness, anemia, and bone pain. One-third of new cases present with metastases; an additional 20-40% develop metastases later."
    difficulty: easy
    tags: [urology, RCC, clinical features, hematuria]
  - front: "What are the most common metastatic sites of RCC and what local vascular complications can occur?"
    back: "Most common metastatic sites: bone, brain, lung, and liver. RCC may invade renal veins and the IVC, potentially causing ascites, hepatic dysfunction, right atrial tumour, varicocele, and pulmonary emboli.\n\nOne-third of RCC patients present with metastases. IVC extension is clinically significant and must be assessed with MRI preoperatively. Right-sided varicocele that does not decompress with supine position should raise suspicion for IVC obstruction by tumour."
    difficulty: medium
    tags: [urology, RCC, metastases, IVC, varicocele]
  - front: "What is the TNM T staging for RCC (AJCC 8th edition)?"
    back: "T1: <7 cm confined to renal parenchyma (T1a: <4 cm, T1b: 4-7 cm). T2: >7 cm confined (T2a: >7-10 cm, T2b: >10 cm). T3: extends into major veins or perinephric tissues but NOT into ipsilateral adrenal or beyond Gerota's fascia (T3a: renal vein/sinus fat; T3b: infradiaphragmatic IVC; T3c: supradiaphragmatic IVC). T4: beyond Gerota's fascia including ipsilateral adrenal.\n\nStage at diagnosis is the most important prognostic factor: T1 has 90-100% 5-year survival; T2-T3 approximately 60%; metastatic disease <5% 10-year survival."
    difficulty: hard
    tags: [urology, RCC, TNM staging, AJCC]
  - front: "What are the treatment options for advanced/metastatic RCC?"
    back: "Immune checkpoint inhibitors (pembrolizumab, ipilimumab, nivolumab), tyrosine kinase inhibitors (sunitinib, sorafenib, axitinib, lenvatinib), HIF-2α inhibitors (belzutifan). IFN-α monotherapy has largely been replaced by molecularly targeted agents. Palliative radiation to painful bony lesions and SBRT for non-surgical candidates.\n\nSurgical removal of solitary metastasis may also be considered. Radical nephrectomy removes kidney, tumour, ipsilateral adrenal gland (upper pole tumours), and intact Gerota's fascia. Partial nephrectomy is used for tumours <4 cm or solitary kidney."
    difficulty: hard
    tags: [urology, RCC, treatment, immunotherapy, TKI]
  - front: "What is von Hippel-Lindau (VHL) syndrome and what urological manifestations are associated with it?"
    back: "VHL syndrome is associated with multiple bilateral renal cysts and/or renal cell carcinomas (50% incidence of RCC). Other features include cerebellar, spinal, and retinal hemangioblastomas, pancreatic and epididymal cysts, and pheochromocytomas.\n\nVHL is a hereditary form of RCC. Patients with VHL need regular surveillance with imaging of the kidneys (and other affected organs). Genetic testing for VHL should be considered for non-clear cell carcinoma, bilateral/multifocal tumours, and onset before age 45."
    difficulty: medium
    tags: [urology, von Hippel-Lindau, RCC, hereditary, pheochromocytoma]
