# Gr 9 Maths CAPS — data-handling / Representing Data
deck: "Corpus::Gr9 Maths::Representing Data"
notes:
  - guid: a6c8e0f2b4d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "What is a BAR GRAPH used for, and what are its key features?"
      Back: "A bar graph displays CATEGORICAL (or discrete) data. Each category gets a bar; the bar's height shows its frequency.\n\nFeatures:\n• Bars are SEPARATED by gaps\n• Bars are equal width\n• Axes labelled, title given, scale even\n\nGood for comparing categories (e.g. favourite sports, learners per grade)."
    tags: ["bar-graph", "subject:data-handling"]
  - guid: c8e0a2f4b6d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "What is a DOUBLE bar graph and when is it useful?"
      Back: "A double bar graph shows TWO data sets side-by-side for each category, using two different colours/shadings (with a key/legend).\n\nUseful for COMPARING two groups across the same categories, e.g. boys vs girls choosing each sport, or 2025 vs 2026 sales per month.\n\nAlways include a legend so the reader knows which colour is which group."
    tags: ["bar-graph", "subject:data-handling"]
  - guid: e0a2c4f6b8d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "How does a HISTOGRAM differ from a bar graph?"
      Back: "HISTOGRAM: for NUMERICAL data grouped into class intervals (continuous data). Bars TOUCH (no gaps) because the intervals are continuous. The horizontal axis is a number line of intervals.\n\nBAR GRAPH: for CATEGORICAL/discrete data. Bars have GAPS between them; horizontal axis lists separate categories.\n\nKey memory: histogram bars touch (continuous), bar graph bars are separated (categories)."
    tags: ["histogram", "subject:data-handling"]
  - guid: 0a2e4c6f8b1d3957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "How do you calculate the ANGLE for a sector in a PIE CHART?"
      Back: "Angle = (frequency ÷ total) × 360°\n  = (category fraction) × 360°\n\nThe whole pie = 360° = 100% of the data. Each slice's angle is proportional to its share.\n\nCheck: all sector angles must add to 360°. Use a protractor to draw each angle from the centre."
    tags: ["pie-chart", "subject:data-handling"]
  - guid: 2a4e6c8f0b1d3957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "Pie chart worked example: 20 learners — 10 soccer, 6 netball, 4 hockey. Find each angle."
      Back: "Angle = (frequency ÷ 20) × 360°\n• Soccer: (10/20) × 360° = 180°\n• Netball: (6/20) × 360° = 108°\n• Hockey: (4/20) × 360° = 72°\n\nCheck: 180 + 108 + 72 = 360° ✓\n\nPercentages: soccer 50%, netball 30%, hockey 20%."
    tags: ["pie-chart", "subject:data-handling"]
  - guid: 4a6e8c0f2b1d3957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "What is a LINE graph / BROKEN-LINE graph best for?"
      Back: "A line graph shows how data CHANGES OVER TIME (or another continuous variable). Points are plotted and joined with straight line segments (broken-line graph).\n\nBest for TRENDS: temperature through a day, plant height over weeks, sales per month.\n\nThe slope shows rate of change: rising line = increasing, falling = decreasing, flat = no change."
    tags: ["line-graph", "subject:data-handling"]
  - guid: 6a8e0c2f4b1d3957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "What is a SCATTER PLOT and what does it reveal?"
      Back: "A scatter plot plots PAIRS of values (x, y) as dots — used to see the RELATIONSHIP/correlation between two numerical variables (e.g. hours studied vs test mark).\n\nPatterns:\n• Points trend upward → positive correlation\n• Points trend downward → negative correlation\n• No pattern → no correlation\n\nPoints are NOT joined up — you look at the overall trend."
    tags: ["scatter-plot", "subject:data-handling"]
  - guid: 8a0e2c4f6b1d3957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "What is a PICTOGRAM and what must it always include?"
      Back: "A pictogram represents data using PICTURES/icons, where each icon stands for a number of items.\n\nMust include a KEY, e.g. 🍎 = 5 apples. Partial icons show parts (half an icon = 2.5 apples).\n\nGood for simple, eye-catching categorical comparisons; less precise for exact values, especially with fractional icons."
    tags: ["pictogram", "subject:data-handling"]
  - guid: a0c2e4f6b8d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "Choosing the right graph: which graph for (a) trend over time, (b) parts of a whole, (c) comparing categories, (d) relationship between two variables?"
      Back: "(a) Trend over time → LINE / broken-line graph.\n(b) Parts of a whole (proportions, %) → PIE chart.\n(c) Comparing categories → BAR graph (double bar for two groups).\n(d) Relationship between two numerical variables → SCATTER plot.\n\nBonus: grouped continuous data → HISTOGRAM."
    tags: ["choosing-graph", "subject:data-handling"]
  - guid: c2e4a6f8b0d13957
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Representing Data"
    fields:
      Front: "What features must EVERY good graph include?"
      Back: "• A clear TITLE (what the graph shows)\n• Both AXES LABELLED (with units)\n• An EVEN, consistent SCALE on each axis\n• A KEY/legend if more than one data set or icon\n\nMissing labels or uneven scales make a graph misleading or impossible to read accurately."
    tags: ["choosing-graph", "subject:data-handling"]
