# Family Medicine Bph (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What is the definition of BPH, and how does the prostate feel on DRE in BPH vs. prostate cancer?"
    back: "BPH is hyperplasia of the stroma and epithelium in the periurethral transition zone. On DRE: BPH prostate is symmetrically enlarged, smooth, and rubbery. Prostate cancer: typically has asymmetric enlargement, hardness, or nodularity.\n\nThe transition zone (not the peripheral zone) is affected in BPH, while adenocarcinoma of the prostate most commonly arises in the peripheral zone (palpable on DRE). This anatomic distinction explains why BPH does not predispose to prostate cancer. DRE is a mandatory part of the BPH assessment."
    difficulty: easy
    tags: [BPH, DRE, prostate, diagnosis, urology, family medicine]
  - front: "Distinguish the obstructive and irritative symptoms of BPH, and list the late complications."
    back: "Obstructive: hesitancy, diminished stream size and force, stream interruption (double voiding), urinary retention, post-void dribbling, overflow incontinence, nocturia. Irritative: urgency, frequency, nocturia, urge incontinence, dysuria. Late complications: hydronephrosis, loss of renal concentrating ability, systemic acidosis, renal failure.\n\nObstructive symptoms result from mechanical obstruction of the bladder outlet, while irritative (storage) symptoms result from detrusor instability secondary to chronic obstruction. Nocturia appears in both categories. Late complications reflect back-pressure effects on the upper urinary tract — a urological emergency if bilateral hydronephrosis develops."
    difficulty: easy
    tags: [BPH, symptoms, obstructive, irritative, complications, urology, family medicine]
  - front: "What is the role of PSA in BPH management, and when is PSA testing inappropriate?"
    back: "PSA is no longer used to screen/diagnose BPH due to high false positive rate; instead used as a marker to guide treatment once diagnosis is made. PSA testing is inappropriate in: men with life expectancy <10 years, patients with prostatitis or UTI (can falsely elevate PSA). Increased PSA in a younger man is more often due to cancer than other causes. Discuss PSA testing with men at increased risk (family history, Black men) or those concerned about prostate cancer.\n\nPSA is prostate-specific (not prostate cancer-specific) — it can be elevated by BPH, prostatitis, UTI, and physical manipulation (e.g., DRE, catheterization, cycling). Abnormal DRE or PSA should trigger further assessment (urology referral). The decision to test asymptomatic men should follow shared decision-making."
    difficulty: medium
    tags: [PSA, BPH, prostate cancer, screening, family medicine, urology]
  - front: "What pharmacologic agents are used for moderate-to-severe BPH, and what are the mechanisms of each?"
    back: "1. Alpha-receptor antagonists (terazosin, doxazosin, tamsulosin, alfuzosin): relax smooth muscle around the prostate and bladder neck, improving urinary flow. 2. 5-alpha-reductase inhibitors (finasteride): inhibit conversion of testosterone to dihydrotestosterone, reducing prostate growth (only for demonstrated prostatic enlargement; maximum effect at 6–12 months). 3. Antimuscarinics and beta-3 agonists: for storage symptoms (avoid in bladder outlet obstruction/elevated PVR). 4. Long-acting PDE5 inhibitor: for patients with concurrent erectile dysfunction. 5. Desmopressin: for nocturia from nocturnal polyuria (watch for hyponatremia in older adults).\n\nAlpha-blockers provide rapid symptom relief while 5-ARIs provide long-term size reduction. Combination therapy (alpha-blocker + 5-ARI) is often used for large prostates. Finasteride takes 6–12 months for maximum effect and can reduce PSA by ~50% (must be factored into PSA interpretation)."
    difficulty: medium
    tags: [BPH, pharmacology, alpha-blockers, 5-alpha-reductase inhibitors, finasteride, tamsulosin, urology]
  - front: "What are the absolute indications for surgical intervention (TURP/TUIP) in BPH?"
    back: "Absolute indications: failed medical therapy, intractable urinary retention, benign prostatic obstruction leading to renal insufficiency. Complications of TURP include: impotence, incontinence, ejaculatory difficulties (retrograde ejaculation), and decreased libido. TUIP is preferred for prostates <30 g.\n\nTURP (transurethral resection of prostate) is the gold-standard surgical treatment for moderate-to-severe BPH. Retrograde ejaculation (semen enters bladder instead of being expelled anteriorly) occurs in up to 90% of TURP patients and is the most common sexual side effect. It should be discussed pre-operatively."
    difficulty: medium
    tags: [BPH, TURP, surgery, indications, urology, family medicine]
