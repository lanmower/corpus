  - front: "A patient with CHF and AFib is started on digoxin. Which electrolyte abnormality significantly increases the risk of digoxin toxicity?"
    back: "Hypokalemia\n\nDigoxin inhibits Na+/K+-ATPase; hypokalemia potentiates this effect, increasing risk of digoxin toxicity including bradyarrhythmias and bidirectional VT. Canadian guidelines recommend monitoring and correcting electrolytes in all patients on digoxin."
    difficulty: easy
    tags: [digoxin, toxicity, hypokalemia, CHF, AFib]
  - front: "A patient on digoxin reports blurred vision with a yellow tint ('van Gogh syndrome') and nausea. What is the most likely diagnosis and what should be checked immediately?"
    back: "Digoxin toxicity; check serum digoxin level, potassium, ECG for arrhythmias\n\nVisual disturbances (yellow-green halos), GI symptoms (anorexia, nausea/vomiting), and arrhythmias are hallmarks of digoxin toxicity. Hypokalemia and renal impairment are precipitating factors; digoxin-specific antibody fragments (Digibind) are used for severe toxicity."
    difficulty: easy
    tags: [digoxin, toxicity, visual disturbance, van Gogh]
  - front: "The RALES trial showed spironolactone reduces mortality in severe HF. What were the patient criteria and primary outcome?"
    back: "Severe HF (Class III/IV) with LVEF <35% on ACEi + loop diuretic + digoxin; spironolactone reduced all-cause mortality (35% vs. 46%) and HF hospitalizations\n\nRALES (NEJM 1999) demonstrated that aldosterone antagonism with spironolactone 25 mg daily in severe HF (LVEF ≤35%) significantly reduced all-cause mortality (RR 0.70) and HF hospitalizations (RR 0.65). Risk of hyperkalemia requires monitoring."
    difficulty: medium
    tags: [RALES, spironolactone, HFrEF, aldosterone antagonist, mortality]
  - front: "What did the PARADIGM-HF trial establish about sacubitril/valsartan (LCZ696) in HFrEF?"
    back: "Sacubitril/valsartan (ARNI) was superior to enalapril in reducing CV death and HF hospitalization in HFrEF (LVEF <40%)\n\nPARADIGM-HF (NEJM 2014) showed LCZ696 (valsartan + neprilysin inhibitor) reduced the primary composite of CV death or HF hospitalization from 26.5% to 21.8% (HR 0.80) versus enalapril. Canadian HF guidelines recommend ARNI as a first-line agent replacing ACEi in HFrEF."
    difficulty: medium
    tags: [PARADIGM-HF, sacubitril/valsartan, ARNI, HFrEF, neprilysin]
  - front: "DAPA-HF and EMPEROR-Reduced trials both studied SGLT2 inhibitors in HFrEF. What was the common conclusion?"
    back: "SGLT2 inhibitors (dapagliflozin and empagliflozin) significantly reduced worsening HF events and CV death in HFrEF, regardless of diabetes status\n\nBoth trials demonstrated ~25-26% relative risk reduction in the composite of worsening HF or CV death with SGLT2 inhibitors in HFrEF. Benefits were independent of T2DM status, establishing SGLT2 inhibitors as a pillar of HFrEF therapy alongside ACEi/ARNI, beta-blockers, and MRAs."
    difficulty: medium
    tags: [DAPA-HF, EMPEROR-Reduced, SGLT2 inhibitor, dapagliflozin, empagliflozin, HFrEF]
  - front: "DELIVER and EMPEROR-Preserved trials studied SGLT2 inhibitors in HFpEF (EF >40%). What was demonstrated?"
    back: "SGLT2 inhibitors (dapagliflozin and empagliflozin) reduced worsening HF events and CV death in HFpEF/HFmrEF, regardless of diabetes status\n\nBoth DELIVER (NEJM 2022) and EMPEROR-Preserved (NEJM 2021) demonstrated significant reductions in the primary composite of CV mortality or HF hospitalization with SGLT2 inhibitors in HF with preserved EF. SGLT2 inhibitors are now recommended in HFpEF, where few therapies had previously shown benefit."
    difficulty: hard
    tags: [DELIVER, EMPEROR-Preserved, SGLT2 inhibitor, HFpEF, dapagliflozin, empagliflozin]
  - front: "The SCD-HeFT trial compared amiodarone vs. ICD vs. placebo in mild-to-moderate HF (LVEF <35%). What was the conclusion about amiodarone?"
    back: "Amiodarone had no mortality benefit compared to placebo; ICD reduced mortality by 23%\n\nSCD-HeFT (NEJM 2005) demonstrated that in mild-to-moderate CHF with LVEF ≤35%, ICD (shock-only) significantly reduced all-cause mortality (HR 0.77) while amiodarone did not differ from placebo (HR 1.06). This supported primary prevention ICD implantation in HFrEF."
    difficulty: medium
    tags: [SCD-HeFT, ICD, amiodarone, HF, sudden cardiac death, primary prevention]
  - front: "CIBIS-II showed which beta-blocker significantly reduced all-cause mortality in HFrEF patients with LVEF <35%?"
    back: "Bisoprolol (cardioselective B1 blocker) significantly reduced all-cause mortality from 17.3% to 11.8% (HR 0.66)\n\nCIBIS-II (Lancet 1999) was stopped early due to bisoprolol's significant mortality benefit in CHF patients with LVEF <35%. COPERNICUS similarly showed carvedilol's benefit in severe HF (EF <25%). Both support beta-blocker use as core HFrEF therapy."
    difficulty: medium
    tags: [CIBIS-II, bisoprolol, beta-blocker, HFrEF, mortality]
  - front: "COMET compared carvedilol vs. metoprolol in chronic HFrEF. Which agent showed lower all-cause mortality?"
    back: "Carvedilol (non-selective beta-blocker with alpha-1 blockade) had lower all-cause mortality than metoprolol (34% vs. 40%, HR 0.83)\n\nCOMET (Lancet 2003) demonstrated carvedilol's superiority over short-acting metoprolol in CHF, likely due to its additional alpha-1 blocking properties and non-selective B1/B2 blockade. Note the comparator was metoprolol tartrate (not succinate), limiting direct comparisons."
    difficulty: medium
    tags: [COMET, carvedilol, metoprolol, HFrEF, mortality]
  - front: "A patient with HFpEF (LVEF >45%) is started on irbesartan (ARB) for symptom management based on the I-PRESERVE trial. What did this trial conclude?"
    back: "Irbesartan did NOT improve mortality or CV morbidity in HFpEF compared to placebo — ARBs have no proven mortality benefit in HFpEF\n\nI-PRESERVE (NEJM 2008) showed irbesartan 300 mg daily vs. placebo resulted in similar primary outcomes (all-cause mortality or CV hospitalization) in HFpEF patients. Unlike HFrEF, few pharmacological therapies had established mortality benefit in HFpEF until SGLT2 inhibitors."
    difficulty: medium
    tags: [I-PRESERVE, irbesartan, ARB, HFpEF, no benefit]
  - front: "What are the precipitants of acute decompensated heart failure (ADHF)? Use the FAILURE mnemonic."
    back: "F — Forgot medication; A — Arrhythmia/Anemia; I — Ischaemia/Infarction/Infection; L — Lifestyle (high salt); U — Upregulation of cardiac output (pregnancy, hyperthyroidism); R — Renal failure; E — Embolism (pulmonary).\n\nIdentifying and treating the precipitant is essential to managing ADHF. AFib is a common precipitant — rate or rhythm control is key. Infections increase metabolic demand. Medication non-compliance is the most common precipitant in outpatients. Each precipitant requires specific management in addition to diuretics and vasodilators."
    difficulty: medium
    tags: [heart failure, ADHF, precipitants, FAILURE mnemonic]
  - front: "What are the CXR findings in congestive heart failure?"
    back: "Pulmonary vascular redistribution (upper lobe vessels prominent), perihilar infiltrates, interstitial edema with Kerley B lines, alveolar edema with bilateral infiltrates ('bat wings'), cardiomegaly, pleural effusion (usually right-sided), peribronchial cuffing.\n\nCXR is the most useful initial test for CHF. Findings progress with severity: first vascular redistribution, then interstitial edema (Kerley B lines at costophrenic angles), then alveolar edema. Note that CXR can lag behind clinical improvement or deterioration. Lung ultrasound (B-lines) may have higher sensitivity than CXR for acute pulmonary edema."
    difficulty: medium
    tags: [heart failure, CXR, Kerley B lines, pulmonary edema]
  - front: "What is the acute treatment mnemonic for CHF, and what are the management steps?"
    back: "LMNOP: Lasix (furosemide 0.5–1 mg/kg IV), Morphine (reduces preload and anxiety), Nitroglycerin (0.4 mg SL q5 min if sBP >100 mmHg, or IV nitroglycerin), Oxygen (100% by mask), Position (sit upright) + Pressure (BiPAP). If sBP <90 mmHg: norepinephrine first-line; add dobutamine or epinephrine; milrinone for refractory cases.\n\nFurosemide provides rapid venodilation (within minutes) before diuresis begins. Nitroglycerin reduces preload and afterload. BiPAP reduces respiratory work and preload. Inotropes/vasopressors are reserved for cardiogenic shock (sBP <90 mmHg). Treat precipitating factors simultaneously."
    difficulty: medium
    tags: [heart failure, CHF, LMNOP, furosemide, nitroglycerin, BiPAP]
  - front: "What are the indications for hospital admission in heart failure?"
    back: "Acute MI, pulmonary edema or severe respiratory distress, severe complicating medical illness (e.g. pneumonia), anasarca, symptomatic hypotension or syncope, refractory to outpatient therapy, thromboembolic complications requiring intervention, clinically significant dysrhythmias.\n\nPatients with mild-moderate CHF exacerbation may be managed in the ED observation unit or rapid access clinic. A walk test with SpO2 monitoring can identify patients with occult hypoxia. BNP/NT-proBNP levels guide diagnosis and risk stratification. Cardiology or medicine consult is appropriate for most admitted patients."
    difficulty: medium
    tags: [heart failure, admission criteria, CHF]
  - front: "What are the indications and key cautions for furosemide (Lasix) in the ED?"
    back: "Indications: CHF (40–80 mg IV), hypertension (10–40 mg PO BID). Key cautions: monitor for electrolyte imbalances (hypokalemia, hyponatremia, hypomagnesemia); risk of ototoxicity with high doses.\n\nFurosemide is a loop diuretic that blocks the Na-K-2Cl cotransporter in the thick ascending limb. In acute decompensated heart failure, IV furosemide provides rapid preload reduction. High-dose furosemide can cause permanent hearing loss, particularly in patients also receiving aminoglycosides."
    difficulty: easy
    tags: [furosemide, Lasix, CHF, diuretic, ototoxicity, emergency medicine]
  - front: "What did the SGLT2 inhibitor DAPA-HF and DELIVER trials demonstrate about dapagliflozin in heart failure?"
    back: "DAPA-HF demonstrated dapagliflozin benefit in HFrEF (reduced ejection fraction). DELIVER demonstrated benefit in HFmrEF/HFpEF (mildly reduced or preserved ejection fraction). Together, these trials established SGLT2 inhibitors as effective across the spectrum of heart failure ejection fractions.\n\nSGLT2 inhibitors (dapagliflozin, empagliflozin) are now guideline-recommended for heart failure across all ejection fraction categories. The mechanism of benefit in heart failure extends beyond glucose lowering and likely includes volume regulation, cardiac energy metabolism, and anti-inflammatory effects."
    difficulty: hard
    tags: [SGLT2 inhibitor, dapagliflozin, heart failure, HFrEF, HFpEF, DAPA-HF, DELIVER]
