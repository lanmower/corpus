name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build data shards (every registered syllabus -> site/data/<id>/)
        run: node scripts/build_data.js
      - name: Run integration test suite
        run: node test.js
