# Ob Labour Complications (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What is dystocia and what are the 5 Ps of its etiology?"
    back: "**Dystocia:** Failure of expected patterns of descent of the presenting part and cervical dilatation to occur in the appropriate time frame.\n\n**Definition by stage:**\n- Active phase: >2h of <1 cm/h dilatation\n- 2nd stage: >1h with no descent during active pushing\n\n**5 Ps:**\n1. **Power** (leading cause): hypotonic or uncoordinated contractions, inadequate maternal expulsive efforts\n2. **Passenger:** fetal position, attitude, size, anomalies (e.g., hydrocephalus)\n3. **Passage:** pelvic structure (CPD), soft tissue factors (tumours, full bladder/rectum, vaginal septum)\n4. **Psyche:** hormonal response to stress contributing to dystocia\n5. **Practitioner:** understanding and expectations of normal labour progress\n\nDystocia is the most common indication for primary CD. Management involves ruling out CPD, then augmenting with IV oxytocin + amniotomy, optimizing fetal position, and optimizing pain control. An intrauterine pressure catheter measuring contraction adequacy (Montevideo units >200) can confirm adequate power before diagnosing arrest."
    difficulty: easy
    tags: [obstetrics, dystocia, abnormal labour, 5 Ps, labour arrest]
  - front: "What are the risks of dystocia?"
    back: "- Maternal stress\n- Maternal infection\n- PPH\n- Need for neonatal resuscitation\n- Fetal compromise (from tachysystole)\n- Uterine rupture\n- Hypotension\n\nDystocia-associated complications arise from the prolonged labour itself and from the interventions used. Prolonged labour increases infection risk (chorioamnionitis). Tachysystole from oxytocin augmentation can cause fetal distress. Uterine atony after prolonged labour leads to PPH. These risks must be weighed against the risks of operative delivery."
    difficulty: easy
    tags: [obstetrics, dystocia, complications, labour complications]
  - front: "Define shoulder dystocia, its incidence, and risk factors."
    back: "**Definition:** Fetal anterior shoulder impacted above the pubic symphysis after fetal head has been delivered. Life-threatening emergency.\n\n**Incidence:** 0.2-3% of deliveries\n\n**Mechanism:** Breadth of shoulders greater than biparietal diameter of head\n\n**Risk factors:**\n- Maternal: obesity, DM, multiparity, previous shoulder dystocia\n- Fetal: prolonged gestation, macrosomia (especially with GDM)\n- Labour: prolonged 2nd stage, instrumental delivery\n\nShoulder dystocia is largely unpredictable; most cases occur in women without identified risk factors. Macrosomia (especially associated with GDM) is the strongest risk factor. The 'turtle sign' (head delivered then retracts against perineum) is the classic presentation. Ultrasound is unreliable for predicting macrosomia (±20% error)."
    difficulty: easy
    tags: [obstetrics, shoulder dystocia, risk factors, obstetric emergency]
  - front: "What are the maneuvers for managing shoulder dystocia (ALARMER mnemonic)?"
    back: "Stepwise approach:\n1. **Ask for help** (call team)\n2. **Legs in full flexion** (McRoberts maneuver) — hyperflexion of maternal thighs on abdomen\n3. **Anterior shoulder disimpaction** (suprapubic pressure)\n4. **Rotate posterior shoulder anteriorly** — hand in vagina under adequate anesthesia\n5. **Manual corkscrew** — rotate fetus by posterior shoulder until anterior shoulder emerges from behind symphysis\n6. **Episiotomy** — provides space for internal maneuvers (does NOT relieve bony dystocia)\n7. **Rollover** — on hands and knees position\n\n**McRoberts + suprapubic pressure resolves ~90% of cases**\n\n**Last resort options:**\n- Cleidotomy (deliberate fracture of neonatal clavicle)\n- Zavanelli maneuver (replacement of fetus + emergent CD)\n- Symphysiotomy\n\nMcRoberts maneuver (maternal thigh hyperflexion) flattens the lumbar lordosis, rotates the pubic symphysis superiorly, and increases the relative AP diameter of the pelvis. Combined with downward suprapubic pressure, it resolves the majority of shoulder dystocia cases. Time is critical as cord compression can cause HIE within minutes."
    difficulty: medium
    tags: [obstetrics, shoulder dystocia, management, McRoberts, ALARMER, obstetric emergency]
  - front: "What are the fetal and maternal complications of shoulder dystocia?"
    back: "**Fetal:**\n- Hypoxic ischemic encephalopathy (HIE) from chest/cord compression\n- Brachial plexus injury: Erb's palsy (C5-C7), Klumpke's palsy (C8-T1) — 90% partially resolve within 6 months\n- Fractures: clavicle, humerus, cervical spine\n- Death\n\n**Maternal:**\n- Perineal injury\n- PPH (uterine atony or lacerations)\n- Uterine rupture\n\n**Prognosis:** 1% risk of long-term disability for infant\n\nErb's palsy (upper brachial plexus, C5-C7) is the most common brachial plexus injury, presenting with the 'waiter's tip' posture (arm adducted and internally rotated, forearm pronated). Klumpke's palsy (lower plexus, C8-T1) is rarer and affects hand intrinsics. Most brachial plexus injuries from shoulder dystocia resolve spontaneously within months."
    difficulty: medium
    tags: [obstetrics, shoulder dystocia, complications, Erbs palsy, brachial plexus injury]
  - front: "Define umbilical cord prolapse and outline its management."
    back: "**Definition:** Descent of the cord to a level adjacent to or below the presenting part, causing cord compression between presenting part and pelvis.\n\n**Incidence:** 0.16-0.18% of deliveries\n\n**Risk factors:** Prematurity/PROM, fetal malpresentation (~50%), low-lying placenta, polyhydramnios, multiple gestation, CPD\n\n**Presentation:** Visible/palpable cord; FHR changes (variable decelerations, bradycardia)\n\n**Management:**\n1. Emergency CD if not fully dilated and delivery not imminent\n2. O₂ to mother, monitor FHR\n3. Keep cord warm and moist (replace into vagina + warm saline soaks)\n4. Relieve cord compression:\n   - Manually elevate fetal head (pelvic exam)\n   - Steep Trendelenburg or knee-to-chest position\n   - Retrofill bladder with 500-700 mL normal saline\n5. If fetal demise or <22 wk GA: allow labour and delivery\n\nCord prolapse is an obstetric emergency with high perinatal mortality if not promptly managed. The bladder retrofilling technique (500-700 mL NS) pushes the presenting part upward, relieving cord compression while preparing for CD. The Trendelenburg/knee-chest position uses gravity to reduce pressure on the cord. Time to delivery is critical."
    difficulty: medium
    tags: [obstetrics, cord prolapse, obstetric emergency, management, fetal distress]
  - front: "What is uterine rupture: definition, etiology, risk factors, and presentation?"
    back: "**Definition:** Complete separation of all layers of the uterine wall\n\n**Incidence:** 0.5-0.8% overall; up to 12% with classical incision\n\n**Etiology:**\n- Previous uterine scar (40% of cases)\n- Tachysystole with oxytocin\n- Grand multiparity\n- Previous intrauterine manipulation\n\n**Risk factors:** Uterine scarring (prior CD especially classical incision, D&C perforation, myomectomy), excessive stimulation (oxytocin, prostaglandins), trauma (ECV), multiparity, uterine abnormalities, malpresentation, placenta accreta\n\n**Presentation:**\n- Prolonged fetal bradycardia (most common)\n- Acute constant lower abdominal pain (may be absent with epidural)\n- Hyper/hypotonic contractions\n- Vaginal bleeding\n- Intra-abdominal hemorrhage\n- Loss of station of presenting part\n- Maternal tachycardia, hypotension, shock\n\nUterine rupture is a catastrophic obstetric emergency. The classical CD scar has a 4-9% rupture risk (typically before labour or early in labour), while low transverse scar has 0.5-0.8% risk. Loss of fetal station and sudden cessation of contractions with fetal bradycardia should raise immediate suspicion. Treatment requires immediate delivery and maternal stabilization, potentially including hysterectomy."
    difficulty: medium
    tags: [obstetrics, uterine rupture, obstetric emergency, VBAC, complications]
  - front: "What are the treatment and complications of uterine rupture?"
    back: "**Treatment:**\n- Rule out other causes (e.g., placental abruption)\n- Maternal stabilization (may require hysterectomy)\n- Treat hypovolemia\n- Immediate delivery for fetal survival\n\n**Complications:**\n- Maternal mortality: 1-10%\n- Maternal: hemorrhage, shock, DIC, amniotic fluid embolus, hysterectomy\n- Fetal: distress, infant mortality up to 15%\n\nUterine rupture is among the most dangerous obstetric emergencies. Maternal mortality 1-10% reflects the severity of hemorrhagic shock and coagulopathy. Hysterectomy may be necessary for hemorrhage control. Neonatal outcome depends heavily on time to delivery — immediate cesarean delivery after recognition is critical for fetal survival."
    difficulty: medium
    tags: [obstetrics, uterine rupture, treatment, complications, maternal mortality]
  - front: "What is amniotic fluid embolism (AFE): definition, epidemiology, presentation, and management?"
    back: "**Definition:** Amniotic fluid debris in maternal circulation triggering an anaphylactoid immunologic response\n\n**Epidemiology:**\n- Rare: 1 in 8,000-80,000 births\n- 13-30% maternal mortality rate\n- Leading cause of maternal death in induced abortions and miscarriages\n\n**Risk factors:** Placental abruption, rapid labour, multiparity, uterine rupture, uterine manipulation, induction medications/procedures\n\n**Presentation:**\n- Sudden onset: respiratory distress + cardiovascular collapse (hypotension, hypoxia) + coagulopathy\n- Seizure in 10%\n- Survivors: ARDS and left ventricular dysfunction\n- Aura in up to 1/3 of patients\n\n**Management:**\n- ICU with multidisciplinary team\n- Supportive: high-flow O₂, ventilation support, fluid resuscitation, inotropic support ± intubation\n- Correct coagulopathy\n\nAFE is an unpredictable catastrophic event. The classic triad of sudden hypoxia, hypotension, and coagulopathy in a peripartum patient should immediately raise suspicion. DIC is a major component, requiring aggressive replacement of clotting factors. The DDx includes pulmonary embolus, anaphylaxis, septic shock, eclampsia, and HELLP syndrome. AFE is a clinical diagnosis of exclusion."
    difficulty: medium
    tags: [obstetrics, amniotic fluid embolism, AFE, obstetric emergency, maternal mortality]
  - front: "Define chorioamnionitis, its etiology, and clinical features."
    back: "**Definition:** Infection of the chorion, amnion, and amniotic fluid\n\n**Incidence:** 1-5% of term pregnancies; up to 25% in preterm deliveries\n\n**Mechanism:** Ascending infection from vagina\n\n**Organisms:** GBS, Bacteroides and Prevotella species, E. coli, anaerobic Streptococcus\n\n**Risk factors:** Low parity, prolonged ROM, long labour, multiple vaginal exams, internal monitoring, bacterial vaginosis\n\n**Clinical features:**\n- Diagnostic: maternal fever (single ≥39°C OR persistent ≥38°C for >30 min) + fetal tachycardia + foul/purulent cervical discharge\n- Non-specific: maternal tachycardia, uterine tenderness\n\n**Investigations:** CBC (leukocytosis, elevated lactate); amniotic fluid (Gram stain, glucose, culture)\n\nChorioamnionitis is a clinical diagnosis based on maternal fever plus at least one other sign. It is the most common serious complication of PROM. GBS is particularly important as it causes neonatal sepsis and meningitis. The diagnosis should prompt antibiotic treatment and appropriate labour management (not necessarily immediate CD)."
    difficulty: medium
    tags: [obstetrics, chorioamnionitis, intrauterine infection, risk factors, diagnosis]
  - front: "What is the treatment of chorioamnionitis and what complications can occur?"
    back: "**Treatment:**\n- IV antibiotics:\n  - Ampicillin 2 g IV q6h + gentamicin 2 mg/kg load, then 1.5 mg/kg IV q8h\n  - Add anaerobic coverage: clindamycin 900 mg IV q8h\n  - Continue postpartum (especially if CD) to reduce endometritis risk\n- Antipyretics\n- Allow appropriate labour progression (NOT an indication for immediate CD)\n\n**Complications:**\n- Bacteremia (mother or fetus)\n- Wound infection (if CD)\n- Pelvic abscess\n- Neonatal meningitis\n- Maternal or neonatal sepsis\n- Neonatal death\n- **Long-term infant:** cerebral palsy, bronchopulmonary dysplasia\n\nChorioamnionitis requires prompt IV antibiotics but does not mandate immediate operative delivery unless obstetric indications exist. Antibiotics reduce maternal and neonatal morbidity. The ampicillin + gentamicin combination provides broad coverage; clindamycin adds anaerobic coverage especially important for CD. Neonatal risks include early-onset sepsis, pneumonia, and long-term neurodevelopmental sequelae."
    difficulty: medium
    tags: [obstetrics, chorioamnionitis, treatment, antibiotics, complications, neonatal sepsis]
  - front: "What is meconium in the context of labour and what does it signify?"
    back: "**Definition:** Substance forming the first feces of the developing fetus\n\n**Epidemiology:** Present in ~10% early in labour; up to 25% of all labours; more common in postterm pregnancies\n\n**Clinical significance:**\n- Usually NOT associated with poor outcome\n- **Particulate (thickened) meconium:** associated with lower APGARs, meconium aspiration syndrome, neonatal respiratory distress, perinatal death; darker green or black colour\n- **Thin meconium:** yellow to light green; less concerning\n- **Always abnormal** if seen in preterm fetus\n- May indicate: cord compression, uterine hypertonia, or undiagnosed breech\n- Increasing meconium during labour may indicate fetal distress\n\n**Management:** Call respiratory therapy/neonatology/pediatrics to delivery room; closely monitor FHR\n\nMeconium passage results from increased vagal tone causing intestinal peristalsis. Particulate (thick) meconium is more concerning than thin meconium because it is more likely to cause meconium aspiration syndrome (MAS). The presence of meconium is an indication for continuous electronic FHR monitoring. Meconium in a preterm fetus is always pathological as the preterm fetal gut normally does not pass meconium."
    difficulty: easy
    tags: [obstetrics, meconium, fetal distress, meconium aspiration, intrapartum]
  - front: "What are the immediate management steps when a 'turtle sign' is observed during delivery?"
    back: "The 'turtle sign' (head delivers then retracts against perineum) indicates shoulder dystocia. Immediately:\n\n1. **Call for help** (additional obstetric, anesthetic, neonatal team)\n2. **McRoberts maneuver** — hyperflexion of maternal thighs onto abdomen\n3. **Suprapubic pressure** — downward pressure on anterior shoulder (NOT fundal pressure)\n4. If not resolved: **episiotomy** + internal maneuvers (rotation of posterior shoulder anteriorly, manual corkscrew)\n5. **Rollover** (hands and knees position)\n6. **Last resort:** cleidotomy, Zavanelli maneuver + emergency CD, symphysiotomy\n\n**McRoberts + suprapubic pressure resolves ~90% of cases**\n\nDocument: time of head delivery, maneuvers used, duration, neonatal outcomes\n\nShoulder dystocia is a time-critical emergency — progressive hypoxia from cord compression develops rapidly. Fundal pressure is CONTRAINDICATED as it worsens impaction of the anterior shoulder. The systematic ALARMER approach ensures no step is missed. After delivery, careful neonatal assessment for brachial plexus injury and fractures is mandatory, and thorough documentation is essential."
    difficulty: hard
    tags: [obstetrics, shoulder dystocia, turtle sign, emergency management, McRoberts, obstetric emergency]
