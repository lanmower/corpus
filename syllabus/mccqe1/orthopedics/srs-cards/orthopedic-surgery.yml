# Orthopedic Surgery (Orthopedics) - generated from srs-mccqe1
cards:
  - front: "What is the most common direction of shoulder dislocation and what is the recurrence rate for patients under 20 years old?"
    back: "Anterior dislocation accounts for >90% of shoulder dislocations. Recurrence rate for patients <20 years old is 65-95%.\n\nAnterior dislocations are far more common than posterior (5%). Young patients have the highest recurrence rate because of increased activity levels and possible structural predisposition. Recurrence rate decreases with age: 60-70% for 20-40 yr, 2-4% for >40 yr."
    difficulty: easy
    tags: [orthopedic-surgery, shoulder-dislocation]
  - front: "Name the four rotator cuff muscles (SITS) and their primary actions."
    back: "Supraspinatus (abduction), Infraspinatus (external rotation), Teres Minor (external rotation), Subscapularis (internal rotation and adduction).\n\nThe SITS muscles stabilize the humeral head in the glenoid fossa. Supraspinatus is most commonly injured due to impingement under the acromion. All attach to the greater tuberosity except subscapularis, which attaches to the lesser tuberosity."
    difficulty: easy
    tags: [orthopedic-surgery, rotator-cuff]
  - front: "What does a positive Jobe's (Empty Can) test indicate, and how is it performed?"
    back: "It suggests a supraspinatus tear. The shoulder is placed in 90° abduction, 30° horizontal flexion with internal rotation (thumb pointing down), and the patient resists downward pressure.\n\nThis test isolates the supraspinatus by placing it in a mechanically disadvantaged position. Weakness with active resistance suggests a supraspinatus tear. Impingement tests (Neer's, Hawkins-Kennedy) assess for impingement syndrome rather than a specific tear."
    difficulty: easy
    tags: [orthopedic-surgery, rotator-cuff, physical-examination]
  - front: "What is the Rockwood classification for AC joint separation, and which grades typically require surgery?"
    back: "Grades I-III are typically managed non-operatively (with III being operative if labourer/high-level athlete). Grades IV-VI require operative management. Classification is based on AC and CC ligament integrity.\n\nGrade I = AC sprain, Grade II = AC torn/CC sprained, Grade III = both torn but reducible, Grades IV-VI = both torn and irreducible with varying directions of clavicle displacement. The piano key sign is a palpable step deformity seen with dislocation."
    difficulty: medium
    tags: [orthopedic-surgery, AC-joint-separation]
  - front: "What is the most common site of clavicle fracture and its most common mechanism of injury?"
    back: "Middle third (80%) is the most common site. Fall on shoulder (87%) is the most common mechanism.\n\nThe middle third is the thinnest portion and most vulnerable to fracture. Clavicle fractures are common in children and unite rapidly. The most common complication is a cosmetic bump. ORIF is considered when fracture is shortened >2 cm or when distal third fracture is displaced."
    difficulty: easy
    tags: [orthopedic-surgery, clavicle-fracture]
  - front: "What are the three stages of adhesive capsulitis (frozen shoulder) and their durations?"
    back: "1. Freezing phase (gradual onset of diffuse pain): 6-9 months. 2. Frozen phase (decreased ROM impacts function): 4-9 months. 3. Thawing phase (gradual improvement in ROM): 4-12 months.\n\nAdhesive capsulitis usually resolves spontaneously within 18 months. Key features include restricted active AND passive ROM, night pain, and association with diabetes (5%), prolonged immobilization, and female gender. Treatment includes physiotherapy, NSAIDs, steroid injections, and manipulation under anesthesia if refractory."
    difficulty: easy
    tags: [orthopedic-surgery, frozen-shoulder]
  - front: "How are proximal humeral fractures classified using the Neer system, and how are the majority treated?"
    back: "Neer classification uses 4 fracture parts (anatomic neck, surgical neck, greater tuberosity, lesser tuberosity). A part is displaced if angulation >45° or displacement >1 cm. 85% of proximal humeral fractures are non-displaced/minimally displaced and treated non-operatively with sling and early ROM within 14 days.\n\nThe Neer system counts displaced fracture parts, not fracture lines. Complications include AVN (especially with anatomic neck fractures), axillary nerve palsy (45%), and frozen shoulder. Hemiarthroplasty or reverse total shoulder arthroplasty may be needed in elderly patients with 4-part fractures."
    difficulty: medium
    tags: [orthopedic-surgery, proximal-humeral-fracture]
  - front: "What nerve is most commonly injured with humeral shaft fractures, and at what location?"
    back: "The radial nerve, particularly with Holstein-Lewis distal 1/3 humeral shaft fractures. Most cases recover spontaneously in 3-4 months.\n\nThe radial nerve courses in the spiral groove of the humerus. Injury manifests as wrist drop and sensory loss over the dorsal hand. Radial nerve function must be tested before and after treatment. EMG is performed if no recovery by 3-4 months."
    difficulty: easy
    tags: [orthopedic-surgery, humeral-shaft-fracture, radial-nerve]
  - front: "What is a Monteggia fracture and how does it differ from a Galeazzi fracture?"
    back: "Monteggia: fracture of proximal ulna with radial head dislocation. Galeazzi: fracture of distal radial shaft with DRUJ disruption. Mnemonic: Monteggia = Ulnar fracture, Galeazzi = Radial fracture.\n\nFor Monteggia fractures, always assess proximal radius in all isolated ulna fractures. The most common nerve injury is PIN. Galeazzi is called the 'fracture of necessity' because all cases require operative management (ORIF of radius)."
    difficulty: medium
    tags: [orthopedic-surgery, forearm-fractures]
  - front: "Describe the Colles' fracture and its classic deformity."
    back: "Extra-articular transverse distal radius fracture (~2 cm proximal to radiocarpal joint) with dorsal displacement + ulnar styloid fracture. Classic 'dinner fork' deformity.\n\nColles' fracture is the most common fracture in those >40 yr, caused by FOOSH. Treatment goals: restore radial height (13 mm), radial inclination (23°), and volar tilt (11°). Smith's fracture is the reverse (volar displacement, 'garden spade' deformity) caused by fall on flexed hand."
    difficulty: easy
    tags: [orthopedic-surgery, distal-radius-fracture]
  - front: "Why is a scaphoid fracture particularly at risk for AVN, and how should a suspected scaphoid fracture with negative initial x-ray be managed?"
    back: "The proximal pole receives up to 100% of its arterial blood supply from the radial artery entering at the distal pole. A proximal fracture disrupts this retrograde blood supply. If x-ray is negative but clinical suspicion is high (snuff box tenderness), treat as positive with thumb spica cast and repeat x-ray in 2 weeks; if still negative, order CT or MRI.\n\nProximal pole fractures have the highest AVN rate (up to 100% for proximal fifth). Waist fractures heal 80-90% of the time. Non-union is the most common complication. SNAC (scaphoid nonunion advanced collapse) can cause chronic wrist arthritis."
    difficulty: medium
    tags: [orthopedic-surgery, scaphoid-fracture]
  - front: "What are the cervical nerve root levels for key motor functions: deltoid, biceps, triceps, and interossei?"
    back: "C5: deltoid and biceps. C6: biceps and brachioradialis. C7: triceps, wrist flexion, finger extension. C8: interossei, digital flexors.\n\nKey reflexes mirror these: C5/6 = biceps, C6 = brachioradialis, C7 = triceps, C8 = finger jerk. Radiculopathy involves impingement of a nerve root, while myelopathy involves impingement of the spinal cord. In the cervical spine, nerve roots exit above the corresponding vertebra."
    difficulty: easy
    tags: [orthopedic-surgery, cervical-spine]
  - front: "How do you differentiate neurogenic claudication from vascular claudication?"
    back: "Neurogenic: aggravated by standing/walking with variable walking distance, relieved by change in position (usually flexion), relief in ~10 min. Vascular: aggravated by walking/exercise with reproducible distance, relieved by stopping activity, relief in ~2 min.\n\nNeurogenic claudication is position-dependent (spinal stenosis), while vascular claudication is exercise-dependent (peripheral arterial disease). Neurogenic claudication is bilateral and associated with spinal stenosis, treated with flexion exercises and decompressive surgery if refractory."
    difficulty: medium
    tags: [orthopedic-surgery, spinal-stenosis, claudication]
  - front: "What are the red flags for back pain that warrant urgent investigation?"
    back: "Bowel or bladder dysfunction, constitutional symptoms/malignancy, chronic disease, age >50 yr, IV drug use, neuromotor deficits.\n\nCauda equina syndrome (bowel/bladder dysfunction, saddle anesthesia) is a surgical emergency. Ruptured aortic aneurysm is another cause of low back pain considered a surgical emergency. Imaging is indicated if symptoms persist >6 weeks or red flags are present."
    difficulty: easy
    tags: [orthopedic-surgery, back-pain]
  - front: "What is the most common level for lumbar disc herniation and what nerve root is affected by an L4-5 disc herniation?"
    back: "Most common level: L5-S1 > L4-5 > L3-4. An L4-5 disc herniation typically compresses the L5 nerve root (posterolateral herniation compresses the traversing root).\n\nL5 radiculopathy presents with weakness of extensor hallucis longus, sensory loss in the 1st dorsal webspace, and is screened by heel walking. 90% of patients improve in 3 months with non-operative treatment. Surgical discectomy is indicated for progressive neurological deficit or cauda equina syndrome."
    difficulty: medium
    tags: [orthopedic-surgery, lumbar-disc-herniation]
  - front: "What is the most life-threatening complication of pelvic fractures and what is the initial emergency management?"
    back: "Hemorrhage is the most life-threatening complication. Initial management includes IV fluids/blood, pelvic binder/sheet, and consideration of external fixation vs. emergent angiography/embolization.\n\nPelvic fractures are classified by the Tile system into stable (A), rotationally unstable (B), and rotationally + vertically unstable (C). Always assess for genitourinary injury. Open pelvic fractures include those with involvement of rectum or urogenital structures. FAST/DPL may indicate need for laparotomy."
    difficulty: medium
    tags: [orthopedic-surgery, pelvic-fracture]
  - front: "How does the clinical presentation differ between anterior and posterior hip dislocations?"
    back: "Anterior: shortened, abducted, externally rotated limb. Posterior: shortened, adducted, internally rotated limb. Posterior is most common (90%).\n\nPosterior dislocations typically result from a dashboard injury (axial load to knee with hip flexed and adducted). On x-ray, the affected femoral head appears smaller. Hip dislocations must be reduced within 6 hours to decrease risk of AVN. Sciatic nerve palsy occurs in 25% of posterior dislocations."
    difficulty: easy
    tags: [orthopedic-surgery, hip-dislocation]
  - front: "What is the Garden classification of femoral neck fractures and how does it guide treatment?"
    back: "Types I-II (non-displaced): internal fixation to prevent displacement. Types III-IV (displaced): young patients get ORIF; elderly patients get hemi- or total hip arthroplasty.\n\nGarden classification: I = incomplete/valgus impacted, II = complete/non-displaced, III = partially displaced/varus, IV = completely displaced. The femoral head blood supply (medial and lateral femoral circumflex arteries) is at risk of disruption with displaced fractures, leading to AVN."
    difficulty: medium
    tags: [orthopedic-surgery, femoral-neck-fracture]
  - front: "What are the x-ray findings of osteoarthritis (mnemonic LOSS)?"
    back: "L = Loss of joint space, O = Osteophytes, S = Subchondral sclerosis, S = Subchondral cysts.\n\nOA findings on x-ray contrast with inflammatory arthritis (RA), which shows periarticular osteopenia, periarticular erosions, and concentric joint space narrowing. Treatment of hip/knee OA progresses from exercise and acetaminophen to NSAIDs to intra-articular injections to arthroplasty."
    difficulty: easy
    tags: [orthopedic-surgery, osteoarthritis]
  - front: "What is the Lachman test and what does it assess?"
    back: "It assesses ACL integrity. With the knee in 20-30° flexion, stabilize the distal femur and attempt to sublux the tibia anteriorly. Positive test = increased anterior tibial translation. It has the highest diagnostic accuracy for ACL tears (positive LR 25.0, negative LR 0.1).\n\nThe Lachman test is more reliable than the anterior drawer test because less muscular stabilization occurs at 20-30° flexion. The pivot shift test also assesses ACL integrity. ACL tears commonly occur with non-contact deceleration injuries, present with an audible 'pop' and immediate swelling."
    difficulty: easy
    tags: [orthopedic-surgery, knee-examination, ACL]
  - front: "What is the O'Donoghue's 'unhappy triad' of the knee?"
    back: "ACL tear + MCL tear + meniscal damage (medial and/or lateral).\n\nThis triad typically occurs from a valgus force to the knee with external rotation. MCL tears present with tenderness above and below the medial joint line and laxity with valgus stress. A locked knee (inability to fully extend due to mechanical block) from a meniscal tear is a surgical emergency."
    difficulty: easy
    tags: [orthopedic-surgery, knee-injury]
  - front: "What is the Salter-Harris classification and which types are most likely to cause growth arrest?"
    back: "S = Straight through (Type I, through growth plate), A = Above (Type II, through metaphysis), L = beLow (Type III, through epiphysis), T = Through (Type IV, through both), R = Ram/crush (Type V). Types III-V are most likely to cause growth arrest.\n\nType II is the most common Salter-Harris fracture. Types I and II generally heal well with closed reduction. Types III-V require anatomic reduction (often ORIF) and carry higher risk of growth arrest and progressive deformity. In children, growth plate is weaker than ligaments."
    difficulty: easy
    tags: [orthopedic-surgery, pediatric-fractures, Salter-Harris]
  - front: "What is SCFE, who is most at risk, and what is the treatment?"
    back: "Slipped Capital Femoral Epiphysis: Type I Salter-Harris injury at the proximal hip with displacement of the metaphysis. Most common in obese adolescent males during pubertal growth spurt. Treatment: operative percutaneous in-situ fixation without reduction.\n\nSCFE presents with groin/thigh/knee pain, limp, restricted internal rotation, and obligatory external rotation with passive flexion (Drehmann sign). Klein's line on AP x-ray should cross femoral epiphysis. Stable SCFE has <10% risk of osteonecrosis; unstable has 24-47% risk. Bilateral involvement occurs in ~25%."
    difficulty: medium
    tags: [orthopedic-surgery, SCFE, pediatric]
  - front: "What are the clinical features of developmental dysplasia of the hip (DDH) and the key physical exam tests?"
    back: "Limited hip abduction (<60°), leg length discrepancy, asymmetric skin folds. Barlow's test: flex hips/knees, adduct and push posteriorly to dislocate (tests if hip is dislocatable). Ortolani's test: abduct hip with fingertips to reduce (positive = palpable clunk if hip is reducible).\n\nDDH is the most common orthopedic disorder in newborns. Risk factors: 5 Fs = Family history, Female, First-born, Foot-first (breech), Left hip. Screening U/S at 4-6 weeks if risk factors. Treatment: 0-6 mo Pavlik harness; 6-18 mo GA reduction + spica cast; >18 mo open reduction."
    difficulty: medium
    tags: [orthopedic-surgery, DDH, pediatric]
  - front: "What is Legg-Calvé-Perthes disease and what is its prognosis?"
    back: "Idiopathic AVN of the femoral head presenting at 4-8 years. M:F = 5:1. Child presents with limp, hip/groin/knee pain, decreased internal rotation and abduction. Prognosis is better in males, age <6, <50% femoral head involvement, and abduction >30°.\n\nGoal of treatment is to keep the femoral head contained in the acetabulum and maintain ROM. 60% of involved hips do not require operative intervention. Natural history is early onset OA and decreased ROM. X-ray shows eventual collapse of femoral head. MRI or bone scan needed if x-ray initially negative."
    difficulty: medium
    tags: [orthopedic-surgery, Legg-Calve-Perthes, pediatric]
  - front: "What is the Thompson test and what does it assess?"
    back: "With patient prone, squeeze the calf. Normal response: passive plantarflexion. Positive test (no plantarflexion) indicates Achilles tendon rupture.\n\nAchilles tendon rupture most commonly occurs 2-6 cm from its insertion where blood supply is poorest. Risk factors include chronic tendonitis, steroid injections, and fluoroquinolone antibiotics. Level 1 evidence suggests no difference in re-rupture rates between operative and non-operative management with functional rehabilitation."
    difficulty: easy
    tags: [orthopedic-surgery, Achilles-tendon]
  - front: "What are the features of a Codman's triangle on x-ray and what does it indicate?"
    back: "A triangular area of periosteal elevation where the partially ossified periosteum is lifted off the cortex by neoplastic tissue. It indicates a malignant bone lesion.\n\nOther radiographic features of malignant bone tumours include: 'onion skin' or 'sunburst' periosteal reaction, poorly defined borders with wide zone of transition, cortical destruction, and soft tissue mass. Benign lesions have well-demarcated borders, narrow zone of transition, and no periosteal reaction."
    difficulty: easy
    tags: [orthopedic-surgery, bone-tumours]
  - front: "What are the Danis-Weber classification types for ankle fractures and their management?"
    back: "Type A (infra-syndesmotic): syndesmosis intact, non-operative. Type B (trans-syndesmotic): most common, some need ORIF. Type C (supra-syndesmotic): frequently tears syndesmosis, all need ORIF.\n\nClassification is based on level of fibular fracture relative to syndesmosis. Operative indications include fracture-dislocation, any talar displacement, displaced medial/lateral malleolar fracture, trimalleolar fractures, and persistent medial clear space widening."
    difficulty: medium
    tags: [orthopedic-surgery, ankle-fracture]
  - front: "What is scoliosis, how is it measured, and when is surgical intervention indicated?"
    back: "Lateral curvature of spine with vertebral rotation, measured by Cobb angle. Treatment: <25° observe; >25° or progressive: bracing; >45° or cosmetically unacceptable or respiratory problems: surgical correction (spinal fusion).\n\nIdiopathic scoliosis (90% of cases) most commonly presents at 10-14 years and is more frequent and severe in females. Adams forward bend test reveals thoracic/lumbar prominence. Scoliosis screening is not recommended in Canada. Bracing halts/slows progression but does not reverse deformity."
    difficulty: easy
    tags: [orthopedic-surgery, scoliosis, pediatric]
  - front: "What are the motor and sensory functions of the axillary nerve, and what nerve roots does it arise from?"
    back: "Motor: deltoid, teres minor, triceps (long head). Sensory: lateral upper arm ('Sergeant's Patch'). Nerve roots: C5, C6.\n\nThe axillary nerve arises from the posterior cord of the brachial plexus (C5-C6). It is commonly injured in shoulder dislocations and proximal humerus fractures, causing deltoid weakness and sensory loss over the lateral upper arm."
    difficulty: easy
    tags: [axillary nerve, brachial plexus, upper extremity, nerve roots, motor, sensory]
  - front: "What are the motor and sensory functions of the radial nerve, and what nerve roots does it arise from?"
    back: "Motor: triceps (medial and lateral heads), forearm supination, wrist/thumb/finger extensors, wrist abductors. Sensory: lateral dorsum of the hand, medial upper forearm. Nerve roots: C5, C6, C7, C8.\n\nThe radial nerve is the most commonly injured nerve in the upper extremity. Wrist drop (loss of wrist extension) is the classic presentation. Injury commonly occurs with midshaft humerus fractures."
    difficulty: easy
    tags: [radial nerve, brachial plexus, upper extremity, nerve roots, wrist drop]
  - front: "What are the motor and sensory functions of the median nerve, and what nerve roots does it arise from?"
    back: "Motor: forearm pronation, wrist flexors, flexion of 1st–3rd digits, thumb opposition. Sensory: palmar thumb to radial half of 4th digit, and dorsal tips of digits 1 to radial half of digit 4. Nerve roots: C6, C7.\n\nThe median nerve is tested with the 'OK Sign' (AIN branch). It can be injured at the wrist (carpal tunnel syndrome) causing thenar wasting and loss of opposition. AIN injury causes loss of pinch (index finger FDP + FPL)."
    difficulty: easy
    tags: [median nerve, AIN, upper extremity, nerve roots, carpal tunnel]
  - front: "What are the motor and sensory functions of the ulnar nerve, and what nerve roots does it arise from?"
    back: "Motor: wrist flexors and adductors, flexion of 4th–5th digits, finger abduction/adduction. Sensory: medial palm and dorsum of hand, 5th digit and medial half of 4th digit. Nerve roots: C8, T1.\n\nThe ulnar nerve is tested by asking the patient to 'spread fingers.' It is commonly injured at the medial epicondyle (cubital tunnel) causing a 'claw hand' deformity of the 4th and 5th digits and hypothenar wasting."
    difficulty: easy
    tags: [ulnar nerve, upper extremity, nerve roots, claw hand, cubital tunnel]
  - front: "What are the motor and sensory functions of the tibial nerve, and what nerve roots does it arise from?"
    back: "Motor: ankle plantar flexion, knee flexion, great toe flexion. Sensory: sole of foot. Nerve roots: L5, S1.\n\nThe tibial nerve supplies the posterior compartment of the leg and the plantar surface of the foot. It runs through the tarsal tunnel on the medial side of the ankle and can be compressed there (tarsal tunnel syndrome)."
    difficulty: easy
    tags: [tibial nerve, lower extremity, nerve roots, plantar flexion]
  - front: "What is the difference in motor function and sensory territory between the superficial peroneal nerve and the deep peroneal nerve?"
    back: "Superficial peroneal: ankle eversion, dorsum of foot (sensory). Deep peroneal: ankle dorsiflexion/inversion and great toe extension, 1st web space (sensory). Both arise from L5, S1.\n\nCommon fibular (peroneal) nerve injury (e.g., at fibular neck) causes foot drop — loss of ankle dorsiflexion (deep peroneal) and eversion (superficial peroneal). The 1st web space is the key sensory landmark for deep peroneal nerve testing."
    difficulty: medium
    tags: [peroneal nerve, common fibular nerve, lower extremity, foot drop, nerve roots]
  - front: "What muscles are in the anterior compartment of the forearm?"
    back: "Pronator Teres, Flexor Carpi Radialis, Palmaris Longus, Flexor Carpi Ulnaris, Flexor Digitorum Superficialis, Flexor Digitorum Profundus, Flexor Pollicis Longus, Pronator Quadratus.\n\nThe anterior forearm compartment contains the forearm flexors and pronators, which are predominantly innervated by the median nerve (with FCU and FDP to digits 4-5 by the ulnar nerve). Compartment syndrome here can cause Volkmann's ischemic contracture."
    difficulty: medium
    tags: [forearm, anterior compartment, muscles, anatomy]
  - front: "What muscles comprise the medial compartment of the thigh?"
    back: "Adductor Longus, Adductor Brevis, Adductor Magnus, Gracilis, Pectineus.\n\nThe medial compartment of the thigh contains the hip adductors, innervated primarily by the obturator nerve (L2-L4). The pectineus is also partially innervated by the femoral nerve. These muscles are important in gait and in obturator nerve injury assessment."
    difficulty: medium
    tags: [thigh, medial compartment, muscles, adductors, anatomy]
  - front: "What are the key elements in describing a fracture on imaging?"
    back: "1. Name of injured bone; 2. Integrity of skin/soft tissue (open vs. closed); 3. Location (epiphyseal, metaphyseal, diaphyseal, physis); 4. Orientation/fracture pattern (transverse, oblique, butterfly, segmental, spiral, comminuted, intra-articular, compression, torus, greenstick, pathologic); 5. Alignment of fracture fragments (non-displaced, displaced, distracted, translated, angulated, rotated, shortened, avulsion).\n\nA systematic approach to fracture description is essential for communication and documentation. Displacement refers to the position of the distal fragment relative to the proximal. Varus angulation means the apex points away from the midline."
    difficulty: easy
    tags: [fracture, description, radiology, orthopedic basics]
  - front: "What is the difference between a torus fracture and a greenstick fracture, and in what patient population are they seen?"
    back: "Torus: compression of the bony cortex on one side while the other remains intact. Greenstick: compression of one side with fracture of the opposite cortex. Both are seen in children (paediatric population).\n\nPaediatric bone is more pliable than adult bone, allowing these incomplete fracture patterns. Torus (buckle) fractures are often stable and treated with splinting. Greenstick fractures may require reduction if significantly angulated."
    difficulty: easy
    tags: [torus fracture, greenstick fracture, paediatric, fracture patterns]
  - front: "What is a spiral fracture and what mechanism of injury produces it?"
    back: "A spiral fracture is a complex, multi-planar fracture line resulting from a rotational (torsional) force. It is typically a low-energy injury.\n\nSpiral fractures in children can raise concern for non-accidental trauma (NAT/child abuse), particularly when the history is inconsistent. In adults, they commonly occur in long bones due to twisting injuries (e.g., skiing)."
    difficulty: easy
    tags: [spiral fracture, mechanism of injury, fracture pattern, non-accidental trauma]
  - front: "What does the orthopedic 'Rule of 2s' refer to in x-ray imaging?"
    back: "2 sides (bilateral views for comparison), 2 views (AP + lateral at minimum), 2 joints (joint above and below the fracture), 2 times (before and after reduction).\n\nThe Rule of 2s ensures adequate fracture assessment and prevents missed injuries. For example, a forearm fracture should include imaging of the wrist and elbow. Post-reduction films confirm adequate alignment."
    difficulty: easy
    tags: [x-ray, Rule of 2s, fracture imaging, orthopedic principles]
  - front: "What are the indications for open reduction of a fracture ('NO CAST' mnemonic)?"
    back: "N – Neurovascular compromise; O – Open fracture; C – failed Closed reduction; A – unable to Apply cast or traction; S – Salter-Harris 3, 4, 5; T – pathologic fractures.\n\nOpen reduction with internal fixation (ORIF) is indicated when closed management would fail or lead to unacceptable outcomes. Displaced intra-articular fractures also require ORIF to restore joint congruity and minimize post-traumatic OA."
    difficulty: medium
    tags: [ORIF, open reduction, indications, fracture management, NO CAST]
  - front: "Describe the timeline and stages of normal fracture healing."
    back: "Weeks 0–3: hematoma formation, macrophages surround fracture site. Weeks 3–6: osteoclasts remove sharp edges, callus forms within hematoma. Weeks 6–12: bone forms within callus, bridging fragments. Months 6–12: cortical gap bridged by bone. Years 1–2: normal architecture achieved through remodelling.\n\nFracture healing follows a predictable sequence. Factors delaying healing include infection, poor immobilization, smoking, malnutrition, and certain medications (NSAIDs, steroids). Wolff's Law states that bone adapts its mass to the degree of mechanical loading applied."
    difficulty: easy
    tags: [fracture healing, bone healing stages, callus, remodelling]
  - front: "What are the clinical and radiographic criteria for fracture union?"
    back: "Clinical: no tenderness to palpation, no mobility at fracture site, minimal/no deformity, ability to weight bear without pain. Radiographic: trabeculae crossing fracture site, visible callus bridging site on at least 3 of 4 cortices.\n\nBoth clinical and radiographic criteria must be assessed together. Radiographic healing lags behind clinical healing. If there is clinical union without radiographic evidence, the patient may progress with weight-bearing."
    difficulty: medium
    tags: [fracture union, bone healing, clinical assessment, radiography]
  - front: "List the early and late local complications of fractures."
    back: "Early local: compartment syndrome, neurological injury, vascular injury, infection, implant failure, fracture blisters, CRPS (RSD). Late local: malunion/non-union, AVN, osteomyelitis, heterotopic ossification, post-traumatic OA, joint stiffness/adhesive capsulitis.\n\nSystemic complications include sepsis, PE, ARDS secondary to fat embolism, and hemorrhagic shock. Fat embolism syndrome presents with SOB, hypoxemia, petechial rash, thrombocytopenia, and neurological symptoms — classically 24–72 h after long bone fracture."
    difficulty: medium
    tags: [fracture complications, compartment syndrome, AVN, non-union, fat embolism]
  - front: "What is Complex Regional Pain Syndrome (CRPS/RSD), and what are its hallmarks?"
    back: "CRPS is sustained sympathetic activity characterized by: pain out of proportion to physical exam findings, hyperalgesia, allodynia, and autonomic signs (temperature asymmetry, skin changes, sudomotor changes).\n\nCRPS is a late complication of fractures or soft tissue injury. It is diagnosed clinically using the Budapest Criteria. Treatment includes physiotherapy, pain management, sympathetic nerve blocks, and psychological support."
    difficulty: hard
    tags: [CRPS, RSD, pain syndrome, fracture complication]
  - front: "What are the properties of articular (hyaline) cartilage, and why does it have limited healing capacity?"
    back: "Articular cartilage is a 2–4 mm avascular, aneural, and alymphatic layer covering the ends of articulating bones, providing a nearly frictionless surface. It receives nutrition from synovial fluid. Its avascular nature limits intrinsic repair capacity.\n\nDue to avascularity, chondrocytes cannot mount a significant repair response after injury. This is why articular cartilage defects tend to progress. Treatment options include microfracture (to stimulate fibrocartilage formation), osteochondral grafting, and autologous chondrocyte implantation."
    difficulty: medium
    tags: [articular cartilage, hyaline cartilage, avascular, chondral defect]
  - front: "What is the Outerbridge classification of chondral defects?"
    back: "Grade I: Softening and swelling of cartilage. Grade II: Fragmentation and fissuring <1/2 inch in diameter. Grade III: Fragmentation and fissuring >1/2 inch in diameter. Grade IV: Erosion of cartilage down to bone.\n\nThe Outerbridge Classification is used intraoperatively to grade chondral damage. Grade IV corresponds to full-thickness cartilage loss exposing subchondral bone. Higher grades generally require more aggressive operative treatment."
    difficulty: medium
    tags: [Outerbridge classification, chondral defect, cartilage grading]
  - front: "What are the non-operative and operative treatment options for articular cartilage defects?"
    back: "Non-operative: rest, COX-2 inhibitors, NSAIDs, bracing, physiotherapy, intra-articular corticosteroids. Operative: microfracture, osteochondral grafting (autograft or allograft), autologous chondrocyte implantation (ACI).\n\nTreatment is individualized based on patient factors (age, activity level, skeletal maturity) and defect factors (Outerbridge grade, subchondral bone involvement, defect size). Microfracture produces fibrocartilage rather than true hyaline cartilage."
    difficulty: medium
    tags: [chondral defect treatment, microfracture, osteochondral graft, ACI]
  - front: "What x-ray views are required for evaluation of a suspected posterior shoulder dislocation?"
    back: "AP, trans-scapular ('Y' view), and axillary views; or CT scan if axillary view cannot be obtained.\n\nPosterior shoulder dislocations are missed up to 60–80% of the time on initial presentation. The axillary view is critical — it directly shows the humeral head posterior to the glenoid. AP view alone is unreliable and may appear deceptively normal."
    difficulty: medium
    tags: [posterior shoulder dislocation, x-ray, axillary view, imaging]
  - front: "What specific x-ray views are recommended for suspected scaphoid fracture and scapholunate dissociation?"
    back: "AP and lateral wrist views, plus a Clenched Fist (anteroposterior stress) view for scapholunate dissociation.\n\nScaphoid fractures may be occult on initial plain films; MRI or bone scan is recommended if clinical suspicion is high. The clenched fist view widens the scapholunate gap in scapholunate dissociation (>3 mm is abnormal — the 'Terry Thomas sign')."
    difficulty: medium
    tags: [scaphoid fracture, scapholunate dissociation, wrist x-ray, clenched fist view]
  - front: "What are the 6 orthopedic emergencies captured by the mnemonic 'VON CHOP'?"
    back: "V – Vascular compromise; O – Open fracture; N – Neurological compromise/cauda equina; C – Compartment syndrome; H – Hip dislocation; O – Osteomyelitis/septic arthritis; P – Unstable Pelvic fracture.\n\nThese conditions require immediate recognition and intervention to prevent irreversible limb or life-threatening complications. Hip dislocations must be reduced within 6 hours to minimize the risk of avascular necrosis of the femoral head."
    difficulty: medium
    tags: [orthopedic emergencies, VON CHOP, compartment syndrome, open fracture]
  - front: "What is Damage Control Orthopedics (DCO) and when is it applied?"
    back: "DCO involves initial stabilization of fractures with external fixation in a hemodynamically unstable patient, followed by definitive fixation (IM nail or ORIF) once the patient is hemodynamically stable.\n\nDCO limits the 'second hit' phenomenon — the systemic inflammatory response of major surgery in an already physiologically compromised patient. It is preferred over immediate definitive fixation in polytrauma patients with coagulopathy, acidosis, or hypothermia."
    difficulty: hard
    tags: [damage control orthopedics, DCO, polytrauma, external fixation, ATLS]
  - front: "What antibiotic regimen is recommended for a Gustilo Grade I open fracture?"
    back: "First-generation cephalosporin (cefazolin 2g IV q8h) for 2 days. If penicillin/cephalosporin allergy: clindamycin 900 mg IV q8h. If MRSA positive: vancomycin 15 mg/kg IV q12h.\n\nGustilo Grade I: wound <1 cm with minimal contamination and simple/minimally comminuted fracture. Gram-positive coverage is sufficient. Antibiotics should be administered as early as possible following injury to reduce infection risk."
    difficulty: medium
    tags: [Gustilo classification, open fracture, antibiotics, cefazolin, Grade I]
  - front: "What is the Gustilo Classification of open fractures, and what are the key features and antibiotic regimens for each grade?"
    back: "Grade I: wound <1 cm, minimal contamination, simple fracture → cefazolin 2g IV q8h for 2d. Grade II: wound 1–10 cm, moderate contamination/soft tissue injury → as per Grade I. Grade III (wound >10 cm): IIIA: adequate soft tissue coverage → cefazolin + gentamicin/ceftriaxone for ≥3d; IIIB: periosteal stripping, bone exposure → same; IIIC: vascular injury → same; add metronidazole for soil/fecal contamination.\n\nAny high-energy, comminuted fracture, shotgun wound, farmyard/soil/water contamination, exposure to oral flora, or fracture >8 h old is automatically classified as Grade III. Antibiotics should be started immediately upon arrival."
    difficulty: hard
    tags: [Gustilo classification, open fracture, antibiotics, Grade III, soft tissue injury]
  - front: "What is the pathophysiology of compartment syndrome?"
    back: "Increased intracompartmental pressure → decreased venous drainage and lymphatic drainage → transudation into surrounding tissue → intracompartmental pressure exceeds capillary perfusion pressure → muscle and nerve anoxia → acidosis → leaky basement membranes → muscle and nerve necrosis. Irreversible muscle necrosis occurs in 4–6 hours.\n\nCompartment syndrome most commonly follows tibial shaft fractures, both-bone forearm fractures, or paediatric supracondylar humerus fractures. Extracompartmental causes include circumferential casts/burns or prolonged external compression."
    difficulty: hard
    tags: [compartment syndrome, pathophysiology, fasciotomy, ischemia]
  - front: "What are the clinical features (5 Ps) of compartment syndrome, and which is the most important early sign?"
    back: "Pain out of proportion to injury (most important early symptom — not relieved by analgesics), Pain with passive stretch (most sensitive sign), Pressure (tense/swollen compartment), Paresthesia, Pallor, Paralysis. The last two Ps (Pallor and Paralysis) are late signs — do not wait for them.\n\nIn paediatric patients, the '3 As' may be more useful: increasing Anxiety, Agitation, and Analgesia requirements. Once pallor and paralysis develop, irreversible necrosis has likely occurred. Pain with passive stretch of compartment muscles is the most reliable early clinical finding."
    difficulty: medium
    tags: [compartment syndrome, 5 Ps, clinical features, pain, passive stretch]
  - front: "What compartment pressure reading indicates compartment syndrome requiring fasciotomy?"
    back: "Absolute pressure ≥30 mmHg, OR delta pressure (diastolic blood pressure minus compartment pressure) <30 mmHg — either warrants urgent fasciotomy.\n\nCompartment syndrome is primarily a clinical diagnosis. Pressure monitoring is indicated in unreliable patients (children, unconscious, associated peripheral nerve injury). The delta pressure threshold (<30 mmHg) is more sensitive than the absolute threshold alone."
    difficulty: hard
    tags: [compartment syndrome, compartment pressure, fasciotomy, delta pressure]
  - front: "What is Volkmann's ischemic contracture, and what fractures are commonly associated with it?"
    back: "Volkmann's ischemic contracture is ischemic necrosis of the forearm flexors followed by secondary fibrosis and muscle contractures, causing a claw-like deformity of the hand, wrist, and fingers. It is especially associated with supracondylar humerus fractures and both-bone forearm fractures.\n\nVolkmann's contracture is the end-stage result of untreated or delayed-treatment compartment syndrome of the forearm. It is a late complication that is largely preventable with timely fasciotomy. Rehabilitation and surgical release may partially improve function."
    difficulty: medium
    tags: [Volkmanns contracture, compartment syndrome, supracondylar fracture, forearm]
  - front: "What is osteomyelitis, and what is its most common causative organism and route of spread?"
    back: "Osteomyelitis is bone infection with progressive inflammatory destruction. The most common causative organism is Staphylococcus aureus. The most common route of spread is hematogenous.\n\nRisk factors include recent trauma/surgery, immunocompromised state, diabetes, IV drug use, poor vascular supply, and peripheral neuropathy. Plain films are often normal for the first 10–12 days of infection. ESR and CRP are useful inflammatory markers."
    difficulty: easy
    tags: [osteomyelitis, S. aureus, hematogenous, bone infection]
  - front: "How is acute osteomyelitis treated compared to chronic osteomyelitis?"
    back: "Acute: IV antibiotics empirically (adjusted after blood/bone cultures), surgery (I&D) for abscess or significant involvement. Chronic: surgical debridement + both local (antibiotic beads) and systemic IV antibiotics + hardware removal if present.\n\nAntibiotic selection should target S. aureus empirically. Chronic osteomyelitis is defined by the presence of devitalized bone (sequestrum) and requires surgical debridement for cure. Local antibiotic delivery via beads maintains high local concentrations while minimizing systemic toxicity."
    difficulty: medium
    tags: [osteomyelitis, treatment, antibiotics, debridement, chronic]
  - front: "What are the most common causative organisms of septic arthritis, and which organism is classically considered in sexually active adults?"
    back: "Adults: Staphylococcus aureus (most common overall); consider coagulase-negative Staphylococcus with prosthetic joints. Sexually active adults and newborns: Neisseria gonorrhoeae.\n\nSeptic arthritis is a joint infection requiring urgent treatment to prevent progressive destruction. Gonococcal arthritis is the most common cause in sexually active young adults and typically presents as migratory polyarthralgia before settling into a monoarthritis."
    difficulty: medium
    tags: [septic arthritis, S. aureus, N. gonorrhoeae, joint infection]
  - front: "What are the synovial fluid findings in septic arthritis?"
    back: "WBC >50,000 cells/mm³ with >90% neutrophils (PMNs), cloudy yellow fluid, protein >4.4 mg/dL, glucose <60% of blood glucose, no crystals, positive Gram stain.\n\nArthrocentesis is essential for diagnosis. WBC >100,000 cells/mm³ has a positive LR of 28.0 for septic arthritis. A PMN proportion >90% increases the LR by 3.4 for septic arthritis. Crystals suggest gout or pseudogout rather than infection."
    difficulty: medium
    tags: [septic arthritis, synovial fluid, arthrocentesis, joint aspirate, WBC]
  - front: "What are the 4 Kocher criteria used to distinguish septic arthritis from transient synovitis in children, and what is their predictive value?"
    back: "1. Non-weight bearing; 2. ESR >40 mm/hr; 3. WBC >12,000 cells/mm³; 4. Fever (temperature >38.5°C). All 4 criteria positive: 99.6% predictive for septic joint.\n\nThe Kocher criteria help risk-stratify a child presenting with an irritable hip. Transient synovitis is the most common cause of acute hip pain in children and is a diagnosis of exclusion. A child with high predicted probability of septic arthritis requires urgent surgical washout."
    difficulty: hard
    tags: [septic arthritis, Kocher criteria, transient synovitis, paediatric, hip]
  - front: "What is the treatment for septic arthritis?"
    back: "IV antibiotics (empiric, adjusted based on joint aspirate culture and sensitivity results) + therapeutic joint aspiration (serially if necessary) OR arthroscopic/open irrigation and drainage.\n\nSeptic arthritis is a surgical emergency. Delay in treatment leads to irreversible cartilage destruction from enzymatic degradation by neutrophils. The hip and shoulder joints are generally treated with urgent surgical washout due to difficulty with serial aspiration."
    difficulty: medium
    tags: [septic arthritis, treatment, irrigation and drainage, antibiotics]
  - front: "What are the mechanisms of anterior vs. posterior shoulder dislocation?"
    back: "Anterior (>90%): abducted, externally rotated/hyperextended arm OR blow to posterior shoulder. Posterior (5%): the '3 Es' — Epileptic seizure, EtOH (ethanol intoxication), Electrocution; also FOOSH or adducted, internally rotated, flexed arm.\n\nThe glenohumeral joint is the most commonly dislocated joint in the body because stability is sacrificed for mobility. Anterior dislocations are far more common. Posterior dislocations are classically missed on AP x-ray alone."
    difficulty: easy
    tags: [shoulder dislocation, anterior dislocation, posterior dislocation, 3 Es, mechanism]
  - front: "What is a Hill-Sachs lesion and a Bankart lesion, and with which type of shoulder dislocation is each associated?"
    back: "Hill-Sachs lesion: compression fracture of the posterior humeral head from forceful impaction of an anteriorly dislocated head against the glenoid rim — associated with anterior dislocation. Bankart lesion: avulsion of the anterior glenoid labrum (with bone fragment = 'bony Bankart') — associated with anterior dislocation. Reverse Hill-Sachs: divot in anterior humeral head — posterior dislocation. Reverse Bony Bankart: avulsion of posterior glenoid labrum — posterior dislocation.\n\nThese structural lesions predispose to recurrent instability. A Hill-Sachs lesion >20% of the humeral head may engage the glenoid rim during normal range of motion (engaging Hill-Sachs), requiring operative management (Latarjet or remplissage procedure)."
    difficulty: hard
    tags: [Hill-Sachs lesion, Bankart lesion, shoulder dislocation, glenohumeral instability]
  - front: "What clinical tests are used to diagnose anterior vs. posterior shoulder instability?"
    back: "Anterior instability: Apprehension test (apprehension with abduction + external rotation), Relocation test (posteriorly directed force relieves apprehension), Sulcus sign (inferior instability with distal traction). Posterior instability: Posterior apprehension/jerk test (adduct + internally rotate + posterior force causes 'jerk' sensation).\n\nThese tests are more reliably used for chronic recurrent instability than acute dislocation. The relocation test is highly specific for anterior instability when positive. The sulcus sign indicates inferior glenohumeral laxity and may suggest multidirectional instability."
    difficulty: medium
    tags: [shoulder instability, apprehension test, relocation test, sulcus sign, clinical exam]
  - front: "What radiographic findings distinguish anterior from posterior shoulder dislocation on AP, axillary, and trans-scapular Y views?"
    back: "Anterior: humeral head anterior on axillary and Y views; sub-coracoid position on AP; positive rim sign (>6 mm gap between glenoid rim and humeral head). Posterior: humeral head posterior on axillary and Y ('Mercedes-Benz' sign); vacant glenoid sign on AP; 'lightbulb sign' (humeral head internally rotated appears round); reverse Hill-Sachs lesion.\n\nThe axillary view is the single most important view for diagnosing posterior dislocation — it directly visualizes the humeral head position relative to the glenoid. The 'lightbulb sign' on AP occurs because a posteriorly dislocated humerus is held in fixed internal rotation."
    difficulty: hard
    tags: [shoulder dislocation, x-ray, lightbulb sign, vacant glenoid, Mercedes-Benz sign]
  - front: "What neurovascular structures must be assessed after anterior shoulder dislocation?"
    back: "Axillary nerve: sensory patch over the deltoid ('Sergeant's Patch') and deltoid muscle contraction. Musculocutaneous nerve: sensory patch on lateral forearm and biceps contraction.\n\nAxillary nerve injury occurs in up to 9–18% of anterior shoulder dislocations. Always document neurovascular status before and after reduction. Persistent deltoid weakness after reduction suggests axillary nerve injury and warrants EMG/nerve conduction studies."
    difficulty: medium
    tags: [shoulder dislocation, axillary nerve, musculocutaneous nerve, neurovascular exam]
  - front: "What x-ray view is used for evaluation of the patellofemoral joint, and what conditions is it used for?"
    back: "Skyline (tangential) view with knees flexed at 45° — used for patella fracture, patellar dislocation, and patellofemoral syndrome.\n\nThe skyline view profiles the patella and trochlear groove in cross-section, allowing assessment of patellar tilt, trochlear dysplasia, and patellar fracture patterns. Standard AP and lateral views alone are insufficient for patellofemoral assessment."
    difficulty: medium
    tags: [patella, skyline view, patellofemoral syndrome, patellar dislocation, x-ray]
  - front: "What is the Swimmer's view in cervical spine imaging and when is it used?"
    back: "A lateral view taken with the arm abducted 180° to evaluate the C7-T1 junction when a standard lateral cervical spine view is inadequate to visualize this level.\n\nThe C7-T1 junction is a common site for fracture and dislocation. Failure to identify this junction on lateral cervical spine view is a significant source of missed injury. CT is now increasingly used as the primary imaging modality in high-energy trauma."
    difficulty: medium
    tags: [cervical spine, Swimmers view, C7-T1, trauma imaging]
  - front: "What are the 4 joints that make up the 'shoulder complex'?"
    back: "Glenohumeral joint, Acromioclavicular (AC) joint, Sternoclavicular (SC) joint, and Scapulothoracic joint.\n\nAll four joints work in concert for full shoulder range of motion. The glenohumeral joint provides the most mobility but is the most prone to dislocation. The scapulothoracic joint is a functional rather than true synovial joint."
    difficulty: easy
    tags: [shoulder anatomy, glenohumeral joint, AC joint, SC joint, scapulothoracic]
  - front: "What is the normal passive range of motion of the shoulder?"
    back: "Abduction: 180°, Adduction: 45°, Flexion: 180°, Extension: 45°, Internal rotation: to level of T4, External rotation: 45°.\n\nKnowledge of normal shoulder ROM is essential for assessing injury or disease severity. Loss of external rotation is a key finding in posterior shoulder dislocation and adhesive capsulitis (frozen shoulder)."
    difficulty: easy
    tags: [shoulder ROM, range of motion, shoulder anatomy, physical exam]
  - front: "What are the plain film findings of osteomyelitis, and when do they appear?"
    back: "Lytic bone destruction ('moth-eaten' appearance) and periosteal reaction (formation of new bone). These findings are generally not seen until 10–12 days after onset of infection.\n\nThe delay in radiographic findings is because significant bone destruction (30–50% of bone mineral) must occur before it becomes visible on plain film. MRI is the most sensitive early modality for osteomyelitis and can detect changes within 3–5 days."
    difficulty: medium
    tags: [osteomyelitis, plain film, x-ray findings, lytic bone, periosteal reaction]
  - front: "What is a Galeazzi fracture and why is it considered a 'fracture of necessity'?"
    back: "A Galeazzi fracture is a fracture of the distal radius with associated dislocation/disruption of the distal radioulnar joint (DRUJ). It is a 'fracture of necessity' because all cases are operative — ORIF of the radius is required, followed by assessment of DRUJ stability.\n\nOn x-ray, Galeazzi fractures show: shortening of distal radius >5 mm relative to the distal ulna, widening of DRUJ space on AP view, and dislocation of radius with respect to ulna on true lateral. If DRUJ is stable post-ORIF, splint for 10–14 days with early ROM. If unstable, ORIF or percutaneous pinning with long arm cast in supination x 2–3 weeks."
    difficulty: medium
    tags: [orthopedics, fractures, wrist, DRUJ, Galeazzi, ORIF]
  - front: "What is a Colles' fracture and what is its classic deformity?"
    back: "Colles' fracture is an extra-articular transverse distal radius fracture (~2 cm proximal to the radiocarpal joint) with dorsal displacement, often with ulnar styloid fracture. Classic deformity: 'dinner fork' deformity.\n\nMost common fracture in patients >40 years, especially women with osteoporotic bone. Mechanism: FOOSH (fall on outstretched hand). X-ray findings: dorsal tilt, dorsal displacement, radial shortening, ulnar styloid fracture, radial tilt, and radial displacement. Treatment goal is to restore radial height (13 mm), radial inclination (23°), volar tilt (11°), and DRUJ stability."
    difficulty: easy
    tags: [orthopedics, fractures, wrist, distal radius, Colles, FOOSH]
  - front: "What are the general indications for surgical management of distal radius fractures?"
    back: "Displaced intra-articular fracture, comminuted fracture, dorsal angulation >5° or volar tilt >20°, and >5 mm radial shortening.\n\nFeatures of inadequate closed reduction requiring ORIF (in non-geriatric patients): radial shortening >3 mm or angulation, and intra-articular displacement/step-off >2 mm. Operative options include percutaneous pinning, external fixation, or ORIF."
    difficulty: medium
    tags: [orthopedics, fractures, distal radius, ORIF, surgical indications]
  - front: "How is a Colles' fracture managed non-operatively?"
    back: "Hematoma block (sterile, local anesthetic injected into fracture site) or conscious sedation, followed by closed reduction (traction with extension to exaggerate injury, then traction with ulnar deviation, pronation, flexion of distal fragment). Apply dorsal slab/below-elbow cast for 5–6 weeks. Obtain post-reduction films immediately; repeat x-ray weekly for first 3 weeks and at cast removal.\n\nOperative treatment is indicated for failed closed reduction or loss of reduction. Options include percutaneous pinning, external fixation, or ORIF. Canadian guidelines follow standard orthopedic practice emphasizing restoration of radial height, inclination, and volar tilt."
    difficulty: medium
    tags: [orthopedics, fractures, Colles, closed reduction, management]
  - front: "What is a Smith's fracture and how does it differ from a Colles' fracture?"
    back: "Smith's fracture is volar displacement of the distal radius — the reverse of a Colles' fracture. Mechanism: fall onto the back of a flexed hand. Classic deformity: 'garden spade' deformity.\n\nNon-operative treatment: closed reduction and splinting in wrist extension with hematoma or regional nerve block; long-arm cast in supination x 6 weeks. Operative treatment (ORIF) is indicated for displaced or unstable fractures."
    difficulty: easy
    tags: [orthopedics, fractures, wrist, Smiths fracture, distal radius]
  - front: "List early and late complications of wrist fractures."
    back: "Early: difficult reduction/loss of reduction, compartment syndrome, extensor pollicis longus tendon rupture, acute carpal tunnel syndrome, finger swelling with venous block, complications of tight cast/splint. Late: malunion/radial shortening, painful wrist secondary to ulnar prominence, frozen shoulder (shoulder-hand syndrome), post-traumatic arthritis, carpal tunnel syndrome, CRPS/RSD.\n\n80% of distal radius fracture patients have normal function in 6–12 months. Most common complications are poor grip strength, stiffness, and radial shortening. Distal radius fractures in those <40 years are frequently high-energy/comminuted and more likely to require ORIF."
    difficulty: medium
    tags: [orthopedics, complications, wrist fractures, CRPS, carpal tunnel]
  - front: "What is the most common carpal bone fractured and what is its most common mechanism?"
    back: "Scaphoid fracture is the most common carpal bone injury. Mechanism: FOOSH causing impaction of scaphoid on distal radius, most commonly resulting in a transverse fracture through the waist (65%), proximal (25%), or distal (10%) pole.\n\nScaphoid fractures are common in young men but not in children or elderly. They may be associated with perilunate injuries. The proximal pole receives up to 100% of its arterial blood supply from the radial artery entering at the distal pole; a proximal-third fracture disrupts this supply, leading to high AVN/nonunion risk."
    difficulty: easy
    tags: [orthopedics, scaphoid fracture, carpal bones, FOOSH]
  - front: "What are the clinical features of a scaphoid fracture and how should a negative initial x-ray be managed?"
    back: "Clinical features: pain with resisted pronation, tenderness in the anatomical snuffbox, over the scaphoid tubercle, and pain with long-axis compression into the scaphoid. If the x-ray is negative but the patient has snuffbox tenderness, treat as a scaphoid fracture and repeat x-ray in 2 weeks. If still negative, order CT or MRI.\n\nA fracture may not be radiologically visible up to 2 weeks after acute injury. The anatomical snuffbox has high sensitivity but only 20% specificity — it is also positive with many other radial-sided wrist injuries after FOOSH. CT or MRI detect occult fractures and AVN."
    difficulty: medium
    tags: [orthopedics, scaphoid fracture, clinical diagnosis, snuffbox, imaging]
  - front: "What are the operative indications for scaphoid fracture, and what is the preferred surgical technique?"
    back: "Indications: displacement ≥1 mm, comminution, interscaphoid angle >35° ('humpback' deformity), associated perilunate injury. Treatment: ORIF with buried headless compression screw.\n\nNon-operative treatment is long-arm thumb spica cast x 4 weeks, then short-arm cast until radiographic healing (2–3 months). AVN is a major complication, especially with proximal-pole fractures. Proximal fifth fracture AVN rate approaches 100%; proximal third AVN rate is 33%; waist fractures heal 80–90%; distal pole approaches 100% healing."
    difficulty: hard
    tags: [orthopedics, scaphoid fracture, ORIF, AVN, nonunion]
  - front: "What are the specific complications of scaphoid fracture?"
    back: "Nonunion/malunion (most common — treated with bone graft from iliac crest or distal radius with fixation); AVN of the proximal pole; delayed union (recommend surgical fixation); scaphoid nonunion advanced collapse (SNAC) — chronic nonunion leading to advanced wrist collapse and arthritis.\n\nThe proximal pole is most at risk for AVN because it receives its blood supply entirely from the distal end. Proximal-fifth fractures have nearly 100% AVN rate. SNAC wrist is analogous to SLAC (scapholunate advanced collapse) in terms of end-stage wrist arthritis pattern."
    difficulty: hard
    tags: [orthopedics, scaphoid fracture, AVN, SNAC, complications]
  - front: "What are the mnemonics for remembering the order of carpal bones?"
    back: "Proximal row (lateral to medial): Scaphoid, Lunate, Triquetrum, Pisiform — 'So Long To Pinky'. Distal row (medial to lateral): Hamate, Capitate, Trapezoid, Trapezium — 'Here Comes The Thumb'.\n\nThe proximal row articulates with the distal radius and ulna. The distal row articulates with the metacarpals. This mnemonic is widely used on MCCQE1 and USMLE-style examinations."
    difficulty: easy
    tags: [orthopedics, anatomy, carpal bones, mnemonic]
  - front: "What are the key anatomical features of C1 and C2 vertebrae?"
    back: "C1 (atlas): no vertebral body, no spinous process. C2 (axis): has the odontoid process (dens). There are 7 cervical vertebrae but 8 cervical nerve roots; nerve roots exit above the vertebra of the same number (e.g., C4 root exits above C4 vertebra), except C8 which exits below C7.\n\nThis anatomy has critical implications for cervical radiculopathy: nerve root compression at a given level produces motor, sensory, and reflex deficits corresponding to that level. Radiculopathy = nerve root impingement; myelopathy = spinal cord impingement."
    difficulty: easy
    tags: [orthopedics, spine, anatomy, cervical spine, radiculopathy]
  - front: "What are the motor, sensory, and reflex findings for C5, C6, C7, and C8 radiculopathy?"
    back: "C5: Motor — deltoid/biceps; Sensory — axillary nerve (lateral deltoid patch); Reflex — biceps. C6: Motor — biceps/brachioradialis/wrist extension; Sensory — thumb; Reflex — biceps/brachioradialis. C7: Motor — triceps/wrist flexion/finger extension; Sensory — index and middle finger; Reflex — triceps. C8: Motor — interossei/digital flexors; Sensory — ring and little finger; Reflex — finger jerk.\n\nCervical radiculopathy presents with dermatomal pain, weakness in the myotome, and diminished reflex. On MCCQE1, remembering C5 = deltoid/biceps/biceps reflex, C6 = brachioradialis reflex, C7 = triceps/triceps reflex is essential."
    difficulty: medium
    tags: [orthopedics, cervical radiculopathy, neurology, reflexes, dermatomes]
  - front: "Describe the special tests for cervical spine pathology."
    back: "Compression test: pressure on head worsens radicular pain. Distraction test: traction on head relieves radicular symptoms. Valsalva test: increases intrathecal pressure, causes radicular pain. Lhermitte sign: electric shock radiating to back on forward neck flexion (MS, cervical myelopathy, B12 deficiency). Occiput-wall distance (OWD): >2 cm is abnormal, indicates thoracic hyper-kyphosis.\n\nThese tests help differentiate cervical radiculopathy from myelopathy and other neck pain etiologies. Lhermitte sign is classically associated with multiple sclerosis but can occur with any cause of cervical cord compression or B12 deficiency."
    difficulty: medium
    tags: [orthopedics, cervical spine, special tests, Lhermitte, radiculopathy]
  - front: "What are the x-ray parameters to assess on a lateral cervical spine view?"
    back: "Vertebral alignment: posterior vertebral bodies should be aligned (translation >3.5 mm is abnormal). Angulation between adjacent vertebral bodies (>11° is abnormal). Disc or facet joint widening. Anterior soft tissue space (at C3 should be <3 mm; at C4 should be <8–10 mm).\n\nAdditional cervical spine x-ray views: AP (alignment), AP odontoid (atlantoaxial articulation), oblique (pedicles and intervertebral foramina), swimmer's view (C7-T1 junction), and lateral flexion-extension views (subluxation). The anterior soft tissue space is a surrogate for retropharyngeal hematoma post-trauma."
    difficulty: medium
    tags: [orthopedics, cervical spine, x-ray, trauma, imaging]
  - front: "What are the motor, sensory, reflex, and screening test findings for L4, L5, and S1 radiculopathy?"
    back: "L4: Motor — quadriceps (knee extension/hip flexion), tibialis anterior; Sensory — medial malleolus; Reflex — knee (patellar); Screening — squat and rise; Test — femoral stretch. L5: Motor — extensor hallucis longus, gluteus medius; Sensory — 1st dorsal webspace and lateral leg; Reflex — medial hamstring; Screening — heel walking; Test — straight leg raise. S1: Motor — peroneus longus/brevis, gastrocnemius/soleus; Sensory — lateral foot; Reflex — ankle (Achilles); Screening — walking on toes; Test — straight leg raise.\n\nOn MCCQE1, L4 = knee reflex, L5 = heel walking/EHL weakness, S1 = ankle reflex/toe walking/gastrocnemius. Disc herniation most commonly occurs at L5-S1 > L4-5 > L3-4."
    difficulty: medium
    tags: [orthopedics, lumbar radiculopathy, L4, L5, S1, reflexes]
  - front: "What are the special tests for lumbar spine pathology?"
    back: "Straight leg raise (SLR): passive lifting of leg at 30–70° reproduces radicular symptoms radiating down posterior/lateral leg to knee and into foot. Lasegue maneuver: dorsiflexion of foot during SLR worsens symptoms. Femoral stretch test: with patient prone, flexing the knee and passively extending the hip reproduces anterior thigh pain (tests upper lumbar roots L2-4).\n\nPositive contralateral SLR (pain in symptomatic leg when contralateral leg is raised) is highly specific for disc herniation. The Lasegue maneuver and Bowstring sign confirm nerve root tension. Femoral stretch tests L2, L3, and L4 nerve roots."
    difficulty: medium
    tags: [orthopedics, lumbar spine, straight leg raise, Lasegue, special tests]
  - front: "What is the differential diagnosis of back pain?"
    back: "Mechanical or nerve compression (>90%): degenerative disc/facet/ligament, disc herniation, spinal stenosis. Others (<10%): neoplastic (primary, metastatic, multiple myeloma), infectious (osteomyelitis, TB), metabolic (osteoporosis), traumatic fracture, spondyloarthropathies (ankylosing spondylitis), referred pain (aorta, renal, ureter, pancreas).\n\nRed flags for back pain: bowel or bladder dysfunction, bilateral symptoms, constitutional symptoms/malignancy, chronic disease, paresthesias, age >50 years, IV drug use, neuromotor deficits. These require urgent investigation and possible imaging."
    difficulty: easy
    tags: [orthopedics, back pain, differential diagnosis, red flags, spine]
  - front: "How does neurogenic claudication differ from vascular claudication?"
    back: "Neurogenic claudication: aggravated by standing/walking (walking distance variable); relieved by change in position (usually flexion, sitting, lying down); relief in ~10 minutes. Vascular claudication: aggravated by walking/exercise (reproducible); relieved by stopping walking; relief in ~2 minutes.\n\nNeurogenic claudication is position-dependent (spinal canal widens with flexion); vascular claudication is exercise-dependent (ischemia resolves with rest). Neurogenic claudication is a hallmark of spinal stenosis. Key MCCQE1 distinction."
    difficulty: medium
    tags: [orthopedics, spinal stenosis, claudication, vascular, neurogenic]
  - front: "What is degenerative disc disease and how is it managed?"
    back: "Loss of vertebral disc height with age causing: bulging/tears of annulus fibrosus, change in alignment of facet joints, and osteophyte formation. Clinical features: axial back pain, pain worse with axial loading and flexion, negative straight leg raise. Non-operative: staying active with modified activity, back strengthening, NSAIDs. Do NOT use opioids; no proven efficacy for spinal traction or manipulation. Operative (rarely): decompression + fusion for severe/progressive neurological deficit or refractory cases.\n\nImaging (x-ray, MRI, provocative discography) is only indicated if symptoms persist >6 weeks or red flags are present. Degenerative disc disease is the most common cause of mechanical back pain. Conservative management is the cornerstone of Canadian guidelines."
    difficulty: easy
    tags: [orthopedics, degenerative disc disease, back pain, management, NSAIDs]
  - front: "What is spinal stenosis and how is it managed?"
    back: "Narrowing of the spinal canal — congenital (idiopathic, osteopetrosis, achondroplasia) or acquired (degenerative, iatrogenic post-surgery, ankylosing spondylosis, Paget's disease, trauma). Features: bilateral back and leg pain, neurogenic claudication, ± motor weakness. Non-operative: physiotherapy (flexion exercises, stretch/strength), NSAIDs, lumbar epidural steroids. Operative: decompressive surgery after >6 months of non-operative failure.\n\nCT/MRI confirms narrowing of spinal canal. Neurogenic claudication is position-dependent (relieved by flexion/sitting), differentiating it from vascular claudication. Cauda equina syndrome from central compression is a surgical emergency."
    difficulty: medium
    tags: [orthopedics, spinal stenosis, neurogenic claudication, decompression, spine]
  - front: "What is lumbar disc herniation and what are its clinical features?"
    back: "Tear in annulus fibrosus allows protrusion of nucleus pulposus, most commonly at L5-S1 > L4-5 > L3-4. M:F = 3:1; only 5% become symptomatic. Clinical features: back-dominant pain (central herniation) or leg-dominant pain (lateral herniation), tenderness between spinous processes, muscle spasm, loss of lumbar lordosis, positive SLR, positive Lasegue/Bowstring, cauda equina syndrome in 1–10% (surgical emergency).\n\nCauda equina syndrome presents with bilateral leg weakness, saddle anesthesia, and bowel/bladder dysfunction — it is a surgical emergency requiring urgent decompression. 90% of patients improve in 3 months with non-operative treatment (extension protocol physiotherapy, NSAIDs)."
    difficulty: medium
    tags: [orthopedics, disc herniation, lumbar, cauda equina, sciatica]
  - front: "What are the operative indications for lumbar disc herniation?"
    back: "Progressive neurological deficit, failure of symptoms to resolve within 3 months of non-operative treatment, or cauda equina syndrome due to central disc herniation. Surgical treatment: discectomy.\n\nNon-operative treatment (extension protocol physiotherapy, NSAIDs) is first-line, with 90% improving in 3 months. Cauda equina syndrome is a surgical emergency requiring urgent discectomy. Red flags mandating urgent evaluation: bowel/bladder dysfunction, bilateral leg weakness, saddle anesthesia."
    difficulty: medium
    tags: [orthopedics, disc herniation, discectomy, surgical indications, cauda equina]
  - front: "What are the key differences between the types of low back pain in terms of aggravating factors?"
    back: "Disc origin mechanical back pain: aggravated by flexion. Facet origin mechanical back pain: aggravated by extension, standing, and walking. Spinal stenosis: aggravated by exercise, extension, walking, and standing. Root compression/disc herniation (lateral): aggravated by flexion.\n\nUnderstanding the aggravating and relieving factors helps identify the pain generator. Disc-origin pain is flexion-aggravated, facet pain is extension-aggravated, and stenosis is position-dependent (worse with extension, better with flexion). This guides treatment — extension exercises for disc herniation, flexion exercises for stenosis."
    difficulty: medium
    tags: [orthopedics, back pain, mechanical, disc herniation, spinal stenosis]
  - front: "What is spondylolysis and how is it diagnosed?"
    back: "Spondylolysis is a defect in the pars interarticularis with no movement of the vertebral bodies. Common in athletes (gymnasts, weightlifters, backpackers, loggers). Clinical feature: activity-related back pain, pain with unilateral extension (Michelis' test). Diagnosis: oblique x-ray showing 'collar' break in the 'Scottie dog's' neck; bone scan; CT scan. Treatment: activity restriction, brace, stretching exercises.\n\nThe 'Scottie dog' sign on oblique x-ray represents the pars interarticularis as the dog's neck. A break ('collar') at this site confirms spondylolysis. Spondylolysis is distinct from spondylolisthesis, which involves actual vertebral body translation."
    difficulty: medium
    tags: [orthopedics, spondylolysis, spine, pars interarticularis, Scottie dog]
  - front: "What is adult isthmic spondylolisthesis and what is the Meyerding classification?"
    back: "Spondylolisthesis is a defect in the pars interarticularis causing forward translation/slippage of one vertebra on another, usually at L5-S1. Meyerding classification by percentage of slip: Grade 1 = 0–25%, Grade 2 = 25–50%, Grade 3 = 50–75%, Grade 4 = 75–100%, Grade 5 = >100% (spondyloptosis). Mechanism: degenerative (adults), traumatic, pathological, or teratogenic.\n\nTreatment: Grades 1–2 — symptomatic operative fusion only for intractable pain; Grades 3–5 — decompression for spondylolisthesis plus spinal fusion. Operative indications: refractory pain, progressive slip, neurological deficits, segmental instability. Complication: cauda equina syndrome from roots stretched over L5 or sacrum."
    difficulty: hard
    tags: [orthopedics, spondylolisthesis, Meyerding, spine, L5-S1]
  - front: "What are the clinical features, investigations, and emergency management of a pelvic fracture?"
    back: "Clinical features: pain, inability to bear weight, local swelling/tenderness, abnormal lower extremity positioning (external rotation), limb-length discrepancy, pelvic instability. Investigations: AP pelvis, inlet/outlet views, Judet views (acetabular fracture); CT for posterior pelvic and acetabular evaluation; assess GU injury (rectal/vaginal exam, hematuria, blood at urethral meatus — if positive, fracture is open). Emergency management: IV fluids/blood, pelvic binder/sheet, external fixation vs. emergent angiography/embolization, ± laparotomy (if FAST/DPL positive), ± pre-peritoneal packing.\n\nPelvic fractures carry life-threatening risk of hemorrhage. A pelvic binder reduces pelvic volume and controls bleeding in open-book fractures. Angiography with embolization addresses arterial bleeding. The 6 cardinal radiographic landmarks of the acetabulum: ilioischial line, iliopectineal line, teardrop, weight-bearing roof, posterior rim, anterior rim."
    difficulty: hard
    tags: [orthopedics, pelvic fracture, trauma, hemorrhage, ATLS]
  - front: "Describe the Tile classification of pelvic fractures."
    back: "Type A: rotationally and vertically stable (A1 = avulsion/iliac wing fracture; A2 = minimally displaced ring fracture; A3 = transverse sacral/coccygeal fracture). Type B: rotationally unstable, vertically stable (B1 = open book/external rotation; B2 = lateral compression; B3 = bilateral). Type C: rotationally and vertically unstable (C1 = unilateral; C2 = bilateral with one side B and one side C; C3 = bilateral both type C).\n\nType A fractures are stable and managed non-operatively (protected weight-bearing). Operative indications include unstable pelvic ring injury, symphysis diastasis >2.5 cm, and open fractures. Complications include hemorrhage (life-threatening), GU injury, obstetrical difficulties, DVT/PE, and post-traumatic arthritis."
    difficulty: hard
    tags: [orthopedics, pelvic fracture, Tile classification, pelvic ring, trauma]
  - front: "What are the characteristics and treatment of posterior hip dislocation?"
    back: "Most frequent type of hip dislocation (90%). Mechanism: severe axial load to knee with hip flexed and adducted (e.g., knee into dashboard in MVC). Clinical features: shortened, adducted, internally rotated limb. X-ray: affected femoral head appears smaller than unaffected. Treatment: urgent closed reduction under conscious sedation/GA (if no associated femoral neck fracture); ORIF if unstable or intra-articular fragments; post-reduction CT to assess congruity and fractures.\n\nHip dislocations should be reduced within 6 hours to decrease risk of AVN of the femoral head. Thompson and Epstein classification for posterior dislocation: Type I (no/minor acetabular wall fracture) through Type V (femoral head fracture). Hip precautions maintained for 6 weeks post-reduction."
    difficulty: medium
    tags: [orthopedics, hip dislocation, posterior, AVN, MVC]
  - front: "What is anterior hip dislocation and how does it present differently from posterior dislocation?"
    back: "Anterior hip dislocation: mechanism — posteriorly directed axial loading with hip widely abducted and externally rotated. Two types: inferior (flexion, abduction, external rotation) and superior (extension and external rotation). Clinical features: shortened, abducted, externally rotated limb. Posterior dislocation: internally rotated, adducted. Treatment: closed reduction under conscious sedation/GA; post-reduction CT.\n\nThe limb position is key for distinguishing the two types. Anterior dislocation = external rotation and abduction; posterior dislocation = internal rotation and adduction. Up to 50% of patients with hip dislocations suffer fractures elsewhere at time of injury."
    difficulty: medium
    tags: [orthopedics, hip dislocation, anterior, posterior, limb position]
  - front: "What are the complications of hip dislocation?"
    back: "Post-traumatic OA, AVN of femoral head (risk increases with delay in reduction), associated fractures (femoral head/neck/shaft), sciatic nerve palsy in 25% (10% permanent), heterotopic ossification (HO), thromboembolism (DVT/PE), hip instability and re-dislocation.\n\nAVN is the most feared complication and is minimized by reducing the dislocation within 6 hours. Sciatic nerve palsy is the most common neurological complication, occurring in 25% of posterior dislocations. DVT/PE prophylaxis is essential in these patients."
    difficulty: medium
    tags: [orthopedics, hip dislocation, complications, AVN, sciatic nerve]
  - front: "What are the clinical features of a hip fracture and what is the classic limb position?"
    back: "Acute hip pain after a fall, inability to weight-bear, shortened and externally rotated leg, painful ROM. X-ray features of subcapital fractures: disruption of Shenton's line and altered neck-shaft angle (normal 120–130°).\n\nHip fractures are a major cause of morbidity and mortality in the elderly. DVT prophylaxis with LMWH (enoxaparin 40 mg SC once daily), fondaparinux, or low-dose heparin is started on admission but not within 12 hours before surgery. Early operative fixation is standard of care."
    difficulty: easy
    tags: [orthopedics, hip fracture, femoral neck, elderly, Shentons line]
  - front: "What are the three types of hip fractures and their management?"
    back: "Femoral neck fracture (intracapsular): x-ray AP pelvis/hip; treatment per Garden classification; complications include AVN and disruption of blood supply (medial/lateral femoral circumflex arteries). Intertrochanteric fracture (extracapsular): closed reduction under fluoroscopy then dynamic hip screw or IM nail; complications — DVT, varus displacement. Subtrochanteric fracture: closed/open reduction with IM nail; complications — malalignment, non-union, wound infection.\n\nIntertrochanteric fractures are stable if the posteromedial cortex is intact. Subtrochanteric fractures are often high-energy in young patients and pathological in the elderly. IM nailing is the workhorse for both inter- and subtrochanteric fractures."
    difficulty: medium
    tags: [orthopedics, hip fracture, intertrochanteric, subtrochanteric, femoral neck]
  - front: "Describe the Garden classification of femoral neck fractures and its treatment implications."
    back: "Type I: incomplete, valgus/neutral, disrupted trabeculae — internal fixation to prevent displacement (valgus impacted fracture). Type II: complete, neutral, aligned trabeculae — internal fixation. Type III: partial complete, varus, disrupted trabeculae — young: ORIF; elderly: hemi- or total hip arthroplasty. Type IV: complete, varus, disrupted trabeculae — young: ORIF; elderly: hemi- or total hip arthroplasty.\n\nGarden III and IV fractures have high rates of AVN and nonunion, especially in the elderly, because the blood supply to the femoral head (medial and lateral femoral circumflex arteries) is disrupted. In the elderly, arthroplasty provides more reliable pain relief and faster functional recovery than ORIF."
    difficulty: hard
    tags: [orthopedics, Garden classification, femoral neck fracture, AVN, arthroplasty]
  - front: "What are the clinical features and OA x-ray findings of hip arthritis?"
    back: "OA: pain (groin, medial thigh) and stiffness aggravated by activity, relieved with rest; decreased ROM (internal rotation lost first); crepitus; leg length discrepancy; fixed flexion contracture (Thomas test); ± Trendelenburg sign/gait. X-ray OA findings — LOSS: Loss of joint space, Osteophytes, Subchondral sclerosis, Subchondral cysts. Inflammatory (RA) x-ray: osteopenia, periarticular erosions, concentric joint space narrowing.\n\nHip arthritis is managed non-operatively with weight loss, activity modification, physiotherapy, analgesics, anti-inflammatories, and walking aids. Operative management (arthroplasty) is indicated for advanced disease significantly affecting quality of life. Arthroplasty complications: component loosening, dislocation, HO, thromboembolism, infection, neurovascular injury, limb length discrepancy, periprosthetic fracture."
    difficulty: medium
    tags: [orthopedics, hip arthritis, osteoarthritis, x-ray, LOSS mnemonic]
  - front: "What are the risk factors and mechanism for hip dislocation after total hip arthroplasty (THA)?"
    back: "Incidence: 1–4% primary THA; 10–16% revision THA. Risk factors: post-traumatic arthritis, revision surgery, substance use, cognitive impairment (dementia), spastic/neuromuscular disease, posterior surgical approach, spinal fusion. Mechanism: posterior dislocation — flexion, adduction, internal rotation; anterior dislocation — extension and external rotation.\n\nHip dislocation is a common indication for early revision THA. Prevention: hip precautions (no extreme flexion, adduction, or rotation) for 6 weeks post-procedure. Closed reduction is attempted first; revision arthroplasty is indicated for recurrent dislocation."
    difficulty: medium
    tags: [orthopedics, total hip arthroplasty, dislocation, revision, risk factors]
  - front: "What is sciatica and what is its most common cause?"
    back: "Sciatica is a symptom of radiculopathy: leg-dominant, constant, burning pain that radiates down the leg and foot. Most common cause: disc herniation.\n\nSciatica is distinct from mechanical back pain in that it is leg-dominant, constant, and burning, and follows a dermatomal distribution. It is caused by compression or irritation of the sciatic nerve or its contributing nerve roots (L4, L5, S1). Disc herniation is by far the most common cause, particularly at L4-5 and L5-S1."
    difficulty: easy
    tags: [orthopedics, sciatica, radiculopathy, disc herniation, lumbar]
  - front: "What red flags indicate the need for urgent imaging or surgical consultation in back pain?"
    back: "Bowel or bladder dysfunction, bilateral symptoms, constitutional symptoms/malignancy, chronic disease, paresthesias, age >50 years, IV drug use, neuromotor deficits.\n\nRed flags suggest serious underlying pathology such as cauda equina syndrome, malignancy, infection (osteomyelitis, TB), or abdominal aortic aneurysm. Cauda equina syndrome and ruptured aortic aneurysm are causes of acute low back pain that are surgical emergencies."
    difficulty: easy
    tags: [orthopedics, back pain, red flags, cauda equina, emergency]
  - front: "At what spinal level does the spinal cord terminate, and what is the clinical relevance?"
    back: "The spinal cord terminates at the conus medullaris at L1/2. Below this level, the spinal canal contains the cauda equina (individual nerve roots). Individual lumbar nerve roots exit below the pedicle of the same-numbered vertebra (e.g., L4 root exits below L4 pedicle).\n\nThis anatomical fact is critical for understanding the difference between upper motor neuron and lower motor neuron injuries in spinal pathology. Cauda equina syndrome (below L1/2) produces LMN signs, whereas cord injuries above the conus produce UMN signs. It also defines which levels can safely undergo lumbar puncture (below L1/2 = safe)."
    difficulty: easy
    tags: [orthopedics, spine, anatomy, conus medullaris, cauda equina]
  - front: "What are the causes and mechanisms of pelvic fractures in young vs. elderly patients?"
    back: "Young: high-energy trauma (direct or transmitted longitudinally through femur) — lateral compression, vertical shear, or anteroposterior compression fractures. Elderly: low-energy trauma (fall from standing height) — typically stable fractures managed non-operatively.\n\nThe distinction is clinically important for triage and management. High-energy pelvic fractures carry risk of life-threatening hemorrhage and associated injuries (urogenital, rectal, vascular). Elderly stable fractures are managed with protected weight-bearing and early mobilization to prevent deconditioning and DVT."
    difficulty: easy
    tags: [orthopedics, pelvic fracture, epidemiology, mechanism, elderly]
  - front: "What are the DVT prophylaxis options after elective total hip arthroplasty (THA)?"
    back: "DOACs (e.g., rivaroxaban), ASA, heparin, or warfarin. Duration: continue for 10–35 days postoperatively.\n\nCanadian guidelines support extended thromboprophylaxis after elective THA for 10–35 days. DOACs such as rivaroxaban are preferred for convenience and efficacy. ACCP and Canadian guidelines endorse this approach to reduce VTE risk following major lower limb arthroplasty."
    difficulty: easy
    tags: [orthopedics, THA, DVT prophylaxis, anticoagulation, postoperative care]
  - front: "What are the operative indications for revision THA following hip dislocation?"
    back: "Recurrent dislocations, associated polyethylene wear, malalignment, hardware failure, or infection.\n\nAfter a primary closed reduction of a dislocated THA, operative revision is warranted for recurrence or mechanical failure. Infection is a particularly important cause of instability that must be excluded, as septic loosening can lead to recurrent dislocation."
    difficulty: medium
    tags: [orthopedics, THA, hip dislocation, revision surgery, complications]
  - front: "What is the most common mechanism of femoral diaphysis fracture in adults vs. children?"
    back: "Adults: high energy trauma (MVC, fall from height, gunshot). Children: can result from low energy trauma (spiral fracture); always consider non-accidental trauma (child abuse).\n\nFemoral shaft fractures in children from low-energy spiral mechanisms warrant consideration of non-accidental trauma (NAT). In adults, high-energy mechanisms dominate. The difference in fracture energy threshold underscores the need for child abuse awareness in pediatric fractures."
    difficulty: easy
    tags: [orthopedics, femur fracture, pediatrics, non-accidental trauma, mechanism of injury]
  - front: "What is the Winquist and Hansen classification used for?"
    back: "Classification of femoral diaphysis (shaft) fractures based on degree of comminution.\n\nThe Winquist-Hansen classification grades femoral shaft fractures by comminution from Type 0 (no comminution) to Type IV (circumferential comminution). Higher grades are associated with greater instability and increased risk of complications."
    difficulty: easy
    tags: [orthopedics, femur fracture, classification, Winquist Hansen]
  - front: "What is the preferred operative treatment for femoral shaft fractures in adults?"
    back: "ORIF with anterograde intramedullary (IM) nail (most common). Alternatives: retrograde IM nail, plate/screw fixation, or temporary external fixation in unstable/polytrauma patients.\n\nAntegrade IM nailing is the gold standard for femoral shaft fractures due to reliable fixation and ability for early mobilization. Retrograde nailing is used for distal fractures or when antegrade access is limited. External fixation is a damage-control measure in polytrauma."
    difficulty: easy
    tags: [orthopedics, femur fracture, IM nail, ORIF, operative treatment]
  - front: "What percentage of femoral diaphysis fractures are associated with ipsilateral femoral neck fractures, and what is the clinical concern?"
    back: "2–6% association with ipsilateral hip dislocation/fracture. These are reportedly missed in 19–31% of cases, making it essential to image the ipsilateral hip with every femoral shaft fracture.\n\nIpsilateral femoral neck fractures are commonly missed with femoral shaft fractures. Standard workup must include AP pelvis and AP/lateral hip views. Missing a femoral neck fracture can lead to avascular necrosis and significant morbidity."
    difficulty: medium
    tags: [orthopedics, femur fracture, associated injuries, femoral neck, imaging]
  - front: "What are the three types of distal femoral fractures?"
    back: "Extra-articular, partial articular, and complete articular fractures.\n\nDistal femoral fractures involve the region from the articular surface to 5 cm above the metaphyseal flare. Classification by articular involvement guides treatment: extra-articular may be managed non-operatively if non-displaced; articular fractures generally require ORIF to restore joint congruity."
    difficulty: easy
    tags: [orthopedics, distal femur fracture, classification, articular fracture]
  - front: "What ABI threshold indicates vascular injury in a distal femoral fracture requiring angiography?"
    back: "ABI < 0.9 is abnormal and requires angiography to evaluate for vascular injury.\n\nThe popliteal artery is at risk in distal femoral fractures. ABI is used as a screening tool; values <0.9 indicate significant vascular compromise and mandate CT angiography or formal angiography to identify injury requiring repair."
    difficulty: medium
    tags: [orthopedics, distal femur fracture, vascular injury, ABI, angiography]
  - front: "What are the common complaints suggesting intra-articular knee pathology?"
    back: "Locking, instability, and swelling (effusion).\n\nLocking (inability to fully extend due to mechanical block, e.g., meniscal tear), instability (ligamentous insufficiency), and swelling (hemarthrosis/synovitis) are classic indicators of intra-articular pathology. Pseudo-locking differs — it has no mechanical block and is caused by muscle spasm or arthritis."
    difficulty: easy
    tags: [orthopedics, knee, intra-articular pathology, clinical features, meniscus]
  - front: "Describe the Lachman test: technique, what it tests, and its diagnostic accuracy."
    back: "Knee held at 20–30° flexion; stabilize distal femur, attempt to anteriorly sublux tibia. Tests ACL integrity. Positive likelihood ratio: 25.0; negative likelihood ratio: 0.1 — most reliable ACL test.\n\nThe Lachman test is the most sensitive and specific bedside test for ACL injury. Less muscular stabilization at 20–30° flexion (vs. 90° for the anterior drawer test) allows better detection of anterior tibial translation. A positive test indicates ACL rupture."
    difficulty: easy
    tags: [orthopedics, knee, ACL, Lachman test, physical examination, likelihood ratio]
  - front: "What does a positive pivot shift test indicate, and how is it performed?"
    back: "Indicates ACL tear. Start with knee extended, internally rotate foot, slowly flex knee while applying valgus force. An incompetent ACL causes anterior tibial subluxation that reduces/externally rotates ('pivots') during flexion. PLR 25.0, NLR 0.04.\n\nThe pivot shift test demonstrates functional instability in ACL-deficient knees. It is best performed under anesthesia as it requires muscular relaxation. The clunking reduction during flexion is the 'pivot.' It is highly specific for ACL injury and useful for confirming surgical indication."
    difficulty: medium
    tags: [orthopedics, knee, ACL, pivot shift, physical examination]
  - front: "What does the posterior sag sign indicate, and what is the mechanism of a false positive anterior drawer test in this context?"
    back: "Posterior sag sign suggests PCL tear. Posterior tibial subluxation from the PCL tear causes the tibia to start in a posteriorly subluxed position, producing a false positive anterior drawer test as the tibia is reduced rather than truly subluxed anteriorly.\n\nWith PCL rupture, gravity causes the tibia to sag posteriorly when hips and knees are flexed at 90°. When the anterior drawer test is then performed, the tibia appears to move forward, but this is actually reduction to neutral — not true anterior subluxation. Recognition avoids misdiagnosis of ACL injury."
    difficulty: hard
    tags: [orthopedics, knee, PCL, posterior sag sign, anterior drawer, false positive]
  - front: "How is the McMurray test performed and what does it assess?"
    back: "With knee in flexion, palpate joint line. Medial meniscus: externally rotate foot, apply valgus stress, extend knee. Lateral meniscus: internally rotate foot, apply varus stress, extend knee. Positive: pain, click, or snap. PLR 1.3, NLR 0.8.\n\nThe McMurray test loads the menisci through rotation and stress to reproduce a tear's mechanical symptoms. Its moderate likelihood ratios mean it has limited standalone diagnostic value; MRI is the gold standard for meniscal tear diagnosis."
    difficulty: medium
    tags: [orthopedics, knee, meniscal tear, McMurray test, physical examination]
  - front: "Compare ACL vs. PCL injury mechanisms."
    back: "ACL: Non-contact (most common) — sudden deceleration/change of direction with valgus stress; Contact — direct lateral knee blow. PCL: Non-contact — hyperflexion/hyperextension; Contact — posterior tibial displacement with knee flexed (e.g., dashboard injury in MVC).\n\nACL injuries are often sports-related non-contact events (e.g., landing, pivoting). PCL injuries are more often traumatic with direct posterior force. Mechanism guides clinical suspicion and targeted examination. Dashboard mechanism is a classic PCL injury pattern."
    difficulty: easy
    tags: [orthopedics, knee, ACL, PCL, mechanism of injury, ligament injury]
  - front: "What are the tissue graft options for ACL reconstruction?"
    back: "Hamstring autograft, middle 1/3 patellar tendon (bone-patellar-bone autograft), and allograft (e.g., cadaver).\n\nAutografts are generally preferred for younger, high-demand patients due to lower re-rupture rates. Bone-patellar-bone grafts offer strong bony fixation. Hamstring grafts have lower donor site morbidity. Allografts are options for older or lower-demand patients."
    difficulty: easy
    tags: [orthopedics, ACL, reconstruction, graft, surgery]
  - front: "What is O'Donoghue's Unhappy Triad and what structures are involved?"
    back: "ACL tear + MCL tear + medial and/or lateral meniscal damage, typically from a valgus force to the knee.\n\nO'Donoghue's Unhappy Triad is a classic combination injury from a valgus force on the knee, often seen in contact sports. The lateral compartment is compressed, damaging the ACL, while the medial side is tensioned, tearing the MCL and medial meniscus. Lateral meniscus involvement is also described."
    difficulty: easy
    tags: [orthopedics, knee, ODonoghue, unhappy triad, ACL, MCL, meniscus]
  - front: "What is the difference between a partial and complete collateral ligament tear on stress testing?"
    back: "Partial tear: laxity with a firm endpoint. Complete tear: laxity with no endpoint.\n\nAn endpoint during stress testing indicates intact ligament fibers providing resistance. Absence of an endpoint implies complete disruption of the ligament with no remaining structural restraint. Complete tears with no endpoint often require operative repair, especially if multiple ligaments are involved."
    difficulty: easy
    tags: [orthopedics, knee, collateral ligament, MCL, LCL, physical examination]
  - front: "What are the indications for operative vs. non-operative management of meniscal tears?"
    back: "Non-operative: unlocked, degenerative tears with osteoarthritis — ROM and strengthening. Operative: locked knee (surgical emergency with inability to fully extend), or failed non-operative treatment — arthroscopic repair or partial meniscectomy.\n\nA locked knee due to a displaced meniscal fragment causing mechanical block is a surgical emergency. Meniscal repair is preferred in younger patients with peripheral, longitudinal tears with good blood supply. Partial meniscectomy is used when repair is not feasible."
    difficulty: medium
    tags: [orthopedics, knee, meniscal tear, operative indication, locked knee, meniscectomy]
  - front: "What are the conditions for meniscal repair vs. partial meniscectomy?"
    back: "Repair: peripheral tear with good vascular supply, longitudinal tear, adequate length. Partial meniscectomy: tears not amenable to repair (complex, degenerative, radial tears).\n\nThe peripheral third of the meniscus (red zone) has vascular supply and better healing potential. Central tears are avascular and heal poorly. Preserving meniscal tissue reduces long-term risk of post-traumatic osteoarthritis, so repair is preferred when feasible."
    difficulty: medium
    tags: [orthopedics, knee, meniscus, repair, meniscectomy, vascular supply]
  - front: "What is a Baker's cyst (popliteal cyst), and how does it differ between children and adults?"
    back: "Synovial fluid-filled mass in popliteal fossa between semimembranosus and medial head of gastrocnemius. Primary (congenital, no joint communication) in children; Secondary (acquired, joint communication from degenerative/inflammatory disease) in adults.\n\nPrimary cysts are benign and self-limiting in children. Secondary cysts in adults arise from joint pathology (e.g., meniscal tears, OA, RA) and resolve when the underlying cause is treated. Ultrasound is useful for diagnosis; MRI reserved for pre-surgical planning or uncertain diagnosis."
    difficulty: medium
    tags: [orthopedics, knee, Bakers cyst, popliteal cyst, etiology]
  - front: "How do you distinguish between patellar tendon rupture and quadriceps tendon rupture on clinical examination and lateral x-ray?"
    back: "Patellar tendon rupture: patella alta (high riding), palpable gap below patella. Quadriceps tendon rupture: patella baja (low riding), palpable gap above patella.\n\nWithout the quadriceps tendon anchoring the patella superiorly, it migrates inferiorly (baja). Without the patellar tendon anchoring the patella inferiorly, it migrates superiorly (alta). Both present with inability to extend knee; lateral x-ray is the key discriminating investigation."
    difficulty: medium
    tags: [orthopedics, patella, tendon rupture, patella alta, patella baja, x-ray]
  - front: "What is the indication for early vs. delayed surgical repair of quadriceps/patellar tendon ruptures?"
    back: "Complete ruptures with loss of extensor mechanism function require operative repair. Early repair (<6 weeks) has better outcomes. Delayed repair (>6 wk) is complicated by quadriceps contracture, patella migration, and adhesions.\n\nEarly surgical repair restores the extensor mechanism before tissue retraction and scarring make repair technically difficult. Delayed repair requires more complex procedures to address quadriceps contracture and patella migration, with worse functional outcomes."
    difficulty: medium
    tags: [orthopedics, patella, tendon rupture, surgical timing, extensor mechanism]
  - front: "What is the Schenck classification of knee dislocations?"
    back: "Based on pattern of ligamentous injury: Type 1 (single cruciate + single collateral), Type 2 (ACL + PCL), Type 3M (ACL + PCL + MCL), Type 3L (ACL + PCL + PLC), Type 4 (ACL + PCL + MCL + LCL), Type 5 (multiligamentous + periarticular fracture/dislocation).\n\nThe Schenck classification predicts severity of knee dislocation and associated neurovascular injury risk. Higher types indicate greater ligamentous disruption and higher likelihood of popliteal artery and peroneal nerve injury."
    difficulty: medium
    tags: [orthopedics, knee dislocation, Schenck classification, ligamentous injury]
  - front: "What is the most feared vascular complication of knee dislocation, and how is it assessed?"
    back: "Popliteal artery injury. Assessed with ABI (abnormal <0.9) and CT angiogram or formal arteriogram if abnormal vascular exam (abnormal pedal pulses or ABI <0.9).\n\nThe popliteal artery is tethered at the knee by the soleal arch and fibrous tunnels, making it vulnerable to traction or disruption during knee dislocation. Even a reduced knee dislocation with normal pulse can have intimal injury leading to delayed thrombosis — hence ABI screening for all."
    difficulty: hard
    tags: [orthopedics, knee dislocation, popliteal artery, vascular injury, ABI, angiography]
  - front: "What nerve is at risk in knee dislocation, and what is the resulting deficit?"
    back: "Common peroneal nerve; injury results in foot drop (inability to dorsiflex foot/toes).\n\nThe common peroneal nerve wraps around the fibular head and is vulnerable during posterolateral knee dislocations. Foot drop results from loss of dorsiflexion (deep peroneal branch) and eversion (superficial peroneal branch). Detailed neurologic assessment is mandatory."
    difficulty: easy
    tags: [orthopedics, knee dislocation, peroneal nerve, foot drop, neurological injury]
  - front: "What are the x-ray findings of knee osteoarthritis (LOSS mnemonic)?"
    back: "L — Loss of joint space; O — Osteophyte formation; S — Subchondral cyst formation; S — Subchondral sclerosis.\n\nThe LOSS mnemonic summarizes the classic radiographic findings of OA. Loss of joint space reflects cartilage destruction. Osteophytes represent bony overgrowth at joint margins. Subchondral changes (cysts and sclerosis) reflect remodeling from increased mechanical stress on exposed bone."
    difficulty: easy
    tags: [orthopedics, knee, osteoarthritis, x-ray, LOSS mnemonic, radiology]
  - front: "What is the treatment pyramid for knee osteoarthritis?"
    back: "Base: exercise, over-the-counter analgesics (acetaminophen, NSAIDs). Mid: intra-articular injections. Top: surgery (e.g., total knee arthroplasty).\n\nCanadian and international guidelines recommend a stepwise approach to knee OA. Non-pharmacologic measures (exercise, weight loss) are first-line. Pharmacologic therapy with acetaminophen and NSAIDs follows. Intra-articular steroids provide temporary relief. Surgery is reserved for refractory cases."
    difficulty: easy
    tags: [orthopedics, knee osteoarthritis, treatment, pharmacology, surgery]
  - front: "What x-ray view is used to evaluate the patellofemoral joint, and what is the technique?"
    back: "Skyline (tangential) view: knees flexed at 45° to view patellofemoral joint.\n\nThe skyline view profiles the patella within the femoral trochlear groove, allowing assessment of patellar tilt, trochlear dysplasia, and patellofemoral OA. It is essential for evaluating patellofemoral syndrome and patellar instability."
    difficulty: easy
    tags: [orthopedics, patella, skyline view, x-ray, patellofemoral syndrome]
  - front: "How do you distinguish a bipartite patella from a patellar fracture on x-ray?"
    back: "Bipartite patella: congenitally unfused ossification centers with smooth margins at the superolateral corner, typically bilateral. Patellar fracture: irregular margins, acute history, tenderness.\n\nBipartite patella occurs in ~2–3% of the population and is most commonly superolateral. The smooth, rounded edges and bilateral presentation distinguish it from acute fracture. Misdiagnosis can lead to inappropriate immobilization or unnecessary intervention."
    difficulty: medium
    tags: [orthopedics, patella, bipartite patella, patellar fracture, x-ray, differential diagnosis]
  - front: "What are the operative indications for patellar fracture fixation?"
    back: ">2 mm articular step-off, >3 mm fragment separation, comminuted fracture, disrupted extensor mechanism, or open fracture. Surgery: ORIF; if severely comminuted, partial or complete patellectomy.\n\nRestoration of articular congruity and extensor mechanism function are the primary goals. Displacement criteria (>2 mm step-off or >3 mm gap) reflect the threshold at which non-operative management leads to poor functional outcomes from malunion or extensor lag."
    difficulty: medium
    tags: [orthopedics, patella fracture, ORIF, operative indication, extensor mechanism]
  - front: "What is the Q-angle, and what threshold is associated with patellar dislocation risk?"
    back: "Q-angle: angle between a vertical line through the patella/tibial tuberosity and a line from ASIS to mid-patella. Risk threshold: ≥15° (males), ≥20° (females).\n\nIncreased Q-angle increases lateral vector force on the patella, predisposing to lateral dislocation. Female sex, miserable malalignment syndrome, patella alta, and ligamentous laxity are compounding risk factors. Measurement helps guide surgical planning (e.g., tibial tuberosity transfer)."
    difficulty: medium
    tags: [orthopedics, patella, Q-angle, patellar dislocation, biomechanics]
  - front: "What is the miserable malalignment syndrome and its relevance to patellar dislocation?"
    back: "Combination of femoral anteversion + genu valgum + external tibial torsion + pronated feet. Increases Q-angle and lateral patellar force, predisposing to recurrent patellar dislocation.\n\nThis alignment pattern is common in young females and significantly increases lateral patellar tracking forces. Each individual component increases Q-angle; combined they create a cumulative effect. Identifying this syndrome is important for surgical planning (tibial tuberosity transfer or femoral osteotomy)."
    difficulty: hard
    tags: [orthopedics, patella, malalignment syndrome, patellar dislocation, biomechanics]
  - front: "What is the J-sign in patellofemoral pathology?"
    back: "The patella moves laterally in an inverted-J pattern during extension, associated with patella alta, as the patella pops into the patellofemoral groove when engaging the trochlea early in flexion.\n\nThe J-sign reflects abnormal lateral patellar tracking. With patella alta, the patella sits superiorly outside the trochlear groove in extension and suddenly translates medially as it drops into the groove during early flexion. This is pathognomonic of patellofemoral instability."
    difficulty: medium
    tags: [orthopedics, patella, J-sign, patella alta, patellofemoral syndrome]
  - front: "What is the treatment for recurrent patellar dislocation?"
    back: "Operative: surgical tightening of medial capsule + lateral retinaculum release ± medial patellofemoral ligament (MPFL) reconstruction. If congenital deformity: tibial tuberosity transfer.\n\nRecurrent dislocation indicates failure of conservative measures (NSAIDs, activity modification, quadriceps strengthening). MPFL reconstruction is the most commonly performed procedure, restoring medial restraint. Tibial tuberosity transfer corrects excessive Q-angle from bony malalignment."
    difficulty: medium
    tags: [orthopedics, patella, patellar dislocation, MPFL, operative treatment]
  - front: "What is patellofemoral syndrome, and what finding is pathognomonic on physical examination?"
    back: "Syndrome of anterior knee pain from articular cartilage softening/erosion of the patella. Pathognomonic finding: pain with compression of the patella in the patellofemoral groove.\n\nPatellofemoral syndrome (runner's knee) involves chondromalacia patellae and abnormal patellar tracking. The theatre sign (pain with prolonged sitting/knee flexion) is characteristic. Compression of the patella into the groove reproduces retropattelar pain and is the defining clinical sign."
    difficulty: easy
    tags: [orthopedics, patella, patellofemoral syndrome, anterior knee pain, clinical features]
  - front: "What is the Schatzker classification of tibial plateau fractures?"
    back: "Type I: Lateral split; Type II: Lateral split-depression; Type III: Lateral pure depression; Type IV: Medial plateau; Type V: Bicondylar; Type VI: Bicondylar with metaphyseal/diaphyseal dissociation.\n\nThe Schatzker system guides treatment decisions. Types I–III (lateral) occur with lower energy; Type IV (medial) requires higher energy and risks vascular injury. Types V–VI are high-energy injuries with greater instability and worse prognosis. Higher Schatzker types are more likely to require ORIF."
    difficulty: medium
    tags: [orthopedics, tibial plateau fracture, Schatzker classification, knee]
  - front: "What are the operative indications for tibial plateau fracture fixation?"
    back: "Articular step-off >3 mm, condylar widening >5 mm, open fractures, neurovascular injury, significant varus/valgus instability (>15°). Treatment: ORIF often with bone grafting.\n\nArticular incongruity >3 mm leads to accelerated post-traumatic OA. Condylar widening >5 mm causes varus/valgus instability. Bone grafting restores the depressed articular fragment. Waiting 1–2 weeks is often necessary for soft tissue swelling to allow safe ORIF."
    difficulty: medium
    tags: [orthopedics, tibial plateau fracture, ORIF, operative indication, bone graft]
  - front: "What is the most common long bone fracture and open fracture?"
    back: "Tibial shaft fracture.\n\nThe tibia's subcutaneous anteromedial border and poor soft tissue coverage predispose it to open fractures. The high incidence reflects both its exposure to trauma and its limited surrounding muscle protection. Open tibial fractures are Gustilo grade–classified and require urgent I&D."
    difficulty: easy
    tags: [orthopedics, tibial shaft fracture, open fracture, epidemiology]
  - front: "What is the Danis-Weber classification of ankle fractures, and what is its basis?"
    back: "Based on fibular fracture level relative to the syndesmosis: Type A (infra-syndesmotic, below plafond), Type B (trans-syndesmotic, at plafond level), Type C (supra-syndesmotic, above plafond — frequently tears syndesmosis).\n\nThe position of the fibular fracture relative to the syndesmosis predicts syndesmotic stability and guides treatment. Type A is generally stable; Type B may be stable; Type C is unstable and almost always requires ORIF. Syndesmotic disruption leads to ankle mortise widening and talar subluxation."
    difficulty: medium
    tags: [orthopedics, ankle fracture, Danis-Weber classification, syndesmosis, fibula]
  - front: "What are the Ottawa Ankle Rules?"
    back: "X-rays required if ankle pain AND: bony tenderness at posterior tip/edge of lateral malleolus, OR posterior tip/edge of medial malleolus, OR inability to weight-bear immediately after injury AND in the ER (4 steps). Sensitivity nearly 100%.\n\nThe Ottawa Ankle Rules are a validated clinical decision tool developed to reduce unnecessary ankle x-rays. They have ~100% sensitivity for clinically significant fractures, with moderate specificity. They apply to adults and older children; not validated for those under age 6."
    difficulty: easy
    tags: [orthopedics, ankle, Ottawa Ankle Rules, fracture, clinical decision tool]
  - front: "What are the operative indications for ankle fractures?"
    back: "Fracture-dislocation; most Danis-Weber Type B and all Type C; talar displacement; displaced isolated medial or lateral malleolar fracture; trimalleolar fractures; displaced/large posterior malleolar fractures; persistent medial clear space widening despite closed reduction; open fracture/open joint. Treatment: ORIF with plates and screws.\n\nStability of the ankle mortise determines operative vs. non-operative management. Talar displacement risks post-traumatic arthritis. Medial clear space widening (>4 mm on mortise view) indicates syndesmotic disruption requiring surgical stabilization."
    difficulty: medium
    tags: [orthopedics, ankle fracture, ORIF, operative indication, ankle mortise]
  - front: "What patient population is at highest risk of wound complications after ankle ORIF?"
    back: "Patients with diabetes mellitus (DM), particularly with concomitant peripheral neuropathy — risk of poor wound healing and deep infections up to 20%.\n\nDiabetic patients have impaired tissue healing, microvascular disease, and reduced immune response, all of which increase infection risk after ankle surgery. Peripheral neuropathy compounds this by masking early wound complications. Careful perioperative optimization and close wound monitoring are essential."
    difficulty: easy
    tags: [orthopedics, ankle fracture, ORIF, diabetes, wound complications, infection]
  - front: "What is the medial ligament complex of the ankle, and what injury mechanism causes it?"
    back: "Deltoid ligament: comprised of anterior tibiotalar, tibiocalcaneal, posterior tibiotalar, and tibionavicular ligaments. Injured by eversion; usually avulses medial/posterior malleolus and strains syndesmosis.\n\nThe deltoid ligament is the primary medial stabilizer of the ankle and resists eversion and external rotation. It is rarely torn in isolation — eversion injury more commonly causes medial or posterior malleolar avulsion. Isolated deltoid tears can allow talar shift without bony fracture."
    difficulty: medium
    tags: [orthopedics, ankle, deltoid ligament, medial ligament, eversion injury]
  - front: "What is the lateral ligament complex of the ankle, which is most commonly injured, and what injury mechanism?"
    back: "Anterior talofibular ligament (ATFL), calcaneofibular (CFL), and posterior talofibular (PTFL). Inversion mechanism; >90% of ankle sprains. ATFL most commonly injured (especially with plantarflexed ankle).\n\nATFL is the weakest of the three and is the primary restraint in plantar flexion. Inversion in plantarflexion (common mechanism in sports) places maximum stress on ATFL. Grading: Grade I (microscopic tears) to Grade III (complete tears). RICE and physiotherapy for most; surgery for chronic instability."
    difficulty: easy
    tags: [orthopedics, ankle sprain, lateral ligament, ATFL, inversion injury]
  - front: "What is the treatment of ankle lateral ligament sprains by grade?"
    back: "Grade I (microscopic): RICE (rest, ice, compression, elevation). Grade II (macroscopic): strap/aircast up to a few weeks + NSAIDs + physiotherapy (strengthening and proprioceptive retraining). Grade III (complete): below-knee walking boot 4–6 weeks + NSAIDs + physiotherapy. Surgery: if chronic symptomatic instability.\n\nThe Broström repair (± augmentation) is the surgical option for chronic lateral ankle instability failing conservative treatment. Proprioceptive retraining is critical to prevent recurrence by restoring neuromuscular control. Most Grade III tears heal functionally with conservative management."
    difficulty: medium
    tags: [orthopedics, ankle sprain, treatment, lateral ligament, rehabilitation]
  - front: "What is the blood supply of the talus, why is it clinically important, and what is the complication of displaced talar fractures?"
    back: "Tenuous blood supply running distal to proximal along the talar neck. Displaced talar neck fractures risk disruption of this supply. Complication: avascular necrosis (AVN) — ~30% risk with displaced fractures.\n\nThe talus receives its blood supply primarily through branches entering the inferior and posterior neck, running proximal to distal. Displacement tears these vessels. AVN of the talar body leads to collapse, severe pain, and post-traumatic subtalar arthritis. Early ORIF minimizes AVN risk by restoring blood flow."
    difficulty: hard
    tags: [orthopedics, talar fracture, avascular necrosis, blood supply, talar neck]
  - front: "What is the most common tarsal fracture, what mechanism causes it, and what spinal injury must be ruled out?"
    back: "Calcaneal fracture (most common tarsal fracture). Mechanism: high-energy axial loading (fall from height onto heels, MVA). 10% associated with thoracic or lumbar compression fractures — always rule out spine injury.\n\nThe force transmitted through the heel during a fall from height can axially load the spine. 75% of calcaneal fractures are intra-articular (subtalar joint). The association with spinal fractures mandates imaging of the thoracolumbar spine when calcaneal fractures are diagnosed."
    difficulty: medium
    tags: [orthopedics, calcaneal fracture, tarsal fracture, spinal injury, axial loading]
  - front: "What are the four key treatment principles for calcaneal fractures?"
    back: "1. Avoid wound complications (10–25% risk). 2. Restore articular congruity. 3. Restore normal calcaneal width and height. 4. Maximum functional recovery may take longer than 12 months.\n\nThe calcaneus is the largest tarsal bone and critical for hindfoot mechanics. Comminuted intra-articular fractures are challenging to manage. The lateral extensile incision used for ORIF has high wound complication rates. Non-operative management is often preferred in elderly or patients with poor soft tissue."
    difficulty: medium
    tags: [orthopedics, calcaneal fracture, treatment principles, wound complications, ORIF]
  - front: "What is the mortise view of the ankle, how is it obtained, and what should it show?"
    back: "Ankle at 15° internal rotation. Gives a true view of the ankle joint. The joint space should be symmetric with no talar tilt; used to detect medial clear space widening indicating syndesmotic disruption.\n\nThe mortise view profiles all three articular surfaces of the ankle (medial, superior, lateral) in a single projection. Medial clear space >4 mm or asymmetric joint space suggests syndesmotic disruption or deltoid ligament injury with talar shift, indicating operative instability."
    difficulty: easy
    tags: [orthopedics, ankle, mortise view, x-ray, syndesmosis, talar tilt]
  - front: "What x-ray view is used to evaluate talar fractures and what is its technique?"
    back: "Canale view: foot in maximum equinus with 15° of pronation, beam angled 75° cephalad. Best for evaluating talar neck fractures.\n\nThe Canale view provides a profile of the talar neck without superimposition and is the standard view for assessing displacement of talar neck fractures. CT is also obtained for preoperative planning and to assess ipsilateral foot injuries (up to 88% incidence)."
    difficulty: medium
    tags: [orthopedics, talar fracture, Canale view, x-ray, radiology]
  - front: "In a high-energy fall from a height, what triad of injuries should be suspected?"
    back: "Calcaneal fractures + talar fractures + thoracolumbar spine compression fractures (axial loading injury).\n\nAxial loading transmitted from the heel through the limb to the spine can cause concurrent calcaneal, talar, and spinal fractures. The Don Juan or Lover's fracture (bilateral calcaneal fractures ± spinal injuries) is the classic presentation. Full trauma assessment and spinal imaging are mandatory."
    difficulty: medium
    tags: [orthopedics, calcaneal fracture, talar fracture, spinal fracture, axial loading, polytrauma]
  - front: "What is the role of anterior drawer and talar tilt tests in ankle evaluation?"
    back: "Anterior drawer: examiner stabilizes tibia and displaces foot anteriorly with ankle in neutral/plantarflexion — tests ATFL integrity. Talar tilt: foot stressed in inversion, angle of talar rotation evaluated — tests CFL and ATFL integrity.\n\nThe anterior drawer test assesses ATFL, the primary lateral ankle restraint. Excessive anterior translation indicates ATFL rupture. The talar tilt test assesses the combined lateral complex (ATFL + CFL); excessive tilt indicates complete lateral complex tear. Both help grade ankle sprain severity."
    difficulty: medium
    tags: [orthopedics, ankle, anterior drawer, talar tilt, physical examination, ATFL]
  - front: "What are the risk factors for knee osteoarthritis?"
    back: "Age, genetics, obesity, and female sex.\n\nKnee OA is a multifactorial degenerative joint disease. Obesity increases mechanical load on cartilage. Female sex is associated with lower cartilage thickness and hormonal influences. Genetics account for ~50% of OA risk. Previous injury and occupational loading are additional Canadian-relevant risk factors."
    difficulty: easy
    tags: [orthopedics, knee osteoarthritis, risk factors, epidemiology]
  - front: "What is the treatment for dislocated knee initially and when is emergent surgery indicated?"
    back: "Initial: urgent closed reduction and immobilization. Emergent surgery: vascular injury, open injury, irreducible or grossly unstable dislocation, compartment syndrome. Ligament reconstruction is typically delayed.\n\nKnee dislocation is a limb-threatening emergency due to popliteal artery injury risk. Closed reduction is performed immediately. Vascular repair takes priority. Compartment syndrome may develop even after reduction. Ligament reconstruction is staged after soft tissue recovery to optimize outcomes."
    difficulty: hard
    tags: [orthopedics, knee dislocation, emergent surgery, treatment, compartment syndrome]
  - front: "What are the most common primary tumours that metastasize to bone in adults?"
    back: "Breast and prostate (majority); also lung, thyroid, and kidney.\n\nBone metastases are the most common cause of bone lesions in adults >40 yr. The mnemonic 'BLT with a Kosher Pickle' (Breast, Lung, Thyroid, Kidney, Prostate) captures the five most common primaries. Prostate is characteristically osteoblastic; most others are osteolytic."
    difficulty: easy
    tags: [bone metastases, orthopedic oncology, osteolytic, osteoblastic]
  - front: "What type of bone lesion does prostate cancer metastasis characteristically produce, and how does it differ from other metastases?"
    back: "Osteoblastic (sclerotic) lesions; most other metastases are osteolytic.\n\nProstate cancer stimulates new bone formation, producing dense sclerotic lesions on imaging. In contrast, most metastases (breast, lung, kidney, thyroid) are osteolytic — destroying existing bone. This distinction is radiographically and clinically important."
    difficulty: easy
    tags: [bone metastases, prostate cancer, osteoblastic, osteolytic]
  - front: "What are the clinical features of bone metastases?"
    back: "Mechanical pain and/or night pain, pathological fracture, hypercalcemia.\n\nBone metastases can cause pain that is worse with activity (mechanical) and also pain at rest or at night (unlike degenerative pain). Hypercalcemia results from osteolytic destruction and is a metabolic emergency requiring urgent treatment."
    difficulty: easy
    tags: [bone metastases, hypercalcemia, pathological fracture]
  - front: "What imaging is used for musculoskeletal involvement vs. suspected spinal involvement in bone metastases?"
    back: "Bone scan for MSK involvement; MRI if suspected spinal involvement.\n\nBone scan is sensitive for skeletal metastases throughout the body. MRI is preferred for spinal involvement because it better delineates cord compression, epidural disease, and soft-tissue extension — critical for surgical and radiation planning."
    difficulty: easy
    tags: [bone metastases, bone scan, MRI, imaging]
  - front: "What is Mirel's Criteria and what score indicates prophylactic surgical fixation for bone metastases?"
    back: "A scoring system for impending fracture risk; score >8 indicates prophylactic internal fixation.\n\nMirel's Criteria scores four variables: site (upper arm=1, lower extremity=2, peritrochanteric=3), pain (mild=1, moderate=2, severe=3), lesion type (blastic=1, mixed=2, lytic=3), and size (<1/3=1, 1/3–2/3=2, >2/3=3). A score >8 indicates high fracture risk requiring prophylactic fixation."
    difficulty: medium
    tags: [Mirels criteria, bone metastases, impending fracture, prophylactic fixation]
  - front: "For Mirel's Criteria, what are the four variables scored, and what are their possible values?"
    back: "Site (upper arm=1, lower extremity=2, peritrochanteric=3), pain (mild=1, moderate=2, severe=3), lesion type (blastic=1, mixed=2, lytic=3), size (<1/3=1, 1/3–2/3=2, >2/3 diameter=3).\n\nEach variable is scored 1–3; maximum total is 12. A score >8 identifies lesions with high impending fracture risk needing prophylactic internal fixation, while scores ≤7 are generally managed conservatively with bisphosphonates and pain control."
    difficulty: medium
    tags: [Mirels criteria, impending fracture, bone metastases]
  - front: "What is the standard preoperative antibiotic prophylaxis used in orthopedic surgery in Canada?"
    back: "Cefazolin (Ancef) 1–2 g IV/IM q8h; first-generation cephalosporin.\n\nCefazolin provides excellent gram-positive coverage (Staphylococcus) relevant to skin flora at surgical sites. Cross-reactivity with penicillin allergy is <10%; however, alternative antibiotics for penicillin allergy carry significantly higher rates of surgical site infection (SSI) and prosthetic joint infection (PJI)."
    difficulty: easy
    tags: [antibiotic prophylaxis, cefazolin, surgical site infection, orthopedics]
  - front: "What are the reversal agents for dabigatran and for rivaroxaban/apixaban?"
    back: "Dabigatran: idarucizumab; rivaroxaban and apixaban: andexanet alfa.\n\nIdarucizumab (Praxbind) is a monoclonal antibody fragment that specifically binds and neutralizes dabigatran. Andexanet alfa (Ondexxya) is a recombinant factor Xa decoy protein that reverses anti-Xa activity of rivaroxaban and apixaban. These are important for emergency reversal in perioperative bleeding."
    difficulty: medium
    tags: [anticoagulation reversal, dabigatran, rivaroxaban, apixaban, idarucizumab, andexanet alfa]
  - front: "What is the evidence for aspirin vs. LMWH for DVT prophylaxis after total joint arthroplasty?"
    back: "ASA 81 mg BID shows similar efficacy to LMWH and rivaroxaban with a better side effect profile (lower hematoma/stiffness rates in TJA).\n\nRecent Canadian evidence supports ASA as a reasonable DVT prophylaxis option post-TJA given comparable thromboprophylactic efficacy and reduced risk of wound hematoma and joint stiffness compared to more potent anticoagulants, which is particularly relevant in the arthroplasty population."
    difficulty: medium
    tags: [DVT prophylaxis, aspirin, LMWH, total joint arthroplasty, anticoagulation]
  - front: "What is the role of tranexamic acid (TXA) in orthopedic surgery?"
    back: "Reduces perioperative blood loss and transfusion rates (IV or topical); no evidence of increased thromboembolic events.\n\nTXA is an antifibrinolytic agent (10–20 mg/kg IV or topical application to wound). Multiple meta-analyses and RCTs support its use in arthroplasty and other major orthopedic procedures to significantly reduce blood loss and transfusion requirements without increasing VTE risk."
    difficulty: easy
    tags: [tranexamic acid, TXA, blood loss, orthopedic surgery, antifibrinolytic]
  - front: "What is the maximum safe daily dose of acetaminophen, and what is the concern at higher doses?"
    back: "Max dose 4000 mg/day; higher doses are hepatotoxic in susceptible individuals.\n\nAcetaminophen 1000 mg PO q6–8h is a cornerstone of multimodal analgesia in orthopedics. The 4000 mg/day limit applies to standard adults; lower limits (2000 mg/day) are used in alcoholics and patients with hepatic disease. Hepatotoxicity from overdose is the leading cause of acute liver failure in Canada."
    difficulty: easy
    tags: [acetaminophen, analgesia, hepatotoxicity, dose]
  - front: "What are the two NSAIDs used specifically for prophylaxis of heterotopic ossification (HO) after total hip arthroplasty?"
    back: "Celecoxib (COX-2 inhibitor) and indomethacin (with misoprostol).\n\nHeterotopic ossification (HO) is ectopic bone formation around the hip after THA. NSAIDs inhibit prostaglandin-mediated osteoblast differentiation. Indomethacin 25 mg TID is traditionally used; celecoxib 200 mg BID is an alternative with better GI tolerance. Indomethacin is typically combined with misoprostol to reduce GI side effects."
    difficulty: medium
    tags: [heterotopic ossification, celecoxib, indomethacin, THA, NSAID]
  - front: "What were the conclusions of the HEALTH trial (NEJM 2019) regarding total hip arthroplasty vs. hemiarthroplasty for displaced femoral neck fractures?"
    back: "No significant difference in secondary procedures or function over 24 months; hip instability higher with THA (4.7% vs. 2.4%).\n\nThe HEALTH trial randomized 1495 patients >50 yr with displaced femoral neck fractures to THA vs. hemiarthroplasty. Secondary procedures occurred in 7.9% vs. 8.3% (NS). While function was modestly better with THA, instability was higher (4.7% THA vs. 2.4% hemiarthroplasty). This informs shared decision-making."
    difficulty: medium
    tags: [HEALTH trial, hip arthroplasty, hemiarthroplasty, femoral neck fracture, landmark trial]
  - front: "What did the PROFHER trial (JAMA 2015) conclude about surgical vs. non-surgical management of displaced proximal humerus fractures?"
    back: "No significant difference in Oxford Shoulder Score over 2 years; surgery not supported for displaced proximal humerus fractures involving the surgical neck.\n\nThe PROFHER RCT (n=260) found no meaningful difference in shoulder function at 2 years between surgical and non-surgical management (39.07 vs. 38.32 Oxford Shoulder Score). This landmark trial shifted practice toward non-operative management for many proximal humerus fractures."
    difficulty: medium
    tags: [PROFHER trial, proximal humerus fracture, surgical vs non-surgical, landmark trial]
  - front: "What did the FLOW trial (NEJM 2015) establish about wound irrigation for open fractures?"
    back: "Irrigation pressure did not affect reoperation rates; castile soap had higher reoperation rates than normal saline; low-pressure normal saline irrigation is recommended.\n\nFLOW (n=2551) compared high, low, and very low pressure with castile soap vs. saline. No difference in reoperation rates across pressures. The soap group had significantly higher reoperation (14.8% vs. 11.6%, HR 1.32, p=0.01). Low-pressure saline irrigation is therefore recommended standard of care."
    difficulty: medium
    tags: [FLOW trial, open fracture, wound irrigation, landmark trial]
  - front: "What did the landmark RCT by Moseley et al. (NEJM 2002) conclude about arthroscopic surgery for knee osteoarthritis?"
    back: "Arthroscopic debridement and lavage are no better than placebo surgery for pain and function in knee OA.\n\nThis pivotal RCT (n=180) randomized patients with knee OA to arthroscopic debridement, arthroscopic lavage, or placebo surgery. No statistically or clinically meaningful differences in pain or function were found at any time point. This led to significant reduction in use of knee arthroscopy for OA."
    difficulty: medium
    tags: [arthroscopy, knee osteoarthritis, placebo surgery, landmark trial]
  - front: "What did the PRONOMOS trial (NEJM 2020) show about rivaroxaban vs. enoxaparin for VTE prophylaxis in non-major orthopedic surgery?"
    back: "Rivaroxaban was superior to enoxaparin: major VTE in 0.2% vs. 1.1% (risk ratio 0.25); no significant difference in bleeding.\n\nPRONOMOS (n=3604) was a non-inferiority trial in lower-limb non-major orthopedic surgery patients. Rivaroxaban demonstrated superiority to enoxaparin in preventing major VTE during the immobilization period, without increased bleeding risk, supporting its use in this patient population."
    difficulty: medium
    tags: [PRONOMOS trial, rivaroxaban, enoxaparin, VTE prophylaxis, landmark trial]
  - front: "What did the OVIVA trial (NEJM 2019) demonstrate about oral vs. IV antibiotics for bone and joint infections?"
    back: "Oral antibiotics were non-inferior to IV antibiotics for complex orthopedic infections in the first 6 weeks (treatment failure 13.2% vs. 14.6%).\n\nOVIVA (n=1054) randomized patients with acute or chronic bone/joint infections to oral vs. IV antibiotics for the first 6 weeks. The difference in risk was -1.4% (95% CI -5.6 to 2.9), meeting non-inferiority criteria. This supports transitioning to oral antibiotics earlier, reducing IV line complications and hospitalization."
    difficulty: medium
    tags: [OVIVA trial, oral antibiotics, IV antibiotics, osteomyelitis, bone infection, landmark trial]
  - front: "What is the treatment of multiple myeloma?"
    back: "Multiagent chemotherapy + stem cell transplantation + bisphosphonates; surgery for impending fractures (debulking, internal fixation).\n\nMultiple myeloma is a plasma cell malignancy producing osteolytic lesions via osteoclast activation. Bisphosphonates (e.g., zoledronic acid) reduce skeletal-related events. 5-year survival is approximately 52% and improves with younger age. Orthopedic management of bone disease follows standard principles including Mirel's criteria for prophylactic fixation."
    difficulty: medium
    tags: [multiple myeloma, chemotherapy, stem cell transplant, bisphosphonates, osteolytic lesions]
