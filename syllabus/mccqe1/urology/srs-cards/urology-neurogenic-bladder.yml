# Urology Neurogenic Bladder (Urology) - generated from srs-mccqe1
cards:
  - front: "What is neurogenic bladder and what are the main categories of neurogenic lower urinary tract dysfunction?"
    back: "Neurogenic bladder = bladder dysfunction due to innervation deficiency. Categories: 1. Neurogenic detrusor overactivity (NDO) — lesion above PMC (stroke, tumour, MS, Parkinson's). 2. Detrusor sphincter dyssynergia (DSD) — suprasacral spinal cord lesion. 3. Detrusor atony/areflexia — sacral cord or peripheral nerve lesion (DM, disc herniation, trauma). 4. Peripheral autonomic neuropathy (DM).\n\nThe level of neurological lesion determines the pattern of dysfunction: suprapontine lesions cause NDO without DSD; suprasacral spinal lesions cause DSD; sacral/peripheral lesions cause flaccid atonic bladder. Treatment is tailored accordingly."
    difficulty: medium
    tags: [neurogenic bladder, DSD, NDO, detrusor overactivity, PMC, spinal cord injury]
  - front: "What is detrusor sphincter dyssynergia (DSD) and what lesion causes it?"
    back: "DSD is loss of coordination between the detrusor and urethral sphincter — detrusor contracts against a closed sphincter (or vice versa). Caused by suprasacral spinal cord lesion (e.g., trauma, MS, arteriovenous malformation, transverse myelitis).\n\nDSD results in high bladder pressures, which can cause hydronephrosis and renal deterioration if untreated. The pontine micturition centre coordinates normal voiding; suprasacral lesions interrupt this coordination while preserving the reflex arc."
    difficulty: medium
    tags: [DSD, neurogenic bladder, spinal cord injury, PMC, detrusor]
  - front: "What are the goals and treatment options for neurogenic bladder?"
    back: "Goals: prevent renal deterioration, prevent UTI, achieve social continence. Treatment: CIC (if unable to void), antimuscarinics (bladder hyperactivity), botulinum toxin injection into detrusor (if refractory), augmentation cystoplasty, urinary diversion (severe cases). Flaccid bladder: CIC.\n\nClean intermittent catheterization (CIC) is the cornerstone of management for retention. Botulinum toxin A injected into the detrusor muscle effectively suppresses neurogenic detrusor overactivity for 6–12 months."
    difficulty: medium
    tags: [neurogenic bladder, CIC, botulinum toxin, augmentation cystoplasty, urinary diversion]
  - front: "What is 'spinal shock' and how does it affect the bladder?"
    back: "Spinal shock initially manifests as an atonic (flaccid) bladder immediately after acute spinal cord injury, regardless of lesion level.\n\nSpinal shock is a transient state of areflexia that occurs after acute spinal cord injury. The bladder becomes atonic and requires CIC during this phase. As spinal shock resolves (weeks to months), the expected pattern of dysfunction (NDO ± DSD for suprasacral injuries) emerges."
    difficulty: medium
    tags: [spinal shock, neurogenic bladder, spinal cord injury, atonic bladder]
  - front: "What is the role of urodynamic studies in neurogenic bladder evaluation?"
    back: "Urodynamics assesses: uroflowmetry (flow rate/pattern), filling cystometrogram (CMG: capacity, compliance, detrusor overactivity), voiding CMG/pressure-flow study (contractility, outlet obstruction), video study (bladder/urethra visualization), EMG (diagnosis of DSD).\n\nUrodynamics is essential in moderate/high-risk neurogenic bladder (spinal cord injury, spina bifida, MS) to detect harmful bladder pressures, guide treatment, and monitor for upper tract deterioration. Renal ultrasound and renal profile are obtained in all these patients."
    difficulty: medium
    tags: [urodynamics, neurogenic bladder, CMG, DSD, uroflowmetry, EMG]
