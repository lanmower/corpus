  witness: 'theme.js: glyphs map replaced double-decoded UTF-8 (â˜€ etc) with ASCII markers {light:''[ ]'',dark:''[*]'',auto:''[~]'',contrast:''[#]''}; comment/aria em-dash mojibake -> ''--''. Post-fix scan: 0 mojibake lines remaining in theme.js.'
