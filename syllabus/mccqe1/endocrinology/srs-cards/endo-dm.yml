  - front: "In UKPDS 34, how did metformin compare to sulfonylureas/insulin for intensive glucose control in overweight T2DM patients?"
    back: "Metformin was superior to sulfonylureas or insulin for any diabetes-related endpoint (p=0.0034), all-cause mortality (p=0.021), and stroke (p=0.032)\n\nUKPDS 34 showed metformin reduced diabetes-related endpoints by 32%, diabetes-related death by 42%, and all-cause mortality by 36% in overweight T2DM patients, with less weight gain and hypoglycemia than sulfonylureas/insulin."
    difficulty: hard
    tags: [diabetes, T2DM, metformin, UKPDS, first-line-therapy, clinical-trial, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Which insulin regimen in the 4T Trial had the highest rate of patient withdrawal?"
    back: "Prandial insulin aspart (11.7% withdrawal rate)\n\nThe 4T Trial showed significant differences in withdrawal rates: 5.1% biphasic, 11.7% prandial, and 8.5% basal regimens (p=0.04)."
    difficulty: hard
    tags: [diabetes, T2DM, insulin, 4T-trial, clinical-trial, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "According to UKPDS 34, what were the HbA1c levels achieved with metformin vs conventional therapy?"
    back: "Metformin: 7.4%; Conventional: 8.0%\n\nPatients randomized to metformin achieved lower HbA1c (7.4% vs 8.0%) along with reduced risk of diabetes-related complications."
    difficulty: medium
    tags: [diabetes, T2DM, metformin, HbA1c, UKPDS, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In the 4T Trial comparing insulin regimens in T2DM, which insulin regimen provided the best glycemic control over 3 years?"
    back: "Basal insulin detemir - it had better HbA1c control, fewer hypoglycemic events, and less weight gain compared to prandial and biphasic regimens\n\nThe 4T Trial (NEJM 2009) randomized 708 T2DM patients to thrice-daily prandial, twice-daily biphasic, or once-daily basal insulin. Basal had the least weight gain and fewest severe hypoglycemic events."
    difficulty: medium
    tags: [diabetes, insulin, clinical-trials, endocrinology, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In UKPDS 34, how did metformin compare to sulfonylurea or insulin for intensive glucose control in overweight T2DM?"
    back: "Metformin was superior - it reduced risk of any diabetes-related endpoint by 32% (P=0.002), diabetes-related death by 42% (P=0.017), and all-cause mortality by 36% (P=0.011), with less weight gain and hypoglycemia\n\nUKPDS 34 (Lancet 1998) showed metformin is preferred first-line intensive therapy for overweight T2DM patients, with better outcomes than sulfonylureas or insulin."
    difficulty: hard
    tags: [diabetes-type-2, metformin, sulfonylurea, clinical-trials, endocrinology, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was unique about the 4T Trial's patient population regarding prior therapy?"
    back: "Patients were on maximal metformin and sulfonylurea therapy, not on insulin or thiazolidinedione therapy before randomization\n\nThe 4T Trial enrolled 708 T2DM patients failing oral therapy to compare different insulin intensification strategies."
    difficulty: easy
    tags: [diabetes, insulin, clinical-trials, endocrinology, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In the DCCT, what were the two treatment arms compared?"
    back: "Intensive therapy: 3+ daily insulin injections or insulin pump with BG monitoring QID and strict targets; Conventional therapy: 1-2 insulin injections daily with daily BG monitoring\n\nThe DCCT (NEJM 1993) investigated whether maintaining normal blood glucose reduces complications in T1DM."
    difficulty: easy
    tags: [diabetes-type-1, insulin-therapy, clinical-trials, endocrinology, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Why is metformin considered first-line therapy for overweight T2DM according to UKPDS 34?"
    back: "It decreases risk of diabetes-related endpoints with less weight gain and hypoglycemia than sulfonylureas or insulin\n\nMetformin was superior to sulfonylureas or insulin for any diabetes-related endpoint (P=0.0034), all-cause mortality (P=0.021), and stroke (P=0.032)."
    difficulty: hard
    tags: [diabetes, t2dm, metformin, first-line, clinical-trials, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the HbA1c target in the intensive glucose control arms of UKPDS?"
    back: "FPG <6 mmol/L\n\nBoth UKPDS 33 and UKPDS 34 used FPG <6 mmol/L as the target for intensive glucose control, compared to conventional target of <15 mmol/L without symptoms."
    difficulty: easy
    tags: [diabetes, t2dm, glucose-targets, fpg, clinical-trials, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In overweight T2DM patients, how does metformin compare to sulfonylureas/insulin for diabetes-related endpoints?"
    back: "Metformin was superior - 32% risk reduction for any diabetes-related endpoint, 42% for diabetes-related death, 36% for all-cause mortality\n\nUKPDS 34 showed metformin in overweight T2DM patients had better outcomes than sulfonylureas/insulin with less weight gain and hypoglycemia."
    difficulty: hard
    tags: [T2DM, metformin, UKPDS, overweight, first-line therapy, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What did UKPDS 33 find about intensive glucose control in newly diagnosed T2DM?"
    back: "Intensive therapy with sulfonylurea or insulin reduced risk of any diabetes-related endpoint by 12% (P=0.029) and improved HbA1c, but did not significantly reduce diabetes-related death (10%, P=0.34) or all-cause mortality (6%, P=0.44).\n\nUKPDS 33 randomized 3867 newly diagnosed T2DM patients to intensive treatment (target FPG <6 mmol/L) vs. conventional treatment (target FPG <15 mmol/L). Benefits were primarily microvascular, not macrovascular."
    difficulty: hard
    tags: [diabetes, T2DM, intensive-therapy, sulfonylurea, clinical-trials, UKPDS, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "How did metformin compare to sulfonylureas and insulin in overweight T2DM patients (UKPDS 34)?"
    back: "Metformin was superior to sulfonylureas and insulin for any diabetes-related endpoint (P=0.0034), all-cause mortality (P=0.021), and stroke (P=0.032), with less weight gain and hypoglycemia.\n\nUKPDS 34 randomized 753 overweight T2DM patients to metformin vs. conventional therapy. Metformin reduced HbA1c (7.4% vs 8.0%), diabetes-related endpoints by 32% (P=0.002), diabetes-related death by 42% (P=0.017), and all-cause mortality by 36% (P=0.011)."
    difficulty: hard
    tags: [diabetes, T2DM, metformin, first-line-therapy, clinical-trials, UKPDS, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the primary outcome measure in the 4T trial?"
    back: "Three-year HbA1c levels\n\nThe 4T Trial studied three insulin regimens over 3 years in 708 T2DM patients, with HbA1c as the primary outcome measure comparing prandial, biphasic, and basal insulin regimens."
    difficulty: easy
    tags: [diabetes, insulin, HbA1c, clinical-trials, T2DM, 4T-trial, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was unique about the UKPDS 34 findings regarding different intensive therapy regimens?"
    back: "Among intensive glucose control regimens, metformin was superior to sulfonylureas or insulin for any diabetes-related endpoint, all-cause mortality, and stroke\n\nUKPDS 34 found that metformin provided better outcomes than sulfonylurea or insulin-based intensive therapy in overweight T2DM patients, with less weight gain and hypoglycemia."
    difficulty: hard
    tags: [diabetes, T2DM, metformin, sulfonylurea, insulin, clinical-trials, UKPDS, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In the 4T trial, which insulin regimen had the most serious adverse effects?"
    back: "Biphasic insulin (insulin aspart) had the most serious adverse effects\n\nThe 4T trial found that the biphasic insulin arm had the most serious adverse effects, while the basal arm had the fewest severe hypoglycemic events per patient year."
    difficulty: medium
    tags: [diabetes, insulin, biphasic-insulin, adverse-effects, clinical-trials, T2DM, 4T-trial, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What proportion of patients reached HbA1c <6.5% or <7.0% in the biphasic arm of the 4T trial?"
    back: "A smaller proportion of patients reached HbA1c <6.5% or <7.0% in the biphasic arm compared to other arms\n\nThe 4T trial found that while there were no significant differences in median HbA1c between all three arms from years 1-3, the biphasic arm had a smaller proportion of patients achieving target HbA1c levels."
    difficulty: medium
    tags: [diabetes, insulin, HbA1c, clinical-trials, T2DM, 4T-trial, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was unique about metformin in UKPDS 34 compared to sulfonylureas/insulin?"
    back: "Metformin reduced risk of diabetes-related endpoints with less weight gain and hypoglycemia\n\nUKPDS 34 showed metformin was superior to sulfonylureas or insulin for any diabetes-related endpoint, all-cause mortality, and stroke in overweight T2DM patients."
    difficulty: hard
    tags: [Diabetes, T2DM, Clinical Trial, UKPDS, Metformin, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Why is metformin preferred over sulfonylureas or insulin for intensive glucose control in overweight T2DM?"
    back: "Metformin reduced diabetes-related endpoints by 32% (P=0.002), diabetes-related death by 42% (P=0.017), and all-cause mortality by 36% (P=0.011), with less weight gain and hypoglycemia than sulfonylureas/insulin.\n\nUKPDS 34 (Lancet 1998) showed metformin was superior to sulfonylureas or insulin for any diabetes-related endpoint (P=0.0034), all-cause mortality (P=0.021), and stroke (P=0.032) in overweight T2DM patients."
