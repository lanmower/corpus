# General (Orthopedics) - generated from srs-mccqe1
cards:
  - front: "What are the 6 Ps of compartment syndrome?"
    back: "Pain out of proportion, Pain worse with passive stretch, Paresthesia/hypoesthesia, Pallor, Polar (cold), Pulse discrepancies\n\nThe 6 Ps indicate advanced compartment syndrome - do not wait for all to be present before treating."
    difficulty: medium
    tags: [compartment syndrome, orthopedics, emergency medicine, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What nerve injuries are at risk with anterior shoulder dislocation?"
    back: "Axillary nerve (lateral aspect of shoulder) and Musculocutaneous nerve (extensor aspect of forearm)\n\nThese nerves are vulnerable during dislocation and reduction maneuvers."
    difficulty: medium
    tags: [shoulder dislocation, nerve injury, orthopedics, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are 'The 6 Ps' of compartment syndrome?"
    back: "Pain out of proportion, Pain worse with passive stretch, Paresthesia/hypoesthesia, Pallor, Polar (cold), Paralysis\n\nThe 6 Ps are clinical signs of compartment syndrome; however, presence of any indicates advanced disease as capillary perfusion pressure is only 30 mmHg."
    difficulty: medium
    tags: [orthopedics, compartment-syndrome, emergency-medicine, vascular, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What nerves are at risk in anterior shoulder dislocation?"
    back: "Axillary nerve (lateral aspect of shoulder) and musculocutaneous nerve (extensor aspect of forearm)\n\nThese nerves are commonly injured in shoulder dislocations and should be assessed as part of the neurovascular examination."
    difficulty: medium
    tags: [orthopedics, shoulder, dislocation, nerve-injury, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What imaging view confirms anterior shoulder dislocation?"
    back: "Lateral view showing humeral head anterior to glenoid\n\nThe lateral view is essential for confirming dislocation direction and guiding reduction technique."
    difficulty: medium
    tags: [orthopedics, shoulder, dislocation, imaging, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the immobilization position after anterior shoulder dislocation reduction?"
    back: "Internal rotation\n\nImmobilization in internal rotation helps maintain reduction and allows soft tissue healing."
    difficulty: easy
    tags: [orthopedics, shoulder, dislocation, treatment, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
