  - front: "What is the total cumulative dose goal for isotretinoin in acne treatment?"
    back: "120mg/kg over 16-20 weeks\n\nIsotretinoin is given at 0.5-1mg/kg/day to achieve a total cumulative dose of 120mg/kg, typically over 20-24 weeks. Treatment may be discontinued earlier if nodule count drops >70%."
    difficulty: medium
    tags: [dermatology, isotretinoin, acne, retinoid, dosing, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the total cumulative dose and typical duration of isotretinoin (Accutane®) for severe nodular acne?"
    back: "Total cumulative dose: 120mg/kg given over 16-20 weeks (0.5-1mg/kg/day); second course may be needed after 2 months; refractory cases may require >3 courses\n\nIsotretinoin is the most effective treatment for severe nodular/cystic acne. The 120mg/kg cumulative dose over 16-20 weeks typically achieves lasting remission."
    difficulty: easy
    tags: [isotretinoin, acne, dosing, systemic-therapy, teratogenic, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What conditions can cyclosporine also be effective for beyond psoriasis?"
    back: "Lichen planus, erythema multiforme, recalcitrant urticaria, recalcitrant atopic dermatitis\n\nCyclosporine's calcineurin inhibition makes it effective for various immune-mediated skin conditions beyond psoriasis, particularly those resistant to conventional therapy."
    difficulty: medium
    tags: [cyclosporine, lichen-planus, urticaria, off-label, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the three types of pain associated with herpes zoster?"
    back: "Pre-herpetic (pain before rash), synchronous (pain with rash), and post-herpetic neuralgia\n\nPost-herpetic neuralgia is a common complication, especially in older patients."
    difficulty: medium
    tags: [herpes zoster, shingles, dermatology, pain, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the dosing schedule and concentration for Calcipotriol (Dovonex®) in psoriasis treatment?"
    back: "0.005% cream, ointment, or scalp solution, apply BID for treatment; once daily for maintenance\n\nCalcipotriol is a vitamin D analog used topically for psoriasis. Maximum weekly dosage varies by age: >14yr = 100g/wk, 6-10yr = 50g/wk."
    difficulty: easy
    tags: [dermatology, psoriasis, topical therapy, calcipotriol, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What targeted therapy is indicated for BRAF V600E mutation-positive melanoma?"
