# Obstetric Emergencies (ObGyn) - generated from srs-mccqe1
cards:
  - front: "A 32-week pregnant woman has sudden painless vaginal bleeding. She is hemodynamically stable. What is the differential diagnosis and approach?"
    back: "Placenta previa (placenta overlying cervical os) most likely with painless bleeding — DO NOT perform digital vaginal exam; ultrasound to confirm; admit, cross-match, IV access\n\nSOGC guidelines: placenta previa presents with painless vaginal bleeding in the 2nd-3rd trimester. Transvaginal ultrasound is safe and preferred for diagnosis. Betamethasone if <34 weeks (lung maturity). Delivery by cesarean section."
    difficulty: hard
    tags: [placenta previa, antepartum hemorrhage, third trimester bleeding, SOGC, obgyn]
  - front: "A 34-week patient has sudden onset severe abdominal pain, rigid uterus, and vaginal bleeding. FHR shows late decelerations. What is the diagnosis and immediate management?"
    back: "Placental abruption (premature separation of placenta); emergent delivery — cesarean for fetal distress; resuscitate mother with IV fluids, blood products; watch for DIC\n\nSOGC guidelines: placental abruption is the most common cause of painful antepartum hemorrhage. Risk factors: hypertension, cocaine, trauma, prior abruption, smoking. Kleihauer-Betke test if Rh-negative (quantify fetal-maternal hemorrhage). DIC occurs in severe cases."
    difficulty: hard
    tags: [placental abruption, antepartum hemorrhage, fetal distress, DIC, obgyn]
  - front: "What are the SOGC criteria for diagnosing preeclampsia?"
    back: "New-onset hypertension (≥140/90 mmHg) after 20 weeks + ≥1 of: proteinuria (≥300 mg/24h), end-organ dysfunction (thrombocytopenia <100,000, AKI, elevated LFTs, pulmonary edema, new-onset headache/visual symptoms), or IUGR\n\nSOGC 2022 Hypertensive Disorders guidelines recommend using either proteinuria OR end-organ dysfunction (without proteinuria) to diagnose preeclampsia. Aspirin 100-162 mg/day started <16 weeks prevents preeclampsia in high-risk women."
    difficulty: medium
    tags: [preeclampsia, SOGC, hypertension in pregnancy, proteinuria, obgyn]
  - front: "A 38-week patient with preeclampsia has BP 168/110, headache, visual changes, and platelet count of 88,000. What is the management?"
    back: "Severe preeclampsia with features of severe disease; IV labetalol or hydralazine for acute BP control (target <160/110); IV magnesium sulfate for seizure prophylaxis; deliver\n\nSOGC guidelines: BP ≥160/110 in pregnancy requires urgent treatment to prevent maternal stroke. Magnesium sulfate is the treatment of choice for preeclampsia seizure prophylaxis (MAGPIE trial). Definitive treatment is delivery. HELLP syndrome (Hemolysis, Elevated LFTs, Low Platelets) is a severe variant."
    difficulty: hard
    tags: [severe preeclampsia, magnesium sulfate, labetalol, delivery, obgyn]
  - front: "What is eclampsia and how is it managed?"
    back: "Eclampsia: new onset grand mal seizure in preeclamptic patient; treat with IV magnesium sulfate (4-6g loading, then 1-2g/h maintenance), maintain airway, deliver after stabilization\n\nSOGC guidelines: MgSO4 is superior to diazepam and phenytoin for eclampsia. Monitor for MgSO4 toxicity: loss of deep tendon reflexes (first sign), respiratory depression (antidote: calcium gluconate 1g IV). Magnesium continues for 24-48h postpartum."
    difficulty: hard
    tags: [eclampsia, magnesium sulfate, seizure in pregnancy, SOGC, obgyn]
  - front: "What is postpartum hemorrhage (PPH) and what are the 4Ts?"
    back: "PPH: blood loss >500 mL (vaginal delivery) or >1000 mL (cesarean); 4Ts — Tone (uterine atony, most common 80%), Tissue (retained placenta), Trauma (lacerations), Thrombin (coagulopathy)\n\nSOGC Active Management of Third Stage Labour (AMTSL) guidelines: oxytocin 10 IU IM immediately after delivery reduces PPH. PPH management: uterine massage, oxytocin infusion, uterotonics (carboprost, misoprostol, tranexamic acid), repair lacerations, manual removal retained placenta, surgical/interventional options."
    difficulty: hard
    tags: [postpartum hemorrhage, 4Ts, uterine atony, oxytocin, SOGC, obgyn]
  - front: "A pregnant woman at 12 weeks has severe nausea, vomiting, and is hemodynamically stable. hCG is markedly elevated and uterus is larger than dates. Ultrasound shows a snowstorm pattern. What is the diagnosis?"
    back: "Hydatidiform mole (complete molar pregnancy); evacuate uterus by suction curettage, follow serial hCG until undetectable, contraception for 6-12 months, monitor for gestational trophoblastic neoplasia\n\nComplete mole: 46XX (both paternal), no fetal tissue, higher risk of gestational trophoblastic neoplasia (15-20%). Partial mole: triploid, some fetal tissue. Risk of malignant transformation: serial hCG monitoring. Rh-negative mothers: Rh immunoglobulin. Chest X-ray for metastases."
    difficulty: hard
    tags: [molar pregnancy, gestational trophoblastic disease, hCG, snowstorm, obgyn]
  - front: "What is the management of cord prolapse?"
    back: "Umbilical cord prolapse: immediately elevate presenting part manually (off cord), call for emergency C-section, position patient (knee-chest or Trendelenburg), do NOT push cord back in, fill bladder with 500 mL saline to elevate presenting part\n\nSOGC cord prolapse guidelines: this is a category 1 emergency cesarean (immediate threat to life). Manual displacement of presenting part off the cord reduces compression. High flow O2 to mother. If delivery imminent, vaginal delivery may be attempted."
    difficulty: hard
    tags: [cord prolapse, obstetric emergency, cesarean, SOGC, obgyn]
  - front: "What is uterine rupture and what are the risk factors?"
    back: "Uterine rupture: full-thickness tear of uterus usually at previous scar; sudden severe abdominal pain, loss of fetal station, fetal bradycardia, maternal hypotension; emergency laparotomy\n\nSOGC VBAC guidelines: previous low transverse cesarean is primary risk factor for rupture during TOLAC. Risk ~0.5-1%. Signs: sudden cessation of contractions, acute abdominal pain, fetal heart rate abnormalities, maternal shock. Uterine repair or hysterectomy depending on severity."
    difficulty: hard
    tags: [uterine rupture, VBAC, TOLAC, obstetric emergency, SOGC, obgyn]
  - front: "What is the management of shoulder dystocia?"
    back: "HELPERR mnemonic: Help (call for help), Episiotomy (consider), Legs (McRoberts maneuver — hyperflexion of maternal thighs), Pressure (suprapubic pressure), Enter (internal rotational maneuvers), Remove posterior arm, Roll patient to all-fours (Gaskin maneuver)\n\nSOGC shoulder dystocia guidelines: McRoberts position with suprapubic pressure is the first-line maneuver (resolves 50% of cases). Avoid fundal pressure (worsens impaction). Episiotomy does not relieve bony obstruction but provides room for maneuvers. Clavicle fracture may be necessary as last resort."
    difficulty: hard
    tags: [shoulder dystocia, HELPERR, McRoberts, obstetric emergency, obgyn]
  - front: "What is HELLP syndrome and how does it present?"
    back: "HELLP: Hemolysis (LDH >600), Elevated Liver enzymes (AST/ALT >2x normal), Low Platelets (<100,000) — presents with RUQ/epigastric pain, nausea, malaise in preeclampsia\n\nSOGC guidelines: HELLP is a severe complication of preeclampsia. Delivery is the definitive treatment — typically indicated at ≥34 weeks or for maternal deterioration. <34 weeks: corticosteroids for fetal lung maturity then delivery. Monitor for DIC, hepatic hematoma/rupture."
    difficulty: hard
    tags: [HELLP syndrome, preeclampsia, liver enzymes, platelets, obgyn]
  - front: "What are the indications for emergency cesarean section (Category 1)?"
    back: "Category 1 (life-threatening): cord prolapse, uterine rupture, placental abruption with severe fetal distress, severe fetal bradycardia, maternal cardiac arrest — delivered within 30 minutes\n\nSOGC/RCOG classification: Category 1 = immediate threat to maternal or fetal life (30 min DDI); Category 2 = maternal/fetal compromise, not immediately life-threatening (75 min); Category 3 = early delivery needed but no compromise; Category 4 = elective. Time to incision determines outcome."
    difficulty: hard
    tags: [emergency cesarean, category 1, cord prolapse, uterine rupture, obgyn]
  - front: "A 28-year-old has sudden onset severe right lower quadrant pain with vaginal bleeding and a positive pregnancy test. What is the diagnosis and management?"
    back: "Ectopic pregnancy; resuscitate with IV access and fluids; transvaginal ultrasound (empty uterus + adnexal mass); if unstable → emergent surgical treatment (salpingectomy); if stable → methotrexate if criteria met\n\nSOGC ectopic guidelines: methotrexate criteria (stable, hCG <5000, no cardiac activity, ≤3.5cm mass). Salpingostomy vs. salpingectomy — salpingectomy preferred to prevent repeat ectopic. Rh-negative patients: Rh immunoglobulin. Serum hCG levels must decline appropriately."
    difficulty: hard
    tags: [ectopic pregnancy, methotrexate, salpingectomy, SOGC, obgyn]
  - front: "What is amniotic fluid embolism (AFE) and how is it treated?"
    back: "AFE: catastrophic anaphylactoid reaction to amniotic fluid contents entering maternal circulation; sudden cardiorespiratory collapse, DIC, seizures; treatment: immediate resuscitation, CPR, correct DIC (blood products), deliver fetus\n\nAFE is rare (1:20,000-40,000 deliveries) but has ~40-60% maternal mortality. No specific treatment — aggressive supportive care. SOGC guidelines: high-dose oxytocin for uterine atony, vasopressors for shock, massive transfusion protocol for DIC. Perimortem cesarean if no response to CPR within 4 minutes."
    difficulty: hard
    tags: [amniotic fluid embolism, AFE, DIC, maternal collapse, obgyn]
  - front: "What is the immediate management of a maternal cardiac arrest in the third trimester?"
    back: "Left lateral displacement or manual uterine displacement during CPR; if no ROSC within 4 minutes: perimortem cesarean section at the resuscitation site (do NOT delay to transport) — improves both maternal and fetal outcomes\n\nSOGC and advanced cardiac life support guidelines: standard CPR techniques apply, but left uterine displacement is critical to relieve aortocaval compression by the gravid uterus. Perimortem C-section relieves aortocaval compression and improves cardiac output in the mother."
    difficulty: hard
    tags: [maternal cardiac arrest, CPR in pregnancy, perimortem cesarean, SOGC, obgyn]
  - front: "What are the diagnostic criteria for preeclampsia?"
    back: "BP >=140/90 after 20 weeks + proteinuria (>=0.3g/24h or PCR>=30) OR end-organ dysfunction (plt<100k, Cr>106, liver transaminases 2x, pulmonary edema, cerebral/visual symptoms)\n\nSevere features: BP>=160/110, plt<100k, Cr>106, LFTs 2x, pulmonary edema, cerebral symptoms. HELLP: hemolysis, elevated liver, low platelets. Treatment: delivery if >=37wks or severe features."
    difficulty: hard
    tags: [preeclampsia, SOGC]
  - front: "What are the diagnostic criteria for preeclampsia per SOGC guidelines?"
    back: "New-onset hypertension (>=140/90) after 20 weeks gestation WITH >=1 of: proteinuria (>=0.3g/24h or PCR >=30mg/mmol), end-organ dysfunction (elevated creatinine, liver transaminases, thrombocytopenia <100, neurological symptoms, pulmonary edema). Severe features: SBP >=160 or DBP >=110, thrombocytopenia <100, liver transaminases >2x ULN, severe headache/visual changes, pulmonary edema, renal insufficiency.\n\nSOGC 2022 guidelines removed the requirement for proteinuria to diagnose preeclampsia-any end-organ dysfunction with new hypertension qualifies. Proteinuria severity does not correlate with outcomes. HELLP syndrome (Hemolysis, Elevated Liver enzymes, Low Platelets) is a severe variant."
    difficulty: hard
    tags: [preeclampsia, diagnostic criteria, SOGC, obstetrics]
  - front: "What is the management of severe preeclampsia?"
    back: "IV magnesium sulfate (4g bolus over 20 min, then 1g/h infusion) for seizure prophylaxis. Antihypertensives: IV labetalol (20mg, then 40mg, 80mg escalating) or IV hydralazine or oral nifedipine for acute BP >=160/110. Delivery: definitive treatment. >=37 weeks: deliver. <34 weeks: stabilize, steroids, deliver if maternal/fetal deterioration. 34-37 weeks: individualized.\n\nSOGC recommends MgSO4 for all women with severe preeclampsia (NNT 63 to prevent one eclamptic seizure per MAGPIE trial). Monitor for MgSO4 toxicity: loss of reflexes (therapeutic 4-7 mmol/L), respiratory depression, cardiac arrest. Antidote: calcium gluconate 1g IV."
    difficulty: hard
    tags: [severe preeclampsia, magnesium sulfate, management, obstetrics]
  - front: "What is the management of eclampsia?"
    back: "ABC stabilization, left lateral position, protect airway. MgSO4 4-6g IV bolus over 15-20 min then 1-2g/h maintenance. If seizures recur on MgSO4: additional 2g bolus. Avoid benzodiazepines and phenytoin. Control BP <160/110. Deliver after maternal stabilization regardless of gestational age.\n\nEclampsia can occur antepartum (38%), intrapartum (18%), or postpartum (44%). Postpartum eclampsia occurs up to 4 weeks after delivery. SOGC guidelines identify MgSO4 as superior to all other anticonvulsants for eclampsia (Collaborative Eclampsia Trial)."
    difficulty: hard
    tags: [eclampsia, seizure, magnesium sulfate, obstetrics]
  - front: "What is the management of postpartum hemorrhage?"
    back: "PPH: blood loss >=500mL (vaginal) or >=1000mL (cesarean). 4 T causes: Tone (70%)-uterine atony. Trauma-lacerations, hematoma. Tissue-retained placenta. Thrombin-coagulopathy. Management: bimanual uterine massage, oxytocin 20-40U in 1L NS. Second-line: carboprost 250mcg IM (avoid in asthma), misoprostol 800-1000mcg PR, ergometrine 0.25mg IM (avoid in HTN). Tranexamic acid 1g IV within 3h. If refractory: Bakri balloon, B-Lynch suture, uterine artery embolization, hysterectomy.\n\nPPH is the leading cause of maternal death worldwide. SOGC recommends active management of third stage (oxytocin 10U IM, controlled cord traction, uterine massage). WOMAN trial showed TXA reduces death from PPH if given within 3 hours. Massive transfusion protocol with 1:1:1 ratio."
    difficulty: hard
    tags: [PPH, postpartum hemorrhage, uterine atony, obstetrics]
  - front: "What is the approach to shoulder dystocia?"
    back: "HELPERR mnemonic: H-call for Help. E-Evaluate for episiotomy. L-Legs (McRoberts maneuver: hyperflexion of thighs). P-suprapubic Pressure (NOT fundal). E-Enter maneuvers (Rubin: posterior shoulder rotation; Woods corkscrew). R-Remove posterior arm. R-Roll patient to all-fours (Gaskin maneuver). Document time, maneuvers, and outcomes.\n\nShoulder dystocia occurs in 0.6-1.4% of vaginal deliveries. Risk factors: macrosomia, GDM, previous shoulder dystocia, prolonged second stage. McRoberts + suprapubic pressure resolves >90% of cases. Complications: brachial plexus injury (Erb palsy), clavicle fracture, hypoxic injury. SOGC recommends regular simulation drills."
    difficulty: hard
    tags: [shoulder dystocia, HELPERR, McRoberts, obstetrics]
  - front: "What is the management of umbilical cord prolapse?"
    back: "EMERGENCY: elevate presenting part (hand in vagina, fingers off cord), fill bladder (500mL NS via Foley to elevate presenting part), knee-chest or Trendelenburg position, emergent cesarean section. Do NOT attempt to replace cord. Keep cord warm and moist. Avoid handling cord to prevent vasospasm.\n\nCord prolapse occurs in ~0.3% of deliveries. Risk factors: non-cephalic presentation, polyhydramnios, AROM with high presenting part, multiparity. Time to delivery is critical-fetal mortality increases with delay. SOGC recommends immediate cesarean with ongoing digital elevation."
    difficulty: hard
    tags: [cord prolapse, emergency, cesarean, obstetrics]
  - front: "What are the types and management of placental abruption?"
    back: "Classification: Grade 1 (mild)-marginal bleed, no fetal compromise. Grade 2 (moderate)-fetal distress, painful contractions, tender uterus. Grade 3 (severe)-fetal death, maternal DIC. Management: stabilize (2 large-bore IVs, crossmatch, coagulation studies). Grade 1: observation, monitor. Grade 2-3 with fetal distress: emergent cesarean. Grade 3 with fetal demise: vaginal delivery if maternal condition allows, correct coagulopathy.\n\nAbruption complicates 1% of pregnancies. Risk factors: hypertension (most common), cocaine use, trauma, previous abruption. Concealed hemorrhage can be more dangerous than revealed. SOGC recommends RhIg for Rh-negative women with abruption. Kleihauer-Betke test quantifies fetomaternal hemorrhage."
    difficulty: hard
    tags: [placental abruption, hemorrhage, DIC, obstetrics]
  - front: "What is the management of placenta previa?"
    back: "No vaginal exam until placenta location confirmed by ultrasound. Asymptomatic: serial US, delivery by planned cesarean at 36-37 weeks (after steroids if <37). Active bleeding: admit, type and crossmatch, IV access, steroids if <34 weeks. Massive hemorrhage: emergent cesarean regardless of gestational age. Avoid digital vaginal exam-may precipitate catastrophic hemorrhage.\n\nPlacenta previa occurs in 0.3-0.5% of pregnancies. Risk factors: previous cesarean (strongest), multiparity, advanced maternal age, multiple gestation. Vasa previa (fetal vessels crossing internal os) has high fetal mortality if membranes rupture. SOGC recommends screening for vasa previa with transvaginal US."
    difficulty: hard
    tags: [placenta previa, antepartum hemorrhage, cesarean, obstetrics]
  - front: "What are the clinical features and management of amniotic fluid embolism?"
    back: "Sudden cardiovascular collapse, hypoxia, DIC, and altered mental status during labor or immediately postpartum. Classic triad: hypotension, respiratory distress, coagulopathy. Management: supportive-intubation, vasopressors, massive transfusion for DIC, prepare for perimortem cesarean within 4-5 minutes if cardiac arrest.\n\nAFE is rare (~1/40,000) but has 60-80% mortality. Pathophysiology involves anaphylactoid reaction to fetal material in maternal circulation. No specific treatment exists. Perimortem cesarean improves both maternal and fetal outcomes. Canadian MOREOB program includes AFE simulation scenarios."
    difficulty: hard
    tags: [amniotic fluid embolism, obstetric emergency, DIC, obstetrics]
  - front: "What is uterine rupture, its risk factors, and management?"
    back: "Presentation: sudden severe abdominal pain, loss of contraction pattern on CTG, fetal heart rate abnormalities (prolonged deceleration), vaginal bleeding, palpable fetal parts abdominally, hemodynamic instability. Risk factors: previous cesarean (classical > low transverse), uterine surgery, oxytocin augmentation, obstructed labor. Management: emergent laparotomy, repair or hysterectomy.\n\nUterine rupture risk with TOLAC (trial of labor after cesarean): 0.5-0.7% with one prior low-transverse CS. Contraindications to TOLAC: previous classical incision, prior rupture, >2 prior cesareans (relative). SOGC guidelines outline TOLAC eligibility and intrapartum monitoring requirements."
    difficulty: hard
    tags: [uterine rupture, TOLAC, VBAC, obstetrics]
  - front: "What is the management of ectopic pregnancy?"
    back: "Expectant management: stable, declining hCG, hCG <1000. Medical: methotrexate 50mg/m2 IM single dose (criteria: hemodynamically stable, no fetal cardiac activity, hCG <5000, ectopic <4cm, no contraindications). Surgical: laparoscopic salpingostomy or salpingectomy (unstable, ruptured, failed medical, contraindication to MTX). Follow hCG to zero.\n\nSOGC guidelines recommend methotrexate for appropriate candidates. Contraindications to MTX: breastfeeding, immunodeficiency, liver/renal disease, blood dyscrasias, active pulmonary disease. Check CBC, renal function, liver enzymes, blood type, hCG before MTX. Monitor hCG on days 4 and 7 (should drop >=15%)."
    difficulty: hard
    tags: [ectopic pregnancy, methotrexate, salpingectomy, obstetrics]
  - front: "What is the approach to a patient with second-trimester vaginal bleeding?"
    back: "Differential: placenta previa, placental abruption, vasa previa, cervical causes (cervicitis, polyp, cancer), preterm labor with bloody show. Do NOT perform digital vaginal exam until previa excluded by US. Investigations: speculum exam (after previa excluded), ultrasound (placental location, amniotic fluid), CBC, coagulation, crossmatch, Kleihauer-Betke if Rh-negative.\n\nTransvaginal ultrasound is safe in placenta previa (probe does not reach internal os). Vasa previa has pathognomonic sinusoidal fetal heart rate pattern when membranes rupture. SOGC recommends Apt test to differentiate fetal from maternal blood in vaginal bleeding."
    difficulty: hard
    tags: [antepartum hemorrhage, second trimester, differential diagnosis, obstetrics]
  - front: "What are the criteria for perimortem cesarean section?"
    back: "Maternal cardiac arrest with gravid uterus >=20 weeks. Initiate within 4 minutes of cardiac arrest, deliver by 5 minutes. Improves maternal resuscitation (relieves aortocaval compression) AND fetal outcomes. Do NOT delay for consent, OR transfer, or sterile technique. Perform at bedside during ongoing CPR.\n\nPerimortem cesarean is for maternal benefit primarily (improved venous return and CPR efficacy). Canadian Resuscitation guidelines (CRC) incorporate this into maternal cardiac arrest algorithms. Neonatal team should be present. Survival is possible even with prolonged arrest if delivery is timely."
    difficulty: hard
    tags: [perimortem cesarean, maternal cardiac arrest, resuscitation, obstetrics]
  - front: "What is the management of preterm premature rupture of membranes (PPROM)?"
    back: "<24 weeks: counsel on prognosis, expectant vs termination. 24-34 weeks: admit, GBS prophylaxis, antenatal corticosteroids, latency antibiotics (ampicillin IV 48h then amoxicillin PO x 5 days + azithromycin), magnesium for neuroprotection if <32 weeks. Monitor for chorioamnionitis. Deliver for infection, abruption, fetal distress, or at 34 weeks. 34-37 weeks: consider delivery after steroids.\n\nSOGC guidelines recommend expectant management from 24-34 weeks with close monitoring. Latency antibiotics prolong pregnancy and reduce neonatal morbidity. Chorioamnionitis (maternal fever, tachycardia, uterine tenderness, fetal tachycardia) mandates delivery. ORACLE trial established the antibiotic regimen."
    difficulty: hard
    tags: [PPROM, premature rupture, latency antibiotics, obstetrics]
  - front: "What is the management of obstetric DIC?"
    back: "Treat underlying cause (abruption, AFE, sepsis, HELLP, retained dead fetus). Massive transfusion: PRBC:FFP:platelets in 1:1:1 ratio. Target: platelets >50, fibrinogen >2g/L (higher threshold in obstetrics than general DIC), INR <1.5. Cryoprecipitate for fibrinogen replacement. Tranexamic acid 1g IV. Consider recombinant factor VIIa as last resort.\n\nFibrinogen is consumed early in obstetric DIC and is the best predictor of severity. Normal fibrinogen in pregnancy is 4-6 g/L so values of 2g/L already indicate significant consumption. SOGC recommends fibrinogen replacement to maintain >2g/L. Point-of-care testing (ROTEM/TEG) guides targeted transfusion."
    difficulty: hard
    tags: [DIC, coagulopathy, massive transfusion, obstetrics]
  - front: "What are the 4 T's of postpartum hemorrhage?"
    back: "Tone (uterine atony, 70%), Trauma (lacerations, hematoma), Tissue (retained placenta/membranes), Thrombin (coagulopathy). Management: uterine massage, oxytocin, carboprost, tranexamic acid, tamponade, surgery\n\nPPH defined as >=500mL vaginal or >=1000mL cesarean blood loss. Atony risk: overdistension, prolonged labor, chorioamnionitis. Active management of third stage (oxytocin + controlled cord traction) prevents PPH."
    difficulty: medium
    tags: [PPH, 4 Ts, obstetric]
  - front: "What are the stages of labour?"
    back: "Stage 1: onset to full dilation (latent <6cm, active 6-10cm). Stage 2: full dilation to delivery. Stage 3: delivery to placenta expulsion. Active management of stage 3 prevents PPH\n\nLatent: irregular contractions, slow dilation. Active: regular contractions q2-3min, ~1cm/hr. Stage 2: nullip up to 3h with epidural, multip up to 2h. Prolonged stages may indicate obstruction."
    difficulty: medium
    tags: [labour, stages]
  - front: "What do fetal heart rate decelerations indicate?"
    back: "Early: head compression (mirror contractions, benign). Late: uteroplacental insufficiency (begin after peak of contraction — concerning). Variable: cord compression (abrupt onset/offset, V or W shaped)\n\nReassuring: baseline 110-160, moderate variability, accelerations present, no decels. Non-reassuring: recurrent lates, absent variability, prolonged deceleration >3min. Category III: immediate delivery."
    difficulty: hard
    tags: [fetal monitoring, decelerations]
  - front: "Define the three stages of labour and the expected duration for each in a nulliparous woman."
    back: "Stage 1 (cervical dilation): latent phase (0–6 cm, up to 20 hours) and active phase (6–10 cm, ~0.5–0.7 cm/hr). Stage 2 (full dilation to delivery of baby): up to 2–3 hours with epidural. Stage 3 (delivery of placenta): typically within 30 minutes.\n\nThe SOGC defines prolonged second stage as >3 hours with epidural or >2 hours without in nulliparas. Active management of the third stage (oxytocin, controlled cord traction) reduces postpartum hemorrhage risk. Partogram use is recommended by WHO and SOGC to detect labour dystocia early."
    difficulty: easy
    tags: [labour, stages-of-labour, partogram, nullipara, SOGC]
  - front: "On a partogram, the cervical dilation curve crosses the action line. What does this indicate and what is the appropriate next step?"
    back: "Crossing the action line indicates labour dystocia (failure to progress). The next step is to assess the 3 Ps (Power, Passenger, Passage), consider amniotomy if membranes intact, start or augment oxytocin, and prepare for possible cesarean delivery if no improvement.\n\nThe partogram's alert and action lines were designed to identify slow progress. Crossing the action line (typically 4 hours right of expected progress) mandates intervention per SOGC guidelines. Causes include inadequate contractions, cephalopelvic disproportion, or malposition."
    difficulty: medium
    tags: [partogram, labour-dystocia, oxytocin, SOGC, failure-to-progress]
  - front: "A labouring patient's fetal heart rate tracing shows decelerations that mirror contractions with the nadir coinciding with the peak of the contraction. What type of deceleration is this, and is it reassuring?"
    back: "These are early decelerations, caused by fetal head compression. They are considered benign and reassuring. No intervention is required.\n\nEarly decelerations are a vagal reflex response to head compression during contractions. Unlike late decelerations (uteroplacental insufficiency) or variable decelerations (cord compression), early decelerations do not indicate fetal compromise. SOGC fetal health surveillance guidelines classify them as normal."
    difficulty: easy
    tags: [fetal-heart-rate, early-decelerations, head-compression, fetal-monitoring]
  - front: "A fetal heart rate tracing shows repetitive decelerations with the nadir occurring 30 seconds after the peak of each contraction. What is the most likely cause and the immediate management?"
    back: "These are late decelerations, indicating uteroplacental insufficiency. Immediate management: left lateral positioning, IV fluid bolus, discontinue oxytocin, administer oxygen, and prepare for urgent delivery if the pattern persists.\n\nLate decelerations reflect decreased placental perfusion and fetal hypoxemia. The SOGC classifies recurrent late decelerations as an atypical or abnormal finding. If intrauterine resuscitation fails, expedited delivery (operative vaginal or cesarean) is indicated to prevent fetal acidosis."
    difficulty: medium
    tags: [late-decelerations, uteroplacental-insufficiency, fetal-monitoring, intrauterine-resuscitation]
  - front: "What is the Bishop score, what does it assess, and what score is considered favourable for induction of labour?"
    back: "The Bishop score assesses cervical readiness for induction using 5 parameters: dilation, effacement, station, consistency, and position. A score ≥6 is considered favourable (likely successful induction). A score <6 suggests cervical ripening is needed before oxytocin.\n\nThe Bishop score predicts the likelihood of a successful vaginal delivery following induction. The SOGC recommends cervical ripening with prostaglandins (dinoprostone or misoprostol) or a mechanical method (Foley catheter) when the Bishop score is unfavourable. Higher Bishop scores correlate with shorter induction-to-delivery intervals."
    difficulty: easy
    tags: [Bishop-score, induction-of-labour, cervical-ripening, prostaglandin, SOGC]
  - front: "Compare the methods of labour induction: oxytocin, prostaglandins, and artificial rupture of membranes (ARM). When is each most appropriate?"
    back: "Prostaglandins (PGE2 dinoprostone or PGE1 misoprostol): used for cervical ripening when Bishop score is unfavourable. Oxytocin: used when the cervix is favourable (Bishop ≥6) to stimulate contractions. ARM (amniotomy): used as an adjunct to oxytocin in active labour to augment progress.\n\nThe SOGC recommends prostaglandins as first-line cervical ripening agents. Misoprostol is contraindicated in women with a prior cesarean due to uterine rupture risk. Mechanical methods (Foley catheter balloon) are an alternative with lower hyperstimulation rates, as supported by Canadian evidence."
    difficulty: medium
    tags: [induction-methods, oxytocin, prostaglandin, amniotomy, cervical-ripening]
  - front: "What are the indications for vacuum-assisted delivery versus forceps delivery?"
    back: "Both require: fully dilated cervix, ruptured membranes, engaged head, known position, adequate anesthesia, empty bladder. Vacuum is preferred for rotational deliveries and has lower maternal trauma but higher neonatal cephalohematoma/subgaleal hemorrhage risk. Forceps provide more controlled traction and are preferred for face presentation (mentum anterior) and preterm deliveries (<34 weeks, where vacuum is contraindicated).\n\nThe SOGC guidelines note that choice depends on operator experience and clinical scenario. Vacuum should not be applied for >20 minutes or with >3 pop-offs. Sequential instrument use (failed vacuum then forceps) significantly increases neonatal morbidity and should generally be avoided."
    difficulty: hard
    tags: [operative-delivery, vacuum, forceps, SOGC, indications]
  - front: "List five common indications for cesarean section."
    back: "1) Failure to progress/cephalopelvic disproportion, 2) Non-reassuring fetal status, 3) Malpresentation (breech, transverse lie), 4) Placenta previa, 5) Prior classical (vertical) uterine incision. Others: cord prolapse, failed operative vaginal delivery, active genital herpes at onset of labour.\n\nCesarean delivery accounts for approximately 28–30% of births in Canada. The SOGC supports trial of labour after cesarean (TOLAC) for women with one prior low transverse incision, as VBAC success rates are 60–80%. Elective cesarean should be scheduled at ≥39 weeks to reduce neonatal respiratory morbidity."
    difficulty: easy
    tags: [cesarean-section, indications, VBAC, malpresentation, SOGC]
  - front: "During vaginal delivery, the fetal head delivers but the anterior shoulder is trapped behind the pubic symphysis. What is this emergency and what are the initial management steps using the HELPERR mnemonic?"
    back: "This is shoulder dystocia. HELPERR: H – call for Help, E – Evaluate for Episiotomy, L – Legs (McRoberts maneuver: hyperflexion of maternal thighs), P – suprapubic Pressure (NOT fundal pressure), E – Enter maneuvers (rotational: Rubin II, Wood's screw), R – Remove posterior arm, R – Roll patient to all fours (Gaskin maneuver).\n\nShoulder dystocia occurs in 0.6–1.4% of vaginal deliveries and can cause brachial plexus injury or neonatal asphyxia. McRoberts with suprapubic pressure resolves most cases. The SOGC emphasizes that fundal pressure is absolutely contraindicated as it worsens impaction."
    difficulty: hard
    tags: [shoulder-dystocia, HELPERR, McRoberts, suprapubic-pressure, obstetric-emergency]
  - front: "A labouring patient's membranes rupture and the nurse palpates the umbilical cord in the vagina. What is the immediate management?"
    back: "Umbilical cord prolapse. Immediate steps: 1) Call for emergency cesarean, 2) Manually elevate the presenting part off the cord (keep hand in vagina), 3) Place patient in knee-chest or Trendelenburg position, 4) Fill the bladder with 500–700 mL saline via Foley to elevate the presenting part, 5) Avoid handling the cord to prevent vasospasm. Emergency cesarean is definitive management.\n\nCord prolapse occurs in approximately 0.1–0.6% of deliveries and is more common with malpresentation, polyhydramnios, and artificial ROM with an unengaged head. The SOGC recommends continuous fetal monitoring and the fastest route to delivery. Bladder filling is a temporizing measure during transfer to the operating room."
    difficulty: hard
    tags: [cord-prolapse, obstetric-emergency, emergency-cesarean, knee-chest, SOGC]
  - front: "What are the features of a reassuring (normal) fetal heart rate tracing?"
    back: "Baseline rate 110–160 bpm, moderate variability (6–25 bpm), presence of accelerations (≥15 bpm for ≥15 seconds), no decelerations. This pattern indicates a well-oxygenated, non-acidotic fetus.\n\nThe SOGC fetal health surveillance guidelines classify tracings as normal, atypical, or abnormal. Moderate variability is the single most reassuring feature, as it reflects intact autonomic nervous system function. Absence of accelerations alone does not make a tracing abnormal if variability is preserved."
    difficulty: easy
    tags: [fetal-heart-rate, normal-tracing, variability, accelerations, SOGC]
  - front: "Variable decelerations on fetal heart rate monitoring indicate what pathology? When do they become concerning?"
    back: "Variable decelerations indicate umbilical cord compression. They become concerning (atypical) when: lasting >60 seconds, slow return to baseline, loss of variability within the deceleration, or associated with late components (overshoot or slow return).\n\nVariable decelerations are the most common type seen in labour. Mild variables are generally benign and may respond to maternal repositioning or amnioinfusion. The SOGC classifies variables as atypical when they exhibit features suggesting fetal compromise, warranting closer surveillance or intervention."
    difficulty: medium
    tags: [variable-decelerations, cord-compression, fetal-monitoring, atypical-variables]
  - front: "List five benefits of breastfeeding for the infant and two benefits for the mother."
    back: "Infant: 1) Reduced infections (otitis media, gastroenteritis, respiratory), 2) Decreased risk of SIDS, 3) Reduced allergic disease/eczema, 4) Better cognitive development, 5) Lower risk of childhood obesity and type 2 diabetes. Mother: 1) Decreased postpartum hemorrhage and faster uterine involution, 2) Reduced risk of breast and ovarian cancer.\n\nThe Canadian Paediatric Society and WHO recommend exclusive breastfeeding for the first 6 months with continued breastfeeding up to 2 years and beyond. In Canada, breastfeeding initiation rates are approximately 90%, but exclusive breastfeeding at 6 months drops to about 32%, highlighting the need for ongoing lactation support."
    difficulty: easy
    tags: [breastfeeding, benefits, CPS, WHO, infant-nutrition]
  - front: "A breastfeeding mother presents with a painful, erythematous, wedge-shaped area on her breast with fever of 38.9°C. What is the diagnosis and management?"
    back: "Lactational mastitis. Management: continue breastfeeding (essential to drain the breast), apply warm compresses, use NSAIDs for pain, and prescribe antibiotics covering S. aureus (cephalexin or cloxacillin). If a fluctuant mass develops, suspect breast abscess requiring ultrasound-guided drainage.\n\nMastitis affects 2–10% of breastfeeding women, typically in the first 6 weeks postpartum. The SOGC and CPS advise against stopping breastfeeding, as milk stasis worsens the condition. If MRSA is suspected (failure to respond to first-line antibiotics), wound culture and TMP-SMX or clindamycin should be considered."
    difficulty: medium
    tags: [mastitis, breastfeeding, breast-abscess, antibiotics, S-aureus]
  - front: "List four absolute contraindications to breastfeeding."
    back: "1) Maternal HIV infection (in high-resource settings like Canada), 2) Active untreated tuberculosis, 3) Infant with galactosemia, 4) Maternal use of certain drugs (e.g., chemotherapy agents, radioactive isotopes). Note: Hepatitis B and C are NOT contraindications if nipples are intact.\n\nIn Canada, the CPS recommends against breastfeeding with HIV due to available safe alternatives, unlike WHO guidance for resource-limited settings. Most maternal medications are compatible with breastfeeding; clinicians should consult LactMed or Motherisk (now InfantRisk) databases before advising cessation."
    difficulty: medium
    tags: [breastfeeding-contraindications, HIV, galactosemia, CPS, Motherisk]
  - front: "What are the 4 T's of postpartum hemorrhage and their relative frequency?"
    back: "Tone (uterine atony, 70%), Trauma (genital tract lacerations, 20%), Tissue (retained placenta/membranes, 10%), Thrombin (coagulopathy, 1%). PPH defined as blood loss >=500 mL vaginal or >=1000 mL cesarean. Massive PPH: >=1500 mL or hemodynamic instability.\n\nSOGC recommends active management of third stage (oxytocin 10 IU IM, controlled cord traction, uterine massage) to prevent PPH. Uterine atony is managed stepwise: bimanual massage, oxytocin infusion, carboprost (Hemabate), misoprostol, tranexamic acid (1 g IV per WOMAN trial), then surgical interventions (balloon tamponade, B-Lynch suture, embolization, hysterectomy)."
    difficulty: medium
    tags: [PPH, 4-Ts, uterine-atony, SOGC, active-management]
  - front: "How do you differentiate placental abruption from placenta previa clinically?"
    back: "Abruption: painful vaginal bleeding, uterine tenderness/rigidity (board-like), hypertonic uterus, fetal distress, may have concealed hemorrhage. Risk factors: HTN, trauma, cocaine, PPROM. Previa: painless bright red bleeding (typically 3rd trimester), soft non-tender uterus, normal fetal heart tones initially. Diagnosed by US showing placenta over internal os.\n\nSOGC emphasizes: NEVER perform digital vaginal exam until previa is excluded by ultrasound. Abruption can present without visible bleeding (concealed). Abruption is associated with DIC. Previa is managed with hospitalization, blood typing/crossmatch, and delivery at 36-37 weeks (cesarean for complete previa)."
    difficulty: medium
    tags: [abruption, previa, antepartum-hemorrhage, differential-diagnosis, SOGC]
  - front: "What is the HELPERR mnemonic for managing shoulder dystocia?"
    back: "H: call for Help. E: Evaluate for episiotomy. L: Legs (McRoberts maneuver — hyperflexion of maternal thighs). P: suprapubic Pressure (NOT fundal pressure). E: Enter maneuvers (Rubin II — rotate posterior shoulder anteriorly, Woods corkscrew). R: Remove posterior arm. R: Roll patient to all-fours (Gaskin maneuver).\n\nSOGC recommends McRoberts + suprapubic pressure as first-line (resolves 60% of cases). Head-to-body delivery interval >60 seconds increases neonatal morbidity. Never apply fundal pressure (worsens impaction). Document time intervals meticulously. Complications: brachial plexus injury, clavicle fracture, neonatal asphyxia."
    difficulty: hard
    tags: [shoulder-dystocia, HELPERR, McRoberts, obstetric-emergency, SOGC]
  - front: "How is umbilical cord prolapse managed?"
    back: "1) Call for STAT cesarean section. 2) Manually elevate presenting part off cord (examiner's hand in vagina pushing fetal head upward). 3) Fill bladder with 500-700 mL saline via Foley to elevate presenting part. 4) Position patient in knee-chest or steep Trendelenburg. 5) Do NOT attempt to replace cord. 6) Minimize cord handling to prevent vasospasm.\n\nCord prolapse occurs in 0.1-0.6% of deliveries. Risk factors include malpresentation, polyhydramnios, premature rupture of membranes with unengaged presenting part. Time to delivery is critical — neonatal outcomes decline significantly beyond 30 minutes. SOGC recommends continuous FHR monitoring and communication with OR team during transfer."
    difficulty: hard
    tags: [cord-prolapse, emergency-cesarean, bladder-filling, knee-chest, obstetric-emergency]
  - front: "What is amniotic fluid embolism (AFE) and how does it present?"
    back: "Sudden cardiovascular collapse during labour or immediately postpartum: acute hypoxia, hypotension/cardiac arrest, DIC/coagulopathy. Classic triad: respiratory distress, hemodynamic instability, coagulopathy. Often preceded by fetal distress. Diagnosis is clinical (exclusion of other causes). Mortality 20-60%.\n\nAFE is an anaphylactoid reaction to fetal material entering maternal circulation — not a mechanical embolic phenomenon. SOGC guidelines emphasize immediate multidisciplinary response: CPR, massive transfusion protocol, treat DIC, deliver fetus if undelivered. No specific treatment exists; supportive care is the cornerstone."
    difficulty: hard
    tags: [AFE, amniotic-fluid-embolism, DIC, cardiac-arrest, obstetric-emergency]
  - front: "What is the role of tranexamic acid in postpartum hemorrhage?"
    back: "Tranexamic acid 1 g IV given within 3 hours of delivery reduces death from bleeding by 20% (WOMAN trial). Administer as early as possible — efficacy decreases by 10% for every 15 minutes of delay. Repeat dose of 1 g if bleeding continues after 30 minutes. No increase in thromboembolic events.\n\nThe WOMAN trial (20,000+ women) established TXA as adjunct therapy for PPH. WHO and SOGC recommend early TXA alongside uterotonics. It is an antifibrinolytic that stabilizes clot. Cost-effective and widely available. Should not delay other PPH interventions — administer concurrently with uterotonic management."
    difficulty: medium
    tags: [tranexamic-acid, PPH, WOMAN-trial, antifibrinolytic, evidence-based]
  - front: "What are the indications for peripartum hysterectomy?"
    back: "Life-threatening PPH unresponsive to conservative measures (uterotonics, balloon tamponade, compression sutures, uterine artery embolization), uterine rupture irreparable, placenta accreta spectrum with uncontrollable bleeding. The decision should not be delayed when maternal life is at risk.\n\nPeripartum hysterectomy is a life-saving procedure performed in ~1/500-2000 deliveries. Placenta accreta spectrum (accreta, increta, percreta) is increasingly common with rising cesarean rates. SOGC recommends delivery of suspected accreta at a tertiary centre with multidisciplinary team, planned cesarean hysterectomy at 34-36 weeks."
    difficulty: hard
    tags: [peripartum-hysterectomy, PPH, placenta-accreta, life-saving, SOGC]
  - front: "What is uterine inversion and how is it managed?"
    back: "Uterine fundus prolapses through the cervix (partial or complete). Presents with sudden postpartum hemorrhage, shock out of proportion to visible blood loss, and a mass at or beyond the introitus. Management: manual replacement (Johnson maneuver — push fundus through cervix toward umbilicus), uterine relaxation (nitroglycerin, terbutaline, or general anesthesia), then uterotonics after repositioning.\n\nUterine inversion is rare (1/2000-20,000 deliveries) but rapidly fatal if unrecognized. Caused by excessive cord traction or fundal pressure on a relaxed uterus. SOGC emphasizes immediate manual replacement before the cervix contracts (making replacement much more difficult). If manual replacement fails, surgical correction is required."
    difficulty: hard
    tags: [uterine-inversion, Johnson-maneuver, PPH, nitroglycerin, obstetric-emergency]
  - front: "What are the risk factors and management of uterine rupture?"
    back: "Risk factors: prior uterine surgery (most commonly previous cesarean — TOLAC/VBAC), uterine hyperstimulation with oxytocin, grand multiparity, malpresentation. Presentation: sudden severe abdominal pain, fetal heart rate abnormalities (prolonged deceleration), loss of contractions, maternal tachycardia, vaginal bleeding. Management: emergent cesarean delivery and surgical repair or hysterectomy.\n\nSOGC VBAC guidelines: uterine rupture risk is 0.5% with one prior low transverse cesarean. Higher risk with classical incision (4-9%), multiple prior cesareans, or induction with prostaglandins. Continuous electronic fetal monitoring is mandatory during TOLAC. Delivery capability within 30 minutes is required."
    difficulty: hard
    tags: [uterine-rupture, VBAC, TOLAC, cesarean, obstetric-emergency]
  - front: "What is the management of eclamptic seizures?"
    back: "IV magnesium sulfate 4 g loading dose over 15-20 minutes, then 1-2 g/hour maintenance infusion. Protect airway, left lateral position, supplemental oxygen. Monitor: patellar reflexes (lost at toxic levels), respiratory rate (>=12), urine output (>=0.5 mL/kg/hr), serum magnesium if concern for toxicity. Deliver after maternal stabilization.\n\nSOGC guidelines recommend magnesium sulfate for both treatment and prevention of eclampsia (MAGPIE trial). Calcium gluconate 1 g IV is the antidote for magnesium toxicity. Diazepam and phenytoin are NOT first-line. Delivery is the definitive treatment — timing depends on gestational age and maternal/fetal condition."
    difficulty: hard
    tags: [eclampsia, magnesium-sulfate, MAGPIE, seizure, preeclampsia]
  - front: "What is the treatment of hypertensive emergency in eclampsia?"
    back: "Magnesium sulfate 4 g IV bolus over 20 minutes, then 1 g/h maintenance. For BP control: labetalol or hydralazine. Immediately consult OB/GYN.\n\nEclampsia (seizures in preeclampsia) is treated with magnesium sulfate—primarily as a seizure prophylactic/treatment, not a BP-lowering agent. BP control uses labetalol (first-line) or hydralazine. ACEi, ARBs, and nitroprusside are contraindicated in pregnancy."
    difficulty: medium
    tags: [eclampsia, magnesium sulfate, hypertensive emergency, pregnancy, obstetrics]
  - front: "What are the causes of postpartum hemorrhage (Four T's)?"
    back: "Tone (uterine atony — most common), Tissue (retained placenta), Trauma (laceration, uterine inversion), Thrombin (coagulopathy).\n\nUterine atony accounts for 80% of postpartum hemorrhage. Treatment: oxytocin 10 units IM or 40 units in 1L IV wide open until the uterus firms; surgical options if medical management fails. Tranexamic acid (TXA) may be helpful for coagulopathy. Bakri balloon can tamponade bleeding."
    difficulty: easy
    tags: [postpartum hemorrhage, Four Ts, uterine atony, oxytocin, obstetrics]
  - front: "What is the first investigation for a female of childbearing age presenting with vaginal bleeding?"
    back: "β-hCG (pregnancy test) — all female patients of possible childbearing age should be assumed to be pregnant (and to have an ectopic pregnancy) until proven otherwise.\n\nEctopic pregnancy is a life-threatening emergency that presents with vaginal bleeding and pelvic pain. The rule 'all vaginal bleeding in reproductive-age women is ectopic until proven otherwise' is a critical patient safety principle. Transvaginal ultrasound should follow to confirm intrauterine pregnancy."
    difficulty: easy
    tags: [vaginal bleeding, ectopic pregnancy, beta-hCG, emergency, obstetrics]
  - front: "What are the causes of first-trimester vaginal bleeding?"
    back: "Ectopic pregnancy, abortion (threatened/incomplete/complete/missed/inevitable/septic), molar pregnancy, implantation bleeding, friable cervix (most common benign cause), subchorionic hemorrhage.\n\nDistinguishing between these causes requires β-hCG level, transvaginal ultrasound, and physical examination. A dilated cervical os suggests incomplete or inevitable abortion. Cervical motion tenderness + adnexal mass + no IUP on U/S suggests ectopic pregnancy (Chandelier sign)."
    difficulty: medium
    tags: [first trimester bleeding, ectopic pregnancy, abortion, vaginal bleeding]
  - front: "When should Rh immune globulin (Rhogam) be given to a pregnant patient with vaginal bleeding?"
    back: "Rh immune globulin should be given to all Rh-negative pregnant patients with vaginal bleeding to prevent Rh sensitization.\n\nFetal-maternal hemorrhage during any pregnancy complication can expose an Rh-negative mother to Rh-positive fetal red cells, causing sensitization. Subsequent pregnancies with Rh-positive fetuses risk hemolytic disease of the newborn. Rhogam prevents maternal sensitization."
    difficulty: easy
    tags: [Rhogam, Rh negative, vaginal bleeding, pregnancy, hemolytic disease]
  - front: "What complications of pregnancy occur in the third trimester?"
    back: "Fetal: vasa previa. Maternal: preterm labour/PPROM, preeclampsia/eclampsia, placenta previa, placental abruption, uterine rupture, DVT/PE.\n\nThird trimester complications are predominantly obstetric emergencies. Placenta previa (painless bleeding) vs. placental abruption (painful bleeding with uterine rigidity) is a classic distinction. Preeclampsia (HTN + proteinuria after 20 weeks) can progress to eclampsia (seizures) or HELLP syndrome (hemolysis, elevated liver enzymes, low platelets)."
    difficulty: medium
    tags: [third trimester, complications, preeclampsia, placenta previa, obstetrics]
  - front: "Classify the types of spontaneous abortion and their key clinical/ultrasound features."
    back: "1. Threatened: bleeding + cramping, live fetus on U/S, cervix CLOSED → watch and wait\n2. Inevitable: bleeding + cramping + ruptured membranes, cervix OPEN, fetus low → misoprostol or D&C\n3. Incomplete: bleeding + partial passage of tissue, residual tissue on U/S, cervix OPEN → misoprostol or D&C\n4. Complete: complete passage, empty uterus on U/S, cervix CLOSED, no bleeding → no management\n5. Missed: no bleeding, no fetal heartbeat on U/S, fetus and sac still present, cervix CLOSED → mifepristone + misoprostol or D&C\n6. Septic: infected uterine contents → IV broad-spectrum antibiotics + D&C\n\nClassifying spontaneous abortion guides management. Cervical os status is key: open = inevitably incomplete. Always rule out ectopic in threatened abortion. Always check Rh status — administer Rhogam if Rh-negative. Cervical os examination and U/S are the core assessment tools."
    difficulty: medium
    tags: [spontaneous abortion, miscarriage, obstetrics, first trimester bleeding]
  - front: "When should Rhogam (anti-D immunoglobulin) be given in the context of pregnancy complications?"
    back: "Rhogam should be given to all Rh-negative patients with any type of pregnancy loss (threatened, inevitable, incomplete, complete, missed, septic abortion) and ectopic pregnancy. Always check Rh status in any first-trimester bleeding.\n\nEven small fetomaternal hemorrhage can sensitize an Rh-negative mother, causing hemolytic disease of the newborn in future pregnancies. Rhogam prevents this sensitization. This is a consistent Canadian obstetric guideline principle across all pregnancy complications."
    difficulty: easy
    tags: [Rh sensitization, Rhogam, first trimester bleeding, ectopic pregnancy]
  - front: "What is the differential diagnosis of first trimester vaginal bleeding?"
    back: "1. Physiologic bleeding (implantation spotting)\n2. Spontaneous abortion (threatened, inevitable, incomplete, complete, missed, septic)\n3. Ectopic pregnancy\n4. Gestational trophoblastic disease (hydatidiform mole)\n5. Physical trauma (post-coital or post-pelvic exam)\n6. Genital lesion (cervical polyp, neoplasm)\n7. Subchorionic hematoma\n8. Non-OB/GYN cause (e.g., hemorrhoids)\n\nEvery woman of childbearing age presenting to the ER with abdominal/pelvic pain should have a β-hCG measured. Ectopic pregnancy is the most dangerous diagnosis to miss. U/S and serial β-hCG levels are the cornerstone investigations. Subchorionic hematoma is often incidental but can cause significant bleeding."
    difficulty: easy
    tags: [first trimester bleeding, differential diagnosis, ectopic pregnancy]
  - front: "What is the most common site of ectopic pregnancy implantation, and what is the epidemiology?"
    back: "Most common site: ampullary portion of fallopian tube (70%), followed by isthmal (12%), fimbrial (11%), ovarian (3%), interstitial (2%), abdominal (1%). Ectopic pregnancy occurs in 1/100 pregnancies. It is the fourth leading cause of maternal mortality and the leading cause of maternal death in the first trimester.\n\nThe fallopian tube accounts for ~93% of ectopic pregnancies. Ampullary implantation is most common because sperm fertilize eggs in the ampulla and any disruption in tubal transport (e.g., from PID scarring) leads to implantation there. Interstitial ectopics are the most dangerous due to rich blood supply."
    difficulty: easy
    tags: [ectopic pregnancy, epidemiology, fallopian tube]
  - front: "What are the risk factors for ectopic pregnancy?"
    back: "Major risk factors:\n- Previous ectopic pregnancy\n- History of PID (especially C. trachomatis), salpingitis, gonorrhea, chlamydia → 50% of ectopics from PID-related cilia damage\n- IUD use (low absolute risk of pregnancy, but higher relative risk of ectopic if conception occurs)\n- Previous tubal surgery (ligation, reconstruction, or surgery for prior ectopic)\n- Infertility treatment (IVF — 7% ectopic rate)\n- Abdominal surgery for ruptured appendix\n- Smoking, increased age\n- In utero DES exposure\n- Regular vaginal douching\n\nAny process that disrupts normal tubal anatomy or function increases ectopic risk. PID causes scarring and impaired ciliary transport. IVF bypasses natural transport but does not guarantee intrauterine implantation. Smoking impairs cilia function. The ESEP trial confirmed salpingostomy and salpingectomy have similar subsequent fertility outcomes."
    difficulty: medium
    tags: [ectopic pregnancy, risk factors, PID]
  - front: "How is ectopic pregnancy investigated, and what β-hCG threshold correlates with an empty uterus on transvaginal U/S being suspicious for ectopic?"
    back: "Investigations:\n- Serial β-hCG: normal doubling time every 48h in first 8 weeks; rise <35% over 2 days across 3 measurements suggests non-viable pregnancy; 85% of ectopics show abnormal β-hCG doubling\n- Transvaginal U/S: extra-uterine gestational sac with yolk sac or embryo is diagnostic; tubal ring is suggestive\n- Suspect ectopic if empty uterus on TVUS with β-hCG >2000–3000 mIU/mL (discriminatory zone)\n- Laparoscopy for definitive diagnosis if uncertain\n\nThe discriminatory zone of β-hCG 2000–3000 mIU/mL is where an intrauterine pregnancy should be visible on TVUS. If absent, ectopic or pregnancy failure must be suspected. Abnormal β-hCG rise pattern does not localize the pregnancy — U/S is needed to differentiate intrauterine failure from ectopic."
    difficulty: hard
    tags: [ectopic pregnancy, beta-hCG, ultrasound, discriminatory zone]
  - front: "What are the criteria for methotrexate treatment of ectopic pregnancy, and what are the contraindications?"
    back: "Methotrexate 50 mg/m² IM (single dose) is used for medically stable ectopic pregnancies. Follow β-hCG on days 4 and 7; administer second dose if <15% decline. 82–95% success; up to 25% need second dose. Tubal patency approaches 80%.\n\nContraindications include: hemodynamic instability/hemorrhage/tubal rupture, inability to follow up, significant renal/liver dysfunction, hematologic disorders/bone marrow suppression, active pulmonary disease, peptic ulcer disease, hypersensitivity to methotrexate, immunosuppression, chronic infection, heterotopic pregnancy with viable IUP, breastfeeding. Cannot conceive for 3 months after treatment due to teratogenicity.\n\nMethotrexate is a folate antagonist affecting rapidly dividing trophoblastic tissue. Prenatal vitamins (folic acid) must be stopped as they reduce methotrexate efficacy. It is given at 1/5 to 1/6 of the chemotherapy dose, so side effects are minimal but monitoring is essential."
    difficulty: hard
    tags: [ectopic pregnancy, methotrexate, treatment]
  - front: "What are the surgical options for ectopic pregnancy, and when is each preferred?"
    back: "Preferred approach: laparoscopy\n- Linear salpingostomy: option if tube is salvageable; 15% risk of persistent trophoblast — must monitor weekly β-hCG; does NOT increase fertility vs. salpingectomy (ESEP trial)\n- Salpingectomy: preferred if tube is damaged or ipsilateral recurrence\n- Laparotomy: if hemodynamically unstable, extensive prior abdominal surgery\nGive Rhogam if Rh-negative.\n\nThe ESEP trial (open-label RCT) showed salpingostomy does not improve fertility over salpingectomy when the contralateral tube is healthy. Salpingostomy has higher rates of persistent trophoblast. Salpingectomy is preferred to prevent recurrence on the same tube."
    difficulty: hard
    tags: [ectopic pregnancy, salpingostomy, salpingectomy, surgery]
  - front: "What is the management of an abnormal Pap test discovered during pregnancy?"
    back: "Pap test at initial prenatal visit if overdue. If abnormal Pap/suspicious lesion: refer to colposcopy. If diagnostic conization required: defer until second trimester (T2) to minimize pregnancy loss risk. If invasive cancer ruled out: management of dysplasia deferred until after delivery (vaginal delivery acceptable). If invasive cancer in T1: consider termination of pregnancy, radical surgery (hysterectomy or trachelectomy), or concurrent chemoradiation. If invasive cancer in T2/T3: delay therapy until fetal viability, then caesarean delivery with concurrent radical surgery or subsequent chemoradiation.\n\nApproximately 1 in 2,200 pregnant patients will have an abnormal Pap test. The approach balances maternal oncological outcomes against fetal wellbeing, with the degree of fetal maturity and patient wishes being central to shared decision-making."
    difficulty: hard
    tags: [cervical cancer, pregnancy, Pap test, management]
  - front: "What is a complete hydatidiform mole and how does it differ from an incomplete (partial) mole in terms of genetics, ultrasound, and risk of malignant progression?"
    back: "Complete mole: diploid (entirely paternal chromosomes — two sets of paternal origin, no maternal); diffuse trophoblastic hyperplasia; no fetal tissue; U/S shows 'snowstorm' appearance + theca-lutein cysts; risk of progression to GTN: 15-20%. Incomplete/partial mole: triploid (1 maternal + 2 paternal sets); focal trophoblastic hyperplasia; associated with fetal tissue (often growth-restricted with congenital malformations); U/S shows degeneration of placenta + multiple echogenic regions; risk of progression: <4%.\n\nGTD incidence is 1/1000 pregnancies in North America. High β-hCG (>100,000 IU/L), theca-lutein cysts, and excessive uterine size are features of complete moles at high risk for developing persistent GTN post-evacuation. DES (diethylstilbestrol) exposure is historically associated with clear-cell vaginal adenocarcinoma, not molar pregnancy."
    difficulty: hard
    tags: [hydatidiform mole, GTD, complete mole, partial mole, genetics]
  - front: "What are the criteria for diagnosing gestational trophoblastic neoplasia (GTN) after molar evacuation?"
    back: "Any one of: (1) β-hCG rise >10% compared to previous level over 2 weeks (3 measurements on days 1, 8, 15); (2) β-hCG plateau (<10% change) over 3 weeks (4 measurements on days 1, 8, 15, 22); (3) Histological diagnosis of choriocarcinoma; (4) Metastatic disease; (5) β-hCG ≥20,000 mIU/mL more than 4 weeks post-evacuation.\n\nβ-hCG is the primary tumour marker for monitoring GTD/GTN. Serial weekly β-hCG measurements are mandatory after molar evacuation. The presence of rising or plateauing β-hCG signals malignant transformation and warrants chemotherapy initiation, with the WHO scoring system guiding single- vs. multi-agent regimen selection."
    difficulty: hard
    tags: [GTN, gestational trophoblastic neoplasia, beta-hCG, diagnosis, criteria]
  - front: "What is the first-line treatment for low-risk GTN (WHO score ≤6), and when is combination chemotherapy indicated?"
    back: "First-line for low-risk GTN: pulsed actinomycin D (Act-D) IV every 2 weeks. Alternative: methotrexate (MTX)-based regimen. 20% of patients need to switch to an alternate single-agent regimen if β-hCG fails to normalize. Combination chemotherapy (EMA-CO: etoposide, MTX, actinomycin D, cyclophosphamide, vincristine) is used if: high-risk GTN (WHO score ≥7), resistance to single-agent chemotherapy. Hysterectomy may be considered if fertility not desired or for placental-site trophoblastic tumour.\n\nGTN has a >95% cure rate, even for metastatic disease, making it one of the most chemosensitive malignancies. WHO prognostic score (0-≤6 = low risk; 7+ = high risk; >13 = ultra high-risk) incorporates age, antecedent pregnancy, interval from pregnancy to treatment, β-hCG level, metastasis sites/number, tumour mass, and prior chemotherapy."
    difficulty: hard
    tags: [GTN, chemotherapy, EMA-CO, actinomycin D, methotrexate]
  - front: "What are the most common sites of metastasis in choriocarcinoma, and which site is associated with the worst prognosis?"
    back: "Lungs (80%): cough, hemoptysis, CXR lesions. Vagina (30%): vaginal bleeding, 'blue lesions' on speculum exam. Pelvis (20%): rectal bleeding, U/S lesions. Liver (10%): elevated LFTs. Brain (10%): headaches, dizziness, seizures. Brain and liver metastases are features of bad-prognosis metastatic GTN (along with: duration >4 months, pre-treatment β-hCG >100,000 IU/24h urine or >40,000 IU/L blood, prior chemotherapy, metastatic disease following term pregnancy).\n\nChoriocarcinoma is a highly anaplastic, highly vascular tumour (no chorionic villi, elements of syncytiotrophoblast and cytotrophoblast) prone to early hematogenous dissemination. Suspicious pelvic lesions should NOT be biopsied due to the high vascularity and bleeding risk. Vaginal 'blue lesions' are pathognomonic."
    difficulty: hard
    tags: [choriocarcinoma, metastases, GTN, prognosis]
  - front: "What follow-up surveillance is required after molar evacuation (GTD)?"
    back: "Serial β-hCG weekly until negative × 3 (usually several weeks), starting 2 weeks post-evacuation. For incomplete hydatidiform mole: recheck 1 month after negativity. For complete hydatidiform mole: monthly monitoring for 6 months. Reliable contraception throughout entire follow-up period (OCP is ideal and can be started immediately after evacuation). Women who become pregnant during follow-up should be referred to gynecologic oncology and maternal-fetal medicine.\n\nPregnancy must be avoided during follow-up because rising β-hCG from a new pregnancy could be confused with GTN recurrence, delaying cancer diagnosis or causing unnecessary chemotherapy. OCP is preferred because it suppresses endogenous LH, which cross-reacts with the β-hCG assay in some older assays."
    difficulty: medium
    tags: [GTD, follow-up, beta-hCG, molar pregnancy, surveillance]
  - front: "What is placental-site trophoblastic tumour (PSTT), and how does it differ from choriocarcinoma?"
    back: "PSTT is a rare, aggressive form of GTN arising from abnormal growth of intermediate trophoblastic cells. Key distinguishing features: low β-hCG levels (vs. very high in choriocarcinoma); produces human placental lactogen (hPL); relatively insensitive to chemotherapy (unlike choriocarcinoma which is highly chemosensitive); treatment often requires hysterectomy.\n\nChoriocarcinoma is highly anaplastic with elements of syncytiotrophoblast and cytotrophoblast, no chorionic villi, and extreme chemosensitivity. PSTT, by contrast, is more indolent in behaviour but resistant to standard GTN chemotherapy, making early hysterectomy critical for non-metastatic disease."
    difficulty: hard
    tags: [PSTT, placental-site trophoblastic tumour, GTN, choriocarcinoma, hPL]
