# Immunization Schedule & Vaccines (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the routine childhood immunization schedule for Ontario/Canada at 2 months?"
    back: "2 months: DTaP-IPV-Hib (diphtheria, tetanus, acellular pertussis, polio, Haemophilus influenzae b), pneumococcal conjugate (PCV13), meningococcal C (MenC-C), rotavirus (oral)\n\nNACI (National Advisory Committee on Immunization) sets the Canadian immunization schedule. Provincial schedules vary slightly. All routine childhood vaccines are publicly funded. 2-month vaccines may cause fever and irritability — acetaminophen can be given."
    difficulty: easy
    tags: [immunization schedule, 2 months, DTaP, PCV13, pediatrics]
  - front: "What is the MMR vaccine and when is it given?"
    back: "MMR (measles-mumps-rubella) live attenuated vaccine: first dose at 12-15 months, second dose at 18 months or 4-6 years — 95% efficacy for measles prevention\n\nNACI: 2 doses of MMR achieve >97% protection. MMR is contraindicated in immunocompromised patients and pregnancy. Post-vaccination measles-like illness may occur 7-12 days after vaccination. Herd immunity threshold for measles: 95% vaccination coverage."
    difficulty: easy
    tags: [MMR, measles, mumps, rubella, immunization, pediatrics]
  - front: "What is the HPV vaccine and who should receive it in Canada?"
    back: "HPV vaccine (Gardasil 9 — 9-valent): 2 doses for ages 9-14 (≥6 months apart); 3 doses for ages 15-26 and immunocompromised; prevents 70-90% of cervical cancers, genital warts, oropharyngeal cancers\n\nNACI recommends routine HPV vaccination for all adolescents at age 9-14, ideally before sexual debut. Gender-neutral programs implemented across Canada. Health Canada-approved up to age 45. HPV vaccination does not replace cervical cancer screening (Pap test)."
    difficulty: easy
    tags: [HPV vaccine, Gardasil, cervical cancer prevention, immunization, pediatrics]
  - front: "What vaccines are contraindicated in immunocompromised children?"
    back: "Live attenuated vaccines are contraindicated: MMR, varicella (live), MMRV, BCG, oral typhoid, yellow fever, live oral rotavirus (relative), live influenza (FluMist) — inactivated vaccines are safe\n\nCPS/NACI guidelines for immunocompromised children (cancer, HIV, immunosuppressive therapy): avoid live vaccines. Inactivated influenza vaccine recommended. Household contacts should receive inactivated flu vaccine. Varicella post-exposure prophylaxis with VZIG if exposed."
    difficulty: medium
    tags: [immunocompromised, live vaccines, vaccination contraindications, pediatrics]
  - front: "What is the BCG vaccine and who receives it in Canada?"
    back: "BCG (Bacillus Calmette-Guérin) TB vaccine: NOT routinely recommended in Canada; given at birth in high TB-prevalence countries; recommended in Canada only for infants in high-risk communities (First Nations, Inuit) with high TB rates\n\nBCG is highly effective in preventing severe TB (meningitis, miliary TB) in infants but has variable efficacy against adult pulmonary TB. It causes false-positive TST reactions. NACI recommendation: selective use in high-risk groups; IGRA preferred for TB screening in BCG-vaccinated individuals."
    difficulty: medium
    tags: [BCG, tuberculosis vaccine, NACI, Canada, pediatrics]
  - front: "What is the recommended catch-up vaccination strategy for a 5-year-old who has never been vaccinated?"
    back: "Catch-up with all age-appropriate vaccines according to provincial schedule; minimum intervals between doses must be respected; measles and varicella can be given at any age to unvaccinated children\n\nNACI catch-up schedules allow completion of missed vaccines with minimum intervals. Start from the beginning if vaccine series not previously started. Accelerated schedule respects minimum intervals between doses. Meningococcal ACWY, HPV, and adult Tdap when age-appropriate."
    difficulty: medium
    tags: [catch-up vaccination, unvaccinated, immunization schedule, NACI, pediatrics]
  - front: "A parent refuses vaccines due to concerns about autism. How should this be addressed?"
    back: "Acknowledge concerns respectfully; explain evidence disproving vaccine-autism link (Wakefield study retracted, multiple large studies); motivational interviewing approach; provide written resources; document discussion — do not dismiss or threaten\n\nNACI and CPS strongly support routine immunization. The purported vaccine-autism link was based on a fraudulent, retracted study. Thiomersal has been removed from most childhood vaccines. Studies involving millions of children show no association between MMR and autism."
    difficulty: hard
    tags: [vaccine hesitancy, autism myth, MMR, motivational interviewing, pediatrics]
  - front: "What vaccines are recommended at the 12-month well-child visit?"
    back: "12 months: MMR, varicella, meningococcal C conjugate (MenC-C), PCV13 (4th dose); hepatitis A in provinces where included\n\nProvincial immunization schedules vary. Most Canadian provinces have added hepatitis A vaccine to routine schedule. NACI recommends MenACWY for 12-month olds in provinces that use it as the primary MenC dose (replacing MenC-C). Review for any missed vaccines at each visit."
    difficulty: easy
    tags: [12 month vaccines, MMR, varicella, meningococcal, pediatrics]
  - front: "What is the recommended influenza vaccine strategy for children in Canada?"
    back: "Annual influenza vaccination for all children ≥6 months; children 6 months to 8 years receiving influenza vaccine for the first time need 2 doses (4 weeks apart) in the first season; LAIV (FluMist intranasal) preferred for 2-17 years if healthy (not appropriate for immunocompromised)\n\nNACI recommends annual influenza vaccination for all Canadians starting at 6 months. LAIV has superior efficacy in children vs. inactivated vaccine. LAIV contraindicated in immunocompromised, severe asthma, salicylate therapy, pregnancy. Pharmacies can administer influenza vaccines in all provinces."
    difficulty: easy
    tags: [influenza vaccine, annual immunization, LAIV, pediatric vaccine, pediatrics]
  - front: "What is vaccine-preventable disease reporting in Canada?"
    back: "All vaccine-preventable diseases are nationally notifiable to PHAC; measles, mumps, rubella, pertussis, invasive Hib, invasive meningococcal/pneumococcal, polio, tetanus, and others — must be reported by physicians and laboratories\n\nNotifiable disease reporting is provincially mandated. PHAC monitors national trends. Measles outbreaks: all cases require public health investigation and contact tracing. Imported measles from unvaccinated travelers drives most Canadian outbreaks. Vaccine-preventable disease outbreaks trigger catch-up campaigns."
    difficulty: easy
    tags: [notifiable diseases, vaccine-preventable, PHAC, measles reporting, pediatrics]
  - front: "What is the Canadian immunization schedule for infants?"
    back: "2,4,6 months: DTaP-IPV-Hib-HB, PCV13, rotavirus. 12 months: MMR, varicella, PCV13, meningococcal C. 18 months: DTaP-IPV-Hib booster\n\nNACI recommendations. HPV at grade 4-6 (age 9-13). Tdap booster in pregnancy (each pregnancy, 27-32 weeks). Annual influenza >=6 months."
    difficulty: medium
    tags: [vaccines, NACI]
  - front: "What is the Canadian publicly funded immunization schedule for infants (0-12 months)?"
    back: "Birth: HepB (some provinces). 2mo: DTaP-IPV-Hib + PCV13 + rotavirus. 4mo: DTaP-IPV-Hib + PCV13 + rotavirus. 6mo: DTaP-IPV-Hib + (PCV13 in some provinces) + influenza (>=6mo annually). 12mo: MMR + varicella (or MMRV) + PCV13 + meningococcal C conjugate + HepB (if not given at birth).\n\nThe National Advisory Committee on Immunization (NACI) provides recommendations, but schedules are implemented provincially. The schedule varies slightly between provinces. DTaP-IPV-Hib is a combination vaccine reducing injection burden. Rotavirus is oral, not injectable."
    difficulty: medium
    tags: [immunization schedule, infant vaccines, NACI, pediatrics]
  - front: "What are the live vaccines and why are they important to distinguish?"
    back: "Live attenuated: MMR, varicella, MMRV, rotavirus, BCG, live attenuated influenza (LAIV/FluMist), oral polio (OPV-not used in Canada), yellow fever. Key implications: contraindicated in immunocompromised patients, must wait 28 days between two live vaccines (or give simultaneously), may need to delay after blood products.\n\nNACI guidelines specify that live vaccines are contraindicated in severe immunodeficiency (HIV with CD4 <15%, chemotherapy, high-dose steroids >=2mg/kg/day x >=14 days). Household contacts of immunocompromised patients SHOULD receive live vaccines (except OPV). IPV is used exclusively in Canada."
    difficulty: medium
    tags: [live vaccines, contraindications, immunocompromised, pediatrics]
  - front: "What are the true contraindications vs common misconceptions about vaccines?"
    back: "True contraindications: anaphylaxis to previous dose or vaccine component, encephalopathy within 7 days of pertussis vaccine. NOT contraindications: mild illness with/without fever, current antibiotic therapy, mild local reaction to previous dose, prematurity, breastfeeding, family history of adverse events, egg allergy for MMR.\n\nVaccine hesitancy is a growing concern in Canada. NACI and CPS emphasize that missed opportunities due to false contraindications are more harmful than the theoretical risks. Egg allergy is not a contraindication for MMR (grown in fibroblast culture) or current influenza vaccines."
    difficulty: medium
    tags: [vaccine contraindications, misconceptions, safety, pediatrics]
  - front: "What is the catch-up immunization approach for a child with unknown or incomplete vaccination history?"
    back: "Assume unvaccinated unless documented proof exists. Start age-appropriate schedule from the beginning. Minimum intervals between doses (not maximum-no need to restart series). Simultaneous administration of multiple vaccines at different sites is safe and recommended. Serologic testing may be helpful for certain antigens (Hep B, measles, varicella).\n\nNACI provides detailed catch-up schedules. This is common with immigrant/refugee children in Canada. Each province has a catch-up guide. Key principle: every visit is an opportunity to vaccinate. School immunization requirements vary by province (Ontario mandates documentation)."
    difficulty: medium
    tags: [catch-up vaccination, incomplete vaccination, pediatrics]
  - front: "What are the vaccines recommended for adolescents in Canada?"
    back: "Grade 7-8 (age 12-13): HPV (2-dose series, Gardasil 9), Meningococcal ACWY conjugate, HepB (if not completed), Tdap booster. Annually: influenza. Additional: varicella (2nd dose if not received), catch-up of any missing childhood vaccines.\n\nNACI recommends gender-neutral HPV vaccination (Gardasil 9 covers types 6,11,16,18,31,33,45,52,58). Two-dose schedule for ages 9-14, three-dose for >=15. Meningococcal B vaccine (Bexsero) is recommended by NACI but not publicly funded in all provinces."
    difficulty: medium
    tags: [adolescent vaccines, HPV, meningococcal, pediatrics]
  - front: "What are the special immunization considerations for preterm infants?"
    back: "Immunize at chronological age (NOT corrected age) with full doses. All routine vaccines given on schedule. Additional: palivizumab for RSV prophylaxis in eligible preterm infants, annual influenza from 6 months. HepB at birth if mother HBsAg+. Monitor for apnea/bradycardia 48h after first vaccination in hospitalized preterm <31 weeks.\n\nCPS and NACI emphasize that prematurity is NOT a reason to delay vaccination. Immune response may be slightly lower but is still protective. All routine vaccines including rotavirus should be given at 2 months chronological age even if still in NICU."
    difficulty: medium
    tags: [preterm vaccination, immunization, neonatal, pediatrics]
  - front: "What are the post-exposure prophylaxis protocols for key vaccine-preventable diseases?"
    back: "Measles: MMR within 72h or Ig within 6 days for susceptible contacts. Varicella: vaccine within 5 days or VZIG for high-risk (immunocompromised, pregnant, newborns). Pertussis: azithromycin for close contacts regardless of immunization status. Hepatitis B: HBIG + vaccine within 12h for neonates of HBsAg+ mothers. Rabies: wound care + HRIG + vaccine series.\n\nPost-exposure protocols are critical for public health in Canada. Measles outbreaks require rapid contact tracing. Healthcare workers with uncertain immunity should receive post-exposure vaccination. CPS and NACI provide detailed post-exposure algorithms for each pathogen."
    difficulty: hard
    tags: [post-exposure prophylaxis, PEP, contact tracing, pediatrics]
  - front: "What adverse events following immunization (AEFI) should be reported?"
    back: "Report: anaphylaxis, seizures, encephalopathy, intussusception (post-rotavirus), Guillain-Barre, thrombocytopenia, severe local reaction, any hospitalization or death temporally associated with vaccination. Reporting is through the Canadian Adverse Events Following Immunization Surveillance System (CAEFISS). Anaphylaxis rate: ~1/million doses.\n\nCAEFISS collects national AEFI data. Healthcare providers are legally required to report AEFIs in most provinces. The National Vaccine Injury Compensation Program was established in Canada in 2021. Vaccine-associated anaphylaxis requires 15-minute observation post-vaccination."
    difficulty: medium
    tags: [AEFI, adverse events, vaccine safety, reporting, pediatrics]
  - front: "What is the meningococcal vaccination strategy in Canada?"
    back: "Routine: Meningococcal C conjugate at 12 months, Meningococcal ACWY conjugate in adolescence. Meningococcal B (Bexsero, Trumenba): recommended by NACI for high-risk groups, funded in some provinces. High-risk requiring both MenACWY + MenB: asplenia, complement deficiency, outbreaks, travel to endemic areas.\n\nN. meningitidis serogroups B and W are emerging concerns in Canada. MenB vaccine is not yet universally publicly funded despite NACI recommendation. Healthcare providers should discuss MenB with parents as it may require private purchase in some provinces."
    difficulty: medium
    tags: [meningococcal vaccine, serogroups, NACI, pediatrics]
  - front: "How should COVID-19 vaccination be approached in Canadian pediatric populations?"
    back: "NACI recommendations evolve with evidence. Currently: mRNA vaccines recommended for children >=6 months. Primary series + boosters based on age and risk. Higher priority for high-risk children (immunocompromised, chronic conditions). Can be co-administered with other routine vaccines.\n\nNACI updates COVID-19 pediatric vaccine recommendations as evidence evolves. Myocarditis/pericarditis is a rare adverse event more common in males 12-29 years after mRNA vaccines (especially after 2nd dose). Benefits exceed risks at the population level per NACI risk-benefit analysis."
    difficulty: medium
    tags: [COVID-19 vaccine, pediatric, mRNA, NACI, pediatrics]
  - front: "What are the PHE vaccine recommendations for adults in Canada per the periodic health exam table?"
    back: "Tetanus booster every 10 years (if had primary series, Grade A). One Tdap booster for adults <65 (as Adacel® or Boostrix®, Grade A). Herpes zoster vaccine for adults ≥50 (Grade A). Varicella vaccine for susceptible adolescents/adults ages 1-12 and above (Grade A). Rubella vaccine for non-pregnant women of childbearing age without immunity (Grade B). Pneumococcal vaccine (Pneumovax®23) for all ≥65 or high-risk; add Prevnar®13 if >65 and high-risk (Grade A).\n\nImmunizations are a critical preventive health measure in primary care. High-risk groups include immunocompromised patients, those >65, patients with COPD/asthma/CHF/asplenia/liver disease/renal failure/DM who require pneumococcal vaccination. Annual influenza vaccine is recommended for all adults."
    difficulty: medium
    tags: [vaccines, immunization, tetanus, Tdap, herpes zoster, pneumococcal, periodic health exam]
  - front: "What vaccinations are required after splenectomy and when should they be given?"
    back: "Pneumococcal, Haemophilus influenzae type b (Hib), and meningococcal vaccines, ideally 2 weeks pre- or postoperatively.\n\nPost-splenectomy sepsis from encapsulated organisms (Streptococcus pneumoniae, H. influenzae, Neisseria meningitidis) occurs in 4% of splenectomized patients; risk is highest in children under 16. Children <6 years should also receive prophylactic penicillin."
    difficulty: easy
    tags: [splenectomy, post-splenectomy sepsis, vaccines, encapsulated organisms]
  - front: "What is Gardasil 9's dosing schedule and how does the number of doses relate to age at vaccination?"
    back: "Gardasil 9 dosing: 2-dose schedule for individuals who receive the first dose before age 15 (second dose given 6-12 months after first dose). 3-dose schedule (0, 2, 6 months) for those aged ≥15 years and for immunocompromised individuals regardless of age. Approved for both females and males ages 9-45. Contraindicated in pregnancy and breastfeeding (limited data).\n\nThe 2-dose schedule for younger adolescents is effective because the immune response to HPV vaccine is more robust in pre-adolescents compared to older individuals, achieving similar immunogenicity with fewer doses. Vaccination before sexual debut provides maximum protection but remains beneficial even in sexually active individuals as they are unlikely to be infected with all HPV strains simultaneously."
    difficulty: easy
    tags: [HPV vaccine, Gardasil 9, dosing, vaccination schedule]
