# General Surgery Hepatobiliary (Surgery) - generated from srs-mccqe1
cards:
  - front: "What are the key features of simple hepatic cysts?"
    back: "Form from biliary ducts that do not communicate with the intrahepatic biliary tree; contain clear fluid. Usually asymptomatic. Always benign. Diagnosed by U/S (well-demarcated, non-enhancing on CT). Treatment only if >4 cm or symptomatic: laparoscopic/open cyst wall removal (unroofing).\n\nSimple hepatic cysts are the most common type. They must be distinguished from cystadenoma (premalignant), echinococcal cyst, and polycystic liver disease based on imaging characteristics and clinical context."
    difficulty: easy
    tags: [liver cysts, hepatic cyst, hepatobiliary surgery, benign liver lesions]
  - front: "What is the association between polycystic liver disease (PCLD) and renal disease?"
    back: "50% of PCLD patients over age 60 have associated polycystic kidney disease. PCLD is most commonly an extra-renal manifestation of autosomal dominant polycystic kidney disease (ADPKD).\n\nPCLD features >20 cysts replacing much of the liver parenchyma. It is more common in females and is typically asymptomatic until the cyst-to-parenchyma ratio exceeds 1, causing mass-effect symptoms."
    difficulty: easy
    tags: [polycystic liver disease, ADPKD, liver cysts, hepatobiliary]
  - front: "What are the clinical complications of choledochal cysts?"
    back: "Recurrent abdominal pain, intermittent jaundice, symptomatic gallstones, pancreatitis, portal hypertension, biliary cirrhosis, cyst rupture, and significantly increased risk of biliary malignancy (cholangiocarcinoma).\n\nCholedochal cysts are congenital malformations of the bile ducts classified by the Todani system. Majority present before age 10. Complete excision with Roux-en-Y hepaticoenterostomy is the treatment; malignancy risk mandates excision."
    difficulty: medium
    tags: [choledochal cyst, biliary surgery, Todani classification, cholangiocarcinoma]
  - front: "What is hydatid (cystic echinococcosis) disease of the liver, and what is the treatment?"
    back: "Infection by Echinococcus granulosus parasite through ingestion of eggs (exposure to dogs, sheep, cattle, etc.). Larvae enter blood/lymph and form hepatic cysts. Treatment: albendazole (anti-helminthic, up to 30% cure), surgical pericystectomy/hepatectomy, or percutaneous PAIR (puncture, aspiration, injection, re-aspiration). Cyst rupture can cause anaphylaxis.\n\nHydatid disease is common in Southern Europe, Middle East, Australasia, and South America. Cyst rupture is dangerous, causing anaphylaxis, eosinophilia, and dissemination. Pre-operative albendazole is given to reduce risk of recurrence."
    difficulty: medium
    tags: [hydatid disease, echinococcosis, liver cysts, parasitic infection]
  - front: "What distinguishes cystadenoma from other liver cysts, and what is the management?"
    back: "Cystadenoma is a rare premalignant cystic neoplasm of the bile ducts. On U/S: anechoic mass with internal septations that are highly echogenic. All complex multiloculated liver cysts (except echinococcal) should be excised due to malignancy risk. Cystadenocarcinoma is the malignant counterpart.\n\nCystadenomas are the most common premalignant liver lesion. They are differentiated from simple cysts by the presence of septations and echogenic content. Elevated CEA and CA19-9 may suggest malignant transformation."
    difficulty: medium
    tags: [liver cystadenoma, premalignant, liver cysts, cystadenocarcinoma]
  - front: "What are the most common organisms in pyogenic liver abscess?"
    back: "Most often polymicrobial: Klebsiella, E. coli, Proteus, Streptococcus, Staphylococcus, and anaerobes.\n\nPyogenic liver abscess is the most common type of liver abscess. Sources include direct spread from biliary tract, portal spread from GI infection, systemic infection (e.g., endocarditis), or direct inoculation. Treatment: prolonged antibiotics (>6 weeks) and percutaneous/surgical drainage."
    difficulty: easy
    tags: [liver abscess, pyogenic abscess, hepatobiliary, infection]
  - front: "What antibiotic regimen is used to treat a pyogenic liver abscess?"
    back: "Prolonged antibiotic therapy for >6 weeks: ceftriaxone + metronidazole, or piperacillin-tazobactam, combined with U/S- or CT-guided percutaneous drainage.\n\nThe goal of treatment is to treat the underlying cause (e.g., biliary source), provide adequate drainage, and eradicate infection. Overall mortality is 15%, with higher rates in elderly, multi-organ failure, and immunocompromised patients."
    difficulty: easy
    tags: [liver abscess, antibiotics, percutaneous drainage, hepatobiliary]
  - front: "What are the imaging characteristics of a cavernous hemangioma of the liver on CT and MRI?"
    back: "CT: well-demarcated hypodense mass with peripheral enhancement on arterial phase and centripetal (fill-in) enhancement on delayed phases. U/S: homogeneous hyperechoic mass. MRI is also used. Biopsy should be avoided due to hemorrhage risk.\n\nHemangioma is the most common benign hepatic tumour (M:F = 3:1). Usually small and asymptomatic; giant hemangiomas (>10 cm) can cause abdominal discomfort or consumptive coagulopathy in children. Treatment is only for symptomatic cases."
    difficulty: easy
    tags: [hepatic hemangioma, benign liver tumour, liver imaging, CT]
  - front: "What is focal nodular hyperplasia (FNH) and how is it distinguished on imaging?"
    back: "FNH is a benign hyperplastic response to a vascular anomaly in the liver. Classic CT finding: central stellate scar surrounded by a homogeneous enhancing lesion. No malignant potential. Confirmed FNH requires no treatment. More common in females of reproductive age.\n\nFNH must be differentiated from hepatic adenoma (which has malignant potential and risk of rupture) and fibrolamellar HCC. MRI and biopsy may be required. Once confirmed as FNH, no further treatment or surveillance is needed."
    difficulty: medium
    tags: [FNH, focal nodular hyperplasia, benign liver, hepatobiliary imaging]
  - front: "What are the risk factors and indications for excision of hepatic adenoma?"
    back: "Risk factors: female, ages 20-50, estrogen use (OCP, pregnancy), metabolic syndrome, anabolic steroids, type 1 glycogen storage disease. Indications for excision: size >5 cm or symptomatic in women; any size in men (due to higher risk of transformation to HCC and spontaneous rupture).\n\nHepatic adenoma is a benign abnormal growth of glandular epithelium. Stop offending agents (OCP, steroids). Risk of transformation to HCC and spontaneous rupture/hemorrhage drives surgical management, especially in men."
    difficulty: medium
    tags: [hepatic adenoma, benign liver tumour, OCP, HCC risk]
  - front: "What are the risk factors for hepatocellular carcinoma (HCC)?"
    back: "Chronic liver inflammation/cirrhosis from any cause, chronic hepatitis B (inherently oncogenic) and hepatitis C, hemochromatosis, alpha-1 antitrypsin deficiency, NASH, OCPs and anabolic steroids, smoking, alcohol, betel nut chewing, and chemical carcinogens (aflatoxin, microcystin, vinyl chloride — vinyl chloride is associated with angiosarcoma).\n\nHCC is the most common primary liver cancer. The key distinction is that hepatitis B can cause HCC without cirrhosis (inherently oncogenic), while hepatitis C causes HCC only in the setting of cirrhosis."
    difficulty: easy
    tags: [HCC, hepatocellular carcinoma, risk factors, cirrhosis, hepatitis B]
  - front: "What tumour marker is elevated in approximately 80% of HCC patients, and what does a triphasic CT show?"
    back: "Alpha-fetoprotein (AFP) is elevated in ~80% of HCC patients. Triphasic CT shows: enhancement on arterial phase with washout on portal venous phase (pathognomonic pattern for HCC).\n\nThe arterial enhancement and venous washout pattern on triphasic CT is characteristic of HCC and can allow diagnosis without biopsy in appropriate clinical settings. ALP, bilirubin, and AFP are the key labs."
    difficulty: easy
    tags: [HCC, AFP, triphasic CT, liver cancer diagnosis]
  - front: "What are the Milan Criteria for liver transplantation in HCC?"
    back: "Single tumour ≤5 cm, OR up to 3 tumours each ≤3 cm, with no macrovascular invasion and no extrahepatic disease.\n\nMilan Criteria are the most widely used transplant criteria for HCC. The UCSF criteria are more liberal (single tumour <6.5 cm, or up to 3 tumours each <4.5 cm, total diameter <8 cm). Toronto Criteria have no tumour size or number restrictions."
    difficulty: medium
    tags: [HCC, liver transplant, Milan criteria, UCSF criteria, transplant criteria]
  - front: "What is the 5-year survival for HCC following complete surgical resection?"
    back: "40-70% after complete resection. Overall 5-year survival for all HCC patients is 18%.\n\nOnly about 10% of HCC patients have resectable tumours due to associated cirrhosis limiting hepatic reserve. Non-surgical options include TACE, RFA, percutaneous ethanol injection, and sorafenib for systemic therapy."
    difficulty: easy
    tags: [HCC, prognosis, liver resection, hepatocellular carcinoma]
  - front: "What is the Child-Turcotte-Pugh (CTP) score used for, and what does it assess?"
    back: "The CTP score estimates prognosis in liver disease and helps determine operative risk. It assesses: bilirubin, albumin, INR/PT, presence/severity of ascites, and grade of hepatic encephalopathy. Class A (5-6): best prognosis; Class B (7-9): intermediate; Class C (10-15): worst prognosis.\n\nCTP Class A has ~85% 1-year survival, Class B ~57%, Class C ~35%. Cirrhosis is a relative contraindication to tumour resection due to decreased hepatic reserve, making CTP scoring critical for surgical planning."
    difficulty: medium
    tags: [Child-Turcotte-Pugh, liver cirrhosis, liver function, surgical risk]
  - front: "What are the most common sources of secondary (metastatic) liver disease, and what is the treatment for colorectal liver metastases?"
    back: "Most common primary sites: colorectal (most common), lung, breast, pancreas, GI NET, melanoma, ovary, uterus, kidney, and gallbladder. For colorectal metastases: hepatic resection combined with chemotherapy is standard of care if complete resection of primary and metastases is possible; 5-year survival 30-60%.\n\nSecondary liver metastases are the most common malignant liver tumour. Their presence indicates Stage IV disease. Colorectal liver metastases are unique in that resection provides the greatest chance of cure among all metastatic cancers."
    difficulty: easy
    tags: [liver metastases, colorectal cancer, secondary liver cancer, metastasectomy]
  - front: "What is the MELD score and how is it used in liver transplantation?"
    back: "Model for End-Stage Liver Disease (MELD) estimates 3-month survival following TIPS and is used to prioritize patients awaiting liver transplant. It is based on: creatinine, bilirubin, INR, sodium (MELD-Na), female sex, and serum albumin. Higher MELD score = higher priority for transplant allocation.\n\nMELD replaced the CTP score for organ allocation in Canada and the US. It is an objective, continuous score that correlates with mortality risk while awaiting transplant."
    difficulty: medium
    tags: [MELD score, liver transplantation, organ allocation, end-stage liver disease]
  - front: "What are the absolute contraindications to liver transplantation?"
    back: "Active alcohol/substance use, extrahepatic malignancy within 5 years, advanced cardiopulmonary disease, and active uncontrolled infection.\n\nLiver transplant is indicated for decompensated cirrhosis, unresectable primary liver cancers, acute liver failure, and liver-based metabolic conditions. Contraindications ensure appropriate patient selection given the scarcity of donor organs."
    difficulty: easy
    tags: [liver transplantation, contraindications, organ allocation, transplant surgery]
  - front: "What are the post-liver transplant complications and what is the leading cause of mortality?"
    back: "Complications include: primary non-function (requires urgent re-transplantation), acute/chronic rejection, ischemia-reperfusion injury, vascular complications (hepatic artery or portal vein thrombosis, IVC obstruction), biliary complications (fever, increasing bilirubin and ALP), and immunosuppression-related issues (HTN, renal disease, DM, malignancy). Leading cause of post-transplant mortality: infection.\n\nImmunosuppression is life-saving for graft survival but creates vulnerability to opportunistic infections. One-year patient survival is ~85%, with graft survival >80% at 1 year and 60-70% at 5 years."
    difficulty: medium
    tags: [liver transplantation, post-op complications, rejection, infection]
  - front: "What are the risk factors for cholesterol gallstones (the classic 4 F's)?"
    back: "The 4 F's: Fat (obesity), Female, Fertile (multiparity/estrogen use), and Forties (increasing age >40). Additional factors include impaired gallbladder emptying (DM, TPN, starvation), rapid weight loss, and OCP use.\n\nCholesterol stones make up 80% of gallstones in North America. They form due to an imbalance between cholesterol and its solubilizing agents (bile salts and lecithin), leading to cholesterol supersaturation and precipitation."
    difficulty: easy
    tags: [cholelithiasis, gallstones, cholesterol stones, risk factors, biliary tract]
  - front: "What conditions predispose to pigment gallstone formation?"
    back: "Black pigment stones: conditions increasing systemic bilirubin — chronic hemolytic anemias (especially sickle cell disease), ineffective erythropoiesis, ileal disease, extended ileal resection, and liver cirrhosis. Brown pigment stones: bile stasis from obstruction and biliary infection (especially E. coli).\n\nPigment stones (calcium bilirubinate) account for 20% of gallstones in North America. Understanding the distinction between black and brown pigment stones is clinically relevant for identifying the underlying cause."
    difficulty: easy
    tags: [pigment gallstones, cholelithiasis, sickle cell, biliary tract]
  - front: "What is the diagnostic procedure of choice for cholelithiasis, and what is its specificity?"
    back: "Ultrasound (U/S) is the diagnostic procedure of choice; 95% specific for detecting gallstones.\n\nU/S is non-invasive, inexpensive, and reliable for gallstones. It images for signs of inflammation, obstruction, and stone localization. Normal bloodwork (CBC, LFTs, bilirubin, lipase) is expected in uncomplicated cholelithiasis."
    difficulty: easy
    tags: [cholelithiasis, ultrasound, gallstones, diagnosis, biliary tract]
  - front: "How does biliary colic differ clinically from acute cholecystitis?"
    back: "Biliary colic: transient gallstone impaction in the cystic duct without infection; steady, severe dull pain for minutes to hours (<6 h), crescendo-decrescendo pattern, no peritoneal findings, no systemic signs, normal bloodwork. Acute cholecystitis: sustained impaction causing inflammation; constant pain >6 h, fever, Murphy's sign, elevated WBC, requires antibiotics and cholecystectomy.\n\nThe key distinction is that biliary colic pain resolves (stone dislodges) and has no peritoneal signs, while cholecystitis pain is constant with local peritoneal findings (Murphy's sign). Biliary colic is managed with analgesia and elective cholecystectomy."
    difficulty: easy
    tags: [biliary colic, cholecystitis, gallbladder, differential diagnosis]
  - front: "What is Murphy's sign, and in which condition is it found?"
    back: "Murphy's sign: arrest of inspiration when the examiner's fingers are pressed deeply beneath the right costal margin. It occurs in acute cholecystitis when the inflamed gallbladder descends and contacts the examiner's fingers causing pain. Sonographic Murphy's sign is the U/S equivalent.\n\nMurphy's sign is a classic finding of acute cholecystitis. U/S has 98% sensitivity for cholecystitis; HIDA scan is used if U/S is negative. Signs on U/S include gallbladder wall thickening >4 mm, pericholecystic fluid, and sonographic Murphy's sign."
    difficulty: easy
    tags: [Murphys sign, acute cholecystitis, physical examination, biliary tract]
  - front: "What are the complications of acute cholecystitis?"
    back: "Gangrenous gallbladder (20%, most common), perforation (may cause abscess or local peritonitis), Mirizzi syndrome, empyema (suppurative cholecystitis), emphysematous cholecystitis (gas in gallbladder wall; risk in diabetics), and cholecystoenteric fistula (may lead to gallstone ileus).\n\nEmphysematous cholecystitis from gas-forming organisms (C. welchii, E. coli, Klebsiella) is particularly dangerous in diabetic patients and requires urgent surgery. Gangrenous cholecystitis indicates ischemic necrosis and is the most common complication."
    difficulty: medium
    tags: [cholecystitis complications, gangrenous gallbladder, emphysematous cholecystitis, biliary surgery]
  - front: "What is the Critical View of Safety (CVS) in laparoscopic cholecystectomy?"
    back: "CVS requires three criteria before clipping the cystic duct and artery: 1) The hepatocystic triangle is cleared of fat and fibrous tissue; 2) The lower one-third of the gallbladder is dissected free from the liver bed; 3) Only two structures (cystic duct and cystic artery) are seen entering the gallbladder.\n\nCVS is the standard safety measure to reduce CBD injury during laparoscopic cholecystectomy. CBD injury occurs in 0.3-0.5% of cases. Rouviere's sulcus (fissure between right lobe and caudate) is a useful landmark to keep dissection anterior to."
    difficulty: medium
    tags: [laparoscopic cholecystectomy, CVS, critical view of safety, bile duct injury]
  - front: "When is intraoperative cholangiography (IOC) indicated during laparoscopic cholecystectomy?"
    back: "Indications for IOC: clarify bile duct anatomy, history of biliary pancreatitis, small gallstones with a wide cystic duct (>15 mm), and jaundice. IOC has largely been replaced by preoperative MRCP.\n\nIOC involves injection of radiographic contrast into the cystic duct during laparoscopic cholecystectomy to identify CBD stones, clarify biliary anatomy, and prevent CBD injury. MRCP provides equivalent information non-invasively pre-operatively."
    difficulty: easy
    tags: [IOC, intraoperative cholangiography, cholecystectomy, MRCP, biliary anatomy]
  - front: "What is acalculous cholecystitis, and who is at risk?"
    back: "Acute or chronic cholecystitis in the absence of gallstones, typically due to gallbladder ischemia and stasis. Occurs in 10% of acute cholecystitis cases. Risk factors: ICU admission (most common), DM, immunosuppression, trauma, TPN, and sepsis.\n\nAcalculous cholecystitis is seen in critically ill patients. HIDA scan is the most useful confirming study (non-filling gallbladder). Management is IV antibiotics and cholecystectomy (or percutaneous cholecystostomy if unstable)."
    difficulty: easy
    tags: [acalculous cholecystitis, ICU, gallbladder ischemia, biliary tract]
  - front: "What is choledocholithiasis, and what imaging is the non-invasive diagnostic test of choice?"
    back: "Choledocholithiasis is the presence of stones in the common bile duct (CBD). Clinically: RUQ tenderness, acholic stool, dark urine, and fluctuating jaundice. MRCP (90% sensitive) is the non-invasive diagnostic test of choice for visualizing the ampullary region and biliary/pancreatic anatomy.\n\nSecondary CBD stones are the most common form (85%), arising from the gallbladder. ERCP is both diagnostic and therapeutic for CBD stones but carries risks of pancreatitis (1-2%) and biliary sepsis. MRCP avoids these risks for initial diagnosis."
    difficulty: easy
    tags: [choledocholithiasis, CBD stones, MRCP, ERCP, biliary tract]
  - front: "What are the complications of ERCP for CBD stones?"
    back: "Retained stones, ERCP-induced pancreatitis (1-2%), pancreatic or biliary sepsis.\n\nERCP allows sphincterotomy and stone removal from the CBD. Despite its therapeutic utility, ERCP carries procedural risks. Post-ERCP pancreatitis is the most common complication. Elective cholecystectomy after successful ERCP is recommended in 25% of patients."
    difficulty: easy
    tags: [ERCP, complications, post-ERCP pancreatitis, choledocholithiasis]
  - front: "What is Charcot's triad and Reynolds' pentad in acute cholangitis?"
    back: "Charcot's triad: fever, RUQ pain, and jaundice. Reynolds' pentad: Charcot's triad + hypotension + altered mental status (indicates suppurative/severe cholangitis).\n\nAcute cholangitis results from obstruction of the CBD (most commonly by choledocholithiasis, 60%), leading to biliary stasis and bacterial overgrowth. The most common organisms are E. coli, Klebsiella, Enterobacter, and anaerobes (mnemonic KEEPS)."
    difficulty: easy
    tags: [acute cholangitis, Charcots triad, Reynolds pentad, biliary sepsis]
  - front: "What is the initial management of acute cholangitis?"
    back: "NPO, fluid and electrolyte resuscitation, ± NG tube, IV antibiotics (treats 80%). Followed by biliary decompression: ERCP + sphincterotomy (first-line), PTC with catheter drainage (if ERCP fails), or open/laparoscopic CBD exploration + T-tube placement. After resolution, elective cholecystectomy to prevent recurrence.\n\nSuppurative cholangitis carries a 20-30% mortality rate, requiring urgent intervention. IV antibiotics cover Gram-negative enteric organisms and anaerobes. Biliary decompression is the definitive treatment."
    difficulty: easy
    tags: [acute cholangitis, ERCP, biliary decompression, antibiotics, management]
  - front: "What is gallstone ileus and what is Rigler's triad?"
    back: "Gallstone ileus is mechanical bowel obstruction caused by a large gallstone entering the GI tract through a cholecystoenteric fistula (usually duodenal), impacting near the ileocecal valve. Rigler's triad on plain X-ray: pneumobilia (air in biliary tree), small bowel obstruction, and ectopic gallstone (usually in right iliac fossa).\n\nDespite the name, gallstone ileus is a true mechanical obstruction, not a functional ileus. It is a complication of recurrent cholecystitis causing a fistula between the gallbladder and bowel. Treatment is enterolithotomy; the fistula is typically not repaired at the time of emergency surgery."
    difficulty: medium
    tags: [gallstone ileus, Riglers triad, bowel obstruction, cholecystoenteric fistula]
  - front: "What is Bouveret's syndrome?"
    back: "Gastric outlet obstruction caused by a large gallstone passing through a cholecystoduodenal fistula and impacting in the duodenum.\n\nBouveret's syndrome is a rare form of gallstone ileus where the gallstone obstructs the duodenum (proximal GI tract) rather than the ileocecal valve. It presents with gastric outlet obstruction symptoms (vomiting, epigastric pain)."
    difficulty: medium
    tags: [Bouverets syndrome, gallstone ileus, gastric outlet obstruction, biliary fistula]
  - front: "What is the treatment for gallstone ileus?"
    back: "Fluid resuscitation, NG tube decompression, then surgery: enterolithotomy (removal of impacted stone), inspection of the entire small and large bowel for additional proximal stones. The cholecystoenteric fistula is generally NOT addressed at the time of emergency surgery. Cholecystectomy is generally not performed acutely.\n\nEmergency surgery focuses on relieving the obstruction. The fistula may resolve spontaneously or be addressed electively. Simultaneous fistula repair increases operative risk and is deferred unless the patient is stable and the surgeon experienced."
    difficulty: medium
    tags: [gallstone ileus, enterolithotomy, bowel obstruction, surgery]
  - front: "A 35-year-old woman on OCP presents with incidentally found 6 cm heterogeneously enhancing liver lesion. What is the most likely diagnosis, and how should it be managed?"
    back: "Hepatic adenoma. Stop OCP immediately. Given size >5 cm in a woman, surgical excision is indicated due to risk of HCC transformation and spontaneous rupture/hemorrhage.\n\nHepatic adenoma is strongly associated with OCP use in women aged 20-50. Lesions >5 cm (or any size in men) require excision. CT shows well-demarcated mass with heterogeneous arterial enhancement, isodense on venous phase without washout."
    difficulty: hard
    tags: [hepatic adenoma, OCP, liver tumour, surgical management]
  - front: "A 55-year-old man with cirrhosis has a 4 cm arterially enhancing liver lesion with portal venous washout on triphasic CT and AFP of 800. What is the diagnosis and management?"
    back: "Hepatocellular carcinoma (HCC). Given the cirrhosis, surgical resection requires adequate hepatic reserve (relative contraindication). Options: liver transplantation if within Milan criteria (single tumour ≤5 cm), bridging therapy (TACE or RFA) while awaiting transplant. If not transplant-eligible: TACE, RFA, sorafenib.\n\nThe arterial enhancement + venous washout pattern on triphasic CT is diagnostic for HCC in a cirrhotic liver. AFP >400 is highly suggestive. Milan criteria determine transplant eligibility. Extrahepatic disease and vascular invasion are absolute contraindications to transplant."
    difficulty: hard
    tags: [HCC, cirrhosis, liver transplant, TACE, Milan criteria]
  - front: "A 70-year-old diabetic woman in the ICU develops fever, RUQ pain, and leukocytosis. U/S shows a thickened gallbladder wall with sludge but no stones. What is the diagnosis and management?"
    back: "Acalculous cholecystitis. Manage with NPO, IV fluids, IV broad-spectrum antibiotics, and cholecystectomy. If the patient is unstable for surgery, percutaneous cholecystostomy is the alternative. HIDA scan (non-filling gallbladder) is the most useful confirmatory test if U/S is inconclusive.\n\nAcalculous cholecystitis occurs in critically ill patients due to gallbladder ischemia and stasis (ICU, DM, immunosuppression are key risk factors). Mortality is high if untreated. Percutaneous cholecystostomy is a temporizing measure for poor surgical candidates."
    difficulty: hard
    tags: [acalculous cholecystitis, ICU, HIDA scan, percutaneous cholecystostomy]
  - front: "A 60-year-old woman presents with fever, jaundice, RUQ pain, hypotension, and confusion. What is the diagnosis, and what is the next step?"
    back: "Reynolds' pentad indicating severe (suppurative) acute cholangitis. Immediate management: IV resuscitation, NPO, IV antibiotics (covering Gram-negatives and anaerobes), and urgent biliary decompression via ERCP + sphincterotomy. If ERCP fails: PTC or surgical CBD exploration.\n\nReynolds' pentad (Charcot's triad + shock + altered mental status) indicates life-threatening suppurative cholangitis with biliary sepsis. Mortality is 20-30%. Urgent biliary decompression is critical. Most common cause is choledocholithiasis (60%)."
    difficulty: hard
    tags: [acute cholangitis, Reynolds pentad, ERCP, biliary sepsis, emergency management]
  - front: "What are protective factors against cholesterol gallstone formation?"
    back: "Statins, physical activity, vitamin C, polyunsaturated and monounsaturated fats, nuts, and coffee.\n\nStatins reduce cholesterol secretion into bile. Physical activity and dietary factors improve gallbladder motility and alter bile composition. These factors are relevant for counseling patients with risk factors for gallstone disease."
    difficulty: easy
    tags: [cholelithiasis, gallstone prevention, protective factors, biliary tract]
  - front: "When should prophylactic cholecystectomy be considered for asymptomatic cholelithiasis?"
    back: "Consider prophylactic cholecystectomy in: increased malignancy risk (choledochal cysts, Caroli's disease, porcelain/calcified gallbladder), sickle cell disease, pediatric patients, patients undergoing bariatric surgery, and immunosuppressed patients.\n\nMost asymptomatic gallstones (80%) do not require treatment; only 18% progress to symptomatic disease within 20 years. Prophylactic cholecystectomy is reserved for high-risk groups where complications or malignant transformation are more likely."
    difficulty: easy
    tags: [cholelithiasis, prophylactic cholecystectomy, asymptomatic gallstones, sickle cell]
  - front: "What is the timing preference for laparoscopic cholecystectomy in acute cholecystitis?"
    back: "Early cholecystectomy (within 72 hours) is preferred over delayed (after 6 weeks). Early and delayed have equal morbidity and mortality, but early results in shorter hospitalization and recovery time. Emergent OR is indicated for high-risk presentations (e.g., sepsis).\n\nCanadian guidelines align with international evidence that early cholecystectomy is the standard of care for acute cholecystitis. Delaying surgery does not reduce complications and increases readmission risk. ERCP should be performed prior to surgery if CBD stones are present."
    difficulty: easy
    tags: [acute cholecystitis, laparoscopic cholecystectomy, timing, early vs delayed]
  - front: "What is percutaneous transhepatic cholangiography (PTC) and when is it used?"
    back: "PTC is a percutaneous approach to the proximal (intrahepatic) biliary system via hepatic parenchyma. Used for: proximal bile duct obstruction, when ERCP fails or is unavailable. Contraindications: ascites, peri/intrahepatic sepsis, right lower lung/pleural disease. Complications: bile peritonitis, chylothorax, pneumothorax, biliary sepsis, hemobilia.\n\nPTC complements ERCP for biliary access when distal obstruction cannot be crossed endoscopically. It provides access to the intrahepatic biliary system, which ERCP cannot reach in cases of proximal obstruction (e.g., hilar cholangiocarcinoma)."
    difficulty: medium
    tags: [PTC, percutaneous transhepatic cholangiography, biliary obstruction, interventional radiology]
