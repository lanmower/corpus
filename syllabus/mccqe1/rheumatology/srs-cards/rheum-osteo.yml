# Osteoarthritis & Gout (Rheumatology) - generated from srs-mccqe1
cards:
  - front: "What are the characteristic X-ray features of osteoarthritis in a hand joint?"
    back: "Joint space narrowing, subchondral sclerosis, osteophytes (bone spurs), and subchondral cysts — no periarticular osteopenia\n\nOA affects cartilage and subchondral bone without systemic inflammation. This contrasts with RA (periarticular osteopenia, uniform joint space loss, erosions) and gout (punched-out erosions with overhanging edges)."
    difficulty: easy
    tags: [osteoarthritis, X-ray, joint-space-narrowing, osteophytes]
  - front: "A 65-year-old woman has knee pain that worsens with activity and improves with rest. Examination shows bony enlargement, crepitus, and decreased ROM. What is the most appropriate initial therapy?"
    back: "Exercise therapy (aerobic + strengthening) and weight loss for overweight patients\n\nExercise is the cornerstone of OA management per OARSI and Canadian guidelines. Strengthening the quadriceps reduces knee load. Weight loss of 10% significantly reduces knee OA symptoms. Topical NSAIDs are preferred over oral in elderly."
    difficulty: medium
    tags: [osteoarthritis, knee, exercise, weight-loss, OARSI]
  - front: "Which joints are characteristically involved in primary nodal osteoarthritis?"
    back: "DIP joints (Heberden nodes), PIP joints (Bouchard nodes), and CMC-1 (base of thumb)\n\nNodal OA is the most common form in women post-menopause. DIP and PIP bony enlargements (osteophytes) are characteristic. CMC-1 OA causes \"square hand\" deformity. These joints are typically spared in RA."
    difficulty: easy
    tags: [osteoarthritis, Heberden-nodes, Bouchard-nodes, DIP, PIP]
  - front: "What is the preferred analgesic for osteoarthritis pain in elderly patients?"
    back: "Acetaminophen up to 3–4 g/day (or 2 g/day in heavy alcohol users) as first-line; topical diclofenac as adjunct\n\nOral NSAIDs carry GI, renal, and CV risks in elderly. Topical NSAIDs (diclofenac gel) provide similar analgesia to oral NSAIDs with less systemic absorption. Opioids are third-line only for refractory OA not eligible for surgery."
    difficulty: medium
    tags: [osteoarthritis, acetaminophen, topical-NSAID, elderly, analgesic]
  - front: "Intra-articular corticosteroid injection is used for knee OA. What is the maximum recommended frequency?"
    back: "No more than 3–4 times per year in the same joint\n\nFrequent intra-articular steroid injections accelerate cartilage loss. Short-term pain relief (2–8 weeks) is the goal. Patients with inflammatory flares (effusions, warmth) respond best. Hyaluronic acid injections have modest evidence."
    difficulty: easy
    tags: [osteoarthritis, intra-articular-corticosteroid, knee, injection-frequency]
  - front: "What criteria indicate referral for total knee replacement (TKR)?"
    back: "Moderate-severe OA with functional limitation, inadequate pain relief despite 3+ months of conservative therapy, and patient willing/fit for surgery\n\nTKR improves pain and function in end-stage knee OA. Patient readiness and fitness (cardiac, metabolic optimization) are key. Average Canadian wait time exceeds 6 months; timely referral is essential."
    difficulty: medium
    tags: [osteoarthritis, total-knee-replacement, surgical-referral, knee]
  - front: "Which risk factor most strongly predicts progression from normal to symptomatic knee OA?"
    back: "Obesity (BMI >30)\n\nEach unit increase in BMI increases knee OA risk significantly. Adipose tissue secretes pro-inflammatory adipokines (leptin, adiponectin) that directly affect cartilage. Weight loss is the only intervention shown to slow radiographic OA progression."
    difficulty: medium
    tags: [osteoarthritis, obesity, risk-factor, BMI, progression]
  - front: "What is calcium pyrophosphate deposition (CPPD) disease and how does it present acutely?"
    back: "Crystal arthropathy caused by calcium pyrophosphate crystals; acute CPPD (pseudogout) presents as acute mono-/oligoarthritis most commonly in the knee with chondrocalcinosis on X-ray\n\nCPPD/pseudogout is often triggered by illness or surgery. Synovial fluid shows positively birefringent (weakly) rhomboid-shaped crystals under polarized microscopy. Treatment: NSAIDs, colchicine, or intra-articular steroids."
    difficulty: medium
    tags: [CPPD, pseudogout, chondrocalcinosis, crystal-arthropathy, knee]
  - front: "What is the role of glucosamine/chondroitin supplements in OA management per Canadian guidelines?"
    back: "Not routinely recommended — evidence for pain relief and structural benefit is insufficient\n\nOARSI 2019 guidelines: glucosamine/chondroitin are not recommended due to inconsistent evidence. Some patients report symptomatic benefit. They are safe but should not replace evidence-based therapies."
    difficulty: easy
    tags: [osteoarthritis, glucosamine, chondroitin, supplement, evidence]
  - front: "A 70-year-old woman with known knee OA presents with a large, tense knee effusion after a fall. Aspiration reveals turbid fluid with 40,000 WBC and positive Gram stain. What is the diagnosis?"
    back: "Septic arthritis (bacterial joint infection) — not OA flare\n\nSeptic arthritis requires urgent joint drainage and IV antibiotics. S. aureus is the most common organism. High WBC (>50,000 strongly suggests infection), positive Gram stain, or positive culture confirms diagnosis. Treat as emergency."
    difficulty: hard
    tags: [septic-arthritis, knee-effusion, WBC, Gram-stain, emergency]
  - front: "What is acute gout management?"
    back: "NSAIDs (indomethacin/naproxen), colchicine (1.2mg then 0.6mg 1h later), or corticosteroids. DO NOT start/change ULT during acute flare\n\nULT (allopurinol, febuxostat) starts after flare resolution, with prophylaxis (colchicine 0.6mg daily x6 months). Target urate <360umol/L. Allopurinol start low (100mg), titrate slowly."
    difficulty: medium
    tags: [gout, treatment]
  - front: "What are the clinical and radiographic features of OA?"
    back: "Clinical: pain with activity, stiffness <30min, bony enlargement, crepitus. XR: joint space narrowing, osteophytes, subchondral sclerosis, subchondral cysts. Labs normal\n\nClinical diagnosis - XR not required. Severity of XR changes correlates poorly with symptoms. Common joints: knee, hip, hand (DIP>PIP, 1st CMC), spine. No blood markers for OA."
    difficulty: medium
    tags: [OA, radiographic, diagnosis]
  - front: "What is the stepwise management of knee OA?"
    back: "1st: exercise + weight loss + education. 2nd: topical NSAIDs, acetaminophen. 3rd: oral NSAIDs (lowest dose/shortest). 4th: IA corticosteroid. 5th: TKA. No evidence for glucosamine or IA hyaluronic acid\n\nExercise is most effective non-surgical intervention. 5-10% weight loss significantly reduces symptoms. Max 3-4 IA steroid/year/joint. OARSI guidelines. Physiotherapy referral for structured exercise program."
    difficulty: hard
    tags: [knee OA, management, exercise]
  - front: "When is joint replacement indicated for OA?"
    back: "Severe pain limiting function despite optimal conservative treatment, significant QoL impact, radiographic severe joint destruction. No age cutoff. Pre-op: weight loss, smoking cessation, prehab\n\nProsthesis lasts 15-20yr. Infection risk 1-2%. DVT prophylaxis post-op. Periprosthetic joint infection: urgent orthopedic referral. BMI >40 increases surgical risk."
    difficulty: hard
    tags: [joint replacement, TKA, OA]
  - front: "What are the modifiable risk factors for OA?"
    back: "Obesity (strongest modifiable - 4kg less knee load per 1kg weight loss), joint injury (ACL tear = 4-6x OA risk), occupational repetitive loading, malalignment, muscle weakness\n\nExercise does NOT cause OA in normal joints. Quadriceps strengthening protects knee. No pharmacological prevention. Weight management is most impactful modifiable intervention."
    difficulty: medium
    tags: [OA, risk factors, prevention]
  - front: "What are the risks of NSAIDs in OA management?"
    back: "GI: bleeding 2-4x (add PPI if >=65 or history). CV: increased events (naproxen safest). Renal: avoid eGFR<30. HTN worsening. Celecoxib: lower GI risk. Topical NSAIDs: minimal systemic risk (first-line)\n\nAvoid NSAIDs + anticoagulants. Avoid in HF. Short courses preferred. Drug interactions: warfarin, lithium, methotrexate, antihypertensives. Topical diclofenac gel effective with minimal systemic absorption."
    difficulty: hard
    tags: [NSAIDs, adverse effects, OA]
  - front: "What is erosive OA?"
    back: "Inflammatory OA subtype: DIP/PIP, central erosions (gull-wing pattern on XR), intermittent inflammatory flares, female predominance. Differentiate from RA (DIP, no RF/CCP) and PsA (no skin/nail findings)\n\nErosive OA: central (not marginal) erosions distinguishes from RA. Management: same as OA + colchicine or HCQ for inflammatory flares. Self-limited inflammatory episodes. Does not respond to DMARDs."
    difficulty: hard
    tags: [erosive OA, inflammatory, differential]
  - front: "What is the role of IA injections in OA?"
    back: "Corticosteroid: short-term relief 4-8wk, max 3-4/yr/joint. Hyaluronic acid: NOT recommended. PRP: insufficient evidence. US guidance improves accuracy especially for hip\n\nIA steroid for acute flare. Repeated injections may accelerate cartilage loss. Avoid if septic joint suspected. Post-injection flare 24-48h possible. Monitor glucose in diabetics for 48-72h."
    difficulty: medium
    tags: [intra-articular, corticosteroid, OA]
  - front: "What non-pharmacological treatments have best evidence in OA?"
    back: "Strong: land-based exercise, aquatic exercise, weight loss, self-management. Moderate: assistive devices (cane, brace), PT, OT. Weak: acupuncture, TENS\n\nExercise adherence is main challenge. Group programs, telehealth improve adherence. Quadriceps for knee, hip strengthening for hip OA. Cane in contralateral hand. OT for hand OA (splints, adaptive devices)."
    difficulty: medium
    tags: [non-pharmacological, exercise, OA]
  - front: "How is hand OA managed?"
    back: "Splinting (thumb CMC), exercises, topical NSAIDs (first-line Rx), acetaminophen, oral NSAIDs short-term. Surgery for severe 1st CMC. OT for adaptive devices\n\n1st CMC very common and debilitating. Thumb spica splint provides relief. Heberden (DIP) and Bouchard (PIP) nodes are bony. No DMARDs for hand OA. Avoid disuse from over-splinting."
    difficulty: medium
    tags: [hand OA, splinting, management]
  - front: "What is the differential for acute monoarthritis?"
    back: "Septic arthritis (emergency), gout, CPPD, trauma, reactive arthritis, OA flare, hemarthrosis. MUST aspirate if infection possible: WBC, crystals, gram stain, culture\n\nSeptic: >50k WBC, >75% PMN. Gout: neg birefringent needles. CPPD: pos birefringent rhomboids. Inflammatory: 2-50k WBC. Non-inflammatory: <2k. Never miss septic arthritis."
    difficulty: hard
    tags: [monoarthritis, septic arthritis, aspiration]
  - front: "A 50-year-old male presents with acute monoarthritis of the first MTP joint with severe pain, redness, and swelling. He recently started hydrochlorothiazide. What is the most likely diagnosis and definitive diagnostic test?"
    back: "Acute gout (podagra). Definitive diagnosis: joint aspiration showing negatively birefringent, needle-shaped monosodium urate crystals under polarized light microscopy. Synovial fluid will show inflammatory WBC count (>2000-50,000). Acute treatment: NSAIDs, colchicine, or corticosteroids. Thiazide diuretics are a common precipitant as they reduce urate excretion.\n\nThe first MTP joint is the classic location for gout (podagra), though any joint can be affected. Joint aspiration is essential to differentiate gout from septic arthritis, which is a medical emergency. Serum uric acid may be paradoxically normal or even low during an acute flare and should not be used to rule out gout."
    difficulty: medium
    tags: [joint-pain, gout, crystal-arthropathy, rheumatology, joint-aspiration]
  - front: "How do you differentiate septic arthritis from gout and pseudogout in a patient with acute monoarthritis?"
    back: "All three: joint aspiration is MANDATORY. Septic arthritis: WBC >50,000 (often >100,000), >90% PMNs, positive Gram stain/culture, no crystals. Gout: negatively birefringent needle-shaped crystals. Pseudogout (CPPD): positively birefringent rhomboid-shaped crystals, chondrocalcinosis on X-ray. Septic arthritis is the most dangerous — if suspected, treat empirically with IV antibiotics pending culture.\n\nSeptic arthritis and crystal arthropathy can coexist, so the presence of crystals does not exclude infection. A hot, swollen joint with fever and markedly elevated WBC count in the synovial fluid should be treated as septic arthritis until cultures are finalized. Staphylococcus aureus is the most common organism in native joints."
    difficulty: hard
    tags: [joint-pain, septic-arthritis, gout, pseudogout, differential-diagnosis, joint-aspiration]
  - front: "A 25-year-old sexually active male presents with acute monoarthritis of the knee, fever, and skin pustules on an erythematous base. What is the most likely diagnosis?"
    back: "Disseminated gonococcal infection (DGI). The classic triad is migratory polyarthralgia → monoarthritis, tenosynovitis, and dermatitis (painless papules/pustules). Diagnosis: joint aspiration for Gram stain/culture plus NAAT from urogenital, rectal, and pharyngeal sites. Treat with IV ceftriaxone followed by oral cefixime, plus treat for concurrent chlamydia.\n\nGonococcal arthritis is the most common cause of septic arthritis in sexually active young adults. Joint fluid cultures are positive in only 25-50% of cases, so NAAT testing from mucosal sites improves diagnostic yield. All sexual partners within 60 days should be treated, and the patient should be tested for other STIs including HIV."
    difficulty: medium
    tags: [joint-pain, gonococcal, septic-arthritis, STI, rheumatology, infectious-disease]
  - front: "What is fibromyalgia and how is it diagnosed?"
    back: "Widespread pain >=3 months + widespread pain index (WPI) >=7 + symptom severity scale (SSS) >=5, OR WPI 4-6 + SSS >=9. No alternative explanation. Associated: fatigue, cognitive dysfunction, sleep disturbance\n\nCentral sensitization disorder. Treatment: exercise (strongest evidence), CBT, duloxetine/milnacipran (SNRIs), pregabalin/gabapentin. Avoid opioids. Multimodal approach essential. Reassurance and education."
    difficulty: medium
    tags: [fibromyalgia, diagnosis]
  - front: "What are the ACR criteria for fibromyalgia and what is the current treatment approach?"
    back: "ACR 2010/2016 criteria: Widespread Pain Index (WPI) ≥7 + Symptom Severity Score (SSS) ≥5, OR WPI 4-6 + SSS ≥9; symptoms present ≥3 months; NOT better explained by another diagnosis. Key symptoms: widespread pain, fatigue, unrefreshing sleep, cognitive difficulties ('fibro fog'), headaches, IBS symptoms, depression/anxiety. Treatment: Education (validate symptoms, explain central sensitization); Exercise (aerobic + strengthening — strongest evidence); Pharmacotherapy: duloxetine 60 mg/day (SNRI), pregabalin 150-450 mg/day, milnacipran (SNRI), amitriptyline low-dose (10-50 mg); CBT for pain management; Sleep hygiene; Avoid opioids (ineffective, risk of dependence).\n\nFibromyalgia is a central sensitization syndrome — the CNS amplifies pain signals. It affects ~2-4% of the population (predominantly female). Canadian Pain Society guidelines emphasize multimodal treatment combining exercise, education, and pharmacotherapy. Duloxetine and pregabalin are the only Health Canada-approved medications specifically for fibromyalgia."
    difficulty: medium
    tags: [fibromyalgia, central sensitization, duloxetine, pregabalin, rheumatology]
  - front: "What is the ED management of an acute gout flare (crystalline synovitis)?"
    back: "NSAIDs at high dose (first-line), colchicine within first 24 hours, or corticosteroids. Do NOT start allopurinol during an acute flare — it may worsen the attack.\n\nGout is caused by monosodium urate crystal deposition. Colchicine is most effective within the first 24–36 hours of a flare. Allopurinol (urate-lowering therapy) changes serum urate levels, which can mobilize crystals and prolong or worsen an acute flare — it should only be started 2–4 weeks after resolution, with concurrent prophylaxis."
    difficulty: easy
    tags: [gout, crystalline synovitis, colchicine, NSAIDs, allopurinol]
