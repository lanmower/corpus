# Pediatrics Infectious (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the pathogens and antibiotic treatment for septic arthritis/osteomyelitis by age group in children?"
    back: "Neonates (<1 mo): GBS, S. aureus, Gram-negative bacilli (E. coli) → Cloxacillin + gentamicin OR cloxacillin + cefotaxime. Infants (1-3 mo): Kingella kingae, Strep spp., Staph spp., H. influenzae type B → Cefazolin IV then cephalexin PO OR cloxacillin + cefotaxime OR cefuroxime. Children (3 mo–11 yr): Kingella kingae (<4 yr), S. aureus (>4 yr), S. pneumoniae, GAS → Cefazolin IV then cephalexin PO. Adolescents (>12 yr): Same + N. gonorrhoeae → Ceftriaxone OR cefixime + azithromycin.\n\nSeptic arthritis is a medical emergency requiring prompt IV antibiotics until systemically well/ambulating/blood cultures if positive become negative, followed by 4 weeks of oral antibiotics (4-6 weeks for septic arthritis of the hip). S. aureus is the dominant pathogen beyond infancy. Kingella kingae is an important pathogen in young children (3 months to 4 years). N. gonorrhoeae must be covered in sexually active adolescents. (CPS/Toronto Notes 2025)"
    difficulty: hard
    tags: [pediatrics, infectious-disease, septic-arthritis, osteomyelitis, antibiotics, pathogens]
  - front: "What is Lyme Arthritis in children, and why is doxycycline avoided in children under 8 years?"
    back: "Lyme arthritis is caused by the spirochete Borrelia burgdorferi (transmitted by Ixodes tick). Incidence is highest in children aged 5-10 years. Arthritis is typically monoarticular, involving the knee. Treatment: doxycycline is NOT used in children <8 years because it may cause permanent tooth discolouration (dental enamel hypoplasia). Alternative antibiotics (amoxicillin or cefuroxime) are used in younger children.\n\nLyme disease is endemic in parts of Canada (Ontario, Manitoba, Nova Scotia, British Columbia). Arthritis typically presents as a large joint monoarthritis (knee most common) weeks to months after initial infection. The restriction on doxycycline in children under 8 years is due to tetracycline class effects on developing teeth and bones. Older children and adults can receive doxycycline as first-line therapy."
    difficulty: medium
    tags: [pediatrics, infectious-disease, Lyme-disease, arthritis, doxycycline, Borrelia]
  - front: "What did the MELODY trial demonstrate about RSV prevention in infants?"
    back: "MELODY trial (NEJM 2022): RCT of 1490 infants born at ≥35 weeks gestational age. Randomized 2:1 to nirsevimab (monoclonal antibody against RSV) vs. placebo. Result: RSV infections within 150 days occurred in 1.2% of the nirsevimab group vs. 5% of the placebo group. Conclusion: Nirsevimab provides effective protection of late-preterm and full-term infants from RSV infection.\n\nNirsevimab (Beyfortus) is a long-acting monoclonal antibody against RSV prefusion F protein, approved in Canada for RSV prevention in all infants in their first RSV season (unlike palivizumab which was limited to high-risk groups). RSV is the most common cause of bronchiolitis and a leading cause of infant hospitalization. Nirsevimab provides passive immunization without the need for repeated monthly injections."
    difficulty: medium
    tags: [pediatrics, infectious-disease, RSV, nirsevimab, MELODY-trial, prevention, bronchiolitis]
