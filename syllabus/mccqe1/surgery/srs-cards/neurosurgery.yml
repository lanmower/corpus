# Neurosurgery (Surgery) - generated from srs-mccqe1
cards:
  - front: "What is the classic presentation of subarachnoid hemorrhage?"
    back: "Sudden onset (seconds) 'thunderclap' headache described as the 'worst headache of my life,' usually after exertion. Associated with N/V, photophobia, meningismus, and decreased LOC.\n\nSAH is caused by ruptured aneurysm in 75-80% of spontaneous cases. CT without contrast is 98% sensitive within 12 hours. If CT is negative but suspicion is high, LP should be performed looking for xanthochromia and elevated RBCs. ~30-60% of patients have a prior sentinel bleed."
    difficulty: easy
    tags: [neurosurgery, SAH, cerebrovascular disease]
  - front: "What are the most common locations for saccular (berry) aneurysms?"
    back: "Anterior communicating artery (30%), posterior communicating artery (25%), middle cerebral artery (20%), basilar tip (7%).\n\n85-95% are in the carotid (anterior) system. Risk factors include smoking, HTN, adult polycystic kidney disease, Ehlers-Danlos syndrome, and family history. Rupture risk increases with size; unruptured aneurysms >10 mm are generally treated."
    difficulty: easy
    tags: [neurosurgery, aneurysm, SAH]
  - front: "What is vasospasm after SAH and how is it managed?"
    back: "Vasoconstriction causing delayed cerebral ischemia, onset 4-14 days post-SAH (peak 6-8 days). Treatment: nimodipine (neuroprotection), hyperdynamic therapy (fluids and pressors after aneurysm secured), and angioplasty for refractory cases.\n\nNimodipine 60 mg PO q4h x 21 days is the only validated neuroprotective agent. Symptomatic vasospasm occurs in 20-30% of SAH patients. Risk factors include large amount of blood on CT (high Fisher grade), smoking, and older age. DCI is a major cause of morbidity after SAH."
    difficulty: hard
    tags: [neurosurgery, vasospasm, SAH]
  - front: "What is the classic sequence of epidural hematoma presentation?"
    back: "Post-traumatic reduced LOC → lucid interval of several hours → obtundation, hemiparesis, ipsilateral pupillary dilation → coma.\n\nThis classic 'talk and die' presentation is seen in <30% of cases. Most epidural hematomas are from ruptured middle meningeal artery after temporal-parietal skull fracture. CT shows lenticular-shaped hyperdensity. Urgent craniotomy is needed unless the clot is small (<30 mL), thin (<15 mm), with minimal midline shift and GCS >8."
    difficulty: easy
    tags: [neurosurgery, epidural hematoma, head trauma]
  - front: "What is the ICH score used for and what are its components?"
    back: "Predicts mortality in intracerebral hemorrhage. Components: GCS (13-15=0, 5-12=1, 3-4=2), ICH volume (≥30 cm³=1), presence of IVH (yes=1), infratentorial origin (yes=1), age ≥80 (yes=1).\n\nICH accounts for ~10% of strokes with 44% 30-day mortality. HTN is the most common cause (bleeds at putamen, thalamus, pons, cerebellum). Treatment includes BP reduction to 140/90, reversal of anticoagulation, ICP control, and seizure prophylaxis. Corticosteroids should NOT be used."
    difficulty: medium
    tags: [neurosurgery, ICH, cerebrovascular disease]
  - front: "What is the Spetzler-Martin AVM grading scale?"
    back: "Points for: Size (<3cm=1, 3-6cm=2, >6cm=3), location (non-eloquent=0, eloquent=1), and venous drainage (superficial=0, deep=1). Grades I-II are surgical candidates; higher grades have more risk.\n\nAVMs are tangles of abnormal vessels with arteriovenous shunts and no intervening capillary beds. They present with hemorrhage (40-60%), seizures (50%), and steal phenomena. Untreated, they carry a 2-4% annual risk of major bleed. Treatment options include surgery, stereotactic radiosurgery, and embolization."
    difficulty: hard
    tags: [neurosurgery, AVM, vascular malformations]
  - front: "What is the approach to cerebral abscess management?"
    back: "Aspiration/excision with Gram stain and C&S, empiric antibiotics (vancomycin + ceftriaxone + metronidazole for 6-8 weeks), anticonvulsants for 1-2 years, and follow-up with MRI.\n\nStreptococcus is the most common pathogen. The abscess shows ring enhancement on CT and restricted diffusion on MRI (DWI positive, ADC dark — distinguishes from tumor which is ADC bright). Mortality is ~10% with appropriate therapy but 50% have permanent deficits."
    difficulty: medium
    tags: [neurosurgery, cerebral abscess, CNS infection]
  - front: "What is the rebleed risk after SAH and how is it prevented?"
    back: "4% on day 1, 15-20% within 2 weeks, 50% by 6 months. Prevention: early clipping or coiling of the aneurysm (within 48-96 hours).\n\nRebleeding is a major cause of mortality after SAH. Per the ISAT trial, endovascular coiling showed greater survival benefit at 1 year compared to clipping for ruptured aneurysms suitable for both treatments, with the benefit sustained at 10 years. However, rebleeding was slightly more common with coiling."
    difficulty: medium
    tags: [neurosurgery, SAH, aneurysm treatment]
  - front: "What are the red flags for back pain suggesting serious pathology (mnemonic BACK PAIN)?"
    back: "B: Bowel/Bladder dysfunction. A: Anesthesia (saddle). C: Constitutional symptoms. K: Khronic disease. P: Paresthesia. A: Age >50 or <20. I: IV drug use. N: Neuromotor deficits.\n\nCauda equina syndrome (urinary retention/incontinence, fecal incontinence, saddle anesthesia, bilateral leg weakness) is a surgical emergency. Malignancy red flags include age >50, cancer history, and pain unrelieved by bed rest. Infection red flags include elevated ESR, IVDU, and fever."
    difficulty: easy
    tags: [neurosurgery, back pain, red flags]
  - front: "What chronic SDH presentation makes it the 'great imitator'?"
    back: "Presents with global rather than focal deficits: progressive dementia, confusion, gait problems, minor headaches, lightheadedness, and TIA-like symptoms. Can mimic dementia, tumors, and other conditions.\n\nChronic SDH occurs ≥15 days after bleeding onset, often in elderly patients, alcoholics, and those on anticoagulants. CT shows hypodense crescentic collection crossing suture lines. Treatment is burr hole drainage of liquefied clot if symptomatic or >1 cm thick."
    difficulty: medium
    tags: [neurosurgery, chronic SDH, head trauma]
  - front: "What is the classic presentation of an epidural hematoma?"
    back: "Post-traumatic loss of consciousness, followed by a lucid interval of several hours, then rapid deterioration with obtundation, contralateral hemiparesis, and ipsilateral pupillary dilation.\n\nThe classic 'lucid interval' is seen in <30% of cases. 85% are caused by ruptured middle meningeal artery from temporal-parietal skull fracture. CT shows a lenticular (biconvex) hyperdense mass limited by suture lines. This is a neurosurgical emergency requiring urgent craniotomy. Prognosis is good with prompt treatment."
    difficulty: easy
    tags: [neurosurgery, epidural-hematoma, head-trauma]
  - front: "How do you differentiate an epidural hematoma from a subdural hematoma on CT?"
    back: "Epidural: lenticular (biconvex) shape, limited by suture lines, usually from arterial bleeding (middle meningeal artery). Subdural: crescentic shape, crosses suture lines, usually from ruptured bridging veins.\n\nEpidural hematomas are typically associated with skull fracture and have a better prognosis when treated promptly because the underlying brain is often undamaged. Acute subdural hematomas have 40-60% mortality because the brain parenchyma is often injured. Chronic SDH is hypodense on CT."
    difficulty: medium
    tags: [neurosurgery, epidural-hematoma, subdural-hematoma, head-trauma]
  - front: "What are the risk factors for chronic subdural hematoma?"
    back: "Advanced age, alcoholism, anticoagulant/antiplatelet use, CSF shunts, coagulopathies, cerebral atrophy, and shaken baby syndrome.\n\nChronic SDH develops >15 days after bleeding onset, often from minor or no recalled injuries. It is called 'the great imitator' because it can mimic dementia, tumors, or TIA. Treatment is burr hole drainage of the liquefied clot. Postoperative subdural drains reduce recurrence (RR 0.45)."
    difficulty: easy
    tags: [neurosurgery, subdural-hematoma, chronic-SDH]
  - front: "What is the hallmark presentation of subarachnoid hemorrhage?"
    back: "Sudden onset (seconds) of severe 'thunderclap headache,' described as the 'worst headache of my life,' usually following exertion, accompanied by meningismus, nausea/vomiting, and decreased LOC.\n\nSAH is most commonly caused by trauma; spontaneous SAH is 75-80% due to ruptured aneurysms. Non-contrast CT is 98% sensitive within 12 hours. If CT is negative but suspicion is high, perform LP (xanthochromic CSF). Sentinel bleeds precede full SAH in 30-60% of patients within 3 weeks."
    difficulty: easy
    tags: [neurosurgery, subarachnoid-hemorrhage, SAH]
  - front: "What is the most common location for saccular (berry) aneurysms?"
    back: "Anterior communicating artery (30%), followed by internal carotid/posterior communicating artery (25-30%) and middle cerebral artery (20%).\n\nSaccular aneurysms are the most common type, located at branch points of the circle of Willis. 85-95% are in the anterior circulation. Risk factors include HTN, smoking, polycystic kidney disease, Ehlers-Danlos syndrome, and family history. 20-30% of patients have multiple aneurysms."
    difficulty: easy
    tags: [neurosurgery, intracranial-aneurysm, SAH]
  - front: "What is vasospasm after SAH, and when does it peak?"
    back: "Vasoconstriction and pathological vascular changes in response to blood irritation of vessels, onset 4-14 days post-SAH, peaking at 6-8 days. Symptomatic in 20-30% of patients.\n\nVasospasm can lead to delayed cerebral ischemia (DCI) and death. Risk factors include large blood load on CT (high Fisher grade), smoking, age, and HTN. Treatment: hyperdynamic therapy (fluids + pressors) after aneurysm securing, angioplasty or intra-arterial verapamil for refractory cases. Nimodipine 60 mg q4h x 21d is the only validated neuroprotective agent."
    difficulty: medium
    tags: [neurosurgery, SAH, vasospasm, delayed-cerebral-ischemia]
  - front: "What is nimodipine's role in SAH management?"
    back: "It is the only validated neuroprotective agent for delayed cerebral ischemia post-SAH. Dose: 60 mg PO/NG q4h for 21 days.\n\nAlthough nimodipine is a calcium channel blocker, its benefit in SAH is through neuroprotection rather than vasodilation. IV magnesium and clazosentan reduce DCI and vasospasm respectively but have not shown functional outcome benefit. Statins also showed no neuroprotective benefit in trials."
    difficulty: easy
    tags: [neurosurgery, SAH, nimodipine, neuroprotection]
  - front: "What are the most common locations for hypertensive intracerebral hemorrhage?"
    back: "Basal ganglia/internal capsule (50%), thalamus (15%), cerebral white matter (15%), cerebellum (5%), and pons (15%).\n\nICH accounts for ~10% of strokes with 44% 30-day mortality. Clinical features include gradual onset of symptoms during activity, headache, N/V, and decreased LOC. CT shows hyperdense intraparenchymal blood. Medical treatment targets BP reduction (MAP target ~140/90), ICP control, and coagulopathy reversal."
    difficulty: easy
    tags: [neurosurgery, intracerebral-hemorrhage, ICH, stroke]
  - front: "What is the most common organism causing cerebral abscess?"
    back: "Streptococcus species (often anaerobic or microaerophilic).\n\nCerebral abscess can arise via hematogenous spread (chest source most common in adults), direct implantation, contiguous spread (sinusitis, otitis media), or from PNS. 10-60% have no identifiable cause. MRI with diffusion-weighted imaging is the imaging modality of choice. Treatment: aspiration/excision + empiric vancomycin + ceftriaxone + metronidazole for 6-8 weeks."
    difficulty: easy
    tags: [neurosurgery, cerebral-abscess, CNS-infection]
  - front: "How does MRI differentiate a cerebral abscess from a brain tumor?"
    back: "On diffusion-weighted imaging (DWI), abscess shows restriction (bright on DWI, dark on ADC map), while tumor appears white on ADC map.\n\nBoth abscess and tumor can show ring enhancement on contrast-enhanced MRI. The apparent diffusion coefficient (ADC) map is the key distinguishing feature: abscess appears black (restricted diffusion due to viscous pus) while tumor appears white (facilitated diffusion). Lymphoma can also show restriction on DWI."
    difficulty: medium
    tags: [neurosurgery, cerebral-abscess, neuroimaging]
  - front: "What are the components and scores of the Glasgow Coma Scale?"
    back: "Eye opening (1-4): spontaneous=4, to voice=3, to pain=2, none=1. Verbal (1-5): oriented=5, confused=4, inappropriate=3, incomprehensible=2, none=1. Motor (1-6): obeys=6, localizes=5, withdraws=4, flexion/decorticate=3, extension/decerebrate=2, none=1. Total: 3-15.\n\nGCS is used to classify TBI severity: mild (13-15), moderate (9-12), severe (<8). GCS <8 is an indication for intubation. The motor score is the most predictive component for outcomes. Each component should be recorded individually (e.g., E3V3M5)."
    difficulty: easy
    tags: [neurosurgery, GCS, head-trauma, assessment]
  - front: "What are the criteria for the Canadian CT Head Rule in minor head injury?"
    back: "CT required if any: GCS <15 at 2h, suspected open/depressed skull fracture, any sign of basilar skull fracture, vomiting >=2 episodes, age >=65. Medium risk: retrograde amnesia >30 min, dangerous mechanism.\n\nMinor head injury is defined as witnessed LOC, amnesia, or disorientation with GCS 13-15. High-risk criteria identify patients needing neurosurgical intervention. Medium-risk criteria identify those with brain injury on CT. The rule has 100% sensitivity for identifying need for neurosurgical intervention."
    difficulty: medium
    tags: [neurosurgery, head-trauma, canadian-CT-head-rule]
  - front: "What is the difference between neurogenic shock and spinal shock?"
    back: "Neurogenic shock: hypotension with bradycardia from loss of sympathetic tone below injury level (warm, well-perfused extremities). Spinal shock: transient loss of ALL neurologic function below the injury with areflexia and flaccid paralysis.\n\nNeurogenic shock is hemodynamic, caused by unopposed parasympathetic activity below the injury (usually above T6). It must be distinguished from hemorrhagic shock (tachycardia, cool extremities). Spinal shock resolution is indicated by return of reflexes, most commonly the bulbocavernosus reflex."
    difficulty: medium
    tags: [neurosurgery, spinal-cord-injury, neurogenic-shock, spinal-shock]
  - front: "What are the four incomplete spinal cord syndromes and their classic presentations?"
    back: "1) Brown-Sequard (hemisection): ipsilateral motor loss + proprioception loss, contralateral pain/temp loss. 2) Anterior cord: bilateral motor + pain/temp loss, preserved proprioception. 3) Central cord (most common): upper > lower extremity weakness. 4) Posterior cord: bilateral proprioception loss, preserved motor + pain/temp.\n\nCentral cord syndrome is the most common incomplete SCI, typically from hyperextension injury in an elderly patient with cervical stenosis. Brown-Sequard has the best prognosis. Anterior cord syndrome (from anterior spinal artery occlusion) has the worst prognosis among incomplete injuries."
    difficulty: medium
    tags: [neurosurgery, spinal-cord-injury, spinal-cord-syndromes]
  - front: "At what spinal levels do the most common cervical disc herniations occur, and what nerve roots are affected?"
    back: "C5-C6 (C6 root, 19%): affects biceps reflex, thumb sensation. C6-C7 (C7 root, 69%): affects triceps reflex, middle finger sensation. In the cervical spine, disc herniations impinge the nerve root at the level BELOW the interspace.\n\nUnlike the lumbar spine where roots exit below the pedicle, cervical roots exit above (e.g., C6 root exits between C5 and C6). Pain worsens with neck extension, ipsilateral rotation, and lateral flexion. 95% improve spontaneously in 4-8 weeks. Surgical indications include intractable pain >3 months or progressive neurological deficit."
    difficulty: medium
    tags: [neurosurgery, cervical-disc, radiculopathy]
  - front: "What distinguishes neurogenic claudication from vascular claudication?"
    back: "Neurogenic: dermatomal distribution, relieved by postural changes (sitting, lumbar flexion), induced by standing/walking. Vascular: sclerotomal distribution, relieved by simply resting (stopping exercise), associated with diminished pulses.\n\nNeurogenic claudication results from lumbar spinal stenosis with ischemia of nerve roots. The bicycle test helps distinguish: patients with neurogenic claudication cycle longer because the flexed position opens the spinal canal. Clinical exam may be normal, including straight leg raise. MRI is best for confirming stenosis."
    difficulty: medium
    tags: [neurosurgery, neurogenic-claudication, lumbar-stenosis]
  - front: "What is syringomyelia and what is its most common association?"
    back: "Cystic cavitation of the spinal cord. 70% are associated with Chiari I malformation.\n\nSyringomyelia initially causes pain and weakness, then loss of pain and temperature sensation (spinothalamic tract) in the upper extremities with preserved touch and proprioception (dorsal columns). This 'dissociated sensory loss' is characteristic. Other associations include post-traumatic, tumors, and tethered cord. MRI is the best diagnostic modality."
    difficulty: medium
    tags: [neurosurgery, syringomyelia, spinal-cord]
  - front: "What type of odontoid fracture has the highest risk of non-union?"
    back: "Type II — fracture through the base of the dens, in the watershed zone of blood supply.\n\nOdontoid fractures are the most common C2 fracture. Type I is an avulsion of the tip (stable). Type II is through the base of the dens (most common, highest non-union risk). Type III extends into the C2 vertebral body (lower non-union risk). Type II fractures more often require surgical fixation."
    difficulty: medium
    tags: [neurosurgery, cervical-fracture, odontoid]
  - front: "What are the criteria for neurologically determined death (brain death)?"
    back: "Prerequisites: no CNS depressants, no intoxication, temp >32C, no metabolic derangement. Findings: absent ALL brainstem reflexes (pupillary, corneal, oculocephalic, caloric, pharyngeal, cough) and absent respiratory drive at PaCO2 >=60 mmHg (apnea test). Requires 2 evaluations by 2 specialists.\n\nBrain death is irreversible and diffuse brain injury with absence of all clinical brain function. Cardiovascular activity may persist for up to 2 weeks. Confirmatory tests include flat EEG and absent cerebral perfusion on angiogram. This determination has legal implications for organ donation."
    difficulty: medium
    tags: [neurosurgery, brain-death, neurologically-determined-death]
  - front: "What is the Spetzler-Martin grading scale for AVMs?"
    back: "Three components: Size (<3cm=1, 3-6cm=2, >6cm=3), Location (non-eloquent=0, eloquent=1), Venous drainage (superficial=0, deep=1). Total grade I-V determines surgical risk.\n\nAVMs are tangles of abnormal vessels with direct arteriovenous shunts without capillary beds. They present with hemorrhage (40-60%), seizures (50%), and mass effect. Annual bleed risk is 2-4%. Surgical excision is treatment of choice for Spetzler-Martin grades I-II. SRS is preferred for small (<3cm) or deep lesions."
    difficulty: medium
    tags: [neurosurgery, AVM, spetzler-martin]
  - front: "What are the red flags for back pain that suggest serious underlying pathology (mnemonic: BACK PAIN)?"
    back: "B: Bowel/bladder dysfunction. A: Anesthesia (saddle). C: Constitutional symptoms. K: Khronic disease. P: Paresthesia. A: Age >50 or <20. I: IV drug use. N: Neuromotor deficits.\n\nThese red flags should prompt urgent investigation. Cauda equina syndrome requires emergent MRI and surgical decompression within 48 hours. Malignancy should be suspected with age >50, history of cancer, and pain unrelieved by bed rest. Infection risk increases with IV drug use, immunosuppression, and elevated ESR."
    difficulty: easy
    tags: [neurosurgery, back-pain, red-flags]
  - front: "What is the most common type of myelomeningocele-associated brain malformation?"
    back: "Type II (Arnold-) Chiari malformation, present in 65-85% of myelomeningocele patients.\n\nMyelomeningocele is the most severe common form of spina bifida aperta, involving herniation of meningeal and CNS tissue through a spinal defect. Associated hydrocephalus occurs in 65-85% of patients. Prenatal surgical repair (before 26 weeks) reduces need for CSF shunting from 82% to 40% and improves motor outcomes."
    difficulty: medium
    tags: [neurosurgery, pediatric, myelomeningocele, chiari-malformation]
  - front: "What is a CSF fistula, and how is it confirmed?"
    back: "A communication allowing CSF leak, presenting as otorrhea or rhinorrhea of clear fluid. Confirmed by beta-2 transferrin test (most specific), quantitative glucose analysis, or halo/ring sign.\n\nCSF fistulas occur after head trauma or surgery, or due to high-pressure states. Treatment: lower ICP (avoid straining, acetazolamide), continuous lumbar drainage for persistent leaks. Surgical repair is indicated for leaks lasting >2 weeks, spontaneous leaks, or those complicated by meningitis."
    difficulty: easy
    tags: [neurosurgery, CSF-fistula, head-trauma]
  - front: "What is the Dandy-Walker malformation?"
    back: "Atresia of the foramina of Magendie and Luschka, causing cystic dilation of the 4th ventricle, agenesis/hypoplasia of the cerebellar vermis, enlarged posterior fossa, and hydrocephalus (90%).\n\nDandy-Walker malformation can be detected in utero. Associated anomalies include agenesis of the corpus callosum (17%). Treatment addresses the hydrocephalus, typically with CSF shunting. It should be distinguished from Chiari malformations, which involve herniation of cerebellar structures through the foramen magnum."
    difficulty: medium
    tags: [neurosurgery, pediatric, dandy-walker, hydrocephalus]
  - front: "What is the Papile classification for intraventricular hemorrhage in neonates?"
    back: "Grade I: germinal matrix hemorrhage only. Grade II: IVH without ventricular dilation. Grade III: IVH with ventricular dilation. Grade IV: IVH with parenchymal hemorrhage.\n\nIVH primarily occurs in preterm infants (<32 weeks, <1500g). 50% occurs within 8 hours of birth, 90% by day 3. Grades I-II have favorable prognosis. Grades III-IV have greatest morbidity/mortality and may require VP shunt for posthemorrhagic hydrocephalus. Screening is by routine head ultrasound."
    difficulty: medium
    tags: [neurosurgery, pediatric, intraventricular-hemorrhage, neonatal]
  - front: "What are the three components of Cushing's Triad and what does it indicate?"
    back: "Cushing's Triad consists of: (1) Bradycardia, (2) Hypertension, and (3) Irregular respiratory pattern. It indicates severely raised intracranial pressure (ICP) and is a late, ominous sign of brainstem compression.\n\nCushing's Triad results from the brainstem's response to critical ischemia when ICP approaches MAP. The body attempts to raise MAP to maintain cerebral perfusion pressure (CPP = MAP - ICP), causing reflex bradycardia via baroreceptors. It is seen in only 1/3 of cases with acutely raised ICP and signifies impending herniation."
    difficulty: easy
    tags: [neurosurgery, ICP, brainstem, emergency, herniation]
  - front: "What is the Monro-Kellie doctrine and why is it clinically important?"
    back: "The Monro-Kellie doctrine states that the brain is encased in a rigid skull with a fixed intracranial volume. The intracranial space contains CSF, blood, and brain parenchyma. An increase in one constituent must be compensated by a decrease in another; once compensatory mechanisms are exhausted, ICP rises exponentially.\n\nUnderstanding this doctrine explains why compensatory reserve exists (60-80 mL in young, 100-140 mL in elderly due to cerebral atrophy). Immediate compensation occurs via egress of CSF through foramen magnum and venous blood displacement. Late stages cause decreased CPP, ischemia, cerebral edema, and herniation. Clinically, elderly patients tolerate more volume expansion before decompensation."
    difficulty: easy
    tags: [neurosurgery, ICP, intracranial pressure, physiology]
  - front: "What are the ICP thresholds for initiating treatment and for life-threatening emergency?"
    back: "ICP >25 mmHg: end-organ damage possible, treatment should be initiated. ICP >40 mmHg: life-threatening emergency, urgent pressure reduction required. Normal ICP: 10-15 mmHg in adults, 3-7 mmHg in children, 1.5-6 mmHg in infants.\n\nThese thresholds guide neurosurgical management. Treatment targets are ICP <20 mmHg, CPP 60-70 mmHg, and sBP >100 mmHg (ages 50-69) or >110 mmHg (age <50 or >70). Monitoring ICP is indicated in severe TBI (GCS <8) with abnormal CT, or normal CT with two or more of: age >40, BP <90 mmHg, or abnormal motor posturing."
    difficulty: easy
    tags: [neurosurgery, ICP, TBI, monitoring, thresholds]
  - front: "What is the gold standard method for ICP measurement and what therapeutic advantage does it offer?"
    back: "The intraventricular catheter (External Ventricular Drain, EVD) is the gold standard for ICP measurement. Its therapeutic advantage is that it allows drainage of CSF (3-5 mL) to reduce intracranial volume and lower ICP.\n\nOther monitoring options include parenchymal ICP monitors, Licox monitors (intraventricular, intraparenchymal, subdural), subarachnoid bolt (Richmond screw), and epidural monitors. Non-invasive methods (transcranial Doppler, CT/MRI, fundoscopy) are not accurate enough for routine measurement. Serial LP can be used for monitoring but is not the most accurate and is contraindicated in suspected acutely raised ICP or obstructive hydrocephalus."
    difficulty: medium
    tags: [neurosurgery, ICP, EVD, monitoring, CSF]
  - front: "What are the four types of cerebral edema and their mechanisms?"
    back: "(1) Vasogenic: BBB compromised (meningitis, hypertensive encephalopathy, tumour, late ischemia). (2) Cytotoxic: BBB intact, cell death (early ischemia, brain injury, encephalitis, status epilepticus). (3) Interstitial: transudation of CSF into periventricular white matter in hydrocephalus (transependymal edema). (4) Osmotic: osmotic gradient increases intracellular free H2O (acute hyponatremia, hepatic encephalopathy).\n\nDistinguishing edema type is critical for management. Vasogenic edema responds to dexamethasone (reduces BBB permeability), whereas cytotoxic edema does not. Osmotic edema from acute hyponatremia should not be corrected too rapidly due to risk of central pontine myelinolysis. Interstitial edema resolves with treatment of underlying hydrocephalus."
    difficulty: medium
    tags: [neurosurgery, cerebral edema, ICP, BBB, pathophysiology]
  - front: "What is cerebral perfusion pressure (CPP) and what is its target range in management of elevated ICP?"
    back: "CPP = MAP - ICP. Normal CPP is >50 mmHg. Treatment targets: CPP 60-70 mmHg. Cerebral autoregulation fails when CPP <40 mmHg or MAP >150 mmHg or <50 mmHg.\n\nMaintaining adequate CPP is essential to prevent secondary brain injury. Cerebral autoregulation normally keeps CBF constant across a range of CPP. In brain injury (e.g., SAH, severe trauma), autoregulation is impaired and CBF becomes pressure-passive. The brain receives approximately 15% of cardiac output (~750 mL/min). Increased CO2 and decreased O2 (<50 mmHg) both cause cerebral vasodilation and increased CBF."
    difficulty: medium
    tags: [neurosurgery, CPP, CBF, autoregulation, TBI]
  - front: "Describe the stepwise management of elevated ICP using the ICP HEAD mnemonic."
    back: "ICP HEAD: (I)CP — treat primary etiology; (H)ead — elevate head of bed 30° in neutral position; (E)levate — adequate BP (maintain sBP targets); (A)dequate BP — prevent hypotension; (D)iuretic — mannitol or hypertonic saline. Plus: Calm (sedate), Coma (barbiturate-induced), Place drain (EVD), Paralysis (vecuronium), Hyperventilate (pCO2 30-35 mmHg briefly).\n\nThe mnemonic helps prioritize interventions. Mannitol 20% IV at 1-1.5 g/kg reduces ICP within 15-30 min by increasing serum tonicity. 3% hypertonic saline is comparable to mannitol. Dexamethasone reduces vasogenic edema around tumours/abscesses but has no proven value in head injury or stroke. Hyperventilation is a temporizing measure only — avoid within 24h of trauma. Decompressive craniectomy is definitive for refractory ICP."
    difficulty: medium
    tags: [neurosurgery, ICP, management, TBI, mannitol]
  - front: "What are the 5 types of herniation syndromes and their key clinical features?"
    back: "(1) Subfalcine: cingulate gyrus under falx — usually asymptomatic, warns of impending transtentorial herniation. (2) Central (tentorial): diencephalon through tentorial notch — small fixed pupils, decreased LOC, sunset eyes. (3) Uncal (lateral tentorial): uncus through tentorial notch — ipsilateral dilated unreactive pupil (earliest sign), CN III palsy, decreased LOC, contralateral hemiplegia. (4) Upward: cerebellar vermis through tentorial incisura — cerebellar infarct, hydrocephalus. (5) Tonsillar: cerebellar tonsils through foramen magnum — neck stiffness, flaccid paralysis, respiratory arrest.\n\nUncal herniation is the most clinically recognized: the earliest and most reliable sign is an ipsilateral non-reactive dilated pupil due to CN III compression. Kernohan's notch is a false localizing sign where ipsilateral hemiplegia occurs due to the edge of tentorium compressing the contralateral cerebral peduncle. Tonsillar herniation can be precipitated by LP in the presence of an intracranial mass — hence the importance of CT before LP in suspected elevated ICP."
    difficulty: hard
    tags: [neurosurgery, herniation, uncal, ICP, brainstem, emergency]
  - front: "What is the earliest and most reliable sign of uncal (lateral tentorial) herniation?"
    back: "Ipsilateral non-reactive dilated pupil due to compression of CN III (oculomotor nerve), accompanied by ipsilateral EOM paralysis and ptosis.\n\nThe uncus of the temporal lobe herniates downward through the tentorial notch, compressing CN III which runs along the edge of the tentorium. CN III carries parasympathetic pupilloconstrictor fibres on its outer surface, so compression causes a blown pupil (mydriasis) before other signs. This is distinguished from a direct CN III palsy (e.g., from a posterior communicating artery aneurysm), which also presents with a dilated pupil. Decreased LOC follows due to midbrain compression."
    difficulty: medium
    tags: [neurosurgery, herniation, uncal, CN III, pupil, emergency]
  - front: "What is Kernohan's notch and why is it a false localizing sign?"
    back: "Kernohan's notch is a false localizing sign in uncal herniation where ipsilateral hemiplegia occurs because the edge of the tentorium compresses the contralateral cerebral peduncle. This produces ipsilateral (same side as lesion) rather than expected contralateral weakness.\n\nIn uncal herniation, the expected finding is contralateral hemiplegia (corticospinal tract decussates in the medulla). However, when the herniating uncus pushes the brainstem against the opposite tentorial edge, it compresses the contralateral cerebral peduncle — causing ipsilateral motor weakness relative to the mass. This can mislead clinicians about the laterality of the causative lesion. Kernohan's notch is one of the classic false localizing signs in neurosurgery."
    difficulty: hard
    tags: [neurosurgery, herniation, false localizing sign, Kernohan, hemiplegia]
  - front: "What is idiopathic intracranial hypertension (pseudotumour cerebri) and what are the Modified Dandy's Criteria for diagnosis?"
    back: "IIH is raised ICP with papilledema without mass, hydrocephalus, infection, or hypertensive encephalopathy. Modified Dandy's Criteria: (1) Symptoms of raised ICP; (2) No localizing signs except CN VI palsy; (3) Patient awake and alert; (4) Normal neuroimaging without evidence of mass; (5) LP opening pressure >25 cm H2O with normal CSF; (6) No better explanation for raised ICP.\n\nIIH predominantly affects obese women of childbearing age (incidence 19-21/100,000/yr in this group vs. 1-2/100,000/yr general population). Risk factors overlap with venous sinus thrombosis ('fat, female, fertile, forties'). Associated causes include hypervitaminosis A, steroid withdrawal, tetracycline, amiodarone, lithium, oral contraceptives, growth hormone, and retinoids. CN VI palsy is an exception to the 'no localizing signs' criterion due to CN VI's long intracranial course making it vulnerable to ICP changes."
    difficulty: medium
    tags: [neurosurgery, IIH, pseudotumour cerebri, papilledema, diagnosis]
  - front: "Which medications must be used with caution in elevated ICP and why?"
    back: "Nitroprusside: raises ICP via direct arterial vasodilation (arterial > venous) → increased cerebral blood volume. Nitroglycerin: raises ICP via vasodilation but less so (venous > arterial). Succinylcholine: induced fasciculations may transiently increase ICP.\n\nThese drugs are commonly used in critical care but can worsen intracranial hypertension. Nitroprusside is of particular concern in neurosurgical patients with mass lesions. When blood pressure control is needed, agents with less effect on cerebral vasculature are preferred. Succinylcholine's ICP-raising effect is generally mild and brief, but alternatives (rocuronium) are preferred in refractory ICP situations."
    difficulty: medium
    tags: [neurosurgery, ICP, pharmacology, nitroprusside, succinylcholine]
  - front: "What are the consequences of a lesion in each major brain region: frontal lobe, parietal lobe (dominant vs. non-dominant), temporal lobe, and occipital lobe?"
    back: "Frontal lobe: abulia, disinhibition, apathy, executive dysfunction, + primitive reflexes, contralateral UMN signs. Parietal lobe (dominant/left): aphasias, Gerstmann's syndrome. Parietal lobe (non-dominant/right): hemispatial neglect, apraxias, agnosias. Temporal lobe: hippocampus → anterograde amnesia; upper homonymous hemianopia; Wernicke's aphasia (left). Occipital lobe: contralateral homonymous hemianopia.\n\nGerstmann's syndrome (dominant parietal) includes acalculia, agraphia, finger agnosia, and left-right disorientation. Broca's area (posterior inferior frontal gyrus, dominant): non-fluent aphasia, impaired repetition, spared comprehension. Wernicke's area (posterior superior temporal gyrus, dominant): fluent aphasia, impaired repetition and comprehension. Non-dominant parietal also causes dressing apraxia and cortical sensory loss. These localization patterns are high-yield for MCCQE1."
    difficulty: medium
    tags: [neurosurgery, neuroanatomy, brain lesions, aphasia, localization]
  - front: "What is Broca's aphasia and how does it differ from Wernicke's aphasia?"
    back: "Broca's aphasia (posterior inferior frontal gyrus, dominant hemisphere): non-fluent, dysarthric speech; impaired repetition; comprehension spared. Wernicke's aphasia (posterior superior temporal gyrus, dominant hemisphere): fluent but paraphasic speech; impaired repetition; comprehension impaired.\n\nBroca's area is typically in the left inferior frontal gyrus (Brodmann areas 44, 45). Damage produces effortful, telegraphic speech with preserved comprehension — patients are often distressed by their deficit. Wernicke's area is in the posterior superior temporal gyrus; damage produces fluent but meaningless speech (jargon aphasia) with poor comprehension — patients are often unaware of the deficit. Both have impaired repetition, distinguishing them from transcortical aphasias."
    difficulty: medium
    tags: [neurosurgery, neurology, aphasia, Broca, Wernicke, localization]
  - front: "What are the consequences of brainstem lesions at different levels?"
    back: "Dorsal midbrain (pineal gland): Parinaud's syndrome (supranuclear upward gaze palsy). Pons: locked-in syndrome. Below red nucleus (midbrain): decerebrate posture. Above red nucleus: decorticate posture. CPA (cerebellopontine angle): disequilibrium, ataxia, CN V/VII/VIII deficits. Reticular activating system (midbrain): reduced level of arousal.\n\nParinaud's syndrome (dorsal midbrain syndrome) classically occurs with pinealoma or hydrocephalus compressing the tectum — features include upgaze palsy, convergence-retraction nystagmus, and lid retraction. Locked-in syndrome (bilateral ventral pontine infarct) spares consciousness but causes quadriplegia and anarthria with preserved vertical gaze. Decorticate posturing (flexion of arms, extension of legs) indicates a lesion above the red nucleus; decerebrate (extension of all limbs) indicates a lesion below."
    difficulty: hard
    tags: [neurosurgery, brainstem, localization, Parinaud, locked-in, posturing]
  - front: "What is the frontal eye field rule for gaze deviation in frontal vs. cortical lesions?"
    back: "Destructive lesion of frontal eye fields: gaze deviates TOWARD the side of the lesion (eyes look at the lesion). Irritative lesion (e.g., seizure): gaze deviates AWAY from the irritative focus.\n\nThe frontal eye fields (FEF, Brodmann area 8) normally drive conjugate eye movements to the contralateral side. A destructive lesion removes this drive, so the intact contralateral FEF pushes gaze toward the lesion side ('looking at the stroke'). During a focal seizure, the FEF is hyperactive, driving gaze contralaterally — away from the irritative focus ('looking away from the seizure'). This distinction is useful in localizing acute stroke vs. seizure activity."
    difficulty: medium
    tags: [neurosurgery, neurology, frontal eye fields, gaze palsy, localization]
  - front: "What are the consequences of cerebellar hemisphere vs. cerebellar vermis lesions?"
    back: "Cerebellar hemisphere: intention tremor, ipsilateral limb ataxia (SAME side as lesion), fall toward the side of lesion. Cerebellar vermis: truncal ataxia, dysarthria.\n\nCerebellar lesions produce ipsilateral deficits because the cerebellum controls the ipsilateral side of the body (double decussation of motor pathways). Hemisphere lesions affect limb coordination (finger-nose ataxia, heel-shin ataxia), while vermis lesions affect axial coordination (gait and truncal balance) and speech. Fall toward the lesion side is a classic exam finding. DASHING mnemonic for cerebellar signs: Dysdiadochokinesis, Ataxia, Slurred speech, Hypotonia, Intention tremor, Nystagmus, Gait disturbance."
    difficulty: medium
    tags: [neurosurgery, cerebellum, ataxia, localization, vermis]
  - front: "What are the indications for ICP monitoring in severe TBI?"
    back: "ICP monitoring is indicated for: (1) Severe TBI (GCS <8T) with abnormal CT scan. (2) Severe TBI with normal CT if two or more of: age >40, BP <90 mmHg, abnormal motor posturing. ('T' in GCS <8T refers to intubation, tracheostomy, or factors affecting verbal response.)\n\nThese indications are based on Brain Trauma Foundation guidelines. An abnormal CT includes SAH, hematoma, contusion, basal cistern compression, swelling, and herniation with GCS <8. ICP monitoring guides management of CPP, guides diuretic use, and determines need for surgical decompression. EVD remains gold standard as it allows therapeutic CSF drainage in addition to monitoring."
    difficulty: medium
    tags: [neurosurgery, TBI, ICP monitoring, GCS, indications]
  - front: "What is the approach to time of onset in intracranial pathology (vascular vs. metabolic vs. infectious vs. tumour)?"
    back: "Vascular: sudden onset (occlusive = no headache; hemorrhagic = headache). Metabolic: hours to days, affects entire CNS. Infectious: days to weeks, often with source of infection or immunodeficiency on history. Tumour: months, with increasing ICP (headache worse in morning, wakes from sleep; later blurry vision, projectile vomiting, then Cushing's triad).\n\nThis temporal approach is fundamental to neurosurgical differential diagnosis. Vascular causes (stroke, hemorrhage) present acutely. Tumours classically cause morning headaches due to overnight CO2 retention causing vasodilation and increased ICP during recumbency. Projectile vomiting in raised ICP may initially occur without nausea, distinguishing it from gastrointestinal causes. This framework helps prioritize urgent investigations."
    difficulty: easy
    tags: [neurosurgery, differential diagnosis, ICP, intracranial mass, vascular]
  - front: "What are the categories of spinal tumours by location and their relative frequency?"
    back: "Extradural (55% of all spinal tumours): lymphoma, metastases (lymphoma, lung, breast, prostate), neurofibroma. Intradural extramedullary (40%): meningioma, schwannoma, neurofibroma. Intradural intramedullary (5%): gliomas, ependymomas, hemangioblastomas, dermoids.\n\nExtradural tumours are most common and are predominantly metastatic — the spine is the most common site of bony metastases. The classic triad of spinal cord compression (pain, weakness, sensory loss) is an oncologic emergency. Intradural extramedullary tumours are mostly benign (meningioma, schwannoma) and surgically resectable. Intramedullary tumours are rarest; ependymoma is most common in adults, astrocytoma in children."
    difficulty: medium
    tags: [neurosurgery, spinal tumours, metastases, spine, epidemiology]
  - front: "What is decompressive craniectomy and what does the DECRA trial show about its outcomes in TBI?"
    back: "Decompressive craniectomy removes a portion of the skull to allow the swollen brain to expand outside the cranial vault, reducing ICP and risk of herniation. The DECRA trial: in TBI with refractory ICP >25 mmHg, craniectomy resulted in lower mortality (18% vs. 26%) but higher rates of vegetative state and severe disability (21.9% vs. 14.4% upper severe disability; 15.4% vs. 8.0% moderate disability) compared to medical management.\n\nThe DECRA trial demonstrated a survival-disability trade-off — craniectomy saves lives but many survivors have poor functional outcomes. This highlights the importance of patient selection and goals-of-care discussions. The RESCUE-ICP trial subsequently showed similar findings. Craniectomy is considered when ICP is refractory to medical therapy, treating the underlying cause is not feasible, and the patient has reasonable pre-injury functional status."
    difficulty: hard
    tags: [neurosurgery, craniectomy, TBI, DECRA trial, ICP management]
  - front: "What drugs are associated with idiopathic intracranial hypertension (IIH)?"
    back: "Drugs associated with IIH: steroid withdrawal, tetracycline, amiodarone, lithium, nalidixic acid, oral contraceptives, growth hormone, retinoids, and hypervitaminosis A.\n\nIIH is a diagnosis of exclusion requiring Modified Dandy's criteria to be met. The mechanism of drug-induced IIH varies — vitamin A (retinoids, hypervitaminosis A) directly increases CSF production. Tetracycline impairs CSF absorption. Steroid withdrawal causes rebound ICP elevation. Amiodarone causes increased intracranial venous pressure. Risk factors for IIH overlap with those for venous sinus thrombosis (obesity, female sex, reproductive age, 'forties')."
    difficulty: medium
    tags: [neurosurgery, IIH, pseudotumour cerebri, drug-induced, risk factors]
  - front: "What is papilledema and how does it differ from papillitis?"
    back: "Papilledema: optic disc swelling with blurred margins, usually bilateral, due to raised ICP; associated with enlarged blind spot and preserved visual acuity initially. Papillitis: typically unilateral, associated with decreased visual acuity, caused by optic nerve inflammation (e.g., multiple sclerosis).\n\nPapilledema develops because raised ICP is transmitted along the optic nerve sheath (CSF space around the optic nerve), compressing the central retinal vein and causing axoplasmic stasis and disc swelling. It takes 24-48 hours to develop in acute ICP elevation. Chronic papilledema leads to optic atrophy and blindness. Visual obscurations ('grey-outs' lasting ~20 min) and enlarged blind spot are characteristic early visual symptoms of IIH."
    difficulty: medium
    tags: [neurosurgery, papilledema, ICP, optic disc, visual symptoms]
  - front: "What clinical features distinguish acutely elevated ICP from chronically progressive ICP elevation?"
    back: "Acutely elevated ICP: significant GCS decline, prominent N/V, decreased LOC (lethargy if ICP = diastolic BP), CN VI palsy, herniation syndromes, focal deficits. Chronically progressive ICP: irritability, inattentiveness, modestly decreased GCS, obvious papilledema, optic atrophy, enlarged blind spot, visual 'grey-outs', often full extraocular movements.\n\nBoth cause headache aggravated by stooping, coughing, and Valsalva. Morning headache is characteristic of tumours and chronic ICP elevation due to CO2 retention during sleep causing vasodilation. Chronic papilledema can ultimately cause optic atrophy and blindness. Cushing's triad is a late, acute finding. GCS is the best index to monitor progress and predict outcome of acute intracranial processes."
    difficulty: medium
    tags: [neurosurgery, ICP, acute vs chronic, papilledema, GCS]
  - front: "What is the role of hyperventilation in management of raised ICP?"
    back: "Hyperventilation (target pCO2 30-35 mmHg) decreases CBF via vasoconstriction and thus lowers ICP. However, it should only be used for brief periods as a temporizing measure. It should be avoided within 24 hours following trauma.\n\nDecreased pCO2 causes cerebral vasoconstriction, reducing cerebral blood volume and ICP within minutes — making it valuable in acute herniation. However, prolonged hyperventilation causes sustained vasoconstriction that may worsen cerebral ischemia, especially in TBI where autoregulation is impaired. Within 24 hours of trauma, the brain is already at risk of ischemia, making hyperventilation potentially harmful. Normal normocarbia target is pCO2 35-40 mmHg."
    difficulty: medium
    tags: [neurosurgery, ICP, hyperventilation, TBI, management]
  - front: "What are the subthalamic nucleus and basal ganglia lesion findings?"
    back: "Subthalamic nucleus lesion: contralateral hemiballismus (wild, flinging movements). Basal ganglia lesion: resting tremor, chorea, athetosis; hemiplegia if internal capsule (IC) is involved.\n\nHemiballismus is caused by loss of subthalamic nucleus inhibition on the globus pallidus, leading to disinhibition of thalamic projections to the motor cortex and wild, high-amplitude involuntary movements of the contralateral extremities. It is classically associated with lacunar infarct of the subthalamic nucleus (e.g., in diabetic or hypertensive patients). Basal ganglia lesions producing resting tremor, rigidity, and bradykinesia are characteristic of Parkinson's disease pathology."
    difficulty: medium
    tags: [neurosurgery, basal ganglia, subthalamic nucleus, hemiballismus, movement disorders]
  - front: "What is the clinical presentation of Parinaud's syndrome and what causes it?"
    back: "Parinaud's syndrome (dorsal midbrain syndrome): supranuclear upward gaze palsy, convergence-retraction nystagmus, and lid retraction. Caused by lesions compressing the dorsal midbrain/tectum, particularly at the level of the pineal gland.\n\nCommon causes include pinealoma (germ cell tumour), hydrocephalus with compression of the tectal plate (especially in children — 'sunset eyes'), and intrinsic midbrain lesions (AVM, MS plaques). The superior colliculi and pretectum, which coordinate vertical gaze, are compressed. 'Sunset eyes' refers to forced downward deviation of the eyes with limited upward gaze — seen classically in obstructive hydrocephalus with pressure on the tectal plate."
    difficulty: medium
    tags: [neurosurgery, Parinaud syndrome, dorsal midbrain, gaze palsy, pineal]
  - front: "What is the epidemiology of IIH and who is most at risk?"
    back: "General population incidence: ~1-2 per 100,000 per year. Women of childbearing age with obesity: 19-21 per 100,000 per year. Risk factors: obesity, female sex, reproductive age ('fat, female, fertile, forties'), menstrual irregularities, Addison's/Cushing's disease, iron deficiency anemia, polycythemia vera, dural venous sinus thrombosis.\n\nThe dramatically elevated incidence in obese women of childbearing age (up to 21x general population) underscores obesity as a major modifiable risk factor; weight loss is a key treatment strategy in IIH. The pathophysiology is thought to involve elevated venous sinus pressure leading to impaired CSF resorption at the arachnoid granulations. Treatment includes acetazolamide (reduces CSF production), topiramate, repeat LP, and optic nerve sheath fenestration (for vision-threatening cases)."
    difficulty: easy
    tags: [neurosurgery, IIH, pseudotumour cerebri, epidemiology, risk factors]
  - front: "What is the role of dexamethasone in elevated ICP management and when is it contraindicated?"
    back: "Dexamethasone reduces vasogenic edema over subsequent days and is indicated around brain tumours and abscesses. It has NO proven value in head injury or stroke and should not be used in these settings.\n\nDexamethasone works by reducing BBB permeability and decreasing vasogenic edema through anti-inflammatory mechanisms. In tumours, it can provide rapid symptomatic relief (within hours to days). However, in traumatic brain injury, the CRASH trial showed dexamethasone increased mortality — it is contraindicated. In ischemic stroke, steroids may worsen hyperglycemia and increase infection risk without benefit. In hemorrhagic stroke, there is also no benefit."
    difficulty: medium
    tags: [neurosurgery, dexamethasone, ICP, steroids, contraindications]
  - front: "What are the classic symptoms of idiopathic intracranial hypertension (IIH)?"
    back: "Headache (>90%), nausea, transient visual obscurations, pulsatile tinnitus, diplopia (CN VI palsy), neck/back pain.\n\nIIH presents with signs of raised ICP without a structural cause. CN VI palsy is a non-localizing sign due to the long intracranial course of the nerve. The major morbidity is blindness/severe visual impairment (6-24% risk)."
    difficulty: easy
    tags: [neurosurgery, IIH, pseudotumour cerebri, intracranial pressure]
  - front: "What are the LP findings required to diagnose idiopathic intracranial hypertension (IIH)?"
    back: "Opening pressure >25 cmH2O with normal CSF analysis (no cells, normal protein/glucose).\n\nThe elevated opening pressure confirms raised ICP, while the normal CSF composition excludes infection or inflammatory causes. IIH is a diagnosis of exclusion requiring normal MRI/CT and normal CSF composition."
    difficulty: easy
    tags: [neurosurgery, IIH, lumbar puncture, CSF]
  - front: "What MRI findings are characteristic of idiopathic intracranial hypertension (IIH)?"
    back: "Slit-like ventricles and distended perioptic subarachnoid space; otherwise normal brain parenchyma. Rule out venous sinus thrombosis, mass, infection, and hydrocephalus.\n\nThe distended perioptic subarachnoid space reflects transmitted raised ICP around the optic nerve sheath. Slit-like ventricles result from diffuse pressure. Venous sinus thrombosis must be ruled out as it is a secondary cause."
    difficulty: medium
    tags: [neurosurgery, IIH, MRI, imaging]
  - front: "What is the first-line pharmacotherapy for idiopathic intracranial hypertension (IIH)?"
    back: "Acetazolamide (carbonic anhydrase inhibitor that decreases CSF production); also thiazide diuretics or furosemide. Combined with low-sodium weight-reduction diet.\n\nThe IIHTT trial demonstrated that acetazolamide with low-sodium weight-reduction diet resulted in significant improvement in perimetric mean deviation, papilledema grade, and ICP reduction compared to diet alone. Weight loss is also an important lifestyle intervention."
    difficulty: easy
    tags: [neurosurgery, IIH, acetazolamide, treatment]
  - front: "What surgical options are available for IIH refractory to medical management?"
    back: "Serial LPs (temporizing), optic nerve sheath fenestration (for progressive visual acuity impairment), shunt placement (VP or lumboperitoneal).\n\nOptic nerve sheath fenestration is preferred when the primary threat is visual loss rather than headache. VP and lumboperitoneal shunts address headache and reduce ICP globally. Serial LPs provide temporary relief but are not a long-term solution."
    difficulty: medium
    tags: [neurosurgery, IIH, surgery, shunt]
  - front: "Describe the normal pathway of CSF flow from production to reabsorption."
    back: "Choroid plexus (lateral ventricles) → interventricular foramen of Monro → 3rd ventricle → cerebral aqueduct of Sylvius → 4th ventricle → foramina of Luschka (lateral) and Magendie (median) → subarachnoid space → arachnoid villi/granulations → dural venous sinuses.\n\nUnderstanding CSF flow is essential for classifying hydrocephalus. Obstruction anywhere proximal to the arachnoid granulations causes non-communicating (obstructive) hydrocephalus; impaired reabsorption at or beyond the granulations causes communicating hydrocephalus."
    difficulty: medium
    tags: [neurosurgery, hydrocephalus, CSF, anatomy]
  - front: "How is obstructive (non-communicating) hydrocephalus distinguished from communicating hydrocephalus?"
    back: "Obstructive: CSF flow is blocked within the ventricular system proximal to the arachnoid granulations; CT shows ventricles enlarged proximal to the block. Communicating: CSF absorption is blocked at the extraventricular site (arachnoid granulations); all ventricles are dilated.\n\nIn obstructive hydrocephalus, common causes include aqueductal stenosis, intraventricular tumours, and posterior fossa lesions. In communicating hydrocephalus, post-infectious (most common) and post-hemorrhagic causes predominate. NPH is a subtype of communicating hydrocephalus."
    difficulty: medium
    tags: [neurosurgery, hydrocephalus, classification]
  - front: "What is Hakim's triad and what condition does it describe?"
    back: "Hakim's (Hakim-Adams) triad: ataxia (magnetic gait), urinary incontinence, dementia (subcortical). It describes Normal Pressure Hydrocephalus (NPH).\n\nNPH is a communicating hydrocephalus with persistently dilated ventricles despite normal CSF pressure. Gait disturbance (magnetic gait/apraxia) is typically the first and most prominent symptom due to pressure on lower extremity motor fibres. Dementia is subcortical in character."
    difficulty: easy
    tags: [neurosurgery, NPH, hydrocephalus, Hakim triad]
  - front: "What imaging findings distinguish NPH from other causes of dementia with ventriculomegaly?"
    back: "NPH: enlarged ventricles without increased prominence of cerebral sulci (Evan's index >0.3). Hydrocephalus ex vacuo (e.g., Alzheimer's): enlarged ventricles AND enlarged sulci due to brain atrophy.\n\nIn NPH, the ventriculomegaly is out of proportion to sulcal enlargement because it is pressure-driven, not atrophy-driven. This distinction is critical on CT/MRI. A lumbar tap test (large-volume LP) showing temporary improvement in gait supports the diagnosis and predicts response to shunting."
    difficulty: medium
    tags: [neurosurgery, NPH, hydrocephalus, imaging, dementia]
  - front: "What are the common causes of communicating hydrocephalus (in order of frequency)?"
    back: "1st: Post-infectious (meningitis, abscess, cysticercosis); 2nd: Post-hemorrhagic (SAH, IVH, traumatic); also: leptomeningeal carcinomatosis, choroid plexus papilloma (increased production), idiopathic (NPH).\n\nInflammation and blood products impair CSF reabsorption at the arachnoid granulations. Leptomeningeal carcinomatosis from metastatic disease can also obstruct absorption and is a common cause to consider in cancer patients presenting with new communicating hydrocephalus."
    difficulty: medium
    tags: [neurosurgery, hydrocephalus, communicating, etiology]
  - front: "What are the most common congenital causes of obstructive hydrocephalus?"
    back: "Primary aqueductal stenosis, Dandy-Walker malformation, Arnold-Chiari malformation, myelomeningocele, encephalocele.\n\nCongenital hydrocephalus has an incidence of ~1-2 per 1000 live births. In neonates, aqueductal stenosis is the most common cause. Arnold-Chiari malformation can obstruct CSF flow at the level of the 4th ventricle or foramen magnum."
    difficulty: easy
    tags: [neurosurgery, hydrocephalus, congenital, pediatric]
  - front: "What is the most common shunt complication and how is it investigated?"
    back: "Obstruction is the most common complication. Investigated with a 'shunt series' (plain x-rays of the entire shunt to rule out disconnection, break, tip migration) and radionuclide shuntogram.\n\nShunt obstruction can occur proximally (choroid plexus, proteinaceous/cellular buildup) or distally (disconnection/damage). Clinically it presents with acute hydrocephalus signs. LP is generally NOT recommended if shunt infection is suspected; instead, a tap of the shunt reservoir is used."
    difficulty: medium
    tags: [neurosurgery, shunt, hydrocephalus, complications]
  - front: "What organisms most commonly cause VP shunt infections and what is the infection rate?"
    back: "Most common: S. epidermidis, S. aureus, P. acnes, Gram-negative bacilli. Infection rate: 3-6%.\n\nShunt infections typically present with fever, N/V, anorexia, irritability, meningitis, or peritonitis. Diagnosis includes CBC, blood culture, and tapping the shunt for C&S. VA shunts carry a greater infection risk and risk of septicemia/emboli."
    difficulty: medium
    tags: [neurosurgery, shunt, infection, microbiology]
  - front: "What is overshunting (slit ventricle syndrome) and how does it present?"
    back: "Excess CSF drainage causes collapse of ventricles (slit-like on imaging), leading to occlusion of shunt ports by ependymal lining. Presents with chronic or recurring headache often relieved when lying down. Occurs in ~10% over 6.5 years.\n\nSlit ventricle syndrome is a paradoxical state where shunt ports occlude due to collapsed ventricles, causing intermittent obstruction. SDH can also result from overshunting as the brain 'pulls away' from the dura, tearing bridging veins — this is especially common in NPH patients post-shunting."
    difficulty: hard
    tags: [neurosurgery, shunt, overshunting, slit ventricle]
  - front: "What is the preferred treatment for obstructive hydrocephalus that avoids shunt hardware?"
    back: "Endoscopic Third Ventriculostomy (ETV) ± choroid plexus cauterization (ETV+CPC). Success rate ~56%.\n\nETV creates a communication between the third ventricle and the subarachnoid space, bypassing the obstruction. It is preferred over shunts because it avoids hardware complications. ETV+CPC (adding choroid plexus cauterization) is particularly used in infants. Complications include hypothalamic injury and basilar artery injury."
    difficulty: medium
    tags: [neurosurgery, hydrocephalus, ETV, endoscopy]
  - front: "What is spontaneous intracranial hypotension (SIH) and what is its hallmark symptom?"
    back: "SIH is low CSF pressure secondary to spontaneous CSF leakage from the thecal sac within/along the spinal canal. Hallmark: orthostatic headache (worse upright, relieved supine) in 75-80% of patients.\n\nSIH is likely underdiagnosed (incidence ~2-5/100,000/yr). The orthostatic component reflects gravitational traction on pain-sensitive intracranial structures when CSF volume is reduced. Additional symptoms include tinnitus/auditory disturbance ('underwater feeling') in 50%, dizziness, N/V, photophobia."
    difficulty: medium
    tags: [neurosurgery, intracranial hypotension, CSF leak, headache]
  - front: "What are the MRI brain findings in spontaneous intracranial hypotension?"
    back: "Sagging of the brain (low cerebellar tonsils), pachymeningeal (dural) enhancement, subdural hematoma or hygroma, pituitary hyperemia.\n\nThe dural enhancement is due to venous engorgement and dural vasodilation compensating for low CSF volume (Monro-Kellie doctrine). Brain sagging reflects loss of CSF buoyancy. Subdural collections form from bridging vein tension. CT myelogram with contrast is the preferred method to localize the CSF leak."
    difficulty: medium
    tags: [neurosurgery, intracranial hypotension, MRI, imaging]
  - front: "What is the LP finding in spontaneous intracranial hypotension and what is the mainstay treatment?"
    back: "LP: opening pressure <6 cmH2O; xanthochromia, elevated protein, lymphocytic pleocytosis. Mainstay treatment: epidural blood patch (10-20 mL autologous blood injected into epidural space).\n\nThe epidural blood patch seals the dural leak and restores CSF pressure. Conservative management (bed rest, hydration, caffeine) is tried first. Surgery is reserved for refractory cases where the leak site has been localized (e.g., by digital subtraction myelography)."
    difficulty: medium
    tags: [neurosurgery, intracranial hypotension, epidural blood patch, treatment]
  - front: "What is the most common intracranial tumour in adults?"
    back: "Brain metastasis (~50% of all brain tumours); affects ~25% of all cancer patients. Most common primary tumours: lung, breast, colon, RCC (renal cell carcinoma), melanoma.\n\nMetastases spread hematogenously and preferentially lodge at the grey-white matter junction (terminal MCA branches). 80% are hemispheric. In contrast, the most common primary intracranial tumour is meningioma, and among primary intra-axial tumours, adult diffuse gliomas are most common."
    difficulty: easy
    tags: [neurosurgery, brain metastasis, oncology]
  - front: "What are the most common primary tumours that metastasize to the CNS?"
    back: "Lung (most common), breast, colon/GI, renal cell carcinoma (RCC), melanoma.\n\nMelanoma has the highest propensity per primary tumour to metastasize to the brain. Lung cancer is the most common source overall due to its prevalence. Brain metastases from HER2-positive breast cancer and EGFR-mutant lung cancer may have prolonged survival with targeted therapies."
    difficulty: easy
    tags: [neurosurgery, brain metastasis, oncology, lung cancer]
  - front: "What is the treatment approach for a patient with a single brain metastasis with significant mass effect?"
    back: "Surgical resection followed by adjuvant radiation (SRS to surgical cavity). Dexamethasone to reduce edema (with H2 blocker). Phenytoin/levetiracetam for seizure prophylaxis if presenting with seizure.\n\nFor solitary/dominant lesions causing symptoms or mass effect, surgery + radiation provides better local control than radiation alone. Emerging evidence supports neoadjuvant SRS prior to resection to reduce leptomeningeal dissemination risk. WBRT is reserved for >10 lesions or when cognitive effects are less of a concern."
    difficulty: medium
    tags: [neurosurgery, brain metastasis, surgery, radiation, treatment]
  - front: "What are the CT/MRI features that distinguish brain metastases from high-grade glioma?"
    back: "Metastases: round, well-circumscribed, ring-enhancing, often multiple, located at grey-white matter junction, ++ surrounding edema. High-grade glioma: ill-defined borders (infiltrative), heterogeneous enhancement, central necrosis, single lesion compressing ventricles.\n\nMultiple lesions on imaging strongly suggest metastatic disease over primary brain tumour. GBM (IDH-wildtype glioblastoma) may appear as ring-enhancing with necrosis but tends to be solitary and infiltrative. Ring-enhancing lesion DDx: MAGICAL DR — Metastases, Abscess, GBM, Infarct, Contusion, Abscess, Lymphoma, Demyelination, Resolving hematoma."
    difficulty: hard
    tags: [neurosurgery, brain tumour, imaging, differential diagnosis]
  - front: "What are the WHO 2021 molecular defining features of the three main adult-type diffuse gliomas?"
    back: "Oligodendroglioma: IDH-mutant AND 1p/19q-codeleted (WHO grade 2-3). Astrocytoma: IDH-mutant and NOT 1p/19q-codeleted (WHO grade 2-4). Glioblastoma: IDH-wildtype (WHO grade 4).\n\nMolecular classification has replaced purely histologic grading. IDH mutation confers better prognosis. 1p/19q codeletion defines oligodendroglioma and predicts response to PCV chemotherapy. IDH-wildtype GBM is the most aggressive, with median survival ~15 months with standard treatment (surgery + RT + TMZ)."
    difficulty: hard
    tags: [neurosurgery, glioma, WHO classification, IDH, molecular]
  - front: "What is the standard treatment for newly diagnosed glioblastoma (IDH-wildtype, WHO grade 4)?"
    back: "Maximal safe surgical resection + fractionated radiation (with 2 cm margin) + concomitant and adjuvant temozolomide (TMZ). MGMT gene methylation predicts better response to TMZ.\n\nThe Stupp protocol (RT + TMZ) is standard of care. MGMT promoter methylation silences the DNA repair gene, making tumour cells more susceptible to TMZ alkylation. Bevacizumab (anti-VEGF) improves progression-free survival but not overall survival. Awake craniotomy is used for eloquent area tumours."
    difficulty: hard
    tags: [neurosurgery, glioblastoma, GBM, temozolomide, treatment]
  - front: "What is the recommended treatment for low-grade oligodendroglioma (IDH-mutant, 1p/19q-codeleted)?"
    back: "Early surgical resection (maximal safe resection), followed by radiation therapy (XRT) and PCV chemotherapy regimen.\n\nEarly surgical resection is recommended over watchful waiting. A population-based cohort study showed median survival of 14.4 yr with early resection vs. 5.8 yr with watchful waiting. 1p/19q-codeletion predicts sensitivity to PCV (procarbazine, lomustine, vincristine). Molecular characterization guides treatment."
    difficulty: hard
    tags: [neurosurgery, oligodendroglioma, glioma, treatment, PCV]
  - front: "What is primary CNS lymphoma (PCNSL) and what are its key features?"
    back: "Highly aggressive non-Hodgkin lymphoma confined to CNS; ~95% are large B-cell lymphoma. Predominantly supratentorial. Incidence 0.47/100,000/yr; M:F=1.35:1; age of onset 50-70 (30-40 in immunocompromised). High association with EBV in HIV patients.\n\nPCNSL can occur in both immunocompetent and immunocompromised patients. Immunocompetent patients show homogenous enhancement with minimal edema; immunocompromised show ring enhancement and necrosis. Corticosteroids can prevent histopathological diagnosis — avoid until biopsy is complete when clinically possible."
    difficulty: medium
    tags: [neurosurgery, CNS lymphoma, PCNSL, oncology]
  - front: "What is the first-line treatment for primary CNS lymphoma (PCNSL)?"
    back: "Chemotherapy: MATRix regimen (high-dose methotrexate (HDMTX) + cytarabine + thiotepa + rituximab). Surgery reserved for stereotactic biopsy only (resection discouraged). WBRT used for consolidation or palliation.\n\nHDMTX penetrates the BBB and is the cornerstone of PCNSL treatment. Rituximab targets CD20 on B-cells. WBRT carries significant neurotoxicity risk, especially when combined with HDMTX. Median survival is 26 months overall; <7 months for patients >70 years. Age and performance status are key prognostic factors."
    difficulty: hard
    tags: [neurosurgery, CNS lymphoma, chemotherapy, methotrexate, treatment]
  - front: "What is the most common primary intracranial tumour (overall)?"
    back: "Meningioma — arises from arachnoid cap cells; most common primary intracranial tumour.\n\nMeningiomas are extra-axial (not brain parenchyma itself). They are often benign (WHO Grade 1), slow-growing, and many are incidental findings. They are commonly calcified, cause hyperostosis of adjacent bone, and show 'psammoma bodies' (meningocytic whorls) on histology. 70% occur along the parasagittal convexity, falx cerebri, and sphenoid bone."
    difficulty: easy
    tags: [neurosurgery, meningioma, brain tumour]
  - front: "What are the CT findings of meningioma and what is its typical clinical profile?"
    back: "CT: homogeneous, densely enhancing, along dural border with 'dural tail', well-circumscribed, usually solitary (10% multiple). Clinical: middle-aged women (M:F=1:1.8), often asymptomatic; progesterone receptor expression (may enlarge in pregnancy); NF2 gene mutations common.\n\nThe 'dural tail' sign on contrast imaging is characteristic of meningioma. Up to 80% contain mutations in chromosome 22 (tumour suppressor), and NF2 gene mutations are associated. Multiple meningiomas suggest NF2 (22q12 deletion). Simpson's grading system classifies degree of surgical resection."
    difficulty: medium
    tags: [neurosurgery, meningioma, imaging, clinical features]
  - front: "What is Simpson's classification for meningioma resection and why does it matter?"
    back: "Grade I: complete removal with dural attachment excision; Grade II: complete removal with dural coagulation; Grade III: complete removal without dural treatment; Grade IV: partial removal; Grade V: decompression/biopsy only. Higher grades correlate with higher recurrence rates.\n\nSimpson grading predicts symptomatic recurrence risk. Grade I resection is associated with lowest recurrence. Complete resection (Grade I-II) is often curative. For Grade 1 meningiomas, 5-yr survival >85%; Grade II: 60-90%; Grade III: 35-65%."
    difficulty: medium
    tags: [neurosurgery, meningioma, Simpson grade, surgery, prognosis]
  - front: "What is the management approach for meningioma?"
    back: "Asymptomatic/non-progressive: serial CT/MRI monitoring. Symptomatic/progressive: surgery (often curative with complete resection). Highly vascular: preoperative endovascular embolization. Lesions <3 cm or high-risk surgical candidates: SRS. Adjuvant SRS for atypical/malignant meningiomas.\n\nMany meningiomas are discovered incidentally and can be safely observed. Surgery is indicated when symptomatic or growing. SRS (e.g., Gamma Knife) is an alternative for small, deep, or surgically high-risk lesions. Pharmacological treatments (antiangiogenic drugs, peptide receptor radionuclide therapy) remain experimental."
    difficulty: medium
    tags: [neurosurgery, meningioma, treatment, radiosurgery]
  - front: "What is a vestibular schwannoma (acoustic neuroma) and what is its classic early clinical triad?"
    back: "Benign posterior fossa tumour arising from the vestibular nerve of CN VIII in the internal auditory canal. Early triad (tumour <2 cm): unilateral progressive sensorineural hearing loss (98%), tinnitus, and disequilibrium.\n\nVestibular schwannomas account for 8-10% of intracranial tumours. They grow slowly (60% show no growth over 1 year; average 1-2 mm/yr for growing tumours). If bilateral, diagnostic of NF2. Progressive unilateral or asymmetrical sensorineural hearing loss is the hallmark symptom."
    difficulty: easy
    tags: [neurosurgery, schwannoma, acoustic neuroma, CN VIII]
  - front: "What are the later clinical features of vestibular schwannoma as the tumour grows?"
    back: "Tumour >2 cm: otalgia, facial numbness + weakness, taste changes (CN V and VII compression). Tumour >4 cm: ataxia, headache, N/V, diplopia, cerebellar signs, obstructive hydrocephalus (brainstem compression).\n\nAs the tumour expands in the CPA (cerebellopontine angle), it compresses adjacent structures. CN VII (facial nerve) runs adjacent to CN VIII, causing facial involvement. Large tumours compress the brainstem and 4th ventricle, causing obstructive hydrocephalus and cerebellar signs."
    difficulty: medium
    tags: [neurosurgery, schwannoma, acoustic neuroma, CPA, clinical features]
  - front: "What is the investigation of choice for vestibular schwannoma?"
    back: "MRI with gadolinium or T2 FIESTA sequence (>98% sensitive and specific). CT with contrast is second choice. Also: audiogram, brainstem auditory evoked potentials, caloric tests.\n\nMRI is superior for posterior fossa lesions due to absence of bone artifact. FIESTA sequence allows excellent visualization of the internal auditory canal contents. Audiogram documents baseline hearing and guides treatment decisions. Bilateral schwannomas indicate NF2 — genetic counseling recommended."
    difficulty: easy
    tags: [neurosurgery, schwannoma, MRI, investigation]
  - front: "What are the treatment options for vestibular schwannoma?"
    back: "Expectant: serial imaging (CT/MRI q6 months) + audiometry for small tumours, preserved hearing, high perioperative risk, or elderly. Radiation: SRS for lesions <3 cm in CPA. Surgery: if lesion >3 cm, brainstem compression, edema, or hydrocephalus.\n\n60% of vestibular schwannomas show no growth over 1 year, justifying expectant management. SRS (e.g., Gamma Knife) achieves tumour control with lower morbidity than surgery for small lesions. Surgical resection is curative but risks CN VII (facial) and CN VIII dysfunction proportional to tumour size."
    difficulty: medium
    tags: [neurosurgery, schwannoma, treatment, radiosurgery, surgery]
  - front: "What are the clinical features of pituitary adenoma related to mass effect?"
    back: "Headache, bitemporal hemianopia (optic chiasm compression), hydrocephalus (3rd ventricle compression). Invasive adenomas: CN III, IV, V1, V2, VI palsy (cavernous sinus compression); proptosis and chemosis (cavernous sinus occlusion).\n\nThe optic chiasm sits directly above the pituitary fossa. Superior expansion compresses the crossing nasal fibres of the optic chiasm, causing bitemporal hemianopia. Lateral extension into the cavernous sinus causes CN III, IV, V1, V2, VI palsies (these nerves traverse the cavernous sinus)."
    difficulty: medium
    tags: [neurosurgery, pituitary adenoma, mass effect, bitemporal hemianopia]
  - front: "What are the endocrine manifestations of the most common functional pituitary adenomas?"
    back: "Prolactinoma (most common functional): infertility, amenorrhea, galactorrhea, decreased libido. ACTH-producing: Cushing's disease, hyperpigmentation. GH-producing: acromegaly (adults) / gigantism (children). All: potential panhypopituitarism from compression.\n\nMnemonic: 'Go Look For The Adenoma Please' = GH, LH, FSH, TSH, ACTH, Prolactin. GH-secreting cells are most sensitive to compression. Panhypopituitarism causes hypothyroidism, hypoadrenalism, and hypogonadism. DI is rare except in pituitary apoplexy."
    difficulty: medium
    tags: [neurosurgery, pituitary adenoma, endocrinology, prolactinoma, acromegaly]
  - front: "What is the classification of pituitary adenomas by size and function?"
    back: "By size: microadenoma <1 cm; macroadenoma ≥1 cm. By function: endocrine active (functional/secretory) vs. inactive (non-functional). Most common functional: prolactinomas > ACTH-producing > GH-producing. Associated with MEN-1 syndrome.\n\nMicroadenomas are often found incidentally on autopsy (~20% prevalence) or imaging. Macroadenomas are more likely to cause mass effects. Non-functional adenomas present with mass effect rather than hormonal symptoms. MEN-1 should be considered in patients with pituitary adenomas plus other endocrine tumours."
    difficulty: easy
    tags: [neurosurgery, pituitary adenoma, classification, MEN1]
  - front: "What is the medical treatment for prolactinoma and what is the surgical approach for pituitary adenomas?"
    back: "Prolactinoma: dopamine agonists (bromocriptine). Cushing's: cyproheptadine, ketoconazole. Acromegaly: octreotide (somatostatin analogue) + bromocriptine. Surgery: endoscopic endonasal trans-sphenoidal approach (preferred); trans-cranial for significant suprasellar extension.\n\nDopamine agonists are highly effective for prolactinomas and may avoid surgery. Trans-sphenoidal surgery is minimally invasive and appropriate for most pituitary adenomas. Trans-cranial approach is reserved for large tumours with significant suprasellar extension that cannot be accessed through the sphenoid sinus."
    difficulty: medium
    tags: [neurosurgery, pituitary adenoma, treatment, trans-sphenoidal, bromocriptine]
  - front: "What is the difference between supratentorial and infratentorial CNS tumour distributions by age?"
    back: "Age <15: 60% infratentorial (posterior fossa) — medulloblastoma (15-20%), cerebellar astrocytoma (15%), ependymoma (9%), brainstem astrocytoma. Age >15: 80% supratentorial — GBM (12-15%), metastasis (15-30%), meningioma (15-20%), pituitary adenoma (5-8%).\n\nIn children, the posterior fossa is the dominant location, hence the classic teaching 'children = infratentorial.' This distribution matters for clinical presentation: posterior fossa tumours cause cerebellar signs, brainstem deficits, and obstructive hydrocephalus; supratentorial tumours cause seizures and focal cortical deficits."
    difficulty: medium
    tags: [neurosurgery, brain tumour, pediatric, epidemiology]
  - front: "What are distinguishing clinical features of posterior fossa (infratentorial) tumours vs. supratentorial tumours?"
    back: "Infratentorial: CN deficits + long tract signs (brainstem), N/V (vagal nucleus compression), vertigo, nystagmus, truncal ataxia/titubation (cerebellar vermis), limb ataxia/dysmetria/intention tremor (cerebellar hemisphere), obstructive hydrocephalus more common. Supratentorial: seizure (often first symptom), progressive focal deficits, frontal/temporal lobe syndromes, 'tumour TIA'.\n\nCerebellar vermis lesions (midline) cause truncal ataxia and gait disturbance, whereas cerebellar hemisphere lesions cause ipsilateral limb dysmetria and intention tremor. Posterior fossa tumours more commonly cause obstructive hydrocephalus because they compress the 4th ventricle or cerebral aqueduct."
    difficulty: medium
    tags: [neurosurgery, brain tumour, posterior fossa, cerebellar, clinical features]
  - front: "What familial syndromes are associated with CNS tumours?"
    back: "NF1 & NF2, tuberous sclerosis complex, von Hippel-Lindau (hemangioblastoma), Li-Fraumeni syndrome (TP53), Gorlin syndrome, Turcot syndrome, Lynch syndrome, familial adenomatous polyposis, Cowden syndrome, MEN1, ataxia telangiectasia, hereditary non-polyposis colorectal cancer (Lynch).\n\nNF2 is associated with bilateral vestibular schwannomas and multiple meningiomas. Von Hippel-Lindau causes hemangioblastomas of cerebellum/retina. Turcot syndrome associates colorectal polyposis with medulloblastoma (FAP variant) or GBM (Lynch syndrome variant). Li-Fraumeni (TP53 germline) predisposes to many cancers including gliomas."
    difficulty: medium
    tags: [neurosurgery, genetics, familial syndromes, brain tumour, NF2]
  - front: "What is the DDx for a ring-enhancing lesion on CT in an immunocompetent patient vs. HIV patient?"
    back: "Immunocompetent MAGICAL DR: Metastases, Abscess, GBM (high-grade glioma), Infarct (subacute), Contusion, AIDS (toxoplasmosis), Lymphoma, Demyelination, Resolving hematoma/Radiation necrosis. HIV patients: toxoplasmosis vs. CNS lymphoma (treat empirically with pyrimethamine + sulfadiazine; biopsy if no resolution).\n\nIn HIV patients, toxoplasmosis is the most common cause of ring-enhancing lesions and empiric treatment is appropriate. CNS lymphoma is also common (6-20% of HIV-infected patients). Failure to respond to anti-toxoplasma therapy within 2 weeks should prompt brain biopsy to exclude CNS lymphoma."
    difficulty: hard
    tags: [neurosurgery, ring enhancing lesion, differential diagnosis, HIV, toxoplasmosis]
  - front: "What is the WHO 2021 CNS classification change regarding glioblastoma?"
    back: "Glioblastoma is now defined as IDH-wildtype, WHO Grade 4. IDH-mutant tumours previously called GBM are reclassified as Astrocytoma, IDH-mutant, Grade 4. Other defining features of GBM: TERT promoter mutation, chromosomes 7 gain/10 loss, EGFR amplification.\n\nThe 2021 WHO classification integrates molecular markers as defining criteria, not just histology. This reclassification matters because IDH-mutant tumours have significantly better prognosis than IDH-wildtype GBM (median survival ~15 months for IDH-wildtype vs. years for IDH-mutant high-grade gliomas)."
    difficulty: hard
    tags: [neurosurgery, glioblastoma, WHO classification, IDH, molecular]
  - front: "What are the prognoses for the three main adult diffuse glioma types?"
    back: "Oligodendroglioma (IDH-mutant, 1p/19q-codeleted): low grade ~10 yr, high grade ~5 yr. Astrocytoma (IDH-mutant): low grade ~3 yr, high grade ~1.5-2 yr. Glioblastoma (IDH-wildtype): ~15 months.\n\nIDH mutation is a strong favorable prognostic marker. 1p/19q codeletion in oligodendroglioma predicts chemosensitivity. The dramatic difference in survival between IDH-wildtype GBM (15 mo) and IDH-mutant low-grade oligodendroglioma (~10 yr) underscores the importance of molecular profiling in guiding prognosis and treatment."
    difficulty: medium
    tags: [neurosurgery, glioma, prognosis, IDH, oligodendroglioma]
  - front: "What is the role of MGMT promoter methylation in glioblastoma treatment?"
    back: "MGMT promoter methylation silences the DNA repair gene MGMT, making tumour cells more susceptible to temozolomide (TMZ) alkylating damage. Patients with MGMT methylation have better response to TMZ and improved prognosis.\n\nTMZ causes O6-methylguanine DNA lesions that are normally repaired by the MGMT enzyme. When MGMT is epigenetically silenced (methylated promoter), tumour cells cannot repair TMZ-induced damage, leading to apoptosis. MGMT methylation is tested on tumour tissue and guides chemotherapy decisions especially in elderly patients."
    difficulty: hard
    tags: [neurosurgery, glioblastoma, MGMT, temozolomide, biomarker]
  - front: "What is the general treatment approach for brain tumours (overview)?"
    back: "Conservative: serial imaging for slow-growing/benign lesions. Medical: corticosteroids (reduce ICP/cytotoxic edema), pharmacologic (e.g., dopamine agonists for prolactinoma). Surgical: total/partial excision. Radiotherapy: fractionated XRT, hypofractionated XRT, SRS (Gamma Knife). Chemotherapy: alkylating agents (TMZ, vincristine, cyclophosphamide). Targeted therapy: trastuzumab (HER2+ breast), osimertinib (EGFR-mutant lung).\n\nA multidisciplinary approach is essential. Corticosteroids (dexamethasone) reduce vasogenic edema from brain tumours. SRS delivers highly focused radiation to discrete lesions. Targeted therapies exploit specific molecular alterations in metastatic disease and are increasingly used."
    difficulty: easy
    tags: [neurosurgery, brain tumour, treatment, multimodal]
  - front: "What is the significance of new-onset communicating hydrocephalus in a patient with known cancer?"
    back: "Should raise strong suspicion for leptomeningeal carcinomatosis (metastatic meningitis). Tumour cells infiltrating the leptomeninges impair CSF reabsorption at the arachnoid granulations.\n\nLeptomeningeal carcinomatosis presents with multifocal neurological deficits, cranial nerve palsies, and hydrocephalus. Diagnosis is by CSF cytology (LP) and MRI with contrast showing leptomeningeal enhancement. It is a poor prognostic sign and occurs most commonly with breast cancer, lung cancer, and melanoma."
    difficulty: hard
    tags: [neurosurgery, leptomeningeal carcinomatosis, hydrocephalus, oncology]
  - front: "What are the major complications of endoscopic third ventriculostomy (ETV)?"
    back: "Hypothalamic injury, basilar artery injury, bleeding. Overall success rate ~56%.\n\nETV creates a stoma in the floor of the third ventricle, allowing CSF to bypass the obstruction. The basilar artery and hypothalamus are in close proximity, making them vulnerable. ETV is preferred over shunting for obstructive hydrocephalus to avoid hardware-related complications, but requires a functioning subarachnoid space for CSF absorption."
    difficulty: medium
    tags: [neurosurgery, ETV, hydrocephalus, complications]
  - front: "What CNS tumour types are most common in the posterior fossa of children (infratentorial)?"
    back: "Medulloblastoma (15-20%), cerebellar astrocytoma (15%), ependymoma (9%), brainstem astrocytoma. Mnemonic: 'MACE' — Medulloblastoma, Astrocytoma (cerebellar), Craniopharyngioma (supratentorial in children), Ependymoma.\n\nMedulloblastoma arises from cerebellar vermis, causing truncal ataxia and obstructive hydrocephalus. WHO 2021 classifies medulloblastomas molecularly: WNT-activated (best prognosis), SHH-activated (TP53 wildtype or mutant), non-WNT/non-SHH. Cerebellar pilocytic astrocytoma is often curable with resection."
    difficulty: medium
    tags: [neurosurgery, pediatric, posterior fossa, medulloblastoma, brain tumour]
  - front: "What is choroid plexus papilloma and how does it cause hydrocephalus?"
    back: "Rare benign tumour of choroid plexus (0.4-1% of intracranial tumours). Causes hydrocephalus by overproduction of CSF (communicating hydrocephalus) — one of the few causes of hydrocephalus from increased CSF production rather than obstruction or impaired reabsorption.\n\nThe choroid plexus normally produces ~500 mL CSF/day. Choroid plexus papilloma can produce CSF at rates that overwhelm normal reabsorptive capacity. It commonly occurs in children (lateral ventricles) and is often curable with complete surgical resection."
    difficulty: medium
    tags: [neurosurgery, choroid plexus, papilloma, hydrocephalus, CSF production]
  - front: "What is the prognosis for brain metastasis without and with treatment?"
    back: "Without treatment: median survival ~1 month once symptomatic. With optimal treatment: 6-9 months. Prolonged survival in subgroups: HER2/neu breast cancer, EGFR-mutant lung cancer. Prognosis assessed by disease-specific Graded Prognostic Assessment (DS-GPA).\n\nPrognostic factors include primary tumour type, patient age, Karnofsky score, extent of extracranial metastatic disease, number of intracranial lesions, and molecular subtype. Targeted therapies (trastuzumab, osimertinib) have improved survival for specific molecular subtypes of metastatic disease."
    difficulty: medium
    tags: [neurosurgery, brain metastasis, prognosis, survival]
  - front: "At which cervical disc levels do most cervical disc herniations occur, and which nerve roots are affected?"
    back: "C5-C6 (affects C6 root) and C6-C7 (affects C7 root) — the disc herniation impinges the nerve root numbered one level below the interspace.\n\nIn the cervical spine, the nerve root exits above its same-numbered vertebra, so a disc at C5-C6 compresses the C6 root. These two levels account for ~88% of cervical disc herniations (19% C5-C6 / 69% C6-C7)."
    difficulty: easy
    tags: [neurosurgery, cervical spine, radiculopathy, disc herniation]
  - front: "What are the LMN vs. UMN features that distinguish cervical radiculopathy from cervical myelopathy?"
    back: "Radiculopathy (nerve root compression) produces LMN signs: diminished reflexes, non-spastic motor weakness, dermatomal sensory changes. Myelopathy (cord compression) produces UMN signs: hyperreflexia, spasticity, gait disturbance, bladder dysfunction.\n\nDisc herniation at the foraminal level compresses an individual nerve root (LMN). Central cervical disc protrusion or spondylotic osteophytes may compress the spinal cord itself, causing UMN myelopathy — these often coexist."
    difficulty: medium
    tags: [neurosurgery, cervical spine, radiculopathy, myelopathy, LMN vs UMN]
  - front: "What are the sensory, motor, and reflex findings for a C6 nerve root compression?"
    back: "Sensory: thumb. Motor: biceps and wrist extensors. Reflex: biceps and brachioradialis diminished.\n\nC6 root is compressed by a C5-C6 disc herniation (69% of cervical disc herniations involve C6-C7/C7 root; 19% C5-C6/C6 root). Knowing dermatomal maps is critical for localising the level of radiculopathy on the MCCQE1."
    difficulty: easy
    tags: [neurosurgery, cervical spine, radiculopathy, dermatomes]
  - front: "What are the sensory, motor, and reflex findings for a C7 nerve root compression?"
    back: "Sensory: middle finger. Motor: triceps. Reflex: triceps diminished.\n\nC7 is compressed by a C6-C7 disc herniation (most common cervical disc level at 69%). The triceps reflex is uniquely associated with C7, making it a reliable clinical marker."
    difficulty: easy
    tags: [neurosurgery, cervical spine, radiculopathy, dermatomes]
  - front: "What are the surgical indications for cervical disc disease (radiculopathy)?"
    back: "1. Intractable pain despite adequate conservative treatment for >3 months. 2. Progressive neurological deficit. 3. Cauda equina syndrome (cervical equivalent: myelopathy with motor impairment).\n\nConservative management (NSAIDs, physiotherapy, activity modification) is first-line; 95% improve spontaneously in 4-8 weeks. Surgery is reserved for failure of conservative care or progressive/significant neurological deficits. Cervical manipulation is specifically avoided."
    difficulty: medium
    tags: [neurosurgery, cervical spine, radiculopathy, surgical indications]
  - front: "What is the first-line surgical procedure for cervical disc disease and what are the alternative options?"
    back: "Anterior cervical discectomy and fusion (ACDF) is the standard approach. Alternatives include posterior foraminotomy with discectomy, and cervical artificial disc replacement (emerging option).\n\nThe choice between anterior and posterior approaches depends on the level, type of pathology, and whether kyphosis is present. For myelopathy, anterior approach is preferred with kyphosis; posterior with preserved lordosis."
    difficulty: medium
    tags: [neurosurgery, cervical spine, ACDF, surgical treatment]
  - front: "What is the natural history/prognosis of cervical disc radiculopathy?"
    back: "95% of patients improve spontaneously within 4-8 weeks with conservative management.\n\nThe excellent natural history supports a conservative-first approach. Surgery achieves faster symptom relief than continued conservative care, but long-term outcomes are comparable between surgical and nonsurgical treatment."
    difficulty: easy
    tags: [neurosurgery, cervical spine, radiculopathy, prognosis]
  - front: "What is Degenerative Cervical Myelopathy (DCM) and what are its key clinical features?"
    back: "DCM is progressive cervical spinal canal stenosis from degenerative changes (disc degeneration/herniation, osteophytes, ossification of PLL, ligament hypertrophy) causing cord compression. Features: insidious onset, neck pain radiating to arms (worse with Spurling's test/Lhermitte's sign), gait disturbance, decreased hand dexterity, lower extremity weakness, UMN signs, bladder dysfunction.\n\nDCM typically begins at ages 40-50, M>F, most commonly at C5-C6 > C6-C7. It is the most common cause of spinal cord dysfunction in adults. UMN signs help differentiate cord compression (myelopathy) from radiculopathy (LMN signs)."
    difficulty: medium
    tags: [neurosurgery, cervical spine, myelopathy, DCM, UMN signs]
  - front: "According to the 2017 AO Spine-CSRS guidelines, what are the treatment recommendations for DCM stratified by mJOA score?"
    back: "Severe DCM (mJOA 0-11): Strong recommendation for surgery. Moderate DCM (mJOA 12-14): Strong recommendation for surgery. Mild DCM (mJOA 15-17): Weak recommendation — surgery or structured rehabilitation; consider surgery with neurologic deterioration. Non-myelopathic with cord compression, no radiculopathy: Weak — no prophylactic surgery. Non-myelopathic with cord compression + radiculopathy: Weak — surgery or nonoperative with close follow-up.\n\nThe mJOA (Modified Japanese Orthopaedic Association) scale grades DCM severity. Strong evidence supports surgical intervention for moderate-severe DCM. Complete remission almost never occurs; surgery stops progression in nearly all cases and 80% experience neurological improvement."
    difficulty: hard
    tags: [neurosurgery, DCM, mJOA, surgical guidelines, AO Spine]
  - front: "For multilevel DCM, when is an anterior vs. posterior surgical approach preferred?"
    back: "Anterior approach (ACDF or corpectomy) is preferred when kyphosis is present. Posterior approach (decompressive laminectomy) is preferred when cervical lordosis is preserved. Both have generally comparable outcomes for multilevel DCM.\n\nAnterior approaches address disc/osteophyte pathology directly; posterior approaches increase canal diameter. Kyphosis makes posterior decompression less effective (cord remains draped over the kyphotic apex) and anterior correction is required."
    difficulty: hard
    tags: [neurosurgery, DCM, surgical approach, kyphosis, laminectomy]
  - front: "What is the typical presentation of lumbar disc syndrome and what physical findings support the diagnosis?"
    back: "Initially back pain, then leg pain > back pain. Limited forward flexion, motor weakness, dermatomal sensory changes, decreased reflexes. Pain exacerbated by Valsalva and relieved by knee/thigh flexion. Nerve tension signs: positive SLR <60° (L5/S1) or crossed SLR (L5/S1), femoral stretch test (L2/L3/L4).\n\nThe progression from back to leg-dominant pain is characteristic of disc herniation. SLR sensitivity is ~80% for L4-S1 radiculopathy but specificity is low; crossed SLR is highly specific (~90%) but less sensitive (~25%)."
    difficulty: medium
    tags: [neurosurgery, lumbar spine, disc herniation, SLR, radiculopathy]
  - front: "What are the root levels, sensory distributions, motor deficits, and reflex changes for L4, L5, and S1 radiculopathies?"
    back: "L4: sensory — medial leg; motor — tibialis anterior (dorsiflexion); reflex — patellar. L5: sensory — dorsal foot to hallux; motor — extensor hallucis longus (hallux extension); reflex — medial hamstrings. S1: sensory — lateral foot; motor — gastrocnemius/soleus (plantar flexion); reflex — Achilles.\n\nL5 and S1 together account for ~95% of lumbar disc herniations (45% L5, 51% S1). L5 herniation occurs at L4-L5 level; S1 at L5-S1. Knowing motor, sensory and reflex patterns allows clinical localisation before imaging."
    difficulty: medium
    tags: [neurosurgery, lumbar spine, radiculopathy, dermatomes, L4 L5 S1]
  - front: "What is the clinical significance of a posterolateral vs. far-lateral vs. central lumbar disc herniation?"
    back: "Posterolateral: compresses the traversing nerve root exiting BELOW that level (most common). Far-lateral: compresses the exiting nerve root AT that level. Central herniation: may cause cauda equina compression or lumbar stenosis.\n\nUnderstanding the anatomical relationship between disc level and nerve root compression explains why disc herniation at L4-L5 usually affects L5 (traversing) root but can affect L4 (exiting) root if far-lateral. Central large disc herniations are surgical emergencies (cauda equina syndrome)."
    difficulty: hard
    tags: [neurosurgery, lumbar disc, anatomy, cauda equina, disc herniation types]
  - front: "What are the key features and management of Cauda Equina Syndrome (CES)?"
    back: "CES: compression of lumbosacral nerve roots below conus medullaris (below L2). Features: acute LMN weakness (multiple root distribution), reduced DTRs (knee/ankle), urinary retention or overflow incontinence, fecal incontinence, bilateral saddle anesthesia (S2-S5), sciatica worse with Valsalva/sitting, sexual dysfunction (late). Management: urgent MRI to confirm; surgical decompression within 48 hours to preserve bowel/bladder/sexual function.\n\nCES is a neurosurgical emergency. Prognosis correlates with functional status at presentation: ambulatory patients are likely to remain ambulatory; non-ambulatory patients are unlikely to recover walking after surgery. Post-void residual >250 cc suggests urinary retention."
    difficulty: hard
    tags: [neurosurgery, cauda equina syndrome, emergency, surgical decompression, lumbar spine]
  - front: "How do you differentiate Conus Medullaris Syndrome from Cauda Equina Syndrome?"
    back: "Conus: sudden bilateral onset; rare pain (bilateral/symmetric in perineum); bilateral symmetric saddle sensory loss WITH sensory dissociation; symmetric less-marked paresis ± fasciculations; only ankle jerk absent (knee preserved); urinary retention and atonic anal sphincter prominent early; impotence frequent. Cauda equina: gradual unilateral; severe radicular pain (perineum, thighs, legs, back, bladder); saddle sensory loss WITHOUT dissociation, may be unilateral/asymmetric; asymmetric more-marked paresis ± atrophy; both knee and ankle jerk may be absent; sphincter dysfunction late; impotence less frequent.\n\nConus medullaris is the terminal end of the spinal cord (L1-L2). Lesions here produce a mixed UMN/LMN picture with preserved knee jerk (UMN) but absent ankle jerk (LMN). CES is purely LMN with both reflexes absent. Sensory dissociation (loss of pain/temperature with preserved touch) indicates a central cord lesion."
    difficulty: hard
    tags: [neurosurgery, conus medullaris, cauda equina syndrome, differential diagnosis]
  - front: "What are the clinical features and management of Lumbar Spinal Stenosis?"
    back: "Gradually progressive back and leg pain with standing/walking, relieved by sitting, lying down, or lumbar flexion (e.g., leaning over shopping cart, riding bike). Neurologic exam may be normal including SLR. MRI best to confirm level. Treatment: NSAIDs/analgesia/physical therapy (nonsurgical); laminectomy with root decompression (surgical); add fusion if segmental instability on flexion/extension x-rays.\n\nLumbar stenosis results from congenital narrowing plus degenerative changes (herniated disc, hypertrophied facet joints, ligamentum flavum). Unlike nerve root compression, clinical exam cannot reliably localize the level — MRI is required. 60% sensitivity for neurogenic claudication."
    difficulty: medium
    tags: [neurosurgery, lumbar stenosis, neurogenic claudication, laminectomy]
  - front: "What is syringomyelia, what are its common causes, and how does it present clinically?"
    back: "Syringomyelia (syrinx) is cystic cavitation of the spinal cord. Most common cause: Chiari I malformation (70%); basilar invagination (10%); SCI, arachnoiditis (non-communicating). Presentation: initially pain and weakness; then loss of pain and temperature in upper extremities (spinothalamic tract) with preserved touch/proprioception in a cape-like distribution; LMN arm/hand weakness and wasting; dysesthetic pain; Charcot joints (especially shoulder/neck); progressive myelopathy over years.\n\nThe classic dissociated sensory loss (loss of pain/temperature with preserved dorsal column function) reflects the central location of the syrinx disrupting the crossing spinothalamic fibres. Charcot joints result from repeated unrecognized trauma due to absent pain sensation."
    difficulty: hard
    tags: [neurosurgery, syringomyelia, Chiari malformation, intramedullary, dissociated sensory loss]
  - front: "What is the investigation and treatment approach for syringomyelia?"
    back: "Investigation: MRI with gadolinium (best; identifies associated tumour/pathology); myelogram with delayed CT if MRI contraindicated. Treatment: treat underlying cause (posterior fossa decompression for Chiari I; surgical removal of tumour). Shunting (syringosubarachnoid or syringopleural): rarely needed in communicating syringomyelia; more commonly indicated in non-communicating forms (SCI, arachnoiditis). Detethering ± duroplasty for focal cord tethering.\n\nGadolinium contrast is critical to identify an associated tumour that may be causing the syrinx. Simply shunting the syrinx without addressing the underlying cause leads to failure. For tethered cord, release of the tether often leads to syrinx resolution."
    difficulty: hard
    tags: [neurosurgery, syringomyelia, MRI, shunting, Chiari decompression]
  - front: "What are the five ASIA Impairment Scale grades for spinal cord injury?"
    back: "A: Complete — no motor/sensory below neurological level including S4/5. B: Incomplete — sensory but not motor preserved below neurological level including S4/5. C: Incomplete — motor preserved below; majority of key muscles grade <3. D: Incomplete — motor preserved below; majority of key muscles grade ≥3. E: Normal motor and sensory function.\n\nThe ASIA scale is used to classify and monitor recovery in SCI. 'Sacral sparing' (perianal sensation, voluntary rectal sphincter contraction) is essential for distinguishing complete from incomplete lesions — any preserved sacral function = incomplete. About 3% of patients with initially complete injuries develop some recovery within 24h."
    difficulty: medium
    tags: [neurosurgery, spinal cord injury, ASIA scale, classification]
  - front: "Describe the Brown-Séquard syndrome: etiology, motor, and sensory deficits."
    back: "Etiology: hemisection of the cord (e.g., penetrating trauma). Motor: ipsilateral LMN weakness at the lesion level; ipsilateral UMN weakness below the lesion. Sensory: ipsilateral loss of vibration and proprioception; contralateral loss of pain and temperature; preserved light touch bilaterally.\n\nThe crossed pattern (contralateral spinothalamic deficit, ipsilateral dorsal column and corticospinal deficit) reflects the anatomy: spinothalamic fibres cross near their level of entry, while dorsal column and corticospinal tracts are ipsilateral. Brown-Séquard has the best prognosis of all SCI syndromes."
    difficulty: hard
    tags: [neurosurgery, Brown-Séquard, spinal cord syndromes, incomplete SCI]
  - front: "Describe Anterior Cord Syndrome: etiology, motor, and sensory deficits."
    back: "Etiology: anterior spinal artery compression or occlusion. Motor: bilateral LMN weakness at the lesion; bilateral UMN weakness below the lesion; urinary retention. Sensory: bilateral loss of pain and temperature; preserved vibration and proprioception (dorsal columns intact); preserved light touch.\n\nThe anterior spinal artery supplies the anterior two-thirds of the cord including the spinothalamic tracts and corticospinal tracts. The dorsal columns (vibration, proprioception) are supplied by the posterior spinal arteries and are spared. Anterior cord syndrome has the worst prognosis of incomplete SCI syndromes."
    difficulty: hard
    tags: [neurosurgery, anterior cord syndrome, spinal cord syndromes, anterior spinal artery]
  - front: "Describe Central Cord Syndrome: etiology, motor and sensory deficits, and pathophysiology."
    back: "Etiology (most common incomplete SCI): syringomyelia, tumours, or spinal hyperextension injury (most common mechanism). Motor: bilateral weakness — upper limbs (LMN) > lower limbs (UMN); urinary retention. Sensory: variable bilateral suspended sensory loss; loss of pain and temperature; loss of vibration and proprioception.\n\nCentral cord syndrome is the most common incomplete SCI pattern. Upper extremity LMN > lower extremity UMN weakness reflects the laminar organisation of the corticospinal tract: cervical fibres run centrally (most affected) while lumbar/sacral fibres run peripherally (less affected). Hyperextension in an elderly patient with pre-existing spondylosis is the typical scenario."
    difficulty: hard
    tags: [neurosurgery, central cord syndrome, most common incomplete SCI, hyperextension injury]
  - front: "Describe Posterior Cord Syndrome: etiology and specific deficits."
    back: "Etiology: posterior spinal artery infarction or trauma. Motor: preserved. Sensory: bilateral loss of vibration, proprioception, and light touch at and below the lesion; preserved pain and temperature.\n\nPosterior cord syndrome is the rarest spinal cord syndrome. It specifically spares the spinothalamic tracts (pain/temperature) while disrupting dorsal columns (vibration, proprioception, light touch). Pure posterior cord syndrome is uncommon clinically."
    difficulty: medium
    tags: [neurosurgery, posterior cord syndrome, spinal cord syndromes, dorsal columns]
  - front: "What is the Seddon classification of peripheral nerve injuries and what are the expected recoveries?"
    back: "Neurapraxia (Class I): axon structurally intact but fails to function; recovery within hours to months (average 6-8 weeks). Axonotmesis (Class II): axon and myelin disrupted but endoneurium intact; Wallerian degeneration distally; spontaneous recovery at 1 mm/day, maximal at 1-2 years. Neurotmesis (Class III): nerve completely transected; needs surgical repair for possibility of recovery.\n\nThe prognosis is inversely related to the severity of injury. Neurapraxia (conduction block, no structural damage) has the best prognosis. Axonotmesis has spontaneous recovery because the intact endoneurium guides axonal regrowth. Neurotmesis requires microsurgical nerve repair or grafting."
    difficulty: medium
    tags: [neurosurgery, peripheral nerve injury, Seddon classification, neurapraxia, axonotmesis, neurotmesis]
  - front: "What is the treatment approach for each type of peripheral nerve injury?"
    back: "Entrapment: nonsurgical first (prevent repeated stress, physio, NSAIDs, local anaesthetic/steroid injection); surgical decompression ± transposition for progressive deficits or failed medical management. Stretch/Contusion: clinical follow-up; exploration if no recovery in 3 months. Axonotmesis: if no recovery, resect damaged segment; physio/rehab; recovery usually incomplete. Neurotmesis: surgical repair — direct suture if ends approximate, nerve graft (usually sural nerve) otherwise; clean laceration: early repair; contaminated: tag initially and reapproach within 10 days.\n\nTinel's sign (paresthesias elicited by tapping along the nerve) can be used to monitor the advancing front of axonal regeneration. The 3-month wait-and-see approach for contusions balances the risk of unnecessary surgery against the need to intervene before irreversible target organ changes."
    difficulty: hard
    tags: [neurosurgery, peripheral nerve, nerve repair, nerve graft, sural nerve]
  - front: "What are the four indications for intubation in neurotrauma?"
    back: "1. Depressed or decreasing LOC (GCS <8 — cannot protect airway). 2. Need for hyperventilation (raised ICP). 3. Severe maxillofacial trauma (patency of airway doubtful). 4. Need for pharmacologic paralysis for evaluation or management. NOTE: avoid nasotracheal intubation if basal skull fracture suspected (risk of inadvertent intracranial placement).\n\nHyperventilation (target PaCO2 ~35 mmHg) causes cerebral vasoconstriction and temporarily reduces ICP. It is used as a bridge to definitive management, not as long-term treatment. Intubation prevents verbal GCS scoring, which must be noted in documentation."
    difficulty: medium
    tags: [neurosurgery, neurotrauma, intubation, GCS, ICP management]
  - front: "What are the GCS score ranges and their clinical severity classification?"
    back: "GCS 13-15: mild head injury. GCS 9-12: moderate head injury. GCS ≤8: severe head injury (generally requires intubation for airway protection).\n\nGCS has three components: Eye opening (1-4), Verbal response (1-5), Motor response (1-6); maximum score 15. Motor response is the most prognostic component in severe TBI. Best response for each component is recorded individually (e.g., E3V3M5). Intubation eliminates verbal scoring."
    difficulty: easy
    tags: [neurosurgery, GCS, Glasgow Coma Scale, head injury, TBI severity]
  - front: "What are the Canadian CT Head Rule indications for CT in minor head injury?"
    back: "High-risk (neurological intervention): GCS <15 at 2h post-injury; suspected open or depressed skull fracture; signs of basal skull fracture (hemotympanum, 'raccoon' eyes, CSF otorrhea/rhinorrhea, Battle's sign); vomiting ≥2 episodes; age ≥65. Medium-risk (brain injury on CT): amnesia before impact ≥30 minutes; dangerous mechanism (pedestrian struck by MV, occupant ejected, fall >3 feet/5 stairs). Minor head injury defined as witnessed LOC, definite amnesia, or witnessed disorientation with GCS 13-15.\n\nThe Canadian CT Head Rule (Lancet 2001) is a validated clinical decision rule that reduces unnecessary CT scans. It applies only to patients with minor head injury (GCS 13-15) with LOC/amnesia/disorientation. A normal CT scan has 100% negative predictive value for unstable C-spine injuries (per meta-analysis), allowing collar removal in obtunded/intubated patients."
    difficulty: hard
    tags: [neurosurgery, Canadian CT Head Rule, minor head injury, CT indications, head CT]
  - front: "What is the management approach for minor (GCS 13-15) vs. moderate/severe (GCS ≤12) head injury?"
    back: "Minor: observation 24-48h, neuro checks every hour, judicious use of sedatives/analgesics; if discharged — stepwise return to play/school (2019 Parachute Canada Concussion Guidelines). Moderate/Severe: clear airway + intubate if necessary; secure C-spine; maintain adequate BP; monitor ICP; manage cerebral edema; neurosurgical consultation.\n\nAdmission is required for: skull fracture; confusion/impaired consciousness; concussion with >5 min amnesia; focal neurological signs, severe H/A, vomiting, seizures; unstable spine; EtOH intoxication; poor social support. Low BP after head injury suggests blood loss from associated injuries, not the head injury itself."
    difficulty: medium
    tags: [neurosurgery, head injury, TBI management, Parachute Canada, concussion]
  - front: "What is the pathogenesis and mechanism of skull fractures, and how are depressed vs. basal fractures managed?"
    back: "Acceleration/deceleration: contusions, SDH, axonal/vessel shearing. Impact: skull fracture, concussion, epidural hematoma. Depressed fractures: double density on x-ray; CT with bone window is gold standard. Simple (closed): no ABx, no surgery. Compound (open): surgical debridement within 24h; may only treat with ABx if bleeding risk high. Basal skull fractures: not visible on x-ray; diagnosed clinically.\n\nDepressed fractures >table thickness or with cosmetic/neurological concern require surgical elevation. Compound fractures risk meningitis and osteomyelitis. Internal fractures into sinuses can cause pneumocephalus. Risk of operative bleed from venous sinuses may limit treatment to antibiotics in some cases."
    difficulty: medium
    tags: [neurosurgery, skull fracture, head injury, depressed fracture, compound fracture]
  - front: "What are the mechanisms and types of primary brain injury?"
    back: "Penetrating injuries: low velocity (local damage), high velocity (distant damage via compression wave). Concussion: trauma-induced alteration of mental status; no parenchymal abnormalities on CT. Coup (damage at site of blow) and contrecoup (opposite site). Contusion: hemorrhagic, high density on CT, commonly at inferior frontal lobe/temporal pole. Diffuse axonal injury (DAI): wide-ranging damage, may tear blood vessels (hemorrhagic foci), often cause of decreased LOC with no space-occupying lesion on CT.\n\nDAI results from angular acceleration-deceleration forces causing shearing of axons at the grey-white interface. It is the primary cause of persistent vegetative state after TBI. Contrecoup injuries occur because deceleration causes the brain to impact the inner skull opposite the blow."
    difficulty: medium
    tags: [neurosurgery, TBI, brain injury, diffuse axonal injury, coup contrecoup, contusion]
  - front: "What are the secondary pathologic processes following TBI that lead to delayed brain injury?"
    back: "Intracranial: high glutamate release → NMDA receptor activation → cytotoxic cascade; cerebral edema; intracranial hemorrhages; ischemia/infarction; raised ICP; hydrocephalus. Extracranial: hypoxemia (leads to ischemia/raised ICP); hypercarbia (vasodilation → raised ICP); systemic hypotension (decreased CPP/ischemia from loss of autoregulation); hyperpyrexia (increased metabolic demands → ischemia); fluid/electrolyte imbalance (SIADH from head injury, DI); coagulopathy.\n\nSecondary injury is the target for most TBI management strategies (airway maintenance, BP support, ICP monitoring). The BEST-TRIP trial showed ICP monitoring-based management was not superior to care based on imaging and clinical examination in resource-limited settings."
    difficulty: hard
    tags: [neurosurgery, TBI, secondary brain injury, ICP, NMDA, cerebral edema]
  - front: "What are the late complications of head/brain injury?"
    back: "Seizures (5% of head injury patients): incidence related to severity and location; early post-traumatic seizures (within first week) increase risk of late seizures. Meningitis (associated with CSF leak). Hydrocephalus (acute or delayed NPH). Post-Concussion Syndrome: H/A, dizziness, cognitive changes, psychological/behavioural symptoms; 50% at 6 weeks, 14% at 1 year.\n\nPost-traumatic seizure timing: immediate (<24h), early (1-7 days), late (>7 days). Prophylactic antiepileptics (e.g., phenytoin, levetiracetam) reduce early but not late seizures. Post-Concussion Syndrome can be prolonged; management includes graded return to activity, cognitive rest, and psychological support."
    difficulty: medium
    tags: [neurosurgery, TBI, post-concussion syndrome, post-traumatic seizure, late complications]
  - front: "What is neurogenic shock and how does it differ from hemodynamic (hypovolemic) shock following SCI?"
    back: "Neurogenic shock: follows SCI above T6; caused by interruption of sympathetics (unopposed parasympathetics) and venous pooling from skeletal muscle paralysis; presents as hypotension + BRADYCARDIA + warm, well-perfused extremities (sBP usually <80 mmHg). Hemodynamic shock: from blood loss; hypotension + TACHYCARDIA + peripheral vascular shutdown (cool, pale, poorly-perfused extremities); suspect in multisystem trauma.\n\nThe key distinguishing feature is heart rate: neurogenic shock produces bradycardia (lost sympathetic tone → unopposed parasympathetic), while hypovolemic shock produces tachycardia. Both cause hypotension. Low BP after head injury should always raise suspicion for associated blood loss, not neurogenic shock."
    difficulty: hard
    tags: [neurosurgery, neurogenic shock, spinal cord injury, hemodynamic shock, SCI]
  - front: "What is spinal shock and how is it distinguished from neurogenic shock?"
    back: "Spinal shock: transient loss of ALL neurologic function below the level of SCI; associated with loss of bulbocavernosus reflex, flaccid paralysis, and areflexia for variable periods. It reflects the physiological silence of the spinal cord after acute injury. Neurogenic shock refers specifically to the haemodynamic instability (hypotension/bradycardia) from loss of sympathetic tone.\n\nThe bulbocavernosus reflex (anal sphincter contraction in response to squeezing the glans penis or tugging the Foley catheter) is a sacral reflex. Its return marks the end of spinal shock. Until spinal shock resolves, the SCI cannot be classified as complete vs. incomplete."
    difficulty: hard
    tags: [neurosurgery, spinal shock, bulbocavernosus reflex, SCI, neurogenic shock]
  - front: "What are the initial management steps for Spinal Cord Injury (SCI)?"
    back: "1. ABCs, immobilization (backboard/head strap), oxygenation, Foley catheter, temperature regulation. 2. Hypotension: maintain sBP >90 mmHg with pressors (dopamine), hydration, atropine; DVT prophylaxis. 3. CBC/electrolyte monitoring. 4. Assess mental status and CNs (co-occurring TBI common). 5. Focused history/exam. 6. Spine palpation. 7. Motor level (rectal exam for voluntary anal sphincter contraction). 8. Sensory level (pinprick, light touch, proprioception). 9. Reflexes. 10. Autonomic dysfunction (perspiration, bowel/bladder, priapism). 11. Radiographic evaluation (3 views C-spine, CT, MRI if neurological deficits).\n\nPatients who may have SCI: ALL significant trauma victims; minor trauma with decreased LOC, neck/back pain, weakness, abdominal breathing, numbness/tingling, or priapism. Priapism is a sign of acute SCI due to loss of sympathetic inhibition. MRI is mandatory for neurological deficits to assess soft tissue/ligamentous injury."
    difficulty: hard
    tags: [neurosurgery, SCI, spinal cord injury, initial management, immobilization]
  - front: "What are the C-spine imaging recommendations in acute trauma?"
    back: "3-view C-spine x-rays (AP, lateral, odontoid); swimmer's view if C7-T1 junction not visualized. C1-T1 must be well-visualized (~50% of injuries occur at the cervicothoracic junction). CT is now the modality of choice at most trauma centres (sensitivity >99.9% per meta-analysis; negative CT NPV 100% for unstable injury). MRI: mandatory if neurological deficits (soft tissue/ligamentous injury, disc herniation). Flexion-extension views: to disclose occult instability. Must clear spine BOTH radiologically AND clinically.\n\nThe 2011 meta-analysis (J Neurosurg) showed CT alone was sufficient to exclude cervical spine injuries in obtunded/intubated patients with sensitivity and specificity both >99.9%. A negative CT allows cervical collar removal without adjunctive MRI in this population."
    difficulty: medium
    tags: [neurosurgery, C-spine imaging, trauma, CT spine, MRI spine]
  - front: "What are the outcomes following severe TBI (GCS <8) compared to mild and moderate TBI?"
    back: "Mild TBI (GCS 13-15): post-concussive symptoms (H/A, fatigue, dizziness, memory impairment, etc.) in 50% at 6 weeks, 14% at 1 year. Moderate TBI (GCS 9-12): outcome proportional to age (>40 worse) and CT findings; 60% good recovery, 26% moderately disabled, 7% severely disabled, 7% vegetative/dead. Severe TBI (GCS <8): difficult to predict; correlates with post-resuscitation GCS (especially motor response) and age.\n\nThe motor component of GCS is the strongest predictor of outcome in severe TBI. Age >40 significantly worsens prognosis. Post-concussive symptoms are very common after mild TBI and can significantly impact quality of life and work capacity."
    difficulty: medium
    tags: [neurosurgery, TBI, outcomes, prognosis, GCS, post-concussion]
  - front: "What physical examination findings help localize a peripheral nerve injury and what investigations are used?"
    back: "Examination: muscle bulk/tone, power, sensation, reflexes; Tinel's sign (paresthesias elicited by tapping along course of nerve — localizes compression or advancing regeneration). Investigations: EMG/nerve conduction study (assess integrity and monitor recovery, useful 2-3 weeks post-injury); blood work (CBC, TSH, B12); CSF; imaging (C-spine, chest/bone x-rays, myelogram, CT, MR neurography, angiogram if vascular injury suspected).\n\nEMG/NCS should be done at 2-3 weeks post-injury because Wallerian degeneration needs time to develop and denervation potentials appear at 2-3 weeks. Earlier testing may give false-negative results. MR neurography is an emerging modality for visualizing peripheral nerve anatomy and pathology."
    difficulty: medium
    tags: [neurosurgery, peripheral nerve, Tinels sign, EMG, nerve conduction]
  - front: "What is Whiplash-Associated Disorder and what is the initial management?"
    back: "Definition: traumatic injury to soft tissue structures in the cervical region due to hyperflexion, hyperextension, or rotational injury. Initial management: as for SCI (treat as SCI until proven otherwise with imaging/clinical clearance); immobilization with cervical collar; analgesics/NSAIDs; physiotherapy; return to activity as tolerated.\n\nWhiplash is the most common cervical soft-tissue injury from motor vehicle accidents. Grade I-IV classification (Quebec Task Force). Early mobilization and active exercise programs have better outcomes than prolonged immobilization. Cervical manipulation is avoided due to rare risk of vertebral artery dissection."
    difficulty: easy
    tags: [neurosurgery, whiplash, cervical spine, soft tissue injury, SCI]
  - front: "Why is LP contraindicated after head injury without first ruling out raised ICP?"
    back: "LP in the presence of raised ICP can cause transtentorial or tonsillar herniation (brain herniation) by creating a pressure gradient between the intracranial compartment and the lumbar subarachnoid space, leading to brainstem compression and death.\n\nClinical signs suggesting raised ICP (papilledema, Cushing's triad, focal neurological deficits, decreasing LOC) or a space-occupying lesion on CT are contraindications to LP. CT head should always precede LP in suspected head injury. If bacterial meningitis is strongly suspected, start antibiotics before CT if LP is delayed."
    difficulty: medium
    tags: [neurosurgery, LP contraindication, raised ICP, herniation, head injury]
  - front: "What is the Spurling's test and what does it indicate?"
    back: "Spurling's test: neck extension combined with ipsilateral lateral flexion and rotation compresses the ipsilateral neural foramen, reproducing or worsening radicular arm pain. A positive test suggests cervical nerve root compression (radiculopathy).\n\nSpurling's test has high specificity (~93%) but moderate sensitivity (~30-50%) for cervical radiculopathy. Pain that is exacerbated by neck extension, ipsilateral rotation, and lateral flexion reflects foraminal narrowing that compresses the nerve root — the mechanism behind cervical disc syndrome symptoms."
    difficulty: medium
    tags: [neurosurgery, Spurlings test, cervical radiculopathy, physical examination]
  - front: "What are the postoperative concerns following transsphenoidal surgery for a pituitary adenoma?"
    back: "Diabetes insipidus (DI), adrenal insufficiency (AI), and CSF rhinorrhea/leak.\n\nTranssphenoidal surgery disrupts the pituitary stalk and posterior pituitary, risking DI (low ADH) and AI (low ACTH/cortisol). CSF rhinorrhea indicates a dural breach and is confirmed with beta-2-transferrin testing. Morning cortisol and serum sodium/osmolality monitoring is essential postoperatively."
    difficulty: medium
    tags: [neurosurgery, pituitary, transsphenoidal surgery, diabetes insipidus, adrenal insufficiency, CSF leak]
  - front: "How is CSF rhinorrhea confirmed after transsphenoidal surgery?"
    back: "Beta-2-transferrin (beta-transferrin) test on the nasal drainage fluid.\n\nBeta-2-transferrin is a protein unique to CSF, perilymph, and aqueous humor. It is not found in serum, mucus, or tears, making it a highly specific test for CSF identification. This is the gold standard confirmatory test for CSF fistula."
    difficulty: easy
    tags: [neurosurgery, CSF leak, CSF rhinorrhea, beta-transferrin, pituitary]
  - front: "What are the genetic mutations associated with sellar/pituitary masses?"
    back: "MEN1 (loss-of-function mutations), GNAS1 (activating mutations in ~40% of somatotroph adenomas), and AIP (familial pituitary adenomas).\n\nMEN1 encodes menin, a tumour suppressor — loss-of-function leads to multiple endocrine neoplasia type 1 including pituitary adenomas. GNAS1 activating mutations constitutively activate Gs-alpha, driving GH hypersecretion. AIP mutations predispose to familial isolated pituitary adenomas, often presenting at younger age."
    difficulty: hard
    tags: [neurosurgery, pituitary adenoma, genetics, MEN1, GNAS1, AIP]
  - front: "What is the most common pathogen in cerebral abscess?"
    back: "Streptococcus (most common), often anaerobic or microaerophilic.\n\nStreptococcus species, especially Streptococcus milleri group (anginosus), are the most common cause of cerebral abscess. Staphylococcus is associated with penetrating trauma. In neonates, Proteus and Citrobacter are the exclusive pathogens. Immunocompromised patients are susceptible to Toxoplasma, Nocardia, Candida, Listeria, Mycobacterium, and Aspergillus."
    difficulty: easy
    tags: [neurosurgery, cerebral abscess, infection, Streptococcus, microbiology]
  - front: "What are the four routes of microbial access to the CNS leading to cerebral abscess?"
    back: "1. Hematogenous spread (arterial and retrograde venous); 2. Direct implantation (dural disruption from trauma, iatrogenic, or congenital defect); 3. Contiguous spread from adjacent infection (sinusitis, otitis media, mastoiditis, dental abscess); 4. Spread from peripheral nervous system (e.g., viruses — rabies, herpes zoster).\n\nIn adults, the chest (lung abscess, bronchiectasis, empyema) is the most common hematogenous source. In children, congenital cyanotic heart disease with right-to-left shunt is a key risk factor, as it bypasses pulmonary filtration of microorganisms. Despite these routes, 10-60% of cerebral abscesses have no identifiable cause."
    difficulty: medium
    tags: [neurosurgery, cerebral abscess, pathophysiology, infection]
  - front: "A child with congenital cyanotic heart disease develops a cerebral abscess. What is the mechanism?"
    back: "Right-to-left cardiac shunt bypasses pulmonary filtration of microorganisms, allowing bacteremia to seed the brain directly.\n\nNormally, the pulmonary circulation filters bacteria from venous blood. In R-to-L shunts (e.g., Tetralogy of Fallot), venous blood with bacteria bypasses the lungs and enters the systemic circulation, reaching the brain. This is the mechanism for hematogenous cerebral abscess in children with cyanotic congenital heart disease."
    difficulty: medium
    tags: [neurosurgery, cerebral abscess, congenital heart disease, pediatrics, hematogenous spread]
  - front: "What are the CT features of a cerebral abscess?"
    back: "Ring enhancement on contrast CT, central low density (pus), and surrounding edema (vasogenic).\n\nThe ring enhancement represents the vascularized capsule around the necrotic core. The central low-density area is the pus-filled cavity. Surrounding edema reflects the host inflammatory response. MRI is the imaging of choice, with diffusion restriction (DWI bright, ADC black) differentiating abscess from tumour (tumour = ADC white/bright)."
    difficulty: easy
    tags: [neurosurgery, cerebral abscess, radiology, CT, MRI]
  - front: "What is the MRI finding that differentiates a cerebral abscess from a brain tumour?"
    back: "Apparent diffusion coefficient (ADC): cerebral abscess shows restricted diffusion (ADC dark/black), while tumour shows facilitated diffusion (ADC bright/white).\n\nCerebral abscess contains viscous pus with high cellularity and protein, restricting water diffusion (DWI bright, ADC dark). Brain tumours typically show increased ADC due to necrosis and edema. Lymphoma can also show restricted diffusion, creating diagnostic overlap."
    difficulty: medium
    tags: [neurosurgery, cerebral abscess, MRI, ADC, diffusion imaging, radiology]
  - front: "Why is lumbar puncture contraindicated in a patient with suspected cerebral abscess and a large mass?"
    back: "Large mass/abscess increases intracranial pressure; LP can precipitate transtentorial herniation by creating a pressure gradient.\n\nLP removes CSF from the lumbar sac, creating a pressure differential that can cause downward herniation of the brain through the tentorium or foramen magnum. Additionally, LP in cerebral abscess yields non-specific, rarely helpful results (elevated WBC, protein, normal glucose) and is usually culture-negative."
    difficulty: medium
    tags: [neurosurgery, cerebral abscess, lumbar puncture, contraindication, herniation, ICP]
  - front: "What is the empiric antibiotic regimen for cerebral abscess?"
    back: "Vancomycin + ceftriaxone + metronidazole (or chloramphenicol or rifampin) for 6-8 weeks.\n\nThis broad-spectrum regimen covers Gram-positives (including MRSA with vancomycin), Gram-negatives (ceftriaxone), and anaerobes (metronidazole). Duration is 4-6 weeks for surgically treated abscesses and 6-8 weeks for medically managed abscesses. Anticonvulsants are given for 1-2 years. Culture results guide revision of therapy."
    difficulty: medium
    tags: [neurosurgery, cerebral abscess, antibiotics, treatment, vancomycin, ceftriaxone, metronidazole]
  - front: "What is the prognosis of cerebral abscess with appropriate therapy?"
    back: "~10% mortality; permanent neurological deficits in approximately 50% of cases.\n\nOutcomes have improved significantly with modern imaging, neurosurgery, and antibiotics. Complications include abscess rupture causing ventriculitis, meningitis, and venous sinus thrombosis; CSF obstruction; and transtentorial herniation. Early diagnosis and treatment are key determinants of outcome."
    difficulty: easy
    tags: [neurosurgery, cerebral abscess, prognosis, mortality]
  - front: "What are the stages of cerebral abscess formation on CT/MRI?"
    back: "1. Early cerebritis (1-3 days): low attenuation/low T1, high T2, patchy contrast enhancement; 2. Late cerebritis (4-9 days): increased lesion demarcation; 3. Early capsule formation (10-13 days): ring contrast enhancement; 4. Late capsule formation (>14 days): thick capsule with multiple layers, ring enhancement.\n\nEarly cerebritis involves neutrophil accumulation with tissue necrosis and edema. Capsule formation begins around day 10 with fibroblast invasion forming a vascularized wall. The medial wall of a cerebral abscess capsule is typically thinner than the lateral wall, which has implications for drainage (medial rupture risk into ventricles)."
    difficulty: hard
    tags: [neurosurgery, cerebral abscess, pathology, CT, MRI, stages]
  - front: "What are the classic CT findings and clinical features of an epidural hematoma (EDH)?"
    back: "CT: hyperdense lenticular (biconvex/lens-shaped) mass, usually limited by suture lines. Classic clinical sequence: post-traumatic LOC → lucid interval → obtundation, hemiparesis, ipsilateral pupillary dilation, coma.\n\nThe biconvex shape results from blood accumulating in the potential space between dura and skull — dura adheres at suture lines, limiting hematoma spread. The lucid interval occurs because the brain is often initially undamaged. Progressive expansion leads to uncal herniation, CN III compression (ipsilateral pupil dilation), and contralateral hemiparesis. The classic sequence is seen in <30% of cases."
    difficulty: medium
    tags: [neurosurgery, epidural hematoma, trauma, CT, lucid interval, herniation]
  - front: "What is the most common cause of epidural hematoma?"
    back: "Rupture of the middle meningeal artery, usually from a temporal-parietal skull fracture (85% of cases).\n\nThe middle meningeal artery runs in grooves on the inner surface of the temporal bone and is vulnerable to skull fracture. The remaining cases involve the middle meningeal vein, diploic veins, dural sinus, or bone. EDH is most common in young adults (M:F = 4:1), rare in patients <2 or >60 years (dura more adherent)."
    difficulty: easy
    tags: [neurosurgery, epidural hematoma, middle meningeal artery, trauma, etiology]
  - front: "What are the criteria for conservative (non-surgical) management of epidural hematoma?"
    back: "ALL of the following must be present: small volume clot (<30 mL), clot thickness <15 mm, midline shift <5 mm, GCS >8, no focal neurological deficit.\n\nIf any criterion is not met, urgent craniotomy to evacuate the clot is indicated. Patients with EDH >10 mL on CT within 2 hours of injury or EDH in temporoparietal region require close CT follow-up at 5-6 hours post-impact. Mannitol may be given preoperatively for elevated ICP or herniation signs."
    difficulty: medium
    tags: [neurosurgery, epidural hematoma, conservative management, criteria, craniotomy]
  - front: "What is the cause of death in epidural hematoma?"
    back: "Respiratory arrest from uncal herniation causing injury to the midbrain/brainstem.\n\nAs the EDH expands, the uncus (medial temporal lobe) herniates through the tentorial notch, compressing CN III (pupillary dilation) and the midbrain. Brainstem compression disrupts the reticular activating system and respiratory centres, causing respiratory arrest. Prognosis is good with prompt management as brain parenchyma is often undamaged."
    difficulty: medium
    tags: [neurosurgery, epidural hematoma, herniation, uncal herniation, respiratory arrest]
  - front: "Compare acute vs. chronic subdural hematoma (SDH) in terms of time course, CT appearance, and typical patient population."
    back: "Acute SDH: within 1-2 days, hyperdense crescentic mass crossing suture lines, associated with significant trauma; CT: hyperdense. Chronic SDH: >15 days after onset, hypodense (liquefied clot) crescentic mass crossing suture lines, age >50, alcoholics, anticoagulated patients, minor or no trauma history.\n\nChronic SDH can imitate dementia, tumours, or TIA ('the great imitator'). Unlike EDH (lenticular/biconvex, limited by sutures), SDH is crescentic and crosses suture lines because it fills the subdural space. Chronic SDH presents with global rather than focal deficits — confusion, gait problems, lightheadedness, and minor headache."
    difficulty: medium
    tags: [neurosurgery, subdural hematoma, acute SDH, chronic SDH, CT, radiology]
  - front: "What are the indications for surgical intervention in acute subdural hematoma?"
    back: "Craniotomy if: clinically symptomatic, hematoma >1 cm thick, midline shift >5 mm, GCS decreased by >2 points from time of injury to hospital admission, or ICP persistently >20 mmHg (optimal if surgery within 4 hours of onset).\n\nAcute SDH has high mortality (up to 40-60%) due to underlying brain parenchymal injury (often from direct cortical contusion). Early surgery within 4 hours improves outcomes. If stable or improving with a small clot, serial imaging observation is appropriate."
    difficulty: hard
    tags: [neurosurgery, subdural hematoma, acute SDH, craniotomy, indications, surgery]
  - front: "What is the MRI appearance of acute vs. subacute subdural hematoma on T1 and T2 sequences?"
    back: "Acute SDH: T1 isodense, T2 dark (deoxyhemoglobin). Subacute (<3 weeks): T1 white (bright), T2 white — described as 'George Washington Bridge' on T1 and 'Oreo cookie' (black/white/black) on T2.\n\nBlood product evolution: acute = deoxyhemoglobin (T1 iso, T2 dark); subacute = methemoglobin (T1 bright, T2 bright). The 'Oreo cookie' sign on T2 in chronic/subacute SDH refers to: dark (dura) / bright (methemoglobin blood) / dark (brain). These MRI patterns help date the bleed."
    difficulty: hard
    tags: [neurosurgery, subdural hematoma, MRI, radiology, blood products]
  - front: "What is the treatment for chronic subdural hematoma?"
    back: "Burr hole drainage of liquefied clot if symptomatic or thickness >1 cm. Craniotomy if recurs more than twice. Reverse coagulopathies; seizure prophylaxis only if post-traumatic seizure occurred.\n\nChronic SDH forms when clot liquefies (hygroma formation) and osmotic gradients drive fluid accumulation. Evidence supports postoperative subdural drains to reduce recurrence risk (Cochrane review: RR 0.45 for recurrence). Overall prognosis is good as brain is usually undamaged; mortality ~8.6% at 6 months with drain vs. 18.1% without."
    difficulty: medium
    tags: [neurosurgery, subdural hematoma, chronic SDH, treatment, burr hole, drainage]
  - front: "What is the clinical presentation of subarachnoid hemorrhage (SAH)?"
    back: "Sudden onset (seconds) 'thunderclap' headache — 'worst headache of my life' — often following exertion; nausea/vomiting, photophobia, meningismus (neck stiffness, Kernig's and Brudzinski's signs), decreased LOC, focal cranial nerve deficits (CN III, IV), and ocular hemorrhage (20-40%).\n\nThe thunderclap headache is up to 97% sensitive but only 12-25% specific for SAH. Sentinel bleeds (30-60% of patients have SAH-like symptoms within 3 weeks before full SAH) are critical to recognize for urgent intervention. Ocular hemorrhage results from sudden ICP rise compressing the central retinal vein."
    difficulty: easy
    tags: [neurosurgery, subarachnoid hemorrhage, SAH, clinical features, thunderclap headache]
  - front: "What is the most common cause of spontaneous subarachnoid hemorrhage?"
    back: "Ruptured intracranial aneurysms (75-80% of spontaneous SAH cases).\n\nOther causes include idiopathic (14-22%), AVMs (4-5%), and less commonly coagulopathies, vasculitides, tumours, and cerebral artery dissections (<5%). Trauma is the most common overall cause of SAH (including all SAH). Peak age is 55-60 years, with 20% of cases under age 45."
    difficulty: easy
    tags: [neurosurgery, subarachnoid hemorrhage, SAH, aneurysm, etiology]
  - front: "What is the sensitivity of non-contrast CT for subarachnoid hemorrhage?"
    back: "98% sensitive within 12 hours, 93% within 24 hours, and nearly 100% specific.\n\nCT sensitivity decreases over time as blood lyses and dilutes. If CT is negative but clinical suspicion is high, LP is indicated and is highly sensitive. LP findings of SAH: xanthochromic supernatant (yellow, develops by ~12 hours, lasts 2 weeks), RBC >100,000/mm³ without significant drop from first to last tube, elevated opening pressure."
    difficulty: easy
    tags: [neurosurgery, subarachnoid hemorrhage, SAH, CT, diagnosis, sensitivity]
  - front: "How do you differentiate a traumatic lumbar puncture tap from true subarachnoid hemorrhage on CSF analysis?"
    back: "In SAH: RBC count >100,000/mm³ WITHOUT significant drop from tube 1 to tube 4, AND xanthochromia (yellow supernatant) present after centrifugation. In traumatic tap: RBC count decreases progressively from tube 1 to tube 4, no xanthochromia.\n\nXanthochromia results from RBC lysis and hemoglobin breakdown to bilirubin and oxyhemoglobin. It develops within 2-12 hours of SAH and persists for up to 2 weeks, confirming blood has been present for sufficient time to lyse. The RBC count remains constant in SAH because blood has mixed uniformly with CSF, unlike a fresh traumatic tap."
    difficulty: medium
    tags: [neurosurgery, subarachnoid hemorrhage, SAH, CSF, xanthochromia, lumbar puncture, traumatic tap]
  - front: "What is the gold standard investigation for intracranial aneurysm diagnosis in SAH?"
    back: "Four-vessel cerebral angiography (digital subtraction angiography, DSA) — demonstrates source in 80-85% of cases.\n\nIf angiogram is negative, repeat in 7-14 days. A consistently negative angiogram in the setting of SAH suggests 'perimesencephalic SAH,' which has a benign prognosis. CTA and MRA have sensitivity up to 95% for aneurysms, with CTA superior to MRA for smaller aneurysms and delineating bony anatomy."
    difficulty: easy
    tags: [neurosurgery, SAH, aneurysm, angiography, DSA, gold standard]
  - front: "What are the Hunt-Hess grading scale criteria for SAH?"
    back: "Grade 1: No symptoms or mild headache/mild nuchal rigidity. Grade 2: Moderate-severe headache, nuchal rigidity, no neurological deficit. Grade 3: Confusion/lethargy, mild hemiparesis or aphasia. Grade 4: GCS <15 but >8, moderate-severe hemiparesis, mild rigidity. Grade 5: Coma (GCS <9), decerebrate, moribund.\n\nThe Hunt-Hess scale grades clinical severity of SAH and correlates with prognosis. Grade 1-2 mortality is ~20%, increasing with each grade. Higher grades indicate worse vasospasm risk and outcomes. The WFNS grading scale uses GCS score with/without aphasia or hemiparesis as an alternative grading system."
    difficulty: medium
    tags: [neurosurgery, SAH, Hunt-Hess, grading, prognosis]
  - front: "What are the treatment principles for aneurysmal SAH in the ICU/NICU?"
    back: "NPO, bed rest, head of bed at 30°, minimize external stimulation, neurological vitals q1h; target sBP 120-150 mmHg; nimodipine 60 mg PO/NG q4h x 21 days; levetiracetam 500 mg PO/IV q12h x 1 week; cardiac rhythm monitoring; strict fluid balance.\n\nNimodipine (calcium channel blocker) is the only validated neuroprotective agent in SAH, reducing delayed cerebral ischemia. The BP target of 120-150 mmHg balances vasospasm prophylaxis, rebleed risk, and impaired CBF autoregulation. IV magnesium and clazosentan reduce DCI/vasospasm but do not improve functional outcomes."
    difficulty: medium
    tags: [neurosurgery, SAH, treatment, nimodipine, vasospasm, ICU, neuroprotection]
  - front: "What are the complications of subarachnoid hemorrhage?"
    back: "Vasospasm/delayed cerebral ischemia (DCI), hydrocephalus (15-20%), neurogenic pulmonary edema, hyponatremia (cerebral salt wasting, NOT SIADH), DI, cardiac complications (arrhythmias in >50%, MI, CHF), and rebleeding.\n\nHyponatremia post-SAH is due to cerebral salt wasting (increased renal sodium excretion with ECF volume loss), not SIADH (SIADH causes euvolemia). DCI is a neurological deterioration >1 hour with no other explanation, peaks 4-10 days post-ictus. Hydrocephalus results from blood obstructing arachnoid granulations — treated with extraventricular drain (acute) or shunt (chronic)."
    difficulty: hard
    tags: [neurosurgery, SAH, complications, vasospasm, hydrocephalus, hyponatremia, cerebral salt wasting]
  - front: "What is the rebleeding risk and prognosis after aneurysmal SAH?"
    back: "Rebleed risk: 4% on day 1, 15-20% within 2 weeks, 50% by 6 months. If no rebleed by 6 months, risk falls to same as unruptured aneurysm (~2%/year). Overall mortality: 50% (most within first 2-3 weeks), 30% of survivors have moderate-severe disability.\n\n10-15% of patients die before reaching hospital. Rebleeding is the major preventable cause of mortality — only early clipping or coiling prevents rebleed. For perimesencephalic SAH (non-aneurysmal), rebleed risk is similar to the general population. Endovascular coiling has higher survival at 1 and 10 years vs. surgical clipping for suitable aneurysms (ISAT trial)."
    difficulty: medium
    tags: [neurosurgery, SAH, rebleed, prognosis, aneurysm, mortality]
  - front: "What are the most common locations of saccular (berry) intracranial aneurysms?"
    back: "Anterior communicating artery (ACom): 30%; Posterior communicating artery (PCom): 25%; Middle cerebral artery (MCA): 20%; Basilar tip: 7%; Superior cerebellar artery: 3%; Vertebrobasilar junction: 2%; Posterior inferior cerebellar artery (PICA): 3%.\n\nSaccular aneurysms are located at branch points of major cerebral arteries (circle of Willis). 85-95% are in the carotid (anterior) circulation, 5-15% in the vertebrobasilar (posterior) circulation. PCom aneurysms classically produce CN III palsy (partial third nerve palsy with pupil involvement — key MCCQE1 point)."
    difficulty: medium
    tags: [neurosurgery, intracranial aneurysm, saccular, circle of Willis, locations]
  - front: "What are the risk factors for saccular intracranial aneurysms?"
    back: "Smoking, HTN, autosomal dominant polycystic kidney disease (ADPKD, 15%), fibromuscular dysplasia (7-21%), AVMs, connective tissue disorders (Ehlers-Danlos syndrome, Marfan syndrome), family history (>2 first-degree relatives), bacterial endocarditis, aortic coarctation, atherosclerosis, estrogen deficiency/menopause.\n\nADPKD is classically associated with saccular aneurysms (15% prevalence). Ehlers-Danlos (especially type IV) and Marfan syndrome weaken vessel walls. Osler-Weber-Rendu syndrome (hereditary hemorrhagic telangiectasia) increases risk. Women F>M in the 35-65 age group, prevalence 1-4% of the general population (20-30% have multiple)."
    difficulty: medium
    tags: [neurosurgery, intracranial aneurysm, risk factors, ADPKD, Ehlers-Danlos, hypertension, smoking]
  - front: "A 45-year-old woman presents with sudden-onset ptosis and a dilated, unreactive pupil. What is the diagnosis and underlying cause?"
    back: "Posterior communicating (PCom) artery aneurysm causing CN III palsy — 'surgical third nerve palsy' with pupil involvement.\n\nPCom aneurysms compress CN III as it runs near the posterior communicating artery. Pupillary fibers run on the outer surface of CN III (most sensitive to compression), causing mydriasis and loss of light reflex — distinguishing it from diabetic CN III palsy (which typically spares the pupil due to microvascular ischemia affecting the central fibers). This is a neurosurgical emergency requiring urgent angiography."
    difficulty: hard
    tags: [neurosurgery, intracranial aneurysm, PCom aneurysm, CN III palsy, pupil, emergency]
  - front: "When is endovascular coiling preferred over surgical clipping for intracranial aneurysms?"
    back: "Coiling preferred for: posterior circulation aneurysms, deep/eloquent location, basilar artery bifurcation/apex, older patients, significant comorbidities, presence of vasospasm. Clipping preferred for: difficult endovascular access, broad aneurysmal base, branching arteries at aneurysm base, tortuous/atherosclerotic vessels, hematoma requiring evacuation, acute brainstem compression.\n\nThe ISAT trial showed endovascular coiling has greater survival benefit vs. clipping at 1 year for suitable ruptured aneurysms, with sustained effect at 10 years. However, coiling has higher long-term rebleed risk than clipping (ISAT 10-year follow-up). General principle: coiling > clipping for suitable ruptured aneurysms (greater survival at 1 and 7 years post-treatment)."
    difficulty: hard
    tags: [neurosurgery, intracranial aneurysm, coiling, clipping, endovascular, ISAT]
  - front: "What is the management of unruptured intracranial aneurysms?"
    back: "Average 1.4% annual rupture risk. Generally treat aneurysms >10 mm. Consider: patient age/life expectancy, HTN, SAH history, aneurysm size/location, geographical region. Weigh risk of SAH morbidity/mortality (20-50%) vs. coiling risk (~2%). Smaller aneurysms followed with serial angiography.\n\nFive-year cumulative rupture risk by size/location (ISUIA): <7mm cavernous carotid = 0%, <7mm ACoM/MCA/ICA = 2.5%, 7-12mm = 14.5%, 13-24mm = 18.4%. Finnish and Japanese populations have significantly elevated rupture risk. Unruptured aneurysms should be managed by multidisciplinary teams balancing rupture risk (ISUIA/PHASES scores) against intervention risk."
    difficulty: hard
    tags: [neurosurgery, intracranial aneurysm, unruptured, management, ISUIA, rupture risk]
  - front: "What are the most common locations and causes of intracerebral hemorrhage (ICH)?"
    back: "Most common location: basal ganglia/internal capsule (50%), thalamus (15%), cerebral white matter (15%), pons (15%), cerebellum. Most common cause: hypertension (causes bleeds at putamen, thalamus, pons, cerebellum).\n\nHTN causes small vessel lipohyalinosis and Charcot-Bouchard microaneurysm rupture in the perforating arteries supplying deep structures. Other causes: hemorrhagic transformation post-stroke, vascular malformations (AVM, cavernoma), tumours (GBM, lymphoma, metastases), drugs (cocaine, amphetamines, anticoagulants), cerebral amyloid angiopathy (lobar hemorrhages in elderly), coagulopathy."
    difficulty: medium
    tags: [neurosurgery, intracerebral hemorrhage, ICH, hypertension, location, basal ganglia]
  - front: "What is the ICH Score and what does it predict?"
    back: "ICH Score predicts 30-day mortality. Components: GCS score (3-4=2pts, 5-12=1pt, 13-15=0pt), ICH volume (≥30 cm³=1pt, <30 cm³=0pt), presence of IVH (yes=1pt), infratentorial origin (yes=1pt), age ≥80 years (yes=1pt). Total score 0-6; higher score = higher mortality.\n\nThe ICH Score is a validated clinical tool for early prognostication. Overall 30-day mortality is 44%, mostly from cerebral herniation. It guides early goals-of-care discussions. A score of 0 has <1% mortality; score of 5-6 approaches 100% mortality. Importantly, corticosteroids should NOT be used for ICP management in ICH."
    difficulty: hard
    tags: [neurosurgery, intracerebral hemorrhage, ICH Score, prognosis, mortality]
  - front: "What is the 'spot sign' on CTA in intracerebral hemorrhage and what does it indicate?"
    back: "The spot sign is contrast enhancement (a bright spot) within the hematoma on CTA, representing active bleeding. It indicates high likelihood of clot expansion and is associated with worse outcomes.\n\nThe spot sign represents active contrast extravasation into the hematoma, indicating ongoing hemorrhage. Its presence predicts hematoma growth, neurological deterioration, and higher mortality. It guides decisions about urgent intervention and hemostatic therapy. Routine CTA is recommended in acute ICH workup."
    difficulty: medium
    tags: [neurosurgery, intracerebral hemorrhage, ICH, spot sign, CTA, radiology]
  - front: "What is the medical management of acute intracerebral hemorrhage?"
    back: "Transfer to neuro-ICU/stroke unit; decrease MAP to pre-morbid level or by ~20% (target BP 140/90 mmHg); correct coagulopathy (immediate anticoagulation reversal); control raised ICP; NO corticosteroids for ICP; levetiracetam/phenytoin for seizure prophylaxis; monitor electrolytes (SIADH common).\n\nAggressive BP control to <140 mmHg systolic is standard (based on INTERACT2 and ATACH-2 trials). Corticosteroids are explicitly contraindicated for ICP management in ICH (no benefit, potential harm). Angiogram is indicated unless patient is >45 years old with known HTN and hemorrhage in putamen/thalamus/posterior fossa (near-zero yield for vascular lesion)."
    difficulty: hard
    tags: [neurosurgery, intracerebral hemorrhage, ICH, treatment, blood pressure, anticoagulation reversal]
  - front: "What are the surgical indications and contraindications for intracerebral hemorrhage?"
    back: "Indications: rapid deterioration (brainstem compression signs), favourable location (cerebellar, non-dominant hemisphere), young patient (<50 years), suspected underlying AVM/tumour/aneurysm. Contraindications: small bleed with minimal symptoms (GCS >10), massive hemorrhage with low GCS/coma/lost brainstem function, advanced age with severe coagulopathy, difficult location (basal ganglia, thalamus).\n\nCerebellar ICH >3 cm with brainstem compression or hydrocephalus requires urgent surgical evacuation. The STICH and STICH II trials showed early surgery has limited benefit for most supratentorial ICH, but a subgroup with GCS 10-13 and lobar hemorrhage may benefit from early surgery. Ventriculostomy is used for hydrocephalus from intraventricular extension."
    difficulty: hard
    tags: [neurosurgery, intracerebral hemorrhage, ICH, surgery, craniotomy, indications]
  - front: "What are the clinical features and treatment of arteriovenous malformations (AVMs)?"
    back: "Clinical: hemorrhage (40-60%), seizures (50%), focal neurological deficits from ischemia ('steal phenomenon'), mass effect, headache, bruit. Annual bleed risk: 2-4%/year. Treatment: surgical excision (Grade I-II), stereotactic radiosurgery (SRS for small <3 cm or deep lesions), endovascular embolization (curative in 5%, adjuvant), conservative.\n\nSmall AVMs bleed more frequently due to direct high-pressure AV connections. Mortality per bleed is 12-66%, morbidity 23-40%. Surgical excision decreases future hemorrhage and seizure risk. Outcomes depend on Spetzler-Martin grade. 7% of AVMs have associated aneurysms (angiographic evaluation essential). Carotid-cavernous fistula produces: proptosis, chemosis, and bruits."
    difficulty: hard
    tags: [neurosurgery, AVM, arteriovenous malformation, treatment, SRS, hemorrhage]
  - front: "Compare cavernous malformations vs. AVMs in terms of investigation, hemorrhage risk, and treatment."
    back: "Cavernous malformations: MRI (gradient echo best for diagnosis — 'popcorn' lesion with hemosiderin ring), non-enhancing, not seen on angiography. Hemorrhage risk: 0.25-11%/year supratentorial, 2-3%/year brainstem. Treatment: surgical excision only for symptomatic accessible lesions. AVMs: diagnosed with MRI (flow voids) and angiography, 2-4%/year bleed risk, surgical excision Grade I-II.\n\nCavernous malformations (cavernomas) are angiographically occult — they cannot be seen on conventional angiography, as they have no large feeding arteries. Gradient echo MRI shows characteristic blood products. They present with seizures (60%), progressive deficits (50%), and hemorrhage (20%). Brainstem cavernomas carry higher hemorrhage risk than supratentorial. Mode of presentation (hemorrhage) and location independently predict future ICH."
    difficulty: hard
    tags: [neurosurgery, cavernous malformation, cavernoma, AVM, vascular malformations, MRI, gradient echo]
  - front: "What is a dural arteriovenous fistula (dAVF) and what are its classic clinical features?"
    back: "Dural AVF: fistulas connecting dural arteries to dural veins or dural sinus. Most common at transverse and cavernous sinuses. Related to venous sinus thrombosis. Clinical: pulsatile tinnitus (sigmoid/transverse), bruits, headache. Carotid-cavernous involvement: proptosis, chemosis, and bruits ('red eye').\n\nDural AVFs constitute 10-15% of all intracranial vascular abnormalities. They are hypothesized to arise from venous sinus thrombosis leading to microvascular shunt formation. Diagnosis: angiography is gold standard (CT does not demonstrate arterial supply). Cortical venous drainage is associated with worse outcomes (hemorrhage risk). Treatment: endovascular, surgical, or radiation depending on size, location, symptoms."
    difficulty: hard
    tags: [neurosurgery, dural AVF, arteriovenous fistula, cavernous sinus, pulsatile tinnitus, vascular malformations]
  - front: "What is a CSF fistula and how is it diagnosed and managed?"
    back: "CSF fistula: abnormal communication allowing CSF leak (rhinorrhea or otorrhea). Diagnosis: beta-2-transferrin test (gold standard), ring sign, reservoir sign, CT for pneumocephalus/fractures, CT cisternography. Treatment: lower ICP (acetazolamide, fluid restriction, avoid straining); persistent leak: lumbar drainage; surgical indications: traumatic leak >2 weeks, spontaneous leak, recurrent meningitis.\n\nCSF fistulas present with clear fluid from nose (rhinorrhea) or ear (otorrhea). Low-pressure headache (worse sitting up) is characteristic. The ring sign is positive when CSF-blood mixture forms a clear halo around the blood stain on sheets. The reservoir sign is a gush of CSF in certain head positions. Suspected in patients with recurrent meningitis after head trauma or transsphenoidal surgery."
    difficulty: medium
    tags: [neurosurgery, CSF fistula, rhinorrhea, beta-transferrin, management, CSF leak]
  - front: "What are the red flags for back pain ('BACK PAIN' mnemonic)?"
    back: "B – Bowel/Bladder dysfunction (retention or incontinence); A – Anesthesia (saddle); C – Constitutional symptoms; K – 'Khronic' disease history; P – Paresthesia; A – Age >50 or <20; I – IV drug use; N – Neuromotor deficits.\n\nThese red flags indicate potential serious pathology requiring urgent investigation: cauda equina syndrome (urinary/fecal incontinence, saddle anesthesia, bilateral leg weakness), malignancy (age >50, prior cancer, pain unrelieved by rest), infection (IV drug use, immunosuppression, fever, elevated ESR), and compression fracture (age >50, trauma, prolonged steroid use). Cauda equina syndrome is a surgical emergency."
    difficulty: easy
    tags: [neurosurgery, back pain, red flags, cauda equina, mnemonic, spinal]
  - front: "What is the epidemiology and peak age of intracranial aneurysms?"
    back: "Prevalence 1-4% of the general population; 20-30% have multiple aneurysms. F>M; peak presentation age 35-65 years (mean 50 years).\n\nDespite 1-4% prevalence, most aneurysms never rupture. Screening is recommended for patients with ≥2 first-degree relatives with SAH or intracranial aneurysms, ADPKD, and certain connective tissue disorders. Long-term serial MRA/CTA screening identifies new aneurysms in 8-11% at first screen in high-risk individuals (family history of SAH), with smoking and prior aneurysm history as significant risk factors."
    difficulty: easy
    tags: [neurosurgery, intracranial aneurysm, epidemiology, prevalence, screening]
  - front: "What are the three types of intracranial aneurysms and their characteristics?"
    back: "1. Saccular (berry): most common, at branch points of circle of Willis, 85-95% anterior circulation. 2. Fusiform: atherosclerotic, more common in vertebrobasilar system, rarely rupture. 3. Infectious (mycotic): secondary to vessel wall infection (60% Strep/Staph), 20% multiple, in 3-15% of bacterial endocarditis.\n\nSaccular aneurysms arise from congenital weakness at arterial bifurcations combined with acquired risk factors (HTN, smoking). Fusiform aneurysms cause mass effect and ischemia by involving entire vessel circumference rather than a saccular outpouching. Mycotic aneurysms develop from septic emboli (bacterial endocarditis) lodging in vessel walls — important to consider in IV drug users with stroke-like symptoms."
    difficulty: medium
    tags: [neurosurgery, intracranial aneurysm, saccular, fusiform, mycotic, types]
  - front: "What are the vascular supply zones of the spinal cord and their clinical significance?"
    back: "Anterior spinal artery (ASA) supplies anterior 2/3 of cord: corticospinal tract, spinothalamic tract, anterior horn (motor). Posterior spinal arteries (2) supply posterior 1/3: dorsal columns (fine touch, vibration, proprioception). The lateral horn (autonomic, T1-L2, S2-S5) and lateral funiculus are supplied by ASA territory.\n\nAnterior spinal artery syndrome: bilateral loss of motor function, pain, and temperature below the lesion, WITH preserved proprioception and vibration (dorsal column sparing). The great radicular artery (artery of Adamkiewicz, T8-L1) is the main blood supply to the lower thoracic/lumbar cord — injury during aortic surgery causes paraplegia. The posterior spinal arteries have rich collateral supply and are rarely affected."
    difficulty: hard
    tags: [neurosurgery, spinal cord, vascular supply, anterior spinal artery, spinal cord syndromes]
  - front: "What is hemicraniectomy and when is it indicated for malignant MCA stroke?"
    back: "Decompressive hemicraniectomy removes a large bone flap to allow brain expansion, reducing herniation risk. Indicated for malignant MCA infarction causing brain swelling and herniation. In patients >60 years, it increases survival without severe disability (38% vs. 18% in controls, OR 2.91).\n\nMalignant MCA syndrome occurs when massive MCA territory infarction causes severe cerebral edema with uncal and transtentorial herniation. Medical management has ~70% mortality. Hemicraniectomy reduces death risk but survivors may have moderate-severe disability (modified Rankin 3-4). The HAMLET, DESTINY II, and DECIMAL trials established benefit in patients ≤60 years; DESTINY II extended this to >60 years."
    difficulty: hard
    tags: [neurosurgery, hemicraniectomy, MCA stroke, decompressive surgery, malignant infarction]
  - front: "What is the pathophysiology and mechanism of delayed cerebral ischemia (DCI) after SAH?"
    back: "DCI is neurological deterioration >1 hour (4-10 days post-SAH) with no other explanation. Mechanism: multifactorial — vasospasm, vascular dysautoregulation, neurotoxic effects of blood breakdown products (oxyhemoglobin), inflammation, micro-thrombi, and cortical spreading depolarizations.\n\nDCI affects 20-30% of patients with aneurysmal SAH and is a major cause of death and disability. Large volumes of subarachnoid blood (high Fisher grade) increase DCI risk. Management includes maintaining euvolemia, nimodipine, and triple H therapy after aneurysm is secured. DCI can progress to cerebral infarction and is the most important target for SAH management after rebleeding prevention."
    difficulty: hard
    tags: [neurosurgery, SAH, delayed cerebral ischemia, DCI, vasospasm, pathophysiology]
  - front: "What is the Fisher Scale in SAH and what does it predict?"
    back: "Fisher Scale grades blood on CT and predicts vasospasm risk. Grade 1: no blood; Grade 2: diffuse thin layer <1mm; Grade 3: thick clot >1mm or localized; Grade 4: any SAH with intraventricular blood (IVH) or intracerebral extension. Higher Fisher grade = higher risk of vasospasm.\n\nThe modified Fisher scale adds IVH as a separate grade. Grade 3 has the highest vasospasm risk (~96% angiographic vasospasm). A thick subarachnoid clot releases more blood breakdown products (oxyhemoglobin) that irritate vessel walls, triggering vasospasm. The VASOGRADE combines Hunt-Hess and Fisher grades to predict DCI risk, with VASOGRADE Red having 3-fold higher DCI risk than Green."
    difficulty: medium
    tags: [neurosurgery, SAH, Fisher scale, vasospasm, CT, grading]
  - front: "What is the AO Spine Upper Cervical Spine Injury Classification system, and what do sub-categories A, B, and C signify?"
    back: "Three types: Type 1 (occipital condyle/occipitocervical joint complex), Type 2 (C1 ring/C1-2 joint complex), Type 3 (C2/C2-3 joint complex). Sub-categories: A = bony injuries only (stable), B = tension band injuries (potentially unstable), C = translational injuries (unstable).\n\nThe AO Spine classification system is now preferred over older eponymic terminology for characterizing cervical spine fractures. Recognizing stability (A vs. B vs. C) guides surgical vs. non-surgical management."
    difficulty: medium
    tags: [neurosurgery, spine, trauma, cervical spine, fractures, AO classification]
  - front: "What is a Jefferson fracture, and what is its mechanism?"
    back: "A Jefferson fracture is a C1 vertebral (atlas) ring fracture caused by vertical compression forces from the occipital condyles pushing the C1 lateral masses outward, disrupting its ring. It can also cause an occipital condylar fracture.\n\nJefferson fractures result from axial loading (e.g., diving into shallow water). Displacement of lateral masses on the open-mouth odontoid x-ray suggests instability and potential transverse ligament injury."
    difficulty: easy
    tags: [neurosurgery, spine, cervical fracture, Jefferson fracture, C1, trauma]
  - front: "What are the three types of odontoid fractures, and which type is most common and most likely to require surgery?"
    back: "Type I: tip of odontoid (stable, rare). Type II: through the base of the odontoid — most common; most likely to require surgery due to high risk of non-union (fracture in watershed zone). Type III: extends into body of C2 — often heals with immobilization.\n\nType II odontoid fractures are prone to non-union because the fracture line passes through a poorly vascularized watershed zone. Surgical fixation is considered for comminution, displacement >5 mm, or failure to maintain alignment with external immobilization."
    difficulty: medium
    tags: [neurosurgery, spine, odontoid fracture, cervical spine, C2, trauma]
  - front: "What is a hangman's fracture, and what is its typical neurological presentation?"
    back: "A hangman's fracture is a bilateral fracture through the pars interarticularis of C2 with subluxation of C2 on C3 (spondylolisthesis of the axis). Patients are usually neurologically intact.\n\nParadoxically, hangman's fractures often spare the spinal cord because bilateral pedicle fractures effectively decompress the spinal canal by expanding it. Management depends on displacement and ligamentous stability."
    difficulty: easy
    tags: [neurosurgery, spine, hangman fracture, C2, cervical fracture, trauma]
  - front: "What is a clay-shoveler fracture, and at which level does it most commonly occur?"
    back: "A clay-shoveler fracture is an avulsion fracture of a spinous process, most commonly at C6 or C7. It results from forceful muscular contraction or direct impact.\n\nClay-shoveler fractures are stable injuries caused by avulsion of the spinous process and are named for the mechanism of forceful shovel throwing. They are generally treated conservatively with collar immobilization."
    difficulty: easy
    tags: [neurosurgery, spine, clay-shoveler, cervical spine, trauma, fractures]
  - front: "What are the three columns of the thoracolumbar spine, and what is the criterion for instability?"
    back: "Anterior column: anterior half of vertebral body, disc, and anterior longitudinal ligament. Middle column: posterior half of vertebral body, disc, and posterior longitudinal ligament. Posterior column: posterior arch, facet joints, pedicle, lamina, supraspinous/interspinous/ligamentum flavum ligaments. Unstable if 4/6 segments disrupted (columns divided left and right).\n\nThe Denis three-column model helps assess thoracolumbar stability. Middle column disruption is the key indicator of instability; involvement of all three columns is associated with severe neurological injury."
    difficulty: medium
    tags: [neurosurgery, spine, thoracolumbar, three-column model, instability, trauma]
  - front: "What does the AO Spine Thoracolumbar Injury Classification System (TLICS) classify, and at what score thresholds is operative vs. non-operative management recommended?"
    back: "TLICS classifies morphology (compression=1, burst=2, translational/rotational=3, distraction=1), neurologic status (intact=0, nerve root=2, incomplete spinal cord=3, complete spinal cord=2, cauda equina=3), and posterior ligamentous complex integrity (intact=0, suspected/indeterminate=2, injured=3). Non-operative: TLICS 0-3; operative: TLICS ≥5; either: TLICS=4.\n\nTLICS guides surgical decision-making for thoracolumbar injuries by combining injury morphology, neurologic status, and ligamentous integrity. Higher scores indicate more severe injury requiring surgical intervention."
    difficulty: hard
    tags: [neurosurgery, spine, TLICS, thoracolumbar, trauma, classification]
  - front: "What are the prerequisites and clinical criteria required for the diagnosis of neurologically determined death (NDD) in Canada?"
    back: "Prerequisites: no CNS depressants/neuromuscular blocking agents, no drug intoxication/poisoning, temperature >32°C, no electrolyte/acid-base/endocrine disturbance. Clinical criteria: absent brainstem reflexes (pupillary light reflex, corneal reflexes, oculocephalic response, caloric responses, pharyngeal/tracheal reflexes, cough with tracheal suctioning), and absent respiratory drive (apnea test: PaCO₂ ≥60 mmHg, ≥20 mmHg rise above baseline, pH <7.28). Two evaluations separated in time by two specialists.\n\nNDD (brain death) diagnosis in Canada requires both prerequisites and clinical testing to be systematically fulfilled. Confirmatory tests (flat EEG, absent cerebral perfusion on angiogram) may be used when clinical exam cannot be fully performed."
    difficulty: hard
    tags: [neurosurgery, brain death, NDD, neurologically determined death, brainstem reflexes, apnea test]
  - front: "What are the confirmatory tests for neurologically determined death (NDD)?"
    back: "Flat (isoelectric) EEG and absent cerebral perfusion on cerebral angiogram.\n\nConfirmatory tests are used when the clinical examination cannot be fully performed (e.g., facial trauma, metabolic disturbance, high cervical injury). In Canada, two clinical examinations by two physicians remain the gold standard when feasible."
    difficulty: medium
    tags: [neurosurgery, brain death, NDD, EEG, cerebral angiogram, confirmatory testing]
  - front: "What defines a persistent vegetative state (PVS) and what is the average life expectancy?"
    back: "PVS is a condition of complete unawareness of self and environment, accompanied by sleep-wake cycles with complete or partial preservation of hypothalamic and brainstem autonomic function ('awake but not aware'). It follows a comatose state. Average life expectancy: 2-5 years.\n\nPVS results from irreversible loss of cerebral cortical function with intact brainstem function. It is most commonly caused by cardiac arrest or head injury. Distinguishing PVS from minimally conscious state (MCS) is important for prognosis and management."
    difficulty: easy
    tags: [neurosurgery, coma, persistent vegetative state, consciousness, prognosis]
  - front: "What are the two main pathophysiological categories of coma, and what proportion of comas does each account for?"
    back: "Structural lesions (tumour, pus, blood, infarction, CSF): account for approximately 1/3 of comas. Metabolic disorders/diffuse hemispheric damage: account for approximately 2/3 of comas.\n\nStructural causes of coma include supratentorial mass lesions causing herniation and infratentorial lesions compressing or directly damaging the reticular activating system (RAS). Metabolic causes include substrate deficiency (hypoxia, hypoglycemia), exogenous toxins, endogenous toxins, infections, and trauma."
    difficulty: easy
    tags: [neurosurgery, coma, pathophysiology, structural, metabolic]
  - front: "What is the Papile classification of intraventricular hemorrhage (IVH) in neonates?"
    back: "Grade I: germinal matrix hemorrhage only. Grade II: IVH without ventricular dilation. Grade III: IVH with ventricular dilation. Grade IV: IVH with parenchymal hemorrhage (periventricular hemorrhagic infarction).\n\nThe Papile classification stratifies severity of IVH in preterm infants. Grades I and II have relatively favorable prognosis; Grade IV carries the greatest morbidity and mortality, including posthemorrhagic hydrocephalus requiring VP shunt."
    difficulty: medium
    tags: [neurosurgery, neonatal, IVH, intraventricular hemorrhage, Papile classification, prematurity]
  - front: "What are the risk factors for intraventricular hemorrhage (IVH) in preterm neonates?"
    back: "Prematurity (<32 weeks GA), birth weight <1500 g, need for vigorous resuscitation, pneumothorax, ventilated preterm infants, hemodynamic instability, respiratory distress syndrome (RDS), chorioamnionitis, coagulopathy.\n\nIVH originates in the periventricular subependymal germinal matrix, which is fragile and highly vascular. The germinal matrix involutes with advancing gestational age, making extreme prematurity the primary risk factor."
    difficulty: easy
    tags: [neurosurgery, neonatal, IVH, prematurity, risk factors, germinal matrix]
  - front: "When does IVH most commonly occur in preterm neonates, and how is it screened?"
    back: "50% of IVH occurs within 8 hours of birth; 90% occurs by day 3. Routine head ultrasound screening is conducted for all preterm infants <32 weeks GA or <1500 g throughout the NICU stay.\n\nThe early timing of IVH reflects the hemodynamic instability of the perinatal period. Serial cranial ultrasounds allow monitoring of hemorrhage evolution and development of posthemorrhagic hydrocephalus."
    difficulty: easy
    tags: [neurosurgery, neonatal, IVH, screening, ultrasound, NICU]
  - front: "What are the long-term neurological sequelae of severe intraventricular hemorrhage (Grade III-IV)?"
    back: "Cerebral palsy (CP), cognitive deficits, motor deficits, visual impairment, and hearing impairment. Short-term: mortality, extension of bleed, posthemorrhagic hydrocephalus, posthemorrhagic infarction, cyst formation.\n\nGrade IV IVH (periventricular hemorrhagic infarction) is associated with the greatest morbidity. Posthemorrhagic hydrocephalus may require VP shunt placement. Ongoing monitoring with serial imaging is essential."
    difficulty: medium
    tags: [neurosurgery, neonatal, IVH, prognosis, sequelae, cerebral palsy]
  - front: "What is Dandy-Walker malformation, and what are its key anatomical features?"
    back: "Atresia of the foramina of Magendie (median) and Luschka (lateral), resulting in: complete or incomplete agenesis of the cerebellar vermis with hypoplastic cerebellar hemispheres, posterior fossa cyst with enlarged posterior fossa, and dilation of the 4th ventricle (also 3rd and lateral ventricles). Associated anomalies: hydrocephalus (90%), agenesis of corpus callosum (17%), occipital encephalocele (7%).\n\nDandy-Walker malformation accounts for 2-4% of pediatric hydrocephalus. It can be detected in utero by ultrasound. Prognosis: 75-100% survival, but only 50% have normal IQ."
    difficulty: medium
    tags: [neurosurgery, pediatric, Dandy-Walker, hydrocephalus, congenital, cerebellar]
  - front: "Compare Chiari Type I and Type II malformations: definition, age at presentation, clinical features, and treatment."
    back: "Chiari I: cerebellar tonsils below foramen magnum; average presentation age 15 yr; often asymptomatic or pain (69%), weakness (56%), numbness (52%), central cord syndrome (65%), syringomyelia (50%); treatment: symptomatic patients — suboccipital craniectomy + duraplasty. Chiari II: cerebellar vermis, medulla, and 4th ventricle extend through foramen magnum; presents in infancy; neurogenic dysphagia (69%), apnea (58%), stridor (56%), arm weakness (27%); most common cause of mortality is respiratory arrest; associated with MMC and hydrocephalus; treatment: check shunt first, then consider cervical laminectomy + duraplasty.\n\nChiari II is almost always associated with myelomeningocele (MMC) and hydrocephalus. In symptomatic Chiari II, shunt malfunction should be excluded before attributing symptoms to the Chiari malformation itself."
    difficulty: hard
    tags: [neurosurgery, Chiari, congenital, pediatric, syringomyelia, myelomeningocele]
  - front: "What are the three major types of spinal dysraphism and their key distinguishing features?"
    back: "Spina bifida occulta (occulta): congenital absence of spinous process/lamina, no visible lesion, skin intact, 15-20% of general population; no treatment needed. Meningocele (aperta): herniation of meningeal tissue and CSF through spinal defect, no neural tissue herniation, no disability, low hydrocephalus incidence; surgical excision. Myelomeningocele (aperta): herniation of meningeal AND CNS tissue, sensory/motor deficits, urinary/fecal incontinence, hydrocephalus in 65-85%, most have Type II Chiari; surgical closure.\n\nSpinal dysraphism spans a spectrum from incidental spina bifida occulta to severe myelomeningocele requiring multidisciplinary management. Lumbosacral cutaneous markers (dimple, sinus, port-wine stain, hair tuft) should prompt further investigation for occult dysraphism."
    difficulty: medium
    tags: [neurosurgery, pediatric, spinal dysraphism, myelomeningocele, spina bifida, congenital]
  - front: "What are the prognosis figures for myelomeningocele (MMC)?"
    back: "Operative mortality close to 0%; 95% two-year survival; 80% have IQ >80 (most 80-95); 40-85% are ambulatory; 3-10% have normal urinary continence. Early mortality: usually due to Chiari malformation complications (respiratory arrest, aspiration). Late mortality: due to shunt malfunction.\n\nDespite near-zero operative mortality, MMC carries significant long-term morbidity including neurogenic bladder, lower limb paralysis, and hydrocephalus. In-utero closure (before 26 weeks GA) has been shown to decrease hydrocephalus and improve motor scores (MOMS trial, NEJM 2011)."
    difficulty: medium
    tags: [neurosurgery, myelomeningocele, prognosis, pediatric, hydrocephalus, Chiari]
  - front: "What did the MOMS trial (NEJM 2011) demonstrate about prenatal vs. postnatal repair of myelomeningocele?"
    back: "Prenatal surgery (before 26 wks GA) reduced the need for CSF shunting (40% vs. 82% in postnatal group, P<0.001) and improved mental development and motor function, but was associated with increased gynecological complications for the mother.\n\nThe MOMS trial was a landmark RCT validating in-utero MMC repair. The reduction in shunt requirement and improved motor outcomes must be weighed against maternal and fetal risks including preterm delivery and uterine dehiscence."
    difficulty: hard
    tags: [neurosurgery, myelomeningocele, MOMS trial, prenatal repair, evidence-based medicine]
  - front: "What is craniosynostosis, and which suture is most commonly involved?"
    back: "Craniosynostosis is premature closure of the cranial suture(s). Sagittal synostosis is most common (long, narrow head — scaphocephaly). Others: coronal (brachycephaly), metopic (trigonocephaly), lambdoid (least common). Incidence: 0.6 per 1000 live births; most cases sporadic.\n\nThe resulting skull shape depends on which suture closes prematurely, because growth occurs perpendicular to open sutures. Surgery is indicated for elevated ICP (>2 sutures involved) and may be done for cosmesis even with single suture involvement."
    difficulty: easy
    tags: [neurosurgery, pediatric, craniosynostosis, skull deformity, ICP, congenital]
  - front: "What is the epidemiology of pediatric brain tumours, and which location is most common?"
    back: "Pediatric brain tumours are the second most common pediatric cancer (after leukemia), accounting for 20% of all pediatric cancers. 60% are infratentorial. 90% of neonatal brain tumours are infratentorial (medulloblastoma) or pineal gland (pineoblastoma).\n\nThe infratentorial predominance of pediatric brain tumours (especially in the posterior fossa) distinguishes them from adult tumours, which are predominantly supratentorial. This has important implications for clinical presentation (hydrocephalus, cerebellar signs)."
    difficulty: easy
    tags: [neurosurgery, pediatric, brain tumour, epidemiology, infratentorial, medulloblastoma]
  - front: "Summarize the key features of the five main pediatric brain tumour types: pilocytic astrocytoma, medulloblastoma, ependymoma, hemangioblastoma, and craniopharyngioma."
    back: "Pilocytic astrocytoma: usually posterior fossa, well-circumscribed, benign, good prognosis. Medulloblastoma: PNET, in cerebellum → compresses 4th ventricle → hydrocephalus, highly malignant. Ependymoma: in 4th ventricle → hydrocephalus, poor prognosis. Hemangioblastoma: often cerebellar, associated with von Hippel-Lindau syndrome + retinal angiomas, can produce EPO → secondary polycythemia. Craniopharyngioma: causes bitemporal hemianopia (confused with pituitary adenoma), most common supratentorial childhood tumour, benign.\n\nMedulloblastoma and craniopharyngioma are frequently tested on the MCCQE1. Hemangioblastoma's association with VHL syndrome and EPO production (causing polycythemia) is a classic teaching point."
    difficulty: medium
    tags: [neurosurgery, pediatric brain tumour, medulloblastoma, craniopharyngioma, hemangioblastoma, ependymoma, pilocytic astrocytoma]
  - front: "What are the indications, preferred targets, and outcomes of deep brain stimulation (DBS) for Parkinson's disease?"
    back: "Indications: intractable contralateral bradykinesia/tremor, failure of medical management, drug-induced dyskinesias. Preferred target: subthalamic nucleus (STN) or globus pallidus interna (GPi); Parkinsonian tremor: ventral intermediate (Vim) nucleus of thalamus. Outcomes: 39-48% improvement in UPDRS scores, reduced medication dosage with STN target, more effective than medical management in advanced disease.\n\nBilateral DBS is the most common surgical procedure for Parkinson's disease. STN targeting is preferred for overall motor improvement and medication reduction. GPi targeting may be preferred to minimize cognitive/psychiatric side effects (STN > GPi for cognitive/psychiatric morbidity)."
    difficulty: hard
    tags: [neurosurgery, functional neurosurgery, DBS, Parkinsons disease, STN, GPi]
  - front: "What are the DBS targets for essential tremor (ET), and what novel non-invasive treatment is available?"
    back: "Preferred target: stereotactic ablation (thalamotomy) or stimulation of the Vim nucleus of thalamus. Other targets: stimulation of caudal zona incerta. Novel: MRI-guided focused ultrasound (MRgFUS) thalamotomy for ET.\n\nDBS of the Vim nucleus is the first DBS indication approved (essential tremor). MRgFUS thalamotomy is a newer non-invasive option that uses focused ultrasound energy to ablate the Vim nucleus, avoiding surgical risks. Tolerance to DBS can develop over time."
    difficulty: medium
    tags: [neurosurgery, functional neurosurgery, essential tremor, DBS, thalamotomy, focused ultrasound]
  - front: "What are the surgical options for primary dystonia vs. secondary dystonia in DBS?"
    back: "Primary dystonia: preferred target is stereotactic ablation (pallidotomy) or stimulation of the posteroventral globus pallidus interna (GPi); 51% reduction in Burke-Fahn-Marsden Dystonia Scale (BFMDS) score. Secondary dystonia (e.g., drug-induced, L-dopa, neuroleptics): stimulation of anterodorsal STN; 62-89% improvement. Note: effects are delayed (weeks to months).\n\nThe distinction between primary and secondary dystonia guides DBS target selection. The delayed onset of DBS effects in dystonia (compared to the immediate effects seen in tremor/PD) is a key clinical feature to remember."
    difficulty: hard
    tags: [neurosurgery, functional neurosurgery, dystonia, DBS, GPi, STN]
  - front: "What are the DBS procedures and outcomes for OCD, Tourette's syndrome, and major depressive disorder (MDD)?"
    back: "OCD: anterior capsulotomy/stimulation of anterior limb of internal capsule (IC); 50-60% response rate (>35% reduction in anxiety at 1 yr). Tourette's: stimulation of midline intralaminar thalamic nuclei or motor/limbic portions of GPi; >70% reduction in tics. MDD: stimulation of subgenual cingulate cortex or nucleus accumbens, or anterior capsulotomy/cingulotomy; 60% response, 35% remission at 1 yr. All: ICH risk 1-2%.\n\nPsychiatric neurosurgery is indicated only for severe, treatment-refractory conditions. Stereotactic ablative procedures (cingulotomy, capsulotomy) for MDD and OCD lack Level I evidence and remain investigational. Ethics including patient capacity and consent are particularly important."
    difficulty: hard
    tags: [neurosurgery, functional neurosurgery, DBS, OCD, MDD, Tourette, psychiatric neurosurgery]
  - front: "What are the surgical indications and procedures for medically refractory epilepsy?"
    back: "Indications: recurrent seizures resistant to two first-line anti-seizure medications in succession, with a distinct epileptogenic region identified by EEG/SEEG, MRI, neuropsychological testing. Procedures: adults — resection of hippocampus and parahippocampal gyrus for mesial temporal lobe epilepsy from mesial temporal sclerosis; children — resection of epileptogenic space-occupying lesion. Palliative if no distinct region: corpus callosotomy. Other: hemispherectomy, DBS in thalamus.\n\nFailure of two appropriate AEDs defines medically refractory epilepsy. Early surgical referral is recommended. Temporal lobe resection achieves 41-79% seizure freedom at 5 years in adults, and 58-78% in children."
    difficulty: hard
    tags: [neurosurgery, epilepsy surgery, temporal lobe, mesial temporal sclerosis, corpus callosotomy, DBS]
  - front: "What are the positive predictive factors for seizure freedom following anteromedial temporal lobectomy?"
    back: "Hippocampal sclerosis (unilateral), focal localization of interictal epileptiform discharges, absence of preoperative generalized seizures, tumoral etiology, and complete resection of the lesion.\n\nThese factors help identify patients most likely to benefit from epilepsy surgery. Bilateral or poorly localized seizure onset predicts worse surgical outcome. Neuroimaging biomarkers for neuromodulation response are under active investigation."
    difficulty: medium
    tags: [neurosurgery, epilepsy surgery, temporal lobectomy, prognosis, predictors, hippocampal sclerosis]
  - front: "What are the surgical options for trigeminal neuralgia refractory to medical management?"
    back: "1) Trigeminal nerve branch procedures: local blocks (phenol/alcohol), neurectomy. 2) Percutaneous trigeminal rhizotomy: glycerol injection, balloon catheter mechanotrauma, radiofrequency thermocoagulation. 3) Gamma Knife radiosurgery. 4) Microvascular decompression (MVD): posterior fossa craniotomy, microsurgical exploration of root entry zone, displacement of offending vessel with Teflon felt.\n\nMVD offers the longest-lasting pain relief and is curative in the majority of patients. It is preferred in younger, medically fit patients. Percutaneous procedures and Gamma Knife offer less invasive options for elderly or medically unfit patients but have higher recurrence rates."
    difficulty: medium
    tags: [neurosurgery, trigeminal neuralgia, microvascular decompression, Gamma Knife, functional neurosurgery]
  - front: "What were the key findings of the STICH trial regarding surgical management of spontaneous intracerebral hemorrhage?"
    back: "STICH (Lancet 2005) randomized patients to early surgery (within 24 h) vs. initial conservative treatment. Result: 26% vs. 24% favourable outcomes — not statistically significant (P=0.414). Conclusion: No additional benefit of early surgery over initial conservative treatment for spontaneous supratentorial intracerebral hemorrhage.\n\nSTICH demonstrated that routine early surgery does not improve outcomes in spontaneous ICH, supporting initial conservative management in most patients. Subgroup analysis suggested potential benefit for superficial hematomas without IVH extension."
    difficulty: hard
    tags: [neurosurgery, intracerebral hemorrhage, STICH trial, evidence-based medicine, landmark trials]
  - front: "What were the key findings of DESTINY, DECIMAL, and HAMLET trials regarding decompressive craniectomy for malignant MCA infarction?"
    back: "DESTINY: 88% vs. 47% 30-day survival with decompressive surgery vs. conservative (P=0.02). DECIMAL: 52.8% absolute reduction in death with early craniectomy, but greater moderate disability. HAMLET: Craniectomy reduced case fatality (absolute risk reduction 38%) but no effect on functional outcome at 1 yr. Meta-analysis of all three: surgery within 48 h reduced poor outcomes and case fatality.\n\nHemicraniectomy is life-saving for malignant MCA infarction but survivors may have significant disability. Surgery must be initiated within 48 h for optimal benefit — timing is critical. Patient selection and patient/family counseling regarding disability are essential."
    difficulty: hard
    tags: [neurosurgery, MCA infarction, hemicraniectomy, DESTINY, DECIMAL, HAMLET, landmark trials]
  - front: "What is the standard of care for newly diagnosed glioblastoma multiforme (GBM) based on the landmark Stupp trial (NEJM 2005)?"
    back: "Radiotherapy (XRT) plus concomitant daily temozolomide followed by 6 cycles of adjuvant temozolomide. Result: 2-year survival rate 26.5% (XRT + temozolomide) vs. 10.4% (XRT alone). Grade 3-4 hematologic toxicity in 7% of patients.\n\nThe Stupp protocol established concurrent temozolomide with radiation followed by adjuvant temozolomide as the standard of care for GBM. MGMT promoter methylation status is predictive of response to temozolomide."
    difficulty: medium
    tags: [neurosurgery, glioblastoma, temozolomide, Stupp trial, landmark trials, CNS tumours]
  - front: "What is the return of which reflex indicates resolution of spinal shock?"
    back: "The bulbocavernosus reflex is the most commonly used indicator of spinal shock resolution.\n\nSpinal shock is a transient condition following SCI characterized by loss of all reflexes below the level of injury. Its resolution (marked by return of the bulbocavernosus reflex) allows accurate assessment of the true extent of neurological injury using the AIS classification."
    difficulty: medium
    tags: [neurosurgery, spinal cord injury, spinal shock, bulbocavernosus reflex, AIS classification]
  - front: "Within what time window is methylprednisolone used in acute spinal cord injury, and what is its current status in practice?"
    back: "Methylprednisolone may be given within 8 hours of injury. Its use is controversial and must be discussed with the Neurosurgery service — it is not standard of care and requires individual decision-making.\n\nHigh-dose methylprednisolone (NASCIS protocol) was previously widely used but has fallen out of favour due to lack of clear neurological benefit and significant risks (infection, gastrointestinal bleeding, pulmonary complications). Current guidelines do not recommend routine use."
    difficulty: medium
    tags: [neurosurgery, spinal cord injury, methylprednisolone, management, controversy]
  - front: "What is the recommended timing for surgical decompression and stabilization in severe spinal cord injury (AIS A-C)?"
    back: "Surgical decompression and stabilization is recommended within 24 hours of all types of severe SCI (AIS A-C), regardless of level, provided the patient is medically stable.\n\nThe STASCIS trial demonstrated that early decompressive surgery (<24 h) for cervical SCI led to significantly greater neurological improvement (2+ AIS grade improvement) compared to late surgery (>24 h), supporting early surgical intervention."
    difficulty: medium
    tags: [neurosurgery, spinal cord injury, surgical decompression, AIS, STASCIS trial, timing]
  - front: "What are the pediatric hydrocephalus clinical features that differ from adults, and what are the main etiologies in children?"
    back: "Clinical features (age-related): increased head circumference, bulging anterior fontanelle, widened cranial sutures, irritability, lethargy, poor feeding, vomiting, 'cracked pot' sound on cranial percussion, scalp vein dilation, 'sunset eyes' (setting-sun sign), episodic bradycardia and apnea. Congenital causes: aqueductal anomalies/stenosis, secondary gliosis from intrauterine viral infections (mumps, varicella, TORCH), Dandy-Walker malformation (2-4%), Chiari II malformation, MMC. Acquired: post-meningitis, post-hemorrhage (SAH, IVH), masses.\n\nThe expandable skull in infants allows head circumference to increase before ICP rises significantly, leading to delayed diagnosis. The setting-sun sign (downward deviation of eyes) reflects pressure on the dorsal midbrain (Parinaud syndrome)."
    difficulty: medium
    tags: [neurosurgery, pediatric, hydrocephalus, clinical features, etiology, congenital]
  - front: "What cutaneous findings over the lumbosacral region should raise suspicion for occult spinal dysraphism?"
    back: "Lumbosacral cutaneous abnormalities including: dimple, sinus, port-wine stain, and hair tuft. These should prompt investigation for underlying anomalies such as lipoma, dermoid, or diastematomyelia.\n\nSpina bifida occulta with no associated tethering or mass generally requires no treatment, but cutaneous markers may indicate an underlying tethered cord, lipomyelomeningocele, or dermoid that may cause progressive neurological deterioration and require surgery."
    difficulty: easy
    tags: [neurosurgery, pediatric, spinal dysraphism, spina bifida occulta, tethered cord, cutaneous markers]
  - front: "What is the most common cause of early mortality in myelomeningocele (MMC), and what causes late mortality?"
    back: "Early mortality: usually due to Chiari malformation complications — respiratory arrest and aspiration. Late mortality: due to shunt malfunction.\n\nChiari II malformation causes brainstem dysfunction including apnea, stridor, and dysphagia in MMC patients. Respiratory arrest is the most common cause of early death. Vigilant monitoring for shunt malfunction is critical for long-term survival."
    difficulty: medium
    tags: [neurosurgery, myelomeningocele, Chiari II, shunt malfunction, mortality, pediatric]
  - front: "What is the ISUIA study's key conclusion regarding management of unruptured intracranial aneurysms (UIA)?"
    back: "In clinical decision-making, site-, size-, and group-specific risks of the natural history of unruptured aneurysms should be weighed against the site-, size-, and age-specific risks of repair (surgical or endovascular) for each patient. 5-year rupture rates were progressively higher for larger aneurysms, and slightly higher for posterior circulation aneurysms.\n\nISUIA (Lancet 2003, n=4060) established the foundation for individualized management of UIAs. Age, aneurysm size, and location are key predictors of both rupture risk and treatment risk. Small (<7 mm) anterior circulation aneurysms have very low annual rupture rates in patients without prior SAH."
    difficulty: hard
    tags: [neurosurgery, unruptured aneurysm, ISUIA, landmark trials, cerebrovascular, evidence-based medicine]
