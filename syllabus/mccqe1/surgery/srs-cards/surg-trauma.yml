    back: "Age-related disease characterized by decreased bone mass and increased susceptibility to fractures\n\nOsteoporosis is defined by the 2023 Canadian guidelines as an age-related condition with decreased bone mass and increased fracture susceptibility."
    difficulty: easy
    tags: [osteoporosis, definition, bone-health, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
