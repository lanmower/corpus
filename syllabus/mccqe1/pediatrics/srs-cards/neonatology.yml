# Neonatology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the Apgar score and what does it assess?"
    back: "Assessed at 1 and 5 minutes. Scores 0-2 for each of 5 parameters: Appearance (color), Pulse (heart rate), Grimace (reflex irritability), Activity (muscle tone), Respiration. Maximum score is 10.\n\nIf <7 at 5 minutes, reassess every 5 minutes until ≥7. However, do not wait for Apgar scoring before initiating resuscitation. Approximately 10% of newborns require breathing assistance after delivery."
    difficulty: easy
    tags: [neonatology, resuscitation, Apgar]
  - front: "What newborn screening tests are included in Ontario?"
    back: "Metabolic disorders (amino acid, organic acid, fatty acid oxidation), blood disorders (sickle cell, hemoglobinopathies), endocrine disorders (CAH, congenital hypothyroidism), CF, SCID, congenital hearing loss, critical CHD, SMA, and congenital CMV.\n\nEarly detection through newborn screening allows treatment before irreversible damage occurs. For example, treating congenital hypothyroidism within 1-2 months of birth yields excellent outcomes."
    difficulty: easy
    tags: [neonatology, screening, preventive medicine]
  - front: "What is the definition and management of neonatal hypoglycemia?"
    back: "Glucose <2.6 mmol/L within 72h of birth or <3.3 mmol/L after 72h. Identify at-risk infants (IDM, LGA, SGA, preterm), begin oral feeds early, check glucose at 2h. If symptomatic: IV D10W.\n\nSigns are non-specific: jitteriness, lethargy, poor feeding, tremors, seizures. Persistent hypoglycemia requires 'critical blood work' during an episode: glucose, insulin, cortisol, GH, lactate, ammonia, ketones, and free fatty acids."
    difficulty: medium
    tags: [neonatology, hypoglycemia, metabolic]
  - front: "What is the difference between breastfeeding jaundice and breast milk jaundice?"
    back: "Breastfeeding jaundice: due to insufficient milk intake causing dehydration and exaggerated physiologic jaundice (early onset). Breast milk jaundice: due to glucuronyl transferase inhibitor in breast milk, onset at 7 days, peaks at 2-3 weeks, resolves by 6 weeks.\n\nBreastfeeding jaundice is common and related to poor latch or inadequate milk production. Breast milk jaundice affects 1 in 200 breastfed infants. Neither condition typically requires cessation of breastfeeding."
    difficulty: medium
    tags: [neonatology, jaundice, breastfeeding]
  - front: "When is neonatal jaundice always pathologic?"
    back: "Jaundice within the first 24 hours of life and conjugated hyperbilirubinemia are always pathologic.\n\nCauses of early jaundice include hemolytic disease (Rh/ABO incompatibility, G6PD deficiency), sepsis, and congenital infections (TORCH). Conjugated hyperbilirubinemia requires urgent investigation for biliary atresia, neonatal hepatitis, or metabolic disorders."
    difficulty: easy
    tags: [neonatology, jaundice, hyperbilirubinemia]
  - front: "What is kernicterus and how is it prevented?"
    back: "Kernicterus is unconjugated bilirubin deposition in the brain (basal ganglia/brainstem) causing permanent damage. Prevention: phototherapy, exchange transfusion, and IVIG for severe hemolytic disease.\n\nRisk increases above 340 μmol/L but can occur at lower levels with sepsis, hemolysis, or prematurity. Acute signs include lethargy, hypotonia, then hypertonia, high-pitched cry, and seizures. Chronic sequelae include choreoathetoid cerebral palsy and sensorineural hearing loss."
    difficulty: medium
    tags: [neonatology, kernicterus, hyperbilirubinemia]
  - front: "What is biliary atresia and when should Kasai procedure be performed?"
    back: "Atresia of extrahepatic bile ducts causing progressive cholestasis with conjugated hyperbilirubinemia. Presents with dark urine, pale stools, jaundice persisting >2 weeks, hepatomegaly. Kasai hepatoportoenterostomy is most successful if performed before 8 weeks of age.\n\nBiliary atresia occurs in 1 in 10,000-15,000 births. Two-thirds eventually require liver transplant. Diagnosis involves conjugated hyperbilirubinemia, abdominal ultrasound, and liver biopsy. Fat-soluble vitamins (A, D, E, K) supplementation is essential."
    difficulty: medium
    tags: [neonatology, GI, biliary atresia]
  - front: "What is the hallmark radiographic finding of necrotizing enterocolitis (NEC)?"
    back: "Pneumatosis intestinalis (intramural air) on abdominal x-ray.\n\nNEC primarily affects preterm newborns and presents at 2-3 weeks of age with abdominal distension, feeding intolerance, and bloody stools. Treatment is NPO, NG decompression, IV antibiotics, and TPN. Surgery is needed for perforation (40% mortality)."
    difficulty: easy
    tags: [neonatology, NEC, radiology]
  - front: "How do you differentiate RDS, TTN, and MAS in a newborn?"
    back: "RDS: preterm, surfactant deficiency, homogeneous infiltrates/air bronchograms on CXR. TTN: term/late preterm, delayed fetal lung fluid resorption, perihilar 'wet silhouette.' MAS: term/post-term, meconium-stained fluid, patchy infiltrates with hyperinflation.\n\nRDS is treated with surfactant and ventilation. TTN is self-limited (24-72h). MAS can cause chemical pneumonitis and PPHN. Prenatal corticosteroids reduce RDS risk if delivery <34 weeks."
    difficulty: medium
    tags: [neonatology, respiratory, RDS]
  - front: "What is the hyperoxia test and what does it differentiate?"
    back: "Baseline PaO2 in room air, then PaO2 on 100% O2. PaO2 >150 mmHg: respiratory or non-cardiac cause. PaO2 <150 mmHg: cyanotic congenital heart disease or PPHN.\n\nThe hyperoxia test helps differentiate cardiac from pulmonary causes of cyanosis. Pre- and post-ductal pulse oximetry difference >5% suggests right-to-left shunt through the ductus arteriosus."
    difficulty: medium
    tags: [neonatology, cardiology, cyanosis]
  - front: "What is the congenital diaphragmatic hernia presentation, and what should you NOT do at delivery?"
    back: "Respiratory distress, cyanosis, scaphoid abdomen, barrel chest, absent breath sounds on affected side, bowel sounds in chest. Do NOT bag-mask ventilate - immediate intubation required.\n\nBag-mask ventilation forces air into the stomach, further compressing the lungs. Associated with pulmonary hypoplasia and PPHN. CXR shows bowel loops in thorax with displaced mediastinum. Place large bore OG tube to decompress bowel."
    difficulty: medium
    tags: [neonatology, surgery, diaphragmatic hernia]
  - front: "What empiric antibiotics are used for neonatal sepsis (early onset)?"
    back: "IV ampicillin + gentamicin (non-meningitic coverage). If meningitis suspected: IV ampicillin + cefotaxime.\n\nEarly onset sepsis (<72h) is from vertical transmission, most commonly GBS, E. coli, and Listeria. Risk factors include maternal GBS positivity, prolonged rupture of membranes >18h, and chorioamnionitis. Add acyclovir if HSV suspected."
    difficulty: easy
    tags: [neonatology, infectious disease, sepsis, antibiotics]
