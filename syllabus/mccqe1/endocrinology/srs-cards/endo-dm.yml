  - front: "What proportion of T2DM patients in the 4T Trial reached HbA1c targets <6.5% or <7.0%?"
    back: "A smaller proportion of patients in the biphasic insulin arm reached HbA1c <6.5% or <7.0% compared to the other arms.\n\nThe 4T Trial compared three insulin regimens over 3 years and found the biphasic arm had the lowest proportion achieving glycemic targets."
