# Family Medicine Contraception (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the options for emergency contraception (EC), and how do they compare in effectiveness?"
    back: "1. Hormonal EC (Plan B® / Yuzpe® — 2 doses 12 hours apart): effective within 72 hours (reduces pregnancy risk by 75–85%); most effective within 24 hours; some effectiveness up to 5 days. Plan B® is available OTC at pharmacies across Canada. EC Ella® can be taken up to 5 days post-intercourse. 2. Copper IUD: inserted within 5 days of unprotected intercourse; ~99% effective (significantly more effective than hormonal EC). Note: hormonal EC does NOT affect an established pregnancy. Pregnancy test should be done if no menstrual bleeding within 21 days.\n\nThe copper IUD is the most effective form of EC and can also serve as ongoing contraception. Advance provision of hormonal EC increases its use without decreasing regular contraceptive use. Pharmacists across Canada can dispense Plan B® OTC — an important access point for patients."
    difficulty: easy
    tags: [emergency contraception, Plan B, copper IUD, gynecology, family medicine]
