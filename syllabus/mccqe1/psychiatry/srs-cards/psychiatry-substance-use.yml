# Psychiatry Substance Use (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What is the DSM-5 severity classification for substance use disorders based on number of criteria met within 12 months?"
    back: "Mild: 2-3 criteria; Moderate: 4-5 criteria; Severe: 6 or more criteria.\n\nSubstance use disorders are diagnosed on a continuum of severity. A single patient can have multiple co-occurring substance use disorders (e.g., moderate alcohol use disorder AND mild stimulant use disorder). Severity guides treatment intensity."
    difficulty: easy
    tags: [substance use disorder, DSM-5, diagnosis, psychiatry]
  - front: "List the DSM-5 criteria for substance use disorder using the mnemonic PEC WITH MCAT."
    back: "P – use despite Physical/psychological problem; E – failure to fulfill External roles; C – Craving; W – Withdrawal; I – continued use despite Interpersonal problems; T – Tolerance; H – use in physically Hazardous situations; M – More substance used/longer than intended; C – unsuccessful attempts to Cut down; A – Activities given up; T – excessive Time spent using/finding substance.\n\nAll 11 criteria apply across substance types. Diagnosis requires at least 2 criteria in a 12-month period. Neither intoxication alone nor a positive urine screen constitutes a substance use disorder."
    difficulty: medium
    tags: [substance use disorder, DSM-5, criteria, psychiatry]
  - front: "What is the role of urine drug screens and serum toxicology in diagnosing substance use disorders?"
    back: "Urine drug screens detect recent drug use but cannot diagnose substance use disorders. Serum toxicology measures recent alcohol consumption but has no relation to the diagnosis of alcohol use disorder. Positive results cannot determine frequency or amount used; negative results cannot rule out use.\n\nToxicology is useful for detecting recent use and differentiating withdrawal from other psychiatric disorders. However, substance use disorder is a clinical diagnosis based on DSM-5 criteria, not on laboratory findings alone."
    difficulty: easy
    tags: [substance use disorder, toxicology, urine drug screen, diagnosis]
  - front: "What are the symptoms of intoxication vs. withdrawal from CNS depressants (alcohol, opioids, barbiturates, benzodiazepines)?"
    back: "Intoxication: euphoria, slurred speech, disinhibition, confusion, poor coordination, coma. Withdrawal: anxiety, anhedonia, tremor, seizures, insomnia, psychosis, delirium, death (in severe cases).\n\nCNS depressant withdrawal is medically dangerous and can be fatal — unlike stimulant or hallucinogen withdrawal. This high-stakes distinction is commonly tested. Benzodiazepines are the mainstay of withdrawal management."
    difficulty: easy
    tags: [CNS depressants, alcohol withdrawal, intoxication, withdrawal]
  - front: "What are the symptoms of stimulant intoxication and withdrawal (amphetamines, cocaine, MDMA)?"
    back: "Intoxication: euphoria, mania, psychomotor agitation, anxiety, psychosis (especially paranoia), insomnia, cardiovascular complications (stroke, MI, arrhythmias), seizure. Withdrawal: 'crash,' craving, dysphoria, suicidality.\n\nStimulant withdrawal is not life-threatening but carries significant risk of suicide during the 'crash.' There are no approved pharmacologic agents for cocaine or stimulant use disorder — psychological interventions are the mainstay."
    difficulty: easy
    tags: [stimulants, cocaine, amphetamines, intoxication, withdrawal]
  - front: "Which substances typically have NO significant withdrawal syndrome?"
    back: "Hallucinogens (LSD, mescaline, psilocybin, PCP, ketamine, ibogaine, salvia) typically do not produce a clinically significant withdrawal syndrome.\n\nPhysical dependence and withdrawal are not thought to occur with hallucinogens, although psychological dependence and harmful use patterns can develop. Tolerance to hallucinogens develops rapidly (within hours to days)."
    difficulty: medium
    tags: [hallucinogens, withdrawal, substance use]
  - front: "What are the post-ingestion urine detection windows for common substances of abuse?"
    back: "Amphetamine: 48 h; Barbiturates: 1–21 d; Short-acting benzodiazepine: 72 h; Long-acting benzodiazepine: 30 d; Cocaine: 12–72 h; Morphine: 48–72 h; Methadone: 72 h; Oxycodone: 2–4 d; PCP: 8 d; Cannabis: 3 d (single use) to >30 d (heavy users).\n\nDetection windows reflect the pharmacokinetics of the substance and its metabolites. Cannabis has the longest and most variable window due to its lipid solubility and accumulation in fat tissue with heavy use. Long-acting benzodiazepines (e.g., diazepam) can be detected for up to 30 days."
    difficulty: medium
    tags: [urine drug screen, detection window, toxicology]
  - front: "Why are beta-blockers contraindicated in cocaine overdose management?"
    back: "Beta-blockers (including labetalol) are not recommended in cocaine overdose because they cause unopposed alpha-adrenergic stimulation, which can lead to coronary artery vasoconstriction and worsened hypertension.\n\nCocaine blocks presynaptic reuptake of norepinephrine and epinephrine causing vasospasm and hypertension. Using a beta-blocker leaves alpha-adrenergic receptors unopposed, worsening vasoconstriction and potentially precipitating MI or stroke. Benzodiazepines are the preferred treatment for cocaine-induced seizures and agitation."
    difficulty: hard
    tags: [cocaine, beta-blockers, contraindication, overdose, management]
  - front: "What is the mechanism of cocaine's action and what ECG finding can appear in overdose?"
    back: "Cocaine: (1) blocks presynaptic reuptake of serotonin (euphoria), dopamine (addiction), norepinephrine and epinephrine (vasospasm, HTN); (2) sodium channel blockade (slows nerve conduction, local anesthetic effect). In overdose, cardiac Na+ channel blockade can produce QRS complex prolongation on ECG.\n\nCocaine's sodium channel blockade is similar to class I antiarrhythmic drugs. QRS widening in cocaine overdose is a marker of severe toxicity. Cocaine has a short biological half-life of ~1 hour, prompting binge use patterns to maintain effect."
    difficulty: hard
    tags: [cocaine, mechanism, ECG, QRS prolongation, sodium channel]
  - front: "What are the cardiovascular complications of cocaine use?"
    back: "Arrhythmias, MI, cerebrovascular accident (stroke), ruptured abdominal aortic aneurysm (AAA), intracranial hemorrhage, and chest pain (40% of all cocaine-related ED visits).\n\nCocaine's vasoconstrictive and sympathomimetic effects make it a major cardiovascular toxin. Even young patients without traditional cardiovascular risk factors can present with MI. QRS prolongation due to sodium channel blockade contributes to arrhythmias."
    difficulty: medium
    tags: [cocaine, cardiovascular, MI, stroke, complications]
  - front: "What are the features of amphetamine intoxication and chronic use psychosis?"
    back: "Intoxication: euphoria, improved concentration, sympathetic and behavioural hyperactivity; at high doses, can mimic psychosis or mania; can cause coma. Chronic use: psychosis resembling schizophrenia with agitation, paranoia, delusions, and hallucinations. Withdrawal: dysphoria, fatigue, restlessness.\n\nAmphetamine-induced psychosis is treated acutely with antipsychotics; benzodiazepines for agitation; beta-blockers for tachycardia and HTN. Crystal methamphetamine is associated with formication (tactile hallucination of insects crawling under skin) and can cause stroke with long-term use."
    difficulty: medium
    tags: [amphetamines, crystal meth, intoxication, psychosis, withdrawal]
  - front: "What are the clinical manifestations and evidence-based medical uses of cannabis?"
    back: "Intoxication: tachycardia, conjunctival vascular engorgement, dry mouth, altered sensorium, increased appetite, muscle relaxation; euphoria, impaired cognitive and psychomotor performance, impaired short-term memory. High doses: depersonalization, paranoia, anxiety, psychosis. Chronic use: tolerance, amotivational syndrome, respiratory problems. Evidence-based uses: chemotherapy-induced nausea/vomiting, spasticity (MS, spinal cord injury), chronic neuropathic pain.\n\nInhaled cannabis has onset within minutes, peaking at 15–30 min. Ingested cannabis has delayed onset (30–90 min), peaking 2–3 h and lasting 4–12 h. Cannabis use is associated with increased risk of psychotic disorders in a dose-dependent manner, particularly in genetically predisposed individuals."
    difficulty: medium
    tags: [cannabis, THC, intoxication, medical uses, psychosis]
  - front: "What is Cannabinoid Hyperemesis Syndrome (CHS) and how do patients typically self-medicate?"
    back: "CHS is a syndrome associated with chronic heavy cannabis use characterized by cyclical, recurrent severe nausea, vomiting, and abdominal pain with no specific GI pathology identified. Patients typically self-medicate with hot baths or showers, which provides temporary relief.\n\nCHS is increasingly recognized as cannabis potency increases. The mechanism of hot bath relief is not fully understood but may relate to transient receptor potential vanilloid (TRPV1) channels. Cessation of cannabis is the definitive treatment."
    difficulty: medium
    tags: [cannabis, cannabinoid hyperemesis syndrome, CHS, nausea, vomiting]
  - front: "What is Hallucinogen Persisting Perception Disorder (HPPD)?"
    back: "HPPD is a DSM-5 diagnosis characterized by long-lasting, spontaneous, intermittent, distressing recurrences of visual perceptual changes reminiscent of those experienced during prior hallucinogen exposure ('flashbacks'). These can occur months to years after the last use.\n\nHPPD is distinct from acute hallucinogen intoxication. It causes significant distress and functional impairment. It is associated predominantly with 5-HT2A agonist hallucinogens (LSD, psilocybin, mescaline). Management is generally supportive, with benzodiazepines for distress."
    difficulty: medium
    tags: [hallucinogens, HPPD, flashbacks, LSD, DSM-5]
  - front: "What are the 3 main types of hallucinogens classified by primary mechanism of action with examples?"
    back: "1. 5-HT2A agonists (most common): LSD, mescaline (peyote), psilocybin, DMT (ayahuasca). 2. NMDA antagonists: PCP (phencyclidine), ketamine. 3. κ-opioid agonists: salvia divinorum, ibogaine.\n\n5-HT2A agonist intoxication causes tachycardia, HTN, mydriasis, tremor, hyperpyrexia, and perceptual/mood changes. NMDA antagonists (PCP, ketamine) produce dissociative states with amnesia, analgesia, and hallucinations. PCP overdose features horizontal/vertical nystagmus, myoclonus, and prolonged agitated psychosis treated with haloperidol."
    difficulty: medium
    tags: [hallucinogens, LSD, PCP, ketamine, 5-HT2A, NMDA]
  - front: "What are the characteristic adverse effects and management of MDMA ('Ecstasy') toxicity?"
    back: "MDMA acts on serotonergic and dopaminergic pathways, with properties of both a hallucinogen and stimulant. Adverse effects: diaphoresis, tachycardia, fatigue, jaw clenching (muscle spasms), ataxia, hyperthermia, arrhythmias, DIC, rhabdomyolysis, renal failure, seizures, death.\n\nHyperthermia is one of the most dangerous complications of MDMA use and a common cause of MDMA-related deaths. MDMA causes serotonin syndrome in severe cases. Management is supportive: cooling, hydration, control of hyperthermia and agitation, monitoring for multi-organ failure."
    difficulty: medium
    tags: [MDMA, ecstasy, club drugs, hyperthermia, serotonin syndrome]
  - front: "What is GHB (gamma-hydroxybutyrate) and what makes it particularly dangerous?"
    back: "GHB has a biphasic dopamine response (inhibition then release) and releases opiate-like substances. Effects: euphoria, increased aggression, impaired judgment. Severe withdrawal from abrupt cessation of high doses causes tremor, seizures, and psychosis. Used as a date rape drug (tasteless, odourless).\n\nGHB withdrawal can be life-threatening, similar to alcohol and benzodiazepine withdrawal. GHB is also known as 'liquid ecstasy' or '6.' Along with flunitrazepam (Rohypnol) and ketamine, GHB is a major date rape drug due to its ability to cause rapid sedation, amnesia, and reduced inhibition."
    difficulty: medium
    tags: [GHB, date rape drug, withdrawal, club drugs]
  - front: "What are the clinical features of PCP (phencyclidine) intoxication and overdose management?"
    back: "Intoxication: amnestic, euphoric, hallucinatory state. Adverse effects: horizontal and/or vertical nystagmus (classic), myoclonus, ataxia, autonomic instability, prolonged agitated psychosis, high risk for suicide and violence toward others. High doses can cause coma. Management: diazepam IV for autonomic instability; haloperidol for prolonged agitated psychosis.\n\nPCP nystagmus is classically both horizontal AND vertical — an important distinguishing feature from most other substances causing only horizontal nystagmus. PCP was originally developed as a veterinary anesthetic. Ketamine has a similar but less severe profile."
    difficulty: medium
    tags: [PCP, phencyclidine, nystagmus, management, haloperidol]
  - front: "What are the risk factors for developing a substance use disorder?"
    back: "Genetic/neurobiological factors; psychological factors; environmental factors: low socioeconomic status, peer influence, adverse childhood or traumatic experiences, social isolation, systemic racism, chronic stress. Comorbid conditions: mental illness, chronic disease, acute/chronic pain. Environmental exposure (e.g., over-prescription of opioids in North America fuelled the opioid use disorder crisis).\n\nSubstance use disorders are multifactorial. The biopsychosocial model integrates genetic vulnerability (neurobiological reward pathways), individual psychology, and environmental exposures. Understanding this helps clinicians take a non-judgmental, trauma-informed approach to assessment and treatment."
    difficulty: easy
    tags: [substance use disorder, risk factors, etiology, biopsychosocial]
  - front: "What are the principles of harm reduction in substance use disorders?"
    back: "Harm reduction principles: safe sex practices; avoid driving while intoxicated; avoid substances with child care responsibilities; safe needle practices and needle exchange programs; pill-testing kits; reducing (not necessarily eliminating) tobacco use; naloxone kit distribution for those at risk of opioid overdose.\n\nHarm reduction is an evidence-based public health approach that accepts substance use as a reality and focuses on minimizing harms without requiring abstinence. In Canada, programs like RAAM (Rapid Access to Addiction Medicine) clinics in Ontario offer low-barrier specialized services by self-referral."
    difficulty: easy
    tags: [harm reduction, needle exchange, naloxone, substance use, public health]
  - front: "What is formication and with which substances is it classically associated?"
    back: "Formication is a tactile hallucination characterized by the sensation of insects or snakes crawling over or under the skin. It is especially associated with crystal methamphetamine use, but can also occur with cocaine and PCP.\n\nFormication (from Latin 'formica' = ant) is a type of tactile hallucination seen in stimulant intoxication and withdrawal. In cocaine use, it is sometimes called 'cocaine bugs' or 'Magnan's sign.' It can lead to excoriation and skin picking injuries."
    difficulty: medium
    tags: [formication, crystal meth, cocaine, tactile hallucination, stimulants]
