# Gastroenterology Barretts (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is Barrett's esophagus (BE) and how is it diagnosed?"
    back: "BE is the replacement of normal squamous esophageal epithelium with intestinal columnar epithelium (intestinal metaplasia). It is thought to be acquired through long-standing GERD. Diagnosis requires endoscopy showing salmon-pink mucosa in the distal esophagus confirmed by biopsy demonstrating specialized intestinal epithelium of any length within the esophagus.\n\nBE is a premalignant condition — it predisposes to low-grade dysplasia → high-grade dysplasia → adenocarcinoma. Biopsy is mandatory because the endoscopic appearance alone is insufficient for diagnosis."
    difficulty: easy
    tags: [Barretts esophagus, intestinal metaplasia, GERD, adenocarcinoma, gastroenterology]
  - front: "What is the rate of malignant transformation in Barrett's esophagus without dysplasia, and what is the risk in high-grade dysplasia?"
    back: "Rate of malignant transformation for all BE patients prior to dysplasia: approximately 0.12% per year. For high-grade dysplasia: 32–59% transformation rate over 5–8 years of surveillance.\n\nThe annual transformation risk in non-dysplastic BE is very low (~0.12%/yr), which is why the Canadian Task Force does not recommend routine screening endoscopy for GERD without alarm features. However, once high-grade dysplasia is identified, the cancer risk is dramatically higher, justifying aggressive intervention."
    difficulty: medium
    tags: [Barretts esophagus, malignant transformation, dysplasia, adenocarcinoma, gastroenterology]
  - front: "What is the Canadian Task Force position on screening endoscopy for Barrett's esophagus in patients with chronic GERD?"
    back: "The Canadian Task Force on Preventive Health Care currently does NOT recommend routine screening endoscopy for Barrett's esophagus and precursor conditions in patients with chronic GERD without red flag features (e.g. dysphagia, odynophagia, weight loss, anemia, GI bleeding). Patients with known BE should be referred to a gastroenterologist for endoscopic surveillance.\n\nDespite BE increasing the risk of esophageal adenocarcinoma, most cases were not identified during screening. Additionally, patients undergoing screening may be unnecessarily exposed to harm. Risk factors (age, male sex, family history) alone are not sufficient to warrant screening in chronic GERD patients per Canadian guidelines."
    difficulty: medium
    tags: [Barretts esophagus, Canadian guidelines, screening, CTFPHC, gastroenterology]
  - front: "What is the surveillance and treatment protocol for Barrett's esophagus based on dysplasia grade?"
    back: "No dysplasia: surveillance gastroscopy every 3–5 years. Low-grade dysplasia: surveillance every 6 months for 1 year, then annually; endoscopic ablation/resection is also a satisfactory option. High-grade dysplasia: intensive biopsy + endoscopic ablation/mucosal resection or radiofrequency ablation (RFA); esophagectomy is an option. Acid suppressive therapy with high-dose PPI indefinitely (or surgical fundoplication) to reduce transformation.\n\nEvidence increasingly favours endoscopic ablation with mucosal resection or RFA over esophagectomy for high-grade dysplasia. All patients with BE require indefinite acid suppression to slow progression."
    difficulty: medium
    tags: [Barretts esophagus, dysplasia, surveillance, RFA, endoscopic ablation, gastroenterology]
