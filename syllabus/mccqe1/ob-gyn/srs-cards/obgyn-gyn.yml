# Gynaecologic Conditions & Cancer (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What are the SOGC guidelines for cervical cancer screening (Pap test) in Canada?"
    back: "Start at age 21 or 3 years after first sexual intercourse; Pap test every 3 years for ages 21-69; HPV primary testing every 5 years is being phased in — stop screening at age 69 (or after total hysterectomy for non-cancer indication)\n\nSOGC/Canadian Cancer Society Cervical Cancer Screening Guidelines 2013: Pap testing every 3 years with normal results. HPV co-testing or primary HPV testing is being adopted in Canadian provinces for higher sensitivity. Women vaccinated against HPV should still have regular cervical screening."
    difficulty: easy
    tags: [Pap test, cervical cancer screening, HPV testing, SOGC, obgyn]
  - front: "A 45-year-old woman has heavy menstrual bleeding for 6 months. She is nulliparous, obese, and has irregular cycles. What is the priority investigation?"
    back: "Endometrial biopsy (pipelle) to exclude endometrial hyperplasia or carcinoma; also pelvic ultrasound and CBC\n\nSOGC AUB (Abnormal Uterine Bleeding) guidelines: endometrial biopsy indicated for AUB in women ≥40, or in younger women with risk factors for endometrial cancer (obesity, PCOS, chronic anovulation, tamoxifen use, Lynch syndrome). Hysteroscopy with directed biopsy is gold standard."
    difficulty: hard
    tags: [abnormal uterine bleeding, endometrial biopsy, endometrial cancer, SOGC, obgyn]
  - front: "What is the PALM-COEIN classification of abnormal uterine bleeding?"
    back: "Structural (PALM): Polyp, Adenomyosis, Leiomyoma (fibroids), Malignancy/hyperplasia; Non-structural (COEIN): Coagulopathy, Ovulatory dysfunction, Endometrial, Iatrogenic, Not classified\n\nFIGO PALM-COEIN classification guides investigation and management of AUB. Most common structural cause: fibroids (leiomyomas). Ovulatory dysfunction (anovulation): the most common non-structural cause. Treatment based on underlying etiology."
    difficulty: easy
    tags: [PALM-COEIN, AUB, abnormal uterine bleeding, uterine fibroids, obgyn]
  - front: "What is the treatment for uterine fibroids causing heavy menstrual bleeding?"
    back: "Medical: tranexamic acid, NSAIDs, combined OCP, progestin IUD (levonorgestrel IUD); Procedural: uterine artery embolization (UAE), focused ultrasound; Surgical: myomectomy (fertility-preserving) or hysterectomy\n\nUterine fibroids (leiomyomas) are the most common benign pelvic tumors in women. Management depends on symptoms, fertility desires, and fibroid size/location. SOGC guidelines: LNG-IUS (Mirena) is highly effective for AUB from fibroids and adenomyosis."
    difficulty: medium
    tags: [uterine fibroids, heavy menstrual bleeding, treatment, levonorgestrel IUD, SOGC, obgyn]
  - front: "A 25-year-old woman has severe dysmenorrhea, deep dyspareunia, and pelvic pain. Ultrasound shows endometriomas bilaterally. Diagnosis and management?"
    back: "Endometriosis; treat with combined OCP (first-line), progestins, GnRH agonists (leuprolide); surgery for severe cases or endometriomas; infertility treatment if planning pregnancy\n\nSOGC endometriosis guidelines: medical treatment suppresses endometriosis but does not cure it; symptoms return when treatment is discontinued. Definitive diagnosis requires laparoscopy with biopsy. Endometriomas >4 cm: surgical drainage and ablation before IVF improves outcomes."
    difficulty: hard
    tags: [endometriosis, dysmenorrhea, laparoscopy, GnRH agonist, SOGC, obgyn]
  - front: "What is polycystic ovary syndrome (PCOS) and how is it diagnosed per Rotterdam criteria?"
    back: "PCOS diagnosis requires 2 of 3: oligo/anovulation, clinical or biochemical hyperandrogenism, polycystic ovaries on ultrasound (≥12 follicles 2-9mm per ovary OR ovarian volume ≥10 mL) — exclusion of other causes\n\nPCOS is the most common endocrinopathy in women of reproductive age (5-10%). Associated with insulin resistance, metabolic syndrome, T2DM, and endometrial cancer risk. Management: lifestyle modification, metformin, combined OCP for menstrual regulation and hyperandrogenism."
    difficulty: medium
    tags: [PCOS, Rotterdam criteria, polycystic ovary, hyperandrogenism, obgyn]
  - front: "A 65-year-old postmenopausal woman has a pelvic mass, elevated CA-125, and ascites. What is the diagnosis until proven otherwise and the management?"
    back: "Ovarian cancer until proven otherwise; management: surgical staging and debulking (cytoreduction) by gynecologic oncologist, followed by platinum-based chemotherapy (carboplatin + paclitaxel)\n\nOvarian cancer has 5-year survival of 30-40% because most are diagnosed at advanced stage. Risk factors: BRCA1/2, nulliparity, endometriosis, HRT. No effective screening test. OCP use reduces lifetime ovarian cancer risk by 30-50%."
    difficulty: hard
    tags: [ovarian cancer, CA-125, debulking surgery, BRCA, obgyn]
  - front: "What is the management of cervical cancer based on stage?"
    back: "Stage IA1: cone biopsy or simple hysterectomy; Stage IA2-IIA: radical hysterectomy + pelvic LN dissection (or chemoradiation); Stage IIB-IVA: concurrent chemoradiation (cisplatin + radiotherapy)\n\nCervical cancer is HPV-related in >99% of cases. The most common histology is squamous cell carcinoma (75%), adenocarcinoma (20%). Sentinel lymph node biopsy increasingly used for early-stage cervical cancer. Bevacizumab added to chemotherapy for recurrent/metastatic disease."
    difficulty: hard
    tags: [cervical cancer, staging, chemoradiation, HPV, obgyn]
  - front: "What is the management of postmenopausal uterine bleeding?"
    back: "Any postmenopausal bleeding requires immediate investigation with transvaginal ultrasound (endometrial thickness) and endometrial biopsy to exclude endometrial cancer — endometrial stripe >4mm warrants biopsy\n\nSOGC and ACOG guidelines: endometrial cancer is the most common gynecological malignancy in Canada. Presenting symptom in 90%: postmenopausal bleeding. Endometrial biopsy (pipelle) should be performed regardless of ultrasound findings if clinical suspicion exists."
    difficulty: hard
    tags: [postmenopausal bleeding, endometrial cancer, endometrial biopsy, transvaginal ultrasound, obgyn]
  - front: "What is menopause and when does it occur?"
    back: "Menopause: permanent cessation of menstruation, diagnosed retrospectively after 12 consecutive months of amenorrhea in a woman ≥45 years without other cause; average age in Canada: 51 years\n\nSOGC menopause guidelines: FSH >30 IU/L and low estradiol support diagnosis. Perimenopause: irregular cycles, vasomotor symptoms (hot flashes), sleep disturbance, mood changes. Premature ovarian insufficiency (POI): menopause before age 40."
    difficulty: easy
    tags: [menopause, FSH, perimenopause, vasomotor symptoms, obgyn]
  - front: "What are the indications and contraindications for hormone replacement therapy (HRT/MHT)?"
    back: "Indications: vasomotor symptoms (hot flashes), genitourinary syndrome of menopause (GSM), osteoporosis prevention, POI (premature ovarian insufficiency); Contraindications: breast cancer, endometrial cancer, unexplained vaginal bleeding, active liver disease, VTE or stroke history\n\nSOGC Menopause Guidelines: MHT has the best benefit-risk profile for healthy women <60 or within 10 years of menopause (timing hypothesis). Combined estrogen + progestogen for women with intact uterus (prevents endometrial hyperplasia). Estrogen alone for post-hysterectomy."
    difficulty: medium
    tags: [HRT, MHT, menopause treatment, hot flashes, SOGC, obgyn]
  - front: "What is pelvic organ prolapse (POP) and how is it managed?"
    back: "POP: descent of pelvic organs through pelvic floor (cystocele, rectocele, uterine prolapse); classified by POP-Q system; management: pelvic floor physiotherapy, pessary, or surgical repair\n\nSOGC Urogynaecology guidelines: risk factors for POP: vaginal delivery, obesity, constipation, heavy lifting, advancing age, family history. Pelvic floor physiotherapy is first-line for mild-moderate prolapse. Pessaries provide non-surgical support. Surgical repair for severe or symptomatic POP."
    difficulty: medium
    tags: [pelvic organ prolapse, cystocele, pessary, pelvic floor, obgyn]
  - front: "What is the BRCA1/2 risk-reducing surgical strategy?"
    back: "Risk-reducing salpingo-oophorectomy (RRSO) at 35-40 years (BRCA1) or 40-45 years (BRCA2) after childbearing — reduces ovarian cancer risk by 80-95%, breast cancer risk by 50%\n\nSOGC hereditary gynecologic cancer guidelines: BRCA1/2 carriers should be referred to hereditary cancer programs. RRSO also induces surgical menopause — MHT until age 50 does not negate breast cancer risk reduction. Risk-reducing mastectomy (bilateral) reduces breast cancer risk by >90%."
    difficulty: hard
    tags: [BRCA, RRSO, risk-reducing surgery, hereditary cancer, obgyn]
  - front: "What are the symptoms and treatment of vulvovaginal candidiasis?"
    back: "Vulval pruritus, burning, thick white cottage cheese discharge, dyspareunia; treat uncomplicated VVC with topical azole (clotrimazole, miconazole) or fluconazole 150 mg PO single dose\n\nMost VVC is caused by Candida albicans. Recurrent VVC (≥4 episodes/year): investigate for underlying cause (diabetes, immunosuppression), treat with fluconazole weekly x6 months as maintenance. Azole-resistant Candida glabrata: intravaginal boric acid."
    difficulty: easy
    tags: [vulvovaginal candidiasis, VVC, fluconazole, candida, obgyn]
  - front: "What is the clinical presentation and treatment of ovarian torsion?"
    back: "Ovarian torsion: sudden onset severe unilateral pelvic pain, nausea/vomiting, pelvic mass; Doppler ultrasound may show absent/reduced blood flow; emergency laparoscopy for detorsion — if viable, do not remove ovary\n\nSOGC guidelines: ovarian torsion is a surgical emergency. Doppler absence does not confirm torsion (can have torsion with flow). Detorsion is preferred to oophorectomy — even if ovary appears necrotic, blood flow may return. Cystectomy at same time if ovarian cyst present."
    difficulty: hard
    tags: [ovarian torsion, acute pelvic pain, laparoscopy, detorsion, obgyn]
  - front: "What is cervical cancer screening in Canada?"
    back: "Age 25-69: Pap smear q3 years (or HPV primary screening q5 years where available). No screening <25 or >69 if adequate prior screening\n\nCTFPHC 2013 recommends cytology. Several provinces transitioning to HPV primary screening. Colposcopy for HSIL or persistent LSIL. HPV vaccination reduces but does not eliminate need for screening."
    difficulty: medium
    tags: [cervical cancer, screening]
  - front: "What is the Canadian cervical cancer screening guideline?"
    back: "Age 25-69: cytology (Pap) every 3 years OR HPV primary screening every 5 years (where available). Start at age 25 (not at onset of sexual activity). Stop at 70 if adequate recent negative screening. Post-hysterectomy (with cervix removal for benign indication): stop screening. Immunocompromised: annual screening.\n\nCTFPHC 2013 guidelines recommended starting screening at 25, which differs from some US guidelines that start at 21. The shift to HPV primary screening reflects evidence that HPV testing is more sensitive than cytology. Several Canadian provinces are transitioning to HPV-based screening programs."
    difficulty: medium
    tags: [cervical cancer screening, Pap test, HPV screening, gynecology]
  - front: "What is the management algorithm for abnormal cervical cytology?"
    back: "ASCUS: HPV co-testing (if HPV negative, return to routine; if HPV positive, colposcopy) OR repeat cytology in 12 months. LSIL: colposcopy. HSIL: colposcopy + ECC. AGC: colposcopy + ECC + endometrial biopsy (if >=35 or abnormal bleeding). CIN1: observation (70% regress). CIN2: treat if persistent >2 years or excision. CIN3: excision (LEEP or cold knife cone).\n\nSOGC colposcopy guidelines outline management algorithms. LEEP (loop electrosurgical excision procedure) is the most common treatment for CIN2/3 in Canada. CIN2 in women <25 may be observed due to high regression rates. HPV vaccination does not change screening recommendations."
    difficulty: hard
    tags: [abnormal Pap, CIN, colposcopy, LEEP, gynecology]
  - front: "What is the approach to abnormal uterine bleeding (AUB)?"
    back: "PALM-COEIN classification: Structural (PALM): Polyp, Adenomyosis, Leiomyoma, Malignancy/hyperplasia. Non-structural (COEIN): Coagulopathy, Ovulatory dysfunction, Endometrial, Iatrogenic, Not yet classified. Workup: pregnancy test, CBC, TSH, pelvic US, endometrial biopsy (age >=40 or risk factors for hyperplasia). Management by cause: OCPs/IUS for ovulatory dysfunction, resection for polyps/fibroids, progestins for hyperplasia.\n\nSOGC guidelines use the FIGO PALM-COEIN classification system. Endometrial biopsy is recommended for AUB in women >=40 years or <40 with risk factors (obesity, anovulation, tamoxifen). Levonorgestrel IUS (Mirena) is first-line medical treatment for HMB."
    difficulty: hard
    tags: [AUB, abnormal uterine bleeding, PALM-COEIN, gynecology]
  - front: "What are the types of uterine fibroids and their management options?"
    back: "Types (FIGO): submucosal (Type 0-2, cause heavy bleeding), intramural (Type 3-5), subserosal (Type 6-7, cause bulk symptoms). Medical: tranexamic acid, OCPs, LNG-IUS, GnRH agonists (preoperative shrinkage), ulipristal acetate. Surgical: myomectomy (fertility-preserving), hysterectomy (definitive), uterine artery embolization (UAE), MRI-guided focused US.\n\nSOGC guidelines recommend medical management first-line for symptomatic fibroids. GnRH agonists cause temporary menopause (max 6 months due to bone loss). UAE is effective but not recommended for women desiring future fertility. Hysterectomy is the only definitive treatment."
    difficulty: hard
    tags: [fibroids, leiomyoma, myomectomy, hysterectomy, gynecology]
  - front: "What is the workup and management of an adnexal mass?"
    back: "Premenopausal: most are functional cysts (<6cm, simple-observe, repeat US in 6-8 weeks). Concern for malignancy: complex/solid, >6cm, ascites, elevated CA-125, postmenopausal. Postmenopausal: any adnexal mass warrants investigation. Tumor markers: CA-125 (epithelial ovarian), AFP/hCG/LDH (germ cell), inhibin (granulosa cell). Imaging: pelvic US first, CT/MRI for characterization.\n\nSOGC guidelines and IOTA (International Ovarian Tumor Analysis) simple rules guide management. CA-125 is not specific (elevated in endometriosis, PID, pregnancy, peritoneal irritation). Postmenopausal women with complex mass and elevated CA-125 should be referred to gynecologic oncology. Risk of Malignancy Index (RMI) combines US, menopausal status, and CA-125."
    difficulty: hard
    tags: [adnexal mass, ovarian cyst, CA-125, gynecology]
  - front: "What are the causes and workup of secondary amenorrhea?"
    back: "Definition: absence of menses for >=3 cycles or >=6 months. Most common cause: pregnancy (always test first). Other causes: hypothalamic (stress, weight loss, exercise), PCOS, thyroid dysfunction, hyperprolactinemia, premature ovarian insufficiency, Asherman syndrome, medication (OCPs, depot medroxyprogesterone). Workup: pregnancy test, TSH, prolactin, FSH, estradiol. Progestin challenge test.\n\nSOGC guidelines recommend systematic evaluation. Elevated FSH (>40) suggests premature ovarian insufficiency (karyotype if <40 for Turner mosaicism). Elevated prolactin requires MRI sella for prolactinoma. Hypothalamic amenorrhea (low FSH, low estradiol) warrants bone density assessment due to estrogen deficiency."
    difficulty: hard
    tags: [amenorrhea, PCOS, workup, gynecology]
  - front: "What are the diagnostic criteria for polycystic ovary syndrome (PCOS)?"
    back: "Rotterdam criteria (>=2 of 3): (1) oligo/anovulation, (2) clinical or biochemical hyperandrogenism, (3) polycystic ovaries on US (>=12 follicles 2-9mm in one ovary or ovarian volume >10mL). Exclude: thyroid disease, CAH (17-OHP), hyperprolactinemia, Cushing syndrome.\n\nSOGC guidelines use Rotterdam criteria. PCOS affects 6-10% of reproductive-age women and is the most common cause of anovulatory infertility. Management: weight loss if overweight, OCPs for cycle regulation and hyperandrogenism, metformin for metabolic features, letrozole for ovulation induction (first-line over clomiphene)."
    difficulty: medium
    tags: [PCOS, Rotterdam criteria, hyperandrogenism, gynecology]
  - front: "What is the approach to endometriosis diagnosis and management?"
    back: "Clinical diagnosis: cyclic pelvic pain, dysmenorrhea, dyspareunia, dyschezia, infertility. Gold standard diagnosis: laparoscopy with histological confirmation. US may show endometriomas (chocolate cysts). Medical: NSAIDs, combined OCPs (continuous), progestins, GnRH agonists (with add-back therapy), dienogest. Surgical: laparoscopic excision/ablation of implants, adhesiolysis.\n\nSOGC guidelines recommend empiric medical treatment before laparoscopy in suspected endometriosis. Dienogest is a newer progestin specifically approved for endometriosis in Canada. Deep infiltrating endometriosis requires expert surgical management. Endometriosis affects 6-10% of reproductive-age women."
    difficulty: hard
    tags: [endometriosis, dysmenorrhea, laparoscopy, gynecology]
  - front: "What is the assessment and management of pelvic organ prolapse?"
    back: "POP-Q staging: Stage 0-IV based on descent relative to hymen. Presentation: vaginal bulge, pressure, urinary symptoms (incomplete emptying, stress incontinence), bowel symptoms. Types: cystocele (anterior), rectocele (posterior), uterine prolapse, vault prolapse. Conservative: pelvic floor physiotherapy, pessary. Surgical: anterior/posterior colporrhaphy, sacrocolpopexy, hysterectomy + vault suspension.\n\nSOGC guidelines recommend pessary as first-line for symptomatic prolapse. Pelvic floor physiotherapy (Kegel exercises) can improve Stage I-II prolapse. Surgical mesh for transvaginal prolapse repair carries significant complication risk. In Canada, vaginal mesh for prolapse has been largely restricted."
    difficulty: medium
    tags: [pelvic organ prolapse, pessary, POP-Q, gynecology]
  - front: "What is the approach to a postmenopausal woman with vaginal bleeding?"
    back: "ALWAYS investigate-endometrial cancer until proven otherwise. Workup: pelvic exam, transvaginal ultrasound (endometrial thickness <4-5mm has high NPV), endometrial biopsy (Pipelle). If biopsy insufficient: hysteroscopy with D&C. Causes: atrophic vaginitis (most common), endometrial polyp, endometrial hyperplasia/cancer, cervical pathology, HRT.\n\nSOGC guidelines recommend endometrial biopsy for all postmenopausal bleeding. Endometrial thickness >4mm on TVUS requires tissue sampling. Endometrial cancer is the most common gynecologic malignancy in Canada. Risk factors: obesity, unopposed estrogen, nulliparity, late menopause, tamoxifen, PCOS."
    difficulty: hard
    tags: [postmenopausal bleeding, endometrial cancer, endometrial biopsy, gynecology]
  - front: "What are the SOGC guidelines for menopause management and hormone replacement therapy?"
    back: "Vasomotor symptoms: HRT is most effective treatment. Oral or transdermal estrogen + progestogen (if uterus present). Transdermal preferred (lower VTE risk). Lowest effective dose for shortest duration needed. Contraindications: breast cancer, active VTE, active liver disease, unexplained vaginal bleeding, coronary heart disease. Alternatives: venlafaxine, paroxetine, gabapentin for vasomotor symptoms.\n\nSOGC Menopause guidelines state HRT initiated <60 years or within 10 years of menopause (window of opportunity) is safe for most women and may reduce cardiovascular risk. WHI data reinterpreted: risks primarily in older women (>60). Vaginal estrogen for genitourinary syndrome of menopause is safe even in breast cancer survivors."
    difficulty: hard
    tags: [menopause, HRT, hormone therapy, SOGC, gynecology]
  - front: "What is the approach to female infertility?"
    back: "Definition: failure to conceive after 12 months of regular unprotected intercourse (6 months if >=35 years). Workup: ovulatory assessment (day 3 FSH/estradiol, day 21 progesterone, AMH), tubal patency (HSG or laparoscopy), semen analysis (male factor 40%). Treatment by cause: anovulation-letrozole (first-line), tubal-IVF, unexplained-IUI with ovulation induction then IVF.\n\nSOGC infertility guidelines recommend simultaneous evaluation of both partners. Letrozole replaced clomiphene as first-line ovulation induction (NEJM trial 2014). AMH (anti-Mullerian hormone) predicts ovarian reserve. IVF is publicly funded in some Canadian provinces (Ontario, Quebec) with specific criteria."
    difficulty: hard
    tags: [infertility, ovulation induction, IVF, gynecology]
  - front: "What are the types of ovarian cancer and their staging?"
    back: "Epithelial (90%): serous (most common, high-grade associated with BRCA), mucinous, endometrioid, clear cell. Germ cell (5%): dysgerminoma, teratoma, yolk sac tumor. Sex cord-stromal (5%): granulosa cell, Sertoli-Leydig. Staging: I-confined to ovary, II-pelvic extension, III-peritoneal spread/nodes, IV-distant metastases. Treatment: cytoreductive surgery + platinum-based chemotherapy.\n\nOvarian cancer is the most lethal gynecologic cancer. No effective screening exists for average-risk women (CA-125 + TVUS screening does NOT reduce mortality). BRCA1 carriers: 40-50% lifetime ovarian cancer risk; BRCA2: 15-20%. SOGC recommends risk-reducing bilateral salpingo-oophorectomy by age 40-45 for BRCA1 carriers."
    difficulty: hard
    tags: [ovarian cancer, staging, BRCA, gynecology]
  - front: "What is the management of ectopic pregnancy vs miscarriage in early pregnancy bleeding?"
    back: "Key distinguishing features: ectopic-adnexal mass, peritoneal signs, hCG rising abnormally (<35% increase in 48h). Miscarriage types: threatened (cervix closed, ongoing pregnancy), inevitable (cervix open, membranes intact), incomplete (cervix open, partial tissue passage), complete (tissue passed, cervix closing), missed (no cardiac activity, cervix closed). Management of miscarriage: expectant, medical (misoprostol 800mcg vaginal), or surgical (suction D&C).\n\nSOGC guidelines define miscarriage management options. Discriminatory zone: hCG level (typically 1500-3000 IU/L) above which a viable IUP should be seen on TVUS. If hCG above discriminatory zone with empty uterus: ectopic until proven otherwise. Rh-negative women receive RhIg for any early pregnancy bleeding."
    difficulty: hard
    tags: [ectopic vs miscarriage, early pregnancy bleeding, hCG, obstetrics]
  - front: "What is the PALM-COEIN classification for abnormal uterine bleeding?"
    back: "Structural (PALM): Polyp, Adenomyosis, Leiomyoma, Malignancy. Non-structural (COEIN): Coagulopathy, Ovulatory dysfunction, Endometrial, Iatrogenic, Not yet classified\n\nFIGO system. Workup: pregnancy test, CBC, TSH, coagulation studies, pelvic US. Ovulatory dysfunction most common in reproductive age. Endometrial biopsy if >45 or risk factors for endometrial cancer."
    difficulty: medium
    tags: [AUB, PALM-COEIN]
  - front: "What are the SOGC-recommended criteria for diagnosing endometriosis?"
    back: "Clinical suspicion based on cyclical pelvic pain, dysmenorrhea, dyspareunia, dyschezia, and/or infertility. Definitive diagnosis historically requires laparoscopy with histological confirmation. However, SOGC now supports empirical treatment based on clinical diagnosis without mandatory laparoscopy.\n\nAverage diagnostic delay for endometriosis is 7-10 years. SOGC guidelines acknowledge that imaging (transvaginal US for endometriomas, MRI for deep infiltrating disease) can support diagnosis non-invasively. CA-125 is not recommended as a screening tool due to poor sensitivity and specificity."
    difficulty: medium
    tags: [endometriosis, diagnosis, laparoscopy, SOGC, pelvic-pain]
  - front: "What are the medical management options for endometriosis?"
    back: "First-line: combined OCP (continuous preferred) or progestins (dienogest, norethindrone, medroxyprogesterone). Second-line: GnRH agonists (with add-back HRT to limit bone loss) or GnRH antagonists (elagolix). NSAIDs for pain. Levonorgestrel IUD for pain and bleeding.\n\nSOGC recommends hormonal suppression as first-line medical therapy. GnRH agonists without add-back therapy should not exceed 6 months due to bone density loss. Dienogest 2 mg daily is specifically approved for endometriosis in Canada. Surgical excision is considered for refractory cases or infertility."
    difficulty: medium
    tags: [endometriosis, medical-management, OCP, GnRH-agonist, dienogest]
  - front: "What are the Rotterdam criteria for diagnosing PCOS?"
    back: "Need 2 of 3: 1) oligo/anovulation, 2) clinical or biochemical hyperandrogenism (hirsutism, acne, elevated free testosterone), 3) polycystic ovarian morphology on ultrasound (>=12 follicles 2-9mm or ovarian volume >10mL). Must exclude other causes (thyroid disease, CAH, Cushing, hyperprolactinemia).\n\nSOGC and Endocrine Society guidelines use Rotterdam criteria. In adolescents, all 3 criteria should be present (US morphology is unreliable peri-menarchally). Metabolic screening (OGTT, lipids, BP) is recommended at diagnosis since 50% develop metabolic syndrome."
    difficulty: medium
    tags: [PCOS, Rotterdam-criteria, hyperandrogenism, anovulation, diagnosis]
  - front: "How is PCOS managed depending on the patient's reproductive goals?"
    back: "Not seeking pregnancy: combined OCP (first-line for menstrual regulation and anti-androgen effect), spironolactone for hirsutism, metformin for metabolic features. Seeking pregnancy: letrozole (first-line ovulation induction, superior to clomiphene per NEJM trial), weight loss, metformin as adjunct.\n\nSOGC recommends letrozole over clomiphene citrate as first-line for ovulation induction based on the NICHD trial showing higher live birth rates. Lifestyle modification with 5-10% weight loss improves ovulation rates. Spironolactone requires contraception due to teratogenicity (anti-androgen)."
    difficulty: medium
    tags: [PCOS, management, letrozole, OCP, spironolactone]
  - front: "What is the PALM-COEIN classification for abnormal uterine bleeding?"
    back: "Structural (PALM): Polyp, Adenomyosis, Leiomyoma, Malignancy/hyperplasia. Non-structural (COEIN): Coagulopathy, Ovulatory dysfunction, Endometrial, Iatrogenic, Not yet classified. This FIGO system standardizes terminology and guides workup.\n\nSOGC adopted PALM-COEIN to replace imprecise terms like menorrhagia and metrorrhagia. Workup includes CBC, ferritin, TSH, pregnancy test, transvaginal US, and endometrial biopsy (if age >=45, or risk factors for hyperplasia). Coagulopathy screening is recommended in adolescents with heavy menstrual bleeding."
    difficulty: medium
    tags: [AUB, PALM-COEIN, FIGO, classification, workup]
  - front: "When should endometrial biopsy be performed in a patient with abnormal uterine bleeding?"
    back: "Age >=45 with AUB, age <45 with risk factors (obesity, PCOS, chronic anovulation, tamoxifen use, family history of endometrial/colon cancer), failed medical management, or postmenopausal bleeding (any episode warrants investigation).\n\nSOGC recommends endometrial sampling to exclude malignancy/hyperplasia. Pipelle biopsy has >95% sensitivity for endometrial cancer in postmenopausal women. Transvaginal US showing endometrial thickness <4-5mm in postmenopausal women has high negative predictive value for malignancy."
    difficulty: medium
    tags: [endometrial-biopsy, AUB, postmenopausal-bleeding, endometrial-cancer, indications]
  - front: "What is the current approach to ovarian cancer screening in average-risk and high-risk women?"
    back: "Average-risk: routine screening NOT recommended (UKCTOCS trial showed no mortality benefit). High-risk (BRCA1/2 carriers): consider transvaginal US + CA-125 every 6 months starting age 30-35, but risk-reducing bilateral salpingo-oophorectomy (RRBSO) by age 35-40 (BRCA1) or 40-45 (BRCA2) is the definitive prevention.\n\nSOGC and Canadian guidelines do not recommend population-based ovarian cancer screening. RRBSO reduces ovarian cancer risk by ~80% and is recommended after completion of childbearing. Serous tubal intraepithelial carcinoma (STIC) is now recognized as the precursor of high-grade serous ovarian cancer."
    difficulty: hard
    tags: [ovarian-cancer, screening, BRCA, RRBSO, CA-125]
  - front: "A 16-year-old presents with heavy menstrual bleeding since menarche. What coagulopathy workup is indicated?"
    back: "CBC, ferritin, PT/INR, aPTT, fibrinogen, von Willebrand panel (vWF antigen, ristocetin cofactor activity, factor VIII), platelet function testing. Von Willebrand disease is the most common inherited bleeding disorder, found in up to 20% of adolescents with heavy menstrual bleeding.\n\nSOGC recommends screening for bleeding disorders in adolescents presenting with heavy menses at menarche. VWD type 1 is most common. Testing should occur off hormonal therapy and ideally not during acute bleeding. Tranexamic acid and combined OCP are first-line treatments for menorrhagia in VWD."
    difficulty: medium
    tags: [adolescent-AUB, von-Willebrand, coagulopathy, heavy-menses, screening]
  - front: "What is the medical management of adenomyosis?"
    back: "Levonorgestrel IUD (Mirena) is first-line — reduces menstrual blood loss by 70-90%. Alternatives: combined OCP (continuous), GnRH agonists (short-term), NSAIDs for pain, tranexamic acid for bleeding. Definitive treatment is hysterectomy for women not desiring future fertility.\n\nAdenomyosis is a common cause of dysmenorrhea and heavy bleeding in parous women aged 35-50. Transvaginal US shows an enlarged globular uterus with heterogeneous myometrium. MRI is the gold standard for diagnosis. SOGC guidelines recommend LNG-IUD as first-line conservative approach."
    difficulty: medium
    tags: [adenomyosis, LNG-IUD, dysmenorrhea, heavy-bleeding, management]
  - front: "What is the significance of opportunistic salpingectomy at the time of benign gynecologic surgery?"
    back: "SOGC recommends discussing bilateral salpingectomy at time of hysterectomy or as an alternative to tubal ligation for sterilization. Evidence suggests most high-grade serous ovarian cancers originate in the fallopian tube (STIC lesions). Risk reduction estimated at 40-65% for serous ovarian cancer.\n\nThe OGCS (Ovarian Cancer Screening) paradigm has shifted from early detection to prevention. Canadian gynecologic oncology societies endorse opportunistic salpingectomy. No adverse effect on ovarian reserve or timing of menopause has been demonstrated. This is a population-health strategy unique to Canadian practice."
    difficulty: medium
    tags: [opportunistic-salpingectomy, ovarian-cancer-prevention, STIC, SOGC, sterilization]
  - front: "What cervical cancer screening is recommended for women ages 25-29?"
    back: "Pap smear or liquid cytology every 3 years (weak recommendation, moderate quality evidence)\n\nFor women 25-29, Pap smear q3yr is recommended as a weak recommendation. Earlier ages are not recommended for routine screening."
    difficulty: easy
    tags: [cervical cancer, screening, Pap smear, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What cervical cancer screening is recommended for women ages 30-69?"
    back: "Pap smear or liquid-based cytology every 3 years (strong recommendation, high quality evidence)\n\nFor women 30-69, Pap smear q3yr is a strong recommendation with high quality evidence supporting reduced cervical cancer mortality."
    difficulty: easy
