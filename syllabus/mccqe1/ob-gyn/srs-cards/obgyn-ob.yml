  - front: "What are the five components of the sexual history (5 P's)?"
    back: "Partners (numbers, gender), Practices (vaginal, oral, anal insertive/receptive), Protection, Past history of STIs, Pregnancy prevention\n\nThe 5 P's provide a structured approach to obtaining a comprehensive sexual history."
