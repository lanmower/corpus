# Resp Ild (Respirology) - generated from srs-mccqe1
cards:
  - front: "What is interstitial lung disease (ILD) and what are its typical PFT findings?"
    back: "ILD is a group of disorders causing diffuse parenchymal lung disease with progressive scarring. Pathophysiology: inflammatory and/or fibrosing process in alveolar walls → distortion and destruction of normal alveoli and microvasculature. PFTs: restrictive pattern (↓TLC, ↓VC), decreased lung compliance, normal or increased FEV1/FVC (flow rates normal/high when corrected for absolute lung volume), decreased DLCO.\n\nThe FASST/RAAIDS mnemonic captures upper and lower lobe ILD causes: Upper (FASST): Fibrosis (extrinsic HP), Ankylosing spondylitis, Sarcoidosis, Silicosis, TB. Lower (RAAIDS): Rheumatoid arthritis, Asbestosis, Amiodarone, IPF, Drugs, Scleroderma. Hypoxemia occurs due to V/Q mismatch (without hypercapnia until end stage). Pulmonary HTN and cor pulmonale develop in advanced disease."
    difficulty: medium
    tags: [respirology, ILD, interstitial-lung-disease, PFTs, restrictive]
  - front: "What are the causes of upper vs. lower lobe predominant interstitial lung disease (ILD)?"
    back: "Upper lobe predominant ILD (FASST): Fibrosis (extrinsic HP/farmer's lung), Ankylosing spondylitis, Sarcoidosis, Silicosis, TB. Lower lobe predominant ILD (RAAIDS): Rheumatoid arthritis, Asbestosis, Amiodarone, IPF, Drugs, Scleroderma.\n\nDistribution on CXR/CT helps narrow the differential diagnosis. Asbestosis causes lower lobe predominant fibrosis with pleural plaques. Silicosis causes upper lobe nodules and 'eggshell' calcification of hilar nodes. Sarcoidosis typically has bilateral hilar adenopathy with upper lobe predominance."
    difficulty: medium
    tags: [respirology, ILD, radiology, mnemonics, differential-diagnosis]
  - front: "What are the idiopathic interstitial pneumonias (IIPs)?"
    back: "IPF (idiopathic pulmonary fibrosis), NSIP (non-specific interstitial pneumonia), RB-ILD (respiratory bronchiolitis-related ILD), DIP (desquamative interstitial pneumonia), COP (cryptogenic organizing pneumonia), AIP (acute interstitial pneumonia), LIP (lymphocytic organizing pneumonia), IPPFE (idiopathic pleuroparenchymal fibroelastosis), AFOP (acute fibrinous and organizing pneumonia).\n\nIPF is the most common and worst-prognosis IIP. It requires UIP (usual interstitial pneumonia) pattern on CT or biopsy. DIP and RB-ILD are smoking-related. COP was formerly called BOOP and responds well to corticosteroids. AIP (Hamman-Rich syndrome) has very high mortality. Classification guides prognosis and treatment."
    difficulty: medium
    tags: [respirology, ILD, IPF, idiopathic-interstitial-pneumonia, classification]
  - front: "What investigations are performed for ILD?"
    back: "CXR: decreased lung volumes, reticular/nodular/reticulonodular pattern, hilar/mediastinal adenopathy, honeycombing. HRCT: UIP, probable UIP, indeterminate for UIP, or alternative diagnosis patterns. PFTs: restrictive pattern, ↓DLCO. ABGs: hypoxemia ± respiratory acidosis late. Labs: ANA, RF, anti-CCP, ANCA, myositis antibodies, serum precipitins for HP. Bronchoscopy with BAL in select cases. Surgical lung biopsy or transbronchial cryobiopsy for indeterminate/alternative diagnosis CT patterns.\n\nCXR can be normal in up to 10% of patients with ILD. Surgical biopsy is the gold standard when diagnosis is uncertain; transbronchial cryobiopsy is an emerging less invasive alternative. BAL showing lymphocytic predominance suggests HP or sarcoidosis; eosinophilic predominance suggests eosinophilic pneumonia."
    difficulty: medium
    tags: [respirology, ILD, investigations, HRCT, biopsy]
  - front: "What is IPF, who is typically affected, and what are the key diagnostic findings?"
    back: "IPF is pulmonary fibrosis of unknown cause with UIP histology. Progressive and irreversible. Commonly presents in males over age 50; smoking is a risk factor. Symptoms: dyspnea on exertion, nonproductive cough, late inspiratory fine crackles at lung bases, clubbing. CXR: reticular/reticulonodular pattern with lower lobe predominance; honeycombing in advanced disease. HRCT: UIP pattern (reticulation, subpleural and basal predominant, honeycombing ± traction bronchiectasis). Autoimmune serology usually negative.\n\nIPF prevalence increases with age (35–44 years: 27/100,000; >75 years: 175/100,000). Biopsy is only performed if CT pattern is indeterminate for UIP or suggests alternative diagnosis to IPF. DDx: CTD-associated ILD, chronic HP, asbestosis, NSIP. Ground glass, consolidation, or nodules should NOT be prominent in IPF on CT."
    difficulty: medium
    tags: [respirology, IPF, idiopathic-pulmonary-fibrosis, UIP, diagnosis]
  - front: "What are the four CT patterns for IPF interpretation and what does each indicate?"
    back: "1) UIP pattern: reticulation, subpleural and basal predominant, honeycombing + traction bronchiectasis — diagnostic of IPF without biopsy. 2) Probable UIP: reticulation, subpleural and basal predominant, traction bronchiectasis (no honeycombing). 3) Indeterminate for UIP: subtle reticulation, subpleural/basal predominant ('early UIP'), CT features not suggesting specific etiology. 4) Alternative diagnosis to IPF: cysts, mosaic attenuation, predominant ground-glass opacity, profuse micronodules, centrilobular nodules, consolidation, mid or upper lung zone predominance, peribronchovascular distribution.\n\nThis classification guides the need for surgical lung biopsy. If UIP pattern: no biopsy needed. If indeterminate or alternative diagnosis pattern: biopsy considered (transbronchial cryobiopsy emerging). Ground glass opacity as the predominant finding suggests alternative diagnoses such as HP, NSIP, or DIP."
    difficulty: hard
    tags: [respirology, IPF, HRCT, UIP, radiology, diagnosis]
  - front: "What is the treatment of IPF?"
    back: "Antifibrotic therapy: pirfenidone or nintedanib (slow disease progression). Smoking cessation. Pulmonary rehabilitation. Supplemental O2. PPI if patient has GERD/reflux. Lung transplantation for advanced disease. Palliative care. Acute exacerbation: prednisone (minimal evidence but frequently used) ± antibiotics ± diuretics ± mechanical ventilation on individualized basis.\n\nPirfenidone reduces fibroblast proliferation and TGF-β-mediated fibrosis. Nintedanib is a tyrosine kinase inhibitor targeting PDGFR, FGFR, VEGFR. Both slow FVC decline by approximately 50%. Neither cures IPF. Lung transplant is bilateral in IPF. Median survival without treatment is 2–5 years from diagnosis."
    difficulty: medium
    tags: [respirology, IPF, treatment, antifibrotics, pirfenidone, nintedanib]
  - front: "What is cryptogenic organizing pneumonia (COP) and how does it differ from other ILDs?"
    back: "COP: organizing pneumonia without identifiable cause. OP: inflammatory process involving bronchioles and alveolar space, caused by CTD-associated ILD, medications, or other triggers. Key distinction: COP has no history of connective tissue disease. Symptoms: nonspecific cough, dyspnea, recurrent pneumonia, fever, fatigue, often acute flu-like illness onset. Symptoms present <2 months in most patients. May be misdiagnosed as CAP (lack of response to empiric antibiotics suggests OP).\n\nCXR/CT: ground-glass opacities and patchy consolidation (bilateral, can be unilateral, migratory on serial X-rays). 'Reverse halo sign' (consolidation surrounding ground glass) is classic on CT. Treatment: immunosuppression with steroids for ~6 months; often recurrent requiring long taper. Drug-induced OP may improve with drug removal alone."
    difficulty: medium
    tags: [respirology, COP, organizing-pneumonia, ILD, treatment]
  - front: "What is the 'reverse halo sign' on CT and what condition is it associated with?"
    back: "The reverse halo sign (also called 'atoll sign') consists of a central area of ground-glass opacity surrounded by a ring of consolidation on CT. It is a classic sign of cryptogenic organizing pneumonia (COP)/organizing pneumonia.\n\nThe more common 'halo sign' (ground glass surrounding a nodule) is associated with invasive aspergillosis and other angioinvasive infections. Distinguishing these two signs is important: reverse halo = organizing pneumonia context; halo sign = infection/angioinvasion context. CT can also show patchy consolidation that is bilateral and migratory on serial X-rays in COP."
    difficulty: medium
    tags: [respirology, COP, radiology, CT-signs]
  - front: "What is hypersensitivity pneumonitis (HP) and what are common causative antigens?"
    back: "HP (extrinsic allergic alveolitis): spectrum of immune-mediated lung disorders occurring in response to inhaled organic antigens or low molecular weight compounds (drugs/chemicals). Common examples: Farmer's lung (Thermophilic actinomycetes), Bird breeder's/fancier's lung (bird antigens), Humidifier lung (Aureobasidium pullulans), Sauna taker's lung (Vibrio spp.), Metalworking fluid lung.\n\nTwo-hit hypothesis: genetic susceptibility + antigen exposure. Acute/subacute HP: immune complex formation (Type III hypersensitivity). Chronic HP: Type IV hypersensitivity (T-cell mediated granulomatous inflammatory response). May have no identified antigen (likely home environment). Exposure often occupational or hobby-related."
    difficulty: medium
    tags: [respirology, hypersensitivity-pneumonitis, HP, etiology, occupational]
  - front: "What are the presentations of hypersensitivity pneumonitis (HP) and how do PFTs vary?"
    back: "Acute: 4–6 hours after exposure; dyspnea, cough, fever, chills, malaise lasting 18–24 hours. Subacute: more insidious onset than acute. Chronic: insidious onset over years; dyspnea, cough, malaise, anorexia, weight loss. PFTs: acute HP often obstructive, subacute is obstructive/mixed, chronic is progressively restrictive. Serum precipitins may be detectable in acute and chronic HP (neither sensitive nor specific).\n\nHistopathology: acute HP triad = poorly formed granulomas + cellular bronchiolitis + interstitial lymphocytic infiltrate. BAL shows lymphocytic predominance. Chronic HP may be difficult to distinguish from IPF on biopsy (poorly formed granulomas + multinucleated giant cells ± features mimicking UIP). Early diagnosis and antigen avoidance are critical as chronic changes are irreversible."
    difficulty: medium
    tags: [respirology, hypersensitivity-pneumonitis, HP, PFTs, presentations]
  - front: "What is the treatment of hypersensitivity pneumonitis (HP)?"
    back: "Early diagnosis and antigen avoidance (critical — chronic changes are irreversible). Systemic corticosteroids: relieve symptoms and speed resolution; more effective in acute/subacute HP; uncertain benefit in chronic fibrosing HP. Steroid-sparing agents (mycophenolate, azathioprine): used in progressive disease despite steroids or to prevent steroid side effects.\n\nCXR patterns: acute HP shows diffuse infiltrates predominantly in upper lobes; chronic shows predominantly upper lobe reticulonodular pattern. Contrast with fibrotic ILD caused by asbestosis (lower lobes) and silicosis (upper lobes). Upper lobe fibrosis in HP can mimic silicosis or sarcoidosis."
    difficulty: medium
    tags: [respirology, hypersensitivity-pneumonitis, HP, treatment, corticosteroids]
  - front: "What ILD conditions are caused by connective tissue diseases, and which connective tissue diseases are associated?"
    back: "CTD-associated ILD: Scleroderma (most commonly NSIP pattern), Rheumatoid arthritis (UIP or NSIP), SLE, Polymyositis/dermatomyositis (NSIP or OP), Anti-synthetase syndromes, Mixed connective tissue disease, ANCA-associated vasculitis, Sjögren's syndrome. NSIP is the most common pattern in CTD-ILD, unlike IPF which shows UIP.\n\nCTD-ILD is an important diagnostic consideration before labeling someone as IPF—workup includes ANA, RF, anti-CCP, ANCA, myositis antibodies. Anti-Jo-1 is the most common myositis antibody in anti-synthetase syndrome (ILD + myositis + arthritis + mechanic's hands + Raynaud's). Scleroderma has highest prevalence of ILD among CTDs."
    difficulty: hard
    tags: [respirology, ILD, connective-tissue-disease, NSIP, rheumatology]
  - front: "What are drug-induced causes of ILD and what are examples of each drug class?"
    back: "Antibiotics: nitrofurantoin. Anti-inflammatory agents: methotrexate. Cardiovascular drugs: amiodarone. Antineoplastic agents: chemotherapy (bleomycin, cyclophosphamide). Recreational drugs: crack lung, talc granulomatosis. Radiation therapy. (Mnemonic RAAIDS: lower lobe ILD causes include amiodarone and drugs.)\n\nAmiodarone causes a phospholipidosis pattern (foamy macrophages) and is associated with NSIP or OP patterns on CT. Bleomycin causes pulmonary toxicity that is dose-dependent. Methotrexate causes hypersensitivity pneumonitis. Drug-induced OP may improve with drug discontinuation alone. A careful medication history is essential in all ILD evaluations."
    difficulty: medium
    tags: [respirology, ILD, drug-induced, amiodarone, methotrexate, pharmacology]
