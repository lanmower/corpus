# Obgyn Ob (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What conditions prolong Succinylcholine blockade?"
    back: "Decreased plasma pseudocholinesterase quantity (hereditary deficiency, liver disease, pregnancy, malignancy, malnutrition, collagen vascular disease) or impaired enzyme activity (genetically inherited)\n\nThese conditions reduce the rate of SCh metabolism, extending its duration of action."
    difficulty: medium
    tags: [anesthesia, succinylcholine, contraindications, pharmacogenetics, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "A spider angioma is associated with which hyperestrogenic states?"
    back: "Liver disease, pregnancy, and oral contraceptive pill use\n\nSpider angiomas develop due to hyperestrogenic states that cause arteriolar dilation, though they can also occur idiopathically."
    difficulty: easy
    tags: [dermatology, spider-angioma, liver-disease, estrogen, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What conditions are associated with spider angioma (Campbell Telangiectasia)?"
    back: "Hyperestrogenic states such as liver disease, pregnancy, and oral contraceptive use\n\nSpider angiomas are associated with hyperestrogenic states. While they can be associated with liver disease, pregnancy, or OCP use, they are more often idiopathic with no underlying pathology."
    difficulty: easy
    tags: [dermatology, spider_angioma, liver_disease, estrogen, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What condition is associated with spider angiomas in the setting of hyperestrogenic states?"
    back: "Liver disease, pregnancy, and oral contraceptive use\n\nSpider angiomas (Campbell telangiectasias) can be associated with hyperestrogenic states including chronic liver disease, pregnancy, and OCP use. However, they also commonly occur without any underlying pathology."
    difficulty: easy
    tags: [dermatology, spider angioma, liver disease, estrogen, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What conditions are associated with spider angiomas (Campbell telangiectasia)?"
    back: "Hyperestrogenic states including liver disease, pregnancy, and oral contraceptive use. However, spider angiomas are often idiopathic.\n\nSpider angiomas occur when a central arteriole dilates with slender radiating branches. They blanch with pressure applied to the center."
    difficulty: easy
    tags: [dermatology, vascular_tumors, liver_disease, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What laboratory finding is characteristic of Sézary Syndrome?"
    back: "WBC >20 x 10^9/L with Sézary cells (atypical circulating T-cells), and CD4:CD8 ratio >10 on flow cytometry.\n\nSézary syndrome is the leukemic variant of cutaneous T-cell lymphoma characterized by erythroderma and circulating malignant T-cells."
    difficulty: medium
    tags: [sézary syndrome, cutaneous T-cell lymphoma, hematology, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What monitoring is required before and during acitretin therapy?"
    back: "Baseline: LFTs, fasting lipid panel, pregnancy test ×2, glucose, radiography if long-term. Ongoing: LFTs and lipids q1-2wk until stable, then as indicated. Pregnancy test q3mo if >3yr after discontinuation.\n\nAcitretin is highly teratogenic. Women of childbearing potential require strict contraception. The drug has significant interactions with methotrexate, tetracyclines, and other systemic retinoids."
    difficulty: hard
    tags: [acitretin, psoriasis, oral therapy, monitoring, teratogenicity, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for methotrexate therapy?"
    back: "Pregnancy test at baseline, CBC at baseline then q6mo or more frequently, BUN/Cr and LFTs at baseline then q4-8wk\n\nMethotrexate 10-25mg weekly (max 30mg/wk) is used for psoriasis and AD. Folic acid supplementation is given to minimize side effects. More frequent monitoring is needed with dose changes or elevated serum levels."
    difficulty: hard
    tags: [methotrexate, psoriasis, oral therapy, monitoring, immunosuppression, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring parameters are required for methotrexate in psoriasis?"
    back: "Pregnancy test at baseline, CBC, BUN/Cr, and LFTs at baseline then q4-8 weeks\n\nMethotrexate requires regular hematologic and hepatic monitoring due to risks of bone marrow suppression and hepatotoxicity, especially with weekly dosing."
    difficulty: medium
    tags: [dermatology, methotrexate, psoriasis, monitoring, immunosuppression, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the critical monitoring requirements for isotretinoin in females of childbearing age?"
    back: "Pregnancy test x2 at baseline, then monthly during treatment; TWO forms of reliable contraception required (highly teratogenic); fasting lipid panel and LFTs q1-2 weeks until stable; glucose if risk factors\n\nIsotretinoin is highly teratogenic (category X) causing severe birth defects. Strict pregnancy prevention protocols are mandatory including dual contraception and monthly pregnancy testing."
    difficulty: hard
    tags: [isotretinoin, teratogenic, pregnancy, monitoring, acne, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for methotrexate in dermatology?"
    back: "Baseline: pregnancy test, CBC, BUN/Cr, LFTs; then CBC q6 months or more frequently if dose changes or risk factors; BUN/Cr, LFTs q4-8 weeks\n\nMethotrexate is a folate antagonist used for psoriasis and atopic dermatitis. Regular monitoring is essential due to risks of myelosuppression, hepatotoxicity, and pulmonary toxicity."
    difficulty: hard
    tags: [methotrexate, psoriasis, monitoring, systemic-therapy, myelosuppression, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for acitretin therapy?"
    back: "Baseline LFTs, fasting lipid panel, pregnancy test (x2), then LFTs and lipids q1-2 weeks until stable, pregnancy test q3 months during treatment and >3 years after discontinuation\n\nAcitretin requires extensive monitoring due to hepatotoxicity, hyperlipidemia, and teratogenicity. Women of childbearing potential require strict contraceptive measures"
    difficulty: hard
    tags: [acitretin, psoriasis, monitoring, oral therapy, teratogenicity, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the contraindications for isotretinoin?"
    back: "Pregnancy - teratogenic. Sexually active females require 2 forms of reliable contraception\n\nIsotretinoin is highly teratogenic. Females of childbearing potential must use two forms of contraception. Generally unsafe in lactation"
    difficulty: easy
    tags: [isotretinoin, acne, contraindications, teratogenicity, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for methotrexate?"
    back: "Pregnancy test at baseline; CBC at baseline then q6 months; BUN/Cr, LFTs at baseline then q4-8 weeks\n\nMethotrexate requires monitoring for bone marrow suppression, hepatotoxicity, and renal toxicity. Folic acid is given to minimize side effects"
    difficulty: hard
    tags: [methotrexate, psoriasis, monitoring, immunosuppression, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is HELLP syndrome and when is it seen?"
    back: "Hemolytic anemia, elevated liver enzymes, low platelets - seen only in preeclampsia/eclampsia\n\nHELLP syndrome is a severe form of preeclampsia affecting multiple organ systems and requires urgent obstetric management."
    difficulty: easy
    tags: [Hypertension, OB/GYN, HELLP, Emergency Medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the causes/precipitants of hypertensive emergencies?"
    back: "Causes include: essential HTN, emotional exertion, pain, sympathomimetic drugs (cocaine, amphetamines), MAOI with tyramine, pheochromocytoma, and pregnancy (preeclampsia/eclampsia).\n\nIdentifying the precipitant is essential for targeted treatment."
    difficulty: medium
    tags: [hypertension, emergency medicine, etiology, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the posterior pituitary hormones and their functions?"
    back: "ADH (antidiuretic hormone - regulates water balance) and oxytocin (needed for labor and breastfeeding)\n\nUnlike anterior pituitary hormones, these are made in the hypothalamus and stored in the posterior pituitary."
    difficulty: easy
    tags: [pituitary, posterior, ADH, oxytocin, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the role of oxytocin and what deficiency symptoms occur?"
    back: "Needed for labor and breastfeeding; deficiency is usually asymptomatic\n\nOxytocin deficiency is rare and primarily affects uterine contraction during labor and milk ejection during breastfeeding."
    difficulty: easy
    tags: [pituitary, oxytocin, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the recommended first-line treatment for smoking cessation in pregnancy?"
    back: "Counselling is recommended as first-line; NRT should be made available if non-pharmacologic methods fail\n\nWhile there's no strong evidence of major positive or negative outcomes with bupropion or varenicline in pregnancy, benefits must outweigh risks."
    difficulty: medium
    tags: [smoking-cessation, pregnancy, obstetrics, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What does GGT and MCV laboratory testing assess in alcohol use disorder?"
    back: "Baseline and follow-up monitoring\n\nGGT is sensitive to alcohol-induced liver injury; MCV reflects macrocytosis from alcohol."
    difficulty: easy
    tags: [alcohol, laboratory, monitoring, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "When should pregnant individuals be screened for gestational diabetes?"
    back: "Between 24-28 weeks gestation\n\nAll pregnant individuals should be screened for gestational diabetes between 24-28 weeks gestation using a 75g oral glucose tolerance test."
    difficulty: easy
    tags: [obstetrics, diabetes, gestational diabetes, screening, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "When should gestational diabetes be screened?"
    back: "Between 24-28 weeks gestation\n\nAll pregnant individuals should be screened for gestational diabetes during this gestational window."
