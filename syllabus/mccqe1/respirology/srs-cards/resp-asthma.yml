# Asthma (Respirology) - generated from srs-mccqe1
cards:
  - front: "A 22-year-old has episodic wheezing, dyspnea, and cough worsening at night. Spirometry shows FEV1/FVC 0.68 (predicted 0.80) that improves to 0.79 after bronchodilator. Diagnosis?"
    back: "Asthma; bronchodilator reversibility ≥12% and ≥200 mL improvement in FEV1 confirms diagnosis\n\nGINA and CTS asthma guidelines diagnose asthma by characteristic symptoms plus objective confirmation of variable airflow limitation. Bronchodilator reversibility, diurnal PEF variability >10%, or positive bronchoprovocation test confirms diagnosis."
    difficulty: medium
    tags: [asthma, spirometry, bronchodilator reversibility, FEV1, respirology]
  - front: "What is the stepwise treatment approach for asthma per GINA/CTS guidelines?"
    back: "Step 1: SABA PRN; Step 2: low-dose ICS + SABA PRN; Step 3: low-dose ICS/LABA or medium ICS; Step 4: medium-high ICS/LABA; Step 5: add-on tiotropium, anti-IL5, or oral steroids\n\nCTS 2021 guidelines now recommend low-dose ICS-formoterol as preferred reliever at Steps 3-5 (MART strategy) over SABA alone, based on reduced exacerbations. ICS is the cornerstone of asthma treatment."
    difficulty: easy
    tags: [asthma treatment, ICS, GINA, stepwise, respirology]
  - front: "A 30-year-old with asthma uses salbutamol >3 days/week and wakes at night 2x/month. Current level of control and next step?"
    back: "Partially controlled asthma; step up therapy — add or increase ICS (step up one level)\n\nGINA defines controlled asthma as: daytime symptoms ≤2 days/week, no nighttime symptoms, SABA use ≤2 days/week, no activity limitation. Partially controlled = 1-2 of these criteria not met. Step-up for uncontrolled."
    difficulty: medium
    tags: [asthma control, GINA, ICS, step-up therapy, respirology]
  - front: "What are features of a severe acute asthma exacerbation requiring ICU?"
    back: "SpO2 <90%, PEF <40% predicted, pulsus paradoxus >25 mmHg, silent chest, altered consciousness, inability to speak in sentences\n\nSevere/life-threatening asthma: silent chest (no wheeze), cyanosis, altered mental status, respiratory failure (rising PaCO2 indicates fatigue). Management: high-flow O2, continuous nebulized SABA, IV/IM corticosteroids, IV magnesium sulfate."
    difficulty: hard
    tags: [severe asthma, asthma exacerbation, ICU, respirology]
  - front: "What is the role of inhaled corticosteroids in asthma management?"
    back: "ICS reduce airway inflammation, decrease exacerbations and hospitalizations, and improve lung function — cornerstone of asthma treatment from Step 2 onward\n\nGINA and CTS guidelines recommend ICS for all patients with persistent asthma. ICS do not cure asthma but control symptoms and prevent exacerbations. Common side effects: oral candidiasis (use spacer, rinse mouth), dysphonia."
    difficulty: easy
    tags: [ICS, inhaled corticosteroids, asthma management, inflammation, respirology]
  - front: "A 45-year-old has asthma uncontrolled on medium-dose ICS/LABA. What add-on biologics are available and how are they chosen?"
    back: "Anti-IgE (omalizumab for allergic asthma), anti-IL5 (mepolizumab, benralizumab for eosinophilic asthma), anti-IL4/13 (dupilumab)\n\nCTS guidelines recommend biologics for severe uncontrolled asthma at Step 5 based on phenotype. Eosinophil count (≥300) guides anti-IL5 choice. Omalizumab requires elevated serum IgE and allergen sensitization."
    difficulty: hard
    tags: [biologics, severe asthma, omalizumab, mepolizumab, eosinophilic, respirology]
  - front: "What is the MART strategy in asthma and what are its benefits?"
    back: "Maintenance And Reliever Therapy using ICS-formoterol (budesonide-formoterol) as both daily controller and as-needed reliever — reduces exacerbations vs. SABA PRN approach\n\nGINA 2021 recommends ICS-formoterol as preferred reliever at Steps 3-5 because each reliever use delivers anti-inflammatory medication. This reduces exacerbation frequency and asthma-related deaths compared to SABA-only relief."
    difficulty: medium
    tags: [MART, ICS-formoterol, budesonide-formoterol, asthma management, respirology]
  - front: "How is occupational asthma diagnosed and managed?"
    back: "Serial PEF monitoring at work vs. away, specific bronchoprovocation testing; management: remove from exposure — symptoms may not fully resolve even after removal\n\nOccupational asthma accounts for 9-15% of adult-onset asthma. Common causes: isocyanates (spray painters), flour dust (bakers), latex, animals. Early diagnosis and removal from exposure improves prognosis."
    difficulty: medium
    tags: [occupational asthma, PEF monitoring, workplace exposure, respirology]
  - front: "A pregnant patient has moderate persistent asthma. Can ICS and LABAs be continued?"
    back: "Yes — poorly controlled asthma is more dangerous to fetus than ICS/LABA. Continue ICS (budesonide preferred), LABA, and SABA\n\nCTS guidelines state poorly controlled asthma increases risk of preterm birth, IUGR, and maternal complications. Benefits of ICS far outweigh risks. Oral corticosteroids can be used for exacerbations. Most asthma medications are safe in pregnancy."
    difficulty: medium
    tags: [asthma in pregnancy, ICS, budesonide, safety, respirology]
  - front: "What triggers should patients with asthma be counselled to avoid?"
    back: "Allergens (dust mites, pet dander, mold, pollen), respiratory infections, tobacco smoke, cold air, NSAIDs/ASA, exercise, workplace exposures, GERD\n\nTrigger avoidance is a key non-pharmacologic intervention. ASA/NSAID sensitivity (Samter triad: asthma + nasal polyps + ASA sensitivity) requires substitution with acetaminophen. Beta-blockers are relatively contraindicated in asthma."
    difficulty: easy
    tags: [asthma triggers, allergen avoidance, Samter triad, NSAIDs, respirology]
  - front: "A 16-year-old with asthma has SpO2 94%, moderate respiratory distress, and PEF 55% predicted after 2 puffs of salbutamol. Next management steps?"
    back: "Continue salbutamol q20min x3, add ipratropium bromide, systemic corticosteroids (oral prednisone or IV methylprednisolone), supplemental O2\n\nModerate exacerbation: PEF 40-69%, SpO2 >90%, speaking in phrases. Adding ipratropium to SABA reduces hospitalization. Systemic corticosteroids should be given early. Reassess after initial treatment to determine if hospitalization needed."
    difficulty: hard
    tags: [asthma exacerbation, salbutamol, ipratropium, corticosteroids, respirology]
  - front: "What is the role of leukotriene receptor antagonists (montelukast) in asthma?"
    back: "Add-on therapy for persistent asthma not controlled on ICS alone; also useful for allergic rhinitis comorbidity and exercise-induced bronchoconstriction\n\nMontelukast is a Step 3 add-on option per CTS guidelines. It is less effective than LABA as add-on therapy. Health Canada has a boxed warning for neuropsychiatric adverse effects (depression, suicidal ideation) — counsel patients."
    difficulty: medium
    tags: [montelukast, LTRA, asthma add-on therapy, respirology]
  - front: "How is exercise-induced bronchoconstriction (EIB) managed?"
    back: "SABA 15 min before exercise for prevention; warm-up period; consider LTRA or ICS if frequent; diagnose with exercise challenge test (FEV1 drop ≥10%)\n\nEIB occurs in up to 90% of asthmatics. Diagnosis confirmed by ≥10% FEV1 drop on standardized exercise challenge. SABA pre-treatment is most effective. ICS reduces EIB with regular use."
    difficulty: easy
    tags: [exercise-induced bronchoconstriction, EIB, SABA, prevention, respirology]
  - front: "What defines asthma-COPD overlap (ACO) and how is it managed?"
    back: "Persistent airflow limitation (post-BD FEV1/FVC <0.70) plus features of both asthma (variable airflow) and COPD (age >40, smoking history); manage with ICS/LABA — avoid LABA without ICS\n\nACO has increased exacerbation risk. CTS recommends ICS as cornerstone since ICS monotherapy is inappropriate in COPD but ICS-containing therapy is appropriate in ACO. Smoking cessation is critical."
    difficulty: hard
    tags: [ACO, asthma-COPD overlap, ICS, LABA, respirology]
  - front: "What are the indications for referral to a respirologist for asthma management?"
    back: "Uncontrolled asthma despite Step 3-4 therapy, severe exacerbations requiring ICU, uncertain diagnosis, occupational asthma, consideration for biologic therapy, frequent ED visits\n\nCTS guidelines recommend specialist referral for difficult-to-treat asthma. Specialist evaluation includes allergy testing, comprehensive spirometry, bronchoprovocation testing, and assessment for comorbidities (GERD, rhinosinusitis, OSA, obesity) that may worsen asthma."
    difficulty: medium
    tags: [asthma referral, specialist, difficult asthma, respirology]
  - front: "What are the spirometry criteria for diagnosing asthma?"
    back: "FEV1/FVC <0.75-0.80 with >=12% and >=200mL improvement post-bronchodilator\n\nPer CTS, reversible airflow obstruction is hallmark. If normal, methacholine challenge PC20 <4mg/mL confirms hyperresponsiveness."
    difficulty: medium
    tags: [asthma, spirometry]
  - front: "What is the stepwise approach to asthma management per CTS?"
    back: "Step 1: PRN SABA; Step 2: low-dose ICS; Step 3: low ICS+LABA; Step 4: med ICS+LABA; Step 5: high ICS+LABA+add-on\n\nCTS 2021 supports PRN ICS-formoterol as reliever across all steps. Step-up if uncontrolled >=2 times."
    difficulty: medium
    tags: [asthma, CTS]
  - front: "What FEV1 threshold indicates severe asthma exacerbation?"
    back: "FEV1 or PEF <40% predicted; <25% = life-threatening\n\nAdditional red flags: inability to speak in sentences, RR>30, HR>120, SpO2<92%, silent chest."
    difficulty: medium
    tags: [asthma, exacerbation]
  - front: "Name 3 biologics for severe asthma and their targets."
    back: "Omalizumab (anti-IgE), mepolizumab (anti-IL-5), dupilumab (anti-IL-4R/IL-13)\n\nIndicated for severe eosinophilic asthma uncontrolled on high-dose ICS+LABA. Tezepelumab (anti-TSLP) newest."
    difficulty: hard
    tags: [asthma, biologics]
  - front: "What are the spirometry criteria for diagnosing asthma in adults per Canadian Thoracic Society (CTS) guidelines?"
    back: "FEV1/FVC ratio below lower limit of normal PLUS reversibility: ≥12% AND ≥200 mL improvement in FEV1 post-bronchodilator\n\nCTS guidelines require objective documentation of variable airflow obstruction. If spirometry is normal, methacholine challenge (PC20 <4 mg/mL) or exercise challenge can confirm diagnosis. Serial PEF variability >20% over 2 weeks is an alternative."
    difficulty: medium
    tags: [asthma, spirometry, CTS, diagnosis, respirology]
  - front: "How is asthma severity classified in the stepwise approach per GINA/CTS?"
    back: "Step 1: SABA PRN; Step 2: low-dose ICS; Step 3: low-dose ICS/LABA; Step 4: medium-dose ICS/LABA; Step 5: high-dose ICS/LABA ± add-on (tiotropium, biologics, OCS)\n\nCTS recommends assessing control (symptoms, exacerbations, lung function) before stepping up. LTRA is an alternative at Step 2 but less effective than ICS. As of 2023 GINA, PRN ICS-formoterol is preferred reliever at all steps."
    difficulty: medium
    tags: [asthma, GINA, stepwise, ICS, LABA, respirology]
  - front: "What defines well-controlled asthma per CTS criteria?"
    back: "Daytime symptoms <4 days/week, nighttime symptoms <1 night/week, SABA use <4 doses/week, no exacerbations, no missed activities, FEV1 ≥90% personal best\n\nCTS uses these 6 criteria to assess control. If ANY criterion is unmet, asthma is uncontrolled. The mnemonic is based on the 'Rule of 4s' for Canadian practice. Reassess in 2-4 weeks after treatment change."
    difficulty: medium
    tags: [asthma, control, CTS, respirology]
  - front: "A 30-year-old asthmatic on medium-dose ICS/LABA still has poor control. Eosinophils are 450 cells/μL and IgE is elevated. What biologic therapy is most appropriate?"
    back: "Anti-IL-5 (mepolizumab, benralizumab) for eosinophilic phenotype, or omalizumab if allergic phenotype with elevated IgE\n\nBiologics are Step 5 add-on therapy. Phenotyping guides selection: anti-IL-5/IL-5R for eosinophils ≥300, anti-IgE (omalizumab) for allergic asthma, anti-IL-4Rα (dupilumab) for eosinophilic or type 2 inflammation. CTS recommends phenotyping before biologic initiation."
    difficulty: hard
    tags: [asthma, biologics, eosinophilic, omalizumab, mepolizumab, respirology]
  - front: "What is the mechanism of action of ICS in asthma and why is it the cornerstone of therapy?"
    back: "ICS suppress airway inflammation by inhibiting transcription of pro-inflammatory cytokines (IL-4, IL-5, IL-13), reducing eosinophilic infiltration, mucus hypersecretion, and airway remodeling\n\nICS target the underlying inflammatory pathology rather than just bronchospasm. Early initiation prevents irreversible airway remodeling. Systemic bioavailability varies: fluticasone and ciclesonide have lower oral bioavailability, reducing systemic side effects."
    difficulty: medium
    tags: [asthma, ICS, pathophysiology, inflammation, respirology]
  - front: "In acute severe asthma (status asthmaticus), what are the critical signs indicating need for ICU admission and intubation?"
    back: "Silent chest, altered consciousness, PaCO2 normal or rising (≥40 mmHg), PEF <25% predicted, bradycardia, hypotension, unable to speak\n\nA normal or elevated PaCO2 in an acute asthma attack is ominous because patients should be hyperventilating (low PaCO2). A rising PaCO2 indicates respiratory muscle fatigue and impending arrest. IV magnesium sulfate 2g over 20 min is indicated."
    difficulty: hard
    tags: [asthma, status asthmaticus, ICU, intubation, respirology]
  - front: "What is the acute asthma exacerbation management algorithm in the ED?"
    back: "Continuous salbutamol nebs + ipratropium q20min x3 + systemic corticosteroids (prednisone 40-50 mg PO or methylprednisolone IV) + O2 to SpO2 93-95%. Add IV MgSO4 2g if severe.\n\nCTS recommends ipratropium only in the first hour (no benefit after). Steroids take 4-6 hours for effect so must be given early. Reassess at 60-90 min for disposition. Aminophylline is NOT recommended routinely."
    difficulty: hard
    tags: [asthma, exacerbation, ED, salbutamol, corticosteroids, respirology]
  - front: "What are the side effects of high-dose ICS therapy in asthma?"
    back: "Local: oral candidiasis, dysphonia, pharyngitis. Systemic (high-dose/prolonged): adrenal suppression, osteoporosis, cataracts, glaucoma, skin thinning, growth suppression in children\n\nSpacer use and mouth rinsing reduce local effects. Budesonide and fluticasone at equivalent doses >1000 μg/day BDP-equivalent carry systemic risk. CTS recommends bone density monitoring for patients on high-dose ICS >3 months."
    difficulty: medium
    tags: [asthma, ICS, adverse effects, respirology]
  - front: "What methacholine challenge result confirms asthma diagnosis?"
    back: "PC20 (provocative concentration causing 20% fall in FEV1) <4 mg/mL is diagnostic; 4-16 mg/mL is borderline; >16 mg/mL makes asthma unlikely\n\nMethacholine challenge has high sensitivity (>95%) but lower specificity. A negative test essentially rules out asthma. Must withhold SABA 8h, LABA 48h, and antihistamines before testing. FEV1 must be >65% predicted to safely perform the test."
    difficulty: hard
    tags: [asthma, methacholine, diagnosis, spirometry, respirology]
  - front: "What is exercise-induced bronchoconstriction (EIB) and how is it managed?"
    back: "≥10% fall in FEV1 after standardized exercise challenge. Managed with SABA 15 min pre-exercise; daily ICS if frequent. LTRA (montelukast) is alternative pre-treatment.\n\nEIB occurs in 80-90% of asthmatics but also 10% of general population. Triggered by airway cooling and drying during exercise. Warm-up period can exploit refractory period. CTS recommends ICS as first-line if EIB indicates poor underlying control."
    difficulty: medium
    tags: [asthma, exercise, EIB, montelukast, respirology]
  - front: "How does the fractional exhaled nitric oxide (FeNO) test aid asthma management?"
    back: "FeNO >50 ppb in adults suggests eosinophilic airway inflammation and predicts ICS responsiveness. FeNO <25 ppb suggests non-eosinophilic asthma or good adherence.\n\nFeNO is a non-invasive biomarker of type 2 inflammation. Useful for confirming eosinophilic phenotype, monitoring ICS adherence, and predicting exacerbation risk. Not diagnostic alone. Levels affected by atopy, smoking (lowers), and viral infections."
    difficulty: hard
    tags: [asthma, FeNO, eosinophilic, biomarker, respirology]
  - front: "What is the Asthma-COPD Overlap (ACO) and how does its management differ?"
    back: "ACO features persistent airflow limitation with features of both asthma and COPD. Treat with ICS/LABA as first-line (never LABA monotherapy). Avoid ICS withdrawal.\n\nACO is suspected in smokers >40 with airflow obstruction AND history of atopy/asthma or eosinophils >300. Unlike pure COPD, these patients benefit significantly from ICS. GINA/GOLD recommend starting ICS-based therapy and referring for specialist confirmation."
    difficulty: hard
    tags: [asthma, COPD, ACO, overlap, ICS, respirology]
  - front: "A pregnant woman with asthma asks about medication safety. What is the approach?"
    back: "Continue ICS (budesonide preferred), SABA, and LABA as needed. Uncontrolled asthma poses greater risk to fetus than medications. Montelukast can continue if previously effective.\n\nCTS and SOGC guidelines emphasize that poorly controlled asthma increases risk of preeclampsia, preterm birth, and low birth weight. Budesonide has the most safety data in pregnancy. Step down is NOT recommended during pregnancy. Monthly monitoring advised."
    difficulty: hard
    tags: [asthma, pregnancy, budesonide, safety, respirology]
  - front: "What occupational exposures cause occupational asthma and how is it diagnosed?"
    back: "Common sensitizers: isocyanates (paint), flour dust (bakers), wood dust, latex, animal dander. Diagnosed by serial PEF monitoring (at work vs away ≥2 weeks) or specific inhalation challenge.\n\nOccupational asthma is the most common occupational lung disease in Canada. Two types: sensitizer-induced (latency period, IgE-mediated) and irritant-induced (RADS, no latency). Early removal from exposure improves prognosis; compensation through provincial WCB."
    difficulty: hard
    tags: [asthma, occupational, isocyanates, PEF, respirology]
  - front: "What is the role of allergen immunotherapy in asthma?"
    back: "Indicated for mild-moderate allergic asthma with clear allergen trigger. Subcutaneous (SCIT) or sublingual (SLIT) for 3-5 years can induce tolerance and reduce symptoms, medication use, and new sensitizations.\n\nCTS supports immunotherapy as adjunct when allergen avoidance and pharmacotherapy are insufficient. Contraindicated in severe/uncontrolled asthma (risk of anaphylaxis). Must have FEV1 >70% at time of injection. Only proven disease-modifying treatment for allergic asthma."
    difficulty: hard
    tags: [asthma, immunotherapy, SCIT, SLIT, allergic, respirology]
  - front: "What are the four most common causes of chronic cough (>8 weeks) in a non-smoking adult with a normal chest X-ray?"
    back: "1) Upper airway cough syndrome (post-nasal drip) — nasal congestion, throat clearing, responds to antihistamines/nasal steroids. 2) Asthma (cough-variant) — episodic, nocturnal, responds to inhaled bronchodilators/steroids. 3) GERD — worse after meals, lying flat, associated heartburn (though may be silent). 4) ACE inhibitor-related — dry tickling cough, develops weeks to months after starting ACEi.\n\nThese four causes account for >90% of chronic cough in immunocompetent non-smokers with normal CXR. A sequential empiric treatment approach (treat most likely cause first) is often used when investigations are non-diagnostic. ACEi cough resolves within 1-4 weeks of discontinuation and should be switched to an ARB."
    difficulty: easy
    tags: [chronic-cough, GERD, asthma, ACEi, post-nasal-drip, respirology]
  - front: "A 55-year-old non-smoker on lisinopril presents with a persistent dry cough for 3 months. CXR is normal. What is the most likely cause, the mechanism, and the management?"
    back: "ACE inhibitor-induced cough. Mechanism: ACE inhibitors prevent the breakdown of bradykinin and substance P in the lungs, which stimulate cough receptors. Management: discontinue the ACEi and switch to an ARB (e.g., losartan). Cough resolves within 1-4 weeks of discontinuation. Incidence is 5-20%, more common in women and those of East Asian descent.\n\nACEi cough is a class effect — switching to a different ACEi will not help. ARBs do not affect bradykinin metabolism and are appropriate substitutes. If the cough does not resolve after 4 weeks of ACEi discontinuation, pursue workup for other causes of chronic cough."
    difficulty: easy
    tags: [chronic-cough, ACEi, bradykinin, pharmacology, respirology]
  - front: "How do you approach the workup of chronic cough (>8 weeks) when the etiology is not immediately apparent?"
    back: "1) Stop ACEi if applicable (reassess in 4 weeks). 2) CXR (rule out mass, infiltrate, effusion). 3) Spirometry with bronchodilator reversibility and/or methacholine challenge (cough-variant asthma). 4) Empiric trial of nasal corticosteroids + antihistamine (UACS). 5) Empiric PPI trial for 8 weeks (GERD). 6) If all negative: high-resolution CT, sputum cytology (eosinophilic bronchitis), laryngoscopy, and consider psychogenic cough.\n\nThe approach is stepwise, targeting the most common causes sequentially. Methacholine challenge has a high negative predictive value — a negative test essentially excludes asthma. Non-acid reflux may cause cough without typical GERD symptoms, requiring impedance-pH monitoring for diagnosis."
    difficulty: hard
    tags: [chronic-cough, workup-algorithm, respirology, clinical-approach]
  - front: "What is the pathophysiology of asthma?"
    back: "Chronic airway inflammation (Th2-mediated: IL-4, IL-5, IL-13) causing bronchial hyperresponsiveness, mucus hypersecretion, smooth muscle hypertrophy, and reversible airflow obstruction\n\nMast cells, eosinophils, and T-lymphocytes are key. Early phase: IgE-mediated mast cell degranulation. Late phase: eosinophilic inflammation (4-8h). Airway remodeling occurs with chronic uncontrolled disease."
    difficulty: medium
    tags: [asthma, pathophysiology]
  - front: "What are the contraindications for thiopental?"
    back: "Porphyria, liver disease, status asthmaticus, myxedema; also contraindicated with TCA medication interaction\n\nNote: As of 2021, thiopental has been discontinued from production in North America."
    difficulty: medium
    tags: [anesthesia, IV-induction-agents, thiopental, contraindications, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What are the beta-2 agonist drugs and their primary use?"
    back: "Albuterol and terbutaline - primarily used as bronchodilators for asthma and COPD\n\nBeta-2 selectivity makes these drugs useful for respiratory conditions without significant cardiac (beta-1) side effects."
    difficulty: easy
    tags: [pharmacology, bronchodilators, beta agonists, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of albuterol?"
    back: "Selective beta-2 agonist used as a bronchodilator\n\nAlbuterol selectively stimulates beta-2 receptors in bronchial smooth muscle, causing bronchodilation. Used in asthma and COPD."
    difficulty: easy
    tags: [pharmacology, albuterol, beta-2 agonist, bronchodilator, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the difference between affinity and efficacy for an agonist?"
    back: "Affinity is the ability and strength of an agonist to bind to a receptor (e.g., salbutamol has greater affinity for β2-receptors than β1-receptors). Efficacy is the ability to elicit a response via receptor interaction once bound (e.g., salbutamol binding to β2-receptors causes smooth muscle relaxation).\n\nA drug can have high affinity but low efficacy (partial agonist) or high affinity with high efficacy (full agonist). Drug effectiveness measures real-world performance, which may differ from efficacy determined under ideal conditions."
    difficulty: medium
    tags: [pharmacodynamics, agonists, affinity, efficacy, receptor-theory, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is affinity in the context of drug-receptor interaction?"
    back: "The ability and strength of an agonist to bind to the receptor (e.g., salbutamol has greater affinity for β2-receptors than β1-receptors)\n\nAffinity determines how strongly a drug binds to its receptor, influencing selectivity and potency."
    difficulty: easy
    tags: [pharmacodynamics, affinity, agonists, receptor binding, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is efficacy in the context of drug-receptor interaction?"
    back: "The ability to elicit a response via receptor interaction (e.g., binding of salbutamol to β2-receptors results in smooth muscle relaxation)\n\nEfficacy is distinct from affinity—a drug may bind well but not produce a strong response."
    difficulty: easy
    tags: [pharmacodynamics, efficacy, agonists, receptor activation, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What are the short-term risks of smoking?"
    back: "Shortness of breath, asthma exacerbation, impotence, infertility, pregnancy complications, heartburn, upper respiratory tract infections\n\nThese symptoms can occur soon after starting smoking and are important to discuss with patients."
    difficulty: easy
    tags: [smoking-cessation, risks, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the short-term risks of smoking to discuss with patients?"
    back: "Shortness of breath, asthma exacerbation, impotence, infertility, pregnancy complications, heartburn, upper respiratory tract infections\n\nThese immediate effects often motivate patients more than long-term risks."
    difficulty: easy
    tags: [smoking-cessation, health-risks, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "List the short-term risks of smoking"
    back: "Shortness of breath, asthma exacerbation, impotence, infertility, pregnancy complications, heartburn, upper respiratory tract infection\n\nShort-term effects are often reversible but significantly impact quality of life and can worsen existing conditions."
    difficulty: easy
    tags: [smoking-cessation, epidemiology, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the short-term risks of smoking that should be discussed with patients?"
    back: "Shortness of breath, asthma exacerbation, impotence, infertility, pregnancy complications, heartburn, upper respiratory tract infections\n\nShort-term consequences are often more motivating for patients than long-term cancer risks."
    difficulty: easy
    tags: [smoking-cessation, risks, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the environmental risks of second-hand smoke?"
    back: "Higher risk of lung cancer, SIDS, asthma, and respiratory infections in spouse/children\n\nSecond-hand smoke affects non-smokers, particularly children and vulnerable populations."
    difficulty: easy
    tags: [smoking-cessation, health-risks, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What is the safety concern with salmeterol (LABA) in asthma?"
    back: "Salmeterol increases risk of respiratory-related and asthma-related deaths, especially in African American patients\n\nThe SMART trial found increased risk of asthma-related deaths with salmeterol, particularly in African Americans not using inhaled corticosteroids."
    difficulty: medium
    tags: [asthma, LABA, salmeterol, safety, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What is the role of omalizumab in severe allergic asthma?"
    back: "Omalizumab reduces asthma exacerbations (0.66 vs 0.88 per year) in severe allergic asthma inadequately controlled with high-dose ICS plus LABA\n\nThe EXTRA trial showed omalizumab provides additional clinical benefits including reduced exacerbations and improved control."
    difficulty: medium
    tags: [asthma, omalizumab, biologic, allergy, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What is the mechanism and benefit of tezepelumab in asthma?"
    back: "Tezepelumab is a TSLP inhibitor that reduces exacerbations by 62-71% in uncontrolled asthma despite LABA and medium-high dose ICS\n\nThe PATHWAY trial demonstrated tezepelumab significantly reduces annualized exacerbation rates compared to placebo."
    difficulty: hard
    tags: [asthma, tezepelumab, TSLP, biologic, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What is the primary endpoint outcome with omalizumab in severe allergic asthma?"
    back: "Reduced rate of asthma exacerbations (0.66 vs 0.88 per patient-year)\n\nEXTRA 2011: 48-week treatment with omalizumab significantly reduced exacerbation rate, p=0.006"
    difficulty: medium
    tags: [asthma, omalizumab, exacerbations, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What is EGPA (Eosinophilic Granulomatosis with Polyangiitis, formerly Churg-Strauss)?"
    back: "Granulomatous inflammation of vessels with hypereosinophilia and tissue infiltration; associated with MPO-ANCA in 40-50% of cases; triad: allergic rhinitis, asthma, eosinophilic pneumonia; other features: peripheral neuropathy (70%), GI involvement, myocarditis\n\nEGPA typically presents in middle age with asthma history and eosinophilic lung disease."
    difficulty: medium
    tags: [EGPA, Churg-Strauss, Eosinophilia, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "Which adrenergic receptor mediates bronchodilation, and which muscarinic effect opposes it?"
    back: "β2 receptors mediate sympathetic bronchodilation (smooth muscle relaxation). Muscarinic (M) receptors mediate parasympathetic bronchoconstriction and increased bronchial gland secretion.\n\nThis receptor physiology underlies the treatment of asthma/COPD: β2-agonists (salbutamol, formoterol) cause bronchodilation; anticholinergics (ipratropium, tiotropium) block muscarinic-mediated bronchoconstriction. Epinephrine acts on both α and β receptors."
    difficulty: easy
    tags: [autonomic nervous system, beta-2 receptor, bronchodilation, muscarinic, asthma, COPD]
  - front: "How is asthma severity classified in the ED, and what defines a 'silent chest'?"
    back: "Classification: Mild (FEV1 >80%, exertional SOB), Moderate (FEV1 50–80%, SOB at rest, speaking in phrases), Severe (FEV1 <50%, O2 sat <90%, speaking in words), Respiratory arrest imminent (silent chest, decreased HR, RR >30, pCO2 >45 mmHg, O2 sat <90% despite O2). Silent chest = no audible wheeze due to severely reduced airflow — a medical emergency.\n\nA silent chest indicates near-total airway obstruction with minimal air movement — paradoxically, the wheeze disappears as airflow becomes too low to generate sound. This is a pre-arrest state requiring immediate aggressive treatment including intubation. Intubation in severe asthma carries high risk and should be avoided if possible with maximal medical therapy."
    difficulty: medium
    tags: [asthma, severity, silent chest, emergency]
  - front: "What is the acute management of severe asthma in the ED?"
    back: "O2 to achieve sat >92%, short-acting beta-agonist (salbutamol 5 mg nebulizer continuously), short-acting anticholinergic (ipratropium 0.5 mg nebulizer x3), IV steroids (methylprednisolone 125 mg), IV magnesium sulfate 2 g over 20 min (50–75 mg/kg in pediatrics).\n\nCombined SABA + SAAC therapy reduces hospitalization rates compared to SABA alone in severe (not mild/moderate) asthma exacerbations. Magnesium sulfate acts as a bronchodilator by inhibiting smooth muscle contraction. For respiratory arrest imminent: intubate with ketamine induction (bronchodilatory properties), and IV epinephrine if associated hypotension."
    difficulty: medium
    tags: [asthma, salbutamol, ipratropium, magnesium, emergency]
  - front: "What criteria define well-controlled asthma?"
    back: "Daytime symptoms <4 days/week, nocturnal symptoms <1x/week, no limitation in activity, no absence from work/school due to asthma, no AER (acute emergency room visit) from asthma, rescue inhaler use <4x/week, FEV1 ≥90% personal best, PEF variation <10–15% diurnal.\n\nThese criteria from the Canadian Thoracic Society guide assessment of asthma control. Patients not meeting these criteria have uncontrolled asthma and require step-up therapy. Assessment at each visit is important as asthma control can vary over time."
    difficulty: medium
    tags: [asthma, control, criteria, Canadian guidelines]
  - front: "When is it safe to discharge a patient after an acute asthma exacerbation?"
    back: "FEV1 or PEF >60% predicted (safe); may be safe if 40–60% predicted depending on risk factors. Risk factors for recurrence: frequent ED visits, hospitalizations, recent steroid use, recent exacerbation, poor medication compliance, prolonged high-dose beta-agonist use.\n\nOn discharge: SABA MDI with aerochamber 2–4 puffs q2–4h then PRN, initiate inhaled corticosteroids, prednisone 30–60 mg/day for 5–10 days (no taper for short courses), counsel on aerochamber use and medication adherence, follow-up with primary care or asthma specialist."
    difficulty: medium
    tags: [asthma, discharge, FEV1, PEF]
  - front: "What is the definition of asthma?"
    back: "Chronic inflammatory disorder of the airways resulting in episodes of reversible bronchospasm causing airflow obstruction, associated with reversible airflow limitation and airway hyper-responsiveness to endogenous or exogenous stimuli.\n\nKey pathologic changes include hypertrophy of airway smooth muscle and hyperplasia of mucous-producing goblet cells. Unlike COPD, airflow limitation is reversible. Canadian prevalence is approximately 10.8% (3.8 million Canadians)."
    difficulty: easy
    tags: [respirology, asthma, definition, airway-disease]
  - front: "What are the six criteria for well-controlled asthma according to Canadian guidelines?"
    back: "1) Daytime symptoms <2 days/week; 2) Night-time symptoms <1 night/week; 3) Beta-2 agonist use <2 times/week; 4) Physical activity normal (unimpaired); 5) FEV1 or PEF ≥90% of personal best; 6) Exacerbations mild and infrequent (no ER visit, hospitalization, or prednisone use). Also: PEF diurnal variation <10-15%, no asthma-related absence from work/school.\n\nThese criteria from Can J Respir Crit Care Sleep Med 2021 guide step-up or step-down of therapy. The mnemonic 'DANGERS' captures signs of poor control: Daytime Sx ≥3 d/wk, Activities reduced, Night-time Sx >1/wk, GP visits unscheduled, ER visits, Rescue puffer use ≥3×/wk, School/work absences."
    difficulty: easy
    tags: [respirology, asthma, control, canadian-guidelines]
  - front: "What spirometric criteria confirm a diagnosis of asthma in patients aged 6 and older?"
    back: "Preferred: FEV1/FVC below lower limit of normal (adults typically <0.75–0.8; children 6+: typically <0.8–0.9) PLUS FEV1 ≥12% (and >200 mL in adults) after bronchodilator or course of controller therapy. Alternatives: PEF increase >60 L/min (and ≥20%) or diurnal variability >8% (twice daily) or >20% (multiple readings); positive methacholine challenge (FEV1 ↓≥20% at <4 mg/mL); post-exercise FEV1 ↓≥10–15%.\n\nObjective testing is mandatory as clinical diagnosis alone is inaccurate—asthma is frequently misdiagnosed. Methacholine 4–16 mg/mL required is borderline positive. Spirometry also shows causes of decreased FEV1 (asthma, COPD, bronchiectasis, cystic fibrosis)."
    difficulty: medium
    tags: [respirology, asthma, spirometry, diagnosis, PFTs]
  - front: "What are the common triggers of asthma?"
    back: "URTIs, emotion/anxiety, cold air, humidity, exercise, GERD, cigarette smoke, air pollution, strong scents, allergens (pet dander, house dust, cockroaches, seasonal pollens/ragweed), NSAIDs (Samter's triad: asthma + NSAID sensitivity + nasal polyps), beta-blockers (especially non-cardioselective), hormonal fluctuations.\n\nWork-related asthma includes occupational asthma (caused by high or low molecular weight sensitizer exposure) and work-exacerbated asthma. Identifying and avoiding triggers is a core non-pharmacologic intervention. NSAIDs cause bronchospasm via arachidonic acid pathway shunting to leukotrienes."
    difficulty: easy
    tags: [respirology, asthma, triggers, pharmacology]
  - front: "What is the pathophysiology of a severe asthma attack?"
    back: "Airway obstruction → V/Q mismatch → hypoxemia → increased ventilation → initial ↓PaCO2 → muscle fatigue → ↓ventilation → ↑PaCO2 → ↓pH (respiratory acidosis). Rising PaCO2 in an acute asthma attack is an ominous sign indicating impending respiratory failure.\n\nCentral cyanosis is not detectable until SpO2 <85%. It is more easily detected in polycythemia and less readily in anemia. Red flags include: tachypnea/tachycardia, respiratory muscle fatigue, diminished expiratory effort, cyanosis, and silent chest (most ominous)."
    difficulty: medium
    tags: [respirology, asthma, pathophysiology, respiratory-failure]
  - front: "Outline the stepwise pharmacological management of chronic asthma in Canadian adults."
    back: "Step 1: Daily inhaled corticosteroids (ICS), OR ICS-formoterol as-needed (for patients ≥12y with expected low adherence to daily ICS). Step 2: Add LABA to low-dose ICS (combination inhaler). Step 3: Escalate ICS dose. Step 4: Consider LTRA, long-acting anticholinergics, oral corticosteroids, biologics (omalizumab [anti-IgE], mepolizumab [anti-IL5], dupilumab [anti-IL4/13]).\n\nAny patient with poor control or at risk of exacerbations should be on ICS-containing regimen. Risk of exacerbation includes: prior exacerbation requiring steroids/ED/hospitalization, poorly-controlled asthma, or SABA overuse (>2 inhalers/year). Step down therapy once control achieved. Biologics target severe eosinophilic or allergic asthma."
    difficulty: medium
    tags: [respirology, asthma, treatment, ICS, LABA, biologics, canadian-guidelines]
  - front: "What is the emergency management of acute severe asthma?"
    back: "1) Inhaled β2-agonist first line (MDI + spacer preferred); 2) Systemic steroids (PO or IV if severe); 3) If severe: anticholinergic therapy + magnesium sulfate; 4) SC/IV adrenaline if anaphylaxis-triggered or unresponsive to inhaled β2-agonist; 5) Rapid sequence intubation for life-threatening cases (plus 100% O2, monitoring, IV access); 6) ICS maintenance therapy at discharge.\n\nAt discharge, ICS should be initiated or continued to reduce risk of future exacerbations. Magnesium sulfate causes bronchodilation by inhibiting calcium-mediated smooth muscle contraction. Spacer devices improve MDI drug delivery to airways. Non-invasive ventilation is less supported in asthma than in COPD."
    difficulty: medium
    tags: [respirology, asthma, emergency, acute-exacerbation, treatment]
  - front: "What does the DANGERS mnemonic identify in asthma management?"
    back: "Signs of poor asthma control: D - Daytime symptoms ≥3 days/week; A - Activities (physical) reduced; N - Night-time symptoms >1 night/week; G - GP visits (unscheduled for exacerbations requiring steroids); E - ER visits or hospitalizations for exacerbations; R - Rescue puffer (SABA) use ≥3 times/week; S - School or work absences.\n\nIdentifying poor control triggers escalation of therapy. Note the difference from well-controlled criteria: daytime symptoms <2 d/wk for control vs. ≥3 d/wk for poor control. The written Asthma Action Plan uses 'green/yellow/red' zones to guide self-management."
    difficulty: easy
    tags: [respirology, asthma, control, mnemonics]
  - front: "What is the role of ICS-formoterol as-needed versus ICS + SABA in mild-to-moderate asthma?"
    back: "ICS-formoterol as-needed reduces exacerbation rate and odds versus ICS + as-needed SABA (RR 0.85; OR 0.86). Canadian guidelines still recommend ICS + as-needed SABA as first-line for symptom control, but consider ICS-formoterol equal for those not otherwise at high risk. GINA 2021 prefers ICS-formoterol as-needed over ICS maintenance for mild asthma.\n\nICS-formoterol as reliever provides anti-inflammatory coverage at each rescue dose, potentially reducing exacerbation risk. Budesonide-formoterol (bud/form) is approved as a reliever for ≥12 years, only when also used as maintenance therapy. Canadian and GINA guidelines are somewhat different in their first-line recommendations."
    difficulty: hard
    tags: [respirology, asthma, ICS, LABA, formoterol, canadian-guidelines, evidence-based]
  - front: "What is the addition of LABA to ICS shown to do in asthma management (evidence)?"
    back: "In adults symptomatic on low to high doses of ICS monotherapy, addition of a daily LABA reduces rate of exacerbations requiring oral steroids by 23% and leads to significantly greater improvement in FEV1 compared to ICS monotherapy. In children, the effects are uncertain (Cochrane DB Syst Rev 2010).\n\nThis evidence supports the step 2 recommendation in asthma management: add LABA to ICS in adults not controlled on ICS alone. A combination inhaler (not separate ICS and LABA inhalers) is recommended to ensure LABA not used without ICS. LABAs must never be used as monotherapy in asthma due to increased asthma mortality risk without ICS."
    difficulty: medium
    tags: [respirology, asthma, LABA, ICS, evidence-based, RCT]
