# Pediatrics Pharmacology (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What is the acetaminophen dosing in pediatrics, and what is the maximum daily dose?"
    back: "Acetaminophen: 10-15 mg/kg/dose PO q4-6 h PRN (analgesic/antipyretic). Maximum daily dose: 60 mg/kg/d in neonates OR 75 mg/kg/d in older children to a maximum of 4 g/d. Causes hepatotoxicity at high doses.\n\nAcetaminophen is the most commonly used analgesic/antipyretic in children. The dose is weight-based and the maximum differs between neonates (lower maximum due to immature hepatic metabolism) and older children. Hepatotoxicity from overdose is the primary toxicity — NAC (N-acetylcysteine) is the antidote. Unlike ibuprofen, acetaminophen has no anti-inflammatory properties."
    difficulty: easy
    tags: [pediatrics, pharmacology, acetaminophen, analgesic, antipyretic, dosing]
  - front: "What is the ibuprofen dose in children and what are the key contraindications?"
    back: "Ibuprofen: 5-10 mg/kg/dose PO q6-8 h (analgesic, antipyretic, anti-inflammatory). Use cautiously in patients with liver/renal impairment, or history of GI bleeding or ulcers. Unlike acetaminophen, ibuprofen has anti-inflammatory properties, making it useful for JIA and musculoskeletal pain.\n\nIbuprofen is an NSAID with analgesic, antipyretic, and anti-inflammatory effects. It is preferred over acetaminophen when anti-inflammatory action is needed (e.g., JIA flares, soft tissue injuries). Contraindications include renal impairment, hepatic impairment, and GI ulceration. Avoid in neonates. ASA is generally avoided in children with viral illnesses due to risk of Reye syndrome."
    difficulty: easy
    tags: [pediatrics, pharmacology, ibuprofen, NSAID, dosing, contraindications]
  - front: "What are the dexamethasone doses for croup vs. acute asthma in children?"
    back: "Dexamethasone dosing: Croup: 0.6 mg/kg PO x 1 dose. Acute asthma: 0.6 mg/kg/d PO for 2 days.\n\nDexamethasone is preferred over prednisone for croup due to its longer half-life (single dose is effective) and better palatability. For croup, a single oral dose of 0.6 mg/kg reduces the need for return visits and hospital admission. For acute asthma, a 2-day course of dexamethasone is equivalent to a 5-day prednisone course and improves adherence. For persistent asthma, inhaled fluticasone (Flovent) is used for maintenance."
    difficulty: medium
    tags: [pediatrics, pharmacology, dexamethasone, croup, asthma, dosing]
  - front: "What is the prednisone/prednisolone dose for: (a) acute asthma, (b) ITP, and (c) nephrotic syndrome in children?"
    back: "(a) Acute asthma: prednisone/prednisolone 1-2 mg/kg/d PO x 5 days. (b) ITP: 3-4 mg/kg/d PO then taper to 1-2 mg/kg/d PO once platelet count >30 x 10⁹/L. (c) Nephrotic syndrome: 60 mg/m²/d PO. Note: oral prednisone is bitter-tasting; consider using prednisolone instead.\n\nCorticosteroids are used in multiple pediatric conditions. For asthma, a 5-day course of prednisone 1-2 mg/kg/d is standard for moderate-severe exacerbations. ITP (Immune Thrombocytopenic Purpura) uses higher doses (3-4 mg/kg/d) to rapidly raise platelet counts. Nephrotic syndrome uses surface area-based dosing (60 mg/m²/d). Prednisolone is preferred in young children because it is better tolerated palatability-wise."
    difficulty: medium
    tags: [pediatrics, pharmacology, prednisone, prednisolone, asthma, ITP, nephrotic-syndrome, dosing]
