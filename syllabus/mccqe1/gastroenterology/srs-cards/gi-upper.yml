  - front: "For low-grade dysplasia in Barrett's esophagus, what are the management options?"
    back: "Surveillance every 6 months for 1 year then annually, OR endoscopic ablation/resection\n\nBoth surveillance and endoscopic ablation/resection are satisfactory options for low-grade dysplasia in Barrett's esophagus."
    difficulty: medium
    tags: [Barretts esophagus, low-grade dysplasia, management, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What foods/substances should GERD patients avoid that may worsen symptoms?"
    back: "Alcohol, coffee, spices, tomatoes, and citrus juices\n\nWhile diet helps symptoms but not the disease, patients are advised to avoid alcohol, coffee, spices, tomatoes, and citrus juices."
    difficulty: easy
    tags: [GERD, diet, lifestyle, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the recommended management for PPI-refractory GERD with reflux-related symptoms?"
    back: "Consider surgical treatment (laparoscopic Nissen fundoplication) - showed 67% success vs 28% in medical therapy in RCT\n\nA 2019 NEJM randomized trial showed surgical treatment achieved significantly greater success (67%) than medical therapy (28%) for PPI-refractory reflux-related heartburn."
    difficulty: hard
    tags: [GERD, refractory, fundoplication, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the most accurate test for diagnosing GERD?"
    back: "24-hour pH monitoring\n\nWhile esophageal manometry diagnoses motility abnormalities and endoscopy visualizes structural issues, 24h pH monitoring is most accurate for detecting reflux."
    difficulty: easy
    tags: [GERD, diagnosis, investigations, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
