# Urology Bph (Urology) - generated from srs-mccqe1
cards:
  - front: "What are the absolute indications for surgical intervention in BPH?"
    back: "RRHAMS: Renal failure with obstructive uropathy, Refractory urinary retention, Hematuria refractory to medical treatment, Absolute urgency, Malignancy (rule out other causes), Severe symptoms unresponsive to medical therapies.\n\nWhen these absolute indications are present, conservative or medical management is insufficient and surgical correction (e.g., TURP, laser prostatectomy) is required regardless of symptom severity score."
    difficulty: medium
    tags: [BPH, TURP, surgical indications, urinary retention]
  - front: "What is the pathophysiology and etiology of BPH?"
    back: "Proliferation of epithelial, connective, and smooth muscle tissue in the prostatic transition zone. Requires DHT (converted from testosterone by 5-alpha reductase). Estrogens, impaired apoptosis, and other growth factors may also play a role.\n\nBPH occurs in the transition zone surrounding the urethra, producing obstructive symptoms. It is extremely age-related: 50% prevalence at age 50, 80% at age 80, with 25% requiring treatment."
    difficulty: easy
    tags: [BPH, DHT, 5-alpha reductase, prostate, transition zone]
  - front: "What medications are used in the treatment of BPH and their mechanisms?"
    back: "1. Alpha-adrenergic antagonists (e.g., tamsulosin): reduce smooth muscle tone at bladder neck, prostate, urethra. 2. 5-alpha reductase inhibitors (e.g., finasteride, dutasteride): block testosterone→DHT conversion, reduce prostate size. 3. Antimuscarinics or beta-3 agonists: for storage LUTS without elevated PVR. 4. PDE5 inhibitors: for ED and both storage/voiding LUTS. 5. Desmopressin: for nocturia (risk of hyponatremia in >65 yr).\n\nCombination therapy with alpha-blocker + 5-ARI is synergistic and superior for men with prostate volume >40 mL and PSA >1.5 ng/mL. Alpha-blockers should be avoided before planned cataract surgery due to intraoperative floppy iris syndrome."
    difficulty: medium
    tags: [BPH, alpha-blocker, 5-alpha reductase inhibitor, tamsulosin, finasteride, pharmacology]
  - front: "What is the IPSS and how are scores interpreted?"
    back: "International Prostate Symptom Score (IPSS) uses FUNWISE: Frequency, Urgency, Nocturia, Weak stream, Intermittency, Slow stream (incomplete emptying). Each graded 0–5 (total 0–35). 0–7 = mild, 8–19 = moderate, 20–35 = severe.\n\nThe IPSS (identical to AUA-SI) quantifies LUTS severity and guides treatment decisions. Notably, dysuria is NOT included in the score but is commonly associated with BPH. Scores guide escalation from watchful waiting to medical or surgical therapy."
    difficulty: easy
    tags: [BPH, IPSS, AUA-SI, LUTS, symptom score]
  - front: "Why should alpha-adrenergic antagonists be avoided before planned cataract surgery in men with BPH?"
    back: "Risk of intraoperative floppy iris syndrome (IFIS), which can complicate cataract surgery.\n\nAlpha-1 antagonists (especially tamsulosin) cause relaxation of the iris dilator muscle, leading to IFIS characterized by billowing iris, progressive miosis, and iris prolapse during phacoemulsification. Men should not start alpha-blockers until after cataract surgery is completed."
    difficulty: medium
    tags: [BPH, alpha-blocker, tamsulosin, cataract, floppy iris syndrome, drug interactions]
  - front: "What does the BPH transition zone contain, and how does it differ from other prostate zones?"
    back: "The transition zone surrounds the urethra and is the site of BPH development. The peripheral zone is the most common site of prostate cancer. The central zone surrounds the ejaculatory ducts.\n\nUnderstanding prostatic zonal anatomy is essential: BPH occurs in the transition zone (causing obstructive LUTS), while prostate cancer predominantly arises in the peripheral zone (detectable by DRE and biopsy). The ejaculatory zone/central zone is involved in seminal vesicle pathology."
    difficulty: easy
    tags: [prostate, transition zone, peripheral zone, BPH, prostate cancer, anatomy]
  - front: "What are the complications of untreated BPH?"
    back: "Urinary retention, overflow incontinence, hydronephrosis, renal insufficiency, infection (UTI, prostatitis), gross hematuria, bladder stones.\n\nChronic bladder outlet obstruction from BPH can lead to progressive upper tract damage via hydronephrosis and renal insufficiency — this constitutes an absolute indication for surgical intervention. Bladder stones form from urinary stasis."
    difficulty: easy
    tags: [BPH, complications, hydronephrosis, renal failure, urinary retention]
  - front: "What is the prostate size that correlates with approximate fruit sizes in BPH?"
    back: "20 cc = chestnut, 25 cc = plum, 50 cc = lemon, 75 cc = orange, 300 cc = grapefruit.\n\nProstate size (volume) is used to guide BPH treatment: TURP is preferred for moderate sizes, open/robotic simple prostatectomy for >100 cc, and technologies like UroLift are limited to <80 cc. Importantly, prostate size does NOT correlate with symptom severity."
    difficulty: easy
    tags: [BPH, prostate size, TURP, prostatectomy]
  - front: "What are the minimally invasive surgical therapies (MIST) for BPH and their prostate size limitations?"
    back: "TUMT (transurethral microwave therapy), UroLift (<80 cc), Convective water vapour energy ablation (Rezum™), BPKVP bipolar plasma kinetic vaporization (<60 cc), TUIP (<30 cc), Aquablation (<80 cc), Prostatic stent (unfit for surgery), Prostatic artery embolization.\n\nMIST options allow treatment with lower morbidity in patients who wish to avoid or cannot tolerate major surgery. Size thresholds limit their applicability: UroLift preserves ejaculatory function and is favored in younger, sexually active men with smaller glands."
    difficulty: medium
    tags: [BPH, minimally invasive, UroLift, Rezum, TUMT, BPKVP, TUIP, Aquablation]
