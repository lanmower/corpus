# Plastic Surgery (Surgery) - generated from srs-mccqe1
cards:
  - front: "What is cleft lip and palate, and when is surgical repair performed?"
    back: "Cleft lip: failure of fusion of maxillary and medial nasal processes (1:1000, M>F, more common left-sided and unilateral). Repair at 3 months. Cleft palate: failure of fusion of palatine processes (0.5:1000, F>M). Repair at 6-9 months.\n\nCleft palate requires special feeding bottles and speech-language pathology. Recurrent otitis media is common, often requiring myringotomy tubes. If one parent or sibling has cleft, there is a 4% chance; 17% if both sibling and parent are affected."
    difficulty: easy
    tags: [plastic surgery, pediatrics, craniofacial]
  - front: "What are the burn depth classifications and their key clinical features?"
    back: "Superficial (1st degree): painful, erythema, intact epidermis. Superficial-partial (2nd): painful, blisters with clear fluid, blanchable. Deep-partial (2nd): minimal pain, mottled, less blanchable. Full thickness (3rd): insensate, hard leathery eschar, thrombosed veins, no hair attached.\n\nBurn depth determines treatment: superficial heals without scarring; superficial-partial re-epithelializes in 7-14 days; deep-partial in 14-35 days with frequent hypertrophic scarring (grafting recommended); full thickness requires excision and grafting. Deep-partial and full thickness burns can be difficult to distinguish initially."
    difficulty: easy
    tags: [plastic-surgery, burns, burn-depth]
  - front: "What are the three zones of burn tissue injury?"
    back: "Zone of coagulation (center): nonviable necrotic tissue, requires excision and grafting. Zone of stasis (surrounding): decreased perfusion, potentially viable, can be saved with aggressive resuscitation. Zone of hyperemia (outermost): inflammation with increased blood flow, fully viable.\n\nThe zone of stasis is the critical area where appropriate early intervention can prevent progression to necrosis. Cellular death occurs in 24-48 hours without proper treatment. The goal of burn resuscitation is to maintain perfusion to the zone of stasis and prevent extension of the zone of coagulation."
    difficulty: medium
    tags: [plastic-surgery, burns, pathophysiology]
  - front: "What are the indicators of inhalation injury in a burn patient and how should it be managed?"
    back: "Indicators: injury in enclosed space, facial burns, singed nasal hair/eyebrows, soot around nares/oral cavity, hoarseness, conjunctivitis, tachypnea, carbon particles in sputum, elevated blood CO levels. Management: immediate intubation (do not wait for respiratory distress), 100% O2 to decrease carboxyhemoglobin half-life from 210 to 59 minutes.\n\nNeither CXR nor ABG can rule out inhalation injury. Direct bronchoscopy is used for diagnosis. Inhalation injury can lead to pulmonary edema (48-72 h), secondary bronchopneumonia (3-25 d), and progressive pulmonary insufficiency. CO poisoning presents with headache, confusion, coma, and arrhythmias."
    difficulty: medium
    tags: [plastic-surgery, burns, inhalation-injury]
  - front: "What are the indications for referral to a burn center?"
    back: "Partial/full-thickness burns involving hands, feet, genitalia, face, eyes, ears, major joints, or perineum. Electrical and chemical burns. Inhalation injury. Partial thickness burns >10% TBSA. Burns with medical comorbidities. Burns in children without pediatric specialists. Concomitant trauma.\n\nCircumferential burns can restrict respiratory excursion (chest) or blood flow to extremities, requiring escharotomy. Electrical burns cause extensive deep tissue damage that is often underestimated by TBSA. Patients with simultaneous trauma and burns should be stabilized for trauma first, then triaged to burn center."
    difficulty: easy
    tags: [plastic-surgery, burns, referral-criteria]
  - front: "What are the three phases of skin graft 'take' and common reasons for graft failure?"
    back: "1. Plasmatic imbibition (0-48h): diffusion of nutrients from recipient bed. 2. Inosculation (days 2-3): vessels from bed and graft grow toward each other. 3. Neovascular ingrowth (days 3-5): new vessels vascularize the graft. Common failure causes: hematoma/seroma, infection, mechanical shearing, radiotherapy.\n\nRequirements for graft survival include a well-vascularized bed, good contact between graft and bed (staples/sutures/pressure dressings prevent movement), and low bacterial count (<10^5/cm3). Grafts will not take on irradiated wounds, infected wounds, or exposed bone/cartilage/tendon without periosteum/perichondrium/paratenon."
    difficulty: medium
    tags: [plastic-surgery, skin-grafts]
  - front: "What are the key differences between split thickness and full thickness skin grafts?"
    back: "STSG: epidermis + partial dermis; more donor sites; better take rate; greater secondary contraction; poorer aesthetics; donor site heals by re-epithelialization. FTSG: epidermis + all dermis; limited donor sites; lower take rate; less secondary contraction; better aesthetics; donor site requires primary closure.\n\nSTSG is used for large areas and granulating beds. FTSG is preferred for face (better color match) and fingers (resists contraction). STSGs can be meshed to cover larger areas and prevent fluid accumulation, but result in 'alligator hide' appearance. Primary contraction is greater in FTSG; secondary contraction is greater in STSG."
    difficulty: easy
    tags: [plastic-surgery, skin-grafts]
  - front: "What is the reconstructive ladder and its steps from simplest to most complex?"
    back: "From simplest to most complex: 1. Healing by secondary intention, 2. Primary closure, 3. Delayed closure, 4. Split thickness graft, 5. Full thickness graft, 6. Tissue expansion, 7. Random pattern flap, 8. Pedicle flap, 9. Free flap.\n\nThe reconstructive 'elevator' approach selects the most appropriate (not necessarily simplest) method first. Flaps carry their own blood supply unlike grafts. Random pattern flaps have limited length:width ratio. Axial pattern flaps contain a named artery/vein allowing greater length. Free flaps require microsurgical anastomosis."
    difficulty: easy
    tags: [plastic-surgery, reconstruction]
  - front: "What is necrotizing fasciitis and what is its hallmark clinical feature?"
    back: "Aggressive infection of a fascial plane causing rapid spread with secondary necrosis. Hallmark: pain disproportionate to clinical findings and extending beyond the border of erythema. Requires emergent surgical debridement.\n\nType I is polymicrobial (immunocompromised). Type II is monomicrobial, usually GAS (healthy patients). Late findings include dusky blue/black skin, bullae, cutaneous gangrene, and subcutaneous emphysema (crepitus). Treatment: vigorous resuscitation, emergent surgical debridement, IV antibiotics (penicillin + clindamycin for GAS). Do not delay surgery for imaging."
    difficulty: medium
    tags: [plastic-surgery, necrotizing-fasciitis, soft-tissue-infection]
  - front: "What are Kanavel's four cardinal signs of flexor tenosynovitis?"
    back: "1. Point tenderness along the flexor tendon sheath. 2. Pain on passive extension of the digit. 3. Fusiform (sausage-like) swelling of the digit. 4. Flexed posture of the digit.\n\nFlexor tenosynovitis is an infection within the flexor tendon sheath, commonly from penetrating injury. Most common organisms: Staphylococcus > Streptococcus. Non-suppurative cases can be treated with antibiotics and splinting. Suppurative cases require I&D in OR. Untreated infection can lead to tendon necrosis and rupture."
    difficulty: easy
    tags: [plastic-surgery, hand-infections, flexor-tenosynovitis]
  - front: "What is a mallet finger and how is it treated?"
    back: "Loss of active extension at the DIP joint due to disruption of the extensor tendon insertion. Bony (fracture) or non-bony (tendon rupture from forced flexion of extended DIP). Treatment: continuous DIP splinting in extension for 6 weeks (even one episode of flexion resets the clock), followed by 2 weeks of night splinting.\n\nMallet finger is the most common closed tendon injury. An untreated mallet deformity can progress to swan neck deformity. Boutonnière deformity is PIP flexion + DIP hyperextension from central slip injury, treated with PIP extension splinting. Swan neck is PIP hyperextension + DIP flexion."
    difficulty: easy
    tags: [plastic-surgery, hand-tendon-injuries, mallet-finger]
  - front: "What is Dupuytren's disease and when is surgical treatment indicated?"
    back: "Proliferative disorder of palmar fascia causing nodules, cords, and flexion contractures at MCP and IP joints. Flexor tendons are NOT involved. Surgery indicated for: MCP contracture >30°, any PIP contracture, significant webspace contracture, or positive Hueston's tabletop test.\n\nMost common in northern European males, 5th-7th decade. Associated with alcohol use, smoking, and DM. Ring finger is most commonly affected. Dupuytren's diathesis (early onset, bilateral, multiple digits, non-palmar involvement) predicts more aggressive disease. MCP joints have better outcomes than PIP joints post-treatment."
    difficulty: easy
    tags: [plastic-surgery, Dupuytrens-disease]
  - front: "What is carpal tunnel syndrome and what are the key clinical features?"
    back: "Median nerve compression at the wrist by the flexor retinaculum. Most common peripheral compression neuropathy (F:M = 4:1). Classic presentation: night-time hand numbness relieved by shaking. Sensory loss in median nerve distribution but thenar eminence is spared (palmar cutaneous branch arises proximal to tunnel).\n\nPositive Phalen's (wrist flexion induces symptoms), Tinel's (percussion produces paresthesia), and Durkan's (pressure over tunnel <30s) signs support diagnosis. Advanced cases show thenar wasting. Secondary causes: pregnancy, hypothyroidism, acromegaly, RA. Treatment: nocturnal splinting → corticosteroid injection → surgical decompression."
    difficulty: easy
    tags: [plastic-surgery, carpal-tunnel-syndrome]
  - front: "What is the approach to hand lacerations in the emergency department (TINAX)?"
    back: "T = Tetanus prophylaxis, I = Irrigate with NS (copious irrigation and debridement), N = NPO (if considering replanting or urgent OR), A = Antibiotic prophylaxis (mainly for lacerations with fractures), X = X-rays.\n\nKey principles: test nerve function BEFORE injecting local anesthesia, assess TINAX, assess vessels (Allen's test), motor function, and tendons. Flexor tendons should be treated sooner due to risk of retraction. Digital nerves are superficial to digital arteries, so arterial bleeding from a volar laceration likely has associated nerve injury."
    difficulty: easy
    tags: [plastic-surgery, hand-lacerations, emergency-management]
  - front: "What is a Bennett's fracture and how does it differ from a Rolando fracture?"
    back: "Bennett's: two-piece intra-articular fracture-dislocation of the base of the 1st metacarpal at the CMC joint. Unstable, APL displaces MC shaft. Rolando: comminuted intra-articular T- or Y-shaped fracture at the same location. Both require percutaneous pinning or ORIF + thumb spica.\n\nBennett's fractures are unstable because the APL tendon pulls the metacarpal shaft into extension, radial deviation, and supination. A Boxer's fracture is fracture of the 5th metacarpal neck from a punching injury, treated with ulnar gutter splint. Rolando fractures carry increased risk of post-traumatic OA."
    difficulty: medium
    tags: [plastic-surgery, hand-fractures]
  - front: "What are the key differences between venous, arterial, and diabetic lower limb ulcers?"
    back: "Venous (70%): medial malleolus, yellow exudate/granulation, irregular margins, superficial, moderate pain relieved by elevation, ABI >0.9, treated with compression. Arterial: distal/toes, pale/necrotic base, 'punched out' margins, deep, severe pain worse with elevation, ABI <0.9. Diabetic: pressure points/metatarsal heads, necrotic base, painless (neuropathy), ABI unreliable (calcified vessels).\n\nVenous ulcers are caused by valvular incompetence and venous HTN. Arterial ulcers result from atherosclerotic disease. Diabetic ulcers combine neuropathy and microvascular disease. In diabetic patients, ABI can be falsely normal due to incompressible calcified arteries. Compression stockings for venous ulcers require ABI >0.9 before application."
    difficulty: medium
    tags: [plastic-surgery, lower-limb-ulcers]
  - front: "What are the stages of pressure ulcers according to the National Pressure Ulcer Advisory Panel?"
    back: "Stage I: non-blanchable erythema, skin intact. Stage II: partial-thickness skin loss. Stage III: full-thickness into subcutaneous tissue. Stage IV: full-thickness into muscle, bone, tendon, or joint. Unstageable: obscured by slough/eschar. Deep tissue: persistent non-blanchable deep red/maroon/purple.\n\nPressure ulcers develop over bony prominences from chronic pressure reducing tissue perfusion. Prevention is key: frequent repositioning, pressure relief surfaces, proper nutrition, early identification of at-risk patients. 4 principles of treatment: pressure relief, treat underlying medical issues, moisture reduction, wound bed preparation."
    difficulty: easy
    tags: [plastic-surgery, pressure-ulcers]
  - front: "What are the surgical margins for melanoma excision based on tumor depth?"
    back: "In situ: 5-10 mm. <1 mm depth: 10 mm. 1-2 mm: 10-20 mm. 2-4 mm: 20 mm. >2 mm: 20 mm. Sentinel node biopsy indicated for 0.76-1 mm thick with ulceration or mitotic rate ≥1.0/mm2, or >1 mm thick.\n\nMelanoma depth is determined via excisional biopsy. Shave biopsy should NOT be used for pigmented lesions because an unsuspected melanoma cannot be properly staged if partially removed. BCC margins: low-risk 3 mm, high-risk 3-5 mm. SCC margins: low-risk 4 mm, high-risk 6 mm."
    difficulty: medium
    tags: [plastic-surgery, melanoma, surgical-margins]
  - front: "What is the difference between primary, secondary, and tertiary wound healing?"
    back: "Primary (1st intention): direct wound edge approximation with sutures/staples for acute wounds. Secondary (2nd intention): wound left open to heal on its own via contraction and epithelialization. Tertiary (3rd intention): wound initially left open (packed), then closed primarily at 4-10 days after granulation tissue forms and bacterial count decreases.\n\nPrimary closure is contraindicated in animal/human bites, crush injuries, active infection, and wounds >6-8 hours old. Secondary healing is slower and results in greater scarring. Tertiary healing is used for contaminated wounds and fasciotomy closure. Wound closure risk of infection increases after 8 hours (facial lacerations may be closed up to 18-24h due to vascularity)."
    difficulty: easy
    tags: [plastic-surgery, wound-healing]
  - front: "How do hypertrophic scars differ from keloid scars?"
    back: "Hypertrophic: scar remains within boundaries of original wound, type III collagen parallel to surface, improves over time. Keloid: scar grows beyond boundaries of original wound, type I and III collagen in disorganized orientation, does not improve spontaneously. Both are red, raised, pruritic.\n\nHypertrophic scars are common at areas of high tension (back, shoulder, sternum). Keloids are more common in Black and Asian individuals and at central chest, back, shoulders, deltoid, ear, angle of mandible. Keloid treatment is multimodal: pressure garments, silicone, steroid injection, surgical excision + post-excisional radiation (high recurrence risk)."
    difficulty: easy
    tags: [plastic-surgery, abnormal-scarring]
  - front: "What is the maximum safe dose of lidocaine (plain and with epinephrine)?"
    back: "Plain lidocaine: 5 mg/kg, lasts 45-60 min. With epinephrine: 7 mg/kg, lasts 2-4 hours. For a 70 kg patient: max 35 mL of 1% lidocaine (plain) or 49 mL of 1% lidocaine with epi.\n\n1% lidocaine = 10 mg/mL. Toxicity symptoms progress from circumoral numbness, light-headedness, and drowsiness to tremors, seizures, and finally cardiac/respiratory arrest (late findings). Bupivacaine: plain 2 mg/kg (lasts 2-4h), with epi 3 mg/kg (lasts 4-12h)."
    difficulty: easy
    tags: [plastic-surgery, local-anesthesia]
  - front: "What is a Duchenne-Erb palsy versus a Klumpke's palsy?"
    back: "Duchenne-Erb: upper brachial plexus injury (C5-C6) from head/shoulder distraction; 'waiter's tip deformity' (shoulder internal rotation, elbow extension/pronation, wrist flexion). Klumpke's: lower brachial plexus injury (C8-T1) from traction on abducted arm; 'claw hand', may include Horner's syndrome.\n\nBoth are neonatal palsies caused by birth trauma. Surgical treatment includes neurolysis, neuroma resection, and nerve grafting. Priorities of surgery are shoulder stabilization and elbow function. Adult brachial plexus injuries may result from trauma, thoracic outlet syndrome, tumours, or neuropathy."
    difficulty: easy
    tags: [plastic-surgery, brachial-plexus]
  - front: "What is De Quervain's tenosynovitis and how is it diagnosed?"
    back: "Inflammation of the 1st extensor compartment tendons (APL and EPB). Diagnosed by Finkelstein's test: pain over radial styloid when examiner makes fist, ulnarly deviates wrist, and passively flexes thumb. Must differentiate from CMC joint arthritis (positive grind test).\n\nEichhoff's test (thumb in fist + ulnar deviation) is less specific than Finkelstein's. Treatment: mild cases with NSAIDs, thumb spica splint, and steroid injection into tendon sheath. Severe/refractory cases require surgical release of the 1st extensor compartment (check for subsheaths of APL and EPB)."
    difficulty: easy
    tags: [plastic-surgery, De-Quervains, hand]
  - front: "What is the position of safety for hand splinting and why is it used?"
    back: "Wrist extension 0-30°, MCP flexion 70-90°, IP joints in full extension. This position maintains tension on collateral ligaments to reduce risk of splint-induced stiffness.\n\nThe MCP collateral ligaments are taut in flexion and lax in extension. If the hand is splinted in extension at the MCPs, the ligaments shorten and the patient develops MCP joint contractures. Stiffness secondary to immobilization is the most important complication of hand fracture management."
    difficulty: easy
    tags: [plastic-surgery, hand-splinting]
  - front: "What are the characteristics of electrical burns that make them particularly dangerous?"
    back: "Small punctate skin burns with extensive deep tissue damage (injury severity depends on voltage and tissue resistance). Require ongoing ECG monitoring for arrhythmias. Complications: compartment syndrome, myoglobinuria/renal failure, ventricular fibrillation, cataracts (late), seizures, vessel thrombosis, fractures/dislocations.\n\nTissue resistance from lowest to highest: nerve < vessel/blood < muscle < skin < tendon < fat < bone. Internal injury is vastly underestimated by TBSA. Myoglobinuria indicates significant muscle damage and can cause acute tubular necrosis. Treatment includes aggressive fluid resuscitation, cardiac monitoring, early debridement, and monitoring for delayed vessel rupture."
    difficulty: medium
    tags: [plastic-surgery, electrical-burns]
  - front: "What are the surgical margins for low-risk vs. high-risk Basal Cell Carcinoma (BCC)?"
    back: "Low-risk BCC: 3 mm margins. High-risk BCC: 5 mm margins. High-risk features include diameter/location (>20 mm trunk, >6 mm face/hands/feet), poorly defined borders, recurrent lesion, poor differentiation, and sclerosing/morpheaform type.\n\nAdequate surgical margins are essential for complete excision of BCC. High-risk features such as location on the face, large size, and aggressive histology (morpheaform) require wider margins to reduce recurrence. Mohs micrographic surgery may be preferred for high-risk facial lesions."
    difficulty: easy
    tags: [plastic surgery, basal cell carcinoma, surgical margins, skin cancer]
  - front: "What are the surgical margins for low-risk vs. high-risk Squamous Cell Carcinoma (SCC)?"
    back: "Low-risk SCC: 4 mm margins. High-risk SCC: 6 mm margins. High-risk features include immunosuppression, depth >6 mm, ear/lip location, non-sun-exposed sites, poorly defined borders, recurrent lesion, poor differentiation, and aggressive histologic features (acantholytic, spindle, desmoplastic, perineural invasion).\n\nSCC requires wider margins than BCC due to higher metastatic potential. Perineural invasion and immunosuppression are particularly important high-risk features that mandate wider excision. Adjuvant radiation may be considered for high-risk SCC."
    difficulty: easy
    tags: [plastic surgery, squamous cell carcinoma, surgical margins, skin cancer]
  - front: "What are the surgical margins for malignant melanoma based on depth?"
    back: "In situ: 5–10 mm; <1 mm depth: 10 mm; 1–2 mm: 10–20 mm; 2–4 mm: 20 mm; >2 mm: 20 mm. Depth is determined via excisional biopsy. Lesions 0.76–1 mm with ulceration or mitotic rate ≥1/mm², or >1 mm thick, require sentinel lymph node biopsy.\n\nMelanoma margins are depth-dependent because thicker lesions carry higher risk of local recurrence and regional metastasis. Sentinel node biopsy is performed for intermediate- and high-risk lesions to stage regional lymphatics without the morbidity of complete lymph node dissection."
    difficulty: medium
    tags: [plastic surgery, melanoma, surgical margins, sentinel node biopsy]
  - front: "What is the precursor lesion for each of the three major malignant skin cancers (BCC, SCC, Melanoma)?"
    back: "BCC: Nevus sebaceous of Jadassohn. SCC: Actinic keratosis, Bowen's disease (SCC-in-situ), Bowenoid papulosis. Melanoma: Lentigo maligna/melanoma-in-situ, giant congenital nevus, dysplastic nevus.\n\nRecognizing premalignant lesions allows for earlier intervention and prevention of invasive cancer. Actinic keratosis is the most common precursor to SCC, and lentigo maligna is a slow-growing melanoma precursor particularly common in elderly sun-exposed patients."
    difficulty: easy
    tags: [plastic surgery, skin cancer, precursor lesions, dermatology]
  - front: "What are the toxic dose limits and duration of action for lidocaine and bupivacaine, with and without epinephrine?"
    back: "Lidocaine plain: 5 mg/kg, 45–60 min. Lidocaine with epinephrine: 7 mg/kg, 2–4 h. Bupivacaine plain: 2 mg/kg, 2–4 h. Bupivacaine with epinephrine: 3 mg/kg, 4–12 h. Note: 1% = 10 mg/mL.\n\nEpinephrine acts as a vasoconstrictor, reducing local absorption of the anesthetic, thus allowing higher doses and longer duration of action while reducing bleeding. Lidocaine toxicity manifests progressively as circumoral numbness, light-headedness, drowsiness, tremors, seizures, and finally cardiac/respiratory arrest."
    difficulty: easy
    tags: [plastic surgery, local anesthesia, lidocaine, bupivacaine, toxicity]
  - front: "What are the early symptoms of lidocaine toxicity and what are the late findings?"
    back: "Early symptoms: circumoral numbness, light-headedness, drowsiness, followed by tremors and seizures. Late findings: cardiac and respiratory signs (arrhythmias, cardiovascular collapse, respiratory arrest).\n\nLidocaine acts on sodium channels in both neurons and cardiac myocytes. CNS toxicity (excitation then depression) precedes cardiovascular toxicity. Recognition of early neurological symptoms is critical to prevent progression to life-threatening cardiac events."
    difficulty: easy
    tags: [local anesthesia, lidocaine toxicity, plastic surgery, anesthesia complications]
  - front: "How do you calculate the maximum volume of 1% lidocaine (plain) for a 70 kg patient?"
    back: "1% lidocaine = 10 mg/mL. Toxic limit = 5 mg/kg × 70 kg = 350 mg. Maximum volume = 350 mg ÷ 10 mg/mL = 35 mL. Formula: max dose (mg/kg) × weight (kg) / 10 × 1/concentration (%) = max mL.\n\nUnderstanding this calculation prevents accidental local anesthetic toxicity. If a larger volume is needed for field blocks, the solution can be diluted (e.g., to 0.5%) to use more volume within the safe total dose limit."
    difficulty: medium
    tags: [local anesthesia, lidocaine, dose calculation, plastic surgery]
  - front: "What are the three types of wound healing (primary, secondary, tertiary) and their indications?"
    back: "Primary (1°): Direct wound edge approximation; for acute wounds. Contraindicated in bites, crush injuries, active infection, >6–8 h old wounds, retained foreign body. Secondary (2°): Open to heal spontaneously; when 1° closure not possible/indicated. Tertiary (3°/Delayed primary): Intentional delay then closure at 4–10 days; for contaminated wounds, long time lapse, severe crush injury, fasciotomy closure.\n\nChoosing the appropriate wound closure strategy reduces infection risk and optimizes healing. Tertiary closure waits for granulation tissue formation and bacterial count <10⁵/g tissue before closure, reducing infection risk in contaminated wounds."
    difficulty: easy
    tags: [wound healing, plastic surgery, wound closure, infection]
  - front: "How does a hypertrophic scar differ from a keloid scar clinically and histologically?"
    back: "Hypertrophic scar stays within original scar boundaries; type III collagen parallel to epidermal surface. Keloid grows beyond original scar boundaries; types I and III collagen in disorganized orientation. Both are red, raised, and pruritic. Keloids are more common in Black and Asian individuals and have higher recurrence.\n\nThe key distinguishing feature is whether the scar respects its original boundaries. Keloids have a genetic predisposition and are significantly harder to treat — surgical excision alone leads to high recurrence, hence the need for multimodal therapy including post-excisional radiation."
    difficulty: easy
    tags: [wound healing, scars, keloid, hypertrophic scar, plastic surgery]
  - front: "What is the treatment for keloid scars?"
    back: "Multimodal therapy: pressure garments, silicone gel sheeting, corticosteroid injection, 5-fluorouracil injection, botulinum toxin injection, fractional CO₂ ablative laser, surgical excision + post-excisional radiation (to prevent high recurrence).\n\nKeloids are notoriously difficult to treat and have a high recurrence rate with surgery alone. Post-excisional radiation reduces recurrence by inhibiting fibroblast proliferation. This is in contrast to hypertrophic scars where surgical excision can be more definitive."
    difficulty: easy
    tags: [keloid, scar treatment, plastic surgery, wound healing]
  - front: "What are the four categories of bacterial presence in a wound and their clinical significance?"
    back: "1. Contamination: non-replicating organisms, no tissue damage. 2. Colonization: replicating organisms but no tissue damage. 3. Critical colonization: increasing bacterial burden causing delayed healing. 4. Infection: >10⁵ CFU/g of tissue (or small amounts of virulent organism, e.g., GAS); delayed healing with classic infection signs.\n\nDistinguishing these categories guides management. Critical colonization may warrant topical antimicrobial dressings, while true infection requires systemic antibiotics. The threshold of 10⁵ CFU/g is the accepted criterion for wound infection used to guide closure decisions."
    difficulty: medium
    tags: [wound infection, plastic surgery, bacteriology, wound healing]
  - front: "What is Marjolin's ulcer?"
    back: "Squamous cell carcinoma arising in a chronic wound, caused by chronic inflammatory state. Any non-healing wound should be biopsied to rule out Marjolin's ulcer.\n\nChronic wounds that fail to heal within 4–6 weeks may undergo malignant transformation. The chronic inflammatory microenvironment promotes mutagenesis. Marjolin's ulcers typically occur in burn scars, pressure ulcers, or venous stasis ulcers that have been present for years."
    difficulty: medium
    tags: [Marjolins ulcer, chronic wound, SCC, plastic surgery, wound complications]
  - front: "What wound characteristics make a wound tetanus-prone vs. not tetanus-prone?"
    back: "Tetanus-prone: >6 h since injury, depth >1 cm, crush/burn/gunshot/puncture/farming mechanism, devitalized tissue present, contaminated (soil, dirt, saliva, grass), retained foreign body. Not tetanus-prone: <6 h, <1 cm deep, sharp clean cut, no devitalized tissue, not contaminated, no foreign body.\n\nTetanus (Clostridium tetani) thrives in anaerobic environments. Devitalized, deep, contaminated wounds create ideal anaerobic conditions. Canadian immunization guidelines recommend tetanus prophylaxis (vaccine or immunoglobulin) based on wound characteristics and vaccination history."
    difficulty: easy
    tags: [tetanus, wound care, plastic surgery, infection prevention]
  - front: "What are the differences between absorbable and non-absorbable sutures, and when is each used?"
    back: "Absorbable (e.g., Vicryl, Monocryl, plain gut): deep sutures under short-term tension, skin closure in children; lose ≥50% strength at 4 wk. Non-absorbable (e.g., nylon, Prolene, silk, stainless steel): skin closure, sites of long-term tension; less strength degradation, better scarring, but may leave track marks.\n\nAbsorbable sutures are preferred for deep layers to avoid need for removal and to reduce foreign body reaction over time. Non-absorbable monofilament sutures (nylon, Prolene) are preferred for skin closure in traumatic wounds due to lower bacterial trapping compared to multifilament materials."
    difficulty: easy
    tags: [sutures, plastic surgery, wound closure, surgical technique]
  - front: "When should sutures be removed based on anatomical location?"
    back: "Face: 5–7 days. Scalp, torso, and extremities: 10–14 days.\n\nEarlier suture removal on the face reduces the risk of track marks ('railroad tracks') while relying on the deep dermal layer for tensile strength. Longer time is needed in areas of higher tension (back, extremities) to ensure adequate wound strength before suture removal."
    difficulty: easy
    tags: [sutures, plastic surgery, wound care, suture removal]
  - front: "What is the advantage of the deep/buried dermal suture technique?"
    back: "Places tension on the stronger dermis (containing collagen and elastin fibres) rather than the epidermis, reducing skin tension and improving scarring. Knots are placed deep ('buried') to prevent suture abscess/exposure.\n\nBy offloading tension from the epidermis to the dermis, the skin edges can be approximated without tension, which is the single most important factor in achieving a fine scar. Layered closure with deep dermal sutures also facilitates earlier removal of superficial sutures, reducing track marks."
    difficulty: easy
    tags: [sutures, plastic surgery, wound closure, scar management]
  - front: "What are monofilament vs. multifilament sutures and their relative advantages/disadvantages?"
    back: "Monofilament (e.g., Prolene, Monocryl, nylon): slides through tissue with less friction, less bacterial trapping (preferred in contaminated/infected wounds), but more memory/stiffness requiring multiple throws. Multifilament (e.g., Vicryl, silk): easier to handle, greater knot security, but higher infection risk due to bacterial trapping in interstices.\n\nIn infected or contaminated wounds, monofilament sutures are preferred as their smooth surface does not harbor bacteria like braided multifilament sutures. Silk is considered the most reactive suture material and has largely been replaced by synthetic alternatives."
    difficulty: easy
    tags: [sutures, plastic surgery, surgical technique, infection]
  - front: "What is skin adhesive (e.g., Dermabond) and what are its limitations?"
    back: "Skin adhesive (2-octyl cyanoacrylate) works well for small areas without much tension or shearing. Limitations: may cause irreversible tattooing, does not appose deep dermis (can lead to atrophic scar formation), cannot be used on actively bleeding wounds.\n\nCyanoacrylate adhesives polymerize on contact with moisture, forming a strong bond. However, without deep dermal approximation, scar quality may be inferior. They are useful in pediatric patients or superficial wounds where suture placement would be difficult."
    difficulty: easy
    tags: [wound closure, skin adhesive, plastic surgery, Dermabond]
  - front: "What is the rationale for planning incisions along relaxed skin tension lines (RSTLs)?"
    back: "RSTLs are natural skin/wrinkle lines with minimal linear tension. Placing incisions parallel to RSTLs minimizes scar widening/hypertrophy and helps camouflage scars. RSTLs are usually parallel to existing wrinkle lines and perpendicular to underlying muscle fibre orientation.\n\nSkin tension is highest perpendicular to muscle fibres due to repetitive muscle contraction. Incisions placed perpendicular to these forces (i.e., along RSTLs) experience less tension during healing, resulting in narrower, more cosmetically acceptable scars."
    difficulty: easy
    tags: [plastic surgery, incision planning, scar management, relaxed skin tension lines]
  - front: "What is the purpose of using an elliptical incision for excision, and what is the recommended length-to-width ratio?"
    back: "Elliptical incisions prevent 'dog ear' deformity (heaped-up skin at ends of incision). The length of the ellipse should be approximately 3× the defect width.\n\nA dog ear forms when excess skin bunches at the ends of a linear closure. The 3:1 length-to-width ratio ensures that the tissue redundancy at the apices is distributed over enough length that it flattens without requiring additional excision. Undermining skin edges also helps reduce tension."
    difficulty: easy
    tags: [plastic surgery, excision technique, dog ear, elliptical incision]
  - front: "What are the three biopsy techniques for skin lesions and when is each used?"
    back: "Shave biopsy: superficial/elevated benign lesions (skin tags, warts, seborrheic keratoses); NOT for pigmented lesions (cannot stage melanoma). Incisional biopsy (punch or ellipse within lesion): partial sampling, useful for large lesions; take from periphery to include lesion-normal skin interface. Excisional biopsy: complete removal for diagnosis/treatment, best for small pigmented lesions or suspected melanoma; always requires suture closure.\n\nBiopsy technique selection affects diagnostic accuracy. Shave biopsy of a melanoma would give an incomplete depth measurement, preventing proper staging and treatment planning. Excisional biopsy with appropriate margins is the gold standard for suspected melanoma."
    difficulty: easy
    tags: [skin biopsy, plastic surgery, melanoma, dermatology]
  - front: "Which nerve innervates the flexor digitorum superficialis (FDS) and what joint does it flex?"
    back: "FDS is innervated by the median nerve and flexes the PIP joints of digits 2–5.\n\nUnderstanding FDS anatomy is clinically important: it inserts at the base of the middle phalanges (D2–D5). To test FDS in isolation, hold all other fingers in extension (blocking FDP) and ask the patient to flex the finger at the PIP joint. Loss of FDS function indicates median nerve injury proximal to the wrist."
    difficulty: easy
    tags: [hand anatomy, flexor tendons, median nerve, plastic surgery]
  - front: "What is the dual innervation of the flexor digitorum profundus (FDP)?"
    back: "FDP is innervated by the anterior interosseous branch of the median nerve (radial half — D2, D3) and the ulnar nerve (ulnar half — D4, D5). It flexes the DIP joints of D2–D5.\n\nThis dual innervation is clinically relevant because an ulnar nerve lesion at the wrist affects DIP flexion only of D4 and D5. The 'OK sign' (anterior interosseous nerve test) evaluates FDP to D2 and D3 along with FPL — inability to form a circle indicates AIN palsy."
    difficulty: medium
    tags: [hand anatomy, FDP, median nerve, ulnar nerve, anterior interosseous nerve]
  - front: "Which intrinsic hand muscles are innervated by the recurrent motor branch of the median nerve?"
    back: "Abductor pollicis brevis (APB), Opponens pollicis (OP), and Flexor pollicis brevis (FPB) — superficial head only (deep head is ulnar). These are the muscles of the thenar eminence.\n\nThe recurrent motor branch of the median nerve arises just distal to the carpal tunnel. Carpal tunnel syndrome can cause thenar wasting if severe and prolonged. Testing thumb abduction (APB) is the standard functional test for median nerve motor function at the wrist."
    difficulty: easy
    tags: [hand anatomy, median nerve, thenar muscles, carpal tunnel, plastic surgery]
  - front: "What is the action and innervation of the adductor pollicis, and which test assesses ulnar nerve function using this muscle?"
    back: "Adductor pollicis: adduction at D1 and flexion of MCP; innervated by deep motor branch of ulnar nerve. Froment's sign tests this — patient grasps paper between thumb and index finger; if adductor pollicis is weak (ulnar nerve palsy), the patient compensates by flexing the thumb IP joint using FPL (median nerve).\n\nFroment's sign is a classic examination for ulnar nerve motor dysfunction. Loss of adductor pollicis leads to key pinch weakness with compensatory IP flexion, demonstrating the FPL taking over pinch function. Ulnar nerve injury at the wrist affects all intrinsic muscles except those innervated by the median nerve."
    difficulty: medium
    tags: [hand anatomy, ulnar nerve, adductor pollicis, Froments sign, plastic surgery]
  - front: "What is the mnemonic for carpal bones and what is the order?"
    back: "Mnemonic: 'Some Lovers Try Positions That They Can't Handle.' Scaphoid, Lunate, Triquetrum, Pisiform, Trapezium, Trapezoid, Capitate, Hamate (proximal row lateral to medial, then distal row lateral to medial). Alternatively: 'Long To Pinky, Here Comes The Thumb.'\n\nThe carpal bones are arranged in two rows. The proximal row (scaphoid, lunate, triquetrum, pisiform) articulates with the radius and ulna. The scaphoid is the most commonly fractured carpal bone and supplies blood distally to proximally, making proximal pole fractures prone to avascular necrosis."
    difficulty: easy
    tags: [hand anatomy, carpal bones, plastic surgery, anatomy]
  - front: "What is the extensor pollicis longus (EPL) clinical significance regarding Lister's tubercle?"
    back: "The EPL tendon passes around Lister's tubercle (a dorsal bony prominence on the distal radius) to change its angle of pull. Lister's tubercle acts as a pulley. EPL rupture can occur with distal radius fractures due to attrition of the tendon at this point.\n\nEPL rupture typically presents as inability to extend the thumb IP joint. It is a recognized complication of non-displaced distal radius fractures (e.g., Colles' fracture) due to tendon ischemia or attrition at Lister's tubercle. Treatment is extensor indicis proprius (EIP) tendon transfer."
    difficulty: medium
    tags: [hand anatomy, extensor tendons, EPL, Listers tubercle, plastic surgery]
  - front: "What are the contents of the carpal tunnel and what is the position of the median nerve within it?"
    back: "Contents: median nerve, flexor pollicis longus tendon, 4 FDS tendons, 4 FDP tendons (9 tendons + 1 nerve). The median nerve lies most superficially (just below the flexor retinaculum), and is the most vulnerable to compression.\n\nCarpal tunnel syndrome is the most common peripheral nerve compression syndrome. The carpal tunnel is bounded by the carpal bones and flexor retinaculum. Increased tunnel pressure compresses the median nerve, leading to sensory loss in the radial 3.5 digits and thenar weakness in advanced cases."
    difficulty: easy
    tags: [carpal tunnel, hand anatomy, median nerve, plastic surgery]
  - front: "What is the brachial plexus composed of and what is the mnemonic for its organization?"
    back: "The brachial plexus arises from spinal roots C5–T1. Mnemonic for organization: 'Rugby Teams Drink Cold Beers' = Roots, Trunks, Divisions, Cords, Branches. Prefixed plexus (40%): contribution from C4. Postfixed plexus (4%): contribution from T2.\n\nUnderstanding brachial plexus anatomy is essential for localizing injuries (e.g., Erb's palsy — upper trunk C5/C6; Klumpke's palsy — lower trunk C8/T1). The level of injury (pre- vs. post-ganglionic, root vs. cord) determines prognosis and surgical options."
    difficulty: easy
    tags: [brachial plexus, neuroanatomy, plastic surgery, anatomy]
  - front: "What are the wound exudate characteristics that help identify its type (serous, sanguineous, serosanguineous, purulent)?"
    back: "Serous drainage: thin, clear or pale yellow (plasma). Sanguineous: bright red (fresh blood). Serosanguineous: thin, pink to red (mix of serous and blood). Purulent: thick and opaque, white/yellow/pale green (indicates infection).\n\nMonitoring wound exudate type guides management. Purulent drainage indicates infection requiring wound opening, culture, and systemic antibiotics if needed. Serous drainage is normal in early healing. Excessive sanguineous drainage may indicate a hematoma requiring evacuation."
    difficulty: easy
    tags: [wound care, wound exudate, plastic surgery, infection]
  - front: "Which factors promote normal wound healing vs. which impair it?"
    back: "Local factors impairing healing: mechanical trauma, poor blood supply, technique/suture errors, retained foreign body, wound infection, hematoma/seroma, radiation. General factors: advanced age, obesity, malnutrition, smoking, alcohol, DM, cancer, dyslipidemia, renal failure, immunosuppression (steroids, chemotherapy), genetic predisposition (keloid, collagen vascular disease).\n\nOptimizing modifiable factors before elective surgery (e.g., smoking cessation, glycemic control, nutritional optimization) significantly improves wound healing outcomes. Smoking impairs healing via vasoconstriction, reduced tissue oxygenation, and impaired neutrophil function."
    difficulty: easy
    tags: [wound healing, plastic surgery, risk factors, perioperative care]
  - front: "What is the clinical significance of a wound >8 hours old for primary closure?"
    back: "Any wound primarily closed after 8 hours has an increased risk of infection. An exception is facial lacerations, which may be closed primarily up to 18–24 hours due to the face's rich vascularity and cosmetic importance.\n\nBacteria multiply rapidly after wound contamination. The 8-hour rule reflects the time after which bacterial counts and biofilm formation make primary closure higher risk. The face's robust blood supply reduces this risk, making later closure safer for cosmetically important areas."
    difficulty: easy
    tags: [wound care, plastic surgery, infection, wound closure timing]
  - front: "What are the contraindications to secondary intention wound healing?"
    back: "Wounds crossing joints or near anatomically sensitive structures (e.g., lower eyelid), as wound contraction can limit range of motion (ROM) and cause anatomical distortion (e.g., ectropion from lower eyelid contracture).\n\nSecondary intention healing involves wound contraction by myofibroblasts, which can be beneficial in some locations but harmful near mobile structures. Contracture across a joint can significantly limit function, and contraction near the eyelid can cause exposure keratopathy and corneal damage."
    difficulty: easy
    tags: [wound healing, secondary intention, plastic surgery, wound management]
  - front: "What is the role of the lumbrical muscles and what is their unique innervation pattern?"
    back: "Lumbricals flex the MCP joints and extend the PIP and DIP joints (intrinsic plus position). Innervation: radial two lumbricals (D2, D3) — recurrent motor branch of median nerve; ulnar two lumbricals (D4, D5) — deep motor branch of ulnar nerve.\n\nThe intrinsic-plus (lumbrical-plus) hand position of MCP flexion with IP extension is the classic posture of functioning intrinsic muscles. In ulnar nerve palsy, the ring and little finger assume a claw deformity (MCP hyperextension, IP flexion) due to loss of ring and little finger lumbricals."
    difficulty: medium
    tags: [hand anatomy, lumbricals, median nerve, ulnar nerve, intrinsic muscles]
  - front: "What is the chlorhexidine concentration used for skin antisepsis and what are its specific contraindications?"
    back: "Chlorhexidine is used at 0.5–4%. Avoid: eyes (risk of corneal damage), ears (risk of sensorineural hearing loss). Most preparations also contain isopropyl alcohol, which is flammable (must dry before cautery) and toxic to open wound tissue.\n\nChoosing the appropriate antiseptic is essential for patient safety. Betadine (10% povidone-iodine) is preferred around eyes and ears, and is safe for open wounds. Chlorhexidine is superior for skin prep in most other locations due to residual antimicrobial activity."
    difficulty: easy
    tags: [plastic surgery, antiseptics, chlorhexidine, surgical preparation]
  - front: "Why should surgical margins for skin lesions be marked before injecting local anesthetic?"
    back: "Local anesthetic injection can distort the local topography and obscure the lesion boundaries, making accurate margin marking impossible after injection.\n\nFluid injected subdermally causes local swelling and may spread pigment or displace lesion borders. Marking first ensures accurate surgical margins consistent with the planned excision — particularly important for melanoma where precise margin control affects both staging and oncologic outcomes."
    difficulty: easy
    tags: [plastic surgery, surgical technique, skin biopsy, excision]
  - front: "What is a spread scar and how does it differ from hypertrophic and keloid scars?"
    back: "Spread scar: wide scar covered by thin epithelium, flat/wide/depressed, stays within original wound boundaries, has normal collagen fibre order (unlike hypertrophic or keloid). Common on abdomen and knee. Caused by insufficient dermal apposition. Treatment: surgical excision and closure.\n\nSpread scars result from inadequate deep dermal sutures or high-tension areas where skin stretches post-closure. Unlike hypertrophic scars (raised, type III collagen parallel to epidermis) or keloids (extends beyond wound, disorganized collagen), spread scars are flat but cosmetically unappealing due to width."
    difficulty: easy
    tags: [plastic surgery, scars, wound healing, scar types]
  - front: "What are the dorsal and volar surfaces through which the palmar arterial arches course in the hand?"
    back: "Superficial palmar arch: primarily from ulnar artery. Deep palmar arch: primarily from radial artery. The radial artery enters the deep compartment through the anatomical snuffbox and between the first and second metacarpals to complete the deep arch.\n\nThe dual arterial supply of the hand provides collateral circulation, which is clinically tested with the Allen test before radial artery cannulation or harvest. The superficial arch typically supplies D2–D5 via common digital arteries; the deep arch gives rise to metacarpal arteries."
    difficulty: easy
    tags: [hand anatomy, vascular anatomy, radial artery, ulnar artery, plastic surgery]
  - front: "What are the pathogens associated with dog and cat bites?"
    back: "Pasteurella multocida, Staphylococcus aureus, Streptococcus viridans, Moraxella species, and Corynebacterium species.\n\nDog and cat bite infections are polymicrobial. Pasteurella multocida is the most characteristic organism. First-line treatment is Clavulin (amoxicillin-clavulanic acid) 875/125 mg PO BID started immediately, covering the polymicrobial flora."
    difficulty: easy
    tags: [plastic surgery, bites, infectious disease, microbiology]
  - front: "What is the first-line antibiotic treatment for dog and cat bites?"
    back: "Clavulin (amoxicillin + clavulanic acid) 875/125 mg PO BID started immediately.\n\nAmoxicillin-clavulanic acid covers the polymicrobial flora of dog and cat bites including Pasteurella multocida. Rabies prophylaxis should be considered if the animal shows symptoms of rabies or if the animal is unknown: rabies Ig 20 IU/kg around wound or IM, plus rabies vaccine 1.0 mL IM in deltoid on days 0, 3, 7, 14, 28."
    difficulty: easy
    tags: [plastic surgery, bites, antibiotics, pharmacology]
  - front: "What are the pathogens associated with human bites?"
    back: "Staphylococcus aureus > GAS > Eikenella corrodens > Bacteroides.\n\nHuman bites are serious because the mouth contains 10^8 microorganisms/mL, creating a high risk of infection. Eikenella corrodens is a key pathogen unique to human bite infections compared to animal bites. The 'fight bite' (tooth laceration into a closed joint space) can lead to septic arthritis."
    difficulty: easy
    tags: [plastic surgery, bites, infectious disease, microbiology]
  - front: "What is a 'fight bite' and why is it clinically significant?"
    back: "A 'fight bite' occurs when a human tooth lacerates into a closed joint space during an altercation. Bacteria become trapped in the joint as overlying skin and soft tissues shift when the fist moves from clenched to unclenched, leading to septic arthritis.\n\nFight bites are deceptively innocuous-appearing but carry high risk of septic arthritis because bacteria are inoculated directly into the joint space. They require urgent surgical exploration and washout of the joint if infection is present; otherwise I&D and IV antibiotics (cefazolin for MSSA, vancomycin for MRSA)."
    difficulty: medium
    tags: [plastic surgery, bites, infectious disease, orthopedics]
  - front: "What antibiotic is used for human bite infections due to MSSA, and what is the alternative for MRSA or penicillin allergy?"
    back: "MSSA: cefazolin 2 g IV q8h. Penicillin allergy or MRSA: vancomycin 15 mg/kg IV q12h.\n\nHuman bites with joint infection require surgical exploration, washout, splinting, and antibiotics. For MSSA, cefazolin provides adequate coverage; for MRSA or penicillin allergy, vancomycin is used. Secondary closure follows after adequate treatment."
    difficulty: medium
    tags: [plastic surgery, bites, antibiotics, pharmacology]
  - front: "What are the principles of wound dressing selection?"
    back: "Dressing selection depends on: (1) clean vs. infected (non-adherent for clean; antimicrobial for infected); (2) moist vs. dry (promote moist wound healing — moisten dry wounds or dry wet wounds); (3) wide-based vs. cavitary/tunneling (pack cavitary wounds with loose, radiopaque material).\n\nWound dressings must be changed as wounds progress through healing stages. Infected wounds may require debridement, antibiotics, and antimicrobial dressings (iodine gauze, silver-containing). Negative pressure wound therapy applies subatmospheric pressure to promote blood flow and reduce edema."
    difficulty: easy
    tags: [plastic surgery, wound care, dressings]
  - front: "What are the indications and contraindications for negative pressure wound therapy (NPWT)?"
    back: "Indications: diabetic foot ulcers, reconstructive surgery, following debridement of acute or chronic wounds. Contraindications: wounds with exposed vital structures (organs, blood vessels, vascular grafts) and malignant tissue.\n\nNPWT uses wound dressings that apply subatmospheric pressure to promote blood flow and enhance healing. The resulting pressure gradient promotes fluid transport from the wound bed and interstitial space, reducing wound edema. It cannot be used over exposed vital structures due to risk of erosion."
    difficulty: medium
    tags: [plastic surgery, wound care, NPWT]
  - front: "What is the difference between the 'reconstruction ladder' and the 'reconstruction elevator'?"
    back: "Reconstruction ladder: starts with the least complex method (healing by secondary intention) and progresses to more complex (primary closure, delayed closure, skin grafts, flaps, free flaps). Reconstruction elevator: the most appropriate rather than the simplest procedure is chosen first — steps can be skipped to achieve optimal reconstruction.\n\nThe ladder concept helps surgeons think systematically from least to most complex: healing by secondary intention → primary closure → delayed closure → split-thickness graft → full-thickness graft → tissue expansion → pedicle flap → free flap. The elevator concept allows jumping directly to the best option for the patient."
    difficulty: easy
    tags: [plastic surgery, reconstruction, wound care]
  - front: "What are the three phases of skin graft 'take' and their timeframes?"
    back: "1. Plasmatic imbibition: diffusion of nutrition from recipient site (first 48 h). 2. Inosculation: growth of vessels from bed and graft toward each other (day 2-3). 3. Neovascular ingrowth: growth of new vessels vascularizing the graft (day 3-5).\n\nInitial stabilization of the graft is provided by a fibrin network between the recipient site and graft. All three phases are necessary for successful graft survival. Disruption at any phase (e.g., hematoma, infection, shearing) can lead to graft failure."
    difficulty: easy
    tags: [plastic surgery, skin graft, wound healing]
  - front: "What are the requirements for skin graft survival?"
    back: "1. Well-vascularized recipient bed (not heavily irradiated or infected). 2. Good contact between graft and recipient bed (prevent hematoma/seroma with staples, sutures, splinting, pressure dressings). 3. Low bacterial count at recipient site (<10^5/cm³).\n\nCommon causes of graft loss are hematoma/seroma, infection, mechanical forces (shearing, pressure), and radiotherapy. Coagulation begins as soon as the graft is placed; therefore, controlling bleeding before graft placement is essential."
    difficulty: medium
    tags: [plastic surgery, skin graft, wound healing]
  - front: "What are the common reasons for skin graft failure/loss?"
    back: "Hematoma/seroma (most common), infection, mechanical force (shearing/pressure), and radiotherapy.\n\nHematoma and seroma prevent direct contact between the graft and recipient bed, disrupting nutrient diffusion during the plasmatic imbibition phase. Meshed grafts reduce fluid accumulation. Infection with bacterial count >10^5/cm³ at the recipient site dramatically increases graft loss risk."
    difficulty: easy
    tags: [plastic surgery, skin graft, complications]
  - front: "Compare split-thickness vs. full-thickness skin grafts regarding survival, contraction, and aesthetic outcome."
    back: "Split-thickness: more reliable survival, greater secondary contraction, poor aesthetic, can cover larger areas. Full-thickness: lower survival rate (thicker, slower revascularization), greater primary contraction but less secondary contraction, better aesthetic and colour match.\n\nPrimary contraction = immediate size reduction upon harvesting; secondary contraction = reduction after placement and healing. Full-thickness grafts contain all of dermis which resists secondary contracture — preferred for face, hands, and sites where contraction is undesirable. STSG donor sites heal by re-epithelialization via dermal appendages; FTSG donor sites require primary closure."
    difficulty: medium
    tags: [plastic surgery, skin graft, surgical technique]
  - front: "What are the advantages and disadvantages of meshed split-thickness grafts?"
    back: "Advantages: prevents fluid accumulation (hematoma/seroma), covers a larger area, best for contaminated recipient sites. Disadvantages: poor cosmesis ('alligator hide' appearance), greater secondary contraction than full-thickness grafts.\n\nSplit-thickness grafts can be passed through a mesher at various expansion ratios after harvest. Meshing increases the surface area covered and allows fluid egress through the interstices, which is especially important in contaminated or exudative wounds."
    difficulty: medium
    tags: [plastic surgery, skin graft, meshed graft]
  - front: "Classify skin grafts by species origin."
    back: "Autograft: from the same individual. Allograft (homograft): from the same species, different individual. Xenograft (heterograft): from a different species (e.g., porcine).\n\nAutografts are the gold standard as they avoid rejection. Allografts and xenografts are temporary biological dressings used when autograft tissue is insufficient (e.g., large burns) — they will eventually be rejected. Common xenograft source is porcine skin."
    difficulty: easy
    tags: [plastic surgery, skin graft, immunology]
  - front: "What is the preferred donor nerve for nerve grafts used as conduits for regeneration across a nerve gap?"
    back: "Sural nerve, antebrachial cutaneous nerve, and medial brachial cutaneous nerve.\n\nNerve grafts act as conduits for axonal regeneration across gaps. The sural nerve in the leg is most commonly used due to its accessibility and expendability. Palmaris longus and plantaris tendons (present in 85% of the population) are preferred for tendon grafts."
    difficulty: medium
    tags: [plastic surgery, nerve graft, anatomy]
  - front: "What is a flap, and how does it differ from a graft?"
    back: "A flap is tissue of varying composition (skin, muscle, fascia, bone, etc.) with a known blood supply (random, pedicled, or named) that is not dependent on neovascularization from the recipient site. A graft has no inherent blood supply and depends entirely on neovascularization from the recipient bed.\n\nBecause flaps carry their own blood supply, they can be placed on poorly vascularized recipient beds where grafts would fail. Flap complications include loss due to hematoma, seroma, infection, poor flap design, extrinsic compression, vascular thrombosis, and fat necrosis."
    difficulty: easy
    tags: [plastic surgery, flaps, reconstruction]
  - front: "What is the key limitation of random pattern flaps compared to axial pattern flaps?"
    back: "Random pattern flaps receive blood supply from dermal and subdermal plexus, giving a limited length-to-width ratio to ensure adequate perfusion. Axial pattern flaps contain a well-defined artery and vein, allowing a greater length-to-width ratio (5–6:1).\n\nRandom pattern flaps include rotation, transposition, Z-plasty, and advancement (V-Y, Y-V) flaps. They rely on random subdermal vasculature, so excessive length relative to width risks distal ischemia. Axial flaps (peninsular, island, free) are more versatile due to their named vascular supply."
    difficulty: medium
    tags: [plastic surgery, flaps, reconstruction]
  - front: "What are the clinical features of arterial insufficiency vs. venous insufficiency in a free flap?"
    back: "Arterial insufficiency: pale colour, cool temperature, absent arterial Doppler pulse, decreased tissue turgor, capillary refill >5 s. Venous insufficiency: purple/blue colour, warm or cool temperature, increased turgor (tissue stiffness), capillary refill <2 s.\n\nMonitoring free flap viability requires assessment of colour, temperature, Doppler pulse, turgor, and capillary refill. Arterial insufficiency implies inadequate inflow; venous insufficiency implies inadequate outflow causing engorgement. Rapid identification and return to OR is critical for flap salvage."
    difficulty: medium
    tags: [plastic surgery, free flap, vascular complications]
  - front: "What immunosuppression regimens are used in vascularized composite allotransplantation (VCA)?"
    back: "Induction: antithymocyte globulin and basiliximab (anti-T cell antibodies). Maintenance: tacrolimus, mycophenolate mofetil, and prednisone.\n\nVCA (e.g., face, limb, penile transplants) involves transplanting composite tissue from a deceased donor. Skin is highly immunogenic containing effector T cells and antigen-presenting cells. Acute rejection affects skin first and is treated with increased oral/IV steroids, mono/polyclonal antibodies, and topical immunosuppressants."
    difficulty: medium
    tags: [plastic surgery, transplantation, immunosuppression]
  - front: "What distinguishes erysipelas from cellulitis clinically?"
    back: "Erysipelas involves the upper dermis and superficial lymphatics with sharply demarcated, raised borders. Cellulitis is a deeper non-suppurative infection of skin and subcutaneous tissues with ill-defined margins.\n\nBoth are commonly caused by GAS (and S. aureus for cellulitis). The sharply demarcated, raised erythema of erysipelas is the key distinguishing feature. Both are treated with penicillin or first-generation cephalosporins (cefazolin/cephalexin) for non-MRSA cases."
    difficulty: easy
    tags: [plastic surgery, infectious disease, skin infection]
  - front: "What is the treatment for non-purulent cellulitis vs. purulent cellulitis (with MRSA risk factors)?"
    back: "Non-purulent (mild, no systemic signs): cephalexin 500 mg PO q6h; or clindamycin 300–450 mg PO q8h for severe penicillin allergy. Purulent with MRSA risk: trimethoprim-sulfamethoxazole 160/800 mg PO BID x 5 days; or clindamycin 300–450 mg q8h as alternative.\n\nMRSA risk factors include previous MRSA colonization, history of abscess, or IV drug use. Severe cases requiring hospitalization: cefazolin (no MRSA risk) or vancomycin (MRSA risk). Outlining the erythema border helps monitor treatment response. Elevation and immobilization reduce edema."
    difficulty: medium
    tags: [plastic surgery, infectious disease, cellulitis, antibiotics]
  - front: "What are the two types of necrotizing fasciitis and their microbiology?"
    back: "Type I: polymicrobial (more common in immunocompromised patients). Type II: monomicrobial, usually GAS (more common in healthy patients).\n\nNecrotizing fasciitis is a life/limb-threatening infection of the fascial plane that spreads rapidly with secondary necrosis. Gas-producing bacteria (e.g., Clostridium) cause subcutaneous emphysema detectable as crepitus or on imaging. Type II (GAS) often presents in previously healthy individuals."
    difficulty: easy
    tags: [plastic surgery, infectious disease, necrotizing fasciitis]
  - front: "What are the hallmark early and late clinical features of necrotizing fasciitis?"
    back: "Early: disproportionate pain to clinical findings (pain beyond border of erythema), patients may appear deceptively well but have disorganized physiology on labs. Late: skin turns dusky blue/black (thrombosis/necrosis), induration, bullae formation, cutaneous gangrene, subcutaneous emphysema.\n\nThe key diagnostic clue is pain out of proportion to visible findings — a classic MCCQE1 trigger. Overlying skin findings include blistering, ecchymoses, edema, and crepitus. The LRINEC score is a clinical tool to aid diagnosis but should not delay surgical treatment if suspicion is high."
    difficulty: medium
    tags: [plastic surgery, infectious disease, necrotizing fasciitis]
  - front: "What are the diagnostic findings specific to necrotizing fasciitis on bedside biopsy?"
    back: "'Dishwater pus' (characteristic of GAS necrotizing fasciitis) or the ability to sweep a finger along the fascial plane without resistance.\n\nBedside incision with fascial biopsy and STAT Gram stain is diagnostic in equivocal cases. CT or X-ray can show gas in subcutaneous tissues, but if clinical suspicion is high, surgical treatment should NOT be delayed for imaging. Severely elevated CK indicates myonecrosis (late sign)."
    difficulty: medium
    tags: [plastic surgery, infectious disease, necrotizing fasciitis, diagnosis]
  - front: "What is the management of necrotizing fasciitis?"
    back: "1. Vigorous resuscitation (ABCs). 2. Emergent surgical debridement (all necrotic tissue removed, copious irrigation, repeat surgery in 24–48 h). 3. IV antibiotics: penicillin 4 million IU IV q4h + clindamycin 900 mg IV q6h (synergistic for GAS), or vancomycin + clindamycin. 4. Postoperative ICU admission and infectious disease consult.\n\nEmergent surgical debridement is the cornerstone of treatment and must not be delayed. The penicillin-clindamycin combination is synergistic for GAS (penicillin kills bacteria; clindamycin inhibits toxin production). Clindamycin inhibits ribosomal protein synthesis, reducing exotoxin production."
    difficulty: medium
    tags: [plastic surgery, infectious disease, necrotizing fasciitis, treatment]
  - front: "Compare venous, arterial, and diabetic lower limb ulcers by location and appearance."
    back: "Venous: medial malleolus ('gaiter' area), yellow exudates, granulation tissue, irregular margins, surrounding venous stasis discolouration. Arterial: distal locations (lower limb, feet), pale/white necrotic base with dry eschar, 'punched-out' even margins, thin/shiny/dry/hairless skin. Diabetic: pressure point distribution (metatarsal heads), necrotic base, irregular or punched-out margins, thin dry skin with hyperkeratotic border.\n\nDistinguishing ulcer types is critical for management. ABI >0.9 in venous ulcers; ABI <0.9 in arterial; ABI may be falsely elevated in diabetic ulcers due to calcified (incompressible) arteries. Venous ulcers are treated with compression (30 mmHg); arterial ulcers should not be compressed."
    difficulty: medium
    tags: [plastic surgery, vascular surgery, lower limb ulcers, wound care]
  - front: "What ABI values distinguish venous, arterial, and diabetic ulcers, and why can ABI be misleading in diabetic patients?"
    back: "Venous: ABI >0.9. Arterial: ABI <0.9. Diabetic: ABI inaccurately high due to incompressible (calcified) arteries from peripheral vascular disease; standard ABI is unreliable.\n\nABI (ankle-brachial index) is a key vascular assessment tool. In diabetes, medial arterial calcification causes vessel incompressibility, falsely elevating the ABI. Alternative tests (toe-brachial index, duplex Doppler) are needed. Compression therapy is contraindicated in arterial ulcers and must be used cautiously in diabetics."
    difficulty: medium
    tags: [plastic surgery, vascular surgery, ABI, lower limb ulcers]
  - front: "What are the four stages of pressure sore development by tissue depth (National Pressure Ulcer Advisory Panel 2014)?"
    back: "Stage I: non-blanchable erythema, skin intact. Stage II: partial-thickness skin loss. Stage III: full-thickness skin loss into subcutaneous tissue. Stage IV: full-thickness skin loss into muscle, bone, tendon, or joint. Unstageable: obscured by slough or eschar. Deep Tissue Pressure Injury: non-blanchable deep red/maroon/purple discolouration.\n\nPressure ulcers occur at bony prominences due to chronic pressure reducing tissue perfusion. 95% occur on lower torso and extremities. Stages progress: hyperemia (1 hr) → ischemia (2–6 hr) → necrosis (>6 hr) → ulceration. Prevention: repositioning, pressure-relief surfaces, nutrition, managing continence."
    difficulty: easy
    tags: [plastic surgery, pressure ulcers, wound care]
  - front: "What are the four sequential events in pressure sore development (physiologic stages)?"
    back: "1. Hyperemia: disappears 1 hour after pressure removed. 2. Ischemia: follows 2–6 hours of pressure. 3. Necrosis: follows >6 hours of pressure. 4. Ulceration: necrotic area breaks down.\n\nUnderstanding the time course of pressure injury progression underlines the importance of frequent repositioning (at least every 2 hours). Once necrosis sets in, surgical debridement and reconstruction may be required. Prevention with pressure-relief surfaces (e.g., air mattresses) is key for at-risk patients."
    difficulty: easy
    tags: [plastic surgery, pressure ulcers, pathophysiology]
  - front: "What are the four main principles of pressure ulcer treatment?"
    back: "1. Preventive measures (pressure relief, assessing pressure points, continence management, nutrition). 2. Treatment of underlying medical issues. 3. Moisture reduction. 4. Wound bed preparation and treatment.\n\nTreatment is individualized. Systemic antibiotics are used for infections; reconstruction is considered for non-healing ulcers. Complications include cellulitis, osteomyelitis, sepsis, and gangrene. Nutritional supplementation (protein-rich, with arginine, zinc, antioxidants) improves wound healing (Ann Intern Med 2015)."
    difficulty: easy
    tags: [plastic surgery, pressure ulcers, wound care, treatment]
  - front: "What are the most common etiologies of burn injuries in children vs. adults?"
    back: "Children: scald burns (most common). Adults: flame burns (most common).\n\nBurn injury causes include thermal (flame, scald), chemical, radiation (UV, medical/therapeutic), and electrical. Each etiology requires a distinct management approach. Chemical and electrical burns often have greater internal injury than surface appearance suggests."
    difficulty: easy
    tags: [plastic surgery, burns, epidemiology]
  - front: "What are the three zones of thermal injury in burn wounds?"
    back: "Zone of coagulation (centre): nonviable necrotic tissue — requires excision and grafting. Zone of stasis (middle): decreased perfusion, potentially viable, cellular death in 24–48 h without treatment — aggressive resuscitation to improve perfusion. Zone of hyperemia (outermost): marked inflammation, fully viable — aggressive resuscitation.\n\nThe zone of stasis is the most clinically important — appropriate early intervention can prevent transformation to necrosis. The zones correspond to the histological pattern seen in burn wounds and guide management priorities."
    difficulty: medium
    tags: [plastic surgery, burns, pathophysiology]
  - front: "How is burn size estimated using the Rule of 9s in adults, and what tool is used for children <10 years?"
    back: "Adults: Rule of 9s — each major body region = 9% TBSA (head/neck 9%, each arm 9%, each leg 18%, anterior trunk 18%, posterior trunk 18%, perineum 1%). Children <10 years: Lund-Browder chart (accounts for age-related differences in body proportions, especially head and thighs). Patchy burns: patient's palm (fingers adducted) ≈ 1% TBSA.\n\nThe Rule of 9s is used for superficial/deep-partial and full-thickness burns only — superficial (first-degree) burns are excluded. The Lund-Browder chart is more accurate in children because the head represents a larger proportion of TBSA and the legs a smaller proportion compared to adults."
    difficulty: easy
    tags: [plastic surgery, burns, TBSA, assessment]
  - front: "Classify burn depth using both traditional and current nomenclature with key clinical features."
    back: "Erythema/superficial (1st degree): epidermis only — painful, blanchable, no blisters. Superficial-partial thickness (2nd degree): into papillary dermis — painful, blisters with clear fluid, blanchable, hair follicles present. Deep-partial thickness (2nd degree): into reticular dermis — minimal pain, mottled, less blanchable, some hair follicles. Full/4th degree (3rd/4th degree): through epidermis and dermis into underlying structures — insensate, hard leathery black/grey/white/cherry-red eschar, thrombosed veins.\n\nBurn depth determines management and need for grafting. Deep-partial thickness burns are difficult to distinguish from full-thickness initially. Insensate burns (nerve endings destroyed) and hair that does not stay attached indicate full-thickness injury. Only partial/full-thickness burns count toward TBSA for the Rule of 9s."
    difficulty: medium
    tags: [plastic surgery, burns, classification, assessment]
  - front: "What are the American Burn Association criteria for referral to a burn centre?"
    back: "1. Partial or full-thickness burns involving hands, feet, genitalia, face, eyes, ears, major joints, or perineum. 2. Electrical burns (including lightning) and chemical burns. 3. Inhalation injury. 4. Burns with comorbidities that complicate management. 5. Simultaneous trauma and burns (stabilize trauma first, then triage to burn centre). 6. Patients requiring special emotional/social/rehabilitation intervention. 7. Children with burns where hospital lacks pediatric care specialists. 8. Partial-thickness burns >10% TBSA.\n\nInhalation injury significantly increases mortality and can lead to ARDS; it also causes underestimation of fluid requirements. Electrical burns carry risk of internal injury underestimated by TBSA alone — including cardiac arrhythmias, rhabdomyolysis, and compartment syndrome."
    difficulty: easy
    tags: [plastic surgery, burns, triage, burn centre]
  - front: "What prognostic factors predict mortality in burn injuries?"
    back: "Burn size (% TBSA), age of patient (higher risk if <3 years or >60 years), and presence or absence of inhalation injury.\n\nThe combination of large TBSA, extremes of age, and inhalation injury dramatically increases mortality. Inhalation injury can cause underestimation of fluid requirements and lead to ARDS. Circumferential burns require escharotomy to prevent respiratory compromise (chest) or vascular compromise (extremities)."
    difficulty: easy
    tags: [plastic surgery, burns, prognosis]
  - front: "Why might a Z-plasty be performed, and what is it?"
    back: "Z-plasty involves designing two triangular flaps around a scar to: (1) reorient the scar, (2) lengthen the line of a scar, or (3) break up a scar. It is a type of random pattern transposition flap.\n\nZ-plasty is particularly useful for releasing contractures (e.g., post-burn scar contractures) and reorienting scars from tension lines to lines of minimal tension (Langer's lines). The classic 60-degree Z-plasty achieves approximately 75% theoretical lengthening of the central limb."
    difficulty: medium
    tags: [plastic surgery, flaps, scar revision, Z-plasty]
  - front: "What is a free flap and how is it distinguished from a pedicle flap?"
    back: "A free flap is tissue with a named blood supply (artery and vein) that is completely harvested (blood supply divided), then transplanted to a recipient site where microsurgical anastomosis reconnects vessels. A pedicle flap remains connected to the donor site via its original vascular pedicle.\n\nFree flaps allow reconstruction of distant defects where local tissue is unavailable. Common free flaps include radial forearm, scapular, and latissimus dorsi flaps. Types of tissue transferred include muscle, skin, bone, jejunum, omentum, fascia, or combinations sharing a common blood supply."
    difficulty: easy
    tags: [plastic surgery, free flap, microsurgery, reconstruction]
  - front: "What is the treatment priority when a patient presents with both trauma and burns?"
    back: "Stabilize for trauma first, then triage appropriately to a burn centre.\n\nThis is an American Burn Association guideline. Traumatic injuries (e.g., hemorrhage, pneumothorax) can be immediately life-threatening and take precedence over burn management. Once stabilized, patients are transferred to a burn centre for comprehensive burn care."
    difficulty: easy
    tags: [plastic surgery, burns, trauma, triage]
  - front: "What is the LRINEC score used for?"
    back: "The Laboratory Risk Indicator for Necrotizing Fasciitis (LRINEC) score is a clinical tool used to aid in the diagnosis of necrotizing fasciitis. However, it should NOT delay surgical treatment if clinical suspicion is high.\n\nLRINEC uses laboratory parameters (CRP, WBC, hemoglobin, sodium, creatinine, glucose) to estimate the probability of necrotizing fasciitis. A score ≥6 suggests moderate risk; ≥8 suggests high risk. It is an adjunct — the diagnosis is primarily clinical and treatment (emergent debridement) must not wait for imaging or score results."
    difficulty: medium
    tags: [plastic surgery, infectious disease, necrotizing fasciitis, diagnosis]
  - front: "What is the significance of severely elevated creatine kinase (CK) in necrotizing fasciitis?"
    back: "Severely elevated CK indicates myonecrosis, which is a late sign of necrotizing fasciitis.\n\nWhile elevated CK can support the diagnosis of necrotizing fasciitis with myonecrosis, it represents deep tissue destruction and is a late finding. It should not be waited for before initiating emergent surgical debridement. CT scan may also show gas tracking along fascial planes and myonecrosis."
    difficulty: medium
    tags: [plastic surgery, infectious disease, necrotizing fasciitis, laboratory]
  - front: "What are the risk factors for necrotizing fasciitis?"
    back: "Immunocompromised state, diabetes mellitus, obesity, IV drug use, age >50 years, peripheral vascular disease, and malnutrition.\n\nType I (polymicrobial) necrotizing fasciitis is more common in immunocompromised patients. Type II (GAS monomicrobial) can affect otherwise healthy individuals. Risk factors impair host defenses and tissue perfusion, allowing rapid bacterial spread along fascial planes."
    difficulty: easy
    tags: [plastic surgery, infectious disease, necrotizing fasciitis, risk factors]
  - front: "Which burn patients should receive inhalation injury assessment, and what are its clinical implications?"
    back: "Any burn patient should be assessed for inhalation injury, especially those with facial burns, singed eyebrows/nasal hairs, carbonaceous sputum, and hoarseness. Inhalation injury: severely compromises the respiratory system, causes underestimation of fluid requirements, and significantly increases mortality (risk of ARDS).\n\nInhalation injury is one of the three key prognostic factors for burn mortality (along with burn size and age). It requires early airway management (consider early intubation before edema develops). Circumferential burns of the chest may require escharotomy to allow respiratory excursion."
    difficulty: medium
    tags: [plastic surgery, burns, inhalation injury, airway management]
  - front: "What is the donor site preference for full-thickness skin grafts on the face?"
    back: "Grafts taken from 'blush zones' — harvest sites above the clavicle where colour match is optimized. Pre/post-auricular skin or neck skin are preferred for facial full-thickness grafts.\n\nColour match is critical for aesthetic outcomes on the face. The 'blush zones' above the clavicle have similar pigmentation, thickness, and texture to facial skin. Partial-thickness grafts are typically harvested from inconspicuous areas (buttocks, lateral thighs) where cosmesis of the donor site is less important."
    difficulty: easy
    tags: [plastic surgery, skin graft, aesthetics, facial reconstruction]
  - front: "What is ascending lymphangitis and which organism most commonly causes it in the setting of cellulitis?"
    back: "Ascending lymphangitis is visible red streaking in skin proximal to an area of cellulitis, indicating spread of infection through lymphatic vessels. It is most commonly associated with Group A Streptococcus (GAS).\n\nAscending lymphangitis is a complication of cellulitis indicating lymphatic involvement and systemic spread risk. The characteristic linear erythematous streaks tracking proximally toward regional lymph nodes represent bacterial spread through lymphatic channels. Systemic features (fever, bacteremia, sepsis) may develop."
    difficulty: easy
    tags: [plastic surgery, infectious disease, cellulitis, lymphangitis]
  - front: "What are the consequences of burn injury to skin function, and what interventions are required?"
    back: "Thermoregulation → prone to heat loss → keep patient covered and warm. Control of fluid loss → large amounts of water and protein lost → adequate fluid resuscitation imperative. Mechanical barrier/immunological organ → high infection risk → antimicrobial dressings, systemic antibiotics if signs of infection, tetanus prophylaxis.\n\nBurns destroy the skin's three major functions: thermoregulation, fluid homeostasis, and immune barrier. Large burns require Parkland formula or similar resuscitation protocols. Infection is a leading cause of death after the initial resuscitation phase. Tetanus prophylaxis per Canadian immunization guidelines is standard."
    difficulty: easy
    tags: [plastic surgery, burns, pathophysiology, management]
  - front: "What imaging is used for closed brachial plexus injuries when avulsion is suspected?"
    back: "CT myelogram or MRI initially; EMG/NCS at 12 weeks post-injury to assess healing progress.\n\nCT myelogram and MRI are the preferred initial modalities for detecting nerve root avulsion in closed brachial plexus injuries. EMG/NCS is deferred to 12 weeks to allow for Wallerian degeneration to be detectable and to assess for recovery or ongoing denervation."
    difficulty: easy
    tags: [brachial plexus, nerve injury, imaging, plastic surgery]
  - front: "When should open brachial plexus injuries be explored surgically?"
    back: "Within a few days post-injury (once patient is stable) — sharp or vascular injuries require immediate OR exploration.\n\nOpen injuries involving sharp or vascular mechanisms are explored immediately in the OR, as primary nerve repair yields the best outcomes. Patient hemodynamic stability must be confirmed first."
    difficulty: easy
    tags: [brachial plexus, nerve injury, surgery, plastic surgery]
  - front: "What is the management of obstetric brachial plexus palsy if no significant improvement by age 6 months?"
    back: "Surgery (nerve reconstruction/transfer) is indicated if no significant improvement and/or residual paresis remains at age 6 months.\n\nThe first 3–6 months post-birth are observed for spontaneous recovery. If neurological improvement is inadequate at 6 months, surgical intervention (nerve grafting, transfers) is recommended to maximize motor recovery before critical windows of muscle reinnervation close."
    difficulty: medium
    tags: [brachial plexus, obstetric palsy, pediatrics, plastic surgery]
  - front: "What are the three types of donor nerves used in nerve transfer surgery for brachial plexus injuries?"
    back: "1. Intraplexal (e.g., ulnar or median nerve fascicles); 2. Extraplexal (e.g., contralateral C7 nerve root, intercostal nerve); 3. Distal (e.g., radial nerve branches).\n\nNerve transfers redirect an expendable donor nerve to reinnervate a denervated target. Intraplexal donors are within the brachial plexus; extraplexal donors come from outside it (useful in root avulsions); distal donors provide direct local neurotization of effector muscles."
    difficulty: medium
    tags: [nerve transfer, brachial plexus, plastic surgery]
  - front: "What are the key physical exam findings for craniofacial injuries?"
    back: "Facial asymmetry, lacerations, bruising, crepitus/step deformities on palpation; focused exams of eyes (EOM, RAPD, enophthalmos), nose (septal hematoma), ears (Battle's sign, hemotympanum), oral cavity (malocclusion), and cranial nerve assessment (CN V1/V2/V3, CN VII).\n\nA systematic approach to craniofacial trauma includes observation for asymmetry, palpation along all bony prominences (supraorbital rim, zygomaticofrontal suture, infraorbital rim, nasal bones, mandible), and focused exams to identify orbital entrapment, CSF leaks, and nerve injuries."
    difficulty: easy
    tags: [craniofacial, trauma, physical exam, plastic surgery]
  - front: "What are the classic signs of a basal skull fracture?"
    back: "Battle's sign (bruised mastoid process), hemotympanum, raccoon eyes (periorbital bruising), and CSF otorrhea or rhinorrhea.\n\nThese signs result from hemorrhage tracking into specific fascial planes after basilar skull fracture. Battle's sign appears 1–3 days post-injury. CSF leak suggests dural laceration and warrants neurosurgery consultation. These signs guide initial trauma assessment."
    difficulty: easy
    tags: [basal skull fracture, trauma, craniofacial, emergency medicine]
  - front: "What is the gold standard investigation for facial fractures?"
    back: "CT facial bones (gold standard) — axial/coronal/sagittal views with 1.5 mm slices; indicated for significant head trauma, suspected facial fractures, and preoperative assessment.\n\nCT of the facial bones provides superior detail of the upper, middle, and lower face compared to plain films or CT head (which has wider slices and misses the lower midface and mandible). Fine cuts are required to detect orbital floor and naso-orbital-ethmoid fractures."
    difficulty: easy
    tags: [facial fracture, imaging, CT scan, plastic surgery]
  - front: "What imaging is indicated for an isolated mandible fracture when the patient can sit upright?"
    back: "Panorex radiograph (shows entire upper and lower jaw); if high clinical suspicion with negative panorex, CT should be done.\n\nPanorex (orthopantomogram) is an efficient screening tool for mandibular fractures when the patient is cooperative. CT is more sensitive and should be used if panorex is negative but clinical suspicion remains high."
    difficulty: easy
    tags: [mandible fracture, imaging, panorex, plastic surgery]
  - front: "What are the treatment goals for facial fractures?"
    back: "Re-establish normal occlusion; re-establish normal eye function (EOM and visual acuity); re-establish facial height and width; consult dentistry, ophthalmology, or neurosurgery as indicated.\n\nManagement of facial fractures focuses on functional restoration (airway, vision, bite) and cosmesis. Surgery can often be delayed 3–5 days for swelling to improve, unless there is orbital entrapment or airway compromise requiring urgent intervention."
    difficulty: easy
    tags: [facial fracture, treatment, plastic surgery]
  - front: "What is the most common site of mandibular fracture?"
    back: "Condyle (condylar region) — the most common mandibular fracture type.\n\nBecause the mandible is a ring structure, forces commonly cause fractures at two points: at the site of impact and at areas of bony weakness. The condylar neck and angle of the mandible are classic weak points. Condylar fractures are the most common type overall."
    difficulty: easy
    tags: [mandible fracture, anatomy, plastic surgery]
  - front: "What clinical features suggest a mandibular fracture?"
    back: "Pain, swelling, trismus (difficulty opening mouth), malocclusion, asymmetry of dental arch, damaged/loose/lost teeth, palpable step along mandible, CN V3 numbness, intra-oral lacerations or sublingual hematoma, chin deviating toward the side of a fractured condyle.\n\nMalocclusion is a key clinical sign of mandibular fracture. CN V3 (inferior alveolar nerve) numbness indicates involvement of the body or parasymphyseal region. Chin deviation toward the fractured condyle occurs due to unopposed pull of pterygoid muscles."
    difficulty: easy
    tags: [mandible fracture, clinical features, plastic surgery]
  - front: "When is a mandibular fracture classified as 'open'?"
    back: "When the fracture is associated with an intraoral laceration or involves the tooth root (communicates with the oral cavity).\n\nOpen mandibular fractures require antibiotic coverage because of contamination from oral flora. Prophylactic antibiotics should be given from initial presentation until at least 3 doses postoperatively."
    difficulty: easy
    tags: [mandible fracture, classification, plastic surgery]
  - front: "What is the treatment of mandibular fractures?"
    back: "Arch bars with intermaxillary fixation (elastics or wires) or ORIF; non-operative management for minimal displacement, no malocclusion, and stable fracture pattern. Intracapsular condyle fractures commonly treated non-operatively with early protected movement to prevent TMJ adhesions. Antibiotics indicated for open fractures.\n\nIdeally managed within 48 hours. Condylar fractures are often treated conservatively since surgical access is challenging and early mobilization prevents ankylosis. ORIF is required for displaced, unstable, or complex fractures."
    difficulty: medium
    tags: [mandible fracture, treatment, ORIF, plastic surgery]
  - front: "What are the Le Fort fracture classifications and their defining features?"
    back: "Le Fort I (Guérin/horizontal): separates lower maxilla/dentition from midface — involves piriform aperture, maxillary sinus, pterygoid plates. Le Fort II (pyramidal): separates maxilla and central midface from upper face — involves nasal bones, medial orbital wall, pterygoid plates. Le Fort III (craniofacial disjunction/transverse): entire midfacial skeleton detached from cranial base — involves nasofrontal suture, zygomaticofrontal suture, pterygoid plates, zygomatic arch.\n\nLe Fort fractures share pterygoid plate involvement in all three types. The key differentiator is the level of separation. Le Fort III is the most severe and is associated with significant energy transfer, carrying risk of Superior Orbital Fissure Syndrome."
    difficulty: medium
    tags: [Le Fort fracture, maxillary fracture, classification, plastic surgery]
  - front: "What is the most common facial fracture?"
    back: "Nasal fracture — the most common facial fracture overall.\n\nLateral force is the more common mechanism. Anterior force can produce more serious injuries including naso-orbital-ethmoid (NOE) fractures. The nose's prominent position makes it the most frequently fractured facial bone."
    difficulty: easy
    tags: [nasal fracture, facial fracture, plastic surgery]
  - front: "What is the most important complication to identify and treat in nasal fractures, and why?"
    back: "Septal hematoma — must always be inspected for and drained (via small incision in septal mucosa + packing) because it can cause septal necrosis and perforation if untreated.\n\nThe nasal septal cartilage is avascular and depends on the perichondrium for nutrition. A hematoma separating cartilage from perichondrium leads to avascular necrosis, resulting in a 'saddle nose' deformity or perforation. Prompt drainage is mandatory."
    difficulty: medium
    tags: [nasal fracture, septal hematoma, complication, plastic surgery]
  - front: "What is the timing and technique for closed reduction of a nasal fracture?"
    back: "Best reduced immediately (< 6 hours) or when swelling subsides (5–7 days); closed reduction using Asch or Walsham forceps under anesthesia, followed by petroleum/non-adhesive gauze packing and nasal splint for 7 days. Rhinoplasty may be needed for residual deformity (~30%).\n\nThe window for closed reduction is either before significant swelling (< 6 hours) or after swelling resolves (5–7 days). After 7–10 days, bony healing begins to fix the fracture in place. Persistent deformity occurs in approximately 30% of cases."
    difficulty: medium
    tags: [nasal fracture, treatment, closed reduction, plastic surgery]
  - front: "What are the three pathognomonic features of zygomatic complex (ZMC) fractures?"
    back: "1. Subconjunctival hemorrhage; 2. Periorbital ecchymosis (often with orbital floor fracture); 3. CN V2 numbness (infraorbital and superior dental nerves).\n\nZygomatic fractures may also cause flattening of the malar prominence (best viewed from above), palpable step deformities at the orbital rim, trismus, ipsilateral epistaxis, and globe injury. These three findings together are pathognomonic."
    difficulty: medium
    tags: [zygomatic fracture, ZMC, clinical features, plastic surgery]
  - front: "How is a non-comminuted zygomatic arch fracture approached surgically?"
    back: "Gillies approach (via temporal incision) or Keen approach (via upper buccal sulcus incision) for disimpaction/elevation. If comminuted, coronal incision and ORIF is required.\n\nNon-comminuted zygomatic arch fractures can be elevated using minimally invasive approaches through temporal or intraoral incisions. Comminuted fractures require wider exposure via a coronal (bicoronal) incision and open fixation."
    difficulty: hard
    tags: [zygomatic fracture, surgery, plastic surgery]
  - front: "What is a blow-out fracture of the orbital floor and what are its clinical features?"
    back: "Fracture of the orbital floor with an intact orbital rim, caused by sudden increase in intraorbital pressure (e.g., baseball, fist). Features: restricted EOM, periorbital edema, subconjunctival hemorrhage, subcutaneous emphysema, diplopia, enophthalmos, hypoglobus, infraorbital nerve (CN V2) anesthesia, orbital entrapment.\n\nBlow-out fractures occur when blunt orbital trauma displaces the weakest part of the orbit (the thin orbital floor) into the maxillary sinus. The inferior rectus muscle can herniate or become entrapped, causing restricted upward gaze and vertical diplopia."
    difficulty: medium
    tags: [orbital floor fracture, blow-out fracture, ophthalmology, plastic surgery]
  - front: "What is orbital entrapment and why is it a surgical emergency?"
    back: "Orbital entrapment is entrapment of the inferior rectus muscle (or orbital fat) in the orbital floor fracture. It presents with diplopia with straight gaze (unable to look up past neutral), severely limited EOM, and severe pain or nausea/vomiting with upward globe movement. It is a surgical emergency because it can cause ischemia of the entrapped muscle.\n\nThe oculocardiac reflex (bradycardia with nausea/vomiting upon globe manipulation) is particularly prominent in children with 'white-eyed blow-out fractures' where the elastic bone traps tissue without obvious fracture displacement. Prompt surgical release is required to prevent muscle ischemia and permanent diplopia."
    difficulty: hard
    tags: [orbital entrapment, blow-out fracture, surgical emergency, plastic surgery]
  - front: "What are the indications for surgical repair of an orbital floor fracture?"
    back: "Entrapment, enophthalmos, or persistent diplopia (> 10 days).\n\nSurgical repair involves reconstruction of the orbital floor with bone graft or alloplastic material (e.g., titanium mesh, MEDPOR®). Many patients experience diplopia for several weeks after repair even with successful treatment."
    difficulty: medium
    tags: [orbital floor fracture, surgery, indications, plastic surgery]
  - front: "What is Superior Orbital Fissure (SOF) Syndrome and which fractures cause it?"
    back: "Compression of structures traversing the SOF (CN III, IV, V1, VI; ophthalmic vein; sympathetic fibres) causing ptosis, proptosis, anesthesia in CN V1 distribution, and painful ophthalmoplegia. Seen uncommonly in Le Fort II and III fractures (1/130 incidence).\n\nThe SOF transmits multiple cranial nerves. Compression leads to complete ophthalmoplegia. Recovery time is 8–23 weeks following operative reduction. If the optic canal is also involved, it becomes Orbital Apex Syndrome with added vision loss."
    difficulty: hard
    tags: [superior orbital fissure syndrome, Le Fort fracture, cranial nerves, plastic surgery]
  - front: "How does Orbital Apex Syndrome differ from Superior Orbital Fissure Syndrome?"
    back: "Orbital Apex Syndrome includes all features of SOF Syndrome (ptosis, proptosis, CN V1 anesthesia, painful ophthalmoplegia) PLUS vision loss due to additional compression of the optic canal (CN II). Treatment: steroids or urgent decompression (posterior craniotomy).\n\nSOF syndrome spares vision; Orbital Apex Syndrome does not. The distinction is clinically important because vision loss requires urgent surgical decompression or high-dose steroids to prevent permanent blindness."
    difficulty: hard
    tags: [orbital apex syndrome, SOF syndrome, vision loss, plastic surgery]
  - front: "What is a traumatic auricular hematoma ('cauliflower ear') and how is it managed?"
    back: "Subperichondrial hematoma of the auricle from trauma. If not decompressed, inflammatory changes and avascular necrosis of avascular cartilage cause permanent deformity ('cauliflower ear'). Management: aspiration, incision & drainage, and splinting within 7 days (preferably within 72 hours).\n\nAuricular cartilage is avascular and depends on the perichondrium for nutrients. The hematoma separates cartilage from its blood supply, leading to necrosis and fibrotic 'cauliflower' deformity. Early drainage prevents this complication."
    difficulty: easy
    tags: [auricular hematoma, cauliflower ear, trauma, plastic surgery]
  - front: "What populations are at higher prevalence for auricular hematoma?"
    back: "Contact sport athletes (e.g., mixed martial arts, rugby), though not exclusive to athletes.\n\nRepeated blunt trauma to the auricle in combat sports is the classic mechanism. A single significant blow can also cause auricular hematoma in any patient."
    difficulty: easy
    tags: [auricular hematoma, sports medicine, plastic surgery]
  - front: "What is the vascular supply to the nipple-areolar complex (NAC)?"
    back: "Primarily supplied by anterior and lateral cutaneous branches of the fourth intercostal nerve and its accompanying vessels; additional innervation/supply by cutaneous branches of intercostal nerves III to VI.\n\nBreast innervation follows a dermatomal pattern from T3–T6. The NAC's primary supply from the fourth intercostal nerve is crucial in breast reduction surgery — pedicle selection is based on preserving this vascular-neural axis to the NAC."
    difficulty: medium
    tags: [breast anatomy, NAC, vascular supply, plastic surgery]
  - front: "What are the indications for breast reduction surgery?"
    back: "Symptomatic macromastia: musculoskeletal pain (upper back, neck, shoulders), chronic headache, paresthesia in upper limb, rashes/irritation under the breast, bra-strap grooves, and physical impairment.\n\nBreast reduction (reduction mammaplasty) is considered a reconstructive procedure when functional symptoms are present. In Canada, it may be covered by provincial health insurance if documented symptoms meet criteria. Aesthetic goals are secondary."
    difficulty: easy
    tags: [breast reduction, indications, plastic surgery]
  - front: "What are the key pedicle types in breast reduction surgery and their blood supply?"
    back: "Inferior pedicle: 4th–6th intercostal perforators (most common, used with inverted-T/Wise pattern); Superior pedicle: internal mammary perforator of 2nd intercostal space; Medial pedicle: internal mammary perforators from 3rd (+/- 4th) intercostal space; Superomedial pedicle: descending artery from 2nd intercostal space extending superolaterally.\n\nPedicle selection determines NAC viability and nipple sensation preservation. The inferior pedicle is the most versatile for small to large reductions. The superomedial pedicle is increasingly popular for superior nipple projection."
    difficulty: hard
    tags: [breast reduction, pedicle, anatomy, plastic surgery]
  - front: "What are the complications of breast reduction surgery?"
    back: "Wound infection, bleeding/hematoma, seroma, NAC vascular compromise, sensory alteration of nipple, unsatisfactory/hypertrophic/keloid scarring, wound healing complications, fat necrosis, asymmetry, altered ability to breastfeed.\n\nWound healing complications occur in 1–5% of healthy patients and are higher in patients with elevated BMI. NAC vascular compromise is the most serious complication as it can lead to nipple necrosis. Breastfeeding may be impaired depending on pedicle type."
    difficulty: medium
    tags: [breast reduction, complications, plastic surgery]
  - front: "What is mastopexy and how is ptosis graded using the Regnault scale?"
    back: "Mastopexy (breast lift): aesthetic procedure correcting breast ptosis by modifying skin/parenchyma and centralizing NAC on breast mound. Regnault grading: Grade 1 (minor) — nipple at inframammary fold; Grade 2 (moderate) — nipple below fold but above lower breast contour; Grade 3 (severe) — nipple below fold and at lower breast contour; Glandular ptosis/pseudoptosis — lower pole ptosis with NAC at or above inframammary fold.\n\nMastopexy differs from breast reduction in that the primary goal is aesthetics (reshaping), not symptom relief or volume reduction. The same incision patterns (periareolar, vertical, inverted-T) are used. Glandular/pseudoptosis is important to recognize as the NAC position alone does not indicate the degree of ptosis."
    difficulty: medium
    tags: [mastopexy, breast ptosis, Regnault scale, plastic surgery]
  - front: "What are the three common incision types for breast augmentation, and which carries increased risk of capsular contracture?"
    back: "Inframammary crease (most common), transaxillary, and periareolar. Transaxillary and periareolar incisions are associated with increased risk of capsular contracture.\n\nThe inframammary incision provides direct access and the best visibility, reducing risk of implant contamination from breast ducts (relevant to periareolar approach) or axillary flora. Capsular contracture (Baker grade III–IV) is a common long-term complication of breast augmentation."
    difficulty: medium
    tags: [breast augmentation, incision, capsular contracture, plastic surgery]
  - front: "What are the implant location options in breast augmentation and what are the advantages of the submuscular plane?"
    back: "Submuscular (deep to pectoralis major), subglandular (retroglandular, above muscle), subfascial (below pectoral fascia, above muscle). Submuscular: provides more soft tissue coverage over superior and medial aspects of the implant — especially useful in patients with thin subcutaneous/breast tissues.\n\nSubmuscular placement reduces visibility of implant edges and decreases capsular contracture rates. It is preferred for thin patients. Subglandular placement gives more natural movement but risks greater visibility and higher contracture rates."
    difficulty: medium
    tags: [breast augmentation, implant placement, plastic surgery]
  - front: "What is Breast Implant-Associated Anaplastic Large Cell Lymphoma (BIA-ALCL) and how does it present?"
    back: "BIA-ALCL is associated with textured breast implants. Incidence: 1/3565 for macro-textured, 1/16703 for micro-textured. Presents as sudden onset breast swelling +/- pain, on average 7–8 years after implant placement. Immunophenotype: CD30+, ALK-. Management: total capsulectomy, excision of associated mass, biopsy of suspicious nodes, bilateral implant removal. Favourable outcome if detected and treated early.\n\nBIA-ALCL is a T-cell lymphoma, not a breast cancer. It is found in the seroma fluid or capsule around the implant. The pathogenesis involves chronic inflammation, biofilm, or reaction to silicone particles. Health Canada issued safety notices about textured implants."
    difficulty: hard
    tags: [BIA-ALCL, breast implant, lymphoma, plastic surgery, oncology]
  - front: "What is gynecomastia and what are the main categories of causes?"
    back: "Benign enlargement of male breast glandular tissue (DDx: pseudogynecomastia = fatty tissue). Causes: 1. Idiopathic; 2. Physiologic (neonatal from maternal estrogens, pubertal, elderly from decreased testosterone/increased aromatization); 3. Pathologic (endocrinopathies, tumours, chronic disease — cirrhosis/renal, genetic — Klinefelter's); 4. Pharmacologic (estrogens, antiandrogens, spironolactone, cannabis, heroin, GnRH analogs, 5α-reductase inhibitors); 5. Massive weight gain.\n\nGynecomastia results from an imbalance between estrogen and androgen action. Key pharmacological causes to remember include spironolactone, cimetidine, digoxin, and anabolic steroids. Klinefelter syndrome (47,XXY) is the most common genetic cause. Distinguish from pseudogynecomastia (fatty tissue only) on exam."
    difficulty: medium
    tags: [gynecomastia, male breast, endocrinology, plastic surgery]
  - front: "What is the surgical management of gynecomastia?"
    back: "Surgery addresses three components: glandular tissue, fat, and skin. Usually involves combination of liposuction (for lipodystrophy) and surgical excision (for glandular tissue) through a small periareolar or remote incision. Patients with significant skin excess may require skin excision.\n\nSurgery is the accepted definitive treatment for gynecomastia. Medical management (tamoxifen, aromatase inhibitors) may help in early stages but is less effective for established fibrotic gynecomastia. Periareolar incision provides good access with a concealed scar."
    difficulty: medium
    tags: [gynecomastia, surgery, liposuction, plastic surgery]
  - front: "What are the advantages and disadvantages of immediate versus delayed breast reconstruction after mastectomy?"
    back: "Immediate: generally best aesthetic outcome, may preserve nipple (if oncologically safe), no extra skin creation needed, tissues not damaged by scarring; BUT mastectomy flap viability can impact outcomes, longer surgical time. Delayed: good if radiotherapy planned or postoperative oncologic treatment undetermined; BUT loss of skin/volume/landmarks, wound healing complications from irradiated tissue, likely requires more surgical stages.\n\nImmediate reconstruction is oncologically safe in most cases. However, post-mastectomy radiation significantly increases complication rates for implant-based reconstruction. Autologous reconstruction is more radiation-tolerant than implant-based. Timing decisions are made collaboratively with oncology."
    difficulty: medium
    tags: [breast reconstruction, mastectomy, plastic surgery, oncology]
  - front: "What are the autologous flap options for breast reconstruction?"
    back: "TRAM flap (pedicled or free — uses rectus abdominis muscle, fat, and vessels); DIEP flap (spares rectus abdominis muscle/fascia, perforator-based — theoretically preserves innervation); Latissimus dorsi flap (reliable pedicle, provides skin and muscle, good if abdominal tissue insufficient); SGAP (superior gluteal artery perforator — upper buttock, muscle-sparing); IGAP (inferior gluteal artery perforator — lower buttock); TUG (transverse upper gracilis — groin, scar hidden in groin crease); PAP (profunda artery perforator — posterior thigh, muscle-sparing).\n\nThe DIEP flap has become the gold standard autologous option as it harvests only the skin and fat without sacrificing the rectus abdominis, reducing abdominal wall morbidity compared to TRAM. Flap choice depends on patient body habitus, prior surgeries, and surgeon expertise."
    difficulty: hard
    tags: [breast reconstruction, autologous flap, DIEP, TRAM, plastic surgery]
  - front: "What are the advantages of the DIEP flap over the TRAM flap for breast reconstruction?"
    back: "DIEP spares the rectus abdominis muscle and fascia (preserving innervation and abdominal wall integrity), reducing risk of abdominal weakness and hernia. TRAM (pedicled) has higher bulge rates and higher flap necrosis rates; free TRAM requires microsurgical anastomosis but sacrifices muscle.\n\nDIEP (deep inferior epigastric perforator) flap dissects the perforating vessels through the rectus without taking the muscle. This reduces donor-site morbidity significantly. Both have an abdominal scar similar to an abdominoplasty."
    difficulty: hard
    tags: [DIEP flap, TRAM flap, breast reconstruction, plastic surgery]
  - front: "What are the disadvantages of the latissimus dorsi flap for breast reconstruction?"
    back: "Hollowness at the harvest site (back), shoulder weakness or impaired shoulder range of motion, dorsal hernia.\n\nThe latissimus dorsi flap is reliable with a well-defined pedicle (thoracodorsal artery) and provides skin and muscle for reconstruction. However, harvesting this large muscle causes donor-site morbidity. It is commonly combined with an implant for volume."
    difficulty: medium
    tags: [latissimus dorsi flap, breast reconstruction, complications, plastic surgery]
  - front: "What are the alloplastic options for breast reconstruction?"
    back: "1. Direct-to-implant (DTI) — single stage, short surgery; requires Grade 1 ptosis, small breast, and skin-sparing mastectomy. 2. Two-stage (tissue expander then implant) — less tension on mastectomy flaps, allows skin expansion; requires multiple OR procedures. Acellular dermal matrix (ADM) can be used with DTI or two-stage to provide implant coverage above the muscle.\n\nAlloplastic reconstruction avoids donor-site morbidity but is limited by mastectomy flap size and vascularity, and animation deformity when placed submuscularly. ADM (e.g., AlloDerm) is used to provide inferior implant coverage and reduce animation, enabling pre-pectoral placement."
    difficulty: medium
    tags: [breast reconstruction, implant, tissue expander, ADM, plastic surgery]
  - front: "What is nipple areolar complex (NAC) reconstruction and when is it performed?"
    back: "NAC reconstruction is the final step in breast reconstruction, performed when the patient is satisfied with the breast mound. It can be performed under local anesthetic (many patients have decreased sensation). Options include: flap (Skate flap, C-V flap), nipple graft from contralateral nipple or labia minora, and 3-D tattoo for the areola.\n\nNipple reconstruction is done last to allow the breast mound to settle and projection to stabilize. Areolar reconstruction uses tattooing (done 3–4 months after nipple reconstruction) or skin grafting (inner thigh or opposite areola). Tattoo provides colour-matching with minimal morbidity but may need touch-ups."
    difficulty: medium
    tags: [nipple reconstruction, NAC, breast reconstruction, plastic surgery]
  - front: "What are the types of nipple reconstruction techniques?"
    back: "1. Skate flap: pedicle elevated above breast mound, lateral aspects wrapped around central flap; donor site mainly closed by skin graft — low complication rate but loses projection over time. 2. C-V flap: uses C flap and two V flaps; no grafts required, nipple size limited by flap dimensions, may lose projection. 3. Nipple graft: tissue from contralateral nipple (nipple share — good if projection > 1 cm) or labia minora; risk of necrosis, donor-site morbidity, decreased contralateral nipple sensation.\n\nLoss of nipple projection over time is a universal challenge across all techniques. Nipple graft from the contralateral nipple (nipple sharing) is an excellent option when the patient has projection > 1 cm on the natural side. All techniques may require subsequent tattooing to create the areola."
    difficulty: hard
    tags: [nipple reconstruction, skate flap, C-V flap, plastic surgery]
  - front: "A patient sustains a blow to the right orbit from a baseball. He presents with vertical diplopia, nausea/vomiting on upward gaze, and inability to look up past neutral. CT shows a right orbital floor fracture with rounding of the inferior rectus muscle. What is the diagnosis and management?"
    back: "Orbital entrapment (entrapped inferior rectus muscle in blow-out fracture) — a surgical emergency requiring urgent operative release of the entrapment.\n\nThe oculocardiac reflex (nausea/vomiting with restricted upward gaze) combined with CT findings of inferior rectus rounding confirms orbital entrapment. Delay in surgical release can lead to permanent ischemic damage to the inferior rectus. Forced duction test under anesthesia confirms diagnosis intraoperatively."
    difficulty: hard
    tags: [orbital entrapment, blow-out fracture, surgical emergency, plastic surgery]
  - front: "A 45-year-old woman presents with sudden breast swelling 8 years after textured implant placement. Fluid aspiration reveals CD30+, ALK- lymphocytes. What is the diagnosis and management?"
    back: "Breast implant-associated anaplastic large cell lymphoma (BIA-ALCL). Management: total capsulectomy, excision of any associated mass, biopsy of suspicious lymph nodes, bilateral implant removal. Consult surgical oncologist if preoperative tumor mass present. Favourable prognosis if detected and treated early.\n\nBIA-ALCL presents late (average 7–8 years post-implantation) with seroma fluid around the implant. CD30+ ALK- immunophenotype distinguishes it from systemic ALK+ ALCL. It is not a breast cancer and has an excellent prognosis with complete surgical excision when confined to the capsule."
    difficulty: hard
    tags: [BIA-ALCL, breast implant, lymphoma, plastic surgery]
  - front: "A rugby player presents with painless bluish swelling of the upper pinna 3 days after a match. What is the diagnosis and management?"
    back: "Auricular hematoma. Management: aspiration and/or incision & drainage + splinting within 7 days (preferably within first 72 hours) to prevent 'cauliflower ear' (avascular necrosis of auricular cartilage).\n\nAuricular cartilage is avascular and depends on the perichondrium. Hematoma disrupts this supply, leading to inflammatory-mediated necrosis and fibrotic 'cauliflower' deformity. Splinting after drainage prevents re-accumulation of blood."
    difficulty: easy
    tags: [auricular hematoma, cauliflower ear, sports medicine, plastic surgery]
  - front: "Which buttress structures are involved in all three Le Fort fracture types?"
    back: "The pterygoid plates are involved in all three Le Fort fracture types (I, II, and III).\n\nThe pterygoid plates of the sphenoid bone are a consistent landmark in Le Fort classification. This is because all three Le Fort fracture planes pass through or involve the pterygomaxillary junction. This is a high-yield MCCQE1 fact."
    difficulty: medium
    tags: [Le Fort fracture, pterygoid plates, anatomy, plastic surgery]
  - front: "What is the TUG (transverse upper gracilis) flap donor site for breast reconstruction?"
    back: "The TUG flap uses the upper inner thigh/groin area. Advantages: scar hidden within the groin crease, the gracilis muscle is not critical for leg strength, good option if abdominal and buttock tissue is insufficient. Disadvantages: not amenable to large breast reconstruction, short pedicle length, potential damage to lymphatic drainage of the leg.\n\nThe TUG flap harvests skin, fat, and the gracilis muscle from the medial thigh. It is a perforator-based flap option for patients who lack sufficient abdominal donor tissue. The short pedicle requires careful microsurgical technique."
    difficulty: hard
    tags: [TUG flap, breast reconstruction, microsurgery, plastic surgery]
  - front: "What is the mechanism of action of botulinum toxin (Botox) used in aesthetic procedures?"
    back: "Derived from Clostridium botulinum neurotoxins; inhibits neurotransmission between peripheral nerve endings and muscle fibres to weaken or paralyze skeletal muscle.\n\nBotulinum toxin blocks the release of acetylcholine at the neuromuscular junction by cleaving SNARE proteins. Clinically used for anti-aging and facial rejuvenation. Effects are temporary (3-6 months), requiring repeat injections."
    difficulty: easy
    tags: [plastic surgery, aesthetic procedures, botulinum toxin, neuromodulators]
  - front: "What are the most common injectable filler substances used in aesthetic medicine?"
    back: "Hyaluronic acid and fat (autologous) are the most common substances used for injectable fillers. Other options include collagen and calcium hydroxyapatite.\n\nHyaluronic acid fillers (e.g., Juvederm, Restylane) are reversible with hyaluronidase, making them safer. Fat grafting is permanent but approximately 100% of injected volume is NOT maintained long-term due to resorption. These fillers augment facial volume, contour, and lips."
    difficulty: easy
    tags: [plastic surgery, aesthetic procedures, injectable fillers, hyaluronic acid]
  - front: "What is abdominoplasty and what does it correct?"
    back: "Abdominoplasty ('tummy tuck') involves removal of excess skin AND repair of rectus muscle laxity (rectus diastasis). It is NOT a weight loss procedure.\n\nAbdominoplasty addresses both cutaneous excess and musculoaponeurotic laxity. Distinguishing it from liposuction (which only removes adipose tissue for body contouring) is a key MCCQE1 point. Rectus diastasis refers to separation of the rectus abdominis muscles along the linea alba."
    difficulty: easy
    tags: [plastic surgery, aesthetic procedures, abdominoplasty, body contouring]
  - front: "What are the pre-operative requirements for gender-affirming surgery as per the World Professional Association for Transgender Health (WPATH) Standards of Care Version 7?"
    back: "Requirements include: 1 year trial of hormone therapy, preoperative letters of evaluation, and documentation from mental health professionals. There is wide variability in specific requirements.\n\nWPATH SOC Version 7 outlines standards for transition-related care. In Canada, providers must clarify preferred gender pronouns and respect patient autonomy while ensuring informed consent. Pre-operative mental health evaluation helps ensure the patient has realistic expectations and adequate psychosocial support."
    difficulty: medium
    tags: [plastic surgery, gender-affirming surgery, transgender, WPATH]
  - front: "What is the risk of chondrolaryngoplasty (tracheal shave) in transgender women?"
    back: "Risk of long-term hoarseness due to the anatomical proximity of the recurrent laryngeal nerve to the site of surgery.\n\nChondrolaryngoplasty removes thyroid cartilage to reduce the prominence of the Adam's apple in transgender women. The recurrent laryngeal nerve runs in the tracheoesophageal groove close to the inferior thyroid. Injury can cause permanent hoarseness or voice change."
    difficulty: medium
    tags: [plastic surgery, gender-affirming surgery, chondrolaryngoplasty, transgender women]
  - front: "What is the most common technique for chest masculinization surgery in transgender men?"
    back: "Double incision free nipple graft technique is the most common. Periareolar incision technique is also used, depending on pre-operative breast size and ptosis.\n\nChest masculinization (top surgery) removes breast tissue and reshapes the chest. The choice of technique depends on breast size and ptosis: larger/more ptotic breasts require the double incision approach with free nipple grafts, which causes loss of nipple sensation. Smaller breasts may be amenable to periareolar (keyhole) approach."
    difficulty: medium
    tags: [plastic surgery, gender-affirming surgery, chest masculinization, transgender men]
  - front: "What is the risk of thyroid cartilage enhancement surgery in transgender men?"
    back: "Risk of vocal cord paralysis due to proximity of surgery to the recurrent laryngeal nerve.\n\nThyroid cartilage enhancement adds cartilage to increase thyroid cartilage prominence (Adam's apple) in transgender men. This is analogous but opposite to chondrolaryngoplasty in transgender women. Both procedures carry risk to the recurrent laryngeal nerve and should only be performed by experienced surgeons."
    difficulty: medium
    tags: [plastic surgery, gender-affirming surgery, transgender men, vocal cord]
  - front: "What is the incidence and sex distribution of cleft lip?"
    back: "1 in 1000 live births. Male:Female = 2:1. Two-thirds of cases are unilateral and left-sided. Increased incidence in Asian individuals; decreased in those of African descent.\n\nCleft lip results from failure of fusion of the maxillary and medial nasal processes. The left-sided predominance is thought to relate to developmental asymmetry. Cleft lip/palate has a multifactorial etiology including genetic and environmental factors."
    difficulty: easy
    tags: [plastic surgery, pediatric, cleft lip, craniofacial anomalies]
  - front: "At what age is surgery for cleft lip performed, and what is the surgical technique?"
    back: "Surgery at approximately 3 months of age. Techniques include Millard or Fisher repair. Additional corrective surgeries are usually required later (especially for nasal deformity).\n\nThe 'rule of 10s' is a common mnemonic for cleft lip repair timing: 10 weeks of age, 10 lbs weight, 10 g/dL hemoglobin. Millard's rotation-advancement technique is the most widely used. Early repair restores lip function and improves feeding and speech development."
    difficulty: medium
    tags: [plastic surgery, pediatric, cleft lip, surgical timing]
  - front: "What is the incidence, sex distribution, and surgical timing for isolated cleft palate repair?"
    back: "Incidence: 0.5 in 1000 (no racial variation). Female > Male. Surgery at 6-9 months using Von Langenbeck or Furlow Z-Plasty technique.\n\nCleft palate involves failure of fusion of the lateral palatine/median palatine processes and nasal septum. It presents in isolation more commonly in females. Early surgery (6-9 months) is important for speech development. ENT consult is required as recurrent otitis media is common, often needing myringotomy tubes."
    difficulty: medium
    tags: [plastic surgery, pediatric, cleft palate, craniofacial anomalies]
  - front: "A child has a parent and sibling with cleft palate. What is their risk of having cleft palate?"
    back: "17% chance of cleft if both a sibling AND parent have cleft. 4% chance if only one parent or one sibling has cleft.\n\nCleft palate has multifactorial inheritance. The recurrence risk increases with the number of affected first-degree relatives. This contrasts with isolated cleft lip which has its own separate recurrence risk. Genetic counselling is recommended for families with an affected member."
    difficulty: medium
    tags: [plastic surgery, pediatric, cleft palate, genetics, recurrence risk]
  - front: "What is craniosynostosis and what is the standard treatment approach?"
    back: "Premature fusion of cranial sutures. Incidence 1 in 2000 live newborns. Treatment: craniectomy involving a multidisciplinary team (neurosurgery, ENT, genetics, dentistry, pediatrics, SLP). Early surgery prevents secondary deformities.\n\nCraniosynostosis can be primary (no known cause) or secondary (associated with a known syndrome). Syndromes include Crouzon's, Apert's, Saethre-Chotzen, Carpenter's, Pfeiffer's, Jackson-Weiss, and Boston-type. The type, timing, and procedure depend on which suture(s) are involved (lambdoid, sagittal, etc.)."
    difficulty: medium
    tags: [plastic surgery, pediatric, craniosynostosis, craniofacial anomalies]
  - front: "What are the syndromes associated with craniosynostosis?"
    back: "Crouzon's, Apert's, Saethre-Chotzen, Carpenter's, Pfeiffer's, Jackson-Weiss, and Boston-type syndromes.\n\nThese syndromes represent syndromic craniosynostosis where skull suture fusion occurs as part of a broader genetic condition. Apert syndrome also includes syndactyly. Crouzon syndrome is the most common syndromic craniosynostosis with autosomal dominant inheritance and FGFR2 mutation. Genetics referral is essential for all syndromic cases."
    difficulty: medium
    tags: [plastic surgery, pediatric, craniosynostosis, syndromes]
  - front: "What is the ASSH classification system for congenital hand anomalies? List the main categories."
    back: "American Society for Surgery of the Hand classification: 1) Failure of Formation, 2) Failure of Differentiation/Separation, 3) Duplication, 4) Overgrowth, 5) Undergrowth, 6) Constriction Band Syndrome, 7) Generalized Skeletal Abnormality.\n\nThis classification system organizes congenital hand anomalies by their developmental mechanism. Knowing the category helps guide treatment approach. Failure of formation includes transverse absence (congenital amputation) and radial/ulnar deficiency. Failure of differentiation includes syndactyly and camptodactyly."
    difficulty: medium
    tags: [plastic surgery, pediatric, congenital hand, ASSH classification]
  - front: "What drug is classically associated with phocomelia (longitudinal limb absence)?"
    back: "Thalidomide. Phocomelia is a failure of formation anomaly characterized by absent humerus (proximal limb absence).\n\nThalidomide was a sedative used in the late 1950s-early 1960s for morning sickness; it caused severe limb defects including phocomelia. This historical case led to stricter drug regulatory standards in Canada (thalidomide tragedy). Treatment is with early prosthesis fitting."
    difficulty: easy
    tags: [plastic surgery, pediatric, congenital hand, phocomelia, thalidomide]
  - front: "What is radial club hand and what is the treatment approach?"
    back: "Radial deficiency causing radial deviation of the wrist and thumb hypoplasia. Treatment: physiotherapy + splinting → soft tissue release if splinting fails → distraction osteogenesis (Ilizarov) + wedge osteotomy → tendon transfer → pollicization.\n\nRadial club hand is more common than ulnar club hand and associated with syndromes including Fanconi anemia, Holt-Oram, and CHARGE. Pollicization (converting the index finger to a thumb) is the definitive treatment when the thumb is absent or non-functional. Associated with VACTERL association."
    difficulty: medium
    tags: [plastic surgery, pediatric, radial club hand, congenital hand, pollicization]
  - front: "What syndromes are associated with thumb hypoplasia, and what is the treatment principle?"
    back: "Syndromes: Fanconi anemia, Holt-Oram syndrome, and CHARGE syndrome. Treatment depends on degree: ranges from no treatment → webspace deepening → tendon transfer → pollicization of index finger (for absent/non-functional thumb).\n\nThumb hypoplasia ranges from a small thumb with all components to complete absence. Pollicization (transferring the index finger to function as a thumb) is performed when thumb reconstruction is not feasible. Fanconi anemia requires hematological evaluation before surgery."
    difficulty: medium
    tags: [plastic surgery, pediatric, thumb hypoplasia, congenital hand, Fanconi anemia]
  - front: "What is syndactyly, what syndromes are associated with it, and when is surgery performed?"
    back: "Syndactyly = failure of differentiation/separation of fingers. Incidence: 1 in 3000 live births. M:F = 2:1. Associated with Apert, Poland, and Holt-Oram syndromes. Surgery: before 6-12 months; may require skin graft.\n\nSyndactyly can be simple (skin/soft tissue only) or complex (includes bony fusion). Early surgical separation is important especially when different-length digits are fused (e.g., ring and long finger) to prevent angular deformities. Skin grafts are often needed to cover the separated digits. Apert syndrome is most commonly associated."
    difficulty: medium
    tags: [plastic surgery, pediatric, syndactyly, congenital hand, Apert syndrome]
  - front: "What is camptodactyly and what is the initial treatment?"
    back: "Congenital flexion contracture, usually at the PIP joint of the 5th digit. Initial treatment: early splinting. If unsuccessful: volar release. Arthroplasty is rarely needed.\n\nCamptodactyly (from Greek 'bent finger') is a failure of differentiation anomaly. It most commonly affects the small finger PIP joint. Early splinting aims to stretch the contracted tissues. Surgical treatment (volar release of flexor tendons and intrinsic muscles) is reserved for cases that fail conservative management."
    difficulty: medium
    tags: [plastic surgery, pediatric, camptodactyly, congenital hand, PIP joint]
  - front: "What is polydactyly and how does the racial/ethnic distribution differ by type?"
    back: "Polydactyly is congenital duplication of digits. Radial type (preaxial/thumb duplication): increased in Asian individuals and Indigenous peoples. Ulnar type (postaxial/small finger duplication): increased in individuals of African descent.\n\nPolydactyly is the most common congenital hand anomaly. Treatment is amputation of the least functional digit, usually after 1 year of age when functional status can be assessed. Radial polydactyly involves thumb duplication and requires careful surgical planning to preserve optimal thumb function."
    difficulty: medium
    tags: [plastic surgery, pediatric, polydactyly, congenital hand, duplication]
  - front: "What is amniotic band syndrome and what is the urgent treatment indication?"
    back: "Constriction band syndrome caused by amniotic (annular) bands. Urgent release is indicated for acute, progressive edema distal to the band in a newborn. Other reconstruction is case-specific.\n\nAmniotic band syndrome occurs when fibrous bands of the amnion wrap around fetal parts, causing constriction. Severity ranges from minor skin constriction to digit/limb amputation or other structural anomalies. Urgent release in newborns prevents ischemia and permanent damage from band-induced edema and vascular compromise."
    difficulty: medium
    tags: [plastic surgery, pediatric, amniotic band syndrome, constriction band, newborn]
  - front: "What is rhinoplasty and for what conditions is it indicated?"
    back: "Rhinoplasty is surgical reconstruction of the nose and nasal airway. It addresses both aesthetic concerns (nasal shape/appearance) and functional issues (nasal airway obstruction).\n\nRhinoplasty is one of the most technically challenging aesthetic procedures due to the complex three-dimensional anatomy of the nose. It can be performed for aesthetic reasons (e.g., nasal hump, tip refinement) or functional reasons (e.g., deviated septum, nasal valve collapse). It is also performed as part of facial feminization surgery in transgender women and facial masculinization in transgender men."
    difficulty: easy
    tags: [plastic surgery, aesthetic procedures, rhinoplasty, facial surgery]
  - front: "What is blepharoplasty and what does it involve?"
    back: "Blepharoplasty is a surgical procedure to shape or modify the appearance of eyelids by removing excess eyelid skin and fat pads.\n\nBlepharoplasty can be upper or lower lid. Upper lid blepharoplasty primarily addresses dermatochalasis (excess skin causing visual field obstruction) — when functionally impairing vision, it may be covered by provincial health insurance. Lower lid blepharoplasty addresses periorbital fat herniation and lower lid laxity. Key complications include lagophthalmos, ectropion, and asymmetry."
    difficulty: easy
    tags: [plastic surgery, aesthetic procedures, blepharoplasty, eyelid surgery]
  - front: "What are the post-operative considerations for breast augmentation in transgender women?"
    back: "Surveillance for implant rupture; adherence to breast cancer screening guidelines in addition to gender-specific medical maintenance.\n\nTransgender women on hormone therapy are at risk for breast cancer, though likely lower than cisgender women. Breast augmentation can use implants, fat grafting, or a combined approach. Post-operative surveillance follows standard implant monitoring protocols. Gender-affirming care guidelines in Canada emphasize inclusive and comprehensive cancer screening for transgender patients."
    difficulty: medium
    tags: [plastic surgery, gender-affirming surgery, breast augmentation, transgender women, breast cancer screening]
  - front: "What is genioplasty and what complication can alter sensation?"
    back: "Genioplasty is chin augmentation/reshaping via osteotomy or synthetic implant to improve contour. Complication: altered lip sensation and altered sensation of lower incisors (due to proximity to mental nerve).\n\nGenioplasty is performed for both aesthetic and functional purposes. In gender-affirming surgery, implant alone is usually insufficient for facial feminization — osteotomy is often required. The mental nerve (branch of the inferior alveolar nerve) runs through the mental foramen and is at risk during mandibular/chin procedures, causing numbness of the lower lip and chin."
    difficulty: medium
    tags: [plastic surgery, aesthetic procedures, genioplasty, facial surgery, nerve injury]
