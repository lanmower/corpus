# Urology Penile Cancer (Urology) - generated from srs-mccqe1
cards:
  - front: "What is the most common histological type of penile cancer, and what are its major risk factors?"
    back: "Squamous cell carcinoma (SCC) >95% of penile malignancies. Risk factors: chronic inflammatory disease, STIs, phimosis, uncircumcised penis.\n\nPenile SCC accounts for <1% of male cancers in the U.S. and <2% of all urogenital cancers. Circumcision reduces risk by eliminating phimosis and reducing chronic inflammation. Definitive diagnosis requires full-thickness biopsy."
    difficulty: easy
    tags: [urology, penile cancer, SCC, risk factors]
  - front: "What is the difference between Bowen's disease and erythroplasia of Queyrat?"
    back: "Both are penile carcinoma in situ (CIS). Bowen's disease: crusted red plaques on the penile shaft. Erythroplasia of Queyrat: velvet red, ulcerated plaques on the glans.\n\nBoth are pre-invasive squamous cell carcinoma of the penis. Treatment options for both include local excision, laser, radiation, topical 5-fluorouracil, or topical imiquimod. Distinction is primarily anatomical location."
    difficulty: medium
    tags: [urology, penile cancer, carcinoma in situ, Bowens disease, erythroplasia of Queyrat]
  - front: "What are the pre-malignant penile lesions?"
    back: "Balanitis xerotica obliterans, leukoplakia, and Buschke-Lowenstein tumour (giant condyloma acuminatum).\n\nThese lesions carry risk of malignant transformation to SCC. Buschke-Lowenstein tumour, despite being locally destructive, is histologically benign but behaves in a borderline malignant fashion."
    difficulty: medium
    tags: [urology, penile cancer, pre-malignant, leukoplakia]
