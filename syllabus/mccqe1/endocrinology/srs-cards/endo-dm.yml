    back: "First-degree relative with DM, age ≥40yr, obesity (especially abdominal), HTN, hyperlipidemia, CAD, vascular disease, prior gestational diabetes/macrosomic baby >4kg, PCOS, history of IGT or IFG, presence of DM complications, PCOS, acanthosis nigricans, psychiatric disorders, HIV, medications (glucocorticoids, atypical antipsychotics, HAART), high-risk ethnic background\n\nT2DM has multiple modifiable and non-modifiable risk factors."
    difficulty: medium
    tags: [endocrinology, diabetes, risk factors, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
