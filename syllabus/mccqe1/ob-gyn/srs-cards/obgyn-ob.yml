    back: "Acyclovir 400 mg PO TID x 7-10 days OR valacyclovir 1 g PO BID x 7-10 days\n\nFirst-episode herpes in pregnancy requires treatment to reduce viral shedding and potential transmission to newborn."
    difficulty: medium
    tags: [infectious disease, sexually transmitted infection, herpes, pregnancy, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
