# General (PublicHealth) - generated from srs-mccqe1
cards:
  - front: "What is the counseling recommendation for hearing loss prevention?"
    back: "Counsel about noise control and hearing protection programs (high quality evidence)\n\nNoise-induced hearing loss is preventable; hearing protection is crucial for occupational and recreational noise exposure."
    difficulty: easy
    tags: [hearing, prevention, public health, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What does esophageal manometry evaluate that 24h pH monitoring cannot?"
    back: "Presence of abnormalities of peristalsis and decreased LES tone\n\nManometry studies esophageal motility and can diagnose peristaltic abnormalities and LES tone, but cannot detect the presence of reflux - which requires pH monitoring."
    difficulty: medium
    tags: [manometry, pH monitoring, diagnostic tests, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "In what scenario is 24-hour pH monitoring most useful?"
    back: "When PPIs do not improve symptoms\n\n24h pH monitoring is most useful if PPIs do not improve symptoms, helping to confirm reflux as the cause."
    difficulty: easy
    tags: [GERD, diagnosis, pH monitoring, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is a standard drink equivalent?"
    back: "14g ethanol = 12oz beer (5%), 5oz wine (12-17%), 1.5oz spirits (40%)\n\nA standard drink contains approximately 14g of pure alcohol. Moderate drinking is defined as ≤1 drink/day for women, ≤2 drinks/day for men."
    difficulty: easy
    tags: [alcohol, standard drink, nutrition, public health, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
