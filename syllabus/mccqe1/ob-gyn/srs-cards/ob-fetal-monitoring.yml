# Ob Fetal Monitoring (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What are the indications for continuous electronic fetal heart rate monitoring (CTG) in labour?"
    back: "- Abnormal auscultation\n- Prolonged labour\n- Induced or augmented labour\n- Meconium present\n- Multiple gestation or fetal complication\n- Concerns about fetus tolerating labour\n\nIntermittent auscultation with Doppler is appropriate for low-risk labours (q15-30 min in active first stage, q5 min in second stage when pushing). Continuous CTG is reserved for higher-risk situations. While CTG reduces neonatal seizures by half, it is associated with higher intervention rates (increased CD and instrumental delivery) without reducing cerebral palsy or perinatal mortality."
    difficulty: easy
    tags: [obstetrics, fetal monitoring, CTG, electronic fetal monitoring, intrapartum]
  - front: "What does the baseline FHR represent and what is the normal range?"
    back: "Normal baseline FHR: 110-160 bpm. It is a parameter of fetal well-being vs. distress.\n\nBaseline FHR is the average FHR during a 10-minute segment when not in a deceleration or acceleration. Fetal tachycardia (>160 bpm) and bradycardia (<110 bpm) are abnormal. Baseline FHR reflects the balance between sympathetic and parasympathetic nervous system tone and is affected by multiple maternal, fetal, and uteroplacental factors."
    difficulty: easy
    tags: [obstetrics, fetal monitoring, baseline FHR, fetal heart rate]
  - front: "How is FHR variability classified?"
    back: "- Absent: undetectable amplitude\n- Minimal: >0 to <6 bpm\n- Moderate (normal): 6-25 bpm\n- Marked: >25 bpm\nMeasured over a 15-minute period. Normal (moderate) variability indicates acceptable fetal acid-base status.\n\nFHR variability reflects the integrity of the fetal autonomic nervous system and is the most important indicator of fetal well-being. Moderate variability indicates the fetus is not significantly acidotic. Absent or minimal variability can indicate fetal acidemia, CNS depression (narcotics, sedatives, fetal sleep), or CNS anomalies. Variability can only be assessed by CTG (not intermittent auscultation)."
    difficulty: easy
    tags: [obstetrics, fetal monitoring, FHR variability, CTG]
  - front: "What defines an FHR acceleration?"
    back: "Increase of ≥15 bpm lasting ≥15 seconds (or ≥10 bpm for ≥10 seconds if <32 weeks GA).\n\nAccelerations are reassuring signs of fetal well-being indicating intact fetal neurological response. Their presence generally excludes significant fetal acidemia. The lower threshold at <32 weeks GA accounts for the normally lower fetal heart rate reactivity in preterm fetuses."
    difficulty: easy
    tags: [obstetrics, fetal monitoring, FHR accelerations, fetal well-being]
  - front: "Compare the three types of FHR decelerations: cause, shape, and timing."
    back: "**Early decelerations:**\n- Cause: vagal response to fetal head compression\n- Shape: uniform, mirrors contraction\n- Timing: nadir at peak of contraction; returns to baseline by end of contraction\n- Significance: benign\n\n**Variable decelerations:**\n- Cause: cord compression (or forceful pushing in 2nd stage)\n- Shape: variable in shape, onset, duration\n- Timing: variable relative to contractions\n- Significance: most common type; can become severe\n\n**Late decelerations:**\n- Cause: fetal hypoxia/acidemia, uteroplacental insufficiency, maternal hypotension, uterine hypertonus\n- Shape: uniform, gradual onset and recovery after contraction peak\n- Timing: onset, nadir, and recovery AFTER peak of contraction (30s lag)\n- Significance: ominous sign of uteroplacental insufficiency\n\nDifferentiating deceleration types is critical for intrapartum management. Late decelerations are the most concerning and suggest uteroplacental insufficiency; they may also decrease variability and alter baseline FHR. Variable decelerations are the most common type and become concerning when severe (FHR drops <60 bpm for >60s, loss of variability, slow return to baseline, biphasic pattern, tachycardia/bradycardia after)."
    difficulty: medium
    tags: [obstetrics, fetal monitoring, decelerations, CTG interpretation, fetal distress]
  - front: "What are the 'Rule of 60s' features suggesting severe variable decelerations?"
    back: "- FHR drop <60 bpm for >60 seconds\n- Loss of variability or decrease in baseline after deceleration\n- Biphasic deceleration\n- Slow return to baseline\n- Baseline tachycardia or bradycardia\n- May be associated with fetal acidemia\n\nSevere variable decelerations are a warning sign of potential fetal acidemia. The Rule of 60s (drop <60 bpm below baseline OR to <60 bpm for >60s) helps identify high-risk variable decelerations. When present, resuscitative measures and potentially fetal scalp sampling or delivery should be considered."
    difficulty: medium
    tags: [obstetrics, fetal monitoring, variable decelerations, fetal acidemia, Rule of 60s]
  - front: "What are causes of fetal tachycardia vs. fetal bradycardia?"
    back: "**Fetal tachycardia (>160 bpm):**\n- Maternal: fever, hyperthyroidism, anemia, dehydration\n- Fetal: arrhythmia, anemia, infection, prolonged activity, chronic hypoxemia, congenital anomalies\n- Drugs: sympathomimetics, anesthetics\n- Uteroplacental: early hypoxia, chorioamnionitis, hypercontractility\n\n**Fetal bradycardia (<110 bpm):**\n- Maternal: hypothermia, hypotension, hypoglycemia, positioning, umbilical cord compression\n- Fetal: rapid descent, dysrhythmia, heart block, hypoxia, vagal stimulation (head compression), hypothermia, acidosis\n- Drugs: β-blockers, magnesium sulfate\n- Uteroplacental: late hypoxia (abruption, HTN), acute cord prolapse\n\nUnderstanding causes of FHR abnormalities allows targeted intervention. Maternal fever is a common cause of fetal tachycardia and may indicate chorioamnionitis. Acute cord prolapse causing fetal bradycardia is an obstetric emergency requiring immediate delivery. Fetal heart block is a fetal arrhythmia causing persistent bradycardia and may be associated with maternal anti-Ro/La antibodies (SLE/Sjogren's)."
    difficulty: medium
    tags: [obstetrics, fetal monitoring, fetal tachycardia, fetal bradycardia, FHR abnormalities]
  - front: "What are the indications and interpretation of fetal scalp blood sampling (pH and lactate)?"
    back: "**Indications:** Atypical or abnormal FHR with heavy meconium or abnormal FHR patterns (unexplained low variability, repetitive late decelerations, complex variable decelerations, fetal cardiac arrhythmias)\n\n**Prerequisites:** Adequately dilated cervix\n\n**Interpretation:**\n- pH ≥7.25, lactate <4.2 mmol/L: Normal → repeat if abnormal FHR persists\n- pH 7.21-7.24, lactate 4.2-4.8 mmol/L: Borderline → repeat in 30 min or consider delivery if rapid fall\n- pH <7.20, lactate >4.8 mmol/L: Fetal acidosis → delivery indicated\n\n**Contraindications:** Known/suspected fetal blood dyscrasia (hemophilia, VWD); active maternal infection (HIV, genital herpes, Hep B)\n\nFetal scalp blood sampling is used to confirm or exclude fetal acidemia when CTG shows abnormal patterns. pH <7.20 or lactate >4.8 mmol/L indicates significant fetal metabolic acidosis requiring prompt delivery. Lactate measurement is increasingly preferred as it requires smaller blood volumes and has better reproducibility."
    difficulty: medium
    tags: [obstetrics, fetal monitoring, fetal scalp sampling, fetal acidosis, pH, lactate]
  - front: "A patient in active labour at 6 cm develops repetitive late decelerations on CTG with baseline FHR 155 bpm and minimal variability. What is the appropriate management?"
    back: "Management of abnormal CTG (late decelerations + decreased variability — Category III/ominous):\n\n1. **Reposition patient** (left lateral decubitus — relieve aortocaval compression)\n2. **Supplemental O₂** (100% by mask if abnormal SpO₂)\n3. **IV fluids** (correct maternal hypotension)\n4. **Stop oxytocin** (if infusing)\n5. **Fetal scalp stimulation** (if accelerates → reassuring)\n6. **Consider fetal scalp electrode** for more accurate FHR tracing\n7. **Fetal scalp pH or lactate** (if available and cervix adequate)\n8. **Notify physician**\n9. **Rule out:** cord prolapse, fever, dehydration, drug effects, prematurity\n10. **If above fails → consider CD**\n\nLate decelerations with minimal variability indicate significant uteroplacental insufficiency and potential fetal acidemia. This is an ominous pattern requiring urgent intervention. The initial steps are resuscitative (repositioning, O₂, fluids, stop oxytocin). Fetal scalp pH/lactate confirms or excludes acidosis to guide delivery decision. Failure to respond to resuscitation mandates expedited delivery."
    difficulty: hard
    tags: [obstetrics, CTG, late decelerations, fetal distress, intrapartum management, fetal monitoring]
  - front: "What are the key findings of the Cochrane review on continuous CTG vs. intermittent auscultation during labour?"
    back: "**Cochrane Review (2017, 13 trials, 37,000 women):**\n\nContinuous CTG vs. intermittent auscultation:\n- **No difference** in overall perinatal death rate or cerebral palsy\n- **Reduced neonatal seizures** (approximately halved)\n- **Significantly increased** CD rate: RR 1.63, 95% CI 1.29-2.07\n- **Significantly increased** instrumental vaginal birth: RR 1.15, 95% CI 1.01-1.33\n\n**Conclusion:** CTG may reduce neonatal seizures but has NO effect on cerebral palsy rates, infant mortality, or neonatal well-being measures, while significantly increasing intervention rates.\n\nThis evidence underpins current Canadian guidelines recommending intermittent auscultation for low-risk labours. The lack of improvement in cerebral palsy or mortality despite increased interventions suggests that intrapartum CTG has limited ability to prevent chronic neurological injury (most cerebral palsy is antepartum in etiology). Continuous CTG should be reserved for high-risk situations where benefits outweigh intervention risks."
    difficulty: hard
    tags: [obstetrics, CTG, continuous monitoring, Cochrane review, evidence-based medicine, intermittent auscultation]
  - front: "What are the factors causing decreased FHR variability?"
    back: "- CNS anomalies\n- Dysrhythmia\n- Inactivity/sleep cycle (normal intermittent decrease)\n- Preterm fetus\n- Narcotics and sedatives\n- Fetal infection\n- Dehydration\n- Hypoxia\n\nFHR variability reflects the integration of multiple neurological inputs to the fetal heart via the vagus nerve. Decreased variability can be physiological (fetal sleep cycle lasting 20-40 min) or pathological (acidosis, drug effects, neurological injury). Distinguishing physiological from pathological decreased variability requires clinical context and often fetal scalp stimulation — if FHR accelerates, acidosis is excluded."
    difficulty: easy
    tags: [obstetrics, fetal monitoring, FHR variability, decreased variability]
