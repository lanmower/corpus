# Surgery (Surgery) - generated from srs-mccqe1
cards:
  - front: "What are the four classifications of surgical wound contamination and their infection rates?"
    back: "Clean (2%, e.g., hernia repair), Clean-contaminated (3-4%, e.g., cholecystectomy), Contaminated (10%, e.g., bowel obstruction with spillage), Dirty/infected (30-40%, e.g., appendiceal abscess).\n\nPreoperative antibiotics (cefazolin + metronidazole) should be given within 1 hour pre-incision for most surgeries except low-risk clean procedures. Surgical site infections typically present with fever on POD 5-8."
    difficulty: medium
    tags: [surgery, surgical site infection, wound classification]
  - front: "What is the typical timing and presentation of wound dehiscence?"
    back: "POD 1-3 or 7-10. Most common sign is serosanguinous (salmon-colored) drainage. Should normally feel a 'healing ridge' on palpation. Evisceration (burst abdomen) is a surgical emergency.\n\nRisk factors include malnutrition, immunosuppression, obesity, infection, and increased intra-abdominal pressure. DM alone is not a risk factor. Small bites suture technique is superior to large bites for preventing incisional hernia."
    difficulty: medium
    tags: [surgery, wound complications, postoperative]
  - front: "What are the mnemonic causes of postoperative fever by day?"
    back: "Wind (atelectasis POD 1), Water (UTI POD 3), Wound (SSI POD 5-8), Walking (DVT/PE POD 8-10), Wonder drugs (drug fever anytime). Streptococcus/Clostridium can cause wound infection within 24 hours.\n\nAtelectasis is the most common postoperative pulmonary complication (90%). Prevention includes incentive spirometry, deep breathing exercises, early ambulation, and adequate pain control."
    difficulty: easy
    tags: [surgery, postoperative complications, fever]
  - front: "What is the differential for an anterior mediastinal mass (4 Ts)?"
    back: "Thymoma, Thyroid enlargement (goitre), Teratoma, Tumours (lymphoma, parathyroid, angiomatous).\n\nAnterior masses are more likely malignant. Middle compartment: pericardial/bronchogenic cysts, lymphadenopathy. Posterior: neurogenic tumours, meningocele. When 50% are symptomatic, 50% are malignant. Elevated AFP/β-hCG/LDH is pathognomonic for germ cell tumour."
    difficulty: easy
    tags: [surgery, oncology, mediastinal mass]
  - front: "What is the difference between Boerhaave's syndrome and Mallory-Weiss tear?"
    back: "Boerhaave's: transmural esophageal perforation from repeated forceful vomiting (surgical emergency). Mallory-Weiss: non-transmural (partial thickness) tear at the GE junction, 90% stop spontaneously.\n\nBoerhaave's presents with chest pain, subcutaneous emphysema, and sepsis. Mallory-Weiss classically follows retching without blood, then hematemesis. Gastrografin (water-soluble) contrast study is the first investigation for suspected perforation."
    difficulty: medium
    tags: [surgery, gastroenterology, esophageal perforation]
  - front: "What is Courvoisier's sign and what does it suggest?"
    back: "Enlarged, palpable gallbladder with painless jaundice, suggesting malignant obstruction of the CBD (pancreatic or gallbladder carcinoma) rather than gallstone disease.\n\nIn gallstone disease, the gallbladder is scarred and fibrotic from chronic inflammation, so it cannot distend. Painless jaundice in the elderly should raise suspicion for pancreatic cancer. CA 19-9 is the most useful serum marker."
    difficulty: easy
    tags: [surgery, oncology, pancreatic cancer]
  - front: "What are the steps and indications for a Whipple procedure (pancreaticoduodenectomy)?"
    back: "Resection of pancreatic head, duodenum, distal CBD, gallbladder, and distal stomach. Reconstruction with pancreaticojejunostomy, hepaticojejunostomy, and gastrojejunostomy. Indicated for resectable pancreatic head cancer (<5% mortality).\n\nOnly 10-20% of pancreatic cancers are resectable. Overall 5-year survival for all pancreatic cancer is 1%; after surgical resection, it rises to 20%. Most important prognostic indicators are lymph node status, margin status, and size >3 cm."
    difficulty: hard
    tags: [surgery, oncology, pancreatic cancer]
  - front: "What vaccinations are required post-splenectomy and why?"
    back: "Pneumococcal, H. influenzae, and meningococcal vaccines, ideally 2 weeks pre- or postoperatively. Liberal penicillin use especially in children <6 years.\n\nPost-splenectomy sepsis from encapsulated organisms occurs in 4% of splenectomized patients, with highest risk in those <16 years. The most common reason for splenectomy is splenic trauma."
    difficulty: easy
    tags: [surgery, immunology, splenectomy]
  - front: "What is the Rule of 2s for Meckel's diverticulum?"
    back: "2% of population, 2:1 male to female ratio, symptomatic in 2% of cases, found within 2 feet of the ileocecal valve, 2 inches in length, 2 types of heterotopic tissue (gastric, pancreatic), often presents by age 2.\n\nMeckel's diverticulum results from failure of the vitelline duct to regress at 5-7 weeks in utero. 50% contain heterotopic tissue (commonly gastric mucosa causing ulceration and bleeding). Meckel scan uses technetium-99m to detect ectopic gastric mucosa."
    difficulty: easy
    tags: [surgery, pediatrics, Meckels diverticulum]
  - front: "What is the presentation and treatment of hypertrophic pyloric stenosis?"
    back: "Presentation: projectile non-bilious vomiting at 1-8 weeks (peak 6-8 weeks), hungry after vomiting, palpable 'olive' mass in RUQ, visible gastric waves. Labs show hypochloremic, hypokalemic metabolic alkalosis with paradoxical aciduria. Treatment: correct electrolytes first, then Ramstedt pyloromyotomy.\n\nMore common in males (M:F=4:1). U/S shows pyloric length >17mm and muscle thickness >4mm. Must correct electrolyte and acid-base abnormalities before surgery. Pyloromyotomy is curative."
    difficulty: medium
    tags: [surgery, pediatrics, pyloric stenosis]
  - front: "What is the Kehr's sign?"
    back: "Left shoulder pain due to diaphragmatic irritation from splenic rupture, which worsens with Trendelenburg position.\n\nThe spleen is the most common intra-abdominal organ injured in blunt trauma. FAST ultrasound is used in hemodynamically unstable patients. Stable patients with contained injuries can be managed non-operatively with bed rest and serial hematocrit monitoring."
    difficulty: easy
    tags: [surgery, trauma, spleen]
  - front: "What are the indications for thyroidectomy?"
    back: "Thyroid cancer or suspicious nodules, metastases to thyroid, large/symptomatic goitre (especially substernal), toxic nodules, and some patients with Graves disease not candidates for RAI.\n\nLobectomy is for low-risk differentiated thyroid cancer; total thyroidectomy for Graves, medullary cancer, and high-risk differentiated cancer. Complications: RLN palsy (hoarseness), neck hematoma, hypoparathyroidism/hypocalcemia (total only), bilateral RLN palsy (may need tracheostomy)."
    difficulty: medium
    tags: [surgery, endocrinology, thyroid]
