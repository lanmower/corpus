    back: "Cost, misleading in hemoglobinopathies, iron deficiency, hemolytic anemia, severe hepatic or renal disease, altered by ethnicity and aging, requires standardized validated assay, not for diagnostic use in children/adolescents, pregnant women (routine GDM screening), CF patients, or suspected T1DM\n\nHbA1C has limitations in certain clinical situations where alternative testing is needed."
    difficulty: medium
