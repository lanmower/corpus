    tags: [GERD, Barretts esophagus, pathophysiology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are causes of oropharyngeal (transfer) dysphagia?"
    back: "Neurological: cortical, bulbar; Muscular: dystrophy, polymyositis, myasthenia gravis; Structural: Zenker's diverticulum, thyromegaly, cervical spur"
    difficulty: medium
    tags: [dysphagia, etiology, differential diagnosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are causes of esophageal dysphagia?"
    back: "Mechanical obstruction (strictures, rings, carcinoma), neuromuscular disorders (achalasia, scleroderma, DES), and motility disorders"
    difficulty: medium
    tags: [dysphagia, etiology, differential diagnosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
