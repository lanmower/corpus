    back: "Traumatic injuries\n\nIn North America, trauma is the 4th highest cause of death overall and the leading cause in patients under 45."
    difficulty: easy
    tags: [trauma, mortality, epidemiology, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the indications for digital rectal examination in trauma?"
    back: "Suspected GI bleed and trauma with pelvic fracture or frank hematuria\n\nDRE in trauma is not routine but may be indicated for specific suspected injuries."
    difficulty: medium
    tags: [DRE, trauma, physical exam, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are contraindications to NG tube placement?"
    back: "Significant mid-face trauma, basal skull fracture\n\nNG tube placement is contraindicated in these conditions due to risk of intracranial placement."
    difficulty: medium
    tags: [NG tube, contraindications, airway, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the purpose of the 'golden hour' in trauma?"
    back: "The first hour after injury where rapid surgical intervention significantly decreases mortality\n\nTrauma care within the golden hour is associated with improved outcomes."
    difficulty: easy
    tags: [golden hour, trauma, mortality, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What spinal emergencies must be considered in a patient with back pain?"
    back: "Osteomyelitis, cauda equina syndrome, epidural abscess or hematoma, discitis, spinal fracture, malignancy\n\nThese conditions can cause permanent neurological damage if not diagnosed and treated promptly."
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Spinal Emergencies, Neurology, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "When should imaging be ordered for back pain in the emergency department?"
    back: "Imaging is reserved for patients with neurological deficits, suspected metastases, or high-risk patients (fracture, infection, cancer, or vascular cause)\n\nEarly imaging without appropriate indications leads to unnecessary radiation exposure and may delay appropriate management of less serious causes."
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Diagnostic Imaging, Guidelines, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "When should imaging be reserved for back pain patients?"
    back: "Imaging should be reserved for patients with neurological deficits, suspected metastases, or those at high-risk of fracture, infection, cancer, or vascular cause\n\nMost mechanical back pain resolves without imaging; early imaging can lead to unnecessary interventions."
    difficulty: easy
    tags: [back pain, imaging, diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the causes of seizures?"
    back: "Primary seizure disorder, structural causes (trauma, intracranial hemorrhage, infection, increased ICP), metabolic disturbances (hypo-/hyperglycemia, hypo-/hypernatremia, hypocalcemia, hypomagnesemia), toxins/drugs\n\nIdentifying the underlying cause is critical for appropriate management and prevention of recurrent seizures."
    difficulty: medium
    tags: [seizures, etiology, differential diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the spinal emergencies that must be identified in a patient with back pain?"
    back: "Osteomyelitis, cauda equina syndrome, epidural abscess or hematoma, discitis, spinal fracture, malignancy\n\nSpinal emergencies require urgent diagnosis and treatment to prevent permanent neurological damage or sepsis."
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Spinal Emergencies, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "When is imaging indicated for a patient with back pain in the emergency department?"
    back: "Imaging is reserved for patients with neurological deficits, known metastases, and those at high risk for fracture, infection, cancer, or vascular causes. Consider CT for trauma/fracture risk, urgent MRI for neurological findings, X-ray and MRI if infection or malignancy risk.\n\nRoutine imaging for acute back pain is not recommended as most cases are self-limited mechanical pain; imaging should be targeted based on clinical suspicion."
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Investigations, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the common causes of seizures in adults?"
    back: "Primary seizure disorder, structural causes (trauma, intracranial hemorrhage, infection, increased ICP), metabolic disturbances (hypo-/hyperglycemia, hypo-/hypernatremia, hypocalcemia, hypomagnesemia), toxins/drugs\n\nIdentifying the underlying cause is critical for appropriate management and prevention of recurrence."
    difficulty: medium
    tags: [Emergency Medicine, Seizures, Etiology, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the retinal findings in hypertensive emergency?"
    back: "Vision changes, hemorrhages, exudates, papilledema\n\nRetinal examination provides direct visualization of end-organ damage from hypertensive vasculopathy."
    difficulty: easy
    tags: [Hypertension, Ophthalmology, Emergency Medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "List 5 life-threatening orthopedic injuries (usually due to blood loss)"
    back: "Major pelvic fractures, Traumatic amputations, Massive long bone injuries with fat emboli syndrome\n\nThese injuries can cause massive hemorrhage and require immediate intervention to prevent mortality."
    difficulty: medium
    tags: [orthopedics, emergency-medicine, trauma, life-threatening, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "List 5 limb-threatening orthopedic injuries (usually due to interruption of blood supply)"
    back: "Fracture/dislocation of ankle (talar AVN), Crush injuries, Compartment syndrome, Vascular injury proximal to knee/elbow, Dislocations of knee/hip, Fractures above knee\n\nThese injuries compromise limb perfusion and require urgent intervention to prevent permanent disability or amputation."
    difficulty: medium
    tags: [orthopedics, emergency-medicine, trauma, limb-threatening, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the standard of care for time to surgical management of open fractures?"
    back: "Within 6 hours\n\nEarly surgical debridement and fixation of open fractures within 6 hours significantly reduces infection risk."
    difficulty: easy
    tags: [orthopedics, open-fracture, surgery, emergency-medicine, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the radiographic findings of Colles' fracture on AP film?"
    back: "Radial shortening, radial deviation, radial displacement\n\nThese findings help identify and classify distal radius fractures for appropriate management."
    difficulty: medium
    tags: [orthopedics, wrist, fracture, imaging, colles, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the radiographic findings of Colles' fracture on lateral film?"
    back: "Dorsal displacement, volar angulation\n\nLateral view confirms the characteristic dorsal displacement pattern of Colles' fractures."
    difficulty: medium
    tags: [orthopedics, wrist, fracture, imaging, colles, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What other injuries are associated with calcaneal fractures?"
    back: "Ankles, knees, hips, pelvis, lumbar spine\n\nAxial loading injuries often involve multiple levels of the skeleton and require thorough assessment."
    difficulty: medium
    tags: [orthopedics, foot, calcaneus, trauma, associated-injuries, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What should be looked for with forceful shoulder injury besides dislocation?"
    back: "Fracture\n\nForceful injuries may cause both dislocation and associated fractures requiring different management."
    difficulty: easy
    tags: [orthopedics, shoulder, dislocation, fracture, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "When should imaging be ordered for back pain?"
    back: "Reserve imaging for neurological deficits, metastases, and patients at high-risk of fracture, infection, cancer, or vascular cause\n\nEarly imaging in low-risk patients often shows irrelevant findings that may mislead diagnosis."
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Investigations, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What investigations should be considered for back pain?"
    back: "U/A, post-void residual bladder scan; consider CT if trauma or fracture risk; urgent MRI if neurological findings; consider X-ray and MRI if risk of infection or malignancy\n\nInvestigation selection should be guided by clinical findings and risk factors."
    difficulty: medium
    tags: [Emergency Medicine, Back Pain, Investigations, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are retinal complications of hypertensive emergency?"
    back: "Vision change, hemorrhage, exudates, papilledema.\n\nHypertensive retinopathy is a marker of end-organ damage."
    difficulty: medium
    tags: [hypertensive emergency, retina, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the red flag symptoms in the history that suggest serious causes of back pain?"
    back: "Fracture risk (osteoporosis, age >50, trauma), infection risk (fever, IV drug use, recent spinal intervention, immunosuppression), cancer risk, neurological deficits (saddle anesthesia, bowel/bladder dysfunction), and vascular causes (cardiac risk factors)\n\nRed flags in back pain history help identify potentially serious causes requiring urgent intervention such as fracture, infection, cauda equina syndrome, or malignancy."
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Red Flags, Clinical Presentation, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "When should imaging be ordered for a patient with back pain?"
    back: "Reserve imaging for patients with neurological deficits, known metastases, or high-risk of fracture, infection, cancer, or vascular cause\n\nRoutine imaging is not recommended for uncomplicated back pain as most cases resolve with conservative management. Imaging is indicated when red flags are present."
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Investigations, Imaging, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "List 6 causes of seizures categorized as structural, metabolic, or toxic"
    back: "Structural: trauma, intracranial hemorrhage, infection, increased ICP; Metabolic: hypo-/hyperglycemia, hypo-/hypernatremia, hypocalcemia, hypomagnesemia; Toxins/drugs\n\nIdentifying reversible causes is critical in seizure management as treating the underlying cause may prevent recurrence."
    difficulty: medium
    tags: [Neurology, Seizures, Etiology, Differential Diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the retinal findings in hypertensive emergencies?"
    back: "Retinal findings include: vision change, hemorrhage, exudates, papilledema.\n\nRetinal examination provides direct visualization of end-organ damage."
    difficulty: medium
    tags: [hypertension, emergency medicine, ophthalmology, retina, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is pituitary apoplexy?"
    back: "Acute hemorrhage or infarction of a pituitary tumor presenting with sudden headache, altered LOC, and loss of multiple pituitary hormones\n\nThis is a neurosurgical emergency that can be fatal if not recognized early; patients lose GH, LH, FSH, TSH, ACTH, and PRL."
    difficulty: medium
    tags: [pituitary, emergency, neurosurgery, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the Eight I's of hypopituitarism etiology?"
    back: "Invasive, Infarction/hemorrhage, Infiltrative/inflammatory, Infectious, Injury, Immunologic, Iatrogenic, Idiopathic\n\nThis mnemonic covers all causes of pituitary hormone deficiency including tumors, Sheehan's, sarcoidosis, trauma, autoimmune hypophysitis, and radiation."
    difficulty: medium
    tags: [pituitary, hypopituitarism, etiology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the eight etiologies of hypopituitarism (The Eight I's)?"
    back: "Invasion, Infarction/hemorrhage, Infiltrative/inflammatory, Infectious, Injury, Immunologic, Iatrogenic, Idiopathic\n\nThis mnemonic covers pituitary tumours, craniopharyngiomas, Sheehan's syndrome, pituitary apoplexy, sarcoidosis, infections, trauma, autoimmune hypophysitis, and radiation/surgery."
    difficulty: medium
    tags: [pituitary, hypopituitarism, etiology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the 'Eight I's' of hypopituitarism etiology?"
    back: "Invasive, Infarction/hemorrhage, Infiltrative/inflammatory, Infectious, Injury, Immunologic, Iatrogenic, Idiopathic"
    difficulty: medium
    tags: [hypopituitarism, etiology, endocrine, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the secondary causes of headache?"
    back: "Drug-related, infectious, vascular, endocrine, neoplastic, trauma, and other serious causes (ophthalmological, otolaryngological)\n\nSecondary headaches account for <10% of headaches but may be life-threatening."
    difficulty: easy
    tags: [headache, differential diagnosis, neurology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the categories of secondary headache etiology?"
    back: "Drug-related, infectious, vascular, endocrine, neoplastic, trauma, other (ophthalmological, otolaryngological)\n\nSystematic categorization guides investigation and identifies potentially life-threatening causes."
    difficulty: medium
    tags: [headache, etiology, secondary, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What investigations are indicated for secondary headache?"
    back: "CBC (infection), ESR/CRP (temporal arteritis), neuroimaging (CT/MRI), CSF analysis (hemorrhage/infection)\n\nTests targeted based on clinical suspicion - not all patients need all investigations."
    difficulty: medium
    tags: [headache, investigations, neuroimaging, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What are the etiologies of secondary headaches?"
    back: "Drug-related, infectious, vascular, endocrine, neoplastic, trauma, and other (ophthalmological, otolaryngological)"
    difficulty: medium
    tags: [headache, secondary, etiology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the definition of osteoporosis according to Toronto Notes 2025?"
    back: "Age-related disease characterized by decreased bone mass and increased susceptibility to fractures\n\nOsteoporosis is defined as a condition where bone mineral density is reduced, leading to increased fracture risk, commonly affecting postmenopausal women and older adults."
    difficulty: easy
    tags: [osteoporosis, definition, bone-health, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What non-modifiable risk factors for osteoporosis are listed in Toronto Notes?"
    back: "Previous fracture after age 40, parental hip fracture, age >70 years, secondary osteoporosis\n\nNon-modifiable risk factors help identify patients who need earlier and more aggressive screening and treatment."
    difficulty: easy
    tags: [osteoporosis, risk-factors, non-modifiable, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the indications for pharmacotherapy in osteoporosis based on 2023 Canadian guidelines?"
    back: "10-year fracture risk >20% OR T-score <-2.5 and age >70 years\n\nThese thresholds using FRAX with BMD or CAROC tools identify patients who benefit from pharmacologic intervention."
    difficulty: medium
    tags: [osteoporosis, treatment, guidelines, FRAX, CAROC, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "How often should BMD be reassessed if 10-year fracture risk is 10-15%?"
    back: "Reassess in 5 years\n\nThe reassessment interval depends on fracture risk category determined by FRAX or CAROC."
    difficulty: medium
    tags: [osteoporosis, BMD, follow-up, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "How often should BMD be reassessed if 10-year fracture risk is >20%?"
    back: "Reassess in 3 years\n\nHigher-risk patients require more frequent monitoring to assess treatment response."
    difficulty: medium
    tags: [osteoporosis, BMD, follow-up, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the two validated 10-year fracture risk assessment tools in Canada?"
    back: "FRAX (WHO Fracture Risk Assessment Tool) and CAROC (Canadian Association of Radiologists and Osteoporosis Canada)\n\nBoth tools integrate clinical risk factors with BMD measurements to predict 10-year fracture probability."
    difficulty: easy
    tags: [osteoporosis, fracture-risk, assessment-tools, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the indications for pharmacotherapy in osteoporosis?"
    back: "10-year fracture risk >20% OR T-score <-2.5 and age >70 years\n\nThese thresholds identify patients at highest risk who benefit most from pharmacologic intervention."
    difficulty: medium
    tags: [osteoporosis, treatment, BMD, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the occiput-to-wall distance that suggests vertebral fracture?"
    back: ">5 cm\n\nIncreased distance indicates forward head posture from thoracic kyphosis."
    difficulty: medium
    tags: [osteoporosis, vertebral-fracture, physical-exam, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the clinical presentation features of osteoporosis?"
    back: "Asymptomatic for many years; fragility or osteoporotic fractures\n\nOsteoporosis is often called a 'silent disease' until a fracture occurs, which is why screening is important in at-risk populations."
    difficulty: easy
    tags: [osteoporosis, clinical-presentation, symptoms, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What history findings indicate increased fall/fracture risk in osteoporosis assessment?"
    back: "Prior falls, fragility fractures, parental hip fractures, gait or balance issues, glucocorticoid use, smoking, alcohol intake (>3 units/d), RA\n\nThese risk factors help identify patients who need BMD testing and intervention to prevent fractures."
    difficulty: easy
    tags: [osteoporosis, risk-factors, history, falls, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the FRAX and CAROC tools used for in osteoporosis management?"
    back: "WHO Fracture Risk Assessment Tool (FRAX) and Canadian Association of Radiologists and Osteoporosis Canada (CAROC) are used to calculate 10-year fracture risk with or without BMD\n\nThese validated tools help guide treatment decisions by quantifying fracture probability over 10 years."
    difficulty: easy
    tags: [osteoporosis, FRAX, CAROC, risk-assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "At what prospective height loss should vertebral fracture be suspected?"
    back: "Prospective height loss >2 cm or historical height loss >6 cm\n\nSignificant height loss indicates possible vertebral compression fractures from osteoporosis."
    difficulty: easy
    tags: [osteoporosis, vertebral-fracture, physical-exam, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the categories of 10-year fracture risk reassessment intervals based on FRAX/CAROC?"
    back: "<10% risk: reassess in 5-10 years; 10-15% risk: reassess in 5 years; ≥15% risk: reassess in 3 years\n\nReassessment intervals are stratified based on calculated fracture risk."
    difficulty: medium
    tags: [osteoporosis, FRAX, follow-up, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the two validated 10-year fracture risk assessment tools used in Canada?"
    back: "FRAX (WHO Fracture Risk Assessment Tool) or CAROC (Canadian Association of Radiologists and Osteoporosis Canada)\n\nBoth tools are validated in Canadian population and available at https://osteoporosis.ca/tools/."
    difficulty: easy
    tags: [osteoporosis, screening, FRAX, CAROC, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What height loss findings suggest possible vertebral fracture?"
    back: "Prospective height loss >2 cm OR historical height loss >6 cm\n\nHeight loss is a key indicator of possible undiagnosed vertebral fracture."
    difficulty: easy
    tags: [osteoporosis, vertebral-fracture, physical-exam, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What occiput-to-wall distance suggests possible vertebral fracture?"
    back: "Occiput-to-wall distance >5 cm\n\nThis measures kyphosis and suggests possible vertebral fracture."
    difficulty: easy
    tags: [osteoporosis, vertebral-fracture, physical-exam, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the typical clinical presentation of osteoporosis?"
    back: "Asymptomatic for many years, then presents with fragility or osteoporotic fractures\n\nSilent until fracture is why screening is important in at-risk populations."
    difficulty: easy
    tags: [osteoporosis, clinical-presentation, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the approach to clinical assessment for osteoporosis?"
    back: "Perform clinical assessment to identify risk factors, obtain BMD and calculate 10-year fracture risk using FRAX or CAROC\n\nSystematic approach to osteoporosis management includes risk assessment then BMD testing."
    difficulty: medium
    tags: [osteoporosis, assessment, BMD, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "When is pharmacotherapy recommended for osteoporosis?"
    back: "10-year fracture risk >20% OR T-score <-2.5 and age >70 years\n\nThese thresholds indicate recommendation for pharmacotherapy."
    difficulty: medium
    tags: [osteoporosis, treatment, guidelines, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "List the etiologies of secondary headaches"
    back: "Drug-related, infectious, vascular, endocrine, neoplastic, trauma, other (ophthalmological, otolaryngological)\n\nSecondary headaches have multiple etiologies including drug withdrawal, infections, vascular events, tumors, and trauma."
    difficulty: easy
    tags: [Headache, Etiology, Classification, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What investigations may be ordered for headache with red flags?"
    back: "CBC (infection), ESR/CRP (temporal arteritis), neuroimaging (CT/MRI), CSF analysis (hemorrhage/infection)\n\nRed flag workup may include blood tests, inflammatory markers, imaging, and lumbar puncture depending on clinical suspicion."
    difficulty: medium
    tags: [Headache, Investigations, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the definition of osteoporosis according to the 2023 Canadian guidelines?"
    back: "Age-related disease characterized by decreased bone mass and increased susceptibility to fractures\n\nOsteoporosis is defined by the Canadian guidelines as an age-related condition with decreased bone mass and increased fracture risk."
    difficulty: easy
    tags: [osteoporosis, definition, bone-health, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What tools are used to assess 10-year fracture risk in Canada?"
    back: "FRAX (WHO Fracture Risk Assessment Tool) and CAROC (Canadian Association of Radiologists and Osteoporosis Canada)\n\nBoth tools are validated for the Canadian population and available online."
    difficulty: easy
    tags: [osteoporosis, fracture-risk, assessment-tools, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the indications to suggest pharmacotherapy for osteoporosis?"
    back: "10-year fracture risk >20% OR T-score <-2.5 and age >70 years\n\nThese thresholds indicate high risk warranting pharmacological intervention."
    difficulty: medium
    tags: [osteoporosis, treatment, indications, bmd, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What physical exam findings suggest osteoporosis or vertebral fracture risk?"
    back: "Height loss >2 cm prospectively or >6 cm historically, rib-to-pelvis distance <2 finger-breadths, occiput-to-wall distance >5 cm, inability to rise from chair without arm support\n\nThese findings indicate potential vertebral fractures and fall risk."
    difficulty: medium
    tags: [osteoporosis, physical-exam, vertebral-fracture, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the FRAX threshold for recommending pharmacotherapy?"
    back: "10-year fracture risk >20%\n\nThis indicates high enough fracture risk to warrant pharmacological treatment."
    difficulty: easy
    tags: [osteoporosis, frax, treatment-threshold, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "How often should BMD be reassessed if 10-year fracture risk is >15%?"
    back: "Every 3 years\n\nHigher risk patients require more frequent monitoring."
    difficulty: medium
    tags: [osteoporosis, bmd, follow-up, fracture-risk, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
