  - front: "What are the differential diagnoses for acute psychosis in the ED?"
    back: "Primary psychotic disorder (e.g., schizophrenia), secondary to medical condition (e.g., delirium), drugs (substance intoxication/withdrawal, medications such as steroids or anticholinergics), infectious (CNS), metabolic (hypoglycemia, hepatic, renal, thyroid), structural (hemorrhage, neoplasm), autoimmune (anti-NMDA receptor encephalitis).\n\nOrganic causes must be excluded before diagnosing a primary psychotic disorder. Anti-NMDA receptor encephalitis is an important treatable cause particularly in young women that can mimic schizophrenia and requires LP for diagnosis."
    difficulty: medium
    tags: [acute psychosis, differential diagnosis, anti-NMDA receptor encephalitis, emergency psychiatry]
  - front: "What medications are used for chemical restraint of an agitated psychotic patient in the ED?"
    back: "Benzodiazepines: lorazepam 2 mg PO/IM/SL. Antipsychotics: olanzapine 5–10 mg PO/IM or haloperidol 5 mg PO/IM. Whenever possible, offer medication voluntarily rather than using force.\n\nCombining a benzodiazepine with an antipsychotic provides rapid sedation and reduces the required dose of each drug. Olanzapine IM should NOT be given with IM benzodiazepines due to risk of respiratory depression. Haloperidol carries risk of QTc prolongation and extrapyramidal effects."
    difficulty: medium
    tags: [chemical restraint, agitation, lorazepam, olanzapine, haloperidol, emergency psychiatry]
