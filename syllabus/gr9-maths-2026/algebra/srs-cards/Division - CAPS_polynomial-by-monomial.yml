notes:
  - guid: c8d2e9f30a1b2c3d
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Division"
    fields:
      Front: "Divide a polynomial by a monomial: (6x² + 9x) ÷ 3x."
      Back: "Divide EACH term by the monomial separately (term-by-term):\n6x² ÷ 3x = 2x (6÷3=2, x²÷x=x).\n9x ÷ 3x = 3.\nAnswer: 2x + 3.\nLaw of exponents: when dividing same bases, subtract exponents (x²÷x¹ = x¹)."
    tags: ["polynomial-by-monomial", "subject:algebra"]
  - guid: d2e9f30a1b2c3d4e
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Division"
    fields:
      Front: "Simplify: (12x³ − 8x² + 4x) ÷ 4x."
      Back: "Split over each term:\n12x³ ÷ 4x = 3x².\n−8x² ÷ 4x = −2x.\n4x ÷ 4x = 1.\nAnswer: 3x² − 2x + 1.\nCommon error: forgetting the last term gives 1 (not 0) — anything divided by itself is 1."
    tags: ["polynomial-by-monomial", "subject:algebra"]
  - guid: e9f30a1b2c3d4e5f
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Division"
    fields:
      Front: "Simplify: (15a²b − 10ab²) ÷ 5ab."
      Back: "Divide each term by 5ab:\n15a²b ÷ 5ab = 3a (15÷5=3, a²÷a=a, b÷b=1).\n−10ab² ÷ 5ab = −2b.\nAnswer: 3a − 2b.\nCancel each variable using subtraction of exponents; matching single powers cancel to 1."
    tags: ["polynomial-by-monomial", "subject:algebra"]
  - guid: f30a1b2c3d4e5f60
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Division"
    fields:
      Front: "Write (8x³ + 4x²)/(2x²) as a simplified expression."
      Back: "Treat the fraction bar as ÷ and split term-by-term over 2x²:\n8x³/2x² = 4x.\n4x²/2x² = 2.\nAnswer: 4x + 2.\nYou may only split a sum/difference over a single-term denominator like this — not over a denominator that itself has two terms."
    tags: ["polynomial-by-monomial", "subject:algebra"]
