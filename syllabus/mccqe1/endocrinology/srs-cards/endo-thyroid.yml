  - front: "What is the role of TSH in constipation investigation?"
    back: "Consider TSH to rule out hypothyroidism as metabolic cause of constipation\n\nHypothyroidism is a treatable metabolic cause of constipation and should be considered in the workup."
    difficulty: medium
    tags: [Constipation, Investigations, TSH, Hypothyroidism, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are the common causes of constipation?"
    back: "Most common: functional/idiopathic. Medication side effects (narcotics, antidepressants) most common organic cause. Also: DM, hypothyroidism, hypercalcemia, hypokalemia, Parkinson disease, MS, scleroderma, anal fissures.\n\nA careful medication review is essential as drug-induced constipation is very common and often reversible."
    difficulty: medium
    tags: [Constipation, Etiology, Differential Diagnosis, Gastroenterology, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What monitoring is required for patients with PBC?"
    back: "Liver enzymes and LFTs q3-6mo, TSH annually, BMD q2-4yr (pending baseline)\n\nRegular monitoring of liver function, thyroid function (autoimmune association), and bone density (high osteoporosis risk) is essential."
    difficulty: medium
    tags: [PBC, monitoring, osteoporosis, follow-up, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What monitoring is required for PBC patients?"
    back: "Liver enzymes and LFTs q3-6 months, TSH annually, BMD q2-4 years (pending baseline)\n\nRegular monitoring tracks disease progression and treatment response. Thyroid disease and osteoporosis are common associations requiring surveillance."
    difficulty: medium
    tags: [PBC, monitoring, follow-up, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "Which autoimmune conditions are associated with PBC?"
    back: "Sjogren's syndrome, scleroderma, CREST syndrome (calcinosis, Raynaud's, esophageal dysfunction, sclerodactyly, telangiectasia), RA, thyroiditis\n\nPBC has strong autoimmune associations, particularly in middle-aged women"
    difficulty: easy
    tags: [Gastroenterology, Hepatology, Autoimmune, PBC, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "When is preoperative antibiotic prophylaxis NOT required?"
    back: "Low-risk or clean surgery such as elective thyroidectomy, cholecystectomy, hemorrhoidectomy, fistulotomy, and sphincterotomy for fissure.\n\nThese procedures have very low SSI rates and prophylactic antibiotics provide minimal benefit while adding risk of antibiotic complications."
    difficulty: easy
    tags: [surgery, SSI, prophylaxis, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What prokinetic and secretagogue agents are used for constipation?"
    back: "Prokinetic: prucalopride (5-HT4 inhibitor). Secretagogues: linaclotide, plecanatide (increase water secretion into intestinal lumen). NHE3 inhibitor: tenapanor.\n\nThese agents are used when simpler laxatives fail; they target specific mechanisms of constipation."
    difficulty: medium
    tags: [Gastroenterology, Constipation, Treatment, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "List causes of hypoventilation leading to hypercapnia"
    back: "Restrictive: chest wall disorders (e.g., severe kyphoscoliosis); Central: brainstem stroke, hypothyroidism, metabolic alkalosis, drugs (opiates, benzodiazepines); Neuromuscular: myasthenia gravis, Guillain-Barré, phrenic nerve injury, muscular dystrophy, polymyositis\n\nHypoventilation means low minute ventilation - either the brain fails to drive breathing or the muscles cannot respond to the drive."
    difficulty: medium
    tags: [hypercapnia, hypoventilation, causes, neuromuscular, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "What extraglandular manifestations can occur in Sjogren's syndrome?"
    back: "Fatigue, low-grade fever, autoimmune thyroid dysfunction, arthralgias/arthritis, subclinical ILD, xerotrachea with dry cough, renal disease/glomerulonephritis, palpable purpura, vasculitis, peripheral neuropathy\n\nSystemic involvement occurs in ~20% of patients, affecting multiple organ systems."
    difficulty: medium
    tags: [Sjogrens, Systemic, Extraglandular, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What are the risk factors for pseudogout (CPPD)?"
    back: "Old age, advanced osteoarthritis, neuropathic joints, hyperparathyroidism, hypothyroidism, hypomagnesemia, hypophosphatasia, hemochromatosis\n\nCPPD is associated with metabolic disorders and typically affects elderly patients."
    difficulty: hard
    tags: [pseudogout, CPPD, risk factors, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What skin findings are associated with hypothyroidism?"
    back: "Cool, dry, scaly, thickened, hyperpigmented skin; coarse dry hair; brittle nails; non-pitting myxedema; alopecia (including loss of lateral 1/3 of eyebrows — 'Queen Anne's sign').\n\nHypothyroid skin changes result from mucopolysaccharide deposition in the dermis (myxedema). TSH is the key screening test. Loss of the lateral eyebrows is a classic but non-specific sign."
    difficulty: easy
    tags: [hypothyroidism, myxedema, skin changes, Queen Anne sign]
  - front: "What skin findings are specific to hyperthyroidism?"
    back: "Moist warm skin, pretibial myxedema (in Graves'), acropachy, onycholysis, toxic alopecia, hyperpigmentation, seborrhea, acne.\n\nPretibial myxedema and acropachy (clubbing-like periosteal new bone formation) are pathognomonic of Graves' disease. Onycholysis in hyperthyroidism is called Plummer's nails."
    difficulty: medium
    tags: [hyperthyroidism, Graves disease, pretibial myxedema, acropachy]
  - front: "What is a thyroid nodule and what is its prevalence on ultrasound?"
    back: "A discrete lesion distinguishable sonographically from the rest of the thyroid parenchyma. Prevalence is 19–67% based on incidentally found nodules on ultrasound.\n\nThyroid nodules are common incidental findings. The TIRADS scoring system (Thyroid Imaging Reporting and Data System) uses ultrasound characteristics to stratify which nodules require biopsy, avoiding unnecessary procedures for benign or very small low-risk nodules."
    difficulty: easy
    tags: [thyroid, nodule, TIRADS, ultrasound]
  - front: "What is the TIRADS scoring system used for in the evaluation of thyroid nodules?"
    back: "TIRADS is a scoring system based on ultrasound characteristics used to determine which thyroid nodules require biopsy. Benign or very small low-risk nodules do not need ongoing surveillance; small suspicious nodules require up to 5 years of surveillance; larger suspicious nodules require biopsy.\n\nTIRADS stratifies thyroid nodule management by sonographic risk features (composition, echogenicity, shape, margins, echogenic foci). This systematic approach avoids overinvestigation while identifying malignant nodules early."
    difficulty: easy
    tags: [thyroid, nodule, TIRADS, biopsy, ultrasound]
  - front: "In the evaluation of a thyroid nodule with LOW TSH, what is the next step?"
    back: "Perform a radionuclide thyroid scan. A 'hot' nodule (autonomous) is treated as hyperthyroidism. A 'cold' nodule proceeds to ultrasound-guided biopsy based on US characteristics.\n\nLow TSH suggests a hyperfunctioning nodule. Hot nodules on scintigraphy are almost never malignant. Cold nodules carry a higher malignancy risk and require further evaluation with ultrasound and biopsy."
    difficulty: medium
    tags: [thyroid, nodule, TSH, radionuclide scan, hot nodule]
