# Derm General (Dermatology) - generated from srs-mccqe1
cards:
  - front: "What malignancy develops most commonly in cardiac transplant recipients?"
    back: "Cutaneous neoplasms (skin cancers), followed by non-Hodgkin lymphoma and lung cancer\n\nChronic immunosuppression increases risk of certain malignancies, particularly those with viral etiology (like post-transplant lymphoproliferative disorder) and UV-related skin cancers."
    difficulty: easy
    tags: [cardiac-transplantation, malignancy, immunosuppression, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the typical source of cardiac metastases?"
    back: "Metastatic tumors to the heart most commonly originate from lung cancer, breast cancer, melanoma, lymphoma, and renal cell carcinoma"
    difficulty: medium
    tags: [cardiology, oncology, cardiac-metastases, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "Acne vulgaris is classified into 4 types. What are they?"
    back: "Type I (comedonal, sparse, no scarring), Type II (comedonal, papular, moderate + little scarring), Type III (comedonal, papular, pustular, with scarring), Type IV (nodulocystic, risk of severe scarring)\n\nAcne severity classification ranges from mild comedonal disease to severe nodulocystic acne with significant scarring risk."
    difficulty: easy
    tags: [dermatology, acne-vulgaris, classification, severity, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the common sites of predilection for acne vulgaris?"
    back: "Face, neck, upper chest, and back\n\nThese areas have the highest density of pilosebaceous units, making them most susceptible to acne development."
    difficulty: easy
    tags: [dermatology, acne-vulgaris, anatomy, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What role does Cutibacterium acnes play in acne pathophysiology?"
    back: "Metabolizes sebum to free fatty acids and produces pro-inflammatory mediators\n\nC. acnes colonizes the pilosebaceous unit and contributes to inflammation through its metabolism of sebaceous lipids and production of inflammatory molecules."
    difficulty: medium
    tags: [dermatology, acne, cutibacterium-acnes, pathophysiology, microbiome, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the typical age of onset for acne vulgaris in males vs. females?"
    back: "Females: 10-17 years; Males: 14-19 years\n\nAcne typically begins earlier in females due to earlier adrenal maturation and puberty onset."
    difficulty: easy
    tags: [dermatology, acne, epidemiology, puberty, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "According to the Cochrane review, is benzoyl peroxide more effective than adapalene for acne?"
    back: "No - there is little to no difference between benzoyl peroxide and adapalene (RR 0.99; 95% CI 0.90-1.10)\n\nThe systematic review found benzoyl peroxide was superior to placebo but showed no significant difference compared to adapalene (a topical retinoid)."
    difficulty: medium
    tags: [dermatology, acne, treatment, evidence-based, benzoyl-peroxide, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the typical age of onset for acne vulgaris?"
    back: "Puberty: 10-17 years in females, 14-19 years in males\n\nAcne vulgaris typically begins during puberty. In prepubertal children with early acne, clinicians should consider underlying hormonal abnormalities such as late-onset congenital adrenal hyperplasia."
    difficulty: easy
    tags: [dermatology, acne, epidemiology, puberty, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the four severity classifications of acne vulgaris?"
    back: "Type I (comedonal, sparse, no scarring), Type II (comedonal, papular, moderate + little scarring), Type III (comedonal, papular, pustular, with scarring), Type IV (nodulocystic, risk of severe scarring)\n\nAcne vulgaris is categorized by severity: Type I-II are mild-moderate with comedones and minimal scarring, Type III shows pustules and scarring, and Type IV (nodulocystic) carries highest risk of severe scarring."
    difficulty: easy
    tags: [dermatology, acne, classification, severity, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the evidence from the Cochrane review regarding benzoyl peroxide for acne treatment?"
    back: "Benzoyl peroxide is more effective than placebo (RR 1.27) but shows no difference compared to adapalene or clindamycin; higher withdrawal rates due to adverse effects (RR 2.13)\n\nThe Cochrane systematic review found benzoyl peroxide effective versus placebo for participant-assessed improvement, but equally effective as adapalene or clindamycin. Adverse effects including erythema, pruritus, and burning led to higher dropout rates."
    difficulty: hard
    tags: [dermatology, acne, benzoyl_peroxide, evidence_based, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What sites are most commonly affected by acne vulgaris?"
    back: "Face, neck, upper chest, and back\n\nAcne vulgaris has a predilection for areas with high concentrations of sebaceous glands: the face, neck, upper chest, and upper back are the most commonly affected sites."
    difficulty: easy
    tags: [dermatology, acne, anatomy, sebaceous_glands, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the sites of predilection for acne vulgaris?"
    back: "Face, neck, upper chest, and back.\n\nThese areas have the highest concentration of pilosebaceous units, making them most susceptible to acne development."
    difficulty: easy
    tags: [dermatology, acne, anatomy, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "How is acne vulgaris categorized by severity (Type I-IV)?"
    back: "Type I: comedonal, sparse, no scarring. Type II: comedonal, papular, moderate + little scarring. Type III: comedonal, papular, pustular, with scarring. Type IV: nodulocystic acne, risk of severe scarring.\n\nAcne severity classification guides treatment selection and helps identify patients at risk for permanent scarring."
    difficulty: easy
    tags: [dermatology, acne, classification, severity, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What does the Cochrane evidence say about topical benzoyl peroxide for acne?"
    back: "Benzoyl peroxide is more effective than placebo/no treatment (RR 1.27), but little to no difference compared to adapalene (RR 0.99) or clindamycin (RR 0.95). Withdrawal due to adverse effects (erythema, pruritus, burning) was higher with benzoyl peroxide (RR 2.13).\n\nEvidence suggests benzoyl peroxide as monotherapy or add-on therapy may be more effective than placebo, but not superior to other first-line agents."
    difficulty: medium
    tags: [dermatology, acne, treatment, benzoyl peroxide, evidence-based, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the role of Cutibacterium acnes (C. acnes) in acne pathophysiology?"
    back: "Metabolizes sebum to free fatty acids and produces pro-inflammatory mediators\n\nC. acnes colonizes the pilosebaceous unit and contributes to inflammation by metabolizing sebum into free fatty acids and secreting pro-inflammatory mediators that perpetuate the inflammatory acne response."
    difficulty: medium
    tags: [dermatology, acne vulgaris, Cutibacterium acnes, microbiology, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What age does acne vulgaris typically onset in males versus females?"
    back: "14-19 years in males; 10-17 years in females\n\nAcne onset is driven by androgen-mediated sebum production during puberty. Females begin earlier (10-17) due to earlier adrenarche, while males onset later (14-19) but may develop more severe disease."
    difficulty: easy
    tags: [dermatology, acne vulgaris, epidemiology, puberty, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the Type III and Type IV features of acne vulgaris severity classification?"
    back: "Type III: comedonal, papular, pustular with scarring; Type IV: nodulocystic acne with risk of severe scarring\n\nAcne vulgaris is categorized by severity: Type I-II are mild-moderate (comedonal ± papules), Type III adds pustules and scarring, and Type IV is the most severe with nodules and cysts carrying high scarring risk."
    difficulty: easy
    tags: [dermatology, acne vulgaris, severity classification, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What sites of predilection are characteristic of acne vulgaris?"
    back: "Face, neck, upper chest, and back\n\nAcne vulgaris preferentially affects areas with the highest density of pilosebaceous units: the face (forehead, cheeks, chin), neck, upper chest, and back. These regions have more active sebaceous glands."
    difficulty: easy
    tags: [dermatology, acne vulgaris, anatomy, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "Based on the Cochrane review, what is the efficacy of topical benzoyl peroxide compared to adapalene or clindamycin for acne?"
    back: "Little to no difference compared to adapalene (RR 0.99) or clindamycin (RR 0.95)\n\nThe 2020 Cochrane systematic review found benzoyl peroxide was more effective than placebo but showed no significant difference compared to adapalene or clindamycin. Monotherapy with any of these agents has comparable efficacy."
    difficulty: hard
    tags: [dermatology, acne vulgaris, benzoyl peroxide, evidence-based medicine, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What adverse effects were more common with benzoyl peroxide compared to placebo in the Cochrane acne review?"
    back: "Erythema, pruritus, and skin burning (RR 2.13; 95% CI 1.85-2.93)\n\nThe Cochrane review found higher withdrawal rates due to adverse effects with benzoyl peroxide versus placebo. Common side effects include irritant contact dermatitis manifesting as erythema, pruritus, and burning sensation."
    difficulty: medium
    tags: [dermatology, benzoyl peroxide, adverse effects, acne treatment, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is acne vulgaris and how is it classified by severity?"
    back: "Common inflammatory pilosebaceous disease. Type I: comedonal, sparse, no scarring. Type II: comedonal, papular, moderate + little scarring. Type III: papular, pustular, with scarring. Type IV: nodulocystic, risk of severe scarring.\n\nAcne severity ranges from mild (comedonal) to severe (nodulocystic). Higher types carry greater risk of permanent scarring."
    difficulty: easy
    tags: [dermatology, acne, classification, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What does the Cochrane review 2020 (CD011154) conclude about benzoyl peroxide for acne?"
    back: "Benzoyl peroxide is more effective than placebo/no treatment (RR 1.27). Little to no difference compared to adapalene or clindamycin. Higher withdrawal due to adverse effects vs placebo (RR 2.13).\n\nWhile benzoyl peroxide is effective monotherapy, it offers no advantage over topical retinoids or antibiotics. Adverse effects include erythema, pruritus, and burning."
    difficulty: medium
    tags: [dermatology, acne, pharmacology, evidence, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the SCALDA mnemonic used for in dermatology?"
    back: "Describing lesions: Size, Configuration, Arrangement, Location, Distribution, Appearance\n\nSCALDA provides a systematic approach to characterize skin lesions for accurate clinical description and diagnosis."
    difficulty: easy
    tags: [dermatology, clinical examination, skin lesions, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is a fissure in dermatology?"
    back: "A linear slit-like cleavage of the skin\n\nFissures are painful linear cracks that typically occur in areas of skin subject to repeated stretching, such as the heels or fingertips."
    difficulty: easy
    tags: [dermatology, secondary lesions, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What percentage of psoriatic arthritis patients also have psoriasis?"
    back: "20-30% of patients with psoriasis also suffer from psoriatic arthritis; those with nail or scalp involvement are at higher risk\n\nPsoriatic arthritis is a seronegative spondyloarthropathy that occurs in a significant proportion of psoriasis patients, particularly those with nail dystrophy."
    difficulty: easy
    tags: [rheumatology, psoriasis, psoriatic-arthritis, epidemiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What percentage of psoriasis patients develop psoriatic arthritis?"
    back: "20-30% of patients with psoriasis develop psoriatic arthritis; patients with nail or scalp involvement are at higher risk\n\nThis is a high-yield association. All psoriasis patients, especially those with nail dystrophy or scalp involvement, should be screened for joint symptoms."
    difficulty: easy
    tags: [rheumatology, psoriasis, psoriatic-arthritis, epidemiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
