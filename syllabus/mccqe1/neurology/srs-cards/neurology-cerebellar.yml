# Neurology Cerebellar (Neurology) - generated from srs-mccqe1
cards:
  - front: "What are the clinical features of cerebellar disorders, organized by region of involvement?"
    back: "Lateral zone (cerebellar hemisphere) → ipsilateral limb ataxia:\n- Dysmetria (finger-to-nose, heel-to-shin)\n- Intention tremor\n- Dysdiadochokinesia\n- Hypotonia/pendular reflexes\n- Holmes rebound phenomenon\n\nCerebellar vermis → truncal ataxia:\n- Wide-based gait\n- Inability to tandem walk\n- Truncal titubation\n\nOther: gaze-evoked nystagmus, scanning speech (explosive with pauses)\n\nCerebellar signs are IPSILATERAL to the lesion (unlike UMN lesions). Scanning speech (also called dysarthria) has characteristic explosive quality with accentuated syllables. Dysdiadochokinesia is tested with rapid alternating movements (pronation/supination)."
    difficulty: easy
    tags: [cerebellar disorders, ataxia, dysmetria, intention tremor, neurology]
  - front: "What is Friedreich's ataxia? Describe its key clinical features and prognosis."
    back: "Friedreich's ataxia is the most common hereditary ataxia (prevalence 2/100,000), autosomal recessive, typically onset 8-15 years.\n\nFeatures:\n- Gait and limb ataxia\n- Weakness\n- Areflexia\n- Extensor plantar response (Babinski sign)\n- Impaired proprioception and vibration\n- Dysarthria, nystagmus\n- Cardiomyopathy (cause of death)\n- Kyphoscoliosis\n\nPrognosis: Death in 10-20 years from cardiomyopathy or kyphoscoliotic pulmonary restriction.\n\nFriedreich's ataxia is caused by GAA trinucleotide repeat expansion in the frataxin gene. The combination of cerebellar signs with absent deep tendon reflexes and extensor plantars (mixed UMN and LMN) is characteristic. Cardiomyopathy management is critical for survival."
    difficulty: medium
    tags: [Friedreichs ataxia, hereditary ataxia, cardiomyopathy, autosomal recessive, cerebellar]
  - front: "What causes Wernicke's encephalopathy and what are the classic clinical triad features?"
    back: "Caused by thiamine (vitamin B1) deficiency.\n\nClassic triad:\n1. Ophthalmoplegia (often horizontal nystagmus, lateral rectus palsy)\n2. Ataxia (cerebellar-type gait ataxia)\n3. Confusion/encephalopathy\n\nEtiologies: alcohol use disorder (most common), GI malabsorption, gastric bypass surgery, malnutrition, AIDS, hemodialysis, malignancy.\n\nKorsakoff's psychosis is the chronic sequela with amnesia (anterograde > retrograde), confabulation, and relatively preserved other cognitive functions. Note: alcohol can also cause cerebellar ataxia through direct cerebellar atrophy or alcohol polyneuropathy, separate from thiamine deficiency."
    difficulty: easy
    tags: [Wernickes encephalopathy, Korsakoff, thiamine deficiency, alcohol, ataxia]
