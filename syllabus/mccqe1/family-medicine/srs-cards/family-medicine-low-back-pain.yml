# Family Medicine Low Back Pain (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What is the definition of low back pain by duration, and what is the epidemiology?"
    back: "Acute: <6 weeks; Subacute: 6–12 weeks; Chronic: >12 weeks.\nEpidemiology: 5th most common reason for visiting a physician; lifetime prevalence 90%; peak age 45–60; largest WSIB category and most common cause of chronic disability for <45 yr; 90% resolve in 6 weeks; <5% become chronic.\n\nDespite the extremely high lifetime prevalence, most episodes of acute LBP are self-limiting. The small proportion that progress to chronic LBP account for the majority of the socioeconomic burden, emphasizing the importance of early yellow flag identification."
    difficulty: easy
    tags: [low-back-pain, epidemiology, definitions, family-medicine]
  - front: "What is cauda equina syndrome and why is it a surgical emergency?"
    back: "Cauda equina syndrome presents with: areflexia, lower extremity weakness, saddle anesthesia (perianal/perineal), fecal incontinence, and urinary retention.\nIt is a surgical EMERGENCY requiring immediate referral, as compression of the cauda equina nerve roots can lead to permanent bowel, bladder, and sexual dysfunction if not decompressed urgently.\n\nCauda equina syndrome typically results from large central disc herniation, epidural abscess, or tumour at L2–S1. Urinary retention is the most sensitive finding. Delay in surgical decompression beyond 24–48 hours significantly worsens neurological outcomes."
    difficulty: hard
    tags: [low-back-pain, cauda-equina, emergency, red-flags, family-medicine]
  - front: "What percentage of low back pain is mechanical and what are the mechanical causes?"
    back: "98% of low back pain is mechanical (worse with movement, better with rest).\nCauses:\n- Soft tissue: sprain (ligament), strain (muscle)\n- Spine: facet joint/disc degeneration, disc herniation, spinal stenosis, spondylolisthesis, compression fracture\n- Other: pregnancy\n2% are non-mechanical (neoplastic, infectious, metabolic, rheumatologic, referred pain).\n\nMechanical LBP is benign and self-limiting in 90% of cases. Non-mechanical causes must be excluded with red flags; these include malignancy (primary or metastatic), infection (osteomyelitis, TB), metabolic bone disease, and referred visceral pain (AAA, pancreatitis, pyelonephritis)."
    difficulty: easy
    tags: [low-back-pain, mechanical, etiology, family-medicine]
  - front: "How is the straight leg raise (SLR) test performed and interpreted?"
    back: "Patient is supine; examiner raises the leg while keeping the knee extended. Test is positive if pain radiates below the knee at <70° of hip flexion, aggravated by ankle dorsiflexion (Bragard's sign).\nPositive = indicative of sciatica/lumbosacral nerve root irritation.\nCrossed SLR: raising the uninvolved leg elicits pain in the leg with sciatica — more specific than ipsilateral SLR.\n\nThe SLR stretches the sciatic nerve and L4–S1 nerve roots. Sensitivity is ~80% but specificity is only ~40% for disc herniation. The crossed SLR has lower sensitivity but higher specificity (~90%), making it more diagnostic when positive."
    difficulty: medium
    tags: [low-back-pain, straight-leg-raise, sciatica, physical-exam, family-medicine]
  - front: "What are the 4 clinical patterns of non-traumatic low back pain and their likely pathology?"
    back: "Pattern 1 (Back dominant, worse with flexion): Disc pain\nPattern 2 (Back dominant, worse with extension, never worse with flexion): Facet joint pain\nPattern 3 (Leg dominant, pain changes with back position): Compressed nerve pain / sciatica\nPattern 4 (Leg dominant, worse with activity, improves with rest): Symptomatic spinal stenosis / neurogenic claudication\n\nThe CORE Back Tool from the Centre for Effective Practice uses these patterns to guide initial management. Disc pain improves with extension exercises; facet joint pain with flexion; sciatica with prone extension; neurogenic claudication with sustained flexion and abdominal exercises."
    difficulty: medium
    tags: [low-back-pain, patterns, CORE-back-tool, diagnosis, family-medicine]
  - front: "What are the red flags and yellow flags in low back pain management?"
    back: "Red flags (require urgent/emergency action):\n- Cauda equina syndrome (EMERGENCY)\n- Severe worsening pain especially at night or when lying down (URGENT)\n- Significant trauma (URGENT)\n- Weight loss, history of cancer, fever (URGENT)\n- Age >50, especially >65 (SOON)\n- Widespread neurological signs (SOON)\n\nYellow flags (psychosocial barriers — predict chronicity):\n- Belief that pain and activity are harmful\n- Sickness behaviours (extended rest)\n- Low mood, social withdrawal\n- Poor job satisfaction\n- Overprotective family or lack of support\n\nRed flags prompt urgent imaging and specialist referral to rule out malignancy, infection, or structural emergency. Yellow flags identify patients at risk for chronic disability and guide psychosocial interventions (CBT, return-to-work programs). Referral urgency: EMERGENCY within hours, URGENT within 24–48 h, SOON within weeks."
    difficulty: medium
    tags: [low-back-pain, red-flags, yellow-flags, family-medicine]
  - front: "What does evidence show about spinal manipulative therapy (SMT) for acute low back pain?"
    back: "Moderate-quality evidence from 15 RCTs: SMT produces statistically significant improvement in pain (mean -9.95/100 mm VAS) and function at 1–6 weeks. No serious adverse events reported. Minor transient adverse events (increased pain, muscle stiffness, headache) occur in 50–67% of patients. Effect size is modest and heterogeneity is large.\n\nSMT (chiropractic manipulation or physiotherapy mobilization) is a reasonable adjunct for acute LBP. It performs similarly to other active treatments. The transient adverse events are common but resolve quickly, and no serious neurological complications were documented in the systematic review."
    difficulty: medium
    tags: [low-back-pain, SMT, spinal-manipulation, evidence, family-medicine]
  - front: "What is the evidence for massage therapy in non-specific low back pain?"
    back: "From a Cochrane systematic review of 13 RCTs: massage is superior for pain and function on both short- and long-term outcomes compared to no treatment; similar to exercise; superior to joint mobilization, relaxation therapy, physical therapy, acupuncture, and self-care education. Benefits last at least 1 year post-treatment. Acupuncture massage was better than classic (Swedish) massage.\n\nMassage therapy is most beneficial for subacute and chronic non-specific LBP, especially in combination with exercise and education. It does not address underlying structural pathology but provides meaningful symptomatic benefit without the risks of pharmacotherapy."
    difficulty: medium
    tags: [low-back-pain, massage, evidence, chronic-LBP, family-medicine]
  - front: "What is the femoral stretch test and what does it diagnose?"
    back: "The femoral stretch test (also called femoral nerve stretch test): Patient is prone, knee is flexed, examiner extends the hip. A positive test produces anterior thigh pain and is used to diagnose L4 radiculopathy (femoral nerve).\n\nThe femoral nerve (L2, L3, L4) is stretched with hip extension. This complements the straight leg raise (which tests L4–S1/sciatic nerve). L4 radiculopathy presents with weakness of knee extension, reduced patellar reflex, and medial leg sensory loss."
    difficulty: hard
    tags: [low-back-pain, femoral-stretch-test, L4-radiculopathy, physical-exam, family-medicine]
  - front: "What are the neurological examination findings corresponding to L4, L5, and S1 nerve root involvement in low back pain?"
    back: "L4: knee extension weakness, reduced/absent patellar reflex, medial leg/foot sensation\nL5: great toe/ankle dorsiflexion weakness (foot drop), no reflex change, lateral leg/dorsal foot sensation\nS1: plantar flexion/toe standing weakness, reduced/absent Achilles reflex, lateral foot/heel sensation\n\nSpecial tests: SLR for L4–S1; femoral stretch test for L4.\n\nLocalizing the level of nerve root compression guides imaging decisions and surgical planning. L4–L5 and L5–S1 are the most common levels for disc herniation. A complete neurological exam (power, reflexes, sensation) is essential in all patients with radicular symptoms."
    difficulty: medium
    tags: [low-back-pain, radiculopathy, neurology, L4, L5, S1, family-medicine]
