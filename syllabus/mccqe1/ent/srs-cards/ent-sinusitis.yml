# Ent Sinusitis (ENT) - generated from srs-mccqe1
cards:
  - front: "What is the osteomeatal complex and why is it important in rhinosinusitis?"
    back: "A common drainage area under the middle meatus where all sinuses drain. Ostial obstruction at the osteomeatal complex leads to stagnant mucus, dysfunctional cilia, and subsequent bacterial infection — the central pathogenesis of rhinosinusitis.\n\nThe osteomeatal complex is a key anatomical concept in sinusitis. Obstruction can be mechanical (septal deviation, turbinate hypertrophy, polyps, tumours) or inflammatory (allergy, URTI). All paranasal sinuses drain through this area, so obstruction predisposes to pansinusitis. Functional endoscopic sinus surgery (FESS) targets the osteomeatal complex to restore drainage while preserving mucosa."
    difficulty: medium
    tags: [otolaryngology, osteomeatal complex, rhinosinusitis, pathogenesis, sinusitis]
  - front: "What are the diagnostic criteria and time-based classification for rhinosinusitis?"
    back: "Classification: acute (<4 weeks), subacute (4-12 weeks), chronic (>12 weeks). Acute bacterial rhinosinusitis diagnosis requires at least 2 major symptoms (P: facial pain/pressure; O: nasal obstruction; D: purulent/discoloured nasal discharge; H: hyposmia/anosmia — at least 1 must be O or D) plus symptoms >7 days or worsening >5 days or purulence with high fever (>39°C) for 3-4 days.\n\nThe PODS criteria distinguish acute bacterial rhinosinusitis from viral URTI (course <10 days, peaks by day 3). The distinction matters because antibiotics are indicated for bacterial rhinosinusitis but not viral. CT of paranasal sinuses is indicated only if complications are suspected, not for routine diagnosis. Predisposing factors include viral URTI, allergy, dental disease, and anatomical defects."
    difficulty: medium
    tags: [otolaryngology, rhinosinusitis, diagnostic criteria, PODS, acute, chronic]
  - front: "What is the most commonly affected sinus in acute bacterial rhinosinusitis and what are the most common organisms?"
    back: "The maxillary sinus is most commonly affected. Organisms: S. pneumoniae (35%), H. influenzae (35%), M. catarrhalis, S. aureus, and anaerobes (dental source).\n\nThe maxillary sinus is most prone to infection because its ostium is located superiorly (poorly positioned for gravity drainage) and it receives drainage from the osteomeatal complex. In immunocompromised patients, mucormycosis must be ruled out — painless black or pale mucosa on exam should raise this concern. Children are more prone to bacterial etiology than adults but viral rhinosinusitis is still more common in children."
    difficulty: easy
    tags: [otolaryngology, sinusitis, maxillary sinus, S. pneumoniae, H. influenzae]
  - front: "What are the orbital complications of acute rhinosinusitis according to Chandler's classification?"
    back: "I - Preseptal (periorbital) cellulitis; II - Orbital cellulitis; III - Subperiosteal abscess; IV - Orbital abscess; V - Cavernous sinus thrombosis.\n\nChandler's classification describes the progression of orbital complications from ethmoid sinusitis (the ethmoid sinus lies medial to the orbit). Stages I-II may be managed medically with IV antibiotics; Stages III-V generally require surgical drainage. Cavernous sinus thrombosis (Stage V) is life-threatening with bilateral eye involvement, septic emboli, and high mortality. Hospitalization is warranted for any suspected orbital or intracranial complication."
    difficulty: hard
    tags: [otolaryngology, sinusitis complications, Chandler classification, orbital cellulitis, cavernous sinus thrombosis]
  - front: "What is the antibiotic management for acute bacterial rhinosinusitis (first-line and second-line)?"
    back: "Mild-moderate: INCS; if no response in 72h, add antibiotics. Severe: INCS + antibiotics. First-line: amoxicillin x 10 days (TMP-SMX or macrolide if penicillin allergy). Second-line (no response to 1st line within 72h): fluoroquinolones or amoxicillin-clavulanic acid.\n\nINCS reduces mucosal inflammation and ostial obstruction, the primary pathogenesis. Antibiotics are added based on severity and response. The shift from amoxicillin to amoxicillin-clavulanic acid or fluoroquinolones addresses beta-lactamase-producing H. influenzae and M. catarrhalis. Adjuvant therapy (saline irrigation, analgesics, decongestants) provides symptomatic relief but does not treat the underlying infection."
    difficulty: medium
    tags: [otolaryngology, sinusitis, antibiotics, amoxicillin, fluoroquinolones, INCS]
  - front: "What is the management approach for chronic rhinosinusitis with and without nasal polyps?"
    back: "With polyps: INCS, oral steroids + antibiotics (if signs of infection), refer to otolaryngologist/H&N surgeon. Without polyps: INCS, antibiotics (3-6 weeks: amoxicillin-clavulanic acid, fluoroquinolone, macrolide, clindamycin, or metronidazole), saline irrigation, oral steroids (severe). Surgery (ESS or balloon sinuplasty) if medical therapy fails or fungal sinusitis.\n\nChronic rhinosinusitis requires 2 major symptoms for >12 weeks plus objective inflammation on CT or endoscopy. Contributing factors must be identified and addressed (allergy, dental disease, anatomic factors, ciliary disorders, biofilms). Clarithromycin (macrolide) has anti-inflammatory as well as antibiotic properties. ESS (endoscopic sinus surgery) restores sinus drainage while preserving mucosa, targeting the osteomeatal complex. Complications include those of acute sinusitis plus mucocele."
    difficulty: hard
    tags: [otolaryngology, chronic rhinosinusitis, nasal polyps, ESS, INCS, treatment]
