    back: "1000 mg/day\n\nCanadian guidelines recommend 1000 mg calcium daily for adults aged 50-64 to maintain bone health."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended daily calcium intake for adults over 50 with no risk factors?"
    back: "1200 mg/day\n\nAdults over 50 require higher calcium intake to prevent age-related bone loss."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What STI screening is recommended for sexually active people under 30?"
    back: "Annual screening for gonorrhea and chlamydia\n\nYoung sexually active individuals have the highest STI rates and should be screened annually."
    difficulty: easy
    tags: [STI, screening, guidelines, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the Pap test screening recommendation in Canada?"
    back: "Pap test every 3 years for anyone with a cervix aged 25 to 69 who has ever been sexually active\n\nRegular Pap testing detects cervical dysplasia and allows for early intervention to prevent cervical cancer."
    difficulty: easy
    tags: [STI, screening, Pap-test, cervical-cancer, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What falls risk assessment is recommended for osteoporosis patients?"
    back: "Ability to get up from chair without support with arms, and walking several steps and return\n\nThis simple test assesses functional mobility and fall risk, which is crucial for fracture prevention."
    difficulty: easy
    tags: [osteoporosis, falls, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are recommended non-pharmacological interventions for osteoporosis?"
    back: "Balance and muscle-strengthening exercises > twice weekly, eating foods rich in calcium and protein\n\nThese lifestyle interventions form the foundation of osteoporosis management alongside pharmacotherapy when indicated."
    difficulty: easy
    tags: [osteoporosis, prevention, lifestyle, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "At what age and frequency is Pap testing recommended in Canada?"
    back: "Every 3 years for anyone with a cervix aged 25 to 69 who has ever been sexually active\n\nCanadian cervical cancer screening guidelines recommend Pap tests starting at age 25, performed every 3 years for eligible individuals."
    difficulty: easy
    tags: [STI, Pap-test, cervical-cancer, screening, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What fall risk assessments should be performed in osteoporosis patients?"
    back: "Ability to get up from chair without arm support, walk several steps and return\n\nThese simple functional tests assess mobility and balance, key components of fall risk that should be evaluated in osteoporosis patients."
    difficulty: easy
    tags: [osteoporosis, fall-risk, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What infectious contacts and travel history should be asked about in fever workup?"
    back: "Travel history, camping ( Legionella, tick-borne illnesses), daycare exposure, contact with TB, foodborne illness exposure, animal contacts\n\nExposure history helps narrow the differential diagnosis"
    difficulty: easy
    tags: [fever, infection, travel medicine, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is achalasia?"
    back: "Failure of smooth muscle relaxation at the LES with swallowing\n\nIdiopathic cause most common. Presents with dysphagia to solids and liquids, sometimes chest pain. Diagnosis via motility study."
    difficulty: easy
    tags: [achalasia, motility disorder, pathophysiology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is distal esophageal spasm (DES)?"
    back: "Normal peristalsis interspersed with frequent premature contractions in the distal esophagus\n\nRare motor disorder that can be difficult to diagnose due to intermittent presentation. Causes dysphagia and chest pain."
    difficulty: medium
    tags: [distal esophageal spasm, motility disorder, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What diagnostic test is used to diagnose esophageal motor disorders like achalasia?"
    back: "Esophageal manometry (esophageal motility study)\n\nManometry studies esophageal motility and LES tone. It diagnoses peristalsis abnormalities and decreased LES tone but cannot detect reflux."
    difficulty: easy
    tags: [achalasia, diagnosis, manometry, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the diagnostic test of choice for esophageal motor disorders?"
    back: "Esophageal motility study (esophageal manometry)\n\nEsophageal manometry is used to diagnose abnormalities of peristalsis and decreased LES tone, and is indicated before surgical fundoplication."
    difficulty: easy
    tags: [esophageal motor disorders, diagnosis, manometry, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the three main esophageal motor disorders described?"
    back: "Achalasia, Scleroderma, and Distal Esophageal Spasm (DES)\n\nTable 3 outlines these three main esophageal motor disorders: achalasia (failure of LES relaxation), scleroderma (systemic disease), and DES (normal peristalsis with frequent spasms)."
    difficulty: easy
    tags: [esophageal motor disorders, achalasia, scleroderma, DES, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the pathophysiology of achalasia?"
    back: "Failure of smooth muscle relaxation at the lower esophageal sphincter (LES)\n\nAchalasia is characterized by failure of smooth muscle relaxation at the LES with swallowing, leading to impaired esophageal emptying."
    difficulty: medium
    tags: [achalasia, pathophysiology, esophageal motor disorder, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What infectious contacts and exposures should be asked about in fever evaluation?"
    back: "Travel history, camping, daycare contact, TB exposure, foodborne illness, animal exposure\n\nThese exposures help identify potential sources and guide investigations."
    difficulty: easy
    tags: [fever, infection, history, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is odynophagia?"
    back: "Pain on swallowing\n\nOdynophagia is distinct from dysphagia - it refers to painful swallowing rather than difficulty swallowing."
    difficulty: easy
    tags: [odynophagia, definition, symptoms, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the most common cause of mechanical esophageal stricture?"
    back: "Peptic stricture\n\nPeptic strictures from chronic GERD are the most common mechanical obstruction causing dysphagia to solids."
    difficulty: easy
    tags: [dysphagia, esophageal stricture, pathology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the diagnostic test of choice for esophageal motility disorders?"
    back: "Esophageal motility study (manometry)\n\nManometry is the gold standard for diagnosing esophageal motor disorders, though barium swallow can sometimes be helpful."
    difficulty: easy
    tags: [esophageal motility, diagnosis, investigations, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What does esophageal manometry evaluate?"
    back: "Abnormalities of peristalsis and/or decreased LES tone; cannot detect presence of reflux\n\nManometry assesses motility but not reflux. It's indicated before surgical fundoplication and to exclude alternatives like scleroderma and achalasia."
    difficulty: medium
    tags: [esophageal manometry, diagnosis, indications, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is surgical fundoplication?"
    back: "Wrapping of gastric fundus around the lower end of the esophagus\n\nFundoplication is a surgical treatment for GERD that wraps the gastric fundus around the distal esophagus to prevent reflux."
    difficulty: easy
    tags: [GERD, surgical treatment, fundoplication, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the function of lower esophageal sphincter (LES)?"
    back: "Prevents gastroesophageal reflux by maintaining tonic contraction at the gastroesophageal junction\n\nThe LES is a high-pressure zone that normally prevents stomach contents from refluxing into the esophagus."
    difficulty: easy
    tags: [LES, physiology, GERD, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the diagnostic test of choice for evaluating esophageal motility disorders?"
    back: "Esophageal manometry (esophageal motility study)\n\nEsophageal manometry is indicated to diagnose abnormalities of peristalsis and/or decreased LES tone. It cannot detect presence of reflux but is essential before surgical fundoplication."
    difficulty: easy
    tags: [esophageal motility, manometry, diagnosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the first-line treatment for achalasia?"
    back: "Pneumatic dilation or peroral endoscopic myotomy (POEM)\n\nA 2019 NEJM study showed POEM achieved 83% clinical success at 2 years vs 81.7% for laparoscopic Heller myotomy, establishing POEM as equivalent to surgery."
    difficulty: medium
    tags: [achalasia, treatment, POEM, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the characteristic manometry finding in distal esophageal spasm (DES)?"
    back: "Normal peristalsis interspersed with frequent simultaneous contractions\n\nDES is characterized by normal peristalsis interrupted by premature/simultaneous contractions, causing chest pain and dysphagia."
    difficulty: medium
    tags: [DES, manometry, motility disorder, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What esophageal abnormality is characteristic of scleroderma?"
    back: "Absent peristalsis in the esophageal body and decreased LES tone\n\nScleroderma affecting the esophagus leads to loss of smooth muscle function, causing reflux and dysphagia. It is a systemic disease causing progressive esophageal dysmotility."
    difficulty: medium
    tags: [scleroderma, motility, connective tissue disease, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What daily calcium intake is recommended for adults aged 65-69 years with 1 risk factor?"
    back: "1200 mg daily\n\nOlder adults with risk factors require higher calcium intake to maintain bone health."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What daily calcium intake is recommended for adults over 70 years with no risk factors?"
    back: "1000 mg daily\n\nEven without risk factors, elderly adults need at least 1000mg calcium daily for bone maintenance."
    difficulty: easy
    tags: [osteoporosis, calcium, elderly, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the calcium content of 1/2 cup yogurt?"
    back: "332 mg\n\nYogurt provides calcium comparable to milk, supporting bone health."
    difficulty: easy
    tags: [osteoporosis, nutrition, calcium, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What rare STIs are mentioned?"
    back: "Chancroid, granuloma inguinale, lymphogranuloma venereum\n\nThese tropical infections are rare in Canada but may be seen in travelers."
    difficulty: easy
    tags: [STI, rare-infections, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended Pap test screening schedule?"
    back: "Every 3 years for anyone with a cervix aged 25 to 69 who has ever been sexually active\n\nRegular Pap testing detects precancerous changes allowing early intervention."
    difficulty: easy
    tags: [HPV, cervical-cancer, screening, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What populations should be screened annually for gonorrhea and chlamydia?"
    back: "All sexually active people under 30 years old\n\nYoung sexually active individuals have the highest rates of these common bacterial STIs."
    difficulty: easy
    tags: [STI, screening, chlamydia, gonorrhea, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What types of exercises are recommended for osteoporosis prevention?"
    back: "Balance and muscle-strengthening exercises more than twice weekly\n\nRegular exercise improves bone strength and reduces fall risk."
    difficulty: easy
    tags: [osteoporosis, prevention, exercise, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What did the HOPE-3 trial find about statins in intermediate-risk patients?"
    back: "HOPE-3 (NEJM 2016): Rosuvastatin 10 mg daily in intermediate-risk patients without CVD reduced LDL by 26.5% and vascular events from 4.8% to 3.7%\n\nStatins benefit primary prevention in intermediate-risk patients regardless of baseline cholesterol levels."
    difficulty: medium
    tags: [cardiovascular, statins, primary prevention, landmark trial, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "For how long should patients abstain from intercourse after gonorrhea/chlamydia treatment?"
    back: "One week after treatment completion\n\nThis allows healing and reduces risk of reinfection or transmission to partners."
    difficulty: easy
    tags: [sexually transmitted infection, patient education, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the alternative oral treatment for chlamydia if doxycycline is contraindicated?"
    back: "Azithromycin 1 g PO single dose\n\nAzithromycin is an alternative but doxycycline is preferred due to better compliance and possibly greater efficacy."
    difficulty: easy
    tags: [sexually transmitted infection, chlamydia, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the first-line treatment for mastitis caused by Staphylococcus aureus?"
    back: "Cloxacillin 500 mg PO four times daily for 7 days\n\nS. aureus is the most common cause. Continue breastfeeding as milk flow helps clear infection; empty breasts completely."
    difficulty: easy
    tags: [infections, bacterial, mastitis, breast, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the recommended daily calcium requirements by age group in Canada?"
    back: "Age 19-50: 1000 mg/day; Age 50+ with no risk factors: 1200 mg/day; Age 65-69 with 1 risk factor: 1500 mg/day; Age >70: 1200 mg/day\n\nCalcium requirements increase with age due to decreased intestinal calcium absorption and increased bone loss."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What fall risk assessments are recommended for osteoporosis evaluation?"
    back: "Ability to get up from chair without support with arms, and walking several steps and return\n\nAssessing fall risk helps identify patients who would benefit from fall prevention interventions."
    difficulty: medium
    tags: [osteoporosis, fall-risk, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "Define achalasia"
    back: "Failure of smooth muscle relaxation at the lower esophageal sphincter (LES) with swallowing\n\nAchalasia is an idiopathic motor disorder characterized by impaired LES relaxation and absent peristalsis, causing dysphagia with both solids and liquids."
    difficulty: easy
    tags: [achalasia, esophageal motor disorder, pathophysiology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "Define distal esophageal spasm (DES)"
    back: "Normal peristalsis interspersed with frequent, simultaneous contractions in the distal esophagus\n\nDES is a rare motor disorder characterized by intermittent chest pain and dysphagia due to premature/ simultaneous contractions in the distal esophagus."
    difficulty: medium
    tags: [distal esophageal spasm, esophageal motor disorder, chest pain, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the gold standard treatment for achalasia?"
    back: "Peroral endoscopic myotomy (POEM) or laparoscopic Heller's myotomy\n\nBoth POEM and laparoscopic Heller myotomy are effective, with studies showing 80%+ clinical success at 2 years. POEM is now considered non-inferior to surgical myotomy."
    difficulty: medium
    tags: [achalasia, treatment, myotomy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the role of barium swallow in esophageal motility assessment?"
    back: "Can help identify structural abnormalities and sometimes motility issues, but manometry remains the gold standard\n\nBarium swallow is a complementary study that may reveal strictures, masses, or dramatic motility abnormalities but lacks the precision of manometry for diagnosing specific motor disorders."
    difficulty: medium
    tags: [barium swallow, diagnostic testing, esophageal disorders, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the daily calcium requirement for adults aged 50-64?"
    back: "1000 mg daily\n\nCalcium needs increase with age to maintain bone health and prevent osteoporosis."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the daily calcium requirement for adults over 50?"
    back: "1200 mg daily\n\nOlder adults require higher calcium intake to counteract age-related bone loss."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the physical exam findings in osteoporosis?"
    back: "Height loss annually (prospective >2 cm or historical >6 cm), rib-to-pelvis distance <2 fingers' breadth, occiput-to-wall distance >5 cm\n\nThese findings suggest vertebral compression fractures from osteoporosis."
    difficulty: medium
    tags: [osteoporosis, physical-exam, diagnosis, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the approach to fall risk assessment in osteoporosis patients?"
    back: "Ability to get up from chair without support with arms, and walking several steps and return\n\nThis tests functional mobility and balance, key components of fall risk."
    difficulty: easy
    tags: [osteoporosis, fall-risk, assessment, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the common STIs?"
    back: "Chlamydia, gonorrhea, HPV, genital herpes\n\nThese are the most frequently encountered STIs in clinical practice."
    difficulty: easy
    tags: [STI, epidemiology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the rare STIs?"
    back: "Chancroid, granuloma inguinale, lymphogranuloma venereum\n\nThese STIs are rare in Canada but may be seen in specific populations or travel contexts."
    difficulty: easy
    tags: [STI, epidemiology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended STI screening for sexually active people under 30?"
    back: "Annual screening for gonorrhea and chlamydia\n\nYoung sexually active individuals have highest rates of these bacterial STIs."
    difficulty: easy
    tags: [STI, gonorrhea, chlamydia, screening, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the key principle in STI management?"
    back: "Primary prevention is vastly more effective than treating STIs and their sequelae\n\nPrevention through vaccination, education, and barrier protection is superior to treatment."
    difficulty: easy
    tags: [STI, prevention, management, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the calcium content of 1 cup cooked broccoli?"
    back: "33 mg\n\nBroccoli provides calcium but in smaller amounts than dairy sources."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the calcium content of 1 medium orange?"
    back: "50 mg\n\nOranges provide modest calcium along with vitamin C."
    difficulty: easy
    tags: [osteoporosis, calcium, nutrition, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the T-score threshold for diagnosing osteoporosis?"
    back: "T-score ≤ -2.5\n\nThis WHO diagnostic criterion defines osteoporosis based on BMD measurement."
    difficulty: easy
    tags: [osteoporosis, diagnosis, T-score, BMD, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is osteopenia?"
    back: "T-score between -1.0 and -2.5\n\nOsteopenia represents low bone mass but not as severe as osteoporosis."
    difficulty: easy
    tags: [osteoporosis, osteopenia, diagnosis, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What were the SPRINT trial results regarding intensive BP control?"
    back: "Intensive treatment (target BP <120 mmHg) vs standard (<140 mmHg) resulted in significantly lower CV event rates: 1.65%/year vs 2.19%/year after 3 years\n\nSPRINT included patients with systolic BP >130 mmHg and high cardiovascular risk, excluding those with diabetes or prior stroke."
    difficulty: medium
    tags: [hypertension, clinical trial, SPRINT, cardiovascular, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What was the HOPE-3 trial conclusion regarding statins?"
    back: "Rosuvastatin 10mg daily in intermediate-risk patients without CV disease reduced LDL by 26.5% and vascular events from 4.8% to 3.7%\n\nThis trial supports statin use for primary prevention in intermediate-risk individuals."
    difficulty: medium
    tags: [cholesterol, statins, primary prevention, clinical trial, HOPE-3, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the recommended calcium intake for adults 65-69 years with 1 risk factor?"
    back: "1500 mg daily\n\nHigher calcium intake is recommended for older adults with additional risk factors for osteoporosis."
    difficulty: easy
    tags: [osteoporosis, calcium, elderly, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are the most common STIs in Canada in clinical practice?"
    back: "Chlamydia (most common), gonorrhea (2nd most common), HPV, genital herpes\n\nThese infections represent the bulk of STI burden in Canadian clinical practice."
    difficulty: easy
    tags: [sti, epidemiology, canada, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What are rare STIs?"
    back: "Chancroid, granuloma inguinale, lymphogranuloma venereum\n\nThese infections are rare in Canada but may be encountered in specific populations or travel contexts."
    difficulty: easy
    tags: [sti, epidemiology, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommendation for Pap test screening in Canada?"
    back: "Pap test every 3 years for anyone with a cervix aged 25 to 69 who has ever been sexually active\n\nCervical cancer screening guidelines have evolved to 3-year intervals with HPV co-testing as an option."
    difficulty: easy
    tags: [sti, hpv, cervical-cancer, screening, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the recommended annual STI screening?"
    back: "Annual screening for all sexually active people under 30 for gonorrhea and chlamydia\n\nYoung sexually active individuals have the highest rates of these bacterial STIs."
    difficulty: easy
    tags: [sti, screening, gonorrhea, chlamydia, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "What is the key principle of STI management?"
    back: "Primary prevention is vastly more effective than treating STIs and their sequelae\n\nPrevention through vaccination and education is superior to treatment of established infection."
    difficulty: easy
    tags: [sti, prevention, management, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "Who should receive the HPV vaccine (Gardasil)?"
    back: "Females between ages 9 to 27, and women 27+ if at risk of ongoing exposure\n\nHPV vaccination prevents cervical, vaginal, vulvar, and anal cancers as well as genital warts."
    difficulty: easy
    tags: [sti, hpv, vaccination, prevention, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "Define odynophagia"
    back: "Pain on swallowing\n\nOdynophagia is defined as pain on swallowing, distinct from dysphagia which is difficulty initiating or completing swallowing."
    difficulty: easy
    tags: [odynophagia, symptom, definition, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What diagnostic test is used to diagnose esophageal motor disorders?"
    back: "Esophageal manometry (motility study)\n\nEsophageal manometry (motility study) is used to diagnose esophageal motor disorders; barium swallow can sometimes help."
    difficulty: easy
    tags: [esophageal motor disorders, diagnosis, manometry, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the defining characteristic of achalasia?"
    back: "Failure of smooth muscle relaxation at the LES with swallowing\n\nAchalasia is defined by failure of smooth muscle relaxation at the LES with swallowing, causing impaired bolus transit."
    difficulty: easy
    tags: [achalasia, motility disorder, definition, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the POEM procedure compared to laparoscopic Heller myotomy?"
    back: "Peroral endoscopic myotomy (POEM) is non-inferior to laparoscopic Heller myotomy for achalasia treatment\n\nStudies show 83% of POEM patients and 81.7% of LHM patients achieved clinical success at 2 years, with POEM being non-inferior."
    difficulty: hard
    tags: [achalasia, treatment, comparative, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What dietary intervention is recommended for IBS with pain, bloating, gas, and diarrhea?"
    back: "Low FODMAP diet (Fermentable Oligo-, Di-, Monosaccharides And Polyols)\n\nLow FODMAP diet reduces fermentable carbohydrates that cause gas, bloating, and diarrhea in IBS patients."
    difficulty: easy
    tags: [IBS, treatment, diet, FODMAP, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "Which probiotics have evidence for improving IBS symptoms?"
    back: "Lactobacillus or Bifidobacterium species\n\nThese probiotic species have evidence for improving abdominal pain, bloating, and flatulence in IBS patients."
    difficulty: easy
    tags: [IBS, treatment, probiotics, microbiome, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the recommended fiber supplement for IBS-D?"
    back: "Soluble fiber (bran or psyllium) to increase stool consistency\n\nSoluble fiber can improve stool consistency in IBS-D but may worsen abdominal gas in some patients - evidence is controversial."
    difficulty: medium
    tags: [IBS-D, treatment, fiber, psyllium, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What stimulant laxatives are used for constipation and onset of action?"
    back: "Senna, bisacodyl - effective in 24 hours\n\nStimulant laxatives increase intestinal motility and are used when osmotic agents are insufficient."
    difficulty: easy
    tags: [constipation, treatment, stimulant laxatives, senna, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the mechanism and clinical use of linaclotide and plecanatide?"
    back: "Secretagogues that increase water secretion into intestinal lumen; used for IBS-C and chronic constipation\n\nThese medications activate guanylate cyclase-C receptor to increase chloride and water secretion."
    difficulty: medium
    tags: [constipation, treatment, linaclotide, plecanatide, secretagogues, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is tenapanor and how does it work?"
    back: "NHE3 (sodium-proton) inhibitor used for IBS-C and chronic constipation; reduces phosphate absorption and increases water secretion\n\nTenapanor inhibits the sodium-hydrogen exchanger to increase intestinal water content."
    difficulty: medium
    tags: [constipation, treatment, tenapanor, NHE3, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What painful anal conditions can cause constipation?"
    back: "Anal fissures\n\nPainful anal conditions can cause stool withholding due to pain, leading to constipation."
    difficulty: easy
    tags: [constipation, etiology, anal fissure, pain, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What enema and suppository options exist for constipation?"
    back: "Saline enema, phosphate enema, glycerin suppository, bisacodyl suppository\n\nRectal agents provide rapid relief and are useful for fecal impaction or acute constipation."
    difficulty: easy
    tags: [constipation, treatment, enema, suppository, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What neurologic conditions are associated with constipation?"
    back: "Intestinal pseudo-obstruction, Parkinson's disease, and multiple sclerosis\n\nNeurologic diseases can affect the autonomic innervation of the gut, impairing normal motility and defecation mechanisms."
    difficulty: medium
    tags: [Constipation, Neurologic, Parkinsons, MS, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What stimulant cathartics are used for constipation?"
    back: "Senna and bisacodyl - effective within 24 hours\n\nStimulant cathartics directly stimulate colonic motility. They are used for more severe or refractory constipation."
    difficulty: easy
    tags: [Constipation, Stimulants, Senna, Treatment, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "How do secretagogues like linaclotide and plecanatide work for constipation?"
    back: "They increase water secretion into the intestinal lumen\n\nThese medications activate guanylate cyclase-C receptors, leading to increased chloride and water secretion into the gut, softening stool."
    difficulty: medium
    tags: [Constipation, Secretagogues, Linaclotide, Plecanatide, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is tenapanor and how does it treat constipation?"
    back: "Tenapanor is an NHE3 (sodium-proton) inhibitor that reduces phosphate absorption and treats constipation\n\nNHE3 inhibitors work by inhibiting sodium-hydrogen exchange in the intestine, increasing water content in stool."
    difficulty: medium
    tags: [Constipation, Tenapanor, NHE3, Treatment, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What are treatment options for high-grade dysplasia in BE?"
    back: "Regular surveillance with intensive biopsy, endoscopic ablation/mucosal resection, or esophagectomy"
    difficulty: medium
    tags: [Barretts esophagus, treatment, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What diagnostic test is used for esophageal motor disorders?"
    back: "Esophageal manometry (motility study)"
    difficulty: easy
    tags: [esophageal motor disorders, diagnosis, manometry, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "How should low-grade dysplasia in BE be managed?"
    back: "Surveillance every 6 months for 1 year, then annually OR endoscopic ablation/resection are both satisfactory options"
    difficulty: medium
    tags: [Barretts esophagus, treatment, surveillance, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the treatment for mastitis caused by S. aureus?"
    back: "Cloxacillin 500 mg PO QID x 7 days\n\nCloxacillin is a penicillinase-resistant penicillin effective against S. aureus."
    difficulty: easy
    tags: [breast, mastitis, S. aureus, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for mastitis caused by S. pyogenes?"
    back: "Cephalexin 500 mg PO QID x 7 days\n\nCephalexin is a first-generation cephalosporin effective against group A streptococcus."
    difficulty: easy
    tags: [breast, mastitis, S. pyogenes, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What probiotics have evidence for improving IBS symptoms?"
    back: "Lactobacillus or Bifidobacterium species\n\nProbiotics can improve abdominal pain, bloating, and flatulence in IBS patients."
    difficulty: medium
    tags: [IBS, probiotics, treatment, microbiome, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the recommended treatment for IBS-C (IBS with constipation)?"
    back: "Increase soluble fiber (may increase bloating); PEG 3350 can alter stool form; linaclotide, plecanatide, or tenapanor as secretagogues; osmotic laxatives for constipation relief\n\nPEG 3350 improves stool form but has no evidence for helping abdominal pain in IBS-C."
    difficulty: medium
    tags: [IBS, IBS-C, constipation, treatment, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the mechanism of action of the Dukoral vaccine?"
    back: "Provides protection against Vibrio cholerae (80% efficacy) and ETEC (50-67% efficacy)\n\nDukoral is an oral cholera vaccine that provides partial protection against both cholera and enterotoxigenic E. coli, the most common cause of traveler's diarrhea."
    difficulty: medium
    tags: [vaccines, travel-medicine, prevention, toronto-notes, pages-0451-0452-0453-0454-0455-0456-0457-0458-0459-0460]
  - front: "What is the definition of hemochromatosis in terms of iron stores?"
    back: "Excessive iron storage causing multiorgan dysfunction with total body iron stores increased to 20-40g (normal ~1g)\n\nThe excess iron deposits primarily in the liver, but also pancreas, heart, and pituitary gland."
    difficulty: easy
    tags: [hemochromatosis, definition, iron metabolism, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the standard drink equivalent in grams of ethanol?"
    back: "14g ethanol = 1 standard drink\n\nExamples: 12oz beer (5% alcohol), 5oz wine (12-17%), 1.5oz spirits (40%)."
    difficulty: easy
    tags: [alcohol, nutrition, standard drink, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the pathophysiological mechanism by which ethanol causes fatty liver?"
    back: "Ethanol oxidation to acetaldehyde reduces NAD+ to NADH; increased NADH decreases ATP supply, impairing lipolysis so fatty acids and triglycerides accumulate in hepatocytes\n\nEthanol also increases gut permeability, leading to bacterial translocation and relative hypoxia in liver zone III."
    difficulty: hard
    tags: [alcoholic liver disease, pathophysiology, metabolism, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the incidence of Wilson's disease worldwide?"
    back: "1 in 40,000\n\nIt is an autosomal recessive disorder most common in populations with higher consanguinity rates."
    difficulty: easy
    tags: [wilsons disease, epidemiology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the markers of advanced fibrosis in hemochromatosis that would indicate liver biopsy is needed?"
    back: "Age >40, elevated liver enzymes, or serum ferritin >1000 ng/mL at diagnosis\n\nIf a patient is C282Y/C282Y homozygous without these markers, biopsy is generally not needed."
    difficulty: hard
    tags: [hemochromatosis, liver biopsy, fibrosis, diagnosis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "Why is MRI often used instead of liver biopsy in hemochromatosis?"
    back: "MRI is non-invasive, highly sensitive and specific for iron overload, and can be used to monitor treatment response to phlebotomy\n\nMRI can quantify hepatic iron content without the risks of biopsy."
    difficulty: medium
    tags: [hemochromatosis, MRI, diagnosis, imaging, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the treatment for achalasia?"
    back: "Options include pneumatic dilation, botulinum toxin injection, surgical myotomy (Heller), or peroral endoscopic myotomy (POEM)\n\nRecent RCT (NEJM 2019) showed POEM is non-inferior to laparoscopic Heller myotomy with 83% clinical success at 2 years."
    difficulty: easy
    tags: [achalasia, treatment, POEM, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the gold standard diagnostic test for Wilson's disease?"
    back: "Liver biopsy with quantitative copper assay (increased copper content)\n\nLiver biopsy with quantitative copper measurement is the gold standard, showing increased copper deposition in hepatocytes."
    difficulty: medium
    tags: [Wilsons disease, diagnosis, biopsy, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the definition of hemochromatosis?"
    back: "Excessive iron storage causing multiorgan dysfunction, with total body iron stores increased to 20-40g (normal ~1g)\n\nHemochromatosis causes iron deposition primarily in the liver, heart, pancreas, and pituitary, leading to end-organ damage."
    difficulty: easy
    tags: [Hemochromatosis, iron overload, definition, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the screening criteria for hemochromatosis?"
    back: "Transferrin saturation >45% OR serum ferritin >400 ng/mL\n\nElevated transferrin saturation and ferritin are the initial screening tests. HFE gene analysis is then performed, with C282Y allele involved in 90% of cases."
    difficulty: medium
    tags: [Hemochromatosis, screening, diagnosis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the pathophysiology of ethanol-induced liver injury related to NAD+/NADH ratio?"
    back: "Ethanol oxidation to acetaldehyde reduces NAD+ to NADH, decreasing ATP supply and impairing lipolysis, leading to accumulation of fatty acids and triglycerides in hepatocytes\n\nThe shift in NAD+/NADH ratio disrupts normal hepatic lipid metabolism, causing fat accumulation in hepatocytes."
    difficulty: hard
    tags: [Alcoholic liver disease, pathophysiology, metabolism, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the components of the 'triad' in alcoholic liver disease pathophysiology?"
    back: "Increased gut permeability from ethanol → increased bacterial translocation → immune-mediated liver injury\n\nEthanol increases intestinal permeability, allowing bacterial endotoxins to reach the liver and trigger inflammatory responses."
    difficulty: hard
    tags: [Alcoholic liver disease, pathophysiology, immunology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "A 25-year-old presents with tremor and dystonia. Exam shows brown rings around the cornea. Liver enzymes are elevated. What is the most likely diagnosis?"
    back: "Wilson's disease with CNS involvement\n\nYoung patient with movement disorder (dystonia, tremor) and Kayser-Fleischer rings is highly suggestive of Wilson's disease. The combination of liver disease with neurological manifestations is classic."
    difficulty: medium
    tags: [Wilsons disease, case, clinical reasoning, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "A patient with bronze skin, diabetes, and arthralgia has ferritin of 800 ng/mL and transferrin saturation of 60%. What is the most likely diagnosis?"
    back: "Hereditary hemochromatosis\n\nThe classic triad of bronze skin, diabetes, and arthropathy along with markedly elevated ferritin and transferrin saturation is classic for hereditary hemochromatosis."
    difficulty: medium
    tags: [Hemochromatosis, case, clinical reasoning, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the standard drink equivalent calculation for alcohol content?"
    back: "1 standard drink = 14g ethanol = 12oz beer (5%), 5oz wine (12-17%), 1.5oz spirits (40%)\n\nUnderstanding standard drink equivalents is important for counseling patients and assessing alcohol use disorder."
    difficulty: easy
    tags: [Alcohol, nutrition, education, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What gene mutations are associated with hereditary hemochromatosis?"
    back: "Mainly HFE gene mutations: C282Y/C282Y (most common), C282Y/H63D (compound heterozygote), S65C\n\nThe homozygous C282Y mutation has a prevalence of 1/400 but incomplete penetrance. H63D and S65C are other common alleles screened."
    difficulty: medium
    tags: [Hemochromatosis, genetics, HFE, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the preferred treatment for Wilson's disease with hepatic presentation?"
    back: "Trientine + zinc combination\n\nThis combination provides effective copper chelation while zinc prevents copper reabsorption and acts as maintenance therapy."
    difficulty: medium
    tags: [Wilsons disease, treatment, hepatology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are markers of advanced fibrosis in hemochromatosis that would indicate liver biopsy?"
    back: "Age >40, elevated liver enzymes, or serum ferritin >1000 ng/mL at diagnosis\n\nThe presence of any of these markers suggests advanced disease and may influence treatment decisions."
    difficulty: hard
    tags: [Hemochromatosis, fibrosis, biopsy, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "Why may ferritin never normalize in treated hemochromatosis?"
    back: "Other causes of elevated ferritin may coexist, such as fatty liver from metabolic syndrome or alcohol use\n\nFerritin is an acute phase reactant and can be elevated for reasons other than iron overload, requiring careful interpretation."
    difficulty: hard
    tags: [Hemochromatosis, diagnosis, ferritin, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "Why is iron screening important in young patients with liver disease?"
    back: "Because Wilson's disease and hemochromatosis can present with elevated liver enzymes at young age (<40)\n\nBoth genetic iron and copper storage disorders should be considered in the differential diagnosis of young patients with unexplained liver disease."
    difficulty: medium
    tags: [Screening, young patients, differential diagnosis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are secretagogues (linaclotide, plecanatide) and how do they work?"
    back: "Secretagogues increase water secretion into the intestinal lumen\n\nLinaclotide and plecanatide are guanylate cyclase-C agonists that increase intestinal fluid secretion, softening stool and accelerating transit."
    difficulty: medium
    tags: [Constipation, Secretagogues, Linaclotide, Plecanatide, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the clinical presentation of overflow diarrhea in constipation?"
    back: "Liquid stool bypassing hard fecal impaction, presenting as diarrhea in a patient with underlying constipation\n\nOverflow diarrhea occurs when liquid stool leaks around hard, impacted feces in the colon, often mistaken for primary diarrhea."
    difficulty: hard
    tags: [Constipation, Overflow Diarrhea, Fecal Impaction, Clinical Presentation, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What stimulant cathartics are used for constipation and their onset?"
    back: "Senna, bisacodyl - effective in 24 hours\n\nStimulants directly stimulate colonic motility and are used for more severe constipation."
    difficulty: easy
    tags: [Constipation, Treatment, Stimulant Laxatives, Cathartics, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What secretagogues are used for constipation and how do they work?"
    back: "Linaclotide and plecanatide - increase water secretion into intestinal lumen\n\nThese medications activate guanylate cyclase C receptors, increasing intestinal fluid secretion."
    difficulty: medium
    tags: [Constipation, Treatment, Secretagogues, Linaclotide, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is Hemochromatosis?"
    back: "Excessive iron storage causing multiorgan dysfunction (particularly liver), with total body iron stores increased to 20-40g (normal ~1g)\n\nHemochromatosis is an iron overload disorder affecting multiple organs, most prominently the liver."
    difficulty: easy
    tags: [hemochromatosis, iron-overload, genetic-disorder, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the screening tests for hemochromatosis?"
    back: "Transferrin saturation >45%, serum ferritin >400 ng/mL, and HFE gene analysis (C282Y, H63D, S65C alleles)\n\nTransferrin saturation and ferritin are the initial screening tests. HFE gene analysis identifies the common causative mutations."
    difficulty: medium
    tags: [hemochromatosis, diagnosis, screening, ferritin, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the role of MRI in hemochromatosis evaluation?"
    back: "Non-invasive assessment of iron overload; most sensitive and specific modality; can be used to follow treatment response to phlebotomy\n\nMRI has largely replaced liver biopsy for diagnosis and monitoring of iron overload due to its non-invasive nature and accuracy."
    difficulty: medium
    tags: [hemochromatosis, diagnosis, mri, imaging, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the standard drink equivalent in Canada?"
    back: "1 standard drink = 14g ethanol = 12oz beer (5%), 5oz wine (12-17%), or 1.5oz spirits (40%)\n\nUnderstanding standard drink equivalents is essential for counseling patients about alcohol consumption."
    difficulty: easy
    tags: [alcohol-liver-disease, prevention, standard-drink, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the pathophysiology of ethanol-induced liver injury?"
    back: "Ethanol oxidation to acetaldehyde reduces NAD+ to NADH, decreasing ATP and causing fat accumulation; EtOH increases gut permeability leading to bacterial translocation; zone III relative hypoxia causes necrosis\n\nMultiple mechanisms contribute: metabolic stress from NADH accumulation, immune activation from bacterial endotoxins, and hypoxia in the liver centrilobular region."
    difficulty: hard
    tags: [alcohol-liver-disease, pathophysiology, metabolism, nad, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What imaging modality is preferred for diagnosing hemochromatosis?"
    back: "MRI - non-invasive assessment of iron overload, most sensitive and specific, can monitor treatment response\n\nMRI can quantify hepatic iron content and is often used instead of liver biopsy to assess iron overload and follow treatment."
    difficulty: medium
    tags: [hemochromatosis, diagnosis, MRI, imaging, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the pathophysiology of alcohol-induced hepatic steatosis?"
    back: "Ethanol oxidation to acetaldehyde reduces NAD+ to NADH; increased NADH decreases ATP supply, impairing lipolysis so fatty acids and triglycerides accumulate in hepatocytes\n\nThe shift in NAD+/NADH ratio disrupts normal lipid metabolism, causing fat accumulation (steatosis) which is reversible with abstinence."
    difficulty: hard
    tags: [alcoholic liver disease, pathophysiology, steatosis, metabolism, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the 24-hour urinary copper excretion rate in Wilson's disease?"
    back: "Increased - typically >100 mcg/24hr (normal <50 mcg/24hr)\n\nElevated urinary copper is one of the screening tests for Wilson's disease and reflects the body's attempt to excrete excess copper."
    difficulty: medium
    tags: [Wilsons disease, diagnosis, copper, urinary, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the target ferritin level during maintenance phlebotomy for hemochromatosis?"
    back: "50-100 ng/mL\n\nThis target range maintains iron stores at normal levels while avoiding iron deficiency. Lifelong maintenance phlebotomies are typically required."
    difficulty: medium
    tags: [hemochromatosis, treatment, phlebotomy, ferritin, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "In what population is hereditary hemochromatosis most common?"
    back: "Northern European descent\n\nThis reflects the high prevalence of HFE gene mutations in this population. The C282Y mutation is particularly common in people of Northern European ancestry."
    difficulty: easy
    tags: [hemochromatosis, epidemiology, genetics, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the inheritance pattern of Wilson's disease?"
    back: "Autosomal recessive\n\nBoth parents must be carriers (heterozygous) for a child to be affected. First-degree relatives should be screened for the disease."
    difficulty: easy
    tags: [Wilsons disease, genetics, inheritance, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the typical age of presentation for Wilson's disease?"
    back: "<40 years old\n\nWilson's disease should be suspected in any patient with unexplained liver disease under age 40, especially with neurological or psychiatric symptoms."
    difficulty: easy
    tags: [Wilsons disease, epidemiology, presentation, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the incidence of the C282Y homozygous genotype for hemochromatosis?"
    back: "1 in 400\n\nThe homozygous C282Y mutation has a prevalence of 1/400, but incomplete penetrance means not everyone with this genotype develops clinical disease."
    difficulty: medium
    tags: [hemochromatosis, genetics, epidemiology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the percentage of hemochromatosis caused by the C282Y allele?"
    back: "90%\n\nThe C282Y allele is responsible for approximately 90% of primary hemochromatosis cases. H63D and S65C alleles are less common but also involved."
    difficulty: medium
    tags: [hemochromatosis, genetics, HFE gene, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the first-line treatment for primary hemochromatosis?"
    back: "Phlebotomy\n\nPhlebotomy is highly effective for primary (hereditary) hemochromatosis. Weekly or biweekly phlebotomy is performed until ferritin normalizes, then maintenance phlebotomy q2-6 months."
    difficulty: easy
    tags: [hemochromatosis, treatment, phlebotomy, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the main difference between primary and secondary hemochromatosis treatment?"
    back: "Primary responds well to phlebotomy; secondary usually requires chelation therapy\n\nSecondary hemochromatosis often cannot be treated with phlebotomy due to concurrent anemia, so chelation (deferoxamine, deferasirox) is preferred."
    difficulty: medium
    tags: [hemochromatosis, treatment, phlebotomy, chelation, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the three hits in alcoholic liver disease pathogenesis (the triad)?"
    back: "1) Increased gut permeability from EtOH leading to bacterial translocation; 2) Relative hypoxia in liver zone III (centrilobular); 3) Necrosis and hepatic vein sclerosis\n\nThis triad explains why alcoholic liver injury predominantly affects the centrilobular (zone III) region of the liver acinus."
    difficulty: hard
    tags: [alcoholic liver disease, pathophysiology, alcohol, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the first-line treatment for Primary Biliary Cholangitis?"
    back: "Ursodeoxycholic acid (UDCA)\n\nUDCA improves prognosis and is first-line therapy. Obeticholic acid is added if response is inadequate. Cholestyramine treats pruritus and hypercholesterolemia."
    difficulty: easy
    tags: [PBC, treatment, UDCA, ursodiol, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "How does Primary Sclerosing Cholangitis (PSC) differ from PBC in terms of affected ducts?"
    back: "PSC affects both intra- and extrahepatic ducts; PBC affects intrahepatic ducts only\n\nPSC shows narrowing and dilatations of both intra- and extrahepatic ducts on MRCP, while PBC shows absence of duct narrowing."
    difficulty: medium
    tags: [PSC, PBC, cholangiopathy, differential, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is Charcot's triad?"
    back: "Fever, RUQ pain, jaundice\n\nCharcot's triad is present in 50-70% of patients with ascending cholangitis and indicates biliary infection."
    difficulty: easy
    tags: [cholangitis, Charcots triad, clinical signs, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is Reynolds' pentad?"
    back: "Fever, RUQ pain, jaundice, hypotension, altered mental status\n\nReynolds' pentad indicates suppurative cholangitis and carries high mortality (~50%)."
    difficulty: easy
    tags: [cholangitis, Reynolds pentad, severe cholangitis, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is the most important treatment for ascending cholangitis?"
    back: "Drainage (ideally via ERCP)\n\nERCP is preferred for drainage. If not possible, percutaneous biliary drainage or surgical routes (least common) are alternatives."
    difficulty: easy
    tags: [cholangitis, treatment, ERCP, drainage, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "When serum amylase >5x normal, what is the almost certain cause?"
    back: "Pancreatitis or renal insufficiency\n\nMarkedly elevated amylase (>5x normal) is almost always due to pancreatitis or renal failure/macrolipasemia."
    difficulty: medium
    tags: [amylase, pancreatitis, diagnosis, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What are the two most common causes of acute pancreatitis?"
    back: "Gallstones (45%) and ethanol (35%)\n\nTogether, gallstones and alcohol account for approximately 80% of acute pancreatitis cases. The mnemonic GET SMASHED helps recall other causes."
    difficulty: easy
    tags: [pancreatitis, etiology, gallstones, alcohol, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "Wilson's disease is caused by a defect in which gene and inheritance pattern?"
    back: "Autosomal recessive defect in the ATP7B gene\n\nThe ATP7B gene mutation causes decreased biliary copper excretion and reduced incorporation of copper into ceruloplasmin. Incidence is approximately 1 in 40,000 worldwide."
    difficulty: easy
    tags: [wilsons-disease, genetics, hepatology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the triad of extrahepatic manifestations of Wilson's Disease involving the eyes, blood, and kidneys?"
    back: "Kayser-Fleischer rings (eyes), intravascular hemolysis (blood), and Fanconi's syndrome with stones (kidneys)\n\nKayser-Fleischer rings are present in ~50% of isolated liver involvement cases. Hemolysis may be the initial presentation in fulminant hepatitis. Fanconi's syndrome involves proximal tubule transport defects."
    difficulty: hard
    tags: [wilsons-disease, multisystem, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "Hemochromatosis is characterized by excessive iron storage. What are the total body iron stores in affected patients versus normal?"
    back: "Total body iron stores are increased to 20-40g (normal is approximately 1g)\n\nThis massive iron overload causes multiorgan dysfunction, particularly affecting the liver, heart, pancreas, and pituitary gland."
    difficulty: easy
    tags: [hemochromatosis, pathophysiology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the standard drink equivalent for alcohol content calculations?"
    back: "1 standard drink = 14g ethanol = 12oz beer (5% alcohol), 5oz wine (12-17%), or 1.5oz spirits (17-22%)\n\nThis standardized measure is used to assess alcohol consumption in patients with alcohol-related liver disease. The mnemonic 'oz × % × 0.789' approximates grams of ethanol."
    difficulty: easy
    tags: [alcohol-liver-disease, epidemiology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the key pathophysiological mechanisms in alcohol-related liver disease?"
    back: "Ethanol oxidation to acetaldehyde: reduces NAD+ to NADH, increasing NADH decreases ATP supply impairing lipolysis causing fatty acid/triglyceride accumulation. EtOH also increases gut permeability leading to bacterial translocation. Zone III relative hypoxia causes necrosis and hepatic vein sclerosis.\n\nThe NADH/NAD+ ratio shift is central to fat accumulation. The triad of increased gut permeability, bacterial translocation, and immune response drives inflammation."
    difficulty: hard
    tags: [alcohol-liver-disease, pathophysiology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "A patient with transferrin saturation 55% and ferritin 600 ng/mL is diagnosed with hereditary hemochromatosis (C282Y/C282Y). There are no markers of advanced fibrosis. What is the most appropriate management?"
    back: "Start phlebotomy therapy; liver biopsy is not required\n\nIn C282Y/C282Y homozygous patients without markers of advanced fibrosis (age <40, normal LFTs, ferritin <1000), liver biopsy is not needed. Phlebotomy should be started weekly or every 2 weeks."
    difficulty: hard
    tags: [hemochromatosis, treatment, clinical, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the inheritance pattern and gene involved in Wilson's Disease?"
    back: "Autosomal recessive, ATP7B gene\n\nBoth parents must be carriers. The ATP7B gene codes for a copper-transporting ATPase. Over 500 mutations have been identified."
    difficulty: easy
    tags: [wilsons-disease, genetics, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "In which population is classic hereditary hemochromatosis most common?"
    back: "Northern European descent\n\nThe high prevalence in Northern Europeans relates to the common C282Y HFE mutation founder effect."
    difficulty: easy
    tags: [hemochromatosis, epidemiology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "How does PSC differ from PBC in terms of affected ducts?"
    back: "PSC affects both intra- and extrahepatic ducts; PBC affects only intrahepatic ducts\n\nThis is a key distinguishing feature. PSC shows narrowing and dilatations of both intra- and extrahepatic ducts on MRCP, while PBC involves only intrahepatic ducts."
    difficulty: medium
    tags: [PSC, PBC, bile ducts, differential diagnosis, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is the cutoff for triglycerides causing pancreatitis?"
    back: "TG >11.3 mmol/L (>1000 mg/dL)\n\nSevere hypertriglyceridemia is a recognized cause of acute pancreatitis. Marked elevations above this threshold can precipitate attacks."
    difficulty: easy
    tags: [pancreatitis, hyperlipidemia, triglycerides, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is the prognosis of ascending cholangitis with Reynolds' pentad?"
    back: "High mortality (~50%)\n\nReynolds' pentad indicates suppurative cholangitis with sepsis (hypotension, altered mental status), representing a medical emergency with high mortality despite treatment."
    difficulty: easy
    tags: [cholangitis, prognosis, Reynolds pentad, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is the treatment for PBC with inadequate response to ursodiol?"
    back: "Obeticholic acid\n\nObeticholic acid is an FXR agonist approved for use in combination with ursodiol or as monotherapy when ursodiol is inadequate."
    difficulty: easy
    tags: [PBC, treatment, obeticholic acid, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What is the worldwide incidence of Wilson's disease?"
    back: "1 in 40,000\n\nWilson's disease is a rare autosomal recessive disorder with an incidence of approximately 1 in 40,000 worldwide."
    difficulty: easy
    tags: [wilsons-disease, epidemiology, hepatology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the genetic basis of classic hereditary hemochromatosis?"
    back: "HFE gene mutations (primarily C282Y/C282Y homozygous, also C282Y/H63D compound heterozygote)\n\nMost hereditary hemochromatosis involves HFE gene mutations, with C282Y/C282Y being most common, particularly in Northern European populations. The mutation causes decreased hepcidin production, leading to increased iron absorption."
    difficulty: medium
    tags: [hemochromatosis, genetics, hepatology, iron-metabolism, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "Which population has the highest prevalence of hereditary hemochromatosis?"
    back: "Northern European descent\n\nHereditary hemochromatosis, particularly the C282Y HFE mutation, is most common in individuals of Northern European ancestry, with a homozygous prevalence of approximately 1 in 400."
    difficulty: easy
    tags: [hemochromatosis, epidemiology, hepatology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are markers of advanced fibrosis in hemochromatosis that warrant liver biopsy?"
    back: "Age >40, elevated liver enzymes, or serum ferritin >1000 ng/mL at diagnosis\n\nThe presence of any of these markers suggests advanced disease and warrants liver biopsy to assess fibrosis stage and guide management."
    difficulty: medium
    tags: [hemochromatosis, diagnosis, hepatology, fibrosis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is a standard drink equivalent in grams of ethanol?"
    back: "14 grams of ethanol\n\nOne standard drink contains 14 grams of pure ethanol, equivalent to 12 oz of 5% beer, 5 oz of 12-17% wine, or 1.5 oz of 40% spirits."
    difficulty: easy
    tags: [alcoholic-liver-disease, hepatology, prevention, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "Explain the mechanism by which ethanol metabolism causes fatty liver"
    back: "Ethanol oxidation to acetaldehyde reduces NAD+ to NADH, decreasing ATP supply and impairing lipolysis, causing accumulation of fatty acids and triglycerides in hepatocytes\n\nThe shift in NAD+/NADH ratio during ethanol metabolism disrupts normal hepatic lipid metabolism, promoting triglyceride accumulation and fatty liver."
    difficulty: hard
    tags: [alcoholic-liver-disease, pathophysiology, hepatology, metabolism, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the 'triad' in alcoholic liver disease pathophysiology?"
    back: "Ethanol increases gut permeability leading to increased bacterial translocation\n\nAlcohol disrupts the intestinal barrier, increasing permeability and allowing bacterial endotoxins to enter the portal circulation, triggering inflammation and liver injury."
    difficulty: hard
    tags: [alcoholic-liver-disease, pathophysiology, hepatology, microbiome, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "In the PREDESCI trial, what was the hazard ratio for the primary endpoint (decompensation or death) in the beta-blocker group vs placebo?"
    back: "HR 0.51 (95% CI 0.26-0.97, P=0.041)\n\nThe primary endpoint occurred in 16% of patients in the beta-blockers group versus 27% in the placebo group, showing statistical significance."
    difficulty: hard
    tags: [cirrhosis, beta-blockers, PREDESCI trial, clinical trials, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "Which beta-blockers were used in the PREDESCI trial?"
    back: "Propranolol or Carvedilol\n\nPatients were randomly assigned to placebo or active treatment with either propranolol or carvedilol to test if lowering hepatic venous pressure gradient decreases decompensation risk."
    difficulty: medium
    tags: [propranolol, carvedilol, beta-blockers, PREDESCI trial, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What was the sample size of the PREDESCI trial?"
    back: "201 patients\n\n201 patients with compensated cirrhosis and clinically significant portal hypertension were randomly assigned to placebo or active treatment groups."
    difficulty: easy
    tags: [PREDESCI trial, clinical trials, cirrhosis, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What are the clinical features and management approaches for celiac disease?"
    back: "Celiac disease is an immune-mediated enteropathy triggered by gluten exposure in genetically susceptible individuals, managed with lifelong gluten-free diet\n\nA comprehensive review (BMC Med 2019) covers the pathophysiology, clinical presentation, diagnosis (serology, biopsy), and treatment of celiac disease"
    difficulty: medium
    tags: [celiac disease, gluten, autoimmune, enteropathy, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What are the key features and outcomes of drug-induced liver injury (DILIN)?"
    back: "The DILIN prospective study characterizes the features, outcomes, and causes of drug-induced liver injury in a large patient cohort\n\nThe DILIN study (Gastroenterology 2015) analyzed 899 patients with DILIN, providing data on patterns, severity, and prognostic factors"
    difficulty: hard
    tags: [DILI, hepatotoxicity, drug injury, liver, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What are the ACG clinical guidelines for chronic pancreatitis management?"
    back: "The ACG guidelines provide evidence-based recommendations for chronic pancreatitis diagnosis, pain management, enzyme replacement, and nutritional support\n\nThe 2020 ACG clinical guidelines (Am J Gastroenterol 2020) cover comprehensive management including lifestyle modifications, endoscopic therapy, and surgical options"
    difficulty: hard
    tags: [chronic pancreatitis, ACG guidelines, pancreas, pain management, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What are the Rome III criteria for functional gastrointestinal disorders?"
    back: "The Rome III criteria standardize the diagnosis of functional GI disorders including IBS, functional dyspepsia, and functional constipation\n\nThe Rome III process (Gastroenterology 2006) established diagnostic criteria based on symptoms, duration, and exclusion of organic disease"
    difficulty: medium
    tags: [Rome criteria, IBS, functional GI disorders, diagnosis, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "When serum amylase is >5x normal, what are the most likely causes?"
    back: "Acute pancreatitis or renal insufficiency\n\nMarkedly elevated amylase (>5 times normal) almost always indicates pancreatitis or renal failure."
    difficulty: easy
    tags: [amylase, pancreatitis, diagnosis, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What parasites can cause Acute Pancreatitis?"
    back: "Ascariasis, clonorchiasis, echinococcosis\n\nParasitic infections are an uncommon but recognized cause of pancreatitis, included in the infectious etiologies."
    difficulty: medium
    tags: [pancreatitis, parasites, infection, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "In the PREDESCI trial, what was the incidence of the primary endpoint (decompensation or death) in the beta-blocker group vs placebo?"
    back: "16% in beta-blocker group vs 27% in placebo group\n\nThe primary endpoint occurred in 16% of patients in the beta-blockers group compared to 27% in the placebo group, with HR 0.51 (95% CI 0.26-0.97, P=0.041)."
    difficulty: medium
    tags: [cirrhosis, beta-blockers, clinical trial, hepatology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What was the hazard ratio for decompensation in the PREDESCI trial?"
    back: "HR 0.51 (95% CI 0.26-0.97), P=0.041\n\nBeta-blockers significantly reduced the risk of cirrhosis decompensation or death compared to placebo in patients with clinically significant portal hypertension."
    difficulty: medium
    tags: [cirrhosis, beta-blockers, clinical trial, statistics, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What medications were used in the PREDESCI trial for active treatment?"
    back: "Propranolol or carvedilol\n\n201 patients were randomly assigned to placebo or active treatment with propranolol or carvedilol in this multicenter randomized controlled trial."
    difficulty: easy
    tags: [beta-blockers, propranolol, carvedilol, clinical trial, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is the mortality rate for ARDS?"
    back: "30-40%, usually due to non-pulmonary complications\n\nMost deaths are from sepsis, multiple organ failure, or other complications rather than primary respiratory failure."
    difficulty: easy
    tags: [ARDS, mortality, prognosis, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "A patient with PaO2/FiO2 = 150 on PEEP 8 has ARDS. What is the severity category?"
    back: "Moderate ARDS (PaO2/FiO2 100-200)\n\nUsing Berlin criteria: 100-200 = moderate, associated with ~32% mortality."
    difficulty: medium
    tags: [ARDS, Berlin criteria, severity classification, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "Does high-frequency oscillatory ventilation reduce mortality in ARDS?"
    back: "No - it increases mortality (47% vs 35% control, RR 1.33)\n\nOSCILLATE 2013: HFOV increased in-hospital mortality, p=0.005"
    difficulty: medium
    tags: [ARDS, HFOV, negative trial, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What is the mortality benefit of prone positioning in severe ARDS?"
    back: "28-day mortality reduced from 32.8% to 16% (HR 0.39)\n\nPROSEVA 2013: Early prone positioning >16h/day reduced 28-day and 90-day mortality"
    difficulty: medium
    tags: [ARDS, prone positioning, mortality, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What patient population has increased risk with salmeterol?"
    back: "African American patients not using inhaled corticosteroids\n\nSMART 2006: Increased respiratory-related deaths particularly in African Americans without baseline ICS use"
    difficulty: medium
    tags: [asthma, salmeterol, health disparities, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What magnitude of exacerbation reduction does tezepelumab provide?"
    back: "62-71% reduction in annualized exacerbation rate\n\nPATHWAY 2017: Tezepelumab at three dose levels showed significant reductions vs placebo, p<0.001"
    difficulty: medium
    tags: [asthma, tezepelumab, exacerbations, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "How does budesonide-formoterol as-needed compare to SABA alone for exacerbation prevention?"
    back: "49% reduction in annualized exacerbation rate (RR 0.49)\n\nSTART 2019: budesonide-formoterol prn was superior to albuterol alone, p<0.01"
    difficulty: medium
    tags: [asthma, maintenance and reliever therapy, MART, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What is the key finding of the ARDS Network tidal volume trial?"
    back: "Lower tidal volume (6 mL/kg) reduces mortality and increases ventilator-free days in ARDS\n\nLandmark trial establishing lung-protective ventilation as standard of care for ARDS"
    difficulty: easy
    tags: [ARDS, lung-protective ventilation, landmark trial, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "In which ARDS patients is prone positioning beneficial?"
    back: "Patients with severe ARDS (PaO2/FiO2 < 150)\n\nPROSEVA trial enrolled patients with severe ARDS and showed significant mortality benefit with early prone positioning"
    difficulty: medium
    tags: [ARDS, prone positioning, severity, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What autoantibody is highly specific for SLE and present in 50-70% of patients?"
    back: "Anti-dsDNA\n\nAnti-dsDNA levels can correlate with disease activity and SLE flares."
    difficulty: easy
    tags: [sle, autoantibodies, anti-dsDNA, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the prevalence of ANA in SLE patients?"
    back: "98%\n\nANA has high sensitivity for SLE; high titres (≥1:640) are more specific."
    difficulty: easy
    tags: [sle, ana, autoantibodies, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "Which autoantibody is highly specific for drug-induced SLE?"
    back: "Anti-Histone\n\nAnti-Histone antibodies are present in 95% of drug-induced SLE cases."
    difficulty: easy
    tags: [sle, drug-induced, autoantibodies, anti-histone, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "Which autoantibody is associated with neonatal lupus syndrome and congenital heart block?"
    back: "Anti-Ro (SSA)\n\nAnti-Ro antibodies present during pregnancy increase risk of neonatal lupus syndrome and congenital heart block in the fetus."
    difficulty: easy
    tags: [sle, neonatal-lupus, anti-Ro, autoantibodies, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "In the 2010 ACR/EULAR RA criteria, what is the score for positive RF and positive Anti-CCP at high titre?"
    back: "3 points\n\nSerology scoring: negative RF and negative Anti-CCP = 0, low-positive RF or Anti-CCP = 2, high-positive RF or Anti-CCP = 3."
    difficulty: medium
    tags: [rheumatoid-arthritis, acr-eular-criteria, classification, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the most specific autoantibody for Antiphospholipid Syndrome?"
    back: "Lupus Anticoagulant (LAC)\n\nLAC, along with anticardiolipin (aCLA) and anti-β2 glycoprotein I (aβ2P), defines APS when present clinically."
    difficulty: medium
    tags: [aps, autoantibodies, lupus-anticoagulant, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What autoantibody is typically present with Anti-Ro and specific for Sjogren's syndrome when both are positive?"
    back: "Anti-La (SSB)\n\nAnti-La usually occurs with Anti-Ro and increases risk of neonatal lupus syndrome."
    difficulty: easy
    tags: [sjogrens, autoantibodies, anti-La, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the classic triad of CREST syndrome?"
    back: "Calcinosis, Raynaud's, Esophageal dysmotility, Sclerodactyly, Telangiectasia\n\nCREST is the limited cutaneous variant of systemic sclerosis."
    difficulty: easy
    tags: [scleroderma, crest, clinical-features, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What percentage of SLE patients have Anti-Sm antibodies?"
    back: "<30%\n\nAnti-Sm is specific but not sensitive for SLE and does not correlate with disease activity."
    difficulty: easy
    tags: [sle, autoantibodies, anti-sm, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the normal RF prevalence in healthy controls?"
    back: "5-25%\n\nRF can be present in healthy individuals, and is also seen nonspecifically in IE, TB, hepatitis C, silicosis, and sarcoidosis."
    difficulty: easy
    tags: [rheumatoid-factor, false-positive, diagnosis, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What percentage of MCTD patients have anti-RNP antibodies?"
    back: "100%\n\nAnti-RNP is the hallmark antibody of MCTD, though high titres are also seen in many other CTDs especially SLE."
    difficulty: easy
    tags: [mctd, anti-rnp, autoantibodies, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the classic presentation of polymyositis/dermatomyositis?"
    back: "Proximal muscle weakness (usually painless) with dyspnea on exertion\n\nDermatomyositis has characteristic skin findings including heliotrope rash and Gottron's papules."
    difficulty: easy
    tags: [polymyositis, dermatomyositis, clinical-features, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the clinical hallmark of ANA-negative SLE?"
    back: "Anti-Ro (SSA) antibodies may be the only antibody present\n\nANA-negative SLE accounts for a small subset of lupus cases."
    difficulty: medium
    tags: [sle, ana-negative, anti-ro, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What percentage of SLE patients have antiphospholipid antibodies?"
    back: "31-40%\n\nOnly a small subset of SLE patients develop the clinical syndrome of APS."
    difficulty: easy
    tags: [sle, aps, autoantibodies, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What is the most common non-disease-related cause of a positive ANA?"
    back: "Increasing age\n\nThe prevalence of non-disease-related ANA rises with age in the normal population."
    difficulty: easy
    tags: [ana, false-positive, diagnosis, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What non-pharmacological treatments are recommended for dermatomyositis (DMM)?"
    back: "Physical therapy, occupational therapy, and speech-language therapy for esophageal dysfunction\n\nRehabilitation therapies help maintain muscle strength, joint mobility, and address swallowing difficulties common in DMM."
    difficulty: easy
    tags: [Dermatomyositis, Treatment, Rehabilitation, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is the prevalence, gender distribution, and peak age of primary Sjogren's syndrome?"
    back: "Prevalence 0.5%, female-to-male ratio 10:1, peak age 40-60 years\n\nSjogren's predominantly affects middle-aged women, with significant female predominance."
    difficulty: easy
    tags: [Sjogrens, Epidemiology, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is the lifetime risk of non-Hodgkin's lymphoma in Sjogren's syndrome?"
    back: "6-7% lifetime incidence\n\nSjogren's confers significant lymphoma risk, warranting vigilance for lymphadenopathy or organomegaly."
    difficulty: easy
    tags: [Sjogrens, Lymphoma, Complication, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is the ACR/EULAR score for labial salivary gland biopsy showing focal lymphocytic sialadenitis with focus score ≥1/4mm² in Sjogren's?"
    back: "3 points\n\nFocus score ≥1 is strongly associated with phenotypic ocular and serological components."
    difficulty: easy
    tags: [Sjogrens, Diagnosis, Biopsy, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is the ACR/EULAR score for anti-SSA or Ro positivity in Sjogren's syndrome?"
    back: "3 points\n\nAnti-SSA/Ro antibodies are highly specific for primary Sjogren's."
    difficulty: easy
    tags: [Sjogrens, Autoantibodies, Diagnosis, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What inclusion criteria questions are used for Sjogren's syndrome diagnosis?"
    back: "1) Daily persistent dry eyes >3 months, 2) Recurrent sandy/gritty sensation in eyes, 3) Use tear substitutes >3x/day, 4) Daily dry mouth >3 months, 5) Frequent liquid need to swallow dry food\n\nPositive response to at least one question qualifies for further testing."
    difficulty: easy
    tags: [Sjogrens, Diagnosis, Symptoms, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What oral manifestations occur in Sjogren's syndrome?"
    back: "Dental caries, oral candidiasis, and angular cheilitis (inflammation/fissuring at mouth corners)\n\nReduced saliva increases caries risk and creates environment for fungal infections."
    difficulty: easy
    tags: [Sjogrens, Oral, Dental, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What blood work abnormality is characteristic of MCTD?"
    back: "Anti-RNP positivity\n\nAnti-U1 RNP is the serological hallmark distinguishing MCTD from other CTDs."
    difficulty: easy
    tags: [MCTD, Autoantibodies, Diagnosis, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is Overlap Syndrome in rheumatology?"
    back: "A syndrome with sufficient diagnostic features of 2 or more different connective tissue diseases\n\nUnlike MCTD (features of 3), Overlap Syndrome has clear diagnostic criteria met for 2 CTDs."
    difficulty: easy
    tags: [Overlap, CTD, Diagnosis, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What is the general treatment approach for vasculitis?"
    back: "Corticosteroids and/or immunosuppressive agents\n\nImmunosuppression is cornerstone of vasculitis treatment, often with gradual taper."
    difficulty: easy
    tags: [Vasculitis, Treatment, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
  - front: "What are the two main categories of hydronephrosis etiology?"
    back: "Mechanical and functional causes\n\nMechanical causes include congenital abnormalities, trauma, calculi, tumors, BPH, and strictures. Functional causes include neuropathic conditions (neurogenic bladder, diabetic neuropathy) and hormonal factors (pregnancy)."
    difficulty: easy
    tags: [hydronephrosis, etiology, obstruction, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What are the urgent treatment options for hydronephrosis?"
    back: "Percutaneous nephrostomy tube or ureteral stenting to relieve pressure\n\nThese interventions decompress the collecting system to preserve renal function while the underlying cause is addressed."
    difficulty: easy
    tags: [hydronephrosis, treatment, nephrostomy, stent, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the pathophysiology of physiologic post-obstructive diuresis?"
    back: "Excretion of retained urea, Na+, and H2O (high osmotic load) after relief of obstruction\n\nThe kidneys excrete accumulated solutes and water that were retained during the obstruction period, leading to diuresis."
    difficulty: medium
    tags: [post-obstructive diuresis, pathophysiology, osmotic, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What causes pathologic post-obstructive diuresis?"
    back: "Na+-wasting nephropathy secondary to impaired concentrating ability from: decreased NaCl reabsorption in thick ascending limb, urea in collecting tubule, increased medullary blood flow (solute washout), and increased distal nephron flow/solute concentration\n\nPathologic POD results from irreversible tubular damage causing inability to concentrate urine and conserve sodium."
    difficulty: hard
    tags: [post-obstructive diuresis, pathology, nephropathy, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "How should fluid replacement be managed in post-obstructive diuresis?"
    back: "Replace every 1 mL U/O with 0.5 mL 1/2 normal saline IV (or PO if physiologic POD), avoiding glucose-containing fluids\n\nThis conservative replacement strategy prevents overhydration while maintaining hemodynamic stability. Glucose-containing fluids can cause iatrogenic diuresis."
    difficulty: medium
    tags: [post-obstructive diuresis, treatment, fluids, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the definition of overactive bladder?"
    back: "A symptom complex including urinary urgency with or without incontinence, urinary frequency (voiding 8 times in 24h), and nocturia (awakening one or more times at night to void)\n\nOveractive bladder is a clinical diagnosis based on symptoms, not urodynamic findings."
    difficulty: easy
    tags: [overactive bladder, OAB, LUTS, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the pathophysiology of overactive bladder symptoms?"
    back: "Involuntary contractions of the detrusor muscle\n\nDetrusor overactivity, whether neurogenic, myogenic, or idiopathic, leads to the urgency, frequency, and incontinence symptoms."
    difficulty: easy
    tags: [overactive bladder, detrusor, pathophysiology, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What are first-line non-pharmacological treatments for overactive bladder?"
    back: "Bladder training, bladder control strategies, pelvic floor muscle training, fluid management, weight reduction, and avoidance of caffeine and alcohol\n\nBehavioral therapies are recommended as initial management before considering pharmacological intervention."
    difficulty: easy
    tags: [overactive bladder, treatment, behavioral therapy, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What are second-line treatments for refractory overactive bladder?"
    back: "Botulinum toxin bladder injection (neuromuscular junction inhibition), percutaneous tibial nerve stimulation, or sacral neuromodulation\n\nThese options are considered when behavioral and pharmacological therapies fail."
    difficulty: medium
    tags: [overactive bladder, treatment, botox, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the treatment for non-gonococcal urethritis?"
    back: "Azithromycin 1g PO single dose OR doxycycline 100 mg PO BID for 7 days\n\nAzithromycin has the advantage of single-dose compliance, while doxycycline is less expensive but requires 7-day course."
    difficulty: easy
    tags: [urethritis, STI, antibiotics, chlamydia, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the treatment for gonococcal urethritis?"
    back: "Ceftriaxone 250 mg IM single dose AND treatment for Chlamydia trachomatis\n\nDual therapy is required because co-infection with Chlamydia is common (30-50% of cases)."
    difficulty: easy
    tags: [gonorrhea, urethritis, STI, ceftriaxone, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the treatment for chronic prostatitis?"
    back: "Fluoroquinolone (ciprofloxacin 500 mg PO BID) for 4-6 weeks PLUS alpha-blockers and anti-inflammatories\n\nChronic prostatitis/chronic pelvic pain syndrome often requires multimodal therapy including antibiotics, alpha-blockers, and anti-inflammatories."
    difficulty: medium
    tags: [prostatitis, chronic, treatment, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is the treatment for acute uncomplicated pyelonephritis?"
    back: "Fluoroquinolone (ciprofloxacin 500 mg PO BID) for 1 day, plus ceftriaxone 1g IV OR ciprofloxacin 400 mg IV single dose, then transition to oral therapy for total 7-14 days\n\nUncomplicated pyelonephritis can often be treated with oral fluoroquinolones; IV therapy is indicated for patients requiring hospitalization."
    difficulty: easy
    tags: [pyelonephritis, antibiotics, kidney infection, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What are options for recurrent/cystitis prophylactic treatment?"
    back: "Continuous: TMP-SMX 40 mg/200 mg PO daily or 3x/week for 6-12 months, or nitrofurantoin 50-100 mg PO daily for 6-12 months. Post-coital: TMP-SMX 40-80 mg/200-400 mg or nitrofurantoin 50-100 mg within 2 hours of coitus\n\nProphylaxis is considered after 2-3 documented episodes of recurrent cystitis."
    difficulty: medium
    tags: [cystitis, recurrent, prophylaxis, antibiotics, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is retrograde pyelogram used for in hydronephrosis?"
    back: "To delineate anatomy and allow for stent insertion to decompress if obstruction is present\n\nRetrograde pyelography is both diagnostic and therapeutic, allowing visualization and simultaneous stent placement."
    difficulty: medium
    tags: [hydronephrosis, retrograde pyelogram, stent, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
  - front: "What is hypospadias?"
    back: "A condition where the urethral meatus opens on the ventral side of the penis, proximal to the normal location in the glans\n\nDepending on severity, hypospadias may result in difficulty directing urinary stream, intercourse problems, or depositing sperm in the vagina."
    difficulty: easy
    tags: [hypospadias, congenital anomalies, pediatric urology, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "When should hypospadias be surgically corrected?"
    back: "Early surgical correction before 2 years of age; neonatal circumcision should be deferred as the foreskin may be used in repair\n\nOptimal repair timing is before 2 years old. The foreskin is often utilized in the correction, so circumcision should be deferred."
    difficulty: easy
    tags: [hypospadias, treatment, surgical timing, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is the exstrophy-epispadias complex?"
    back: "A spectrum of defects from failure of cloacal membrane closure: bladder exstrophy (exposed bladder), cloacal exstrophy (exposed bladder and bowel with imperforate anus), and epispadias (urethra on dorsal penis)\n\nThe severity depends on timing of cloacal membrane rupture. Associated with spina bifida in >50% of cloacal exstrophy cases."
    difficulty: easy
    tags: [exstrophy, epispadias, congenital anomalies, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is the treatment for Wilms' tumour?"
    back: "Unilateral: radical nephrectomy or nephron-sparing surgery + radiation + chemotherapy. Bilateral: nephron-sparing surgery following neoadjuvant chemotherapy\n\nAlways investigate contralateral kidney and renal vein (for tumour thrombus) before treatment."
    difficulty: medium
    tags: [Wilms tumour, treatment, chemotherapy, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is the prognosis for Wilms' tumour?"
    back: "5-year survival: 90%; 5-year recurrence rate: 15%\n\nWilms' tumour has excellent prognosis with modern multimodality treatment."
    difficulty: easy
    tags: [Wilms tumour, prognosis, survival, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is the treatment for cryptorchidism?"
    back: "Orchiopexy (surgical correction); hormonal therapy has not proven benefit over standard surgical treatment\n\nSurgical correction is the standard treatment. Timing is important for preserving fertility and reducing malignancy risk."
    difficulty: easy
    tags: [cryptorchidism, treatment, orchiopexy, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What are the complications of untreated bilateral cryptorchidism?"
    back: "Approximately 100% infertility due to Leydig and germ cell loss\n\nPaternity rates are 33-65% for formerly bilateral cryptorchid, 90% for formerly unilateral cryptorchid, and 93% for normal men."
    difficulty: medium
    tags: [cryptorchidism, infertility, complications, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is 46,XY DSD?"
    back: "Disorder in phenotypic males (46,XY) due to defect in testicular synthesis of androgens OR androgen resistance in target tissues\n\nClinical features include micropenis, undescended testes, hypospadias, and incomplete development of male secondary sexual characteristics."
    difficulty: medium
    tags: [DSD, 46XY DSD, androgen resistance, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is the most common cause of 46,XX DSD?"
    back: "Congenital adrenal hyperplasia (CAH), specifically 21-hydroxylase deficiency, leading to excess androgens\n\nUndiagnosed/untreated CAH can cause life-threatening electrolyte abnormalities (salt-wasting CAH) in newborns."
    difficulty: medium
    tags: [DSD, 46XX DSD, CAH, congenital adrenal hyperplasia, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is ovotesticular DSD?"
    back: "A form of DSD where both ovarian and testicular tissue are present in the same individual\n\nOvotesticular DSD is one of the classifications of disorders of sexual differentiation."
    difficulty: medium
    tags: [DSD, ovotesticular, disorders of sexual differentiation, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "In a newborn with bilateral non-palpable testicles, what DSD should be considered and what evaluation is required?"
    back: "Consider 46,XX DSD with salt-wasting CAH; requires proper evaluation including karyotype and gonadal palpation before any shunt surgery\n\nBilateral non-palpable testicles in a newborn should raise suspicion for DSD and prompt comprehensive evaluation before surgical intervention."
    difficulty: hard
    tags: [DSD, cryptorchidism, CAH, newborn, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "What is the treatment approach for bilateral Wilms' tumour?"
    back: "Nephron-sparing surgery following neoadjuvant chemotherapy to preserve renal function\n\nBilateral disease requires conservative approach to preserve as much renal tissue as possible."
    difficulty: medium
    tags: [Wilms tumour, bilateral, nephron-sparing, treatment, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
  - front: "Does surgical correction of cryptorchidism reduce the risk of testicular torsion?"
    back: "Yes, surgical correction reduces the increased risk of testicular torsion\n\nUndescended testes have increased risk of torsion, which can be reduced by surgical correction (orchiopexy)."
    difficulty: easy
    tags: [cryptorchidism, testicular torsion, orchiopexy, toronto-notes, pages-1571-1572-1573-1574-1575-1576-1577-1578-1579-1580]
