# Family Medicine Hearing (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the two main classifications of hearing loss and how do they differ?"
    back: "1. Conductive: external sound does not reach the inner ear (problem with external or middle ear)\n2. Sensorineural: involving the inner ear, cochlea, or auditory nerve\n3. Mixed: combination of both\n\nRinne and Weber tuning fork tests distinguish between conductive (Rinne negative; Weber lateralizes to affected ear) and sensorineural (Rinne positive; Weber lateralizes to unaffected ear) hearing loss. 90% of age-related hearing loss (presbycusis) is sensorineural."
    difficulty: easy
    tags: [hearing-loss, otolaryngology, family-medicine, sensorineural, conductive]
  - front: "How is the whispered-voice test performed and what does it assess?"
    back: "The examiner stands 0.6 metres (arm's length) behind the patient, whispers a combination of 6 letters/numbers, and asks the patient to repeat the sequence. One ear is tested at a time while the non-test ear is simultaneously masked. It screens for hearing impairment.\n\nThe whispered-voice test is a simple, validated screening tool for hearing loss in elderly patients. Inability to correctly repeat the sequence suggests significant hearing impairment warranting formal audiologic assessment."
    difficulty: easy
    tags: [hearing-loss, screening, whispered-voice-test, elderly, family-medicine]
  - front: "What is the management approach for unexplained unilateral sudden sensorineural hearing loss?"
    back: "Treat urgently with steroids. Refer to ENT specialist for ongoing care. Consider investigations: blood glucose, CBC and differential, TSH, syphilis testing.\n\nSudden sensorineural hearing loss is a medical emergency. Prompt systemic corticosteroids (within 2 weeks of onset) improve outcomes. Syphilis and thyroid disease are treatable reversible causes. MRI is indicated if progressive asymmetric SNHL to exclude vestibular schwannoma."
    difficulty: medium
    tags: [hearing-loss, sensorineural, sudden-hearing-loss, management, family-medicine]
  - front: "When should MRI be ordered for a patient with sensorineural hearing loss?"
    back: "MRI should be considered for patients with progressive asymmetric sensorineural hearing loss to exclude vestibular schwannoma (acoustic neuroma).\n\nVestibular schwannoma is a benign tumour of the 8th cranial nerve that typically presents with unilateral SNHL and tinnitus. Early detection allows for less invasive management. MRI with gadolinium is the gold standard for diagnosis."
    difficulty: medium
    tags: [hearing-loss, MRI, vestibular-schwannoma, acoustic-neuroma, family-medicine]
