  - front: "What was the DASH trial studying and what was its conclusion?"
    back: "The DASH trial showed that a diet rich in fruits, vegetables, and low-fat dairy products significantly reduces blood pressure - by 11.4/5.5 mmHg in hypertensive patients and 5.5/3.0 mmHg in normotensive patients\n\nThe Dietary Approaches to Stop Hypertension (DASH) diet is now a cornerstone recommendation for blood pressure management."
    difficulty: medium
    tags: [cardiology, hypertension, nutrition, clinical trial, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the diagnostic criteria for hypertension (HTN) in non-diabetic patients?"
    back: "Automated office BP >135/85 mmHg OR office BP >140/90 mmHg on 3 separate days, confirmed by home BP or ABPM\n\nMultiple measurements on different days confirm diagnosis; white coat hypertension must be ruled out before treatment."
    difficulty: medium
    tags: [hypertension, diagnosis, cardiology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
