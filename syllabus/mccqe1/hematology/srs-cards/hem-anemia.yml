# Anemia & Hemoglobin Disorders (Hematology) - generated from srs-mccqe1
cards:
  - front: "What is the MCV cut-off that distinguishes microcytic from normocytic anemia?"
    back: "MCV <80 fL = microcytic; 80–100 fL = normocytic; >100 fL = macrocytic\n\nMCV-based classification narrows the differential: microcytic (iron deficiency, thalassemia, sideroblastic, ACD in chronic inflammation); normocytic (acute blood loss, hemolysis, ACD, aplastic anemia); macrocytic (B12/folate deficiency, hypothyroidism, alcohol, medications)."
    difficulty: easy
    tags: [anemia, MCV, microcytic, normocytic, macrocytic]
  - front: "A 30-year-old vegetarian woman has Hb 88 g/L, MCV 72 fL, low serum ferritin (8 µg/L), and low transferrin saturation. What is the diagnosis and first-line treatment?"
    back: "Iron deficiency anemia; treat with oral ferrous sulfate 325 mg (elemental iron ~65 mg) TID between meals\n\nIDA is the most common nutritional anemia globally. Ferritin <15 µg/L confirms iron deficiency. Oral iron is first-line; IV iron (ferric carboxymaltose) for intolerance or malabsorption. Treat underlying cause (menorrhagia, GI blood loss)."
    difficulty: easy
    tags: [iron-deficiency-anemia, ferritin, ferrous-sulfate, IV-iron]
  - front: "What distinguishes thalassemia trait from iron deficiency anemia on CBC?"
    back: "Thalassemia trait: low MCV with normal/high RBC count and normal ferritin; iron deficiency: low MCV with low ferritin and low RBC\n\nMentzer index (<13 suggests thalassemia, >13 suggests IDA). Thalassemia trait is confirmed by Hb electrophoresis (elevated HbA2 >3.5% in beta-thalassemia trait). Iron supplementation does not help thalassemia trait."
    difficulty: medium
    tags: [thalassemia, iron-deficiency, Mentzer-index, Hb-electrophoresis, MCV]
  - front: "A 65-year-old woman has Hb 92 g/L, MCV 110 fL, hypersegmented neutrophils, and low serum B12. What is the most likely underlying cause?"
    back: "B12 deficiency from pernicious anemia or dietary insufficiency (veganism)\n\nMacrocytic megaloblastic anemia with hypersegmented neutrophils (>5 lobes, or any 6-lobed PMN) is characteristic of B12 or folate deficiency. Anti-intrinsic factor antibodies confirm pernicious anemia. Treat with IM B12 (cyanocobalamin) or high-dose oral B12."
    difficulty: medium
    tags: [macrocytic-anemia, B12-deficiency, pernicious-anemia, hypersegmented-neutrophils, cyanocobalamin]
  - front: "What is anemia of chronic disease (ACD) and which test best distinguishes it from IDA?"
    back: "ACD is caused by inflammatory cytokines reducing EPO and iron utilization; ferritin is normal or elevated in ACD (vs. low in IDA)\n\nIn ACD, hepcidin (acute-phase reactant) sequesters iron in macrophages. Ferritin is an acute-phase reactant — elevated in inflammation even with depleted stores. Serum transferrin receptor (sTfR) is elevated in IDA but normal in ACD. sTfR/log ferritin ratio distinguishes them."
    difficulty: medium
    tags: [anemia-of-chronic-disease, ACD, ferritin, transferrin-receptor, hepcidin]
  - front: "A 45-year-old man with sickle cell disease presents with sudden-onset pallor, Hb drops from 85 to 55 g/L, reticulocyte count near zero, and fever. What is the diagnosis?"
    back: "Aplastic crisis due to Parvovirus B19 infection\n\nParvovirus B19 infects erythroid precursors, halting RBC production. In patients with hemolytic anemias (SCD, thalassemia, spherocytosis), rapid Hb drop occurs. Reticulocytopenia is key. Treatment: supportive (transfusion); parvovirus infection is self-limited."
    difficulty: hard
    tags: [sickle-cell, aplastic-crisis, parvovirus-B19, reticulocytopenia, hemolytic-anemia]
  - front: "What is the direct antiglobulin test (DAT / Coombs test) used to detect?"
    back: "IgG or complement (C3d) coating the surface of red blood cells, indicating immune-mediated hemolysis\n\nPositive DAT indicates warm (IgG) or cold (IgM/complement) autoimmune hemolytic anemia, drug-induced hemolysis, or hemolytic transfusion reaction. Warm AIHA: treat with steroids ± rituximab. Cold agglutinin disease: avoid cold, treat underlying cause."
    difficulty: easy
    tags: [DAT, Coombs-test, AIHA, autoimmune-hemolytic-anemia, hemolysis]
  - front: "A 55-year-old woman on methyldopa develops anemia with positive DAT, elevated indirect bilirubin, and low haptoglobin. What is the diagnosis?"
    back: "Drug-induced immune hemolytic anemia (DIIHA) due to methyldopa\n\nMethyldopa (and other drugs: penicillin, cephalosporins, NSAIDs, quinine) causes DIIHA via drug-hapten, immune complex, or autoantibody mechanisms. Discontinue offending drug; hemolysis usually resolves in days to weeks."
    difficulty: medium
    tags: [drug-induced-hemolytic-anemia, methyldopa, DAT, haptoglobin, DIIHA]
  - front: "What is the hallmark peripheral blood finding of microangiopathic hemolytic anemia (MAHA)?"
    back: "Schistocytes (fragmented RBCs) on blood film\n\nMAHA occurs in TTP, HUS, DIC, and malignant hypertension. Schistocytes result from mechanical shearing of RBCs at fibrin strands. Combined with thrombocytopenia, elevated LDH, low haptoglobin, and elevated indirect bilirubin."
    difficulty: easy
    tags: [MAHA, schistocytes, TTP, HUS, DIC]
  - front: "What is hereditary spherocytosis and what is its most common complication?"
    back: "Autosomal dominant defect in RBC membrane proteins (ankyrin, spectrin, band 3) causing spherical, osmotically fragile RBCs; most common complication is pigment gallstones (bilirubin cholelithiasis)\n\nHS presents with hemolytic anemia, splenomegaly, and jaundice. Osmotic fragility test and EMA binding test confirm diagnosis. Splenectomy reduces hemolysis but increases infection risk (pneumococcal vaccines mandatory)."
    difficulty: medium
    tags: [hereditary-spherocytosis, splenomegaly, gallstones, splenectomy, osmotic-fragility]
  - front: "What is the treatment for aplastic anemia in a 25-year-old with a compatible sibling donor?"
    back: "Allogeneic hematopoietic stem cell transplant (HSCT) from matched sibling — curative\n\nSevere aplastic anemia (SAA): pancytopenia with hypocellular marrow. Young patients with matched sibling should proceed to HSCT. Older patients or no donor: immunosuppression with anti-thymocyte globulin (ATG) + cyclosporine + eltrombopag."
    difficulty: medium
    tags: [aplastic-anemia, HSCT, immunosuppression, ATG, eltrombopag]
  - front: "What is the threshold for red blood cell transfusion in a hemodynamically stable hospitalized adult without cardiac disease?"
    back: "Hb <70 g/L (restrictive transfusion strategy)\n\nTRICC trial and Canadian Blood Services guidelines support restrictive transfusion (Hb <70 g/L) in stable patients. Liberal transfusion (Hb <100 g/L) threshold is used in acute MI, ACS, and post-cardiac surgery. Each unit raises Hb by ~10 g/L."
    difficulty: easy
    tags: [RBC-transfusion, transfusion-threshold, restrictive, TRICC, hemoglobin]
  - front: "A 70-year-old man with CKD stage 4 has Hb 88 g/L, reticulocyte count 0.5%, and ferritin 450 µg/L. What is the likely cause of his anemia?"
    back: "Renal anemia (anemia of CKD) due to decreased erythropoietin production\n\nEPO deficiency in CKD causes normocytic, normochromic anemia with low reticulocyte count. Iron studies: ferritin often elevated due to inflammation. IV iron may be needed if TSAT <20%. If iron replete, ESA (darbepoetin, epoetin alfa) is indicated when Hb <100 g/L."
    difficulty: medium
    tags: [renal-anemia, CKD, erythropoietin, ESA, darbepoetin]
  - front: "What is the normal range for hemoglobin and what defines anemia in adult females?"
    back: "Normal Hb in adult women: 120–160 g/L; anemia defined as Hb <120 g/L (WHO) or <115 g/L (some guidelines)\n\nWHO defines anemia as Hb <120 g/L in non-pregnant women, <130 g/L in men, <110 g/L in pregnant women. Canadian Blood Services uses similar thresholds. Severity: mild 100–119 g/L, moderate 70–99 g/L, severe <70 g/L."
    difficulty: easy
    tags: [hemoglobin, anemia, WHO-definition, normal-range]
  - front: "A 35-year-old woman from Southeast Asia has Hb 98 g/L, MCV 64 fL, normal ferritin, and HbA2 5.8% on electrophoresis. What is the diagnosis?"
    back: "Beta-thalassemia trait (carrier state)\n\nHbA2 >3.5% confirms beta-thalassemia trait. These patients have mild microcytic anemia and should not receive unnecessary iron supplementation. Genetic counseling is important if partner is also a carrier (risk of beta-thalassemia major in offspring)."
    difficulty: medium
    tags: [beta-thalassemia, HbA2, Hb-electrophoresis, microcytic, genetic-counseling]
  - front: "How do you interpret iron studies for different anemias?"
    back: "Iron deficiency: low ferritin, low iron, high TIBC, low transferrin sat. Anemia of chronic disease: low/normal iron, high ferritin, low TIBC, low transferrin sat\n\nFerritin is acute phase reactant — may be normal/elevated in ACD even with concurrent iron deficiency. Soluble transferrin receptor elevated in true iron deficiency. Reticulocyte count helps assess marrow response."
    difficulty: hard
    tags: [anemia, iron studies]
  - front: "How is anemia classified by MCV and what are common causes?"
    back: "Microcytic (MCV<80): iron deficiency, thalassemia, chronic disease, sideroblastic. Normocytic (80-100): chronic disease, renal, acute blood loss, hemolysis, bone marrow failure. Macrocytic (>100): B12/folate, liver disease, hypothyroid, MDS, drugs\n\nFirst step: check MCV. Reticulocyte count distinguishes production (low retic) from destruction/loss (high retic). Iron deficiency is most common cause worldwide. Always investigate cause - never just treat the number."
    difficulty: medium
    tags: [anemia, MCV, classification]
  - front: "How are iron studies interpreted in iron deficiency vs anemia of chronic disease?"
    back: "IDA: low ferritin (<30), low iron, high TIBC, low transferrin sat (<20%). ACD: normal/high ferritin (acute phase reactant), low iron, low TIBC, low transferrin sat. Combined: low ferritin settles it\n\nFerritin <30 is diagnostic of IDA (most useful single test). Ferritin 30-100 is indeterminate (may have coexistent IDA+ACD). Ferritin >100 essentially excludes IDA. Soluble transferrin receptor elevated in IDA, normal in ACD."
    difficulty: hard
    tags: [iron studies, IDA, anemia of chronic disease]
  - front: "What is the workup and management of iron deficiency anemia?"
    back: "Workup: identify cause (menstrual loss, GI loss - scope if male or postmenopausal). Treatment: oral ferrous sulfate 300mg daily-TID (elemental iron 60-200mg/d) on empty stomach. IV iron if intolerant/malabsorption/severe\n\nTake oral iron with vitamin C, avoid with tea/coffee/calcium/antacids. GI side effects common - try alternate-day dosing (better absorbed anyway per recent evidence). Check reticulocyte response at 1wk, Hb at 4-6wk. Continue 3-6mo to replete stores."
    difficulty: medium
    tags: [IDA, iron replacement, management]
  - front: "How is B12 deficiency diagnosed and treated?"
    back: "Diagnosis: low serum B12 (<148 pmol/L), elevated methylmalonic acid (more specific), elevated homocysteine. Causes: pernicious anemia, vegan diet, metformin, malabsorption. Treat: IM B12 1000mcg daily x7, then weekly x4, then monthly\n\nNeurological symptoms (subacute combined degeneration: dorsal columns + corticospinal tracts) may be irreversible if treatment delayed. Check folate simultaneously. Do NOT give folate alone if B12 deficient (worsens neuro). Oral B12 1000-2000mcg daily is acceptable if adherent."
    difficulty: hard
    tags: [B12 deficiency, pernicious anemia, treatment]
  - front: "What is the approach to hemolytic anemia?"
    back: "Suspect if: normocytic anemia + high reticulocytes + high LDH + high indirect bilirubin + low haptoglobin. DAT (Coombs) positive: autoimmune. DAT negative: consider mechanical, intrinsic RBC defects\n\nIntravascular: hemoglobinuria, very low haptoglobin (TTP/HUS, PNH, mechanical valves). Extravascular: splenomegaly (autoimmune, spherocytosis). Peripheral smear: schistocytes (MAHA), spherocytes (AIHA/HS), sickle cells, target cells (thalassemia)."
    difficulty: hard
    tags: [hemolytic anemia, DAT, reticulocyte]
  - front: "What are the causes and management of autoimmune hemolytic anemia?"
    back: "Warm AIHA (IgG, 70%): idiopathic, lymphoma, SLE, drugs. Treat: prednisone 1mg/kg, rituximab, splenectomy. Cold agglutinin (IgM): infections (mycoplasma, EBV), lymphoma. Treat: avoid cold, rituximab\n\nDAT positive confirms autoimmune etiology. Warm AIHA: do not transfuse unless life-threatening (crossmatch difficult). Cold AIHA: warm blood products through warmer. Corticosteroids less effective in cold AIHA. Always investigate for underlying lymphoma or SLE."
    difficulty: hard
    tags: [AIHA, warm, cold agglutinin]
  - front: "What is thalassemia and how does it differ from iron deficiency?"
    back: "Both microcytic. Thalassemia: normal/high ferritin, target cells, elevated RBC count (elevated RDW in IDA), Mentzer index <13 (MCV/RBC). Alpha-thal: Hb electrophoresis may be normal. Beta-thal minor: elevated HbA2 >3.5%\n\nThalassemia trait: mild anemia, NO iron deficiency. Do NOT give iron (risk of overload). Beta-thal major: transfusion-dependent, chelation needed. Beta-thal intermedia: variable. HbH disease (3 alpha deletions): moderate anemia, Hb Bart in neonates."
    difficulty: medium
    tags: [thalassemia, iron deficiency, MCV]
  - front: "What is the approach to pancytopenia?"
    back: "DDx: aplastic anemia, MDS, leukemia (marrow infiltration), megaloblastic anemia, hypersplenism, infections (HIV, TB), medications. Workup: CBC with smear, reticulocytes, B12/folate, HIV, bone marrow biopsy\n\nAplastic anemia: hypocellular marrow. MDS: dysplastic marrow. Leukemia: blast infiltration. Megaloblastic: hypersegmented neutrophils, oval macrocytes. Drug causes: MTX, phenytoin, chemotherapy. Refer hematology urgently for suspected marrow failure."
    difficulty: hard
    tags: [pancytopenia, aplastic anemia, MDS]
  - front: "What is thrombotic thrombocytopenic purpura (TTP) and how is it managed?"
    back: "Pentad: MAHA (schistocytes), thrombocytopenia, renal dysfunction, neuro symptoms, fever. ADAMTS13 <10% diagnostic. Treatment: EMERGENT plasma exchange + steroids + caplacizumab. Do NOT transfuse platelets\n\nTTP is a hematologic emergency (untreated mortality >90%). PLASMIC score predicts ADAMTS13 deficiency. Plasma exchange removes autoantibodies and replenishes ADAMTS13. Platelet transfusion WORSENS thrombosis. Caplacizumab (anti-vWF) reduces time to remission."
    difficulty: hard
    tags: [TTP, ADAMTS13, plasma exchange]
  - front: "How is sickle cell disease managed in Canada?"
    back: "Hydroxyurea (first-line disease-modifying): increases HbF. Voxelotor (Hb S polymerization inhibitor). Crizanlizumab (anti-P-selectin). Transfusion for severe anemia/stroke prevention. Curative: bone marrow transplant\n\nAcute crises: pain (IV fluids, opioids, NSAIDs), chest (antibiotics, transfusion, O2), stroke (exchange transfusion), splenic sequestration (transfusion). Penicillin prophylaxis until age 5. Pneumococcal vaccine. Newborn screening in all Canadian provinces."
    difficulty: hard
    tags: [sickle cell, hydroxyurea, management]
  - front: "When should anemia be investigated vs monitored in primary care?"
    back: "Investigate immediately: symptomatic, Hb <100, rapid decline, unexpected. Refer hematology: unexplained cytopenias, suspected marrow failure, hemolysis, suspected malignancy. Transfuse: Hb <70 (restrictive strategy)\n\nTRICC trial: restrictive transfusion (Hb<70) equivalent or superior to liberal (Hb<100) in most patients. Exception: ACS threshold Hb<80. Each unit raises Hb ~10g/L. Type and screen before transfusion. Monitor for transfusion reactions."
    difficulty: medium
    tags: [anemia, transfusion, investigation]
  - front: "What peripheral blood smear findings are diagnostic?"
    back: "Schistocytes: MAHA (TTP/HUS/DIC). Spherocytes: AIHA, hereditary spherocytosis. Target cells: thalassemia, liver disease. Teardrop: myelofibrosis. Rouleaux: myeloma. Hypersegmented neutrophils: megaloblastic\n\nSmear is often the most informative single test in anemia workup. Also look for: blasts (leukemia), Howell-Jolly bodies (asplenia), basophilic stippling (lead, thalassemia), bite cells (G6PD). Always correlate with clinical context."
    difficulty: medium
    tags: [blood smear, schistocytes, hematology]
  - front: "What are the causes and workup of macrocytic anemia?"
    back: "Megaloblastic: B12/folate deficiency (hypersegmented neutrophils, oval macrocytes). Non-megaloblastic: liver disease, hypothyroid, MDS, reticulocytosis, drugs (MTX, hydroxyurea, AZT), alcohol\n\nCheck B12, folate, TSH, LFTs, reticulocyte count. If B12/folate normal and no obvious cause: bone marrow biopsy to evaluate for MDS. Alcohol causes macrocytosis even without anemia. MCV >115 strongly suggests megaloblastic or MDS."
    difficulty: medium
    tags: [macrocytic anemia, B12, MDS]
  - front: "What is G6PD deficiency and how does it present?"
    back: "X-linked recessive. Episodic hemolysis triggered by oxidative stress: infections, fava beans, drugs (dapsone, primaquine, sulfonamides, nitrofurantoin). Smear: bite cells, Heinz bodies\n\nG6PD level may be NORMAL during acute hemolysis (young RBCs have higher G6PD). Retest 2-3 months after episode. Self-limited episode. Avoid known triggers. Common in Mediterranean, African, Asian descent."
    difficulty: medium
    tags: [G6PD, hemolytic anemia, oxidative stress]
  - front: "What is the approach to an elevated ferritin?"
    back: "DDx: iron overload (hereditary hemochromatosis, transfusional), inflammation/infection, liver disease, malignancy, metabolic syndrome, hyperthyroidism. Check transferrin saturation: if >45% suspect hemochromatosis (HFE gene testing)\n\nFerritin is an acute phase reactant - elevated in inflammation. Hemochromatosis: autosomal recessive C282Y HFE mutation. Screen first-degree relatives. Treatment: phlebotomy targeting ferritin <50. Complications: cirrhosis, DM, cardiomyopathy, arthropathy, bronze skin."
    difficulty: medium
    tags: [ferritin, hemochromatosis, iron overload]
  - front: "What CBC findings suggest specific diagnoses?"
    back: "Microcytic anemia: iron deficiency, thalassemia, chronic disease. Macrocytic: B12/folate, alcohol, hypothyroid, MDS. Pancytopenia: aplastic anemia, leukemia, B12 deficiency. Eosinophilia: parasites, allergy, drug reaction\n\nPeripheral smear findings: schistocytes(DIC/TTP), target cells(thalassemia/liver disease), spherocytes(hereditary spherocytosis/autoimmune), Howell-Jolly bodies(asplenia)."
    difficulty: medium
    tags: [CBC, interpretation]
  - front: "What are the factors that decrease myocardial oxygen supply?"
    back: "Decreased luminal diameter (atherosclerosis, vasospasm), decreased duration of diastole (tachycardia), decreased hemoglobin (anemia), decreased SaO2 (hypoxemia), and congenital anomalies\n\nMyocardial oxygen supply depends on coronary blood flow (which occurs mainly in diastole), oxygen-carrying capacity (hemoglobin), and oxygen saturation."
    difficulty: easy
    tags: [cardiology, pathophysiology, myocardial-ischemia, toronto-notes, pages-0121-0122-0123-0124-0125-0126-0127-0128-0129-0130]
  - front: "What are less emergent causes of dyspnea?"
    back: "Deconditioning, anxiety, respiratory splinting due to unrelated pain, NYD (not yet diagnosed), toxin ingestion, anemia, hemoglobinopathy, CNS lesion, primary muscle weakness\n\nThese causes should be considered after ruling out life-threatening conditions"
    difficulty: easy
    tags: [Emergency Medicine, Dyspnea, Differential Diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "In which conditions is HbA1C misleading for diabetes diagnosis?"
    back: "Hemoglobinopathies, iron deficiency, hemolytic anemia, severe hepatic or renal disease"
    difficulty: medium
    tags: [endocrinology, diabetes, diagnosis, HbA1c, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "List 4 disadvantages/limitations of HbA1C"
    back: "Cost, misleading in hemoglobinopathies, iron deficiency, hemolytic anemia, severe hepatic or renal disease, altered by ethnicity and aging, not for diagnostic use in children/adolescents, pregnant women, those with CF, or suspected T1DM\n\nHbA1C can be inaccurate in conditions that affect red blood cell turnover or hemoglobin structure."
    difficulty: hard
    tags: [endocrinology, diabetes, HbA1C, limitations, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the disadvantages of HbA1C?"
    back: "Cost, misleading in hemoglobinopathies, iron deficiency, hemolytic anemia, severe hepatic/renal disease, altered by ethnicity and aging, requires standardized validated assay, not for diagnostic use in children/adolescents, pregnant women, CF, or suspected T1DM\n\nHbA1C has limitations in certain populations and clinical conditions."
    difficulty: medium
    tags: [endocrinology, diabetes, HbA1C, limitations, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "List 3 disadvantages of using HbA1C"
    back: "Cost, misleading in hemoglobinopathies/iron deficiency/hemolytic anemia/hepatic or renal disease, altered by ethnicity and aging, not for diagnostic use in children/adolescents/pregnant women/CF/suspected T1DM\n\nHbA1C has limitations in certain populations and medical conditions where hemoglobin or red blood cell turnover is affected."
    difficulty: medium
    tags: [endocrinology, diabetes, diagnosis, HbA1C, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
