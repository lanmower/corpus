# Psychiatry Alcohol (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What are the CAGE criteria for screening alcohol use disorder, and what scores are considered positive?"
    back: "C – Have you ever felt the need to Cut down? A – Have you ever felt Annoyed by criticism of your drinking? G – Have you ever felt Guilty about your drinking? E – Have you ever needed a drink first thing in the morning (Eye opener)? Positive screen: ≥2 for men; ≥1 for women.\n\nCAGE is a validated, brief screening tool used widely in Canadian primary care. A positive result warrants further assessment to distinguish problem drinking from alcohol use disorder. Women are screened at a lower threshold due to greater physiological vulnerability."
    difficulty: easy
    tags: [alcohol, CAGE, screening, alcohol use disorder]
  - front: "What are Canada's Low-Risk Alcohol Drinking Guidelines for moderate drinking?"
    back: "Men: ≤3 drinks/day (≤15/week); Women: ≤2 drinks/day (≤10/week); Elderly: ≤1 drink/day.\n\nCanadian Low-Risk Alcohol Drinking Guidelines emphasize that lower consumption reduces risk of chronic disease, injury, and dependence. Exceeding these limits, particularly chronically, increases risk of alcohol use disorder and organ damage."
    difficulty: easy
    tags: [alcohol, Canada guidelines, low-risk drinking]
  - front: "What are the biochemical markers of prolonged alcohol use?"
    back: "Elevated liver function tests (AST, ALT, GGT), elevated MCV, and elevated carbohydrate-deficient transferrin (CDT). AST:ALT ratio >2:1 and elevated GGT are particularly suggestive of alcohol use.\n\nCDT is a sensitive and specific marker for chronic heavy drinking. GGT is highly sensitive but less specific. An AST:ALT ratio >2:1 classically suggests alcoholic liver disease vs. viral hepatitis (ratio typically <1). MCV reflects macrocytosis from nutritional deficiency or direct alcohol toxicity."
    difficulty: medium
    tags: [alcohol, liver function tests, biomarkers, AST ALT GGT CDT]
  - front: "What is the legal blood alcohol concentration (BAC) limit for impaired driving in Canada, and at what BAC level do most signs of intoxication appear?"
    back: "Legal limit: BAC ≥0.08% (≥80 mg/dL or ≥17.4 mmol/L), typically reached after 4 drinks in women or 5 drinks in men in 2 hours. Signs of intoxication appear at >21.7 mmol/L (100 mg/dL).\n\nRespiratory depression and arrest can occur at >60 mmol/L in non-tolerant drinkers and 90–120 mmol/L in tolerant drinkers. The legal BAC threshold applies throughout all Canadian provinces and territories."
    difficulty: easy
    tags: [alcohol, impaired driving, BAC, Canada, medicolegal]
  - front: "Describe the 4 stages of alcohol withdrawal and their typical time of onset."
    back: "Stage 1 (4–12 h): tremor, sweating, agitation, anorexia, cramps, diarrhea, sleep disturbance, anxiety — most withdrawals are mild-moderate (Stage 1 only). Stage 2 (12–24 h): alcoholic hallucinosis (visual, auditory, olfactory, or tactile hallucinations). Stage 3 (12–48 h): tonic-clonic seizures (usually non-focal and brief). Stage 4 (48–96 h): delirium tremens (confusion, delusions, hallucinations, agitation, autonomic hyperactivity — medical emergency).\n\nAlcohol withdrawal is a medical emergency with 20% mortality if untreated in severe delirium tremens. Young patients typically have full recovery; the elderly are often left with cognitive deficits. Not all patients progress through all stages."
    difficulty: medium
    tags: [alcohol withdrawal, delirium tremens, seizures, stages]
  - front: "What are the features of delirium tremens (DTs) and what is the mortality rate if untreated?"
    back: "DTs occur 48–96 h after last drink. Features: autonomic hyperactivity (diaphoresis, tachycardia, increased respiration), hand tremor, insomnia, psychomotor agitation, fever, confusion/disorientation, delusions, and hallucinations. Untreated mortality: 20%.\n\nDTs represent the most severe form of alcohol withdrawal and constitute a medical emergency. The CIWA-A scale monitors severity. Benzodiazepines (diazepam) are the cornerstone of management; thiamine must be given to prevent Wernicke's encephalopathy."
    difficulty: medium
    tags: [delirium tremens, alcohol withdrawal, mortality, management]
  - front: "What does the CIWA-A scale assess in alcohol withdrawal, and how are severity thresholds defined?"
    back: "CIWA-A assesses: Physical (5): paroxysmal sweats, headache, agitation, nausea/vomiting, tremor. Psychological/cognitive (2): anxiety, orientation/clouding of sensorium. Perceptual (3): tactile, auditory, and visual disturbances. Scoring: 0–7 per category (except sensorium: 0–4); max score 67. Mild <10, Moderate 10–20, Severe >20.\n\nThe CIWA-A scale guides symptom-triggered benzodiazepine dosing in alcohol withdrawal. Symptom-triggered therapy is preferred over fixed dosing as it reduces total benzodiazepine required. Scores guide when to escalate care."
    difficulty: medium
    tags: [CIWA-A, alcohol withdrawal, scoring, management]
  - front: "What is the standard alcohol withdrawal treatment protocol (CIWA-A based), and what modifications are made for special populations?"
    back: "Basic: Diazepam 20 mg PO q1–2 h PRN until CIWA-A <10 + thiamine 100–250 mg IM then 100 mg PO daily x3 d + supportive care. History of seizures: Diazepam 20 mg PO q1 h x ≥3 doses regardless of CIWA score. Age >65 / severe liver disease / severe asthma / respiratory failure: Use short-acting BZD (lorazepam 1–4 mg PO/SL/IM q1–2 h). Hallucinations present: Add haloperidol 2–5 mg IM/PO q1–4 h (max 5 doses/d) + diazepam x3 doses as seizure prophylaxis (haloperidol lowers seizure threshold).\n\nLong-acting benzodiazepines (diazepam) are preferred for their smooth self-tapering pharmacokinetics. However, short-acting agents (lorazepam) are safer in elderly and hepatically impaired patients due to reduced accumulation risk. Admit if still in withdrawal after 80 mg diazepam, DTs, recurrent arrhythmias, multiple seizures, or medically ill."
    difficulty: hard
    tags: [alcohol withdrawal, CIWA-A, benzodiazepines, diazepam, lorazepam, thiamine]
  - front: "What is Wernicke's encephalopathy, and how does it differ from Korsakoff's syndrome?"
    back: "Wernicke's encephalopathy: acute and reversible; due to thiamine deficiency; triad of oculomotor dysfunction (nystagmus, CN VI palsy), gait ataxia, and confusion. Lesions in mammillary bodies, thalamus, and brainstem. Korsakoff's syndrome: chronic and only 20% reversible with treatment; anterograde amnesia and compensatory confabulation; cannot occur only during acute delirium or dementia.\n\nWernicke's can progress to Korsakoff's if untreated. Thiamine must be given BEFORE glucose in malnourished/alcoholic patients to avoid precipitating Wernicke's. IV glucose without thiamine can rapidly deplete remaining thiamine stores."
    difficulty: medium
    tags: [Wernicke, Korsakoff, thiamine deficiency, alcohol, amnesia]
  - front: "What is the treatment for Wernicke's encephalopathy (preventive vs. acute) and Korsakoff's syndrome?"
    back: "Wernicke's preventive (any patient in withdrawal): thiamine 100–250 mg IM/IV x1 dose. Wernicke's acute treatment: thiamine 500 mg IV BID/TID x72 h, then reassess. Korsakoff's: IV treatment as for Wernicke's, then thiamine 100 mg PO TID x 3–12 months.\n\nHigh-dose IV thiamine is critical in acute Wernicke's as oral absorption is unreliable in alcoholic patients. Korsakoff's has only 20% reversibility, underscoring the importance of early Wernicke's recognition and treatment. Never give glucose before thiamine in at-risk patients."
    difficulty: medium
    tags: [Wernicke, Korsakoff, thiamine, treatment, alcohol]
  - front: "What are the pharmacological agents used to treat alcohol use disorder and their mechanisms?"
    back: "1. Naltrexone (Revia®): opioid antagonist — reduces 'high' and cravings; can start while drinking; not safe with acute liver failure or opioid use in last 10 days. 2. Acamprosate (Campral®): NMDA glutamate receptor antagonist — maintains abstinence; not safe with renal failure. 3. Disulfiram (Antabuse®): blocks acetaldehyde dehydrogenase — aversive reaction to alcohol; only used when goal is abstinence; contraindicated in severe renal disease, pregnancy, psychoses, cardiac disease; RCT evidence generally poor due to adherence issues.\n\nNaltrexone and acamprosate are first-line Health Canada-approved agents. Disulfiram is used adjunctively when motivation for abstinence is high. Gabapentin, topiramate, and ondansetron have some evidence as anti-craving agents but are not Health Canada approved for this indication."
    difficulty: medium
    tags: [alcohol use disorder, naltrexone, acamprosate, disulfiram, pharmacotherapy]
