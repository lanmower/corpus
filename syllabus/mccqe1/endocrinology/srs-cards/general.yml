# General (Endocrinology) - generated from srs-mccqe1
cards:
  - front: "What is the typical blood glucose range in DKA?"
    back: "14-55 mmol/L\n\nDKA typically presents with glucose levels between 14-55 mmol/L, though euglycemic DKA can occur in pregnancy or with SGLT2 inhibitors."
    difficulty: easy
    tags: [endocrinology, DKA, blood glucose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical blood glucose range in HHS?"
    back: "44.4-133.2 mmol/L\n\nHHS is characterized by extremely high glucose levels (often >44 mmol/L), much higher than DKA, due to more severe dehydration."
    difficulty: easy
    tags: [endocrinology, HHS, blood glucose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the anion gap in DKA typically?"
    back: "Elevated (usually >20 mEq/L)\n\nDKA presents with high anion gap metabolic acidosis due to accumulation of ketone bodies (beta-hydroxybutyrate and acetoacetate)."
    difficulty: easy
    tags: [endocrinology, DKA, anion gap, acidosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the most important endpoint for monitoring DKA resolution?"
    back: "Anion gap (not blood glucose)\n\nThe anion gap is the most important marker for monitoring resolution of metabolic acidosis in DKA, not glucose levels."
    difficulty: medium
    tags: [endocrinology, DKA, monitoring, anion gap, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why is mental obtundation/coma more common in HHS than DKA?"
    back: "Higher serum osmolality in HHS causes fluid shift from neurons → cerebral dysfunction\n\nHHS has much higher osmolality (often >320 mOsm/kg) due to extreme hyperglycemia and severe dehydration, causing neurological symptoms."
    difficulty: medium
    tags: [endocrinology, HHS, osmolality, neurological, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "At what blood glucose level should D5W or D10W be added to IV fluids in DKA treatment?"
    back: "When BG reaches 14.0 mmol/L\n\nOnce BG reaches 14.0 mmol/L, add dextrose to maintain BG of 12-14 mmol/L to prevent hypoglycemia while continuing to treat acidosis."
    difficulty: easy
    tags: [endocrinology, DKA, treatment, dextrose, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of respiratory pattern is characteristic of DKA?"
    back: "Kussmaul respirations (deep, rapid breathing)\n\nKussmaul respirations represent the body's compensation for metabolic acidosis by blowing off CO2. Breath may have acetone odor."
    difficulty: easy
    tags: [endocrinology, DKA, respiratory, Kussmaul, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "At what blood glucose level should you switch from NS to D5W in DKA treatment?"
    back: "When BG reaches 13.9 mmol/L (250 mg/dL)\n\nOnce BG reaches 14.0 mmol/L, add D5W or D10W to maintain BG of 12-14 mmol/L to prevent hypoglycemia while continuing to resolve acidosis."
    difficulty: medium
    tags: [endocrinology, DKA, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the most important endpoint for monitoring resolution of DKA?"
    back: "Anion Gap (AG)\n\nThe anion gap is the most important endpoint for monitoring resolution of metabolic acidosis in DKA, not blood glucose or serum ketone level."
    difficulty: medium
    tags: [endocrinology, DKA, monitoring, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of respirations is characteristic of DKA?"
    back: "Kussmaul respirations (deep, rapid breathing)\n\nKussmaul respirations represent the body's compensatory mechanism for metabolic acidosis in DKA, blowing off CO2 to reduce acidemia."
    difficulty: easy
    tags: [endocrinology, DKA, physical-exam, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why is Kussmaul respirations typically ABSENT in HHS?"
    back: "Because metabolic acidosis is absent in pure HHS\n\nHHS is characterized by hyperglycemia and hyperosmolality without significant ketosis or acidosis, so Kussmaul respirations are not present unless there is a separate precipitant causing acidosis."
    difficulty: medium
    tags: [endocrinology, HHS, DKA, physical-exam, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the ABG finding in DKA?"
    back: "Anion gap metabolic acidosis with possible secondary respiratory alkalosis\n\nDKA demonstrates high anion gap metabolic acidosis due to ketoacids. The body may compensate with respiratory alkalosis (hyperventilation)."
    difficulty: medium
    tags: [endocrinology, DKA, ABG, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the ABG finding in HHS (unless precipitant causes acidosis)?"
    back: "Metabolic acidosis typically absent\n\nPure HHS does not have metabolic acidosis because the small amount of insulin prevents ketosis. Acidosis only occurs if a separate precipitant (e.g., lactic acidosis from MI) is present."
    difficulty: medium
    tags: [endocrinology, HHS, ABG, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "When treating HHS, if corrected serum sodium is high or normal, what fluid should be used?"
    back: "0.45% NaCl (hypotonic saline)\n\nIf corrected serum Na+ is high or normal, switch from NS to 0.45% NaCl at 4 mL/kg/h to correct hypernatremia."
    difficulty: hard
    tags: [endocrinology, HHS, treatment, fluids, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the insidious onset feature of HHS?"
    back: "Preceded by weakness, polyuria, polydipsia over days to weeks\n\nHHS has a gradual, insidious onset over days to weeks, unlike the more acute presentation of DKA."
    difficulty: easy
    tags: [endocrinology, HHS, presentation, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the mental status change in HHS due to?"
    back: "High serum osmolality causing fluid shift from neurons to ECF\n\nExtreme hyperosmolality causes water to shift from brain neurons to extracellular fluid, leading to lethargy, confusion, and coma."
    difficulty: hard
    tags: [endocrinology, HHS, pathophysiology, neurologic, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the urine finding in DKA vs HHS?"
    back: "DKA: positive for glucose and ketones; HHS: positive for glucose, negative for ketones (unless starvation ketosis)\n\nThe presence of ketones in urine helps differentiate DKA (ketonuria present) from HHS (ketonuria absent or minimal)."
    difficulty: medium
    tags: [endocrinology, DKA, HHS, urine, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why is there more severe dehydration in HHS compared to DKA?"
    back: "More gradual onset and longer duration of metabolic decompensation plus impaired fluid intake common in bedridden patients\n\nHHS develops over days to weeks with patients often being too ill to drink adequately, leading to profound dehydration."
    difficulty: medium
    tags: [endocrinology, HHS, dehydration, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What are the clinical features of hypogonadotropic hypogonadism (LH/FSH deficiency)?"
    back: "Oligo/amenorrhea, infertility, decreased facial/body hair and muscle mass in men, erectile dysfunction, delayed puberty\n\nDeficiency of LH and FSH leads to low sex steroid production from the gonads, causing symptoms of hypogonadism and reproductive dysfunction."
    difficulty: easy
    tags: [pituitary, LH, FSH, hypogonadism, endocrinology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the target preprandial (before subsequent meal) blood glucose level?"
    back: "4-7 mmol/L\n\nPostprandial target is 5-10 mmol/L, while fasting and preprandial targets are 4-7 mmol/L."
    difficulty: easy
    tags: [endocrinology, diabetes, bg_targets, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical blood glucose range in DKA vs HHS?"
    back: "DKA: 14-55 mmol/L; HHS: 44.4-133.2 mmol/L\n\nHHS has much higher glucose levels due to more gradual onset and more severe dehydration."
    difficulty: easy
    tags: [endocrinology, diabetes, dka, hhs, diagnosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What respiratory pattern is seen in DKA and why?"
    back: "Kussmaul respirations (deep, rapid breathing) due to metabolic acidosis stimulating respiratory center\n\nKussmaul respirations represent the body's compensatory mechanism for metabolic acidosis by blowing off CO2."
    difficulty: easy
    tags: [endocrinology, diabetes, dka, respiratory, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "How do you monitor resolution of DKA?"
    back: "Anion gap (AG) is the most important endpoint - monitor until acidosis resolves\n\nAG normalizes as ketone production stops, even though hyperglycemia may persist longer."
    difficulty: medium
    tags: [endocrinology, dka, monitoring, lab_values, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What IV fluid switch occurs when serum BG reaches 13.9 mmol/L in DKA/HHS treatment?"
    back: "Switch from NS to D5W (or D10W) to maintain BG of 12-14 mmol/L\n\nThis prevents hypoglycemia while continuing insulin therapy to resolve acidosis."
    difficulty: medium
    tags: [endocrinology, diabetes, dka, hhs, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "How does corrected serum sodium guide fluid choice in HHS?"
    back: "If corrected Na+ is high or normal: switch to 0.45% NaCl. If low: maintain NS\n\nThis prevents rapid osmolality shifts that could cause cerebral edema."
    difficulty: hard
    tags: [endocrinology, diabetes, hhs, fluids, electrolytes, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical blood glucose level in HHS?"
    back: "44.4-133.2 mmol/L\n\nHHS is characterized by extremely high glucose levels, typically in the range of 44.4-133.2 mmol/L."
    difficulty: easy
    tags: [endocrinology, diabetes, HHS, diagnosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the hallmark clinical feature distinguishing HHS from DKA?"
    back: "Severe hyperosmolality with mental obtundation or coma, without significant ketosis\n\nHHS is characterized by extreme hyperosmolality (often >320 mOsm/kg) causing neurological symptoms, without the ketoacidosis seen in DKA."
    difficulty: medium
    tags: [endocrinology, diabetes, HHS, DKA, diagnosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "When treating DKA, at what blood glucose level should you add dextrose to IV fluids?"
    back: "When BG reaches 13.9 mmol/L (250 mg/dL)\n\nOnce BG reaches 14.0 mmol/L, add D5W or D10W to maintain BG of 12-14 mmol/L while continuing insulin to resolve acidosis."
    difficulty: medium
    tags: [endocrinology, diabetes, DKA, treatment, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of respiratory pattern is seen in DKA?"
    back: "Kussmaul respirations (deep, rapid breathing)\n\nKussmaul respirations represent the body's compensatory mechanism for metabolic acidosis in DKA."
    difficulty: easy
    tags: [endocrinology, diabetes, DKA, clinical features, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What breath odor is characteristic of DKA?"
    back: "Acetone-odoured breath (fruity odor)\n\nThe fruity/acetone odor on breath is due to exhaled ketone bodies (acetoacetate) in DKA."
    difficulty: easy
    tags: [endocrinology, diabetes, DKA, clinical features, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What are the classic triad of DKA symptoms?"
    back: "Polyuria, polydipsia, and weight loss\n\nClassic hyperglycemia symptoms include polyuria (osmotic diuresis), polydipsia (thirst), and weight loss."
    difficulty: easy
    tags: [endocrinology, diabetes, DKA, clinical features, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the typical BG range in DKA?"
    back: "14-55 mmol/L\n\nDKA typically presents with blood glucose levels between 14-55 mmol/L, though it can be higher."
    difficulty: easy
    tags: [endocrinology, diabetes, DKA, diagnosis, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the urine ketone finding in HHS?"
    back: "Negative for ketones (unless starvation ketosis)\n\nUrine is negative for ketones in HHS, distinguishing it from DKA. Ketosis is usually absent due to residual insulin effect."
    difficulty: easy
    tags: [endocrinology, diabetes, HHS, lab values, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "Why is dehydration more severe in HHS compared to DKA?"
    back: "More gradual onset and longer duration of metabolic decompensation plus impaired fluid intake common in bedridden patients\n\nHHS has an insidious onset over days to weeks with polyuria and inadequate fluid intake, leading to more profound dehydration than DKA."
    difficulty: medium
    tags: [endocrinology, diabetes, HHS, pathophysiology, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What type of acidosis is typically absent in HHS unless caused by underlying precipitant?"
    back: "Metabolic acidosis\n\nMetabolic acidosis is typically absent in HHS unless there is an underlying precipitant like lactic acidosis from MI."
    difficulty: easy
    tags: [endocrinology, diabetes, HHS, acid-base, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the onset of HHS symptoms?"
    back: "Insidious (gradual), preceded by weakness, polyuria, and polydipsia over days to weeks\n\nHHS has an insidious onset over several days to weeks, unlike the more acute presentation of DKA."
    difficulty: easy
    tags: [endocrinology, diabetes, HHS, clinical features, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What hormones are produced by the posterior pituitary?"
    back: "ADH (antidiuretic hormone/vasopressin) and oxytocin\n\nUnlike anterior pituitary hormones which are synthesized in the pituitary itself, these are produced in the hypothalamus and stored in the posterior pituitary."
    difficulty: easy
    tags: [pituitary, hormones, endocrinology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the imaging modality of choice for evaluating pituitary pathology?"
    back: "MRI of the sella\n\nMRI provides excellent soft tissue detail and is superior to CT for visualizing pituitary microadenomas, macroadenomas, and surrounding structures like the optic chiasm."
    difficulty: easy
    tags: [pituitary, imaging, diagnosis, endocrinology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is ACTH and where is it secreted from?"
    back: "ACTH (adrenocorticotropic hormone) is a polypeptide cleaved from POMC, secreted in a pulsatile fashion from the anterior pituitary\n\nACTH has diurnal variability with peak secretion at 0200-0400h and trough at 1800-2400h."
    difficulty: easy
    tags: [ACTH, pituitary, endocrinology, hormones, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What regulates ACTH secretion?"
    back: "ACTH secretion is regulated by CRH (corticotropin-releasing hormone) and AVP (arginine vasopressin) from the hypothalamus\n\nThese hypothalamic factors stimulate pituitary ACTH release in response to stress and circadian rhythm."
    difficulty: easy
    tags: [ACTH, hypothalamus, pituitary, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the principal precursor for all steroid hormones?"
    back: "Cholesterol is the precursor for all steroid hormones\n\nCholesterol undergoes enzymatic conversions to produce mineralocorticoids, glucocorticoids, and sex steroids."
    difficulty: easy
    tags: [steroids, biochemistry, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the principal adrenal androgens?"
    back: "DHEA (dehydroepiandrosterone), androstenedione, and 11-hydroxyandrostenedione\n\nThese androgens are primarily responsible for adrenarche (growth of axillary and pubic hair) and are regulated by ACTH."
    difficulty: easy
    tags: [androgens, adrenal, endocrinology, steroids, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "How is Primary Aldosteronism (PA) screened and confirmed?"
    back: "Screening: elevated aldosterone:renin ratio in presence of high aldosterone. Confirmation: lack of aldosterone suppression with ECFV expansion using normal saline infusion\n\nConfirmatory test: IV infusion of 500 mL/h NS for 4 hours; plasma aldosterone >277 pmol/L is consistent with PA, <140 pmol/L is normal."
    difficulty: hard
    tags: [primary aldosteronism, RAAS, endocrinology, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the difference between Primary Aldosteronism and Secondary Aldosteronism?"
    back: "Primary Aldosteronism (PA) is excess aldosterone production from an intra-adrenal cause; Secondary Aldosteronism (SA) is aldosterone production in response to excess RAAS (extra-adrenal cause)\n\nPA involves adrenal pathology (adenoma, hyperplasia), while SA is a physiologic response to hypovolemia or renal issues."
    difficulty: medium
    tags: [aldosterone, endocrinology, pathology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is Conn's syndrome?"
    back: "Conn's syndrome is primary aldosteronism caused by an aldosterone-producing adrenal adenoma\n\nCharacterized by hypertension, hypokalemia, and metabolic alkalosis."
    difficulty: easy
    tags: [Conns syndrome, adenoma, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the renin-angiotensin-aldosterone system (RAAS) cascade?"
    back: "Renin (from kidney) converts angiotensinogen to angiotensin I → ACE (lung/kidney) converts angiotensin I to angiotensin II → angiotensin II stimulates aldosterone release → renal Na+ retention, K+ excretion, arteriolar vasoconstriction, and ADH release\n\nThe system is activated by decreased volume, decreased arterial pressure, or decreased Na delivery to macula densa."
    difficulty: medium
    tags: [RAAS, renin, angiotensin, endocrinology, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the components of the HPA axis?"
    back: "Hypothalamus (produces CRH) → Pituitary (releases ACTH) → Adrenal cortex (releases cortisol)\n\nThe HPA axis has negative feedback: cortisol inhibits CRH and ACTH release."
    difficulty: easy
    tags: [HPA axis, hypothalamus, pituitary, adrenal, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the diurnal variation of cortisol?"
    back: "Cortisol peaks at 0200-0400h and is at its trough between 1800-2400h\n\nThis diurnal rhythm is disrupted in Cushing's syndrome, where midnight cortisol is inappropriately elevated."
    difficulty: easy
    tags: [cortisol, physiology, endocrinology, diurnal rhythm, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is ACTH and what regulates its secretion?"
    back: "ACTH is a polypeptide cleaved from POMC, secreted pulsatilely with diurnal variation, regulated by CRH and AVP\n\nACTH secretion peaks between 0200-0400h and troughs between 1800-2400h, following a circadian rhythm."
    difficulty: easy
    tags: [endocrinology, ACTH, pituitary, hormones, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the diurnal variation pattern of ACTH secretion?"
    back: "Peak: 0200-0400h; Trough: 1800-2400h\n\nACTH follows a circadian rhythm with highest levels in early morning and lowest in late evening."
    difficulty: easy
    tags: [endocrinology, ACTH, circadian-rhythm, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the Cosyntropin (ACTH) Stimulation Test used to diagnose?"
    back: "Hormone deficiencies, specifically glucocorticoid reserve\n\nAdminister 250 μg cosyntropin IV/IM, measure plasma cortisol before and at 30 and 60 min. A physiologic response is stimulated cortisol >500 nmol/L at 30 or 60 min."
    difficulty: medium
    tags: [endocrinology, adrenal, stimulation-test, diagnostic, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the Low-Dose Overnight DXM Suppression Test used to diagnose?"
    back: "Cushing's syndrome (excess cortisol production)\n\nAdminister 1 mg oral DXM between 11 pm and midnight, measure plasma cortisol next day between 8-9 am. A physiologic response is plasma cortisol <50 nmol/L (<1.8 μg/dL)."
    difficulty: medium
    tags: [endocrinology, cortisol, suppression-test, cushing, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is a normal result for the DXM Suppression Test?"
    back: "Plasma cortisol <50 nmol/L (<1.8 μg/dL)\n\nFailure to suppress plasma cortisol indicates inappropriate response and suggests Cushing's syndrome."
    difficulty: medium
    tags: [endocrinology, cortisol, suppression-test, diagnostic, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What does elevated 24-hour urine free cortisol indicate?"
    back: "Overproduction of cortisol\n\nThis is a test for confirming excess cortisol production in the workup of Cushing's syndrome."
    difficulty: medium
    tags: [endocrinology, cortisol, cushing, diagnostic, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is Primary Aldosteronism (PA)?"
    back: "Excess aldosterone production from an intra-adrenal cause\n\nPreviously called hyperaldosteronism, PA is distinct from Secondary Aldosteronism which is aldosterone production in response to excess RAAS."
    difficulty: easy
    tags: [endocrinology, aldosterone, primary-aldosteronism, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is Secondary Aldosteronism (SA)?"
    back: "Aldosterone production in response to excess RAAS (extra-adrenal cause)\n\nSA occurs when renin production is elevated, leading to increased angiotensin II and aldosterone secretion."
    difficulty: easy
    tags: [endocrinology, aldosterone, secondary-aldosteronism, RAAS, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the screening test for Primary Aldosteronism?"
    back: "Elevated aldosterone:renin ratio in the presence of high aldosterone\n\nThere is variability in interpretation depending on assays used, and confirmation requires lack of aldosterone suppression with ECFV expansion."
    difficulty: medium
    tags: [endocrinology, primary-aldosteronism, screening, diagnostic, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the diurnal variation of ACTH secretion?"
    back: "Peak ACTH secretion occurs at 0200-0400h and trough at 1800-2400h\n\nACTH is secreted in a pulsatile fashion with diurnal variability, regulating cortisol production."
    difficulty: easy
    tags: [endocrinology, adrenal, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the Cosyntropin Stimulation Test used to diagnose?"
    back: "Adrenal insufficiency (glucocorticoid deficiency)\n\n250 mcg cosyntropin IV/IM is administered; plasma cortisol is measured before and at 30 and 60 minutes. A peak cortisol >500 nmol/L indicates normal adrenal reserve."
    difficulty: medium
    tags: [endocrinology, adrenal, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the low-dose overnight DXM suppression test used for?"
    back: "Screening test for Cushing's syndrome (cortisol hypersecretion)\n\n1 mg dexamethasone is given at 11pm-midnight, and plasma cortisol is measured at 8-9am the next day. Normal response is cortisol <50 nmol/L."
    difficulty: medium
    tags: [endocrinology, adrenal, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "How is primary aldosteronism confirmed?"
    back: "Lack of aldosterone suppression with ECFV expansion using saline infusion\n\n500 mL/h NS infusion for 4 hours; plasma aldosterone >277 pmol/L is consistent with PA, <140 pmol/L is normal."
    difficulty: hard
    tags: [endocrinology, adrenal, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What enzyme is deficient in 21-hydroxylase deficiency?"
    back: "undefined\n\n21-hydroxylase deficiency causes impaired conversion of 17-OH-progesterone to 11-deoxycortisol, leading to cortisol deficiency and adrenal androgen excess"
    difficulty: hard
    tags: [endocrinology, adrenal, pathology, genetics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the effect of 11-hydroxylase deficiency?"
    back: "undefined\n\nImpaired conversion of 11-deoxycortisol to cortisol, causing cortisol deficiency and accumulation of androgen precursors"
    difficulty: hard
    tags: [endocrinology, adrenal, pathology, genetics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What stimulates renin release?"
    back: "Decreased volume, decreased arterial pressure, decreased Na delivery to macula densa, sympathetic stimulation, prostaglandins\n\nRenin is released in response to decreased renal perfusion and sodium delivery."
    difficulty: easy
    tags: [endocrinology, renal, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the final product of the renin-angiotensin-aldosterone system?"
    back: "Aldosterone release leading to renal Na+ retention, K+ excretion, arteriolar vasoconstriction, and promotion of ADH release\n\nACE converts angiotensin I to angiotensin II, which stimulates aldosterone release."
    difficulty: easy
    tags: [endocrinology, renal, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the primary function of aldosterone?"
    back: "Regulates extracellular fluid volume (ECFV) through Na+ and Cl- retention and K+ and H+ excretion in the distal tubule\n\nAldosterone stimulates Na+/K+ ATPase in the distal tubule and is regulated by RAAS and hyperkalemia."
    difficulty: easy
    tags: [endocrinology, aldosterone, electrolytes, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the normal response in the saline infusion test for primary aldosteronism?"
    back: "Plasma aldosterone <140 pmol/L after 4 hours of NS infusion (500 mL/h)\n\nIn primary aldosteronism, aldosterone fails to suppress and remains >277 pmol/L despite volume expansion."
    difficulty: hard
    tags: [endocrinology, testing, primary aldosteronism, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the difference between primary and secondary aldosteronism?"
    back: "Primary aldosteronism (PA) is excess aldosterone production from an intra-adrenal cause; secondary aldosteronism (SA) is aldosterone production in response to excess RAAS (extra-adrenal cause)\n\nPA is also called hyperaldosteronism and involves adrenal pathology."
    difficulty: medium
    tags: [endocrinology, aldosterone, classification, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What activates renin release?"
    back: "Decreased volume, decreased arterial pressure, decreased Na delivery to macula densa, sympathetic stimulation, prostaglandins\n\nRenin release is inhibited by dopamine, volume expansion, and increased arterial pressure."
    difficulty: medium
    tags: [endocrinology, renin, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the effects of angiotensin II?"
    back: "Stimulates aldosterone release, causes arteriolar vasoconstriction, promotes ADH release, provides negative feedback to inhibit JGA\n\nAngiotensin II is the active form converted by ACE from angiotensin I."
    difficulty: medium
    tags: [endocrinology, angiotensin, RAAS, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the precursor molecule for all steroid hormones?"
    back: "Cholesterol\n\nSteroidogenesis begins with cholesterol converted to pregnenolone by cholesterol hydroxylase (side-chain cleavage enzyme)."
    difficulty: easy
    tags: [endocrinology, steroidogenesis, biochemistry, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is Cosyntropin and what does the Cosyntropin Stimulation Test diagnose?"
    back: "Cosyntropin is an ACTH analog used in the stimulation test to diagnose glucocorticoid deficiency (adrenal insufficiency)"
    difficulty: easy
    tags: [adrenal, endocrinology, diagnostics, ACTH, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the low-dose overnight DXM suppression test used to screen for?"
    back: "Cushing syndrome (hypercortisolism)"
    difficulty: easy
    tags: [adrenal, endocrinology, Cushing, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the physiologic response in a normal low-dose overnight DXM suppression test?"
    back: "Plasma cortisol <50 nmol/L (<1.8 μg/dL)"
    difficulty: easy
    tags: [adrenal, endocrinology, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the three principal adrenal androgens?"
    back: "DHEA, androstenedione, and 11-hydroxyandrostenedione"
    difficulty: easy
    tags: [adrenal, endocrinology, androgens, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the physiologic effects of cortisol on bone?"
    back: "Cortisol inhibits bone formation and stimulates bone resorption"
    difficulty: easy
    tags: [cortisol, endocrinology, bone, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What effect does cortisol have on the immune system?"
    back: "Cortisol suppresses inflammation and impairs cell-mediated immunity"
    difficulty: easy
    tags: [cortisol, endocrinology, immunology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the effect of cortisol on the reproductive axis?"
    back: "Cortisol inhibits the reproductive axis"
    difficulty: easy
    tags: [cortisol, endocrinology, reproduction, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What screening test is used for Primary Aldosteronism?"
    back: "Elevated aldosterone:renin ratio in the presence of high aldosterone"
    difficulty: easy
    tags: [aldosterone, endocrinology, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the confirmatory test for Primary Aldosteronism using saline infusion?"
    back: "IV infusion of 500 mL/h of normal saline for 4 hours; plasma aldosterone >277 pmol/L is consistent with PA, <140 pmol/L is normal"
    difficulty: medium
    tags: [aldosterone, endocrinology, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What effect does cortisol have on protein metabolism?"
    back: "Increases protein catabolism"
    difficulty: easy
    tags: [cortisol, endocrinology, metabolism, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the effects of cortisol on cardiovascular system?"
    back: "Increases cardiac output and vascular tone, promotes Na+ retention"
    difficulty: easy
    tags: [cortisol, endocrinology, cardiovascular, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What effect does cortisol have on white blood cells?"
    back: "Stimulates leukocytosis and lymphopenia"
    difficulty: easy
    tags: [cortisol, endocrinology, hematology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the ACTH stimulation test used to diagnose?"
    back: "Adrenal insufficiency (glucocorticoid deficiency)"
    difficulty: easy
    tags: [ACTH, adrenal, endocrinology, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What enzymes are involved in steroid synthesis in the adrenal cortex?"
    back: "Cholesterol hydroxylase, 3-β-dehydrogenase, 17α-hydroxylase, 21-hydroxylase, 11β-hydroxylase, 18-hydroxylase, 18-oxidase"
    difficulty: medium
    tags: [adrenal, endocrinology, biochemistry, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the difference between zona glomerulosa and zona fasciculata in terms of regulation?"
    back: "Zona glomerulosa is regulated by RAAS (angiotensin II and K+), while zona fasciculata is regulated by ACTH"
    difficulty: easy
    tags: [adrenal, endocrinology, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the physiologic effects of glucocorticoids on bone?"
    back: ""
    difficulty: medium
    tags: [cortisol, bone, endocrinology, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What effect does cortisol have on bone?"
    back: ""
    difficulty: medium
    tags: [cortisol, bone, endocrinology, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the effect of calcitriol on calcium and phosphate?"
    back: "Increases intestinal calcium and phosphate absorption, increases bone resorption, increases renal calcium reabsorption, decreases PTH secretion\n\nActive vitamin D (calcitriol) raises calcium through multiple pathways but also increases phosphate - its production is stimulated by PTH"
    difficulty: easy
    tags: [endocrinology, vitamin D, calcitriol, physiology, toronto-notes, pages-0351-0352-0353-0354-0355-0356-0357-0358-0359-0360]
  - front: "Why should you ask about fish allergies before prescribing calcitonin?"
    back: "Calcitonin is derived from salmon and can cause allergic reactions in patients with fish allergies\n\nSalmon calcitonin contains proteins that may be allergenic - always screen for fish allergy before administration"
    difficulty: easy
    tags: [endocrinology, calcitonin, allergy, safety, toronto-notes, pages-0351-0352-0353-0354-0355-0356-0357-0358-0359-0360]
  - front: "When is testosterone therapy NOT suggested according to guidelines?"
    back: "Men >65 years old, men with T2DM and low testosterone, men planning fertility in the near term\n\nTestosterone suppresses spermatogenesis and is generally not recommended for older men or those seeking fertility."
    difficulty: medium
    tags: [endocrinology, testosterone, guidelines, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What hereditary disorders cause male infertility?"
    back: "Kartagener syndrome (primary ciliary dyskinesia) and cystic fibrosis (absence of vas deferens)\n\nCystic fibrosis causes congenital absence of the vas deferens, preventing sperm transport."
    difficulty: medium
    tags: [endocrinology, infertility, genetics, CF, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the clinical features of testosterone deficiency in the first trimester in utero?"
    back: "Incomplete virilization of external genitalia (ambiguous genitalia) and incomplete development of Wolffian ducts (male pseudohermaphroditism)\n\nTestosterone is needed between weeks 8-12 for male external genitalia development."
    difficulty: hard
    tags: [endocrinology, testosterone, development, teratology, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the clinical features of testosterone deficiency prepuberty?"
    back: "Incomplete pubertal maturation: high-pitched voice, sparse pubic and axillary hair, absence of facial hair, eunuchoidal body habitus, poor muscle development, reduced peak bone mass\n\nWithout testosterone at puberty, male secondary sexual characteristics fail to develop."
    difficulty: medium
    tags: [endocrinology, testosterone, puberty, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is the treatment for defects in androgen action?"
    back: "Hormone replacement or supplementation, psychological support, gonadectomy for cryptorchidism and streak gonads (due to increased testicular cancer risk)\n\nTreatment is individualized based on the specific defect and patient goals (fertility vs. gender assignment)."
    difficulty: medium
    tags: [endocrinology, androgen, treatment, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the common routes for testosterone replacement therapy?"
    back: "Intramuscular (IM) or subcutaneous (SC) injection, transdermal testosterone, or gel\n\nMultiple delivery methods exist to accommodate patient preferences and optimize testosterone levels."
    difficulty: easy
    tags: [endocrinology, testosterone, treatment, routes, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are hereditary causes of male infertility?"
    back: "Kartagener syndrome (primary ciliary dyskinesia) and cystic fibrosis (absence of vas deferens)\n\nGenetic conditions affect sperm motility or reproductive tract development."
    difficulty: easy
    tags: [endocrinology, infertility, genetic, Kartagener, cystic fibrosis, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What surgical procedures can cause male infertility?"
    back: "TURP, radical prostatectomy, or orchiectomy\n\nSurgical removal or damage to reproductive organs can impair fertility."
    difficulty: easy
    tags: [endocrinology, infertility, surgery, TURP, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is 5-alpha-reductase deficiency?"
    back: "A deficiency of the enzyme that converts testosterone to DHT, leading to incomplete virilization of external genitalia\n\nWithout DHT, the external genitalia fail to fully masculinize during fetal development."
    difficulty: medium
    tags: [endocrinology, 5-alpha-reductase, DHT, DSD, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the clinical features of testosterone deficiency in prepuberty?"
    back: "Incomplete pubertal maturation (high pitch voice, sparse pubic/axillary hair, absence of facial hair), eunuchoidal body habitus, poor muscle development, reduced peak bone mass\n\nTestosterone drives pubertal changes and bone/muscle development during adolescence."
    difficulty: medium
    tags: [endocrinology, testosterone deficiency, puberty, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the clinical features of testosterone deficiency in postpuberty?"
    back: "Decrease in energy, mood, and libido; fine wrinkles around mouth and eyes; decrease in pubic/axillary hair, hematocrit, muscle mass, strength, and BMD\n\nTestosterone maintains secondary sexual characteristics and musculoskeletal health in adults."
    difficulty: medium
    tags: [endocrinology, testosterone deficiency, adult, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What red flags should be ruled out in a male breast mass?"
    back: "Unilateral, eccentric, hard or fixed mass, skin dimpling or retraction, bloody nipple discharge or crusting\n\nThese findings suggest breast carcinoma rather than benign gynecomastia."
    difficulty: medium
    tags: [endocrinology, gynecomastia, breast cancer, red flags, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is the purpose of the Cosyntropin (ACTH) Stimulation Test?"
    back: "To diagnose glucocorticoid (cortisol) deficiency\n\n250 mcg cosyntropin is administered IV/IM, and plasma cortisol is measured before and at 30 and 60 minutes."
    difficulty: easy
    tags: [Cosyntropin Test, Diagnosis, Endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the purpose of the Dexamethasone Suppression Test?"
    back: "To diagnose cortisol hypersecretion (Cushing's syndrome)\n\nDexamethasone suppresses pituitary ACTH; plasma cortisol should be lowered if HPA axis is normal."
    difficulty: easy
    tags: [DXM Suppression Test, Diagnosis, Endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the components of the renin-angiotensin-aldosterone system (RAAS)?"
    back: "Renin (kidney) converts angiotensinogen to angiotensin I; ACE (lung and kidney) converts angiotensin I to angiotensin II; angiotensin II causes arteriolar vasoconstriction, promotes ADH release, and stimulates aldosterone release\n\nAldosterone then promotes renal Na+ retention and K+ excretion."
    difficulty: easy
    tags: [RAAS, Physiology, Endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the normal response in saline infusion test for primary aldosteronism?"
    back: "Plasma aldosterone <140 pmol/L is normal; >277 pmol/L is consistent with primary aldosteronism\n\nThe test involves IV infusion of 500 mL/h normal saline for 4 hours with measurement of plasma aldosterone."
    difficulty: medium
    tags: [saline infusion test, endocrinology, diagnostics, primary aldosteronism, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the precursor molecule for steroid synthesis in the adrenal gland?"
    back: "Cholesterol converted to pregnenolone by cholesterol hydroxylase (P450scc)\n\nThis is the rate-limiting first step in all steroid hormone biosynthesis."
    difficulty: easy
    tags: [steroidogenesis, adrenal, endocrinology, biochemistry, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the 24-hour urine free cortisol test used to diagnose?"
    back: "Cushing's syndrome - shows overproduction of cortisol\n\nElevated 24-hour urine free cortisol confirms endogenous cortisol excess."
    difficulty: medium
    tags: [urine cortisol, Cushings, endocrinology, diagnostics, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "Name four causes of male infertility related to hereditary disorders"
    back: "Kartagener syndrome (primary ciliary dyskinesia), cystic fibrosis (absence of vas deferens)\n\nGenetic conditions can affect sperm motility or reproductive tract development, causing infertility."
    difficulty: easy
    tags: [endocrinology, infertility, genetic disorders, Kartagener, cystic fibrosis, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the effects of testosterone deficiency during the first trimester in utero?"
    back: "Incomplete virilization of external genitalia (ambiguous genitalia) and incomplete development of Wolffian ducts (male pseudohermaphroditism)\n\nTestosterone is essential for male genital development between weeks 8-12 of gestation."
    difficulty: medium
    tags: [endocrinology, testosterone deficiency, development, ambiguous genitalia, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the effects of testosterone deficiency prepubertally?"
    back: "Incomplete pubertal maturation (high-pitched voice, sparse pubic and axillary hair, no facial hair), eunuchoidal body habitus, poor muscle development, reduced peak bone mass\n\nTestosterone drives puberty; deficiency leads to eunuchoid proportions due to delayed epiphyseal closure."
    difficulty: medium
    tags: [endocrinology, testosterone deficiency, puberty, eunuchoid, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "Which cancers are commonly associated with paraneoplastic syndromes?"
    back: "Lung, breast, ovaries, and lymphatic system\n\nThese tumors commonly produce ectopic hormones or trigger autoimmune responses."
    difficulty: easy
    tags: [endocrinology, paraneoplastic, oncology, cancers, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "When is testosterone therapy NOT suggested despite low testosterone levels?"
    back: "Men >65 years old, men with T2DM and low testosterone, men planning fertility in the near term.\n\nEvidence for benefit in these populations is lacking, and testosterone therapy impairs fertility."
    difficulty: medium
    tags: [endocrinology, testosterone, diabetes, fertility, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "Name 4 hereditary disorders causing male infertility."
    back: "Kartagener syndrome (primary ciliary dyskinesia) and cystic fibrosis (absence of vas deferens).\n\nThese genetic conditions affect sperm motility or reproductive tract development."
    difficulty: medium
    tags: [endocrinology, infertility, genetic-disorders, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is the treatment approach for testosterone deficiency?"
    back: "Hormone replacement or supplementation, psychological support, gonadectomy for cryptorchidism and streak gonads (due to increased testicular cancer risk).\n\nTreatment aims to replace testosterone and address complications including malignancy risk."
    difficulty: easy
    tags: [endocrinology, treatment, testosterone, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What was a significant adverse effect of intensive BP therapy in the ACCORD Trial?"
    back: "Increased serious adverse events (3.3% vs 1.27%, P<0.001)\n\nThe intensive treatment arm had significantly more serious adverse events, including bradycardia/arrhythmia (0.5% vs 0.13%) and hyperkalemia (0.4% vs 0.04%)."
    difficulty: medium
    tags: [endocrinology, diabetes, hypertension, clinical-trials, adverse-effects, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Does adding fibrate to statin therapy reduce CV events in T2DM?"
    back: "No, no significant reduction in major CV events\n\nThe ACCORD Lipid Trial found no significant differences in primary outcome (nonfatal MI, stroke, or CV death) between statin + fibrate vs statin alone."
    difficulty: easy
    tags: [endocrinology, diabetes, lipids, clinical-trials, T2DM, ACCORD, statin, fibrate, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What percentage risk reduction for any diabetes-related endpoint did intensive glucose control achieve in UKPDS 33?"
    back: "12% reduction\n\nPatients allocated to intensive treatment had their risk reduced by 12% for any diabetes-related endpoint (95% CI 1-21, P=0.029)."
    difficulty: medium
    tags: [endocrinology, diabetes, T2DM, clinical-trials, UKPDS, microvascular, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the mean follow-up duration in the ACCORD Trial?"
    back: "4.7 years\n\nThe ACCORD Trial was an RCT with 4.7 years of mean follow-up studying intensive vs standard therapy in T2DM patients with CV risk factors."
    difficulty: easy
    tags: [endocrinology, diabetes, T2DM, clinical-trials, ACCORD, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "How many medications on average were required at 1 year for intensive BP therapy in ACCORD?"
    back: "3.4 medications\n\nMean number of medications at 1 year for intensive therapy was 3.4 (95% CI 3.4-3.5) vs 2.1 (95% CI 2.1-2.2) for standard therapy."
    difficulty: medium
    tags: [endocrinology, diabetes, hypertension, clinical-trials, T2DM, ACCORD, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What was the population size in the DCCT/EDIC trial?"
    back: "1441 patients with T1DM\n\nThe DCCT trial randomly assigned 1441 patients with T1DM to intensive or conventional therapy for a mean of 6.5 years, with 93% followed until 2005."
    difficulty: easy
    tags: [endocrinology, diabetes, T1DM, clinical-trials, DCCT, EDIC, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "In UKPDS 33, what were the target FPG levels for intensive vs conventional therapy?"
    back: "Intensive: FPG <6 mmol/L; Conventional: FPG <15 mmol/L without symptoms\n\nIntensive treatment targeted FPG <6 mmol/L while conventional treatment aimed for FPG <15 mmol/L without hyperglycemic symptoms."
    difficulty: medium
    tags: [endocrinology, diabetes, T2DM, clinical-trials, UKPDS, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "Name 3 hereditary disorders that cause male infertility"
    back: "Kartagener syndrome (primary ciliary dyskinesia) and cystic fibrosis (absence of vas deferens)\n\nThese genetic conditions affect ciliary function or reproductive tract development."
    difficulty: easy
    tags: [endocrinology, infertility, genetics, Kartagener, cystic-fibrosis, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What surgeries can cause male infertility?"
    back: "TURP, radical prostatectomy, and orchiectomy\n\nThese procedures can damage sperm production, transport, or ejaculation."
    difficulty: easy
    tags: [endocrinology, infertility, surgery, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the red flags suggesting breast cancer in a male breast mass?"
    back: "Unilateral, eccentric, hard or fixed mass, skin dimpling or retraction, and nipple discharge (especially bloody) or crusting\n\nThese features warrant investigation to rule out malignancy."
    difficulty: easy
    tags: [endocrinology, gynecomastia, breast-cancer, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is ACTH and what are its key features?"
    back: "Adrenocorticotropic hormone (ACTH) is a polypeptide cleaved from POMC, secreted pulsatilely from the anterior pituitary with diurnal variation (peak 0200-0400h, trough 1800-2400h)\n\nACTH stimulates adrenal cortex growth and glucocorticoid release; it can bind to MSH receptors enhancing melanogenesis."
    difficulty: easy
    tags: [ACTH, pituitary, endocrinology, adrenal, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the normal response of plasma aldosterone to saline infusion (NS) in primary aldosteronism testing?"
    back: "Plasma aldosterone >277 pmol/L is consistent with primary aldosteronism, while <140 pmol/L is normal\n\nFailure to suppress aldosterone with volume expansion confirms autonomous aldosterone production."
    difficulty: hard
    tags: [primary aldosteronism, confirmatory test, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the steps in the renin-angiotensin-aldosterone axis?"
    back: "Renin (kidney) converts angiotensinogen to angiotensin I → ACE (lung/kidney) converts to angiotensin II → stimulates aldosterone release → renal Na+ retention, K+ excretion, arteriolar vasoconstriction, ADH release\n\nThis axis is critical for blood pressure, volume, and electrolyte homeostasis."
    difficulty: easy
    tags: [RAAS, renin, angiotensin, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What stimulates renin release from the juxtaglomerular apparatus?"
    back: "Decreased volume, decreased arterial pressure, decreased Na delivery to macula densa, and sympathetic stimulation\n\nThese factors signal the kidney to increase renin production to restore blood pressure and volume."
    difficulty: medium
    tags: [renin, JGA, volume regulation, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What enzyme converts testosterone to dihydrotestosterone?"
    back: "5-alpha-reductase converts testosterone to dihydrotestosterone (DHT)\n\nDHT is a more potent androgen responsible for male pattern hair growth and prostate development."
    difficulty: easy
    tags: [testosterone, DHT, steroidogenesis, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the source of estradiol in females?"
    back: "Estradiol is produced from testosterone via aromatase enzyme activity\n\nIn females, aromatase is primarily active in ovarian granulosa cells and adipose tissue."
    difficulty: easy
    tags: [estradiol, aromatase, steroidogenesis, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the 24-hour urine free cortisol test used to evaluate?"
    back: "It evaluates for overproduction of cortisol in Cushing's syndrome\n\nElevated 24-hour urine free cortisol indicates increased endogenous cortisol production."
    difficulty: medium
    tags: [Cushings syndrome, cortisol, diagnostic, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What is the diurnal variation pattern of ACTH and cortisol?"
    back: "Peak ACTH and cortisol secretion occurs at 0200-0400h, with lowest levels at 1800-2400h\n\nThis circadian rhythm is regulated by the suprachiasmatic nucleus and is disrupted in Cushing's syndrome."
    difficulty: easy
    tags: [ACTH, cortisol, circadian rhythm, endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What was the conclusion of the ACCORD Lipid trial regarding adding fibrate to statin therapy in T2DM?"
    back: "Adding fibrate to statin therapy does not reduce major CV event risk in T2DM patients\n\nThis double-blinded RCT with 5518 T2DM patients over 4.7 years found no significant differences in primary outcome (major CV events) between statin + fibrate vs statin alone."
    difficulty: medium
    tags: [diabetes, lipids, fibrates, statins, clinical-trials, endocrinology, toronto-notes, pages-0371-0372-0373-0374-0375-0376-0377-0378-0379-0380]
  - front: "What hereditary disorders cause male infertility due to ciliary dysfunction?"
    back: "Kartagener syndrome (primary ciliary dyskinesia)\n\nDefective cilia affect sperm motility, causing infertility and also causing bronchiectasis and sinusitis."
    difficulty: medium
    tags: [endocrinology, infertility, Kartagener, genetics, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "Why does cystic fibrosis cause male infertility?"
    back: "Absence of the vas deferens\n\nCFTR mutations cause congenital bilateral absence of the vas deferens (CBAVD), obstructing sperm transport."
    difficulty: medium
    tags: [endocrinology, infertility, cystic-fibrosis, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What fetal abnormalities occur with testosterone deficiency in the first trimester?"
    back: "Incomplete virilization of external genitalia (ambiguous genitalia) and incomplete development of Wolffian ducts\n\nTestosterone is essential for male internal and external genital development during the first trimester."
    difficulty: hard
    tags: [endocrinology, testosterone, fetal-development, disorders-of-sex-development, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the features of prepubertal testosterone deficiency?"
    back: "High-pitched voice, sparse pubic and axillary hair, absence of facial hair, eunuchoidal body habitus, poor muscle development, reduced peak bone mass\n\nWithout testosterone, pubertal maturation does not occur, leading to eunuchoid proportions from continued long bone growth."
    difficulty: hard
    tags: [endocrinology, hypogonadism, puberty, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the features of postpubertal testosterone deficiency?"
    back: "Decreased energy, mood, and libido; fine wrinkles around mouth and eyes; decreased pubic/axillary hair, hematocrit, muscle mass, strength, and BMD\n\nTestosterone deficiency after puberty causes regression of secondary sexual characteristics and reduced anabolic effects."
    difficulty: medium
    tags: [endocrinology, hypogonadism, testosterone, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "Which cancers commonly cause paraneoplastic syndromes?"
    back: "Lung, breast, ovaries, or lymphatic system\n\nThese tumors commonly produce ectopic hormones or trigger immune cross-reactions."
    difficulty: easy
    tags: [endocrinology, paraneoplastic, oncology, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "List hereditary disorders that cause male infertility"
    back: "Kartagener syndrome (primary ciliary dyskinesia) and cystic fibrosis (absence of vas deferens)\n\nKartagener syndrome causes immotile sperm. CFTR mutations cause congenital absence of the vas deferens."
    difficulty: medium
    tags: [endocrinology, infertility, genetics, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "List surgical causes of male infertility"
    back: "TURP, radical prostatectomy, and orchiectomy\n\nThese procedures can damage nerves, remove reproductive structures, or impair sperm transport."
    difficulty: easy
    tags: [endocrinology, infertility, surgery, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What cancers are commonly associated with paraneoplastic syndromes?"
    back: "Lung, breast, ovaries, and lymphatic system\n\nThese cancers frequently produce ectopic hormones or trigger immune cross-reactions."
    difficulty: easy
    tags: [endocrinology, paraneoplastic, oncology, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What causes ectopic ACTH secretion leading to Cushing's syndrome?"
    back: "Small cell lung cancer (most common), pancreatic cancer, and other neuroendocrine tumors\n\nThese tumors produce ACTH or ACTH-like peptides causing cortisol excess."
    difficulty: medium
    tags: [endocrinology, paraneoplastic, Cushings, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What hereditary disorders can cause male infertility?"
    back: "Kartagener syndrome (primary ciliary dyskinesia) and cystic fibrosis (absence of vas deferens)\n\nThese genetic conditions affect sperm motility or reproductive tract development."
    difficulty: medium
    tags: [endocrinology, infertility, genetic disorders, Kartagener, cystic fibrosis, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What clinical features occur with testosterone deficiency in the first trimester in utero?"
    back: "Incomplete virilization of external genitalia (ambiguous genitalia) and incomplete development of Wolffian ducts\n\nAndrogens are critical for male genital development during early pregnancy."
    difficulty: medium
    tags: [endocrinology, testosterone, developmental, genitalia, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the clinical features of prepubertal testosterone deficiency?"
    back: "Incomplete pubertal maturation (high pitch voice, sparse pubic/axillary hair, absent facial hair), eunuchoidal body habitus, poor muscle development, and reduced peak bone mass\n\nTestosterone is essential for pubertal development and bone/muscle maturation."
    difficulty: medium
    tags: [endocrinology, testosterone, puberty, development, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the clinical features of postpubertal testosterone deficiency?"
    back: "Decrease in energy, mood, and libido; fine wrinkles around mouth and eyes; decrease in pubic/axillary hair, hematocrit, muscle mass, strength, and BMD\n\nTestosterone maintains secondary sexual characteristics and lean body mass in adults."
    difficulty: easy
    tags: [endocrinology, testosterone, hypogonadism, symptoms, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is the treatment for testosterone deficiency due to defects in androgen action?"
    back: "Hormone replacement or supplementation, psychological support, and gonadectomy for cryptorchidism and streak gonads (due to increased cancer risk)\n\nTreatment addresses both hormone deficiency and cancer prevention in dysgenetic gonads."
    difficulty: medium
    tags: [endocrinology, androgen, treatment, gonadectomy, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "When is testosterone therapy NOT suggested?"
    back: "Men >65 years, men with T2DM with low testosterone, and men planning fertility in the near term.\n\nEvidence for benefit in older men is unclear, and testosterone suppresses spermatogenesis, causing infertility."
    difficulty: medium
    tags: [endocrinology, testosterone, fertility, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What percentage of Canadians are affected by diabetes?"
    back: "Up to 10%\n\nDiabetes is a major health concern affecting approximately 10% of the Canadian population."
    difficulty: easy
    tags: [endocrinology, diabetes, epidemiology, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How does mortality risk compare for Canadian adults with vs without diabetes?"
    back: "Adults with DM are twice as likely to die prematurely\n\nCanadian adults with diabetes have significantly increased mortality risk compared to non-diabetic adults."
    difficulty: easy
    tags: [endocrinology, diabetes, epidemiology, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Which ethnic groups have increased risk of T2DM?"
    back: "African, Arab, Asian, Hispanic, or South Asian descent\n\nThese ethnic groups have higher genetic predisposition to type 2 diabetes mellitus."
    difficulty: easy
    tags: [endocrinology, diabetes, risk factors, epidemiology, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What tool is recommended for assessing T2DM risk?"
    back: "CANRISK calculator\n\nCANRISK is a validated Canadian tool for assessing type 2 diabetes risk based on risk factors."
    difficulty: easy
    tags: [endocrinology, diabetes, screening, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the LDL-C target for diabetics on treatment?"
    back: "<2 mmol/L\n\nLipid management in diabetes aims for LDL cholesterol below 2 mmol/L to reduce CV risk."
    difficulty: easy
    tags: [endocrinology, diabetes, management, targets, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What percentage of calories should come from combined saturated fats and trans fatty acids?"
    back: "<10% of calories\n\nDiabetics should limit saturated and trans fats to less than 10% of total caloric intake."
    difficulty: easy
    tags: [endocrinology, diabetes, nutrition, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the CANRISK calculator used for?"
    back: "To identify high-risk individuals for T2DM screening\n\nCANRISK is a validated Canadian tool that calculates diabetes risk based on modifiable and non-modifiable risk factors."
    difficulty: easy
    tags: [endocrinology, diabetes, screening, risk assessment, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What screening should be done annually for diabetes patients?"
    back: "Retinopathy screening, fasting lipid profile, random urine ACR and Cr, foot exam with 10g monofilament\n\nAnnual comprehensive screening is essential for early detection and prevention of diabetes complications."
    difficulty: medium
    tags: [endocrinology, diabetes, screening, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should glucose monitoring be done in diabetes patients?"
    back: "Regular glucose monitoring as directed; frequency depends on treatment regimen\n\nSelf-monitoring of blood glucose helps patients and providers adjust therapy and prevent hypo/hyperglycemia."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, glucose, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should home glucose monitors be calibrated?"
    back: "Bimonthly (bi-weekly)\n\nRegular calibration ensures accuracy of self-monitored glucose readings, which are critical for treatment decisions."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, equipment, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should ECG be repeated for high-risk diabetes patients?"
    back: "Every 2 years\n\nRegular cardiac screening is important due to the increased cardiovascular risk in diabetes patients."
    difficulty: easy
    tags: [endocrinology, diabetes, cardiovascular, screening, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the complications and comorbidities associated with diabetes?"
    back: "Leading cause of new-onset blindness and renal dysfunction; Canadian adults with DM are twice as likely to die prematurely\n\nDiabetes has significant microvascular and macrovascular complications."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What does a foot exam for sensation involve in diabetes monitoring?"
    back: "10g monofilament test\n\nThe 10g monofilament test is used to assess sensation in the feet of diabetic patients to identify those at risk for foot ulcers."
    difficulty: easy
    tags: [endocrinology, diabetes, physical exam, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What percentage of calories should come from combined saturated fats and trans fatty acids for diabetics?"
    back: "Less than 10%\n\nDiabetics should decrease combined saturated fats and trans fatty acids to less than 10% of total calories."
    difficulty: easy
    tags: [endocrinology, diabetes, diet, nutrition, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should retinopathy screening occur in diabetic patients?"
    back: "Annually\n\nAnnual retinopathy screening is recommended for diabetic patients to prevent vision loss."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, screening, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the baseline ECG recommendation for diabetic patients?"
    back: "Baseline ECG with repeat testing every 2 years for those at high-risk\n\nA baseline ECG is recommended for diabetic patients, with repeat testing every 2 years for those at high cardiovascular risk."
    difficulty: medium
    tags: [endocrinology, diabetes, cardiology, screening, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How does diabetes affect cardiovascular outcomes in Canadian adults?"
    back: "Canadian adults with diabetes are twice as likely to die prematurely compared to persons without diabetes\n\nDiabetic adults have significantly increased cardiovascular mortality, being twice as likely to die prematurely."
    difficulty: easy
    tags: [endocrinology, diabetes, epidemiology, cardiovascular, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Which high-risk ethnic populations have increased T2DM risk?"
    back: "African, Arab, Asian, Hispanic, or South Asian descent\n\nPeople of African, Arab, Asian, Hispanic, or South Asian descent have increased risk of developing type 2 diabetes."
    difficulty: easy
    tags: [endocrinology, diabetes, epidemiology, risk factors, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the role of a registered dietician in diabetes management?"
    back: "All diabetics should see a registered dietician for nutrition counselling\n\nMedical nutrition therapy from a registered dietician is a cornerstone of diabetes management."
    difficulty: easy
    tags: [endocrinology, diabetes, nutrition, management, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the major long-term complications of diabetes?"
    back: "New-onset blindness and renal dysfunction\n\nDiabetes is the leading cause of new-onset blindness and renal dysfunction in adults."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the target LDL cholesterol for diabetics on treatment?"
    back: "LDL-C <2 mmol/L\n\nLDL-C should be <2 mmol/L when treating cardiovascular risk in diabetics."
    difficulty: easy
    tags: [endocrinology, diabetes, treatment goals, lipidemia, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should retinopathy screening be arranged for diabetics?"
    back: "Annually\n\nAnnual retinopathy screening should be arranged to prevent vision loss from diabetic eye disease."
    difficulty: easy
    tags: [endocrinology, diabetes, screening, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "When should T1DM patients have their first ophthalmology consult?"
    back: "Within 5 years of diagnosis\n\nT1DM patients should have an ophthalmology consult within 5 years of diagnosis for retinopathy screening."
    difficulty: easy
    tags: [endocrinology, diabetes, T1DM, screening, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the recommended frequency for ECG testing in high-risk diabetics?"
    back: "Every 2 years\n\nBaseline ECG should be done, with repeat testing every 2 years for those at high cardiovascular risk."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, cardiovascular, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the recommended frequency for lipid profile testing in diabetics?"
    back: "Annually\n\nFasting lipid profile should be checked annually in diabetics to assess cardiovascular risk."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, lipidemia, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the recommended frequency for urine ACR and Cr testing in diabetics?"
    back: "Annually\n\nAnnual random urine ACR and creatinine should be monitored to detect diabetic nephropathy."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, nephropathy, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the SMART goals framework for diabetes management?"
    back: "Specific, Measurable, Achievable, Relevant, Time-bound\n\nSMART goals help diabetics set concrete objectives for glycemic control, blood pressure, and lifestyle modifications."
    difficulty: easy
    tags: [endocrinology, diabetes, management, goals, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is a key dietary recommendation for diabetics regarding saturated fats?"
    back: "Decrease combined saturated fats and trans fatty acids to <10% of calories\n\nDiabetics should limit combined saturated fats and trans fatty acids to less than 10% of total caloric intake."
    difficulty: easy
    tags: [endocrinology, diabetes, diet, nutrition, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the target LDL cholesterol for diabetic patients on lipid-lowering therapy?"
    back: "<2 mmol/L\n\nLDL-C target of <2 mmol/L is recommended for cardiovascular risk reduction in diabetes."
    difficulty: easy
    tags: [endocrinology, diabetes, cholesterol, treatment goals, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the recommended frequency of diabetes monitoring visits?"
    back: "Every 2-4 months for ongoing management\n\nRegular follow-up every 2-4 months allows for treatment adjustment and complication monitoring."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should ECG be repeated for high-risk diabetic patients?"
    back: "Every 2 years\n\nHigh-risk diabetic patients should have ECG monitoring every 2 years for cardiovascular assessment."
    difficulty: easy
    tags: [endocrinology, diabetes, cardiology, monitoring, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What percentage of total calories should come from combined saturated fats and trans fatty acids?"
    back: "<10%\n\nLimiting saturated and trans fats to less than 10% of total caloric intake is recommended for cardiovascular health."
    difficulty: easy
    tags: [endocrinology, diabetes, nutrition, diet, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What ethnic groups have increased risk of T2DM?"
    back: "African, Arab, Asian, Hispanic, or South Asian descent\n\nCertain ethnic populations have higher predilection for developing type 2 diabetes."
    difficulty: easy
    tags: [endocrinology, diabetes, risk factors, ethnicity, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the chronic macrovascular complications of diabetes?"
    back: "CAD (coronary artery disease), CVD (cerebrovascular disease), PVD (peripheral vascular disease)\n\nMacrovascular complications are the leading cause of mortality in diabetic patients."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, cardiovascular, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the major complications of diabetes that Canadians face?"
    back: "Leading cause of new-onset blindness and renal dysfunction\n\nDiabetes is the leading cause of new-onset blindness (retinopathy) and renal dysfunction (nephropathy) in Canadians."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the mortality risk for Canadian adults with diabetes?"
    back: "Twice as likely to die prematurely compared to persons without diabetes\n\nCanadian adults with diabetes have twice the risk of premature death compared to those without diabetes."
    difficulty: easy
    tags: [endocrinology, diabetes, mortality, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the LDL-C target in diabetic patients?"
    back: "<2 mmol/L if treating\n\nLDL cholesterol should be less than 2 mmol/L in diabetic patients receiving lipid-lowering therapy."
    difficulty: easy
    tags: [endocrinology, diabetes, cholesterol, treatment goals, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the annual screening recommendation for diabetic retinopathy?"
    back: "Annual retinopathy screening\n\nAnnual retinopathy screening should be arranged for all diabetic patients to detect and prevent vision loss."
    difficulty: easy
    tags: [endocrinology, diabetes, screening, retinopathy, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should fasting lipid profile be checked in diabetes?"
    back: "Annually\n\nFasting lipid profile should be checked annually in diabetic patients to assess cardiovascular risk."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, lipids, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is the target LDL cholesterol for diabetic patients?"
    back: "LDL-C <2 mmol/L\n\nStatin therapy is recommended to achieve LDL-C <2 mmol/L in diabetic patients for CVD risk reduction."
    difficulty: easy
    tags: [endocrinology, diabetes, treatment targets, cholesterol, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should fasting lipid profile be checked in diabetic patients?"
    back: "Annually\n\nAnnual lipid profiling is recommended to assess cardiovascular risk in diabetic patients."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, lipids, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is used to test foot sensation in diabetic patients?"
    back: "10g monofilament\n\nThe 10g monofilament test assesses protective sensation and identifies patients at risk for foot ulcers."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, foot exam, neuropathy, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should diabetic retinopathy screening occur?"
    back: "Annually\n\nAnnual retinopathy screening is recommended to detect early diabetic eye disease."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, retinopathy, ophthalmology, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the long-term complications of diabetes?"
    back: "Blindness (retinopathy), renal dysfunction (nephropathy), CAD, CVD, PVD\n\nDiabetes leads to microvascular and macrovascular complications affecting multiple organ systems."
    difficulty: easy
    tags: [endocrinology, diabetes, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Diabetic adults in Canada are how much more likely to die prematurely compared to non-diabetics?"
    back: "Twice as likely\n\nDiabetes significantly increases mortality risk, with diabetic adults having double the risk of premature death."
    difficulty: easy
    tags: [endocrinology, diabetes, epidemiology, prognosis, Canada, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "Why is diabetes a major health concern in Canada?"
    back: "Leading cause of new-onset blindness and renal dysfunction; Canadian adults with DM are twice as likely to die prematurely\n\nDM causes significant microvascular and macrovascular complications leading to morbidity and mortality."
    difficulty: medium
    tags: [endocrinology, diabetes, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "When should Type 1 DM patients have their first ophthalmology exam?"
    back: "Within 5 years of diagnosis\n\nEarly retinopathy screening is essential as diabetic eye disease can develop silently."
    difficulty: easy
    tags: [endocrinology, diabetes, T1DM, screening, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What is IGT and IFG?"
    back: "Impaired Glucose Tolerance and Impaired Fasting Glucose - prediabetic states\n\nIGT and IFG represent intermediate metabolic states indicating prediabetes."
    difficulty: easy
    tags: [endocrinology, diabetes, prediabetes, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the rising causes of T2DM incidence?"
    back: "Increasing obesity, sedentary lifestyle, and aging of the population\n\nType 2 diabetes incidence is increasing due to modifiable lifestyle factors (obesity, inactivity) and demographic changes (aging population)."
    difficulty: easy
    tags: [endocrinology, diabetes, epidemiology, risk factors, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What annual investigations are recommended for diabetes?"
    back: "Annual fasting lipid profile, random urine ACR and Cr, annual retinopathy screening\n\nAnnual screening for dyslipidemia, nephropathy (urine albumin:creatinine ratio), and diabetic retinopathy is essential for complication prevention."
    difficulty: easy
    tags: [endocrinology, diabetes, monitoring, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "When should ophthalmology consultation be arranged for T1DM patients?"
    back: "Within 5 years of diagnosis\n\nT1DM patients should have their first ophthalmology consultation within 5 years of diagnosis to screen for diabetic retinopathy."
    difficulty: easy
    tags: [endocrinology, diabetes, T1DM, screening, complications, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What pituitary dysfunction occurs in hemochromatosis?"
    back: "Hypogonadotropic hypogonadism (impotence, decreased libido, amenorrhea)\n\nIron deposition in the anterior pituitary causes secondary hypogonadism with low LH/FSH and low testosterone/estrogen levels."
    difficulty: medium
    tags: [hemochromatosis, endocrinology, hypogonadism, pituitary, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
