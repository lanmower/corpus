# General (Ophthalmology) - generated from srs-mccqe1
cards:
  - front: "What are the major complications of diabetes?"
    back: "Leading cause of new-onset blindness and renal dysfunction; increased risk of CAD, CVD, PVD\n\nMicrovascular complications affect eyes and kidneys; macrovascular complications affect cardiovascular system."
    difficulty: easy
    tags: [diabetes, complications, ophthalmology, nephrology, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "How often should retinopathy screening occur in diabetes?"
    back: "Annual retinopathy screening\n\nEarly detection and treatment of diabetic retinopathy prevents vision loss."
    difficulty: easy
    tags: [diabetes, retinopathy, screening, ophthalmology, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are Kayser-Fleischer rings and how do they relate to Wilson's disease?"
    back: "Copper deposits in Descemet's membrane of the cornea; present in 50% of isolated liver cases but more common in CNS involvement\n\nKayser-Fleischer rings are a key diagnostic feature of Wilson's disease and typically require slit-lamp examination for visualization."
    difficulty: medium
    tags: [Wilsons disease, ophthalmology, diagnosis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What percentage of Wilson's disease patients present with Kayser-Fleischer rings when there is isolated liver involvement?"
    back: "~50%\n\nKayser-Fleischer rings are more commonly present in patients with CNS involvement (up to 90%) compared to those with isolated hepatic disease (~50%)."
    difficulty: medium
    tags: [Wilsons disease, Kayser-Fleischer ring, ophthalmology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are Kayser-Fleischer rings and their significance in Wilson's disease?"
    back: "Copper deposits in Descemet's membrane of the cornea; more common in CNS involvement (present in ~50% of isolated liver disease)\n\nKayser-Fleischer rings are golden-brown corneal deposits visible on slit-lamp examination. They are highly suggestive of Wilson's disease but present in only 50% of patients with isolated hepatic involvement."
    difficulty: medium
    tags: [wilsons-disease, ophthalmology, diagnosis, hepatology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What ocular staining score qualifies for Sjogren's ACR/EULAR criteria?"
    back: "Score ≥5 (or van Bijsterveld score ≥4) in at least one eye\n\nOcular staining uses fluorescein dye to assess conjunctival and corneal damage from dry eyes."
    difficulty: medium
    tags: [Sjogrens, Ophthalmology, Diagnosis, toronto-notes, pages-1511-1512-1513-1514-1515-1516-1517-1518-1519-1520]
