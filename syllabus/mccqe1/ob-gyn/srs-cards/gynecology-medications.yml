# Gynecology Medications (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What is leuprolide (Lupron) and what are its indications?"
    back: "Leuprolide is a synthetic GnRH agonist that induces a reversible hypoestrogenic state. Indications include endometriosis, leiomyomata (fibroids), dysfunctional uterine bleeding (DUB), and precocious puberty.\n\nDespite being called a 'GnRH antagonist' in some older references, leuprolide acts as a GnRH agonist causing receptor downregulation and thus hypoestrogenism. Treatment is usually limited to 6 months due to bone density effects; retreatment with leuprolide alone is not recommended. Key side effects include hot flashes, vaginitis, and reduced bone density."
    difficulty: medium
    tags: [gynecology, GnRH, leuprolide, endometriosis, fibroids, medications]
  - front: "What are the contraindications to leuprolide (Lupron)?"
    back: "Contraindications: pregnancy, undiagnosed vaginal bleeding, breastfeeding.\n\nLeuprolide induces a hypoestrogenic state and is teratogenic, making pregnancy an absolute contraindication. Retreatment after 6 months requires bone density monitoring due to risk of osteoporosis. It is dosed as 3.75 mg IM monthly or 11.25 mg IM every 3 months."
    difficulty: medium
    tags: [gynecology, leuprolide, contraindications, medications]
  - front: "What is menotropin (Pergonal) and what are its main side effects?"
    back: "Menotropin is a human gonadotropin with FSH and LH effects used for infertility. Side effects include bloating, abdominal/pelvic pain, headache, N/V, and risk of multiple pregnancy.\n\nMenotropin stimulates ovarian follicle development and induces ovulation. It is dosed 75-150 IU FSH/LH IM daily for 7-12 days, followed by 10,000 IU HCG 1 day after the last dose. Contraindications include primary ovarian failure, intracranial lesion, uncontrolled thyroid/adrenal dysfunction, ovarian cysts (not PCOS), pregnancy, and undiagnosed uterine bleeding."
    difficulty: medium
    tags: [gynecology, infertility, menotropin, gonadotropins, medications]
  - front: "What are the indications, dosing, and a key drug interaction of metronidazole in gynecology?"
    back: "Indications: bacterial vaginosis, trichomonas vaginitis. Dosing: 2 g PO single dose or 500 mg PO BID x 7 days. Key interaction: disulfiram-like reaction with alcohol (flushing, tachycardia, N/V).\n\nMetronidazole is bactericidal via toxic metabolites that damage bacterial DNA. It is contraindicated in first-trimester pregnancy. Other drug interactions include cisapride, warfarin, cimetidine, lithium, amiodarone, milk thistle, and carbamazepine. The disulfiram-like reaction is a clinically important and high-yield interaction to remember."
    difficulty: easy
    tags: [gynecology, metronidazole, bacterial-vaginosis, trichomonas, drug-interactions]
  - front: "What is the mechanism and indication of oxybutynin (Ditropan)?"
    back: "Oxybutynin is an anticholinergic that relaxes bladder smooth muscle and inhibits involuntary detrusor contractions. It is used for overactive bladder (urge incontinence).\n\nOxybutynin is dosed 5 or 10 mg/d PO, titrated by 5 mg weekly to a maximum of 30 mg/d. Side effects are typical anticholinergic: dry mouth/eyes, constipation, palpitations, urinary retention, dizziness. Contraindicated in narrow-angle glaucoma, GI ileus, severe colitis, and obstructive uropathy."
    difficulty: easy
    tags: [gynecology, oxybutynin, overactive-bladder, anticholinergic, urge-incontinence]
  - front: "What is tolterodine (Detrol) used for and what are its serious side effects?"
    back: "Tolterodine is an anticholinergic used for overactive bladder (urge incontinence). Serious side effects include anaphylaxis, psychosis, and tachycardia.\n\nLike oxybutynin, tolterodine inhibits detrusor contractions via anticholinergic mechanisms. It is dosed 1-2 mg PO BID. In contrast to oxybutynin, tolterodine carries risks of anaphylaxis and psychosis, which are less common with oxybutynin. Contraindicated in glaucoma, gastric/urinary retention."
    difficulty: medium
    tags: [gynecology, tolterodine, overactive-bladder, anticholinergic, side-effects]
  - front: "What is tranexamic acid (Cyklokapron), its mechanism, indication, and key contraindications in gynecology?"
    back: "Tranexamic acid is an antifibrinolytic (reversibly inhibits plasminogen activation) used for menorrhagia. Contraindicated in thromboembolic disease, acquired colour vision disturbances, subarachnoid hemorrhage, and age <15 years.\n\nTranexamic acid is dosed 1-1.5 g TID-QID for the first 4 days of the menstrual cycle (max 4 g/day). It reduces menstrual blood loss without hormonal effects. Ophthalmic monitoring is recommended with prolonged use. Rare cases of thrombosis have been reported."
    difficulty: medium
    tags: [gynecology, tranexamic-acid, menorrhagia, antifibrinolytic, contraindications]
  - front: "Why was ulipristal acetate (Fibristal) withdrawn from the Canadian market?"
    back: "Fibristal was voluntarily withdrawn from the Canadian market in 2020 due to risk of drug-induced liver injury.\n\nUlipristal acetate is a selective progesterone receptor modulator (SPRM) that was used for preoperative treatment of leiomyoma (uterine fibroids). Despite its efficacy, post-marketing surveillance identified a risk of serious hepatotoxicity, leading to withdrawal. This is a notable Canadian regulatory event."
    difficulty: easy
    tags: [gynecology, ulipristal, fibroids, drug-safety, Canada]
  - front: "What is urofollitropin (Metrodin) and what are its contraindications?"
    back: "Urofollitropin is FSH used for ovulation induction in PCOS. Contraindicated in primary ovarian failure, intracranial lesion (e.g., pituitary tumour), uncontrolled thyroid/adrenal dysfunction, ovarian cysts (not PCOS), pregnancy, and abnormal uterine bleeding (AUB).\n\nUrofollitropin is dosed 75 IU SC x 7-12 days. Side effects include ovarian enlargement/cysts, edema, arterial thromboembolism, fever, abdominal pain, headache, and multiple pregnancy. The distinction between PCOS (not a contraindication) and other ovarian cysts (a contraindication) is clinically important."
    difficulty: medium
    tags: [gynecology, urofollitropin, PCOS, infertility, ovulation-induction]
