# Gastroenterology Motility (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is achalasia and what are its diagnostic findings?"
    back: "Achalasia is failure of smooth muscle relaxation at the LES with swallowing, resulting in absent peristalsis. Usually idiopathic (Auerbach's plexus degeneration); secondary causes include malignancy and Chagas disease (Trypanosoma cruzi).\n\nDiagnostic findings:\n- CXR: no air in stomach, dilated esophagus\n- Barium swallow: esophagus terminates in narrowing at LES ('bird's beak' appearance)\n- Endoscopy: normal mucosa, tight LES, residual liquid/food debris in dilated esophagus\n- Manometry: definitive diagnosis — increased LES pressure, incomplete LES relaxation with swallowing, aperistalsis\n\nManometry is the definitive diagnostic test for achalasia. The 'bird's beak' on barium swallow is classic but not diagnostic alone. Endoscopy is important to exclude pseudoachalasia due to malignancy."
    difficulty: medium
    tags: [achalasia, LES, manometry, birds beak, dysphagia, gastroenterology]
  - front: "What are the treatment options for achalasia?"
    back: "1. Pneumatic dilation (5% risk of perforation)\n2. Injection of botulinum toxin into LES (temporary effect)\n3. Surgical myotomy (Heller's myotomy)\n4. POEM (peroral endoscopic myotomy) — non-inferior to laparoscopic Heller's myotomy at 2 years\n\nPer a 2019 NEJM RCT, POEM was non-inferior to laparoscopic Heller's myotomy (LHM) for symptomatic achalasia at 2 years (83% vs 81.7% clinical success). POEM was associated with more reflux esophagitis at 12 months (44% vs 29%). Botulinum toxin is temporary and reserved for poor surgical candidates."
    difficulty: medium
    tags: [achalasia, POEM, Heller myotomy, pneumatic dilation, treatment, gastroenterology]
  - front: "What are the pathophysiology, diagnosis, and treatment of scleroderma-related esophageal disease?"
    back: "Pathophysiology: Systemic autoimmune/fibrotic disease causing blood vessel damage → intramural neuronal dysfunction → distal esophageal muscle weakening → aperistalsis and loss of LES tone → reflux → stricture → dysphagia.\n\nDiagnosis: Clinical features of scleroderma; manometry showing decreased LES pressure and decreased/absent peristalsis in the esophageal body.\n\nTreatment: Aggressive GERD therapy (PPIs BID) and prokinetic agents (domperidone, metoclopramide).\n\nUnlike achalasia (increased LES pressure), scleroderma causes decreased LES pressure — distinguishable on manometry. The aperistalsis combined with low LES tone creates severe GERD and dysphagia."
    difficulty: medium
    tags: [scleroderma, esophagus, GERD, aperistalsis, manometry, gastroenterology]
  - front: "What is diffuse esophageal spasm (DES) and how is it diagnosed and treated?"
    back: "DES is normal peristalsis interspersed with frequent, repetitive, spontaneous, high-pressure, non-peristaltic waves (tertiary peristalsis). It is rare and can be difficult to diagnose due to intermittent presentation.\n\nDiagnosis:\n- Barium x-ray: 'corkscrew pattern'\n- Manometry: >20% premature contractions\n- Endoscopy: normal mucosa\n\nTreatment:\n- Reassurance that symptoms are not cardiac\n- Medical: nitrates, calcium channel blockers, anticholinergics (variable benefit)\n- Surgical: long esophageal myotomy if unresponsive (rarely helpful); balloon dilatation\n\nDES presents with chest pain and dysphagia, making differentiation from cardiac chest pain important. The corkscrew pattern on barium swallow is classic. Manometry with >20% premature contractions is diagnostic."
    difficulty: medium
    tags: [diffuse esophageal spasm, DES, manometry, corkscrew, chest pain, gastroenterology]
