# Family Medicine Anxiety (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the GAD-7 mnemonic symptoms of Generalized Anxiety Disorder (GAD)?"
    back: "F-A-C-R-E-S-T: Feeling anxious/nervous (excessive worry), Ability to control worry is absent, Concentration impairment, Restlessness, Energy decreased, Sleep impairment, Tension in muscles. Duration must be >6 months.\n\nThe GAD-7 tool is used to both screen and monitor anxiety severity. In primary care, 25–30% of patients have psychiatric disorders, and many are undiagnosed. Organic causes (hyperthyroidism, pheochromocytoma, COPD, arrhythmias) and drug causes (amphetamines, caffeine, benzodiazepine/alcohol withdrawal) must be excluded before diagnosing GAD."
    difficulty: easy
    tags: [anxiety, GAD, GAD-7, diagnosis, family medicine, psychiatry]
  - front: "What medical and substance-related causes must be ruled out before diagnosing an anxiety disorder?"
    back: "Cardiac: post-MI, arrhythmias. Endocrine: hyperthyroidism, diabetes, pheochromocytoma. Respiratory: asthma, COPD. Psychiatric: somatoform, psychotic, mood disorders (depression, bipolar), personality disorders. Drugs: amphetamines, thyroid preparations, caffeine, OTC cold/decongestants, alcohol/benzodiazepine withdrawal, beta-agonists.\n\nPheochromocytoma classically mimics panic disorder with episodic sympathetic surges. Hyperthyroidism presents with anxiety, tremor, palpitations, and weight loss. Beta-agonist inhalers (e.g., salbutamol) can cause tremor and tachycardia resembling anxiety. Thorough history and physical are essential before labeling as primary anxiety."
    difficulty: medium
    tags: [anxiety, differential diagnosis, rule out, pheochromocytoma, hyperthyroidism, family medicine]
  - front: "What is the management approach for anxiety disorders in primary care?"
    back: "1. Patient education (emphasize prevalence, good recovery rate). 2. Lifestyle modifications: exercise, reduce caffeine/alcohol (collaborative, person-centered plan). 3. Psychological: CBT, exposure therapy, relaxation techniques, mindfulness. 4. Pharmacotherapy (see Psychiatry). 5. Self-help materials and community resources/support groups.\n\nCBT is the most evidence-based psychotherapy for anxiety disorders. In primary care, a stepped care approach is used — starting with psychoeducation and lifestyle changes before escalating to therapy and medication. Co-existing depression is common and should be screened for concurrently."
    difficulty: easy
    tags: [anxiety, management, CBT, pharmacotherapy, family medicine]
