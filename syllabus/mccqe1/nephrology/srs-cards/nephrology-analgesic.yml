# Nephrology Analgesic (Nephrology) - generated from srs-mccqe1
cards:
  - front: "What is the mechanism of NSAID-induced vasomotor AKI and which populations are most at risk?"
    back: "NSAIDs inhibit cyclooxygenase, preventing prostaglandin synthesis. Normally, prostaglandins vasodilate the afferent arteriole to maintain renal blood flow. Without prostaglandins, afferent vasoconstriction causes renal ischemia → prerenal azotemia. High-risk: elderly, underlying renal disease, hypovolemia (diuretics, CHF, cirrhosis, nephrotic syndrome).\n\nIn states of reduced renal perfusion, the kidney relies on prostaglandin-mediated afferent dilation to maintain GFR. NSAIDs remove this compensatory mechanism, precipitating AKI. Patients typically develop prerenal azotemia within days of NSAID initiation. Treatment is discontinuation of the NSAID; dialysis is rarely needed."
    difficulty: medium
    tags: [nephrology, NSAIDs, AKI, vasomotor, prostaglandins, prerenal]
  - front: "What is analgesic chronic interstitial nephritis and what are its classic features?"
    back: "Chronic interstitial nephritis due to excessive consumption of antipyretics (phenacetin or acetaminophen) combined with NSAIDs. Features: papillary necrosis (gross hematuria, flank pain, declining renal function), calyceal filling defect on IVP ('ring sign'), increased risk of transitional cell carcinoma of the renal pelvis. Good prognosis if analgesics discontinued.\n\nPhenacetin is the classic analgesic associated with nephropathy and urothelial malignancy. The 'ring sign' on IVP represents a sloughed papilla still in its calyx. These patients often have emotional stress, psychiatric symptoms, and GI disturbance. The combination of an analgesic with an NSAID is more nephrotoxic than either alone."
    difficulty: medium
    tags: [nephrology, analgesic nephropathy, papillary necrosis, ring sign, transitional cell carcinoma, phenacetin]
  - front: "What are the metabolic effects of NSAIDs on the kidney beyond AKI?"
    back: "1. Sodium retention (secondary to reduced GFR). 2. Hyperkalemia and HTN (secondary to hyporeninemic hypoaldosteronism). 3. Excess water retention (loss of prostaglandin-mediated antagonism of ADH action).\n\nNSAIDs reduce renin secretion by inhibiting prostaglandins, causing hyporeninemic hypoaldosteronism and hyperkalemia. This is clinically important in patients already at risk for hyperkalemia (CKD, on ACEIs/ARBs, diabetic). NSAIDs also blunt the natriuretic and diuretic effects of loop diuretics."
    difficulty: medium
    tags: [nephrology, NSAIDs, hyperkalemia, sodium retention, hypoaldosteronism, ADH]
