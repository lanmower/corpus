# Gastroenterology (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is the most common cause of transient relaxation of the lower esophageal sphincter, and what is the most effective therapy for GERD?"
    back: "Increased transient relaxations of the LES are the most common cause of GERD. PPIs are the most effective therapy (symptom relief is 80% sensitive for reflux diagnosis).\n\nGERD diagnosis is usually clinical based on heartburn and regurgitation (80% sensitive and specific). An empiric 8-week PPI trial is first-line. Gastroscopy is indicated for red flags (bleeding, weight loss, dysphagia) or refractory symptoms."
    difficulty: easy
    tags: [gastroenterology, GERD, pharmacology]
  - front: "A 60-year-old male with long-standing GERD undergoes endoscopy showing salmon-pink mucosa in the distal esophagus. Biopsy shows intestinal metaplasia. What is the diagnosis, the rate of malignant transformation, and the recommended surveillance?"
    back: "Barrett's esophagus (BE). Malignant transformation rate is ~0.12%/year (prior to dysplasia). Surveillance: gastroscopy every 3-5 years if no dysplasia.\n\nBE is more common in males, age >50, White individuals, smokers, and those with long-standing GERD. High-grade dysplasia has a 32-59% transformation rate over 5-8 years. Treatment includes high-dose PPI indefinitely and endoscopic ablation for high-grade dysplasia."
    difficulty: medium
    tags: [gastroenterology, Barrett-esophagus, oncology, screening]
  - front: "What percentage of duodenal ulcers are caused by H. pylori, and what is the recommended first-line eradication regimen?"
    back: "90% of duodenal ulcers are caused by H. pylori. First-line: concomitant quadruple therapy - PPI BID + amoxicillin 1000 mg BID + clarithromycin 500 mg BID + metronidazole 500 mg BID for 14 days.\n\nAn alternative is bismuth quadruple therapy (PPI + bismuth subsalicylate + metronidazole + tetracycline). H. pylori is also responsible for 60% of gastric ulcers. NSAIDs account for the remaining major etiology."
    difficulty: medium
    tags: [gastroenterology, peptic-ulcer-disease, H-pylori, pharmacology]
  - front: "A 30-year-old woman presents with chronic diarrhea, iron deficiency anemia, and bloating. She has a family history of celiac disease. What is the initial screening test and the diagnostic gold standard?"
    back: "Initial screening: serum anti-tissue transglutaminase (anti-tTG) IgA antibody (90-98% sensitive, 94-97% specific) with concomitant serum IgA level. Gold standard: small bowel (duodenal) biopsy showing villous atrophy, crypt hyperplasia, and increased intraepithelial lymphocytes.\n\nSerum IgA must be measured simultaneously since IgA deficiency causes false-negative anti-tTG. Celiac disease is associated with HLA-DQ2 (90%) and HLA-DQ8. Treatment is a strict gluten-free diet. Refractory cases should prompt evaluation for lymphoma."
    difficulty: medium
    tags: [gastroenterology, celiac-disease, autoimmune, diagnosis]
  - front: "What are the key differences between Crohn's disease and ulcerative colitis in terms of distribution, depth of involvement, and common complications?"
    back: "Crohn's: any GI tract location (mouth to anus), skip lesions, transmural inflammation, fistulas/strictures/abscesses. UC: continuous from rectum proximally, limited to colon, mucosal/submucosal only, higher risk of colorectal cancer and toxic megacolon.\n\nUC has more liver complications (especially PSC) and greater colorectal cancer risk (5% at 10 years, 15% at 20 years for pancolitis). Crohn's uniquely causes fistulas due to transmural involvement. Colectomy is curative for UC but not for Crohn's."
    difficulty: medium
    tags: [gastroenterology, IBD, Crohn-disease, ulcerative-colitis]
  - front: "A patient with IBS asks about the diagnosis. What criteria are used and what are the four subtypes?"
    back: "Rome IV criteria: recurrent abdominal pain associated with defecation or change in stool frequency/form. Four subtypes: IBS-D (diarrhea predominant), IBS-C (constipation predominant), IBS-M (mixed), IBS-untyped.\n\nIBS is a disorder of gut-brain interaction with visceral hypersensitivity as the hallmark. Worldwide prevalence is 5-7%. Psychological factors (anxiety, depression, early life trauma) are risk factors. Diagnosis is primarily clinical with no specific diagnostic test."
    difficulty: easy
    tags: [gastroenterology, IBS, diagnosis]
  - front: "A patient presents with acute bloody diarrhea. Using the CHESS mnemonic, what organisms cause acute bloody diarrhea?"
    back: "CHESS: Campylobacter, Hemorrhagic E. coli (O157:H7), Entamoeba histolytica, Salmonella, Shigella.\n\nBloody diarrhea suggests inflammatory (mucosal damage) diarrhea. Antimotility agents like loperamide are contraindicated in bloody diarrhea due to risk of toxic megacolon. Enterohemorrhagic E. coli O157:H7 can cause HUS, and antibiotics may worsen outcomes."
    difficulty: easy
    tags: [gastroenterology, infectious-disease, diarrhea]
  - front: "What is the earliest laboratory finding in cirrhosis, and what is the sequence of subsequent abnormalities?"
    back: "Earliest: fall in platelet count <150 (from hypersplenism). Sequence: platelets fall first, then WBC decreases, then hemoglobin drops, then INR rises, then albumin falls, and finally bilirubin rises in severe disease.\n\nPancytopenia in cirrhosis results from portal hypertension causing hypersplenism. Thrombocytopenia is often the first clue. The Child-Pugh score (bilirubin, albumin, INR, ascites, encephalopathy) and MELD score quantify severity and guide transplant decisions."
    difficulty: medium
    tags: [gastroenterology, hepatology, cirrhosis, diagnosis]
  - front: "What is Gilbert's syndrome, how common is it, and how is it differentiated from more serious causes of jaundice?"
    back: "Gilbert's syndrome is a hereditary mild unconjugated hyperbilirubinemia due to deficiency of glucuronyl transferase. Affects 7% of population. Differentiation: isolated elevated unconjugated bilirubin that worsens with fasting/illness, normal liver enzymes, no other clinical implications.\n\nGilbert's is autosomal dominant, presents in teens-20s, and is entirely benign requiring only reassurance. It differs from Crigler-Najjar syndrome which has severe or complete deficiency of glucuronyltransferase and can be life-threatening."
    difficulty: easy
    tags: [gastroenterology, hepatology, jaundice, genetics]
  - front: "A 40-year-old man with ulcerative colitis presents with fatigue and pruritus. ALP is markedly elevated. MRCP shows beading of intrahepatic and extrahepatic bile ducts. What is the diagnosis and key associated risks?"
    back: "Primary sclerosing cholangitis (PSC). Key risks: cholangiocarcinoma (10-15%), 5-fold increased risk of colon cancer (vs. UC alone), secondary biliary cirrhosis from repeated cholangitis episodes.\n\nPSC is associated with UC in 70-80% of cases (usually males). Surveillance includes annual colonoscopy for CRC, MRCP at least annually for cholangiocarcinoma, and 6-monthly imaging for HCC if cirrhosis. Liver transplantation is the definitive treatment (>90% 1-year survival)."
    difficulty: hard
    tags: [gastroenterology, hepatology, PSC, IBD]
  - front: "A 45-year-old man presents with epigastric pain, and new-onset dyspepsia. He is H. pylori negative and does not take NSAIDs. Endoscopy shows no ulcer. What is the most likely diagnosis and management?"
    back: "Functional dyspepsia (negative endoscopy in setting of dyspeptic symptoms). Management: lifestyle modifications (decrease caffeine/alcohol, avoid citrus, smaller meals, smoking cessation), PPI or H2 blocker trial, consider TCAs or prokinetics (metoclopramide).\n\nFunctional dyspepsia is the most common cause of dyspepsia. Only 5% of patients with dyspepsia have ulcers. Red flags (VBAD: vomiting, bleeding/anemia, abdominal mass, dysphagia) warrant endoscopy. Patients <60 without red flags should be tested for H. pylori first."
    difficulty: medium
    tags: [gastroenterology, dyspepsia, family-medicine]
  - front: "What is autoimmune hepatitis, what are the characteristic serological findings, and what is the first-line treatment?"
    back: "Chronic inflammatory liver disease from loss of tolerance to liver antigens. Serological findings: hypergammaglobulinemia (elevated IgG), positive ANA and/or anti-smooth muscle antibody. Treatment: corticosteroids (80% respond) + azathioprine.\n\nAutoimmune hepatitis can be severe with 40% mortality at 6 months without treatment. Liver biopsy shows periportal (zone 1) interface hepatitis. It can overlap with PSC and PBC. Most patients relapse when corticosteroids are withdrawn without azathioprine."
    difficulty: medium
    tags: [gastroenterology, hepatology, autoimmune, pharmacology]
  - front: "What is the Child-Pugh classification system for cirrhosis, and what are the survival implications of each class?"
    back: "Child-Pugh uses 5 parameters (bilirubin, albumin, INR, ascites, encephalopathy), each scored 1-3. Class A (5-6 points): life expectancy 15-20 years, 0% perioperative mortality. Class B (7-9): transplant candidate, 30% perioperative mortality. Class C (10-15): ~3 months life expectancy, ~82% perioperative mortality.\n\nThe Child-Pugh score quantifies cirrhosis severity and guides management decisions including transplant evaluation. The MELD score (based on bilirubin, INR, creatinine) is preferred for transplant allocation as it more accurately predicts 3-month mortality."
    difficulty: medium
    tags: [gastroenterology, hepatology, cirrhosis, prognosis]
  - front: "What is the first-line treatment for H. pylori eradication?"
    back: "Bismuth quadruple therapy (PPI BID + bismuth subsalicylate QID + metronidazole QID + tetracycline 500 mg QID) x 7-14 days, OR concomitant non-bismuth quadruple therapy (PPI BID + clarithromycin 500 mg BID + amoxicillin 1000 mg BID + metronidazole 500 mg BID).\n\nFor dyspepsia in patients <60 without high-risk features, test for H. pylori first. Patients ≥60 should undergo upper endoscopy. PPIs should have at least 1 trial off medication per year."
    difficulty: medium
    tags: [gastroenterology, H. pylori, pharmacology]
  - front: "Why should antibiotics be avoided in E. coli O157:H7 (EHEC) infection?"
    back: "Antibiotics increase the risk of hemolytic uremic syndrome (HUS). Antidiarrheals also increase HUS risk.\n\nEHEC produces Shiga toxin, contamination from hamburger or raw milk. 10% of patients develop HUS. Renal function must be monitored. The incubation period is 3-8 days and illness lasts 5-10 days."
    difficulty: medium
    tags: [gastroenterology, infectious disease, HUS]
  - front: "What is the most common cause of traveller's diarrhea and what is the empiric treatment?"
    back: "ETEC (enterotoxigenic E. coli) is most common (80-90% are bacterial). Empiric treatment for moderate-severe illness: ciprofloxacin or azithromycin (preferred in SE Asia due to fluoroquinolone resistance).\n\nUp to 50% of travelers to developing countries are affected. Rehydration is the mainstay. Bismuth subsalicylate provides 60% prophylactic efficacy. Antibiotic prophylaxis is not recommended routinely."
    difficulty: easy
    tags: [gastroenterology, infectious disease, travel medicine]
  - front: "What serologic test is most sensitive and specific for celiac disease, and what is the gold standard?"
    back: "Anti-tTG IgA antibody (90-98% sensitive, 94-97% specific). Measure serum IgA simultaneously due to false negatives with IgA deficiency. Gold standard is small bowel mucosal biopsy showing villous atrophy.\n\nCeliac disease is associated with HLA-DQ2 (90%) and HLA-DQ8 (5%). Earliest biopsy finding is increased intraepithelial lymphocytes, followed by crypt hyperplasia, then villous atrophy. Gluten-free diet should not start before biopsy."
    difficulty: medium
    tags: [gastroenterology, celiac disease, autoimmune]
  - front: "How do you differentiate Crohn's disease from ulcerative colitis clinically?"
    back: "CD: any GI tract location ('gum to bum'), skip lesions, transmural inflammation, granulomas, fistulae/strictures, less rectal bleeding. UC: rectum always involved, continuous mucosal inflammation, very common rectal bleeding, no granulomas, toxic megacolon risk.\n\nCD commonly presents with RLQ pain (ileal disease) mimicking appendicitis. UC presents with bloody diarrhea as the hallmark. Smoking increases CD risk but is protective in UC. Both carry increased colon cancer risk."
    difficulty: medium
    tags: [gastroenterology, IBD, Crohns disease, ulcerative colitis]
  - front: "What are the extraintestinal manifestations of IBD?"
    back: "Dermatologic (erythema nodosum, pyoderma gangrenosum), rheumatologic (peripheral arthritis, ankylosing spondylitis, sacroiliitis), ocular (uveitis, episcleritis), hepatobiliary (PSC, cholelithiasis), urologic (oxalate stones), thromboembolism, osteoporosis.\n\nPSC is associated with UC in 70-80% of cases and increases colon cancer risk 5-fold. Cholelithiasis occurs in 15-35% of ileal CD. Erythema nodosum is more common in CD; PSC is more common with UC."
    difficulty: medium
    tags: [gastroenterology, IBD, extraintestinal manifestations]
  - front: "What are the Rome IV criteria for irritable bowel syndrome?"
    back: "Recurrent abdominal pain for >6 months, at least 1 day/week in last 3 months, associated with ≥2 of: (1) related to defecation, (2) change in stool frequency, (3) change in stool form.\n\nIBS subtypes are determined by Bristol Stool Chart: IBS-D (diarrhea), IBS-C (constipation), IBS-M (mixed). Investigations can be limited to CBC and celiac serology. Low FODMAP diet helps pain, bloating, and gas."
    difficulty: medium
    tags: [gastroenterology, IBS, diagnosis]
  - front: "What is the serum-ascites albumin gradient (SAAG) and how is it interpreted?"
    back: "SAAG = serum albumin - ascitic fluid albumin. SAAG ≥11 g/L indicates portal hypertension (cirrhosis, heart failure, Budd-Chiari). SAAG <11 g/L indicates non-portal HTN causes (peritoneal carcinomatosis, TB, pancreatic disease).\n\nAscitic fluid total protein >25 g/L suggests cardiac portal hypertension; <25 g/L suggests cirrhosis. Treatment of ascites includes Na restriction (<2g/day), diuretics (spironolactone + furosemide), and therapeutic paracentesis for refractory cases."
    difficulty: medium
    tags: [gastroenterology, hepatology, ascites]
  - front: "How is spontaneous bacterial peritonitis (SBP) diagnosed and treated?"
    back: "Diagnosis: absolute neutrophil count in ascitic fluid >250 cells/mm³. Treatment: IV cefotaxime 2g q8h or ceftriaxone 2g daily x 5 days, PLUS IV albumin (1.5 g/kg at diagnosis, 1 g/kg on day 3).\n\nSBP complicates 10% of cirrhotic ascites with higher risk during GI bleeds. One-third of patients are asymptomatic. E. coli is the most common pathogen. Long-term prophylaxis with norfloxacin or TMP-SMX after the first episode."
    difficulty: hard
    tags: [gastroenterology, hepatology, SBP, infectious disease]
  - front: "What is the hepatitis B serology pattern for chronic inactive (immune control) phase?"
    back: "HBsAg+, anti-HBs−, HBeAg−, anti-HBe+, anti-HBc IgG+, low HBV-DNA (<2000 IU/mL), normal ALT/AST.\n\nThe four phases of chronic HBV are: immune tolerance, immune clearance, chronic inactive (immune control), and HBeAg-negative chronic hepatitis. Risk of reactivation to phase 2 exists, especially with immunosuppression."
    difficulty: hard
    tags: [gastroenterology, hepatology, hepatitis B]
  - front: "What distinguishes the hepatitis B serology of resolved infection from immunization?"
    back: "Resolved infection: anti-HBs+, anti-HBe+, anti-HBc IgG+. Immunization: anti-HBs+ only (all other markers negative).\n\nAnti-HBc IgG is the key differentiator — it is present in resolved natural infection but absent after vaccination alone. Anti-HBc IgM indicates acute infection."
    difficulty: medium
    tags: [gastroenterology, hepatology, hepatitis B, serology]
  - front: "What is the treatment for chronic hepatitis C?"
    back: "Direct acting antiviral (DAA) tablets: Maviret (glecaprevir/pibrentasvir) or Epclusa (sofosbuvir/velpatasvir). Pan-genotypic, oral, interferon-free regimens. Check for hepatitis B before starting (risk of reactivation).\n\n70-80% of acute HCV becomes chronic; of these, 20% develop cirrhosis within 20 years. The major risk factor is injection drug use. HCV can cause cryoglobulinemia and membranoproliferative glomerulonephritis."
    difficulty: medium
    tags: [gastroenterology, hepatology, hepatitis C, pharmacology]
  - front: "What are the clinical features of Wilson's disease (ABCD mnemonic)?"
    back: "Asterixis; Basal ganglia degeneration (parkinsonian features in the young); Ceruloplasmin decreased, Corneal copper deposits (Kayser-Fleischer rings); Dementia.\n\nWilson's disease is autosomal recessive (ATP7B gene). Suspect if liver enzymes elevated with neuropsychiatric symptoms at age <40. Screening: low ceruloplasmin, Kayser-Fleischer rings, increased urinary copper. Treatment: penicillamine, trientine, zinc."
    difficulty: medium
    tags: [gastroenterology, hepatology, Wilsons disease]
  - front: "What is the clinical presentation of hereditary hemochromatosis (mnemonic)?"
    back: "Arthralgia, Bronze skin, Cardiomyopathy/Cirrhosis, Diabetes (pancreatic damage), hypogonadism (anterior pituitary damage). Also known as 'bronze diabetes.'\n\nHFE gene mutations (C282Y most common) cause decreased hepcidin and increased GI iron absorption. Screen with transferrin saturation >45% and ferritin >400 ng/mL. Treatment is phlebotomy. Normal life expectancy if treated before cirrhosis."
    difficulty: medium
    tags: [gastroenterology, hepatology, hemochromatosis]
  - front: "What is the earliest laboratory finding in cirrhosis?"
    back: "Fall in platelet count below 150,000 (from hypersplenism). Later: INR rises, albumin falls, bilirubin rises.\n\nThe progression follows the 'W' pattern of liver dysfunction tests. Compensated cirrhosis can last 10-20 years. Decompensation presents with ascites (most common), variceal bleeding, or encephalopathy."
    difficulty: medium
    tags: [gastroenterology, hepatology, cirrhosis]
  - front: "What is the Child-Pugh scoring system and what does each class predict?"
    back: "Based on bilirubin, albumin, INR, ascites, and encephalopathy (5 criteria, 1-3 points each). Class A (5-6): 15-50 yr survival, 0% perioperative mortality. Class B (7-9): transplant candidate, 30% mortality. Class C (10-15): 1-3 mo survival, 82% mortality.\n\nMELD score (based on creatinine, INR, bilirubin, sodium) is used for transplant prioritization. MELD >15 generally warrants transplant evaluation. Usual causes of death: renal failure (hepatorenal syndrome), sepsis, GI hemorrhage."
    difficulty: medium
    tags: [gastroenterology, hepatology, cirrhosis, prognosis]
  - front: "What are the precipitating factors for hepatic encephalopathy (HEPATICS)?"
    back: "Hemorrhage in GI tract/Hypokalemia, Excess dietary protein, Paracentesis, Alkalosis/Anemia, Trauma, Infection, Colon surgery, Sedatives.\n\nTreatment includes lactulose (titrated to 2-3 soft stools/day to lower colonic pH and convert NH3 to non-diffusible NH4+) and oral rifaximin. Protein restriction is no longer recommended given concurrent malnutrition risk."
    difficulty: medium
    tags: [gastroenterology, hepatology, hepatic encephalopathy]
  - front: "How do you differentiate primary sclerosing cholangitis (PSC) from primary biliary cholangitis (PBC)?"
    back: "PSC: male predominant, associated with IBD (especially UC), affects both intra/extrahepatic ducts, MRCP shows beading. PBC: female predominant (M:F=1:9), associated with other autoimmune diseases, affects intrahepatic ducts only, positive anti-mitochondrial antibodies.\n\nPSC increases risk of cholangiocarcinoma (10-15%) and colon cancer (5x in those with UC). PBC is treated with ursodeoxycholic acid. Both may progress to cirrhosis requiring liver transplant."
    difficulty: hard
    tags: [gastroenterology, hepatology, PSC, PBC]
  - front: "What is the etiology of acute pancreatitis using the mnemonic I GET SMASHED?"
    back: "Idiopathic, Gallstones (45%), Ethanol (35%), Tumours, Scorpion stings, Microbiological, Autoimmune, Surgery/trauma, Hyperlipidemia/Hypercalcemia/Hypothermia, Emboli/ischemia, Drugs.\n\nGallstones and alcohol account for 80% of cases. ALT >150 is specific for biliary cause. CT with IV contrast is most useful when done >1 day after presentation. Necrotic pancreas does not take up contrast dye."
    difficulty: easy
    tags: [gastroenterology, pancreatitis, etiology]
  - front: "What are Cullen's sign and Grey-Turner's sign?"
    back: "Cullen's sign: periumbilical ecchymosis (sensitive, not specific for acute pancreatitis). Grey-Turner's sign: flank ecchymosis (specific, not sensitive for acute pancreatitis).\n\nBoth signs indicate retroperitoneal hemorrhage. In pancreatitis, they suggest severe necrotizing disease. Inglefinger's sign (pain worse supine, better leaning forward) is also characteristic of pancreatitis."
    difficulty: easy
    tags: [gastroenterology, pancreatitis, physical exam]
  - front: "What are the Ranson criteria for acute pancreatitis prognosis?"
    back: "At admission: Age >55, WBC >16, Glucose >11 mmol/L, AST >250, LDH >350. During initial 48h: Hct drop >10%, BUN rise >1.8 mmol/L, Calcium <2 mmol/L, Base deficit >4, Fluid sequestration >6L. Score <3: 2% mortality; ≥3: severe pancreatitis.\n\nTreatment is supportive: hemodynamic stability, analgesia, oxygen. IV fluids with careful monitoring for third spacing. Antibiotics only for documented infection, not prophylaxis. Enteral nutrition is preferred over TPN."
    difficulty: hard
    tags: [gastroenterology, pancreatitis, prognosis]
  - front: "What is Gilbert's syndrome?"
    back: "Hereditary predominantly unconjugated hyperbilirubinemia due to deficiency of glucuronyl transferase. Affects 7% of population, especially males. Autosomal dominant (70% UGT gene mutation). Entirely benign, requires only reassurance.\n\nPresents in teens-20s with intermittent jaundice during fasting or acute illness. All other liver function is normal. Distinguished from Crigler-Najjar syndrome which involves severe or complete deficiency of glucuronyl transferase."
    difficulty: easy
    tags: [gastroenterology, hepatology, Gilberts syndrome]
  - front: "What is Charcot's triad and Reynolds' pentad in ascending cholangitis?"
    back: "Charcot's triad: fever, RUQ pain, jaundice (present in 50-70%). Reynolds' pentad adds: hypotension and altered mental status (suppurative cholangitis).\n\nCholangitis requires biliary drainage, ideally via ERCP. Common pathogens include E. coli, Klebsiella, Enterobacter, and Enterococcus. Reynolds' pentad carries approximately 50% mortality. Broad-spectrum antibiotics are required."
    difficulty: easy
    tags: [gastroenterology, surgery, cholangitis]
  - front: "What is the treatment for bleeding esophageal varices?"
    back: "1) Assess hemodynamic stability and resuscitate. 2) IV octreotide (splanchnic vasoconstriction). 3) Endoscopic variceal ligation (EVL) or sclerotherapy. 4) IV ceftriaxone (antibiotics reduce mortality). TIPS if refractory.\n\nVariceal bleeding has 30% risk in first year, 50-70% rebleeding rate, and 20% mortality at 6 weeks. Non-selective beta-blockers (propranolol, nadolol, carvedilol) reduce bleeding risk as prophylaxis. Restrictive transfusion strategy (Hb <70) is preferred."
    difficulty: hard
    tags: [gastroenterology, hepatology, varices, emergency]
  - front: "What are the complications of ileal resection in Crohn's disease based on length resected?"
    back: "<100 cm resected: watery diarrhea/cholorrhea (impaired bile salt absorption) — treat with cholestyramine. >100 cm resected: steatorrhea (reduced surface area, bile salt deficiency) — treat with fat restriction and medium-chain triglycerides.\n\nThis distinction is clinically important because cholestyramine (bile salt binder) would worsen steatorrhea in patients with >100 cm resection. At least 50% of CD patients have clinical recurrence within 5 years of surgery; 85% within 15 years."
    difficulty: hard
    tags: [gastroenterology, surgery, Crohns disease]
  - front: "What is the MASLD (formerly NAFLD) and its key treatment?"
    back: "Metabolic dysfunction-associated steatotic liver disease: hepatic steatosis with ≥1 cardiometabolic risk factor and no other cause. Key treatment: gradual weight loss (0.5-1 kg/week); ≥7-10% body weight loss improves disease; >10% loss may reverse steatohepatitis.\n\nMost common cause of liver disease in North America. Component of metabolic syndrome. AST/ALT ratio <1 (unlike alcoholic liver disease where AST:ALT >2:1). Main causes of death are cardiovascular disease and malignancy, not liver disease itself."
    difficulty: medium
    tags: [gastroenterology, hepatology, MASLD, NAFLD]
  - front: "What is the AST:ALT ratio significance in liver disease?"
    back: "ALT > AST = most causes of hepatitis. AST > ALT = alcoholic liver disease or other causes that have progressed to advanced cirrhosis. AST:ALT >2:1 is characteristic of alcoholic hepatitis.\n\nIn alcoholic hepatitis, both are usually <300. Associated findings include elevated MCV, elevated WBC (neutrophils), and elevated GGT. Maddrey's discriminant function >32 or MELD >21 indicates severe disease warranting corticosteroid consideration."
    difficulty: medium
    tags: [gastroenterology, hepatology, liver enzymes]
  - front: "What distinguishes hepatocellular from cholestatic liver enzyme patterns?"
    back: "Hepatocellular: elevated AST/ALT with normal or mildly elevated ALP. Cholestatic: elevated ALP/GGT with normal or mildly elevated AST/ALT. If ALP elevated alone, rule out bone disease by fractionating ALP or checking GGT.\n\nCholestatic pattern suggests bile duct obstruction (stones, cancer, PSC), destruction of microscopic ducts (PBC), bile acid transporter defects, or liver infiltration (metastases, granulomas). A predominant AST/ALT rise can occur acutely with sudden biliary obstruction."
    difficulty: medium
    tags: [gastroenterology, hepatology, liver enzymes, diagnosis]
  - front: "What is the Forrest classification for peptic ulcer bleeding and risk of rebleed?"
    back: "Ia: arterial bleeding (55-100% rebleed), Ib: oozing (55-100%), IIa: visible vessel (43%), IIb: sentinel clot (22%), IIc: hematin-covered flat spot (10%), III: no stigmata/clean base (5%).\n\nDual endoscopic therapy (epinephrine injection + thermal hemostasis or clips) is standard of care for high-risk lesions. IV PPI decreases rebleed risk. Restrictive transfusion (Hb <80 g/L without cardiovascular disease) is recommended."
    difficulty: hard
    tags: [gastroenterology, GI bleeding, peptic ulcer]
  - front: "What is the hallmark of chronic pancreatitis and its most common cause?"
    back: "Hallmark: abdominal pain. Most common cause: alcohol (>90% of chronic pancreatitis). Late features (when >90% function lost): steatorrhea, diabetes, calcification, weight loss.\n\nSerum amylase and lipase are usually normal in chronic pancreatitis. EUS is the most sensitive test. Fecal elastase is low in steatorrhea. Treatment includes EtOH abstinence, pancreatic enzyme replacement, analgesics, and surgical drainage if duct is dilated."
    difficulty: medium
    tags: [gastroenterology, pancreatitis, chronic]
  - front: "Which bacterial pathogen is the MOST COMMON cause of bacterial diarrhea in Canada?"
    back: "Campylobacter jejuni\n\nCampylobacter jejuni, transmitted primarily via uncooked poultry, is the most common bacterial cause of diarrhea in Canada. It is also associated with Guillain-Barré syndrome as a post-infectious complication. Treatment with macrolides or fluoroquinolones is indicated if diarrhea lasts >1 week, is bloody, or occurs in the immunocompromised."
    difficulty: easy
    tags: [infectious diarrhea, Campylobacter, gastroenterology, bacteria]
  - front: "A patient develops bloody diarrhea after eating undercooked hamburger. Antibiotics are withheld. Why?"
    back: "EHEC (E. coli O157:H7) is suspected; antibiotics increase the risk of hemolytic uremic syndrome (HUS). Antidiarrheal agents also increase HUS risk.\n\nEnterohemorrhagic E. coli (EHEC/STEC, O157:H7) produces Shiga toxin and is associated with HUS in ~10% of cases. Both antibiotics and antidiarrheal agents increase the risk of HUS. Management is supportive with monitoring of renal function."
    difficulty: medium
    tags: [EHEC, E. coli O157:H7, HUS, infectious diarrhea, gastroenterology]
  - front: "What is the recommended first-line empiric treatment for Clostridium difficile infection? What is used for fulminant (previously termed 'severe') infection?"
    back: "Empiric treatment: vancomycin (oral) OR fidaxomicin. For fulminant C. difficile infection: oral vancomycin; add IV metronidazole if ileus is present. Metronidazole may be used if access to empiric treatment is limited.\n\nC. difficile colitis typically follows antibiotic use (especially clindamycin, fluoroquinolones, penicillins, cephalosporins) or recent hospitalization. The culprit antibiotic should be stopped if possible. For fulminant disease, oral vancomycin is the drug of choice, with IV metronidazole added if ileus prevents drug reaching the colon."
    difficulty: medium
    tags: [C. difficile, pseudomembranous colitis, antibiotics, gastroenterology]
  - front: "What is the pathophysiology of Bacillus cereus Type A (emetic) vs. Type B (diarrheal) food poisoning?"
    back: "Type A (emetic): preformed exotoxin in rice dishes; onset 1–6h, nausea/vomiting, <12h duration. Type B (diarrheal): secondary endotoxin from meats/vegetables/cereals; onset 8–16h, diarrhea, <24h duration. Neither requires antimicrobial therapy.\n\nB. cereus produces two distinct toxin syndromes. The emetic form (preformed heat-stable toxin) has a very short incubation, while the diarrheal form (enterotoxin produced in vivo) has a longer onset. Both are self-limited and require only supportive care."
    difficulty: medium
    tags: [Bacillus cereus, food poisoning, infectious diarrhea, gastroenterology]
  - front: "Which organism causes 'traveller's diarrhea' most commonly, and what is the empiric antibiotic regimen?"
    back: "ETEC (Enterotoxigenic E. coli) is the most common cause of traveller's diarrhea. Empiric antibiotics for moderate-to-severe disease: ciprofloxacin, azithromycin, or rifaximin. Note increasing fluoroquinolone resistance, especially in South/Southeast Asia.\n\nBacterial pathogens cause 80–90% of traveller's diarrhea, with ETEC being the leading cause. ETEC produces heat-labile and heat-stable toxins. Rehydration is the mainstay of therapy. Antibiotic prophylaxis is NOT recommended due to risk of resistant organism infection."
    difficulty: easy
    tags: [travellers diarrhea, ETEC, infectious diarrhea, gastroenterology]
  - front: "A child presents with RLQ pain, fever, and diarrhea mimicking appendicitis. Stool cultures are pending. What pathogen should be considered?"
    back: "Yersinia enterocolitica. It can cause mesenteric adenitis and terminal ileitis that mimic appendicitis, and can also mimic Crohn's disease of the terminal ileum. Most cases occur in children <4 years old.\n\nYersinia can present without diarrhea as isolated mesenteric adenitis or terminal ileitis, closely mimicking acute appendicitis. It is transmitted via contaminated food and unpasteurized milk. Fluoroquinolones are used only for severe illness."
    difficulty: medium
    tags: [Yersinia, infectious diarrhea, appendicitis mimics, gastroenterology]
  - front: "What are the risk factors for Giardia lamblia infection ('beaver fever')? How is it treated?"
    back: "Risk factors: daycare children, intake of untreated water, MSM (men who have sex with men), immunodeficiency (decreased IgA). Treatment: metronidazole or nitazoxanide. Treatment of asymptomatic carriers is NOT recommended. May require duodenal biopsy for diagnosis.\n\nGiardia is a protozoan that causes fecal-oral diarrhea with a 1–4 week incubation. It causes abdominal pain and nausea/vomiting but not fever or bloody stool. IgA deficiency increases susceptibility, which is also relevant because IgA deficiency is more prevalent in celiac disease patients."
    difficulty: medium
    tags: [Giardia, parasites, infectious diarrhea, gastroenterology]
  - front: "What is the treatment of Entamoeba histolytica infection? What complication can occur if untreated?"
    back: "Symptomatic infection: metronidazole + iodoquinol OR paromomycin. Asymptomatic cyst passage: iodoquinol or paromomycin alone. If untreated: potential for liver abscess. Sigmoidoscopy may show flat ulcers with yellow exudates.\n\nE. histolytica is a worldwide parasite transmitted fecal-orally, causing bloody diarrhea with fever and abdominal pain. The key complication is amebic liver abscess. Treatment requires both a luminal agent (iodoquinol/paromomycin) and a tissue agent (metronidazole) for symptomatic disease."
    difficulty: medium
    tags: [Entamoeba histolytica, amoebiasis, liver abscess, parasites, gastroenterology]
  - front: "What is the Dukoral® vaccine? What does it protect against and when is it recommended by the Public Health Agency of Canada?"
    back: "Oral vaccine protecting against Vibrio cholerae (~80% efficacy) and ETEC (~50–67% efficacy). Requires 2 doses taken 2 weeks prior to travel; effect lasts up to 3 months. Recommended (not routine) for: gastric hypochlorhydria, young children >2yr, high-risk travellers with chronic illness (chronic renal failure, CHF, T1DM, IBD), immunosuppression, history of recurrent traveller's diarrhea, and travellers to cholera-endemic countries.\n\nDukoral is an oral killed whole-cell V. cholerae vaccine with recombinant cholera toxin B subunit. It provides cross-protection against ETEC due to shared B subunit homology. Antibiotic prophylaxis for traveller's diarrhea is not recommended."
    difficulty: medium
    tags: [Dukoral, travellers diarrhea, vaccine, cholera, gastroenterology]
  - front: "Define chronic diarrhea. What investigations are recommended?"
    back: "Passage of frequent unformed stool for >4 weeks (persistent diarrhea lasts 14–30 days). Investigations: stool (C. difficile toxin, C&S, O&P, fecal fat, WBC, fecal calprotectin); blood (CBC, electrolytes, CRP, TSH, celiac serology: IgA anti-tTG + serum immunoglobulin quantitation); colonoscopy/ileoscopy with biopsy; upper GI endoscopy with duodenal biopsy.\n\nMajority of chronic diarrhea is non-infectious. Celiac serology (anti-tTG IgA) should be paired with serum IgA quantitation to detect IgA deficiency, which can cause false-negative tTG results. A trial of lactose-free diet should be used with caution as it may delay diagnosis of IBD or celiac disease."
    difficulty: easy
    tags: [chronic diarrhea, gastroenterology, investigations]
  - front: "Distinguish maldigestion from malabsorption."
    back: "Maldigestion: inability to break down large molecules in the intestinal lumen into component small molecules (e.g., pancreatic exocrine deficiency, bile salt deficiency, enzyme deficiencies). Malabsorption: inability to transport molecules across the intestinal mucosa into circulation (e.g., celiac disease, Giardia, Whipple's disease, small bowel resection).\n\nMaldigestion occurs in the intestinal lumen, while malabsorption occurs at the mucosal level. Common causes of maldigestion include cystic fibrosis (pancreatic exocrine insufficiency), pancreatitis, and bile salt deficiency from terminal ileal disease. Both lead to similar clinical manifestations including steatorrhea and nutritional deficiencies."
    difficulty: easy
    tags: [malabsorption, maldigestion, gastroenterology]
  - front: "Where in the GI tract are iron, calcium, folic acid, and vitamin B12 absorbed?"
    back: "Iron: duodenum and upper jejunum. Calcium: duodenum and upper jejunum. Folic acid: jejunum. Vitamin B12: ileum (after complex formation with intrinsic factor from stomach; pancreatic proteases cleave R-protein in basic medium to allow B12-IF complex formation).\n\nProximal small bowel absorbs iron, calcium, and folate. This means celiac disease (predominantly proximal) causes iron, calcium, and folate deficiency more commonly than B12 deficiency. B12 absorption requires intrinsic factor (from parietal cells), gastric acid, and a functional terminal ileum."
    difficulty: easy
    tags: [nutrient absorption, malabsorption, vitamin B12, gastroenterology]
  - front: "What are the clinical manifestations of fat-soluble vitamin deficiencies (ADEK)?"
    back: "Vitamin A: night blindness, dry skin, keratomalacia. Vitamin D: osteomalacia (adults), rickets (children). Vitamin E: retinopathy, neurological problems. Vitamin K: prolonged INR causing bleeding (risk increased after prolonged broad-spectrum antibiotics or starvation).\n\nFat-soluble vitamins (ADEK) require adequate fat digestion and absorption via micelles. Steatorrhea from any cause can lead to fat-soluble vitamin deficiencies. Vitamin K is also synthesized by intestinal flora, making prolonged antibiotic use a risk factor for deficiency."
    difficulty: easy
    tags: [fat soluble vitamins, malabsorption, vitamin deficiency, gastroenterology]
  - front: "What is the gold standard investigation for steatorrhea, and what are the initial screening tests?"
    back: "Gold standard: 72-hour stool collection (weight and fat content). Initial qualitative screening: Sudan stain of stool for fat globules. Other useful tests: fecal elastase (screens for pancreatic insufficiency), serum tTG-IgA + abdominal imaging (most useful—celiac disease and chronic pancreatitis are the two most common causes of steatorrhea).\n\nSteatorrhea (excessive fat in stool) is caused by fat maldigestion or malabsorption. Quantitative fecal fat >7% is diagnostic. The two most common causes are celiac disease and chronic pancreatitis, so anti-tTG IgA serology and imaging of the pancreas are first-line investigations."
    difficulty: medium
    tags: [steatorrhea, malabsorption, gastroenterology, investigations]
  - front: "What are the consequences of ileal resection <100 cm vs. >100 cm?"
    back: "<100 cm resected: impaired bile salt absorption → watery diarrhea (cholorrhea/choleretic diarrhea). Treatment: cholestyramine or loperamide. >100 cm resected: reduced mucosal surface + bile salt deficiency → steatorrhea/fatty diarrhea. Treatment: fat restriction, medium chain triglycerides.\n\nThe pivotal number is 100 cm of terminal ileum. With smaller resections, the remaining bile salts enter the colon and cause secretory diarrhea. With larger resections, bile salt pool is depleted and fat cannot be absorbed, causing steatorrhea. Cholestyramine is a bile-salt binding resin used for the smaller resection scenario."
    difficulty: medium
    tags: [ileal resection, short bowel syndrome, malabsorption, gastroenterology]
  - front: "What is the pathogenesis of celiac disease? What are the HLA associations?"
    back: "Autoimmune disease triggered by gluten (specifically gliadin, the toxic protein). HLA-DQ2 (chromosome 6): found in ~90% of celiac patients vs. 20% of general population. HLA-DQ8: found in ~5% of celiac patients. HLA-DQ2/8 are necessary permissive genes but not sufficient—up to 40% of White individuals carry these alleles without developing celiac disease. The auto-antigen is tissue transglutaminase (tTG).\n\nCeliac disease is unique in that the genetics (HLA-DQ2/8), the auto-antigen (tTG), and the environmental trigger (gluten from wheat, barley, rye) are all known. It is associated with other autoimmune diseases including Sjögren's syndrome, T1DM, and thyroid disease."
    difficulty: medium
    tags: [celiac disease, HLA, autoimmune, gastroenterology, malabsorption]
  - front: "What is the correct sequence of pathological changes in celiac disease, from earliest to latest?"
    back: "1. Increased intraepithelial lymphocytes (earliest finding) → 2. Crypt hyperplasia → 3. Villous atrophy (last stage). Diagnosis requires small bowel mucosal biopsy (usually duodenum).\n\nVillous atrophy is the hallmark histologic finding but is the LAST stage to develop. The differential diagnosis for villous atrophy is broad and includes small bowel overgrowth, Crohn's disease, lymphoma, Giardia, and HIV. Biopsy should not be deferred for a trial of gluten-free diet, as this could normalize histology and falsely exclude celiac disease."
    difficulty: medium
    tags: [celiac disease, histology, villous atrophy, gastroenterology]
  - front: "How is celiac disease diagnosed serologically? What is the important caveat regarding IgA deficiency?"
    back: "Serum anti-tTG IgA: 90–98% sensitive, 94–97% specific. CAVEAT: Selective IgA deficiency (more prevalent in celiac patients) causes false-negative anti-tTG IgA. Therefore, serum immunoglobulin quantitation (IgA level) must be measured simultaneously. If IgA deficient, use tTG IgG and/or DGP (deamidated gliadin peptide) IgG.\n\nIgA deficiency is more frequent in individuals with celiac disease than in the general population. Measuring only anti-tTG IgA without checking total IgA can miss celiac disease in IgA-deficient patients. A gluten-free diet should not be started before serological tests and biopsy are completed."
    difficulty: hard
    tags: [celiac disease, anti-tTG, IgA deficiency, serology, gastroenterology]
  - front: "What extraintestinal manifestations are associated with celiac disease?"
    back: "Dermatitis herpetiformis, bone fractures/metabolic bone disease (osteoporosis), infertility, epilepsy, myopathy, depression, paranoia, and cerebellar ataxia. Also increased risk of lymphoma (enteropathy-associated T-cell lymphoma), adenocarcinoma (small bowel, colon), and autoimmune diseases.\n\nCeliac disease has numerous extraintestinal manifestations. Dermatitis herpetiformis is the classic skin finding. The risk of lymphoma may be reduced by strict adherence to a gluten-free diet. Poor response to gluten-free diet should prompt investigation for non-adherence, concurrent diseases (microscopic colitis, pancreatic insufficiency), or development of T-cell lymphoma."
    difficulty: medium
    tags: [celiac disease, extraintestinal manifestations, lymphoma, gastroenterology]
  - front: "What is the dietary treatment for celiac disease? Which grains are permitted and which must be avoided?"
    back: "Avoid: wheat, barley, rye (and by default any grain with gliadin-like toxic proteins). Permitted: rice flour, corn flour. Oats: allowed ONLY if certified gluten-free (grown without cross-contamination). Also supplement: iron, folate, and other vitamins as needed.\n\nGluten-free diet is the cornerstone of treatment for celiac disease. Inadvertent or advertent non-adherence is the most common cause of poor response to treatment. Oats contain avenin, a protein that is immunologically distinct from gliadin; certified gluten-free oats may be acceptable in a subgroup of patients."
    difficulty: easy
    tags: [celiac disease, gluten-free diet, treatment, gastroenterology]
  - front: "What gene mutation is associated with Crohn's disease, especially in Ashkenazi Jews? What does its gene product do?"
    back: "CARD15/NOD2 gene mutation. The CARD15 gene product modulates NF-κB, which is required for the innate immune response to microbial pathogens (primarily expressed in monocytes-macrophages). Heterozygous mutation: relative risk 3; Homozygous: relative risk 40. Associated with ileal involvement, fistulizing, fibrostenotic, and stricturing disease.\n\nCARD15/NOD2 is the most important genetic locus in Crohn's disease. It is associated particularly with ileal CD, early onset, and fibrostenotic/fistulizing disease phenotypes. IBD has a polygenomic pattern with over 200 associated gene loci."
    difficulty: hard
    tags: [Crohns disease, NOD2, CARD15, genetics, IBD, gastroenterology]
  - front: "Compare the GI location, rectal bleeding, diarrhea type, and histology of Crohn's disease (CD) vs. Ulcerative Colitis (UC)."
    back: "CD: Any part of GI tract ('gum to bum'); small bowel + colon 50%, small bowel only 30%, colon only 20%; rectal bleeding uncommon; transmural distribution with skip lesions, non-caseating granulomas, deep fissures, glands intact. UC: Isolated to large bowel; ALWAYS involves rectum; rectal bleeding very common (90%); mucosal distribution, continuous disease (no skip lesions), crypt abscesses, granulomas absent.\n\nThe key differentiating histologic features are: CD = transmural + skip lesions + granulomas; UC = mucosal only + continuous + no granulomas. Endoscopically, CD shows cobblestoning and segmental inflammation while UC shows continuous diffuse erythema and friability."
    difficulty: medium
    tags: [Crohns disease, ulcerative colitis, IBD, comparison, gastroenterology]
  - front: "What are the most common and most serious surgical complications unique to Crohn's disease vs. Ulcerative Colitis?"
    back: "Crohn's disease: strictures, fistulae (entero-cutaneous, entero-vesical, entero-vaginal, entero-enteric), perianal disease, abscesses, perforation. Ulcerative Colitis: toxic megacolon (transverse colon >6 cm on abdominal X-ray), greater risk of colorectal cancer (8-fold relative risk overall; 5% at 10 yr, 15% at 20 yr for pancolitis).\n\nFistulae are characteristic of CD due to transmural inflammation with deep fissuring. UC has greater colorectal cancer risk; pancolitis >8 years warrants surveillance colonoscopy with biopsy and/or chromoendoscopy. Patients with UC + PSC have 5-fold increased colon cancer risk and need annual surveillance."
    difficulty: medium
    tags: [Crohns disease, ulcerative colitis, IBD, complications, gastroenterology]
  - front: "What are the extraintestinal manifestations (EIMs) of IBD? Which are more common in CD vs. UC?"
    back: "Dermatologic: erythema nodosum (CD > UC), pyoderma gangrenosum (CD > UC), perianal skin tags (CD >> UC), oral mucosal lesions (CD >> UC). Rheumatologic: peripheral arthritis (CD > UC), ankylosing spondylitis (CD > UC), sacroiliitis (equal). Ocular: uveitis and episcleritis (CD > UC). Hepatobiliary: PSC (1–5% IBD, more common UC in men), cholelithiasis (15–35% of ileal CD). Urologic: oxalate stones (CD with ileal disease and intact colon), uric acid stones (ileostomy).\n\nMost EIMs are more common in CD, particularly those related to perianal and colonic involvement. PSC is more associated with UC and is a significant risk factor for colorectal cancer (5-fold increase). Oxalate stones in CD occur because ileal disease leads to unabsorbed fat binding calcium, leaving oxalate free for intestinal absorption."
    difficulty: hard
    tags: [IBD, extraintestinal manifestations, Crohns disease, ulcerative colitis, gastroenterology]
  - front: "What is the epidemiology of Crohn's disease in Canada?"
    back: "135,000 Canadians living with CD. Worldwide incidence 3–15 to 10–20 per 100,000. Bimodal age of onset: primary peak before age 30, second smaller peak at age 60. M = F. Incidence increasing, especially in young females. More common in White people and Ashkenazi Jews. Smoking incidence in CD patients is higher than general population.\n\nCanada has one of the highest rates of IBD in the world. Unlike UC, smoking is a risk factor for CD (whereas smoking is protective in UC). The increasing incidence, especially in young females and in Asian immigrants adopting Western lifestyles, suggests environmental factors."
    difficulty: easy
    tags: [Crohns disease, epidemiology, Canada, IBD, gastroenterology]
  - front: "What are the medical management options for Crohn's disease in order from mild to severe (traditional step-up approach)?"
    back: "1. Lifestyle/diet + antidiarrheal agents. 2. 5-ASA (sulfasalazine, mesalamine) — limited role, for mild ileitis only. 3. Antibiotics (metronidazole, ciprofloxacin) — particularly for perianal CD. 4. Corticosteroids (prednisone 40 mg/d; budesonide 9 mg/d for mild-moderate ileal/right colon CD). 5. Immunosuppressives (azathioprine, 6-MP, MTX) — steroid-sparing, maintain remission. 6. Biologics (anti-TNF: infliximab, adalimumab; ustekinumab; risankizumab; vedolizumab). 7. JAK inhibitors (tofacitinib). NOTE: Top-down management (early biologics + immunosuppressives) now widely accepted as best practice.\n\nThe CALM trial (Lancet 2017) demonstrated that tight control using biomarkers (CRP, fecal calprotectin) to guide treatment intensification led to better mucosal healing compared to clinical evaluation alone. Dual therapy (infliximab + azathioprine) is more effective than monotherapy. Corticosteroids have NO role in maintaining remission."
    difficulty: hard
    tags: [Crohns disease, management, biologics, IBD, gastroenterology]
  - front: "What is the mechanism of action of vedolizumab? For which IBD conditions is it indicated?"
    back: "Vedolizumab is a monoclonal antibody against integrin α4β7, reducing lymphocyte trafficking to the gut. It is indicated for ulcerative colitis and Crohn's disease (now primarily indicated for UC).\n\nVedolizumab has gut-selective anti-inflammatory action. Unlike systemic anti-TNF agents, it does not cause systemic immunosuppression. It is used for moderate-to-severe UC and CD that is steroid-unresponsive or steroid-dependent, or has failed other biologic agents."
    difficulty: hard
    tags: [vedolizumab, biologics, IBD, UC, Crohns disease, gastroenterology]
  - front: "What are the indications for surgery in Ulcerative Colitis, and what curative procedure is performed?"
    back: "Indications: failure of adequate medical therapy, toxic megacolon, uncontrollable bleeding, pre-cancerous changes (dysplasia on endoscopy/biopsy), inability to taper corticosteroids, overt malignancy. Curative procedure: colectomy with ileal pouch-anal anastomosis (IPAA — restorative). Permanent ileostomy eliminates risk of cancer recurrence post-colectomy.\n\nUC can be cured by colectomy, unlike CD where surgery treats complications but cannot cure the disease. IPAA (J-pouch) allows bowel continuity without a permanent stoma. After permanent ileostomy, there is no residual colorectal cancer risk. The colectomy rate is ~1% per year after the first year; 20–25% eventually undergo colectomy."
    difficulty: medium
    tags: [ulcerative colitis, surgery, IPAA, colectomy, IBD, gastroenterology]
  - front: "What is the risk of colorectal cancer in Ulcerative Colitis? What surveillance is recommended?"
    back: "Risk: 5% at 10 years, 15% at 20 years for pancolitis; overall relative risk = 8-fold. Risk is higher with: longer duration, greater extent (pancolitis > left-sided > proctitis), active mucosal inflammation, concurrent PSC (5-fold additional risk). Surveillance: surveillance colonoscopy with biopsy and/or chromoendoscopy for pancolitis >8 years; annual surveillance for UC + PSC. Proctitis alone has the SAME risk as general population.\n\n5-ASA derivatives may have chemopreventive effects against colorectal cancer in UC. Patients with both UC and PSC have the highest risk and require annual colonoscopy. Fecal calprotectin is a useful stool surrogate marker for monitoring mucosal inflammation activity."
    difficulty: hard
    tags: [ulcerative colitis, colorectal cancer, surveillance, IBD, gastroenterology]
  - front: "What is the epidemiology and smoking relationship in Ulcerative Colitis?"
    back: "120,000 Canadians live with UC. Worldwide incidence 3–15 to 10–20 per 100,000. Two-thirds onset by age 30 (second peak after age 50). M = F. Small hereditary contribution (15% have 1st-degree relative with disease). REDUCED risk in smokers (protective effect — opposite to CD).\n\nThe inverse relationship between smoking and UC (and the positive relationship with CD) is well-established. Smoking appears to have protective effects on colonic mucus and immune regulation in UC. In contrast, smoking worsens CD. This distinction is tested on the MCCQE1."
    difficulty: easy
    tags: [ulcerative colitis, epidemiology, smoking, IBD, gastroenterology]
  - front: "What is toxic megacolon? What are its radiologic criteria and which IBD condition is it most associated with?"
    back: "Toxic megacolon: acute non-obstructive dilation of the colon with systemic toxicity and immediate risk of perforation. Radiologic criteria: transverse colon diameter >6 cm on abdominal X-ray. Most associated with Ulcerative Colitis. Also associated with Shigella and C. difficile. Antidiarrheal medications should be avoided in severe colitis to prevent precipitation.\n\nToxic megacolon is a life-threatening complication requiring urgent surgical consultation. It can complicate UC (more common), C. difficile colitis, and Shigella infection. The radiologic cutoff is >6 cm diameter of the transverse colon. Antidiarrheal agents (e.g., loperamide) and anticholinergics can precipitate it."
    difficulty: medium
    tags: [toxic megacolon, ulcerative colitis, IBD, gastroenterology, complications]
  - front: "What defines Irritable Bowel Syndrome (IBS) and what are its subtypes?"
    back: "IBS is a disorder of gut-brain interaction characterized by abdominal pain and alteration in bowel habit. Diagnosis uses Rome IV Criteria. Subtypes (based on Bristol Stool Chart): IBS-D (predominant diarrhea), IBS-C (predominant constipation), IBS-M (mixed: both diarrhea and constipation each >25% of abnormal bowel movements), IBS-Untyped (insufficient abnormalities for C, D, or M).\n\nIBS affects 5–7% of the population worldwide, with onset usually in young adulthood. It is a clinical diagnosis with no specific diagnostic test. Pathophysiology involves visceral hypersensitivity (hallmark), altered central processing, immune cell dysfunction, changes in intestinal permeability, altered serotonin signaling, and gut microbiome changes."
    difficulty: easy
    tags: [IBS, irritable bowel syndrome, Rome IV, gastroenterology]
  - front: "What is the pathophysiology of IBS? What psychosocial factors are associated?"
    back: "IBS is a disorder of the gut-brain axis. Hallmark: visceral hypersensitivity. Mechanisms: altered central processing of pain signals, immune cell dysfunction, increased intestinal permeability, altered gut serotonin signaling, altered gut microbiome, and altered GI motility (in a subset). Psychosocial risk factors: early life trauma/adversity, anxiety/depression, chronic stressors.\n\nIBS is multifactorial and varies between patients. Unlike IBD, there is no gross or histologic mucosal inflammation. The biopsychosocial model is important—psychological factors contribute to severity. Post-infectious IBS can develop after acute gastroenteritis."
    difficulty: medium
    tags: [IBS, gut-brain axis, visceral hypersensitivity, gastroenterology]
  - front: "What is the role of tofacitinib and upadacitinib in IBD treatment?"
    back: "Tofacitinib: non-selective JAK (Janus Kinase) inhibitor; demonstrated efficacy in UC. Upadacitinib: gut-selective JAK inhibitor; used for outpatients with moderate-to-severe UC. Both used for patients with failure of other biologic agents, steroid-unresponsive or steroid-dependent disease.\n\nJAK inhibitors are small molecule immunotherapy options. They are orally administered, unlike biologics (infliximab, adalimumab) which require IV or SC administration. Tofacitinib is also experimentally being studied for CD."
    difficulty: hard
    tags: [tofacitinib, upadacitinib, JAK inhibitors, UC, IBD, gastroenterology]
  - front: "What is ozanimod and for which condition is it used?"
    back: "Ozanimod is an oral sphingosine-1-phosphate (S1P) receptor modulator used for treating moderate-to-severe Ulcerative Colitis. It does NOT require previous failure of immunosuppressants, glucocorticoids, biologics, or other small molecules. It increases clinical remission rates compared to placebo.\n\nOzanimod is a newer oral small molecule for UC. S1P receptor modulators work by trapping lymphocytes in lymph nodes, reducing gut inflammation. Its key feature is that it can be used without requiring prior step-up therapy failure."
    difficulty: hard
    tags: [ozanimod, sphingosine-1-phosphate, UC, IBD, gastroenterology]
  - front: "What are the side effects of azathioprine/6-mercaptopurine (6-MP) in IBD treatment?"
    back: "Vomiting, pancreatitis, bone marrow suppression, increased risk of malignancy (e.g., lymphoma). Takes >3 months for beneficial effect; usually continued for several years. Acts as a steroid-sparing agent; used to maintain remission rather than treat active inflammation. Used in combination with biologics (dual therapy) to increase efficacy and lower risk of tolerance/anti-drug antibody development.\n\nAzathioprine/6-MP are thiopurine immunosuppressants metabolized by TPMT (thiopurine methyltransferase). Testing TPMT activity before initiation can identify patients at risk for severe bone marrow suppression. Combining with anti-TNF therapy reduces immunogenicity and increases sustained drug efficacy."
    difficulty: medium
    tags: [azathioprine, 6-MP, immunosuppressives, IBD, gastroenterology, side effects]
  - front: "Primary sclerosing cholangitis (PSC) in IBD: what is the association, and what is its impact on colorectal cancer risk?"
    back: "PSC occurs in 1–5% of IBD cases with colonic involvement and is more common in men with UC. Patients with UC AND PSC have a 5-fold increased risk of colorectal cancer compared to UC alone. Annual surveillance colonoscopy with biopsy and/or chromoendoscopy is required in this high-risk group.\n\nPSC is a cholestatic liver disease that is strongly associated with UC. The mechanism linking PSC to increased colorectal cancer risk in UC is not fully elucidated but likely involves biliary acids and altered gut microbiome. Gallstones (pigment stones) are also associated with CD."
    difficulty: hard
    tags: [PSC, primary sclerosing cholangitis, IBD, colorectal cancer, UC, gastroenterology]
  - front: "What is the mechanism and indication for budesonide in IBD? Why is it preferred over prednisone in certain situations?"
    back: "Budesonide is a first-pass metabolism corticosteroid (minimal systemic effects). Used at 9 mg/day for mild-to-moderate acute exacerbations of terminal ileum + right colon CD. In UC: oral budesonide CR (colonic extended release) can be used for mild-to-moderate disease. Preferred over prednisone because it has fewer systemic side effects due to high first-pass hepatic metabolism (~90% extraction).\n\nBudesonide's topical anti-inflammatory effect is concentrated in the ileum and right colon (CD formulation) or colon (UC formulation). It does not have a proven role in maintaining remission (similar to prednisone). For severe/fulminant IBD, IV methylprednisolone is preferred."
    difficulty: medium
    tags: [budesonide, corticosteroids, Crohns disease, IBD, gastroenterology]
  - front: "What is Vibrio cholerae infection? Describe its clinical features and treatment."
    back: "V. cholerae from contaminated food/water (especially shellfish). Incubation 1–3 days. Massive watery diarrhea (1–3 L/day). No fever, blood, or abdominal pain. Duration 3–7 days. Treatment: tetracycline or fluoroquinolones (ciprofloxacin). Mortality <1% with treatment. Vaccine (Dukoral) ~80% efficacy.\n\nCholera produces an enterotoxin that activates adenylyl cyclase, causing massive secretory diarrhea ('rice-water stools'). Rehydration is critical. Antibiotics shorten the disease course and duration of shedding. Dukoral vaccine is recommended for travellers to endemic areas at increased risk."
    difficulty: medium
    tags: [Vibrio cholerae, cholera, infectious diarrhea, gastroenterology]
  - front: "What are the stool characteristics and treatment of Cryptosporidium infection? In whom is it most severe?"
    back: "Cryptosporidium: fecal-oral transmission, 1-day incubation, watery diarrhea (no blood), fever, nausea/vomiting. Duration 1–20 days. Treatment: paromomycin + nitazoxanide. In immunosuppressed patients (e.g., HIV): immune reconstitution is key in addition to pharmacological treatment.\n\nCryptosporidium is an important cause of diarrhea in immunocompromised individuals, particularly those with HIV/AIDS. Unlike other parasites, it can cause severe, prolonged, life-threatening diarrhea in immunosuppressed patients. In immunocompetent individuals, it is typically self-limited."
    difficulty: medium
    tags: [Cryptosporidium, parasites, infectious diarrhea, immunocompromised, gastroenterology]
  - front: "A patient with Shigella dysentery asks for loperamide (Imodium) for symptom relief. Should it be prescribed?"
    back: "No. Antidiarrheal agents (e.g., loperamide) may increase the risk of toxic megacolon in Shigella dysentery and should be avoided. Treatment is with a fluoroquinolone. Only very small inocula are needed for Shigella infection (low infectious dose).\n\nShigella causes dysentery (bloody diarrhea with fever and tenesmus) with a 1–4 day incubation. Antidiarrheal agents are contraindicated because they delay pathogen clearance and increase the risk of toxic megacolon — same principle applies in severe UC. Complications include toxic megacolon and HUS."
    difficulty: medium
    tags: [Shigella, infectious diarrhea, antidiarrheal agents, gastroenterology]
  - front: "What is the CALM trial (Lancet 2017) and what were its conclusions for Crohn's disease management?"
    back: "CALM was a multicenter RCT (224 patients, 22 countries). Patients with active CD were randomized to intensify treatment based on laboratory biomarkers (CRP + fecal calprotectin) vs. clinical evaluation alone (CD activity index + prednisone use). At 2 years, more patients in the biomarker-guided group achieved complete mucosal healing (no ulcers). Conclusion: tight control using biomarkers leads to better mucosal healing than symptom-based management alone.\n\nThe CALM trial provided evidence for a 'treat-to-target' strategy in CD using objective measures (CRP, fecal calprotectin) rather than symptoms alone, since symptoms correlate poorly with actual mucosal inflammation. This supports the top-down management strategy and early use of immunosuppressants/biologics."
    difficulty: hard
    tags: [CALM trial, Crohns disease, treat-to-target, biologics, IBD, gastroenterology]
  - front: "What is the prognosis and course of Ulcerative Colitis over time?"
    back: "Chronic relapsing pattern in most patients. 10–15% have a chronic continuous pattern. Nearly all patients have >1 attack. More colonic involvement in the 1st year correlates with increased severity and higher colectomy rate. Colectomy rate: ~1% of all patients per year after the first year; 20–25% eventually undergo colectomy. Normal life expectancy. Proctitis alone: usually benign course, lifetime risk of extension is 15%.\n\nUC is characterized by remissions and relapses. 5% of cases are fulminant. 5-ASA maintenance therapy decreases the yearly relapse rate from 60% to 15%. Fecal calprotectin is a useful non-invasive marker for monitoring disease activity."
    difficulty: medium
    tags: [ulcerative colitis, prognosis, IBD, gastroenterology]
  - front: "What is the non-typhoidal Salmonella infection? Who requires antibiotic treatment?"
    back: "Non-typhoidal Salmonella (e.g., S. Typhimurium, S. Enteritidis): transmitted via contaminated animal food products (eggs, poultry, meat, milk). Incubation 12–72h. Fever, bloody stool, nausea/vomiting, abdominal pain. Duration 3–7 days. Ciprofloxacin only for: severe illness, extremes of age, joint prostheses, valvular heart disease, severe atherosclerosis, cancer, uremia.\n\nMost non-typhoidal Salmonella infections are self-limited and do not require antibiotics in healthy adults. Antibiotics are reserved for patients with risk factors for complicated disease (bacteremia, endovascular infection). Antibiotic treatment may prolong fecal carriage in uncomplicated disease."
    difficulty: medium
    tags: [Salmonella, non-typhoidal, infectious diarrhea, gastroenterology]
  - front: "How is vitamin B12 absorbed? What steps are required?"
    back: "1. B12 ingested and bound to R proteins (from salivary glands). 2. Stomach secretes intrinsic factor (IF) in acidic medium. 3. In basic (alkaline) medium of small intestine, pancreatic proteases cleave R protein. 4. B12 forms covalent bond with IF (protecting from protease attack). 5. B12-IF complex absorbed in the ileum. 6. B12 binds to transcobalamin (TC) in circulation. Deficiency causes: subacute combined degeneration of spinal cord, peripheral/optic neuropathy, dementia, megaloblastic anemia, glossitis.\n\nThe multi-step B12 absorption process means deficiency can result from: inadequate intake (vegans), lack of intrinsic factor (pernicious anemia, gastrectomy), pancreatic insufficiency (cannot cleave R protein), terminal ileal disease or resection. Anti-intrinsic factor antibodies and atrophic gastritis point to pernicious anemia."
    difficulty: medium
    tags: [vitamin B12, malabsorption, intrinsic factor, pernicious anemia, gastroenterology]
  - front: "A patient undergoes ileal resection for Crohn's disease. What are the surgical complications and how do they depend on length resected?"
    back: "< 100 cm resected: watery diarrhea (cholorrhea) due to bile salt malabsorption causing colonic secretion. Treatment: cholestyramine (bile-salt binding resin) or antidiarrheals (loperamide — more convenient and potent). > 100 cm resected: steatorrhea due to depleted bile salt pool + reduced absorptive surface. Treatment: fat restriction, medium-chain triglycerides. If <50% or <200 cm functional small intestine remains: short bowel syndrome risk.\n\nThe ileocecal valve and length/location of resection are key factors. Cholestyramine is specific for bile salt diarrhea but is non-specific; loperamide is often preferred for convenience. Fat restriction and MCTs bypass the need for bile salts (MCTs are absorbed directly without micelle formation)."
    difficulty: hard
    tags: [ileal resection, Crohns disease, short bowel syndrome, bile salts, gastroenterology]
  - front: "What is the genetic defect in Wilson's disease and what is the mode of inheritance?"
    back: "Autosomal recessive defect in the ATP7B gene, causing impaired copper elimination (decreased biliary copper excretion and decreased incorporation of copper into ceruloplasmin).\n\nWilson's disease results from mutations in ATP7B, which encodes a copper-transporting ATPase. The consequence is copper accumulation in liver, brain, kidneys, and cornea. Worldwide incidence is 1 in 40,000."
    difficulty: easy
    tags: [wilsons disease, copper metabolism, genetics, liver disease]
  - front: "List the four major organ systems involved in Wilson's disease and their key manifestations."
    back: "1) Liver: acute hepatitis, ALF, chronic active hepatitis, cirrhosis (low HCC risk). 2) Eyes: Kayser-Fleischer rings (copper in Descemet's membrane). 3) CNS: basal ganglia (wing-flapping tremor, Parkinsonism), cerebellum (dysarthria, ataxia), cerebrum (psychosis). 4) Kidneys: Fanconi syndrome (proximal tubule transport defects) and stones. Also blood (intravascular hemolysis) and joints.\n\nKF rings are present in only 50% of isolated liver involvement but more commonly in CNS involvement. Suspect Wilson's in any young patient (<40) with combination of liver disease, dystonia, and/or psychiatric symptoms."
    difficulty: medium
    tags: [wilsons disease, kayser-fleischer rings, fanconi syndrome, neuropsychiatric]
  - front: "What are the three screening tests and the gold standard investigations for Wilson's disease?"
    back: "Screening: 1) Reduced serum ceruloplasmin (<50% of normal). 2) Kayser-Fleischer rings (slit-lamp examination). 3) Increased 24-hour urinary copper excretion. Gold standard: 1) Increased copper on liver biopsy by quantitative assay. 2) Genetic analysis (imperfect due to many ATP7B mutations).\n\nScreen first-degree relatives. KF rings require slit-lamp examination. Genetic analysis is imperfect because many ATP7B mutations are possible, making quantitative liver copper the definitive test."
    difficulty: medium
    tags: [wilsons disease, ceruloplasmin, kayser-fleischer, investigations]
  - front: "What are the four drugs used to treat Wilson's disease and when is each preferred?"
    back: "1) Penicillamine: chelates copper, poorly tolerated. 2) Trientine: chelates copper. 3) Zinc: impairs copper excretion in stool and decreases gut absorption; used for maintenance or neurological presentations. 4) Tetrathiomolybdate: preferred if neurological involvement. Hepatic presentations are best treated with trientine + zinc combination. Liver transplant for severe liver failure.\n\nTetrathiomolybdate is preferred for neurological Wilson's because penicillamine can worsen neurological symptoms. Zinc acts by inducing intestinal metallothionein, which sequesters copper and prevents absorption."
    difficulty: medium
    tags: [wilsons disease, penicillamine, trientine, zinc, tetrathiomolybdate, treatment]
  - front: "Define hereditary hemochromatosis: genetics, mechanism, and epidemiology."
    back: "Autosomal recessive (HFE gene mutations, most commonly C282Y/C282Y or C282Y/H63D). Decreased hepcidin production leads to increased GI iron absorption and tissue iron deposition despite adequate stores. Total body iron increases to 20–40 g (normal ~1 g). Most common in Northern European descent; homozygous prevalence 1/400 but incomplete penetrance.\n\nC282Y/H63D compound heterozygote is only potentially causative. Non-HFE mutations (ferroportin, hemojuvelin, hepcidin, aceruloplasminemia) are rare. Secondary hemochromatosis occurs with transfusions, iron-loading anemias, and other liver diseases."
    difficulty: easy
    tags: [hemochromatosis, HFE gene, hepcidin, iron overload, genetics]
  - front: "What is the classic clinical pentad of hereditary hemochromatosis?"
    back: "RECT mnemonic + Bronze skin: Arthralgia (especially MCP joints), Bronze/grey skin (melanin, not iron), Cardiomyopathy (diastolic dysfunction early, dilated cardiomyopathy late), Cirrhosis (with 200x increased HCC risk), Diabetes (pancreatic damage), plus Hypogonadism (anterior pituitary damage — hypogonadotropic hypogonadism).\n\nPatients often present with trivially elevated transaminases found incidentally. Skin discoloration is due to melanin, not iron deposition. Chondrocalcinosis may be seen on imaging. Diastolic dysfunction and arrhythmias precede dilated cardiomyopathy."
    difficulty: medium
    tags: [hemochromatosis, bronze diabetes, arthralgia, hypogonadism, cardiomyopathy]
  - front: "What screening tests are used for hemochromatosis and what are the diagnostic thresholds?"
    back: "Transferrin saturation (free Fe²⁺/TIBC) >45%; serum ferritin >400 ng/mL (>1000 ng/mL indicates need for MRI or biopsy). HFE gene analysis: 90% of primary hemochromatosis involves C282Y allele. MRI is most sensitive and specific non-invasive modality. Liver biopsy is used to detect cirrhosis or if other causes of liver disease are suspected.\n\nLiver biopsy generally needed if: age >40, elevated liver enzymes, or ferritin >1000 ng/mL (markers of advanced fibrosis). If C282Y/C282Y with no markers of advanced fibrosis, biopsy is generally not needed. Screen 25% chance siblings."
    difficulty: medium
    tags: [hemochromatosis, transferrin saturation, ferritin, liver biopsy, MRI]
  - front: "What is the treatment for hereditary vs. secondary hemochromatosis and what is the prognosis?"
    back: "Hereditary: weekly or q2-week phlebotomy, then lifelong maintenance q2–6 months targeting ferritin 50–100 ng/mL. Responds well to phlebotomy. Secondary: usually requires chelation therapy (e.g., deferoxamine) if phlebotomy is contraindicated (e.g., cardiomyopathy, anemia). Prognosis: normal life expectancy if treated before cirrhosis or DM develop.\n\nChelation therapy binds and sequesters iron for excretion. Ferritin may never normalize if other causes of high ferritin coexist (e.g., metabolic syndrome, alcohol). HCC screening is required if cirrhosis develops."
    difficulty: medium
    tags: [hemochromatosis, phlebotomy, deferoxamine, chelation, treatment]
  - front: "Describe the pathophysiology of alcohol-related liver disease (ArLD) including the histological triad of alcoholic hepatitis."
    back: "Ethanol → acetaldehyde: reduces NAD⁺ to NADH, impairing lipolysis → fatty acid/TG accumulation. EtOH also increases gut permeability → bacterial translocation; causes relative hypoxia in zone III (central veins). Histological triad: 1) Ballooned hepatocytes with Mallory bodies (eosinophilic intracellular cytokeratin aggregates) surrounded by neutrophils. 2) Large fat globules. 3) Chicken-wire fibrosis (perivenular and space of Disse).\n\nZone III is near central veins and poorly oxygenated, making it most vulnerable to EtOH-induced injury. Mallory bodies are characteristic of alcoholic hepatitis but not pathognomonic. Neutrophilic infiltration distinguishes alcoholic from other causes of steatohepatitis."
    difficulty: hard
    tags: [alcohol liver disease, Mallory bodies, steatohepatitis, pathophysiology, histology]
  - front: "What is the blood test pattern in alcohol-related liver disease (ArLD) and how does it differ from MASLD?"
    back: "ArLD: AST:ALT ratio >2:1 (both usually <300 U/L); increased GGT; increased MCV; leukocytosis (neutrophilia) with acute alcoholic hepatitis. MASLD (formerly NAFLD): AST:ALT ratio <1; elevated AST, ALT, and ALP; echogenic liver on ultrasound.\n\nThe AST:ALT >2:1 ratio in ArLD results partly from alcohol-induced mitochondrial injury preferentially raising AST, and pyridoxine (B6) deficiency reducing ALT synthesis. In MASLD, AST/ALT <1 is characteristic, reflecting different patterns of hepatocyte injury."
    difficulty: medium
    tags: [alcohol liver disease, MASLD, AST ALT ratio, GGT, liver enzymes]
  - front: "What scores are used to assess severity of alcoholic hepatitis and guide treatment with corticosteroids?"
    back: "Maddrey's discriminant function (based on PT and bilirubin): score >32 indicates severe disease, consider corticosteroids. MELD score >21 also indicates severe disease. Lille model (bilirubin response at day 7 of corticosteroids) guides continuation of full course. Pentoxifylline is less used — the most definitive trial did not demonstrate efficacy.\n\nCorticosteroids (prednisone) are used for severe alcoholic hepatitis (Maddrey >32 or MELD >21). The Lille score at day 7 predicts response: poor responders may not benefit from continued steroids. 30-day mortality in severe disease is 30–60%."
    difficulty: hard
    tags: [alcoholic hepatitis, Maddrey score, MELD, Lille model, corticosteroids]
  - front: "What is the prognosis of severe alcoholic hepatitis with and without continued drinking?"
    back: "Immediate mortality (first 6 months if severe): 30–60%. With continued EtOH: 70% mortality at 5 years. With cessation: 30% mortality at 5 years. Hepatic steatosis: complete resolution with EtOH cessation. Chronic cirrhosis risk: 10–15% of individuals with EtOH use disorder.\n\nThe threshold for significant risk is >2–3 standard drinks/day in females and >3–6 standard drinks/day in males for >10 years; however only ~10–20% of heavy drinkers develop cirrhosis. Clinical findings do not accurately predict the type of liver involvement."
    difficulty: medium
    tags: [alcoholic hepatitis, prognosis, alcohol cessation, cirrhosis]
  - front: "Define MASLD (formerly NAFLD) and MetALD, and describe the key pathogenic mechanism."
    back: "MASLD: hepatic steatosis with ≥1 cardiometabolic risk factor, no other cause for steatotic liver disease. MetALD: hepatic steatosis with ≥1 cardiometabolic risk factor plus alcohol intake above threshold (>7 drinks/week women; >10 drinks/week men). Key pathogenesis: insulin resistance leads to hepatic steatosis. Histology is indistinguishable from alcoholic hepatitis.\n\nMASLD is the most common cause of liver disease in North America. Risk factors include obesity, T2DM, hypertension, and hypertriglyceridemia (metabolic syndrome components). The renaming from NAFLD to MASLD emphasizes the metabolic underpinning."
    difficulty: easy
    tags: [MASLD, NAFLD, steatotic liver disease, insulin resistance, metabolic syndrome]
  - front: "What are the treatment options for MASLD (formerly NAFLD) with level of evidence?"
    back: "1) Gradual weight loss 0.5–1 kg/week (mainstay); ≥7–10% body weight loss reverses MASH; rapid weight loss worsens disease. 2) Pioglitazone (evidence exists, but risk of weight gain and CHF). 3) Vitamin E 800 IU/day — evidence for non-diabetic, non-cirrhotic patients with hepatic inflammation. 4) Coffee 1–3 cups/day (some evidence). 5) Bariatric surgery. 6) GLP-1 analogues (e.g., semaglutide) — improve MASH via weight loss but not proven to improve liver fibrosis.\n\nRapid weight loss can mobilize free fatty acids quickly and worsen steatohepatitis. GLP-1 analogues are promising but currently their fibrosis benefit is not established. The main causes of death in non-cirrhotic MASLD are cardiovascular disease and malignancy."
    difficulty: hard
    tags: [MASLD, treatment, weight loss, semaglutide, vitamin E, pioglitazone]
  - front: "Define Acute Liver Failure (ALF) and list the most common causes."
    back: "ALF: severe decline in liver function with coagulation abnormality (INR >1.5) and encephalopathy, in the setting of previously normal liver, with rapid onset (<26 weeks duration). Common causes: drugs (especially acetaminophen — most common), hepatitis B (measure anti-HBc IgM), hepatitis A, ischemic hepatitis, autoimmune hepatitis, Wilson's disease, idiopathic. Hepatitis C causes ALF rarely.\n\nMeasure anti-HBc IgM in ALF suspected of HBV because HBV-DNA and HBsAg can rapidly become negative in fulminant HBV. Acetaminophen is the leading cause in Canada and should always be considered."
    difficulty: easy
    tags: [acute liver failure, acetaminophen, hepatitis B, INR, encephalopathy]
  - front: "What are the King's College criteria for liver transplantation in Acute Liver Failure?"
    back: "Consider early transplant (especially) if: time from jaundice to encephalopathy >7 days (not extremely rapid onset); age <10 or >40 years; cause is drug or unknown; bilirubin >300 µmol/L; INR >3.5; creatinine >200 µmol/L. Chief value of liver biopsy is to exclude chronic disease; less helpful for prognosis.\n\nThe King's College criteria differ for acetaminophen vs. non-acetaminophen ALF. Early consideration for transplant is critical as the window is narrow. Biopsy should be considered before INR becomes too elevated to be safely performed."
    difficulty: hard
    tags: [acute liver failure, Kings College criteria, liver transplantation, prognosis]
  - front: "Define cirrhosis: compensated vs. decompensated, and what are the most common causes?"
    back: "Cirrhosis: diffuse liver architecture distortion with fibrosis and regenerative nodules; biopsy is gold standard. Compensated: absence of complications, can last 10–20 years with near-normal life expectancy. Decompensated: development of ascites (most common), variceal bleeding, or encephalopathy. Causes: steatotic liver disease (alcohol or MASLD), chronic viral hepatitis B/C (not A or E), autoimmune hepatitis, hemochromatosis, PBC, drugs (MTX, amiodarone), cardiac cirrhosis (Budd-Chiari), Wilson's disease, α1-antitrypsin deficiency.\n\nHepatitis A and E do NOT cause chronic liver disease or cirrhosis. Cryptogenic cirrhosis often represents 'burnt-out MASH.' Fibrosis may regress if the underlying cause is treated. MELD-Na score includes creatinine, INR, total bilirubin, and serum sodium."
    difficulty: easy
    tags: [cirrhosis, compensated, decompensated, etiology, portal hypertension]
  - front: "Describe the progression of laboratory findings in cirrhosis in order of appearance."
    back: "Earliest: fall in platelet count <150 (from hypersplenism). Then: rise in INR (decreased clotting factor synthesis). Then: fall in albumin. Finally (in severe disease): rise in bilirubin. Pre-terminal: hypoglycemia (more characteristic of severe ALF).\n\nThe sequential lab changes reflect the progressive loss of synthetic function. Hypersplenism causing pancytopenia affects platelets first, then WBC, then hemoglobin. The INR-to-bleeding tendency relationship is controversial — some patients are hypo-, others hypercoagulable."
    difficulty: medium
    tags: [cirrhosis, thrombocytopenia, INR, albumin, coagulopathy, investigations]
  - front: "What is the Child-Pugh score and how is it interpreted?"
    back: "Five parameters (1–3 points each): serum bilirubin, serum albumin, INR, ascites (absent/controllable/refractory), encephalopathy (absent/minimal/severe). Class A (5–6 pts): 15–50 year life expectancy, 0% perioperative mortality. Class B (7–9 pts): transplant candidate, 30% perioperative mortality. Class C (10–15 pts): ~3 months life expectancy, 82% perioperative mortality.\n\nChild-Pugh is useful for quantifying cirrhosis severity and perioperative risk. MELD score (creatinine, INR, bilirubin, Na) is now preferred for transplant listing (use MELD >15 as threshold for transplant consideration). Usual causes of death in cirrhosis: renal failure (HRS), sepsis, GI bleed."
    difficulty: medium
    tags: [Child-Pugh score, cirrhosis, prognosis, liver transplantation, MELD]
  - front: "What are the subtypes of Hepatorenal Syndrome (HRS) and how do they differ?"
    back: "HRS-AKI: sudden acute renal failure (rapid doubling of creatinine over <2 weeks). HRS-CKD: gradual increase in creatinine with worsening liver function (creatinine doubling over years). HRS can occur at any time in severe liver disease, precipitated by overdiuresis/dehydration, GI bleed, or sepsis.\n\nHRS differs from pre-renal failure — in HRS, IV fluid challenge does NOT improve renal function (urine Na is low in both). Treatment: octreotide + midodrine + albumin (increases systemic vascular resistance → increases renal blood flow). Definitive treatment is liver transplantation."
    difficulty: hard
    tags: [hepatorenal syndrome, HRS-AKI, HRS-CKD, renal failure, cirrhosis complications]
  - front: "What is hepatopulmonary syndrome (HPS) and how is it diagnosed?"
    back: "Clinical triad: liver disease + increased alveolar-arterial gradient while breathing room air + evidence of intrapulmonary vascular dilatation. Mechanism: V/Q mismatch (intrapulmonary shunting), failure to clear pulmonary vasodilators. Features: platypnea (dyspnea worsened upright, improved supine) and orthodeoxia (desaturation upright, improved supine). Diagnosis: contrast-enhanced echocardiography — air bubbles appear in LV after >3 heartbeats (normal = no bubbles; VSD = <3 beats). Treatment: liver transplantation (only proven treatment).\n\nHPS occurs mainly in cirrhosis but can also occur in non-cirrhotic portal hypertension. The pathognomonic finding of late bubble appearance (>3 beats) on contrast echo distinguishes intrapulmonary shunting from intracardiac shunting."
    difficulty: hard
    tags: [hepatopulmonary syndrome, platypnea, orthodeoxia, contrast echocardiography, cirrhosis]
  - front: "What are the three sites of increased resistance causing portal hypertension, with examples of each?"
    back: "1) Pre-sinusoidal: portal vein thrombosis, schistosomiasis, sarcoidosis. 2) Sinusoidal: cirrhosis (most common), acute alcoholic hepatitis. 3) Post-sinusoidal: right-sided heart failure, hepatic vein thrombosis (Budd-Chiari), veno-occlusive disease, constrictive pericarditis. Portal hypertension is defined as hepatic venous pressure gradient >5 mmHg.\n\nThe site of resistance determines the pattern of disease. Pre-sinusoidal causes portal hypertension without parenchymal liver disease. HVPG >10 mmHg is the strongest predictor of variceal development. HVPG >12 mmHg is associated with variceal bleeding."
    difficulty: medium
    tags: [portal hypertension, pre-sinusoidal, sinusoidal, post-sinusoidal, Budd-Chiari]
  - front: "What are the indications, mechanism, and complications of TIPS (transjugular intrahepatic portosystemic shunt)?"
    back: "Indications: acute variceal bleeding, prevention of rebleeding, refractory ascites. Mechanism: radiologically inserted stent between portal and hepatic vein via transjugular catheterization, decreasing portal venous pressure. Complications: hepatic encephalopathy, right-sided heart failure, deterioration of hepatic function. Contraindications: severe liver dysfunction, uncontrolled hepatic encephalopathy, congestive heart failure.\n\nTIPS effectively reduces portal pressure by creating a bypass, but the shunted blood bypasses hepatocytes, increasing the risk of encephalopathy (nitrogenous compounds not metabolized). The PREDESCI trial showed carvedilol lowers risk of decompensation in portal hypertension."
    difficulty: medium
    tags: [TIPS, portal hypertension, variceal bleeding, ascites, encephalopathy]
  - front: "Describe the stages of hepatic encephalopathy (HE) and the mnemonic for precipitating factors."
    back: "Minimal HE (diagnosed with specialized cognitive testing). Overt HE stages: I — apathy, restlessness, sleep-wake reversal, slowed intellect, impaired handwriting; II — asterixis, lethargy, drowsiness, disorientation; III — stupor (rousable), hyperactive reflexes, Babinski sign positive; IV — coma (response to pain only or non-responsive). Precipitants (HEPATICS): Haemorrhage (GI)/Hypokalemia, Excess dietary protein, Paracentesis, Alkalosis/Anemia, Trauma, Infection (including SBP), Colon surgery/CNS depressants, Sedatives.\n\nEEG in HE shows diffuse non-focal slow high-amplitude waves. Ammonia is usually elevated but does NOT correlate with severity and is not useful as a standalone diagnostic test. Serum ammonia can be elevated without HE and vice versa."
    difficulty: medium
    tags: [hepatic encephalopathy, stages, asterixis, precipitants, ammonia]
  - front: "What is the treatment for hepatic encephalopathy, including first-line and second-line agents?"
    back: "1) Treat underlying precipitants. 2) Lactulose/lactitol: titrated to 2–3 soft stools/day; lowers colonic pH converting NH₃ to non-diffusible NH₄⁺; promotes bacteria that produce minimal ammonia; laxative effect eliminates nitrogen-producing bacteria. 3) Oral rifaximin: high-level evidence for both acute treatment and maintenance. 4) Lactulose + rifaximin combination is more effective than lactulose alone (reduces mortality). 5) NG tube or lactulose enemas for patients who cannot take oral medications. Note: routine protein restriction is no longer recommended (malnutrition risk); vegetable protein preferred over animal protein.\n\nThe randomized double-blind trial showed rifaximin 1200 mg/day plus lactulose had 76% response rate vs. ~29% for lactulose plus placebo, with significant decrease in mortality. Protein restriction is outdated — sarcopenia worsens outcomes."
    difficulty: medium
    tags: [hepatic encephalopathy, lactulose, rifaximin, treatment, ammonia]
  - front: "How is ascites evaluated using the Serum-Ascites Albumin Gradient (SAAG)?"
    back: "SAAG = serum albumin − ascitic fluid albumin. SAAG ≥11 g/L (1.1 g/dL): portal hypertension-related (cirrhosis, right heart failure, Budd-Chiari, massive liver metastases, portal vein thrombosis). SAAG <11 g/L: non-portal hypertension-related (peritoneal carcinomatosis, TB peritonitis, pancreatic disease, serositis, nephrotic syndrome). Note: in nephrotic syndrome, serum albumin is already low, making the gradient unreliable.\n\nCardiac ascites (chronic right heart failure) typically has ascitic fluid total protein >25 g/L, while cirrhotic ascites has total protein <25 g/L — both have SAAG ≥11 g/L. SAAG is more accurate than the exudate/transudate classification using LDH/protein."
    difficulty: medium
    tags: [ascites, SAAG, portal hypertension, paracentesis, diagnosis]
  - front: "What is the diagnostic paracentesis protocol and what is the most common bacterial cause of SBP?"
    back: "Paracentesis aliquots: 1st — cell count and differential; 2nd — chemistry (albumin, total protein; amylase if pancreatitis suspected; TG/chylomicrons if turbid); 3rd — C&S and Gram stain; 4th — cytology (positive in peritoneal carcinomatosis). SBP diagnosis: absolute neutrophil count >0.25×10⁹ cells/L (250 cells/mm³). Most common organisms: Gram-negatives 70% — E. coli (most common), Klebsiella. Gram stain positive in only 10–50%; culture positive in <80%.\n\n1/3 of SBP patients are asymptomatic — do not hesitate to perform diagnostic paracentesis in any cirrhotic with ascites. SBP occurs in 10% of cirrhotic ascites and has higher risk in patients with GI bleed."
    difficulty: medium
    tags: [SBP, spontaneous bacterial peritonitis, paracentesis, ascites, neutrophil count]
  - front: "What is the treatment and prophylaxis for spontaneous bacterial peritonitis (SBP)?"
    back: "Treatment: IV cefotaxime 2 g q8h or ceftriaxone 2 g IV daily × 5 days (modify if resistant organisms). IV albumin 1.5 g/kg at diagnosis + 1 g/kg on day 3 — decreases mortality by lowering risk of acute renal failure. Prophylaxis: variceal bleeding — ceftriaxone IV daily or norfloxacin BID × 7 days. Previous SBP episode — long-term daily norfloxacin or TMP-SMX.\n\nIV albumin in SBP treatment prevents the renal failure (a key driver of mortality) by maintaining effective arterial volume and preventing circulatory dysfunction. SBP in cirrhosis carries high 2-year mortality, highlighting the need for transplant evaluation."
    difficulty: hard
    tags: [SBP, cefotaxime, albumin, prophylaxis, norfloxacin, treatment]
  - front: "What is the treatment for refractory ascites in cirrhosis?"
    back: "1) Therapeutic (large-volume) paracentesis with IV albumin (8 g per litre of ascites removed). 2) TIPS (in appropriate patients without contraindications) — has potential transplant-free survival advantage. 3) Liver transplantation — should be considered in every case, as ascites in cirrhosis is associated with high 2-year mortality. Standard therapy: sodium restriction <2 g/day, spironolactone + furosemide, target weight loss 0.5–1 kg/day.\n\nAscites becomes refractory when diuretics are inadequate or not tolerated. Fluid restriction is only needed for significant hyponatremia (Na <120–125 mmol/L). Overly rapid weight loss increases risk of renal failure by depleting intravascular volume."
    difficulty: medium
    tags: [refractory ascites, paracentesis, TIPS, spironolactone, liver transplantation]
  - front: "Describe the approach to jaundice workup — how do dark urine and pale stools help differentiation?"
    back: "Dark urine + pale stools: suggests conjugated (direct) hyperbilirubinemia — bile cannot reach gut (biliary obstruction) but conjugated bilirubin is excreted in urine. Pruritus: suggests cholestasis or chronic disease. Painless jaundice in elderly: think pancreatic cancer. Abdominal pain with jaundice: biliary tract obstruction (stone or tumour). Workup: bilirubin fractionation → ultrasound (dilated vs. normal ducts) → MRCP/EUS/ERCP depending on findings.\n\nUnconjugated bilirubin is bound to albumin and cannot be filtered by kidneys, so it does not cause dark urine. Gilbert's syndrome and hemolysis cause unconjugated hyperbilirubinemia without dark urine. ERCP is reserved for therapeutic intervention."
    difficulty: medium
    tags: [jaundice, dark urine, cholestasis, conjugated bilirubin, workup]
  - front: "What is Gilbert's syndrome — etiology, prevalence, clinical features, and management?"
    back: "Hereditary predominantly unconjugated hyperbilirubinemia due to reduced glucuronyl transferase activity (UGT1A1 gene mutation, autosomal dominant, 70% UGT gene mutation). Affects 7% of population, especially males. Presents in teens–20s. Features: intermittent mild unconjugated hyperbilirubinemia, typically triggered by fasting or acute illness; otherwise asymptomatic. Treatment: reassurance (entirely benign). Distinct from Crigler-Najjar: complete deficiency of glucuronyl transferase.\n\nGilbert's should be differentiated from hemolysis (no reticulocytosis or anemia in Gilbert's) and from Crigler-Najjar (partial vs. complete enzyme deficiency). Some patients also have decreased hepatobiliary uptake. No other clinical implications."
    difficulty: easy
    tags: [Gilberts syndrome, unconjugated hyperbilirubinemia, glucuronyl transferase, benign, jaundice]
  - front: "What is Primary Sclerosing Cholangitis (PSC) — key associations, investigations, and complications?"
    back: "PSC: inflammation, fibrosis, and stricturing of intra- and/or extrahepatic bile ducts. Key association: IBD (70–80% of PSC patients, usually UC, usually male). Investigations: ALP elevated (hallmark), p-ANCA (30–80%), elevated IgM (40–50%), MRCP shows beading pattern (alternating narrowing and dilatation of bile ducts). ERCP reserved for intervention only. Complications: cholangiocarcinoma (10–15%), secondary biliary cirrhosis, colon cancer (5-fold risk vs. UC alone in those with IBD).\n\nPSC is idiopathic in most cases. MRCP is the diagnostic imaging modality of choice; ERCP risks cholangitis. Small-duct PSC variant (~10%) requires liver biopsy. Ursodiol has no proven benefit on natural history and may increase mortality at high doses."
    difficulty: medium
    tags: [PSC, primary sclerosing cholangitis, IBD, ulcerative colitis, cholangiocarcinoma, beading]
  - front: "What is the surveillance strategy and treatment for PSC?"
    back: "Surveillance: MRCP at least annually for cholangiocarcinoma detection (controversial); 6-monthly imaging for HCC surveillance in cirrhotic PSC; annual colonoscopy for colon cancer in those with IBD. Treatment: ABx for cholangitis; emergency drainage for suppurative cholangitis; endoscopic sphincterotomy/stent for dominant CBD strictures; liver transplantation is best treatment for advanced PSC (>90% 1-year survival; mean time to transplant 10–20 years). Ursodiol NOT recommended (no effect on natural history, may worsen at high doses).\n\nPSC has a highly variable course — some patients have indolent disease. The mean time to transplant in those with severe disease is 10–20 years. PSC post-transplant recurrence occurs in some patients. The 5-fold colon cancer risk vs. UC alone requires annual colonoscopy."
    difficulty: hard
    tags: [PSC, surveillance, cholangiocarcinoma, liver transplantation, colonoscopy]
  - front: "What drugs (other than acetaminophen) are hepatotoxic and associated with specific liver injury patterns?"
    back: "Azoles, statins, methyldopa, phenytoin, propylthiouracil (PTU), rifampin, sulfonamides, tetracyclines. Herbs: khat, chaparral leaf, germander, comfrey, bush tea. Weight loss supplements with green tea extract → acute liver failure. Bodybuilding supplements → prolonged cholestatic jaundice. In cirrhosis: MTX (chronic use) and amiodarone are causes. Tamoxifen, corticosteroids, and MTX are causes of MASLD.\n\nDrug-induced liver injury (DILI) can mimic any pattern of liver disease. PTU is a notable cause of fulminant hepatic failure. Green tea extract in weight loss supplements has been associated with ALF, which is clinically significant in Canada given supplement use."
    difficulty: medium
    tags: [drug-induced liver injury, DILI, hepatotoxic drugs, PTU, statins, supplements]
  - front: "A 28-year-old male presents with liver disease and psychosis. Ceruloplasmin is low. What is the diagnosis, and why might serum ceruloplasmin be falsely normal in this condition?"
    back: "Wilson's disease. Ceruloplasmin is an acute-phase reactant and can be falsely elevated (appearing normal or near-normal) during acute inflammation, pregnancy, or estrogen use — making it unreliable as a standalone test. Always combine with 24-hour urinary copper and slit-lamp examination for KF rings. Gold standard: quantitative liver copper by biopsy.\n\nThis question tests integration: low ceruloplasmin + psychiatric + liver disease in a young person = Wilson's. Recognizing that ceruloplasmin is an acute-phase protein that can be falsely normal is a critical clinical nuance for MCCQE1. ATP7B genetic testing is imperfect due to many possible mutations."
    difficulty: hard
    tags: [wilsons disease, ceruloplasmin, acute phase reactant, diagnosis, clinical reasoning]
  - front: "What is the peripheral arterial vasodilation theory of ascites formation?"
    back: "Portal hypertension in cirrhosis leads to production of local mediators (especially nitric oxide), causing splanchnic arterial vasodilation. This pulls blood away from the systemic circulation, reducing effective arterial volume. The kidneys compensate with sodium and water retention (activating RAAS, ADH, sympathetic nervous system). The result is increased total circulating volume but decreased effective arterial volume — reconciling the 'underfill' and 'overfill' hypotheses.\n\nThis is the most widely accepted theory. It explains why despite expanded total blood volume in cirrhotic ascites, patients have signs of reduced effective circulation. Treatment with spironolactone targets the secondary hyperaldosteronism. Loop diuretics (furosemide) are added to prevent hypokalemia from spironolactone."
    difficulty: hard
    tags: [ascites, peripheral vasodilation theory, nitric oxide, splanchnic vasodilation, pathophysiology]
  - front: "What clinical findings on physical exam indicate portal hypertension specifically (as distinct from liver failure)?"
    back: "Portal hypertension signs: esophageal varices (hematemesis/melena), splenomegaly, caput medusae (dilated periumbilical veins), ascites, hemorrhoids. Liver failure signs (different): encephalopathy/coma, jaundice/scleral icterus, spider angioma, gynecomastia, muscle wasting, bleeding tendency (bruising), loss of sexual hair/testicular atrophy, ankle edema, palmar erythema, Dupuytren's contracture, asterixis, leukonychia (Terry's nails), clubbing, fetor hepaticus, xanthelasma.\n\nDistinguishing these two sets of signs is clinically important — portal hypertension can occur without significant hepatocellular failure (e.g., portal vein thrombosis). Spider angiomas and palmar erythema reflect hyperestrogenemia from impaired hepatic estrogen metabolism."
    difficulty: medium
    tags: [portal hypertension, liver failure signs, caput medusae, spider angioma, physical exam]
  - front: "What is the role of non-selective beta-blockers in portal hypertension management?"
    back: "Non-selective β-blockers (propranolol, nadolol, carvedilol) decrease risk of bleeding from varices. The PREDESCI trial (Lancet 2019) showed carvedilol in cirrhotic patients with portal hypertension (clinically significant) lowers the risk of decompensation, particularly ascites. They work by: β1-blockade reducing cardiac output; β2-blockade causing splanchnic vasoconstriction, reducing portal blood flow.\n\nNSBBs are first-line primary prophylaxis for medium/large varices. Carvedilol has additional alpha-blocking properties, providing additional portal pressure reduction. The PREDESCI trial was a landmark showing that prevention of decompensation extends beyond just preventing variceal bleeding."
    difficulty: medium
    tags: [portal hypertension, beta-blockers, carvedilol, PREDESCI trial, varices prophylaxis]
  - front: "What is Primary Biliary Cholangitis (PBC) and which ducts are affected?"
    back: "PBC is a chronic autoimmune condition causing inflammation and fibrous obliteration of intrahepatic bile ductules only (NOT extrahepatic ducts). This contrasts with PSC, which affects both intra- and extrahepatic ducts.\n\nPBC is likely autoimmune, associated with Sjogren's syndrome, CREST syndrome, RA, and thyroiditis. The absence of duct narrowing on MRCP (unlike PSC) is a key distinguishing feature. Diagnosis is confirmed by elevated ALP >6 months plus positive anti-mitochondrial antibodies (AMA)."
    difficulty: easy
    tags: [gastroenterology, liver, biliary, autoimmune, PBC]
  - front: "What is the demographic and autoimmune association profile of Primary Biliary Cholangitis (PBC)?"
    back: "PBC predominantly affects middle-aged women (M:F = 1:9). Associated autoimmune conditions include Sjogren's syndrome, scleroderma, CREST syndrome (calcinosis, Raynaud's, esophageal dysfunction, sclerodactyly, telangiectasia), rheumatoid arthritis, and thyroiditis.\n\nThe strong female predominance and association with other autoimmune diseases supports an autoimmune etiology. This demographic contrast with PSC (predominantly male, associated with IBD/UC) is a classic MCCQE1 comparison."
    difficulty: easy
    tags: [gastroenterology, liver, biliary, PBC, autoimmune, demographics]
  - front: "What are the diagnostic investigations for Primary Biliary Cholangitis (PBC)?"
    back: "Key investigations: (1) Positive anti-mitochondrial antibodies (AMA) — 95% sensitivity and specificity; (2) Elevated ALP and GGT (bilirubin rises late); (3) Elevated IgM; (4) Increased serum cholesterol (mild LDL increase, larger HDL increase); (5) Normal bile duct on MRCP (rules out large/medium duct disease). Elevated ALP >6 months + positive AMA is sufficient for diagnosis — liver biopsy usually not required.\n\nAMA is the hallmark serological test for PBC with high sensitivity and specificity. Normal MRCP differentiates PBC (intrahepatic only) from PSC (which shows beading/narrowing of ducts on MRCP). Bilirubin rises later in the disease course."
    difficulty: easy
    tags: [gastroenterology, liver, biliary, PBC, diagnostics, AMA]
  - front: "What is the first-line treatment for Primary Biliary Cholangitis (PBC), and what is the second-line agent?"
    back: "First-line: Ursodeoxycholic acid (UDCA/ursodiol). Second-line: Obeticholic acid (if inadequate response to UDCA). Additional supportive treatments: cholestyramine for pruritus, calcium/vitamin D for bone density, bisphosphonates if osteoporosis is present.\n\nUDCA improves survival comparable to age- and sex-matched controls when ALP normalizes. Obeticholic acid is a farnesoid X receptor agonist approved for patients with inadequate UDCA response. Osteoporosis risk is high in PBC due to cholestasis impairing fat-soluble vitamin (D) absorption."
    difficulty: easy
    tags: [gastroenterology, liver, biliary, PBC, treatment, UDCA]
  - front: "Compare Primary Sclerosing Cholangitis (PSC) vs. Primary Biliary Cholangitis (PBC) across sex predominance, associations, affected ducts, and key investigations."
    back: "PSC: Male predominance; associated with IBD (especially UC); affects BOTH intra- and extrahepatic ducts; MRCP shows narrowing and dilatations ('beaded' appearance). PBC: Female predominance (M:F=1:9); associated with other autoimmune disorders (Sjogren's, CREST, RA); affects intrahepatic ducts ONLY; diagnosed by anti-mitochondrial antibodies (AMA), elevated IgM, increased lipids, and absence of duct narrowing on MRCP.\n\nThis comparison is high-yield for MCCQE1. PSC has a much higher risk of cholangiocarcinoma. PBC has higher risk of osteoporosis. Both can progress to cirrhosis and may require liver transplantation."
    difficulty: medium
    tags: [gastroenterology, liver, biliary, PSC, PBC, comparison]
  - front: "What are Charcot's Triad and Reynolds' Pentad, and in what condition do they occur?"
    back: "Both occur in ascending cholangitis (infection of the biliary tree). Charcot's Triad (50-70% of cases): Fever + RUQ pain + Jaundice. Reynolds' Pentad (suppurative cholangitis): Fever + RUQ pain + Jaundice + Hypotension + Altered mental status. Reynolds' Pentad carries ~50% mortality.\n\nAscending cholangitis is caused by biliary stasis due to obstruction (e.g., CBD stone). Common organisms: E. coli, Klebsiella, Enterobacter, Enterococcus, Bacteroides, Clostridia. Treatment priority is biliary drainage via ERCP, with broad-spectrum antibiotics covering Gram-negatives, Enterococcus, and anaerobes."
    difficulty: easy
    tags: [gastroenterology, biliary, cholangitis, Charcot, Reynolds]
  - front: "What is the treatment priority and antibiotic regimen for ascending cholangitis?"
    back: "Treatment priority: DRAINAGE (ideally via ERCP; percutaneous biliary or surgical routes if ERCP not possible). Antibiotic options: (1) Ampicillin + sulbactam or piperacillin/tazobactam; (2) Metronidazole + 3rd-generation cephalosporin (e.g., ceftriaxone) or fluoroquinolone (e.g., ciprofloxacin); (3) Carbapenem monotherapy (e.g., imipenem or meropenem). Coverage must include Gram-negatives, Enterococcus, and anaerobes.\n\nDrainage is the cornerstone of treatment because antibiotics alone cannot clear an obstructed biliary system. The choice of antibiotics should cover the typical polymicrobial flora of biliary infections. Good prognosis with effective drainage in mild-moderate cases; Reynolds' Pentad carries ~50% mortality."
    difficulty: medium
    tags: [gastroenterology, biliary, cholangitis, treatment, ERCP, antibiotics]
  - front: "What are the most common causes of acute pancreatitis? Use the mnemonic GET SMASHED."
    back: "GET SMASHED: Gallstones (45%), Ethanol (35%), Trauma, Steroids (controversial), Mumps/Microbiological, Autoimmune (IgG4, SLE), Scorpion stings, Hyperlipidemia (TG >11.3 mmol/L) / Hypercalcemia / Hypothermia, ERCP/Emboli, Drugs (azathioprine, furosemide, estrogens, valproic acid, etc.). The vast majority are due to gallstones or ethanol.\n\nGallstones cause pancreatitis via mechanical obstruction of the pancreatic duct. ALT >150 U/L is specific for a biliary cause of pancreatitis. Hypertriglyceridemia must exceed 11.3 mmol/L (1000 mg/dL) to cause pancreatitis."
    difficulty: easy
    tags: [gastroenterology, pancreas, pancreatitis, etiology, GET-SMASHED]
  - front: "What are the clinical signs of acute pancreatitis, including Grey-Turner's sign and Cullen's sign?"
    back: "Classic presentation: epigastric pain (constant, non-colicky), radiating to back, may improve leaning forward (Inglefinger's sign). Associated: N/V, fever (chemical, not infectious initially), abdominal distension from ileus, tender/rigid abdomen. Specific signs of severe/hemorrhagic pancreatitis: Grey-Turner's sign (flank ecchymosis) and Cullen's sign (periumbilical ecchymosis). Complications: jaundice, tetany (hypocalcemia), hypovolemic shock, ARDS, coma.\n\nGrey-Turner's and Cullen's signs indicate retroperitoneal hemorrhage and suggest severe/necrotizing pancreatitis. Lipase is more specific than amylase for pancreatitis and stays elevated longer. Amylase >5x normal almost always indicates pancreatitis or renal failure."
    difficulty: easy
    tags: [gastroenterology, pancreas, pancreatitis, clinical-signs, Grey-Turner, Cullen]
  - front: "What are the radiological findings in acute pancreatitis on plain X-ray and CT scan?"
    back: "X-ray findings: 'Sentinel loop' (dilated proximal jejunum), calcifications, 'colon cut-off sign' (colonic spasm). CT scan (most useful, ideally done >1 day after presentation): contrast uptake seen in viable tissue only — non-viable/necrotic areas do NOT take up contrast. The proportion of pancreas not taking up contrast on CT at 48 hours is the most useful severity predictor. Can biopsy necrotic areas to differentiate sterile vs. infected necrosis.\n\nU/S is useful for evaluating the biliary tree (67% sensitivity, 100% specificity for gallstones). MRCP is used to determine etiology; ERCP is reserved for patients requiring biliary intervention. CT at 48 hours is the gold standard for severity assessment and detecting necrosis."
    difficulty: medium
    tags: [gastroenterology, pancreas, pancreatitis, imaging, CT, radiology]
  - front: "According to the Revised 2012 Atlanta Classification, how are pancreatic fluid/solid collections classified?"
    back: "Collections in pancreatitis are classified by fluid vs. solid AND acute vs. chronic: Acute Liquid: Acute Peripancreatic Fluid Collection (APFC). Acute Solid: Acute Necrotic Collection (ANC). Chronic Liquid: Pancreatic Pseudocyst. Chronic Solid: Walled-off Necrosis (WON). All collections are further classified as infected or not infected.\n\nThis classification has replaced the older 'pseudocyst' terminology for all collections. Walled-off necrosis (WON) is the mature form of ANC and requires drainage if infected. Endoscopic drainage is preferred over surgical necrosectomy when technically possible, and should be delayed >2 weeks to allow demarcation."
    difficulty: medium
    tags: [gastroenterology, pancreas, pancreatitis, Atlanta-classification, pseudocyst]
  - front: "What is the management of acute pancreatitis? List the treatment goals and key interventions."
    back: "Goals (only supportive therapy available): (1) Hemodynamic stability with IV crystalloids/colloids; (2) Analgesia; (3) Oxygen; (4) Stop progression of damage; (5) Treat local/systemic complications. Key interventions: NG suction if vomiting/distension; nutritional support via NJ feeding or TPN if cannot tolerate enteric feeds (recent evidence supports NG or oral feeds); endoscopic sphincterotomy if severe gallstone pancreatitis with cholangitis/ongoing obstruction; drain/debride if infected necrosis (delay >2 weeks). Antibiotics only if infection confirmed — NOT for prophylaxis.\n\nThe WATERFALL trial showed aggressive fluid resuscitation does NOT improve outcomes and increases fluid overload compared to moderate resuscitation. Enteral nutrition is preferred over TPN in pancreatitis (Cochrane data: EN reduces mortality RR 0.50, organ failure, and infections vs. TPN)."
    difficulty: medium
    tags: [gastroenterology, pancreas, pancreatitis, treatment, management]
  - front: "What does the WATERFALL trial (NEJM 2022) conclude about fluid resuscitation in acute pancreatitis?"
    back: "Aggressive fluid resuscitation does NOT improve clinical outcomes compared to moderate resuscitation in acute pancreatitis. Fluid overload developed in 20.5% of aggressively resuscitated patients vs. 6.3% with moderate resuscitation (RR 2.85, P=0.004), with no significant difference in moderately severe or severe pancreatitis development.\n\nThis landmark trial changed the management approach — moderate (not aggressive) IV fluid resuscitation is now recommended in acute pancreatitis to avoid fluid overload complications including pulmonary edema and abdominal compartment syndrome."
    difficulty: medium
    tags: [gastroenterology, pancreas, pancreatitis, WATERFALL-trial, fluid-resuscitation]
  - front: "What are the late complications of acute pancreatitis, and how are they managed?"
    back: "Late complications (>2 weeks): (1) Pseudocysts — follow if asymptomatic; drain if symptomatic or growing (endoscopic > percutaneous > surgical); (2) Infected necrosis/abscesses — ABx + endoscopic/percutaneous drainage preferred over surgery; (3) Bleeding — from gastric varices (splenic vein thrombosis), pseudoaneurysm (especially splenic artery), or duodenal compression; (4) Splenic/portal vein thrombosis — no proven therapy; (5) Rare: DM, pancreatic duct damage.\n\nThe endoscopic transgastric vs. surgical necrosectomy trial showed endoscopic approach reduces major complications (especially new-onset organ failure) compared to surgical necrosectomy. Draining infected necrosis should be delayed >2 weeks to allow adequate encapsulation (walled-off necrosis)."
    difficulty: medium
    tags: [gastroenterology, pancreas, pancreatitis, complications, pseudocyst]
  - front: "What is chronic pancreatitis? What is the most common etiology and what are the late-stage manifestations?"
    back: "Chronic pancreatitis is irreversible damage to the pancreas characterized by: (1) pancreatic cell loss from necrosis, (2) inflammation, and (3) fibrosis. Most common cause: Ethanol (causes >90% of chronic pancreatitis). Late-stage manifestations (when >90% of function lost): steatorrhea (maldigestion), diabetes, calcification, jaundice, weight loss, pseudocyst, ascites, GI bleed, chronic pain.\n\nEtOH causes chronic pancreatitis by changing pancreatic secretion composition (increasing viscosity), decreasing lithostathine (which normally solubilizes calcium — leading to duct calcification), direct toxic effects on acinar cells, and stimulating stellate cells to form collagen (fibrosis). Only a minority of people with alcohol use disorder develop pancreatitis."
    difficulty: easy
    tags: [gastroenterology, pancreas, chronic-pancreatitis, etiology, complications]
  - front: "How is chronic pancreatitis investigated? What is the most sensitive test for parenchymal abnormalities?"
    back: "Investigations: Lab: elevated fasting glucose, elevated ALP (less commonly bilirubin), serum amylase/lipase usually NORMAL in chronic pancreatitis, low fecal elastase (in steatorrhea). Imaging: Abdominal X-ray: pancreatic calcifications. U/S or CT: calcification, dilated ducts, pseudocyst. MRCP: duct narrowing and dilatation. EUS: most sensitive test for parenchymal and ductal abnormalities. Functional tests: 72-hour fecal fat (fecal elastase preferable); secretin test is gold standard but difficult/expensive.\n\nUnlike acute pancreatitis where enzymes are elevated, in chronic pancreatitis the burnt-out pancreas may no longer produce sufficient amylase/lipase to elevate serum levels. EUS is preferred over CT for early detection as it can detect subtle parenchymal changes before CT findings appear."
    difficulty: medium
    tags: [gastroenterology, pancreas, chronic-pancreatitis, investigations, EUS]
  - front: "What is the treatment for chronic pancreatitis, including management of pain and steatorrhea?"
    back: "Pain management: Complete EtOH abstinence; pancreatic enzyme replacement (reduces pain via negative feedback resting pancreas); analgesics; celiac ganglion blocks; pain decreases with time as pancreas 'burns out'. Endoscopy: sphincterotomy, stent if duct dilated, stone removal. Surgery: pancreaticojejunostomy if duct dilated (more effective than endoscopy); pancreatic resection if duct contracted. Steatorrhea: pancreatic enzyme replacement (neither endoscopy nor surgery can restore exocrine function).\n\nPancreatic enzyme replacement therapy (PERT) for steatorrhea replaces the lost exocrine function. The goal of analgesics is stepwise (acetaminophen → NSAIDs → opioids). Celiac ganglion blocks provide temporary pain relief. Pain often decreases as the pancreas is progressively destroyed ('burn-out' phenomenon)."
    difficulty: medium
    tags: [gastroenterology, pancreas, chronic-pancreatitis, treatment, steatorrhea]
  - front: "What is autoimmune pancreatitis and how is it diagnosed and treated?"
    back: "Autoimmune pancreatitis most commonly mimics pancreatic cancer (pancreatic mass with jaundice + abdominal pain). Diagnosis: Histology — lymphocyte and plasma cell infiltration; Imaging — focal or diffuse pancreatic enlargement (sausage-shaped, low-density rim); Serology — elevated IgG4 (Type 1); Other organ involvement — sialadenitis, retroperitoneal fibrosis, biliary duct narrowing, nephritis. Treatment: Responds to prednisone. Refractory: immunomodulators (azathioprine, mycophenolate mofetil, methotrexate) or rituximab.\n\nAutoimmune pancreatitis (AIP) is critical to recognize because it mimics pancreatic cancer but is steroid-responsive, thus avoiding unnecessary pancreatic surgery. IgG4-related disease can affect multiple organs. The 'sausage-shaped' pancreas on imaging is a classic description. Type 2 AIP is IgG4-negative and more associated with IBD."
    difficulty: medium
    tags: [gastroenterology, pancreas, autoimmune-pancreatitis, IgG4, diagnosis]
  - front: "What is the Subjective Global Assessment (SGA) and how does it classify nutritional status?"
    back: "SGA divides nutritional status into: A = Adequately nourished (no nutritional support needed); B = Mild or moderate malnutrition (may require nutritional support — risk vs. benefit considered); C = Severe malnutrition (requires nutritional support). Assessment includes: weight change in past 6 months and 2 weeks, dietary intake change, GI symptoms, functional capacity, disease effect on nutritional requirements, and physical exam (subcutaneous fat loss, muscle wasting, edema, ascites).\n\nSGA is a validated clinical tool for nutritional assessment. The most important feature is weight loss expressed as change in BMI. Distinguishing markers of malnutrition from markers of disease (e.g., low albumin from liver disease vs. malnutrition) is clinically challenging."
    difficulty: easy
    tags: [gastroenterology, nutrition, SGA, malnutrition, assessment]
  - front: "What are the indications for aggressive nutritional support with evidence of outcome improvement?"
    back: "Evidence supports nutritional support for: (1) Short bowel syndrome (home TPN); (2) Before major abdominal/thoracic surgery with substantial malnutrition; (3) Before therapy for esophageal, head, and neck cancer; (4) Pancreatitis (acute and chronic); (5) Decompensated alcohol-related liver disease (no survival change, but supportive). For most ICU and acute illness indications, convincing evidence is lacking.\n\nCurrent trend in ICU is 'permissive underfeeding' to prevent hyperglycemia (25-35 kcal/kg, with IV nutrition 60% carbohydrate, 40% fat). Protein requirements are 1-2 g/kg/day; disease increases the proportion of energy derived from protein compared to health."
    difficulty: medium
    tags: [gastroenterology, nutrition, TPN, enteral-nutrition, indications]
  - front: "What are the key differences between enteral nutrition (EN) and parenteral nutrition (PN), and when is each indicated?"
    back: "EN (tube feeding): Preferred whenever possible. Delivered via NG/NJ tube (brief use) or PEG/J-tube (>1 month). Feeds: polymeric (whole protein) or elemental (amino acids/simple sugars). Indicated when oral feeding inadequate or contraindicated. PN (intravenous feeding): Used when GI tract is non-functional. Proven to increase survival: bone marrow transplant, short bowel syndrome; some evidence in gastric cancer. EN is ALWAYS preferable over PN whenever possible — fewer serious complications, better understood nutritional requirements, prevents gut atrophy, less expensive.\n\nCochrane data show EN vs. TPN in pancreatitis reduces mortality RR by 0.50, organ failure by 0.55, and infections by 0.39. EN provides gut-specific fuels (glutamine, short-chain fatty acids), prevents villous atrophy, and stimulates gallbladder motility (prevents gallstones). PN's main complications: sepsis, pneumothorax from line insertion, metabolic complications (hyperglycemia, cholestasis)."
    difficulty: medium
    tags: [gastroenterology, nutrition, enteral-nutrition, TPN, parenteral-nutrition]
  - front: "What are the complications of enteral nutrition (EN), including refeeding syndrome?"
    back: "EN complications: Aspiration; Diarrhea; Refeeding syndrome (rare): carbohydrate stimulates insulin → cellular uptake → low serum phosphate, magnesium, and potassium; Overfeeding syndrome (rare): hypertonic dehydration, hyperglycemia, hypercapnia, azotemia (from excess protein). Relative contraindications: non-functioning gut (obstruction, fistulae), uncontrolled diarrhea, GI bleeding.\n\nRefeeding syndrome is a potentially fatal complication of rapid refeeding in severely malnourished patients. The electrolyte shifts (hypophosphatemia, hypomagnesemia, hypokalemia) can cause arrhythmias, respiratory failure, and seizures. It is prevented by starting feeds slowly and correcting electrolytes."
    difficulty: medium
    tags: [gastroenterology, nutrition, enteral-nutrition, refeeding-syndrome, complications]
  - front: "What are the indications for long-term parenteral nutrition (>1 month)?"
    back: "Long-term PN indications: (1) Severe untreatable small bowel disease (e.g., radiation enteritis, extensive Crohn's disease, high-output fistulae); (2) Surgical resection of >70% of small bowel (e.g., small bowel infarction); (3) Severe motility diseases (e.g., scleroderma affecting bowel). Relative contraindications: functional GI tract (use EN instead), active infection without antibiotic coverage, inadequate venous access.\n\nShort bowel syndrome (>70% resection) is the classic indication for home TPN. Hypomagnesemia may be an early sign of short bowel syndrome after surgical resection. In IBD, PN closes fistulae and heals acute mucosal inflammation, but the effect is transient and EN is equally effective."
    difficulty: medium
    tags: [gastroenterology, nutrition, TPN, parenteral-nutrition, short-bowel-syndrome]
  - front: "What is the mechanism, indications, and key side effects of Proton Pump Inhibitors (PPIs)?"
    back: "Mechanism: Inhibit H+/K+-ATPase (proton pump) in gastric parietal cells. Indications: Duodenal/gastric ulcer, NSAID-associated ulcers, reflux esophagitis, GERD, dyspepsia, Zollinger-Ellison syndrome, H. pylori eradication (combined with antibiotics). Examples: omeprazole (Losec), lansoprazole (Prevacid), pantoprazole (Pantoloc), rabeprazole (Pariet), esomeprazole (Nexium). Side effects: Dizziness, headache, flatulence, nausea, rash, increased risk of osteoporotic fractures (secondary to impaired calcium absorption).\n\nPPIs are irreversible inhibitors of the proton pump. For acute UGIB, IV pantoprazole is given as 80 mg bolus then 8 mg/h infusion. Long-term PPI use is associated with hypomagnesemia, C. difficile infection, and reduced absorption of vitamin B12, calcium, and iron."
    difficulty: easy
    tags: [gastroenterology, pharmacology, PPI, acid-suppression, GERD]
  - front: "What are the gastrointestinal medications for constipation and their mechanisms? Distinguish between osmotic, stimulant, and bulk laxatives."
    back: "Osmotic laxatives: Lactulose (poorly absorbed, broken down to lactic acid in colon — lowers pH, increases osmotic pull; used for hepatic encephalopathy); PEG 3350 (Lax-a-day — osmotic water retention); Magnesium hydroxide (osmotic fluid retention distending colon). Stimulant laxatives: Senna (induces peristalsis in lower colon); Bisacodyl (enteric nerve stimulation + secretory effects). Bulk laxatives: Psyllium (Metamucil — increases stool bulk + water retention). Guanylate cyclase-C agonists: Linaclotide and plecanatide (open water channels in bowel epithelial cells; also reduce abdominal pain via colonic nociceptor inhibition — used for chronic constipation and IBS-C).\n\nLactulose is specifically used for hepatic encephalopathy (lowers colonic pH traps ammonia as NH4+ preventing absorption). NHE3 inhibitor tenapanor (Ibsrela) is used for IBS-C by reducing sodium absorption from small intestine/colon, increasing luminal water secretion."
    difficulty: medium
    tags: [gastroenterology, pharmacology, laxatives, constipation, IBS]
  - front: "What is the mechanism of action, indications, and key contraindications of loperamide (Imodium)?"
    back: "Mechanism: Antidiarrheal via cholinergic, non-cholinergic, opiate, and non-opiate receptor-mediated mechanisms; decreases myenteric plexus activity. Indications: Adjunctive therapy for acute nonspecific diarrhea, chronic diarrhea in IBD, reducing ileostomy/colostomy output. Contraindications: Children <2 years, acute dysentery (bloody stools with fever), acute UC, pseudomembranous colitis associated with broad-spectrum antibiotics. Side effects: Abdominal pain, drowsiness/dizziness, dry mouth, N/V, hypersensitivity.\n\nLoperamide is contraindicated in infectious/inflammatory diarrhea because slowing motility can worsen toxin-mediated colitis (e.g., C. difficile, EHEC). Eluxadoline (Viberzi), a bowel opioid modulator, is used for IBS-diarrhea but is contraindicated in pancreatic disease, excess alcohol use, gallstones, and sphincter of Oddi dysfunction."
    difficulty: medium
    tags: [gastroenterology, pharmacology, antidiarrheal, loperamide, IBD]
  - front: "What are the antiemetic medications used in gastroenterology? Compare dimenhydrinate, prochlorperazine, metoclopramide, and ondansetron."
    back: "Dimenhydrinate (Gravol): Competitive H1 receptor antagonist; blocks chemoreceptor trigger zone, vestibular function. Used for motion sickness, radiation sickness, postoperative N/V. Prochlorperazine (Stemetil): D1/D2 receptor antagonist + alpha-adrenergic/anticholinergic. Used for postoperative N/V, anxiety. SE: dystonia, EPS, NMS. Metoclopramide (Maxeran): Dopamine + 5-HT receptor antagonist in chemoreceptor trigger zone + enhances ACh response in upper GI (promotes motility, increases LES tone). Used for GERD, gastroparesis, N/V, migraines. SE: restlessness, EPS, NMS. Ondansetron (Zofran): Selective 5-HT3 receptor antagonist centrally and peripherally on vagus nerve. Used for chemo/radiation-induced N/V. SE: constipation, cardiac dysrhythmia.\n\nMetoclopramide is unique in that it both suppresses nausea centrally AND enhances gastric motility. It is useful in diabetic gastroparesis but is contraindicated in GI obstruction/perforation and pheochromocytoma. Domperidone (Motilium) is a peripherally acting D2 blocker (less CNS penetration) used for gastroparesis but risks cardiac arrhythmia."
    difficulty: medium
    tags: [gastroenterology, pharmacology, antiemetics, metoclopramide, ondansetron]
  - front: "What are mesalamine (5-ASA) compounds and when are they used in IBD?"
    back: "Mesalamine (Pentasa, Asacol, Salofalk) and sulfasalazine (Salazopyrin) are 5-aminosalicylic acid (5-ASA) agents. Mechanism: Block arachidonic acid metabolism (prostaglandins and leukotrienes), reducing mucosal inflammation. Indications: Mild to moderate UC (induction and maintenance); also available as suppositories/enemas for topical therapy. Sulfasalazine dose: 3-4 g/day. Side effects: Mesalamine — abdominal pain, arthralgia, headache. Sulfasalazine — rash, N/V, headache, reversible oligospermia.\n\n5-ASAs are first-line for mild-moderate UC but are less effective in Crohn's disease. Sulfasalazine is a prodrug (5-ASA bound to sulfapyridine carrier) cleaved by colonic bacteria. Asacol contains phthalate which has potential urogenital teratogenicity for male fetuses. Topical 5-ASA (enema/suppository) is more effective than oral for distal UC."
    difficulty: medium
    tags: [gastroenterology, pharmacology, mesalamine, 5-ASA, UC, IBD]
  - front: "What are the anti-TNF biologics used in IBD? Compare infliximab, adalimumab, and vedolizumab."
    back: "Infliximab (Remicade): Monoclonal antibody to TNF-alpha; IV infusion; for severe/steroid-refractory CD and UC; drug of choice for perianal disease. Adalimumab (Humira): Monoclonal antibody to TNF-alpha; SC injection; for severe/steroid-refractory CD or poor infliximab response. Vedolizumab (Entyvio): Monoclonal antibody to alpha4-beta7 integrin (gut-selective); IV; for medically refractory CD/UC including failure of other TNF-alpha inhibitors. Key risks (all anti-TNFs): reactivated TB, PCP, lymphoma, serious infections.\n\nThe VARSITY trial showed vedolizumab was superior to adalimumab for clinical remission in UC (31.3% vs. 22.5% at week 52) but not for steroid-free remission. The SONIC trial showed infliximab + azathioprine combination had best steroid-free remission (56.8%) vs. infliximab alone (44.4%) vs. azathioprine alone (30%) in CD."
    difficulty: medium
    tags: [gastroenterology, pharmacology, biologics, anti-TNF, infliximab, IBD]
  - front: "What is ustekinumab's mechanism of action and evidence for use in IBD?"
    back: "Ustekinumab (Stelara): Monoclonal antibody to IL-12 and IL-23 (specifically the p40 subunit shared by both). Induction: single IV weight-based dose; Maintenance: 90 mg SC every 8 weeks. Used for moderate-to-severe CD and UC. The UNIFI trial showed ustekinumab achieved clinical remission in 15.6% vs. 5.3% placebo in moderate-severe UC (P<0.001). Side effects: infections, headaches, joint pain, fever, N/V, Posterior Reversible Encephalopathy Syndrome (PRES). Risankizumab (Skyrizi) targets the p19 subunit of IL-23 specifically.\n\nIL-12 drives Th1 differentiation (important in CD); IL-23 drives Th17 responses (important in both CD and UC). By targeting the shared p40 subunit, ustekinumab blocks both pathways. It is an option for patients who failed anti-TNF therapy and is generally well-tolerated."
    difficulty: hard
    tags: [gastroenterology, pharmacology, biologics, ustekinumab, IL-12, IL-23, IBD]
  - front: "What is rifaximin, and what are its indications in gastroenterology?"
    back: "Rifaximin (Xifaxan): Non-absorbable antibiotic that affects dysbiosis of the gut microbiome. Dose: 550 mg BID. Indications: (1) Hepatic encephalopathy (maintenance of remission); (2) IBS-diarrhea; (3) Traveller's diarrhea. The rifaximin trial in hepatic encephalopathy (NEJM 2010) showed it reduced risk of HE episode (HR 0.42), with breakthrough episodes in 22.1% vs. 45.9% placebo.\n\nRifaximin works locally in the gut without systemic absorption, making it useful for gut-related conditions with minimal systemic side effects. In hepatic encephalopathy, it reduces ammonia-producing gut bacteria. It is often used in combination with lactulose for optimal HE prevention."
    difficulty: medium
    tags: [gastroenterology, pharmacology, rifaximin, hepatic-encephalopathy, IBS]
  - front: "What does the SONIC trial conclude about treatment of Crohn's disease?"
    back: "The SONIC trial (NEJM 2010) compared infliximab + azathioprine combination vs. infliximab monotherapy vs. azathioprine monotherapy in biologic/immunosuppressive-naive CD patients. Results: Steroid-free remission at week 26: combination 56.8% > infliximab alone 44.4% > azathioprine alone 30% (P<0.001 for combination vs. azathioprine; P=0.06 for combination vs. infliximab). Conclusion: Combination infliximab + azathioprine achieves better steroid-free remission than either agent alone.\n\nThe mechanism behind combination superiority is likely that azathioprine reduces anti-infliximab antibody formation (immunogenicity), maintaining higher infliximab serum levels and prolonged efficacy. This trial established combination therapy as superior for moderate-to-severe CD."
    difficulty: hard
    tags: [gastroenterology, IBD, Crohns, SONIC-trial, infliximab, azathioprine]
  - front: "What does the VARSITY trial conclude about treatment of moderate-to-severe Ulcerative Colitis?"
    back: "VARSITY trial (NEJM 2019): Vedolizumab vs. adalimumab in moderate-severe UC. At week 52: Clinical remission: vedolizumab 31.3% vs. adalimumab 22.5% (P=0.006) — vedolizumab superior. Endoscopic improvement: vedolizumab superior. Steroid-free remission: adalimumab 21.8% vs. vedolizumab 12.6% — NOT significant difference. Conclusion: Vedolizumab superior to adalimumab for clinical remission and endoscopic improvement in UC, but NOT for steroid-free clinical remission.\n\nVedolizumab's gut-selective mechanism (anti-alpha4-beta7 integrin, blocking lymphocyte migration specifically to gut) may explain its advantage in a mucosal disease like UC. The finding that adalimumab had higher steroid-free remission rates despite lower overall remission rates is a nuanced finding from this trial."
    difficulty: hard
    tags: [gastroenterology, IBD, UC, VARSITY-trial, vedolizumab, adalimumab]
  - front: "A 50-year-old woman presents with pruritus, fatigue, and elevated ALP with jaundice. What antibody confirms Primary Biliary Cholangitis, and what is the first-line treatment?"
    back: "Anti-mitochondrial antibodies (AMA) — 95% sensitivity and specificity for PBC. ALP elevated >6 months + positive AMA is sufficient for diagnosis; liver biopsy usually not required. First-line treatment: Ursodeoxycholic acid (UDCA). If inadequate response: add obeticholic acid. Pruritus: cholestyramine. Monitor with LFTs every 3-6 months, TSH annually, and bone mineral density every 2-4 years.\n\nMiddle-aged women with pruritus and elevated ALP should immediately trigger PBC on the differential. The absence of duct narrowing on MRCP distinguishes PBC from PSC. UDCA slows disease progression and, when ALP normalizes, achieves survival comparable to age- and sex-matched controls."
    difficulty: medium
    tags: [gastroenterology, liver, biliary, PBC, AMA, UDCA, clinical-scenario]
  - front: "A patient with acute pancreatitis develops fever, leukocytosis, and worsening abdominal pain at 3 weeks. CT shows necrotic areas. What is the most appropriate next step?"
    back: "CT-guided percutaneous biopsy/aspiration of the necrotic areas to differentiate sterile from infected necrosis. If infected (FNA positive): proceed with drainage/debridement — preferably endoscopic (endoscopic transgastric necrosectomy) or percutaneous; surgical necrosectomy is last resort. Delay intervention >2 weeks to allow walled-off necrosis (WON) to develop — better demarcation between viable and necrotic tissue improves outcomes. Antibiotics alone (e.g., imipenem, cephalosporins) are added for confirmed infection.\n\nThis scenario represents infected necrotizing pancreatitis (walled-off necrosis). The 2010 endoscopic vs. surgical necrosectomy trial showed endoscopic approach reduces major complications, especially new-onset organ failure, compared to surgical necrosectomy. Antibiotics are NOT given prophylactically — only when infection is confirmed."
    difficulty: hard
    tags: [gastroenterology, pancreas, pancreatitis, necrotizing-pancreatitis, management, clinical-scenario]
  - front: "What are the causes of elevated serum amylase that are NOT due to pancreatic disease?"
    back: "Non-pancreatic causes of elevated amylase: Non-pancreatic abdominal: biliary tract disease, bowel obstruction/ischemia, perforated/penetrating ulcer, ruptured ectopic pregnancy, aortic aneurysm, chronic liver disease, peritonitis. Non-abdominal: cancer (lung, ovary, esophagus), salivary gland lesions, bulimia, renal transplant/insufficiency, burns, ketoacidosis, macroamylasemia. NOTE: When serum amylase is >5x normal, cause is almost always pancreatitis OR renal failure.\n\nLipase is more specific than amylase for pancreatic disease. The key pancreatic enzymes tested are: amylase, lipase, and chymotrypsin (mnemonic TALC: Trypsin, Amylase, Lipase, Chymotrypsin). Macroamylasemia (amylase bound to immunoglobulin) causes elevated serum amylase with normal urinary amylase."
    difficulty: medium
    tags: [gastroenterology, pancreas, amylase, lipase, differential-diagnosis]
  - front: "What JAK inhibitors are used in Ulcerative Colitis, and what are their major safety concerns?"
    back: "JAK inhibitors for UC: Tofacitinib (Xeljanz) 5-10 mg BID; Upadacitinib (Rinvoq) 15 mg daily. Contraindications/concerns: TB (screen before use), Hepatitis B (risk of reactivation). Major safety concerns: Serious infections, macro-cardiac events (myocardial infarction, stroke), venous thrombosis (PE, DVT). These risks are dose-dependent and highest in patients with cardiovascular risk factors.\n\nJAK inhibitors are small molecules (not biologics) that block cytokine signaling pathways important in UC pathogenesis. Unlike biologics (which are injected), JAK inhibitors are oral medications. Post-marketing data for tofacitinib raised concerns about cardiovascular events and malignancy, particularly at higher doses."
    difficulty: hard
    tags: [gastroenterology, pharmacology, JAK-inhibitors, tofacitinib, UC, IBD]
  - front: "What are the MELD score findings and its clinical utility based on the landmark gastroenterology trial?"
    back: "MELD Score as Predictor of Death trial (Gastroenterology 2003): MELD score was prospectively applied to 3437 adult liver transplant candidates with chronic liver disease. Results: Waiting list mortality increased directly in proportion to MELD score. ROC curve: MELD = 0.83 vs. Child-Turcotte-Pugh = 0.76 for 3-month mortality prediction. Conclusion: MELD score accurately predicts 3-month mortality in chronic liver failure and should be used for liver transplant allocation.\n\nMELD = 3.78 × ln[bilirubin (mg/dL)] + 11.2 × ln[INR] + 9.57 × ln[creatinine (mg/dL)] + 6.43. Higher MELD = worse prognosis. MELD is superior to Child-Pugh score for short-term mortality prediction and is the current basis for organ allocation in Canada/USA. MELD-Na incorporates sodium for improved accuracy."
    difficulty: medium
    tags: [gastroenterology, liver, MELD-score, liver-transplant, prognosis]
  - front: "What does the FAMOUS trial demonstrate about famotidine in patients taking low-dose aspirin?"
    back: "FAMOUS trial (Lancet 2009): Patients on low-dose aspirin without existing erosions/ulcers were randomized to famotidine 20 mg BID vs. placebo. At 12 weeks: gastric ulcers — famotidine 3.4% vs. placebo 15% (OR 0.20, P=0.0002); duodenal ulcers — 0.5% vs. 8.5% (OR 0.05, P=0.0045). Conclusion: Famotidine (H2 blocker) is effective for preventing gastric and duodenal ulcers, and erosive esophagitis in patients taking low-dose aspirin.\n\nLow-dose aspirin (75-325 mg/day) carries significant GI ulcer risk via COX-1 inhibition reducing gastroprotective prostaglandins. Gastroprotection with H2 blockers or PPIs is recommended for patients on aspirin with risk factors (age >65, prior ulcer, concurrent NSAIDs/anticoagulants). This trial supports H2 blocker use as an alternative to PPIs for aspirin-related GI prophylaxis."
    difficulty: medium
    tags: [gastroenterology, pharmacology, famotidine, H2-blocker, peptic-ulcer, aspirin]
