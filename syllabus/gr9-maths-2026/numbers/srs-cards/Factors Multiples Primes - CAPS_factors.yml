# Gr 9 Maths CAPS — numbers / Factors Multiples Primes
deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
notes:
  - guid: a1f3c9d2e0b4b7a8
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "What is a FACTOR of a number? Give the factors of 12."
      Back: "A factor of a number divides into it exactly (no remainder).\nFactors of 12: 1, 2, 3, 4, 6, 12.\nTip: list them in pairs that multiply to 12 — 1×12, 2×6, 3×4 — so you miss none."
    tags: ["factors-definition", "subject:numbers"]
  - guid: 0b7e4a91c3d6f25a
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "What is a MULTIPLE of a number? Give the first five multiples of 6."
      Back: "A multiple is the answer when you multiply a number by 1, 2, 3, ...\nFirst five multiples of 6: 6, 12, 18, 24, 30.\nEvery number has infinitely many multiples but a finite number of factors."
    tags: ["multiples-definition", "subject:numbers"]
  - guid: 9c2d5e8f1a4b7c30
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "What is a PRIME number? List all primes below 20."
      Back: "A prime number has exactly TWO different factors: 1 and itself.\nPrimes below 20: 2, 3, 5, 7, 11, 13, 17, 19.\nNote: 2 is the only even prime."
    tags: ["prime-numbers", "subject:numbers"]
  - guid: 3e6f9a2c5d8b1e47
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "What is a COMPOSITE number? Is 1 composite?"
      Back: "A composite number has MORE than two factors (it has factors besides 1 and itself).\nExample: 15 has factors 1, 3, 5, 15 → composite.\n1 is NOT composite (and not prime) — it has only one factor, itself."
    tags: ["composite-numbers", "subject:numbers"]
  - guid: 7a1c4e7b0d3f6928
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Why is 1 NOT a prime number?"
      Back: "A prime must have EXACTLY two DIFFERENT factors.\n1 has only one factor (itself), so it fails this rule.\n∴ 1 is neither prime nor composite — it is a special case. (This also keeps prime factorisation unique.)"
    tags: ["prime-numbers", "subject:numbers"]
  - guid: 2d5f8b1e4a7c0936
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Prime factorise 360 using the LADDER (division) method. Give exponent form."
      Back: "Divide by smallest primes, top to bottom:\n2 | 360\n2 | 180\n2 | 90\n3 | 45\n3 | 15\n5 | 5\n   | 1\nPrimes used: 2, 2, 2, 3, 3, 5.\n∴ 360 = 2³ × 3² × 5"
    tags: ["prime-factorisation", "subject:numbers"]
  - guid: 5b8e1a4d7c0f3692
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Prime factorise 84 using a FACTOR TREE. Give exponent form."
      Back: "Split into any two factors, keep splitting until all branches are prime:\n84 = 4 × 21\n4 = 2 × 2 ; 21 = 3 × 7\nPrime leaves: 2, 2, 3, 7.\n∴ 84 = 2² × 3 × 7\nWhichever first split you choose, the prime factors are always the same."
    tags: ["prime-factorisation", "subject:numbers"]
  - guid: 8e1b4a7d0c3f6925
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Always start the ladder/division method with which prime? Why?"
      Back: "Start with the SMALLEST prime that divides the number (try 2, then 3, then 5, 7, ...).\nKeep dividing by the same prime while it still goes in, then move up.\nThis gives the prime factors neatly in order and avoids missing any."
    tags: ["prime-factorisation", "subject:numbers"]
  - guid: 1c4f7a0d3e6b9258
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Divisibility rule for 2 and for 5."
      Back: "÷2: the number is EVEN — last digit is 0, 2, 4, 6 or 8.\n÷5: last digit is 0 or 5.\nExample: 130 ends in 0 → divisible by both 2 and 5."
    tags: ["divisibility-rules", "subject:numbers"]
  - guid: 4f7a0d3c6e9b2581
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Divisibility rule for 10."
      Back: "÷10: the last digit is 0.\nExample: 470 ends in 0 → divisible by 10.\n(A number divisible by 10 is automatically divisible by both 2 and 5.)"
    tags: ["divisibility-rules", "subject:numbers"]
  - guid: 7d0a3c6f9e2b5814
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Divisibility rule for 3 and for 9."
      Back: "÷3: the SUM of the digits is divisible by 3.\n÷9: the SUM of the digits is divisible by 9.\nExample: 738 → 7+3+8 = 18. 18 ÷ 3 = 6 ✓ and 18 ÷ 9 = 2 ✓, so 738 is divisible by both 3 and 9."
    tags: ["divisibility-rules", "subject:numbers"]
  - guid: 0a3d6c9f2e5b8147
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Divisibility rule for 4."
      Back: "÷4: the number formed by the LAST TWO digits is divisible by 4.\nExample: 1 316 → last two digits 16; 16 ÷ 4 = 4 ✓ → 1 316 is divisible by 4.\nCounter: 1 322 → 22 ÷ 4 leaves a remainder, so not divisible by 4."
    tags: ["divisibility-rules", "subject:numbers"]
  - guid: 3d6a9c2f5e8b1470
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Divisibility rule for 8."
      Back: "÷8: the number formed by the LAST THREE digits is divisible by 8.\nExample: 5 120 → last three digits 120; 120 ÷ 8 = 15 ✓ → divisible by 8.\nFor smaller numbers just check if 8 divides the whole number."
    tags: ["divisibility-rules", "subject:numbers"]
  - guid: 6a9d2c5f8e1b4703
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Divisibility rule for 6."
      Back: "÷6: the number must be divisible by BOTH 2 AND 3.\nSo: it is even AND its digit sum is divisible by 3.\nExample: 522 → even ✓; 5+2+2 = 9, divisible by 3 ✓ → 522 is divisible by 6."
    tags: ["divisibility-rules", "subject:numbers"]
  - guid: 9d2a5c8f1e4b7036
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Divisibility rule for 11."
      Back: "÷11: find the difference between the sum of digits in odd positions and the sum in even positions; if it is 0 or a multiple of 11, the number is divisible by 11.\nExample: 2 783 → (2+8) − (7+3) = 10 − 10 = 0 ✓ → divisible by 11.\n(2 783 = 11 × 253.)"
    tags: ["divisibility-rules", "subject:numbers"]
  - guid: 2a5d8c1f4e7b0369
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "How do you find the HCF using prime factors? State the rule."
      Back: "HCF = product of the COMMON primes, each to its LOWEST power.\nSteps: prime factorise each number, find primes appearing in EVERY number, take the smallest exponent of each, multiply.\nIf there is no common prime, the HCF is 1."
    tags: ["hcf", "subject:numbers"]
  - guid: 5d8a1c4f7e0b3692
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Find the HCF of 72 and 120 using prime factors."
      Back: "72 = 2³ × 3²\n120 = 2³ × 3 × 5\nCommon primes: 2 and 3.\nLowest powers: 2³ and 3¹.\nHCF = 2³ × 3 = 8 × 3 = 24"
    tags: ["hcf", "subject:numbers"]
  - guid: 8a1d4c7f0e3b6925
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "How do you find the LCM using prime factors? State the rule."
      Back: "LCM = product of ALL primes that appear in ANY number, each to its HIGHEST power.\nSteps: prime factorise each number, list every prime that occurs, take the largest exponent of each, multiply.\nThe LCM is always ≥ the largest number."
    tags: ["lcm", "subject:numbers"]
  - guid: 1d4a7c0f3e6b9258
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Find the LCM of 72 and 120 using prime factors."
      Back: "72 = 2³ × 3²\n120 = 2³ × 3 × 5\nAll primes: 2, 3, 5.\nHighest powers: 2³, 3², 5¹.\nLCM = 2³ × 3² × 5 = 8 × 9 × 5 = 360"
    tags: ["lcm", "subject:numbers"]
  - guid: 4d7a0c3f6e9b2581
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Common mistake: students swap HCF and LCM. How do you remember which power to use?"
      Back: "HCF — Highest COMMON Factor → only COMMON primes, LOWEST powers (the answer is SMALL).\nLCM — Lowest COMMON Multiple → ALL primes, HIGHEST powers (the answer is BIG).\nCheck: HCF ≤ each number ≤ LCM."
    tags: ["hcf", "subject:numbers"]
  - guid: 7d0a3c6f9e2b5810
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Useful shortcut linking HCF and LCM of two numbers a and b."
      Back: "For any two numbers: HCF × LCM = a × b.\nCheck with 72 and 120: HCF × LCM = 24 × 360 = 8 640, and 72 × 120 = 8 640 ✓\nThis lets you find the LCM quickly once you know the HCF: LCM = (a × b) ÷ HCF."
    tags: ["hcf", "subject:numbers"]
  - guid: 0d3a6c9f2e5b8174
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "WORD PROBLEM: Two lighthouses flash every 72 s and every 120 s. They flash together now. After how many seconds do they next flash together?"
      Back: "\"Together again\" → use the LCM.\n72 = 2³ × 3², 120 = 2³ × 3 × 5.\nLCM = 2³ × 3² × 5 = 360.\n∴ They flash together again after 360 seconds (6 minutes)."
    tags: ["lcm", "subject:numbers"]
  - guid: 3d6a9c2f5e8b1407
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "WORD PROBLEM: 48 pencils and 36 erasers are packed into identical bags with none left over. What is the greatest number of bags? How many of each per bag?"
      Back: "\"Greatest number of equal groups\" → use the HCF.\n48 = 2⁴ × 3, 36 = 2² × 3².\nCommon primes lowest powers: 2² × 3 = 12.\n∴ 12 bags, each with 48÷12 = 4 pencils and 36÷12 = 3 erasers."
    tags: ["hcf", "subject:numbers"]
  - guid: 6d9a2c5f8e1b4730
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Factors Multiples Primes"
    fields:
      Front: "Is 1 a factor and a multiple of every number? Is every number a factor and multiple of itself?"
      Back: "Yes: 1 is a factor of every whole number (1 divides everything).\nEvery number is a multiple of 1.\nEvery number is both a factor and a multiple of itself (e.g. 7 is a factor of 7 and a multiple of 7).\n0 is a multiple of every number but factors are usually taken as positive whole numbers."
    tags: ["factors-definition", "subject:numbers"]
