# Nephrology Systemic (Nephrology) - generated from srs-mccqe1
cards:
  - front: "How does multiple myeloma cause renal damage?"
    back: "Multiple mechanisms: 1. Light chain cast nephropathy ('myeloma kidney') — large tubular casts (light chains + Tamm-Horsfall protein). 2. Hypercalcemia. 3. Hyperuricemia. 4. Infection. 5. AL amyloidosis (proteinuria ± nephrotic syndrome). 6. Monoclonal Ig deposition disease (nodular glomerulosclerosis similar to DN, or MPGN). 7. Diffuse tubular obstruction.\n\nBence-Jones proteins (monoclonal light chains) are filtered at the glomerulus but NOT detected on standard urine dipstick — they require urine protein immunoelectrophoresis. Light chain cast nephropathy can progress rapidly to kidney failure. Myeloma patients are poor candidates for kidney transplantation."
    difficulty: medium
    tags: [nephrology, multiple myeloma, Bence-Jones, light chain, cast nephropathy, amyloidosis]
  - front: "Why can Bence-Jones proteinuria be missed on urine dipstick?"
    back: "Urine dipstick detects albumin, not light chains (Bence-Jones proteins). Monoclonal light chains must be detected by urine protein immunoelectrophoresis or urine protein electrophoresis.\n\nThis is a classic MCCQE1 trap: a multiple myeloma patient may have heavy proteinuria from light chains that is completely missed on dipstick, which only reacts with albumin. Serum protein electrophoresis (SPEP) and urine protein electrophoresis (UPEP) with immunofixation are the appropriate investigations."
    difficulty: easy
    tags: [nephrology, multiple myeloma, Bence-Jones, urine dipstick, proteinuria, immunoelectrophoresis]
  - front: "What renal manifestations are associated with tumour lysis syndrome?"
    back: "Hyperuricemia → diffuse tubular obstruction, AKI; hyperkalemia; hyperphosphatemia; hypocalcemia; elevated LDH; lactic acidosis.\n\nTumour lysis syndrome occurs when massive cell death (spontaneous or treatment-induced) releases intracellular contents. Uric acid and calcium-phosphate crystals precipitate in renal tubules causing AKI. Prevention includes aggressive IV hydration and allopurinol/rasburicase prior to chemotherapy."
    difficulty: medium
    tags: [nephrology, tumour lysis syndrome, hyperuricemia, AKI, hyperkalemia, malignancy]
