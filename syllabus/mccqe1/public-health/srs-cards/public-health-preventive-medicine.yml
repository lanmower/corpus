# Public Health Preventive Medicine (PublicHealth) - generated from srs-mccqe1
cards:
  - front: "What is the purpose of a Pareto Chart in quality systems analysis?"
    back: "A Pareto Chart is an x vs. y chart where the x-axis lists defect categories and the y-axis shows frequency, with cumulative frequency plotted on the right y-axis. Its purpose is to highlight the most important factors among a large set contributing to defects or poor quality (80/20 principle).\n\nPareto Charts are a classic quality improvement tool used in health care settings to identify which problems to address first. By visually displaying which defect categories account for the largest proportion of total defects, teams can prioritize interventions where they will have the greatest impact."
    difficulty: easy
    tags: [quality improvement, systems analysis, public health administration, Pareto chart]
  - front: "What is an Ishikawa (Fishbone) Diagram and what is it used for?"
    back: "An Ishikawa (Fishbone) Diagram is a systems analysis tool that identifies generic categories of problems (e.g., lack of time, lack of training, equipment, environment, staff, procedures) that contribute to an overall effect or outcome, such as nosocomial infections. It is used to visually map root causes of a quality problem.\n\nThe Ishikawa diagram gets its name from its fish-bone shape. In Canadian health care quality improvement, it is used alongside tools like the 5 Whys, Defect Check Sheets, and Pareto Charts as part of Total Quality Management frameworks to identify and remove system-level barriers to quality care."
    difficulty: easy
    tags: [quality improvement, Ishikawa diagram, fishbone diagram, systems analysis]
  - front: "What are the four phases of the PDSA Planning Cycle?"
    back: "Plan, Do, Study, Act.\n\nThe PDSA cycle is a widely used quality improvement framework in Canadian health systems. It is iterative: first Plan a change, Do (implement) it on a small scale, Study (measure and analyze) the results, then Act (adopt, adapt, or abandon) based on findings. It is often used alongside APIE and the Precede-Proceed Model for health program planning."
    difficulty: easy
    tags: [PDSA, quality improvement, planning cycle]
  - front: "What are the two phases and eight steps of the Precede-Proceed Model?"
    back: "PRECEDE (phases 1-4): Phase 1 – Identify the ultimate desired result; Phase 2 – Identify health issues and their behavioural/environmental determinants; Phase 3 – Identify predisposing, enabling, and reinforcing factors; Phase 4 – Identify administrative and policy factors. PROCEED (phases 5-8): Phase 5 – Implementation; Phase 6 – Process evaluation; Phase 7 – Impact evaluation; Phase 8 – Outcome evaluation.\n\nThe Precede-Proceed Model is a comprehensive tool for designing, implementing, and evaluating health interventions or programs. PRECEDE guides the diagnostic phase while PROCEED guides the implementation and evaluation phases. It is commonly referenced in Canadian public health program planning and the MCCQE1."
    difficulty: medium
    tags: [Precede-Proceed model, health program planning, evaluation]
  - front: "What is the Incremental Cost-Effectiveness Ratio (ICER) and how is it calculated?"
    back: "The ICER shows the extra cost of the more expensive intervention compared to the cheaper intervention divided by the difference in health outcome. ICER = (Cost of intervention A – Cost of intervention B) / (Health outcome A – Health outcome B). The denominator is expressed in natural (health) units such as years of life gained or clinical events avoided.\n\nICER is the key metric in Cost-Effectiveness Analysis (CEA). It quantifies how much more must be spent per unit of additional health benefit gained by the more expensive option. Health technology assessment bodies in Canada (e.g., CADTH) use the ICER to inform drug coverage decisions, with a common threshold around $50,000–$100,000 per QALY."
    difficulty: medium
    tags: [health economics, ICER, cost-effectiveness analysis, CEA]
  - front: "What distinguishes Cost-Utility Analysis (CUA) from Cost-Effectiveness Analysis (CEA)?"
    back: "CUA is a special case of CEA where the health outcome (benefit) is expressed as a utility-weighted measure that reflects patient preferences, most commonly Quality-Adjusted Life Years (QALYs). In CEA, the denominator is expressed in natural health units (e.g., lives saved, cases avoided).\n\nCUA allows comparison across different disease areas by converting all outcomes to a common utility-based measure (QALY). This is the preferred method for health technology assessment in Canada. By contrast, CEA is condition-specific and uses single clinical outcomes as the denominator."
    difficulty: medium
    tags: [health economics, CUA, CEA, QALY, cost utility analysis]
  - front: "Define: Outbreak, Endemic, Epidemic, and Pandemic."
    back: "Outbreak: incidence of new cases beyond the usual frequency of disease in a population in a given time. Endemic: consistent existence of an infectious agent or disease in a given population or area. Epidemic: a sudden increase in cases above what is usually expected in a community or region. Pandemic: an epidemic that has spread across international or intercontinental boundaries affecting a large number of people (e.g., COVID-19).\n\nThese definitions are foundational for MCCQE1. Knowing the distinctions helps apply the correct response framework. SARS is the classic Canadian epidemic example; COVID-19 is the most recent pandemic. The Public Health Agency of Canada (PHAC) coordinates the national response to epidemics and pandemics."
    difficulty: easy
    tags: [outbreak, epidemic, pandemic, endemic, communicable disease]
  - front: "How is the Attack Rate calculated and what does it measure?"
    back: "Attack Rate = [(# of new cases of disease) / (initial population size)] × 100%. It measures the proportion of an initially disease-free population that develops the disease over a specified time period.\n\nThe attack rate is used during outbreak investigations to quantify how widespread illness is within an exposed group. It is particularly useful in point-source outbreaks (e.g., a contaminated meal at a restaurant). The Secondary Attack Rate measures spread from primary to susceptible contacts during the incubation period."
    difficulty: easy
    tags: [attack rate, outbreak investigation, epidemiology, communicable disease]
  - front: "How is the Secondary Attack Rate (SAR) calculated and what does it measure?"
    back: "SAR = [(total # of cases – initial # of cases) / (# of susceptible individuals – initial # of cases)] × 100%. It measures the proportion of susceptible contacts who develop disease after exposure to primary cases during the incubation period; it is a measure of infectiousness.\n\nThe SAR reflects how easily a pathogen spreads from an infected person to susceptible household or close contacts. High SAR values indicate highly transmissible pathogens. It differs from the Basic Reproduction Number (R0) in that R0 applies to a fully susceptible population under no control measures."
    difficulty: medium
    tags: [secondary attack rate, SAR, infectiousness, epidemiology]
  - front: "What is the Basic Reproduction Number (R0) and what conditions are required for its calculation?"
    back: "R0 is the average number of secondary infections that arise from one infection. It can only be calculated in a fully susceptible population (no immunity, no control measures).\n\nR0 is a key measure of pandemic potential. An R0 >1 means the infection will spread; <1 means it will die out. COVID-19 had an R0 of approximately 2-3 for the original strain. R0 is distinct from the effective reproduction number (Re or Rt), which accounts for immunity and interventions in the real population."
    difficulty: easy
    tags: [R0, basic reproduction number, infectiousness, pandemic]
  - front: "Define Virulence and Case-Fatality Rate (CFR), and provide their formulas."
    back: "Virulence: a measure of an infectious agent's ability to cause significant sickness = (# of cases that are severely ill or died) / (total # of cases). Case-Fatality Rate (CFR): proportion of individuals with the disease who died as a result of the illness during a specified time period = [(# of cases that died) / (total # of cases)] × 100%. CFR must be clearly differentiated from the mortality rate.\n\nVirulence and CFR are both measures of disease severity but have different denominators and interpretations. CFR only counts deaths among confirmed cases, while mortality rate measures deaths in the whole population. High CFR with low transmissibility (e.g., Ebola) differs from low CFR with high transmissibility (e.g., seasonal influenza) in terms of public health impact."
    difficulty: easy
    tags: [virulence, case fatality rate, CFR, epidemiology, outbreak]
  - front: "What are the 10 steps of the outbreak investigation approach?"
    back: "1. Identify investigation team and resources (local, provincial, federal); 2. Establish existence of an outbreak; 3. Verify the diagnosis; 4. Define a case (Person, Place, Time); 5. Find cases systematically and create a line list; 6. Perform descriptive epidemiology and develop hypotheses; 7. Evaluate hypotheses and conduct additional studies; 8. Implement control measures; 9. Communicate findings; 10. Continue surveillance.\n\nThis 10-step approach is the standard framework taught by public health authorities in Canada and used by PHAC, provincial public health units (e.g., Toronto Public Health), and the Ministry of Health. Steps do not always occur strictly in sequence — for example, control measures (step 8) can be implemented at any stage without waiting for full investigation completion."
    difficulty: medium
    tags: [outbreak investigation, 10-step approach, communicable disease control, public health]
  - front: "What study design is preferred in outbreak investigations when all exposed persons can be identified versus when they cannot?"
    back: "When all exposed persons can be found: Cohort study. When not all exposed persons can be found: Case-control study.\n\nIn outbreak investigations, the choice of analytical study design depends on the feasibility of enumerating the entire exposed population. Cohort studies provide direct relative risk estimates. Case-control studies are more practical for large, diffuse outbreaks where the full exposed cohort cannot be identified."
    difficulty: easy
    tags: [outbreak investigation, cohort study, case-control study, epidemiology]
  - front: "Differentiate a point source epidemic curve from a propagated source epidemic curve."
    back: "Point source: all cases are exposed at the same time/place; epidemic curve shows a sharp rise then fall within one incubation period. Propagated (person-to-person): successive waves of cases, each separated by roughly one incubation period; epidemic curve shows a gradual rise with multiple peaks. Continuous source: ongoing exposure produces a plateau pattern on the epidemic curve.\n\nReading epidemic curves is a core skill for MCCQE1. The shape of the curve identifies the mode of transmission and guides control measures. A point source (e.g., contaminated food at a banquet) calls for removing the source; a propagated outbreak (e.g., measles) requires interrupting person-to-person transmission through isolation and vaccination."
    difficulty: medium
    tags: [epidemic curve, outbreak investigation, point source, propagated source]
  - front: "What are the components of Routine Practices in Canadian infection prevention and control (IPAC)?"
    back: "Routine Practices include: (1) risk assessment, (2) hand hygiene, (3) personal protective equipment, (4) environmental controls (cleaning, patient placement, engineering controls), and (5) administrative controls (policies, staff education, compliance monitoring). They are recommended by PHAC for use with ALL patients/clients during ALL care in ALL health care settings.\n\nRoutine Practices are the Canadian equivalent of Universal Precautions. They apply regardless of a patient's known diagnosis and are the first line of defence against transmission of microorganisms in health care settings. Additional Precautions are layered on top for specific pathogens or presentations."
    difficulty: easy
    tags: [IPAC, infection prevention, routine practices, PHAC, hand hygiene]
  - front: "What PPE and room requirements are required for Airborne precautions versus Droplet precautions in Canada?"
    back: "Airborne: N95 mask (fit-tested) + negative pressure room. Examples: TB, measles, varicella. Droplet: facial protection (mask or respirator + eye protection) + single room with dedicated toilet/sink; cohorting may be acceptable. Examples: mumps, whooping cough, meningococcal disease.\n\nThe distinction between droplet and airborne transmission drives PPE and room requirements. Airborne pathogens (particle size <5 µm) require negative pressure rooms and fit-tested N95 respirators to prevent inhalation. Droplet pathogens (>5 µm) fall rapidly and require standard masks and eye protection but not negative pressure rooms."
    difficulty: easy
    tags: [airborne precautions, droplet precautions, N95, IPAC, PPE]
  - front: "What PPE and room requirements are required for Contact precautions? Give two clinical examples."
    back: "Contact precautions require: gloves, gown, dedicated equipment, cleaning and disinfection of shared care items, and a single room with dedicated toilet and patient sink. Examples: gastroenteritis (e.g., C. difficile), scabies, conjunctivitis.\n\nContact precautions prevent transmission via direct or indirect contact with the patient or their environment. They are required when pathogens can be spread by touching contaminated surfaces. In Canadian health care, they are commonly applied for MRSA, VRE, C. difficile, and other healthcare-associated pathogens."
    difficulty: easy
    tags: [contact precautions, IPAC, PPE, infection control]
  - front: "What is a Public Health Emergency of International Concern (PHEIC) under the International Health Regulations (IHR)?"
    back: "A PHEIC is defined as 'an extraordinary event which is determined to constitute a public health risk to other States through the international spread of disease and to potentially require a coordinated international response.' It is declared by the WHO Director-General based on recommendations from the Emergency Committee. Examples: smallpox, poliomyelitis (wild-type), human influenza (new subtype), COVID-19, SARS, mpox.\n\nThe IHR is an international agreement involving 196 nations. A PHEIC declaration triggers international cooperation and temporary recommendations by the WHO. Canadian physicians should understand the PHEIC mechanism as it drives national response protocols through PHAC and influences public health travel advisories."
    difficulty: medium
    tags: [PHEIC, IHR, WHO, international health regulations, pandemic]
  - front: "What does the mnemonic CHCHOPD represent in environmental health history-taking?"
    back: "C – Community; H – Home; C – Community (second C relates to neighbourhood); H – Hobbies; O – Occupation; P – Personal habits; D – Diet and Drugs. This mnemonic guides clinicians to ask about environmental exposures across multiple domains.\n\nTaking a thorough environmental health history is essential when evaluating patients with potentially environment-related conditions. After identifying a possible hazard using CHCHOPD, the clinician then investigates Time (when symptoms began/exposure began), Place (where symptoms worsen/hazard location), and Person (others with similar symptoms)."
    difficulty: easy
    tags: [environmental health, history taking, CHCHOPD, occupational medicine]
  - front: "What are the four steps of the National Academies of Sciences Environmental Risk Assessment framework (1984)?"
    back: "1. Hazard Identification – What is the hazard? 2. Dose-Response – What health outcomes are associated with the hazard and at what doses? 3. Exposure Assessment – Is the patient's exposure sufficient to cause the symptoms? 4. Risk Characterization – Is there a causal relationship given the exposure and dose-response?\n\nThis four-step framework (also called the HIRA framework) is used by public health agencies and environmental health practitioners worldwide, including in Canada. It provides a systematic approach to determining whether an environmental exposure is likely responsible for a patient's or community's health effects."
    difficulty: medium
    tags: [environmental risk assessment, HIRA, hazard identification, dose-response]
  - front: "What are the four common types of environmental hazards and four main environmental reservoirs?"
    back: "Four types of hazards: chemical, biological, physical, and radiation. Four main reservoirs: air, food, water, and soil. Three main routes of exposure: inhalation, ingestion, and absorption (skin).\n\nUnderstanding the sources, reservoirs, and routes of environmental exposures is fundamental to taking an environmental health history and performing a risk assessment. In Canadian public health, water, air, and soil contamination are regulated across multiple jurisdictional levels (municipal, provincial, federal)."
    difficulty: easy
    tags: [environmental health, hazards, reservoirs, routes of exposure]
  - front: "What are the health effects of ground-level ozone, carbon monoxide, and sulphur dioxide as air chemical hazards?"
    back: "Ground-level ozone: main component of smog; worsens asthma, irritates upper airway. Carbon monoxide: aggravates cardiac disease at low levels; headache, nausea, dizziness at moderate levels; fatal at high levels. Sulphur dioxide and nitrogen oxides: contribute to acid rain and exacerbate breathing difficulties.\n\nThese chemical air pollutants are regulated under Canadian federal and provincial legislation. Carbon monoxide poisoning is a medical emergency managed with high-flow O2 or hyperbaric oxygen. Ozone and SO2 are particularly relevant to patients with pre-existing cardiorespiratory conditions during air quality advisories."
    difficulty: easy
    tags: [air pollution, ozone, carbon monoxide, sulphur dioxide, environmental health]
  - front: "What is the significance of radon gas as a radiation hazard to indoor air quality?"
    back: "Radon is naturally produced by soil containing uranium or radium and can contaminate indoor air. It is associated with approximately 20% of lung cancers in Canada (second leading cause of lung cancer after smoking).\n\nRadon is a colourless, odourless, radioactive gas. Health Canada recommends testing home radon levels and taking action if levels exceed 200 Bq/m³. Risk is highest in basements and poorly ventilated spaces. Radon testing and mitigation (sealing, ventilation) are important preventive measures discussed in Canadian public health guidelines."
    difficulty: easy
    tags: [radon, lung cancer, ionizing radiation, indoor air quality, environmental health]
  - front: "What was the Walkerton tragedy and what pathogens were responsible?"
    back: "In May 2000, the drinking water system in Walkerton, Ontario became contaminated with Escherichia coli O157:H7 and Campylobacter jejuni. Over 2,300 individuals became ill; 27 developed hemolytic uremic syndrome and 7 died.\n\nThe Walkerton tragedy is the most significant water contamination disaster in modern Canadian history. It was caused by inadequate water treatment and regulatory oversight. The subsequent Walkerton Inquiry (Justice O'Connor) led to major overhauls of Ontario's Safe Drinking Water Act and reinforced the critical role of public health authorities in water safety regulation."
    difficulty: easy
    tags: [Walkerton, water safety, E. coli O157:H7, hemolytic uremic syndrome, environmental health, Ontario]
  - front: "What is the recommended fluoride concentration in municipal water in Canada and what is the benefit?"
    back: "The recommended fluoride concentration in municipal water is 0.7 mg/L (ppm). At this concentration, fluoride reduces dental cavities (caries) by 18-40% and is considered one of the greatest public health achievements of the 20th century.\n\nWater fluoridation is a safe, effective, and cost-effective public health intervention endorsed by Health Canada and the Canadian Dental Association. Concerns about harm have been widely debunked. Some Canadian communities (e.g., Calgary) have opted out, resulting in increased rates of dental caries, particularly in children."
    difficulty: easy
    tags: [water fluoridation, dental caries, fluoride, municipal water, public health]
  - front: "Which populations are at highest risk of waterborne illness in Canada? Name three waterborne bacterial pathogens."
    back: "Indigenous peoples, Black Nova Scotians, and rural Canadians are at highest risk. Three waterborne bacterial pathogens: Escherichia coli (e.g., Walkerton), Salmonella, Shigella. Waterborne protozoa include Giardia and Cryptosporidium (e.g., North Battleford, SK).\n\nAccess to clean water is a recognized social determinant of health. Structural inequities mean that racialized and Indigenous communities disproportionately lack access to safe drinking water in Canada. As of 2020, 61 long-term drinking water advisories remained on reserves. Cryptosporidium is notably resistant to standard chlorination and requires filtration."
    difficulty: easy
    tags: [water safety, waterborne disease, Indigenous health, health equity, Cryptosporidium]
  - front: "What are the key food sources and main health effects of Clostridium botulinum and Listeria monocytogenes?"
    back: "Clostridium botulinum: unpasteurized honey and canned foods → dizziness, weakness, respiratory failure (and GI symptoms: thirst, nausea, constipation). Listeria monocytogenes: unpasteurized cheeses, prepared salads, cold cuts → listeriosis (nausea, vomiting, fever, headache, rarely meningitis or encephalitis); particularly dangerous in pregnancy.\n\nBoth pathogens require specific clinical awareness. Botulism is a medical emergency requiring antitoxin and potentially mechanical ventilation. Listeria is particularly dangerous for pregnant women, neonates, the elderly, and immunocompromised patients. In Canada, listeriosis outbreaks have been linked to deli meats processed in federally regulated facilities."
    difficulty: medium
    tags: [food safety, botulism, listeria, foodborne illness, environmental health]
  - front: "What food sources and health effects are associated with prions (BSE)?"
    back: "Prions (bovine spongiform encephalopathy, BSE): source is beef and beef products → Variant Creutzfeldt-Jakob disease (vCJD) in humans.\n\nBSE ('mad cow disease') caused a major food safety crisis in the UK and Canada in the 1990s–2000s. Variant CJD is a uniformly fatal prion disease with a long incubation period. Canada implemented strict cattle feed bans and surveillance programs in response. Prions are resistant to standard sterilization methods."
    difficulty: easy
    tags: [BSE, prion disease, variant CJD, food safety, environmental health]
  - front: "What are nitrites and sulphites as food chemical hazards and what are their associated health risks?"
    back: "Nitrites: highest concentration in cured meats; can be converted in the body to carcinogenic nitrosamines (risk of colorectal cancer). Sulphites: commonly used as food preservatives; associated with sulphite allergy (hives, nausea, anaphylactic shock).\n\nThese food additives are regulated by Health Canada under the Food and Drug Regulations. Nitrosamine formation is enhanced in high-temperature cooking of nitrite-cured meats. Sulphite allergy, while uncommon, can be severe and must be considered in patients presenting with allergic reactions after eating dried fruits, wine, or processed foods."
    difficulty: easy
    tags: [food additives, nitrites, sulphites, food safety, carcinogen]
  - front: "What is Environmental Racism and provide two Canadian examples."
    back: "Environmental racism is the deliberate and disproportionate development of environmental hazards and toxic facilities near communities without a strong voice (Indigenous, immigrant, racialized groups, lower SES). Two Canadian examples: (1) Grassy Narrows, Ontario – mercury contamination from a paper mill causing severe neurotoxicity in Indigenous residents; (2) Africville, Nova Scotia – placement of oil plant, tar factory, prison, hospital for infectious diseases, and open garbage dump within a Black community, with denial of basic municipal services.\n\nEnvironmental racism is a key social determinant of health topic in Canadian public health. Grassy Narrows (mercury poisoning) and Africville (forced relocation of a Black community for industrial use) exemplify how systemic racism intersects with environmental policy. These cases have significant implications for health equity, Indigenous rights, and the UNDRIP."
    difficulty: medium
    tags: [environmental racism, health equity, Indigenous health, Grassy Narrows, Africville, social determinants]
  - front: "What health effects does climate change contribute to, according to the WHO's projections and Toronto Notes?"
    back: "WHO projects 250,000 additional deaths annually by 2030 due to climate change. Health effects include: (1) extreme weather events (injuries, deaths); (2) reduced air quality (respiratory disease, cardiovascular disease, allergies); (3) altered vector distribution (increased Lyme disease, West Nile virus, Malaria, Dengue); (4) crop damage (malnutrition, foodborne illness); (5) water supply damage (waterborne diseases, algal blooms); (6) droughts and rising sea levels (poverty, conflict, migration).\n\nClimate change is recognized as the greatest public health threat of the 21st century. Canadian physicians are encouraged to consider climate-related factors in patient presentations (e.g., heat stroke, new vector distribution). Public health responses involve mitigation (reducing greenhouse gases) and adaptation (building resilience in health systems)."
    difficulty: medium
    tags: [climate change, public health, vector-borne disease, air quality, health effects]
  - front: "What are the five phases of disaster response and how does each differ?"
    back: "1. Prevention: actions to stop potential disasters from occurring (e.g., food/water safety standards); 2. Mitigation: actions to lessen impact of unavoidable disasters (e.g., earthquake-proof buildings); 3. Preparedness: planning, training, and education; 4. Response: actions before, during, and immediately after a disaster to prevent loss of life (e.g., search and rescue); 5. Recovery: restoring damaged infrastructure and resuming regular operations.\n\nThe Medical Council of Canada defines a disaster as a serious disruption causing widespread losses exceeding a society's ability to cope using only its own resources. These five phases are the standard framework in Canadian emergency management. Physicians play key roles particularly in the response and recovery phases."
    difficulty: easy
    tags: [disaster preparedness, emergency response, public health, disaster management]
  - front: "What are the key components of an Emergency Response Plan (ERP), Incident Management System (IMS), and Emergency Operations Centre (EOC)?"
    back: "ERP: document outlining policies, procedures, roles, and responsibilities of various parties to coordinate action during disasters (e.g., Ontario provincial ERP). IMS: provides guidelines for standardizing responses during the response phase, including personnel, facilities, equipment, financing, procedures, and communications. EOC: a centralized facility to coordinate the entire disaster response. COOP (Continuity of Operations Plan): guidelines for maintaining critical functions during a disaster.\n\nThese emergency management structures are used at all levels of government and health care organizations in Canada. The IMS is based on the Incident Command System (ICS) framework. Understanding these structures is important for physicians who may be required to participate in organized disaster responses."
    difficulty: easy
    tags: [emergency response, disaster preparedness, ERP, IMS, EOC]
  - front: "What does the mnemonic WHACS stand for in occupational health history-taking?"
    back: "W – What do you do (job duties)? H – How do you do it (process)? A – Are you exposed to anything (chemical, biological, physical, ergonomic hazards)? C – Co-workers with similar symptoms? S – Satisfied with your job (psychosocial factors)?\n\nTaking a thorough occupational history using WHACS helps identify work-related causes of disease that can look identical to non-occupational illness. Occupation is a key social determinant of health. Without identifying an occupational link, opportunities for prevention, workers' compensation, and workplace safety improvement may be missed."
    difficulty: easy
    tags: [occupational health, WHACS, occupational history, history taking]
  - front: "What are the six categories of occupational hazards and provide one health effect for each?"
    back: "1. Physical (e.g., noise → hearing loss; ionizing radiation → cancer; temperature extremes → heat stroke; vibration → hand-arm vibration syndrome). 2. Chemical (e.g., asbestos → asbestosis/mesothelioma; benzene → acute myeloid leukemia; carbon monoxide → chemical asphyxiation; silica → silicosis). 3. Biological (e.g., mould → farmer's lung/hypersensitivity pneumonitis; blood/body fluids → HIV, Hepatitis B/C). 4. Psychosocial (e.g., bullying, harassment, shift work → PTSD, mental illness, absenteeism). 5. Ergonomic (e.g., manual materials handling → musculoskeletal disorders; improper lighting → headaches). 6. Safety (e.g., working from heights, heavy machinery → severe injury and death).\n\nThese six categories are standard in Canadian occupational medicine curriculum. Physicians must consider all categories when evaluating work-related illness or injury. Each category requires specific assessment strategies (e.g., audiograms for noise, PFTs for dust, whole blood lead for chemical exposure)."
    difficulty: medium
    tags: [occupational hazards, occupational medicine, asbestos, benzene, silicosis, ergonomics]
  - front: "What are the five levels of the hierarchy of controls for occupational hazards, in order from most to least effective?"
    back: "1. Elimination (physically remove the hazard, e.g., driverless car instead of driver). 2. Substitution (replace hazard with safer alternative, e.g., replace with train). 3. Engineering controls (isolate workers from hazard, e.g., airbags, ventilation). 4. Administrative controls (change how work is done, e.g., traffic laws, rotation schedules). 5. Personal Protective Equipment (PPE) (protect worker, e.g., seatbelts, respirators) — least effective.\n\nThe hierarchy of controls is the fundamental framework for reducing occupational exposures in Canada and globally (based on CDC/NIOSH framework). Elimination and substitution are preferred because they remove the hazard entirely. PPE is the last resort as it depends on correct and consistent use by workers and does not remove the hazard."
    difficulty: easy
    tags: [hierarchy of controls, occupational health, PPE, engineering controls, elimination]
  - front: "What are the three rights of workers under Ontario's Occupational Health and Safety Act (OHSA), and which workers have restricted right-to-refuse dangerous work?"
    back: "Three rights: (1) Right to Know (training and information about workplace hazards); (2) Right to Participate (representatives on joint health and safety committees); (3) Right to Refuse dangerous work. Restriction: some occupations cannot refuse if the danger is a normal part of their job or refusal would endanger others (e.g., police, firefighters, some health care workers).\n\nThe OHSA is Ontario's key occupational health legislation, enforced by Ministry of Labour inspectors. Understanding worker rights is important for physicians advising patients about workplace safety. There is also a right for 'certified' workers to stop work they feel endangers other workers. Similar legislation exists in all Canadian provinces."
    difficulty: easy
    tags: [OHSA, occupational health, worker rights, Ontario legislation, workplace safety]
  - front: "What is the Workplace Safety and Insurance Board (WSIB) in Ontario and what benefits does it provide?"
    back: "The WSIB is an autonomous Ontario government agency established under the Workplace Safety and Insurance Act that oversees workplace safety training and administers insurance for workers and employers. Benefits include: loss of earned income, non-economic loss (physical/functional/psychological), loss of retirement income, health care expenses (first-aid, medical treatment), and survivor benefits (for dependants/spouses). It is a no-fault insurance system; workers cannot sue the employer but are guaranteed compensation for accepted claims. Negligence is not considered a factor.\n\nWSIB represents the workers' compensation system for Ontario; each province has its own equivalent legislation and board. Physicians play a critical role in WSIB claims by documenting injuries, providing functional assessments, and supporting return-to-work planning. WSIB covers 74-99% of the workforce depending on the province."
    difficulty: medium
    tags: [WSIB, workers compensation, occupational medicine, Ontario, no-fault insurance]
  - front: "What are the three levels of prevention in occupational medicine and what does each entail?"
    back: "Primary prevention: proactive efforts to anticipate, recognize, evaluate, and control workplace hazards before illness or injury occurs (hierarchy of controls). Secondary prevention: medical surveillance (periodic examinations) of exposed workers to identify early signs of overexposure or disease (e.g., whole blood lead testing, pulmonary function tests, audiograms). Tertiary prevention: treatment and rehabilitation to facilitate safe and timely return to work, including WSIB, retraining, and job modification.\n\nThese three levels align with the general prevention framework applied across all of public health. In occupational medicine, secondary prevention is particularly important because occupational diseases are often detectable before they become clinically manifest. Physicians must also delineate worker restrictions vs. limitations vs. abilities vs. tolerance in return-to-work assessments."
    difficulty: easy
    tags: [occupational medicine, primary prevention, secondary prevention, tertiary prevention, medical surveillance]
  - front: "What specific secondary prevention investigations are used in occupational medicine for lead exposure, dust-related asthma, and noise-induced hearing loss?"
    back: "Lead exposure: whole blood lead testing (identifies effectiveness of controls and guides removal from exposure). Dust-related asthma: pulmonary function tests (spirometry). Noise-induced hearing loss: audiograms.\n\nMedical surveillance in occupational medicine requires condition-specific tests that detect early subclinical changes. Whole blood lead levels in Ontario must be reported to the Medical Officer of Health above certain thresholds. Audiometric testing and PFTs are performed at regular intervals in workers with significant occupational noise or dust exposure."
    difficulty: easy
    tags: [occupational medicine, medical surveillance, lead poisoning, occupational asthma, noise-induced hearing loss]
  - front: "What occupational exposure is associated with mesothelioma and asbestosis, and what chemical causes acute myeloid leukemia?"
    back: "Asbestos exposure → asbestosis (restrictive lung disease from fibrosis) and mesothelioma (pleural malignancy). Benzene exposure (prolonged) → acute myeloid leukemia (AML).\n\nAsbestos is a major occupational carcinogen historically used in construction, shipbuilding, and insulation in Canada. Mesothelioma has a very long latency period (20-50 years) and is virtually pathognomonic for asbestos exposure. Benzene is found in petroleum products and industrial solvents. Both exposures are regulated under WHMIS in Canada."
    difficulty: easy
    tags: [asbestos, mesothelioma, asbestosis, benzene, AML, occupational cancer]
  - front: "What is Farmer's Lung, its cause, and its pathological mechanism?"
    back: "Farmer's Lung is an occupational lung disease caused by exposure to mould (typically thermophilic actinomycetes from mouldy hay/grain). The pathological mechanism is hypersensitivity pneumonitis (extrinsic allergic alveolitis), an immune-mediated inflammatory reaction in the lung parenchyma.\n\nFarmer's Lung is classified as a biological occupational hazard. It presents with fever, chills, cough, and dyspnoea 4-8 hours after antigen exposure. Repeated exposure can lead to progressive fibrosis. Management includes avoidance of the antigen and corticosteroids for acute episodes. It is an important example of an occupational lung disease in the MCCQE1."
    difficulty: medium
    tags: [Farmers lung, hypersensitivity pneumonitis, occupational lung disease, biological hazard]
  - front: "What is the distinction between worker restrictions, limitations, abilities, and tolerance in occupational medicine return-to-work assessments?"
    back: "Restrictions: what the worker cannot do even if they want to, because it would worsen their condition. Limitations: what the worker is unable to do due to injury or impairment. Abilities: what the worker is still able to do (focus here to maximize function). Tolerance: what the worker is willing to do.\n\nThis distinction is critical for physicians completing functional capacity assessments and return-to-work reports in Canada (e.g., for WSIB). Clear delineation of restrictions vs. limitations helps employers make appropriate workplace accommodations and avoids unnecessary prolonged absence from work, which itself can worsen outcomes."
    difficulty: medium
    tags: [return to work, occupational medicine, WSIB, functional assessment, restrictions limitations]
  - front: "What is the Workplace Hazardous Materials Information System (WHMIS) and what is its scope in Canada?"
    back: "WHMIS is a national system for providing information about hazardous materials used in Canadian workplaces. It is universal across Canada and includes requirements for: corporate responsibility to maintain a safe workplace, safety data sheets (formerly Material Safety Data Sheets/MSDSs) for chemical exposures, and joint health and safety committees (workers + management). Jurisdiction is primarily provincial (90% of workers), with 16 federally-regulated industries covered under the Canada Labour Code.\n\nWHMIS was updated to WHMIS 2015 to align with the Globally Harmonized System (GHS) of Classification and Labelling of Chemicals. Workers can request safety data sheets to understand chemical hazards in their workplace. Joint health and safety committees are mandatory in workplaces with 20+ employees in Ontario."
    difficulty: easy
    tags: [WHMIS, workplace safety, occupational health, Canada Labour Code, chemical hazards]
  - front: "What is Environmental Racism in the context of Grassy Narrows, Ontario — what happened and what was its health impact?"
    back: "Grassy Narrows is a First Nations reserve in northwest Ontario where an upstream paper mill dumped tonnes of untreated mercury into the water supply over several years. Residents began developing symptoms of severe mercury poisoning (neurotoxicity) in the 1970s. It decimated two major employment sources (fishing and guiding), contaminated food and water supplies, and left the community with limited resources. The federal government did not agree to build a mercury treatment facility until 2020 (~50 years later), and construction had not begun at time of writing.\n\nGrassy Narrows is one of the most significant examples of environmental racism in Canada. The Minamata disease-like syndrome caused by organic mercury (methylmercury) causes severe and irreversible neurological damage. The prolonged government inaction despite documented harm illustrates systemic injustice in environmental protection. Canada's adoption of UNDRIP aims to provide better protections for Indigenous communities."
    difficulty: medium
    tags: [environmental racism, Grassy Narrows, mercury poisoning, Indigenous health, neurotoxicity]
  - front: "What is the Source-Path-Receiver Model in environmental health and how is it applied?"
    back: "The Source-Path-Receiver Model provides a framework for preventing workplace injuries and environmental exposures. Strategies can be implemented at three levels: (1) Source – modify or eliminate the hazard at its origin; (2) Path – modify the route of transmission between source and receiver; (3) Receiver – protect the receiver (worker/person) from the hazard. This corresponds to the hierarchy of controls (elimination → PPE).\n\nThis model is widely used in occupational and environmental health to identify intervention points. Addressing the source is most effective (elimination/substitution), modifying the path involves engineering controls, and protecting the receiver involves administrative controls and PPE. The model aligns with the general principle of controlling hazards before they reach the individual."
    difficulty: easy
    tags: [source-path-receiver model, occupational health, environmental health, hierarchy of controls]
  - front: "What are the public health mitigation vs. adaptation approaches to climate change?"
    back: "Mitigation: efforts to slow, stabilize, or reverse climate change by directly reducing greenhouse gas emissions (e.g., transitioning to renewable energy, reducing fossil fuel use). Adaptation: anticipating and preparing for the effects of climate change (e.g., conducting health vulnerability and adaptation assessments, identifying at-risk populations, evaluating resilience of current health systems).\n\nBoth mitigation and adaptation are necessary components of the public health response to climate change. Physicians can contribute through climate-sensitive clinical practice, advocacy, and health system planning. Key Canadian policies include the Pan-Canadian Framework on Clean Growth and Climate Change. Vulnerable populations (elderly, Indigenous, low-income) require targeted adaptation strategies."
    difficulty: easy
    tags: [climate change, mitigation, adaptation, public health response, greenhouse gases]
  - front: "What is the role of the Chief Public Health Officer (CPHO) of Canada?"
    back: "The CPHO is the federal government's lead public health professional who:\n- Provides health advice to the Minister of Health and President of PHAC\n- Collaborates with other governments, jurisdictions, and agencies\n- Communicates public health information to professionals, stakeholders, and the public\n- In an emergency (outbreak or natural disaster), directs PHAC staff including medical professionals, scientists, and epidemiologists to coordinate emergency response\n\nThe CPHO is appointed under the Public Health Agency of Canada Act and serves as Canada's top public health advisor. Understanding the CPHO's role is important for Canadian medical licensing exams."
    difficulty: easy
    tags: [CPHO, PHAC, public health, Canada, health system]
  - front: "What is the Public Health Agency of Canada (PHAC) and when was it created?"
    back: "PHAC is the main Government of Canada agency responsible for public health. It was created as an independent body post-SARS to strengthen public health capacity and response. Functions include:\n- Preventing chronic diseases and injuries\n- Responding to public health emergencies and infectious disease outbreaks\n- CTFPHC guideline secretariat and knowledge brokers\n- Overseeing immigration screening and protecting Canadian borders (airport health inspection)\n- Liaising with the WHO on global health issues\n\nPHAC was established in 2004 following the 2003 SARS outbreak to fill gaps in Canada's public health infrastructure. It is a federal agency distinct from Health Canada."
    difficulty: easy
    tags: [PHAC, public health, Canada, SARS, health system]
  - front: "What is the role of the Medical Officer of Health (MOH) in Ontario and what legislation governs their powers?"
    back: "The MOH (also called 'Medical Health Officer' in other provinces) is:\n- Appointed to each public health unit\n- A Public Health and Preventive Medicine specialist physician\n- Responsible for oversight of a multidisciplinary team that collects/analyzes epidemiological data, conducts health surveillance, and implements health programs\n\nPowers are outlined in the Health Protection and Promotion Act (HPPA), specifically Sections 13 and 22, which allow the MOH to require an individual/premise/agency to take or refrain from any action due to a public health hazard.\n\nThe MOH is the key local public health authority. Section 22 of the HPPA gives the MOH authority to issue orders to control health hazards, which is a common examination topic."
    difficulty: medium
    tags: [MOH, medical officer of health, HPPA, Ontario, public health law]
  - front: "Distinguish between health equity and health equality."
    back: "Health equity: when all people have 'the opportunity to attain their full health potential' and no one is 'disadvantaged from achieving this potential because of their social position or other socially determined circumstance.' Health inequities are systematic differences considered unjust.\n\nHealth equality: where populations have equal or similar health status. Health inequalities are systematic differences in the health of groups that do not necessarily carry a moral judgement.\n\nThe distinction is important: equity focuses on fairness and removing unjust disadvantages, while equality simply refers to sameness of outcomes without moral judgment. This is a common conceptual question on public health exams."
    difficulty: easy
    tags: [health equity, health equality, social determinants, public health]
  - front: "Define the following: impairment, disability, and handicap."
    back: "Impairment: 'any loss or abnormality of psychological, physiological, or anatomical structure or function'\n\nDisability: 'any restriction or lack of ability to perform an activity within the range considered normal for a human being'\n\nHandicap: a disadvantage for an individual arising from impairment or disability — 'limits or prevents the fulfillment of an individual's normal role as determined by society and depends on age, sex, social, and cultural factors'\n\nThese WHO definitions form a hierarchy: impairment → disability → handicap. Understanding the distinction is important for disability assessment and public health policy in Canada."
    difficulty: easy
    tags: [impairment, disability, handicap, public health, WHO]
  - front: "What did the 1974 Lalonde Report contribute to Canadian public health?"
    back: "The Lalonde Report ('A New Perspective on the Health of Canadians,' 1974), published by federal Minister of Health Marc Lalonde, outlined four factors that determine health:\n1. Human biology\n2. Environment\n3. Lifestyle\n4. Health care organizations\n\nThis was groundbreaking as it expanded the concept of health determinants beyond just medical care, forming the basis for the modern social determinants of health framework.\n\nThe Lalonde Report was a landmark Canadian document that shifted thinking about health from a purely biomedical model to a broader socioecological model. It is frequently referenced in Canadian public health education."
    difficulty: easy
    tags: [Lalonde report, determinants of health, Canadian history, public health]
  - front: "What are the social determinants of health (SDOH) as per the WHO (2023)?"
    back: "The SDOH are 'non-medical factors that influence health outcomes,' including 'the conditions in which people are born, grow, work, live, and age, and the wider set of forces and systems shaping the conditions of daily life.'\n\nKey Canadian SDOH include:\n- Income and social status\n- Employment and working conditions\n- Education and literacy\n- Childhood experiences\n- Physical environments\n- Social supports and coping skills\n- Health-related behaviours\n- Access to health services\n- Biology and genetic endowment\n- Gender, culture\n- Exposure to colonization and racialized prejudice/racism\n\nThe SDOH framework is central to Canadian public health practice and is tested on the MCCQE1. Colonization and racism are explicitly included as determinants in Canadian guidelines."
    difficulty: easy
    tags: [social determinants of health, SDOH, WHO, public health, Canada]
  - front: "Distinguish between cultural humility, cultural safety, cultural awareness, cultural sensitivity, and cultural competency."
    back: "Cultural awareness: attitude that includes awareness about differences between cultures\n\nCultural sensitivity: recognizes differences between cultures and that these differences are important to acknowledge in healthcare\n\nCultural competency: focuses on practitioners attaining skills, knowledge, and attitudes to work with people of different cultures including Indigenous peoples\n\nCultural humility: a respectful, person-centered, life-long process of learning and self-reflexivity; humble acknowledgement of oneself as a learner regarding a patient's experience\n\nCultural safety: developed by Dr. Irihapeti Ramsden; considers power relationships between health professionals and patients; recipients of care are empowered to decide what is culturally safe; practitioners are self-reflective about their position of power\n\nThese terms are often confused. Cultural safety (developed by a Maori nurse) is more transformative than cultural competency—it addresses power imbalances rather than just knowledge acquisition. Both are increasingly emphasized in Canadian medical education."
    difficulty: medium
    tags: [cultural safety, cultural humility, cultural competency, Indigenous health, public health]
  - front: "What are the three distinct groups of Indigenous peoples in Canada as recognized by the Constitution Act 1982?"
    back: "Per Section 35 of the Constitution Act 1982:\n1. First Nations (status and non-status) — includes over 600 diverse communities; status/non-status refers to registration under the Indian Act (1876)\n2. Métis — descendants of First Nations and European settlers; nearly 2/3 reside in cities, greatest proportion in Ontario and prairie provinces\n3. Inuit — roughly 75% of ~70,000 Inuit reside in Inuit Nunangat (Nunavut, Nunavik, Nunatsiavut, Inuvialuit); majority in Nunavut (30,135)\n\nIn 2021, more than 1.8 million Canadians self-identify as Indigenous (~5% of total population); growing fastest of any group (9.4% between 2016-2021); youngest population (28% under age 25).\n\nThis is essential knowledge for Canadian medical licensing. Indigenous peoples are a distinct, growing, and young demographic with specific health equity considerations."
    difficulty: easy
    tags: [Indigenous peoples, First Nations, Métis, Inuit, Canada, Indigenous health]
  - front: "What were residential schools and what are their health impacts on Indigenous peoples?"
    back: "Residential schools (1870s–1996): government-mandated schools where Indigenous children were forced to attend and assimilate. Effects included:\n- Poor nutrition, hygiene, living conditions\n- Physical, sexual, and psychological abuse\n- Spiritual harms through loss of traditional language and culture\n\nHealth impacts:\n- Poorer general and self-rated health\n- Increased rates of chronic and infectious diseases\n- Mental distress, depression, substance use, suicide\n- Intergenerational trauma (affects subsequent generations)\n- 'Residential school syndrome': extends PTSD criteria to include tendency to misuse alcohol/drugs from young age, loss of cultural knowledge, violent outbursts, difficulty parenting\n\nThe Truth and Reconciliation Commission (TRC) Final Report (2015) contains 94 Calls to Action, some directed at HCPs and medical schools.\n\nPhysicians must be aware of the lasting impacts of residential schools. The TRC Calls to Action include responsibilities for HCPs to respond to and support reconciliation. This is a key Canadian public health topic."
    difficulty: medium
    tags: [residential schools, TRC, Indigenous health, intergenerational trauma, Canada]
  - front: "What is the current tuberculosis (TB) disparity between Inuit and non-Indigenous Canadians?"
    back: "In 2016, the average annual incidence rate of TB among Inuit in Canada was roughly 296 times higher than Canadian-born non-Indigenous people.\n\nHistorical context: From 1930–1940, TB death rates in Inuit populations were ~700 per 100,000 — among the highest ever recorded in a human population (for comparison, global TB crude death rate in 2016 was 17 per 100,000).\n\nThe Canadian government forcibly relocated many Indigenous people to TB sanatoriums/'Indian hospitals,' often hundreds of kilometres away, with average length of stay 2.5 years and many patients never returning home.\n\nIn 2018, Inuit Tapiriit Kanatami (ITK) and the Government of Canada committed to the Inuit Tuberculosis Elimination Framework: reduce TB rates by 50% by 2025 and eliminate TB by 2030.\n\nThe massive TB disparity in Indigenous communities is a direct consequence of colonization, forced relocation, and overcrowding. This is a high-yield Canadian public health topic for the MCCQE1."
    difficulty: medium
    tags: [tuberculosis, TB, Indigenous health, Inuit, health disparity, Canada]
  - front: "What was the Sixties Scoop and what are its ongoing health implications?"
    back: "The Sixties Scoop (1951–1980s): government-mandated practice of removing Indigenous children from their families without consent for placement in foster care or adoption. Indigenous parents were deemed 'unfit'; the goal was assimilation into non-Indigenous families.\n\nOngoing implications:\n- Indigenous children still overrepresented in foster care\n- In 2016, Indigenous youth ages 0–4 made up ~half of all foster children in private households, despite being only 8% of this age group\n- Youth with history in government care: greater risk for substance misuse, street involvement, incarceration\n- Many Indigenous mothers/families avoid accessing healthcare for fear of child apprehension\n- Displacement from language and culture hinders family resilience\n\nThe Sixties Scoop is a form of cultural genocide whose legacy persists. Healthcare providers must understand why Indigenous families may distrust health services, including fear of child welfare involvement."
    difficulty: medium
    tags: [Sixties Scoop, Indigenous health, child welfare, Canada, colonization]
  - front: "What were the coerced sterilizations of Indigenous women in Canada?"
    back: "Throughout the 20th century, eugenics programs existed across Canada:\n- 1920s–1930s: Alberta and British Columbia legalized eugenic policies in Sexual Sterilization Acts (not repealed until 1970s)\n- Indigenous women were disproportionately targeted\n- Coerced sterilization included: tubal ligations without consent, being falsely told procedures are reversible, being pressured to sign consent forms while in labour or on operating tables, ultimatums (tubal ligation or risk child apprehension)\n- Many sterilizations occurred outside legislation in federally run 'Indian hospitals'\n- Documented as recently as 2019; at least 100 Indigenous women have come forward spanning 1970s–2019\n\nCoerced sterilization of Indigenous women is a violation of reproductive rights and bodily autonomy with deep roots in Canadian history. Knowledge of this history is essential for culturally safe care."
    difficulty: medium
    tags: [coerced sterilization, Indigenous women, eugenics, Canada, reproductive rights, Indigenous health]
  - front: "What is the approach to Indigenous health and wellness based on traditional frameworks?"
    back: "Key principles:\n- Restoring balance in four realms: spiritual, emotional, mental, and physical health\n- Acting as an individual, as a member of family, community, and nation\n- Medicine Wheel (First Nations), Learning Blanket (Inuit), Métis Tree Model — all share a worldview of holistic lifelong learning and wellness\n- Indigenous medicines include song, dance, smudge, ceremonies, plant medicines — practiced by experts with decades of apprenticeship\n- Focus on quality of life, not just cure; different understanding of illness causation than biomedical model\n\nFor physicians: begin with curiosity (ask 'What do I need to know about you as a person to give you the best care possible?'); do not assume interest in traditional medicine; traditional medicine is unlikely to interfere with Western therapies.\n\nCultural humility is the recommended approach for Indigenous patient care. The NIHO offers 8 guidelines on culturally safe care for Indigenous patients including access to ceremony, family support, and appropriate handling of death."
    difficulty: medium
    tags: [Indigenous health, traditional medicine, cultural humility, medicine wheel, holistic health]
  - front: "What health issues disproportionately affect Indigenous peoples in Canada and what are population-specific interventions?"
    back: "Health issues:\n- Higher rates of obesity (secondary to poor access to high-quality nutrition, food insecurity)\n- Higher rates of smoking, substance misuse, and suicide\n- Higher rates of TB (296x higher in Inuit vs. non-Indigenous Canadians)\n- Mental health issues (higher rates of depression secondary to intergenerational trauma)\n- Homelessness off-reserve\n- Exposure to environmental toxins (poor drinking water from land dispossession)\n\nInterventions:\n- Movements towards decolonization and TRC recommendations\n- Mental health awareness and increasing health literacy\n- Indigenous-specific chronic disease management (e.g., DM)\n- Culturally appropriate harm reduction, substance use treatment, smoking cessation\n- Cultural continuity (language and cultural programs protective against depression and suicide)\n- Incorporation of Traditional Medicine into care plan\n- Health practitioner training in cultural humility and safety\n\nCultural continuity — maintaining language, traditions, and community connections — is a protective factor against depression and suicide in Indigenous youth. This is an important and testable concept."
    difficulty: medium
    tags: [Indigenous health, health disparities, cultural continuity, decolonization, Canada]
  - front: "How can primary care practitioners screen for poverty in clinical settings?"
    back: "Poverty affects 20% of families in Ontario and is a risk factor for chronic diseases, cancer, and mental illness. Groups at highest risk: women, Indigenous peoples, new immigrants, LGBTQ+.\n\nTwo-question screening tool:\n1. Step 1: 'Do you ever have difficulty making ends meet at the end of the month?'\n   - Sensitivity 98%, specificity 40% for living below the poverty line\n2. Step 2: 'Have you filled out and sent in your tax forms?'\n   - Tax returns required to access income security benefits (GST/HST credit, working income tax benefits, property tax credits, child benefits)\n\nNext step: Connect patients to social and financial supports (e.g., ODSP, Ontario Works) and resources (e.g., free community tax clinic).\n\nSocial prescribing — connecting patients to community resources — is an increasingly important role for primary care physicians. The two-question poverty screen is a validated and high-yield tool for the MCCQE1."
    difficulty: medium
    tags: [poverty screening, SDOH, primary care, social prescribing, Ontario]
  - front: "What mandatory medical exams are required for new immigrants to Canada?"
    back: "Mandatory exams on entry include:\n- Chest X-ray: report to local public health\n- Syphilis serology for persons ≥15 yr\n- HIV testing for applicants ≥15 yr, as well as children who received blood/blood products, have a known HIV-positive mother, or have identified risk\n- Serum creatinine for persons ≥15 yr and children with history of HTN (resting BP >150/90), DM, kidney disease, or signs of impaired renal function\n\nAdditional components:\n- Compassionate psychosocial assessment (increased prevalence of mental health issues, e.g., PTSD, intimate partner violence)\n- Assess immunization documents and develop catch-up schedule\n\nImmigration medical exams are a public health tool to identify and manage communicable diseases. The specific tests required (CXR, HIV, syphilis, creatinine) are testable on the MCCQE1."
    difficulty: medium
    tags: [new immigrants, immigration medicine, mandatory screening, Canada, public health]
  - front: "What is the 'healthy immigrant effect'?"
    back: "The healthy immigrant effect describes the phenomenon where new immigrants to Canada arrive with better health status than the general Canadian population, but their health worsens over time to match (or sometimes exceed the burden of) the general population.\n\nContributing factors to worsening health over time:\n- Barriers finding employment matching skills/qualifications\n- Exposure to cultural discrimination and isolation\n- Cultural or religious expectations\n- Acculturation to less healthy Canadian lifestyle habits\n\nThe healthy immigrant effect is a well-documented public health phenomenon in Canada. It highlights that immigrant health trajectories are shaped by social determinants after arrival rather than by their origin characteristics."
    difficulty: easy
    tags: [healthy immigrant effect, immigrants, social determinants, public health, Canada]
  - front: "What health issues disproportionately affect the LGBTIQ2S population in Canada and what are recommended clinical approaches?"
    back: "Health issues:\n- Higher rates of depression, anxiety, OCD, suicidality, and self-harm\n- Increased risk of alcohol, tobacco, and other substance misuse\n- Double the risk for PTSD compared to heterosexual individuals\n- Greater participation in high-risk sexual practices (HIV risk)\n- Mental health deterioration from internalized queerphobia and limited sociomedical infrastructure\n- Over-representation in youth homeless population\n- Victims of hate crimes (higher fatality in racialized LGBTQ+ communities)\n\nClinical approaches:\n- Apply an intersectional lens (racialized, gender-diverse, cultural roles)\n- Use gender-neutral language and avoid heteronormative assumptions\n- Invite patients to self-identify as gender or sexual minorities\n- Increased awareness of social, legal, and medical context in which LGBTIQ2S individuals live\n- Recognize individuals belonging to multiple marginalized communities face additional barriers\n\nLGBTIQ2S health is increasingly tested in Canadian medical education. The mnemonic helps recall the full spectrum: Lesbian, Gay, Bisexual, Trans, Intersex, Questioning/Queer, Two-Spirited, and Asexual."
    difficulty: medium
    tags: [LGBTIQ2S, health disparities, gender diversity, sexual minority, public health, Canada]
  - front: "What are the three types of surveillance used in public health?"
    back: "1. Passive surveillance: Reporting of disease data by all institutions that see patients, relying on cooperation of HCPs (laboratories, hospitals, health facilities, private practitioners)\n   - Most common, least expensive, but difficult to ensure completeness and timeliness\n\n2. Active surveillance: Regular visits to health facilities to review medical records for suspected cases, or active testing of a population\n   - Resource-intensive; used when a disease is targeted for eradication (every case must be investigated) or for outbreak investigations\n\n3. Sentinel surveillance: Selective reporting from a limited network of carefully selected reporting sites with high probability of seeing cases\n   - Can signal trends, identify outbreaks, and monitor disease burden in a cost-effective manner\n   - May not identify rare diseases or those outside the catchment area\n\nSurveillance is the continuous, systematic collection, analysis, and interpretation of health-related data. Understanding the three types and their trade-offs is essential for epidemiology questions on the MCCQE1."
    difficulty: easy
    tags: [surveillance, passive surveillance, active surveillance, sentinel surveillance, epidemiology]
  - front: "What are the ideal criteria for a screening test? (Wilson-Jungner criteria adapted)"
    back: "Disease criteria:\n- Causes significant suffering and/or death\n- Natural history must be understood\n- Must have an asymptomatic stage detectable by a test\n- Early detection and intervention must result in improved outcomes\n\nTest criteria:\n- High sensitivity\n- Safe, rapid, easy, relatively inexpensive\n- Acceptable to HCPs and the population\n- Continuously utilized\n\nHealth Care System criteria:\n- Adequate capacity for reporting, follow-up, and treatment of positive screens\n- Cost effective\n- Sustainable program\n- Clear policy guidelines on who to treat\n\nThese criteria help determine whether a screening program should be implemented. High sensitivity is prioritized (to minimize missed cases), while specificity matters for confirmatory/diagnostic testing. These criteria are frequently tested."
    difficulty: medium
    tags: [screening, Wilson-Jungner criteria, secondary prevention, public health, epidemiology]
  - front: "Differentiate lead-time bias and length-time bias in screening."
    back: "Lead-time bias: Overestimation of survival time 'from diagnosis' when the estimate is made from the time of screening, instead of the later time when the disease would have been diagnosed without screening.\n- Screen-detected patients appear to 'live longer' after diagnosis, but this is because diagnosis occurred earlier in the disease course, not because of improved outcomes.\n\nLength-time bias: Overestimation of survival time due to screening at one time point including more stable (slower-progressing) cases than aggressive (rapidly fatal) cases of disease.\n- Aggressive cancers with shorter presymptomatic stages are less likely to be caught at screening; screening preferentially identifies indolent disease, making the screened population appear to have better prognosis.\n\nThese are the two most important biases in screening program evaluation. Lead-time bias affects the apparent survival from diagnosis; length-time bias affects which disease subtypes are captured. Both can make a screening program appear more effective than it is."
    difficulty: hard
    tags: [lead-time bias, length-time bias, screening bias, epidemiology, public health]
  - front: "What is the difference between screening and case finding?"
    back: "Screening: A strategy used in a population to identify the possible presence of an as-yet-undiagnosed disease in individuals without signs or symptoms. Done at the population level as part of a structured program (e.g., provincial breast cancer screening program).\n\nCase finding: Individual identification of at-risk patients during clinical encounters (e.g., screening by primary care/family physicians). Less systematic than population-level screening.\n\nKey distinction: Both seek to risk-stratify for further investigation. Screening tests are not diagnostic tests — they are followed by confirmatory diagnostic tests for screen-positive individuals. Screening is best done at population level to minimize biases and harms.\n\nThe MCCQE1 tests the distinction between screening and diagnostic testing. Screening has lower specificity (acceptable false positives) because the goal is to not miss true cases; diagnostic tests must be highly specific."
    difficulty: medium
    tags: [screening, case finding, secondary prevention, epidemiology, public health]
  - front: "What are the types of screening programs?"
    back: "1. Universal screening: Screening ALL members of a population for a disease\n   - Example: Phenylketonuria (PKU) and hypothyroidism in all newborns\n\n2. Selective (targeted) screening: Screening of targeted subgroups at risk for a disease\n   - Example: Mammography in women >50 years\n\n3. Multiphasic screening: Use of many measurements and investigations to look for many disease entities\n   - Example: Periodic health examination\n\nKnowing the three types of screening helps categorize programs. Universal newborn screening for metabolic disorders (PKU, congenital hypothyroidism) is a classic Canadian public health example."
    difficulty: easy
    tags: [screening types, universal screening, selective screening, multiphasic screening, public health]
  - front: "Compare the disease prevention model and health promotion model."
    back: "Disease Prevention:\n- Health = absence of disease\n- Medical model (passive role of individual)\n- Aimed mainly at high-risk groups\n- One-shot strategy aimed at a specific pathology\n- Directive and persuasive strategies enforced in target groups\n- Focused mostly on individuals\n- Led by professional groups from health disciplines\n\nHealth Promotion:\n- Health = positive and multidimensional concept\n- Participatory model\n- Aimed at the population in its total environment\n- Diverse and complementary strategies aimed at a network of issues/determinants\n- Facilitating and enabling approaches by incentives offered to the population\n- Focused on a person's health status and environment\n- Led by non-professional organizations, civic groups, local/municipal/regional/national governments\n\nThis comparison is a classic MCCQE1 topic. Health promotion is upstream, participatory, and empowering; disease prevention is downstream, individual-focused, and medically directed."
    difficulty: medium
    tags: [health promotion, disease prevention, Ottawa Charter, public health model, comparison]
  - front: "What are the methods of healthy public policy?"
    back: "Healthy public policy creates a supportive environment to enable people to lead healthy lives, making healthy choices easier for citizens. Methods include:\n\n1. Fiscal: Imposing additional costs (e.g., taxes on tobacco and alcohol)\n2. Legislative: Implementing legal deterrents (e.g., smoking bans, legal alcohol drinking age)\n3. Social: Improving health beyond universally funded health care (e.g., providing affordable housing)\n\nThe Nuffield Intervention Ladder provides a framework for ranking the level of intrusion and the need for proportionate benefit in health promotion interventions at a population level.\n\nFiscal and legislative methods are powerful upstream determinants of health. The MCCQE1 tests knowledge of policy as a health promotion tool, especially tobacco taxation which is one of the most effective public health interventions."
    difficulty: easy
    tags: [healthy public policy, health promotion, Nuffield ladder, tobacco, public health]
  - front: "Describe the Health Belief Model and its six concepts."
    back: "The Health Belief Model (1975) is a psychological model explaining and predicting individual health behaviours based on beliefs and attitudes. An individual will adopt a beneficial health behaviour if three beliefs are present:\n1. The negative health outcome is avoidable\n2. Expects the health outcome can be prevented if the recommended behaviour is adopted\n3. The individual can be successful in adopting the behaviour\n\nSix concepts:\n1. Perceived susceptibility — belief about personal risk\n2. Perceived severity — belief about seriousness of disease\n3. Perceived benefits — belief that the recommended action will reduce risk\n4. Perceived barriers — belief about costs/obstacles to the action\n5. Cues to action — stimuli that trigger health action\n6. Self-efficacy — confidence in ability to take the health action\n\nThe Health Belief Model is widely used in public health. The four 'readiness to act' concepts (susceptibility, severity, benefits, barriers) are often tested. Self-efficacy is Bandura's contribution to the updated model."
    difficulty: medium
    tags: [Health Belief Model, behaviour change, health promotion, self-efficacy, public health]
  - front: "Describe the Stages of Change (Transtheoretical) Model and its five stages."
    back: "The Stages of Change Model provides a framework for facilitating behaviour change (e.g., quitting smoking). Five stages:\n\n1. Precontemplation: Not seriously considering change; not interested in any intervention\n2. Contemplation: Thinking about changing behaviour in the next 6 months\n3. Preparation: Beginning to experiment with small changes; resolves to make a serious attempt (usually within 30 days)\n4. Action: Actively involved in making the change, using different techniques\n5. Maintenance: Must successfully cope with temptations to return to previous behaviour\n\nRelapse: return to a previous stage — a normal part of the change process.\n\nDeveloped by Prochaska, DiClemente, and Norcross (1992).\n\nThe Stages of Change model is clinically applied in counselling for smoking cessation, substance use, diet, and exercise. Identifying the patient's stage allows tailored counselling — e.g., motivational interviewing for precontemplators."
    difficulty: easy
    tags: [Stages of Change, transtheoretical model, behaviour change, smoking cessation, public health]
  - front: "What are the three predisposing, enabling, and reinforcing factors that determine behaviour?"
    back: "Behaviour results from three factors (PRECEDE model):\n1. Predisposing factors: Knowledge, attitudes, beliefs, values, intentions\n   - E.g., knowing smoking causes cancer\n2. Enabling factors: Skills, supports\n   - E.g., access to nicotine replacement therapy, ability to afford a gym\n3. Reinforcing factors: HCPs and the social context of family and community\n   - E.g., family members who smoke undermining cessation efforts; physician encouragement\n\nHealth education serves to: increase knowledge and skills, and promote healthy behaviours.\n\nThese three factors form the basis of the PRECEDE-PROCEED health program planning model. Understanding them helps clinicians design effective behaviour change interventions that address upstream as well as individual-level factors."
    difficulty: medium
    tags: [behaviour change, PRECEDE, health education, predisposing factors, enabling factors, reinforcing factors]
  - front: "Define incidence rate and prevalence and explain their relationship."
    back: "Incidence rate: Number of new cases in a population over a specific period of time\n- Measures disease occurrence\n\nPrevalence: Total number of cases in a population over a defined period of time\n- Point prevalence: assessed at one point in time\n- Period prevalence: assessed over a period (includes new cases, excludes cases that terminate)\n\nRelationship: Prevalence ≈ Incidence Rate × Disease Duration\n- Prevalence favours inclusion of chronic over acute cases\n- May underestimate disease burden if those with short disease duration are missed\n- Prevalence estimates useful for measuring disease burden and planning facilities/services\n\nThis is a fundamental epidemiology concept. High prevalence can result from high incidence OR long disease duration (e.g., HIV has high prevalence due to effective treatment prolonging survival). Understanding this relationship is essential for the MCCQE1."
    difficulty: easy
    tags: [incidence, prevalence, epidemiology, disease measurement, public health]
  - front: "What is age-standardized rate and why is it used?"
    back: "Age-standardized rate: Adjustment of the crude rate of a health-related event using a 'standard' population with a known number of persons in each age and sex group.\n\nWhy used: When comparing a health measure (e.g., mortality) between two populations that differ in characteristics known to influence that outcome (e.g., age), standardization is used to control for the possible effect of that factor (confounding by age).\n\nTypes of standardization:\n1. Direct standardization: Applies known age-specific rates to a standard population\n2. Indirect standardization: Expressed as standardized outcome ratio (e.g., SMR = Standardized Mortality Ratio)\n   - SMR >100 = higher than expected deaths\n   - SMR <100 = fewer than expected deaths\n\nAge-standardization is essential for valid comparison of health statistics across populations with different age structures. The SMR is a common indirect standardization measure tested on the MCCQE1."
    difficulty: medium
    tags: [age-standardized rate, SMR, standardized mortality ratio, epidemiology, confounding]
  - front: "What is the natural history of disease and its stages?"
    back: "The natural history of disease describes the course of a disease from onset to resolution:\n\n1. Pathological onset: The biological beginning of disease\n2. Presymptomatic stage: From onset to first appearance of symptoms/signs (disease is present but not yet clinically apparent — this is the window for secondary prevention/screening)\n3. Clinical manifestation of disease: May regress spontaneously, be subject to remissions and relapses, or progress to death\n\nImportance: Understanding natural history determines where in the disease course different levels of prevention can be applied.\n\nThe natural history of disease framework underpins all levels of disease prevention. The presymptomatic stage is the target of screening programs, and understanding this is fundamental to interpreting screening lead-time bias."
    difficulty: easy
    tags: [natural history of disease, presymptomatic stage, disease prevention, screening, epidemiology]
  - front: "What is harm reduction and how does it differ from risk reduction? Provide examples."
    back: "Risk reduction: Lowering the risk to health without eliminating it\n- Example: Avoiding sun exposure to lower risk of skin cancer\n\nHarm reduction: A set of strategies aimed to reduce the negative consequences of drug use and other risky behaviours without necessarily stopping the behaviour\n- Examples: Needle exchange programs, supervised injection sites (SIS)\n\nEvidence for supervised injection sites:\n- Associated with 88 fewer overdose deaths per 100,000 person-years\n- 67% fewer ambulance calls for treating overdoses\n- 35% decrease in HIV infections\n- Effects on hospitalizations unknown\n\nNote: Harm reduction is a passive prevention approach (operates without requiring the person's active involvement in stopping the behaviour).\n\nHarm reduction is a pragmatic public health approach that accepts that some individuals will continue risky behaviours and focuses on minimizing harms. SIS evidence from Canada (Insite in Vancouver) is a landmark public health case study frequently referenced in Canadian medical licensing."
    difficulty: medium
    tags: [harm reduction, risk reduction, supervised injection sites, opioid, public health, Canada]
  - front: "What are the services provided by municipal/local public health units in Canada?"
    back: "Examples of services delivered by municipal/local public health include:\n1. Infectious disease control: follow-up of reported diseases and management of local outbreaks\n2. Inspection of food premises: hospitals, nursing homes, restaurants\n3. Family health services: pre-conception, preschool, school-aged, and adult health programs\n4. Tobacco control legislation enforcement\n5. Assessment and management of local environmental health risks\n6. Collection and dissemination of local health status reports\n7. Oral health programs\n\nLocal public health units are the frontline of public health service delivery in Canada. Their roles bridge individual/family health services and population-level health protection. The Ontario Public Health Standards specify mandatory programs."
    difficulty: easy
    tags: [local public health, public health unit, municipal health, Canada, public health services]
  - front: "What are rates, ratios, and proportions in epidemiology?"
    back: "Rate: Measures the frequency of an event in a defined population over a specific period of time\n- Example: Number of opioid overdoses in Canada in one year\n- Includes a time component\n\nRatio: Compares the magnitude of one quantity to another (numerator and denominator are not necessarily related)\n- Example: Ratio of women to men with lupus (3:1 overall, but 9:1 in reproductive years)\n\nProportion: A ratio where the numerator is a part of the denominator (ranges 0–1 or 0–100%)\n- Example: Proportion of deliveries complicated by placental abruption\n\nDistinguishing rates, ratios, and proportions is fundamental to interpreting epidemiological data. Incidence rate is a true rate (includes time); case fatality rate is actually a proportion (deaths/cases, no time element despite the name)."
    difficulty: easy
    tags: [rate, ratio, proportion, epidemiology, biostatistics]
  - front: "What are the special health considerations for refugees arriving in Canada?"
    back: "Refugees have forced migration due to well-founded fear of persecution and are given protection by the Government of Canada.\n\nHealth challenges:\n- Post-traumatic stress disorders and depression\n- Adjustment problems\n- Diseases from country of origin (e.g., malaria, TB, onchocerciasis)\n- Direct and indirect effects of war (trauma, injury)\n- Long-standing lack of access to health care (chronically neglected problems)\n\nHealthcare access: Partial health coverage via Interim Federal Health Program (IFHP) for refugee claimants\n\nKey interventions:\n- Vaccinations and catch-up immunization\n- Women's health and mental health services\n- Comprehensive medical exam\n- Dental and vision screening\n- Political advocacy\n- Language training and workplace support\n- Community integration support\n\nThe IFHP provides basic coverage to refugee claimants pending determination. Physicians should be aware that refugees may have untreated chronic conditions and significant mental health burden from trauma and displacement."
    difficulty: medium
    tags: [refugees, immigrant health, PTSD, IFHP, public health, Canada]
  - front: "What are the key health disparities and interventions for people experiencing homelessness?"
    back: "Definition: An individual who lacks permanent housing or adequate housing.\n\nHealth risks:\n- Exposure to temperature extremes\n- Exposure to communicable diseases in shelters\n- Greater risk of experiencing violence due to lack of housing and protection\n- Higher rates of adverse childhood events leading to substance use\n- Mental illness, addictions, food insecurity\n\nDeterminants: Low income, mental illness, substance use\n\nInterventions:\n- Housing First policies (stable housing as prerequisite for addressing other health issues)\n- Safe housing\n- Addictions support\n- Mental health services\n\nHousing First is an evidence-based approach to homelessness showing that providing stable housing first (before addressing mental health or substance use) leads to better outcomes across all domains. This is a key policy position in Canadian public health."
    difficulty: medium
    tags: [homelessness, Housing First, social determinants, mental health, public health, Canada]
  - front: "What are the steps of a community needs assessment?"
    back: "A community needs assessment studies a community's health gaps, pairs identification of gaps with existing resources and strengths to find solutions. Steps:\n\n1. Define the community and understand its history and demographic characteristics to provide context for data collection\n2. Understand what matters to community stakeholders (e.g., interviews, surveys, focus groups)\n3. Use evidence (e.g., mortality rate, feasibility) to prioritize each concern\n4. Identify barriers that may prevent a concern from being addressed and propose solutions using community-based resources\n\nStrongly values interviewing community members to gather their concerns and proposed solutions.\n\nCommunity needs assessments are participatory and community-centered — a key distinction from top-down public health approaches. Involving community members in identifying problems and solutions is central to effective health promotion."
    difficulty: easy
    tags: [community needs assessment, health promotion, community health, public health, participatory]
  - front: "What is the opioid crisis in Canada — key statistics and commonly involved substances?"
    back: "Key statistics (from Health Canada):\n- In 2018: 4,460 apparent opioid-related deaths in Canada\n- 5,019,490 hospitalizations and 17,000 emergency services related to opioids\n- Individuals aged 25–34 are at greatest risk of overdose death (1 in 6 deaths)\n- Most commonly unintentional\n\nMost commonly involved substances: Heroin, fentanyl, hydromorphone\n\nHighest rates: British Columbia — approximately 300 per million British Columbians died in relation to opioid use in 2017\n\nOntario: ~1,250 deaths from opioids; fentanyl involved in more than 70% of cases\n\nNote: Fentanyl is approximately 100× more potent than morphine; illicitly manufactured fentanyl has driven the crisis.\n\nThe opioid crisis is a defining Canadian public health emergency. Fentanyl contamination of the drug supply, combined with inadequate treatment access, has driven unprecedented overdose death rates, particularly in British Columbia."
    difficulty: easy
    tags: [opioid crisis, fentanyl, overdose, public health emergency, Canada, harm reduction]
  - front: "What are the three main federal agencies responsible for public health in Canada and their specific roles?"
    back: "1. Health Canada:\n   - Provides health services to Canadian military and veterans\n   - Provides non-insured health benefits (NIHB) to status First Nations and Inuit; funds healthcare on reserve\n   - Approves new drugs and medical devices\n   - Maintains Canada's Food Guide\n\n2. Public Health Agency of Canada (PHAC):\n   - Main Government of Canada agency responsible for public health\n   - Created post-SARS; focuses on chronic disease prevention, injury prevention, and emergency response\n   - Activities include CTFPHC guideline secretariat, immigration screening\n   - Liaises with WHO\n\n3. Canadian Food Inspection Agency (CFIA):\n   - Regulates federal food safety, labelling, and recalls\n   - Deals with animal-related infections (zoonoses)\n\nUnderstanding the jurisdictional division of public health responsibilities in Canada is essential for the MCCQE1. Health Canada is the regulator; PHAC is the public health operations agency; CFIA handles food safety."
    difficulty: easy
    tags: [Health Canada, PHAC, CFIA, federal health agencies, Canada, public health]
  - front: "What are the nutritional trials conducted on Indigenous peoples in Canada and their ethical violations?"
    back: "From 1942–1952, nutritional scientists (with Canadian government involvement) performed unethical research on Indigenous people, including the James Bay Survey on Attawapiskat and Rupert's House Cree First Nations.\n\nLead scientist: Dr. Frederick Tisdall (inventor of Pablum, former president of Canadian Paediatric Society).\n\nEthical violations:\n- Lack of informed consent from parents or children\n- Indigenous children kept malnourished over two years to establish a baseline\n- One group given a flour mix not yet approved for sale — caused anemia, contributing to morbidity/possibly mortality, with no therapeutic intervention\n- Dental care denied to observe progression of cavities and gingivitis in setting of malnutrition\n\nHealth impacts of sustained caloric restriction:\n- Height stunting\n- Physiological changes to prioritize fat over lean mass\n- Increased risk of developing type 2 diabetes\n- Stunting negatively impacts neurological, psychological, and immune systems\n- Intergenerational: other generations at risk of higher BMI and obesity (fat-mass accumulation when nutrition becomes available)\n\nThese unethical experiments, like residential schools, represent the use of medicine as a tool of colonial oppression. The health legacy — including metabolic programming toward obesity and diabetes — is a direct cause of contemporary health disparities."
    difficulty: medium
    tags: [nutritional trials, Indigenous research ethics, colonization, type 2 diabetes, Canada, research ethics]
  - front: "What is health intersectionality and health stigma?"
    back: "Health intersectionality: The concept that an individual's various social identities (e.g., race, weight, sex, class, ability) can combine and overlap to create unique experiences of health discrimination and/or privilege. No single aspect of identity fully determines one's health experience.\n\nHealth stigma: The reduction of a person's identity to negative stereotypes about their health status (e.g., weight stigma). Stigma may:\n- Limit patient trust in healthcare providers\n- Reduce healthcare quality\n- Reduce accessibility of care\n\nClinical application: An intersectional lens is required when caring for marginalized populations — e.g., a racialized LGBTQ+ person faces compounded barriers compared to either group alone.\n\nIntersectionality, originally developed by legal scholar Kimberlé Crenshaw, has been adopted in public health to explain why some individuals face compounded health disadvantages. Weight stigma in healthcare is a well-documented barrier to care."
    difficulty: medium
    tags: [intersectionality, health stigma, social determinants, equity, public health]
