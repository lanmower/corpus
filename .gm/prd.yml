- id: css-wire-or-remove-dead-mobile-classes
  title: Wire or remove dead CSS classes .tutor-collapsed-mobile + body.tutor-panel-collapsed (style.css:1928,1934) never set by JS; body padding-bottom:50vh always applied even when collapsed
  phase: EXECUTE
  status: completed
  witness: test.js asserts body.tutor-sheet-open wired in css+JS (pass); applyResponsiveWidth toggles document.body.classList tutor-sheet-open
- id: css-theme-error-pill-colors
  title: 'Replace hardcoded error pill colors #fde2e2/#a11 (style.css:1214) with theme tokens so unavailable state respects dark/contrast themes'
  phase: EXECUTE
  status: completed
  witness: 'test.js asserts no #fde2e2|#a11 in css (pass); style.css:1221 uses var(--panel-2)/var(--warn)'
- id: fix-collapsed-trigger-inside-hidden-chatroot
  title: Collapsed robot trigger rendered inside chatRoot which is display:none when collapsed (tutor-panel.js:99-105,305); render collapsed affordance outside chatRoot so it is actually clickable
  phase: EXECUTE
  status: completed
  witness: 'browser-3: collapse btn aria-expanded toggles true on open, panel expands to 310.8px; collapsed render returns empty vdom, toggle btn + strip-click are the affordances'
- id: perf-throttle-per-token-render
  title: Throttle/rAF-batch sdkRender() called on every streamed token (tutor-panel.js:484) — full AICat vdom rebuild per chunk is janky on long threads
  phase: EXECUTE
  status: completed
  witness: tutor-panel.js scheduleStreamRender() rAF-batches; token handler calls scheduleStreamRender not sdkRender; test.js no longer fails on render path
- id: fix-sdk-autoscroll-on-stream
  title: Ensure SDK chat auto-scrolls to bottom on new tokens/messages when user is stuck-to-bottom (fallback has isAtBottom logic, SDK path relies on AICat) — tutor-panel.js:481-486
  phase: EXECUTE
  status: completed
  witness: tutor-panel.js keepScrolledToBottom() pins .chat-thread when stuck; called from scheduleStreamRender + addTutorMessage; AICat also has IntersectionObserver autoscroll (247420.js Dt)
- id: status-reflect-model-load-on-open
  title: 'Reflect model load progress in status pill on panel open: init calls ensureLoaded at boot (tutor.js:181) so download starts eagerly, but pill shows ''starting…'' with no progress; emit immediate loading status + preload trigger on first expand'
  phase: EXECUTE
  status: completed
  witness: 'browser-5: statusPill=''⏳ downloading Bonsai-1.7B (1-bit)'' statusData=''loading'' after open — preloadTutorModel fires on expand, pill reflects load'
- id: block-send-before-ready
  title: sendTutorMessage (tutor-panel.js:411) only blocks on isThinking/unavailable, not modelStatus!=='ready'; during loading/downloading the message posts silently with no thinking indicator. Show loading state + optimistic isThinking on send.
  phase: EXECUTE
  status: completed
  witness: tutor-panel.js sendTutorMessage sets isThinking=true optimistically + toast 'Loading the coach…' when modelStatus!=='ready'; test.js asserts isThinking optimistic (pass)
- id: interrupted-marker-as-metadata
  title: Interrupted replies persist ' …⏹' into message text (tutor-panel.js:497) so the stop marker reloads forever AND feeds back into model context; store interrupted as turn metadata, render marker in UI only
  phase: EXECUTE
  status: completed
  witness: test.js asserts turn.interrupted=true metadata + no 'clean + …⏹' text baking (pass); UI renders '…[stopped]' only in messages map
- id: fix-status-pill-sdk-element
  title: 'setStatus queries #tutor-status-pill (tutor-panel.js:434) which only exists in fallback DOM; in SDK mode the data-status color states never apply. Drive status through sdkRender state, not DOM query.'
  phase: EXECUTE
  status: completed
  witness: 'browser-5: statusPill present in #tutor-hdr-controls with data-status=''loading'' — pill now renders in SDK path via updateHeaderControls overlay (was null in browser-3)'
- id: fix-examdaysleft-hardcoded
  title: app.js:354 examDaysLeft hardcoded to 30 fed into session-overview plan; real value available via srs.daysUntilExam() (app.js:2063) + cfg.examDate (app.js:2197). Wire the real exam date so coach urgency advice is correct.
  phase: EXECUTE
  status: completed
  witness: test.js asserts no 'const examDaysLeft = 30' + srs.daysUntilExam() present in app.js (pass); app.js:355 uses srs.daysUntilExam()
- id: fix-clear-during-generation-kv-race
  title: clearConversation (tutor-panel.js:344) posts reset-history mid-generation which disposes pastKV (tutor.js:194) while runChat may be mid-generate using it — reintroduces the use-after-free the stop-path avoids. Interrupt-first or ignore reset while generating.
  phase: EXECUTE
  status: completed
  witness: tutor-panel.js clearConversation posts stop before reset-history when isThinking; tutor.js reset-history guards on state.generating, interrupts first (no mid-gen KV dispose)
- id: fix-isthinking-stuck-timeout
  title: isThinking set true on send/coaching-start but if worker crashes with no event it stays true forever, permanently disabling composer (tutor.js:110, tutor-panel.js:529). Add client-side generation timeout to reset thinking + surface error.
  phase: EXECUTE
  status: completed
  witness: test.js asserts armThinkingWatchdog + THINKING_TIMEOUT_MS (pass); watchdog armed on send/start/token, cleared on all terminal events
- id: fix-concurrent-sends-during-load
  title: sendTutorMessage guards on isThinking but isThinking only set true on coaching-start (after model load); during load window extra sends pass the guard and queue multiple user-messages. Set isThinking optimistically on send.
  phase: EXECUTE
  status: completed
  witness: tutor-panel.js sendTutorMessage sets isThinking=true before postMessage so the isThinking guard rejects rapid duplicate sends during load window; test.js asserts optimistic isThinking (pass)
- id: settings-add-width-slider
  title: config.panelWidth (default 30%, tutor-store.js:15) is read for desktop width but settings popover (tutor-panel.js:166-169) has no width control. Add a width slider (or remove orphan config).
  phase: EXECUTE
  status: completed
