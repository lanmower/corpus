# Gastroenterology Esophagus (Gastroenterology) - generated from srs-mccqe1
cards:
  - front: "What is Zenker's diverticulum and how is it treated?"
    back: "Zenker's diverticulum is the most common form of esophageal diverticulum. It is a posterior pharyngeal outpouching, most often on the left side, above the cricopharyngeal muscle and below the inferior pharyngeal constrictor muscle.\n\nSymptoms: dysphagia, regurgitation of undigested food, halitosis.\n\nTreatment:\n- Small and asymptomatic: no treatment required\n- Large and symptomatic: endoscopic or surgical myotomy of cricopharyngeal muscle + surgical excision of the sac\n\nZenker's diverticulum results from a defect at Killian's triangle where the inferior pharyngeal constrictor and cricopharyngeal muscle meet. Food accumulates and regurgitates, causing halitosis and aspiration risk. Treatment targets the cricopharyngeal muscle dysfunction."
    difficulty: medium
    tags: [Zenkers diverticulum, esophageal diverticulum, dysphagia, halitosis, gastroenterology]
  - front: "What is a peptic stricture and how is it managed?"
    back: "A peptic stricture is a smooth, concentric narrowing most commonly seen in the lower esophagus, resulting from GERD-induced esophagitis and scarring.\n\nClinical features: dysphagia alongside a long history of reflux, but reflux symptoms may paradoxically disappear as the stricture develops (because food is retained above the narrowing).\n\nDiagnosis: endoscopy (or barium study if endoscopy is contraindicated/unavailable).\n\nTreatment: endoscopic dilatation and indefinite PPI therapy.\n\nThe disappearance of heartburn with new-onset dysphagia in a GERD patient should raise suspicion for peptic stricture. Endoscopic dilatation relieves the narrowing; indefinite PPI prevents re-stricturing."
    difficulty: medium
    tags: [peptic stricture, GERD, dysphagia, dilatation, PPI, gastroenterology]
  - front: "What is Plummer-Vinson syndrome and what is its triad?"
    back: "Plummer-Vinson syndrome is a rare condition (prevalence <1 in 1,000,000) characterized by the triad: (1) iron deficiency anemia, (2) dysphagia, and (3) esophageal webs (upper esophagus).\n\nPrognosis is good when treated with iron supplementation and esophageal dilatation.\n\nEsophageal webs are eccentric smooth extensions of normal esophageal tissue (mucosa and submucosa) in the upper esophagus. The association with iron deficiency anemia is the hallmark of Plummer-Vinson syndrome. Treatment of the iron deficiency often leads to resolution."
    difficulty: medium
    tags: [Plummer-Vinson syndrome, iron deficiency anemia, esophageal webs, dysphagia, gastroenterology]
  - front: "What is a Schatzki ring and how does it present?"
    back: "A Schatzki ring is a mucosal ring at the squamocolumnar junction (lower esophagus). It causes intermittent dysphagia with solids. Treatment involves disrupting the ring with endoscopic dilation.\n\nSchatzki rings are circumferential narrowings at the gastroesophageal junction. Unlike peptic strictures, the dysphagia is typically intermittent rather than progressive. Endoscopic disruption is curative in most cases."
    difficulty: easy
    tags: [Schatzki ring, squamocolumnar junction, dysphagia, esophageal ring, gastroenterology]
  - front: "What is eosinophilic esophagitis (EoE), how does it present, and how is it treated?"
    back: "EoE is an eosinophilic infiltrate of the esophageal epithelium, usually primary but can be secondary. Often associated with allergies. Most characteristically occurs in young men.\n\nPresentation: dysphagia and food impaction.\n\nDiagnosis: endoscopic biopsy (mucosal rings seen at endoscopy on endoscopy).\n\nTreatment:\n(a) Diet — trial exclusion of milk, soy, eggs, wheat, peanuts/tree nuts, seafood (6-food elimination)\n(b) PPI\n(c) Swallowed topical corticosteroid (fluticasone or orodispersible budesonide)\n(d) Rarely prednisone\n(e) Biologic therapy (dupilumab)\n\nEoE is distinct from GERD-induced eosinophilia. The 6-food elimination diet can identify triggering allergens. Swallowed topical steroids (not inhaled) are the primary pharmacological therapy. Dupilumab (IL-4/IL-13 blocker) is a newer biologic option."
    difficulty: medium
    tags: [eosinophilic esophagitis, EoE, food impaction, dysphagia, dupilumab, gastroenterology]
  - front: "What are the most common causes of infectious esophagitis, and what is the characteristic appearance and treatment of each?"
    back: "1. Candida (most common): whitish-yellow plaques without visible ulceration. Treatment: nystatin swish-and-swallow for simple infection; ketoconazole or fluconazole for severe/systemic.\n\n2. HSV (second most common): focal ulcers. Treatment: often self-limiting; acyclovir, valacyclovir, or famciclovir.\n\n3. CMV: focal ulcers (particularly in immunocompromised). Treatment: IV ganciclovir, famciclovir, or oral valganciclovir.\n\nRisk factors: DM, chemotherapeutic agents, immunocompromised states.\nCharacteristic symptom: odynophagia (less often dysphagia).\n\nInfectious esophagitis is predominantly a disease of immunocompromised patients. Candida causes white plaques (thrush), while HSV and CMV cause discrete ulcers. Odynophagia is more characteristic than dysphagia. Diagnosis requires endoscopic visualization with biopsy/brushing."
    difficulty: medium
    tags: [infectious esophagitis, Candida, HSV, CMV, immunocompromised, gastroenterology]
