# Family Medicine Dementia (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the leading causes of dementia in Canada and their relative prevalences?"
    back: "Alzheimer's disease: 40–50%. Mixed dementia: 20–25%. Lewy-Body dementia: 5–15%. Vascular dementia: 5–10%. Frontotemporal dementia: 5–10%. Overall: 15% of Canadians ≥65 years are living with dementia; risk doubles every 5 years after age 65.\n\nAlzheimer's disease is the most common form. Vascular and mixed dementias have the highest prevalence of co-morbid depression. Depression prevalence in dementia ranges from 20–60%, with major depression decreasing as dementia severity increases. Screening for depression is an important ongoing component of dementia management."
    difficulty: easy
    tags: [dementia, Alzheimers, epidemiology, Canada, family medicine, psychiatry]
  - front: "What investigations are used to work up dementia, and what reversible causes must be excluded?"
    back: "Best screening tool: MOCA (Montreal Cognitive Assessment). Also use MMSE, Dementia Quick Screen, history, physical exam. Investigations to exclude reversible causes: CBC, liver enzymes, TSH (hypothyroidism), renal function, serum electrolytes, serum calcium, serum glucose, vitamin B12, folate, VDRL (syphilis), HIV, head CT. The Mini-Cog (3 words recalled + clock drawing — numbers and hands showing 10:10) is used for quick screening.\n\nReversible causes of dementia include hypothyroidism, B12/folate deficiency, syphilis, HIV, normal pressure hydrocephalus (triad: gait apraxia, urinary incontinence, cognitive decline), and medication effects. MOCA is more sensitive than MMSE for mild cognitive impairment. The Mini-Cog takes ~3 minutes and is practical in primary care."
    difficulty: medium
    tags: [dementia, MOCA, MMSE, reversible causes, investigations, family medicine]
  - front: "What pharmacologic agents are used to slow dementia progression and manage behavioral symptoms?"
    back: "To slow cognitive decline: N-methyl-D-aspartate (NMDA) receptor antagonists (e.g., memantine) and cholinesterase inhibitors (e.g., donepezil, rivastigmine, galantamine). For behavioral and emotional symptoms: low-dose antipsychotics and antidepressants.\n\nCholinesterase inhibitors are first-line for Alzheimer's disease and Lewy-Body dementia (where they improve cognition and hallucinations). Memantine is used for moderate-to-severe Alzheimer's and can be combined with cholinesterase inhibitors. Antipsychotics in elderly patients with dementia carry a black box warning for increased mortality from cardiovascular events and infections."
    difficulty: medium
    tags: [dementia, cholinesterase inhibitors, memantine, pharmacology, Alzheimers, family medicine]
