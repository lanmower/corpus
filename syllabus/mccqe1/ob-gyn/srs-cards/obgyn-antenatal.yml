# Antenatal Care & Normal Pregnancy (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What are the components of the first prenatal visit in Canada?"
    back: "Confirm pregnancy (urine hCG), dating ultrasound if uncertain, medical/obstetric history, blood tests (CBC, blood type/Rh, antibody screen, rubella immunity, VDRL, HBsAg, HIV, urine C&S, Pap if due), genetic counseling\n\nSOGC Prenatal Care Guidelines recommend first prenatal visit ideally in first trimester (<10 weeks). Blood tests at first visit are standard. Pap test if due. Offer genetic screening (NIPT or maternal serum screening). Assess psychosocial risk factors and domestic violence."
    difficulty: easy
    tags: [first prenatal visit, antenatal care, prenatal screening, SOGC, obgyn]
  - front: "What is the recommended folic acid supplementation in pregnancy?"
    back: "0.4-1.0 mg/day for low-risk women starting 3 months before conception and continuing through first trimester (12 weeks); 4-5 mg/day for high-risk women (prior NTD, antiepileptics, diabetes, obesity)\n\nSOGC guidelines: folic acid supplementation prevents neural tube defects (NTDs) by 50-70%. High-risk: personal or family history of NTDs, valproate or carbamazepine use (which antagonize folate). All women should take folic acid before attempting conception."
    difficulty: easy
    tags: [folic acid, neural tube defects, pre-conceptional care, SOGC, obgyn]
  - front: "When is Rh immunoglobulin (RhIG, WinRho) indicated in pregnancy?"
    back: "All Rh-negative women: prophylactically at 28 weeks (300 μg) AND within 72 hours postpartum if newborn is Rh-positive; also after any sensitizing event (threatened abortion, amniocentesis, antepartum hemorrhage, trauma)\n\nSOGC RhIG guidelines: RhIG prevents maternal Rh alloimmunization which causes hemolytic disease of the fetus and newborn in future pregnancies. Kleihauer-Betke test quantifies fetomaternal hemorrhage to determine if additional doses needed. Cord blood Rh type must be checked at delivery."
    difficulty: medium
    tags: [Rh immunoglobulin, WinRho, Rh alloimmunization, SOGC, obgyn]
  - front: "What is the first trimester screening for Down syndrome in Canada?"
    back: "First trimester combined screening (FTCS): nuchal translucency measurement (10-14 weeks) + PAPP-A + free beta-hCG = Down syndrome detection rate 80-90% (with 5% screen-positive rate); NIPT (cell-free DNA) has >99% detection rate\n\nSOGC prenatal screening guidelines recommend offering all women screening for aneuploidy. NIPT is preferred for high-risk patients (increased NT, age ≥40, prior affected pregnancy). NIPT positive result should be confirmed with diagnostic testing (CVS or amniocentesis) before termination of pregnancy."
    difficulty: medium
    tags: [Down syndrome screening, NIPT, nuchal translucency, first trimester, SOGC, obgyn]
  - front: "What is gestational diabetes mellitus (GDM) and how is it screened for in Canada?"
    back: "GDM: glucose intolerance first detected in pregnancy; screen all women at 24-28 weeks with 75g OGTT (Diabetes Canada) or 50g GCT followed by 100g GTT (traditional); diagnosis with ≥1 abnormal value on 75g OGTT\n\nDiabetes Canada/SOGC recommend 75g OGTT at 24-28 weeks as primary screening test. GDM management: medical nutrition therapy first, then insulin if targets not met (fasting <5.3, 1h post-meal <7.8, 2h <6.7 mmol/L). Metformin is acceptable as second-line per SOGC."
    difficulty: medium
    tags: [GDM, gestational diabetes, OGTT, screening, SOGC, obgyn]
  - front: "What is Group B Streptococcus (GBS) screening and when is intrapartum prophylaxis indicated?"
    back: "Vaginal-rectal swab at 35-37 weeks; prophylaxis: IV penicillin G during labour if GBS-positive, prior GBS bacteriuria in current pregnancy, unknown GBS status with risk factors (fever in labour, ROM >18h, preterm labour <37 weeks)\n\nSOGC GBS guidelines: penicillin G is first-line prophylaxis; ampicillin as alternative; clindamycin if PCN allergy (based on sensitivities). GBS-positive patients receiving intrapartum prophylaxis have <1% transmission rate. GBS prophylaxis starts with active labour."
    difficulty: medium
    tags: [GBS, Group B Streptococcus, intrapartum prophylaxis, penicillin, SOGC, obgyn]
  - front: "What routine monitoring is recommended at each prenatal visit?"
    back: "Blood pressure, urine dipstick (proteinuria), fundal height measurement (from 20 weeks), fetal heartbeat (Doppler from 10-12 weeks), fetal movements (from 28 weeks), weight, and review of concerns\n\nSOGC prenatal visit schedule: monthly to 28 weeks, every 2 weeks to 36 weeks, weekly from 36 weeks until delivery. Fundal height: 1cm per week after 20 weeks correlates with gestational age ± 2 weeks. Routine urinalysis screens for proteinuria (preeclampsia) and infection."
    difficulty: easy
    tags: [prenatal visit, routine monitoring, fundal height, blood pressure, obgyn]
  - front: "What is the anatomy ultrasound and when is it done?"
    back: "Detailed anatomical ultrasound at 18-22 weeks assesses fetal growth, placental location, amniotic fluid, cervical length, and fetal anatomy (brain, face, spine, heart, abdomen, limbs)\n\nSOGC recommends second-trimester anatomy ultrasound for all pregnancies. Identifies major structural anomalies (CHD, NTD, abdominal wall defects). Short cervix (<25mm at 20-24 weeks) increases preterm birth risk — consider cerclage or vaginal progesterone."
    difficulty: easy
    tags: [anatomy ultrasound, 20 weeks, fetal anatomy scan, SOGC, obgyn]
  - front: "What is preterm labour and how is it managed?"
    back: "Preterm labour: regular contractions + cervical change before 37 weeks; management: corticosteroids (betamethasone 12mg IM q24h x2 doses) for fetal lung maturity at 24-34 weeks, tocolysis (nifedipine) to delay delivery by 48h for steroid effect, transfer to tertiary centre\n\nSOGC guidelines: antenatal corticosteroids reduce RDS, IVH, and neonatal mortality. Tocolysis provides 24-48h delay (not long-term). Magnesium sulfate for neuroprotection at <32 weeks (reduces cerebral palsy). GBS prophylaxis for GBS-positive or unknown status in preterm labour."
    difficulty: hard
    tags: [preterm labour, betamethasone, tocolysis, neonatal corticosteroids, SOGC, obgyn]
  - front: "A 36-week patient reports decreased fetal movement. What is the appropriate assessment?"
    back: "Non-stress test (NST) to assess fetal wellbeing; reactive NST (2+ accelerations of ≥15 bpm for ≥15 sec in 20 min) = reassuring; non-reactive NST → biophysical profile (BPP)\n\nSOGC guidelines: decreased fetal movement is associated with placental insufficiency and stillbirth. Kick counts: 6 movements in 2 hours is reassuring. Non-reactive NST requires BPP (5 parameters: NST, tone, movement, breathing, amniotic fluid volume). BPP score 8-10/10 = reassuring."
    difficulty: medium
    tags: [fetal movement, NST, biophysical profile, fetal wellbeing, obgyn]
  - front: "What are the indications for antenatal corticosteroids (ACS)?"
    back: "Antenatal corticosteroids (betamethasone 2x12mg IM 24h apart) indicated for anticipated preterm delivery at 24-34+6 weeks; consider at 34-36+6 weeks for late preterm; repeat course considered after 7+ days if still <34 weeks\n\nSOGC guidelines: ACS reduce neonatal RDS, IVH, NEC, and mortality. Best effect when delivery occurs 24h-7 days after first dose. Tocolysis to delay delivery 48h allows completion of course. Does not improve outcome if given at ≥37 weeks."
    difficulty: medium
    tags: [antenatal corticosteroids, betamethasone, preterm birth, fetal lung maturity, obgyn]
  - front: "What is the physiology of normal pregnancy changes that affect drug metabolism and dosing?"
    back: "Increased blood volume (40%), GFR increases 40-50% (drug clearance), plasma albumin decreased (more free drug), gastric motility slowed (delayed absorption), hepatic CYP450 activity altered\n\nPharmacokinetic changes require dose adjustments in pregnancy. Increased GFR: renally-cleared drugs (ampicillin, LMWHs) require higher or more frequent dosing. Decreased albumin: highly protein-bound drugs (phenytoin) have increased free levels. Progesterone inhibits gastric motility."
    difficulty: medium
    tags: [pregnancy pharmacokinetics, drug metabolism, GFR in pregnancy, obgyn]
  - front: "What are absolute contraindications to vaginal birth after cesarean (VBAC)?"
    back: "Prior classical uterine incision (vertical upper segment), prior uterine rupture, more than 2 prior cesareans (relative contraindication), active genital herpes, placenta previa, cord prolapse\n\nSOGC VBAC guidelines: low transverse cesarean scar does not preclude TOLAC (trial of labour after cesarean). VBAC success rate ~60-80%. Benefits: avoid major surgery, faster recovery. Risks: uterine rupture (0.5-1%). Continuous EFM required during TOLAC."
    difficulty: medium
    tags: [VBAC, TOLAC, cesarean section, uterine rupture contraindications, obgyn]
  - front: "What is the impact of obesity on pregnancy outcomes?"
    back: "Pre-pregnancy obesity (BMI ≥30) increases risk of: GDM, preeclampsia, preterm birth, cesarean delivery, stillbirth, neural tube defects, shoulder dystocia, maternal VTE, anesthetic complications\n\nSOGC obesity guidelines: BMI should be measured and documented at first prenatal visit. GWG (gestational weight gain) targets: BMI 30-34.9: 5-9 kg; BMI ≥35: 0-6 kg. Bariatric surgery patients: monitor for nutritional deficiencies (iron, B12, folate). Thromboprophylaxis if additional risk factors."
    difficulty: medium
    tags: [obesity in pregnancy, GDM, preeclampsia, gestational weight gain, obgyn]
  - front: "What is normal labor and what are the stages?"
    back: "First stage: cervical dilation — latent phase (0-6 cm, variable duration), active phase (6-10 cm, ≥0.5 cm/h in nulliparous); Second stage: pushing to delivery (up to 3h with epidural, up to 2h without); Third stage: placental delivery (≤30 min)\n\nSOGC Labour and Delivery guidelines: active phase of labour starts at 6 cm (updated from 4 cm in recent guidelines). Prolonged second stage: consider assisted delivery (forceps/vacuum). Active management of third stage: oxytocin, controlled cord traction, uterine massage."
    difficulty: easy
    tags: [labour stages, cervical dilation, active phase, SOGC, obgyn]
  - front: "What is the GDM screening protocol in Canada?"
    back: "Universal screening at 24-28 weeks with 50g GCT. If >=7.8: 75g OGTT (fasting>=5.3, 1h>=10.6, 2h>=9.0 — one abnormal = GDM)\n\nSOGC/CDA guidelines. Alternative: 75g OGTT directly. GDM management: MNT first, then insulin if targets not met. Metformin/glyburide considered second-line. Postpartum 75g OGTT at 6-12 weeks."
    difficulty: medium
    tags: [GDM, screening, SOGC]
  - front: "What is the recommended screening approach for gestational diabetes mellitus in Canada?"
    back: "SOGC/Diabetes Canada: screen ALL pregnant women at 24-28 weeks. Preferred approach: 50g glucose challenge test (GCT). If 1h value 7.8-11.0 mmol/L: proceed to 75g 2h OGTT. GDM diagnosed if ANY of: fasting >=5.3, 1h >=10.6, 2h >=9.0 mmol/L. If GCT >=11.1: GDM diagnosed (no need for OGTT). Screen earlier if high risk (BMI >30, previous GDM, ethnicity).\n\nSOGC 2019 GDM guidelines offer two approaches. Alternative: one-step 75g OGTT (IADPSG criteria: fasting >=5.1, 1h >=10.0, 2h >=8.5). Canadian provinces vary in preferred approach. GDM affects 5-12% of Canadian pregnancies and is increasing with obesity prevalence."
    difficulty: hard
    tags: [GDM, gestational diabetes, screening, OGTT, obstetrics]
  - front: "What is the management of gestational diabetes?"
    back: "Step 1: Nutritional counseling (dietitian referral) + glucose monitoring (fasting <5.3, 1h postprandial <7.8, 2h <6.7 mmol/L) + exercise. Step 2 (if targets not met in 1-2 weeks): insulin (first-line per SOGC) or metformin (second-line). Glyburide is less preferred (higher neonatal hypoglycemia). Fetal surveillance: growth ultrasound q4 weeks, NST starting 36 weeks. Delivery: 38-39 weeks if insulin-requiring, 39-40 weeks if diet-controlled.\n\nSOGC recommends insulin as first-line pharmacotherapy for GDM. Metformin crosses the placenta but is an acceptable alternative per SOGC. Postpartum: glucose tolerance test at 6 weeks to 6 months (50% of GDM women develop type 2 DM within 5-10 years)."
    difficulty: hard
    tags: [GDM management, insulin, glucose monitoring, obstetrics]
  - front: "What are the routine antenatal investigations at the first prenatal visit?"
    back: "CBC, blood type and Rh, antibody screen, rubella immunity, syphilis (RPR/VDRL), HIV, HBsAg, urine culture and urinalysis, cervical cytology (if due), GC/chlamydia NAAT. Consider: HCV screening, TSH if symptomatic, varicella immunity if unknown, 50g GCT if high-risk for GDM. Offer first-trimester screening (11-14 weeks): NT + PAPP-A + free hCG.\n\nSOGC guidelines recommend HIV and syphilis screening for ALL pregnant women. Universal prenatal screening is a cornerstone of Canadian perinatal care. Congenital syphilis is resurging in Canada-repeat RPR in third trimester in high-risk populations. Group B Strep screening at 35-37 weeks."
    difficulty: medium
    tags: [antenatal screening, prenatal investigations, SOGC, obstetrics]
  - front: "What prenatal genetic screening options are available in Canada?"
    back: "First trimester (11-14w): NT + PAPP-A + free beta-hCG (FTS). Second trimester (15-20w): quad screen (AFP, hCG, estriol, inhibin A). Integrated: FTS + quad. Cell-free fetal DNA (NIPT): sensitivity >99% for trisomy 21, available >=10 weeks. NIPT is not diagnostic-abnormal results require confirmatory diagnostic testing (CVS 10-12w or amniocentesis 15-20w).\n\nSOGC recommends offering prenatal screening to all women. NIPT (cell-free DNA) has rapidly become widely available in Canada but is not publicly funded in all provinces except for high-risk populations. CVS carries ~0.1% miscarriage risk, amniocentesis ~0.1%. Results include karyotype and microarray."
    difficulty: hard
    tags: [prenatal screening, NIPT, trisomy 21, genetic screening, obstetrics]
  - front: "What medications are safe, conditionally safe, and contraindicated in pregnancy?"
    back: "Safe: acetaminophen, penicillins, cephalosporins, erythromycin (not estolate), metformin, labetalol, methyldopa, ondansetron. Conditionally safe: SSRIs (paroxetine avoid first trimester), insulin, azithromycin. Contraindicated: ACE inhibitors/ARBs, warfarin, isotretinoin, valproate, methotrexate, tetracyclines, fluoroquinolones, statins, misoprostol, lithium (relative).\n\nSOGC and Motherisk (though now closed, legacy resources exist) provided Canadian-specific guidance on medication safety. ACE inhibitors cause renal dysgenesis. Warfarin causes nasal hypoplasia and CNS abnormalities (6-12 weeks). Category X drugs are absolutely contraindicated regardless of benefit."
    difficulty: hard
    tags: [teratogenic drugs, medication safety, pregnancy, obstetrics]
  - front: "What is the recommended folic acid supplementation for pregnancy?"
    back: "Low risk: folic acid 0.4-1.0 mg/day starting >=3 months preconception through 12 weeks, then continue throughout pregnancy. High risk (previous NTD, epilepsy on AEDs, diabetes, BMI >35, family history of NTD): folic acid 4-5 mg/day starting >=3 months preconception through 12 weeks, then 0.4-1.0mg.\n\nSOGC guidelines emphasize preconception folic acid. Neural tube closure occurs by day 28 (often before pregnancy is recognized). Canadian flour is fortified with folic acid since 1998, which reduced NTD rates by 46%. High-dose folic acid is specifically indicated for women on valproate or carbamazepine."
    difficulty: medium
    tags: [folic acid, NTD prevention, preconception, obstetrics]
  - front: "What is the schedule of routine prenatal visits and what is assessed at each?"
    back: "Visits: q4 weeks until 28w, q2 weeks 28-36w, weekly 36w-delivery. Each visit: BP, weight, urinalysis, fundal height (from 20w, cm=weeks ±2), fetal heart tones (Doppler from 12w). 20w: anatomy ultrasound. 24-28w: GDM screening. 28w: Rh antibody screen (give RhIg 300mcg if Rh-negative). 35-37w: GBS swab.\n\nSOGC guidelines outline the schedule. Dating ultrasound (ideally 11-14w) is the most accurate for gestational age assessment. Fundal height discrepancy >3cm warrants ultrasound for growth assessment. Serial growth scans for high-risk pregnancies (IUGR, GDM, multiple gestation)."
    difficulty: medium
    tags: [prenatal visits, schedule, routine care, obstetrics]
  - front: "What is Rh alloimmunization and how is it prevented?"
    back: "Rh-negative mother exposed to Rh-positive fetal blood produces anti-D antibodies affecting subsequent pregnancies. Prevention: RhIg (Rh immune globulin, WinRho) 300mcg IM at 28 weeks AND within 72h postpartum if baby Rh-positive. Also give RhIg after: miscarriage, ectopic, amniocentesis, CVS, trauma, abruption, version.\n\nSOGC recommends routine RhIg prophylaxis at 28 weeks for all Rh-negative women. Kleihauer-Betke test determines if additional RhIg is needed (>30mL fetomaternal hemorrhage requires additional doses). Anti-D titer monitoring in sensitized pregnancies guides management timing."
    difficulty: hard
    tags: [Rh alloimmunization, RhIg, prevention, obstetrics]
  - front: "What are the types and management of hypertensive disorders of pregnancy?"
    back: "Chronic HTN: pre-existing or <20 weeks. Gestational HTN: new HTN >=20 weeks without proteinuria/end-organ dysfunction. Preeclampsia: HTN + proteinuria or end-organ dysfunction >=20 weeks. Chronic HTN + superimposed preeclampsia. SOGC treatment targets: SBP 110-140, DBP 85-90. Medications: labetalol (first-line), nifedipine, methyldopa.\n\nSOGC 2022 HDP guidelines recommend tighter BP control (target 135/85) per CHIPS trial showing reduced severe HTN episodes. Low-dose ASA (162mg/day from 12-16 weeks) prevents preeclampsia in high-risk women (NNT 72). Calcium supplementation (>=1g/day) if low intake."
    difficulty: hard
    tags: [hypertensive disorders, gestational hypertension, preeclampsia classification, obstetrics]
  - front: "What constitutes a high-risk pregnancy and what additional surveillance is needed?"
    back: "High-risk factors: advanced maternal age (>=35), BMI >=30, previous cesarean, multiple gestation, preexisting conditions (DM, HTN, thyroid, renal, autoimmune), previous adverse outcomes (preeclampsia, PTB, stillbirth, IUGR), substance use. Surveillance: more frequent visits, serial growth US, NST/BPP from 32-34 weeks, early GDM screening, specialist consultation.\n\nHigh-risk pregnancies in Canada are often co-managed between family physicians and obstetricians or maternal-fetal medicine specialists. Biophysical profile (BPP) assesses fetal breathing, movement, tone, amniotic fluid, and NST (score 0-10). BPP <=4 requires delivery consideration."
    difficulty: medium
    tags: [high-risk pregnancy, surveillance, BPP, obstetrics]
  - front: "What is the management of intrauterine growth restriction (IUGR)?"
    back: "Diagnosis: estimated fetal weight <10th percentile (severe <3rd). Workup: detailed anatomy US, umbilical artery Doppler, maternal infections (TORCH), karyotype if anomalies. Monitoring: serial growth US q2 weeks, umbilical artery Doppler (absent/reversed end-diastolic flow is ominous), NST/BPP. Delivery: 37 weeks if stable, earlier if deteriorating Doppler, oligohydramnios, or abnormal NST/BPP. Steroids if <34 weeks.\n\nSOGC guidelines use umbilical artery Doppler as the primary surveillance tool for IUGR. Absent end-diastolic flow increases perinatal mortality 4x; reversed end-diastolic flow increases it 10x. Timing of delivery balances prematurity risk against intrauterine demise. MgSO4 for neuroprotection if <32 weeks."
    difficulty: hard
    tags: [IUGR, growth restriction, Doppler, fetal surveillance, obstetrics]
  - front: "What are the indications for antenatal corticosteroids?"
    back: "Single course of betamethasone (12mg IM x 2 doses, 24h apart) or dexamethasone (6mg IM x 4 doses, 12h apart) for women at risk of preterm delivery between 24+0 and 34+6 weeks. Reduces RDS (50%), IVH, NEC, and neonatal death. Rescue course may be considered if >=7 days since first course and <34 weeks. Not recommended routinely at >=35 weeks.\n\nSOGC guidelines recommend antenatal corticosteroids as one of the most effective perinatal interventions (NNT 12 to prevent one case of RDS). Benefit is maximal 24h-7d after administration. Late preterm steroids (34-36 weeks) may reduce transient tachypnea but increase neonatal hypoglycemia."
    difficulty: hard
    tags: [antenatal corticosteroids, betamethasone, preterm labor, obstetrics]
  - front: "What are the methods and indications for cervical ripening and labor induction?"
    back: "Indications: post-dates (>=41 weeks), PROM at term, preeclampsia, GDM, IUGR, oligohydramnios, chorioamnionitis. Bishop score <6: cervical ripening needed. Methods: prostaglandin E2 (dinoprostone vaginal insert/gel), misoprostol (PGE1) 25mcg vaginal, Foley catheter (mechanical). Bishop >=6: oxytocin induction (start 1-2 mU/min, increase q30min).\n\nSOGC guidelines recommend cervical ripening for unfavorable cervix (Bishop <6). ARRIVE trial showed induction at 39 weeks in nulliparas reduces cesarean rate. Misoprostol is contraindicated with previous cesarean (uterine rupture risk). Oxytocin protocols are standardized in Canadian hospitals."
    difficulty: hard
    tags: [labor induction, cervical ripening, Bishop score, obstetrics]
  - front: "What is the Group B Streptococcus (GBS) prevention strategy in Canada?"
    back: "Universal screening: rectovaginal swab at 35-37 weeks. Intrapartum antibiotic prophylaxis (IAP) for: GBS positive, GBS bacteriuria this pregnancy, previous GBS-affected infant, unknown GBS status with risk factors (preterm <37w, ROM >18h, intrapartum fever >=38°C). IAP: penicillin G 5 million U IV then 2.5-3 million U q4h until delivery (alternative: ampicillin). PCN allergy: cefazolin if low-risk allergy, clindamycin or vancomycin if high-risk.\n\nSOGC recommends universal culture-based screening (not risk-based approach). GBS causes early-onset neonatal sepsis (within 7 days) with 4% mortality. IAP reduces early-onset GBS disease by 80%. GBS status should be re-screened if >5 weeks since initial screen at time of delivery."
    difficulty: hard
    tags: [GBS, Group B Strep, intrapartum antibiotics, obstetrics]
  - front: "What are the key elements of postpartum care in Canada?"
    back: "Immediate: fundal massage, monitor for hemorrhage, initiate breastfeeding within 1h. Hospital stay: 24-48h vaginal, 48-72h cesarean. Postpartum visit at 6 weeks. Screen for: postpartum depression (Edinburgh Postnatal Depression Scale), contraception, breastfeeding issues, wound complications, VTE symptoms. RhIg if indicated. Vaccination (rubella, varicella, Tdap, COVID) if not immune.\n\nCPS and SOGC emphasize the fourth trimester as a critical period. Edinburgh Postnatal Depression Scale (EPDS) score >=13 warrants further assessment. Postpartum depression affects 10-15% of Canadian women. SOGC recommends contraception counseling before discharge as ovulation can occur by 3 weeks postpartum."
    difficulty: medium
    tags: [postpartum care, EPDS, breastfeeding, obstetrics]
  - front: "Describe the prenatal genetic screening options available in Canada: IPS, eFTS, and NIPT. When is each offered and what are their detection rates for trisomy 21?"
    back: "IPS (Integrated Prenatal Screening): first trimester NT + PAPP-A + second trimester quad screen; detection rate ~85%, offered 11–14 wks then 15–20 wks. eFTS (enhanced First Trimester Screening): NT + PAPP-A + free β-hCG + PlGF at 11–14 wks; detection rate ~90%. NIPT (cell-free DNA): offered ≥10 wks; detection rate >99% for trisomy 21, lowest false-positive rate.\n\nIn Ontario, eFTS is publicly funded as first-line screening. NIPT is publicly funded for high-risk pregnancies (age ≥40, positive eFTS, prior aneuploidy). SOGC recommends that all pregnant women be offered screening regardless of age, and that a positive screen requires confirmation with amniocentesis or CVS."
    difficulty: medium
    tags: [prenatal-screening, NIPT, eFTS, IPS, trisomy-21, SOGC]
  - front: "An Rh-negative mother is pregnant with an Rh-positive fetus. When should anti-D immunoglobulin (RhIG) be administered, and what is the Kleihauer-Betke test used for?"
    back: "RhIG is given at 28 weeks gestation (routine antenatal prophylaxis) and within 72 hours of delivery if the newborn is Rh-positive. Also given after any sensitizing event (miscarriage, amniocentesis, trauma, ectopic). The Kleihauer-Betke test quantifies fetomaternal hemorrhage to determine if additional RhIG doses are needed beyond the standard 300 μg.\n\nStandard RhIG (300 μg) covers approximately 30 mL of fetal whole blood. The SOGC recommends Kleihauer-Betke testing after delivery and after significant third-trimester bleeding to calculate additional RhIG doses. Without prophylaxis, Rh sensitization occurs in approximately 16% of Rh-negative women carrying Rh-positive fetuses."
    difficulty: medium
    tags: [Rh-isoimmunization, RhIG, anti-D, Kleihauer-Betke, SOGC]
  - front: "When should pregnant women be screened for Group B Streptococcus (GBS), and what is the intrapartum antibiotic prophylaxis protocol?"
    back: "Screen with vaginal-rectal swab at 35–37 weeks gestation. Intrapartum prophylaxis: IV penicillin G (5 million units loading, then 2.5–3 million units q4h until delivery) is first-line. Ampicillin is an alternative. For penicillin allergy: cefazolin (low risk), clindamycin (if susceptible), or vancomycin (if high-risk allergy and resistant).\n\nGBS colonizes 10–30% of pregnant women and is the leading cause of early-onset neonatal sepsis. The SOGC recommends universal screening at 35–37 weeks. Intrapartum antibiotics are considered adequate if given ≥4 hours before delivery, reducing early-onset GBS disease by approximately 80%."
    difficulty: medium
    tags: [GBS, Group-B-strep, intrapartum-prophylaxis, penicillin, neonatal-sepsis, SOGC]
  - front: "Differentiate symmetric versus asymmetric intrauterine growth restriction (IUGR). What are the common causes and surveillance strategies for each?"
    back: "Symmetric IUGR: proportionally small (head and body), typically early onset (<20 wks), caused by chromosomal anomalies, congenital infections (TORCH), or severe early placental insufficiency. Asymmetric IUGR: head-sparing (abdominal circumference small, head normal), typically late onset (>28 wks), caused by placental insufficiency (preeclampsia, hypertension). Surveillance: serial growth ultrasounds q2–4 wks, umbilical artery Doppler (absent/reversed end-diastolic flow is ominous), BPP, NST.\n\nThe SOGC defines IUGR as estimated fetal weight <10th percentile with abnormal Doppler or <3rd percentile regardless. Umbilical artery Doppler is the primary surveillance tool; absent or reversed end-diastolic flow indicates high risk of fetal demise and warrants urgent delivery consideration. Timing of delivery depends on gestational age and Doppler findings."
    difficulty: hard
    tags: [IUGR, symmetric, asymmetric, Doppler, placental-insufficiency, SOGC]
  - front: "What are the components of a biophysical profile (BPP), and how is it scored?"
    back: "Five components, each scored 0 or 2 (max 10): 1) Fetal breathing movements (≥1 episode of ≥30 sec in 30 min), 2) Gross body movements (≥3 in 30 min), 3) Fetal tone (≥1 episode of flexion/extension), 4) Amniotic fluid volume (single deepest pocket ≥2 cm), 5) Reactive NST (≥2 accelerations in 20 min). Score 8–10 = reassuring; 6 = equivocal (repeat or deliver if ≥37 wks); ≤4 = abnormal (deliver).\n\nThe BPP assesses acute (breathing, movement, tone, NST) and chronic (amniotic fluid) fetal well-being. The SOGC recommends BPP for surveillance in high-risk pregnancies (IUGR, post-dates, diabetes). A modified BPP (NST + AFI only) is a common screening alternative due to shorter assessment time."
    difficulty: medium
    tags: [BPP, biophysical-profile, fetal-surveillance, NST, amniotic-fluid]
  - front: "A woman at 8 weeks gestation reports exposure to a cat litter box. Which TORCH infection is she at risk for, and what is the recommended workup?"
    back: "Toxoplasmosis (from Toxoplasma gondii in cat feces). Workup: IgG and IgM serology. If IgM positive, confirm with IgG avidity testing (low avidity = recent infection). If acute infection confirmed, treat with spiramycin (to reduce vertical transmission) or pyrimethamine + sulfadiazine + folinic acid (if fetal infection confirmed).\n\nCongenital toxoplasmosis can cause chorioretinitis, intracranial calcifications, and hydrocephalus. Risk of fetal transmission increases with gestational age but severity decreases. The SOGC recommends counselling pregnant women to avoid handling cat litter, consuming undercooked meat, and gardening without gloves."
    difficulty: medium
    tags: [TORCH, toxoplasmosis, congenital-infection, spiramycin, SOGC]
  - front: "List the TORCH infections and the classic congenital findings associated with each."
    back: "T – Toxoplasmosis: chorioretinitis, diffuse intracranial calcifications, hydrocephalus. O – Other (syphilis, VZV, parvovirus B19): syphilis → snuffles, Hutchinson teeth, saddle nose; parvovirus → hydrops fetalis. R – Rubella: cataracts, deafness, PDA, blueberry muffin rash. C – CMV: periventricular calcifications, sensorineural hearing loss, microcephaly (most common congenital infection). H – HSV: skin vesicles, encephalitis, disseminated disease.\n\nCMV is the most common congenital infection in Canada, affecting 0.5–1% of newborns. Rubella has become rare due to MMR vaccination. The CPS recommends targeted CMV testing in neonates with compatible symptoms and universal hearing screening to detect CMV-related sensorineural hearing loss early."
    difficulty: medium
    tags: [TORCH, congenital-infections, CMV, rubella, toxoplasmosis, HSV]
  - front: "What is the non-stress test (NST) and how is a reactive result defined?"
    back: "The NST monitors fetal heart rate in response to fetal movement. A reactive NST is defined as ≥2 accelerations of ≥15 bpm above baseline lasting ≥15 seconds within a 20-minute window (for gestational age ≥32 weeks). Before 32 weeks, accelerations of ≥10 bpm for ≥10 seconds are acceptable.\n\nA reactive NST is reassuring and indicates intact fetal autonomic function. A non-reactive NST may be due to fetal sleep cycle (up to 40 minutes), prematurity, or fetal compromise. The SOGC recommends extending monitoring to 40 minutes or using vibroacoustic stimulation before classifying as non-reactive."
    difficulty: easy
    tags: [NST, non-stress-test, fetal-surveillance, accelerations, reactive]
  - front: "During which period of embryonic development is the fetus most vulnerable to teratogens, and why?"
    back: "The critical period is weeks 3–8 of embryonic development (weeks 5–10 gestational age), during organogenesis. Exposure during this period causes major structural malformations because organs are actively forming. Before week 3, the effect is typically all-or-none (miscarriage or no effect). After week 8, teratogens may cause functional defects or growth restriction but fewer structural anomalies.\n\nThis explains why early prenatal care and pre-conception counselling are essential. The SOGC recommends folic acid supplementation starting at least 3 months before conception (0.4–1 mg daily, or 4–5 mg if high risk) to prevent neural tube defects, which form during the critical period at weeks 3–4."
    difficulty: easy
    tags: [teratogens, organogenesis, critical-period, folic-acid, SOGC]
  - front: "A pregnant woman at 20 weeks has a positive quadruple screen for trisomy 21. She asks about definitive diagnostic testing. What are the options and their risks?"
    back: "Amniocentesis (performed at 15–20+ weeks): aspiration of amniotic fluid for karyotype/microarray; procedure-related pregnancy loss risk approximately 0.1–0.3%. Chorionic villus sampling (CVS, performed at 10–13 weeks): biopsy of placental tissue; similar loss risk (~0.1–0.2%). Both provide definitive chromosomal diagnosis. CVS allows earlier diagnosis but carries a small risk of confined placental mosaicism.\n\nThe SOGC recommends that all women with positive screening results be offered genetic counselling and invasive diagnostic testing. NIPT can be used as a secondary screen to reduce unnecessary invasive procedures, but it remains a screening test, not a diagnostic one. Chromosomal microarray is now preferred over conventional karyotype for higher diagnostic yield."
    difficulty: medium
    tags: [amniocentesis, CVS, prenatal-diagnosis, trisomy-21, SOGC, genetic-counselling]
  - front: "What prenatal genetic screening options are available in Canada?"
    back: "First trimester: enhanced FTS (nuchal translucency US + PAPP-A + free beta-hCG, 11-14 weeks). Integrated Prenatal Screening (IPS): first trimester markers + second trimester quad screen (most sensitive non-invasive screen, ~85-90% detection for trisomy 21). NIPT (cell-free fetal DNA): >99% detection rate for trisomy 21, offered to all women, increasingly funded provincially.\n\nSOGC recommends offering screening to all pregnant women regardless of age. NIPT is the most accurate screening test but does not replace diagnostic testing (amniocentesis/CVS) for confirmation. Provincial funding for NIPT varies — some fund for high-risk only, others universally. Genetic counselling should accompany all screening."
    difficulty: medium
    tags: [prenatal-screening, NIPT, IPS, trisomy-21, SOGC]
  - front: "What is Rh isoimmunization and how is it prevented?"
    back: "Rh-negative mother develops anti-D antibodies after exposure to Rh-positive fetal blood, risking hemolytic disease of the fetus/newborn (HDFN) in subsequent pregnancies. Prevention: anti-D immunoglobulin (RhIG/WinRho) 300 mcg IM at 28 weeks and within 72 hours of delivery if newborn is Rh-positive. Also after any sensitizing event (amniocentesis, trauma, miscarriage, ectopic).\n\nSOGC recommends routine anti-D prophylaxis at 28 weeks for all Rh-negative women. Kleihauer-Betke test quantifies fetal-maternal hemorrhage to determine if additional RhIG doses are needed (standard dose covers 30 mL fetal blood). Cell-free fetal DNA can now determine fetal Rh status non-invasively."
    difficulty: medium
    tags: [Rh-isoimmunization, anti-D, RhIG, HDFN, prevention]
  - front: "What are the indications and protocol for Group B Streptococcus (GBS) prophylaxis in pregnancy?"
    back: "Universal screening: GBS culture at 36-37 weeks (vaginal-rectal swab). Intrapartum IV penicillin G (5 million IU loading, then 2.5-3 million IU q4h) indicated for: positive GBS culture, GBS bacteriuria this pregnancy, previous infant with GBS disease, unknown status with risk factors (preterm <37 weeks, ROM >18 hours, intrapartum fever).\n\nSOGC recommends universal culture-based screening over risk-based approach. GBS is the leading cause of neonatal early-onset sepsis. Penicillin is first-line; cefazolin for mild penicillin allergy; clindamycin or vancomycin for severe allergy (based on susceptibility). IAP reduces early-onset GBS disease by 80%."
    difficulty: medium
    tags: [GBS, intrapartum-prophylaxis, penicillin, screening, SOGC]
  - front: "What are the components of the biophysical profile (BPP) and how is it scored?"
    back: "5 components, each scored 0 or 2 (max 10): fetal breathing movements (>=1 episode >=30 sec in 30 min), gross body movements (>=3 in 30 min), fetal tone (>=1 flexion/extension), amniotic fluid volume (single deepest pocket >=2 cm), and reactive NST. Score >=8 is reassuring, 6 is equivocal, <=4 is abnormal.\n\nSOGC recommends BPP for fetal surveillance in high-risk pregnancies. The modified BPP (NST + amniotic fluid index) is a common alternative for routine surveillance. BPP <=4 generally warrants delivery depending on gestational age. Each component reflects different aspects of fetal CNS function and oxygenation."
    difficulty: medium
    tags: [BPP, fetal-surveillance, NST, amniotic-fluid, scoring]
  - front: "How is intrauterine growth restriction (IUGR/FGR) diagnosed and managed?"
    back: "Diagnosis: estimated fetal weight <10th percentile on ultrasound. Classify as early-onset (<32 weeks, often placental insufficiency) vs late-onset (>=32 weeks). Management: serial growth US every 2-3 weeks, umbilical artery Doppler (absent/reversed end-diastolic flow is ominous), BPP, antenatal corticosteroids if preterm delivery anticipated, timing of delivery based on Doppler and gestational age.\n\nSOGC defines FGR as EFW <10th percentile with abnormal Dopplers or <3rd percentile. Absent end-diastolic flow warrants delivery consideration at 34 weeks; reversed flow at 28-32 weeks after steroids. Ductus venosus Doppler is the best predictor of perinatal death in early-onset FGR. Underlying causes include preeclampsia, infection, chromosomal anomaly."
    difficulty: hard
    tags: [IUGR, FGR, Doppler, fetal-surveillance, SOGC]
  - front: "What is a non-stress test (NST) and how is it interpreted?"
    back: "External cardiotocography monitoring fetal heart rate and uterine activity for 20-40 minutes. Reactive (normal): >=2 accelerations (>=15 bpm above baseline, lasting >=15 seconds) in 20 minutes with normal baseline (110-160 bpm) and moderate variability. Non-reactive: does not meet criteria after 40 minutes — requires further evaluation (vibroacoustic stimulation, BPP, or extended monitoring).\n\nSOGC recommends NST for fetal surveillance beginning at 32 weeks in high-risk pregnancies. Before 32 weeks, criteria are modified (10 bpm rise for 10 seconds). A reactive NST is reassuring for 1 week. A non-reactive NST does not always indicate compromise — fetal sleep cycle (20-40 min) is the most common cause. Decelerations on NST require further evaluation."
    difficulty: medium
    tags: [NST, fetal-monitoring, reactive, acceleration, SOGC]
  - front: "What is the role of antenatal corticosteroids and at what gestational age are they given?"
    back: "Betamethasone 12 mg IM x2 doses 24 hours apart (or dexamethasone 6 mg IM q12h x4). Given when preterm delivery anticipated at 24+0 to 34+6 weeks. Reduces neonatal RDS by 50%, IVH by 50%, NEC, and mortality. A single rescue course may be given if >14 days since first course and <34 weeks.\n\nSOGC recommends antenatal corticosteroids for all women at risk of preterm delivery 24-34 weeks. Benefits are maximal 2-7 days after administration. Late preterm (34-36 weeks) steroid use is considered in some centres (ALPS trial) but is not universally recommended in Canada due to concerns about neonatal hypoglycemia."
    difficulty: medium
    tags: [antenatal-steroids, betamethasone, preterm, RDS-prevention, SOGC]
  - front: "What are the first-trimester screening recommendations for preeclampsia?"
    back: "SOGC recommends first-trimester screening (11-14 weeks) combining maternal risk factors, mean arterial pressure, uterine artery pulsatility index, and PAPP-A/PlGF. Women identified as high-risk should start low-dose aspirin (162 mg daily) before 16 weeks, continued until 36 weeks.\n\nThe ASPRE trial demonstrated that aspirin 150 mg/night starting before 16 weeks reduces preterm preeclampsia by 62% in screen-positive women. SOGC recommends aspirin for women with >=1 high-risk factor (prior preeclampsia, chronic HTN, diabetes, renal disease, autoimmune disease) or >=2 moderate risk factors."
    difficulty: medium
    tags: [preeclampsia-screening, aspirin-prophylaxis, ASPRE, first-trimester, SOGC]
  - front: "What routine prenatal blood tests are recommended at the first antenatal visit in Canada?"
    back: "CBC, blood group and Rh type, antibody screen, rubella immunity, syphilis (RPR/VDRL), HIV (opt-out), hepatitis B surface antigen, urinalysis and culture, cervical cytology (if due), chlamydia/gonorrhea NAAT. Consider: hepatitis C (if risk factors), TSH (if symptoms or risk), hemoglobin electrophoresis (if at-risk ethnicity), varicella immunity.\n\nSOGC recommends these investigations at the initial prenatal visit (ideally <12 weeks). Repeat antibody screen at 28 weeks for Rh-negative women. Repeat GC/chlamydia in third trimester if risk factors. Ontario Prenatal Record and equivalent provincial tools standardize documentation. Group B strep culture is done at 36-37 weeks."
    difficulty: easy
    tags: [routine-prenatal-labs, first-visit, SOGC, HIV-screening, antibody-screen]
  - front: "What are the diagnostic criteria for preeclampsia per SOGC?"
    back: "New-onset hypertension (>=140/90) after 20 weeks gestation PLUS >=1 adverse condition: proteinuria (>=0.3 g/24h or PCR >=30), end-organ dysfunction (elevated creatinine, liver enzymes, low platelets <100, hemolysis), pulmonary edema, cerebral/visual symptoms, or adverse fetal conditions (FGR, oligohydramnios, abnormal Dopplers).\n\nSOGC 2022 guidelines removed the requirement for proteinuria — preeclampsia can be diagnosed with hypertension + any end-organ dysfunction. Severe features include SBP >=160, symptoms (headache, visual changes, RUQ pain), HELLP syndrome, or eclampsia. sFlt-1/PlGF ratio is an emerging biomarker for prediction and diagnosis."
    difficulty: medium
    tags: [preeclampsia, diagnostic-criteria, SOGC, HELLP, proteinuria]
  - front: "What folic acid supplementation is recommended for low-risk women of childbearing age in Canada?"
    back: "Low-risk women should take a daily oral multivitamin containing 0.4 mg (400 mcg) folic acid for at least 2-3 months before conception, throughout pregnancy, and 4-6 weeks postpartum (or as long as breastfeeding continues). They should also eat a diet rich in folate.\n\nFolic acid supplementation prevents neural tube defects (NTDs). High-risk women (personal or partner history of NTD, previous NTD pregnancy) require 5 mg folic acid starting at least 3 months before conception through 12 weeks post-conception. Women with additional risk factors (poor medication compliance, teratogen exposure) also need 5 mg."
    difficulty: easy
    tags: [folic acid, folate, neural tube defects, pregnancy, preconception, preventive care]
  - front: "What is high-risk folic acid supplementation for women planning pregnancy who are at increased risk of neural tube defects?"
    back: "Women with personal history of NTD, previous NTD pregnancy, or male partner with personal NTD history or previous NTD pregnancy: 5 mg folic acid at least 3 months before conception through 12 weeks post-conception, then 0.4-1.0 mg until postpartum/end of breastfeeding.\n\nThe higher 5 mg dose (vs. 0.4 mg for low-risk) is required because the risk of NTD recurrence or occurrence is substantially elevated in these high-risk groups. Women on antiepileptic medications, those with diabetes, or those with poor medication compliance also warrant higher supplementation and counselling."
    difficulty: medium
    tags: [folic acid, neural tube defects, high-risk pregnancy, preconception, NTD prevention]
