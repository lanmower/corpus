# Family Medicine Allergic Rhinitis (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What is the pathophysiology of allergic rhinitis, and how does it differ from vasomotor rhinitis?"
    back: "Allergic rhinitis: increased IgE levels to allergens → excessive mast cell degranulation → release of inflammatory mediators (histamine) and cytokines → local inflammatory reaction causing rhinorrhea, sneezing, congestion, and red/watery/itchy eyes. Vasomotor rhinitis: non-allergic, non-IgE-mediated rhinitis triggered by environmental stimuli (cold air, odors, weather changes) without an immune mechanism.\n\nThe IgE-mediated mechanism distinguishes allergic rhinitis from other causes and is the rationale for using antihistamines and immunotherapy. Allergic rhinitis affects ~40% of children and 20–30% of adults and is associated with asthma, eczema, sinusitis, and otitis media."
    difficulty: easy
    tags: [allergic rhinitis, pathophysiology, IgE, mast cells, family medicine]
  - front: "What is the stepped management approach for allergic rhinitis?"
    back: "1. Conservative: minimize allergen exposure (most important, may take months), maintain hygiene, saline nasal rinses. 2. Mild symptoms: oral second-generation antihistamines first-line (cetirizine, fexofenadine, loratadine). 3. Moderate/severe or persistent: intranasal corticosteroids ± intranasal antihistamines (expect >1 month for results). 4. Intranasal decongestants: limited to <5 days (avoid rhinitis medicamentosa). 5. Allergy skin testing: for uncontrolled chronic rhinitis. 6. Immunotherapy (allergy shots): severe cases unresponsive to pharmacologic therapy.\n\nRhinitis medicamentosa (rebound congestion) occurs with prolonged use (>5–7 days) of vasoconstrictive intranasal medications. Immunotherapy uses periodic subcutaneous injections of allergen-specific antigens to desensitize the patient — an important option for severe allergic rhinitis."
    difficulty: medium
    tags: [allergic rhinitis, management, antihistamines, intranasal corticosteroids, immunotherapy]
  - front: "What is rhinitis medicamentosa and how is it prevented?"
    back: "Rhinitis medicamentosa is rebound nasal congestion caused by prolonged use (>5–7 days) of vasoconstrictive intranasal medications (e.g., oxymetazoline). Prevention: limit use of intranasal decongestants to <5 days.\n\nWith repeated use, alpha-adrenergic nasal decongestants cause tachyphylaxis — patients become dependent, requiring more frequent dosing to achieve the same decongestant effect. The resulting rebound congestion can be worse than the original symptoms. Treatment involves gradual discontinuation, often with intranasal corticosteroids."
    difficulty: easy
    tags: [rhinitis medicamentosa, decongestants, allergic rhinitis, family medicine]
