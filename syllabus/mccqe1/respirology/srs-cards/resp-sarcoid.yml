# Interstitial Lung Disease & Sarcoidosis (Respirology) - generated from srs-mccqe1
cards:
  - front: "A 35-year-old Black woman presents with bilateral hilar lymphadenopathy on CXR, erythema nodosum, and elevated ACE. Diagnosis and staging?"
    back: "Sarcoidosis; Stage I: bilateral hilar lymphadenopathy alone; Stage II: BHL + pulmonary infiltrates; Stage III: infiltrates without BHL; Stage IV: pulmonary fibrosis\n\nSarcoidosis is a systemic granulomatous disease. Definitive diagnosis requires biopsy showing non-caseating granulomas (exclude TB, fungal). ACE is elevated in ~60%. Calcium elevated in ~10%. Black patients have more severe disease."
    difficulty: hard
    tags: [sarcoidosis, bilateral hilar lymphadenopathy, ACE, staging, respirology]
  - front: "What are the extrapulmonary manifestations of sarcoidosis?"
    back: "Eyes (uveitis, most common), skin (erythema nodosum, lupus pernio), heart (conduction block, VT), nervous system (cranial nerve palsies, esp CN VII), liver, kidneys, bones\n\nCardiac sarcoidosis causes sudden death from VT/heart block — all sarcoidosis patients need ECG. Neurosarcoidosis: CN VII palsy is most common. Lofgren syndrome (bilateral hilar adenopathy + erythema nodosum + polyarthritis) has excellent prognosis."
    difficulty: medium
    tags: [sarcoidosis, extrapulmonary, uveitis, cardiac sarcoidosis, respirology]
  - front: "When is treatment indicated for pulmonary sarcoidosis?"
    back: "Symptomatic pulmonary disease, declining lung function (FVC decline >10%), hypercalcemia, cardiac/neurological sarcoidosis, severe skin involvement\n\nNot all sarcoidosis requires treatment. Stage I and II asymptomatic may be observed. Corticosteroids (prednisone 20-40mg) are first-line for progressive or organ-threatening disease. Steroid-sparing agents: methotrexate, azathioprine, hydroxychloroquine."
    difficulty: medium
    tags: [sarcoidosis treatment, corticosteroids, pulmonary sarcoidosis, respirology]
  - front: "What is Lofgren syndrome and what is its prognosis?"
    back: "Acute sarcoidosis triad: bilateral hilar adenopathy + erythema nodosum/periarthritis + fever; excellent prognosis — self-limited, resolves spontaneously in >90%\n\nLofgren syndrome is the most common acute presentation of sarcoidosis in Northern Europeans. It usually resolves within 2 years without treatment. NSAIDs for symptomatic relief. This presentation has better prognosis than insidious-onset sarcoidosis."
    difficulty: medium
    tags: [Lofgren syndrome, sarcoidosis, erythema nodosum, prognosis, respirology]
  - front: "What is interstitial lung disease (ILD) and what are the main categories?"
    back: "ILD: diffuse parenchymal lung diseases causing alveolar inflammation and/or fibrosis; categories: idiopathic (IPF, NSIP), connective tissue disease-associated, hypersensitivity pneumonitis, drug-induced, sarcoidosis\n\nILD presents with progressive dyspnea, dry cough, bilateral crackles, and restrictive spirometry. HRCT is essential for pattern recognition. IPF has the worst prognosis; most other ILDs respond to immunosuppression."
    difficulty: easy
    tags: [ILD, interstitial lung disease, IPF, categories, respirology]
  - front: "What HRCT pattern characterizes idiopathic pulmonary fibrosis (IPF) and what is its treatment?"
    back: "Usual interstitial pneumonia (UIP) pattern on HRCT: bilateral basal-predominant subpleural honeycombing ± traction bronchiectasis; treat with nintedanib or pirfenidone (antifibrotic agents)\n\nIPF is the most common ILD with median survival 3-5 years from diagnosis. Diagnosis requires exclusion of other causes. Antifibrotics slow FVC decline but do not reverse fibrosis. Lung transplantation is the only curative option."
    difficulty: hard
    tags: [IPF, UIP pattern, nintedanib, pirfenidone, antifibrotic, respirology]
  - front: "What is hypersensitivity pneumonitis (HP) and how is it diagnosed?"
    back: "Immune-mediated ILD from repeated inhalation of organic antigens (bird droppings, mold, farmer lung — thermophilic actinomyces); diagnose with exposure history, serum precipitins, HRCT, BAL lymphocytosis ± lung biopsy\n\nChronic HP can progress to fibrosis (chronic HP with fibrotic UIP pattern). Treatment: antigen avoidance (most important), corticosteroids for acute/subacute forms. Smoking paradoxically protective for HP development but worsens prognosis if fibrosis develops."
    difficulty: hard
    tags: [hypersensitivity pneumonitis, HP, organic antigen, bird fancier, farmer lung, respirology]
  - front: "What are classic features of pulmonary sarcoidosis?"
    back: "Bilateral hilar lymphadenopathy, non-caseating granulomas, elevated ACE, erythema nodosum\n\nLofgren syndrome has excellent prognosis. Stages I-IV. Most stage I resolves spontaneously."
    difficulty: medium
    tags: [sarcoidosis]
  - front: "What are the Scadding stages of pulmonary sarcoidosis on CXR?"
    back: "Stage 0: normal CXR; Stage I: bilateral hilar lymphadenopathy (BHL) alone; Stage II: BHL + pulmonary infiltrates; Stage III: pulmonary infiltrates without BHL; Stage IV: pulmonary fibrosis with volume loss.\n\nStage predicts spontaneous remission: Stage I: 60-80% resolve spontaneously; Stage II: ~50%; Stage III: <30%; Stage IV: 0% (irreversible). Stage does not correlate perfectly with symptoms or lung function. Treatment decisions based on symptoms and organ involvement, not stage alone."
    difficulty: medium
    tags: [sarcoidosis, Scadding, CXR, staging, respirology]
  - front: "What is the classic histological finding in sarcoidosis?"
    back: "Non-caseating (non-necrotizing) granulomas composed of epithelioid cells, multinucleated giant cells (may contain Schaumann bodies and asteroid bodies), surrounded by lymphocytes and fibroblasts.\n\nNon-caseating granulomas are the hallmark but NOT pathognomonic — must exclude infections (TB, fungi), foreign body, and lymphoma. Tissue biopsy (transbronchial, lymph node, or skin) is required for diagnosis. Kveim test is historical and no longer used."
    difficulty: medium
    tags: [sarcoidosis, granuloma, non-caseating, histology, respirology]
  - front: "What are the extrapulmonary manifestations of sarcoidosis?"
    back: "Eyes: anterior uveitis (most common), lacrimal gland. Skin: erythema nodosum, lupus pernio. Liver: granulomatous hepatitis. Heart: conduction blocks, cardiomyopathy. Neuro: CN VII palsy, meningitis. Joints: acute polyarthritis. Kidney: nephrocalcinosis (hypercalcemia).\n\nSarcoidosis is a systemic disease requiring multi-organ assessment. Löfgren syndrome (BHL + erythema nodosum + fever + polyarthralgia) has excellent prognosis >90% resolution. Cardiac sarcoid is a major cause of death — screen with ECG ± advanced imaging."
    difficulty: hard
    tags: [sarcoidosis, extrapulmonary, uveitis, lupus pernio, Lofgren, respirology]
  - front: "Why does sarcoidosis cause hypercalcemia and how is it managed?"
    back: "Activated macrophages in granulomas express 1α-hydroxylase, converting 25-OH vitamin D to 1,25-dihydroxy vitamin D (calcitriol) independently of PTH → increased intestinal calcium absorption and bone resorption. Managed with corticosteroids + hydration + low-calcium diet.\n\nHypercalcemia occurs in ~10% and hypercalciuria in ~30% of sarcoidosis patients. Can cause nephrocalcinosis and renal failure. Unlike primary hyperparathyroidism, PTH is suppressed. Ketoconazole can also reduce calcitriol production. Avoid excessive sun exposure and vitamin D supplements."
    difficulty: hard
    tags: [sarcoidosis, hypercalcemia, vitamin D, 1-alpha-hydroxylase, respirology]
  - front: "When is systemic corticosteroid therapy indicated in sarcoidosis?"
    back: "Symptomatic pulmonary disease (worsening dyspnea, declining FVC), hypercalcemia, cardiac sarcoid, neurosarcoidosis, sight-threatening uveitis, disfiguring skin lesions, hepatic dysfunction\n\nNot all sarcoidosis requires treatment — many cases self-resolve. Initial therapy: prednisone 20-40 mg daily for 4-6 weeks, then taper over 6-12 months. Monitor PFTs and imaging for response. Steroid-sparing agents (methotrexate, azathioprine) for relapsing or chronic disease."
    difficulty: hard
    tags: [sarcoidosis, corticosteroids, treatment, indications, respirology]
  - front: "What lab findings support a diagnosis of sarcoidosis?"
    back: "Elevated ACE (60% sensitivity, not specific), elevated serum and urine calcium, elevated 1,25-(OH)2-vitamin D, lymphopenia, elevated ESR, elevated alkaline phosphatase, polyclonal hypergammaglobulinemia\n\nACE is neither sensitive nor specific for sarcoidosis — elevated in many granulomatous diseases. Most useful for monitoring treatment response when initially elevated. sIL-2R may be a better biomarker. Definitive diagnosis requires tissue biopsy showing non-caseating granulomas."
    difficulty: medium
    tags: [sarcoidosis, ACE, labs, calcium, diagnosis, respirology]
  - front: "What is Heerfordt syndrome in sarcoidosis?"
    back: "Uveoparotid fever: anterior uveitis + parotid gland enlargement + facial nerve palsy (CN VII) + fever\n\nHeerfordt syndrome is a specific clinical presentation of sarcoidosis that is pathognomonic when all features are present. CN VII palsy is the most common cranial neuropathy in neurosarcoidosis. Responds well to corticosteroid therapy."
    difficulty: hard
    tags: [sarcoidosis, Heerfordt, uveoparotid, CN VII, respirology]
  - front: "What is the PFT pattern typically seen in pulmonary sarcoidosis?"
    back: "Restrictive pattern (reduced TLC, FVC) with reduced DLCO is most common. Obstructive pattern can occur with endobronchial granulomas. Mixed pattern possible. Stage I may have normal PFTs.\n\nDLCO is the most sensitive PFT abnormality in pulmonary sarcoidosis. Serial FVC and DLCO are used to monitor disease progression and treatment response. 6-minute walk test provides functional assessment. PFTs should be performed at baseline and every 3-6 months."
    difficulty: medium
    tags: [sarcoidosis, PFT, restrictive, DLCO, spirometry, respirology]
  - front: "What steroid-sparing agents are used in refractory or chronic sarcoidosis?"
    back: "First-line steroid-sparing: methotrexate (most evidence), azathioprine. Second-line: mycophenolate, leflunomide. Third-line: anti-TNF biologics (infliximab) for refractory disease.\n\nSteroid-sparing agents are indicated if unable to taper prednisone below 10 mg/day, unacceptable steroid side effects, or relapse on taper. Methotrexate requires folate supplementation and monitoring for hepatotoxicity and cytopenias. Infliximab has strongest evidence among biologics."
    difficulty: hard
    tags: [sarcoidosis, methotrexate, steroid-sparing, infliximab, respirology]
  - front: "How is cardiac sarcoidosis screened for and diagnosed?"
    back: "Screen all sarcoidosis patients with ECG. If abnormal or symptoms (palpitations, syncope, HF): cardiac MRI (gadolinium enhancement in active disease) or FDG-PET. Endomyocardial biopsy has low sensitivity (~25%) due to patchy involvement.\n\nCardiac sarcoid is the leading cause of sarcoidosis-related death in Japan and second in North America. Can cause complete heart block, VT, sudden death, and dilated cardiomyopathy. Treatment: corticosteroids + ICD if LVEF <35% or sustained VT. Annual ECG recommended for all."
    difficulty: hard
    tags: [sarcoidosis, cardiac, MRI, PET, heart block, ICD, respirology]
  - front: "What is Lofgren syndrome and what are the features of cardiac and neurosarcoidosis?"
    back: "Lofgren syndrome: acute sarcoidosis presentation with classic triad of bilateral hilar lymphadenopathy + erythema nodosum + polyarthralgia (especially ankles) ± fever. Excellent prognosis — >90% resolve spontaneously within 2 years; may not need biopsy if classic presentation. Cardiac sarcoid (2-5% clinical, 25% autopsy): AV block (most common), ventricular arrhythmias, dilated cardiomyopathy, sudden cardiac death; Dx: cardiac MRI (gadolinium enhancement), PET scan, endomyocardial biopsy; Tx: corticosteroids + antiarrhythmics, ICD for high-risk patients. Neurosarcoid (5-10%): cranial nerve palsy (CN VII most common — bilateral facial palsy is classic), basilar meningitis, hypothalamic dysfunction, myelopathy; Dx: CSF lymphocytosis, elevated ACE in CSF, MRI; Tx: high-dose corticosteroids, steroid-sparing agents (methotrexate, infliximab).\n\nSarcoidosis is a multisystem granulomatous disease that is more common and more severe in Black populations. Bilateral hilar lymphadenopathy is the most common radiographic finding. Bilateral facial nerve palsy is highly suggestive of sarcoidosis (also consider Lyme disease and GBS). Canadian Thoracic Society guidelines recommend screening ECG and echocardiography for cardiac involvement in all sarcoidosis patients."
    difficulty: hard
    tags: [sarcoidosis, Lofgren syndrome, cardiac sarcoid, neurosarcoid, respirology]
  - front: "A 25-year-old woman presents with painful shin nodules after starting an OCP. CXR shows bilateral hilar adenopathy. What is the most likely diagnosis?"
    back: "Erythema nodosum secondary to sarcoidosis (or OCP-induced). The bilateral hilar adenopathy in the context of EN strongly suggests sarcoidosis (Löfgren syndrome when combined with EN, fever, and arthralgia).\n\nLöfgren syndrome (EN + bilateral hilar adenopathy + fever/arthralgia) is an acute presentation of sarcoidosis with excellent prognosis and often self-limited course. CXR to rule out sarcoidosis is part of EN workup."
    difficulty: hard
    tags: [erythema nodosum, sarcoidosis, Löfgren syndrome, bilateral hilar adenopathy]
  - front: "What are the sarcoidosis skin findings?"
    back: "Heterogeneous: erythema nodosum (most common acute finding), lupus pernio (violaceous nodules/plaques on nose, cheeks, ears — chronic severe disease), pink/brownish papules and plaques.\n\nLupus pernio is pathognomonic for sarcoidosis and indicates multisystem involvement. Skin biopsy showing non-caseating granulomas confirms diagnosis. Erythema nodosum in sarcoidosis (Löfgren syndrome) indicates a good prognosis."
    difficulty: medium
    tags: [sarcoidosis, lupus pernio, erythema nodosum, skin manifestations]
