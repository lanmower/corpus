# Emergency Burns (EmergencyMedicine) - generated from srs-mccqe1
cards:
  - front: "What is the Parkland formula for burn fluid resuscitation and how is it administered?"
    back: "Ringer's lactate 4 cc/kg/% BSA burned. Give half in the first 8 hours, half in the next 16 hours. Target urine output 40–50 cc/h (0.5 cc/kg/h). BSA percentages differ in pediatric patients.\n\nThe Parkland formula guides fluid replacement for 2nd and 3rd degree burns. Urine output is the best measure of resuscitation adequacy. Diuretics should be avoided as they confound assessment."
    difficulty: easy
    tags: [burns, fluid resuscitation, Parkland formula, emergency medicine]
  - front: "What are the four burn depths and their key clinical characteristics?"
    back: "Superficial (1st°): epidermis only, painful, e.g. sunburn. Superficial partial (2nd°): epidermis + superficial dermis, blisters, very painful. Deep partial (2nd°): involves hair follicles/sebaceous glands, white-yellow dermis, absent sensation. Full thickness (3rd°): all dermal layers, pale/insensate/charred. Deep 4th°: involves fat, muscle, bone.\n\nDepth determines management and need for grafting. Sensation is a key differentiator: superficial burns are painful, deep partial and full thickness burns have absent/reduced sensation. Rule of Nines does not include 1st degree burns."
    difficulty: easy
    tags: [burns, classification, emergency medicine]
  - front: "What are the indications for escharotomy in burn patients?"
    back: "Pain, pallor, paresthesia, paralysis, poikilothermia, pulselessness, decreased/absent oximetry signals, increased compartment pressures >30 mmHg (limb eschar), increased intraocular pressures >30 mmHg (peri-orbital eschar). Chest eschar: increased airway pressures, decreased tidal volumes, decreased preload, tachycardia.\n\nCircumferential burns of limbs or chest create inelastic eschar that can cause compartment syndrome or restrict breathing. Escharotomy (incision through eschar) releases the constriction. Fasciotomy may also be required."
    difficulty: medium
    tags: [burns, escharotomy, compartment syndrome, emergency medicine]
  - front: "What burn characteristics require hospital admission?"
    back: "2nd degree burns >10% BSA or any significant 3rd degree burns; 2nd degree burns on face, hands, feet, perineum, or across major joints; electrical burns; chemical burns; inhalation injury; burn victims with chronic medical conditions or immunosuppression.\n\nThese criteria reflect high risk for functional/cosmetic complications, infection, and systemic compromise. Specialized burn units provide wound care, fluid management, and surgical expertise."
    difficulty: easy
    tags: [burns, admission criteria, emergency medicine]
