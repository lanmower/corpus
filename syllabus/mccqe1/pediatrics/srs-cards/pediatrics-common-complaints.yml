# Pediatrics Common Complaints (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are breath holding spells? Describe the two types and their triggers."
    back: "Cyanotic type (more common): triggered by anger/frustration — child holds breath, becomes silent, may lose consciousness; resolves spontaneously. Pallid type: triggered by pain/surprise — vagal stimulation reduces heart rate causing cerebral hypoperfusion and loss of consciousness. Epidemiology: 0.1-5% of children aged 6 months-4 years.\n\nBreath holding spells are benign but frightening. They typically begin in the first year and almost all resolve by age 8 (median remission age 4 years). Management focuses on parental reassurance, avoiding reinforcement of the spell, and treating associated iron deficiency anemia (which improves frequency). If episodes are prolonged/frequent, triggered by minor stimuli, or there is a family history of syncope or sudden death, cardiac evaluation for prolonged QT syndrome is warranted."
    difficulty: medium
    tags: [breath holding spells, cyanotic, pallid, pediatrics, syncope]
  - front: "What is the management of breath holding spells, and what condition should be screened for?"
    back: "Management: reassurance, help child manage frustration, avoid reinforcing the spell. Screen for iron deficiency anemia (supplemental iron improves episodes). If prolonged/frequent or triggered by non-traumatic stimuli or family history of syncope/sudden death: cardiac evaluation for prolonged QT syndrome.\n\nIron deficiency anemia is associated with increased frequency of breath holding spells, and iron supplementation can reduce their occurrence. This is a treatable cause. The association with iron deficiency suggests a shared mechanism possibly related to autonomic dysregulation. Long QT syndrome must be excluded when atypical features are present, as it can also cause loss of consciousness and sudden death."
    difficulty: medium
    tags: [breath holding spells, iron deficiency, long QT syndrome, pediatrics]
  - front: "What is infantile colic? What are the Wessel (rule of 3s) criteria?"
    back: "Unexplained paroxysms of irritability and crying for >3 hours/day, >3 days/week, for >3 weeks in an otherwise healthy, well-fed baby. Affects ~10% of infants; onset 10 days to 3 months, peak at 6-8 weeks.\n\nColic is a diagnosis of exclusion — causes such as otitis media, cow's milk protein intolerance, GI problems, fracture, and hair tourniquet must be ruled out. The etiology is unknown. It resolves spontaneously, most in the first 3-6 months, with no long-term adverse effects. The rule of 3s (Wessel criteria) is a standard diagnostic criterion."
    difficulty: easy
    tags: [infantile colic, Wessel criteria, rule of 3s, pediatrics]
  - front: "What is the management of infantile colic?"
    back: "Parental reassurance and support (essential); adjust feeding technique to minimize air swallowing; comfort measures (holding, soother, car ride, music); limited evidence for probiotics. For breastfed: 1-2 week trial of hypoallergenic maternal diet (no cow's milk, eggs, nuts, wheat). For formula-fed: 1-2 week trial of hydrolyzed formula.\n\nColic resolves in all cases, most within 3-6 months, with no long-term adverse effects. Parental reassurance is the cornerstone. Dietary trials (maternal elimination or hydrolyzed formula) are time-limited and used to exclude cow's milk protein sensitivity. Simethicone has not been shown effective. Probiotics (Lactobacillus reuteri) show limited but emerging evidence in breastfed infants."
    difficulty: medium
    tags: [infantile colic, management, hypoallergenic diet, hydrolyzed formula, pediatrics]
  - front: "Define primary nocturnal enuresis and outline its management."
    back: "Primary nocturnal enuresis: bedwetting when bladder control has never been attained. Affects 10% at age 6, 3% at age 12, 1% at age 18. Management: reassurance (~20% resolve spontaneously/year), behaviour modification (fluid restriction before bed, void before sleep, no caffeine), enuresis alarm (70% success — first-line), desmopressin (DDAVP Melt 120-360 mcg) for short-term use (e.g., sleepovers) in children >7 years.\n\nPrimary nocturnal enuresis is a maturational delay in nocturnal bladder control. Additional investigations are not routinely warranted without warning signs. The enuresis (wet) alarm has the highest long-term success rate. Desmopressin (ADH analogue) reduces urine production at night but does not address the underlying cause. It is not recommended as primary treatment and should not be used in children with polydipsia. Comorbidities to screen for include constipation, sleep-disordered breathing, and ADHD."
    difficulty: medium
    tags: [nocturnal enuresis, bedwetting, desmopressin, enuresis alarm, pediatrics]
  - front: "What distinguishes secondary enuresis from primary enuresis, and what are the common causes?"
    back: "Secondary enuresis: bedwetting that develops after at least 6 months of sustained bladder control. Causes: psychosocial (stress, anxiety, birth of sibling, family discord, sexual abuse) and organic (UTI, DM, DI, sleep apnea, neurogenic bladder, cerebral palsy, seizures, pinworms).\n\nThe key distinction is that secondary enuresis follows a period of dryness (≥6 months), suggesting an acquired cause. Always screen for UTI (urinalysis) and diabetes (urinalysis for glucosuria, fasting glucose). Sexual abuse can present as secondary enuresis. Management targets the underlying cause. Diurnal enuresis (daytime wetting) requires evaluation for structural anomalies, UTI, and neurogenic bladder."
    difficulty: medium
    tags: [secondary enuresis, UTI, diabetes insipidus, sexual abuse, pediatrics]
  - front: "What is encopresis, and what is the most common cause in school-aged children?"
    back: "Encopresis: fecal incontinence in a child >4 years, at least once/month for 3 months. Most common cause: retentive encopresis due to chronic constipation — child holds bowel movements, leading to fecal impaction and overflow incontinence (seepage of soft/liquid stool around impaction). M:F = 6:1.\n\nRetentive encopresis is a common but often missed diagnosis. The cycle is: painful defecation → withholding → constipation → impaction → overflow incontinence (often mistaken for diarrhea). Physical exam shows palpable stool in LLQ, large fecal mass on digital rectal exam, and anal fissures. Management requires bowel cleanout (PEG 3350, Pico-Salax) followed by maintenance therapy (PEG 3350 + Senna)."
    difficulty: medium
    tags: [encopresis, retentive, constipation, fecal impaction, pediatrics]
  - front: "A 3-month-old infant has been crying for >3 hours per day, >3 days per week, for the past 3 weeks. The parents are exhausted. Exam is normal. What is the diagnosis, management, and prognosis?"
    back: "Diagnosis: infantile colic (Wessel/rule of 3s criteria met). Management: reassurance and parental support (essential), minimize air swallowing during feeds, comfort measures (holding, white noise, soother), time-limited trial of hypoallergenic diet (breastfed) or hydrolyzed formula (formula-fed). Prognosis: all cases resolve, most by 3-6 months, no long-term adverse effects.\n\nThis is a classic presentation of infantile colic. Before diagnosing colic, other causes of crying must be excluded: otitis media, hair tourniquet, fracture, cow's milk protein intolerance, GI issues, GERD. The diagnosis is one of exclusion. Parental exhaustion and anxiety are significant — supporting parents is a primary goal. Probiotics (L. reuteri) may have limited benefit in breastfed infants."
    difficulty: medium
    tags: [infantile colic, rule of 3s, Wessel criteria, crying infant, pediatrics]
  - front: "A 6-year-old boy wets the bed 3-4 nights per week. He has never been dry at night. Parents ask about treatment. What is the first-line treatment?"
    back: "Enuresis (wet/moisture) alarm — 70% success rate. Also: reassurance (20% resolve spontaneously each year), behaviour modification (limit fluids before bed, avoid caffeine, void before sleep). Desmopressin (DDAVP) is for short-term use (sleepovers) in children >7 years. Punishment should be avoided.\n\nThe enuresis alarm works by conditioning: the child wakes when voiding begins, reinforcing arousal from sleep for bladder fullness. It has the highest long-term success rate. Desmopressin is effective short-term but does not treat the underlying condition and has rebound after stopping. Anticholinergic medications and antidepressants are second-line. Additional investigations are not warranted without warning signs."
    difficulty: medium
    tags: [nocturnal enuresis, enuresis alarm, desmopressin, first-line treatment, pediatrics]
