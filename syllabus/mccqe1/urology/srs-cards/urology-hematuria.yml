# Urology Hematuria (Urology) - generated from srs-mccqe1
cards:
  - front: "What does gross, painless hematuria in an adult signify until proven otherwise?"
    back: "Bladder cancer (urothelial carcinoma) until proven otherwise.\n\nPainless gross hematuria is the classic presentation of bladder carcinoma. All adults with this finding require cystoscopy and upper tract imaging (CTU) as part of a malignancy workup per CUA guidelines."
    difficulty: easy
    tags: [hematuria, bladder cancer, urology, red flags]
  - front: "What is the definition of microscopic hematuria?"
    back: ">2 RBCs per high power field (HPF) on urinalysis on at least two separate samples.\n\nMicroscopic hematuria is not visible to the naked eye. The CUA threshold is >2 RBCs/HPF confirmed on two separate samples before initiating a full workup, distinguishing it from transient causes (e.g., exercise, menstruation)."
    difficulty: easy
    tags: [hematuria, urinalysis, CUA guidelines]
  - front: "What is the preferred imaging modality for evaluating the upper urinary tract in hematuria workup?"
    back: "CT urography (CTU) — the standard test to evaluate the renal parenchyma and collecting system.\n\nCTU provides superior evaluation of the renal parenchyma, collecting system, and ureters compared to IVP or ultrasound alone. It involves IV contrast and radiation exposure. MR urography is an alternative when ionizing radiation must be avoided (e.g., pediatric, pregnant patients)."
    difficulty: easy
    tags: [hematuria, CTU, imaging, urology]
  - front: "A 65-year-old male presents with gross hematuria. List the most common etiologies in this age group."
    back: "BPH, bladder tumour, UTI, RCC, prostate cancer (males >60).\n\nIn patients >60, BPH and urothelial (bladder) tumours are the leading urological causes of hematuria in men. All require cystoscopy and upper tract imaging to exclude malignancy."
    difficulty: easy
    tags: [hematuria, BPH, bladder cancer, RCC, prostate cancer, urology]
  - front: "How is severe bladder hemorrhage with clots managed acutely?"
    back: "1. Manual irrigation via catheter with normal saline to remove clots. 2. Continuous bladder irrigation (CBI) using a large (20–24 French) 3-way Foley catheter. 3. Cystoscopy to identify and coagulate bleeding sources or resect tumours.\n\nClot retention requires physical clot removal before CBI is effective. Cystoscopy allows direct visualization and treatment of the bleeding source under general or regional anesthesia."
    difficulty: medium
    tags: [hematuria, bladder hemorrhage, CBI, cystoscopy, urology]
  - front: "Where in the urinary stream does hematuria occur, and what does the timing suggest anatomically?"
    back: "Beginning of stream: anterior urethra. End of stream: bladder neck or prostatic urethra. Throughout entire stream: bladder and above (ureter, kidney).\n\nThe timing of hematuria within the urinary stream helps localize the bleeding source. Presence of blood clots suggests significant bleeding. Associated pyuria and dysuria suggest infection; flank pain radiating to groin suggests ureteral stone."
    difficulty: easy
    tags: [hematuria, anatomical localization, bladder, urethra, kidney]
  - front: "What are risk factors for malignancy-related hematuria?"
    back: "Smoking, chemical exposures (aniline dyes, benzene), history of cyclophosphamide therapy, pelvic radiation.\n\nThese risk factors are associated with urothelial (transitional cell) carcinoma of the bladder and upper urinary tract. Cyclophosphamide causes hemorrhagic cystitis and increases bladder cancer risk. Smoking is the single most important modifiable risk factor."
    difficulty: easy
    tags: [hematuria, bladder cancer, risk factors, smoking, cyclophosphamide]
