    back: "Treatment is unnecessary unless: high-risk pregnancy, prior IUD insertion, gynecologic surgery, induced abortion, or upper tract instrumentation\n\nBV is associated with preterm delivery and pelvic inflammatory disease in high-risk scenarios, warranting treatment even when asymptomatic."
