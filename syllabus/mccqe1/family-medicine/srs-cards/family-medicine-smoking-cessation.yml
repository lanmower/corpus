# Family Medicine Smoking Cessation (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the two main pharmacologic agents used for smoking cessation (beyond NRT), and what is the mechanism of each?"
    back: "1. Bupropion: inhibits reuptake of dopamine and/or norepinephrine (NE). 2. Varenicline: partial nicotinic receptor agonist AND partial competitive antagonist of the nicotinic receptor.\n\nBupropion was originally an antidepressant (Wellbutrin®) repurposed for cessation; therapeutic levels are reached in ~1 week. Varenicline (Champix® in Canada) acts on the same receptor as nicotine, reducing cravings while also blocking nicotine's rewarding effects. Both are available by prescription in Canada."
    difficulty: easy
    tags: [smoking cessation, pharmacology, bupropion, varenicline, family medicine]
  - front: "What are the key contraindications to bupropion for smoking cessation?"
    back: "Seizure disorder, eating disorder, MAO inhibitor use in the past 14 days, simultaneous use of Wellbutrin® (bupropion) for depression.\n\nBupropion lowers the seizure threshold, making any pre-existing seizure disorder an absolute contraindication. Eating disorders (especially bulimia/anorexia) also increase seizure risk. Concurrent MAOIs risk hypertensive crisis. Using bupropion for both cessation and depression simultaneously doubles the dose and risk."
    difficulty: easy
    tags: [smoking cessation, bupropion, contraindications, pharmacology]
  - front: "What is the dosing schedule for bupropion in smoking cessation?"
    back: "150 mg every AM × 3 days, then 150 mg BID × 7–12 weeks. Continue smoking for first 1–2 weeks (therapeutic levels reached in 1 week). For maintenance, consider 150 mg BID for up to 6 months.\n\nThe overlap period (continuing to smoke while starting bupropion) allows the drug to reach therapeutic levels before the quit date. This is a key prescribing detail that differentiates bupropion from NRT, where smoking cessation is expected to begin on day 1 of therapy."
    difficulty: medium
    tags: [smoking cessation, bupropion, dosing, pharmacology]
  - front: "What is the dosing schedule for varenicline in smoking cessation?"
    back: "0.5 mg every AM × 3 days → 0.5 mg BID × 4 days → 1 mg BID × 12 weeks, with option for additional 12-week course for maintenance. Quit date is typically set for day 8 (after 1 week of varenicline). Gradual quit approach: reduce smoking 50% by week 4, additional 50% by week 8, complete abstinence by week 12.\n\nThe gradual titration minimizes the most common side effects (nausea, vomiting). The Canadian prescribing information also notes caution with pre-existing psychiatric conditions, given the risk of psychosis, depression, and suicidal ideation as side effects."
    difficulty: medium
    tags: [smoking cessation, varenicline, dosing, pharmacology]
  - front: "What are the 5 Rs of motivational intervention for patients unwilling to quit smoking?"
    back: "1. Relevance (to patient's disease, family, age, gender). 2. Risks of smoking (short-term, long-term, environmental). 3. Rewards (benefits of quitting). 4. Roadblocks (obstacles to quitting, e.g., withdrawal, weight gain). 5. Repetition (reassure that average number of attempts before success is 7).\n\nThe 5 Rs are the evidence-based motivational framework for patients in the pre-contemplation or contemplation stages of change. Simple physician advice alone can increase cessation rates by 1–3% above unassisted quit rates, per systematic review evidence cited in Toronto Notes."
    difficulty: easy
    tags: [smoking cessation, motivational interviewing, 5Rs, behavioral, family medicine]
  - front: "When is the highest risk period for relapse after smoking cessation, and what is the average number of attempts before successfully quitting?"
    back: "Highest relapse rate is within 3 months of quitting. Average number of attempts before successfully quitting is 7.\n\nThis knowledge is critical for counselling patients who relapse — relapse should not be framed as failure but as part of the normal process. Prescriptive interventions for recent quitters should address weight gain, negative mood, withdrawal symptoms, and lack of support."
    difficulty: easy
    tags: [smoking cessation, relapse, counselling, family medicine]
  - front: "What is the recommended approach to NRT in pregnant patients who want to quit smoking?"
    back: "Counselling is recommended as first-line. NRT should be made available to pregnant women unable to quit using non-pharmacologic methods. Intermittent NRT (lozenges, gum) is preferred over continuous dosing (patch). No strong evidence of major positive or negative outcomes with gestational use of bupropion or varenicline — use only if benefits outweigh risks.\n\nSmoking during pregnancy carries significant risks (prematurity, low birth weight, SIDS, placental abruption), so cessation is a priority. The preference for intermittent NRT over patch reflects reduced fetal nicotine exposure, which is especially important in the first trimester."
    difficulty: medium
    tags: [smoking cessation, pregnancy, NRT, family medicine]
