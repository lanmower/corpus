  - front: "What does the mnemonic RECT represent for hemochromatosis clinical features?"
    back: "R- Arthralgia; E- Bronze skin; C- Cardiomyopathy/cirrhosis; T- Diabetes (pancreatic damage)\n\nHypogonadism from anterior pituitary damage is also a key manifestation."
    difficulty: medium
    tags: [hemochromatosis, clinical features, mnemonic, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the classic clinical features of hemochromatosis? (RECT mnemonic)"
    back: "R - Arthralgia, E - Bronze skin, C - Cardiomyopathy and cirrhosis, T - Diabetes (pancreatic damage), Hypogonadism\n\nThe RECT mnemonic summarizes the classic presentation: arthralgia, bronze skin, cardiomyopathy/cirrhosis, diabetes, and hypogonadism from pituitary damage."
    difficulty: medium
    tags: [Hemochromatosis, clinical features, diagnosis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the clinical features of hemochromatosis (RECT)?"
    back: "Arthralgia, Bronze skin, Cardiomyopathy, Cirrhosis, Diabetes (pancreatic damage), Hypogonadism (pituitary damage)\n\nThe RECT mnemonic summarizes classic manifestations: Rheumatic (arthralgia), Endocrine (diabetes, hypogonadism), Cardiac (cardiomyopathy), Tegumentary (bronze skin), and cirrhosis."
    difficulty: medium
    tags: [hemochromatosis, clinical-manifestations, rect, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What cardiac manifestations occur in hemochromatosis?"
    back: "Diastolic dysfunction and arrhythmias in early stages, progressing to dilated cardiomyopathy in later stages\n\nCardiac iron deposition causes restrictive cardiomyopathy with diastolic dysfunction before systolic impairment develops."
    difficulty: medium
    tags: [hemochromatosis, cardiology, cardiomyopathy, arrhythmia, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the RECT mnemonic for hemochromatosis clinical features?"
    back: "Arthralgia, Bronze skin, Cardiomyopathy (and cirrhosis), Diabetes (pancreatic damage), Hypogonadism (anterior pituitary damage)\n\nRECT captures the classic triad of bronze skin, diabetes, and cirrhosis, plus arthralgia (especially MCP joints), cardiomyopathy, and hypogonadism."
    difficulty: medium
    tags: [hemochromatosis, clinical features, signs and symptoms, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What does the RECT mnemonic stand for in hemochromatosis clinical features?"
    back: "Arthralgia, Bronze skin, Cardiomyopathy/cirrhosis of liver, Diabetes (pancreatic damage), Hypogonadism (anterior pituitary damage)\n\nThese represent the classic multiorgan manifestations. Bronze/grey skin is due to melanin, not iron. Arthralgia commonly affects metacarpophalangeal joints."
    difficulty: medium
    tags: [hemochromatosis, clinical-features, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What cardiac manifestations are seen in hemochromatosis?"
    back: "Diastolic dysfunction and arrhythmias in early stages, progressing to dilated cardiomyopathy in later stages\n\nCardiac involvement is a serious complication. When cardiomyopathy develops, it may contraindicate phlebotomy, requiring chelation therapy instead."
    difficulty: medium
    tags: [hemochromatosis, cardiology, clinical-features, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
