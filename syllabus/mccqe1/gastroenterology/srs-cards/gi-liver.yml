  - front: "What are the late-stage manifestations of Primary Biliary Cholangitis?"
    back: "Jaundice, melanosis (darkening skin), xanthelasma, hepatocellular failure, portal HTN, ascites\n\nChronic cholestasis leads to skin changes including melanosis and xanthelasma, with end-stage disease showing hepatocellular failure and portal hypertension."
    difficulty: medium
    tags: [PBC, cholestasis, portal hypertension, jaundice, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "Does treatment with non-selective beta-blockers (propranolol or carvedilol) reduce decompensation in compensated cirrhosis patients with clinically significant portal hypertension?"
    back: "Yes. Beta-blockers significantly reduce decompensation (16% vs 27% with placebo, HR 0.51, p=0.041), primarily by reducing ascites incidence (HR 0.42, p=0.03).\n\nThe PREDESCI trial (Lancet 2019) showed that lowering hepatic venous pressure gradient with beta-blockers increases decompensation-free survival in cirrhosis patients with CSPH."
    difficulty: hard
    tags: [cirrhosis, portal-hypertension, beta-blockers, ascites, clinical-trial, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What are the histologic features of alcoholic hepatitis?"
    back: "Ballooned (swollen) hepatocytes, Mallory bodies (intracellular eosinophilic aggregates of cytokeratins), and chicken-wire fibrosis (network pattern)\n\nThese histologic findings are characteristic but not specific to alcoholic hepatitis. Mallory bodies can also be seen in other conditions."
    difficulty: hard
    tags: [alcohol-liver-disease, pathology, histology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is the risk of HCC in hemochromatosis patients with cirrhosis?"
    back: "200x increased risk compared to general population\n\nPatients with cirrhosis from hemochromatosis require HCC screening. This dramatically elevated risk justifies regular surveillance."
    difficulty: medium
    tags: [hemochromatosis, oncology, screening, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are the three components of the alcohol-related liver disease spectrum?"
    back: "Steatotic liver disease (reversible), Alcoholic hepatitis (35% of cases, often reversible), Cirrhosis (10-15%, chronic architectural changes)\n\nALD progresses from reversible fatty liver to alcoholic hepatitis, and finally to cirrhosis. The latter involves permanent architectural changes, though fibrosis may improve with abstinence."
    difficulty: easy
    tags: [alcoholic-liver-disease, hepatology, pathology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What are Mallory bodies in the context of alcoholic hepatitis?"
    back: "Intracellular eosinophilic aggregates of cytokeratins (ballooned degenerated hepatocytes)\n\nMallory bodies are characteristic histologic findings in alcoholic hepatitis, representing cytoskeletal aggregates in damaged hepatocytes."
    difficulty: medium
    tags: [alcoholic-liver-disease, histology, hepatology, pathology, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What is 'chicken-wire fibrosis' in alcoholic liver disease?"
    back: "A network-like pericellular fibrosis surrounding hepatocytes, characteristic of alcoholic hepatitis\n\nChicken-wire fibrosis refers to the delicate perisinusoidal fibrous network that develops around central veins in alcoholic hepatitis, representing early architectural changes."
    difficulty: medium
    tags: [alcoholic-liver-disease, histology, hepatology, fibrosis, toronto-notes, pages-0471-0472-0473-0474-0475-0476-0477-0478-0479-0480]
  - front: "What was the primary endpoint in the PREDESCI trial regarding beta-blockers in cirrhosis?"
    back: "Incidence of cirrhosis decompensation or death\n\nThe PREDESCI trial tested whether lowering hepatic venous pressure gradient with beta-blockers decreases decompensation risk in compensated cirrhosis with clinically significant portal hypertension."
    difficulty: medium
    tags: [cirrhosis, portal hypertension, beta-blockers, PREDESCI trial, ascites, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What specific complication of cirrhosis was reduced by beta-blockers in the PREDESCI trial?"
    back: "Ascites\n\nThe difference in the primary endpoint was driven by a reduced incidence of ascites (HR 0.42, 95% CI 0.19-0.92, P=0.03)."
    difficulty: medium
    tags: [cirrhosis, ascites, beta-blockers, portal hypertension, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What was the conclusion of the PREDESCI trial regarding beta-blocker therapy in cirrhosis with CSPH?"
    back: "Long-term treatment with beta-blockers increases decompensation-free survival in patients with cirrhosis and CSPH, mainly by reducing the incidence of ascites\n\nThe trial demonstrated that beta-blockers significantly reduced the risk of decompensation or death, with a favorable safety profile (similar adverse events to placebo)."
    difficulty: medium
    tags: [beta-blockers, cirrhosis, portal hypertension, decompensation, PREDESCI trial, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is the effect of beta-blockers on decompensation in cirrhosis patients with clinically significant portal hypertension (CSPH)?"
    back: "Beta-blockers (propranolol/carvedilol) reduce decompensation risk from 27% to 16% (HR 0.51, P=0.041), primarily by reducing ascites incidence (HR 0.42, P=0.03)\n\nThe PREDESCI trial randomized 201 patients with compensated cirrhosis and CSPH to beta-blockers vs placebo, showing improved decompensation-free survival with treatment"
    difficulty: hard
    tags: [hepatology, cirrhosis, portal hypertension, beta-blockers, PREDESCI trial, ascites, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What was the primary endpoint in the PREDESCI trial for cirrhosis with CSPH?"
    back: "Incidence of cirrhosis decompensation (ascites, variceal bleeding, hepatic encephalopathy) or death\n\nThe PREDESCI trial studied whether lowering hepatic venous pressure gradient with beta-blockers prevents clinical deterioration in compensated cirrhosis patients"
    difficulty: hard
    tags: [hepatology, clinical trials, PREDESCI trial, endpoint, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What does the PREDESCI trial demonstrate about beta-blockers in cirrhosis with clinically significant portal hypertension (CSPH)?"
    back: "Beta-blockers (propranolol/carvedilol) significantly reduce cirrhosis decompensation and death (16% vs 27%, HR 0.51, p=0.041), primarily by reducing ascites incidence (HR 0.42, p=0.03).\n\nThe PREDESCI trial (Lancet 2019) enrolled 201 patients with compensated cirrhosis and CSPH, showing that HVPG-lowering with beta-blockers improves decompensation-free survival."
    difficulty: hard
    tags: [cirrhosis, portal-hypertension, beta-blockers, ascites, clinical-trials, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What was the primary endpoint of the PREDESCI trial?"
    back: "Incidence of cirrhosis decompensation (ascites, variceal bleeding, hepatic encephalopathy) or death.\n\nThe PREDESCI trial measured decompensation-free survival as its primary outcome, comparing beta-blocker therapy to placebo in patients with clinically significant portal hypertension."
    difficulty: medium
    tags: [cirrhosis, clinical-trials, primary-endpoint, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What is the mechanism by which beta-blockers reduce decompensation in cirrhosis with CSPH?"
    back: "Lowering hepatic venous pressure gradient (HVPG), which reduces portal pressure and prevents progression to decompensation.\n\nBeta-blockers reduce cardiac output and splanchnic blood flow, decreasing portal venous inflow and thereby lowering HVPG, which is the pathophysiological driver of decompensation."
    difficulty: hard
    tags: [portal-hypertension, hvpg, pathophysiology, beta-blockers, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What diagnostic criteria define non-alcoholic fatty liver disease (NAFLD) according to US gastroenterology guidelines?"
    back: "NAFLD is defined by hepatic steatosis in the absence of secondary causes (alcohol, medications, viral hepatitis), with NASH representing the inflammatory subset\n\nThe AGA/AASLD/ACG practice guideline (Gastroenterology 2012) establishes diagnostic criteria requiring imaging or biopsy confirmation of steatosis plus exclusion of other etiologies"
    difficulty: hard
    tags: [NAFLD, NASH, fatty liver, diagnosis, guidelines, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
  - front: "What viral infections can cause Acute Pancreatitis?"
    back: "Mumps, rubella, varicella, viral hepatitis, CMV, EBV, HIV, Coxsackie virus, echovirus, adenovirus\n\nMultiple viruses have been implicated in viral-induced pancreatitis as part of the GET SMASHED mnemonic."
    difficulty: medium
    tags: [pancreatitis, viral, infection, toronto-notes, pages-0481-0482-0483-0484-0485-0486-0487-0488-0489-0490]
  - front: "What does the PREDESCI trial demonstrate about beta-blockers in cirrhosis patients with clinically significant portal hypertension (CSPH)?"
    back: "Long-term beta-blocker treatment (propranolol/carvedilol) increases decompensation-free survival, primarily by reducing ascites incidence (HR 0.42, p=0.03). Primary endpoint occurred in 16% vs 27% (HR 0.51, p=0.041).\n\nThe PREDESCI trial (Lancet 2019) studied 201 patients with compensated cirrhosis and CSPH, showing that lowering hepatic venous pressure gradient with beta-blockers decreases decompensation risk."
    difficulty: medium
    tags: [cirrhosis, portal-hypertension, beta-blockers, ascites, hepatology, toronto-notes, pages-0491-0492-0493-0494-0495-0496-0497-0498-0499-0500]
