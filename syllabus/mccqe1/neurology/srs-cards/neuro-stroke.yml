  - front: "What is the function of 17-alpha hydroxylase in steroid synthesis?"
    back: "Converts pregnenolone to 17-OH-pregnenolone and progesterone to 17-OH-progesterone, essential for cortisol synthesis\n\nDeficiency of this enzyme leads to cortisol deficiency with accumulated mineralocorticoids."
