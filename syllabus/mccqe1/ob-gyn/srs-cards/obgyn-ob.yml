  - front: "What is the treatment for primary herpes episode during pregnancy?"
    back: "Acyclovir 400 mg PO TID x 7-10 days OR valacyclovir 1g PO BID x 7-10 days\n\nAntiviral treatment reduces viral shedding and may decrease neonatal transmission risk in primary infections."
    difficulty: medium
    tags: [dermatology, infections, viral, HSV, pregnancy, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What was the CHAP trial finding regarding treating mild chronic hypertension in pregnancy?"
    back: "Treatment targeting BP <140/90 mmHg reduced primary outcome (preeclampsia, preterm birth <35wk, placental abruption, fetal/neonatal death): 30.2% vs 37.0% in control\n\nCHAP supports treating mild chronic hypertension (BP 140/90 mmHg) in pregnancy, previously only severe HTN was treated."
