# Valvular Heart Disease (Cardiology) - generated from srs-mccqe1
cards:
  - front: "A 75-year-old has exertional syncope, angina, and dyspnea. Harsh systolic murmur at right upper sternal border radiating to neck. Echo: AVA 0.8 cm2, mean gradient 45 mmHg. Diagnosis and management?"
    back: "Severe aortic stenosis; SAVR or TAVR depending on surgical risk — symptomatic severe AS has 2-year mortality ~50% without intervention\n\nCCS guidelines recommend intervention for symptomatic severe AS (AVA <1.0 cm2, mean gradient >40 mmHg). TAVR for high-risk/inoperable; SAVR preferred for low-risk patients <65."
    difficulty: hard
    tags: [aortic stenosis, AVR, TAVR, severe AS, cardiology, valvular]
  - front: "What physical exam findings characterize mitral stenosis?"
    back: "Opening snap after S2, low-pitched mid-diastolic rumble at apex, loud S1, signs of pulmonary hypertension\n\nMitral stenosis is most commonly rheumatic. Severity: MVA <1.0 cm2 = severe. AF common due to LA enlargement. Treatment: diuretics, anticoagulation if AF, balloon mitral valvuloplasty, or MVR."
    difficulty: medium
    tags: [mitral stenosis, opening snap, rheumatic heart disease, valvular, cardiology]
  - front: "A 40-year-old with bicuspid aortic valve has severe AR. Echo shows LVEDD 65mm, LVESD 45mm, EF 55%. When to recommend surgery?"
    back: "Surgery for severe AR with: EF <50%, LVEDD >70mm, LVESD >50mm, or symptoms\n\nCCS guidelines recommend AVR for symptomatic severe AR or asymptomatic meeting echocardiographic thresholds. Vasodilators temporize but do not replace surgery. Surveillance echo every 6-12 months."
    difficulty: hard
    tags: [aortic regurgitation, AVR, LV dilation, valvular, cardiology]
  - front: "What is the Carpentier classification of mitral regurgitation?"
    back: "Type I: normal leaflet motion (annular dilation, perforation); Type II: excessive motion (prolapse, chordal rupture); Type III: restricted motion (rheumatic IIIa, ischemic IIIb)\n\nUnderstanding MR mechanism guides surgical approach. Type II MR is most amenable to repair. CCS prefers mitral valve repair over replacement. Surgery for severe MR with symptoms or EF <60% or LVESD >40mm."
    difficulty: hard
    tags: [mitral regurgitation, Carpentier classification, valvular, cardiology]
  - front: "What antibiotic is used for IE prophylaxis before dental procedures in high-risk patients?"
    back: "Amoxicillin 2g PO 30-60 min before procedure (clindamycin 600mg if penicillin allergic)\n\nProphylaxis only for high-risk conditions: prosthetic valve, prior IE, unrepaired cyanotic CHD. NOT recommended for MVP alone or most native valve disease — significant narrowing of indications from prior guidelines."
    difficulty: easy
    tags: [endocarditis prophylaxis, amoxicillin, dental procedure, high-risk cardiac, valvular]
  - front: "A 65-year-old with MVP has sudden severe MR and flail posterior leaflet on echo after minor chest trauma. Management?"
    back: "Urgent mitral valve surgery (repair if feasible); stabilize with IV nitroprusside and diuretics as bridge\n\nAcute severe MR causes volume overload of non-dilated LV, rapid hemodynamic deterioration. Nitroprusside reduces afterload and improves forward flow. IABP can bridge to OR."
    difficulty: hard
    tags: [acute MR, chordal rupture, mitral valve repair, valvular, emergent surgery]
  - front: "What are the major Duke criteria for infective endocarditis?"
    back: "Positive blood cultures (typical organisms x2 or persistent bacteremia) AND evidence of endocardial involvement (echo vegetation, new regurgitation, positive Q-gate CT)\n\nDefinite IE: 2 major, 1 major + 3 minor, or 5 minor criteria. TOE preferred for sensitivity. Blood cultures (3 sets before antibiotics) are critical."
    difficulty: medium
    tags: [Duke criteria, infective endocarditis, blood cultures, echocardiography, valvular]
  - front: "Common organisms in native valve vs. prosthetic valve endocarditis?"
    back: "Native valve: Strep viridans (subacute), Staph aureus (acute), Enterococcus; Early prosthetic (<60d): CoNS, Staph aureus; Late prosthetic (>60d): similar to native\n\nStrep viridans causes subacute IE via dental portals. Staph aureus causes acute IE with rapid valve destruction. IV drug use: Staph aureus, right-sided (tricuspid). Duration: 4-6 weeks IV antibiotics."
    difficulty: medium
    tags: [endocarditis organisms, native valve, prosthetic valve, Staph aureus, valvular]
  - front: "A patient with mechanical mitral valve has INR 6.5 and minor bleeding. Management?"
    back: "Hold warfarin, give vitamin K 1-2.5 mg PO; if major bleeding: 4-factor PCC + IV vitamin K — DOACs are contraindicated with mechanical valves\n\nMechanical valves require lifelong anticoagulation (INR 2.5-3.5 for mitral). DOACs contraindicated with mechanical valves (RE-ALIGN trial showed increased thromboembolism)."
    difficulty: hard
    tags: [mechanical valve, INR reversal, warfarin, vitamin K, valvular]
  - front: "What cardiac manifestations are associated with Marfan syndrome?"
    back: "Aortic root dilation/dissection (major cause of death) and mitral valve prolapse with regurgitation\n\nProphylactic aortic root repair when diameter ≥5.0 cm. Beta-blockers and losartan slow aortic expansion. Annual surveillance MRI/CT of aorta."
    difficulty: medium
    tags: [Marfan syndrome, aortic dissection, mitral valve prolapse, valvular]
  - front: "A 72-year-old man presents with a 6-month history of exertional syncope, dyspnea, and angina. Auscultation reveals a harsh systolic murmur that peaks late and a single S2. Carotid upstroke is slow and delayed. Echo shows a peak gradient of 90 mmHg, mean gradient 62 mmHg, AVA 0.6 cm², and EF 62%. What is the immediate management?\n\nA) Aortic valvuloplasty as a bridge to definitive therapy\nB) Urgent surgical aortic valve replacement\nC) TAVR based on age and hemodynamics\nD) Intensive medical therapy with diuretics and beta-blockade"
    back: "B) Urgent surgical aortic valve replacement\n\nThis patient has severe symptomatic AS with classic triad (syncope, angina, dyspnea). Mean gradient ≥40 mmHg + AVA ≤0.6 cm² = very severe AS. The symptom triad carries a prognosis of death within 2–5 years without AVR. In a 72-year-old with no stated surgical contraindications, SAVR is the gold standard (durability, leaflet anatomy). TAVR is preferred for high surgical risk (STS ≥ 8%) or intermediate risk if anatomy favors TAVR (PARTNER 2, SURTAVI). Age 72 with no comorbidities listed = likely low-intermediate risk — SAVR is the standard. Guidelines do not recommend medical therapy to delay AVR in symptomatic severe AS."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 65-year-old woman has asymptomatic severe AS (peak velocity 5.2 m/s, mean gradient 68 mmHg, AVA 0.65 cm², EF 55%). She is being managed conservatively. Which finding would prompt intervention BEFORE symptom development?\n\nA) Peak velocity of 5.2 m/s alone — very severe AS warrants prophylactic intervention\nB) Progressive decline in EF from 55% to 52% over 12 months\nC) LVEF falling below 50%\nD) Rate of Vmax increase > 0.3 m/s/year on serial echo"
    back: "C) LVEF falling below 50%\n\nPer 2021 ESC and 2020 ACC/AHA guidelines, AVR in ASYMPTOMATIC severe AS is recommended when: (1) LVEF < 50% (Class I) — systolic dysfunction is occurring; (2) very severe AS (Vmax ≥ 5.0 m/s) with low surgical risk (Class IIa, ESC). Recent AVATAR and RECOVERY trials support early AVR in very severe asymptomatic AS. A Vmax of 5.2 m/s + any LVEF drop below 50% is a Class I indication. EF dropping from 55% to 52% is concerning but not yet the 50% threshold. LVEF < 50% is the clearest non-symptom surgical trigger."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 48-year-old man has severe aortic regurgitation. Echo shows: EF 52%, LVESD 51mm, LVEDD 72mm. He is asymptomatic. What is the most appropriate management?\n\nA) Medical therapy with vasodilators — surgery not yet required\nB) Aortic valve replacement — LVESD ≥ 50mm is a surgical indication\nC) Annual surveillance echo — below all surgical thresholds\nD) Aortic valve repair — preferred over replacement in regurgitation"
    back: "B) Aortic valve replacement — LVESD ≥ 50mm is a surgical indication\n\nPer 2020 ACC/AHA guidelines for severe aortic regurgitation, AVR is recommended (Class I) for: (1) symptomatic patients; (2) LVEF < 55%; (3) LVESD ≥ 50mm (Class IIa) — per 2014 guidelines. The 2020 ACC/AHA guideline updates: AVR is Class IIa when LVESD > 50mm OR LVESD index > 25mm/m² in asymptomatic patients. The 2021 ESC guidelines recommend surgery when LVESD > 50mm. This patient has LVESD 51mm — a Class IIa/Class I threshold depending on the guideline used. Given borderline EF 52% approaching the <55% threshold and LVESD ≥ 50mm, surgical referral is appropriate."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 35-year-old woman, para 2, develops severe dyspnea in the third trimester. Echo shows mitral stenosis with MVA 0.9 cm², mean gradient 18 mmHg, Wilkins score 6. She has mild mitral regurgitation (1+) and no LAA thrombus. What is the most appropriate intervention?\n\nA) Urgent caesarean section and simultaneous mitral valve replacement under cardiopulmonary bypass\nB) Percutaneous mitral balloon valvuloplasty (PMBV) — safe in pregnancy with favorable anatomy\nC) Medical management with diuretics and beta-blockers until delivery\nD) Heart rate control with bisoprolol; delay all procedural intervention until postpartum"
    back: "B) Percutaneous mitral balloon valvuloplasty (PMBV) — safe in pregnancy with favorable anatomy\n\nSevere MS (MVA <1.0 cm²) with NYHA III/IV in pregnancy is a high-risk situation. PMBV is the treatment of choice for severe symptomatic MS in pregnancy when: (1) anatomy is favorable (Wilkins score ≤8), (2) no significant MR, (3) no LAA thrombus. Wilkins score 6 + mild MR + no thrombus = ideal for PMBV. MVR under CPB carries 15–30% fetal mortality and significant maternal risk. Surgical intervention is a last resort. PMBV can be safely performed with lead shielding to minimize fetal radiation exposure (ideally after week 12). Beta-blockers and diuretics help but are insufficient for severe hemodynamic compromise."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 68-year-old man with a history of rheumatic fever has mixed mitral valve disease. Echo shows mean MV gradient 12 mmHg, MVA 1.3 cm² (moderate MS), and grade 3/4 MR. EF is 50%. He is NYHA class III. What is the most appropriate surgical intervention?\n\nA) Mitral valve repair targeting the MR component only\nB) Mitral valve replacement — combined MS/MR with rheumatic etiology is not repairable\nC) Mitral balloon valvuloplasty — the MS component is dominant\nD) Transcatheter MV replacement (TMVR) via TENDYNE or Intrepid system"
    back: "B) Mitral valve replacement — combined MS/MR with rheumatic etiology is not repairable\n\nIn rheumatic mixed mitral valve disease (moderate MS + significant MR), the valve leaflets and subvalvular apparatus are typically heavily fibrosed and calcified — making repair technically unfeasible with high recurrence rates. MVR (mitral valve replacement) is the definitive surgical treatment. Unlike degenerative MR (where repair rates > 95% in expert centres), rheumatic MV disease has much lower repair rates. The combination of MS + MR with rheumatic pathology, NYHA III, and declining EF (approaching 50%) is a clear MVR indication. TMVR is an emerging option for high-risk surgical patients."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 74-year-old woman has severe aortic stenosis (AVA 0.7 cm²) and is being evaluated for TAVR. Her CT aortogram shows a bicuspid aortic valve (type 1 fusion, no raphe), aortic annulus diameter 26mm, and LVOT calcification (calcium volume 1200 mm³). What is the major risk associated with TAVR in this patient?\n\nA) Higher risk of vascular access complications due to large annulus\nB) Increased risk of paravalvular regurgitation and annular rupture\nC) No increased risk — bicuspid AS is no longer a contraindication to TAVR\nD) Bicuspid valve is more prone to TAVR device embolization into the aorta"
    back: "B) Increased risk of paravalvular regurgitation and annular rupture\n\nBicuspid AS presents specific TAVR challenges: (1) Elliptical/asymmetric annular anatomy makes sizing difficult — increased risk of paravalvular regurgitation (PVL); (2) Heavy asymmetric calcium (especially LVOT calcium, calcium volume > 800mm³) → risk of annular rupture during balloon post-dilation; (3) Coronary height and commissure alignment issues; (4) Supra-annular calcium may prevent full expansion. LVOT calcium > 800mm³ is a predictor of device success and annular rupture. Large bicuspid annuli (>26mm) may exceed TAVR prosthesis sizing limits. Surgical AVR remains preferred in low-risk bicuspid patients at experienced centres."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 55-year-old man has recently recovered from S. aureus bacteremia. He was treated with IV nafcillin for 6 weeks for aortic valve endocarditis. Echo shows a mobile vegetation on the aortic valve but no hemodynamic compromise. He remains afebrile and blood cultures have been negative for 2 weeks. When is it safe to consider valve surgery (AVR) in this patient?\n\nA) Immediate surgery — S. aureus endocarditis always requires surgical debridement\nB) Wait 4–6 weeks post-bacteremia clearance before proceeding with AVR\nC) Surgery is not indicated — he has been treated; surveillance echo every 3 months\nD) Proceed with surgery now to eradicate residual vegetation and prevent embolism"
    back: "D) Proceed with surgery now to eradicate residual vegetation and prevent embolism\n\nIn NVE (native valve endocarditis), the principal indications for surgery during active infection include: (1) Heart failure (HF from severe valve regurgitation); (2) Uncontrolled infection (persistent bacteremia, abscess, fistula); (3) Prevention of embolism (large vegetation > 10mm + prior embolic event, or > 15mm with mobile vegetation especially on anterior MV leaflet). S. aureus NVE with a persistent mobile vegetation carries high embolic risk (CVA, visceral infarction). Despite clinical improvement, the presence of a mobile vegetation in S. aureus endocarditis supports EARLY surgical intervention to prevent catastrophic embolization."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 63-year-old man had mechanical aortic valve replacement 5 years ago. He takes warfarin with a target INR of 2.5–3.5. He requires urgent abdominal surgery. His last INR was 3.2 yesterday. How should anticoagulation be managed?\n\nA) Hold warfarin and bridge with LMWH (therapeutic dose) until surgery\nB) Give IV vitamin K 10mg to rapidly reverse INR, then bridge with UFH\nC) Proceed with surgery with INR 3.2 — mechanical valves are a relative contraindication to reversal\nD) Give 4-factor PCC to fully reverse, proceed with urgent surgery, restart warfarin 24h post-op"
    back: "D) Give 4-factor PCC to fully reverse, proceed with urgent surgery, restart warfarin 24h post-op\n\nFor urgent/emergent surgery with a mechanical heart valve on warfarin, the decision depends on urgency. For URGENT (same-day/emergency) surgery with INR 3.2: 4-factor PCC (25–50 units/kg) rapidly reverses INR within minutes (1–2 hours) — superior to FFP for urgent reversal. Adding low-dose IV vitamin K (1–2mg) helps maintain reversal. Post-operatively, restart warfarin and bridge with UFH until therapeutic. LMWH bridging for mechanical valves is inferior to UFH (evidence from BRIDGE trial supports no bridging in bioprosthetic/low-risk AF, but mechanical valves always require bridging). 4-PCC is the fastest reversal agent for urgent scenarios."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 42-year-old woman with systemic lupus has a murmur. Echo shows: Mitral valve with nodular thickening on both surfaces of the leaflets (Libman-Sacks), mild mitral regurgitation, small pericardial effusion. She is asymptomatic. Blood cultures are negative. Which statement is MOST accurate?\n\nA) Libman-Sacks endocarditis is an indication for immediate surgical valve replacement\nB) The vegetations are sterile fibrin thrombi; antibiotic prophylaxis is required pre-procedure\nC) The main risk of Libman-Sacks endocarditis is peripheral embolism; anticoagulation with warfarin is indicated\nD) This is always associated with antiphospholipid syndrome; DOAC is preferred for anticoagulation"
    back: "C) The main risk of Libman-Sacks endocarditis is peripheral embolism; anticoagulation with warfarin is indicated\n\nLibman-Sacks endocarditis (LSE) in SLE consists of sterile, fibrinous (non-infectious) vegetations occurring on both leaflet surfaces — characteristically on the ventricular surface of the mitral valve (differentiating from infectious endocarditis on atrial surface). The main complications are embolic (CVA, TIA, peripheral). Anticoagulation with warfarin is indicated in SLE patients with LSE + antiphospholipid antibodies (aPL) — DOACs are NOT recommended in antiphospholipid syndrome (TRAPS trial showed worse outcomes with rivaroxaban vs. warfarin in triple-positive APS). Surgery is reserved for significant hemodynamic compromise."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 55-year-old man presents with acute severe MR following rupture of a chordae tendineae. Echo shows a flail posterior mitral leaflet P2 scallop, severe MR (jet eccentric, hugging the left atrial wall), LVEF 65%, and LVEDV mildly dilated. BP is 95/60, HR 120. What is the most appropriate hemodynamic optimization BEFORE surgery?\n\nA) Phenylephrine to increase BP and afterload\nB) IV nitroprusside or nitroglycerin ± IABP to reduce afterload and forward flow\nC) IV metoprolol to control heart rate\nD) IV fluid challenge to increase preload and stroke volume"
    back: "B) IV nitroprusside or nitroglycerin ± IABP to reduce afterload and forward flow\n\nIn acute severe MR, the dilated, thin-walled left atrium cannot accommodate the acute volume overload — pulmonary edema ensues. The regurgitant fraction depends heavily on the pressure gradient between LV and LA, and LV outflow resistance (afterload). Reducing afterload (nitroprusside, nitroglycerin) decreases the regurgitant fraction and increases forward cardiac output. IABP can augment forward flow and reduce afterload in cardiogenic shock. Phenylephrine increases SVR → more blood regurgitates back into LA (contraindicated). Fluid challenge worsens pulmonary edema. The definitive treatment is urgent surgical MV repair."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 70-year-old man undergoes TAVR for severe AS. On post-procedure echo, Doppler shows a peak gradient of 28 mmHg across the TAVR prosthesis (expected < 20 mmHg for valve size), moderate prosthesis-patient mismatch (PPM) by effective orifice area index (0.63 cm²/m²). He is dyspneic on exertion post-procedure. What does PPM represent?\n\nA) The transcatheter valve leaflets are malfunctioning — requires redo TAVR\nB) The prosthetic valve is functioning normally but is too small for the patient's hemodynamic demands\nC) Pannus ingrowth has already occurred, causing valve obstruction\nD) Subclinical leaflet thrombosis — anticoagulation is required"
    back: "B) The prosthetic valve is functioning normally but is too small for the patient's hemodynamic demands\n\nProsthesis-Patient Mismatch (PPM) occurs when a normally functioning prosthetic valve is hemodynamically too small for the patient's body surface area/cardiac output requirements — the effective orifice area (EOA) indexed to BSA is less than what the native heart requires. Moderate PPM: EOAI 0.65–0.85 cm²/m²; severe PPM < 0.65 cm²/m². This is distinct from structural valve dysfunction. PPM contributes to residual gradients and reduced functional improvement post-AVR/TAVR. It is associated with worse outcomes. Prevention: using the largest possible prosthesis (annular enlargement in surgery, largest TAVR for annulus). No further intervention needed — consider exercise tolerance management."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 78-year-old woman with a bioprosthetic mitral valve (implanted 9 years ago) presents with worsening exertional dyspnea. Echo shows: mean mitral gradient 18 mmHg (previously 6 mmHg two years ago), valve area by PHT 0.9 cm², normal EF. She is high risk for redo surgery (STS 9%). What is the most appropriate intervention?\n\nA) Conservative management — bioprosthetic valve stenosis is expected at 9 years\nB) Redo MVR via sternotomy — transcatheter options not applicable to mitral bioprostheses\nC) Valve-in-valve TMVR (transcatheter mitral valve-in-valve) using TAVR technology\nD) Balloon valvuloplasty of the bioprosthetic valve"
    back: "C) Valve-in-valve TMVR (transcatheter mitral valve-in-valve) using TAVR technology\n\nTranscatheter valve-in-valve (ViV) TMVR is an established procedure for failing bioprosthetic mitral valves in patients who are high surgical risk for redo operation. The technique deploys a TAVR prosthesis (typically a balloon-expandable valve like the SAPIEN 3) within the failed bioprosthesis, using the old valve's ring as the landing zone. Success rates are high with acceptable gradients. The MITRAL trial established feasibility. At STS 9%, redo conventional surgery carries prohibitive risk — ViV-TMVR is the guideline-supported alternative. Balloon valvuloplasty of a degenerated bioprosthesis causes leaflet destruction, not correction."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 30-year-old man has a bicuspid aortic valve incidentally found. He is asymptomatic with EF 65%, AVA 1.8 cm², and aortic root diameter of 46mm. His mother had a Type A aortic dissection at 50. Which surveillance and management plan is most appropriate?\n\nA) Surveillance echo every 5 years — no action needed until AVA < 1.0 cm²\nB) Annual echo and CT aorta — consider prophylactic aortic root surgery if diameter reaches 50mm\nC) Annual echo; prophylactic surgery NOW given family history of dissection at aortic root diameter 46mm\nD) Refer for genetic testing; elective AVR to eliminate bicuspid valve stress on the aortic root"
    back: "B) Annual echo and CT aorta — consider prophylactic aortic root surgery if diameter reaches 50mm\n\nBicuspid aortic valve (BAV) is associated with aortopathy — dilation of the ascending aorta/root. Prophylactic surgery thresholds per 2022 ACC/AHA guidelines: aortic diameter ≥55mm (general), or ≥50mm with risk factors (family history of dissection, rapid growth >3mm/year, Marfan/Turner syndrome). At 46mm with family history, prophylactic surgery is not yet indicated. Annual surveillance imaging (TTE + CT aorta at 5-year intervals or sooner if growing) is appropriate. The threshold drops to 50mm with a first-degree relative with Type A dissection. This patient needs close monitoring but surgery at 46mm is premature."
    difficulty: hard
    tags: [Valvular, MCQ, Toronto Notes]
  - front: "A 35-year-old man presents with sharp chest pain worse with inspiration and lying flat, improved by leaning forward. ECG shows diffuse ST elevation with PR depression in multiple leads. His CRP is 85 mg/L. Troponin is mildly elevated (0.5 ng/mL). Echo shows no effusion. What is the MOST appropriate treatment?\n\nA) Aspirin 650mg q6h + colchicine 0.5mg BID + restrict strenuous exercise for 3 months\nB) NSAID + prednisone — dual therapy is standard for pericarditis\nC) Immediate drainage — elevated troponin indicates pericardial effusion\nD) Heparin + aspirin — troponin elevation indicates concurrent MI"
    back: "A) Aspirin 650mg q6h + colchicine 0.5mg BID + restrict strenuous exercise for 3 months\n\nAcute pericarditis treatment: (1) Aspirin 750–1000mg TID or ibuprofen 600mg TID for 1–2 weeks with gradual taper; (2) Colchicine 0.5mg BID for 3 months (COPE, ICAP trials) — halves recurrence rate; (3) Exercise restriction until asymptomatic + CRP normalized (typically 3 months for athletes). Mild troponin elevation indicates myopericarditis (pericarditis with myocardial involvement) — does NOT change the pericarditis management and does not indicate MI or drainage. Corticosteroids are reserved for cases refractory to NSAID + colchicine or specific etiologies (connective tissue disease, autoreactive) — first-line steroids increase recurrence."
    difficulty: hard
    tags: [Pericardial, MCQ, Toronto Notes]
  - front: "A 65-year-old woman with lung cancer is found to have a large pericardial effusion on routine staging CT. Echo shows: RV diastolic collapse, RA systolic collapse, dilated IVC without respiratory variation. Her BP is 88/58, HR 120. What is the pathophysiology of her clinical state?\n\nA) Elevated pericardial pressure reduces transmural filling pressure, impairing cardiac filling\nB) The effusion directly compresses the coronary arteries, causing ischemia\nC) Neurogenic activation of the Bezold-Jarisch reflex causes bradycardia and hypotension\nD) The pericardial fluid increases LV afterload through visceral pericardial constriction"
    back: "A) Elevated pericardial pressure reduces transmural filling pressure, impairing cardiac filling\n\nCardiac tamponade physiology: rising pericardial fluid raises intrapericardial pressure (IPP). When IPP equals the LOWEST diastolic filling pressure (usually RA, then RV), cardiac chambers collapse. Elevated IPP equalizes with RA and RV diastolic pressures → impaired ventricular filling → reduced CO → obstructive shock. The transmural pressure (intracavitary pressure minus pericardial pressure) falls to near zero. Beck's triad: hypotension, muffled heart sounds, elevated JVP. Classic signs: pulsus paradoxus > 10mmHg, electrical alternans, sinus tachycardia. Immediate pericardiocentesis is life-saving."
    difficulty: hard
    tags: [Pericardial, MCQ, Toronto Notes]
  - front: "A 55-year-old man presents 6 months after coronary artery bypass surgery with progressive dyspnea, fatigue, and lower extremity edema. JVP is elevated and does not decrease with inspiration (positive Kussmaul's sign). Heart sounds are normal. There is a pericardial knock on auscultation. Echo shows thickened pericardium with septal bounce and respiratory variation. What is the characteristic hemodynamic finding on right heart catheterization?\n\nA) Elevated and equal diastolic pressures in all four chambers (diastolic equalization)\nB) High PCWP with low CO and high SVR\nC) High pulmonary artery systolic pressure with normal wedge\nD) Normal RA pressure with elevated PCWP"
    back: "A) Elevated and equal diastolic pressures in all four chambers (diastolic equalization)\n\nConstrictive pericarditis: The thickened, rigid pericardium constrains cardiac filling during diastole. The characteristic hemodynamic 'square root sign' on RV/LV pressure tracings (rapid early filling → abrupt rise → plateau) and equalization of all diastolic pressures within 5mmHg (RVEDP = LVEDP = PCWP = mean RA pressure ≈ 15–25 mmHg) are pathognomonic. This 'diastolic equalization' distinguishes constrictive pericarditis from restrictive cardiomyopathy (where LV diastolic pressure exceeds RV by >5mmHg). Pericardial knock = early diastolic sound of abrupt cessation of filling against rigid pericardium."
    difficulty: hard
    tags: [Pericardial, MCQ, Toronto Notes]
  - front: "A 48-year-old man with recurrent pericarditis (4th episode in 18 months) is refractory to colchicine and NSAIDs. He requires prednisone 30mg/day to control symptoms but every taper below 10mg leads to recurrence. Which biological agent has the strongest evidence for reducing recurrence in colchicine-refractory recurrent pericarditis?\n\nA) Infliximab (anti-TNF)\nB) Anakinra (IL-1 receptor antagonist)\nC) Rituximab (anti-CD20)\nD) Azathioprine as a steroid-sparing agent"
    back: "B) Anakinra (IL-1 receptor antagonist)\n\nRecurrent idiopathic pericarditis is driven by IL-1β-mediated autoinflammatory cascade. Anakinra (recombinant IL-1 receptor antagonist) has been shown in multiple studies (AIRTRIP RCT, 2016 — the only placebo-controlled RCT in recurrent pericarditis) to significantly reduce recurrence in corticosteroid-dependent, colchicine-refractory recurrent pericarditis. It is now included in the 2015 ESC pericardial disease guidelines as a second-line option. Rilonacept (IL-1α/β trap, RHAPSODY trial 2021) is another IL-1 blocker approved by FDA for recurrent pericarditis. Azathioprine is used as steroid-sparing but has weaker evidence."
    difficulty: hard
    tags: [Pericardial, MCQ, Toronto Notes]
  - front: "A 32-year-old woman presents for pre-pregnancy counseling. She has a repaired coarctation of the aorta (balloon angioplasty at age 12). Current BP is 148/90 in both arms. Echocardiogram shows a mildly dilated ascending aorta (38mm) with a bicuspid aortic valve and moderate stenosis (peak gradient 48mmHg). What is the most important counseling point regarding her pregnancy?\n\nA) Pregnancy is contraindicated given the combined risk of aortopathy and CoA re-stenosis\nB) Pregnancy is high risk — she requires cardiac assessment each trimester; target BP < 140/90; avoid beta-blockers (teratogenic)\nC) Pregnancy is low risk after CoA repair; standard obstetric care is sufficient\nD) Re-intervention for CoA is required before pregnancy regardless of current gradient"
    back: "A) Pregnancy is contraindicated given the combined risk of aortopathy and CoA re-stenosis\n\nThis patient has multiple high-risk features: repaired CoA (re-stenosis/re-coarctation is common; persistent hypertension; re-intervention risk increases with pregnancy's volume load); bicuspid aortic valve with moderate AS (gradient 48mmHg = severe approaching pregnancy's increased CO will increase gradient further); dilated ascending aorta (risk of dissection). Per 2018 ESC Guidelines on Cardiovascular Diseases in Pregnancy, BAV + dilated aorta + CoA = likely mWHO class III (high risk) or IV (very high risk). Maternal mortality risk is substantial. Pre-pregnancy intervention may be required. Multidisciplinary expert centre care mandatory."
    difficulty: hard
    tags: [Congenital, MCQ, Toronto Notes]
  - front: "A 28-year-old man with uncorrected tetralogy of Fallot presents with progressive cyanosis and exertional dyspnea. He squats during exertion. Echocardiogram shows RV-PA pressure gradient 85 mmHg, severe RV hypertrophy, large perimembranous VSD, and overriding aorta. SpO2 is 78%. Which hemodynamic mechanism explains the cyanosis?\n\nA) Pulmonary vascular disease has developed, causing Eisenmenger physiology\nB) Right-to-left shunting across the VSD driven by elevated RV pressure\nC) LV failure causing pulmonary venous hypertension and hypoxia\nD) Pulmonic valve regurgitation causing RV failure and systemic venous congestion"
    back: "B) Right-to-left shunting across the VSD driven by elevated RV pressure\n\nTetralogy of Fallot consists of: (1) VSD, (2) RVOTO (infundibular ± valvular PS), (3) RV hypertrophy, (4) overriding aorta. The RVOTO causes elevated RV pressure → right-to-left shunting through the VSD → deoxygenated blood enters the aorta → cyanosis. Squatting increases systemic vascular resistance (compresses femoral vessels) → increases LV filling pressure → reduces R→L shunt → temporarily improves oxygenation. A 'tet spell' (hypercyanotic episode): crying/exercise → decreased PVR + increased HR → R→L shunting increases → treatment: squatting, oxygen, morphine, phenylephrine. This differs from Eisenmenger (irreversible pulmonary vascular disease from L→R shunt)."
    difficulty: hard
    tags: [Congenital, MCQ, Toronto Notes]
  - front: "An 18-year-old woman is found to have an ostium secundum atrial septal defect (ASD) with a Qp:Qs ratio of 2.8:1 and RV dilation. She is asymptomatic. Pulmonary arterial pressure is 28 mmHg systolic. Echo shows no pulmonary hypertension and no RV dysfunction. What is the most appropriate management?\n\nA) Observe — ASDs < 30 years should be closed only if symptomatic\nB) Percutaneous transcatheter closure (Amplatzer device) — preferred for secundum ASDs\nC) Open surgical repair — all ASDs with Qp:Qs > 2:1 require surgical closure\nD) Bosentan to prevent progression to Eisenmenger syndrome"
    back: "B) Percutaneous transcatheter closure (Amplatzer device) — preferred for secundum ASDs\n\nOstium secundum ASDs with Qp:Qs ≥ 1.5:1 + RV volume overload + no significant PHT → closure is recommended (Class I, ESC GUCH 2020). Percutaneous device closure (Amplatzer septal occluder) is the preferred method for secundum ASDs with suitable anatomy (adequate rims, size ≤ 38mm) — equivalent efficacy to surgery with lower morbidity. Surgery is reserved for: sinus venosus ASDs, primum ASDs (associated with AV canal defects), unsuitable anatomy for device, or combined cardiac surgery. Closure is recommended before PAP reaches 2/3 systemic — this patient's PAP 28mmHg is well below this threshold."
    difficulty: hard
    tags: [Congenital, MCQ, Toronto Notes]
  - front: "A 25-year-old man with known bicuspid aortic valve (BAV) and severe aortic regurgitation is asymptomatic. Echo: EF 54%, LVESD 49mm, LVEDD 70mm. He is a competitive weightlifter. Which recommendation is most appropriate regarding athletic participation?\n\nA) No restrictions — asymptomatic patients with BAV and normal EF can compete in all sports\nB) Restrict from high-intensity isometric exercise (weightlifting) due to AR severity and LV dilation\nC) Only restrict if LVESD > 55mm or EF < 50%\nD) Immediate AVR required — LVESD 49mm with BAV is a surgical indication"
    back: "B) Restrict from high-intensity isometric exercise (weightlifting) due to AR severity and LV dilation\n\nThe 2020 ACC/AHA Valve Guidelines and the Bethesda Conference on Athletic Participation recommend that patients with severe AR and LV dilation (particularly LVEDD > 65mm or LVESD > 50mm approaching thresholds) avoid high-intensity isometric (static) exercise such as weightlifting, which dramatically increases SVR and LV afterload, worsening the regurgitant fraction and accelerating LV dilation. With LVESD 49mm (approaching the 50mm surgical threshold) and BAV, restriction from competitive weightlifting is appropriate. Moderate dynamic exercise is generally acceptable. Surgical timing: LVESD ≥ 50mm or LVESD index > 25mm/m² or LVEF < 55%."
    difficulty: hard
    tags: [Congenital, MCQ, Toronto Notes]
  - front: "A 35-year-old woman is found to have pulmonary arterial hypertension (PAH). Right heart catheterization shows: mPAP 52 mmHg, PCWP 10 mmHg, CO 3.8 L/min, PVR 10.8 Wood units. Her 6MWT is 340m. She is WHO functional class III. Vasodilator testing with inhaled nitric oxide is negative (< 10 mmHg reduction in mPAP, no increase in CO). Which initial treatment is most appropriate?\n\nA) Sildenafil alone — PDE5 inhibitor is first-line for all PAH\nB) Epoprostenol IV — prostacyclin most appropriate for WHO class III–IV\nC) Ambrisentan (ERA) + tadalafil (PDE5i) — upfront combination therapy\nD) Calcium channel blocker — vasodilator testing response threshold met"
    back: "C) Ambrisentan (ERA) + tadalafil (PDE5i) — upfront combination therapy\n\nThe AMBITION trial (2015) established upfront double oral combination therapy (ERA + PDE5i: ambrisentan + tadalafil) as superior to either monotherapy in treatment-naive PAH patients, reducing clinical failure risk by 50%. Per 2022 ESC/ERS PAH guidelines: WHO FC II–III with low/intermediate risk PAH → upfront ambrisentan + tadalafil (Class I, Level B). CCBs are only for vasoreactive patients (positive vasodilator test: ≥10mmHg mPAP reduction to < 40 mmHg with increased/stable CO) — this patient's test was negative. IV epoprostenol is for WHO FC III–IV high-risk or refractory patients."
    difficulty: hard
    tags: [Congenital, MCQ, Toronto Notes]
  - front: "When is aortic valve replacement indicated for aortic stenosis?"
    back: "Symptomatic severe AS (valve area <1.0cm2, mean gradient >40mmHg, peak velocity >4m/s): surgery/TAVI. Asymptomatic severe: surgery if EF<50%, symptoms on exercise testing, or very severe (peak velocity >5m/s). TAVI for high/intermediate surgical risk\n\nCCS/STS guidelines. TAVI (transcatheter aortic valve implantation) has expanded to intermediate-risk. Symptoms: exertional dyspnea, angina, syncope (classic triad). Survival without surgery after symptom onset: angina 5yr, syncope 3yr, HF 2yr. Avoid afterload reduction in severe AS (may cause syncope)."
    difficulty: hard
    tags: [aortic stenosis, AVR, TAVI]
  - front: "What are the causes and management of mitral regurgitation?"
    back: "Primary (degenerative): MVP, rheumatic, endocarditis. Surgery when severe + symptomatic or EF<60% or LVESD>40mm. Secondary (functional): LV dilation/ischemic. Treat HF first. MitraClip (TEER) if persistent severe MR on optimal HF therapy\n\nAcute severe MR: papillary muscle rupture (post-MI) or endocarditis - hemodynamic emergency, afterload reduction (nitroprusside) + IABP + urgent surgery. Chronic MR: may be asymptomatic for years with gradual LV dilation. Serial echo surveillance. Surgical repair preferred over replacement."
    difficulty: hard
    tags: [mitral regurgitation, MVP, surgery]
  - front: "How is infective endocarditis diagnosed (modified Duke criteria)?"
    back: "Major criteria: (1) positive blood cultures (typical organism x2 or persistent), (2) endocardial involvement (vegetation/abscess on echo, new valve regurgitation). Minor: predisposition, fever, vascular phenomena (Janeway), immune phenomena (Osler, Roth spots, GN), positive BC not meeting major. Definite: 2 major, 1 major+3 minor, or 5 minor\n\nBlood cultures x3 sets BEFORE antibiotics. TEE more sensitive than TTE (especially for prosthetic valves, abscess). Empiric treatment: IV nafcillin + gentamicin (native valve) or vancomycin + gentamicin + rifampin (prosthetic). Duration: 4-6 weeks IV. Surgery indications: HF, uncontrolled infection, large vegetation >10mm, emboli."
    difficulty: hard
    tags: [infective endocarditis, Duke criteria, blood cultures]
  - front: "What is the approach to a new murmur in an adult?"
    back: "Systolic: AS (crescendo-decrescendo, radiates to carotids), MR (holosystolic, radiates to axilla), TR, VSD, flow murmur. Diastolic: always pathological - AR (early decrescendo), MS (low-pitched rumble with opening snap). Echo for any diastolic or symptomatic systolic murmur\n\nInnocent/functional murmurs: systolic, <3/6, no radiation, no associated symptoms, no other abnormalities. Features suggesting pathology: diastolic, holosystolic, >3/6, radiation, associated symptoms, abnormal S2, clicks, thrills. Still murmur in children is innocent."
    difficulty: medium
    tags: [murmur, auscultation, echo]
  - front: "What anticoagulation is needed for mechanical vs bioprosthetic valves?"
    back: "Mechanical: lifelong warfarin (target INR 2.5-3.5 for mitral, 2.0-3.0 for aortic) + ASA 81mg. DOACs are CONTRAINDICATED. Bioprosthetic: warfarin or ASA x3-6mo then ASA alone. TAVI: DAPT x3-6mo then ASA\n\nRE-ALIGN trial showed dabigatran INFERIOR to warfarin for mechanical valves (increased thromboembolism and bleeding). Mechanical valve + pregnancy: LMWH (first trimester to avoid warfarin embryopathy) then warfarin (2nd/3rd) then switch to LMWH/UFH near delivery. High thrombotic risk."
    difficulty: hard
    tags: [mechanical valve, anticoagulation, warfarin]
  - front: "What are the current guidelines for infective endocarditis prophylaxis?"
    back: "Prophylaxis ONLY for highest-risk patients undergoing dental procedures involving gingival manipulation/perforation: prosthetic valve, prior IE, certain CHD (unrepaired cyanotic, repaired with prosthetic <6mo), cardiac transplant with valvulopathy. Amoxicillin 2g PO 30-60min before\n\nCCS/AHA guidelines significantly narrowed prophylaxis indications. No longer recommended for: MVP, bicuspid aortic valve, rheumatic heart disease, GI/GU procedures. Penicillin allergy: cephalexin 2g, azithromycin 500mg, or clindamycin 600mg. Good oral hygiene more important than prophylaxis."
    difficulty: medium
    tags: [endocarditis prophylaxis, dental, amoxicillin]
  - front: "What is mitral stenosis: causes, presentation, and management?"
    back: "Cause: rheumatic heart disease (nearly always). Presentation: dyspnea, low-pitched diastolic rumble with opening snap, AF, hemoptysis, embolic events. Severe: MVA <1.5cm2. Mild symptoms: diuretics + rate control. Moderate-severe symptoms: PBMV (percutaneous balloon mitral valvotomy) or surgery\n\nMS is becoming rare in Canada but common in immigrants from endemic regions. AF is common and requires anticoagulation (warfarin, not DOACs for rheumatic MS). Pregnancy can unmask MS (increased cardiac output). Severity assessed by pressure half-time on echo. LA enlargement is hallmark."
    difficulty: hard
    tags: [mitral stenosis, rheumatic, PBMV]
  - front: "How is acute aortic regurgitation different from chronic and how is it managed?"
    back: "Acute AR (endocarditis, dissection, trauma): medical emergency - pulmonary edema, hypotension, soft S1. Treatment: afterload reduction (nitroprusside) + inotrope + URGENT surgery. NO IABP (worsens AR). Chronic: may be asymptomatic for years, surgery when symptomatic or EF<55% or LVEDD>70mm\n\nChronic AR: wide pulse pressure, pistol-shot femorals, Corrigan pulse, De Musset sign, Duroziez sign, Austin Flint murmur. Echo surveillance annually when severe. Medical therapy for chronic: vasodilators (nifedipine, ACEi) if surgical candidate but deferred."
    difficulty: hard
    tags: [aortic regurgitation, acute, surgery]
  - front: "What are the echocardiographic findings in severe valvular disease?"
    back: "Severe AS: AVA <1.0cm2, mean gradient >40, peak velocity >4m/s. Severe MR: vena contracta >7mm, EROA >0.4cm2, regurgitant volume >60mL. Severe AR: vena contracta >6mm, holodiastolic flow reversal in aorta. Severe MS: MVA <1.5cm2\n\nLow-flow low-gradient AS (EF<50%): dobutamine stress echo to distinguish true severe AS from pseudo-severe. Paradoxical low-flow low-gradient (normal EF, small LV): increasingly recognized. 3D echo and CT improve assessment. Quantitative assessment more reliable than qualitative."
    difficulty: hard
    tags: [echo, severe valvular disease, criteria]
  - front: "What is mitral valve prolapse and when does it require intervention?"
    back: "MVP: myxomatous degeneration causing billowing of leaflets into LA during systole. Auscultation: mid-systolic click +/- late systolic murmur. Usually benign. Intervention if severe MR develops: repair preferred over replacement. Complications: severe MR, endocarditis, arrhythmias\n\nMVP affects 2-3% of population. Most are asymptomatic with excellent prognosis. Marfan and Ehlers-Danlos associated. Echo surveillance: annually if moderate MR, q2-3yr if mild. Mitral valve repair by experienced surgeon has >95% success and better outcomes than replacement."
    difficulty: medium
    tags: [MVP, mitral prolapse, repair]
  - front: "Which AFib patients require anticoagulation regardless of CHADS2 score?"
    back: "All patients with valvular AFib (mechanical valves, mitral stenosis) and certain conditions including amyloid and hypertrophic cardiomyopathy\n\nThese conditions carry such high thromboembolic risk that anticoagulation is mandatory, unlike non-valvular AFib where risk stratification guides treatment."
    difficulty: medium
    tags: [cardiology, atrial fibrillation, anticoagulation, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is valvular atrial fibrillation?"
    back: "AF associated with mitral stenosis, prosthetic heart valves, or valve repair. These patients require anticoagulation regardless of CHADS2/CHA2DS2-VASc score.\n\nValvular AF carries the highest thromboembolic risk due to the mechanical and hemodynamic consequences of valvular disease on the left atrium."
    difficulty: easy
    tags: [cardiology, arrhythmias, atrial fibrillation, valvular disease, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "How does pressure overload (e.g., aortic stenosis, HTN) lead to cardiac remodeling?"
    back: "Pressure overload causes compensatory concentric hypertrophy, which can progress to interstitial fibrosis\n\nThe heart hypertrophies to overcome increased wall stress, but this maladaptive response eventually impairs diastolic function and cardiac output."
    difficulty: medium
    tags: [heart failure, pathophysiology, cardiac remodeling, toronto-notes, pages-0131-0132-0133-0134-0135-0136-0137-0138-0139-0140]
  - front: "What are the advantages of SAVR over TAVR in intermediate-risk patients with aortic stenosis?"
    back: "SAVR resulted in fewer major vascular complications and less paravalvular aortic regurgitation\n\nDespite TAVR's benefits in some areas, the surgical approach showed superior results in vascular complications and valve sealing."
    difficulty: medium
    tags: [cardiology, SAVR, TAVR, aortic stenosis, complications, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What guideline updates the management of patients with valvular heart disease?"
    back: "2017 AHA/ACC Focused Update of the 2014 AHA/ACC guideline, and 2017 ESC/EACTS Guidelines"
    difficulty: easy
    tags: [cardiology, valvular-heart-disease, guidelines, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "According to the 2017 ESC/EACTS guidelines, which type of valve intervention is now considered first-line for high-risk patients with severe aortic stenosis?"
    back: "Transcatheter aortic valve implantation (TAVI/TAVR)\n\nThe 2017 ESC/EACTS guidelines expanded TAVI indications to include intermediate and high-risk patients with severe aortic stenosis, reflecting growing evidence of non-inferior or superior outcomes compared to surgical replacement in these populations."
    difficulty: hard
    tags: [cardiology, valvular heart disease, TAVI, aortic stenosis, guidelines, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "Which guideline organizations collaborated on the 2017 valvular heart disease management guidelines?"
    back: "AHA/ACC in North America, and ESC/EACTS in Europe\n\nValvular heart disease guidelines from both sides of the Atlantic were updated in 2017, providing complementary perspectives on transcatheter and surgical approaches."
    difficulty: easy
    tags: [valvular heart disease, guidelines, AHA, ACC, ESC, EACTS, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "Which major topics are covered by the 2014-2017 valvular heart disease guidelines mentioned in Toronto Notes?"
    back: "Management of patients with valvular heart disease, including indications for intervention, surgical approaches, and transcatheter options\n\nThese guidelines address aortic stenosis, mitral regurgitation, and emerging transcatheter valve therapies that have revolutionized treatment."
    difficulty: easy
    tags: [valvular heart disease, guidelines, aortic stenosis, mitral regurgitation, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "In the PARTNER III trial, how did TAVR compare to SAVR in low-surgical-risk patients with severe aortic stenosis?"
    back: "TAVR had significantly lower rates of the composite outcome (death, stroke, rehospitalization at 1 year) compared to SAVR in low-risk patients\n\nPARTNER III (NEJM 2019) demonstrated that among low-risk patients with severe AS, TAVR resulted in Kaplan-Meier event rates of 8.5% vs. 15.1% for SAVR at 1 year. TAVR also had lower rates of new-onset AFib and stroke at 30 days, expanding TAVR indications."
    difficulty: hard
    tags: [PARTNER III, TAVR, SAVR, aortic stenosis, low-risk]
  - front: "PARTNER II studied TAVR vs. SAVR in intermediate-risk aortic stenosis patients. What was the key outcome finding?"
    back: "TAVR and SAVR had similar rates of all-cause mortality and disabling stroke at 2 years in intermediate-risk patients\n\nPARTNER II (NEJM 2016) found no significant difference in the primary endpoint (all-cause mortality or disabling stroke) between TAVR (19.3%) and SAVR (21.1%) at 2 years. However, surgery had fewer major vascular complications and less paravalvular regurgitation."
    difficulty: medium
    tags: [PARTNER II, TAVR, SAVR, intermediate risk, aortic stenosis]
  - front: "COAPT trial evaluated transcatheter mitral valve repair (MitraClip) in HF patients with secondary MR. What was the outcome?"
    back: "Transcatheter mitral valve repair significantly reduced HF hospitalization and all-cause mortality compared to medical therapy alone in symptomatic HF with secondary MR\n\nCOAPT (NEJM 2018) showed MitraClip reduced HF hospitalizations from 67.9% to 35.8% and mortality from 46.1% to 29.1% at 24 months in patients with HF and secondary MR despite optimal medical therapy. This expanded indications for transcatheter mitral valve interventions."
    difficulty: hard
    tags: [COAPT, MitraClip, mitral regurgitation, HF, transcatheter, secondary MR]
