    tags: [GERD, endoscopy, alarm symptoms, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the definition of Barrett's esophagus?"
    back: "Metaplastic change of normal squamous esophageal epithelium to intestinal columnar epithelium in the distal esophagus\n\nBarrett's esophagus is a precursor to esophageal adenocarcinoma. Diagnosis relies on endoscopy showing salmon pink mucosa and biopsy demonstrating specialized intestinal epithelium."
    difficulty: easy
    tags: [Barretts esophagus, pathophysiology, gastroenterology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the annual risk of malignant transformation in Barrett's esophagus without dysplasia?"
    back: "Approximately 0.12% per year\n\nThe rate of malignant transformation is approximately 0.12% per year for all BE patients prior to dysplasia. The risk is significantly higher in high-grade dysplasia (32-59% over 5-8 years)."
    difficulty: medium
    tags: [Barretts esophagus, cancer risk, oncology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What treatment options exist for high-grade dysplasia in Barrett's esophagus?"
    back: "Regular and frequent surveillance with intensive biopsy, endoscopic ablation/resection, or esophagectomy\n\nEvidence increasingly favors endoscopic ablation with mucosal resection or radiofrequency ablation (RFA) over surgical options for high-grade dysplasia."
    difficulty: medium
    tags: [Barretts esophagus, treatment, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the gold standard treatment for refractory GERD with documented reflux?"
    back: "Laparoscopic Nissen fundoplication\n\nSurgical fundoplication (wrapping gastric fundus around lower esophagus) is more likely to alleviate symptoms if lower esophageal pressure is diminished. A 2019 NEJM study showed 67% success with surgery vs 28% with medical therapy."
    difficulty: medium
    tags: [GERD, fundoplication, surgery, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the two main categories of dysphagia?"
    back: "Oropharyngeal (difficulty initiating swallowing) and Esophageal (inability to move food down the esophagus)\n\nOropharyngeal dysphagia presents with choking, coughing, nasal regurgitation. Esophageal dysphagia presents with food getting stuck in the chest."
    difficulty: easy
    tags: [dysphagia, classification, diagnosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "In a patient <50 years old with dysphagia and no alarm features, what is the first step in management?"
    back: "Empiric 8-week PPI trial before proceeding to endoscopy\n\nIf concomitant GERD symptoms in patients <50 with no alarm features, consider trial of PPI first before endoscopy. Age >50 with weight loss requires prompt endoscopic evaluation."
    difficulty: medium
    tags: [dysphagia, management, PPI, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the alarm features in dysphagia that warrant urgent endoscopy?"
    back: "Weight loss, progressive symptoms, solid foods and liquids both, onset >50 years old\n\nProgressive dysphagia, combined solid and liquid dysphagia, and age >50 with weight loss suggest structural obstruction or malignancy requiring prompt evaluation."
    difficulty: easy
    tags: [dysphagia, alarm features, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the typical presentation of esophageal stricture?"
    back: "Dysphagia to solids (progressing to liquids if untreated)\n\nEsophageal stricture is a complication of GERD causing scarring. Patients present with progressive dysphagia, initially for solids only."
    difficulty: easy
    tags: [esophageal stricture, complication, dysphagia, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the recommended empiric treatment duration for classic GERD symptoms?"
    back: "8-week trial of PPI\n\nEmpiric 8-week PPI trial is recommended for patients with classic GERD symptoms. PPIs are the most effective therapy and may need to be continued as maintenance."
    difficulty: easy
    tags: [GERD, PPI, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "When can PPI therapy be discontinued in GERD patients?"
    back: "After 8 weeks in recovered patients without Barrett's esophagus or erosive esophagitis\n\nPPIs can be discontinued after 8 weeks in patients who have recovered without BE or erosive esophagitis, though symptoms may recur."
    difficulty: easy
    tags: [GERD, PPI, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the recommended management for low-grade dysplasia in Barrett's esophagus?"
    back: "Surveillance every 6 months for 1 year then annually, OR endoscopic ablation/resection\n\nBoth surveillance and endoscopic ablation/resection are satisfactory options for low-grade dysplasia in Barrett's esophagus."
    difficulty: medium
    tags: [Barretts esophagus, dysplasia, management, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the two only lifestyle modifications proven to benefit GERD symptoms?"
    back: "Weight loss (if obese or significant weight gain) and elevating the head of bed (for nocturnal symptoms)\n\nWhile diet modifications (avoiding EtOH, coffee, spices, tomatoes, citrus) may help symptoms, they do not alter the underlying disease. Only weight loss and head-of-bed elevation have evidence-based benefit."
    difficulty: easy
    tags: [GERD, lifestyle modification, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the risk of malignant transformation in high-grade dysplasia in Barrett's esophagus?"
    back: "32-59% transformation rate over 5-8 years\n\nHigh-grade dysplasia carries a significantly higher risk of progression to adenocarcinoma compared to non-dysplastic Barrett's, requiring intensive surveillance or intervention."
    difficulty: hard
    tags: [Barretts esophagus, high-grade dysplasia, cancer risk, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the treatment options for high-grade dysplasia in Barrett's esophagus?"
    back: "Intensive surveillance with frequent biopsies, endoscopic ablation (radiofrequency ablation), endoscopic mucosal resection, or esophagectomy\n\nEvidence increasingly favours endoscopic ablation with radiofrequency ablation or mucosal resection as first-line treatment, with esophagectomy reserved for certain cases."
    difficulty: hard
    tags: [Barretts esophagus, high-grade dysplasia, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "Define dysphagia versus odynophagia"
    back: "Dysphagia = difficulty swallowing; Odynophagia = pain on swallowing\n\nThis distinction is clinically important as dysphagia suggests mechanical or motility issues while odynophagia often indicates mucosal inflammation or ulceration."
    difficulty: easy
    tags: [dysphagia, symptom definition, esophageal disorders, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What key question helps differentiate oropharyngeal from esophageal dysphagia?"
    back: "Whether the difficulty is in initiating swallowing (oropharyngeal) versus moving food down the esophagus (esophageal)\n\nOropharyngeal dysphagia involves difficulty initiating swallowing with choking, coughing, nasal regurgitation, while esophageal dysphagia is the inability to move food down the esophagus."
    difficulty: medium
    tags: [dysphagia, clinical assessment, differential diagnosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "In a patient <50 years with dysphagia and no alarm features but with concomitant GERD, what is the initial management before endoscopy?"
    back: "Empiric 8-week PPI trial\n\nFor patients under 50 without alarm features who also have GERD symptoms, an empiric PPI trial is recommended as first-line therapy before proceeding to endoscopy."
    difficulty: medium
    tags: [dysphagia, GERD, treatment algorithm, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "When should PPIs be discontinued in GERD patients?"
    back: "After 8 weeks in recovered patients without Barrett's esophagus or erosive esophagitis\n\nPPIs can be stopped after 8 weeks in patients who have recovered and lack risk factors (no BE or erosive esophagitis), though symptoms may recur."
    difficulty: easy
    tags: [GERD, PPI therapy, treatment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the endoscopy finding characteristic of Barrett's esophagus?"
    back: "Salmon pink mucosa in the distal esophagus\n\nThe salmon-pink color distinguishes Barrett's metaplastic columnar epithelium from the pale pink squamous epithelium of the normal esophagus."
    difficulty: easy
    tags: [Barretts esophagus, endoscopy, diagnosis, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the mechanism of esophageal manometry in evaluating GERD candidates for fundoplication?"
    back: "To ensure intact esophageal peristalsis before surgery, as abnormal peristalsis predicts poor surgical outcomes\n\nManometry is indicated before fundoplication to exclude alternative diagnoses (achalasia, scleroderma) and assess peristaltic function, which predicts surgical success."
    difficulty: hard
    tags: [esophageal manometry, fundoplication, pre-operative assessment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What symptoms suggest oropharyngeal (transfer) dysphagia?"
    back: "Difficulty initiating swallowing, choking, coughing, nasal regurgitation, change in voice pitch\n\nThese symptoms indicate problems with the transfer of food from the oropharynx to esophagus, often due to neurological or muscular disorders."
    difficulty: easy
    tags: [oropharyngeal dysphagia, symptoms, neurological, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the characteristic dysphagia pattern in mechanical obstruction versus neuromuscular disorders?"
    back: "Mechanical: solids only; Neuromuscular: solids, liquids, or both (progressive)\n\nSolid-food-only dysphagia suggests mechanical narrowing, while involvement of both solids and liquids suggests neuromuscular dysmotility."
    difficulty: medium
    tags: [dysphagia, differential diagnosis, clinical assessment, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the most accurate diagnostic test for GERD?"
    back: "24-hour pH monitoring\n\n24h pH monitoring is the most accurate test for reflux but is not required in most cases; most useful when PPIs do not improve symptoms."
    difficulty: medium
    tags: [GERD, diagnosis, gastroenterology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the first-line empiric treatment for classic GERD symptoms?"
    back: "8-week trial of PPI\n\nAn empiric 8-week trial of PPI is indicated in patients with classic GERD symptoms; PPIs are the most effective therapy."
    difficulty: easy
    tags: [GERD, treatment, pharmacology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "When should PPI therapy be discontinued in GERD patients?"
    back: "After 8 weeks in patients without Barrett's esophagus or erosive esophagitis\n\nPPIs can be discontinued after 8 weeks in recovered patients without Barrett's esophagus or erosive esophagitis, though symptoms may recur."
    difficulty: easy
    tags: [GERD, treatment, pharmacology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What does Barrett's esophagus appear like endoscopically?"
    back: "Salmon pink mucosa in the distal esophagus\n\nEndoscopy shows salmon pink mucosa in the distal esophagus; diagnosis requires biopsy showing specialized intestinal epithelium."
    difficulty: easy
    tags: [Barretts, diagnosis, endoscopy, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the malignant transformation rate for high-grade dysplasia in Barrett's esophagus?"
    back: "32-59% over 5-8 years of surveillance\n\nThe risk of malignant transformation in high-grade dysplasia is significantly higher, with studies reporting 32-59% over 5-8 years."
    difficulty: medium
