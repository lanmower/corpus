# Pediatrics Nutrition (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the major caloric requirements for children using the Holliday-Segar method?"
    back: "Weight <10 kg: 100 kcal/kg/day. Weight 10-20 kg: 1000 kcal + 50 kcal/kg for each kg over 10. Weight >20 kg: 1500 kcal + 20 kcal/kg for each kg over 20.\n\nThe Holliday-Segar method (also used for maintenance fluids) provides a practical way to estimate caloric and fluid requirements. For example, a 15 kg child needs 1000 + (50 × 5) = 1250 kcal/day. This is distinct from the actual caloric content of foods and must be adjusted for illness, prematurity, catch-up growth, and activity level."
    difficulty: medium
    tags: [caloric requirements, nutrition, pediatrics, Holliday-Segar]
  - front: "What is the recommended timing for introduction of solid foods and highly allergenic foods in infants?"
    back: "Solid foods introduced at 4-6 months (do not delay beyond 9 months). Highly allergenic foods (eggs, milk, peanuts, seafood, sesame, soy, tree nuts, wheat, mustard) should be introduced early — around 6 months for low-risk infants, and at about 6 months (but not before 4 months) for high-risk infants (personal/family history of atopy) to prevent food allergy.\n\nEarly introduction of allergenic foods is now recommended to reduce the risk of food allergy (based on LEAP trial evidence for peanuts). Delaying introduction increases risk. Solids should begin with iron-fortified cereals/meats since iron stores nadir at 6 months. Introduce 2-3 new foods per week with at least 2 days between each new food to identify adverse reactions."
    difficulty: medium
    tags: [allergy prevention, solid foods, nutrition, pediatrics, LEAP trial]
  - front: "What foods should be avoided in infants and at what ages?"
    back: "Honey: avoid until >12 months (risk of infant botulism). Added sugar and salt: avoid. Excessive cow's milk >500 mL/day after 1 year (iron deficiency anemia risk). Juice: not recommended (high sugar). Choking hazards: chunks, hard candies, nuts, round foods (grapes, hot dogs). Bottles: discontinue by 12-24 months.\n\nHoney contains Clostridium botulinum spores that can germinate in the immature GI tract of infants under 1 year, causing infant botulism (flaccid paralysis). Excessive cow's milk displaces iron-rich foods, leading to iron deficiency anemia — a common cause in toddlers. Juice provides empty calories and promotes dental caries."
    difficulty: easy
    tags: [infant nutrition, honey botulism, iron deficiency, pediatrics, dietary restrictions]
  - front: "What are the absolute contraindications to breastfeeding?"
    back: "HIV infection, HTLV type I and II (in the mother), and infant galactosemia (cannot metabolize galactose in breast milk)\n\nHIV can be transmitted through breast milk; in Canada, formula feeding is recommended for HIV-positive mothers. HTLV I and II (human T-lymphotropic viruses) are also transmitted via breast milk. Infant galactosemia is an absolute contraindication on the infant's side, as galactose from lactose in breast milk causes accumulation and serious organ damage. Active untreated TB and active HSV-2 lesions on the breast are relative contraindications."
    difficulty: medium
    tags: [breastfeeding, contraindications, HIV, galactosemia, pediatrics]
  - front: "What are the signs of inadequate breastfeeding intake in a newborn?"
    back: "Less than 6 wet diapers/day after first week; fewer than 7 feeds/day; sleepy or lethargic; loss >10% of birth weight (after first week); jaundice; not regaining birth weight by 10-14 days\n\nAdequate breastfeeding is monitored by output (wet diapers), weight gain, and infant alertness. In the first week, neonates should have 1 wet diaper per day of life. By day 5+, 3+ yellow seedy stools per day indicates mature milk. Excessive weight loss or failure to regain birth weight may warrant formula supplementation and lactation consultation."
    difficulty: easy
    tags: [breastfeeding, neonatal, inadequate intake, pediatrics]
  - front: "What is the composition of colostrum, and how does it differ from mature breast milk?"
    back: "Colostrum (first few days): clear, rich in protein and immunoglobulins (especially IgA), low fat. Mature breast milk: 70:30 whey:casein ratio, fat from dietary butterfat, carbohydrate from lactose.\n\nColostrum is the first milk produced and is rich in secretory IgA, which provides passive mucosal immunity to the newborn. It has higher protein and lower fat content than mature milk. Mature breast milk contains lactoferrin (inhibits E. coli), lysozymes, macrophages, and active lymphocytes, providing ongoing immunologic protection. The lower pH of breast milk promotes Lactobacillus growth."
    difficulty: medium
    tags: [breastfeeding, colostrum, breast milk composition, immunology, pediatrics]
  - front: "When is soy protein formula (Isomil, Prosobee) indicated, and what is its key limitation?"
    back: "Indicated for galactosemia and desire for vegetarian/vegan diet. Key limitation: 10-35% of children with cow's milk protein allergy also react to soy, making it unsuitable for most cow's milk protein allergy cases.\n\nSoy formula uses corn syrup solids or sucrose instead of lactose. While it avoids dairy protein, significant cross-reactivity with cow's milk protein allergy means it should not be used as the primary alternative for milk protein allergy — protein hydrolysate or amino acid formula is preferred in those cases. Soy is appropriate for galactosemia as it is lactose-free."
    difficulty: medium
    tags: [soy formula, cows milk protein allergy, galactosemia, pediatrics, nutrition]
  - front: "What formula is indicated for severe cow's milk protein allergy or malabsorption, and what is the protein source?"
    back: "Protein hydrolysate formula (Nutramigen, Alimentum, Pregestimil, Portagen): protein is 100% casein hydrolysate. For severe allergy unresponsive to hydrolysate: amino acid formula (Neocate, PurAmino): free amino acids (no intact protein).\n\nIn cow's milk protein allergy, the immune system reacts to intact proteins. Extensively hydrolyzed (protein hydrolysate) formulas break proteins into small peptides, eliminating most allergenicity. If allergy persists, elemental (amino acid) formulas provide individual amino acids with no allergenic potential. These are significantly more expensive. Short gut syndrome may also require amino acid formula for absorption."
    difficulty: medium
    tags: [protein hydrolysate formula, cows milk protein allergy, amino acid formula, pediatrics]
  - front: "What is the definition of childhood obesity by age group in Canada?"
    back: "Ages 0-2 years: weight-for-length >97th percentile (overweight), >99.9th percentile (obese). Ages 2-5 years: BMI >97th percentile (overweight), >99.9th percentile (obese). Ages 5-19 years: BMI >85th percentile (overweight), >97th percentile (obese).\n\nCanada uses BMI percentile cutoffs from WHO growth standards. Childhood obesity is associated with numerous complications including hypertension, dyslipidemia, T2DM, OSA, slipped capital femoral epiphysis (SCFE), asthma, gynecomastia, PCOS, early menarche, and psychological issues (bullying, depression). Childhood obesity frequently persists into adulthood."
    difficulty: medium
    tags: [obesity, BMI, pediatrics, overweight, Canadian guidelines]
  - front: "What are the rare organic causes of childhood obesity, and what conditions should be screened for?"
    back: "Organic causes (<5%): hypothyroidism, Cushing syndrome, PCOS, Prader-Willi syndrome, Carpenter syndrome, Turner syndrome. Investigations: blood pressure, dyslipidemia screen, fatty liver disease (ALT), T2DM screen (based on risk factors).\n\nThe vast majority of childhood obesity is exogenous (excess intake, decreased activity). Organic causes are suggested by short stature, dysmorphic features, developmental delay, or other syndromic features. Prader-Willi causes hyperphagia and obesity from hypothalamic dysfunction. Cushing causes central obesity with striae and growth failure. Hypothyroidism causes weight gain with decreased linear growth."
    difficulty: medium
    tags: [obesity, hypothyroidism, Cushing, Prader-Willi, pediatrics]
  - front: "What is the vitamin D supplementation recommendation for breastfed infants?"
    back: "400 IU/day for all breastfed infants. 800 IU/day if infant or maternal risk factors are present. This supplementation is required because breast milk is deficient in vitamin D.\n\nVitamin D is synthesized in skin with UV exposure; however, infants are kept out of direct sunlight. Breast milk contains insufficient vitamin D regardless of maternal vitamin D status. Vitamin D deficiency causes rickets in infants and children. Formula is fortified with vitamin D, so formula-fed infants consuming adequate amounts do not typically require supplementation. Supplementation should begin shortly after birth."
    difficulty: easy
    tags: [vitamin D, breastfeeding, supplementation, rickets, pediatrics]
