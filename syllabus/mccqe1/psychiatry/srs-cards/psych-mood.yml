  - front: "Which antidepressant is often chosen for lack of sexual side effects and can be used for augmentation?"
    back: "Bupropion\n\nBupropion blocks dopamine and norepinephrine reuptake, causing less sexual dysfunction than SSRIs and can augment other antidepressants."
