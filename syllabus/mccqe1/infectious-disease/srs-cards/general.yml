# General (InfectiousDisease) - generated from srs-mccqe1
cards:
  - front: "What infectious contacts and exposures should be asked about in fever history?"
    back: "Travel history, camping, daycare, TB contact, foodborne illness, animal exposure\n\nExposure history helps identify potential infectious etiologies."
    difficulty: easy
    tags: [fever, history, infectious-disease, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "How is recurrent herpes simplex virus episode treated?"
    back: "Acyclovir 800 mg PO BID x 5 days, OR valacyclovir 500 mg PO BID x 3 days, OR famciclovir 1000 mg PO single dose\n\nRecurrent episodes are treated with shorter courses or single doses compared to primary infection, as viral burden is lower."
    difficulty: easy
    tags: [infectious disease, herpes, HSV, recurrent, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for gonorrhea?"
    back: "Ceftriaxone 250 mg IM single dose + azithromycin 1 g PO single dose\n\nDual therapy is recommended due to increasing antibiotic resistance. Patients should abstain from intercourse for 1 week after treatment."
    difficulty: easy
    tags: [infectious disease, gonorrhea, STI, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for uncomplicated chlamydia?"
    back: "Doxycycline 100 mg PO BID x 7 days\n\nAzithromycin 1 g PO single dose is an alternative but doxycycline has better efficacy. Patients should abstain from intercourse for 1 week after treatment."
    difficulty: easy
    tags: [infectious disease, chlamydia, STI, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for mastitis?"
    back: "Cloxacillin 500mg PO QID x 7 days OR Cephalexin 500mg PO QID x 7 days\n\nS. aureus is the most common cause of mastitis. Antibiotics covering penicillinase-producing staphylococci are first-line."
    difficulty: easy
    tags: [infectious disease, mastitis, breast, bacterial infection, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for first-episode genital herpes (HSV)?"
    back: "Acyclovir 400 mg PO TID for 5-10 days, OR famciclovir 250 mg PO TID for 5 days, OR valacyclovir 1000 mg PO BID for 10 days\n\nAntiviral therapy reduces symptoms duration and viral shedding. Treatment is most effective when started early."
    difficulty: easy
    tags: [infectious disease, herpes, HSV, treatment, antivirals, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for chlamydia?"
    back: "Doxycycline 100 mg PO BID for 7 days\n\nAzithromycin 1 g PO single dose is an alternative. Patients should abstain from intercourse for 1 week after treatment."
    difficulty: easy
    tags: [infectious disease, STI, chlamydia, treatment, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for mastitis caused by Staphylococcus aureus?"
    back: "Cloxacillin 500 mg PO QID for 7 days\n\nS. aureus is the most common cause of mastitis. Oral antibiotics are usually sufficient for uncomplicated cases."
    difficulty: easy
    tags: [infectious disease, mastitis, treatment, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for mastitis caused by Streptococcus pyogenes?"
    back: "Cephalexin 500 mg PO QID for 7 days\n\nStreptococcus pyogenes is an alternative cause of mastitis. Cephalexin covers this organism effectively."
    difficulty: easy
    tags: [infectious disease, mastitis, treatment, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for primary episode herpes genitalis?"
    back: "Acyclovir 400 mg PO TID x5-10 days OR famciclovir 250 mg PO TID x5 days OR valacyclovir 1000 mg PO BID x10 days\n\nFirst-line antiviral therapy for primary HSV infection reduces symptoms and healing time."
    difficulty: easy
    tags: [infectious disease, herpes, HSV, antiviral, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for recurrent herpes genitalis episode?"
    back: "Acyclovir 800 mg PO TID x2 days OR valacyclovir 500 mg PO BID x3 days OR valacyclovir 1000 mg PO daily x5 days\n\nShorter courses of antivirals are effective for recurrent episodes."
    difficulty: easy
    tags: [infectious disease, herpes, HSV, antiviral, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for uncomplicated gonorrhea?"
    back: "Ceftriaxone 250 mg IM x1 dose + azithromycin 1g PO x1 dose\n\nDual therapy with ceftriaxone and azithromycin is recommended for gonorrhea."
    difficulty: easy
    tags: [infectious disease, gonorrhea, STD, antibiotic, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the first-line treatment for mastitis in adults?"
    back: "Cloxacillin 500 mg PO QID x7 days (for S. aureus) OR cephalexin 500 mg PO QID x7 days (for S. pyogenes)\n\nMastitis is typically caused by S. aureus; antibiotics should cover penicillinase-producing staphylococci."
    difficulty: easy
    tags: [infectious disease, mastitis, breast, antibiotic, treatment, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are common causes of mastitis?"
    back: "Staphylococcus aureus and Streptococcus pyogenes\n\nThese are the primary bacterial causes of mastitis in breastfeeding and non-breastfeeding patients."
    difficulty: easy
    tags: [infectious disease, mastitis, breast, microbiology, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What pathogens cause gonorrhea and chlamydia?"
    back: "Neisseria gonorrhoeae causes gonorrhea; Chlamydia trachomatis causes chlamydia\n\nThese are the causative organisms for the two most common bacterial STDs."
    difficulty: easy
    tags: [infectious disease, gonorrhea, chlamydia, STD, microbiology, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What virus causes genital herpes?"
    back: "Herpes simplex virus (HSV) - primarily HSV-2, but HSV-1 can also cause genital herpes\n\nHSV-2 is the most common cause of recurrent genital herpes, though HSV-1 increasingly causes primary genital infections."
    difficulty: easy
    tags: [infectious disease, herpes, HSV, virus, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What counseling should be given after treatment for gonorrhea or chlamydia?"
    back: "No intercourse for 1 week after treatment completion\n\nPatients should abstain from sexual activity until treatment is completed and symptoms resolve to prevent reinfection."
    difficulty: easy
    tags: [infectious disease, STD, counseling, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What advice should be given after chlamydia or gonorrhea treatment?"
    back: "No intercourse for 1 week after treatment\n\nThis prevents reinfection and allows healing of mucosal surfaces."
    difficulty: easy
    tags: [infectious disease, chlamydia, gonorrhea, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for a pregnant patient with recurrent genital herpes near delivery?"
    back: "Acyclovir 400 mg PO TID daily OR valacyclovir 500 mg PO BID starting at 36 weeks gestation\n\nSuppressive therapy at 36 weeks reduces viral shedding and cesarean section rates for women with recurrent herpes."
    difficulty: medium
    tags: [infectious disease, sexually transmitted infection, herpes, pregnancy, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What organisms cause mastitis?"
    back: "Staphylococcus aureus (most common) and Streptococcus pyogenes\n\nS. aureus is the predominant pathogen in mastitis. Culture may be needed for recurrent or treatment-resistant cases."
    difficulty: easy
    tags: [breast, infectious disease, mastitis, microbiology, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for recurrent genital herpes with famciclovir?"
    back: "Famciclovir 1000 mg PO BID x 1 day OR 125 mg PO BID x 5 days OR 500 mg once followed by 250 mg BID x 2 days\n\nMultiple famciclovir regimens are effective for recurrent episodes."
    difficulty: easy
    tags: [infectious disease, herpes, antivirals, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for primary episode herpes simplex virus?"
    back: "Acyclovir 400mg PO TID x 5-10 days OR famciclovir 250mg PO TID x 5 days OR valacyclovir 1000mg PO BID x 10 days\n\nAntiviral treatment reduces symptoms and viral shedding duration. Start within 72 hours of lesion onset for maximum benefit."
    difficulty: easy
    tags: [infectious disease, herpes, viral infection, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for recurrent herpes simplex virus episodes?"
    back: "Acyclovir 800mg PO TID x 2 days OR valacyclovir 500mg PO BID x 3 days\n\nValacyclovir 500mg BID x 3 days or 1000mg daily x 5 days are also effective. Earlier treatment leads to faster resolution."
    difficulty: easy
    tags: [infectious disease, herpes, viral infection, STI, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What organisms cause mastitis and what is first-line treatment?"
    back: "Staphylococcus aureus (most common) and Streptococcus pyogenes. First-line: cloxacillin 500mg PO QID x 7 days\n\nCloxacillin is first-line for S. aureus. For suspected S. pyogenes, use cephalexin 500mg PO QID x 7 days."
    difficulty: medium
    tags: [infectious disease, mastitis, breast, antibiotics, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What is the treatment for first-episode herpes simplex virus (HSV)?"
    back: "Acyclovir 400 mg PO TID x 5-10 days, OR famciclovir 250 mg PO TID x 5 days, OR valacyclovir 1000 mg PO BID x 10 days\n\nAntiviral therapy reduces symptoms duration and viral shedding. Earlier treatment provides better outcomes."
    difficulty: easy
    tags: [infectious disease, HSV, herpes, antiviral, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What are the causes of mastitis?"
    back: "Staphylococcus aureus and Streptococcus pyogenes\n\nThese are the two most common bacterial causes of mastitis, typically resulting from breastfeeding-related nipple cracking or milk stasis."
    difficulty: easy
    tags: [breast, mastitis, infectious disease, S. aureus, S. pyogenes, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
