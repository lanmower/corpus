# General (Anesthesia) - generated from srs-mccqe1
cards:
  - front: "What is the status of Thiopental in North America?"
    back: "As of 2021, Thiopental has been discontinued from production for North America\n\nThiopental (sodium thiopental) was previously used for IV induction but is no longer available for clinical use in North America."
    difficulty: easy
    tags: [anesthesia, thiopental, pharmacology, clinical availability, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is the volatile inhalational agent with the lowest MAC?"
    back: "Desflurane has the lowest MAC at 6.0%\n\nMAC represents the concentration needed to prevent movement in 50% of patients, with lower values indicating more potent agents."
    difficulty: easy
    tags: [anesthesia, volatile agents, MAC, desflurane, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "Which volatile agent has the highest MAC value?"
    back: "Nitrous oxide (N2O) with MAC of 104% (only achievable in a pressurized chamber)\n\nN2O is a weak anesthetic requiring high concentrations, so it is typically combined with other agents."
    difficulty: easy
    tags: [anesthesia, nitrous oxide, MAC, volatile agents, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "Which volatile agents increase ICP?"
    back: "Sevoflurane, Desflurane, Enflurane, and Halothane all increase ICP; also increases cerebral metabolic rate (sevoflurane, desflurane)\n\nVolatile anesthetics cause cerebral vasodilation, which increases cerebral blood flow and intracranial pressure."
    difficulty: easy
    tags: [anesthesia, volatile agents, ICP, neurosurgery, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "How does age affect MAC of volatile anesthetics?"
    back: "MAC decreases by approximately 6% per additional decade of age in adults\n\nElderly patients require lower concentrations of volatile anesthetics, reflecting increased sensitivity to anesthetic effects."
    difficulty: easy
    tags: [anesthesia, MAC, geriatric, pharmacokinetics, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is MAC-awake?"
    back: "The MAC at which a patient will open their eyes to command; generally 0.3-0.4 of usual MAC\n\nThis represents the endpoint for recovery from anesthesia and awareness during emergence."
    difficulty: easy
    tags: [anesthesia, MAC, emergence, awareness, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is MAC-BAR?"
    back: "MAC-blocking adrenergic response; the MAC necessary to blunt sympathetic response to noxious stimuli; generally 1.5 MAC\n\nThis represents the level needed to prevent hemodynamic stress responses to surgical stimulation."
    difficulty: easy
    tags: [anesthesia, MAC, sympathetic response, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What receptor do muscle relaxants block?"
    back: "Nicotinic cholinergic receptors at the neuromuscular junction\n\nBy blocking these postsynaptic receptors, muscle relaxants prevent acetylcholine-induced depolarization and muscle contraction."
    difficulty: easy
    tags: [anesthesia, muscle relaxants, receptors, NMJ, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is the Train of Four (TOF) nerve stimulator used for?"
    back: "Assess the degree of nerve block intraoperatively; no twitch response indicates complete neuromuscular blockade\n\nTOF monitoring quantifies the depth of neuromuscular blockade to guide dosing and reversal."
    difficulty: easy
    tags: [anesthesia, monitoring, neuromuscular, TOF, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "How is Succinylcholine metabolized?"
    back: "Hydrolyzed by plasma cholinesterase (pseudocholinesterase), found in plasma and NOT at the NMJ\n\nThis extrajunctional metabolism explains why SCh duration is affected by conditions altering plasma cholinesterase activity."
    difficulty: medium
    tags: [anesthesia, succinylcholine, metabolism, pseudocholinesterase, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What skeletal muscles are paralyzed by muscle relaxants, and which are spared?"
    back: "Skeletal muscle paralysis including the diaphragm occurs; involuntary muscles (heart and smooth muscle) are spared\n\nThis differential effect occurs because muscle relaxants act at nicotinic receptors, which have different subtypes in skeletal vs. cardiac/smooth muscle."
    difficulty: easy
    tags: [anesthesia, muscle relaxants, pharmacology, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is the intubating dose of succinylcholine?"
    back: "1-1.5 mg/kg IV\n\nThis dose provides rapid intubating conditions with onset of 30-60 seconds and duration of 3-5 minutes."
    difficulty: easy
    tags: [anesthesia, muscle-relaxants, succinylcholine, dosing, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What enzyme metabolizes succinylcholine?"
    back: "Plasma cholinesterase (pseudocholinesterase) - found in plasma only, not at the NMJ\n\nUnlike acetylcholinesterase at the synapse, pseudocholinesterase is produced by the liver and circulates in plasma."
    difficulty: medium
    tags: [anesthesia, muscle-relaxants, succinylcholine, metabolism, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "How does MAC change with age?"
    back: "MAC decreases by approximately 6% per additional decade of age in adults\n\nElderly patients require lower concentrations of volatile anesthetics, which must be considered during anesthetic dosing."
    difficulty: medium
    tags: [anesthesia, inhalational-agents, MAC, pharmacokinetics, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is the 'second gas effect' with nitrous oxide?"
    back: "N2O rapidly enters the bloodstream and dilutes alveolar gases, increasing the alveolar concentration of the second (companion) anesthetic gas\n\nThis effect accelerates the uptake of other anesthetic agents, speeding induction."
    difficulty: medium
    tags: [anesthesia, inhalational-agents, nitrous-oxide, pharmacokinetics, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What is the train-of-four (TOF) nerve stimulation used for?"
    back: "To assess the degree of neuromuscular blockade intraoperatively - no twitch response indicates complete neuromuscular blockade\n\nTOF monitoring ensures appropriate paralysis depth and guides reversal agent administration."
    difficulty: easy
    tags: [anesthesia, muscle-relaxants, monitoring, neuromuscular, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "Which volatile agent causes the most significant increase in ICP?"
    back: "Sevoflurane, desflurane, and enflurane all increase ICP; halothane also increases cerebral blood flow and ICP\n\nVolatile anesthetics affect cerebral vasculature - this is clinically significant in patients with elevated ICP."
    difficulty: medium
    tags: [anesthesia, inhalational-agents, CNS-effects, ICP, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What MAC values do the volatile anesthetics have?"
    back: "Sevoflurane: 2%, Desflurane: 6%, Isoflurane: 1.2%, Enflurane: 1.7%, Halothane: 0.8%, N2O: 104%\n\nLower MAC indicates higher potency. N2O's MAC of 104% is only achievable in a pressurized chamber."
    difficulty: easy
    tags: [anesthesia, inhalational-agents, MAC, potency, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What does combining rocuronium with thiopental cause?"
    back: "Precipitates to form insoluble compounds\n\nThis physical incompatibility means these drugs should not be mixed in the same IV line."
    difficulty: medium
    tags: [anesthesia, drug-interactions, rocuronium, thiopental, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
