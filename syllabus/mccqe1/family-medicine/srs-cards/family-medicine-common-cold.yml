# Family Medicine Common Cold (FamilyMedicine) - generated from srs-mccqe1
cards:
  - front: "What differentiates the common cold from influenza clinically?"
    back: "Flu: sudden onset, severe exhaustion, dry/severe/hacking cough, dry and clear nose, achy muscles and head, decreased appetite. Cold: slow onset, mild exhaustion, mild cough (+/-), runny nose, headache-free, normal muscles, normal appetite. Both have chills and can have fever, but fever is more prominent in flu.\n\nDistinguishing flu from cold has management implications — flu may benefit from antivirals (oseltamivir) if given within 48 hours of symptom onset, especially in high-risk patients (elderly, immunocompromised, pregnant). The common cold has no specific antiviral therapy. Common cold is the most common diagnosis in family medicine (adults 2–4 per year, children 6–10 per year)."
    difficulty: easy
    tags: [common cold, influenza, differential diagnosis, family medicine]
  - front: "What is the management of the common cold, including evidence on echinacea?"
    back: "Patient education: symptoms peak 1–3 days, subside within 1 week (cough may persist weeks). No antibiotics (viral). Prevention: frequent hand washing, avoid mucous membrane contact, surface disinfectants, annual influenza vaccination. Symptomatic relief: rest, hydration, gargling warm salt water, steam, nasal irrigation, analgesics/antipyretics (acetaminophen/ibuprofen), cough suppression (dextromethorphan or codeine; children <6 should not use any cough/cold medications), decongestants, antihistamines. Echinacea: not shown to provide benefits for treating colds; possible weak benefit from some products; 10–20% relative risk reduction in prevention trials but not statistically significant.\n\nThe recommendation against cough/cold medications in children <6 reflects safety concerns about serious adverse events with minimal benefit. Secondary bacterial complications (otitis media, sinusitis, bronchitis) can appear 3–10 days after cold onset — a new fever or worsening after initial improvement should prompt reassessment."
    difficulty: easy
    tags: [common cold, management, echinacea, pediatrics, family medicine]
