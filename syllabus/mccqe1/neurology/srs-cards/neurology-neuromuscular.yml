cards:
  - front: "Compare Myasthenia Gravis (MG), Lambert-Eaton Myasthenic Syndrome (LEMS), and Botulism at the neuromuscular junction."
    back: "                    MG          LEMS        Botulism\nOcular/Bulbar:      +++         +           ++ (early)\nLimb Weakness:      +           +++         +++\nFatigability:       +++         ++          ++\nPost-exercise:      worse       better      better\nReflexes:           normal      decreased   decreased\nAnticholinergic Sx: absent      present     present\nEMG:                Decremental Incremental Incremental (rapid)\nAssociated:         Thymoma     Small cell  GI symptoms\n                                carcinoma\n\nKey distinguishing features: MG worsens with exercise (decremental EMG response); LEMS and botulism improve briefly with exercise (incremental EMG response). LEMS is paraneoplastic (small cell lung cancer). Botulism presents with GI symptoms first. MG is associated with thymoma (15%) and thymic hyperplasia (85%)."
    difficulty: medium
    tags: [myasthenia gravis, Lambert-Eaton, botulism, neuromuscular junction, NMJ disorders]
  - front: "What is the pathophysiology of Myasthenia Gravis and what are the key investigations?"
    back: "Pathophysiology: Autoimmune; antibodies against acetylcholine receptors (AChR) at the NMJ (most common) or muscle-specific kinase (MuSK) antibodies → reduced functional AChRs → fatigable weakness.\n\nInvestigations:\n1. AChR antibody assay (50-90% sensitivity)\n2. MuSK antibody (if seronegative for AChR)\n3. Repetitive nerve stimulation: >10% decremental response\n4. Single fibre EMG: increased jitter (80-100% sensitivity, most sensitive)\n5. Spirometry/FVC: monitor respiratory adequacy\n6. CT/MRI chest: screen for thymoma/thymic hyperplasia\n7. Edrophonium (Tensilon) test: historical, no longer performed\n\nMG has bimodal age of onset: women in 20s and men in 60s. 15% have thymoma, 85% thymic hyperplasia. Symptoms are worsened by infection, pregnancy, menses, and various drugs. Respiratory failure (myasthenic crisis) is a medical emergency requiring ICU management."
    difficulty: medium
    tags: [myasthenia gravis, AChR antibody, MuSK, thymoma, repetitive stimulation, investigations]
