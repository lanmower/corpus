  - front: "What are the blood pressure thresholds for hypertension diagnosis?"
    back: "Diabetic: office BP >130/80 mmHg; Non-diabetic (AOBP): >135/85 mmHg or OBPM ≥140/90 mmHg; ABPM daytime: >135/85 mmHg or 24hr mean >130/80 mmHg\n\nHypertension definitions vary by measurement method and diabetic status. White coat hypertension must be ruled out."
