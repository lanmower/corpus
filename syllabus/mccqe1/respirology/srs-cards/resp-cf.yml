# Resp Cf (Respirology) - generated from srs-mccqe1
cards:
  - front: "What is the genetic basis of cystic fibrosis and what does sweat chloride testing show?"
    back: "Autosomal recessive disorder with >2100 mutations in CFTR gene described (not all disease-causing). Sweat chloride test: increased concentrations of NaCl and K+; chloride >60 mmol/L on two occasions supports diagnosis. Single mutation carriers have normal sweat tests and no disease.\n\nCFTR encodes a chloride channel; dysfunction leads to thick secretions from exocrine glands (lung, pancreas, reproductive tract) and blockage of secretory ducts. The most common mutation in Caucasians is ΔF508. Genetic testing can identify specific mutations, which guide CFTR modulator therapy selection."
    difficulty: easy
    tags: [respirology, cystic-fibrosis, genetics, CFTR, sweat-chloride]
  - front: "What are the multisystem clinical features of cystic fibrosis?"
    back: "Pulmonary: sinusitis, chronic pulmonary disease, chronic lung infections. GI: pancreatic insufficiency, meconium ileus (children), distal ileal obstruction, liver disease, malnutrition. Other: salt loss syndrome, azoospermia, CF-related DM, bone disease. Chronic lung infections progress: S. aureus and H. influenzae (early) → P. aeruginosa (most common in adulthood) → Burkholderia cepacia complex (worse prognosis).\n\nBurkholderia cepacia complex has some subtypes with much worse prognosis; infection control is critical (patient cohort separation). Adults increasingly colonized with resistant bacteria (PsA, B. cepacia, Stenotrophomonas, Achromobacter, MRSA, NTM). CF-related DM differs from type 1/2 DM and worsens pulmonary outcomes."
    difficulty: medium
    tags: [respirology, cystic-fibrosis, clinical-features, microbiology]
  - front: "What are the PFT findings in cystic fibrosis and how do they progress?"
    back: "Early: airflow limitation in small airways. Late: severe airflow obstruction, hyperinflation, gas trapping. Very late: hypoxemia and hypercapnia → respiratory failure and cor pulmonale. CXR: hyperinflation and increased pulmonary markings (especially upper lobes).\n\nCF primarily causes obstructive pattern on PFTs, unlike ILD which causes restriction. FEV1 decline rate is the strongest predictor of prognosis. Worse prognosis factors include: frequent pulmonary exacerbations, rapid FEV1 decline, supplemental O2 requirement, worsening malnutrition, infection with difficult-to-manage organisms, CF-DM, pneumothorax, massive hemoptysis, female sex, low SES."
    difficulty: medium
    tags: [respirology, cystic-fibrosis, PFTs, prognosis]
  - front: "What are the CFTR modulator therapies for cystic fibrosis?"
    back: "CFTR modulators include: Ivacaftor (potentiator for Class III mutations), Orkambi® (lumacaftor-ivacaftor for ΔF508 homozygous), Symdeko (tezacaftor-ivacaftor), Trikafta (elexacaftor-tezacaftor-ivacaftor, most effective, for ΔF508 and other mutations). These are correctors/potentiators that restore CFTR protein function.\n\nLumacaftor-ivacaftor and tezacaftor-ivacaftor combination therapy improves QoL (respiratory domain) and lung function in Class II CFTR mutations versus placebo. Lumacaftor-ivacaftor caused more early breathlessness (OR 2.05). Tezacaftor-ivacaftor has fewer adverse effects. These drugs are mutation-class specific and expensive."
    difficulty: hard
    tags: [respirology, cystic-fibrosis, CFTR-modulators, treatment, pharmacology]
  - front: "What is the treatment approach for cystic fibrosis?"
    back: "Chest physiotherapy. Pancreatic enzyme replacements + high fat/high calorie diet. Bronchodilators (salbutamol + ipratropium bromide). Inhaled mucolytics: hypertonic saline, DNase (reduces mucus viscosity). Inhaled antibiotics (tobramycin, colistin, aztreonam, levofloxacin, vancomycin). Anti-inflammatory medications (azithromycin, ICS if concurrent asthma). Oral/IV antibiotics targeted to sputum cultures (e.g. ciprofloxacin for Pseudomonas). CFTR modulators (Ivacaftor, Orkambi, Symdeko, Trikafta). Lung transplant.\n\nDNase (dornase alfa) cleaves extracellular DNA from neutrophils in mucus, reducing viscosity. Azithromycin has anti-inflammatory properties beyond antibacterial. Lung transplant is bilateral sequential and improves survival in CF with advanced disease. Infection control between CF patients is essential (Burkholderia cepacia)."
    difficulty: medium
    tags: [respirology, cystic-fibrosis, treatment, mucolytics, antibiotics]
