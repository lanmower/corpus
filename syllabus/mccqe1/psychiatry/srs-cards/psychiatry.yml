# Psychiatry (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "A 7-year-old boy is brought in by his parents for frequent angry outbursts, arguing with adults, and deliberately annoying his siblings. These behaviors have been present for 8 months. He is spiteful at least twice per month. What is the most likely diagnosis?"
    back: "Oppositional Defiant Disorder (ODD)\n\nODD is characterized by a pattern of negativistic, hostile, and defiant behaviour lasting ≥6 months with ≥4 symptoms including angry/irritable mood, argumentative/defiant behavior, and vindictiveness. The frequency must exceed normative behavior for age, gender, and culture."
    difficulty: easy
    tags: [psychiatry, child psychiatry, oppositional defiant disorder, behavioral disorders]
  - front: "A 14-year-old boy has a history of bullying, initiating fights, cruelty to animals, and truancy. He was caught shoplifting. What diagnosis requires ≥3 criteria in the past 12 months and ≥1 in the past 6 months?"
    back: "Conduct Disorder (CD)\n\nCD involves a repetitive pattern of behavior violating the rights of others and age-appropriate social norms. It includes aggression to people/animals, destruction of property, deceitfulness/theft, and rule violations. 50% of children with CD develop antisocial personality disorder as adults."
    difficulty: easy
    tags: [psychiatry, child psychiatry, conduct disorder]
  - front: "A patient on lithium 900 mg/d presents with severe nausea, vomiting, ataxia, slurred speech, and tremor. Lithium level is 2.3 mmol/L. What is the most appropriate management?"
    back: "Discontinue lithium, IV normal saline, and hemodialysis\n\nLithium toxicity is a clinical diagnosis that can occur even at therapeutic levels. Hemodialysis is indicated when lithium level is >2 mmol/L, or if there is coma, shock, severe dehydration, or failure to respond to treatment within 24 hours. Common precipitants include NSAIDs, thiazides, ACEIs, and dehydration."
    difficulty: medium
    tags: [psychiatry, pharmacology, lithium toxicity, emergency]
  - front: "Which mood stabilizer requires very slow titration due to the risk of Stevens-Johnson Syndrome, and is first-line for bipolar I depression?"
    back: "Lamotrigine (Lamictal)\n\nLamotrigine requires very slow dose titration to reduce the risk of Stevens-Johnson Syndrome, a potentially life-threatening skin reaction. It is first-line monotherapy for bipolar I depression and bipolar disorder maintenance, but has limited efficacy in preventing mania."
    difficulty: easy
    tags: [psychiatry, pharmacology, mood stabilizers, bipolar disorder]
  - front: "Which atypical antipsychotic is most effective for treatment-resistant schizophrenia but requires weekly CBC monitoring for the first 6 months due to risk of agranulocytosis?"
    back: "Clozapine (Clozaril)\n\nClozapine is the gold standard for treatment-resistant schizophrenia, with approximately 50% of patients benefiting. It carries a 1% risk of agranulocytosis requiring ongoing CBC monitoring (weekly x 6 months, then q2 weeks). Other serious side effects include metabolic syndrome, cardiomyopathy, severe constipation, and seizures."
    difficulty: easy
    tags: [psychiatry, pharmacology, antipsychotics, schizophrenia]
  - front: "What are the three benzodiazepines safe to use in patients with impaired liver function, and why?"
    back: "Lorazepam, Oxazepam, and Temazepam (LOT) - they undergo glucuronidation only and have no active metabolites\n\nLOT benzodiazepines are preferred in liver disease because they are metabolized by direct glucuronidation (phase II metabolism) rather than oxidative (phase I) hepatic metabolism. This means they do not produce active metabolites and their clearance is less affected by hepatic dysfunction."
    difficulty: medium
    tags: [psychiatry, pharmacology, benzodiazepines, hepatology]
  - front: "In Ontario, what is a Community Treatment Order (CTO) and what are the criteria for a physician to issue one?"
    back: "A CTO orders a person with serious mental disorder to receive treatment in the community. Criteria: prior psychiatric hospitalization (>30 days over ≥2 hospitalizations in past 3 years or previous CTO in past 3 years), community treatment plan, physician examination within 72 hours, patient ability to comply, and consent.\n\nCTOs are designed for patients who experience a pattern of psychiatric admission, stabilization, release, treatment non-adherence, destabilization, and readmission. They are valid for 6 months and are consent-based. If violated, a Form 47 can be issued for police to bring the patient for examination."
    difficulty: medium
    tags: [psychiatry, legal medicine, community treatment order, mental health law]
  - front: "What are the key components of a psychiatric Mental Status Exam (MSE)?"
    back: "AASEPTIC: Appearance and behavior, Attitude, Speech, Emotion (mood and affect), Perception, Thought content and process, Insight and judgment, Cognition.\n\nThe MSE is analogous to the physical exam. Mood is subjective (patient's own words), affect is objective. The spectrum of affect ranges from full to restricted to blunted to flat. Always assess suicidal ideation as part of every encounter."
    difficulty: easy
    tags: [psychiatry, assessment, MSE]
  - front: "What are the DSM-5 criteria for schizophrenia?"
    back: "≥2 symptoms for significant portion of 1 month (at least one must be delusions, hallucinations, or disorganized speech): delusions, hallucinations, disorganized speech, catatonic behavior, negative symptoms. Functional decline. Continuous signs ≥6 months. Rule out mood disorders, substances, and medical conditions.\n\nPrevalence is 0.3-0.7%. The dopamine hypothesis explains positive symptoms (mesolimbic excess) and negative symptoms (prefrontal deficit). Over time: 1/3 improve, 1/3 stable, 1/3 worsen. 5-6% die by suicide."
    difficulty: medium
    tags: [psychiatry, schizophrenia, psychosis]
  - front: "How do you differentiate brief psychotic disorder, schizophreniform disorder, and schizophrenia by duration?"
    back: "Brief psychotic disorder: <1 month. Schizophreniform disorder: 1-6 months. Schizophrenia: >6 months.\n\nDuration is the key differentiating factor. Brief psychotic disorder has good prognosis and is self-limiting. One-third of schizophreniform patients recover; two-thirds progress to schizophrenia."
    difficulty: easy
    tags: [psychiatry, psychosis, differential diagnosis]
  - front: "What are the DSM-5 criteria for a major depressive episode (MDE)?"
    back: "≥5 symptoms for ≥2 weeks, must include depressed mood or anhedonia. MSIGECAPS: Mood depressed, Sleep changes, Interest decreased, Guilt/worthlessness, Energy decreased, Concentration decreased, Appetite changes, Psychomotor changes, Suicidal ideation.\n\nMDD has a lifetime prevalence of 11% in Canada with peak at 15-25 years (F:M=2:1). First-line treatment includes SSRIs/SNRIs plus psychotherapy. ECT is the fastest and most effective treatment for severe or treatment-resistant cases."
    difficulty: easy
    tags: [psychiatry, depression, mood disorders]
  - front: "What are the DSM-5 criteria for a manic episode?"
    back: "≥1 week of elevated/expansive/irritable mood with increased energy, plus ≥3 symptoms (4 if irritable only): GST PAID - Grandiosity, Sleep decreased, Talkative/pressured speech, Pleasurable activities with painful consequences, Activity increased, Ideas (flight of), Distractibility.\n\nA full manic episode differentiates Bipolar I from Bipolar II (which has only hypomania). Mania requires marked functional impairment or hospitalization. Hypomania lasts ≥4 days without psychotic features or severe impairment."
    difficulty: easy
    tags: [psychiatry, bipolar disorder, mania]
  - front: "What is the key difference between Bipolar I and Bipolar II disorder?"
    back: "Bipolar I requires at least one manic episode (MDE not required). Bipolar II requires at least one hypomanic episode plus at least one MDE, with no history of mania.\n\nBipolar II is not a 'milder' form - patients spend 50% of time depressed vs 32% in Bipolar I. Bipolar II is often missed with an average delay of a decade before diagnosis. Monotherapy with antidepressants should be avoided due to switch risk."
    difficulty: medium
    tags: [psychiatry, bipolar disorder]
  - front: "What is the first-line treatment for bipolar depression?"
    back: "Lithium, lurasidone, quetiapine, or lamotrigine (the 4 Ls: Lithium, Lamotrigine, Lurasidone, Seroquel). Antidepressants are second-line and must be used with a mood stabilizer.\n\nMonotherapy with antidepressants is avoided in bipolar depression due to risk of switching to mania. Quetiapine is first-line for Bipolar II depression. Lithium has demonstrated efficacy in preventing suicide completions."
    difficulty: medium
    tags: [psychiatry, bipolar disorder, pharmacology]
  - front: "What is postpartum depression and how does it differ from 'baby blues'?"
    back: "Baby blues: transient mood instability in 50-80% of mothers, onset 2-4 days postpartum, lasts up to 10 days, no treatment needed. Postpartum depression: MDE with onset during pregnancy or within 4 weeks of delivery, lasts 2-6 months, occurs in 3-6%, may include psychotic features.\n\nRisk factors include prior mood disorder, psychosocial stressors, and lack of social support. Treatment includes psychotherapy (CBT/IPT) and SSRIs. ECT is considered for severe or psychotic presentations. Untreated depression impacts child cognitive development and attachment."
    difficulty: medium
    tags: [psychiatry, postpartum, depression]
  - front: "What is the SAD PERSONS mnemonic for suicide risk factors?"
    back: "Sex (male), Age >60, Depression, Previous attempts, Ethanol/substance abuse, Rational thinking loss, Social support lacking, Organized plan, No spouse/partner, Sickness (chronic/serious illness).\n\nThe best predictor of completed suicide is a prior attempt. Most common psychiatric disorders associated with completed suicide are mood disorders and alcohol use disorders. Attempted:completed ratio is 20:1 overall (100:1 in young, 4:1 in elderly)."
    difficulty: easy
    tags: [psychiatry, suicide, risk assessment]
  - front: "What is the approach to a suicidal patient in the emergency department?"
    back: "Assess ideation (passive vs active), plan, intent, access to means, past attempts, protective factors. Higher risk (plan + intent + access): hospitalize (Form 1 if refusing). Lower risk (no active plan): safety plan, address underlying disorders, ensure follow-up.\n\nAsking about suicide does not increase risk. Poor correlation exists between clinical impression and actual attempt frequency. Document clinical rationale for management decisions. Patients with alcohol issues often see suicidality resolve with abstinence."
    difficulty: medium
    tags: [psychiatry, suicide, emergency]
  - front: "What are the types of delusions?"
    back: "Persecutory: others trying to cause harm. Reference: ordinary events have personal significance. Erotomanic: another person is in love with you. Grandiose: special powers/talents. Religious: receiving divine instructions. Somatic: physical disorder/defect. Nihilistic: things don't exist.\n\nDelusions are fixed, false beliefs not amenable to change despite conflicting evidence. Bizarre delusions involve impossible situations (alien abduction). Non-bizarre delusions involve plausible situations (being followed). Obsessions differ from delusions in being ego-dystonic."
    difficulty: easy
    tags: [psychiatry, psychosis, delusions]
  - front: "What is the schizoaffective disorder diagnostic criteria?"
    back: "A) Uninterrupted illness with major mood episode concurrent with Criterion A of schizophrenia. B) Delusions or hallucinations for ≥2 weeks in absence of mood symptoms. C) Mood symptoms present for majority of total illness duration.\n\nSchizoaffective disorder lies between schizophrenia and mood disorders. Criterion B distinguishes it from mood disorder with psychotic features. Treatment combines antipsychotics, mood stabilizers, and antidepressants."
    difficulty: medium
    tags: [psychiatry, schizoaffective, psychosis]
  - front: "What is the Generalized Anxiety Disorder medical workup?"
    back: "Routine: vitals, physical exam, CBC, electrolytes, thyroid function, glucose, ECG. Additional as indicated: extended electrolytes, vitamin B12, β-HCG, folate, CXR.\n\nThe differential diagnosis of anxiety includes hyperthyroidism, pheochromocytoma, cardiac arrhythmias, pulmonary embolism, and substance intoxication/withdrawal. Always rule out medical and substance-related causes before diagnosing a primary anxiety disorder."
    difficulty: easy
    tags: [psychiatry, anxiety, workup]
  - front: "What is the significance of duration of untreated psychosis (DUP)?"
    back: "Longer DUP is associated with worse outcomes: poorer treatment response, fewer remissions, poorer social functioning, and more severe negative symptoms.\n\nMeta-analyses show DUP is a potentially modifiable prognostic factor. Early intervention programs aim to reduce DUP. DUP was not associated with positive symptoms, neurocognitive function, or quality of life in studies."
    difficulty: medium
    tags: [psychiatry, schizophrenia, prognosis]
  - front: "What is the management of treatment-resistant schizophrenia?"
    back: "Clozapine is the gold standard for treatment-resistant schizophrenia.\n\nTreatment resistance is defined as failure to respond to adequate trials of ≥2 antipsychotics. Long-acting injectable antipsychotics reduce relapse and rehospitalization compared to oral alternatives. Adjunctive agents include mood stabilizers for aggression and ECT."
    difficulty: easy
    tags: [psychiatry, schizophrenia, pharmacology]
  - front: "What are the good prognostic factors for schizophrenia?"
    back: "Late onset, acute onset, identifiable precipitant, shorter prodrome, female gender, married, good premorbid functioning, good cognitive function, no family history, presence of affective symptoms, absence of structural brain abnormalities, good drug response.\n\nOver time, 1/3 of schizophrenia patients improve, 1/3 remain the same, and 1/3 worsen. Positive symptoms typically respond to treatment, while negative symptoms and cognitive deficits tend to be most persistent."
    difficulty: easy
    tags: [psychiatry, schizophrenia, prognosis]
  - front: "What is the difference between persistent depressive disorder and MDD?"
    back: "Persistent depressive disorder: depressed mood for most days for ≥2 years (≥1 year in children) with ≥2 of: appetite changes, sleep changes, low energy, low self-esteem, poor concentration, hopelessness. MDD: ≥5 MSIGECAPS symptoms for ≥2 weeks.\n\nPersistent depressive disorder has a lifetime prevalence of 2-3%. It can coexist with MDE ('double depression'). Combination of psychotherapy and pharmacotherapy may be most efficacious. In children, mood can be irritable rather than depressed."
    difficulty: medium
    tags: [psychiatry, depression, mood disorders]
  - front: "What screening questions should be included in every psychiatric assessment?"
    back: "Depression: Have you been feeling down, depressed, or hopeless? Anxiety: Do you feel anxious or worry about things? Psychosis: Do you see or hear things others don't? Mania: Have you felt euphoric with lots of energy and decreased need for sleep? Suicidality: Have you had thoughts of harming or killing yourself?\n\nThese screening questions cover the major psychiatric disorders. Substance use and medical causes should always be ruled out before considering psychiatric diagnoses. Every encounter must include a suicide risk assessment."
    difficulty: easy
    tags: [psychiatry, assessment, screening]
  - front: "What is the typical response timeline to antidepressant treatment?"
    back: "Physical symptoms improve at 2 weeks, mood/cognition improve by 4 weeks. If no improvement after 4 weeks at maximum tolerated dose, alter regimen.\n\nFirst-line for moderate or greater MDD: SSRIs/SNRIs, with escitalopram, mirtazapine, sertraline, and venlafaxine showing evidence of superiority. For non-response, options include dose optimization, switching, or augmentation with aripiprazole or quetiapine."
    difficulty: easy
    tags: [psychiatry, depression, pharmacology]
  - front: "What is the tetrad of neuroleptic malignant syndrome (NMS)?"
    back: "Mental status changes (usually first), fever, rigidity, and autonomic instability.\n\nNMS is a psychiatric emergency caused by strong dopamine blockade, most common with high-potency and depot antipsychotics. Labs show elevated CPK, leukocytosis, and myoglobinuria. Treatment includes discontinuing antipsychotics, hydration, cooling, dantrolene, and bromocriptine."
    difficulty: medium
    tags: [psychiatry, pharmacology, NMS]
  - front: "What is the treatment for neuroleptic malignant syndrome?"
    back: "Discontinue the antipsychotic, supportive care (hydration, cooling blankets), dantrolene (muscle relaxant), and bromocriptine (dopamine agonist).\n\nNMS develops over 24-72 hours and carries a 5% mortality rate. Risk factors include sudden dose increases, starting new drugs, dehydration, and male sex. It is essential to distinguish NMS from serotonin syndrome."
    difficulty: medium
    tags: [psychiatry, pharmacology, NMS]
  - front: "Which antipsychotic is considered most effective for treatment-resistant schizophrenia?"
    back: "Clozapine.\n\nAll other antipsychotics are considered equally effective, but clozapine uniquely demonstrates superior efficacy in treatment-resistant schizophrenia. Its use is limited by the risk of agranulocytosis (1%), requiring regular CBC monitoring (weekly for 6 months, then biweekly)."
    difficulty: easy
    tags: [psychiatry, pharmacology, schizophrenia]
  - front: "What are the main side effects that distinguish typical from atypical antipsychotics?"
    back: "Typical antipsychotics have higher risk of EPS and tardive dyskinesia; atypical antipsychotics have more metabolic side effects (weight gain, diabetes, dyslipidemia).\n\nBoth generations are equally effective except clozapine. The risk of weight gain follows the order: clozapine > olanzapine > quetiapine > risperidone. Choice of agent should consider the patient's side effect profile and prior response."
    difficulty: medium
    tags: [psychiatry, pharmacology, antipsychotics]
  - front: "What is the order of onset for antidepressant effects?"
    back: "Neuro-vegetative/physical symptoms improve in 1-3 weeks; emotional/cognitive symptoms improve in 2-6 weeks.\n\nDuring the first 2 weeks of therapy, patients may have improved energy but persistent suicidal ideation, placing them at increased risk. This is especially concerning in children and adolescents, requiring close monitoring early in treatment."
    difficulty: medium
    tags: [psychiatry, pharmacology, antidepressants]
  - front: "Which SSRI is safest in pregnancy and breastfeeding?"
    back: "Sertraline.\n\nSertraline has the most evidence supporting safety in pregnancy. Fluoxetine is the most activating SSRI and is most used in children/adolescents. Citalopram and escitalopram have the fewest drug interactions. Paroxetine should be avoided in pregnancy due to cardiac defect risk."
    difficulty: easy
    tags: [psychiatry, pharmacology, pregnancy]
  - front: "What symptoms characterize serotonin syndrome?"
    back: "Nausea, diarrhea, palpitations, diaphoresis, restlessness, confusion, lethargy, progressing to myoclonus, hyperthermia, rigor, and hypertonicity.\n\nSerotonin syndrome results from overstimulation of the serotonergic system, often from drug combinations (SSRI + MAOI, SSRI + SNRI, MAOI + meperidine). Treatment involves discontinuing the medication and emergency supportive care. It must be distinguished from NMS."
    difficulty: medium
    tags: [psychiatry, pharmacology, serotonin-syndrome]
  - front: "Which antidepressants are most likely to cause discontinuation syndrome?"
    back: "Paroxetine, fluvoxamine, and venlafaxine (drugs with shortest half-lives).\n\nSymptoms begin within 1-3 days of cessation and include anxiety, insomnia, irritability, nausea, dizziness, and flu-like symptoms. Fluoxetine rarely causes discontinuation syndrome due to its long half-life. Treatment is to restart the antidepressant and taper slowly."
    difficulty: medium
    tags: [psychiatry, pharmacology, antidepressants]
  - front: "What are the therapeutic levels and monitoring requirements for lithium?"
    back: "Acute mania: 1.0-1.25 mmol/L; maintenance: 0.8-1.0 mmol/L (adult), 0.6-0.8 mmol/L (geriatric). Monitor levels every 5-7 days until therapeutic, then monthly, then every 2-3 months. Monitor thyroid and creatinine every 6 months.\n\nLithium toxicity is a clinical diagnosis as toxicity can occur at therapeutic levels. Common causes include overdose, sodium/fluid loss, NSAIDs, diuretics, and ACEIs. Signs include severe GI symptoms, cerebellar signs, and cerebral signs."
    difficulty: hard
    tags: [psychiatry, pharmacology, lithium]
  - front: "What are the clinical features of lithium toxicity?"
    back: "GI (severe nausea/vomiting/diarrhea), cerebellar (ataxia, slurred speech), and cerebral (drowsiness, tremor, seizures, coma).\n\nManagement includes discontinuing lithium, monitoring levels and electrolytes, IV saline, and hemodialysis if level >2 mmol/L or in cases of coma, shock, severe dehydration, or deterioration. NSAIDs, thiazides, ACEIs, and metronidazole decrease lithium clearance."
    difficulty: medium
    tags: [psychiatry, pharmacology, lithium]
  - front: "What is the Canadian guideline for acute psychosis treatment in the emergency setting?"
    back: "Haloperidol 5 mg IM + lorazepam 2 mg IM; or loxapine 25 mg PO/IM + lorazepam 2 mg IM; or olanzapine 2.5-10 mg; or risperidone 2 mg.\n\nThe goal is rapid tranquilization to ensure patient and staff safety. Olanzapine can be given PO, IM, or as oral quick dissolve, though the quick dissolve form has the same time to peak as regular PO (4-6 hours)."
    difficulty: medium
    tags: [psychiatry, emergency, psychosis]
  - front: "What are the four key problem areas addressed by Interpersonal Therapy (IPT)?"
    back: "1. Grief and loss, 2. Role transitions, 3. Conflict, 4. Interpersonal deficits.\n\nIPT is indicated for mood disorders and typically involves 12-20 weekly sessions. It is ideal for individuals with depression or bipolar disorder who have some insight and difficult social functioning, but not for those with severe psychotic process, personality disorders, or comorbid substance use."
    difficulty: easy
    tags: [psychiatry, psychotherapy]
  - front: "What are the four skills taught in Dialectical Behavioural Therapy (DBT)?"
    back: "Mindfulness, emotional regulation, interpersonal effectiveness, and distress tolerance.\n\nDBT combines CBT techniques with Buddhist Zen mindfulness practices. It is primarily indicated for borderline personality disorder and involves four components: individual therapy, group skills training, phone consultations, and a consultation team. Treatment typically lasts 1 year."
    difficulty: easy
    tags: [psychiatry, psychotherapy, DBT]
  - front: "What is the duration of a Form 1 (Application for Psychiatric Assessment) in Ontario?"
    back: "72 hours after hospitalization.\n\nForm 1 is signed by any physician within 7 days of examining the patient and is used when patients are thought to be in imminent danger of harming themselves or others, or when they are incapable of self-care. The patient does not have the right to a Review Board hearing on Form 1 alone."
    difficulty: medium
    tags: [psychiatry, legal, mental-health-act]
  - front: "What criteria must be met for a Community Treatment Order (CTO) in Ontario?"
    back: "Prior psychiatric hospitalization (cumulative >30 days over >2 hospitalizations in past 3 years, or previous CTO), a community treatment plan, physician examination within 72 hours, ability to comply, rights advisor consultation, and patient/substitute decision-maker consent.\n\nCTOs are valid for 6 months and are consent-based. If violated, a Form 47 allows police to bring the patient for examination. CTOs are intended for patients with serious mental disorders who experience cycles of admission, stabilization, treatment discontinuation, and readmission."
    difficulty: hard
    tags: [psychiatry, legal, CTO]
  - front: "What did the CATIE trial conclude about first-generation vs. second-generation antipsychotics?"
    back: "First and second-generation antipsychotics did not differ in overall effectiveness. Perphenazine was the most cost-effective drug.\n\nThe CATIE trial randomized 1460 patients with chronic schizophrenia to perphenazine, olanzapine, quetiapine, risperidone, or ziprasidone for up to 18 months. Individual clinical circumstances impacted drug effectiveness, highlighting the importance of patient factors in prescribing."
    difficulty: medium
    tags: [psychiatry, evidence-based-medicine, schizophrenia]
  - front: "What did the STAR*D trial show about depression treatment?"
    back: "Cumulative remission rate was 67% across up to 4 treatment steps. Remission rates decreased with each successive step (36.8%, 30.6%, 13.7%, 13.0%), and patients requiring more steps had higher relapse rates.\n\nSTAR*D demonstrated that patients with persistent MDD benefit from trying successive treatment strategies, but the likelihood of remission decreases with each additional step. This supports aggressive initial treatment and early augmentation or switching strategies."
    difficulty: medium
    tags: [psychiatry, evidence-based-medicine, depression]
  - front: "What distinguishes ODD from Conduct Disorder in children?"
    back: "ODD: pattern of negativistic/hostile/defiant behavior (angry mood, argumentative, vindictive) for ≥6 months without violation of others' rights. CD: pattern violating rights of others and social norms (aggression to people/animals, property destruction, deceitfulness, rule violation) for ≥12 months.\n\nODD prevalence is 2-16% and usually appears in preschool. 50% of children with CD develop ASPD as adults. Poor prognosis in CD includes early onset, high frequency/variety of behaviors, comorbid ADHD, and early substance misuse. ODD is superseded by disruptive mood dysregulation disorder if both criteria are met."
    difficulty: medium
    tags: [psychiatry, pediatrics, conduct-disorder, ODD]
  - front: "What benzodiazepines are preferred for patients with impaired liver function?"
    back: "LOT: Lorazepam, Oxazepam, Temazepam — these have no first-pass liver metabolism.\n\nBenzodiazepines potentiate GABA binding to its receptors, decreasing neuronal activity. They should be used for limited periods to avoid tolerance and dependence. Side effects include drowsiness, cognitive impairment, falls, and respiratory depression. Flumazenil is the specific antagonist for benzodiazepine overdose."
    difficulty: medium
    tags: [psychiatry, pharmacology, benzodiazepines]
  - front: "A 35-year-old woman with a history of two prior depressive episodes presents with depressed mood for 3 weeks. She asks about the risk of recurrence if she recovers. What is the approximate risk of recurrence after 2 depressive episodes?"
    back: "Approximately 70% risk of recurrence after 2 episodes (50% after 1 episode, 90% after 3 episodes).\n\nDepression recurrence risk increases with each episode. After 1 episode there is a 50% chance, after 2 episodes 70%, and after 3 episodes 90%. This underscores the importance of maintenance therapy in recurrent depression."
    difficulty: easy
    tags: [psychiatry, depression, family-medicine, prognosis]
  - front: "Which first-line antidepressant is recommended for youth with depression, and which SSRI is specifically NOT recommended for this population?"
    back: "Fluoxetine is the first-line SSRI for youth. Paroxetine is NOT recommended for youth (controversial increased suicidality risk).\n\nFluoxetine has the most evidence for safety and efficacy in pediatric depression. Paroxetine is avoided due to concerns about increased suicidal ideation in younger patients. The mnemonic M-SIGECAPS can help screen for major depression."
    difficulty: medium
    tags: [psychiatry, depression, pharmacology, pediatrics, SSRI]
  - front: "What is the first-line treatment for primary insomnia, and when should pharmacotherapy be considered?"
    back: "First-line: cognitive behavioral therapy (CBT) including sleep hygiene, relaxation therapy, stimulus control, and sleep restriction. Pharmacotherapy (short-term <14 days) is used to supplement CBT only.\n\nCBT is superior to pharmacotherapy for long-term insomnia management. If medications are needed, options include short-acting benzodiazepines (used cautiously), zopiclone, zolpidem, melatonin, or sedating antidepressants (trazodone)."
    difficulty: easy
    tags: [psychiatry, sleep-disorders, insomnia, family-medicine]
  - front: "What is the first-line pharmacotherapy class for depression in adults?"
    back: "SSRIs (e.g., sertraline, escitalopram, fluoxetine). First-line for youth is fluoxetine specifically.\n\nSSRIs are preferred due to their favorable side-effect profile compared to TCAs or MAOIs. Paroxetine is not recommended for youth. The mnemonic M-SIGECAPS helps recall depression criteria."
    difficulty: easy
    tags: [psychiatry, pharmacology, depression]
  - front: "What is the risk of depression recurrence after 1, 2, and 3 episodes?"
    back: "50% after 1 episode, 70% after 2 episodes, 90% after 3 episodes.\n\nDepression recurrence risk increases significantly with each episode. Up to 40% of first episodes resolve spontaneously within 6-12 months. This guides the decision on duration of maintenance therapy."
    difficulty: easy
    tags: [psychiatry, depression, prognosis]
  - front: "What components are included in the Identifying Data section of a psychiatric history?"
    back: "Name, age, gender (preferred pronouns), living situation, marital/relationship status, children, source of income/support, occupation, drug/therapy coverage, and current mental health supports.\n\nIdentifying data provides essential context for understanding a patient's social determinants of health and support systems. Clarifying preferred pronouns is essential for respectful, affirming care. In Canada, knowledge of drug/therapy coverage impacts treatment planning as mental health services vary by province."
    difficulty: easy
    tags: [psychiatry, psychiatric assessment, history taking, identifying data]
  - front: "What are the 5 key screening questions for major psychiatric disorders in a clinical encounter?"
    back: "1) Depression/hopelessness, 2) Anxiety/worry, 3) Psychosis (seeing/hearing things others don't), 4) Mania (euphoria, talkativeness, energy, decreased sleep need), 5) Suicidal/self-harm ideation.\n\nThese screening questions form a rapid psychiatric review of systems. A positive response to any screen warrants further detailed exploration. The mnemonic DAMPS (Depression, Anxiety, Mania, Psychosis, Suicide) can be used. In Canada, suicide risk assessment is mandatory in all psychiatric encounters."
    difficulty: easy
    tags: [psychiatry, psychiatric assessment, screening questions, mental status]
  - front: "What is the mnemonic AASEPTIC for the Mental Status Examination?"
    back: "A - Appearance and behaviour; A - Attitude; S - Speech and affect; E - Emotion (mood and affect); P - Perception; T - Thought content and process; I - Insight and judgment; C - Cognition.\n\nThe MSE is analogous to the physical exam — it focuses on current signs, affect, behaviour, and cognition. It is documented after history taking and provides objective data on the patient's current mental state. Each domain contributes to diagnosis and treatment planning."
    difficulty: easy
    tags: [psychiatry, mental status exam, MSE, AASEPTIC]
  - front: "Distinguish between mood and affect in the Mental Status Examination."
    back: "Mood = subjective emotional state (in patient's own words). Affect = objective emotional state inferred from emotional responses to stimuli, described in terms of quality, range, stability, and mood congruence.\n\nAffect spectrum from normal to abnormal: Full > Restricted > Blunted > Flat. Quality includes: euthymic, depressed, elevated, anxious, irritable. Affect stability ranges from fixed to labile. Mood-affect incongruence (e.g., laughing while describing a sad event) can indicate psychosis or other disorders."
    difficulty: easy
    tags: [psychiatry, mental status exam, mood, affect]
  - front: "What is the difference between a hallucination and an illusion in psychiatry?"
    back: "Hallucination: sensory perception in the absence of appropriate external stimuli (similar in quality to a true perception). Illusion: misperception of a REAL external stimulus (e.g., mistaking a coat on a rack as a person).\n\nThe most common type of hallucination is auditory. Tactile, visual, olfactory, and gustatory hallucinations also occur. Auditory hallucinations are classic in schizophrenia; visual hallucinations suggest organic causes (delirium, substance use). Illusions are not pathological in isolation — context matters."
    difficulty: easy
    tags: [psychiatry, mental status exam, hallucination, illusion, perception]
  - front: "What is the difference between depersonalization and derealization?"
    back: "Depersonalization: change in self-awareness where the person feels unreal, distant, or detached from their own body, and/or unable to feel emotion. Derealization: feeling that the world/outer environment is unreal.\n\nBoth are dissociative experiences. Depersonalization = 'I feel unreal' (self-referential). Derealization = 'The world feels unreal' (external). They often co-occur and can be symptoms of depersonalization/derealization disorder, PTSD, panic disorder, or substance use. May also occur briefly in healthy individuals under stress."
    difficulty: medium
    tags: [psychiatry, mental status exam, depersonalization, derealization, dissociation]
  - front: "Define and distinguish the following thought process abnormalities: circumstantial, tangential, flight of ideas, and loosening of associations."
    back: "Circumstantial: indirect/delayed, eventually returns to the point. Tangential: speech does not return to the original point. Flight of ideas: rapidly skipping from one idea to another with marginal connections (mania). Loosening of associations/derailment: illogical shifting between topics with no clear connection.\n\nThese thought process abnormalities reflect disruption of the normal linear, goal-directed flow of thought. Flight of ideas is associated with mania/hypomania. Loosening of associations (derailment) is a hallmark of schizophrenia. Tangential thinking is more pathological than circumstantial. Word salad (jumble of words lacking meaning) represents the most severe form."
    difficulty: medium
    tags: [psychiatry, mental status exam, thought process, thought disorder]
  - front: "What is the key feature that differentiates an obsession from a delusion?"
    back: "Obsessions are ego-dystonic (unwanted, distressing, patient recognizes them as products of their own mind). Delusions are ego-syntonic (consistent with patient's sense of self, believed to be true).\n\nThis distinction is clinically important for diagnosis. In OCD, patients recognize obsessions as irrational and unwanted, causing significant distress. In psychotic disorders, delusions are believed with full conviction. Cannot be corrected by logic or reason. Obsessions also cannot be stopped by logic but patient retains insight that they are products of their own mind."
    difficulty: medium
    tags: [psychiatry, thought content, obsession, delusion, OCD, schizophrenia]
  - front: "List the types of delusions and their definitions."
    back: "Persecutory: belief others are trying to cause harm. Reference: interpreting ordinary events as specifically directed at oneself. Erotomania: belief that another person is in love with you. Grandiose: belief of having special powers/talents. Religious: belief of receiving instructions/powers from a higher being. Somatic: belief of having a physical disorder/defect. Nihilistic: belief that things do not exist or are not real.\n\nDelusions are fixed false beliefs held despite incontrovertible evidence to the contrary, and are inconsistent with the patient's cultural or religious background. Persecutory delusions are the most common type. First-rank symptoms of schizophrenia include thought insertion, withdrawal, and broadcasting."
    difficulty: medium
    tags: [psychiatry, thought content, delusions, psychosis]
  - front: "What are the first-rank symptoms of schizophrenia involving thought?"
    back: "Thought insertion (belief that thoughts are being placed into one's mind), thought withdrawal (belief that thoughts are being removed from one's mind), and thought broadcasting (belief that one's thoughts are being transmitted to others).\n\nSchneider's first-rank symptoms were historically important for diagnosing schizophrenia. While no longer required for diagnosis in DSM-5, they remain clinically significant. All three are delusional in nature — the patient believes an external agent is controlling their thoughts. These are distinct from thought process abnormalities."
    difficulty: medium
    tags: [psychiatry, schizophrenia, first-rank symptoms, thought content, delusions]
  - front: "What is the MMSE scoring system for cognitive impairment?"
    back: "Total score out of 30. Score ≥26: normal. Score 20-25: mild impairment. Score 10-19: moderate impairment. Score <10: severe impairment.\n\nThe MMSE assesses: orientation (time and place), memory (immediate and delayed recall), attention and concentration, language (comprehension, reading, writing, repetition, naming), and spatial ability (intersecting pentagons). The Montreal Cognitive Assessment (MoCA) is more sensitive for mild cognitive impairment. Both are standard screening tools in Canada."
    difficulty: easy
    tags: [psychiatry, cognitive assessment, MMSE, dementia screening]
  - front: "What does the biopsychosocial formulation approach involve in psychiatric assessment?"
    back: "Three domains: Biological, Psychological, and Social. For each category, consider predisposing, precipitating, perpetuating, and protecting (4Ps) factors.\n\nThe biopsychosocial model is the foundation of modern psychiatric formulation. The 4Ps framework helps structure understanding: predisposing factors (vulnerabilities), precipitating factors (triggers), perpetuating factors (what maintains the illness), and protecting factors (resilience, supports). This guides comprehensive treatment planning beyond just pharmacotherapy."
    difficulty: easy
    tags: [psychiatry, psychiatric assessment, biopsychosocial model, formulation]
  - front: "What is the ratio of attempted to completed suicide, and how does it vary by age?"
    back: "Overall: attempted:completed = 20:1. Younger persons: 100:1. Older persons: 4:1. Sex: M:F = 1:4 for attempts, but 3:1 for completed suicide.\n\nOlder adults have a much higher ratio of completed to attempted suicides because they use more lethal means, are more isolated, and have less physiological reserve. Males complete suicide more often despite attempting less frequently, also due to use of more lethal methods. The second most common cause of death in ages 15-24 is suicide."
    difficulty: medium
    tags: [psychiatry, suicide, epidemiology, completed suicide, attempted suicide]
  - front: "What is the best predictor of completed suicide?"
    back: "A history of previous suicide attempt(s) is the best predictor of completed suicide.\n\nWhile there is poor correlation between clinical impression of suicide risk and frequency of attempts, a prior attempt remains the single strongest risk factor for eventual completion. The most common psychiatric disorders associated with completed suicide are mood disorders (15% lifetime risk in depression) and alcohol use disorders (15% lifetime risk). Schizophrenia carries a 10-15% risk."
    difficulty: easy
    tags: [psychiatry, suicide, risk assessment, predictors, completed suicide]
  - front: "What are the epidemiological risk factors for suicide in Canada regarding race/ethnicity and demographics?"
    back: "Higher rates in: White individuals and Indigenous peoples in Canada. Widowed/divorced > married. Living alone; no children <8 years old in household. Age: highest completion rates in persons >75 yr; second most common cause of death for ages 15-24.\n\nIndigenous peoples in Canada have significantly elevated suicide rates, particularly among youth, reflecting the ongoing impacts of colonialism, intergenerational trauma, and systemic inequities. This is a critical MCCQE1 topic. Protective factors include social connectedness, cultural identity, and access to culturally safe mental health services."
    difficulty: medium
    tags: [psychiatry, suicide, epidemiology, Indigenous peoples, Canadian context]
  - front: "What psychiatric disorders carry the highest lifetime risk of suicide?"
    back: "Mood disorders: 15% lifetime risk in depression (higher in bipolar disorder). Alcohol use disorder: 15% lifetime risk. Schizophrenia: 10-15% risk. Eating disorders: 5% lifetime risk.\n\nThese are the conditions associated with the highest absolute risk of suicide completion. Mixed drug misuse, panic disorder, and personality disorders (borderline, antisocial) also significantly elevate risk. When assessing a patient with these diagnoses, routine suicide screening is mandatory in every clinical encounter in Canada."
    difficulty: medium
    tags: [psychiatry, suicide, risk factors, mood disorders, schizophrenia, alcohol]
  - front: "What clinical symptoms are specifically associated with elevated suicide risk?"
    back: "Hopelessness, anhedonia, insomnia, severe anxiety, impaired concentration, psychomotor agitation, and dissociation.\n\nThese symptoms, when present in a patient with suicidal ideation, significantly elevate short-term risk. Hopelessness is particularly important as it predicts intent. Insomnia and severe anxiety are modifiable risk factors that can be targeted acutely. Psychomotor agitation increases impulsivity, making access to means particularly dangerous."
    difficulty: medium
    tags: [psychiatry, suicide, clinical features, risk symptoms, hopelessness]
  - front: "What is the difference between passive and active suicidal ideation?"
    back: "Passive ideation ('death wish'): patient would rather not be alive but has no active plan (e.g., 'I would rather not wake up,' 'I would not mind if a car hit me'). Active ideation: patient actively thinks about killing themselves (e.g., 'I think about killing myself').\n\nDistinguishing passive from active ideation is essential for risk stratification. Even passive ideation warrants thorough assessment. Active ideation, especially with a plan and intent, represents higher risk. The clinician should never avoid asking about suicide — research shows asking does NOT give the idea or incentive to die."
    difficulty: easy
    tags: [psychiatry, suicide, suicidal ideation, risk assessment, passive ideation]
  - front: "What are the key elements to assess when evaluating suicidal ideation?"
    back: "Plan, intent, past attempts (number, lethality, outcome), access to means, time and place, provocative factors, protective factors (what keeps them alive), final arrangements, practiced/aborted attempts, ambivalence, and onset/frequency/control over ideation.\n\nA thorough suicidal ideation assessment includes intended lethality ('What do you think would happen?'), access to means ('How will you get a gun?'), and protective factors ('What keeps you alive?'). Ambivalence is important to explore — the fact that a patient came for help often reflects some ambivalence about dying."
    difficulty: medium
    tags: [psychiatry, suicide, risk assessment, suicidal ideation, assessment framework]
  - front: "In Ontario, what form is completed for involuntary psychiatric admission and what form must be given to the patient?"
    back: "Form 1 is completed by the physician for involuntary admission. The patient must be given Form 30 to notify them of their admission.\n\nUnder the Ontario Mental Health Act, Form 1 (Application for Psychiatric Assessment) allows detention of a person for up to 72 hours for psychiatric assessment. The patient must receive Form 30 (Rights Advice) informing them of their rights. The process varies by province in Canada, making this a jurisdiction-specific MCCQE1 topic."
    difficulty: medium
    tags: [psychiatry, Canadian law, involuntary admission, Form 1, mental health act, Ontario]
  - front: "What assessment factors distinguish a high-risk from a low-risk suicide attempt requiring hospitalization?"
    back: "HIGH risk (hospitalization strongly considered): active plan + intention to act + access to lethal means + recent social stressors + symptoms of psychiatric disorder. LOW risk: not actively suicidal, no active plan, no access to lethal means.\n\nFor low-risk patients, management focuses on: discussing protective factors, promoting survival skills, and addressing underlying problems (psychiatric disorders, psychosocial stressors). For high-risk patients: do not leave patient alone, remove dangerous objects, consider capacity assessment if patient wants to leave. Proper documentation of clinical reasoning is essential."
    difficulty: medium
    tags: [psychiatry, suicide, risk stratification, hospitalization, management]
  - front: "What features of a suicide attempt indicate higher lethality and risk?"
    back: "Isolated setting (vs. others present), planned (vs. impulsive), no substance intoxication, brought in by another person (vs. self-presentation), long time lag to ED, expected to die, disappointment at surviving (vs. remorse), and escalation to more lethal means.\n\nAssessment of a suicide attempt must include all these dimensions to properly stratify ongoing risk. Reaction to survival is particularly important: disappointment or self-blame at surviving indicates ongoing intent, whereas guilt/remorse suggests some ambivalence and may indicate lower ongoing risk. Escalating lethality of means across attempts predicts future completion."
    difficulty: medium
    tags: [psychiatry, suicide, attempt assessment, lethality, risk factors]
  - front: "What are the key considerations when assessing mental status exam thought process versus thought content?"
    back: "Thought PROCESS/FORM = HOW the patient thinks (coherence, stream, organization — e.g., goal-directed, circumstantial, tangential, loose associations). Thought CONTENT = WHAT the patient thinks (suicidal/homicidal ideation, delusions, obsessions, preoccupations).\n\nThis distinction is fundamental to the MSE. Process abnormalities reflect the form or flow of thinking (e.g., derailment in schizophrenia, flight of ideas in mania). Content abnormalities reflect specific themes (e.g., persecutory delusions, suicidal ideation). Both must be assessed separately and documented in every psychiatric encounter."
    difficulty: easy
    tags: [psychiatry, mental status exam, thought process, thought content, MSE]
  - front: "What is the historical multiaxial model of DSM and what replaced it in DSM-5?"
    back: "Historical model had 5 axes: I (psychiatric diagnoses), II (personality disorders/intellectual disability), III (medical conditions), IV (psychosocial/environmental issues), V (GAF 0-100). DSM-5 replaced this by simply listing all relevant psychiatric and medical diagnoses together.\n\nWhile the multiaxial model is no longer officially used, many clinicians still employ it as an organizing framework for psychiatric assessment. The Global Assessment of Functioning (GAF) scale from Axis V has been replaced in DSM-5 by the WHO Disability Assessment Schedule (WHODAS). Understanding both old and new frameworks is important for MCCQE1."
    difficulty: easy
    tags: [psychiatry, DSM-5, psychiatric assessment, multiaxial model, diagnosis]
  - front: "What are the DSM-5 criteria for diagnosing Panic Disorder?"
    back: "A. Recurrent unexpected panic attacks. B. At least one attack followed by ≥1 month of: (1) persistent concern/worry about more attacks or their consequences, OR (2) significant maladaptive change in behaviour related to attacks. C. Not attributable to a substance or medical condition. D. Not better explained by another mental disorder.\n\nPanic disorder has a lifetime prevalence of 5% (one of top 5 reasons to see a family physician in Canada), with M:F ratio 1:2-3. The key distinguishing feature is recurrent UNEXPECTED panic attacks plus at least one month of anticipatory anxiety or behavioural change."
    difficulty: easy
    tags: [panic disorder, anxiety, DSM-5, psychiatry]
  - front: "What are the first-line pharmacological agents for Panic Disorder, and what are key prescribing considerations?"
    back: "First-line: SSRIs (fluoxetine, citalopram, escitalopram, paroxetine, sertraline, fluvoxamine) and SNRIs (venlafaxine XR). Key points: start low/go slow; anxiety disorders often require higher doses and longer duration than depression; full response may take up to 12 weeks; treat for up to 1 year after symptom resolution. Benzodiazepines are 2nd line (short-term, lowest effective dose).\n\nPatients should be warned about expected side effects before initiation to prevent non-adherence. The paradox of SSRIs/SNRIs is that they can initially worsen anxiety, which is why starting low and slow is essential. The 'start low, go slow, aim high' mnemonic is key."
    difficulty: easy
    tags: [panic disorder, SSRIs, SNRIs, pharmacotherapy, anxiety]
  - front: "What psychological treatment is recommended for Panic Disorder and what does it involve?"
    back: "Cognitive Behavioural Therapy (CBT) is the psychological treatment of choice, involving: (1) graduated exposure to unpleasant sensations of arousal (interoceptive exposure) for experiential disconfirmation of fears; (2) cognitive restructuring addressing underlying beliefs about panic attacks; (3) relaxation techniques (visualization, box-breathing); and (4) psychoeducation.\n\nCBT combined with pharmacotherapy can be very effective for panic disorder. The exposure component targets the fear of fear itself (interoceptive conditioning), while cognitive restructuring challenges catastrophic misinterpretations of bodily sensations."
    difficulty: easy
    tags: [panic disorder, CBT, psychotherapy, anxiety]
  - front: "What is the prognosis for Panic Disorder?"
    back: "85% can achieve good results; 10-20% continue with significant symptoms. Long-term, 65% achieve remission. Clinical course is chronic but episodic, often waxing and waning with psychosocial stressors.\n\nPanic disorder has a relatively good prognosis with treatment, though a subset of patients remains significantly impaired. Common comorbidities include depression and agoraphobia, which can worsen prognosis."
    difficulty: easy
    tags: [panic disorder, prognosis, anxiety]
  - front: "What are the DSM-5 diagnostic criteria for Agoraphobia?"
    back: "A. Marked fear/anxiety about ≥2 of 5 situations: (1) public transportation, (2) open spaces, (3) enclosed places, (4) standing in line/crowd, (5) being outside home alone. B. Fear of being unable to escape or get help if panic-like symptoms occur. C. Situations almost always provoke fear. D. Situations avoided, require companion, or endured with intense anxiety. E. Fear disproportionate to actual danger. F. Persistent, typically ≥6 months. G. Clinically significant distress/impairment. H-I. Not explained by medical condition or other mental disorder.\n\nImportant: Agoraphobia is diagnosed irrespective of panic disorder. If criteria for both are met, BOTH diagnoses should be assigned. This is a change from DSM-IV where agoraphobia was a subtype of panic disorder."
    difficulty: medium
    tags: [agoraphobia, anxiety, DSM-5, psychiatry]
  - front: "What are the DSM-5 criteria for Generalized Anxiety Disorder (GAD)?"
    back: "A. Excessive anxiety/worry occurring more days than not for ≥6 months about multiple events/activities. B. Difficult to control worry. C. ≥3 of 6 symptoms (≥1 day in past 6 months): (1) restlessness/keyed up, (2) easy fatigue, (3) difficulty concentrating/mind going blank, (4) irritability, (5) muscle tension, (6) sleep disturbance. D. Clinically significant distress/impairment. E. Not due to substance/medical condition. F. Not better explained by another mental disorder. Mnemonic: CFRIME (Concentration, Fatigue, Restlessness, Irritability, Muscle tension, Excessive worry).\n\nGAD has a 1-year prevalence of 1-4% and lifetime prevalence of 6%, with M:F = 1:2. In primary care, 70% initially present with physical symptoms as the main concern. Bimodal age of onset: before 20 or middle adulthood."
    difficulty: easy
    tags: [GAD, generalized anxiety disorder, DSM-5, psychiatry]
  - front: "What are the first-line treatments for Generalized Anxiety Disorder (GAD)?"
    back: "Pharmacological first-line: SSRIs (escitalopram, sertraline, paroxetine), SNRIs (venlafaxine XR, duloxetine), pregabalin. Psychological: CBT (cognitive restructuring, muscle relaxation, mindfulness). Lifestyle: avoid caffeine and alcohol, sleep hygiene. Benzodiazepines are 2nd line. Beta-blockers are NOT recommended for GAD.\n\nPregabalin is a first-line option for GAD (unlike panic disorder where it is not first-line). Beta-blockers are useful only for situational/performance anxiety, not GAD. This distinction is commonly tested."
    difficulty: easy
    tags: [GAD, treatment, SSRIs, pregabalin, psychiatry]
  - front: "What defines Social Anxiety Disorder and what is its epidemiology?"
    back: "Marked and persistent (>6 months) fear of social or performance situations where one is exposed to unfamiliar people or possible scrutiny, with fear of being negatively evaluated (humiliated, embarrassed, or rejected). Situations are avoided or endured with intense anxiety causing significant distress/impairment. Lifetime prevalence: 8-12%; M:F ratio approximately equal.\n\nSocial anxiety disorder (formerly social phobia) is distinct from shyness due to the severity of impairment. Unlike many anxiety disorders, the sex ratio is approximately equal. Treatment: CBT, SSRIs, and SNRIs; second-line: benzodiazepine, MAOI, pregabalin."
    difficulty: easy
    tags: [social anxiety disorder, social phobia, anxiety, psychiatry]
  - front: "What are the types and diagnostic criteria for Specific Phobias?"
    back: "Types: (1) animal/insect, (2) environment (heights, storms), (3) blood/injection/injury, (4) situational (airplane, closed spaces), (5) other (loud noise, clowns). Criteria: marked fear/anxiety about specific object/situation; almost invariably provokes immediate fear (may present as panic attack); actively avoided or endured with intense anxiety; fear out of proportion and persistent (≥6 months); person recognizes it as excessive; significant functional impact. Lifetime prevalence: 10-13%.\n\nTreatment is predominantly psychological (psychoeducation, CBT with in vivo and virtual exposure therapy). Medications play a minimal role in specific phobias, distinguishing them from social anxiety disorder and panic disorder where pharmacotherapy is commonly used."
    difficulty: easy
    tags: [specific phobia, anxiety, phobic disorders, psychiatry]
  - front: "What are the DSM-5 diagnostic criteria for Obsessive-Compulsive Disorder (OCD)?"
    back: "A. Presence of obsessions (recurrent intrusive thoughts/urges/images causing anxiety + attempts to ignore/suppress/neutralize them) and/or compulsions (repetitive behaviours or mental acts aimed at reducing anxiety but not connected realistically to what they prevent). B. Obsessions/compulsions are time-consuming (>1 h/day) OR cause clinically significant distress/impairment. C. Not attributable to substance/medical condition. D. Not better explained by another mental disorder. Specifiers: with good/fair/poor/absent insight; tic-related.\n\nOCD has a lifetime prevalence of 3%, mean age of onset 20 years. Most common obsessions: contamination, pathological doubt, harm, somatic, symmetry, religious. Most common compulsions: checking, washing, repeating, ordering, counting. Rate in first-degree relatives is higher than general population."
    difficulty: easy
    tags: [OCD, obsessive compulsive disorder, DSM-5, psychiatry]
  - front: "What is the pharmacological treatment for OCD, and what are key prescribing considerations?"
    back: "First-line: SSRIs (require 12-16 weeks for response, need higher therapeutic doses than for depression, relatively benign side effects); clomipramine (TCA). Adjunctive antipsychotics (risperidone, aripiprazole) for refractory OCD. Neurosurgery (anterior cingulotomy) or neurostimulation for severe refractory OCD (50-70% response rate). ECT for comorbid severe depression.\n\nThe delay in OCD response to SSRIs (12-16 weeks vs. 4-6 weeks for depression) and the need for higher doses are clinically important. Clomipramine is as effective as SSRIs but has more side effects. Refractory OCD may warrant neurosurgical intervention."
    difficulty: medium
    tags: [OCD, treatment, SSRIs, clomipramine, refractory OCD, psychiatry]
  - front: "What is Exposure and Response Prevention (ERP) in OCD treatment?"
    back: "ERP is the CBT approach for OCD that involves: exposure to feared situations using various techniques (imaginal exposure, systematic desensitization, flooding) COMBINED WITH preventing the compulsive behaviours. Cognitive strategies include challenging underlying beliefs. ERP is the gold-standard psychological treatment for OCD.\n\nThe 'response prevention' component is critical: the patient must resist performing the compulsion after exposure, which allows anxiety to naturally habituate. Without response prevention, exposure alone may not be effective as the compulsion provides escape and prevents new learning."
    difficulty: easy
    tags: [OCD, ERP, CBT, psychotherapy, psychiatry]
  - front: "What are the key features of Body Dysmorphic Disorder (BDD)?"
    back: "Preoccupation with ≥1 perceived flaws in physical appearance not observed by others; repetitive behaviours (mirror checking, excessive grooming, skin picking, reassurance seeking) or mental acts (comparing self to others) related to appearance; causes clinically significant distress or functional impairment. Mean age of onset: 15 years. High rate of suicidal ideation and attempts. Comorbidity with MDD, social anxiety disorder, and OCD. Treatment: SSRIs + CBT specific to BDD.\n\nBDD must be distinguished from eating disorders (where preoccupation centres on weight/shape) and OCD (though they share features). Muscle dysmorphia is a specifier. The high suicide risk makes early recognition and treatment critical."
    difficulty: medium
    tags: [body dysmorphic disorder, BDD, OCD spectrum, psychiatry]
  - front: "What are the key features of Hoarding Disorder and how is it distinguished from OCD?"
    back: "Hoarding: persistent difficulty discarding possessions regardless of value; need to save items; discarding creates distress; results in clutter compromising living areas; causes clinically significant distress/impairment. Onset in teens, worsens over time, more common in older populations, large genetic component. Treatment: CBT specific to hoarding. Distinguished from OCD: hoarding lacks obsessions/compulsions per se; items are valued (ego-syntonic); treatment response to SSRIs is poor.\n\nRule out: brain injury, cerebrovascular disease, Prader-Willi syndrome, OCD, MDD (low energy), psychotic disorder (delusions), neurocognitive disorder, ASD (restricted interests). The clutter may be reduced with 3rd party intervention but this does not address the underlying disorder."
    difficulty: medium
    tags: [hoarding disorder, OCD spectrum, psychiatry]
  - front: "What distinguishes Trichotillomania and Excoriation Disorder, and how are they treated?"
    back: "Trichotillomania: recurrent hair pulling causing hair loss (scalp, eyebrows, eyelashes); repeated attempts to stop; causes distress/impairment. Treatment: CBT (habit reversal training), SSRIs, 2nd gen antipsychotics, N-acetylcysteine, lithium. Excoriation: recurrent skin picking causing lesions; repeated attempts to stop; causes distress/impairment. Treatment: similar to trichotillomania. Both: rule out dermatological conditions and body dysmorphic disorder.\n\nBoth are classified as OCD-related disorders. Habit reversal training (a specific CBT technique) is the primary psychological treatment for both. N-acetylcysteine (a glutamate modulator) has evidence for both conditions and is unique among psychiatric medications."
    difficulty: medium
    tags: [trichotillomania, excoriation disorder, OCD spectrum, psychiatry]
  - front: "What are the DSM-5 diagnostic criteria for PTSD?"
    back: "A. Exposure to actual/threatened death, serious injury, or sexual violence (directly, witnessed, learned about, or repeated extreme exposure). B. ≥1 intrusion symptom: intrusive memories, nightmares, flashbacks, intense distress at cues, physiological reactions to cues. C. ≥1 avoidance: of memories/thoughts/feelings or external reminders. D. ≥2 negative cognition/mood changes: amnesia for trauma, negative beliefs, distorted blame, persistent negative emotion, diminished interest, estrangement, inability for positive emotions. E. ≥2 arousal/reactivity changes: irritability/angry outbursts, recklessness, hypervigilance, exaggerated startle, concentration problems, sleep disturbance. F. >1 month duration. G. Clinically significant distress/impairment. H. Not due to substance/medical condition.\n\nThe mnemonic TRAUMA helps: Traumatic event, Re-experience, Unable to function, More than a month, Arousal increased. Specifiers: with dissociative symptoms (depersonalization or derealization), or with delayed expression (full criteria not met until ≥6 months after event)."
    difficulty: easy
    tags: [PTSD, trauma, DSM-5, psychiatry]
  - front: "What are the epidemiology and key comorbidities of PTSD in Canada?"
    back: "Lifetime prevalence in Canada: 9%; F:M = 2:1. Age of onset: mid-late 20s. Risk factors: severity, duration, and proximity to trauma. Most common trauma forms: unexpected death of someone close, sexual assault, serious illness/injury to someone close, physical assault by partner/caregiver. 75% have another comorbid psychiatric disorder; increased suicide risk 2-3x. DDx includes bipolar disorder, borderline personality disorder, and acute stress disorder (3 days to 1 month post-trauma).\n\nThe sex difference in PTSD (women are 2x more likely than men) is partly explained by higher rates of sexual trauma in women, which carries higher PTSD risk per event than combat. The 2-3x increased suicide risk makes PTSD a serious public health concern."
    difficulty: easy
    tags: [PTSD, epidemiology, psychiatry, Canada]
  - front: "What are the three stages of PTSD/trauma recovery and what are the first-line treatments?"
    back: "Stage 1 (Safety and Stabilization): emotional regulation techniques, medications, manage substance use. Stage 2 (Remembrance and Mourning): exposure to traumatic memories, working through distorted thoughts/relational patterns/grief. Stage 3 (Reconnection and Integration): exposure therapy, building new future and identity. Psychotherapy: CBT and EMDR are first-line. Pharmacotherapy first-line: fluoxetine, paroxetine, sertraline, venlafaxine XR (50-80% response but residual symptoms common). Prazosin for nightmares. Benzodiazepines used with extreme caution, not recommended acutely post-trauma.\n\nEMDR (Eye Movement Desensitization and Reprocessing) is explicitly recommended as a first-line treatment alongside trauma-focused CBT. Benzodiazepines are potentially harmful in acute post-trauma settings as they may impair fear extinction and increase risk of developing PTSD."
    difficulty: medium
    tags: [PTSD, treatment, EMDR, CBT, trauma recovery, psychiatry]
  - front: "How does Acute Stress Disorder differ from PTSD?"
    back: "Acute Stress Disorder: symptoms persist for 3 days to 1 month after trauma exposure, similar symptoms to PTSD. PTSD: requires >1 month duration (criterion F). Acute Stress Disorder may be a precursor to PTSD. The key distinguishing feature is duration: <1 month = Acute Stress Disorder; >1 month = PTSD.\n\nThis distinction is clinically important for coding and prognosis. Not all patients with Acute Stress Disorder develop PTSD. Early psychological support (not debriefing) is recommended for those exposed to trauma. Critical incident debriefing is no longer recommended as it may worsen outcomes."
    difficulty: easy
    tags: [acute stress disorder, PTSD, differential diagnosis, psychiatry]
  - front: "What are the DSM-5 criteria for Adjustment Disorder?"
    back: "A. Emotional or behavioural symptoms in response to identifiable stressor(s) within 3 months of stressor onset. B. Clinically significant: marked distress in excess of what would be expected, OR significant impairment in social/occupational functioning. C. Stress-related disturbance does not meet criteria for another mental disorder and is not merely an exacerbation of pre-existing mental disorder. D. Symptoms do not represent normal bereavement. E. Once stressor terminates, symptoms do not persist >6 additional months. Specifiers: with depressed mood, anxiety, mixed anxiety/depression, conduct disturbance, mixed disturbance of conduct/emotions, unspecified.\n\nAdjustment disorder prevalence is 2-8%, F:M = 2:1. Stressors can be single, multiple, recurrent, continuous, or developmental. This diagnosis should be considered when symptoms are present but do not meet full criteria for another disorder, and are clearly related to an identifiable stressor."
    difficulty: easy
    tags: [adjustment disorder, DSM-5, psychiatry]
  - front: "What distinguishes normal grief/bereavement from Major Depressive Disorder (MDD)?"
    back: "Symptoms suggesting MDD rather than normal grief: (1) guilt about things other than actions at time of death, (2) thoughts of death other than feeling they should have died with deceased, (3) morbid preoccupation with worthlessness, (4) marked psychomotor retardation, (5) prolonged marked functional impairment, (6) hallucinatory experiences other than hearing the voice/transiently seeing the image of the deceased, (7) dysphoria pervasive and independent of thoughts of deceased (no mood reactivity). After 12 months, persistent yearning/longing → consider persistent complex bereavement disorder. If MDD criteria are met in context of bereavement, MDD is STILL diagnosed.\n\nThis is a key change from DSM-IV: the 'bereavement exclusion' for MDD has been removed in DSM-5. If a patient meets full MDD criteria, even during bereavement, they receive an MDD diagnosis. Normal grief should NOT be treated with antidepressants as it is important to allow the mourning process."
    difficulty: medium
    tags: [bereavement, grief, MDD, differential diagnosis, psychiatry]
  - front: "What are risk factors for poor bereavement outcomes?"
    back: "Risk factors for poor bereavement outcome: (1) poor social supports, (2) prior history of depression or psychiatric disorder, (3) lack of preparation for death, (4) highly dependent relationship with deceased, (5) high initial distress, (6) other concurrent stresses and losses, (7) death of a child, (8) traumatic or unexpected loss, (9) history of separation anxiety. Consequence: significant increase in morbidity and mortality acutely following the loss. Loneliness is the most common symptom that continues to persist in normal bereavement.\n\nBereavement support should include assessment for secondary mental health conditions (PTSD, depression, suicidal ideation, substance use, cardiovascular illness). Grief therapy (individual or group) is indicated for those needing additional support or experiencing complex grief."
    difficulty: medium
    tags: [bereavement, grief, risk factors, psychiatry]
  - front: "What are the DSM-5 diagnostic criteria for Delirium?"
    back: "A. Disturbance in attention (reduced ability to direct, focus, sustain, shift attention) AND awareness (reduced orientation to environment). B. Develops over short period (hours to days), represents a change from baseline, and fluctuates in severity. C. Additional disturbance in cognition (memory deficit, disorientation, language, visuospatial ability, or perception). D. Not better explained by pre-existing neurocognitive disorder; not in context of severely reduced arousal (coma). E. Evidence from history/exam/labs that it is a direct physiological consequence of another medical condition, substance intoxication/withdrawal, or toxin.\n\nThe Confusion Assessment Method (CAM) is highly sensitive and specific for delirium diagnosis. CAM requires: (1) acute onset and fluctuating course, PLUS (2) inattention, PLUS either (3) disorganized thinking OR (4) altered level of consciousness."
    difficulty: easy
    tags: [delirium, DSM-5, neurocognitive disorders, psychiatry]
  - front: "What are the key clinical features and subtypes of Delirium?"
    back: "Features: (1) disturbance of attention (distractibility, disorientation to time/place/rarely person), (2) sleep/wake disturbance, (3) psychotic-like symptoms (visual hallucinations are organic until proven otherwise, delusions, illusions), (4) affective symptoms (anxiety, fear, depression, irritability, anger, euphoria, apathy), (5) shifts in psychomotor activity. Fluctuation over the course of the day is expected. Subtypes: hyperactive (30%), hypoactive (24%), mixed (46%). Note: collateral history is essential due to fluctuating symptoms.\n\nVisual hallucinations in delirium are a red flag for organic etiology. The hypoactive subtype (lethargic, withdrawn) is commonly missed and has a worse prognosis. Mixed delirium is the most common subtype. Collateral history from nursing staff and family is critical."
    difficulty: easy
    tags: [delirium, clinical features, hallucinations, psychiatry]
  - front: "What are the major risk factors for Delirium?"
    back: "Risk factors include: polypharmacy (especially anticholinergics, serotonergic drugs, psychoactive drugs—e.g., Cogentin, Benadryl, benzodiazepines, opioids, corticosteroids); infection; dehydration; malnutrition; immobility; bladder catheters; hospitalization (10-56% incidence); frail/surgical patients; previous delirium; nursing home residents (60% incidence); old age (especially males); severe illness (cancer, AIDS); recent anesthesia/surgery; brain vulnerability (pre-existing neurologic/neurocognitive disorder, substance use disorder, past psychiatric illness).\n\nThe mnemonic I WATCH DEATH covers delirium etiologies: Infections, Withdrawal, Acute metabolic, Trauma, CNS pathology, Hypoxia, Deficiencies, Endocrinopathies, Acute vascular, Toxins, Heavy metals. Drug toxicity accounts for approximately 30% of all delirium cases."
    difficulty: medium
    tags: [delirium, risk factors, psychiatry]
  - front: "What is the Confusion Assessment Method (CAM) for diagnosing Delirium?"
    back: "CAM requires features 1 AND 2, PLUS either 3 OR 4: (1) Acute onset and fluctuating course, (2) Inattention, (3) Disorganized thinking, (4) Altered level of consciousness. The CAM is highly sensitive and specific for diagnosing delirium. Features favouring delirium over psychosis: visual/tactile hallucinations, acute onset, no previous history of psychosis, cognitive impairment, recent medical illness/medication changes.\n\nThe CAM is the most widely validated and used tool for delirium detection in clinical settings. Features favouring psychosis over delirium include: auditory hallucinations that are structured and consistent, personal reference, gradual onset (unless substance-induced), and history of prodrome."
    difficulty: easy
    tags: [delirium, CAM, confusion assessment method, diagnosis, psychiatry]
  - front: "What is the management of Delirium?"
    back: "Step 1 - Identify/manage underlying cause: identify and treat cause immediately; stop non-essential medications; maintain nutrition/hydration/electrolyte balance; bowel care. Step 2 - Optimize environment: quiet, well-lit room; optimize hearing/vision; protect sleep; orient frequently (calendar, clock); avoid frequent room transfers or staff changes; falls prevention; safe mobility; minimize restraints/lines/catheters; calm supportive approach. Step 3 - Pharmacotherapy: low-dose high-potency antipsychotics (haloperidol 0.5-1 mg IM/IV q1-2h elderly; 0.5-2 mg PO q4-6h). Alternatives: risperidone (less sedating), olanzapine (more sedating), quetiapine (EPS-sensitive), aripiprazole (no QTc prolongation). Benzodiazepines ONLY for alcohol/substance withdrawal delirium.\n\nAll neuroleptics prolong QT interval and decrease seizure threshold. Patients with Parkinson's disease or Lewy body dementia are at high risk of EPS. An ECG should be obtained before starting antipsychotics. Antipsychotics treat agitation but do NOT treat the underlying acute brain state."
    difficulty: medium
    tags: [delirium, management, haloperidol, antipsychotics, psychiatry]
  - front: "What investigations should be ordered for a patient with suspected Delirium?"
    back: "Standard bloodwork: CBC with differential, electrolytes (including Ca²⁺, Mg²⁺, PO₄³⁻), glucose, BUN, creatinine, TSH/T4, LFTs, vitamin B12, folate, albumin, toxicology screen; if indicated: blood cultures, infectious serologies (HIV, VDRL, Hep B/C). Standard imaging: CXR and CT head (especially if focal neurological deficit, acute status change, anticoagulant use, acute incontinence, gait abnormality, history of cancer). Standard urinalysis: urine dip; if indicated: urine drug screen, urine C&S. If indicated: lumbar puncture and EEG (typical finding: generalized slowing).\n\nDrug toxicity accounts for approximately 30% of delirium cases, making medication review essential. EEG is not routinely ordered but can help rule out underlying seizures or postictal states. MRI head is indicated for negative CT when subacute stroke or multifocal inflammatory lesions are suspected."
    difficulty: medium
    tags: [delirium, investigations, workup, psychiatry]
  - front: "How does Delirium differ from Dementia and Depression-associated cognitive impairment?"
    back: "Onset: Delirium = acute (hours-days); Dementia = gradual/stepwise; Depression = subacute. Duration: Delirium = days-weeks; Dementia = months-years; Depression = variable. Level of consciousness: Delirium = fluctuating (hyperactive/hypoactive); Dementia = normal; Depression = normal. Attention: Delirium = impaired; Dementia = not initially affected; Depression = difficulty concentrating. Memory: Delirium = marked recent loss; Dementia = recent then remote loss; Depression = recent. Hallucinations: Delirium = visual (common, frightening/bizarre); Dementia = variable (vacuous/bland); Depression = less common (auditory if present, self-deprecatory).\n\nThis triad distinction is highly tested. Key differentiating features: delirium fluctuates (acute, reversible); dementia is progressive (irreversible, gradual); depression is subacute with pervasive depressed mood. Delirium up to 50% 1-year mortality after episode."
    difficulty: medium
    tags: [delirium, dementia, depression, differential diagnosis, psychiatry]
  - front: "What are the DSM-5 criteria for Major Neurocognitive Disorder (Dementia)?"
    back: "A. Evidence of significant cognitive decline from previous level in ≥1 cognitive domain (complex attention, executive function, learning/memory, language, perceptual-motor, social cognition) based on: (1) concern of individual, informant, or clinician of significant decline, AND (2) substantial impairment in cognitive performance (preferably by standardized neuropsychological testing). B. Cognitive deficits interfere with independence in everyday activities (at minimum, requiring assistance with complex IADLs). C. Not exclusively in context of delirium. D. Not better explained by another mental disorder.\n\nMild neurocognitive disorder (MCI) differs from major NCD: deficits do not interfere with independence in everyday activities and impairments are mild-moderate. The MoCA score of 18-25 suggests mild NCD; <18 suggests major NCD. Prevalence: 5% in >65 years, 35-50% in >85 years."
    difficulty: easy
    tags: [dementia, major neurocognitive disorder, DSM-5, psychiatry]
  - front: "What are the '7 As of Dementia' and the most common causes?"
    back: "7 As: (1) Amnesia (memory loss), (2) Aphasia (language loss), (3) Apraxia (loss of ability to carry out learned movements), (4) Agnosia (failure to recognize objects through senses), (5) Anosognosia (not knowing what one does not know), (6) Apathy (loss of initiative), (7) Alteration in personality. Most common causes: Alzheimer's disease (>50%); vascular dementia (~15-30%); Lewy body disease (~25%); frontotemporal degeneration (~5%).\n\nAlzheimer's disease: predominantly memory/learning, insidious onset, gradual progression. Frontotemporal: early language or behavioural changes (apathy/disinhibition), onset often before age 65. Lewy body: early executive/attention changes, well-formed visual hallucinations (e.g., rabbits), autonomic impairment, Parkinson-type EPS not responsive to levodopa. Vascular: executive dysfunction > memory, abrupt onset, stepwise progression."
    difficulty: easy
    tags: [dementia, Alzheimers disease, 7 As, psychiatry, neurology]
  - front: "What pharmacological treatments are used for Alzheimer's Disease?"
    back: "To slow AD: (1) Cholinesterase inhibitors (donepezil 5-10 mg once daily, rivastigmine, galantamine) for mild to severe disease. (2) NMDA receptor antagonist (memantine 5 mg once daily to 10 mg BID) for moderate to severe disease. To manage behavioural disturbances: low-dose atypical antipsychotics (olanzapine 2.5-10 mg/d, quetiapine 25-200 mg/d, risperidone 0.25-3 mg/d). Trazodone (25-100 mg) for night-time agitation. 'Start low and go slow' — effective doses can be 1/3 to 1/2 of regular adult doses. Reassess pharmacotherapy every 3 months.\n\nCholinesterase inhibitors work by increasing acetylcholine availability in areas of cholinergic deficiency. Memantine (NMDA antagonist) addresses glutamate excitotoxicity. Discontinue cognitively impairing medications (anticholinergics, benzodiazepines, Z-drugs). Physicians must inform the Ministry of Transportation about patients unable to drive safely."
    difficulty: medium
    tags: [dementia, Alzheimers disease, cholinesterase inhibitors, memantine, pharmacotherapy, psychiatry]
  - front: "What is the definition of Substance Use Disorder (SUD) and what are its key components?"
    back: "SUD is a neurobiological disorder involving compulsive drug seeking and taking despite adverse consequences, with loss of control over drug use (the '3 Cs': Compulsive use, Consequences, loss of Control). It is possible to have SUD without physiological dependence. Forms of dependence: (1) behavioural (substance-seeking activities, pathological use patterns), (2) physical (physiologic withdrawal effects or tolerance), (3) cognitive (continuous/intermittent cravings to avoid dysphoria or achieve desired effects). Usually chronic with relapsing-remitting course.\n\nDSM-5 identifies 10 substance classes: alcohol, caffeine, cannabis, hallucinogens (PCP), inhalants, opioids, sedatives/hypnotics/anxiolytics, stimulants (amphetamines, cocaine), tobacco, and other. Behavioural addictions (e.g., gambling) are also included. The lifetime prevalence of SUD in Canada is 21.6%."
    difficulty: easy
    tags: [substance use disorder, SUD, addiction, psychiatry]
  - front: "What is the epidemiology of Substance Use Disorders in Canada and their relationship with mental health?"
    back: "Lifetime prevalence of SUD in Canada: 21.6% (12-month: 10.1%). Alcohol use disorder: 18.1% lifetime, 3.2% 12-month. Cannabis use disorder: 6.8% lifetime, 1.3% 12-month. Other substances: 4.0% lifetime, 0.7% 12-month. 47% of those with SUD have mental health problems. 29% of those with a mental health disorder have SUD. 47% of those with schizophrenia and 25% of those with an anxiety disorder have a SUD.\n\nThe bidirectional relationship between SUD and mental health is striking. The very high rate of SUD in schizophrenia (47%) reflects self-medication of psychotic symptoms. Data were collected before cannabis legalization in Canada, so cannabis use disorder rates may be higher now."
    difficulty: easy
    tags: [substance use disorder, epidemiology, comorbidity, psychiatry, Canada]
  - front: "What is the neurobiological mechanism underlying substance addiction?"
    back: "Almost all drugs and activities related to dependence directly or indirectly increase dopamine release from ventral tegmental area (VTA) neurons synapsing onto the nucleus accumbens — known as the brain's 'reward pathway.' This action contributes to rewarding properties of substances. With repeated use, substances modulate signaling pathways that further encourage their use, contributing to addictive potential.\n\nThe mesolimbic dopamine pathway (VTA → nucleus accumbens) is the core of the reward system. Different substances activate this pathway through different mechanisms: opioids via disinhibition of dopamine neurons; cocaine/amphetamines via direct dopamine reuptake inhibition; alcohol via GABA and opioid systems. Understanding this is key to designing pharmacological treatments."
    difficulty: medium
    tags: [substance use disorder, neurobiology, dopamine, reward pathway, psychiatry]
  - front: "A 32-year-old woman presents with 8 months of worry about work performance, difficulty controlling her worry, fatigue, muscle tension, and poor sleep. She drinks 3 cups of coffee daily. Her PHQ-9 is 6 (mild). What is the most appropriate first step in management?"
    back: "Lifestyle modification first: reduce caffeine intake (a key modifiable factor for GAD) and improve sleep hygiene. Then initiate CBT (cognitive restructuring, relaxation techniques, mindfulness) and, if pharmacotherapy needed, start with an SSRI (escitalopram or sertraline) or SNRI (venlafaxine XR or duloxetine). Beta-blockers are NOT recommended for GAD. Benzodiazepines are 2nd line.\n\nThis patient has GAD (>6 months worry, difficult to control, ≥3 associated symptoms, causing impairment). Caffeine exacerbates anxiety and is a key lifestyle factor. The mild depression likely represents comorbidity. Starting with lifestyle modification before medications demonstrates appropriate clinical reasoning."
    difficulty: medium
    tags: [GAD, management, caffeine, anxiety, psychiatry]
  - front: "A 70-year-old man on the surgical ward post-hip replacement develops acute confusion, agitation, and visual hallucinations of animals in his room. He is pulling at his IV lines and trying to get out of bed. What is the immediate management?"
    back: "1. Identify and treat underlying cause (rule out infection, electrolyte imbalance, medication toxicity, hypoxia, urinary retention, constipation—common post-surgical delirium causes). Stop non-essential medications. 2. Optimize environment: quiet, well-lit room, family present for reassurance, frequent reorientation, falls prevention. 3. If agitation cannot be managed non-pharmacologically, use low-dose haloperidol 0.5-1 mg IM/IV q1-2h in elderly (monitor QT interval and EPS). Obtain ECG before antipsychotics. Avoid benzodiazepines (worsen delirium unless alcohol/sedative withdrawal).\n\nPost-surgical delirium is very common (especially post-hip fracture surgery). Visual hallucinations are organic until proven otherwise. Antipsychotics treat agitation but NOT the underlying delirium. Physical restraints should be minimized. Do NOT use benzodiazepines for delirium agitation unless there is alcohol or benzodiazepine withdrawal."
    difficulty: hard
    tags: [delirium, management, post-surgical, haloperidol, psychiatry]
  - front: "How does the Mini-Cog (rapid cognitive assessment) work, and what MoCA scores suggest Mild vs. Major Neurocognitive Disorder?"
    back: "Mini-Cog: (1) 3-word immediate recall, (2) Clock drawing to '10 past 11', (3) 3-word delayed recall. MoCA scoring: 18-25 = suggestive of mild neurocognitive disorder (MCI); <18 = suggestive of major neurocognitive disorder (dementia). Note: many false positives exist with MoCA — clinical context is important. MoCA is more sensitive than MMSE for detecting mild cognitive impairment.\n\nThe Mini-Cog is useful for rapid bedside screening. The clock drawing test (placing hands at 10 past 11) assesses executive function, visuospatial ability, and comprehension. The MoCA was developed at McGill University and is widely used in Canada. Education level affects scores."
    difficulty: easy
    tags: [dementia, cognitive assessment, MoCA, Mini-Cog, psychiatry]
  - front: "A patient with a 3-week history of intrusive thoughts about harming her baby, which she finds distressing and attempts to suppress, along with compulsive checking behaviours (2 hours/day) interfering with function. What is the diagnosis and treatment?"
    back: "Diagnosis: OCD (perinatal/postpartum presentation) — the intrusive harm-related obsessions and checking compulsions meet DSM-5 criteria, with >1 hour/day and functional impairment. Treatment: (1) CBT with ERP (first-line psychological treatment); (2) SSRIs (12-16 weeks for response, higher doses than for depression). Key consideration: distinguish from postpartum psychosis (ego-syntonic command hallucinations to harm baby) — OCD obsessions are ego-dystonic (distressing, unwanted).\n\nHarm obsessions (fear of hurting loved ones) are among the most common obsession types in OCD. They are ego-dystonic: the patient does not want to act on them. This is critically different from postpartum psychosis, where command hallucinations may be ego-syntonic and carry risk of infanticide. Reassurance about the nature of OCD obsessions is an important part of psychoeducation."
    difficulty: hard
    tags: [OCD, postpartum, differential diagnosis, ERP, psychiatry]
  - front: "What are the first-line pharmacological treatments for chronic insomnia disorder according to DSM-5 guidelines?"
    back: "Non-benzodiazepines are first-line: 'z-drugs' (e.g., zopiclone), lemborexant, and low-dose doxepin. CBT for insomnia (CBT-I) is also first-line (non-pharmacological).\n\nCanadian guidelines favour CBT-I as the most effective long-term treatment. Z-drugs and dual orexin receptor antagonists (lemborexant) are preferred over benzodiazepines due to lower dependence risk. Low-dose doxepin targets histamine receptors for sleep maintenance."
    difficulty: easy
    tags: [sleep disorders, insomnia, pharmacology, psychiatry]
  - front: "A patient presents with recurrent irresistible sleep attacks, sudden loss of muscle tone triggered by laughter, and vivid hallucinations upon falling asleep. What is the diagnosis and classic tetrad?"
    back: "Narcolepsy. Classic tetrad: (1) sleep attacks (irresistible need to sleep), (2) cataplexy (sudden loss of tone evoked by strong emotion, no LOC), (3) hypnagogic/hypnopompic hallucinations, (4) sleep paralysis.\n\nNarcolepsy is caused by loss of orexin (hypocretin)-producing neurons. Cataplexy is pathognomonic — it is REM-related muscle atonia intruding into wakefulness triggered by strong emotions like laughter. Management includes amphetamines, modafinil, and sodium oxybate."
    difficulty: easy
    tags: [narcolepsy, sleep disorders, cataplexy, psychiatry]
  - front: "What is the first-line treatment for restless legs syndrome (RLS)?"
    back: "Dopamine agonists and benzodiazepines are first-line. Iron should be replaced if ferritin is low. Medications exacerbating symptoms should be modified.\n\nRLS is characterized by an uncomfortable urge to move legs at rest, worse at night, relieved by movement. Low ferritin (even without frank anemia) is a reversible cause. Dopamine agonists (e.g., pramipexole, ropinirole) address the underlying dopaminergic deficit."
    difficulty: easy
    tags: [restless legs syndrome, sleep disorders, dopamine agonists, psychiatry]
  - front: "What distinguishes REM sleep behaviour disorder (RBD) from NREM parasomnias, and what is first-line management?"
    back: "RBD: arousal during REM with vocalization/complex motor behaviours; rapid orientation on awakening; associated with neurodegenerative disease. NREM: amnesia for episodes, difficult to arouse. Management: melatonin (first-line), clonazepam; discontinue causative medications (TCAs, SSRIs, SNRIs).\n\nRBD occurs when REM atonia is lost, allowing acting out of dreams. It is a prodrome of alpha-synucleinopathies (Parkinson's, Lewy body dementia, MSA). Unlike sleepwalking, patients with RBD have full orientation on awakening and recall their dreams."
    difficulty: medium
    tags: [REM sleep behaviour disorder, parasomnias, sleep disorders, psychiatry]
  - front: "How is Gender Dysphoria defined in DSM-5, and what are the three main components of management?"
    back: "Gender Dysphoria: marked incongruence between experienced/expressed gender and sex assigned at birth, causing distress. Management: (1) supportive psychotherapy/mental health counselling, (2) hormone therapy (feminizing: estrogen + anti-androgen; masculinizing: testosterone), (3) gender-affirming surgery.\n\nCanadian guidelines emphasize gender-affirming care, beginning with using the patient's preferred pronouns and language. Practitioners should recognize patients as experts in their own experiences. Social and institutional supports (peer groups, documentation for legal name/gender changes) are also important."
    difficulty: easy
    tags: [gender dysphoria, gender-affirming care, sexuality, psychiatry]
  - front: "What is the distinction between a paraphilia and a paraphilic disorder?"
    back: "Paraphilia: intense, persistent (≥6 months) sexual arousal from non-normative stimuli — not inherently a disorder. Paraphilic disorder: the paraphilia causes distress/functional impairment to the individual, OR its realization entails harm or risk of harm to others.\n\nDSM-5 separates the presence of atypical sexual arousal (paraphilia) from pathological impact. Paraphilic disorders require clinical intervention; management includes anti-androgens (medroxyprogesterone, leuprolide), high-dose SSRIs (e.g., fluoxetine), behaviour modification, and psychotherapy."
    difficulty: medium
    tags: [paraphilic disorders, sexuality, DSM-5, psychiatry]
  - front: "List the DSM-5 subtypes of paraphilic disorders."
    back: "Voyeuristic, exhibitionistic, frotteuristic, sexual masochism, sexual sadism, pedophilic, fetishistic, transvestic, other specified/unspecified paraphilic disorder.\n\nParaphilic disorders tend to begin in childhood/early adolescence, are more common in men (95%), and rarely present via self-referral — usually through legal or interpersonal conflict. Most patients have more than one paraphilia. Disorders tend to be chronic but decrease with age."
    difficulty: easy
    tags: [paraphilic disorders, DSM-5, psychiatry]
  - front: "What are the DSM-5 diagnostic criteria for Anorexia Nervosa?"
    back: "A. Restriction of energy intake leading to significantly low body weight for age/sex/developmental trajectory. B. Intense fear of weight gain OR persistent behaviour interfering with weight gain despite low weight. C. Disturbance in body weight/shape experience, undue influence on self-evaluation, or lack of recognition of seriousness of low weight.\n\nAll three criteria (A, B, C) must be met. Specifiers include restricting vs. binge-eating/purging type and severity by BMI: mild ≥17, moderate 16–16.99, severe 15–15.99, extreme <15 kg/m². Importantly, intense fear (Criterion B) can be manifested by behaviours even without expressed fear."
    difficulty: easy
    tags: [anorexia nervosa, eating disorders, DSM-5, psychiatry]
  - front: "What are the criteria for medical ward admission in a patient with Anorexia Nervosa?"
    back: "<65% of standard body weight (<85% in adolescents), hypovolemia requiring IV fluids, heart rate <40 bpm, abnormal serum chemistry (low K⁺, Mg²⁺, PO₄³⁻, or high creatinine), or active suicidality.\n\nPsychiatric hospitalization for eating disorders is rarely acute unless there is a concurrent psychiatric emergency. Medical admission thresholds reflect life-threatening physiological compromise. Agreed-upon target weight should be set on admission with reassurance it won't be surpassed."
    difficulty: medium
    tags: [anorexia nervosa, eating disorders, hospitalization criteria, psychiatry]
  - front: "What is refeeding syndrome, what electrolyte abnormality is central, and how is it prevented?"
    back: "Refeeding syndrome: life-threatening metabolic response to refeeding in severely malnourished patients causing severe fluid/electrolyte shifts. Central electrolyte: hypophosphatemia. Complications: CHF, cardiac arrhythmias, delirium, death. Prevention: slow refeeding, gradual nutritional increase, supplemental phosphorus, close electrolyte and cardiac monitoring.\n\nRefeeding causes a shift from fat to carbohydrate metabolism, triggering insulin release that drives phosphate, potassium, and magnesium intracellularly. Hypophosphatemia is the hallmark. Monitoring and gradual reintroduction of calories (starting low at ~20 kcal/kg/day) is essential."
    difficulty: medium
    tags: [refeeding syndrome, anorexia nervosa, eating disorders, electrolytes, psychiatry]
  - front: "What is the prognosis for Anorexia Nervosa?"
    back: "Only ~50% make a full recovery. Adolescent onset has better prognosis than adult onset. With treatment, 70% achieve ≥85% of expected weight; ~57% resume normal menstrual function. Mortality is ~7% (starvation, cardiac/metabolic complications, suicide).\n\nAN has the highest mortality of any psychiatric disorder. Poor prognostic factors include adult onset, chronicity, binge-purge type, comorbid depression or substance use. Eating abnormalities and psychiatric symptoms are common and persistent even with partial recovery."
    difficulty: easy
    tags: [anorexia nervosa, prognosis, eating disorders, psychiatry]
  - front: "What are the DSM-5 diagnostic criteria for Bulimia Nervosa?"
    back: "A. Recurrent binge-eating (large amount + sense of lack of control). B. Recurrent inappropriate compensatory behaviours (self-induced vomiting, laxatives, diuretics, fasting, excessive exercise). C. Both occur ≥once/week for 3 months. D. Self-evaluation unduly influenced by body shape/weight. E. Not occurring exclusively during AN episodes.\n\nSeverity is based on compensatory behaviour frequency: mild (1–3/week), moderate (4–7/week), severe (8–13/week), extreme (≥14/week). Treatment: SSRIs (fluoxetine has most evidence), CBT, family therapy. Medical admission if significant electrolyte abnormalities present."
    difficulty: easy
    tags: [bulimia nervosa, eating disorders, DSM-5, psychiatry]
  - front: "What physical signs are associated with bulimia nervosa due to self-induced vomiting?"
    back: "Russell's sign (knuckle callus), dental enamel loss/caries, parotid gland enlargement, perioral skin irritation, mouth ulcers, periocular and palatal petechiae, metabolic alkalosis with hypokalemia.\n\nRussell's sign (calluses on dorsum of hand/knuckles) results from repeated contact with teeth during self-induced vomiting. Parotid hypertrophy is from repeated vomiting. Electrolyte findings: vomiting causes hyponatremia, hypokalemia, hypochloremia, low H⁺ → metabolic alkalosis. Laxatives cause metabolic acidosis."
    difficulty: medium
    tags: [bulimia nervosa, Russells sign, eating disorders, physical signs, psychiatry]
  - front: "How does the electrolyte pattern differ between self-induced vomiting and laxative abuse in bulimia nervosa?"
    back: "Vomiting: ↓Na⁺, ↓K⁺, ↓Cl⁻, ↓H⁺ → metabolic alkalosis + hypokalemia. Laxatives: ↓Na⁺, ↓K⁺, ↓Cl⁻, ↑H⁺ → metabolic acidosis.\n\nVomiting loses gastric acid (HCl), causing metabolic alkalosis. Laxative abuse causes loss of bicarbonate-rich intestinal secretions, leading to a non-anion gap metabolic acidosis. Distinguishing these patterns helps identify purging method and guides management."
    difficulty: hard
    tags: [bulimia nervosa, electrolytes, metabolic alkalosis, metabolic acidosis, psychiatry]
  - front: "What differentiates Binge-Eating Disorder from Bulimia Nervosa?"
    back: "Binge-Eating Disorder: binge eating WITHOUT compensatory behaviours; dieting usually follows binge-eating (in BN, dysfunctional dieting precedes binge-eating). BED: F:M=2:1. BN: binge-eating with compensatory behaviours; self-evaluation unduly influenced by body shape/weight.\n\nKey differential: absence of compensatory behaviours in BED. BED patients often feel disgust/guilt after binges. AN binge-purge type differs by having significantly low body weight. Avoidant/restrictive food intake disorder does not involve body image disturbances. BED treatment is primarily CBT."
    difficulty: medium
    tags: [binge eating disorder, bulimia nervosa, eating disorders, differential diagnosis, psychiatry]
  - front: "What is Avoidant/Restrictive Food Intake Disorder (ARFID), and how does it differ from Anorexia Nervosa?"
    back: "ARFID: feeding/eating disturbance with persistent failure to meet nutritional needs (weight loss, nutritional deficiency, enteral feeding dependence) WITHOUT body image disturbance. Onset typically in infancy. AN: significantly low weight WITH body image disturbance. ARFID not explained by lack of available food or culturally sanctioned practice.\n\nARFID lacks the fear of weight gain and body image distortion central to AN. It may be driven by sensory sensitivities, fear of choking/vomiting, or lack of interest in food. Risk factors include anxiety disorders and GI conditions. Treatment: psychoeducation, behaviour modification, psychotherapy."
    difficulty: medium
    tags: [ARFID, eating disorders, anorexia nervosa, differential diagnosis, psychiatry]
  - front: "What are the general criteria that define a Personality Disorder?"
    back: "An enduring pattern of inner experience and behaviour that: (1) deviates markedly from cultural expectations in ≥2 of: cognition, affect, interpersonal functioning, impulse control; (2) is inflexible and pervasive; (3) stable and established by adolescence/early adulthood (not sudden onset); (4) causes significant distress or functional impairment.\n\nPersonality disorders are not episodic — their stability over time and early onset distinguish them from Axis I disorders. The mainstay of treatment is psychotherapy (CBT, IPT, psychodynamic, DBT). Pharmacotherapy targets comorbid conditions only. Establishing therapeutic boundaries and showing empathy are key clinical skills."
    difficulty: easy
    tags: [personality disorders, DSM-5, psychiatry]
  - front: "Describe the three Clusters of Personality Disorders and their key characteristics."
    back: "Cluster A ('Mad'): odd, eccentric — paranoid, schizoid, schizotypal; familial association with psychotic disorders. Cluster B ('Bad'): dramatic, emotional, impulsive — borderline, narcissistic, antisocial, histrionic; familial association with mood disorders. Cluster C ('Sad'): anxious, fearful — avoidant, obsessive-compulsive, dependent; familial association with anxiety disorders.\n\nCluster A uses defense mechanisms of intellectualization, projection, and magical thinking. Cluster B uses denial, acting out, regression, splitting, projective identification. Cluster C uses isolation, avoidance, and hypochondriasis. Personality disorders with familial associations to psychotic disorders: schizotypal, antisocial, borderline."
    difficulty: easy
    tags: [personality disorders, cluster A, cluster B, cluster C, psychiatry]
  - front: "What is the mnemonic for Paranoid Personality Disorder and what are its diagnostic criteria?"
    back: "Mnemonic: SUSPECT. Requires 4+ of: Suspicious (exploitation/deception without basis), Unforgiving (bears grudges), Spousal infidelity suspected without justification, Perceives attacks/counterattacks quickly, Enemies or friends (preoccupied with trustworthiness), Confiding feared, Threats interpreted in benign remarks. Must rule out psychotic disorder.\n\nPrevalence 1–4%. Paranoid PD differs from paranoid schizophrenia by lacking true delusions/hallucinations. Patients appear angry and hostile, blame others for problems. They are unlikely to seek treatment voluntarily. Psychotherapy (building trust) is the mainstay."
    difficulty: medium
    tags: [paranoid personality disorder, cluster A, personality disorders, psychiatry]
  - front: "What is the mnemonic for Schizotypal Personality Disorder and what are its key features?"
    back: "Mnemonic: ME PECULIAR. Requires 5+ of: Magical thinking, Experiences unusual perceptions (body illusions), Paranoid ideation, Eccentric behaviour/appearance, Constricted/inappropriate affect, Unusual thinking/speech (vague, stereotyped), Lacks close friends, Ideas of reference, Anxiety in social situations (related to paranoid fears, does not diminish with familiarity). Prevalence 4–5%.\n\nSchizotypal PD has a familial association with schizophrenia and may represent a milder form on the schizophrenia spectrum. Unlike schizoid PD, patients are INTERESTED in relationships but have difficulty forming them. Unlike schizophrenia, no true psychosis. Rule out pervasive developmental disorders."
    difficulty: medium
    tags: [schizotypal personality disorder, cluster A, personality disorders, psychiatry]
  - front: "How do Schizoid, Schizotypal, and Schizophrenia differ in terms of thought content and social relationships?"
    back: "Schizoid: organized thought, no psychosis; SOLITARY with NO desire for relationships. Schizotypal: organized but vague/circumstantial thought, no psychosis (but ideas of reference, paranoid ideation, magical thinking); INTERESTED in relationships but UNABLE to form them. Schizophrenia: disorganized thought, psychosis; socially marginalized but NOT by choice.\n\nKey distinction: schizoid patients don't WANT relationships; schizotypal patients WANT but can't have them; schizophrenia patients are marginalized involuntarily. Schizotypal overlaps most with schizophrenia spectrum. Schizoid has the most restricted/flat affect."
    difficulty: hard
    tags: [schizoid, schizotypal, schizophrenia, differential diagnosis, personality disorders, psychiatry]
  - front: "What are the DSM-5 diagnostic criteria for Borderline Personality Disorder (mnemonic IMPULSIVE) and what is the hallmark treatment?"
    back: "Mnemonic: IMPULSIVE (5+ required): Impulsive (≥2 self-damaging ways), Mood/affect instability, Paranoia/dissociation under stress, Unstable self-image, Labile intense relationships (idealization/devaluation), Suicidal gestures/self-harm, Inappropriate anger, Voiding abandonment (frantic efforts), Emptiness. Treatment: Dialectical Behaviour Therapy (DBT). 10% suicide rate.\n\nBPD has a strong correlation with childhood sexual abuse and emotionally invalidating environments. Splitting (seeing things as all-good or all-bad) is the hallmark defense mechanism. DBT combines CBT, mindfulness, distress tolerance, and interpersonal effectiveness. More dramatic behaviour tends to diminish with age."
    difficulty: medium
    tags: [borderline personality disorder, cluster B, DBT, personality disorders, psychiatry]
  - front: "What are the diagnostic criteria for Antisocial Personality Disorder (ASPD) and what age requirement is needed?"
    back: "Mnemonic: CORRUPT (3+ required): Cannot conform to law (repeated illegal acts), Obligations ignored (irresponsible), Reckless disregard for safety, Remorseless, Underhanded (deceitful/conning), Planning insufficient (impulsive), Temper (irritable/aggressive). Requirements: patient must be ≥18; evidence of Conduct Disorder before age 15. Prevalence: M 2–4%, F 0.5–1%.\n\nASPD cannot be diagnosed before age 18, but conduct disorder must be present before age 15. History of trauma/abuse is common. Patients may appear charming initially. Disregard for others' rights is pervasive. Mainstay is psychotherapy; treatment resistance is common."
    difficulty: medium
    tags: [antisocial personality disorder, cluster B, conduct disorder, personality disorders, psychiatry]
  - front: "What differentiates Avoidant Personality Disorder from Schizoid Personality Disorder?"
    back: "Avoidant PD: WANTS relationships but avoids them due to FEAR of rejection, criticism, embarrassment; hypersensitive to criticism; socially inhibited. Schizoid PD: has NO DESIRE for relationships and genuinely prefers solitude; not driven by fear but by genuine disinterest.\n\nAvoidant PD is Cluster C (anxious/fearful) with familial association with anxiety disorders. Schizoid is Cluster A (odd/eccentric). The key question: is the social withdrawal driven by fear (avoidant) or preference (schizoid)? Avoidant PD also overlaps with social anxiety disorder — avoidant PD is more pervasive and ego-syntonic."
    difficulty: medium
    tags: [avoidant personality disorder, schizoid personality disorder, differential diagnosis, cluster C, cluster A, psychiatry]
  - front: "How does Obsessive-Compulsive Personality Disorder (OCPD) differ from OCD?"
    back: "OCPD: ego-syntonic (consistent with self-image); preoccupation with orderliness/perfectionism/control; obsessional thinking without compulsions, rituals, or anxiety; rigid, inflexible. OCD: ego-dystonic (intrusive, unwanted thoughts); obsessions + compulsions; causes anxiety; patient recognizes thoughts as senseless.\n\nOCPD (Cluster C) features perfectionism that hampers task completion, inability to discard worthless objects, devotion to work excluding leisure, inflexibility in ethics/morality, and reluctance to delegate. Requires 4+ of: SCRIMPER. Highly comorbid with mood/anxiety and eating disorders."
    difficulty: medium
    tags: [OCPD, OCD, personality disorders, cluster C, differential diagnosis, psychiatry]
  - front: "What are the key features of Dependent Personality Disorder?"
    back: "Pervasive and excessive need to be cared for, excessive fear of separation, clinging/submissive behaviour. Mnemonic RELIANCE (5+ required): Reassurance needed for everyday decisions, Expressing disagreement difficult, Life responsibilities assumed by others, Initiating projects difficult, Alone feels helpless, Nurturance sought excessively, Companionship sought urgently, Exaggerated fears of caring for self. Prevalence 0.5–0.6%.\n\nManagement involves setting a regulated treatment schedule (regular, brief visits) and being firm about boundaries between visits. Encourage the patient to engage in own problem-solving. The goal is gradually increasing autonomy and self-efficacy."
    difficulty: easy
    tags: [dependent personality disorder, cluster C, personality disorders, psychiatry]
  - front: "What are the four attachment styles from the Strange Situation experiment and their associated parenting styles?"
    back: "Secure (loving, consistently available caregiver): explores freely, distressed at departure, happy at return. Insecure avoidant (rejecting, unavailable caregiver): ignores caregiver, little emotion. Insecure ambivalent/resistant (inconsistent caregiver): clingy but inconsolable, angry. Disorganized (frightening, dissociated, sexualized caregiver; history of trauma/loss): simultaneous approach/avoidance.\n\nThe caretaker's attachment style is the best predictor of their child's attachment style. Separation anxiety is normal between 10–18 months. The Strange Situation stresses the child by removing the caregiver; the child's behaviour during reunion (not separation) is what classifies attachment type."
    difficulty: medium
    tags: [attachment, child psychiatry, developmental psychiatry, psychiatry]
  - front: "How does Major Depressive Disorder present differently in children versus adults?"
    back: "In children: irritable mood may replace depressed mood (key diagnostic difference); insomnia (not hypersomnia); somatic complaints more prominent; irritability, boredom, academic deterioration, social withdrawal. In adolescents: hypersomnia more common; substance misuse. Both: anhedonia, low self-esteem, low motivation.\n\nFirst-line SSRI in pediatric MDD is fluoxetine; 2nd line: escitalopram, sertraline, citalopram. Close follow-up is essential when starting SSRIs in adolescents to monitor for increased suicidal ideation. Lifetime prevalence: pre-pubertal 1–2% (F:M=1:1); adolescents 4–18% (F:M=2:1)."
    difficulty: medium
    tags: [major depressive disorder, child psychiatry, adolescent psychiatry, SSRIs, psychiatry]
  - front: "What is Disruptive Mood Dysregulation Disorder (DMDD) and how does it differ from Bipolar Disorder in children?"
    back: "DMDD: severe, developmentally inappropriate recurrent temper outbursts ≥3x/week with persistently irritable mood between outbursts; onset before age 10; present ≥12 months; diagnosed between ages 6–18; NO manic/hypomanic episodes. Bipolar: episodic mood changes with mania/hypomania. DMDD supersedes ODD if both criteria are met.\n\nDMDD was introduced in DSM-5 to reduce inappropriate bipolar diagnoses in children. The key distinguishing feature is the ABSENCE of discrete manic/hypomanic episodes and the CHRONIC irritability between outbursts. Comorbidities: ADHD, anxiety, depressive disorders."
    difficulty: medium
    tags: [DMDD, bipolar disorder, child psychiatry, disruptive mood, psychiatry]
  - front: "What is Separation Anxiety Disorder in children and what is its association with school refusal?"
    back: "Excessive, developmentally inappropriate anxiety about separation from attachment figures or home; distress for ≥4 weeks; persistent worry about losing attachment figures; reluctance to go places, be alone, or sleep alone; nightmares involving separation. Often associated with school refusal and comorbid MDD.\n\nNormal separation anxiety peaks at 10–18 months. Pathological separation anxiety persists beyond the developmentally expected period or is disproportionate. School refusal is a common presentation. Treatment: CBT, psychoeducation, SSRIs if needed. Distinguish from social anxiety (fear of scrutiny) and general school avoidance."
    difficulty: easy
    tags: [separation anxiety disorder, child psychiatry, school refusal, anxiety disorders, psychiatry]
  - front: "What is Selective Mutism and what are its key diagnostic features?"
    back: "Consistent failure to speak in specific social situations where speaking is expected, despite speaking in other situations, for ≥1 month. The disturbance interferes with educational/occupational achievement or social communication. Not due to lack of language knowledge or communication disorder.\n\nSelective mutism is classified as an anxiety disorder in DSM-5. It most commonly presents in early childhood and is associated with social anxiety disorder. Diagnosis requires that the failure to speak is not better explained by a communication disorder (e.g., stuttering) or comfort with another language."
    difficulty: easy
    tags: [selective mutism, child psychiatry, anxiety disorders, psychiatry]
  - front: "What is the HEEADSSS interview and when is it used?"
    back: "A structured psychosocial interview for adolescents covering: Home environment, Education/Employment, Eating, Activities, Drugs, Sexuality, Safety, Suicide/depression. Used to assess psychosocial well-being and screen for risk factors in adolescent patients.\n\nHEEADSSS is the standard adolescent psychosocial interview in Canadian practice. It allows confidential exploration of sensitive topics in a systematic way. Starting with less sensitive topics (Home, Education) builds rapport before addressing more sensitive domains (Drugs, Sexuality, Suicide)."
    difficulty: easy
    tags: [HEEADSSS, adolescent psychiatry, child psychiatry, psychosocial assessment, psychiatry]
  - front: "What are the physiologic complications of AN starvation affecting the cardiovascular system and endocrine system?"
    back: "CVS: arrhythmias, CHF (from electrolyte disturbances and muscle wasting), bradycardia (HR <40 bpm can be admission criterion), QTc prolongation, starvation edema. Endocrine: primary or secondary amenorrhea, cold intolerance, decreased T3/T4, increased GH, decreased LH/FSH, decreased estrogen and testosterone.\n\nThe athletic triad (disordered eating, osteoporosis, amenorrhea) overlaps with AN. Elevated GH and decreased T3/T4 are adaptive responses to starvation. Cardiac complications (including sudden death from arrhythmia) are the leading cause of death in AN alongside suicide."
    difficulty: medium
    tags: [anorexia nervosa, complications, eating disorders, cardiovascular, endocrine, psychiatry]
  - front: "What skin and musculoskeletal findings are associated with starvation in Anorexia Nervosa?"
    back: "Skin: dry skin, lanugo hair (fine downy hair), hair loss/thinning, brittle nails, yellow skin (hypercarotenemia). MSK: osteoporosis secondary to hypogonadism (40% of patients), osteopenia (50%), pedal/periorbital edema from decreased albumin.\n\nLanugo hair is a characteristic feature of starvation — it represents reversion to a fetal hair pattern as a thermoregulatory response. Yellow skin from high carotene occurs because carotene metabolism is impaired in AN. Bone loss begins early and may be irreversible, making early treatment critical."
    difficulty: medium
    tags: [anorexia nervosa, lanugo, osteoporosis, eating disorders, physical signs, psychiatry]
  - front: "What lab values are expected in starvation (Anorexia Nervosa)?"
    back: "Decreased: RBCs, WBCs, LH, FSH, estrogen, testosterone. Increased: GH, cholesterol. Dehydration: increased BUN. Electrolytes: hypokalemia, hypomagnesemia, hypophosphatemia.\n\nElevated GH in starvation is a paradox — it is an adaptive response to maintain glucose. Elevated cholesterol occurs due to decreased estrogen (which normally promotes hepatic LDL uptake). Leukopenia can mask infections. Electrolyte abnormalities are dangerous and drive admission decisions."
    difficulty: hard
    tags: [anorexia nervosa, lab values, eating disorders, electrolytes, psychiatry]
  - front: "What are the good and poor prognostic factors for Bulimia Nervosa?"
    back: "Good prognostic factors: onset before age 15, achieving healthy weight within 2 years of treatment. Poor prognostic factors: later age of onset, previous hospitalizations, individual and familial disturbance. Outcomes: 60% good, 30% intermediate, 10% poor. Mortality: ~2% per decade. Relapsing/remitting course.\n\nBN has significantly better prognosis than AN (mortality ~2%/decade vs. ~7% lifetime for AN). The relapsing/remitting nature means long-term follow-up is important. SSRIs (especially fluoxetine at higher doses) and CBT are the mainstays of treatment."
    difficulty: easy
    tags: [bulimia nervosa, prognosis, eating disorders, psychiatry]
  - front: "What is the SCOFF questionnaire and what does it screen for?"
    back: "SCOFF is a 5-item eating disorder screening tool with 78% sensitivity and 88% specificity: Do you make yourself Sick? Do you worry you've lost Control? Have you lost more than One stone (6.35 kg) in 3 months? Do you believe yourself to be Fat when others say you are too thin? Would you say that Food dominates your life?\n\n2+ positive answers suggest a likely eating disorder. SCOFF is a validated screening tool used in primary care in Canada. It does not diagnose specific eating disorders but identifies patients needing further assessment. It covers key features of both AN (Fat, One stone) and BN (Sick, Control)."
    difficulty: easy
    tags: [SCOFF, eating disorders, screening, psychiatry]
  - front: "What is the narcissistic personality disorder mnemonic and how does it present clinically?"
    back: "Mnemonic: GRANDIOSE (5+ required): Grandiose sense of self-importance, Requires excessive admiration, Arrogant, Needs to be special (and associate with special people), Dreams of success/power/beauty, Interpersonally exploitative, Others (lacks empathy), Sense of entitlement, Envious. Prevalence ~6%. More in males.\n\nNarcissistic PD features a fragile sense of self beneath the grandiose exterior. Patients are often high-functioning professionally but have severe interpersonal difficulties. They are sensitive to perceived criticism (narcissistic injury) and may react with rage. Treatment is challenging due to ego-syntonic nature."
    difficulty: medium
    tags: [narcissistic personality disorder, cluster B, personality disorders, psychiatry]
  - front: "What is the treatment for bipolar disorder in adolescents and what makes it challenging?"
    back: "Lack of research specific to adolescents — treatment extrapolated from adult guidelines. Pharmacotherapy: mood stabilizers (lithium, anticonvulsants) and/or antipsychotics (risperidone, olanzapine, quetiapine, aripiprazole). Psychotherapy: CBT and family-focused therapy (psychoeducation + communication skills + problem-solving). Often misdiagnosed in adolescents.\n\nAdolescent bipolar disorder more commonly presents with mixed features and psychotic symptoms than adult-onset. Rapid onset of depression, psychomotor retardation, and affective illness in the family suggest bipolar. Family-focused therapy is specifically designed for bipolar disorder and combines multiple therapeutic components."
    difficulty: medium
    tags: [bipolar disorder, adolescent psychiatry, child psychiatry, mood stabilizers, psychiatry]
  - front: "What are the features distinguishing Histrionic Personality Disorder (mnemonic ACTRESSS)?"
    back: "Mnemonic ACTRESSS (5+ required): Appearance used to attract attention, Centre of attention (uncomfortable otherwise), Theatrical, Relationships believed more intimate than they are, Easily influenced, Seductive behaviour, Shallow expression of emotions (rapidly shifting), Speech (impressionistic and vague). Prevalence 2%. Diagnosed more in females but equal prevalence in studies.\n\nHistrionic PD (Cluster B) involves attention-seeking, dramatic, flamboyant behaviour with difficulty forming meaningful relationships. Defense mechanisms: denial, regression. Patients are often sexually inappropriate and easily influenced. Differentiate from borderline PD (which has self-harm, identity disturbance) and narcissistic PD (which focuses on superiority rather than attention-seeking)."
    difficulty: medium
    tags: [histrionic personality disorder, cluster B, personality disorders, psychiatry]
  - front: "What is the prognosis and course of childhood anxiety disorders, and when is pharmacotherapy used?"
    back: "With treatment, up to 80% will not meet criteria for anxiety disorder at 3-year follow-up, but up to 30% will meet criteria for another psychiatric disorder. Better prognosis: later onset, fewer comorbidities, early treatment, maintained school attendance/peer relationships, absence of social anxiety. Pharmacotherapy: SSRIs if CBT insufficient (meta-analysis shows SSRIs/SNRIs beneficial but benefit is small and disorder-specific; larger effect for anxiety than depression).\n\nThe cited meta-analysis (JAMA Psychiatry 2017) found SSRIs/SNRIs more effective than placebo in youth, with larger effect sizes for anxiety disorders (g=0.56) than depressive disorders (g=0.20). However, severe adverse events were significantly more common with active treatment vs. placebo, requiring careful monitoring."
    difficulty: medium
    tags: [anxiety disorders, child psychiatry, SSRIs, prognosis, psychiatry]
  - front: "What is the athletic triad and which eating disorder is it classically associated with?"
    back: "Athletic Triad: disordered eating + osteoporosis + amenorrhea (or reproductive dysfunction). Classically associated with Anorexia Nervosa, particularly the restricting subtype. All three components are interrelated through low energy availability → hormonal dysregulation → bone loss.\n\nThe female athlete triad is now termed Relative Energy Deficiency in Sport (RED-S) in Canadian sports medicine guidelines. Low energy availability impairs the hypothalamic-pituitary-gonadal axis, causing amenorrhea and reduced estrogen, which drives bone loss. Early recognition and treatment are critical to prevent irreversible osteoporosis."
    difficulty: medium
    tags: [athletic triad, anorexia nervosa, osteoporosis, amenorrhea, eating disorders, psychiatry]
  - front: "What is the SCRIMPER mnemonic for OCPD diagnostic criteria?"
    back: "SCRIMPER (4+ required): Stubborn, Cannot discard worthless objects, Rule/detail obsessed (to point activity is lost), Inflexible in morality/ethics/values, Miserly, Perfectionistic to extent it hampers task completion, Excludes leisure due to devotion to work, Reluctant to delegate. Prevalence 2.1–7.9%.\n\nOCPD is ego-syntonic — patients see their perfectionism and rigidity as virtues, not problems. This contrasts with OCD which is ego-dystonic. OCPD is highly comorbid with mood disorders, anxiety disorders, and eating disorders. Psychotherapy is the mainstay; CBT addresses cognitive rigidity."
    difficulty: medium
    tags: [OCPD, obsessive-compulsive personality disorder, cluster C, personality disorders, psychiatry]
  - front: "What is the management of circadian rhythm sleep-wake disorders?"
    back: "Melatonin (primary pharmacological treatment), bright light phototherapy, and modafinil if severe. Behavioural interventions include chronotherapy (gradual shifting of sleep schedule).\n\nCircadian rhythm disorders result from misalignment between the endogenous circadian clock and the desired sleep-wake schedule (e.g., delayed sleep phase, shift work, jet lag). Melatonin administration timing relative to the circadian phase is key: it is most effective when given at the target sleep time in the new schedule."
    difficulty: easy
    tags: [circadian rhythm, sleep disorders, melatonin, psychiatry]
  - front: "What medications can cause or exacerbate REM sleep behaviour disorder?"
    back: "TCAs (tricyclic antidepressants), SSRIs, and SNRIs can cause or worsen REM sleep behaviour disorder. Management includes discontinuing the causative medication if possible, plus melatonin or clonazepam.\n\nThese antidepressants suppress REM sleep acutely but upon discontinuation or dose changes, REM rebound with loss of REM atonia can occur. Identification and removal of causative medications is the first step in management of drug-induced RBD."
    difficulty: medium
    tags: [REM sleep behaviour disorder, SSRIs, SNRIs, TCAs, drug-induced, psychiatry]
  - front: "What is the first-line SSRI for adolescent MDD and what monitoring is required?"
    back: "First-line: fluoxetine. Second-line: escitalopram, sertraline, citalopram. Monitoring: close follow-up for all adolescents starting SSRIs to monitor for increased suicidal ideation or behaviour (black box warning in Canada for antidepressants in patients <24 years old).\n\nFluoxetine has the strongest evidence base for pediatric MDD. The black box warning reflects the finding of increased suicidal ideation (not completed suicide) in trials. This does not mean SSRIs should be withheld — untreated depression itself increases suicide risk. Psychotherapy + pharmacotherapy has best evidence for severe depression."
    difficulty: easy
    tags: [major depressive disorder, adolescent psychiatry, fluoxetine, SSRIs, suicidality, psychiatry]
  - front: "What are the common causes of lithium toxicity?"
    back: "Overdose, sodium/fluid loss, concurrent medical illness, initiation of NSAIDs, steroids, diuretics, or ACE inhibitors (can cause nephropathy and diabetes insipidus in some patients).\n\nLithium has a narrow therapeutic index and toxicity can occur even at 'therapeutic' levels. Renal clearance of lithium parallels sodium reabsorption, so anything reducing sodium/volume (dehydration, diuretics, NSAIDs, ACEi) raises lithium levels dangerously."
    difficulty: easy
    tags: [lithium, toxicity, psychiatry, pharmacology, mood stabilizer]
  - front: "What are the clinical features of lithium toxicity, organized by system?"
    back: "GI: severe nausea/vomiting, diarrhea. Cerebellar: ataxia, slurred speech, lack of coordination. Cerebral: drowsiness, myoclonus, tremor, upper motor neuron signs, seizures, delirium, coma.\n\nCerebellar and cerebral signs are the hallmark of lithium neurotoxicity. The GI symptoms often precede neurological symptoms. Recognition is clinical because toxicity can occur at 'therapeutic' serum levels."
    difficulty: easy
    tags: [lithium, toxicity, neurotoxicity, psychiatry]
  - front: "When is hemodialysis indicated for lithium toxicity?"
    back: "Lithium level >2 mmol/L, coma, shock, severe dehydration, failure to respond to treatment after 24 hours, or clinical deterioration.\n\nLithium is dialyzable due to its small molecular weight and lack of protein binding. Hemodialysis rapidly removes lithium and is life-saving in severe toxicity. IV saline is first-line for milder cases to restore volume and promote renal lithium excretion."
    difficulty: medium
    tags: [lithium, toxicity, hemodialysis, emergency, psychiatry]
  - front: "What is the management of lithium toxicity?"
    back: "1) Discontinue lithium for several days and restart at lower dose once levels non-toxic. 2) Monitor serum lithium, creatinine, BUN, electrolytes. 3) IV normal saline. 4) Hemodialysis if Li >2 mmol/L, coma, shock, severe dehydration, failure to respond after 24h, or deterioration.\n\nIV saline restores extracellular volume and promotes renal excretion of lithium. Monitoring renal function is critical as lithium can cause nephropathy. Hemodialysis is the definitive treatment for severe toxicity."
    difficulty: medium
    tags: [lithium, toxicity, management, psychiatry]
  - front: "What are the indications for anxiolytics (e.g., benzodiazepines)?"
    back: "Short-term treatment of anxiety disorders, insomnia, alcohol withdrawal (including delirium tremens), barbiturate withdrawal, akathisia due to antipsychotics, seizure disorders, musculoskeletal disorders, agitation/aggression in acute mania or psychosis.\n\nAnxiolytics decrease anxiety regardless of cause; they can mask or alleviate symptoms. They are generally reserved for short-term use to avoid tolerance and dependence."
    difficulty: easy
    tags: [anxiolytics, benzodiazepines, indications, psychiatry]
  - front: "What are the relative contraindications to anxiolytics?"
    back: "Major depression (except as adjunct), history of drug/alcohol misuse, pregnancy/breastfeeding (caution), myasthenia gravis (relative CI for benzodiazepines), risk of falls.\n\nMyasthenia gravis is a specific relative contraindication for benzodiazepines because their muscle relaxant and sedating effects can worsen neuromuscular blockade. Benzodiazepines are CNS depressants and can worsen depression."
    difficulty: medium
    tags: [anxiolytics, benzodiazepines, contraindications, psychiatry]
  - front: "What is the mechanism of action of benzodiazepines versus buspirone?"
    back: "Benzodiazepines: potentiate binding of GABA to its receptors, resulting in decreased neuronal activity. Buspirone: partial agonist of 5-HT1A receptors.\n\nBenzodiazepines act at the GABA-A receptor chloride channel complex to enhance inhibitory neurotransmission. Buspirone's different mechanism explains why it has no cross-tolerance with benzodiazepines and why its anxiolytic effect is delayed (2 weeks onset)."
    difficulty: easy
    tags: [benzodiazepines, buspirone, mechanism, GABA, serotonin, psychiatry]
  - front: "What are the side effects of benzodiazepines?"
    back: "CNS: drowsiness, cognitive impairment, reduced motor coordination (falls), memory impairment. Dependence, tolerance, withdrawal. Decreased respiratory drive. Increased risk of MVAs.\n\nAll benzodiazepines are sedating and share these side effects regardless of half-life. They are particularly dangerous in the elderly due to risk of falls and cognitive impairment. They potentiate alcohol and other CNS depressants."
    difficulty: easy
    tags: [benzodiazepines, side effects, psychiatry, pharmacology]
  - front: "Describe benzodiazepine withdrawal: symptoms, onset, and management."
    back: "Low-dose withdrawal: tachycardia, HTN, panic, rebound insomnia, anxiety, impaired memory/concentration, perceptual disturbances. High-dose/rapid withdrawal: hyperpyrexia, seizures, death. Onset: 1-2d (short-acting), 2-4d (long-acting). Management: taper slowly; may switch to a long-acting benzodiazepine.\n\nBenzodiazepine withdrawal is similar to but less severe than alcohol withdrawal, but can be fatal with high-dose or abrupt cessation. Abrupt withdrawal from >50 mg diazepam equivalents/day can cause autonomic hyperactivity, seizures, delirium, and arrhythmias."
    difficulty: medium
    tags: [benzodiazepines, withdrawal, psychiatry, pharmacology]
  - front: "When is benzodiazepine overdose dangerous or potentially fatal?"
    back: "When combined with alcohol, other CNS depressants, opioids, or TCAs. Benzodiazepine overdose alone is common but rarely fatal.\n\nThe synergistic CNS and respiratory depression from combining benzodiazepines with opioids, alcohol, or other sedatives dramatically increases the risk of fatal respiratory depression. Flumazenil is the benzodiazepine antagonist (Anexate) used for suspected overdose."
    difficulty: easy
    tags: [benzodiazepines, overdose, drug interaction, psychiatry]
  - front: "What is the benzodiazepine antagonist and what is it used for?"
    back: "Flumazenil (Anexate) — used for suspected benzodiazepine overdose to reverse sedation.\n\nFlumazenil competitively antagonizes benzodiazepines at the GABA-A receptor. It can precipitate withdrawal seizures in benzodiazepine-dependent patients and has a shorter half-life than most benzodiazepines so re-sedation can occur."
    difficulty: easy
    tags: [flumazenil, benzodiazepines, overdose, antidote, psychiatry]
  - front: "What are the advantages of buspirone (Buspar) over benzodiazepines for GAD?"
    back: "Non-sedating, no interaction with alcohol, does not alter seizure threshold, not prone to abuse. Primary use: GAD. Onset of action: 2 weeks.\n\nBuspirone's 5-HT1A partial agonist mechanism provides anxiolysis without the dependency, sedation, or cross-tolerance issues of benzodiazepines. The 2-week delay in onset is a clinical consideration — benzodiazepines may be used short-term during this bridge period."
    difficulty: easy
    tags: [buspirone, GAD, anxiety, psychiatry, pharmacology]
  - front: "Which benzodiazepines undergo no first-pass liver metabolism and are preferred in liver disease?"
    back: "Lorazepam (Ativan), oxazepam (Serax), and temazepam — remembered by the mnemonic 'LOT'. Lorazepam and oxazepam are most commonly used for alcohol withdrawal in liver disease.\n\nMost benzodiazepines are hepatically metabolized by oxidation (CYP450), which is impaired in liver disease. LOT drugs are conjugated directly by glucuronidation, which is better preserved. Lorazepam and oxazepam are preferred for alcohol withdrawal in cirrhosis."
    difficulty: medium
    tags: [benzodiazepines, liver disease, pharmacology, alcohol withdrawal, psychiatry]
  - front: "What are Z-drugs, and how do they compare to benzodiazepines?"
    back: "Non-benzodiazepine sedatives for short-term insomnia: zopiclone (Imovane), eszopiclone (Lunesta), zolpidem (Sublinox). Anecdotally provide more restful sleep. Similar side effect profile and dependency risk to benzodiazepines. Should not be used long-term.\n\nZ-drugs act on the same GABA-A receptor as benzodiazepines but with more selectivity. Despite being marketed as safer, they share similar risks of dependence, cognitive impairment, and falls, especially in the elderly."
    difficulty: easy
    tags: [Z-drugs, zopiclone, zolpidem, insomnia, psychiatry, pharmacology]
  - front: "What is the first-line long-acting benzodiazepine for seizure prevention and panic disorder?"
    back: "Clonazepam (Rivotril) — dose 0.25-4 mg/d, half-life 18-50 hours. Used for seizure prevention, akathisia, GAD, and panic disorder.\n\nClonazepam's long half-life provides stable blood levels suitable for seizure prophylaxis and panic disorder. Its high potency and anticonvulsant properties make it distinct from other benzodiazepines."
    difficulty: easy
    tags: [clonazepam, Rivotril, benzodiazepines, seizure, panic disorder, psychiatry]
  - front: "Which short-acting benzodiazepines should generally be avoided and why?"
    back: "Alprazolam (Xanax) — should be avoided due to high dependency rate. Temazepam (Restoril) and flurazepam (Dalmane) — should be avoided. Triazolam (Halcion) — shortest half-life, can cause rebound insomnia.\n\nShort-acting benzodiazepines with high potency (like alprazolam) have higher addiction liability and more pronounced rebound anxiety/insomnia between doses. Flurazepam has active metabolites with very long half-life, increasing fall/sedation risk."
    difficulty: medium
    tags: [alprazolam, benzodiazepines, dependency, psychiatry, pharmacology]
  - front: "What is ECT (electroconvulsive therapy) and what is the usual treatment course?"
    back: "ECT is the fastest and most effective acute treatment for depression. It involves induction of a generalized seizure using electrical pulse through scalp electrodes under general anesthesia with muscle relaxant. Usual course: 6-12 treatments, 2-3 per week.\n\nModern ECT is safe and controlled. General anesthesia and muscle relaxants prevent the physical convulsions seen in early ECT. Unilateral electrode placement causes less memory impairment than bilateral but may be less effective."
    difficulty: easy
    tags: [ECT, electroconvulsive therapy, depression, psychiatry, somatic therapy]
  - front: "What are the indications for ECT?"
    back: "Treatment-resistant depression (unipolar, bipolar I, bipolar II); depression with psychotic/catatonic features; depression when medications unsafe or rapid response needed (cachexia, severe dehydration, frail elderly, high suicide risk, pregnancy); refractory/severe/life-threatening catatonia; treatment-resistant schizophrenia, acute symptoms, catatonia, NMS history; refractory/severe mania; personal/family history of good ECT response.\n\nECT is underutilized due to stigma but is highly effective. It is particularly valuable when medications are contraindicated (pregnancy) or when rapid response is essential (severe suicidality, severe dehydration from refusal to eat/drink)."
    difficulty: medium
    tags: [ECT, indications, treatment-resistant depression, catatonia, psychiatry]
  - front: "What are the adverse effects and contraindications of ECT?"
    back: "Adverse effects: anesthesia risk, memory loss (retrograde and/or anterograde, usually resolves by 6-9 months), transient headaches, transient myalgias. No absolute contraindications. Relative: increased ICP, recent (<4 wk) hemorrhagic stroke, recent (<2 wk) MI.\n\nMemory loss is the most concerning side effect for patients. Bilateral ECT causes more memory loss than unilateral. The absence of absolute contraindications means ECT can be considered even in high-risk medical patients when benefits outweigh risks."
    difficulty: medium
    tags: [ECT, adverse effects, contraindications, memory loss, psychiatry]
  - front: "How does unilateral ECT compare to bilateral ECT?"
    back: "Unilateral ECT causes less memory loss than bilateral ECT, but may not be as effective.\n\nRight unilateral ECT (dominant temporal and parietal regions are avoided) reduces cognitive side effects. Bilateral ECT has greater antidepressant efficacy but at the cost of more pronounced and potentially persistent memory impairment."
    difficulty: easy
    tags: [ECT, unilateral, bilateral, memory, psychiatry]
  - front: "What is repetitive transcranial magnetic stimulation (rTMS) and what are its indications?"
    back: "rTMS is non-invasive production of focal electrical currents in select brain circuits using magnetic induction. Strong evidence for treatment-resistant depression and pain disorders. Possibly efficacious for anxiety, PTSD, eating disorders, substance use disorders. Not as effective as ECT for depression.\n\nrTMS avoids general anesthesia and systemic side effects of ECT. It is outpatient-based with sessions over several weeks. Common side effects: transient local discomfort, hearing issues, cognitive changes. Rare: seizure, syncope, mania induction."
    difficulty: easy
    tags: [rTMS, transcranial magnetic stimulation, treatment-resistant depression, psychiatry]
  - front: "What is deep brain stimulation (DBS) and what psychiatric conditions is it used for?"
    back: "DBS involves placement of small electrode leads in specific brain areas to alter neuronal signaling. Most evidence for OCD; some evidence for treatment-resistant MDD. Response rates (>50% symptom reduction) of 40-70%. Still experimental.\n\nDBS is used when all other treatments have failed. The electrodes can be placed in areas such as the nucleus accumbens or subgenual cingulate cortex. It is reversible and adjustable, unlike ablative procedures."
    difficulty: medium
    tags: [DBS, deep brain stimulation, OCD, treatment-resistant depression, psychiatry]
  - front: "What is vagus nerve stimulation (VNS) and when is it used in psychiatry?"
    back: "Direct intermittent electrical stimulation of the left cervical vagus nerve via implanted pulse generator. Used for chronic, recurrent MDD with poor response to previous therapy and ECT. Slow onset; approximately 30% response rate at 1 year.\n\nVNS is a last-resort treatment for highly treatment-resistant depression. The left vagus nerve is chosen because right VNS can cause cardiac effects. The slow onset and modest response rate mean it is rarely used but can be valuable in refractory cases."
    difficulty: medium
    tags: [vagus nerve stimulation, VNS, treatment-resistant depression, psychiatry]
  - front: "What is phototherapy (light box therapy), and what are its indications and adverse effects?"
    back: "Bright light exposure (10,000 lux) for 30 min daily within the first hour of awakening. Indications: seasonal affective disorder (SAD), non-seasonal depression (augmentation), some sleep disorders. Adverse effects: mania induction, reaction with photosensitizing drugs or photosensitive conditions.\n\nPhototherapy acts on the suprachiasmatic nucleus to reverse pathological circadian rhythm alterations associated with SAD. Morning exposure is critical to properly phase-advance the circadian clock. It is a first-line treatment for SAD."
    difficulty: easy
    tags: [phototherapy, light therapy, SAD, seasonal affective disorder, psychiatry]
  - front: "What is the role of aerobic exercise in psychiatric illness?"
    back: "Moderate-intense aerobic exercise: monotherapy for mild-moderate MDD; adjunctive therapy for moderate-severe MDD. May be helpful in PTSD and schizophrenia. Associated with increased serotonin, phenethylamine, BDNF, endogenous opioids, and cannabinoids acutely, and long-term increases in grey matter.\n\nExercise is an evidence-based treatment for depression. The neurobiological mechanisms include neuroplasticity (BDNF), monoamine release, and HPA axis regulation. Long-term exercise improves cognition, memory, and stress tolerance."
    difficulty: easy
    tags: [exercise, depression, MDD, PTSD, schizophrenia, psychiatry]
  - front: "Under the Ontario Mental Health Act, what is Form 1 and what are its key features?"
    back: "Form 1: Application by physician to bring a patient to a schedule 1 facility for psychiatric assessment against the patient's will. Any physician can sign. Valid 7 days after examination; hospitalization must occur within 7 days. Expires 72 hours after hospitalization. Patient receives Form 42. No right to review board hearing.\n\nForm 1 is completed when patients are thought to be in imminent danger of harm to themselves (suicide) or others (homicide), or when they are incapable of self-care and suffering from an apparent mental disorder. Form 3 or voluntary admission is the next step."
    difficulty: medium
    tags: [Form 1, Mental Health Act, Ontario, involuntary, psychiatric assessment, legal]
  - front: "Under the Ontario Mental Health Act, what is Form 2?"
    back: "Form 2: Order by Justice of the Peace to bring a patient to a hospital for psychiatric examination against their will. No statutory time restriction on the order; expires 7 days after admission. Based on any combination of the physician's own observations and facts communicated by others. Box A (Serious Harm Test) or Box B completed.\n\nUnlike Form 1 (physician-initiated), Form 2 is issued by a Justice of the Peace. It can be obtained by family members or police when a physician cannot be accessed. The patient is brought to hospital for examination, after which they may be admitted involuntarily or voluntarily."
    difficulty: medium
    tags: [Form 2, Mental Health Act, Ontario, Justice of the Peace, legal, psychiatry]
  - front: "What is Form 3 under the Ontario Mental Health Act?"
    back: "Form 3: Certificate of involuntary admission to a schedule 1 facility. Must be signed by a physician other than the one who completed Form 1. Issued before Form 1 expires. Valid 14 days. Patient has right to review board hearing. Patient receives Form 30. Next step: Form 4 or voluntary admission.\n\nForm 3 converts a Form 1 (temporary hold for assessment) into a formal involuntary admission. The physician must assess the patient using the Past/Present Test (current behaviors/threats/attempts) and the Future Test (likelihood of serious harm from the presenting mental disorder)."
    difficulty: medium
    tags: [Form 3, Mental Health Act, Ontario, involuntary admission, legal, psychiatry]
  - front: "What is Form 4 under the Ontario Mental Health Act, and what are its renewal periods?"
    back: "Form 4: Certificate of renewal of involuntary admission. Signed by any physician (usually attending). Must be issued prior to expiration of Form 3. Duration: First renewal 1 month, second renewal 2 months, third renewal 3 months (maximum). Patient has right to review board hearing.\n\nForm 4 is used to continue involuntary admission when the criteria are still met. After three Form 4 renewals, Form 4a (continuation certificate) with mandatory review board hearing is required. The increasing renewal durations reflect the expectation that most patients improve."
    difficulty: medium
    tags: [Form 4, Mental Health Act, Ontario, involuntary renewal, legal, psychiatry]
  - front: "What are the two criteria boxes (Box A and Box B) for involuntary psychiatric admission in Ontario?"
    back: "Box A (Serious Harm Test): Past/Present Test assesses current behaviors/threats/attempts; Future Test assesses likelihood of serious harm from the presenting mental disorder. Box B: Patients with a known mental disorder who are incapable of consenting to treatment (substitute decision-maker needed), have had previous hospitalization, and are at risk of serious harm due to the same mental disorder.\n\nBox B was added to the Ontario Mental Health Act to address 'revolving door' patients who repeatedly decompensate after discharge when they stop treatment. Box A is the primary pathway for acute danger assessments."
    difficulty: hard
    tags: [Mental Health Act, Ontario, Box A, Box B, involuntary admission, legal, psychiatry]
  - front: "What is a Community Treatment Order (CTO) in Ontario, and who is it intended for?"
    back: "A CTO orders a person with serious mental disorder to receive treatment and supervision in the community. Intended for those who: have a pattern of psychiatric hospital admissions; stop treatment after release leading to destabilization; repeatedly require readmission. CTOs are valid for 6 months unless renewed or terminated.\n\nCTOs address the 'revolving door' phenomenon. They are consent-based (patient or substitute decision-maker must consent) and provide structured community care as a less restrictive alternative to inpatient admission. Violation leads to Form 47 (police bring patient for examination)."
    difficulty: medium
    tags: [CTO, community treatment order, Mental Health Act, Ontario, legal, psychiatry]
  - front: "What are the physician criteria for issuing a Community Treatment Order (CTO) in Ontario?"
    back: "1) Prior psychiatric hospitalization (cumulative >30 days over >2 hospitalizations in past 3 years), or previous CTO in past 3 years. 2) Community treatment plan developed. 3) Physician examination within previous 72 hours. 4) Patient ability to comply assessed. 5) Consultation with rights advisor. 6) Consent of patient or substitute decision-maker.\n\nCTOs are consent-based, distinguishing them from involuntary admission. The 72-hour examination requirement ensures current clinical assessment. The historical hospitalization criterion identifies the target population of revolving-door patients."
    difficulty: hard
    tags: [CTO, community treatment order, criteria, Ontario, legal, psychiatry]
  - front: "What are the rights of a person subject to a Community Treatment Order (CTO) in Ontario?"
    back: "1) Right to review by Consent and Capacity Board (with court appeal) each time CTO is issued or renewed. 2) Mandatory review by Consent and Capacity Board every second CTO renewal. 3) Right to request re-examination by issuing physician. 4) Right to review findings of incapacity to consent to treatment. 5) Provisions for rights advice.\n\nThese rights ensure that CTOs, while restricting freedom, maintain patient autonomy and legal protections. The consent-based nature means withdrawal of consent can terminate the CTO, though this may trigger Form 47."
    difficulty: medium
    tags: [CTO, patient rights, Consent and Capacity Board, Ontario, legal, psychiatry]
  - front: "What happens if a patient violates a Community Treatment Order (CTO) in Ontario?"
    back: "The physician can issue a Form 47 — an order for examination that allows police to bring the patient to hospital for examination. Usually the patient is examined and treatment continues as per the CTO.\n\nForm 47 is the enforcement mechanism for CTO violations. The goal is to return the patient to compliance with the community treatment plan rather than automatic inpatient admission. This reflects the CTO's objective of least restrictive care."
    difficulty: medium
    tags: [CTO, Form 47, violation, Mental Health Act, Ontario, psychiatry]
  - front: "What did the CATIE trial (NEJM 2005) conclude about first- vs. second-generation antipsychotics for schizophrenia?"
    back: "First-generation (perphenazine) and second-generation antipsychotics (olanzapine, quetiapine, risperidone, ziprasidone) did not differ significantly in overall effectiveness or benefits. Perphenazine was the most cost-effective. Individual clinical circumstances and patient factors impacted drug effectiveness.\n\nThe CATIE trial was a landmark study challenging the assumption that second-generation antipsychotics were superior. It emphasized individualized prescribing and suggested switching medications in poor responders. Perphenazine was excluded from the initial randomization in patients with tardive dyskinesia."
    difficulty: medium
    tags: [CATIE, antipsychotics, schizophrenia, clinical trial, first-generation, second-generation]
  - front: "What did the STEP-BD trial (NEJM 2007) conclude about antidepressants for bipolar depression?"
    back: "Adding standard antidepressants (paroxetine or bupropion) to a mood stabilizer was NOT associated with increased efficacy or increased risk of treatment-emergent affective switch compared to mood stabilizer plus placebo. Recovery rates: 27.3% vs. 23.5% (not significant).\n\nSTEP-BD challenged the routine use of antidepressants for bipolar depression. Current guidelines generally recommend against antidepressant monotherapy in bipolar disorder and suggest they should not be the primary treatment added to mood stabilizers for bipolar depression."
    difficulty: medium
    tags: [STEP-BD, bipolar depression, antidepressants, clinical trial, psychiatry]
  - front: "What did the STAR*D trial (Am J Psychiatry 2006) reveal about treatment-resistant depression?"
    back: "Remission rates by step: 36.8% (step 1), 30.6% (step 2), 13.7% (step 3), 13.0% (step 4). Overall cumulative remission: 67%. Patients requiring more steps had higher relapse rates. Conclusion: Patients with persistent MDD benefit from successive treatment steps, but remission decreases with additional strategies.\n\nSTAR*D established the benchmark remission rates for MDD treatment in primary and specialty care. It demonstrated that persistence in treating MDD is worthwhile but that early remission predicts better long-term outcomes."
    difficulty: medium
    tags: [STAR*D, MDD, treatment-resistant depression, remission, clinical trial, psychiatry]
  - front: "What did the TADS trial (JAMA 2004) show about treatment of adolescent depression?"
    back: "Combination of fluoxetine + CBT was most effective (71% response rate; significantly superior to placebo P=0.001). Fluoxetine alone > CBT alone (P=0.01). Combination > fluoxetine alone (P=0.02). Combination offered the most favorable benefit-risk tradeoff for adolescents with MDD.\n\nTADS established that combined pharmacotherapy and psychotherapy is superior to either alone for adolescent MDD. The addition of CBT may help mitigate suicidality concerns associated with SSRI use in youth, providing a better safety profile."
    difficulty: medium
    tags: [TADS, adolescent depression, fluoxetine, CBT, clinical trial, psychiatry]
  - front: "What did the TRANSFORM-2 trial (Am J Psychiatry 2019) demonstrate about esketamine for treatment-resistant depression?"
    back: "Esketamine nasal spray plus a newly initiated oral antidepressant produced significantly greater improvement in MADRS scores at day 28 compared to placebo nasal spray plus antidepressant. Clinically meaningful improvements appeared earlier in the esketamine group. Conclusion: esketamine nasal spray is a safe, rapid-acting, efficacious therapy for treatment-resistant depression.\n\nEsketamine (Spravato) is an intranasal NMDA receptor antagonist approved for treatment-resistant depression. Its rapid onset (hours to days) distinguishes it from traditional antidepressants. It requires supervised administration due to dissociation risk."
    difficulty: medium
    tags: [esketamine, ketamine, treatment-resistant depression, TRANSFORM-2, clinical trial, psychiatry]
  - front: "What did the COMBINE trial (JAMA 2006) show about treatment of alcohol dependence?"
    back: "Naltrexone (100mg/d) with medical management improved drinking outcomes. Combined behavioral intervention (CBI) with medical management also improved outcomes. Acamprosate showed NO significant effect vs. placebo, alone or in combination. No combination produced better efficacy than naltrexone or CBI alone with medical management.\n\nThe COMBINE trial supports naltrexone as the pharmacological treatment of choice for alcohol dependence (in addition to behavioral interventions). It importantly showed acamprosate was not effective in this US population, though European trials have shown some benefit."
    difficulty: medium
    tags: [COMBINE, alcohol dependence, naltrexone, acamprosate, clinical trial, psychiatry]
  - front: "What is the difference between a Schedule 1 psychiatric facility and regular hospital admission under the Ontario Mental Health Act?"
    back: "Schedule 1 facilities are designated hospitals able to provide intensive inpatient and outpatient psychiatric care. Involuntary psychiatric forms (Forms 1, 3, 4) specifically authorize admission to Schedule 1 facilities.\n\nNot all hospitals are Schedule 1 facilities. This distinction is important because the Mental Health Act powers (involuntary admission, community treatment orders) only apply to patients being admitted to designated Schedule 1 facilities."
    difficulty: medium
    tags: [Schedule 1, Mental Health Act, Ontario, involuntary admission, psychiatry, legal]
  - front: "What is Form 33 under the Ontario Mental Health Act, and what does it communicate?"
    back: "Form 33: Notice to patient that the patient is incapable of consenting to treatment of a mental disorder, and/or management of property, and/or disclosure of health information. Issued by the attending physician. Original to patient, notice to rights advisor, copy to chart.\n\nForm 33 triggers substitute decision-making processes. It separates capacity to consent to psychiatric treatment from involuntary admission status — a patient can be voluntary but incapable of consenting to specific treatments."
    difficulty: medium
    tags: [Form 33, Mental Health Act, Ontario, capacity, consent, psychiatry, legal]
  - front: "What is Form 42 under the Ontario Mental Health Act?"
    back: "Form 42: Notice to the patient that the patient is now on a Form 1 and the reason for this change. Signed by the physician completing Form 1. Original to patient, copy to chart. No right to review board hearing.\n\nForm 42 ensures the patient is informed of their Form 1 status and the reason for the involuntary hold. Informed notification is a fundamental right even for involuntary patients."
    difficulty: easy
    tags: [Form 42, Mental Health Act, Ontario, Form 1, patient notification, psychiatry, legal]
  - front: "Which antidepressant combination is most effective for adolescents with MDD according to the TADS trial?"
    back: "Fluoxetine combined with cognitive-behavioral therapy (CBT) — 71% response rate, superior to either alone and to placebo.\n\nFor adolescent MDD, combined pharmacotherapy and psychotherapy is the evidence-based standard of care. The TADS trial specifically found fluoxetine + CBT superior to fluoxetine alone (P=0.02) and CBT alone (P=0.01). Fluoxetine is the preferred SSRI in pediatric populations."
    difficulty: easy
    tags: [adolescent depression, fluoxetine, CBT, MDD, TADS, psychiatry]
  - front: "What is the cumulative remission rate in MDD patients who go through all four treatment steps in STAR*D?"
    back: "Approximately 67% overall cumulative remission rate. However, patients requiring more steps had higher relapse rates during follow-up.\n\nSTAR*D showed that while most patients will eventually achieve remission with sequential treatment steps, those requiring more steps have worse long-term outcomes. This supports early aggressive treatment to achieve remission at the first treatment step."
    difficulty: medium
    tags: [STAR*D, MDD, remission, treatment steps, psychiatry]
  - front: "What is magnetic seizure therapy (MST) and how does it compare to ECT?"
    back: "MST uses strong magnetic current to induce generalized seizures. Early studies show efficacy for depression and anxiety with reduced memory effects compared to ECT. It remains experimental.\n\nMST combines the therapeutic seizure mechanism of ECT with the focality of TMS. By inducing seizures through magnetic rather than electrical stimulation, MST may achieve therapeutic benefit while reducing cognitive side effects, though it remains under investigation."
    difficulty: medium
    tags: [MST, magnetic seizure therapy, ECT, depression, psychiatry]
  - front: "What are ablative/lesion procedures in neurosurgery for psychiatry, and when are they used?"
    back: "Used for MDD or OCD unresponsive to all other treatment forms. Efficacy: 25-75% depending on procedure. Adverse effects related to lesion location/size, with high suicide risk in non-responders. Focused ultrasound therapy (FUS) is an experimental alternative avoiding open skull surgery.\n\nAblative procedures (e.g., anterior cingulotomy, capsulotomy) are last-resort treatments. They are irreversible, distinguishing them from DBS. The high suicide risk in non-responders underscores the need for careful patient selection and post-operative monitoring."
    difficulty: medium
    tags: [neurosurgery, ablative, MDD, OCD, psychiatry, focused ultrasound]
