# Anaphylaxis & Allergic Reactions (EmergencyMedicine) - generated from srs-mccqe1
cards:
  - front: "A 28-year-old develops generalized urticaria, laryngeal edema, wheezing, and hypotension 10 minutes after a bee sting. Diagnosis and immediate management?"
    back: "Anaphylaxis; immediate IM epinephrine 0.3-0.5 mg (1:1000 solution) in outer thigh — this is the FIRST priority, not antihistamines or steroids\n\nCAEP/WAO anaphylaxis guidelines: epinephrine is the only life-saving medication. Delay in epinephrine is associated with deaths. Antihistamines and steroids are adjuncts only (no effect on anaphylaxis course). 30-minute observation for uniphasic reactions; 4-6h for those requiring epinephrine. Prescribe epinephrine auto-injector at discharge."
    difficulty: hard
    tags: [anaphylaxis, epinephrine, epi-pen, anaphylactic shock, emergency medicine]
  - front: "What is the Sampson criteria for diagnosing anaphylaxis?"
    back: "Anaphylaxis when any one of: (1) Acute onset illness with skin/mucosal involvement + respiratory compromise or hypotension; (2) ≥2 symptoms after allergen exposure (skin, respiratory, GI, hypotension); (3) Hypotension after known allergen exposure\n\nWAO/CAEP criteria identify 95% of anaphylaxis cases. Skin/mucosal involvement absent in ~20% of severe anaphylaxis — do not rely on urticaria for diagnosis. Monitor for biphasic reactions (recurrence 4-8h later without re-exposure, occurring in 5-20%)."
    difficulty: medium
    tags: [anaphylaxis criteria, Sampson criteria, biphasic anaphylaxis, diagnosis, emergency medicine]
  - front: "What is the dosing of IM epinephrine for anaphylaxis and why is the IM route preferred over IV?"
    back: "IM: 0.3-0.5 mg of 1:1000 epinephrine in outer thigh; IM preferred over SQ (more reliable absorption); IV epinephrine only for cardiac arrest or severe refractory anaphylaxis (risk of severe arrhythmias at IM doses)\n\nOuter thigh IM injection results in faster absorption and higher peak levels than upper arm IM or SC. IV epinephrine for anaphylaxis requires careful dose reduction and dilution (1:10,000 or 1:100,000 solution) — errors are fatal. Repeat IM epinephrine q5-15 min if needed."
    difficulty: medium
    tags: [epinephrine dosing, anaphylaxis, IM injection, outer thigh, emergency medicine]
  - front: "What are the triggers for anaphylaxis in Canada and which is the most common trigger in adults?"
    back: "Foods (most common overall: peanuts, tree nuts, shellfish, fish, milk, eggs, wheat); Medications (most common in adults — especially penicillin, NSAIDs, contrast media); Insect stings (bees, wasps); Latex; Exercise; Idiopathic\n\nCAEP guidelines: food is the most common trigger in children; medications are most common in adults and elderly. Latex allergy is common in healthcare workers. Idiopathic anaphylaxis is a diagnosis of exclusion. Alpha-tryptase levels (1-2h after reaction) confirm mast cell activation."
    difficulty: easy
    tags: [anaphylaxis triggers, food allergy, drug allergy, insect sting, emergency medicine]
  - front: "What are the adjunct medications used in anaphylaxis management (after epinephrine)?"
    back: "IV H1 antihistamine (diphenhydramine 25-50mg), IV H2 antihistamine (ranitidine 50mg), IV corticosteroids (hydrocortisone 200mg or methylprednisolone 125mg), bronchodilator (salbutamol) for wheeze, IV fluids for hypotension\n\nCAEP guidelines: these adjuncts do NOT replace epinephrine. Antihistamines address urticaria/itching but do NOT prevent or treat respiratory compromise or hypotension. Corticosteroids may prevent biphasic reactions (limited evidence). All patients should receive epinephrine first."
    difficulty: easy
    tags: [anaphylaxis management, diphenhydramine, corticosteroids, adjuncts, emergency medicine]
  - front: "What is biphasic anaphylaxis and who is at risk?"
    back: "Biphasic anaphylaxis: recurrence of symptoms 1-72 hours (typically 4-8h) after initial resolution without further allergen exposure; occurs in 5-20% of cases; risk factors: severe initial reaction, unknown trigger, delayed epinephrine treatment\n\nCAEP guidelines: biphasic reactions are unpredictable. Observation for 4-6 hours after epinephrine administration. Some guidelines recommend 24-hour observation for severe reactions or those with unknown triggers. Discharge criteria: hemodynamically stable, symptoms resolved, discharge with epinephrine auto-injector."
    difficulty: hard
    tags: [biphasic anaphylaxis, observation period, recurrence, emergency medicine]
  - front: "A patient has suspected anaphylaxis to penicillin and requires urgent surgery. Is cephalosporin safe to use?"
    back: "Cross-reactivity between penicillin and cephalosporins is ~1-2% (not 10% as previously thought); use with caution based on specific allergy history — desensitization protocol if penicillin is essential for surgical infection prophylaxis\n\nAllergy Canada and CAEP guidelines: 90% of patients with self-reported penicillin allergy tolerate penicillin and cephalosporins. True immediate hypersensitivity mediated by IgE. Cross-reactivity based on R1 side chain similarity — 1st generation cephalosporins have higher cross-reactivity. Skin testing for penicillin allergy is gold standard."
    difficulty: hard
    tags: [penicillin allergy, cephalosporin cross-reactivity, drug allergy, desensitization, emergency medicine]
  - front: "What are the discharge instructions for a patient treated for anaphylaxis?"
    back: "Prescribe epinephrine auto-injector x2 (EpiPen), allergist referral, medical alert bracelet, written action plan, antihistamines and corticosteroids for mild reactions (NOT in place of epinephrine), return if symptoms recur, food/drug avoidance counseling\n\nCAEP anaphylaxis guidelines: all patients discharged after anaphylaxis require epinephrine auto-injector prescription and training on use. Referral to allergist for allergen identification and immunotherapy (desensitization for bee venom, penicillin). Patients on beta-blockers: epinephrine may be less effective."
    difficulty: medium
    tags: [anaphylaxis discharge, EpiPen, allergist referral, action plan, emergency medicine]
  - front: "What medications can interfere with the treatment of anaphylaxis?"
    back: "Beta-blockers: blunt epinephrine effect (can cause severe hypertension via unopposed alpha-agonism), may require IV glucagon 1-2 mg; ACE inhibitors: increase bradykinin, worsen angioedema and hypotension\n\nCAEP guidelines: patients on beta-blockers who develop anaphylaxis require higher epinephrine doses and/or IV glucagon (reverses beta-blockade). ACE inhibitor-induced angioedema: hereditary angioedema treatment (icatibant/ecallantide) may be needed. Pre-existing mast cell disease (mastocytosis) worsens anaphylaxis severity."
    difficulty: medium
    tags: [beta-blockers anaphylaxis, glucagon, ACE inhibitor angioedema, anaphylaxis management, emergency medicine]
  - front: "What is hereditary angioedema (HAE) and how is it differentiated from anaphylactic angioedema?"
    back: "HAE: C1 inhibitor deficiency causing recurrent angioedema without urticaria, triggered by stress/trauma/estrogens — NOT responsive to epinephrine, antihistamines, or steroids; treat with C1-INH concentrate, icatibant, or ecallantide\n\nHAE Type I (85%): low C1-INH level and function; Type II (15%): normal level, reduced function; Type III: estrogen-sensitive, normal C1-INH. Laboratory: low C4 (consumed even between attacks), low C1-INH level/function. Laryngeal involvement can cause death. Prophylaxis: tranexamic acid, attenuated androgens, C1-INH concentrate."
    difficulty: hard
    tags: [hereditary angioedema, HAE, C1 inhibitor, icatibant, angioedema, emergency medicine]
  - front: "What is epinephrine dosing for anaphylaxis?"
    back: "IM epinephrine 0.3-0.5mg (1:1000) in anterolateral thigh. Repeat q5-15min. Children: 0.01mg/kg (max 0.3mg)\n\nNEVER delay epinephrine. IV epi only if refractory + IV access (1:10,000 dilution). Adjuncts: IV fluids, antihistamines, steroids, salbutamol. Observe 4-6h (biphasic reaction risk). Prescribe EpiPen on discharge."
    difficulty: medium
    tags: [anaphylaxis, epinephrine]
  - front: "What is the first-line treatment and correct dosing for anaphylaxis?"
    back: "Epinephrine 0.3-0.5 mg IM (1:1000) anterolateral thigh. Peds: 0.01 mg/kg max 0.3mg. Repeat q5-15min. NO absolute contraindication to epi in anaphylaxis\n\nEpi IM is the ONLY first-line. IV epi 1-5 mcg/min for refractory shock only. Delay in epi is primary risk factor for death. Per Canadian Allergy and CPS guidelines always give before H1/H2 blockers or steroids."
    difficulty: hard
    tags: [anaphylaxis, epinephrine]
  - front: "What are the WAO/EAACI diagnostic criteria for anaphylaxis?"
    back: "(1) Skin/mucosal + respiratory OR hypotension after likely allergen. (2) 2+ organ systems after likely allergen. (3) Hypotension after KNOWN allergen. Any one criterion sufficient\n\nSkin findings absent in ~20%. Tryptase (draw within 1-2h, compare baseline at >24h) confirms mast cell degranulation. Anaphylaxis is a clinical diagnosis - never delay treatment for investigations."
    difficulty: hard
    tags: [anaphylaxis, diagnostic criteria]
  - front: "What is a biphasic reaction in anaphylaxis and what observation period is recommended?"
    back: "Recurrence of symptoms 1-72h after resolution without re-exposure (1-20% incidence). Minimum observation: 4-6h. High-risk (severe, multiple epi doses, asthma): 8-12h or admit\n\nRisk factors for biphasic: severe initial presentation, delayed epinephrine, oral allergen exposure. Methylprednisolone 1-2 mg/kg given to reduce biphasic risk (limited evidence). Discharge with 2 EpiPens and allergist referral."
    difficulty: medium
    tags: [biphasic, anaphylaxis, observation]
  - front: "How is refractory anaphylaxis (not responding to IM epinephrine) managed?"
    back: "IV epinephrine infusion 1-5 mcg/min, aggressive IVF 1-2L NS, nebulized salbutamol, glucagon 1-5mg IV if on beta-blocker, vasopressin for refractory hypotension\n\nKeep patient SUPINE with legs elevated - upright positioning causes empty ventricle syndrome and cardiac arrest. Beta-blocked patients: glucagon bypasses beta receptors. Consider ECMO for refractory cardiovascular collapse."
    difficulty: hard
    tags: [refractory anaphylaxis, epinephrine infusion]
  - front: "What mandatory prescriptions and instructions are given at anaphylaxis discharge?"
    back: "2 epinephrine auto-injectors, written action plan, MedicAlert recommendation, allergist referral, trigger avoidance education, return precautions for biphasic reaction\n\nEpiPen Jr 0.15mg (15-30kg), EpiPen 0.3mg (>30kg). 2 devices because second dose may be needed before EMS. Teach: epi FIRST not antihistamines. Provincial formulary coverage varies across Canada."
    difficulty: medium
    tags: [anaphylaxis, EpiPen, discharge]
  - front: "What are the most common anaphylaxis triggers in Canadian children vs adults?"
    back: "Children: food (peanut, tree nut, milk, egg, shellfish). Adults: drugs (penicillin, NSAIDs), Hymenoptera stings. Perioperative: NMBAs. Idiopathic ~20%\n\nHealth Canada mandates labeling of 11 priority allergens. Prevalence 1-2% lifetime. Food allergy prevalence increasing. Latex allergy declining with non-latex gloves. Cofactors (exercise, alcohol, NSAIDs) lower anaphylaxis threshold."
    difficulty: medium
    tags: [anaphylaxis, allergens, Canada]
  - front: "What is the role of antihistamines and corticosteroids in anaphylaxis?"
    back: "ADJUNCTS ONLY. H1 (diphenhydramine 25-50mg) + H2 (ranitidine 50mg). Steroids (methylprednisolone 125mg IV) may reduce biphasic risk (4-6h onset). Neither replaces epinephrine\n\nDangerous common error: treating with antihistamines alone. H1/H2 only help skin symptoms, no effect on bronchospasm or hypotension. Steroids too slow for acute phase. Canadian guidelines emphasize epi first always."
    difficulty: medium
    tags: [antihistamines, steroids, anaphylaxis]
  - front: "How does immune (IgE) anaphylaxis differ from non-immune anaphylaxis?"
    back: "Immune: requires prior sensitization, IgE-mediated mast cell degranulation. Non-immune (formerly anaphylactoid): direct mast cell activation (radiocontrast, opioids, vancomycin). First-exposure possible. Treatment IDENTICAL\n\nAnaphylactoid term being phased out. Radiocontrast premedication: prednisone 50mg at 13/7/1h before + diphenhydramine + low-osmolar contrast. Non-immune reactions dose-dependent and often less severe than IgE-mediated."
    difficulty: medium
    tags: [anaphylaxis, non-immune]
  - front: "What is food-dependent exercise-induced anaphylaxis (FDEIA)?"
    back: "Anaphylaxis during exercise 2-6h after specific food (wheat, shellfish most common). Neither food alone nor exercise alone triggers it. Prevention: avoid trigger food 4-6h pre-exercise, carry EpiPen\n\nCofactors lowering threshold: NSAIDs, alcohol, heat, menstruation, sleep deprivation. Most common subtype of exercise-induced anaphylaxis. Diagnosis by clinical history. Supervised exercise challenge in specialized centers only."
    difficulty: medium
    tags: [FDEIA, exercise-induced anaphylaxis]
  - front: "What is Kounis syndrome and why is it important in anaphylaxis?"
    back: "Allergic acute coronary syndrome: mast cell mediators cause coronary vasospasm (Type I), plaque rupture (Type II), or stent thrombosis (Type III). Check troponin and ECG for ST changes\n\nOccurs during anaphylaxis, especially in patients with pre-existing CAD. Treatment: epinephrine for anaphylaxis + cardiology consult for ACS management. Avoid beta-blockers in anaphylaxis context. Consider in any anaphylaxis patient with chest pain."
    difficulty: hard
    tags: [Kounis syndrome, anaphylaxis, ACS]
  - front: "What is hereditary angioedema (HAE) and what is its treatment?"
    back: "C1 inhibitor deficiency causing recurrent non-urticarial swelling of skin/mucosa (eyes, lips, tongue, larynx). 80% have positive family history; 25% die from laryngeal edema. Prophylaxis: danazol or stanozolol. Acute attacks: epinephrine pen as temporizing measure.\n\nHAE is distinguished from allergic angioedema by absence of urticaria, C4 levels low between attacks, and C1-inhibitor deficiency. Triggers include minor trauma, emotional upset, and temperature changes. C1-inhibitor concentrate, icatibant, or fresh frozen plasma are treatment options."
    difficulty: hard
    tags: [hereditary angioedema, C1 inhibitor, laryngeal edema, danazol]
  - front: "What are the diagnostic criteria for anaphylaxis?"
    back: "1. Acute onset with skin/mucosal involvement PLUS respiratory compromise OR hypotension/end-organ dysfunction. 2. Two or more of the following after exposure to a likely allergen: skin/mucosal involvement, respiratory compromise, hypotension, persistent GI symptoms. 3. Hypotension after exposure to a KNOWN allergen.\n\nAnaphylaxis is a severe, life-threatening systemic hypersensitivity reaction mediated by IgE. Diagnosis is clinical and should be considered even without meeting all criteria in patients with prior anaphylaxis. Life-threatening differentials include asthma and septic shock. Angioedema alone does not meet criteria."
    difficulty: medium
    tags: [anaphylaxis, diagnostic criteria, hypersensitivity]
  - front: "What are the most common triggers for anaphylaxis?"
    back: "Foods (nuts, shellfish), insect stings, drugs (penicillin, NSAIDs, ACE inhibitors), radiographic contrast media, blood products, latex.\n\nFood is the most common trigger in children, while medications are more common in adults. Latex allergy is particularly relevant in healthcare workers and patients with spina bifida. Idiopathic (exercise-induced) anaphylaxis accounts for a significant minority of cases."
    difficulty: easy
    tags: [anaphylaxis, triggers, allergens]
  - front: "What is the first-line treatment for anaphylaxis, and what is the correct dose and route?"
    back: "Epinephrine (1:1000) 0.3–0.5 mg IM in the anterolateral thigh. Early epinephrine is lifesaving with no absolute contraindications. Pediatric dose: 0.01 mg/kg IM up to 0.5 mg.\n\nEpinephrine reverses vasodilation (alpha-1 effect) and bronchospasm (beta-2 effect), and inhibits further mediator release (beta-2). Intramuscular administration in the anterolateral thigh achieves the fastest peak serum levels. Delay in epinephrine administration is associated with fatal outcomes."
    difficulty: easy
    tags: [anaphylaxis, epinephrine, treatment, emergency]
  - front: "How should anaphylaxis be treated in a patient on beta-blockers who does not respond to epinephrine?"
    back: "Glucagon, as beta-blockers prevent the chronotropic and inotropic effects of epinephrine. Glucagon acts via a non-adrenergic pathway to increase heart rate and contractility.\n\nBeta-blockers competitively antagonize the beta-adrenergic effects of epinephrine. Glucagon bypasses the beta-receptor and directly stimulates adenylate cyclase, providing an alternative pathway for cardiovascular rescue in refractory anaphylaxis. Larger volumes of IV crystalloid are also typically required."
    difficulty: hard
    tags: [anaphylaxis, beta-blocker, glucagon, refractory]
  - front: "What additional medications are used in severe anaphylaxis beyond epinephrine?"
    back: "Antihistamine (diphenhydramine 50 mg IV or cetirizine 10 mg IV), glucocorticoids (methylprednisolone 125–250 mg IV or prednisone 40–60 mg PO), salbutamol via MDI/nebulizer for bronchospasm, large volumes of IV crystalloid, may require intubation for airway edema.\n\nAntihistamines and corticosteroids are adjunct treatments — they do not replace epinephrine and do not act quickly enough to treat the acute reaction. Corticosteroids may help prevent the biphasic reaction (second phase up to 72 hours later). Second-generation H1 antagonists (cetirizine) are preferred as they are less sedating than diphenhydramine."
    difficulty: medium
    tags: [anaphylaxis, antihistamine, corticosteroid, salbutamol]
  - front: "What is the biphasic reaction in anaphylaxis, and how long should patients be observed?"
    back: "A second-phase anaphylactic reaction that can occur up to 72 hours after initial resolution. Patients should be observed until symptoms fully resolve and vital signs normalize, especially after severe anaphylaxis or if >1 dose of epinephrine was required.\n\nThe biphasic reaction is thought to occur in 1–20% of anaphylaxis cases and can be as severe as the initial reaction. Current evidence does not support routine prolonged observation in all anaphylaxis cases, but local practices and severity guide observation duration. All patients need an epinephrine auto-injector on discharge."
    difficulty: medium
    tags: [anaphylaxis, biphasic, observation, discharge]
  - front: "What are the indications and dosing for epinephrine in the ED (anaphylaxis, cardiac arrest, bradycardia)?"
    back: "Anaphylaxis: 0.3–0.5 mg IM (max 1 mg/dose). Cardiac arrest (ACLS): 1 mg IV q3–5 min. Bradycardia (ACLS): 2–10 mcg/min IV infusion. Hypotension: infusion per protocol.\n\nIM epinephrine in the anterolateral thigh is the first-line treatment for anaphylaxis, providing faster absorption than subcutaneous injection. In cardiac arrest, epinephrine provides alpha-1 mediated vasoconstriction improving coronary and cerebral perfusion pressure during CPR. Dosing differences reflect different mechanisms of action needed."
    difficulty: medium
    tags: [epinephrine, anaphylaxis, ACLS, cardiac arrest, bradycardia, emergency medicine]
