# Endocrinology (Endocrinology) - generated from srs-mccqe1
cards:
  - front: "How do you distinguish central diabetes insipidus from nephrogenic diabetes insipidus?"
    back: "Both present with large volumes of dilute urine (>3 L/day) and polydipsia. Fluid deprivation test differentiates DI from psychogenic polydipsia (urine remains dilute in DI). Desmopressin (DDAVP) challenge distinguishes the types: central DI concentrates urine with DDAVP; nephrogenic DI does not respond to DDAVP.\n\nCentral DI is caused by insufficient ADH (pituitary surgery, tumours, idiopathic). Nephrogenic DI is caused by renal resistance to ADH (lithium, hypercalcemia, hypokalemia). Treatment: central = desmopressin; nephrogenic = solute restriction + thiazide diuretics."
    difficulty: medium
    tags: [endocrinology, diabetes insipidus, DDAVP, nephrology]
  - front: "What is the most common cause of hypercalcemia in a healthy outpatient, and when is surgery indicated?"
    back: "Primary hyperparathyroidism (most commonly due to a solitary parathyroid adenoma). Surgery is recommended for symptomatic patients or asymptomatic patients meeting any of: serum Ca >0.25 mmol/L above upper limit, skeletal involvement (fracture, BMD T-score <-2.5), renal involvement (eGFR <60, nephrolithiasis, hypercalciuria), or age <50.\n\nPrimary hyperparathyroidism presents with elevated PTH and calcium. In contrast, malignancy is the most common cause of hypercalcemia in hospitalized patients. Asymptomatic patients not meeting surgical criteria can be monitored with annual serum calcium, eGFR, and BMD every 1-2 years."
    difficulty: medium
    tags: [endocrinology, hyperparathyroidism, hypercalcemia, calcium homeostasis]
  - front: "What is myxedema coma, and what is the emergency treatment?"
    back: "Myxedema coma is severe decompensated hypothyroidism with hallmark features of decreased mental status and hypothermia, plus hyponatremia, hypotension, hypoglycemia, and bradycardia. Emergency treatment: ICU admission, hydrocortisone 100 mg q8h (for possible concurrent adrenal insufficiency), L-thyroxine 0.2-0.5 mg IV loading dose then 0.1 mg IV daily, passive rewarming, IV dextrose, vasopressors.\n\nCorticosteroids must be given before or with thyroid hormone replacement because treating hypothyroidism increases cortisol metabolism, which can precipitate adrenal crisis in patients with concurrent adrenal insufficiency."
    difficulty: hard
    tags: [endocrinology, myxedema coma, hypothyroidism, endocrine emergency]
  - front: "What is the sick euthyroid syndrome (non-thyroidal illness), and should thyroid hormone replacement be given?"
    back: "Sick euthyroid syndrome is altered thyroid hormone metabolism during severe illness, trauma, or starvation. Labs show initially low free T3, then low TSH, and in severe illness, low free T4. TSH may transiently rise during recovery. Thyroid hormone replacement has NOT been shown to be beneficial; treat the underlying disease.\n\nThis syndrome may be protective by reducing tissue catabolism during illness. It is important to distinguish from true hypothyroidism. Thyroid function tests normalize once the patient recovers, often with a transient TSH elevation."
    difficulty: medium
    tags: [endocrinology, sick euthyroid, thyroid, critical care]
  - front: "For Type 1 diabetes, what is the estimated total daily insulin requirement, and how is it distributed in a basal-bolus regimen?"
    back: "Estimated total insulin requirement is 0.5-0.7 U/kg/day. In a basal-bolus (MDI) regimen: 40% given as basal insulin at bedtime, and the remaining 60% divided equally (20% each) as bolus insulin before breakfast, lunch, and dinner.\n\nBasal insulin (glargine, detemir, degludec) provides a steady baseline, while rapid-acting bolus insulin (aspart, lispro, glulisine) covers mealtime glucose spikes. Continuous subcutaneous insulin infusion (insulin pump) is an alternative that may be paired with continuous glucose monitoring."
    difficulty: easy
    tags: [endocrinology, type 1 diabetes, insulin, basal-bolus regimen]
  - front: "A 52-year-old obese man with newly diagnosed type 2 diabetes has an HbA1c of 8.5% (target <7%). According to Canadian guidelines, what is the first-line pharmacotherapy and what additional agent class should be considered if he has established atherosclerotic cardiovascular disease?"
    back: "First-line: metformin. If ASCVD is present, add a GLP-1 receptor agonist (e.g., liraglutide, semaglutide) or SGLT2 inhibitor (e.g., empagliflozin) for cardiorenal benefit.\n\nMetformin remains the cornerstone of T2DM management. Canadian guidelines recommend adding agents with demonstrated cardiorenal benefits (GLP-1 RA or SGLT2i) in patients with ASCVD, CKD, or heart failure, independent of glycemic control."
    difficulty: medium
    tags: [endocrinology, diabetes, pharmacology, cardiovascular, family-medicine]
  - front: "What are the SMART goals mnemonic components for optimal diabetes management?"
    back: "S - Smoking cessation, M - Medication (ACEi/ARB, statin, ASA), A - A1C <7%, R - Risk factor modification (BP <130/80), T - Targets (LDL <2 mmol/L if treating).\n\nThe SMART mnemonic helps organize the comprehensive approach to diabetes care beyond glycemic control, including cardiovascular risk factor management, which is essential since CVD is the leading cause of death in diabetic patients."
    difficulty: easy
    tags: [endocrinology, diabetes, family-medicine, preventive-medicine]
  - front: "A 68-year-old woman had a wrist fracture after a fall from standing height. She has a BMI of 19 and a family history of hip fracture. What screening tool should be used and what is the recommended pharmacotherapy threshold?"
    back: "Use FRAX (preferred) or CAROC tool with BMD to calculate 10-year fracture risk. Pharmacotherapy is suggested if 10-year fracture risk >20% OR T-score <-2.5 with age >70.\n\nKey osteoporosis risk factors include prior fragility fracture after age 40, glucocorticoid use, parental hip fracture, BMI <20, smoking, and alcohol >3 drinks/day. All patients need vitamin D (800-2000 IU/day if >50) and calcium (1200 mg/day)."
    difficulty: medium
    tags: [endocrinology, osteoporosis, family-medicine, screening]
  - front: "What are the indications for SGLT2 inhibitors in diabetic patients beyond glycemic control?"
    back: "SGLT2 inhibitors (canagliflozin, dapagliflozin, empagliflozin) are indicated for cardiorenal benefit in patients with: ASCVD, heart failure (especially HFrEF), and chronic kidney disease, independent of glycemic targets.\n\nSGLT2 inhibitors reduce hospitalization for heart failure and slow CKD progression. They should be initiated if eGFR is adequate (varies by agent). Key side effects include genital mycotic infections and euglycemic diabetic ketoacidosis."
    difficulty: medium
    tags: [endocrinology, diabetes, cardiology, nephrology, pharmacology]
  - front: "What is the approach to acute hypercalcemia/hypercalcemic crisis?"
    back: "1) IV NS 4-6L/24h (FLUIDS first). 2) Calcitonin 4IU/kg SC q12h (rapid onset 4-6h, works only 48h). 3) Bisphosphonate IV (treatment of choice — zoledronic acid 4mg or pamidronate 60-90mg; effect in 24-48h). 4) Loop diuretic only if hypervolemic.\n\nHypercalcemia is defined as corrected Ca >2.6mmol/L. Severe (>3.5mmol/L) requires urgent treatment. The two most common causes are primary hyperparathyroidism (outpatient) and malignancy (inpatient). Corrected Ca = measured Ca + 0.02 × (40 - albumin)."
    difficulty: medium
    tags: [endocrinology, hypercalcemia, emergency management]
  - front: "What are the symptoms of hypercalcemia using the classic mnemonic?"
    back: "'Bones, stones, groans, and psychiatric overtones' — Bones (bone pain, fractures), Stones (nephrolithiasis, renal failure), Groans (constipation, nausea, vomiting, PUD, pancreatitis), Psychiatric overtones (depression, confusion, psychosis).\n\nSymptoms depend on absolute Ca value and rate of rise. Additional features include shortened QT interval, polyuria (nephrogenic DI), hypotonia, and weakness. Hypercalcemic crisis (>4mmol/L) presents with oliguria and mental status changes progressing to coma."
    difficulty: easy
    tags: [endocrinology, hypercalcemia]
  - front: "What are Chvostek's sign and Trousseau's sign, and what condition do they indicate?"
    back: "Chvostek's sign: tapping CN VII produces facial muscle contraction. Trousseau's sign: blood pressure cuff inflation above systolic for 3 minutes produces carpal spasm. Both indicate hypocalcemia.\n\nTetany is the hallmark of hypocalcemia. It ranges from mild (perioral numbness, paresthesia) to severe (carpopedal spasm, laryngospasm, seizures). Must treat concurrent hypomagnesemia or calcium will not normalize."
    difficulty: easy
    tags: [endocrinology, hypocalcemia, physical exam]
  - front: "What is the most common cause of hypocalcemia following thyroidectomy?"
    back: "Iatrogenic hypoparathyroidism from inadvertent damage to or removal of parathyroid glands. This is permanent in <3% of surgeries.\n\nTreatment of hypoparathyroidism-induced hypocalcemia requires 1,25 vitamin D (calcitriol) for GI absorption of calcium since PTH is needed for renal 1-alpha-hydroxylation. The goal is to raise Ca to low-normal (2.0-2.1 mmol/L) to maximize residual PTH stimulation."
    difficulty: easy
    tags: [endocrinology, hypocalcemia, surgery, thyroidectomy]
  - front: "What is the definition of osteoporosis by BMD T-score?"
    back: "T-score ≤ -2.5. Osteopenia (low bone mass): T-score between -1.0 and -2.5.\n\nBMD is measured at hip and lumbar spine by DEXA. 10-year fracture risk guides treatment: <15% unlikely to benefit from pharmacotherapy; 15-19.9% suggest starting therapy; >20% recommend therapy. First-line treatments include bisphosphonates and denosumab."
    difficulty: easy
    tags: [endocrinology, metabolic bone disease, osteoporosis]
  - front: "What are the first-line pharmacologic treatments for osteoporosis?"
    back: "Bisphosphonates (alendronate PO, risedronate PO, zoledronic acid IV) and denosumab (RANKL inhibitor) — all Grade A evidence for prevention of hip, nonvertebral, and vertebral fractures.\n\nDenosumab should not be abruptly stopped due to risk of multiple vertebral fractures from increased bone turnover on discontinuation. Teriparatide (PTH analogue) and romosozumab (anti-sclerostin) are used for 12-24 months followed by anti-resorptive therapy."
    difficulty: medium
    tags: [endocrinology, osteoporosis, pharmacology]
  - front: "What are the clinical features and classic radiologic findings of Paget's disease of bone?"
    back: "Usually asymptomatic (incidental elevated ALP with normal LFTs). Features: severe bone pain, skeletal deformities (bowed tibias, kyphosis), frequent fractures. Radiology: osteolytic lesions, cortical thickening, pseudofractures. 'Cotton wool' appearance of skull.\n\nPaget's affects 3% of population, 10% of those >80. It involves increased osteoclastic activity followed by osteoblastic response producing structurally abnormal bone. Complications include osteosarcoma (1-3%), cranial nerve compression, and high-output CHF."
    difficulty: medium
    tags: [endocrinology, metabolic bone disease, Pagets disease]
  - front: "What are the diagnostic criteria for diabetes mellitus?"
    back: "Any one of: FPG ≥7.0 mmol/L, A1c ≥6.5%, 2h PG in 75g OGTT ≥11.1 mmol/L, or random PG ≥11.1 mmol/L with symptoms. Without symptoms, a confirmatory test on another day is required.\n\nPre-diabetes criteria: IFG 6.1-6.9, IGT 7.8-11.0 on OGTT, or A1c 6.0-6.4%. A1c is not used for diagnosis of suspected T1DM, children, adolescents, or pregnant women. Lifestyle modifications decrease progression to DM by 58%, metformin by 31%."
    difficulty: easy
    tags: [endocrinology, diabetes mellitus, diagnosis]
  - front: "Compare Type 1 and Type 2 diabetes mellitus by onset, pathophysiology, and acute complications."
    back: "T1DM: usually <30yr, autoimmune β-cell destruction, absolute insulin deficiency, DKA. T2DM: usually >40yr, insulin resistance + impaired secretion, accounts for 90% of DM, HHS (hyperosmolar hyperglycemic state).\n\nT1DM is associated with HLA-DR3/DR4 and has 30-40% monozygotic twin concordance. T2DM has greater heritability (70-90% twin concordance) and is polygenic. Risk factors for T2DM include obesity, family history, ethnicity, and metabolic syndrome components."
    difficulty: easy
    tags: [endocrinology, diabetes mellitus, pathophysiology]
  - front: "What is the A1c target for most patients with diabetes, and when might higher targets be acceptable?"
    back: "Target A1c <7.0% for most T1DM and T2DM patients. Higher targets (7.1-8.5%) may be considered for limited life expectancy, greater functional dependency, or history of recurrent severe hypoglycemia. A1c <6.0% may cause harm (ACCORD trial).\n\nA1c measures glycemic control over 3 months and should be measured every 3-6 months. More intensive targets (<6.5%) may reduce nephropathy and retinopathy if achieved without significant hypoglycemia. Time in range (3.9-10 mmol/L) should be >70%."
    difficulty: medium
    tags: [endocrinology, diabetes mellitus, glycemic targets]
  - front: "What is the first-line medication for T2DM and what are its key advantages?"
    back: "Metformin. Advantages: A1c reduction ~1.5%, weight neutral/loss, negligible hypoglycemia risk as monotherapy, low cost, cardiovascular benefit (UKPDS 34 showed reduced all-cause mortality).\n\nMetformin sensitizes peripheral tissues to insulin and decreases hepatic glucose production via AMPK activation. Contraindicated in severe renal dysfunction (eGFR <15), moderate-severe liver dysfunction, and cardiac dysfunction. Main side effects are GI upset and rare lactic acidosis."
    difficulty: easy
    tags: [endocrinology, diabetes mellitus, pharmacology, metformin]
  - front: "What are the key differences between DKA and HHS?"
    back: "DKA: T1DM, absolute insulin deficiency, BG 14-55, metabolic acidosis with ketosis, Kussmaul respirations. HHS: T2DM, relative insulin deficiency, BG 44-133, hyperosmolality without significant ketosis, more severe dehydration, altered LOC.\n\nIn DKA, the anion gap is the most important endpoint for monitoring resolution. In HHS, small amounts of insulin prevent ketosis by inhibiting lipolysis. HHS has more severe dehydration due to gradual onset and impaired fluid intake. Both require aggressive IV fluid resuscitation."
    difficulty: medium
    tags: [endocrinology, diabetes mellitus, DKA, HHS]
  - front: "What is the SAD MANS mnemonic for sick day management in diabetes?"
    back: "Hold the following medications when ill and unable to maintain fluid intake: Sulfonylureas, ACEIs, Diuretics/direct renin inhibitors, Metformin, ARBs, NSAIDs, SGLT2 inhibitors.\n\nThese medications should be held during acute illness with poor fluid intake or acute renal function decline to prevent complications such as hypoglycemia, AKI, and lactic acidosis. Patients should monitor blood glucose more frequently during illness."
    difficulty: medium
    tags: [endocrinology, diabetes mellitus, sick day management]
  - front: "What SGLT2 inhibitor benefits extend beyond glycemic control?"
    back: "Cardiovascular mortality reduction, CV outcomes benefit in patients with known CVD, renal protection, and weight loss. Rare side effects include euglycemic DKA, UTIs, and genital infections.\n\nSGLT2 inhibitors (canagliflozin, dapagliflozin, empagliflozin) work by inhibiting glucose reabsorption in the proximal renal tubule. They provide A1c reduction of 0.7-1.0% with negligible hypoglycemia risk as monotherapy. Contraindicated in severe renal impairment (eGFR <15)."
    difficulty: medium
    tags: [endocrinology, diabetes mellitus, pharmacology, SGLT2 inhibitors]
  - front: "What are the 8 I's precipitating DKA?"
    back: "Infection, Ischemia or Infarction, Iatrogenic (glucocorticoids), Intoxication, Insulin missed, Inflammation (pancreatitis, cholecystitis), Intraoperative/perioperative stress, Initial presentation (new T1DM diagnosis).\n\nDKA management: ABCs first, then IV NS (500mL/h x4h, then 250mL/h), insulin infusion (typically 0.1 U/kg/h), potassium replacement (watch for hypokalemia as insulin drives K intracellular), and monitoring of anion gap for resolution."
    difficulty: easy
    tags: [endocrinology, diabetes mellitus, DKA]
  - front: "What are the statin-indicated conditions in diabetes regardless of LDL level?"
    back: "Age >40, microvascular complications or diabetes >15 years duration AND age >30, or warrants therapy based on CCS Guidelines for Dyslipidemia.\n\nIn diabetes management, LDL target is <2.0mmol/L or 50% reduction. Blood pressure target is <130/80. ACEIs/ARBs are indicated regardless of BP in: clinical CVD, age >55 with additional CV risk factor, or microvascular complications."
    difficulty: medium
    tags: [endocrinology, diabetes mellitus, cardiovascular risk, dyslipidemia]
  - front: "What are the first-line statin alternatives for LDL lowering and when is each used?"
    back: "Ezetimibe: add to statin when LDL not at target. Anti-PCSK9 antibodies (evolocumab, alirocumab): add to maximally tolerated statin + ezetimibe when still not at target, especially in familial hypercholesterolemia or ASCVD.\n\nStatins inhibit HMG-CoA reductase, the rate-limiting step in cholesterol biosynthesis. Major side effects include elevated liver enzymes, myositis, and rhabdomyolysis (increased risk with fibrate combination). IMPROVE-IT trial showed ezetimibe added to statins reduces cardiovascular events post-ACS."
    difficulty: medium
    tags: [endocrinology, dyslipidemia, pharmacology]
  - front: "Differentiate primary (hypergonadotropic) from secondary (hypogonadotropic) hypogonadism."
    back: "Primary: testicular failure, ↑LH/FSH, ↓testosterone. Causes: Klinefelter syndrome, cryptorchidism, orchitis. Secondary: hypothalamic-pituitary failure, ↓LH/FSH, ↓testosterone. Causes: Kallmann syndrome, prolactinoma, hemochromatosis.\n\nTestosterone deficiency syndrome requires clinical manifestations AND documented low total testosterone on 2 separate fasting morning samples. Testosterone replacement improves libido, muscle mass, strength, and bone mass but is contraindicated in prostate/breast cancer."
    difficulty: medium
    tags: [endocrinology, hypogonadism, reproductive endocrinology]
  - front: "What are the causes of gynecomastia (DOC TECH mnemonic)?"
    back: "Drugs (spironolactone, cimetidine, digoxin, ketoconazole), Obesity, Congenital (Klinefelter), Tumour (germ cell tumours), Excess estrogen (liver disease), Chronic disease (cirrhosis, CKD), Hyperthyroidism.\n\nPhysiologic gynecomastia has a trimodal distribution: neonatal, pubertal (46%, regresses in 90%), and ages 50-80 (>65%). It results from hormonal imbalance with increased estrogen or decreased androgen activity. Red flags suggesting breast cancer: unilateral, eccentric, hard/fixed mass."
    difficulty: easy
    tags: [endocrinology, gynecomastia]
  - front: "What paraneoplastic syndrome is associated with small cell lung cancer producing ectopic ACTH?"
    back: "Cushing's syndrome — presenting with weight gain in trunk/face, stretch marks, easy bruising, slow wound healing, acne, hirsutism.\n\nParaneoplastic syndromes are non-metastatic systemic effects triggered by antibodies cross-reacting with normal tissue or by production of physiologically active substances. SIADH is another common paraneoplastic syndrome of small cell lung cancer."
    difficulty: easy
    tags: [endocrinology, oncology, paraneoplastic syndrome]
  - front: "What is Lambert-Eaton myasthenic syndrome (LEMS) and what malignancy is it associated with?"
    back: "LEMS causes proximal limb muscle weakness due to antibodies interfering with acetylcholine release at the neuromuscular junction. It is associated with small cell lung cancer.\n\nLEMS differs from myasthenia gravis in that weakness improves with repeated use (vs. worsens in MG). Myasthenia gravis is associated with thymoma. Both are paraneoplastic autoimmune conditions affecting neuromuscular transmission."
    difficulty: medium
    tags: [endocrinology, neurology, paraneoplastic syndrome, LEMS]
  - front: "What are the clinical features of renal osteodystrophy and what are the four types of bone disease?"
    back: "Features: soft tissue calcifications, bone pain, fractures, pruritus, neuromuscular irritability. Four types: osteomalacia (low turnover + increased osteoid), adynamic bone disease (low turnover), osteitis fibrosa cystica (high turnover from secondary hyperPTH), mixed uremic osteodystrophy.\n\nRenal osteodystrophy is caused by hyperphosphatemia (inhibits 1,25(OH)2 vitamin D synthesis) and loss of renal mass (reduced 1-alpha-hydroxylase). Treatment includes phosphate restriction, calcium supplements, phosphate binders, and calcitriol with monitoring to avoid hypercalcemia."
    difficulty: hard
    tags: [endocrinology, nephrology, metabolic bone disease, renal osteodystrophy]
  - front: "What are the key findings differentiating vitamin D deficiency osteomalacia from other causes on labs?"
    back: "Vitamin D deficiency: ↓phosphate, ↓to normal calcium, ↑ALP, ↓calcitriol. Hypophosphatemia: ↓phosphate, normal calcium, ↑ALP. Proximal RTA: ↓phosphate, normal calcium, normal ALP with hyperchloremic metabolic acidosis.\n\nOsteomalacia is osteopenia with disordered calcification (rickets in children). Radiologic findings include Looser zones (pseudofractures), loss of vertebral body trabeculae, and changes from secondary hyperparathyroidism. Bone biopsy is gold standard but usually unnecessary."
    difficulty: hard
    tags: [endocrinology, metabolic bone disease, osteomalacia, vitamin D]
  - front: "What is the corrected sodium formula in DKA?"
    back: "Corrected sodium = current sodium + [0.3 × (current glucose - 5)]. For every increase in blood glucose by 10 mmol/L, sodium decreases by 3 mmol/L (pseudohyponatremia).\n\nIn DKA, hyperglycemia causes water shift to ECF, producing pseudohyponatremia. Total body potassium is depleted but serum K may be normal or elevated due to shift from ICF to ECF (lack of insulin, increased osmolality). Monitor K closely as insulin drives it intracellularly."
    difficulty: medium
    tags: [endocrinology, diabetes mellitus, DKA, electrolytes]
  - front: "What GLP-1 receptor agonists provide cardiovascular outcomes benefit, and what are their key contraindications?"
    back: "Liraglutide, semaglutide, dulaglutide provide CV mortality and outcomes benefit. Contraindications: T1DM, DKA, acute pancreatitis history, MEN2 syndrome, medullary thyroid carcinoma (personal/family history).\n\nGLP-1 agonists promote insulin release, suppress glucagon, slow gastric emptying, and promote weight loss. A1c reduction is high (~1.0%). Side effects include GI symptoms (nausea, diarrhea), increased HR, and rare pancreatitis. Negligible hypoglycemia risk as monotherapy."
    difficulty: medium
    tags: [endocrinology, diabetes mellitus, pharmacology, GLP-1 agonists]
  - front: "What is the SMART mnemonic for diabetes management goals?"
    back: "A1C <7%, BP <130/80, Cholesterol LDL-C <2 mmol/L if treating, Drugs (consider ACEI/ARB, statin, ASA), Exercise/Eating, Smoking cessation.\n\nThe SMART framework provides a comprehensive approach to diabetes management beyond glycemic control. Cardiovascular risk reduction is critical since DM patients are twice as likely to die prematurely."
    difficulty: easy
    tags: [endocrinology, diabetes, management]
  - front: "When should T2DM screening begin and at what interval?"
    back: "FBG or HbA1C in everyone age ≥40 every 3 years; more frequent/earlier if ≥1 risk factor present.\n\nRisk factors for earlier screening include first-degree relative with DM, obesity, HTN, dyslipidemia, membership in high-risk populations (Indigenous, Hispanic, Asian, African descent), and prior gestational diabetes."
    difficulty: easy
    tags: [endocrinology, diabetes, screening]
  - front: "What is the first-line drug for T2DM, and when should insulin be started at diagnosis?"
    back: "Metformin is first-line. Start insulin + metformin at diagnosis if symptomatic hyperglycemia and/or metabolic decompensation is present.\n\nIf A1C is >1.5% above target, start metformin plus a second agent. For patients with ASCVD, HF with reduced EF, or CKD, agents with cardiorenal benefits (GLP-1 RA, SGLT2i) should be considered."
    difficulty: medium
    tags: [endocrinology, diabetes, pharmacology]
  - front: "Which diabetes medications have demonstrated cardiorenal benefits?"
    back: "SGLT2 inhibitors (empagliflozin, dapagliflozin, canagliflozin) and GLP-1 receptor agonists (liraglutide, semaglutide, dulaglutide).\n\nThese agents reduce major adverse cardiovascular events (MACE) and/or hospitalization for heart failure. They are preferred second-line agents in patients with ASCVD, CKD, or HF with reduced ejection fraction."
    difficulty: medium
    tags: [endocrinology, diabetes, pharmacology, cardiology]
  - front: "What causes should be suspected when HTN is refractory to ≥3 drugs?"
    back: "Primary hyperaldosteronism (suspect with spontaneous hypokalemia or profound diuretic-induced hypokalemia <3.0 mmol/L). Also consider renovascular HTN, pheochromocytoma, and Cushing's syndrome.\n\nScreening for hyperaldosteronism uses morning plasma aldosterone and renin levels (aldosterone-to-renin ratio). Discontinue aldosterone antagonists, ARBs, beta-blockers, and clonidine prior to testing."
    difficulty: hard
    tags: [endocrinology, hypertension, secondary HTN]
  - front: "When should pharmacotherapy for osteoporosis be initiated?"
    back: "When 10-year fracture risk is >20% (using FRAX or CAROC), OR T-score <-2.5 and age >70, OR after a fragility fracture.\n\nAll adults should receive balance/muscle-strengthening exercises twice weekly, calcium-rich foods, and minimum vitamin D 400 IU daily. Recommended calcium: 1000 mg/day (19-50 yr), 1200 mg/day (>50 yr)."
    difficulty: medium
    tags: [endocrinology, osteoporosis, preventive medicine]
  - front: "What is Whipple's triad for insulinoma?"
    back: "Symptomatic fasting hypoglycemia, serum glucose <2.8 mmol/L, relief of symptoms when glucose is administered.\n\nInsulinoma is the most common pancreatic endocrine neoplasm; 10% associated with MEN1 syndrome. Only 10% are malignant. Investigations show decreased glucose with elevated insulin and C-peptide. Tumours are evenly distributed throughout the pancreas."
    difficulty: easy
    tags: [endocrinology, surgery, insulinoma]
  - front: "What characterizes Zollinger-Ellison syndrome?"
    back: "Gastrin-secreting tumour (gastrinoma) causing massive gastric acid hypersecretion with multiple peptic ulcers in atypical locations refractory to antacid therapy, diarrhea, and abdominal pain. Serum gastrin usually >1000 pg/mL.\n\n50% of gastrinomas are malignant. Associated with MEN1. 70-90% found in Passaro's triangle (head of pancreas, 2nd portion of duodenum, confluence of cystic/CBD). Treatment: surgical resection + high-dose PPI + octreotide."
    difficulty: medium
    tags: [endocrinology, surgery, gastrinoma, Zollinger-Ellison]
  - front: "What is the diagnostic workup for an adrenal incidentaloma?"
    back: "CT (size >4-6cm suggests carcinoma). Functional studies: plasma metanephrines (pheochromocytoma), 24h urine cortisol or 1mg dexamethasone suppression test (Cushing's), AM aldosterone/renin ratio (aldosteronoma). FNA biopsy is NOT appropriate in most cases.\n\n70-80% are benign adenomas. Functional tumours require resection. Non-functional tumours >4cm should be considered for resection; <4cm can be followed with imaging at 6-12 months. >30% of pheochromocytomas are related to genetic syndromes."
    difficulty: medium
    tags: [endocrinology, surgery, adrenal, incidentaloma]
  - front: "What is the starting dose and titration strategy for basal insulin added to anti-hyperglycemic agents in T2DM (Diabetes Canada 2018)?"
    back: "Start at 10 U at bedtime (lower for lean patients <50 kg). Increase by 1 U every night until fasting BG reaches target of 4–7 mmol/L. Most patients need 40–50 units/day; there is no maximum dose.\n\nBasal insulin titration targets fasting BG of 4–7 mmol/L. If fasting hypoglycemia occurs, reduce basal dose; if daytime hypoglycemia occurs, reduce oral anti-hyperglycemic agents (especially secretagogues)."
    difficulty: easy
    tags: [diabetes, insulin, T2DM, basal insulin, titration]
  - front: "In a 100 kg patient starting a basal-bolus insulin regimen, calculate the total daily insulin (TDI), basal dose, and each mealtime bolus dose."
    back: "TDI = 0.5 U/kg × 100 kg = 50 U. Basal = 40% of TDI = 20 U at bedtime. Bolus = 60% of TDI = 30 U total → 10 U with each of 3 meals.\n\nThe basal-bolus formula is TDI = 0.3–0.5 U/kg; 40% basal, 60% prandial. Insulin secretagogues are stopped when bolus insulin is added; metformin is continued."
    difficulty: medium
    tags: [diabetes, insulin, basal-bolus, T2DM, dose calculation]
  - front: "What is the Correction Factor (CF) for insulin, and how is it applied when BG is between 8 and (8 + CF)?"
    back: "CF = 100 ÷ Total Daily Dose (TDD). It represents the change in BG per unit of insulin. If BG is between 8 and (8 + CF), give one additional unit of insulin.\n\nThe CF-based sliding scale guides correction boluses. BG <4 mmol/L: give 15 g rapid-acting carbs and recheck in 15 min. BG 4–8: no additional insulin. Each CF above 8 mmol/L adds one correction unit."
    difficulty: medium
    tags: [diabetes, insulin, correction factor, hyperglycemia]
  - front: "What are the key risks of Continuous Subcutaneous Insulin Infusion (CSII) pump therapy?"
    back: "Risk of DKA if the pump is inadvertently disconnected or malfunctions. There is no subcutaneous depot of long-acting insulin, so interruption quickly leads to insulin deficiency.\n\nCSII delivers a continuous basal dose of rapid-acting insulin analogue (aspart, glulisine, or lispro). Improved quality of life and flexibility are benefits, but pump failure can precipitate DKA rapidly. Insulin pump coverage for T1DM varies by province in Canada."
    difficulty: easy
    tags: [diabetes, insulin pump, CSII, DKA, T1DM]
  - front: "What is the key pathophysiologic difference between DKA and HHS regarding ketosis?"
    back: "In DKA: complete insulin deficiency allows uninhibited lipolysis → FFA → ketoacids → metabolic acidosis. In HHS: a small amount of residual insulin inhibits lipolysis, preventing significant ketosis despite severe hyperglycemia.\n\nHHS is characterized by hyperglycemia (typically 44.4–133.2 mmol/L), hyperosmolality, and profound dehydration WITHOUT ketosis. DKA has anion gap metabolic acidosis; HHS does not unless a comorbid precipitant (e.g., lactic acidosis from MI) causes acidosis."
    difficulty: medium
    tags: [DKA, HHS, diabetes, ketosis, pathophysiology]
  - front: "What is pseudohyponatremia in DKA, and how is the corrected sodium calculated?"
    back: "Hyperglycemia shifts water from ICF to ECF, diluting serum sodium. For every 10 mmol/L rise in BG above normal, serum Na⁺ falls by approximately 3 mmol/L. Corrected Na⁺ = current Na⁺ + [0.3 × (current glucose − 5)].\n\nAccurate sodium assessment is critical in DKA management to guide choice of IV fluid (NS vs. 0.45% NaCl). Potassium balance is also important: there is total body K⁺ depletion despite potentially normal or elevated serum K⁺ due to extracellular shift."
    difficulty: hard
    tags: [DKA, pseudohyponatremia, corrected sodium, electrolytes]
  - front: "What are the clinical features that distinguish DKA from HHS on presentation?"
    back: "DKA: Kussmaul respirations, acetone breath, nausea/vomiting, abdominal pain, rapid onset. BG typically 14–55 mmol/L. HHS: insidious onset, no Kussmaul respirations (unless co-precipitant causes acidosis), decreased LOC/coma, severe dehydration. BG typically 44.4–133.2 mmol/L.\n\nHHS most commonly occurs in T2DM patients who are bedridden or have impaired fluid intake. The more gradual onset and prolonged duration lead to more severe dehydration than DKA. Mental status changes in HHS are driven by hyperosmolality."
    difficulty: medium
    tags: [DKA, HHS, clinical features, diabetes]
  - front: "What is the most important endpoint used to monitor resolution of metabolic acidosis in DKA?"
    back: "The anion gap (AG) is the most important endpoint to monitor resolution of metabolic acidosis in DKA — NOT blood glucose or serum ketone levels.\n\nSerum or urinary ketone tests (nitroprusside) detect acetone and acetoacetate but NOT β-hydroxybutyrate (BHB), the predominant ketone in DKA. As DKA improves, BHB converts to acetoacetate, causing apparent rise in ketones even as the patient improves. Therefore, the AG is the primary monitoring tool."
    difficulty: medium
    tags: [DKA, anion gap, monitoring, ketones]
  - front: "Describe the insulin and potassium management protocol in DKA treatment."
    back: "Do NOT start insulin if serum K⁺ <3.3 mmol/L — first give 40 mEq/L K⁺ replacement until K⁺ ≥3.3 mmol/L. Then maintain 0.1 U/kg/h regular insulin infusion. When K⁺ is 3.3–5.0 mmol/L, add KCl 10–40 mEq/L to keep K⁺ at 3.5–5 mEq/L.\n\nInsulin drives K⁺ into cells, worsening hypokalemia. Despite total body K⁺ depletion, serum K⁺ may appear normal or elevated initially. Once BG reaches 14 mmol/L, add D5W or D10W to prevent hypoglycemia while continuing insulin to close the anion gap."
    difficulty: hard
    tags: [DKA, insulin, potassium, treatment, electrolytes]
  - front: "When is sodium bicarbonate indicated in DKA management?"
    back: "HCO₃⁻ is indicated if pH <7.0 OR if there is hypotension, arrhythmia, or coma. Give 1 ampule (50 mmol) in 200 mL D5W over 1 hour, repeated q1–2h until pH ≥7.0. Do NOT give if pH >7.1 (risk of metabolic alkalosis).\n\nBicarbonate can also be given in life-threatening hyperkalemia. Routine bicarbonate use in DKA is not recommended because it may worsen intracellular acidosis, impair oxygen delivery, and cause paradoxical CSF acidosis."
    difficulty: medium
    tags: [DKA, bicarbonate, treatment, metabolic acidosis]
  - front: "What IV fluid strategy is used in HHS, and when is the switch from NS to 0.45% NaCl made?"
    back: "Start with 1–2 L/h NS if severe deficit (shock). Evaluate corrected serum Na⁺: if high or normal → switch to 0.45% NaCl (4–14 mL/kg/h); if low → maintain NS. Switch to D5W when BG reaches 13.9 mmol/L (250 mg/dL).\n\nHHS has less severe K⁺ depletion than DKA. Urinary electrolyte losses from osmotic diuresis are usually hypotonic, so switching to 0.45% NaCl once euvolemic is appropriate. Rate of fall of plasma osmolality should not exceed 3 mOsm/kg/h to prevent cerebral edema."
    difficulty: hard
    tags: [HHS, IV fluids, treatment, hyperglycemia]
  - front: "What is euglycemic DKA and in which populations should it be suspected?"
    back: "Euglycemic DKA is DKA with near-normal blood glucose levels. It should be suspected in: (1) pregnancy, and (2) patients using SGLT2 inhibitors.\n\nSGLT2 inhibitors promote glucosuria, which lowers blood glucose even in the presence of significant ketoacidosis. The normal BG may mask DKA, so clinicians must check for anion gap acidosis and ketones in any patient on SGLT2 inhibitors who presents unwell."
    difficulty: medium
    tags: [DKA, euglycemic DKA, SGLT2 inhibitors, pregnancy]
  - front: "How does the nitroprusside test for ketones fail during DKA treatment, and what is the clinical implication?"
    back: "The nitroprusside test detects acetone and acetoacetate but NOT β-hydroxybutyrate (BHB). As DKA is treated, BHB is converted to acetoacetate, causing serum/urine ketone levels to appear to RISE even though the patient is improving.\n\nThis can falsely suggest worsening DKA when the patient is actually responding to treatment. Clinicians should monitor the anion gap as the primary endpoint of DKA resolution rather than relying on ketone measurements."
    difficulty: medium
    tags: [DKA, ketones, nitroprusside, beta-hydroxybutyrate, laboratory]
  - front: "What are the macrovascular complications of diabetes mellitus and their relative risks?"
    back: "CAD (risk of MI is 3–5× higher), ischemic stroke (2–3× higher in men, 2–5× higher in women), and peripheral arterial disease (risk of foot gangrene 30× higher, risk of lower extremity amputation 15× higher).\n\nCAD is the leading cause of death in T2DM. Diabetes accelerates atherosclerosis. Most patients with DM are classified as high-risk for CAD. HbA1c is an independent predictor of stroke risk. Peripheral arterial disease manifests as intermittent claudication, intestinal angina, and foot ulceration."
    difficulty: easy
    tags: [diabetes, macrovascular, CAD, stroke, peripheral arterial disease]
  - front: "What BP target and lipid targets are recommended for macrovascular risk reduction in diabetes mellitus?"
    back: "BP target: <130/80 mmHg. Lipid target: LDL ≤2.0 mmol/L or >50% LDL reduction from baseline. Statins are indicated for patients with clinical CVD, age ≥40, or diabetes duration >15 years with age >30, or microvascular complications.\n\nTreatment also includes ACEI or ARB in high-risk patients, anti-hyperglycemic agents with cardiovascular benefit (SGLT2i/GLP-1 RAs), smoking cessation, healthy diet, and physical activity. Tight glycemic control is particularly beneficial in early DM (per ACCORD, UKPDS, DCCT studies)."
    difficulty: medium
    tags: [diabetes, macrovascular, blood pressure, lipids, statins, treatment]
  - front: "What is the most common cause of incident blindness in people of working age, and what are the two forms of diabetic retinopathy?"
    back: "Diabetic retinopathy is the most common cause of new-onset blindness in working-age people. Two forms: (1) Non-proliferative: microaneurysms, intraretinal hemorrhage, vascular tortuosity, vascular malformation; (2) Proliferative: abnormal new vessel growth.\n\nMacular edema (diffuse or focal vascular leakage at the macula) can occur in either form. Retinal capillary closure is a key pathologic feature. Glycemic control, lipid control, BP management, and smoking cessation delay onset and progression."
    difficulty: easy
    tags: [diabetic retinopathy, microvascular, diabetes, blindness]
  - front: "What are the ophthalmological screening intervals for diabetic retinopathy in T1DM vs T2DM?"
    back: "T2DM: annual eye exam beginning at diagnosis. T1DM: begin annual screening 5 years after diagnosis (for patients ≥15 years old). Follow-up interval should be tailored to severity of retinopathy.\n\nExamination must be performed through dilated pupils by an optometrist or ophthalmologist, regardless of whether the patient is symptomatic. Immediate referral after T2DM diagnosis; 5-year delay in T1DM reflects the rarity of retinopathy in the early years of disease."
    difficulty: easy
    tags: [diabetic retinopathy, screening, T1DM, T2DM, ophthalmology]
  - front: "What is the most common cause of renal failure in North America, and what is the earliest clinical sign of diabetic nephropathy?"
    back: "Diabetes mellitus-induced renal failure is the most common cause of renal failure in North America. Microalbuminuria (persistently elevated urinary albumin) is the earliest clinical sign.\n\nACR (albumin-to-creatinine ratio) is used to detect microalbuminuria. Diagnosis requires persistent elevated urinary albumin in 2 out of 3 urine samples over 3 months. 24-hour urine collection is the gold standard but difficult; random ACR is the practical screening tool."
    difficulty: easy
    tags: [diabetic nephropathy, microalbuminuria, ACR, renal failure, screening]
  - front: "What is the preferred treatment approach for diabetic nephropathy in T2DM according to current Canadian guidelines?"
    back: "For T2DM: use SGLT2 inhibitor first, followed by GLP-1 receptor agonist. Also: BP control (<130/80 mmHg), ACEI or ARB (to delay CKD progression), nonsteroidal mineralocorticoid receptor antagonist (finerenone), and limit nephrotoxic drugs.\n\nSGLT2 inhibitors provide both kidney and cardiovascular risk reduction. Finerenone (a nonsteroidal MRA) reduces both kidney and cardiovascular risk in diabetic nephropathy. ACEI/ARB are often used first-line for CVD protection and to slow CKD progression."
    difficulty: medium
    tags: [diabetic nephropathy, SGLT2 inhibitors, ACEI, ARB, finerenone, CKD]
  - front: "What screening tools are used for diabetic neuropathy, and what are the three types of diabetic neuropathy?"
    back: "Screening tools: 128 Hz tuning fork or 10 g monofilament. Three types: (1) Peripheral sensory neuropathy, (2) Motor neuropathy, (3) Autonomic neuropathy.\n\nScreening begins annually at diagnosis for T2DM and >5 years after diagnosis of T1DM (postpubertal patients). Approximately 50% of patients develop neuropathy within 10 years of T1DM and T2DM onset."
    difficulty: easy
    tags: [diabetic neuropathy, screening, monofilament, diabetes]
  - front: "Describe the clinical features of peripheral sensory neuropathy in diabetes mellitus."
    back: "Bilateral and symmetric; paresthesias (tingling, itching), neuropathic pain, radicular pain, numbness; decreased perception of vibration and pain/temperature especially in lower extremities. Classic stocking-glove distribution. Distal-predominant (longest nerves affected first). Decreased ankle reflex. May cause neuropathic foot ulceration.\n\nPeripheral sensory neuropathy is the most common form. The distal-predominant pattern reflects metabolic damage to the longest peripheral nerves first. Foot care education is essential to prevent ulceration and amputation."
    difficulty: easy
    tags: [peripheral sensory neuropathy, diabetes, stocking-glove, foot care]
  - front: "What are the features of autonomic neuropathy in diabetes mellitus?"
    back: "Postural hypotension, tachycardia, decreased cardiovascular response to Valsalva maneuver, gastroparesis, alternating diarrhea and constipation, urinary retention, and erectile dysfunction.\n\nGastroparesis is treated with dietary modification, domperidone or metoclopramide (dopamine antagonists), and erythromycin (motilin receptor agonist). Orthostatic hypotension may be managed with Jobst stockings and tilting the head of bed."
    difficulty: easy
    tags: [autonomic neuropathy, diabetes, gastroparesis, orthostatic hypotension]
  - front: "What are the reversible cranial nerve palsies seen in diabetic motor neuropathy?"
    back: "CN III (ptosis/ophthalmoplegia with PUPIL SPARING), CN VI (inability to laterally deviate eye), and CN VII (Bell's palsy). These are thought to be due to ischemic infarction of peripheral nerves and often spontaneously resolve after 6–8 weeks.\n\nPupil sparing in diabetic CN III palsy distinguishes it from CN III palsy due to posterior communicating artery aneurysm (which causes pupil involvement). Diabetic amyotrophy (Bruns-Garland Syndrome) refers to pain, weakness, and wasting of hip flexors or extensors."
    difficulty: medium
    tags: [diabetic neuropathy, cranial nerve palsy, CN III, pupil sparing, motor neuropathy]
  - front: "What pharmacological treatments are recommended for painful diabetic peripheral neuropathy?"
    back: "First-line options include: tricyclic antidepressants (e.g., amitriptyline), SNRIs (e.g., duloxetine), pregabalin, anticonvulsants (e.g., gabapentin, carbamazepine), and topical capsaicin. All have demonstrated superiority over placebo.\n\nPer the 2014 Ann Intern Med meta-analysis (65 RCTs, 12,632 patients): carbamazepine (SMD −1.57), venlafaxine (SMD −1.53), duloxetine (SMD −1.33), and amitriptyline (SMD −0.72) were effective. Relative efficacy between agents is not well established."
    difficulty: medium
    tags: [diabetic neuropathy, neuropathic pain, duloxetine, pregabalin, amitriptyline]
  - front: "What are the dermatologic complications of diabetes mellitus?"
    back: "Diabetic dermopathy (atrophic brown pretibial spots), eruptive xanthomas (due to hypertriglyceridemia), and necrobiosis lipoidica diabeticorum (rare; thinning shin skin revealing subcutaneous vessels).\n\nDiabetic dermopathy ('shin spots') is the most common skin manifestation and is thought to result from increased glycosylation of tissue proteins or vasculopathy. Eruptive xanthomas indicate severe hypertriglyceridemia, which often accompanies poorly controlled diabetes."
    difficulty: easy
    tags: [diabetes, dermatology, necrobiosis lipoidica, diabetic dermopathy, xanthomas]
  - front: "What is Whipple's triad and when is it used?"
    back: "Whipple's triad diagnoses clinically significant hypoglycemia: (1) Blood glucose <4.0 mmol/L, (2) Neuroglycopenic symptoms (dizziness, headache, visual clouding, confusion, seizure, coma), and (3) Rapid relief with glucose administration.\n\nAutonomic symptoms (palpitations, sweating, anxiety, tremor, tachycardia, hunger) typically occur first, followed by neuroglycopenic symptoms as BG falls further. Pseudohypoglycemia is defined as symptoms with BG >3.9 mmol/L or BG <3.9 mmol/L without symptoms."
    difficulty: easy
    tags: [hypoglycemia, Whipples triad, neuroglycopenic, autonomic]
  - front: "What is hypoglycemia unawareness and why does it occur?"
    back: "Hypoglycemia unawareness is when patients remain asymptomatic until severe hypoglycemia is reached. It occurs most commonly in T1DM after repeated hypoglycemic episodes, which blunt/minimize the autonomic response (decreased glucagon and epinephrine response).\n\nHistory of repeated hypoglycemia and low HbA1c are risk factors. Patients with unawareness may not be safe to drive and should consider a Medic-Alert bracelet and advanced glucose monitoring (e.g., continuous glucose monitor). Refer to Diabetes Canada 2018 guidelines regarding driving."
    difficulty: medium
    tags: [hypoglycemia unawareness, T1DM, autonomic, driving, safety]
  - front: "What is the treatment for hypoglycemia in the unconscious patient or patient who is NPO?"
    back: "D50W 50 mL (1 ampule) IV over 1–3 minutes, OR 1 mg glucagon SC or IM if no IV access. May need ongoing glucose infusion once BG >5 mmol/L.\n\nFor the awake, self-treating patient: give 15 g of rapid-acting carbohydrates (e.g., glucose tablets, juice), wait 15 minutes, recheck BG, repeat until BG >5 mmol/L, then eat a snack with 15 g carbohydrate and protein if the next meal is >1 hour away."
    difficulty: easy
    tags: [hypoglycemia, D50W, glucagon, treatment, emergency]
  - front: "What biochemical markers should be measured during a hypoglycemic episode when the cause is unknown?"
    back: "During spontaneous hypoglycemia or supervised fast (up to 72 h): plasma glucose, insulin, proinsulin, C-peptide, β-hydroxybutyrate, insulin antibodies, and screen for oral hypoglycemic agents (all available sulfonylureas and glinides).\n\nC-peptide interpretation: elevated = endogenous hyperinsulinemia (insulinoma, sulfonylurea use); low/normal = exogenous insulin. A glucagon stimulation test (1 mg IV) distinguishes endogenous from exogenous hyperinsulinism by measuring the plasma glucose response."
    difficulty: hard
    tags: [hypoglycemia, C-peptide, insulinoma, investigations, 72-hour fast]
  - front: "How does C-peptide level distinguish exogenous from endogenous hyperinsulinemia?"
    back: "Increased C-peptide = endogenous hyperinsulinemia (e.g., insulinoma, sulfonylurea use). Decreased or normal C-peptide = exogenous insulin administration (factitious hypoglycemia).\n\nC-peptide is co-secreted with endogenous insulin in equal molar amounts but is absent from exogenous insulin preparations. Therefore, high insulin + low C-peptide = exogenous source. Insulin antibodies may also be present in factitious hypoglycemia."
    difficulty: medium
    tags: [C-peptide, insulinoma, hypoglycemia, exogenous insulin, factitious]
  - front: "What is the treatment for insulinoma-related hypoglycemia when surgical resection is not possible?"
    back: "Diazoxide can be used for patients with insulinoma who cannot undergo resection. For non-insulinoma pancreatogenous hypoglycemia and post-bariatric bypass hypoglycemia: dietary changes (reduced carbs, small frequent meals); if severe, acarbose.\n\nDiazoxide inhibits insulin secretion from beta cells. Post-gastric bypass hypoglycemia results from exaggerated incretin response and rapid gastric emptying causing postprandial hyperinsulinism. Acarbose slows carbohydrate absorption, blunting postprandial insulin surges."
    difficulty: hard
    tags: [insulinoma, hypoglycemia, diazoxide, acarbose, post-bariatric]
  - front: "What are the diagnostic criteria for metabolic syndrome (≥3 required)?"
    back: "≥3 of: (1) Central obesity (waist circumference: Europid men >94 cm, women >80 cm; Asian men >90 cm, women >80 cm); (2) Triglycerides ≥1.7 mmol/L; (3) HDL-C <1.0 mmol/L (men) or <1.3 mmol/L (women); (4) BP ≥130/85 mmHg; (5) Fasting glucose ≥5.6 mmol/L. Drug treatment for any elevated marker is an alternate indicator.\n\nMetabolic syndrome is associated with insulin resistance, hyperglycemia, hyperinsulinemia, HTN, central obesity, and dyslipidemia. Complications include DM, atherosclerosis, CAD, MI, and stroke. Women with PCOS are at increased risk."
    difficulty: medium
    tags: [metabolic syndrome, insulin resistance, obesity, dyslipidemia, diagnosis]
  - front: "What is the order of anterior pituitary hormone loss with progressive mass effect on the pituitary?"
    back: "Sequential loss order (mnemonic 'Go Look For The Adenoma Please'): GH, LH, FSH, TSH, ACTH, PRL.\n\nGH is the most sensitive to pituitary compression and is lost first, followed by gonadotropins (LH, FSH), then TSH, then ACTH. PRL is typically elevated (not lost) with mass effect because the tumour compresses the pituitary stalk, reducing dopamine inhibition of prolactin secretion."
    difficulty: medium
    tags: [pituitary, pituitary hormones, pituitary mass, hypopituitarism]
  - front: "What happens to pituitary hormones after transection of the pituitary stalk?"
    back: "Stalk transection leads to hypersecretion of PRL (loss of dopamine inhibition) and hyposecretion of all remaining anterior pituitary hormones (GH, LH, FSH, TSH, ACTH).\n\nMost pituitary hormones are under net stimulatory control from the hypothalamus. Prolactin is unique in being primarily under tonic inhibitory control by dopamine. Disruption of hypothalamic input removes dopamine inhibition → PRL rises; all other hormones fall."
    difficulty: medium
    tags: [pituitary, pituitary stalk, prolactin, dopamine, hypothalamus]
  - front: "What are the secretory stimuli and inhibitory stimuli for ACTH?"
    back: "Secretory stimuli: CRH, metyrapone, hypoglycemia, vasopressin, fever, pain, and stress. Circadian rhythm (highest in morning, lowest at midnight). Inhibitory stimuli: dexamethasone, cortisol, and other glucocorticoids.\n\nThe dexamethasone suppression test exploits the negative feedback of glucocorticoids on ACTH release to evaluate for Cushing's syndrome. ACTH stimulates growth of the adrenal cortex and secretion of cortisol via cAMP."
    difficulty: medium
    tags: [ACTH, pituitary, CRH, dexamethasone, cortisol, HPA axis]
  - front: "What drugs commonly cause hyperprolactinemia and through what mechanism?"
    back: "Drugs with anti-dopaminergic properties: antipsychotics (most common), tricyclic antidepressants, antihypertensives (verapamil, methyldopa), bowel motility agents (metoclopramide, domperidone), H2-blockers, opiates (morphine), and estrogens (oral contraceptives). Mechanism: block dopamine-mediated inhibition of prolactin.\n\nPrimary hypothyroidism also causes hyperprolactinemia via elevated TRH stimulating prolactin. TSH should be measured in all patients with hyperprolactinemia. Macroprolactinemia (high molecular weight PRL) can cause falsely elevated serum PRL without clinical effects."
    difficulty: medium
    tags: [hyperprolactinemia, drugs, prolactin, dopamine, antipsychotics]
  - front: "What is the first-line treatment for prolactinoma, and which dopamine agonist is preferred?"
    back: "First-line: dopamine agonists (bromocriptine, cabergoline, quinagolide). Cabergoline is preferred due to higher efficacy in normalizing PRL levels and shrinking pituitary tumours.\n\nPRL-secreting tumours are often slow-growing. Treatment is indicated for symptomatic patients (galactorrhea, hypogonadism-amenorrhea, low libido, infertility). Women with prolactinomas should discontinue dopamine agonist therapy immediately upon becoming pregnant (except those with large invasive tumours)."
    difficulty: easy
    tags: [prolactinoma, cabergoline, bromocriptine, dopamine agonist, hyperprolactinemia]
  - front: "What are the clinical features of hyperprolactinemia?"
    back: "Galactorrhea (breast milk secretion, can occur in men), infertility, hypogonadism, amenorrhea, oligomenorrhea, and erectile dysfunction.\n\nProlactin inhibits gonadotropin secretion, leading to low LH/FSH and resulting hypogonadism. In approaching nipple discharge, differentiate galactorrhea (milky, bilateral, non-bloody from multiple ducts) from pathologic discharge (unilateral, may be bloody/clear — must rule out breast malignancy)."
    difficulty: easy
    tags: [hyperprolactinemia, galactorrhea, amenorrhea, infertility, prolactin]
  - front: "What is the gold standard test for GH deficiency in adults?"
    back: "The insulin tolerance test (inducing hypoglycemia) is the gold standard dynamic test for GH deficiency. A diagnosis can also be made with low serum IGF-1 in a patient with deficiencies in three or more pituitary axes.\n\nGH deficiency in adults causes increased adipose tissue, decreased lean body mass, decreased bone mineral density, and fatigue. GH replacement is considered for adult-onset GH deficiency without active malignancy if the patient prefers treatment after discussing benefits, adverse effects, and cost."
    difficulty: medium
    tags: [GH deficiency, IGF-1, insulin tolerance test, pituitary, growth hormone]
  - front: "What is the first-line investigation for acromegaly, and what is the confirmatory test?"
    back: "First-line: serum IGF-1 (expected to be elevated). Confirmatory/most specific: oral glucose suppression test (75 g glucose PO — suppresses GH in healthy individuals but NOT in acromegaly). MRI of sella turcica to identify tumour.\n\nAcromegaly results from a GH-secreting pituitary adenoma in adults (after epiphyseal fusion), leading to gigantism in children (before fusion). GH excess causes insulin resistance, IGT, cardiomyopathy, HTN, sleep apnea, and increased colon cancer risk."
    difficulty: medium
    tags: [acromegaly, IGF-1, glucose suppression test, GH excess, pituitary adenoma]
  - front: "What are the treatment options for acromegaly?"
    back: "Surgery (transsphenoidal) is recommended initial therapy for most patients. Second-line: somatostatin analogue (octreotide), dopamine agonist (cabergoline), GH receptor antagonist (pegvisomant), or radiation (for disease not controlled by surgery or medical therapy).\n\nGH excess can also rarely result from neuroendocrine tumours secreting ectopic GH or GHRH. Risks of GH excess include cardiac disease (in 1/3 of patients), OSA, HTN (in 1/3 of patients), DM, and increased colon cancer risk."
    difficulty: medium
    tags: [acromegaly, octreotide, pegvisomant, surgery, GH excess, treatment]
  - front: "What is Kallmann syndrome?"
    back: "Kallmann syndrome is a congenital cause of hypogonadotropic hypogonadism characterized by deficient GnRH secretion combined with anosmia (absent sense of smell) due to failure of olfactory and GnRH neurons to migrate to the hypothalamus.\n\nIt causes low FSH, low LH, and low sex hormones. Patients present with absent or incomplete puberty. Treatment is gonadotropin replacement or pulsatile GnRH for fertility, and sex hormone replacement for symptomatic treatment."
    difficulty: medium
    tags: [Kallmann syndrome, hypogonadotropic hypogonadism, GnRH, anosmia, puberty]
  - front: "What is the difference between hypogonadotropic and hypergonadotropic hypogonadism in terms of FSH/LH levels?"
    back: "Hypogonadotropic hypogonadism: LOW FSH, LOW LH, and low sex hormones — problem is at the hypothalamus/pituitary level. Hypergonadotropic hypogonadism: HIGH FSH, HIGH LH, and low sex hormones — problem is at the gonad level (gonadal failure).\n\nHypogonadotropic causes include Kallmann syndrome, pituitary tumours, hyperprolactinemia, eating disorders. Hypergonadotropic causes include Turner syndrome, Klinefelter syndrome, gonadal toxins (chemotherapy, radiation), premature ovarian insufficiency, and STIs."
    difficulty: medium
    tags: [hypogonadism, FSH, LH, hypogonadotropic, hypergonadotropic]
  - front: "What are the common causes of SIADH?"
    back: "Malignancy (ectopic ADH): small cell lung carcinoma, extrapulmonary small cell carcinomas, squamous cell carcinoma of head and neck. CNS disease (inflammatory, hemorrhage, tumour, Guillain-Barré). Respiratory disease (TB, pneumonia, empyema). Drugs: SSRIs, vincristine, chlorpropamide, cyclophosphamide, carbamazepine, nicotine, morphine, DDAVP, oxytocin. Post-surgical stress.\n\nSmall cell lung carcinoma is the classic malignant cause. SIADH from CNS disease results from direct hypothalamic stimulation of ADH. Carbamazepine both causes SIADH and paradoxically is used to treat central DI by enhancing ADH action at the kidney."
    difficulty: medium
    tags: [SIADH, causes, small cell carcinoma, hyponatremia, drugs]
  - front: "What is the treatment for SIADH?"
    back: "Treat underlying cause, fluid restriction (800–1000 mL/day), vasopressin receptor antagonists (tolvaptan, conivaptan), and furosemide.\n\nFluid restriction is the cornerstone of SIADH treatment. Vasopressin V2 receptor antagonists ('vaptans') promote aquaresis (free water excretion). Correction of hyponatremia must not be too rapid — risk of osmotic demyelination syndrome (central pontine myelinolysis) if Na⁺ corrected >8–10 mEq/L per 24 hours."
    difficulty: medium
    tags: [SIADH, treatment, tolvaptan, fluid restriction, hyponatremia]
  - front: "What is Diabetes Insipidus (DI) and how are central DI and nephrogenic DI differentiated?"
    back: "DI is a disorder of ineffective ADH (decreased production or peripheral resistance) causing large volumes of dilute urine (>3 L/day). Differentiation: fluid deprivation → both forms show persistent high urine output and urine osmolality < plasma osmolality. Administration of exogenous ADH (DDAVP): urine concentrates in central DI but NOT in nephrogenic DI.\n\nCentral DI causes: pituitary surgery, tumours, idiopathic/autoimmune, stalk infiltration, trauma, hydrocephalus, Langerhans cell histiocytosis. Nephrogenic DI causes: lithium, hypercalcemia, hypokalemia, CKD, hereditary."
    difficulty: medium
    tags: [diabetes insipidus, central DI, nephrogenic DI, DDAVP, ADH]
  - front: "What is the treatment for central DI vs. nephrogenic DI?"
    back: "Central DI: first-line = desmopressin (DDAVP); second-line = chlorpropamide, thiazides, NSAIDs, carbamazepine. Nephrogenic DI: solute restriction and thiazide diuretics.\n\nThiazides paradoxically reduce urine output in nephrogenic DI by causing mild volume depletion → increased proximal tubular sodium and water reabsorption → less fluid reaches the collecting duct. NSAIDs and chlorpropamide enhance residual ADH action."
    difficulty: medium
    tags: [diabetes insipidus, desmopressin, thiazides, treatment, central DI, nephrogenic DI]
  - front: "What is Cerebral Salt Wasting (CSW) and how does it differ from SIADH?"
    back: "CSW occurs in subarachnoid hemorrhage. Malfunctioning renal tubules excrete sodium, mimicking SIADH biochemically. The key hallmark distinguishing CSW from SIADH is HYPOVOLEMIA in CSW (SIADH is euvolemic).\n\nBoth CSW and SIADH present with hyponatremia and high urine sodium, making differentiation difficult. Volume status is the critical distinguishing feature. CSW is treated with sodium replacement and volume repletion; SIADH is treated with fluid restriction."
    difficulty: hard
    tags: [cerebral salt wasting, SIADH, hyponatremia, subarachnoid hemorrhage, hypovolemia]
  - front: "What physiologic effects does GLP-1 receptor agonist therapy have on cardiovascular and renal outcomes in T2DM?"
    back: "Per 2021 Lancet Diabetes Endocrinol meta-analysis (8 trials, >60,000 patients): GLP-1 RAs reduce MACE by 14% (HR 0.86), all-cause mortality by 12% (HR 0.88), hospitalization for heart failure by 11% (HR 0.89), and composite kidney outcome by 21% (HR 0.79). No increase in severe hypoglycemia, retinopathy, or pancreatic adverse effects.\n\nGLP-1 RAs with proven cardiovascular benefit include dulaglutide, exenatide ER, liraglutide, and semaglutide. These agents are preferred in T2DM patients with established ASCVD or high cardiovascular risk, per Diabetes Canada guidelines."
    difficulty: medium
    tags: [GLP-1 receptor agonists, cardiovascular, T2DM, semaglutide, liraglutide, MACE]
  - front: "What are the effects of SGLT2 inhibitors on kidney outcomes regardless of diabetes status?"
    back: "Per 2022 Lancet meta-analysis (13 trials): SGLT2 inhibitors reduce kidney disease progression by 37% (RR 0.63), AKI by 23% (RR 0.77), and cardiovascular death or hospitalization for heart failure by 23% (RR 0.77). Benefits are seen irrespective of diabetes status, primary kidney disease, or kidney function.\n\nSGLT2 inhibitors are now recommended for kidney protection beyond diabetes management. They reduce cardiovascular death by 14% but do not significantly reduce non-cardiovascular death. SGLT2i should only be initiated if eGFR >30 mL/min/1.73 m²."
    difficulty: medium
    tags: [SGLT2 inhibitors, CKD, AKI, heart failure, cardiorenal protection]
  - front: "What is the pulsatile GnRH frequency effect on FSH vs. LH release?"
    back: "Low-frequency pulsatile GnRH stimulation → FSH release. High-frequency pulsatile GnRH stimulation → LH release. Continuous (non-pulsatile) GnRH infusion → suppresses both FSH and LH (downregulation of GnRH receptors).\n\nThis principle is clinically exploited: GnRH analogues (agonists) given continuously cause initial flare then suppression (used in prostate cancer, endometriosis, precocious puberty). Pulsatile GnRH can be used to treat hypogonadotropic hypogonadism when fertility is desired."
    difficulty: hard
    tags: [GnRH, FSH, LH, pulsatile, pituitary, gonadotropins]
  - front: "What are the bone and joint complications of diabetes mellitus?"
    back: "Juvenile cheiroarthropathy (chronic hand stiffness from glycosylated collagen causing skin contracture over joints), Dupuytren's contracture, increased fracture risk (T1DM and T2DM, due to decreased bone quality), and adhesive capsulitis ('frozen shoulder').\n\nDiabetic bone disease is due to glycosylation of collagen and other connective tissue proteins as well as vasculopathy. Fracture risk is elevated despite often normal bone mineral density by DXA, reflecting impaired bone quality rather than quantity."
    difficulty: easy
    tags: [diabetes, cheiroarthropathy, Dupuytren, frozen shoulder, fracture, bone]
  - front: "What are the cataracts associated with diabetes mellitus and their mechanism?"
    back: "Diabetes causes subcapsular and senile cataracts due to glycosylation of lens proteins and increased sorbitol accumulation (polyol pathway), causing osmotic change and fibrosis in the lens.\n\nThe polyol pathway converts glucose to sorbitol via aldose reductase. Sorbitol accumulates intracellularly (because it is poorly permeable across cell membranes), causing osmotic swelling and lens opacification. This mechanism also contributes to diabetic neuropathy."
    difficulty: medium
    tags: [diabetes, cataracts, sorbitol, polyol pathway, glycosylation]
  - front: "What is the role of ADH at the collecting duct and what stimulates vs. inhibits its secretion?"
    back: "ADH acts on V2 receptors in renal collecting duct tubules → insertion of aquaporin channels → water reabsorption → concentrated urine. Stimulated by: increased serum osmolality, hypovolemia/decreased effective circulating volume, stress, pain, fever, CNS disorders. Inhibited by: decreased serum osmolality, ethanol.\n\nContracted plasma volume detected by baroreceptors is a more potent stimulus for ADH secretion than increased osmolality. Osmoreceptors in the hypothalamus detect serum osmolality. ADH is an octapeptide synthesized in the supraoptic and paraventricular nuclei and stored in the posterior pituitary."
    difficulty: easy
    tags: [ADH, vasopressin, aquaporin, V2 receptor, collecting duct, SIADH]
  - front: "What are the local mass effects of a pituitary adenoma on vision?"
    back: "Bitemporal hemianopsia (compression of optic chiasm), diplopia (oculomotor nerve palsies), loss of colour vision, headaches. Increased ICP is rare.\n\nThe optic chiasm lies directly above the pituitary fossa. As a pituitary adenoma grows superiorly, it compresses the decussating nasal fibres of the optic chiasm, producing the classic bitemporal (outer field) visual loss. Recognizing this pattern is high-yield for MCCQE1."
    difficulty: easy
    tags: [endocrinology, pituitary, neurology, visual fields]
  - front: "Which hormones does a pituitary adenoma most commonly secrete in excess, and what are the resulting syndromes?"
    back: "PRL → galactorrhea and hypogonadism; GH → acromegaly (adults) or gigantism (children); ACTH → Cushing's disease (Cushing's syndrome caused by a pituitary tumour). TSH-secreting tumours are rare.\n\nProlactinomas are the most common secretory pituitary adenoma. GH excess before epiphyseal fusion causes gigantism; after fusion it causes acromegaly. ACTH excess drives bilateral adrenal cortisol overproduction (Cushing's disease). TSH-secreting adenomas account for <1% of pituitary tumours."
    difficulty: easy
    tags: [endocrinology, pituitary, prolactinoma, acromegaly, Cushing]
  - front: "What is the imaging modality of choice for evaluating a suspected pituitary adenoma?"
    back: "MRI of the sella turcica.\n\nMRI with gadolinium provides superior soft-tissue contrast compared to CT, allowing visualization of microadenomas (<10 mm) and their relationship to the optic chiasm, cavernous sinuses, and surrounding structures. CT is an alternative when MRI is contraindicated."
    difficulty: easy
    tags: [endocrinology, pituitary, radiology]
  - front: "List the eight etiologic categories of hypopituitarism using the mnemonic 'The Eight I's'."
    back: "Invasive (tumours, craniopharyngioma, metastases), Infarction/hemorrhage (Sheehan's syndrome, pituitary apoplexy), Infiltrative/inflammatory (sarcoidosis, hemochromatosis, histiocytosis), Infectious (syphilis, TB, fungal, parasitic), Injury (severe head trauma), Immunologic (autoimmune hypophysitis), Iatrogenic (surgery, radiation, immunotherapy), Idiopathic (familial, congenital midline defects).\n\nA structured differential is essential for MCCQE1. Sheehan's syndrome (postpartum pituitary infarction due to hypovolemic shock) and pituitary apoplexy (acute hemorrhage/infarction of a pituitary tumour presenting with sudden headache and altered LOC) are classic high-yield scenarios."
    difficulty: medium
    tags: [endocrinology, pituitary, hypopituitarism]
  - front: "In what order are pituitary hormones typically lost in progressive hypopituitarism?"
    back: "GH → LH → FSH → TSH → ACTH → PRL → then posterior pituitary hormones (ADH and oxytocin). Mnemonic: 'Go Look For The Adenoma Please'.\n\nGH-secreting somatotrophs and LH/FSH-secreting gonadotrophs are most sensitive to compression, so their deficiency appears first. ACTH deficiency is particularly dangerous (central adrenal insufficiency). Posterior pituitary deficiency (diabetes insipidus) occurs late or with specific lesions."
    difficulty: medium
    tags: [endocrinology, pituitary, hypopituitarism]
  - front: "What is Sheehan's syndrome and how does it present?"
    back: "Pituitary infarction due to excessive postpartum blood loss and hypovolemic shock. Presents with failure to lactate (PRL deficiency), amenorrhea, and features of other pituitary hormone deficiencies.\n\nThe pituitary gland enlarges during pregnancy, making it vulnerable to ischemia if blood pressure drops precipitously during postpartum hemorrhage. Failure to lactate after delivery is the classic first clue. Hormonal replacement is required for life."
    difficulty: easy
    tags: [endocrinology, pituitary, obstetrics, hypopituitarism]
  - front: "What is pituitary apoplexy and how is it recognized?"
    back: "Acute hemorrhage or infarction of a pituitary tumour. Presents with sudden severe headache, visual field defects, oculomotor palsies, altered LOC, and loss of pituitary hormones. Can be fatal if not recognized and treated promptly.\n\nPituitary apoplexy is a neurosurgical emergency. The sudden expansion of blood within the sella compresses the optic chiasm and cavernous sinuses. Urgent neurosurgical decompression and corticosteroid replacement (for adrenal insufficiency) are required. It may masquerade as subarachnoid hemorrhage."
    difficulty: medium
    tags: [endocrinology, pituitary, emergency, neurology]
  - front: "What clinical syndrome results from isolated ACTH deficiency in hypopituitarism, and how does it differ from primary adrenal insufficiency?"
    back: "Central adrenal insufficiency: fatigue, weight loss, hypoglycemia, anemia, hyponatremia. Unlike primary (Addison's), there is NO hyperpigmentation (ACTH is low, not high) and NO hyperkalemia (aldosterone remains intact via the renin-angiotensin axis).\n\nACTH deficiency from a pituitary source leads to cortisol deficiency but spares mineralocorticoid function (aldosterone is primarily regulated by angiotensin II and potassium). The absence of hyperpigmentation and hyperkalemia distinguishes central from primary adrenal insufficiency."
    difficulty: hard
    tags: [endocrinology, pituitary, adrenal, hypopituitarism]
  - front: "When investigating suspected hypopituitarism, concurrent adrenal insufficiency and hypothyroidism are found. Which should be treated first and why?"
    back: "Treat adrenal insufficiency (with glucocorticoids) FIRST, then treat hypothyroidism. Starting thyroid hormone replacement first can precipitate an adrenal crisis by increasing cortisol metabolism.\n\nThyroid hormone increases hepatic clearance of cortisol. If thyroid hormone is replaced before glucocorticoids in a patient with combined deficiency, the remaining adrenal reserve may be overwhelmed, precipitating life-threatening adrenal crisis. This is a classic MCCQE1 management principle."
    difficulty: hard
    tags: [endocrinology, pituitary, adrenal, hypothyroidism, management]
  - front: "What initial investigation is used to evaluate suspected ACTH deficiency, and what test follows if results are equivocal?"
    back: "Initial: 8 AM serum cortisol. If low or borderline: cosyntropin stimulation test (250 mcg ACTH analogue). If equivocal: insulin tolerance test (hypoglycemia should normally raise cortisol and GH).\n\nThe cosyntropin (Synacthen) stimulation test is the standard confirmatory test for adrenal insufficiency in Canada. A normal cortisol rise (≥500 nmol/L) rules out primary and most cases of secondary adrenal insufficiency. The insulin tolerance test is the gold standard but carries risks (hypoglycemia) and requires close supervision."
    difficulty: medium
    tags: [endocrinology, pituitary, adrenal, investigations]
  - front: "More than 90% of thyroid hormone secreted by the thyroid gland is which hormone, and which is more biologically active?"
    back: "More than 90% secreted is T4. T3 is approximately 4× more biologically active than T4. Most plasma T3 is derived from peripheral conversion of T4 by deiodinase enzymes.\n\nT4 serves as a prohormone. Peripheral 5'-deiodinase converts T4 to the active T3. Approximately 85% of T4 is converted peripherally to either T3 (active) or reverse T3 (inactive). Reverse T3 is produced during illness to reduce metabolic activity."
    difficulty: easy
    tags: [endocrinology, thyroid, physiology]
  - front: "What is the best single test for assessing thyroid function, and when is this insufficient?"
    back: "TSH is the best test for primary thyroid disorders. If secondary (pituitary/hypothalamic) thyroid disease is suspected, both TSH AND free T4 must be measured, as TSH may be low or inappropriately normal despite low T4.\n\nIn primary thyroid dysfunction, TSH reflects the pituitary's response to circulating thyroid hormones via negative feedback and is therefore exquisitely sensitive to small changes. In secondary/tertiary hypothyroidism, the feedback axis itself is broken, making TSH unreliable as a standalone screening test."
    difficulty: medium
    tags: [endocrinology, thyroid, investigations, TSH]
  - front: "What do thyroid autoantibodies (TRAb, TPOAb, TgAb) indicate in clinical practice?"
    back: "TPOAb and TgAb (blocking variety of TRAb) are elevated in Hashimoto's thyroiditis. TRAb of the stimulating variety (also called TSI) cause Graves' disease. Both blocking and stimulating TRAb can coexist in Graves' disease.\n\nThird-generation TRAb assays have >98% sensitivity and specificity for Graves' disease, making them useful to determine the etiology of hyperthyroidism. TPOAb are the most sensitive marker for Hashimoto's thyroiditis. TgAb can interfere with thyroglobulin assays used to monitor thyroid cancer recurrence."
    difficulty: medium
    tags: [endocrinology, thyroid, autoimmune, investigations]
  - front: "When is plasma thyroglobulin measured and what limits its interpretation?"
    back: "Used to monitor for residual or recurrent thyroid cancer after thyroidectomy. Elevated or detectable levels suggest persistent, recurrent, or metastatic disease. TgAb interferes with the assay, so both TgAb and thyroglobulin must be measured simultaneously.\n\nAfter total thyroidectomy for thyroid cancer, thyroglobulin should be undetectable. Any detectable level raises concern for residual or metastatic disease. Because TgAb can falsely lower measured thyroglobulin (immunometric assay interference), its concurrent measurement is mandatory for accurate interpretation."
    difficulty: medium
    tags: [endocrinology, thyroid, cancer, tumour markers]
  - front: "When is a radioisotope thyroid scan (Technetium-99) indicated, and what is the clinical significance of a 'hot' vs. 'cold' nodule?"
    back: "Indicated when: (1) one or more thyroid nodule(s) AND (2) the patient is hyperthyroid. Hot nodule = hyperfunctioning → very low malignancy risk; treat hyperthyroidism. Cold nodule = non-functioning → further workup required (U/S, then FNAB if concerning sonographic features).\n\nIn a euthyroid patient with a nodule, radioisotope scanning is not the first-line test — ultrasound is. Scanning is reserved for hyperthyroid patients with nodules to identify whether the nodule is the source of excess hormone. Hyperfunctioning nodules are rarely malignant because autonomous growth implies differentiated function."
    difficulty: medium
    tags: [endocrinology, thyroid, radiology, nodule]
  - front: "What does RAIU (radioactive iodine uptake) measure, and how does it distinguish causes of thyrotoxicosis?"
    back: "RAIU measures in vivo iodine turnover by the thyroid. Increased uptake = overproduction (Graves', toxic nodular goitre, toxic adenoma). Decreased uptake = leaking thyroid hormone (thyroiditis), exogenous thyroid hormone use, or excess iodine load (amiodarone, contrast dye).\n\nRAIU differentiates destructive thyroiditis (low uptake, as hormone leaks from damaged follicles) from true hyperthyroidism (high uptake, as the gland is actively over-producing). This distinction is critical because thyroiditis is self-limited and should NOT be treated with antithyroid drugs or RAI ablation."
    difficulty: medium
    tags: [endocrinology, thyroid, radiology, thyrotoxicosis]
  - front: "What is the epidemiology and most common cause of hyperthyroidism?"
    back: "Hyperthyroidism affects approximately 1% of the general population. Graves' disease is the most common cause, occurring at any age with a peak in the 3rd–4th decades; M:F ratio approximately 1:7.\n\nGraves' disease accounts for roughly 60-80% of all hyperthyroidism cases. Its autoimmune pathogenesis involves TSI (thyroid-stimulating immunoglobulins) that bind and activate the TSH receptor. It has familial predisposition and is associated with HLA-B8 and DR3."
    difficulty: easy
    tags: [endocrinology, thyroid, Graves, hyperthyroidism, epidemiology]
  - front: "What is the pathophysiology of Graves' ophthalmopathy?"
    back: "TSI stimulates fibroblasts in orbital connective tissue and extraocular muscles, leading to inflammation and accumulation of glycosaminoglycans. This increases osmotic pressure, causes fluid accumulation, and results in forward displacement (proptosis) of the eyeball.\n\nGraves' ophthalmopathy (thyroid-associated orbitopathy) is distinct from the lid lag seen in any thyrotoxicosis (adrenergic effect). True orbitopathy is immune-mediated and may worsen independently of thyroid status. Smoking is a major risk factor; RAI ablation may worsen it and should be covered with concurrent prednisone if ophthalmopathy is present."
    difficulty: hard
    tags: [endocrinology, thyroid, Graves, ophthalmopathy]
  - front: "List the classic clinical features of Graves' disease beyond general thyrotoxicosis symptoms."
    back: "1. Diffuse goitre with thyroid bruit. 2. Ophthalmopathy: proptosis, diplopia, conjunctival injection, corneal abrasions, periorbital puffiness, lid lag, decreased visual acuity. 3. Dermopathy (rare): pretibial myxedema (non-pitting edema from glycosaminoglycan deposition). 4. Acropachy: clubbing and thickening of distal phalanges.\n\nThe triad of diffuse goitre + exophthalmos + pretibial myxedema is pathognomonic of Graves' disease. Lid lag is non-specific (any thyrotoxicosis), whereas true proptosis and periorbital changes are specific to Graves'. Acropachy is a rare but specific sign."
    difficulty: easy
    tags: [endocrinology, thyroid, Graves, clinical features]
  - front: "What are the investigations that confirm a diagnosis of Graves' disease?"
    back: "Low TSH, elevated free T4 (and/or T3), positive TRAb (>98% sensitivity and specificity), elevated RAIU, homogeneous diffuse uptake on thyroid scan.\n\nThird-generation TRAb assays are sufficiently accurate to diagnose Graves' disease without requiring a thyroid scan in most cases. The combination of suppressed TSH + elevated free T4 + positive TRAb is diagnostic. Thyroid scan confirms homogeneous diffuse uptake and excludes toxic nodular disease."
    difficulty: easy
    tags: [endocrinology, thyroid, Graves, investigations]
  - front: "How do methimazole (MMI) and propylthiouracil (PTU) work, and what is the key difference between them?"
    back: "Both inhibit thyroid hormone synthesis by blocking peroxidase-catalyzed reactions (organification and coupling of iodotyrosines). PTU also inhibits peripheral conversion of T4 to T3. MMI is preferred due to once-daily dosing, faster resolution of hyperthyroidism, and lower hepatotoxicity. PTU is preferred in the first 16 weeks of pregnancy (MMI is teratogenic in T1 — aplasia cutis).\n\nThe dual mechanism of PTU (synthesis inhibition + peripheral conversion blockade) makes it useful in thyroid storm where rapid lowering of T3 is critical. However, PTU's risk of fulminant hepatic necrosis limits its routine use. In pregnancy, the teratogenicity profile switches the preference: PTU for T1, MMI for T2/T3."
    difficulty: hard
    tags: [endocrinology, thyroid, antithyroid drugs, pharmacology, pregnancy]
  - front: "What are the major and minor side effects of thionamides (MMI and PTU)?"
    back: "Major: hepatotoxicity (cholestasis or hepatitis), agranulocytosis, vasculitis. Minor: mild rash, pruritus.\n\nAgranulocytosis (rare, ~0.3%) is the most feared acute side effect — patients must be counselled to present immediately for a CBC if they develop fever, sore throat, or mouth ulcers. PTU carries a higher risk of fulminant hepatic necrosis than MMI, which is one reason MMI is now preferred for most patients."
    difficulty: medium
    tags: [endocrinology, thyroid, antithyroid drugs, adverse effects]
  - front: "What are the remission rates after a course of thionamides for Graves' disease, and what predicts long-term remission?"
    back: "Remission (normal thyroid indices 1 year after stopping PTU or MMI) occurs in 20-50% after 12-18 months of antithyroid therapy. Predictors of remission: small goitre, mild hyperthyroidism, low TRAb titres at end of treatment.\n\nThe high recurrence rate (~50%) of medical therapy is why many patients ultimately require definitive treatment with RAI or surgery. Monitoring TRAb levels helps guide the decision to stop antithyroid drugs — a negative or very low TRAb suggests a better chance of remission."
    difficulty: medium
    tags: [endocrinology, thyroid, Graves, management, prognosis]
  - front: "What are the indications for total thyroidectomy in Graves' disease?"
    back: "Large goitre, suspicious nodule for cancer, intolerance to thionamides + declines/not candidate for RAI, women wishing to conceive in the near future, uncontrolled hyperthyroidism not responding to anti-thyroid drugs in pregnancy (surgery safest in second trimester), or patient preference.\n\nThyroidectomy offers rapid and definitive control but carries surgical risks including hypoparathyroidism and recurrent laryngeal nerve damage (vocal cord palsy). Patients become permanently hypothyroid and require lifelong L-thyroxine replacement. Recurrence risk after total thyroidectomy is very low (~2%)."
    difficulty: medium
    tags: [endocrinology, thyroid, Graves, surgery, management]
  - front: "What is subacute (de Quervain's) thyroiditis, and how does it present?"
    back: "Presumed viral or postviral inflammatory thyroiditis (associated with HLA-DR5). Presents with painful thyroid swelling (may radiate to jaw/ears), malaise, fever, often preceded by URTI. Transient thyrotoxicosis followed by hypothyroidism then recovery. Near-absent RAIU; elevated ESR and CRP.\n\nThe triphasic course (hyperthyroid → hypothyroid → recovery) over weeks to months, combined with a painful tender thyroid and low RAIU, is the classic presentation. Treatment is symptomatic: NSAIDs or prednisone for pain, beta-blockers for adrenergic symptoms. Antithyroid drugs are NOT indicated (low uptake, no overproduction). 90% recover fully; 10% develop permanent hypothyroidism."
    difficulty: medium
    tags: [endocrinology, thyroid, thyroiditis, de Quervain]
  - front: "How does painless (silent) thyroiditis differ from de Quervain's thyroiditis?"
    back: "Painless thyroiditis: variant of Hashimoto's (associated with HLA-DR3), thyroid enlargement WITHOUT discomfort, affects women more. Same triphasic course and near-absent RAIU. Postpartum subtype common. 10% risk of permanent hypothyroidism; at risk for recurrent episodes.\n\nThe key distinguishing features are absence of pain/tenderness and absence of elevated ESR/CRP in painless thyroiditis. Postpartum thyroiditis (occurring within 1 year after delivery) is the most common form. It can be mistaken for postpartum depression when the hypothyroid phase predominates."
    difficulty: medium
    tags: [endocrinology, thyroid, thyroiditis, postpartum]
  - front: "What is toxic multinodular goitre (Plummer's disease) and how does its demographic differ from Graves' disease?"
    back: "Autonomous thyroid hormone production from multiple hyperfunctioning nodules. More common in elderly individuals (versus Graves' which peaks in 3rd–4th decades). Thyroid scan shows heterogeneous uptake with suppression of normal tissue. Treat with RAI (I-131) or surgical excision.\n\nIn elderly patients presenting with atrial fibrillation, heart failure, or weight loss without the classic signs of Graves' (no ophthalmopathy), toxic multinodular goitre should be high on the differential. RAI ablation is preferred first-line; pretreatment with MMI/PTU may be needed to prevent worsening hyperthyroidism post-RAI in elderly patients with cardiovascular disease."
    difficulty: medium
    tags: [endocrinology, thyroid, toxic nodular goitre, elderly]
  - front: "What is thyroid storm (thyrotoxic crisis) and what are its hallmark clinical features?"
    back: "Medical emergency: acute exacerbation of thyrotoxicosis in a life-threatening state (mortality 10-30%). Features: extreme hyperthermia (≥40°C), severe tachycardia, vomiting, diarrhea, hepatic failure with jaundice, atrial fibrillation, CHF, CNS manifestations (agitation, delirium, psychosis, seizures, coma). Often precipitated by infection, trauma, or surgery in a hyperthyroid patient.\n\nThyroid storm is a clinical diagnosis — there is no specific lab threshold. Management is aggressive and multi-pronged (PTU → block synthesis; iodide 1h later → block release; beta-blockers → control adrenergic symptoms; hydrocortisone → block peripheral T4→T3 conversion; supportive care). The 1-hour gap before giving iodide prevents using iodide as substrate for new hormone synthesis."
    difficulty: hard
    tags: [endocrinology, thyroid, thyroid storm, emergency]
  - front: "In thyroid storm, why is PTU given before iodide, and what are the specific treatment steps?"
    back: "PTU is given first to block synthesis; iodide is given 1 hour AFTER PTU to prevent iodide from being used as substrate for new hormone synthesis. Steps: (1) High-dose PTU or MMI; (2) Iodide 1h later (sodium iodide IV, or Lugol's solution, or SSKI); (3) Beta-blockers (propranolol preferred — also blocks T4→T3 conversion); (4) Hydrocortisone or dexamethasone (blocks peripheral T4→T3 conversion); (5) Supportive care (cooling, fluids, acetaminophen, ICU).\n\nThe Wolff-Chaikoff effect explains iodide's acute ability to suppress thyroid hormone release. However, if iodide is given before the synthesis is blocked by PTU/MMI, the excess iodide may be used to produce even more thyroid hormone (especially relevant in iodine-deficient glands). Corticosteroids have the added benefit of treating potential relative adrenal insufficiency."
    difficulty: hard
    tags: [endocrinology, thyroid, thyroid storm, emergency, pharmacology]
  - front: "What is the most common cause of hypothyroidism in North America, and what is the most common cause worldwide?"
    back: "North America: Hashimoto's thyroiditis (autoimmune). Worldwide: iodine deficiency.\n\nIodine fortification of table salt has essentially eliminated dietary iodine deficiency as a cause of hypothyroidism in Canada. In areas without iodine supplementation, endemic goitre with resultant hypothyroidism remains the leading cause globally. Post-ablative hypothyroidism (after RAI or thyroidectomy) is the most common iatrogenic cause."
    difficulty: easy
    tags: [endocrinology, thyroid, hypothyroidism, epidemiology]
  - front: "Describe the TSH and free T4 pattern in primary hypothyroidism vs. secondary hypothyroidism vs. subclinical primary hypothyroidism."
    back: "Primary hypothyroidism: TSH elevated + free T4 decreased. Subclinical primary hypothyroidism: TSH elevated + free T4 normal. Secondary (pituitary) hypothyroidism: TSH decreased or inappropriately normal + free T4 decreased.\n\nUnderstanding the feedback axis explains each pattern. In primary disease, the thyroid fails → less T4 → less negative feedback → pituitary secretes more TSH. In secondary disease, the pituitary fails → less TSH → thyroid produces less T4. Both TSH and free T4 are needed to identify secondary hypothyroidism. Monitoring secondary hypothyroidism uses free T4 (not TSH) as the target."
    difficulty: medium
    tags: [endocrinology, thyroid, hypothyroidism, investigations]
  - front: "What are the classic cardiovascular manifestations of hypothyroidism?"
    back: "Bradycardia, hypertension (diastolic), pericardial effusion, worsening CHF and angina, hypercholesterolemia, hyperhomocysteinemia, myxedema heart.\n\nHypothyroidism reduces cardiac contractility and heart rate (opposite of hyperthyroidism). Lipid abnormalities (elevated LDL, total cholesterol) increase cardiovascular risk. Pericardial effusion is common but rarely causes tamponade. 'Myxedema heart' refers to cardiomegaly from a combination of effusion and dilated myopathy."
    difficulty: medium
    tags: [endocrinology, thyroid, hypothyroidism, cardiovascular]
  - front: "What is the classic neurological sign of hypothyroidism on physical examination?"
    back: "Delayed relaxation phase of deep tendon reflexes ('hung reflexes' or 'slow relaxing reflexes'). Also: slow speech, muscle cramps, carpal tunnel syndrome, paresthesias.\n\nThe delayed relaxation is due to slowed muscle metabolism from thyroid hormone deficiency. It is detectable at the ankle jerk. Other neurological features include proximal myopathy, cerebellar ataxia (rare), and peripheral neuropathy. These are reversible with thyroid hormone replacement."
    difficulty: easy
    tags: [endocrinology, thyroid, hypothyroidism, neurology]
  - front: "How is L-thyroxine dosed in hypothyroidism, and what special considerations apply to the elderly and those with CAD?"
    back: "Standard starting dose: 1.6 mcg/kg/day (range 0.05-0.2 mg PO once daily). Elderly patients and those with CAD: start at 0.025 mg/day and increase gradually every 6 weeks ('start low, go slow') to avoid precipitating angina or arrhythmia. Recheck TSH after 6 weeks of any dose change.\n\nRapid normalization of thyroid hormone in elderly or cardiac patients can increase myocardial oxygen demand before coronary flow can adapt, triggering ischemia. Once a maintenance dose is achieved, annual TSH monitoring suffices. L-thyroxine should be taken on an empty stomach (at least 1h before breakfast or at bedtime) for consistent absorption."
    difficulty: medium
    tags: [endocrinology, thyroid, hypothyroidism, pharmacology, elderly]
  - front: "What drugs and substances decrease levothyroxine absorption or increase its clearance?"
    back: "Decreased absorption: calcium carbonate, sucralfate, aluminum hydroxide, iron (citrate), proton pump inhibitors/antacids (reduced stomach acidity), soy, coffee. Increased clearance: rifampin, antiepileptics (e.g., phenytoin, carbamazepine), tricyclic antidepressants, SSRIs. Also: lithium, metformin.\n\nPatients on levothyroxine must be counselled about these interactions. Iron and calcium should be taken at least 4 hours apart from levothyroxine. GI conditions impairing absorption (celiac disease, atrophic gastritis, H. pylori, lactose intolerance) may also reduce drug efficacy and require higher doses."
    difficulty: medium
    tags: [endocrinology, thyroid, hypothyroidism, drug interactions, pharmacology]
  - front: "What is Hashimoto's thyroiditis and what are its two major morphological forms?"
    back: "Most common form of primary hypothyroidism in North America. Chronic autoimmune thyroiditis. Two forms: (1) Goitrous variant — small rubbery goitre, initially euthyroid then hypothyroid, associated with fibrosis. (2) Atrophic variant — hypothyroid from onset, no goitre. Both share same autoimmune pathophysiology.\n\nHashimoto's is a risk factor for rare primary thyroid lymphoma. The pathogenesis involves T-cell mediated destruction of follicles and B-lymphocyte production of antibodies against thyroid peroxidase (TPOAb), thyroglobulin (TgAb), TSH receptor, and Na+/I- symporter. Associated with Down syndrome, Turner syndrome, and other autoimmune conditions."
    difficulty: easy
    tags: [endocrinology, thyroid, Hashimoto, autoimmune]
  - front: "What are the key investigations for Hashimoto's thyroiditis?"
    back: "High TSH, low T4 (T3 measurement not necessary). Presence of TPOAb and TgAb in serum. Treatment: L-thyroxine replacement if hypothyroid.\n\nTPOAb is the most sensitive and specific antibody for Hashimoto's thyroiditis. TgAb is also elevated but less specific. Approximately 10% of the population have positive TPOAb without overt hypothyroidism (subclinical or 'euthyroid' Hashimoto's), and these individuals are at increased risk of progressing to overt hypothyroidism."
    difficulty: easy
    tags: [endocrinology, thyroid, Hashimoto, investigations]
  - front: "What is myxedema coma, and what are its hallmark features and treatment?"
    back: "Medical emergency: severe hypothyroidism decompensated by precipitants (infection, trauma, cold exposure, MI, narcotics/hypnotics). Mortality up to 40%. Hallmarks: decreased consciousness + hypothermia + hyponatremia + hypotension + hypoglycemia + bradycardia + hypoventilation + non-pitting edema. Treatment: ICU, hydrocortisone 100 mg q8h (rule out adrenal insufficiency first), IV L-thyroxine loading dose (0.2-0.5 mg) then 0.1 mg IV daily, passive rewarming, mechanical ventilation, IV dextrose.\n\nHydrocortisone must be given before or simultaneously with thyroid hormone replacement in case of concurrent adrenal insufficiency — as in hypopituitarism, replacing thyroid hormone alone can precipitate adrenal crisis. Passive rewarming is preferred over active rewarming (which causes peripheral vasodilation and can worsen hypotension). Monitor for arrhythmia during treatment."
    difficulty: hard
    tags: [endocrinology, thyroid, myxedema coma, emergency]
  - front: "What is sick euthyroid syndrome (non-thyroidal illness), and how should it be managed?"
    back: "Transient alterations in thyroid hormone levels in severely ill, traumatized, or starving patients WITHOUT intrinsic thyroid disease. Pattern: initially low free T3 → then low TSH → then low free T4 (if severe). TSH may be transiently elevated during recovery. Management: treat the underlying illness; thyroid hormone replacement is NOT beneficial and not indicated.\n\nThis is a common source of confusion in hospitalized patients with abnormal TFTs. The low T3 is thought to be a protective adaptation (reducing tissue catabolism during stress). The key distinction from true hypothyroidism is clinical context — sick euthyroid occurs in the setting of acute severe illness, and TFTs normalize once the patient recovers."
    difficulty: hard
    tags: [endocrinology, thyroid, sick euthyroid, critical care]
  - front: "What is a non-toxic goitre and what are its causes?"
    back: "Generalized thyroid gland enlargement in a euthyroid individual NOT from inflammatory or neoplastic processes. Causes: iodine deficiency or excess, goitrogens (brassica vegetables — turnip, cassava; drugs — lithium, iodine, para-aminosalicylic acid), any disorder of hormone synthesis causing compensatory TSH-driven growth, peripheral resistance to thyroid hormone.\n\nNon-toxic goitre is most common during periods of increased thyroid hormone demand (adolescence, pregnancy, lactation). Early: diffuse goitre. Late: multinodular goitre with cysts, fibrosis, and ischemic areas. Complications include compression (stridor, dysphagia, hoarseness) and eventual autonomous function → toxic multinodular goitre."
    difficulty: easy
    tags: [endocrinology, thyroid, goitre, euthyroid]
  - front: "What is the role of calcitonin in thyroid physiology, and when is serum calcitonin measured clinically?"
    back: "Calcitonin is a peptide hormone secreted by parafollicular C-cells. It inhibits osteoclast activity and increases renal calcium excretion (lowers serum calcium). Clinically: serum calcitonin is measured when medullary thyroid carcinoma (MTC) is suspected (e.g., thyroid nodule + MEN 2A/2B or RET gene mutation) and to monitor for residual or recurrent MTC post-thyroidectomy.\n\nCalcitonin is NOT routinely measured for thyroid nodule workup. Its main clinical utility is as a tumour marker for MTC (derived from C-cells). MEN 2A and 2B syndromes carry a near-100% lifetime risk of MTC, so calcitonin and RET genetic testing are essential in this context."
    difficulty: medium
    tags: [endocrinology, thyroid, calcitonin, MTC, calcium]
  - front: "What are the steps in thyroid hormone synthesis?"
    back: "1. Iodide trapping by sodium-iodide cotransporter (NIC). 2. Oxidation of iodide to iodine by thyroid peroxidase (TP). 3. Organification: iodination of thyroglobulin tyrosine residues to MIT and DIT. 4. Coupling: MIT + DIT → T3; DIT + DIT → T4. 5. Proteolysis of thyroglobulin → release of T4 and T3 into blood.\n\nThionamides (MMI, PTU) block steps 2 and 3 (peroxidase-mediated reactions). Iodide excess (Wolff-Chaikoff) blocks step 3. Lithium blocks proteolysis and release (step 5). Understanding these steps explains the mechanisms of antithyroid drugs and iodine effects, which is essential for pharmacology questions on MCCQE1."
    difficulty: hard
    tags: [endocrinology, thyroid, physiology, synthesis]
  - front: "A 28-year-old woman presents at 8 weeks of pregnancy with a new diagnosis of Graves' disease. Which antithyroid drug should be used?"
    back: "PTU (propylthiouracil) during the first 16 weeks of pregnancy. MMI is contraindicated in the first trimester due to risk of aplasia cutis (and other embryopathy). Switch to MMI after 16 weeks due to risk of PTU-associated hepatotoxicity in the second and third trimesters.\n\nAplasia cutis congenita (scalp skin defect) and choanal/esophageal atresia are associated with first-trimester MMI exposure. PTU's hepatotoxicity risk makes it less desirable in later pregnancy. This trimester-specific switching strategy is a high-yield MCCQE1 topic. Both drugs cross the placenta and can cause fetal hypothyroidism — use the lowest effective dose."
    difficulty: hard
    tags: [endocrinology, thyroid, Graves, pregnancy, pharmacology]
  - front: "A patient with hyperthyroidism is found to have low TSH, elevated free T4, and markedly decreased RAIU. What is the most likely diagnosis and how does management differ from Graves' disease?"
    back: "Likely thyroiditis (subacute painful or painless) or exogenous thyroid hormone ingestion. Management: symptomatic treatment only (beta-blockers for adrenergic symptoms; NSAIDs/steroids for pain in de Quervain's). Antithyroid drugs and RAI are NOT indicated because the thyroid is not actively over-producing hormone.\n\nThe low RAIU is the critical differentiating feature from Graves' disease or toxic nodular disease. In thyroiditis, preformed hormone leaks from inflamed follicles — there is no new synthesis to block. Using thionamides in this setting would be ineffective and exposes the patient to unnecessary side effects."
    difficulty: hard
    tags: [endocrinology, thyroid, thyroiditis, differential diagnosis, management]
  - front: "What clinical signs are specific to Graves' disease versus any form of thyrotoxicosis?"
    back: "Specific to Graves' disease: proptosis (exophthalmos), periorbital puffiness, conjunctival injection, chemosis, corneal abrasions (ophthalmopathy/TAO), pretibial myxedema (dermopathy), acropachy, thyroid bruit, leukopenia, lymphocytosis, splenomegaly. Non-specific (any thyrotoxicosis): lid lag (adrenergic), tachycardia, tremor, heat intolerance, weight loss.\n\nLid lag is frequently misattributed exclusively to Graves' disease, but it results from sympathetic overstimulation of the superior tarsal muscle (Müller's muscle) and can occur in any thyrotoxic state. True ophthalmopathy (proptosis, chemosis) is immune-mediated and specific to Graves'."
    difficulty: hard
    tags: [endocrinology, thyroid, Graves, clinical features, differential diagnosis]
  - front: "What is the significance of subclinical hypothyroidism, and which patients should be treated?"
    back: "Defined as elevated TSH with normal free T4. Affects up to 10% of adults; 10-20% of women >50. Associated with increased risk of CHF and CAD events, and risk of progression to overt hypothyroidism. Treatment with levothyroxine is recommended for patients with TSH ≥10 mU/L, and for young/middle-aged patients with symptoms of mild hypothyroidism. Others can be observed.\n\nThe decision to treat subclinical hypothyroidism is controversial, particularly in elderly patients where the evidence for cardiovascular benefit is less clear. TSH ≥10 mU/L is a widely accepted threshold for treatment in Canada. TPOAb positivity increases the likelihood of progression to overt hypothyroidism."
    difficulty: medium
    tags: [endocrinology, thyroid, subclinical hypothyroidism, management]
  - front: "What are the features of hypokalemic periodic paralysis in thyrotoxicosis?"
    back: "Episodic muscle weakness or paralysis with low serum potassium, more common in Asian individuals. Triggered by carbohydrate intake, exercise, or rest after exertion. Treat the underlying thyrotoxicosis; acute attacks managed with potassium replacement and non-selective beta-blockers.\n\nThyrotoxicosis increases Na+/K+-ATPase activity, driving potassium intracellularly and causing hypokalemia. The condition predominantly affects Asian males. It can mimic familial hypokalemic periodic paralysis but resolves with treatment of the underlying hyperthyroid state. Propranolol (non-selective beta-blocker) is particularly useful for acute attacks."
    difficulty: hard
    tags: [endocrinology, thyroid, hyperthyroidism, hypokalemia, neurology]
  - front: "What is the prognosis and lifetime management for Graves' disease treated with radioactive iodine (I-131)?"
    back: "RAI is less invasive than surgery but results in permanent hypothyroidism in the majority, requiring lifelong L-thyroxine replacement. It may worsen Graves' ophthalmopathy (concurrent prednisone should be used if ophthalmopathy is present or patient is high risk). Contraindicated in pregnancy. Precautions with close contacts are required for several days post-treatment.\n\nI-131 is preferentially taken up by the thyroid and emits beta radiation that destroys thyroid tissue. The risk of post-RAI hypothyroidism increases over time (cumulative risk approaches 80-90% by 10 years). Follow-up TSH every 6-12 months after RAI is required to detect the onset of hypothyroidism and initiate replacement."
    difficulty: medium
    tags: [endocrinology, thyroid, Graves, radioactive iodine, management]
  - front: "What is the role of fine needle aspiration biopsy (FNAB) in evaluating thyroid nodules?"
    back: "FNAB is the primary cytological tool to differentiate benign from malignant thyroid nodules. Best performed under ultrasound guidance. Accuracy is decreased if the nodule is >50% cystic or posteriorly located. In hyperthyroid patients with nodules, a radioisotope scan is done first — hot nodules generally do not require FNAB.\n\nUltrasound is the first-line imaging for thyroid nodules in euthyroid patients, and FNAB is guided by sonographic risk stratification. Nodules with suspicious features (microcalcifications, irregular margins, taller-than-wide shape, hypoechogenicity) warrant FNAB regardless of size thresholds. FNAB avoids unnecessary surgery for the majority of thyroid nodules, which are benign."
    difficulty: medium
    tags: [endocrinology, thyroid, nodule, biopsy, investigations]
  - front: "How is total calcium corrected for low albumin levels?"
    back: "Corrected Ca²⁺ (mmol/L) = measured Ca²⁺ + 0.02 × (40 − albumin [g/L]). For every decrease in albumin by 10 g/L, calcium increases by 0.2 mmol/L.\n\nTotal serum calcium does not reflect ionized calcium when albumin is abnormal. Since calcium is partially protein-bound, low albumin falsely lowers measured total calcium. The correction formula adjusts for this discrepancy. If ionized calcium is available, it should be measured directly."
    difficulty: easy
    tags: [hypocalcemia, hypercalcemia, calcium, albumin correction, electrolytes]
  - front: "When should ionized calcium be measured instead of relying on total calcium?"
    back: "Ionized calcium should be assessed (or total calcium corrected) in: abnormal albumin levels, critical illness, and chronic hepatic or renal failure.\n\nThese conditions alter protein binding of calcium, making total calcium unreliable. The albumin correction formula can be used when ionized calcium measurement is unavailable."
    difficulty: easy
    tags: [calcium, ionized calcium, albumin, endocrinology]
  - front: "What is the classic mnemonic for symptoms of hypercalcemia and what does each component refer to?"
    back: "'Bones, stones, groans, and psychiatric overtones': Bones = bone pain/osteoclastic activity; Stones = nephrolithiasis; Groans = GI symptoms (nausea, vomiting, constipation, pancreatitis, PUD); Psychiatric overtones = cognitive dysfunction, anxiety, depression, psychosis.\n\nThis mnemonic encompasses the four major symptom clusters in hypercalcemia. Cardiac effects (shortened QT, arrhythmia) and neuromuscular (weakness, hypotonia) symptoms are also important. Hypercalcemic crisis (usually >4 mmol/L) presents with oliguria/anuria and altered mental status."
    difficulty: easy
    tags: [hypercalcemia, symptoms, mnemonic, endocrinology]
  - front: "What are the two initial steps in the differential diagnosis of hypercalcemia?"
    back: "1. Measure PTH: high/normal PTH vs. low PTH. 2. If PTH is low, check phosphate: high/normal phosphate suggests vitamin D–related causes; low phosphate suggests humoral hypercalcemia of malignancy (PTHrP) or other PTH-independent causes.\n\nA high or normal PTH with hypercalcemia indicates PTH-dependent causes (primary or tertiary hyperparathyroidism, lithium, familial hypocalciuric hypercalcemia). A suppressed PTH indicates PTH-independent causes (malignancy, vitamin D toxicity, granulomatous disease, immobilization, etc.)."
    difficulty: medium
    tags: [hypercalcemia, differential diagnosis, PTH, endocrinology]
  - front: "What are the causes of primary hyperparathyroidism?"
    back: "Solitary parathyroid adenoma (81%), parathyroid hyperplasia (15%), parathyroid carcinoma (4%). Associated with MEN 1 and MEN 2a.\n\nPrimary hyperparathyroidism is the most common cause of outpatient hypercalcemia. It is characterized by high PTH and often low phosphate. Tertiary hyperparathyroidism occurs after prolonged secondary hyperparathyroidism due to renal failure (autonomous PTH secretion)."
    difficulty: easy
    tags: [hyperparathyroidism, primary hyperparathyroidism, parathyroid, hypercalcemia, MEN]
  - front: "What are the mechanisms by which malignancy causes hypercalcemia?"
    back: "1. Secretion of PTHrP (mimics PTH — prevents renal calcium excretion). 2. Cytokines in multiple myeloma. 3. Extra-renal calcitriol production by lymphoma. 4. Osteolytic bone metastases (direct effect). 5. Excess PTH in parathyroid cancer.\n\nMalignancy is the most common cause of hypercalcemia in hospitalized patients and usually occurs in advanced disease. Common tumours: lung, renal, breast, ovarian, squamous cell carcinomas, lymphoma, and multiple myeloma. PTHrP-mediated humoral hypercalcemia causes low PTH and low/normal phosphate."
    difficulty: medium
    tags: [hypercalcemia, malignancy, PTHrP, paraneoplastic, oncology, endocrinology]
  - front: "What is familial hypocalciuric hypercalcemia (FHH) and how does it cause hypercalcemia?"
    back: "FHH is caused by a loss-of-function mutation in the calcium-sensing receptor (CaSR) gene. The defective receptor fails to suppress PTH appropriately in response to elevated calcium, resulting in hypercalcemia with relative hypocalciuria and normal/high PTH.\n\nFHH is benign and does not require parathyroid surgery. It can be distinguished from primary hyperparathyroidism by a low calcium-to-creatinine clearance ratio (<0.01). Family members may also be hypercalcemic."
    difficulty: medium
    tags: [FHH, familial hypocalciuric hypercalcemia, calcium sensing receptor, hypercalcemia, genetics]
  - front: "How do granulomatous diseases (e.g., sarcoidosis, tuberculosis) cause hypercalcemia?"
    back: "Activated macrophages within granulomas produce extra-renal 1α-hydroxylase, leading to unregulated conversion of 25-OH vitamin D to 1,25-(OH)₂ vitamin D (calcitriol), increasing GI calcium absorption.\n\nThis mechanism is PTH-independent; PTH will be suppressed. Calcitriol levels are elevated. Treatment: corticosteroids, which inhibit 1α-hydroxylase in activated mononuclear cells and reduce calcitriol production."
    difficulty: medium
    tags: [granulomatous disease, sarcoidosis, hypercalcemia, calcitriol, vitamin D, endocrinology]
  - front: "At what serum calcium level is hypercalcemia considered a medical emergency requiring urgent correction?"
    back: ">3.5 mmol/L is severe hypercalcemia requiring urgent correction due to risk of dysrhythmia and coma. Hypercalcemic crisis (usually >4 mmol/L or 16 mg/dL) presents with oliguria/anuria and mental status changes including somnolence, eventually coma.\n\nTreatment thresholds: <3.0 mmol/L often asymptomatic; 3.0–3.5 mmol/L may require treatment if symptomatic; >3.5 mmol/L requires urgent treatment. Hypercalcemic crisis is a medical emergency."
    difficulty: easy
    tags: [hypercalcemia, hypercalcemic crisis, emergency, endocrinology]
  - front: "What is the first-line treatment for acute hypercalcemia/hypercalcemic crisis?"
    back: "Aggressive IV isotonic saline (4–6 L over 24 h) — volume expansion is the initial therapy. Loop diuretics (e.g., furosemide) only if hypervolemic (urine output >200 mL/h). Followed by bisphosphonates (treatment of choice for reducing bone resorption) — zoledronic acid 4 mg IV over 15 min or pamidronate 60–90 mg IV over 2 h.\n\nSaline expands intravascular volume and promotes calciuresis. Bisphosphonates inhibit osteoclastic bone resorption; calcium-lowering effects are seen 24–48 h after administration. Calcitonin (4 IU/kg IM/SC q12h) has rapid onset (4–6 h) but only works for 48 h due to tachyphylaxis — ask about fish allergy before prescribing."
    difficulty: easy
    tags: [hypercalcemia, treatment, bisphosphonates, zoledronic acid, calcitonin, endocrinology]
  - front: "Why is calcitonin used in conjunction with bisphosphonates for acute hypercalcemia?"
    back: "Calcitonin has a rapid onset of action (4–6 h) while bisphosphonates take 24–48 h to lower calcium. Calcitonin provides bridging therapy until bisphosphonates take effect. However, calcitonin develops tachyphylaxis within 48 h, limiting its ongoing use.\n\nThis combination exploits the complementary pharmacokinetics of each drug. Always screen for fish allergy before prescribing calcitonin. If bisphosphonates are contraindicated (severe renal impairment), denosumab can be used with calcitonin."
    difficulty: medium
    tags: [hypercalcemia, calcitonin, bisphosphonates, tachyphylaxis, endocrinology]
  - front: "How do corticosteroids treat hypercalcemia, and in which conditions are they most useful?"
    back: "Corticosteroids inhibit 1α-hydroxylase in activated mononuclear cells (macrophages), reducing calcitriol production. Most useful in: vitamin D toxicity (hypervitaminosis D), granulomatous diseases (sarcoidosis, tuberculosis), and some malignancies (lymphoma). Effects are seen within 2–5 days.\n\nCorticosteroids are not effective for PTH-mediated hypercalcemia (e.g., primary hyperparathyroidism). Their mechanism targets extra-renal calcitriol production rather than PTH or bone resorption pathways."
    difficulty: medium
    tags: [hypercalcemia, corticosteroids, vitamin D, granulomatous disease, treatment, endocrinology]
  - front: "What drugs are known to cause hypercalcemia?"
    back: "Lithium, thiazide diuretics, theophylline, estrogen/tamoxifen, vitamin D analogues (hypervitaminosis D), calcium carbonate (milk-alkali syndrome), vitamin A excess.\n\nThiazides decrease urinary calcium excretion. Lithium raises the set-point for PTH suppression. Milk-alkali syndrome (excessive calcium carbonate intake) causes hypercalcemia, metabolic alkalosis, and renal insufficiency."
    difficulty: easy
    tags: [hypercalcemia, drug-induced, thiazides, lithium, endocrinology]
  - front: "What are Chvostek's and Trousseau's signs and what do they indicate?"
    back: "Chvostek's sign: tapping cranial nerve VII anterior to the ear causes ipsilateral facial (orbicularis oris) muscle twitching — indicates latent tetany in hypocalcemia. Trousseau's sign: inflation of a blood pressure cuff above systolic pressure for 3 minutes causes carpal spasm — indicates latent tetany in hypocalcemia.\n\nThese are classic bedside signs of hypocalcemia-induced neuromuscular irritability. Trousseau's sign is more specific. Both reflect increased neuromuscular excitability caused by low calcium."
    difficulty: easy
    tags: [hypocalcemia, Chvostek, Trousseau, tetany, physical exam, endocrinology]
  - front: "What are the acute vs. chronic clinical features of hypocalcemia?"
    back: "Acute: paresthesias, laryngospasm (with stridor), hyperreflexia, tetany, Chvostek's/Trousseau's signs, ECG changes (prolonged QT), psychiatric symptoms, seizures. Chronic: CNS (lethargy, seizures, psychosis, basal ganglia calcification, Parkinsonism, papilledema), CVS (prolonged QT → Torsades de pointes), GI (steatorrhea), endocrine (impaired insulin release), skin (dry, alopecia, brittle nails, candidiasis), MSK (generalized muscle weakness).\n\nTetany is the hallmark of hypocalcemia. Mild tetany: perioral numbness, paresthesias of hands/feet, muscle spasm. Severe tetany: carpopedal spasm, laryngospasm, focal/generalized seizures. Chronic hypocalcemia leads to basal ganglia calcification and Parkinson-like features."
    difficulty: easy
    tags: [hypocalcemia, tetany, clinical features, endocrinology]
  - front: "What is the ECG finding associated with hypocalcemia?"
    back: "Prolonged QT interval, which can lead to Torsades de pointes (a form of ventricular tachycardia).\n\nIn contrast, hypercalcemia shortens the QT interval. Prolonged QT from hypocalcemia is due to prolonged phase 2 of the cardiac action potential. This is a life-threatening arrhythmia requiring urgent calcium replacement."
    difficulty: easy
    tags: [hypocalcemia, ECG, QT prolongation, Torsades de pointes, cardiology, endocrinology]
  - front: "What is the treatment for severe symptomatic hypocalcemia?"
    back: "IV calcium gluconate 1–2 g over 10–20 min followed by slow infusion (1–2 mg/kg/h). If positive Chvostek's/Trousseau's or seizures, give IV calcium bolus (1 amp IV push) first. Must also treat concurrent hypomagnesemia and provide vitamin D replacement (use 1,25-OH vitamin D if hypoparathyroid).\n\nHypomagnesemia must be corrected concurrently — low magnesium impairs PTH secretion and end-organ PTH responsiveness, so calcium will not normalize if hypomagnesemia is untreated. Severe hypocalcemia is a medical emergency."
    difficulty: easy
    tags: [hypocalcemia, treatment, IV calcium, emergency, endocrinology]
  - front: "Why must hypomagnesemia be corrected in hypocalcemia?"
    back: "Hypomagnesemia impairs PTH secretion and reduces end-organ responsiveness to PTH, preventing calcium normalization. Calcium levels will not correct until magnesium is replenished.\n\nThis is a critical pearl: always check and correct Mg²⁺ when treating hypocalcemia. Hypomagnesemia is common in alcoholism, malabsorption, and diuretic use."
    difficulty: easy
    tags: [hypocalcemia, hypomagnesemia, PTH, endocrinology, electrolytes]
  - front: "What is the approach to diagnosing the cause of hypocalcemia using PTH and phosphate levels?"
    back: "1. High PTH + low phosphate: vitamin D deficiency, pseudohypoparathyroidism (if phosphate is high/normal), malabsorption. 2. Low/normal PTH + high phosphate: hypoparathyroidism (post-thyroidectomy, autoimmune, infiltrative, post-surgical). 3. Low Mg²⁺: hypomagnesemia-induced PTH resistance. 4. Check liver/kidney function for vitamin D metabolism defects.\n\nPost-thyroidectomy hypoparathyroidism is the most common cause of permanent hypoparathyroidism (<3% of surgeries). Pseudohypoparathyroidism is characterized by end-organ PTH resistance (high PTH, high phosphate, low calcium)."
    difficulty: medium
    tags: [hypocalcemia, differential diagnosis, PTH, hypoparathyroidism, endocrinology]
  - front: "What is the target serum calcium level when treating hypoparathyroidism?"
    back: "The goal is to raise Ca²⁺ to the low normal range (2.0–2.1 mmol/L) — enough to prevent symptoms but allowing maximum stimulation of PTH secretion.\n\nTreating to high normal calcium in hypoparathyroidism risks hypercalciuria and nephrolithiasis since PTH is absent/low and cannot enhance renal calcium reabsorption. Use 1,25-(OH)₂ vitamin D (calcitriol) since PTH-dependent 1α-hydroxylation is impaired."
    difficulty: medium
    tags: [hypoparathyroidism, hypocalcemia, treatment, endocrinology]
  - front: "What is osteoporosis and how is it diagnosed using bone mineral density (BMD)?"
    back: "Osteoporosis is a condition characterized by decreased bone mass and microarchitectural deterioration with increased fracture susceptibility. Diagnosed by BMD T-score ≤ −2.5 at the hip or lumbar spine by DEXA. Osteopenia: T-score between −1.0 and −2.5.\n\nBMD is measured using dual-energy x-ray absorptiometry (DEXA). The T-score compares patient BMD to the mean peak bone mass of young healthy adults. A T-score ≤ −2.5 meets WHO diagnostic criteria for osteoporosis."
    difficulty: easy
    tags: [osteoporosis, BMD, DEXA, T-score, metabolic bone disease, endocrinology]
  - front: "What are the indications for BMD testing in Canada?"
    back: "BMD testing is suggested in males and postmenopausal females who are: (a) aged 50–64 yr with a previous osteoporosis-related fracture OR ≥2 clinical risk factors; (b) aged 65–69 yr with ≥1 clinical risk factor; (c) aged ≥70 yr (regardless of risk factors).\n\nKey clinical risk factors include: prior fracture after age 40, glucocorticoid use >3 months, ≥2 falls in the past year, parent with hip fracture, BMI <20 kg/m², current smoking, alcohol >3 drinks/day, secondary osteoporosis."
    difficulty: easy
    tags: [osteoporosis, BMD testing, DEXA, screening, endocrinology]
  - front: "What are the two fracture risk assessment tools used in Canada for osteoporosis management?"
    back: "1. WHO Fracture Risk Assessment Tool (FRAX) — estimates 10-year probability of major osteoporotic fracture. 2. Canadian Association of Radiologists and Osteoporosis Canada Risk Assessment Tool (CAROC).\n\nBoth tools stratify patients into low (<15%), intermediate (15–19.9%), or high (≥20%) 10-year fracture risk. Risk stratification guides pharmacotherapy decisions. Patients with T-score ≤ −2.5 and age >70 are automatically high risk."
    difficulty: easy
    tags: [osteoporosis, FRAX, CAROC, fracture risk, endocrinology]
  - front: "What are the Health Canada–recommended dietary calcium and vitamin D intakes for adults with osteoporosis?"
    back: "Calcium: 1000 mg/day (males 51–70 yr); 1200 mg/day (females >50 yr and males >70 yr). No supplements needed if adequate dietary intake. Vitamin D: 600 IU/day (age 51–70 yr) and 800 IU/day (age >70 yr). Adults >50 yr should take a supplement of 400 IU/day in addition to vitamin D–rich foods.\n\nCombined calcium and vitamin D supplementation reduces total fracture risk by ~6% and hip fracture risk by ~16% (JAMA Netw Open 2019). Vitamin D alone does not significantly reduce fracture risk. High-dose vitamin D (≥4000 IU/day) may paradoxically decrease BMD."
    difficulty: easy
    tags: [osteoporosis, calcium, vitamin D, treatment, endocrinology]
  - front: "What are the first-line pharmacological treatments for osteoporosis and their fracture prevention evidence?"
    back: "First-line treatments (Grade A): 1. Bisphosphonates (alendronate PO, risedronate PO, zoledronic acid IV) — inhibit osteoclasts; prevent hip, nonvertebral, and vertebral fractures. 2. Denosumab (RANKL inhibitor) — prevents hip, nonvertebral, and vertebral fractures. Note: Denosumab must NOT be abruptly stopped (risk of multiple vertebral fractures from rebound bone turnover).\n\nBisphosphonates are first-line. Denosumab is an alternative first-line option, particularly in postmenopausal women at high fracture risk. Teriparatide (PTH analogue, 18–24 months) and romosozumab (sclerostin inhibitor, 12 months) are anabolic agents for high-risk patients."
    difficulty: easy
    tags: [osteoporosis, bisphosphonates, denosumab, treatment, endocrinology]
  - front: "Why must denosumab not be abruptly stopped?"
    back: "Abrupt discontinuation of denosumab leads to a rebound increase in bone turnover (osteoclast activity surges), causing rapid bone loss and an increased risk of multiple vertebral fractures.\n\nUnlike bisphosphonates (which remain in bone), denosumab is a monoclonal antibody with a finite half-life. After stopping, RANKL-mediated osteoclast activity rebounds dramatically. Patients must transition to a bisphosphonate when discontinuing denosumab."
    difficulty: medium
    tags: [denosumab, RANKL, osteoporosis, treatment, endocrinology]
  - front: "What is the mechanism and use of teriparatide in osteoporosis?"
    back: "Teriparatide is a recombinant PTH analogue (PTH 1-34). Given as intermittent SC injection, it has an anabolic effect on bone (stimulates osteoblasts more than osteoclasts), significantly reducing vertebral (RR 0.27) and nonvertebral (RR 0.62) fractures. Duration is 18–24 months, followed by long-term antiresorptive therapy.\n\nThe paradox: continuous PTH (as in hyperparathyroidism) causes bone resorption, but intermittent PTH (teriparatide) stimulates bone formation. It is used for high-risk patients who fail or cannot take bisphosphonates. Must be followed by bisphosphonate or RANKL inhibitor to maintain gains."
    difficulty: medium
    tags: [teriparatide, PTH analogue, osteoporosis, anabolic, endocrinology]
  - front: "What is the role of raloxifene (SERM) in osteoporosis management?"
    back: "Raloxifene is a selective estrogen-receptor modulator with agonistic effects on bone and antagonistic effects on uterus and breast. It prevents vertebral fractures (Grade A evidence). Advantages: reduces fracture risk, improves lipid profile, reduces breast cancer risk by 24%. Disadvantages: increased DVT/PE, stroke mortality, hot flashes, leg cramps.\n\nRaloxifene does not prevent hip or nonvertebral fractures, distinguishing it from bisphosphonates and denosumab. It is an option for postmenopausal women with osteoporosis who cannot tolerate bisphosphonates, particularly those at high breast cancer risk."
    difficulty: easy
    tags: [raloxifene, SERM, osteoporosis, postmenopausal, endocrinology]
  - front: "What is a fragility fracture and what are the most common sites?"
    back: "A fragility fracture is a fracture from a fall from standing height or less (excluding fractures of the hand, face, cervical spine, fingers, and toes). Most common sites: hip, vertebrae, humerus, and wrist.\n\nFragility fractures are pathognomonic of osteoporosis in the absence of other metabolic bone disease. Vertebral compression fractures may appear as wedge fractures on x-ray (minimum 20% height loss). A prior fragility fracture is a strong predictor of future fracture risk."
    difficulty: easy
    tags: [fragility fracture, osteoporosis, endocrinology]
  - front: "What is the effect of glucocorticoid therapy on bone metabolism?"
    back: "Glucocorticoids cause bone loss through: increased bone resorption, decreased bone formation, increased urinary calcium loss, decreased intestinal calcium absorption, and impaired sex hormone and growth hormone production. Patients on ≥7.5 mg prednisone daily for >3 months should be assessed for fracture risk.\n\nGlucocorticoid-induced osteoporosis (GIOP) is the most common form of secondary osteoporosis. Risk of fracture is disproportionate to BMD loss. Bisphosphonates are the first-line treatment/prevention for GIOP."
    difficulty: easy
    tags: [glucocorticoids, osteoporosis, secondary osteoporosis, endocrinology]
  - front: "What are the physical examination findings that suggest vertebral fracture or osteoporosis?"
    back: "Height loss >3 cm (Sn 92%), weight <51 kg (Sp 97%), kyphosis (Sp 92%), tooth count <20 (Sp 92%), reduced grip strength, occiput-to-wall distance >0 cm, rib-to-pelvis distance <2 fingerbreadths (Sn 88%).\n\nThe wall-occiput test and rib-pelvis distance test are simple bedside screens for thoracic and lumbar vertebral fractures, respectively. Kyphosis results from anterior wedge compression fractures of thoracic vertebral bodies."
    difficulty: easy
    tags: [osteoporosis, vertebral fracture, physical exam, endocrinology]
  - front: "What is osteomalacia/rickets and what conditions predispose to it?"
    back: "Osteomalacia (adults)/rickets (children): osteopenia with disordered mineralization leading to increased unmineralized osteoid. Caused by: vitamin D deficiency (nutritional, malabsorption, liver/kidney disease, anticonvulsants, nephrotic syndrome), calcium deficiency, hypophosphatemia (Fanconi syndrome, X-linked hypophosphatemic rickets, tumour-induced), enzyme deficiency (hypophosphatasia), and calcification inhibitors (aluminum, fluoride).\n\nThe hallmark is excess osteoid (unmineralized matrix). Rickets occurs before epiphyseal closure; osteomalacia occurs after. Anticonvulsants (phenytoin, carbamazepine, phenobarbital) impair vitamin D hydroxylation in the liver."
    difficulty: easy
    tags: [osteomalacia, rickets, vitamin D deficiency, metabolic bone disease, endocrinology]
  - front: "What are the clinical features distinguishing rickets from osteomalacia?"
    back: "Rickets (children): skeletal deformities, bow-legs, fracture susceptibility, weakness, hypotonia, disturbed growth, rachitic rosary (prominent costochondral junctions), Harrison's groove (indentation of lower ribs), hypocalcemia. Osteomalacia (adults): less severe deformities, diffuse skeletal pain, bone tenderness, fractures, waddling gait, proximal muscle weakness, hypotonia.\n\nRickets is more clinically dramatic due to active growth plates. Osteomalacia presents subtly with vague bone pain and weakness. Both share biochemical features of impaired mineralization."
    difficulty: easy
    tags: [rickets, osteomalacia, clinical features, metabolic bone disease, endocrinology, pediatrics]
  - front: "What are the laboratory findings in vitamin D deficiency osteomalacia?"
    back: "Decreased serum phosphate, decreased to normal serum calcium, increased ALP, may have decreased calcitriol (1,25-(OH)₂ vitamin D). Secondary hyperparathyroidism (high PTH) is typical.\n\nIncreased ALP reflects increased osteoblastic activity trying to compensate for poor mineralization. Compare to hypophosphatemia-related osteomalacia: phosphate is low, calcium is normal, ALP is elevated. Proximal renal tubular acidosis-related disease: phosphate low, calcium normal, ALP normal, with hyperchloremic metabolic acidosis."
    difficulty: easy
    tags: [osteomalacia, vitamin D deficiency, laboratory findings, ALP, endocrinology]
  - front: "What radiographic findings are seen in osteomalacia?"
    back: "Pseudofractures (Looser zones) — wide transverse lucencies traversing a bone, thought to be healed stress fractures; loss of distinctness of vertebral body trabeculae; concavity of vertebral bodies; subperiosteal resorption of phalanges (from secondary hyperparathyroidism); bowing of tibia.\n\nLooser zones (pseudofractures) are pathognomonic of osteomalacia. They represent fissures filled with unmineralized osteoid. Bone biopsy (showing excess unmineralized osteoid) is the gold standard but rarely needed."
    difficulty: easy
    tags: [osteomalacia, radiology, Looser zones, pseudofractures, endocrinology]
  - front: "What is renal osteodystrophy and what are its four bone disease subtypes?"
    back: "Renal osteodystrophy refers to changes in mineral metabolism and bone structure secondary to CKD. Four subtypes: 1. Osteomalacia (low turnover, excess osteoid). 2. Adynamic bone disease (low turnover from excessive PTH suppression). 3. Osteitis fibrosa cystica (high turnover from secondary hyperparathyroidism). 4. Mixed uremic osteodystrophy (both high and low turnover, marrow fibrosis, excess osteoids).\n\nThe pathophysiology involves hyperphosphatemia (inhibits 1,25(OH)₂ vitamin D synthesis) and loss of renal mass (reduced 1α-hydroxylase). This leads to low calcitriol, hypocalcemia, and secondary hyperparathyroidism. Metastatic calcification from hyperphosphatemia is a complication."
    difficulty: medium
    tags: [renal osteodystrophy, CKD, secondary hyperparathyroidism, metabolic bone disease, nephrology, endocrinology]
  - front: "Why are bisphosphonates and denosumab generally not used in renal osteodystrophy?"
    back: "Bisphosphonates and denosumab can worsen the adynamic component of renal osteodystrophy and are contraindicated at low eGFRs. Bone biopsy may be needed to identify if increased bone turnover is present before considering bisphosphonates.\n\nIn adynamic bone disease, bone turnover is already suppressed; further suppression with antiresorptive agents would worsen the condition. Activated vitamin D (calcitriol) is preferred with close monitoring to prevent hypercalcemia and metastatic calcification."
    difficulty: medium
    tags: [renal osteodystrophy, bisphosphonates, CKD, adynamic bone disease, endocrinology]
  - front: "What is Paget's disease of bone and what is the proposed etiology?"
    back: "Paget's disease is a metabolic bone disease characterized by excessive bone destruction followed by structurally abnormal repair. Proposed etiology: slowly progressive viral infection of osteoclasts (possibly paramyxovirus) in genetically predisposed individuals. Strong familial incidence.\n\nPrevalence: ~3% of population; up to 10% in those >80 years. The cycle begins with increased osteoclastic resorption, followed by compensatory osteoblastic activity producing woven (disorganized, fragile) bone. Elevated ALP with normal GGT in an older adult should prompt consideration of Paget's."
    difficulty: easy
    tags: [Pagets disease, bone, metabolic bone disease, endocrinology]
  - front: "What are the three characteristic radiographic findings of Paget's disease of bone?"
    back: "1. Osteolytic lesions (lytic phase — 'blade of grass' leading edge in long bones). 2. Cortical thickening ('cotton wool' or 'jigsaw/mosaic pattern'). 3. Pseudofractures (small fissures on the convex surface of deformed long bones — 'banana fractures' are horizontal pathological fractures).\n\nOther named signs: 'osteoporosis circumscripta' (radiolucent skull regions), 'tam o'Shanter sign' (skull enlargement/expansion), 'picture frame vertebra' (thickened vertebral cortex), 'ivory vertebra' (diffuse vertebral sclerosis), 'Looser zones' (wide transverse lucencies). Plain x-ray of skull, abdomen, and tibiae are initial screening."
    difficulty: medium
    tags: [Pagets disease, radiology, bone, endocrinology]
  - front: "What are the characteristic laboratory findings in Paget's disease of bone?"
    back: "High serum ALP (markedly elevated, reflects increased bone turnover), normal or high Ca²⁺, normal PO₄³⁻, normal LFTs (normal PT/INR, aPTT, albumin, bilirubin, GGT), elevated PINP (procollagen type I N-terminal propeptide — bone formation marker).\n\nThe key distinguishing feature is high ALP with normal GGT — ruling out hepatic cause. ALP elevation reflects osteoblastic activity during the repair phase. Normal phosphate helps distinguish from osteomalacia."
    difficulty: easy
    tags: [Pagets disease, ALP, laboratory findings, endocrinology]
  - front: "What are the most common bones affected by Paget's disease?"
    back: "Most commonly: skull, thoracolumbar spine, pelvis, and long bones of the lower extremities (particularly femur and tibia).\n\nClinical manifestations at these sites include: deafness (cranial nerve VIII compression from skull thickening), spinal stenosis, bowed tibias, kyphosis, and pelvic deformities. Paget's disease is usually asymptomatic and found incidentally on x-ray or elevated ALP."
    difficulty: easy
    tags: [Pagets disease, bone, anatomy, endocrinology]
  - front: "What are the local and systemic complications of Paget's disease of bone?"
    back: "Local: fractures, osteoarthritis, cranial nerve compression/palsies (e.g., deafness CN VIII), spinal cord compression, osteosarcoma/sarcomatous transformation (1–3%) — indicated by marked bone pain, new lytic lesions, suddenly increased ALP. Systemic: hypercalcemia and nephrolithiasis (with immobilization), high-output CHF (from increased vascularity of pagetic bone).\n\nOsteosarcoma transformation is rare but carries very poor prognosis. High-output CHF occurs because extensive pagetic bone acts as an arteriovenous shunt. Sarcomatous change is suggested by sudden marked increase in ALP and severe pain."
    difficulty: medium
    tags: [Pagets disease, complications, osteosarcoma, endocrinology]
  - front: "What is the treatment for Paget's disease of bone?"
    back: "Goals: decrease pain and rate of remodelling. Treat medically if symptomatic OR asymptomatic with ALP >3× normal OR planned surgery. First-line: bisphosphonates — zoledronic acid 5 mg IV/year (preferred), or alendronate 40 mg PO daily × 6 months, or risedronate 30 mg PO daily × 3 months. If bisphosphonate-intolerant: calcitonin 50–100 units/day SC. Surgery for fractures, deformity, or resistant osteoarthritis.\n\nBisphosphonates suppress osteoclast activity, reducing bone turnover. Adequate calcium and vitamin D intake is important to prevent secondary hyperparathyroidism. Weight-bearing exercise is encouraged."
    difficulty: easy
    tags: [Pagets disease, treatment, bisphosphonates, zoledronic acid, endocrinology]
  - front: "What is the hypothalamic-pituitary-gonadal axis in males?"
    back: "GnRH (from hypothalamus) → stimulates LH and FSH from anterior pituitary → LH stimulates Leydig cells (testosterone production); FSH stimulates Sertoli cells (spermatogenesis, inhibin production). Testosterone provides negative feedback on LH/GnRH; inhibin suppresses FSH.\n\nTestosterone is primarily involved in negative feedback on LH and GnRH. Inhibin B from Sertoli cells specifically suppresses FSH. This axis regulation is the basis for understanding hypogonadism patterns (primary vs. secondary)."
    difficulty: easy
    tags: [male reproductive, HPG axis, testosterone, LH, FSH, endocrinology]
  - front: "What tests are used to evaluate testicular function?"
    back: "1. Testicular size (lower limit: 4 cm × 2.5 cm or 12–25 mL volume by orchidometer). 2. LH, FSH, total, bioavailable, and/or free testosterone. 3. Semen analysis (volume, sperm concentration, morphology, motility). 4. Testicular biopsy (indicated with normal FSH and azoospermia/oligospermia).\n\nMorning fasting testosterone (8–9 AM) is the preferred initial test, as testosterone peaks in the morning. Testosterone testing should be confirmed on 2 separate analyses if low. Free testosterone is important if SHBG is altered (e.g., obesity, liver disease)."
    difficulty: easy
    tags: [hypogonadism, male infertility, testosterone, semen analysis, endocrinology]
  - front: "How is testosterone deficiency syndrome (adult-onset primary hypogonadism) diagnosed?"
    back: "Requires BOTH: 1. Clinical manifestations of testosterone deficiency (symptoms/signs). 2. Documented total testosterone below the laboratory reference range, confirmed on 2 separate fasting morning (8–9 AM) analyses.\n\nTestosterone is measured fasting in the morning (8–9 AM) when levels are at their peak. Secondary causes must be ruled out. Free testosterone is measured if SHBG is altered or total T is borderline."
    difficulty: easy
    tags: [hypogonadism, testosterone deficiency, diagnosis, endocrinology]
  - front: "What distinguishes primary (hypergonadotropic) from secondary (hypogonadotropic) hypogonadism?"
    back: "Primary (hypergonadotropic) hypogonadism: primary testicular failure → high LH and FSH, low testosterone and sperm count. Secondary (hypogonadotropic) hypogonadism: hypothalamic-pituitary axis failure → low/normal LH and FSH (inappropriately normal), low testosterone and sperm count.\n\nIn primary hypogonadism, the pituitary tries to compensate with elevated gonadotropins. In secondary hypogonadism, the pituitary fails to mount this response. A key clinical pearl: in primary hypogonadism, sperm count is affected to a greater extent than serum testosterone."
    difficulty: easy
    tags: [hypogonadism, primary hypogonadism, secondary hypogonadism, LH, FSH, endocrinology]
  - front: "What are the congenital causes of primary (hypergonadotropic) hypogonadism?"
    back: "Klinefelter syndrome (47,XXY), Noonan syndrome, cryptorchidism, disorders of sexual development (DSD), bilateral anorchia (vanishing testis syndrome), myotonic dystrophy, mutations of FSH or LH receptor gene, disorders of androgen synthesis, germ cell defects, Sertoli cell–only syndrome, Leydig cell aplasia/failure.\n\nKlinefelter syndrome (47,XXY) is the most common chromosomal cause of male hypogonadism, presenting with small firm testes, azoospermia, gynecomastia, tall stature, and cognitive issues. Karyotype is essential for diagnosis."
    difficulty: easy
    tags: [hypogonadism, Klinefelter, primary hypogonadism, congenital, endocrinology]
  - front: "What are the causes of secondary (hypogonadotropic) hypogonadism?"
    back: "Congenital: Kallmann syndrome (GnRH deficiency + anosmia), Prader-Willi syndrome, abnormal LH/FSH subunit. Acquired: hyperprolactinemia, pituitary/hypothalamic tumours, hypopituitarism, drugs (alcohol, cannabis, spironolactone, ketoconazole, GnRH agonists, anabolic steroids, opioids), chronic illness (cirrhosis, renal failure, AIDS, sarcoidosis, hemochromatosis), obesity, critical illness.\n\nKallmann syndrome: GnRH deficiency + anosmia (absent smell due to failure of GnRH neuron migration). Hemochromatosis deposits iron in the pituitary, causing secondary hypogonadism. Hyperprolactinemia suppresses GnRH pulsatility."
    difficulty: medium
    tags: [hypogonadism, secondary hypogonadism, Kallmann syndrome, hyperprolactinemia, endocrinology]
  - front: "What is the definition of male infertility and what is the timeline for investigation?"
    back: "Infertility: failure of a couple to conceive after 12 months of regular intercourse without contraception (in women <35 yr); after 6 months if the woman is ≥35 yr. Male factor contributes to ~50% of cases. Initial workup: semen analysis ×2.\n\nSemen analysis should assess volume, sperm concentration, morphology, and motility. If semen analysis is abnormal, workup includes LH, FSH, total testosterone, prolactin, thyroid function, DNA fragmentation, karyotype, and Y chromosome deletion analysis. Scrotal ultrasound looks for varicocele."
    difficulty: easy
    tags: [male infertility, semen analysis, endocrinology, urology]
  - front: "What additional investigations are indicated in secondary hypogonadism to identify the underlying cause?"
    back: "Prolactin levels, iron saturation (hemochromatosis), pituitary MRI (if hyperprolactinemia, pituitary tumour, or unexplained secondary hypogonadism), free T4 and 8 AM cortisol (pituitary panel), karyotype (if Klinefelter suspected), Y chromosome deletion analysis.\n\nSecondary hypogonadism has a lower LH/FSH with low testosterone. The pituitary MRI is critical to exclude prolactinoma or other hypothalamic-pituitary lesions. Iron overload in hemochromatosis preferentially deposits in the pituitary gonadotrophs, causing selective LH/FSH deficiency."
    difficulty: medium
    tags: [hypogonadism, secondary hypogonadism, pituitary MRI, prolactin, hemochromatosis, endocrinology]
  - front: "What are the named radiographic signs in Paget's disease of bone and what do they describe?"
    back: "Tam o'Shanter: overall enlargement of cranium with skull falling over facial bones (advanced skull Paget's). Blade of grass: lucent leading edge in long bone lytic phase. Osteoporosis circumscripta: radiolucent skull regions. Jigsaw/mosaic pattern: thickened disorganized trabeculae with areas of sclerosis. Picture frame vertebra: thickened vertebral body cortex. Cotton wool: thickened sclerotic trabeculae. Banana fracture: horizontal pathological fracture in deformed long bone. Ivory vertebra: diffuse homogeneous vertebral sclerosis.\n\nThese eponymous radiographic findings are classic MCCQE1 exam material. Confirmation of diagnosis requires x-ray findings. Bone scan evaluates extent of metabolically active disease. MRI/CT are not recommended for diagnosis but may assess complications."
    difficulty: medium
    tags: [Pagets disease, radiology, eponymous signs, endocrinology]
  - front: "Which vitamin D level thresholds define sufficiency, insufficiency, and deficiency in Canada?"
    back: "<30 nmol/L: high risk of vitamin D deficiency. 30–50 nmol/L: potential risk of inadequacy for bone health. >50 nmol/L: adequate for bone and overall health. ≥125 nmol/L: potential adverse effects. Measured as 25-OH vitamin D (calcidiol).\n\n25-OH vitamin D is the best marker of vitamin D status. Vitamin D deficiency leads to impaired calcium absorption, secondary hyperparathyroidism, and osteomalacia/rickets. Risk factors for deficiency: malabsorption, reduced skin synthesis, liver/renal failure, nephrotic syndrome, anticonvulsants, parathyroid disorders."
    difficulty: easy
    tags: [vitamin D, deficiency, sufficiency, 25-OH vitamin D, endocrinology]
  - front: "What are the absolute contraindications to testosterone replacement therapy?"
    back: "Prostate or breast cancer, palpable prostate nodule, PSA >4 ng/mL, elevated hematocrit, untreated severe OSA, severe LUTS, uncontrolled CHF, MI or stroke within last 6 months, thrombophilia.\n\nTestosterone therapy stimulates prostate tissue and can worsen erythrocytosis, OSA, and cardiovascular/thromboembolic conditions. Canadian guidelines emphasize ruling out prostate cancer prior to initiation and monitoring hematocrit regularly during therapy."
    difficulty: medium
    tags: [endocrinology, hypogonadism, testosterone, contraindications]
  - front: "A 28-year-old man with hypogonadal infertility due to a pituitary adenoma is started on fertility-directed therapy. What is the preferred treatment?"
    back: "hCG plus recombinant FSH (rFSH). GnRH agonist in pulsatile fashion is used for hypothalamic dysfunction with intact pituitary; hCG + rFSH is used for both hypothalamic and pituitary lesions.\n\nPituitary lesions prevent endogenous gonadotropin secretion, so exogenous gonadotropins (hCG mimics LH, rFSH provides FSH) are needed to stimulate spermatogenesis. Pulsatile GnRH only works when the pituitary is intact."
    difficulty: hard
    tags: [endocrinology, hypogonadism, infertility, fertility treatment]
  - front: "Why does testosterone replacement therapy cause infertility?"
    back: "Exogenous testosterone suppresses the hypothalamic-pituitary-gonadal (HPG) axis, reducing GnRH, LH, and FSH secretion, which decreases spermatogenesis and reduces sperm counts.\n\nThis is a key clinical pitfall: men seeking both symptom relief and fertility should not receive testosterone therapy. Instead, gonadotropins or pulsatile GnRH should be used to preserve fertility."
    difficulty: medium
    tags: [endocrinology, hypogonadism, testosterone, infertility, HPG axis]
  - front: "Which hereditary disorders are associated with male infertility and what is their mechanism?"
    back: "Kartagener syndrome (primary ciliary dyskinesia — immotile sperm) and cystic fibrosis (congenital bilateral absence of the vas deferens — obstructive azoospermia).\n\nKartagener syndrome causes dynein arm defects impairing ciliary/flagellar motility, rendering sperm non-motile. CF mutations (particularly CFTR) lead to aplasia of the vas deferens, causing obstructive azoospermia without systemic CF symptoms in some carriers."
    difficulty: medium
    tags: [endocrinology, male infertility, genetics, Kartagener, cystic fibrosis]
  - front: "What are the effects of testosterone deficiency in the first trimester in utero?"
    back: "Incomplete virilization of external genitalia (ambiguous genitalia) and incomplete development of Wolffian ducts, causing male pseudohermaphroditism.\n\nTestosterone and DHT are essential for male sexual differentiation during the first trimester. The Wolffian ducts give rise to epididymis, vas deferens, and seminal vesicles; their failure to develop results in lack of internal male genitalia."
    difficulty: hard
    tags: [endocrinology, androgen deficiency, sexual differentiation, embryology]
  - front: "What are the effects of testosterone deficiency occurring in the third trimester in utero?"
    back: "Micropenis and cryptorchidism (failure of normal testicular descent).\n\nTesticular descent and penile growth in the third trimester require adequate androgen stimulation. Deficiency at this stage does not affect internal genitalia (already developed) but impairs growth and descent."
    difficulty: medium
    tags: [endocrinology, androgen deficiency, cryptorchidism, micropenis]
  - front: "What is eunuchoidal body habitus and what causes it?"
    back: "Greater growth of extremity long bones relative to axial bones (arm span > height, pubic-to-floor > crown-to-pubis), caused by prepubertal testosterone deficiency, which delays epiphyseal closure.\n\nTestosterone normally closes the epiphyses at puberty. In its absence, long bones continue to grow, producing a distinctive skeletal proportions. This is a classic finding in Klinefelter syndrome and other prepubertal hypogonadism."
    difficulty: medium
    tags: [endocrinology, hypogonadism, eunuchoidal habitus, Klinefelter]
  - front: "What are the postpubertal clinical features of testosterone deficiency?"
    back: "Decreased energy, mood, and libido; fine wrinkles at corners of mouth and eyes; decreased pubic/axillary hair, hematocrit, muscle mass, strength, and bone mineral density (BMD).\n\nPostpubertal androgen deficiency does not reverse established secondary sex characteristics but leads to gradual regression. BMD loss predisposes to osteoporosis, and decreased erythropoiesis causes a mild normochromic normocytic anemia."
    difficulty: easy
    tags: [endocrinology, hypogonadism, testosterone deficiency, clinical features]
  - front: "What is true gynecomastia and how does it differ from pseudogynecomastia?"
    back: "True gynecomastia is benign proliferation of the glandular component of the male breast, forming a concentric, rubbery, firm mass around the nipple. Pseudogynecomastia (lipomastia) is enlargement of soft adipose tissue without glandular proliferation, common in obese men.\n\nDistinguishing these on exam is critical: gynecomastia is concentric, rubbery, and not fixed, while lipomastia is soft and diffuse. True gynecomastia warrants investigation for hormonal causes; pseudogynecomastia generally does not."
    difficulty: easy
    tags: [endocrinology, gynecomastia, breast, male]
  - front: "What is the trimodal distribution of physiologic gynecomastia?"
    back: "Neonatal, pubertal, and older males (ages 50–80). It peaks between ages 13–44 and spontaneously regresses in 90% of cases.\n\nIn neonates, maternal estrogens cause transient gynecomastia. In puberty, the estrogen-to-androgen ratio is transiently elevated. In older men, decreased testosterone production with peripheral aromatization of androgens to estrogen causes the imbalance."
    difficulty: easy
    tags: [endocrinology, gynecomastia, physiologic]
  - front: "List six drug classes that commonly cause gynecomastia."
    back: "Spironolactone, cimetidine, digoxin, ketoconazole, antiandrogens/GnRH agonists/5-alpha-reductase inhibitors (e.g., androgen deprivation therapy), and anabolic steroids/doping agents.\n\nThe mnemonic DOC TECH covers common culprits: Digoxin, hCG/recombinant GH, Isoniazid, Spironolactone, Cimetidine/Ketoconazole, Estrogen/anti-testosterone agents, Testicular damage. All cause gynecomastia by either increasing estrogen activity or decreasing androgen activity."
    difficulty: medium
    tags: [endocrinology, gynecomastia, drug-induced, pharmacology]
  - front: "What pathophysiologic mechanism underlies gynecomastia?"
    back: "Hormonal imbalance: increased estrogen activity (increased production/precursors or decreased metabolism) OR decreased androgen activity (decreased production, increased SHBG binding, or androgen receptor blockade).\n\nThe net effect is a shift in the estrogen-to-androgen ratio in favour of estrogen. Any condition or drug that tips this balance causes glandular breast proliferation. This is why cirrhosis (impaired estrogen catabolism) and Klinefelter syndrome (primary hypogonadism) both cause gynecomastia."
    difficulty: medium
    tags: [endocrinology, gynecomastia, pathophysiology, estrogen, androgen]
  - front: "What red flags on breast exam suggest male breast cancer rather than benign gynecomastia?"
    back: "Unilateral mass, eccentric (not concentric) location, hard or fixed mass, skin dimpling or retraction, and nipple discharge (especially bloody) or crusting.\n\nGynecomastia is concentric around the nipple, rubbery, and not fixed to underlying tissue. Any deviation from this pattern warrants further investigation with breast ultrasound and diagnostic mammography (90% sensitivity and specificity for distinguishing malignant from benign)."
    difficulty: medium
    tags: [endocrinology, gynecomastia, breast cancer, red flags]
  - front: "What investigations are indicated in the workup of gynecomastia?"
    back: "Serum TSH, PRL, LH, FSH, total testosterone, estradiol, LFTs, creatinine, hCG (if elevated, locate primary tumour); ± breast U/S and mammography if malignancy cannot be excluded clinically; CXR and CT chest/abdomen/pelvis if neoplasm suspected.\n\nThe investigation is guided by clinical findings: hCG elevation points to a germ cell or hCG-secreting tumour, elevated estradiol to an adrenal or testicular tumour, low testosterone/high LH to primary hypogonadism, and elevated TSH/LFTs to systemic disease."
    difficulty: hard
    tags: [endocrinology, gynecomastia, investigations]
  - front: "What is the first-line medical treatment for gynecomastia and when is surgery indicated?"
    back: "First line: correct the underlying disorder and discontinue the responsible drug. Medical: tamoxifen (anti-estrogen, most evidence for benefit). Surgical: for longstanding gynecomastia (>12 months, fibrotic), significant discomfort, or psychological distress.\n\nMost gynecomastia resolves with removal of the offending cause. Tamoxifen blocks estrogen receptors in breast tissue. Surgery is reserved for fibrotic/longstanding cases where medical therapy is unlikely to reverse glandular changes."
    difficulty: medium
    tags: [endocrinology, gynecomastia, treatment, tamoxifen]
  - front: "What is a paraneoplastic syndrome and what is its general mechanism?"
    back: "Clinical syndromes involving non-metastatic systemic effects accompanying malignant disease, triggered by: (1) antibodies against the neoplasm cross-reacting with normal tissue, or (2) production of a physiologically active substance by the neoplasm.\n\nParaneoplastic syndromes can affect any organ system. They are important clinically because they may be the presenting feature of an occult malignancy and can cause significant morbidity independent of tumour burden."
    difficulty: easy
    tags: [endocrinology, paraneoplastic syndrome, oncology]
  - front: "Which malignancy most commonly causes ectopic ACTH secretion and what syndrome does it produce?"
    back: "Small cell lung cancer (also pancreatic carcinoma, neuroendocrine tumours, thymoma). It produces Cushing's syndrome via ectopic ACTH or ACTH-mimicking substance secretion.\n\nEctopic Cushing's from small cell lung cancer often presents with rapid onset, severe hypokalemia, and less prominent adiposity compared to pituitary-driven Cushing's. Cortisol levels are very high and often do not suppress with high-dose dexamethasone."
    difficulty: medium
    tags: [endocrinology, paraneoplastic, Cushings syndrome, ectopic ACTH, lung cancer]
  - front: "What malignancies are associated with SIADH as a paraneoplastic syndrome?"
    back: "Small cell lung cancer and CNS malignancies.\n\nSIADH causes euvolemic hyponatremia with inappropriately concentrated urine. Symptoms include oliguria, nausea/vomiting, headache, confusion, fatigue, muscle weakness/cramps, and seizures. Treatment involves fluid restriction and treating the underlying tumour."
    difficulty: medium
    tags: [endocrinology, paraneoplastic, SIADH, hyponatremia, lung cancer]
  - front: "What is the mechanism of paraneoplastic hypercalcemia and which cancers are most commonly responsible?"
    back: "Secretion of PTH-related protein (PTHrP), TGF-alpha, or TNF by the tumour. Associated cancers: lung cancer, breast carcinoma, renal cell carcinoma, multiple myeloma, ovarian carcinoma.\n\nPTHrP mimics PTH action on bone and kidney, increasing calcium reabsorption and bone resorption. This is distinct from osteolytic hypercalcemia of myeloma (local osteoclast activation) and from primary hyperparathyroidism."
    difficulty: hard
    tags: [endocrinology, paraneoplastic, hypercalcemia, PTHrP]
  - front: "What is Lambert-Eaton myasthenic syndrome (LEMS), which cancer causes it, and what is its mechanism?"
    back: "LEMS is a paraneoplastic neuromuscular disorder associated with small cell lung cancer. Autoantibodies interfere with presynaptic voltage-gated calcium channels, reducing acetylcholine (ACh) release, causing proximal limb muscle weakness.\n\nUnlike myasthenia gravis (postsynaptic ACh receptor antibodies, worse with repetition), LEMS typically improves with repetitive muscle use (post-tetanic facilitation). It is also associated with autonomic dysfunction."
    difficulty: hard
    tags: [endocrinology, paraneoplastic, LEMS, small cell lung cancer, neuromuscular]
  - front: "What paraneoplastic endocrine syndrome is associated with hepatocellular carcinoma and fibrosarcoma, and what is the mechanism?"
    back: "Paraneoplastic hypoglycemia, caused by secretion of insulin or insulin-like substances (e.g., IGF-2) by the tumour.\n\nIGF-2 from large mesenchymal tumours (fibrosarcoma, GIST) or hepatocellular carcinomas binds insulin receptors causing hypoglycemia. This is distinct from insulinoma, which secretes actual insulin. Clinically presents with tachycardia, tremor, diaphoresis, and dizziness."
    difficulty: hard
    tags: [endocrinology, paraneoplastic, hypoglycemia, IGF-2, hepatocellular carcinoma]
  - front: "What are the clinical features of carcinoid syndrome and what mediates them?"
    back: "Flushing, diarrhea, shortness of breath, tachycardia. Mediated by serotonin and bradykinin secretion from gastrointestinal neuroendocrine tumours.\n\nCarcinoid syndrome typically occurs when metastatic disease allows mediators to bypass first-pass hepatic inactivation. Serotonin drives diarrhea and cardiac fibrosis; bradykinin causes flushing. Diagnosis is confirmed with 24-hour urine 5-HIAA."
    difficulty: medium
    tags: [endocrinology, carcinoid syndrome, paraneoplastic, serotonin]
  - front: "What is the mechanism of action of metformin, and what are its absolute contraindications?"
    back: "Sensitizes peripheral tissues to insulin, increases glucose uptake, and decreases hepatic glucose production via stimulation of hepatic AMP-activated protein kinase (AMPK). Absolute contraindications: moderate-to-severe liver dysfunction, renal dysfunction (GFR <15 mL/min), cardiac dysfunction.\n\nMetformin reduces hepatic gluconeogenesis and improves both fasting and postprandial hyperglycemia. It is weight neutral with negligible hypoglycemia risk as monotherapy. Lactic acidosis risk is the concern in renal/hepatic failure. HbA1c reduction ~1.5%."
    difficulty: medium
    tags: [endocrinology, diabetes, metformin, biguanide, pharmacology]
  - front: "What are the key side effects of metformin?"
    back: "GI upset (abdominal discomfort, bloating, diarrhea) and vitamin B12 deficiency. It is weight neutral with negligible hypoglycemia risk as monotherapy.\n\nGI side effects are minimized by dose titration and taking with food. Vitamin B12 deficiency occurs in up to 30% of long-term users due to reduced ileal absorption; periodic B12 monitoring is recommended by Canadian Diabetes Association guidelines."
    difficulty: easy
    tags: [endocrinology, diabetes, metformin, side effects]
  - front: "How do sulfonylureas work, what is their HbA1c reduction, and which has the lowest hypoglycemia risk?"
    back: "Stimulate insulin release from beta cells by closing K+ channels → depolarization → Ca2+-mediated insulin release. HbA1c reduction ~1%. Gliclazide has the lowest incidence of hypoglycemia among sulfonylureas.\n\nSulfonylureas are effective but cause weight gain and hypoglycemia. Glyburide should be avoided in the elderly (prolonged action, increased hypoglycemia risk). Dose adjustment needed in renal dysfunction for glyburide and glimepiride; avoid in severe renal dysfunction."
    difficulty: medium
    tags: [endocrinology, diabetes, sulfonylurea, pharmacology, hypoglycemia]
  - front: "What are meglitinides (non-sulfonylurea secretagogues), and what is their clinical advantage?"
    back: "Short-acting insulin secretagogues (repaglinide, nateglinide) that close K+ channels. Short half-life (~1 hour) causes brief, rapid insulin release, making them effective for postprandial glucose control. Must be dosed with meals.\n\nMeglitinides carry less hypoglycemia risk than sulfonylureas due to their brief action. They are not to be combined with sulfonylureas or preprandial insulin. More costly than sulfonylureas; HbA1c reduction 0.5–1%."
    difficulty: medium
    tags: [endocrinology, diabetes, meglitinide, repaglinide, pharmacology]
  - front: "What is the mechanism of thiazolidinediones (TZDs), and why are they rarely used in Canada now?"
    back: "Bind PPAR-gamma nuclear receptors, sensitizing peripheral tissues to insulin and reducing free fatty acid release from adipose. Rarely used due to side effects: peripheral edema, fluid retention, CHF exacerbation, increased cardiac events with rosiglitazone, increased bladder cancer with pioglitazone, and fractures.\n\nRosiglitazone requires written informed consent regarding cardiovascular risks. The maximum efficacy of TZDs takes 6–12 weeks. They are absolutely contraindicated in NYHA class II+ CHF and bladder cancer. HbA1c reduction ~0.8%."
    difficulty: medium
    tags: [endocrinology, diabetes, thiazolidinedione, pioglitazone, rosiglitazone]
  - front: "What is the mechanism of DPP-4 inhibitors (gliptins), and what are their notable side effects?"
    back: "Inhibit degradation of endogenous incretin hormones (GLP-1, GIP), which stimulate insulin secretion, inhibit glucagon release, and delay gastric emptying. Side effects: nasopharyngitis, URTI, headache, pancreatitis, Stevens-Johnson syndrome, bullous pemphigoid.\n\nDPP-4 inhibitors are weight neutral with negligible hypoglycemia risk as monotherapy. Saxagliptin is associated with CHF risk. Dose reduction needed in renal dysfunction (except linagliptin). HbA1c reduction ~0.7%."
    difficulty: medium
    tags: [endocrinology, diabetes, DPP-4 inhibitor, sitagliptin, pharmacology]
  - front: "What is the mechanism of GLP-1 receptor agonists, and what are their key clinical benefits beyond glycemic control?"
    back: "Bind GLP-1 receptors to promote glucose-dependent insulin release, suppress glucagon, slow gastric emptying. Key benefits: weight loss, cardiovascular mortality reduction in patients with known CVD (liraglutide, semaglutide, dulaglutide).\n\nGLP-1 analogues are insulinotropic only when glucose >4 mmol/L, minimizing hypoglycemia risk. They also cause beta-cell regeneration in vitro. Contraindicated in personal/family history of MTC or MEN2 (C-cell stimulation in animals). Common side effect: nausea/diarrhea."
    difficulty: hard
    tags: [endocrinology, diabetes, GLP-1 agonist, liraglutide, semaglutide, cardiovascular]
  - front: "What is the mechanism of SGLT2 inhibitors, and what are their key clinical benefits and risks?"
    back: "Inhibit renal proximal tubule glucose reabsorption, enhancing urinary glucose excretion. Benefits: weight loss, cardiovascular mortality reduction (empagliflozin), renal protection, HbA1c reduction 0.7–1%. Risks: UTI, genital infections, hypotension, rare euglycemic DKA, hyperlipidemia, decreased BMD.\n\nSGLT2 inhibitors are contraindicated in eGFR <15 or dialysis. Dapagliflozin is contraindicated in active/prior bladder cancer. Euglycemic DKA is a rare but important complication — blood glucose may not be markedly elevated, delaying diagnosis."
    difficulty: hard
    tags: [endocrinology, diabetes, SGLT2 inhibitor, empagliflozin, dapagliflozin, canagliflozin]
  - front: "A patient with T2DM and known atherosclerotic CVD needs to start a second agent. Which drug classes have proven cardiovascular mortality benefits?"
    back: "GLP-1 receptor agonists (liraglutide, semaglutide, dulaglutide) and SGLT2 inhibitors (empagliflozin, canagliflozin, dapagliflozin) have demonstrated added cardiovascular mortality and outcomes benefit in patients with known CVD.\n\nThis is a key Canadian Diabetes Association guideline recommendation. SGLT2 inhibitors also offer renal protection. Both classes should be preferred add-on agents in T2DM with established ASCVD or high-risk features, independent of glycemic control needs."
    difficulty: hard
    tags: [endocrinology, diabetes, cardiovascular outcomes, GLP-1, SGLT2, guidelines]
  - front: "What are the first-line agents for dyslipidemia and how do statins work?"
    back: "Statins (HMG-CoA reductase inhibitors) are first-line. Mechanism: inhibit cholesterol biosynthesis → upregulate hepatic LDL receptors → increased LDL clearance. Also modestly increase HDL and decrease VLDL. Effect: primarily LDL reduction.\n\nStatins are the most evidence-based lipid-lowering therapy for cardiovascular risk reduction. Adverse effects include elevated liver enzymes, myositis, and rarely rhabdomyolysis (risk increased when combined with fibrates). Liver disease is a contraindication."
    difficulty: easy
    tags: [endocrinology, dyslipidemia, statins, HMG-CoA reductase, pharmacology]
  - front: "When are fibrates indicated and what is their major drug interaction risk?"
    back: "Fibrates (bezafibrate, fenofibrate, gemfibrozil) are used for elevated triglycerides and hyperchylomicronemia. Activate PPAR-alpha. Major risk: rhabdomyolysis when combined with statins.\n\nFibrates upregulate lipoprotein lipase and apo A1, primarily lowering triglycerides and modestly raising HDL. The statin-fibrate combination carries a significant rhabdomyolysis risk, especially gemfibrozil + statin. Contraindicated in hepatic and renal disease."
    difficulty: medium
    tags: [endocrinology, dyslipidemia, fibrates, rhabdomyolysis, drug interactions]
  - front: "What are PCSK9 inhibitors, when are they used, and what is their mechanism?"
    back: "Monoclonal antibodies (evolocumab, alirocumab) that inhibit PCSK9, preventing LDL receptor degradation and thus increasing LDL clearance. Used as add-on to maximally tolerated statin therapy in heterozygous and homozygous familial hypercholesterolemia, and in patients with atherosclerotic CVD not at LDL target despite maximal statin + ezetimibe.\n\nPCSK9 normally degrades LDL receptors on hepatocytes. By blocking PCSK9, these agents dramatically lower LDL-C. Administered subcutaneously every 2–4 weeks. Side effects: nasopharyngitis, URTI, injection site soreness, myalgia."
    difficulty: hard
    tags: [endocrinology, dyslipidemia, PCSK9 inhibitor, evolocumab, alirocumab, familial hypercholesterolemia]
  - front: "What are the two thionamides used for hyperthyroidism in Canada, and how do they differ in safety profile during pregnancy?"
    back: "Propylthiouracil (PTU) and methimazole (MMI). PTU is recommended in the first trimester; MMI is preferred in the second and third trimesters. Both are safe with breastfeeding at recommended doses (PTU all doses; MMI <20–30 mg/day).\n\nPTU is preferred in the first trimester because MMI carries a risk of embryopathy (aplasia cutis, choanal atresia). However, PTU carries a higher risk of drug-induced hepatitis, so MMI is preferred in non-pregnant patients and after the first trimester."
    difficulty: hard
    tags: [endocrinology, hyperthyroidism, thionamides, PTU, methimazole, pregnancy]
  - front: "What are the side effects of antithyroid drugs (thionamides)?"
    back: "Both: rash, agranulocytosis, vasculitis, hypoglycemia. PTU-specific: drug-induced hepatitis. MMI-specific: cholestasis.\n\nAgranulocytosis is the most dangerous complication (~0.3–0.5%); patients should be warned to seek immediate assessment for fever or sore throat. LFTs and CBC should be monitored. Agranulocytosis onset is typically within the first 3 months of therapy."
    difficulty: medium
    tags: [endocrinology, hyperthyroidism, PTU, methimazole, agranulocytosis, side effects]
  - front: "What are the indications and contraindications for radioactive iodine (RAI, I-131) therapy?"
    back: "Indications: hyperthyroidism, thyroid malignancy. Contraindications: hypersensitivity, concurrent antithyroid medication, pregnancy, lactation. Doses: ~12 mCi for hyperthyroidism; 50–150 mCi for thyroid cancer.\n\nRAI is incorporated into thyroid follicular cells and destroys them via beta radiation. It is absolutely contraindicated in pregnancy (causes fetal hypothyroidism). Antithyroid drugs must be stopped before RAI to allow iodine uptake. Common side effects include sialadenitis and thyroiditis."
    difficulty: medium
    tags: [endocrinology, hyperthyroidism, radioactive iodine, I-131, thyroid cancer]
  - front: "What are the key contraindications to oral bisphosphonates (alendronate, risedronate) for osteoporosis?"
    back: "Esophageal stricture or achalasia, inability to remain upright for >30 minutes after ingestion, hypocalcemia, renal insufficiency (CrCl <35 mL/min for alendronate, <30 for risedronate), hypersensitivity, history of atypical femoral fracture or osteonecrosis of the jaw.\n\nOral bisphosphonates must be taken with a full glass of water and the patient must remain upright for 30 minutes to prevent esophageal irritation/ulceration. IV zoledronate is an alternative when oral administration is not feasible."
    difficulty: medium
    tags: [endocrinology, osteoporosis, bisphosphonate, alendronate, contraindications]
  - front: "What is the mechanism of denosumab for osteoporosis and what are its unique adverse effects?"
    back: "Monoclonal antibody that inhibits RANKL (osteoclast-differentiating factor), reducing osteoclast formation and bone resorption. Given as 60 mg SC every 6 months. Adverse effects: hypocalcemia, atypical femur fractures, osteonecrosis of the jaw, fatigue/GI.\n\nDenosumab is approved for postmenopausal women at high fracture risk, glucocorticoid-induced osteoporosis, and prevention of skeletal-related events from solid tumour bone metastases. Unlike bisphosphonates, it has no renal contraindication but hypocalcemia must be corrected before initiation."
    difficulty: medium
    tags: [endocrinology, osteoporosis, denosumab, RANKL, pharmacology]
  - front: "What is teriparatide and how does it differ mechanistically from antiresorptive agents?"
    back: "Teriparatide is a PTH analog that stimulates new bone formation by preferential stimulation of osteoblastic over osteoclastic activity. It is an anabolic agent (builds bone), unlike bisphosphonates and denosumab which are antiresorptive (prevent bone loss).\n\nTeriparatide (20 mcg SC once daily) is used for high-risk osteoporosis for 18–24 months. Contraindicated in Paget's disease, prior radiation to skeleton, bone metastases, and other metabolic bone diseases. Side effects: orthostatic hypotension, hypercalcemia, dizziness."
    difficulty: medium
    tags: [endocrinology, osteoporosis, teriparatide, PTH analog, anabolic]
  - front: "What is romosozumab and what is its key cardiovascular warning?"
    back: "Romosozumab is an anti-sclerostin monoclonal antibody that inhibits the Wnt/beta-catenin pathway inhibitor sclerostin, increasing bone formation AND reducing bone resorption (dual mechanism). Given 210 mg SC monthly for 12 months. Warning: may increase risk of MI, stroke, and cardiovascular death.\n\nRomosozumab is indicated for postmenopausal women at high fracture risk (history of osteoporotic fracture or multiple risk factors). Its dual anabolic and antiresorptive action makes it highly effective. Contraindicated in hypocalcemia; caution in patients with prior cardiovascular events."
    difficulty: hard
    tags: [endocrinology, osteoporosis, romosozumab, sclerostin, cardiovascular risk]
  - front: "What is the role of raloxifene in osteoporosis management and what are its contraindications?"
    back: "Selective estrogen receptor modulator (SERM) used as second-line treatment/prevention of postmenopausal osteoporosis. Decreases bone resorption. Contraindicated in: pregnancy, lactation, active or prior DVT/PE/retinal vein thrombosis. Side effects: hot flashes, leg cramps, increased risk of fatal stroke and venous thromboembolism.\n\nRaloxifene acts as an estrogen agonist in bone (decreasing resorption) and an antagonist in breast tissue (potential breast cancer risk reduction). Unlike estrogen, it does not stimulate endometrial tissue. It is second-line due to limited anti-fracture efficacy at non-vertebral sites."
    difficulty: medium
    tags: [endocrinology, osteoporosis, raloxifene, SERM, VTE risk]
  - front: "What are the glucocorticoid equivalents and how does mineralocorticoid activity differ among steroids?"
    back: "Hydrocortisone (potency 1x, dose 20 mg), cortisone acetate (0.8x, dose 25 mg), prednisone (4x, dose 5 mg), dexamethasone (30x, dose 0.75 mg). Hydrocortisone, cortisone, and prednisone have mineralocorticoid activity; dexamethasone has NO mineralocorticoid activity.\n\nUnderstanding steroid equivalents is essential for managing adrenal insufficiency and stress dosing. Dexamethasone is useful when pure anti-inflammatory effect is needed without salt retention. Fludrocortisone replaces aldosterone in primary adrenal insufficiency."
    difficulty: hard
    tags: [endocrinology, adrenal insufficiency, glucocorticoids, steroid equivalents, pharmacology]
  - front: "What is the standard treatment protocol for adrenal crisis?"
    back: "Hydrocortisone 50–100 mg IV bolus, then 50–100 mg IV q8h (or continuous infusion) for 24–48 hours. Once stable, switch to oral hydrocortisone (50 mg q8h x 48h) then taper over 14 days.\n\nAdrenal crisis is a life-threatening emergency requiring immediate IV glucocorticoids, IV saline (for volume depletion), and glucose. Precipitants include infection, surgery, or failure to increase steroid doses during illness ('sick day rules'). Fludrocortisone is added for primary adrenal insufficiency once oral therapy resumes."
    difficulty: hard
    tags: [endocrinology, adrenal crisis, adrenal insufficiency, hydrocortisone, emergency]
  - front: "What did the DPP (Diabetes Prevention Program) trial demonstrate?"
    back: "Lifestyle interventions (≥7% weight loss, ≥150 min/week physical activity) reduced T2DM incidence by 58%; metformin (850 mg BID) reduced it by 31% vs. placebo. Lifestyle was significantly more effective than metformin.\n\nThis landmark NEJM 2002 trial enrolled 3234 non-diabetic patients with impaired glucose tolerance. It established lifestyle modification as the most effective intervention for T2DM prevention, with metformin as an evidence-based pharmacologic option in high-risk individuals."
    difficulty: medium
    tags: [endocrinology, diabetes prevention, DPP trial, metformin, lifestyle]
  - front: "What did the Look AHEAD trial demonstrate regarding intensive lifestyle intervention in T2DM?"
    back: "Intensive lifestyle intervention for weight loss in overweight/obese T2DM patients improved weight, HbA1c, and cardiovascular risk factors but did NOT reduce cardiovascular morbidity or mortality. The trial was stopped early for futility.\n\nLook AHEAD (NEJM 2013) challenged the assumption that weight loss alone would translate to cardiovascular event reduction in T2DM. This highlights the importance of addressing glycemia, BP, lipids, and antiplatelet therapy comprehensively rather than focusing on weight alone."
    difficulty: medium
    tags: [endocrinology, diabetes, Look AHEAD trial, lifestyle intervention, cardiovascular outcomes]
  - front: "What were the key findings of the ACCORD trial and why was it stopped early?"
    back: "Intensive glucose lowering (target HbA1c <6.0%) in T2DM with CVD or CVD risk factors was stopped early due to increased mortality. No difference in cardiovascular events, but increased hypoglycemia, fluid retention, and weight gain in the intensive group.\n\nACCORD (NEJM 2008) was a landmark trial demonstrating that overly aggressive glucose lowering is harmful in high-risk T2DM patients. This led to individualized HbA1c targets in Canadian guidelines, with less stringent targets for patients with established CVD, hypoglycemia risk, or frailty."
    difficulty: hard
    tags: [endocrinology, diabetes, ACCORD trial, intensive glucose control, HbA1c target]
  - front: "What did the ADVANCE trial show about intensive glucose control targeting HbA1c <6.5%?"
    back: "Intensive glucose control (HbA1c <6.5%) significantly reduced nephropathy (4.1% vs 5.2%) but did NOT significantly reduce major macrovascular events or all-cause mortality. Severe hypoglycemia was more common in the intensive group (2.7% vs 1.5%).\n\nADVANCE (NEJM 2008) enrolled 11,140 T2DM patients. The primary benefit was microvascular (renal). This supports intensive control for preventing diabetic nephropathy but cautions against it for macrovascular risk reduction, particularly in patients where hypoglycemia is dangerous."
    difficulty: medium
    tags: [endocrinology, diabetes, ADVANCE trial, nephropathy, intensive glucose control]
  - front: "What was the conclusion of the VADT trial regarding intensive glucose control?"
    back: "In veterans with long-standing, poorly controlled T2DM, intensive glucose control (HbA1c 6.9% vs 8.4%) did NOT significantly reduce major cardiovascular events, microvascular complications, or death from any cause, but increased hypoglycemia.\n\nVADT (NEJM 2009) reinforced findings from ACCORD and ADVANCE: intensive glucose control in established, long-duration T2DM does not reduce hard cardiovascular outcomes and increases adverse events. Early tight control ('legacy effect') may be more beneficial."
    difficulty: medium
    tags: [endocrinology, diabetes, VADT trial, intensive glucose control, cardiovascular]
  - front: "A 70-year-old man is started on spironolactone for heart failure and develops bilateral breast enlargement. What is the mechanism?"
    back: "Spironolactone is an aldosterone antagonist that also blocks androgen receptors and inhibits testosterone synthesis, decreasing androgen activity and shifting the estrogen-to-androgen ratio in favour of estrogen, causing gynecomastia.\n\nDrug-induced gynecomastia is common and should always be considered in new cases. The preferred management is discontinuing or switching the offending agent when clinically feasible. Tamoxifen is an option if the drug cannot be stopped."
    difficulty: medium
    tags: [endocrinology, gynecomastia, spironolactone, drug-induced, mechanism]
  - front: "What is the 5-alpha-reductase deficiency and how does it present?"
    back: "A defect in androgen action where 5-alpha-reductase fails to convert testosterone to dihydrotestosterone (DHT). Presents as ambiguous genitalia at birth (DHT needed for external genital masculinization) with virilization at puberty (testosterone-mediated).\n\nThis X-linked recessive condition highlights the distinct roles of testosterone (Wolffian duct and pubertal virilization) vs. DHT (external genitalia masculinization). At puberty, rising testosterone causes virilization, voice deepening, and muscle growth despite DHT deficiency."
    difficulty: hard
    tags: [endocrinology, 5-alpha-reductase deficiency, androgen action, disorders of sexual development]
  - front: "What is complete androgen insensitivity syndrome (CAIS) and what is its karyotype and presentation?"
    back: "CAIS is an X-linked defect in the androgen receptor causing complete resistance to testosterone and DHT. Karyotype 46,XY. Presents as phenotypically female with absent uterus, absent/sparse pubic and axillary hair, blind-ending vagina, and intra-abdominal or inguinal testes.\n\nDespite high testosterone levels, there is no androgen effect. Estrogen (from peripheral conversion of testosterone) causes female breast development. Risk of gonadal malignancy (gonadoblastoma) mandates gonadectomy after puberty (after allowing estrogen-driven feminization)."
    difficulty: hard
    tags: [endocrinology, CAIS, androgen insensitivity, disorders of sexual development]
  - front: "What is the treatment approach for paraneoplastic syndromes?"
    back: "Primary: treat the underlying tumour (surgery, radiation, chemotherapy). Secondary (immune-mediated disorders): IVIG, steroids, immunosuppressive drugs, plasmapheresis (reserved for patients with identifiable serum antibodies).\n\nThe immune-mediated paraneoplastic syndromes (neurological, rheumatological) often improve with tumour treatment but may require immunotherapy. Plasmapheresis removes circulating antibodies but is reserved for antibody-confirmed cases. Symptomatic management is important in parallel."
    difficulty: medium
    tags: [endocrinology, paraneoplastic syndrome, treatment, immunotherapy]
  - front: "A patient with T2DM has an eGFR of 12 mL/min. Which diabetes medications are contraindicated?"
    back: "Metformin (GFR <15), SGLT2 inhibitors (eGFR <15/ESRD/dialysis), sulfonylureas (glyburide and glimepiride in severe renal dysfunction), DPP-4 inhibitors require dose reduction (except linagliptin), GLP-1 agonists are relatively contraindicated in ESRD.\n\nRenal dosing of diabetes medications is a high-yield topic. Linagliptin is unique among DPP-4 inhibitors in not requiring dose adjustment in renal impairment (eliminated hepatically). Insulin remains the safest option in severe CKD but requires careful dose titration."
    difficulty: hard
    tags: [endocrinology, diabetes, renal impairment, CKD, drug dosing]
  - front: "What is the Occurrence Rate of Gynecomastia at infancy, puberty, and ages 50-80?"
    back: "Infancy: 60–90% affected; Puberty: 46–9% (peaks ages 13–14); Ages 50–80: 26–5% affected.\n\nPhysiologic gynecomastia is common at these three stages due to transient hormonal fluctuations. Pubertal gynecomastia spontaneously regresses in 90% within 1–2 years. Persistent gynecomastia beyond 2 years of puberty or onset in adults warrants investigation."
    difficulty: easy
    tags: [endocrinology, gynecomastia, epidemiology]
  - front: "What is the role of fludrocortisone and when is it used?"
    back: "Fludrocortisone (Florinef) is a mineralocorticoid used to replace aldosterone in primary adrenal insufficiency. Dose: 0.1 mg/day chronically. It has 100% mineralocorticoid activity and replaces the salt-retaining function of aldosterone.\n\nIn primary adrenal insufficiency (Addison's disease), both glucocorticoids AND mineralocorticoids are deficient. Glucocorticoid replacement alone (hydrocortisone) is sufficient for secondary/tertiary adrenal insufficiency (ACTH-deficient states) where the renin-angiotensin-aldosterone axis remains intact."
    difficulty: medium
    tags: [endocrinology, adrenal insufficiency, fludrocortisone, mineralocorticoid, Addisons disease]
