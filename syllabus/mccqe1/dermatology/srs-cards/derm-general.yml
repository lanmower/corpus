  - front: "What is the targeted therapy option for melanoma patients with BRAF V600E mutation?"
    back: "BRAF inhibitors such as vemurafenib\n\nBRAF V600E mutations are found in approximately 50% of melanomas. These small molecule inhibitors specifically target the mutated signaling pathway driving tumor growth."
    difficulty: easy
    tags: [melanoma, BRAF, targeted therapy, oncology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "According to AJCC staging, what is the approximate 5-year survival for melanoma with Breslow thickness <1.0mm?"
    back: "90% 5-year survival\n\nBreslow thickness is the most important prognostic factor in primary melanoma. Thinner tumors (T1a: <1.0mm without ulceration) have excellent prognosis."
    difficulty: easy
    tags: [melanoma, AJCC staging, prognosis, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the 5-year survival for Stage IV melanoma (any metastases)?"
    back: "10% 5-year survival\n\nMetastatic melanoma has poor prognosis. The median survival is approximately 6-9 months without treatment, though immunotherapy has improved outcomes."
    difficulty: easy
    tags: [melanoma, metastatic, prognosis, oncology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the approximate 5-year survival rate for Stage I melanoma (T < 1.0mm)?"
    back: "90%\n\nStage I melanoma has an excellent prognosis with 5-year survival of approximately 90% when tumor thickness is less than 1.0mm without ulceration."
    difficulty: easy
    tags: [melanoma, staging, dermatology, oncology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the approximate 5-year survival rate for Stage III melanoma (T 2.01-4.0mm)?"
    back: "45%\n\nStage III melanoma with nodal involvement has a 5-year survival of approximately 45%, representing intermediate prognosis with regional lymph node metastasis."
    difficulty: easy
