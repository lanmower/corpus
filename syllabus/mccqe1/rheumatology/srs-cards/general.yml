# General (Rheumatology) - generated from srs-mccqe1
cards:
  - front: "What is the effect of scleroderma on the esophagus?"
    back: "Smooth muscle atrophy and fibrosis leading to decreased LES tone and weak peristalsis\n\nScleroderma causes esophageal involvement with atrophy of smooth muscle, resulting in reflux and dysphagia due to weak peristalsis and incompetent LES."
    difficulty: medium
    tags: [scleroderma, esophageal motility, rheumatology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What esophageal abnormality is seen in scleroderma?"
    back: "Absent or weak peristalsis in the esophageal body with decreased LES tone\n\nScleroderma causes fibrosis of smooth muscle in the esophagus, leading to aperistalsis and hypotensive LES - a key feature distinguishing it from other motor disorders."
    difficulty: medium
    tags: [scleroderma, esophageal motor disorder, Rheumatology, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the defining feature of seropositive rheumatic diseases?"
    back: "Presence of a serologic marker such as positive RF or ANA\n\nA small subset of vasculitides (ANCA-associated) has measurable serological components but are often considered separate entities."
    difficulty: easy
    tags: [seropositive, rheumatology, definition, toronto-notes, pages-1501-1502-1503-1504-1505-1506-1507-1508-1509-1510]
  - front: "What are the modifiable risk factors for gout?"
    back: "Diet (alcohol, purine-rich foods like meats and seafood, fructose/sugar-sweetened foods), dehydration (e.g., from diuretics), metabolic syndrome\n\nAlcohol (especially beer and spirits), seafood, organ meats, and fructose-rich foods increase uric acid production or reduce excretion."
    difficulty: medium
    tags: [gout, risk factors, rheumatology, lifestyle, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What are the non-modifiable risk factors for gout?"
    back: "Genetic mutations, male gender, and advanced age\n\nMales are at higher risk, particularly middle-aged males, and postmenopausal females are also at increased risk."
    difficulty: easy
    tags: [gout, risk factors, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What acute treatments are used for gout flare?"
    back: "NSAIDs (high-dose, then taper), corticosteroids (IA preferred, PO, or IM/IV), colchicine (best within first 12-24h)\n\nTreatment choice depends on comorbidities - colchicine caution in renal failure, corticosteroids for NSAID contraindications."
    difficulty: medium
    tags: [gout, treatment, acute, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What are indications for starting urate-lowering therapy (ULT) in gout?"
    back: "≥2 attacks/year, presence of tophi, or bone erosions/arthritis on imaging\n\nULT is recommended for patients with frequent flares, tophi, or structural joint damage from gout."
    difficulty: medium
    tags: [gout, treatment, indications, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What are the clinical presentations of CPPD disease?"
    back: "Asymptomatic crystal deposition, acute crystal arthritis (resembling gout), pseudo-OA (progressive degeneration with acute flares), pseudo-RA (symmetrical polyarticular pattern with morning stiffness)\n\nCPPD can present in multiple ways, making diagnosis challenging without joint aspiration."
    difficulty: hard
    tags: [pseudogout, CPPD, clinical presentation, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What is the ultrasound finding characteristic of gout?"
    back: "Double-contour sign\n\nThis ultrasound finding represents urate crystal deposition on cartilage surface."
    difficulty: hard
    tags: [gout, ultrasound, diagnosis, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What is a tophus in gout?"
    back: "Urate deposits on cartilage, tendons, bursae, soft tissues, and synovial membranes, appearing as subcutaneous nodules\n\nTophi are collections of monosodium urate crystals that form in chronic gout and indicate poorly controlled disease."
    difficulty: medium
    tags: [gout, clinical presentation, chronic, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "What is the recommended prophylaxis when starting urate-lowering therapy?"
    back: "Low-dose NSAID, colchicine, or prednisone/prednisolone for 3-6 months\n\nThis prevents acute gout flares that can occur when starting ULT, as urate crystals mobilize."
    difficulty: hard
    tags: [gout, treatment, prophylaxis, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
  - front: "Compare gout vs pseudogout: treatment differences"
    back: "Both use NSAIDs, corticosteroids, colchicine for acute attacks. Chronic gout uses urate-lowering therapy (allopurinol, febuxostat). Pseudogout has no effective ULT; treatment focuses on acute management and underlying condition control.\n\nThe main difference is chronic management - gout has effective ULTs while pseudogout does not."
    difficulty: hard
    tags: [gout, pseudogout, CPPD, treatment, comparison, rheumatology, toronto-notes, pages-1521-1522-1523-1524-1525-1526-1527-1528-1529-1530]
