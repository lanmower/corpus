# Hematology Basics (Hematology) - generated from srs-mccqe1
cards:
  - front: "What are the major sites of hematopoiesis in adults?"
    back: "In adults, hematopoiesis occurs in the pelvis, sternum, vertebral bodies, and cranium (axial skeleton and flat bones).\n\nOver 10^11 blood cells are produced daily. During fetal life, hematopoiesis occurs in the yolk sac, liver, and spleen before shifting to the bone marrow. In adults, the red marrow of flat bones and the proximal ends of long bones are the primary sites. This is relevant to understanding where bone marrow biopsy is performed."
    difficulty: easy
    tags: [hematology, hematopoiesis, bone-marrow, basics]
  - front: "What is the lifespan of erythrocytes, neutrophils, and platelets in peripheral blood?"
    back: "Erythrocytes: 90-120 days; neutrophils: approximately 1 day; platelets: 7-10 days.\n\nThese lifespans are clinically important for understanding recovery after chemotherapy or bone marrow suppression (neutrophils recover fastest), transfusion timing, and interpreting CBC changes. Memory lymphocytes persist for years. The differential recovery times explain why neutropenic fever is the earliest and most dangerous complication post-chemotherapy."
    difficulty: easy
    tags: [hematology, erythrocytes, neutrophils, platelets, cell-lifespan]
  - front: "What is the role of the spleen in hematology?"
    back: "The spleen is part of the reticuloendothelial system: it sequesters aged RBCs, removes opsonized cells, and is a site of antibody production.\n\nThe spleen filters blood and removes damaged or senescent erythrocytes. After splenectomy, patients develop Howell-Jolly bodies (nuclear remnants) in RBCs that would normally be removed by the spleen. The spleen also serves as a reservoir for platelets and lymphocytes. Loss of splenic function increases susceptibility to encapsulated bacteria."
    difficulty: easy
    tags: [hematology, spleen, reticuloendothelial, basics, splenectomy]
  - front: "What are the normal reference ranges for hemoglobin in adult males and females?"
    back: "Adult females: 115-155 g/L; adult males: 125-170 g/L.\n\nAnemia is defined as Hb <120 g/L in females and Hb <130 g/L in males. The MCV normal range is 80-100 fL, and the normal platelet count is 130-380 x 10^9/L. Normal WBC count is 3.5-10.5 x 10^9/L. These values are essential for interpreting CBC results."
    difficulty: easy
    tags: [hematology, CBC, hemoglobin, normal-values, reference-ranges]
  - front: "What are the indications for bone marrow aspiration and biopsy?"
    back: "Indications: unexplained CBC abnormalities; diagnosis/evaluation of plasma cell disorders, leukemias, solid tumour infiltration; staging of lymphoma; evaluating iron metabolism; suspected deposition/storage disease (e.g., amyloidosis, Gaucher's); fever of unknown origin; suspected mycobacterial/fungal/parasitic infections; unexplained splenomegaly; donor evaluation for allogeneic transplant.\n\nBone marrow aspiration evaluates cellular morphology and provides material for flow cytometry, cytogenetics, and microbiology. Biopsy evaluates architecture and immunohistochemistry. Only aspiration (not biopsy) can be done at the sternal site. A 'dry tap' (no aspirate) suggests myelofibrosis, hairy cell leukemia, or BM infiltration."
    difficulty: medium
    tags: [hematology, bone-marrow, biopsy, aspiration, indications]
  - front: "What is the difference between bone marrow aspiration and biopsy, and where can each be performed?"
    back: "Aspiration: fluid marrow sample for cellular morphology, flow cytometry, cytogenetics, molecular studies, microbiology. Biopsy: intact BM core for histology (architecture) and immunohistochemistry. Sites: both at posterior iliac crest/spine; aspiration only at sternum.\n\nAspiration and biopsy are usually performed together. The key distinction is that aspiration evaluates individual cells and their markers, while biopsy evaluates tissue architecture (critical for myelofibrosis staging). A 'dry tap' on aspiration, where no marrow fluid is obtained, is itself diagnostically significant and should prompt biopsy — causes include myelofibrosis, hairy cell leukemia, and BM infiltration."
    difficulty: easy
    tags: [hematology, bone-marrow, aspiration, biopsy, procedure]
  - front: "What are the main cell types in blood and their primary roles in the immune system?"
    back: "Neutrophils: innate immunity, main cell in acute inflammation. Eosinophils: response to parasites (helminths) and allergic response. Basophils: allergy and parasitic infection. Lymphocytes: adaptive immunity. Monocytes: innate immunity, differentiate into macrophages or dendritic cells. Platelets: primary hemostasis.\n\nUnderstanding the functional roles of each blood cell type is foundational for interpreting CBC differentials. Neutrophilia suggests acute bacterial infection or stress; eosinophilia suggests allergy or parasites; lymphocytosis suggests viral infection or lymphoproliferative disorder; monocytosis suggests chronic infection or myeloproliferative disease. Plasma is the acellular fluid component; serum = plasma minus coagulation factors."
    difficulty: easy
    tags: [hematology, blood-cells, immune-system, basics, CBC]
  - front: "What distinguishes plasma from serum?"
    back: "Serum is equivalent to plasma minus coagulation factors. Plasma is the acellular fluid component of blood containing water, coagulation factors, and immunoglobulins; serum is what remains after blood has clotted and clot has been removed.\n\nThis distinction is important for laboratory testing: serum is used for most chemistry tests (electrolytes, proteins, antibodies), while plasma (with anticoagulant) is used for coagulation studies (PT, aPTT). Hematology panels (CBC, blood film) use EDTA-anticoagulated whole blood."
    difficulty: easy
    tags: [hematology, plasma, serum, basics, laboratory]
  - front: "What are the causes of a 'dry tap' on bone marrow aspiration?"
    back: "Causes of a dry tap (no marrow fluid obtained): myelofibrosis (MF), hairy cell leukemia, and bone marrow infiltration.\n\nA dry tap occurs when the marrow is replaced by fibrotic tissue or densely packed cells that do not aspirate. In myelofibrosis, progressive collagen fibrosis replaces normal hematopoietic tissue. Hairy cell leukemia causes reticulin fibrosis. Metastatic cancer infiltrating the BM can also cause a dry tap. When a dry tap occurs, biopsy becomes even more critical for diagnosis."
    difficulty: medium
    tags: [hematology, bone-marrow, dry-tap, myelofibrosis, hairy-cell-leukemia]
