cards:
  - front: "A patient on multiple medications asks about St. John's Wort for mild depression. What drug interactions should you warn about?"
    back: "St. John's Wort interacts with antidepressants (SSRIs - risk of serotonin syndrome), oral contraceptives (reduced efficacy), cyclosporine, digoxin, warfarin, and antiretrovirals (indinavir is contraindicated).\n\nSt. John's Wort induces cytochrome P450 enzymes and P-glycoprotein, reducing levels of many drugs. It can cause serotonin syndrome when combined with SSRIs. Always ask patients about herbal supplements as 50% of Canadians use natural health products."
    difficulty: medium
