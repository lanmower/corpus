# Geriatric Medicine (Geriatrics) - generated from srs-mccqe1
cards:
  - front: "According to the Fried et al. 2001 frailty phenotype, what are the 5 criteria defining frailty, and how many must be present?"
    back: "3 or more of: (1) unintentional weight loss (>10 lbs in past year), (2) self-reported exhaustion, (3) weakness (reduced grip strength), (4) slow walking speed, (5) low physical activity.\n\nThe Fried phenotype established frailty as a distinct clinical syndrome, separate from comorbidity and disability. Frailty increases risk for adverse outcomes including hospitalization, falls, disability, and mortality. Pre-frailty (1-2 criteria) also confers increased risk."
    difficulty: easy
    tags: [frailty, geriatrics, phenotype, Fried criteria, landmark trials]
  - front: "What does the Studenski et al. 2011 (JAMA) study demonstrate about gait speed in older adults?"
    back: "Gait speed is associated with 10-year survival in adults >65 years. Each 0.1 m/s increment in gait speed is associated with a 12% reduction in mortality risk (pooled HR 0.88 per 0.1 m/s). Survival increased consistently across the full range of gait speeds.\n\nGait speed serves as a simple, non-invasive 'vital sign' in geriatric assessment. It reflects physiologic reserve across multiple organ systems. The study pooled 9 cohort studies with 6-21 years of follow-up, supporting gait speed as a strong predictor of longevity."
    difficulty: medium
    tags: [gait speed, frailty, geriatrics, survival, functional assessment]
  - front: "What did the REHAB-AF trial demonstrate about rehabilitation in older patients hospitalized for heart failure?"
    back: "A transitional, tailored, progressive rehabilitation intervention initiated during or after hospitalization for acute decompensated heart failure improved Short Physical Performance Battery scores at 3 months and modestly reduced rehospitalization rates at 6 months in older frail adults.\n\nREHAB-AF (NEJM 2021) targeted four physical-function domains over 36 sessions. The intervention addresses physical frailty in the high-risk post-hospitalization period. Despite modest mortality signal (21 vs 16 deaths), functional outcomes improved, supporting rehabilitation as a standard of care in this population."
    difficulty: medium
    tags: [rehabilitation, heart failure, frailty, geriatrics, REHAB-AF]
  - front: "What did the Davis et al. 2012 study demonstrate about the relationship between delirium and dementia in the oldest-old?"
    back: "Delirium significantly increased risk of incident dementia (OR 8.7; 95% CI 2.1-35), worsened dementia severity (OR 3.1), worsened global function (OR 2.8), and caused an additional loss of 1.0 MMSE point per year compared to those without delirium.\n\nThis population-based cohort study of 553 individuals aged >85 years established delirium as a strong independent risk factor for incident dementia and cognitive decline, not merely a marker. This supports aggressive delirium prevention as a strategy to reduce long-term cognitive impairment."
    difficulty: medium
    tags: [delirium, dementia, geriatrics, cognitive decline, MMSE]
  - front: "What were the key results and conclusions of the Inouye et al. 1999 multicomponent delirium prevention study?"
    back: "A multicomponent intervention targeting 6 risk factors (cognitive impairment, sleep deprivation, immobility, visual impairment, hearing impairment, dehydration) reduced delirium incidence from 15% to 9.9%, with fewer total delirium days (105 vs. 161) and fewer episodes (62 vs. 90) in hospitalized older adults.\n\nThis landmark NEJM study established that non-pharmacological multicomponent interventions are effective for delirium prevention. It addressed modifiable risk factors rather than relying on medication. These principles formed the basis for programs like the Hospital Elder Life Program (HELP)."
    difficulty: easy
    tags: [delirium, prevention, geriatrics, multicomponent intervention, Inouye]
  - front: "What did the PROFET trial demonstrate about falls prevention in the elderly?"
    back: "An interdisciplinary assessment (detailed medical + occupational therapy evaluation) in adults >65 who presented to ED with a fall significantly reduced risk of future falls (OR 0.39) and fall recurrence (OR 0.33) compared to usual care.\n\nThe Prevention of Falls in the Elderly Trial (Lancet 1999) supports a structured interdisciplinary approach after a fall. This is the basis for falls clinics and post-fall assessments in Canadian geriatric practice. The control received usual care only, highlighting the value of a systematic assessment."
    difficulty: easy
    tags: [falls, geriatrics, PROFET, interdisciplinary, prevention]
  - front: "What did Howard et al. 2012 (NEJM) demonstrate about donepezil and memantine in moderate-to-severe Alzheimer's disease?"
    back: "Continuing donepezil in moderate-to-severe Alzheimer's disease was associated with significantly better SMMSE scores (+1.9 points) and BADLS scores (-3.0 points, less impairment) compared to discontinuation. Adding memantine provided additional cognitive benefit (+1.2 SMMSE) and functional benefit (-1.5 BADLS).\n\nThis trial challenged the practice of stopping cholinesterase inhibitors in advanced Alzheimer's disease. The combination of donepezil + memantine provides additive benefits. SMMSE measures cognition; lower BADLS scores reflect better function."
    difficulty: medium
    tags: [Alzheimers disease, dementia, donepezil, memantine, cholinesterase inhibitors]
  - front: "What did the SMARRT trial (JAMA Internal Medicine 2024) find about multidomain dementia risk reduction?"
    back: "A personalized, multidomain risk-reduction intervention over 2 years was associated with modest improvements in cognitive scores, dementia risk factors, and quality of life in adults aged 70-89 years at elevated risk for dementia, compared to health education control.\n\nSMARRT supports targeting modifiable risk factors (e.g., hypertension, physical inactivity, social isolation, diet) to reduce dementia incidence. This aligns with the growing recognition that ~40% of dementia cases are attributable to modifiable risk factors (Lancet Commission)."
    difficulty: medium
    tags: [dementia, prevention, cognitive decline, SMARRT, risk reduction]
  - front: "What did the SPRINT trial demonstrate about blood pressure management, and what are the key clinical implications for elderly patients?"
    back: "Intensive systolic blood pressure reduction was associated with a 43% reduction in cardiovascular death and 38% reduction in acute decompensated heart failure. Applying SPRINT to clinical practice requires accurate BP measurement and evidence of cardiovascular risk.\n\nSPRINT Revisited (Hypertension 2021) confirmed the original SPRINT findings. In geriatric patients, the benefits of intensive BP control must be weighed against risks (falls, orthostatic hypotension, renal impairment). Accurate, standardized BP measurement (unattended automated office BP) is essential for valid results."
    difficulty: medium
    tags: [hypertension, elderly, SPRINT, cardiovascular, blood pressure]
  - front: "What did the EMPOWER trial demonstrate about benzodiazepine deprescribing in older adults?"
    back: "Direct-to-patient education about risks of benzodiazepine use combined with a stepwise taper protocol led to benzodiazepine discontinuation in 27% of elderly patients versus 5% in controls (risk difference 23%) at 6 months.\n\nThe EMPOWER trial (JAMA Internal Medicine 2014) showed that empowering patients with information about harms (falls, cognitive impairment, dependence) and a practical taper plan is an effective deprescribing strategy. Benzodiazepines are on the Beers Criteria as potentially inappropriate in older adults."
    difficulty: easy
    tags: [benzodiazepines, deprescribing, elderly, polypharmacy, EMPOWER]
  - front: "What are the STOPP and START criteria, and what is their clinical purpose?"
    back: "STOPP (Screening Tool of Older Person's Prescriptions): 65 criteria for potentially inappropriate prescriptions in older adults. START (Screening Tool to Alert doctors to Right Treatment): 22 evidence-based indicators for prescriptions that should be considered. Together, they identify both over-prescribing and under-prescribing.\n\nValidated using a Delphi consensus among 18 experts, STOPP/START is more comprehensive than the Beers Criteria for identifying both harmful and omitted medications. It is particularly relevant for multimorbid older patients on complex polypharmacy regimens."
    difficulty: easy
    tags: [STOPP, START, polypharmacy, deprescribing, geriatrics, inappropriate prescribing]
