# COPD & Emphysema (Respirology) - generated from srs-mccqe1
cards:
  - front: "A 65-year-old smoker (45 pack-years) has progressive dyspnea, chronic productive cough, and spirometry showing FEV1/FVC 0.62 post-bronchodilator. Diagnosis and GOLD staging?"
    back: "COPD; GOLD stage based on FEV1: Stage I ≥80%, Stage II 50-79%, Stage III 30-49%, Stage IV <30% predicted\n\nCTS/GOLD guidelines define COPD by post-bronchodilator FEV1/FVC <0.70. GOLD classification guides pharmacotherapy. Clinical assessment (exacerbation history, mMRC dyspnea score, CAT score) determines GOLD group A-D."
    difficulty: medium
    tags: [COPD, GOLD staging, spirometry, FEV1, respirology]
  - front: "What is the single most important intervention for COPD management?"
    back: "Smoking cessation — the only intervention proven to slow FEV1 decline and reduce mortality\n\nCTS guidelines strongly recommend smoking cessation for all COPD patients. Pharmacotherapy (varenicline preferred, NRT, bupropion) combined with behavioral support doubles cessation rates. Even after decades of smoking, cessation slows disease progression."
    difficulty: easy
    tags: [COPD, smoking cessation, FEV1 decline, respirology]
  - front: "What is the first-line pharmacotherapy for mild-moderate symptomatic COPD (GOLD group A-B)?"
    back: "Long-acting bronchodilator: LAMA (tiotropium, umeclidinium) or LABA (salmeterol, formoterol) — LAMA preferred for dyspnea reduction\n\nCTS COPD guidelines recommend LAMA as first-line for most symptomatic COPD patients. LAMA (tiotropium) superior to LABA for reducing exacerbations and hospitalizations (UPLIFT trial). LAMA+LABA combination for persistent symptoms."
    difficulty: easy
    tags: [COPD treatment, LAMA, tiotropium, LABA, bronchodilator, respirology]
  - front: "When are inhaled corticosteroids (ICS) indicated in COPD?"
    back: "ICS added to LAMA+LABA when: ≥2 moderate or ≥1 severe exacerbation per year AND eosinophil count ≥300 cells/μL (or ≥100 with frequent exacerbations)\n\nCTS guidelines recommend triple therapy (ICS+LAMA+LABA) for high-risk COPD patients (Group D/E). ICS alone is inappropriate in COPD. Blood eosinophil count guides ICS benefit — higher counts predict greater response."
    difficulty: medium
    tags: [ICS, COPD, triple therapy, eosinophils, exacerbations, respirology]
  - front: "A 68-year-old with COPD has PaO2 54 mmHg at rest on room air. What is indicated?"
    back: "Long-term home oxygen therapy (LTOT) for ≥15-18 hours/day — improves survival in severe hypoxemia\n\nNOCTURNAL O2 and MRC trials showed LTOT survival benefit when PaO2 ≤55 mmHg or SaO2 ≤88%. Indications: PaO2 ≤55 mmHg (SaO2 ≤88%), or PaO2 56-59 mmHg with polycythemia, cor pulmonale, or pulmonary hypertension. Minimum 15h/day for benefit."
    difficulty: medium
    tags: [LTOT, long-term oxygen, COPD, hypoxemia, respirology]
  - front: "What characterizes an acute exacerbation of COPD (AECOPD) and how is it managed?"
    back: "AECOPD: acute worsening of respiratory symptoms beyond normal variation requiring change in therapy; treat with short-acting bronchodilators, systemic corticosteroids (prednisone 40mg x5 days), antibiotics if purulent sputum\n\nCTS guidelines: antibiotics for AECOPD with purulent sputum or requiring hospitalization. Preferred antibiotics: doxycycline, amoxicillin-clavulanate, azithromycin. NIV (BiPAP) for AECOPD with hypercapnic respiratory failure reduces intubation and mortality."
    difficulty: hard
    tags: [AECOPD, exacerbation, corticosteroids, antibiotics, NIV, respirology]
  - front: "What is the role of pulmonary rehabilitation in COPD?"
    back: "Pulmonary rehab reduces dyspnea, improves exercise capacity and quality of life, reduces hospitalizations — recommended for all COPD patients with MRC dyspnea ≥2 or after exacerbation\n\nCTS guidelines strongly recommend pulmonary rehabilitation as a core COPD treatment. Programs include exercise training, education, and psychosocial support. Benefits are greatest when started within 4 weeks of an exacerbation."
    difficulty: easy
    tags: [pulmonary rehabilitation, COPD, exercise, dyspnea, respirology]
  - front: "What is the difference between emphysema and chronic bronchitis in COPD?"
    back: "Emphysema: destruction of alveolar walls and airspace enlargement (pink puffer: thin, barrel chest, pursed-lip breathing); Chronic bronchitis: productive cough ≥3 months/year for ≥2 consecutive years (blue bloater: cyanotic, edematous)\n\nThese are clinical phenotypes within COPD spectrum. Most patients have features of both. Emphysema is a pathological diagnosis; chronic bronchitis is clinical. CT findings of emphysema correlate with worse prognosis."
    difficulty: easy
    tags: [emphysema, chronic bronchitis, COPD phenotypes, pink puffer, blue bloater, respirology]
  - front: "What are indications for NIV (BiPAP) in AECOPD?"
    back: "Acute hypercapnic respiratory failure (pH <7.35, PaCO2 >45 mmHg) with moderate-severe dyspnea, accessory muscle use — reduces intubation and mortality\n\nNICE and CTS guidelines recommend NIV as first-line for AECOPD with acute hypercapnic failure when pH 7.25-7.35. NIV reduces mortality by ~48% and intubation rate. Contraindications: unconscious, vomiting, hemodynamic instability."
    difficulty: hard
    tags: [NIV, BiPAP, AECOPD, hypercapnia, respiratory failure, respirology]
  - front: "What vaccinations are recommended for COPD patients?"
    back: "Influenza (annual), pneumococcal (PCV13 + PPSV23), COVID-19, RSV vaccine (age ≥60), Tdap booster\n\nCTS guidelines recommend all COPD patients receive influenza and pneumococcal vaccines to reduce exacerbations and pneumonia. Influenza vaccination reduces AECOPD hospitalizations by ~40%. RSV vaccine now recommended for older COPD patients."
    difficulty: easy
    tags: [COPD, vaccines, influenza, pneumococcal, respirology]
  - front: "A 70-year-old with severe COPD is in respiratory failure. When should intubation and mechanical ventilation be considered?"
    back: "When NIV fails or is contraindicated; clinical indicators: pH <7.25, severe encephalopathy, hemodynamic instability, inability to protect airway, respiratory arrest\n\nInvasive MV in COPD has significant complications (VAP, prolonged weaning, diaphragm atrophy). Goals of care discussion is critical before intubation. Non-invasive strategies (NIV, high-flow NC) should be maximized first."
    difficulty: hard
    tags: [COPD, intubation, mechanical ventilation, NIV failure, respiratory failure, respirology]
  - front: "What alpha-1 antitrypsin deficiency causes and how is it diagnosed?"
    back: "A1AT deficiency (ZZ genotype) causes early-onset panacinar emphysema (especially lower lobes), liver disease; diagnose with serum A1AT level and genotyping\n\nA1AT deficiency should be suspected in COPD patients <45 years, non-smokers, or with family history. Treatment: smoking cessation, standard COPD therapy, A1AT augmentation therapy for severe deficiency with emphysema."
    difficulty: medium
    tags: [alpha-1 antitrypsin, A1AT deficiency, emphysema, COPD, genotyping, respirology]
  - front: "What spirometry pattern defines COPD and how does it differ from restrictive lung disease?"
    back: "COPD: obstructive pattern — FEV1/FVC <0.70 post-bronchodilator, FVC normal or reduced; Restrictive: FEV1/FVC normal or elevated, TLC <80% predicted\n\nCOPD is defined by persistent airflow obstruction. Restrictive disease (fibrosis, obesity, NMD) shows reduced TLC with preserved or increased FEV1/FVC ratio. Mixed patterns occur (bronchiectasis with fibrosis)."
    difficulty: easy
    tags: [spirometry, obstructive, restrictive, FEV1/FVC, COPD, respirology]
  - front: "A 66-year-old COPD patient develops worsening dyspnea and peripheral edema. CXR shows enlarged heart and bilateral pleural effusions. What complication is present?"
    back: "Cor pulmonale — right heart failure from pulmonary hypertension secondary to chronic hypoxemia\n\nCOPD-related pulmonary hypertension results from hypoxic pulmonary vasoconstriction and vascular remodeling. Treatment: LTOT is most effective intervention. Diuretics for edema. Sildenafil and other pulmonary arterial HTN drugs have limited evidence in COPD-associated PH."
    difficulty: hard
    tags: [cor pulmonale, pulmonary hypertension, COPD complication, LTOT, respirology]
  - front: "What are the criteria for hospital admission in AECOPD?"
    back: "Severe dyspnea, SpO2 <88%, altered mental status, inability to manage at home, high social risk, respiratory failure (pH <7.35, PaCO2 >45), failure of outpatient treatment\n\nCTS guidelines provide criteria for safe outpatient management vs. hospitalization. Patients with comorbidities (pneumonia, CHF, PE) require admission. ICU transfer for pH <7.25, hemodynamic instability, or NIV failure."
    difficulty: medium
    tags: [AECOPD, hospital admission, criteria, respirology]
  - front: "What are the GOLD spirometric criteria for COPD?"
    back: "Post-bronchodilator FEV1/FVC < 0.70\n\nGOLD stages: 1(>=80%), 2(50-79%), 3(30-49%), 4(<30%). Fixed ratio may overdiagnose in elderly."
    difficulty: easy
    tags: [COPD, GOLD]
  - front: "When should ICS be added to COPD therapy?"
    back: "Frequent exacerbations (>=2/yr) despite LAMA+LABA AND blood eos >=300\n\nICS increases pneumonia risk. Triple therapy (ICS+LAMA+LABA) reduces mortality per ETHOS/IMPACT trials."
    difficulty: hard
    tags: [COPD, ICS]
  - front: "What are indications for long-term O2 in COPD?"
    back: "PaO2 <=55 or SpO2 <=88% at rest, OR PaO2 56-59 with cor pulmonale/polycythemia\n\nMust use >=15 hrs/day for mortality benefit. Nocturnal O2 alone does not reduce mortality."
    difficulty: medium
    tags: [COPD, oxygen]
  - front: "What is the GOLD classification system for COPD severity by spirometry?"
    back: "GOLD 1: FEV1 ≥80% predicted (mild); GOLD 2: 50-79% (moderate); GOLD 3: 30-49% (severe); GOLD 4: <30% (very severe). All require post-bronchodilator FEV1/FVC <0.70.\n\nGOLD spirometric grading is separate from the ABE assessment (symptoms + exacerbation history). Post-bronchodilator values are used to confirm persistent airflow limitation. FEV1/FVC naturally declines with age; using fixed ratio may over-diagnose in elderly."
    difficulty: medium
    tags: [COPD, GOLD, spirometry, FEV1, classification, respirology]
  - front: "Describe the GOLD ABE assessment tool for COPD management decisions."
    back: "Group A: low symptoms (mMRC 0-1, CAT <10) + 0-1 non-hospitalized exacerbations. Group B: high symptoms + 0-1 non-hospitalized exacerbations. Group E: ≥2 moderate exacerbations OR ≥1 hospitalized exacerbation (any symptoms).\n\nGOLD 2023 replaced ABCD with ABE. Group A: bronchodilator PRN. Group B: LABA or LAMA. Group E: LAMA/LABA (or LABA/LAMA/ICS if eosinophils ≥300). This separates spirometric severity from treatment group assignment."
    difficulty: hard
    tags: [COPD, GOLD, ABE, mMRC, CAT, respirology]
  - front: "When should ICS be added to COPD therapy and when should it be avoided?"
    back: "Add ICS if: eosinophils ≥300, asthma-COPD overlap, or ≥2 exacerbations/year despite LAMA/LABA. Avoid ICS if: recurrent pneumonia, mycobacterial infection, eosinophils <100.\n\nICS in COPD increases pneumonia risk (especially fluticasone). Blood eosinophils are the best biomarker for ICS response. CTS and GOLD recommend eosinophil-guided ICS use. Triple therapy (ICS/LAMA/LABA) reduces exacerbations and mortality in selected patients (IMPACT trial)."
    difficulty: hard
    tags: [COPD, ICS, eosinophils, pneumonia, triple therapy, respirology]
  - front: "What is the management of an acute exacerbation of COPD (AECOPD)?"
    back: "Short-acting bronchodilators (salbutamol + ipratropium), systemic corticosteroids (prednisone 40 mg x 5 days), antibiotics if purulent sputum or severe exacerbation, O2 to target SpO2 88-92%.\n\nCTS recommends antibiotics for Anthonisen Type 1 exacerbations (increased dyspnea + sputum volume + purulence). First-line: amoxicillin, doxycycline, or TMP-SMX. Short steroid courses (5 days) are as effective as 14 days. NIV if pH <7.35 with hypercapnia."
    difficulty: hard
    tags: [COPD, AECOPD, exacerbation, prednisone, antibiotics, respirology]
  - front: "What are the indications for non-invasive ventilation (NIV/BiPAP) in AECOPD?"
    back: "Respiratory acidosis (pH <7.35, PaCO2 >45), severe dyspnea with accessory muscle use, persistent hypoxemia despite supplemental O2\n\nNIV reduces intubation rates by 60% and mortality by 50% in AECOPD. Contraindications: facial trauma, GCS <8, inability to protect airway, hemodynamic instability, undrained pneumothorax. Reassess in 1-2 hours; intubate if pH worsens."
    difficulty: hard
    tags: [COPD, NIV, BiPAP, respiratory failure, respirology]
  - front: "What is the pathophysiology of COPD including the protease-antiprotease imbalance?"
    back: "Chronic inflammation (neutrophils, macrophages, CD8+ T-cells) → protease excess (neutrophil elastase, MMP) over antiproteases (α1-antitrypsin) → alveolar wall destruction (emphysema) + goblet cell hyperplasia/mucus (chronic bronchitis)\n\nUnlike asthma (eosinophils, CD4+, Th2), COPD is driven by neutrophils, CD8+, Th1. Oxidative stress from smoking inactivates antiproteases and activates NF-κB. This explains why ICS (targeting eosinophilic inflammation) are less effective in COPD than asthma."
    difficulty: hard
    tags: [COPD, pathophysiology, protease, elastase, emphysema, respirology]
  - front: "When should α1-antitrypsin (AAT) deficiency be tested in COPD?"
    back: "Test all COPD patients at least once (CTS), especially if: onset <45 years, minimal smoking history, basilar emphysema, family history, associated liver disease, or panniculitis\n\nAAT deficiency (PiZZ genotype) is the most common genetic cause of emphysema. Serum AAT level <11 μmol/L (or <57 mg/dL) warrants genotyping. IV augmentation therapy is available for select patients. Affects 1:3000-5000 Canadians of European descent."
    difficulty: hard
    tags: [COPD, alpha-1-antitrypsin, genetic, screening, respirology]
  - front: "What are the indications for long-term oxygen therapy (LTOT) in COPD?"
    back: "PaO2 ≤55 mmHg or SpO2 ≤88% at rest; OR PaO2 56-59 mmHg with cor pulmonale, polycythemia (Hct >55%), or pulmonary hypertension. Must be on optimal therapy, measured twice 3 weeks apart.\n\nLTOT ≥15 hours/day improves survival in hypoxemic COPD (NOTT and MRC trials). Target SpO2 88-92% to avoid hypercapnia. Does NOT improve survival in moderate resting or exercise-induced desaturation without severe resting hypoxemia (LOTT trial)."
    difficulty: hard
    tags: [COPD, LTOT, oxygen therapy, hypoxemia, respirology]
  - front: "What are the criteria for lung volume reduction surgery (LVRS) in COPD?"
    back: "Upper-lobe predominant emphysema + low exercise capacity after pulmonary rehab. FEV1 20-45% predicted. Contraindicated if FEV1 <20% with homogeneous emphysema or DLCO <20%.\n\nNETT trial showed survival benefit only in upper-lobe emphysema with low exercise capacity. Bronchoscopic lung volume reduction (endobronchial valves) is an alternative for selected patients with intact interlobar fissures and no collateral ventilation."
    difficulty: hard
    tags: [COPD, LVRS, surgery, emphysema, respirology]
  - front: "What vaccinations are recommended for COPD patients in Canada?"
    back: "Annual influenza, pneumococcal (PCV20 or PCV15+PPSV23), COVID-19 per NACI, Tdap once if not received in adulthood, RSV vaccine for ≥60 years, shingles (Shingrix) ≥50 years\n\nCTS and NACI strongly recommend influenza and pneumococcal vaccination to reduce AECOPD. Pneumococcal vaccine reduces invasive pneumococcal disease. NACI updated to preferentially recommend PCV20 for immunocompromised and those with chronic lung disease."
    difficulty: medium
    tags: [COPD, vaccination, influenza, pneumococcal, NACI, respirology]
  - front: "What is the role of pulmonary rehabilitation in COPD?"
    back: "Recommended for all COPD patients with persistent symptoms despite optimal pharmacotherapy (especially mMRC ≥2). Improves exercise capacity, dyspnea, quality of life, and reduces hospitalizations. 6-8 week minimum program.\n\nCTS recommends pulmonary rehab as a cornerstone of COPD management. Components: supervised exercise training, education, nutritional counseling, psychosocial support. Benefit is independent of GOLD stage. Post-exacerbation rehab within 4 weeks reduces readmissions."
    difficulty: medium
    tags: [COPD, pulmonary rehabilitation, exercise, CTS, respirology]
  - front: "How does COPD affect gas exchange and what is the V/Q mismatch pattern?"
    back: "Emphysema: destroyed alveoli → high V/Q (dead space). Chronic bronchitis: mucus plugging → low V/Q (shunt physiology). Both cause hypoxemia; chronic bronchitis more prone to hypercapnia.\n\nThe 'pink puffer' (emphysema-predominant) maintains ventilation drive with near-normal PaCO2 but is dyspneic. The 'blue bloater' (bronchitis-predominant) has chronic hypercapnia, cyanosis, and cor pulmonale. Most patients have mixed phenotype."
    difficulty: hard
    tags: [COPD, V/Q mismatch, gas exchange, emphysema, chronic bronchitis, respirology]
  - front: "What pharmacologic options reduce COPD exacerbation frequency beyond bronchodilators?"
    back: "ICS (if eosinophils ≥300), roflumilast (PDE4 inhibitor if FEV1 <50% + chronic bronchitis phenotype + frequent exacerbations), azithromycin prophylaxis (250 mg daily), NAC\n\nRoflumilast has GI side effects (diarrhea, weight loss) and psychiatric effects. Azithromycin reduces exacerbations but risks QTc prolongation, hearing loss, and antimicrobial resistance. CTS recommends these as add-on to optimized inhaler therapy."
    difficulty: hard
    tags: [COPD, roflumilast, azithromycin, exacerbation prevention, respirology]
  - front: "What defines cor pulmonale and how does it develop in COPD?"
    back: "Right heart failure secondary to pulmonary hypertension from chronic hypoxic pulmonary vasoconstriction. Features: JVD, peripheral edema, hepatomegaly, loud P2, right axis deviation on ECG.\n\nChronic hypoxemia causes pulmonary arterial smooth muscle remodeling and fixed pulmonary hypertension. LTOT is the primary treatment by correcting hypoxemia. Diuretics for fluid overload. Calcium channel blockers only if vasoreactivity testing positive (rare in COPD-related PH)."
    difficulty: hard
    tags: [COPD, cor pulmonale, pulmonary hypertension, right heart failure, respirology]
  - front: "What is the BODE index in COPD and what does it predict?"
    back: "B=BMI (<21=1pt), O=airflow Obstruction (FEV1%), D=Dyspnea (mMRC), E=Exercise capacity (6MWD). Score 0-10; higher scores predict higher mortality. BODE >7: median survival ~3 years.\n\nBODE is a better mortality predictor than FEV1 alone because it captures systemic effects of COPD. Used to guide goals-of-care discussions and lung transplant referral (BODE ≥7). Also helps identify patients who benefit most from pulmonary rehabilitation."
    difficulty: hard
    tags: [COPD, BODE, prognosis, mortality, 6MWD, respirology]
  - front: "What is the pathophysiology of COPD?"
    back: "Chronic inflammation (neutrophil/macrophage-mediated, protease-antiprotease imbalance, oxidative stress) causing small airway fibrosis/obstruction + parenchymal destruction (emphysema) = irreversible airflow limitation\n\nEmphysema: elastase destroys alveolar walls, reducing elastic recoil and gas exchange surface. Chronic bronchitis: mucus gland hyperplasia, goblet cell metaplasia, chronic productive cough. Alpha-1 antitrypsin deficiency in young non-smokers."
    difficulty: medium
    tags: [COPD, pathophysiology]
  - front: "What is obstructive sleep apnea and how is it diagnosed?"
    back: "Recurrent upper airway collapse during sleep. STOP-BANG: Snoring, Tired, Observed apnea, Pressure(HTN), BMI>35, Age>50, Neck>40cm, Gender(male). >=3 = high risk. Diagnose: polysomnography AHI >=5\n\nAHI 5-15 mild, 15-30 moderate, >30 severe. Treatment: CPAP (first-line for moderate-severe), weight loss, positional therapy, mandibular advancement device. Untreated OSA: HTN, AF, stroke, MVA risk, metabolic syndrome."
    difficulty: medium
    tags: [OSA, STOP-BANG]
  - front: "What is the STOP-BANG questionnaire, and how is it used to screen for obstructive sleep apnea?"
    back: "STOP-BANG: Snoring, Tiredness, Observed apneas, Pressure (hypertension), BMI >35, Age >50, Neck circumference >40 cm, Gender (male). Score ≥3: intermediate risk; ≥5: high risk for moderate-severe OSA.\n\nOSA affects ~5-15% of the general population and is underdiagnosed. It is associated with resistant hypertension, atrial fibrillation, stroke, and motor vehicle accidents. Screening is particularly important preoperatively, as undiagnosed OSA increases risk of postoperative respiratory complications."
    difficulty: easy
    tags: [STOP-BANG, OSA screening, obstructive sleep apnea, risk stratification]
  - front: "How is obstructive sleep apnea diagnosed, and what does the apnea-hypopnea index (AHI) indicate?"
    back: "Diagnosis: polysomnography (PSG) or home sleep apnea test. AHI = apneas + hypopneas per hour of sleep. Mild OSA: AHI 5-14, Moderate: 15-29, Severe: ≥30. CPAP is first-line for moderate-severe OSA.\n\nPolysomnography is the gold standard and also evaluates sleep stages, oxygen desaturation, and limb movements. Home sleep testing is appropriate for patients with high pretest probability and no significant comorbidities. CPAP reduces daytime sleepiness, blood pressure, and cardiovascular risk when used ≥4 hours/night."
    difficulty: medium
    tags: [polysomnography, AHI, OSA diagnosis, CPAP, sleep study]
  - front: "What are the treatment options for obstructive sleep apnea besides CPAP?"
    back: "Weight loss (most effective long-term), mandibular advancement devices (mild-moderate OSA), positional therapy (supine-predominant OSA), uvulopalatopharyngoplasty (UPPP, select patients), hypoglossal nerve stimulation (moderate-severe OSA intolerant of CPAP).\n\nA 10% weight loss can reduce AHI by ~50%. Mandibular advancement devices are less effective than CPAP but have better adherence. UPPP success rates are only ~40-50%. Hypoglossal nerve stimulation (Inspire device) is emerging as an option for patients who cannot tolerate CPAP and meet selection criteria."
    difficulty: medium
    tags: [OSA treatment, CPAP alternatives, weight loss, mandibular advancement, UPPP]
  - front: "What is the first-line treatment for chronic insomnia, and when is pharmacotherapy appropriate?"
    back: "CBT-I (Cognitive Behavioral Therapy for Insomnia) is first-line. Pharmacotherapy is appropriate when CBT-I is unavailable, ineffective, or as a short-term bridge. Options: short-acting benzodiazepine receptor agonists (zopiclone), melatonin receptor agonists, or low-dose trazodone.\n\nCBT-I addresses the cognitive and behavioral perpetuating factors of insomnia (stimulus control, sleep restriction, cognitive restructuring) and has durable effects beyond treatment. Benzodiazepines and Z-drugs should be avoided long-term due to tolerance, dependence, and fall risk in elderly. Sleep hygiene alone is insufficient for chronic insomnia."
    difficulty: medium
    tags: [insomnia, CBT-I, sleep hygiene, pharmacotherapy, zopiclone]
  - front: "What are the components of good sleep hygiene counseling?"
    back: "Maintain consistent sleep-wake schedule, avoid screens 1 hour before bed, keep bedroom dark/cool/quiet, avoid caffeine after noon, avoid alcohol before bed, exercise regularly but not within 3 hours of bedtime, use bed only for sleep and intimacy, avoid daytime napping >30 minutes.\n\nSleep hygiene is a necessary but usually insufficient standalone treatment for chronic insomnia. It is most effective as part of CBT-I. Caffeine has a half-life of 5-7 hours, and alcohol, while sedating initially, fragments sleep architecture and worsens OSA. Blue light from screens suppresses melatonin secretion."
    difficulty: easy
    tags: [sleep hygiene, insomnia prevention, circadian rhythm, patient education]
  - front: "What is narcolepsy type 1, and what are the classic tetrad of symptoms?"
    back: "Narcolepsy type 1 (with cataplexy): excessive daytime sleepiness, cataplexy (sudden loss of muscle tone triggered by emotion), sleep paralysis, and hypnagogic/hypnopompic hallucinations. Caused by loss of hypocretin (orexin)-producing neurons.\n\nCataplexy is pathognomonic for narcolepsy type 1 and distinguishes it from type 2 (without cataplexy). Diagnosis is confirmed by MSLT showing mean sleep latency ≤8 minutes with ≥2 sleep-onset REM periods (SOREMPs), or low CSF hypocretin-1 levels. Treatment includes stimulants (modafinil) for sleepiness and sodium oxybate for cataplexy."
    difficulty: medium
    tags: [narcolepsy, cataplexy, hypocretin, MSLT, excessive daytime sleepiness]
  - front: "How does narcolepsy type 2 differ from type 1, and what are the treatment options for excessive daytime sleepiness?"
    back: "Type 2 lacks cataplexy and has normal CSF hypocretin levels. Treatment for EDS: modafinil/armodafinil (first-line), methylphenidate or amphetamines (second-line), solriamfetol, pitolisant (histamine H3 antagonist).\n\nNarcolepsy type 2 is diagnosed by MSLT criteria in the absence of cataplexy and other causes of hypersomnia. Scheduled naps (15-20 min) can supplement pharmacotherapy. Patients should be counseled about driving safety, and many jurisdictions require physician reporting of conditions affecting fitness to drive."
    difficulty: medium
    tags: [narcolepsy type 2, modafinil, excessive daytime sleepiness, stimulants, treatment]
  - front: "A patient on CPAP for OSA reports persistent daytime sleepiness despite good adherence (>6 hours/night) and AHI <5 on download. What should you consider?"
    back: "Consider comorbid sleep disorders (narcolepsy, periodic limb movement disorder, insufficient sleep syndrome), depression, hypothyroidism, medication side effects, or residual sleepiness of OSA. Formal in-lab polysomnography and MSLT may be needed.\n\nResidual excessive sleepiness despite optimal CPAP therapy occurs in ~5-10% of OSA patients. Solriamfetol and modafinil are approved for residual sleepiness in OSA. It is important to verify adherence data, ensure adequate total sleep time (≥7 hours), and evaluate for depression and other sleep disorders before adding wake-promoting agents."
    difficulty: hard
    tags: [residual sleepiness, CPAP adherence, OSA comorbidity, differential diagnosis, sleep medicine]
  - front: "What are the physiological consequences of untreated severe OSA, and which cardiovascular conditions are most strongly associated?"
    back: "Intermittent hypoxia causes sympathetic activation, oxidative stress, systemic inflammation, and endothelial dysfunction. Strongly associated conditions: resistant hypertension, atrial fibrillation, heart failure, stroke, pulmonary hypertension, and sudden cardiac death (nocturnal).\n\nOSA is the most common identifiable cause of resistant hypertension. AF recurrence after cardioversion or ablation is significantly higher in untreated OSA. CPAP treatment reduces blood pressure by ~2-3 mmHg on average and may reduce AF recurrence. Screening for OSA is recommended in patients with resistant hypertension or recurrent AF."
    difficulty: medium
    tags: [OSA complications, resistant hypertension, atrial fibrillation, cardiovascular risk, intermittent hypoxia]
  - front: "What is central sleep apnea, and how does it differ from obstructive sleep apnea in pathophysiology and treatment?"
    back: "CSA involves absent respiratory effort due to impaired central respiratory drive (no airflow AND no chest/abdominal movement). OSA has respiratory effort against a collapsed airway. CSA causes: heart failure (Cheyne-Stokes), opioids, stroke, high altitude. Treatment: address underlying cause, adaptive servo-ventilation (ASV) — but ASV is contraindicated in HFrEF (EF ≤45%).\n\nThe SERVE-HF trial showed increased cardiovascular mortality with ASV in HFrEF patients with CSA, leading to a contraindication. CPAP may be used cautiously in CSA with heart failure. Opioid-induced CSA is treated by reducing opioid dose when possible. Cheyne-Stokes respiration with CSA in heart failure indicates poor prognosis."
    difficulty: hard
    tags: [central sleep apnea, Cheyne-Stokes, ASV, SERVE-HF, heart failure]
  - front: "Why are beta-blockers often contraindicated in MAT treatment?"
    back: "Beta-blockers may be contraindicated due to severe underlying pulmonary disease (COPD) commonly associated with MAT\n\nMAT frequently occurs in patients with COPD or hypoxemia, where beta-blockers can precipitate bronchospasm and worsen respiratory function."
    difficulty: medium
    tags: [cardiology, MAT, treatment, contraindications, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is the hemodynamic threshold for severe COPD that contraindicates cardiac transplant?"
    back: "FEV1 <1L\n\nSevere airflow obstruction compromises the ability to clear secretions and tolerate the physiological demands of transplant surgery and recovery."
    difficulty: medium
    tags: [COPD, cardiac-transplant, pulmonary-function, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What are secondary causes of osteoporosis?"
    back: "Chronic malnutrition or malabsorption, chronic liver disease, COPD, IBD, chronic inflammatory conditions\n\nSecondary osteoporosis occurs due to other medical conditions that affect bone health indirectly through malabsorption, chronic inflammation, or other mechanisms."
    difficulty: easy
    tags: [osteoporosis, risk-factors, secondary, toronto-notes, pages-0421-0422-0423-0424-0425-0426-0427-0428-0429-0430]
  - front: "List causes of high dead space ventilation leading to hypercapnia"
    back: "COPD, CF, chest wall disorders, rapid shallow breathing pattern\n\nDead space ventilation means perfusion without ventilation. Despite normal or increased minute ventilation, alveolar ventilation is inadequate for CO2 removal."
    difficulty: easy
    tags: [hypercapnia, dead space, causes, COPD, toronto-notes, pages-1481-1482-1483-1484-1485-1486-1487-1488-1489-1490]
  - front: "What is the benefit of adding tiotropium to LABA plus ICS in uncontrolled asthma?"
    back: "Tiotropium improves FEV1 (86-154 mL improvement) and delays time to first severe exacerbation by 56 days\n\nThe PrimoTinA-asthma trials showed tiotropium added to LABA+ICS provides better lung function and fewer exacerbations."
    difficulty: hard
    tags: [asthma, tiotropium, LAMA, add-on therapy, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What FEV1 improvement does tiotropium add to LABA plus ICS?"
    back: "86-154 mL improvement in peak FEV1\n\nPrimoTinA-asthma trials 2021: significant improvements in FEV1 and 56-day delay to first severe exacerbation"
    difficulty: hard
    tags: [asthma, tiotropium, LAMA, lung function, toronto-notes, pages-1491-1492-1493-1494-1495-1496-1497-1498-1499-1500]
  - front: "What are the cardinal symptoms of acute exacerbation of COPD (AECOPD)?"
    back: "Increased dyspnea, increased coughing frequency or severity, increased sputum volume or purulence. Common triggers: viral infection, pneumonia, PE, CHF, MI, drugs.\n\nThe Anthonisen criteria define AECOPD by these three cardinal symptoms. The presence of all three (or two including increased sputum purulence) indicates a need for antibiotics. Only one symptom indicates mild exacerbation not requiring antibiotics. Key differentials (CHF, PE, pneumonia, ACS) must be excluded."
    difficulty: easy
    tags: [COPD, AECOPD, exacerbation, cardinal symptoms]
  - front: "What is the target oxygen saturation in AECOPD and why?"
    back: "Target O2 saturation 88–92%. Do not withhold oxygen if hypoxic, but avoid over-oxygenating. Many COPD patients are chronic CO2 retainers who rely on hypoxic drive; excessive O2 can worsen hypercapnia.\n\nThe Haldane effect and V/Q mismatch explain hyperoxia-induced hypercapnia in COPD. However, hypoxia is immediately life-threatening and must be corrected. A controlled target of 88–92% balances these risks. Titrated oxygen delivery is preferable to high-flow O2."
    difficulty: medium
    tags: [COPD, oxygen therapy, hypercapnia, O2 target]
  - front: "When are antibiotics indicated in AECOPD?"
    back: "Antibiotics are indicated when all 3 cardinal symptoms are present (increased dyspnea, sputum volume, purulence), OR 2 cardinal symptoms including increased sputum purulence, OR mechanical ventilation. Choices: TMP/SMX, cephalosporins, respiratory quinolones. No antibiotics for mild exacerbation (only 1 of 3 cardinal symptoms).\n\nApproximately 50% of AECOPD exacerbations are caused by bacteria (most commonly H. influenzae, S. pneumoniae, M. catarrhalis). The Anthonisen criteria guide antibiotic decisions. Purulent sputum is the best clinical predictor of bacterial etiology. Fluoroquinolones have better coverage for atypical organisms."
    difficulty: medium
    tags: [COPD, antibiotics, AECOPD, Anthonisen criteria]
  - front: "What are the indications for non-invasive positive pressure ventilation (NIPPV/BiPAP) in AECOPD?"
    back: "Severe distress or signs of fatigue, arterial pH <7.35, or hypercapnia. NIPPV reduces need for intubation and mortality in AECOPD. Consider intubation if NIPPV not tolerated (decreased LOC, vomiting).\n\nNIPPV (BiPAP or CPAP) reduces work of breathing, improves alveolar ventilation, and decreases respiratory muscle fatigue. It is preferred over intubation when tolerated. Contraindications include altered mental status, inability to protect airway, and cardiovascular instability."
    difficulty: medium
    tags: [COPD, BiPAP, NIPPV, ventilation, intubation]
  - front: "What is dyspnea and what are the broad categories in its differential diagnosis?"
    back: "Dyspnea: uncomfortable, abnormal awareness of breathing / subjective SOB. Differential: Pulmonary (pneumonia, COVID, COPD, asthma, PE, lung cancer, congenital); Cardiac (HF, CAD, MI, cardiomyopathy, valvular, pericardial); Mixed/Other (deconditioning, psychological trauma, neuromuscular); Functional (anxiety, panic attack, hyperventilation).\n\nDyspnea assessment requires history (associated symptoms, occupational/environmental exposure, travel, medications, smoking), physical exam (vitals, respiratory, precordial), and investigations (CXR, ECG, PFTs, ABG if acutely indicated)."
    difficulty: easy
    tags: [dyspnea, shortness of breath, differential diagnosis, pulmonary, cardiac]
  - front: "What is the definition of COPD and what spirometric value is required for diagnosis?"
    back: "Progressive and irreversible condition of the lung characterized by chronic obstruction to airflow, with many patients having periodic exacerbations, gas trapping, lung hyperinflation, and at end stages weight loss. Diagnosis requires spirometry showing post-bronchodilator FEV1/FVC <0.70 (or below lower limit of normal).\n\nCOPD is often 'overdiagnosed' due to inaccuracy of clinical diagnosis alone—objective spirometry is mandatory. Two phenotypes: chronic bronchitis (defined clinically) and emphysema (defined pathologically); most patients have elements of both. Gradual decrease in FEV1 over time, more rapidly with each acute exacerbation."
    difficulty: easy
    tags: [respirology, COPD, definition, spirometry, diagnosis]
  - front: "Compare and contrast the 'Blue Bloater' (chronic bronchitis) and 'Pink Puffer' (emphysema) phenotypes of COPD."
    back: "Blue Bloater (chronic bronchitis): productive cough, purulent sputum, cyanosis, peripheral edema (cor pulmonale), crackles/wheezes, frequently obese, CXR shows increased bronchovascular markings. PFTs: ↓FEV1, ↓FEV1/FVC, normal TLC, normal or ↓DLCO. Pink Puffer (emphysema): dyspnea on exertion, minimal cough, tachypnea, pursed-lip breathing, cachectic, barrel chest, hyperresonant, ↓breath sounds, CXR shows hyperinflation, flat diaphragm, ↑retrosternal space, bullae. PFTs: ↓FEV1, ↓FEV1/FVC, ↑TLC (hyperinflation), ↑RV (gas trapping), ↓DLCO.\n\nThese are extreme ends of the spectrum—most COPD patients have elements of both. These terms are outdated and rarely used in clinical practice. Chronic bronchitis is defined clinically (productive cough most days for ≥3 consecutive months in 2 successive years); emphysema is defined pathologically (dilation and destruction of air spaces distal to terminal bronchiole)."
    difficulty: medium
    tags: [respirology, COPD, chronic-bronchitis, emphysema, clinical-features]
  - front: "What are the two types of emphysema and their associations?"
    back: "1) Centrilobular: respiratory bronchioles predominantly affected; typical form in smokers, primarily affects upper lung zones. 2) Panacinar (panlobular): all parts of acinus affected; accounts for ~1% of emphysema cases, typically from alpha-1 antitrypsin deficiency, primarily affects lower lobes.\n\nAlpha-1 antitrypsin (A1AT) deficiency is an important treatable risk factor for COPD that should be excluded, especially in non-smokers or younger patients with emphysema. It causes panacinar emphysema with lower lobe predominance, contrasting with the upper lobe predominance of smoking-related emphysema."
    difficulty: medium
    tags: [respirology, COPD, emphysema, alpha-1-antitrypsin]
  - front: "What are the risk factors for COPD?"
    back: "1) Smoking: #1 risk factor in Western countries; 2) Environmental: wood smoke/biomass fuel exposure (especially developing countries), air pollution, occupational exposures; 3) Treatable: alpha-1 antitrypsin deficiency, HIV (accelerated COPD progression), concurrent bronchial hyperactivity (asthma-COPD overlap, 'ACO'); 4) Demographic: age, history of childhood respiratory infections, low socioeconomic status.\n\nSmoking cessation is the single most important intervention for patients with COPD who smoke. Work-related exposures and biomass fuels are underappreciated causes globally. Asthma-COPD overlap (ACO) has features of both conditions and may benefit from combined therapy."
    difficulty: easy
    tags: [respirology, COPD, risk-factors, smoking]
  - front: "What are the GOLD spirometric severity classifications for COPD?"
    back: "Based on post-bronchodilator FEV1 (% predicted) in patients with FEV1/FVC <0.70: GOLD 1 (Mild): FEV1 ≥80% predicted; GOLD 2 (Moderate): 50% ≤ FEV1 < 80%; GOLD 3 (Severe): 30% ≤ FEV1 < 50%; GOLD 4 (Very Severe): FEV1 <30% predicted.\n\nNote that FEV1 correlates weakly with symptoms; the COPD Assessment Tool (CAT) and mMRC dyspnea scale are used for comprehensive symptom assessment. Treatment decisions are based on both spirometric severity and symptom burden (CAT ≥10 and/or mMRC ≥2)."
    difficulty: easy
    tags: [respirology, COPD, GOLD, spirometry, severity]
  - front: "What are the indications for home oxygen therapy in COPD and what are its benefits?"
    back: "Indicated if: 1) PaO2 <55 mmHg; or 2) PaO2 56–59 mmHg with cor pulmonale or polycythemia. Benefits: prevents cor pulmonale and decreases mortality when used >15 hours/day. For CO2 retainers, maintain O2 saturation 88–92% to prevent worsening hypercapnia.\n\nMechanisms of hypercapnia worsening with excess O2 include: V/Q mismatch worsening, the Haldane effect (O2 displaces CO2 from hemoglobin), and decreased respiratory drive. Home oxygen is one of few interventions proven to prolong survival in COPD (along with smoking cessation and triple therapy in high-risk patients)."
    difficulty: medium
    tags: [respirology, COPD, oxygen-therapy, treatment, cor-pulmonale]
  - front: "Outline the stepwise pharmacological treatment for stable COPD."
    back: "All patients: short-acting bronchodilators PRN (SABA e.g. salbutamol; SAMA e.g. ipratropium; SABA/SAMA combination). For dyspnea (mMRC ≥1): add long-acting bronchodilators (LABA e.g. salmeterol/formoterol/indacaterol; or LAMA e.g. tiotropium/glycopyrronium). LAMA preferred over LABA for dyspnea, exercise, exacerbations. LABA/LAMA dual: for CAT >10 and mMRC >2 with FEV1 <80%. LABA/LAMA/ICS triple: for high exacerbation risk with high symptom burden (CAT ≥10 and/or mMRC ≥2) and FEV1 <80%. Add-ons for persistent exacerbations despite triple therapy: macrolide, PDE4 inhibitor (roflumilast, chronic bronchitic phenotype), N-acetylcysteine (NAC, chronic bronchitic phenotype).\n\nICS monotherapy increases pneumonia risk in COPD; ICS only as part of combination. Theophylline has insufficient evidence and high toxicity. Roflumilast is a PDE4 inhibitor that reduces exacerbations in chronic bronchitic phenotype. LAMA-containing therapies are superior to therapies without LAMA for exacerbation reduction."
    difficulty: hard
    tags: [respirology, COPD, treatment, bronchodilators, ICS, LABA, LAMA, canadian-guidelines]
  - front: "What are the indications for LABA/LAMA/ICS triple therapy in COPD and what mortality benefit does it provide?"
    back: "Indications: high exacerbation risk with high symptom burden and/or health status impairment (CAT ≥10 and/or mMRC ≥2) and FEV1 <80% predicted. Mortality benefit demonstrated in COPD patients meeting these criteria. Also used when LABA/LAMA fails to control symptoms, or for concomitant asthma.\n\nICS monotherapy is not recommended in COPD due to increased pneumonia risk. Triple therapy (LABA/LAMA/ICS) is superior to dual therapy for exacerbation reduction in high-risk patients. LABA/LAMA reduces moderate-to-severe exacerbations compared to LABA/ICS (HR 0.86) and LABA alone (HR 0.80) in high-risk populations."
    difficulty: hard
    tags: [respirology, COPD, triple-therapy, ICS, LABA, LAMA, exacerbations]
  - front: "What is the management of acute exacerbations of COPD (AECOPD)?"
    back: "Definition: sustained (>48h) worsening of dyspnea, cough, or sputum production. Management: ABCs + consider NIV early if high CO2/reduced pH; O2 target 88–92% for CO2 retainers; bronchodilators (SABA + anticholinergic via MDI/spacer or nebulizer); systemic corticosteroids (oral prednisone, 5 days is sufficient; IV methylprednisolone if absorption issues); antibiotics if purulent exacerbation (no risk factors: doxycycline/macrolide/amoxicillin; risk factors for resistance: amoxicillin-clavulanate or respiratory fluoroquinolone); pulmonary rehabilitation within 2 weeks post-exacerbation.\n\nEtiology includes viral URTI, bacteria, air pollution, CHF, PE, MI. Systemic corticosteroids reduce treatment failure by >50% vs placebo (Cochrane 2014). 5 days of oral corticosteroids is likely sufficient (Cochrane 2018). ICU admission for life-threatening exacerbations; NIV (BiPAP) preferred over intubation when possible."
    difficulty: medium
    tags: [respirology, COPD, AECOPD, acute-exacerbation, treatment, antibiotics]
  - front: "What is the BODE index for COPD prognosis?"
    back: "10-point index predicting risk of death from COPD (greater score = higher mortality): B - Body mass index <21 (+1); O - Obstruction FEV1: 50–64% (+1), 36–49% (+2), <35% (+3); D - Dyspnea mMRC: walks slower than peers on level (+1), stops at 100 yards on level (+2), too breathless to leave house or dress (+3); E - Exercise capacity 6-min walk: 250–349 m (+1), 150–249 m (+2), <149 m (+3). Score also predicts hospitalization.\n\nFEV1 alone is a poor predictor of COPD mortality. The BODE index incorporates functional, anthropometric, and exercise capacity data. Prognostic factors include: frequency/severity of exacerbations (single best predictor), lung function tests, mMRC scale, and development of hypoxemia/hypercapnia/cor pulmonale. 5-year survival: FEV1 <1L ≈ 50%, FEV1 <0.75L ≈ 33%."
    difficulty: medium
    tags: [respirology, COPD, prognosis, BODE-index]
  - front: "What target O2 saturation should be maintained in COPD patients with CO2 retention, and why?"
    back: "Target O2 saturation 88–92%. Excess O2 can worsen hypercapnia through: 1) Worsening V/Q mismatch; 2) Haldane effect (O2 displaces CO2 from hemoglobin, increasing dissolved CO2); 3) Decreased hypoxic respiratory drive.\n\nCO2 retainers have chronically elevated CO2 levels, usually with near-normal pH due to metabolic (bicarbonate) compensation. Giving high-flow O2 removes the hypoxic drive and worsens CO2 retention. The 88–92% target provides adequate oxygenation while avoiding CO2 accumulation."
    difficulty: medium
    tags: [respirology, COPD, oxygen, hypercapnia, CO2-retention, Haldane-effect]
  - front: "What are the complications of COPD?"
    back: "1) Chronic hypoxemia; 2) Polycythemia (secondary to hypoxemia); 3) Cor pulmonale (right heart failure); 4) Pneumothorax (rupture of bullae); 5) Depression; 6) COPD exacerbations; 7) Weight loss; 8) Pulmonary hypertension; 9) Respiratory failure.\n\nCor pulmonale results from pulmonary hypertension secondary to hypoxic pulmonary vasoconstriction and vascular bed destruction. Polycythemia is a compensatory response to chronic hypoxemia. Spontaneous pneumothorax can be life-threatening in severe emphysema due to bullae rupture. PE occurs in 5.9% of COPD patients admitted for worsening symptoms."
    difficulty: easy
    tags: [respirology, COPD, complications, cor-pulmonale]
  - front: "A 55-year-old male smoker presents with worsening dyspnea on exertion, cachectic appearance, pursed-lip breathing, and barrel chest. PFTs show FEV1/FVC 0.55, FEV1 42% predicted, TLC increased, RV increased, DLCO decreased. CXR shows hyperinflation, flat diaphragm, and bullae. What is the diagnosis and GOLD stage?"
    back: "Emphysema (Pink Puffer phenotype). GOLD Stage 3 (Severe): FEV1 30–50% predicted.\n\nThe clinical picture is classic for emphysema: cachectic, pursed-lip breathing (auto-PEEP creation), barrel chest (increased TLC), hyperresonance, decreased breath sounds, ↓DLCO (destroyed alveolar-capillary units). FEV1/FVC <0.7 confirms obstructive defect. FEV1 42% = GOLD 3. These patients are pink (maintained oxygenation by increased ventilatory effort) and puffer (pursed-lip breathing). BODE index should guide prognosis."
    difficulty: hard
    tags: [respirology, COPD, emphysema, GOLD, case-based, PFTs]
  - front: "What are the indications for antibiotics in acute COPD exacerbations?"
    back: "Antibiotics are indicated for purulent COPD exacerbations. For patients with NO risk factors for resistant organisms: any of doxycycline, macrolide, or amoxicillin. For patients WITH risk factors for resistant organisms: amoxicillin-clavulanic acid or respiratory fluoroquinolone (e.g., levofloxacin, moxifloxacin).\n\nPurulence of sputum indicates bacterial infection and is the key trigger for antibiotic use. Risk factors for resistant organisms include: frequent exacerbations, recent antibiotics, severe COPD, immunosuppression, structural lung disease. Not all AECOPD are bacterial—viral URTI is a common cause; non-purulent exacerbations do not require antibiotics."
    difficulty: medium
    tags: [respirology, COPD, AECOPD, antibiotics, treatment, canadian-guidelines]
  - front: "What is the role of pulmonary rehabilitation in COPD management?"
    back: "Pulmonary rehabilitation: may reduce mortality if offered within 2 weeks after hospitalization for acute COPD exacerbation. Should be offered to any patient with high symptom burden and/or frequent exacerbations to improve symptoms, quality of life, physical endurance, and to reduce exacerbations. Offered to patients with ≥2 moderate exacerbations or ≥1 severe acute exacerbation of COPD in the last year.\n\nPulmonary rehabilitation combines exercise training, self-management education, smoking cessation support, and active lifestyle promotion. It is one of the most effective non-pharmacologic interventions for COPD. Early rehabilitation post-exacerbation is key to preventing readmission. The benefits extend beyond exercise tolerance to include reduced anxiety and depression."
    difficulty: easy
    tags: [respirology, COPD, pulmonary-rehabilitation, treatment]
