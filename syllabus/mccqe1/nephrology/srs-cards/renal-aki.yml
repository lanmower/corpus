cards:
  - front: "Why do drugs like phenytoin have drug-specific nomograms for dosing?"
    back: "Because they follow non-linear (zero-order) kinetics, making dosing complex and requiring individualized guidance to avoid toxicity\n\nSaturation of metabolic enzymes causes dose-concentration relationships to become unpredictable, hence the need for specialized dosing charts."
    difficulty: medium
    tags: [pharmacokinetics, dosing, phenytoin, therapeutic-drug-monitoring, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "Why can eyebrows and eyelashes not regrow after plucking, but scalp hair can?"
    back: "Eyebrow, eyelash, and axillary hairs have a short anagen (growth) phase relative to their telogen (resting) phase, making regrowth impossible after removal; scalp hairs have longer anagen phases allowing regrowth\n\nThe ratio of anagen to telogen duration determines whether hair can regrow after removal. Hairs with short anagen:telogen ratios cannot regrow because their follicles enter permanent rest."
    difficulty: medium
    tags: [hair biology, anagen, hair regrowth, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What contraception requirements exist for women of childbearing potential taking acitretin?"
    back: "Two forms of reliable contraception necessary during treatment and for 3 years after discontinuation\n\nAcitretin has an extremely long half-life. Even after discontinuation, the drug remains in the system and continues to pose teratogenic risk for up to 3 years, requiring continued contraception."
    difficulty: hard
    tags: [acitretin, teratogenicity, contraception, psoriasis, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "Which hair types have short anagen phases making regrowth impossible if lost?"
    back: "Eyebrow, eyelash, and axillary hairs\n\nThese hairs have a short growth phase relative to their resting phase, so if destroyed, the follicles cannot regenerate hair."
    difficulty: easy
    tags: [hair biology, trichology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What does SAMPLE stand for in emergency history taking?"
    back: "Signs and symptoms, Allergies, Medications, Past medical history, Last meal, Events related to injury or illness\n\nSAMPLE is a mnemonic used in emergency medicine to ensure a comprehensive history is obtained systematically."
    difficulty: easy
    tags: [history, SAMPLE, emergency medicine, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What renal complications occur in hypertensive emergency?"
    back: "Nocturia, elevated Cr, proteinuria, hematuria, oliguria.\n\nHypertensive nephropathy can cause acute kidney injury."
    difficulty: medium
    tags: [hypertensive emergency, renal, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the renal manifestations of hypertensive emergency?"
    back: "Nocturia, elevated Cr, proteinuria, hematuria, oliguria\n\nRenal arteriolar damage impairs filtration and causes progressive kidney injury."
    difficulty: easy
    tags: [hypertensive emergency, renal, kidney, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What lab finding distinguishes FHH from primary hyperparathyroidism?"
    back: "Low urinary calcium excretion in FHH (calcium-creatinine clearance ratio <0.01)\n\nDespite hypercalcemia, FHH patients have inappropriately low urinary calcium due to defective calcium-sensing receptor."
    difficulty: medium
    tags: [hypercalcemia, FHH, urine calcium, differential, toronto-notes, pages-0351-0352-0353-0354-0355-0356-0357-0358-0359-0360]
  - front: "What investigations are recommended for gynecomastia?"
    back: "Serum TSH, prolactin, LH, FSH, total testosterone, estradiol, LFTs, creatinine, hCG (if elevated, locate primary tumor); breast U/S and possible mammography if differentiation from cancer is difficult; CXR and CT chest/abdomen/pelvis to locate neoplasm if hCG elevated\n\nInvestigations aim to identify underlying hormonal disorders or malignancies."
    difficulty: hard
    tags: [endocrinology, gynecomastia, investigation, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What laboratory investigations are indicated in gynecomastia?"
    back: "Serum TSH, PRL, LH, FSH, total testosterone, estradiol, LFTs, creatinine, hCG (if elevated, locate primary tumor), and ferritin if indicated\n\nTests evaluate endocrine causes and screen for underlying malignancy."
    difficulty: medium
    tags: [endocrinology, gynecomastia, investigations, lab, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What laboratory investigations are indicated for gynecomastia?"
    back: "Serum TSH, prolactin, LH, FSH, total testosterone, estradiol, LFTs, creatinine, and hCG (if hCG elevated, locate primary tumor); ferritin if indicated\n\nLabs help identify underlying endocrine disorders or neoplastic causes."
    difficulty: medium
    tags: [endocrinology, gynecomastia, investigations, laboratory, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
