# Plastic Surgery Hand (Surgery) - generated from srs-mccqe1
cards:
  - front: "What are Kanavel's four cardinal signs of suppurative flexor tenosynovitis?"
    back: "1. Point tenderness along the flexor tendon sheath between A-1 and A-5 pulley. 2. Pain on passive extension of the digit. 3. Fusiform (sausage) swelling of the digit. 4. Flexed posture of the digit (position of increased comfort).\n\nSuppurative flexor tenosynovitis is an emergency requiring immediate I&D in the OR. If untreated, it leads to tendon necrosis, rupture, and loss of hand function. Common causative organisms: Staphylococcus > Streptococcus > Gram-negative rods."
    difficulty: easy
    tags: [hand infections, flexor tenosynovitis, Kanavel signs, emergency]
  - front: "What is the treatment of non-suppurative vs. suppurative flexor tenosynovitis?"
    back: "Non-suppurative: antibiotics, resting hand splint, elevation until infection resolves, followed by hand therapy. Suppurative (produces pus): incision and drainage (I&D) in the OR.\n\nEarly recognition of purulent infection is critical. Esmarch tourniquet is avoided in hand space infections due to the risk of spreading infection proximally."
    difficulty: easy
    tags: [hand infections, flexor tenosynovitis, treatment, I&D]
  - front: "What is herpetic whitlow and how is it treated? Why is debridement contraindicated?"
    back: "Herpetic whitlow is a painful HSV-1 or HSV-2 infection presenting as vesicles around the fingertip or thumb. Usually self-limited. Treat with oral acyclovir in severe cases. Debridement is contraindicated because it can spread the virus and worsen infection.\n\nHerpetic whitlow is common in medical/dental personnel and children. Patients are infectious until lesions completely heal. Diagnosis is clinical but can be confirmed with viral culture/PCR or Tzanck smear. Distinguishing from a felon (which requires I&D) is critical."
    difficulty: easy
    tags: [hand infections, herpetic whitlow, HSV, acyclovir]
  - front: "What is a felon and how is it treated?"
    back: "A felon is a subcutaneous abscess in the pulp of a digit, typically multi-loculated due to fibrous septae; may be associated with osteomyelitis. Treatment: elevation, warm soaks, antibiotics. If obvious abscess, failure to resolve, or skin under pressure: I&D, Gram stain/cultures, adjust antibiotics based on results.\n\nFelons require I&D to adequately drain all loculated compartments within the pulp. Osteomyelitis of the distal phalanx is a potential complication requiring prolonged antibiotic therapy."
    difficulty: easy
    tags: [hand infections, felon, I&D, pulp abscess]
  - front: "What is paronychia, what causes acute vs. chronic, and how is each treated?"
    back: "Paronychia: infection of soft tissue around the fingernail (paronychium/beneath eponychial fold). Acute: caused by S. aureus (from hangnails, artificial nails, nail biting) — treat with warm compresses and oral antibiotics; if abscess, drainage avoiding the nail bed; nail plate removal if abscess extends beneath it. Chronic: caused by Candida (prolonged moisture exposure) — treat with antifungals, eponychial marsupialization, nail plate removal if needed.\n\nDistinguishing acute (bacterial) from chronic (fungal) paronychia guides treatment. Chronic paronychia typically presents with nail plate deformity and nail fold thickening without acute inflammation."
    difficulty: easy
    tags: [hand infections, paronychia, Candida, Staphylococcus]
  - front: "What are the indications for replantation of an amputated digit?"
    back: "Higher priority: thumb amputation, multiple digit amputations. Generally favorable: children (better results than adults), clean cut injuries. Relative contraindications: avulsion injuries, crush injuries, multiple level amputations (absolute contraindication).\n\nOptimal revascularization occurs within 6 hours. The amputated part should be wrapped in NS/RL-moistened gauze, placed in a waterproof plastic bag, and placed in a container on ice — never directly on ice, as thermal injury impairs survivability."
    difficulty: easy
    tags: [hand trauma, amputation, replantation, indications]
  - front: "How should an amputated finger be stored for transport?"
    back: "Gently irrigate with Ringer's Lactate, wrap in NS/RL-moistened sterile gauze, place inside a waterproof plastic bag, place that in a container, and place the container on ice. Do NOT place the amputated part directly on ice — this causes thermal injury and may impact survivability.\n\nProper storage preserves tissue viability for replantation. Cooling slows cellular metabolism, but direct ice contact causes frostbite injury to the tissue. The double-container method (bag inside container on ice) provides safe cooling."
    difficulty: easy
    tags: [hand trauma, amputation, replantation, storage]
  - front: "What is mallet finger, what are the two types, and how is it treated?"
    back: "Mallet finger: DIPJ flexed with loss of active extension. Bony mallet: fracture of distal phalanx distal to tendon insertion. Non-bony mallet: forced flexion of extended DIP causing extensor tendon rupture. Treatment: splint DIP in extension for 6 weeks with NO exception (even one episode of flexion requires restarting the 6-week clock), followed by 2 weeks of night splinting. If inadequate improvement, extend splinting by 4 more weeks. Operative options also exist.\n\nCompliance with uninterrupted extension splinting is essential. Failure to maintain continuous extension results in treatment failure and progression to a chronic fixed flexion deformity."
    difficulty: easy
    tags: [hand trauma, mallet finger, extensor tendon, splinting]
  - front: "What is boutonnière deformity, what causes it, and how is it treated?"
    back: "PIPJ flexed and DIPJ hyperextended. Caused by injury or disease affecting the central slip insertion at the dorsal base of the middle phalanx. Associated with RA, trauma (laceration, volar PIP dislocation, acute forceful flexion of PIP). Treatment: splint PIP in extension and allow active DIP motion full time for 6 weeks.\n\nCentral slip disruption allows lateral bands to migrate volarly, causing unopposed PIPJ flexion and DIPJ hyperextension. Early recognition and splinting prevents development of a fixed deformity requiring surgical correction."
    difficulty: easy
    tags: [hand trauma, boutonniere deformity, central slip, extensor tendon]
  - front: "What is swan neck deformity, its causes, and treatment?"
    back: "PIPJ hyperextended and DIPJ flexed. Causes: trauma (PIP volar plate injury), associated with RA and old untreated mallet deformity. Treatment: splint to prevent PIP hyperextension or DIP flexion; corrective procedures involve tendon rebalancing, arthrodesis, or arthroplasty.\n\nSwan neck deformity can result from mallet finger if left untreated — the loss of DIPJ extension causes increased tension on the lateral bands, shifting them dorsally and leading to PIP hyperextension."
    difficulty: easy
    tags: [hand trauma, swan neck deformity, PIP, RA]
  - front: "What is De Quervain's tenosynovitis and how is Finkelstein's test performed?"
    back: "De Quervain's: inflammation of the extensor tendons in the 1st extensor compartment (APL and EPB). Finkelstein's test: pain over the radial styloid is induced by making a fist, ulnarly deviating the wrist, and having the examiner passively flex the thumb into the palm. Positive test = pain over radial styloid.\n\nDe Quervain's is most common in the 2nd–4th decades of life, especially in new mothers. Treatment: NSAIDs, thumb spica splint, steroid injection into tendon sheath; surgery (release of 1st extensor compartment) for severe/refractory cases."
    difficulty: easy
    tags: [hand, De Quervain, tenosynovitis, Finkelstein test, APL, EPB]
  - front: "What is a ganglion cyst, where is it most common, and what are the treatment options?"
    back: "A ganglion is a fluid-filled synovial sac protruding from a joint capsule or tendon sheath. Most common soft tissue tumour of the hand and wrist (60% of masses). Most common location: dorsal wrist overlying the scapholunate ligament. Treatment: conservative (observation/reassurance), aspiration (30–60% recurrence within 1 year), steroid injection with aspiration, or operative excision (recurrence 5.9% dorsal wrist, 30% volar wrist).\n\nGanglion cysts are 3x more common in women and peak in the 2nd and 4th decades. They transilluminate on exam and do not move with tendon movement. Diagnosis is clinical; imaging rules out underlying articular pathology."
    difficulty: easy
    tags: [hand, ganglion cyst, soft tissue tumour, wrist]
  - front: "What is 'no-man's land' in flexor tendon anatomy and why is it significant?"
    back: "Zone 2 of the flexor tendons (roughly the middle of the finger between the A1 and A5 pulleys). Recovery of glide is very difficult after injury here due to the bulk within the sheath and the tendency to form adhesions between FDS and FDP.\n\nZone 2 injuries are the most challenging to manage surgically. Tendon repair within this zone carries higher rates of adhesion and worse outcomes. Management is surgical and must occur within 2 weeks to prevent tendon retraction."
    difficulty: easy
    tags: [hand, flexor tendons, zones, no-mans land]
  - front: "What are the A-2 and A-4 flexor pulleys and why are they important?"
    back: "The A-2 (over the proximal phalanx) and A-4 (over the middle phalanx) pulleys are the most important for efficient finger flexion. They prevent bowstringing of the flexor tendons during flexion.\n\nThese pulleys must be preserved or reconstructed during tendon surgery. Loss of A-2 or A-4 results in bowstringing, which significantly reduces the mechanical advantage of finger flexion."
    difficulty: medium
    tags: [hand, flexor pulleys, tendon anatomy, A2, A4]
  - front: "What is stenosing flexor tenosynovitis (trigger finger)? What are its clinical features and treatment?"
    back: "Inflammation and thickening of tendon or pulley (most commonly A-1 pulley near MCP), preventing smooth tendon gliding, causing clicking/locking in flexion or extension. Most commonly affects ring finger, then long finger and thumb. Associated with RA, DM, hypothyroidism, gout, pregnancy. Women 4x more likely. Non-surgical: NSAIDs, steroid injection, splinting. Surgical: incise A-1 pulley (indicated if no/minimal relief with steroids).\n\nRepeated steroid injections can weaken tendons and increase risk of rupture. Surgical release of the A-1 pulley is definitive treatment and allows unrestricted active finger motion."
    difficulty: easy
    tags: [hand, trigger finger, stenosing tenosynovitis, A1 pulley]
  - front: "What is the 'position of safety' for hand fracture splinting?"
    back: "Wrist extension 0–30°, MCP flexion 70–90°, IP joints in full extension.\n\nThis position maintains tension in the collateral ligaments, preventing contracture during immobilization. The most important complication of hand fracture immobilization is stiffness from incorrect splinting position."
    difficulty: easy
    tags: [hand fractures, splinting, position of safety, MCP]
  - front: "What is a Boxer's fracture and how is it managed?"
    back: "Acute fracture of the neck of the 5th metacarpal from impact with a closed fist. Presents with loss of metacarpal head prominence on closed fist, volar displacement of the metacarpal head. Closed reduction considered for angulation >40°, rotation, or manual labourers. If stable: ulnar gutter splint for 3–4 weeks with early protected ROM.\n\nMost Boxer's fractures are managed non-operatively. Surgical indications include angulation >40°, rotational deformity (scissoring), intra-articular extension, shortening >3–5 mm, or extensor lag."
    difficulty: easy
    tags: [hand fractures, Boxers fracture, 5th metacarpal, management]
  - front: "What is a Stener lesion and why must it be surgically repaired?"
    back: "A Stener lesion occurs with complete UCL tear of the thumb MCP joint, where the adductor aponeurosis becomes interposed between the torn ligament and the joint. This prevents proper healing and requires open surgical repair. Diagnosis can be made on ultrasound or MRI.\n\nWithout surgery, the interposed aponeurosis prevents ligament-to-bone healing, resulting in chronic instability of the thumb MCP joint. This is distinct from Skier's thumb (acute, stable) and Gamekeeper's thumb (chronic, may need reconstruction)."
    difficulty: medium
    tags: [hand trauma, UCL injury, Stener lesion, thumb, MCP]
  - front: "What is the difference between Skier's thumb and Gamekeeper's thumb?"
    back: "Skier's thumb: acute UCL injury of thumb MCP joint (from forced abduction, e.g., ski pole). If stable endpoint on stress testing → hand-based thumb spica splint for 4–6 weeks; if unstable → consider repair. Gamekeeper's thumb: chronic UCL injury, often requires ligament reconstruction with tendon graft.\n\nUCL rupture is presumed if the injured side deviates >30° in full extension or >15° in flexion compared to the contralateral hand. Complete tears require surgical evaluation, especially to rule out Stener lesion."
    difficulty: easy
    tags: [hand trauma, UCL, Skier thumb, Gamekeeper thumb, MCP]
  - front: "What is Dupuytren's disease, its epidemiology, and what is Dupuytren's diathesis?"
    back: "Dupuytren's: proliferative disorder of the palmar fascia forming painless nodules, fibrous cords, and flexion contractures at MCP and IP joints (flexor tendons NOT involved). Epidemiology: northern European descent, men > women, presents in 5th–7th decade, associated with (not caused by) alcohol, smoking, DM. Diathesis: male sex, early onset, strong family history (autosomal dominant), multiple digits, bilateral involvement, other sites (Ledderhose disease of foot, Peyronie's disease of penis).\n\nOrder of digit involvement: ring > little > long > thumb > index. Dupuytren's diathesis predicts aggressive course and higher recurrence after treatment."
    difficulty: easy
    tags: [hand, Dupuytrens disease, palmar fascia, contracture]
  - front: "What are the surgical indications and options for Dupuytren's disease?"
    back: "Surgical indications: MCP contracture >30°, any degree of PIP contracture, significant webspace contracture, functional or hygiene impairment, positive Hueston's tabletop test. Options: fasciotomy (simple division), fasciectomy (excision of diseased fascia), radical fasciectomy (complete excision), dermatofasciectomy (fascia + overlying skin). Non-surgical: steroid injection, Clostridium histolyticum (Xiaflex®), needle aponeurotomy.\n\nMCP joints have better outcomes than PIP joints post-treatment. PIP contractures are more resistant to correction and have higher recurrence rates. Capsulotomy of PIP may be needed if fasciectomy alone is insufficient."
    difficulty: medium
    tags: [hand, Dupuytrens disease, surgery, Hueston tabletop test]
  - front: "What is carpal tunnel syndrome? What are the clinical features that distinguish it from other neuropathies?"
    back: "Median nerve compression at the wrist by the flexor retinaculum/transverse carpal ligament. F:M = 4:1. Most common peripheral compression neuropathy. Classic: nocturnal hand numbness/pain relieved by shaking/dangling. Sensory loss in median nerve distribution but thenar eminence sensation SPARED (palmar cutaneous branch arises proximal to tunnel). Advanced: constant numbness, thenar wasting/weakness. Signs: Tinel's, Durkan's (pressure over tunnel <30 sec), Phalen's (wrist flexion).\n\nThe sparing of thenar eminence sensation is a key distinguishing feature — it confirms the lesion is at the wrist (carpal tunnel) rather than more proximal. Thenar motor weakness indicates involvement of the recurrent motor branch and is an indication for surgery."
    difficulty: easy
    tags: [carpal tunnel syndrome, median nerve, neuropathy, wrist]
  - front: "What are the secondary causes of carpal tunnel syndrome?"
    back: "Space occupying lesions (tumours, hypertrophic synovial tissue, fracture callus, osteophytes); metabolic/physiological (pregnancy, hypothyroidism, acromegaly, RA); repetitive strain (especially forced wrist flexion from work/hobbies).\n\nThe primary cause is idiopathic. Secondary causes should be investigated and treated as they may allow non-surgical resolution of symptoms. Hypothyroidism and acromegaly are classic systemic causes tested on the MCCQE1."
    difficulty: easy
    tags: [carpal tunnel syndrome, secondary causes, hypothyroidism, acromegaly]
  - front: "What are the treatment options for carpal tunnel syndrome and the indications for surgery?"
    back: "Conservative: nocturnal wrist splinting in neutral position, activity/ergonomic modifications. Medical: NSAIDs, corticosteroid injection. Surgical: median nerve decompression via transverse carpal ligament release. Surgical indications: failed conservative management or compromised motor function (thenar muscle wasting).\n\nNCS/EMG may confirm diagnosis but CTS is primarily clinical. Surgery involves release of the transverse carpal ligament and is highly effective. Thenar wasting indicates advanced disease and is an absolute indication for surgery to prevent permanent motor loss."
    difficulty: easy
    tags: [carpal tunnel syndrome, treatment, surgical indications, median nerve decompression]
  - front: "What are Erb-Duchenne and Klumpke's palsies?"
    back: "Erb-Duchenne (Duchenne-Erb): Upper brachial plexus (C5–C6) injury from head/shoulder distraction (e.g., motorcycle accident). Presents as 'waiter's tip' deformity (shoulder internal rotation, elbow extension and pronation, wrist flexion). Klumpke's palsy: Lower brachial plexus (C8–T1) from traction on abducted arm. Presents as 'claw hand'; may include Horner's syndrome.\n\nIn neonates, these injuries occur during difficult deliveries (shoulder dystocia for Erb's, arm traction for Klumpke's). Priorities of surgical repair: shoulder stabilization and elbow function. Surgical treatment includes neurolysis, neuroma resection, and nerve grafting."
    difficulty: easy
    tags: [brachial plexus, Erb palsy, Klumpke palsy, nerve injury]
  - front: "What is thoracic outlet syndrome and what are its two main subtypes?"
    back: "Thoracic outlet syndrome (TOS): compression of neurovascular structures at the thoracic outlet. Associated with large cervical rib, anomalous first rib, overhead arm work, neck muscle hypertrophy. Neurogenic TOS: compression of brachial plexus → upper limb paresthesia, pain, weakness. Vascular TOS: compression/thrombosis of subclavian artery (→ pain, pallor, Raynaud's) or vein (→ swelling, cyanosis).\n\nTOS is in the differential for adult-acquired brachial plexopathy. Investigations include EMG (neurogenic) and vascular imaging (arterial/venous). Treatment ranges from physiotherapy to first rib resection."
    difficulty: medium
    tags: [brachial plexus, thoracic outlet syndrome, cervical rib, TOS]
  - front: "What is Tinel's sign in nerve regeneration, and what is Wallerian degeneration?"
    back: "Tinel's sign: cutaneous percussion over a repaired or compressed nerve produces paresthesias, marking the level of nerve regeneration. It is absent for the first 2 weeks after repair due to Wallerian degeneration. Wallerian degeneration: degeneration of the axon and myelin distal to a nerve injury, occurring in the first 2 weeks. Peripheral nerve regenerates at 1 mm/day.\n\nParesthesias are felt at the site of percussion because axonal regrowth is faster than remyelination (Schwann cell proliferation), leaving the free axon end vulnerable to mechanical stimulation. Primary nerve repair is preferred within 2 weeks of a clean injury."
    difficulty: medium
    tags: [nerve injury, Tinel sign, Wallerian degeneration, nerve regeneration]
  - front: "When examining hand nerve function, what specific test assesses the anterior interosseous nerve (AIN) branch of the median nerve?"
    back: "Two tests: (1) Flexion of the DIPJ of the index finger. (2) 'OK sign' — touching the tip of the index finger to the thumb while the examiner tries to break through the circle.\n\nThe AIN is a purely motor branch of the median nerve supplying FDP (index/middle), FPL, and pronator quadratus. AIN palsy presents with inability to make the 'OK sign' — the index DIP and thumb IP cannot flex, resulting in a pinch deformity."
    difficulty: medium
    tags: [hand examination, median nerve, AIN, anterior interosseous nerve]
  - front: "What is Froment's sign and what nerve does it test?"
    back: "Froment's sign tests the ulnar nerve (specifically the adductor pollicis). The patient tries to hold a piece of paper between the adducted thumb and index finger while the examiner pulls it away. If the patient flexes the thumb IP joint (using FPL — median nerve) to compensate for weak adductor pollicis, this is a positive Froment's sign indicating ulnar nerve palsy.\n\nThe adductor pollicis is innervated by the ulnar nerve (deep branch). In ulnar palsy, this muscle is weak and the patient recruits FPL (median nerve) to compensate. Froment's sign isolates this compensatory mechanism."
    difficulty: medium
    tags: [hand examination, ulnar nerve, Froment sign, adductor pollicis]
  - front: "How is the Elson test performed and what does it assess?"
    back: "The Elson test assesses central slip integrity. Patient places their palm on a table edge with the affected digit PIP flexed 90°. Ask the patient to extend their PIP against resistance. Normal: active PIP extension with a floppy (relaxed) DIPJ. Abnormal (central slip injury): no active PIP extension, but DIP is extended/taut (lateral bands take over).\n\nCentral slip injury leads to boutonnière deformity if unrecognized. The Elson test detects early central slip disruption before deformity develops, allowing early splinting to prevent progression."
    difficulty: medium
    tags: [hand examination, Elson test, central slip, boutonniere]
  - front: "What is a Seymour fracture?"
    back: "A Seymour fracture is a displaced fracture of the distal phalangeal physis (growth plate) with associated nailbed injury and possible mallet finger deformity. Common in children, usually caused by a crush injury.\n\nSeymour fractures are often open fractures due to the associated nailbed injury, putting them at high risk of osteomyelitis. They require prompt irrigation, nailbed repair, and antibiotics. They may be misclassified as a simple mallet finger if the growth plate injury is not recognized."
    difficulty: medium
    tags: [hand fractures, Seymour fracture, pediatric, distal phalanx, growth plate]
  - front: "What is the management of a subungual hematoma?"
    back: "If >50% of the nail surface area: drain by trephination (puncturing the nail plate) under digital block anesthesia. If suspected greater severity (distal phalanx displaced fracture, nail bed laceration): remove nail plate under digital block to examine and repair the nailbed. Suture with absorbable suture (e.g., 6-0 Chromic Gut). Replace a stent between the eponychial fold and nailbed to prevent adhesions and altered nail growth.\n\nFailure to treat a subungual hematoma with significant nail bed injury can result in nail deformity. Stenting the eponychial fold open prevents synechiae (adhesions) that cause nail plate deformity."
    difficulty: easy
    tags: [nailbed injury, subungual hematoma, trephination, nailbed repair]
  - front: "What is Allen's test and how is it performed?"
    back: "Allen's test assesses collateral circulation of the hand. Exsanguinate the hand by having the patient open and close the fist. While the fist is firmly closed, occlude both radial and ulnar arteries simultaneously. Once the fist is open, release one artery and assess collateral flow (palmar blush). Repeat for the other artery. A normal test shows prompt palmar blush indicating adequate collateral flow through the released artery.\n\nAllen's test assesses whether either radial or ulnar artery alone can perfuse the hand. It is important before arterial line placement or radial artery harvest (e.g., for coronary bypass), and in evaluation of hand lacerations with suspected vascular injury."
    difficulty: easy
    tags: [hand examination, Allen test, vascular assessment, radial artery, ulnar artery]
  - front: "What is the rate of peripheral nerve regeneration, and what clinical sign tracks this regeneration?"
    back: "Peripheral nerves regenerate at approximately 1 mm/day. Tinel's sign (paresthesias on percussion over the nerve) tracks the advancing front of nerve regeneration.\n\nWallerian degeneration (axon/myelin degeneration distal to injury) occurs in the first 2 weeks before regeneration begins. Tinel's sign is absent during this period and appears once axonal regrowth begins. Remyelination by Schwann cells lags behind axonal regrowth."
    difficulty: easy
    tags: [nerve regeneration, peripheral nerve, Tinel sign, Wallerian degeneration]
  - front: "What is the sensory distribution tested for the median, ulnar, and radial nerves in a hand examination?"
    back: "Median nerve: volar radial tip of index finger. Ulnar nerve: volar ulnar tip of little finger. Radial nerve: dorsal webspace of the thumb.\n\nThese are the most reliable autonomous zones for each nerve. Testing these specific areas minimizes overlap from adjacent nerve territories, ensuring accurate localization of sensory deficits."
    difficulty: easy
    tags: [hand examination, sensory testing, median nerve, ulnar nerve, radial nerve]
  - front: "How do you test for FDS vs. FDP tendon integrity?"
    back: "FDP: Stabilize the PIPJ in extension and ask the patient to flex the digit (at DIPJ). Active DIPJ flexion indicates FDP integrity. FDS: Stabilize all non-examined fingers in extension (neutralizes FDP), then ask the patient to flex the examination finger (at PIPJ). Active PIPJ flexion indicates FDS integrity.\n\nFDP flexes both the DIP and PIP joints; FDS flexes only the PIP joint. By blocking FDP function (holding other fingers in extension), isolated FDS testing becomes possible. This distinction is critical in evaluating tendon lacerations."
    difficulty: easy
    tags: [hand examination, tendon testing, FDS, FDP]
  - front: "What are the deep space infections of the hand and how are they treated?"
    back: "Deep space infections include abscesses in Parona's space, web spaces, or thenar/midpalmar space. Parona's space: potential space in the distal forearm between pronator quadratus and FDP. Treatment: I&D in the OR (no Esmarch tourniquet — risk of spreading infection), followed by elevation, splinting, and IV antibiotics.\n\nEsmarch tourniquets are contraindicated in hand space infections as they can force bacteria into fascial planes and spread infection proximally. Adequate drainage of all involved spaces is essential."
    difficulty: medium
    tags: [hand infections, deep space, Parona space, I&D]
  - front: "What is the TINAX mnemonic for approach to hand lacerations?"
    back: "T — Tetanus prophylaxis. I — Irrigate with NS (copious irrigation and debridement in a timely manner). N — NPO if considering replant or urgent OR. A — Antibiotic prophylaxis (controversial — mainly needed for lacerations associated with fractures). X — X-rays.\n\nThis mnemonic organizes the initial assessment and management priorities for traumatic hand lacerations. Most hand lacerations do not require prophylactic antibiotics unless there is an associated open fracture or contaminated wound."
    difficulty: easy
    tags: [hand trauma, hand lacerations, TINAX, management approach]
  - front: "What is the most common soft tissue tumour of the hand and wrist?"
    back: "Ganglion cyst (60% of hand and wrist masses).\n\nGanglion cysts are benign synovial fluid-filled sacs, most commonly found on the dorsal wrist over the scapholunate ligament. They transilluminate and do not move with tendon. 3x more common in women; peak in 2nd and 4th decades."
    difficulty: easy
    tags: [hand, ganglion cyst, soft tissue tumour, wrist]
