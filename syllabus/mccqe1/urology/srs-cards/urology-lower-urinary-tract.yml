# Urology Lower Urinary Tract (Urology) - generated from srs-mccqe1
cards:
  - front: "What are the two phases of lower urinary tract function and their requirements?"
    back: "1. Storage phase: requires bladder accommodation/compliance, no involuntary contractions. 2. Voiding phase: requires coordinated detrusor contraction, synchronous sphincter relaxation, and no anatomic obstruction.\n\nLower urinary tract dysfunction is classified as failure to store (bladder or outlet problem) or failure to void (bladder or outlet problem). This framework guides diagnosis and management of incontinence, retention, and LUTS."
    difficulty: easy
    tags: [lower urinary tract, bladder physiology, incontinence, LUTS]
  - front: "What are the storage (irritative) LUTS symptoms? Use the mnemonic."
    back: "FUN: Frequency, Urgency (rush to toilet), Nocturia.\n\nStorage symptoms result from failure of the bladder to store urine normally. They may indicate overactive bladder, UTI, bladder tumour, or interstitial cystitis, among other conditions."
    difficulty: easy
    tags: [LUTS, storage symptoms, frequency, urgency, nocturia]
  - front: "What are the voiding (obstructive) LUTS symptoms? Use the mnemonic."
    back: "SHED: Stream changes/straining, Hesitancy, incomplete Emptying, post-void Dribbling.\n\nVoiding symptoms reflect bladder outlet obstruction (e.g., BPH, urethral stricture) or impaired detrusor contractility. The IPSS/AUA-SI questionnaire quantifies symptom severity."
    difficulty: easy
    tags: [LUTS, voiding symptoms, BPH, urethral stricture]
  - front: "What is acute urinary retention and how is it managed?"
    back: "Acute retention is a medical emergency: suprapubic pain, inability to void, palpable/percussible bladder. Management: immediate catheterization (urethral Foley), monitor fluid status and electrolytes (risk of post-obstructive diuresis), investigate and treat the underlying cause.\n\nUnlike chronic retention (which can be painless with greatly increased bladder volume), acute retention is painful. Chronic retention can cause detrusor hypertrophy followed by atony. Patients with elevated creatinine are at risk for post-obstructive diuresis after catheterization."
    difficulty: easy
    tags: [urinary retention, acute retention, catheterization, post-obstructive diuresis]
  - front: "What is urethral stricture, and what are its most common causes?"
    back: "Urethral stricture is a decrease in urethral caliber due to scar formation. Most common causes: iatrogenic (instrumentation, catheterization, TURP, radical prostatectomy, radiation), idiopathic, trauma (straddle injury, pelvic fracture), STI (gonorrhea, chlamydia), inflammation (BXO/lichen sclerosis).\n\nUrethral stricture causes obstructive voiding symptoms. It is more common in males (M>F). Flow rates <10 mL/s on uroflowmetry and RUG/VCUG demonstrate the location and length of the stricture."
    difficulty: easy
    tags: [urethral stricture, scar, iatrogenic, BXO, lichen sclerosis, urology]
  - front: "What are the treatment options for urethral stricture, from least to most invasive?"
    back: "1. Urethral dilation: temporary, high recurrence. 2. Visual internal urethrotomy (VIU): endoscopic incision, equal to dilation for mid-bulbar strictures <2 cm, 30–80% recurrence. 3. Open urethroplasty: stricture excision with anastomosis or graft (e.g., buccal mucosa), highest long-term success.\n\nVIU should be avoided in younger patients given high recurrence rates. Urethroplasty (open reconstruction) has significantly better long-term patency, especially for longer or recurrent strictures. Urethrostomy is an alternative in select patients."
    difficulty: medium
    tags: [urethral stricture, VIU, urethroplasty, dilation, surgery]
  - front: "What is the role of the sympathetic nervous system in bladder storage?"
    back: "During storage: sympathetic (T10–L2) via hypogastric nerve releases norepinephrine. Alpha-1 receptors cause internal urethral sphincter contraction. Beta-3 receptors cause detrusor relaxation. This keeps the bladder relaxed and outlet closed.\n\nThe storage phase requires sympathetic dominance: detrusor muscle relaxes (beta-3) while the internal sphincter contracts (alpha-1). This is why alpha-1 blockers reduce urethral resistance in BPH, and why beta-3 agonists (mirabegron) relax the detrusor in OAB."
    difficulty: medium
    tags: [bladder innervation, sympathetic, alpha-1 receptor, beta-3 receptor, storage phase]
  - front: "What is the role of the parasympathetic nervous system in bladder voiding?"
    back: "During voiding: parasympathetic (S2–S4) via pelvic nerve releases ACh → muscarinic receptors → detrusor contraction. Simultaneously, internal and external sphincters relax (sympathetic and somatic inhibition).\n\nThe voiding phase requires coordinated parasympathetic activation of the detrusor with simultaneous relaxation of both sphincters. Anticholinergic medications block muscarinic receptors to suppress detrusor overactivity in OAB and urgency incontinence."
    difficulty: medium
    tags: [bladder innervation, parasympathetic, voiding, muscarinic, detrusor]
  - front: "What is post-obstructive diuresis (POD) and in which patients is it a risk?"
    back: "POD is a large diuresis following relief of urinary obstruction. Risk is highest in patients with elevated creatinine (impaired renal function) at the time of catheterization.\n\nPOD results from osmotic diuresis (retained urea), impaired tubular reabsorption, and natriuretic factor accumulation. It can cause severe electrolyte abnormalities and volume depletion. Fluid status and electrolytes must be closely monitored after catheterization in these patients."
    difficulty: medium
    tags: [post-obstructive diuresis, urinary retention, electrolytes, renal failure, catheterization]
  - front: "What is balanitis xerotica obliterans (BXO) and how does it cause urethral stricture?"
    back: "BXO (lichen sclerosis/chronic progressive sclerosing dermatosis of male genitalia) causes meatal and urethral stenosis through chronic inflammatory scarring of the penile skin and urethra.\n\nBXO is the most common cause of meatal stenosis and distal urethral stricture in men. It presents as white, atrophic plaques on the glans and prepuce. Buccal mucosa graft urethroplasty is the preferred surgical treatment as BXO affects genital skin, precluding its use for grafting."
    difficulty: medium
    tags: [BXO, lichen sclerosis, urethral stricture, meatal stenosis, male genitalia]
