# Pediatrics Neurodevelopment (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "Define Global Developmental Delay (GDD) and its epidemiology."
    back: "GDD: significant delay (≥2 SDs below mean on standardized tests) in ≥2 developmental domains (gross motor, fine motor, speech/language, cognitive, social/personal, ADLs) in a child <5 years. Prevalence: up to 3% of pediatric population; 40–80% have a defined etiology.\n\nGDD may predict future intellectual disability. After age 5, the term 'intellectual disability' replaces GDD since catch-up is no longer expected. Identifying the etiology guides treatment and genetic counseling."
    difficulty: easy
    tags: [pediatrics, neurodevelopment, GDD, developmental delay]
  - front: "What are the first-line investigations recommended by the Canadian Paediatric Society (CPS) for a child with Global Developmental Delay?"
    back: "First line: chromosomal microarray AND Fragile X DNA testing. Plus formal vision and hearing tests. 'Tier 1' metabolic labs (blood): CBC, glucose, blood gas, urea, creatinine, electrolytes with anion gap, AST, ALT, TSH, CK, ammonia, lactate, amino acids, acylcarnitine profile, carnitine, homocysteine, copper, ceruloplasmin, biotinidase. Urine: organic acids, creatine metabolites, purines, pyrimidines, glycosaminoglycans.\n\nCPS guidelines recommend a stepwise approach guided by history and physical. Chromosomal microarray and Fragile X testing are the highest yield first-line genetic tests. Brain imaging is indicated for micro/macrocephaly, seizures, or abnormal neurological findings."
    difficulty: hard
    tags: [pediatrics, neurodevelopment, GDD, investigations, CPS guidelines]
  - front: "What are the three defining domains for Intellectual Disability (ID) diagnosis, and how is severity classified?"
    back: "Three domains: (1) deficits in intellectual function confirmed by clinical assessment and standardized testing (historically IQ <70), (2) deficits in adaptive functioning, (3) onset during the developmental period. Severity (mild, moderate, severe, profound) is based on adaptive function, NOT IQ.\n\nThe DSM-5 shifted ID severity classification from IQ to adaptive functioning, emphasizing functional impact over a single number. Adaptive function includes communication, self-care, social skills, work, leisure, health, and safety. Prevalence is 1–3%; M:F = 1.5:1."
    difficulty: medium
    tags: [pediatrics, neurodevelopment, intellectual disability, DSM-5]
  - front: "What are the risk factors for sensorineural hearing loss in infants?"
    back: "Genetic syndromes/family history, congenital (TORCH) infections, ototoxic medications, birth weight <1500 g, hyperbilirubinemia/kernicterus, asphyxia/low APGAR scores, bacterial meningitis, and viral encephalitis.\n\nEarly identification of hearing loss is critical because language development is most sensitive in the first 3 years of life. Universal newborn hearing screening programs are standard in Canada, with audiological follow-up for high-risk infants."
    difficulty: medium
    tags: [pediatrics, hearing loss, SNHL, risk factors, language delay]
  - front: "What is the epidemiology and key prognostic point for language delay in children?"
    back: "Prevalence: ~10–15% of 2-year-olds have language delay, but only 4–5% remain delayed after age 3. ~6–8% of school-aged children have specific language impairment. M>F. Best prognosis for developmental speech delay. If language delay persists beyond age 5, more likely to have difficulties in adulthood, including poor academic performance and social isolation.\n\nMost early language delays resolve spontaneously, but persistent delay requires intervention. Referral to speech-language pathology is the most important management step. Language delay beyond age 5 is a significant prognostic marker for lifelong difficulties."
    difficulty: medium
    tags: [pediatrics, language delay, speech, prognosis, epidemiology]
  - front: "A 2-year-old boy presents with language delay. What is the most important first management step?"
    back: "Referral to speech-language pathology (SLP) is the most important step. Also consider formal hearing assessment (audiology referral), as hearing impairment is a common treatable cause of language delay.\n\nManagement of language delay is etiology-specific. Hearing must always be assessed because even mild hearing loss significantly impacts language development. SLP provides formal evaluation and therapy. Dental assessment and optometry referral may also be warranted."
    difficulty: easy
    tags: [pediatrics, language delay, management, SLP, hearing]
  - front: "Define Specific Learning Disorder (SLD) and list its three main types."
    back: "SLD: specific and persistent failure to acquire academic skills despite conventional instruction, adequate intelligence, and sociocultural opportunity — a significant discrepancy between intellectual ability and academic performance. Types: (1) Reading (dyslexia), (2) Written expression, (3) Mathematics (dyscalculia). Prevalence: 10%; dyslexia most common.\n\nSLD is NOT caused by poor visual acuity. It is associated with psychiatric comorbidities (anxiety, dysthymia, conduct disorder, MDD, ODD, ADHD) and has a 40% school drop-out rate. Management includes individualized education plans (IEP) and curriculum accommodations."
    difficulty: easy
    tags: [pediatrics, learning disorder, dyslexia, SLD, ADHD]
  - front: "Poor visual acuity is a recognized cause of Specific Learning Disorder. True or False?"
    back: "FALSE. Poor visual acuity is explicitly NOT a cause of specific learning disorder.\n\nThis is a common misconception. SLD arises from neurological processing differences, not sensory deficits. Known associations include genetic/metabolic conditions (Turner, Klinefelter), prematurity, CNS damage, FAS, and psychosocial deprivation — not refractive errors."
    difficulty: easy
    tags: [pediatrics, learning disorder, SLD, etiology]
  - front: "What are the sentinel facial features of Fetal Alcohol Spectrum Disorder (FASD)?"
    back: "Three sentinel facial features: (1) short palpebral fissures (<2 SD below mean), (2) flattened philtrum, (3) thin upper lip. Having all three is highly specific for prenatal alcohol exposure.\n\nFASD ranges from most to least severe: FAS, partial FAS, ARBD (alcohol-related birth defects), and ARND (alcohol-related neurodevelopmental disorder). FASD is the most common preventable cause of intellectual disability. Prevalence of FAS: 0.1%; FASD: 1.0%."
    difficulty: medium
    tags: [pediatrics, FASD, FAS, dysmorphology, prenatal alcohol]
  - front: "What are the diagnostic criteria for FASD with sentinel facial features?"
    back: "FASD with sentinel facial features requires ALL THREE: (1) presence of all three sentinel facial features (short palpebral fissures, flattened philtrum, thin upper lip), (2) maternal alcohol consumption confirmed OR unknown, (3) evidence of neurodevelopmental impairment OR microcephaly in infants/young children.\n\nFASD without sentinel features requires confirmed maternal alcohol consumption plus evidence of neurodevelopmental impairment. Neurodevelopmental dysfunction requires ≥3 domains affected: motor skills, neuroanatomy/neurophysiology, cognition, language, academic achievement, memory, attention, executive function, affect regulation, adaptive behaviour/social skills, or microcephaly."
    difficulty: hard
    tags: [pediatrics, FASD, diagnosis, criteria]
  - front: "What factors improve prognosis in FASD?"
    back: "Prognosis is improved if: (1) diagnosed before age 6, (2) social and educational supports are available, (3) nurturing living environment. Secondary disabilities include unemployment, mental health problems, legal difficulties, inappropriate sexual behaviour, disrupted school experience, and peer problems.\n\nEarly diagnosis is essential to prevent secondary disabilities by connecting children to therapies and supports early. There is no cure. Growth and nutrition must be monitored as nutritional deficiencies are common."
    difficulty: medium
    tags: [pediatrics, FASD, prognosis, management]
  - front: "What are the DSM-5 diagnostic criteria domains for Autism Spectrum Disorder (ASD)?"
    back: "Domain 1 — Persistent deficits in social communication and interaction across three areas: (a) social-emotional reciprocity, (b) nonverbal communicative behaviours, (c) developing/maintaining/understanding relationships. Domain 2 — Restricted, repetitive patterns of behaviour/interests (≥2 of): stereotyped/repetitive movements, insistence on sameness, highly restricted fixated interests, hyper-/hypo-reactivity to sensory input. Symptoms must be present in early developmental period and cause clinically significant impairment.\n\nASD prevalence is 1 in 36 children (M:F = 4:1). Severity specifiers: requiring support, substantial support, or very substantial support. Must not be better explained by intellectual disability or GDD alone."
    difficulty: medium
    tags: [pediatrics, autism, ASD, DSM-5, neurodevelopment]
  - front: "What pharmacotherapy is used in ASD, and what does it treat?"
    back: "Pharmacotherapy does NOT treat ASD itself but addresses concomitant symptoms: atypical antipsychotics (for irritability, aggression, agitation, self-mutilation, tics), SSRIs (for anxiety and depression), stimulants (for associated inattention and hyperactivity). Comorbid ADHD, tics, OCD, anxiety, depression, and seizure disorder should be actively treated.\n\nThe mainstay of ASD treatment is team-based psychosocial intervention including behavioural therapy, social skills training, SLP, OT, and school programming. Pharmacotherapy is adjunctive. Prognosis is variable but improves with early intervention."
    difficulty: medium
    tags: [pediatrics, autism, ASD, pharmacotherapy, management]
  - front: "What are the DSM-5 diagnostic requirements for ADHD in children?"
    back: "Onset before age 12, persistent symptoms >6 months, symptoms in >2 settings (home, school, work), interference with academic/family/social functioning. Subtypes: combined type (≥6 inattention AND ≥6 hyperactivity-impulsivity), predominantly inattentive (≥6 inattention), predominantly hyperactive-impulsive (≥6 hyperactivity-impulsivity). For adolescents/adults >17 yr, only ≥5 symptoms required. Not explained by another psychiatric disorder.\n\nADHD prevalence is 5–12% in school-aged children (M:F = 4:1). Girls tend to present with inattentive symptoms and may be under-diagnosed. Heritability is ~75% with dopaminergic candidate genes (DAT1, DRD4). Neurobiological basis involves decreased catecholamine transmission and low PFC activity."
    difficulty: medium
    tags: [pediatrics, ADHD, DSM-5, diagnosis, neurodevelopment]
  - front: "What is the first-line pharmacotherapy for ADHD in school-aged children (≥6 years)?"
    back: "First line: stimulant medications — methylphenidate or amphetamines. Second line: atomoxetine and guanfacine XR. Third line: clonidine, bupropion, imipramine. For children <6 years: psychosocial intervention is FIRST LINE. For children ≥6 years: psychosocial intervention PLUS medication is first line.\n\nStimulant treatment of ADHD in children does NOT increase the risk of substance misuse later in life (contrary to common concern). 70–80% of ADHD symptoms continue into adolescence but hyperactive symptoms usually abate. 65% continue into adulthood."
    difficulty: medium
    tags: [pediatrics, ADHD, treatment, stimulants, methylphenidate]
  - front: "What is the difference between ADHD presentation in girls versus boys?"
    back: "Boys tend to present with hyperactive/impulsive symptoms (more visible/disruptive). Girls tend to present with predominantly inattentive symptoms, leading to under-diagnosis. Prevalence M:F = 4:1, though the true ratio may be closer due to under-recognition in girls.\n\nThe predominantly inattentive subtype is less disruptive to classroom function, leading to delayed identification in girls. This has important equity implications for diagnosis and treatment access. Clinicians should maintain a high index of suspicion for ADHD in girls with academic or social difficulties."
    difficulty: easy
    tags: [pediatrics, ADHD, sex differences, inattentive, epidemiology]
  - front: "A 3-year-old presents with regression in language skills. What diagnoses in the differential diagnosis should be considered?"
    back: "Regression in language/developmental skills raises concern for: Rett syndrome, epileptic encephalopathy (Landau-Kleffner syndrome — acquired epileptic aphasia), ASD, childhood disintegrative disorder, metabolic/degenerative neurological disorders (Leigh encephalopathy). Also consider: hearing impairment, abuse, seizure disorder.\n\nLanguage regression (loss of previously acquired skills) is a RED FLAG requiring urgent evaluation. Landau-Kleffner syndrome involves acquired epileptic aphasia and is distinct from other language disorders. ASD may present with regression, typically before age 3. EEG and neuroimaging are indicated in regression cases."
    difficulty: hard
    tags: [pediatrics, language delay, regression, Rett syndrome, Landau-Kleffner, ASD]
  - front: "What is the long-term prognosis of ADHD into adulthood?"
    back: "70–80% of children with ADHD continue to have symptoms into adolescence, but hyperactive symptoms usually abate. 65% continue into adulthood. Adults may develop secondary personality disorders and compensatory anxiety disorders. Stimulant treatment in childhood does NOT increase risk of substance use disorder later in life.\n\nThe persistence of ADHD into adulthood is well-documented. While hyperactivity diminishes, inattention and executive dysfunction often remain. Comorbidities in adulthood include adult ASPD (if childhood CD/ODD was present), depression, and anxiety."
    difficulty: medium
    tags: [pediatrics, ADHD, prognosis, adulthood, persistence]
  - front: "What are the etiology categories for Global Developmental Delay and their approximate diagnostic yields?"
    back: "Prenatal biological (genetic abnormalities, CNS deformities, metabolic): up to 7% of total GDD cases. Prenatal environmental (teratogens, infections): ~11%. Perinatal (asphyxia/neonatal encephalopathy, prematurity, low birth weight): up to 55%. Postnatal (neglect, infections, trauma, kernicterus, toxins): ~12%.\n\nPerinatal factors account for the largest proportion of GDD cases with an identified etiology. However, 20–60% of GDD cases have no identifiable cause. The CPS stepwise diagnostic algorithm guides investigations based on history and physical examination findings."
    difficulty: hard
    tags: [pediatrics, GDD, etiology, developmental delay, CPS]
