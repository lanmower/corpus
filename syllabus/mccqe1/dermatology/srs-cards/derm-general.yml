    back: "20-30% of patients with psoriasis also suffer from psoriatic arthritis. Patients with nail or scalp involvement are at higher risk.\n\nPsoriatic arthritis is a seronegative spondyloarthropathy that occurs in a significant proportion of psoriasis patients, particularly those with more severe skin disease."
    difficulty: easy
    tags: [psoriatic-arthritis, psoriasis, epidemiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "Describe the classic clinical presentation of scabies including primary and secondary lesions and common sites."
    back: "Primary lesions: superficial linear burrows with inflammatory papules/nodules in axilla and groin. Secondary lesions: small urticarial crusted papules, eczematous plaques, excoriations. Common sites: axillae, groin, buttocks, hands/feet (especially web spaces). Head and neck are typically spared (except in infants). Intense nocturnal pruritus is characteristic.\n\nThe combination of burrows, pruritus pattern, and distribution pattern helps differentiate scabies from other pruritic dermatoses."
    difficulty: medium
    tags: [scabies, clinical-presentation, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "Describe the clinical features of herpes zoster (shingles)."
    back: "Unilateral dermatomal eruption occurring 3-5 days after pain and paresthesia of that dermatome. Vesicles, bullae, and pustules on an erythematous, edematous base. Lesions may become eroded/ulcerated and last days to weeks. Pain can be pre-herpetic, synchronous with rash, or post-herpetic.\n\nThe dermatomal distribution and prodromal pain are characteristic features that help distinguish herpes zoster from other vesicular eruptions."
    difficulty: easy
    tags: [herpes-zoster, shingles, dermatology, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the most common cutaneous drug reaction?"
    back: "Exanthematous drug reaction (maculopapular rash)\n\nExanthematous eruptions account for the majority of cutaneous drug reactions and are increased with concurrent infections"
    difficulty: easy
    tags: [dermatology, drug-eruption, epidemiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the treatment for acne scars?"
    back: "Topical retinoids, glycolic acid peels for superficial scars; injectable fillers (collagen, hyaluronic acid), laser for pitted scars\n\nTreatment depends on scar type. Superficial scars respond to chemical peels while pitted scars may require fillers or laser therapy."
    difficulty: easy
    tags: [dermatology, acne, treatment, scars, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the four severity types of acne vulgaris?"
    back: "Type I: comedonal, sparse, no scarring; Type II: comedonal, papular, moderate + little scarring; Type III: comedonal, papular, pustular, with scarring; Type IV: nodulocystic acne, risk of severe scarring\n\nAcne is categorized by lesion type and severity, with Type IV carrying the highest risk of permanent scarring requiring aggressive treatment."
    difficulty: easy
