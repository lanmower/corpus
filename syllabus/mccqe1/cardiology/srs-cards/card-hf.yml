  - front: "What did the SPRINT trial conclude about intensive blood pressure control?"
    back: "Intensive treatment (target systolic BP <120 mmHg) in high-risk patients significantly reduced cardiovascular events compared to standard treatment (target <140 mmHg)\n\nSPRINT showed that intensive BP control to systolic <120 mmHg reduced MI, acute coronary syndromes, stroke, heart failure, and death in high-risk patients."
    difficulty: medium
    tags: [hypertension, clinical trial, SPRINT, cardiovascular, toronto-notes, pages-0431-0432-0433-0434-0435-0436-0437-0438-0439-0440]
  - front: "What did the IRONMAN trial conclude about IV ferric derisomaltose in heart failure?"
    back: "IV ferric derisomaltose in heart failure patients with reduced ejection fraction and iron deficiency reduced recurrent hospital admissions for HF and CV death (22.4 vs 27.5 per 100 patient-years)\n\nIRONMAN demonstrated that IV iron supplementation (ferric derisomaltose) benefits HF patients with iron deficiency, reducing CV events."
