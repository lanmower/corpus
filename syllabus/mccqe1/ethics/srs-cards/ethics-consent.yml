# Informed Consent & Capacity (Ethics) - generated from srs-mccqe1
cards:
  - front: "A 78-year-old with early dementia wants to refuse amputation for a gangrenous foot. How do you assess capacity for this decision?"
    back: "Capacity assessment: patient must demonstrate UNDERSTANDING the information, APPRECIATION of how it applies to their situation, REASONING through the options, and COMMUNICATION of a choice (4 criteria — Aid MacIAT/ACE tests)\n\nCapacity is decision-specific and may fluctuate. CMPA guidelines: capacity must be assessed for each decision. Presume capacity unless evidence suggests otherwise. Cognitive tests (MMSE, MoCA) do not replace formal capacity assessment. If lacking capacity: substitute decision-maker uses prior wishes or best interests."
    difficulty: hard
    tags: [capacity assessment, informed consent, decision-making capacity, dementia, ethics]
  - front: "What are the elements of informed consent?"
    back: "Patient must be: competent (has capacity), informed (understands diagnosis, proposed treatment, alternatives, risks, benefits, consequences of refusing), and voluntary (no coercion) — documented in medical record\n\nCMPA guidelines: informed consent is a process, not just a signature. Tarasoff standard: disclose material risks (those a reasonable person would want to know, plus specific risks this patient would want to know). Risk should be disclosed in terms of probability AND severity."
    difficulty: medium
    tags: [informed consent, capacity, voluntariness, CMPA, ethics]
  - front: "Who acts as substitute decision-maker (SDM) when a patient lacks capacity in Ontario?"
    back: "SDM hierarchy in Ontario (Health Care Consent Act): 1) Appointed attorney for personal care (POA), 2) Spouse/partner, 3) Parent/child (18+), 4) Sibling, 5) Any other relative, 6) Public Guardian and Trustee\n\nSDM hierarchy varies by province. SDM must use incapable person's prior expressed wishes and values (if known), or in their best interests if wishes unknown. SDM cannot authorize medical assistance in dying (MAID). Consent and Capacity Board (CCB) in Ontario adjudicates disputes."
    difficulty: medium
    tags: [substitute decision-maker, SDM, Ontario, capacity, ethics]
  - front: "What is the difference between capacity and competence?"
    back: "Capacity: clinical assessment by a healthcare provider of the patient's ability to make a specific healthcare decision; Competence: legal determination by a court that a person is or is not capable of managing their affairs\n\nIn practice, \"capacity\" is used in clinical settings for healthcare decisions. \"Competence\" is the legal term for broader decision-making ability (finances, legal decisions). Physicians assess capacity; courts determine competence. All adults are presumed capable unless assessed otherwise."
    difficulty: easy
    tags: [capacity vs competence, legal capacity, clinical assessment, ethics]
  - front: "A competent patient refuses a blood transfusion as a Jehovah's Witness. What is the physician's obligation?"
    back: "Respect the patient's autonomy and informed refusal — do not administer blood products; document the refusal; offer alternative treatments (cell salvage, erythropoietin, volume expanders); explore patient's values and wishes in advance\n\nCMPA guidelines: a competent adult has the right to refuse ANY medical treatment, even life-saving treatment. Physician must ensure the refusal is informed (patient understands consequences). Document thoroughly. Ethics consultation helpful. Court applications for children of Jehovah's Witnesses are different."
    difficulty: hard
    tags: [Jehovahs Witness, refusal of treatment, autonomy, informed refusal, ethics]
  - front: "What is an advance directive and what types exist in Canada?"
    back: "Advance directive: written instructions for future healthcare when patient lacks capacity; Types: (1) Living will (instructional — specific wishes), (2) Power of Attorney for Personal Care (POAPC — designates a substitute decision-maker)\n\nProvincial legislation governs advance directives. Living wills are instructional and tell SDMs what the patient would want. POAPC is the most practical form. Healthcare teams must honor valid advance directives. All patients should be encouraged to complete advance directives while capable."
    difficulty: easy
    tags: [advance directive, living will, POA, advance care planning, ethics]
  - front: "How should informed consent be obtained for a research study involving patients?"
    back: "Research ethics board (REB) approval required; written informed consent with full disclosure of: purpose, methods, risks and benefits, confidentiality, voluntary participation, right to withdraw without consequences; research consent is separate from clinical consent\n\nTCPS2 (Tri-Council Policy Statement) governs research involving humans in Canada. Vulnerable populations (cognitively impaired, prisoners, children) require additional protections. Waiver of consent allowed if research involves minimal risk and consent is impractical."
    difficulty: medium
    tags: [research consent, REB, TCPS2, research ethics, ethics]
  - front: "A 15-year-old presents alone requesting contraception. Can consent be obtained without parental involvement?"
    back: "Yes — mature minor doctrine: adolescents who can demonstrate capacity can consent to healthcare independently; most provinces recognize the mature minor doctrine for healthcare decisions\n\nProvincial legislation varies. In most Canadian provinces, adolescents can consent to their own healthcare (including contraception, STI testing/treatment, mental health) if they demonstrate capacity. Physician assesses capacity — explain information about contraception, confirm understanding, check for coercion."
    difficulty: medium
    tags: [mature minor, adolescent consent, capacity, contraception, ethics]
  - front: "What is therapeutic privilege and is it ethically defensible?"
    back: "Therapeutic privilege: withholding information from patients to prevent psychological harm — NOT generally accepted in Canada; physicians cannot withhold information they believe the patient would want\n\nCMPA guidelines strongly discourage therapeutic privilege. Exceptions: when disclosure would cause direct, immediate harm (rare). Physicians may choose timing and framing of difficult information, but cannot withhold material information. Cultural differences in information preferences should be explored and respected."
    difficulty: medium
    tags: [therapeutic privilege, informed consent, information disclosure, CMPA, ethics]
  - front: "What is the process for obtaining consent for an incapable person from their SDM?"
    back: "SDM must use: (1) prior capable wishes if known (including advance directives); (2) if no prior wishes: known values and beliefs of the incapable person; (3) if unknown: best interests (considering well-being, consistent values, and avoid unnecessary suffering)\n\nOntario Health Care Consent Act: SDM is bound by these principles in hierarchical order. Best interests is the last resort. SDM cannot impose their own values on the incapable person. Consent and Capacity Board can review SDM decisions that appear contrary to the patient's best interests."
    difficulty: hard
    tags: [SDM, substitute decision-maker, best interests, advance care planning, ethics]
  - front: "A patient with schizophrenia is refusing hospitalization. He has paranoid delusions that are causing him to not eat. What are the options?"
    back: "If patient lacks capacity: seek consent from SDM or apply for Community Treatment Order (CTO) or involuntary admission under provincial Mental Health Act; if capacity retained: respect refusal, maximize community support\n\nMental health capacity is assessed using the same criteria. Psychotic patients may retain capacity for healthcare decisions even with active psychosis if they can understand and appreciate. Involuntary hospitalization requires: mental disorder + serious bodily harm to self or others + hospitalization needed. Form 1 in Ontario."
    difficulty: hard
    tags: [mental capacity, psychosis, involuntary admission, Mental Health Act, ethics]
  - front: "What is a do-not-resuscitate (DNR) order and how should it be established?"
    back: "DNR order: documents patient's wish to not receive CPR in the event of cardiac/respiratory arrest — should be discussed proactively with all patients with serious illness; NOT a general \"do not treat\" order\n\nCMPA guidelines: DNR orders require informed consent discussion (goals of care conversation), documented in chart, and regularly reviewed. DNR order does not mean \"comfort care only\" — all other treatments continue unless separately addressed. POLST/MOST forms document broader goals of care."
    difficulty: hard
    tags: [DNR, do not resuscitate, goals of care, POLST, MOST, ethics]
  - front: "What are the rights of patients who are involuntarily admitted under a Mental Health Act?"
    back: "Rights: (1) right to be told reasons for admission, (2) right to retain legal counsel, (3) right to have admission reviewed (mental health tribunal/board), (4) right to refuse treatment even when involuntary (capacity still governs treatment consent), (5) right to have substitute decision-maker for treatment decisions\n\nBeing involuntarily hospitalized does NOT remove a patient's right to refuse treatment. Separate capacity assessment and SDM involvement required for treatment decisions. Rights adviser visits involuntary patients in Ontario to explain rights. Review board/tribunal can discharge if admission criteria not met."
    difficulty: hard
    tags: [involuntary admission, patient rights, Mental Health Act, capacity, ethics]
  - front: "What is the Capable Consent to Treatment and how does it differ from MAID consent?"
    back: "Regular treatment consent: capable patient, informed of options, voluntary decision; MAID consent: additional safeguards — two assessments by independent practitioners, 10-day reflection period (waivable for imminent loss of capacity), written request, witness requirements\n\nMAID (Medical Assistance in Dying): Bill C-7 expanded eligibility beyond end of life. Additional protections: final consent can be waived in advance for loss of capacity if suffering from serious neurocognitive illness. Bill C-7 consultation period for mental illness as sole condition."
    difficulty: hard
    tags: [MAID consent, medical assistance in dying, consent safeguards, Bill C-7, ethics]
  - front: "What is the duty of a physician when a capable patient consents to a procedure but then becomes uncapable during the procedure?"
    back: "If patient gave prior capable consent and becomes incapable during the procedure (e.g., anesthesia), physician can continue the procedure the patient consented to — do NOT need to stop and get SDM consent\n\nThis applies to the specific procedure consented to. Any expansion of the procedure beyond what was consented to requires SDM consent unless it is an emergency. If the patient had an advance directive addressing this situation, it applies. CMPA guidance on intraoperative consent issues."
    difficulty: medium
    tags: [intraoperative consent, treatment continuation, capacity, anesthesia, ethics]
  - front: "A 67-year-old man with moderate Alzheimer's disease presents to sign consent for an elective hip replacement. He can state the nature of the procedure but cannot explain what would happen if he declined surgery. He is accompanied by his adult son who holds a Continuing Power of Attorney for Property (but not Personal Care). What is the most appropriate next step?\n\nA) Proceed with consent from the son, as he holds POA\nB) Assess the patient's capacity formally and, if incapacitated, identify a substitute decision-maker following provincial hierarchy\nC) Accept the patient's stated wish to proceed as his expressed preference\nD) Delay surgery until a court-appointed guardian is obtained\nE) Contact the provincial capacity board immediately"
    back: "B) Assess the patient's capacity formally and, if incapacitated, identify a substitute decision-maker following provincial hierarchy\n\nPOA for Property does NOT authorize healthcare decisions. POA for Personal Care (or its equivalent) is required. The son cannot consent here. The physician must formally assess capacity using the ability to understand information AND appreciate consequences. If the patient lacks capacity, the provincial SDM hierarchy applies (spouse/partner → child → parent → sibling…). A court order is only needed if no SDM is available or there is disagreement."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "During consent for a laparoscopic cholecystectomy, a surgeon informs a patient of a 0.3% risk of common bile duct injury. The patient undergoes the procedure and suffers a bile duct injury. She later sues, claiming she was not warned. In Canadian law (following Reibl v. Hughes and the modified objective test), which statement is MOST accurate?\n\nA) The surgeon is not liable because disclosure of 0.3% risk meets the reasonable physician standard\nB) Liability depends on whether a reasonable person in the patient's circumstances would have declined surgery had they known of the risk\nC) The surgeon is liable only if the injury resulted from negligence in technique\nD) Disclosure of any risk below 1% is not legally required\nE) The patient must prove the surgeon acted below the standard of care in performing the procedure"
    back: "B) Liability depends on whether a reasonable person in the patient's circumstances would have declined surgery had they known of the risk\n\nCanadian law (Reibl v. Hughes, 1980) uses a MODIFIED OBJECTIVE test: would a reasonable person in the patient's specific circumstances have refused surgery if properly warned? This departs from both the purely subjective test (what would THIS patient have done) and purely objective test (what would ANY patient do). Technical negligence is a separate inquiry. Threshold percentages do not determine disclosure — materiality to the patient does."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "A 15-year-old presents alone requesting oral contraceptives. She demonstrates full understanding of the risks, benefits, and alternatives, and her reasons are consistent and not influenced by a third party. Her parents are unaware of her request. Under the mature minor doctrine in most Canadian provinces, what is the correct approach?\n\nA) Refuse treatment and require parental consent as she is under 16\nB) Prescribe and maintain confidentiality, as she meets criteria for mature minor status\nC) Prescribe but notify parents within 24 hours as per mandatory reporting\nD) Refer to psychiatry to assess maturity before prescribing\nE) Prescribe only with written consent from one parent"
    back: "B) Prescribe and maintain confidentiality, as she meets criteria for mature minor status\n\nThe mature minor doctrine (recognized across Canadian common law provinces) allows a minor with decision-making capacity to consent to treatment without parental involvement. Capacity criteria: understands the nature of the treatment and its consequences. There is no minimum age threshold — it is a functional test. Disclosing to parents without her consent would violate confidentiality unless there is a specific mandatory reporting obligation (which does not apply here)."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "During an emergency appendectomy under general anesthesia, the surgeon incidentally discovers a 4 cm ovarian cyst. The patient has previously expressed no preference about this scenario. Which action is MOST ethically and legally appropriate?\n\nA) Remove the cyst since it is clinically significant and the patient is already under anesthesia\nB) Remove the cyst only if it appears malignant on gross inspection\nC) Leave the cyst, close the abdomen, and discuss findings with the patient postoperatively\nD) Consult gynecology intraoperatively for a decision\nE) Proceed with removal given the principle of implied consent for emergencies"
    back: "C) Leave the cyst, close the abdomen, and discuss findings with the patient postoperatively\n\nThe 'extension doctrine' allows intraoperative extension of a procedure ONLY when: (1) it is immediately life-threatening, AND (2) delaying would cause serious harm. An asymptomatic ovarian cyst does not meet this threshold. Implied consent covers the emergency that brought the patient to the OR (appendectomy), not elective additional procedures. The correct approach is to close and discuss. Delaying a cyst management decision does not cause immediate harm."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "A 78-year-old with early vascular dementia refuses a blood transfusion for a GI bleed. His Hgb is 58. He states: 'I don't want a blood transfusion because I am a Jehovah's Witness and it goes against my faith.' He cannot name the hospital or the date, but consistently articulates his religious objection and the consequence (he may die). The treating physician assesses him. What is the most legally sound conclusion?\n\nA) He lacks capacity because he cannot name the hospital or date, suggesting global cognitive impairment\nB) He has capacity for THIS specific decision despite cognitive deficits, as he understands and appreciates its consequences in the context of his values\nC) He lacks capacity because refusal in this context is irrational\nD) His SDM should be consulted because dementia always negates capacity\nE) A capacity board must be convened before any treatment decisions can be made"
    back: "B) He has capacity for THIS specific decision despite cognitive deficits, as he understands and appreciates its consequences in the context of his values\n\nCapacity is DECISION-SPECIFIC, not global. Inability to recall the date or orientation details does not automatically negate capacity for a specific healthcare decision. The test is: can he understand the relevant information AND appreciate how it applies to his situation? He clearly does — he understands he may die and links that to his religious values. This is a classic MCCQE1 trap: dementia ≠ incapacity. Courts have repeatedly upheld such refusals (Malette v. Shulman analogy). Treat capacity as a sliding scale — higher stakes require more rigorous assessment."
    difficulty: hard
    tags: [Capacity Assessment, MCQ, Toronto Notes]
  - front: "A surgeon plans to operate on a patient's LEFT knee. In the operating room, the patient is draped and anesthetized. The circulating nurse notices the consent form says 'right knee.' The surgeon states he reviewed imaging and is certain the left knee is the correct site. What is the most appropriate action?\n\nA) Proceed with left knee surgery as the surgeon's clinical judgment supersedes an administrative error\nB) Wake the patient and clarify the correct site before proceeding\nC) Proceed and have the patient re-sign corrected consent in the recovery room\nD) Continue if two team members verbally confirm the correct site\nE) Proceed based on the imaging report which overrides the written consent"
    back: "B) Wake the patient and clarify the correct site before proceeding\n\nWrong-site surgery is a never event and a serious patient safety issue. Regardless of clinical certainty, surgery must STOP and the patient must be woken to confirm. The consent form is a legal document — discrepancies cannot be resolved intraoperatively by team consensus. This aligns with the WHO Surgical Safety Checklist and provincial patient safety frameworks. 'Surgeon's certainty' does not substitute for confirmed written consent."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "A 55-year-old woman is intubated and sedated in the ICU following a massive stroke. Her husband (her SDM) refuses a recommended PEG tube, stating she 'would have wanted everything done.' The ICU team believes PEG insertion aligns with her current medical interests. Her husband, however, has no documentation of her wishes. Under the substituted judgment standard, what is the correct framework for the SDM's decision?\n\nA) The SDM must consent to any treatment the medical team considers beneficial\nB) The SDM must make the decision the incapacitated person would have made based on prior expressed values, wishes, and beliefs\nC) The SDM's personal beliefs take precedence when there is no advance directive\nD) The SDM should choose the option least likely to result in death\nE) A second SDM should be appointed given the conflict"
    back: "B) The SDM must make the decision the incapacitated person would have made based on prior expressed values, wishes, and beliefs\n\nThe gold standard for SDM decision-making in Canada is SUBSTITUTED JUDGMENT: what would the patient have decided? This is NOT about what the SDM wants or what is medically 'best.' The SDM must act on prior expressed wishes (verbal or written), known values, and cultural/religious beliefs. If no prior wishes are known, the SDM defaults to 'best interests.' The husband's statement 'would have wanted everything done' is a substituted judgment claim and must be evaluated against known evidence of her wishes. Conflict resolution resources (ethics consult, capacity board) are appropriate if needed."
    difficulty: hard
    tags: [Substitute Decision Making, MCQ, Toronto Notes]
  - front: "A physician obtains verbal consent for a lumbar puncture, performs the procedure without incident, but forgets to document the consent discussion in the chart. The patient later develops post-LP headache and claims consent was never obtained. In a medicolegal context, what is the most accurate statement?\n\nA) Without written documentation, consent cannot be legally proven, and the physician is liable\nB) Documentation of consent is important evidence, but verbal consent can still be valid if independently corroborated\nC) Verbal consent is always sufficient for minor invasive procedures and documentation is optional\nD) Undocumented consent constitutes battery regardless of whether the patient was actually informed\nE) The burden of proof shifts entirely to the physician to prove consent occurred"
    back: "B) Documentation of consent is important evidence, but verbal consent can still be valid if independently corroborated\n\nConsent itself is a PROCESS, not a piece of paper. Written documentation is not legally required for consent to be valid — but it is critical evidence. Verbal consent CAN be valid and enforceable if supported by contemporaneous notes, witnesses, or clinical records. However, the CMPA strongly recommends documentation. Lack of written consent does not automatically constitute battery (which requires absence of consent, not absence of documentation). The burden of proof in civil litigation typically rests with the plaintiff (patient)."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "During a psychiatric assessment, a physician uses the MacCAT-T to evaluate a patient's decision-making capacity. The patient scores well on 'Understanding' and 'Reasoning' but poorly on 'Appreciation.' Which conclusion is MOST clinically accurate?\n\nA) The patient has full capacity because understanding and reasoning are the most critical domains\nB) The patient likely lacks capacity; inability to appreciate how information applies to their own situation is a fundamental incapacity criterion\nC) The MacCAT-T is not validated for psychiatric patients and cannot guide capacity determination\nD) Poor appreciation alone is insufficient to declare incapacity\nE) The patient should be reassessed in 48 hours as appreciation scores fluctuate"
    back: "B) The patient likely lacks capacity; inability to appreciate how information applies to their own situation is a fundamental incapacity criterion\n\nThe MacCAT-T assesses four domains: Understanding, Appreciation, Reasoning, and Expressing a Choice. APPRECIATION is arguably the most clinically significant — it tests whether the patient can acknowledge how the information applies to THEIR OWN situation. A patient with a delusion that they don't actually have cancer may 'understand' that cancer is serious but fail appreciation. Poor appreciation strongly suggests lack of capacity and is a key differentiator in psychiatric populations. A formal capacity determination still requires clinical judgment beyond the score."
    difficulty: hard
    tags: [Capacity Assessment, MCQ, Toronto Notes]
  - front: "A family physician who has been treating a patient for 10 years is approached by the now-discharged (2 years ago) patient for a romantic relationship. The patient is clearly the initiator and the physician has done nothing to encourage the relationship. Under CPSO guidelines, which statement is MOST accurate?\n\nA) Sexual relationships with former patients are permitted after a 2-year gap if the patient initiates\nB) Sexual or romantic relationships with former patients are prohibited indefinitely if the physician-patient relationship was of a significant nature, as the power imbalance may persist indefinitely\nC) A 1-year waiting period applies after formal discharge from care\nD) The prohibition applies only during active physician-patient relationships\nE) Consent from the former patient removes all ethical barriers"
    back: "B) Sexual or romantic relationships with former patients are prohibited indefinitely if the physician-patient relationship was of a significant nature, as the power imbalance may persist indefinitely\n\nCPSO and CMA guidelines prohibit sexual relationships with former patients when the physician-patient relationship was of a significant, ongoing, or trust-based nature (e.g., 10 years of family medicine). The prohibition may be INDEFINITE, not time-limited, because the power imbalance, transference, and trust established in long-term care can persist beyond formal discharge. Patient initiation does NOT eliminate the ethical responsibility — the professional is held to a higher standard. Short encounters (e.g., a single ER visit years ago) may be treated differently, but this case clearly warrants prohibition."
    difficulty: hard
    tags: [Professional Boundaries, MCQ, Toronto Notes]
  - front: "A physician witnesses a colleague who appears intoxicated while preparing to perform an elective procedure. The colleague waves off concerns and proceeds to the OR. What is the MOST appropriate immediate action?\n\nA) Document the observation and report to the department head after the procedure is complete\nB) Physically prevent the colleague from entering the OR and immediately inform the department chief/most responsible physician and/or hospital administration\nC) Inform the patient and allow the patient to decide whether to proceed\nD) Contact the CPSO immediately before any other action\nE) Follow the colleague into the OR to monitor the situation"
    back: "B) Physically prevent the colleague from entering the OR and immediately inform the department chief/most responsible physician and/or hospital administration\n\nThis is an IMMEDIATE patient safety emergency. The physician has a duty to prevent imminent harm. The steps are: (1) IMMEDIATELY inform a superior (department chief, chief of staff, or on-call administrator) who can intervene, (2) the colleague must be removed from the OR before the procedure begins, (3) arrange alternative surgical coverage. Waiting until after the procedure, 'monitoring' the situation from inside the OR, or contacting the CPSO first (which is for longer-term reporting) are all incorrect. Patient safety takes absolute precedence over collegial loyalty."
    difficulty: hard
    tags: [Professional Misconduct, MCQ, Toronto Notes]
  - front: "A surgeon operating in a private clinic refers patients to a diagnostic imaging clinic in which she holds a 15% ownership stake. She does not disclose this financial relationship to her patients. This scenario MOST directly violates which ethical/legal principle?\n\nA) Beneficence — the referrals may not be in patients' best interests\nB) Conflict of interest and the duty to disclose material information that may affect patient decision-making and physician objectivity\nC) Fiduciary duty only if a patient suffers actual financial harm\nD) Non-maleficence — the referrals expose patients to unnecessary radiation\nE) Justice — the referrals are unfair to competing imaging centres"
    back: "B) Conflict of interest and the duty to disclose material information that may affect patient decision-making and physician objectivity\n\nA physician owning interest in a facility to which they refer patients creates a CONFLICT OF INTEREST — the physician's financial interests may influence clinical decisions. Physicians have a duty to: (1) disclose the relationship to patients, (2) provide alternatives, and (3) ensure the referral is clinically justified. Most provincial medical practice acts and CMA guidelines require disclosure of such relationships. Non-disclosure constitutes a breach of the fiduciary duty (which is underpinned by conflict of interest principles) and may constitute professional misconduct. Self-referral rules vary by province."
    difficulty: hard
    tags: [Professional Misconduct, MCQ, Toronto Notes]
  - front: "A physician begins treating a mutual friend who was referred to them by a colleague. Over several months, the physician finds the relationship becoming personally intimate due to the prior friendship. No sexual contact has occurred, but the physician finds themselves routinely sharing personal information about other patients, giving the friend preferential scheduling, and disclosing personal information during appointments. This situation MOST reflects:\n\nA) Normal behaviour in small communities where dual relationships are unavoidable\nB) Boundary erosion — the blurring of professional and personal roles that constitutes a precursor to more serious boundary violations\nC) Only a problem if the patient reports feeling uncomfortable\nD) Only a reportable concern if it progresses to sexual contact\nE) A CMPA matter rather than a CPSO concern"
    back: "B) Boundary erosion — the blurring of professional and personal roles that constitutes a precursor to more serious boundary violations\n\nThis is a classic BOUNDARY EROSION scenario — the progressive blurring of professional limits that precedes more serious violations. Warning signs include: preferential scheduling, sharing personal information about other patients (confidentiality breach), and excessive self-disclosure. These represent a failure of professional role maintenance. The correct action for the physician is to recognize the erosion, seek peer or professional consultation, and consider transferring care to avoid harm. Boundary violations do not require sexual contact to be serious or reportable."
    difficulty: hard
    tags: [Professional Misconduct, MCQ, Toronto Notes]
  - front: "A physician receives a free flight and hotel accommodation worth $3,000 from a pharmaceutical company to attend a medical conference where the company's new diabetes drug is prominently featured. The CME sessions are peer-reviewed and accredited. Which statement is MOST accurate?\n\nA) This is acceptable as the CME content is peer-reviewed\nB) Accepting industry-funded travel and accommodation creates a conflict of interest regardless of content quality, and contravenes CMA and provincial guidelines\nC) This is acceptable if the physician discloses the sponsorship to patients who are subsequently prescribed the drug\nD) Travel below $5,000 is exempt from conflict of interest regulations\nE) This is only problematic if the physician was directly involved in promotional activities"
    back: "B) Accepting industry-funded travel and accommodation creates a conflict of interest regardless of content quality, and contravenes CMA and provincial guidelines\n\nCMA guidelines and most provincial college policies prohibit physicians from accepting industry gifts, including funded travel, that could be seen as influencing prescribing. The 'no quid pro quo' defense is insufficient — the concern is PERCEIVED or UNCONSCIOUS influence. Multiple studies show pharma-sponsored meals and travel measurably shift prescribing patterns. Accredited content does not cleanse the conflict. Physicians must pay their own way to industry events. If they accept corporate sponsorship, they must declare it and recuse themselves from related prescribing decisions."
    difficulty: hard
    tags: [Professional Misconduct, MCQ, Toronto Notes]
  - front: "A researcher wants to conduct a retrospective chart review of 5,000 patients to study outcomes of a new antibiotic. Individual patient consent would be impractical and would introduce selection bias. The data is identifiable. Under the Tri-Council Policy Statement (TCPS2), can the REB waive consent?\n\nA) No — identifiable data always requires individual consent regardless of practicality\nB) Yes — the REB may waive consent if: the research cannot be practicably conducted without the waiver, it involves no more than minimal risk, waiving will not adversely affect participants' welfare, and participants would not object if asked\nC) Yes — retrospective studies are categorically exempt from consent requirements\nD) No — only anonymized data can be used without consent\nE) Yes, but only if a patient representative group approves the waiver"
    back: "B) Yes — the REB may waive consent if: the research cannot be practicably conducted without the waiver, it involves no more than minimal risk, waiving will not adversely affect participants' welfare, and participants would not object if asked\n\nTCPS2 Article 3.7A permits REB waiver of consent for research involving identifiable information when: (1) the research cannot practically be conducted with consent, (2) the research involves no more than minimal risk, (3) privacy is protected to the extent possible, (4) waiving consent will not adversely affect welfare, and (5) it is impractical to contact participants (e.g., they are deceased, records are too old). All conditions must be met. This is a frequently tested TCPS2 provision."
    difficulty: hard
    tags: [Research Ethics, MCQ, Toronto Notes]
  - front: "A Phase II RCT of a new cancer drug is ongoing. An interim analysis reveals the experimental arm has a statistically significant and clinically meaningful survival benefit over placebo. The trial is designed to run for 2 more years. What ethical principle requires consideration of early termination?\n\nA) Equipoise — if evidence no longer supports uncertainty about superiority, continuing the trial is unethical\nB) Non-maleficence — the drug has unknown long-term side effects\nC) Justice — placebo arm participants deserve equal access to the experimental drug\nD) Beneficence — researchers must maximize the benefit to future patients by completing the trial\nE) Autonomy — participants consented to the full trial duration and must be respected"
    back: "A) Equipoise — if evidence no longer supports uncertainty about superiority, continuing the trial is unethical\n\nCLINICAL EQUIPOISE is the ethical foundation for RCTs — there must be genuine uncertainty about which arm is superior. When compelling interim data demonstrates clear superiority, equipoise is broken, and continuing the trial to administer placebo to participants becomes unethical (withholding a known superior treatment). Data Safety Monitoring Boards (DSMBs) exist precisely to monitor for this. Early stopping rules are pre-specified. Beneficence to future patients does NOT override duty to current participants."
    difficulty: hard
    tags: [Research Ethics, MCQ, Toronto Notes]
  - front: "A researcher studying cognitive decline in elderly patients wishes to enroll participants who can no longer provide independent consent. She plans to obtain consent from their SDMs. Which statement under TCPS2 is MOST accurate?\n\nA) Research on incapable adults is categorically prohibited in Canada\nB) SDM consent is permissible if the research offers direct benefit OR, for minimal-risk research, if the SDM gives consent and the research cannot be conducted with capable participants\nC) The research must be approved by a court before enrollment can proceed\nD) Research involving incapable adults always requires the research to have been enrolled when the participant was still capable\nE) Only observational research (no interventions) may be conducted on incapable adults"
    back: "B) SDM consent is permissible if the research offers direct benefit OR, for minimal-risk research, if the SDM gives consent and the research cannot be conducted with capable participants\n\nTCPS2 permits research on incapable adults when: (1) the research cannot be conducted solely with capable individuals, (2) SDM provides authorized third-party consent, (3) the research offers direct benefit to the participant OR involves minimal risk and generalizable knowledge, and (4) the participant's assent is sought and objection is respected. Canada does not require court approval for SDM-consented research. The 'enrolled when capable' requirement (prospective assent) is one but not the only pathway."
    difficulty: hard
    tags: [Research Ethics, MCQ, Toronto Notes]
  - front: "A researcher publishes a study showing a new surgical technique reduces complication rates by 40%. Six months later, data fabrication is discovered — the statistical results were manipulated. The journal retracts the paper. Surgeons who adopted the technique based on the published findings have already performed 200 cases. What is the PRIMARY obligation of the researcher following discovery of the fabrication?\n\nA) Retract the paper and resign from the institution\nB) Notify the journal, the institution, and regulatory bodies; take all steps to prevent continued use of the fraudulent findings, including notification of the surgical community\nC) Sue the whistleblower who reported the fabrication\nD) Publish a correction (not retraction) acknowledging statistical errors\nE) Only the institution (not the individual researcher) bears responsibility for notification"
    back: "B) Notify the journal, the institution, and regulatory bodies; take all steps to prevent continued use of the fraudulent findings, including notification of the surgical community\n\nResearch misconduct (fabrication, falsification, plagiarism) triggers multiple obligations: (1) immediate notification and cooperation with institutional investigation, (2) retraction of the publication, (3) notification of parties who may have acted on the findings (surgical societies, health authorities), and (4) possible notification to Health Canada if the research involved approved devices or drugs. The researcher bears PRIMARY personal responsibility alongside institutional obligations. Retraction alone is insufficient if practice has already changed."
    difficulty: hard
    tags: [Research Ethics, MCQ, Toronto Notes]
  - front: "During a clinical trial, a participant develops a serious adverse event potentially related to the investigational drug. The principal investigator is uncertain whether it is drug-related. What is the MOST appropriate immediate action?\n\nA) Wait until the end of the trial to report, as single events cannot be attributed to causation\nB) Report the serious adverse event to Health Canada within the required timeframe (15 calendar days for unexpected serious adverse drug reactions) regardless of certainty about causality\nC) Consult with the pharmaceutical sponsor first to determine if reporting is necessary\nD) Exclude the participant from the analysis and continue the trial\nE) Notify the REB only if the event is fatal"
    back: "B) Report the serious adverse event to Health Canada within the required timeframe (15 calendar days for unexpected serious adverse drug reactions) regardless of certainty about causality\n\nUnder Health Canada's regulations (Food and Drug Regulations, C.05.012), all UNEXPECTED serious adverse drug reactions must be reported to Health Canada within 15 calendar days regardless of whether causality is established. 'Unexpected' means not described in the current investigator's brochure. Fatal/life-threatening unexpected reactions require expedited 7-day reporting. The standard is precautionary — causal certainty is not required for reporting. The REB must also be notified."
    difficulty: hard
    tags: [Research Ethics, MCQ, Toronto Notes]
  - front: "A physician is served with a subpoena to produce a patient's medical records for civil litigation between the patient and a third party. The patient has NOT consented to the disclosure. What is the most appropriate response?\n\nA) Comply immediately with the subpoena — it is a court order that supersedes privacy legislation\nB) Notify the patient immediately, seek legal counsel (and CMPA assistance), and potentially file a motion to quash or limit the subpoena pending patient consent or a court order specifically directing disclosure\nC) Refuse categorically and destroy the records before the court date\nD) Disclose only demographic information and withhold clinical content\nE) Notify the CPSO before taking any other action"
    back: "B) Notify the patient immediately, seek legal counsel (and CMPA assistance), and potentially file a motion to quash or limit the subpoena pending patient consent or a court order specifically directing disclosure\n\nA subpoena is a DEMAND to produce, not automatically a court ORDER permitting breach of privilege. Ontario courts recognize physician-patient privilege in civil proceedings. The correct steps: (1) notify the patient immediately so they can instruct their own counsel, (2) seek CMPA guidance, (3) potentially bring a motion to quash/modify the subpoena or require a formal court order before disclosure. Simply complying without this process may breach PHIPA and violate physician-patient confidentiality. Only an explicit court ORDER (not merely a subpoena) compels production."
    difficulty: hard
    tags: [Legal Obligations, MCQ, Toronto Notes]
  - front: "A physician is asked to complete a disability insurance form for a long-term patient and write that the patient is 'unable to work in any capacity' when, in the physician's clinical opinion, the patient is able to perform sedentary work. The patient insists this framing is necessary to obtain benefits. What is the most appropriate response?\n\nA) Complete the form as requested — patient advocacy is a core physician role\nB) Decline to complete the form and discharge the patient from care\nC) Complete the form honestly reflecting your clinical assessment, even if this conflicts with the patient's preferred framing\nD) Refer to another physician to complete the form\nE) Complete the form but attach a separate letter clarifying your actual assessment"
    back: "C) Complete the form honestly reflecting your clinical assessment, even if this conflicts with the patient's preferred framing\n\nCompleting a form that misrepresents the patient's functional status constitutes FRAUD and professional misconduct. Physicians must be truthful in all medical-legal documents. While patient advocacy is important, it cannot extend to providing false certifications. The correct approach: explain clearly that you must complete the form accurately, document your actual clinical findings, and discuss with the patient. If the form cannot be completed honestly to support the claim, the physician should explain this rather than falsify records. CMPA data shows insurance fraud is a significant source of professional complaints."
    difficulty: hard
    tags: [Legal Obligations, MCQ, Toronto Notes]
  - front: "A 14-year-old patient confides to her pediatrician that she is being physically abused by her stepfather. She begs the physician not to tell anyone, stating the situation is 'under control' and she fears being removed from the home. The physician has previously reported to CAS, which conducted an investigation that was closed. What should the physician do?\n\nA) Respect the patient's mature minor autonomy and maintain confidentiality\nB) Report again to CAS — the mandatory reporting obligation applies each time there are reasonable grounds to suspect abuse, regardless of prior investigations or the patient's wishes\nC) Notify the biological father instead of CAS\nD) Only report if there are new visible injuries\nE) The prior CAS investigation that was closed negates the need for further reporting"
    back: "B) Report again to CAS — the mandatory reporting obligation applies each time there are reasonable grounds to suspect abuse, regardless of prior investigations or the patient's wishes\n\nMandatory child abuse reporting obligations apply EVERY TIME a physician has reasonable grounds to suspect a child is in need of protection. Prior investigations that were closed do NOT extinguish the obligation for new or ongoing disclosures. The child's wishes, fears, and assessment of the situation do NOT override the mandatory reporting requirement — the law explicitly removes discretion. The 'mature minor' doctrine does NOT apply to waive mandatory reporting of child abuse. Each disclosure triggers a fresh reporting obligation."
    difficulty: hard
    tags: [Legal Obligations, MCQ, Toronto Notes]
  - front: "A patient files a complaint with the CPSO alleging a physician made sexual comments during a physical examination. The CPSO investigation process includes a mandatory interview with the physician. The physician is also a defendant in a parallel criminal investigation for the same incident. What is the MOST accurate statement about the physician's obligations to the CPSO?\n\nA) The criminal investigation suspends all CPSO proceedings until criminal resolution\nB) The physician must cooperate fully with the CPSO investigation regardless of the parallel criminal proceedings, though they may assert privilege appropriately\nC) The physician's criminal defense attorney must consent to the CPSO interview before it proceeds\nD) Statements made to the CPSO cannot be used in criminal proceedings under a 'use immunity' provision\nE) The physician should resign their license to avoid self-incrimination"
    back: "B) The physician must cooperate fully with the CPSO investigation regardless of the parallel criminal proceedings, though they may assert privilege appropriately\n\nCPSO investigations are regulatory, not criminal. Physicians have a statutory duty under the Regulated Health Professions Act (RHPA) to cooperate with the CPSO. Criminal and regulatory proceedings are parallel and independent. Importantly, in R. v. White (1999, SCC), the court recognized that regulatory compelled statements have certain protections from use in criminal proceedings — however, derivative evidence may still be used. The physician should engage both the CMPA (for the CPSO matter) and a criminal defense lawyer. Resignation does not stop CPSO investigation."
    difficulty: hard
    tags: [Regulatory Bodies, MCQ, Toronto Notes]
  - front: "A first-year resident witnesses an attending physician performing a procedure (central line insertion) without appropriate sterile technique, resulting in a preventable infection. The resident reported this to the attending, who dismissed the concern. What is the most appropriate next step?\n\nA) Accept the attending's response — hierarchy of experience should be respected\nB) Document the concern in the patient's chart as a 'complication' and move on\nC) Escalate the concern through appropriate channels: patient safety reporting system, chief resident, program director, or hospital quality improvement mechanisms\nD) Contact the CPSO directly with the complaint\nE) Discuss with other residents to determine if this is a pattern before escalating"
    back: "C) Escalate the concern through appropriate channels: patient safety reporting system, chief resident, program director, or hospital quality improvement mechanisms\n\nPatient safety obligations override hierarchical deference. After an unsuccessful approach to the attending, the resident should escalate through formal channels: incident report in the patient safety reporting system (which is protected from certain disclosures under legislation like Ontario's Quality of Care Information Protection Act/QCIPA), program director, department chief, or hospital quality department. Trainees are explicitly protected from retaliation for patient safety reporting under most hospital and university policies. Direct CPSO complaints are an option but institutional channels are usually the first appropriate step."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "The Canadian Medical Protective Association (CMPA) and the College of Physicians and Surgeons of Ontario (CPSO) both investigate a complaint against a physician. Which BEST describes their respective roles?\n\nA) CMPA regulates physician conduct; CPSO provides malpractice defense funding\nB) CPSO is the statutory regulatory body that protects the public and may revoke licensure; CMPA is a mutual defense association that provides legal and financial support to physician members — they serve entirely different functions\nC) CPSO and CMPA jointly decide on penalties for physician misconduct\nD) CMPA can order physicians to complete remediation programs\nE) CPSO provides insurance coverage for civil liability claims against physicians"
    back: "B) CPSO is the statutory regulatory body that protects the public and may revoke licensure; CMPA is a mutual defense association that provides legal and financial support to physician members — they serve entirely different functions\n\nKey distinction: CPSO is a STATUTORY REGULATOR under the RHPA with public protection as its mandate — it can investigate, discipline, suspend, and revoke licenses. CMPA is a MUTUAL DEFENSE SOCIETY (not an insurer) that provides legal defense assistance and financial support to member physicians in civil suits and regulatory proceedings. They operate independently. The CMPA advocates for the physician; the CPSO's mandate is to serve the public interest. This is a frequently misunderstood distinction on the MCCQE1."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "Under Canada's Regulated Health Professions Act framework, which mechanism protects most health professions from encroachment by unregulated practitioners for specific controlled acts?\n\nA) The Criminal Code of Canada, which makes unauthorized medical practice an indictable offence\nB) The RHPA's controlled acts regime — certain clinical acts (e.g., performing surgery, prescribing, administering substances by injection) are restricted to specific regulated professionals\nC) The Canada Health Act, which defines who may provide insured services\nD) Provincial medical education standards, which certify competency\nE) The Public Hospitals Act, which restricts procedural privileges"
    back: "B) The RHPA's controlled acts regime — certain clinical acts (e.g., performing surgery, prescribing, administering substances by injection) are restricted to specific regulated professionals\n\nThe RHPA (Ontario) framework uses CONTROLLED ACTS — 13 specific procedures (including performing a procedure below the dermis, setting a fracture, prescribing, etc.) — that may only be performed by authorized regulated health professionals. Other provinces have similar structures. This protects scope of practice, not just titles. Unauthorized performance of a controlled act is a provincial offence. The Criminal Code is not the primary mechanism for scope-of-practice protection."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "A hospital's Quality Assurance Committee reviews the care provided to a deceased patient as part of a mortality and morbidity review. A family member, now involved in a civil lawsuit against the physician, seeks disclosure of the M&M committee's deliberations and minutes. Under Ontario law, what is the status of those records?\n\nA) All hospital records are subject to discovery in civil litigation\nB) The M&M committee deliberations are fully protected from disclosure under QCIPA (Quality of Care Information Protection Act), and cannot be compelled in civil proceedings\nC) Protection only applies if the committee was formally convened as a 'quality of care committee'\nD) The records may be disclosed if a judge determines they are relevant\nE) The physician may voluntarily disclose M&M proceedings to defend themselves in litigation"
    back: "B) The M&M committee deliberations are fully protected from disclosure under QCIPA (Quality of Care Information Protection Act), and cannot be compelled in civil proceedings\n\nOntario's QCIPA (Quality of Care Information Protection Act, 2004) protects 'quality of care information' compiled by designated quality of care committees from disclosure in civil proceedings. This protection encourages frank, blame-free review of adverse events without fear that candid discussion will become evidence in lawsuits. The committee must be designated under QCIPA. Importantly, the underlying factual records (patient chart) remain disclosable — only the committee's deliberations and conclusions are protected. This balance encourages open quality improvement."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "A newly arrived Government-Assisted Refugee (GAR) presents to an ER with chest pain. She does not have provincial health insurance yet and cannot pay for services. Under the Interim Federal Health Program (IFHP), which services are covered?\n\nA) No services — refugees must wait 3 months before any federal or provincial coverage begins\nB) Urgent and essential healthcare under IFHP, which covers GARs from day 1 of arrival in Canada\nC) Only services that provincial health plans would cover\nD) Emergency services only if the condition is life-threatening\nE) Only services provided by federally funded clinics"
    back: "B) Urgent and essential healthcare under IFHP, which covers GARs from day 1 of arrival in Canada\n\nThe IFHP provides health coverage for eligible newcomers (including GARs, refugees claimants, protected persons) when provincial/territorial coverage is unavailable. GARs are covered from day 1 with coverage that generally mirrors provincial plans (urgent, essential, and supplemental benefits). IFHP was significantly restored in 2016 after cuts that were challenged in the courts (Canadian Doctors for Refugee Care v. Canada, 2014, which found the cuts to be cruel and unusual under the Charter). This is high-yield for MCCQE1."
    difficulty: hard
    tags: [Special Populations, MCQ, Toronto Notes]
  - front: "A physician practicing in a First Nations community is asked to prescribe a traditional medicine as an adjunct to conventional treatment. The physician has no knowledge of the preparation's pharmacology. The patient explains this is a cultural healing practice supported by their family and community Elder. What is the most appropriate approach?\n\nA) Refuse the request as the physician cannot prescribe substances of unknown pharmacology\nB) Prescribe immediately as cultural competence requires unconditional deference to Indigenous healing practices\nC) Engage respectfully and openly with the patient about the traditional practice, seek to understand it, assess for potential drug interactions or harms using available resources, and involve the patient in a shared decision-making process\nD) Report the Elder to public health as an unregulated practitioner\nE) Request the patient sign a liability waiver before agreeing to coadminister traditional medicine"
    back: "C) Engage respectfully and openly with the patient about the traditional practice, seek to understand it, assess for potential drug interactions or harms using available resources, and involve the patient in a shared decision-making process\n\nTruth and Reconciliation Commission Calls to Action include improving Indigenous health by recognizing traditional healing. The appropriate response integrates cultural safety with clinical responsibility: (1) engage respectfully — do NOT dismiss, (2) ask open questions about the preparation, (3) research potential interactions, (4) involve the patient in shared decision-making, (5) document the discussion. Cultural humility does not mean abandoning clinical judgment, but it means approaching difference without prejudice. Refusing outright without engagement fails cultural safety principles."
    difficulty: hard
    tags: [Special Populations, MCQ, Toronto Notes]
  - front: "A 16-year-old who identifies as transgender requests referral for gender-affirming hormone therapy. Their parents are opposed and have not been informed. The patient demonstrates full understanding of the physical changes, risks (fertility effects, cardiovascular risk), and reversibility. Which approach is MOST appropriate in most Canadian provinces?\n\nA) Defer all gender-affirming care until the patient turns 18\nB) Require parental consent for any hormone therapy as this constitutes non-emergency medical treatment for a minor\nC) If the patient has capacity (mature minor assessment), they may consent to gender-affirming care without parental consent, and their confidentiality must be maintained unless safety concerns arise\nD) Refer to psychiatry to rule out gender dysphoria before any hormone discussion\nE) Disclose the patient's gender identity to parents as part of routine family-centered care for minors"
    back: "C) If the patient has capacity (mature minor assessment), they may consent to gender-affirming care without parental consent, and their confidentiality must be maintained unless safety concerns arise\n\nAcross Canadian provinces, the mature minor doctrine supports a gender-diverse youth's right to consent to gender-affirming care independently if they demonstrate decision-making capacity. Mandatory parental disclosure violates confidentiality and may cause harm. Canadian Human Rights Code protections on gender identity mean physicians must approach this with competence and without discrimination. Disclosing a young person's gender identity to non-supportive parents without consent can constitute a serious breach with safety consequences. Capacity assessment is the key gating step."
    difficulty: hard
    tags: [Special Populations, MCQ, Toronto Notes]
  - front: "An incarcerated person is brought to hospital from a federal penitentiary with a serious infection. They request treatment. Who is responsible for their healthcare coverage, and what ethical obligation applies?\n\nA) Provincial health insurance covers all care as healthcare is a Charter right\nB) Correctional Service of Canada (CSC) is responsible for health coverage of federal inmates; the physician's ethical obligation to provide appropriate care applies regardless of payment source\nC) The patient must be denied care until released from custody\nD) The hospital must fund the care as a charitable obligation\nE) Provincial insurance applies after 24 hours of hospitalization"
    back: "B) Correctional Service of Canada (CSC) is responsible for health coverage of federal inmates; the physician's ethical obligation to provide appropriate care applies regardless of payment source\n\nFederal penitentiary inmates are EXCLUDED from provincial health insurance under the Canada Health Act — Correctional Service Canada (CSC) is responsible for their healthcare. Despite the administrative exclusion, the ethical obligation to provide medically necessary care is unchanged. Physicians must provide care regardless of funding source; insurance exclusion is an administrative matter, not an ethical permission to withhold care. The UN Mandela Rules (Standard Minimum Rules for the Treatment of Prisoners) affirm prisoners' right to healthcare equivalent to community standards."
    difficulty: hard
    tags: [Special Populations, MCQ, Toronto Notes]
  - front: "A patient with known schizophrenia presents to the ER expressing paranoia, disorganized thinking, and refusing antipsychotic medications. She has previously been involuntarily admitted and treated under the Mental Health Act. She does not currently meet criteria for involuntary admission (no imminent harm to self/others). What is the most appropriate action?\n\nA) Administer medication against her will as her mental illness impairs capacity\nB) Respect her refusal, provide community resources, and ensure outpatient follow-up if she agrees\nC) Involuntarily admit her to 'prevent relapse' under the Mental Health Act\nD) Contact her family to override her refusal\nE) Sedation is warranted given her history of non-compliance"
    back: "B) Respect her refusal, provide community resources, and ensure outpatient follow-up if she agrees\n\nInvoluntary admission under provincial Mental Health Acts requires BOTH: (1) mental disorder AND (2) imminent risk of serious bodily harm to self or others (some provinces also include 'serious physical impairment'). Symptoms of illness alone, or poor insight, or history of non-compliance, do NOT meet the threshold for involuntary detention. Absence of imminent risk = no legal authority for involuntary admission or forced medication. The physician must respect her refusal, offer voluntary treatment, and ensure safety planning. Forced treatment without legal authority constitutes assault."
    difficulty: hard
    tags: [Special Populations, MCQ, Toronto Notes]
  - front: "A 30-year-old patient is enrolled in a clinical trial for a new antidepressant. Three months into the trial, new interim data suggests the drug may cause a 3% risk of irreversible sexual dysfunction — a risk not disclosed during the original consent process. What is the researcher's obligation?\n\nA) No obligation to re-consent as the patient signed a blanket consent form\nB) Re-consent all active trial participants as soon as the new risk is identified — ongoing consent is a dynamic process and new material risks must be disclosed\nC) Disclose only to new participants enrolling after this finding\nD) Report to Health Canada but maintain current participant confidentiality\nE) Re-consent only participants who have not yet developed sexual dysfunction"
    back: "B) Re-consent all active trial participants as soon as the new risk is identified — ongoing consent is a dynamic process and new material risks must be disclosed\n\nInformed consent in research is an ONGOING PROCESS, not a one-time signature. When significant new risks emerge during a trial, researchers have an obligation to promptly re-consent active participants with updated information. This is required by TCPS2 and Health Canada's research regulations. Participants who may not have enrolled had they known of this risk must be given the opportunity to withdraw. Disclosing only to new enrollees would leave current participants without updated material information — a clear ethical violation."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "A hospital ethics committee is consulted regarding a patient in a persistent vegetative state (PVS) whose family demands continued aggressive intervention indefinitely. The ICU team believes continued intervention is futile. The ethics committee's PRIMARY role in this case is:\n\nA) To render a binding decision overriding the family's wishes\nB) To provide advice, facilitate communication, and help identify shared values and goals — ethics committees are consultative, not authoritative\nC) To conduct a formal legal proceeding regarding the patient's capacity\nD) To report the family to social services for obstructing medical care\nE) To provide a second opinion on the diagnosis of PVS"
    back: "B) To provide advice, facilitate communication, and help identify shared values and goals — ethics committees are consultative, not authoritative\n\nHospital ethics committees (HECs) in Canada are consultative and advisory — they do NOT have binding decision-making authority. Their role is: (1) facilitate communication between the care team and family, (2) clarify ethical principles, (3) help identify the patient's prior values, (4) explore options and identify consensus. They do not override clinicians or families. If a binding resolution is needed (and parties cannot agree), the appropriate forum is the Consent and Capacity Board (Ontario) or courts. Confusing advisory with authoritative is a common MCCQE1 distractor."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A physician receives a request from a patient to access the raw genetic sequencing data from a research biobank the patient participated in years ago. The consent form signed at the time did not explicitly address individual access to raw data. Under TCPS2, what guidance applies?\n\nA) Participants always have an absolute right to access their own raw genetic data\nB) Research participants have a right to access information about themselves, including research results, unless the consent form explicitly excluded this; the research team should consider the implications of returning raw genomic data (incidental findings, interpretive complexity) before disclosure\nC) Raw genetic data is research property and participants have no legal right of access\nD) The right of access applies only to final published results, not raw data\nE) Participants forfeited all access rights upon signing the consent form"
    back: "B) Research participants have a right to access information about themselves, including research results, unless the consent form explicitly excluded this; the research team should consider the implications of returning raw genomic data (incidental findings, interpretive complexity) before disclosure\n\nTCPS2 Article 3.4 addresses return of individual research results and recognizes the participant's interest in receiving information about themselves. However, the return of RAW genomic data is complex: it may contain incidental findings (variants of uncertain significance, disease susceptibility information) that participants may not be prepared for without genetic counselling. The research team's obligation is to: (1) consider the welfare implications, (2) engage in a process (ideally with genetic counselling support), (3) not simply refuse. The prior consent form's silence on this issue requires interpretation."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "Under the Canadian Charter of Rights and Freedoms, s.7 (the right to life, liberty and security of the person) and s.15 (equality rights), which landmark case affirmed that denying access to safe physician-assisted dying violated the Charter?\n\nA) Rodriguez v. British Columbia (1993)\nB) Carter v. Canada (2015)\nC) Cuthbertson v. Rasouli (2013)\nD) R. v. Morgentaler (1988)\nE) PHS Community Services Society v. Canada (2011)"
    back: "B) Carter v. Canada (2015)\n\nCarter v. Canada (Attorney General), 2015 SCC 5, is the landmark Supreme Court decision that struck down the Criminal Code prohibition on assisted dying as unconstitutional under s.7 of the Charter. The Court found that the prohibition violated the right to life (by forcing some to end their lives prematurely while still physically capable), liberty, and security of the person. This led to Bill C-14 (2016) creating the MAiD framework. Rodriguez (1993) had previously UPHELD the prohibition (5-4). Carter superseded Rodriguez. This is essential MCCQE1 legal-historical knowledge."
    difficulty: hard
    tags: [Legal, MCQ, Toronto Notes]
  - front: "A physician is considering whether to disclose a medical error to a patient. The error (wrong dose of anticoagulant) caused a minor bleed that resolved without intervention. The patient did not notice any unusual symptoms. Provincial professional standards and CMA guidelines on disclosure apply. What does the principle of OPEN DISCLOSURE require?\n\nA) Disclosure is only required when the patient asks or when there are ongoing clinical consequences\nB) The physician must disclose the error to the patient, apologize, explain what happened, describe the steps taken to address it, and outline preventive measures — even if no lasting harm occurred\nC) Disclosure is at the physician's discretion when the patient suffered no lasting harm\nD) Disclosure to hospital administration fulfills the physician's obligation; patient notification is optional\nE) Disclosure is required only if another provider discovers the error first"
    back: "B) The physician must disclose the error to the patient, apologize, explain what happened, describe the steps taken to address it, and outline preventive measures — even if no lasting harm occurred\n\nCanadian healthcare standards (CMA, CPSO, Canadian Patient Safety Institute) require open disclosure of harmful events — including near-misses and errors causing minor harm — to patients. This is both an ethical obligation (honesty and respect for autonomy) and increasingly a legal standard. Disclosure should include: what happened, why it happened, the consequences (even if minor), the corrective action taken, and a genuine apology. Many provinces have passed apology legislation (e.g., Ontario Apology Act, 2009) specifically to allow physicians to apologize without the apology constituting an admission of liability in civil proceedings."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A patient states, 'My doctor is racist and gave me different care than my white roommate.' You are the second physician now managing this patient's case. The patient's care under the previous physician appears to have been within the standard of care on chart review, but below best-practice guidelines. What is the most appropriate response?\n\nA) Dismiss the complaint as there is no documented evidence of racism in the chart\nB) Acknowledge the patient's experience non-dismissively, ensure culturally safe ongoing care, document the concern, and suggest the patient can file a formal complaint with the CPSO if they wish — without prejudging the previous physician's intent\nC) Report the previous physician to the CPSO based on the patient's account alone\nD) Tell the patient that chart review shows appropriate care and therefore their perception is incorrect\nE) Apologize on behalf of the previous physician"
    back: "B) Acknowledge the patient's experience non-dismissively, ensure culturally safe ongoing care, document the concern, and suggest the patient can file a formal complaint with the CPSO if they wish — without prejudging the previous physician's intent\n\nHealth equity and anti-racism obligations require physicians to take patient-reported experiences of discrimination seriously. The correct response: (1) validate the patient's experience (do NOT dismiss), (2) ensure your own ongoing care is equitable and culturally safe, (3) document the patient's report, (4) inform the patient of available complaint mechanisms (CPSO) without prejudging the previous physician. You cannot report another physician based solely on a patient's account without evidence — but you absolutely should not deny or minimize the patient's experience. This reflects Truth and Reconciliation and health equity competencies tested on MCCQE1."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A patient with known bipolar disorder I, currently in a hypomanic state (not manic), wishes to consent to an elective rhinoplasty. The surgeon is concerned about capacity. Which element MOST specifically addresses the concern about hypomania and capacity?\n\nA) Whether the patient understands the procedure technically\nB) Whether the patient can appreciate the consequences of the decision given that hypomania may cause impulsivity, inflated self-assessment, and impaired long-term risk weighing\nC) Whether the patient can verbally express a consistent choice\nD) Whether the patient has a designated SDM\nE) Whether the patient has been medicated adequately before consenting"
    back: "B) Whether the patient can appreciate the consequences of the decision given that hypomania may cause impulsivity, inflated self-assessment, and impaired long-term risk weighing\n\nHypomania specifically impairs APPRECIATION and REASONING — the patient may technically understand the procedure but their judgment may be distorted by hypomanic grandiosity, impulsivity, and inflated self-perception. For ELECTIVE cosmetic surgery, this is particularly concerning because: (1) there is no urgency, (2) the patient may make a decision they would regret when euthymic, (3) capacity assessment should account for the effect of the current mood state on decision-making quality. The correct clinical response: defer elective surgery until the hypomanic episode resolves and capacity is reassessed."
    difficulty: hard
    tags: [Capacity Assessment, MCQ, Toronto Notes]
  - front: "A rural physician with a full patient panel receives a request for assessment from a new patient who is an asylum seeker covered under IFHP. The physician's practice is technically full. Which statement BEST reflects the ethical obligation?\n\nA) The physician has no obligation to accept new patients if the practice is full\nB) Asylum seekers covered under IFHP must be referred to federally funded clinics only\nC) While individual physicians are not obligated to accept any specific patient, refusing patients based on their immigration or insurance status (IFHP) when other patients with provincial coverage would be accepted may constitute discrimination under human rights legislation\nD) Physicians in rural areas are exempt from equity obligations due to resource constraints\nE) The physician should accept the patient only if they can bill at a higher rate"
    back: "C) While individual physicians are not obligated to accept any specific patient, refusing patients based on their immigration or insurance status (IFHP) when other patients with provincial coverage would be accepted may constitute discrimination under human rights legislation\n\nPhysicians have no absolute obligation to accept new patients, but they must NOT refuse patients on discriminatory grounds protected under the Canadian Human Rights Act and provincial human rights codes — including race, national or ethnic origin, and by extension immigration status. If a physician accepts patients with provincial insurance but refuses patients with equivalent IFHP coverage, this may constitute unlawful discrimination. CMA ethics guidelines also emphasize equitable access. This is a nuanced but important equity-based MCCQE1 question."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "A physician is sued for negligence. The plaintiff must establish all elements of the negligence tort. Which combination is required for a successful negligence claim?\n\nA) Intent to harm + duty of care + causation\nB) Duty of care + breach of the standard of care + causation + damages\nC) Duty of care + bad outcome + intent\nD) Breach of standard of care + damages, even without establishing causation\nE) Duty of care + breach + complaint filed with the CPSO"
    back: "B) Duty of care + breach of the standard of care + causation + damages\n\nThe four-part negligence test in Canadian tort law: (1) DUTY OF CARE — a physician-patient relationship establishes this; (2) BREACH of the standard of care — the physician fell below the standard of a reasonable physician in similar circumstances; (3) CAUSATION — the breach caused (on the balance of probabilities, 'but for' the breach, the damage would not have occurred); (4) DAMAGES — actual harm resulted. All four elements must be proven. A bad outcome alone (without breach) is not negligence. A breach without resultant damages is not actionable negligence."
    difficulty: hard
    tags: [Legal, MCQ, Toronto Notes]
  - front: "A pharmaceutical company approaches a resident physician to be a 'key opinion leader' (KOL) for their new rheumatology drug — speaking at CME events, writing patient pamphlets, and attending advisory board meetings, all remunerated. The resident has no significant research background in the area. Which concern is MOST ethically significant?\n\nA) Residents lack the experience to speak credibly — the issue is purely about competence\nB) The financial relationship with industry creates a conflict of interest that may bias clinical content, and the resident's relative inexperience makes them more susceptible to industry influence\nC) This is standard industry practice and ethically acceptable if disclosed\nD) The CME events are not accredited and therefore the resident is not obligated to disclose the relationship\nE) The issue is a CPSO reporting obligation, not an ethics concern"
    back: "B) The financial relationship with industry creates a conflict of interest that may bias clinical content, and the resident's relative inexperience makes them more susceptible to industry influence\n\nKOL relationships with pharmaceutical industry are a major COI concern. The specific risks: (1) industry shapes the KOL's message, (2) the financial relationship creates explicit bias, (3) a junior physician with little independent research background is more susceptible to industry framing and less able to critically appraise the data. CMA and provincial guidelines require full disclosure and careful management of industry relationships. Medical education literature consistently shows industry-sponsored education shifts prescribing toward sponsor products. This is a health system integrity concern."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "An Ontario physician provides care to a patient who suffers an adverse outcome. The family hires a lawyer. The physician receives correspondence from CMPA. Which statement about CMPA membership and coverage is MOST accurate?\n\nA) CMPA is mandatory for all physicians practicing in Canada\nB) CMPA is a voluntary mutual defense organization; membership is not legally required but is required by most Ontario hospitals for credentialing privileges\nC) CMPA provides malpractice insurance in the same way as commercial insurers\nD) CMPA membership is funded by the provincial government for all licensed physicians\nE) Non-CMPA members are ineligible for CPSO licensure"
    back: "B) CMPA is a voluntary mutual defense organization; membership is not legally required but is required by most Ontario hospitals for credentialing privileges\n\nCMPA is VOLUNTARY — no provincial law requires CMPA membership. However, most Ontario (and Canadian) hospitals require CMPA membership or equivalent protection as a condition of hospital privileges and credentialing. CMPA is technically a MUTUAL DEFENSE society, not an insurance company (though functionally similar for the physician). Provincial governments typically provide partial CMPA fee rebates to physicians. Without CMPA membership, a physician facing litigation must fund their own defense, which can be financially catastrophic given the costs of medical malpractice litigation."
    difficulty: hard
    tags: [Legal, MCQ, Toronto Notes]
  - front: "A community hospital in Ontario discovers a pattern of repeated medication errors on one ward over a 6-month period. Analysis reveals a systematic nursing workflow issue. Under the Canadian Patient Safety Institute and Quality Improvement frameworks, what is the PRIMARY purpose of a root cause analysis (RCA) in this context?\n\nA) To identify which nurse made the most errors and initiate disciplinary action\nB) To identify the systemic contributing factors to the adverse events and recommend system-level changes to prevent recurrence, in a blame-free environment\nC) To provide evidence for CPSO investigations into individual practitioners\nD) To satisfy legal discovery requirements in anticipated litigation\nE) To determine whether the ward should be closed pending investigation"
    back: "B) To identify the systemic contributing factors to the adverse events and recommend system-level changes to prevent recurrence, in a blame-free environment\n\nRoot Cause Analysis (RCA) is a SYSTEMS-BASED quality improvement tool — its purpose is to identify systemic failures, contributing factors, and process deficiencies, NOT to assign individual blame. The 'Swiss Cheese' model (Reason) underlies modern patient safety thinking: errors occur when multiple system defenses fail simultaneously. The goal is system redesign to prevent recurrence. RCA findings conducted under quality assurance committees may be protected from disclosure in litigation (QCIPA in Ontario). Individual discipline is a separate process."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "A physician is caring for a patient with severe treatment-resistant anorexia nervosa (AN) who weighs 28 kg (BMI 10.3). The patient has full capacity and refuses feeding. The patient's cardiologist warns that death may occur within weeks without nutritional intervention. Which ethical tension is MOST central to this case?\n\nA) Beneficence vs. non-maleficence — tube feeding may cause more harm than good\nB) Autonomy of a capable patient vs. beneficence/non-maleficence — the patient's competent refusal of life-saving treatment must be balanced against severe harm\nC) Resource allocation — ICU feeding carries high costs\nD) Professional integrity — physicians should not participate in allowing a patient to die\nE) Justice — the patient is entitled to identical treatment as a physically ill patient"
    back: "B) Autonomy of a capable patient vs. beneficence/non-maleficence — the patient's competent refusal of life-saving treatment must be balanced against severe harm\n\nSevere AN at this weight represents one of the most ethically challenging clinical scenarios. The central tension: (1) the patient has assessed capacity and exercises autonomous refusal; (2) the illness itself may distort body image and 'ego-syntonic' refusal. Canadian courts have addressed this (e.g., AN is unique in that courts have sometimes authorized treatment over refusal given the ego-syntonic nature of the illness). The question of whether an AN patient can have capacity to refuse feeding when the illness involves distorted perception of their own body is deeply contested in bioethics. Multiple ethics consults, team-based care, and clear documentation are essential."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A physician suspects a patient may be fabricating a disability claim for insurance purposes after reviewing inconsistencies in exam findings and reported symptoms. A private investigator working for the insurer contacts the physician and offers to pay for 'consultation' in exchange for discussing the patient's care. What is the appropriate response?\n\nA) Accept the consultation fee as it is a legitimate insurance industry practice\nB) Decline entirely — discussing a patient's case with a third party investigator (even for compensation) without the patient's specific consent constitutes a breach of confidentiality\nC) Accept only if the compensation is donated to charity\nD) Discuss only objective test results, not clinical observations\nE) Accept if the patient is later found to be committing fraud"
    back: "B) Decline entirely — discussing a patient's case with a third party investigator (even for compensation) without the patient's specific consent constitutes a breach of confidentiality\n\nDiscussing a patient's case with an insurance company's private investigator WITHOUT the patient's specific consent is a SERIOUS BREACH of confidentiality. Accepting payment to do so compounds the misconduct. Insurance companies may obtain medical information through formal processes (patient-authorized release forms, legal subpoenas) — not informal paid consultations. This scenario also raises concerns about physician integrity and conflict of interest. The physician should politely decline and, if appropriate, advise the insurer to contact the patient directly or through legal channels."
    difficulty: hard
    tags: [Legal, MCQ, Toronto Notes]
  - front: "A clinical geneticist discovers incidental findings during whole-genome sequencing performed for a research study: a BRCA1 mutation in a participant who consented to sequencing for unrelated cardiac genetics research. The original consent form did not address return of incidental findings. Which ethical framework BEST guides action?\n\nA) Do not disclose — the consent form did not include return of findings, creating no obligation\nB) The geneticist should consider disclosure under a duty to rescue/warn framework, recognizing that: (1) the finding is medically actionable (BRCA1), (2) the risk of serious harm is significant, (3) disclosure has potential direct benefit, and (4) prior consent did not explicitly preclude return of results\nC) Disclose immediately to the participant's family members who may also carry the mutation\nD) Disclose only if the finding is immediately life-threatening\nE) The research team has no obligation beyond the consent form's scope"
    back: "B) The geneticist should consider disclosure under a duty to rescue/warn framework, recognizing that: (1) the finding is medically actionable (BRCA1), (2) the risk of serious harm is significant, (3) disclosure has potential direct benefit, and (4) prior consent did not explicitly preclude return of results\n\nIncidental genomic findings in research are addressed in the ACMG (American College of Medical Genetics) guidelines and TCPS2. Actionable pathogenic variants (BRCA1 being a prototypical example) create a strong ethical argument for disclosure based on: (1) medical actionability (risk-reducing surgery, surveillance), (2) significance of potential harm (cancer risk), (3) the 'duty to rescue' principle — a physician/researcher who discovers imminent and preventable harm has an obligation to act. The process: (1) engage the REB, (2) reach out to the participant offering disclosure with genetic counselling support. Family member notification is a secondary step requiring the participant's consent."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "A physician working at a walk-in clinic is asked by the clinic owner (a non-physician business operator) to prescribe a specific brand of antibiotic because the clinic has a supply agreement with a pharmaceutical distributor. The physician's clinical preference is a different, equally effective antibiotic. What principle is at stake?\n\nA) This is acceptable — supply chain efficiency is a legitimate business concern\nB) Physician clinical independence: physicians must make prescribing decisions based solely on patient welfare, not business or commercial pressures from clinic administrators\nC) Non-physician clinic owners cannot make any operational requests of physicians\nD) This is only problematic if the antibiotic is more expensive\nE) Physicians are obligated to follow clinic protocols developed by administrators"
    back: "B) Physician clinical independence: physicians must make prescribing decisions based solely on patient welfare, not business or commercial pressures from clinic administrators\n\nCLINICAL INDEPENDENCE is a foundational professional obligation. Physicians must make clinical decisions based on patient welfare, clinical evidence, and professional judgment — not business interests, commercial arrangements, or pressure from non-physician clinic owners. This is a form of corporate conflict of interest. The CPSO and provincial health professions statutes explicitly protect physician clinical independence within institutional settings. A business owner directing prescribing choices represents a serious breach of this principle and may constitute professional misconduct by the physician who complies."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "During a difficult family meeting, a family member of a dying patient states: 'If you withdraw his ventilator, you're killing him — that's murder.' The intensivist should respond by explaining which core ethical distinction?\n\nA) That the law does not apply to hospital settings\nB) The distinction between killing and letting die: withdrawing burdensome life support from a patient who is dying and would not want it (or when it is futile) is ethically and legally distinct from causing death — it allows the natural dying process to occur\nC) That the family has no legal standing to object to withdrawal\nD) That the patient's chart documentation overrides family concerns\nE) That palliative care will be provided, making the distinction moot"
    back: "B) The distinction between killing and letting die: withdrawing burdensome life support from a patient who is dying and would not want it (or when it is futile) is ethically and legally distinct from causing death — it allows the natural dying process to occur\n\nThe KILLING vs. LETTING DIE distinction is fundamental to end-of-life ethics. Withdrawing a ventilator from a dying patient removes an artificial burden and permits the natural dying process — the proximate cause of death is the underlying disease, not the physician's action. This is ethically and legally distinct from administering a lethal agent (active killing). Canadian courts, the Criminal Code, and medical ethics recognize this distinction. Withdrawal of burdensome or futile life-sustaining treatment is lawful and ethical when consistent with the patient's wishes or best interests. This distinction must be explained compassionately to families."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A 10-year-old child is brought to the ER by her parents with a limb fracture after falling from a playground. On exam, there are also 3 healing bruises in different stages and a healed spiral fracture of the humerus noted on incidental radiograph. The parents are attentive and concerned. A colleague whispers, 'These parents seem genuinely upset — it's probably fine.' How should the ER physician proceed?\n\nA) Accept the colleague's reassurance — parental demeanor is a reliable indicator of abuse\nB) Conduct a full skeletal survey, consult pediatrics and social work, and report to CAS based on reasonable suspicion regardless of parental presentation\nC) Wait for the skeletal survey results before reporting, as suspicion must be confirmed\nD) Report only if the parents' story is internally inconsistent\nE) Report only if the child verbally discloses abuse"
    back: "B) Conduct a full skeletal survey, consult pediatrics and social work, and report to CAS based on reasonable suspicion regardless of parental presentation\n\nParental demeanor is an UNRELIABLE indicator of abuse — perpetrators of child abuse often present as attentive, distressed parents. The physical findings here are highly concerning for non-accidental trauma: multiple bruises in different healing stages (suggesting repeated events), a healed spiral humerus fracture (classic for twisting/torsional force), and a new long-bone fracture. These are 'classic triad' findings. The child protection report to CAS is based on REASONABLE SUSPICION — not proof, not confession, not inconsistent history. A full skeletal survey should proceed concurrently, not as a precondition for reporting."
    difficulty: hard
    tags: [Special Populations, MCQ, Toronto Notes]
  - front: "A pharmaceutical company funds a clinical trial. The trial data is owned by the company, which reserves the right to review and approve publications before submission. The principal investigator finds that the drug is no more effective than placebo. The company delays publication for 18 months and asks the investigator to reframe the conclusions. What ethical principle is MOST seriously violated?\n\nA) Non-maleficence — the drug's side effects were not adequately studied\nB) Publication freedom and research integrity: the company's contractual control over publication constitutes data suppression and scientific misconduct that distorts the medical evidence base and harms patients and prescribers who cannot access accurate effectiveness data\nC) Justice — the trial participants received ineffective treatment\nD) Informed consent — participants were not told the drug might be ineffective\nE) Beneficence — the study should have been designed to show benefit"
    back: "B) Publication freedom and research integrity: the company's contractual control over publication constitutes data suppression and scientific misconduct that distorts the medical evidence base and harms patients and prescribers who cannot access accurate effectiveness data\n\nSelective and delayed publication of negative trial data is a documented major threat to medical evidence integrity (publication bias). When negative results are suppressed, the published literature overrepresents efficacy, leading to inappropriate prescribing. The investigator has an ethical obligation to publish findings regardless of sponsor preferences. ICMJE guidelines require trial registration (before enrollment) and prohibit contractual restrictions on independent publication. Researchers should not enter contracts that give sponsors veto power over publication. This scenario may constitute research misconduct and violates the principles of research integrity."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A patient with terminal ALS has a Power of Attorney for Personal Care (PAPC) designating her husband as her SDM. The PAPC was signed 5 years ago. The patient is now incapable. Her husband, acting as SDM, requests withdrawal of home ventilation. A daughter objects, claiming her mother 'would never want that.' Which person has legal authority to make this decision?\n\nA) The majority of family members, reached by consensus\nB) The husband, as the legally designated PAPC holder — he has legal authority as SDM to make healthcare decisions based on substituted judgment (what the patient would have wanted)\nC) The daughter, as the most involved family member\nD) The attending physician, who makes the final clinical determination\nE) All family members must unanimously agree before withdrawal can proceed"
    back: "B) The husband, as the legally designated PAPC holder — he has legal authority as SDM to make healthcare decisions based on substituted judgment (what the patient would have wanted)\n\nA validly executed Power of Attorney for Personal Care (PAPC) designates a specific individual as the legal SDM — it is a formal legal instrument. The PAPC holder's authority supersedes other family members, including adult children. The husband, as PAPC holder, has legal authority to consent or refuse treatment on behalf of the incapable patient. He must act based on substituted judgment (her prior expressed wishes and values), not his own preferences. The daughter's objection should be heard, but it does not override the legal PAPC. If the daughter believes the husband is not acting in accordance with the patient's wishes, she may apply to the Consent and Capacity Board."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A surgeon is about to operate on a patient who consented to a 'laparoscopic cholecystectomy.' During the operation, the laparoscopic approach is technically impossible due to severe adhesions, and the surgeon converts to an open cholecystectomy. The patient wakes up with a large midline incision. Which statement is MOST accurate?\n\nA) The surgeon committed assault — open surgery was not consented to\nB) This represents lawful conversion — the surgeon faced intraoperative circumstances requiring a change in surgical approach to complete the originally consented therapeutic goal, and a reasonable patient would have authorized the conversion\nC) The surgeon should have woken the patient and re-consented for open surgery\nD) This is only lawful if the patient specifically signed an 'open conversion' clause\nE) The surgeon is liable for the cosmetic sequelae of the larger incision"
    back: "B) This represents lawful conversion — the surgeon faced intraoperative circumstances requiring a change in surgical approach to complete the originally consented therapeutic goal, and a reasonable patient would have authorized the conversion\n\nIntraoperative conversion from laparoscopic to open surgery is a recognized scenario addressed in surgical consent discussions. In GENERAL, consent for a surgical objective (removing the gallbladder) encompasses clinically necessary variations in technique required to achieve that goal — provided: (1) the variation is necessary, (2) it was foreseeable and ideally discussed during pre-operative consent, and (3) it advances the consented therapeutic purpose. However, best practice requires discussing the possibility of conversion during the consent process. If it was not discussed and the patient had specifically refused open surgery (e.g., keloid concerns), the analysis becomes more complex."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "A physician-researcher conducts a study comparing two established surgical techniques for ACL repair. The study involves no experimental intervention — both techniques are already standard of care. Patients are randomly assigned to one technique or the other. Does this study require REB review?\n\nA) No — both procedures are standard of care, so no research oversight is needed\nB) Yes — any research involving human participants requires REB review, even if comparing established interventions, because randomization removes patient choice and the research imposes additional procedures (randomization, data collection, follow-up visits)\nC) No — only studies involving experimental drugs or devices require REB oversight\nD) No — retrospective studies are exempt, and surgical comparisons are considered quality improvement\nE) Yes, but only if outcomes differ significantly between groups"
    back: "B) Yes — any research involving human participants requires REB review, even if comparing established interventions, because randomization removes patient choice and the research imposes additional procedures (randomization, data collection, follow-up visits)\n\nUnder TCPS2, research involving human participants requires REB review regardless of whether interventions are experimental. Randomization itself is an intervention that removes the patient's autonomous choice of treatment. Additional study procedures (extra follow-up visits, data collection, questionnaires) constitute research participation beyond clinical care. The fact that both techniques are standard does not mean the research poses no risk or ethical questions — randomization, data handling, and participant burden all require review. Quality improvement (not research) may have different requirements, but an RCT clearly constitutes research."
    difficulty: hard
    tags: [Research Ethics, MCQ, Toronto Notes]
  - front: "A physician working in a remote First Nations community is asked by the Band Council to provide aggregate health data about community members to support a funding application. Individual community members have not been asked for consent. Which framework MOST applies to this request?\n\nA) PIPEDA exempts Band Council requests from individual consent requirements\nB) TCPS2 chapter 9 recognizes Indigenous community sovereignty — research/data sharing involving First Nations communities requires community-level engagement and consent alongside (not replacing) individual consent; the data should not be shared without community consent processes\nC) The physician should comply as Band Council represents collective consent\nD) Individual patient consent is the only consideration — Band Council authority is irrelevant\nE) The physician should comply if the data is de-identified at the individual level"
    back: "B) TCPS2 chapter 9 recognizes Indigenous community sovereignty — research/data sharing involving First Nations communities requires community-level engagement and consent alongside (not replacing) individual consent; the data should not be shared without community consent processes\n\nTCPS2 Chapter 9 establishes special provisions for research involving First Nations, Inuit, and Métis peoples, recognizing Indigenous COMMUNITY SOVEREIGNTY over data about their members. Key principles: (1) community engagement and consent processes (e.g., community advisory committees, Band Council approval), (2) individual consent is NOT replaced but supplemented by community consent, (3) community ownership and control of data, (4) sharing data without community process violates both individual privacy and collective rights. Even de-identified aggregate data can identify patterns about small communities. The physician should engage community leadership about a proper data governance process."
    difficulty: hard
    tags: [Special Populations, MCQ, Toronto Notes]
  - front: "A physician in Ontario is treating a patient who mentions they want to sue a previous physician for negligence. The patient asks their current physician to write a letter supporting the claim, stating the previous physician 'was clearly negligent.' The current physician reviewed the previous physician's records and believes the care was substandard but has no formal expert training in that specialty. What is the appropriate response?\n\nA) Write the letter as a patient advocate\nB) Write the letter but include a disclaimer that the physician is not a specialist\nC) Explain that providing an expert opinion requires appropriate qualifications and knowledge of the relevant standard of care; the patient should be referred to an appropriately qualified expert if they wish to pursue litigation\nD) Refuse the request and discharge the patient\nE) Report the previous physician to the CPSO based on the current physician's review"
    back: "C) Explain that providing an expert opinion requires appropriate qualifications and knowledge of the relevant standard of care; the patient should be referred to an appropriately qualified expert if they wish to pursue litigation\n\nExpert opinion in medical negligence cases requires: (1) appropriate specialty knowledge, (2) familiarity with the standard of care in the relevant clinical context, and (3) an objective, evidence-based opinion. A physician writing a negligence opinion outside their competence area violates honesty and competence standards. Writing a biased advocacy letter is unprofessional. Reporting to CPSO based on a non-expert review is also inappropriate. The correct approach: explain your limitation, refer to an appropriate expert, and potentially assist the patient in locating a medicolegal expert in the relevant specialty."
    difficulty: hard
    tags: [Legal, MCQ, Toronto Notes]
  - front: "A new physician joins a group practice and notices that the clinic routinely overbills for services not rendered (upcoding). When the physician raises this with the clinic owner, the owner states, 'Everyone does it — it's just how billing works.' The physician's most appropriate action is:\n\nA) Continue working at the clinic and avoid personal billing irregularities\nB) Continue at the clinic while privately documenting irregularities for future reporting\nC) Immediately report the billing fraud to the provincial health ministry/OHIP and/or regulatory authorities, and consider whether continuing to work at the clinic implicates them in the fraud\nD) Report only to the CPSO, not to OHIP\nE) Accept the explanation that it is a common industry practice"
    back: "C) Immediately report the billing fraud to the provincial health ministry/OHIP and/or regulatory authorities, and consider whether continuing to work at the clinic implicates them in the fraud\n\nHealthcare billing fraud is a serious legal offence (Criminal Code fraud provisions + provincial health insurance fraud statutes). Continuing to work at a clinic engaged in systematic fraud — while knowing about it — risks making the physician complicit. Obligations: (1) refuse to participate personally, (2) report to the provincial health ministry (OHIP in Ontario) and/or the CPSO. Whistleblower protections may apply. The 'everyone does it' rationalization does not constitute a defense. This situation may also require legal counsel. Doing nothing is ethically and potentially legally indefensible."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "In Canada, the principle of JUSTICE in healthcare most directly relates to which foundational concept of the Canada Health Act?\n\nA) User fees should reflect the true cost of services provided\nB) Universal and equitable access to medically necessary health services based on need, not ability to pay — the prohibition on extra-billing and user charges enforces this principle\nC) Justice requires that patients bear some financial responsibility for their healthcare choices\nD) Efficiency of healthcare delivery is the primary justice concern\nE) Justice requires equal distribution of healthcare resources across all geographic regions"
    back: "B) Universal and equitable access to medically necessary health services based on need, not ability to pay — the prohibition on extra-billing and user charges enforces this principle\n\nThe Canada Health Act's prohibition on EXTRA-BILLING and USER CHARGES for insured services is a direct expression of the principle of JUSTICE — specifically, equitable access based on NEED, not on ability to pay. This prevents a two-tiered system where wealthy Canadians receive faster or better care. The CHA criteria (public administration, comprehensiveness, universality, portability, accessibility) collectively operationalize justice in Canadian healthcare. This is a foundational MCCQE1 social accountability concept."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A patient with known hepatitis C who is managed by an infectious disease specialist is referred to an orthopedic surgeon for knee arthroplasty. The surgeon informs the patient that they do not perform surgery on hepatitis C patients 'due to risk to OR staff.' The patient's Hep C is well-controlled with undetectable viral load. This refusal is MOST accurately characterized as:\n\nA) Acceptable — surgeons may exercise clinical discretion in accepting patients\nB) Potentially constituting discrimination on the basis of disability/health status under the Canadian Human Rights Act; an undetectable viral load represents minimal actual risk, and categorical refusal without clinical justification may be unjustifiable\nC) Acceptable if the surgeon documents the refusal appropriately\nD) Acceptable in all provinces except Ontario\nE) Acceptable only if the patient is referred to an equivalent surgeon within 2 weeks"
    back: "B) Potentially constituting discrimination on the basis of disability/health status under the Canadian Human Rights Act; an undetectable viral load represents minimal actual risk, and categorical refusal without clinical justification may be unjustifiable\n\nHepatitis C infection (especially with undetectable viral load) is a medical condition constituting a 'disability' under Canadian human rights legislation. Categorical refusal to operate on patients with HCV without clinical justification — particularly when the actual infection risk is minimal — may constitute discrimination based on disability under the Canadian Human Rights Act and provincial codes. Guidelines from CPSO, CMA, and CHAC affirm that HCV status alone, particularly with well-controlled disease, does not constitute adequate grounds for categorical refusal of surgical care. Surgeons must employ universal precautions for ALL patients."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "A physician is approached by a private company offering to pay $200 per completed electronic questionnaire for each patient they enroll in a product satisfaction survey about a medication the physician prescribes. The company insists this is 'market research, not a clinical study.' The physician would earn approximately $15,000 annually. Which ethical concern is PRIMARY?\n\nA) The research may expose patients to unnecessary data collection\nB) The payment creates a direct financial incentive to collect patient data and potentially influence prescribing, constituting a conflict of interest that distorts the fiduciary relationship between physician and patient\nC) The questionnaires are time-consuming and affect clinic efficiency\nD) The activity requires REB approval regardless of how it is framed\nE) The company is collecting intellectual property from the physician's practice"
    back: "B) The payment creates a direct financial incentive to collect patient data and potentially influence prescribing, constituting a conflict of interest that distorts the fiduciary relationship between physician and patient\n\nWhen 'market research' creates a $200/patient financial incentive for physician participation, it creates a clear CONFLICT OF INTEREST — the physician is financially motivated to enroll patients (and potentially prescribe the medication to generate enrollable patients). This arrangement distorts the physician-patient fiduciary relationship and is a form of industry influence on prescribing. CMA guidelines and provincial regulations prohibit receiving remuneration that could be perceived as influencing clinical decisions. Whether this is 'research' or 'market research' is largely a re-labeling strategy to avoid REB oversight. The COI concern exists regardless of the label."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A hospital implements a policy requiring all staff to report workplace violence incidents to management before contacting police. A nurse is assaulted by a patient. The hospital's policy delays police reporting by requiring internal review first. Which legal framework is this policy MOST in tension with?\n\nA) The Canada Labour Code only — no criminal law implications\nB) The Criminal Code (assaults are criminal offences), the Occupational Health and Safety Act obligations (employers must protect worker safety), and workers' rights to report crimes directly to police — a hospital policy cannot legally prevent victims from directly contacting police for a criminal matter\nC) The policy is valid under provincial hospital administration law\nD) The policy is only problematic if the assault results in serious injury\nE) CMPA guidelines on workplace violence"
    back: "B) The Criminal Code (assaults are criminal offences), the Occupational Health and Safety Act obligations (employers must protect worker safety), and workers' rights to report crimes directly to police — a hospital policy cannot legally prevent victims from directly contacting police for a criminal matter\n\nAny person has the right to directly report a criminal offence (assault) to police — no institutional policy can legally prohibit this. Workplace violence reporting policies may require parallel internal reporting but cannot substitute for or delay criminal reporting. Under the Occupational Health and Safety Act (Ontario) and equivalent provincial legislation, employers have specific obligations to protect workers from violence and to maintain a violent-incident log. A policy requiring victims to route criminal complaints through management before police is legally problematic and potentially coercive. Workers/nurses must be informed of their right to report directly to police."
    difficulty: hard
    tags: [Legal, MCQ, Toronto Notes]
  - front: "During an antenatal visit, a physician suspects a pregnant patient is experiencing intimate partner violence (IPV). The patient denies abuse when asked directly but exhibits multiple warning signs. Which approach is MOST evidence-based and ethically appropriate?\n\nA) Do not ask again — respecting the patient's denial is paramount\nB) Mandate a social work consultation before further questioning\nC) Express concern non-judgmentally, provide safety information and resources regardless of disclosure, use a validated screening tool (e.g., HITS), ensure private access (without partner present), and document carefully — universal precautions for IPV in pregnancy\nD) Report to CAS immediately as the fetus may be in danger\nE) Only screen for IPV if obstetric complications are present"
    back: "C) Express concern non-judgmentally, provide safety information and resources regardless of disclosure, use a validated screening tool (e.g., HITS), ensure private access (without partner present), and document carefully — universal precautions for IPV in pregnancy\n\nBest practices for IPV screening in pregnancy (Canadian guidelines, SOGC, CPSA): (1) UNIVERSAL PRECAUTIONS — offer safety information and resources to all patients, not just those who disclose; (2) screen privately, without partner present; (3) use validated tools (HITS, E-HITS); (4) non-judgmental, trauma-informed approach; (5) document carefully; (6) respect the patient's autonomy in disclosure — do not pressure; (7) report to CAS only if CHILDREN are at risk (the unborn fetus has complex legal status — generally not reportable pre-birth in most provinces, though provincial law varies). Universal precautions mean resources are offered REGARDLESS of disclosure."
    difficulty: hard
    tags: [Special Populations, MCQ, Toronto Notes]
  - front: "A Canadian medical school develops a partnership with a wealthy donor who conditions their $10 million donation on the medical school establishing a chair in 'integrative medicine' that includes teaching homeopathy and naturopathy as clinical interventions. The medical school's curriculum committee must decide. Which principle is MOST relevant to their deliberation?\n\nA) The donor's financial contribution creates a binding obligation to implement their request\nB) Academic freedom and scientific integrity: the medical school must not allow donor interests to compromise evidence-based curricula — teaching therapies without scientific evidence as clinical interventions violates medical education standards\nC) The school should implement the chair and allow students to decide which therapies to adopt\nD) The LCME/CACMS accreditation standards may be inconvenient but can be managed\nE) The donation should be accepted with modifications to be negotiated later"
    back: "B) Academic freedom and scientific integrity: the medical school must not allow donor interests to compromise evidence-based curricula — teaching therapies without scientific evidence as clinical interventions violates medical education standards\n\nMedical school curricula must be grounded in SCIENTIFIC EVIDENCE and must not be distorted by donor preferences, commercial interests, or non-evidence-based influences. Teaching homeopathy as a clinical intervention (a therapy without scientific evidence) would violate medical education accreditation standards (CACMS/LCME) and scientific integrity. The CACMS standard explicitly requires that medical education be grounded in contemporary biomedical and clinical sciences. Accepting a donation with conditions that require teaching non-evidence-based therapies as clinical practice creates an unacceptable academic conflict of interest. Donations can be accepted with donor intent respected without compromising curriculum standards."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "A family physician receives a patient with complex multimorbidity requiring subspecialty care. All relevant subspecialists in the region have wait times of 6-18 months. The patient's condition is deteriorating. The physician has provided optimal primary care management. Which ethical principle is MOST relevant and what is the appropriate physician response?\n\nA) Justice — the physician should accept the wait time and move on\nB) The physician faces a systems-level justice failure; appropriate responses include: advocacy for the patient to reduce wait times, escalation to urgent/emergent pathways if clinically indicated, documentation of the system failure, and engagement in systemic advocacy — individual physicians are not ethically responsible for health system failures but are obligated to advocate within the system\nC) Non-maleficence — the physician should avoid additional interventions that might cause harm while waiting\nD) Beneficence — the physician should provide specialist care outside their scope of practice\nE) The physician should refer the patient to a private specialty clinic to resolve the access issue"
    back: "B) The physician faces a systems-level justice failure; appropriate responses include: advocacy for the patient to reduce wait times, escalation to urgent/emergent pathways if clinically indicated, documentation of the system failure, and engagement in systemic advocacy — individual physicians are not ethically responsible for health system failures but are obligated to advocate within the system\n\nThis question tests the JUSTICE principle at a SYSTEMS LEVEL — inadequate access to specialty care is a structural injustice, not an individual failure. The physician's individual obligations: (1) optimize primary care management, (2) use urgent/emergent channels if clinically appropriate, (3) document and communicate barriers in the chart, (4) advocate on behalf of the patient to expedite access, (5) engage in broader systems advocacy (medical associations, quality committees). Physicians are NOT obligated to practice outside their scope to compensate for system failures, nor should they refer to private clinics to circumvent the public system."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A physician asks a medical student to obtain informed consent for a procedure the student has never performed and will not be performing. The attending physician will perform the procedure. Is this practice appropriate?\n\nA) Yes — consent-taking is a communication skill all trainees should practice regardless of who performs the procedure\nB) Yes, but only if the student is directly supervised by the attending during the consent discussion\nC) No — the person obtaining informed consent must be capable of answering technical questions about the procedure, including risks, benefits, and alternatives; a student who cannot answer those questions should not be delegated to obtain consent for complex procedures\nD) Yes, if the consent form is subsequently countersigned by the attending physician\nE) This is acceptable practice in all Canadian teaching hospitals under educational regulations"
    back: "C) No — the person obtaining informed consent must be capable of answering technical questions about the procedure, including risks, benefits, and alternatives; a student who cannot answer those questions should not be delegated to obtain consent for complex procedures\n\nInformed consent must be obtained by someone who: (1) understands the procedure, (2) can answer patient questions about risks, benefits, and alternatives, and (3) can address the patient's specific concerns. Delegating consent-taking to a student who cannot fulfill these responsibilities is inappropriate — it produces a procedural appearance of consent without the substance of informedness. In teaching hospitals, trainees may participate in consent discussions under supervision, but the attending must ensure the patient is genuinely informed. The CPSO explicitly holds the performing physician responsible for ensuring valid informed consent is obtained."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "An elderly patient with mild cognitive impairment lives alone and is at risk of self-neglect (not eating properly, not taking medications, home is unsafe). His family wants him placed in a nursing home. He clearly and consistently refuses. He has mild, not severe, cognitive impairment and can articulate reasons for his preference ('this is my home; I would rather die here than in a facility'). What ethical principle is MOST central?\n\nA) Beneficence — the family and physician must protect him from harm\nB) Respect for autonomy — a mildly cognitively impaired person may retain capacity to make lifestyle decisions, including the right to make choices others consider unwise; capacity (not cognitive diagnosis) determines decision-making rights\nC) Non-maleficence — all risks of self-neglect must be eliminated\nD) Justice — scarce long-term care beds should be allocated to those who want them\nE) The physician should defer entirely to the family as they are acting in his best interest"
    back: "B) Respect for autonomy — a mildly cognitively impaired person may retain capacity to make lifestyle decisions, including the right to make choices others consider unwise; capacity (not cognitive diagnosis) determines decision-making rights\n\nThis is a classic AUTONOMY vs. BENEFICENCE tension in the care of older adults. Mild cognitive impairment does NOT automatically negate decision-making capacity. A person's right to make choices that carry personal risk — including the risk of self-neglect — is protected as long as they have capacity to understand the risks and consequences. The physician's role: (1) assess capacity (decision-specific), (2) if capable, respect his choice, (3) put in place supports to minimize risk (meals-on-wheels, home care, medication delivery) with his consent, (4) monitor and reassess. Involuntary placement of a capable adult against their will is unlawful."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A patient asks their physician to document 'depression' as the primary diagnosis on their OHIP billing because 'hypertension gives insurance companies the right to deny coverage.' The physician knows the patient does NOT have depression. What is this request?\n\nA) A minor administrative accommodation the physician can make\nB) Fraud — intentional misrepresentation on a health record and insurance document, which violates the physician's duty of honesty, OHIP billing regulations, and constitutes a false record\nC) Acceptable if the patient signs a liability waiver\nD) A legitimate patient advocacy role within the physician's discretion\nE) Acceptable if the physician adds a disclaimer to the chart"
    back: "B) Fraud — intentional misrepresentation on a health record and insurance document, which violates the physician's duty of honesty, OHIP billing regulations, and constitutes a false record\n\nRecording a false diagnosis on a medical record or billing document is FRAUD — regardless of patient motivation or sympathy for their circumstances. Specific violations: (1) false billing to OHIP (provincial fraud); (2) providing false information to an insurance company; (3) falsifying medical records; (4) breach of professional obligations of honesty (CPSO). The physician cannot accommodate this request. The physician should explain why they cannot comply and offer to document the true clinical picture accurately. This is a bright-line professional obligation with no room for discretion."
    difficulty: hard
    tags: [Legal, MCQ, Toronto Notes]
  - front: "A medical team requests an ethics consultation for a patient whose care plan is being influenced by the patient's deeply held religious beliefs that are preventing them from accepting a blood transfusion. The patient is capable. The ethics consultant's role in this situation is to:\n\nA) Determine whether the patient's religious beliefs are sincere enough to be respected\nB) Identify a strategy to override the patient's religious refusal in a way that avoids legal liability\nC) Support the clinical team in understanding the ethical and legal framework for respecting a capable patient's autonomous religious refusal, explore whether alternative treatments exist, and help the team provide excellent supportive care within the patient's stated values\nD) Attempt to change the patient's religious beliefs through counselling\nE) Report the case to the CPSO as a potential refusal of treatment"
    back: "C) Support the clinical team in understanding the ethical and legal framework for respecting a capable patient's autonomous religious refusal, explore whether alternative treatments exist, and help the team provide excellent supportive care within the patient's stated values\n\nA capable patient's religious refusal of blood transfusion is LEGALLY and ETHICALLY binding — Malette v. Shulman (1990) established this clearly in Canadian law. The ethics consultant does NOT have a role in 'sincerity testing' beliefs or finding workarounds. The consultant's role: (1) confirm capacity assessment, (2) clarify legal and ethical framework for the team, (3) support exploration of alternatives (cell salvage, erythropoietin, etc.), (4) help the team provide excellent care within the patient's values, (5) support the team emotionally in a difficult situation. The capable patient's wishes must be respected regardless of outcome."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A hospital CEO asks a physician to serve on a committee evaluating whether to purchase a new CT scanner from a vendor. The CEO mentions the vendor donated $500,000 to the hospital foundation last year. The physician serves on the committee without disclosing their personal advisory relationship with the vendor (they receive an honorarium for speaking at the vendor's events). Which governance principle is MOST violated?\n\nA) Conflict of interest disclosure — the physician should have disclosed their financial relationship with the vendor to the committee before participating\nB) Non-maleficence — the CT scanner may cause radiation harm\nC) Justice — hospital resources should be allocated without commercial influence\nD) The physician's role violates the Regulated Health Professions Act\nE) Beneficence — the committee should always choose the best technology"
    back: "A) Conflict of interest disclosure — the physician should have disclosed their financial relationship with the vendor to the committee before participating\n\nCONFLICT OF INTEREST DISCLOSURE is the foundational governance principle here. Committee members with financial relationships with vendors under evaluation have a COI that must be DISCLOSED and managed (typically by recusal from the decision). Non-disclosure is a serious governance breach. Both the vendor donation to the foundation AND the physician's personal honoraria relationship create potential conflicts. Governance standards for hospital procurement committees require disclosure of all material relationships. Failure to disclose may also violate the hospital's bylaws and the physician's professional obligations."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "Under the Ontario Health Care Consent Act (HCCA), which statement about the hierarchy of substitute decision-makers is MOST accurate when a patient lacks both a designated POA for Personal Care and a court-appointed guardian?\n\nA) The attending physician assumes SDM authority\nB) The SDM hierarchy proceeds as: spouse/partner → child (16+) → parent → sibling → other relative → public guardian — the highest ranked available and willing person who meets the qualifications acts as SDM\nC) Any adult family member may act as SDM without ranking\nD) The SDM hierarchy only applies to palliative care decisions\nE) Provincial courts must appoint a guardian before any treatment decisions can be made"
    back: "B) The SDM hierarchy proceeds as: spouse/partner → child (16+) → parent → sibling → other relative → public guardian — the highest ranked available and willing person who meets the qualifications acts as SDM\n\nOntario's Health Care Consent Act (HCCA) s.20 establishes a specific SDM HIERARCHY for patients without a POA for Personal Care or court-appointed guardian: (1) guardian of the person, (2) attorney for personal care, (3) representative appointed by CCB, (4) SPOUSE or PARTNER, (5) child (16+) or parent, (6) parent with right of access, (7) sibling, (8) any other relative, (9) Office of the Public Guardian and Trustee. Qualifications for SDMs: must be capable, 16+, not prohibited by court, willing to assume role. The OPGT acts as last resort. Physicians do NOT become SDMs. This hierarchy is heavily tested on MCCQE1."
    difficulty: hard
    tags: [Legal, MCQ, Toronto Notes]
  - front: "A physician treats a patient who is a sex worker. The physician internally holds a moral judgment about the patient's profession. The patient presents for routine STI screening. Which principle guides the physician's obligations?\n\nA) The physician may refuse care based on personal moral objections to the patient's profession\nB) Non-judgmental care is a foundational principle: the physician must provide equitable, respectful healthcare to all patients regardless of personal moral views about their profession, lifestyle, or choices\nC) The physician should refer to another provider to avoid personal discomfort\nD) The physician may disclose the patient's profession to public health authorities\nE) The physician may charge higher fees to offset the increased STI risk"
    back: "B) Non-judgmental care is a foundational principle: the physician must provide equitable, respectful healthcare to all patients regardless of personal moral views about their profession, lifestyle, or choices\n\nPhysicians have a professional obligation to provide NON-DISCRIMINATORY, non-judgmental care to all patients regardless of personal moral views. The Canadian Human Rights Act prohibits discrimination on various grounds, and professional codes explicitly prohibit withholding care based on moral disapproval of a patient's lawful occupation. In fact, sex workers are a vulnerable population who already face significant barriers to healthcare — stigmatizing attitudes by healthcare providers compound these barriers. The physician must recognize their own bias, manage it, and provide the same quality of care they would provide to any patient. Disclosure of occupation to public health authorities is not appropriate without clinical justification."
    difficulty: hard
    tags: [Ethics, MCQ, Toronto Notes]
  - front: "A physician is asked by a patient for a medical procedure the physician believes is not indicated but carries low risk and the patient desires for personal reasons. The patient is fully informed and has decision-making capacity. Examples might include a low-risk elective genetic test or a low-risk screening test outside guidelines. Which framework applies?\n\nA) The physician must always refuse non-indicated procedures\nB) The physician must always comply with all patient requests\nC) The physician must balance patient autonomy with professional integrity — they may decline procedures they believe are not clinically indicated, but must explain the reasoning, not dismiss the request, and ensure the patient can access the procedure through another provider if they wish\nD) The physician should charge the patient for non-insured services and comply\nE) Only procedures covered by provincial insurance may be offered"
    back: "C) The physician must balance patient autonomy with professional integrity — they may decline procedures they believe are not clinically indicated, but must explain the reasoning, not dismiss the request, and ensure the patient can access the procedure through another provider if they wish\n\nPatients may request interventions not in standard guidelines. The physician's obligations: (1) engage seriously with the request, (2) provide an honest professional assessment, (3) explain why the procedure is not recommended if they believe it's not indicated, (4) respect that the patient may still want it, (5) either proceed if they can do so with professional integrity, OR decline and facilitate access to another provider. Physicians are NOT obligated to provide procedures they believe are not indicated — but they cannot abandon the patient. This is the autonomy-beneficence-non-maleficence triangle in routine practice."
    difficulty: hard
    tags: [Informed Consent, MCQ, Toronto Notes]
  - front: "A first-generation Canadian patient who speaks limited English requires complex surgical consent. A bilingual family member offers to interpret. The hospital has professional medical interpreter services available. What is the MOST appropriate approach?\n\nA) Use the family member as interpreter as it is more time-efficient\nB) Use the family member if the patient prefers this approach exclusively\nC) Strongly recommend and provide professional medical interpreter services — family member interpretation risks omissions, emotional filtering, distorted disclosure, and confidentiality breach; it may invalidate informed consent if material information is not accurately conveyed\nD) Use the bilingual family member and have them sign a form confirming accurate interpretation\nE) No interpreter is needed if consent forms are translated into the patient's language"
    back: "C) Strongly recommend and provide professional medical interpreter services — family member interpretation risks omissions, emotional filtering, distorted disclosure, and confidentiality breach; it may invalidate informed consent if material information is not accurately conveyed\n\nProfessional medical interpretation is the STANDARD OF CARE for informed consent with language-discordant patients. Risks of family member interpretation: (1) patient may withhold sensitive information from family, (2) family member may editorialize, filter, or simplify information based on emotional investment, (3) family members lack medical terminology competence, (4) confidentiality may be breached. Patient preference for a family member interpreter should be explored but professional services must be offered and made available. Use of an untrained family interpreter for complex consent is a medicolegal risk and may constitute a barrier to equitable care. CPSO guidelines support this."
    difficulty: hard
    tags: [Organizational, MCQ, Toronto Notes]
  - front: "TRC Call to Action #22 calls for recognition of the value of what practices within the Canadian healthcare system?"
    back: "Aboriginal healing practices, and the use of these practices in the treatment of Aboriginal patients, in collaboration with Aboriginal healers and Elders, where requested by Aboriginal patients.\n\nCall to Action #22 mandates that the Canadian healthcare system integrate Traditional healing when patients request it. This requires physicians to respect and facilitate access to Traditional healers, ceremonies, and medicines alongside Western medical treatments. Several Canadian hospitals, including Sioux Lookout Meno Ya Win Health Centre, have implemented healing rooms."
    difficulty: medium
    tags: [TRC, traditional-healing, calls-to-action, Indigenous-health]
  - front: "TRC Call to Action #23 addresses healthcare professional education. What does it require medical and nursing schools to do?"
    back: "Require all students to take a course on Aboriginal health issues, including the history and legacy of residential schools, the United Nations Declaration on the Rights of Indigenous Peoples (UNDRIP), Treaties and Aboriginal rights, and Indigenous teachings and practices.\n\nCall to Action #23 has prompted Canadian medical schools to integrate Indigenous health curricula. The Association of Faculties of Medicine of Canada (AFMC) has developed competency frameworks to support this. It ensures future physicians understand the historical context driving Indigenous health disparities."
    difficulty: easy
    tags: [TRC, medical-education, calls-to-action, Indigenous-health]
  - front: "Define cultural safety and explain how it differs from cultural competence in the context of Canadian Indigenous healthcare."
    back: "Cultural safety is defined by the recipient of care — the patient determines whether their encounter was culturally safe. It requires practitioners to examine their own biases, power imbalances, and institutional racism. Cultural competence focuses on the provider learning about other cultures, which can lead to stereotyping. Cultural safety shifts the focus from knowledge about cultures to self-reflection and systemic change.\n\nCultural safety originated from Maori nursing scholar Irihapeti Ramsden in New Zealand and has been adopted by Canadian organizations including the First Nations Health Authority (FNHA) in BC. The Indigenous Physicians Association of Canada emphasizes that cultural safety goes beyond awareness or sensitivity by addressing power differentials and institutional structures that perpetuate health inequities."
    difficulty: hard
    tags: [cultural-safety, cultural-competence, Indigenous-health, healthcare-ethics]
  - front: "A physician dismisses an Indigenous patient's request for a Traditional healer visit during their hospitalization, stating 'we practice evidence-based medicine here.' Which concept does this scenario best illustrate, and what is the appropriate response?"
    back: "This illustrates a culturally unsafe practice and Indigenous-specific racism. The appropriate response is to facilitate the Traditional healer visit per TRC Call to Action #22 and the patient's right to culturally safe care. Traditional healing and Western medicine are not mutually exclusive.\n\nDismissing Traditional healing reflects epistemic racism — the assumption that Western biomedical knowledge is the only valid knowledge system. Canadian healthcare institutions are increasingly required to accommodate Traditional healing practices. The FNHA's cultural safety framework explicitly requires healthcare providers to respect Indigenous healing traditions."
    difficulty: hard
    tags: [cultural-safety, traditional-healing, Indigenous-racism, clinical-scenario]
  - front: "A 62-year-old residential school survivor presents with chronic pain, insomnia, hypervigilance, and avoidance of healthcare settings. What approach to care is most appropriate?"
    back: "Trauma-informed care: recognize the impact of residential school trauma, establish safety and trust, offer patient control over the clinical encounter, avoid retraumatization (e.g., explain all procedures, ask permission for physical examination), screen for PTSD, and offer culturally appropriate mental health supports including access to the Indian Residential Schools Resolution Health Support Program.\n\nOver 150,000 Indigenous children attended residential schools in Canada, and survivors have elevated rates of PTSD, depression, substance use disorders, and chronic pain. The Indian Residential Schools Resolution Health Support Program (1-866-925-4419) provides crisis counselling for survivors. Trauma-informed care principles — safety, trustworthiness, choice, collaboration, and empowerment — are essential."
    difficulty: hard
    tags: [trauma-informed-care, residential-schools, PTSD, Indigenous-health, mental-health]
  - front: "How should a physician approach integrating Traditional Indigenous healing practices with Western medical treatment?"
    back: "Respectfully ask the patient if they use Traditional medicines or healing practices; do not assume based on appearance. If yes, document with permission, check for potential interactions with prescribed treatments, facilitate access to Traditional healers if requested, and never dismiss or discourage Traditional healing. Obtain guidance from community Elders or cultural liaisons when uncertain.\n\nTRC Call to Action #22 mandates recognition of Traditional healing in the Canadian healthcare system. Many hospitals in Canada now have cultural liaison workers and healing rooms. Traditional practices may include smudging (burning sage, sweetgrass, cedar, or tobacco), sweat lodge ceremonies, and herbal medicines. Some Traditional medicines may interact with pharmaceuticals, so respectful inquiry is clinically important."
    difficulty: medium
    tags: [traditional-healing, cultural-safety, clinical-practice, Indigenous-health]
  - front: "What is the Canadian government's duty to consult, and how does UNDRIP (United Nations Declaration on the Rights of Indigenous Peoples) relate to healthcare?"
    back: "The duty to consult is a constitutional obligation (Section 35, Constitution Act 1982) requiring the Crown to consult and accommodate Indigenous peoples when government actions may affect their Aboriginal or Treaty rights. UNDRIP, adopted into Canadian law via the UNDRIP Act (2021), affirms Indigenous peoples' right to their traditional medicines, health practices, and the highest attainable standard of health.\n\nUNDRIP Article 24 specifically addresses the right to traditional medicines and health practices. Canada's UNDRIP Act (Bill C-15, 2021) requires federal laws to be consistent with UNDRIP. For healthcare, this means Indigenous communities must be meaningfully consulted on health policies affecting them, and their right to self-determination in health governance must be respected."
    difficulty: hard
    tags: [UNDRIP, duty-to-consult, health-policy, Indigenous-rights, constitutional-law]
  - front: "The National Inquiry into Missing and Murdered Indigenous Women and Girls (MMIWG) concluded that the violence amounts to what, and what is a key healthcare-related finding?"
    back: "The National Inquiry concluded that the violence constitutes genocide. Key healthcare-related findings include that Indigenous women and girls face racism and discrimination when accessing healthcare, are dismissed or undertreated for pain and acute conditions, face barriers to reporting violence, and experience disproportionate rates of forced or coerced sterilization.\n\nThe 2019 MMIWG Final Report documented systemic causes of violence including colonial structures, institutional racism in healthcare, and failures of the justice system. The Report's 231 Calls for Justice include healthcare-specific recommendations. The forced sterilization of Indigenous women, documented as recently as 2018 in Saskatchewan, exemplifies how healthcare systems perpetuate colonial violence."
    difficulty: hard
    tags: [MMIWG, genocide, forced-sterilization, Indigenous-women, healthcare-racism]
  - front: "What is Indigenous-specific racism in healthcare, and what Canadian case exemplifies its lethal consequences?"
    back: "Indigenous-specific racism in healthcare includes stereotyping (assuming substance use), dismissal of symptoms, undertreating pain, providing substandard care, and making racist comments. The death of Joyce Echaquan in 2020, a Atikamekw woman who livestreamed staff making racist and derogatory comments as she was dying in a Joliette, Quebec hospital, is a prominent example.\n\nJoyce Echaquan's death led to the creation of Joyce's Principle, which demands the right to equitable access to health and social services without discrimination, and the right to the highest attainable standard of health. The coroner's inquiry ruled that racism contributed to her death. The In Plain Sight report (2020, BC) also documented widespread Indigenous-specific racism in the BC healthcare system."
    difficulty: hard
    tags: [Indigenous-racism, Joyce-Echaquan, cultural-safety, healthcare-equity, Joyces-Principle]
  - front: "What are key principles of culturally safe communication when providing care to Indigenous patients in Canada?"
    back: "Key principles include: acknowledge the historical context affecting trust in healthcare; avoid assumptions about identity, culture, or lifestyle; use respectful, non-judgmental language; allow adequate time (do not rush encounters); recognize that silence may indicate thoughtfulness, not disengagement; involve family/community as the patient wishes; ask about preferred name and pronouns; and ask permission before physical examination.\n\nThe FNHA and IPAC (Indigenous Physicians Association of Canada) emphasize that culturally safe communication requires ongoing self-reflection about one's own biases and power. The San'yas Indigenous Cultural Safety Training program, developed in BC, is widely used across Canadian health authorities. Communication must be individualized — not all Indigenous patients share the same cultural practices or preferences."
    difficulty: medium
    tags: [cultural-safety, communication, clinical-skills, Indigenous-health]
  - front: "A medical student says, 'I learned about Indigenous cultural practices so I am now culturally competent to treat Indigenous patients.' What is the critical flaw in this reasoning, and what framework should replace it?"
    back: "The critical flaw is that cultural competence implies a finite endpoint of knowledge acquisition and risks stereotyping by assuming all Indigenous patients share the same practices. Cultural safety is the appropriate framework — it is ongoing, requires self-reflection on one's own biases and privilege, examines power imbalances in the clinical encounter, and is ultimately defined by the patient, not the provider.\n\nCultural safety evolved through a continuum: cultural awareness → cultural sensitivity → cultural competence → cultural safety. The key distinction is that cultural safety addresses systemic and institutional power dynamics, not just individual knowledge. The RCPSC (Royal College) and CFPC (College of Family Physicians of Canada) now embed cultural safety in CanMEDS and competency frameworks for Canadian physicians."
    difficulty: hard
    tags: [cultural-safety, cultural-competence, medical-education, self-reflection, Indigenous-health]
  - front: "What is the SPIKES protocol for breaking bad news?"
    back: "Setting, Perception, Invitation, Knowledge, Emotions, Strategy/Summary\n\nEvidence-based framework. Assess patient understanding first, ask permission to share information, respond to emotions with empathy before discussing plan."
    difficulty: medium
    tags: [communication, SPIKES]
  - front: "What is the duty of candour after a medical error?"
    back: "Obligation to disclose harmful incidents to patients/families honestly and promptly. Includes: what happened, consequences, what is being done to mitigate harm, systemic changes to prevent recurrence\n\nCPSO policy. Apology legislation in Canada protects apologies from being used as admission of liability. Disclosure is ethical obligation regardless of legal implications."
    difficulty: medium
    tags: [professionalism, disclosure]
  - front: "What is shared decision-making and when is it most important?"
    back: "Collaborative process where clinician shares evidence on options/outcomes and patient shares values/preferences to reach a joint decision. Critical for: screening, preference-sensitive decisions, goals of care\n\nDecision aids improve patient knowledge and reduce decisional conflict. Examples: PSA screening, cancer treatment options, end-of-life care. Not appropriate for emergencies requiring immediate action."
    difficulty: medium
    tags: [shared decision-making]
  - front: "A patient files a complaint against you with the College of Physicians and Surgeons of Ontario (CPSO). What is the first step in the CPSO complaints process?"
    back: "The complaint is acknowledged and forwarded to the physician, who must provide a written response within 30 days. The Inquiries, Complaints and Reports Committee (ICRC) then reviews the complaint and response to determine next steps.\n\nIn Ontario, the Regulated Health Professions Act (RHPA) governs the complaints process through the ICRC. Possible outcomes range from no action, to a caution, to referral to the Discipline Committee. Physicians should contact the CMPA immediately upon receiving a complaint for medico-legal support."
    difficulty: medium
    tags: [CPSO, complaints-process, professionalism, CMPA, regulation]
  - front: "Under Canadian law, which conditions require mandatory reporting by a physician, even if it means breaching patient confidentiality?"
    back: "Mandatory reporting obligations include: child abuse or neglect (to Children's Aid Society), certain communicable diseases (to public health), patients unfit to drive (varies by province; mandatory in some like Ontario), gunshot wounds (in most provinces), and suspected elder abuse (varies by jurisdiction).\n\nMandatory reporting duties override physician-patient confidentiality under specific provincial and federal statutes. In Ontario, the Child, Youth and Family Services Act mandates reporting suspected child maltreatment. Failure to report can result in regulatory discipline and, in the case of child abuse, potential criminal liability."
    difficulty: medium
    tags: [mandatory-reporting, confidentiality, professionalism, child-abuse, public-health]
  - front: "You suspect a colleague is practising medicine while impaired by alcohol. What is your professional obligation in Canada?"
    back: "You have a duty to report the colleague to the appropriate regulatory body (e.g., provincial College of Physicians and Surgeons). Most provincial Colleges also have Physician Health Programs that provide confidential support. The duty to report exists regardless of your relationship with the colleague.\n\nThe CMA Code of Ethics and provincial regulatory frameworks mandate that physicians report colleagues whose fitness to practise may be impaired. Provincial Physician Health Programs (e.g., the Ontario Physician Health Program) offer non-punitive pathways for impaired physicians to receive treatment while protecting patient safety."
    difficulty: medium
    tags: [impaired-colleague, duty-to-report, professionalism, physician-health]
  - front: "A grateful patient offers you a $200 gift card after a successful surgery. How should you handle this situation according to Canadian professional guidelines?"
    back: "You should generally decline the gift. Accepting gifts of significant monetary value can create a sense of obligation and blur professional boundaries. If declining would harm the therapeutic relationship, a token gift of minimal value may be acceptable but should be documented.\n\nThe CMA Code of Ethics and CPSO Professional Obligations and Human Rights policy advise physicians to avoid accepting gifts that could influence clinical judgment or create perceived obligations. The CMPA recommends documenting any gift interaction. Cultural sensitivity is important, as some patients offer gifts as cultural practice."
    difficulty: easy
    tags: [boundaries, gifts, professionalism, CMA-ethics]
  - front: "A physician posts a de-identified but recognizable clinical case on social media for educational purposes. What are the professional and legal risks?"
    back: "Even de-identified cases may be recognizable and violate patient privacy under PIPEDA and provincial health privacy legislation (e.g., PHIPA in Ontario). Risks include regulatory complaints, civil liability, loss of patient trust, and potential College discipline.\n\nThe CMA Social Media Guidelines and CMPA resources emphasize that social media posts can breach privacy even when direct identifiers are removed. Combinations of clinical details may render a patient identifiable. Physicians should obtain explicit written consent before sharing any clinical information online."
    difficulty: medium
    tags: [social-media, privacy, professionalism, PIPEDA, PHIPA]
  - front: "After a medical error, what does the 'duty of candour' require of a Canadian physician?"
    back: "The duty of candour requires the physician to promptly disclose the error to the patient, explain what happened, describe the actual and potential consequences, outline steps being taken to mitigate harm, and offer an apology. Many provinces have Apology Acts that protect apologies from being used as admissions of liability.\n\nThe CMPA, CPSI (now Healthcare Excellence Canada), and CMA all endorse transparent disclosure of medical errors. Provincial Apology Acts (e.g., Ontario's Apology Act, 2009) protect expressions of sympathy from being used as evidence of liability, encouraging open disclosure and maintaining trust."
    difficulty: hard
    tags: [medical-error, duty-of-candour, disclosure, apology-act, patient-safety]
  - front: "What is 'just culture' in the context of healthcare, and how does it differ from a blame culture?"
    back: "Just culture distinguishes between human error (consoled), at-risk behaviour (coached), and reckless behaviour (disciplined). It focuses on system-level factors contributing to errors rather than solely blaming individuals, while still holding individuals accountable for intentional reckless conduct.\n\nHealthcare Excellence Canada (formerly CPSI) promotes just culture as fundamental to patient safety. Unlike a blame culture that punishes all errors regardless of intent, just culture recognizes that most medical errors arise from system failures. This approach encourages error reporting, enabling organizations to identify and fix systemic vulnerabilities."
    difficulty: medium
    tags: [just-culture, patient-safety, professionalism, error-management]
  - front: "A pharmaceutical company invites you to an all-expenses-paid conference at a resort. What are the conflict of interest concerns under Canadian guidelines?"
    back: "Accepting may create a perceived or real conflict of interest. The CMA Guidelines for Physicians in Interactions with Industry state that physicians should not accept personal gifts or hospitality of more than minimal value, and educational events should be in appropriate settings with transparent funding.\n\nThe CMA's Guidelines for Physicians in Interactions with Industry and Innovative Medicines Canada's Code of Ethical Practices restrict pharmaceutical company hospitality. Accepting lavish hospitality can create implicit reciprocity obligations that bias prescribing. Continuing medical education should be needs-based and accredited independently of industry influence."
    difficulty: easy
    tags: [conflict-of-interest, pharma-industry, professionalism, CMA-guidelines]
  - front: "What is the role of the CMPA (Canadian Medical Protective Association) in the Canadian medical regulatory system?"
    back: "The CMPA provides medico-legal protection and liability coverage to its physician members. It assists with legal defence in malpractice suits, provides guidance on complaints processes, offers risk management education, and compensates patients when negligence is established. It is a mutual defence organization, not an insurance company.\n\nThe CMPA is unique globally as a physician-owned mutual defence organization rather than a commercial insurer. It covers over 100,000 Canadian physicians and is funded by member fees, which are partially reimbursed by provincial governments. Understanding the CMPA's role is essential for navigating the Canadian medico-legal landscape."
    difficulty: easy
    tags: [CMPA, medico-legal, professionalism, self-regulation]
  - front: "How does professional self-regulation work in Canadian medicine, and what is the 'social contract' underlying it?"
    back: "In Canada, each province/territory has a College of Physicians and Surgeons that regulates physicians. The social contract grants the profession autonomy to set standards, credential members, and discipline practitioners, in exchange for prioritizing public safety and acting in the public interest rather than professional self-interest.\n\nSelf-regulation is a privilege granted by provincial legislatures through acts such as Ontario's RHPA. Recent controversies have led to governance reforms in several provinces, including increased public representation on College boards. The overriding principle is that the College's mandate is public protection, not advocacy for physicians."
    difficulty: medium
    tags: [self-regulation, social-contract, professionalism, College-governance]
  - front: "You must inform a patient that their biopsy shows metastatic cancer. Using the SPIKES protocol, what are the six steps for breaking bad news?"
    back: "S – Setting: arrange privacy, sit down, involve significant others per patient's wishes. P – Perception: ask what the patient already knows. I – Invitation: ask how much information they want. K – Knowledge: deliver information in plain language, with warning shots. E – Emotions: respond empathetically to the patient's reaction. S – Strategy/Summary: outline next steps and plan for follow-up.\n\nThe SPIKES protocol (Buckman, 2005) is the most widely taught framework for breaking bad news in Canadian medical education. The MCCQE1 frequently tests the principle that you should assess the patient's understanding before delivering information (P step) and respond to emotion before discussing management (E step)."
    difficulty: medium
    tags: [SPIKES, breaking-bad-news, communication, CanMEDS-communicator]
  - front: "What are the four core principles of motivational interviewing (MI)?"
    back: "The four principles are: (1) Express empathy through reflective listening, (2) Develop discrepancy between current behaviour and desired goals, (3) Roll with resistance rather than confronting it, and (4) Support self-efficacy by affirming the patient's ability to change.\n\nMotivational interviewing (Miller and Rollnick) is recommended by Canadian clinical practice guidelines for behaviour change counselling, including smoking cessation and alcohol reduction. The OARS technique (Open questions, Affirmations, Reflective listening, Summarizing) operationalizes MI in clinical encounters."
    difficulty: medium
    tags: [motivational-interviewing, behaviour-change, communication, OARS, counselling]
  - front: "A patient with newly diagnosed breast cancer asks you what treatment she should get. How do you apply the shared decision-making framework?"
    back: "Shared decision-making involves: (1) Recognizing a decision needs to be made, (2) Presenting all reasonable treatment options with their risks, benefits, and evidence, (3) Exploring the patient's values, preferences, and concerns, (4) Reaching a decision together that aligns with the patient's informed preferences. Decision aids can help facilitate this process.\n\nShared decision-making is a core component of the CanMEDS Communicator role and is distinguished from both paternalistic medicine (doctor decides) and informed choice (patient decides alone). The Ottawa Decision Support Framework, developed at the Ottawa Hospital Research Institute, provides evidence-based patient decision aids used across Canada."
    difficulty: medium
    tags: [shared-decision-making, communication, patient-autonomy, decision-aids, CanMEDS]
  - front: "When working with a professional medical interpreter, what communication practices should a physician follow?"
    back: "Speak directly to the patient (not to the interpreter), use short sentences, avoid jargon and idioms, pause frequently to allow interpretation, arrange seating so interpreter is beside or slightly behind the patient, brief the interpreter beforehand on the topic, and use a professional interpreter rather than family members for sensitive or complex discussions.\n\nCanadian healthcare accreditation standards require access to professional interpreter services. Using family members as interpreters is discouraged because of confidentiality concerns, potential for omission of sensitive information, and role conflicts (especially with children interpreting for parents). Telephone and video interpretation services are increasingly available across Canadian health systems."
    difficulty: easy
    tags: [interpreter, cross-cultural, communication, language-barriers, CanMEDS]
  - front: "What are the key elements of culturally safe communication, and how does cultural safety differ from cultural competence?"
    back: "Cultural competence focuses on learning about other cultures (knowledge-based). Cultural safety shifts the focus to the practitioner's self-reflection on their own power, privilege, and biases, and how these affect the therapeutic relationship. The patient defines whether the encounter was culturally safe, not the provider.\n\nCultural safety originated in New Zealand Maori nursing and is now central to Indigenous health education in Canada. The First Nations Health Authority in BC and the AFMC have embedded cultural safety into medical curricula. It requires physicians to acknowledge colonial legacies, systemic racism, and power imbalances in healthcare."
    difficulty: medium
    tags: [cultural-safety, cultural-competence, communication, Indigenous-health, CanMEDS]
  - front: "What are the medico-legal documentation standards for a clinical encounter in Canada?"
    back: "Documentation should include: date and time, patient identification, relevant history and findings, clinical reasoning, diagnosis or differential, management plan, informed consent discussions, patient education provided, and follow-up arrangements. Entries should be legible, contemporaneous, objective, and avoid derogatory language. Late entries should be clearly identified as such.\n\nThe CMPA emphasizes that 'if it wasn't documented, it wasn't done' in medico-legal proceedings. Provincial Colleges set documentation standards, and the CMPA reports that inadequate documentation is a contributing factor in a significant proportion of medico-legal cases. Electronic medical records must meet provincial privacy legislation requirements (e.g., PHIPA)."
    difficulty: easy
    tags: [documentation, medico-legal, communication, CMPA, medical-records]
  - front: "A patient requests their complete medical record. What are their rights under Canadian privacy legislation?"
    back: "Under PIPEDA (federal) and provincial health privacy acts (e.g., PHIPA in Ontario), patients have the right to access their personal health information. Physicians must respond within 30 days, may charge a reasonable fee for copying, and can only refuse access in limited circumstances (e.g., if disclosure could result in serious harm to the patient or a third party).\n\nProvincial health privacy legislation (PHIPA in Ontario, HIA in Alberta, PHIA in Manitoba/Newfoundland) enshrines patients' right to access their health records. Physicians retain ownership of the physical record but patients own the information. The CMPA advises physicians to have clear policies for handling access requests."
    difficulty: medium
    tags: [privacy, medical-records, PHIPA, PIPEDA, patient-rights, communication]
  - front: "During a difficult conversation, a patient becomes angry and threatens to leave against medical advice (AMA). What communication strategies should you employ?"
    back: "Acknowledge the patient's emotions without judgment, use active listening and reflective statements, explore the underlying reasons for their frustration, clearly explain the risks of leaving AMA in non-threatening language, offer alternatives or compromises, document the discussion including the patient's capacity to make the decision, and ensure they know they can return.\n\nThe CMPA recommends that AMA discharges be thoroughly documented, including that the patient was informed of risks, had capacity, and was not coerced to stay. Patients who leave AMA should not be abandoned; they should receive prescriptions, follow-up instructions, and reassurance that they are welcome to return. Punitive responses increase liability risk."
    difficulty: medium
    tags: [AMA-discharge, difficult-conversations, communication, de-escalation, CMPA]
  - front: "What is 'trauma-informed communication' and when should it be applied in clinical practice?"
    back: "Trauma-informed communication recognizes that many patients have experienced trauma (e.g., abuse, violence, colonialism). Key principles include: ensuring physical and emotional safety, giving the patient control and choice, being transparent about procedures, avoiding re-traumatization, and asking permission before physical examination. It should be applied universally, not only for patients with known trauma histories.\n\nTrauma-informed care is increasingly emphasized in Canadian medical education, particularly in the context of Indigenous health (recognizing intergenerational trauma from residential schools), refugee care, and gender-based violence. The BC Provincial Mental Health and Substance Use Planning Council has published a widely-used trauma-informed practice guide."
    difficulty: medium
    tags: [trauma-informed, communication, safety, Indigenous-health, CanMEDS]
  - front: "A medical student on your team wrote a clinical note that contains inaccurate information about a patient's medication list. What is the correct approach to managing documentation errors?"
    back: "The error should be corrected using a proper addendum, not by deleting or overwriting the original entry. The addendum should clearly state the date of correction, identify the error, provide the correct information, and be signed by the correcting clinician. The original entry should remain visible (single line through for paper charts, audit trail in EMR).\n\nAltering medical records without proper documentation of changes is considered fraudulent and has serious medico-legal consequences. The CMPA strongly advises against deleting or obscuring original entries. Electronic medical records must maintain audit trails of all changes, as required by provincial privacy legislation and health records standards."
    difficulty: easy
    tags: [documentation, medical-records, communication, error-correction, medico-legal]
  - front: "What are signs of child physical abuse that should trigger reporting?"
    back: "Bruising in non-mobile infants, patterned injuries (belt/cord marks), burns in stocking-glove distribution, multiple fractures at different healing stages, retinal hemorrhages (shaken baby), inconsistent history\n\nMandatory reporting in ALL Canadian provinces when reasonable suspicion. Report to Children's Aid Society. Do not need certainty — suspicion is sufficient threshold. Document carefully with body diagrams."
    difficulty: medium
    tags: [child abuse, mandatory reporting]
  - front: "How do you screen for intimate partner violence?"
    back: "Routine screening recommended (SOGC). Tools: HITS (Hurt, Insult, Threaten, Scream), SAFE questions. Ask in private without partner present. Validate, safety plan, document, offer resources\n\n1 in 3 Canadian women experience IPV. Barriers to disclosure: fear, shame, financial dependence, immigration status. Not mandatory reporting for competent adults (vs child abuse). Document injuries objectively."
    difficulty: medium
    tags: [IPV, screening]
  - front: "What are the types of child abuse, and what physical examination findings should raise suspicion for non-accidental trauma?"
    back: "Types: physical, sexual, emotional/psychological, neglect (most common). Suspicious findings: bruises in non-mobile infants, patterned injuries (loop marks, cigarette burns), multiple fractures in different stages of healing, retinal hemorrhages (shaken baby), injuries inconsistent with developmental stage or reported mechanism.\n\nThe 'TEN-4' rule identifies concerning bruising: bruising on the Torso, Ears, or Neck in children <4 years, or any bruising in infants <4 months. Physicians in all Canadian provinces are mandated reporters — failure to report suspected child abuse is a legal offense. Documentation should include verbatim history from the caregiver and child (separately)."
    difficulty: medium
    tags: [child abuse, non-accidental injury, mandatory reporting, TEN-4 rule, physical abuse]
  - front: "What are the indicators of child neglect, and how does it differ from other forms of child maltreatment?"
    back: "Neglect: failure to meet basic needs (food, shelter, clothing, medical care, supervision, education). Indicators: failure to thrive, poor hygiene, untreated medical/dental conditions, frequent school absences, inadequate supervision for developmental age. It is the most common and often most harmful form of child maltreatment.\n\nNeglect can be harder to identify than physical abuse as it represents an absence of action rather than a harmful action. Chronic neglect causes more long-term developmental and psychological harm than acute physical abuse. Risk factors include poverty, parental substance abuse, mental illness, and social isolation. Poverty alone does not constitute neglect."
    difficulty: medium
    tags: [child neglect, failure to thrive, mandatory reporting, child maltreatment, risk factors]
  - front: "What is the legal obligation of physicians regarding suspected child abuse in Canada, and what information should be included in a report?"
    back: "All physicians are mandated reporters in every Canadian province/territory — must report reasonable suspicion (not certainty) of child abuse or neglect to child protective services. Report should include: child's identity, nature of concerns, observed injuries, child's statements, caregiver's explanation, and any previous concerns.\n\nThe threshold for reporting is 'reasonable grounds to suspect,' not proof. Failure to report is a provincial offense. Physicians are protected from liability for reports made in good faith. Parental consent is not required for reporting, and the physician should not investigate independently but should document findings and report promptly."
    difficulty: easy
    tags: [mandatory reporting, child abuse, legal obligations, child protective services, Canadian law]
  - front: "What is the HITS screening tool for intimate partner violence, and when should screening be performed?"
    back: "HITS: How often does your partner — Hurt you physically, Insult you, Threaten you, Scream at you? Each scored 1 (never) to 5 (frequently), total ≥10 suggests IPV. Screen in routine health visits, prenatal care, ED visits with suspicious injuries, and when indicators are present.\n\nIPV affects approximately 1 in 3 women and 1 in 4 men over their lifetime. Universal screening remains debated, but targeted screening at key touchpoints is widely recommended. Pregnancy is a high-risk period for IPV initiation or escalation. Always interview the patient alone, without the partner present, in a safe and confidential setting."
    difficulty: easy
    tags: [HITS, intimate partner violence, IPV screening, domestic violence, safety]
  - front: "What are the key components of safety planning for a patient experiencing intimate partner violence?"
    back: "Safety planning: identify safe places to go in emergency, pack essential documents (ID, medications, financial records), memorize emergency numbers, develop code word with trusted person, plan for children and pets, connect to shelter/crisis resources, document injuries medically, consider protection order.\n\nThe most dangerous time for a victim is when leaving or shortly after leaving the relationship. Physicians should avoid pressuring patients to leave, as this can increase danger. Instead, express concern, validate the patient's experience, provide resources, and respect their autonomy in decision-making. Lethality assessment tools help identify highest-risk situations."
    difficulty: medium
    tags: [safety planning, IPV, domestic violence, crisis resources, lethality assessment]
  - front: "How should a physician document suspected intimate partner violence in the medical record?"
    back: "Document: patient's own words (in quotes), detailed injury description (size, shape, location, color, age), body diagram or photographs (with consent), mechanism reported and whether it is consistent with injuries, patient's affect and demeanor, safety assessment, referrals made, and follow-up plan.\n\nMedical records may be used in legal proceedings, so documentation should be factual, objective, and thorough. Avoid judgmental language or opinions about truthfulness. Write 'patient states' rather than 'patient claims.' If the mechanism is inconsistent with injuries, document both the stated mechanism and the physical findings. Maintain confidentiality and avoid documenting in shared electronic portals accessible to the abuser."
    difficulty: medium
    tags: [documentation, IPV, medical-legal, injury documentation, confidentiality]
  - front: "What are the risk factors for elder financial abuse, and what signs should clinicians watch for?"
    back: "Risk factors: cognitive impairment, social isolation, dependence on caregiver, recent bereavement, unfamiliar people accompanying patient. Signs: sudden inability to pay for medications/care, unexplained changes in financial documents or wills, caregiver controlling finances, unpaid bills despite adequate resources, new 'friends' or caregivers.\n\nFinancial abuse is the most common form of elder abuse. Cognitive decline makes elders particularly vulnerable to exploitation by family members, caregivers, and strangers. Physicians can screen by asking about who manages finances, whether the patient feels their money is being used appropriately, and whether anyone has pressured them to sign documents."
    difficulty: medium
    tags: [financial abuse, elder abuse, cognitive impairment, exploitation, screening]
  - front: "What are the differences in mandatory reporting obligations for elder abuse across Canadian provinces?"
    back: "Reporting varies by province: some (e.g., Nova Scotia, Newfoundland) have mandatory reporting for all adults at risk. Others (e.g., Ontario) have mandatory reporting only in long-term care facilities. All provinces have adult protection legislation enabling investigation and intervention.\n\nUnlike child abuse, where mandatory reporting is universal across Canada, elder abuse reporting requirements differ by jurisdiction. Physicians should know their provincial legislation. Even where reporting is not mandatory, it is ethically appropriate to involve adult protective services when abuse is suspected and the patient lacks capacity to protect themselves."
    difficulty: medium
    tags: [mandatory reporting, elder abuse, provincial legislation, adult protection, Canadian law]
  - front: "A woman presents with chronic pelvic pain, depression, and multiple somatic complaints. She is accompanied by a partner who answers all questions and refuses to leave the room. What should you consider, and how should you proceed?"
    back: "Consider intimate partner violence. Proceed by: finding a reason to separate the patient from the partner (e.g., 'we need a urine sample' or 'hospital policy requires private interview'), then screen with direct empathetic questions (e.g., 'Do you feel safe at home?'), assess safety, provide resources.\n\nControlling behavior by a partner is itself a form of abuse. Somatic presentations including chronic pain, headaches, GI symptoms, and depression are common in IPV survivors. Multiple ED visits with vague complaints should raise suspicion. Never confront the suspected abuser or disclose screening results in the partner's presence, as this endangers the patient."
    difficulty: medium
    tags: [IPV, controlling behavior, screening, somatization, clinical approach]
  - front: "What types of sexual abuse in children should raise clinical suspicion, and what is the appropriate clinical response?"
    back: "Suspicious findings: genital/anal injuries without adequate explanation, STIs in prepubertal children (gonorrhea, syphilis, HIV are diagnostic), age-inappropriate sexual knowledge/behavior, recurrent UTIs, encopresis/enuresis. Response: do not perform invasive genital exam (refer to specialized center), report to CPS, consult child abuse pediatrician, provide emotional support.\n\nMost sexually abused children have a normal physical examination, so a normal exam does not rule out abuse. A child's disclosure is the most important diagnostic indicator. Forensic interviewing should be performed by trained professionals to avoid contaminating evidence. The physician's role is to report, document, ensure safety, and address immediate medical needs — not to investigate."
    difficulty: hard
    tags: [child sexual abuse, forensic examination, STI, mandatory reporting, child protection]
  - front: "What is the Emergency Rule for consent in Canadian emergency medicine?"
    back: "Consent is not required when: (1) the patient is at imminent risk from a serious injury AND (2) obtaining consent is either not possible OR would increase risk to the patient. Assumes most people would want to be saved.\n\nThe Emergency Rule is an exception to the standard requirement for informed consent. It does NOT apply when a competent patient has previously refused similar treatment, an advance directive (e.g., DNR) exists, or a capable SDM refuses on the patient's behalf."
    difficulty: medium
    tags: [consent, emergency rule, ethics, substitute decision maker]
  - front: "Under what circumstances can emergency treatment NOT be initiated despite the Emergency Rule in Canada?"
    back: "1. A competent patient previously refused the same or similar treatment and there is no evidence wishes have changed. 2. A valid advance directive (e.g., DNR order) is available. NOTE: Refusal of help in a suicide attempt is NOT an exception — care must be given.\n\nAdvance directives and prior competent refusals override the Emergency Rule. However, suicidal refusal of care does not constitute a valid exception; the emergency physician must provide treatment."
    difficulty: medium
    tags: [consent, advance directive, DNR, ethics, suicide]
  - front: "What is a 'mature minor' in the context of emergency consent for children in Canada?"
    back: "A child below the age of majority who is deemed capable of understanding the nature and consequences of treatment decisions. Such a minor can consent to or refuse treatment independently. Age cut-off varies by province.\n\nThe mature minor doctrine recognises that cognitive capacity, not chronological age, determines decision-making ability. Emancipated minors (e.g., living independently, married) are similarly granted adult consent rights."
    difficulty: medium
    tags: [consent, mature minor, pediatrics, ethics]
  - front: "What are the rights of Jehovah's Witnesses regarding blood transfusion in Canadian emergency medicine?"
    back: "Capable adult Jehovah's Witnesses have the right to refuse blood products (pRBCs, platelets, plasma, whole blood) even if life-saving. However, children cannot be refused life-saving treatment solely on religious grounds — act in the child's best interest and involve CAS immediately.\n\nCompetent refusal must be respected. The physician should clarify which specific products are refused (some accept albumin, immunoglobulins). Thorough documentation of discussions and alternatives is mandatory."
    difficulty: medium
    tags: [Jehovahs Witness, blood transfusion, consent, ethics, pediatrics]
  - front: "What is the general approach to sexual assault victims in the emergency department?"
    back: "ABCs and treat acute injuries; emotional support; obtain consent for exam, evidence collection, and police disclosure; involve sexual assault nurse examiner (SANE); document with Sexual Assault Kit if <72 h; label samples and pass directly to police; offer community resources; do not report unless victim requests OR patient is <16 years old (mandatory reporting).\n\nPhysician priority is medical treatment and clearance. Re-traumatization must be avoided — intimate exams should be deferred to SANE if available. Samples collected without chain of custody may be inadmissible in court. Interprofessional sexual assault teams improve patient care and forensic evidence collection."
    difficulty: medium
    tags: [sexual assault, SANE, forensic, consent, mandatory reporting]
  - front: "What are the key legal and access considerations regarding abortion in Canada?"
    back: "There is no current law in Canada concerning abortion. Access is provincially regulated and highly variable. Per CPSO guidelines, a physician must provide a referral for abortion services regardless of personal beliefs but is not compelled to personally perform the procedure. In Canada, 91% of induced abortions occur before 12 weeks GA.\n\nThe Supreme Court struck down abortion law in R v. Morgentaler (1988). Conscientious objection is accommodated but must not impede patient access — physicians must refer. Understanding provincial variability is important for MCCQE1 ethics and social determinants questions."
    difficulty: medium
    tags: [abortion, ethics, Canadian law, CPSO]
