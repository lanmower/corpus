# Social Determinants of Health (PublicHealth) - generated from srs-mccqe1
cards:
  - front: "What are the social determinants of health (SDOH) and how do they affect health outcomes?"
    back: "SDOH: non-medical factors influencing health — income and wealth, education, employment, housing, food security, social support, early childhood development, Indigenous status, disability, race/racism, gender — account for 30-55% of health outcomes\n\nWHO Commission on SDOH (2008): unfair distribution of SDOH is responsible for most health inequities globally. In Canada: individuals in lowest income quintile have 7-10 year lower life expectancy than highest quintile. PHAC uses SDOH framework for population health policy."
    difficulty: easy
    tags: [social determinants of health, SDOH, health inequity, public health]
  - front: "What is the health gradient and what does it demonstrate?"
    back: "Health gradient: continuous dose-response relationship between socioeconomic status and health outcomes — those at the top are healthier than those just below them, all the way down the social ladder (not just poor vs. non-poor)\n\nWhitehall studies (UK civil servants): demonstrated that even within a working, employed population, there is a continuous gradient of health — those with higher job grade had better health. Gradient reflects differential exposure to SDOH, not just absolute poverty."
    difficulty: easy
    tags: [health gradient, socioeconomic status, Whitehall study, health inequity, public health]
  - front: "What are the health disparities faced by Indigenous Peoples in Canada?"
    back: "Higher rates of: T2DM (3-5x), TB (10x), suicide (3x for First Nations adults, up to 10x for Inuit youth), infant mortality (2x), poverty, food insecurity, substance use, mental health issues; shorter life expectancy by 10-15 years\n\nPHAC and Truth and Reconciliation Commission (TRC): health disparities in Indigenous peoples are the result of colonization, residential schools, systemic racism, and ongoing socioeconomic inequities. Cultural safety and Indigenous-led health services are essential. Physicians should be aware of trauma-informed care."
    difficulty: medium
    tags: [Indigenous health, health disparities, colonization, social determinants, public health]
  - front: "What is structural racism and how does it affect healthcare?"
    back: "Structural racism: laws, policies, and institutional practices that disadvantage racialized groups — manifests in healthcare as unequal access, implicit bias, delayed diagnoses, and treatment disparities for Black, Indigenous, and other racialized peoples in Canada\n\nCMAJ (Canadian Medical Association Journal) and CMA have acknowledged systemic racism in Canadian healthcare. Examples: anti-Indigenous racism in emergency rooms (Joyce Echaquan), racial disparities in pain management, lower cancer screening rates. Antiracism training and cultural humility are required competencies."
    difficulty: medium
    tags: [structural racism, healthcare disparities, racialized populations, cultural safety, public health]
  - front: "What is food insecurity and what are its health consequences?"
    back: "Food insecurity: inadequate or uncertain access to enough food due to lack of resources; associated with: T2DM, cardiovascular disease, poor mental health, higher mortality — affects ~12% of Canadian households\n\nPHAC statistics: food insecurity is highest among Indigenous peoples (28%), racialized communities, single-parent households, low-income families. Adequate income (basic income) is more effective than food banks for addressing food insecurity. Clinical screening: Hunger Vital Sign (2-question tool)."
    difficulty: easy
    tags: [food insecurity, Hunger Vital Sign, social determinants, public health]
  - front: "What is housing insecurity and homelessness, and how does it affect health?"
    back: "Housing insecurity/homelessness: associated with increased rates of infectious disease (TB, HIV, hepatitis C), mental illness, substance use, injury, trauma, and 3-10x higher mortality than housed individuals of same age\n\nPHAC: ~235,000 Canadians experience homelessness annually. Housing First approach (Pathways to Housing): provide stable housing without prerequisites — reduces hospitalizations and emergency visits by 50%. Clinical: inquire about housing at every visit; connect with social services."
    difficulty: medium
    tags: [homelessness, housing insecurity, Housing First, public health]
  - front: "What is the adverse childhood experiences (ACEs) framework?"
    back: "ACEs: traumatic childhood experiences (abuse, neglect, household dysfunction) associated with dose-response increases in adult health risks (CVD, cancer, substance use, mental illness, premature death) — 4+ ACEs triples risk of many adverse outcomes\n\nCDC ACE study: ACEs are extremely common (64% of Americans have ≥1; 12% have ≥4) and have lifelong health consequences via toxic stress mechanisms (HPA axis dysregulation, inflammation). Trauma-informed care is a core competency for Canadian physicians. Screening: ACE questionnaire."
    difficulty: medium
    tags: [ACEs, adverse childhood experiences, toxic stress, trauma-informed care, public health]
  - front: "What is health literacy and why is it important in clinical care?"
    back: "Health literacy: ability to obtain, process, and understand health information to make informed decisions; low health literacy associated with poor adherence, more ED visits, higher mortality — affects ~55% of Canadians\n\nCanadian Institute for Health Information: health literacy varies across populations (lower in elderly, immigrants, low education). Strategies: plain language, teach-back method, pictorial instructions, avoiding medical jargon. All educational materials should be at Grade 6 reading level or lower."
    difficulty: easy
    tags: [health literacy, patient education, plain language, teach-back, public health]
  - front: "What is the Ottawa Charter for Health Promotion?"
    back: "Ottawa Charter (1986): first international conference on health promotion; 5 action areas: Build Healthy Public Policy, Create Supportive Environments, Strengthen Community Action, Develop Personal Skills, Reorient Health Services; prerequisites for health: peace, shelter, education, food, income, equity\n\nThe Ottawa Charter shifted focus from individual behavior to social determinants. Health promotion: enabling people to increase control over and improve their health. Social gradient of health recognized. Canadian contribution: Marc Lalonde report (1974) — first national health framework recognizing social determinants."
    difficulty: easy
    tags: [Ottawa Charter, health promotion, Lalonde report, social determinants, public health]
  - front: "What are the principles of cultural humility and cultural safety in Canadian healthcare?"
    back: "Cultural humility: lifelong commitment to self-reflection, learning from others, power imbalances in healthcare; Cultural safety: environment where patients feel safe to express cultural identity without judgment; goes beyond cultural competence (mastering facts about cultures) to systemic power analysis\n\nCollege of Family Physicians of Canada and Medical Council of Canada: cultural safety and humility are core competencies. Requires recognizing and addressing systemic racism, colonialism, and power differentials. Indigenous patients: duty to provide culturally safe care. Resource: Indigenous Cultural Safety Training."
    difficulty: medium
    tags: [cultural safety, cultural humility, Indigenous health, systemic racism, public health]
  - front: "What are key social determinants of health?"
    back: "Income/poverty, education, employment, housing, food security, early childhood development, social inclusion, Indigenous status, racism/discrimination\n\nPHAC framework. Indigenous health disparities: lower life expectancy, higher suicide rates, infectious disease burden, intergenerational trauma from residential schools. Cultural safety in care."
    difficulty: easy
    tags: [SDOH]
  - front: "What are the social determinants of health recognized in Canada?"
    back: "Income, education, employment, social/physical environments, biology, health services, gender, culture, Indigenous status, social support, childhood experiences. Income is strongest single predictor\n\nPHAC Key Health Inequalities report documents disparities across 72 indicators. Health equity requires addressing root causes not just healthcare access. 1% increase in income inequality associated with increased mortality across provinces."
    difficulty: medium
    tags: [SDOH, social determinants, health equity]
  - front: "What are the key health disparities facing Indigenous peoples in Canada?"
    back: "Life expectancy 10-15y lower. Diabetes 3-5x, TB >40x (Inuit), youth suicide 5-7x, infant mortality 2-3x. Lower access to clean water, housing, healthcare\n\nRooted in colonization, residential schools, systemic racism. TRC Calls to Action include 7 health recommendations. Jordans Principle ensures First Nations children get needed services. Cultural safety training now mandatory."
    difficulty: hard
    tags: [Indigenous health, disparities, TRC]
  - front: "How does cultural safety differ from cultural competence?"
    back: "Competence: learning about other cultures. Safety: recognizing power imbalances, addressing systemic racism, patient defines if encounter felt safe. Requires self-reflection on own biases\n\nDeveloped from Maori nursing in NZ. Shifts from knowing the other to examining how colonial structures affect care. CPSO and regulators mandate training. NOT about memorizing cultural practices."
    difficulty: medium
    tags: [cultural safety, Indigenous health]
  - front: "What is the impact of poverty on health in Canada?"
    back: "Lowest income quintile: 3-5y lower life expectancy, 2x diabetes, higher CVD/mental illness. Child poverty: more asthma, obesity, developmental delay. ~1 in 7 below poverty line\n\nFood insecurity affects 1 in 8 households. Canada Poverty Reduction Strategy targets 50% reduction by 2030. Screen with single question: Do you have difficulty making ends meet? Poverty is a modifiable risk factor."
    difficulty: medium
    tags: [poverty, health outcomes, Canada]
  - front: "How do adverse childhood experiences (ACEs) affect adult health?"
    back: ">=4 ACEs: 4-12x substance use/depression/suicide risk; 2-4x CVD, cancer, COPD. Dose-response relationship (Felitti 1998 ACE Study)\n\nMechanisms: toxic stress on brain development, HPA axis dysregulation, health risk behaviors. Trauma-informed care recognizes widespread ACE impact. ACE screening increasingly used in Canadian primary care."
    difficulty: medium
    tags: [ACEs, toxic stress, childhood]
  - front: "What are the 5 principles of the Canada Health Act and its coverage gaps?"
    back: "Public administration, Comprehensiveness, Universality, Portability, Accessibility. NOT covered: dental, vision, outpatient Rx, mental health, home care, LTC\n\n~30% healthcare spending is private. National pharmacare proposed. Dental care program for low-income started 2022-23. Provinces administer own systems within CHA. Federal transfer payments conditional on CHA compliance."
    difficulty: medium
    tags: [Canada Health Act, universal healthcare]
  - front: "What is health literacy and how does it affect outcomes?"
    back: "Ability to access, understand, and use health information. ~60% Canadian adults have inadequate health literacy. Low literacy: poorer self-management, more ED visits, higher mortality\n\nUse plain language (grade 6-8), teach-back method, visual aids. Numeracy often worse than literacy. Ottawa Decision Aids are Canadian evidence-based shared decision-making tools. Vulnerable: elderly, immigrants, low SES."
    difficulty: medium
    tags: [health literacy, communication]
  - front: "What are the health effects of homelessness in Canada?"
    back: "Life expectancy 42-52y. 3-6x mortality. Mental illness 30-40%, high substance use, TB, HIV, HCV, frostbite. ~235,000 experience homelessness annually\n\nHousing First model (no preconditions) has strong evidence. Federal Reaching Home strategy funds programs. Low-barrier care, harm reduction, trauma-informed approach. Physicians should connect with social services and advocate for housing."
    difficulty: medium
    tags: [homelessness, disparities]
  - front: "What is harm reduction and what programs exist in Canada?"
    back: "Policies reducing substance use harms without requiring abstinence. Programs: supervised consumption sites, needle exchange, naloxone distribution, safe supply, OAT (methadone, suboxone)\n\nInsite (Vancouver 2003) was first SCS. Evidence: reduced OD deaths, HIV, public drug use; increased treatment uptake. Health Canada grants CDSA exemptions. Safe supply provides pharmaceutical alternatives to toxic unregulated supply."
    difficulty: medium
    tags: [harm reduction, supervised consumption, opioid]
  - front: "What are the TRC health-related Calls to Action?"
    back: "CTA 18: acknowledge disparities from government policies. 19: close health gaps. 22: value Indigenous healing. 23-24: increase Indigenous HCWs and cultural competency training for all\n\nTRC documented residential school abuses (150,000 children, >4000 deaths). Intergenerational trauma contributes to current disparities. All Canadian medical schools now include Indigenous health curriculum. MCCQE expects this knowledge."
    difficulty: hard
    tags: [TRC, Calls to Action, Indigenous]
  - front: "What is implicit bias in healthcare?"
    back: "Unconscious attitudes affecting decisions. Affects pain management (Black patients less analgesia), referrals, diagnostic workup, communication. IAT measures unconscious bias\n\nMitigate: awareness, perspective-taking, individuation, counter-stereotypic imaging, institutional policies, diverse workforce. Canadian regulators increasingly require EDI training. Systemic bias compounds individual bias."
    difficulty: medium
    tags: [implicit bias, health equity]
  - front: "What should be screened in the refugee health assessment?"
    back: "TB (CXR+IGRA), HIV, HBV, HCV, syphilis, malaria (endemic areas), parasites, iron deficiency, lead (children), dental, mental health (PTSD), catch-up vaccines, vision/hearing\n\nCCIRH guidelines. IFHP covers government-assisted refugees. Latent TB 30-50% from high-burden countries. Mental health screening includes torture/trauma history with culturally appropriate tools."
    difficulty: hard
    tags: [refugee health, screening, immigration]
  - front: "How does climate change affect health in Canada?"
    back: "Direct: heat illness, wildfire smoke, extreme weather. Indirect: vector-borne expansion (Lyme northward), food/water insecurity, mental health. Disproportionate: Indigenous, northern, low-income\n\nCanada warming 2x global average, Arctic 3x. Lyme cases up >10-fold since 2009. Wildfire smoke growing respiratory concern. Lancet Countdown Canada tracks 41 climate-health indicators."
    difficulty: medium
    tags: [climate change, health, Lyme]
  - front: "Describe the Canadian opioid crisis: epidemiology and response."
    back: "~22 deaths/day (~8000/yr). 80%+ involve fentanyl. Response: Good Samaritan Act (2017), expanded naloxone, SCS, prescribing guidelines, safe supply pilots\n\nBC highest death rate. Good Samaritan Act protects people calling 911 during OD. Canadian pain guidelines emphasize non-opioid multimodal analgesia first-line. Toxic unregulated supply is primary driver."
    difficulty: hard
    tags: [opioid crisis, fentanyl, public health]
  - front: "What is MAID in Canada and what are the eligibility criteria?"
    back: ">=18, capable, eligible for Canadian health services, grievous/irremediable condition causing intolerable suffering. Track 1: death reasonably foreseeable. Track 2: not foreseeable (extra safeguards). 2 independent assessments\n\nLegal since 2016 (Carter v Canada). Bill C-7 (2021) expanded Track 2. Mental illness as sole condition eligible March 2027 (delayed). ~13,000 MAID deaths 2022 (4.1% of all deaths). Conscience rights protect objecting providers."
    difficulty: hard
    tags: [MAID, medical assistance in dying]
  - front: "The Truth and Reconciliation Commission (TRC) Call to Action #18 specifically addresses health disparities. What does it call upon the federal, provincial, territorial, and Aboriginal governments to do?"
    back: "Acknowledge that the current state of Aboriginal health in Canada is a direct result of previous Canadian government policies, including residential schools, and to recognize and implement the healthcare rights of Aboriginal people as identified in international law, constitutional law, and under the Treaties.\n\nTRC Call to Action #18 is foundational for understanding Indigenous health in Canada. It establishes that health disparities are not incidental but are direct consequences of colonial policies including the Indian Residential School system. This framing is essential for culturally safe medical practice."
    difficulty: medium
    tags: [TRC, calls-to-action, Indigenous-health, colonialism, health-policy]
  - front: "What is the approximate life expectancy gap between First Nations people and non-Indigenous Canadians?"
    back: "First Nations males live approximately 8-9 years less and First Nations females approximately 7-8 years less than non-Indigenous Canadians. Inuit populations face an even larger gap of approximately 10-15 years.\n\nStatistics Canada and the First Nations Information Governance Centre data consistently show significant life expectancy disparities. Inuit Nunangat regions have the largest gaps, driven by high rates of suicide, respiratory disease, and injuries. These disparities reflect cumulative effects of social determinants of health."
    difficulty: easy
    tags: [health-disparities, life-expectancy, Indigenous-health, epidemiology]
  - front: "The infant mortality rate among First Nations populations in Canada is approximately how many times higher than the non-Indigenous rate?"
    back: "Approximately 2-3 times higher than the non-Indigenous Canadian infant mortality rate.\n\nFirst Nations and Inuit infant mortality rates remain significantly elevated compared to non-Indigenous Canadians. Contributing factors include limited access to prenatal care in remote communities, maternal evacuation policies for birth, higher rates of SIDS, and socioeconomic disparities. The Inuit infant mortality rate is particularly high, approximately 3 times the national average."
    difficulty: easy
    tags: [infant-mortality, health-disparities, Indigenous-health, maternal-health]
  - front: "A 42-year-old First Nations woman presents with polyuria, polydipsia, and a random glucose of 14.2 mmol/L. Type 2 diabetes prevalence in First Nations populations is approximately how many times greater than the general Canadian population?"
    back: "3-5 times higher. Age-adjusted prevalence of type 2 diabetes in First Nations adults is approximately 17-20%, compared to roughly 5-7% in the general Canadian population.\n\nThe First Nations Regional Health Survey and PHAC data show dramatically elevated diabetes rates in Indigenous communities. This is driven by the nutrition transition from traditional diets to processed foods, food insecurity, genetic susceptibility (thrifty gene hypothesis), and intergenerational effects of colonization. Gestational diabetes rates are also 2-3 times higher in First Nations women."
    difficulty: medium
    tags: [diabetes, health-disparities, Indigenous-health, endocrinology]
  - front: "Suicide rates among Inuit youth in Canada are approximately how many times higher than the national average? What is a key protective factor identified in research?"
    back: "Inuit youth suicide rates are approximately 5-11 times the national average. Key protective factors include cultural continuity, self-governance, community control over land, education, health services, and cultural facilities.\n\nChandler and Lalonde's landmark Canadian research demonstrated that First Nations communities with greater cultural continuity (self-governance, land claims, control of education/health/police/fire services, cultural facilities) had dramatically lower suicide rates. Some communities with all protective factors had zero youth suicides over the study period."
    difficulty: medium
    tags: [suicide, Inuit-health, cultural-continuity, mental-health, Indigenous-health]
  - front: "Tuberculosis incidence in Inuit populations in Canada is approximately how many times higher than in Canadian-born non-Indigenous people?"
    back: "Approximately 290-300 times higher. Inuit TB incidence rates are among the highest in the world for any defined population within a high-income country.\n\nPHAC data shows Inuit TB rates are staggeringly elevated, with periodic outbreaks in Nunavut communities. Contributing factors include overcrowded housing (average 2-3 times national occupancy), food insecurity leading to immunocompromise, limited access to diagnostic and treatment services, and historical inadequacies in TB treatment programs. First Nations rates are approximately 34 times higher than the Canadian-born non-Indigenous rate."
    difficulty: medium
    tags: [tuberculosis, Inuit-health, infectious-disease, health-disparities, Indigenous-health]
  - front: "What is Jordan's Principle, and what event prompted its creation?"
    back: "Jordan's Principle is a child-first principle ensuring First Nations children can access the public services they need when they need them. It is named after Jordan River Anderson, a Manitoba First Nations child with complex medical needs who died in hospital at age 5 in 2005 while the federal and provincial governments disputed which was financially responsible for his at-home care.\n\nJordan's Principle was adopted by the House of Commons in 2007. The 2016 Canadian Human Rights Tribunal ruling (First Nations Child and Family Caring Society v. Canada) found the government had applied Jordan's Principle too narrowly and ordered full implementation. It now covers all public services for all First Nations children, not just those with disabilities or complex needs."
    difficulty: medium
    tags: [Jordans-Principle, child-health, health-policy, Indigenous-health, CHRT]
  - front: "A 4-year-old First Nations child living on reserve needs speech-language therapy not available in their community. The provincial government says it is a federal responsibility; the federal government says it is provincial. Under Jordan's Principle, what should happen?"
    back: "The government of first contact must pay for the service and provide it without delay. Jurisdictional disputes must be resolved later through interdepartmental or intergovernmental mechanisms. The child's needs come first.\n\nJordan's Principle eliminates service gaps caused by jurisdictional disputes between federal and provincial governments regarding First Nations children. Since the 2016 CHRT ruling, the principle applies to all First Nations children, covers all government services (health, education, social), and requires services comparable to those available to other Canadian children."
    difficulty: hard
    tags: [Jordans-Principle, child-health, jurisdictional-disputes, Indigenous-health]
  - front: "What is the Non-Insured Health Benefits (NIHB) program, who is eligible, and what does it cover?"
    back: "NIHB is a federal program administered by Indigenous Services Canada that covers eligible First Nations and Inuit clients for medically necessary health benefits not covered by provincial/territorial plans or private insurance. Benefits include prescription drugs, dental care, vision care, medical supplies and equipment, mental health counselling, and medical transportation.\n\nNIHB is distinct from provincial health insurance and covers supplemental benefits. Eligibility includes registered First Nations under the Indian Act and recognized Inuit. Métis are generally not covered by NIHB. Medical transportation is a critical component, especially for remote communities requiring evacuation for specialized care."
    difficulty: medium
    tags: [NIHB, health-policy, Indigenous-health, federal-programs]
  - front: "A physician prescribes a medication for a First Nations patient, but it requires NIHB prior approval. The patient cannot afford the medication out-of-pocket. What is an important consideration regarding NIHB drug coverage?"
    back: "NIHB maintains a drug formulary with open, limited-use, and excluded categories. The physician should check if an alternative open-benefit medication is available, or submit a prior approval request. Delays in NIHB approval can create barriers to care, and physicians should advocate for timely approval and consider interim solutions.\n\nNIHB prior approval processes can create significant access barriers, particularly in remote communities. Physicians working with First Nations and Inuit patients should be familiar with the NIHB formulary, the prior approval process, and how to advocate effectively. The NIHB provider guide is available through Indigenous Services Canada."
    difficulty: medium
    tags: [NIHB, pharmacology, access-to-care, Indigenous-health]
  - front: "What is intergenerational trauma in the context of Indigenous health in Canada, and how does it manifest clinically?"
    back: "Intergenerational trauma refers to the transmission of trauma effects from residential school survivors and other colonial violence to subsequent generations who did not directly experience those events. Clinical manifestations include higher rates of mental health disorders, substance use, family violence, attachment difficulties, parenting challenges, and adverse childhood experiences in the children and grandchildren of survivors.\n\nResearch by Amy Bombay and others at Dalhousie University has demonstrated that the children and grandchildren of residential school survivors have elevated rates of depression, suicidal ideation, and substance use disorders. Epigenetic mechanisms, disrupted attachment patterns from institutional upbringing, and loss of cultural/parenting knowledge all contribute. The National Indian Residential School Crisis Line (1-866-925-4419) supports affected individuals."
    difficulty: hard
    tags: [intergenerational-trauma, residential-schools, mental-health, Indigenous-health, epigenetics]
  - front: "What are the four key diagnostic features used in the Canadian FASD diagnostic guidelines (2015 update), and what replaced the previous 4-Digit Diagnostic Code?"
    back: "The 2015 Canadian FASD guidelines use: (1) prenatal alcohol exposure (confirmed or unknown), (2) neurodevelopmental assessment across 10 brain domains, (3) sentinel facial features (short palpebral fissures, smooth philtrum, thin upper lip), and (4) assessment of other conditions. The diagnosis uses the terms 'FASD with sentinel facial features' and 'FASD without sentinel facial features,' replacing FAS/pFAS/ARND terminology.\n\nThe 2015 Canadian guidelines (Cook et al., updated from Chudley et al. 2005) shifted to a simplified diagnostic framework. Three or more brain domains must be significantly impaired (≥2 SD below mean). Canada uses a multidisciplinary team approach for diagnosis. FASD prevalence in some Indigenous communities is elevated due to colonial disruption, but stereotyping must be avoided — FASD affects all populations."
    difficulty: hard
    tags: [FASD, diagnosis, pediatrics, Indigenous-health, neurodevelopment]
  - front: "A 7-year-old child in care presents with learning difficulties, impulsivity, and poor social skills. Physical exam shows short palpebral fissures, smooth philtrum, and thin upper lip. Prenatal alcohol exposure is confirmed. How is this child diagnosed and managed under Canadian FASD guidelines?"
    back: "Diagnosis: FASD with sentinel facial features. Management includes multidisciplinary neurodevelopmental assessment across 10 brain domains, early intervention programs, educational accommodations (IEP), behavioural supports, caregiver education, and stable placement. There is no pharmacological cure; management is supportive and adaptive.\n\nCanadian FASD guidelines require assessment of 10 brain domains: motor skills, neuroanatomy, cognition, language, academic achievement, memory, attention, executive function, affect regulation, and adaptive behaviour. Early diagnosis improves outcomes. FASD is a leading cause of developmental disability in Canada, with an estimated prevalence of approximately 4% in the general population."
    difficulty: hard
    tags: [FASD, pediatrics, management, neurodevelopment, Indigenous-health]
  - front: "What are the key social determinants of health disproportionately affecting Indigenous communities in Canada regarding housing?"
    back: "Indigenous communities face overcrowding (Inuit homes average 2-3x national occupancy rates), inadequate housing (mould, poor ventilation, lack of running water), housing shortages on reserves, and homelessness in urban centres. These conditions contribute to increased respiratory infections, TB transmission, mental health impacts, and family violence.\n\nThe 2021 Census showed 16.4% of First Nations on reserve lived in housing needing major repairs versus 6.0% nationally. Overcrowding is a major driver of the TB epidemic in Inuit Nunangat. The National Housing Strategy has Indigenous-specific components, but significant gaps remain. Housing is a critical upstream determinant of Indigenous health outcomes."
    difficulty: medium
    tags: [social-determinants, housing, Indigenous-health, overcrowding, public-health]
  - front: "As of recent data, approximately how many long-term drinking water advisories affect First Nations communities in Canada, and what are the health implications?"
    back: "While the federal government has lifted many long-term advisories, dozens of First Nations communities remain under drinking water advisories. Health implications include gastrointestinal illness, inability to practice proper hygiene, skin conditions, reliance on bottled water or sugary beverages contributing to dental caries and diabetes, and significant mental health impacts from chronic insecurity.\n\nAccess to clean drinking water is a fundamental determinant of health. Many First Nations communities have experienced boil water advisories lasting years or decades. The Neskantaga First Nation had the longest-running advisory in Canada (over 25 years). Lack of clean water also limits food preparation and wound care, compounding health disparities."
    difficulty: medium
    tags: [water-security, social-determinants, Indigenous-health, public-health]
  - front: "How does food insecurity affect Indigenous communities in Canada, particularly in Northern and remote regions?"
    back: "Food insecurity rates in Nunavut approach 46-70% of households (highest in Canada). Factors include extreme costs of market food in remote communities, declining access to traditional/country food due to climate change and contaminants, loss of traditional knowledge, and poverty. Health impacts include malnutrition, obesity paradox, diabetes, iron deficiency anemia, and childhood developmental delays.\n\nThe Nutrition North Canada program subsidizes perishable foods shipped to remote communities but has been criticized for inadequacy. Traditional/country food (caribou, seal, Arctic char, berries) is nutritionally superior to market alternatives but faces threats from climate change and environmental contaminants. Food sovereignty is a key concept in Indigenous health advocacy."
    difficulty: medium
    tags: [food-security, social-determinants, Northern-health, Inuit-health, Indigenous-health]
  - front: "What is the Indian Act (1876, amended), and how does it affect healthcare access for Indigenous peoples in Canada?"
    back: "The Indian Act is federal legislation governing First Nations people and reserves. Healthcare implications include: only registered (Status) Indians are eligible for NIHB, creating coverage gaps for non-Status First Nations and Métis; the Act created the reserve system limiting healthcare infrastructure; it historically banned Traditional practices (potlatch, sun dance) disrupting healing traditions; and it established the framework for residential schools.\n\nThe Indian Act remains in force and creates a two-tiered system where Status Indians have different health coverage than other Indigenous peoples. The Act's registration provisions (including historical gender discrimination under Section 6) determined who received federal health benefits. Bill S-3 (2017) addressed some gender-based inequities in registration but gaps remain."
    difficulty: hard
    tags: [Indian-Act, health-policy, Status-Indian, NIHB, Indigenous-health]
  - front: "What was the Sixties Scoop, and what are its lasting health impacts?"
    back: "The Sixties Scoop (1960s-1980s) was the mass removal of Indigenous children from their families by child welfare authorities and their placement with non-Indigenous foster or adoptive families across Canada and internationally. Lasting health impacts include identity loss, cultural disconnection, attachment disorders, elevated rates of depression, PTSD, substance use disorders, and suicidality among survivors.\n\nAn estimated 20,000+ Indigenous children were removed during the Sixties Scoop. In 2017, the Ontario Superior Court ruled the federal government liable for the harm caused. The Sixties Scoop is distinct from but related to residential schools, and its legacy continues in the ongoing overrepresentation of Indigenous children in the child welfare system — Indigenous children represent over 50% of children in care despite being approximately 7.7% of the child population."
    difficulty: medium
    tags: [Sixties-Scoop, child-welfare, intergenerational-trauma, Indigenous-health, mental-health]
  - front: "TRC Calls to Action #19 and #20 address measurable health outcomes. What do they specifically request?"
    back: "Call #19 asks the federal government to establish measurable goals to identify and close the gaps in health outcomes between Indigenous and non-Indigenous communities, with annual reporting. Call #20 asks for funding to address gaps including Indigenous healing centres, mental health and addiction treatment, and culturally appropriate prevention programs.\n\nThese Calls to Action demand accountability through measurable targets and dedicated funding. They recognize that eliminating health disparities requires both tracking progress (Call #19) and investing in Indigenous-led solutions (Call #20). The annual reports by the Yellowhead Institute consistently show slow implementation of TRC Calls to Action across Canadian governments."
    difficulty: medium
    tags: [TRC, calls-to-action, health-outcomes, accountability, Indigenous-health]
  - front: "What is health literacy and how does it affect patient care?"
    back: "Ability to obtain, process, and understand basic health information to make appropriate health decisions. Low health literacy associated with: worse outcomes, higher hospitalization rates, lower medication adherence\n\n60% of Canadians have inadequate health literacy. Teach-back method: ask patient to explain in own words. Use plain language, visual aids, limit information to 3 key points per visit."
    difficulty: easy
    tags: [health literacy, communication]
  - front: "What is the difference between cultural safety and cultural competence?"
    back: "Cultural competence: provider learns about other cultures (knowledge-based). Cultural safety: provider examines own biases and power imbalances, creating environment where patient feels safe (relationship-based)\n\nCultural safety is the standard in Canadian healthcare, especially for Indigenous populations. Determined by the patient, not the provider. Requires ongoing self-reflection on privilege, power, and systemic racism."
    difficulty: medium
    tags: [cultural safety, Indigenous]
  - front: "A 45-year-old patient presents with poorly controlled type 2 diabetes. On screening, they report food insecurity and inability to afford medications. Which social determinants of health are most directly contributing to their poor glycemic control?"
    back: "Income/socioeconomic status and food insecurity are the primary social determinants. Others include access to healthcare (medication costs), health literacy, and potentially housing instability. In Canada, approximately 1 in 8 households experiences food insecurity, which directly impacts dietary management of diabetes.\n\nThe Public Health Agency of Canada identifies 12 key determinants of health. Food insecurity affects approximately 12-15% of Canadian households and is strongly associated with poor chronic disease outcomes. Physicians should recognize that prescribing dietary modifications without addressing food access is insufficient."
    difficulty: medium
    tags: [social-determinants, food-insecurity, diabetes, health-equity, poverty]
  - front: "What is health equity, and how does it differ from health equality?"
    back: "Health equality means providing the same resources to everyone. Health equity means allocating resources according to need so that everyone has a fair opportunity to achieve their full health potential. Equity acknowledges that different populations face different barriers and may require different levels of support.\n\nThe Public Health Agency of Canada uses the health equity framework to guide policy. For example, providing the same clinic hours to all communities (equality) may not serve shift workers or rural populations. Equity-oriented approaches tailor services to address barriers faced by marginalized groups, such as offering evening clinics or mobile outreach."
    difficulty: easy
    tags: [health-equity, health-equality, social-determinants, health-advocacy]
  - front: "What validated screening question can a physician use to quickly assess food insecurity in clinical practice?"
    back: "The Hunger Vital Sign uses two validated questions from the USDA Household Food Security Survey Module: (1) 'Within the past 12 months, we worried whether our food would run out before we got money to buy more' and (2) 'Within the past 12 months, the food we bought just didn't last and we didn't have money to get more.' An affirmative response to either is a positive screen.\n\nThe Hunger Vital Sign has 97% sensitivity for food insecurity and is endorsed by Canadian paediatric and family medicine organizations. PROOF (a Canadian research program at the University of Toronto) has shown that food insecurity in Canada is primarily an income problem, not a food supply problem, and is best addressed through income-based interventions."
    difficulty: medium
    tags: [food-insecurity, screening, poverty, health-advocacy, social-determinants]
  - front: "What is the difference between 'upstream' and 'downstream' health interventions? Give a Canadian example of each."
    back: "Downstream interventions treat illness after it occurs (e.g., treating a patient's pneumonia with antibiotics). Upstream interventions address root causes before illness develops (e.g., Canada's national housing strategy to reduce homelessness, which prevents health problems associated with inadequate shelter).\n\nThe upstream/downstream metaphor originates from public health and is central to the Health Advocate role. Canada's Poverty Reduction Strategy and the Canada Child Benefit are upstream interventions that address income as a determinant of health. The MCCQE1 expects candidates to recognize that clinical care alone cannot address health inequities."
    difficulty: easy
    tags: [upstream-downstream, health-advocacy, prevention, social-determinants, public-health]
  - front: "A physician notices that multiple patients from a local Indigenous community present with water-borne illness. What distinguishes individual-level from population-level advocacy in this scenario?"
    back: "Individual-level advocacy: ensuring each patient receives appropriate treatment, connecting them to clean water sources, and addressing their immediate health needs. Population-level advocacy: reporting the issue to public health authorities, advocating for infrastructure improvements (e.g., lifting boil-water advisories), and supporting community-led initiatives to address the root cause.\n\nAs of recent years, dozens of long-term drinking water advisories remain in effect in First Nations communities across Canada. CanMEDS expects physicians to advocate at both individual and population levels. Population-level advocacy may involve writing to government officials, supporting community organizations, or contributing to policy recommendations."
    difficulty: hard
    tags: [advocacy, individual-vs-population, Indigenous-health, water-safety, CanMEDS]
  - front: "How should a physician assess a patient's health literacy, and why does it matter clinically?"
    back: "Health literacy can be assessed using validated tools such as the Newest Vital Sign (NVS) or by using teach-back method (asking patients to explain instructions in their own words). Low health literacy is associated with poorer medication adherence, higher hospitalization rates, and worse chronic disease outcomes.\n\nApproximately 60% of Canadian adults have inadequate health literacy (Canadian Council on Learning). The teach-back method is recommended as a practical clinical tool by the Canadian Literacy and Learning Network. Low health literacy crosses all demographics and is often invisible, making universal precautions (plain language for all patients) the best approach."
    difficulty: medium
    tags: [health-literacy, teach-back, health-advocacy, communication, patient-education]
  - front: "A family physician identifies that a patient's chronic pain is exacerbated by precarious employment and lack of workplace accommodations. What advocacy actions are appropriate?"
    back: "The physician can: write a letter supporting workplace accommodations under provincial human rights legislation, refer to occupational therapy for functional assessment, connect the patient with community legal services, provide documentation for disability benefits if applicable, and advocate for the patient with their employer (with consent).\n\nIn Canada, provincial Human Rights Codes and the duty to accommodate require employers to make reasonable accommodations for disability. Physicians play a key role by providing medical documentation. The CanMEDS Health Advocate role encompasses identifying social factors affecting health and taking action within one's sphere of influence."
    difficulty: medium
    tags: [workplace-advocacy, accommodation, chronic-pain, health-advocacy, social-determinants]
  - front: "What is the Clinical Poverty Tool developed by Canadian researchers, and what domains does it screen?"
    back: "The Clinical Poverty Tool (developed through Canadian research initiatives) screens for income-related social determinants including: income adequacy, housing stability, food security, and ability to afford medications. It uses simple questions that can be integrated into routine clinical encounters.\n\nPoverty is the strongest social determinant of health in Canada, with low-income Canadians having significantly higher rates of chronic disease, mental illness, and premature mortality. Tools like poverty screening questions help physicians identify patients who may benefit from referrals to income support programs, community resources, or social workers."
    difficulty: medium
    tags: [poverty-screening, social-determinants, health-advocacy, clinical-tools]
  - front: "What are the key components of the 'Health in All Policies' approach, and how does it relate to physician advocacy?"
    back: "Health in All Policies (HiAP) is an approach that systematically considers the health implications of government decisions across all sectors (transportation, housing, education, agriculture). It emphasizes intersectoral collaboration and aims to improve population health and health equity by addressing upstream determinants.\n\nThe WHO and Public Health Agency of Canada endorse HiAP as a framework for addressing social determinants. For example, urban planning decisions about bike lanes and green spaces impact physical activity and mental health. Physicians can contribute by providing expert testimony, participating in policy consultations, and supporting evidence-informed advocacy."
    difficulty: hard
    tags: [health-in-all-policies, population-health, health-advocacy, intersectoral, public-health]
  - front: "A refugee patient newly arrived in Canada presents with untreated hypertension and diabetes. What system-level barriers to care should you anticipate and address as a health advocate?"
    back: "Barriers include: waiting period for provincial health insurance (varies by province; some have 3-month wait), language barriers, unfamiliarity with the Canadian health system, cost of medications (no drug coverage initially), transportation, cultural differences in health beliefs, and potential trauma history affecting trust in authorities.\n\nThe Interim Federal Health Program (IFHP) covers essential healthcare for refugees and refugee claimants, but coverage details vary. Some provinces (Ontario, Manitoba) have eliminated the 3-month OHIP wait for refugees. Physicians should be aware of IFHP coverage, connect patients with settlement agencies, and arrange interpreter services to facilitate equitable care."
    difficulty: hard
    tags: [refugee-health, health-advocacy, access-to-care, IFHP, social-determinants]
