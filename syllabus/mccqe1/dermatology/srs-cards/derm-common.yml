# Common Dermatoses & Rashes (Dermatology) - generated from srs-mccqe1
cards:
  - front: "A 35-year-old woman has an intensely pruritic, erythematous rash with vesicles on flexor surfaces and neck after starting a new laundry detergent. What is the diagnosis?"
    back: "Allergic contact dermatitis (ACD)\n\nACD is a type IV delayed hypersensitivity reaction. The distribution corresponds to contact area. Patch testing identifies the allergen. Treatment: remove trigger, topical corticosteroids, antihistamines for itch."
    difficulty: medium
    tags: [contact-dermatitis, allergic, type-IV-hypersensitivity, patch-testing]
  - front: "What are the ABCDE criteria used for in dermatology?"
    back: "Screening pigmented lesions for malignant melanoma: Asymmetry, Border irregularity, Color variation, Diameter >6mm, Evolution (change over time)\n\nThe ABCDE mnemonic is a clinical screening tool. Any single criterion or \"ugly duckling\" sign (lesion that looks different from others) warrants dermatology referral. Dermoscopy increases diagnostic accuracy."
    difficulty: easy
    tags: [melanoma, ABCDE, pigmented-lesion, screening, dermoscopy]
  - front: "A 22-year-old man has comedones, inflammatory papules, and nodules on the face and back. What is first-line treatment for moderate inflammatory acne?"
    back: "Topical benzoyl peroxide + topical retinoid (e.g., adapalene); oral doxycycline if inadequate response\n\nCombination topical therapy (retinoid + benzoyl peroxide) is most effective for inflammatory acne. Oral antibiotics are added for moderate-severe disease. Isotretinoin is reserved for nodular/cystic acne or antibiotic-resistant moderate acne."
    difficulty: medium
    tags: [acne, benzoyl-peroxide, retinoid, doxycycline, treatment]
  - front: "What is the pathognomonic skin finding of psoriasis?"
    back: "Auspitz sign (pinpoint bleeding when scale is removed from plaque) and Koebner phenomenon (lesions develop at trauma sites)\n\nPsoriasis presents as well-demarcated erythematous plaques with silvery scale on extensor surfaces, scalp, and nails. Nail pitting and onycholysis also occur. About 30% develop psoriatic arthritis."
    difficulty: easy
    tags: [psoriasis, Auspitz-sign, Koebner-phenomenon, plaque, nail-pitting]
  - front: "A 6-month-old infant has oozing, crusted erythematous patches on cheeks and scalp with intense itch. What is the diagnosis?"
    back: "Atopic dermatitis (infantile eczema)\n\nAtopic dermatitis affects 20% of children. Infantile pattern: face, scalp, and extensor surfaces. Treatment: emollients (moisturizers) as cornerstone, topical corticosteroids for flares, avoidance of triggers. Often improves by school age."
    difficulty: easy
    tags: [atopic-dermatitis, eczema, infantile, emollient, topical-corticosteroid]
  - front: "What is the first-line treatment for tinea corporis (ringworm)?"
    back: "Topical antifungal (e.g., clotrimazole, terbinafine) for 2–4 weeks\n\nTinea corporis is caused by dermatophytes. Diagnosis is confirmed by KOH preparation showing hyphae. Topical terbinafine is more effective than azoles. Oral antifungals (terbinafine, itraconazole) are used for extensive, tinea capitis, or nail involvement."
    difficulty: easy
    tags: [tinea-corporis, ringworm, antifungal, clotrimazole, terbinafine]
  - front: "A 65-year-old man presents with a pearly nodule with rolled edges and telangiectasia on his nose. He is a farmer with extensive sun exposure. What is the most likely diagnosis?"
    back: "Basal cell carcinoma (BCC)\n\nBCC is the most common skin cancer. Nodular BCC has classic pearly rolled border with telangiectasia. It rarely metastasizes but causes local tissue destruction. Treatment: surgical excision or Mohs micrographic surgery."
    difficulty: easy
    tags: [basal-cell-carcinoma, BCC, sun-exposure, nodular, treatment]
  - front: "What is the first-line treatment for mild-to-moderate plaque psoriasis?"
    back: "Topical corticosteroids (moderate-to-high potency) combined with topical vitamin D analogues (calcipotriol)\n\nThe calcipotriol/betamethasone combination (Dovobet) is the most effective topical treatment for plaque psoriasis. It reduces scale and erythema with fewer steroid side effects than monotherapy. Phototherapy and biologics are used for moderate-severe disease."
    difficulty: medium
    tags: [psoriasis, topical-corticosteroid, calcipotriol, Dovobet, treatment]
  - front: "Which condition presents as silvery-white lacy patches on the buccal mucosa that are asymptomatic and require no treatment?"
    back: "Lichen planus (reticular pattern — Wickham striae)\n\nOral lichen planus is a chronic inflammatory condition. Reticular (white lacy) pattern is benign. Erosive pattern causes pain and has slight malignant potential. Diagnosis: biopsy. Treatment of erosive type: topical or systemic corticosteroids."
    difficulty: medium
    tags: [lichen-planus, Wickham-striae, oral-mucosa, biopsy]
  - front: "A 55-year-old woman develops a painful, burning vesicular rash in a dermatomal distribution on her left thorax. What is the treatment?"
    back: "Antiviral therapy: valacyclovir 1000 mg TID × 7 days, initiated within 72 hours of rash onset\n\nHerpes zoster (shingles) reactivation of VZV. Antivirals reduce duration and severity, and prevent post-herpetic neuralgia (PHN). Adjunctive gabapentin or amitriptyline treats neuropathic pain. Shingrix (recombinant zoster vaccine) prevents recurrence."
    difficulty: medium
    tags: [herpes-zoster, shingles, valacyclovir, postherpetic-neuralgia, Shingrix]
  - front: "What distinguishes eczema from psoriasis clinically?"
    back: "Eczema: pruritic, flexural surfaces, oozing/crusting, poorly defined borders. Psoriasis: silvery scales, extensor surfaces, well-demarcated plaques, Auspitz sign, nail pitting\n\nEczema: atopic triad (eczema, asthma, allergic rhinitis). Treatment: emollients, topical steroids, calcineurin inhibitors. Psoriasis: Koebner phenomenon. Treatment: topical steroids, vitamin D analogs, phototherapy, biologics."
    difficulty: medium
    tags: [eczema, psoriasis]
  - front: "How do eczema and psoriasis differ clinically?"
    back: "Eczema: poorly defined, weeping/crusting, flexural, intensely pruritic, atopic triad. Psoriasis: well-defined silvery scale, extensor surfaces, Auspitz sign, nail pitting, Koebner phenomenon\n\nEczema: filaggrin mutation, Th2-mediated. Psoriasis: Th17-mediated. Eczema Rx: moisturizers+topical steroids+calcineurin inhibitors. Psoriasis Rx: topical steroids+vitamin D+phototherapy+biologics for moderate-severe."
    difficulty: medium
    tags: [eczema, psoriasis, differential]
  - front: "What is the stepwise management of atopic dermatitis?"
    back: "1) Daily moisturizers + trigger avoidance. 2) Topical steroids (low-potency face, moderate body). 3) Calcineurin inhibitors (tacrolimus). 4) Phototherapy. 5) Systemic: dupilumab, MTX, cyclosporine\n\nMoisturize within 3min of bath. Avoid soap. Wet wraps for flares. Dupilumab (anti-IL4/13) transformed severe AD. Avoid systemic steroids (rebound). Steroid phobia common - educate patients/parents."
    difficulty: hard
    tags: [atopic dermatitis, management]
  - front: "What is the management of moderate-severe plaque psoriasis?"
    back: "Topical: steroids + calcipotriol. Phototherapy: nbUVB. Systemic: MTX, cyclosporine, acitretin, apremilast. Biologics: TNFi, IL-17i (secukinumab), IL-23i (guselkumab), IL-12/23i (ustekinumab)\n\nScreen for PsA, metabolic syndrome, depression, CV risk. Biologics achieve PASI 75-90 in >80%. Pre-biologic: TB/HBV screen, vaccines. MTX: monitor CBC/LFTs. Acitretin: teratogenic 3 years."
    difficulty: hard
    tags: [psoriasis, biologics, phototherapy]
  - front: "What is the stepwise management of acne vulgaris?"
    back: "Mild comedonal: topical retinoid +/- BPO. Moderate papulopustular: + topical clindamycin with BPO. Moderate-severe: + oral doxycycline x3mo. Severe nodular/scarring: isotretinoin\n\nIsotretinoin: teratogenic (iPLEDGE, 2 contraception, pregnancy tests). SE: dryness, lipids, LFTs. OCP/spironolactone for female hormonal acne. Never use topical antibiotic monotherapy (resistance)."
    difficulty: hard
    tags: [acne, isotretinoin, retinoid]
  - front: "How is chronic urticaria managed?"
    back: "Acute <6wk: 2nd-gen antihistamine. Chronic >6wk: step up antihistamine to 4x dose, then add omalizumab (anti-IgE). Avoid ASA/NSAIDs (worsen 30%). CSU is autoimmune, rarely allergic\n\nNo allergy testing for CSU. Lesions lasting >24h with bruising: consider urticarial vasculitis (biopsy). Omalizumab very effective for antihistamine-refractory CSU. Cyclosporine as last resort."
    difficulty: medium
    tags: [urticaria, antihistamine, omalizumab]
  - front: "What dermatological emergencies require urgent recognition?"
    back: "SJS/TEN (skin pain, mucosal erosions, Nikolsky+, >30% BSA=TEN). Necrotizing fasciitis (pain out of proportion, systemic toxicity). Pemphigus vulgaris (flaccid blisters)\n\nSJS/TEN drugs: allopurinol, carbamazepine, sulfonamides, phenytoin. Immediate drug withdrawal + burn unit. TEN mortality 25-30%. SCORTEN predicts. NF: surgical emergency + broad-spectrum abx."
    difficulty: hard
    tags: [SJS, TEN, necrotizing fasciitis]
  - front: "How are fungal skin infections diagnosed and treated?"
    back: "Tinea: KOH shows hyphae. Topical terbinafine/clotrimazole 2-4wk. Tinea capitis: oral terbinafine 6-8wk (topical insufficient). Onychomycosis: oral terbinafine 12wk toes, 6wk fingers\n\nTinea versicolor (Malassezia): spaghetti-and-meatballs KOH. ID reaction: distant eczematous reaction to fungal infection. Tinea capitis: kerion is inflammatory mass requiring oral antifungal + pred."
    difficulty: medium
    tags: [tinea, fungal, terbinafine]
  - front: "What is the ABCDE approach to evaluating pigmented lesions?"
    back: "A: Asymmetry. B: Border irregularity. C: Color variation. D: Diameter >6mm. E: Evolution (most important). Ugly duckling sign. Any concerning lesion: excisional biopsy (not shave)\n\nNodular melanoma may not follow ABCDE (EFG: elevated, firm, growing). New changing pigmented lesion in >30 needs evaluation. Dermoscopy reduces unnecessary biopsies by 42%."
    difficulty: medium
    tags: [ABCDE, melanoma, pigmented lesion]
  - front: "What are common bacterial skin infections and their treatment?"
    back: "Impetigo: mupirocin (local) or cephalexin. Cellulitis: cephalexin/cloxacillin. Abscess: I&D +/- antibiotics. MRSA: TMP-SMX or doxycycline. Erysipelas: penicillin/amoxicillin\n\nPurulent cellulitis: cover MRSA. Non-purulent: streptococcal. Mark borders. Recurrent cellulitis: treat predisposing factors (edema, tinea pedis). Bullous impetigo always S.aureus."
    difficulty: medium
    tags: [cellulitis, impetigo, MRSA]
  - front: "What are the topical corticosteroid potency classes?"
    back: "Superpotent (I): clobetasol. Potent (II-III): betamethasone dipropionate. Moderate (IV-V): triamcinolone. Mild (VI-VII): hydrocortisone 1%. Face/groin: mild only. Trunk: moderate-potent\n\nSE: atrophy, striae (irreversible), telangiectasia, perioral dermatitis. Limit potent to 2-4wk. Ointments > creams in potency. Weekend-only maintenance reduces SE. Steroid holidays prevent tachyphylaxis."
    difficulty: medium
    tags: [topical steroids, potency]
  - front: "What is the dermatology morphology vocabulary?"
    back: "Macule: flat <1cm. Patch: flat >1cm. Papule: raised <1cm. Plaque: raised >1cm. Vesicle: fluid <1cm. Bulla: fluid >1cm. Nodule: deep solid. Wheal: transient edematous papule/plaque\n\nAdditional: pustule (pus-filled), erosion (partial thickness loss), ulcer (full thickness), excoriation (scratched), lichenification (thickened from rubbing), scale, crust. Accurate description essential for consultation."
    difficulty: easy
    tags: [dermatology, morphology]
  - front: "What is Stevens-Johnson syndrome/TEN and how is it managed?"
    back: "SJS: <10% BSA detachment. TEN: >30% BSA. Overlap: 10-30%. Offending drugs: allopurinol, sulfonamides, anticonvulsants (carbamazepine, phenytoin, lamotrigine), NSAIDs. Management: stop drug, burn unit, supportive care, IVIG controversial\n\nMortality: SJS 5%, TEN 30%. Nikolsky sign positive. Mucosal involvement (oral, ocular, genital). HLA-B*5801 screening before allopurinol in high-risk ethnicities (Southeast Asian, African American)."
    difficulty: hard
    tags: [SJS, TEN, drug reaction]
  - front: "Define the following dermatologic terms: macule, papule, plaque, vesicle, bulla, nodule, and wheal."
    back: "Macule: flat, <1 cm, color change only (e.g., freckle). Patch: flat, >1 cm. Papule: raised, solid, <1 cm (e.g., molluscum). Plaque: raised, flat-topped, >1 cm (e.g., psoriasis). Vesicle: fluid-filled, <1 cm (e.g., herpes). Bulla: fluid-filled, >1 cm (e.g., bullous pemphigoid). Nodule: solid, >1 cm, extends into dermis/subcutis (e.g., erythema nodosum). Wheal: transient, edematous papule/plaque (e.g., urticaria).\n\nAccurate morphologic description is the foundation of dermatologic diagnosis. The Canadian Dermatology Association emphasizes systematic skin examination: describe the primary lesion, secondary changes (scale, crust, erosion), distribution, and configuration. This standardized approach allows precise communication between clinicians."
    difficulty: easy
    tags: [dermatology-morphology, macule, papule, vesicle, bulla, plaque, wheal]
  - front: "Describe the stepwise management of atopic dermatitis (eczema) from mild to severe."
    back: "Step 1 (all severities): emollients (fragrance-free), trigger avoidance, gentle skin care. Step 2 (mild): low-potency topical corticosteroids (hydrocortisone 1% for face/folds). Step 3 (moderate): medium-potency topical corticosteroids (betamethasone valerate 0.05%), topical calcineurin inhibitors (tacrolimus, pimecrolimus) for steroid-sparing. Step 4 (moderate-severe): wet wrap therapy, phototherapy (narrowband UVB). Step 5 (severe/refractory): systemic agents — dupilumab (anti-IL-4/IL-13, first-line biologic), cyclosporine, methotrexate, or JAK inhibitors (abrocitinib, upadacitinib).\n\nAtopic dermatitis affects 10–20% of Canadian children. Dupilumab was approved by Health Canada for moderate-to-severe AD in adults and adolescents and has transformed management. The CPS emphasizes that emollients are the cornerstone of therapy and that topical corticosteroid phobia leads to undertreated disease."
    difficulty: medium
    tags: [atopic-dermatitis, eczema, topical-corticosteroids, dupilumab, wet-wraps, CPS]
  - front: "What are the clinical subtypes of psoriasis, and what nail changes are characteristic?"
    back: "Subtypes: 1) Plaque (most common, 80–90%): well-demarcated erythematous plaques with silvery scale on extensor surfaces, scalp, sacrum. 2) Guttate: small drop-like lesions, often triggered by streptococcal pharyngitis. 3) Pustular: sterile pustules (localized palmoplantar or generalized von Zumbusch — medical emergency). 4) Erythrodermic: >90% body involvement, medical emergency (thermoregulatory failure). Nail changes: pitting, oil-drop spots, onycholysis, subungual hyperkeratosis, nail crumbling.\n\nPsoriasis affects 2–3% of Canadians. Nail involvement occurs in ~50% and is associated with psoriatic arthritis (check for it in all psoriasis patients). The Canadian Dermatology Association and Canadian Psoriasis Network advocate for early systemic therapy in moderate-to-severe disease, including biologics (TNF inhibitors, IL-17 and IL-23 inhibitors)."
    difficulty: medium
    tags: [psoriasis, plaque, guttate, pustular, erythrodermic, nail-pitting]
  - front: "Outline the treatment ladder for acne vulgaris from mild comedonal to severe nodulocystic."
    back: "Mild comedonal: topical retinoid (tretinoin, adapalene). Mild inflammatory: add topical benzoyl peroxide ± topical antibiotic (clindamycin). Moderate inflammatory: topical retinoid + benzoyl peroxide + oral antibiotic (doxycycline or minocycline, limit to 3 months). Moderate-severe (nodular): consider oral combined OCP (females) + above. Severe nodulocystic/treatment-resistant: oral isotretinoin (Accutane) 0.5–1 mg/kg/day for 4–6 months (cumulative dose 120–150 mg/kg).\n\nThe Canadian Acne Clinical Practice Guidelines emphasize topical retinoids as the foundation of acne therapy for all severities. Isotretinoin requires iPLEDGE-equivalent pregnancy prevention in Canada, monthly pregnancy tests, and monitoring of lipids and liver function. It is the only therapy that can induce prolonged remission in severe acne."
    difficulty: medium
    tags: [acne, isotretinoin, topical-retinoid, benzoyl-peroxide, treatment-ladder]
  - front: "Differentiate allergic contact dermatitis from irritant contact dermatitis. How is the diagnosis confirmed?"
    back: "Irritant contact dermatitis: direct damage to skin from an irritant (soaps, solvents, water), affects anyone with enough exposure, well-demarcated to area of contact, burning/stinging pain, more common than allergic. Allergic contact dermatitis: type IV (delayed) hypersensitivity, requires prior sensitization, can spread beyond contact area, intensely pruritic, vesicular/eczematous. Common allergens: nickel, poison ivy (urushiol), fragrances, rubber chemicals. Diagnosis confirmed by patch testing (standardized allergen panels applied to back for 48 hours, read at 48 and 96 hours).\n\nPatch testing is the gold standard for diagnosing allergic contact dermatitis and is performed in Canadian dermatology clinics using the TRUE test or expanded panels. The most common contact allergen in North America is nickel, followed by fragrance mix and balsam of Peru. Management includes allergen avoidance and topical corticosteroids."
    difficulty: medium
    tags: [contact-dermatitis, allergic, irritant, patch-testing, type-IV-hypersensitivity]
  - front: "A patient presents with annular, erythematous, scaly plaques with central clearing on the trunk. A KOH prep shows septate branching hyphae. What is the diagnosis and treatment?"
    back: "Tinea corporis (ringworm), a dermatophyte infection. Treatment: topical antifungals (terbinafine cream or azole cream for 2–4 weeks) for localized disease. For extensive, recurrent, or immunocompromised patients: oral terbinafine (250 mg/day for 2–4 weeks) or oral itraconazole.\n\nDermatophyte infections are classified by body site: tinea corporis (body), tinea pedis (feet), tinea cruris (groin), tinea capitis (scalp — requires oral therapy as topicals do not penetrate hair follicle). KOH preparation is the rapid, inexpensive diagnostic test. In Canada, tinea capitis is most commonly caused by Trichophyton tonsurans, which does not fluoresce under Wood lamp."
    difficulty: easy
    tags: [tinea-corporis, dermatophyte, KOH-prep, terbinafine, fungal-infection]
  - front: "A child presents with a scaly, alopecic patch on the scalp with broken hairs and posterior cervical lymphadenopathy. KOH prep of hair shows endothrix spores. What is the diagnosis and why is oral therapy required?"
    back: "Tinea capitis. Oral therapy is required because topical antifungals cannot penetrate the hair follicle to eradicate the infection. First-line: oral griseofulvin (20–25 mg/kg/day microsize for 6–8 weeks) or oral terbinafine. Adjunct: antifungal shampoo (selenium sulfide or ketoconazole) to reduce transmission.\n\nTinea capitis is most common in prepubertal children. In Canada, Trichophyton tonsurans is the predominant pathogen, unlike in Europe (Microsporum canis). A kerion (boggy, inflammatory mass) is an intense inflammatory response and still requires oral antifungal, not incision and drainage. The CPS recommends oral griseofulvin as first-line for children."
    difficulty: medium
    tags: [tinea-capitis, griseofulvin, oral-antifungal, endothrix, scalp-alopecia]
  - front: "Differentiate a maculopapular drug eruption from Stevens-Johnson syndrome (SJS) and toxic epidermal necrolysis (TEN). What are the most common offending drugs?"
    back: "Maculopapular drug eruption: most common drug rash (>90%), diffuse symmetric erythematous macules/papules, mild pruritus, no mucosal involvement, self-limited after drug cessation. SJS: mucosal involvement (≥2 sites), targetoid lesions, epidermal detachment <10% BSA, fever, painful skin. TEN: same spectrum as SJS but epidermal detachment >30% BSA; mortality 25–35%. SJS/TEN overlap: 10–30% BSA. Common offenders: sulfonamides (TMP-SMX), anticonvulsants (carbamazepine, phenytoin, lamotrigine), allopurinol, NSAIDs, nevirapine.\n\nSJS/TEN is a dermatologic emergency requiring ICU/burn unit care. Management includes immediate discontinuation of the offending drug, supportive care (wound care, fluids, pain management), and ophthalmology consultation (ocular involvement is common and can cause blindness). In Canada, the DRESS/SJS/TEN pharmacovigilance registry helps track these serious adverse drug reactions."
    difficulty: hard
    tags: [drug-eruption, SJS, TEN, sulfonamides, anticonvulsants, dermatologic-emergency]
  - front: "What is the SCORTEN prognostic score used for, and what are its parameters?"
    back: "SCORTEN predicts mortality in SJS/TEN. Seven parameters (1 point each): age >40, malignancy, heart rate >120, initial BSA epidermal detachment >10%, BUN >28 mg/dL (>10 mmol/L), glucose >252 mg/dL (>14 mmol/L), bicarbonate <20 mEq/L. Mortality by score: 0–1 = 3.2%, 2 = 12.1%, 3 = 35.3%, 4 = 58.3%, ≥5 = >90%.\n\nSCORTEN should be calculated within 24 hours of admission and again on day 3, as initial BSA detachment often underestimates final extent. Early transfer to a burn unit or ICU with experience in TEN management improves outcomes. Canadian centres such as the Ross Tilley Burn Centre (Sunnybrook, Toronto) are referral sites for severe TEN cases."
    difficulty: hard
    tags: [SCORTEN, SJS-TEN, mortality-prediction, burn-unit, dermatologic-emergency]
  - front: "What are the different types of wound closure, and when is each appropriate?"
    back: "Primary closure (primary intention): wound edges approximated immediately; clean wounds <6–8 hours old (face <24 hours due to good blood supply). Secondary intention: wound left open to heal by granulation; contaminated wounds, abscess cavities, bite wounds with infection risk. Delayed primary closure (tertiary intention): wound left open initially, closed at 3–5 days once infection risk has passed; contaminated wounds requiring debridement. Techniques: sutures, staples, tissue adhesive (Dermabond), adhesive strips (Steri-Strips).\n\nThe choice of closure depends on wound age, contamination, location, and tension. Canadian emergency medicine guidelines recommend tissue adhesive for low-tension lacerations in cooperative patients. All wounds require irrigation (normal saline under pressure) prior to closure to reduce infection rates. Assess for neurovascular and tendon injury before closing."
    difficulty: easy
    tags: [wound-closure, primary-intention, secondary-intention, sutures, tissue-adhesive]
  - front: "When is tetanus prophylaxis indicated for wound management in Canada?"
    back: "Clean minor wounds: Td/Tdap booster only if >10 years since last dose. All other wounds (contaminated, puncture, crush, devitalized tissue): Td/Tdap if >5 years since last dose. If primary series incomplete or unknown: give Td/Tdap PLUS tetanus immunoglobulin (TIG 250 IU IM) for tetanus-prone wounds. Complete the primary series (3 doses total).\n\nThe Canadian Immunization Guide provides the tetanus prophylaxis algorithm. In Canada, routine boosters are given at ages 14–16 (Tdap) and then Td every 10 years. TIG provides passive immunity and should be given at a separate anatomic site from the vaccine. All puncture wounds, wounds with devitalized tissue, and wounds >6 hours old are considered tetanus-prone."
    difficulty: easy
    tags: [tetanus-prophylaxis, TIG, Tdap, wound-management, Canadian-Immunization-Guide]
  - front: "A patient presents with a cat bite wound on the hand. What organisms are of concern and what is the management?"
    back: "Cat bites have a high infection rate (30–50%) due to deep puncture inoculation of bacteria. Primary concern: Pasteurella multocida (rapid onset cellulitis within 24 hours). Also: S. aureus, Streptococci, anaerobes, Bartonella henselae (cat scratch disease). Management: thorough irrigation, do NOT suture (high infection risk, except face), prophylactic antibiotics: amoxicillin-clavulanate (first-line), update tetanus if needed, assess rabies risk.\n\nCat bite infections progress rapidly due to Pasteurella. Hand bites are particularly dangerous due to proximity to joints, tendons, and bone. The Public Health Agency of Canada recommends assessing rabies risk for all animal bites, and local public health units maintain protocols for rabies post-exposure prophylaxis. Dog bites have lower infection rates (~5–10%) but more tissue damage."
    difficulty: medium
    tags: [cat-bite, Pasteurella, amoxicillin-clavulanate, bite-wound, rabies-prophylaxis]
  - front: "A patient with psoriasis develops painful, swollen DIP joints with nail pitting. What is the diagnosis and the key clinical features distinguishing it from rheumatoid arthritis?"
    back: "Psoriatic arthritis (PsA). Key distinguishing features from RA: DIP joint involvement (RA spares DIP), dactylitis (sausage digits), enthesitis (Achilles, plantar fascia), asymmetric oligoarthritis (though can be symmetric), nail changes (pitting, onycholysis), negative RF (seronegative), association with skin psoriasis, axial involvement (sacroiliitis). X-ray: pencil-in-cup deformity, periostitis.\n\nPsoriatic arthritis affects up to 30% of psoriasis patients. The Canadian Rheumatology Association recommends screening all psoriasis patients for joint symptoms. Treatment includes NSAIDs for mild disease, DMARDs (methotrexate) for moderate, and biologics (TNF inhibitors, IL-17 inhibitors such as secukinumab, IL-23 inhibitors) for moderate-to-severe PsA."
    difficulty: medium
    tags: [psoriatic-arthritis, DIP-joints, dactylitis, enthesitis, nail-pitting, seronegative]
  - front: "Describe the isotretinoin prescribing requirements in Canada and key side effects to monitor."
    back: "Requirements: pregnancy prevention (two forms of contraception in females of childbearing potential), monthly pregnancy tests (before, during, and 1 month after treatment), informed consent, baseline and periodic labs (lipids, liver enzymes, CBC). Key side effects: teratogenicity (category X — absolute contraindication in pregnancy), mucocutaneous dryness (lips, skin, eyes), elevated triglycerides, transaminitis, myalgias, mood changes (monitor for depression), pseudotumor cerebri (especially with concurrent tetracyclines — contraindicated combination).\n\nIsotretinoin is the most effective treatment for severe nodulocystic acne, with 60–80% achieving long-term remission. Health Canada mandates pregnancy prevention programs. The association with depression/suicide remains debated; the CDA recommends counselling patients about mood changes and monitoring. Concurrent vitamin A supplementation is contraindicated."
    difficulty: medium
    tags: [isotretinoin, Accutane, teratogenicity, pregnancy-prevention, acne, Health-Canada]
  - front: "A patient presents with painful grouped vesicles on an erythematous base in a dermatomal distribution on the trunk. What is the diagnosis, treatment, and the indication for the shingles vaccine in Canada?"
    back: "Herpes zoster (shingles), caused by reactivation of varicella-zoster virus (VZV). Treatment: oral valacyclovir 1000 mg TID or acyclovir 800 mg 5×/day for 7 days, ideally within 72 hours of rash onset. Pain management: acetaminophen, NSAIDs, gabapentin/pregabalin for post-herpetic neuralgia (PHN). Vaccination: Shingrix (recombinant adjuvanted vaccine) recommended for adults ≥50 years (2 doses, 2–6 months apart); also recommended for immunocompromised adults ≥18 years.\n\nThe National Advisory Committee on Immunization (NACI) recommends Shingrix over the older live Zostavax vaccine due to superior efficacy (>90% vs ~50%) and durability. Post-herpetic neuralgia is the most common complication, occurring in 10–18% of cases (higher risk with age). Ophthalmic zoster (V1 distribution) requires urgent ophthalmology referral."
    difficulty: medium
    tags: [herpes-zoster, shingles, valacyclovir, Shingrix, post-herpetic-neuralgia, NACI]
  - front: "What layers does the skin epidermis derive from embryologically, and which layer does the dermis derive from?"
    back: "The epidermis derives from ectoderm. The dermis derives from mesoderm (mesenchymal cells).\n\nUnderstanding embryological skin origins is relevant for explaining skin disease patterns. Ectoderm gives rise to keratinocytes, hair follicles, sebaceous glands, and eccrine glands; mesoderm gives rise to collagen-producing fibroblasts, blood vessels, and dermal structures."
    difficulty: easy
    tags: [dermatology, skin anatomy, embryology, ectoderm, mesoderm, epidermis]
  - front: "At what gestational age does keratinization of fetal skin begin, and when is the hair follicle primordium formed?"
    back: "Keratinization begins at approximately 9 weeks gestation. The primordial hair follicle forms from the basal cell bud at approximately 14 weeks gestation.\n\nFetal skin development proceeds in a structured sequence: 2-layer skin at 4 weeks → keratinization at 9 weeks → hair follicle at 14 weeks → sebaceous gland at 18 weeks → eccrine gland at 23 weeks. Prematurity affects skin barrier function and permeability."
    difficulty: medium
    tags: [dermatology, fetal skin development, keratinization, hair follicle, embryology]
  - front: "What are the five layers of the epidermis from deepest to most superficial?"
    back: "Stratum basale → stratum spinosum → stratum granulosum → stratum lucidum → stratum corneum. Mnemonic: 'Canadians Lie Good Sushi Boxes' (Basale, spinosum, Granulosum, Lucidum, Corneum).\n\nThe epidermis is avascular and keratinocytes migrate from the stratum basale to the surface in approximately 4 weeks. The stratum lucidum is only present in thick skin (palms/soles)."
    difficulty: easy
    tags: [dermatology, skin anatomy, epidermis, histology]
  - front: "Which cells are found in the stratum basale of the epidermis?"
    back: "Keratinocytes (mitotic, youngest), melanocytes (keratinocyte:melanocyte ratio 10:1), and Merkel cells (touch sensation).\n\nMelanocyte number is equal among all races; differences in skin colour are due to the quantity and distribution of melanin produced. Merkel cells are mechanoreceptors involved in light touch sensation."
    difficulty: easy
    tags: [dermatology, epidermis, cells, melanocytes]
  - front: "What is the function of Langerhans cells in the skin?"
    back: "Langerhans cells are dendritic cells located in the epidermis that function in immune surveillance (antigen presentation).\n\nLangerhans cells are part of the skin's innate immune system and are important in allergic contact dermatitis and other immune-mediated skin conditions."
    difficulty: easy
    tags: [dermatology, immune cells, epidermis]
  - front: "What is the difference between the papillary and reticular layers of the dermis?"
    back: "Papillary dermis: superficial, contains capillaries supplying nutrients to the epidermis. Reticular dermis: deeper, provides structural strength via collagen bundles, elastic fibres, fibroblasts, and macrophages.\n\nThe dermis also contains mast cells (releasing histamine in type I hypersensitivity), blood vessels, nerves, pilosebaceous units, and sweat glands."
    difficulty: easy
    tags: [dermatology, dermis, skin anatomy]
  - front: "What is the difference between eccrine and apocrine sweat glands?"
    back: "Eccrine glands: found over entire skin surface (except lips, nail beds, glans penis); important for temperature regulation via sweating. Apocrine glands: found in axillae and perineum; empty into hair follicles; vestigial in humans (pheromone function in other species).\n\nEccrine glands are the primary mechanism of heat dissipation through evaporative cooling. Apocrine glands are NOT part of the pilosebaceous unit, unlike sebaceous glands."
    difficulty: easy
    tags: [dermatology, sweat glands, skin appendages]
  - front: "What are the four key functions of the skin?"
    back: "1. Protection (UV, mechanical/chemical, pathogens, dehydration) 2. Thermal regulation (vasoconstriction, sweating) 3. Sensation (touch, pain, temperature) 4. Metabolic function (vitamin D synthesis, energy storage as triglycerides).\n\nMelanin provides UV protection; lipid-rich barrier prevents dehydration; Langerhans cells provide immune surveillance. Vitamin D synthesis in the skin is a key metabolic function."
    difficulty: easy
    tags: [dermatology, skin function]
  - front: "How do you classify primary skin lesions by size and character?"
    back: "Flat: macule (<1 cm), patch (≥1 cm). Raised superficial: papule (<1 cm), plaque (≥1 cm). Deep palpable: nodule (<1 cm), tumour (≥1 cm). Elevated fluid-filled: vesicle (<1 cm), bulla (≥1 cm).\n\nDescribing lesions uses the SCALDA mnemonic: Size, Colour, Arrangement, Location, Distribution, Associated findings. Primary lesions are de-novo and unaltered."
    difficulty: easy
    tags: [dermatology, lesion morphology, primary lesions]
  - front: "What is lichenification and what condition is it classically associated with?"
    back: "Lichenification is thickening of the skin with accentuation of normal skin markings, classically associated with chronic atopic dermatitis (eczema) due to repeated rubbing/scratching.\n\nLichenification is a secondary lesion resulting from chronic mechanical trauma to skin. It reflects epidermal hyperplasia and is a hallmark of chronically pruritic conditions."
    difficulty: easy
    tags: [dermatology, lichenification, atopic dermatitis, secondary lesions]
  - front: "What is the difference between petechiae, purpura, and ecchymosis?"
    back: "Petechiae: pinpoint (<3 mm), non-blanchable hemorrhagic lesions. Purpura: 3 mm–1 cm, non-blanchable. Ecchymosis (bruise): >1 cm. All are non-blanchable due to extravasated blood in the dermis.\n\nNon-blanchability distinguishes these from vascular lesions (telangiectasias, hemangiomas) which blanch with pressure. Petechiae can signal thrombocytopenia, vasculitis, or meningococcemia."
    difficulty: easy
    tags: [dermatology, petechiae, purpura, ecchymosis, lesion morphology]
  - front: "What is a wheal and what condition is it classically associated with?"
    back: "A wheal is a transient (<24 h), blanchable, raised lesion with a halo and central clearing caused by dermal oedema. It is classically associated with urticaria.\n\nWheals are caused by histamine release from mast cells leading to local oedema. Their transient nature (<24 h) and blanchability distinguish them from fixed lesions like plaques."
    difficulty: easy
    tags: [dermatology, wheal, urticaria, morphology]
  - front: "What is the Koebner phenomenon and which dermatoses exhibit it?"
    back: "The Koebner (isomorphic) phenomenon is the appearance of new skin lesions at sites of trauma or injury. Classic examples: lichen planus, psoriasis, and vitiligo.\n\nThe Koebner phenomenon is important clinically as it means trauma (scratching, surgery, sunburn) can induce new lesions. Recognizing this pattern helps identify the underlying dermatosis."
    difficulty: medium
    tags: [dermatology, Koebner phenomenon, psoriasis, lichen planus, vitiligo]
  - front: "What are the clinical features of seborrheic keratosis?"
    back: "Well-demarcated, waxy papule/plaque with a classic 'stuck on' appearance; may be pigmented, warty, or greasy over time. Sites: face, trunk, upper extremities (NOT palms or soles). Benign keratinocyte/melanocyte proliferation.\n\nSeborrheic keratoses are very common in those over 30 years, more common in men, and have autosomal dominant inheritance. Biopsy only if diagnosis is uncertain. Cosmetic treatment: cryotherapy, electrodessication, shave excision."
    difficulty: easy
    tags: [dermatology, seborrheic keratosis, benign skin tumour]
  - front: "How do you differentiate a corn, wart, and callus on the foot?"
    back: "Corn: firm, translucent keratinous core; painful with direct pressure; preserves dermatoglyphics. Wart: bleeds with paring, black speckles (thrombosed capillaries), destroys dermatoglyphics. Callus: layers of yellowish keratin; no disruption of epidermal ridges.\n\nDermatoglyphics (fingerprint ridges) are preserved in corns and calluses but destroyed by warts. This distinction is diagnostically helpful when examining hyperkeratotic foot lesions."
    difficulty: medium
    tags: [dermatology, corn, wart, callus, hyperkeratosis]
  - front: "What distinguishes a keloid from a hypertrophic scar?"
    back: "Keloid: extends BEYOND the margins of the original injury, with claw-like extensions; can continue expanding for years. Hypertrophic scar: confined to the original margins of injury.\n\nKeloids are most common in Black patients and Asian patients, typically between ages 10–30. Management includes intralesional steroids, silicone gel sheets, and excision (though keloids often recur after excision)."
    difficulty: easy
    tags: [dermatology, keloid, hypertrophic scar, scarring]
  - front: "What is an epidermal cyst and how does it present?"
    back: "Epidermal cyst: round, yellow/flesh-coloured, slow-growing, mobile, firm, fluctuant nodule with a central punctum. Contents are keratinous debris with foul cheesy odour on rupture. The most common cutaneous cyst.\n\nEpidermal cysts form from displaced epithelial cells in the dermis. Rupture leads to a foreign body inflammatory reaction. Elective excision is definitive; no treatment needed unless symptomatic."
    difficulty: easy
    tags: [dermatology, epidermal cyst, cysts]
  - front: "What is a pilar (trichilemmal) cyst and how does it differ from an epidermal cyst?"
    back: "Pilar cyst: multiple, hard nodules under the SCALP; lacks central punctum; filled with dense keratin. Second most common cutaneous cyst. More commonly in women; hereditary tendency.\n\nUnlike epidermal cysts, pilar cysts have no central punctum and are most commonly found on the scalp. They are lined with stratified squamous epithelium without a granular layer."
    difficulty: easy
    tags: [dermatology, pilar cyst, trichilemmal cyst, scalp]
  - front: "What is a dermatofibroma and what clinical sign confirms the diagnosis?"
    back: "Dermatofibroma: firm, skin-coloured to red-brown dermal papule/nodule, often on legs. The dimple sign (Fitzpatrick's sign): lateral compression causes dimpling of the lesion.\n\nDermatofibromas are benign fibroblast proliferations, more common in adult women, often following minor trauma or insect bites. Eruptive dermatofibromas may be associated with SLE. No treatment required; excision if bothersome."
    difficulty: easy
    tags: [dermatology, dermatofibroma, fibrous lesion, Fitzpatrick sign]
  - front: "What are skin tags (acrochordons) and who is at risk?"
    back: "Skin tags: small (1–10 mm), soft, pedunculated papules on eyelids, neck, axillae, inframammary, and groin. Risk factors: middle-aged/elderly, obesity, female sex, pregnancy.\n\nSkin tags are benign outgrowths of skin and increase in size/number during pregnancy. They can be associated with insulin resistance/type 2 diabetes. Management: snip excision, electrodessication, or cryosurgery."
    difficulty: easy
    tags: [dermatology, skin tags, acrochordon, benign lesion]
  - front: "What is the significance of café-au-lait macules and how many are required to suggest neurofibromatosis type 1?"
    back: "Café-au-lait macules are flat, light-brown lesions. Six or more café-au-lait macules (each >5 mm prepubertal, >15 mm postpubertal) is suggestive of neurofibromatosis type 1 (NF1). Also associated with McCune-Albright syndrome.\n\nCafé-au-lait macules result from increased melanogenesis. In NF1, they are one of the major diagnostic criteria (along with Lisch nodules, axillary freckling, neurofibromas, optic glioma, and family history)."
    difficulty: medium
    tags: [dermatology, cafe-au-lait, neurofibromatosis, NF1, congenital pigmented lesion]
  - front: "What are the three stages of acquired nevomelanocytic nevi evolution?"
    back: "1. Junctional NMN (childhood): flat, melanocytes at dermal-epidermal junction. 2. Compound NMN (any age): domed papule, melanocytes at junction AND migrating into dermis. 3. Dermal NMN (adults): soft dome-shaped papule, melanocytes exclusively in dermis.\n\nAcquired nevi evolve from junctional to compound to dermal over time. Compound and dermal nevi are NOT found on palms or soles. New or changing nevi require evaluation for atypical features."
    difficulty: medium
    tags: [dermatology, melanocytic nevi, junctional, compound, dermal nevus]
  - front: "What is melasma, who is it most common in, and how is it treated?"
    back: "Melasma: symmetrical hyperpigmentation on sun-exposed areas of the face (forehead, upper lip, cheeks, chin). Most common in women, during pregnancy, or with OCP/HRT use. Treatment: tinted mineral sunscreen, hydroquinone, azelaic acid, retinoic acid, TCS, chemical peels.\n\nMelasma is driven by oestrogen and progesterone stimulating melanocyte activity, worsened by sun exposure. It is very difficult to treat and can recur. Camouflage makeup may be helpful adjunctively."
    difficulty: medium
    tags: [dermatology, melasma, hyperpigmentation, pregnancy, OCP]
  - front: "What is the difference between ephelides (freckles) and solar lentigines (liver spots)?"
    back: "Ephelides (freckles): small (<5 mm) light-brown macules, common in skin phototypes I–II, darken with sun, fade in winter, no treatment required. Solar lentigines: well-demarcated brown/black macules in adults >40 years, benign, treated with laser or cryotherapy.\n\nBoth represent sun-related pigmented changes, but solar lentigines persist regardless of sun exposure (unlike freckles) and are more common in fair-skinned adults. Both must be distinguished from lentigo maligna."
    difficulty: easy
    tags: [dermatology, freckles, solar lentigo, hyperpigmentation]
  - front: "What is a halo nevus and is it associated with any systemic condition?"
    back: "Halo nevus: typical nevus surrounded by a ring of depigmentation. Common in children. Uncommonly associated with vitiligo. No treatment required unless irregular colour or borders are noted.\n\nThe depigmented halo around a nevus reflects immune-mediated destruction of melanocytes. While usually benign, its association with vitiligo means that investigating for other autoimmune conditions may be warranted."
    difficulty: easy
    tags: [dermatology, halo nevus, vitiligo, pigmented lesion]
  - front: "What distinguishes vascular tumours from vascular malformations?"
    back: "Vascular tumours (e.g., hemangiomas): endothelial hyperplasia, usually postnatal onset, M:F = 1:3–5, undergo phases (proliferating → involuting → involuted). Vascular malformations: congenital malformation with normal endothelial turnover, 100% present at birth, M:F = 1:1, proportionate growth.\n\nThis distinction is critical for management: hemangiomas often regress spontaneously (propranolol can accelerate involution), while vascular malformations do not involute and may require intervention."
    difficulty: medium
    tags: [dermatology, hemangioma, vascular malformation, vascular lesion]
  - front: "What is a bullous lesion and which conditions characteristically cause bulla formation?"
    back: "Bulla: elevated fluid-filled lesion ≥1 cm in diameter. Autoimmune causes: bullous pemphigoid, pemphigus vulgaris. Infectious: bullous impetigo. Drug reactions: fixed drug eruption, SJS/TEN. Other: dermatitis herpetiformis, porphyria cutanea tarda.\n\nDifferentiating the level of cleavage (intraepidermal vs. subepidermal) and serology (anti-desmoglein for pemphigus, anti-BP230/BP180 for pemphigoid) guides diagnosis and management."
    difficulty: medium
    tags: [dermatology, bulla, bullous pemphigoid, pemphigus, SJS, drug reaction]
  - front: "What are the key features that differentiate an open comedone (blackhead) from a closed comedone (whitehead)?"
    back: "Open comedone (blackhead): pore is open, oxidized sebum/keratin gives dark appearance. Closed comedone (whitehead): pore is closed by skin, contents appear white/flesh-coloured. Both are non-inflammatory acne lesions.\n\nComedones are the primary lesions of acne vulgaris, representing collections of sebum and keratin in the pilosebaceous unit. Comedonal acne responds to topical retinoids."
    difficulty: easy
    tags: [dermatology, comedone, acne, morphology]
  - front: "What pattern of skin lesion distribution is seen in cutaneous larva migrans?"
    back: "Cutaneous larva migrans shows a serpiginous ('snake-like') pattern of lesions, representing the migratory track of hookworm larvae through the skin.\n\nSerpiginous distribution is a key pattern to recognize. Cutaneous larva migrans (typically Ancylostoma braziliense) is treated with ivermectin or albendazole."
    difficulty: medium
    tags: [dermatology, cutaneous larva migrans, serpiginous, distribution pattern, parasitic infection]
  - front: "A patient develops targetoid (bullseye) skin lesions. What is the differential diagnosis?"
    back: "Target/targetoid concentric ring lesions: erythema multiforme (EM), urticaria, SJS/TEN.\n\nErythema multiforme (often triggered by HSV or mycoplasma) classically shows target lesions. SJS/TEN are severe drug reactions. Urticaria can also show target-like wheals. Distinguishing these is critical for management."
    difficulty: medium
    tags: [dermatology, target lesion, erythema multiforme, SJS, TEN, urticaria]
  - front: "What skin lesion follows a 'drop-like' pattern and what classic dermatosis is it associated with?"
    back: "Guttate pattern ('drop-like'): classic in guttate psoriasis, typically triggered by streptococcal pharyngitis in children and young adults.\n\nGuttate psoriasis presents with numerous small (<1 cm) scaly papules scattered over the trunk and extremities after a streptococcal throat infection. It may be self-limiting or progress to chronic plaque psoriasis."
    difficulty: medium
    tags: [dermatology, guttate psoriasis, distribution pattern, streptococcal]
  - front: "What is Becker's nevus and who does it typically affect?"
    back: "Becker's nevus: hairy, light-brown macule/patch with papular verrucous surface on the trunk and shoulders. Affects males more than females, becoming noticeable at puberty. A pigmented hamartoma with increased basal cell melanin.\n\nBecker's nevus is usually too large to remove and is managed cosmetically. Hair growth follows onset of pigmentation. It should be distinguished from hairy congenital melanocytic nevi."
    difficulty: medium
    tags: [dermatology, Beckers nevus, pigmented lesion, adolescent]
  - front: "What is the pathophysiology of Bullous Pemphigoid and what antibodies are involved?"
    back: "IgG antibodies against dermal-epidermal basement membrane hemidesmosome proteins BP180 and/or BP230, leading to subepidermal bullae formation.\n\nBullous pemphigoid is the most common autoimmune blistering disease in older adults (mean age 60-80). Immunofluorescence shows linear IgG and C3 along the basement membrane zone."
    difficulty: easy
    tags: [bullous pemphigoid, autoimmune, blistering, BP180, BP230, hemidesmosome]
  - front: "How do you distinguish Bullous Pemphigoid from Pemphigus Vulgaris clinically?"
    back: "Bullous Pemphigoid: tense subepidermal bullae, no Nikolsky sign, elderly patients, less mucosal involvement. Pemphigus Vulgaris: flaccid intraepidermal bullae, positive Nikolsky sign, 15-50 yr, extensive mucosal involvement (90% oral).\n\nThe mnemonic 'PemphigoiD = Deeper, tense lesions at the dermal-epidermal junction' vs 'Vulgaris = Superficial, intraepidermal, flaccid lesions' helps differentiate. The level of split determines the clinical appearance."
    difficulty: easy
    tags: [bullous pemphigoid, pemphigus vulgaris, Nikolsky sign, blistering disease, differential]
  - front: "What is the first-line management for Bullous Pemphigoid?"
    back: "Prednisone 0.5-1 mg/kg/day until clear, then taper, plus steroid-sparing agents (azathioprine, cyclosporine, mycophenolate mofetil). Potent topical corticosteroids (clobetasol) may be as effective for limited disease.\n\nFor refractory cases, IVIg, rituximab, dupilumab, or omalizumab may be used. Bullous pemphigoid typically heals without scarring and is rarely fatal."
    difficulty: medium
    tags: [bullous pemphigoid, prednisone, clobetasol, azathioprine, management]
  - front: "What antibodies are involved in Pemphigus Vulgaris and what is the immunofluorescence pattern?"
    back: "IgG antibodies against epidermal desmoglein-1 and desmoglein-3, causing loss of intercellular adhesion. Immunofluorescence shows intraepidermal IgG and C3 deposition ('tombstone' or 'chicken wire' pattern).\n\nCirculating serum anti-desmoglein IgG antibodies can also be detected. Lesions heal with hyperpigmentation but without scarring; may be fatal without immunosuppression."
    difficulty: medium
    tags: [pemphigus vulgaris, desmoglein, IgG, immunofluorescence, desmosomes]
  - front: "What is the management of Pemphigus Vulgaris?"
    back: "Prednisone 1-2 mg/kg until no new blisters, then 1-1.5 mg/kg until clear, then taper. Add steroid-sparing agents: azathioprine, cyclophosphamide, cyclosporine, IVIg, mycophenolate mofetil, or rituximab.\n\nPemphigus Vulgaris is potentially fatal if untreated; aggressive immunosuppression is required. Rituximab is increasingly used as a steroid-sparing agent."
    difficulty: medium
    tags: [pemphigus vulgaris, prednisone, rituximab, azathioprine, immunosuppression]
  - front: "What is the pathophysiology and cutaneous finding in Dermatitis Herpetiformis?"
    back: "Transglutaminase IgA deposits in the skin (alone or in immune complexes), leading to eosinophil and neutrophil infiltration. Presents as grouped, bilaterally symmetrical pruritic papules/vesicles on extensor surfaces (elbows, knees, sacrum, buttocks, scalp).\n\nAlmost all patients carry HLA-DQ2 or DQ8. 90% have gluten-sensitive enteropathy; untreated comorbid celiac disease increases risk of intestinal lymphoma."
    difficulty: medium
    tags: [dermatitis herpetiformis, IgA, gluten, celiac disease, transglutaminase, HLA-DQ2]
  - front: "How is Dermatitis Herpetiformis managed?"
    back: "Dapsone (or sulfapyridine if intolerant) for skin symptoms, plus lifelong gluten-free diet to reduce risk of intestinal lymphoma.\n\nImmunofluorescence of perilesional skin shows IgA deposits. A gluten-free diet can reduce lymphoma risk associated with untreated celiac disease."
    difficulty: easy
    tags: [dermatitis herpetiformis, dapsone, gluten-free diet, celiac disease, lymphoma prevention]
  - front: "What are the clinical features and pathophysiology of Porphyria Cutanea Tarda?"
    back: "Skin fragility with tense vesicles/bullae on photo-exposed areas (dorsum of hands, nose, upper trunk), scarring, milia, periorbital violaceous discoloration, facial hypertrichosis. Caused by uroporphyrinogen decarboxylase deficiency leading to excess heme precursors.\n\nAssociated triggers include alcohol, estrogen therapy, NSAIDs, HIV, hepatitis C, hemochromatosis, and DM. Urine shows orange-red fluorescence under Wood's lamp."
    difficulty: medium
    tags: [porphyria cutanea tarda, uroporphyrinogen decarboxylase, photosensitivity, blistering, Woods lamp]
  - front: "What is the management of Porphyria Cutanea Tarda?"
    back: "Discontinue aggravating substances (alcohol, estrogen therapy), phlebotomy to decrease body iron load, and low-dose hydroxychloroquine.\n\nPhlebotomy reduces iron stores which exacerbate the enzyme deficiency. Hydroxychloroquine binds uroporphyrins and promotes their excretion. Investigations include 24h urine elevated uroporphyrins and elevated stool coproporphyrins."
    difficulty: medium
    tags: [porphyria cutanea tarda, phlebotomy, hydroxychloroquine, iron, management]
  - front: "What is Ichthyosis Vulgaris and how is it inherited?"
    back: "Autosomal dominant disorder caused by loss-of-function variants in the filaggrin gene (FLG), causing reduced filaggrin protein and abnormal retention of keratinocytes (hyperkeratosis). Presents as xerosis with fine scaling and large adherent 'fish scales'; spares flexural creases.\n\nIncidence 1:100-1:250. Associated with atopic dermatitis and keratosis pilaris. Improves in summer and with humidity. Management: emollients, humectants, urea or hydroxy acid-containing creams; intermittent systemic retinoids for severe cases."
    difficulty: medium
    tags: [ichthyosis vulgaris, filaggrin, FLG, autosomal dominant, keratosis pilaris]
  - front: "What systemic conditions are associated with Neurofibromatosis Type 1?"
    back: "Pheochromocytoma, astrocytoma, bilateral acoustic neuromas, bone cysts, scoliosis, precocious puberty, developmental delay, and renal artery stenosis.\n\nNF1 results from pathogenic variants in the neurofibromin gene, causing abnormal proliferation of neural crest elements (Schwann cells, melanocytes). Annual follow-up is recommended for brain tumours (astrocytoma)."
    difficulty: medium
    tags: [neurofibromatosis, NF1, pheochromocytoma, astrocytoma, renal artery stenosis]
  - front: "What autoimmune conditions should be screened for in vitiligo?"
    back: "Thyroid disease, pernicious anemia, Addison's disease, and Type 1 Diabetes Mellitus (T1DM).\n\nVitiligo affects 1:100 with 30% positive family history. It results from autoimmune destruction of melanocytes, presenting as sharply demarcated depigmented white patches. Wood's lamp examination shows porcelain white discoloration (amelanosis)."
    difficulty: easy
    tags: [vitiligo, autoimmune, thyroid disease, Addisons disease, pernicious anemia, T1DM]
  - front: "What are the treatment options for vitiligo?"
    back: "Sun avoidance/protection, topical calcineurin inhibitors (tacrolimus, pimecrolimus) or topical corticosteroids, PUVA or narrowband UVB (NB-UVB), topical ruxolitinib (JAK inhibitor) for nonsegmental vitiligo ≥12 years. Camouflage and bleaching with monobenzyl ether of hydroquinone 20% for widespread depigmentation.\n\nSystematic reviews favor NB-UVB over PUVA and combination therapy over monotherapy. Topical ruxolitinib is newly approved (pending Canadian approval as of this writing). NB-UVB has fewer side effects than PUVA."
    difficulty: medium
    tags: [vitiligo, NB-UVB, PUVA, tacrolimus, ruxolitinib, JAK inhibitor]
  - front: "How does erysipelas differ from cellulitis clinically and microbiologically?"
    back: "Erysipelas: upper dermis, GAS only, confluent erythematous SHARPLY RAISED well-demarcated plaque, very painful, spreads via lymphatics, often facial/leg. Cellulitis: lower dermis/subcutaneous fat, GAS + S. aureus, POORLY demarcated flat lesion with vesicles, more commonly legs.\n\nBoth are clinical diagnoses. Key distinction is the raised, sharp border of erysipelas vs the flat, poorly defined border of cellulitis. First-line treatment for erysipelas is penicillin or cephalexin; for cellulitis, cloxacillin or cefazolin/cephalexin."
    difficulty: easy
    tags: [erysipelas, cellulitis, GAS, S. aureus, skin infection, differential diagnosis]
  - front: "What is the first-line antibiotic treatment for non-purulent cellulitis?"
    back: "Cloxacillin or cefazolin/cephalexin (covers GAS and S. aureus). For MRSA-positive or hospitalized patients: vancomycin. In children: cefuroxime. For diabetic foot infections: TMP/SMX and metronidazole.\n\nCellulitis involves the lower dermis and subcutaneous fat, most commonly caused by GAS and S. aureus. Haemophilus influenzae is a cause in periorbital cellulitis. Pasteurella multocida is seen in dog/cat bite infections."
    difficulty: easy
    tags: [cellulitis, cloxacillin, cephalexin, MRSA, vancomycin, diabetic foot]
  - front: "What is the management of impetigo?"
    back: "Localized: topical antibiotics (mupirocin 2% or fusidic acid 2% TID for 7-10 days after resolution, or ozenaxacin 1% cream BID for 5 days). Extensive: systemic antibiotics (dicloxacillin or cephalexin for 7-10 days).\n\nImpetigo is caused by GAS, S. aureus, or both. It presents as golden yellow 'honey-crusted' lesions on the face, arms, legs, and buttocks. Fusidic acid 2% is available in Canada (not available in the USA)."
    difficulty: easy
    tags: [impetigo, mupirocin, fusidic acid, GAS, S. aureus, honey-crusted]
  - front: "What are the differences among superficial folliculitis, furuncles, and carbuncles?"
    back: "Superficial folliculitis: superficial infection of hair follicle, dome-shaped pustule at follicle mouth, treated with topical antibiotics. Furuncles (boils): deeper, red tender nodule with central pustule involving subcutaneous tissue, caused by S. aureus, treat with incision and drainage ± oral antibiotics. Carbuncles: multiple coalescing furuncles draining through multiple openings, systemic symptoms possible.\n\nHot tub folliculitis is caused by Pseudomonas. Furuncles near the external auditory canal or nose, or with surrounding cellulitis, require oral cloxacillin or cephalexin for 1-2 weeks."
    difficulty: easy
    tags: [folliculitis, furuncle, carbuncle, S. aureus, incision and drainage]
  - front: "When are antibiotics indicated for skin abscesses after incision and drainage?"
    back: "Antibiotics are indicated for: severe local infection, systemic signs of infection, history of multiple/recurrent abscesses, underlying comorbidities, immunosuppression, failure of initial therapy, extremes of age, special exposures (e.g. animal bites), or prophylaxis against infective endocarditis.\n\nClinical trial evidence shows clindamycin or TMP-SMX after incision and drainage improves short-term cure rates for simple abscesses (83% vs 68% placebo). Culture is not required in healthy patients not receiving antibiotics."
    difficulty: medium
    tags: [skin abscess, incision and drainage, antibiotics, clindamycin, TMP-SMX, MRSA]
  - front: "What is the KOH preparation used for in dermatology and what does it detect?"
    back: "Potassium hydroxide (KOH) preparation of skin scrapings, hair, or nail clippings dissolves keratin and allows microscopic visualization of fungal hyphae and mycelia, confirming dermatophyte infections.\n\nKOH prep is the primary investigation for dermatophytoses (tinea infections). Wood's lamp shows green fluorescence only for Microsporum infections (not Trichophyton). Culture on Sabouraud's agar can identify species."
    difficulty: easy
    tags: [KOH preparation, dermatophyte, tinea, fungal infection, hyphae]
  - front: "What are the first-line treatments for tinea corporis, tinea cruris, and tinea pedis?"
    back: "Topical antifungals as first-line: clotrimazole, ketoconazole, terbinafine, or ciclopirox olamine cream applied BID for 2-4 weeks.\n\nOral therapy is reserved for onychomycosis and tinea capitis (which requires oral agents to penetrate the hair root). Topical agents are inadequate for nail/hair infections."
    difficulty: easy
    tags: [tinea corporis, tinea cruris, tinea pedis, clotrimazole, terbinafine, antifungal]
  - front: "What is the treatment of tinea capitis and why must it be oral?"
    back: "Oral terbinafine (Lamisil) for 4 weeks. Oral agents are required because the dermatophyte resides in the hair root where topical agents cannot penetrate. Adjunctive antifungal shampoos (selenium sulfide 2.5%, ketoconazole, ciclopirox) can help prevent spread.\n\nTinea capitis primarily affects children (mainly Black children) and immunocompromised adults. Wood's lamp shows green fluorescence only for Microsporum (not Trichophyton). Kerion (boggy purulent nodule) can lead to scarring."
    difficulty: easy
    tags: [tinea capitis, terbinafine, oral antifungal, kerion, Microsporum, Trichophyton]
  - front: "What is the treatment of onychomycosis (tinea unguium)?"
    back: "Oral: terbinafine (Lamisil) — 6 weeks for fingernails, 12 weeks for toenails; or itraconazole (Sporanox) pulse dosing (7 days on, 3 weeks off: 2 pulses for fingernails, 3 pulses for toenails). Topical: ciclopirox nail lacquer or efinaconazole (Jublia) for 48 weeks.\n\nT. rubrum causes 90% of toenail infections. Terbinafine is a CYP2D6 inhibitor with potential liver toxicity; itraconazole is a CYP3A4 inhibitor with potential liver toxicity. Topical agents alone are often insufficient."
    difficulty: medium
    tags: [onychomycosis, tinea unguium, terbinafine, itraconazole, T. rubrum, nail infection]
  - front: "What are the clinical features and treatment of Cutaneous Larva Migrans?"
    back: "Erythematous pruritic papules at site of initial infection progressing to serpiginous (winding) red pruritic lines as larvae migrate under the skin. Most common on feet, legs, buttocks. Caused by hookworm larvae (dog/cat feces). Self-limiting; consider anthelmintics and antihistamines.\n\nMost common in tropical or subtropical regions. The serpiginous track is pathognomonic. Anthelmintics such as ivermectin or albendazole can accelerate resolution."
    difficulty: easy
    tags: [cutaneous larva migrans, hookworm, serpiginous, parasitic infection, tropical disease]
  - front: "A 25-year-old presents with grouped, intensely pruritic vesicles on bilateral elbows and sacrum. Biopsy shows IgA deposits in perilesional skin. What is the diagnosis and associated systemic condition?"
    back: "Dermatitis Herpetiformis. Associated with gluten-sensitive enteropathy (celiac disease) — 90% have it, though only 20% have intestinal symptoms. HLA-DQ2 or DQ8 present in almost all cases.\n\nManagement is dapsone for skin disease and lifelong gluten-free diet to control both conditions and reduce the risk of intestinal lymphoma. Also check for associated thyroid disease (30%), iron/folate deficiency."
    difficulty: medium
    tags: [dermatitis herpetiformis, IgA, celiac disease, HLA-DQ2, dapsone, gluten-free diet]
  - front: "What organisms cause erysipelas and what are its first-line antibiotics?"
    back: "Caused by GAS (Group A Streptococcus). First-line: penicillin, cephalexin, cloxacillin, or cefazolin. Second-line: clindamycin. If allergic to penicillin: erythromycin.\n\nErysipelas involves the upper dermis and lymphatics, presenting as a sharply raised, well-demarcated, confluent erythematous plaque ('St. Anthony's fire'). Common sites: face and legs."
    difficulty: easy
    tags: [erysipelas, GAS, penicillin, cephalexin, streptococcus, skin infection]
  - front: "What are the key clinical features distinguishing a hemangioma of infancy from a port-wine stain (nevus flammeus)?"
    back: "Hemangioma of infancy appears shortly after birth, increases in size over months then regresses (50% resolve by age 5); port-wine stain is present at birth, follows a dermatomal distribution, never spontaneously regresses, and grows proportionally with the child.\n\nHemangiomas are benign vascular tumours with endothelial proliferation that involute; port-wine stains are congenital vascular malformations of dermal capillaries that are permanent. Sturge-Weber syndrome should be considered when port-wine stain involves V1/V2 distribution."
    difficulty: easy
    tags: [dermatology, vascular tumours, hemangioma, port-wine stain, pediatrics]
  - front: "When does a hemangioma of infancy require treatment?"
    back: "~10% require treatment due to functional impairment (visual compromise, airway obstruction, high-output cardiac failure) or cosmesis. Options: topical timolol, systemic propranolol, systemic corticosteroids, laser, or surgery. Provide early specialist referral for high-risk hemangiomas.\n\nPropranolol is the mainstay of systemic treatment for problematic hemangiomas in infancy. High-risk locations (periorbital, subglottic, beard distribution) warrant early intervention to prevent complications."
    difficulty: medium
    tags: [dermatology, hemangioma, propranolol, pediatrics]
  - front: "What is a spider angioma (Campbell Telangiectasia) and what conditions are associated with increased numbers?"
    back: "Central red arteriole with slender blanchable branches. Associated with hyperestrogenic states (liver disease, pregnancy, OCP use), but more often has no underlying cause. Blanches when pressure applied to the central arteriole.\n\nThe blanchable nature distinguishes spider angiomas from petechiae. Hyperestrogenism explains their increase in pregnancy and chronic liver disease (impaired estrogen metabolism). Electrodesiccation or laser if cosmetically desired."
    difficulty: easy
    tags: [dermatology, vascular, spider angioma, liver disease, pregnancy]
  - front: "How do you differentiate pyogenic granuloma from cherry angioma?"
    back: "Pyogenic granuloma: rapidly developing (<30 y/o), friable dome-shaped pedunculated/sessile nodule (fingers, lips, mouth, trunk, toes) that bleeds easily, grows rapidly over weeks-months. Cherry angioma (>30 y/o): bright red to deep maroon dome-shaped papules (1-5mm) on trunk, less friable, lesions do not fade but are stable.\n\nPyogenic granuloma requires surgical excision with histologic examination to rule out mimics (nodular melanoma, SCC, nodular BCC). Cherry angiomas usually require no treatment but can be treated with laser or electrocautery."
    difficulty: medium
    tags: [dermatology, vascular tumour, pyogenic granuloma, cherry angioma]
  - front: "What is nevus simplex (salmon patch) and how does it differ from nevus flammeus (port-wine stain)?"
    back: "Nevus simplex: pink-red irregular patches, congenital dilation of dermal capillaries; present in 3/newborns; midline on glabella ('Angel Kiss') or nuchal region ('Stork Bite'); majority regress spontaneously — no treatment required. Port-wine stain: dermatomal, unilateral, never regresses, may associate with Sturge-Weber.\n\nSalmon patches are the most common vascular birthmark and are benign with no associated syndromes. Port-wine stains require laser treatment and neurologic evaluation if in V1/V2 territory for Sturge-Weber syndrome."
    difficulty: easy
    tags: [dermatology, vascular malformation, nevus simplex, nevus flammeus, neonate]
  - front: "What are xanthomas and what are the main variants?"
    back: "Localized lipid deposits in the skin. Variants: (1) eruptive xanthoma — 1-5mm erythematous-to-yellow papules (hypertriglyceridemia); (2) tuberous xanthoma — <3cm yellow-to-orange nodules over joints; (3) tendinous xanthoma — firm, mobile, skin-coloured nodules in tendons; (4) plane xanthoma — soft, yellow thin plaques (may associate with monoclonal gammopathy).\n\nMost xanthomas are associated with hyperlipidemia; plane xanthomas can occur with multiple myeloma or monoclonal gammopathy without hyperlipidemia. A fasting lipid panel is indicated for most xanthoma types."
    difficulty: medium
    tags: [dermatology, xanthoma, hyperlipidemia, dyslipidemia]
  - front: "What is the pathophysiology and classification of acne vulgaris?"
    back: "Type I: comedonal, sparse, no scarring. Type II: comedonal, papular, moderate + little scarring. Type III: comedonal, papular, pustular, with scarring. Type IV: nodulocystic, risk of severe scarring. Pathophysiology: (1) hyperkeratinization at follicular ostia blocks sebum → microcomedones; (2) androgens → excess sebum; (3) C. acnes metabolizes sebum → pro-inflammatory mediators.\n\nAcne vulgaris is the most common inflammatory pilosebaceous disease. Understanding the classification drives treatment intensity — Type IV requires isotretinoin consideration."
    difficulty: easy
    tags: [dermatology, acne vulgaris, pathophysiology]
  - front: "What is the management approach for mild, moderate, and severe acne?"
    back: "Mild: OTC benzoyl peroxide (BPO) ± topical retinoid (backbone of all regimens) ± topical antimicrobial (clindamycin — avoid monotherapy due to resistance). Moderate: add oral tetracycline/doxycycline/minocycline (3 months before assessing efficacy); consider cyproterone acetate-ethinyl estradiol (Diane-35) or spironolactone for females. Severe: isotretinoin (Accutane®/Epuris®).\n\nAll acne regimens should include a retinoid unless not tolerated. Antibiotics should be combined with BPO to minimize resistance. Isotretinoin requires baseline lipids, LFTs, and pregnancy test (teratogen — two forms of contraception required)."
    difficulty: medium
    tags: [dermatology, acne, isotretinoin, retinoid, benzoyl peroxide]
  - front: "What are the key contraindications and monitoring requirements for isotretinoin (Accutane)?"
    back: "Contraindicated in pregnancy (teratogen — facial dysmorphism, cognitive impairment, spontaneous abortion). Requires: baseline lipid profile (risk of hypertriglyceridemia), LFTs, and β-hCG before treatment. Patients must use two forms of contraception. May transiently worsen acne before improvement.\n\nIsotretinoin is the most effective treatment for severe/nodulocystic acne. Do not combine with tetracyclines (risk of pseudotumour cerebri). Evidence does NOT support a causal link between isotretinoin and IBD or depression/suicidality."
    difficulty: medium
    tags: [dermatology, isotretinoin, teratogen, pregnancy, monitoring]
  - front: "What are the clinical features of perioral dermatitis and how is it managed?"
    back: "Discrete erythematous papulopustular eruptions becoming confluent on perioral, perinasal, and/or periorbital skin; symmetrical with rim of sparing around vermillion border of lips. Predominantly females 15-40 y/o. Management: stop all TCS, avoid ointment/oil-based products and cosmetics; topical metronidazole 0.75% BID; systemic doxycycline (anti-inflammatory).\n\nTopical corticosteroids are a key trigger/perpetuator of perioral dermatitis — stopping TCS is essential but may cause initial flare. Topical calcineurin inhibitors (pimecrolimus) can be used adjunctively."
    difficulty: medium
    tags: [dermatology, perioral dermatitis, metronidazole, TCS]
  - front: "What are the clinical features of rosacea and how does it differ from acne vulgaris?"
    back: "Rosacea: dome-shaped inflammatory papules ± pustules, flushing, non-transient erythema, telangiectasia on central face (forehead, nose, cheeks, chin). Key differentiator from acne: ABSENCE of comedones, predilection for central face, symptoms of flushing. Affects fair-skinned people, 30-50 y/o, F>M.\n\nRhinophyma (phymatous change of nose) is a late complication. Ocular manifestations include blepharoconjunctivitis and keratitis. Triggers include heat, cold, wind, sun, alcohol, spicy food, and stress."
    difficulty: easy
    tags: [dermatology, rosacea, acne, differential diagnosis]
  - front: "What is the first-line treatment for rosacea?"
    back: "First line: oral tetracyclines (e.g. doxycycline modified-release capsule — APPRILON) and/or topical metronidazole or topical azelaic acid. Topical ivermectin is also first line. Second line: oral metronidazole, topical clindamycin. Third line: oral retinoids.\n\nYear-round sunscreen and avoidance of triggers are foundational. Telangiectasias are treated with vascular lasers or intense pulsed light. Phymatous changes require physical ablation (electrosurgery, CO2 laser)."
    difficulty: medium
    tags: [dermatology, rosacea, doxycycline, metronidazole, treatment]
  - front: "What are the clinical features and pathophysiology of atopic dermatitis (AD)?"
    back: "Subacute/chronic eczematous reaction with prolonged severe pruritus; lichenification and excoriations secondary to scratching. Filaggrin gene mutation → impaired barrier function. Associated with atopy triad (asthma, allergic rhinitis, AD), eosinophilia. Distribution varies by age: infants — face/trunk/extensors; children — antecubital/popliteal fossae; adults — flexural pattern.\n\nAD is a T-cell driven inflammatory process with epidermal barrier dysfunction. Affects 10-20% of children <5 yr in developed countries; 1/3 persist into adulthood. Associated with psychiatric comorbidities including depression."
    difficulty: easy
    tags: [dermatology, atopic dermatitis, eczema, filaggrin, atopy]
  - front: "What is the stepwise pharmacologic management of atopic dermatitis (AD)?"
    back: "Mild flares: topical corticosteroids (TCS) BID x ≥2 weeks; topical calcineurin inhibitors (tacrolimus 0.03%/0.1%, pimecrolimus 1%) as steroid-sparing agents for face/neck. Moderate: topical PDE-4 inhibitor (crisaborole), topical JAK inhibitors (ruxolitinib). Severe refractory: oral JAK inhibitors (upadacitinib, abrocitinib); biologics (dupilumab anti-IL-4/13, tralokinumab anti-IL-13, lebrikizumab anti-IL-13); methotrexate, cyclosporine, oral steroids.\n\nAll patients need moisturizers applied liberally daily. Topical calcineurin inhibitors have no skin atrophy risk and are preferred for sensitive areas. Health Canada removed prior black box warnings on tacrolimus/pimecrolimus."
    difficulty: hard
    tags: [dermatology, atopic dermatitis, dupilumab, tacrolimus, JAK inhibitor]
  - front: "What are the local side effects of topical corticosteroids (TCS)?"
    back: "Common: skin atrophy, purpura, telangiectasia, striae, acneiform eruption. Rare: hypopigmentation (more common in patients of colour with high-potency TCS, prolonged use without breaks).\n\nThe choice of TCS potency depends on age, body site, and duration of use. For acute flares, apply one adult fingertip unit (0.5g) to an area the size of two adult palms BID for at least 2 weeks."
    difficulty: easy
    tags: [dermatology, topical corticosteroids, side effects, skin atrophy]
  - front: "What differentiates irritant contact dermatitis from allergic contact dermatitis?"
    back: "Irritant CD: toxic (non-immune) mechanism; occurs in anyone with sufficient irritant concentration; acute (sharp margins from acids/alkali) or cumulative (slow, poorly defined margins from soap); hands most common. Allergic CD: type IV delayed hypersensitivity; patient acquires sensitivity that persists indefinitely; erythema with papulovesicular eruption; requires patch testing to identify allergen. Common allergens: nickel, fragrance, tattoo pigments.\n\nPatch testing is the gold standard for diagnosing allergic contact dermatitis. Management of irritant CD focuses on barrier moisturizers and avoidance; allergic CD requires allergen avoidance and cross-reactant avoidance."
    difficulty: medium
    tags: [dermatology, contact dermatitis, allergic, irritant, patch testing]
  - front: "What are the clinical features and management of dyshidrotic dermatitis?"
    back: "Papulovesicular or bullous dermatitis of palms, soles, and dorsal hands/feet ('tapioca pudding' appearance), coalescing into plaques with painful fissuring; acute stage very pruritic. NOT caused by hyperhidrosis. Management: high-potency TCS with plastic cling wrap occlusion; prednisone for severe cases; alitretinoin (Toctino) for chronic hand dermatitis; antibiotics for secondary S. aureus infection.\n\nDyshidrotic eczema (pompholyx) is a distinct form of hand/foot dermatitis. Alitretinoin (oral retinoid) is specifically approved in Canada for chronic hand dermatitis unresponsive to TCS."
    difficulty: medium
    tags: [dermatology, dyshidrotic dermatitis, pompholyx, alitretinoin, hand dermatitis]
  - front: "What are the clinical features and management of seborrheic dermatitis?"
    back: "Greasy, erythematous, yellow, scaling papules/plaques in sebaceous gland-rich areas: scalp, nasolabial folds, eyebrows, eyelashes, beard, post-auricular, sternum. Caused by Malassezia spp. yeast. Increased severity with HIV and Parkinson's disease. Management: face — ketoconazole cream BID ± mild steroid cream ± roflumilast foam 0.3%; scalp — ketoconazole 2% shampoo (Nizoral), selenium sulfide, zinc pyrithione shampoos.\n\nIn infants, seborrheic dermatitis presents as 'cradle cap.' In adults, it can cause dandruff (pityriasis sicca). Can overlap with psoriasis on scalp (sebopsoriasis) and rosacea on face (seborosacea)."
    difficulty: easy
    tags: [dermatology, seborrheic dermatitis, Malassezia, ketoconazole, HIV]
  - front: "What are the features and management of stasis dermatitis?"
    back: "Erythematous, scaly, pruritic plaques on lower legs (particularly medial ankle), usually bilateral with swelling, hemosiderin deposition, woody fibrosis, and lipodermatosclerosis in late stages. Caused by chronic venous insufficiency. Management: compression stockings (most important — if no peripheral arterial disease), rest/elevate legs, moisturizer, mid-high potency TCS. Complications: ulceration (medial malleolus), secondary bacterial infections.\n\nCheck ankle-brachial index before applying compression stockings to rule out peripheral arterial disease. Doppler ultrasound if DVT suspected."
    difficulty: medium
    tags: [dermatology, stasis dermatitis, venous insufficiency, compression stockings, lipodermatosclerosis]
  - front: "What are the '6 Ps' of lichen planus and what is pathognomonic for oral lichen planus?"
    back: "6 Ps: Purple, Pruritic, Polygonal, Planar (flat-topped), Papules, Plaques. Wickham's striae (lacy, whitish reticular network) on oral mucosa is pathognomonic. Common sites: wrists, nails, scalp, mucous membranes (mouth, vulva, glans). Associated with Koebner phenomenon and rarely hepatitis C.\n\nLichen planus is immune-mediated (lymphocyte activation → keratinocyte apoptosis). Erosive oral lichen planus carries increased risk of SCC. Treatment: topical/intralesional steroids; severe cases may need phototherapy, oral retinoids, or immunosuppressants."
    difficulty: easy
    tags: [dermatology, lichen planus, Wickham striae, oral lichen planus]
  - front: "What is pityriasis rosea and how does it present?"
    back: "Acute, self-limiting eruption with red/flesh-coloured oval plaques with central scale that does not extend to edge. Preceded by 'herald patch' 1-2 weeks before secondary eruption. Lesions follow Langer lines parallel to ribs ('Christmas tree pattern' on back). Common on trunk and proximal limbs. Suspected HHV-6 or HHV-7 reactivation. Resolves spontaneously in 6-12 weeks — no treatment required.\n\nPityriasis rosea can resemble secondary syphilis (must exclude). In darker skin tones, lesions may appear dusky violet and leave post-inflammatory hypo/hyperpigmentation. Symptomatic treatment with TCS or emollients if pruritic."
    difficulty: easy
    tags: [dermatology, pityriasis rosea, herald patch, Christmas tree pattern]
  - front: "What are the five clinical subtypes of psoriasis?"
    back: "1. Plaque psoriasis (most common) — well-circumscribed erythematous plaques with silvery-white scales on extensor surfaces, scalp, nails. 2. Guttate psoriasis — raindrop-like salmon-pink papules, often post-streptococcal. 3. Erythrodermic psoriasis — >90% BSA erythema, potentially life-threatening. 4. Pustular psoriasis — sudden onset pustules, may follow steroid withdrawal. 5. Inverse psoriasis — flexural surfaces (axillae, inguinal, inframammary).\n\nPsoriasis affects 1.5-2% of the population (M=F). Pathophysiology involves genetic and immunologic factors (Th1/Th17-mediated inflammation with shortened keratinocyte cell cycle). Risk factors: smoking, obesity, alcohol, drugs, infections, Koebner phenomenon."
    difficulty: easy
    tags: [dermatology, psoriasis, classification, plaque psoriasis]
  - front: "What is Auspitz sign and what does it indicate?"
    back: "Auspitz sign: pinpoint bleeding observed when psoriatic scale is removed. It is characteristic of plaque psoriasis and results from the dilated capillary loops (elongated rete ridges) in the dermis that are revealed upon removing the overlying scale.\n\nAuspitz sign reflects the pathologic changes of psoriasis: epidermal acanthosis, parakeratosis, and dilated tortuous capillaries in dermal papillae. It is not pathognomonic but is highly characteristic."
    difficulty: easy
    tags: [dermatology, psoriasis, Auspitz sign, clinical signs]
  - front: "What is the treatment approach for plaque psoriasis based on severity?"
    back: "Mild (BSA <3%, PASI <3): TCS + topical vitamin D analogue (calcipotriol) — first line; roflumilast cream (steroid-sparing, safe on face/folds); emollients. Moderate-Severe (BSA ≥3%, PASI ≥3): phototherapy (NB-UVB preferred over PUVA for carcinogenicity); systemic — methotrexate, cyclosporine (intermittent, <1 year), acitretin, apremilast (Otezla), deucravacitinib; biologics (anti-TNF, anti-IL17, anti-IL23).\n\nNB-UVB (311nm) is much less carcinogenic than PUVA; PUVA lifetime limit is <200 sessions due to melanoma/NMSC risk. Betamethasone + calcipotriol (Dovobet) is a convenient combination but cannot be used on face or skin folds."
    difficulty: hard
    tags: [dermatology, psoriasis, treatment, biologics, phototherapy, methotrexate]
  - front: "What are the systemic treatment options for psoriasis and their key adverse effects?"
    back: "Acitretin: alopecia, cheilitis, teratogenicity, hepatotoxicity, hypertriglyceridemia. Cyclosporine: renal toxicity, hypertension, immunosuppression, lymphoma — use intermittently <1 year. Methotrexate: bone marrow toxicity, hepatic cirrhosis, teratogenicity. Apremilast (Otezla — PDE4 inhibitor): GI upset, headache, weight loss — very safe. Deucravacitinib (TYK2 inhibitor): acne, increased infection risk.\n\nAcitretin requires two forms of contraception and pregnancy avoidance for 3 years after stopping (alcohol converts it to etretinate which is stored in fat). PUVA increases melanoma risk with >200 lifetime sessions."
    difficulty: hard
    tags: [dermatology, psoriasis, systemic treatment, methotrexate, cyclosporine, acitretin]
  - front: "What biologics are approved in Canada for psoriasis and what are their targets?"
    back: "Anti-TNF: etanercept (Enbrel), adalimumab (Humira), infliximab (Remicade), certolizumab (Cimzia). Anti-IL-12/23: ustekinumab (Stelara). Anti-IL-17A: secukinumab (Cosentyx), ixekizumab (Taltz). Anti-IL-17RA: brodalumab (Siliq). Anti-IL-17A/F: bimekizumab (BIMZELX). Anti-IL-23: guselkumab (Tremfya), risankizumab (Skyrizi), tildrakizumab (ILUMYA). Anti-IL-36R: spesolimab (SPEVIGO) — generalized pustular psoriasis only.\n\nIL-17 and IL-23 inhibitors are among the most effective biologics for psoriasis. Most anti-TNF and anti-IL-17/23 agents can also treat psoriatic arthritis. Biologics generally require TB screening before initiation."
    difficulty: hard
    tags: [dermatology, psoriasis, biologics, anti-TNF, anti-IL17, anti-IL23]
  - front: "What triggers and manages guttate psoriasis?"
    back: "Often preceded by streptococcal pharyngitis. Presents as discrete salmon-pink small scaling papules diffusely on trunk and legs, sparing palms and soles. Management: broadband UVB phototherapy (preferred over narrowband), sunlight, emollients; penicillin V, erythromycin, or azithromycin if GAS on throat culture.\n\nGuttate psoriasis may be the first presentation of psoriasis or a flare of pre-existing disease. Anti-streptococcal treatment may help resolve the eruption but does not definitively prevent psoriasis progression."
    difficulty: medium
    tags: [dermatology, guttate psoriasis, streptococcal, UVB, treatment]
  - front: "What makes erythrodermic psoriasis a medical emergency and how is it managed?"
    back: "Potentially life-threatening: involves >90% BSA with erythema and fine desquamative scale. Complications: arthralgia, pruritus, dehydration, electrolyte imbalance, thermoregulation failure. Aggravated by lithium, beta-blockers, NSAIDs, antimalarials, infection, phototoxic reactions. Management: hospitalization, IV fluids, electrolyte monitoring, treat underlying cause; systemic: cyclosporine, acitretin, methotrexate, UV, biologics.\n\nErythrodermic psoriasis can arise from inadequate treatment of other psoriasis subtypes or abrupt withdrawal of systemic corticosteroids. Risk of high-output cardiac failure, sepsis, and hypothermia."
    difficulty: hard
    tags: [dermatology, erythrodermic psoriasis, emergency, electrolytes, hospitalization]
  - front: "What is inverse psoriasis and how does its management differ from plaque psoriasis?"
    back: "Inverse psoriasis: erythematous plaques on flexural surfaces (axillae, inframammary folds, gluteal fold, inguinal folds); lesions may be macerated. Management differs: use LOW-potency TCS (not high-potency due to skin friction/occlusion); topical vitamin D analogues (calcipotriene, calcitriol); topical calcineurin inhibitors (tacrolimus, pimecrolimus); topical PDE-4 inhibitors (roflumilast); phototherapy.\n\nOcclusion in flexural areas increases TCS absorption and risk of atrophy — hence low-potency steroids are preferred. Roflumilast foam is steroid-sparing and can be used on folds and face."
    difficulty: medium
    tags: [dermatology, inverse psoriasis, flexural psoriasis, treatment]
  - front: "A 25-year-old female develops erythematous papulopustules symmetrically around her mouth with a clear zone around the vermillion border. She has been using topical betamethasone cream for 3 months. What is the diagnosis and first step in management?"
    back: "Perioral dermatitis exacerbated by topical corticosteroid (TCS) use. First step: stop all TCS immediately (may cause initial flare/rebound). Then: avoid all ointment/oil-based products and cosmetics; apply topical metronidazole 0.75% BID; consider systemic doxycycline for its anti-inflammatory properties.\n\nTCS are both a trigger and perpetuator of perioral dermatitis. The rim of sparing around the vermillion border and symmetrical perioral distribution are characteristic. This condition predominantly affects women aged 15-40."
    difficulty: medium
    tags: [dermatology, perioral dermatitis, TCS, metronidazole, clinical scenario]
  - front: "What is nummular dermatitis and how is it managed?"
    back: "Coin-shaped (nummular), pruritic, dry, scaly, erythematous plaques with common secondary infection. Pathophysiology involves xerosis from epidermal lipid barrier dysfunction, allowing permeation of environmental agents. Management: moisturization; mid-high potency TCS ointment BID.\n\nNummular dermatitis is often confused with tinea corporis (ringworm) — KOH preparation and fungal culture can differentiate. Secondary bacterial infection (S. aureus) is common and should be treated with antibiotics."
    difficulty: medium
    tags: [dermatology, nummular dermatitis, eczema, treatment]
  - front: "What is lichen simplex chronicus and how does it differ from atopic dermatitis?"
    back: "Lichen simplex chronicus: well-defined plaque(s) of lichenified skin with increased skin markings and excoriations (neck, scalp, extremities, urogenital area). Results from skin hyperexcitability to itch → continued rubbing → lichenification. Often associated with atopy, anxiety disorders, chronic stress. Treatment: OTC antipruritics (topical pramoxine), topical steroids. Differs from AD: more localized, associated with chronic psychological stress, not a systemic atopic condition.\n\nThe itch-scratch cycle is central to lichen simplex chronicus. Breaking this cycle with antipruritics and TCS is the therapeutic goal. Punch biopsy confirms diagnosis if uncertain; KOH if fungal infection suspected."
    difficulty: medium
    tags: [dermatology, lichen simplex chronicus, lichenification, pruritus]
  - front: "What is the association between seborrheic dermatitis and HIV/Parkinson's disease?"
    back: "Both HIV and Parkinson's disease are associated with increased incidence AND severity of seborrheic dermatitis. Seborrheic dermatitis can be a marker of advanced HIV disease or newly diagnosed Parkinson's. The mechanism relates to immune dysregulation (HIV) and autonomic/sebaceous gland dysfunction (Parkinson's) promoting Malassezia overgrowth.\n\nSevere, refractory, or suddenly worsening seborrheic dermatitis in a young adult should prompt consideration of HIV testing. In Parkinson's disease, increased sebum production and reduced facial movement may contribute."
    difficulty: medium
    tags: [dermatology, seborrheic dermatitis, HIV, Parkinson, Malassezia]
  - front: "What are the topical vitamin D analogues used in psoriasis and what is their mechanism?"
    back: "Calcipotriene/calcipotriol (Dovonex, Silkis): reduce keratinocyte hyperproliferation. Betamethasone + calcipotriene (Dovobet): combined TCS and vitamin D analogue — NOT to be used on face or folds. First-line for mild plaque psoriasis in combination with TCS. More effective than either agent alone.\n\nVitamin D analogues can cause local skin irritation and hypercalcemia with excessive use. Studies show that combinations of vitamin D analogues and TCS are more effective than either alone for chronic plaque psoriasis."
    difficulty: medium
    tags: [dermatology, psoriasis, calcipotriol, vitamin D analogue, topical treatment]
  - front: "What acne myths should be debunked when counselling patients?"
    back: "Myths: (1) Eating greasy food/chocolate causes acne — FALSE; (2) Blackheads are caused by dirt — FALSE (oxidized fatty acids); (3) Acne is caused by poor hygiene — FALSE (excessive washing can aggravate). Evidence shows benzoyl peroxide is more effective than placebo but not superior to adapalene or clindamycin as monotherapy.\n\nPatient education is essential in acne management. Diet does not cause acne, though some evidence links high glycemic index diets and dairy to acne severity. Gentle twice-daily cleansing is appropriate — over-washing disrupts the skin barrier."
    difficulty: easy
    tags: [dermatology, acne, patient education, myths]
  - front: "What biologics target IL-17 for psoriasis, and why is brodalumab unique in this class?"
    back: "Anti-IL-17A: secukinumab (Cosentyx), ixekizumab (Taltz). Anti-IL-17A/F dual: bimekizumab (BIMZELX). Anti-IL-17RA receptor: brodalumab (Siliq) — unique because it targets the IL-17 receptor subunit A rather than IL-17A itself, blocking multiple IL-17 family cytokines (IL-17A, IL-17C, IL-17E, IL-17F).\n\nIL-17 inhibitors are among the most effective biologics for moderate-to-severe psoriasis. Brodalumab has a black box warning for suicidal ideation and behaviour. Candida infections are a notable adverse effect of IL-17 inhibitors."
    difficulty: hard
    tags: [dermatology, psoriasis, biologics, IL-17, brodalumab, secukinumab]
  - front: "A 45-year-old woman presents with bilateral lower leg erythema, scaling, pruritus, brownish discolouration, and woody fibrosis. What is the diagnosis and most important treatment?"
    back: "Stasis dermatitis secondary to chronic venous insufficiency. Most important treatment: compression stockings (confirm no peripheral arterial disease by checking ankle-brachial index first). Additional: rest and leg elevation, daily moisturizer, mid-high potency TCS for inflammation.\n\nHemosiderin deposition (brown discolouration) and lipodermatosclerosis (woody fibrosis) are late-stage findings. The most feared complication is venous ulceration at the medial malleolus. Compression stockings address the underlying pathophysiology."
    difficulty: medium
    tags: [dermatology, stasis dermatitis, venous insufficiency, compression, ankle-brachial index]
  - front: "What organism causes scabies, and what are its classic clinical features?"
    back: "Sarcoptes scabiei (a mite). Classic features: superficial linear burrows, intense nocturnal pruritus, inflammatory papules/nodules in axilla and groin, secondary eczematous plaques and excoriations. Spares head and neck except in infants.\n\nScabies is transmitted by prolonged skin-to-skin contact and has an incubation of ~1 month before pruritus begins. Re-infection triggers hypersensitivity within 24 hours."
    difficulty: easy
    tags: [scabies, Sarcoptes scabiei, pruritus, burrows, dermatology]
  - front: "What is the first-line treatment for scabies and how is it applied?"
    back: "Permethrin 5% cream (Nix®): applied from neck down to soles of feet, left on 8–14 hours, with a second treatment 7 days after the first. Clothing and linens must be washed in hot water. Family and close contacts must also be treated.\n\nPruritus may persist for 2–3 weeks after effective treatment due to prolonged hypersensitivity; mid-potency topical corticosteroids and antihistamines can be used for symptom relief after permethrin treatment."
    difficulty: easy
    tags: [scabies, permethrin, treatment, dermatology]
  - front: "What are the three species of lice that infest humans and their respective sites?"
    back: "1) Pediculus humanus capitis — scalp. 2) Phthirus pubis — pubic area. 3) Pediculus humanus humanus — body (nits/lice in clothing seams; excoriations on shoulders, belt-line, buttocks).\n\nBody lice can transmit infectious agents including Bartonella quintana (trench fever) and Rickettsia prowazekii (epidemic typhus). Children are medically cleared to return to school after the first permethrin treatment."
    difficulty: easy
    tags: [pediculosis, lice, Phthirus pubis, Pediculus, dermatology]
  - front: "What is the characteristic bite pattern of bed bugs (Cimex lectularius) and how are they treated?"
    back: "Bed bugs cause burning wheals turning to firm papules, characteristically in groups of three ('breakfast, lunch, and dinner'), on areas with easy access (face, neck, arms, legs, hands). Treatment: professional fumigation, insecticides to walls/furniture, removal of clutter; TCS and oral H1-antagonists for symptomatic relief.\n\nCimex lectularius hides in crevices in walls and furniture during the day and feeds at night. Lesional biopsy can confirm an insect bite reaction if needed."
    difficulty: medium
    tags: [bed bugs, Cimex lectularius, insect bites, dermatology]
  - front: "What virus causes herpangina and what are its clinical features?"
    back: "Coxsackievirus A. Clinical features: small vesicles in the mouth evolving into painful shallow oral ulcers (1–5 mm), yellowish with erythematous base, associated with sore throat, dysphagia, and headache. Most common in children and young adults; self-limited.\n\nHerpangina is highly contagious and managed with symptomatic treatment including acetaminophen for fever and pain. It is distinct from HSV gingivostomatitis by location (posterior oropharynx)."
    difficulty: easy
    tags: [herpangina, Coxsackievirus, oral ulcers, dermatology]
  - front: "What laboratory test shows multinucleated giant epithelial cells in HSV infection?"
    back: "Tzanck smear with Giemsa stain shows multinucleated giant epithelial cells. Additional tests include viral culture, PCR, electron microscopy, and direct fluorescence antibody test from the unroofed base of a new lesion.\n\nThe Tzanck smear is not specific for HSV vs VZV. PCR is the most sensitive and specific test for HSV. Serologic antibody testing can confirm current or past infection."
    difficulty: easy
    tags: [HSV, Tzanck smear, diagnosis, dermatology]
  - front: "What are the complications of HSV infection?"
    back: "Dendritic corneal ulcer, erythema multiforme (EM), herpes simplex encephalitis (infants at risk), and Kaposi's varicelliform eruption (eczema herpeticum) — HSV infection superimposed on atopic dermatitis.\n\nErythema multiforme most commonly follows HSV or Mycoplasma infection; prophylactic acyclovir for 6–12 months is indicated for HSV-associated EM with frequent recurrences."
    difficulty: medium
    tags: [HSV, complications, eczema herpeticum, erythema multiforme, dermatology]
  - front: "What are the clinical features of herpes zoster (shingles) and what is Hutchinson's sign?"
    back: "Unilateral dermatomal eruption (vesicles, bullae, pustules on erythematous edematous base) occurring 3–5 days after pain/paresthesia of the affected dermatome. Most common distribution: thoracic (50%), trigeminal (10–20%), cervical (10–20%). Hutchinson's sign: shingles on the tip of the nose signifies ocular involvement (nasociliary branch of V1).\n\nVZV reactivation is the cause; risk factors include old age, immunosuppression, and hematologic malignancy. Post-herpetic neuralgia is common in the elderly and is treated with TCAs and anticonvulsants (gabapentin, pregabalin)."
    difficulty: easy
    tags: [herpes zoster, shingles, VZV, Hutchinsons sign, post-herpetic neuralgia]
  - front: "What is the management of herpes zoster (shingles)?"
    back: "Compress with normal saline, Burow's or betadine solution. Oral antivirals (famciclovir, valacyclovir, or acyclovir) for 7 days — must start within 72 hours of rash onset. Analgesia: NSAIDs/acetaminophen for mild–moderate pain; opioids if severe. Post-herpetic neuralgia: TCAs, gabapentin or pregabalin.\n\nAntivirals reduce duration and severity of acute infection and may reduce the incidence of post-herpetic neuralgia. Ramsay Hunt syndrome occurs when VZV reactivates in the geniculate ganglion (CN VII)."
    difficulty: medium
    tags: [herpes zoster, shingles, treatment, post-herpetic neuralgia, antivirals]
  - front: "How is molluscum contagiosum spread and how is it managed?"
    back: "Spread via direct contact, auto-inoculation, or sexual contact. Self-limited (1–2 years to resolve). Management options: topical cantharidin, cryotherapy, curettage, topical retinoids, imiquimod (Aldara®) — an immunomodulator that induces pro-inflammatory cytokines. Giant/severe molluscum can be seen in HIV.\n\nMolluscum contagiosum is caused by a poxvirus and is common in children and sexually active young adults. No treatment is required for immunocompetent patients as it is self-limiting."
    difficulty: easy
    tags: [molluscum contagiosum, poxvirus, treatment, dermatology]
  - front: "What are the first-line, second-line, and third-line treatments for warts (HPV)?"
    back: "First-line: salicylic acid preparations, cryotherapy. Second-line: topical imiquimod, topical 5-fluorouracil, topical tretinoin, podophyllotoxin. Third-line: curettage, cautery, surgery (non-plantar), CO2 laser, oral cimetidine (children), intralesional bleomycin (plantar warts), trichloroacetic acid, diphencyprone.\n\nHPV infects keratinocytes and causes benign epithelial growths. Plantar warts (verruca plantaris) interrupt epidermal ridges, helping distinguish them from callus; paring reveals red-brown specks (thrombosed capillaries)."
    difficulty: medium
    tags: [warts, HPV, verruca, treatment, dermatology]
  - front: "What organism causes candidal intertrigo and what are its predisposing factors?"
    back: "Candida albicans (70–80% of infections). Predisposing factors: obesity, diabetes mellitus, systemic antibiotics, immunosuppression, and malignancy. Lesions are macerated/eroded erythematous patches in intertriginous areas (under breast, groin, interdigitally) with peripheral 'satellite' pustules.\n\nCandidal intertrigo starts as non-infectious maceration from heat, moisture, and friction. Management includes keeping the area dry and applying topical antifungals (terbinafine, ciclopirox olamine, ketoconazole/clotrimazole cream BID)."
    difficulty: easy
    tags: [candidiasis, candidal intertrigo, Candida albicans, fungal infection, dermatology]
  - front: "What is the causative organism of pityriasis (tinea) versicolor and why does the skin appear lighter in summer?"
    back: "Caused by Malassezia species (formerly Pityrosporum). The organism produces azelaic acid which inhibits melanin synthesis — affected skin is lighter than surrounding skin in summer (doesn't tan) and darker in winter. Appears as asymptomatic brown/white scaling macules on upper chest and back.\n\nMalassezia has an affinity for sebaceous glands and requires fatty acids to survive. It is associated with folliculitis and seborrheic dermatitis. Predisposing factors include summer/tropical climates, excessive sweating, Cushing's syndrome, and prolonged corticosteroid use."
    difficulty: medium
    tags: [pityriasis versicolor, tinea versicolor, Malassezia, hypopigmentation, dermatology]
  - front: "How is pityriasis versicolor diagnosed and managed?"
    back: "Diagnosis: clinical; KOH prep of scales shows hyphae and spores (spaghetti-and-meatballs appearance). Management: ketoconazole 2% shampoo or cream daily for 3 days; selenium sulfide 2.5% lotion for 10 min for 7 days; ciclopirox olamine BID; systemic fluconazole or itraconazole for 7 days if extensive.\n\nPityriasis versicolor is caused by Malassezia species and is a superficial fungal infection. Recurrence is common, especially in humid conditions."
    difficulty: easy
    tags: [pityriasis versicolor, tinea versicolor, KOH, ketoconazole, treatment]
  - front: "What types of flat warts (verruca planae) are associated with which HPV types and what are their characteristic features?"
    back: "Verruca planae are caused by HPV types 3 and 10. They present as multiple discrete, skin-coloured, flat-topped papules in grouped or linear configuration on the face, dorsal hands, shins, and knees. Common in children.\n\nFlat warts are distinguished from syringoma, seborrheic keratosis, molluscum contagiosum, and lichen planus. They may spread by Koebner phenomenon (isomorphic response to trauma). Treatment follows the general wart management algorithm."
    difficulty: medium
    tags: [flat warts, verruca planae, HPV 3, HPV 10, dermatology]
  - front: "What is the mechanism of action and primary indication of calcipotriol (Dovonex®) topical therapy?"
    back: "Calcipotriol is a vitamin D3 analogue applied BID for psoriasis. It is inactivated by light (do not apply before phototherapy). Maximum weekly doses vary by age: ≤5 yr = 25 g/wk, 6–10 yr = 50 g/wk, 11–14 yr = 75 g/wk, >14 yr = 100 g/wk.\n\nCalcipotriol inhibits keratinocyte proliferation and promotes differentiation, making it effective for plaque psoriasis. It should be washed off hands after application and avoided on the face, mucous membranes, and eyes."
    difficulty: easy
    tags: [calcipotriol, psoriasis, topical therapy, vitamin D analogue, dermatology]
  - front: "How is permethrin used to treat scabies and pediculosis, and what are its contraindications?"
    back: "Permethrin 5% cream (Kwellada-P) is applied overnight to all skin areas from the neck down and repeated 1 week later for scabies. Permethrin 1% (Nix) is used for pediculosis. Contraindicated in children <2 years and in hypersensitivity to permethrin or chrysanthemums.\n\nPermethrin is a synthetic pyrethroid with low toxicity and excellent efficacy. A second application 7 days later is recommended for scabies to kill newly hatched mites that were not killed by the first treatment."
    difficulty: easy
    tags: [permethrin, scabies, pediculosis, antiparasitic, topical therapy]
  - front: "What are the advantages of pimecrolimus (Elidel®) and tacrolimus (Protopic®) over topical corticosteroids in atopic dermatitis?"
    back: "Both are calcineurin inhibitors that lack the adverse effects of topical steroids (skin atrophy, striae, telangiectasia). They can be used on all skin surfaces including face, neck, and intertriginous areas. Pimecrolimus 1% cream is for mild–moderate AD (>3 months old); tacrolimus 0.03% (2–15 yr) or 0.1% (≥15 yr) ointment BID.\n\nTopical calcineurin inhibitors inhibit T-cell activation without causing cutaneous atrophy. They are expensive but useful as steroid-sparing agents for sensitive areas where long-term steroid use is problematic."
    difficulty: medium
    tags: [pimecrolimus, tacrolimus, calcineurin inhibitor, atopic dermatitis, topical therapy]
  - front: "What are the major monitoring requirements and contraindications for isotretinoin (Accutane®) use in severe nodular acne?"
    back: "Monitoring: fasting lipids and LFTs at baseline then q1–2 weeks; pregnancy test x2 at baseline. Contraindicated in pregnancy (teratogenic) — requires 2 forms of reliable contraception in sexually active females. Side effects include dry mucous membranes, decreased night vision, myalgia, and potential depression. Concurrent tetracyclines risk pseudotumour cerebri.\n\nIsotretinoin 0.5–1 mg/kg/day for 20–24 weeks targets severe nodular/inflammatory acne; the total cumulative dose is 120 mg/kg. It may transiently worsen acne early in treatment. Vitamin A supplements must be discontinued."
    difficulty: medium
    tags: [isotretinoin, acne, teratogen, retinoid, monitoring]
  - front: "What are the monitoring requirements and major contraindications for methotrexate use in psoriasis?"
    back: "Monitoring: pregnancy test at baseline; CBC q6 months (more frequent if dose change or high risk); BUN/Cr and LFTs at baseline then q4–8 weeks; serum albumin at baseline; liver biopsy at baseline if psoriasis with alcoholism, persistently abnormal LFTs, or chronic HBV/HCV. Contraindications: pregnancy, lactation, alcohol abuse, liver dysfunction, immunodeficiency, blood dyscrasias. Administer with folic acid 1 mg/day.\n\nMethotrexate inhibits dihydrofolate reductase and is restricted to severe, recalcitrant, or disabling psoriasis not adequately responsive to other therapies. It may be combined with cyclosporine at lower doses of each to minimize toxicity."
    difficulty: hard
    tags: [methotrexate, psoriasis, hepatotoxicity, monitoring, folic acid]
  - front: "What are the monitoring requirements and key contraindications for cyclosporine (Neoral®) in dermatology?"
    back: "Monitoring: BUN/Cr x2 at baseline then q2 weeks x3 months then monthly; BP x2, CBC, K+, Mg, lipid panel, uric acid at baseline then q2 weeks x3 months then monthly; LFTs. Contraindications: abnormal renal function, uncontrolled HTN, malignancy (except NMSC), uncontrolled infection, immunodeficiency (excluding autoimmune disease), hypersensitivity. Maximum treatment duration: 2 years.\n\nCyclosporine 2.5–4 mg/kg/day PO divided BID is used for psoriasis, lichen planus, erythema multiforme, recalcitrant urticaria, and recalcitrant atopic dermatitis. Concomitant magnesium supplementation may be renoprotective."
    difficulty: hard
    tags: [cyclosporine, psoriasis, nephrotoxicity, immunosuppressant, monitoring]
  - front: "What are the indications and key monitoring parameters for acitretin (Soriatane®)?"
    back: "Acitretin is used for severe psoriasis and disorders of hyperkeratinization (ichthyosis, Darier's disease). Monitoring: CBC and LFTs at baseline then q1–2 weeks until stable; fasting lipids at baseline then q1–2 weeks until stable; urine/serum pregnancy test x2 at baseline, monthly during treatment, then q3 months for >3 years after discontinuation.\n\nAcitretin is a systemic retinoid that is teratogenic; women of childbearing potential require strict contraceptive requirements. It can be combined with PUVA phototherapy (re-PUVA). Maximum dose is 75 mg/day."
    difficulty: hard
    tags: [acitretin, psoriasis, retinoid, teratogen, monitoring]
  - front: "When should spironolactone be considered for acne, and what are its key side effects and contraindications?"
    back: "Spironolactone 50–100 mg/day (alone or with OCPs) is used for hormonal acne (chin/jawline) and acne with endocrine abnormality. Contraindicated in pregnancy. Side effects: menstrual irregularities at higher doses (if not on OCPs), breast tenderness, mild diuresis, and risk of hyperkalemia (counsel to reduce potassium-rich foods like bananas).\n\nSpironolactone is an anti-androgen that reduces sebum production. It is particularly useful for acne in the chin/jawline distribution reflecting hormonal influence. Regular monitoring of potassium is warranted given hyperkalemia risk."
    difficulty: medium
    tags: [spironolactone, hormonal acne, anti-androgen, hyperkalemia, acne]
  - front: "What are the indications and key G6PD-related consideration for dapsone in dermatology?"
    back: "Dapsone 50–150 mg/day (tapered to 25–50 mg) is used for dermatitis herpetiformis and neutrophilic dermatoses. G6PD must be checked before starting treatment (hemolysis risk). Monitor CBC weekly x4, monthly x6, then q6 months; LFTs at baseline then periodically. Vitamin C and E supplementation can help prevent hemolysis.\n\nDapsone acts as an anti-inflammatory agent effective in dermatitis herpetiformis (associated with celiac disease). Dramatic response within hours is characteristic. It is a substrate of CYP2C8/9, 2C19, 2E1, and 3A4 — with multiple potential drug interactions."
    difficulty: medium
    tags: [dapsone, dermatitis herpetiformis, G6PD, hemolysis, neutrophilic dermatosis]
  - front: "Which combined oral contraceptive pills (OCPs) are indicated for acne, and what are their key contraindications?"
    back: "OCPs that have undergone RCTs for acne include TriCyclen®, Diane-35®, and Alesse. They are indicated for hormonal acne (chin/jawline) and acne associated with PCOS or endocrine abnormalities. Contraindications: smoking, hypertension, migraines with aura, and pregnancy.\n\nAll combined OCPs reduce androgen-driven sebum production and are helpful in acne, but those listed have RCT evidence. Diane-35 contains cyproterone acetate, a potent anti-androgen. Routine gynecological health maintenance should be up to date before initiating."
    difficulty: easy
    tags: [OCP, hormonal acne, Diane-35, PCOS, contraindications]
  - front: "What is perniosis (chilblains), and how is it clinically distinguished from Raynaud's phenomenon?"
    back: "Perniosis (chilblains/pernio) is a localized inflammatory response to cold, damp, non-freezing conditions causing erythematous to blue-violet macules, nodules, or papules on distal toes/fingers, heels, ears, and nose. Symptoms of burning, itching, or pain occur within hours after cold exposure, lasting 1–3 weeks. Unlike Raynaud's, it involves persistent inflammatory lesions rather than episodic vasospasm.\n\nPerniosis may be associated with cryoglobulins or cold agglutinins. Differential diagnosis includes chilblain lupus erythematosus and lupus pernio. Treatment includes nifedipine, nicotinamide, and avoidance of cold/damp conditions."
    difficulty: easy
    tags: [perniosis, chilblains, cold injury, inflammatory, nifedipine]
  - front: "What are the risk factors for perniosis (chilblains), and who is most commonly affected?"
    back: "Risk factors include smoking, low BMI, poor nutrition, and occupational cold/damp exposure (outdoor workers). Most commonly affects women, the elderly, and children. Common in the UK and northwestern Europe, and in homes lacking central heating.\n\nPerniosis is not due to frostbite (freezing injury); it occurs in above-freezing damp cold. Treatment beyond avoidance includes nifedipine (vasodilator), nicotinamide, phenoxybenzamine, sympathectomy, and erythemogenic UVB phototherapy."
    difficulty: easy
    tags: [perniosis, chilblains, risk factors, cold injury, dermatology]
  - front: "What was the key finding of the BE VIVID trial comparing bimekizumab to ustekinumab in moderate-to-severe plaque psoriasis?"
    back: "BE VIVID (Lancet 2021) showed bimekizumab (IL-17A/F inhibitor) achieved PASI90 in 85% of patients vs. 50% with ustekinumab and 5% with placebo at 16 weeks. IGA response rates were 84% vs. 53% vs. 5%. Higher rates of oral candidiasis and MACE in pre-existing CV risk patients were noted with bimekizumab.\n\nBimekizumab simultaneously blocks both IL-17A and IL-17F, providing superior efficacy over ustekinumab (IL-12/23 inhibitor) in psoriasis. The increased oral candidiasis risk reflects the role of IL-17 in mucosal immunity against Candida."
    difficulty: hard
    tags: [bimekizumab, ustekinumab, psoriasis, IL-17, biologic]
  - front: "What did the ADVANCE trial show about apremilast for mild-to-moderate plaque psoriasis?"
    back: "ADVANCE (JAAD 2022) found that apremilast 30 mg BID (a phosphodiesterase-4 inhibitor) achieved a static Physician Global Assessment score of 0–1 in 21.6% vs. 4.1% of placebo patients at 16 weeks in mild-to-moderate psoriasis.\n\nApremilast is an oral small-molecule PDE4 inhibitor that reduces inflammatory cytokine production. It offers an alternative to biologics for patients who prefer oral therapy or have contraindications to immunosuppressants or injectables."
    difficulty: medium
    tags: [apremilast, psoriasis, PDE4 inhibitor, oral therapy, ADVANCE trial]
  - front: "What was demonstrated by the ECZTRA trial regarding tralokinumab in moderate-to-severe atopic dermatitis?"
    back: "ECZTRA (Br J Dermatol 2021) found tralokinumab 300 mg SC q2 weeks (IL-13 monoclonal antibody) plus topical corticosteroids achieved EASI-75 in 56% vs. 35.7% of placebo patients at 16 weeks.\n\nTralokinumab specifically targets IL-13, a key cytokine in type 2 inflammation driving atopic dermatitis. It is well-tolerated and provides an additional biologic option for moderate-to-severe AD alongside dupilumab."
    difficulty: medium
    tags: [tralokinumab, IL-13, atopic dermatitis, biologic, ECZTRA]
  - front: "What did the Measure Up 1 and 2 trials demonstrate about upadacitinib in moderate-to-severe atopic dermatitis?"
    back: "Measure Up 1 and 2 (Lancet 2021) showed upadacitinib (selective JAK-1 inhibitor) 15 mg achieved EASI-75 in 70% and 30 mg in 80% at 16 weeks vs. 16% for placebo. vIGA-AD score 0–1 was achieved in 48% (15 mg) and 62% (30 mg) vs. 8% (placebo).\n\nUpadacitinib is an oral JAK-1 inhibitor that reduces signalling through cytokine receptors (IL-4, IL-13, IL-31) key to AD pathogenesis. JAK inhibitors offer rapid onset but require monitoring for infections, thromboembolism, and lipid changes."
    difficulty: medium
    tags: [upadacitinib, JAK-1 inhibitor, atopic dermatitis, Measure Up, oral therapy]
  - front: "What did the Advocate 1 and 2 trials show about lebrikizumab for moderate-to-severe atopic dermatitis?"
    back: "Advocate 1 and 2 (NEJM 2023) showed lebrikizumab (IL-13 monoclonal antibody) SC q2 weeks achieved IGA score 0–1 in 43.1% vs. 12.7% placebo and EASI-75 in 58.8% vs. 16.2% placebo at 16 weeks in adolescents and adults.\n\nLebrikizumab selectively binds IL-13 and prevents its signalling, reducing type 2 inflammation in AD. It joins tralokinumab as an IL-13-specific biologic option for AD, with dupilumab (IL-4/IL-13) remaining the established standard."
    difficulty: medium
    tags: [lebrikizumab, IL-13, atopic dermatitis, biologic, Advocate trial]
  - front: "What did the TRuE-V1 and V2 trials demonstrate about ruxolitinib cream for vitiligo?"
    back: "TRuE-V1 and V2 (NEJM 2022) found ruxolitinib 1.5% cream BID for 52 weeks achieved F-VASI75 (75% reduction in facial Vitiligo Area Scoring Index) in ~30% of patients vs. ~8–11% vehicle control in patients ≥12 years with non-segmental vitiligo. Application-site acne, nasopharyngitis, and pruritus were common adverse events.\n\nRuxolitinib cream (JAK1/2 inhibitor) blocks interferon-gamma-driven JAK-STAT signalling that destroys melanocytes in vitiligo. It is the first FDA-approved topical therapy specifically indicated for vitiligo repigmentation."
    difficulty: medium
    tags: [ruxolitinib, vitiligo, JAK inhibitor, repigmentation, TRuE-V]
  - front: "What did the BRAVE-AA1 and AA2 trials demonstrate about baricitinib for severe alopecia areata?"
    back: "BRAVE-AA1 and AA2 (NEJM 2022) showed baricitinib (JAK1/2 inhibitor) 4 mg daily achieved SALT scores ≤20 (≤20% scalp hair loss) in ~36–39% vs. ~3–6% placebo in adults with severe alopecia areata at 36 weeks. The 2 mg dose also outperformed placebo (~19–23% vs. 3–6%).\n\nBaricitinib is an oral JAK inhibitor approved for severe alopecia areata. The SALT score ranges 0–100, with 0 representing no scalp hair loss. JAK inhibitors address the immune attack on hair follicles by blocking cytokine signalling."
    difficulty: medium
    tags: [baricitinib, alopecia areata, JAK inhibitor, BRAVE-AA, hair loss]
  - front: "What is the Allegroll trial's finding regarding ritlecitinib for alopecia areata?"
    back: "Allegroll (Lancet 2023) found ritlecitinib (kinase inhibitor) 200 mg loading + 50 mg maintenance daily achieved SALT score ≤20 (≤20% scalp hair loss) in 31% vs. 2% placebo at 24 weeks in patients ≥12 years with ≥50% scalp hair loss from alopecia areata.\n\nRitlecitinib is a JAK3/TEC kinase inhibitor approved for alopecia areata. It inhibits JAK-dependent cytokine signalling that drives the autoimmune attack on hair follicles, and unlike baricitinib, it is approved for adolescents ≥12 years."
    difficulty: medium
    tags: [ritlecitinib, alopecia areata, JAK3, kinase inhibitor, Allegroll trial]
  - front: "What is roflumilast (Zoryve®) used for in dermatology, and what are its advantages?"
    back: "Roflumilast (Zoryve®) is a topical PDE4 inhibitor applied once daily as a cream for psoriasis and atopic dermatitis, or as a foam for seborrheic dermatitis. It lacks the adverse effects of topical steroids (skin atrophy, striae). Side effects include pain and burning at application site.\n\nRoflumilast's topical formulation as both cream and foam allows targeted use across different inflammatory dermatoses. Unlike systemic roflumilast (used for COPD), the topical form minimizes systemic adverse effects while providing anti-inflammatory benefit."
    difficulty: easy
    tags: [roflumilast, PDE4 inhibitor, psoriasis, atopic dermatitis, seborrheic dermatitis]
  - front: "What is the pathophysiology and management of androgenetic alopecia in males vs. females?"
    back: "DHT acts on genetically susceptible hair follicles. Males: fronto-temporal to vertex pattern. Treatment: topical minoxidil, finasteride (5α-reductase inhibitor 1 mg/day). Females: widening of central part ('Christmas tree'). Treatment: topical minoxidil, spironolactone, cyproterone acetate.\n\nAndrogenetic alopecia is the most common form of hair loss. Finasteride is contraindicated in women of childbearing potential due to teratogenicity risk. Spironolactone provides anti-androgenic effect in females."
    difficulty: medium
    tags: [androgenetic alopecia, minoxidil, finasteride, DHT]
  - front: "What are the precipitants of telogen effluvium (mnemonic SEND)?"
    back: "S - Stress (biological and psychological) and Scalp disease (surgery); E - Endocrine (hypothyroidism); N - Nutritional (iron and protein deficiency); D - Drugs (acitretin, heparin, lithium, IFN, β-blockers, valproic acid, SSRIs).\n\nTelogen effluvium involves a uniform decrease in hair density 2-4 months after the precipitant, as hairs are forced from anagen into telogen. Regrowth begins in months but meaningful regrowth takes 6-12 months."
    difficulty: medium
    tags: [telogen effluvium, hair loss, precipitants]
  - front: "What is the timing and mechanism of anagen effluvium in chemotherapy patients?"
    back: "Hair loss occurs 7-14 days after single pulse chemotherapy, most apparent after 1-2 months. Mechanism: cytotoxic agents impair mitotic activity of hair follicles during the growth (anagen) phase. Effect is reversible after agent is stopped.\n\nAnagen effluvium is dose-dependent and differs from telogen effluvium in timing and mechanism. Other causes include bismuth, levodopa, colchicine, and heavy metal exposure (thallium, arsenic)."
    difficulty: medium
    tags: [anagen effluvium, chemotherapy, hair loss]
  - front: "What are the characteristic features of alopecia areata, and what are its associations?"
    back: "Autoimmune disorder with patches of complete hair loss; 'exclamation mark' hairs (tapered shafts); may have nail pitting/stippling. Associated with pernicious anemia, vitiligo, thyroid disease, Addison's disease.\n\nAlopecia areata results from T-cell mediated attack on hair follicles. Alopecia totalis (all scalp hair) and universalis (all body hair) are severe subtypes. JAK inhibitors are newer treatments for refractory disease."
    difficulty: medium
    tags: [alopecia areata, autoimmune, exclamation mark hairs]
  - front: "What is the first-line treatment for isolated patches of alopecia areata?"
    back: "Topical corticosteroids (TCS) and intralesional steroids (triamcinolone acetonide). Topical immunotherapy (diphencyprone, anthralin) and JAK inhibitors are options for refractory disease.\n\nLocalized alopecia areata has an excellent prognosis and may spontaneously regrow within months. Systemic immunosuppressants are reserved for extensive or refractory disease."
    difficulty: medium
    tags: [alopecia areata, triamcinolone, treatment]
  - front: "What distinguishes scarring (cicatricial) alopecia from non-scarring alopecia?"
    back: "Scarring alopecia involves irreversible loss of hair follicles with fibrosis; stem cells are destroyed, so regrowth is not possible. Non-scarring alopecia preserves stem cells, allowing spontaneous or treatment-induced regrowth.\n\nBiopsy from the active border is required to diagnose scarring alopecias. Causes include radiation, burns, infections (fungal, TB, HSV), DLE, lichen planopilaris, and primary inflammatory conditions."
    difficulty: medium
    tags: [scarring alopecia, cicatricial, hair follicle]
  - front: "What is central centrifugal cicatricial alopecia (CCCA) and who is most affected?"
    back: "CCCA is a scarring alopecia starting at the central scalp, seen in 2-7% of Black women; one of the most commonly diagnosed scarring alopecias, possibly associated with certain hair care practices.\n\nCCCA is an important cause of permanent hair loss in women of African descent. It is a primary lymphocytic scarring alopecia. Early diagnosis and treatment with topical/intralesional steroids or anti-inflammatories is important."
    difficulty: medium
    tags: [CCCA, scarring alopecia, Black women]
  - front: "What is the follicular occlusion tetrad?"
    back: "Hidradenitis suppurativa (HS), acne conglobata, cicatricial alopecia (dissecting cellulitis of scalp), and pilonidal disease.\n\nThese four conditions share follicular occlusion as a unifying pathophysiologic mechanism. Recognizing this association is important as patients may have concurrent manifestations."
    difficulty: medium
    tags: [follicular occlusion tetrad, hidradenitis suppurativa, acne conglobata]
  - front: "What nail change is associated with psoriasis vs. alopecia areata in nail pitting?"
    back: "Psoriasis: random pitting pattern. Alopecia areata: geometric/grid-shaped pitting pattern.\n\nNail pitting results from defective keratinization of the proximal nail matrix. The pattern of pitting helps differentiate psoriasis from alopecia areata and can be a clue to systemic diagnosis."
    difficulty: medium
    tags: [nail pitting, psoriasis, alopecia areata, nail changes]
  - front: "What does koilonychia (spoon-shaped nails) suggest as an underlying systemic diagnosis?"
    back: "Iron deficiency anemia, malnutrition, or diabetes mellitus.\n\nKoilonychia is characterized by concave nail plates. In adults, iron deficiency is the most common cause. It represents a clue to systemic disease on physical examination."
    difficulty: easy
    tags: [koilonychia, nail changes, iron deficiency]
  - front: "What systemic conditions are associated with Terry's nails?"
    back: "Liver cirrhosis. Terry's nails: white proximal nail, darker distal nail with ground glass appearance, no lunula.\n\nTerry's nails are a sign of severe systemic disease, most classically liver cirrhosis. They differ from leukonychia (diffuse white nails) seen in hypoalbuminemia and chronic renal failure."
    difficulty: medium
    tags: [Terrys nails, liver cirrhosis, nail changes]
  - front: "What is hidradenitis suppurativa (HS), and what are its characteristic skin findings?"
    back: "Chronic scarring inflammatory skin condition from follicular occlusion in intertriginous zones. Findings: inflammatory nodules, sinus tracts, double tombstone comedones, hypertrophic scarring. Most common site: axillae.\n\nHS affects 1-4% of the population, predominantly women, with onset in the 2nd-3rd decade. It is associated with smoking and excess weight. Hurley staging guides treatment selection."
    difficulty: medium
    tags: [hidradenitis suppurativa, follicular occlusion, axillae]
  - front: "What biologic therapies are approved for refractory moderate-to-severe hidradenitis suppurativa?"
    back: "Anti-TNF agents: adalimumab and infliximab. Adalimumab is Health Canada–approved for HS.\n\nBiologics targeting TNF-α are used for HS that fails antibiotics (oral tetracyclines, clindamycin+rifampin combination) and other systemic therapies. CO₂ laser for deroofing is also used in moderate-severe disease."
    difficulty: hard
    tags: [hidradenitis suppurativa, adalimumab, anti-TNF, biologics]
  - front: "What is primary hyperhidrosis and how does it differ from secondary hyperhidrosis?"
    back: "Primary: focal excessive sweating ≥6 months without apparent cause; bilateral, symmetrical; only during waking hours (diurnal); affects palms, soles, axillae. Secondary: caused by medications, menopause, autonomic dysfunction, spinal cord injury.\n\nPrimary hyperhidrosis affects 1-5% of the population with a strong family history. Pathophysiology involves an exaggerated eccrine sweat gland response to emotional stimuli. Diagnosis is clinical (starch-iodine test confirms location)."
    difficulty: medium
    tags: [hyperhidrosis, eccrine, diurnal]
  - front: "What are the treatment options for primary hyperhidrosis, from conservative to surgical?"
    back: "Antiperspirants → iontophoresis → botulinum toxin → topical glycopyrronium bromide → oral glycopyrrolate/oxybutynin → microwave thermolysis → suction curettage → endoscopic thoracic sympathectomy (ETS).\n\nBotulinum toxin injections are highly effective for axillary hyperhidrosis, requiring repeat treatments every 6-12 months. ETS is reserved for palmar hyperhidrosis not responding to other treatments but carries risk of compensatory hyperhidrosis."
    difficulty: medium
    tags: [hyperhidrosis, botulinum toxin, sympathectomy, treatment]
  - front: "What are the clinical features of recurrent aphthous stomatitis (canker sores)?"
    back: "Painful, shallow, <5 mm, round-to-oval ulcers covered by creamy-white pseudomembrane with erythematous halo. Sites: labial/buccal mucosa, floor of mouth, ventral tongue, soft palate. More common in women, peak age 20-30.\n\nAphthous stomatitis is immunologically mediated epithelial damage. Triggers include trauma, stress, infections, HIV, and hormonal changes. Must be distinguished from HSV (vesicles, more keratinized surfaces) and Behçet disease."
    difficulty: easy
    tags: [aphthous stomatitis, canker sores, oral ulcers]
  - front: "What conditions should be considered in the differential diagnosis of recurrent aphthous stomatitis?"
    back: "Behçet syndrome, SLE, gluten-sensitive enteropathy (celiac disease), HSV infection.\n\nBehçet syndrome is distinguished by painful oral AND genital ulcers plus other systemic features. Celiac disease may present with recurrent oral ulcers; testing for anti-tTG antibodies should be considered in recurrent/refractory cases."
    difficulty: medium
    tags: [aphthous stomatitis, differential diagnosis, Behçet]
  - front: "What is erythema nodosum and what are its most common causes?"
    back: "Acute panniculitis (subcutaneous fat inflammation) with round, red, tender poorly demarcated nodules on extensor lower legs (shins). 40% idiopathic. Common causes: streptococcal infection (GAS), sarcoidosis, TB, IBD (Crohn's>UC), OCPs, drugs (sulfonamides), histoplasmosis, Yersinia.\n\nMnemonic 'NO DNOSUM': New drugs, Other infections (GAS), Sarcoidosis, UCer (IBD), Many infections. Investigations include CXR, throat culture, ASO titre, PPD. Lesions resolve spontaneously in 6 weeks."
    difficulty: medium
    tags: [erythema nodosum, panniculitis, sarcoidosis, streptococcus]
  - front: "What are the epidemiological features of erythema nodosum?"
    back: "Age 15-30 years old, F:M ratio 3:1. Lesions last for days and spontaneously resolve within 6 weeks.\n\nThe female predominance, especially in reproductive years, suggests hormonal factors including OCP use and pregnancy as precipitants. Treatment is symptomatic with NSAIDs, rest, and compressive bandages."
    difficulty: easy
    tags: [erythema nodosum, epidemiology]
  - front: "What are the systemic causes of generalized pruritus without primary skin lesions? (mnemonic SCRATCHED)"
    back: "S-Systemic (hepatic/cholestatic), C-Cancer (lymphoma, leukemia), R-Renal (CKD/uremia), A-Autoimmune/Anemia, T-Thyroid, C-Carcinoid, H-Hematologic, E-Endocrine, D-Drugs/Dry skin.\n\nGeneralized pruritus without primary skin lesions warrants investigation for systemic disease. Workup includes CBC, LFTs, creatinine, TSH, CXR. Hodgkin's lymphoma is a classic cause of severe generalized pruritus."
    difficulty: medium
    tags: [pruritus, systemic disease, differential diagnosis]
  - front: "What is the classification of urticaria based on duration?"
    back: "Acute urticaria: attacks <6 weeks; most common causes are drugs (ASA, NSAIDs, antibiotics), foods, infections. Chronic urticaria: attacks >6 weeks; 90% are idiopathic; individual lesions still last <24h.\n\nIn pediatric patients, >80% of urticaria is infection-related. Chronic idiopathic urticaria is treated with non-sedating antihistamines (first-line), then updosing and omalizumab for refractory cases."
    difficulty: medium
    tags: [urticaria, hives, acute, chronic, classification]
  - front: "What distinguishes urticarial vasculitis from ordinary urticaria?"
    back: "Individual lesions last >24 hours, are often painful (less pruritic), and leave bruise-type discolouration. Biopsy is indicated. Associated with infections (hepatitis B/C), autoimmune diseases (SLE), and drug hypersensitivity (cimetidine, diltiazem).\n\nUrticarial vasculitis requires biopsy showing leukocytoclastic vasculitis. Standard urticaria lesions last <24 hours and resolve without bruising. Workup should include complement levels; hypocomplementemic urticarial vasculitis is strongly associated with SLE."
    difficulty: hard
    tags: [urticarial vasculitis, urticaria, biopsy, SLE]
  - front: "What is Darier's sign and in what condition is it seen?"
    back: "Darier's sign: rubbing a lesion produces a wheal surrounded by intense erythema within minutes due to mast cell degranulation. Seen in mastocytosis (urticaria pigmentosa).\n\nUrticaria pigmentosa/mastocytosis presents as reddish-brown macules and plaques from excessive mast cell infiltration. Systemic mastocytosis can cause anaphylaxis-like episodes from mass mast cell degranulation."
    difficulty: medium
    tags: [Dariers sign, mastocytosis, urticaria pigmentosa, mast cells]
  - front: "What are the Fitzpatrick skin phototypes and their significance?"
    back: "Type I: white skin, always burns, never tans. Types II-III: burns then tans. Types IV-V: minimal burning, tans easily. Type VI: dark brown/black, never burns, dark tan. Higher types have more UV protection but are at risk for post-inflammatory hyperpigmentation.\n\nFitzpatrick classification is clinically relevant for UV risk assessment, treatment selection (e.g., laser settings), and skin cancer screening counseling. It also guides sunscreen recommendations and photoaging risk."
    difficulty: easy
    tags: [Fitzpatrick, skin phototype, UV, sunscreen]
  - front: "What wavelength of UV radiation is primarily responsible for sunburn vs. photoaging?"
    back: "UVB (290-320 nm): primarily responsible for sunburn and vitamin D synthesis; absorbed by outer dermis; blocked by glass. UVA (320-400 nm): responsible for photoaging, photosensitivity reactions, and premature skin aging; penetrates glass and clouds.\n\nBroad-spectrum sunscreens protect against both UVA and UVB. UVC (200-290 nm) is filtered by the ozone layer. Both UVA and UVB contribute to photocarcinogenesis."
    difficulty: easy
    tags: [UV radiation, UVA, UVB, sunburn, photoaging]
  - front: "What is the SPF formula and when should sunscreen be reapplied?"
    back: "SPF = burn time with cream ÷ burn time without cream. Chemical sunscreens must be applied 15-30 minutes before exposure and reapplied every 2 hours (more often when sweating or swimming).\n\nPhysical sunscreens (titanium dioxide, zinc oxide) reflect/scatter UV light, are effective against the full spectrum, and have less risk of sensitization. Chemical sunscreens absorb UV radiation and require adequate lead time for efficacy."
    difficulty: easy
    tags: [sunscreen, SPF, photoprotection]
  - front: "What is the relative potency ranking of topical corticosteroids (least to most potent)?"
    back: "Weak (×1): hydrocortisone. Moderate (×3): mometasone, desonide. Potent (×6): betamethasone valerate, amcinonide. Very potent (×9): fluocinonide, betamethasone dipropionate. Extremely potent (×25): clobetasol propionate (most potent).\n\nTopical steroid potency selection depends on body site, skin condition, and patient age. Weak steroids are used for face, intertriginous areas, and children. The scrotum has 42× the percutaneous absorption of the forearm."
    difficulty: medium
    tags: [topical steroids, potency, clobetasol, hydrocortisone]
  - front: "A 45-year-old Black woman presents with progressive hair loss starting at the crown of the scalp with fibrosis on biopsy. What is the most likely diagnosis?"
    back: "Central centrifugal cicatricial alopecia (CCCA) — a primary lymphocytic scarring alopecia starting at the central scalp, most common in Black women (2-7% prevalence).\n\nCCCA is one of the most common scarring alopecias in women of African descent. It is irreversible due to fibrotic destruction of hair follicles. Early treatment with topical/intralesional steroids or anti-inflammatory antibiotics may slow progression."
    difficulty: hard
    tags: [CCCA, scarring alopecia, Black women, central scalp]
  - front: "What is the treatment for chronic spontaneous urticaria that is refractory to antihistamines?"
    back: "Updosing of non-sedating H1 antihistamines (up to 4× standard dose), then omalizumab (anti-IgE monoclonal antibody) for refractory cases.\n\nOmalizumab is approved in Canada for chronic spontaneous urticaria refractory to antihistamines. It works by reducing free IgE levels, thereby decreasing mast cell activation. Cyclosporine is an alternative for very refractory cases."
    difficulty: hard
    tags: [chronic urticaria, omalizumab, antihistamines, refractory]
  - front: "What nail changes are associated with psoriasis?"
    back: "Pitting (random pattern), onycholysis (separation of nail from bed), oil spots (brown-yellow discolouration), subungual hyperkeratosis, splinter hemorrhages.\n\nNail changes in psoriasis occur in 50-80% of patients and may precede or accompany psoriatic arthritis. Distinguishing from onychomycosis (fungal) is important — nail clipping for KOH and fungal culture may be needed."
    difficulty: medium
    tags: [psoriasis, nail changes, onycholysis, pitting]
  - front: "What is Staphylococcal Scalded Skin Syndrome (SSSS) and who does it affect?"
    back: "Caused by exotoxin (exfoliatin) from coagulase-positive S. aureus. Mostly affects children. Presents with: fever, irritability, malaise, skin tenderness → sudden diffuse erythema (red, warm, tender) → flaccid bullae → desquamation in large sheets. Treatment: IV anti-staphylococcal antibiotics.\n\nSSSS exotoxin targets desmoglein-1 in the superficial epidermis, causing intraepidermal cleavage. Unlike TEN (which involves full-thickness epidermal necrosis), SSSS has a good prognosis with appropriate antibiotics. Nikolsky's sign (skin peels with gentle pressure) is positive in both SSSS and TEN."
    difficulty: medium
    tags: [SSSS, staphylococcal scalded skin, exotoxin, dermatology, pediatrics]
  - front: "What is DRESS syndrome and when does it present?"
    back: "Drug Reaction with Eosinophilia and Systemic Symptoms. Presents 1-6 weeks after first exposure to causative drug; persists weeks after withdrawal. Features: morbilliform rash (face, trunk, arms), fever, malaise, cervical lymphadenopathy, internal organ involvement (hepatitis, nephritis, pneumonitis, arthralgia, thyroid abnormalities, hematologic abnormalities).\n\nDRESS has a mortality of 10%. Common culprit drugs include aromatic anticonvulsants (carbamazepine, phenytoin), allopurinol, sulfonamides, minocycline, and dapsone. Eosinophilia and atypical lymphocytosis on CBC are characteristic. Treatment: stop drug, systemic corticosteroids, supportive care."
    difficulty: medium
    tags: [DRESS syndrome, drug reaction, eosinophilia, dermatology, emergency]
  - front: "What is Erythema Multiforme (EM) and what is the most common cause?"
    back: "Most commonly caused by herpes simplex virus. Less common: Mycoplasma pneumoniae, drug-induced. Presents with: viral prodrome 1-14 days before rash → target lesion (central grey bulla/wheal surrounded by concentric rings of erythema and normal skin). Mucous membrane involvement can cause difficulty with oral intake.\n\nEM is a cell-mediated hypersensitivity reaction. HSV-associated EM may recur with each HSV outbreak—prophylactic acyclovir can prevent recurrences. EM is distinguished from SJS by less mucous membrane involvement (<2 sites), less skin detachment, and targetoid (bullseye) lesions. Treatment: treat underlying cause, supportive care."
    difficulty: medium
    tags: [erythema multiforme, HSV, target lesion, dermatology, emergency]
  - front: "What is Pyoderma Gangrenosum and what conditions is it associated with?"
    back: "Pyoderma gangrenosum is associated with IBD (Crohn's/UC), rheumatoid arthritis, leukemia, and monoclonal gammopathies. Begins as painless macule/vesicle/pustule/bulla on a red/blue base that sloughs to leave a gangrenous ulcer. Common sites: arms, hands, feet, perineal region.\n\nThe pathogenesis involves neutrophil dysfunction and immune dysregulation (pathergy: wounds worsen with trauma). Key diagnostic feature: diagnosis of exclusion after ruling out infection, vasculitis, malignancy. Management: systemic corticosteroids, cyclosporine, or biologics (infliximab for IBD-associated cases). Avoid debridement."
    difficulty: medium
    tags: [pyoderma gangrenosum, IBD, ulcer, neutrophil, dermatology]
  - front: "What organisms cause mastitis and what are the recommended antibiotics?"
    back: "Mastitis is caused by Staphylococcus aureus and Streptococcus pyogenes. First-line: cloxacillin 500 mg PO QID x 7 days OR cephalexin 500 mg PO QID x 7 days.\n\nMastitis most commonly occurs in breastfeeding women. S. aureus is the predominant pathogen. Anti-staphylococcal penicillins (cloxacillin) or first-generation cephalosporins are appropriate. Breastfeeding should continue if possible."
    difficulty: easy
    tags: [mastitis, S. aureus, cloxacillin, cephalexin, breast infection]
  - front: "What is the first-line antibiotic treatment for uncomplicated cellulitis in adults?"
    back: "First-line: cephalexin 500 mg PO QID x 10–14 days. Second-line: cloxacillin 500 mg PO QID x 10–14 days OR clindamycin 300 mg PO x 10–14 days.\n\nUncomplicated cellulitis is caused by Group A Streptococcus and S. aureus. Cephalexin (a first-generation cephalosporin) provides adequate coverage. Clindamycin is an alternative for penicillin-allergic patients or suspected MRSA."
    difficulty: easy
    tags: [cellulitis, cephalexin, S. aureus, Group A strep, skin infection]
