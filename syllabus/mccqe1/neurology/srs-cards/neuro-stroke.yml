  - front: "What is the role of 17-hydroxylase in steroidogenesis?"
    back: "Converts pregnenolone to 17-OH-pregnenolone and progesterone to 17-OH-progesterone, essential for cortisol and sex steroid synthesis\n\nDeficiency of 17-hydroxylase leads to adrenal insufficiency with impaired cortisol and sex steroid production."
