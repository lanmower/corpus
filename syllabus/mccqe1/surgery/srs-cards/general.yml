# General (Surgery) - generated from srs-mccqe1
cards:
  - front: "What is the most commonly used arterial graft for coronary artery bypass surgery, and should it be skeletonized?"
    back: "Internal thoracic artery (ITA); skeletonization is debated but may reduce sternal blood supply\n\nStudies by Athanasiou et al. examined whether skeletonization of the internal thoracic artery affects outcomes in CABG surgery."
    difficulty: medium
    tags: [coronary artery bypass, surgery, grafts, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What does the Ross procedure involve, and what are its long-term outcomes?"
    back: "The Ross procedure involves using the patient's own pulmonary autograft to replace the aortic valve; long-term outcomes show favorable results but require reoperation for the pulmonary homograft\n\nStudies by Aboud et al. showed long-term outcomes of patients undergoing the Ross procedure with generally good results."
    difficulty: medium
    tags: [aortic stenosis, surgery, Ross procedure, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What is the preferred surgical treatment for achalasia compared to medical therapy?"
    back: "Peroral endoscopic myotomy (POEM) or laparoscopic Heller myotomy - 83% success rate at 2 years\n\nNEJM 2019 study showed POEM was non-inferior to laparoscopic Heller myotomy with 83% clinical success vs 81.7%, significantly better than medical treatment."
    difficulty: hard
    tags: [achalasia, treatment, surgery, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is the POEM procedure and how does it compare to laparoscopic Heller myotomy?"
    back: "POEM (peroral endoscopic myotomy) is as effective as laparoscopic Heller myotomy for achalasia at 2 years (83% vs 81.7% clinical success)\n\nA 2019 NEJM study showed POEM achieved clinical success in 83% vs 81.7% for LHM at 2 years, demonstrating non-inferiority."
    difficulty: medium
    tags: [achalasia, POEM, treatment, surgery, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is indicated before surgical fundoplication?"
    back: "Esophageal manometry to ensure intact esophageal function\n\nEsophageal manometry is indicated before surgical fundoplication to ensure intact esophageal function and exclude alternative diagnoses like scleroderma and achalasia."
    difficulty: medium
    tags: [GERD, surgery, pre-operative, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What is an aortoenteric fistula and why is it a surgical emergency?"
    back: "A rare and lethal cause of GI bleed, most common in patients with history of aortic graft surgery. Requires emergency surgery as the window of opportunity is narrow.\n\nAortoenteric fistulas create direct communication between the aorta and intestinal lumen, causing massive bleeding. Suspect in patients with aortic grafts presenting with abdominal pain and bleeding."
    difficulty: hard
    tags: [Aortoenteric Fistula, Vascular, Gastroenterology, Surgical Emergency, toronto-notes, pages-0461-0462-0463-0464-0465-0466-0467-0468-0469-0470]
  - front: "What is the role of esophageal manometry before fundoplication?"
    back: "To ensure intact esophageal function and exclude alternative diagnoses like scleroderma and achalasia"
    difficulty: medium
    tags: [GERD, surgery, manometry, pre-operative, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "What are the indications for placing surgical drains?"
    back: "To prevent fluid accumulation (blood, pus, serum, bile, urine), to assess third space fluid accumulation postoperatively, and to provide a route for drainage.\n\nDrains are placed selectively at surgery to prevent complications from fluid accumulation and to monitor postoperative output."
    difficulty: easy
    tags: [surgery, drains, postoperative, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What are the three main categories of surgical drains?"
    back: "Open (e.g., Penrose), closed (gravity like Foley, underwater-seal like chest tube, suction like Jackson-Pratt), and sump drains (e.g., NG tube).\n\nDrains are categorized by their mechanism: open drains have higher infection risk, closed drains use gravity or suction, and sump drains provide active suction."
    difficulty: easy
    tags: [surgery, drains, equipment, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What special precaution should be taken for all neck surgery patients?"
    back: "Have a suture kit at bedside in all neck surgery patients in case of emergent hematoma requiring immediate decompression.\n\nGiven the risk of airway compromise from neck hematoma, having emergency equipment immediately available can be life-saving."
    difficulty: easy
    tags: [surgery, neck, emergency, airway, toronto-notes, pages-0501-0502-0503-0504-0505-0506-0507-0508-0509-0510]
  - front: "What procedure repairs obstructed UPJ (ureteropelvic junction)?"
    back: "Pyeloplasty\n\nPyeloplasty is the surgical correction of UPJ obstruction, whether congenital or acquired."
    difficulty: easy
    tags: [pyeloplasty, UPJ obstruction, surgery, toronto-notes, pages-1541-1542-1543-1544-1545-1546-1547-1548-1549-1550]
