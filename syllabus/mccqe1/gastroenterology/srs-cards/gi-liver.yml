  - front: "What is the spectrum of Alcohol-Related Liver Disease (ALD)?"
    back: "Steatotic liver disease (reversible) → Acute alcoholic hepatitis (35%, often reversible) → Cirrhosis (10-15%, permanent architectural changes)\n\nALD progresses through three stages. Cirrhosis is irreversible though fibrosis may improve with alcohol cessation."
