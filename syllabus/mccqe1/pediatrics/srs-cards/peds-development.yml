# Child Development & Milestones (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "A 2-year-old does not respond to his name, avoids eye contact, has no words, and engages in repetitive play. What is the diagnosis and appropriate referral?"
    back: "Autism Spectrum Disorder (ASD); refer immediately to developmental pediatrics + speech therapy; do not wait\n\nCPS (Canadian Paediatric Society) recommends immediate referral for any child with language regression, no words by 12 months, no 2-word phrases by 24 months, loss of any skills at any age, or persistent social communication concerns. Early intervention improves outcomes dramatically."
    difficulty: hard
    tags: [autism, ASD, developmental delay, referral, pediatrics]
  - front: "What are the typical developmental milestones for a 12-month-old?"
    back: "Gross motor: pulls to stand, cruises; Fine motor: pincer grasp; Language: says mama/dada (specific), 2-3 other words; Social: waves bye-bye, plays peek-a-boo, stranger anxiety\n\nCPS developmental surveillance at all well-child visits. Red flags at 12 months: no babbling, no pointing/waving, no words, no social smile. Development follows cephalocaudal and proximal-distal sequence."
    difficulty: easy
    tags: [milestones, 12 months, gross motor, language development, pediatrics]
  - front: "What developmental milestones should a 2-year-old achieve?"
    back: "Gross motor: runs, kicks ball, climbs stairs with 2 feet per step; Fine motor: scribbles, towers of 6 blocks; Language: ≥50 words, 2-word phrases, 50% intelligible to strangers; Social: parallel play\n\nCPS developmental assessment at 18 months and 24 months. Red flags at 2 years: <50 words, no 2-word combinations, failure to follow 2-step commands. Regression is always a red flag."
    difficulty: easy
    tags: [2-year milestones, language, 2-word phrases, parallel play, pediatrics]
  - front: "What language milestones are expected at 3 years and 4 years?"
    back: "3 years: 200+ words, 3-word sentences, 75% intelligible; asks who/what/where; 4 years: 1000+ words, 4-6 word sentences, 100% intelligible to strangers; tells stories, asks why\n\nCPS speech milestones: refer to speech-language pathology if ≤50 words at 24 months, not combining 2 words by 24 months, or <75% intelligible at 36 months. Bilingual children may have slightly slower single-language acquisition but total vocabulary across both languages is normal."
    difficulty: easy
    tags: [language milestones, 3 years, 4 years, speech delay, pediatrics]
  - front: "What is the significance of loss of previously acquired milestones (regression)?"
    back: "Any developmental regression is a red flag requiring urgent assessment — may indicate Rett syndrome (girls), autism, epileptic encephalopathy (Landau-Kleffner), metabolic disorders, or mass lesion\n\nCPS guidelines: parental concern about developmental regression must always be taken seriously. Rett syndrome: normal development to 6-18 months then regression with loss of purposeful hand use, development of hand stereotypies. Metabolic conditions may present with regression."
    difficulty: hard
    tags: [developmental regression, red flag, Rett syndrome, autism, pediatrics]
  - front: "What screening tools are used in Canada for developmental surveillance?"
    back: "ASQ (Ages and Stages Questionnaires): 2, 4, 6, 9, 12, 18, 24, 30, 36 months; M-CHAT-R (Modified Checklist for Autism): 18 and 24 months; Denver Developmental Screening Test II\n\nCPS recommends developmental surveillance at every well-child visit using standardized tools. ASQ is a validated parent-completed questionnaire. Positive M-CHAT-R (score ≥3) requires follow-up; ≥8 = immediate referral to developmental pediatrics."
    difficulty: easy
    tags: [developmental screening, ASQ, M-CHAT, developmental surveillance, pediatrics]
  - front: "A 7-year-old has difficulty concentrating, hyperactivity, and impulsivity both at home and school. DSM-5 criteria are met. Diagnosis and management?"
    back: "ADHD; multimodal treatment: behavioral therapy first (age <6), then methylphenidate (first-line stimulant medication for age ≥6) + behavioral therapy; school accommodations\n\nCPS ADHD guidelines: ADHD requires symptoms in ≥2 settings (home and school), before age 12, for ≥6 months. Stimulants (methylphenidate, amphetamines) are most effective pharmacotherapy. Non-stimulants (atomoxetine, guanfacine) for stimulant intolerance or substance abuse concern."
    difficulty: medium
    tags: [ADHD, methylphenidate, stimulants, behavioral therapy, pediatrics]
  - front: "What is the developmental assessment for a 5-year-old starting school?"
    back: "Gross motor: hops, skips, catches ball; Fine motor: prints letters, draws person with 6 parts; Language: 5+ word sentences, full sentences, grammar; Social: cooperative play, understands rules; Cognitive: counts to 10, knows colors\n\nSchool readiness requires assessment of cognitive, language, motor, social-emotional, and self-care domains. CPS recommends 4-5 year visit focusing on school readiness. Phonological awareness (rhyming, letter sounds) predicts reading development."
    difficulty: easy
    tags: [school readiness, 5-year milestones, kindergarten, developmental assessment, pediatrics]
  - front: "What is cerebral palsy (CP) and how is it classified?"
    back: "CP: permanent disorder of movement and posture from non-progressive brain injury early in development; classified by: motor type (spastic most common 85%, dyskinetic, ataxic), topography (hemiplegia, diplegia, quadriplegia), GMFCS level\n\nCP diagnosis: clinical, no single test. Risk factors: prematurity (highest), perinatal asphyxia, infection. MRI brain confirms lesion (periventricular leukomalacia in preterm). Management: multidisciplinary — physio, OT, speech, orthotics, medications (baclofen for spasticity, botulinum toxin)."
    difficulty: medium
    tags: [cerebral palsy, spastic CP, GMFCS, developmental disability, pediatrics]
  - front: "What is the expected gross motor development in the first year of life?"
    back: "2 months: lifts head prone; 4 months: head control, rolls; 6 months: sits with support; 9 months: sits unsupported, stands with support; 12 months: pulls to stand, cruises, possibly walking\n\nCPS developmental surveillance: if not walking by 18 months → referral. 10% of children walk by 9 months, 50% by 12 months, 90% by 15 months. Independent walking after 18 months is a developmental delay requiring evaluation."
    difficulty: easy
    tags: [gross motor milestones, first year, motor development, walking, pediatrics]
  - front: "What are the features and management of a child with intellectual disability (ID)?"
    back: "ID: IQ <70 + adaptive behavior deficits in ≥2 areas (communication, self-care, home living, social skills); etiological workup: chromosomal microarray (first-line for unexplained ID), metabolic screen, MRI\n\nCPS recommends chromosomal microarray as first-line for unexplained developmental delay/ID — identifies cause in 15-20%. Fragile X testing in males with ID. Management: early intervention services, school support, behavioral therapies, treat comorbidities (epilepsy, ADHD, ASD)."
    difficulty: medium
    tags: [intellectual disability, developmental delay, chromosomal microarray, pediatrics]
  - front: "What social-emotional milestones are expected in infancy?"
    back: "0-2 months: social smile; 2-3 months: coos, vocalizes; 4-6 months: laughs, reaches for caregiver; 9 months: stranger anxiety, separation anxiety, object permanence; 12 months: joint attention, pointing\n\nJoint attention (following another person's gaze to an object and sharing that attention) develops at 9-12 months and is critical for language development. Absence of joint attention by 12 months is a red flag for autism spectrum disorder."
    difficulty: easy
    tags: [social-emotional milestones, joint attention, stranger anxiety, autism red flags, pediatrics]
  - front: "What is the role of lead screening in pediatric developmental assessment?"
    back: "Blood lead level testing at age 1-2 years in high-risk children: urban living, older housing (pre-1978), pica, immigrant from endemic country — elevated lead (>5 μg/dL) causes cognitive impairment\n\nNo safe level of blood lead exists. Sources: old paint (most common in Canada), imported ceramics, certain traditional medicines, water pipes. Treatment: chelation therapy (succimer DMSA) for blood lead >45 μg/dL. Primary prevention: blood lead level check, education."
    difficulty: medium
    tags: [lead poisoning, developmental delay, blood lead level, chelation, pediatrics]
  - front: "What is normal developmental variation versus delay in walking?"
    back: "Normal: most children walk independently by 14-15 months; variation up to 18 months is normal if other milestones normal, no neurological signs, and positive family history of late walking; refer if not walking by 18 months\n\nBottom shufflers and commando crawlers often walk later (up to 18 months) and have a family history. CPS: investigate late walking with developmental assessment, hip X-ray, and creatine kinase (DMD). Duchenne muscular dystrophy: X-linked, toe-walking, Gowers sign."
    difficulty: medium
    tags: [late walking, developmental variation, Duchenne muscular dystrophy, pediatrics]
  - front: "What is the management of a child with suspected learning disability?"
    back: "Formal psychoeducational assessment, vision and hearing screening, ADHD evaluation; school accommodation plan (IEP); evidence-based educational interventions (reading: phonics-based, Orton-Gillingham for dyslexia)\n\nLearning disabilities affect 5-15% of school-age children. Most common: dyslexia (reading disability). CPS recommends standardized psychoeducational testing by psychologist to diagnose learning disability and guide accommodations. Early identification and intervention are critical."
    difficulty: medium
    tags: [learning disability, dyslexia, IEP, psychoeducational assessment, pediatrics]
  - front: "What are the Denver II developmental milestones at 12 months?"
    back: "Gross motor: walks with support. Fine motor: pincer grasp. Language: 1-3 words, follows simple commands. Social: waves bye, separation anxiety\n\nRed flags: no babbling by 12mo, no gestures by 12mo, no single words by 16mo, no 2-word phrases by 24mo. Refer for developmental assessment if >=2 domains delayed."
    difficulty: medium
    tags: [development, milestones]
  - front: "What are the key Denver developmental milestones at 2, 4, 6, 9, and 12 months?"
    back: "2mo: social smile, lifts head prone. 4mo: reaches for objects, rolls front-to-back, laughs. 6mo: sits unsupported, transfers objects, babbles. 9mo: pulls to stand, pincer grasp developing, stranger anxiety, says mama/dada nonspecific. 12mo: walks with one hand held, 1-3 words, pincer grasp mature.\n\nThe Denver Developmental Screening Test (DDST-II) assesses gross motor, fine motor-adaptive, language, and personal-social domains. Canadian Paediatric Society recommends developmental surveillance at every well-child visit with standardized screening at 18 and 24 months."
    difficulty: medium
    tags: [Denver milestones, development, screening, pediatrics]
  - front: "What are the developmental milestones at 18 months, 2 years, 3 years, and 4 years?"
    back: "18mo: walks alone, stacks 2-4 blocks, 10-25 words, feeds with spoon, points. 2yr: runs, kicks ball, stacks 6 blocks, 2-word phrases, 50+ words, parallel play. 3yr: tricycle, copies circle, 3-word sentences, knows name/age, group play. 4yr: hops, copies cross, tells stories, cooperative play, dresses independently.\n\nLanguage development is the most sensitive indicator of overall development. Failure to produce single words by 18 months or 2-word phrases by 24 months warrants referral. CPS recommends M-CHAT-R/F screening for autism at 18 and 24 months."
    difficulty: medium
    tags: [developmental milestones, language development, pediatrics]
  - front: "What are the red flags for autism spectrum disorder and when should screening occur?"
    back: "Red flags: no babbling by 12 months, no pointing/gesturing by 12 months, no single words by 16 months, no 2-word phrases by 24 months, loss of previously acquired skills at any age, lack of joint attention, no pretend play by 18 months. Screen with M-CHAT-R/F at 18 and 24 months.\n\nCPS and AAP recommend universal ASD screening at 18 and 24 months. Early intervention (before age 3) significantly improves outcomes. DSM-5 criteria: persistent deficits in social communication AND restricted/repetitive behaviors, present from early childhood."
    difficulty: hard
    tags: [autism, ASD, screening, red flags, pediatrics]
  - front: "What is the approach to a child with global developmental delay?"
    back: "Defined as significant delay (>=2 SD below mean) in >=2 developmental domains. Workup: detailed history (prenatal, birth, family), physical exam (dysmorphology, neurocutaneous signs), genetic testing (chromosomal microarray first-line), metabolic screen (TSH, amino acids, organic acids), MRI brain, hearing and vision testing.\n\nChromosomal microarray has replaced karyotype as first-line genetic test (diagnostic yield 15-20%). Fragile X testing in all males with unexplained GDD. Inborn errors of metabolism are rare but treatable causes. Canadian guidelines recommend early referral to developmental pediatrics."
    difficulty: hard
    tags: [global developmental delay, workup, genetic testing, pediatrics]
  - front: "What is the differential diagnosis for speech delay in a toddler?"
    back: "Hearing loss (most important to exclude), autism spectrum disorder, intellectual disability, environmental deprivation/bilingualism (expressive only, receptive normal), expressive language disorder, oral motor dysfunction (dysarthria), selective mutism, genetic syndromes (Down, Fragile X).\n\nCPS recommends audiological assessment for any child with speech delay. Universal Newborn Hearing Screening (UNHS) is standard in Canadian provinces. Bilingualism does NOT cause language delay-total vocabulary across both languages should be considered."
    difficulty: medium
    tags: [speech delay, hearing loss, differential diagnosis, pediatrics]
  - front: "What are the primitive reflexes, when do they appear, and when should they disappear?"
    back: "Moro: birth-4mo. Palmar grasp: birth-6mo. Rooting: birth-4mo. Tonic neck (ATNR): birth-6mo. Parachute reflex: appears 8-9mo, persists. Babinski: birth-12mo (up to 2yr normal). Persistence beyond expected age suggests upper motor neuron pathology.\n\nPersistence of primitive reflexes beyond normal timeframes suggests cerebral palsy or other CNS pathology. Absence at birth suggests CNS depression. The parachute reflex (protective extension) is unique in that it appears and persists-its absence by 12 months is concerning."
    difficulty: medium
    tags: [primitive reflexes, Moro, neurological development, pediatrics]
  - front: "What is cerebral palsy, its classification, and management approach?"
    back: "CP: non-progressive motor disorder from injury to developing brain. Classification by motor type: spastic (70-80%), dyskinetic, ataxic, mixed. By distribution: hemiplegia, diplegia, quadriplegia. Management: multidisciplinary (PT, OT, speech), botulinum toxin for spasticity, orthopedic surgery, baclofen pump for generalized spasticity.\n\nCP is the most common physical disability in children (2-3 per 1000). Prematurity is the strongest risk factor. MRI shows periventricular leukomalacia in premature and hypoxic-ischemic injury in term infants. Canadian CP registries track outcomes. Early intervention improves function."
    difficulty: hard
    tags: [cerebral palsy, spasticity, classification, pediatrics]
  - front: "What growth parameters are monitored in well-child visits and when are they concerning?"
    back: "Weight, length/height, head circumference (until 2 years), BMI (after 2 years). Concerning: crossing 2 major percentile lines, weight <3rd or >97th percentile, head circumference >97th (hydrocephalus, megalencephaly) or <3rd (microcephaly). Weight faltering: weight-for-age <2nd percentile or crossing down 2 lines.\n\nCanadian Paediatric Society recommends WHO growth charts for children 0-5 years and CDC charts for 5-19 years. Failure to thrive is a clinical sign, not a diagnosis-workup includes feeding history, caloric intake, organic causes (celiac, CF, GERD), and psychosocial assessment."
    difficulty: medium
    tags: [growth monitoring, growth charts, failure to thrive, pediatrics]
  - front: "What is the Rourke Baby Record and what does it cover?"
    back: "The Rourke Baby Record is a Canadian evidence-based health supervision guide for well-baby/child visits from birth to 5 years. It covers: growth monitoring, nutrition, developmental milestones, immunizations, physical exam, screening (hearing, vision, dental, anemia, lead), anticipatory guidance, and parental concerns.\n\nThe Rourke Baby Record is updated regularly and used across Canada as the standard well-child visit template. It integrates CPS, Dietitians of Canada, and CFPC recommendations. Key screening: hemoglobin at 9-12 months, dental assessment by 12 months, vision screening at 3-5 years."
    difficulty: easy
    tags: [Rourke Baby Record, well-child visit, screening, pediatrics]
  - front: "What are the screening recommendations for iron deficiency in Canadian infants?"
    back: "Screen hemoglobin at 9-12 months for all infants. Risk factors: prematurity, low birth weight, exclusive breastfeeding beyond 6 months without iron supplementation, cow milk before 9-12 months, low socioeconomic status, Indigenous populations. Iron supplementation 1mg/kg/day recommended for exclusively breastfed infants starting at 4-6 months.\n\nIron deficiency is the most common nutritional deficiency in Canadian infants. CPS recommends iron-fortified cereals as first complementary food. Iron deficiency (even without anemia) affects neurodevelopment. Cow milk before 9 months increases risk due to low iron content and occult GI blood loss."
    difficulty: medium
    tags: [iron deficiency, anemia, infant nutrition, pediatrics]
  - front: "What are the key features of fetal alcohol spectrum disorder (FASD)?"
    back: "Sentinel facial features: short palpebral fissures, smooth philtrum, thin upper lip. CNS: microcephaly, structural brain abnormalities, cognitive impairment, behavioral issues (ADHD-like, executive dysfunction). Growth: prenatal and/or postnatal growth deficiency. Confirmed maternal alcohol exposure. Canadian Diagnostic Guidelines use 4-digit code.\n\nFASD prevalence in Canada is estimated at 1-5% (higher in some Indigenous communities). The 2016 Canadian FASD Diagnostic Guidelines require multidisciplinary assessment. No safe level of alcohol in pregnancy. Prevention through public health messaging is the primary strategy."
    difficulty: hard
    tags: [FASD, fetal alcohol syndrome, teratogen, pediatrics]
  - front: "When should a child be referred for developmental assessment vs monitored?"
    back: "Refer immediately: any loss of milestones (regression), no babbling/gestures by 12 months, no words by 18 months, no 2-word phrases by 24 months, not walking by 18 months. Monitor with closer follow-up: mild delay in one domain, family history of late talkers, environmental factors identified.\n\nCPS recommends a low threshold for referral. Developmental regression at any age is a red flag for neurodegenerative disease, ASD, or Rett syndrome and warrants urgent investigation including metabolic and genetic workup. Wait-and-see approach is inappropriate for regression."
    difficulty: hard
    tags: [developmental referral, regression, red flags, pediatrics]
  - front: "What anticipatory guidance should be provided at key well-child visits?"
    back: "Newborn: safe sleep (back to sleep, firm mattress, no co-sleeping), breastfeeding support. 2-6mo: tummy time, car seat safety. 6-12mo: choking hazards, water safety, introduction of solids. 1-2yr: dental care, limit screen time, poison prevention. 3-5yr: helmet use, stranger safety, school readiness.\n\nCPS Caring for Kids provides evidence-based anticipatory guidance. Screen time recommendations: avoid for <2 years, limit to <1 hour/day ages 2-5. Safe sleep practices reduce SIDS risk. Canadian car seat guidelines: rear-facing as long as possible (minimum to 2 years/weight limit)."
    difficulty: easy
    tags: [anticipatory guidance, well-child, safety, pediatrics]
  - front: "What is the approach to a child with short stature?"
    back: "Evaluate growth velocity (most important), bone age, mid-parental height. Investigations: CBC, ESR, electrolytes, creatinine, TSH, celiac screen (TTG-IgA), IGF-1, bone age X-ray. Most common causes: familial short stature (normal growth velocity, bone age = chronological age) and constitutional delay (delayed bone age, delayed puberty, catches up).\n\nPathological short stature: growth velocity <25th percentile, height >2 SD below mid-parental target, crossing percentiles downward. Consider: GH deficiency, Turner syndrome (karyotype in all short girls), hypothyroidism, celiac disease, chronic disease. Canadian Pediatric Endocrine Group guidelines address GH therapy indications."
    difficulty: hard
    tags: [short stature, growth, endocrine, pediatrics]
  - front: "What are the key differences between ADHD, ASD, and intellectual disability in presentation?"
    back: "ADHD: inattention, hyperactivity, impulsivity; normal social skills; age-appropriate cognitive function. ASD: social communication deficits, restricted/repetitive behaviors; may have normal or impaired IQ; onset <3 years. ID: significant cognitive impairment (IQ <70) with adaptive function deficits; may have social interest. Comorbidity is common (30% overlap).\n\nDSM-5 allows dual diagnosis of ADHD + ASD (previously exclusive). Canadian guidelines recommend comprehensive psychoeducational assessment. ADHD affects 5-7% of Canadian children. First-line treatment: methylphenidate or amphetamine for ADHD; behavioral interventions for ASD."
    difficulty: medium
    tags: [ADHD, ASD, intellectual disability, differential, pediatrics]
  - front: "What is the M-CHAT-R screening tool for autism?"
    back: "Modified Checklist for Autism in Toddlers, Revised. Screen at 18 and 24 months. 20 yes/no questions on social/communication behaviors. Score >=3 positive: follow-up interview then referral for diagnostic assessment\n\nRed flags: no pointing by 12mo, no single words by 16mo, no 2-word phrases by 24mo, loss of previously acquired skills. DSM-5 ASD: persistent deficits in social communication + restricted/repetitive behaviors."
    difficulty: medium
    tags: [autism, M-CHAT, screening]
  - front: "Define failure to thrive in pediatrics and outline the initial approach."
    back: "Failure to thrive (FTT): weight <3rd percentile, weight crossing down 2 or more major percentile lines, or weight-for-length <5th percentile. Initial approach: thorough dietary history (caloric intake), feeding observation, psychosocial assessment, growth chart review (WHO charts for 0–2 years, CDC for 2–19 years in Canada), basic labs (CBC, electrolytes, urinalysis, celiac screen, TSH).\n\nThe CPS uses WHO growth standards for children 0–5 years. FTT is most commonly caused by inadequate caloric intake (environmental/psychosocial) rather than organic disease. Weight is affected first, then length, then head circumference. The pattern helps distinguish nutritional deficiency from genetic conditions or endocrinopathies."
    difficulty: medium
    tags: [failure-to-thrive, growth-charts, WHO, CPS, caloric-intake, pediatric-nutrition]
  - front: "Which growth charts should be used in Canada for children, and what is catch-up versus catch-down growth?"
    back: "WHO growth standards for ages 0–5 years (based on breastfed infants as norm); CDC growth charts for 5–19 years. Catch-up growth: a small-for-gestational-age infant crossing percentiles upward in the first 12–18 months to reach genetic potential. Catch-down growth: a large infant crossing percentiles downward to reach genetic potential. Both are normal if following a consistent trajectory after adjustment.\n\nThe CPS endorsed WHO charts in 2010, replacing CDC charts for under-5s, because WHO charts represent optimal growth in breastfed infants. Pathologic growth should be distinguished from physiologic catch-up/catch-down by assessing the child's genetic potential (mid-parental height) and monitoring for crossing more than 2 major percentile lines."
    difficulty: medium
    tags: [growth-charts, WHO, CDC, catch-up-growth, catch-down-growth, CPS]
  - front: "List the key developmental milestones that, if absent, are red flags at 2 months, 9 months, 18 months, and 24 months."
    back: "2 months: no social smile, no visual fixation/tracking. 9 months: no babbling, no sitting independently, no stranger anxiety. 18 months: no single words, no pointing, no walking independently. 24 months: no 2-word phrases, no imitative play, vocabulary <50 words.\n\nThe CPS Rourke Baby Record and Nipissing District Developmental Screen (NDDS) are widely used in Canadian practice for developmental surveillance. Missing these milestones warrants referral for developmental assessment. Early identification and intervention (especially for autism spectrum disorder) significantly improves outcomes."
    difficulty: easy
    tags: [developmental-milestones, red-flags, Rourke-Baby-Record, NDDS, CPS]
  - front: "What are the DSM-5 diagnostic criteria for ADHD, and what is the first-line pharmacologic treatment?"
    back: "DSM-5 requires ≥6 symptoms of inattention and/or ≥6 symptoms of hyperactivity-impulsivity (≥5 for age ≥17), present for ≥6 months, onset before age 12, symptoms in ≥2 settings (home + school), with functional impairment, and not better explained by another disorder. Subtypes: predominantly inattentive, predominantly hyperactive-impulsive, or combined. First-line treatment: psychostimulants — methylphenidate (Ritalin, Concerta) or amphetamine-based (Adderall, Vyvanse).\n\nThe CPS recommends a multimodal approach including behavioural strategies, classroom accommodations (preferential seating, extended time), and medication. In Canada, ADHD affects 5–7% of school-age children. Second-line agents include atomoxetine (non-stimulant) and guanfacine. Medication monitoring should include height, weight, blood pressure, and heart rate."
    difficulty: medium
    tags: [ADHD, DSM-5, methylphenidate, stimulants, CPS, classroom-accommodations]
  - front: "What is the M-CHAT-R/F and how is it used for autism screening?"
    back: "Modified Checklist for Autism in Toddlers, Revised with Follow-up. 20-item parent questionnaire administered at 18 and 24 months. Score >=3: positive screen, proceed to follow-up interview. Score >=8: high risk, refer directly for diagnostic evaluation. Sensitivity ~85%, specificity ~95% with follow-up.\n\nCanadian Paediatric Society recommends developmental surveillance at every well-child visit and autism-specific screening at 18-24 months. A positive M-CHAT requires follow-up, not immediate diagnosis. Diagnostic assessment uses DSM-5 criteria with multidisciplinary team (ADOS-2 is the gold standard diagnostic tool)."
    difficulty: medium
    tags: [M-CHAT, autism-screening, toddler, developmental-surveillance, CPS]
  - front: "What are the DSM-5 diagnostic criteria for ADHD?"
    back: ">=6 symptoms (age <17) or >=5 (age >=17) of inattention AND/OR hyperactivity-impulsivity, present for >=6 months, onset before age 12, present in >=2 settings, causing functional impairment, not better explained by another disorder. Presentations: predominantly inattentive, predominantly hyperactive-impulsive, or combined.\n\nCanadian ADHD Practice Guidelines (CADDRA) recommend multi-informant assessment (parent, teacher, self). Rating scales (Conners, SNAP-IV) support but do not replace clinical diagnosis. Girls are underdiagnosed due to predominantly inattentive presentation. ADHD persists into adulthood in 60-70% of cases."
    difficulty: medium
    tags: [ADHD, DSM-5, diagnosis, CADDRA, inattention]
  - front: "How do you evaluate a child with isolated speech delay?"
    back: "Red flags: no babbling by 12 months, no words by 18 months, no 2-word phrases by 24 months. Workup: audiometry (hearing loss is the most common treatable cause), developmental assessment, consider referral to SLP. Evaluate for ASD (joint attention, social reciprocity, play skills), intellectual disability, and bilingual exposure.\n\nCanadian Paediatric Society emphasizes that hearing assessment is mandatory in all children with speech delay. Late talkers (18-24 months) have 50-70% chance of catching up but should be monitored. Expressive language delay alone has better prognosis than combined receptive-expressive delay, which warrants urgent referral."
    difficulty: medium
    tags: [speech-delay, audiometry, red-flags, SLP-referral, developmental-milestones]
  - front: "What is the classification system for cerebral palsy?"
    back: "By motor type: spastic (most common, 70-80%), dyskinetic (dystonic/choreoathetoid), ataxic, mixed. By distribution: hemiplegia (one side), diplegia (legs > arms), quadriplegia (all limbs). By function: GMFCS levels I-V (I = walks independently, V = transported in wheelchair).\n\nCP is a non-progressive motor disorder caused by brain injury before age 2. Most common cause in term infants is perinatal hypoxic-ischemic encephalopathy. In preterm infants, periventricular leukomalacia predominates (causing spastic diplegia). MRI is indicated to identify etiology. GMFCS guides therapy goals and prognosis."
    difficulty: medium
    tags: [cerebral-palsy, classification, GMFCS, spastic, motor-disorder]
  - front: "What are learning disabilities and how are they evaluated?"
    back: "Neurodevelopmental disorders causing specific difficulty in reading (dyslexia), math (dyscalculia), or written expression (dysgraphia) despite adequate intelligence and instruction. Evaluation: psychoeducational assessment (IQ testing + achievement testing showing significant discrepancy), rule out ADHD, anxiety, vision/hearing problems, and intellectual disability.\n\nLearning disabilities affect 5-10% of school-age children and are a common comorbidity with ADHD (30-50% overlap). Canadian education systems provide individualized education plans (IEPs). The physician's role is to rule out medical causes, identify comorbid conditions, and advocate for appropriate educational support."
    difficulty: medium
    tags: [learning-disability, dyslexia, psychoeducational-assessment, IEP, comorbidity]
  - front: "What developmental milestones should a 2-year-old typically achieve?"
    back: "Gross motor: runs, kicks ball, walks up stairs with support. Fine motor: stacks 6 blocks, turns pages, scribbles. Language: 50+ words, 2-word phrases, follows 2-step commands. Social: parallel play, imitates household tasks, points to show interest. Cognitive: symbolic play (pretend feeding doll).\n\nCanadian Paediatric Society Rourke Baby Record tracks milestones at each well-child visit. Absence of 2-word phrases by 24 months or loss of previously acquired skills at any age warrants urgent referral. Developmental screening tools (ASQ-3, NDDS) supplement clinical surveillance."
    difficulty: easy
    tags: [milestones, 2-year-old, developmental-screening, Rourke, well-child]
  - front: "What are the early signs of autism spectrum disorder in a toddler?"
    back: "Reduced eye contact, absent or reduced joint attention (not pointing to share interest), delayed or absent pretend play, lack of social smile/response to name by 12 months, language delay, repetitive behaviours (lining up toys), restricted interests, sensory sensitivities, lack of social reciprocity.\n\nCPS recommends screening at 18 and 24 months. Early intensive behavioural intervention (IBI/ABA) improves outcomes when started before age 4. Provincial wait times for diagnosis and therapy vary significantly across Canada. Family-centred care and parent coaching are integral to management."
    difficulty: medium
    tags: [autism, early-signs, toddler, joint-attention, ASD-screening]
  - front: "What is the first-line pharmacotherapy for ADHD in children and what monitoring is required?"
    back: "First-line: long-acting methylphenidate (Concerta, Biphentin) or amphetamine (Vyvanse). Start low, titrate to optimal dose. Monitoring: height, weight, BP, HR at baseline and every 3-6 months. Assess for appetite suppression, sleep disturbance, mood changes, tics. No routine ECG needed unless cardiac risk factors.\n\nCADDRA guidelines recommend stimulant medication as first-line combined with behavioural strategies. Growth monitoring is essential as stimulants may slow height velocity (typically by 1-2 cm over first 1-3 years, with catch-up). Drug holidays may be considered if growth is significantly affected. Non-stimulants (atomoxetine, guanfacine) are second-line."
    difficulty: medium
    tags: [ADHD-treatment, methylphenidate, stimulant, monitoring, CADDRA]
  - front: "At what age should global developmental delay be investigated with genetic testing?"
    back: "When a child <5 has significant delays in >=2 developmental domains. First-tier genetic testing: chromosomal microarray (CMA) is the recommended first-line genetic test (replaces karyotype). Consider fragile X testing (especially in boys). Additional: metabolic screen if regression or specific features, MRI brain, thyroid function.\n\nCMA identifies pathogenic copy number variants in 15-20% of children with unexplained GDD/intellectual disability. Canadian Medical Genetics guidelines recommend CMA as first-tier. Whole exome sequencing is increasingly used when CMA is non-diagnostic. An identifiable genetic cause is found in ~40% of cases with comprehensive workup."
    difficulty: hard
    tags: [global-developmental-delay, chromosomal-microarray, genetic-testing, fragile-X, investigation]
  - front: "What is developmental coordination disorder (DCD) and how is it diagnosed?"
    back: "Motor skills significantly below expected for age, interfering with daily activities and academic performance. Not explained by intellectual disability, visual impairment, or neurological condition. Diagnosis requires standardized motor assessment (MABC-2). Onset in early developmental period. Affects 5-6% of school-age children.\n\nDCD (previously dyspraxia) is often underdiagnosed. Canadian guidelines recommend occupational therapy as primary intervention. DCD commonly co-occurs with ADHD (50%), learning disabilities, and anxiety. Children with DCD are at risk for obesity and reduced physical activity. Task-oriented approaches to OT are most effective."
    difficulty: medium
    tags: [DCD, motor-coordination, occupational-therapy, diagnosis, comorbidity]
