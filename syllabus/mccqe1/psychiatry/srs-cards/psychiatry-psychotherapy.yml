# Psychiatry Psychotherapy (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What common factors account for the majority of positive psychotherapy outcomes?"
    back: "Common factors account for 60–90% of therapy outcomes and include: warmth (unconditional positive regard), accurate empathy, genuineness, goodness of fit, and the therapeutic relationship with the provider.\n\nOnly 10–40% of therapy outcome is due to specific factors (techniques particular to each modality). Research shows that effective psychotherapy creates observable changes in brain circuitry and connectivity, but these changes differ from those produced by pharmacological treatments."
    difficulty: easy
    tags: [psychiatry, psychotherapy, common factors, therapeutic alliance]
  - front: "What are the 4 key problem areas addressed in Interpersonal Therapy (IPT), and what conditions is it primarily indicated for?"
    back: "4 problem areas: (1) Grief and loss, (2) Role transitions, (3) Conflict, (4) Interpersonal deficits.\nPrimarily indicated for: mood disorders (depression, bipolar disorder).\n\nIPT involves weekly sessions over 12–20 sessions. Ideal candidates have depression or bipolar disorder with some insight and difficult social functioning. It is not appropriate for patients with severe psychotic processes, personality disorders, or comorbid substance use disorders."
    difficulty: easy
    tags: [psychiatry, IPT, interpersonal therapy, psychotherapy, depression]
  - front: "What are the four behavioural techniques used in CBT and how does each work?"
    back: "1. Systematic desensitization: gradually approach anxiety-provoking situations in a relaxed state\n2. Flooding: confront feared stimulus for prolonged periods until no longer frightening\n3. Positive reinforcement: strengthen behaviour by rewarding it\n4. Negative reinforcement: increase behaviour frequency by removing an aversive stimulus when desired behaviour occurs\nAlso: Extinction (diminish behaviour by not rewarding) and Punishment/aversion therapy (diminish behaviour by applying noxious stimulus)\n\nCBT combines cognitive (thought records to identify automatic thoughts) and behavioural components. It is indicated for most mental health disorders including mood, anxiety, OCD, personality, eating, substance use, and psychotic disorders. Typically 12–20 weekly sessions."
    difficulty: medium
    tags: [psychiatry, CBT, cognitive behavioural therapy, psychotherapy, behavioural techniques]
  - front: "What are the four skill areas and four components of Dialectical Behaviour Therapy (DBT)?"
    back: "4 skill areas: (1) Mindfulness, (2) Emotional regulation, (3) Interpersonal effectiveness, (4) Distress tolerance\n4 components: (1) Individual therapy, (2) Group skills training, (3) Phone consultations, (4) Consultation team\n\nDBT combines CBT techniques with Buddhist Zen mindfulness and dialectical philosophy. It is primarily indicated for borderline personality disorder (BPD) or borderline traits with severe emotional dysregulation, impulsivity, or self-harm. Duration is typically 1 year with weekly individual and group therapy."
    difficulty: easy
    tags: [psychiatry, DBT, dialectical behaviour therapy, borderline personality, psychotherapy]
  - front: "What do the acronyms CAPE, RULE, and OARS stand for in Motivational Interviewing (MI)?"
    back: "CAPE (Spirit of MI): Compassion, Acceptance, Partnership, Evocation\nRULE (Principles): Resist righting reflex, Understand client reasons for change, Listen, Empower (convey hope and support autonomy)\nOARS (Techniques): Open-ended questions, Affirmations, Reflections, Summaries\n\nMI is primarily indicated for substance use disorders and maladaptive behaviour patterns. Brief interventions can be effective with as little as 15 minutes. Motivational Enhancement Therapy (MET) consists of 4 sessions. Addiction is a chronic condition requiring boosters over time."
    difficulty: medium
    tags: [psychiatry, motivational interviewing, MI, substance use, psychotherapy]
  - front: "Which psychotherapy modality is most time-intensive, and what are its indications and techniques?"
    back: "Psychoanalytic/Psychodynamic Therapy is the most time-intensive:\n- Psychoanalysis: 4–5 sessions/week for 3–7 years\n- Psychodynamically oriented therapy: 2–3 sessions/week for fewer years\nIndications: Anxiety, obsessional thinking, conversion disorder, depression\nTechniques: Free association, dream interpretation, transference analysis\nIdeal candidates: Psychologically minded, highly motivated, able to withstand difficult emotions, high level of function\n\nThe theory explores the meaning of early experiences (recollection), reliving them with the therapist (repetition), and gaining insight (working through). Not suitable for patients with acute psychosis or inability to tolerate difficult emotions without fleeing or self-destructive acts."
    difficulty: easy
    tags: [psychiatry, psychodynamic therapy, psychoanalysis, psychotherapy]
