# Hematology (Hematology) - generated from srs-mccqe1
cards:
  - front: "What are the normal values for hemoglobin, MCV, and platelets?"
    back: "Hemoglobin: 115-155 g/L (female), 125-170 g/L (male). MCV: 80-100 fL. Platelets: 130-380 × 10⁹/L. RDW: 11.5-15.5%. Reticulocyte count: 23-90 × 10⁹/L (0.5-1.5%).\n\nMCV classifies anemias as microcytic (<80), normocytic (80-100), or macrocytic (>100). RDW measures variation in RBC size (anisocytosis). A high RDW with microcytosis suggests iron deficiency (variable cell sizes), while normal RDW suggests β-thalassemia minor (uniform small cells)."
    difficulty: easy
    tags: [hematology, CBC, normal values]
  - front: "How do you use RDW to distinguish iron deficiency anemia from β-thalassemia minor?"
    back: "Iron deficiency: increased RDW (anisocytosis) because cells are of varying sizes as the deficiency progresses. β-thalassemia minor: normal RDW with high RBC count, because the red cell abnormality is not progressive and cells are uniformly small.\n\nBoth conditions present with microcytic anemia (low MCV). Iron deficiency shows low ferritin, low serum iron, high TIBC, and low transferrin saturation. β-thalassemia minor shows normal/elevated iron studies, elevated HbA2 on hemoglobin electrophoresis, and target cells on smear."
    difficulty: medium
    tags: [hematology, anemia, microcytic anemia]
  - front: "What RBC shapes are seen on peripheral smear and what conditions are they associated with?"
    back: "Spherocytes: hereditary spherocytosis, AIHA. Schistocytes: MAHA/TMA (TTP, HUS, DIC, HELLP). Sickle cells: HbSS, HbSC. Target cells: liver disease, thalassemia, HbSC. Dacrocytes (teardrops): myelofibrosis. Acanthocytes (spur cells): severe liver disease. Rouleaux: MM, inflammatory conditions.\n\nPeripheral blood film examination is essential for diagnosing hematologic conditions. Schistocytes (helmet cells/fragments) indicate mechanical destruction of RBCs in the microvasculature and should prompt investigation for TMA. Auer rods in WBCs are pathognomonic for AML."
    difficulty: medium
    tags: [hematology, blood film, morphology]
  - front: "What RBC inclusions are pathognomonic or highly associated with specific conditions?"
    back: "Howell-Jolly bodies: post-splenectomy/hyposplenic states. Heinz bodies: G6PD deficiency (post-oxidant exposure). Basophilic stippling: lead poisoning, thalassemia. Sideroblasts (ring sideroblasts in BM): sideroblastic anemia, MDS.\n\nHowell-Jolly bodies are nuclear remnants normally removed by the spleen; their presence indicates functional or anatomic asplenia. Heinz bodies are denatured hemoglobin visible with supravital staining. Basophilic stippling represents ribosome aggregation seen with heavy metal poisoning."
    difficulty: medium
    tags: [hematology, blood film, RBC inclusions]
  - front: "What is the significance of Auer rods on blood film?"
    back: "Auer rods are cytoplasmic inclusions forming long needles in myeloblasts. They are pathognomonic for acute myeloid leukemia (AML). If >20% blasts on WBC differential, this is acute leukemia and constitutes a medical emergency.\n\nAuer rods are fused primary granules composed of crystallized myeloperoxidase. They are never seen in ALL or lymphoid malignancies. Their presence helps distinguish AML from ALL, which is critical for treatment decisions. Multiple Auer rods (faggot cells) are characteristic of APL (M3)."
    difficulty: medium
    tags: [hematology, AML, diagnosis]
  - front: "What features differentiate AML from ALL?"
    back: "AML: adults ('big people'), large blasts with abundant cytoplasm, 3-5 nucleoli, granules, Auer rods, myeloperoxidase/Sudan black stain positive. ALL: children ('small people'), small blasts with scant cytoplasm, 1-3 nucleoli, no granules, no Auer rods, PAS stain positive. Mnemonic: 'Big and SmALL'.\n\nAML has a higher mortality rate in adults, while ALL is the most common childhood cancer with high cure rates (>85%). Treatment differs significantly: AML uses induction with cytarabine + daunorubicin (7+3), while ALL uses multi-agent regimens including vincristine, prednisone, and CNS prophylaxis."
    difficulty: medium
    tags: [hematology, AML, ALL, leukemia]
  - front: "What is the Ann Arbor staging system for lymphomas?"
    back: "Stage I: single lymph node region or extralymphatic site (IE). Stage II: ≥2 lymph node regions on same side of diaphragm. Stage III: lymph node regions on both sides of diaphragm. Stage IV: diffuse involvement of extralymphatic organs including bone marrow. Suffix A = no B-symptoms; B = B-symptoms present.\n\nB-symptoms include unintentional weight loss ≥10% in 6 months, fever >38°C, and night sweats for ≥2 weeks. The staging system is used for both Hodgkin and non-Hodgkin lymphomas and is essential for treatment decisions and prognosis."
    difficulty: easy
    tags: [hematology, lymphoma, staging]
  - front: "What are the classic features of Hodgkin lymphoma and what cell is diagnostic?"
    back: "Reed-Sternberg cells (large binucleated cells with 'owl-eye' appearance) are diagnostic. Presentation: asymptomatic cervical/supraclavicular lymphadenopathy (60-80%), non-tender, rubbery. Bimodal age distribution: peaks at 20 and >50 years. Spreads contiguously from one nodal site to adjacent nodes.\n\nHodgkin lymphoma is associated with EBV in up to 50% of cases. Treatment is stage-dependent: stage I-II receives ABVD + radiation; stage III-IV receives chemotherapy (ABVD or BEACOPP). Overall prognosis is excellent with >80% cure rate. Treatment complications include secondary malignancies, cardiac disease, and infertility."
    difficulty: medium
    tags: [hematology, Hodgkin lymphoma, oncology]
  - front: "What are the key chromosome translocations associated with specific lymphomas?"
    back: "t(8;14) c-Myc: Burkitt lymphoma. t(14;18) Bcl-2: Follicular lymphoma. t(11;14) Cyclin D1: Mantle cell lymphoma. t(11;18) MALT1: MALT lymphoma. t(2;5) ALK: Anaplastic large cell lymphoma.\n\nThese translocations result in overexpression of specific oncogenes that drive lymphomagenesis. Bcl-2 inhibits apoptosis (follicular lymphoma), c-Myc drives cell proliferation (Burkitt), and Cyclin D1 promotes cell cycle progression (mantle cell). These are important for classification and targeted therapy."
    difficulty: hard
    tags: [hematology, lymphoma, genetics]
  - front: "What is the characteristic finding on peripheral blood smear in CLL, and what are the flow cytometry markers?"
    back: "Smear: small mature lymphocytes with smudge cells (damaged fragile lymphocytes). Flow cytometry: CD5+, CD20dim, CD23+, with light chain restriction. Diagnosis requires clonal B lymphocytes >5 × 10⁹/L.\n\nCLL is the most common leukemia in the Western world, predominantly affecting older patients (median age 70). 25% are asymptomatic incidental findings. Richter transformation to DLBCL occurs in 5%. Treatment includes observation for early disease, with venetoclax + obinutuzumab or BTK inhibitors for progressive disease."
    difficulty: medium
    tags: [hematology, CLL, leukemia]
  - front: "What is the SLiM CRAB criteria for diagnosing multiple myeloma?"
    back: "SLiM: ≥60% clonal plasma cells in BM (Sixty percent), Light chain ratio ≥100 (involved/uninvolved), MRI with >1 bone lesion ≥5mm. CRAB (end-organ damage): Calcium elevated, Renal failure, Anemia, Bone lytic lesions.\n\nMultiple myeloma is the most common plasma cell malignancy. SPEP shows monoclonal protein spike in 80%. 15-20% produce only light chains (Bence-Jones protein in urine). Bone scans are NOT useful as they detect osteoblast activity, while myeloma causes osteolytic lesions. Spinal cord compression (10-20%) is a medical emergency."
    difficulty: hard
    tags: [hematology, multiple myeloma, oncology]
  - front: "What defines MGUS and what is the annual risk of malignant transformation?"
    back: "MGUS criteria: serum M protein <30 g/L, <10% plasma cells in BM, absence of SLiM CRAB. Annual risk of malignant transformation: 0.3-1% per year. Higher risk with: M protein ≥15 g/L, abnormal free light chain ratio, IgA or IgM type.\n\nMGUS is found in 5% of people >70 years. It is considered pre-malignant and requires monitoring with history, physical, CBC, Cr, calcium, albumin, LDH, and SPEP every 6-12 months. Patients may transform to multiple myeloma, lymphoplasmacytic lymphoma, or amyloidosis."
    difficulty: medium
    tags: [hematology, MGUS, plasma cell disorders]
  - front: "What are the key features and complications of Waldenström macroglobulinemia (lymphoplasmacytic lymphoma)?"
    back: "Proliferation of lymphoplasmacytoid cells producing monoclonal IgM. Triad: anemia + hyperviscosity + plasma volume expansion. Key complication: hyperviscosity syndrome (headaches, stroke, angina, retinal venous engorgement). Accounts for 85% of all hyperviscosity cases. Treatment: chemotherapy + rituximab; plasmapheresis for acute hyperviscosity.\n\nUnlike myeloma, bone lesions and hypercalcemia are rare in LPL. IgM is large and confined mainly to the intravascular space, making hyperviscosity more common than in myeloma. Cold hemagglutinin disease (Raynaud phenomenon, hemolytic anemia) can be associated."
    difficulty: hard
    tags: [hematology, Waldenstrom, plasma cell disorders]
  - front: "What are the metabolic complications of tumour lysis syndrome?"
    back: "Increased: potassium, uric acid, phosphate (released from lysed cells). Decreased: calcium (bound by excess phosphate). Complications: lethal cardiac arrhythmia (hyperkalemia), acute kidney injury (uric acid/calcium phosphate deposition).\n\nTLS is most common in diseases with large tumour burden and high proliferative rate (high-grade lymphoma, acute leukemia). Prevention: aggressive IV hydration, allopurinol (prevents uric acid formation) or rasburicase (breaks down existing uric acid). Alkalinization is NOT recommended due to risk of calcium phosphate precipitation."
    difficulty: medium
    tags: [hematology, tumour lysis syndrome, oncology emergency]
  - front: "What is the threshold for RBC transfusion and how much does 1 unit of pRBC increase hemoglobin?"
    back: "Transfuse at Hb <70 g/L (may change based on patient tolerance). Maintain Hb 70-90 g/L during active bleeds. Consider higher threshold for CAD/unstable coronary syndromes. 1 unit of packed RBC increases Hb by approximately 10 g/L.\n\nRestrictive transfusion strategy (Hb <70 g/L) is as safe or safer than liberal strategy in most patients. Each unit is infused over 2 hours (max 4 hours). O-negative blood is used for females of reproductive age in emergencies; O-positive for all others."
    difficulty: easy
    tags: [hematology, transfusion medicine]
  - front: "What is the most common cause of acute hemolytic transfusion reaction, and how do you manage it?"
    back: "Cause: ABO incompatibility (most commonly due to incorrect patient identification) causing intravascular hemolysis via complement activation. Presentation: fever, chills, hypotension, back/flank pain, hemoglobinuria, DIC, acute renal failure. Management: STOP transfusion, notify blood bank, check for clerical error, send hemolysis labs (CBC, bilirubin, LDH, reticulocytes, DAT), maintain BP with IV fluids, maintain urine output.\n\nRisk is <1/40,000 per unit. This is distinct from febrile nonhemolytic reactions (1/100, due to antibodies to donor WBC/platelets) and allergic reactions (1/100, IgE to donor plasma proteins). TRALI is the leading cause of transfusion-related mortality."
    difficulty: medium
    tags: [hematology, transfusion reactions, emergency]
  - front: "What is TRALI and how does it differ from TACO?"
    back: "TRALI: Transfusion-Related Acute Lung Injury — new-onset acute lung injury within 6h of transfusion. Hypoxemia (PaO2/FiO2 <300), bilateral pulmonary edema, NO left atrial hypertension. Leading cause of transfusion mortality. TACO: Transfusion-Associated Circulatory Overload — due to impaired cardiac function/rapid transfusion. Dyspnea, hypertension, tachycardia, elevated venous pressure. Treatment: diuretics.\n\nTRALI typically occurs 2-4h post-transfusion and resolves in 24-72h. Treatment is supportive (oxygen). TACO presents with signs of fluid overload and responds to diuretics. TRALI shows normal/low BP while TACO shows hypertension. Both show bilateral pulmonary edema on imaging."
    difficulty: hard
    tags: [hematology, transfusion reactions, respiratory]
  - front: "What are the mechanisms and monitoring parameters for the major anticoagulant classes?"
    back: "UFH: inhibits Factor Xa/IIa via antithrombin, monitor aPTT, reverse with protamine. Warfarin: vitamin K antagonist (II, VII, IX, X), monitor INR (target 2-3), reverse with vitamin K/PCC/FP. LMWH: mainly Factor Xa inhibition, anti-Xa levels (only in renal failure/extremes of weight). DOACs: direct Xa (rivaroxaban, apixaban) or thrombin (dabigatran) inhibitors, no routine monitoring. Dabigatran reversed by idarucizumab; Xa inhibitors by andexanet alfa.\n\nWarfarin is teratogenic and cannot be used in pregnancy; heparin/LMWH is safe. DOACs are contraindicated in mechanical heart valves. LMWH can accumulate in renal failure (CrCl <30). HIT is a potentially fatal complication of heparin requiring immediate discontinuation and alternative anticoagulation."
    difficulty: hard
    tags: [hematology, anticoagulation, pharmacology]
  - front: "What management is recommended for supratherapeutic INR without bleeding?"
    back: "INR above therapeutic but <4.5: lower warfarin dose or omit a dose. INR 4.5-10: omit 1-2 doses ± oral vitamin K 1-2.5 mg if high bleeding risk. INR >10: hold warfarin + oral vitamin K 2.5-5 mg. Any INR with serious/life-threatening bleeding: hold warfarin + IV vitamin K 10 mg slow infusion + four-factor PCC.\n\nVitamin K takes 6-24 hours to reverse warfarin, while PCC provides immediate factor replacement. FP can be used if PCC is unavailable but requires larger volumes. These guidelines are from the American College of Chest Physicians Evidence-Based Clinical Practice Guidelines."
    difficulty: medium
    tags: [hematology, anticoagulation, warfarin, management]
  - front: "What is the CHOP chemotherapy regimen and when is it used?"
    back: "CHOP: Cyclophosphamide, Hydroxydoxorubicin (Adriamycin), vincristine (Oncovin), Prednisone. Used as the mainstay for aggressive non-Hodgkin lymphoma. Add rituximab (anti-CD20) for B-cell lymphomas = CHOP-R (R-CHOP).\n\nABVD (adriamycin, bleomycin, vinblastine, dacarbazine) is for Hodgkin lymphoma. BEACOPP is an alternative intensive regimen for advanced Hodgkin lymphoma. For Burkitt lymphoma (highly aggressive), CODOX-M/IVAC with rituximab is used. Treatment of HL depends on stage; treatment of NHL depends on histologic subtype."
    difficulty: medium
    tags: [hematology, chemotherapy, lymphoma]
  - front: "What are the mechanisms of action of imatinib, rituximab, and venetoclax?"
    back: "Imatinib (Gleevec): BCR-ABL tyrosine kinase inhibitor — used in CML. Rituximab (Rituxan): anti-CD20 monoclonal antibody — used in B-cell lymphomas and CLL. Venetoclax: Bcl-2 inhibitor (promotes apoptosis) — used in CLL.\n\nThese represent the shift toward targeted therapy in hematologic malignancies. Imatinib transformed CML from a fatal disease to one with >90% 10-year survival. Rituximab added to CHOP improved outcomes in DLBCL. Venetoclax + obinutuzumab is a fixed-duration treatment for CLL."
    difficulty: medium
    tags: [hematology, pharmacology, targeted therapy]
  - front: "What are the indications for platelet transfusion based on platelet count?"
    back: "<10 × 10⁹/L: non-immune thrombocytopenia (prophylactic). <20: procedures without significant blood loss. <50: procedures with blood loss or major surgery. <100: neurosurgery or head trauma. Any count: platelet dysfunction with marked bleeding. Relative contraindications: TTP, HIT, post-transfusion purpura, HELLP.\n\nOne platelet pool should increase count by ≥15 × 10⁹/L. If no increase is seen, consider autoantibodies (ITP), alloantibodies (anti-HLA), consumption (bleeding, sepsis, DIC), or hypersplenism. Platelets are stored at 20-24°C with a short shelf life, unlike RBCs stored at 4°C for up to 42 days."
    difficulty: medium
    tags: [hematology, transfusion medicine, platelets]
  - front: "What is the Follicular Lymphoma International Prognostic Index (FLIPI)?"
    back: "Risk factors: age >60, >4 nodal areas, largest node >6 cm, elevated LDH, Lugano stage III-IV, Hb <120 g/L, high β2-microglobulin, BM involvement. Based on calculated risk, 5-year survival ranges from 53-91%.\n\nFollicular lymphoma is an indolent B-cell NHL (22-30% of NHLs) with t(14;18) Bcl-2 activation. It is rarely curable with a relapsing/remitting course. 3% per year risk of transformation to aggressive lymphoma (DLBCL). Treatment for advanced stage is symptom management with watchful waiting or bendamustine + rituximab."
    difficulty: hard
    tags: [hematology, follicular lymphoma, prognosis]
  - front: "What are the viral infection risks per unit of blood transfusion in Canada?"
    back: "HBV: 1/7,000,000. HCV: 1/12,000,000. HIV: 1/20,000,000. HTLV: 1/600,000,000. Other: EBV, CMV, West Nile virus.\n\nBlood product safety has dramatically improved through donor screening (questionnaire and serologic testing) and nucleic acid testing. In Canada, all blood products are leukodepleted by filtration immediately after collection, which reduces febrile nonhemolytic transfusion reactions and CMV transmission risk."
    difficulty: easy
    tags: [hematology, transfusion medicine, infectious disease]
  - front: "What distinguishes Burkitt lymphoma from other NHLs?"
    back: "Highly aggressive NHL with t(8;14) c-Myc activation. 'Starry-sky' histology. Endemic form (African, EBV-associated): massive jaw lymphadenopathy. Sporadic form: abdominal/GI involvement. High risk of tumour lysis syndrome upon treatment. Treatment: intensive short-burst chemotherapy (CODOX-M/IVAC + rituximab) with CNS and TLS prophylaxis.\n\nBurkitt lymphoma accounts for <1% of adult NHLs but 30% of childhood NHLs. It is an AIDS-defining illness in the HIV-related form. Despite being highly aggressive, it is very responsive to chemotherapy. The rapid proliferation rate necessitates aggressive TLS prophylaxis before treatment."
    difficulty: hard
    tags: [hematology, Burkitt lymphoma, oncology]
  - front: "What is the most common cause of anemia in North America?"
    back: "Iron deficiency anemia.\n\nIron deficiency anemia is the most common cause of anemia in North America. It presents with microcytic hypochromic anemia, low ferritin, low serum iron, elevated TIBC, and low transferrin saturation."
    difficulty: easy
    tags: [hematology, iron-deficiency-anemia]
  - front: "A patient with microcytic anemia has a ferritin of 12 ug/L. What is the diagnosis, and what ferritin cutoff is diagnostic?"
    back: "Iron deficiency anemia. A ferritin <30 ug/L is diagnostic of iron deficiency. In the setting of inflammatory conditions or liver disease, ferritin <100 ug/L is suggestive and warrants further workup.\n\nSerum ferritin is the most important blood test for measuring iron stores. However, ferritin is also an acute phase reactant, so it can be falsely elevated in inflammation, infection, malignancy, and liver disease."
    difficulty: easy
    tags: [hematology, iron-deficiency-anemia, iron-studies]
  - front: "How should oral iron supplementation be dosed for iron deficiency anemia, and why should it NOT be given more than once daily?"
    back: "Ferrous sulfate 325 mg once daily (65 mg elemental iron). Dosing more than once daily causes hepcidin upregulation, which decreases absorption and increases side effects without clinical benefit.\n\nHepcidin is a hormone produced by hepatocytes that regulates systemic iron levels. When iron is absorbed, hepcidin rises and inhibits further iron absorption by degrading ferroportin on enterocytes. Alternate-day dosing is equally effective and may be based on patient preference."
    difficulty: medium
    tags: [hematology, iron-deficiency-anemia, treatment]
  - front: "How do the iron indices differ between iron deficiency anemia and anemia of chronic disease?"
    back: "Iron deficiency: low ferritin, low serum iron, high TIBC, low % saturation, high RDW. Anemia of chronic disease: normal/high ferritin, low serum iron, low/normal TIBC, normal % saturation, normal RDW.\n\nIn anemia of chronic disease, hepcidin production is increased by inflammation, trapping iron in enterocytes and macrophages via ferroportin inhibition. This reduces plasma iron levels, making iron unavailable for new Hb synthesis despite adequate stores."
    difficulty: medium
    tags: [hematology, iron-deficiency-anemia, anemia-chronic-disease, iron-studies]
  - front: "What is the role of hepcidin in iron metabolism and anemia of chronic disease?"
    back: "Hepcidin binds to ferroportin (iron exporter on enterocytes and reticuloendothelial cells), inducing its degradation. This traps iron intracellularly, inhibiting iron export into circulation. In inflammation, hepcidin is upregulated, mediating anemia of chronic disease through iron trapping.\n\nHepcidin production is increased in iron overload and inflammation (causing iron trapping) and decreased in states of increased erythropoiesis or low oxygen tension (allowing more iron absorption)."
    difficulty: hard
    tags: [hematology, iron-metabolism, anemia-chronic-disease]
  - front: "What are the iron indices and blood film findings in sideroblastic anemia?"
    back: "Normal/high ferritin, high serum iron, normal TIBC, normal/high % saturation, high RDW. Blood film shows dual population of RBCs and basophilic stippling. BM biopsy shows ring sideroblasts (iron deposits in mitochondria surrounding the nucleus).\n\nSideroblastic anemia results from defects in heme biosynthesis in erythroid precursors. Causes include hereditary (X-linked), MDS (refractory anemia with ringed sideroblasts), and reversible causes such as isoniazid, alcohol, lead, and copper deficiency."
    difficulty: medium
    tags: [hematology, sideroblastic-anemia]
  - front: "What mnemonic helps remember the causes of microcytic anemia?"
    back: "TAILS: Thalassemia, Anemia of chronic disease/inflammation, Iron deficiency, Lead poisoning, Sideroblastic anemia.\n\nMicrocytic anemia is defined as MCV <80 fL. The iron indices and blood film findings differ among these causes, and ferritin is the most important initial test to differentiate them."
    difficulty: easy
    tags: [hematology, microcytic-anemia]
  - front: "What clinical features constitute Plummer-Vinson syndrome?"
    back: "Dysphagia (esophageal web), glossitis, iron deficiency anemia, and stomatitis.\n\nPlummer-Vinson syndrome is a classic triad of iron deficiency anemia, esophageal webs causing dysphagia, and glossitis. It is considered a premalignant condition with increased risk of esophageal squamous cell carcinoma."
    difficulty: easy
    tags: [hematology, iron-deficiency-anemia, plummer-vinson]
  - front: "How does beta-thalassemia minor differ from iron deficiency anemia on CBC and iron studies?"
    back: "Beta-thalassemia minor: MCV very low (<70 fL) but anemia is mild (Hb 100-140 g/L), normal/high RBC count, normal iron studies, and elevated HbA2 (3.5-5%) on Hb electrophoresis. Iron deficiency: proportionally low Hb and MCV, low ferritin, high TIBC.\n\nIn beta-thalassemia minor, the microcytosis is disproportionately more profound relative to the mild anemia, which is the opposite pattern from iron deficiency anemia. Normal iron studies help distinguish the two."
    difficulty: medium
    tags: [hematology, thalassemia, iron-deficiency-anemia]
  - front: "What is the pathophysiology and clinical presentation of beta-thalassemia major?"
    back: "Homozygous defect in both beta-globin alleles causing absent/severely reduced beta-chain synthesis, severe anemia (Hb <60 g/L), ineffective erythropoiesis, and hemolysis. Presents at 6-12 months of age (when HbF normally switches to HbA). Features include severe anemia, jaundice, iron overload, hepatosplenomegaly (extramedullary hematopoiesis), skeletal changes (hair-on-end skull x-ray), and growth retardation.\n\nTreatment includes lifelong regular RBC transfusions, iron chelation therapy (deferoxamine, deferasirox, deferiprone), folic acid, and potentially curative allogeneic BM transplant or gene therapy. Death results from untreated anemia, infection, or iron overload."
    difficulty: medium
    tags: [hematology, thalassemia, beta-thalassemia-major]
  - front: "In alpha-thalassemia, what are the clinical consequences of 1, 2, 3, and 4 defective alpha genes?"
    back: "1 gene (aa/a-): clinically silent, normal Hb and MCV. 2 genes (cis or trans): normal Hb, decreased MCV. 3 genes (a-/--): HbH disease (beta-4 tetramers), decreased Hb and MCV, splenomegaly. 4 genes (--/--): Hb Barts (gamma-4), hydrops fetalis, usually incompatible with life.\n\nCis 2-gene deletion (aa/--) is more common in Southeast Asia vs. trans (a-/a-) in Africa. This means offspring of Southeast Asian patients are at higher risk of fetal hydrops (if both parents carry cis deletions, offspring can inherit 4-gene deletion)."
    difficulty: medium
    tags: [hematology, thalassemia, alpha-thalassemia]
  - front: "What is the genetic defect in sickle cell disease, and what factors aggravate sickling?"
    back: "Autosomal recessive Glu-to-Val substitution at position 6 of the beta-globin chain (chromosome 11), producing HbS. Sickling is aggravated by low pO2, acidemia, increased CO2, increased 2,3-DPG, fever, and increased osmolality.\n\nAt low pO2, deoxyHbS polymerizes forming rigid crystal-like rods that distort membranes into sickle shapes. Fragile sickle cells then cause hemolysis (nitric oxide depletion) and occlusion of small vessels (ischemia-reperfusion injury)."
    difficulty: easy
    tags: [hematology, sickle-cell-disease]
  - front: "What are the four types of sickle cell crises?"
    back: "1. Aplastic crisis: BM suppression (especially parvovirus B19). 2. Splenic sequestration crisis: pooling of blood in spleen with acute Hb drop and shock (mainly children). 3. Vaso-occlusive crisis: microcirculation infarction causing pain in back, chest, abdomen, extremities. 4. Acute chest syndrome: fever, respiratory symptoms, new pulmonary infiltrate on CXR.\n\nVaso-occlusive crises are the most common presentation. Acute chest syndrome is precipitated by pulmonary infection, fat emboli, and pulmonary infarction. It is a major cause of morbidity and mortality in SCD."
    difficulty: easy
    tags: [hematology, sickle-cell-disease, sickle-cell-crisis]
  - front: "How does hydroxyurea work in sickle cell disease, and what are its key benefits?"
    back: "Hydroxyurea stops repression of the fetal Hb-gamma gene, increasing production of HbF. HbF decreases polymerization and precipitation of HbS in sickle cell RBCs. Benefits include decreased frequency of pain crises, acute chest syndrome, hospitalizations, and need for blood transfusions.\n\nShort-term harms include dose-related leukopenia, thrombocytopenia, anemia, decreased reticulocyte count, decreased sperm production, and mucositis. Long-term harms potentially include birth defects, growth delays in children, and cancer risk."
    difficulty: medium
    tags: [hematology, sickle-cell-disease, hydroxyurea]
  - front: "What organisms are sickle cell patients particularly susceptible to, and why?"
    back: "Encapsulated organisms: Streptococcus pneumoniae, Neisseria meningitidis, Haemophilus influenzae type b. Also Salmonella (osteomyelitis). This is due to functional asplenia from repeated splenic infarction.\n\nThe spleen is enlarged in childhood but becomes atrophic in adulthood due to repeated infarction (autosplenectomy). Prevention includes vaccination and prophylactic penicillin from age 3 months to 5 years."
    difficulty: easy
    tags: [hematology, sickle-cell-disease, functional-asplenia]
  - front: "What are the screening tests and specific tests for hemolytic anemia?"
    back: "Screening: increased LDH, decreased haptoglobin, increased unconjugated bilirubin, increased urobilinogen, reticulocytosis. Intravascular-specific: schistocytes on blood film, free Hb in serum, hemoglobinuria, hemosiderinuria (most sensitive). Extravascular-specific: positive direct antiglobulin test (direct Coombs).\n\nHaptoglobin is a circulating protein that binds free Hb for clearance by the spleen. When free Hb is abundant (intravascular hemolysis), haptoglobin is consumed and levels decrease. LDH is released from lysed RBCs."
    difficulty: easy
    tags: [hematology, hemolytic-anemia, investigations]
  - front: "What is the difference between direct and indirect Coombs (antiglobulin) tests?"
    back: "Direct Coombs (DAT): detects IgG or complement already bound on the surface of patient's RBCs. Add anti-IgG/anti-complement Ab to patient's RBCs; positive if agglutination. Indirect Coombs: detects free antibodies in patient's serum that can recognize RBC antigens. Mix patient's serum with donor RBCs, then add Coombs serum.\n\nDAT is used for autoimmune hemolytic anemia, hemolytic disease of the newborn, and hemolytic transfusion reactions. Indirect Coombs is used for cross-matching, detecting atypical blood group antibodies, and prenatal screening."
    difficulty: medium
    tags: [hematology, hemolytic-anemia, coombs-test]
  - front: "How do warm and cold autoimmune hemolytic anemia (AIHA) differ in antibody type, etiology, and treatment?"
    back: "Warm AIHA (75-90%): IgG antibodies, agglutination at 37C, DAT positive for IgG + complement. Secondary to CLL, Hodgkin lymphoma, SLE, drugs. Treat with corticosteroids (1st-line), rituximab, splenectomy. Cold AIHA: IgM antibodies, agglutination at <37C, DAT positive for complement only. Secondary to Mycoplasma, EBV, HCV, CLL. Treat by warming patient/avoiding cold, rituximab (1st-line).\n\nWarm AIHA shows spherocytes on blood film (IgG-coated RBCs partially phagocytosed by splenic macrophages). Cold AIHA shows agglutination on blood film. Drug-induced AIHA (e.g., penicillin, quinine, methyldopa) is a subtype of warm AIHA."
    difficulty: medium
    tags: [hematology, autoimmune-hemolytic-anemia]
  - front: "What is the pathophysiology and clinical presentation of hereditary spherocytosis?"
    back: "Abnormality in RBC membrane proteins (e.g., spectrin), usually autosomal dominant. Membrane loss results in spherocytic RBCs that are trapped and destroyed in the spleen. Presents with hemolytic anemia, jaundice, and splenomegaly. MCHC is elevated. Osmotic fragility is increased.\n\nHereditary spherocytosis is the most common type of hereditary hemolytic anemia. Treatment includes genetic counselling and splenectomy in severe cases (avoid in early childhood). Pre-splenectomy vaccinations against encapsulated organisms are mandatory."
    difficulty: easy
    tags: [hematology, hereditary-spherocytosis]
  - front: "What triggers hemolytic episodes in G6PD deficiency, and what blood film findings are characteristic?"
    back: "Triggers: oxidative stress, drugs (sulfonamides, antimalarials, nitrofurantoin), infection, and fava beans. Blood film shows Heinz bodies (denatured Hb clumps attached to RBC membrane) and bite cells (from splenic passage).\n\nG6PD deficiency is X-linked recessive, prevalent in African, Asian, and Mediterranean populations. G6PD assay should NOT be done during acute crisis when reticulocyte count is high (reticulocytes have high G6PD levels, giving false-normal results)."
    difficulty: easy
    tags: [hematology, g6pd-deficiency]
  - front: "What distinguishes megaloblastic from non-megaloblastic macrocytic anemia?"
    back: "Megaloblastic: large oval nucleated RBC precursors with hypersegmented neutrophils, due to failure of DNA synthesis (B12 or folate deficiency). Non-megaloblastic: large round RBCs without hypersegmented neutrophils, due to membrane abnormality (alcohol/liver disease, hypothyroidism, reticulocytosis, drugs, MDS).\n\nThe mnemonic ABCDEF covers macrocytic anemia causes: Alcoholism/liver disease, B12 deficiency, Compensatory reticulocytosis, Drugs/Dysplasia, Endocrine (hypothyroidism), Folate deficiency/Fetus (pregnancy)."
    difficulty: easy
    tags: [hematology, macrocytic-anemia, megaloblastic-anemia]
  - front: "What neurological findings are specific to vitamin B12 deficiency (not folate deficiency)?"
    back: "Subacute combined degeneration of the spinal cord: posterior columns (decreased vibration, proprioception, 2-point discrimination, paresthesia) and pyramidal tracts (spastic weakness, ataxia). Also peripheral neuropathy and cerebral effects (confusion, delirium, dementia). Spinal cord damage is irreversible.\n\nB12 is absorbed in the terminal ileum after binding to intrinsic factor from gastric parietal cells. Total body stores last 3-4 years. Pernicious anemia (autoantibodies against IF or parietal cells) is the classic cause. Folate deficiency does NOT cause neurological manifestations."
    difficulty: medium
    tags: [hematology, vitamin-b12-deficiency, subacute-combined-degeneration]
  - front: "What is pernicious anemia and how is it diagnosed?"
    back: "Auto-antibodies against intrinsic factor or gastric parietal cells, leading to achlorhydria and lack of IF secretion, causing decreased ileal B12 absorption. Diagnosis: anti-parietal cell Ab (more sensitive), anti-intrinsic factor Ab (more specific), elevated gastrin level, upper endoscopy showing atrophic gastritis.\n\nPernicious anemia is most common in Northern European populations, usually >30 years old (median age 60). It may be associated with other autoimmune disorders (polyglandular endocrine insufficiency). Upper endoscopy also screens for gastric malignancy."
    difficulty: medium
    tags: [hematology, pernicious-anemia, vitamin-b12-deficiency]
  - front: "What precaution must be taken before treating suspected folate deficiency with folic acid supplementation?"
    back: "Always rule out concurrent vitamin B12 deficiency first. Supplementing folate alone in a B12-deficient patient will correct the anemia but allow neurological damage (subacute combined degeneration) to continue and potentially worsen.\n\nLower serum B12 leads to low RBC folate because absence of B12 results in folate polyglutamate synthesis failure. Both elevated methylmalonate and homocysteine can help confirm B12 deficiency when levels are borderline."
    difficulty: medium
    tags: [hematology, folate-deficiency, vitamin-b12-deficiency]
  - front: "What are the four stages of hemostasis?"
    back: "1. Primary hemostasis: platelet plug formation via VWF-mediated platelet adhesion, activation, and aggregation. 2. Secondary hemostasis: fibrin clot reinforces platelet plug via coagulation cascade (extrinsic and intrinsic pathways converge on common pathway). 3. Fibrin stabilization: cross-linking of fibrin clot (Factor XIII). 4. Fibrinolysis: clot dissolution mediated by plasmin.\n\nDisorders of primary hemostasis present with immediate mucocutaneous bleeding (petechiae, ecchymoses, epistaxis). Disorders of secondary hemostasis present with delayed deep tissue bleeding (hemarthroses, hematomas)."
    difficulty: easy
    tags: [hematology, hemostasis, coagulation]
  - front: "What does PT/INR measure versus PTT, and what mnemonic helps remember?"
    back: "PT/INR measures the extrinsic pathway (Factor VII) and common pathway. PTT measures the intrinsic pathway (Factors VIII, IX, XI, XII) and common pathway. Mnemonic: PT = Tennis played outside (Extrinsic); PTT = Table Tennis played inside (Intrinsic).\n\nPT/INR is used to monitor warfarin therapy and assess hepatic function. PTT is used to monitor heparin and argatroban therapy. Both are prolonged in common pathway deficiencies (Factors II, V, X, fibrinogen), DIC, and severe liver disease."
    difficulty: easy
    tags: [hematology, coagulation, pt-ptt]
  - front: "What are the lab value patterns for hemophilia A/B, VWD, DIC, liver failure, and ITP?"
    back: "Hemophilia A/B: normal PT, prolonged PTT, normal platelets. VWD: normal PT, prolonged/normal PTT, normal/low platelets. DIC: prolonged PT, prolonged PTT, low platelets, low Hb. Liver failure: prolonged PT, normal/prolonged PTT, normal/low platelets. ITP: normal PT, normal PTT, low platelets.\n\nThese patterns are high-yield for MCCQE1. In DIC, fibrinogen is also decreased and D-dimers/FDPs are elevated. In liver disease, all factors except VIII are decreased (VIII is also produced by endothelium)."
    difficulty: medium
    tags: [hematology, coagulation, lab-patterns]
  - front: "What is the most common inherited bleeding disorder, and how does it present?"
    back: "Von Willebrand disease (prevalence 1%). Presents with mucocutaneous bleeding: easy bruising, epistaxis (>10 min), heavy menstrual bleeding, post-dental extraction bleeding, peripartum bleeding, excessive postoperative bleeding, and GI bleeding.\n\nVWF mediates platelet adhesion/aggregation and acts as a chaperone for Factor VIII. Type 1 (80% of cases) is a mild quantitative deficiency. Type 2 is a qualitative defect. Type 3 is a severe total deficiency. Usually autosomal dominant (types 2N and 3 are autosomal recessive)."
    difficulty: easy
    tags: [hematology, von-willebrand-disease]
  - front: "How is von Willebrand disease treated?"
    back: "DDAVP (desmopressin) is effective for 85-90% of type 1 VWD and some type 2 subtypes (causes release of VWF and Factor VIII from endothelial cells). Tranexamic acid as adjunct. VWF:Factor VIII concentrate (Humate P) if DDAVP unresponsive or for severe bleeding.\n\nDDAVP requires a documented 'DDAVP challenge' to confirm responsiveness. Tachyphylaxis occurs after 4 consecutive doses. Caution in children due to risk of hyponatremia. VWF levels are lowest in blood group O patients."
    difficulty: medium
    tags: [hematology, von-willebrand-disease, treatment]
  - front: "A male patient has prolonged PTT, normal PT, normal platelets, and a history of recurrent hemarthroses. What is the most likely diagnosis and how is it confirmed?"
    back: "Hemophilia A (Factor VIII deficiency) or Hemophilia B (Factor IX deficiency). Confirm by measuring specific factor levels. Hemophilia A: decreased Factor VIII (<40%). Hemophilia B: decreased Factor IX. Also check VWF antigen and ristocetin activity to rule out VWD.\n\nHemophilia A is X-linked recessive, affecting 1 in 5000 males. Hemophilia B is X-linked recessive, 1 in 30000 males. Severity: mild >5% factor level, moderate 1-5%, severe <1%. Deep bleeding (hemarthroses, hematomas) is characteristic of secondary hemostasis disorders."
    difficulty: medium
    tags: [hematology, hemophilia, coagulation]
  - front: "What is immune thrombocytopenia (ITP) and what is the first-line treatment in adults?"
    back: "ITP is an acquired immune-mediated disorder with anti-platelet antibodies causing increased platelet destruction and impaired production. Platelets <100 x 10^9/L with normal PT/PTT. First-line treatment: corticosteroids (dexamethasone 40 mg PO daily x 4 days or prednisone 0.5-2 mg/kg/day). IVIg 1 g/kg if faster rise needed.\n\nTreatment is rarely indicated if platelets >30 x 10^9/L unless active bleeding. Second-line options include splenectomy (not within 12 months of diagnosis), TPO receptor agonists (romiplostim, eltrombopag), and rituximab. Blood film shows decreased platelets with large platelets."
    difficulty: medium
    tags: [hematology, immune-thrombocytopenia, treatment]
  - front: "What is heparin-induced thrombocytopenia (HIT) and what is the 4T scoring system?"
    back: "HIT is an immune-mediated reaction where antibodies recognize heparin-platelet factor 4 complexes, causing platelet activation and coagulation. 4Ts: Thrombocytopenia (degree of platelet fall), Timing (5-14 days after heparin exposure), Thrombosis (new thrombosis or skin necrosis), oTher causes (alternative explanations). Score 6-8 = high probability.\n\nHIT has 30-50% risk of thrombosis if untreated. Management: immediately discontinue all heparin (including flushes), start a non-heparin anticoagulant (argatroban, danaparoid, fondaparinux). Warfarin should not be started until platelets >150 x 10^9/L. DOACs can be started before platelet recovery."
    difficulty: hard
    tags: [hematology, heparin-induced-thrombocytopenia, HIT]
  - front: "How does TTP differ from HUS in etiology, clinical features, and treatment?"
    back: "TTP: ADAMTS13 deficiency (acquired autoantibodies or congenital), presents with thrombocytopenia, MAHA/TMA, neurological symptoms. Treatment: plasma exchange + steroids (mortality 90% if untreated). HUS: Shiga toxin E. coli O157:H7 (90%), presents with thrombocytopenia, MAHA/TMA, acute kidney injury, bloody diarrhea. Treatment: supportive (fluids, transfusion).\n\nBoth show normal PT/PTT/fibrinogen (unlike DIC), schistocytes on blood film, decreased platelets, and hemolysis markers. Platelet transfusion is avoided in TTP unless life-threatening bleeding. ADAMTS13 normally cleaves ultra-large VWF multimers; without it, uncleaved VWF promotes excessive platelet aggregation."
    difficulty: hard
    tags: [hematology, TTP, HUS, thrombotic-microangiopathy]
  - front: "What is DIC, what are its key etiologies (mnemonic), and what are the lab findings?"
    back: "DIC is excessive dysregulated release of plasmin and thrombin leading to simultaneous intravascular coagulation and fibrinolysis. Mnemonic OMITS: Obstetric complications, Malignancy, Infection, Shock. Labs: prolonged PT/PTT, decreased platelets, decreased fibrinogen, increased D-dimers/FDPs, schistocytes on blood film.\n\nDIC is a consumptive coagulopathy where patients can present with both hemorrhage AND thrombosis. Treatment focuses on the underlying cause. Bleeding phase: platelet transfusion if <50 with bleeding, FP if prolonged PT/PTT, cryoprecipitate if fibrinogen <1.5 g/L."
    difficulty: medium
    tags: [hematology, DIC, coagulation]
  - front: "What are the components of Virchow's triad and the key risk factors for venous thromboembolism?"
    back: "Virchow's triad: endothelial damage, venous stasis, and hypercoagulability. Key risk factors: surgery (especially orthopedic), immobilization, trauma, malignancy (pancreas, lung, stomach), pregnancy, OCP/HRT, obesity, previous VTE, age >60, heart failure, and inherited thrombophilia.\n\nDVT most commonly originates in calf veins and propagates proximally. The most important sequelae are PE (up to 50% chance with proximal DVT) and post-thrombotic syndrome. 10-20% of idiopathic VTE cases are later found to have cancer."
    difficulty: easy
    tags: [hematology, VTE, DVT, virchow-triad]
  - front: "How is DVT diagnosed using the Modified Wells Score and D-dimer?"
    back: "Modified Wells Score stratifies pre-test probability: >=2 points = DVT likely, <2 = DVT unlikely. D-dimer is only useful to rule out DVT if negative with low clinical suspicion (Wells <2). A positive D-dimer is non-specific. Doppler ultrasound is the most useful diagnostic test (sensitivity/specificity ~95% for proximal DVT).\n\nWells Score components include paralysis/casting (+1), bedridden >3 days or major surgery (+1), calf swelling >3 cm (+1), pitting edema (+1), collateral veins (+1), active cancer (+1), entire leg swelling (+1), tenderness along deep veins (+1), and alternative diagnosis more likely (-2)."
    difficulty: medium
    tags: [hematology, DVT, wells-score, d-dimer]
  - front: "What are the initial anticoagulation options for treatment of VTE?"
    back: "DOACs: apixaban or rivaroxaban alone (with loading dose); dabigatran or edoxaban require 5-10 days of parenteral anticoagulation (LMWH) first. LMWH: weight-based SC dosing. UFH: for high bleed risk or need for rapid interruption. Warfarin: must overlap with heparin for at least 48 hours with INR >2.\n\nDuration: provoked VTE with transient risk factor = 3 months. First unprovoked VTE: at least 3 months, consider indefinite. Cancer-associated VTE: indefinite therapy while active malignancy. DOACs are contraindicated in pregnancy and with mechanical heart valves."
    difficulty: medium
    tags: [hematology, VTE, anticoagulation, treatment]
  - front: "Why must warfarin be overlapped with heparin when initiating treatment for VTE?"
    back: "Warfarin initially creates a prothrombotic state because it inhibits natural anticoagulants protein C and S (which have shorter half-lives than procoagulant factors II, X). Without heparin overlap, this can cause warfarin-induced skin necrosis. Heparin overlap for at least 48 hours with INR >2 is required.\n\nWarfarin decreases Factor VII levels first (shortest half-life), causing INR prolongation, but full antithrombotic effect is not achieved until Factors IX, X, and II are sufficiently reduced (after approximately 4 days). One-third of patients with warfarin-induced skin necrosis have underlying protein C deficiency."
    difficulty: hard
    tags: [hematology, warfarin, anticoagulation]
  - front: "What is the most common cause of hereditary thrombophilia?"
    back: "Factor V Leiden (activated protein C resistance). A point mutation (R506Q) in the Factor V gene results in resistance to inactivation of Factor Va by activated protein C. Present in 3-7% of European White population (heterozygotes).\n\nOther hereditary thrombophilias include prothrombin gene mutation G20210A (1-3% European Whites), protein C deficiency, protein S deficiency, and antithrombin deficiency. Testing should only be done if it will alter management decisions."
    difficulty: easy
    tags: [hematology, thrombophilia, factor-v-leiden]
  - front: "What are the clinical and laboratory criteria for antiphospholipid antibody syndrome (APS)?"
    back: "Clinical: arterial or venous thrombosis, or pregnancy morbidity (recurrent early losses <10 wk, late fetal loss >=10 wk, or premature birth <34 wk due to preeclampsia/placental insufficiency). Laboratory (confirmed on 2 occasions >=12 wk apart): anticardiolipin IgG/IgM, anti-beta2 glycoprotein-I Ab, or lupus anticoagulant.\n\nDespite its name, lupus anticoagulant is actually prothrombotic in vivo (it prolongs PTT in vitro but causes thrombosis clinically). APS can cause both arterial and venous thrombosis. Management includes long-term anticoagulation."
    difficulty: medium
    tags: [hematology, antiphospholipid-syndrome]
  - front: "What vitamin K-dependent coagulation factors does warfarin affect, and what mnemonic helps remember them?"
    back: "Factors II, VII, IX, X, and proteins C and S. Mnemonic: '1972' (factors X, IX, VII, II) plus proteins C and S.\n\nWarfarin inhibits vitamin K epoxide reductase, preventing regeneration of active vitamin K needed for gamma-carboxylation of these factors. Factor VII has the shortest half-life, so PT/INR rises first. Full antithrombotic effect requires reduction of all affected factors."
    difficulty: easy
    tags: [hematology, warfarin, vitamin-k-dependent-factors]
  - front: "How do you manage a supratherapeutic INR >10 without bleeding versus any INR with serious/life-threatening bleeding?"
    back: "INR >10, no bleeding: hold warfarin, give oral vitamin K 2.5-5 mg, monitor INR frequently, resume at lower dose. Any INR with serious bleeding: hold warfarin, give IV vitamin K 10 mg slow infusion, plus four-factor prothrombin complex concentrate (PCC), monitor and repeat as needed.\n\nPCC (Octaplex, Beriplex) provides rapid reversal by supplying vitamin K-dependent factors directly. FP can be used if PCC is not available. PCCs are relatively contraindicated in liver disease or history of HIT (contains heparin)."
    difficulty: medium
    tags: [hematology, warfarin, supratherapeutic-INR, reversal]
  - front: "What are the reversal agents for each class of anticoagulant?"
    back: "UFH: protamine sulfate. LMWH: partial reversal with protamine sulfate. Warfarin: vitamin K, PCC, or FP. Dabigatran: idarucizumab (Praxbind). Rivaroxaban/apixaban/edoxaban: andexanet alfa. Fondaparinux and argatroban: no specific reversal agent.\n\nIdarucizumab completely reverses dabigatran's anticoagulant effect within minutes (RE-VERSE AD trial). Andexanet alfa is a modified Factor Xa decoy that binds direct Xa inhibitors. These reversal agents are critical for managing life-threatening bleeding."
    difficulty: medium
    tags: [hematology, anticoagulation, reversal-agents]
  - front: "What differentiates AML from ALL clinically and on lab investigation?"
    back: "AML: adults (median 65 yr), large blasts with lots of cytoplasm, 3-5 nucleoli, granules and Auer rods (pathognomonic), myeloperoxidase/Sudan black stain positive. ALL: children, small blasts with less cytoplasm, 1-3 nucleoli, no granules/Auer rods, PAS stain positive. Mnemonic: Big (AML) vs. SmALL.\n\nAML accounts for 80% of acute adult leukemias. ALL is the most common childhood malignancy. Both present with manifestations of BM failure (anemia, thrombocytopenia, neutropenia) and can cause hepatosplenomegaly."
    difficulty: easy
    tags: [hematology, AML, ALL, leukemia]
  - front: "What is the treatment approach for acute promyelocytic leukemia (APL) and why is it a medical emergency?"
    back: "APL is a medical emergency because DIC is often present at diagnosis. Treatment: ATRA (all-trans retinoic acid) to induce differentiation, started ASAP if APL is suspected. ATRA + arsenic trioxide combination is superior to traditional chemotherapy. Supportive transfusions: target platelets >30 (no bleeding) or >50 (bleeding), fibrinogen >1.5.\n\nAPL has the t(15;17) translocation involving the PML-RARA gene fusion. Despite being a medical emergency at presentation, APL has one of the best prognoses among AML subtypes when properly treated with ATRA-based regimens."
    difficulty: hard
    tags: [hematology, APL, AML, ATRA]
  - front: "What is Hodgkin lymphoma and what are its hallmark pathological and clinical features?"
    back: "Malignant proliferation of lymphoid cells with Reed-Sternberg cells (hallmark). Bimodal age distribution (20 yr and >50 yr). Associated with EBV in up to 50%. Presents with painless rubbery cervical/supraclavicular lymphadenopathy (60-80%), mediastinal mass, splenomegaly, B-symptoms, and pruritus. Spreads contiguously through lymphatic system.\n\nHodgkin lymphoma is differentiated from non-Hodgkin lymphoma by the presence of Reed-Sternberg cells. Diagnosis requires excisional lymph node or core biopsy. Treatment depends on stage: early stage = ABVD + radiotherapy; advanced = ABVD or BEACOPP."
    difficulty: easy
    tags: [hematology, hodgkin-lymphoma]
  - front: "What does ABVD stand for and what are the major treatment complications of Hodgkin lymphoma therapy?"
    back: "ABVD: Adriamycin, Bleomycin, Vinblastine, Dacarbazine. Complications: cardiac disease (adriamycin cardiomyopathy), pulmonary disease (bleomycin interstitial pneumonitis), infertility (<3% with ABVD), secondary malignancy (solid tumours >8 yr post-treatment, NHL), and hypothyroidism (post-radiation).\n\nPre-treatment cardiac assessment (MUGA scan/echocardiography) is important for patients at high risk. PFTs are done if history of lung disease. PET scan results are essential in assessing disease response."
    difficulty: medium
    tags: [hematology, hodgkin-lymphoma, ABVD, treatment]
  - front: "What are the key chromosome translocations associated with lymphomas?"
    back: "t(8;14): c-Myc activation = Burkitt lymphoma. t(14;18): Bcl-2 activation = follicular lymphoma. t(11;14): cyclin D1 overexpression = mantle cell lymphoma. t(2;5): ALK mutation = anaplastic large cell lymphoma. t(11;18): MALT1 activation = MALT lymphoma.\n\nThese translocations are important for diagnosis and classification. Burkitt lymphoma has a 'starry-sky' histology pattern and is highly aggressive but very responsive to chemoradiation. Follicular lymphoma is the most common indolent NHL."
    difficulty: medium
    tags: [hematology, lymphoma, cytogenetics]
  - front: "What is the treatment difference between Hodgkin and non-Hodgkin lymphoma?"
    back: "Hodgkin lymphoma: treatment depends on stage (ABVD +/- radiotherapy for early; ABVD/BEACOPP for advanced). Non-Hodgkin lymphoma: treatment depends on histologic subtype. Indolent NHL: watchful waiting, rituximab-based therapy. Aggressive NHL (DLBCL): CHOP + rituximab (CHOP-R), curative intent. Highly aggressive (Burkitt): intensive chemotherapy (CODOX-M/IVAC + rituximab).\n\nRituximab (anti-CD20 antibody) is added to all B-cell NHL treatment regimens. The goal for aggressive NHL is cure (~40% cure rate for DLBCL), while for indolent NHL the goal is symptom management as it is rarely curable."
    difficulty: medium
    tags: [hematology, lymphoma, treatment]
  - front: "What is chronic lymphocytic leukemia (CLL) and what are its characteristic lab findings?"
    back: "Most common leukemia in the Western world. Indolent clonal malignancy of mature B-cells. Median age 70, M>F. CBC: clonal B lymphocytes >5 x 10^9/L. Blood film: small mature lymphocytes and smudge cells. Flow cytometry: CD5, CD20dim, CD23, light chain restriction.\n\n25% are asymptomatic (incidental finding). Complications include autoimmune hemolytic anemia (DAT positive), ITP, hypogammaglobulinemia, and Richter's transformation (5% progress to aggressive DLBCL). Treatment is often observation if early/stable/asymptomatic."
    difficulty: medium
    tags: [hematology, CLL, leukemia]
  - front: "What are the major clinical complications of multiple myeloma?"
    back: "Bone disease (lytic lesions, pathologic fractures, back pain), anemia (BM suppression), recurrent infections (S. pneumoniae, Gram-negatives due to suppressed plasma cell function), hypercalcemia, renal failure (cast nephropathy), bleeding, hyperviscosity, amyloidosis, and spinal cord compression (medical emergency).\n\nLytic lesions are classic (skull, spine, proximal long bones, ribs) due to osteoclast activating factors. Bone scans are NOT useful (they detect osteoblast activity, which is not increased). Rouleaux formation on peripheral blood film is characteristic."
    difficulty: medium
    tags: [hematology, multiple-myeloma, complications]
  - front: "What is MGUS and what is the risk of malignant transformation?"
    back: "Monoclonal gammopathy of unknown significance: serum M protein <30 g/L, <10% plasma cells in BM, absence of SLiM CRAB. Incidence: 5% of people >70 yr. Risk of malignant transformation: 0.3-1% per year.\n\nHigher risk of transformation with M protein >=15 g/L, abnormal free light chain ratio, or IgA/IgM type MGUS. Monitoring: history every 6-12 months, physical, CBC, Cr, calcium, albumin, LDH, and SPEP. MGUS is considered pre-malignant."
    difficulty: easy
    tags: [hematology, MGUS, multiple-myeloma]
  - front: "What is the general threshold for packed RBC transfusion, and what does 1 unit raise Hb by?"
    back: "Transfuse when Hb <70 g/L; maintain between 70-90 g/L during active bleeds. Consider higher threshold for CAD/unstable coronary syndromes. One unit of packed RBC increases Hb by approximately 10 g/L.\n\nThe Choosing Wisely recommendation states: do not transfuse more than the minimum number of RBC units necessary to relieve symptoms or return the patient to a safe Hb range (70-80 g/L) in stable non-cardiac patients. Both the TRICC and FOCUS trials support restrictive transfusion strategies."
    difficulty: easy
    tags: [hematology, blood-transfusion, RBC-transfusion]
  - front: "What are the platelet count thresholds for platelet transfusion?"
    back: "<10 x 10^9/L: non-immune thrombocytopenia. <20: procedures without significant blood loss. <50: procedures with blood loss or major surgery. <100: pre-neurosurgery or head trauma. Any count: platelet dysfunction with marked bleeding.\n\nRelative contraindications to platelet transfusion include TTP, HIT, post-transfusion purpura, and HELLP. One platelet pool should increase count by >=15 x 10^9/L. If no rise: consider autoantibodies (ITP), alloantibodies (anti-HLA), consumption (bleeding, sepsis, DIC), or hypersplenism."
    difficulty: easy
    tags: [hematology, platelet-transfusion]
  - front: "What is the most common and most severe acute blood transfusion reaction, and how are they managed?"
    back: "Most common: febrile nonhemolytic transfusion reaction (1/100) - due to alloantibodies to WBC/platelets; rule out hemolytic reaction, give antipyretics. Most severe: acute hemolytic transfusion reaction (<1/40000) - ABO incompatibility, most commonly due to incorrect patient identification. Management: STOP transfusion, notify blood bank, check for clerical error, maintain BP with IV fluids, maintain urine output.\n\nTRALI (transfusion-related acute lung injury) is currently the leading cause of transfusion-related morbidity and mortality. It presents with hypoxemia and bilateral pulmonary edema within 6 hours, typically resolving in 24-72 hours with supportive care."
    difficulty: medium
    tags: [hematology, blood-transfusion, transfusion-reactions]
  - front: "What are the indications for irradiated blood products?"
    back: "Irradiated blood products prevent proliferation of donor T-cells in recipients at risk of transfusion-associated graft-versus-host disease (TA-GVHD). Indications: severe T-cell immunodeficiency, purine analogue chemotherapy, Hodgkin lymphoma, BM transplant candidates, directed donations from first-degree relatives, HLA-matched products, and intrauterine transfusions.\n\nTA-GVHD occurs 4-30 days post-transfusion when donor T-lymphocytes recognize and attack the immunocompromised host. It presents with fever, diarrhea, liver dysfunction, and pancytopenia. It is highly fatal and can be prevented with irradiation."
    difficulty: medium
    tags: [hematology, blood-transfusion, irradiated-products]
  - front: "What is tumour lysis syndrome (TLS), what metabolic abnormalities occur, and how is it prevented?"
    back: "TLS results from breakdown of cancer cells (spontaneous or treatment-related), most common in high tumour burden with high proliferative rate (high-grade lymphoma, acute leukemia). Metabolic abnormalities: increased K+, uric acid, PO4; decreased Ca2+ (PO4 binds Ca). Prevention: aggressive IV hydration, allopurinol (prevents uric acid accumulation) or rasburicase (lowers existing uric acid).\n\nComplications include lethal cardiac arrhythmia (hyperkalemia) and acute kidney injury (uric acid and calcium phosphate crystal deposition). Alkalinization is NOT recommended due to risk of calcium phosphate or xanthine precipitation. Dialysis may be needed."
    difficulty: medium
    tags: [hematology, tumour-lysis-syndrome, oncologic-emergency]
  - front: "How does aspirin differ from clopidogrel in mechanism of antiplatelet action?"
    back: "Aspirin: irreversibly acetylates cyclooxygenase (COX), inhibiting thromboxane A2 (TXA2) synthesis, thus inhibiting platelet aggregation. Effect lasts 7-10 days. Clopidogrel: irreversibly inhibits ADP binding to platelets (P2Y12 receptor), decreasing platelet aggregation. It is a prodrug requiring two-step activation; CYP2C19 poor metabolizers have diminished response.\n\nPrasugrel and ticagrelor are alternatives to clopidogrel with higher potency. Ticagrelor reversibly inhibits ADP binding and does not need metabolic activation. GPIIb/IIIa inhibitors (abciximab, eptifibatide) block the final common pathway of platelet aggregation."
    difficulty: easy
    tags: [hematology, antiplatelet-therapy, aspirin, clopidogrel]
  - front: "How do unfractionated heparin (UFH) and low molecular weight heparin (LMWH) differ in mechanism, monitoring, and reversal?"
    back: "UFH: inhibits Factor Xa and IIa via antithrombin; IV/SC; monitor with aPTT; fully reversed by protamine sulfate; higher risk of HIT. LMWH: mainly Factor Xa inhibition via antithrombin; SC; no routine monitoring needed (anti-Xa levels in special populations); only partially reversed by protamine; lower HIT risk; accumulates in renal failure (CrCl <30).\n\nLMWH has higher bioavailability, predictable dose response, fixed dosing, and is standard treatment for VTE in pregnancy and cancer. UFH is preferred when rapid interruption is needed (high bleed risk, surgical procedures) because it is rapidly and fully reversible."
    difficulty: medium
    tags: [hematology, heparin, LMWH, anticoagulation]
  - front: "What are the key differences among DOACs (rivaroxaban, apixaban, dabigatran, edoxaban)?"
    back: "Rivaroxaban, apixaban, edoxaban: direct Factor Xa inhibitors; reversed by andexanet alfa. Dabigatran: direct thrombin (IIa) inhibitor; reversed by idarucizumab. All are oral, contraindicated in mechanical heart valves. Dabigatran/edoxaban require initial parenteral anticoagulation for VTE. Rivaroxaban must be taken with food. All require adequate renal function (varying CrCl cutoffs).\n\nDOACs do not require routine monitoring (unlike warfarin). Anti-Xa levels can detect presence of Xa inhibitors; dilute thrombin time can detect dabigatran. DOACs are now first-line for VTE and stroke prevention in non-valvular atrial fibrillation."
    difficulty: medium
    tags: [hematology, DOACs, anticoagulation]
  - front: "What is the CRASH-2 trial's key finding about tranexamic acid in trauma?"
    back: "Early administration of tranexamic acid (TXA) significantly reduced all-cause mortality (14.5% vs 16.0%, p=0.0035) and death from bleeding (4.9% vs 5.7%) in bleeding trauma patients. Benefit was greatest with immediate treatment (70% improvement). Beyond 3 hours of injury, TXA was likely ineffective and may increase mortality from bleeding.\n\nTXA is an antifibrinolytic agent that stabilizes clot formation. The key clinical message is that TXA must be given early (within 3 hours of injury) to be effective. Survival decreased by 10% for every 15-minute delay in treatment."
    difficulty: medium
    tags: [hematology, tranexamic-acid, CRASH-2, trauma]
  - front: "What RBC morphologies on peripheral blood smear are associated with specific clinical conditions?"
    back: "Spherocytes: hereditary spherocytosis, immune hemolytic anemia. Schistocytes (helmet cells): MAHA/TMA (TTP, HUS, DIC, HELLP). Sickle cells: SCD. Target cells: liver disease, thalassemia, HbSC, iron deficiency. Teardrop cells (dacrocytes): myelofibrosis, BM infiltration. Rouleaux: multiple myeloma, Waldenstrom's. Howell-Jolly bodies: post-splenectomy, hyposplenia.\n\nAlso important: basophilic stippling (thalassemia, lead poisoning, MDS), Heinz bodies (G6PD deficiency), bite cells (oxidative hemolysis in G6PD), pencil cells (iron deficiency), and smudge cells (CLL)."
    difficulty: easy
    tags: [hematology, blood-film, RBC-morphology]
  - front: "A hospitalized patient on heparin develops a platelet drop from 200 to 80 x 10^9/L on day 7, with a new DVT. What is the diagnosis and immediate management?"
    back: "Heparin-induced thrombocytopenia (HIT). 4Ts score: thrombocytopenia >50% fall (2 points), timing day 5-10 (2 points), new thrombosis (2 points) = high probability (6 points). Immediate management: STOP all heparin (including flushes), start a non-heparin anticoagulant (argatroban, fondaparinux, or danaparoid), send HIT ELISA and serotonin release assay.\n\nDo NOT give warfarin until platelets >150 x 10^9/L (risk of warfarin-induced venous limb gangrene). Do NOT give platelet transfusions (may worsen thrombosis). HIT has 30-50% risk of thrombosis if untreated. DOACs can be started before platelet recovery."
    difficulty: hard
    tags: [hematology, HIT, heparin-induced-thrombocytopenia, clinical-scenario]
  - front: "What is Waldenstrom's macroglobulinemia (lymphoplasmacytic lymphoma) and its key complication?"
    back: "Proliferation of lymphoplasmacytoid cells producing monoclonal IgM paraprotein. Chronic disorder of elderly patients (median age 64). Key complication: hyperviscosity syndrome (because IgM is large and confined mainly to intravascular space). Symptoms: weakness, fatigue, oronasal bleeding, neurological symptoms, CHF (triad of anemia, hyperviscosity, plasma volume expansion).\n\nWaldenstrom's accounts for 85% of all cases of hyperviscosity syndrome. Treatment: chemotherapy + rituximab (most commonly bendamustine + rituximab), plasmapheresis for acute hyperviscosity. Unlike myeloma, bone lesions are usually NOT present."
    difficulty: medium
    tags: [hematology, waldenstrom-macroglobulinemia, hyperviscosity]
  - front: "What is aplastic anemia and what are its key investigations and treatment?"
    back: "Destruction of hematopoietic BM cells causing pancytopenia and hypocellular BM. Causes: idiopathic (often T-cell mediated), drugs (chloramphenicol), toxins (benzene), radiation, viral (parvovirus B19, hepatitis), PNH. Investigations: CBC (pancytopenia), low reticulocytes (<1%), BM biopsy showing hypocellular marrow (<25%) with adipose replacement. Treatment: immunosuppressive therapy (anti-thymocyte globulin + cyclosporine), allogeneic BM transplant.\n\n50% of aplastic anemia patients have PNH (paroxysmal nocturnal hemoglobinuria). Supportive care includes judicious blood product use to minimize immune sensitization and iron chelation for iron overload from repeated transfusions."
    difficulty: medium
    tags: [hematology, aplastic-anemia]
  - front: "What are the hemoglobin and hematocrit thresholds that define erythrocytosis in males and females?"
    back: "Males: Hb >165 g/L or Hct >49%. Females: Hb >160 g/L or Hct >48%.\n\nErythrocytosis is defined as an absolute increase in red cell mass. The sex-specific thresholds reflect physiologic differences in baseline Hb/Hct values. Accurate thresholds matter for guiding workup (serum EPO, JAK2 mutation)."
    difficulty: easy
    tags: [erythrocytosis, polycythemia, hematology, CBC]
  - front: "What distinguishes relative (spurious) erythrocytosis from absolute erythrocytosis?"
    back: "Relative erythrocytosis is due to decreased plasma volume (e.g., diuretics, severe dehydration, burns, 'stress'/Gaisböck's syndrome) — the red cell mass is normal. Absolute erythrocytosis reflects a true increase in red cell mass.\n\nDifferentiating these is critical because relative erythrocytosis does not carry the same thrombotic risk and does not require specific hematologic therapy — treating the volume depletion resolves the finding."
    difficulty: easy
    tags: [erythrocytosis, plasma volume, Gaisbock syndrome, hematology]
  - front: "What tumours are associated with inappropriate (ectopic) erythropoietin production causing secondary erythrocytosis?"
    back: "Hepatocellular carcinoma, renal cell carcinoma, cerebellar hemangioblastoma, pheochromocytoma, uterine leiomyoma, and ovarian tumour.\n\nThese tumours secrete EPO autonomously, causing erythrocytosis independent of hypoxia. Identifying an EPO-secreting tumour is important because resection can cure the erythrocytosis and the malignancy simultaneously."
    difficulty: medium
    tags: [erythrocytosis, ectopic EPO, paraneoplastic, hematology]
  - front: "Which investigation differentiates primary erythrocytosis (polycythemia vera) from secondary causes?"
    back: "Serum EPO level: low/normal in primary erythrocytosis (PV); elevated in secondary causes. JAK2 mutation analysis (positive in >96% of PV) should be sent when EPO is low/normal.\n\nIn PV, the malignant clone proliferates autonomously, suppressing normal EPO production. Sending JAK2 only when EPO is low/normal avoids unnecessary testing in patients with secondary erythrocytosis where JAK2 is unlikely to be positive."
    difficulty: medium
    tags: [polycythemia vera, JAK2, EPO, erythrocytosis, hematology]
  - front: "What clinical symptom of erythrocytosis is found ONLY in myeloproliferative neoplasms (MPNs)?"
    back: "Aquagenic pruritus (itching triggered by contact with water) is seen specifically in MPNs, not in secondary erythrocytosis.\n\nAquagenic pruritus results from mast cell degranulation and histamine release linked to the MPN clone. Its presence in a patient with erythrocytosis strongly suggests a primary myeloproliferative disorder (e.g., PV)."
    difficulty: medium
    tags: [aquagenic pruritus, MPN, polycythemia vera, hematology]
  - front: "What is the definition of thrombocytopenia, and what is pseudothrombocytopenia?"
    back: "Thrombocytopenia: platelet count <150 × 10⁹/L. Pseudothrombocytopenia: falsely low platelet count due to EDTA-induced platelet clumping (platelet dumping secondary to EDTA antibodies). Confirm by repeating CBC in a citrated sample.\n\nAlways rule out pseudothrombocytopenia before pursuing an extensive workup. Examining the blood film for platelet clumps or satellitism is the first step; confirming with a citrated (sodium citrate) tube resolves the issue."
    difficulty: easy
    tags: [thrombocytopenia, pseudothrombocytopenia, EDTA, hematology]
  - front: "What is the most common cause of thrombocytopenia in hospitalized patients?"
    back: "Drugs and infection are the most common causes of thrombocytopenia in hospitalized patients.\n\nThis clinical pearl guides the initial workup: a careful medication reconciliation and infectious screen (cultures, serology) should precede more invasive investigations in an inpatient with new-onset thrombocytopenia."
    difficulty: easy
    tags: [thrombocytopenia, drug-induced, infection, inpatient, hematology]
  - front: "On peripheral blood film, what finding suggests immune-mediated thrombocytopenia vs. microangiopathic hemolytic anemia (MAHA/TMA)?"
    back: "Large platelets are often seen in ITP (immune-mediated). Schistocytes (fragmented RBCs) are seen in MAHA/TMA (e.g., TTP, HUS, DIC).\n\nIn ITP, the spleen destroys antibody-coated platelets and releases large, young platelets. In MAHA/TMA, mechanical RBC destruction produces schistocytes — this distinction is critical because TTP requires urgent plasma exchange, not platelet transfusion."
    difficulty: medium
    tags: [ITP, TTP, MAHA, schistocytes, blood film, hematology]
  - front: "What is the definition of thrombocytosis, and what are its two broad categories?"
    back: "Platelet count >450 × 10⁹/L. Categories: (1) Primary thrombocytosis — due to MPNs (CML, PV, MF, ET); (2) Reactive/secondary thrombocytosis — acute phase response to surgery, inflammation, infection, bleeding, iron deficiency, neoplasm, asplenia.\n\nReactive thrombocytosis is far more common. Key distinguishing features: reactive causes are usually self-limited, don't require cytoreduction, and the platelet count rarely exceeds 1000 × 10⁹/L in most reactive states, though overlap exists."
    difficulty: easy
    tags: [thrombocytosis, essential thrombocythemia, MPN, reactive, hematology]
  - front: "What is the first-line treatment for primary (MPN-associated) thrombocytosis?"
    back: "Aspirin plus cytoreductive agents (e.g., hydroxyurea, anagrelide, or interferon-alpha).\n\nAspirin reduces thrombotic and vasomotor symptoms. Cytoreductive agents lower the platelet count in high-risk patients (age >60, prior thrombosis, platelet count >1500 × 10⁹/L). Hydroxyurea is first-line cytoreduction in Canada; anagrelide or IFN-α are alternatives."
    difficulty: medium
    tags: [thrombocytosis, essential thrombocythemia, hydroxyurea, aspirin, MPN, hematology]
  - front: "What is the definition of pancytopenia, and what does a deficit in all cell lines suggest?"
    back: "Pancytopenia is a decrease in all hematopoietic cell lines (RBCs, WBCs, platelets) below normal ranges. It suggests decreased production, sequestration (e.g., hypersplenism), or hemodilution.\n\nA deficit in all three cell lines points to a global BM problem or massive splenomegaly. If only platelets and RBCs are low (without leukopenia), consider non-immune destruction (MAHA) or Evans' syndrome (autoimmune hemolysis + ITP)."
    difficulty: medium
    tags: [pancytopenia, bone marrow failure, hematology]
  - front: "What is the WHO definition of neutrophilia, and what are the major categories of cause?"
    back: "ANC >7.7 × 10⁹/L. Causes: Primary (CML, chronic neutrophilic leukemia, other MPNs, hereditary neutrophilia, leukocyte adhesion deficiency); Secondary (stress/epinephrine, obesity, infection, inflammation [RA, IBD, MI, PE, burns], malignancy, medications [glucocorticoids, β-agonists, lithium, G-CSF]).\n\nSecondary neutrophilia is far more common. Glucocorticoids cause neutrophilia by demargination (shifting neutrophils from the marginated pool into circulation) and delayed apoptosis. Persistent or extreme neutrophilia warrants BM biopsy to exclude CML."
    difficulty: medium
    tags: [neutrophilia, CML, glucocorticoids, hematology]
  - front: "What blood film findings suggest infection in a patient with neutrophilia?"
    back: "Left shift (bands >20% of WBC), Döhle bodies (intracytoplasmic structures of agglutinated ribosomes), toxic granulation, and cytoplasmic vacuoles.\n\nThese morphologic changes reflect accelerated granulopoiesis and neutrophil activation in response to severe infection. Recognizing these on the blood film guides appropriate antibiotic therapy before culture results return."
    difficulty: medium
    tags: [neutrophilia, blood film, Dohle bodies, toxic granulation, infection, hematology]
  - front: "Define the severity grades of neutropenia and state the threshold for febrile neutropenia concern."
    back: "Mild: ANC 1.0–1.5 × 10⁹/L. Moderate: ANC 0.5–1.0 × 10⁹/L (infection risk starts increasing). Severe: ANC <0.5 × 10⁹/L. Profound: ANC <0.1 × 10⁹/L for >7 days. FEBRILE NEUTROPENIA: fever + ANC <0.5 × 10⁹/L.\n\nANC = WBC count × (%PMNs + %bands). The threshold of ANC <0.5 × 10⁹/L with fever defines febrile neutropenia — a medical emergency requiring prompt broad-spectrum IV antibiotics."
    difficulty: easy
    tags: [neutropenia, febrile neutropenia, ANC, hematology, oncology]
  - front: "What is Felty syndrome and in which condition does it occur?"
    back: "Felty syndrome is the triad of rheumatoid arthritis (RA), splenomegaly, and neutropenia. It is an autoimmune cause of neutropenia due to anti-neutrophil antibodies and splenic sequestration.\n\nFelty syndrome occurs in severe, seropositive RA. Neutropenia predisposes to recurrent bacterial infections. Recognition is important because standard RA treatment (DMARDs) may also help the neutropenia; splenectomy is reserved for refractory cases."
    difficulty: medium
    tags: [Felty syndrome, rheumatoid arthritis, neutropenia, splenomegaly, hematology]
  - front: "Which medications are classic drug causes of neutropenia?"
    back: "Alkylating agents, antimetabolites, anticonvulsants, antipsychotics, anti-inflammatory agents, antithyroid drugs (thionamides), a-methyldopa (hapten-mediated). Also: clozapine, sulfasalazine, ticlopidine.\n\nDrug-induced neutropenia can be immune-mediated (hapten mechanism — anti-neutrophil antibodies) or directly myelosuppressive (alkylating agents). Regular CBC monitoring is required when initiating clozapine or thionamides."
    difficulty: medium
    tags: [neutropenia, drug-induced, clozapine, thionamides, hematology]
  - front: "When is G-CSF used in neutropenia management, and what is the evidence for prophylactic G-CSF in chemotherapy?"
    back: "G-CSF is used in severe immune-mediated neutropenia to boost counts. Prophylactic G-CSF in chemotherapy reduces infection rate and febrile neutropenia rates but does NOT reduce all-cause mortality or infection-related death.\n\nA meta-analysis of 18 RCTs showed prophylactic CSFs reduced infection rate (38.9% vs. 43.1%), microbiologically documented infections, and febrile neutropenia — but no mortality benefit. This informs risk-stratified use in chemotherapy protocols."
    difficulty: hard
    tags: [G-CSF, neutropenia, febrile neutropenia, chemotherapy, evidence-based, hematology]
  - front: "What is the definition of lymphocytosis, and what are the most common causes?"
    back: "Absolute lymphocyte count >4.0 × 10⁹/L. Most common causes: viral infections (especially EBV/mononucleosis), TB, pertussis, brucellosis, toxoplasmosis, smoking, physiologic stress, hypersensitivity reactions, autoimmune disease (RA), neoplasm (CLL).\n\nAtypical lymphocytes on blood film suggest viral infection (especially EBV). If lymphocyte count persists above 5.0 × 10⁹/L for >3 months, flow cytometry of peripheral blood is indicated to rule out a lymphoproliferative disorder."
    difficulty: easy
    tags: [lymphocytosis, EBV, CLL, hematology]
  - front: "When should flow cytometry be ordered for lymphocytosis?"
    back: "When lymphocyte count is persistently >5.0 × 10⁹/L for >3 months, flow cytometry of peripheral blood should be performed to assess lineage and clonality (to rule out CLL or other lymphoproliferative disorder).\n\nMonoclonal B-cell lymphocytosis (MBL) — a precursor to CLL — may be detected this way. Clonality of B-cells is confirmed by kappa/lambda light chain restriction on flow cytometry."
    difficulty: medium
    tags: [lymphocytosis, flow cytometry, CLL, MBL, hematology]
  - front: "What is the definition of lymphopenia, and what are its major causes?"
    back: "Absolute lymphocyte count <1.0 × 10⁹/L. Causes: older age, idiopathic CD4+ lymphopenia, iatrogenic (radiation, chemotherapy, immunosuppressives), HIV/AIDS, HBV, HCV, malignancy, malnutrition, alcoholism, autoimmune disease (SLE).\n\nLymphopenia predisposes to opportunistic infections. In all patients with unexplained lymphopenia, HIV testing is mandatory. CD4+ subset analysis guides antimicrobial prophylaxis thresholds (e.g., PCP prophylaxis when CD4 <200 cells/μL)."
    difficulty: easy
    tags: [lymphopenia, HIV, immunosuppression, hematology]
  - front: "What is the definition of eosinophilia, and what is hypereosinophilic syndrome (HES)?"
    back: "Eosinophilia: absolute eosinophil count >0.5 × 10⁹/L. HES: absolute eosinophil count >1.5 × 10⁹/L on 2 exams ≥1 month apart, with end-organ damage (heart, BM, CNS) and no other identifiable cause.\n\nHES can cause endomyocardial fibrosis, Löffler endocarditis, and neurologic damage. It is classified as primary (clonal BM disorder) or idiopathic. Treatment is corticosteroids; rule out Strongyloides before initiating steroids in endemic-exposure patients."
    difficulty: medium
    tags: [eosinophilia, HES, hypereosinophilic syndrome, hematology]
  - front: "What are the most common secondary causes of eosinophilia?"
    back: "Parasitic infections (especially helminth infections) and allergic reactions are the most common. Less common: collagen vascular diseases (RA, polyarteritis nodosa), asthma, eosinophilic pneumonia, EGPA, cholesterol emboli, hematologic malignancy, adrenocortical insufficiency, penicillins, atopic dermatitis.\n\nHelminth infections (e.g., Ascaris, Toxocara, Strongyloides) are the classic cause worldwide. In the Canadian context, allergic diseases (asthma, atopy) are more prevalent. Always consider Addison's disease as a reversible cause."
    difficulty: medium
    tags: [eosinophilia, helminth, allergy, EGPA, hematology]
  - front: "An important precaution before treating eosinophilia with steroids — what must be checked first?"
    back: "Strongyloides serology must be collected before initiating steroids in patients at risk of Strongyloides infection. Steroids can cause hyperinfection syndrome in Strongyloides carriers, which is potentially fatal.\n\nStrongyloides stercoralis can persist in the host for decades. Corticosteroid-induced immunosuppression removes the eosinophil-mediated control of the parasite, leading to disseminated hyperinfection with sepsis and meningitis."
    difficulty: hard
    tags: [strongyloides, eosinophilia, steroids, hyperinfection, hematology]
  - front: "Define agranulocytosis and list the most common associated medications."
    back: "Agranulocytosis: ANC <100/μL. Associated medications (70% of cases): chemotherapy, clozapine, thionamides (antithyroid drugs), sulfasalazine, ticlopidine.\n\nMechanism is either immune-mediated (drug-induced antibodies destroy circulating granulocytes) or direct toxic effects on BM precursors. Clozapine requires mandatory CBC monitoring (weekly for first 6 months in Canada). Abrupt fever with oropharyngeal ulcers is the classic presentation."
    difficulty: medium
    tags: [agranulocytosis, clozapine, thionamides, neutropenia, hematology]
  - front: "Define leukemoid reaction and how is it distinguished from CML?"
    back: "Leukemoid reaction: leukocytosis >50 × 10⁹/L with a marked left shift (myelocytes, metamyelocytes, bands on smear). Unlike CML, it is reactive (causes: infection, drugs, asplenia, malignancy, hemorrhage, acute hemolysis). Must rule out CML and chronic neutrophilic leukemia.\n\nCML is distinguished by the Philadelphia chromosome (BCR-ABL1), basophilia, low leukocyte alkaline phosphatase (LAP) score, and splenomegaly. In leukemoid reaction, LAP is typically elevated and BCR-ABL1 is absent."
    difficulty: medium
    tags: [leukemoid reaction, CML, leukocytosis, left shift, hematology]
  - front: "Which lymph node location carries the HIGHEST risk of malignancy, and what cancers are associated with left vs. right supraclavicular nodes?"
    back: "Supraclavicular nodes carry the highest malignancy risk. Right supraclavicular: mediastinal, bronchogenic, esophageal cancers. Left supraclavicular (Virchow's node): gastric, gallbladder, pancreatic, renal, testicular/ovarian cancers.\n\nThe left supraclavicular node (Virchow's) drains the thoracic duct, which receives lymph from the abdomen. Its enlargement (Troisier's sign) is a classic finding in advanced abdominal malignancy, especially gastric cancer."
    difficulty: medium
    tags: [lymphadenopathy, supraclavicular, Virchow node, malignancy, hematology]
  - front: "What is the gold standard investigation for lymphadenopathy in suspected lymphoproliferative disease, and why should FNA be avoided?"
    back: "Excisional biopsy is the gold standard — it preserves lymph node architecture essential for classifying lymphomas. FNA should NOT be used for lymphoproliferative disease because it disrupts architecture needed for histologic subtyping. FNA is acceptable for suspected solid tumour recurrence.\n\nLymphoma subtyping (e.g., follicular vs. diffuse large B-cell) requires intact nodal architecture. Core needle biopsies may be used when excisional biopsy is not feasible (retroperitoneal, mediastinal nodes), but are second-best."
    difficulty: medium
    tags: [lymphadenopathy, lymphoma, biopsy, excisional biopsy, FNA, hematology]
  - front: "What are the B-symptoms (constitutional symptoms) seen in lymphoma and TB?"
    back: "Unexplained fever >38°C, drenching night sweats, and unintentional weight loss >10% body weight over 6 months.\n\nB-symptoms in lymphoma (Hodgkin and NHL) are an adverse prognostic indicator and influence staging. Their presence prompts a thorough workup for lymphoproliferative disease. Pruritus is also associated with Hodgkin lymphoma specifically."
    difficulty: easy
    tags: [B-symptoms, lymphoma, Hodgkin, constitutional symptoms, hematology]
  - front: "What are the features distinguishing inflammatory vs. neoplastic lymph nodes on physical examination?"
    back: "Inflammatory: fluctuant/soft, mobile, tender, <1 cm². Neoplastic: firm/hard, matted/immobile, non-tender, >1 cm². Note: lymphoma and CLL nodes can feel rubbery and mobile — these classifications are not absolute.\n\nWhile these clinical features guide initial assessment, they lack sufficient sensitivity/specificity to replace biopsy. The key caveat: inguinal nodes up to 2 cm can be non-pathologic. Supraclavicular, infraclavicular, and epitrochlear adenopathy is always considered pathologic."
    difficulty: easy
    tags: [lymphadenopathy, physical examination, lymphoma, hematology]
  - front: "What conditions cause MASSIVE splenomegaly (spleen crosses midline or reaches pelvis)?"
    back: "CML, CLL, lymphoproliferative disease (NHL/HL), myeloproliferative neoplasms (CML, myelofibrosis), and metastatic tumour.\n\nMassive splenomegaly (starred conditions in the Toronto Notes table) is a clinical clue pointing toward a myeloid or lymphoid malignancy. Myelofibrosis causes massive splenomegaly due to extramedullary hematopoiesis. Other causes of splenomegaly (infection, portal HTN) rarely produce truly massive spleens."
    difficulty: medium
    tags: [splenomegaly, CML, myelofibrosis, lymphoma, hematology]
  - front: "What is the CHINA mnemonic for causes of splenomegaly?"
    back: "C — Cirrhosis/Congestion (portal HTN); H — Hematological (hemolytic anemias, MPNs, leukemias); I — Infectious (EBV, malaria, HIV, TB); N — Neoplasm (lymphoma, leukemia, metastatic); A — Autoimmune (SLE, Felty syndrome, sarcoidosis).\n\nThis mnemonic efficiently organizes the differential diagnosis of splenomegaly for clinical exams. The most common causes in Canada are portal hypertension (cirrhosis) and hematologic malignancies."
    difficulty: easy
    tags: [splenomegaly, CHINA mnemonic, hematology, differential diagnosis]
  - front: "What are the MCV and key iron indices in iron deficiency anemia vs. anemia of chronic disease vs. thalassemia vs. sideroblastic anemia?"
    back: "Iron deficiency anemia: ↓ferritin, ↓serum iron, ↑TIBC, ↓saturation, ↑RDW — hypochromic microcytic film. Anemia of chronic disease: N/↑ferritin, ↓serum iron, ↓TIBC, N saturation, N RDW — normocytic/microcytic. Thalassemia: N/↑ferritin, N/↑serum iron, N TIBC, N/↑saturation, N/↑RDW — hypochromic microcytic with basophilic stippling. Sideroblastic anemia: N/↑ferritin, ↑serum iron, N TIBC, N/↑saturation, ↑RDW — dual population, basophilic stippling.\n\nFerritin is the single most important test for distinguishing iron deficiency from other causes of microcytic anemia. TIBC is elevated in IDA (body compensates by making more transferrin to capture scarce iron) and decreased in ACD (inflammatory downregulation of transferrin)."
    difficulty: hard
    tags: [microcytic anemia, iron deficiency, anemia of chronic disease, thalassemia, sideroblastic anemia, iron indices, hematology]
  - front: "Describe hepcidin's role in iron homeostasis and how it mediates anemia of chronic disease."
    back: "Hepcidin is a hepatocyte-produced hormone that binds ferroportin (iron exporter on duodenal enterocytes and reticuloendothelial cells) and induces its degradation, thereby trapping iron intracellularly and reducing GI absorption. In inflammation, hepcidin is upregulated → iron trapped in macrophages → unavailable for erythropoiesis → anemia of chronic disease.\n\nUnderstanding hepcidin explains why serum iron is low in ACD despite adequate iron stores (the iron is trapped). Hepcidin is the key regulatory peptide linking infection/inflammation to the iron-restricted anemia seen in chronic disease."
    difficulty: hard
    tags: [hepcidin, ferroportin, anemia of chronic disease, iron metabolism, hematology]
  - front: "Where is dietary iron absorbed, and what enhances or inhibits its absorption?"
    back: "Absorbed in the duodenum. Enhancers: citric acid, ascorbic acid (vitamin C), heme iron. Inhibitors: polyphenols (tea), phytate (bran), dietary calcium, soy protein. Absorption impaired in IBD (duodenal) and celiac disease.\n\nThis explains practical dietary counselling: take iron supplements with vitamin C and avoid tea/coffee around the time of supplementation. Post-gastrectomy patients lose the acidic duodenal environment needed for Fe³⁺ → Fe²⁺ reduction, impairing absorption."
    difficulty: medium
    tags: [iron absorption, duodenum, vitamin C, dietary iron, hematology]
  - front: "What are the diagnostic features of iron deficiency anemia on peripheral blood film?"
    back: "Hypochromic microcytosis, pencil forms (oval-shaped RBCs), anisocytosis, target cells, and increased RDW.\n\nPencil forms (elliptocytes/oval forms) are particularly characteristic of IDA. Target cells reflect a relative excess of RBC membrane. Increased RDW reflects the heterogeneity of RBC size — in contrast, thalassemia typically has uniform microcytosis with normal/mildly elevated RDW."
    difficulty: medium
    tags: [iron deficiency anemia, blood film, microcytosis, hypochromia, hematology]
  - front: "What is the gold standard test for iron stores, and what is the most clinically practical blood test?"
    back: "Gold standard: bone marrow aspirate with iron stain (Prussian blue). Most practical blood test: serum ferritin (low ferritin <30 μg/L is diagnostic of iron deficiency).\n\nBM aspirate is rarely performed solely for iron assessment given its invasiveness. Ferritin <30 μg/L has high specificity for IDA. In inflammatory states or liver disease, ferritin may be falsely elevated; <100 μg/L in these settings is suggestive of iron deficiency and warrants further workup (complete iron indices, sTfR)."
    difficulty: easy
    tags: [iron deficiency anemia, ferritin, bone marrow, diagnosis, hematology]
  - front: "What is Plummer-Vinson syndrome and which underlying condition causes it?"
    back: "Plummer-Vinson syndrome: the triad of dysphagia (due to esophageal webs), glossitis, and iron deficiency anemia. It is caused by severe, chronic iron deficiency anemia.\n\nPlummer-Vinson syndrome is a premalignant condition — esophageal webs increase the risk of squamous cell carcinoma of the esophagus. Treatment is iron supplementation; the dysphagia often resolves with iron repletion alone, though webs may require dilation."
    difficulty: medium
    tags: [Plummer-Vinson syndrome, iron deficiency, dysphagia, esophageal web, hematology]
  - front: "What is the recommended oral iron supplementation regimen, and what monitoring parameter indicates adequate response?"
    back: "Ferrous sulphate 325 mg once daily (65 mg elemental iron), OR ferrous gluconate 300 mg once daily (35 mg elemental), OR ferrous fumarate 300 mg once daily (100 mg elemental). Continue until anemia corrects, then for ≥3 more months until ferritin normalizes. Response: reticulocyte count rises after 1 week; Hb increases by 10 g/L per week (if no ongoing blood loss).\n\nOnce-daily dosing is preferred — multiple daily doses up-regulate hepcidin, reduce absorption, and increase GI side effects without clinical benefit. Alternate-day dosing shows insignificant differences vs. daily in recent studies. IV iron is used when oral is not tolerated/absorbed or rapid response is needed."
    difficulty: medium
    tags: [iron deficiency anemia, iron supplementation, ferrous sulphate, treatment, hematology]
  - front: "What are the key pathophysiologic mechanisms of anemia of chronic disease (anemia of inflammation)?"
    back: "1) Increased hepcidin (inflammation-driven) → ferroportin degradation → iron trapped in macrophages and enterocytes → reduced plasma iron for erythropoiesis. 2) Marrow unresponsive to normal/slightly elevated EPO. 3) Mild hemolytic component (modestly decreased RBC survival).\n\nACD is an anemia of underproduction with functional iron deficiency — stores are adequate but iron is inaccessible. This distinguishes it from true IDA where stores are depleted. BM shows normal/increased iron stores with decreased staining in erythroid precursors."
    difficulty: hard
    tags: [anemia of chronic disease, hepcidin, iron metabolism, pathophysiology, hematology]
  - front: "How does the peripheral blood film and serum ferritin differ in ACD compared to iron deficiency anemia?"
    back: "ACD: ferritin is normal or elevated (acute phase reactant), serum iron ↓, TIBC ↓, normocytic/normochromic (mild) to microcytic/normochromic (moderate) to microcytic/hypochromic (severe), reticulocyte count low. IDA: ferritin ↓, serum iron ↓, TIBC ↑, microcytic/hypochromic, reticulocyte count low.\n\nThe critical differentiator is ferritin and TIBC: elevated ferritin and low TIBC point to ACD, while low ferritin and high TIBC point to IDA. When both coexist, sTfR/ferritin index or BM biopsy may be needed."
    difficulty: hard
    tags: [anemia of chronic disease, iron deficiency anemia, ferritin, TIBC, differential diagnosis, hematology]
  - front: "What is the role of soluble transferrin receptor (sTfR) in diagnosing iron deficiency, especially in the setting of inflammation?"
    back: "sTfR reflects functional iron availability at the tissue level. In iron deficiency, more transferrin receptors are expressed on erythroblasts → sTfR increases. sTfR is also elevated in thalassemia (extramedullary hematopoiesis) and decreased in reduced erythropoiesis and iron overload. It is particularly useful to identify iron deficiency when ferritin is elevated due to inflammation.\n\nFerritin can be falsely elevated in chronic disease despite true iron deficiency. sTfR is not an acute phase reactant, so it remains elevated in IDA even when ferritin appears normal. The sTfR/log ferritin index further improves discrimination between IDA and ACD."
    difficulty: hard
    tags: [sTfR, transferrin receptor, iron deficiency, anemia of chronic disease, hematology]
  - front: "A 55-year-old woman with rheumatoid arthritis has Hb 98 g/L, MCV 78 fL, ferritin 85 μg/L, serum iron low, TIBC low. What is the most likely diagnosis?"
    back: "Anemia of chronic disease (anemia of inflammation) secondary to rheumatoid arthritis. The low serum iron with low TIBC and normal/elevated ferritin (>45 μg/L) is characteristic of ACD, distinguishing it from IDA (which has high TIBC and low ferritin).\n\nIn RA, inflammatory cytokines (IL-6) stimulate hepatic hepcidin production, trapping iron in macrophages. TIBC is low because transferrin production is suppressed in inflammatory states. Ferritin 85 μg/L — while below 100 μg/L and suggestive of possible coexisting IDA in this inflammatory context — with low TIBC favors ACD. sTfR can help distinguish."
    difficulty: hard
    tags: [anemia of chronic disease, rheumatoid arthritis, iron indices, clinical scenario, hematology]
  - front: "In a post-menopausal woman with iron deficiency anemia, what investigation is always warranted regardless of symptoms?"
    back: "GI workup (gastroscopy and colonoscopy) is always warranted in post-menopausal women (and all men) with iron deficiency anemia to rule out occult GI blood loss (e.g., right-sided colorectal cancer, angiodysplasia).\n\nIron deficiency anemia is a common presentation of chronic lower GI bleeding. Right-sided colonic cancers are 'silent' — they bleed slowly without change in bowel habits. Missing this diagnosis is a critical clinical error."
    difficulty: medium
    tags: [iron deficiency anemia, colorectal cancer, GI workup, colonoscopy, hematology]
  - front: "What clinical features of pica and restless leg syndrome are associated with iron deficiency?"
    back: "Pica: appetite for non-food substances (e.g., ice [pagophagia], paint, dirt). Restless leg syndrome: uncomfortable leg sensations compelling movement, especially at night. Both are non-anemic manifestations of iron deficiency that may precede anemia.\n\nIron deficiency may cause fatigue and these symptoms before Hb falls. Treating the iron deficiency often resolves restless leg syndrome — making iron deficiency an important treatable cause in the differential of RLS."
    difficulty: medium
    tags: [pica, restless leg syndrome, iron deficiency, hematology]
  - front: "What is basophilia/eosinophilia associated with in the context of MPNs?"
    back: "Basophilia and/or eosinophilia can be an indicator of CML or other MPNs. They are associated with pruritus due to excessive histamine production from basophil/mast cell degranulation.\n\nIn CML, basophilia is a hallmark feature — basophils release histamine causing pruritus. Increasing basophilia (>20%) is a sign of blast phase/accelerated disease. Aquagenic pruritus in PV shares a similar histamine-mediated mechanism."
    difficulty: medium
    tags: [basophilia, eosinophilia, CML, MPN, histamine, hematology]
  - front: "What is Gaisböck's syndrome?"
    back: "Gaisböck's syndrome (also called stress polycythemia or spurious/relative erythrocytosis) is a condition of elevated Hb/Hct due to decreased plasma volume rather than a true increase in red cell mass. It is associated with stress, obesity, hypertension, and diuretic use.\n\nUnlike true polycythemia vera, Gaisböck's syndrome does not require cytoreduction or phlebotomy. Management focuses on treating the underlying causes (weight loss, hypertension control, hydration). EPO levels are normal and JAK2 is negative."
    difficulty: medium
    tags: [Gaisbock syndrome, spurious erythrocytosis, relative erythrocytosis, hematology]
  - front: "What does PTT measure and what mnemonic helps remember which pathway it tests?"
    back: "PTT measures the intrinsic pathway (factors VIII, IX, XI, XII) and common pathway. Mnemonic: 'Table Tennis is played Inside' (Intrinsic pathway).\n\nPTT is prolonged in hemophilia A (factor VIII deficiency) and hemophilia B (factor IX deficiency) when factor deficiency is below the reagent threshold of detection. It is also used to monitor heparin and argatroban therapy, and is prolonged (paradoxically) by lupus anticoagulant in vitro."
    difficulty: easy
    tags: [hematology, coagulation, hemostasis, lab tests, PTT]
  - front: "What does PT/INR measure and what mnemonic helps remember which pathway it tests?"
    back: "PT/INR measures the extrinsic pathway (factor VII) and common pathway. Mnemonic: 'Tennis is played Outside' (Extrinsic pathway). INR is used to monitor warfarin therapy.\n\nPT is prolonged in vitamin K deficiency, warfarin therapy, factor VII deficiency, and liver disease. INR is mathematically derived from PT. The INR normalizes PT measurements across different laboratory reagents, making it the standard for monitoring anticoagulation with warfarin."
    difficulty: easy
    tags: [hematology, coagulation, hemostasis, lab tests, PT, INR, warfarin]
  - front: "What are the four main causes of a prolonged PTT with a normal PT in a patient NOT on heparin?"
    back: "1. Early contact factor deficiency (Factor XII, HMWK, PK) — no bleeding risk; 2. Lupus anticoagulant; 3. Inappropriate blood draw (e.g., heparin line contamination); 4. Laboratory error.\n\nIsolated prolonged PTT with normal PT suggests intrinsic pathway involvement. Factor XII, HMWK, and PK deficiencies prolong PTT but do NOT cause clinical bleeding. Lupus anticoagulant inhibits the pathway in vitro (paradoxically associated with thrombosis in vivo). Always consider pre-analytical errors before pursuing extensive workup."
    difficulty: medium
    tags: [hematology, coagulation, PTT, lupus anticoagulant, lab tests]
  - front: "How do mixing studies differentiate a factor deficiency from a coagulation inhibitor?"
    back: "Mix patient plasma 1:1 with normal plasma and repeat the abnormal test. Normalization indicates a factor deficiency. Lack of normalization indicates an inhibitor (e.g., lupus anticoagulant, factor VIII inhibitor).\n\nNormal plasma contains all coagulation factors; diluting with it will correct the prolonged PT/PTT if a single factor is deficient. If an inhibitor is present, it will inhibit the coagulation factors in the normal plasma too, and the test remains prolonged. Normalization may not occur if multiple coagulation factors are deficient."
    difficulty: medium
    tags: [hematology, coagulation, mixing studies, inhibitors, lab tests]
  - front: "What are the clinical hallmarks distinguishing primary hemostasis disorders from secondary hemostasis disorders?"
    back: "Primary (platelet/vessel): immediate bleeding after injury, superficial mucocutaneous sites (epistaxis, gingival, GI, menorrhagia), petechiae and ecchymoses. Secondary (coagulation): delayed bleeding, deep bleeding (joints, muscles), hemarthroses and hematomas.\n\nThis distinction is key on the MCCQE1. Primary hemostasis disorders result from platelet plug failure; bleeding is immediate and superficial. Secondary hemostasis disorders result from failure to form a stable fibrin clot; bleeding is delayed (the platelet plug forms but dissolves) and occurs at deep sites. Recognizing this pattern guides appropriate laboratory workup."
    difficulty: easy
    tags: [hematology, hemostasis, primary hemostasis, secondary hemostasis, clinical features]
  - front: "What are the lab findings in Immune Thrombocytopenia (ITP)?"
    back: "CBC: isolated thrombocytopenia (platelets <100×10⁹/L). PT and PTT: normal. Peripheral blood film: decreased platelets with large platelets (rule out platelet clumping). Bone marrow: increased megakaryocytes.\n\nITP is an isolated platelet disorder; coagulation cascade is intact so PT and PTT are normal. Large platelets reflect increased platelet turnover (young platelets are larger). Bone marrow biopsy showing increased megakaryocytes confirms peripheral destruction rather than underproduction. HIV and HCV should be tested to rule out secondary ITP."
    difficulty: easy
    tags: [hematology, ITP, immune thrombocytopenia, thrombocytopenia, lab tests]
  - front: "Compare childhood ITP vs. adult ITP in terms of key distinguishing features."
    back: "Childhood ITP: peak age 2–6 yr, equal M:F, common preceding infection, usually weeks duration, >80% spontaneous remission. Adult ITP: peak age 20–40 yr, F>M, infection rare, months to years duration, spontaneous remission uncommon.\n\nIn children, ITP is typically a self-limited post-infectious condition (often viral), while adult ITP tends to be chronic and requires more aggressive management. Adult ITP is associated with autoimmune conditions (SLE, HIV, HCV, CLL). The sex difference in adults reflects autoimmune disease predilection in women."
    difficulty: medium
    tags: [hematology, ITP, immune thrombocytopenia, pediatrics, epidemiology]
  - front: "What is the pathophysiology of ITP?"
    back: "Anti-platelet antibodies bind to platelet surface antigens → increased splenic clearance of platelets. Additionally, helper T-cell and cytotoxic T-cell activation, and impaired platelet production (megakaryocyte suppression).\n\nITP is an acquired immune-mediated disorder involving both humoral (anti-platelet antibodies) and cellular (T-cell) immunity. The antibodies are typically directed against GPIIb/IIIa or GPIb. Platelet destruction occurs primarily in the spleen, which is why splenectomy can be effective as second-line therapy."
    difficulty: medium
    tags: [hematology, ITP, immune thrombocytopenia, pathophysiology, spleen]
  - front: "Outline the ITP treatment algorithm: when to treat, emergency treatment, and line-by-line therapy."
    back: "Treatment rarely indicated if platelets >30×10⁹/L unless active bleeding/surgery. Emergency: corticosteroids ± IVIg, platelet transfusion for major bleed. 1st-line: corticosteroids or IVIg. 2nd-line: splenectomy, TPO agonists (romiplostim, eltrombopag), rituximab. 3rd-line: immunomodulators (mycophenolate, azathioprine), Syk inhibitors (fostamatinib).\n\nIVIg raises platelet count faster than corticosteroids and can be combined with steroids for urgency. Splenectomy is not preferred within 12 months of diagnosis. Vaccinations (S. pneumoniae, N. meningitidis, H. influenzae type b) are required before splenectomy. Response definitions: complete (>100×10⁹/L), partial (30–100×10⁹/L), no response (<30×10⁹/L)."
    difficulty: hard
    tags: [hematology, ITP, immune thrombocytopenia, treatment, splenectomy, IVIg, corticosteroids]
  - front: "A patient on heparin develops thrombocytopenia on day 7. What is the diagnosis, pathophysiology, and initial management?"
    back: "Heparin-Induced Thrombocytopenia (HIT). Pathophysiology: antibodies against heparin–platelet factor 4 complex activate platelets via Fc receptor → platelet consumption and coagulation activation → paradoxical thrombosis. Management: immediately stop ALL heparin (including flushes), initiate non-heparin anticoagulant (argatroban, danaparoid, fondaparinux, or bivalirudin).\n\nHIT is an immune-mediated prothrombotic disorder with 30–50% risk of thrombosis (25% arterial) if untreated. Diagnosis is supported by the 4T score. Warfarin is started only after platelet count recovers >150×10⁹/L (warfarin can initially worsen thrombosis by depleting protein C). DOACs can be started before platelet recovery. LMWH is also contraindicated (also causes HIT, though less commonly)."
    difficulty: hard
    tags: [hematology, HIT, heparin-induced thrombocytopenia, anticoagulation, treatment]
  - front: "What is the 4T score for HIT and how is it interpreted?"
    back: "4Ts score assesses: Thrombocytopenia severity, Timing of platelet fall, Thrombosis/sequelae, and other causes (oTher). Score 6–8 = high probability; 4–5 = intermediate probability; 0–3 = low probability (HIT can be excluded).\n\nHIT onset is typically 5–14 days after heparin initiation. If previously exposed to heparin within 100 days, HIT can develop within hours (anamnestic response). Per American Society of Hematology Choosing Wisely: do not test or treat for HIT in low pre-test probability patients (4T score 0–3); stopping heparin unnecessarily increases bleeding risk and cost."
    difficulty: hard
    tags: [hematology, HIT, 4T score, diagnostic scoring, heparin]
  - front: "What are the two confirmatory tests for HIT and how do they differ?"
    back: "1. 14C Serotonin Release Assay (SRA): functional assay testing if patient plasma can activate platelets; gold standard. 2. ELISA for HIT-IgG: more sensitive but less specific than SRA; faster turnaround; high negative predictive value.\n\nScreening begins with ELISA (high sensitivity means a negative result effectively rules out HIT). Positive ELISA results should be confirmed with functional testing (SRA) due to lower specificity. Clinical pre-test probability (4T score) should always guide testing decisions — low probability should prompt neither testing nor treatment."
    difficulty: medium
    tags: [hematology, HIT, serotonin release assay, ELISA, diagnosis]
  - front: "What is the pathophysiology of Thrombotic Thrombocytopenic Purpura (TTP)?"
    back: "Deficiency or inhibition of ADAMTS13 (metalloproteinase that cleaves ultra-large VWF multimers) → accumulation of uncleaved large VWF multimers → excessive platelet adhesion and aggregation in small blood vessels → microangiopathic hemolytic anemia (MAHATMA) and thrombocytopenia.\n\nAcquired TTP (most common) is due to autoantibodies against ADAMTS13. Congenital TTP (Upshaw-Schulman syndrome) is due to genetic ADAMTS13 deficiency. Ultra-large VWF multimers are the most active in platelet adhesion, so their accumulation drives pathological microvascular thrombosis. Plasma exchange replaces ADAMTS13 and removes antibodies."
    difficulty: hard
    tags: [hematology, TTP, thrombotic thrombocytopenic purpura, ADAMTS13, VWF, pathophysiology]
  - front: "Compare TTP vs. HUS: clinical features, etiology, and management."
    back: "TTP: MAHATMA + neurological symptoms (headache, confusion, seizures); ADAMTS13 deficiency; treat with plasma exchange + steroids ± caplacizumab. HUS: MAHATMA + severe AKI + bloody diarrhea (GI prodrome); Shiga toxin E. coli O157:H7 in 90%; treat with supportive therapy (fluids, RBC transfusion).\n\nBoth TTP and HUS are thrombotic microangiopathies (TMAs) presenting with microangiopathic hemolytic anemia (MAHATMA = schistocytes on smear, elevated LDH, low haptoglobin, elevated unconjugated bilirubin, negative Coombs test). TTP predominantly affects adults; HUS predominantly affects children and elderly. Platelet transfusion is avoided in TTP (associated with microvascular thrombosis). TTP mortality ~90% if untreated."
    difficulty: hard
    tags: [hematology, TTP, HUS, thrombotic microangiopathy, MAHATMA, plasma exchange]
  - front: "What are the laboratory findings common to all thrombotic microangiopathies (TMAs)?"
    back: "CBC/blood film: thrombocytopenia + schistocytes. Hemolysis markers: elevated unconjugated bilirubin, elevated LDH, decreased haptoglobin. Negative Coombs test (DAT). Normal PT, PTT, and fibrinogen (distinguishes from DIC).\n\nThe microangiopathic hemolytic anemia (MAHATMA) pattern is key: mechanical destruction of RBCs by fibrin strands creates schistocytes. The negative Coombs test distinguishes TMA from autoimmune hemolytic anemia. Normal coagulation studies distinguish TMA from DIC (both may have thrombocytopenia and hemolysis). ADAMTS13 testing differentiates TTP from HUS."
    difficulty: medium
    tags: [hematology, TMA, thrombotic microangiopathy, schistocytes, MAHATMA, lab tests]
  - front: "What is von Willebrand Disease (VWD), what is its inheritance pattern, and what is its prevalence?"
    back: "VWD is the most common inherited bleeding disorder (prevalence ~1%). Most types are autosomal dominant (types 2N and 3 are autosomal recessive). Affects males and females equally, but females are more commonly diagnosed due to heavy menstrual and peripartum bleeding.\n\nVWF mediates platelet adhesion/aggregation (primary hemostasis) and acts as a chaperone for Factor VIII, extending its half-life (secondary hemostasis). Therefore, severe VWD (type 3) can affect both primary and secondary hemostasis. VWF levels are influenced by blood type (lowest in group O), pregnancy, hormonal medications, and acute inflammation."
    difficulty: easy
    tags: [hematology, VWD, von Willebrand disease, inherited bleeding disorder, epidemiology]
  - front: "Classify the types of VWD and their mechanisms."
    back: "Type 1 (80%): mild quantitative deficiency — decreased VWF amount. Type 2 (20%): qualitative defects — 2A (loss of high/intermediate multimers, reduced platelet adhesion), 2B (increased GPIb affinity, loss of large multimers, mild thrombocytopenia), 2M (reduced platelet adhesion with normal multimers), 2N (decreased Factor VIII binding). Type 3 (1/million): severe total absence of VWF.\n\nType 2B is unique because the increased affinity for platelet GPIb causes clearance of the large multimers (which are most active) AND can cause mild thrombocytopenia (DDAVP is contraindicated in type 2B as it releases VWF and can worsen thrombocytopenia). Type 3 patients can have hemarthroses due to severe factor VIII deficiency from loss of VWF chaperoning. Type 2N mimics hemophilia A (decreased factor VIII) but is autosomal recessive."
    difficulty: hard
    tags: [hematology, VWD, von Willebrand disease, classification, types]
  - front: "What investigations are required to diagnose and classify VWD?"
    back: "CBC (platelets — may be low in type 2B), VWF antigen (quantity), VWF ristocetin cofactor activity (VWF function/binding to platelet GPIb), Factor VIII level (VWF chaperoning), PTT (may be prolonged). Further: multimer analysis, ristocetin-induced platelet agglutination (RIPA), genetic studies. Blood group affects VWF antigen levels (lower in group O).\n\nThe ristocetin cofactor activity reflects how well VWF binds to platelets — it is disproportionately lower than antigen in type 2 VWD. The ratio of activity to antigen helps classify the subtype. Factor VIII may be decreased in type 2N and type 3 due to loss of VWF chaperoning. Consider VWD in all women with heavy menstrual bleeding."
    difficulty: medium
    tags: [hematology, VWD, von Willebrand disease, lab tests, ristocetin, RIPA]
  - front: "What is the treatment for VWD?"
    back: "DDAVP (desmopressin): effective for 85–90% of type 1 VWD and some type 2; releases VWF and Factor VIII from endothelial cells; tachyphylaxis after 4 consecutive doses; caution in children (hyponatremia). VWF:Factor VIII concentrate (Humate-P, Wilate): if DDAVP unresponsive or severe bleeding. Tranexamic acid (antifibrinolytic): especially for mucosal bleeding. Estrogens: increase VWF levels (for heavy menstrual bleeding).\n\nA DDAVP challenge should document responsiveness before relying on it for treatment. Very high Factor VIII levels from VWF concentrates can be prothrombotic, so monitoring is required. Type 1 VWD often auto-corrects in pregnancy (VWF increases physiologically). DDAVP is contraindicated in type 2B (releases abnormal VWF that over-binds platelets). Only ~10% of VWD patients require long-term prophylactic therapy."
    difficulty: medium
    tags: [hematology, VWD, von Willebrand disease, DDAVP, treatment, tranexamic acid]
  - front: "What is Hemophilia A? Describe its genetics, severity classification, and lab findings."
    back: "Hemophilia A: X-linked recessive factor VIII deficiency; 1/5000 males. Severity: mild (>5% factor VIII), moderate (1–5%), severe (<1%). Lab: prolonged PTT, normal PT/INR, decreased factor VIII (<40% of normal). Female carriers have variable factor VIII levels due to skewed X-inactivation.\n\nHemophilia A presents with delayed deep bleeding (hemarthroses, hematomas, muscle bleeds) — features of secondary hemostasis disorder. The PTT is prolonged because factor VIII is part of the intrinsic pathway. PT is normal because factor VIII is not in the extrinsic pathway. In Canada, patients may have acquired HIV or HCV from contaminated blood products — no cases since 1985."
    difficulty: medium
    tags: [hematology, hemophilia A, factor VIII, X-linked, coagulation]
  - front: "What is the treatment for Hemophilia A?"
    back: "Mild: DDAVP (releases endothelial factor VIII). Moderate/severe: factor VIII concentrate (prophylaxis recommended for severe; on-demand for bleeds). Antifibrinolytic agents (tranexamic acid) for mucosal bleeds. Gene therapy under development.\n\nProphylactic factor VIII is recommended for severe hemophilia A to prevent recurrent hemarthroses that lead to joint destruction (hemophilic arthropathy). DDAVP is only effective in mild hemophilia A (those who have some residual endothelial VWF/factor VIII stores). VWF antigen and ristocetin activity should be tested to rule out co-existing VWD."
    difficulty: medium
    tags: [hematology, hemophilia A, factor VIII, DDAVP, treatment, prophylaxis]
  - front: "Compare Hemophilia A vs. Hemophilia B."
    back: "Hemophilia A: factor VIII deficiency, 1/5000 males. Hemophilia B (Christmas disease): factor IX deficiency, 1/30,000 males; ~50% have severe disease. Clinical and laboratory features are identical. Treatment: Hemophilia A — factor VIII concentrate; Hemophilia B — factor IX concentrate. Both: antifibrinolytics, gene therapy.\n\nBoth are X-linked recessive disorders affecting males, with identical clinical presentations (deep bleeding, hemarthroses) and laboratory findings (prolonged PTT, normal PT). They can only be distinguished by specific factor assays. Factor IX (Christmas factor) deficiency was named after Stephen Christmas, the first patient described. Hemophilia B is less common than A."
    difficulty: easy
    tags: [hematology, hemophilia A, hemophilia B, factor IX, Christmas disease, coagulation]
  - front: "What is Factor XI deficiency (Hemophilia C) and what population is it most common in?"
    back: "Factor XI deficiency is autosomal recessive, most common in Ashkenazi Jewish population. Usually mild; severe spontaneous bleeding is rare. Factor XI level does NOT correlate with bleeding risk — bleeding risk correlates with previous/family history of bleeding. Treatment: antifibrinolytics, fresh frozen plasma, factor XI concentrate, DDAVP.\n\nHemophilia C is unique because factor XI level does not predict bleeding phenotype — some patients with very low factor XI levels bleed minimally, while others bleed significantly. This is because factor XI amplifies, rather than initiates, thrombin generation. It is often diagnosed incidentally on pre-operative testing or following a surgical bleeding challenge in adulthood."
    difficulty: medium
    tags: [hematology, hemophilia C, factor XI, Ashkenazi Jewish, coagulation disorders]
  - front: "What is the pathophysiology of coagulopathy in liver disease and what lab findings are expected?"
    back: "Thrombocytopenia (hypersplenism, decreased TPO, alcohol toxicity, HCV). Decreased synthesis of all coagulation factors EXCEPT factor VIII (made in endothelium). Decreased protein C and S (anticoagulants). Decreased fibrinogen in end-stage disease. Labs: elevated INR (PT), elevated PTT, low fibrinogen. Factor VIII normal or increased.\n\nLiver disease creates a 'rebalanced hemostasis' — both procoagulant and anticoagulant factors are reduced. This means INR does not accurately reflect bleeding risk. Factor V and VII have the shortest half-lives and decrease earliest. Factor VIII is made in sinusoidal endothelial cells (not hepatocytes) and is therefore normal or elevated in liver disease (also an acute phase reactant)."
    difficulty: hard
    tags: [hematology, liver disease, coagulopathy, coagulation factors, factor VIII]
  - front: "What are the vitamin K-dependent coagulation factors and what conditions cause vitamin K deficiency?"
    back: "Vitamin K-dependent factors: X, IX, VII, II (prothrombin), Protein C and S. Mnemonic: '1972' (factors II, VII, IX, X). Causes of deficiency: warfarin, antibiotics (eradicate gut flora), poor diet/prolonged fasting, biliary obstruction, fat malabsorption (celiac, pancreatic insufficiency, cystic fibrosis), chronic liver disease.\n\nVitamin K deficiency affects the extrinsic pathway earliest (factor VII has the shortest half-life) — INR (PT) is elevated out of proportion to the PTT. PT should improve within 24 hours of vitamin K repletion (onset 6–12 hours). If PT does not improve, search for other causes (liver disease, DIC, inhibitors). Proteins C and S are also vitamin K-dependent anticoagulants."
    difficulty: medium
    tags: [hematology, vitamin K, coagulation factors, warfarin, fat malabsorption]
  - front: "How do you manage a patient on warfarin with life-threatening bleeding?"
    back: "Give vitamin K 10 mg IV (reversal takes up to 12 hours) PLUS prothrombin complex concentrate (PCC). If PCC is contraindicated, give fresh frozen plasma (FFP). PCC is relatively contraindicated in liver disease or previous HIT (contains heparin). Do not use PCC/FFP for non-emergent reversal (per ASH Choosing Wisely).\n\nPCC contains factors II, VII, IX, X (vitamin K-dependent factors) and provides rapid reversal of warfarin. It is preferred over FFP because it requires smaller volumes (avoids fluid overload) and provides faster, more complete reversal. Vitamin K alone takes too long for life-threatening hemorrhage. Indications for urgent reversal: major bleeding, intracranial hemorrhage, or emergent surgery."
    difficulty: hard
    tags: [hematology, warfarin reversal, PCC, vitamin K, anticoagulation reversal, bleeding]
  - front: "What is DIC? Describe its pathophysiology, clinical features, and key lab findings."
    back: "DIC: excessive, dysregulated thrombin and plasmin release → intravascular coagulation and fibrinolysis → depletion of platelets, coagulation factors, and fibrinogen → simultaneous hemorrhage AND thrombosis. Labs: thrombocytopenia, elevated PT/PTT/TT, decreased fibrinogen, elevated D-dimers/FDPs, schistocytes on smear.\n\nDIC is always secondary to an underlying condition (OMITS: Obstetric complications, Malignancy, Infection, Trauma/surgery, Shock). Unlike TMA (TTP/HUS), DIC has abnormal coagulation studies (elevated PT/PTT, low fibrinogen). Unlike liver disease, fibrinogen is consumed in DIC. The ISTH scoring system uses platelet count, D-dimer/FDPs, PT prolongation, and fibrinogen to diagnose DIC (≥5 points = overt DIC)."
    difficulty: hard
    tags: [hematology, DIC, disseminated intravascular coagulation, coagulopathy, lab tests]
  - front: "What is the mnemonic for common etiologies of DIC?"
    back: "OMITS: Obstetric complications (placental abruption, amniotic fluid embolism, HELLP), Malignancy (especially promyelocytic leukemia), Infection (sepsis, gram-negative bacteria), Trauma/surgery (burns, crush injury), Shock.\n\nDIC occurs as a complication of conditions causing widespread endothelial damage and inflammatory cytokine release. In obstetric DIC, placental abruption and amniotic fluid embolism are classic triggers. Sepsis is the most common cause of DIC in ICU patients. Acute promyelocytic leukemia (APL/AML-M3) releases tissue factor-like procoagulants from granules, causing severe DIC."
    difficulty: easy
    tags: [hematology, DIC, disseminated intravascular coagulation, etiology, OMITS]
  - front: "How is DIC managed in the bleeding phase vs. thrombotic phase?"
    back: "Bleeding phase: treat underlying cause; platelets if <50×10⁹/L with active bleeding (or <20×10⁹/L at high risk); FFP if prolonged PT/PTT >1.5× normal with active bleeding; cryoprecipitate/fibrinogen concentrate if fibrinogen <1.5 g/L; PCC if FFP not possible. Thrombotic phase: LMWH preferred over UFH in critically ill non-bleeding patients.\n\nThe key principle is treating the underlying cause while providing supportive transfusion therapy. Replacement blood products are only used for active bleeding or planned procedures, NOT prophylactically (giving products without bleeding may 'fuel the fire'). Cryoprecipitate is the concentrated source of fibrinogen, VWF, and factor VIII. RBC transfusion is used for severe anemia from hemolysis/bleeding."
    difficulty: hard
    tags: [hematology, DIC, treatment, FFP, cryoprecipitate, platelets, transfusion]
  - front: "What pattern of coagulation test abnormality suggests isolated warfarin use or vitamin K deficiency (early)?"
    back: "Isolated elevation of PT/INR with normal PTT. This reflects selective factor VII deficiency (shortest half-life, extrinsic pathway only). As deficiency progresses, PTT also becomes elevated (factors II, IX, X are shared in common and intrinsic pathways).\n\nFactor VII has the shortest half-life (~6 hours), so its levels fall first in warfarin use or vitamin K deficiency. Early vitamin K deficiency or warfarin effect is therefore detected by elevated PT/INR before the PTT becomes abnormal. The differential for isolated elevated PT includes: warfarin, vitamin K deficiency, factor VII deficiency, and liver disease."
    difficulty: medium
    tags: [hematology, coagulation, PT, INR, factor VII, warfarin, vitamin K]
  - front: "What are the criteria for diagnosing Antiphospholipid Antibody Syndrome (APS)?"
    back: "Revised Sapporo Criteria: ≥1 clinical criterion AND ≥1 laboratory criterion. Clinical: arterial/venous thrombosis, ≥3 consecutive early fetal losses (<10 wk), 1 late fetal loss (≥10 wk) of morphologically normal fetus, premature birth <34 wk due to (pre)eclampsia or placental insufficiency. Laboratory (confirmed on 2 occasions ≥12 wk apart): anticardiolipin IgG/IgM, anti-β2 glycoprotein-I Ab, or lupus anticoagulant.\n\nAPS is an acquired thrombophilia associated with both arterial and venous thrombosis, as well as pregnancy morbidity. The lupus anticoagulant paradoxically prolongs PTT in vitro but causes thrombosis in vivo. Laboratory criteria must be confirmed on two occasions at least 12 weeks apart to exclude transient antibody positivity (e.g., post-infectious). APS is associated with SLE in about 30–40% of cases."
    difficulty: hard
    tags: [hematology, APS, antiphospholipid syndrome, thrombophilia, lupus anticoagulant]
  - front: "What is Factor V Leiden mutation and why does it cause hypercoagulability?"
    back: "Factor V Leiden: most common hereditary thrombophilia (3–7% of European White population are heterozygotes). Point mutation (R506Q) in the Factor V gene → Factor Va is resistant to inactivation by activated Protein C (APC resistance) → sustained thrombin generation → hypercoagulability.\n\nNormally, activated Protein C inactivates Factor Va (and Factor VIIIa) to limit coagulation. The R506Q mutation changes the cleavage site, making Factor Va resistant to APC inactivation. Factor V Leiden is primarily associated with venous thrombosis, not arterial. Homozygotes have higher thrombotic risk than heterozygotes. It does NOT cause arterial thrombosis typically — arterial events suggest APS, HIT, or malignancy."
    difficulty: medium
    tags: [hematology, Factor V Leiden, thrombophilia, APC resistance, hereditary thrombophilia]
  - front: "What is the Prothrombin Gene Mutation G20210A and what thrombophilias are associated with European White populations?"
    back: "Prothrombin G20210A: G→A transposition at nucleotide 20210 in the prothrombin gene promoter → increased prothrombin levels → increased thrombin generation → venous thrombosis. Affects 1–3% of European White population (heterozygotes). Also associated with hereditary thrombophilia: Factor V Leiden (3–7%) is most common.\n\nProthrombin G20210A is the second most common hereditary thrombophilia after Factor V Leiden. The mutation increases prothrombin mRNA stability, leading to higher prothrombin production and a prothrombotic state. Both Factor V Leiden and prothrombin G20210A are more common in people of European ancestry. Together they account for the majority of identified hereditary thrombophilias."
    difficulty: medium
    tags: [hematology, prothrombin gene mutation, G20210A, thrombophilia, hereditary]
  - front: "What are Protein C and Protein S deficiencies and what conditions cause acquired deficiency?"
    back: "Protein C inactivates Factors Va and VIIIa; Protein S is its cofactor. Deficiency leads to hypercoagulability. Acquired causes: liver disease, sepsis, DIC, warfarin, certain chemotherapy. Homozygous Protein C deficiency causes neonatal purpura fulminans. 1/3 of warfarin necrosis cases have underlying Protein C deficiency.\n\nWarfarin initially depletes Protein C and S faster than vitamin K-dependent procoagulant factors (shorter half-life of Protein C), transiently increasing thrombosis risk — this is why warfarin necrosis occurs in Protein C deficient patients. Protein C and S levels are affected by acute thrombosis and anticoagulation therapy, so testing should occur at least 6 weeks after acute thrombosis and off anticoagulation. Both are autosomal dominant (type I: decreased levels; type II: decreased function)."
    difficulty: hard
    tags: [hematology, protein C deficiency, protein S deficiency, thrombophilia, warfarin necrosis]
  - front: "What is Antithrombin (AT) deficiency and how does it affect heparin therapy?"
    back: "Antithrombin slowly inactivates thrombin; heparin accelerates this process. AT deficiency causes: autosomal dominant inheritance, urinary losses (nephrotic syndrome), or reduced synthesis (liver disease). Deficiency can cause heparin resistance (suspect if >35,000 IU UFH required in 24 hours). LMWH with anti-Xa monitoring may be considered.\n\nBecause heparin exerts its anticoagulant effect by accelerating antithrombin activity, AT deficiency makes heparin therapy less effective. Testing for AT deficiency must be done outside the window of acute thrombosis and anticoagulation (both heparin and acute thrombosis consume antithrombin, leading to false low levels). AT deficiency is the most thrombogenic of the hereditary thrombophilias."
    difficulty: hard
    tags: [hematology, antithrombin deficiency, heparin resistance, thrombophilia, hereditary]
  - front: "When should hypercoagulability workup be performed and what are the key indications?"
    back: "Workup only if it will alter treatment decisions. Consider in: multiple recurrent thromboses, warfarin-induced skin necrosis or neonatal purpura fulminans (Protein C/S deficiency), thrombosis at unusual sites (cerebral, jugular, splanchnic, portal, upper extremity), abnormal constitutional findings suggesting cancer. Protein C, S, ATIII tested >6 weeks post-thrombosis and off anticoagulation.\n\nPer ASH Choosing Wisely: do NOT test for thrombophilia in adults with a first VTE occurring in setting of a major transient risk factor (e.g., major surgery, hospitalization, prolonged immobility) — results rarely change management and testing often leads to unnecessary anxiety and anticoagulation. Arterial thrombotic events are typically associated with APS, HIT, JAK2/MPNs, malignancy, and PNH — NOT hereditary thrombophilias."
    difficulty: hard
    tags: [hematology, hypercoagulability, thrombophilia workup, clinical decision-making]
  - front: "What conditions are associated with BOTH venous and arterial thrombosis (as opposed to venous only)?"
    back: "Conditions causing both venous AND arterial thrombosis: APS (antiphospholipid syndrome), HIT, JAK2 mutations/MPNs, malignancy, PNH. Distal venous clot with patent foramen ovale (paradoxical embolism) can cause arterial events.\n\nMost hereditary thrombophilias (Factor V Leiden, prothrombin G20210A, Protein C/S deficiency, AT deficiency) cause ONLY venous thrombosis. Arterial thrombosis with thrombophilia should prompt evaluation for APS, HIT, or MPN. This distinction is clinically important as the workup and management differ significantly between arterial and venous causes."
    difficulty: medium
    tags: [hematology, thrombosis, arterial thrombosis, venous thrombosis, APS, HIT, MPN]
  - front: "What is Virchow's Triad and give examples of each component predisposing to DVT?"
    back: "Virchow's Triad: 1) Endothelial damage (surgery, trauma, IV catheters, inflammation); 2) Venous stasis (immobilization, CHF, stroke, post-op, prolonged travel); 3) Hypercoagulability (inherited thrombophilias, malignancy, OCP, pregnancy, APS, HIT, MPNs).\n\nThese three components define the conditions predisposing to thrombus formation in any vessel. DVT risk is highest with orthopedic, thoracic, GI, and GU surgery. Neoplasms most associated with VTE include pancreas, stomach, lung, lymphoma, bladder, testicular, colorectal, and gynecologic cancers (Khorana score). Idiopathic DVT — 10–20% are later found to have occult cancer."
    difficulty: easy
    tags: [hematology, Virchow triad, DVT, venous thromboembolism, risk factors]
  - front: "What are the clinical features of DVT and which physical finding is unreliable?"
    back: "DVT: unilateral leg edema, erythema, warmth, tenderness; purple-blue colour may indicate limb-threatening thrombus; palpable cord (thrombosed vein); phlegmasia alba dolens (white) or cerulea dolens (blue/purple, acute pain + edema) with massive thrombosis. Homan's sign (pain with foot dorsiflexion) is UNRELIABLE.\n\nAbsence of physical findings does NOT rule out DVT — up to 50% of DVTs are asymptomatic. Homan's sign has poor sensitivity and specificity. Phlegmasia cerulea dolens indicates massive DVT with venous outflow obstruction, requiring urgent intervention. The most important sequelae of DVT are pulmonary embolism (~50% with proximal DVT) and post-thrombotic syndrome (chronic venous insufficiency)."
    difficulty: easy
    tags: [hematology, DVT, deep vein thrombosis, clinical features, Homans sign]
  - front: "In the lab findings table for disorders of hemostasis, what pattern is seen in DIC vs. TTP vs. liver disease?"
    back: "DIC: thrombocytopenia ↓, PT ↑, PTT ↑, Hb ↓. TTP: thrombocytopenia ↓↓, PT/PTT normal, Hb ↓ (MAHATMA). Liver disease: thrombocytopenia ↓, PT ↑, PTT normal/↑, Hb normal/↓. ITP: thrombocytopenia ↓, PT/PTT normal, Hb normal. VWD: PT normal, PTT normal/↑, platelets normal/↓ (type 2B), Hb normal.\n\nThe coagulation profile (PT, PTT) combined with platelet count and Hb is essential for narrowing the differential of bleeding disorders. DIC uniquely affects all components (platelets, PT, PTT, fibrinogen). TTP/HUS have normal coagulation studies (PT/PTT) — key distinguishing feature from DIC. ITP is an isolated platelet disorder with normal coagulation. VWD type 1 can have normal PT/PTT, making VWF-specific tests essential."
    difficulty: hard
    tags: [hematology, DIC, TTP, liver disease, ITP, VWD, lab differentiation]
  - front: "What is the differential diagnosis for isolated prolonged INR (PT) only?"
    back: "Warfarin use, vitamin K deficiency, factor VII deficiency, liver disease (early or mild — factor VII has shortest half-life), factor VII inhibitor, severe vitamin K deficiency.\n\nAn isolated elevated PT/INR (normal PTT) localizes the defect to the extrinsic pathway (factor VII) or early common pathway. Factor VII has the shortest half-life (~6 hours) and is exclusively in the extrinsic pathway. Therefore, it falls first in vitamin K deficiency, warfarin therapy, or liver disease. PT should normalize within 24 hours of vitamin K repletion if vitamin K deficiency is the cause."
    difficulty: medium
    tags: [hematology, PT, INR, factor VII, coagulation differential, warfarin]
  - front: "What is the significance of lupus anticoagulant in the context of PTT and clinical thrombosis?"
    back: "Lupus anticoagulant paradoxically PROLONGS the PTT in vitro (inhibits the pathway in vitro), but CAUSES THROMBOSIS in vivo (associated with APS). It will NOT correct on mixing studies (it is an inhibitor). It is a misnomer — it does not indicate lupus and is not an anticoagulant clinically.\n\nThe lupus anticoagulant binds to phospholipid-protein complexes used in coagulation testing, thereby prolonging PTT in the lab. In vivo, the same antibodies promote thrombosis by interacting with platelet and endothelial phospholipids. Testing for lupus anticoagulant should be done before starting anticoagulation, as anticoagulation can affect the result. It is part of the APS laboratory criteria."
    difficulty: medium
    tags: [hematology, lupus anticoagulant, PTT, APS, thrombophilia, paradox]
  - front: "What vaccines are required before splenectomy in a patient with ITP?"
    back: "Pre-splenectomy vaccinations required: Streptococcus pneumoniae (Pneumovax), Neisseria meningitidis (including quadrivalent and serotype b), Haemophilus influenzae type b (Hib). These are encapsulated organisms that the spleen is responsible for clearing.\n\nPost-splenectomy patients are at lifelong risk of overwhelming post-splenectomy infection (OPSI), particularly from encapsulated bacteria (S. pneumoniae, N. meningitidis, H. influenzae type b) that require opsonization for clearance — a function of the spleen. Vaccines should be given at least 2 weeks before splenectomy if possible. Lifelong penicillin prophylaxis is also recommended in some guidelines."
    difficulty: medium
    tags: [hematology, splenectomy, ITP, vaccination, OPSI, post-splenectomy infection]
  - front: "What is the difference between heparin-associated thrombocytopenia (HAT) and HIT (previously HIT type II)?"
    back: "HAT (previously HIT type I): direct heparin-mediated platelet aggregation (non-immune), onset 24–72 hours, mild thrombocytopenia (>100×10⁹/L), self-limited, NO thrombotic risk, can continue heparin. HIT (previously HIT type II): immune-mediated (anti-PF4/heparin antibodies), onset 5–14 days, significant thrombocytopenia, 30–50% thrombosis risk, MUST stop heparin.\n\nThis distinction is clinically critical. HAT is a benign, transient phenomenon that does not require stopping heparin. HIT is a serious prothrombotic disorder requiring immediate discontinuation of all heparin products (including LMWH and heparin flushes) and substitution with a non-heparin anticoagulant. LMWH is also associated with HIT but at a lower rate than UFH."
    difficulty: medium
    tags: [hematology, HIT, heparin-associated thrombocytopenia, HAT, heparin, platelet]
  - front: "What are the main causes of venous vs. arterial thrombosis to consider in a hypercoagulability workup?"
    back: "Venous thrombosis causes: hereditary thrombophilias (Factor V Leiden, prothrombin G20210A, Protein C/S/AT deficiency), APS, malignancy, surgery/trauma, immobility, OCP/pregnancy, MPN, PNH. Arterial thrombosis causes: APS, HIT, JAK2 mutations/MPNs, malignancy, PNH, and cardiovascular risk factors (atherosclerosis, AFib).\n\nThis distinction guides the workup. Hereditary thrombophilias are primarily associated with venous thromboembolism. Arterial thrombosis in a young patient without conventional cardiovascular risk factors should prompt investigation for APS, HIT, MPNs (JAK2 mutation), and PNH. Hematology consultation should be sought for complex cases, as most thrombophilia tests do not change acute management."
    difficulty: medium
    tags: [hematology, venous thromboembolism, arterial thrombosis, thrombophilia, hypercoagulability]
  - front: "What is caplacizumab and in what setting is it used for TTP?"
    back: "Caplacizumab is an anti-VWF nanobody that blocks the interaction between ultra-large VWF multimers and platelet GPIb, preventing pathological platelet aggregation. It is used in certain cases of ACQUIRED TTP (immune-mediated ADAMTS13 deficiency) in addition to plasma exchange and steroids.\n\nCaplacizumab does not address the underlying cause of TTP (ADAMTS13 deficiency due to autoantibodies) but rapidly blocks the downstream consequences (platelet aggregation). It reduces time to platelet count normalization and TTP recurrence. It is not indicated for congenital TTP or HUS. Clinical evidence supports its use but availability and cost may limit access in Canada."
    difficulty: hard
    tags: [hematology, TTP, caplacizumab, VWF, treatment, plasma exchange]
  - front: "Why should platelet transfusion be AVOIDED in TTP?"
    back: "Platelet transfusion in TTP is associated with microvascular thrombosis (worsening the disease) and should only be used for life-threatening bleeding. The pathology of TTP is excessive platelet aggregation in small vessels; adding more platelets provides more substrate for thrombosis.\n\nThis is a classic MCCQE1 'do not do' scenario. Unlike ITP (where platelet transfusion may be used for severe bleeding), TTP is characterized by pathological platelet consumption in microvascular thrombi. Transfusing platelets in TTP has been described as 'adding fuel to the fire.' Plasma exchange is the cornerstone of TTP management, providing ADAMTS13 and removing anti-ADAMTS13 antibodies."
    difficulty: medium
    tags: [hematology, TTP, platelet transfusion, contraindication, treatment]
  - front: "What is the ISTH DIC scoring system and how is a score calculated?"
    back: "ISTH DIC Score requires an underlying predisposing condition. Points scored for: Platelet count (>100: 0, 50–100: 1, <50: 2), Fibrin markers/D-dimer (no increase: 0, moderate: 2, strong increase: 3), Prolonged PT (<3 sec: 0, 3–6 sec: 1, >6 sec: 2), Fibrinogen (>1 g/L: 0, <1 g/L: 1). Score ≥5 = overt DIC.\n\nThe ISTH scoring system provides a standardized approach to DIC diagnosis. A score of ≥5 points in a patient with a predisposing condition indicates overt DIC. Scores of 4 or below suggest non-overt DIC (early or compensated). Serial scoring every 1–2 days is recommended in patients with predisposing conditions to monitor disease progression. D-dimer and FDPs reflect accelerated fibrinolysis."
    difficulty: hard
    tags: [hematology, DIC, ISTH score, diagnosis, scoring system]
  - front: "What is the most useful diagnostic test for DVT, and what are its sensitivity and specificity for proximal DVT?"
    back: "Doppler ultrasound is the most useful diagnostic test for DVT. Sensitivity and specificity for proximal DVT are approximately 95% each. Sensitivity for calf DVT is approximately 70%.\n\nDoppler ultrasound is non-invasive and widely available. Venography is the gold standard but is invasive, expensive, and higher risk. For calf DVT, sensitivity is lower (~70%), meaning repeat imaging may be needed if initial study is negative but clinical suspicion persists."
    difficulty: easy
    tags: [DVT, venous thromboembolism, diagnosis, ultrasound, hematology]
  - front: "When is a D-dimer test useful in the evaluation of DVT?"
    back: "D-dimer is only useful to RULE OUT DVT if the result is NEGATIVE in a patient with LOW clinical suspicion (Modified Wells' Pre-test Probability <1) and no other acute medical issues. A positive D-dimer is non-specific and does not confirm DVT.\n\nD-dimer has high sensitivity but low specificity for DVT. It is elevated in many conditions (infection, trauma, malignancy, pregnancy). Its negative predictive value is high in low-probability patients, making it useful to rule out disease and reduce unnecessary ultrasounds."
    difficulty: easy
    tags: [DVT, D-dimer, Wells score, diagnosis, hematology]
  - front: "List the components of the Wells Score for predicting DVT."
    back: "1. Paralysis, paresis, or recent orthopedic casting of lower extremity (+1)\n2. Recently bedridden ≥3 days or major surgery within 12 weeks (+1)\n3. Local tenderness along deep venous system (+1)\n4. Swelling of entire leg (+1)\n5. Calf swelling >3 cm compared to the other leg (+1)\n6. Pitting edema greater in symptomatic leg (+1)\n7. Collateral non-varicose superficial veins (+1)\n8. Active cancer or treated within 6 months (+1)\n9. Alternative diagnosis more likely than DVT (e.g., Baker's cyst, cellulitis) (-2)\nTotal: ≥3 High probability; 1-2 Moderate probability; ≤0 Low probability\n\nThe Wells Score stratifies pre-test probability of DVT to guide imaging and D-dimer use. A Modified Wells Score adds 1 additional point for a history of DVT or major surgery. Patients with 'DVT unlikely' score (≤1 on Modified Wells) can have D-dimer ordered to fully rule out DVT, reducing unnecessary ultrasounds."
    difficulty: medium
    tags: [DVT, Wells score, clinical prediction, hematology]
  - front: "What is Post-Thrombotic Syndrome and how is it managed?"
    back: "Post-Thrombotic Syndrome (PTS) is the development of chronic venous stasis signs and symptoms secondary to a DVT. Symptoms include pain, venous dilatation, edema, skin pigmentation/changes, and venous ulcers. Clinical severity is assessed with the Villalta score. Management includes extremity elevation, exercise, compression stockings, and skin/ulcer care.\n\nPTS has a large impact on quality of life following DVT. Chronic venous insufficiency results from valvular damage caused by the thrombus. Compression therapy is the cornerstone of treatment to reduce edema and prevent ulceration."
    difficulty: easy
    tags: [DVT, post-thrombotic syndrome, venous insufficiency, hematology]
  - front: "What are the first-line DOAC options for initial treatment of VTE, and which require prior parenteral anticoagulation?"
    back: "For initial VTE treatment:\n- Apixaban or rivaroxaban: can be used ALONE with a loading dose (no parenteral anticoagulation needed)\n- Dabigatran or edoxaban: require 5-10 days of parenteral anticoagulation (usually LMWH) PRIOR to initiation\nContraindications for DOACs: during conception/pregnancy and in breastfeeding women.\n\nApixaban and rivaroxaban have loading doses incorporated into initial dosing regimens, making them monotherapy options for VTE. Dabigatran and edoxaban lack this property and require a bridging period with parenteral therapy to achieve immediate anticoagulation."
    difficulty: medium
    tags: [VTE, DOAC, anticoagulation, treatment, hematology]
  - front: "What are the advantages and disadvantages of LMWH compared to UFH for VTE treatment?"
    back: "LMWH advantages: predictable dose response, fixed dosing schedule, no lab monitoring required, <1% risk of HIT, safe outpatient use (including pregnant and cancer patients).\nLMWH disadvantages: only partially reversible by protamine, long-term use associated with osteoporosis, subcutaneous injection, renally cleared (may require dose adjustment in renal dysfunction).\nUFH advantages: rapidly reversible by protamine.\nUFH disadvantages: must monitor aPTT (~2x normal), higher risk of HIT.\n\nLMWH's predictable pharmacokinetics allow fixed weight-based dosing without routine lab monitoring, enabling outpatient therapy. UFH is preferred when rapid reversibility is needed (high bleeding risk, perioperative) and in severe renal failure where LMWH accumulates."
    difficulty: medium
    tags: [LMWH, UFH, anticoagulation, VTE, hematology]
  - front: "What are the recommended durations of anticoagulation therapy for VTE?"
    back: "- Provoked VTE with transient risk factor: 3 months\n- Provoked VTE with ongoing risk factor: consider indefinite therapy with annual reassessment\n- First unprovoked proximal DVT or PE: ≥3 months, consider indefinite therapy based on bleeding vs. thrombotic risk (use HERDOO2 or DASH scores)\n- Second unprovoked VTE: consider indefinite therapy if not already on it\n- Cancer-associated DVT: consider indefinite therapy for as long as active malignancy (extend 3-6 months post last treatment if in remission)\n\nDuration depends on the balance between risk of recurrence (higher with unprovoked or ongoing risk factors) and risk of bleeding from anticoagulation. Annual reassessment is recommended for patients on indefinite therapy."
    difficulty: medium
    tags: [VTE, anticoagulation duration, DVT, hematology]
  - front: "Why must warfarin be overlapped with heparin for at least 48 hours when initiating anticoagulation, and what INR target is used?"
    back: "Warfarin must overlap with heparin for at least 48 hours with INR >2 because warfarin initially causes a PROTHROMBOTIC state by inhibiting natural anticoagulants protein C and S (which have shorter half-lives than procoagulant factors). The INR target is 2-3. Heparin is discontinued after INR >2.0 for 2 consecutive days.\n\nWarfarin inhibits vitamin K-dependent factors (II, VII, IX, X, protein C, S). Factor VII has the shortest half-life, causing early INR prolongation, but full antithrombotic effect requires reduction of factors II, IX, and X (~4 days). Initial reduction of protein C/S causes a transient hypercoagulable state, risking warfarin-induced skin necrosis."
    difficulty: hard
    tags: [warfarin, anticoagulation, INR, VTE, hematology]
  - front: "What are the indications and important considerations for IVC filters in VTE management?"
    back: "Temporary IVC filter is indicated ONLY for: acute VTE (<4 weeks) with significant contraindications to anticoagulant therapy (i.e., active bleeding) OR when anticoagulation must be interrupted (e.g., urgent surgery). The filter MUST be retrieved once it is safe to do so, to prevent long-term complications including migration, thrombosis, IVC penetration, and filter fracture.\n\nIVC filters reduce the risk of PE but do not treat the underlying thrombosis. They are associated with significant long-term complications if left in place. Once anticoagulation can be safely resumed, retrieval is essential."
    difficulty: medium
    tags: [IVC filter, DVT, PE, VTE, anticoagulation, hematology]
  - front: "How should anticoagulation be managed during pregnancy for VTE?"
    back: "- Use LMWH during pregnancy, then LMWH or warfarin for 6 weeks post-partum (minimum total anticoagulation of 3-6 months, must include 6 weeks post-partum)\n- Avoid warfarin in pregnancy due to teratogenicity (may be used by some experts in 2nd/3rd trimesters for mechanical heart valves)\n- Avoid DOACs in conception, pregnancy (lack of data), and while breastfeeding post-partum\n\nThe post-partum period (especially 6 weeks) is a high-risk period for thromboembolism, mandating continued anticoagulation. LMWH does not cross the placenta, making it the preferred agent. Warfarin crosses the placenta and causes fetal coagulopathy and embryopathy."
    difficulty: medium
    tags: [VTE, pregnancy, anticoagulation, LMWH, warfarin, hematology]
  - front: "What perioperative anticoagulation management is recommended for patients on warfarin or DOACs?"
    back: "- Warfarin or DOACs: discontinue at least 2-5 days preoperatively (based on drug clearance)\n- IV heparin may be used up to 4-6 hours preoperatively\n- For high thromboembolism risk patients (VTE <12 wk, recurrent VTE, APS, AFib with prior stroke, mechanical heart valve): IV heparin or LMWH bridging may be considered before and after procedure while INR <2.0\n- Bridging is NOT required for DOACs\n- Avoid elective surgery in first 3 months after VTE event\n\nBridging anticoagulation aims to minimize the window of subtherapeutic anticoagulation in high-risk patients. DOACs have short half-lives and predictable offset, so bridging is unnecessary—it only increases bleeding risk."
    difficulty: hard
    tags: [anticoagulation, perioperative, bridging, warfarin, DOAC, hematology]
  - front: "What is the definition of Acute Myeloid Leukemia (AML) and what percentage of blast cells is required for diagnosis?"
    back: "AML is a rapidly progressive malignancy characterized by failure of myeloid cells to differentiate beyond the blast stage. Diagnosis (WHO definition) requires ≥20% blast cells in the peripheral blood or bone marrow at presentation.\n\nThe 20% blast threshold distinguishes AML from myelodysplastic syndromes (MDS). AML accounts for 80% of acute adult leukemias with a median age of onset of 65 years. The inability of blasts to differentiate leads to suppression of normal hematopoiesis."
    difficulty: easy
    tags: [AML, leukemia, diagnosis, blasts, hematology]
  - front: "What are the risk factors for AML?"
    back: "Risk factors for AML include: male sex, older age, smoking, obesity, myelodysplastic syndrome (MDS), benzene exposure, radiation exposure, Down syndrome, prior alkylating agent therapy, and radiation therapy as treatment for a previous malignancy.\n\nSecondary AML arising from prior hematologic malignancies (MDS, myeloproliferative disorders) or from prior chemotherapeutic agents (especially alkylating agents) generally carries a worse prognosis than de novo AML. Down syndrome (trisomy 21) increases leukemia risk due to GATA1 mutations."
    difficulty: easy
    tags: [AML, risk factors, leukemia, hematology]
  - front: "What is the pathognomonic finding of AML on peripheral blood film?"
    back: "Auer rods (azurophilic granules) in circulating blasts are pathognomonic for AML.\n\nAuer rods are crystalline lysosomal granules that appear as needle-like pink inclusions within myeloblasts on Wright-Giemsa stain. Their presence definitively identifies the blast as myeloid in origin, distinguishing AML from ALL. They are particularly associated with acute promyelocytic leukemia (APL)."
    difficulty: easy
    tags: [AML, Auer rods, peripheral blood film, pathognomonic, hematology]
  - front: "What are the clinical manifestations of leukostasis/hyperleukocytosis syndrome in AML?"
    back: "Leukostasis is a medical emergency in AML where large numbers of blasts interfere with microcirculation causing hypoxia and hemorrhage. Manifestations include: diffuse pulmonary infiltrates, CNS bleeding, respiratory distress, altered mental status, and priapism. It is more commonly associated with AML than ALL.\n\nLeukostasis occurs when extremely elevated WBC counts (often >100 x 10⁹/L) cause sludging in small vessels. Blasts are larger and less deformable than mature cells, further impairing flow. Immediate cytoreductive therapy with hydroxyurea is required."
    difficulty: medium
    tags: [AML, leukostasis, hyperleukocytosis, emergency, hematology]
  - front: "What metabolic complications are associated with AML and its treatment (Tumor Lysis Syndrome)?"
    back: "Tumor Lysis Syndrome (TLS) features:\n- Increased uric acid → nephropathy and gout\n- Released phosphate → decreased calcium and magnesium\n- Released procoagulants → DIC (higher risk in APL)\n- Hyperkalemia (from blastic proliferation and spontaneous TLS pre-treatment, further worsened post-treatment from lysed cells)\n- Note: some AML forms present with hypokalemia due to muramidase secretion causing renal tubular K⁺ wasting\n\nTLS results from rapid destruction of tumor cells releasing intracellular contents. The electrolyte derangements (hyperuricemia, hyperphosphatemia, hypocalcemia, hyperkalemia) can cause renal failure, cardiac arrhythmias, and seizures. Prevention with allopurinol or rasburicase is critical before and during induction."
    difficulty: medium
    tags: [AML, tumor lysis syndrome, TLS, metabolic complications, hematology]
  - front: "What is the treatment approach for Acute Promyelocytic Leukemia (APL) and why is it an emergency?"
    back: "APL is an emergency because DIC is often present at diagnosis. Treatment approach:\n- ATRA (all-trans retinoic acid) should be started ASAP if APL is in the differential; ATRA induces differentiation\n- ATRA + arsenic trioxide combination is SUPERIOR to traditional chemotherapy for APL\n- Supportive transfusions: target platelet count >30 (no bleeding) or >50 (with bleeding) and fibrinogen >1.5\n- APL has (15;17) translocation (different from other AML subtypes in treatment approach)\n\nAPL arises from t(15;17) producing PML-RARα fusion protein that blocks myeloid differentiation at the promyelocyte stage. ATRA targets the RARα component to force differentiation of malignant promyelocytes. Coagulopathy (DIC) from release of procoagulants from azurophilic granules is life-threatening."
    difficulty: hard
    tags: [APL, ATRA, AML, DIC, hematology]
  - front: "What is the prognosis for AML and what factors determine it?"
    back: "AML prognosis:\n- Achievement of first remission: 70-80% if <60 years old; 50% if >60 years old\n- Median survival: 12-24 months\nPrognostic factors: cytogenetics (most important), age, performance status, prior cytotoxic agents or radiation therapy. Patients with poor response to initial induction have worse prognosis.\n\nCytogenetics is the most critical prognostic factor in AML. Favorable cytogenetics (e.g., t(8;21), inv(16), t(15;17)) confer better outcomes. Adverse cytogenetics (e.g., monosomy 5/7, complex karyotype) are associated with high-risk disease. Complete cytogenetic analysis is essential at diagnosis for risk stratification."
    difficulty: medium
    tags: [AML, prognosis, cytogenetics, hematology]
  - front: "What is Myelodysplastic Syndrome (MDS) and what are its key peripheral blood film findings?"
    back: "MDS is a heterogeneous group of malignant stem cell disorders characterized by dysplastic and ineffective blood cell production resulting in peripheral cytopenias with variable risk of transformation to acute leukemia.\nPeripheral blood film:\n- RBCs: usually macrocytic, oval-shaped (macro-ovalocytes), decreased reticulocyte count\n- WBCs: decreased granulocytes with abnormal morphology (e.g., bi-lobed or unsegmented nuclei = Pelger abnormality)\n- Platelets: thrombocytopenia with abnormalities of size and cytoplasm (e.g., giant hypogranular platelets)\n\nDespite having adequate progenitor cells in the bone marrow (often hypercellular), MDS is characterized by intramedullary apoptosis and disordered maturation, leading to peripheral cytopenias. The bone marrow produces cells that look abnormal (dysplastic) and function poorly."
    difficulty: medium
    tags: [MDS, myelodysplastic syndrome, peripheral blood film, hematology]
  - front: "What is the treatment approach for low-risk vs. high-risk Myelodysplastic Syndrome (MDS)?"
    back: "Low-risk MDS (IPSS-R Very Low or Low):\n- EPO-stimulating agents (first-line to reduce transfusion requirements; EPO level must be <500 IU/L)\n- If 5q deletion: lenalidomide PO\n- If ringed sideroblasts: luspatercept (after failing EPO)\n- Supportive care: RBC and platelet transfusion (iron chelation if frequent RBC transfusions)\n\nHigh-risk MDS (IPSS-R Intermediate, High, or Very High):\n- Supportive care (transfusion)\n- Epigenetic therapy: DNA methyltransferase inhibitors (e.g., 5-azacitidine)\n- Consider stem cell transplantation (based on age, frailty, overall health)\n\nThe IPSS-R (Revised International Prognostic Scoring System) uses cytology, % BM blasts, Hb, platelets, and ANC to categorize risk. The 5q deletion syndrome is uniquely sensitive to lenalidomide. High-risk MDS benefits from hypomethylating agents which epigenetically re-activate tumor suppressor genes."
    difficulty: hard
    tags: [MDS, myelodysplastic syndrome, treatment, IPSS-R, hematology]
  - front: "What are the Myeloproliferative Neoplasms (MPNs) and how do they differ from MDS?"
    back: "Myeloproliferative Neoplasms (MPNs) include: CML, Polycythemia Vera (PV), Myelofibrosis (MF), and Essential Thrombocythemia (ET). They are clonal myeloid stem cell abnormalities leading to OVERPRODUCTION of one or more cell lines.\n\nKey distinction:\n- MDS = ineffective maturation (peripheral cytopenias despite hypercellular BM)\n- MPNs = overproduction of mature cells\n\nMPNs share overlapping features (splenomegaly, potential progression to AML) but differ in which cell line is predominantly affected. CML overproduces granulocytes, PV overproduces erythrocytes, ET overproduces platelets, and MF features BM fibrosis with extramedullary hematopoiesis."
    difficulty: easy
    tags: [MPN, myeloproliferative neoplasm, MDS, hematology]
  - front: "What is the genetic basis of Chronic Myeloid Leukemia (CML) and how does it drive the disease?"
    back: "CML is caused by the Philadelphia (Ph) chromosome: a translocation between chromosomes 9 and 22 [t(9;22)]. The c-Abl proto-oncogene from chromosome 9 is translocated to the 'breakpoint cluster region' (BCR) of chromosome 22, producing the BCR-ABL fusion gene. BCR-ABL is a constitutively active tyrosine kinase that drives uncontrolled granulocytic proliferation.\n\nThe t(9;22) translocation is necessary and sufficient to cause CML. BCR-ABL constitutively activates downstream signaling pathways (RAS, MAPK, PI3K/AKT) promoting proliferation and inhibiting apoptosis. This makes BCR-ABL the molecular target of imatinib and other TKIs."
    difficulty: medium
    tags: [CML, Philadelphia chromosome, BCR-ABL, pathophysiology, hematology]
  - front: "Describe the three clinical phases of CML and their blast counts."
    back: "1. Chronic phase (85% diagnosed here): <10% blasts in peripheral blood; few symptoms, slightly elevated eosinophils and basophils\n2. Accelerated phase: 10-20% circulating blasts; increasing peripheral basophils (causing pruritus), thrombocytopenia <100 × 10⁹/L or thrombocytosis, cytogenetic clonal evolution, worsening constitutional symptoms and splenomegaly\n3. Blast crisis (acute phase): ≥20% blasts in peripheral blood or BM; behaves like acute leukemia (1/3 ALL-like, 2/3 AML-like)\n\nMost CML is diagnosed in chronic phase (often incidentally). Without treatment, CML progresses through accelerated phase to blast crisis within 3-5 years. Blast crisis carries poor prognosis and is largely unresponsive to remission induction. TKIs have dramatically changed the natural history of CML."
    difficulty: medium
    tags: [CML, blast crisis, chronic phase, accelerated phase, hematology]
  - front: "What are the clinical features of CML at presentation?"
    back: "20-50% of patients are asymptomatic (incidental lab finding). Symptomatic patients may have:\n- Nonspecific: fatigue, weight loss, malaise, excessive sweating, fever\n- Splenic involvement: early satiety, LUQ pain/fullness, shoulder tip pain (referred pain from spleen)\n- Splenomegaly (most common physical finding)\n- Anemia\n- Bleeding (platelet dysfunction)\n- Pruritus, PUD (from increased blood histamine via basophils)\n- Rarely: leukostasis, priapism, encephalopathy (very elevated WBC)\n\nSplenomegaly occurs due to extramedullary hematopoiesis in CML. Basophilia (characteristic of CML and uncommon in other conditions) releases histamine causing pruritus and peptic ulceration. The bimodal distribution on WBC differential (myelocytes and neutrophils predominating) is characteristic."
    difficulty: medium
    tags: [CML, clinical features, splenomegaly, hematology]
  - front: "What is the first-line treatment for CML in chronic phase, and what are second/third-line options?"
    back: "First-line: Imatinib mesylate (BCR-ABL tyrosine kinase inhibitor); 2nd/3rd generation TKIs (dasatinib, nilotinib, bosutinib) can also be used as first-line.\nIf loss of response or intolerance (~40%): switch to 2nd or 3rd generation TKI (dasatinib, nilotinib, bosutinib).\nPonatinib: only for T315I mutation (resistant to other TKIs).\nInterferon-α: may improve response; now mainly used in pregnant patients.\nHydroxyurea: palliative setting to reduce WBC count.\nAllogeneic stem cell transplant: potentially curative in young patients not meeting therapeutic milestones.\n\nImatinib revolutionized CML treatment by specifically targeting the constitutively active BCR-ABL tyrosine kinase. 11-year follow-up data shows complete cytogenetic response in 83% of imatinib-treated patients with >90% overall survival in complete responders. The T315I gatekeeper mutation confers resistance to all TKIs except ponatinib."
    difficulty: medium
    tags: [CML, imatinib, TKI, treatment, hematology]
  - front: "What therapeutic milestones are used to monitor CML treatment success?"
    back: "Treatment milestones for CML monitoring:\n1. Hematologic: improved WBC and platelet counts, reduced basophils\n2. Cytogenetic: undetectable Ph chromosome in the bone marrow\n3. Molecular: reduction/absence of BCR-ABL transcripts in periphery and marrow\n\nPrognosis: patients achieving complete cytogenetic response (CCR) on imatinib by 18 months have 6-year overall survival >90%; those who do NOT achieve CCR have 6-year overall survival of 66%.\n\nResponse monitoring in CML follows a hierarchy from hematologic → cytogenetic → molecular response. Molecular monitoring by quantitative PCR for BCR-ABL transcripts is the most sensitive method. Failure to achieve milestones at defined time points (3, 6, 12, 18 months) should prompt switch of TKI."
    difficulty: medium
    tags: [CML, treatment monitoring, cytogenetic response, molecular response, hematology]
  - front: "What are the WHO 2022 diagnostic criteria for Polycythemia Vera (PV)?"
    back: "PV requires all 3 major criteria OR first 2 major + the minor criterion:\n\nMajor Criteria:\n1. Hb >165 g/L in men or >160 g/L in women, OR Hct >49% in men or >48% in women\n2. BM biopsy showing hypercellularity with trilineage growth (panmyelosis): erythroid, granulocytic, and megakaryocytic proliferation\n3. Presence of JAK2 V617F or JAK2 exon 12 mutation\n\nMinor Criterion:\n1. Serum EPO level below reference range (must have first two major criteria if using EPO level)\n\nJAK2 V617F mutation is present in >95% of PV cases. It causes constitutive activation of the JAK-STAT signaling pathway, leading to EPO-independent erythropoiesis. The low EPO level distinguishes primary (PV) from secondary polycythemia (where EPO is elevated)."
    difficulty: hard
    tags: [polycythemia vera, PV, JAK2, diagnosis, WHO criteria, hematology]
  - front: "What are the clinical features and complications of Polycythemia Vera (PV)?"
    back: "Complications from high red cell mass and hyperviscosity:\n- Thrombotic: DVT, PE, Budd-Chiari syndrome (hepatic vein thrombosis), portal vein thrombosis, stroke/TIA, MI\n- Bleeding: epistaxis, gingival bleeding, ecchymoses, GI bleeding (acquired VWD with high platelet counts)\n- Erythromelalgia: burning pain in hands/feet with erythema (pathognomonic microvascular complication in PV and ET)\n- Pruritus after warm bath/shower (40%): cutaneous mast cell degranulation and histamine release\n- PUD: histamine from tissue basophils, altered gastric mucosal blood flow\n- Gout: hyperuricemia from increased cell turnover\n- Plethora (ruddy complexion, 70%), splenomegaly (70%), hepatomegaly (40%)\n\nBudd-Chiari syndrome (hepatic vein thrombosis) should raise suspicion for an underlying MPN, especially PV. Erythromelalgia is treated with low-dose ASA. Pruritus in PV is aquagenic (triggered by water contact) and is distinct from other causes of pruritus."
    difficulty: medium
    tags: [polycythemia vera, PV, erythromelalgia, Budd-Chiari, clinical features, hematology]
  - front: "What is the treatment for Polycythemia Vera (PV)?"
    back: "1. Phlebotomy: to keep hematocrit <45% (target supported by RCT showing lower thrombotic risk)\n2. Hydroxyurea: for prior thrombosis, symptoms, severe CAD, refractory to phlebotomy, or age >60\n3. Ruxolitinib (JAK2 inhibitor): for insufficient response or intolerance to hydroxyurea\n4. Interferon-α: for cytoreduction in pregnancy\n5. Low-dose ASA: for antithrombotic prophylaxis and treatment of erythromelalgia\n6. Anticoagulation: if history of thrombosis\n7. Allopurinol: as needed for hyperuricemia\n8. Antihistamines: as needed for pruritus\n\nRCT data demonstrates that maintaining Hct <45% significantly reduces thrombotic events compared to Hct 45-50% (HR 3.91 for primary thrombotic outcomes with higher Hct). Low-dose ASA (100 mg daily) reduces thrombotic complications without significantly increasing major bleeding in PV."
    difficulty: medium
    tags: [polycythemia vera, PV, treatment, phlebotomy, hydroxyurea, hematology]
  - front: "What is Myelofibrosis and what are its characteristic blood film findings?"
    back: "Myelofibrosis (MF) is excessive BM fibrosis leading to marrow failure. Characterized by: anemia, extramedullary hematopoiesis, leukoerythroblastosis, teardrop red cells (dacrocytes) in peripheral blood, and hepatosplenomegaly.\n\nCharacteristic peripheral blood film: leukoerythroblastosis (immature RBCs and granulocytes), teardrop RBCs (dacrocytes), nucleated RBCs, variable polychromasia, large platelets, megakaryocyte fragments.\n\nNote: BM aspirate gives a 'dry tap' in up to 50% of patients.\n\nTeardrop RBCs (dacrocytes) are deformed by fibrotic marrow stroma during attempted passage into sinusoids. The leukoerythroblastic picture reflects premature release of hematopoietic precursors due to marrow failure—this pattern also suggests BM infiltration by solid tumour metastases or fibrosis."
    difficulty: medium
    tags: [myelofibrosis, teardrop RBCs, leukoerythroblastosis, peripheral blood film, hematology]
  - front: "What are the WHO 2022 major diagnostic criteria for Primary Myelofibrosis (MF)?"
    back: "Major Criteria (all 3 required):\n1. Megakaryocyte proliferation and atypia accompanied by reticulin and/or collagen fibrosis grade 2 or 3\n2. Not meeting WHO criteria for CML, PV, ET, MDS, or other myeloid neoplasm\n3. Presence of a clonal marker (JAK2, CALR, or MPL mutations); if absent, presence of another marker (ASXL1, EZH2, TET2, IDH, SRSF2, SF3B1), or absence of reactive causes of BM fibrosis\n\nMinor Criteria (≥1 required):\n1. Anemia\n2. Leukocytosis\n3. Palpable splenomegaly\n4. Increased LDH\n\nJAK2 mutation is present in ~70% of MF, CALR in ~25%, and MPL in 5-10%. Reactive BM fibrosis (from infections, autoimmune disease, granulomatous diseases) must be excluded before diagnosing primary MF. The fibrosis grade (0-3) correlates with prognosis."
    difficulty: hard
    tags: [myelofibrosis, WHO criteria, JAK2, CALR, diagnosis, hematology]
  - front: "What is the treatment for Myelofibrosis and which patients should receive allogeneic stem cell transplantation?"
    back: "Treatment options:\n- Allogeneic stem cell transplant: only potentially curative; for HIGH-risk patients (DIPSS Intermediate-2 or High risk)\n- JAK2 inhibitors: ruxolitinib, fedratinib (reduce splenomegaly and symptoms)\n- Transfusion for anemia\n- EPO: 30-50% respond\n- Androgens (e.g., danazol): anemia (<30% response rate)\n- Hydroxyurea: splenomegaly, thrombocytosis, leukocytosis, systemic symptoms\n- Interferon-α: second-line\n- Splenectomy: third-line (high morbidity/mortality)\n- Radiation for symptomatic extramedullary hematopoiesis\n\nRCT data shows ruxolitinib significantly reduces spleen volume >35% (42% vs. 0.1% placebo), improves symptoms (45% vs. 5%), and reduces mortality compared to placebo. Only allogeneic SCT offers potential cure, reserved for eligible high-risk patients given its transplant-related mortality."
    difficulty: hard
    tags: [myelofibrosis, ruxolitinib, stem cell transplant, treatment, hematology]
  - front: "What is the DIPSS Plus scoring system for Myelofibrosis prognosis?"
    back: "DIPSS Plus uses 5 clinical risk factors + karyotype + platelet count + transfusion status:\n5 Risk factors:\n1. Constitutional symptoms\n2. Age >65 years\n3. Hb <100 g/L\n4. Leukocyte count >25,000/mm³\n5. Circulating blast cells ≥1%\n\nRisk categories and mean survival:\n- Low: 185 months (~15.4 yr)\n- Intermediate-1: 78 months (~6.5 yr)\n- Intermediate-2: 35 months (~2.9 yr)\n- High: 16 months (~1.3 yr)\n\nIntermediate-2 or High risk: considered for allogeneic stem cell transplant.\n\nDIPSS Plus improves on DIPSS by incorporating adverse karyotype, platelet count <100 x 10⁹/L, and RBC transfusion need. Risk of transformation to AML is 8-10%. Early identification of high-risk patients allows timely referral for SCT evaluation."
    difficulty: hard
    tags: [myelofibrosis, DIPSS, prognosis, hematology]
  - front: "What are the WHO 2022 diagnostic criteria for Essential Thrombocythemia (ET)?"
    back: "ET diagnosis requires all 4 major criteria OR first 3 major + minor criterion:\n\nMajor Criteria:\n1. Sustained platelet count ≥450 × 10⁹/L\n2. BM biopsy showing proliferation mainly of megakaryocytic lineage with increased, enlarged, mature megakaryocytes with hyperlobulated nuclei; no significant increase or left shift of neutrophil or erythroid granulopoiesis\n3. Not meeting WHO criteria for PV, primary MF, BCR-ABL CML, MDS, or other myeloid neoplasm\n4. Presence of JAK2, CALR, or MPL mutation\n\nMinor Criterion:\n1. Presence of a clonal marker or exclusion of reactive thrombocytosis\n\nReactive thrombocytosis (from inflammation, iron deficiency, hemolytic anemia, post-splenectomy, malignancy) must be excluded before diagnosing ET. Unlike PV where JAK2 V617F predominates, ET shows more heterogeneous mutations: JAK2 (50%), CALR (30%), MPL (5-10%)."
    difficulty: hard
    tags: [essential thrombocythemia, ET, WHO criteria, JAK2, CALR, hematology]
  - front: "What are the clinical features and complications of Essential Thrombocythemia (ET)?"
    back: "ET is often asymptomatic. Clinical features:\n- Vasomotor symptoms (40%): headache, dizziness, syncope\n- Erythromelalgia: burning pain of hands and feet, dusky colour, worse with heat (caused by platelet activation → microvascular thrombosis)\n- Thrombosis (arterial and venous)\n- Bleeding: acquired VWD associated with platelets >1000 × 10⁹/L\n- Constitutional symptoms, splenomegaly\n- Pregnancy complications: increased risk of spontaneous abortion\n- Risk of transformation to AML (0.6-5%) and myelofibrosis\n\nErythromelalgia is pathognomonic microvascular thrombotic complication in both PV and ET. Paradoxically, very high platelet counts (>1000 × 10⁹/L) cause bleeding via acquired von Willebrand disease (platelets absorb large VWF multimers, depleting them from circulation)."
    difficulty: medium
    tags: [essential thrombocythemia, ET, erythromelalgia, clinical features, hematology]
  - front: "What is the treatment for Essential Thrombocythemia (ET)?"
    back: "- Low-dose ASA: for all patients without contraindications\n- Cytoreductive therapy for thrombosis or thrombotic symptoms:\n  - First-line: hydroxyurea (HU)\n  - Second-line: anagrelide or interferon-α\n- Asymptomatic 'benign' form with stable slowly rising platelet count: observation, ASA, sulfinpyrazone\n\nASA reduces thrombotic risk by inhibiting platelet cyclo-oxygenase and treating erythromelalgia. Hydroxyurea is cytoreductive first-line for high-risk ET (prior thrombosis, age >60, cardiovascular risk factors). Anagrelide selectively reduces platelet production but has more side effects (fluid retention, cardiac). Interferon-α is preferred in younger patients and pregnancy."
    difficulty: medium
    tags: [essential thrombocythemia, ET, treatment, hydroxyurea, hematology]
  - front: "What is Acute Lymphoblastic Leukemia (ALL) and how does it differ in pediatric vs. adult populations?"
    back: "ALL is a malignant disease of the BM in which early lymphoid precursors proliferate and replace normal hematopoietic cells. WHO classifies ALL by cell of origin: B-cell (precursor B lymphoblastic) or T-cell (precursor T lymphoblastic).\n\nPediatric ALL (childhood): 75% long-term remission (>5 yr); bimodal peak at age 2-5 and age 40; higher cure rates due to better chemotherapy tolerance and lower prevalence of BCR-ABL fusion gene.\n\nAdult ALL: 30-40% 5-year survival; achievement of first remission: 60-90%; Ph chromosome in ~25% of adult ALL cases (associated with chemoresistance).\n\nBCR-ABL positive ALL (Ph+ ALL) is more common in adults and confers worse prognosis due to chemoresistance. Adding TKIs (imatinib, dasatinib) to chemotherapy significantly improves outcomes in Ph+ ALL. CAR-T cell therapy targets CD19 in relapsed/refractory ALL."
    difficulty: medium
    tags: [ALL, leukemia, pediatric, BCR-ABL, hematology]
  - front: "What investigations are mandatory when evaluating a patient with suspected ALL?"
    back: "1. BM aspirate: >20% lymphoblasts with flow cytometry, cytogenetics, and molecular studies\n2. CBC: often leukocytes >100 × 10⁹/L (50%), with neutropenia, anemia, thrombocytopenia\n3. TLS screen: uric acid, K⁺, PO₄²⁻, Ca²⁺, LDH\n4. DIC screen: PT, aPTT, fibrinogen\n5. CXR: mediastinal mass (especially T-cell ALL)\n6. CT C/A/P and testicular ultrasound (extranodal disease)\n7. Mandatory lumbar puncture: to assess CNS involvement (after blasts cleared from peripheral blood with adequate platelet count and PT/PTT)\n8. Serologies: HIV, HBV, HCV, CMV antibody testing\n9. Ph chromosome testing: in ~25% of adult ALL\n\nMediastinal mass on CXR is characteristic of T-cell ALL due to thymic involvement. CNS involvement is common in ALL (rare in AML) and requires intrathecal prophylaxis/treatment. LP should be delayed until blasts are cleared from peripheral blood to avoid inadvertent CNS seeding."
    difficulty: medium
    tags: [ALL, investigations, lumbar puncture, mediastinal mass, hematology]
  - front: "What are the four phases of ALL treatment and their goals?"
    back: "1. Induction chemotherapy: induce complete remission (<5% blasts) and restore normal hematopoiesis\n2. Consolidation and/or intensification: eliminate subclinical leukemic cells\n   - Consolidation: same chemotherapy\n   - Intensification: high doses of different drugs to overcome resistance\n3. Maintenance chemotherapy: low-dose intermittent chemotherapy over prolonged period (1 year) to prevent relapse\n4. CNS prophylaxis: intrathecal or systemic methotrexate/cytarabine/dexamethasone (CNS radiation no longer used for prophylaxis)\n\nFor relapsed/refractory: CAR T-cell therapy, inotuzumab, or blinatumomab\n\nUnlike AML, maintenance chemotherapy has proven benefit in ALL (no proven benefit in AML). CNS prophylaxis is mandatory in ALL due to high rates of CNS involvement (CNS is a 'sanctuary site' protected by the blood-brain barrier from systemic chemotherapy). Radiation is avoided due to long-term neurocognitive effects."
    difficulty: medium
    tags: [ALL, treatment, induction, CNS prophylaxis, maintenance, hematology]
  - front: "What is CAR T-cell therapy and what are its current approved indications in hematology?"
    back: "CAR T-cell therapy involves: extracting the patient's own T-cells, genetically modifying them to produce Chimeric Antigen Receptors (CARs) that recognize antigens selectively presented on cancer cell surfaces (often CD19 in ALL), then reinfusing them.\n\nMost effective for:\n- Diffuse large B-cell lymphoma (DLBCL)\n- CD19-positive ALL\n\nFirst approved in Canada in 2018. Currently of limited utility for other hematologic malignancies and solid tumours.\n\nCARs consist of an extracellular antigen-binding domain (derived from antibody) fused to intracellular T-cell signaling domains. CD19 is expressed on most B-cell malignancies but not on normal stem cells, providing a therapeutic window. Cytokine release syndrome (CRS) and neurotoxicity are major adverse effects."
    difficulty: medium
    tags: [CAR T-cell, immunotherapy, ALL, DLBCL, hematology]
  - front: "What good prognostic factors are associated with ALL?"
    back: "Good prognostic factors in ALL:\n- Young age (childhood better than adult)\n- WBC <30 × 10⁹/L at presentation\n- T-cell phenotype\n- Absence of Ph chromosome (BCR-ABL negative)\n- Early attainment of complete remission\n\nPoor prognostic factors: older age, high WBC, B-cell phenotype with adverse cytogenetics, Ph chromosome positive, failure to achieve complete remission.\n\nPh chromosome (BCR-ABL) in ALL confers chemoresistance. However, adding TKIs (imatinib or dasatinib) to chemotherapy has significantly improved outcomes in Ph+ ALL. T-cell ALL paradoxically has better prognosis than B-cell ALL in adults despite presenting with high WBC and mediastinal mass."
    difficulty: medium
    tags: [ALL, prognosis, BCR-ABL, Ph chromosome, hematology]
  - front: "What mandatory initial workup must be completed for ALL hematologic malignancies before starting treatment?"
    back: "1. ALL WOMEN OF CHILDBEARING AGE: must have β-HCG (pregnancy test) before initiating any cancer treatment\n2. ALL PATIENTS: must have Hepatitis B surface antibody (HBsAb), Hepatitis B surface antigen (HBsAg), and Hepatitis B core antibody (HBcAb)—regardless of cancer diagnosis—to prevent HBV reactivation during immunosuppressive treatment\n3. All aggressive lymphoma patients: must be screened for HIV\n4. All patients: must be screened for TB risk factors\n\nHBV reactivation can be fatal during immunosuppressive chemotherapy. Even patients with 'resolved' HBV (HBcAb positive, HBsAg negative) can reactivate. Antiviral prophylaxis (entecavir) is required for HBsAg-positive patients. HIV increases risk of opportunistic infections during chemotherapy."
    difficulty: medium
    tags: [hematologic malignancy, initial workup, hepatitis B, pregnancy test, hematology]
  - front: "What genetic mutations are associated with the different myeloproliferative neoplasms?"
    back: "- CML: BCR-ABL mutation (t(9;22), Philadelphia chromosome) — diagnostic, 100%\n- Polycythemia Vera (PV): JAK2 V617F or JAK2 exon 12 — present in ~96% (JAK2 V617F ~95%)\n- Myelofibrosis (MF): JAK2 (~70%), CALR (~25%), MPL (5-10%)\n- Essential Thrombocythemia (ET): JAK2 (~50%), CALR (~30%), MPL (~5-10%)\n\nKey: BCR-ABL is specific to CML; JAK2/CALR/MPL are found in the non-CML MPNs (PV, MF, ET)\n\nJAK2 mutations cause constitutive activation of JAK-STAT signaling pathway, promoting cytokine-independent proliferation. CALR (calreticulin) mutations activate MPL (thrombopoietin receptor). Testing for BCR-ABL first excludes CML, then JAK2/CALR/MPL testing is performed for the non-CML MPNs."
    difficulty: medium
    tags: [MPN, JAK2, BCR-ABL, CALR, MPL, genetics, hematology]
  - front: "What is erythromelalgia and in which conditions is it pathognomonic?"
    back: "Erythromelalgia is a pathognomonic microvascular thrombotic complication characterized by burning pain in the hands and feet with erythema (dusky colour), usually worse with heat. It is caused by platelet activation leading to microvascular thrombosis. It is pathognomonic for Polycythemia Vera (PV) and Essential Thrombocythemia (ET), where it is associated with platelets >400 × 10⁹/L. Treatment: low-dose ASA.\n\nErythromelalgia results from platelet-mediated arteriolar inflammation and occlusion. The dramatic response to aspirin (within hours) is characteristic and can itself be diagnostic. It should not be confused with erythema in other contexts—the burning quality and ASA responsiveness are key distinguishing features."
    difficulty: easy
    tags: [erythromelalgia, PV, essential thrombocythemia, platelet, hematology]
  - front: "Why does warfarin use for VTE require overlap with heparin for 2 days, and what is the risk if this is not done?"
    back: "Warfarin has an initial PROTHROMBOTIC effect because:\n1. Protein C and S (natural anticoagulants) have shorter half-lives than procoagulant factors and are inhibited first\n2. A 10 mg loading dose of warfarin causes a precipitous decline in protein C levels, creating a hypercoagulable state\n3. Factor VII levels fall first (shortest half-life), prolonging the INR, but full antithrombotic effect requires reduction of factors IX, X, and II (~4 days)\n\nRisk without heparin overlap: warfarin-induced skin necrosis (from protein C/S depletion causing microvascular thrombosis in skin) and inadequate anticoagulation during initial period.\n\nWarfarin-induced skin necrosis is a rare but serious complication, most common in patients with protein C or S deficiency. It manifests as painful necrotic skin lesions, typically over fatty areas (breasts, buttocks, thighs). Heparin provides immediate anticoagulation coverage while waiting for the anticoagulant effect of warfarin to develop."
    difficulty: hard
    tags: [warfarin, heparin, protein C, anticoagulation, skin necrosis, hematology]
  - front: "What is the significance of basophilia in Chronic Myeloid Leukemia (CML) and what symptoms does it cause?"
    back: "Basophilia is characteristic of CML and is uncommon in other medical conditions. Increasing peripheral basophils is a feature of the ACCELERATED PHASE of CML. Basophils release histamine, causing:\n- Pruritus\n- Peptic ulcer disease (PUD)\nBasophils releasing large amounts of histamine can also rarely cause systemic symptoms. Basophilia (alongside leukocytosis) helps differentiate the leukoerythroblastic picture of CML from AML.\n\nThe presence of basophilia alongside a wide spectrum of maturing granulocytes (bimodal distribution with myelocytes and neutrophils) on CBC differential is characteristic of CML. In accelerated phase, basophils increase progressively. This contrasts with AML where basophilia is absent and blasts predominate."
    difficulty: medium
    tags: [CML, basophilia, histamine, hematology]
  - front: "What are absolute vs. relative contraindications to anticoagulant therapy?"
    back: "Absolute Contraindications:\n- Active bleeding\n- Severe bleeding diathesis or platelet count <20 × 10⁹/L (<20,000/mm³)\n- Major abdominal surgery within past 2 days\n- GI/GU bleeding within 14 days\n- Endocarditis\n\nRelative Contraindications:\n- Mild-moderate bleeding diathesis or thrombocytopenia\n- Recent major trauma\n- Recent stroke\n\nIn patients with absolute contraindications to anticoagulation who have active VTE, temporary IVC filters are an alternative to prevent PE. Once contraindications resolve, anticoagulation should be initiated promptly. The risk-benefit calculation must be individualized."
    difficulty: medium
    tags: [anticoagulation, contraindications, VTE, hematology]
  - front: "What is the approach to cancer-associated thrombosis management according to Thrombosis Canada guidelines?"
    back: "- DOACs (apixaban, edoxaban, rivaroxaban) and LMWH are effective for most cancer-associated thrombosis\n- LMWH more effective than warfarin at preventing recurrence in cancer patients\n- DOACs as effective as LMWH overall (with more bleeding observed for GI cancer patients on rivaroxaban or edoxaban)\n- Exercise caution with DOACs in: primary or metastatic brain lesions, hematological malignancies, GI/GU tumours (not well-studied)\n- Cancer-associated DVT: consider indefinite therapy while active malignancy present; usually 3-6 months post last treatment if in remission\n- Thorough review of relative risks, patient preference, and values required before prescribing\n\nThe CLOT trial established LMWH superiority over warfarin in cancer-associated thrombosis. More recent trials (Hokusai VTE Cancer, SELECT-D) demonstrated non-inferiority of DOACs with increased mucosal bleeding in GI cancers. Thromboprophylaxis (apixaban, rivaroxaban, or LMWH) is recommended for high-risk ambulatory cancer patients receiving chemotherapy."
    difficulty: hard
    tags: [cancer, VTE, DOAC, LMWH, anticoagulation, hematology]
  - front: "What is the MDS IPSS-R scoring system and what are its prognostic categories?"
    back: "IPSS-R (Revised International Prognostic Scoring System) uses 5 factors:\n1. Cytology (dysplasia)\n2. % BM blasts\n3. Hemoglobin\n4. Platelet count\n5. Absolute Neutrophil Count (ANC)\n\nPrognostic categories and mean survival:\n- Very Low: 8.7 years\n- Low: 5.3 years\n- Intermediate: 3.0 years\n- High: 1.6 years\n- Very High: 0.8 years\n\nNote: IPSS-M integrates mutational analysis for better prognostic information.\n\nIPSS-R replaced the original IPSS and provides more refined risk stratification. Cytogenetics has been expanded in IPSS-R with 5 cytogenetic risk groups. High-risk cytogenetics (partial or total loss of chromosome 7) and complex karyotype (>3 abnormalities) confer worst prognosis."
    difficulty: medium
    tags: [MDS, IPSS-R, prognosis, hematology]
  - front: "What are the key differences between AML and ALL that help distinguish them clinically and on investigations?"
    back: "AML vs. ALL distinguishing features:\n- Age: AML peak in elderly (median 65 yr, 80% of adult acute leukemia); ALL peak in children (bimodal: age 2-5 and 40)\n- Peripheral blood film: Auer rods = pathognomonic for AML (absent in ALL)\n- Mediastinal mass on CXR: ALL (especially T-cell), NOT AML\n- CNS involvement requiring prophylaxis: ALL (mandatory LP), not routine in AML\n- Maintenance chemotherapy: proven benefit in ALL, NO proven benefit in AML\n- Ph chromosome: AML rare; ALL ~25% of adults\n- DIC: high risk with APL (AML subtype); less common in ALL\n\nThe correct classification (AML vs. ALL) is critical as treatment protocols differ substantially. Immunophenotyping by flow cytometry is essential for definitive lineage determination. Auer rods immediately identify myeloid origin. The presence of a mediastinal mass in a young patient with leukemia strongly suggests T-cell ALL."
    difficulty: medium
    tags: [AML, ALL, comparison, Auer rods, mediastinal mass, hematology]
  - front: "What are the features of gingival hypertrophy in AML and what subtype is most associated with it?"
    back: "Gingival hypertrophy (gingival infiltration with leukemic blasts) is particularly associated with myelomonocytic leukemia (AML-M4 and monocytic AML-M5 in the older FAB classification). Patients may present to the dentist first before the diagnosis of leukemia is established. It results from organ infiltration by blast cells.\n\nGingival hypertrophy from leukemic infiltration is a classic MCCQE1 clinical vignette—a patient presenting to the dentist with bleeding gums and gum swelling, where the underlying diagnosis is acute myelomonocytic leukemia. Other extramedullary manifestations include leukemia cutis, hepatosplenomegaly, and CNS involvement."
    difficulty: easy
    tags: [AML, gingival hypertrophy, myelomonocytic, extramedullary, hematology]
  - front: "What is the role of non-pharmacological measures in hospital VTE prophylaxis?"
    back: "Non-pharmacological VTE prophylaxis measures:\n- Early ambulation\n- Elastic compression stockings (TEDs — thrombo-embolic deterrent stockings)\n- Intermittent pneumatic compression (IPC)\n\nPharmacological measures (LMWH preferred):\n- Enoxaparin 40 mg SC once daily, or dalteparin 5000 U SC once daily\n- Rarely: UFH 5000 IU SC BID or TID\n- DOACs for orthopedic surgery thromboprophylaxis\n- LMWH dose adjustments for patients <40 kg and >100 kg\n\nMechanical measures (TED stockings, IPC) are used when pharmacological prophylaxis is contraindicated (e.g., active bleeding). IPC is particularly useful perioperatively. Pharmacological prophylaxis should be considered for all hospitalized patients with moderate to high VTE risk without contraindications."
    difficulty: easy
    tags: [VTE prophylaxis, DVT, compression stockings, hospital, hematology]
  - front: "What organisms most commonly cause bacterial contamination of blood products, and which product has a higher overall risk?"
    back: "Gram-positive (S. aureus, S. epidermidis, B. cereus) and Gram-negative (Klebsiella, Serratia, Pseudomonas, Yersinia). Platelets have a higher risk (1/10,000) compared to RBCs (1/100,000).\n\nPlatelets are stored at room temperature, making them more susceptible to bacterial growth. Never store blood >4 hours after leaving the blood bank. Treatment: stop transfusion, blood cultures, IV antibiotics, IV fluids."
    difficulty: easy
    tags: [transfusion, bacterial contamination, blood products, hematology]
  - front: "What is the mechanism of citrate toxicity in massive transfusion, and how is it treated?"
    back: "Citrate (a blood preservative) binds free calcium (Ca2+), causing hypocalcemia signs/symptoms and worsening coagulopathy. Occurs with massive transfusion or hepatic failure (impaired citrate clearance). Treatment: IV calcium gluconate 1 g.\n\nThe liver normally metabolizes citrate rapidly. In liver disease or with massive transfusion, citrate accumulates and chelates ionized calcium. Hypocalcemia reduces cardiac contractility and worsens clotting factor function."
    difficulty: easy
    tags: [transfusion, citrate toxicity, hypocalcemia, massive transfusion, hematology]
  - front: "What is dilutional coagulopathy in massive transfusion, and how is it treated?"
    back: "Occurs with massive transfusion (>10 units pRBC). pRBC contains no coagulation factors, fibrinogen, or platelets, so large-volume transfusion dilutes these components. Treatment: fresh frozen plasma (FFP), cryoprecipitate, and platelets.\n\nMassive transfusion protocols typically include a ratio of pRBC:FFP:platelets (e.g., 1:1:1) to prevent dilutional coagulopathy. Cryoprecipitate replaces fibrinogen and factor VIII specifically."
    difficulty: easy
    tags: [transfusion, dilutional coagulopathy, massive transfusion, hematology]
  - front: "What is a delayed hemolytic transfusion reaction? When does it occur and what antigens are involved?"
    back: "Caused by alloantibodies to minor antigens (Rh, Kell, Duffy, Kidd). Antibody levels at time of transfusion are too low to detect; secondary immune stimulus increases antibody levels causing extravascular hemolysis 3-14 days post-transfusion. Presents with anemia and mild jaundice. No specific treatment required.\n\nThis is distinguished from acute hemolytic reactions (ABO incompatibility) by timing and causative antigens. Important to document for future transfusions. Serologic transfusion reactions = alloantibody development without frank hemolysis."
    difficulty: medium
    tags: [transfusion reaction, delayed hemolytic, alloantibodies, hematology]
  - front: "What is transfusion-associated graft versus host disease (TA-GvHD)? Who is at risk, when does it occur, and how is it prevented?"
    back: "Transfused donor T-lymphocytes recognize and react against the host. Occurs 4-30 days post-transfusion. At-risk patients: severely immunocompromised (e.g., Hodgkin lymphoma, leukemia). Presentation: fever, diarrhea, liver function abnormalities, pancytopenia. Prevention: irradiated blood products.\n\nUnlike GvHD from stem cell transplant, TA-GvHD affects the skin, liver, gut, and bone marrow and is often fatal. Irradiation inactivates donor T-lymphocytes, preventing their proliferation in the host."
    difficulty: medium
    tags: [transfusion reaction, GvHD, immunocompromised, irradiated blood, hematology]
  - front: "What are the approximate risks of viral transmission per unit of blood transfused in Canada?"
    back: "HBV: 1/7,000,000; HCV: 1/12,000,000; HIV: 1/20,000,000; HTLV: 1/600,000,000. Other infections include EBV, CMV, West Nile Virus.\n\nModern blood screening has dramatically reduced viral transmission risk. These figures are useful for counselling patients and for MCCQE1 questions about transfusion safety in the Canadian context."
    difficulty: easy
    tags: [transfusion, viral infection, blood safety, hematology]
  - front: "What is the mechanism of action of aspirin (ASA) as an antiplatelet agent, and how long does its effect last?"
    back: "Aspirin irreversibly acetylates COX, inhibiting thromboxane A2 (TXA2) synthesis, thereby inhibiting platelet aggregation. Effect lasts 7-10 days (lifespan of the platelet). Typical maintenance dose: 75-100 mg PO daily.\n\nBecause platelets have no nucleus, they cannot regenerate COX. New platelets must be produced to restore normal aggregation. Aspirin is indicated for stroke/MI prophylaxis and decreases mortality in post-MI patients. Contraindicated with GI ulcers."
    difficulty: easy
    tags: [antiplatelet, aspirin, ASA, COX inhibitor, hematology]
  - front: "How does clopidogrel (Plavix) work, and what is a clinically important pharmacogenomic consideration?"
    back: "Clopidogrel irreversibly inhibits ADP binding to platelets (P2Y12 receptor), decreasing platelet aggregation. It is a prodrug requiring two-step activation by CYP2C19. CYP2C19 poor metabolizers have diminished antiplatelet response. Effect lasts ~5 days.\n\nCYP2C19 polymorphisms are clinically significant — poor metabolizers may have inadequate antiplatelet effect, increasing cardiovascular risk. Caution with hepatic/renal impairment. May cause TTP (rare but serious)."
    difficulty: medium
    tags: [antiplatelet, clopidogrel, P2Y12, CYP2C19, prodrug, hematology]
  - front: "Compare ticagrelor and clopidogrel: mechanism, prodrug status, and key drug interactions."
    back: "Ticagrelor reversibly inhibits ADP binding to P2Y12 platelets. Unlike clopidogrel, it does NOT require metabolic activation (not a prodrug). Higher potency than clopidogrel. Drug-drug interactions with CYP3A4 inhibitors and inducers. Key side effect: dyspnea/shortness of breath.\n\nBecause ticagrelor is not a prodrug, its effect is more predictable across patients regardless of CYP2C19 status. The dyspnea side effect is not bronchospasm and does not require drug discontinuation in most cases."
    difficulty: medium
    tags: [antiplatelet, ticagrelor, P2Y12, hematology]
  - front: "What is the mechanism of glycoprotein IIb/IIIa (GPIIb/IIIa) inhibitors and when are they used?"
    back: "Block GPIIb/IIIa receptor, inhibiting fibrinogen and vWF binding, leading to decreased platelet aggregation. Used most commonly during cardiac catheterization. Examples: abciximab (ReoPro), eptifibatide (Integrilin). Contraindicated in PUD. Monitor aPTT/activated clotting time.\n\nGPIIb/IIIa is the final common pathway for platelet aggregation. These agents are given IV in the cardiac catheterization lab for high-risk PCI. Key side effects: hypotension, thrombocytopenia."
    difficulty: medium
    tags: [antiplatelet, GPIIb/IIIa inhibitors, abciximab, eptifibatide, hematology]
  - front: "What is the mechanism of unfractionated heparin (UFH), how is it monitored, and what are its major adverse effects?"
    back: "UFH inhibits Factor Xa and Factor IIa (thrombin), mediated via antithrombin. Monitored by aPTT (intrinsic pathway). Reversed with protamine sulfate. Major adverse effects: hemorrhage, HIT (heparin-induced thrombocytopenia), osteoporosis (long-term use). Safe in pregnancy (does not cross placenta).\n\nUFH requires aPTT monitoring to adjust dosing. HIT is a hematologic emergency characterized by paradoxical thrombosis despite thrombocytopenia. Osteoporosis occurs with prolonged use (>1 month)."
    difficulty: easy
    tags: [anticoagulant, heparin, UFH, aPTT, HIT, hematology]
  - front: "What is warfarin's mechanism, monitoring parameter, and reversal strategy? Why is it not used in pregnancy?"
    back: "Warfarin is a vitamin K antagonist inhibiting production of Factors II, VII, IX, X, and Proteins C and S. Monitored by INR (target 2-3; 2.5-3.5 for mechanical valves). Reversed by Vitamin K, PCC, FFP. NOT used in pregnancy because it crosses the placenta and is teratogenic.\n\nOnset is delayed (24-72h) because existing clotting factors must be depleted. LMWH is the preferred anticoagulant in pregnancy. Warfarin can cause cholesterol embolism syndrome as a rare complication."
    difficulty: easy
    tags: [anticoagulant, warfarin, INR, vitamin K antagonist, pregnancy, hematology]
  - front: "What are the advantages of LMWH over UFH?"
    back: "LMWH advantages: increased bioavailability, longer duration of action, subcutaneous administration, no aPTT monitoring required, fewer adverse reactions, less common HIT. However: only partially reversible with protamine sulfate and can accumulate in renal failure (CrCl <30 mL/min). Standard treatment of VTE in pregnancy and cancer patients.\n\nLMWH predominantly inhibits Factor Xa with less Factor IIa activity than UFH. Anti-Xa levels may be checked in special populations (pediatrics, extremes of weight, renal insufficiency). Examples: enoxaparin, dalteparin, tinzaparin."
    difficulty: easy
    tags: [anticoagulant, LMWH, enoxaparin, hematology]
  - front: "What is fondaparinux's mechanism, and why is it contraindicated in renal failure?"
    back: "Fondaparinux is a selective Factor Xa inhibitor mediated via antithrombin. Not reversible. Long half-life (17-21 hours). Contraindicated in renal failure because it is renally cleared, leading to drug accumulation and increased bleeding risk.\n\nFondaparinux is administered SC daily. It has no risk of HIT (no affinity for platelet factor 4). Monitoring is typically not required but no reversal agent exists."
    difficulty: medium
    tags: [anticoagulant, fondaparinux, factor Xa, renal failure, hematology]
  - front: "Which direct oral anticoagulants (DOACs) target Factor Xa vs. Factor IIa (thrombin)? What reversal agent is available for each?"
    back: "Factor Xa inhibitors: rivaroxaban, apixaban, edoxaban — reversed by andexanet alfa. Direct thrombin inhibitors: argatroban, dabigatran — dabigatran reversed by idarucizumab; argatroban not reversible.\n\nAndexanet alfa is a recombinant modified Factor Xa that binds and sequesters Factor Xa inhibitors. Idarucizumab is a monoclonal antibody fragment that binds dabigatran with high affinity. All DOACs are contraindicated with mechanical heart valves."
    difficulty: medium
    tags: [anticoagulant, DOAC, NOAC, reversal agent, idarucizumab, andexanet, hematology]
  - front: "A patient on dabigatran requires urgent surgery. What reversal agent is used, and what monitoring confirms drug presence?"
    back: "Idarucizumab (Praxbind) is the reversal agent for dabigatran; it normalizes anticoagulation within minutes. Dilute thrombin time (dTT) may be used to detect drug presence; TT is also sensitive. Dabigatran requires CrCl >30 mL/min and should be stored in original packaging.\n\nThe RE-VERSE AD trial demonstrated idarucizumab normalized test results in 88-98% of patients within minutes. Dabigatran is a direct thrombin inhibitor approved for VTE treatment (after 5-10 days parenteral therapy), VTE prevention, and stroke prophylaxis in non-valvular AFib."
    difficulty: medium
    tags: [dabigatran, idarucizumab, reversal, anticoagulant, hematology]
  - front: "What are the renal function requirements for the DOACs (rivaroxaban, apixaban, edoxaban, dabigatran)?"
    back: "Rivaroxaban: CrCl >30 mL/min; Apixaban: CrCl >25 mL/min; Edoxaban: avoid if CrCl <15 mL/min, dose reduce in renal insufficiency; Dabigatran: CrCl >30 mL/min.\n\nDOACs are renally eliminated to varying degrees. Dabigatran has the highest renal clearance (~80%) and is most affected by renal impairment. Apixaban has the least renal dependence. All are contraindicated in mechanical heart valves."
    difficulty: medium
    tags: [DOAC, renal function, rivaroxaban, apixaban, dabigatran, edoxaban, hematology]
  - front: "What is the recommended management for a supratherapeutic INR >10 without bleeding?"
    back: "Hold warfarin and administer oral vitamin K 2.5-5 mg; monitor INR more frequently and administer more vitamin K as needed; resume warfarin at a lower dose when INR returns to therapeutic range.\n\nFor INR >4.5 to 10 without bleeding: omit 1-2 doses and monitor, or omit a dose and give oral vitamin K 1-2.5 mg if increased bleeding risk. For any serious/life-threatening bleeding: hold warfarin, IV vitamin K 10 mg slow infusion PLUS four-factor prothrombin complex concentrate."
    difficulty: medium
    tags: [warfarin, supratherapeutic INR, vitamin K, anticoagulant management, hematology]
  - front: "How is a serious life-threatening bleed managed in a patient on warfarin?"
    back: "Hold warfarin. Administer IV vitamin K 10 mg by slow IV infusion plus four-factor prothrombin complex concentrate (PCC). Monitor and repeat as needed.\n\nFour-factor PCC (contains Factors II, VII, IX, X) provides immediate reversal while IV vitamin K ensures sustained reversal over hours. FFP can also be used but requires larger volumes. This applies regardless of the INR level when bleeding is serious or life-threatening."
    difficulty: medium
    tags: [warfarin reversal, PCC, vitamin K, hemorrhage, hematology]
  - front: "What are the main classes of chemotherapeutic agents and their mechanisms? List key examples."
    back: "Alkylating agents (cyclophosphamide, cisplatin): DNA damage via alkylation/crosslinking. Antimetabolites (methotrexate, 5-FU): inhibit DNA synthesis. Antibiotics (anthracyclines/adriamycin, bleomycin): interfere with DNA/RNA synthesis. Taxanes (paclitaxel): stabilize microtubules. Vinca alkaloids (vincristine, vinblastine): inhibit microtubule assembly. Topoisomerase inhibitors (irinotecan/topo I; etoposide/topo II).\n\nEach class targets different phases of cell division. Alkylating agents and antimetabolites are cell-cycle non-specific and specific, respectively. Understanding mechanisms helps predict toxicities (e.g., bleomycin → pulmonary fibrosis; anthracyclines → cardiomyopathy)."
    difficulty: medium
    tags: [chemotherapy, oncology, mechanism, hematology]
  - front: "What are the targets of the key monoclonal antibodies used in hematologic malignancies?"
    back: "Rituximab, ofatumumab, obinutuzumab: CD20 (B-cell lymphomas/CLL). Daratumumab: CD38 (multiple myeloma). Trastuzumab (Herceptin): HER2. Bevacizumab (Avastin): VEGF. Cetuximab (Erbitux): EGFR.\n\nCD20 is expressed on B cells and is absent on plasma cells, which is why anti-CD20 therapies are not effective against plasma cell disorders. Daratumumab targets CD38, which is highly expressed on myeloma cells. Obinutuzumab showed superior PFS vs. rituximab in follicular lymphoma (GALLIUM trial)."
    difficulty: medium
    tags: [monoclonal antibodies, oncology, rituximab, daratumumab, hematology]
  - front: "What are the BCR-ABL tyrosine kinase inhibitors (TKIs) used in CML, and what is the landmark trial supporting imatinib?"
    back: "BCR-ABL TKIs: imatinib (Gleevec), dasatinib, nilotinib, bosutinib (all BCR-ABL inhibitors). The IRIS trial showed imatinib achieved 83% complete cytogenetic response rate at 6 years; 10-year OS was 93% in patients with major molecular response at 18 months.\n\nImatinib was the first targeted TKI and transformed CML from a fatal to a chronic manageable disease. Second-generation TKIs (dasatinib, nilotinib) are used for resistance or intolerance. Venetoclax is a Bcl-2 inhibitor (not BCR-ABL)."
    difficulty: medium
    tags: [CML, imatinib, BCR-ABL, TKI, IRIS trial, hematology]
  - front: "What did the POLLUX trial show about daratumumab in multiple myeloma?"
    back: "POLLUX (NEJM 2016): Adding daratumumab to lenalidomide + dexamethasone in relapsed/refractory multiple myeloma significantly improved PFS (83.2% vs. 60.1% at 12 months, p<0.001) and overall response rate, but was associated with higher rates of neutropenia (51.9% vs. 37.0%).\n\nDaratumumab targets CD38 on myeloma cells. The improved PFS supports its use in combination regimens for relapsed/refractory MM. Neutropenia is the key additional toxicity to monitor."
    difficulty: hard
    tags: [multiple myeloma, daratumumab, POLLUX, clinical trial, hematology]
  - front: "What did the GALLIUM trial show, and what is the clinical implication for follicular lymphoma treatment?"
    back: "GALLIUM (NEJM 2017): Obinutuzumab-based chemotherapy resulted in significantly longer PFS than rituximab-based therapy in previously untreated advanced follicular lymphoma (3-year PFS 80.0% vs. 73.3%, HR 0.66, p=0.001), but was associated with more frequent high-grade adverse events (74.6% vs. 67.8%).\n\nObinutuzumab is a type II anti-CD20 monoclonal antibody with enhanced antibody-dependent cellular cytotoxicity compared to rituximab. The benefit must be weighed against the higher toxicity profile."
    difficulty: hard
    tags: [follicular lymphoma, obinutuzumab, rituximab, GALLIUM, clinical trial, hematology]
  - front: "What were the key findings of the TRICC trial regarding transfusion thresholds in critically ill patients?"
    back: "TRICC (NEJM 1999): In critically ill patients, a restrictive transfusion strategy (transfuse if Hb <7 g/dL, maintain 7-9 g/dL) was as effective as a liberal strategy (transfuse if Hb <10 g/dL). Among less acutely ill patients and those <55 years, mortality was significantly lower with restrictive strategy (8.7% vs. 16.1%).\n\nThis landmark Canadian trial established that restrictive transfusion is safe and may be superior in less critically ill and younger patients. It shifted practice toward avoiding unnecessary transfusions in the ICU setting."
    difficulty: medium
    tags: [transfusion, TRICC, restrictive strategy, critical care, hematology]
  - front: "What did the CRASH-2 trial demonstrate about tranexamic acid (TXA) in trauma?"
    back: "CRASH-2: Early TXA (within 3 hours of injury) significantly reduced all-cause mortality (14.5% vs. 16.0%, p=0.0035) and death from bleeding (4.9% vs. 5.7%) in bleeding trauma patients. Treatment beyond 3 hours was associated with increased risk of death from bleeding.\n\nTXA is an antifibrinolytic that inhibits plasmin activation. The 3-hour window is critical — delayed administration is not only ineffective but potentially harmful. TXA is now standard of care in trauma resuscitation when given early."
    difficulty: medium
    tags: [TXA, tranexamic acid, trauma, CRASH-2, hemorrhage, hematology]
  - front: "What did the EINSTEIN-PE trial demonstrate about rivaroxaban for pulmonary embolism treatment?"
    back: "EINSTEIN-PE (NEJM 2012): Fixed-dose rivaroxaban was non-inferior to standard therapy (enoxaparin followed by vitamin K antagonist) for acute symptomatic PE with DVT. Primary efficacy (recurrent VTE): 2.1% vs. 1.8%. Clinically relevant bleeding: 10.3% vs. 11.4% (potentially better benefit-risk profile for rivaroxaban).\n\nThis trial validated oral rivaroxaban as a single-drug approach for PE treatment, simplifying management by eliminating the need for initial parenteral therapy. Rivaroxaban must be taken with food and requires CrCl >30 mL/min."
    difficulty: hard
    tags: [rivaroxaban, pulmonary embolism, EINSTEIN-PE, VTE, hematology]
  - front: "What did the AMPLIFY trial show about apixaban for acute VTE treatment?"
    back: "AMPLIFY (NEJM 2013): Fixed-dose apixaban alone was non-inferior to conventional therapy (enoxaparin followed by warfarin) for acute VTE. Major or clinically relevant non-major bleeding was significantly less with apixaban (4.3% vs. 9.7%, RR 0.44, p<0.001).\n\nApixaban showed a significant bleeding advantage over conventional therapy while maintaining equivalent efficacy. This supports apixaban as a preferred DOAC for VTE treatment, particularly in patients at higher bleeding risk."
    difficulty: hard
    tags: [apixaban, VTE, AMPLIFY, anticoagulant, hematology]
  - front: "What did the CHOIR trial demonstrate about erythropoietin (EPO) target hemoglobin in CKD patients?"
    back: "CHOIR (NEJM 2006): In anemic CKD patients, targeting a higher Hb (13.5 g/dL) with epoetin alfa was associated with significantly more composite events (death, MI, CHF hospitalization, stroke) compared to targeting 11.3 g/dL (hazard ratio 1.34, p=0.03). Therefore, a lower Hb target is safer.\n\nThis trial led to revised guidelines recommending against targeting near-normal hemoglobin with ESAs in CKD. Current guidelines recommend target Hb of ~10-11.5 g/dL to avoid cardiovascular complications while minimizing transfusion dependence."
    difficulty: hard
    tags: [anemia, CKD, erythropoietin, CHOIR, hemoglobin target, hematology]
  - front: "What was the key finding of the CACTUS trial regarding anticoagulation for symptomatic calf DVT?"
    back: "CACTUS (Lancet Haematol 2016): In low-risk outpatients with symptomatic calf DVT (no cancer, no prior VTE), nadroparin (LMWH) was non-superior to placebo in reducing proximal extension or VTE at 6 weeks, but increased bleeding risk (4% vs. 0%). Conclusion: anticoagulation not clearly beneficial in this population.\n\nIsolated calf (distal) DVT has a lower risk of proximal propagation and PE. For low-risk patients, serial ultrasound monitoring may be preferred over anticoagulation. High-risk patients (cancer, prior VTE) still warrant anticoagulation."
    difficulty: hard
    tags: [calf DVT, distal DVT, anticoagulation, CACTUS, LMWH, hematology]
  - front: "What is CAR-T cell therapy and what target does tisagenlecleucel (Kymriah) use? What are key results from the CD19 CAR-T trial in ALL?"
    back: "CAR-T (Chimeric Antigen Receptor T-cell) therapy involves engineering autologous T cells to express a receptor targeting a tumor antigen. Tisagenlecleucel targets CD19 (B-cell antigen). In relapsed B-cell ALL: 83% complete remission rate, but median OS was 12.9 months; severe cytokine release syndrome (CRS) occurred in 26% of patients.\n\nAxicabtagene ciloleucel (Yescarta) also targets CD19. CRS is the major toxicity of CAR-T therapy, managed with tocilizumab (IL-6 receptor antagonist). Patients with high disease burden have more adverse events. CAR-T represents a paradigm shift in treating refractory hematologic malignancies."
    difficulty: hard
    tags: [CAR-T, tisagenlecleucel, CD19, ALL, cytokine release syndrome, hematology]
  - front: "What did the ibrutinib vs. ofatumumab trial (NEJM 2014) show for previously treated CLL?"
    back: "Ibrutinib (BTK inhibitor) significantly improved PFS (HR 0.22), overall survival (HR 0.43, p=0.005), and overall response rate (42.6% vs. 4.1%) compared to ofatumumab (anti-CD20) in relapsed/refractory CLL or SLL. 12-month OS: 90% ibrutinib vs. 81% ofatumumab.\n\nIbrutinib is an irreversible BTK (Bruton's tyrosine kinase) inhibitor that blocks BCR signaling critical for CLL cell survival. This trial established ibrutinib as superior to prior standard anti-CD20 therapy in relapsed CLL."
    difficulty: hard
    tags: [ibrutinib, CLL, BTK inhibitor, ofatumumab, clinical trial, hematology]
  - front: "What is the RE-VERSE AD trial, and what did it demonstrate about idarucizumab?"
    back: "RE-VERSE AD (NEJM 2015): In 90 patients with serious bleeding or requiring urgent procedures due to dabigatran, idarucizumab normalized coagulation test results in 88-98% of patients within minutes. Unbound dabigatran concentrations remained <20 ng/mL at 24 hours in 79% of patients. Conclusion: dabigatran's anticoagulant effect is completely reversed by idarucizumab within minutes.\n\nIdarucizumab (Praxbind) is a humanized monoclonal antibody fragment with 350-fold higher affinity for dabigatran than thrombin. It is given as two 2.5 g IV bolus doses (5 g total). This allows urgent surgery or management of life-threatening bleeding in dabigatran-treated patients."
    difficulty: hard
    tags: [idarucizumab, dabigatran, RE-VERSE AD, reversal, clinical trial, hematology]
  - front: "What is iron overload as a delayed transfusion reaction? Who is at risk and how is it managed?"
    back: "Iron overload results from repeated transfusions over a long period (e.g., beta-thalassemia major). Can cause secondary hemochromatosis with organ damage (liver, heart, endocrine glands). Treatment: iron chelation therapy (e.g., deferoxamine, deferasirox) or phlebotomy if the patient no longer requires transfusions and is not anemic.\n\nEach unit of pRBC contains approximately 200-250 mg of iron. Patients requiring chronic transfusion (thalassemia, myelodysplastic syndrome) accumulate iron as the body has no physiologic mechanism for iron excretion. Chelation prevents end-organ damage."
    difficulty: medium
    tags: [iron overload, transfusion, thalassemia, hemochromatosis, chelation, hematology]
  - front: "What is the significance of transfusion-associated hyperkalemia, and who is most at risk?"
    back: "Stored RBCs release potassium (K+) over time. Risk increases with storage duration and blood irradiation; decreases with fresh blood. Occurs in ~5% of massively transfused patients. Treatment: manage per hyperkalemia protocol (see Nephrology). At highest risk: neonates, patients with renal failure, massive transfusion recipients.\n\nDuring storage, RBCs leak intracellular K+ into the plasma. Irradiation accelerates K+ release. In massive transfusion or neonates (small volume of distribution), this can cause life-threatening hyperkalemia and cardiac arrhythmias."
    difficulty: medium
    tags: [transfusion, hyperkalemia, stored blood, massive transfusion, hematology]
  - front: "What are the indications, contraindications, and key monitoring parameter for rivaroxaban?"
    back: "Indications: acute VTE treatment, secondary VTE prevention, orthopedic thromboprophylaxis, stroke prophylaxis in non-valvular AFib. Contraindications: mechanical heart valves, CrCl <30 mL/min. Must be taken with food. Monitoring: Anti-Xa levels (validated for rivaroxaban, used to detect drug presence only — not for dose adjustment). Reversal: andexanet alfa.\n\nRivaroxaban's food requirement increases bioavailability from 66% to ~100% for the 20 mg dose. Andexanet alfa is a recombinant modified factor Xa decoy that reverses all factor Xa inhibitors. Key side effects: GI hemorrhage, menorrhagia."
    difficulty: medium
    tags: [rivaroxaban, DOAC, factor Xa, anticoagulant, hematology]
