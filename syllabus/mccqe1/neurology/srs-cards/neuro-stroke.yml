# Stroke & TIA (Neurology) - generated from srs-mccqe1
cards:
  - front: "A 68-year-old has sudden onset right-sided weakness and aphasia for 2 hours. NIHSS 14. Non-contrast CT head is normal. What is the diagnosis and time-sensitive treatment?"
    back: "Acute ischemic stroke; eligible for IV tPA (alteplase 0.9 mg/kg, max 90mg) within 4.5 hours of symptom onset — also assess for large vessel occlusion and EVT candidacy\n\nHeart and Stroke/Canadian Stroke Best Practice guidelines recommend IV tPA for eligible acute ischemic stroke within 4.5h. Endovascular thrombectomy (EVT) for LVO (large vessel occlusion) within 6-24h with salvageable tissue. Time is brain: 1.9 million neurons die per minute during stroke."
    difficulty: hard
    tags: [acute ischemic stroke, tPA, alteplase, EVT, neurology]
  - front: "What are the absolute contraindications to IV tPA for acute ischemic stroke?"
    back: "Active internal bleeding, prior intracranial hemorrhage, intracranial neoplasm/AVM, BP >185/110 (must be controlled first), recent surgery within 14 days, blood glucose <2.8 or >22.2 mmol/L, INR >1.7, platelet count <100,000\n\nCanadian Stroke Best Practice guidelines provide comprehensive inclusion/exclusion criteria for tPA. Key contraindications: NIHSS must be ≥4 (or disabling symptoms), known CT hemorrhage, BP >185/110 before lysis. Anticoagulation is a contraindication if INR >1.7 or NOAC taken within 48h."
    difficulty: hard
    tags: [tPA contraindications, acute ischemic stroke, alteplase, neurology]
  - front: "What is the NIHSS and what score indicates moderate to severe stroke?"
    back: "NIH Stroke Scale: 11-item neurological assessment; 0=normal; 1-4=minor; 5-15=moderate; 16-20=moderate-severe; 21-42=severe — scores guide treatment eligibility and prognosis\n\nNIHSS assesses: level of consciousness, gaze, visual fields, facial palsy, arm/leg motor, limb ataxia, sensory, language, dysarthria, extinction. Higher NIHSS predicts worse outcome. EVT benefit demonstrated in NIHSS ≥6 with LVO."
    difficulty: easy
    tags: [NIHSS, stroke severity, stroke assessment, neurology]
  - front: "What is a TIA and how should it be evaluated urgently?"
    back: "TIA: transient neurological deficit (usually <1h) without infarction on MRI; evaluate within 24h: brain MRI, vascular imaging (CTA head/neck), cardiac monitoring (ECG, Holter), echocardiography, lipids, HbA1c — start antiplatelet and statin immediately\n\nABCD2 score predicts early stroke risk after TIA. Canadian Stroke guidelines recommend TIA be treated as a medical emergency with same-day neurovascular evaluation. Short-term dual antiplatelet (ASA + clopidogrel) for 21 days for high-risk TIA reduces early stroke risk."
    difficulty: hard
    tags: [TIA, transient ischemic attack, ABCD2 score, urgent evaluation, neurology]
  - front: "What is the most common cause of ischemic stroke?"
    back: "Cardioembolic (most common, especially AF — 20%), large artery atherosclerosis (15%), small vessel disease/lacunar (25%), cryptogenic (25%), other determined etiology (5%)\n\nTOAST classification of stroke subtypes guides investigation and secondary prevention. AF is the most common modifiable cause. All stroke patients require ECG; 30-day Holter monitoring in cryptogenic stroke to detect paroxysmal AF. Echocardiography to detect cardioembolic source."
    difficulty: easy
    tags: [ischemic stroke etiology, cardioembolic, AF, TOAST classification, neurology]
  - front: "What are the clinical features of a cerebellar stroke vs. brainstem stroke?"
    back: "Cerebellar: ataxia, dysmetria, nausea/vomiting, headache, ipsilateral limb ataxia, nystagmus; Brainstem: diplopia, dysphagia, dysarthria, contralateral weakness but ipsilateral cranial nerve palsy (crossed signs)\n\nPosterior circulation strokes may be missed on initial CT (posterior fossa poorly visualized). MRI DWI is the gold standard for early detection. Lateral medullary (Wallenberg) syndrome: ipsilateral face and contralateral body pain/temperature loss."
    difficulty: hard
    tags: [cerebellar stroke, brainstem stroke, posterior circulation, Wallenberg, neurology]
  - front: "What is the secondary prevention strategy for ischemic stroke or TIA in non-AF patients?"
    back: "ASA 80-325mg + clopidogrel 75mg (dual antiplatelet) for 21 days then monotherapy; or clopidogrel monotherapy long-term; high-intensity statin; treat hypertension; manage other risk factors\n\nCanadian Stroke Best Practice guidelines: POINT and CHANCE trials support short-term DAPT (21 days) for high-risk TIA or minor ischemic stroke. Long-term antiplatelet monotherapy (ASA or clopidogrel) for secondary prevention. LDL target <1.8 mmol/L with high-intensity statin."
    difficulty: medium
    tags: [secondary prevention, TIA, stroke, dual antiplatelet, statin, neurology]
  - front: "How should BP be managed in acute ischemic stroke?"
    back: "Generally do NOT lower BP in first 24h unless extremely elevated (>220/120) or tPA given (target <185/110 before tPA, <180/105 after); avoid hypotension (worsens ischemia)\n\nCerebrovascular autoregulation is impaired in acute stroke. Permissive hypertension maintains penumbral perfusion. If tPA is given, strict BP control is required to reduce hemorrhagic transformation. After 24-48h, begin antihypertensive therapy for long-term secondary prevention."
    difficulty: hard
    tags: [acute stroke BP management, permissive hypertension, tPA, neurology]
  - front: "A patient has right MCA territory ischemic stroke. After 12h, NIHSS worsens. Repeat CT shows hemorrhagic transformation. What happened and what is the management?"
    back: "Hemorrhagic transformation (HT) — complication of reperfusion, tPA, or anticoagulation; manage: reverse anticoagulation if applicable, manage BP, neurosurgery consultation for large hemorrhages, avoid antiplatelets for 24h post-HT\n\nHT occurs in 5-10% of ischemic strokes and in higher rates after tPA. Significant HT (hemorrhagic infarction type 2, parenchymal hematoma): may require immediate reversal of tPA (cryoprecipitate for fibrinogen). ICP management with head-of-bed 30°, osmotic therapy."
    difficulty: hard
    tags: [hemorrhagic transformation, tPA complication, anticoagulation reversal, neurology, stroke complication]
  - front: "What is the role of anticoagulation in AF-related stroke and when should it be started?"
    back: "Start DOAC (apixaban, rivaroxaban, dabigatran, or edoxaban) for AF-related stroke — timing: minor stroke/TIA: start within 24-48h; major stroke: delay 5-14 days due to hemorrhagic transformation risk (1-3-6-12 rule)\n\nCanadian Stroke Best Practice guidelines: the 1-3-6-12 day rule guides anticoagulation timing based on stroke size: TIA (1 day), minor stroke (3 days), moderate stroke (6 days), severe stroke (12 days). DOACs are preferred over warfarin for non-valvular AF."
    difficulty: hard
    tags: [AF stroke, anticoagulation, DOAC timing, atrial fibrillation, neurology]
  - front: "What are the clinical criteria for lacunar stroke syndromes?"
    back: "Pure motor hemiplegia (internal capsule/pons), pure sensory stroke (thalamus), ataxic hemiparesis, dysarthria-clumsy hand — small subcortical infarct <1.5cm, no cortical features\n\nLacunar strokes result from small vessel (perforating artery) disease in hypertension or diabetes. CT may be normal; MRI DWI identifies small infarcts. Treatment: risk factor modification (BP, diabetes), antiplatelet therapy, statin."
    difficulty: medium
    tags: [lacunar stroke, small vessel disease, pure motor hemiplegia, hypertension, neurology]
  - front: "What is malignant MCA syndrome and how is it managed?"
    back: "Malignant MCA stroke: large hemispheric infarct with cerebral edema and herniation; decompressive hemicraniectomy within 48h in patients ≤60 years reduces mortality from 80% to 30%\n\nHAMLET, DESTINY, and DECIMAL trials showed hemicraniectomy benefit in malignant MCA stroke. Patient and family must be counselled: surgery reduces mortality but survivors often have significant disability. Age and premorbid function are important considerations."
    difficulty: hard
    tags: [malignant MCA syndrome, hemicraniectomy, cerebral edema, herniation, neurology]
  - front: "A 70-year-old on warfarin (INR 3.4) presents with sudden headache and right-sided weakness. CT shows left thalamic hemorrhage. What is the immediate management?"
    back: "Reverse anticoagulation urgently: IV 4-factor PCC (Octaplex) + IV vitamin K; target INR <1.4; control BP; neurosurgery consultation; do NOT give FFP as first-line (too slow, volume)\n\nIntracerebral hemorrhage (ICH) on warfarin: 4-factor PCC reverses INR within minutes vs. hours for FFP. Target INR <1.4 rapidly. BP control (target SBP <140 mmHg per INTERACT2) reduces hematoma expansion."
    difficulty: hard
    tags: [intracerebral hemorrhage, warfarin reversal, PCC, anticoagulation reversal, neurology]
  - front: "What are the features of subarachnoid hemorrhage (SAH) and how is it diagnosed?"
    back: "Thunderclap headache (\"worst headache of life\") reaching maximum intensity within 1-2 seconds; diagnose with non-contrast CT head (90% sensitive in 6h), then LP for xanthochromia if CT negative\n\nSAH from ruptured aneurysm has 30-day mortality ~50%. Non-contrast CT: sensitivity 98% if done within 6h (degrades to 85% by 24h). Xanthochromia develops 12h after bleed and persists for 14 days. CTA of circle of Willis to identify aneurysm."
    difficulty: hard
    tags: [subarachnoid hemorrhage, SAH, thunderclap headache, xanthochromia, CT head, neurology]
  - front: "A 55-year-old with SAH is admitted. On day 7, she develops new focal deficits and a worsening headache. What complication occurred?"
    back: "Cerebral vasospasm — common complication of SAH days 4-14; diagnose with TCD (transcranial Doppler) or CTA; treat with nimodipine (calcium channel blocker) prophylactically\n\nNimodipine 60 mg q4h x21 days is standard prophylaxis for all SAH patients, reducing vasospasm and neurological deficits. Triple-H therapy (hypertension, hypervolemia, hemodilution) for symptomatic vasospasm — now replaced by induced hypertension alone. Endovascular angioplasty for refractory vasospasm."
    difficulty: hard
    tags: [cerebral vasospasm, SAH complication, nimodipine, vasospasm treatment, neurology]
  - front: "What is a hemorrhagic stroke and what are the main causes?"
    back: "Hemorrhagic stroke includes: intracerebral hemorrhage (ICH, 10%) and subarachnoid hemorrhage (SAH, 5%); ICH causes: hypertension (most common, basal ganglia/thalamus/pons), amyloid angiopathy (elderly, lobar), coagulopathy, AVMs\n\nHypertensive ICH: deep locations (basal ganglia, thalamus, pons, cerebellum). Amyloid angiopathy: lobar, recurrent bleeds, elderly. Management: reverse coagulopathy, control BP (SBP target 130-140), neurosurgery for cerebellar hemorrhage >3cm or obstructive hydrocephalus."
    difficulty: medium
    tags: [intracerebral hemorrhage, SAH, hemorrhagic stroke, hypertension, amyloid angiopathy, neurology]
  - front: "What investigations are required in the workup of a young patient (<50) with ischemic stroke?"
    back: "Cardiac: ECG, echocardiogram, prolonged Holter; Vascular: CTA head/neck; Blood: CBC, coagulation, lipids, HbA1c; Thrombophilia panel; MRI brain with DWI; Consider: TOE, hypercoagulable workup, vasculitis screen, drug screen\n\nCryptogenic stroke in the young requires extensive workup. PFO (patent foramen ovale) is present in 25-40% of cryptogenic strokes in the young. RESPECT and CLOSE trials support PFO closure in selected patients. Dissection is a common cause in young adults."
    difficulty: hard
    tags: [young stroke workup, cryptogenic stroke, PFO, thrombophilia, neurology]
  - front: "What is the role of endovascular thrombectomy (EVT) in acute stroke?"
    back: "EVT for LVO (large vessel occlusion: ICA, MCA M1, basilar artery) with ischemic core <70 mL within 6-24 hours — reduces disability and mortality in eligible patients\n\nDAWN and DEFUSE-3 trials extended EVT window to 24h for selected patients with LVO and mismatch imaging. EVT plus tPA is superior to tPA alone. Canadian Stroke Best Practice: all eligible LVO patients should be transferred to a comprehensive stroke centre for EVT."
    difficulty: hard
    tags: [EVT, endovascular thrombectomy, large vessel occlusion, LVO, acute stroke treatment, neurology]
  - front: "What are the modifiable risk factors for stroke and their relative risk contribution?"
    back: "Hypertension (35% population attributable risk), AF, smoking, dyslipidemia, diabetes, physical inactivity, obesity, alcohol, carotid stenosis, cardiac diseases\n\nINTERSTROKE study identified 10 modifiable risk factors accounting for >90% of stroke risk. Hypertension is the single most important modifiable risk factor. Canadian Stroke guidelines recommend comprehensive risk factor management for primary and secondary prevention."
    difficulty: easy
    tags: [stroke risk factors, hypertension, atrial fibrillation, smoking, neurology]
  - front: "What is post-stroke depression and what are the consequences if untreated?"
    back: "Post-stroke depression occurs in 30-40% of stroke survivors; associated with worse functional recovery, increased mortality, poor rehabilitation adherence; screen with PHQ-9; treat with SSRIs (sertraline, escitalopram)\n\nCanadian Stroke Best Practice guidelines recommend routine screening for post-stroke depression and cognitive impairment. SSRIs reduce post-stroke depression and may have neuroprotective effects. Integrated rehabilitation with psychological support improves outcomes."
    difficulty: medium
    tags: [post-stroke depression, PHQ-9, SSRI, stroke rehabilitation, neurology]
  - front: "What is NIHSS and when is tPA indicated for stroke?"
    back: "NIHSS measures stroke severity (0-42). tPA (alteplase) within 4.5h of symptom onset if no contraindications\n\nContraindications: active bleeding, recent surgery, BP>185/110, plt<100k. Tenecteplase emerging alternative. Thrombectomy for LVO up to 24h."
    difficulty: hard
    tags: [stroke, tPA, NIHSS]
  - front: "What are the components of the NIHSS and the maximum score?"
    back: "The NIHSS has 11 items (level of consciousness, gaze, visual fields, facial palsy, motor arm, motor leg, limb ataxia, sensory, language, dysarthria, extinction/inattention) with a maximum score of 42.\n\nThe NIHSS is the standard acute stroke severity scale used in Canadian Stroke Best Practice Recommendations. Scores >25 indicate severe stroke with high mortality risk. Serial NIHSS measurements guide thrombolysis eligibility and post-treatment monitoring."
    difficulty: hard
    tags: [NIHSS, stroke, assessment, neurology]
  - front: "What is the time window for IV alteplase (tPA) in acute ischemic stroke and the standard dose?"
    back: "IV alteplase 0.9 mg/kg (max 90 mg), 10% as bolus and remainder over 60 min, within 4.5 hours of symptom onset.\n\nCanadian Stroke Best Practice Recommendations endorse IV alteplase within 4.5 hours. Extended criteria (age >80, NIHSS >25, oral anticoagulant use, history of both stroke and diabetes) may exclude patients in the 3-4.5 hour window. BP must be <185/110 before administration."
    difficulty: hard
    tags: [tPA, alteplase, thrombolysis, stroke, neurology]
  - front: "What are the absolute contraindications to IV alteplase in acute stroke?"
    back: "Active internal bleeding, recent intracranial surgery/trauma (<3 months), intracranial hemorrhage on CT, platelet count <100,000, INR >1.7, aPTT elevated, BP >185/110 despite treatment.\n\nThese contraindications are from the Canadian Stroke Best Practice Recommendations and AHA/ASA guidelines. Any ICH on baseline CT is an absolute exclusion. Patients on DOACs with recent doses may also be excluded unless drug-specific reversal is available."
    difficulty: hard
    tags: [tPA, contraindications, stroke, neurology]
  - front: "A patient presents 6 hours after stroke onset with NIHSS 14 and large vessel occlusion on CTA. What intervention is indicated?"
    back: "Endovascular thrombectomy (EVT) with mechanical thrombectomy, eligible up to 24 hours with favorable perfusion imaging.\n\nCanadian Stroke Best Practice Recommendations endorse EVT for large vessel occlusion (ICA, M1 MCA) up to 24 hours when CT perfusion shows salvageable tissue (per DAWN and DEFUSE-3 trials). Combined with IV tPA if within the 4.5-hour window."
    difficulty: hard
    tags: [thrombectomy, EVT, large vessel occlusion, stroke, neurology]
  - front: "What is the recommended antiplatelet regimen for secondary stroke prevention after minor stroke or TIA?"
    back: "Dual antiplatelet therapy (ASA + clopidogrel) for 21 days starting within 24 hours, then single antiplatelet long-term.\n\nCHANCE and POINT trials demonstrated that short-term DAPT reduces recurrent stroke after minor stroke (NIHSS <=3) or high-risk TIA. Canadian Stroke Best Practice Recommendations adopted 21-day DAPT. Long-term DAPT is not recommended due to increased bleeding risk."
    difficulty: hard
    tags: [DAPT, antiplatelet, secondary prevention, stroke, neurology]
  - front: "What blood pressure targets are recommended in the first 24 hours after acute ischemic stroke with and without thrombolysis?"
    back: "With thrombolysis: <180/105 for 24 hours post-tPA. Without thrombolysis: permissive hypertension, only treat if >220/120.\n\nCanadian Stroke Best Practice Recommendations advise against aggressive BP lowering in acute ischemic stroke to maintain cerebral perfusion. Post-tPA strict control prevents hemorrhagic transformation. Labetalol and nicardipine IV are preferred agents."
    difficulty: hard
    tags: [blood pressure, stroke management, neurology]
  - front: "What is the ABCD2 score and how does it stratify TIA risk?"
    back: "ABCD2: Age >=60 (1pt), BP >=140/90 (1pt), Clinical features-unilateral weakness (2pt) or speech only (1pt), Duration >=60min (2pt) or 10-59min (1pt), Diabetes (1pt). Score 0-3 low risk, 4-5 moderate, 6-7 high risk.\n\nThe ABCD2 score predicts 2-day stroke risk after TIA. Canadian guidelines recommend urgent investigation (within 24h) for ABCD2 >=4 or crescendo TIA. Carotid imaging and ECG should be obtained for all TIA patients regardless of score."
    difficulty: medium
    tags: [ABCD2, TIA, risk stratification, neurology]
  - front: "When is carotid endarterectomy (CEA) indicated after ischemic stroke or TIA?"
    back: "CEA is indicated for symptomatic carotid stenosis 70-99% (NASCET criteria). Moderate benefit for 50-69%. Should be performed within 2 weeks of the index event.\n\nCanadian Stroke Best Practice Recommendations emphasize early CEA within 14 days of symptomatic event for maximal benefit (NNT of 6 for 70-99% stenosis). Carotid stenting is an alternative when surgical risk is high or anatomy is unfavorable."
    difficulty: hard
    tags: [CEA, carotid stenosis, stroke prevention, neurology]
  - front: "What is the Bamford (OCSP) classification of ischemic stroke?"
    back: "TACI (total anterior circulation infarct): all 3 of motor/sensory deficit, homonymous hemianopia, higher cortical dysfunction. PACI: 2 of 3. LACI: pure motor, pure sensory, ataxic hemiparesis, or dysarthria-clumsy hand. POCI: brainstem/cerebellar/occipital signs.\n\nThe Oxford/Bamford classification predicts prognosis and likely vessel territory without imaging. TACI has worst prognosis (~60% dependent or dead at 1 year). LACI indicates small vessel disease with better outcomes."
    difficulty: medium
    tags: [OCSP, Bamford, stroke classification, neurology]
  - front: "What are the signs of a posterior circulation stroke?"
    back: "Vertigo, diplopia, dysarthria, dysphagia, ataxia, crossed deficits (ipsilateral cranial nerve + contralateral motor/sensory), Horner syndrome, nystagmus, visual field defects.\n\nPosterior circulation strokes are frequently missed as symptoms overlap with benign conditions. The HINTS exam (Head Impulse, Nystagmus, Test of Skew) differentiates central from peripheral causes with sensitivity >97% for stroke."
    difficulty: hard
    tags: [posterior circulation, vertebrobasilar, stroke, neurology]
  - front: "What is the management of acute hemorrhagic stroke with elevated BP?"
    back: "Target SBP <140 mmHg within 1 hour using IV nicardipine, labetalol, or clevidipine infusion. Reverse anticoagulation if applicable (vitamin K + PCC for warfarin, idarucizumab for dabigatran).\n\nCanadian Stroke Best Practice Recommendations and INTERACT2 trial support rapid BP lowering to <140 systolic in ICH. PCC is preferred over FFP for warfarin reversal due to faster onset. Platelet transfusion is NOT recommended for antiplatelet-associated ICH."
    difficulty: hard
    tags: [ICH, hemorrhagic stroke, blood pressure, neurology]
  - front: "What are the indications for decompressive craniectomy in ischemic stroke?"
    back: "Malignant MCA infarction in patients <=60 years old, deteriorating level of consciousness, performed within 48 hours of onset. Reduces mortality from 78% to 29%.\n\nDECIMAL, DESTINY, and HAMLET trials demonstrated mortality benefit. Canadian guidelines support this in patients <=60. In patients >60, benefit exists but with higher rates of severe disability (mRS 4-5)."
    difficulty: hard
    tags: [craniectomy, malignant MCA, stroke, neurology]
  - front: "How does atrial fibrillation-related stroke prevention differ from other stroke etiologies?"
    back: "AF-related stroke requires anticoagulation (DOACs preferred over warfarin per CCS guidelines) rather than antiplatelets. Use CHA2DS2-VASc to determine need. Initiate anticoagulation within 1-14 days after stroke depending on size.\n\nCCS AF guidelines recommend DOACs as first-line over warfarin. The 1-3-6-12 day rule guides anticoagulation timing: TIA (day 1), small stroke (day 3), moderate (day 6), large/hemorrhagic conversion risk (day 12+)."
    difficulty: hard
    tags: [atrial fibrillation, anticoagulation, DOAC, stroke, neurology]
  - front: "What is the role of CT perfusion imaging in acute stroke decision-making?"
    back: "CT perfusion identifies ischemic core (CBF <30%) vs penumbra (Tmax >6s). A mismatch ratio >=1.8 with ischemic core <70mL supports EVT up to 24 hours from onset.\n\nDAWN and DEFUSE-3 trials established CT perfusion criteria for late-window thrombectomy. Automated software (RAPID) is used in Canadian stroke centres. This extends treatment to patients with unknown onset or wake-up strokes."
    difficulty: hard
    tags: [CT perfusion, penumbra, EVT, stroke imaging, neurology]
  - front: "What are the recommended lipid targets for secondary stroke prevention?"
    back: "LDL <1.8 mmol/L (or >50% reduction from baseline) using high-intensity statin therapy. Consider adding ezetimibe or PCSK9 inhibitor if target not achieved.\n\nCanadian Stroke Best Practice Recommendations align with CCS dyslipidemia guidelines for high-risk vascular patients. SPARCL trial demonstrated atorvastatin 80mg reduced recurrent stroke by 16%. Statins should be initiated during hospital admission."
    difficulty: hard
    tags: [statin, LDL, lipid targets, stroke prevention, neurology]
  - front: "What is the TIA workup and risk stratification?"
    back: "ABCD2 score: Age>=60(1), BP>=140/90(1), Clinical (unilateral weakness=2, speech only=1), Duration (>=60min=2, 10-59=1), Diabetes(1). Score>=4 = high risk. Urgent imaging, vascular, and cardiac workup\n\nAll TIA patients: CT/MRI brain, carotid imaging (US or CTA), ECG, Holter, echocardiogram, bloodwork. Dual antiplatelet (ASA+clopidogrel) for 21 days if minor stroke/high-risk TIA (CHANCE/POINT trials)."
    difficulty: hard
    tags: [TIA, ABCD2, workup]
  - front: "What are the contraindications to IV tPA for acute ischemic stroke?"
    back: "Absolute: active internal bleeding, recent (3mo) intracranial surgery/stroke/head trauma, intracranial neoplasm, BP>185/110 despite treatment, platelets<100k, INR>1.7, glucose<50\n\nTime window: 0-4.5h. Extended window contraindications (3-4.5h): age>80, NIHSS>25, oral anticoagulants, DM+prior stroke. Thrombectomy for LVO up to 24h (DAWN/DEFUSE-3 criteria)."
    difficulty: hard
    tags: [tPA, contraindications, stroke]
  - front: "What is the secondary prevention regimen after ischemic stroke?"
    back: "Antiplatelet (ASA or clopidogrel), statin (high-intensity atorvastatin 80mg), BP control (<130/80), lifestyle modification. If AF: anticoagulation (DOAC preferred over warfarin)\n\nCarotid endarterectomy if symptomatic 70-99% stenosis (within 2 weeks of event). Stenting alternative if surgically high-risk. PFO closure for cryptogenic stroke in young patients (RESPECT/CLOSE trials)."
    difficulty: medium
    tags: [stroke, secondary prevention]
  - front: "What are the goals and components of stroke rehabilitation?"
    back: "Start within 24-48h if stable. Goals: maximize function, prevent complications. Components: PT (mobility/gait), OT (ADLs), SLP (swallowing/aphasia), neuropsych, social work. Early mobilization reduces complications\n\nCanadian Stroke Best Practice guidelines. Intensity: minimum 3h/day of task-specific therapy. Spasticity management: stretching, botulinum toxin, baclofen. Depression screening — post-stroke depression in 30%."
    difficulty: medium
    tags: [stroke, rehabilitation]
  - front: "What are the features of posterior circulation stroke?"
    back: "Vertigo, diplopia, dysarthria, ataxia, crossed deficits (ipsilateral face + contralateral body), Horner syndrome, dysphagia. Wallenberg (lateral medullary) is classic\n\nPosterior strokes often misdiagnosed as peripheral vertigo. HINTS exam differentiates: Head Impulse normal, Nystagmus direction-changing, Test of Skew positive = central cause. Basilar occlusion: locked-in syndrome."
    difficulty: hard
    tags: [stroke, posterior circulation]
  - front: "What is the management of intracerebral hemorrhage?"
    back: "BP control (SBP target <140 per INTERACT2), reverse anticoagulation if applicable, neurosurgical consult for cerebellar hemorrhage or hydrocephalus, ICP management, avoid antiplatelet/anticoagulant for acute period\n\nICH score predicts mortality: GCS, ICH volume, IVH, infratentorial, age. Surgical evacuation: cerebellar hemorrhage >3cm or causing brainstem compression. Minimally invasive surgery (MISTIE III) emerging."
    difficulty: hard
    tags: [ICH, hemorrhagic stroke]
  - front: "What clinical features suggest a posterior circulation stroke rather than anterior circulation?"
    back: "Vertigo, diplopia, dysarthria, dysphagia, ataxia, crossed findings (ipsilateral cranial nerve + contralateral motor/sensory), bilateral motor/sensory deficits, homonymous hemianopia, nystagmus, Horner syndrome, and decreased consciousness.\n\nPosterior circulation strokes account for ~20% of ischemic strokes and are frequently misdiagnosed as peripheral vertigo. The HINTS exam (Head Impulse, Nystagmus, Test of Skew) differentiates central from peripheral causes at the bedside. Canadian Stroke Best Practices emphasize urgent imaging."
    difficulty: medium
    tags: [posterior-circulation, stroke, vertebrobasilar, HINTS, clinical-features]
  - front: "List 5 common stroke mimics and a distinguishing feature of each."
    back: "1) Hypoglycemia: resolves with glucose. 2) Todd's paralysis: follows witnessed seizure, resolves <24h. 3) Migraine with aura: gradual symptom march, headache history. 4) Conversion disorder: inconsistent exam, Hoover sign. 5) Brain tumor: subacute progression, papilledema.\n\nStroke mimics account for up to 30% of acute presentations. Hypoglycemia must be excluded before thrombolysis (bedside glucose mandatory). MRI with DWI has highest sensitivity for distinguishing true stroke from mimics."
    difficulty: medium
    tags: [stroke-mimics, differential-diagnosis, Todd-paralysis, hypoglycemia, MRI]
  - front: "What is the acute management of spontaneous ICH with SBP 210 mmHg?"
    back: "Rapid BP lowering to SBP 140 mmHg within 1 hour using IV labetalol or nicardipine. Reverse anticoagulation if applicable. Head of bed 30 degrees. Neurosurgical consultation. VTE prophylaxis with pneumatic compression devices initially.\n\nINTERACT2 and ATACH-2 trials inform current targets. Canadian Stroke Best Practices recommend SBP 140 for ICH presenting with SBP 150-220. Overly aggressive lowering below 130 may worsen outcomes. CTA spot sign predicts hematoma expansion."
    difficulty: hard
    tags: [ICH, BP-management, hematoma, labetalol, neurosurgery]
  - front: "What are the components of the ICH Score and how does it predict 30-day mortality?"
    back: "ICH Score (0-6): GCS 3-4 (2pts), 5-12 (1pt), 13-15 (0pt); ICH volume >=30mL (1pt); IVH present (1pt); infratentorial (1pt); age >=80 (1pt). 30-day mortality: 0=0%, 1=13%, 2=26%, 3=72%, 4=97%, 5-6=100%.\n\nThe ICH Score is the most validated prognostic tool for spontaneous ICH. Hematoma volume is estimated using ABC/2 method on CT. Canadian Stroke Best Practices recommend against early DNR orders based solely on prognostic scores."
    difficulty: hard
    tags: [ICH-score, prognosis, mortality, GCS, hematoma-volume]
  - front: "A patient presents with thunderclap headache and CT head is negative. What is the next step?"
    back: "Lumbar puncture at least 6 hours (ideally 12) after onset to look for xanthochromia and elevated RBCs. If LP negative, consider CTA to evaluate for unruptured aneurysm or RCVS.\n\nSAH is missed in up to 5% on initial CT, especially >6 hours after onset. Xanthochromia (yellow from bilirubin) distinguishes SAH from traumatic tap. Canadian Stroke Best Practices recommend CTA if SAH confirmed to identify the aneurysm."
    difficulty: medium
    tags: [SAH, thunderclap-headache, lumbar-puncture, xanthochromia, CTA]
  - front: "What is the Hunt and Hess grading scale for subarachnoid hemorrhage?"
    back: "Grade I: asymptomatic/mild headache. II: moderate-severe headache, nuchal rigidity, no deficit except CN palsy. III: drowsiness, confusion, mild focal deficit. IV: stupor, moderate-severe hemiparesis. V: deep coma, decerebrate posturing.\n\nHunt and Hess grade guides surgical timing and prognosis. Grades I-III generally proceed to early aneurysm securing within 72 hours. The Fisher scale predicts vasospasm risk. Nimodipine 60 mg q4h for 21 days prevents delayed cerebral ischemia per Canadian guidelines."
    difficulty: medium
    tags: [SAH, Hunt-Hess, grading, prognosis, aneurysm]
  - front: "What is the time window for IV alteplase in acute ischemic stroke and what are 3 absolute contraindications?"
    back: "Within 4.5 hours of symptom onset. Absolute contraindications: active internal bleeding, recent intracranial surgery/trauma within 3 months, platelet count <100,000.\n\nCanadian Stroke Best Practices align with AHA/ASA for the 4.5-hour window. EXTEND and WAKE-UP trials expanded eligibility using perfusion imaging and FLAIR-DWI mismatch. Endovascular thrombectomy extends to 24 hours for large vessel occlusion with salvageable tissue."
    difficulty: medium
    tags: [alteplase, thrombolysis, time-window, contraindications, acute-stroke]
  - front: "What are the indications for mechanical thrombectomy in acute ischemic stroke?"
    back: "Large vessel occlusion (ICA or M1 MCA) on CTA, NIHSS >=6, ASPECTS >=6, within 6 hours (or up to 24 hours with favorable perfusion imaging per DAWN/DEFUSE-3), pre-stroke mRS 0-1.\n\nThe ESCAPE trial (Canadian-led) demonstrated NNT of 4 for good functional outcome. Canadian Stroke Best Practices strongly recommend thrombectomy in addition to IV alteplase when eligible. MR CLEAN, EXTEND-IA, SWIFT PRIME, REVASCAT confirmed benefit."
    difficulty: hard
    tags: [thrombectomy, large-vessel-occlusion, ESCAPE, DAWN, endovascular]
  - front: "After ischemic stroke in a patient with atrial fibrillation, when should anticoagulation be initiated?"
    back: "Follow 1-3-6-12 rule: TIA = day 1, small infarct = day 3, moderate = day 6, large = day 12. Confirm no hemorrhagic transformation on imaging before starting. DOACs preferred over warfarin.\n\nEarly anticoagulation reduces recurrent stroke but increases hemorrhagic transformation risk. Canadian Stroke Best Practices recommend imaging before initiation. CCS AF guidelines prefer DOACs over warfarin for non-valvular AF."
    difficulty: hard
    tags: [AF, anticoagulation, stroke-secondary-prevention, DOAC, timing]
  - front: "What is basilar artery occlusion syndrome and how does it present?"
    back: "Rapid progressive deterioration: bilateral motor deficits, cranial nerve palsies, dysarthria, dysphagia, vertigo, altered consciousness to coma. Locked-in syndrome (bilateral ventral pontine infarction) leaves consciousness intact with communication only via vertical eye movements.\n\nBAO carries >80% mortality without treatment. CT may be normal; CTA/MRA confirms occlusion. ATTENTION and BAOCHE trials support thrombectomy up to 24 hours. The devastating natural history justifies aggressive intervention beyond standard time windows."
    difficulty: hard
    tags: [basilar-artery, locked-in-syndrome, posterior-circulation, thrombectomy, BAO]
  - front: "What is central sensitization in the context of pain?"
    back: "Hyperalgesia (increased sensitivity to pain) resulting from CNS mechanisms, involving dysregulation of analgesic pathways and potentially both nociceptive and neuropathic components\n\nCentral sensitization explains why pain may persist or worsen even after the original injury has healed, as seen in fibromyalgia."
    difficulty: medium
    tags: [central sensitization, neuropathic pain, hyperalgesia, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "Why is airway management potentially more difficult in pregnant patients?"
    back: "Tissues become edematous and friable, and body habitus changes can make direct laryngoscopy difficult\n\nPregnancy-induced physiological changes increase the risk of failed intubation and airway complications."
    difficulty: easy
    tags: [airway management, pregnancy, anesthesia considerations, toronto-notes, pages-0081-0082-0083-0084-0085-0086-0087-0088-0089-0090]
  - front: "What is the primary mechanism initiating atrial fibrillation?"
    back: "Single circuit re-entry and/or ectopic foci, predominantly arising from pulmonary veins, acting as aberrant generators producing atrial tachycardia (350-600 bpm)\n\nPulmonary vein ostia are common sites for ectopic foci that can be mapped and ablated. This triggers multiple micro-reentry circuits throughout the atria."
    difficulty: medium
    tags: [cardiology, atrial fibrillation, pathophysiology, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is the CHADS2 score and what does a score of 0 indicate?"
    back: "CHADS2 assesses stroke risk in non-valvular AFib: CHF (1), HTN (1), Age ≥75 (1), Diabetes (1), Stroke/TIA (2). A score of 0 indicates low stroke risk (~1.9%/year)\n\nThe CHADS2-VASc score refines risk stratification for low scores. A CHADS2 of 0 may still warrant anticoagulation consideration using CHA2DS2-VASc in some guidelines."
    difficulty: medium
    tags: [cardiology, atrial fibrillation, stroke risk, CHADS2, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is the acute treatment for hemodynamically stable atrial flutter?"
    back: "1) Rate control: beta-blockers, diltiazem, verapamil, or digoxin. 2) Chemical cardioversion: sotalol, amiodarone, or Type I antiarrhythmics (or electrical cardioversion). 3) Anticoagulation following the same guidelines as for atrial fibrillation.\n\nManagement of atrial flutter focuses on rate control and rhythm control. The choice depends on patient symptoms, comorbidities, and physician preference. RF ablation of the cavotricuspid isthmus is often curative for typical flutter."
    difficulty: medium
    tags: [cardiology, arrhythmias, atrial flutter, treatment, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "Differentiate paroxysmal, persistent, and permanent atrial fibrillation"
    back: "Paroxysmal: episodes lasting ≥30 seconds that terminate spontaneously. Persistent: sustained >7 days or requires cardioversion to terminate. Permanent: continuous AF unresponsive to cardioversion or clinical decision not to pursue rhythm control.\n\nThis classification guides treatment decisions. Paroxysmal AF may be managed with rhythm control or watchful waiting, while persistent and permanent AF more often require anticoagulation and rate control strategies."
    difficulty: medium
    tags: [cardiology, arrhythmias, atrial fibrillation, classification, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "Why does atrial fibrillation increase stroke risk?"
    back: "Fibrillatory conduction of the atria causes blood stasis, particularly in the left atrial appendage, leading to thrombus formation. These thrombi can embolize to the cerebral circulation causing stroke.\n\nThe loss of organized atrial contraction in AF allows blood to pool and clot. This is why anticoagulation is critical for stroke prevention in appropriate patients."
    difficulty: easy
    tags: [cardiology, arrhythmias, atrial fibrillation, stroke risk, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What is the CHADS2 score and how is it calculated?"
    back: "CHADS2 assesses stroke risk in non-valvular AF: Congestive heart failure (1 point), Hypertension (1), Age >75 (1), Diabetes (1), Prior stroke/TIA (2). Total score 0-6.\n\nThe CHADS2 score helps determine which AF patients need anticoagulation. Higher scores indicate greater stroke risk and greater benefit from anticoagulation."
    difficulty: medium
    tags: [cardiology, arrhythmias, atrial fibrillation, stroke prevention, CHADS2, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What are the common sites of ectopic foci that initiate atrial fibrillation?"
    back: "The pulmonary veins (especially their ostia) are the most common sites. These ectopic foci can be mapped and ablated during catheter ablation procedures.\n\nPulmonary vein antrum isolation is the cornerstone of catheter ablation for AF. The pulmonary veins contain myocardial sleeves that can generate ectopic triggers initiating and maintaining fibrillation."
    difficulty: medium
    tags: [cardiology, arrhythmias, atrial fibrillation, electrophysiology, ablation, toronto-notes, pages-0111-0112-0113-0114-0115-0116-0117-0118-0119-0120]
  - front: "What were the key findings of the continuous-flow vs. pulsatile-flow LVAD trial (RELEND)?"
    back: "Continuous-flow LVAD showed significantly better outcomes: 86% discharged vs. 6% for pulsatile-flow; primary endpoint (2-yr survival free of disabling stroke or device reoperation) achieved in 46% vs. 11% (HR 0.38, P<0.001)\n\nContinuous-flow devices proved superior to pulsatile-flow devices for advanced heart failure treatment, revolutionizing mechanical circulatory support."
    difficulty: hard
    tags: [VAD, LVAD, clinical-trials, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the primary advantage of continuous-flow LVAD compared to pulsatile-flow LVAD?"
    back: "Continuous-flow devices demonstrated significantly better outcomes including 46% vs 11% achieving the composite endpoint of 2-year survival free of disabling stroke or device reoperation (HR 0.38, P<0.001)\n\nThe landmark REMATCH trial established the superiority of continuous-flow devices, which are now the standard of care for destination therapy."
    difficulty: hard
    tags: [LVAD, continuous-flow, pulsatile-flow, outcomes, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "Which type of VAD showed superior outcomes in the HeartMate II trial - continuous-flow or pulsatile-flow?"
    back: "Continuous-flow devices showed significantly better outcomes (86% vs 6% discharge rates, hazard ratio 0.38 for primary endpoint of 2-year survival free of disabling stroke or device reoperation)\n\nThe MOMENTUM trial demonstrated that continuous-flow LVADs provide superior outcomes compared to pulsatile-flow devices, establishing them as the standard of care for mechanical circulatory support."
    difficulty: medium
    tags: [VAD, continuous-flow, clinical-trials, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "In the PARTNER II trial, which access route for TAVR demonstrated superior outcomes compared to SAVR?"
    back: "Transfemoral access TAVR resulted in lower rates of death or disabling stroke compared to SAVR (P=0.05)\n\nWhile overall outcomes were similar, the transfemoral-access cohort specifically benefited from TAVR with lower composite endpoints than surgical replacement."
    difficulty: medium
    tags: [cardiology, TAVR, aortic stenosis, vascular access, toronto-notes, pages-0151-0152-0153-0154-0155-0156-0157-0158-0159-0160]
  - front: "What is the mechanism of action of digoxin (Lanoxin)?"
    back: "Inhibits Na+/K+-ATPase, leading to increased intracellular Na+ and Ca2+ concentration, which increases myocardial contractility. Also slows AV node conduction.\n\nDigoxin is a cardiac glycoside used for CHF and AFib. Its unique dual action increases contractility while controlling ventricular rate."
    difficulty: easy
    tags: [cardiology, inotropes, pharmacology, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "Describe the Vaughan-Williams Class Ia antiarrhythmic mechanism."
    back: "Moderate Na+ channel blockade that slows phase 0 upstroke and prolongs repolarization (phase 3), slowing conduction\n\nClass Ia drugs include quinidine, procainamide, and disopyramide. They can cause Torsades de Pointes due to QT prolongation."
    difficulty: medium
    tags: [cardiology, antiarrhythmics, Class-Ia, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "Describe the Vaughan-Williams Class Ic antiarrhythmic mechanism."
    back: "Marked Na+ channel blockade that slows phase 0 upstroke without significantly affecting repolarization\n\nClass Ic drugs (flecainide, propafenone, encainide) can exacerbate VT and are contraindicated in structural heart disease (CAST trial)."
    difficulty: medium
    tags: [cardiology, antiarrhythmics, Class-Ic, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the five phases of the cardiac action potential and which ion channels are involved?"
    back: "Phase 0: Na+ influx (rapid depolarization). Phase 1: K+ efflux (early repolarization). Phase 2: Ca2+ influx balanced by K+ efflux (plateau). Phase 3: K+ efflux (repolarization). Phase 4: Na+ influx in Pacemaker cells, stable in ventricular myocytes\n\nUnderstanding the cardiac action potential explains why different antiarrhythmic classes affect different phases and ion channels."
    difficulty: medium
    tags: [cardiology, electrophysiology, cardiac-action-potential, ion-channels, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "How do Class Ic antiarrhythmics affect conduction velocity and contractility?"
    back: "Markedly slow phase 0 upstroke (reduced conduction velocity) and cause negative inotropy (all Class Ic drugs)\n\nClass Ic agents are contraindicated in heart failure due to their negative inotropic effects and proarrhythmic potential in structural heart disease."
    difficulty: medium
    tags: [cardiology, antiarrhythmics, Class-Ic, side-effects, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the mechanism of Class Ia antiarrhythmics?"
    back: "Moderate Na+ channel blockade that slows phase 0 upstroke and prolongs repolarization, slowing conduction\n\nClass Ia drugs bind to sodium channels in the inactivated state, slowing the rapid depolarization phase of the action potential."
    difficulty: medium
    tags: [cardiology, antiarrhythmics, Class Ia, mechanism, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What is the difference between a full agonist and a partial agonist?"
    back: "Full agonists can elicit maximal effect at a receptor (e.g., morphine at μ-opioid receptors). Partial agonists can only elicit a partial effect regardless of concentration—exhibiting a ceiling effect with reduced efficacy (e.g., buprenorphine at μ-opioid receptors).\n\nPartial agonists act as agonists at low receptor occupancy but become antagonists when receptor density increases, limiting maximal response."
    difficulty: medium
    tags: [pharmacodynamics, agonists, receptor-theory, toronto-notes, pages-0181-0182-0183-0184-0185-0186-0187-0188-0189-0190]
  - front: "What is the definition and clinical significance of cardiac transplantation reinnervation?"
    back: "Partial sympathetic reinnervation occurs in ~50% of transplant recipients after 1-2 years, improving heart rate response to exercise but preserving graft denervation benefits\n\nEarly denervation after transplant eliminates reflex responses, but later reinnervation (studied by Awad et al.) can partially restore chronotropic competence while potentially reducing some transplant-related complications."
    difficulty: hard
    tags: [cardiology, heart transplant, cardiac reinnervation, autonomic nervous system, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "What distinguishes petechiae from purpura?"
    back: "Petechiae are <3mm; purpura are larger pinpoint hemorrhagic lesions\n\nBoth are non-blanchable hemorrhagic lesions resulting from blood extravasation into the dermis."
    difficulty: easy
    tags: [dermatology, morphology, vascular, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the size difference between petechiae and purpura?"
    back: "Petechiae are pinpoint hemorrhagic lesions <3mm; purpura is larger than petechiae\n\nBoth are non-blanchable hemorrhagic lesions resulting from blood extravasation into the dermis."
    difficulty: easy
    tags: [dermatology, clinical-skills, vascular-disorders, morphological-terms, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "What is the initial event that blocks sebum secretion in acne?"
    back: "Hyperkeratinization at the follicular ostia (opening)\n\nAbnormal desquamation of the follicular epithelium blocks the opening, trapping sebum and initiating microcomedone formation."
    difficulty: medium
    tags: [dermatology, acne, pathophysiology, keratinization, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What differentiates cherry angioma from pyogenic granuloma clinically?"
    back: "Cherry angioma is less friable and does not bleed as easily as pyogenic granuloma\n\nBoth appear as red dome-shaped papules, but pyogenic granulomas are characteristically friable and bleed profusely with minimal trauma."
    difficulty: easy
    tags: [dermatology, cherry-angioma, pyogenic-granuloma, differential-diagnosis, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "How do you differentiate a venous lake from a malignant pigmented lesion?"
    back: "Diascopy (compression) blanches the lesion\n\nVenous lakes are benign blue or violaceous papular lesions on the face, lips, and ears. Unlike malignant pigmented lesions, they blanch with diascopy due to their vascular nature."
    difficulty: medium
    tags: [dermatology, venous_lake, differential_diagnosis, physical_exam, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the four pathophysiologic components of acne vulgaris?"
    back: "Hyperkeratinization at follicular ostia, excess sebum production (androgens), Cutibacterium acnes colonization, and pro-inflammatory mediators\n\nAcne vulgaris involves four key mechanisms: hyperkeratinization blocks sebum secretion (forming microcomedones), androgens promote sebum production, C. acnes metabolizes sebum to free fatty acids and produces inflammatory mediators."
    difficulty: medium
    tags: [dermatology, acne, pathophysiology, microbiology, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the differential diagnoses for tendinous and tuberous xanthoma?"
    back: "Rheumatoid nodules, gouty tophi, subcutaneous granuloma annulare, erythema elevatum diutinum\n\nNodular eruptions over joints and tendons that may mimic xanthomas include rheumatoid nodules (RA), gouty tophi, subcutaneous granuloma annulare, and erythema elevatum diutinum. Clinical context and biopsy help differentiate."
    difficulty: hard
    tags: [dermatology, xanthoma, differential_diagnosis, rheumatology, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the differential diagnoses for xanthelasma specifically?"
    back: "Sebaceous hyperplasia, juvenile xanthogranuloma, syringoma, nodular BCC\n\nXanthelasma (plane xanthoma around the eyelids) should be differentiated from sebaceous hyperplasia, juvenile xanthogranuloma, syringoma, and nodular basal cell carcinoma based on clinical features and biopsy if needed."
    difficulty: hard
    tags: [dermatology, xanthelasma, differential_diagnosis, eyelid, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the differential diagnoses for pyogenic granuloma?"
    back: "Glomus tumour, nodular melanoma, squamous cell carcinoma, nodular basal cell carcinoma\n\nPyogenic granuloma can clinically resemble several other lesions including glomus tumors, nodular melanoma, SCC, and nodular BCC. Histologic examination after surgical excision confirms the diagnosis."
    difficulty: hard
    tags: [dermatology, pyogenic_granuloma, differential_diagnosis, skin_cancer, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the key differentials for pyogenic granuloma?"
    back: "Glomus tumor, nodular melanoma (MM), squamous cell carcinoma (SCC), and nodular basal cell carcinoma (BCC).\n\nPyogenic granuloma can clinically resemble several malignant lesions, necessitating biopsy for definitive diagnosis."
    difficulty: easy
    tags: [dermatology, vascular tumors, pyogenic granuloma, differential diagnosis, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the differential diagnosis for tendinous xanthoma over joints?"
    back: "Rheumatoid nodules, gouty tophi, subcutaneous granuloma annulare, erythema elevatum diutinum\n\nFirm, smooth, mobile nodules along tendons can represent tendinous xanthoma (associated with hyperlipidemia) or other nodular eruptions. Clinical context and lipid panel help distinguish these entities."
    difficulty: medium
    tags: [dermatology, xanthoma, differential diagnosis, joint nodules, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the differential diagnoses for tendinous and tuberous xanthomas?"
    back: "Rheumatoid nodules, gouty tophi, subcutaneous granuloma annulare, erythema elevatum diutinum.\n\nThese nodular eruptions over joints and tendons can mimic xanthomas clinically but have different underlying etiologies."
    difficulty: medium
    tags: [dermatology, xanthoma, differential_diagnosis, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is a primary skin lesion?"
    back: "A de novo initial lesion that has not been altered by trauma, manipulation, or regression\n\nPrimary lesions are the first manifestations of a skin disease and form the basis for clinical diagnosis using morphology."
    difficulty: easy
    tags: [dermatology, skin lesions, morphology, toronto-notes, pages-0191-0192-0193-0194-0195-0196-0197-0198-0199-0200]
  - front: "Which bullous disease commonly presents with oral mucosal involvement and what percentage?"
    back: "Pemphigus Vulgaris - oral mucosa involved in approximately 90% of cases, often as the initial presentation.\n\nOral lesions often precede skin involvement in pemphigus vulgaris and appear as erosions rather than intact bullae since the blisters are very superficial."
    difficulty: easy
    tags: [pemphigus-vulgaris, oral-mucosa, epidemiology, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the time course for exanthematous drug reactions?"
    back: "Onset 7-14 days after drug initiation; fades 7-14 days after drug withdrawal\n\nThis relatively predictable timeline helps distinguish exanthematous reactions from other drug eruptions and viral exanthems"
    difficulty: easy
    tags: [dermatology, drug-eruption, timeline, exanthematous, toronto-notes, pages-0211-0212-0213-0214-0215-0216-0217-0218-0219-0220]
  - front: "What is the differential diagnosis for tendinous xanthoma?"
    back: "Rheumatoid nodules, gouty tophi, subcutaneous granuloma annulare, erythema elevatum diutinum\n\nNodular eruptions over joints and tendons can appear similar to xanthomas, requiring biopsy for definitive diagnosis."
    difficulty: medium
    tags: [dermatology, differential diagnosis, xanthoma, rheumatology, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What are the differential diagnoses for xanthelasma?"
    back: "Sebaceous hyperplasia, juvenile xanthogranuloma, syringoma, nodular basal cell carcinoma\n\nYellowish periorbital lesions can have multiple causes ranging from benign to malignant, requiring careful evaluation."
    difficulty: medium
    tags: [dermatology, differential diagnosis, xanthelasma, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the differential diagnosis for genital ulcers besides HSV?"
    back: "Candidal balanitis, chancroid, syphilitic chancres\n\nAccurate differentiation is important as treatment and implications differ significantly. Syphilitic chancres are painless unlike HSV lesions."
    difficulty: medium
    tags: [HSV, differential diagnosis, genital ulcers, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the differential diagnosis for genital ulcers (including HSV)?"
    back: "Candidal balanitis, chancroid, and syphilitic chancres (primary syphilis).\n\nGenital ulceration requires differentiation between viral (HSV), bacterial (chancroid, syphilis), and fungal (candidal) causes through clinical features and laboratory testing."
    difficulty: medium
    tags: [hsv, genital-ulcers, differential-diagnosis, sti, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the differential diagnosis for genital herpes?"
    back: "Candidal balanitis, chancroid, and syphilitic chancres (painless ulcer with clean base and indurated edges).\n\nThe painful nature of herpetic lesions contrasts with the typically painless chancre of primary syphilis and the painful purulent ulcers of chancroid."
    difficulty: medium
    tags: [genital herpes, differential diagnosis, syphilis, chancroid, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "Why can eyebrows, eyelashes, and axillary hairs not regrow after being lost?"
    back: "These hairs have a short growth (anagen) stage relative to their resting (telogen) stage, resulting in no regrowth potential when lost\n\nHair follicles with short anagen phases cannot regenerate because insufficient time exists for meaningful hair production before cycling to rest."
    difficulty: medium
    tags: [hair biology, dermatology, alopecia, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What distinguishes scarring from non-scarring alopecia?"
    back: "Non-scarring alopecia has intact stem cells allowing spontaneous or treatment-induced regrowth; scarring alopecia has permanent follicular destruction with no regrowth potential\n\nThe presence of intact stem cells in the bulge region is the critical difference determining reversibility of hair loss."
    difficulty: medium
    tags: [alopecia, classification, diagnosis, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What monitoring is required for acitretin in women of childbearing potential?"
    back: "Two pregnancy tests at baseline, contraception counseling, monthly tests during treatment, and continued monitoring for >3 years after discontinuation due to teratogenicity\n\nAcitretin is highly teratogenic. Women must use two forms of contraception during treatment and for 3 years after stopping due to the drug's long elimination half-life."
    difficulty: hard
    tags: [dermatology, acitretin, psoriasis, teratogenicity, monitoring, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What side effect of isotretinoin may cause temporary worsening of acne?"
    back: "Transient acne flare/exacerbation during initial treatment period\n\nIsotretinoin may cause a transient worsening of acne during the first few weeks of therapy before improvement occurs. This is a known effect that typically resolves."
    difficulty: easy
    tags: [dermatology, isotretinoin, acne, side-effects, paradoxical, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What does CBC monitoring frequency look like for dapsone after the initial period?"
    back: "Weekly x4 weeks, then monthly x6 months, then every 6 months thereafter\n\nDue to risk of hemolytic anemia and agranulocytosis, dapsone requires intensive early monitoring that becomes less frequent as stable hematologic parameters are documented."
    difficulty: easy
    tags: [dermatology, dapsone, monitoring, CBC, hematologic, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for acitretin (Soriatane®) therapy?"
    back: "Baseline: LFTs, fasting lipid panel, pregnancy test x2, glucose if diabetic, radiography if long-term; then LFTs and lipids q1-2wk until stable; pregnancy test q3mo if patient is of childbearing potential for >3 years after discontinuation; avoid in women of childbearing potential unless strict contraception\n\nAcitretin is a systemic retinoid for severe psoriasis. It is highly teratogenic and requires extensive monitoring, especially for female patients of childbearing age."
    difficulty: hard
    tags: [acitretin, psoriasis, systemic-therapy, monitoring, teratogenic, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are examples of situations requiring duty to report in emergency medicine?"
    back: "Gunshot wounds, suspected child abuse, various communicable diseases, medical unsuitability to drive, risk of substantial harm to others\n\nDuty to report laws vary by jurisdiction but typically require reporting of gunshot wounds, suspected abuse, certain communicable diseases, and conditions that may impair driving safety."
    difficulty: medium
    tags: [Medical Ethics, Legal, Duty to Report, Emergency Medicine, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the dosing protocol and total cumulative dose for Isotretinoin (Accutane®) in severe acne?"
    back: "0.5-1mg/kg/day once daily to achieve a total cumulative dose of 120mg/kg (typically 20-24 weeks). Second course may be initiated after 2 months.\n\nIsotretinoin is for severe nodular/conglobate or recalcitrant inflammatory acne. Monitoring includes fasting lipids q1-2 weeks and LFTs q1-2 weeks until stable."
    difficulty: medium
    tags: [dermatology, acne, isotretinoin, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What monitoring is required for Methotrexate therapy in dermatology?"
    back: "Baseline: pregnancy test, CBC, BUN/Cr, LFTs. CBC q6 months or more frequently if initial treatment/dose change. BUN/Cr and LFTs q4-8 weeks or more frequently.\n\nMethotrexate is an antimetabolite used for psoriasis, AD, and lymphomatoid papulosis. Folic acid is given to minimize side effects."
    difficulty: hard
    tags: [dermatology, psoriasis, methotrexate, oral therapy, monitoring, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What must be reported in emergency medicine?"
    back: "Gunshot wounds, suspected child abuse, various communicable diseases, medical unsuitability to drive, risk of substantial harm to others\n\nDuty to report laws vary by province/state but typically include these categories."
    difficulty: easy
    tags: [duty to report, legal, ethics, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the recommended initial imaging for trauma patients?"
    back: "Non-contrast CT head/face/C-spine, CXR, FAST or CT abdomen/pelvis (if stable), pelvis x-ray\n\nImaging should be guided by history and exam findings; not all patients require all imaging."
    difficulty: easy
    tags: [trauma, imaging, CT, CXR, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the difference between scarring and non-scarring alopecia?"
    back: "Non-scarring alopecia has intact stem cells (can potentially regrow), while scarring alopecia destroys stem cells (cannot regrow without intervention)\n\nKey clinical distinction: non-scarring shows preserved follicular openings, while scarring shows shiny, atrophic, or sclerotic skin with loss of pores."
    difficulty: medium
    tags: [alopecia, classification, scarring, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the differential diagnosis for classical Kaposi sarcoma lesions?"
    back: "Well-differentiated angiosarcoma, benign lymphangiomatosis, hypertrophic lichen planus\n\nThese conditions can mimic the appearance of KS lesions and should be considered in the differential, especially in classic KS presentations."
    difficulty: hard
    tags: [kaposi-sarcoma, differential-diagnosis, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What are the 5 goals of Emergency Department treatment for orthopedic injuries?"
    back: "1) Diagnose potentially life/limb-threatening injuries, 2) Reduce and immobilize fractures (cast/splint), 3) Provide adequate pain relief, 4) Arrange proper follow-up if necessary\n\nThese are the core principles guiding initial orthopedic management in the ED."
    difficulty: easy
    tags: [orthopedics, emergency medicine, treatment principles, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the recommended initial imaging in trauma?"
    back: "Non-contrast CT head/face/C-spine, CXR, FAST or CT abdomen/pelvis (if stable), pelvis x-ray\n\nImaging should be guided by mechanism of injury, vital signs, and physical examination findings."
    difficulty: easy
    tags: [trauma, imaging, CT, CXR, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "Describe the classic Colles' fracture and its management"
    back: "Distal radius fracture with dorsal displacement from FOOSH (Fall on Outstretched Hand). AP: radial shortening, deviation, displacement. Lateral: dorsal displacement, volar angulation. Reduce and splint, outpatient orthopedic follow-up.\n\nColles' fracture is one of the most common forearm fractures. If articular surface involved, consider urgent orthopedic referral for unsatisfactory reduction."
    difficulty: easy
    tags: [colles-fracture, radius, wrist-injury, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the goals of ED treatment for orthopedic injuries?"
    back: "Diagnose potentially life/limb-threatening injuries, reduce and immobilize fractures, provide adequate pain relief, arrange proper follow-up\n\nThe SEADS examination (Swelling, Erythema, Atrophy, Deformity, Skin changes) guides assessment along with neurovascular status."
    difficulty: easy
    tags: [orthopedic-assessment, emergency, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the initial management for lumbosacral strain and disc herniation?"
    back: "Analgesia and continue daily activities as much as tolerated; discuss red flags and organize follow-up\n\nMost mechanical back pain improves with early mobilization rather than bed rest"
    difficulty: easy
    tags: [Emergency Medicine, Back Pain, Management, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the categories of seizures?"
    back: "Generalized (consciousness always lost): tonic/clonic, absence, myoclonic, atonic. Partial (focal): simple partial, complex partial\n\nClassification determines investigation and treatment approach"
    difficulty: easy
    tags: [Emergency Medicine, Seizures, Neurology, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the differential diagnosis for seizure-like episodes?"
    back: "Syncope, stroke/TIA, psychogenic non-epileptic seizure, migraines, movement disorders, and narcolepsy/cataplexy\n\nAccurate diagnosis is essential as management differs significantly"
    difficulty: medium
    tags: [Emergency Medicine, Seizures, Differential Diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the initial management of anterior urethral injury?"
    back: "Conservative management; if unable to void, place Foley or suprapubic cystostomy plus antibiotics\n\nAnterior urethral injuries are often managed conservatively unless the patient cannot void."
    difficulty: medium
    tags: [Emergency Medicine, Urology, Urethra Injury, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the initial treatment for compartment syndrome?"
    back: "Remove constrictive casts and dressings; emergent fasciotomy may be needed\n\nPrompt decompression is required to prevent muscle/nerve necrosis."
    difficulty: medium
    tags: [Emergency Medicine, Orthopedics, Compartment Syndrome, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What is the best initial imaging for a trauma patient with suspected intracranial injury?"
    back: "Non-contrast CT head/face/C-spine\n\nCT without contrast is the best initial imaging to rule out fractures and intracranial bleeding."
    difficulty: easy
    tags: [CT, trauma, imaging, intracranial, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the two main categories of seizures?"
    back: "Generalized seizure (consciousness always lost): tonic/clonic, absence, myoclonic, atonic; and Partial seizure (focal): simple partial, complex partial\n\nGeneralized seizures involve both cerebral hemispheres from onset, while partial seizures originate from a specific focal area."
    difficulty: easy
    tags: [Emergency Medicine, Seizures, Classification, Neurology, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "When can a patient be discharged after a seizure in the emergency department?"
    back: "Patient had a brief generalized seizure, has returned to baseline function, and is neurologically intact with appropriate outpatient follow-up\n\nMost first-time seizure patients should be referred to a neurologist for follow-up and should not drive until medically cleared."
    difficulty: medium
    tags: [Emergency Medicine, Seizures, Disposition, Guidelines, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is included in the differential diagnosis for seizures?"
    back: "Syncope, stroke/TIA, psychogenic non-epileptic seizure, migraines, movement disorders, narcolepsy/cataplexy\n\nThese conditions can mimic seizures and must be considered in the diagnostic workup."
    difficulty: medium
    tags: [seizures, differential diagnosis, misdiagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the criteria for discharging a patient after a seizure?"
    back: "Brief generalized seizure with return to baseline function, neurologically intact, and appropriate outpatient follow-up arranged\n\nMost first-time seizures require neurological follow-up but may not require hospitalization if the patient is stable."
    difficulty: medium
    tags: [seizures, disposition, discharge, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the key components of history when evaluating a patient with seizures?"
    back: "History of seizures, identify potential precipitants (illness, alcohol withdrawal, sleep deprivation), preceding aura, rapid onset, brief duration, alterations in consciousness, tonic-clonic movements, and postictal period\n\nDetailed history helps classify seizure type and identify reversible causes."
    difficulty: medium
    tags: [seizures, history, clinical assessment, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the major categories of seizures?"
    back: "Generalized seizures (consciousness always lost): tonic-clonic, absence, myoclonic, atonic. Partial seizures (focal): simple partial, complex partial\n\nSeizure classification is based on onset pattern and whether consciousness is affected, guiding investigation and management."
    difficulty: easy
    tags: [Emergency Medicine, Seizures, Classification, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What investigations should be ordered in a patient with a first-time seizure in the ED?"
    back: "CBC and differential, electrolytes, calcium, magnesium, venous blood gas, serum blood glucose, toxins screen, antiepileptic drug levels, pregnancy test (p-hCG)\n\nThese tests identify potentially reversible metabolic causes and establish baseline before starting chronic therapy."
    difficulty: medium
    tags: [Emergency Medicine, Seizures, Investigations, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the less emergent causes of dyspnea to consider in the differential?"
    back: "Neuromuscular: myasthenia gravis, diaphragmatic paralysis, CNS lesion, primary muscle weakness. Other: deconditioning, respiratory splinting due to unrelated pain, anxiety, NYD (not yet diagnosed)\n\nThese causes should be considered after ruling out more serious pathology, particularly in patients without other concerning features."
    difficulty: medium
    tags: [Emergency Medicine, Dyspnea, Differential Diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the CNS findings in hypertensive emergency?"
    back: "Stroke/TIA, headache, altered mental status, seizures, hemorrhage\n\nCerebral autoregulation failure can lead to hypertensive encephalopathy, hemorrhage, or ischemic stroke in severe cases."
    difficulty: easy
    tags: [Hypertension, Neurology, Emergency Medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the 4 goals of ED treatment for orthopedic injuries?"
    back: "1) Diagnose potentially life/limb-threatening injuries, 2) Reduce and immobilize fractures, 3) Provide adequate pain relief, 4) Arrange proper follow-up\n\nThese four goals guide emergency management of all orthopedic presentations to ensure optimal patient outcomes."
    difficulty: easy
    tags: [orthopedics, emergency-medicine, treatment, toronto-notes, pages-0261-0262-0263-0264-0265-0266-0267-0268-0269-0270]
  - front: "What are the key clinical features distinguishing heat exhaustion from heat stroke?"
    back: "Heat exhaustion: <40.5°C, non-specific symptoms (nausea, headache, fatigue), dehydration, no CNS changes. Heat stroke: >40.5°C, altered mental status, seizures, coma, may have hot/dry or diaphoretic skin\n\nHeat exhaustion is volume depletion from heat stress while heat stroke is life-threatening failure of heat-shedding mechanisms with CNS dysfunction"
    difficulty: easy
    tags: [heat-illness, emergency-medicine, environmental-injury, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are the two subtypes of heat stroke?"
    back: "Classical (occurs in elderly/immobile in high ambient temperatures, dry hot skin) and Exertional (occurs in young active individuals with high endogenous heat production, often diaphoretic)\n\nClassical heat stroke affects sedentary individuals during heat waves while exertional heat stroke occurs during intense exercise"
    difficulty: easy
    tags: [heat-stroke, emergency-medicine, classification, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "How is frostbite classified by depth?"
    back: "Grade 1: no initial lesion; Grade 2: initial lesion on distal phalanx; Grade 3: initial lesion on intermediary and proximal phalanx; Grade 4: initial lesion on carpal/tarsal\n\nClassification is based on initial lesion extent at day 0 after rapid rewarming"
    difficulty: medium
    tags: [frostbite, classification, emergency-medicine, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "A 65-year-old patient is found collapsed in a non-air-conditioned apartment during a heat wave. Core temperature is 41.2°C, skin is hot and dry, and the patient is confused. What is the most likely diagnosis?"
    back: "Classical heat stroke\n\nClassical heat stroke occurs in setting of high ambient temperatures, typically in older sedentary patients. Core temperature >40.5°C, altered mental status, and hot dry skin are classic findings."
    difficulty: easy
    tags: [EmergencyMedicine, EnvironmentalInjuries, HeatStroke, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are the key distinguishing features between heat exhaustion and heat stroke?"
    back: "Heat exhaustion: temp <40.5°C, non-specific symptoms, no coma; Heat stroke: temp >40.5°C, altered mental status, seizures, possible multi-organ failure\n\nHeat exhaustion is due to volume depletion from heat stress with normal temp, while heat stroke is life-threatening failure of heat-shedding mechanisms with hyperpyrexia."
    difficulty: easy
    tags: [EmergencyMedicine, EnvironmentalInjuries, HeatStroke, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the recommended initial treatment for heat stroke?"
    back: "Cool body temperature with water mist and fans, or ice water immersion; secure airway; avoid vasoconstrictors and antipyretics\n\nRapid cooling is critical - use water spray with fans or ice water immersion. Monitor rectal temp closely to avoid overshoot hypothermia. Airway protection needed if seizures."
    difficulty: medium
    tags: [EmergencyMedicine, EnvironmentalInjuries, HeatStroke, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "A patient with frostbite has an initial lesion on the proximal phalanx. What grade is this?"
    back: "Grade 3 frostbite\n\nFrostbite grades: Grade 1 (no initial lesion), Grade 2 (distal phalanx), Grade 3 (intermediary and proximal phalanx), Grade 4 (carpal/tarsal)."
    difficulty: medium
    tags: [EmergencyMedicine, EnvironmentalInjuries, Frostbite, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What medications should be avoided in heat stroke treatment and why?"
    back: "Avoid β-agonists (e.g., epinephrine), peripheral vasoconstriction, and antipyretics (e.g., ASA)\n\nThese interventions can worsen heat stroke by impairing heat dissipation or have no effect on hyperthermia from failed thermoregulation."
    difficulty: medium
    tags: [EmergencyMedicine, EnvironmentalInjuries, HeatStroke, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are the key historical features in a patient with seizure?"
    back: "History of seizures, potential precipitants (illness, alcohol withdrawal, sleep deprivation), preceding aura, rapid onset, brief duration, alterations in consciousness, tonic-clonic movements, postictal period\n\nThorough history guides investigation and identifies potentially reversible causes."
    difficulty: medium
    tags: [Emergency Medicine, Seizures, History, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What is the differential diagnosis for seizure?"
    back: "Syncope, stroke/TIA, psychogenic non-epileptic seizure, migraines, movement disorders, narcolepsy/cataplexy\n\nAccurate diagnosis is essential as management differs significantly between these conditions."
    difficulty: medium
    tags: [Emergency Medicine, Seizures, Differential Diagnosis, toronto-notes, pages-0271-0272-0273-0274-0275-0276-0277-0278-0279-0280]
  - front: "What are the CNS manifestations of hypertensive emergency?"
    back: "Stroke/TIA, headache, altered mental status, seizures, hemorrhage.\n\nHypertensive emergency can cause encephalopathy, stroke, and intracerebral hemorrhage."
    difficulty: medium
    tags: [hypertensive emergency, CNS, emergency medicine, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "How does classical heat stroke differ from exertional heat stroke?"
    back: "Classical: occurs in elderly/sedentary patients with high ambient temperatures, dry hot skin; Exertional: occurs in younger active patients with high endogenous heat production, often with DIC, acute renal failure, rhabdomyolysis\n\nClassical heat stroke is passive (environmental) while exertional heat stroke results from excessive physical activity overwhelming homeostatic mechanisms."
    difficulty: medium
    tags: [heat stroke, emergency medicine, environmental injury, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are the key toxicokinetic features of methanol and ethylene glycol poisoning?"
    back: "Initially produce high osmolar gap, which decreases as toxic alcohol is metabolized, leading to anion gap metabolic acidosis\n\nToxic alcohols are metabolized to acidic metabolites, causing both osmolar and anion gap elevations"
    difficulty: medium
    tags: [toxicology, alcohol poisoning, metabolic acidosis, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the initial dose of naloxone for opioid overdose?"
    back: "0.2-1 mg IV (preferably incremental doses)\n\nStart low and titrate to reverse respiratory depression without precipitating withdrawal"
    difficulty: easy
    tags: [opioid, naloxone, overdose, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What distinguishes classical heat stroke from exertional heat stroke?"
    back: "Classical: occurs in high ambient temperatures in sedentary/immobile patients (often older). Exertional: occurs with high endogenous heat production from exercise that overwhelms homeostatic mechanisms.\n\nThese two subtypes have different pathophysiology - classical involves external heat stress while exertional involves internal heat generation."
    difficulty: medium
    tags: [heat-stroke, emergency-medicine, environmental-injury, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the core body temperature threshold for diagnosing heat stroke?"
    back: ">40.5°C\n\nHeat stroke is defined by core temperature above 40.5°C along with altered mental status, distinguishing it from heat exhaustion."
    difficulty: easy
    tags: [heat-stroke, emergency-medicine, vital-signs, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "How is frostbite graded by depth?"
    back: "Grade 1: no initial lesion, Grade 2: initial lesion on distal phalanx, Grade 3: initial lesion on intermediary and proximal phalanx, Grade 4: initial lesion on carpal/tarsal\n\nGrading determines prognosis and guides treatment decisions."
    difficulty: medium
    tags: [frostbite, classification, emergency-medicine, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are the CNS complications of hypertensive emergency?"
    back: "Stroke/TIA, headache, altered mental status, seizures, hemorrhage\n\nCerebral autoregulation failure leads to hypertensive encephalopathy and vascular injury."
    difficulty: easy
    tags: [hypertensive emergency, CNS, complications, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What are the two subtypes of heat stroke and how do they differ?"
    back: "Classical heat stroke occurs in setting of high ambient temperatures (older, sedentary patients, dry hot skin). Exertional heat stroke occurs with high endogenous heat production from exercise (younger, active patients, often diaphoretic)\n\nClassical heat stroke typically affects vulnerable populations during heat waves, while exertional heat stroke occurs in otherwise healthy individuals during strenuous activity."
    difficulty: medium
    tags: [heat-stroke, environmental-medicine, emergency-medicine, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "How are frostbite injuries classified by grade?"
    back: "Grade 1: no initial lesion. Grade 2: initial lesion on distal phalanx. Grade 3: initial lesion on intermediary and proximal phalanx. Grade 4: initial lesion on carpal/tarsal\n\nClassification is based on the extent of initial lesion after rapid rewarming and helps guide management and predict outcomes."
    difficulty: medium
    tags: [frostbite, cold-injury, classification, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What is the progression of acid-base abnormalities in toxic alcohol ingestion?"
    back: "Initial high osmolar gap → as toxic alcohol is metabolized, osmolar gap drops → anion gap metabolic acidosis develops\n\nToxic alcohols initially produce an elevated osmolar gap due to the parent compound. As metabolism occurs, the parent compound disappears and acidic metabolites cause a severe anion gap metabolic acidosis."
    difficulty: hard
    tags: [toxicology, acid-base, alcohol poisoning, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the CNS manifestations of hypertensive emergencies?"
    back: "CNS signs include: stroke/TIA, headache, altered mental status, seizures, hemorrhage.\n\nCerebral autoregulation failure leads to hypertensive encephalopathy and vascular injury."
    difficulty: medium
    tags: [hypertension, emergency medicine, neurological, stroke, toronto-notes, pages-0281-0282-0283-0284-0285-0286-0287-0288-0289-0290]
  - front: "What is the initial metabolic abnormality seen with toxic alcohol ingestion?"
    back: "High osmolar gap\n\nToxic alcohols initially produce a high osmolar gap. As the toxic alcohol is metabolized, the osmolar gap drops and an anion gap metabolic acidosis develops."
    difficulty: easy
    tags: [toxic alcohols, methanol, ethylene glycol, osmolar gap, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the initial naloxone dose for opioid overdose?"
    back: "0.2-1 mg IV (incremental doses)\n\nNaloxone should be given IV in incremental doses of 0.2-1 mg. For cardiorespiratory arrest, give at least 2 mg minimum."
    difficulty: easy
    tags: [opioid, naloxone, overdose, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What are the differential causes of acute psychosis in the ED?"
    back: "Primary psychotic disorder, medical condition (delirium), drugs (intoxication/withdrawal/medications), CNS infection, metabolic disorders, structural lesions, autoimmune (anti-NMDA receptor encephalitis)\n\nAcute psychosis differential includes primary psychiatric disorders and secondary causes from medical conditions, substances, infections, metabolic disturbances, structural brain lesions, and autoimmune encephalitis."
    difficulty: medium
    tags: [psychosis, differential, emergency, toronto-notes, pages-0301-0302-0303-0304-0305-0306-0307-0308-0309-0310]
  - front: "What is the initial IV fluid rate for DKA resuscitation?"
    back: "500 mL/h NS for first 4 hours, then 250 mL/h\n\nAggressive fluid resuscitation is critical. Initial rate is 500 mL/h NS x4h, then 250 mL/h x4h, adjusting for severity."
    difficulty: easy
    tags: [endocrinology, DKA, treatment, fluids, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the recommended IV fluid initial rate for DKA resuscitation?"
    back: "1 L/hour of normal saline initially\n\nInitial fluid resuscitation in DKA is 500 mL/h x4h, then 250 mL/h x4h NS for mild-moderate deficit, or 1-2 L/h for severe deficit with shock."
    difficulty: medium
    tags: [endocrinology, DKA, treatment, fluids, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the best initial imaging modality for pituitary pathology?"
    back: "MRI of the sella\n\nMRI provides superior soft tissue resolution for evaluating pituitary tumors, their relationship to the optic chiasm, and surrounding structures. CT is used when MRI is contraindicated."
    difficulty: easy
    tags: [pituitary, imaging, MRI, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the initial test for evaluating suspected pituitary hormone deficiency if 8am cortisol is low/borderline?"
    back: "Cosyntropin stimulation test\n\nIf results are equivocal, proceed to insulin tolerance test which is the gold standard for assessing pituitary-adrenal axis."
    difficulty: medium
    tags: [pituitary, diagnosis, cosyntropin test, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the initial IV fluid for DKA/HHS resuscitation?"
    back: "Normal Saline (0.9% NaCl)\n\nIV fluids begin with NS, typically 500 mL/h x 4h, then 250 mL/h x 4h, then reassess."
    difficulty: easy
    tags: [DKA, HHS, fluids, resuscitation, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "In Sheehan's syndrome, what is the mechanism of pituitary infarction?"
    back: "Excessive postpartum blood loss and hypovolemic shock causing ischemic necrosis of the pituitary\n\nThe pituitary enlarges during pregnancy and is particularly susceptible to hypoperfusion. Severe postpartum hemorrhage can cause infarction, leading to variable hormone deficiencies."
    difficulty: medium
    tags: [pituitary, Sheehan, obstetrics, endocrinology, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the initial fluid resuscitation rate for DKA with severe deficit?"
    back: "1-2 L/hour of normal saline if severe deficit (shock)\n\nFor mild-moderate deficit, start with 500 mL/h × 4h then 250 mL/h × 4h. Rate is adjusted based on degree of dehydration."
    difficulty: medium
    tags: [DKA, treatment, fluids, resuscitation, toronto-notes, pages-0321-0322-0323-0324-0325-0326-0327-0328-0329-0330]
  - front: "What is the age distribution of physiologic gynecomastia?"
    back: "Trimodal distribution: neonatal, pubertal, and older males\n\nPhysiologic gynecomastia occurs in up to 60-90% of neonates, 50% ofpubertal males, and 30-65% of older men."
    difficulty: easy
    tags: [endocrinology, gynecomastia, physiology, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "At what age does gynecomastia peak and what is the regression rate?"
    back: "Peaks between ages 13-44, with spontaneous regression in 90% of cases\n\nMost adolescent gynecomastia regresses within 2 years without treatment."
    difficulty: medium
    tags: [endocrinology, gynecomastia, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What drugs commonly cause gynecomastia?"
    back: "Spironolactone, cimetidine, digoxin, ketoconazole, recombinant hGH, hCG, estrogens, antiandrogens, GnRH agonists, 5-alpha-reductase inhibitors, anabolic steroids\n\nThese drugs either increase estrogen activity or decrease androgen activity."
    difficulty: medium
    tags: [endocrinology, gynecomastia, drugs, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is the pathophysiology of gynecomastia?"
    back: "Hormonal imbalance due to: increased estrogen activity (increased production, peripheral conversion, or decreased metabolism) OR decreased androgen activity (decreased production, increased SHBG binding, or androgen receptor blockage)\n\nThe imbalance between estrogen and androgen effects on breast tissue leads to glandular proliferation."
    difficulty: hard
    tags: [endocrinology, gynecomastia, pathophysiology, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What red flags on physical exam suggest breast cancer rather than gynecomastia?"
    back: "Unilateral, eccentric, hard or fixed mass, skin dimpling or retraction, bloody nipple discharge or crusting\n\nBreast cancer is eccentric and fixed, while gynecomastia is concentric around the nipple and rubbery."
    difficulty: medium
    tags: [endocrinology, gynecomastia, breast-cancer, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is the initial treatment approach for most men with gynecomastia?"
    back: "Initial observation after stopping offending medications and treating underlying cause\n\nMost cases resolve spontaneously, especially if identified early and trigger is removed."
