# Resp Sarcoidosis (Respirology) - generated from srs-mccqe1
cards:
  - front: "What is sarcoidosis and what are its key epidemiological features?"
    back: "Idiopathic non-infectious granulomatous multi-system disease with lung involvement in 90%. Pathologically characterized by non-necrotizing (non-caseating) granulomas (occasionally necrosis is present). Typically affects young and middle-aged patients. Higher incidence among people of African descent (USA) and northern latitudes (Scandinavia, Canada). Familial sarcoidosis recognized; HLA markers play a role.\n\nSarcoidosis is the great imitator—it can affect virtually every organ. Lung is most commonly involved (90%), but also affects lymph nodes, skin (erythema nodosum, lupus pernio), eyes (uveitis), heart (arrhythmias, cardiomyopathy), liver, kidney, and nervous system. Non-necrotizing granulomas help distinguish from TB (necrotizing/caseating) and fungal infections."
    difficulty: easy
    tags: [respirology, sarcoidosis, epidemiology, granuloma]
  - front: "What does bilateral hilar adenopathy on CXR suggest in a young patient?"
    back: "Bilateral hilar adenopathy in a young or middle-aged patient most commonly suggests sarcoidosis or lymphoma. Unilateral hilar adenopathy suggests neoplasia (primary or metastatic), TB, or sarcoid. Bilateral hilar adenopathy can also be seen in other conditions but sarcoid is the classic teaching association.\n\nHilar adenopathy refers to enlargement of mediastinal lymph nodes seen on CXR as spherical/ellipsoidal and/or calcified nodes. In sarcoidosis, bilateral hilar adenopathy (BHL) is classic and may be asymptomatic. Löfgren syndrome = BHL + erythema nodosum + arthritis (good prognosis). CXR staging: Stage 0 (normal), I (BHL alone), II (BHL + parenchymal), III (parenchymal alone), IV (fibrosis)."
    difficulty: medium
    tags: [respirology, sarcoidosis, radiology, CXR, hilar-adenopathy, differential-diagnosis]
  - front: "What are the clinical signs and symptoms of ILD, and how does sarcoidosis differ from IPF in its presentation?"
    back: "General ILD: dyspnea on exertion, nonproductive cough, dry fine end-inspiratory crackles, clubbing, cor pulmonale features. IPF: crackles and clubbing prominent. Sarcoidosis: seldom associated with crackles and clubbing. Often presents as asymptomatic CXR finding (bilateral hilar adenopathy).\n\nThe absence of crackles in sarcoidosis despite radiographic findings is a classic MCCQE1 discriminating point. Clubbing in ILD suggests IPF or asbestosis. Sarcoidosis may also present with Löfgren's syndrome (bilateral hilar adenopathy + erythema nodosum + polyarthritis) which has a good prognosis. Uveoparotid fever (Heerfordt syndrome) is another sarcoid presentation."
    difficulty: medium
    tags: [respirology, sarcoidosis, IPF, clinical-features, differential-diagnosis]
