# Psychiatry Disruptive Disorders (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What are the three symptom domains required for a diagnosis of Oppositional Defiant Disorder (ODD)?"
    back: "1. Angry/irritable mood (easily loses temper, touchy/easily annoyed, often angry and resentful)\n2. Argumentative/defiant behaviour (argues with adults/authority, defies requests/rules, deliberately annoys, blames others)\n3. Vindictiveness (spiteful or vindictive at least twice in the past 6 months)\n\nDSM-5 requires a pattern of negativistic, hostile, and defiant behaviour for at least 6 months involving a non-sibling, with at least 4 symptoms across these three domains. The behaviours must exceed what is normative for age, gender, and culture, and cause significant distress or impairment."
    difficulty: easy
    tags: [psychiatry, ODD, oppositional defiant disorder, child psychiatry, neurodevelopmental]
  - front: "How does frequency of ODD symptoms differ between children under 5 years versus those 5 years and older?"
    back: "Under age 5: symptoms must occur on most days. Age 5 and older: symptoms must occur at least weekly.\n\nThis frequency threshold distinguishes ODD from normal developmental behaviour. The behaviours must cause significant distress or functional impairment and not occur exclusively during psychotic, substance use, or mood disorder episodes."
    difficulty: easy
    tags: [psychiatry, ODD, child psychiatry, diagnosis]
  - front: "What disorder supersedes an ODD diagnosis if criteria for both are met?"
    back: "Disruptive Mood Dysregulation Disorder (DMDD) supersedes ODD if criteria for both are met.\n\nDMDD is characterized by severe recurrent temper outbursts and a persistently irritable/angry mood, and takes diagnostic precedence over ODD when both sets of criteria are fulfilled, reflecting a higher level of mood dysregulation."
    difficulty: medium
    tags: [psychiatry, ODD, DMDD, differential diagnosis, child psychiatry]
  - front: "What are the four categories of behaviour required for a Conduct Disorder (CD) diagnosis, and how many criteria and timeframe are needed?"
    back: "Four categories: (1) Aggression to people and animals, (2) Destruction of property, (3) Deceitfulness or theft, (4) Violation of rules (TRAP mnemonic). At least 3 criteria in the past 12 months, with at least 1 in the past 6 months.\n\nCD prevalence is 1.5–3.4% with a M:F ratio of 4:1. Diagnosis requires significant impairment in social, academic, or occupational functioning, and if the patient is ≥18 years old, criteria for ASPD must not be met. Early-onset type (≥1 criterion before age 10) has a worse prognosis."
    difficulty: easy
    tags: [psychiatry, conduct disorder, child psychiatry, diagnosis]
  - front: "What percentage of children with Conduct Disorder develop Antisocial Personality Disorder as adults?"
    back: "Approximately 50% of children with Conduct Disorder develop ASPD as adults.\n\nPoor prognostic indicators for CD include early-age onset, high frequency and variety of behaviours, pervasiveness across settings (home, school, community), comorbid ADHD, early sexual activity, and substance misuse. Early intervention is more effective and long-term follow-up is required."
    difficulty: easy
    tags: [psychiatry, conduct disorder, ASPD, prognosis]
  - front: "What are the two manifestations of Intermittent Explosive Disorder (IED), and what are the minimum frequency and duration requirements for each?"
    back: "1. Verbal or physical aggression NOT causing damage to others/property: at least twice per week for 3 months\n2. Physical aggression causing damage to a person, animal, or property: at least 3 outbursts in the last 12 months\n\nIED can be diagnosed in patients aged ≥6 years and can be comorbid with ADHD, CD, ODD, or ASD when outbursts exceed those typically seen in those disorders. Outbursts must be out of proportion to triggers, not premeditated, and cause significant distress, functional impairment, or financial/legal consequences."
    difficulty: medium
    tags: [psychiatry, IED, intermittent explosive disorder, impulse control]
  - front: "What is the ODD prevalence and how does the sex distribution change with puberty?"
    back: "Prevalence: 2–16%\nSex distribution: Before puberty, more common in males. After puberty, prevalence is equal between males and females (M = F after puberty).\n\nODD typically first appears during preschool and rarely begins later than early adolescence. It is associated with poor school performance, few friends, strained parent-child relationships, and risk of developing mood disorders later. It often precedes Conduct Disorder. Treatment includes parent management training, behavioural therapy, school interventions, and pharmacotherapy for comorbid disorders."
    difficulty: easy
    tags: [psychiatry, ODD, prevalence, child psychiatry, epidemiology]
  - front: "What are the poor prognostic indicators for Conduct Disorder?"
    back: "1. Early age of onset\n2. High frequency of behaviours\n3. Variety of antisocial behaviours\n4. Pervasiveness (home, school, and community)\n5. Comorbid ADHD\n6. Early sexual activity\n7. Substance misuse\n\n50% of children with CD develop ASPD as adults. Early intervention is more effective. Treatment includes parent management training, anger replacement training, CBT, family therapy, educational/employment programs, social skills training, and pharmacotherapy for comorbid disorders. Culturally safe and trauma-informed care is essential."
    difficulty: easy
    tags: [psychiatry, conduct disorder, prognosis, ASPD, risk factors]
