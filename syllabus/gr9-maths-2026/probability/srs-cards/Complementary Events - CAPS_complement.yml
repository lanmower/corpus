# Gr 9 Maths CAPS — probability / Complementary Events
deck: "Corpus::Gr9 Maths::Complementary Events"
notes:
  - guid: 60304871137bea26
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Complementary Events"
    fields:
      Front: "What are complementary events, and what is the key rule?"
      Back: "The complement of event A, written 'not A' or A', is everything in the sample space that is NOT A.\nKey rule: P(A) + P(not A) = 1, so P(not A) = 1 − P(A).\nExample: if P(rain) = 0,3 then P(no rain) = 1 − 0,3 = 0,7."
    tags: ["complement", "subject:probability"]
  - guid: 71415972248cfb37
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Complementary Events"
    fields:
      Front: "Why do the probabilities of all outcomes in a sample space add up to 1?"
      Back: "Because something must happen: one of the outcomes is certain to occur, and certainty = 1.\nE.g. for a die: 1/6 + 1/6 + 1/6 + 1/6 + 1/6 + 1/6 = 6/6 = 1.\nThis is a useful CHECK: if your outcome probabilities don't sum to 1, there is an error."
    tags: ["sum-to-one", "subject:probability"]
  - guid: 8252608335a9dc48
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Complementary Events"
    fields:
      Front: "P(picking a faulty bulb) = 3/40. Find P(picking a good bulb)."
      Back: "'Good' is the complement of 'faulty'.\nP(good) = 1 − P(faulty) = 1 − 3/40.\nWrite 1 as 40/40: 40/40 − 3/40 = 37/40.\nP(good) = 37/40 = 0,925 = 92,5%."
    tags: ["complement", "subject:probability"]
  - guid: 9363719446bae059
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Complementary Events"
    fields:
      Front: "When is using the complement FASTER than counting directly? Give an example with a die."
      Back: "When 'not A' is much simpler to count than A.\nExample: P(rolling at least 2) on a die = P(2,3,4,5,6).\nInstead, use complement: 'not at least 2' = rolling a 1 = 1/6.\nP(at least 2) = 1 − 1/6 = 5/6. Much quicker than adding five fractions."
    tags: ["complement", "subject:probability"]
  - guid: a474820557cbf160
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Complementary Events"
    fields:
      Front: "The probability a learner passes is 85%. Express P(fail) in three forms."
      Back: "P(fail) = 1 − P(pass) = 100% − 85% = 15%.\nFraction: 15% = 15/100 = 3/20.\nDecimal: 0,15.\nPitfall: complements must be written as 1 (or 100%) minus the value — not just 'the rest of 100' guessed at."
    tags: ["complement", "subject:probability"]
  - guid: b5859316680c0271
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Complementary Events"
    fields:
      Front: "Spinner outcomes: P(red) = 0,4, P(blue) = 0,35, P(green) = x. Find x."
      Back: "All outcome probabilities sum to 1.\n0,4 + 0,35 + x = 1.\n0,75 + x = 1.\nx = 1 − 0,75 = 0,25.\nSo P(green) = 0,25. Check: 0,4 + 0,35 + 0,25 = 1. ✓"
    tags: ["sum-to-one", "subject:probability"]
  - guid: c696042771bd1382
    noteType: Basic
    deck: "Corpus::Gr9 Maths::Complementary Events"
    fields:
      Front: "Common pitfall: is the complement of 'rolling a 6' equal to 'rolling a 1'? Explain."
      Back: "No. The complement of 'rolling a 6' is 'NOT rolling a 6' = {1,2,3,4,5}, which is 5 outcomes.\nP(not 6) = 5/6, not 1/6.\nThe complement is everything else in the sample space, not just one other outcome."
    tags: ["complement", "subject:probability"]
