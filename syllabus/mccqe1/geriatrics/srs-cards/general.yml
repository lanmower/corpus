# General (Geriatrics) - generated from srs-mccqe1
cards:
  - front: "Should adults age 75 and older be screened for colorectal cancer?"
    back: "No, recommend not screening adults age 75 and older (weak recommendation, low quality evidence)\n\nThe Canadian Task Force recommends against CRC screening in patients ≥75 due to limited evidence of benefit and increased risks from screening in older adults."
    difficulty: easy
    tags: [colorectal cancer, screening, preventive medicine, geriatrics, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "Should men age 70 and older be screened for prostate cancer with PSA?"
    back: "No, recommend not screening men age 70 and older (strong recommendation, low quality evidence)\n\nNo evidence of mortality benefit from PSA screening in men ≥70, with evidence of potential harms from overdiagnosis and treatment complications."
    difficulty: easy
    tags: [prostate cancer, Screening, PSA, geriatrics, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommendation for PSA testing in men age 70 and older?"
    back: "Recommend not screening with PSA test (strong recommendation; low quality evidence)\n\nThere is no evidence of mortality benefit in this age group, and significant potential for harm."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, geriatrics, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What does the Canadian Task Force recommend for colorectal cancer screening in adults age 75 and older?"
    back: "Recommend NOT screening for colorectal cancer (weak recommendation, low quality evidence)\n\nThe guidelines recommend against screening adults ages ≥75 for CRC as a weak recommendation based on low quality evidence."
    difficulty: easy
    tags: [colorectal cancer, screening, geriatrics, preventive medicine, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the recommendation for PSA screening in men age 70 and older?"
    back: "Recommend NOT screening for prostate cancer with PSA test (strong recommendation, low quality evidence)\n\nFor men ≥70, there is no evidence of mortality benefit from PSA screening but there is evidence of harms, supporting a strong recommendation against screening."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, geriatrics, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the PSA screening recommendation for men age 70 and older?"
    back: "Recommend not screening (strong recommendation, low quality evidence)\n\nFor men 70+, there is no evidence that PSA screening reduces mortality, while harms from overdiagnosis and treatment remain significant."
    difficulty: easy
    tags: [prostate cancer, screening, PSA, preventive medicine, geriatrics, toronto-notes, pages-0381-0382-0383-0384-0385-0386-0387-0388-0389-0390]
  - front: "What is the prevalence of age-related hearing loss (presbycusis) in the 65-84 year age group?"
    back: "43%\n\nPresbycusis is typically sensorineural and increases with age, affecting 90% of age-related hearing loss."
    difficulty: easy
