  - front: "What is the prevalence of hearing loss detectable by audiology in people over 65?"
    back: "Greater than 1/3\n\nAge-related hearing loss is highly prevalent in the elderly population."
    difficulty: easy
    tags: [hearing, epidemiology, geriatrics, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is presbycusis?"
    back: "Age-related hearing loss, of which 90% is sensorineural\n\nPresbycusis is the most common cause of sensorineural hearing loss in older adults, typically affecting high frequencies first."
    difficulty: easy
    tags: [hearing, geriatrics, otolaryngology, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the prevalence of age-related hearing loss (presbycusis) in different age groups?"
    back: "6% in ages 35-44 years, 43% in ages 65-84 years; >90% of presbycusis is sensorineural\n\nHearing loss prevalence increases dramatically with age; sensorineural loss is most common in elderly patients."
    difficulty: easy
    tags: [hearing, epidemiology, geriatrics, toronto-notes, pages-0411-0412-0413-0414-0415-0416-0417-0418-0419-0420]
  - front: "What is the prevalence of overactive bladder in patients over 75 years old?"
    back: "42% in males, 31% in females\n\nPrevalence increases with age, and while overall EM ratio is 1:1, women experience incontinence more commonly than men."
    difficulty: easy
