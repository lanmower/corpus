# Hematology Malignancy (Hematology) - generated from srs-mccqe1
cards:
  - front: "What WBC finding is pathognomonic for acute myeloid leukemia (AML)?"
    back: "Auer rods — cytoplasmic inclusions that form long needle-like structures in the cytoplasm of myeloblasts — are pathognomonic for AML.\n\nAuer rods are crystallized primary (azurophilic) granules found in malignant myeloblasts. They are specifically seen in AML (not ALL or other leukemias). In acute promyelocytic leukemia (APL, AML M3), Auer rods are particularly numerous and may form 'faggot cells.' Identifying Auer rods on blood film or bone marrow aspirate indicates AML as a diagnosis."
    difficulty: easy
    tags: [hematology, AML, Auer-rods, blood-film, leukemia, pathognomonic]
  - front: "What percentage of blasts on WBC differential defines acute leukemia and why is it a medical emergency?"
    back: ">20% blasts on WBC differential defines acute leukemia. It is a medical emergency due to rapid proliferation of immature cells causing bone marrow failure (infection, bleeding, anemia) and potentially leukostasis.\n\nThe WHO threshold for acute leukemia diagnosis is ≥20% blasts in bone marrow or peripheral blood. Clinically, this results in pancytopenia (from marrow replacement) plus circulating blasts. Leukostasis can cause CNS and pulmonary complications if the WBC is very high. Prompt diagnosis, stabilization, and initiation of treatment are required."
    difficulty: medium
    tags: [hematology, acute-leukemia, blasts, emergency, AML, ALL]
