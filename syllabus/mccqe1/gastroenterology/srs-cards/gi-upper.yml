  - front: "What are the clinical features of esophageal motor disorders?"
    back: "Dysphagia with solids or liquids (or both) and chest pain\n\nMotor disorders present with variable dysphagia and sometimes chest pain, depending on the specific disorder."
    difficulty: easy
    tags: [esophageal motility, clinical features, symptoms, toronto-notes, pages-0441-0442-0443-0444-0445-0446-0447-0448-0449-0450]
  - front: "When is 24-hour pH monitoring most useful in GERD?"
    back: "Most useful if PPIs do not improve symptoms\n\nWhile the most accurate test for reflux, 24h pH monitoring is not routinely required - it's reserved for PPI-refractory cases."
    difficulty: medium
