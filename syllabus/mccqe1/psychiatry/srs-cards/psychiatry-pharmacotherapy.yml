# Psychiatry Pharmacotherapy (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What is the overall mechanism of action of antipsychotic medications?"
    back: "Antipsychotics functionally antagonize, to varying degrees, D2 (dopamine) activity in target brain pathways.\n\nAll antipsychotics are considered equally effective except for clozapine, which is the most effective for treatment-resistant schizophrenia. Atypical (second-generation) antipsychotics have lower risk of EPS and tardive dyskinesia but more metabolic side effects compared to typical (first-generation) antipsychotics."
    difficulty: easy
    tags: [psychiatry, antipsychotics, pharmacology, dopamine, schizophrenia]
  - front: "What are the Canadian guidelines for treating acute psychosis in the emergency setting?"
    back: "1. Haloperidol 5 mg IM + lorazepam 2 mg IM\n2. Loxapine PO or IM 25 mg + lorazepam 2 mg IM\n3. Olanzapine 2.5–10 mg (PO, IM, or oral quick dissolve — time to peak is 4–6 h same as regular PO)\n4. Risperidone 2 mg (M-tab or liquid)\n\nThese are the Canadian guidelines for acute agitation management. Inhaled loxapine is also available mainly for acute agitation. Long-acting depot preparations are generally better than oral preparations for overall outcomes, particularly for patients with schizophrenia who relapse due to non-adherence."
    difficulty: easy
    tags: [psychiatry, antipsychotics, emergency, acute psychosis, Canadian guidelines]
  - front: "Which antipsychotic is the most effective for treatment-resistant schizophrenia, and what monitoring is required?"
    back: "Clozapine (Clozaril®) is the most effective for treatment-resistant schizophrenia. Monitoring: weekly blood counts (CBC) for the first 6 months, then every 2 weeks, due to 1% risk of agranulocytosis.\n\nClozapine has the highest starting dose of 25 mg PO BID, a maintenance dose of 300–600 mg/day, and maximum 900 mg/day. It is contraindicated with existing leukopenia/neutropenia and should not be combined with other drugs that cause bone marrow suppression. It also reduces seizure threshold and carries risks of weight gain, metabolic effects, sedation, orthostatic hypotension, constipation/fecal impaction, and cardiomyopathy."
    difficulty: easy
    tags: [psychiatry, clozapine, treatment-resistant schizophrenia, agranulocytosis, monitoring]
  - front: "What is the risk of weight gain ranking among atypical antipsychotics?"
    back: "Clozapine > Olanzapine > Quetiapine > Risperidone (lowest weight gain risk among these four).\n\nWeight gain and metabolic effects are major concerns with atypical antipsychotics. Aripiprazole has less weight gain and lower risk of metabolic syndrome compared to olanzapine, and also has a lower incidence of EPS compared to haloperidol. Quetiapine is associated with slightly less weight gain than clozapine and olanzapine."
    difficulty: easy
    tags: [psychiatry, antipsychotics, weight gain, metabolic syndrome, side effects]
  - front: "Which antipsychotic has the highest risk of EPS/TD among second-generation antipsychotics (SGAs), and why might this be clinically relevant?"
    back: "Risperidone (and its active metabolite paliperidone) has the highest risk of EPS/TD among SGAs. It should be avoided in patients at high risk for EPS, those with existing movement disorders, and the elderly. It also causes elevated prolactin (sexual dysfunction, galactorrhea, gynecomastia, menstrual disturbance, infertility).\n\nRisperidone causes EPS at higher doses (>8 mg) but has lower incidence than typical antipsychotics at lower doses. Elevated prolactin distinguishes risperidone from most other SGAs. It is available in long-acting formulations (Risperdal Consta® IM q2 weeks and Invega Sustenna® q1 month / Trinza® q3 months for paliperidone)."
    difficulty: medium
    tags: [psychiatry, risperidone, EPS, tardive dyskinesia, prolactin, antipsychotics]
  - front: "What is Neuroleptic Malignant Syndrome (NMS), and what are its clinical features, treatment, and mortality?"
    back: "NMS is a psychiatric emergency caused by strong DA blockade from antipsychotics.\nClinical features (tetrad): Mental status changes (first), fever, rigidity, autonomic instability — develops over 24–72 hours.\nLabs: Elevated CPK, leukocytosis, myoglobinuria.\nTreatment: Discontinue antipsychotic, hydration, cooling blankets, dantrolene (muscle relaxant), bromocriptine (DA agonist).\nMortality: 5%\n\nRisk factors include high-potency or depot antipsychotics, sudden dose increase, male sex, young adults, medical illness, dehydration, exhaustion, poor nutrition, and external heat load. NMS must be distinguished from serotonin syndrome, which has different features and treatment."
    difficulty: easy
    tags: [psychiatry, NMS, neuroleptic malignant syndrome, antipsychotics, emergency]
  - front: "Compare acute dystonia and tardive dyskinesia: onset, high-risk populations, presentation, and treatment."
    back: "Acute Dystonia:\n- Onset: within 5 days\n- High risk: young Asian and Black males\n- Presentation: sustained muscle contractions, abnormal posture, oculogyric crisis, laryngospasm, torticollis\n- Treatment: benztropine or diphenhydramine IM\n\nTardive Dyskinesia:\n- Onset: >90 days, more commonly years\n- High risk: older patients\n- Presentation: purposeless involuntary constant movements of face/mouth musculature, rarely limbs or diaphragm\n- Treatment: no good standard treatment; consider clozapine, reduce dose, or valbenazine/deutetrabenazine (FDA-approved)\n\nAnticholinergic agents (benztropine, diphenhydramine) must NOT be given for tardive syndromes as they worsen the condition. Anticholinergics should only be prescribed when the patient is at high risk for acute EPS or when acute EPS develops — not routinely with all antipsychotics."
    difficulty: medium
    tags: [psychiatry, EPS, dystonia, tardive dyskinesia, antipsychotics, extrapyramidal]
  - front: "What are the features of Akathisia, and how does it differ from Parkinsonism as a drug-induced movement disorder?"
    back: "Akathisia:\n- Onset: within 10 days (acute) or >90 days (tardive)\n- Presentation: motor restlessness, crawling sensation in legs relieved by walking; very distressing, increases suicide risk and poor adherence\n- Treatment: lorazepam, propranolol, benztropine, or diphenhydramine; best approach is to reduce dose or switch to lower-potency atypical\n\nParkinsonism:\n- Onset: within 30 days (acute)\n- Presentation: tremor, cogwheel rigidity, akinesia, postural instability, decreased arm swing, stooped posture, shuffling gait\n- Treatment: benztropine (acute); reduce dose or change antipsychotic\n\nBoth akathisia and parkinsonism are more common in older females and are related to dopamine blockade. Akathisia is particularly important to recognize because patient distress can be mistaken for worsening psychosis, leading to inappropriate antipsychotic dose increases."
    difficulty: medium
    tags: [psychiatry, akathisia, drug-induced parkinsonism, EPS, antipsychotics]
  - front: "What is the onset of effect of antidepressants for neurovegetative symptoms versus emotional/cognitive symptoms?"
    back: "Neurovegetative/physical symptoms: 1–3 weeks\nEmotional/cognitive symptoms: 2–6 weeks\n\nThis lag period is clinically critical because neurovegetative symptoms (energy, sleep, appetite) may improve first while emotional symptoms (suicidal ideation, hopelessness) persist. Patients — especially children and adolescents — are at increased risk for suicidal behaviour during the first 2 weeks of antidepressant therapy and require vigilant monitoring."
    difficulty: easy
    tags: [psychiatry, antidepressants, SSRI, onset of action, suicidality, monitoring]
  - front: "Which SSRI is safest in pregnancy and breastfeeding, and which is most used in children and adolescents?"
    back: "Safest in pregnancy and breastfeeding: Sertraline (Zoloft®)\nMost used in children and adolescents (most evidence in this age group): Fluoxetine (Prozac®)\n\nFluoxetine does not require a taper due to its long half-life and is the most activating SSRI (should be taken in the AM). Citalopram and escitalopram have the fewest drug interactions and are sleep-wake neutral. Fluvoxamine is sedating (taken in PM) and involved in many drug-drug interactions."
    difficulty: easy
    tags: [psychiatry, SSRI, sertraline, fluoxetine, pregnancy, pediatrics]
  - front: "Why must antidepressants not be used as monotherapy for bipolar depression?"
    back: "Antidepressant monotherapy in bipolar disorder can provoke the emergence of mania. They should only be used in combination with a mood stabilizer or antipsychotic, and maintenance with antidepressants alone is generally not advisable.\n\nPatients with bipolar disorder (bipolar depression) should not be treated with an antidepressant as first-line therapy. The risk of switching to mania or hypomania with antidepressant monotherapy outweighs the benefit. CANMAT guidelines recommend mood stabilizers or atypical antipsychotics as first-line."
    difficulty: easy
    tags: [psychiatry, bipolar, antidepressants, mania, treatment]
  - front: "What are the key distinguishing features of bupropion (Wellbutrin®) compared to other antidepressants?"
    back: "- Class: NDRI (norepinephrine-dopamine reuptake inhibitor)\n- Less sexual dysfunction, less weight gain, less sedation than SSRIs/SNRIs\n- Increased seizure risk at higher doses\n- Contraindicated with history of seizure, stroke, brain tumour, or head injury\n- NOT recommended for anxiety disorders (stimulating effects)\n- Useful for seasonal depression and smoking cessation\n\nBupropion is available in IR, SR, and XL formulations (XL is the longest-acting). Dose: 100 mg starting, therapeutic 300–450 mg/day. Its lack of sexual side effects makes it useful as monotherapy for those with sexual dysfunction on SSRIs/SNRIs or as an augmenting agent."
    difficulty: easy
    tags: [psychiatry, bupropion, NDRI, antidepressants, seizure, sexual dysfunction]
  - front: "What are the clinical features and treatment of Serotonin Syndrome?"
    back: "Causes: Combinations producing excess serotonin — SSRI+SSRI, SSRI+SNRI, SSRI/SNRI+MAOI, SSRI+tryptophan, MAOI+meperidine\nSymptoms (FINISH mnemonic): Flu-like symptoms, Insomnia, Nausea, Imbalance, Sensory disturbances, Hyperarousal (anxiety/agitation); can progress to myoclonus, hyperthermia, rigor, hypertonicity\nTreatment: Discontinue medication and provide emergency medical care\n\nSerotonin syndrome results from overstimulation of the serotonergic system. It is rare but potentially life-threatening. It must be distinguished from NMS (which is caused by dopamine blockade and features lead-pipe rigidity and slower onset). Early recognition and drug discontinuation are critical."
    difficulty: easy
    tags: [psychiatry, serotonin syndrome, SSRI, MAOI, drug interaction, emergency]
  - front: "What is Antidepressant Discontinuation Syndrome? Which drugs are most associated with it, and how is it treated?"
    back: "Caused by abrupt cessation of antidepressants, most commonly paroxetine, fluvoxamine, and venlafaxine (shortest half-lives).\nSymptoms begin 1–3 days after stopping: anxiety, insomnia, irritability, mood lability, N/V, dizziness, headache, dystonia, tremor, chills, fatigue, myalgia ('flu-like symptoms')\nTreatment: Restart antidepressant at the same dose and taper slowly over several weeks; symptoms resolve within 24 hours of restarting.\n\nFluoxetine does NOT require a taper due to its long half-life, making it the least likely to cause discontinuation syndrome. Symptoms can last 1–3 weeks if untreated. The clinical significance is avoiding short-half-life drugs or planning adequate tapering before stopping."
    difficulty: easy
    tags: [psychiatry, antidepressants, discontinuation syndrome, paroxetine, venlafaxine, withdrawal]
  - front: "What are the indications, therapeutic levels, and key monitoring requirements for lithium?"
    back: "Indications: Acute mania (monotherapy or with adjunct SGA), Bipolar I depression, Bipolar disorder maintenance, augmentation of antidepressants in MDD and OCD, schizoaffective disorder, chronic aggression\nTherapeutic levels: Adults 0.8–1.0 mmol/L (1.0–1.25 mmol/L for acute mania); Geriatric: 0.6–0.8 mmol/L\nMonitoring: Serum levels every 5–7 days until therapeutic (always 12 h after last dose), then monthly, then q2–3 months; thyroid function and creatinine q6 months\n\nBefore initiating any mood stabilizer, baseline investigations include CBC with differential and platelets, ECG (if >45 years or cardiovascular risk), BUN, creatinine, extended electrolytes, TSH, and LFTs (for divalproex and carbamazepine). NSAIDs, thiazides, ACEIs, and metronidazole decrease lithium clearance and increase toxicity risk."
    difficulty: medium
    tags: [psychiatry, lithium, mood stabilizers, bipolar, monitoring, therapeutic levels]
  - front: "What is the major dermatological risk of lamotrigine and how is it mitigated?"
    back: "Stevens-Johnson Syndrome (SJS) — a potentially life-threatening skin emergency.\nMitigation: Very slow titration of lamotrigine dose. Dose must be adjusted (reduced) in patients taking other anticonvulsants such as divalproex. Monitor for skin rash; consider discontinuing if rash develops.\n\nLamotrigine is a first-line mood stabilizer primarily for bipolar I depression and maintenance. It has limited efficacy in preventing mania, especially as monotherapy. Starting dose is 100–200 mg/day (slower with divalproex co-administration). It is generally well tolerated aside from the SJS risk."
    difficulty: easy
    tags: [psychiatry, lamotrigine, Stevens-Johnson, mood stabilizers, bipolar, adverse effects]
  - front: "What are the major risks of divalproex (valproate) in women of reproductive age?"
    back: "1. Teratogenicity — neural tube defects (spina bifida)\n2. Polycystic Ovarian Syndrome (PCOS)\nA reliable contraceptive strategy is required for women of reproductive age taking divalproex.\n\nCarbamazepine also carries neural tube defect risk in pregnancy. Both divalproex and carbamazepine are teratogenic and require careful reproductive counselling. Divalproex monitoring includes LFTs weekly for 1 month, then monthly, then q2–3 months (risk of liver dysfunction), plus platelet monitoring and serum drug levels."
    difficulty: easy
    tags: [psychiatry, divalproex, valproate, teratogenicity, pregnancy, PCOS, mood stabilizers]
  - front: "What hematological risk is associated with carbamazepine and what monitoring is required?"
    back: "Agranulocytosis (rare) and transient leukopenia (10%). Monitoring: Weekly blood counts for the first month due to risk of agranulocytosis. Watch for signs of blood dyscrasias: fever, rash, sore throat, easy bruising.\n\nCarbamazepine is a second-line mood stabilizer for acute mania and bipolar maintenance. It is particularly useful for rapid cycling bipolar disorder and mixed phase/dysphoric mania. It also carries a 5% risk of skin rash and the risk of Stevens-Johnson syndrome (consider discontinuing). Neural tube defects can occur in pregnancy."
    difficulty: medium
    tags: [psychiatry, carbamazepine, agranulocytosis, mood stabilizers, monitoring, bipolar]
  - front: "What are the side effects of TCAs in overdose, and how is TCA toxicity treated?"
    back: "Presentation of TCA toxicity: Anticholinergic effects, CNS stimulation → depression and seizures, ECG: prolonged QRS and QTc (reflecting severity)\nTreatment: Activated charcoal, cathartics, supportive treatment, IV diazepam for seizures, physostigmine salicylate for coma. Do NOT give ipecac (causes rapid neurologic deterioration and seizures).\n\nTCAs are highly lethal in overdose; 3× the therapeutic dose may be lethal. They are used for OCD (clomipramine is gold standard), melancholic depression, and anxiety disorders. ECG monitoring is required when using TCAs. Secondary amines (nortriptyline, desipramine) are preferred over tertiary amines due to lower anticholinergic adverse effects."
    difficulty: medium
    tags: [psychiatry, TCA, tricyclic, overdose, toxicology, QRS prolongation]
  - front: "What dietary restriction is required with MAOIs, and what is the most dangerous interaction?"
    back: "MAOIs require a strict low-tyramine diet (avoid aged cheeses, wine, cured meats, fermented foods, etc.).\nMost dangerous interaction: Tyramine-rich foods cause hypertensive crises. Also: combining with serotonergic drugs (SSRI, SNRI, tryptophan) causes serotonin syndrome; MAOI + meperidine is particularly dangerous.\n\nMAOIs (phenelzine, tranylcypromine) are indicated for moderate/severe depression unresponsive to other antidepressants, atypical depression, and anxiety disorders. RIMAs (moclobemide) are reversible inhibitors of MAO-A and require the MAOI diet but carry a wider margin of safety in overdose than TCAs."
    difficulty: easy
    tags: [psychiatry, MAOI, tyramine, hypertensive crisis, serotonin syndrome, antidepressants]
  - front: "What are the SSRI-mediated serotonin receptor side effects and the receptor responsible for each?"
    back: "- 5-HT1A (central): Relief of depression, anxiolytic effect\n- 5-HT2A (spinal cord): Sexual dysfunction — delayed ejaculation, anorgasmia, decreased libido\n- 5-HT2A/2C (brain): Activation — anxiety, insomnia (worst with fluoxetine and paroxetine; warn patients about worsening anxiety in first 1–2 weeks)\n- 5-HT3A (gut): GI upset — nausea, vomiting, bloating\n\nUnderstanding receptor-mediated effects guides clinical management. For example, GI side effects typically improve within 1–2 weeks. Activation/anxiety symptoms initially worsen and then improve. Sexual dysfunction tends to persist and may require dose reduction, drug switch, or augmentation with bupropion or mirtazapine."
    difficulty: medium
    tags: [psychiatry, SSRI, serotonin receptors, side effects, pharmacology]
  - front: "What are the strategies for managing an antidepressant that provides only a partial response?"
    back: "1. Optimization: increase dose to maximum tolerated or highest therapeutic dose\n2. Augmentation: add a non-antidepressant (e.g., thyroid hormone, lithium, atypical antipsychotics — aripiprazole, quetiapine, olanzapine, risperidone)\n3. Combination: add another antidepressant (e.g., bupropion or mirtazapine to an SSRI or SNRI)\n4. Switch: change the primary antidepressant (within or outside class)\n\nAccording to CANMAT guidelines, full treatment to remission (not just response) is essential to decrease relapse rates. The sequence typically follows optimization → augmentation/combination → switch. Treatment to remission is the goal as residual symptoms predict relapse."
    difficulty: easy
    tags: [psychiatry, antidepressants, treatment resistant depression, augmentation, CANMAT]
  - front: "What is the role of long-acting injectable (LAI) antipsychotics, and what is required before the first injection?"
    back: "Role: Originally for schizophrenia patients who relapse due to non-adherence; current evidence suggests LAIs may be better than oral preparations overall for outcomes.\nRequirement before first injection: Patient must have been exposed to an oral or short-term injectable form of the antipsychotic first.\nSide effects: Similar to oral preparation; may have pain at injection site.\n\nLAIs are formulated in oil for IM injection and are given on an outpatient basis. Dosing is guided by equivalence tables for oral dosing or pre-set starting schedules. Examples include Risperdal Consta® (q2 weeks), Invega Sustenna® (monthly), and Invega Trinza® (every 3 months)."
    difficulty: easy
    tags: [psychiatry, antipsychotics, long-acting injectable, schizophrenia, adherence]
  - front: "What are the indications and SSRI advantages of mirtazapine (Remeron®)?"
    back: "Indications: Depression with prominent insomnia, agitation, or cachexia/weight loss.\nClass: NaSSA (noradrenergic and specific serotonergic agent)\nMechanism: Inhibits presynaptic α-2 adrenergic receptors (disinhibits serotonin and NE release); antihistamine effects cause sedation and weight gain.\nAdvantages: Sedation useful for insomnia; weight gain useful in patients with cachexia; fewer sexual side effects than SSRIs.\n\nMirtazapine starting dose is 15 mg, therapeutic 15–45 mg/day. Paradoxically, lower doses tend to be more sedating due to greater antihistamine activity. It is commonly combined with SSRIs/SNRIs (California rocket fuel with venlafaxine) due to complementary mechanisms. Key side effect: increased cholesterol and triglycerides."
    difficulty: easy
    tags: [psychiatry, mirtazapine, NaSSA, antidepressants, insomnia, weight gain]
  - front: "What is the difference between augmentation and combination in antidepressant therapy?"
    back: "Augmentation: Addition of a medication that is NOT an antidepressant to an existing antidepressant regimen (e.g., thyroid hormone, lithium, atypical antipsychotics such as aripiprazole, quetiapine, olanzapine, risperidone)\nCombination: Addition of ANOTHER antidepressant to an existing antidepressant regimen (e.g., adding bupropion or mirtazapine to an SSRI or SNRI)\n\nBoth strategies are used when optimization (dose increase) has been insufficient. The distinction is important for MCCQE1 as questions may ask specifically about the definition of each. Both approaches aim for remission rather than just symptom response, as residual symptoms increase relapse risk."
    difficulty: easy
    tags: [psychiatry, antidepressants, augmentation, combination therapy, treatment resistant depression]
  - front: "What are the antipsychotic-associated side effects by receptor system?"
    back: "- Anticholinergic: dry mouth, urinary retention, constipation, blurred vision, confusion\n- α-adrenergic blockade: orthostatic hypotension, erectile dysfunction, failure to ejaculate\n- Dopaminergic blockade: EPS, galactorrhea, amenorrhea, erectile dysfunction, weight gain\n- Anti-histamine: sedation, weight gain\n- Hematologic: agranulocytosis (clozapine)\n- Hypersensitivity: liver dysfunction, blood dyscrasias, skin rashes, NMS, altered temperature regulation\n- Endocrine: metabolic syndrome\n- Cardiac: QT prolongation\n\nUnderstanding the receptor basis of antipsychotic side effects helps predict which drug is most appropriate for a given patient. For example, high-potency typicals (haloperidol) have more EPS but fewer metabolic effects; low-potency typicals (chlorpromazine) have more anticholinergic, sedating, and orthostatic effects."
    difficulty: medium
    tags: [psychiatry, antipsychotics, side effects, receptor, pharmacology]
  - front: "Which antidepressant class is contraindicated in combination with MAOIs and why?"
    back: "SSRIs, SNRIs, TCAs (especially clomipramine), and tryptophan are all contraindicated with MAOIs due to the risk of serotonin syndrome. Meperidine (opioid) is also specifically dangerous with MAOIs. These combinations can cause life-threatening serotonin toxicity.\n\nMAOIs inhibit the breakdown of serotonin, dopamine, and norepinephrine. Adding any serotonergic drug creates excess serotonin — serotonin syndrome. A washout period is required when switching between MAOIs and these agents (typically 2 weeks, or 5 weeks when stopping fluoxetine due to its long half-life)."
    difficulty: medium
    tags: [psychiatry, MAOI, drug interactions, serotonin syndrome, contraindications]
