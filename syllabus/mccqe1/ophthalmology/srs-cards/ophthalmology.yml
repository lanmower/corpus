# Ophthalmology (Ophthalmology) - generated from srs-mccqe1
cards:
  - front: "What is the most common cause of epiphora (excessive tearing)?"
    back: "Dry eyes (reflexive tearing) — if tear quality is insufficient, reflexive tearing may occur. Other causes include lid/lash malposition, inflammation, and lacrimal drainage obstruction.\n\nParadoxically, dry eyes can cause excessive tearing through a reflex mechanism. Nasolacrimal duct obstruction is the most common anatomical cause and is evaluated with the Jones dye test and fluorescein staining."
    difficulty: easy
    tags: [ophthalmology, epiphora, lacrimal]
  - front: "What is the most common cause of acute dacryocystitis in adults?"
    back: "Gram-positive bacteria (S. aureus, S. pneumoniae) secondary to nasolacrimal duct obstruction\n\nDacryocystitis presents with pain, swelling, and redness over the lacrimal sac below the medial canthus. Treatment includes warm compresses, systemic antibiotics, and once infection resolves, dacryocystorhinostomy."
    difficulty: easy
    tags: [ophthalmology, dacryocystitis]
  - front: "What is the most common cause of ptosis?"
    back: "Aponeurotic ptosis — disinsertion or dehiscence of the levator aponeurosis, associated with aging\n\nPtosis can also be caused by CNIII palsy, Horner's syndrome, myasthenia gravis, or congenital defects. Surgical correction depends on severity and levator function: Müller-conjunctival resection for mild (<2 mm), levator advancement for moderate."
    difficulty: easy
    tags: [ophthalmology, ptosis, eyelid]
  - front: "How do you differentiate a hordeolum (stye) from a chalazion?"
    back: "Hordeolum: acute, painful, red, infected (S. aureus), involves lid glands. Chalazion: chronic, painless, granulomatous inflammation of meibomian gland, often preceded by hordeolum.\n\nBoth are treated with warm compresses and lid hygiene. Chronic recurrent chalazia must be biopsied to rule out sebaceous cell or meibomian gland carcinoma."
    difficulty: easy
    tags: [ophthalmology, hordeolum, chalazion]
  - front: "What discharge type helps differentiate the cause of conjunctivitis?"
    back: "Allergic: mucoid. Viral: watery. Bacterial: purulent. Chlamydial: mucopurulent.\n\nFollicles are usually seen in viral and chlamydial conjunctivitis, while papillae are seen in allergic and bacterial conjunctivitis. Viral conjunctivitis (adenovirus) is highly contagious for up to 12 days."
    difficulty: easy
    tags: [ophthalmology, conjunctivitis]
  - front: "What is the leading infectious cause of blindness worldwide?"
    back: "Trachoma (Chlamydia trachomatis)\n\nTrachoma is associated with poor hygiene in dry environments. Chronic infection causes scarring of superior tarsal conjunctiva (Arlt's line), Herbert's pits at the limbus, and fibrovascular pannus. Treatment includes oral azithromycin and facial cleanliness."
    difficulty: easy
    tags: [ophthalmology, trachoma, chlamydia]
  - front: "How do you differentiate episcleritis from scleritis?"
    back: "Episcleritis: mild discomfort, sectoral injection, blanches with topical phenylephrine, self-limited. Scleritis: severe deep/boring pain (worst at night), violaceous hue, does NOT blanch with phenylephrine, vision-threatening.\n\nScleritis is often associated with systemic autoimmune diseases (RA, GPA, SLE) and has increased 5-year mortality from untreated underlying disease. It requires urgent ophthalmology referral and systemic treatment."
    difficulty: medium
    tags: [ophthalmology, episcleritis, scleritis]
  - front: "What are the 5 layers of the cornea (anterior to posterior)?"
    back: "Epithelium, Bowman's layer, Stroma, Descemet's membrane, Endothelium (ABCDE: Anterior epithelium, Bowman's, Corneal stroma, Descemet's, Endothelium)\n\nThe endothelium dehydrates the cornea and its dysfunction leads to corneal edema. The cornea has an extensive V1 sensory fiber network making abrasions very painful. Corneal transparency depends on avascularity and deturgescence."
    difficulty: easy
    tags: [ophthalmology, cornea, anatomy]
  - front: "Why should topical anesthetics NEVER be used as treatment for corneal abrasions?"
    back: "Risk of corneal melt and infection — topical anesthetics should only be used to facilitate examination\n\nCorneal abrasions are treated with topical antibiotics (fluoroquinolones), consideration of cycloplegic agents for pain, and potentially bandage contact lens. Patching is avoided in contact lens wearers or abrasions from organic material."
    difficulty: medium
    tags: [ophthalmology, corneal-abrasion]
  - front: "What is the classic finding in herpes simplex keratitis?"
    back: "Dendritic (thin, branching) lesion with terminal end bulbs on the corneal epithelium that stains with fluorescein\n\nHSV keratitis is usually caused by HSV-1. Treatment includes oral and topical antivirals. Steroids should NOT be used initially for epithelial disease as they may exacerbate the condition. Corneal hypoesthesia is characteristic."
    difficulty: medium
    tags: [ophthalmology, HSV-keratitis, cornea]
  - front: "What is Hutchinson's sign in herpes zoster ophthalmicus?"
    back: "Involvement of the tip of the nose (nasociliary branch of V1), indicating that the globe will be involved in ~75% of cases\n\nHerpes zoster ophthalmicus occurs from reactivation of latent VZV in the V1 dermatome. Treatment is immediate oral antivirals (acyclovir, valacyclovir, or famciclovir). Prevention with vaccination in immunocompetent patients is recommended."
    difficulty: medium
    tags: [ophthalmology, herpes-zoster, Hutchinson-sign]
  - front: "What systemic conditions are associated with keratoconus?"
    back: "Down syndrome, atopy, contact lens use, and chronic eye rubbing\n\nKeratoconus is bilateral asymmetric thinning and bulging of the cornea causing irregular astigmatism. Munson's sign (bulging of lower eyelid when looking down) is diagnostic. Treatment ranges from rigid contact lenses to corneal cross-linking to keratoplasty."
    difficulty: medium
    tags: [ophthalmology, keratoconus]
  - front: "What corneal finding is associated with Wilson's disease?"
    back: "Kayser-Fleischer ring — brown-yellow-green pigmented ring in peripheral cornea due to copper deposition in Descemet's membrane\n\nKayser-Fleischer rings start inferiorly and are pathognomonic for Wilson's disease (hepatolenticular degeneration). They are best visualized with slit-lamp examination. Arcus senilis in a patient <40 years suggests hypercholesterolemia."
    difficulty: easy
    tags: [ophthalmology, Wilson-disease, Kayser-Fleischer]
  - front: "What are the most common causes of anterior uveitis associated with HLA-B27?"
    back: "Reactive arthritis, ankylosing spondylitis, psoriatic arthritis, and inflammatory bowel disease\n\nAnterior uveitis presents with photophobia, pain, ciliary flush, and anterior chamber cells/flare. Posterior synechiae (adhesions of iris to lens) can occur and may lead to angle closure glaucoma if 360 degrees."
    difficulty: medium
    tags: [ophthalmology, uveitis, HLA-B27]
  - front: "What is the most common cause of reversible blindness worldwide?"
    back: "Cataracts\n\nAge-related cataracts account for >90% of cases. Types include nuclear sclerosis (myopic shift/'second sight'), cortical (spoke-like opacities), and posterior subcapsular (associated with steroids, diabetes, uveitis). Surgery (phacoemulsification) is definitive."
    difficulty: easy
    tags: [ophthalmology, cataracts]
  - front: "What is the hallmark fundoscopic finding in central retinal artery occlusion (CRAO)?"
    back: "Cherry-red spot at the macula (fovea is visible through thinned retina supplied by choroidal circulation) with surrounding pale, edematous retina\n\nCRAO is an ocular emergency — treatment must be initiated within 2 hours of symptom onset. Causes include emboli from carotid/heart, thrombus, and GCA. Globe massage and IOP-lowering agents are used to dislodge emboli."
    difficulty: medium
    tags: [ophthalmology, CRAO, retina]
  - front: "What is the fundoscopic appearance of central retinal vein occlusion (CRVO)?"
    back: "'Blood and thunder' appearance — diffuse retinal hemorrhages, cotton wool spots, venous engorgement, swollen optic disc, macular edema\n\nCRVO is associated with HTN, DM, glaucoma, and hyperviscosity states. Complications include neovascularization leading to secondary glaucoma. Treatment includes anti-VEGF injections and retinal laser photocoagulation."
    difficulty: medium
    tags: [ophthalmology, CRVO, retina]
  - front: "What is the most common type of retinal detachment?"
    back: "Rhegmatogenous — caused by a tear/hole in the neurosensory retina allowing vitreous fluid to enter the subretinal space\n\nPresents with flashes of light, floaters, curtain of blackness, and decreased IOP. Macula-on detachments are emergencies. Risk increases with age, high myopia, and ocular surgery/trauma. Treatment includes scleral buckle, pneumatic retinopexy, or vitrectomy."
    difficulty: easy
    tags: [ophthalmology, retinal-detachment]
  - front: "What is the triad of retinitis pigmentosa on fundoscopy?"
    back: "APO: Arteriolar narrowing, Perivascular bone-spicule Pigmentation, Optic disc pallor\n\nRetinitis pigmentosa is a hereditary degenerative retinal disease (most commonly autosomal recessive). Presents with night blindness, tunnel vision, and glare. ERG shows decreased rod responses. Vitamin A supplementation can slow progression."
    difficulty: medium
    tags: [ophthalmology, retinitis-pigmentosa]
  - front: "What percentage of AMD cases are 'wet' (neovascular), and what proportion of AMD vision loss do they cause?"
    back: "Wet AMD is 10% of cases but responsible for 80% of AMD-related vision loss\n\nWet AMD involves choroidal neovascularization through breaks in Bruch's membrane. Treatment is intravitreal anti-VEGF injections (ranibizumab, aflibercept, bevacizumab). Dry AMD features drusen and geographic atrophy with slowly progressive loss."
    difficulty: medium
    tags: [ophthalmology, AMD, macular-degeneration]
  - front: "What is the most common cause of ptosis (blepharoptosis)?"
    back: "Aponeurotic ptosis — disinsertion or dehiscence of the levator aponeurosis, associated with advancing age.\n\nAponeurotic ptosis is the most common cause overall, occurring due to age-related stretching of the levator aponeurosis. Other causes include neuromuscular (myasthenia gravis, CN III palsy), mechanical (mass/scarring), and congenital etiologies."
    difficulty: easy
    tags: [ophthalmology, eyelid, ptosis]
  - front: "A patient presents with a painless, firm, non-tender nodule on the eyelid that has been present for several weeks. What is the most likely diagnosis, and when should you biopsy?"
    back: "Chalazion — a chronic granulomatous inflammation of a meibomian gland. Biopsy chronic recurrent lesions to rule out sebaceous cell carcinoma.\n\nChalazion is a chronic, painless lesion that often follows an internal hordeolum. Unlike the acute, tender presentation of a hordeolum, chalazion lacks acute inflammatory signs. A chronic recurrent chalazion must be biopsied because it can mimic sebaceous cell carcinoma."
    difficulty: medium
    tags: [ophthalmology, eyelid, chalazion]
  - front: "What are the distinguishing features of anterior vs. posterior blepharitis?"
    back: "Anterior: Staphylococcal (ulcerative, dry scales) or seborrheic (greasy scales, no ulcers). Posterior: meibomian gland dysfunction with thickened secretions and 'toothpaste sign.'\n\nBlepharitis is classified by location. Anterior blepharitis affects the eyelash base and is caused by Staphylococcus or seborrheic dermatitis. Posterior blepharitis involves meibomian gland dysfunction and may cause poor tear film leading to keratitis and corneal complications."
    difficulty: easy
    tags: [ophthalmology, eyelid, blepharitis]
  - front: "How do you differentiate a pterygium from a pinguecula?"
    back: "A pterygium is a fibrovascular wing-like growth that encroaches onto the cornea, while a pinguecula is a yellow-white deposit adjacent to the limbus that spares the cornea.\n\nBoth are degenerative conditions associated with UV exposure. The key distinction is corneal involvement: pterygium crosses the limbus onto the cornea and can induce astigmatism, while pinguecula remains on the conjunctiva. Pterygium recurrence after excision is reduced with conjunctival autograft."
    difficulty: easy
    tags: [ophthalmology, conjunctiva, pterygium, pinguecula]
  - front: "What discharge type is associated with each major cause of conjunctivitis: allergic, viral, bacterial, and chlamydial?"
    back: "Allergic: mucoid. Viral: watery. Bacterial: purulent. Chlamydial: mucopurulent.\n\nThe character of discharge helps narrow the etiology. Viral conjunctivitis is the most common type and presents with follicles and preauricular lymphadenopathy. Bacterial conjunctivitis presents with papillae and purulent discharge. Allergic conjunctivitis is characterized by itching and papillae."
    difficulty: easy
    tags: [ophthalmology, conjunctivitis, red-eye]
  - front: "How do you distinguish episcleritis from scleritis clinically?"
    back: "Episcleritis: mild discomfort, sectoral injection that blanches with topical phenylephrine, self-limited. Scleritis: severe deep/boring pain (may wake patient at night), violaceous hue, does NOT blanch with phenylephrine.\n\nTopical phenylephrine 2.5% constricts superficial episcleral vessels, causing blanching in episcleritis but not in scleritis where deeper scleral vessels are inflamed. Scleritis is often associated with systemic autoimmune disease (especially RA) and can be vision-threatening."
    difficulty: medium
    tags: [ophthalmology, scleritis, episcleritis, red-eye]
  - front: "What are the five layers of the cornea from anterior to posterior?"
    back: "Epithelium, Bowman's layer, Stroma, Descemet's membrane, Endothelium (mnemonic: ABCDE — Anterior epithelium, Bowman's, Corneal stroma, Descemet's, Endothelium).\n\nThe corneal endothelium actively dehydrates the cornea; dysfunction leads to corneal edema. The cornea contributes approximately two-thirds of the total refractive power of the eye and has extensive sensory innervation from CN V1, making abrasions very painful."
    difficulty: easy
    tags: [ophthalmology, cornea, anatomy]
  - front: "Why should topical anesthetics never be prescribed for treatment of corneal abrasion?"
    back: "They risk corneal melt (keratolysis) and infection with prolonged use, and they impair corneal healing.\n\nTopical anesthetics should only be used to facilitate examination, never as treatment. Corneal abrasions are treated with topical antibiotics, cycloplegics for pain, and optional patching. Contact lens-related or organic material abrasions require antipseudomonal coverage (e.g., moxifloxacin)."
    difficulty: easy
    tags: [ophthalmology, cornea, corneal-abrasion]
  - front: "What is the classic finding of HSV epithelial keratitis on slit lamp examination?"
    back: "A dendritic (thin, branching) lesion with terminal end bulbs that stains with fluorescein.\n\nHSV keratitis is the most common infectious cause of corneal blindness in developed countries. Treatment includes oral or topical antivirals. Steroids should NOT be used initially for epithelial disease as they can worsen the condition. An ophthalmologist must supervise steroid use for stromal keratitis."
    difficulty: easy
    tags: [ophthalmology, cornea, herpes-keratitis]
  - front: "What does Hutchinson's sign indicate in herpes zoster ophthalmicus?"
    back: "Involvement of the tip of the nose (nasociliary branch of V1) indicates approximately 75% chance of ocular involvement.\n\nHerpes zoster ophthalmicus is a reactivation of VZV in the V1 dermatome. Even without nasal involvement, the eye is affected in one-third of patients. Complications include sclerokeratitis, uveitis, secondary glaucoma, acute retinal necrosis, and postherpetic neuralgia."
    difficulty: easy
    tags: [ophthalmology, cornea, herpes-zoster]
  - front: "What is the most common cause of anterior uveitis (iritis) associated with HLA-B27?"
    back: "Ankylosing spondylitis, reactive arthritis, psoriatic arthritis, and inflammatory bowel disease.\n\nAnterior uveitis presents with photophobia, pain, ciliary flush, and anterior chamber cells/flare. HLA-B27-associated conditions are the most common identifiable causes. Treatment includes mydriatics to prevent posterior synechiae and topical/systemic steroids. Posterior synechiae can lead to angle-closure glaucoma if 360 degrees."
    difficulty: medium
    tags: [ophthalmology, uveitis, anterior-uveitis]
  - front: "What is the 'second sight' phenomenon in cataracts?"
    back: "A myopic shift where the patient develops increased near-sightedness due to increased refractive power of the lens in nuclear sclerosis cataracts.\n\nIn nuclear sclerosis, the lens becomes denser and more convex, increasing its refractive power. Patients may temporarily find they no longer need reading glasses, which is why it is called 'second sight.' This finding is specific to nuclear sclerosis and not seen in cortical or posterior subcapsular cataracts."
    difficulty: medium
    tags: [ophthalmology, cataracts, nuclear-sclerosis]
  - front: "What are the three types of retinal detachment and their respective mechanisms?"
    back: "1) Rhegmatogenous (most common): tear/hole allows vitreous fluid into subretinal space. 2) Tractional: vitreoretinal membrane pulls retina away from RPE. 3) Exudative: fluid accumulation from vascular transudation or RPE damage.\n\nRhegmatogenous RD is the most common type, often caused by posterior vitreous detachment, high myopia, or trauma. Tractional RD is seen in diabetic retinopathy. Exudative RD is caused by tumors or posterior uveitis. RD is an emergency, especially when the macula is still attached."
    difficulty: medium
    tags: [ophthalmology, retinal-detachment, retina]
  - front: "A patient presents with sudden painless monocular vision loss, and fundoscopy reveals a 'cherry-red spot.' What is the diagnosis and how urgently must it be treated?"
    back: "Central retinal artery occlusion (CRAO). Treatment must be initiated within 2 hours — irreversible retinal damage occurs after 90 minutes of complete occlusion.\n\nCRAO is an ocular emergency. The cherry-red spot appears because the fovea (which is thin and avascular) allows the underlying choroidal vasculature to show through, contrasting with the surrounding pale edematous retina. Emergency treatment includes globe massage, topical beta-blocker, IV acetazolamide, and anterior chamber paracentesis."
    difficulty: medium
    tags: [ophthalmology, retina, CRAO, vascular]
  - front: "What is the classic fundoscopic appearance of central retinal vein occlusion (CRVO)?"
    back: "'Blood and thunder' appearance — diffuse retinal hemorrhages, cotton wool spots, venous engorgement, swollen optic disc, and macular edema.\n\nCRVO is the second most frequent vascular retinal disorder after diabetic retinopathy. It is classified as non-ischemic (mild, better prognosis) or ischemic (severe, with RAPD, poor visual prognosis). A major complication is neovascularization leading to neovascular glaucoma. Treatment includes intravitreal anti-VEGF and laser."
    difficulty: easy
    tags: [ophthalmology, retina, CRVO, vascular]
  - front: "What is the most common type of glaucoma, and what are its major risk factors?"
    back: "Primary open-angle glaucoma (>95% of cases). Major risk factors: elevated IOP (>21 mmHg), age, African descent, family history, and thin central cornea.\n\nPOAG is insidious and asymptomatic in early stages. It causes progressive, irreversible peripheral vision loss with characteristic optic disc cupping (increased cup-to-disc ratio). Elevated IOP is the only modifiable risk factor proven to prevent progression. Screening is critical for early detection."
    difficulty: easy
    tags: [ophthalmology, glaucoma, POAG]
  - front: "A patient presents with a painful red eye, halos around lights, nausea/vomiting, a fixed mid-dilated pupil, and IOP >40 mmHg. What is the diagnosis and definitive treatment?"
    back: "Acute primary angle-closure glaucoma. Definitive treatment is laser peripheral iridotomy.\n\nThis is an ocular emergency. The peripheral iris bows forward, blocking aqueous access to the trabecular meshwork. Risk factors include hyperopia, age >70, female sex, Asian/Inuit descent, and pupil dilation. Immediate medical treatment includes aqueous suppressants, hyperosmotic agents (oral glycerine or IV mannitol), and pilocarpine to reverse pupillary block."
    difficulty: medium
    tags: [ophthalmology, glaucoma, angle-closure]
  - front: "What features distinguish primary open-angle glaucoma from acute angle-closure glaucoma?"
    back: "POAG: insidious, painless, bilateral, moderately high IOP, normal pupil, no halos or N/V. AACG: acute, painful red eye, unilateral, extremely high IOP, fixed mid-dilated pupil, halos around lights, N/V and abdominal pain.\n\nPOAG is the most common form (95%) while AACG is rare (5%). POAG is more common in Black and Hispanic individuals while AACG is more common in Asian and Inuit populations. AACG is an emergency requiring immediate IOP reduction to prevent irreversible vision loss within hours."
    difficulty: medium
    tags: [ophthalmology, glaucoma, POAG, angle-closure]
  - front: "What is the triad of Horner's syndrome?"
    back: "Miosis, Anhidrosis, Ptosis (MAP).\n\nHorner's syndrome results from interruption of the sympathetic pathway. Anisocoria is greater in dim light. The most common diagnostic test is topical apraclonidine (reversal of anisocoria due to denervation hypersensitivity). Acute Horner's (<14 days) requires urgent workup to rule out carotid artery dissection."
    difficulty: easy
    tags: [ophthalmology, neuro-ophthalmology, horner-syndrome]
  - front: "How does a relative afferent pupillary defect (RAPD / Marcus Gunn pupil) present on the swinging flashlight test?"
    back: "When light is quickly moved from the normal eye to the affected eye, both pupils paradoxically dilate instead of constricting.\n\nRAPD indicates a lesion in the afferent visual pathway anterior to the optic chiasm (e.g., optic neuritis, ischemic optic neuropathy, large retinal detachment, CRAO). Importantly, cataracts NEVER produce a RAPD. It does not occur with symmetric optic neuropathies since it is a relative test."
    difficulty: easy
    tags: [ophthalmology, neuro-ophthalmology, RAPD, pupils]
  - front: "What is the most common primary intraocular malignancy in adults?"
    back: "Uveal melanoma, with 90% being choroidal melanomas.\n\nUveal melanoma is more prevalent in White individuals. It presents as a pigmented dome-shaped mass and predominantly metastasizes to the liver. Treatment depends on tumor size: brachytherapy vs. external beam radiotherapy for smaller tumors, enucleation for larger ones. Systemic imaging every 3-6 months for the first 5 years is recommended."
    difficulty: easy
    tags: [ophthalmology, malignancy, uveal-melanoma]
  - front: "What is the most common cause of blindness in working-age adults in North America?"
    back: "Diabetic retinopathy.\n\nDR is classified as non-proliferative (microaneurysms, hemorrhages, hard exudates), pre-proliferative/advanced non-proliferative (IRMA, cotton wool spots), and proliferative (neovascularization). Macular edema is the most common cause of vision loss in background DR. Tight glycemic control is the primary prevention strategy."
    difficulty: easy
    tags: [ophthalmology, diabetic-retinopathy, retina]
  - front: "What is the most common cause of irreversible blindness in industrialized countries?"
    back: "Age-related macular degeneration (AMD).\n\nAMD is classified as dry/non-neovascular (90% of cases, drusen, geographic atrophy) and wet/neovascular (10% of cases but responsible for 80% of AMD-related vision loss, choroidal neovascularization). Wet AMD is treated with intravitreal anti-VEGF injections. The AREDS2 formulation with antioxidants may slow progression."
    difficulty: easy
    tags: [ophthalmology, AMD, macular-degeneration, retina]
  - front: "In a child presenting with leukocoria (white pupillary reflex), what is the most important diagnosis to rule out?"
    back: "Retinoblastoma — the most common primary intraocular malignancy in children.\n\nRetinoblastoma is associated with RB1 tumor suppressor gene inactivation. It can be sporadic or hereditary. Bilateral cases are more likely inherited. Other causes of leukocoria include congenital cataracts, Coats disease, retinopathy of prematurity, and persistent fetal vasculature. Leukocoria warrants urgent ophthalmology referral."
    difficulty: medium
    tags: [ophthalmology, pediatric, retinoblastoma, leukocoria]
  - front: "What is the classic triad of congenital glaucoma?"
    back: "Photophobia, epiphora (tearing), and blepharospasm.\n\nCongenital glaucoma presents with cloudy cornea due to edema, Haab's striae (breaks in Descemet's membrane), and buphthalmos (enlarged globe). Epiphora in children should always prompt consideration of congenital glaucoma. It is more common in males and may be associated with Sturge-Weber syndrome."
    difficulty: easy
    tags: [ophthalmology, pediatric, congenital-glaucoma]
  - front: "In optic neuritis associated with multiple sclerosis, why should oral steroids NOT be used alone?"
    back: "Oral steroids alone increase the risk of developing MS. IV steroids with taper to oral form is the recommended treatment.\n\nThe Optic Neuritis Treatment Trial showed that oral prednisone alone was associated with an increased recurrence rate compared to IV methylprednisolone. IV steroids hasten visual recovery but do not change long-term visual outcome. White matter demyelinating lesions of the optic nerve are seen on MRI."
    difficulty: medium
    tags: [ophthalmology, neuro-ophthalmology, optic-neuritis, multiple-sclerosis]
  - front: "What is giant cell arteritis (temporal arteritis), and why is it an ophthalmologic emergency?"
    back: "An inflammatory vasculitis of medium-to-large arteries affecting women >60 yr, causing ischemic optic neuropathy with very high risk of vision loss in the contralateral eye if untreated.\n\nClinical features include sudden vision loss, temporal artery tenderness, jaw claudication, scalp tenderness, and PMR. Elevated ESR and CRP are characteristic. If GCA is clinically suspected, start high-dose corticosteroids STAT and perform temporal artery biopsy within 2 weeks."
    difficulty: medium
    tags: [ophthalmology, giant-cell-arteritis, neuro-ophthalmology]
  - front: "A pupil that does not respond to light but constricts with accommodation (light-near dissociation), is bilateral, irregular, and <3 mm — what condition should you suspect?"
    back: "Argyll-Robertson pupil, suggestive of neurosyphilis.\n\nArgyll-Robertson pupils are small, irregular, and demonstrate light-near dissociation (poor response to light, preserved accommodation). While classically associated with neurosyphilis, similar findings can occur in diabetes, encephalitis, MS, and chronic alcoholism. A full STI workup is warranted."
    difficulty: medium
    tags: [ophthalmology, neuro-ophthalmology, argyll-robertson, pupils]
  - front: "What is the most common cause of unilateral or bilateral proptosis in adults?"
    back: "Graves' disease (thyroid eye disease).\n\nGraves' ophthalmopathy is caused by increased fibroblast proliferation and accumulation of glycosaminoglycans in extraocular muscles and orbital tissues. The progression follows NO SPECS: No signs, Only lid retraction/lag, Soft tissue swelling, Proptosis, Extraocular muscle weakness, Corneal exposure, Sight loss."
    difficulty: easy
    tags: [ophthalmology, orbit, graves-disease, proptosis]
  - front: "What is the most common cause of endophthalmitis?"
    back: "Postoperative complication, most commonly after cataract surgery (risk <0.1%).\n\nEndophthalmitis is an intraocular infection presenting as a painful red eye with severely reduced VA, hypopyon, and reduced red reflex. It is an ocular emergency. Patients with LP (light perception) or worse vision require immediate vitrectomy with intravitreal antibiotics. It can also follow penetrating injury (3-7% risk)."
    difficulty: easy
    tags: [ophthalmology, endophthalmitis, emergency]
  - front: "What are the 10 layers of the retina from inner (vitreous side) to outer (choroid side)?"
    back: "1. Inner limiting membrane\n2. Nerve fibre layer\n3. Ganglion cell layer\n4. Inner plexiform layer\n5. Inner nuclear layer\n6. Outer plexiform layer\n7. Outer nuclear layer\n8. Outer limiting membrane\n9. Photoreceptor layer\n10. Retinal pigmented epithelium (RPE)\n\nThe retina has 10 distinct layers. Light passes through them in reverse order (from inner to outer) before reaching the photoreceptors. Bruch's membrane lies between the RPE and the choroid. Understanding the layers is essential for interpreting OCT findings and pathologies such as AMD (RPE/Bruch's) and retinal detachment (between photoreceptors and RPE)."
    difficulty: medium
    tags: [ophthalmology, retina, anatomy, histology]
  - front: "What are the three layers of the tear film and what produces each?"
    back: "1. Outer oily layer — secreted by meibomian glands (reduces evaporation)\n2. Middle aqueous layer — constant secretion from conjunctival glands; reflex secretion by lacrimal gland\n3. Inner mucinous layer — mucin secreted by conjunctival goblet cells (aids tear adherence to cornea)\n\nThe tear film is a trilaminar structure. Dysfunction of any layer causes dry eye syndrome. Meibomian gland dysfunction (posterior blepharitis) causes evaporative DES. Goblet cell loss (vitamin A deficiency, trachoma) disrupts the mucin layer. Lacrimal gland hypofunction (Sjögren's) causes aqueous deficiency."
    difficulty: easy
    tags: [ophthalmology, lacrimal, tear film, dry eye]
  - front: "Describe the tear drainage pathway from the eye to the nasal cavity."
    back: "Tears drain from the eyes → upper and lower lacrimal puncta → superior and inferior canaliculi → lacrimal sac → nasolacrimal duct → nasal cavity behind the inferior concha (valve of Hasner).\n\nUnderstanding tear drainage is critical for diagnosing epiphora and dacryocystitis. Obstruction at any point (punctal stenosis, canalicular blockage, nasolacrimal duct obstruction) causes epiphora. Neonates commonly have an imperforate valve of Hasner causing congenital nasolacrimal duct obstruction."
    difficulty: easy
    tags: [ophthalmology, lacrimal, anatomy, nasolacrimal duct]
  - front: "What is the Snellen visual acuity notation 20/40 and what does it mean clinically?"
    back: "20/40 means: what the patient can see at 20 feet (numerator) is what a 'normal' person can see at 40 feet (denominator). It indicates reduced visual acuity. In Ontario, the minimum BCVA for a non-commercial driver's licence is 20/50 with both eyes open, 120° continuous horizontal visual field, and 15° above and below fixation.\n\nSnellen VA is the standard for distance visual acuity testing. 20/20 is 'normal.' BCVA (best-corrected visual acuity) should be tested with distance glasses. For low vision, the testing hierarchy is: Snellen → Counting fingers (CF) → Hand motion (HM) → Light perception with projection → Light perception → No light perception."
    difficulty: easy
    tags: [ophthalmology, visual acuity, Snellen, driving, Ontario]
  - front: "What is the minimum visual acuity requirement to operate a non-commercial automobile in Ontario?"
    back: "20/50 BCVA with both eyes open and examined together, 120° continuous horizontal visual field, and 15° continuous visual field above and below fixation.\n\nThis is a Canadian-specific guideline tested on MCCQE1. Physicians have a duty to report patients who do not meet driving vision standards to the Ministry of Transportation in Ontario. If BCVA is worse than 20/50 or visual fields are inadequate, the patient must be advised not to drive."
    difficulty: easy
    tags: [ophthalmology, visual acuity, driving, Ontario, medico-legal]
  - front: "What is the visual acuity testing hierarchy from best to worst for low vision?"
    back: "Snellen VA (20/x) → Counting fingers at a given distance (CF) → Hand motion (HM) → Light perception with projection (LP with projection) → Light perception (LP) → No light perception (NLP)\n\nWhen a patient cannot read the Snellen chart, visual acuity is assessed by progressively simpler tasks. This hierarchy is important for documenting and following visual impairment, especially in retinal disease, glaucoma, and optic neuropathies."
    difficulty: easy
    tags: [ophthalmology, visual acuity, low vision]
  - front: "How is colour vision tested and what is its clinical significance in ophthalmology?"
    back: "Tested with Ishihara pseudoisochromatic plates (usually 14 plates). Record the number of correctly identified plates for each eye. Important for testing optic nerve function and identifying optic neuropathy (e.g., optic neuritis). Red-green colour blindness is sex-linked and occurs in 7–10% of males.\n\nColour vision is often the first modality lost in optic nerve disease such as optic neuritis. A patient with optic neuritis may have near-normal Snellen acuity but significantly reduced colour saturation ('red desaturation'). Ishihara testing is a sensitive screen for acquired optic neuropathies."
    difficulty: easy
    tags: [ophthalmology, colour vision, Ishihara, optic nerve, optic neuritis]
  - front: "What visual field test is used for AMD monitoring and what does it detect?"
    back: "The Amsler grid, tested with each eye separately. It checks for central or paracentral scotomas (blind spots) and metamorphopsia (distortion), which are hallmarks of AMD and other macular pathologies.\n\nThe Amsler grid is a 10° × 10° grid of horizontal and vertical lines with a central fixation dot. Patients with AMD report wavy lines (metamorphopsia) or missing areas (scotomas). It is a simple home-monitoring tool recommended for patients with known AMD."
    difficulty: easy
    tags: [ophthalmology, AMD, visual fields, Amsler grid, macula]
  - front: "What does a positive swinging flashlight test (RAPD) indicate?"
    back: "A relative afferent pupillary defect (RAPD) indicates an asymmetric defect in the afferent visual pathway (optic nerve or retina). When light is swung from the normal to the affected eye, the affected pupil appears to dilate rather than constrict. It is a sign of optic nerve disease (e.g., optic neuritis, optic atrophy, severe CRAO) or severe retinal disease.\n\nRAPD is detected with the swinging flashlight test. Both pupils dilate when the light is directed at the eye with impaired afferent input, because the consensual response to light in the 'good' eye is stronger than the direct response in the 'bad' eye. RAPD is absent in bilateral symmetric disease."
    difficulty: medium
    tags: [ophthalmology, RAPD, pupil, optic nerve, neuro-ophthalmology]
  - front: "How is anterior chamber depth estimated at the slit lamp (Van Herick method) and what is its significance?"
    back: "A thin-angled slit beam is shone onto the peripheral cornea; viewed at 60° from the beam. Anterior chamber depth is estimated by the ratio of corneal slit thickness to the space between posterior cornea and the iris. If >2/3 of the nasal iris is in shadow with tangential light → shallow anterior chamber, risk of angle-closure glaucoma.\n\nThe Van Herick method is a quick, non-invasive slit-lamp screening technique. Gonioscopy is the gold standard for angle assessment. A shallow anterior chamber is a contraindication to pupillary dilation, as mydriasis can precipitate acute angle-closure glaucoma in susceptible eyes (typically hyperopic, older patients)."
    difficulty: medium
    tags: [ophthalmology, anterior chamber, glaucoma, Van Herick, slit lamp]
  - front: "What is the normal intraocular pressure (IOP) range, and which tonometry method is the gold standard?"
    back: "Normal IOP: 10–21 mmHg (average 16 mmHg). Gold standard: Goldmann applanation tonometry (GAT), performed using the slit lamp with a prism tip and fluorescein dye under cobalt blue light.\n\nIOP has diurnal variation; always record the time of measurement. Alternative tonometers include Tono-Pen (portable, useful for scarred or irregular corneas), iCare (no anesthetic needed; used in pediatrics), and non-contact tonometer (air puff — least reliable). Central corneal thickness affects GAT accuracy: thick corneas overestimate, thin corneas underestimate IOP."
    difficulty: easy
    tags: [ophthalmology, IOP, tonometry, glaucoma, Goldmann]
  - front: "How does central corneal thickness (CCT) affect IOP measurement by Goldmann applanation tonometry?"
    back: "Average CCT = 545 µm. Thick corneas overestimate IOP; thin corneas underestimate IOP. The corrected IOP formula: IOPcorr = IOP − (CCT − 545)/20. For example, post-LASIK patients have thin corneas, causing GAT to underestimate true IOP.\n\nCCT is clinically important in glaucoma management. Post-refractive surgery patients (LASIK, PRK) have artificially thinned corneas, so measured IOP will be falsely low. This is significant when evaluating glaucoma suspects after laser eye surgery."
    difficulty: medium
    tags: [ophthalmology, IOP, corneal thickness, glaucoma, LASIK]
  - front: "What is fluorescein dye used for in slit-lamp examination and how does it stain the cornea?"
    back: "Fluorescein dye stains de-epithelialized cornea. It appears fluorescent green under cobalt blue filtered light. It stains disruptions of epithelial intercellular junctions. Used to detect corneal abrasions, ulcers, dendrites (HSV), and punctate keratitis.\n\nRose Bengal dye stains devitalized corneal and conjunctival epithelium (appears red) and is used in dry eye assessment. Lissamine green also stains devitalized epithelium and mucous strands, with better tolerability than Rose Bengal. Fluorescein is also used with GAT tonometry."
    difficulty: easy
    tags: [ophthalmology, fluorescein, cornea, slit lamp, staining]
  - front: "What is aqueous flare and how does it differ from aqueous cells on slit-lamp examination?"
    back: "Aqueous flare: resembles 'headlights in fog' (Tyndall effect) — a beam of light is visible in the anterior chamber due to increased protein leaking from blood vessels. Aqueous cells: individual inflammatory cells visible as particles in the anterior chamber. Flare indicates breakdown of the blood-aqueous barrier; cells indicate active inflammation.\n\nBoth flare and cells are found in anterior uveitis (iritis/iridocyclitis). Flare can persist even after active inflammation resolves (chronic barrier breakdown). Grading cells and flare on slit lamp guides treatment response monitoring in uveitis."
    difficulty: medium
    tags: [ophthalmology, uveitis, anterior chamber, slit lamp, flare]
  - front: "What are the contraindications to pupillary dilation for fundoscopy?"
    back: "1. Shallow anterior chamber (risk of precipitating acute angle-closure glaucoma)\n2. Iris-supported anterior chamber lens implant\n3. Potential neurologic abnormality requiring pupil evaluation (e.g., head injury monitoring)\n4. Cardiovascular disease (caution — mydriatics may cause tachycardia and hypertension)\n\nMydriatics (e.g., tropicamide, phenylephrine) dilate the pupil for fundoscopy but can precipitate angle-closure glaucoma in anatomically predisposed eyes (shallow anterior chambers). Always check anterior chamber depth before dilating. In patients with head injuries, dilation obscures pupillary monitoring for herniation."
    difficulty: medium
    tags: [ophthalmology, mydriatics, fundoscopy, contraindications, glaucoma]
  - front: "What is a red reflex and what does its absence (leukocoria) indicate?"
    back: "Red reflex: light reflected off the retina produces an orange-red glow when viewed with a direct ophthalmoscope from ~1 foot away. Anything interfering with light passage (large vitreous hemorrhage, cataract) diminishes the reflex. Leukocoria (white reflex/absent red reflex) in children must urgently rule out retinoblastoma.\n\nLeukocoria is an ocular emergency in children. Differential diagnosis includes retinoblastoma, congenital cataract, retinopathy of prematurity, toxocariasis, and persistent fetal vasculature. Retinoblastoma is life-threatening; early diagnosis is critical. The red reflex test should be part of all pediatric well-baby examinations."
    difficulty: easy
    tags: [ophthalmology, red reflex, leukocoria, retinoblastoma, pediatric ophthalmology]
  - front: "What are the common types of laser refractive eye surgery and what are the main risks/complications?"
    back: "Types: PRK (photorefractive keratectomy), LASIK (laser-assisted in situ keratomileusis), SMILE (small incision lenticule extraction). All correct myopia, hyperopia, and astigmatism by ablating corneal tissue.\n\nRisks/complications: infection, under/overcorrection, increased glare/halos at night, corneal haze (PRK — prevented by mitomycin), dry eyes (more common in LASIK), regression, corneal ectasia.\n\nLASIK-specific: flap complications (striae, free cap, flap loss, traumatic dislocation, buttonhole flap, epithelial ingrowth).\n\nCorneal ectasia (progressive corneal thinning and steepening) is the most feared long-term complication, occurring in patients with pre-existing subclinical keratoconus or insufficient residual corneal thickness post-ablation. Post-refractive surgery patients have falsely low IOP on GAT (thin corneas) — relevant to glaucoma screening."
    difficulty: medium
    tags: [ophthalmology, refractive surgery, LASIK, PRK, SMILE, complications]
  - front: "Compare myopia and hyperopia: pathophysiology, clinical features, correction, and complications."
    back: "Myopia (nearsightedness): globe too long (or refractive power too strong) → image focuses anterior to retina. Presents in 1st–2nd decade. Treated with concave/negative/diverging lenses. Complications: retinal tear/detachment, chorioretinal atrophy, myopic maculoschisis, macular hole, open-angle glaucoma.\n\nHyperopia (farsightedness): globe too short (or refractive power too weak) → image focuses behind retina. Youth may compensate with accommodation. Treated with convex/positive/converging lenses. Complications: angle-closure glaucoma (lens enlarges with age), accommodative esotropia and amblyopia in children.\n\nMyopia affects 30–40% of the US population (higher in Asians) and rarely begins after age 25, except in DM hyperglycemia (lens swelling) and early nuclear sclerotic cataracts. Hyperopic children may develop accommodative esotropia and amblyopia if not corrected early. Presbyopia (age >40) is normal hardening of the lens causing loss of near focus."
    difficulty: medium
    tags: [ophthalmology, optics, myopia, hyperopia, refractive error]
  - front: "What is presbyopia, how does it present, and how is it treated?"
    back: "Presbyopia: normal aging process (onset ~40 years). Hardening and reduced deformability of the lens → decreased accommodative ability (from 14D at age 10 to 3.5D by age 40).\n\nPresentation: emmetropes hold reading material farther away; myopes remove distance glasses to read; hyperopes develop symptoms earlier.\n\nTreatment: positive/convex/plus lenses for reading (bifocal or progressive). Near images cannot focus on the retina (focus is behind retina, like hyperopia).\n\nAccommodative power decreases linearly with age. Patients who are initially myopic have a natural advantage for near vision (reading without glasses). Presbyopia is not a disease but a universal aging change. It is distinct from hyperopia, though both are corrected with plus lenses."
    difficulty: easy
    tags: [ophthalmology, presbyopia, optics, aging, refractive error]
  - front: "What is astigmatism and how is it corrected?"
    back: "Astigmatism: light rays not refracted uniformly in all meridians due to a non-spherical corneal or lens surface (football-shaped). Types: regular (curvature uniformly different in meridians at right angles — correctable with cylindrical lens) and irregular (e.g., keratoconus, corneal scar, severe dry eye — corrected with contact lenses). Affects >30% of the population.\n\nRegular astigmatism is the most common type and is corrected with cylindrical lenses (spectacles or toric contact lenses) or laser refractive surgery. Irregular astigmatism cannot be fully corrected with spectacles; rigid gas-permeable contact lenses or corneal procedures may be required. Mild astigmatism is usually asymptomatic."
    difficulty: easy
    tags: [ophthalmology, astigmatism, optics, refractive error, keratoconus]
  - front: "What is anisometropia and why is it clinically important?"
    back: "Anisometropia: a difference in refractive error between the two eyes. It is the second most common cause of amblyopia in children. In hyperopic children, the more hyperopic or more astigmatic eye is at risk of developing amblyopia (the eye that cannot be 'focussed' by the baby).\n\nAmblyopia (lazy eye) from anisometropia occurs because the brain suppresses the chronically blurred image from one eye during the critical period of visual development (birth to ~8 years). Early correction with glasses and patching of the dominant eye are the mainstays of treatment. Screening visual acuity in children is essential."
    difficulty: medium
    tags: [ophthalmology, anisometropia, amblyopia, pediatric ophthalmology, refractive error]
  - front: "What are the structures responsible for refractive power in the eye and their approximate contributions?"
    back: "Cornea: ~2/3 of total refractive power (~43 diopters). Lens: ~1/3 of total refractive power (~19 diopters).\n\nThe cornea provides the majority of the eye's refractive power because it is the interface between air and tissue (greatest change in refractive index). The lens provides the remainder and is responsible for accommodation (changing focal length for near vs. far objects). Laser refractive surgery targets the cornea to modify its curvature."
    difficulty: easy
    tags: [ophthalmology, optics, cornea, lens, refraction]
  - front: "Differentiate binocular from monocular diplopia and list key causes of each."
    back: "Binocular diplopia: occurs with both eyes open, eliminated by covering either eye. Causes: decompensated strabismus, CN III/IV/VI palsy, myasthenia gravis, botulism, thyroid eye disease (TED), skew deviation, dorsal midbrain syndrome.\n\nMonocular diplopia: occurs with one eye open, persists with covering the unaffected eye. Causes: refractive error/astigmatism, dislocated lens, cataract surgery/laser iridotomy sequelae, mucus strands in tear film, keratoconus.\n\nThe key distinguishing feature is that monocular diplopia persists when the fellow eye is covered — it is an optical/intraocular phenomenon. Binocular diplopia implies misalignment of the visual axes and requires neurological or muscular evaluation. A dilated pupil with CN III palsy suggests aneurysm (posterior communicating artery) — a neurological emergency."
    difficulty: medium
    tags: [ophthalmology, diplopia, strabismus, cranial nerve, neuro-ophthalmology]
  - front: "What are the ocular problems associated with contact lens wear?"
    back: "Solution hypersensitivity, tight lens syndrome, corneal abrasion, giant papillary conjunctivitis (GPC)/contact lens allergy, superficial punctate keratitis (SPK) from dry eyes, limbal stem cell deficiency, corneal neovascularization, sterile corneal infiltrates (immunologic), and infected ulcers (Pseudomonas, Acanthamoeba).\n\nAcanthamoeba keratitis is a serious complication of contact lens wear, especially with tap water exposure or swimming in lenses. Pseudomonas is the most common cause of bacterial corneal ulcer in contact lens wearers. Any contact lens wearer with a painful red eye and corneal infiltrate must be evaluated urgently."
    difficulty: medium
    tags: [ophthalmology, contact lens, keratitis, Pseudomonas, Acanthamoeba]
  - front: "List the sight-threatening and life-threatening ocular emergencies."
    back: "Sight-threatening: lid laceration, globe rupture, chemical burn, corneal ulcer, gonococcal conjunctivitis, acute iritis, acute glaucoma, CRAO (central retinal artery occlusion), intraocular foreign body, retinal detachment, endophthalmitis, GCA (giant cell arteritis).\n\nLife-threatening: proptosis (rule out cavernous sinus fistula/thrombosis), CN III palsy with dilated pupil (rule out intracranial aneurysm), papilledema (elevated ICP workup), orbital cellulitis, leukocoria in children (rule out retinoblastoma).\n\nThese require urgent ophthalmology consultation. CRAO is a 'stroke of the eye' requiring emergency treatment within 4–6 hours. Chemical burns (especially alkali) require immediate copious irrigation before any other investigation. A CN III palsy with a dilated pupil indicates external compression of CN III (e.g., posterior communicating artery aneurysm) — neurosurgical emergency."
    difficulty: medium
    tags: [ophthalmology, ocular emergencies, CRAO, glaucoma, aneurysm]
  - front: "Compare the features of acute angle-closure glaucoma, acute iritis, conjunctivitis, and corneal ulcer in differentiating red eye."
    back: "Acute Angle-Closure Glaucoma: severe pain (+++), nausea/vomiting, blurred vision (+), pupil fixed mid-dilation, cloudy cornea, markedly increased IOP, shallow anterior chamber, coloured haloes.\n\nAcute Iritis: dull/achy pain (++), photophobia (+), smaller pupil (miosis), ciliary flush (perilimbal injection), keratic precipitates on cornea, cells and flare in AC, posterior synechiae, normal IOP (variable).\n\nConjunctivitis: mild pain (+), discharge (purulent in bacterial, serous in viral, mucoid in allergic), normal pupil, diffuse conjunctival injection, no corneal changes (except adenovirus), normal IOP, tender preauricular node if viral.\n\nCorneal Ulcer: sharp pain (++), purulent discharge (bacterial), photophobia, normal/smaller pupil, corneal infiltrate/edema, may have keratic precipitates, may have hypopyon, normal/slightly decreased IOP.\n\nThis is a classic MCCQE1 comparison table. Key differentiators: (1) IOP elevated only in acute glaucoma; (2) fixed mid-dilated pupil only in acute glaucoma; (3) nausea/vomiting only in acute glaucoma; (4) coloured haloes specific to acute glaucoma (corneal edema diffracts light); (5) posterior synechiae specific to iritis; (6) preauricular lymphadenopathy specific to viral conjunctivitis."
    difficulty: hard
    tags: [ophthalmology, red eye, glaucoma, iritis, conjunctivitis, corneal ulcer, differential diagnosis]
  - front: "What are the common causes of transient, acute, and subacute loss of vision?"
    back: "Transient (seconds–hours): dry eye, intermittent angle closure, retinal TIA (amaurosis fugax), impending CRVO, optic nerve TIA, pituitary apoplexy.\n\nAcute (sudden): corneal abrasion/edema, hyphema, acute glaucoma, CRAO, CRVO, retinal detachment, vitreous hemorrhage, AION (NAION or AAION), optic neuritis, stroke.\n\nSubacute (weeks–months): corneal scar, refractive error, cataract, AMD, diabetic retinopathy, retinitis pigmentosa, papilledema, toxic/nutritional optic neuropathy, compressive optic neuropathy, neoplasm.\n\nThe temporal pattern of vision loss is the key to narrowing the diagnosis. Amaurosis fugax (fleeting monocular vision loss, 'shade coming down') is caused by transient retinal ischemia from emboli (carotid artery or cardiac source) and requires urgent stroke work-up. CRAO is a true ocular emergency with a window of <4–6 hours for treatment."
    difficulty: hard
    tags: [ophthalmology, vision loss, differential diagnosis, amaurosis fugax, CRAO]
  - front: "What are the causes of floaters and flashes of light (photopsia)?"
    back: "Floaters: posterior vitreous detachment (PVD — most common, age-related vitreous syneresis), vitreous hemorrhage, retinal tear/detachment, intermediate uveitis (pars planitis), posterior uveitis (chorioretinitis).\n\nFlashes (Photopsia): PVD (vitreous traction on retina), retinal tear/detachment, migrainous visual aura.\n\nNew-onset floaters and flashes together are an ophthalmologic urgency requiring same-day dilated fundus examination to rule out retinal tear/detachment. PVD alone is benign but must be distinguished from a retinal tear — 15% of symptomatic PVDs have a concurrent retinal tear. Migrainous aura is binocular and typically has a scintillating quality, unlike the monocular flashes of retinal disease."
    difficulty: medium
    tags: [ophthalmology, floaters, photopsia, PVD, retinal detachment, differential diagnosis]
  - front: "What are the causes of photophobia?"
    back: "Corneal abrasion, corneal ulcer, keratitis, acute angle-closure glaucoma, iritis (anterior uveitis), meningitis/encephalitis, migraine, subarachnoid hemorrhage (SAH).\n\nPhotophobia with neck stiffness and headache suggests meningitis or SAH — these are life-threatening causes that must be excluded. Ocular causes of photophobia involve stimulation of the ciliary nerve (uveal tract, cornea). Iritis characteristically causes photophobia due to ciliary spasm when light hits the inflamed iris."
    difficulty: easy
    tags: [ophthalmology, photophobia, differential diagnosis, meningitis, iritis]
  - front: "What is exophthalmos vs. proptosis and what are the most common causes in adults vs. children?"
    back: "Exophthalmos: anterior displacement of the globe ≥18 mm (Hertel exophthalmometer), typically refers to endocrine etiology. Proptosis: forward displacement, typically non-endocrine causes or <8 mm. Asymmetry >2 mm is abnormal.\n\nMost common cause in adults: Graves' disease (thyroid eye disease — can be unilateral or bilateral).\nMost common cause in children: orbital cellulitis (unilateral).\n\nOther causes: orbital tumour (primary or metastatic), orbital/retrobulbar hemorrhage, cavernous sinus thrombosis or fistula.\n\nGraves' disease (TED) is the most common cause of unilateral and bilateral exophthalmos in adults. In children, proptosis is most often due to orbital cellulitis (usually from sinusitis) or rhabdomyosarcoma. Rule out pseudoexophthalmos (lid retraction mimicking proptosis). Workup includes CT/MRI head/orbits, thyroid function tests."
    difficulty: medium
    tags: [ophthalmology, proptosis, exophthalmos, Graves disease, orbital cellulitis]
  - front: "Differentiate preseptal (periorbital) cellulitis from orbital cellulitis."
    back: "Preseptal cellulitis: infection anterior to the orbital septum. No proptosis, no pain on eye movement, normal ocular mobility, normal vision, no RAPD, absent chemosis.\n\nOrbital cellulitis: infection posterior to the orbital septum — OCULAR AND MEDICAL EMERGENCY. Features: fever, severe lid edema, conjunctival injection, marked chemosis, proptosis, pain on eye movement, decreased ocular mobility, diminished vision + diplopia, possible RAPD, marked leukocytosis.\n\nComplications of orbital cellulitis: subperiosteal abscess, cranial neuropathies, cavernous sinus thrombosis, intracranial extension.\n\nThe orbital septum is the key anatomical landmark. Proptosis, restricted EOM, and pain with eye movement are the distinguishing features of orbital cellulitis. CT/MRI of orbits and sinuses is required for equivocal cases. Treatment: admit, blood cultures ×2, orbital CT, IV ceftriaxone + vancomycin for 1 week; may require surgical drainage."
    difficulty: hard
    tags: [ophthalmology, orbital cellulitis, preseptal cellulitis, proptosis, emergency]
  - front: "What is the treatment for preseptal cellulitis in children vs. adults?"
    back: "Children: systemic antibiotics (cephalexin, ampicillin, amoxicillin-clavulanic acid) + nasal decongestants (oxymetazoline). IV antibiotics (ceftriaxone + vancomycin) if: age <5, severe, or failed oral antibiotics.\n\nAdults/teenagers: oral antibiotics (ampicillin-sulbactam, Septra DS, clindamycin) + warm compresses.\n\nCommunity-acquired MRSA: Septra DS, rifampin, or clindamycin.\nHospital-acquired MRSA: vancomycin or linezolid.\n\nSinusitis is the main risk factor for preseptal cellulitis in children; periorbital trauma or dermal infection in adults. In children, H. influenzae is a concern (though less common since Hib vaccine); S. aureus and Streptococcus predominate in adults. Nasal decongestants promote sinus drainage in children."
    difficulty: medium
    tags: [ophthalmology, preseptal cellulitis, antibiotics, MRSA, pediatric]
  - front: "What is enophthalmos and what are its causes?"
    back: "Enophthalmos: posterior displacement (retraction) of the globe. Causes: blow-out fracture of the orbital floor (most common traumatic cause — orbital fat herniates into maxillary sinus), orbital fat atrophy, congenital abnormality, and metastatic disease (e.g., scirrhous breast cancer causes orbital fibrosis and retraction).\n\nBlow-out fracture causes acute enophthalmos, diplopia (inferior rectus entrapment), and infraorbital nerve hypoesthesia. Metastatic breast cancer to the orbit classically causes enophthalmos (scirrhous reaction) rather than proptosis — an important distinction from most orbital metastases. CT orbits is the investigation of choice."
    difficulty: medium
    tags: [ophthalmology, enophthalmos, blow-out fracture, orbital trauma, metastasis]
  - front: "What is dry eye syndrome (keratoconjunctivitis sicca) and what are its two main types and causes?"
    back: "Dry eye syndrome (DES): insufficient or poor-quality tears causing ocular surface disease.\n\n1. Aqueous-deficient DES (decreased tear production):\n   - Sjögren syndrome (RA, SLE — autoimmune lacrimal gland destruction)\n   - Non-Sjögren: age-related, lacrimal gland scarring (trachoma), CN VII palsy, anticholinergics, antihistamines, diuretics, β-blockers, contact lenses\n\n2. Evaporative DES (normal production, excessive evaporation):\n   - Meibomian gland dysfunction (posterior blepharitis)\n   - Vitamin A deficiency (xerophthalmia, goblet cell loss)\n   - Eyelid abnormalities (ectropion, CN VII palsy — decreased blinking)\n   - Topical ocular medications with preservatives\n   - Contact lenses, allergic conjunctivitis\n\nMixed etiologies are common. Sjögren syndrome is an autoimmune condition with dry eyes and dry mouth (sicca syndrome); primary or secondary to RA/SLE. Anti-SSA (Ro) and anti-SSB (La) antibodies are associated. Schirmer's test (decreased wetting) and Rose Bengal/fluorescein staining confirm the diagnosis."
    difficulty: medium
    tags: [ophthalmology, dry eye, Sjogren syndrome, meibomian gland, keratoconjunctivitis sicca]
  - front: "What are the clinical features of dry eye syndrome?"
    back: "Symptoms: dry eyes, red eyes, foreign body sensation, eye pain, blurred vision, paradoxical excessive tearing (reflex lacrimation).\n\nSlit-lamp exam: decreased tear meniscus, decreased tear break-up time (<10 seconds is abnormal), punctate staining of cornea with fluorescein.\n\nSevere cases: filaments (strands of epithelial cells attached to corneal epithelium — painful), corneal keratinization.\n\nComplications: corneal erosions and scarring (usually worst inferonasally).\n\nParadoxical tearing in dry eye is due to reflex lacrimation from ocular irritation. Tear break-up time <10 seconds suggests evaporative dry eye. Schirmer's test measures reflex tear production: strip placed in inferior fornix; <10 mm wetting in 5 minutes is abnormal. Long-term use of preserved artificial tears (>4–6×/day) causes preservative toxicity worsening DES."
    difficulty: medium
    tags: [ophthalmology, dry eye, clinical features, slit lamp, Schirmer test]
  - front: "What are the treatment options for dry eye syndrome?"
    back: "Medical:\n- Preservative-free artificial tears (up to q1h) and ointment at bedtime\n- Topical cyclosporine 0.05% (Restasis®), 0.09% (Cequa®)\n- Lifitegrast 5% (Xiidra®)\n- Short course of mild topical corticosteroids\n- Omega-3 fatty acids orally (controversial)\n- Eyelid hygiene for blepharitis\n- Avoid preserved drops >4–6×/day (preservative toxicity)\n\nProcedural:\n- Punctal occlusion (punctal plug insertion)\n- Lid taping\n- Tarsorrhaphy (partial surgical fusion of lids) for severe cases\n\nTreat underlying cause (e.g., Sjögren's systemic management).\n\nCyclosporine ophthalmic emulsion (Restasis®) targets the inflammatory component of DES by inhibiting T-cell activation and cytokine release. Lifitegrast (Xiidra®) is a lymphocyte function-associated antigen-1 (LFA-1) antagonist that reduces T-cell–mediated ocular surface inflammation. Punctal plugs reduce tear drainage, keeping the ocular surface moist."
    difficulty: medium
    tags: [ophthalmology, dry eye, cyclosporine, Restasis, Xiidra, treatment]
  - front: "How is visual acuity tested in infants and young children?"
    back: "Newborns: VA cannot be tested conventionally.\n3 months–3 years: assess visual function (not acuity) — test each eye for fixation symmetry with an interesting object. Normal = 'CSM' (central, steady, and maintained).\n3 years until alphabet known: HOTV cards/Sheridan-Gardiner (child points to matching optotypes), tumbling 'E' chart.\nNear vision: Rosenbaum Pocket Vision Screener — record Jaeger (J) number and testing distance (usually 30 cm).\n\nCSM (central, steady, maintained) fixation is the standard for assessing visual function in pre-verbal children. Each eye must be assessed separately by covering the other eye. Failure to maintain fixation or asymmetry suggests amblyopia. Screening for amblyopia risk factors (strabismus, anisometropia, media opacities) is essential in all child health visits."
    difficulty: medium
    tags: [ophthalmology, visual acuity, pediatric ophthalmology, CSM, amblyopia]
  - front: "What extraocular muscles are innervated by CN III, CN IV, and CN VI?"
    back: "CN VI (abducens): lateral rectus (abduction).\nCN IV (trochlear): superior oblique (depression and intorsion, especially in adduction).\nCN III (oculomotor): all remaining — superior rectus, inferior rectus, medial rectus, inferior oblique; also levator palpebrae superioris and pupillary constrictor (sphincter pupillae via ciliary ganglion).\n\nMnemonic: 'LR6SO4, all else 3.' CN III palsy causes ptosis, exotropia ('down and out' eye), and a fixed dilated pupil (surgical CN III — extrinsic compression, e.g., aneurysm). CN IV palsy causes vertical diplopia worse on downgaze (e.g., reading, stairs) — head tilt to opposite side is compensatory. CN VI palsy causes esotropia with inability to abduct."
    difficulty: medium
    tags: [ophthalmology, extraocular muscles, cranial nerve, CN III, CN IV, CN VI]
  - front: "What are the nine cardinal positions of gaze and how is the Hirschberg corneal reflex test performed?"
    back: "Nine cardinal positions: primary position (straight ahead) + 8 gaze directions (up, down, left, right, and 4 obliques).\n\nHirschberg test: shine a light into the patient's eyes from ~30 cm while the patient looks at the light. The corneal light reflex should be at the same position on each cornea (symmetric). Asymmetry indicates strabismus (misalignment of the visual axes).\n\nThe Hirschberg test is a rapid screen for strabismus. Each millimetre of decentration of the corneal reflex represents approximately 15 prism diopters (7°) of ocular deviation. A displaced nasal reflex indicates exotropia; displaced temporal reflex indicates esotropia. The cover-uncover test is more sensitive for detecting manifest strabismus."
    difficulty: easy
    tags: [ophthalmology, strabismus, Hirschberg, extraocular muscles, examination]
  - front: "What is epiphora and what are the main categories of causes?"
    back: "Epiphora is excessive tearing. Causes include: (1) increased tear production (emotion, pain, environmental irritants, ocular inflammation), (2) lid/lash malposition (ectropion, entropion, trichiasis), (3) lacrimal drainage obstruction (congenital, aging, rhinitis, dacryocystitis), and (4) paradoxical gustatory lacrimation ('crocodile tears'). Note: dry eyes can cause reflexive tearing due to poor tear quality.\n\nUnderstanding the two broad mechanisms — hypersecretion vs. lacrimal outflow obstruction — guides investigation and treatment. The Jones dye test differentiates lacrimal drainage obstruction. Treatment is directed at the underlying cause (e.g., lid repair, punctal irrigation, dacryocystorhinostomy)."
    difficulty: easy
    tags: [ophthalmology, epiphora, lacrimal system, tearing]
  - front: "What is the Jones dye test and what does it detect?"
    back: "The Jones dye test involves placing fluorescein dye in the conjunctival cul-de-sac, then placing a cotton applicator in the nose to detect dye flow. A positive result (dye reaches nose) rules out lacrimal drainage obstruction. Failure of dye to reach the nose suggests nasolacrimal duct obstruction.\n\nThe Jones dye test is a functional assessment of lacrimal drainage. It is used in the investigation of epiphora to distinguish between hypersecretion and outflow obstruction, which have different treatment pathways."
    difficulty: easy
    tags: [ophthalmology, epiphora, Jones dye test, lacrimal drainage]
  - front: "What is dacryocystitis, what organisms cause it, and how is it treated?"
    back: "Dacryocystitis is acute or chronic infection of the lacrimal sac, most commonly due to obstruction of the nasolacrimal duct. In adults: gram-positive bacteria (S. aureus, S. pneumoniae) are most common. In immunocompromised: gram-negative (Pseudomonas). Features: pain, swelling, redness below medial canthus, epiphora; pus may be expressed through punctum. Treatment: warm compresses, nasal decongestants, systemic antibiotics (cephalexin if afebrile, cefazolin if febrile); I&D if needed; dacryocystorhinostomy once infection resolves.\n\nDacryocystorhinostomy (DCR) creates a new passage between the lacrimal sac and nasal cavity, bypassing the obstructed nasolacrimal duct. Topical antibiotics have limited value as they do not penetrate the site of infection. Chronic dacryocystitis may be a clue to underlying systemic disease."
    difficulty: medium
    tags: [ophthalmology, dacryocystitis, lacrimal sac, infection, antibiotics]
  - front: "What are the acute and chronic causes of dacryoadenitis?"
    back: "Dacryoadenitis is inflammation of the lacrimal gland (outer third of upper eyelid), most commonly seen in children and young adults. Acute causes: S. aureus, mumps, EBV, herpes zoster, N. gonorrhoeae. Chronic causes (often bilateral): lymphoma, leukemia, sarcoidosis, tuberculosis, thyroid eye disease (TED). Chronic form presents as painless enlargement of the lacrimal gland.\n\nBilateral lacrimal gland enlargement should always prompt workup for systemic granulomatous or lymphoproliferative disease. Acute dacryoadenitis is treated with warm compresses and oral NSAIDs; systemic antibiotics if bacterial. Chronic forms require treatment of the underlying disorder."
    difficulty: medium
    tags: [ophthalmology, dacryoadenitis, lacrimal gland, lymphoma, sarcoidosis]
  - front: "What are the causes of ptosis (blepharoptosis) and the surgical approach based on levator function?"
    back: "Ptosis (drooping upper eyelid) causes: aponeurotic (most common — disinsertion/dehiscence of levator aponeurosis with age, trauma, surgery), mechanical (mass/scarring), neuromuscular (myasthenia gravis, myotonic dystrophy, CN III palsy, Horner's syndrome), congenital, pseudoptosis (dermatochalasis, enophthalmos), drugs (opioids, pregabalin). Surgery: mild (<2 mm), normal levator function → Müller-conjunctival resection; >2 mm, normal levator → levator advancement; >2 mm, moderate levator (4-10 mm) → levator resection; >2 mm, severe (<4 mm levator function) → frontalis suspension.\n\nLevator function is the key variable in surgical planning for ptosis. Frontalis suspension uses fascia lata (autologous if child ≥3 years) or synthetic materials. Horner's syndrome causes mild ptosis with ipsilateral miosis, anhidrosis, and enophthalmos — important to recognize as it may indicate a serious underlying cause."
    difficulty: hard
    tags: [ophthalmology, ptosis, blepharoptosis, levator muscle, Horners syndrome, CN III palsy]
  - front: "What is trichiasis and how does it differ from entropion?"
    back: "Trichiasis: misdirected eyelashes toward the ocular surface with NORMAL lid margin position. Entropion: inward turning of the lid margin itself. Both cause foreign body sensation, red eye, tearing, and potential corneal damage. Trichiasis causes include blepharitis, trachoma, Stevens-Johnson Syndrome, trauma/burns. Treatment: topical lubrication, epilation, electrolysis, cryotherapy, surgical lid margin rotation.\n\nDistinguishing trichiasis from entropion is clinically important. In trichiasis, the lid is in normal position but lashes are aberrant. Trachoma is the leading infectious cause of trichiasis and blindness worldwide. Corneal abrasions from trichiasis can lead to secondary ulceration and scarring."
    difficulty: easy
    tags: [ophthalmology, trichiasis, entropion, eyelashes, trachoma]
  - front: "What are the types of entropion and how is it tested?"
    back: "Entropion: lid margin turns inward toward the globe. Types: involutional (aging, most common), cicatricial (herpes zoster, surgery, trauma, burns), orbicularis oculi spasm, congenital. Testing: forced lid closure — ask patient to tighten lid then open; in entropion the lid margin rolls inward and stays inverted. Most commonly affects the lower lid. Clinical features: tearing, foreign body sensation, red eye, corneal abrasions/scarring. Rule out pseudo-entropion: trichiasis, distichiasis, epiblepharon.\n\nThe forced lid closure test helps confirm entropion by demonstrating the tendency of the lid margin to roll inward. Treatment includes lubricants, evert lid with tape, and surgery. Cicatricial entropion requires correction of the underlying scarring process."
    difficulty: medium
    tags: [ophthalmology, entropion, eyelid, lid margin]
  - front: "What is ectropion, what are its causes, and what nerve palsy is associated with it?"
    back: "Ectropion: lid margin folds outward from the globe. Causes: involutional (aging, most common), paralytic (CN VII palsy — a key association), cicatricial (burns, trauma, surgery), mechanical (lid edema, tumour, herniated fat), congenital (e.g. ichthyosis). Clinical features: tearing and possible exposure keratitis. Treatment: topical lubrication, eyelid taping overnight, and surgery.\n\nCN VII palsy (facial nerve) causes paralytic ectropion because orbicularis oculi function (closing the eye) is lost. This can lead to corneal exposure and keratitis. In the testing maneuver, the lid remains away from the globe ('snap-back test' is slow or absent). Exposure keratitis must be prevented with aggressive lubrication."
    difficulty: easy
    tags: [ophthalmology, ectropion, CN VII palsy, facial nerve, exposure keratitis]
  - front: "What is the difference between a hordeolum and a chalazion?"
    back: "Hordeolum (stye): acute infection of eyelid glands (meibomian, Zeis, or Moll glands) caused by S. aureus; presents as painful, red, tender swelling. Treatment: warm compresses, lid scrubbing, systemic doxycycline; topical antibiotics typically ineffective; I&D if persistent. Chalazion: chronic granulomatous inflammation of a meibomian gland (often preceded by internal hordeolum); acute inflammatory signs usually absent. Treatment: warm compresses, doxycycline if started early; incision and curettage if no improvement after 1 month. IMPORTANT: chronic recurrent chalazion must be biopsied to rule out malignancy (sebaceous cell carcinoma).\n\nThe key clinical distinction is acute painful (hordeolum) vs. chronic non-tender (chalazion). A recurrent chalazion that doesn't respond to treatment should be biopsied to exclude sebaceous cell carcinoma or meibomian gland carcinoma, which can masquerade as benign lid lesions."
    difficulty: easy
    tags: [ophthalmology, hordeolum, stye, chalazion, meibomian gland, sebaceous carcinoma]
  - front: "What is blepharitis, what are the two main types, and how is it managed?"
    back: "Blepharitis: inflammation of eyelid margins. Types: (1) Anterior blepharitis — staphylococcal (S. aureus; ulcerative, dry scales) or seborrheic (no ulcers, greasy scales, associated with seborrheic dermatitis); (2) Posterior blepharitis — meibomian gland dysfunction. Clinical features: itching, tearing, foreign body sensation, thickened red lid margins, crusting, 'toothpaste sign' (discharge with pressure). Complications: recurrent hordeola, conjunctivitis, keratitis, corneal ulceration/neovascularization. Treatment: warm compresses, lid massages, lid washing; topical or oral antibiotics (doxycycline for posterior); short course topical corticosteroids if severe; omega-3 fatty acids.\n\nPosterior blepharitis (meibomian gland dysfunction) is the most common form and contributes to evaporative dry eye. Oral doxycycline is particularly effective for posterior blepharitis due to its anti-inflammatory and anti-lipase properties. The 'toothpaste sign' is a classic teaching point for meibomian gland secretion."
    difficulty: medium
    tags: [ophthalmology, blepharitis, meibomian gland, eyelid margins, doxycycline]
  - front: "What is xanthelasma and what systemic condition should be considered in a young patient?"
    back: "Xanthelasma: eyelid xanthoma (lipid deposits in the dermis of the lids), appearing as pale, slightly elevated yellowish plaques or streaks. Most commonly found on medial upper lids, often bilateral. Associated with hyperlipidemia in about half of patients. In the elderly it is common and generally benign; in young people (<40 yr), it is more concerning and warrants a lipid profile. Treatment: excision for cosmesis (commonly recurs).\n\nXanthelasma itself is benign but serves as a marker of dyslipidemia, particularly in younger patients. It is one of the few ophthalmologic findings that should prompt systemic metabolic workup. Recurrence after excision is common."
    difficulty: easy
    tags: [ophthalmology, xanthelasma, hyperlipidemia, eyelid, lipid deposits]
  - front: "What is the difference between a pinguecula and a pterygium?"
    back: "Pinguecula: yellow-white subepithelial deposit of hyaline and elastic tissue adjacent to the nasal or temporal limbus, SPARING the cornea; associated with UV/wind exposure; benign but may cause irritation. Pterygium: fibrovascular, triangular, wing-like encroachment of epithelial tissue ONTO the cornea; caused by UV light destroying limbal stem cells; may induce astigmatism and reduce vision. Treatment for pterygium: excision for chronic inflammation, threat to visual axis, or cosmesis; recurrence rate ~1/3 after bare excision, lower with conjunctival autograft (~5%).\n\nThe critical distinction is that a pterygium invades the cornea (can impair vision) while a pinguecula does not. UV exposure is a shared risk factor. Pterygium excision should include conjunctival autograft or limbal stem cell transplant to reduce high recurrence rates."
    difficulty: easy
    tags: [ophthalmology, pinguecula, pterygium, cornea, limbal stem cells, UV exposure]
  - front: "What are the causes and clinical significance of a subconjunctival hemorrhage?"
    back: "Subconjunctival hemorrhage: blood beneath the conjunctiva, otherwise asymptomatic. Causes: idiopathic, trauma, Valsalva maneuver, bleeding disorders, hypertension, anticoagulation. Management: reassurance if no other ocular findings; resolves spontaneously in 2-3 weeks. Red flags: 360° involvement with trauma history should raise HIGH suspicion for globe rupture; recurrent non-traumatic hemorrhages warrant medical/hematologic workup.\n\nIsolated subconjunctival hemorrhage is almost always benign and self-resolving. The MCCQE1 key teaching points are: (1) 360° hemorrhage after trauma = suspect open globe; (2) recurrent non-traumatic hemorrhage = rule out coagulopathy, hypertension, anticoagulation."
    difficulty: easy
    tags: [ophthalmology, subconjunctival hemorrhage, globe rupture, trauma, anticoagulation]
  - front: "How do you differentiate allergic from viral from bacterial conjunctivitis by discharge type and other features?"
    back: "Discharge: Allergic = mucoid; Viral = watery; Bacterial = purulent; Chlamydial = mucopurulent. Morphology: Follicles (pale lymphoid elevations) = viral or chlamydial; Papillae (fibrovascular elevations, 'cobblestone') = allergic or bacterial. Other features: Allergic = itching, chemosis, associated rhinitis/asthma; Viral = watery discharge, preauricular lymphadenopathy, often starts unilateral; Bacterial = purulent discharge, papillae; Chlamydial = mucopurulent, follicles. Preauricular nodes: viral or chlamydial conjunctivitis.\n\nThe type of discharge and presence of follicles vs. papillae are the key differentiating features on the MCCQE1. Temporal/nasal conjunctival lymphatics drain to preauricular and submandibular nodes, respectively — palpable preauricular nodes suggest viral or chlamydial etiology."
    difficulty: medium
    tags: [ophthalmology, conjunctivitis, differential diagnosis, discharge, follicles, papillae]
  - front: "What is vernal keratoconjunctivitis and how does it differ from giant papillary conjunctivitis (GPC)?"
    back: "Vernal keratoconjunctivitis: large papillae (cobblestones) on superior palpebral conjunctiva + corneal shield ulcers (non-infectious) + limbal follicles + keratitis; seasonal (warm weather); affects children (often male), lasts 5-10 years then resolves; treatment with artificial tears, topical steroids, topical cyclosporine; shield ulcers may require debridement. GPC: immune reaction to mucus debris on contact lenses; large papillae on superior palpebral conjunctiva; treatment = clean/change/discontinue lens + topical corticosteroids.\n\nBoth conditions cause giant papillae but differ in etiology (allergic/environmental vs. contact lens-related) and presence of corneal shield ulcers (only in vernal). Shield ulcers in vernal are sterile and must not be confused with infectious ulcers — treatment differs significantly."
    difficulty: medium
    tags: [ophthalmology, vernal keratoconjunctivitis, GPC, giant papillary conjunctivitis, contact lens, shield ulcer]
  - front: "What are the features and treatment of atopic keratoconjunctivitis (AKC)?"
    back: "Atopic keratoconjunctivitis (AKC): onset late adolescence to early adulthood, peak 30-50 yr; intense perennial ocular pruritus, tearing, burning, clear mucus discharge, redness, blurry vision, photophobia, foreign body sensation; thickened lids, conjunctival chemosis/hyperemia, tarsal papillary hypertrophy; severe cases → sub-epithelial fibrosis, fornix foreshortening, corneal neovascularization, ectatic corneal disease. Treatment: calcineurin inhibitor ointment (tacrolimus, pimecrolimus) for eyelids, topical cyclosporine drops, topical corticosteroid drops.\n\nAKC is the most severe form of ocular allergy and can lead to permanent vision loss. Unlike seasonal allergic conjunctivitis, it is perennial and can cause significant corneal complications. Calcineurin inhibitors are steroid-sparing agents useful for chronic management."
    difficulty: hard
    tags: [ophthalmology, atopic keratoconjunctivitis, AKC, ocular allergy, calcineurin inhibitor]
  - front: "What causes gonococcal conjunctivitis in neonates (ophthalmia neonatorum) and what prophylaxis is used?"
    back: "Ophthalmia neonatorum is neonatal conjunctivitis. N. gonorrhoeae: onset within first 5 days of life (short incubation); causes hyperpurulent conjunctivitis; can rapidly perforate the cornea → blindness. C. trachomatis: onset 3-14 days of life (longer incubation); most common cause overall. Prophylaxis: erythromycin 0.5% ophthalmic ointment at birth. Treatment: gonococcal = IM ceftriaxone; chlamydial = oral azithromycin.\n\nIn Canada, neonatal eye prophylaxis with erythromycin 0.5% ointment is standard practice after birth. The timing of presentation helps distinguish etiology: gonorrheal conjunctivitis in first 5 days (very rapid onset) vs. chlamydial at 3-14 days. Aggressive gonococcal treatment is critical to prevent corneal perforation and lifelong blindness."
    difficulty: medium
    tags: [ophthalmology, ophthalmia neonatorum, gonococcal conjunctivitis, neonatal, chlamydia, erythromycin prophylaxis]
  - front: "What is trachoma, what organism causes it, and what are the classic chronic findings?"
    back: "Trachoma is caused by Chlamydia trachomatis and is the leading infectious cause of blindness worldwide. Associated with poor hygiene and dry environments. Acute: conjunctival follicular reaction (especially superior tarsal conjunctiva), corneal SPKs. Chronic: Arlt's line (scarring of superior tarsal conjunctiva), Herbert's pits (scarring of limbal follicles), fibrovascular pannus in superior cornea, symblepharon, upper lid entropion, trichiasis. Treatment: facial cleanliness, oral azithromycin or doxycycline (tetracycline contraindicated in children <8 yr and pregnant women), topical tetracycline 1%.\n\nTrachoma remains a major global health problem. The WHO SAFE strategy (Surgery, Antibiotics, Facial cleanliness, Environmental improvement) is the standard public health approach. Classic findings like Arlt's line and Herbert's pits are high-yield exam facts. The repeated trichiasis from entropion causes corneal scarring and eventual blindness."
    difficulty: medium
    tags: [ophthalmology, trachoma, chlamydia, infectious blindness, Arlts line, Herberts pits]
  - front: "How do you differentiate episcleritis from scleritis clinically?"
    back: "Episcleritis: immunologically mediated, mostly idiopathic; mild discomfort; sectoral or diffuse injection of radially-directed vessels; BLANCHES with topical phenylephrine (constricts superficial episcleral vessels); generally self-limited; treatment = topical steroids, oral NSAIDs. Scleritis: usually unilateral; severe 'deep' or 'boring' pain, may awaken patient at night; scleral/episcleral/conjunctival vessel inflammation; does NOT blanch with phenylephrine; sclera may appear violaceous; vision-threatening — urgent ophthalmology referral; associated with collagen vascular disease (RA, SLE, GPA).\n\nThe phenylephrine test is the key bedside differentiator: episcleritis blanches (superficial vessels), scleritis does not (deep vessels). Scleritis is an indicator of poor systemic disease control and carries increased 5-year mortality (not from the scleritis itself but from the underlying uncontrolled autoimmune disease). Necrotizing scleritis without inflammation (scleromalacia perforans) is strongly associated with RA."
    difficulty: hard
    tags: [ophthalmology, episcleritis, scleritis, phenylephrine test, rheumatoid arthritis, red eye]
  - front: "What are the 5 layers of the cornea (anterior to posterior) and what is the function of each key layer?"
    back: "Corneal layers (ABCDE mnemonic): (1) Anterior epithelium — barrier, extensive V1 sensory fibres (abrasions very painful); (2) Bowman's membrane — acellular, does not regenerate; (3) Corneal stroma — 90% of corneal thickness, uniform collagen structure for transparency; (4) Descemet's membrane — basement membrane of endothelium; (5) Endothelium — dehydrates the cornea (deturgescence); dysfunction → corneal edema. Cornea provides 2/3 of total refractive power of the eye.\n\nThe endothelium is critical for corneal clarity — it pumps fluid out to maintain deturgescence. Endothelial failure (e.g., Fuchs' dystrophy, corneal surgery) leads to corneal edema and vision loss. The cornea is transparent due to avascularity, uniform collagen, and deturgescence. A 6th layer ('Dua's layer') has been proposed but remains debated."
    difficulty: medium
    tags: [ophthalmology, cornea, anatomy, endothelium, Bowmans membrane, Descemets membrane]
  - front: "What is a corneal abrasion, how is it managed, and what precautions apply?"
    back: "Corneal abrasion: epithelial defect due to trauma (fingernails, paper, twigs) or contact lenses. Features: pain, redness, tearing, photophobia, foreign body sensation; de-epithelialized area stains with fluorescein. Complications: infection, ulceration, recurrent erosion, secondary iritis. Treatment: topical antibiotics (fluoroquinolone; moxifloxacin for contact lens or organic matter to cover Pseudomonas); consider topical NSAIDs (caution — risk of corneal melt); cycloplegic for pain relief. DO NOT patch contact lens wearers or abrasions from organic material (infection risk). Most heal spontaneously in 24-48 hours. DO NOT use topical anesthetics for treatment (risk of corneal melt/infection).\n\nKey MCCQE1 teaching points: topical anesthetics are diagnostic only, never therapeutic. Patching is NOT recommended for contact lens-associated or organic abrasions due to infection risk (including Pseudomonas). Organic matter abrasions have higher risk of fungal keratitis. Moxifloxacin covers Pseudomonas, which is critical for contact lens abrasions."
    difficulty: medium
    tags: [ophthalmology, corneal abrasion, fluorescein, topical anesthetic, moxifloxacin, contact lens]
  - front: "What is a corneal ulcer and how does it differ from a corneal abrasion?"
    back: "Corneal abrasion vs. ulcer: Abrasion — acute onset, history of trauma common, clear cornea, iris detail clear, normal thickness, limited to epithelium. Ulcer — subacute (days), trauma rare, white necrotic area, iris obscured, may have crater defect/thinning, extends into stroma. Corneal ulcer: local defect due to infection (bacterial most common, also viral, fungal, Acanthamoeba) or autoimmune. 50% associated with contact lens use. Features: pain, photophobia, decreased VA, corneal opacity/excavated ulcer staining with fluorescein, possible hypopyon. Treatment: urgent ophthalmology referral, culture prior to treatment, intense fortified topical antibiotics (vancomycin + tobramycin) every 1 hour.\n\nCorneal ulcers are sight-threatening. Contact lens use accounts for 50% of cases; Acanthamoeba keratitis is specifically associated with contact lens + water exposure (e.g., swimming). Seidel's test uses fluorescein to detect aqueous leaking from corneal perforation. Hypopyon (pus in anterior chamber) indicates severe intraocular inflammation."
    difficulty: medium
    tags: [ophthalmology, corneal ulcer, corneal abrasion, hypopyon, Seidels test, Acanthamoeba]
  - front: "What are the classic features of herpes simplex keratitis and what is the treatment?"
    back: "HSV keratitis: usually HSV-1 (90% population carriers); risk factor = immunosuppression. Features: pain, tearing, foreign body sensation, red eye, decreased vision; corneal HYPOESTHESIA (reduced corneal sensation); classic = dendritic (thin, branching) lesion with terminal end bulbs on epithelium staining with fluorescein. Other forms: geographic, margin, neurotropic ulcers; stromal keratitis (infectious or immune-mediated); endotheliitis. Complications: corneal scarring, hypoesthesia, secondary iritis, secondary glaucoma. Treatment: oral antiviral (acyclovir, valacyclovir, famciclovir); topical ganciclovir gel 0.15%; debridement of dendrite. NO steroids for epithelial disease. Antiviral prophylaxis (≥1 yr) for recurrent HSV keratitis.\n\nCorneal hypoesthesia is the hallmark feature distinguishing HSV/HZV keratitis from other causes of red eye. The dendritic ulcer with terminal end bulbs is pathognomonic for HSV epithelial keratitis. Topical steroids are contraindicated in epithelial disease but may be used cautiously (under ophthalmologic supervision) for stromal keratitis or iritis, always with concurrent antiviral coverage."
    difficulty: hard
    tags: [ophthalmology, herpes simplex keratitis, HSV, dendritic ulcer, corneal hypoesthesia, acyclovir]
  - front: "What is Hutchinson's sign in herpes zoster ophthalmicus (HZO) and what does it predict?"
    back: "Hutchinson's sign: involvement of the tip of the nose in herpes zoster ophthalmicus, indicating involvement of the nasociliary branch of CN V1. When the tip of the nose is involved, the globe will be involved in approximately 75% of cases. If there is no nasal involvement, the eye is still involved in 1/3 of patients. HZO is reactivation of VZV in the V1 dermatome, unilateral, respecting the midline. Complications: sclerokeratitis, corneal ulceration/perforation, secondary iritis/glaucoma, cataract, acute retinal necrosis, post-herpetic neuralgia. Treatment: oral antivirals (acyclovir, valacyclovir, famciclovir) immediately; vaccination for prevention.\n\nHutchinson's sign is a classic clinical predictor of ocular involvement in HZO and is frequently tested. The nasociliary branch innervates both the tip of the nose and the globe, explaining this correlation. HZO risk factors include age >50 and immunosuppression. Prompt antiviral treatment reduces the risk of post-herpetic neuralgia."
    difficulty: medium
    tags: [ophthalmology, herpes zoster ophthalmicus, HZO, Hutchinsons sign, CN V1, nasociliary, post-herpetic neuralgia]
  - front: "What is keratoconus and how is it managed?"
    back: "Keratoconus: bilateral (usually asymmetric) thinning and ectasia of the cornea resulting in a conical shape; associated with Down syndrome, atopy, contact lens use, chronic eye rubbing; breaks in Descemet's membrane and Bowman's layer. Results in decreased vision from irregular astigmatism, scarring, and stromal edema (hydrops). Detect by looking for lower eyelid bulging (Munson's sign) when patient looks down. Treatment: spectacles → rigid gas permeable/scleral contact lenses → corneal collagen cross-linking (to halt progression) → intrastromal corneal ring segments → penetrating keratoplasty or deep anterior lamellar keratoplasty (last resort).\n\nCorneal collagen cross-linking (CXL) uses riboflavin drops and UV-A light to stiffen corneal collagen and halt progression — it does not reverse existing ectasia. Acute hydrops (sudden corneal edema from Descemet's membrane rupture) presents as acute vision loss and requires urgent ophthalmologic evaluation. The surgical escalation ladder is important for MCCQE1."
    difficulty: hard
    tags: [ophthalmology, keratoconus, ectasia, corneal cross-linking, Down syndrome, irregular astigmatism]
  - front: "What is arcus senilis and when is it clinically significant?"
    back: "Arcus senilis: hazy gray/white ring in the peripheral cornea (<2 mm wide, clearly separated from limbus), due to lipid deposition; bilateral. Common, benign, part of the aging process with no visual symptoms or complications. Clinically significant: if present in patients <40 years old, it may indicate hypercholesterolemia → check lipid profile. No treatment necessary.\n\nArcus senilis is benign in the elderly but warrants lipid workup in younger patients, similar to xanthelasma. Both are peripheral/lid lipid deposits that can signal dyslipidemia in young individuals. Distinguishing arcus from Kayser-Fleischer ring is important: arcus = lipids (gray/white, bilateral, separated from limbus); KF ring = copper in Wilson's disease (brown-yellow-green, starts inferiorly)."
    difficulty: easy
    tags: [ophthalmology, arcus senilis, hypercholesterolemia, cornea, lipid deposition]
  - front: "What is a Kayser-Fleischer ring and what disease is it associated with?"
    back: "Kayser-Fleischer ring: brown-yellow-green pigmented ring in the PERIPHERAL cornea, starting INFERIORLY; due to deposition of copper in Descemet's membrane; associated with Wilson's disease (hepatolenticular degeneration). No associated symptoms or complications from the ring itself. Treatment directed at underlying Wilson's disease (D-penicillamine, trientine, zinc, liver transplant in severe cases).\n\nKF rings are pathognomonic for Wilson's disease when present. They may require slit-lamp examination to detect early rings. Wilson's disease is an autosomal recessive copper metabolism disorder causing hepatic, neuropsychiatric, and ocular manifestations. Always consider Wilson's disease in a young patient with liver disease, movement disorder, and KF rings."
    difficulty: easy
    tags: [ophthalmology, Kayser-Fleischer ring, Wilsons disease, copper, Descemets membrane]
  - front: "What are the anatomic classifications of uveitis and the key clinical features of anterior uveitis?"
    back: "Uveitis classification: Anterior (iritis/iridocyclitis) — inflammation of iris ± ciliary body; Intermediate — vitreous is primary site (snowballs/snowbanks at pars plana); Posterior — choroiditis, retinitis, or chorioretinitis; Panuveitis. Anterior uveitis features: photophobia (reactive iris spasm), ocular pain, globe tenderness, brow ache (ciliary muscle spasm), decreased VA, lacrimation; ciliary flush (perilimbal injection); miosis (sphincter spasm); anterior chamber 'cells' (WBCs) and 'flare' (protein from blood-aqueous barrier breakdown); hypopyon (neutrophil collection inferiorly); keratic precipitates. Note: iritis usually REDUCES IOP (ciliary body inflammation → less aqueous production), but severe iritis or herpetic iritis may cause inflammatory glaucoma (trabeculitis).\n\nThe distinction between aqueous 'cells' and 'flare' is clinically important: cells = active inflammation (WBCs); flare = breakdown of blood-aqueous barrier (protein). Hypopyon indicates severe inflammation. The paradox of low IOP in iritis vs. elevated IOP in trabeculitis is a high-yield MCCQE1 concept. Anterior uveitis is usually unilateral; intermediate and posterior are often bilateral."
    difficulty: hard
    tags: [ophthalmology, uveitis, anterior uveitis, iritis, hypopyon, ciliary flush, flare]
  - front: "What are the HLA-B27-associated causes of anterior uveitis?"
    back: "HLA-B27-associated anterior uveitis: reactive arthritis (formerly Reiter's syndrome), ankylosing spondylitis, psoriatic arthritis, and inflammatory bowel disease (Crohn's disease, ulcerative colitis). Non-HLA-B27 causes include juvenile idiopathic arthritis (JIA). Other causes: infectious (syphilis, Lyme, toxoplasmosis, TB, HSV, HZV), sarcoidosis, tubulointerstitial nephritis and uveitis syndrome (TINU), trauma, large corneal abrasion, post-ocular surgery.\n\nHLA-B27 is the most important genetic marker for seronegative spondyloarthropathies and their associated uveitis. These conditions cause recurrent acute anterior uveitis (typically unilateral, alternating). JIA-associated uveitis is notable for being chronic, often asymptomatic, and predominantly anterior — regular slit-lamp screening is essential for these children."
    difficulty: medium
    tags: [ophthalmology, anterior uveitis, HLA-B27, ankylosing spondylitis, reactive arthritis, psoriatic arthritis, IBD]
  - front: "What are the causes of posterior uveitis and what is the most common parasitic cause?"
    back: "Posterior uveitis: inflammation of choroid (choroiditis), retina (retinitis), or both (chorioretinitis). Etiology: Bacterial — syphilis, tuberculosis; Viral — HSV, HZV, CMV (in AIDS); Fungal — histoplasmosis, candidiasis; Parasitic — toxoplasmosis (most common parasitic cause), toxocara; Autoimmune — Behçet's disease (triad: oral ulcers + genital ulcers + posterior uveitis); Malignancies (masquerade syndrome): metastatic lesions, malignant melanoma, lymphoma. Clinical features: PAINLESS; decreased VA; floaters (debris and inflammatory cells); vitreous cells and opacities; often no conjunctival/scleral injection.\n\nToxoplasmosis is the most common cause of infectious posterior uveitis worldwide. It presents as a focal retinochoroiditis ('headlight in the fog' appearance — white retinal lesion adjacent to pigmented scar). CMV retinitis is a major cause of blindness in AIDS patients with CD4 <50. Behçet's disease causing posterior uveitis can be vision-threatening and requires aggressive immunosuppression."
    difficulty: hard
    tags: [ophthalmology, posterior uveitis, toxoplasmosis, CMV retinitis, Behcets disease, chorioretinitis]
  - front: "What is scleritis, what systemic diseases are associated with it, and why is it considered life-threatening?"
    back: "Scleritis: severe deep/boring pain (may awaken patient at night), photophobia, red eye, decreased vision; violaceous hue to sclera; does NOT blanch with phenylephrine; may cause scleral thinning. Types: anterior (diffuse, nodular, necrotizing with/without inflammation — scleromalacia perforans) and posterior (rapidly progressive blindness, exudative retinal detachment). Associated systemic diseases: RA (most common), SLE, GPA (Wegener's), ankylosing spondylitis, TB, sarcoidosis, syphilis, gout, thyrotoxicosis. Life-threatening because: scleritis indicates POOR SYSTEMIC DISEASE CONTROL → increased 5-year mortality (from uncontrolled autoimmune disease, not the scleritis itself). Treatment: systemic NSAIDs, systemic steroids, immunomodulators; urgent ophthalmology referral.\n\nThe 5-year mortality associated with scleritis is due to the underlying uncontrolled autoimmune disease, not the eye condition itself. This makes diagnosis critical as it may prompt systemic investigation and treatment. Scleromalacia perforans (asymptomatic necrotizing scleritis without inflammation) is strongly associated with long-standing RA and can lead to spontaneous globe perforation."
    difficulty: hard
    tags: [ophthalmology, scleritis, scleromalacia perforans, rheumatoid arthritis, GPA, mortality]
  - front: "What is recurrent corneal erosion syndrome and how is it managed?"
    back: "Recurrent corneal erosion: recurrent episodes of pain, photophobia, and foreign body sensation with spontaneous corneal epithelial defect, typically on awakening; due to improper adhesion of epithelium to basement membrane. Causes: previous traumatic corneal abrasion, corneal dystrophy (esp. map-dot-fingerprint dystrophy), idiopathic. Treatment: initial = same as corneal abrasion; maintenance = topical hypertonic saline ointment at bedtime for 6-12 months, topical lubrication; for chronic recurrences: bandage contact lens, anterior stromal puncture, superficial keratectomy with diamond burr polishing, or phototherapeutic keratectomy (PTK).\n\nThe characteristic onset upon awakening occurs because the eyelids adhere to the loosely attached epithelium during sleep; opening the eyes literally tears off the surface epithelium. Hypertonic saline creates an osmotic gradient that draws fluid from the epithelium, improving adhesion. PTK uses excimer laser to remove irregular epithelium and surface irregularities."
    difficulty: medium
    tags: [ophthalmology, recurrent corneal erosion, epithelial adhesion, hypertonic saline, phototherapeutic keratectomy]
  - front: "What are the key features of Horner's syndrome and what is the pharmacologic diagnostic test of choice?"
    back: "Horner's syndrome: miosis, ptosis, anhidrosis, pseudoenophthalmos (ipsilateral). Anisocoria is greater in dim light. Apraclonidine (strong α-2, weak α-1 blocker) is the most common pharmacologic diagnostic test — denervation hypersensitivity causes dilation of the Horner pupil but not the normal pupil, reversing the anisocoria.\n\nHorner's syndrome results from a lesion in the sympathetic pathway. The affected pupil fails to dilate in dim light due to decreased adrenergic innervation to the iris dilator muscle. Acute Horner's syndrome (<14 days) requires urgent rule-out of carotid artery dissection. Apraclonidine has replaced cocaine as the preferred diagnostic test in clinical practice."
    difficulty: medium
    tags: [ophthalmology, pupil, Horner syndrome, sympathetic pathway, anisocoria]
  - front: "What are the causes of Horner's syndrome and which acute cause must always be ruled out?"
    back: "Causes: mostly idiopathic; others include brainstem infarct (lateral medullary syndrome), Pancoast tumour, neck surgery, and carotid artery dissection. Carotid artery dissection MUST be ruled out in acute Horner's syndrome (<14 days old).\n\nCarotid artery dissection can cause ipsilateral Horner's syndrome and carries risk of stroke. Pancoast tumour compresses the sympathetic chain at the apex of the lung. Lateral medullary (Wallenberg) syndrome is a brainstem cause affecting the central sympathetic tract."
    difficulty: medium
    tags: [ophthalmology, Horner syndrome, carotid dissection, Pancoast tumour]
  - front: "How do cocaine 4-10% eye drops confirm the diagnosis of Horner's syndrome?"
    back: "Cocaine blocks reuptake of norepinephrine. In Horner's syndrome, the affected pupil does NOT dilate with cocaine (because there is no norepinephrine being released to be 'saved'), while the normal pupil WILL dilate. This confirms the diagnosis.\n\nCocaine confirms the presence of Horner's syndrome but cannot localize the lesion (preganglionic vs. postganglionic). Hydroxyamphetamine 1% can distinguish central/preganglionic (will dilate) from postganglionic (will NOT dilate) lesions, but is not available in Canada."
    difficulty: hard
    tags: [ophthalmology, Horner syndrome, pharmacology, cocaine test]
  - front: "What are the features of Argyll-Robertson pupils and what condition is classically associated?"
    back: "Argyll-Robertson pupils: bilateral, irregular, small (<3 mm), +/- ptosis. They do NOT respond to light but DO respond to accommodation (light-near dissociation). Classically associated with neurosyphilis (also DM, encephalitis, MS, chronic alcoholism, CNS degenerative diseases).\n\nThe lesion is thought to be in the midbrain (periaqueductal gray or pretectal region). The mnemonic 'Prostitute's pupils' — accommodate but don't react — reflects the light-near dissociation. Neurosyphilis is the most MCCQE1-tested association."
    difficulty: medium
    tags: [ophthalmology, Argyll-Robertson, neurosyphilis, pupil, light-near dissociation]
  - front: "What is Adie's tonic pupil and how is it diagnosed pharmacologically?"
    back: "Adie's tonic pupil: unilateral (80%), larger pupil in bright light, poor reaction to light (both direct and consensual), better reaction to accommodation. Caused by benign lesion in the ciliary ganglion (parasympathetic denervation). Diagnosis: dilute 0.125% pilocarpine constricts the tonic pupil (denervation hypersensitivity) but has NO effect on the normal pupil. Long-standing Adie's pupil becomes smaller than the unaffected eye.\n\nDenervation hypersensitivity occurs because the parasympathetic constrictor muscle has lost its nerve supply and upregulates receptors. Dilute pilocarpine is too weak to affect a normally innervated iris but constricts a supersensitive denervated one. F>M prevalence."
    difficulty: hard
    tags: [ophthalmology, Adie tonic pupil, ciliary ganglion, pilocarpine, denervation hypersensitivity]
  - front: "What is a Relative Afferent Pupillary Defect (RAPD) and how is it tested?"
    back: "RAPD (Marcus Gunn pupil): impaired direct pupillary response to light from a lesion in the visual afferent (sensory) pathway, anterior to the optic chiasm. Test: swinging flashlight test — when light swings from the unaffected to the affected eye, both pupils paradoxically DILATE. Cataracts and symmetric optic neuropathy do NOT produce RAPD.\n\nRAPD reflects unilateral or asymmetric damage to the optic nerve (e.g., optic neuritis, ischemic optic neuropathy) or severe retinopathy (e.g., CRAO, large RD, CRVO). The pupillary reflex arc relies on intact afferent input — when the affected eye is illuminated, less signal reaches the Edinger-Westphal nucleus, causing apparent dilation."
    difficulty: medium
    tags: [ophthalmology, RAPD, Marcus Gunn pupil, swinging flashlight, optic neuropathy]
  - front: "What conditions cause a dilated, fixed pupil that WILL constrict with pilocarpine vs. those that WILL NOT?"
    back: "Will constrict with pilocarpine: Adie's tonic pupil (hypersensitivity to dilute 0.125% pilocarpine), CN III palsy (constricts with standard pilocarpine). Will NOT constrict: Pharmacologic dilation (atropine/tropicamide blockade of iris sphincter — sphincter is blocked, not denervated).\n\nThis pharmacologic distinction is clinically important: a patient post-surgical with a dilated pupil from accidental scopolamine/atropine exposure will not constrict with pilocarpine. CN III palsy and Adie's will both constrict, but require different pilocarpine concentrations."
    difficulty: hard
    tags: [ophthalmology, mydriasis, pilocarpine, pharmacologic dilation, CN III palsy]
  - front: "What are the features distinguishing CN III palsy from a Horner's syndrome regarding the pupil?"
    back: "CN III palsy: dilated (mydriatic), fixed pupil at 7-8 mm; anisocoria greater in light; eye deviated down and out with ptosis. Horner's syndrome: constricted (miotic) pupil; anisocoria greater in dark; ptosis + anhidrosis + pseudoenophthalmos.\n\nCN III palsy affects parasympathetic (pupilloconstrictor) fibers that run on the outside of the nerve, making them susceptible to compressive lesions (aneurysm, herniation) that spare the pupil in microvascular (diabetic) CN III palsy. Horner's disrupts the sympathetic (pupillodilator) pathway."
    difficulty: medium
    tags: [ophthalmology, CN III palsy, Horner syndrome, anisocoria, pupil]
  - front: "What is the most common primary intraocular malignancy in adults and where does it most commonly metastasize?"
    back: "Uveal melanoma (specifically choroidal melanoma, 90%). Most common 1° intraocular malignancy in adults. Hepatic metastases predominate. More prevalent in White individuals.\n\nUveal melanoma arises from the uveal tract (iris, ciliary body, choroid). Despite treatment, it can remain dormant and re-emerge with metastasis years later. Intraocular metastases (most commonly from breast and lung) are actually more common overall than primary uveal melanoma as a category of intraocular malignancy."
    difficulty: medium
    tags: [ophthalmology, uveal melanoma, choroidal melanoma, intraocular malignancy, metastasis]
  - front: "What is the most common intraocular malignancy overall in adults and what are the most common primary sources?"
    back: "Metastatic disease is the most common intraocular malignancy in adults. Most common primary sources: breast and lung (in adults); neuroblastoma (in children). Metastases usually infiltrate the choroid.\n\nThe choroid has a rich blood supply making it the most common site for intraocular metastases. Presentations include decreased or distorted vision, irregularly shaped pupil, iritis, and hyphema. Treatment is local radiation or chemotherapy; enucleation for blind/painful eyes."
    difficulty: easy
    tags: [ophthalmology, intraocular metastasis, choroid, breast cancer, lung cancer]
  - front: "What is the most common eyelid malignancy and what are its clinical features?"
    back: "Basal cell carcinoma (BCC) accounts for 90% of lid carcinomas. Features: ulcerated centre ('rodent ulcer'), indurated base with pearly rolled edges, telangiectasia. Spreads via local invasion; rarely metastasizes.\n\nBCC of the eyelid is the most common eyelid malignancy. Sebaceous cell carcinoma (1-5%) is important to recognize as it masquerades as chronic blepharitis or recurrent chalazion and is highly invasive with metastatic potential. SCC (<5%) can spread to lymph nodes."
    difficulty: easy
    tags: [ophthalmology, eyelid carcinoma, basal cell carcinoma, rodent ulcer]
  - front: "A patient with recurrent chalazion not responding to treatment — what malignancy must be considered?"
    back: "Sebaceous cell carcinoma of the eyelid. It commonly masquerades as chronic blepharitis or recurrent chalazion. It is highly invasive and metastasizes. Incisional biopsy is required for diagnosis.\n\nSebaceous cell carcinoma accounts for 1-5% of lid carcinomas but is disproportionately dangerous due to its ability to mimic benign inflammatory conditions, leading to delayed diagnosis. Any recurrent or atypical chalazion in an older patient should raise suspicion."
    difficulty: medium
    tags: [ophthalmology, sebaceous cell carcinoma, chalazion, eyelid malignancy]
  - front: "What are the ocular manifestations of HIV/AIDS affecting the retina?"
    back: "HIV retinopathy (most common): cotton wool spots (>50% of HIV patients), intraretinal hemorrhage. CMV retinitis: necrotizing retinitis with retinal hemorrhages and vasculitis ('brushfire' or 'pizza pie' appearance), scotoma, blurred vision, floaters — treated with ganciclovir or foscarnet. Also: herpes simplex/zoster necrotizing retinitis, toxoplasmosis chorioretinitis, Candida retinitis/vitritis.\n\nUp to 75% of patients with AIDS have ocular manifestations. CMV retinitis is the most serious, progressing to the other eye in 4-6 weeks if untreated. Cotton wool spots from HIV microvasculopathy are the most common finding. CMV retinitis is treated with virostatic agents (not curative)."
    difficulty: medium
    tags: [ophthalmology, HIV, CMV retinitis, HIV retinopathy, cotton wool spots, immunocompromised]
  - front: "What is the appearance and treatment of CMV retinitis in AIDS patients?"
    back: "CMV retinitis: necrotizing retinitis with retinal hemorrhages and vasculitis, 'brushfire' or 'pizza pie' appearance. Presents with scotoma, blurred vision, floaters. Untreated, will spread to the other eye in 4-6 weeks. Treatment: ganciclovir or foscarnet via IV, intravitreal injection, or PO (virostatic, not curative).\n\nCMV retinitis is an AIDS-defining illness typically seen when CD4 count <50 cells/μL. The 'pizza pie' appearance refers to the yellow-white necrotic areas with hemorrhage. Ganciclovir is first-line; foscarnet is used for resistance or nephrotoxic patients."
    difficulty: medium
    tags: [ophthalmology, CMV retinitis, AIDS, ganciclovir, foscarnet]
  - front: "What are the features of ocular toxoplasmosis and how is it treated?"
    back: "Ocular toxoplasmosis: focal grey-yellow-white chorioretinal lesions with surrounding vasculitis and vitreous inflammation (vitreous cells). Can be congenital (transplacental) or acquired (Toxoplasma gondii from raw meat/cat feces). Congenital form more likely to involve the macula and cause visual impairment. Treatment: pyrimethamine + sulfonamide + folinic acid, or clindamycin. Add steroids if severe inflammation (vitritis, macular, or optic nerve involvement) after initiating antimicrobials.\n\nOcular toxoplasmosis is the most common cause of posterior uveitis worldwide. Congenital toxoplasmosis can cause bilateral macular lesions and severe vision loss. In immunocompromised patients (HIV/AIDS), toxoplasmosis can cause extensive necrotizing retinitis."
    difficulty: medium
    tags: [ophthalmology, toxoplasmosis, chorioretinitis, uveitis, congenital infection]
  - front: "What are the stages of diabetic retinopathy and their defining features?"
    back: "Non-proliferative (background) DR: microaneurysms, dot-and-blot hemorrhages, hard exudates (lipid deposits), retinal edema. Advanced non-proliferative (pre-proliferative): IRMA (intraretinal microvascular abnormalities), retinal hemorrhages + MAs in all 4 quadrants, cotton-wool spots (NFL infarcts). Proliferative DR: neovascularization of disc/retina/iris (rubeosis iridis), vitreous hemorrhage, tractional RD — 5% of DM patients reach this stage.\n\nThe 4-2-1 rule identifies high-risk pre-proliferative DR: hemorrhages/microaneurysms in 4 quadrants, venous beading in 2 quadrants, IRMA in 1 quadrant. Clinically significant macular edema (CSME) is defined as retinal thickening at or within 500 μm of the centre of the macula."
    difficulty: medium
    tags: [ophthalmology, diabetic retinopathy, classification, proliferative DR, IRMA]
  - front: "What are the Canadian screening guidelines for diabetic retinopathy?"
    back: "Type 1 DM: screen annually beginning 5 years after disease onset; annual screening for all patients >12 years and/or entering puberty. Type 2 DM: initial examination at time of diagnosis, then annually. Pregnancy: ocular exam in 1st trimester, close follow-up throughout (pregnancy exacerbates DR). Gestational diabetes patients are NOT at risk of DR.\n\nThese screening intervals reflect the time required for DR to develop and the ability to detect changes early. T1DM patients rarely develop DR within the first 5 years, hence the delayed start. T2DM often already has DR at diagnosis. Pregnancy is a known accelerant of DR progression."
    difficulty: medium
    tags: [ophthalmology, diabetic retinopathy, screening, diabetes, Canadian guidelines]
  - front: "What are the treatment options for diabetic retinopathy at each stage?"
    back: "Primary prevention: tight control of blood glucose, BP, lipids, kidney function (DCCT). Secondary prevention: regular screening. Tertiary prevention: pan-retinal laser photocoagulation (PRP) for proliferative DR; intravitreal corticosteroids or anti-VEGF for fovea-involved diabetic macular edema; macular photocoagulation laser for CSME not involving centre of macula; vitrectomy for non-clearing vitreous hemorrhage + tractional RD in PDR.\n\nPRP reduces neovascularization by destroying ischemic retina, reducing the angiogenic stimulus (VEGF production). Anti-VEGF agents (aflibercept, bevacizumab, ranibizumab) are now preferred over laser for DME — Cochrane 2018 showed all three are more effective than laser for improving vision. Aflibercept shows superior results vs. bevacizumab in eyes with worse baseline VA."
    difficulty: hard
    tags: [ophthalmology, diabetic retinopathy, treatment, anti-VEGF, pan-retinal photocoagulation, vitrectomy]
  - front: "In diabetic CN III palsy, what distinguishes it from compressive CN III palsy regarding the pupil?"
    back: "Diabetic (microvascular) CN III palsy: pupil usually SPARED (miosis absent), but ptosis IS observed. Compressive CN III palsy (e.g., posterior communicating artery aneurysm): pupil is INVOLVED (dilated, fixed). Both usually recover within a few months for diabetic causes.\n\nParasympathetic pupillomotor fibers travel on the outer surface of CN III and are most vulnerable to compression (by aneurysm or mass). Microvascular ischemia damages the inner fibers (motor) while sparing the peripheral pupillomotor fibers. A fixed, dilated pupil in CN III palsy should trigger urgent imaging to rule out PCA aneurysm."
    difficulty: hard
    tags: [ophthalmology, CN III palsy, diabetic CN III palsy, PCA aneurysm, pupil sparing]
  - front: "What are the features of hypertensive retinopathy and the Modified Scheie Classification?"
    back: "Acute HTN retinopathy: arteriolar spasm, superficial retinal hemorrhage, cotton wool spots, optic disc edema. Chronic HTN retinopathy: AV nicking, flame/dot/blot retinal hemorrhages, cotton wool spots. Modified Scheie: Grade 0 = no changes; Grade 1 = mild arterial narrowing; Grade 2 = obvious narrowing + focal irregularities; Grade 3 = Grade 2 + hemorrhages/exudates; Grade 4 = Grade 3 + swollen optic nerve (malignant HTN).\n\nHTN retinopathy differs from diabetic retinopathy: HTN causes AV nicking (where arterioles compress venules at crossings) and flame-shaped hemorrhages (in nerve fiber layer), while DM causes dot-and-blot hemorrhages (deeper) and hard exudates from lipid leakage. Grade 4 = papilledema indicates malignant hypertension."
    difficulty: medium
    tags: [ophthalmology, hypertensive retinopathy, Scheie classification, AV nicking, papilledema]
  - front: "What are the ocular manifestations of multiple sclerosis?"
    back: "Optic neuritis: blurred vision + decreased colour vision, central scotoma (papillomacular bundle damage), RAPD; treated with IV steroids then taper to oral. INO (internuclear ophthalmoplegia): diplopia. Also: ptosis, nystagmus, uveitis, optic atrophy. White matter demyelinating lesions of optic nerve on MRI.\n\nOptic neuritis is often the first manifestation of MS. The Optic Neuritis Treatment Trial showed IV methylprednisolone speeds recovery but does not improve final visual outcome vs. oral steroids. Importantly, oral steroids ALONE are contraindicated as they INCREASE the risk of developing MS compared to IV treatment."
    difficulty: medium
    tags: [ophthalmology, multiple sclerosis, optic neuritis, INO, RAPD, MS]
  - front: "Why should optic neuritis NOT be treated with oral corticosteroids alone?"
    back: "Oral corticosteroids alone for optic neuritis are contraindicated because they INCREASE the risk of developing MS. IV steroids with taper to oral form are the recommended treatment. Cochrane review shows similar outcomes for VA, contrast sensitivity, and visual field between placebo and corticosteroids at 6 months.\n\nThe Optic Neuritis Treatment Trial (ONTT) demonstrated that IV methylprednisolone followed by oral prednisone sped recovery but did not improve 6-month visual outcomes. Oral prednisone alone was associated with a higher rate of recurrent optic neuritis. This is a classic MCCQE1 fact."
    difficulty: hard
    tags: [ophthalmology, optic neuritis, corticosteroids, multiple sclerosis, IV steroids]
  - front: "What is amaurosis fugax and what is the most common cause?"
    back: "Amaurosis fugax: sudden, transient monocular blindness from intermittent vascular compromise, typically lasting <5-10 minutes. Most common embolic source: ipsilateral carotid artery. Hollenhorst plaques (glistening microemboli at branch points of retinal arterioles) may be observed.\n\nAmaurosis fugax is a form of TIA affecting the retinal circulation (ophthalmic artery branch of ICA). It is a warning sign for ipsilateral carotid stenosis and impending stroke. Hollenhorst plaques are cholesterol emboli. Urgent carotid imaging and cardioembolic workup are indicated."
    difficulty: easy
    tags: [ophthalmology, amaurosis fugax, TIA, carotid artery, Hollenhorst plaques, monocular blindness]
  - front: "What are the ocular manifestations of Graves' disease and what is the most common cause of unilateral or bilateral proptosis in adults?"
    back: "Graves' disease is the most common cause of unilateral or bilateral proptosis in adults. Manifestations: proptosis (exophthalmos), lid retraction, lid lag, diplopia, compressive optic neuropathy, corneal exposure. Caused by increased fibroblast proliferation and accumulation of hydrophilic glycosaminoglycans in extraocular muscles and orbital tissues. NO SPECS classification: No signs/symptoms → Only signs (lid retraction/lag) → Soft tissue swelling → Proptosis → Extraocular muscle weakness → Corneal exposure → Sight loss.\n\nThyroid eye disease (Graves' ophthalmopathy) can occur despite control of thyroid function. Treatment: manage hyperthyroidism, maintain corneal hydration, steroids (acute phase), orbital decompression, external beam radiation. Strabismus/eyelid surgery is deferred until the acute phase subsides."
    difficulty: medium
    tags: [ophthalmology, Graves disease, proptosis, exophthalmos, thyroid eye disease, NO SPECS]
  - front: "What is the most common ocular manifestation of connective tissue disorders (RA, SLE, Sjögren's)?"
    back: "Dry eyes (keratoconjunctivitis sicca) is the most common ocular manifestation of connective tissue disorders including RA, juvenile idiopathic arthritis, SLE, Sjögren's syndrome, ankylosing spondylitis, and polyarteritis nodosa.\n\nSjögren's syndrome classically presents with xerophthalmia (dry eyes) and xerostomia (dry mouth) from lymphocytic infiltration of lacrimal and salivary glands. In ankylosing spondylitis, acute anterior uveitis (iritis) is also common. Hydroxychloroquine (used for RA/SLE) can cause hydroxychloroquine retinopathy."
    difficulty: easy
    tags: [ophthalmology, connective tissue disease, dry eyes, keratoconjunctivitis sicca, Sjogren]
  - front: "What are the clinical features of Giant Cell Arteritis (GCA) relevant to ophthalmology and how is it managed?"
    back: "GCA (temporal arteritis): more common in women >60 years. Ocular features: sudden vision loss (ischemic optic neuropathy or CRAO), often preceded by transient monocular vision loss. High risk of contralateral eye involvement if untreated. Systemic: pain over temporal artery, jaw claudication, scalp tenderness, constitutional symptoms, PMHx of PMR. Labs: thrombocytosis, elevated ESR and CRP. Diagnosis confirmed by temporal artery biopsy within 2 weeks. Treatment: START HIGH-DOSE CORTICOSTEROIDS IMMEDIATELY (do not wait for biopsy).\n\nGCA causes granulomatous inflammation of medium/large vessels. The principle is: when GCA is clinically suspected, treatment with high-dose corticosteroids must begin STAT to prevent irreversible vision loss, and temporal artery biopsy should be performed within 2 weeks (steroids do not significantly affect biopsy results within this window). Skip lesions in the biopsy specimen can produce false negatives."
    difficulty: medium
    tags: [ophthalmology, giant cell arteritis, temporal arteritis, ischemic optic neuropathy, ESR, corticosteroids]
  - front: "What are the ocular manifestations of sarcoidosis?"
    back: "Sarcoidosis: granulomatous uveitis with large 'mutton fat' keratic precipitates and posterior synechiae. Complications: glaucoma, cataracts, retinal hemorrhages, peripheral retinal neovascularization, dry eye. Neurosarcoidosis: optic neuropathy, oculomotor abnormalities, visual field loss. Treatment: topical/systemic steroids + mydriatics.\n\nSarcoidosis-related uveitis is typically granulomatous (large keratic precipitates = 'mutton fat' vs. small non-granulomatous precipitates). Posterior synechiae are adhesions between iris and lens. Bilateral hilar lymphadenopathy + uveitis in a young African-Canadian patient should raise suspicion for sarcoidosis."
    difficulty: medium
    tags: [ophthalmology, sarcoidosis, uveitis, mutton fat keratic precipitates, granulomatous]
  - front: "What is strabismus and how is it classified?"
    back: "Strabismus: ocular misalignment in one or both eyes (up to 3% of children). Classification: manifest (heterotropia) vs. latent (heterophoria); comitant (equal deviation in all gaze positions) vs. incomitant (worse in certain positions — paralytic or restrictive); by direction: eso- (inward), exo- (outward), hyper- (upward), hypo- (downward). Distinguish from pseudostrabismus (prominent epicanthal folds, hypertelorism).\n\nStrabismus can lead to amblyopia in children if not treated early. Heterotropia (manifest) = deviation seen even when using both eyes; heterophoria (latent) = deviation corrected by fusion mechanism and only revealed with cover testing. Pseudostrabismus has a normal Hirschberg test."
    difficulty: easy
    tags: [ophthalmology, strabismus, heterotropia, heterophoria, pediatric ophthalmology]
  - front: "How do cover tests differentiate -tropias from -phorias?"
    back: "Cover-uncover test: cover one eye, observe the UNCOVERED eye for movement → movement of uncovered eye = tropia (picking up fixation). Alternate cover test: reveals total deviation (latent + manifest). Movement of the OCCLUDED eye when uncovered = phoria. Hirschberg test (corneal light reflex): asymmetric reflex = positive for tropia; false positives from angle kappa.\n\nIn a tropia, the deviated eye moves to fixate when the dominant eye is covered. In a phoria, the deviation is present only when binocular fusion is disrupted by covering. The alternate prism cover test quantifies the deviation using prisms."
    difficulty: medium
    tags: [ophthalmology, cover test, strabismus, tropia, phoria, Hirschberg test]
  - front: "What distinguishes paralytic/restrictive strabismus from non-paralytic strabismus?"
    back: "Paralytic/restrictive (incomitant) strabismus: deviation worse in certain gaze positions, any age (usually acquired), causes include CN III/IV/VI palsy (ischemia-DM, MS, aneurysm, tumour, trauma), myasthenia gravis, Graves' disease, orbital fracture with EOM entrapment. Diplopia is COMMON. Non-paralytic (comitant) strabismus: equal deviation all positions, usually congenital/early childhood, no restriction in eye movements, diplopia is UNCOMMON (image from deviated eye suppressed), risk of amblyopia is common.\n\nThe key distinction: incomitant = think structural/neurological cause needing investigation; comitant = likely developmental with amblyopia risk. Amblyopia rarely develops in paralytic strabismus (acquired after visual maturity) but is common in comitant strabismus if untreated in childhood."
    difficulty: hard
    tags: [ophthalmology, strabismus, paralytic strabismus, comitant strabismus, amblyopia, diplopia]
  - front: "What is accommodative esotropia and how is it treated?"
    back: "Accommodative esotropia: excessive accommodation triggers the near reflex triad (convergence, accommodation, miosis), causing esotropia in hyperopic children. Average onset: 2.5 years. Fully accommodative esotropia: completely reversible with spectacle correction of refractive error. Partially accommodative esotropia: partial resolution with spectacle correction.\n\nChildren with hyperopia must accommodate heavily to focus, which reflexively drives convergence (AC/A ratio). Correcting the refractive error with glasses reduces accommodation demand and the associated convergence. Residual deviation after full refractive correction may require surgery."
    difficulty: medium
    tags: [ophthalmology, accommodative esotropia, strabismus, hyperopia, pediatric ophthalmology]
  - front: "What is amblyopia, what are its causes, and when is treatment most effective?"
    back: "Amblyopia: neurodevelopmental visual disorder with unilateral (or less commonly bilateral) reduction of BCVA not attributable solely to ocular structural abnormality. Most common cause of vision loss in children. Causes: strabismus (~50%), anisometropia (asymmetric refractive errors), deprivation (ptosis, cataract, corneal opacity). Treatment less effective after age 8-10 years, but may still be attempted up to age 17. 90% of strabismic/anisometropic amblyopia achieves good vision if treated before age 4. Diagnosis: 'Holler test' (young child resists covering the good eye).\n\nAmblyopia results from abnormal visual experience during the critical period of visual development, causing the cortex to suppress the image from the affected eye. Early intervention (patching the good eye to force use of the amblyopic eye, or atropine penalization) is essential. Deprivational amblyopia has a worse prognosis than strabismic or anisometropic."
    difficulty: medium
    tags: [ophthalmology, amblyopia, lazy eye, strabismus, anisometropia, pediatric ophthalmology, critical period]
  - front: "What is the treatment for amblyopia and what are the risks?"
    back: "Amblyopia treatment: (1) Occlusion — part-time patching of the GOOD eye to force brain to use the non-dominant eye. (2) Cycloplegic drops (atropine) to blur vision in good eye. Risks: permanent vision loss in affected eye; reverse amblyopia (over-treatment of better-seeing eye); safety glasses/polycarbonate lenses recommended if VA in worse eye <20/50; subnormal binocular vision/stereopsis.\n\nFollow-up is essential to prevent reverse amblyopia. Treatment efficacy decreases with age due to reduced cortical plasticity. No proven value for vision therapy/training in treating strabismus or amblyopia (contrary to popular belief). Deprivational amblyopia (from cataract/ptosis) requires treatment of the underlying cause first."
    difficulty: medium
    tags: [ophthalmology, amblyopia, patching, atropine, reverse amblyopia, treatment]
  - front: "What is leukocoria and what are the differential diagnoses?"
    back: "Leukocoria: white pupillary reflex (absent red reflex). Urgent referral to ophthalmologist is required. Differential diagnosis: retinoblastoma, cataract, Coats disease (exudative retinal telangiectasis), persistent fetal vasculature, retinal coloboma, retinal detachment, congenital infections (toxoplasmosis, toxocariasis), retinopathy of prematurity (ROP).\n\nLeukocoria is a red flag sign in pediatric patients. The most dangerous diagnosis is retinoblastoma, which is the most common intraocular malignancy in children. Any child with abnormal or absent red reflex on fundoscopy (e.g., during well-baby checks) requires urgent ophthalmology referral."
    difficulty: easy
    tags: [ophthalmology, leukocoria, white pupillary reflex, retinoblastoma, pediatric ophthalmology, red reflex]
  - front: "What is retinoblastoma and what are its key features?"
    back: "Retinoblastoma: most common primary intraocular malignancy in children. Incidence: 1/15,000. Unilateral (2/3) or bilateral (1/3). Genetic: RB1 gene inactivation (tumour suppressor); MYCN amplification in rare cases. Inherited forms likely bilateral. Presents with leukocoria and/or strabismus. Diagnosed by fundus exam (white/cream nodular masses with intralesional vessels), US or MRI (calcified mass, RD). Treatment: local (laser, cryotherapy, intra-arterial chemotherapy), systemic chemotherapy, and/or enucleation + genetic counselling.\n\nRetinoblastoma follows Knudson's 'two-hit hypothesis' for RB1 — both alleles of the tumour suppressor must be inactivated. Bilateral cases are usually hereditary (germline mutation). Screening of siblings and children is essential for genetic cases. Calcification on US/MRI is characteristic."
    difficulty: medium
    tags: [ophthalmology, retinoblastoma, RB1, leukocoria, pediatric malignancy, intraocular malignancy]
  - front: "What is retinopathy of prematurity (ROP), what are the risk factors, and how is it staged?"
    back: "ROP: vasoproliferative retinopathy causing childhood blindness, major cause in low/middle-income countries. Risk factors: gestational age <31 weeks, birth weight <1250 g, high oxygen exposure (assisted ventilation >1 week), low caloric intake, postnatal hyperglycemia, non-Black race. Staging: Stage 1 = flat white demarcation line; Stage 2 = elevated ridge; Stage 3 = extra-retinal fibrovascular tissue into vitreous; Stage 4 = partial RD (4A macula on, 4B macula off); Stage 5 = total RD. Plus (+) disease = dilatation and tortuosity of retinal vessels.\n\nROP occurs because premature retinal vasculature is incompletely formed, and supplemental oxygen suppresses VEGF, halting vascular growth. When oxygen is reduced, the ischemic avascular retina releases excess VEGF, causing abnormal neovascularization. Zone I disease is most severe (near optic nerve)."
    difficulty: hard
    tags: [ophthalmology, retinopathy of prematurity, ROP, prematurity, neonatal ophthalmology]
  - front: "What are the indications for treatment in ROP (Type 1 ROP) and what are the treatment options?"
    back: "Type 1 ROP (treatment indicated): Zone I — any stage with plus disease; Zone I — stage 3 without plus disease; Zone II — stage 2 or 3 with plus disease. Treatment: laser ablation of avascular retina (first-line); intravitreal bevacizumab or ranibizumab (both showed significant benefits vs. laser in Zone I stage 3+ ROP); Stage 4-5: vitrectomy/scleral buckle to release vitreous tractional forces.\n\nThe goal of ROP treatment is to ablate the ischemic avascular retina to reduce VEGF production and halt neovascularization. Anti-VEGF agents are particularly beneficial in Zone I disease because laser in Zone I carries risk of damaging central vision. Bevacizumab and ranibizumab are both used intravitreally."
    difficulty: hard
    tags: [ophthalmology, ROP, retinopathy of prematurity, laser ablation, anti-VEGF, bevacizumab]
  - front: "What lens changes occur in diabetes mellitus?"
    back: "DM causes: (1) Earlier onset of senile nuclear sclerotic and cortical cataracts; (2) Hyperglycemic cataract — sorbitol accumulation (rare); (3) Sudden refractive changes of 3-4 diopters from osmotic changes in the lens when blood glucose levels change rapidly (poor control).\n\nSorbitol accumulates in the lens via the aldose reductase pathway in hyperglycemia, causing osmotic swelling and lens opacification. The transient refractive changes from fluctuating glucose levels can cause myopia (high glucose) or hyperopia (low glucose), which can mislead clinicians into prescribing incorrect spectacles."
    difficulty: medium
    tags: [ophthalmology, diabetes mellitus, cataract, refractive error, lens changes, sorbitol]
  - front: "What is clinically significant macular edema (CSME) in diabetic retinopathy?"
    back: "Clinically significant macular edema (CSME) is defined as thickening of the retina at or within 500 μm of the centre of the macula. It is the most common cause of visual loss in patients with background (non-proliferative) diabetic retinopathy.\n\nCSME can occur at any stage of diabetic retinopathy but is most clinically important in non-proliferative DR. Treatment for fovea-involved CSME: intravitreal anti-VEGF or corticosteroids (preferred). Macular photocoagulation laser is used for CSME not involving the centre of the macula."
    difficulty: medium
    tags: [ophthalmology, diabetic retinopathy, macular edema, CSME, visual loss]
  - front: "What is the prognosis of ROP stages 4B and 5 despite treatment?"
    back: "Poor prognosis for visual outcome despite treatment. Stage 4B involves total retinal detachment including the fovea; stage 5 is complete retinal detachment.\n\nROP stages 4B and 5 represent advanced retinal detachment involving the macula, leading to permanent visual impairment. Anti-VEGF treatment (e.g., bevacizumab) is associated with less refractive error than laser therapy in successfully treated infants, but cannot reverse end-stage disease."
    difficulty: medium
    tags: [ophthalmology, retinopathy-of-prematurity, pediatric-ophthalmology, prognosis]
  - front: "What is the most common site of obstruction in congenital nasolacrimal duct obstruction, and what is the first-line treatment?"
    back: "Obstruction occurs at the valve of Hasner (failure of canalization). First-line treatment is Crigler massage (nasolacrimal sac massage); the majority resolve spontaneously by 1 year of age.\n\nCongenital nasolacrimal duct obstruction is the most common cause of epiphora in infants, presenting at 1–2 months with tearing, crusting, and mucopurulent discharge. Pressure over the lacrimal sac can cause reflux. If not resolved by 1 year, probing is indicated."
    difficulty: easy
    tags: [ophthalmology, nasolacrimal, pediatric-ophthalmology, epiphora]
  - front: "What is the timing of onset and causative organism for gonococcal ophthalmia neonatorum?"
    back: "Neisseria gonorrhoeae causes ophthalmia neonatorum at approximately 3–4 days of life. It is the most serious threat to vision as it can rapidly penetrate the corneal epithelium causing corneal ulceration.\n\nOphthalmia neonatorum is purulent conjunctivitis in the first 30 days of life. Chemical causes occur in the first 24h; N. gonorrhoeae at 3–4 days; C. trachomatis at ~7 days; HSV at ~2 weeks. Gonococcal infection requires systemic antibiotics and hospitalization due to its vision-threatening nature."
    difficulty: easy
    tags: [ophthalmology, ophthalmia-neonatorum, neonatal, gonorrhea, conjunctivitis]
  - front: "What is the typical timing of onset for Chlamydia trachomatis ophthalmia neonatorum versus herpes simplex virus?"
    back: "C. trachomatis: ~7 days of life. Herpes simplex virus: ~2 weeks of life.\n\nDistinguishing the timing of neonatal conjunctivitis helps identify the causative organism. Chemical (silver nitrate/erythromycin): first 24h; N. gonorrhoeae: 3–4 days; C. trachomatis: 7 days; HSV: ~2 weeks. Treatment differs: topical antibiotics for bacterial, antivirals for HSV, systemic antibiotics for gonorrhea."
    difficulty: easy
    tags: [ophthalmology, ophthalmia-neonatorum, chlamydia, herpes, neonatal]
  - front: "What is buphthalmos and with which condition is it associated?"
    back: "Buphthalmos ('ox eye') is an enlarged cornea and globe due to elevated intraocular pressure, classically associated with congenital glaucoma.\n\nIn congenital glaucoma, chronically elevated IOP in the developing eye causes expansion of the globe and cornea (buphthalmos), since infant sclera is more distensible. The enlarged cup-to-disc ratio (CDR) and Haab's striae (horizontal breaks in Descemet's membrane) are also characteristic findings."
    difficulty: medium
    tags: [ophthalmology, congenital-glaucoma, buphthalmos, pediatric-ophthalmology]
  - front: "What systemic conditions are associated with secondary congenital glaucoma?"
    back: "Prader-Willi syndrome, trisomies (e.g., Down syndrome), fetal alcohol syndrome, and mucopolysaccharidoses. Ocular associations include aniridia, Sturge-Weber syndrome, Axenfeld-Rieger syndrome, and neurofibromatosis.\n\nSecondary congenital glaucoma is associated with both ocular and systemic disorders. Recognizing these associations is important for systemic screening. The primary (idiopathic) form may be sporadic or autosomal recessive and affects males more often."
    difficulty: medium
    tags: [ophthalmology, congenital-glaucoma, pediatric-ophthalmology, associations]
  - front: "A child presents with epiphora. What important diagnosis must be ruled out?"
    back: "Congenital glaucoma must be ruled out in any child presenting with epiphora.\n\nWhile nasolacrimal duct obstruction is the most common cause of epiphora in infants, congenital glaucoma is a vision-threatening condition that presents with the classic triad of photophobia, epiphora, and blepharospasm. Prompt evaluation of IOP, corneal clarity, and CDR is essential."
    difficulty: easy
    tags: [ophthalmology, epiphora, congenital-glaucoma, pediatric-ophthalmology, differential-diagnosis]
  - front: "What are the classic signs of an orbital blow-out fracture?"
    back: "Enophthalmos (sunken eye), decreased upgaze (inferior rectus trapped), and cheek/upper lip anesthesia (infraorbital nerve compressed — CN V2).\n\nA blow-out fracture occurs when blunt trauma fractures the thin orbital floor, causing herniation of orbital contents into the maxillary sinus. The infraorbital nerve (CN V2) runs along the orbital floor and may be damaged, causing paresthesia of the cheek and upper lip. Diplopia results from entrapment of the inferior rectus or oblique muscles."
    difficulty: medium
    tags: [ophthalmology, orbital-trauma, blow-out-fracture, emergency]
  - front: "What are the indications for surgical repair of an orbital blow-out fracture?"
    back: "Fracture involving >50% of the orbital floor, diplopia not improving, or enophthalmos >2 mm.\n\nInitial management includes avoiding coughing, nose blowing, and Valsalva maneuvers. Systemic antibiotics may be indicated. Surgery can be delayed if diplopia improves spontaneously; however, persistent diplopia, significant enophthalmos, or large fractures require operative repair."
    difficulty: medium
    tags: [ophthalmology, blow-out-fracture, orbital-surgery, trauma]
  - front: "What is the initial management of a suspected open globe rupture?"
    back: "ABCs; CT orbits; IV antibiotics (cefazolin + aminoglycoside); avoid pressing on the eye; avoid checking IOP; apply rigid eye shield; head of bed elevated 30–45°; keep NPO; check tetanus status; REFER IMMEDIATELY.\n\nOpen globe is an ocular emergency. A rigid shield (not pressure patch) protects from further trauma. IV antibiotics reduce endophthalmitis risk. Checking IOP or pressing on the eye can extrude intraocular contents. Head elevation reduces IOP. Primary repair should ideally occur within 24 hours."
    difficulty: medium
    tags: [ophthalmology, globe-rupture, ocular-emergency, trauma, management]
  - front: "In post-traumatic infectious endophthalmitis, what organism is associated with retained intraocular foreign bodies, and what with vegetable matter?"
    back: "Retained intraocular foreign body (especially metal) increases risk of Bacillus species infection. Exposure to vegetable matter increases risk of fungal etiology.\n\nPost-traumatic endophthalmitis management depends on the mechanism. Gram-positive bacteria are more commonly involved than Gram-negative overall. If an intraocular foreign body (IOFB) is present, early vitrectomy and IOFB removal within 24h is mandatory. Extreme pain with hypopyon and vitritis indicates endophthalmitis until proven otherwise."
    difficulty: hard
    tags: [ophthalmology, endophthalmitis, trauma, infection, bacillus]
  - front: "What is hyphema and what are its key management principles?"
    back: "Hyphema is blood in the anterior chamber, often from damage to the iris root. Management: refer to ophthalmology, shield and bedrest for 5 days, head of bed elevated, avoid ASA (increases re-bleed risk). Risk of re-bleed is highest on days 2–5.\n\nHyphema most commonly results from blunt trauma. Complications include secondary glaucoma, corneal blood staining, and iris necrosis. ASA must be avoided due to antiplatelet effects increasing re-bleed risk. Surgical drainage may be required for persistent hyphema or re-bleed."
    difficulty: medium
    tags: [ophthalmology, hyphema, trauma, anterior-chamber]
  - front: "Why do alkali burns to the eye have a worse prognosis than acid burns?"
    back: "Acids coagulate tissue and self-limit corneal penetration. Alkalis cause liquefactive necrosis and continue to penetrate deeply into the eye, with progression potentially continuing for weeks even if the cornea appears clear initially.\n\nThe exception is hydrofluoric acid, which can significantly injure the anterior segment despite being an acid. Alkali burns carry a very guarded prognosis. Immediate irrigation with water or balanced saline solution (BSS) to physiologic pH is the first priority. Do not attempt acid-base neutralization."
    difficulty: medium
    tags: [ophthalmology, chemical-burn, ocular-emergency, alkali, acid]
  - front: "What is the immediate management of an ocular chemical burn?"
    back: "Immediately irrigate with water or balanced saline solution (BSS) with eyelids retracted until physiologic pH (tested with litmus paper). Swab fornices to remove particulate matter. Do NOT attempt neutralization with acid/base. Then: topical antibiotics, patching, cycloplegics (prevent iris spasm/secondary glaucoma), topical steroids (by ophthalmologist, <2 weeks for persistent epithelial defect).\n\nIrrigation is the most critical and immediate step — it should be done before any other assessment. Cycloplegics prevent posterior synechiae which can lead to secondary glaucoma. Topical steroids decrease inflammation but are limited to <2 weeks if there is a persistent epithelial defect due to risk of corneal melting and infection."
    difficulty: medium
    tags: [ophthalmology, chemical-burn, ocular-emergency, irrigation, management]
  - front: "What ocular toxicity is associated with chloroquine and hydroxychloroquine?"
    back: "Bull's eye maculopathy and vortex keratopathy.\n\nChloroquine/hydroxychloroquine (used for malaria, SLE, rheumatoid arthritis) accumulates in the RPE and causes a characteristic bull's eye pattern of macular degeneration on fundoscopy. Baseline and annual ophthalmologic screening is recommended. Vortex keratopathy (whorl-like corneal deposits) is also seen."
    difficulty: easy
    tags: [ophthalmology, drug-toxicity, hydroxychloroquine, maculopathy, retina]
  - front: "What is the ocular complication of amiodarone?"
    back: "Corneal microdeposits (vortex keratopathy) and, rarely, ischemic optic neuropathy.\n\nAmiodarone deposits in the corneal epithelium causing whorl-like deposits (vortex keratopathy) visible on slit-lamp exam. This is usually asymptomatic or causes minimal visual disturbance. The more serious (rare) complication is ischemic optic neuropathy leading to vision loss."
    difficulty: medium
    tags: [ophthalmology, drug-toxicity, amiodarone, vortex-keratopathy, optic-neuropathy]
  - front: "What ocular complication is associated with systemic steroids versus topical steroids?"
    back: "Both: posterior subcapsular cataracts and elevated IOP/glaucoma. Topical steroids additionally increase risk of HSV keratitis reactivation (geographic ulcers) and fungal infections.\n\nSteroid-induced IOP elevation occurs more rapidly with topical preparations (within weeks in 'steroid responders'). Posterior subcapsular cataracts develop within months of systemic use. Primary care physicians should avoid prescribing topical ocular steroids due to these risks, particularly reactivation of HSV keratitis."
    difficulty: medium
    tags: [ophthalmology, drug-toxicity, steroids, cataract, glaucoma, HSV]
  - front: "What ocular complication is associated with ethambutol and isoniazid?"
    back: "Both cause optic neuropathy.\n\nEthambutol is a well-known cause of dose-dependent optic neuropathy causing color vision loss and visual field defects. Baseline and regular ophthalmologic monitoring is recommended. Isoniazid (INH) can also cause optic neuropathy, though less commonly. Both are anti-tuberculosis agents."
    difficulty: easy
    tags: [ophthalmology, drug-toxicity, ethambutol, isoniazid, optic-neuropathy, tuberculosis]
  - front: "What ocular complication is associated with tamsulosin (Flomax)?"
    back: "Intraoperative floppy iris syndrome (IFIS), which can complicate cataract surgery.\n\nTamsulosin is an alpha-1 adrenergic blocker used for BPH. It causes relaxation of the iris dilator muscle, leading to IFIS during cataract surgery — characterized by iris billowing, iris prolapse, and progressive miosis. Surgeons must be informed of tamsulosin use preoperatively."
    difficulty: medium
    tags: [ophthalmology, drug-toxicity, tamsulosin, floppy-iris, cataract-surgery]
  - front: "What ocular toxicity is caused by vigabatrin?"
    back: "Retinal deposition with macular sparing and peripheral visual field loss.\n\nVigabatrin (an antiepileptic GABA transaminase inhibitor) causes irreversible concentric visual field constriction due to retinal toxicity, sparing the macula. Regular visual field testing is mandatory during treatment. This limits its use despite good seizure control."
    difficulty: medium
    tags: [ophthalmology, drug-toxicity, vigabatrin, visual-field, retina]
  - front: "What are the indications for topical ocular anesthetics (e.g., proparacaine, tetracaine), and why must they never be prescribed for home use?"
    back: "Indications: removal of foreign bodies and sutures, tonometry, examination of a painful cornea. Never prescribe because they are toxic to corneal epithelium — inhibit mitosis and migration — leading to corneal ulceration and scarring with prolonged use.\n\nTopical anesthetics are diagnostic/procedural tools only. Patients with chronic eye pain who use topical anesthetics at home develop neurotrophic corneal ulcers that are difficult to treat. This is a classic exam point: never prescribe topical anesthetics for outpatient use."
    difficulty: medium
    tags: [ophthalmology, ocular-medications, anesthetics, corneal-toxicity]
  - front: "What is the difference between cholinergic-blocking mydriatics and adrenergic-stimulating mydriatics?"
    back: "Cholinergic blockers (e.g., tropicamide): dilation PLUS cycloplegia (loss of accommodation) via paralysis of iris sphincter and ciliary body. Adrenergic stimulators (e.g., phenylephrine): dilation only, no effect on accommodation; side effects include HTN, tachycardia, arrhythmias.\n\nCycloplegia (paralysis of ciliary muscle) is important for accurate refraction and treatment of iritis (prevents posterior synechiae). Tropicamide lasts 4–5 hours; atropine lasts 1–2 weeks. Phenylephrine is usually combined with tropicamide for additive mydriatic effect."
    difficulty: medium
    tags: [ophthalmology, mydriatics, cycloplegia, tropicamide, phenylephrine]
  - front: "What is the mechanism of action and key side effects of prostaglandin analogues used for glaucoma?"
    back: "Mechanism: increase uveoscleral outflow (responsible for ~20% of drainage). Side effects: iris color change (heterochromia), periorbital skin pigmentation, lash growth, conjunctival hyperemia. Dosing: once daily (OHS).\n\nProstaglandin analogues (latanoprost, travoprost, bimatoprost) are first-line agents for primary open-angle glaucoma due to once-daily dosing and efficacy. The cosmetic side effects (lash growth, iris darkening) are due to melanocyte stimulation. These are the most potent IOP-lowering agents available."
    difficulty: medium
    tags: [ophthalmology, glaucoma, prostaglandin-analogues, latanoprost, IOP]
  - front: "Why should beta-blocker eye drops be used with caution in patients with asthma and COPD?"
    back: "Topical beta-blockers (e.g., timolol, levobunolol) are systemically absorbed and can cause bronchospasm. They are contraindicated or used with caution in asthma and COPD. Betaxolol (beta-1 selective) is relatively safer.\n\nTopical ocular medications have significant systemic absorption via the nasolacrimal duct. Non-selective beta-blockers block both beta-1 (cardiac) and beta-2 (pulmonary) receptors, causing bronchospasm in susceptible patients. Other side effects include bradycardia, hypotension, depression, heart block, and impotence."
    difficulty: medium
    tags: [ophthalmology, glaucoma, beta-blockers, timolol, bronchospasm, asthma]
  - front: "What are the mechanisms of action of carbonic anhydrase inhibitors (CAI) in glaucoma treatment, and what must be asked before prescribing?"
    back: "CAIs (dorzolamide, brinzolamide topically; acetazolamide orally) reduce aqueous production. Must ask about sulfa allergy before prescribing, as CAIs are sulfonamide derivatives. Oral CAIs cause diuresis, fatigue, paresthesia, and GI upset.\n\nCarbonic anhydrase in the ciliary body drives aqueous humor production. Inhibiting it reduces aqueous secretion and lowers IOP. Topical preparations have fewer systemic side effects than oral acetazolamide (Diamox). Sulfa allergy is a key contraindication."
    difficulty: medium
    tags: [ophthalmology, glaucoma, carbonic-anhydrase-inhibitor, acetazolamide, sulfa-allergy]
  - front: "What is the mechanism of alpha-2 agonists in glaucoma (e.g., brimonidine)?"
    back: "Selective alpha-2 agonists (brimonidine): reduce aqueous production AND increase uveoscleral outflow. Non-selective alpha agonists: reduce aqueous production and increase trabecular meshwork (TM) outflow. Key concern: apnea in children.\n\nBrimonidine (Alphagan) is a selective alpha-2 agonist used as adjunctive glaucoma therapy. It must be avoided in infants and young children due to risk of apnea and hypotension from CNS penetration. Side effects include contact allergy. Non-selective agents cause mydriasis and macular edema."
    difficulty: hard
    tags: [ophthalmology, glaucoma, alpha-agonists, brimonidine, apnea]
  - front: "What are the anti-VEGF agents used for wet age-related macular degeneration and their mechanisms?"
    back: "Ranibizumab (Lucentis): monoclonal Fab fragment, non-selective anti-VEGF. Bevacizumab (Avastin): recombinant humanized IgG, non-selective anti-VEGF (off-label in ophthalmology). Aflibercept (Eylea): VEGF 'trap' binding VEGF-A, VEGF-B, and placental growth factor. Faricimab (Vabysmo): bispecific antibody neutralizing VEGF-A and Ang-2. All given by intravitreal injection.\n\nThese agents prevent choroidal neovascularization and reduce vascular permeability in wet AMD. The CATT trial showed bevacizumab and ranibizumab have equivalent visual outcomes. Brolucizumab (Beovu) is rarely used due to occlusive retinal vascularization risks."
    difficulty: hard
    tags: [ophthalmology, wet-AMD, anti-VEGF, ranibizumab, bevacizumab, aflibercept, macular-degeneration]
  - front: "What did the AREDS2 trial find regarding supplementation for AMD?"
    back: "Adding lutein + zeaxanthin, DHA + EPA, or both to the AREDS formula did not significantly reduce risk of advanced AMD progression. Beta-carotene was associated with increased lung cancer risk in former smokers, so lutein + zeaxanthin may be an appropriate carotenoid substitute.\n\nThe original AREDS formula (vitamins C and E, beta-carotene, zinc, copper) slowed AMD progression. AREDS2 tested modifications — the main finding was that beta-carotene should be replaced with lutein + zeaxanthin in smokers and former smokers to avoid increased lung cancer risk."
    difficulty: hard
    tags: [ophthalmology, AMD, AREDS2, macular-degeneration, landmark-trial, supplements]
  - front: "What were the key conclusions of the CATT trial regarding anti-VEGF agents for neovascular AMD?"
    back: "Bevacizumab and ranibizumab had equivalent visual acuity outcomes when given under the same schedule (monthly or as-needed). Ranibizumab given as-needed was equivalent to monthly ranibizumab. No significant difference in death, MI, or stroke rates.\n\nThe CATT trial (NEJM 2011) established that the much less expensive bevacizumab (off-label) is non-inferior to ranibizumab for visual outcomes in wet AMD. This has major cost implications in healthcare systems. As-needed dosing with monthly monitoring is an acceptable regimen for ranibizumab."
    difficulty: hard
    tags: [ophthalmology, AMD, CATT-trial, bevacizumab, ranibizumab, landmark-trial]
  - front: "What did the OHTS trial demonstrate about treatment of ocular hypertension?"
    back: "Topical ocular hypotensive medication reduces the risk of developing primary open-angle glaucoma (POAG) in patients with elevated IOP. At 5 years: 4.4% developed POAG in the treatment group vs. 9.5% in the observation group.\n\nThe Ocular Hypertension Treatment Study (Arch Ophthalmol 2002) enrolled patients with IOP 21–32 mmHg and no glaucomatous damage. Mean IOP reduction was 22.5% in the treated group vs. 4.0% in the observation group. This supports treating ocular hypertension to prevent glaucoma."
    difficulty: hard
    tags: [ophthalmology, glaucoma, OHTS-trial, ocular-hypertension, landmark-trial]
  - front: "What did the UKGTS trial demonstrate about latanoprost for POAG?"
    back: "Latanoprost 0.005% significantly preserved visual fields compared to placebo in newly diagnosed POAG patients, with mean IOP reduction of 3.8 mmHg vs. 0.9 mmHg at 24 months.\n\nThe UKGTS (Lancet 2015) was the first placebo-controlled trial to show visual field preservation with an IOP-lowering drug in POAG. This confirmed that treating IOP is not just about preventing optic nerve damage in optic nerve appearance but also preserves functional vision."
    difficulty: hard
    tags: [ophthalmology, glaucoma, UKGTS, latanoprost, visual-field, landmark-trial]
  - front: "What did the ETDRS trial conclude about laser photocoagulation for diabetic retinopathy?"
    back: "Scatter (panretinal) photocoagulation is recommended for severe (high-risk proliferative) DR and should NOT be delayed. It should NOT be used for mild or moderate non-proliferative DR. Focal photocoagulation is recommended for macular edema to decrease risk of vision loss.\n\nThe ETDRS (Early Treatment Diabetic Retinopathy Study) established current treatment standards. Although early scatter photocoagulation reduced severe vision loss slightly vs. deferral, both rates were low (~2.6% vs. 3.7% at 5 years). Adverse effects on VA and visual fields were noted with scatter laser, limiting its use in early disease."
    difficulty: hard
    tags: [ophthalmology, diabetic-retinopathy, ETDRS, laser-photocoagulation, landmark-trial]
  - front: "What did the Optic Neuritis Treatment Trial (ONTT) conclude about corticosteroid treatment for optic neuritis?"
    back: "IV methylprednisolone followed by oral prednisone speeds recovery of vision loss. Oral prednisone ALONE is ineffective and increases the risk of new optic neuritis episodes in either eye. IV treatment is preferred over oral.\n\nThe ONTT (NEJM 1992) is a landmark trial showing that IV methylprednisolone hastens recovery but does not improve ultimate visual outcome compared to placebo. Critically, oral prednisone alone increased the relapse rate of optic neuritis, making it contraindicated as monotherapy."
    difficulty: hard
    tags: [ophthalmology, optic-neuritis, ONTT, methylprednisolone, landmark-trial, neuro-ophthalmology]
  - front: "What did the IIH Treatment Trial (IIHTT) conclude about acetazolamide for idiopathic intracranial hypertension?"
    back: "Acetazolamide combined with a low-sodium weight-reduction diet resulted in modest improvements in visual field function, papilledema grade, and vision-related quality of life compared to diet alone in patients with IIH and mild visual loss.\n\nThe IIHTT (JAMA 2014) provides evidence for acetazolamide as first-line medical therapy for IIH. Weight loss and a low-sodium diet are cornerstone non-pharmacologic treatments. Acetazolamide reduces CSF production via carbonic anhydrase inhibition."
    difficulty: hard
    tags: [ophthalmology, IIH, acetazolamide, papilledema, landmark-trial, neuro-ophthalmology]
  - front: "What is the effect of intensive glycemic control versus intensive blood pressure control on diabetic retinopathy progression (ACCORD Eye Study)?"
    back: "Intensive glycemic control AND intensive dyslipidemia treatment (fenofibrate) reduced DR progression rates. Intensive BP control did NOT reduce DR progression (and may have had adverse effects in the UKPDS 69 trial).\n\nThe ACCORD Eye Study (NEJM 2010) found DR progression at 4 years: 7.3% (intensive glycemia) vs. 10.4% (standard); 6.5% (fenofibrate) vs. 10.2% (placebo for dyslipidemia). Intensive BP control: 10.4% vs. 8.8% standard — not beneficial. UKPDS 69 showed tight BP control reduces photocoagulation rates but not blindness overall."
    difficulty: hard
    tags: [ophthalmology, diabetic-retinopathy, ACCORD, glycemic-control, fenofibrate, landmark-trial]
  - front: "What is fluorescein dye used for in ophthalmology?"
    back: "Fluorescein is a water-soluble orange-yellow dye that appears green under cobalt blue light. It is absorbed by areas of epithelial loss (corneal ulcers, abrasions, lacerations). Also used with applanation tonometry and stains contact lenses, mucus, and foreign bodies.\n\nFluorescein staining is essential for detecting corneal defects in the emergency setting. The cobalt blue light (available on slit-lamp or ophthalmoscope) causes the dye to fluoresce green where epithelium is absent. It is distinct from Rose Bengal stain, which stains devitalized epithelial cells and mucus indicating tear film abnormalities."
    difficulty: easy
    tags: [ophthalmology, fluorescein, corneal-abrasion, diagnostic-tools]
  - front: "What ocular toxicity is caused by chlorpromazine and what by thioridazine?"
    back: "Chlorpromazine: anterior subcapsular cataracts. Thioridazine: pigmentary degeneration of the retina.\n\nBoth are typical antipsychotics. Chlorpromazine deposits in the lens causing anterior subcapsular cataracts (unlike steroids which cause posterior subcapsular cataracts). Thioridazine (now rarely used) causes a pigmentary retinopathy resembling retinitis pigmentosa, with significant visual loss."
    difficulty: medium
    tags: [ophthalmology, drug-toxicity, chlorpromazine, thioridazine, cataract, retinopathy]
  - front: "What ocular side effect is associated with digitalis toxicity?"
    back: "Yellow vision (xanthopsia) and blurred vision.\n\nDigitalis glycosides (e.g., digoxin) cause characteristic yellow-tinged vision (xanthopsia), which is a clinical marker of toxicity. This is thought to result from effects on retinal cone photoreceptors. Recognition of ocular symptoms can help identify digitalis toxicity early."
    difficulty: medium
    tags: [ophthalmology, drug-toxicity, digitalis, digoxin, xanthopsia]
  - front: "What ocular findings are important in the diagnosis of Shaken Baby Syndrome?"
    back: "Extensive retinal and vitreous hemorrhages. These findings are caused by the shaking process and are extremely rare in accidental trauma. Detailed fundoscopic exam or ophthalmology referral should be performed for all infants in whom abuse is suspected.\n\nRetinal hemorrhages in Shaken Baby Syndrome result from repeated acceleration-deceleration forces causing vitreoretinal traction. They may be bilateral, multilayer, and extend to the periphery. The combination of retinal hemorrhages, subdural hematoma, and encephalopathy (Syndrome of findings) is characteristic. Ophthalmologic documentation is critical for legal and medical purposes."
    difficulty: medium
    tags: [ophthalmology, shaken-baby-syndrome, retinal-hemorrhage, child-abuse, pediatric-ophthalmology]
  - front: "What are the signs that should prompt immediate ophthalmology referral after blunt ocular trauma?"
    back: "Decreased visual acuity, shallow anterior chamber, hyphema, strabismus/misalignment, retinal damage.\n\nThese findings indicate significant intraocular injury that may require urgent surgical intervention. A normal or minimally reduced VA suggests globe perforation is less likely, while severely reduced VA warrants urgent evaluation for globe perforation, corneal abrasion, lens dislocation, or retinal tear/detachment."
    difficulty: medium
    tags: [ophthalmology, ocular-trauma, referral-criteria, emergency]
  - front: "What is the mechanism of pilocarpine in glaucoma, and what are its side effects?"
    back: "Mechanism: parasympathomimetic (cholinergic stimulating) — increases trabecular meshwork (TM) outflow. Side effects: miosis (reduced night vision), increased GI motility, brow ache, headache, reduced heart rate.\n\nPilocarpine contracts the ciliary muscle which pulls on the trabecular meshwork, improving aqueous drainage. Miosis is a direct effect of iris sphincter contraction. This drug is now rarely used as primary therapy for glaucoma due to side effects and frequent dosing (TID/QID), but is still used in acute angle-closure crises."
    difficulty: medium
    tags: [ophthalmology, glaucoma, pilocarpine, parasympathomimetic, TM-outflow]
  - front: "What is the duration of action of atropine sulfate as a cycloplegic/mydriatic agent?"
    back: "1–2 weeks.\n\nAtropine is the longest-acting cycloplegic — its effects persist for 1–2 weeks. This compares to tropicamide (4–5 hours) and cyclopentolate (3–6 hours). Atropine is used when prolonged cycloplegia is needed (e.g., treatment of amblyopia via penalization, severe uveitis) and must be used with caution due to systemic anticholinergic toxicity in children."
    difficulty: easy
    tags: [ophthalmology, cycloplegics, atropine, mydriatics, duration]
  - front: "What are the ocular side effects of bisphosphonates (e.g., alendronate, risedronate)?"
    back: "Inflammatory eye disease including iritis, scleritis, and episcleritis.\n\nBisphosphonates used for osteoporosis can cause ocular inflammation. Scleritis and episcleritis may present with eye pain and redness. Iritis/uveitis can cause photophobia and visual blur. Recognition of this association is important as bisphosphonates are commonly prescribed in Canada for osteoporosis management."
    difficulty: medium
    tags: [ophthalmology, drug-toxicity, bisphosphonates, scleritis, uveitis]
  - front: "What ocular toxicity is associated with immune checkpoint inhibitors?"
    back: "Retinopathy (vasculitis, macular edema), dry eye syndrome, conjunctivitis, uveitis, and optic nerve disorders.\n\nImmune checkpoint inhibitors (e.g., anti-PD-1, anti-CTLA-4 agents) used in oncology cause immune-related adverse events (irAEs) affecting the eye. Uveitis is a particularly important immune-mediated complication requiring prompt steroid treatment. As these agents become more widely used in Canada, recognition of ocular irAEs is increasingly important."
    difficulty: hard
    tags: [ophthalmology, drug-toxicity, immune-checkpoint-inhibitors, uveitis, oncology]
  - front: "What ocular findings are associated with nalidixic acid, tetracycline, and vitamin A toxicity?"
    back: "All three can cause papilledema (raised intracranial pressure / pseudotumor cerebri).\n\nThese agents are associated with drug-induced intracranial hypertension (pseudotumor cerebri). Other causes include vitamin D toxicity (band keratopathy). Tetracyclines (especially minocycline) are particularly known for this in young overweight women. Nalidixic acid is an older quinolone. Vitamin A toxicity from supplements or isotretinoin can also cause IIH."
    difficulty: medium
    tags: [ophthalmology, drug-toxicity, papilledema, pseudotumor-cerebri, tetracycline, vitamin-A]
  - front: "A patient on hydroxychloroquine for lupus requires regular ophthalmologic monitoring. What is the pathognomonic retinal finding of toxicity?"
    back: "Bull's eye maculopathy — a ring of RPE loss surrounding a central area of preserved RPE, seen on fundoscopy and confirmed with optical coherence tomography (OCT) and visual field testing.\n\nHydroxychloroquine toxicity is dose- and duration-dependent, accumulating in the RPE. Screening with automated visual fields (10-2), SD-OCT, and multifocal ERG is recommended annually after 5 years of use (or earlier in high-risk patients). Once bull's eye maculopathy develops, it may be irreversible."
    difficulty: hard
    tags: [ophthalmology, hydroxychloroquine, maculopathy, lupus, retinal-toxicity, monitoring]
  - front: "What are the three main complications of anterior uveitis (iritis)?"
    back: "1. Posterior synechiae (adhesions of posterior iris to anterior lens capsule; irregularly shaped pupil; if 360°, can lead to angle-closure glaucoma)\n2. Peripheral anterior synechiae (adhesions of iris to cornea; can lead to secondary angle-closure glaucoma)\n3. Cataracts (usually posterior subcapsular), band keratopathy, macular edema, and papillitis\n\nAnterior uveitis causes inflammatory adhesions (synechiae) that distort the pupil and obstruct aqueous flow. Band keratopathy (superficial corneal calcification) is seen specifically in chronic iritis. These complications guide urgent treatment with mydriatics and steroids to prevent synechiae formation."
    difficulty: medium
    tags: [ophthalmology, uveitis, anterior uveitis, synechiae, complications]
  - front: "What is the first-line treatment for anterior uveitis (iritis) and what is the rationale?"
    back: "Mydriatics (pupil dilation) AND topical steroids.\n- Mydriatics: dilate the pupil to prevent formation of posterior synechiae and decrease pain from ciliary spasm\n- Topical steroids: reduce inflammation\n- Systemic immunosuppressants for refractory cases\n- If recurrent, medical workup to rule out secondary causes\n\nMydriatics prevent the most vision-threatening complication of anterior uveitis — posterior synechiae — by keeping the iris away from the lens. Topical steroids reduce the inflammatory cascade. Systemic workup is indicated for recurrent iritis to identify associated systemic diseases (e.g., HLA-B27 spondyloarthropathies, sarcoidosis)."
    difficulty: easy
    tags: [ophthalmology, uveitis, treatment, mydriatics, steroids]
  - front: "What are the treatment differences between intermediate and posterior uveitis?"
    back: "Intermediate uveitis: After ruling out infectious etiologies — sub-tenon/intravitreal steroids for asymmetric/unilateral cases; systemic steroids for bilateral cases; immunosuppressive agents; vitrectomy/cryotherapy/laser photocoagulation to the 'snowbank'\nPosterior uveitis: After ruling out infectious etiologies — steroids (sub-tenon, intravitreal, or systemic if threat of vision loss); vitreous biopsy if masquerade/malignancy suspected\n\nBoth intermediate and posterior uveitis require infectious etiology to be excluded before initiating immunosuppression, as steroids would worsen infectious uveitis. The 'snowbank' in intermediate uveitis refers to white exudates at the pars plana. Vitreous biopsy helps differentiate masquerade syndromes (e.g., intraocular lymphoma) from true uveitis."
    difficulty: hard
    tags: [ophthalmology, uveitis, intermediate uveitis, posterior uveitis, treatment]
  - front: "What are the three main types of cataracts and their distinguishing features?"
    back: "1. Nuclear sclerosis: yellow to brown (brunescent) discolouration of the central lens; age-related; associated with 'second sight' (myopic shift)\n2. Cortical: radial or spoke-like opacities in the cortex; associated with aging and DM\n3. Posterior subcapsular (PSC): opacity at the posterior pole of the lens adjacent to the capsule; associated with steroid use, intraocular inflammation, diabetes, and aging\n\nNuclear sclerosis increases the refractive power of the lens, temporarily improving near vision ('second sight phenomenon'). PSC cataracts disproportionately impair vision in bright light (pupil constricts, exposing the opacity). PSC should prompt inquiry about steroid use."
    difficulty: easy
    tags: [ophthalmology, cataracts, nuclear sclerosis, cortical, posterior subcapsular]
  - front: "What is 'second sight' in the context of cataracts?"
    back: "A phenomenon seen in nuclear sclerosis cataracts where the patient becomes more myopic (nearsighted) than previously noted, due to increased refractive power of the lens. The patient may present with new or increased near-sightedness and temporarily improved near vision.\n\nNuclear sclerosis increases the refractive index of the lens, creating a myopic shift. Patients may notice improved reading vision without glasses — 'second sight.' This is a transient improvement as the cataract progresses. It is specific to nuclear sclerosis and not seen in cortical or PSC cataracts."
    difficulty: easy
    tags: [ophthalmology, cataracts, nuclear sclerosis, second sight, myopic shift]
  - front: "What are the indications for cataract surgery?"
    back: "1. To improve visual function in patients whose vision loss leads to functional impairment\n2. To aid management of other ocular disease (e.g., cataract preventing adequate retinal exam or laser treatment of diabetic retinopathy)\n3. Congenital or traumatic cataracts (treat promptly to prevent amblyopia in congenital cases)\n\nCataract surgery is not indicated based on VA alone — functional impairment drives the decision. Congenital cataracts require urgent treatment to prevent amblyopia (lazy eye) during the critical period of visual development. Phacoemulsification is the most commonly used surgical technique."
    difficulty: easy
    tags: [ophthalmology, cataracts, surgery, indications, phacoemulsification]
  - front: "What are the postoperative complications of cataract surgery (phacoemulsification)?"
    back: "1. Retinal detachment (RD)\n2. Endophthalmitis\n3. Dislocated intraocular lens (IOL)\n4. Macular edema\n5. Glaucoma\n6. Posterior capsular opacification (most common; occurs in 20-50% of patients post-surgery; treated with YAG laser capsulotomy)\n\nPosterior capsular opacification ('after-cataract') is the most common late complication of cataract surgery, caused by residual lens epithelial cells proliferating on the posterior capsule. YAG laser capsulotomy creates an opening in the posterior capsule to restore vision. Endophthalmitis is a rare but devastating complication requiring urgent treatment."
    difficulty: medium
    tags: [ophthalmology, cataracts, surgery, complications, posterior capsular opacification]
  - front: "What systemic conditions are associated with dislocated lens (ectopia lentis)?"
    back: "1. Marfan syndrome (superotemporal displacement)\n2. Ehlers-Danlos type VI\n3. Homocystinuria (inferotemporal displacement)\n4. Syphilis\n5. Lens coloboma (congenital cleft)\n6. Trauma\n\nMarfan syndrome (fibrillin-1 mutation) causes ectopia lentis due to weakened zonular fibers, with classically superotemporal lens displacement. Homocystinuria is associated with inferonasal dislocation, thromboembolism, and intellectual disability. Both are autosomal conditions — Marfan is AD, homocystinuria is AR."
    difficulty: medium
    tags: [ophthalmology, ectopia lentis, Marfan syndrome, homocystinuria, lens dislocation]
  - front: "What are the clinical features of a dislocated lens (ectopia lentis)?"
    back: "1. Decreased visual acuity\n2. Monocular diplopia\n3. Iridodonesis (quivering/trembling of iris with eye movement)\n4. Phacodonesis (observed movement of the lens)\n5. Abnormal red reflex on direct fundoscopy\nComplications: cataract, glaucoma, uveitis\n\nIridodonesis and phacodonesis occur because the lens is no longer held firmly in position by the zonular fibers. The quivering movements are visible on slit-lamp exam. Treatment is surgical lens replacement if vision is affected. Lens dislocation can obstruct aqueous flow causing glaucoma."
    difficulty: medium
    tags: [ophthalmology, ectopia lentis, iridodonesis, phacodonesis, clinical features]
  - front: "What is the pathophysiology and clinical presentation of posterior vitreous detachment (PVD)?"
    back: "Pathophysiology: Central vitreous shrinks/liquefies with age (syneresis) → fibrils condense causing floaters → liquid vitreous passes between posterior vitreous gel and retina → vitreous separates from the internal limiting membrane of the neurosensory retina\nClinical features: floaters ('bugs', 'cobwebs', 'spots'), flashes of light\nComplication: traction at sites of firm adhesion → retinal tear → rhegmatogenous retinal detachment or vitreous hemorrhage\n\nPVD is the most common cause of sudden-onset floaters and flashes. A Weiss ring (glial tissue from the optic disc) may be visible as a large floater. New or markedly increased floaters/flashes mandate dilated fundus exam to rule out retinal tear or detachment. Complications are more common in high myopes and after ocular trauma."
    difficulty: medium
    tags: [ophthalmology, posterior vitreous detachment, PVD, floaters, retinal tear]
  - front: "What is vitreous hemorrhage and what are its causes?"
    back: "Definition: Bleeding into the vitreous cavity\nCauses:\n1. Proliferative diabetic retinopathy (PDR) — most common\n2. Retinal tear/detachment\n3. Posterior vitreous detachment (PVD)\n4. Retinal vein occlusion (RVO)\n5. Trauma\nNote: Vitreous or retinal hemorrhage in a child must raise suspicion for child abuse\n\nVitreous hemorrhage presents as sudden loss of VA, often preceded by a 'shower' of floaters/flashes. Fundoscopy shows absent red reflex if hemorrhage is large. B-scan ultrasound is used to rule out retinal detachment when the fundus cannot be visualized. If no RD, blood usually resorbs over 3-6 months; otherwise vitrectomy is required."
    difficulty: easy
    tags: [ophthalmology, vitreous hemorrhage, causes, PDR, child abuse]
  - front: "What is endophthalmitis and how is it managed?"
    back: "Definition: Intraocular infection (acute, subacute, or chronic); most commonly postoperative (risk after cataract surgery <0.1%); also from penetrating injury (3-7% risk), endogenous spread, or intravitreal injections\nClinical: painful red eye, photophobia, discharge, reduced VA, lid edema, proptosis, corneal edema, hypopyon, reduced red reflex\nOCULAR EMERGENCY — treatment based on VA:\n- LP (light perception) or worse: admission, immediate vitrectomy + intravitreal antibiotics\n- HM (hand motion) or better: vitreous tap for culture + intravitreal antibiotics\n- Topical fortified antibiotics in all cases\n\nPresenting vision is the key prognostic factor in endophthalmitis. The classification into LP/worse versus HM/better guides the urgency and invasiveness of treatment. Hypopyon (layered pus in the anterior chamber) is a hallmark finding. Tetanus status should be inquired about with penetrating injuries."
    difficulty: hard
    tags: [ophthalmology, endophthalmitis, ocular emergency, vitrectomy, intravitreal antibiotics]
  - front: "What is the hallmark fundoscopic finding of central retinal artery occlusion (CRAO) and what is the time window for treatment?"
    back: "Hallmark: 'Cherry-red spot' at the macula (fovea appears red through intact, thin foveal tissue while surrounding retina is pale/edematous from ischemia)\nOther findings: retinal edema, cotton wool spots, Hollenhorst plaques (cholesterol emboli at arteriole bifurcations)\nSigns: sudden painless monocular vision loss, RAPD, possible history of amaurosis fugax\nTime window: OCULAR EMERGENCY — treatment must be initiated within 2 hours; irreversible damage if complete CRAO >90 minutes\n\nThe cherry-red spot occurs because the fovea is thin enough to allow visualization of underlying choroidal circulation, which remains perfused. The surrounding retina becomes opaque (edematous) due to ischemia. Causes include emboli (carotid/cardiac), thrombus, and GCA/temporal arteritis (painful CRAO). RAPD reflects afferent pathway disruption."
    difficulty: medium
    tags: [ophthalmology, CRAO, central retinal artery occlusion, cherry-red spot, ocular emergency]
  - front: "What are the treatment options for central retinal artery occlusion (CRAO)?"
    back: "1. Globe massage (compress with heel of hand for 10s, release 10s, repeat 5 min) — to dislodge embolus\n2. Topical beta-blocker\n3. IV acetazolamide\n4. IV mannitol (draws fluid from eye, lowers IOP)\n5. Anterior chamber paracentesis (drain aqueous fluid; carries risk of infection, lens puncture)\n6. YAG laser embolectomy\n7. Intra-arterial or IV thrombolysis\n8. Hyperbaric oxygen therapy\n9. Urgent neurology referral, optimize vascular risk factors (smoking cessation, anticoagulation/antiplatelet), carotid duplex ultrasonography, possible vascular surgery\n\nAll acute treatments aim to lower IOP (which increases perfusion pressure gradient) or dislodge/dissolve the embolus. Treatment must begin within 2 hours. The underlying vascular risk factors must be addressed to prevent future events. GCA should be ruled out urgently as it requires systemic corticosteroids."
    difficulty: hard
    tags: [ophthalmology, CRAO, treatment, ocular emergency, thrombolysis]
  - front: "What is the classic fundoscopic appearance of central retinal vein occlusion (CRVO) and how does it differ from CRAO?"
    back: "CRVO: 'Blood and thunder' appearance — diffuse retinal hemorrhages in all four quadrants, cotton wool spots, venous engorgement, swollen optic disc, macular edema; RAPD may be present\nCRAO: 'Cherry-red spot' — pale/edematous retina with red fovea (fovea appears red through intact choroidal circulation), arteriolar attenuation, +RAPD\nBoth: sudden, painless, monocular vision loss\n\nThe 'blood and thunder' appearance of CRVO reflects back-pressure hemorrhage throughout the retina from obstructed venous outflow. CRVO is the second most common vascular retinal disorder after diabetic retinopathy. There is an 8-10% risk of developing CRVO or BRVO in the fellow eye."
    difficulty: medium
    tags: [ophthalmology, CRVO, blood and thunder, retinal vein occlusion, fundoscopy]
  - front: "What are the risk factors for central retinal vein occlusion (CRVO)?"
    back: "1. Atherosclerotic vascular disease, hypertension, diabetes mellitus\n2. Glaucoma\n3. Hyperviscosity states: sickle cell disease, polycythemia rubra vera, lymphoma, leukemia\n4. Drugs: oral contraceptive pill, diuretics\n5. Autoimmune disorders in younger patients (<50 yr): lupus, anticardiolipin antibody\n6. Hyperhomocysteinemia\n\nAtherosclerotic changes in the central retinal artery may make it rigid and compress the adjacent central retinal vein (they share a common sheath), predisposing to thrombosis. In younger patients without traditional vascular risk factors, a hypercoagulable/autoimmune workup is indicated."
    difficulty: medium
    tags: [ophthalmology, CRVO, risk factors, hyperviscosity, autoimmune]
  - front: "What are the two subtypes of CRVO and their distinguishing features?"
    back: "1. Venous stasis/non-ischemic retinopathy:\n- No RAPD, VA ~20/80\n- Mild hemorrhage, few cotton wool spots\n- Resolves spontaneously over weeks to months\n- May regain normal vision if macula unaffected\n2. Hemorrhagic/ischemic retinopathy ('blood and thunder'):\n- RAPD present, VA ~20/200, reduced peripheral vision\n- More hemorrhages, cotton wool spots, venous congestion\n- Usually older patient with deficient arterial supply\n- Poor visual prognosis\n\nNon-ischemic CRVO has a much better prognosis than ischemic CRVO. The key differentiating features are presence of RAPD (indicating significant optic nerve/retinal ischemia) and degree of visual loss. Ischemic CRVO is at high risk for neovascular complications (rubeosis iridis, neovascular glaucoma, vitreous hemorrhage)."
    difficulty: medium
    tags: [ophthalmology, CRVO, ischemic, non-ischemic, classification]
  - front: "What are the three types of retinal detachment (RD) and their causes?"
    back: "1. Rhegmatogenous (most common): tear/hole in neurosensory retina → vitreous fluid passes into subretinal space; caused by PVD, degenerative changes, trauma, iatrogenic; risk increased with age, high myopia, ocular surgery/trauma\n2. Tractional: vitreal/epiretinal/subretinal membrane pulls neurosensory retina from RPE; found in DR, RVO, sickle cell disease, ROP, ocular trauma\n3. Exudative: vascular transudation/RPE damage → fluid in subretinal space; main causes are intraocular tumour, posterior uveitis, central serous retinopathy\n\nRhegmatogenous RD is the most important type to recognize clinically — it is an ocular emergency especially if the macula is still attached ('macula on'). Superotemporal retina is the most common site for horseshoe (U-shaped) tears. The type of RD determines the surgical approach."
    difficulty: medium
    tags: [ophthalmology, retinal detachment, rhegmatogenous, tractional, exudative]
  - front: "What are the symptoms and signs of retinal detachment?"
    back: "Symptoms:\n1. Flashes of light (photopsia) — mechanical stimulation of photoreceptors\n2. Floaters — blood from torn vessels in vitreous\n3. Curtain of blackness/peripheral field loss — where retina is detached\n4. Loss of central vision (if macula 'off')\nSigns:\n- Decreased IOP (typically 4-5 mmHg lower than fellow eye)\n- Fundoscopy: grey-white detached retina (edema), loss of red reflex\n- RAPD\n\nThe sequence of symptoms in rhegmatogenous RD is typically: flashes and floaters (PVD/tear) → curtain of blackness (detachment progresses). A decreased IOP relative to the fellow eye is a useful bedside clue. 'Macula-on' RD is an emergency requiring same-day surgery, while 'macula-off' RD allows brief delay."
    difficulty: medium
    tags: [ophthalmology, retinal detachment, symptoms, signs, macula-on]
  - front: "What are the surgical options for rhegmatogenous retinal detachment?"
    back: "1. Pneumatic retinopexy: injection of gas into vitreous cavity\n2. Scleral buckle procedure: silicone band/sponge indents sclera to support tear\n3. Pars plana vitrectomy + gas injection (silicone oil if: recurrent detachment, air travel, or inability to posture postoperatively)\nProphylactic: symptomatic tears (flashes/floaters) can be sealed with laser or cryotherapy before detachment occurs\n\nPneumatic retinopexy is minimally invasive but requires strict head positioning. Scleral buckle is effective for simple inferior detachments. Vitrectomy is preferred for complex cases. Silicone oil is used when gas would be suboptimal (e.g., patient cannot comply with positioning, needs to fly). Prognosis for visual recovery varies inversely with duration of detachment and whether the macula is involved."
    difficulty: medium
    tags: [ophthalmology, retinal detachment, treatment, pneumatic retinopexy, scleral buckle, vitrectomy]
  - front: "What is retinitis pigmentosa and what is the classic triad on fundoscopy?"
    back: "Definition: Hereditary degenerative disease of the retina with photoreceptor degeneration (rods > cones) and atrophy\nMost common inheritance: autosomal recessive (60%)\nClassic triad on fundoscopy (APO):\n1. Arterioles narrowed (retinal arterioles attenuated)\n2. Perivascular bone spicule pigmentation in mid-periphery\n3. Optic disc pallor\n\nRod photoreceptors are preferentially affected, explaining the early symptom of night blindness (nyctalopia). Progressive loss of peripheral vision ('tunnel vision') follows. Posterior subcapsular cataracts are common. ERG (electroretinography) and EOG (electrooculography) confirm the diagnosis. Vitamin A supplementation can slow progression; vitamin E should be avoided."
    difficulty: medium
    tags: [ophthalmology, retinitis pigmentosa, bone spicule, fundoscopy, hereditary]
  - front: "What are the clinical features, treatment, and novel therapy for retinitis pigmentosa?"
    back: "Clinical features: Night blindness (earliest), decreased peripheral vision (tunnel vision), decreased central vision (late), glare from PSC cataracts\nInvestigations: Fundoscopy (bone-spicule pigmentation, narrowed arterioles, pale disc), ERG, EOG\nTreatment:\n- Vitamin A supplementation (slows progression in some); avoid vitamin E\n- Cataract extraction improves visual function\n- Voretigene neparvovec-rzyl (Luxturna®): FDA-approved gene therapy for biallelic RPE65 mutation-associated retinal dystrophy (pediatric and adult patients)\n\nLuxturna is a landmark gene therapy — the first approved for an inherited retinal dystrophy. It delivers a functional copy of the RPE65 gene via AAV vector. This represents a paradigm shift from symptomatic to disease-modifying treatment. ERG shows reduced/absent rod responses; EOG shows reduced light/dark ratio (Arden ratio)."
    difficulty: medium
    tags: [ophthalmology, retinitis pigmentosa, Luxturna, gene therapy, RPE65, vitamin A]
  - front: "What is age-related macular degeneration (AMD) and how is it classified?"
    back: "Definition: Leading cause of irreversible blindness in industrialized countries; bilateral but asymmetric; associated with increasing age\nClassification:\n1. Dry (non-exudative/non-neovascular) AMD: 90% of cases; slowly progressive; drusen (yellow deposits between RPE and Bruch's membrane); geographic atrophy; may progress to wet AMD\n2. Wet (exudative/neovascular) AMD: 10% of cases; responsible for 80% of AMD-related vision loss; choroidal neovascularization through breaks in Bruch's membrane; can lead to disciform scarring\n\nDrusen are the hallmark early finding of AMD. Geographic atrophy represents advanced dry AMD with confluent RPE loss. Wet AMD develops when CNV grows through Bruch's membrane; these fragile vessels leak fluid causing rapid central vision loss. Metamorphopsia (distorted vision) is a key symptom of wet AMD."
    difficulty: easy
    tags: [ophthalmology, AMD, age-related macular degeneration, dry AMD, wet AMD, drusen]
  - front: "What are the risk factors for age-related macular degeneration (AMD)?"
    back: "1. Female sex\n2. Increasing age\n3. Family history\n4. Smoking (strongest modifiable risk factor)\n5. White race\n6. Blue irides\n\nSmoking is the most important modifiable risk factor for AMD. White individuals have higher risk than those of African descent, possibly due to differences in macular pigment density. The AREDS2 trial demonstrated that supplementation with antioxidants (vitamin C, E), zinc, copper, lutein, and zeaxanthin can reduce risk of progression to advanced AMD in patients with intermediate AMD."
    difficulty: easy
    tags: [ophthalmology, AMD, risk factors, smoking, AREDS2]
  - front: "What is metamorphopsia and what tool is used to detect it?"
    back: "Metamorphopsia: Distorted vision in which straight parallel lines appear convergent or wavy, due to macular edema (displacement of photoreceptors)\nDetection tool: Amsler grid — held at normal reading distance with glasses on, assesses macular function\nContext: Classic symptom of wet AMD (neovascular), macular edema, or other macular disease\n\nThe Amsler grid is a 10 cm × 10 cm grid with a central fixation point, held at 30 cm. Patients cover one eye and look at the central dot — distortion, missing areas, or blurriness indicate macular pathology. It is used both for initial diagnosis and patient self-monitoring at home to detect conversion from dry to wet AMD."
    difficulty: easy
    tags: [ophthalmology, AMD, metamorphopsia, Amsler grid, macular edema]
  - front: "What investigations are used in AMD and what does each assess?"
    back: "1. Amsler grid: assesses macular function (metamorphopsia detection)\n2. Fluorescein angiography: assesses type and location of choroidal neovascularization (pathologic vessels leak dye)\n3. OCT retinal imaging: assesses amount of intraretinal and subretinal exudation\n4. Fundus autofluorescence: non-invasive imaging of lipofuscin within RPE; monitors progression of dry AMD and retinal dystrophies\n\nOCT is the most commonly used imaging modality in clinical practice for AMD, providing cross-sectional retinal imaging to detect and quantify fluid. Fluorescein angiography is the gold standard for characterizing CNV type. Fundus autofluorescence is useful for monitoring geographic atrophy progression. Anti-VEGF injections are guided by OCT findings."
    difficulty: medium
    tags: [ophthalmology, AMD, investigations, OCT, fluorescein angiography, Amsler grid]
  - front: "What are the treatment options for dry vs. wet AMD?"
    back: "Dry AMD:\n- Monitor with Amsler grid\n- Low vision aids (magnifiers, closed-circuit TV)\n- Anti-oxidants and green leafy vegetables\n- Sunglasses/visors\n- AREDS2 formula (antioxidant supplements with lutein/zeaxanthin)\nWet AMD:\n- Intravitreal anti-VEGF injections (ranibizumab/Lucentis®, bevacizumab/Avastin®, aflibercept/Eylea®, pegaptanib/Macugen®, brolucizumab/Beovu®, faricimab/Vabysmo®)\n- Photodynamic therapy with verteporfin (Visudyne®): IV injection + low-intensity laser to CNV area\n- No definitive treatment for disciform scarring\n\nAnti-VEGF therapy has revolutionized wet AMD treatment, converting it from a devastating blinding condition to one where vision can be maintained or improved. Bevacizumab (Avastin) is used off-label but shown non-inferior to aflibercept in the CATT trial (JAMA 2017). Photodynamic therapy is reserved for select cases when anti-VEGF is contraindicated."
    difficulty: medium
    tags: [ophthalmology, AMD, treatment, anti-VEGF, ranibizumab, photodynamic therapy]
  - front: "What is glaucoma and what are the key background concepts?"
    back: "Definition: Progressive, irreversible, pressure-sensitive optic neuropathy with characteristic structural changes to optic nerve head and associated visual field changes; commonly (but not always) associated with high IOP\nKey concepts:\n- Aqueous produced by ciliary body → drains via trabecular meshwork and Canal of Schlemm → episcleral veins\n- Isolated elevated IOP without glaucoma = ocular hypertension (OHT) — increased risk of developing glaucoma\n- IOP >21 mmHg increases risk of glaucoma\n- Thicker cornea → overestimation of IOP on tonometry\n- Structural changes precede functional changes\n- Peripheral vision loss precedes central vision loss\n\nUnderstanding aqueous humor dynamics is central to glaucoma pharmacology. The trabecular meshwork is the main site of resistance to outflow. Central corneal thickness (pachymetry) must be factored into IOP interpretation — thin corneas underestimate true IOP (higher risk). Structural changes on OCT (NFL/GCIPL thinning) precede detectable visual field loss."
    difficulty: easy
    tags: [ophthalmology, glaucoma, IOP, aqueous humor, optic nerve]
  - front: "What investigations are required to diagnose and monitor glaucoma?"
    back: "1. VA testing\n2. Slit-lamp exam to assess anterior chamber depth\n3. Gonioscopy to assess drainage angle (open or closed)\n4. Fundoscopy to assess optic disc features (CDR, neuroretinal rim)\n5. Tonometry to measure IOP\n6. Automated perimetry (formal visual field testing)\n7. Pachymetry to measure central corneal thickness\n8. OCT of retinal NFL at optic nerve (monitors NFL loss)\n9. OCT of macular GCIPL (monitors ganglion cell loss)\nFollow-up: optic disc exam, IOP, OCT of NFL and GCIPL, visual field testing\n\nGonioscopy is critical to distinguish open-angle from angle-closure glaucoma — the treatment approach differs fundamentally. CDR >0.6 vertically or >0.2 asymmetry between eyes is suspicious for glaucoma. Structural OCT changes (NFL thinning) are often detectable before visual field defects appear."
    difficulty: medium
    tags: [ophthalmology, glaucoma, investigations, gonioscopy, OCT, visual field, pachymetry]
  - front: "What are the major and minor risk factors for primary open-angle glaucoma (POAG)?"
    back: "Major risk factors:\n1. Ocular hypertension (IOP >21 mmHg)\n2. Age (prevalence 1-2% at 40 yr; 10% at 80 yr)\n3. African descent\n4. Family history (2-3x increased risk; polygenic)\n5. Thin central cornea (OHTS trial)\nMinor risk factors:\n1. Myopia\n2. Diabetes mellitus\n3. Hyperthyroidism (Graves' disease)\n4. Chronic corticosteroid use (topical >> oral)\n5. Previous ocular trauma\n6. Anemia/hemodynamic crisis\n\nPOAG is the most common type (>95% of glaucoma). It is insidious and asymptomatic — screening is critical. African descent is a major risk factor with earlier onset and more aggressive disease. Topical steroids carry significantly higher IOP risk than oral steroids ('Rule of Fours': 1/4 of the population using topical steroids 4x/day for 4 weeks will develop elevated IOP)."
    difficulty: medium
    tags: [ophthalmology, POAG, primary open-angle glaucoma, risk factors, African descent]
  - front: "What are the optic disc and visual field changes in primary open-angle glaucoma (POAG)?"
    back: "Optic disc changes:\n- Increased CDR (vertical CDR >0.6)\n- Significant CDR asymmetry (>0.2 between eyes)\n- Thinning/notching of neuroretinal rim\n- Flame-shaped disc hemorrhage\n- 360° peripapillary atrophy\n- NFL defect\n- Large vessels become nasally displaced\n- Retinal NFL vertical thinning on OCT; GCIPL thinning on OCT\nVisual field changes (in order of progression):\n1. Small paracentral scotoma\n2. Arcuate defect (Bjerrum scotoma)\n3. Nasal step\n4. Temporal central island\n5. Concentric enlargement of blind spot\n6. Advanced/total loss (tunnel vision → complete loss)\n\nThe neuroretinal rim follows the ISNT rule normally (inferior > superior > nasal > temporal rim thickness). POAG preferentially affects the superior and inferior poles, creating arcuate scotomas. CDR >0.5 should be referred; CDR >0.8 suggests advanced loss. Disc hemorrhages in POAG indicate active progression."
    difficulty: hard
    tags: [ophthalmology, POAG, optic disc, visual field, CDR, arcuate scotoma]
  - front: "What are the medical treatment options for primary open-angle glaucoma (POAG), organized by mechanism?"
    back: "Increase aqueous outflow:\n1. Topical prostaglandin analogues (e.g., latanoprost) — first-line\n2. Topical alpha-2 adrenergics (e.g., brimonidine)\n3. Topical cholinergics/parasympathomimetics (e.g., pilocarpine)\nDecrease aqueous production:\n1. Topical beta-blockers (e.g., timolol)\n2. Topical carbonic anhydrase inhibitors (e.g., dorzolamide)\n3. Oral carbonic anhydrase inhibitors (e.g., acetazolamide)\n4. Topical alpha-2 adrenergics (dual mechanism)\nSurgical/procedural options:\n- Laser trabeculoplasty (SLT)\n- Trabeculectomy (new outflow tract)\n- MIGS (iStent, Xen, Hydrus)\n- Tube shunt (Ahmed, Baerveldt) for advanced glaucoma\n- Cyclophotocoagulation (refractory cases)\n\nElevated IOP is the only modifiable risk factor proven to prevent glaucoma progression. Prostaglandin analogues are typically first-line (once daily, potent IOP reduction, uveoscleral outflow). Treating ocular hypertension without glaucoma has also been shown to reduce the risk of developing glaucoma. MIGS is used for mild-to-moderate glaucoma with high safety profile."
    difficulty: hard
    tags: [ophthalmology, POAG, glaucoma medications, prostaglandin, beta-blocker, trabeculectomy]
  - front: "What is normal tension glaucoma (NTG) and what are its associations?"
    back: "Definition: Glaucomatous optic neuropathy with IOP in the normal range (<21 mmHg)\nAssociations:\n- Often found in women >60 yr (but may occur earlier)\n- Migraines\n- Peripheral vasospasm\n- Systemic nocturnal hypotension\n- Sleep apnea\nPathogenesis: Damage to optic nerve may be due to vascular insufficiency (rather than elevated pressure)\nTreatment: Treat reversible causes; lower IOP (Collaborative Normal Tension Glaucoma Study showed IOP reduction reduces rate of visual field loss)\n\nNTG demonstrates that IOP is not the only pathogenic mechanism in glaucoma — vascular factors play an important role. The Collaborative NTG Study showed IOP reduction by 30% is beneficial. Nocturnal hypotension reduces optic nerve perfusion during sleep, which is particularly harmful. Vasospasm (migraine, Raynaud's) may intermittently compromise blood flow."
    difficulty: medium
    tags: [ophthalmology, normal tension glaucoma, NTG, vascular, migraine]
  - front: "What are the types of secondary open-angle glaucoma?"
    back: "1. Steroid-induced glaucoma: topical (highest risk), periocular, systemic, or inhaled steroids → reduced aqueous outflow facility; 'Rule of Fours': 1/4 population using topical steroids 4x/day for 4 weeks will develop elevated IOP\n2. Traumatic glaucoma: blunt/penetrating injury → damaged tissue/scarring obstructs drainage; may occur immediately or years later\n3. Pigmentary glaucoma: pigment dispersion syndrome → iris pigment disperses and deposits in trabecular meshwork\n4. Pseudoexfoliation glaucoma: pseudoexfoliation syndrome → age-related fibrillar deposits accumulate in anterior segment and trabecular meshwork\n\nSteroid-induced glaucoma is one of the most important drug-induced eye conditions. Topical steroids (eye drops) carry significantly higher IOP risk than oral or inhaled steroids. Pigmentary glaucoma typically affects young myopic males. Pseudoexfoliation glaucoma is common in Scandinavian populations and often responds poorly to medical therapy."
    difficulty: medium
    tags: [ophthalmology, secondary glaucoma, steroid-induced, pigmentary, pseudoexfoliation]
  - front: "What is primary angle-closure glaucoma (PACG), what are its risk factors, and how does it present acutely?"
    back: "Definition: 5% of glaucoma cases; peripheral iris bows forward obstructing aqueous access to trabecular meshwork; sudden forward shift of lens-iris diaphragm → pupillary block → impaired drainage → sudden IOP rise\nRisk factors: Hyperopia (small eye, big lens), age >70 yr, female sex, family history, Asian and Inuit descent (most common in these groups), mature cataracts, shallow anterior chamber, pupil dilation (anticholinergics, stress, darkness)\nAcute presentation:\n- Red, painful eye (RED FLAG)\n- Unilateral (but other eye at risk)\n- Decreased VA, blurred vision (corneal edema)\n- Halos around lights\n- Nausea, vomiting, abdominal pain\n- Fixed, mid-dilated pupil\n- Markedly elevated IOP (>40 mmHg, noticeable on palpation)\n- Shallow anterior chamber\n\nPACG is an ocular emergency. The mid-dilated pupil is key — dilation maximally engages the pupillary block mechanism (iris occludes the pupil margin). Any anticholinergic medication can precipitate an acute attack. Contrast with POAG: PACG is painful, acute, unilateral, with a red eye — POAG is painless and asymptomatic."
    difficulty: medium
    tags: [ophthalmology, angle-closure glaucoma, PACG, ocular emergency, pupillary block, Asian]
  - front: "What are the differences between open-angle and angle-closure glaucoma in clinical presentation?"
    back: "Open-angle (POAG):\n- Common (95% of cases)\n- More common in Black individuals\n- Moderately high IOP\n- Normal pupil\n- No N/V, no abdominal pain\n- No halos around light\n- Asymptomatic\nAngle-closure (PACG):\n- Rare (5%)\n- More common in hyperopic, Asian/Inuit individuals\n- Extremely high IOP\n- Dilated pupil unreactive to light\n- N/V and abdominal pain (may mimic acute abdomen)\n- Halos around light\n- Painful, red eye\n\nThe nausea and vomiting in acute angle-closure can mislead clinicians toward a GI diagnosis. Measuring IOP in any patient with acute eye pain, redness, and decreased vision is essential. The fixed mid-dilated pupil and rock-hard eye (palpable firmness) are hallmarks. Prompt ophthalmology referral is mandatory."
    difficulty: medium
    tags: [ophthalmology, glaucoma, open-angle vs angle-closure, differential, clinical features]
  - front: "What is the treatment for acute angle-closure glaucoma (PACG)?"
    back: "OCULAR EMERGENCY — refer to ophthalmologist urgently\nMedical (acute management):\n1. Aqueous suppressants (topical beta-blockers, carbonic anhydrase inhibitors)\n2. Hyperosmotic agents: oral glycerine or IV mannitol\n3. Miotic drops (pilocarpine) to reverse pupillary block\n4. Multiple topical IOP-lowering agents\nDefinitive treatment:\n- Laser iridotomy: creates a hole in the peripheral iris to bypass the pupillary block\nComplication if untreated:\n- Irreversible vision loss within hours to days\n- Permanent peripheral anterior synechiae → permanent angle closure\n\nLaser iridotomy is curative — it creates a new channel for aqueous to flow from posterior to anterior chamber, bypassing the blocked pupil. Prophylactic iridotomy is offered to the fellow eye, which has high risk of developing angle closure. Pilocarpine constricts the pupil, pulling the iris away from the trabecular meshwork. Miotic drops and beta-blockers are mnemonically remembered as 'BACH': B-blocker, Acetazolamide, Carbachol/pilocarpine, Hyperosmotic agents."
    difficulty: medium
    tags: [ophthalmology, angle-closure glaucoma, treatment, laser iridotomy, pilocarpine, mannitol]
  - front: "What are the causes of secondary angle-closure glaucoma?"
    back: "1. Uveitis: inflamed iris adheres to lens (posterior synechiae) → iris bombé → angle closure\n2. Neovascular glaucoma:\n- Abnormal blood vessels on iris surface (rubeosis iridis), in angle, within trabecular meshwork\n- Due to retinal ischemia from PDR or CRVO\n- Treatment: laser photocoagulation to retina reduces neovascular stimulus\n\nIn uveitic glaucoma, 360° posterior synechiae cause iris bombé — the iris bows forward due to trapped aqueous behind it. Neovascular glaucoma is a catastrophic complication of ischemic retinal disease (proliferative diabetic retinopathy, CRVO). Rubeosis iridis (neovascularization of iris) is the key finding. Anti-VEGF injections can be combined with laser photocoagulation."
    difficulty: medium
    tags: [ophthalmology, secondary angle-closure glaucoma, neovascular glaucoma, rubeosis iridis, uveitis]
  - front: "Describe the pupillary light reflex pathway."
    back: "Afferent limb: Light → optic nerve (CN II) → optic tracts → midbrain (pretectal area)\nBilateral: Impulses enter BOTH sides of the midbrain via pretectal area and Edinger-Westphal nuclei (explains consensual reflex)\nEfferent limb: CN III → ciliary ganglia → iris sphincter muscle → miosis (pupil constriction)\nResult: Direct light reflex (same eye) and consensual light reflex (opposite eye) both occur\n\nThe consensual reflex occurs because the pretectal area sends signals bilaterally to both Edinger-Westphal nuclei. A relative afferent pupillary defect (RAPD/Marcus Gunn pupil) occurs when the afferent limb is damaged — the swinging flashlight test reveals this. RAPD is seen in optic nerve disease, large retinal lesions, or severe retinal detachment."
    difficulty: medium
    tags: [ophthalmology, pupillary light reflex, CN II, CN III, Edinger-Westphal, RAPD]
  - front: "What are the autonomic receptors involved in pupillary control and their actions?"
    back: "- Alpha-1: pupillary dilator muscle contraction → mydriasis (sympathetic)\n- Beta-2: ciliary muscle relaxation (non-accommodation); increased aqueous humour production (sympathetic)\n- M3 (muscarinic): pupillary sphincter contraction → miosis; ciliary muscle contraction → accommodation (parasympathetic)\nSphincter: innervated by parasympathetic (CN III via ciliary ganglion)\nDilator: innervated by sympathetic (3-neuron arc: hypothalamus → spinal cord → superior cervical ganglion → eye)\n\nThis receptor pharmacology is fundamental to ophthalmic drug mechanisms: mydriatics (tropicamide = anticholinergic, phenylephrine = alpha-1 agonist), miotics (pilocarpine = M3 agonist), IOP-lowering agents (timolol = beta-blocker reduces aqueous production, brimonidine = alpha-2 agonist reduces production and increases uveoscleral outflow)."
    difficulty: medium
    tags: [ophthalmology, pupil, autonomic, receptors, alpha-1, M3, mydriasis, miosis]
  - front: "What is denervation hypersensitivity and how does it help diagnose pupil disorders?"
    back: "Definition: When postganglionic fibers are damaged, the under-stimulated end-organ compensates by upregulating neuroreceptors, becoming hypersensitive to low doses of agonists\nClinical applications:\n1. Adie's pupil (postganglionic parasympathetic lesion): constricts to dilute pilocarpine 0.125% (normal pupil does NOT); shows light-near dissociation (constricts to near target but not light)\n2. Horner's syndrome (postganglionic sympathetic lesion): dilates with apraclonidine 0.5-1% (reversal of anisocoria); normal pupil does NOT dilate\n\nPharmacological testing exploits denervation hypersensitivity to localize the lesion. Adie's tonic pupil is due to ciliary ganglion damage (viral, traumatic) causing a large, poorly reactive pupil that constricts to accommodation. Horner's syndrome (ptosis, miosis, anhidrosis) from sympathetic chain damage is confirmed with apraclonidine or cocaine testing."
    difficulty: hard
    tags: [ophthalmology, denervation hypersensitivity, Adies pupil, Horners syndrome, pilocarpine, apraclonidine]
  - front: "What are the causes of anisocoria (unequal pupils)?"
    back: "Physiologic/idiopathic (most common): 20% of population; <1 mm difference; round/regular; reactive to light and near target; responds normally to mydriatics/miotics; can also be post-eye surgery or extensive retinal laser treatment\nPathological causes:\n- Large pupil (abnormal dilator or deficient constriction): CN III palsy (fixed dilated pupil), Adie's tonic pupil, pharmacological mydriasis, iris sphincter damage (trauma/ischemia)\n- Small pupil (abnormal constriction or deficient dilation): Horner's syndrome (ptosis, miosis, anhidrosis), pharmacological miosis, posterior synechiae (irregularly shaped)\n\nThe key diagnostic step is the swinging flashlight test and testing in dim vs. bright light. Anisocoria worse in dim light (with normal dilation in bright light) suggests sympathetic lesion (Horner's). Anisocoria worse in bright light (with poor constriction) suggests parasympathetic/CN III lesion. 20% of the population has physiologic anisocoria — the most common cause."
    difficulty: medium
    tags: [ophthalmology, anisocoria, pupil, Horners syndrome, CN III, physiologic]
  - front: "What is the sympathetic pathway to the pupil and which structures are at each level?"
    back: "Three-neuron arc:\n1. First-order neuron: hypothalamus → brainstem → spinal cord (C8-T2, ciliospinal center of Budge)\n2. Second-order/preganglionic neuron: spinal cord → sympathetic trunk via internal carotid artery → superior cervical ganglion in neck\n3. Third-order/postganglionic neuron: superior cervical ganglion → travels with internal carotid artery → eye (dilator pupillae, Müller's muscle in upper lid, lower lid retractor); neurotransmitter is norepinephrine\nHorner's syndrome = ptosis + miosis + anhidrosis (facial) from lesion at any level\n\nLocalizing the level of Horner's syndrome is clinically important. First-order lesions: stroke, syringomyelia, MS. Second-order: Pancoast tumor, cervical rib, thyroid surgery, neck dissection. Third-order: carotid artery dissection (urgent!), cavernous sinus pathology, cluster headache. Cocaine testing confirms Horner's; apraclonidine identifies postganglionic; hydroxyamphetamine differentiates 2nd from 3rd order."
    difficulty: hard
    tags: [ophthalmology, sympathetic pathway, Horners syndrome, three-neuron arc, pupil, norepinephrine]
  - front: "What are the 5 targets of retinal signals beyond the lateral geniculate body?"
    back: "1. Pretectal nucleus — pupillary reflex (light reflex pathway)\n2. Lateral geniculate body of thalamus — conscious visual perception\n3. Superior colliculus — eye movements (saccades)\n4. Suprachiasmatic nucleus — optokinetic responses\n5. Accessory optic system — circadian rhythm regulation\n\nThe retinohypothalamic tract projects to the suprachiasmatic nucleus (SCN) to entrain circadian rhythms — this is why blind patients can have disrupted sleep-wake cycles. The pupillary light reflex pathway via the pretectal nucleus explains why a patient can have good pupillary reflexes even with severely impaired conscious vision (e.g., cortical blindness with intact pupil responses)."
    difficulty: hard
    tags: [ophthalmology, retinal projections, pretectal nucleus, superior colliculus, circadian rhythm, pupillary reflex]
  - front: "A 65-year-old woman presents with sudden painless monocular vision loss. Fundoscopy shows a pale retina with a cherry-red spot at the macula. What is the diagnosis and what is the most important time constraint for treatment?"
    back: "Diagnosis: Central retinal artery occlusion (CRAO)\nTime constraint: OCULAR EMERGENCY — treatment must be initiated within 2 hours of symptom onset; irreversible retinal damage occurs if complete CRAO lasts >90 minutes\nImmediate management: Globe massage, topical beta-blocker, IV acetazolamide, IV mannitol, anterior chamber paracentesis; urgent neurology referral and vascular workup (carotid duplex, cardiac evaluation for embolic source)\n\nThe cherry-red spot is pathognomonic of CRAO — the surrounding retina becomes white/edematous due to ischemia while the fovea appears red because the thin foveal tissue allows visualization of the intact choroidal circulation. Common sources of emboli include carotid atherosclerosis and cardiac sources. GCA must be excluded urgently with ESR/CRP (temporal arteritis is a treatable cause)."
    difficulty: medium
    tags: [ophthalmology, CRAO, ocular emergency, cherry-red spot, clinical scenario]
  - front: "A 70-year-old man presents with a painful red eye, decreased vision, halos around lights, nausea, and vomiting. Examination shows a fixed mid-dilated pupil and IOP of 50 mmHg. What is the diagnosis and immediate management?"
    back: "Diagnosis: Acute primary angle-closure glaucoma (PACG)\nImmediate management (OCULAR EMERGENCY):\n1. Aqueous suppressants: topical beta-blocker (timolol), carbonic anhydrase inhibitor (acetazolamide IV/PO)\n2. Hyperosmotic agents: IV mannitol or oral glycerine\n3. Miotic drops: pilocarpine to reverse pupillary block\n4. Urgent ophthalmology referral\n5. Definitive: laser iridotomy\nFellow eye: prophylactic iridotomy (high risk for angle closure)\n\nThe constellation of acute painful red eye + mid-dilated fixed pupil + extremely high IOP + halos + GI symptoms is classic PACG. N/V can mimic acute abdomen — IOP measurement distinguishes this. Pilocarpine may be less effective initially when IOP is very high (ischemic sphincter). Irreversible vision loss can occur within hours; permanent synechiae within days."
    difficulty: medium
    tags: [ophthalmology, angle-closure glaucoma, clinical scenario, ocular emergency, laser iridotomy]
  - front: "What is the 'Rule of Fours' in ophthalmology relating to steroids and glaucoma?"
    back: "1/4 of the general population using topical steroids (eye drops) 4 times per day for 4 weeks will develop an increase in intraocular pressure (IOP)\nImplication: Topical steroids carry significantly higher risk of steroid-induced glaucoma than oral or inhaled steroids. IOP should be monitored in patients on long-term topical corticosteroids.\n\nSteroid-induced glaucoma is an open-angle type caused by reduced trabecular meshwork facility of aqueous outflow. Topical steroids bypass systemic metabolism and act directly on the trabecular meshwork. Steroid responders tend to be those with a family history of glaucoma, myopia, or diabetes. IOP usually normalizes after discontinuing the steroid, but damage may be irreversible."
    difficulty: easy
    tags: [ophthalmology, steroids, glaucoma, Rule of Fours, steroid-induced glaucoma, IOP]
  - front: "What is the anti-VEGF evidence for treating macular edema in retinal vein occlusion (JAMA 2017)?"
    back: "JAMA 2017 RCT (bevacizumab vs. aflibercept for macular edema due to CRVO/hemiretinal vein occlusion):\n- 362 patients randomized to bevacizumab (Avastin®, off-label) vs. aflibercept (Eylea®)\n- At 6 months: mean VA letter score 69.3 in BOTH groups\n- Mean increase from baseline: 18.6 letters (bevacizumab) vs. 18.9 letters (aflibercept)\n- Conclusion: Bevacizumab was NON-INFERIOR to aflibercept for VA outcomes at 6 months (with important cost differences)\n\nThis landmark trial validated off-label bevacizumab as equivalent to aflibercept for CRVO-related macular edema, which has significant cost implications in Canadian healthcare. Bevacizumab is much less expensive than aflibercept. Both drugs block VEGF-A, reducing vascular permeability and macular edema. This supports individualized treatment decisions considering cost-effectiveness."
    difficulty: hard
    tags: [ophthalmology, CRVO, anti-VEGF, bevacizumab, aflibercept, RCT, macular edema]
