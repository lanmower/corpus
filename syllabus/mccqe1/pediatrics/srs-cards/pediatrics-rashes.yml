# Pediatrics Rashes (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What are the distinguishing features of candidal diaper dermatitis compared to irritant contact diaper dermatitis?"
    back: "Candidal diaper dermatitis features erythematous macerated papules/plaques with satellite lesions and involvement of skin folds. Irritant contact dermatitis does NOT involve skin folds, appearing as shiny red macules/patches, and lacks satellite lesions.\n\nSkin fold involvement and satellite lesions are pathognomonic for candidal infection. Irritant contact spares the folds because the folds protect skin from direct contact with urine/feces. Treatment of candidal diaper rash requires antifungal agents (clotrimazole, nystatin), while irritant dermatitis is managed with barrier creams and frequent diaper changes."
    difficulty: easy
    tags: [pediatrics, dermatology, diaper rash, candida, contact dermatitis]
