- id: fix-error-turn-retry-affordance
  title: Error turn says 'Tap to retry' (tutor-panel.js:531) but error turns are plain text with no handler AND action-bar ↻ is hidden for err turns (updateActionBar requires !last.err, line 188). Make error turns actually retryable.
  phase: EXECUTE
  status: completed
