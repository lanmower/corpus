# Palliative Medicine (Palliative Care) - generated from srs-mccqe1
cards:
  - front: "What is the role of the Edmonton Symptom Assessment System (ESAS) in palliative care?"
    back: "ESAS is a validated screening tool used in palliative care to assess common symptoms. Patients/caregivers rate the intensity of 10 symptoms from 0 (absent) to 10 (worst severity): pain, tiredness, nausea, depression, anxiety, drowsiness, appetite, well-being, shortness of breath, and 'other' (e.g., pruritus in liver disease, cough in lung disease). ESAS provides a measure of symptom burden and allows tracking of intervention efficacy over time.\n\nThe ESAS is widely used in Canadian palliative care settings, including the Edmonton Palliative Care Program where it originated. It is a patient-reported outcome measure that enables rapid symptom screening and monitoring. High scores (>7/10) for any symptom typically warrant active management. The ESAS is validated for both cancer and non-cancer palliative patients."
    difficulty: easy
    tags: [palliative-medicine, ESAS, symptom-assessment, pain-management]
  - front: "What does the Palliative Performance Scale (PPS) measure and how is it used?"
    back: "The Palliative Performance Scale (PPS) is a functional status assessment tool used in palliative care to assess a patient's ability to perform Activities of Daily Living (ADLs) and to help determine prognosis. It is used as part of comprehensive palliative assessment, supplementing patient-reported symptom assessment.\n\nThe PPS is derived from the Karnofsky Performance Scale and rates functional status from 100% (full activity, no disease) to 0% (death) in 10% increments. PPS scores correlate with survival: PPS 10-20% is associated with days-to-weeks survival. The PPS is used in Canadian hospice and palliative care programs to determine prognosis, guide goals of care discussions, and eligibility for palliative care services."
    difficulty: easy
    tags: [palliative-medicine, PPS, functional-status, prognosis, ADLs]
  - front: "What is the palliative care approach and when is it indicated?"
    back: "Palliative care: an approach that seeks to improve the quality of life of patients and their families facing a life-threatening illness, through the prevention and relief of suffering. Key principles: (1) applicable at ANY TIME during a life-limiting illness (not just end-of-life); (2) may be delivered IN CONJUNCTION with life-prolonging or curative interventions; (3) involves comprehensive assessment of physical, psychosocial, and spiritual domains.\n\nThe palliative care model has evolved from purely end-of-life care to a concurrent care model integrated alongside disease-directed therapy. Evidence (Temel et al. NEJM 2010) shows that early palliative care for patients with metastatic NSCLC improves QOL, reduces aggressive interventions, and may improve survival. Palliative care is provided by a multidisciplinary team and encompasses pain/symptom management, psychosocial support, goals of care discussions, and bereavement support."
    difficulty: easy
    tags: [palliative-medicine, definition, quality-of-life, concurrent-care]
  - front: "What does research (Wright et al. JAMA 2008) show about end-of-life discussions with physicians?"
    back: "Wright et al. JAMA 2008 (Coping with Cancer study): examined patient-physician EOL discussions and outcomes in advanced cancer. Findings: EOL discussions were NOT associated with higher rates of Major Depressive Disorder (MDD). EOL discussions WERE associated with: earlier admission to hospice, less aggressive medical care near death (less ventilation, resuscitation, ICU), and better caregiver adjustment after bereavement. Conclusion: EOL discussions result in LESS aggressive medical care and EARLIER hospice admission.\n\nThis landmark study demonstrated that advance care planning and EOL discussions do not cause psychological harm and actively improve end-of-life outcomes. Physicians often avoid EOL discussions for fear of causing distress, but evidence shows these conversations lead to better-quality deaths, less aggressive treatment, and improved caregiver bereavement adjustment. This supports the importance of timely goals-of-care conversations in palliative medicine."
    difficulty: medium
    tags: [palliative-medicine, end-of-life, goals-of-care, evidence-based-medicine, EOL-discussions]
  - front: "What are the 9 symptoms assessed by the Edmonton Symptom Assessment System (ESAS)?"
    back: "Pain, Tiredness (lack of energy), Drowsiness (feeling sleepy), Nausea, Lack of Appetite, Shortness of Breath, Depression (feeling sad), Anxiety (feeling nervous), Wellbeing (overall feeling). An optional 10th item allows rating of another problem (e.g., constipation). Each is rated 0–10.\n\nThe ESAS is a validated palliative care symptom assessment tool widely used in Canadian palliative care programs (including Alberta Health Services). It captures both physical and psychological symptoms and guides symptom management interventions."
    difficulty: easy
    tags: [palliative medicine, symptom assessment, ESAS, tools]
  - front: "What are the 5 components of the Palliative Performance Scale (PPS)?"
    back: "Ambulation, Activity and Evidence of Disease, Self-Care, Intake, and Level of Consciousness.\n\nThe PPS assesses functional status and has prognostic value in patients with advanced cancer. Reading starts at the 'ambulation' column and drops down rows until the patient's description is met, then shifts right — never up — across columns. The overall PPS score is the lowest level reached."
    difficulty: easy
    tags: [palliative medicine, PPS, functional status, prognosis, tools]
  - front: "What PPS level corresponds to a patient who is mainly sitting or lying, unable to do any work, requires occasional assistance, with normal or reduced intake and full or confused consciousness?"
    back: "PPS 50%.\n\nPPS 50% indicates extensive disease where the patient is mainly sitting or lying. This is a mid-range level indicating significant functional decline. PPS has demonstrated prognostic value in advanced cancer and guides decisions about appropriate level of care."
    difficulty: medium
    tags: [palliative medicine, PPS, functional status, prognosis]
  - front: "At what PPS level does ambulation become 'totally bedbound' and intake reduces to 'mouth care only'?"
    back: "PPS 10%.\n\nPPS 10% represents the most severe functional decline before death (PPS 0%). At this level, the patient is totally bedbound, unable to perform any activities, requires total care, receives mouth care only, and is drowsy or comatose with confusion. This level indicates imminent death."
    difficulty: medium
    tags: [palliative medicine, PPS, end-of-life, dying]
  - front: "What is the first-line pharmacologic management of constipation in palliative care?"
    back: "Stimulant laxatives (senna) and osmotic laxatives (lactulose). Non-pharmacologic measures include hydration (orally where possible), increasing mobility, and ruling out obstruction, impaction, anorectal disease, or spinal cord pathology.\n\nConstipation is extremely common in palliative patients, especially those on opioids. Stimulant laxatives (like senna) promote intestinal motility, while osmotic laxatives (like lactulose) draw water into the bowel. These should be started prophylactically with opioid therapy."
    difficulty: easy
    tags: [palliative medicine, constipation, symptom management, laxatives]
  - front: "What pharmacologic agents are used to manage dyspnea in palliative care?"
    back: "Oxygen, bronchodilators, and opioids (e.g., morphine, hydromorphone). Non-pharmacologic measures include elevating the head of bed, eliminating allergens, opening a window, and using a fan.\n\nOpioids (particularly morphine) are the most effective pharmacologic treatment for refractory dyspnea in palliative patients. Notably, a landmark RCT (Lancet 2010) found that oxygen provides no additional benefit over room air for refractory dyspnea in patients not requiring long-term oxygen therapy."
    difficulty: easy
    tags: [palliative medicine, dyspnea, symptom management, opioids]
  - front: "What drug classes are used to treat hiccups in palliative care?"
    back: "Dopamine antagonists (e.g., chlorpromazine, haloperidol, metoclopramide) and smooth muscle relaxants (e.g., hyoscine butylbromide/Buscopan, baclofen). Non-pharmacologic options: swallowing 1 tsp dry sugar (nasopharyngeal/vagal stimulation) or rebreathing into a paper bag.\n\nPersistent hiccups in palliative patients are distressing and can interfere with sleep, eating, and communication. Chlorpromazine is the most commonly used agent; baclofen (a GABA-B agonist) is effective for chronic hiccups. Metoclopramide also works via dopamine antagonism."
    difficulty: medium
    tags: [palliative medicine, hiccups, symptom management]
  - front: "A palliative patient has nausea from vestibular disease and vertigo. What antiemetic is most appropriate?"
    back: "Dimenhydrinate.\n\nAntiemetic choice in palliative care is guided by etiology: vestibular disease/vertigo → dimenhydrinate (H1 antagonist); raised ICP → dexamethasone; anticipatory nausea/anxiety → lorazepam; drug-induced/hepatic/renal failure → prochlorperazine or haloperidol; GERD → PPI or H2 antagonist; gastric stasis → metoclopramide; bowel obstruction → metoclopramide + dexamethasone + octreotide."
    difficulty: medium
    tags: [palliative medicine, nausea, antiemetics, symptom management]
  - front: "What pharmacologic agents are used for nausea secondary to bowel obstruction in palliative care?"
    back: "Metoclopramide, dexamethasone, and octreotide.\n\nBowel obstruction causes nausea through multiple mechanisms including gut distension and raised intraluminal pressure. Octreotide reduces GI secretions, dexamethasone reduces peritumoral edema and has anti-inflammatory effects, and metoclopramide promotes upper GI motility (use with caution if complete obstruction)."
    difficulty: medium
    tags: [palliative medicine, bowel obstruction, nausea, octreotide]
  - front: "According to the WHO Pain Relief Ladder, what analgesics are used for nociceptive pain at each step?"
    back: "Step 1 (mild pain): non-opioids (NSAIDs, acetaminophen) ± adjuvants. Step 2 (moderate pain): weak opioids (e.g., tramadol) ± non-opioids ± adjuvants. Step 3 (severe/persistent pain): strong opioids (e.g., morphine, hydromorphone, oxycodone, fentanyl) ± non-opioids ± adjuvants.\n\nThe WHO analgesic ladder provides a stepwise approach to cancer pain management. Adjuvants (co-analgesics) can be added at any step. 'Freedom from cancer pain' is achieved by using the right drug, at the right dose, at the right time. Opioids should be given around the clock with provision for breakthrough dosing."
    difficulty: easy
    tags: [palliative medicine, pain management, WHO ladder, opioids, analgesics]
  - front: "What are the first-line pharmacologic agents for neuropathic pain in palliative care?"
    back: "Anticonvulsants (gabapentin, pregabalin) and antidepressants (TCAs, SSRIs). Steroids (dexamethasone) can also be used.\n\nNeuropathic pain results from nerve injury or dysfunction and often responds poorly to opioids alone. Gabapentinoids act on voltage-gated calcium channels; TCAs block sodium channels and inhibit reuptake of monoamines. A multimodal approach combining an opioid with a neuropathic agent often provides best relief."
    difficulty: easy
    tags: [palliative medicine, neuropathic pain, gabapentin, TCAs, symptom management]
  - front: "What is the preferred route of medication administration when a dying patient can no longer swallow?"
    back: "Subcutaneous (SC) injection is the preferred route.\n\nWhen oral administration is no longer possible in the dying patient, SC is preferred because it is less invasive than IV, can be used for continuous infusions, and is effective for most palliative medications. Other alternatives include gastrostomy tube, IV, nasal, oral/rectal transmucosal, and transdermal routes."
    difficulty: easy
    tags: [palliative medicine, end-of-life, medication administration, subcutaneous]
  - front: "What pharmacologic agents are used to treat 'death rattle' (oropharyngeal secretions) in dying patients, and what is the preferred agent?"
    back: "Anticholinergic agents: hyoscine hydrobromide (scopolamine) SC or transdermal, and glycopyrronium (glycopyrrolate) SC. Glycopyrronium is preferred because it does not cross the blood-brain barrier and therefore has fewer central effects (less delirium/sedation) compared to scopolamine.\n\nDeath rattle occurs in up to 50% of dying patients and is distressing primarily for family members. Non-pharmacologic measures include repositioning (on side, elevated), oral suctioning (avoid deep suctioning), and discontinuing unnecessary IV fluids. Reassuring family that the patient is not in respiratory distress is important."
    difficulty: medium
    tags: [palliative medicine, death rattle, glycopyrrolate, scopolamine, end-of-life, anticholinergics]
  - front: "What pharmacologic agents are used to treat pruritus in palliative care?"
    back: "Emollients/moisturizers, anticonvulsants (gabapentin, pregabalin), SSRIs (paroxetine, sertraline), SNRIs (mirtazapine), opioid antagonists (naltrexone), and rifampicin (if chronic liver disease). Non-pharmacologic: bathe with tepid water, avoid soap and bath oils.\n\nPruritus in palliative patients can be caused by opioids (histamine release), cholestasis, renal failure, or the underlying malignancy. The treatment approach is etiology-specific: rifampicin is used specifically for cholestatic pruritus (chronic liver disease), while mirtazapine and gabapentinoids are effective for various causes."
    difficulty: medium
    tags: [palliative medicine, pruritus, symptom management]
  - front: "What is the management of agitation and delirium in palliative patients?"
    back: "Neuroleptics (e.g., haloperidol) are used for both agitation and confusion/delirium. For delirium, treat the underlying etiology if possible; otherwise manage with neuroleptics. For depression: SSRIs/SNRIs (may be too slow depending on prognosis); consider psychostimulants (methylphenidate, ketamine).\n\nTerminal restlessness/delirium occurs in up to 80% of patients in the last 24–48 hours of life. Haloperidol is the most commonly used neuroleptic for delirium in palliative care. If rapid antidepressant effect is needed (poor prognosis), psychostimulants like methylphenidate work within days rather than weeks."
    difficulty: medium
    tags: [palliative medicine, delirium, agitation, haloperidol, terminal restlessness]
  - front: "What are the general predictors of decline in the final months of life in palliative patients?"
    back: "Decreasing activity/functional status (in bed/chair >50% of day, increasing ADL dependence), comorbidity (biggest predictor of mortality/morbidity), general physical decline, advanced unstable disease with complex symptoms, decreasing treatment response, choice of no further active treatment, progressive weight loss >10% in past 6 months, repeated unplanned admissions, sentinel events (serious fall, bereavement, transfer to nursing home), serum albumin <25 g/L, eligibility for terminal illness disability benefits.\n\nThese indicators help identify patients who would benefit from palliative/hospice referral. The 'surprise question' — 'Would I be surprised if this patient died in the next 6–12 months?' — is a validated clinical tool. Serum albumin <25 g/L is an objective laboratory marker of poor prognosis."
    difficulty: medium
    tags: [palliative medicine, prognosis, end-of-life, predictors of decline]
  - front: "What are the physical changes that occur in the last hours of life?"
    back: "Decreased level of consciousness, changes in breathing pattern (Cheyne-Stokes breathing), airway secretions causing noisy breathing ('death rattle'), inability to swallow safely with increased aspiration risk, delirium (terminal restlessness), mottling of hands/feet/legs, and cool extremities.\n\nRecognizing these signs is important for educating families, discontinuing non-essential medications, transitioning to SC administration, and initiating comfort care measures. Cheyne-Stokes breathing (cycles of apnea and hyperpnea) occurs due to central nervous system failure and reduced CO2 sensitivity."
    difficulty: easy
    tags: [palliative medicine, dying, end-of-life, last hours of life, Cheyne-Stokes]
  - front: "What are the 5 dimensions of a good death as identified by patients' perspectives (JAMA 1999)?"
    back: "1. Pain/symptom management, 2. Avoiding prolongation of dying, 3. Achieving a sense of control, 4. Relieving burden on others, 5. Strengthening relationships with loved ones.\n\nThis landmark study (Singer et al., JAMA 1999) was a qualitative study identifying what seriously ill patients view as important at the end of life. Understanding these priorities helps healthcare providers align goals of care with patient values. Freedom from pain was ranked as the most important attribute."
    difficulty: easy
    tags: [palliative medicine, quality of dying, patient perspectives, goals of care]
  - front: "What is advance care planning in palliative medicine?"
    back: "A process involving a mentally capable patient: (1) identifying their Substitute Decision Maker (SDM) or Power of Attorney (POA); (2) discussing their values, beliefs, and wishes for future health care should they become incapable; and (3) this process can only occur with a capable patient.\n\nIn Ontario, every person already has a legally designated SDM. If they want to appoint a different person, a POA document must be completed. Advance care planning differs from 'goals of care' discussions (which address current acute medical decisions) in that it anticipates future incapacity."
    difficulty: easy
    tags: [palliative medicine, advance care planning, SDM, POA, ethics]
  - front: "What does the code status designation 'Allow Natural Death (AND)' mean, and how does it differ from DNR?"
    back: "AND (Allow Natural Death) is an alternative, often gentler term for DNR (Do Not Resuscitate). Both mean the patient does not wish to receive CPR or life support; only active medical management continues. 'AND' is preferred by some clinicians as it is less negative and more accurately describes the intent.\n\nCode status options in palliative care include: full code (CPR, defibrillation, life support), DNR/AND (no CPR or life support, active medical management continues), and comfort measures only (no CPR, life support, or active medical management). CPR is rarely effective in patients with advanced incurable illness."
    difficulty: easy
    tags: [palliative medicine, code status, DNR, AND, CPR, end-of-life decisions]
  - front: "When should end-of-life (EOL) care discussions be initiated?"
    back: "When: (1) recent hospitalization for serious illness or transition in care; (2) severe progressive medical condition(s); (3) death expected within 6–12 months; (4) patient has rewritten their will and/or spiritual wishes; (5) patient requests medical assistance in dying (MAID).\n\nEarly initiation of EOL discussions allows patients to express preferences before they lose decision-making capacity. Studies show that patients who have EOL discussions have better quality of life, are less likely to receive aggressive EOL care, and their family members have better bereavement outcomes."
    difficulty: easy
    tags: [palliative medicine, end-of-life, goals of care, communication]
  - front: "What are the 6 steps of the SPIKES protocol for delivering bad news?"
    back: "S – Setting up the interview (private, comfortable, adequate time, support present); P – assess Perception (patient's understanding, use open-ended questions); I – Invitation (how much detail does the patient want to hear?); K – Knowledge sharing (small segments, non-technical terms); E – Emotions (respond, allow processing, silence is okay); S – Strategy and Summary (summarize and discuss next steps).\n\nSPIKES (Baile et al., 2000) is a structured, evidence-based framework for delivering bad news. Assessing perception before sharing information ('Ask before tell') ensures the clinician understands the patient's baseline knowledge and avoids unnecessary distress. Responding to emotions is crucial before moving to strategy."
    difficulty: easy
    tags: [palliative medicine, communication, SPIKES, bad news, breaking bad news]
  - front: "What does research show about clinician accuracy in estimating prognosis for terminally ill patients?"
    back: "Clinicians are systematically optimistic. Only 20% of predictions are accurate (within 33% of actual survival). 63% are overly optimistic and 17% are overly pessimistic. Overall, doctors overestimate survival by a factor of 5.3 (median actual survival was 24 days).\n\nThis prospective cohort study (BMJ 2000) involving 343 doctors and 468 terminally ill patients is a landmark study demonstrating the tendency for prognostic optimism. As a result, when estimating prognosis, clinicians should use general time frames (hours to days, days to weeks, weeks to months) rather than specific predictions."
    difficulty: medium
    tags: [palliative medicine, prognosis, prognostication, research]
  - front: "What is the FICA spiritual assessment tool used in palliative care?"
    back: "FICA is a four-component spiritual assessment: F – Faith or beliefs; I – Importance of those beliefs to the patient; C – patient's participation in a religious or spiritual Community; A – how healthcare providers may Address the patient's health care issues in relation to their faith.\n\nSpiritual well-being is one of the 5 dimensions of a good death and a core domain of palliative care assessment. The FICA tool helps clinicians explore spiritual needs systematically and compassionately, enabling referral to chaplains or spiritual advisors when needed."
    difficulty: easy
    tags: [palliative medicine, spirituality, FICA, psychosocial assessment]
  - front: "What is palliative sedation therapy and when is it indicated?"
    back: "Palliative sedation therapy uses pharmacological agents to reduce consciousness. It is only considered in patients with: (1) advanced progressive illness, (2) intolerable and refractory physical symptoms (e.g., dyspnea, agitation), (3) in the final hours of life, and (4) only in consultation with specialist palliative care teams.\n\nPalliative sedation is distinct from euthanasia — the intent is relief of refractory suffering, not to hasten death. It is a last resort after all other symptom management options have been exhausted. Common indications include refractory dyspnea, agitation/terminal restlessness, and intractable pain. This is an option for physical suffering, not existential suffering alone."
    difficulty: hard
    tags: [palliative medicine, palliative sedation, refractory symptoms, end-of-life]
  - front: "What is Medical Assistance in Dying (MAID) in Canada and what are the two pathways?"
    back: "MAID is a process where a mentally competent patient makes a written request to end their life. A physician or NP administers lethal medications, or prescribes them for self-administration. Two pathways: (1) Pathway 1 — natural death is foreseeable; (2) Pathway 2 — serious and incurable illness/disease/disability but death is NOT immediately foreseeable. Patients whose sole eligibility is a mental health diagnosis cannot access MAID until March 17, 2027.\n\nCanada has one of the most comprehensive MAID frameworks globally. Both pathways require a written request and assessment by 2 independent clinicians (one being the MAID provider). A waiver of final consent is now allowed if the patient may lose decision-making capacity before their preferred date, when natural death is reasonably foreseeable."
    difficulty: medium
    tags: [palliative medicine, MAID, assisted dying, Canadian law, ethics]
  - front: "What are the three types of grief in palliative care?"
    back: "1. Anticipatory grief — feelings of grief before an impending loss (concern for the dying person, preparing for death); 2. Acute grief — immediate reaction to death of a loved one (most resolve with family/friend support over time); 3. Complicated grief — unanticipated, prolonged grief severely interfering with function, characterized by maladaptive thoughts, dysregulated emotions, and dysfunctional behaviours.\n\nComplicated grief (also called Prolonged Grief Disorder) is distinct from depression and normal grieving. It is characterized by intense longing, difficulty accepting the loss, and impaired functioning beyond the expected grief trajectory. The COSMIC trial showed that a proactive three-step communication intervention reduced prolonged grief (15% vs 21%) in ICU families."
    difficulty: easy
    tags: [palliative medicine, grief, bereavement, complicated grief]
  - front: "What is dignity therapy in palliative care?"
    back: "Dignity therapy uses structured questions to enhance psychological and spiritual well-being in patients with life-threatening illness. It creates a permanent record of the patient's life history, accomplishments, roles, values, and messages to loved ones. It addresses the existential dimension of suffering by reinforcing the patient's sense of meaning and legacy.\n\nDignity therapy is used to address existential suffering — specifically loss of dignity, loss of will to live, and desire for death. It is distinct from palliative sedation (for physical refractory symptoms) and MAID (for existential suffering in eligible patients). The created document can be left as a legacy for family."
    difficulty: medium
    tags: [palliative medicine, dignity therapy, existential suffering, psychosocial care]
  - front: "What are the sources of suffering in palliative patients?"
    back: "Physical (impaired activities, loss of independence, pain, fatigue, poor sleep, anorexia); Social-relational (family distress, burden on others); Psychological (fear of unknown, loss of control, difficulty accepting illness, comorbid depression/anxiety); Spiritual (unfulfilled needs of love/virtue/faith/hope, questioning meaning of life); Existential (loss of dignity, desire for death, loss of will to live).\n\nSuffering in palliative care is multidimensional and subjective. It can occur at any time during the palliative trajectory and is not confined to physical symptoms. Patients may suffer from treatments as well as illness. Recognizing all domains of suffering guides the interprofessional team's holistic approach."
    difficulty: medium
    tags: [palliative medicine, suffering, total pain, existential, psychosocial]
  - front: "What did the Early Palliative Care trial (NEJM 2010) demonstrate in patients with metastatic NSCLC?"
    back: "Early palliative care (nurse-led intervention addressing physical and psychosocial needs) in addition to usual oncology care resulted in: better quality of life, lower depressive symptoms, and longer median survival (11.6 months vs 8.9 months, P=0.02) compared to routine oncology care alone — despite receiving less aggressive EOL care.\n\nThis landmark RCT (Temel et al., NEJM 2010) fundamentally changed palliative care practice by demonstrating that early palliative care not only improves QOL and mood but also improves survival in metastatic NSCLC. This supports integrating palliative care early in the disease course, not just at end of life."
    difficulty: hard
    tags: [palliative medicine, early palliative care, NSCLC, landmark trial, survival]
  - front: "What did the palliative oxygen vs. room air trial (Lancet 2010) demonstrate?"
    back: "Oxygen via nasal cannula (2 L/min for ≥15 h/day for 7 days) provided NO additional symptomatic benefit for relief of refractory dyspnea compared to room air in patients with life-limiting illness not eligible for long-term oxygen therapy.\n\nThis double-blind RCT (n=239) challenges the routine use of supplemental oxygen for dyspnea in palliative patients. Morning breathlessness decreased by 0.9 points in the oxygen group vs 0.7 points in the room air group (P=0.554) — not significantly different. This supports using opioids rather than oxygen for refractory dyspnea management."
    difficulty: hard
    tags: [palliative medicine, dyspnea, oxygen therapy, landmark trial, evidence-based]
  - front: "What did the statin discontinuation trial (JAMA Intern Med 2015) show in palliative patients?"
    back: "Stopping statin therapy in patients with life expectancy of 1 month to 1 year (on statins ≥3 months) was safe: no significant difference in 60-day mortality (23.8% vs 20.3%, P=0.36). The discontinuation group had better total QOL (P=0.03) and mean cost savings of $716 per patient.\n\nThis RCT supports discontinuing statins in the palliative care setting. Statins are used for primary/secondary prevention of cardiovascular events, which is inappropriate when life expectancy is less than 1 year. Deprescribing non-essential preventive medications reduces pill burden, adverse effects, and costs while improving QOL."
    difficulty: hard
    tags: [palliative medicine, deprescribing, statins, landmark trial, medications]
  - front: "What does research show about PEG feeding tubes in nursing home patients with advanced dementia?"
    back: "Neither insertion of PEG feeding tubes nor the timing of insertion improves survival in nursing home residents with advanced cognitive impairment who develop eating problems.\n\nThis prospective cohort study (n=36,492) found that nursing home residents who had a feeding tube inserted within 1 year of developing eating problems had similar survival compared to those without feeding tubes. These findings support a comfort-focused feeding approach (hand feeding, dietary modifications) in advanced dementia rather than PEG insertion."
    difficulty: medium
    tags: [palliative medicine, dementia, PEG tube, artificial nutrition, end-of-life]
  - front: "What is the unique unit of care in pediatric palliative care?"
    back: "The family unit — including the afflicted child AND siblings (who are often affected in various ways). Palliative care ideally begins early after diagnosing a life-limiting/life-threatening disease and continues through treatment, alongside curative/standard care.\n\nPediatric palliative care differs from adult palliative care in that less than 30% of referrals are for cancer — the majority have congenital or acquired neurologic impairment, often technology-dependent. Respite services for families and bereavement support for parents and siblings are standard components of care."
    difficulty: easy
    tags: [palliative medicine, pediatric palliative care, family-centred care]
  - front: "What are the 4 categories of pediatric patients who may benefit from palliative care?"
    back: "Category 1: Life-threatening conditions where curative treatment may be feasible but can fail (e.g., cancer, irreversible organ failure) — palliative care no longer needed if remission achieved. Category 2: Conditions where premature death is inevitable but intensive treatment can prolong life and allow normal activities (e.g., cystic fibrosis, Duchenne muscular dystrophy). Category 3: Progressive conditions without curative options; exclusively palliative, may extend over years (e.g., Batten disease). Category 4: Irreversible but non-progressive conditions causing severe disability (e.g., severe cerebral palsy, severe brain/spinal cord injury).\n\nThis ACT/RCPCH framework helps identify appropriate pediatric patients for palliative care referral. In a prospective multicenter cohort study (Pediatrics 2011), the predominant conditions receiving pediatric palliative care were genetic/congenital (40.8%), neuromuscular (39.2%), cancer (19.8%), respiratory (12.8%), and gastrointestinal (10.7%)."
    difficulty: medium
    tags: [palliative medicine, pediatric palliative care, categories, prognosis]
  - front: "What are the pediatric symptom assessment tools used in palliative care and their age ranges?"
    back: "SSPedi (Symptom Screening in Pediatrics Tool): ages 8–18 years, 5-point Likert scale, assesses 15 symptoms. Mini-SSPedi: ages 4–7 years, 3-point face-based Likert scale, assesses the same 15 symptoms. Memorial Symptom Assessment Scale (MSAS): ages 7+ years, 5-point Likert scale, measures frequency/severity/distress of 32 symptoms.\n\nPediatric symptom tools account for developmental level rather than chronological age: children 4–5 can describe concrete health aspects; introspection develops around ages 6–8. SSPedi and Mini-SSPedi assess: depression, anxiety, irritability, memory/cognition, appearance changes, fatigue, mouth sores, headache, pain, tingling/numbness, nausea/vomiting, appetite, taste changes, constipation, and diarrhea."
    difficulty: medium
    tags: [palliative medicine, pediatric palliative care, symptom assessment, SSPedi, tools]
  - front: "What factors are associated with inequitable access to palliative care?"
    back: "Older age, race, not being married, living alone, non-cancer diagnosis, sexual/gender minority status, homelessness, low socioeconomic status, living in long-term care (LTC), lower caregiver educational attainment, residing in a rural area, physical or intellectual disability, and immigrant status.\n\nHealth equity in palliative care requires recognition of structural and social determinants of health. Non-cancer diagnoses (heart failure, COPD, dementia) historically have had reduced access to palliative care despite significant symptom burden. Rural residents face geographic barriers including lack of specialist palliative services."
    difficulty: easy
    tags: [palliative medicine, health equity, social determinants, access to care]
  - front: "What is the role of the interprofessional team in palliative care and who are the members?"
    back: "Members: physicians (primary care or palliative specialists), nurses (often with advanced palliative training), social workers/case managers (ACP, psychosocial support), pharmacists (medication management), occupational therapists (ADL, life roles), physiotherapists (comfort, physical function), dieticians (nutrition), spiritual care workers. All use validated tools (ESAS, PPS) and participate in ongoing care conversations.\n\nPalliative care is inherently interprofessional because suffering is multidimensional. No single discipline can address all domains (physical, psychological, social, spiritual, existential). The interprofessional team approach has been shown to improve patient outcomes, QOL, family satisfaction, and reduce caregiver burden."
    difficulty: easy
    tags: [palliative medicine, interprofessional team, collaboration]
  - front: "What is self-care in the context of healthcare professionals working in palliative care?"
    back: "Self-care is a proactive, holistic pursuit of personal well-being alongside professional responsibility. Benefits: balances compassion for self and others, improves patient care, predicts competence in coping with death, reduces fatigue/burnout, and cultivates self-awareness. Strategies: within workplace (workload boundaries, team debriefing, resources); beyond workplace (balanced diet, sleep hygiene, exercise, meditation, interpersonal fulfillment, spiritual practice).\n\nPalliative care professionals face high rates of compassion fatigue and burnout due to repeated exposure to death and suffering. Self-care is not optional — it is a professional responsibility that directly impacts quality of patient care. Institutional support and team-based debriefing are evidence-based workplace strategies."
    difficulty: easy
    tags: [palliative medicine, self-care, burnout, compassion fatigue, physician wellness]
  - front: "A palliative patient develops nausea due to raised intracranial pressure (ICP). What is the recommended pharmacologic treatment?"
    back: "Dexamethasone (a corticosteroid) reduces cerebral edema and peritumoral inflammation, thereby lowering raised ICP and relieving associated nausea.\n\nNausea from raised ICP is caused by pressure on the vomiting centre in the medulla. Dexamethasone reduces peritumoral edema effectively in brain metastases. It should be distinguished from nausea from other causes (vestibular → dimenhydrinate; gastric stasis → metoclopramide; drug-induced → prochlorperazine/haloperidol)."
    difficulty: medium
    tags: [palliative medicine, nausea, raised ICP, dexamethasone, brain metastases]
  - front: "What stimulant medications are used to manage cancer-related fatigue or depression in palliative patients with short prognosis?"
    back: "Psychostimulants: methylphenidate and dexamethasone (for fatigue); methylphenidate and ketamine (for depression when prognosis is too short to wait for SSRIs/SNRIs to work — standard antidepressants take 4–6 weeks for full effect).\n\nCancer-related fatigue affects >70% of palliative patients and is the most common and distressing symptom. Methylphenidate works within days rather than weeks, making it suitable for patients with limited prognosis. Dexamethasone also provides rapid short-term energy boost but long-term use has significant adverse effects."
    difficulty: medium
    tags: [palliative medicine, fatigue, depression, methylphenidate, psychostimulants]
  - front: "What is the difference between 'goals of care' discussions and 'advance care planning' in palliative medicine?"
    back: "Advance care planning occurs with a currently capable patient to document future wishes and identify their SDM/POA — for future use if they become incapable. Goals of care discussions occur when decisions need to be made NOW about current medical care (acute issues), exploring values, understanding of illness, and treatment options. Goals of care may or may not include code status discussion.\n\nBoth involve exploration of patient values and wishes, but ACP is prospective/preventive and can only happen while the patient is capable. Goals of care can occur with the patient or, if the patient is incapable, with their SDM. In practice, goals of care discussions often occur at transitions in care (hospitalization, disease progression)."
    difficulty: medium
    tags: [palliative medicine, advance care planning, goals of care, SDM, ethics]
  - front: "What non-pharmacologic interventions are unique to pediatric palliative symptom management?"
    back: "Play therapy and unstructured play (reduces anxiety, depression, and aggression); creating a sense of normality (seeing friends, attending school, parental discipline); shared decision-making involving the child (to extent possible/desired), parents, and healthcare providers; managing parental anxiety (as child's pain/anxiety correlates with parental anxiety); psychological support for siblings.\n\nPediatric palliative care must account for developmental stage when discussing illness, treatment, and dying. Open communication with the child about their diagnosis and prognosis is encouraged to reduce anxiety, with communication style adapted to cognitive/developmental level. The family (including siblings) is the unit of care."
    difficulty: medium
    tags: [palliative medicine, pediatric palliative care, play therapy, symptom management]
  - front: "What is bony metastatic pain management in palliative care?"
    back: "NSAIDs, acetaminophen and/or opioids (depending on pain severity); bisphosphonates (reduce osteoclast activity and skeletal-related events); and radiation therapy (effective for localized bone pain, single-fraction radiotherapy is as effective as multi-fraction for pain control).\n\nBone metastases are common in breast, prostate, lung, kidney, and thyroid cancers and cause significant pain. NSAIDs are particularly effective for bone pain due to their anti-prostaglandin mechanism. Bisphosphonates (e.g., zoledronic acid) reduce skeletal-related events and pain. Radiation provides effective local palliation."
    difficulty: medium
    tags: [palliative medicine, bone pain, metastases, bisphosphonates, radiation, pain management]
  - front: "What are the psychosocial needs assessed in palliative care as part of a holistic assessment?"
    back: "Mental/emotional needs (fear, worry, insomnia, panic, anxiety, lack of energy), social needs (family dynamics, communication, social/cultural networks, perceived support, finances, intimacy, living arrangements, caregiver availability), cultural needs (beliefs/preferences, linguistic needs, health behaviours, traditions, rituals, cultural barriers), and spiritual needs (meaning, value, purpose, religious practices, philosophical reflection).\n\nPsychosocial issues like depression and anxiety can manifest as physical symptoms (pain, nausea) and lead to other symptoms (insomnia, fatigue). A holistic palliative assessment addresses all domains — physical, psychological, social, cultural, and spiritual — to identify needed supports and guide the interprofessional care plan."
    difficulty: easy
    tags: [palliative medicine, psychosocial assessment, holistic care, cultural competence]
