# Ent Otitis Externa (ENT) - generated from srs-mccqe1
cards:
  - front: "What is malignant (necrotizing) otitis externa and which patients are at risk?"
    back: "Osteomyelitis of the mastoid or temporal bone, occurring in elderly patients with diabetes mellitus and immunocompromised patients. It is a rare, severe complication of otitis externa.\n\nMalignant OE is a life-threatening skull base osteomyelitis almost exclusively caused by Pseudomonas aeruginosa. The immunocompromised state (especially DM) impairs neutrophil function, allowing Pseudomonas to invade bone. It is a medical emergency requiring IV antibiotics and surgical debridement."
    difficulty: easy
    tags: [otolaryngology, otitis externa, osteomyelitis, pseudomonas, immunocompromised]
  - front: "What is the most common causative organism in malignant otitis externa and what cranial nerve is most commonly affected?"
    back: "Pseudomonas aeruginosa is the most common organism. CN VII (facial nerve) is most commonly affected, followed by CN X and CN XI.\n\nPseudomonas aeruginosa thrives in the warm, moist external auditory canal of diabetic patients. It invades the skull base and damages cranial nerves at the stylomastoid foramen and along the skull base. CN VII palsy in the setting of refractory otitis externa should prompt urgent imaging."
    difficulty: easy
    tags: [otolaryngology, malignant otitis externa, pseudomonas, cranial nerve, CN VII]
  - front: "How are gallium and technetium scans used differently in malignant otitis externa?"
    back: "Technetium scans are used for diagnosis (demonstrate sites of osteomyelitis). Gallium scans are used for follow-up monitoring of active infection because gallium is taken up by PMNs and only shows active infection, not the extent of osteomyelitis.\n\nTechnetium bone scans detect areas of increased bone turnover (osteomyelitis), while gallium is taken up by white blood cells (PMNs), making it a marker of active infection. Gallium normalization on follow-up scans indicates treatment response, making it the preferred monitoring tool during and after antibiotic therapy."
    difficulty: hard
    tags: [otolaryngology, malignant otitis externa, nuclear medicine, gallium scan, technetium scan]
  - front: "A 68-year-old diabetic man presents with severe otalgia, purulent otorrhea refractory to topical antibiotics, and granulation tissue on the floor of the auditory canal. What is the diagnosis and management?"
    back: "Diagnosis: malignant (necrotizing) otitis externa (skull base osteomyelitis). Management: medical emergency — hospitalization, IV antibiotics (anti-pseudomonal), surgical debridement. Imaging: high-resolution temporal bone CT, gadolinium-enhanced MRI, technetium scan.\n\nThe combination of elderly age, diabetes, refractory OE, granulation/necrotic tissue on auditory canal floor, and purulent otorrhea unresponsive to topical therapy is classic for malignant OE caused by Pseudomonas aeruginosa. CN VII palsy indicates spread to the skull base. Failure to treat aggressively risks cranial nerve palsies, systemic infection, and death. Technetium scan diagnoses osteomyelitis; gallium scan monitors treatment response."
    difficulty: hard
    tags: [otolaryngology, malignant otitis externa, clinical scenario, pseudomonas, diabetes, management]
