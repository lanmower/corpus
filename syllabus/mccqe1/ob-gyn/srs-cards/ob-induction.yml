# Ob Induction (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What is the Bishop score and how is it interpreted?"
    back: "The Bishop score assesses cervical favourability for induction. Components (scored 0-3 each):\n- **Position:** Posterior (0), Mid (1), Anterior (2)\n- **Consistency:** Firm (0), Medium (1), Soft (2)\n- **Effacement (%):** 0-30 (0), 40-50 (1), 60-70 (2), >80 (3)\n- **Dilatation (cm):** 0 (0), 1 (1), 3-4 (2), ≥5 (3)\n- **Station of fetal head:** -3 (0), -2 (1), -1/0 (2), +1/+2/+3 (3)\n\n**Interpretation:**\n- <3: Unfavourable → cervical ripening required\n- ≥6: Favourable\n- 9-13: High likelihood of vaginal delivery\n\nThe Bishop score is used to predict the likelihood of successful labour induction and need for cervical ripening. An unfavourable cervix (Bishop score <6) warrants cervical ripening before induction. The mnemonic PCED-S (Position, Consistency, Effacement, Dilatation, Station) helps recall the components."
    difficulty: medium
    tags: [obstetrics, induction of labour, Bishop score, cervical favourability, cervical ripening]
  - front: "What are the indications for induction of labour?"
    back: "**Most common:** Late term (40-41 wk) and postterm (≥42 wk GA)\n**Second most common:** Diabetes mellitus\n\n**Maternal indications:**\n- DM\n- Gestational HTN ≥38 wk GA\n- Preeclampsia (balance severity vs. GA)\n- Other maternal comorbidities (renal/lung disease, chronic HTN, cholestasis)\n- Significant but stable antepartum hemorrhage\n- Advanced maternal age >40 yr at ≥39 wk GA (increased stillbirth risk)\n\n**Maternal-fetal:** Isoimmunization, PROM, chorioamnionitis\n\n**Fetal:** Suspected fetal compromise, macrosomia, fetal demise, IUGR, oligo/polyhydramnios, anomalies requiring surgery, discordant twins, previous stillbirth or low PAPP-A\n\n**>41 wk GA:** Offer IOL if no contraindications; IOL decreases CD, FHR changes, meconium staining, macrosomia, and death vs. expectant management\n\nIn Canada, IOL at ≥41 weeks is standard of care and is shown to reduce perinatal mortality and CD rates compared to expectant management. The ARRIVE trial demonstrated that elective IOL at 39+0 to 40+6 weeks in low-risk nulliparous women does not increase adverse perinatal outcomes and actually reduces CD rates."
    difficulty: easy
    tags: [obstetrics, induction of labour, indications, postterm pregnancy]
  - front: "What are the prerequisites for labour induction?"
    back: "**Capability:** CD capability if necessary\n\n**Maternal:**\n- Favourable cervix (soft, effaced, anterior, dilated) OR cervical ripening performed\n- No contraindications to vaginal delivery\n\n**Fetal:**\n- Normal FHR tracing\n- Cephalic presentation\n- Adequate fetal monitoring available\n\n**Consider the 5 Cs before induction:**\n- Fetal presentation\n- Potential for CPD\n- Fetal well-being/FHR\n- Membrane status\n\nAll prerequisites must be met before proceeding with labour induction. If the cervix is unfavourable (Bishop score <6), cervical ripening must precede induction. The ability to perform emergent CD is mandatory as IOL may result in failed induction requiring operative delivery."
    difficulty: easy
    tags: [obstetrics, induction of labour, prerequisites]
  - front: "What are the contraindications to induction of labour?"
    back: "**Maternal:**\n- Any contraindication to vaginal delivery (prior classical/inverted T-incision CD or uterine surgery e.g. myomectomy)\n- Unstable maternal condition\n- Active maternal genital herpes\n- Invasive cervical carcinoma\n- Pelvic structure deformities\n- Previous uterine rupture\n\n**Maternal-fetal:**\n- Placenta previa or vasa previa\n- Cord prolapse or cord presentation\n\n**Fetal:**\n- Fetal distress (abnormal FHR tracing) or malpresentation\n\nContraindications to IOL are generally those that preclude vaginal delivery or would increase risk of uterine rupture. Classical uterine incisions carry a 4-9% rupture risk with labour (vs. ~0.5-0.8% for low transverse), making them a contraindication. Placenta previa risks catastrophic hemorrhage with cervical changes."
    difficulty: easy
    tags: [obstetrics, induction of labour, contraindications]
  - front: "What methods are used for cervical ripening?"
    back: "**Mechanical:**\n- Foley catheter placement: first-line when feasible; preferred for outpatient ripening\n- Cook's catheter\n\n**Pharmacologic:**\n- Intravaginal PGE2 gel (Prostin®): long and closed cervix; 6-12h, up to 3 doses\n- Intravaginal PGE2 insert (Cervidil®): continuous release; assess at 12h and 24h; can be removed if needed; advantage: oxytocin can start 30 min after removal (vs. 6h after gel)\n- Intravaginal misoprostol/PGE1 (Cytotec®): long and closed cervix; inexpensive; more effective than PGE2; oxytocin can start 4h after insertion; **contraindicated in 3rd trimester with prior CD**\n\n**Note:** Oxytocin alone is NOT effective for cervical ripening\n\nCervical ripening is required when Bishop score is <6. Foley catheter is preferred for outpatient management and is not associated with uterine hyperstimulation. Misoprostol (PGE1) is more effective than PGE2 for achieving vaginal delivery but is contraindicated with prior CD due to increased uterine rupture risk. The timing intervals before starting oxytocin after prostaglandins are clinically important."
    difficulty: medium
    tags: [obstetrics, cervical ripening, prostaglandins, misoprostol, Foley catheter, induction]
  - front: "What is amniotomy and when is it used for induction?"
    back: "Amniotomy = artificial rupture of membranes (AROM) to stimulate prostaglandin synthesis and secretion.\n\n**Prerequisites:** Cervix dilated and soft, membranes can be felt, head well applied to cervix.\n\n**Amniotomy + IV oxytocin together:** More patients delivered vaginally at 24h than amniotomy alone (RR=0.03) with fewer instrumental deliveries (RR=5.5).\n\n**Amniotomy alone:** Limited evidence for effectiveness.\n\nAmniotomy stimulates prostaglandin release from decidua and membranes, promoting labour. It is most effective when combined with oxytocin augmentation. Risks include cord prolapse (especially if head not engaged), chorioamnionitis (especially with prolonged rupture), and fetal heart rate changes. Ensuring the presenting part is well-applied to the cervix before amniotomy reduces cord prolapse risk."
    difficulty: easy
    tags: [obstetrics, amniotomy, induction, AROM, artificial rupture of membranes]
  - front: "What are the dosing and potential complications of oxytocin for induction/augmentation?"
    back: "**Dosing:** 10 U in 1 L normal saline; start at 0.5-2 mU/min IV; increase by 1-2 mU/min every 20-60 min\n- Reassess at 20 mU/min; use minimum dose for active labour\n- Half-life: 3-5 minutes\n\n**Timing after prostaglandins:**\n- ≥30 min after Cervidil® removal\n- ≥6h after PGE2 gel insertion\n- ≥4h after PGE1 (misoprostol) insertion\n\n**Complications:**\n- Tachysystole/tetanic contraction → fetal distress or uterine rupture\n- Uterine muscle fatigue → uterine atony → PPH\n- Vasopressin-like action → anti-diuresis (water intoxication)\n- Caution with previous CD or uterine surgery\n\nOxytocin is a synthetic version of the natural neurohypophyseal hormone. Its short half-life (3-5 min) allows rapid titration. Tachysystole is defined as >5 contractions in 10 minutes averaged over 30 minutes and requires dose reduction or discontinuation. The vasopressin-like action can cause hyponatremia with large volumes of hypotonic solution."
    difficulty: medium
    tags: [obstetrics, oxytocin, induction, augmentation, tachysystole, complications]
  - front: "A woman at 38 weeks gestation is admitted with a Bishop score of 3. What are the appropriate cervical ripening options?"
    back: "A Bishop score of 3 indicates an unfavourable cervix requiring cervical ripening before induction. Options:\n1. **Foley catheter** (mechanical): first-line when feasible; preferred for outpatient management; no risk of hyperstimulation\n2. **Intravaginal PGE2 gel (Prostin®):** 6-12h, up to 3 doses\n3. **Intravaginal PGE2 insert (Cervidil®):** Controlled release; can be removed if hyperstimulation occurs; wait ≥30 min before starting oxytocin\n4. **Misoprostol/PGE1 (Cytotec®):** More effective than PGE2; inexpensive; wait ≥4h before oxytocin; **AVOID if prior CD**\n\nOxytocin alone is NOT effective for cervical ripening.\n\nA Bishop score <6 (especially <3) indicates an unfavourable cervix with low likelihood of successful induction. Cervical ripening agents work by softening, effacing, and dilating the cervix to achieve a favourable Bishop score before oxytocin induction. The choice depends on outpatient vs. inpatient management, prior uterine surgery, and available resources."
    difficulty: medium
    tags: [obstetrics, cervical ripening, Bishop score, induction, unfavourable cervix]
  - front: "What are the key findings of the ARRIVE trial and their implications for clinical practice?"
    back: "**ARRIVE Trial (NEJM 2018):** Elective induction of labour between 39+0 and 40+6 weeks GA in low-risk nulliparous women\n\n**Results:**\n- No increase in adverse perinatal outcomes (perinatal death or severe neonatal complications: 4.3% IOL vs. 5.4% expectant management — not statistically significant)\n- **Significant reduction in CD:** 18.6% (IOL) vs. 22.3% (expectant management), RR 0.84, 95% CI 0.76-0.93, p<0.001\n- No significant differences in other secondary outcomes\n\n**Implications:** Elective IOL at 39+0-41+0 weeks does NOT increase adverse perinatal outcomes and reduces CD rates → supports offering IOL to low-risk nulliparous women at 39 weeks\n\nThe ARRIVE trial challenged the traditional belief that elective induction increases CD rates. The counter-intuitive result (IOL reducing CD) may be explained by the fact that the alternative is expectant management to ≥40 weeks, during which CD risk accumulates. These findings support offering IOL at 39 weeks to low-risk nulliparous women who desire it, while maintaining that it should not be mandated."
    difficulty: hard
    tags: [obstetrics, ARRIVE trial, induction of labour, elective IOL, evidence-based medicine]
