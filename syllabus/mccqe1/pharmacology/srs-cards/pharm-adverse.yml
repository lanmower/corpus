# Adverse Drug Reactions & Interactions (Pharmacology) - generated from srs-mccqe1
cards:
  - front: "A patient on amiodarone develops hypothyroidism 8 months after starting the drug. What is the mechanism?"
    back: "Amiodarone contains 37% iodine by weight; chronic iodine excess inhibits thyroid hormone synthesis (Wolff-Chaikoff effect) → hypothyroidism (more common); or stimulates excess production → thyrotoxicosis (amiodarone-induced thyroiditis type 2)\n\nAmiodarone-induced thyroid dysfunction (AITD) occurs in 15–20% of patients. Monitor TFTs every 6 months. Hypothyroidism (more common): treat with levothyroxine while continuing amiodarone. Hyperthyroidism: may require amiodarone discontinuation, methimazole, or steroids."
    difficulty: medium
    tags: [amiodarone, thyroid, Wolff-Chaikoff, hypothyroidism, adverse-effects]
  - front: "What is serotonin syndrome and which drug combinations most commonly cause it?"
    back: "Potentially life-threatening condition from excess serotonergic activity: triad of agitation, autonomic instability, and neuromuscular abnormalities (clonus, hyperreflexia, diaphoresis); most common causes: SSRI + MAOI, SSRI + tramadol, SSRI + linezolid\n\nSerotonin syndrome vs. NMS: onset is rapid (hours) with clonus and hyperreflexia (vs. NMS: days, rigidity, bradyreflexia). Treatment: stop offending agents, cyproheptadine (5-HT antagonist), benzodiazepines, supportive care; severe: ICU, intubation."
    difficulty: hard
    tags: [serotonin-syndrome, SSRI, MAOI, clonus, cyproheptadine]
  - front: "A patient on phenytoin develops nystagmus, ataxia, and confusion. What is the explanation?"
    back: "Phenytoin toxicity — dose-dependent CNS adverse effects in order of severity: nystagmus (early), ataxia, slurred speech, drowsiness, confusion, coma (severe)\n\nPhenytoin has a narrow therapeutic window (40–80 µmol/L). Non-linear (zero-order) kinetics: small dose increase can cause dramatic level increase. Monitor levels, especially with enzyme inducers/inhibitors. Also watch for gingival hyperplasia, hirsutism, and long-term use causing cerebellar atrophy."
    difficulty: medium
    tags: [phenytoin, toxicity, nystagmus, ataxia, narrow-therapeutic-index]
  - front: "Which antihypertensive class is the most common cause of drug-induced cough?"
    back: "ACE inhibitors (bradykinin-mediated dry cough in 10–15% of patients, higher in Asian patients)\n\nACEi prevent bradykinin degradation → accumulates in lungs → stimulates cough receptors. Cough is not dose-dependent and resolves within weeks of stopping. Switch to ARB (does not affect bradykinin). ARBs do not cause cough."
    difficulty: easy
    tags: [ACE-inhibitor, cough, bradykinin, adverse-effect, ARB]
  - front: "A patient on isoniazid for latent TB develops bilateral foot tingling and burning. What is the cause and treatment?"
    back: "Peripheral neuropathy due to isoniazid-induced pyridoxine (vitamin B6) deficiency; treat with pyridoxine 25–50 mg/day\n\nINH competes with pyridoxine in pyridoxal phosphate synthesis. Neuropathy risk is higher in slow acetylators, malnutrition, diabetes, and alcohol use. Pyridoxine supplementation is recommended for all patients on INH, especially high-risk groups."
    difficulty: easy
    tags: [isoniazid, peripheral-neuropathy, pyridoxine, vitamin-B6, INH]
  - front: "What is the mechanism of statin-induced myopathy and what are the risk factors?"
    back: "Inhibition of HMG-CoA reductase reduces mevalonate → decreases CoQ10 and farnesyl pyrophosphate → mitochondrial dysfunction in muscle; risk factors: high-dose statins, CYP3A4 inhibitors (e.g., clarithromycin, amiodarone, diltiazem), hypothyroidism, renal/hepatic impairment\n\nCK elevation <10× ULN with symptoms = statin myopathy; >10× ULN = myositis; rhabdomyolysis if CK >10,000 and myoglobinuria. Hydrophilic statins (rosuvastatin, pravastatin) have lower myopathy risk than lipophilic (simvastatin)."
    difficulty: medium
    tags: [statin-myopathy, rhabdomyolysis, CYP3A4, CK, HMG-CoA]
  - front: "What is QTc prolongation and which common drug classes cause it?"
    back: "Prolonged QTc (>450 ms men, >470 ms women) increases risk of torsades de pointes (TdP) and sudden cardiac death; common QTc-prolonging drugs: antipsychotics, macrolides (azithromycin, erythromycin), fluoroquinolones (ciprofloxacin), antiarrhythmics (amiodarone, sotalol), methadone, ondansetron\n\nRisk factors for TdP: baseline QTc >500 ms, hypokalemia, hypomagnesemia, bradycardia, congenital LQTS, multiple QTc-prolonging drugs. CredibleMeds (AzCERT) risk stratification database for drug-induced QTc prolongation."
    difficulty: medium
    tags: [QTc-prolongation, torsades-de-pointes, antipsychotic, macrolide, fluoroquinolone]
  - front: "A 50-year-old woman taking methotrexate for RA has a significant alcohol intake. Why is this combination especially dangerous?"
    back: "Both methotrexate and alcohol are hepatotoxic; combined use significantly increases risk of liver fibrosis and cirrhosis\n\nMethotrexate causes hepatic fibrosis, especially with cumulative doses >1.5–3 g. Alcohol >14 units/week is a relative contraindication to MTX therapy. Monitor LFTs every 4–8 weeks; liver biopsy considered if persistent LFT elevation. FibroScan (transient elastography) is a non-invasive alternative."
    difficulty: medium
    tags: [methotrexate, alcohol, hepatotoxicity, liver-fibrosis, RA]
  - front: "What is the most serious adverse effect of clozapine that requires mandatory monitoring?"
    back: "Agranulocytosis (absolute neutrophil count <0.5 × 10⁹/L) — potentially fatal; requires weekly CBC for 6 months, then biweekly, then monthly\n\nClozapine is the most effective antipsychotic for treatment-resistant schizophrenia but causes agranulocytosis in 0.8–1% of patients. Monitoring protocol: hold clozapine if ANC <1.5 × 10⁹/L; discontinue if <0.5 × 10⁹/L. Also causes myocarditis, metabolic syndrome, and seizures."
    difficulty: medium
    tags: [clozapine, agranulocytosis, ANC, CBC-monitoring, treatment-resistant-schizophrenia]
  - front: "A patient on lithium develops coarse tremor, vomiting, diarrhea, and confusion. Lithium level is 2.8 mEq/L. What is the management?"
    back: "Stop lithium, IV hydration (0.9% NaCl to increase renal clearance), and hemodialysis for severe toxicity (level >2.5 mEq/L with symptoms, or >4 mEq/L regardless of symptoms)\n\nLithium toxicity triad: GI symptoms + neurological (tremor, ataxia, confusion, seizures) + cardiovascular. Therapeutic range: 0.6–1.2 mEq/L. Toxicity precipitants: NSAIDs, thiazide diuretics, ACEi, dehydration. Narrow therapeutic index requires regular monitoring."
    difficulty: hard
    tags: [lithium-toxicity, hemodialysis, lithium-level, NSAIDs, thiazide]
  - front: "What is drug-induced lupus (DIL) and which medications most commonly cause it?"
    back: "Drug-induced SLE-like syndrome with anti-histone antibodies; most common drugs: procainamide, hydralazine, isoniazid, minocycline, TNF inhibitors (etanercept, infliximab)\n\nDIL typically resolves within weeks of stopping the drug. Anti-histone antibodies are present in >95% of DIL cases (vs. 70% of idiopathic SLE). Anti-dsDNA is rare in DIL. Symptoms: arthralgia, serositis, rash — renal and CNS involvement rare (unlike idiopathic SLE)."
    difficulty: medium
    tags: [drug-induced-lupus, anti-histone, procainamide, hydralazine, DIL]
  - front: "What is a Type A vs. Type B adverse drug reaction?"
    back: "Type A (augmented): predictable, dose-dependent, pharmacologically expected (e.g., hypoglycemia with insulin, bleeding with anticoagulants) — 80% of ADRs; Type B (bizarre): unpredictable, not dose-dependent, often immunological (e.g., penicillin anaphylaxis, SJS)\n\nType A ADRs are managed by dose reduction or drug switch. Type B (idiosyncratic, immunological) require drug discontinuation. SJS/TEN is an extreme Type B reaction. Causality assessment tools: Naranjo algorithm."
    difficulty: easy
    tags: [adverse-drug-reaction, Type-A, Type-B, idiosyncratic, Naranjo]
  - front: "What is Stevens-Johnson syndrome (SJS) and which drugs most commonly cause it?"
    back: "Severe mucocutaneous blistering reaction with <10% BSA epidermal detachment (SJS) or >30% (TEN); most common drugs: allopurinol, carbamazepine, lamotrigine, sulfonamides, nevirapine, NSAIDs\n\nSJS/TEN: admit to burn unit, stop all suspect drugs, wound care, ophthalmology consult (eye scarring), IV fluids. Cyclosporine and IVIG are used for TEN. Mortality: SJS ~5%, TEN ~30%. HLA-B*1502 (carbamazepine SJS risk in Han Chinese) genetic testing recommended."
    difficulty: hard
    tags: [Stevens-Johnson-syndrome, TEN, SJS, allopurinol, carbamazepine]
  - front: "A patient takes clarithromycin with simvastatin. What adverse drug interaction occurs and why?"
    back: "Clarithromycin inhibits CYP3A4 → increases simvastatin plasma levels dramatically → severe myopathy and rhabdomyolysis risk\n\nSimvastatin and lovastatin are extensively metabolized by CYP3A4. Co-administration with strong CYP3A4 inhibitors (clarithromycin, itraconazole, HIV PIs, amiodarone, diltiazem, grapefruit) greatly increases statin exposure. Use pravastatin or rosuvastatin (less CYP3A4 dependence) instead."
    difficulty: medium
    tags: [clarithromycin, simvastatin, CYP3A4, drug-interaction, rhabdomyolysis]
  - front: "A 68-year-old woman with AF and HFrEF (EF 28%) is started on digoxin 0.125mg daily to reduce AF-related hospitalizations. Her creatinine is 2.0 mg/dL. Three weeks later, she presents with nausea, blurred vision with yellow-green halos, bradycardia (HR 44), and a digoxin level of 2.8 nmol/L. ECG shows bidirectional VT. Which is the most appropriate management?\n\nA) Hold digoxin and administer atropine for bradycardia\nB) Administer digoxin-specific antibody fragments (Digibind/DigiFab) immediately\nC) Administer activated charcoal to reduce digoxin absorption\nD) Temporary pacing and close monitoring — digoxin toxicity resolves when drug is cleared"
    back: "B) Administer digoxin-specific antibody fragments (Digibind/DigiFab) immediately\n\nDigoxin toxicity with bidirectional VT is a life-threatening emergency. Bidirectional VT (alternating QRS axis) + bradyarrhythmias are classic manifestations of severe toxicity. Digoxin-specific antibody fragments (Digibind/DigiFab) are the antidote — they bind free digoxin and rapidly reverse toxicity including ventricular arrhythmias. Calculate dose: each vial neutralizes ~0.5 mg digoxin. In life-threatening arrhythmias (VT/VF, complete heart block), empiric dosing is acceptable. Atropine can be used for bradycardia but is insufficient in severe toxicity. Charcoal is only useful if digoxin was recently ingested. CKD slows digoxin elimination — target level ≤ 1.0 nmol/L in HF."
    difficulty: hard
    tags: [Pharmacology, MCQ, Toronto Notes]
  - front: "A 58-year-old man with NSTEMI is discharged on ticagrelor 90mg BID + aspirin 81mg. He returns at 6 weeks with a spontaneous intracranial hemorrhage (ICH). The neurologist recommends stopping all antithrombotics for at least 4 weeks. His coronary stent was placed 6 weeks ago (DES). What is the management of his antiplatelet therapy after 4 weeks of cessation?\n\nA) Restart full DAPT — 4 weeks off is insufficient; complete a full 12 months from DES\nB) Restart aspirin alone and hold ticagrelor indefinitely given high recurrent ICH risk\nC) Restart a single antiplatelet agent (P2Y12 inhibitor — clopidogrel preferred over ticagrelor) without aspirin\nD) Restart DAPT with aspirin + clopidogrel — switch ticagrelor to clopidogrel to reduce bleeding risk"
    back: "C) Restart a single antiplatelet agent (P2Y12 inhibitor — clopidogrel preferred over ticagrelor) without aspirin\n\nPost-ICH antiplatelet restart in DES patients is a high-stakes clinical dilemma. Evidence from the RESTART (aspirin after ICH) and SENTINAL data suggests: (1) After ≥4 weeks post-ICH stabilization, antiplatelet therapy should be restarted; (2) Clopidogrel monotherapy (without aspirin) has lower re-bleeding risk than DAPT while maintaining stent thrombosis protection — preferred over full DAPT post-ICH. Ticagrelor has higher antiplatelet potency and bleeding risk than clopidogrel — switching to clopidogrel reduces bleeding without significant loss of anti-ischemic efficacy. Aspirin monotherapy leaves the stent thrombosis risk higher than P2Y12 monotherapy. 2023 ESC/AHA guidance: single P2Y12 agent (clopidogrel) preferred post-ICH within first 12 months of DES."
    difficulty: hard
    tags: [Pharmacology, MCQ, Toronto Notes]
  - front: "A 72-year-old man with non-valvular AF and a CHA₂DS₂-VASc score of 5 is on rivaroxaban 20mg daily. He also takes amiodarone and atorvastatin. His eGFR is 48. Which pharmacokinetic interaction is most clinically significant in this regimen?\n\nA) Atorvastatin inhibits CYP3A4, reducing rivaroxaban levels and increasing stroke risk\nB) Amiodarone inhibits P-glycoprotein and CYP3A4, increasing rivaroxaban plasma levels and bleeding risk\nC) Rivaroxaban inhibits amiodarone metabolism, increasing amiodarone toxicity\nD) Atorvastatin competes with rivaroxaban for renal tubular secretion, increasing DOAC exposure"
    back: "B) Amiodarone inhibits P-glycoprotein and CYP3A4, increasing rivaroxaban plasma levels and bleeding risk\n\nRivaroxaban is a substrate of both P-glycoprotein (P-gp) and CYP3A4. Amiodarone is a potent dual inhibitor of P-gp AND CYP3A4. Co-administration increases rivaroxaban AUC and Cmax by 50–60%, substantially increasing bleeding risk. This interaction is clinically relevant and warrants consideration of: dose reduction (rivaroxaban 15mg in moderate renal impairment + amiodarone), switching to dabigatran (P-gp substrate only, less affected by CYP3A4) with caution, or using warfarin with INR monitoring. Apixaban (CYP3A4 substrate + minor P-gp) is similarly affected. Atorvastatin is a weak CYP3A4 substrate — not a significant perpetrator of drug interactions."
    difficulty: hard
    tags: [Pharmacology, MCQ, Toronto Notes]
  - front: "A 74-year-old man with HFrEF (EF 22%), AF (CHA₂DS₂-VASc 6), CKD stage 3b (eGFR 38), and type 2 diabetes is on apixaban, sacubitril/valsartan, bisoprolol, dapagliflozin, and eplerenone. His potassium is 5.7 mEq/L. Which of his current medications most significantly contributes to his hyperkalemia, and what is the most important management step?\n\nA) Dapagliflozin — SGLT2 inhibitors increase aldosterone release, causing hyperkalemia\nB) Apixaban — direct Xa inhibitors reduce renal potassium excretion\nC) Sacubitril/valsartan — ARB component blocks AT1R, reducing aldosterone secretion and impairing potassium excretion\nD) Bisoprolol — beta-blockade reduces transcellular potassium shift into cells"
    back: "C) Sacubitril/valsartan — ARB component blocks AT1R, reducing aldosterone secretion and impairing potassium excretion\n\nSacubitril/valsartan contains valsartan (ARB), which blocks angiotensin II-mediated aldosterone secretion via AT1R blockade → reduced aldosterone → reduced potassium excretion → hyperkalemia. Combined with eplerenone (MRA — also blocks aldosterone's effect), the synergistic reduction of aldosterone action is the primary driver of hyperkalemia. Dapagliflozin actually reduces hyperkalemia (renal potassium wasting via SGLT2 inhibition + reduced aldosterone from volume-independent mechanisms). Management: consider patiromer or SZC (potassium binders) to enable continuation of RAAS/MRA. Bisoprolol can modestly impair extrarenal potassium handling but is not the primary culprit here."
    difficulty: hard
    tags: [Pharmacology, MCQ, Toronto Notes]
  - front: "A 55-year-old woman with NYHA class III HFrEF (EF 22%) presents with volume overload. She is on torsemide 80 mg BID. Her physician wishes to add metolazone. Which pharmacokinetic property of metolazone distinguishes it from other thiazide diuretics and makes it effective in CKD?\n\nA) Metolazone undergoes hepatic metabolism only — not renally cleared\nB) Metolazone retains its action at the distal convoluted tubule even at GFR < 30, unlike HCTZ which requires adequate GFR\nC) Metolazone has a volume of distribution 10x larger than HCTZ, allowing superior tissue penetration\nD) Metolazone inhibits both Na-K-2Cl cotransporter (loop) and NCC (DCT), providing superior diuresis"
    back: "B) Metolazone retains its action at the distal convoluted tubule even at GFR < 30, unlike HCTZ which requires adequate GFR\n\nThiazide diuretics (including HCTZ and chlorthalidone) lose their diuretic efficacy when GFR falls below 30 mL/min — they require active secretion into the tubular lumen to reach their site of action (NCC in DCT), which is reduced in CKD. Metolazone, however, retains significant diuretic efficacy even in severe CKD (GFR < 30) due to a different mechanism of tubular secretion and a prolonged half-life that allows sufficient tubular concentrations. This property makes metolazone the thiazide of choice for augmentation of loop diuretics in HF with CKD. The combination causes profound natriuresis — aggressive electrolyte monitoring (K+, Mg2+, Na+) is mandatory."
    difficulty: hard
    tags: [Pharmacology, MCQ, Toronto Notes]
  - front: "What are the key drug interactions with warfarin?"
    back: "Increase INR: amiodarone, metronidazole, fluconazole, TMP-SMX, cranberry. Decrease INR: rifampin, carbamazepine, phenytoin, St John's Wort, vitamin K\n\nWarfarin metabolized by CYP2C9 (S-warfarin, more potent) and CYP3A4 (R-warfarin). Monitor INR closely with any medication change. DOACs have fewer interactions but still affected by strong CYP3A4/P-gp modulators."
    difficulty: medium
    tags: [warfarin, interactions]
  - front: "Which drugs commonly cause QT prolongation?"
    back: "Antiarrhythmics (sotalol, amiodarone), antibiotics (macrolides, fluoroquinolones), antipsychotics (haloperidol, ziprasidone), antiemetics (ondansetron), methadone\n\nQTc >500ms or increase >60ms = high risk for torsades de pointes. Torsades treatment: IV magnesium, overdrive pacing. Risk factors: hypokalemia, hypomagnesemia, female sex, bradycardia."
    difficulty: medium
    tags: [QT prolongation, drugs]
  - front: "Which drugs commonly cause QT prolongation and what is the risk?"
    back: "Antiarrhythmics (sotalol, amiodarone, procainamide), antipsychotics (haloperidol, ziprasidone), antibiotics (macrolides, fluoroquinolones, azole antifungals), antiemetics (ondansetron, domperidone), methadone, TCAs\n\nQTc >500ms or increase >60ms from baseline: high risk of Torsades de Pointes. Risk factors: female sex, hypokalemia, hypomagnesemia, bradycardia, structural heart disease, multiple QT-prolonging drugs. Monitor ECG, maintain K>4.0, Mg>0.8. Torsades treatment: IV magnesium 2g, overdrive pacing."
    difficulty: hard
    tags: [QT prolongation, Torsades, drug safety]
  - front: "What are the major drug interactions with warfarin?"
    back: "Increase INR (bleeding risk): amiodarone, azole antifungals, macrolides, metronidazole, TMP-SMX, SSRIs, cranberry. Decrease INR (clot risk): rifampin, carbamazepine, phenytoin, St John Wort, vitamin K-rich foods\n\nWarfarin is metabolized by CYP2C9. Amiodarone is the most clinically significant (reduce warfarin dose by 30-50%). Always check interactions when starting new medications. Acetaminophen at high doses increases INR. Bridges should be monitored closely."
    difficulty: hard
    tags: [warfarin, drug interactions, CYP2C9]
  - front: "What are the common and serious adverse effects of statins?"
    back: "Common: myalgia (5-10%), GI. Serious: rhabdomyolysis (rare, CK>10x ULN with renal failure), hepatotoxicity (check LFTs at baseline), new-onset diabetes (slight increase). Drug interactions: CYP3A4 inhibitors increase statin levels\n\nMyalgia: try different statin, lower dose, intermittent dosing. Do not routinely monitor CK unless symptomatic. Statin + fibrate (especially gemfibrozil): increased rhabdomyolysis risk. Rosuvastatin and pravastatin have fewer CYP interactions. Benefits far outweigh risks in indicated patients."
    difficulty: medium
    tags: [statin, adverse effects, rhabdomyolysis]
  - front: "What drugs require renal dose adjustment and what are the consequences of not adjusting?"
    back: "Key drugs: metformin (stop eGFR<30), DOACs (adjust doses), gabapentin/pregabalin, lithium, digoxin, opioids (morphine metabolites accumulate), aminoglycosides, vancomycin, allopurinol\n\nFailure to adjust: drug accumulation, toxicity, prolonged effects. Check eGFR before prescribing and periodically. CKD patients: avoid NSAIDs, avoid gadolinium if eGFR<30, use low-osmolar contrast with hydration if CT needed. Pharmacist medication review for CKD patients."
    difficulty: hard
    tags: [renal dosing, CKD, drug adjustment]
  - front: "What is serotonin syndrome: common drug combinations and management?"
    back: "Combinations: SSRI + MAOI (most dangerous), SSRI + tramadol, SSRI + linezolid (MAOI activity), SSRI + triptans (rare). Clinical: altered mental status + neuromuscular hyperactivity (clonus) + autonomic instability\n\nTreatment: stop offending agents, benzodiazepines for agitation, cyproheptadine 12mg then 4mg q6h, cooling for hyperthermia. Avoid succinylcholine (hyperkalemia from rigidity). Usually resolves within 24-72h of drug cessation. Prevention: check combinations before prescribing."
    difficulty: hard
    tags: [serotonin syndrome, drug interactions, SSRI]
  - front: "What are the high-risk medications in elderly patients (Beers Criteria highlights)?"
    back: "Avoid: benzodiazepines (falls, confusion), anticholinergics (cognitive impairment - oxybutynin, diphenhydramine, TCA), long-acting sulfonylureas (hypoglycemia), meperidine (seizures), NSAIDs chronically (GI/renal/CV)\n\nAnticholinergic burden calculator: score cumulative anticholinergic load. First-gen antihistamines, antispasmodics, TCAs, antipsychotics all contribute. Each additional anticholinergic associated with 20% increase in cognitive decline. Regular medication review in elderly is essential."
    difficulty: hard
    tags: [Beers criteria, elderly, anticholinergic]
  - front: "What drugs commonly cause hyponatremia?"
    back: "SIADH-causing: SSRIs (most common drug cause), carbamazepine, oxcarbazepine, cyclophosphamide, desmopressin. Thiazide diuretics (not loops). Ecstasy/MDMA. Oxytocin\n\nSSRI-induced hyponatremia: usually within first 2 weeks, elderly and low BMI at highest risk. Check Na at 1-2 weeks when starting SSRI in elderly. Thiazides: impair diluting ability. Loop diuretics rarely cause hyponatremia (impair concentrating). Discontinue offending agent."
    difficulty: medium
    tags: [hyponatremia, SIADH, drug-induced]
  - front: "What are the important drug interactions with CYP3A4?"
    back: "Inhibitors (increase levels of substrates): azole antifungals, macrolides (NOT azithromycin), grapefruit, diltiazem, verapamil, HIV PIs. Inducers (decrease levels): rifampin, carbamazepine, phenytoin, phenobarbital, St John Wort\n\nCYP3A4 substrates: statins (simvastatin/atorvastatin), CCBs, cyclosporine, tacrolimus, DOACs, benzodiazepines (midazolam), opioids (fentanyl). Simvastatin + azole antifungal = rhabdomyolysis risk. Always check CYP interactions when prescribing. Use interaction checker tools."
    difficulty: hard
    tags: [CYP3A4, drug interactions, pharmacology]
  - front: "What is drug-induced liver injury (DILI) and what drugs commonly cause it?"
    back: "Hepatocellular (ALT elevation): acetaminophen, INH, statins, NSAIDs, anticonvulsants. Cholestatic (ALP/bilirubin): amox-clav, erythromycin, anabolic steroids, OCPs. Mixed: phenytoin, TMP-SMX, azathioprine\n\nDILI is diagnosis of exclusion. Hy's Law: hepatocellular + bilirubin >2x ULN = 10-50% mortality from liver failure. Causality assessment: RUCAM scale. Stop offending drug. Most resolve with cessation. NAC for acetaminophen. Report to Health Canada MedEffect program."
    difficulty: hard
    tags: [DILI, hepatotoxicity, drug-induced]
  - front: "What are drug-induced causes of acute kidney injury?"
    back: "Pre-renal: NSAIDs (afferent constriction), ACEi/ARB (efferent dilation), diuretics. Intrinsic: aminoglycosides (ATN), vancomycin, cisplatin, contrast nephropathy, NSAIDs (interstitial nephritis), PPIs (interstitial). Post-renal: anticholinergics (retention)\n\nPrevention: avoid nephrotoxins, hydrate before contrast, hold ACEi/ARB/diuretics during illness (sick day rules), therapeutic drug monitoring for aminoglycosides/vancomycin. Allergic interstitial nephritis: eosinophils in urine, rash, fever, eosinophilia. Stop drug, consider steroids."
    difficulty: hard
    tags: [drug-induced AKI, nephrotoxicity]
  - front: "What drugs commonly cause drug-induced lupus, and which drugs cause Stevens-Johnson syndrome?"
    back: "DIL: hydralazine, procainamide, INH, minocycline, TNFi. SJS/TEN: allopurinol (most common), carbamazepine/phenytoin/lamotrigine, sulfonamides (TMP-SMX), nevirapine\n\nSJS: <10% BSA detachment. SJS/TEN overlap: 10-30%. TEN: >30%. Mortality TEN: 25-30%. HLA-B*5801 testing before allopurinol in Southeast Asian/African descent reduces SJS risk. HLA-B*1502 testing before carbamazepine in Asian descent."
    difficulty: hard
    tags: [drug-induced lupus, SJS/TEN, adverse reactions]
  - front: "What are the risks and monitoring for methotrexate therapy?"
    back: "Adverse effects: myelosuppression (CBC), hepatotoxicity (LFTs), pneumonitis (cough/dyspnea), mucositis, teratogenic. Monitor: CBC + LFTs + creatinine q4-8 weeks. Give folic acid 1mg daily to reduce toxicity. Avoid in pregnancy, significant renal/liver disease\n\nMTX is cleared renally - dose-reduce or avoid in CKD. Drug interactions: TMP-SMX increases MTX toxicity (folate antagonism), NSAIDs increase MTX levels (reduced renal clearance). Hold MTX during serious infection. Interstitial pneumonitis: stop MTX, may need steroids."
    difficulty: hard
    tags: [methotrexate, adverse effects, monitoring]
  - front: "What are the adverse effects of chronic corticosteroid therapy?"
    back: "Metabolic: diabetes, dyslipidemia, weight gain, adrenal suppression. MSK: osteoporosis, AVN, myopathy. GI: PUD (with NSAIDs). Immune: infections. CNS: insomnia, psychosis, mood. Skin: thin skin, bruising. Eye: cataracts, glaucoma\n\nIf >7.5mg prednisone x3months: bone protection (calcium, vitamin D, bisphosphonate if high fracture risk). Monitor glucose, BP, lipids. Taper gradually if >2-3 weeks (adrenal suppression). Stress dose steroids for illness/surgery. PPI co-prescribe if concurrent NSAIDs."
    difficulty: medium
    tags: [corticosteroid, adverse effects, osteoporosis]
  - front: "What drugs cause hyperkalemia and how is it managed?"
    back: "Drugs: ACEi/ARB, K-sparing diuretics (spironolactone, amiloride), TMP-SMX, NSAIDs, heparin, calcineurin inhibitors, succinylcholine. Risk factors: CKD, diabetes, concurrent use of multiple K-raising drugs\n\nK>6.5 or ECG changes (peaked T, wide QRS, sine wave): emergency. Calcium gluconate (cardiac membrane stabilizer), insulin 10U + D50 (shift), salbutamol (shift), kayexalate/patiromer (excretion), hemodialysis. Monitor K when starting ACEi+spironolactone combination."
    difficulty: hard
    tags: [hyperkalemia, drug-induced, management]
  - front: "What is the approach to adverse drug reaction reporting in Canada?"
    back: "Report to Health Canada via MedEffect (online or phone). Report: serious reactions, unexpected reactions, reactions to new drugs/biologics/natural health products. Also report vaccine adverse events (CAEFISS). Reporting is voluntary for clinicians, mandatory for manufacturers\n\nPost-market surveillance depends on clinician reporting. Under-reporting is estimated at 90-95%. Special focus: new medications (within 5 years of market), biologics, and natural health products. Reporting contributes to safety signals that may lead to drug warnings or withdrawal."
    difficulty: easy
    tags: [adverse drug reaction, MedEffect, reporting]
  - front: "Which CYP450 enzyme is responsible for metabolizing approximately 50% of all clinically used drugs, and name three potent inhibitors of this enzyme."
    back: "CYP3A4 metabolizes ~50% of drugs. Potent inhibitors include ketoconazole, itraconazole, ritonavir, clarithromycin, and grapefruit juice.\n\nCYP3A4 is the most abundant CYP enzyme in the liver and intestine. Inhibition leads to increased levels of substrates such as cyclosporine, statins (simvastatin, atorvastatin), and calcium channel blockers, risking toxicity. Ritonavir is intentionally used as a pharmacokinetic booster in HIV therapy."
    difficulty: medium
    tags: [CYP450, CYP3A4, drug metabolism, enzyme inhibitors, pharmacokinetics]
  - front: "CYP2D6 is subject to genetic polymorphism. What clinical consequences arise in poor metabolizers taking codeine, and what about ultrarapid metabolizers?"
    back: "Poor metabolizers cannot convert codeine to morphine, resulting in no analgesic effect. Ultrarapid metabolizers produce excessive morphine, risking respiratory depression and death (especially in children).\n\nCodeine is a prodrug activated by CYP2D6 to morphine. Health Canada issued warnings about codeine use in children after fatalities in ultrarapid metabolizers post-tonsillectomy. CYP2D6 poor metabolizer prevalence is ~7-10% in Caucasians."
    difficulty: hard
    tags: [CYP2D6, codeine, pharmacogenomics, poor metabolizer, ultrarapid metabolizer]
  - front: "Name four potent CYP3A4 inducers and explain the clinical consequence of enzyme induction on oral contraceptive pills."
    back: "CYP3A4 inducers: rifampin, carbamazepine, phenytoin, St. John's wort. Induction increases OCP metabolism, reducing estrogen/progesterone levels and causing contraceptive failure.\n\nEnzyme induction takes days to weeks to develop and resolve, as it requires new protein synthesis. Rifampin is the most potent inducer and can reduce OCP efficacy by up to 50%. Patients on these inducers need alternative or supplemental contraception."
    difficulty: medium
    tags: [CYP3A4, enzyme inducers, rifampin, oral contraceptives, drug interaction]
  - front: "CYP2C19 has clinically important polymorphisms affecting which commonly prescribed GI drug? What is the consequence in poor metabolizers?"
    back: "Clopidogrel is a prodrug activated by CYP2C19. Poor metabolizers have reduced conversion to the active metabolite, leading to diminished antiplatelet effect and increased risk of cardiovascular events. Proton pump inhibitors (especially omeprazole) are also CYP2C19 substrates.\n\nCYP2C19 poor metabolizer status is more common in East Asian populations (~15-20%). The FDA recommends considering alternative antiplatelet agents (prasugrel, ticagrelor) in CYP2C19 poor metabolizers. Omeprazole inhibits CYP2C19 and may further reduce clopidogrel activation."
    difficulty: hard
    tags: [CYP2C19, clopidogrel, pharmacogenomics, antiplatelet, PPI interaction]
  - front: "CYP2C9 metabolizes warfarin. What happens when a patient on warfarin is started on fluconazole (a CYP2C9 inhibitor)?"
    back: "Fluconazole inhibits CYP2C9, decreasing warfarin metabolism, leading to supratherapeutic INR and increased bleeding risk. INR must be monitored closely and warfarin dose reduced.\n\nS-warfarin (the more potent enantiomer) is primarily metabolized by CYP2C9. Other CYP2C9 inhibitors include amiodarone, metronidazole, and TMP-SMX. Genetic variants CYP2C9*2 and *3 also reduce warfarin metabolism, requiring lower maintenance doses."
    difficulty: medium
    tags: [CYP2C9, warfarin, fluconazole, INR, bleeding risk]
  - front: "A patient on tacrolimus (CYP3A4 substrate) is prescribed clarithromycin for pneumonia. What drug interaction should you anticipate and how should you manage it?"
    back: "Clarithromycin inhibits CYP3A4, causing tacrolimus levels to rise dramatically, risking nephrotoxicity. Either use azithromycin (minimal CYP inhibition) or reduce tacrolimus dose and monitor drug levels closely.\n\nTacrolimus has a narrow therapeutic index and is highly dependent on CYP3A4 metabolism. Macrolide antibiotics vary in CYP inhibition: clarithromycin and erythromycin are potent inhibitors; azithromycin has negligible CYP3A4 inhibition and is the safer choice."
    difficulty: hard
    tags: [CYP3A4, tacrolimus, clarithromycin, nephrotoxicity, transplant]
  - front: "Which CYP450 enzyme is inhibited by cimetidine and ciprofloxacin, and what is a clinically important substrate affected?"
    back: "Cimetidine inhibits multiple CYP enzymes (1A2, 2D6, 3A4). Ciprofloxacin inhibits CYP1A2. Theophylline (CYP1A2 substrate) levels can rise to toxic levels, causing seizures and arrhythmias.\n\nCYP1A2 also metabolizes caffeine, clozapine, and olanzapine. Smoking induces CYP1A2, so smoking cessation can raise clozapine levels dangerously. Ciprofloxacin should be avoided in patients on theophylline; use levofloxacin instead."
    difficulty: hard
    tags: [CYP1A2, cimetidine, ciprofloxacin, theophylline, drug interaction]
  - front: "A patient who smokes heavily is stabilized on clozapine. They quit smoking. What pharmacokinetic change occurs and what is the risk?"
    back: "Smoking induces CYP1A2. Cessation removes induction, causing clozapine levels to rise by 50-70%, risking sedation, seizures, and agranulocytosis. Clozapine dose must be reduced by ~30-50% upon smoking cessation.\n\nPolycyclic aromatic hydrocarbons in smoke (not nicotine) induce CYP1A2. This interaction also applies to olanzapine. Nicotine replacement therapy does not cause this enzyme induction, so the interaction occurs specifically with smoking cessation, not with starting NRT."
    difficulty: hard
    tags: [CYP1A2, clozapine, smoking, enzyme induction, pharmacokinetics]
  - front: "Which commonly used drugs require dose adjustment in renal failure (GFR <30 mL/min)? Name at least five."
    back: "Metformin (contraindicated GFR <30), gabapentin, pregabalin, digoxin, aminoglycosides (gentamicin, tobramycin), vancomycin, lithium, allopurinol, ACE inhibitors/ARBs (monitor K+), enoxaparin, and DOACs (dabigatran, rivaroxaban).\n\nRenally cleared drugs accumulate in renal failure, increasing toxicity risk. Metformin is contraindicated below GFR 30 due to lactic acidosis risk. Aminoglycosides and vancomycin require therapeutic drug monitoring. Gabapentin dose must be reduced significantly (e.g., from 300mg TID to 300mg daily at GFR <15)."
    difficulty: medium
    tags: [renal dosing, GFR, metformin, aminoglycosides, drug adjustment]
  - front: "A patient with CKD stage 4 (GFR 20 mL/min) has gout. Why is colchicine dangerous and what dose adjustment is needed for allopurinol?"
    back: "Colchicine accumulates in renal failure, causing life-threatening toxicity (pancytopenia, multi-organ failure). Allopurinol starting dose should be reduced to 50-100 mg daily (normally 100-300 mg) and titrated slowly based on uric acid levels.\n\nColchicine has a narrow therapeutic index and renal clearance accounts for 10-20% of elimination; however, accumulation of active metabolites is clinically significant. Concurrent use of CYP3A4 inhibitors (clarithromycin) with colchicine in renal failure has caused deaths. Febuxostat is an alternative that does not require renal dose adjustment."
    difficulty: hard
    tags: [renal failure, colchicine, allopurinol, gout, dose adjustment]
  - front: "At what GFR threshold should metformin be discontinued, and what is the feared complication?"
    back: "Metformin should be dose-reduced at GFR <45 mL/min (max 1000 mg/day) and discontinued at GFR <30 mL/min. The feared complication is lactic acidosis, though this is rare.\n\nDiabetes Canada 2018 guidelines updated the threshold from the older eGFR <60 cutoff. Metformin should also be held before iodinated contrast procedures in patients with GFR <45 and restarted 48 hours after if renal function is stable. Metformin-associated lactic acidosis (MALA) carries >50% mortality."
    difficulty: medium
    tags: [metformin, renal failure, GFR, lactic acidosis, diabetes]
  - front: "A patient with GFR 25 mL/min on dabigatran develops major bleeding. What are the concerns and what is the antidote?"
    back: "Dabigatran is 80% renally cleared and accumulates significantly in renal failure (contraindicated if GFR <30). Antidote: idarucizumab (Praxbind) 5g IV, which specifically reverses dabigatran. For rivaroxaban/apixaban: andexanet alfa.\n\nDOACs require renal function assessment before prescribing. Dabigatran is the most renally dependent DOAC. Rivaroxaban and apixaban have lower renal clearance (~33% and ~27%) but still need dose reduction in moderate renal impairment. Dialysis can remove dabigatran but not the factor Xa inhibitors."
    difficulty: hard
    tags: [dabigatran, renal failure, idarucizumab, DOAC, bleeding]
  - front: "Which drugs are hepatotoxic and should be avoided or used with extreme caution in hepatic failure?"
    back: "Acetaminophen (reduced threshold in liver disease), methotrexate, isoniazid, valproic acid, amiodarone, statins (monitor LFTs), azathioprine, and ketoconazole. Avoid NSAIDs (GI bleeding risk with varices, renal effects in cirrhosis).\n\nIn cirrhosis, reduced hepatic blood flow and decreased CYP enzyme activity impair drug metabolism. Child-Pugh score guides dose adjustments. NSAIDs are particularly dangerous in cirrhosis due to impaired prostaglandin-mediated renal perfusion and increased GI bleeding risk from portal hypertension."
    difficulty: medium
    tags: [hepatotoxicity, liver failure, acetaminophen, cirrhosis, drug safety]
  - front: "How does the Child-Pugh classification guide drug dosing in hepatic impairment?"
    back: "Child-Pugh A (mild): usually no adjustment. Child-Pugh B (moderate): reduce dose of hepatically metabolized drugs by 25-50%. Child-Pugh C (severe): avoid hepatically metabolized drugs when possible or reduce by 50-75%. Parameters: bilirubin, albumin, INR, ascites, encephalopathy.\n\nUnlike renal dosing (GFR provides a quantitative guide), hepatic dosing is less precise because no single test reliably predicts drug clearance. Child-Pugh combines five parameters to estimate hepatic reserve. Many drug monographs provide Child-Pugh-specific dosing recommendations."
    difficulty: medium
    tags: [Child-Pugh, hepatic impairment, dose adjustment, cirrhosis, pharmacokinetics]
  - front: "Why are benzodiazepines dangerous in hepatic failure, and which benzodiazepines are safer in liver disease?"
    back: "Most benzodiazepines undergo hepatic oxidation (CYP-dependent), which is impaired in liver disease, causing accumulation and precipitating hepatic encephalopathy. Safer options: lorazepam, oxazepam, temazepam (LOT) — they undergo glucuronidation, which is preserved in liver disease.\n\nThe mnemonic 'LOT' (Lorazepam, Oxazepam, Temazepam) identifies benzodiazepines metabolized by phase II conjugation (glucuronidation) rather than phase I oxidation. Diazepam and midazolam have active metabolites that accumulate in liver failure. Benzodiazepines can worsen or precipitate hepatic encephalopathy."
    difficulty: medium
    tags: [benzodiazepines, hepatic failure, LOT, glucuronidation, hepatic encephalopathy]
  - front: "Which drugs are known teratogens and absolutely contraindicated in pregnancy?"
    back: "Warfarin (nasal hypoplasia, stippled epiphyses, CNS defects), isotretinoin (craniofacial, cardiac, CNS defects), valproic acid (neural tube defects), methotrexate (limb and craniofacial defects), ACE inhibitors/ARBs (renal dysgenesis, oligohydramnios in 2nd/3rd trimester), thalidomide (phocomelia).\n\nHealth Canada mandates pregnancy prevention programs for isotretinoin (iPLEDGE equivalent). Valproic acid carries a 1-2% neural tube defect risk (10x baseline). All women of reproductive age on valproate should take high-dose folic acid (5 mg/day) if alternatives are not possible."
    difficulty: medium
    tags: [teratogens, pregnancy, warfarin, isotretinoin, valproic acid, ACE inhibitors]
  - front: "A pregnant patient requires anticoagulation for a mechanical heart valve. Warfarin is teratogenic. What is the safe alternative?"
    back: "Low-molecular-weight heparin (LMWH, e.g., enoxaparin) or unfractionated heparin (UFH). Neither crosses the placenta. LMWH is preferred for most of pregnancy; some guidelines recommend warfarin in the 2nd trimester only for high-risk mechanical valves.\n\nWarfarin crosses the placenta and causes warfarin embryopathy (weeks 6-12: nasal hypoplasia, stippled epiphyses) and CNS defects (any trimester). DOACs are contraindicated in pregnancy (insufficient safety data). LMWH requires dose adjustment as pregnancy progresses due to increased volume of distribution."
    difficulty: hard
    tags: [pregnancy, anticoagulation, LMWH, warfarin, mechanical valve, teratogen]
  - front: "A woman with epilepsy on valproic acid is planning pregnancy. What should you do?"
    back: "Switch to a safer antiepileptic (lamotrigine or levetiracetam) before conception if seizure control allows. If valproate cannot be stopped, use the lowest effective dose and prescribe high-dose folic acid 5 mg/day (started 3 months pre-conception).\n\nValproate has the highest teratogenic risk among antiepileptics: 10% major malformation rate (NTDs, cardiac defects, hypospadias) and dose-dependent neurodevelopmental effects (lower IQ). Lamotrigine and levetiracetam have the best safety profiles in pregnancy among antiepileptics."
    difficulty: hard
    tags: [valproic acid, pregnancy, epilepsy, folic acid, lamotrigine, teratogen]
  - front: "Which antibiotics are safe in pregnancy and which must be avoided?"
    back: "Safe: penicillins, cephalosporins, azithromycin, erythromycin (not estolate). Avoid: tetracyclines (teeth discoloration, bone growth), fluoroquinolones (cartilage damage), TMP-SMX (1st trimester: folate antagonist; 3rd trimester: kernicterus), aminoglycosides (ototoxicity), metronidazole (controversial in 1st trimester, generally considered safe).\n\nPenicillins and cephalosporins are category B and have the most safety data in pregnancy. Nitrofurantoin is generally safe but avoided near term (hemolytic anemia in G6PD-deficient neonates). Fluoroquinolones are avoided due to animal data showing cartilage damage, though human risk may be low."
    difficulty: medium
    tags: [pregnancy, antibiotics, tetracyclines, penicillins, drug safety]
  - front: "A pregnant patient at 30 weeks with chronic hypertension is on an ACE inhibitor. What is the risk and what antihypertensive should replace it?"
    back: "ACE inhibitors and ARBs in 2nd/3rd trimester cause fetal renal dysgenesis, oligohydramnios, pulmonary hypoplasia, and skull ossification defects. Safe alternatives: labetalol (first-line in Canada), nifedipine, or methyldopa.\n\nACEi/ARBs are relatively safe in the 1st trimester but must be discontinued as soon as pregnancy is confirmed. Labetalol is the preferred antihypertensive in pregnancy per SOGC guidelines. Atenolol is avoided (associated with fetal growth restriction). Methyldopa has the longest safety record in pregnancy."
    difficulty: medium
    tags: [ACE inhibitors, pregnancy, hypertension, labetalol, teratogen, SOGC]
  - front: "A patient on simvastatin 40 mg is prescribed clarithromycin for a respiratory infection. What is the risk and how should it be managed?"
    back: "Clarithromycin inhibits CYP3A4, dramatically increasing simvastatin levels, risking rhabdomyolysis. Management: temporarily hold simvastatin during clarithromycin course, or use azithromycin instead (no CYP3A4 inhibition).\n\nSimvastatin and lovastatin are the most susceptible statins to CYP3A4 interactions. Atorvastatin is also a CYP3A4 substrate but less affected. Rosuvastatin and pravastatin are NOT CYP3A4 substrates and are safer with CYP3A4 inhibitors. Rhabdomyolysis presents with myalgias, dark urine, and elevated CK."
    difficulty: hard
    tags: [statins, clarithromycin, rhabdomyolysis, CYP3A4, drug interaction]
  - front: "Why is the combination of an SSRI with a monoamine oxidase inhibitor (MAOI) contraindicated? What is the required washout period?"
    back: "SSRI + MAOI causes serotonin syndrome (potentially fatal hyperthermia, rigidity, autonomic instability). Washout: stop SSRI 2 weeks before starting MAOI (5 weeks for fluoxetine due to long half-life of norfluoxetine). Stop MAOI 2 weeks before starting SSRI.\n\nMAOIs prevent serotonin degradation while SSRIs block reuptake, causing massive synaptic serotonin accumulation. Fluoxetine requires a 5-week washout due to its active metabolite norfluoxetine (half-life 4-16 days). This is a common exam question testing knowledge of dangerous drug combinations."
    difficulty: hard
    tags: [SSRI, MAOI, serotonin syndrome, washout period, drug interaction]
  - front: "A patient on methotrexate for rheumatoid arthritis is prescribed TMP-SMX for a UTI. What is the dangerous interaction?"
    back: "TMP-SMX inhibits renal tubular secretion of methotrexate AND both drugs are folate antagonists. Combined use causes methotrexate toxicity: pancytopenia, mucositis, hepatotoxicity, and potentially fatal bone marrow suppression.\n\nThis combination has caused deaths and is considered a contraindicated pair. TMP-SMX also displaces methotrexate from protein binding. Alternative antibiotics for UTI in methotrexate patients include nitrofurantoin or cephalexin. If TMP-SMX is unavoidable, hold methotrexate and monitor CBC closely."
    difficulty: hard
    tags: [methotrexate, TMP-SMX, folate antagonist, pancytopenia, drug interaction]
  - front: "A patient on lithium for bipolar disorder starts ibuprofen for knee pain. What happens to lithium levels and why?"
    back: "NSAIDs reduce renal prostaglandin synthesis, decreasing GFR and lithium clearance, causing lithium levels to rise by 15-50%. Risk of lithium toxicity (tremor, ataxia, renal failure, seizures). Use acetaminophen instead or monitor lithium levels closely.\n\nLithium has a very narrow therapeutic index (0.6-1.2 mmol/L). Other drugs that increase lithium levels: thiazide diuretics, ACE inhibitors, and dehydration. Sulindac may have less effect on renal prostaglandins but is not guaranteed safe. Patients on lithium should avoid NSAIDs when possible."
    difficulty: hard
    tags: [lithium, NSAIDs, drug interaction, bipolar disorder, nephrotoxicity]
  - front: "A patient on warfarin is prescribed metronidazole for a dental abscess. What interaction occurs?"
    back: "Metronidazole inhibits CYP2C9 (and possibly CYP3A4), reducing warfarin metabolism and increasing INR, with significant bleeding risk. INR should be checked within 3-5 days and warfarin dose reduced by ~25-50%.\n\nMetronidazole is one of many antibiotics that interact with warfarin. The interaction is both pharmacokinetic (CYP inhibition) and possibly pharmacodynamic (reduced vitamin K production by gut flora). Other common warfarin potentiators include TMP-SMX, fluconazole, amiodarone, and ciprofloxacin."
    difficulty: medium
    tags: [warfarin, metronidazole, INR, CYP2C9, drug interaction]
  - front: "Describe the WHO analgesic ladder for cancer pain management."
    back: "Step 1 (mild pain): non-opioid (acetaminophen, NSAIDs) +/- adjuvant. Step 2 (mild-moderate): weak opioid (codeine, tramadol) + non-opioid +/- adjuvant. Step 3 (moderate-severe): strong opioid (morphine, hydromorphone, fentanyl) + non-opioid +/- adjuvant.\n\nAdjuvant analgesics include gabapentin/pregabalin (neuropathic pain), TCAs (neuropathic), corticosteroids (bone pain, nerve compression), bisphosphonates (bone metastases). In Canada, the Canadian Pain Society recommends starting strong opioids at step 3 without requiring step 2 trial for moderate-severe cancer pain."
    difficulty: easy
    tags: [WHO pain ladder, cancer pain, opioids, adjuvant analgesics, palliative care]
  - front: "What are the standard opioid equianalgesic doses relative to oral morphine 30 mg?"
    back: "Oral morphine 30 mg = IV morphine 10 mg = oral hydromorphone 6 mg = IV hydromorphone 1.5 mg = oral oxycodone 20 mg = transdermal fentanyl ~12.5 mcg/h (approximate). Codeine 200 mg = morphine 30 mg oral.\n\nEquianalgesic tables guide opioid rotation. When switching opioids, reduce the calculated equianalgesic dose by 25-50% for incomplete cross-tolerance. Fentanyl patches should only be used in opioid-tolerant patients (receiving at least 60 mg oral morphine equivalents/day for one week)."
    difficulty: hard
    tags: [opioid equivalency, morphine, hydromorphone, equianalgesic, pain management]
  - front: "What are adjuvant analgesics used for neuropathic pain and which are first-line in Canada?"
    back: "First-line per Canadian Pain Society: gabapentin, pregabalin, duloxetine, or TCAs (amitriptyline, nortriptyline). Second-line: tramadol, topical lidocaine. Third-line: strong opioids, cannabinoids. Carbamazepine is first-line specifically for trigeminal neuralgia.\n\nNeuropathic pain (burning, shooting, allodynia) responds poorly to standard analgesics. Gabapentinoids work by binding alpha-2-delta calcium channel subunits. TCAs inhibit norepinephrine and serotonin reuptake in descending inhibitory pain pathways. Duloxetine (SNRI) is particularly useful for diabetic neuropathy."
    difficulty: medium
    tags: [neuropathic pain, gabapentin, pregabalin, adjuvant analgesics, Canadian guidelines]
  - front: "Match the antidote to the poisoning: (1) N-acetylcysteine, (2) flumazenil, (3) naloxone, (4) digoxin-specific antibody fragments (DigiFab), (5) deferoxamine."
    back: "(1) NAC — acetaminophen overdose, (2) flumazenil — benzodiazepine overdose (use with caution), (3) naloxone — opioid overdose, (4) DigiFab — digoxin toxicity, (5) deferoxamine — iron overdose.\n\nNAC replenishes glutathione to detoxify NAPQI; most effective within 8 hours of acetaminophen ingestion. Flumazenil risks seizures in chronic benzodiazepine users or mixed overdoses. Naloxone has a shorter half-life than most opioids, requiring repeat dosing or infusion. DigiFab binds free digoxin; monitor free digoxin levels (total levels become unreliable)."
    difficulty: easy
    tags: [antidotes, NAC, naloxone, flumazenil, DigiFab, toxicology]
  - front: "A patient presents with bradycardia, hyperkalemia, nausea, and yellow-green visual halos. What is the diagnosis, what precipitated it, and what is the antidote?"
    back: "Digoxin toxicity. Common precipitants: hypokalemia, hypomagnesemia, renal failure, or drug interactions (amiodarone, verapamil, clarithromycin increase digoxin levels). Antidote: DigiFab (digoxin-specific antibody fragments).\n\nDigoxin toxicity can cause almost any arrhythmia but classically causes increased automaticity with impaired conduction (e.g., atrial tachycardia with AV block, bidirectional VT). Hypokalemia potentiates toxicity because digoxin and potassium compete for the Na+/K+-ATPase binding site. Avoid calcium administration in digoxin toxicity."
    difficulty: hard
    tags: [digoxin, DigiFab, hyperkalemia, antidote, toxicology]
  - front: "What additional antidote pairs should you know for MCCQE1 beyond the common ones (NAC, naloxone, flumazenil, DigiFab)?"
    back: "Fomepizole — methanol/ethylene glycol; atropine + pralidoxime — organophosphate; hydroxocobalamin — cyanide; glucagon — beta-blocker overdose; high-dose insulin (+ dextrose) — calcium channel blocker overdose; vitamin K + FFP/PCC — warfarin; protamine — heparin; idarucizumab — dabigatran.\n\nGlucagon bypasses beta-receptors to increase cAMP directly via glucagon receptors, supporting cardiac output in beta-blocker overdose. High-dose insulin-euglycemic therapy (1 U/kg/h) is the preferred treatment for severe calcium channel blocker toxicity. Protamine dose: 1 mg per 100 units of heparin given in the last 2-3 hours."
    difficulty: medium
    tags: [antidotes, fomepizole, glucagon, protamine, hydroxocobalamin, toxicology]
  - front: "Compare serotonin syndrome and neuroleptic malignant syndrome (NMS): onset, causative drugs, key distinguishing features, and treatment."
    back: "Serotonin syndrome: ACUTE onset (hours), caused by serotonergic drugs (SSRIs, MAOIs, tramadol, fentanyl, linezolid), features clonus/hyperreflexia, mydriasis, diarrhea, agitation; treatment: stop drug, cyproheptadine, benzodiazepines. NMS: GRADUAL onset (days-weeks), caused by dopamine antagonists (antipsychotics, metoclopramide) or dopamine agonist withdrawal, features lead-pipe rigidity, hyporeflexia, mutism, diaphoresis; treatment: stop drug, dantrolene, bromocriptine.\n\nThe key distinguishing feature is clonus: present in serotonin syndrome, absent in NMS. Serotonin syndrome has hyperreflexia; NMS has normal or decreased reflexes. Both cause hyperthermia. NMS has markedly elevated CK (often >1000 IU/L). Serotonin syndrome resolves within 24-72 hours with drug cessation; NMS resolves over 1-2 weeks."
    difficulty: hard
    tags: [serotonin syndrome, NMS, clonus, cyproheptadine, dantrolene]
  - front: "A patient on paroxetine and tramadol develops agitation, hyperthermia (39.5°C), clonus in both legs, hyperreflexia, and diarrhea. Diagnosis and management?"
    back: "Serotonin syndrome caused by dual serotonergic agents (SSRI + tramadol). Management: discontinue both drugs, IV benzodiazepines for agitation and muscle rigidity, cyproheptadine 12 mg PO then 4 mg q6h, active cooling if hyperthermic, IV fluids.\n\nTramadol is often forgotten as a serotonergic agent. Other commonly overlooked serotonergic drugs: fentanyl, meperidine, linezolid, ondansetron, triptans, and dextromethorphan. Cyproheptadine is a serotonin antagonist (5-HT2A). Avoid paralysis with succinylcholine (risk of hyperkalemia from rhabdomyolysis); use non-depolarizing agents if needed."
    difficulty: hard
    tags: [serotonin syndrome, tramadol, SSRI, cyproheptadine, hyperthermia]
  - front: "A patient on haloperidol develops fever (40°C), severe muscle rigidity ('lead-pipe'), altered consciousness, tachycardia, and CK of 12,000 IU/L over 3 days. Diagnosis and treatment?"
    back: "Neuroleptic malignant syndrome (NMS). Treatment: immediately stop haloperidol, aggressive IV hydration, active cooling, dantrolene 1-2.5 mg/kg IV for rigidity, bromocriptine 2.5 mg PO/NG q8h (dopamine agonist). Monitor for rhabdomyolysis, renal failure, DIC.\n\nNMS occurs in 0.02-0.03% of patients on antipsychotics, more common with high-potency typical antipsychotics (haloperidol) but can occur with atypicals. Risk factors: dehydration, agitation, rapid dose escalation. Mortality is 5-10% with treatment. Dantrolene works by reducing calcium release from sarcoplasmic reticulum, relieving muscle rigidity."
    difficulty: hard
    tags: [NMS, haloperidol, dantrolene, bromocriptine, rhabdomyolysis]
  - front: "What is the primary contraindication for Propofol in cardiac patients?"
    back: "Patients who cannot tolerate sudden decreased BP (e.g., fixed cardiac output or cardiac failure/shock)\n\nPropofol causes significant vasodilation leading to hypotension, which is dangerous in patients with limited cardiac output or shock states."
    difficulty: easy
    tags: [anesthesia, propofol, contraindications, cardiac, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What are the contraindications for Propofol (Diprivan®) use?"
    back: "Patients who cannot tolerate sudden decreased BP (e.g., fixed cardiac output or cardiac failure, shock), and egg/soy allergies (formulation contains these)\n\nPropofol causes significant vasodilation resulting in ~30% decreased blood pressure, making it dangerous in hemodynamically unstable patients."
    difficulty: easy
    tags: [anesthesia, IV-induction-agents, propofol, contraindications, toronto-notes, pages-0071-0072-0073-0074-0075-0076-0077-0078-0079-0080]
  - front: "What are the most common immunosuppressive medication side effects after cardiac transplantation?"
    back: "Prednisone (multiple side effects), cyclosporine nephrotoxicity, and tacrolimus (nephrotoxic effects) are common immunosuppressant-related complications\n\nLong-term immunosuppression with calcineurin inhibitors particularly affects renal function over time."
    difficulty: medium
    tags: [cardiac-transplantation, immunosuppression, side-effects, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What immunosuppressant medications used post-transplant can cause nephrotoxicity?"
    back: "Cyclosporine and tacrolimus\n\nCalcineurin inhibitors are cornerstone immunosuppressants but cause dose-dependent nephrotoxicity through afferent arteriolar vasoconstriction."
    difficulty: easy
    tags: [immunosuppression, nephrotoxicity, calcineurin-inhibitors, toronto-notes, pages-0141-0142-0143-0144-0145-0146-0147-0148-0149-0150]
  - front: "What is the most important side effect of warfarin and what unique complication can occur?"
    back: "Bleeding is the most important side effect. Paradoxical thrombosis and skin necrosis can also occur.\n\nSkin necrosis typically occurs in protein C-deficient patients early in therapy when warfarin rapidly depletes the shorter-lived protein C."
    difficulty: medium
    tags: [cardiology, anticoagulants, side-effects, complications, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the notable side effects of ticlopidine?"
    back: "Thrombotic thrombocytopenic purpura (TTP) and neutropenia\n\nDue to these serious hematologic adverse effects, ticlopidine has largely been replaced by clopidogrel and other P2Y12 inhibitors."
    difficulty: easy
    tags: [cardiology, antiplatelets, side-effects, thienopyridines, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are contraindications to nitroglycerin use?"
    back: "Concurrent use of cyclic guanosine monophosphate phosphodiesterase inhibitors (e.g., sildenafil), angle closure glaucoma, increased intracranial pressure\n\nCombining nitrates with PDE5 inhibitors can cause severe hypotension due to synergistic vasodilation."
    difficulty: medium
    tags: [cardiology, nitrates, contraindications, drug-interactions, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the side effects of lidocaine?"
    back: "Confusion, stupor, and seizures (CNS toxicity)\n\nLidocaine crosses the blood-brain barrier. CNS toxicity is dose-related and more likely with hepatic dysfunction or reduced cardiac output."
    difficulty: easy
    tags: [cardiology, antiarrhythmics, Class-Ib, side-effects, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the notable side effects of amiodarone?"
    back: "Photosensitivity, pulmonary toxicity, hepatotoxicity, thyroid disease, increased INR (with warfarin)\n\nAmiodarone has Class I, II, III, and IV properties. Its side effect profile is broad, requiring monitoring of pulmonary, hepatic, and thyroid function."
    difficulty: medium
    tags: [cardiology, antiarrhythmics, Class-III, amiodarone, side-effects, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the major side effects of warfarin?"
    back: "Bleeding (most important), paradoxical thrombosis, and skin necrosis\n\nBleeding risk requires regular INR monitoring. Skin necrosis occurs early in treatment, especially in protein C deficient patients."
    difficulty: easy
    tags: [cardiology, warfarin, side effects, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are the contraindications for nitroglycerin?"
    back: "Concurrent use of cyclic guanosine monophosphate phosphodiesterase inhibitors (e.g., sildenafil), angle closure glaucoma, increased intracranial pressure\n\nCombining nitrates with PDE5 inhibitors can cause severe hypotension due to synergistic vasodilation."
    difficulty: medium
    tags: [cardiology, nitrates, contraindications, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "What are contraindications to nitroglycerin?"
    back: "Concurrent use of cyclic guanosine monophosphate phosphodiesterase inhibitors, angle closure glaucoma, increased intracranial pressure\n\nCombined use with PDE5 inhibitors (sildenafil, tadalafil) causes severe hypotension. Also contraindicated in angle closure glaucoma and elevated ICP."
    difficulty: medium
    tags: [cardiology, nitrates, contraindications, nitroglycerin, toronto-notes, pages-0161-0162-0163-0164-0165-0166-0167-0168-0169-0170]
  - front: "Which antiviral agents are affected by drug interactions with valacyclovir?"
    back: "Cladribine, foscarnet, varicella vaccine, and zoster vaccine\n\nValacyclovir has potential interactions with drugs that affect renal function or immune response. Dose adjustment is needed for impaired renal function."
    difficulty: medium
    tags: [dermatology, valacyclovir, antiviral, drug-interactions, herpes, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What serious adverse effect requires monitoring when using itraconazole for onychomycosis?"
    back: "Hepatotoxicity\n\nItraconazole can cause serious hepatotoxicity, ranging from asymptomatic transaminase elevation to fulminant hepatic failure, requiring baseline and periodic liver function monitoring."
    difficulty: medium
    tags: [dermatology, itraconazole, hepatotoxicity, onychomycosis, antifungal, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the contraindications and maximum duration for cyclosporine (Neoral®) in psoriasis?"
    back: "Contraindications: abnormal renal function, uncontrolled hypertension, malignancy (except NMSC), uncontrolled infection, immunodeficiency (except autoimmune disease), hypersensitivity. Maximum duration: <2 years due to nephrotoxicity and hypertension risk\n\nCyclosporine is a calcineurin inhibitor used for severe psoriasis. Its long-term use is limited by nephrotoxicity and hypertension, requiring rotation with other agents."
    difficulty: medium
    tags: [cyclosporine, psoriasis, systemic-therapy, contraindications, nephrotoxicity, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What drug interaction is clinically significant with itraconazole and what medications are affected?"
    back: "Itraconazole inhibits CYP3A4, increasing concentration of drugs metabolized by this enzyme including statins and diabetic medications\n\nAzole antifungals are potent CYP450 inhibitors. This interaction can cause dangerous accumulation of statins (rhabdomyolysis risk) and sulfonylureas (hypoglycemia risk)."
    difficulty: medium
    tags: [itraconazole, drug-interactions, CYP3A4, antifungal, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the contraindications to ivermectin?"
    back: "No significant serious side effects reported; not licensed for use in Canada; caution in onchocerciasis with Loa loa co-infection (risk of encephalopathy)\n\nIvermectin has an excellent safety profile with minimal serious adverse effects, making it suitable for mass drug administration in parasitic diseases."
    difficulty: easy
    tags: [ivermectin, contraindications, safety, onchocerciasis, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the contraindications and key side effects of Imiquimod (Aldara®) 5% cream?"
    back: "Avoid natural/artificial UV exposure. Side effects include local skin reactions (erythema, ulceration, edema), flu-like symptoms. Max duration 16 weeks.\n\nImiquimod is an immune response modifier used for genital warts, cutaneous warts, and superficial BCC. Works best for warts on mucosal surfaces."
    difficulty: medium
    tags: [dermatology, warts, imiquimod, topical therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the contraindications and drug interactions for Itraconazole (Sporanox®)?"
    back: "Contraindications: CHF, pregnancy. Drug interactions: inhibits CYP3A4, increases concentrations of statins and diabetic drugs. Take capsules with food.\n\nItraconazole is an azole antifungal used for onychomycosis and tinea infections. Side effects include serious hepatotoxicity."
    difficulty: medium
    tags: [dermatology, onychomycosis, itraconazole, antifungal, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the contraindications for itraconazole?"
    back: "Congestive heart failure and serious hepatotoxicity\n\nItraconazole is contraindicated in CHF (negative inotropic effect) and should not be used in patients with serious hepatotoxicity. It inhibits CYP3A4"
    difficulty: medium
    tags: [itraconazole, onychomycosis, antifungal, contraindications, oral therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the common side effects of topical tacrolimus?"
    back: "Burning sensation at application site\n\nTopical tacrolimus causes burning (especially initially) but lacks the adverse effects of steroids. May be used on all skin surfaces including face and intertriginous areas"
    difficulty: easy
    tags: [tacrolimus, atopic dermatitis, topical therapy, calcineurin inhibitor, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are other possible etiologies of hyperpyrexia to consider if heat stroke treatment fails?"
    back: "Meningitis, thyroid storm, anticholinergic poisoning, delirium tremens, infections, adverse drug events/drug interactions\n\nThese conditions can present with hyperpyrexia and require specific treatment."
    difficulty: hard
    tags: [heat-stroke, differential-diagnosis, emergency-medicine, toronto-notes, pages-0291-0292-0293-0294-0295-0296-0297-0298-0299-0300]
  - front: "What are the common side effects of testosterone therapy?"
    back: "Acne, fluid retention, weight gain, erythrocytosis, sleep apnea, benign prostatic hypertrophy\n\nTestosterone stimulates erythropoiesis and can cause polycythemia; it also promotes prostate growth and fluid retention."
    difficulty: easy
    tags: [endocrinology, testosterone, side-effects, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the side effects of testosterone replacement therapy?"
    back: "Acne, fluid retention, weight gain, erythrocytosis, sleep apnea, benign prostatic hypertrophy, and uncertain effects on cardiac events/mortality in older men\n\nTestosterone has both anabolic and androgenic effects that can cause adverse effects in various organ systems."
    difficulty: easy
    tags: [endocrinology, testosterone, side effects, adverse effects, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the common side effects of testosterone replacement therapy?"
    back: "Acne, fluid retention, weight gain, erythrocytosis, sleep apnea, and benign prostatic hypertrophy\n\nSide effects are related to androgen excess or conversion to estradiol; monitoring hematocrit and prostate health is essential during therapy."
    difficulty: easy
    tags: [endocrinology, testosterone, side effects, adverse effects, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is a contraindication to naltrexone?"
    back: "Opioid dependence (may trigger withdrawal)\n\nNaltrexone will precipitate withdrawal in opioid-dependent patients and must not be used."
    difficulty: medium
    tags: [alcohol, pharmacology, naltrexone, contraindication, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are the common side effects of bupropion?"
    back: "Insomnia, dry mouth\n\nThese side effects are related to dopaminergic and noradrenergic activity and are usually manageable."
    difficulty: easy
    tags: [smoking-cessation, pharmacology, bupropion, side-effects, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What are common side effects of SNRIs?"
    back: "Insomnia, tremors, tachycardia, sweating\n\nSNRIs commonly cause insomnia, tremors, increased heart rate, and excessive sweating."
    difficulty: easy
    tags: [pharmacology, SNRI, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the side effects of SNRIs?"
    back: "Insomnia, tremors, tachycardia, sweating\n\nSNRIs have similar side effects to SSRIs but also affect norepinephrine, causing more stimulant-like effects."
    difficulty: medium
    tags: [pharmacology, psychiatry, depression, SNRI, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the side effects of TCAs?"
    back: "Sexual dysfunction, weight gain, tremors, tachycardia, sweating\n\nTCAs have significant anticholinergic and cardiovascular side effects due to their non-selective action."
    difficulty: easy
    tags: [TCA, amitriptyline, depression, pharmacology, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the side effects of TCAs that make them dangerous?"
    back: "Narrow therapeutic window, lethal in overdose\n\nTCAs (e.g., amitriptyline) block serotonin and NE reuptake but have a narrow therapeutic index making overdose potentially fatal."
    difficulty: medium
    tags: [psychiatry, pharmacology, TCA, safety, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the side effects of TCAs that make them dangerous in overdose?"
    back: "Sexual dysfunction, weight gain, tremors, tachycardia, sweating\n\nTCAs have a narrow therapeutic window and can be lethal in overdose, requiring careful monitoring."
    difficulty: medium
    tags: [psychiatry, depression, TCA, toxicology, safety, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What are the common side effects of SNRIs?"
    back: "Insomnia, tremors, tachycardia, sweating\n\nSNRIs share some side effects with SSRIs but also affect norepinephrine, causing additional symptoms."
    difficulty: medium
    tags: [psychiatry, pharmacology, SNRI, side effects, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
