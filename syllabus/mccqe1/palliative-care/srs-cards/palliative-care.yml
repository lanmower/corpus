# Palliative Care (Palliative Care) - generated from srs-mccqe1
cards:
  - front: "What is the ESAS tool in palliative care?"
    back: "Edmonton Symptom Assessment System - a patient-rated 0-10 scale assessing 9 symptoms: pain, tiredness, drowsiness, nausea, lack of appetite, shortness of breath, depression, anxiety, and wellbeing, plus one optional symptom.\n\nESAS is a validated tool for routine palliative care assessment. It helps track symptoms over time and evaluate treatment efficacy. It can be completed by the patient, family caregiver, or healthcare professional."
    difficulty: easy
    tags: [palliative care, assessment, symptom management]
  - front: "What is the Palliative Performance Scale (PPS)?"
    back: "A tool assessing functional status across 5 domains: ambulation, activity/evidence of disease, self-care, intake, and level of consciousness. Scored 0-100% in 10% increments. Has prognostic value in advanced cancer.\n\nPPS is read by starting at 'ambulation' and moving right across columns. The overall score is the lowest level reached. PPS 50% = mainly sit/lie, unable to do any work, occasional assistance needed."
    difficulty: easy
    tags: [palliative care, assessment, prognosis]
  - front: "What are the pharmacologic options for dyspnea management in palliative care?"
    back: "Oxygen, bronchodilators, and opioids (morphine, hydromorphone). Non-pharmacologic: elevate head of bed, fan/open window, eliminate allergens.\n\nA landmark RCT showed palliative oxygen provides no additional benefit over room air for refractory dyspnea. Opioids reduce the sensation of breathlessness without significantly depressing respiratory drive at appropriate doses."
    difficulty: easy
    tags: [palliative care, dyspnea, symptom management]
  - front: "What is the WHO analgesic ladder for pain management?"
    back: "Step 1: Non-opioid (NSAIDs, acetaminophen) ± adjuvant. Step 2: Weak opioid (tramadol) ± non-opioid ± adjuvant. Step 3: Strong opioid (morphine, hydromorphone, oxycodone, fentanyl) ± non-opioid ± adjuvant.\n\nNeuropathic pain requires adjuvant agents: anticonvulsants (gabapentin, pregabalin) or antidepressants (TCAs, SSRIs). Bony pain benefits from NSAIDs, bisphosphonates, and radiation therapy in addition to opioids."
    difficulty: easy
    tags: [palliative care, pain management, pharmacology]
  - front: "What is the SPIKES protocol for delivering bad news?"
    back: "S - Setting up the interview (privacy, time). P - assess Perception (patient's understanding). I - Invitation (how patient wants to hear info). K - Knowledge sharing (non-technical terms). E - Emotions (allow processing, silence). S - Strategy and Summary.\n\nStrong communication is critical in palliative care. The SPIKES framework ensures patient-centered delivery of difficult information while maintaining empathy and allowing for emotional processing."
    difficulty: easy
    tags: [palliative care, communication, breaking bad news]
  - front: "What are the different code status options in palliative care?"
    back: "Full code: CPR, defibrillation, life support. DNR: no CPR or life support, only active medical management. Comfort measures: no CPR, no life support, no active medical management. AND (Allow Natural Death): alternative gentler term for DNR.\n\nCPR is rarely effective in advanced incurable illness. DNR is almost always consistent with palliative goals of care. These discussions should be initiated when death is expected within 6-12 months or during care transitions."
    difficulty: easy
    tags: [palliative care, end-of-life, ethics]
  - front: "What are the changes in the last hours of life?"
    back: "Decreased LOC, Cheyne-Stokes breathing, airway secretions (death rattle), inability to swallow, terminal restlessness/delirium, mottling of extremities, cool extremities.\n\nEducation of family about these physiological changes is essential. Death rattle is managed with anticholinergics (glycopyrronium preferred over scopolamine due to less CNS effects). Non-essential medications should be discontinued."
    difficulty: easy
    tags: [palliative care, end-of-life, dying process]
  - front: "What is Medical Assistance in Dying (MAID) in Canada?"
    back: "A process where a mentally competent patient makes a written request to end their life, assessed by 2 clinicians. Two pathways: (1) death is reasonably foreseeable, (2) serious/incurable illness but death not immediately foreseeable. Patients with sole mental health diagnosis cannot access MAID until March 17, 2027.\n\nMAID can involve physician/NP-administered medications or self-administered prescribed medications. A waiver of final consent exists for patients who may lose capacity before their preferred MAID date if natural death is reasonably foreseeable."
    difficulty: medium
    tags: [palliative care, MAID, ethics, legal]
  - front: "What are the types of grief in palliative care?"
    back: "Anticipatory grief: before impending loss. Acute grief: immediate reaction to death, usually resolves with family/friend support. Complicated grief: prolonged, maladaptive, severely impairs functioning with depression and anxiety.\n\nComplicated grief is characterized by prolonged duration, maladaptive thoughts, dysregulated emotions, and dysfunctional behaviors. The COSMIC trial showed a 3-step communication strategy reduces prolonged grief in relatives."
    difficulty: easy
    tags: [palliative care, grief, psychosocial]
  - front: "What are the categories of pediatric patients who benefit from palliative care?"
    back: "Category 1: Life-threatening, curative treatment possible but can fail (cancer, organ failure). Category 2: Premature death inevitable, treatment prolongs life (CF, Duchenne). Category 3: Progressive without cure, palliative only (Batten disease). Category 4: Irreversible non-progressive causing severe disability (severe CP).\n\nLess than 30% of pediatric palliative care patients have cancer; the majority have congenital/neurologic conditions. Predominant conditions: genetic/congenital (40.8%), neuromuscular (39.2%), cancer (19.8%)."
    difficulty: medium
    tags: [palliative care, pediatrics]
  - front: "What is the early palliative care evidence for patients with metastatic cancer?"
    back: "The Temel 2010 NEJM trial showed early palliative care for metastatic NSCLC led to better QOL, lower depressive symptoms, less aggressive EOL care, AND longer median survival (11.6 vs 8.9 months, p=0.02).\n\nThis landmark trial demonstrated that early palliative care is not just about comfort - it actually improves survival. Multiple subsequent trials (ENABLE II, ENABLE III) confirmed benefits of early palliative care interventions."
    difficulty: medium
    tags: [palliative care, oncology, evidence-based medicine]
  - front: "What is the clinical significance of stopping statins in palliative care?"
    back: "A 2015 RCT showed discontinuing statins in patients with life expectancy 1 month to 1 year is safe, may improve QOL, and saves ~$716/patient with no significant difference in 60-day mortality or cardiovascular events.\n\nThis supports the principle of deprescribing non-essential medications in palliative care. Reviewing medications and stopping those for primary/secondary prevention is an important aspect of care in the final months of life."
    difficulty: medium
    tags: [palliative care, deprescribing, evidence-based medicine]
  - front: "What is the FICA spiritual assessment tool?"
    back: "F - Faith or beliefs, I - Importance of those beliefs, C - patient's participation in a religious/spiritual Community, A - how healthcare providers may Address the patient's healthcare issues.\n\nSpiritual assessment is an integral part of palliative care. Spiritual concerns may include questioning meaning of life/death, anger toward a higher being, unfulfilled needs of faith and hope, and viewing illness as punishment."
    difficulty: easy
    tags: [palliative care, spirituality, assessment]
  - front: "What medications are used for death rattle (oropharyngeal secretions) in dying patients?"
    back: "Anticholinergics: glycopyrronium (glycopyrrolate) SC is preferred, or hyoscine hydrobromide (scopolamine) SC/transdermal. Glycopyrronium is preferred because it does not cross the blood-brain barrier (fewer central effects).\n\nReassure family that the patient is not in respiratory distress. Non-pharmacologic measures include repositioning on side, elevated position, and discontinuing unnecessary IV fluids. Avoid deep suctioning; oral suctioning only."
    difficulty: medium
    tags: [palliative care, end-of-life, symptom management]
