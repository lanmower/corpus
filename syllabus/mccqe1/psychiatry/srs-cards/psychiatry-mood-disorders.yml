# Psychiatry Mood Disorders (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What is the DSM-5 mnemonic for Major Depressive Episode (MDE) symptoms and how many are required?"
    back: "Mnemonic: MSIGECAPS — Mood (depressed), Sleep (increased/decreased), Interest (decreased/anhedonia), Guilt (worthlessness), Energy (fatigue), Concentration (decreased), Appetite (increased/decreased), Psychomotor (agitation/retardation), Suicidality. ≥5 of 9 symptoms for ≥2 weeks, with at least one being depressed mood or anhedonia.\n\nThe MDE criteria require functional impairment (Criterion B) and exclusion of substance/medical causes (Criterion C). The key anchor symptoms are depressed mood and anhedonia — at least one must be present among the ≥5."
    difficulty: easy
    tags: [psychiatry, depression, MDE, DSM-5, mnemonic]
  - front: "What are the DSM-5 criteria for a Manic Episode and its mnemonic?"
    back: "Mnemonic: DIG FAST — Distractibility, Indiscretion (pleasurable activities with painful consequences), Grandiosity, Flight of ideas, Activity (increased goal-directed activity), Sleep (decreased need), Talkativeness (pressure of speech). Criterion A: abnormally and persistently elevated/expansive/irritable mood AND increased goal-directed activity/energy for ≥1 week (or any duration if hospitalization needed). Criterion B: ≥3 of the above (≥4 if mood only irritable). Criterion C: marked impairment, hospitalization, or psychotic features.\n\nA full manic episode that emerges during antidepressant treatment but persists beyond the physiological effect of that treatment counts as a manic episode and warrants a Bipolar I diagnosis. The 'irritable only' criterion requiring 4 symptoms (vs. 3 if elevated/expansive) is frequently tested."
    difficulty: medium
    tags: [psychiatry, mania, bipolar, DSM-5, mnemonic]
  - front: "How does a Hypomanic Episode differ from a Manic Episode (DSM-5)?"
    back: "Both share the same Criterion A and B symptoms. Key differences: (1) Duration: hypomania lasts ≥4 days (mania ≥1 week); (2) Severity: hypomania does NOT cause marked impairment, does NOT require hospitalization; (3) No psychotic features (if present, by definition it is a manic episode).\n\nDistinguishing hypomania from mania is critical for the Bipolar I vs. II distinction. Patients with hypomania may not recognize it as abnormal (it can feel productive), leading to underreporting and delayed/missed diagnosis of Bipolar II."
    difficulty: medium
    tags: [psychiatry, hypomania, mania, bipolar, DSM-5]
  - front: "What is a Mixed Features specifier and what is its clinical significance?"
    back: "Mixed features is a specifier applied to a manic, hypomanic, or depressive episode indicating concurrent depressive AND manic symptoms. During a full MDE: ≥3 Criterion B manic symptoms present on most days. During full manic/hypomanic episode: ≥3 Criterion A depressive symptoms on most days. Clinical significance: increased suicide risk, appropriate treatment is critical, and its presence in an MDD patient raises suspicion for Bipolar Disorder.\n\nMonotherapy with antidepressants should be avoided in mixed states as it can precipitate or worsen manic symptoms. Mood stabilizers (lithium, divalproex) combined with SGAs (lurasidone, aripiprazole) are preferred for mixed episodes."
    difficulty: hard
    tags: [psychiatry, mixed features, bipolar, suicide risk, DSM-5]
  - front: "What is the Canadian epidemiology of Major Depressive Disorder (MDD)?"
    back: "Annual prevalence: 5%; lifetime prevalence: 11%; peak prevalence age 15–25 years; female:male ratio = 2:1.\n\nMDD is one of the leading causes of disability in Canada. The female predominance may be related to hormonal, psychological, and sociocultural factors. The peak onset in young adults makes it a major public health concern."
    difficulty: easy
    tags: [psychiatry, depression, MDD, epidemiology, Canada]
  - front: "What are the biological etiological factors for Major Depressive Disorder (MDD)?"
    back: "Genetic: 65–75% MZ twins; 14–19% DZ twins; 2–4 fold increased risk in first-degree relatives. Neurotransmitter: decreased 5-HT, NE, DA; changes in GABA and glutamate. Neuroendocrine: abnormal HPA axis activity. Neuroanatomy: decreased hippocampal volume, increased ventricles, decreased REM latency, increased REM length. Immunologic: increased pro-inflammatory cytokines (IL-6, TNF).\n\nThe monoamine hypothesis (decreased 5-HT/NE/DA) underpins traditional antidepressant pharmacotherapy. The role of inflammation and HPA axis dysregulation has spurred interest in novel treatments targeting these pathways."
    difficulty: medium
    tags: [psychiatry, depression, MDD, etiology, neurotransmitters]
  - front: "What is the treatment algorithm for Major Depressive Disorder (MDD)?"
    back: "Mild: lifestyle (supervised exercise, light therapy for seasonal pattern), psychotherapy. Moderate-severe: 1st line pharmacotherapy — 2nd generation antidepressants (escitalopram, mirtazapine, sertraline, venlafaxine, agomelatine, citalopram show superiority). Non/partial response: optimize dose, switch to superior antidepressant, OR augment (aripiprazole, quetiapine, risperidone). Response timeline: physical symptoms improve at 2 weeks, mood/cognition by 4 weeks. ECT: fastest and most effective for severe/psychotic/treatment-resistant MDD. TMS: 1st line after ≥1 antidepressant failure.\n\nPer Canadian guidelines (CANMAT), adequate antidepressant trials require therapeutic dose for at least 4–6 weeks. TMS provides a non-invasive alternative to ECT with fewer cognitive side effects. ECT remains the gold standard for severe or life-threatening depression."
    difficulty: medium
    tags: [psychiatry, depression, MDD, treatment, antidepressants, ECT, TMS]
  - front: "What are the features of depression in the elderly?"
    back: "Affects ~15% of community residents >65, up to 50% in nursing homes. High suicide risk (social isolation, chronic illness, decreased independence). Suicide peaks: males ages 80–90, females ages 50–65. Low mood may not be reliable indicator in those >70. Often presents with somatic complaints (weight/sleep/energy changes, chronic pain, anxiety). May have prominent cognitive changes after mood symptom onset (dementia syndrome of depression).\n\nLate-onset depression in the elderly requires careful distinction from dementia. The 'dementia syndrome of depression' (pseudodementia) typically features acute onset, the patient complaining of memory loss, and improvement of cognition with antidepressant treatment — unlike true dementia."
    difficulty: medium
    tags: [psychiatry, depression, elderly, geriatric, suicide]
  - front: "What are the DSM-5 diagnostic criteria for Persistent Depressive Disorder (Dysthymia)?"
    back: "A. Depressed mood for most of the day, more days than not, for ≥2 years (≥1 year in children/adolescents). B. ≥2 of: poor appetite or overeating, insomnia or hypersomnia, low energy/fatigue, low self-esteem, poor concentration/indecisiveness, hopelessness. C. Never without symptoms for >2 months during 2-year period. D–H: No manic/hypomanic episodes; not better explained by psychotic disorder; not due to substances/GMC; causes significant distress/impairment.\n\nPersistent depressive disorder replaced the older terms 'dysthymia' and 'chronic MDD' in DSM-5. 'Double depression' refers to a full MDE superimposed on Persistent Depressive Disorder — these patients have worse outcomes than either condition alone."
    difficulty: medium
    tags: [psychiatry, persistent depressive disorder, dysthymia, DSM-5]
  - front: "What is the epidemiology and treatment of Persistent Depressive Disorder?"
    back: "Epidemiology: lifetime prevalence 2–3%; M = F. Treatment: Psychological — psychotherapy is principal treatment (historically); pharmacological treatment has some (but inferior) benefit; combination may be most efficacious. Biological — SSRIs (sertraline, escitalopram), TCAs (nortriptyline).\n\nUnlike MDD where medications are a mainstay, Persistent Depressive Disorder historically emphasized psychotherapy. However, evidence supports SSRIs as effective agents. The long-term nature of the condition requires sustained treatment engagement."
    difficulty: easy
    tags: [psychiatry, persistent depressive disorder, treatment, SSRIs]
  - front: "What is Postpartum 'Blues' and how does it differ from Postpartum Depression?"
    back: "Postpartum Blues: Transient mild depression, mood instability, anxiety, decreased concentration. Normal response to hormonal changes. Occurs in 50–80% of mothers. Onset 2–4 days postpartum, lasts 48 hours (up to 10 days). Does NOT require psychotropic medication. Postpartum Depression (MDD with peripartum onset): Onset during pregnancy or within 4 weeks of delivery. Lasts 2–6 months (residual up to 1 year). Occurs in 3–6% of mothers. Requires treatment (psychotherapy, SSRIs, ECT if severe/psychotic).\n\nThe distinction is important: postpartum blues is self-limiting and does not require medication, while postpartum depression significantly impairs maternal functioning and can affect child development. Screening with tools like the Edinburgh Postnatal Depression Scale is recommended."
    difficulty: medium
    tags: [psychiatry, postpartum, postpartum blues, postpartum depression, peripartum]
  - front: "What is the risk, treatment, and prognosis of MDD with peripartum onset (Postpartum Depression)?"
    back: "Risk: up to 3–6% of mothers; 50% recurrence risk. Risk factors: previous mood disorder, family history, psychosocial stressors, unwanted pregnancy, colicky/sick infant, marital conflict. Treatment: psychotherapy (CBT or IPT), SSRIs (short-term safety for breastfeeding established, long-term unknown), ECT if severe/psychotic. Prognosis: treatment of mother improves child outcomes at 8 months.\n\nSSRIs are considered first-line pharmacotherapy for postpartum depression when medication is needed. Per Canadian Paediatric Society, SSRIs and SNRIs in breastfeeding are generally compatible; Poor Neonatal Adaptation Syndrome (PNAS) may occur in ~1/3 of infants exposed in utero but is generally mild and self-limiting."
    difficulty: medium
    tags: [psychiatry, postpartum depression, peripartum, SSRIs, breastfeeding]
  - front: "What are the DSM-5 definitions of Bipolar I and Bipolar II Disorder?"
    back: "Bipolar I: At least one manic episode (if manic symptoms lead to hospitalization or include psychotic features → Bipolar I diagnosis). MDEs are common but not required. Bipolar II: At least 1 MDE + 1 hypomanic episode + NO manic episodes. Bipolar II is NOT a 'milder' form of Bipolar I (50% of time spent depressed vs. 32% for Bipolar I).\n\nBipolar II is often missed because the depressive episodes dominate the clinical picture and hypomanic episodes may not be recognized or reported. MDE history features favouring bipolar over unipolar: early onset (<25 yr), multiple MDEs, psychotic symptoms, postpartum onset, antidepressant 'poop-out,' hypersomnia/hyperphagia."
    difficulty: medium
    tags: [psychiatry, bipolar disorder, bipolar I, bipolar II, DSM-5]
  - front: "What is the epidemiology of Bipolar Disorder?"
    back: "Lifetime prevalence: Bipolar I 1%, Bipolar II 1.1%, Subthreshold BD 2.4%; M:F = 1:1. Mean age of onset: 25 years (usually MDE first, manic episode 6–10 years later; average age of first manic episode: 32 years). 90% of those with a single manic episode will have another.\n\nThe mean age of first manic episode (~32 years) occurs years after the first depressive episode, which explains why many patients with Bipolar II are initially (and incorrectly) treated for unipolar depression — a dangerous situation given that antidepressant monotherapy can precipitate mania."
    difficulty: medium
    tags: [psychiatry, bipolar disorder, epidemiology]
  - front: "What are the clinical features of a MDE history that should raise suspicion for Bipolar Disorder over Unipolar MDD?"
    back: "Early age of onset (<25 yr), increased number of MDEs, psychotic symptoms, postpartum onset, anxiety disorders (especially separation anxiety, panic), antidepressant failure due to early 'poop out' or hypomanic symptoms, early impulsivity and aggression, substance misuse, cyclothymic temperament, family history of bipolar disorder, more suicide attempts, atypical depressive symptoms (hypersomnia, hyperphagia), psychomotor impairment.\n\nRecognizing bipolar spectrum illness before prescribing antidepressant monotherapy is critical — antidepressants alone can precipitate manic/hypomanic switches or induce mixed states, increasing suicide risk. Adding a mood stabilizer first is safer in suspected Bipolar II."
    difficulty: hard
    tags: [psychiatry, bipolar disorder, MDD, differential diagnosis, antidepressants]
  - front: "What is the pharmacological treatment of Bipolar Disorder for each phase?"
    back: "Treating mania: lithium, divalproex, carbamazepine (2nd line), SGAs, ECT (2nd line), benzodiazepines (acute agitation). Preventing mania: same as above at lower doses (minus ECT and BZDs). Treating bipolar depression ('4 Ls'): Lithium, Lamotrigine, Lurasidone, seroquel (Quetiapine); antidepressants are 2nd line only WITH mood stabilizer; ECT (2nd line). Preventing depression: above + aripiprazole, divalproex; quetiapine is 1st line for Bipolar II depression. Mixed episode/rapid cycling: lithium or divalproex + SGA (lurasidone, aripiprazole). Avoid antidepressant monotherapy.\n\nRapid cycling (≥4 mood episodes per year) is associated with hypothyroidism — checking TSH and treating hypothyroidism is important. The '4 Ls' mnemonic (Lithium, Lamotrigine, Lurasidone, seroqueL) aids recall of bipolar depression treatment options."
    difficulty: hard
    tags: [psychiatry, bipolar disorder, lithium, lamotrigine, treatment, mood stabilizers]
  - front: "What is Cyclothymia and how is it treated?"
    back: "Cyclothymia: Numerous periods of hypomanic and depressive symptoms (NOT meeting full criteria for hypomanic episode or MDE) for ≥2 years; never without symptoms for >2 months. Has never met criteria for MDE, manic, or hypomanic episode. Not due to substances/GMC; causes clinically significant distress/impairment. Treatment: similar to Bipolar I — mood stabilizer + psychotherapy.\n\nCyclothymia lies on the bipolar spectrum. Unlike Bipolar II, full hypomanic or depressive episodes are absent. The 2-year minimum duration distinguishes it from transient mood fluctuations. Approximately 15–50% of those with cyclothymia eventually develop Bipolar I or II."
    difficulty: medium
    tags: [psychiatry, cyclothymia, bipolar spectrum, diagnosis]
  - front: "What is the prognosis and course of Bipolar Disorder?"
    back: "High suicide rate: 15% mortality from suicide, especially in depressive/mixed episodes. Chronic relapsing-remitting course; depressive symptoms more frequent and longer than manic. Can achieve high functioning between episodes. 90% recurrence of mania within 5 years after a manic episode. Long-term Bipolar I: 15% well, 45% well with relapses, 30% partial remission, 10% chronically ill. Patients with BD at higher suicide risk when switching from depression to mania due to impulsive behaviour during manic phase.\n\nBipolar II patients spend approximately 50% of their time in depressive episodes, contributing to the elevated suicide risk. Rapid cycling, mixed features, and substance use disorder are associated with a worse prognosis."
    difficulty: medium
    tags: [psychiatry, bipolar disorder, prognosis, suicide, course]
  - front: "Why should antidepressant monotherapy be avoided in Bipolar Disorder depression?"
    back: "Antidepressant monotherapy without a mood stabilizer can cause a switch from depression into mania (or hypomania), and can increase the risk of rapid cycling and mixed states — all associated with increased suicide risk and worse overall prognosis.\n\nPer Canadian and international guidelines, antidepressants should only be used as 2nd line adjuncts in bipolar depression, always in combination with a mood stabilizer. First-line options for bipolar depression include lithium, lamotrigine, lurasidone, and quetiapine (the '4 Ls')."
    difficulty: medium
    tags: [psychiatry, bipolar disorder, antidepressants, treatment, safety]
  - front: "What is the DSM-5 diagnosis of MDD (Major Depressive Disorder) — key criteria?"
    back: "A. Presence of a single MDE (≥5 symptoms for ≥2 weeks). For recurrent MDD, ≥2 MDEs with ≥2 consecutive months between episodes. B. MDE not better accounted for by schizoaffective disorder or superimposed on schizophrenia spectrum. C. No lifetime manic or hypomanic episode (if substance/treatment-induced manic episodes, these are excluded). Specifiers include: anxious distress, mixed features, melancholic, atypical, mood-congruent/incongruent psychotic features, catatonia, peripartum onset, seasonal pattern.\n\nThe exclusion of manic/hypomanic episodes (Criterion C) is what separates MDD from Bipolar Disorder. However, antidepressant-induced or medically-induced manic episodes do not count against this criterion — demonstrating the importance of clarifying the context of any prior manic symptoms."
    difficulty: medium
    tags: [psychiatry, MDD, depression, DSM-5, diagnosis]
  - front: "What is the prognosis of untreated MDD at 1 year?"
    back: "At 1 year after MDD diagnosis without treatment: 40% still meet full criteria for MDD, 20% have some symptoms but no longer meet full criteria, 40% have no symptoms.\n\nThis 'rule of 40-20-40' demonstrates that MDD is not universally self-limiting — 60% of untreated patients continue to have significant symptoms at 1 year. This underscores the importance of active treatment rather than watchful waiting in moderate-to-severe depression."
    difficulty: easy
    tags: [psychiatry, MDD, depression, prognosis, natural history]
