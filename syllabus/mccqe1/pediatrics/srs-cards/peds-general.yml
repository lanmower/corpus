# Peds General (Pediatrics) - generated from srs-mccqe1
cards:
  - front: "What defines 'presumed cardiac' arrest in children and young adults?"
    back: "Cardiac arrest without identifiable non-cardiac cause in young patients\n\nAllan et al. questioned whether 'presumed cardiac' arrest in young patients is truly cardiac in origin, suggesting this may be a misnomer."
    difficulty: medium
    tags: [cardiac arrest, pediatric, etiology, toronto-notes, pages-0171-0172-0173-0174-0175-0176-0177-0178-0179-0180]
  - front: "When is a biopsy indicated for a lipoma?"
    back: "Only if atypical features are present (painful, rapid growth, firm consistency)\n\nMost lipomas are asymptomatic and can be observed. Biopsy or excision is warranted when features suggest malignancy, such as rapid growth, pain, or firm texture."
    difficulty: easy
    tags: [dermatology, lipoma, biopsy, soft-tissue-tumors, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "In a prepubertal child with acne, what should you consider?"
    back: "Underlying hormonal abnormality, such as late-onset congenital adrenal hyperplasia\n\nPrepubertal acne, especially before age 7-8, warrants evaluation for androgen excess from adrenal or gonadal sources."
    difficulty: medium
    tags: [dermatology, acne, pediatrics, endocrinology, androgens, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "When is biopsy indicated for lipoma?"
    back: "Only if atypical features are present (painful, rapid growth, firm consistency)"
    difficulty: medium
    tags: [dermatology, lipoma, biopsy, indications, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the management for nevus flammeus (port-wine stain)?"
    back: "Laser treatment or cosmetic makeup. Lesions never spontaneously regress but grow proportionally with the child. May be associated with Sturge-Weber syndrome if in V1/V2 distribution.\n\nPort-wine stains are congenital vascular malformations that persist and require active treatment for cosmesis and functional concerns."
    difficulty: easy
    tags: [dermatology, vascular malformations, port-wine stain, nevus flammeus, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "When is biopsy indicated for a suspected lipoma?"
    back: "Biopsy is indicated only if atypical features are present: painful lipoma, rapid growth, or firm consistency.\n\nMost lipomas are asymptomatic and require no investigation. Atypical features warrant biopsy to rule out liposarcoma."
    difficulty: easy
    tags: [dermatology, soft tissue tumors, lipoma, investigations, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What hormonal abnormality should be considered in a prepubertal child with acne?"
    back: "Late-onset congenital adrenal hyperplasia\n\nAcne in prepubertal children (before age 8 in girls, before age 9 in boys) is abnormal and warrants investigation for androgen excess. Late-onset congenital adrenal hyperplasia is a key differential diagnosis."
    difficulty: medium
    tags: [dermatology, acne vulgaris, prepubertal, congenital adrenal hyperplasia, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What is the management for lipoma?"
    back: "Reassurance is typically sufficient. Excision or liposuction only if desired for cosmetic purposes. Biopsy/ultrasound only if atypical features (painful, rapid growth, firm).\n\nLipomas are benign and do not require removal unless symptomatic or for cosmetic reasons."
    difficulty: easy
    tags: [dermatology, soft_tissue_tumors, treatment, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What investigations are indicated for lipoma?"
    back: "Biopsy only if atypical features (painful, rapid growth, firm)\n\nLipomas are typically diagnosed clinically. Biopsy or ultrasound is warranted only when atypical features raise concern for malignancy."
    difficulty: easy
    tags: [dermatology, diagnosis, lipoma, biopsy, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "What hormonal abnormality should be considered in prepubertal children with acne?"
    back: "Late onset congenital adrenal hyperplasia\n\nPrepubertal acne may indicate androgen excess from adrenal causes like congenital adrenal hyperplasia, warranting endocrine evaluation."
    difficulty: medium
    tags: [dermatology, acne, endocrinology, pediatrics, toronto-notes, pages-0201-0202-0203-0204-0205-0206-0207-0208-0209-0210]
  - front: "When can children with head lice return to school?"
    back: "After the first treatment with permethrin\n\nCurrent guidelines permit children to return to school after the initial treatment, reflecting that lice are primarily spread through direct head-to-head contact rather than fomites."
    difficulty: easy
    tags: [lice, management, public health, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "When may children return to school after head lice treatment?"
    back: "Children are medically cleared to return to school after the first treatment with permethrin.\n\nCurrent guidelines emphasize that exclusion from school is not necessary once treatment has been initiated, as transmission primarily occurs from living lice rather than nits."
    difficulty: easy
    tags: [lice, school, policy, pediatrics, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the treatment for head lice?"
    back: "Permethrin 1% cream rinse (Nix), R&C or Kwellada-P shampoo. Comb hair with fine-toothed comb using dilute vinegar solution to remove nits. Repeat treatment 7 days after first treatment. Children may return to school after first treatment.\n\nThe 7-day repeat treatment is critical because permethrin is not fully ovicidal. Vinegar helps dissolve the nit cement."
    difficulty: easy
    tags: [lice, treatment, permethrin, pediculosis, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What are the 3 stages of the hair growth cycle?"
    back: "Anagen (growth stage), Catagen (transitional stage), Telogen (resting stage)\n\nMost scalp hairs are in anagen phase at any given time. The duration of anagen determines maximum hair length and varies by body site."
    difficulty: easy
    tags: [hair biology, hair cycle, anagen, telogen, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the expected timeline for recovery from Telogen Effluvium?"
    back: "Regrowth may begin in a few months, but meaningful regrowth can take 6-12 months\n\nThe slow recovery reflects the time needed for follicles to re-enter anagen and produce visible hair. Full recovery depends on resolution of the underlying cause."
    difficulty: easy
    tags: [telogen effluvium, prognosis, hair regrowth, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the key distinguishing feature between scarring and non-scarring alopecia?"
    back: "In non-scarring alopecia, stem cells are intact so spontaneous or treatment-induced regrowth may be helpful; in scarring alopecia, permanent destruction of stem cells prevents regrowth\n\nThe stem cells reside in the bulge region of the hair follicle. Loss of this region (as in scarring alopecia) is irreversible."
    difficulty: medium
    tags: [alopecia, scarring alopecia, non-scarring alopecia, pathophysiology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What hormonal changes during menopause contribute to perceived decreased scalp hair in women?"
    back: "Reduced estrogen leads to decreased hair diameter, growth rate, and percentage of hairs in anagen phase; compounded by chronological age effects on hair density\n\nEstrogen normally prolongs anagen and promotes hair growth. Postmenopausal estrogen decline unmasks androgenetic effects and reduces overall hair density."
    difficulty: medium
    tags: [menopause, hair changes, estrogen, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What are the three stages of the hair growth cycle?"
    back: "1. Anagen (growth stage) - stem cells at upper part of follicle, 2. Catagen (transitional stage) - bulge region, 3. Telogen (resting stage)\n\nHair grows cyclically through these three phases, with most scalp hairs normally in the anagen phase."
    difficulty: easy
    tags: [hair biology, dermatology, physiology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What causes hair loss in postmenopausal women?"
    back: "Reduced estrogen leads to decreased hair diameter, growth rate, and percentage of hairs in anagen phase; compounded by chronological aging effects on hair density\n\nEstrogen normally prolongs anagen phase and promotes hair growth; its loss during menopause unmasks androgen effects and accelerates age-related thinning."
    difficulty: medium
    tags: [alopecia, menopause, hormones, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "Why cannot eyebrow, eyelash, and axillary hairs regrow after being lost?"
    back: "These hairs have a short anagen (growth) phase relative to their telogen (resting) phase, meaning their hair follicles cannot regenerate in time to replace lost hair.\n\nThe anagen:telogen ratio differs by body site. Areas with short anagen phases cannot grow hair long and cannot regrow after cycling."
    difficulty: medium
    tags: [hair anatomy, hair disorders, physiology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What hormonal changes during menopause contribute to perceived decreased scalp hair density?"
    back: "Reduced estrogen leads to decreased hair diameter, growth rate, and percentage of hairs in anagen phase. Combined with chronological aging effects on hair density.\n\nEstrogen normally prolongs anagen and protects against androgen effects. Postmenopausal estrogen decline unmasks androgen sensitivity."
    difficulty: medium
    tags: [menopause, hair changes, hormones, estrogen, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What hormonal factors regulate hair growth?"
    back: "Testosterone and dihydrotestosterone (DHT) regulate hair follicle growth response, which is genetically controlled\n\nDHT causes miniaturization of hair follicles in androgenetic alopecia, particularly in genetically susceptible individuals."
    difficulty: easy
    tags: [dermatology, hair disorders, androgenetic alopecia, physiology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What hormonal changes during menopause affect hair?"
    back: "Reduced estrogen leads to decreased hair diameter, growth rate, and percentage of hairs in anagen phase; combined with chronological aging effects, this causes perceived decreased scalp hair density\n\nEstrogen normally prolongs the anagen phase and promotes hair thickness, so its decline affects hair quality and density."
    difficulty: medium
    tags: [dermatology, hair disorders, menopause, endocrinology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the hypogmented subtype of mycosis fungoides and who does it affect?"
    back: "A variant of mycosis fungoides most commonly seen in children with deeper skin tones, presenting with hypopigmented patches rather than the typical erythematous lesions\n\nThis subtype can be mistaken for vitiligo or tinea versicolor, leading to delayed diagnosis in darker-skinned individuals."
    difficulty: medium
    tags: [dermatology, mycosis fungoides, pediatrics, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What age restriction exists for permethrin in scabies treatment?"
    back: "Do not use in children <2 years old\n\nPermethrin 5% cream is applied once for scabies and repeated after 1 week. It is contraindicated in infants under 2 years and those with chrysanthemum sensitivity."
    difficulty: easy
    tags: [permethrin, scabies, pediculosis, topical therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the preferred topical treatment for scabies in children under 2 years?"
    back: "Sulfur in petroleum (permethrin is not recommended in children <2 years)\n\nWhile permethrin is first-line for scabies in older children and adults, it is contraindicated in children under 2 years, requiring alternative agents like precipitated sulfur."
    difficulty: medium
    tags: [dermatology, scabies, pediatrics, permethrin, topical-therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What is the treatment protocol for permethrin (Kwellada® P) in scabies?"
    back: "Apply 5% cream to all skin areas from neck down, leave on for 8-10 hours (overnight), wash off; repeat application after 1 week; do not use in children <2 years\n\nPermethrin is a pyrethroid insecticide that is first-line treatment for scabies and pediculosis. It has low toxicity and excellent efficacy with rapid resolution of symptoms."
    difficulty: easy
    tags: [scabies, permethrin, topical-therapy, parasitic-infection, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "What are the symptoms of primary HSV-1 gingivostomatitis?"
    back: "Entire buccal mucosa involved with erythema and edema of gingiva; often in children and young adults\n\nPrimary HSV-1 infection is usually symptomatic in young patients with high fever and lymphadenopathy."
    difficulty: medium
    tags: [HSV, gingivostomatitis, dermatology, oral medicine, toronto-notes, pages-0221-0222-0223-0224-0225-0226-0227-0228-0229-0230]
  - front: "What is the compression-to-ventilation ratio for child CPR (1-8 years)?"
    back: "15 compressions to 2 ventilations\n\nFor children ages 1-8 years, the ratio is 15:2, differing from adults who use 30:2."
    difficulty: easy
    tags: [CPR, Pediatric Emergency, AHA Guidelines, Resuscitation, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the compression-to-ventilation ratio for child CPR (ages 1-8 years)?"
    back: "15:2 (15 compressions to 2 ventilations)\n\nChildren receive 15 compressions followed by 2 ventilations, reflecting their higher ventilatory needs compared to adults."
    difficulty: easy
    tags: [CPR, pediatric, resuscitation, AHA guidelines, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the legal obligation when parents refuse life-saving treatment for a child?"
    back: "Act in the best interest of the child while involving local child protection services and continuing to engage with parents\n\nHealthcare providers must ensure the child's welfare while following legal protocols for child protection."
    difficulty: medium
    tags: [child protection, consent, ethics, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is telogen effluvium?"
    back: "Uniform decrease in hair density due to premature shifting of hairs from anagen (growth) to telogen (resting) phase\n\nHair loss typically occurs 2-4 months after the precipitating event, with regrowth beginning in months but taking 6-12 months for meaningful recovery."
    difficulty: medium
    tags: [telogen-effluvium, alopecia, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the hair growth cycle and which phase are most scalp hairs in?"
    back: "Three stages: anagen (growth), catagen (transitional), telogen (resting). Most scalp hairs are in anagen phase.\n\nAnagen lasts 2-6 years for scalp hair, catagen 2-3 weeks, and telogen 2-4 months. The proportion in each phase determines hair density."
    difficulty: medium
    tags: [hair-cycle, anagen, telogen, physiology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What hormonal changes occur in menopause that affect hair?"
    back: "Reduced estrogen leads to decreased hair diameter, growth rate, and percentage of hairs in anagen phase\n\nEstrogen prolongs the anagen phase; its decline during menopause, combined with aging, leads to perceived decreased hair density in middle-aged women."
    difficulty: medium
    tags: [menopause, hair-changes, estrogen, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the typical timeline for hair regrowth after telogen effluvium?"
    back: "Regrowth may begin in a few months but meaningful regrowth takes 6-12 months\n\nThe delayed timeline reflects the need for follicles to cycle back through telogen and re-enter anagen phase sequentially."
    difficulty: medium
    tags: [telogen-effluvium, regrowth, timeline, dermatology, toronto-notes, pages-0231-0232-0233-0234-0235-0236-0237-0238-0239-0240]
  - front: "What is the duty to report in emergency medicine?"
    back: "Legal obligation to report certain conditions: gunshot wounds, suspected child abuse, communicable diseases, medical unsuitability to drive, risk of harm to others\n\nDuty to report laws vary by province/state but typically require reporting conditions that pose public safety risks."
    difficulty: medium
    tags: [ethics, duty to report, legal, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "When can parents refuse treatment for their child based on religious beliefs?"
    back: "They can refuse but physician must evaluate risk, ensure informed decision, and if life-saving treatment is refused, involve child protection services immediately\n\nThe child's best interest prevails when refusal would result in serious harm - CAS must be involved."
    difficulty: medium
    tags: [ethics, pediatrics, Jehovahs Witnesses, child protection, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the contraindications for permethrin in scabies treatment?"
    back: "Children <2 years old and hypersensitivity to chrysanthemums\n\nPermethrin is contraindicated in children under 2 years and in patients with known sensitivity to chrysanthemums or pyrethroids"
    difficulty: easy
    tags: [permethrin, scabies, contraindications, topical therapy, toronto-notes, pages-0241-0242-0243-0244-0245-0246-0247-0248-0249-0250]
  - front: "According to 2020 AHA CPR Guidelines, what is the compression-to-ventilation ratio for adults vs. children vs. infants?"
    back: "Adults: 30:2, Children (1-8yr): 15:2, Infants (<1yr): 15:2\n\nThe 2020 AHA guidelines emphasize higher ventilation ratios for children and infants to provide more oxygen delivery during resuscitation."
    difficulty: easy
    tags: [CPR, AHA guidelines, resuscitation, pediatrics, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What are the compression landmarks for adults vs. children vs. infants?"
    back: "Adults: lower half of sternum, Children: just below nipple line, Infants: just below nipple line\n\nCorrect hand placement ensures effective compressions while minimizing injury risk."
    difficulty: easy
    tags: [CPR, compression landmark, pediatrics, toronto-notes, pages-0251-0252-0253-0254-0255-0256-0257-0258-0259-0260]
  - front: "What is the role of thyroid hormones in fetal growth and development?"
    back: "Required for normal CNS development and growth in the fetus and child via stimulation of GH release in synergism with cortisol\n\nThyroid hormone deficiency during critical developmental periods can cause irreversible cognitive impairment."
    difficulty: medium
    tags: [thyroid, development, pediatrics, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the three major hormones hypersecreted by pituitary adenomas?"
    back: "Prolactin (PRL), Growth Hormone (GH), and Adrenocorticotropic Hormone (ACTH)\n\nThese are the most common functioning pituitary adenomas: PRL causes galactorrhea/hypogonadism, GH causes acromegaly/gigantism, and ACTH causes Cushing's syndrome."
    difficulty: easy
    tags: [pituitary, adenoma, endocrinology, hormones, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the clinical features of GH deficiency?"
    back: "Short stature in children; adults have increased fat mass, decreased lean body mass, decreased BMD, fatigue\n\nGH deficiency affects growth in children and metabolic functions in adults, including lipolysis, protein synthesis, and bone mineralization."
    difficulty: easy
    tags: [pituitary, GH, growth hormone, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What clinical features do GH-secreting pituitary adenomas cause?"
    back: "Acromegaly in adults, gigantism in children\n\nGH excess before epiphyseal plate closure causes gigantism (linear growth). In adults, excess GH causes acromegaly (enlarged hands/feet, facial changes)."
    difficulty: easy
    tags: [pituitary, GH, acromegaly, gigantism, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is the role of thyroid hormones in fetal growth?"
    back: "Required for normal growth in fetus and child, including CNS development, via stimulation of GH release in synergism with cortisol\n\nThyroid hormones are crucial for normal brain development and work with GH and cortisol to promote growth."
    difficulty: medium
    tags: [thyroid, fetal, growth, CNS, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What are the inhibitory effects of excess cortisol?"
    back: "Inhibit bone formation (stimulate resorption), inhibit fibroblasts causing collagen loss, suppress inflammation and cell-mediated immunity, inhibit growth hormone and reproductive axes, increase PTH release and urine calcium excretion\n\nThese effects are typically only seen with cortisol excess (Cushing's syndrome)."
    difficulty: medium
    tags: [endocrinology, adrenal, pathology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the clinical features of gigantism?"
    back: "GH excess in children before epiphyseal closure - excessive linear growth"
    difficulty: easy
    tags: [gigantism, GH, pituitary adenoma, toronto-notes, pages-0331-0332-0333-0334-0335-0336-0337-0338-0339-0340]
  - front: "What is adrenarche?"
    back: "The growth of axillary and pubic hair, driven by adrenal androgens"
    difficulty: easy
    tags: [adrenal, endocrinology, development, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the treatment goals for testosterone replacement therapy in men with hypogonadism?"
    back: "Improve libido, muscle mass, strength, body hair growth, and bone mass\n\nTestosterone replacement aims to reverse the effects of testosterone deficiency on sexual function, body composition, and skeletal health."
    difficulty: easy
    tags: [endocrinology, testosterone, hypogonadism, treatment, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What is the goal of testosterone replacement therapy in men with hypogonadism?"
    back: "To improve libido, muscle mass, strength, body hair growth, and bone mass\n\nTestosterone replacement addresses the symptoms of androgen deficiency by supplementing endogenous testosterone production."
    difficulty: easy
    tags: [endocrinology, hypogonadism, testosterone, treatment, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the inhibitory effects of cortisol?"
    back: "Inhibits bone formation, stimulates bone resorption; inhibits fibroblasts causing collagen loss; suppresses inflammation impairing cell-mediated immunity; inhibits growth hormone and reproductive axes\n\nThese inhibitory effects are more pronounced with cortisol excess (Cushing's syndrome)."
    difficulty: easy
    tags: [Cortisol, Physiology, Endocrinology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the inhibitory effects of glucocorticoids?"
    back: "Inhibit bone formation, stimulate bone resorption; inhibit fibroblasts causing collagen loss; suppress inflammation impairing cell-mediated immunity; inhibit growth hormone and reproductive axes\n\nThese effects typically occur with cortisol excess (Cushing's syndrome)."
    difficulty: medium
    tags: [glucocorticoids, cortisol, endocrinology, physiology, toronto-notes, pages-0341-0342-0343-0344-0345-0346-0347-0348-0349-0350]
  - front: "What are the goals of testosterone replacement therapy in men with hypogonadism?"
    back: "Improve libido, muscle mass, strength, body hair growth, and bone mass\n\nTestosterone replacement addresses the symptoms of androgen deficiency to improve quality of life and prevent complications of hypogonadism."
    difficulty: easy
    tags: [endocrinology, hypogonadism, testosterone, treatment, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the goals and main formulations of testosterone replacement therapy in men with hypogonadism?"
    back: "Goals: improve libido, muscle mass, strength, body hair growth, and bone mass. Formulations: IM/SC injection, transdermal testosterone, or gel.\n\nTestosterone replacement addresses symptoms of hypogonadism but does not treat infertility and may worsen it."
    difficulty: easy
    tags: [endocrinology, hypogonadism, testosterone, treatment, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the goals of testosterone replacement therapy?"
    back: "Improve libido, muscle mass, strength, body hair growth, and bone mass\n\nTestosterone replacement addresses the symptoms of hypogonadism by restoring physiological testosterone levels."
    difficulty: easy
    tags: [endocrinology, hypogonadism, testosterone, treatment, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the goals and methods of testosterone replacement therapy?"
    back: "Goals: improve libido, muscle mass, strength, body hair growth, bone mass. Methods: IM/SC injection, transdermal testosterone or gel.\n\nTestosterone replacement is the primary treatment for symptomatic hypogonadism, with multiple delivery routes available including injections and transdermal preparations."
    difficulty: easy
    tags: [endocrinology, hypogonadism, testosterone, treatment, toronto-notes, pages-0361-0362-0363-0364-0365-0366-0367-0368-0369-0370]
  - front: "What are the rewards (benefits) of smoking cessation to discuss with patients?"
    back: "Improved health, save money, food tastes better, good example for children\n\nPersonal benefits like financial savings and health improvements are strong motivators."
    difficulty: easy
    tags: [smoking-cessation, motivational-interviewing, toronto-notes, pages-0391-0392-0393-0394-0395-0396-0397-0398-0399-0400]
  - front: "What vaccinations are recommended for diabetes patients?"
    back: "Influenza annually, pneumococcal vaccination\n\nDiabetes patients are at increased risk for infections and should receive recommended vaccinations."
    difficulty: easy
    tags: [endocrinology, diabetes, prevention, vaccination, toronto-notes, pages-0401-0402-0403-0404-0405-0406-0407-0408-0409-0410]
  - front: "What vaccines are recommended for diabetic patients?"
    back: "Influenza annually and pneumococcal vaccination\n\nDiabetic patients should receive annual influenza vaccination and pneumococcal vaccination."
    difficulty: easy
