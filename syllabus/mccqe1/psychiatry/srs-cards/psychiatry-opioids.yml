# Psychiatry Opioids (Psychiatry) - generated from srs-mccqe1
cards:
  - front: "What is the classic opioid overdose triad (RAM), and how is it managed acutely?"
    back: "RAM: Respiratory depression, Altered mental status (decreased LOC), Miosis (pinpoint pupils; exception: meperidine). Management: ABCs; IV glucose for hypoglycemia; naloxone (Narcan®) 0.4 mg up to 2 mg IV for diagnosis and treatment; may need intubation + naloxone drip up to >48 h with long-acting opioids. Caution: opioids have longer half-life than naloxone — observe ≥24 h.\n\nMeperidine causes mydriasis (not miosis) due to its anticholinergic properties — an important exception. Naloxone's short half-life (~60 min) means re-sedation can occur after reversal. The fentanyl-contaminated drug supply in Canada has dramatically increased overdose fatalities, making naloxone kit distribution a public health priority."
    difficulty: medium
    tags: [opioid overdose, naloxone, RAM, respiratory depression, miosis]
  - front: "What are the symptoms of opioid withdrawal and how is it managed?"
    back: "Symptoms: dysphoric mood, insomnia, drug craving, myalgias, nausea/vomiting, yawning, chills, lacrimation, rhinorrhea, pupillary dilation, piloerection, sweating, diarrhea, fever. Onset: 6–12 h (depending on opioid half-life); Duration: 5–10 days. Management: long-acting oral opioids (methadone, buprenorphine), α2-adrenergic agonists (clonidine for autonomic symptoms). Monitor with Clinical Opioid Withdrawal Scale (COWS).\n\nOpioid withdrawal is severely uncomfortable but not life-threatening (unlike alcohol/benzo withdrawal). A critical complication is loss of tolerance with overdose on relapse — patients who leave treatment are highly vulnerable. Complications also include miscarriage and premature labour."
    difficulty: medium
    tags: [opioid withdrawal, methadone, buprenorphine, clonidine, COWS]
  - front: "What is Suboxone® and why does it contain naloxone?"
    back: "Suboxone® is a buprenorphine/naloxone combination tablet for opioid use disorder maintenance. Naloxone is included to prevent injection abuse: when injected, naloxone precipitates opioid withdrawal and blocks buprenorphine's opioid effect. When taken sublingually (as prescribed), naloxone has negligible bioavailability and does not antagonize buprenorphine's effect. Also available as a monthly IM formulation (Sublocade).\n\nBuprenorphine is a partial opioid agonist/antagonist with a ceiling effect on respiratory depression, making it safer than methadone. The naloxone component serves as a deterrent to misuse. Methadone is a full opioid agonist and can cause QTc prolongation — baseline ECG screening is recommended."
    difficulty: medium
    tags: [Suboxone, buprenorphine, naloxone, opioid use disorder, maintenance]
  - front: "What are the evidence-based pharmacologic and psychological treatments for opioid use disorder?"
    back: "Pharmacologic (maintenance treatment): methadone (opioid agonist) — risk of QTc prolongation, ECG screening recommended; buprenorphine (partial agonist-antagonist); extended-release naltrexone injection (opioid antagonist — for motivated patients after detox). Psychological: addiction counselling, CBT, contingency management, motivational enhancement therapy (MET), 12-step programs (Narcotics Anonymous). Social: family education and support.\n\nMethadone and buprenorphine maintenance are associated with improved treatment retention, reduced illicit opioid use, decreased craving, and improved social function. Naltrexone injections are an emerging option. In Canada, carrying a naloxone kit is a life-saving public health strategy encouraged for patients and their close contacts."
    difficulty: medium
    tags: [opioid use disorder, methadone, buprenorphine, naltrexone, treatment]
