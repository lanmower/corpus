    back: "Unilateral dermatomal eruption with pain and paresthesia preceding rash by 3-5 days; vesicles, bullae, pustules on erythematous base\n\nThe dermatomal distribution and prodromal pain are hallmarks of shingles, helping distinguish it from other vesicular eruptions."
