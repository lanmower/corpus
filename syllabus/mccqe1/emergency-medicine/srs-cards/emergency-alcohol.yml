# Emergency Alcohol (EmergencyMedicine) - generated from srs-mccqe1
cards:
  - front: "What are the signs, symptoms, and management of acute alcohol intoxication in the emergency department?"
    back: "Signs/symptoms: slurred speech, CNS depression, disinhibition, incoordination, nystagmus, diplopia, dysarthria, ataxia; may progress to coma. Vitals: hypotension (peripheral vasodilation) with reflex tachycardia, hypothermia, hypoglycemia. Management: thiamine 100 mg PO/IM/IV, hourly neuro vitals, keep in ED until GCS 15 and can ambulate safely.\n\nAlcohol levels correlate poorly with clinical intoxication. If GCS fails to improve, consider ICH, polydrug overdose, metabolic diseases, or post-ictal state. CT head if signs of head injury."
    difficulty: easy
    tags: [alcohol, intoxication, emergency medicine, thiamine]
  - front: "What is the timeline of alcohol withdrawal syndromes after the last drink?"
    back: "6–8h: mild withdrawal (tremor, anxiety, agitation, autonomic hyperactivity, insomnia, N/V). 12–48h: alcoholic hallucinations (visual most common, auditory, tactile; vitals often normal). 8h–2d: withdrawal seizures (brief generalized tonic-clonic, may recur within hours). 3–5d (5% of untreated): delirium tremens (DT) — severely confused, fluctuating LOC, agitation, hallucinations, tachycardia, hyperpyrexia, diaphoresis; HIGH mortality.\n\nDT is the most dangerous complication of alcohol withdrawal. Treatment goal is early benzodiazepine administration to prevent progression to DT and seizures. CIWA protocol guides benzodiazepine dosing."
    difficulty: medium
    tags: [alcohol withdrawal, delirium tremens, CIWA, emergency medicine]
  - front: "What is the pharmacological treatment for alcohol withdrawal in the emergency department?"
    back: "First-line: diazepam 10–20 mg IV/PO or lorazepam 2–4 mg IV/PO q1h (preferred if known liver dysfunction) until two sequential CIWA scores <10. Thiamine 200 mg IM/IV then 50–100 mg/d. If no improvement with benzodiazepines: add phenobarbital. If hypomagnesemic: magnesium sulfate 4 g IV over 1–2h.\n\nLorazepam is preferred over diazepam in liver disease because it does not require hepatic metabolism to active metabolites. CIWA (Clinical Institute Withdrawal Assessment) scores guide dosing; no maximum dose for agitation control."
    difficulty: medium
    tags: [alcohol withdrawal, benzodiazepines, lorazepam, emergency medicine]
  - front: "What is Wernicke's encephalopathy and how is it prevented in the ED?"
    back: "Wernicke's encephalopathy: triad of oculomotor abnormalities (nystagmus, lateral gaze palsy, disconjugate gaze), cerebellar dysfunction, and global confusion — due to chronic thiamine (B1) deficiency. Prevention: thiamine given BEFORE dextrose in all malnourished, alcohol-dependent, or at-risk patients.\n\nGiving dextrose before thiamine can precipitate Wernicke's encephalopathy by exhausting remaining thiamine stores. Thiamine is deficient in malnourished, alcohol use disorder, anorexia, and malnutrition states."
    difficulty: easy
    tags: [Wernickes encephalopathy, thiamine, alcohol, emergency medicine]
  - front: "What are the cardiovascular complications of chronic alcohol use?"
    back: "Hypertension, cardiomyopathy (heart failure with SOB and edema), dysrhythmias ('holiday heart'): AFib (most common), atrial flutter, SVT, VTach (especially Torsades de Pointes if hypomagnesemic/hypokalemic).\n\n'Holiday heart' refers to alcohol-induced arrhythmias often triggered by binge drinking. Hypomagnesemia and hypokalemia from chronic alcohol use predispose to QT prolongation and Torsades de Pointes."
    difficulty: medium
    tags: [alcohol, cardiomyopathy, holiday heart, AFib, emergency medicine]
  - front: "What is alcoholic ketoacidosis and what is the treatment?"
    back: "Metabolic acidosis with positive urine ketones, low glucose, and normal osmolality. History: chronic alcohol intake with abrupt decrease/cessation, malnourished, abdominal pain with N/V. Treatment: thiamine 250–500 mg IM/IV BEFORE dextrose, then dextrose, volume repletion with NS or LR. Generally resolves in 12–24h.\n\nAlcoholic ketoacidosis results from starvation ketosis combined with alcohol-induced altered fat metabolism. Blood glucose is typically low to normal (unlike DKA). Normal osmolality distinguishes it from toxic alcohol ingestion."
    difficulty: medium
    tags: [alcoholic ketoacidosis, metabolic acidosis, alcohol, emergency medicine]
