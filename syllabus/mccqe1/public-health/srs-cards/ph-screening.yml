# Screening Guidelines & Preventive Care (PublicHealth) - generated from srs-mccqe1
cards:
  - front: "What is the Canadian Task Force on Preventive Health Care (CTFPHC) recommendation for colorectal cancer screening?"
    back: "Fecal immunochemical test (FIT) every 2 years for adults aged 50-74; flexible sigmoidoscopy every 10 years as alternative; colonoscopy for average-risk as screening (not endorsed by CTFPHC but provincial guidelines vary)\n\nCTFPHC CRC screening guidelines: FIT is non-invasive, cost-effective, and achieves high adherence. Positive FIT requires follow-up colonoscopy. High-risk individuals (IBD, family history, hereditary syndrome) require direct colonoscopy as per CAG/CCA guidelines."
    difficulty: easy
    tags: [colorectal cancer screening, FIT, CTFPHC, public health]
  - front: "What is the CTFPHC recommendation for breast cancer screening by age group?"
    back: "Women 50-74: routine screening mammography every 2-3 years (strong recommendation); Women 40-49: recommend against routine screening (moderate recommendation — number needed to screen vs. harms); Women 75+: insufficient evidence\n\nCTFPHC 2018 breast cancer guidelines: benefits of mammography (mortality reduction) must be weighed against harms (false positives, overdiagnosis, unnecessary biopsies). High-risk women (BRCA, family history): annual MRI + mammogram starting at 30-40 per Cancer Care Ontario/BC Cancer."
    difficulty: easy
    tags: [breast cancer screening, mammography, CTFPHC, 50-74, public health]
  - front: "What is the recommended cervical cancer screening strategy in Canada?"
    back: "Pap test (liquid-based cytology) every 3 years for women 21-69; HPV primary testing every 5 years increasingly adopted provincially — stop after age 69 with adequate prior screening or after total hysterectomy for benign indication\n\nCTFPHC and SOGC cervical cancer screening guidelines: HPV primary testing has higher sensitivity than cytology. Several provinces are transitioning to HPV testing with cytology reflex. Women with abnormal results require colposcopy per provincial algorithms. Pap testing begins at age 21 (not at first sexual activity as previously)."
    difficulty: easy
    tags: [cervical cancer screening, Pap test, HPV testing, CTFPHC, public health]
  - front: "What are the Canadian guidelines for lung cancer screening?"
    back: "Low-dose CT (LDCT) screening annually for high-risk individuals: age 50-74 years, smoking history ≥20 pack-years, current smoker OR quit within 15 years — Cancer Care Ontario/BC Cancer recommendations (CTFPHC recommends for 50-74 with ≥20 pack-years)\n\nNLST and NELSON trials showed LDCT reduces lung cancer mortality by 20-25% in high-risk populations. Harms: false positives (20-25% of screens), unnecessary procedures, radiation exposure. Smoking cessation counseling must accompany lung cancer screening programs. Pan-Canadian LDCT implementation is ongoing."
    difficulty: medium
    tags: [lung cancer screening, LDCT, CTFPHC, smoking, public health]
  - front: "What is the CTFPHC recommendation for prostate cancer screening with PSA?"
    back: "CTFPHC recommends AGAINST routine PSA screening for average-risk men due to overdiagnosis and treatment harms — individualized decision-making for men 55-69 after full informed discussion of benefits and harms\n\nPSA screening: reduces prostate cancer mortality by ~20% but leads to significant overdiagnosis and overtreatment (incontinence, sexual dysfunction from treatment of cancers that may never cause symptoms). CTFPHC weak recommendation against; Cancer Care Ontario: individualized decision-making for 50-70 years."
    difficulty: medium
    tags: [PSA screening, prostate cancer, CTFPHC, overdiagnosis, public health]
  - front: "What is the recommended screening approach for abdominal aortic aneurysm (AAA) in Canada?"
    back: "One-time ultrasound screening for men aged 65-80 years who have ever smoked (≥100 cigarettes lifetime) — CTFPHC recommendation; AAA: ≥3 cm; repair if ≥5.5 cm or rapid growth\n\nCTFPHC AAA screening: identifies men with undetected AAA before rupture. Annual surveillance for AAA 3-4.4 cm; q6 months for 4.5-5.4 cm. Endovascular repair (EVAR) or open repair for ≥5.5 cm. Mortality from ruptured AAA is 80-90%. No benefit shown in women or non-smokers."
    difficulty: easy
    tags: [AAA screening, abdominal aortic aneurysm, ultrasound, CTFPHC, public health]
  - front: "What is universal newborn hearing screening and when is it done?"
    back: "Otoacoustic emissions (OAE) or automated ABR (AABR) within 24-48 hours of birth; refer for diagnostic audiology if fail — target to identify and treat by 6 months\n\nCASLPA/CPS guidelines: congenital hearing loss occurs in 1-3/1000 live births; early identification (before 6 months) and intervention significantly improves language development. Universal newborn hearing screening (UNHS) is implemented in all Canadian provinces. CI (cochlear implant) eligibility assessed if profound bilateral SNHL."
    difficulty: easy
    tags: [newborn hearing screening, UNHS, OAE, hearing loss, public health]
  - front: "What is the recommendation for vitamin D supplementation in Canadian adults?"
    back: "Health Canada recommends 600 IU/day for adults 19-70; 800 IU/day for adults >70; Osteoporosis Canada recommends 800-2000 IU/day for adults at risk for osteoporosis — routine serum 25-OH vitamin D testing NOT recommended for the general population\n\nRoutine testing is not recommended (CTFPHC) due to imprecise lab tests and lack of evidence that supplementation based on testing improves outcomes. High-risk groups (institutionalized, dark skin, veiled women, malabsorption): supplement without testing. Northern latitude communities have very high rates of deficiency."
    difficulty: easy
    tags: [vitamin D supplementation, Health Canada, routine testing, osteoporosis, public health]
  - front: "What are the Diabetes Canada criteria for screening for type 2 diabetes?"
    back: "Screen all adults ≥40 years every 3 years with fasting plasma glucose or HbA1c; screen earlier if: BMI ≥25 + ≥1 risk factor (family history, high-risk ethnicity, HTN, dyslipidemia, prior GDM, CVD, prediabetes, polycystic ovarian syndrome)\n\nCANRISK questionnaire can identify high-risk individuals for targeted screening. High-risk ethnicities (South Asian, Black, East Asian, Indigenous, Hispanic, Arab) have higher T2DM prevalence at lower BMI. Early detection allows lifestyle intervention and pharmacotherapy to prevent complications."
    difficulty: easy
    tags: [T2DM screening, Diabetes Canada, CANRISK, high-risk populations, public health]
  - front: "What is the recommended approach to atrial fibrillation screening?"
    back: "CTFPHC (2020): recommends against routine ECG screening for AF in adults ≥65 without symptoms — pulse assessment by clinician is still standard of practice; wearable devices increasingly identifying paroxysmal AF\n\nCCS AF guidelines: opportunistic screening (pulse assessment, then ECG if irregular) at routine visits is a pragmatic approach. LOOP trial: insertable cardiac monitoring doubled AF detection in stroke survivors. The benefit of AF screening on stroke prevention outcomes is under investigation."
    difficulty: medium
    tags: [AF screening, atrial fibrillation, CTFPHC, ECG screening, public health]
  - front: "What are the hypertension screening recommendations in Canada?"
    back: "Blood pressure measurement at all appropriate clinical encounters for adults ≥18 years; if elevated, follow Hypertension Canada protocol for confirmation — no specific screening interval recommended as hypertension can develop at any time\n\nHypertension Canada guidelines: BP should be measured at every primary care visit. Opportunistic screening has been highly effective in Canada. AOBP (automated office BP) is the standard measurement method. Electronic alerts in EMR prompt BP measurement and follow-up."
    difficulty: easy
    tags: [hypertension screening, blood pressure, Hypertension Canada, AOBP, public health]
  - front: "What are the indications for chlamydia and gonorrhea screening in Canada?"
    back: "Annual screening for: all sexually active women ≤25 years, older women with risk factors (new/multiple partners), all MSM, and individuals with prior STI — PHAC STI guidelines\n\nPHAC recommends screening as part of sexual health history at every clinical encounter for at-risk individuals. Most chlamydia infections are asymptomatic. Universal antenatal chlamydia screening at first prenatal visit. 3-site (pharyngeal, rectal, urogenital) testing for MSM."
    difficulty: easy
    tags: [chlamydia screening, gonorrhea screening, STI, PHAC, public health]
  - front: "What is osteoporosis screening per Osteoporosis Canada guidelines?"
    back: "DXA for: all women ≥65 and men ≥70; postmenopausal women and men 50-64 with risk factors (prior fragility fracture, steroid use, secondary causes of osteoporosis, FRAX risk ≥10% for major osteoporotic fracture)\n\nOsteoporosis Canada guidelines 2023: FRAX calculation to identify high-risk individuals before DXA. Bone turnover markers and vertebral fracture assessment (VFA) on DXA. Calcium and vitamin D supplementation for all patients at risk. Targeted screening is more cost-effective than universal screening."
    difficulty: easy
    tags: [osteoporosis screening, DXA, Osteoporosis Canada, FRAX, public health]
  - front: "What are the CTFPHC recommendations regarding alcohol and substance use screening?"
    back: "Brief alcohol screening (AUDIT-C) in primary care; SBIRT (Screening, Brief Intervention, and Referral to Treatment) for adults with harmful/hazardous alcohol or drug use — CTFPHC recommends screening adults for unhealthy alcohol use\n\nCTFPHC 2018 alcohol screening: 5-minute brief intervention after positive AUDIT screen can reduce alcohol consumption by 15-25%. Motivational interviewing approach. Harm reduction approach for other substance use. Opioid risk tool for opioid prescribing."
    difficulty: easy
    tags: [alcohol screening, AUDIT, SBIRT, CTFPHC, brief intervention, public health]
  - front: "What is the recommended schedule for Pap testing vs. HPV primary testing?"
    back: "Pap test: every 3 years (age 21-69); HPV primary testing: every 5 years (being phased in provincially); HPV+ with negative cytology: re-test in 12 months; HPV+ with abnormal cytology: colposcopy\n\nOntario and BC are implementing HPV primary testing as standard. HPV16/18 positive on primary test → immediate colposcopy. Other high-risk HPV types positive with abnormal cytology → colposcopy. Advantages of HPV testing: higher sensitivity (90%), longer intervals, earlier detection of CIN."
    difficulty: medium
    tags: [HPV primary testing, Pap test, colposcopy, cervical cancer, public health]
  - front: "What cancer screenings does CTFPHC recommend?"
    back: "Breast: mammography q2-3y ages 50-74. Cervical: Pap q3y ages 25-69. CRC: FIT q2y ages 50-74. Lung: low-dose CT annually for high-risk smokers 55-74\n\nCTFPHC does NOT recommend routine PSA screening (informed discussion). Cervical: some provinces transitioning to HPV primary. No screening recommended for ovarian, pancreatic, or thyroid."
    difficulty: medium
    tags: [screening, CTFPHC]
  - front: "What are the CTFPHC recommendations for breast cancer screening?"
    back: "Age 50-74: mammography q2-3 years. Age 40-49: do NOT routinely screen. No CBE or BSE for screening\n\nCTFPHC 2018 differs from USPSTF (now recommends from 40). Many provinces still offer from 40. High-risk (BRCA, chest radiation) follow different protocol with MRI. Informed decision-making emphasized."
    difficulty: hard
    tags: [breast cancer, screening, CTFPHC, mammography]
  - front: "What are the CTFPHC recommendations for cervical cancer screening?"
    back: "Age 25-69: Pap q3 years. Do not screen <25 or >69 (if adequate prior screening). HPV co-testing not currently recommended by CTFPHC\n\nCTFPHC 2013. Starts at 25 (vs US at 21). BC and Ontario transitioning to HPV-primary q5 years. Stop at 69 if 3 consecutive negatives in prior 10 years. Abnormal Pap follow-up per colposcopy guidelines."
    difficulty: medium
    tags: [cervical cancer, Pap smear, CTFPHC]
  - front: "What are the CTFPHC recommendations for colorectal cancer screening?"
    back: "Age 50-74: FIT q2 years or flexible sigmoidoscopy q10 years. Colonoscopy NOT recommended as primary screen for average risk\n\nFIT replaced guaiac FOBT (better sensitivity, no dietary restrictions). Positive FIT requires diagnostic colonoscopy. High-risk (FHx, IBD, polyposis) screened earlier with colonoscopy. CTFPHC 2016."
    difficulty: medium
    tags: [colorectal cancer, FIT, screening]
  - front: "What are the CTFPHC recommendations for lung cancer screening?"
    back: "Age 55-74 with 30+ pack-year history (current or quit <15y): annual low-dose CT. Do not screen never-smokers or <30 pack-years\n\nNLST/NELSON trials: 20% mortality reduction with LDCT. Provincial programs in ON, BC, AB. ~25% false positive rate. Always pair with smoking cessation counseling."
    difficulty: medium
    tags: [lung cancer, LDCT, screening]
  - front: "What is the CTFPHC position on PSA screening for prostate cancer?"
    back: "Recommend AGAINST routine PSA screening for all ages (2014). Shared decision-making if patient requests. CUA supports discussion for men 50-70\n\nCTFPHC: harms outweigh benefits (overdiagnosis, overtreatment, biopsy complications). CUA differs. MRI-targeted biopsy has improved accuracy since guideline. High-risk: Black men, FHx - discuss from age 45."
    difficulty: hard
    tags: [prostate cancer, PSA, CTFPHC]
  - front: "Define sensitivity, specificity, PPV, and NPV with their formulas."
    back: "Sn=TP/(TP+FN). Sp=TN/(TN+FP). PPV=TP/(TP+FP). NPV=TN/(TN+FN). Sn/Sp independent of prevalence; PPV/NPV vary with prevalence\n\nSnNOut: sensitive test negative rules OUT. SpPIn: specific test positive rules IN. Screening tests prioritize sensitivity. Confirmatory tests prioritize specificity. PPV increases with prevalence."
    difficulty: medium
    tags: [sensitivity, specificity, PPV, NPV]
  - front: "How are NNT and NNS calculated and interpreted?"
    back: "NNT = 1/ARR. NNS = 1/(prevalence x sensitivity x treatment efficacy). Lower = more effective. NNS for mammography 50-69: ~720 over 11 years\n\nNNT communicates treatment benefit magnitude. NNS helps evaluate screening program utility. Both useful for shared decision-making with patients. ARR = absolute risk reduction = control event rate - experimental event rate."
    difficulty: medium
    tags: [NNT, NNS, biostatistics]
  - front: "What are the Wilson-Jungner criteria for evaluating screening programs?"
    back: "10 criteria: important problem, accepted treatment, facilities available, recognizable latent stage, suitable test, acceptable to population, natural history understood, agreed treatment policy, cost-effective, ongoing process\n\n1968 WHO criteria remain gold standard. Modern additions: program must reduce mortality (not just detect), benefits must outweigh harms (overdiagnosis, false positives). CTFPHC applies these principles to all recommendations."
    difficulty: medium
    tags: [Wilson-Jungner, screening criteria]
  - front: "What types of bias affect screening program evaluation?"
    back: "Lead-time: earlier detection without survival change. Length-time: detecting slow-growing tumors preferentially. Selection: healthy volunteers screened. Overdiagnosis: detecting non-harmful disease\n\nLead-time bias makes screened patients APPEAR to live longer. Mortality reduction (not survival) is the correct outcome. Overdiagnosis particularly relevant in prostate and thyroid screening."
    difficulty: hard
    tags: [bias, screening, lead-time]
  - front: "What are the Canadian diabetes screening recommendations?"
    back: "Screen q3-5y with FPG or A1c from age 40, earlier if high-risk (BMI>25, Indigenous, South Asian, African descent, GDM, HTN). Use CANRISK questionnaire\n\nDiabetes Canada 2018 CPG. Diagnostic: FPG>=7.0, 2h-OGTT>=11.1, A1c>=6.5%, random>=11.1+symptoms. Need 2 abnormal tests if asymptomatic. CANRISK is Canadian-specific risk calculator."
    difficulty: medium
    tags: [diabetes, screening, CANRISK]
  - front: "What are the CTFPHC recommendations for AAA screening?"
    back: "One-time abdominal US for men 65-80 who have ever smoked. Do not screen women or never-smokers\n\nAAA screening reduces AAA mortality ~50%. AAA >=3.0cm. Management by size: <4cm q3y surveillance, 4-4.4 annually, 4.5-5.4 q6mo, >=5.5cm surgical repair. Emergency repair for symptomatic/ruptured at any size."
    difficulty: medium
    tags: [AAA, screening, ultrasound]
  - front: "What is the CTFPHC position on depression screening in primary care?"
    back: "Recommend AGAINST routine screening for depression in adults (2013). Be alert to symptoms during encounters (case-finding approach)\n\nControversial. Insufficient evidence screening improves outcomes without integrated treatment program. PHQ-2 then PHQ-9 commonly used tools. Be vigilant in high-risk: chronic illness, postpartum, chronic pain."
    difficulty: medium
    tags: [depression, screening, PHQ-9]
  - front: "What prenatal screening tests are offered in Canada by trimester?"
    back: "1st trimester (11-14wk): NT US + PAPP-A + free beta-hCG. 2nd (15-20wk): quad screen. NIPT (cell-free DNA) increasingly offered as primary screen\n\nNIPT >99% sensitivity for trisomy 21, positive still needs amnio/CVS confirmation. Enhanced FTS detects ~85% T21. Coverage varies by province. NIPT cost-covered in most provinces for high-risk or as contingent screen."
    difficulty: medium
    tags: [prenatal screening, NIPT, trisomy 21]
  - front: "What newborn screening tests are performed across Canada?"
    back: "Blood spot (heel prick 24-48h): metabolic/endocrine/hemoglobin disorders (PKU, hypothyroidism, CF, sickle cell). Universal hearing screen (OAE/ABR). CCHD screen (pulse ox)\n\nNumber of conditions varies by province (Ontario ~30). Screening not diagnostic - positives need confirmatory testing. Too early (<24h) increases false positives for PKU. Critical to treat congenital hypothyroidism within 2 weeks."
    difficulty: medium
    tags: [newborn screening, PKU]
  - front: "How are ROC curves and likelihood ratios used to evaluate diagnostic tests?"
    back: "ROC: AUC 1.0=perfect, 0.5=useless. LR+ = Sn/(1-Sp); >10 is strong. LR- = (1-Sn)/Sp; <0.1 is strong. LRs are prevalence-independent\n\nLRs applied to pre-test probability via Fagan nomogram give post-test probability. ROC curves compare tests and select optimal cut-offs. AUC >0.9 excellent, 0.7-0.9 good, 0.5-0.7 poor."
    difficulty: hard
    tags: [ROC, likelihood ratio, diagnostics]
  - front: "What is the recommended shingles vaccination in Canada and who should receive it?"
    back: "Shingrix® (recombinant zoster vaccine) is preferred for adults ≥50 years. Zostavax® (live zoster vaccine) can also be used in adults ≥60 years.\n\nShingrix® is preferred over Zostavax® due to higher efficacy. Oral antivirals (famciclovir, valacyclovir, or acyclovir) for 7 days must be initiated within 72 hours of rash onset to be of benefit."
    difficulty: easy
    tags: [shingles, herpes zoster, Shingrix, vaccine, prevention]
  - front: "Who should be screened for dyslipidemia according to Canadian guidelines?"
    back: "Screen men and women ≥40 years or post-menopausal women. Screen at any age if: DM, current smoking or COPD, HTN (sBP >140 or dBP >90), obesity (BMI ≥30), family history of premature CVD or dyslipidemia, clinical signs of hyperlipidemia (xanthelasma, xanthoma, arcus cornealis), AAA, atherosclerosis, inflammatory disease (RA, SLE, psoriasis, IBD), HIV on HAART, CKD (eGFR <60), erectile dysfunction, high-risk ethnicity (South Asian, Indigenous).\n\nDyslipidemia screening components include history and physical, lipid panel (total cholesterol, LDL-C, HDL-C, TG), non-HDL cholesterol, BG, eGFR. Optional: urine ACR, ApoB. ApoB reflects total atherogenic particle count. Lp(a) should be measured once in a lifetime."
    difficulty: easy
    tags: [dyslipidemia, screening, Canadian guidelines, cardiovascular risk]
  - front: "What is the Canadian Task Force on Preventive Health Care (CTFPHC) recommendation for breast cancer screening with mammography?"
    back: "Ages 50-74: screening mammography every 2-3 years (conditional recommendation; very low certainty evidence). Ages 40-49: recommend NOT screening with mammography (conditional recommendation; low certainty evidence). Do NOT recommend clinical breast exams, breast self-examination, MRI, tomosynthesis, or U/S in average-risk women.\n\nThe 2018 CTFPHC recommendations are more conservative than some US guidelines and reflect a harm-benefit analysis: screening in younger women (40-49) carries higher false positive rates and unnecessary biopsies relative to benefit. High-risk women (e.g., BRCA mutation) should follow separate protocols with annual mammography + MRI starting at age 30-60."
    difficulty: medium
    tags: [breast cancer, screening, mammography, CTFPHC, preventive health, periodic health exam]
  - front: "What are the Canadian lung cancer screening guidelines (CTFPHC 2016)?"
    back: "Annual LDCT (low-dose CT) for adults ages 55-74 with ≥30 pack-year smoking history who currently smoke or quit <15 years ago, for up to 3 consecutive screenings. Must be done in settings with expertise in early diagnosis/treatment. Chest X-ray (with or without sputum cytology) should NOT be used for lung cancer screening. All other adults should NOT be screened with LDCT.\n\nLung cancer LDCT screening is recommended for high-risk smokers and former smokers because the benefit of early detection outweighs the risks of radiation and false positives. The Ontario Lung Screening Program uses slightly different criteria: ages 55-74 who have smoked every day for at least 20 years."
    difficulty: medium
    tags: [lung cancer, LDCT, screening, smoking, CTFPHC, preventive health]
  - front: "What are the periodic health examination (PHE) recommendations for abdominal aortic aneurysm (AAA) screening?"
    back: "One-time screening ultrasound for abdominal aortic aneurysm in men aged 65-80 years (Grade B recommendation).\n\nAAA screening with ultrasound in older men is recommended because AAA is predominantly a disease of older males with significant mortality if ruptured, and ultrasound is a safe, effective screening tool. Women and younger men are not routinely screened as the prevalence is lower and benefit does not outweigh harm."
    difficulty: easy
    tags: [AAA, abdominal aortic aneurysm, screening, ultrasound, men, periodic health exam]
  - front: "What did the HOPE-3 trial demonstrate about statin use in intermediate-risk patients without CV disease?"
    back: "HOPE-3 (2016): Rosuvastatin 10 mg/day in 12,705 intermediate-risk patients (no existing CV disease) reduced LDL by 26.5% and reduced the incidence of vascular events (3.7% vs. 4.8% placebo). Conclusion: Statins benefit intermediate-risk populations without established CV disease.\n\nHOPE-3 supports the use of statins for primary prevention in intermediate-risk populations. This aligns with Canadian Cardiovascular Society lipid management guidelines, which recommend risk-stratified statin therapy."
    difficulty: medium
    tags: [HOPE-3, rosuvastatin, statin, primary prevention, dyslipidemia]
  - front: "A 28-year-old woman is found to have LSIL on Pap smear with positive HPV. What is the appropriate next step in management per Canadian guidelines?"
    back: "For women ≥25 years with LSIL and HPV positive: follow-up colposcopy with cytology and HPV test (if ≥30 years) in 1 year. For women <25 years with cytology LSIL/ASCUS/normal: annual Paps by primary care provider × 3 years, followed by return to normal screening.\n\nMost LSIL (CIN I) lesions regress spontaneously, especially in younger women. The risk-based approach for women ≥25 with HPV-positive LSIL warrants colposcopy, while HPV-negative LSIL returns to routine 3-year screening. The Ontario Cervical Screening Program (January 2022) guidelines form the basis for Canadian cervical screening recommendations."
    difficulty: hard
    tags: [LSIL, CIN 1, HPV, cervical screening, Canada]
