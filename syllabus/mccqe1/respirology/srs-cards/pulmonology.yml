# Pulmonology (Respirology) - generated from srs-mccqe1
cards:
  - front: "What is the approach to a solitary pulmonary nodule?"
    back: "Compare with prior CXR. CT characteristics favoring benign: <6mm, smooth borders, calcified (diffuse/central/laminated/popcorn), stable >2 years. Favoring malignant: >8mm (especially >3cm), spiculated borders, doubling time 20-400 days. PET scan to narrow differential. Biopsy if indeterminate.\n\n70% of solitary pulmonary nodules are benign. Most common benign cause is infectious granuloma. Most common malignant cause is bronchogenic carcinoma. Hamartomas show pathognomonic 'popcorn' calcification."
    difficulty: medium
    tags: [pulmonology, oncology, radiology, pulmonary nodule]
