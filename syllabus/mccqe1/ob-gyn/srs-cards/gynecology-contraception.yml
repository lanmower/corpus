# Gynecology Contraception (ObGyn) - generated from srs-mccqe1
cards:
  - front: "What is the mechanism of action of the copper IUD as a contraceptive?"
    back: "The copper IUD causes a mild foreign body reaction in the endometrium that is toxic to sperm and alters sperm motility.\n\nThe copper IUD (Nova-T) does not release hormones; instead, copper ions create a hostile environment for sperm. It can last up to 5 years and is also used for disorders of menstruation. Unlike hormonal IUDs, it does not suppress ovulation."
    difficulty: easy
    tags: [gynecology, contraception, IUD, copper, mechanism]
  - front: "How does the progesterone-releasing IUD (Mirena/Kyleena) work?"
    back: "It causes decidualization of the endometrium and thickening of cervical mucus, and may suppress ovulation.\n\nThe levonorgestrel-releasing IUD (Mirena, Kyleena) primarily acts locally on the endometrium and cervical mucus. Ovulation suppression is a variable and incomplete effect. Contraceptive effects last up to 5 years (Mirena) or 3 years (Kyleena). It is also used for disorders of menstruation."
    difficulty: easy
    tags: [gynecology, contraception, IUD, progesterone, levonorgestrel]
