  - front: "Why are symptoms usually absent in hypertension?"
    back: "Hypertension is typically asymptomatic because there are no specific symptoms; patients may have an occipital headache upon awakening or no symptoms at all until organ damage occurs\n\nThis is why hypertension is called the 'silent killer' and regular screening is essential."
