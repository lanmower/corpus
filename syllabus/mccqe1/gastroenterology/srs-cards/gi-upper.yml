  - front: "What is the recommended surveillance for Barrett's esophagus without dysplasia?"
    back: "Surveillance gastroscopy every 3-5 years\n\nNon-dysplastic Barrett's requires periodic surveillance, though the exact interval depends on segment length and other risk factors."
    difficulty: medium
