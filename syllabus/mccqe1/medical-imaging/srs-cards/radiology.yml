# Radiology (Medical Imaging) - generated from srs-mccqe1
cards:
  - front: "What is the '3,6,9 rule' for bowel dilation on CT?"
    back: "Maximum normal diameter: small bowel 3 cm, large bowel 6 cm, cecum 9 cm.\n\nThis rule helps determine when bowel is dilated on CT and can also help distinguish small from large bowel. Cecum >9 cm raises concern for impending perforation (e.g. in Ogilvie's syndrome)."
    difficulty: easy
    tags: [radiology, abdominal imaging, bowel obstruction]
  - front: "What is the 'coffee bean' sign on abdominal X-ray?"
    back: "Massively dilated sigmoid projecting to the right or mid-upper abdomen, seen in sigmoid volvulus.\n\nSigmoid volvulus is the most common type of volvulus. The twisted sigmoid loop appears as a large coffee-bean-shaped density. Cecal volvulus produces the 'bird's beak' sign instead."
    difficulty: easy
    tags: [radiology, abdominal X-ray, volvulus]
  - front: "How do you differentiate biliary air from portal venous air on abdominal X-ray?"
    back: "Biliary air is most prominent centrally over the liver; portal venous air is most prominent peripherally (air follows the flow).\n\nThe mnemonic 'go with the flow' reflects that air follows the direction of bile flow (centrifugal) or portal venous flow (centripetal to peripheral). Portal venous air is more ominous, often indicating bowel ischemia/infarction."
    difficulty: medium
    tags: [radiology, abdominal X-ray]
  - front: "What is Rigler's sign on abdominal X-ray?"
    back: "Visualization of both the inner and outer bowel wall due to free intraperitoneal air (pneumoperitoneum).\n\nNormally only the inner (mucosal) side of the bowel wall is outlined by intraluminal gas. When free air is present in the peritoneal cavity, both sides become visible. Other signs of pneumoperitoneum include the football sign and air under the diaphragm on upright film."
    difficulty: medium
    tags: [radiology, abdominal X-ray, pneumoperitoneum]
  - front: "What is the best initial imaging modality for acute cholecystitis?"
    back: "Ultrasound (U/S), which has the best sensitivity and specificity. HIDA scan can help diagnose acalculous or chronic cholecystitis when U/S is equivocal.\n\nThe most sensitive U/S findings are gallstones and positive sonographic Murphy's sign. Secondary findings include gallbladder wall thickening >3 mm, dilated gallbladder, and pericholecystic fluid."
    difficulty: easy
    tags: [radiology, hepatobiliary, cholecystitis]
  - front: "What are the CT findings of acute appendicitis?"
    back: "Appendix >6 mm outer diameter, enhancement of appendiceal wall, adjacent inflammatory fat stranding, and appendicolith.\n\nCT has sensitivity of 0.94 and specificity of 0.95 for appendicitis in adults. U/S findings include a non-compressible, thick-walled, dilated fluid-filled appendix. U/S is preferred in children and pregnant women."
    difficulty: easy
    tags: [radiology, appendicitis, CT]
  - front: "What is the Bosniak classification used for?"
    back: "Classifying cystic renal masses. Class I-II are benign, IIF should be followed, III-IV are suspicious for malignancy requiring workup.\n\nClass I is a simple cyst with thin wall and no septation. Class IV has soft tissue enhancement with contrast (>10 HU increase) and areas of necrosis. This classification guides management from observation to surgical intervention."
    difficulty: medium
    tags: [radiology, renal imaging, Bosniak classification]
  - front: "What is the best imaging modality for suspected multiple sclerosis?"
    back: "MRI, which has >90% sensitivity but low specificity (71-74%).\n\nCharacteristic MS lesions include juxtacortical, periventricular, infratentorial, and spinal cord locations. 'Dawson's fingers' are perivenular demyelination regions radiating into the deep periventricular white matter. Plaques are hyperintense on T2 and hypointense on T1."
    difficulty: easy
    tags: [radiology, neuroradiology, multiple sclerosis]
  - front: "What are the danger signs on head CT?"
    back: "Space-occupying process, hemorrhage, edema, mass effect, midline shift, uncal and tonsillar herniation, loss of grey-white matter differentiation, and hydrocephalus.\n\nCT is often the first-line imaging for most neuropathology due to speed, availability, and lower cost. MRI provides better characterization but CT is preferred for acute trauma and suspected hemorrhage."
    difficulty: easy
    tags: [radiology, neuroradiology, head CT]
  - front: "What is the appearance of an epidural hematoma vs. subdural hematoma on CT?"
    back: "Epidural: lenticular (lens-shaped) hyperdensity limited by suture lines. Subdural: crescentic hyperdensity crossing suture lines.\n\nEpidural hematomas are usually from ruptured middle meningeal artery after temporal bone fracture. They are limited by suture lines because the dura is firmly attached at sutures. Subdural hematomas are from ruptured bridging veins and spread freely along the subdural space."
    difficulty: easy
    tags: [radiology, neuroradiology, intracranial hemorrhage]
  - front: "What are the BI-RADS categories and their management?"
    back: "0: incomplete (more imaging); 1: negative (routine screening); 2: benign (routine); 3: probably benign (<2% malignancy, 6-mo follow-up); 4: suspicious (biopsy); 5: highly suspicious ≥95% (biopsy); 6: confirmed malignancy (definitive therapy).\n\nBI-RADS standardizes mammographic reporting. Category 4 is subdivided into 4A (low suspicion, 3-10%), 4B (moderate, 10-50%), and 4C (high, 51-94%). All category 4 and 5 lesions require biopsy."
    difficulty: medium
    tags: [radiology, breast imaging, BI-RADS]
  - front: "What does DEXA measure and what T-scores define osteopenia and osteoporosis?"
    back: "DEXA measures bone mineral density. Osteopenia: T-score between -1 and -2.5. Osteoporosis: T-score ≤ -2.5.\n\nT-score is the number of standard deviations from the young adult mean. Z-score compares to age-matched mean and helps diagnose secondary osteoporosis. DEXA is the gold standard, typically measured at hip and lumbar spine."
    difficulty: easy
    tags: [radiology, bone density, osteoporosis]
  - front: "What distinguishes aggressive from non-aggressive bone lesions on X-ray?"
    back: "Aggressive: wide zone of transition, acute periosteal reaction (Codman's triangle, sunburst, onion-skin), soft tissue mass, cortical destruction. Non-aggressive: narrow zone of transition, sharp borders, no soft tissue mass.\n\nThe zone of transition between lesion and normal bone is the single most important feature. A wide zone suggests rapid growth (malignancy). Codman's triangle is a hallmark of aggressive periosteal reaction seen in osteosarcoma and Ewing sarcoma."
    difficulty: medium
    tags: [radiology, bone tumors, MSK imaging]
  - front: "What is the Looser zone (pseudofracture) and what condition does it indicate?"
    back: "Thin transverse radiolucent lines running perpendicular to the bone cortex, seen bilaterally and symmetrically in femoral necks, shafts, and pubic/ischial rami. Pathognomonic for osteomalacia.\n\nOsteomalacia results from inadequate mineralization of bone tissue due to vitamin D, calcium, or phosphate deficiency. Unlike osteoporosis (decreased bone mass), osteomalacia features 'soft bones.' Gold standard diagnosis is iliac crest bone biopsy."
    difficulty: medium
    tags: [radiology, metabolic bone disease, osteomalacia]
  - front: "What is the 'salt and pepper' skull appearance associated with?"
    back: "Hyperparathyroidism. It results from subperiosteal and tuft bone resorption throughout the skull.\n\nThe most common cause is renal failure (secondary hyperparathyroidism). Other skeletal findings include subperiosteal resorption in the hands, chondrocalcinosis, 'rugger jersey spine' (band-like osteosclerosis at vertebral margins), and brown tumors (osteoclastomas)."
    difficulty: medium
    tags: [radiology, hyperparathyroidism, metabolic bone disease]
  - front: "What are the main indications for breast MRI?"
    back: "High-risk screening (BRCA1/2 carriers, lifetime risk >25%, prior chest radiation before age 30), evaluation of occult primary with axillary metastases, suspected implant rupture, and evaluation of diagnosed breast cancer (margins, recurrence, chemo response).\n\nBreast MRI has 95-100% sensitivity for invasive cancer but variable specificity (37-97%). For diagnosis, it is used only after mammography and U/S. U/S is first-line in women <30 and in lactating/pregnant women due to dense breast tissue limiting mammographic sensitivity."
    difficulty: medium
    tags: [radiology, breast imaging, MRI]
